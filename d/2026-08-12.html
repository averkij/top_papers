    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.10720', 'title': 'Ex-Omni-2D: Expressive Omni-Modal Dialogue Models with Native Visual Presence', 'url': 'https://huggingface.co/papers/2608.10720', 'abstract': 'Abstract Ex-Omni-2D is an omni-modal dialogue framework that produces coordinated text, speech, and video responses via a visual thought plan and a distilled streaming video generator.  Generated by thinkingmachines/Inkling-Small Omni-modal dialogue models can understand multimodal inputs and synthesize spoken replies, yet their responses remain visually disembodied. We introduce Ex-Omni-2D, an omni-modal dialogue framework that generates a coordinated response comprising text, personalized speech, and reference-conditioned video. Given a multimodal query, reference image, and reference audio, the model predicts a structured Visual Thought Plan (VTP) describing scene, emotion, and motion, followed by response text and native multi-codebook speech units. These units form a shared acoustic-temporal interface: they are decoded into speech and aligned online with video frames. This interface enables the response and avatar pathways to be learned from heterogeneous speech, dialogue, and avatar-video data, avoiding the need for large-scale query--text--speech--video supervision. A full-sequence Video Generator serves as the primary Teacher. For efficient incremental generation, we further distill it into a few-step block-causal Streaming Student whose Prefix Streaming mechanism carries a clean latent across consecutive chunks to reduce cumulative late-chunk degradation. With four-step inference, the complete four-GPU pipeline achieves an end-to-end RTF of 1.293 at 400times720/720times400, providing a practical quality--efficiency operating point.', 'score': 5, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '1b18a18ed7319917', 'authors': ['Haoyu Zhang', 'Zhipeng Li', 'Xiaoying Tang', 'Tianshu Yu', 'Yiwen Guo'], 'affiliations': ['Independent Researcher', 'LIGHTSPEED', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2608.10720.jpg', 'data': {'categories': ['#architecture', '#training', '#multimodal', '#audio', '#video', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Мультимодальный диалог с синхронизированным видео, речью и текстом', 'desc': 'Ex-Omni-2D — это мультимодальная система для диалога, которая генерирует координированные текстовые, голосовые и видео ответы на основе плана визуальных мыслей. Модель принимает мультимодальный запрос, эталонное изображение и эталонный аудиофайл, а затем предсказывает структурированный план, описывающий сцену, эмоции и движения. Система избегает необходимости в больших парах размеченных данных (запрос-текст-речь-видео), используя общий акустико-временной интерфейс и обучаясь на разнородных данных речи, диалога и видео с аватарами. Для эффективной потоковой генерации полная модель дистиллируется в более компактный ученик с механизмом Prefix Streaming, достигая практически приемлемого соотношения качества и скорости вычислений.'}, 'en': {'title': 'Seamless Multimodal Dialogue: Text, Speech, and Video in Harmony', 'desc': "Ex-Omni-2D is a novel omni-modal dialogue framework that integrates text, speech, and video responses through a structured Visual Thought Plan (VTP). This model processes multimodal inputs, including images and audio, to generate coordinated outputs that are contextually relevant and visually engaging. By utilizing a shared acoustic-temporal interface, it aligns speech with video frames, allowing for seamless interaction without extensive supervision across different modalities. The framework's efficient design, featuring a Streaming Student for incremental generation, achieves a balance between quality and processing speed, making it suitable for real-time applications."}, 'zh': {'title': '全模态对话的协调响应生成', 'desc': 'Ex-Omni-2D是一个全模态对话框架，能够通过视觉思维计划和精简的流媒体视频生成器生成协调的文本、语音和视频响应。该模型可以理解多模态输入，并合成个性化的语音回复，同时生成的响应与视觉内容相结合。通过给定的多模态查询、参考图像和参考音频，模型预测一个结构化的视觉思维计划，描述场景、情感和动作。该框架通过共享的声学-时间接口，将语音和视频帧在线对齐，从而实现高效的响应生成。'}}}, {'id': 'https://huggingface.co/papers/2608.07645', 'title': 'Mendel Gödel Machine: Recursive Self-Improving Coding Agents via Comparative Evolution', 'url': 'https://huggingface.co/papers/2608.07645', 'abstract': "Abstract Mendel Gödel Machine improves self-improving coding agents by using multi-trajectory mutations and cross-lineage hybridization to accelerate convergence and boost performance.  Generated by thinkingmachines/Inkling-Small Self-improving coding agents that iteratively rewrite their own source code have demonstrated impressive performance on coding tasks. However, existing solutions generally derive self-modification from a single failure trajectory at a time, overlooking rich comparative signals available in the agent's expanding archive of past attempts. According to Mendelian principles of controlled inheritance, we introduce Mendel Gödel Machine (MGM). In addition to the general single-trajectory clonal mutation, MGM includes two new types of self-modification that better utilizes evidences accumulated: the reaction-norm mutation edits an agent based on its trajectories on multiple tasks simultaneously, and the cross-lineage hybridization edits an agent using the trajectory of a reference agent from another lineage on the same task. Under an additive fitness landscape model, we prove theoretically and demonstrate via controlled surrogate simulation that the new strategies facilitate a faster and better convergence over single-trajectory baselines. Experiments on SWE-bench and Polyglot confirm MGM's consistent improvement in performance, efficiency, and generalizability.", 'score': 5, 'issue_id': 2932, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': '6e69853c3562d07e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🧬', 'ru': {'title': 'Эволюционная гибридизация: ускорение самосовершенствования кодовых агентов через наследование знаний из множественных линий развития', 'desc': 'В статье предлагается Mendel Gödel Machine — улучшенная система для самосовершенствующихся агентов написания кода, которая использует данные из архива прошлых попыток вместо одной траектории ошибки. Метод включает две новые стратегии модификации: reaction-norm mutation, которая анализирует агента по его поведению на нескольких задачах одновременно, и cross-lineage hybridization, которая заимствует успешные решения из параллельных линий развития агентов. Теоретически доказано и экспериментально подтверждено, что эти подходы обеспечивают более быструю конвергенцию и лучшие результаты по сравнению с традиционными методами. Система показала значительные улучшения в производительности, эффективности и обобщаемости на тестовых наборах SWE-bench и Polyglot.'}, 'en': {'title': 'Accelerating Self-Improvement in Coding Agents with MGM', 'desc': 'The Mendel Gödel Machine (MGM) enhances self-improving coding agents by introducing innovative mutation strategies that leverage multiple past performance trajectories. Unlike traditional methods that focus on a single failure path, MGM employs reaction-norm mutations and cross-lineage hybridization to utilize comparative data from various tasks and agents. This approach accelerates the convergence of coding agents, leading to improved performance and efficiency. Experimental results on coding benchmarks demonstrate that MGM consistently outperforms existing single-trajectory methods, showcasing its potential for better generalization in coding tasks.'}, 'zh': {'title': 'Mendel Gödel 机器：加速自我改进的编码代理', 'desc': 'Mendel Gödel 机器通过多轨迹突变和跨谱系杂交来改进自我改进的编码代理，从而加速收敛并提升性能。现有的自我修改方法通常只关注单一失败轨迹，忽视了代理在过去尝试中积累的丰富比较信号。MGM引入了两种新的自我修改类型，分别是反应规范突变和跨谱系杂交，能够更好地利用这些证据。实验结果表明，MGM在性能、效率和泛化能力上均有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.11079', 'title': 'SkillZip: Evaluation-Free Skill Compression for Self-Evolving Agents by Discovering Reusable Structure', 'url': 'https://huggingface.co/papers/2608.11079', 'abstract': 'Abstract SkillZip compresses self-evolving agent skills by finding a minimal faithful structural explanation that shares repeated rules and procedures while preserving rare exceptions, without requiring evaluation rollouts.  Generated by thinkingmachines/Inkling-Small Self-evolving agents accumulate reusable skills by appending successful procedures and failure fixes. Over time, the same requirement is often restated in several branches, examples, and warnings, while common action sequences are copied rather than reused. The resulting skill becomes expensive to inject and difficult to maintain. Generic prompt compression is ill-suited to this setting because a skill is not a flat passage: its name and description define when it applies, its workflow controls execution, its tool and output contracts constrain validity, and rare exceptions may remain essential even when no sampled task activates them. Evaluation-guided compression can test these behaviors, but it introduces rollouts, cost, and dependence on the compression-time evaluation set. We present SkillZip, an evaluation-free method that compresses a skill by finding its shortest faithful structural explanation. The intuition is explain once, reference many: state a repeated rule once at the scope where it applies, factor a repeated action sequence into a shared procedure, and keep only the differences as explicit exceptions. We formalize this intuition as a typed minimum description-length objective over a skill contract and a residual, subject to a hard coverage constraint for every extracted trigger, workflow edge, tool requirement, obligation, and output field. The formulation provides simple sharing thresholds, preserves unique rare rules by construction, and supports efficient local updates. SkillZip has a one-shot mode with one structured extraction call and deterministic optimization, and a continual Zip-on-Write mode that integrates each self-evolution patch without replaying tasks or reparsing the full history. Through comprehensive experimental evaluations, we demonstrate the effectiveness and superiority of SkillZip in compression performance, generalizability, and cost overhead.', 'score': 2, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '52a6cdc892d5e1b3', 'authors': ['Xiaofan Bai', 'Hongqiang Lin', 'Chao Liu', 'Yantao Zhang', 'Xuan Jin', 'Xipeng Cao', 'Yuhong Li'], 'affiliations': ['Alibaba Group', 'Duke University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.11079.jpg', 'data': {'categories': [], 'emoji': '🗜️', 'ru': {'title': 'Умное сжатие навыков через структурное объяснение и переиспользование', 'desc': 'SkillZip — это метод сжатия навыков самоэволюционирующих агентов, который находит минимальное структурное объяснение, выделяя повторяющиеся правила и процедуры при сохранении редких исключений. Алгоритм использует принцип «объясни один раз, ссылайся много раз», факторизируя повторяющиеся последовательности действий в общие процедуры и храня только различия как явные исключения. Метод формализуется как задача минимизации длины описания с типизированными контрактами навыков и ограничениями покрытия, без требования вычисления откатов или оценочных рулаутов. SkillZip поддерживает как одноразовый режим с детерминированной оптимизацией, так и континуальный режим Zip-on-Write для интеграции самоэволюционных патчей без переигровки истории задач.'}, 'en': {'title': 'Efficient Skill Compression for Self-Evolving Agents', 'desc': 'SkillZip is a method designed to compress the skills of self-evolving agents by creating a concise structural explanation that retains essential rules while managing exceptions. It avoids the need for evaluation rollouts, which can be costly and time-consuming, by focusing on a minimal description that captures repeated actions and their contexts. The approach emphasizes the importance of defining when skills apply and how they should be executed, ensuring that unique exceptions are preserved. Through experiments, SkillZip has shown to outperform existing methods in terms of compression efficiency and adaptability, making it easier to maintain and update agent skills.'}, 'zh': {'title': 'SkillZip：高效压缩自我进化技能的创新方法', 'desc': 'SkillZip是一种压缩自我进化代理技能的方法，它通过找到最小的结构性解释来共享重复的规则和程序，同时保留稀有的例外情况，而无需评估回滚。该方法的核心思想是一次性解释，反复引用，即在适用的范围内只说明一次重复规则，将重复的动作序列提取为共享程序，并将差异保留为显式例外。SkillZip通过类型化的最小描述长度目标来实现这一点，确保每个提取的触发器、工作流边缘、工具要求等都得到覆盖。通过全面的实验评估，我们展示了SkillZip在压缩性能、可推广性和成本开销方面的有效性和优越性。'}}}, {'id': 'https://huggingface.co/papers/2608.10875', 'title': 'VibeLifeBench: Can Your Life Agent Be Proactive and Persistent in a Living World?', 'url': 'https://huggingface.co/papers/2608.10875', 'abstract': 'Abstract A new benchmark called VibeLifeBench evaluates long-horizon proactive agents across simulated multi-week everyday tasks, revealing that current frontier models perform poorly.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents are increasingly deployed as personal assistants. Existing evaluations, however, mostly use short, self-contained requests in static environments. Everyday life assistance is different. A task runs for weeks rather than minutes. The world keeps changing while the agent is not being prompted. Many constraints are never stated outright. An agent that merely answers the request in front of it will fail at such a task. What is needed instead is an agent that stays proactive and consistent. It decides on its own when to act, when to ask, and when to stay silent. It notices changes that nobody announced. It keeps one plan coherent from the first day to the last. No current benchmark measures this. We introduce VibeLifeBench, a benchmark of 200 long-horizon tasks across ten everyday-life domains. Each task is a scripted multi-week timeline in a simulated world of 22 mock services. The world advances on its own clock, and many of its changes are silent, so only an agent that re-inspects the world discovers them. Every task is graded by fine-grained, weighted checks that read only what the agent actually left behind, covering the end state, the timeliness of its actions, and whether it upheld the implicit constraints. We evaluate seven frontier models. All of them score low, which shows how far current agents are from assisting with real life. We will open-source all tasks, environments, and the evaluation framework.', 'score': 2, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'b5896b78c3db0cda', 'authors': ['Xiaohongshu Inc'], 'affiliations': ['Evolvent AI', 'Xiaohongshu Dots Studio'], 'pdf_title_img': 'assets/pdf/title_img/2608.10875.jpg', 'data': {'categories': ['#long_context', '#open_source', '#agents', '#benchmark'], 'emoji': '🏠', 'ru': {'title': 'Проактивные агенты для долгосрочной помощи в повседневной жизни', 'desc': 'Представлена новая бенчмарка VibeLifeBench для оценки долгосрочных проактивных агентов на основе LLM в симулированной среде повседневных задач, длящихся несколько недель. В отличие от существующих оценок с короткими статичными запросами, эта бенчмарка требует от агентов самостоятельно принимать решения о времени действий, замечать неявные изменения в окружении и поддерживать согласованность плана. Оценка включает 200 задач в десяти повседневных сферах с 22 имитируемыми сервисами, где мир развивается независимо и многие изменения остаются неозвученными. Результаты показывают, что все семь протестированных фронтир-моделей показывают низкие результаты, демонстрируя значительный разрыв между текущими LLM-агентами и требованиями реальной помощи в повседневной жизни.'}, 'en': {'title': 'VibeLifeBench: Redefining Agent Evaluation for Real-Life Tasks', 'desc': 'The paper introduces VibeLifeBench, a new benchmark designed to evaluate long-horizon proactive agents in simulated everyday tasks that span multiple weeks. Unlike traditional evaluations that focus on short, immediate requests, VibeLifeBench assesses how well agents can manage ongoing tasks in a dynamic environment where changes occur without explicit prompts. The benchmark consists of 200 tasks across ten domains, requiring agents to maintain coherence and adapt to silent changes over time. The evaluation reveals that current leading models perform poorly, highlighting the need for more advanced agents capable of proactive and consistent assistance in real-life scenarios.'}, 'zh': {'title': '评估智能体的长期任务能力', 'desc': '本文介绍了一种新的基准测试VibeLifeBench，用于评估在模拟的多周日常任务中表现的前瞻性智能体。现有的模型在这些长期任务中表现不佳，因为它们通常只处理短期请求，而日常生活中的任务往往需要持续的关注和主动性。VibeLifeBench包含200个跨越十个日常生活领域的长期任务，旨在测试智能体在动态环境中的适应能力和一致性。通过细致的评估标准，本文揭示了当前智能体在真实生活辅助方面的不足。'}}}, {'id': 'https://huggingface.co/papers/2608.10366', 'title': 'DSAgentBench: Can Agents Automate End-to-End Data-Science Workflows in Real Computer Environments?', 'url': 'https://huggingface.co/papers/2608.10366', 'abstract': 'Abstract DSAgentBench evaluates autonomous agents on complete, multi-tool data-science workflows in real computing environments and reveals major performance gaps.  Generated by thinkingmachines/Inkling-Small Real-world data science involves long-horizon workflows that span data wrangling, exploration, modeling, visualization, and validation, and require coordinated use of tools such as notebooks, IDEs, terminals, browsers, and databases within real operating environments. Yet existing benchmarks lack real-computer interaction and do not evaluate whether agents can execute complete end-to-end data-science workflows in realistic computing environments, failing to capture the multi-stage, multi-tool nature of data-science practice. We introduce DSAgentBench, the first benchmark to evaluate whether agents can automate full data-science workflows inside real computer environments. DSAgentBench contains 275 diverse tasks covering the entire data-science life-cycle, reflecting the complexity and tool coordination required in practice. Each task requires grounding decisions in intermediate outputs and coordinated tool use, and includes a deterministic evaluator that verifies analytical correctness, visual outputs, and model performance rather than code-only execution. Our extensive experiments with 15 closed- and open-source models show that even the strongest agent, Claude-4.6-Sonnet, achieves only 56.70% task success, while all open-source agents remain below 1%, frequently failing at tool orchestration, OS grounding, and multi-step reasoning. These results reveal a substantial capability gap between current agentic systems and real data-science workflows, positioning DSAgentBench as a foundation for developing grounded, verifiable, autonomous data-science agents. We release DSAgentBench at https://github.com/vis-nlp/DSAgentBench.', 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '86d1e457082f01ad', 'authors': ['Mizanur Rahman', 'Mohammed Saidul Islam', 'Ridwan Mahbub', 'Md Tahmid Rahman Laskar', 'Shafiq Joty', 'Enamul Hoque Prince'], 'affiliations': ['Nanyang Technological University', 'Salesforce AI Research', 'York University'], 'pdf_title_img': 'assets/pdf/title_img/2608.10366.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark'], 'emoji': '🔬', 'ru': {'title': 'Раскрытие пропасти между AI-агентами и реальными рабочими процессами анализа данных', 'desc': 'В статье представлен DSAgentBench — первый бенчмарк для оценки автономных агентов на полных рабочих процессах анализа данных в реальных вычислительных окружениях. Бенчмарк содержит 275 разнообразных задач, охватывающих весь жизненный цикл работы с данными, включая подготовку, исследование, моделирование и визуализацию. Авторы протестировали 15 различных LLM-моделей и обнаружили значительный разрыв в производительности: даже лучший агент (Claude-4.6-Sonnet) достигает только 56.70% успеха, тогда как open-source модели показывают результаты ниже 1%. Исследование выявляет критические проблемы современных агентов в координации инструментов, взаимодействии с операционной системой и многошаговом рассуждении.'}, 'en': {'title': 'Bridging the Gap: Evaluating Agents in Real Data-Science Workflows', 'desc': 'DSAgentBench is a new benchmark designed to evaluate autonomous agents on complete data-science workflows in real computing environments. It addresses the limitations of existing benchmarks that do not consider the multi-tool and multi-stage nature of data science tasks. The benchmark includes 275 diverse tasks that require agents to coordinate various tools and make decisions based on intermediate outputs. Results show that current agents struggle significantly, with the best performing model achieving only 56.70% success, highlighting a major gap in their capabilities compared to real-world data science practices.'}, 'zh': {'title': 'DSAgentBench：评估数据科学智能体的基准', 'desc': 'DSAgentBench是一个评估自主智能体在真实计算环境中执行完整数据科学工作流程的基准。它揭示了当前智能体在多工具协作和长时间工作流程中的性能差距。该基准包含275个多样化任务，涵盖数据科学生命周期的各个阶段，要求智能体在中间输出的基础上做出决策并协调使用工具。实验结果显示，即使是最强的智能体也仅能成功完成56.70%的任务，表明当前智能体系统与真实数据科学工作流程之间存在显著能力差距。'}}}, {'id': 'https://huggingface.co/papers/2608.10692', 'title': 'SPIEval: Evaluating Large Language Models as Mobile Assistants over Scattered Personal Information', 'url': 'https://huggingface.co/papers/2608.10692', 'abstract': 'Abstract SPIEval benchmarks mobile assistant LLMs on scattered personal data tasks, revealing major gaps in information retrieval and verification.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly deployed as mobile assistants, where a key challenge is leveraging personal information scattered across multiple applications (apps) to complete user instructions. However, due to the lack of dedicated benchmarks, their capabilities remain poorly understood. To address this gap, we introduce SPIEval, a human-curated benchmark grounded in five cognitive capabilities (i.e., reasoning, disambiguation, integration, preference inference, and multi-intent decomposition). SPIEval comprises 250 tasks spanning 4,335 personal records distributed across 10 apps and supports multi-turn interaction through 21 tools. Analysis shows that the benchmark exhibits diverse scenarios, challenging tasks, scattered information, controllable environments, and verifiable outcomes. We evaluate nine representative LLMs and find substantial room for improvement. The best-performing model, GPT-5.5 (xhigh), achieves only 57.3% accuracy, while the weakest achieves just 16.4%. Further analysis reveals that 79% of failures stem from inaccurate information localization, as LLMs often commit to plausible but incorrect information instead of continuing retrieval for verification. We also find that fewer than 2% of retrieval actions employ advanced search methods and observe substantial variation in search efficiency across models. These findings expose fundamental limitations of current LLM-based mobile assistants and motivate future research in this direction. Data and code are available at https://huggingface.co/datasets/Junjie-Ye/SPIEval.', 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '3d778712d4eccf13', 'authors': ['Junjie Ye', 'Zhuohui Sheng', 'Shaofan Liu', 'Yulun Zhu', 'Wenjie Fu', 'Dingwei Zhu', 'Ming Zhang', 'Yujiong Shen', 'Weichao Wang', 'Xin Zhao', 'Shihan Dou', 'Tao Gui', 'Qi Zhang', 'Xuanjing Huang', 'Pluto Zhou'], 'affiliations': ['Fudan University', 'Tencent Hunyuan Team'], 'pdf_title_img': 'assets/pdf/title_img/2608.10692.jpg', 'data': {'categories': [], 'emoji': '📱', 'ru': {'title': 'Персональные данные в мобильных ассистентах: где теряются языковые модели', 'desc': 'В статье представлен SPIEval — бенчмарк для оценки способностей больших языковых моделей (LLM) работать с персональными данными, разбросанными по различным приложениям на мобильных устройствах. Бенчмарк включает 250 задач, основанных на пяти когнитивных навыках: рассуждении, уточнении неоднозначности, интеграции информации, выводе предпочтений и декомпозиции многоцелевых запросов. Авторы оценили девять ведущих LLM и обнаружили значительный разрыв в производительности: лучшая модель достигает только 57,3% точности, а 79% ошибок связано с неправильной локализацией информации — модели выбирают правдоподобный, но неверный результат вместо продолжения поиска и верификации. Исследование выявляет фундаментальные ограничения текущих мобильных ассистентов на основе LLM и указывает на необходимость развития более эффективных методов поиска и верификации информации.'}, 'en': {'title': 'Bridging the Gaps in Mobile Assistant LLMs with SPIEval', 'desc': 'The paper introduces SPIEval, a benchmark designed to evaluate mobile assistant large language models (LLMs) on tasks involving scattered personal data. It focuses on five cognitive capabilities essential for effective information retrieval and verification across multiple applications. The evaluation of nine LLMs reveals significant performance gaps, with the best model achieving only 57.3% accuracy, primarily due to challenges in accurately localizing information. The findings highlight the need for improved retrieval methods and further research to enhance the capabilities of LLMs in handling personal data tasks.'}, 'zh': {'title': '提升移动助手的智能能力', 'desc': '本文介绍了SPIEval，这是一个针对移动助手大语言模型（LLMs）在处理分散个人数据任务时的基准测试。研究发现，当前的LLMs在信息检索和验证方面存在显著不足，尤其是在处理来自多个应用程序的信息时。SPIEval基于五种认知能力设计，包含250个任务和4335条个人记录，支持多轮交互。评估结果显示，现有模型的表现差异很大，最好的模型仅达到57.3%的准确率，表明未来在这一领域还有很大的改进空间。'}}}, {'id': 'https://huggingface.co/papers/2608.10299', 'title': 'Co-Evolution in Agentic Systems: Toward Self-Directed Evolution Beyond Human Design', 'url': 'https://huggingface.co/papers/2608.10299', 'abstract': 'Abstract Agentic systems can achieve open-ended improvement through multi-component co-evolution that progressively removes fixed human constraints across agents, environments, and evolution mechanisms.  Generated by thinkingmachines/Inkling-Small Agentic systems are increasingly expected to improve after deployment, yet single-entity self-evolution is often bounded by a static learning context, such as fixed tasks and feedback. This survey focuses on co-evolution in agentic systems, a multi-component form of self-evolution in which multiple agents and their environment impose adaptive pressure on one another. To organize existing papers, we propose a progressive three-stage taxonomy that traces how the system gradually sheds human-engineered constraints. Agent--Agent Co-Evolution studies how agents adapt through dynamic peers, including adversarial, collaborative, and organizational adaptation. Agent--Environment Co-Evolution extends this loop to adaptive tasks, feedback, and interaction spaces that change with the agents. Meta Co-Evolution further explores the possibility of making the evolution mechanism itself evolvable. We also discuss open challenges in evaluating such systems, scaling them across multiple components, and keeping increasingly autonomous evolutionary processes safe and controllable. This survey provides a unified foundation for building robust and open-ended agentic systems that can improve beyond fixed human-designed paths.', 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'd3de2c8a535981b2', 'authors': ['Qing Zong', 'Jiayu Liu', 'Junhao Shen', 'Zecong Tang', 'Linsi Wu', 'Yuxuan Liu', 'Rui Wang', 'Zhaowei Wang', 'Weiqi Wang', 'Cheng Qian', 'Xiusi Chen', 'Yangqiu Song'], 'affiliations': ['Hong Kong University of Science and Technology', 'Peking University', 'The Chinese University of Hong Kong', 'The University of Hong Kong', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.10299.jpg', 'data': {'categories': ['#rl', '#agents', '#survey', '#agi'], 'emoji': '🔄', 'ru': {'title': 'Совместная эволюция: путь к самосовершенствующимся агентным системам без человеческих ограничений', 'desc': 'Статья рассматривает концепцию совместной эволюции в агентных системах, где несколько агентов и их окружение оказывают адаптивное давление друг на друга, позволяя системе развиваться после развёртывания. Авторы предлагают трёхуровневую таксономию: эволюция агент-агент (через соперничество и сотрудничество), эволюция агент-окружение (с адаптивными задачами и обратной связью) и мета-эволюция (эволюция самого механизма эволюции). Исследование показывает, как системы постепенно избавляются от зафиксированных человеком ограничений, достигая открытого и неограниченного совершенствования. Работа также обсуждает вызовы в оценке, масштабировании и контроле безопасности таких автономных систем.'}, 'en': {'title': 'Empowering Agentic Systems Through Co-Evolution', 'desc': 'This paper discusses how agentic systems can evolve and improve over time by interacting with each other and their environments. It introduces a three-stage taxonomy that outlines how these systems can gradually eliminate human-imposed limitations. The focus is on co-evolution, where multiple agents adapt to each other and their changing tasks, leading to more dynamic learning processes. The paper also highlights challenges in evaluating these systems and ensuring their safe and controllable evolution.'}, 'zh': {'title': '代理系统的共同进化与开放式改进', 'desc': '本文探讨了代理系统的共同进化，强调多组件自我进化的重要性。通过逐步去除人类设定的固定约束，代理系统能够在部署后实现开放式改进。我们提出了一个三阶段的分类法，描述了代理与环境之间的适应性压力如何相互作用。最后，文章还讨论了评估这些系统的挑战，以及如何确保自主进化过程的安全性和可控性。'}}}, {'id': 'https://huggingface.co/papers/2608.08119', 'title': 'TSDS-Toolbox: A Toolbox for Measuring Time-Series Dataset Similarity', 'url': 'https://huggingface.co/papers/2608.08119', 'abstract': 'Abstract A unified toolbox enables reproducible comparison and extension of time-series dataset similarity methods for forecasting, classification, and generation tasks.  Generated by thinkingmachines/Inkling-Small The rapid advancement of artificial intelligence (AI) has significantly accelerated research in time-series analysis, particularly in forecasting, classification, and generation tasks. Recent models, especially foundation models, benefit from time-series dataset similarity due to its significant role in source dataset selection for fine-tuning. However, many existing implementations for benchmarking time-series dataset similarity methods are fragmented and difficult to extend. To address this, we present a unified framework, the Time-Series Dataset Similarity Toolbox (TSDS-Toolbox). Our work enables (1) systematic and reproducible comparisons of time-series dataset similarity methods; (2) flexible extensibility for users to add customized datasets, similarity methods, and downstream time-series tasks; and (3) consistent evaluation of both dataset-level and series-level similarity methods through integrated time-series dataset reducers. The effectiveness of TSDS-Toolbox is validated through comprehensive experiments under diverse experimental settings. Our toolbox is publicly available.', 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '3a2e46cfe2791870', 'authors': ['Yen-Ku Liu', 'Hongjie Chen', 'Ryan A. Rossi', 'Franck Dernoncourt'], 'affiliations': ['Adobe Research', 'National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2608.08119.jpg', 'data': {'categories': [], 'emoji': '📊', 'ru': {'title': 'Унифицированный инструмент для сравнения методов сходства временных рядов', 'desc': 'В статье представлен единый инструментарий TSDS-Toolbox для сравнения и расширения методов определения сходства временных рядов. Это средство позволяет воспроизводимо сравнивать различные подходы к оценке сходства наборов данных временных рядов, которые используются при выборе источников для дообучения фундаментальных моделей. Инструментарий обеспечивает гибкость для добавления пользовательских наборов данных, методов сравнения и задач анализа временных рядов, включая прогнозирование, классификацию и генерацию. Эффективность toolbox-а подтверждена экспериментами, и он доступен для широкого использования исследовательским сообществом.'}, 'en': {'title': 'Unifying Time-Series Similarity for Better AI Insights', 'desc': 'This paper introduces the Time-Series Dataset Similarity Toolbox (TSDS-Toolbox), which provides a unified framework for comparing and extending methods of measuring similarity in time-series datasets. It addresses the challenges of fragmented implementations in the field, allowing for systematic and reproducible evaluations across various tasks like forecasting, classification, and generation. The toolbox supports users in adding their own datasets and similarity methods, enhancing flexibility and customization. Comprehensive experiments demonstrate the effectiveness of the TSDS-Toolbox, making it a valuable resource for researchers in time-series analysis.'}, 'zh': {'title': '统一工具箱，提升时间序列分析效率', 'desc': '本论文提出了一个统一的工具箱，旨在实现时间序列数据集相似性方法的可重复比较和扩展。该工具箱支持时间序列的预测、分类和生成任务，特别适用于基础模型的微调。通过系统化的比较和灵活的扩展性，用户可以方便地添加自定义数据集和相似性方法。我们通过全面的实验验证了该工具箱的有效性，并将其公开提供。'}}}, {'id': 'https://huggingface.co/papers/2608.03216', 'title': 'iFAN: Inference-Aware Learning for Plain Mask Transformers', 'url': 'https://huggingface.co/papers/2608.03216', 'abstract': 'Abstract A training framework called iFAN improves mask transformers by aligning query ranking with mask quality and distilling stronger intermediate predictions to the final layer.  Generated by thinkingmachines/Inkling-Small Query-based mask transformers assemble segmentation outputs through pixel-wise competition among query predictions of the final layer, yet this inference process is not explicitly optimized during training. We identify two key mismatches: the query with the highest probability-mask score does not necessarily produce the most accurate mask, and final-layer decoding may discard superior predictions from intermediate layers. To address these issues, we propose Inference-Aware Learning (iFAN), a general training framework for plain mask transformers. iFAN introduces Adjusted Probability-Mask Ranking (APMR), which aligns query competition with predicted mask quality and suppresses high-confidence but inaccurate competitors. We further employ Cross-Layer Self-Distillation (CLSD) to transfer stronger intermediate predictions to the final layer. The ranking and distillation objectives are training-only, while inference retains efficient final-layer decoding. Experiments on COCO, ADE20K, and Cityscapes demonstrate consistent improvements across panoptic, instance, and semantic segmentation, as well as across different architectures, backbone scales, and input resolutions. Overall, iFAN improves performance by an average of 1.20 PQ, 1.30 AP, and 0.63 mIoU, with negligible additional parameters, FLOPs and inference latency.', 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'c887fed19a361941', 'authors': ['Fang Li', 'Yu He', 'Haoyang Tong', 'Lichen Ma', 'Jingling Fu', 'Wenxiao Fan', 'Tongxuan Liu', 'Luohang Liu', 'Ke Zhang', 'Junshi Huang'], 'affiliations': ['Beijing Institute of Technology', 'JD.com', 'University of Chinese Academy of Sciences', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03216.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Осознанная тренировка трансформеров для точной сегментации масок', 'desc': 'В статье представлена тренировочная фреймворка iFAN, которая улучшает маска-трансформеры путём выравнивания ранжирования запросов с качеством маски и дистилляции более сильных предсказаний из промежуточных слоёв в финальный слой. Авторы выявили два ключевых несоответствия: запрос с наибольшей вероятностью маски не обязательно даёт самую точную сегментацию, и декодирование финального слоя может отбросить лучшие предсказания из промежуточных слоёв. Для решения этих проблем предложены два метода: Adjusted Probability-Mask Ranking (APMR) выравнивает конкуренцию запросов с качеством предсказанной маски, а Cross-Layer Self-Distillation (CLSD) передаёт сильные предсказания между слоями. Эксперименты на популярных датасетах (COCO, ADE20K, Cityscapes) показали значительные улучшения в паноптической, инстансной и семантической сегментации без увеличения параметров и затрат.'}, 'en': {'title': 'Enhancing Mask Transformers with iFAN: Better Queries, Better Masks!', 'desc': 'The paper introduces a new training framework called iFAN that enhances mask transformers by improving how query rankings relate to mask quality. It identifies issues where the highest scoring query does not always yield the best mask and where valuable predictions from earlier layers are ignored in the final output. iFAN employs Adjusted Probability-Mask Ranking (APMR) to ensure that query competition reflects the actual quality of the masks, while also using Cross-Layer Self-Distillation (CLSD) to pass better predictions from intermediate layers to the final layer. The framework shows significant performance improvements in various segmentation tasks without increasing computational costs.'}, 'zh': {'title': 'iFAN：提升掩码变换器性能的新框架', 'desc': '本文提出了一种名为iFAN的训练框架，旨在通过对查询排名与掩码质量的对齐，提升掩码变换器的性能。研究发现，最高概率的查询不一定能生成最准确的掩码，同时最终层解码可能会丢弃中间层的优质预测。为了解决这些问题，iFAN引入了调整后的概率-掩码排名（APMR）和跨层自蒸馏（CLSD），以优化训练过程并提高最终层的预测质量。实验结果表明，iFAN在多个数据集上均实现了显著的性能提升，且增加的计算开销微乎其微。'}}}, {'id': 'https://huggingface.co/papers/2607.27670', 'title': 'JigShape: Evaluating Visual-Geometric Reasoning in VLMs through Jigsaw Puzzles', 'url': 'https://huggingface.co/papers/2607.27670', 'abstract': "Abstract A new jigsaw benchmark with interlocking pieces reveals that vision-language models fail at geometric reasoning and suffer a sharp performance drop as puzzle size increases.  Generated by thinkingmachines/Inkling-Small Jigsaw puzzle solving requires jointly reasoning about visual content and geometric constraints, yet existing benchmarks use rectangular cuts that create ambiguous ground truth in texture-repeated regions. We introduce \\ours{}, a benchmark with tab-and-blank interlocking pieces where geometric constraints provide strong local compatibility requirements that, combined with visual content, yield unambiguous ground truth. Across 95K instances at four grid densities (4times4 to 16times16), we find that zero-shot VLMs largely lack geometric reasoning: only one of five frontier models (GPT-5.5) exceeds random baseline on 4times4 puzzles, while all others perform at chance level. While supervised fine-tuning achieves >97\\% on 4times4, all models collapse on larger grids: GPT-5.5 drops from 70\\% to near-random on 8times8, and even fine-tuned models fall below 5\\% on 12times12. This ``scaling cliff'' suggests current architectures cannot maintain consistent constraint satisfaction as the number of pieces increases.  establishes scalable geometric reasoning as an open challenge for vision-language models.", 'score': 1, 'issue_id': 2932, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '451afd216a37d6d0', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#dataset', '#multimodal', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Геометрическое рассуждение остаётся недостижимой вершиной для vision-language моделей', 'desc': 'В статье представлен новый бенчмарк для решения головоломок-пазлов с реалистичными соединяющимися деталями, которые имеют выступы и впадины. Исследование показывает, что современные vision-language модели (VLM), включая GPT-5.5, практически не способны к геометрическому рассуждению и случайно решают даже небольшие пазлы размером 4x4. Хотя обучение с учителем достигает высокой точности на маленьких головоломках, все модели катастрофически теряют в производительности при увеличении размера: производительность падает со 70% до почти случайного угадывания при переходе с 4x4 на 8x8. Исследование демонстрирует фундаментальную проблему в архитектурах современных моделей — они не могут поддерживать согласованность геометрических ограничений при увеличении сложности задачи.'}, 'en': {'title': 'Unlocking Geometric Reasoning in Vision-Language Models', 'desc': 'This paper introduces a new benchmark for testing vision-language models (VLMs) using jigsaw puzzles with interlocking pieces, which require both visual understanding and geometric reasoning. The authors highlight that existing benchmarks are flawed due to ambiguous ground truth caused by rectangular cuts in puzzles. Their findings reveal that most VLMs struggle with geometric reasoning, especially as puzzle complexity increases, with significant performance drops observed in larger grids. This indicates a critical challenge in developing models that can effectively handle geometric constraints in visual tasks.'}, 'zh': {'title': '几何推理的可扩展性是视觉-语言模型的挑战', 'desc': '这篇论文介绍了一个新的拼图基准，揭示了视觉-语言模型在几何推理方面的不足。研究发现，随着拼图大小的增加，这些模型的性能急剧下降。通过引入具有插接和空白的拼图块，论文提供了明确的几何约束，使得视觉内容与几何关系的推理变得更加清晰。结果表明，当前的模型在处理更大拼图时无法保持一致的约束满足，显示出可扩展的几何推理仍然是一个开放的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.10744', 'title': 'Beyond Pixels: From Video Priors to 4D Worlds', 'url': 'https://huggingface.co/papers/2608.10744', 'abstract': 'Abstract Latent-to-4D enables reusable direct 4D generation from video diffusion latents via alignment with a pretrained decoder and spatiotemporal attention, transferring across generators without retraining.  Generated by thinkingmachines/Inkling-Small 4D generation synthesizes dynamic 3D scenes from conditions such as text or images. Existing methods either reconstruct generated RGB videos with a separate 4D model or adapt a particular video generator to predict geometry directly. The former suffers from distribution mismatch and error propagation, whereas the latter ties 4D prediction to a specific generator and may require retraining when the generator or conditioning regime changes. We ask whether the final denoised latents of video models that share a variational autoencoder (VAE) can instead provide a reusable interface to explicit 4D prediction. Building on this insight, we introduce direct latent-to-4D generation and instantiate it as Latent-to-4D, which bypasses RGB by aligning a video latent with the token grid of a pretrained 4D decoder and refining it through frame-wise and global spatiotemporal attention. Trained on roughly 1K existing reconstruction clips, a single checkpoint transfers unchanged across multiple video diffusion transformers within the same VAE family. On Text4D-200 and I4D-200, Latent-to-4D surpasses matched same-latent Wan+4RC cascades in projection-based DINO-F1 by 2.88--3.45 and 5.81 points, respectively, while also being preferred by human raters for geometry, temporal stability, and overall quality.', 'score': 0, 'issue_id': 2932, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'add07c13b48225e6', 'authors': ['Zihao Liu', 'Xiaolong Shen', 'Zhenglin Zhou', 'Ruijie Quan', 'Yi Yang'], 'affiliations': ['ReLER, CCAI, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.10744.jpg', 'data': {'categories': ['#open_source', '#architecture', '#training', '#transfer_learning', '#multimodal', '#3d', '#video', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'От латентов видео к реузируемой 4D генерации без переобучения', 'desc': 'Статья представляет Latent-to-4D, новый метод для синтеза динамических 3D сцен, который работает напрямую с латентными представлениями видео-диффузионных моделей вместо RGB изображений. Метод использует выравнивание с предобученным декодером 4D и пространственно-временное внимание для преобразования латентов в 4D геометрию. Ключевое преимущество подхода в том, что один обученный чекпоинт переносится без переобучения на разные видео-генераторы, работающие в одном семействе VAE. Экспериментально показано, что метод превосходит существующие каскадные подходы по качеству геометрии, временной стабильности и отдаёт человеческими оценками.'}, 'en': {'title': 'Direct 4D Generation: Reusable and Efficient!', 'desc': 'The paper introduces Latent-to-4D, a method for generating 4D scenes directly from video diffusion latents without the need for retraining. It aligns these latents with a pretrained decoder and utilizes spatiotemporal attention to enhance the generation process. This approach overcomes limitations of existing methods that either rely on separate 4D models or are tied to specific generators. The results show that Latent-to-4D significantly improves performance on benchmark datasets while maintaining high quality in geometry and temporal stability.'}, 'zh': {'title': '直接生成4D内容的新方法', 'desc': 'Latent-to-4D 是一种新方法，可以直接从视频扩散潜变量生成可重用的4D内容。它通过与预训练解码器对齐和时空注意力机制，避免了传统方法中常见的分布不匹配和错误传播问题。该方法在多个视频扩散生成器之间无需重新训练，能够有效地合成动态3D场景。实验结果表明，Latent-to-4D 在多个基准测试中表现优于现有方法，且在几何、时间稳定性和整体质量上更受人类评审者的青睐。'}}}];
        const articlesContainer = document.getElementById('articles-container');

            const themeToggle = document.getElementById('theme-toggle');

        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-12 03:58',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-12 03:58')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-12 03:58')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
