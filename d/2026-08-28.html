    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.27345', 'title': 'PAWBench: How Far Are We from Probabilistically Aligned World Modeling?', 'url': 'https://huggingface.co/papers/2608.27345', 'abstract': "Abstract The study formalizes probabilistic alignment for world models, introduces PAWBench and PAWEval to evaluate video generators as stochastic samplers, and finds current models fail to match reference behavior distributions.  Generated by thinkingmachines/Inkling-Small Recent video generation models are increasingly framed as world models. Many physical processes can unfold in more than one valid way. Therefore, a world model should reproduce not only a plausible trajectory, but also the distribution of possible behaviors under the same initial observation and action. We call this distribution-level requirement probabilistic alignment. However, existing evaluations largely assess individual-video plausibility and do not test whether repeated generations recover the correct distribution. This raises a central question: how far are current video generators from probabilistically aligned world modeling? To answer it, we formalize probabilistic alignment as a distributional criterion for world models and introduce PAWBench, a benchmark for evaluating video generators as stochastic samplers of world dynamics. We further introduce PAWEval, an outcome-level protocol that converts repeated video rollouts into empirical distributions over possible physical behaviors. Across 50 scenarios and eleven current systems, no model consistently matches the reference probabilities while recovering the range of valid behaviors. Having established this gap, we test whether language prompts, initial noise sampling, or model training can reshape the model's predictive distribution. We believe our work can serve as a foundation for future efforts to move towards probabilistically aligned world modeling.", 'score': 69, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '2e13b618e6123ae5', 'authors': ['Yuandong Pu', 'Le Zhuo', 'Sayak Paul', 'Gabriel Jorge Menezes', 'Avram Đorđević', 'Shiyang Li', 'Yifan Zhou', 'Bin Fu', 'Wenlong Zhang', 'Junjun He', 'Yu Qiao', 'Yihao Liu', 'Jingbo Xing', 'Xi Chen'], 'affiliations': ['Huggingface', 'Krea AI', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'The University of Hong Kong', 'Tongyi Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.27345.jpg', 'data': {'categories': ['#benchmark', '#video', '#dataset', '#optimization'], 'emoji': '🎲', 'ru': {'title': 'От плаксиальности к вероятностной выравниваемости: оценка генераторов видео как стохастических семплеров', 'desc': 'Исследование вводит концепцию вероятностной выравниваемости для мировых моделей, которые должны воспроизводить не только правдоподобные траектории, но и распределение возможных поведений при одних и тех же начальных условиях. Авторы предлагают PAWBench — бенчмарк для оценки генераторов видео как стохастических семплеров физической динамики, и PAWEval — протокол для преобразования повторных генераций видео в эмпирические распределения возможных поведений. Экспериментальные результаты на 50 сценариях показывают, что ни одна из одиннадцати протестированных современных моделей не достигает согласованного совпадения с эталонными вероятностями при воспроизведении диапазона допустимых поведений. Работа закладывает основу для развития методов, направленных на достижение вероятностной выравниваемости в моделировании мира.'}, 'en': {'title': 'Towards Probabilistic Alignment in Video Generation Models', 'desc': 'This paper introduces the concept of probabilistic alignment for world models, which ensures that video generation models not only create realistic sequences but also capture the distribution of possible behaviors. The authors present PAWBench and PAWEval, tools designed to evaluate how well these models function as stochastic samplers of world dynamics. Their findings reveal that current video generation models struggle to match the expected behavior distributions, indicating a significant gap in performance. The study aims to lay the groundwork for improving future models towards achieving better probabilistic alignment in world modeling.'}, 'zh': {'title': '迈向概率对齐的世界建模', 'desc': '本研究正式定义了世界模型的概率对齐，提出了PAWBench和PAWEval来评估视频生成器作为随机采样器的表现。研究发现，当前模型未能匹配参考行为分布，表明它们在生成视频时存在不足。我们引入了概率对齐这一分布级别的要求，强调世界模型不仅要生成合理的轨迹，还要重现相同初始观察和动作下的可能行为分布。通过50个场景和11个当前系统的测试，我们发现没有模型能够一致地匹配参考概率，同时恢复有效行为的范围。'}}}, {'id': 'https://huggingface.co/papers/2608.27448', 'title': 'TTPO: Test-Time Policy Optimization', 'url': 'https://huggingface.co/papers/2608.27448', 'abstract': 'Abstract Test-Time Policy Optimization enables label-free test-time training for mathematical reasoning by asymmetrically distilling agreeing rollouts and penalizing disagreeing ones, matching supervised performance.  Generated by thinkingmachines/Inkling-Small Recent prominent post-training methods, such as Reinforcement Learning (RL) and On-Policy Self-Distillation (OPSD), have driven rapid progress in mathematical reasoning for large language models, yet their reliance on ground-truth labels precludes test-time training (TTT). Replacing ground truth with majority-vote pseudo-labels is a natural alternative, yet it is fragile: an incorrect vote corrupts the teacher and misleads every token. We observe that this failure mode is asymmetric: rollouts that disagree with the pseudo-label are typically wrong regardless of whether the vote itself is correct. Building on this observation, we propose Test-Time Policy Optimization (TTPO), an asymmetric objective that distills agreeing rollouts via OPSD and penalizes disagreeing rollouts with Grouped RL. Token-level selection further refines both branches: distillation down-weights already-converged positions, while RL penalizes only confident errors. Both updates remain well-grounded even under frequent pseudo-label errors, and majority-vote routing yields tighter self-supervision as the model improves. Without any labels, TTPO matches label-supervised OPSD on five competition-level benchmarks, raises Qwen3-1.7B from 38.0% to 45.2% in TTT, yields +25.2% to +36.4% without thinking, and shows strong cross-task generalization.', 'score': 48, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '934968eca715b8be', 'authors': ['Aozhe Wang', 'Zhengxi Lu', 'Jianze Wang', 'Shangke Lv', 'Ying Liu', 'Weiming Lu', 'Jun Xiao', 'Yueting Zhuang', 'Hua Yang', 'Qianglong Chen', 'Yongliang Shen'], 'affiliations': ['Alibaba Group', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27448.jpg', 'data': {'categories': ['#math', '#training', '#small_models', '#rl'], 'emoji': '🧮', 'ru': {'title': 'Обучение без разметки: асимметричная оптимизация для математического рассуждения', 'desc': 'В статье предлагается метод Test-Time Policy Optimization (TTPO) для обучения языковых моделей математическому рассуждению без использования размеченных данных на этапе тестирования. Авторы используют асимметричный подход: соглашающиеся с предсказанием модели варианты дистиллируются через самодистилляцию, а несоглашающиеся штрафуются с помощью группированного обучения с подкреплением. Метод включает токен-уровневую селекцию, которая уточняет обе ветви обучения и остаётся стабильным даже при частых ошибках в псевдо-разметке большинством голосов. Эксперименты показывают, что TTPO достигает производительности supervised методов на сложных бенчмарках без использования какой-либо разметки.'}, 'en': {'title': 'Empowering Label-Free Learning with Test-Time Policy Optimization', 'desc': 'This paper introduces Test-Time Policy Optimization (TTPO), a method for improving mathematical reasoning in large language models without needing ground-truth labels. TTPO works by distilling information from rollouts that agree with majority-vote pseudo-labels while penalizing those that disagree, thus addressing the fragility of label-free training. The approach uses an asymmetric objective that combines On-Policy Self-Distillation (OPSD) and Grouped Reinforcement Learning (RL) to enhance model performance even in the presence of errors in pseudo-labels. The results show that TTPO can achieve performance comparable to supervised methods across multiple benchmarks, demonstrating its effectiveness in test-time training scenarios.'}, 'zh': {'title': '无标签训练的数学推理新方法', 'desc': '本文提出了一种名为测试时策略优化（TTPO）的方法，旨在实现无标签的测试时训练，特别是在数学推理任务中。TTPO通过不对称地提炼一致的回滚结果，并惩罚不一致的回滚结果，从而达到与监督学习相匹配的性能。该方法利用了多数投票伪标签的替代方案，尽管这种方法在面对错误投票时可能会脆弱，但TTPO通过选择性地加权和惩罚来增强模型的鲁棒性。最终，TTPO在多个基准测试中表现出色，证明了其在无标签情况下的有效性和跨任务的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2608.27260', 'title': 'What Makes Good Agentic Data? An ACE Lens on Data Generation for LLM Agents', 'url': 'https://huggingface.co/papers/2608.27260', 'abstract': 'Abstract Agentic data generation is framed as constrained distribution design over factorized experience tuples, emphasizing execution-grounded accuracy, learner-relative complexity, and diversity rather than scale alone.  Generated by thinkingmachines/Inkling-Small LLM agents increasingly rely on generated interaction data to learn how to interact with external environments. Agentic data generation must maintain consistency among environments, tasks, interactions, and success signals while producing experience that is useful rather than merely abundant. Existing work spans many agent domains, but domain-centered organization and heterogeneous evaluation often obscure common generation mechanisms and conflate candidate construction with verification and selection. This work develops a two-level framework for the field. First, we represent agentic data as a common factorized object (E,q,τ,v), comprising an environment specification, task signal, interaction realization, and optional verifier. We organize generation paradigms by their primary anchor and dependency structure. Second, we formulate generation as constrained distribution design through the Accuracy-Complexity-divErsity (ACE) lens. Accuracy establishes the feasible support of grounded and internally consistent data. Within this support, Complexity places learning mass relative to the capability of a declared learner and execution configuration, while divErsity controls coverage and redundancy of data. Using this framework, we explore how prior work verifies generated experience, constructs and calibrates difficulty, and expands behavioral coverage. The literature reveals a shift toward execution-grounded accuracy, learner-relative complexity, and diversity beyond surface variation or dataset size. We further discuss broader directions and emerging trends in agentic data generation through the ACE lens, including their implications for scaling, data sources, training regimes and adaptive learning. Overall, the central challenge is not simply to generate more data, but to continually allocate valid, informative, and non-redundant experience as agents and environments evolve.', 'score': 45, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '65c2e7a32cb77dc7', 'authors': ['Xingshan Zeng', 'Zishan Xu', 'Boju Zhang', 'Yuzhou Wu', 'Lingzhi Wang', 'Jianghao Lin', 'Liangyou Li', 'Yasheng Wang', 'Lifeng Shang', 'Xin Jiang', 'Weinan Zhang', 'Yong Yu', 'Qun Liu', 'Weiwen Liu'], 'affiliations': ['Harbin Institute of Technology', 'Huawei Technologies Co., Ltd', 'Northwestern University', 'Shanghai Jiao Tong University', 'Shenzhen Loop Area Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.27260.jpg', 'data': {'categories': ['#training', '#synthetic', '#agents', '#data', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'От количества к качеству: целевая генерация данных для обучения агентов', 'desc': 'В работе предлагается унифицированный подход к генерации данных для обучения агентов, представляя каждый набор данных как кортеж из спецификации окружения, сигнала задачи, реализации взаимодействия и верификатора. Авторы формулируют генерацию данных как задачу проектирования ограниченного распределения через три критерия: точность (согласованность с окружением), сложность (соответствие возможностям обучающейся системы) и разнообразие (покрытие поведения). Исследование показывает, что современные подходы смещаются в сторону привязанной к реальной работе системы точности, адаптивной сложности относительно обучающегося агента и разнообразия сверх простого увеличения размера датасета. Ключевой вывод состоит в том, что главная задача — не просто генерировать больше данных, а непрерывно отбирать валидный, информативный и неизбыточный опыт по мере эволюции агентов и окружений.'}, 'en': {'title': 'Quality Over Quantity: The Future of Agentic Data Generation', 'desc': 'This paper introduces a framework for generating agentic data, which is essential for training machine learning agents to interact effectively with their environments. It emphasizes the importance of accuracy, complexity, and diversity in the data generation process, rather than just focusing on the quantity of data. The authors propose a two-level structure to represent agentic data, ensuring that it is consistent and useful across various tasks and environments. The study highlights the need for a shift towards generating high-quality, informative experiences that adapt as agents and their environments change.'}, 'zh': {'title': '生成有效数据，超越数量的挑战', 'desc': '本文探讨了代理数据生成的概念，强调在生成数据时需要考虑准确性、复杂性和多样性，而不仅仅是数据的规模。我们提出了一种两级框架，将代理数据表示为一个共同的因子化对象，并通过准确性、复杂性和多样性（ACE）来设计受限分布。该框架帮助我们理解如何验证生成的经验、构建和校准难度，以及扩展行为覆盖。最终，文章指出，生成的数据不仅要丰富，还要有效且具有信息量，以适应代理和环境的不断演变。'}}}, {'id': 'https://huggingface.co/papers/2608.15763', 'title': 'Training Agents to Evolve with Their Harness: TaoLive Digital Avatar Agent Technical Report', 'url': 'https://huggingface.co/papers/2608.15763', 'abstract': "Abstract Harness-Aware Training enables compact models to adapt to evolving digital-avatar harness configurations with low latency and high accuracy.  Generated by thinkingmachines/Inkling-Small AI-powered digital avatar streamers must answer product questions, engage viewers, and execute marketing strategies in real time, demanding low latency, frequent strategy updates, and accurate yet effective responses. Evolvable Harnesses, whose Skills, Hooks, prompts, and tools can be updated independently of model weights, enable rapid iteration but expose a trade-off: large models adapt zero-shot yet are too slow, whereas compact models meet latency targets but overfit to fixed Harness configurations. We propose Harness-Aware Training (HAT), which trains compact models to adapt to changing Harnesses. Its key component, Harness-State Augmentation (HSA), applies task-preserving transformations to Skill identifiers and content, tool schemas, prompt structures, and Hook functions. Training proceeds in three stages: HSA-SFT learns reasoning and tool use from strong-model trajectories across diverse environments; General On-Policy Distillation restores generalization lost during SFT; and HSA-RL improves robustness to changing Harnesses through reinforcement learning in augmented environments. Across four evaluation sets, HAT achieves 94.8 on Live-Stream QA (base: 80.3; strongest general LLM: 93.0) and 94.6 on Harness-Variant QA (base: 75.4). Unlike Fixed-Harness SFT, which lowers IFEval by 7.7 points from the base model, HAT avoids this regression and reaches 83.5. On one NVIDIA H20 GPU, the optimized system delivers P50 and P95 latencies of 3.4 s and 8.1 s. Deployed in Taobao Live's digital-avatar service, it also yields positive online A/B test results for GMV and item-page views.", 'score': 39, 'issue_id': 3181, 'pub_date': '2026-08-22', 'pub_date_card': {'ru': '22 августа', 'en': 'August 22', 'zh': '8月22日'}, 'hash': 'ee972cb40dd51191', 'authors': ['TaoLive AIGC LLM Team', 'Yuhan Sun', 'Wenhao Lin', 'Yongdong Luo', 'Yibo Hu', 'Meiguang Jin', 'Junfeng Ma', 'Weihang Pan', 'Jiaxin Zhao', 'Zulong Chen'], 'affiliations': ['TaoLive AIGC LLM Team'], 'pdf_title_img': 'assets/pdf/title_img/2608.15763.jpg', 'data': {'categories': ['#training', '#small_models', '#rlhf'], 'emoji': '🤖', 'ru': {'title': 'Компактные модели, которые адаптируются к изменениям без потери скорости', 'desc': 'Статья предлагает метод обучения компактных моделей для работы с эволюционирующими конфигурациями цифровых аватаров в режиме реального времени. Основная идея заключается в применении трансформаций, сохраняющих задачу (Harness-State Augmentation), к идентификаторам навыков, инструментам и подсказкам модели. Обучение проводится в три этапа: дистилляция знаний от больших моделей, восстановление обобщающей способности и оптимизация через обучение с подкреплением в дополненных окружениях. Результаты показывают, что компактные модели достигают качества, близкого к крупным LLM, при этом сохраняя низкую латентность для практического развертывания.'}, 'en': {'title': 'Adapting Compact Models for Real-Time Digital Avatars', 'desc': 'Harness-Aware Training (HAT) is a method designed to help compact machine learning models quickly adapt to changing configurations of digital avatars while maintaining low latency and high accuracy. It introduces Harness-State Augmentation (HSA), which modifies various components of the model to preserve task performance during training. The training process consists of three stages: learning from strong models, restoring generalization, and enhancing robustness through reinforcement learning. HAT outperforms traditional methods, achieving high accuracy in live-stream question answering and demonstrating effective real-time performance in practical applications.'}, 'zh': {'title': '适应变化的紧凑型模型训练方法', 'desc': '本文提出了一种名为Harness-Aware Training（HAT）的训练方法，旨在帮助紧凑型模型快速适应不断变化的数字化身配置。HAT通过引入Harness-State Augmentation（HSA）技术，利用任务保持变换来增强模型的适应能力。训练过程分为三个阶段，分别是从强模型轨迹中学习推理和工具使用、恢复在SFT过程中丢失的泛化能力，以及通过强化学习提高对变化配置的鲁棒性。实验结果表明，HAT在多个评估集上表现优异，显著提高了模型的实时响应能力和准确性。'}}}, {'id': 'https://huggingface.co/papers/2608.27456', 'title': 'UrbanGround: From Local Perception to Spatial Agency in a Real-Scale City', 'url': 'https://huggingface.co/papers/2608.27456', 'abstract': 'Abstract UrbanGround evaluates whether multimodal language model agents can sustain reliable navigation and spatial reasoning in a realistic 3D city replica, revealing that local perceptual skills fail to compose into extended goal-directed behavior.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) can interpret a street view, but urban agency depends on whether such local evidence remains useful after the agent starts to move. In this paper, we investigate how far current MLLM agents can turn local urban perception into reliable action in a complicated real-scale city. We propose UrbanGround, the first sandbox to make this question testable in a physically constrained replica of Hong Kong built from territory-wide 3D geospatial data. UrbanGround supports closed-loop interaction from a first-person view and provides an interactive map for navigation. Agents can directly enter the 3D city and explore from a first-person view. Our analysis follows the growth of the spatial problem through three research questions. We first test whether an agent can ground a local scene well enough to answer spatial questions after active observation. Then we ask whether that grounding supports navigation as destinations become farther away and less explicit. Finally, we examine whether the resulting behavior survives changes in route availability and pedestrian motion. Contemporary MLLM agents usually show useful atomic abilities in visual recognition and short-range spatial reasoning, while orientation and pedestrian-aware movement remain unreliable. Their central failure emerges over extended exploration, where local abilities do not compose into sustained goal-directed behavior and errors accumulate without effective correction. We hope UrbanGround will support broader study of how far current MLLM agents can explore reliably in complex, open-ended urban environments.', 'score': 35, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '2467ad26441a678c', 'authors': ['Tianjie Ju', 'Zheng Wu', 'Yueqing Sun', 'Yuhan Cui', 'Bobo Li', 'Shengqiong Wu', 'Pengzhou Cheng', 'Haodong Zhao', 'Zongru Wu', 'Xinbei Ma', 'Doris Zhang', 'Kunling Li', 'Mong-Li Lee', 'Wynne Hsu', 'Hao Fei', 'Qi Gu', 'Gongshen Liu', 'Zhuosheng Zhang'], 'affiliations': ['Meituan', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Shanghai University', 'The Chinese University of Hong Kong', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.27456.jpg', 'data': {'categories': ['#agents', '#benchmark', '#3d', '#multimodal', '#dataset'], 'emoji': '🏙️', 'ru': {'title': 'Локальное восприятие не гарантирует навигацию: композиция способностей в городской среде', 'desc': 'В работе представлен UrbanGround — первая тестовая платформа для оценки способности мультимодальных больших языковых моделей (МLLM) агентов к надёжной навигации и пространственному рассуждению в реалистичной 3D-реплике города. Исследование показывает, что хотя современные МLLM-агенты хорошо распознают локальные сцены и отвечают на пространственные вопросы, их ориентация и учёт движения пешеходов остаются ненадёжными. Главный вывод состоит в том, что локальные перцептивные навыки не объединяются в устойчивое целенаправленное поведение при расширенной навигации, так как ошибки накапливаются без эффективной коррекции. Платформа построена на основе территориально-широких 3D геопространственных данных Гонконга и позволяет агентам взаимодействовать от первого лица с замкнутым циклом обратной связи.'}, 'en': {'title': 'UrbanGround: Testing Navigation Skills of Multimodal Language Models in 3D Cities', 'desc': 'The paper introduces UrbanGround, a testing environment for multimodal language model agents to navigate and reason in a realistic 3D city. It highlights the limitations of current models in maintaining reliable navigation and spatial reasoning over extended distances. The study investigates how well these agents can use local perceptions to make decisions as they move through a complex urban landscape. Ultimately, it reveals that while agents can recognize immediate surroundings, they struggle with sustained goal-directed behavior in dynamic environments.'}, 'zh': {'title': '探索城市导航的智能边界', 'desc': 'UrbanGround 是一个评估多模态语言模型代理在现实3D城市复制品中进行可靠导航和空间推理的工具。研究发现，局部感知能力无法有效组合成持续的目标导向行为。尽管当前的多模态大语言模型能够理解街景，但在移动后这些局部证据的有效性会受到影响。通过对香港的3D地理空间数据构建的物理约束复制品，UrbanGround 使得这一问题的测试成为可能。'}}}, {'id': 'https://huggingface.co/papers/2608.26530', 'title': 'PILOT in the Loop: Live Self-Improvement for Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2608.26530', 'abstract': 'Abstract PILOT enables live self-improvement by allowing a supervisor to steer active workers and distilling execution experience into reusable skills, improving accuracy and efficiency.  Generated by thinkingmachines/Inkling-Small Long-horizon agent runs generate experience that can improve both the current run and future work. Most self-improvement methods process this experience only after execution ends, so they cannot redirect the active run or immediately apply and validate lessons learned from it. We argue that self-improvement should instead be live, using emerging experience both to redirect the active run and to update the persistent harness. Existing agent architectures do not fully support this goal. Single-agent self-correction combines task execution and trajectory assessment within one context, while subagent delegation separates execution but typically cannot redirect an active subagent. We present PILOT, a supervisor-worker harness for live self-improvement through two coupled mechanisms: (1) live steering lets a separate supervisor redirect or abort the active worker during execution; and (2) live self-evolution distils procedures and failure modes revealed during execution into reusable skills and memory. Across two frozen backbones and three benchmarks, PILOT ranks first in five of six configurations. On Terminal-Bench 2.0, PILOT outperforms counterpart harnesses by up to 9.8 percentage points. In the self-improvement setting, PILOT gains 14.6 points with GLM-5.1 and 12.4 points with Kimi-K2.6. Mean output tokens fall by 42.9% and 47.4%, while successful evaluations per million output tokens rise by 110.3% and 134.0%, respectively.', 'score': 21, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'a445d7aec352ddd3', 'authors': ['Yang Xiao', 'Yusong Sun', 'Haoyi Wu', 'Wenyang Hui', 'Wen Da', 'Zhaokai Luo', 'Mu Chuan', 'Yao Hu', 'Wenjie Li', 'Chengyue Jiang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.26530.jpg', 'data': {'categories': ['#agents', '#benchmark', '#training'], 'emoji': '🚀', 'ru': {'title': 'Живое самосовершенствование агентов через одновременное руководство и накопление опыта', 'desc': 'PILOT — это система, которая позволяет агентам улучшаться в реальном времени во время выполнения задач. Система использует архитектуру «руководитель-исполнитель», где руководитель может перенаправлять работающего агента и корректировать его действия прямо во время выполнения. Одновременно система собирает опыт из текущего выполнения и преобразует его в переиспользуемые навыки и память, которые помогают в будущих задачах. Эксперименты показали, что PILOT значительно улучшает точность, снижает количество генерируемых токенов на 42-47% и повышает эффективность выполнения на 110-134%.'}, 'en': {'title': 'Live Self-Improvement for Enhanced Agent Performance', 'desc': 'PILOT is a machine learning framework that allows real-time self-improvement of agents by enabling a supervisor to guide active workers during their tasks. It captures execution experiences and transforms them into reusable skills, enhancing both accuracy and efficiency. Unlike traditional methods that analyze experiences only after task completion, PILOT integrates live steering and self-evolution to adapt and improve on-the-fly. This innovative approach leads to significant performance gains, as demonstrated by its superior results across various benchmarks.'}, 'zh': {'title': '实时自我改进的智能系统', 'desc': 'PILOT 是一种实时自我改进的方法，允许监督者在执行过程中引导活跃的工作者，并将执行经验提炼为可重用的技能，从而提高准确性和效率。与传统的自我改进方法不同，PILOT 能够在执行过程中实时应用和验证所学的经验，而不是在执行结束后再进行处理。该系统通过两个相互关联的机制实现实时自我改进：实时引导和实时自我演化。实验结果表明，PILOT 在多个基准测试中表现优异，显著提高了成功评估率和输出效率。'}}}, {'id': 'https://huggingface.co/papers/2608.26103', 'title': 'Zero-WAM: In-Context World-Action Modeling from Human Videos for Open-Ended Task Generalization', 'url': 'https://huggingface.co/papers/2608.26103', 'abstract': 'Abstract Zero-WAM enables robotic manipulation of unseen tasks by conditioning a causal video-action model on in-context human video guidance, supported by an automatically generated dataset and a future-chunk prediction objective.  Generated by thinkingmachines/Inkling-Small Zero-shot cross-task generalization, where a policy must execute manipulation tasks never seen during training, remains a central challenge in robot learning. In large language models, a novel task can be performed simply by specifying it in the context, without any parameter update. This form of in-context learning (ICL) turns generalization into a problem of task specification. To achieve cross-task generalization, we bring this paradigm to robotic manipulation, and argue that the natural task specification for manipulation is a human video: unlike language, it provides rich visual cues about the intended task evolution. We present Zero-WAM, a causal video-action model that executes unseen tasks by following in-context human video guidance. To address the scarcity of task-rich paired human-robot data, we propose an automatic pipeline that converts task-sampled robot trajectories into semantically matched human videos, yielding HumanGen, a dataset of 74.2K human-robot ICL pairs across 8.6K tasks. For model training, we further introduce an in-context future chunk prediction (IFP) objective that suppresses shortcuts learned from seen tasks and forces the policy to draw task information from the video prompt. On seven unseen tasks in RoboTwin 2.0 simulation, Zero-WAM achieves a 47.0% average success rate, an absolute improvement of 29.5 percentage points over the strongest video-action baseline. In real-world evaluations, it follows human video guidance to generalize to unseen task configurations involving multi-object scenes, long-horizon manipulation, and fine-grained insertion.', 'score': 13, 'issue_id': 3181, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'c6531ad7e3f9b31a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#training', '#robotics', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Обучение роботов новым задачам через видео-примеры без переобучения', 'desc': 'Авторы представляют Zero-WAM, модель видео-действий, которая позволяет роботам выполнять незнакомые задачи манипуляции, используя видео человека как контекстный пример, подобно тому как большие языковые модели выполняют новые задачи через in-context learning. Для обучения модели предложена автоматическая конвертация роботских траекторий в видео человека, создавая датасет HumanGen с 74.2K пар видео-действий для 8.6K различных задач. Ключевым улучшением является цель обучения in-context future chunk prediction, которая предотвращает переобучение на виденные задачи и заставляет политику извлекать информацию из видео-подсказки. На неизвестных задачах Zero-WAM достигает 47% успеха в симуляции и успешно обобщается на реальные сценарии с многообъектными сценами и сложной манипуляцией.'}, 'en': {'title': 'Empowering Robots with Human Video Guidance for Unseen Tasks', 'desc': 'Zero-WAM is a novel approach in robotic manipulation that allows robots to perform tasks they have never encountered before by using human video demonstrations as guidance. It leverages a causal video-action model that interprets these videos to understand and execute the intended tasks. To overcome the challenge of limited training data, Zero-WAM automatically generates a large dataset of human-robot interaction pairs, enabling effective in-context learning. The model shows significant improvements in task execution success rates, demonstrating its ability to generalize across various unseen manipulation tasks.'}, 'zh': {'title': '通过人类视频指导实现机器人操控的跨任务泛化', 'desc': 'Zero-WAM是一种机器人操控模型，它通过人类视频指导来执行未见过的任务。该模型利用因果视频-动作模型，并通过自动生成的数据集和未来块预测目标来支持学习。Zero-WAM的创新在于，它能够在没有参数更新的情况下，通过上下文学习来实现跨任务的泛化。通过将任务规范化为人类视频，Zero-WAM能够有效地从视频中提取任务信息，从而在未见任务上取得显著成功。'}}}, {'id': 'https://huggingface.co/papers/2608.27351', 'title': 'Understanding Evolution Strategies for LLM Reasoning: Broader Reasoning Coverage than GRPO', 'url': 'https://huggingface.co/papers/2608.27351', 'abstract': "Abstract Evolution strategies improve reasoning diversity and Pass@K over GRPO through sparse functional updates and population diversity, supporting a hybrid training approach.  Generated by thinkingmachines/Inkling-Small Evolution Strategies (ES) have recently emerged as a memory-efficient post-training paradigm for LLM reasoning. However, the optimization behavior of ES remains understudied, making it hard to define its advantage scope compared to mainstream post-training paradigms (e.g., Group Relative Policy Optimization (GRPO)). By systematically investigating ES dynamics and mechanisms, this paper first identifies a performance advantage of ES over GRPO, theoretically and empirically showing that ES can lead to broader reasoning coverage, thereby better exploiting the reasoning capabilities of pretrained LLMs. Theoretically, we show that verifier-projected Jensen-Shannon diversity across the ES population is helpful to higher Pass@K performances. Empirically, unlike GRPO, which exhibits entropy collapse, ES improves Pass@1 while attaining higher Pass@K than GRPO. We further develop a sequential GRPO-ES training strategy that combines GRPO's strength in Pass@1 with ES's gains in Pass@K. Second, we find that despite substantial whole-model parameter drift, the task-performance gains of ES are only contributed to a sparse subset of larger-magnitude updates. This functional sparsity suggests that large parameter movement need not imply widespread functional change, and held-out evaluations further show that it does not necessarily lead to catastrophic forgetting. Finally, we study how hyperparameter design affects the effectiveness of ES, demonstrating that ES requires a smaller population size in a larger LLM. These findings position ES as a distinct reasoning post-training paradigm rather than a less effective, memory-efficient alternative to GRPO.", 'score': 11, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'b961bea7ed874bfe', 'authors': ['Yunpeng Ba', 'Zhi Zheng', 'Yue Xie', 'Jiaqing Li', 'Xialiang Tong', 'Tao Zhong', 'Mingxuan Yuan', 'Zhichao Lu', 'Xuyang Wu', 'Zhenkun Wang'], 'affiliations': ['City University of Hong Kong', 'Harbin Institute of Technology, Weihai', 'Huawei Noahs Ark Lab', 'National University of Singapore', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.27351.jpg', 'data': {'categories': ['#training', '#rlhf', '#reasoning', '#optimization'], 'emoji': '🧬', 'ru': {'title': 'Эволюционные стратегии: путь к разнообразному рассуждению в LLM', 'desc': 'В статье исследуются эволюционные стратегии как парадигма пост-обучения для больших языковых моделей, которые показывают преимущества над методом GRPO в разнообразии рассуждений и метрике Pass@K. Авторы доказывают теоретически и эмпирически, что эволюционные стратегии обеспечивают более широкое покрытие возможных рассуждений благодаря дивергентности популяции, в то время как GRPO страдает от коллапса энтропии. Ключевое открытие состоит в том, что функциональные улучшения сосредоточены в разреженном подмножестве параметров модели, что предотвращает катастрофическое забывание несмотря на значительные изменения параметров. Авторы предлагают гибридный подход, комбинирующий сильные стороны обоих методов, и показывают, что эффективность эволюционных стратегий зависит от размера модели.'}, 'en': {'title': 'Unlocking Reasoning Potential with Evolution Strategies', 'desc': 'This paper explores the advantages of Evolution Strategies (ES) in enhancing reasoning diversity and performance metrics like Pass@K compared to Group Relative Policy Optimization (GRPO). It highlights that ES can achieve better reasoning coverage and higher performance without the entropy collapse seen in GRPO. The study reveals that significant parameter updates in ES do not lead to widespread functional changes, indicating a form of functional sparsity. Additionally, it introduces a hybrid training strategy that leverages the strengths of both GRPO and ES, while also showing that ES can be effective with a smaller population size in larger language models.'}, 'zh': {'title': '进化策略：推理训练的新选择', 'desc': '进化策略（ES）通过稀疏功能更新和种群多样性，提升了推理的多样性和Pass@K的表现，支持混合训练方法。本文系统研究了ES的动态和机制，理论和实证表明ES在推理覆盖面上优于GRPO，能够更好地利用预训练大语言模型的推理能力。研究发现，尽管模型参数发生显著漂移，ES的任务性能提升仅源于少量大幅度更新，表明大参数移动不一定意味着广泛的功能变化。最后，研究还表明超参数设计对ES的有效性有重要影响，ES在较大的大语言模型中需要更小的种群规模。'}}}, {'id': 'https://huggingface.co/papers/2608.26200', 'title': 'GameWAM: A World Action Model for Video Games', 'url': 'https://huggingface.co/papers/2608.26200', 'abstract': 'Abstract GameWAM is a unified world-action model for native video-game control that jointly predicts future visuals and executable keyboard-mouse actions using block-causal flow matching, mode-specific distributions, and block-cycle replanning.  Generated by thinkingmachines/Inkling-Small Modern video games combine first-person perception, rapid visual changes, persistent world state, and heterogeneous native controls. Existing game agents map visual and task context directly to actions but lack explicit world dynamics modeling, whereas interactive game world models predict visual futures from supplied actions but do not serve as task policies. World-Action Models (WAMs) unify these objectives, but remain largely unexplored under the dynamics and open-ended interaction of video games. We introduce GameWAM, to our knowledge the first WAM for native closed-loop gameplay and GUI control. GameWAM jointly generates future visual observations and executable keyboard-mouse trajectories through parallel visual and action generative processes with block-causal conditioning and flow matching. To support joint world-action learning, we construct synchronized gameplay and GUI trajectories. To handle heterogeneous native control, GameWAM predicts a gameplay/GUI mode at each action step and generates actions with mode-specific prediction distributions and continuous-action normalization. For long-horizon interaction, block-cycle control predicts beyond the committed horizon, executes only a short action prefix, and replans from new observations, while fine-grained within-cycle context and hierarchical cross-cycle history preserve temporal continuity. Experiments demonstrate competitive task success with fewer executed native actions than the compared agents. We further uncover Low-Frequency Action Source Imprinting (LASI), in which low-frequency components of the sampled action source systematically steer coarse generated camera motion under fixed conditioning, revealing a source-sensitivity failure mode in generative control. Project page is available at https://yunncheng.github.io/GameWAM/.', 'score': 8, 'issue_id': 3181, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'bda2319effef464e', 'authors': ['Yuncheng Guo', 'Zhanqiu Zhang', 'Yiwen Guo', 'Weijia Li'], 'affiliations': ['Fudan University', 'Independent Researcher', 'LIGHTSPEED', 'Tsinghua Shenzhen International Graduate School'], 'pdf_title_img': 'assets/pdf/title_img/2608.26200.jpg', 'data': {'categories': ['#training', '#agents', '#video', '#games', '#architecture', '#diffusion'], 'emoji': '🎮', 'ru': {'title': 'Единая модель мира и действия для игрового ИИ', 'desc': 'GameWAM — это единая модель мира-действия для управления видеоиграми, которая одновременно предсказывает будущие визуальные кадры и исполняемые действия клавиатуры-мыши. Модель использует блочное причинное сопоставление потоков и распределения, специфичные для режима игры, чтобы корректно обрабатывать гетерогенные управления. Для долгосрочного взаимодействия применяется блочно-циклическое переплонирование, которое предсказывает действия за пределами текущего горизонта, но выполняет только короткий префикс. Исследование выявило интересный эффект — низкочастотные компоненты исходного действия систематически влияют на движение камеры, раскрывая уязвимость в генеративном управлении.'}, 'en': {'title': 'GameWAM: Unifying Visual Prediction and Action Control in Video Games', 'desc': 'GameWAM is a novel model that integrates visual prediction and action execution for controlling video games using keyboard and mouse. It employs block-causal flow matching and mode-specific distributions to generate future visuals and corresponding actions simultaneously. Unlike traditional agents that either focus on visual mapping or world dynamics, GameWAM combines these aspects to enhance gameplay and GUI interactions. The model also introduces a unique replanning mechanism that allows it to adapt to new observations while maintaining a coherent action trajectory over time.'}, 'zh': {'title': 'GameWAM：视频游戏控制的新突破', 'desc': 'GameWAM是一种统一的世界-动作模型，旨在实现原生视频游戏的控制。它通过块因果流匹配和特定模式分布，联合预测未来的视觉效果和可执行的键盘鼠标动作。与现有的游戏代理不同，GameWAM不仅能够预测视觉未来，还能作为任务策略进行控制。实验表明，GameWAM在执行的原生动作数量上优于其他对比代理，同时保持了较高的任务成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.27168', 'title': 'Magpie: Real-Time World Renderer for Interactive Games', 'url': 'https://huggingface.co/papers/2608.27168', 'abstract': 'Abstract Magpie is a real-time generative rendering system that separates gameplay logic from visual generation to preserve interactive designability while reducing asset requirements for game prototypes.  Generated by thinkingmachines/Inkling-Small Modern game development relies heavily on conventional graphics pipelines. High-quality visual content requires modeling, material authoring, animation, lighting, effects, and runtime optimization, making asset production expensive and extending the development cycle of game prototypes. Recently, video foundation models are beginning to change film and video production, but games differ from linear media, they require not only continuous and realistic imagery, but also stable and reproducible gameplay rules, object states, and interaction outcomes. We present Magpie, a real-time generative world-rendering system for interactive games. Magpie separates gameplay execution from visual generation. Designers define scenes and rules in a game engine. At runtime, the Game Engine resolves player actions and maintains world state, while an independent Render Server generates visual output from white-box frames produced by the engine. Magpie provides a system-level implementation path for applying generative models to real-time game rendering. It preserves gameplay designability and reproducibility, and reduces the dependence of early game prototypes on complete visual assets.', 'score': 4, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '60f59c10f15d8433', 'authors': ['Xiaoyu Zhan', 'Xinyu Wang', 'Xiaohong Zhang', 'Huanjie Zhu', 'Tengjiao Sun', 'Pengcheng Fang', 'Jiaxing Yu', 'Yanwen Guo', 'Dongjie Fu'], 'affiliations': ['Mogo AI Ltd.', 'Nanjing University', 'University of Southampton'], 'pdf_title_img': 'assets/pdf/title_img/2608.27168.jpg', 'data': {'categories': ['#games', '#open_source'], 'emoji': '🎮', 'ru': {'title': 'Генеративный рендеринг игр без зависимости от асsetов', 'desc': 'Magpie — это система генеративного рендеринга в реальном времени, которая разделяет логику игровых механик от процесса визуальной генерации. Система использует видеофундаментные модели для создания реалистичных визуальных эффектов, при этом игровой движок отвечает за обработку действий игрока и поддержание состояния мира. Такой подход позволяет сохранить полный контроль над игровыми правилами и взаимодействием, избегая нестабильности, характерной для генеративных моделей. Система значительно снижает требования к созданию графических ассетов на ранних этапах разработки прототипов игр.'}, 'en': {'title': 'Revolutionizing Game Prototyping with Generative Rendering', 'desc': "Magpie is a real-time generative rendering system designed for interactive games, which separates gameplay logic from visual generation. This separation allows game designers to focus on gameplay mechanics without being burdened by the need for extensive visual assets. By using a Render Server to generate visuals based on the game engine's output, Magpie enhances the efficiency of game prototyping. This approach not only preserves the designability and reproducibility of gameplay but also minimizes the asset requirements during the early stages of game development."}, 'zh': {'title': 'Magpie：游戏渲染的新纪元', 'desc': 'Magpie是一种实时生成渲染系统，它将游戏玩法逻辑与视觉生成分离，从而保持互动设计的灵活性，同时减少游戏原型对资产的需求。该系统允许设计师在游戏引擎中定义场景和规则，而在运行时，游戏引擎处理玩家的动作并维护世界状态。独立的渲染服务器则根据引擎生成的白盒帧生成视觉输出。Magpie为将生成模型应用于实时游戏渲染提供了系统级的实现路径，确保了游戏玩法的设计性和可重复性。'}}}, {'id': 'https://huggingface.co/papers/2608.26809', 'title': 'Thinking on Shots: Consistent Multi-Shot Video Editing with Agentic Reasoning', 'url': 'https://huggingface.co/papers/2608.26809', 'abstract': 'Abstract An agentic framework combining LLMs and VLMs enables consistent, multi-instruction editing of long multi-shot videos while preserving spatiotemporal structure.  Generated by thinkingmachines/Inkling-Small While generative AI has significantly advanced video editing, existing methods primarily focus on single-shot or short video clips. Editing long videos with multiple instructions remains a formidable challenge. Naive chunking strategies, e.g., fixed-duration segmentation, often lead to entity fragmentation, severe editing hallucinations, and disrupted temporal continuity. To bridge this gap, we introduce the Multi-Instruction Multi-Shot Long-Video Editing (MMLVE) task, which is structured around three core objectives: Cross-Shot Editing Consistency (CSEC), Multi-Instruction Decoupling (MID), and Zero-Destruction on Spatiotemporal Structure (ZDSS). To tackle these three unique challenges, we introduce an agentic editing framework that leverages the synergy of Large Language Models (LLMs) and Vision-Language Models (VLMs) to achieve shot-level video decoupling and precise instruction parsing. Furthermore, to comprehensively evaluate this task, we construct MMLVE-Bench, which is an MMLVE-focused dataset characterized by complex real-world spatiotemporal dynamics, high-density heterogeneous instructions, and sparse, random entity distributions. Three MMLVE-focused evaluation metrics are further exploited to assess the quality of the editing results. Extensive experiments demonstrate that our MMLVE-Agent outperforms existing closed-source SOTA approaches (e.g., Seedance 2.0), successfully eliminating editing hallucinations, preserving cross-shot editing consistency, and attaining seamless spatiotemporal transitions.', 'score': 3, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'f2e353fb35268df7', 'authors': ['Chenyang Wu', 'Fuchen Long', 'Binyuan Huang', 'Xinlong Sun', 'Xi Chen', 'Chun-Le Guo', 'Chongyi Li'], 'affiliations': ['Smart Creation Platform Department, Online Video BU, Tencent', 'VCIP, CS, Nankai University'], 'pdf_title_img': 'assets/pdf/title_img/2608.26809.jpg', 'data': {'categories': ['#open_source', '#agents', '#benchmark', '#video', '#hallucinations', '#multimodal', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Умное редактирование длинных видео с множеством инструкций через агентный фреймворк на основе LLM и VLM', 'desc': 'Статья представляет новую задачу MMLVE для редактирования длинных многокадровых видео с несколькими инструкциями одновременно. Авторы разработали агентный фреймворк, который объединяет большие языковые модели (LLM) и визуально-языковые модели (VLM) для точного анализа инструкций и разделения видео на отдельные кадры. Фреймворк решает три ключевые задачи: обеспечение консистентности редактирования между кадрами, декодирование множественных инструкций и сохранение пространственно-временной структуры видео без артефактов. В работе представлена новая база данных MMLVE-Bench с комплексными видео сценами и показано, что предложенный подход превосходит существующие закрытые модели в устранении галлюцинаций и сохранении качества переходов.'}, 'en': {'title': 'Revolutionizing Long Video Editing with AI Synergy', 'desc': 'This paper presents a new approach for editing long videos using an agentic framework that combines Large Language Models (LLMs) and Vision-Language Models (VLMs). The focus is on the Multi-Instruction Multi-Shot Long-Video Editing (MMLVE) task, which addresses challenges like maintaining consistency across shots and accurately following multiple editing instructions. The proposed method aims to prevent common issues such as entity fragmentation and editing hallucinations, ensuring smooth transitions in the video. To evaluate the effectiveness of this approach, the authors created a specialized dataset and metrics, demonstrating that their MMLVE-Agent outperforms existing methods in video editing quality.'}, 'zh': {'title': '长视频编辑的新突破：多指令多镜头框架', 'desc': '本论文提出了一种结合大型语言模型（LLMs）和视觉语言模型（VLMs）的代理框架，用于长视频的多指令编辑。该方法解决了现有技术在处理长视频时面临的挑战，如实体碎片化和时间连续性中断。我们定义了多指令多镜头长视频编辑（MMLVE）任务，并提出了三个核心目标：跨镜头编辑一致性、多指令解耦和时空结构零破坏。通过构建MMLVE-Bench数据集和评估指标，我们的实验表明，MMLVE-Agent在消除编辑幻觉和保持编辑一致性方面优于现有技术。'}}}, {'id': 'https://huggingface.co/papers/2608.26872', 'title': 'Self-OPD: On-Policy Distillation for Flow Matching Models without Teacher', 'url': 'https://huggingface.co/papers/2608.26872', 'abstract': "Abstract Self-OPD eliminates task-specific teachers in flow matching by using self-explored stochastic branches and normalized advantages to optimize the velocity field for multi-objective alignment.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD), which leverages a pre-trained, specialized teacher model to provide dense supervisory signals, has achieved significant success in Large Language Models (LLMs) and has recently been adapted to flow matching models. However, this paradigm suffers from two major issues: First, training a separate, task-specific teacher for every new objective incurs high computational costs. Second, the discrepancy between teacher and student distributions often leads to compounding errors along the generation trajectory. In this paper, we introduce Self-OPD, a teacher-free OPD framework for flow matching models that turns the student's own self-exploration into step-wise supervision. At each timestep, Self-OPD branches the deterministic next-state prediction into K stochastic SDE candidates, rolls them out with the ODE sampler, and compares their rewards against a deterministic self-reference baseline to obtain normalized advantages. The velocity field is optimized with an all-branch pull-push objective, where high-advantage branches attract the student and low-advantage branches repel it under direction-aware attenuation and SDE-variance normalization. For multi-objective alignment, Self-OPD fuses normalized scores at the reward level, avoiding direct gradient conflict. Experiments on single and mixed reward benchmarks show that Self-OPD outperforms prior RL and OPD methods without task-specific teachers.", 'score': 3, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '9b11b6de50f5ba01', 'authors': ['Shiyi Zhang', 'Mushui Liu', 'Yunze Tong', 'Wanggui He', 'Siyu Zou', 'Jinlong Liu', 'Yunlong Yu', 'Jian Song', 'Hao Jiang', 'Pipei Huang', 'Bo Zheng'], 'affiliations': ['Alibaba Group', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.26872.jpg', 'data': {'categories': [], 'emoji': '🌿', 'ru': {'title': 'Самоучение без учителя: от student-самоэксплорации к оптимальной генерации', 'desc': 'Self-OPD — это новый метод обучения моделей flow matching, который избегает использования отдельных учительских моделей для каждой задачи. Вместо этого алгоритм использует самоэксплорацию студента: на каждом шаге генерации создаются K стохастических ветвей, которые оцениваются относительно детерминированного базового решения через нормализованные преимущества. Поле скоростей оптимизируется специальной целевой функцией, где ветви с высокими наградами притягивают модель, а ветви с низкими наградами отталкивают её с учётом дисперсии SDE. Для работы с несколькими целями одновременно метод объединяет нормализованные оценки на уровне наград, что позволяет избежать конфликтов градиентов.'}, 'en': {'title': 'Self-OPD: Teacher-Free Learning for Enhanced Flow Matching', 'desc': 'The paper presents Self-OPD, a novel framework that eliminates the need for task-specific teacher models in flow matching by utilizing self-exploration and normalized advantages. This approach optimizes the velocity field for multi-objective alignment by generating multiple stochastic candidates and comparing their rewards to a self-referential baseline. By employing an all-branch pull-push objective, Self-OPD effectively guides the student model towards high-reward branches while avoiding conflicts in gradient updates. Experimental results demonstrate that Self-OPD surpasses previous reinforcement learning and on-policy distillation methods, showcasing its efficiency without the computational burden of separate teachers.'}, 'zh': {'title': '自我探索，优化多目标对齐', 'desc': 'Self-OPD是一种无教师的在线蒸馏框架，旨在优化流匹配模型的速度场，以实现多目标对齐。它通过自我探索的随机分支和归一化优势，消除了为每个新目标训练特定教师模型的高计算成本。该方法在每个时间步将确定性预测分支为多个随机候选，并通过比较奖励来优化模型。实验结果表明，Self-OPD在没有任务特定教师的情况下，优于之前的强化学习和在线蒸馏方法。'}}}, {'id': 'https://huggingface.co/papers/2608.26238', 'title': 'Procedura: Agentic 3D Modeling with Procedural Control', 'url': 'https://huggingface.co/papers/2608.26238', 'abstract': 'Abstract Procedura is a 3D modeling agent that generates editable, part-structured procedural assemblies with sharp geometry and validated articulation from text prompts.  Generated by thinkingmachines/Inkling-Small Native 3D generators now recover impressive mesh geometry from a single image. However, a dense mesh stays soft where a machined object should be sharp, it carries no part decomposition, and it exposes no parameter a user could edit. To address this, we explore the paradigm of 3D shape as code, leveraging and scaling the coding ability of an LLM for 3D modeling. We introduce Procedura, a novel 3D modeling agent framework that writes an object as a procedural assembly, a parametric program whose named parts are joined by typed, machine-checkable mates. From a text prompt, the agent plans the object as an assembly graph and writes the program part by part, solving each placement from the mated frames rather than guessing it, and admitting a part only once compile, mate, and connectivity checks pass. A decoupled vision critic then refines the assembly one diagnosed fix at a time. Moreover, the same graph carries per-part materials and a simulator-validated articulation. We evaluate on P3D-Bench under its assembly judge, and with the same judge on MechBench-36, our hard-surface benchmark. On both, Procedura outperforms state-of-the-art native 3D generators and every prior 3D-code agent on judged quality, produces the sharpest edges of any method we evaluate, and is the only one whose output is an editable, part-structured program.', 'score': 3, 'issue_id': 3181, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'a784a1ef698494ab', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark', '#dataset', '#3d'], 'emoji': '⚙️', 'ru': {'title': '3D-моделирование через код: процедурные сборки от текста', 'desc': 'Procedura — это агент для 3D-моделирования, который использует большую языковую модель (LLM) для генерации редактируемых процедурных сборок на основе текстовых описаний. Вместо создания плотных полигональных сеток, система представляет 3D-объекты как параметрические программы, где каждая деталь описывается кодом и соединяется с другими через типизированные математические сочленения. Агент планирует структуру объекта как граф сборки и пошагово генерирует код детали за деталью, проверяя корректность через компиляцию и валидацию соединений. Результат представляет собой острую геометрию с разложением на части, материалами и физически корректной артикуляцией, полностью редактируемую пользователем.'}, 'en': {'title': "Transforming Text to 3D: Procedura's Code-Driven Modeling Revolution", 'desc': 'Procedura is a 3D modeling agent that creates editable and structured 3D assemblies based on text prompts. It utilizes a large language model (LLM) to generate procedural code for 3D objects, ensuring that each part is accurately placed and connected through machine-checkable relationships. This approach allows for sharp geometry and validated articulation, addressing limitations of previous 3D generation methods that produced soft meshes without part decomposition. The framework has been evaluated against benchmarks and has shown superior performance in quality and editability compared to existing 3D modeling techniques.'}, 'zh': {'title': 'Procedura：可编辑的3D建模新纪元', 'desc': 'Procedura是一种3D建模代理，可以根据文本提示生成可编辑的、结构化的程序化组件，具有清晰的几何形状和经过验证的关节。它利用大型语言模型（LLM）的编码能力，将3D形状视为代码，创建一个程序化装配的框架。该代理通过规划装配图并逐部分编写程序，确保每个部件在连接和兼容性检查通过后才被接受。经过评估，Procedura在多个基准测试中超越了现有的3D生成器，生成的模型具有最锐利的边缘，并且是唯一一个输出可编辑的结构化程序的系统。'}}}, {'id': 'https://huggingface.co/papers/2608.25500', 'title': 'CaSKG: Counterfactual-Causal Skill Graphs for Scalable Agent Skill Retrieval', 'url': 'https://huggingface.co/papers/2608.25500', 'abstract': 'Abstract CaSKG calibrates procedural skill relations via counterfactual-causal graph construction to improve compact, executable retrieval for LLM agents.  Generated by thinkingmachines/Inkling-Small Reusable skill libraries allow large language model (LLM) agents to reuse procedural knowledge across tasks, but they also turn memory access into a challenging retrieval problem. Full-library prompting preserves coverage at high context cost, vector retrieval returns compact neighborhoods but treats skills as independent text, and graph-based retrieval can recover workflow context only when the edges that carry relevance are reliable. We propose CaSKG, a counterfactual-causal skill graph framework that calibrates procedural relations before retrieval. CaSKG first builds a high-recall directed candidate graph from semantic, lexical, input/output, and structural evidence, with repair evidence and an optional LLM judge further refining candidate scores. It then applies direction-conditioned textual counterfactual probes that remove, substitute, and reorder skill pairs, aggregates the evidence with Bayesian smoothing, and publishes a state-filtered weighted graph for task-conditioned expansion. The graph is constructed offline and used without changing the downstream agent policy or task interface. Across six LLM backbones on ALFWorld ID-140 and ScienceWorld U211, CaSKG achieves the highest task score in all twelve combinations of model and benchmark. Relative to Graph-of-Skills (GoS), it improves the six-model macro-average ScienceWorld score from 72.62 to 80.50 and ALFWorld success from 80.01\\% to 86.79\\%, while reducing mean environment steps on both benchmarks. Qualitative and ablation analyses further show that calibrated edges help retrieval preserve prerequisites, state-changing actions, verification routines, and final completion steps. These results position edge-confidence calibration as an effective route to compact and executable skill retrieval at scaleCode is available at: https://github.com/ZhiyuanLi218/Caskg .', 'score': 2, 'issue_id': 3181, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '3038485e02ee397d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark', '#training'], 'emoji': '🕸️', 'ru': {'title': 'Калибровка связей навыков через контрфактический граф для умного retrieval', 'desc': 'CaSKG — это фреймворк для построения взвешенного графа навыков, который калибрует отношения между процедурными умениями с помощью контрфактических причинных проб перед тем, как использовать их для retrieval. Система строит высокоточный граф-кандидат из семантических, лексических и структурных признаков, затем применяет текстовые контрфактические зонды для удаления, подстановки и переупорядочивания пар навыков, агрегируя доказательства байесовским сглаживанием. Граф конструируется офлайн и используется без изменения политики агента, что позволяет компактно и эффективно извлекать релевантные навыки для LLM-агентов. Метод демонстрирует значительное улучшение производительности на бенчмарках ALFWorld и ScienceWorld, повышая точность и сокращая количество шагов выполнения задач.'}, 'en': {'title': 'Calibrating Skills for Efficient Retrieval in LLMs', 'desc': 'The paper introduces CaSKG, a framework that enhances the retrieval of procedural skills for large language model (LLM) agents by constructing a counterfactual-causal graph. This graph is built using various types of evidence, including semantic and structural information, to ensure high recall of relevant skills. By applying counterfactual probes and Bayesian smoothing, CaSKG calibrates the relationships between skills, improving the accuracy of retrieval while maintaining efficiency. The results demonstrate that CaSKG significantly outperforms previous methods, leading to better task performance across multiple benchmarks.'}, 'zh': {'title': '提升LLM代理的技能检索效率', 'desc': 'CaSKG是一种通过反事实因果图构建来校准程序技能关系的方法，旨在提高大型语言模型（LLM）代理的检索效率。该方法首先构建一个高召回率的有向候选图，利用语义、词汇、输入/输出和结构证据来增强技能关系的准确性。然后，CaSKG应用方向条件的文本反事实探针，调整技能对的顺序和组合，最终生成一个经过状态过滤的加权图，以便于任务扩展。实验结果表明，CaSKG在多个基准测试中显著提高了任务得分，证明了边缘置信度校准在大规模技能检索中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.23172', 'title': 'CaRGo-T: Causal Reasoning Graph-of-Thought improves Multimodal Humor Comprehension', 'url': 'https://huggingface.co/papers/2608.23172', 'abstract': 'Abstract CaRGo-T improves multimodal humor understanding by modeling causal relationships as graph-based reasoning structures interpreted by vision-language models.  Generated by thinkingmachines/Inkling-Small Large-scale vision-language models (VLMs) have demonstrated remarkable versatility across a wide range of multimodal tasks. However, understanding humor remains challenging because humorous content often depends on subtle interactions among entities, events, context, and implicit relationships across image and text modalities. These interactions can involve complex chains of reasoning that are difficult to capture through conventional prompting or linear chain-of-thought reasoning. In this work, we propose CaRGo-T (Causal Reasoning Graph-of-Thought), a reasoning framework that represents the causal and contextual relationships underlying multimodal humor as a lightweight graph-based reasoning structure. The graph is serialized into a code-based representation generated by a VLM, which can subsequently be interpreted by the same or a different VLM to produce the final prediction in zero-shot or in-context learning settings. We evaluate CaRGo-T on humor understanding and humor detection across four datasets spanning diverse forms of comedic content, including satire, sarcasm, and memes. Experiments with state-of-the-art commercial and open-source VLMs show that CaRGo-T consistently improves performance over existing reasoning-based baselines, achieving gains of approximately 1-20% on humor understanding and 1-3% on humor detection. Further analysis using mutual information indicates that the reasoning representations produced by CaRGo-T contain more information relevant to the target output than those generated by baseline reasoning approaches. Code is available at https://github.com/abhi1nandy2/CaRGo-T.', 'score': 2, 'issue_id': 3181, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '66cb499ba5a83309', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#open_source', '#reasoning', '#benchmark', '#multimodal', '#graphs'], 'emoji': '😂', 'ru': {'title': 'Графы причинности для понимания юмора в мультимодальных моделях', 'desc': 'CaRGo-T — это фреймворк рассуждений, который моделирует причинно-следственные отношения в мультимодальном контенте через граф-структуры для лучшего понимания юмора. Система представляет сложные взаимодействия между объектами, событиями и контекстом в виде легковесного графа, который затем кодируется в текстовое представление для интерпретации видео-языковыми моделями. Метод протестирован на четырёх датасетах с различными формами комического контента, включая сатиру, сарказм и мемы, и показывает улучшение производительности на 1-20% при распознавании юмора. Анализ взаимной информации подтверждает, что представления, генерируемые CaRGo-T, содержат больше релевантной информации для целевого предсказания по сравнению с базовыми подходами.'}, 'en': {'title': 'Unlocking Humor with Graph-Based Reasoning', 'desc': 'The paper introduces CaRGo-T, a novel framework designed to enhance the understanding of humor in multimodal contexts by utilizing graph-based reasoning structures. It addresses the challenges of humor comprehension, which often relies on complex interactions between visual and textual elements that traditional models struggle to capture. By representing causal and contextual relationships as graphs, CaRGo-T allows vision-language models to better interpret and generate humorous content. Experimental results demonstrate that this approach significantly improves performance in humor understanding and detection across various comedic formats compared to existing methods.'}, 'zh': {'title': 'CaRGo-T：提升幽默理解的因果推理框架', 'desc': 'CaRGo-T是一种改进多模态幽默理解的方法，通过建模因果关系作为图形推理结构，利用视觉-语言模型进行解释。幽默内容通常依赖于实体、事件、上下文和隐含关系之间的微妙互动，这些互动涉及复杂的推理链，传统的提示或线性推理难以捕捉。CaRGo-T将这些因果和上下文关系表示为轻量级的图形推理结构，并通过视觉-语言模型生成代码表示，便于后续的预测。实验结果表明，CaRGo-T在幽默理解和检测方面的表现优于现有的推理基线，提升幅度达到1-20%。'}}}, {'id': 'https://huggingface.co/papers/2608.26993', 'title': 'Aphanta: Diagnosing Task-Aligned Image-Edited Intermediates for Multimodal Reasoning', 'url': 'https://huggingface.co/papers/2608.26993', 'abstract': 'Abstract Aphanta evaluates when image-editing intermediates improve multimodal reasoning by testing direct, editor-generated, and idealized visual states across tasks.  Generated by thinkingmachines/Inkling-Small Explicit visual intermediates can help multimodal large language models (MLLMs) externalize spatial evidence and updated visual states, but their utility depends on whether an image editor can faithfully realize the required transformation. We introduce Aphanta, an automated task-discovery and closed-loop diagnostic framework for the MLLM -> image editor -> MLLM pipeline. Aphanta evaluates three conditions---direct reasoning, reasoning with an editor-generated intermediate, and reasoning with an idealized reference intermediate---to separate potential visual headroom from the practical utility of current editors. Across 20 candidate tasks and multiple editor--MLLM combinations, we find that utility is strongly task-conditioned. Gains concentrate in visual cue injection, grounding, and counterfactual state realization, whereas intermediates requiring symbol-sensitive construction or structural extrapolation are substantially less reliable. On the selected positive-task subset, our consolidated Qwen pipeline improves the mean task score from 0.343 to 0.445 (+10.2 points; +29.7% relative), while the full study also retains filtered and unsuccessful tasks to expose the boundary. These results position image editing as a specialized visual workspace rather than a universal reasoning mechanism, and establish Aphanta as a reusable protocol for measuring task--representation alignment, editor realization, and downstream pipeline utility.', 'score': 1, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '0ba521d03f4b8adc', 'authors': ['Hengyuan Xu', 'Wei Cheng', 'Yumeng Ji', 'Xuanyang Zhang', 'Xianfang Zeng', 'Gang Yu', 'Xingjun Ma'], 'affiliations': ['1', '2', '3'], 'pdf_title_img': 'assets/pdf/title_img/2608.26993.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#cv'], 'emoji': '🖼️', 'ru': {'title': 'Редактирование изображений как специализированное рабочее пространство для мультимодальных моделей', 'desc': 'В работе представлена Aphanta — автоматизированная диагностическая система для оценки эффективности редакторов изображений в конвейере мультимодальных больших языковых моделей. Исследование тестирует три сценария: прямое рассуждение модели, рассуждение с помощью отредактированного изображения и рассуждение с идеальным изображением-эталоном. Авторы обнаружили, что полезность редакторов сильно зависит от типа задачи и наиболее эффективна для внедрения визуальных подсказок и создания контрфактических состояний. На оптимальном наборе задач интегрированный конвейер улучшил результаты на 29.7%, позиционируя редактирование изображений как специализированный инструмент, а не универсальный механизм рассуждения.'}, 'en': {'title': 'Enhancing Multimodal Reasoning with Image Editing Intermediates', 'desc': 'Aphanta is a framework that assesses how image-editing intermediates can enhance multimodal reasoning in large language models (MLLMs). It tests different scenarios, including direct reasoning and using editor-generated visuals, to determine their effectiveness in various tasks. The study reveals that the usefulness of these intermediates varies significantly depending on the task, with certain tasks benefiting more from visual cues and grounding. Overall, Aphanta serves as a tool to evaluate the alignment between tasks and representations, highlighting the role of image editing in improving reasoning capabilities.'}, 'zh': {'title': 'Aphanta：图像编辑提升多模态推理的关键', 'desc': 'Aphanta 是一个评估图像编辑中介如何改善多模态推理的框架。它通过测试直接推理、编辑生成的中介和理想化视觉状态来分析不同条件下的效果。研究发现，图像编辑的实用性与任务密切相关，尤其在视觉线索注入和基础对接方面表现良好。Aphanta 为测量任务与表示对齐、编辑实现和下游管道实用性提供了可重复使用的协议。'}}}, {'id': 'https://huggingface.co/papers/2608.27454', 'title': 'WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution', 'url': 'https://huggingface.co/papers/2608.27454', 'abstract': 'Abstract WikiSkill co-evolves reusable agent skills with a persistent knowledge base to systematically accumulate experience and improve performance across models.  Generated by thinkingmachines/Inkling-Small Agent skills package specialized knowledge and workflows into reusable resources that extend AI agent capabilities. Recent work automatically discovers such skills from agent experience, which enables agents to progressively adapt through interaction. However, the insights that guide skill development typically remain scattered across optimization histories, limiting their systematic reuse across iterations. We introduce WikiSkill, a framework that co-evolves agent skills with a persistent knowledge base (wiki). At a high level, WikiSkill separates raw execution experience, accumulated knowledge, and executable skills, while continuously consolidating experience into the wiki, which subsequent skill updates can build on. Across diverse benchmarks and models, WikiSkill consistently outperforms state-of-the-art skill-evolution methods and improves over no-skill baselines in most model-benchmark settings. We find that skill evolution complements model scaling: larger models generally benefit more from evolved skills, while smaller models with skills can outperform substantially larger models without them. We also find that evolved skills transfer effectively across models and model families, and skills evolved by other models can outperform self-evolved skills. Finally, our ablation studies confirm that persistent knowledge accumulation in the wiki is critical for effective skill evolution. These results demonstrate the benefits of systematically accumulating and refining agent experience for developing reusable and transferable skills.', 'score': 1, 'issue_id': 3181, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'd5b281c9eb4a5c6a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark', '#training'], 'emoji': '📚', 'ru': {'title': 'Коллективная память агентов: эволюция навыков через накопленное знание', 'desc': 'В статье представлена система WikiSkill, которая совместно развивает переиспользуемые навыки AI агентов вместе с постоянной базой знаний. Ключевая идея заключается в разделении опыта выполнения, накопленного знания и исполняемых навыков, где информация из истории оптимизации систематически консолидируется в wiki для последующего переиспользования. Экспериментальные результаты показывают, что эволюция навыков хорошо дополняет масштабирование моделей и обеспечивает эффективный трансфер знаний между различными архитектурами. Полученные навыки значительно улучшают производительность как больших, так и малых языковых моделей, демонстрируя важность систематического накопления опыта для развития переносимых компетенций агентов.'}, 'en': {'title': 'Empowering AI Agents with Reusable Skills through Knowledge Co-evolution', 'desc': 'The paper introduces WikiSkill, a framework designed to enhance AI agents by co-evolving reusable skills alongside a persistent knowledge base. This approach allows agents to systematically accumulate experience and improve their performance over time, leveraging insights from past interactions. By separating execution experience, accumulated knowledge, and executable skills, WikiSkill enables continuous learning and adaptation across different models. The results show that WikiSkill outperforms existing methods and highlights the importance of knowledge accumulation for effective skill evolution.'}, 'zh': {'title': 'WikiSkill：系统积累与进化代理技能的框架', 'desc': 'WikiSkill是一个框架，通过与持久知识库共同进化代理技能，系统地积累经验并提高模型性能。它将原始执行经验、积累的知识和可执行技能分开，同时不断将经验整合到知识库中，以便后续的技能更新可以基于这些经验。研究表明，WikiSkill在多种基准测试和模型中始终优于最先进的技能进化方法，并且在大多数模型-基准设置中改善了无技能的基线。通过持续的知识积累，WikiSkill有效地促进了可重用和可转移技能的发展。'}}}, {'id': 'https://huggingface.co/papers/2608.25518', 'title': 'Agentic Game Development as a Verifiable Trajectory Data Engine for Scaling World Models', 'url': 'https://huggingface.co/papers/2608.25518', 'abstract': 'Abstract Game engines provide executable verification and long-horizon trajectories for reinforcement learning post-training of spatial world models, motivating a human-engine verification paradigm.  Generated by thinkingmachines/Inkling-Small A common strategy for scaling world models is to train on more crawled video with more compute. We argue that this strategy is inefficient: scaling world models also requires a recursive data engine that offers grounded reward signals. The success of code agents illustrates why this matters. As code is executable, compilers and runtimes can provide high-quality rewards for Reinfor
