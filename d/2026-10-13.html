    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.35965', 'title': 'Systematic Multi-Agent Vision-and-Language Navigation: Formulation, Benchmark, and Method', 'url': 'https://huggingface.co/papers/2609.35965', 'abstract': "Abstract  Vision-and-Language Navigation (VLN) has largely focused on a single agent following a single instruction, yet many real-world applications require teams of robots to tackle tasks beyond the capabilities of any individual agent. We present Systematic Multi-Agent Vision-and-Language Navigation, providing, to our knowledge, the first systematic formalization of multi-agent VLN as a constrained coordination problem: each mission consists of subtasks carrying dependency and resource constraints (presence locks and holding chains). A verified four-stage crafting pipeline instantiates the task as MAVLN, comprising 11,724 episodes across 145 scenes with teams of up to four agents under three instruction regimes, accompanied by tailored constraint-aware metrics. We further present TRISS, a coordination-ready navigation system coupling an LLM-based subtask scheduler, a shared topological memory that turns each agent's exploration into team knowledge, and a conflict-aware execution mechanism that realizes simultaneous intentions as collision-free routes. Extensive experiments establish TRISS as a comprehensive baseline and reveal substantial room for improvement across scheduling, planning, and execution, highlighting the challenges of coordinating under MAVLN task constraints. Project page: https://xyz9911.github.io/mavln.", 'score': 9, 'issue_id': 3402, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'aea255fc85da5d61', 'pdf_title_img': 'assets/pdf/title_img/2609.35965.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#cv', '#agents', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Командная координация роботов для сложных навигационных задач с языковыми инструкциями', 'desc': 'В статье представлена задача мультиагентной навигации с использованием зрения и языка (MAVLN), где команда роботов должна выполнить миссию с взаимозависимыми подзадачами и ограничениями ресурсов. Авторы создали датасет с 11,724 эпизодами в 145 сценах, включающих команды из до четырёх агентов с различными инструкциями. Они предложили систему TRISS, которая использует LLM для планирования подзадач, совместную топологическую память для накопления знаний команды и механизм разрешения конфликтов для координации движений. Эксперименты показывают значительный потенциал для улучшений в области распределения задач, планирования и выполнения координированных действий в мультиагентных сценах.'}, 'en': {'title': 'Collaborative Navigation: Teamwork in Vision-and-Language Tasks', 'desc': 'This paper introduces a new approach to Vision-and-Language Navigation (VLN) that involves multiple agents working together to complete tasks. It formalizes multi-agent VLN as a coordination problem, where tasks are divided into subtasks with specific dependencies and resource constraints. The authors present a system called TRISS, which includes a scheduler and a shared memory to help agents coordinate their actions and avoid conflicts. Through extensive testing, they demonstrate the effectiveness of TRISS and identify areas for further improvement in multi-agent task execution.'}, 'zh': {'title': '多智能体协作导航的新方法', 'desc': '本文提出了一种系统化的多智能体视觉与语言导航（VLN）方法，解决了多个机器人协同完成任务的问题。我们将多智能体VLN形式化为一个受约束的协调问题，任务由具有依赖关系和资源约束的子任务组成。研究中介绍了一个四阶段的任务构建流程，创建了MAVLN数据集，包含11724个场景和最多四个智能体的任务。我们还提出了TRISS系统，结合了基于大语言模型的子任务调度器和共享拓扑记忆，能够有效协调智能体的导航。'}}}, {'id': 'https://huggingface.co/papers/2610.13630', 'title': 'Multi-Stream Attention Residuals', 'url': 'https://huggingface.co/papers/2610.13630', 'abstract': 'Abstract  Attention Residuals (AttnRes) enables content-dependent retrieval over network depth, which can be viewed as single-stream softmax attention along the depth axis. Inspired by the success of multi-head attention along the sequence axis, we introduce Multi-Stream Attention Residuals (MSAR), an extension of AttnRes that generalizes this mechanism to multi-head depth attention, yielding substantial performance gains with minimal additional overhead. MSAR draws stream diversity from sequence context through multi-scale causal convolutions, allowing different heads to retrieve historical representations through distinct contextual views while preserving the integrity of the hidden representation. The retrieved streams are combined through lightweight adaptive mixing to generate the single-stream layer input. By retaining single-stream sources and expanding them on demand, MSAR supports multi-stream computation without requiring persistent multi-stream storage or communication. Across all 12 downstream benchmarks at the 18B and 28B MoE scales, MSAR consistently outperforms prior residual variants, including standard residual connections, manifold-constrained Hyper-Connections (mHC), and AttnRes. Scaling-law experiments yield an iso-loss compute speedup of 1.58times over the standard residual baseline, compared with 1.35times for AttnRes and 1.30times for mHC. These results make MSAR a promising residual architecture for large-scale pre-training.', 'score': 7, 'issue_id': 3402, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'c9629e3fdde3bc14', 'authors': ['Xiaohan Qin', 'Xiangdong Zhang', 'Tuo Dai', 'Sunan Zou', 'Huaijin Wu', 'Yebin Yang', 'Zhuo Xia', 'Lin Yao', 'Yuliang Liu', 'Junchi Yan'], 'affiliations': ['Dots Studio, Xiaohongshu Inc.', 'School of AI, Shanghai Jiao Tong University', 'School of CS, Peking University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.13630.jpg', 'data': {'categories': [], 'emoji': '🔗', 'ru': {'title': 'Многоголовочное внимание вглубь сети для эффективных остаточных соединений', 'desc': 'В работе предлагается Multi-Stream Attention Residuals (MSAR) — метод, который расширяет механизм внимания на ось глубины нейронной сети, позволяя извлекать представления из предыдущих слоёв с различных контекстных перспектив. Основная идея заключается в использовании многоголовочного внимания вдоль оси глубины сети, аналогично успешному применению этого подхода вдоль оси последовательности. Разнообразие потоков в MSAR достигается благодаря многомасштабным причинным свёртками, которые позволяют разным головам внимания выбирать исторические представления через отличающиеся контекстные виды. Экспериментально показано, что MSAR обеспечивает ускорение вычислений в 1.58 раза на наборах данных масштаба 18B и 28B MoE параметров, превосходя стандартные остаточные соединения и предыдущие методы.'}, 'en': {'title': 'Enhancing Attention with Multi-Stream Residuals', 'desc': "The paper introduces Multi-Stream Attention Residuals (MSAR), an advanced mechanism for enhancing attention in neural networks. MSAR builds on the concept of Attention Residuals (AttnRes) by incorporating multi-head attention along the depth axis, which improves performance while keeping computational costs low. It utilizes multi-scale causal convolutions to allow different attention heads to access varied historical representations, thus enriching the model's contextual understanding. The results show that MSAR significantly outperforms existing residual architectures in various benchmarks, making it a strong candidate for large-scale pre-training tasks."}, 'zh': {'title': '多流注意力残差网络：提升性能的新方法', 'desc': '本文介绍了一种新的多流注意力残差网络（MSAR），它在网络深度上实现了内容依赖的检索。MSAR是对现有注意力残差（AttnRes）的扩展，能够通过多头深度注意力机制显著提高性能。该方法利用多尺度因果卷积，从序列上下文中提取流的多样性，使不同的头能够通过不同的上下文视角检索历史表示。实验结果表明，MSAR在多个基准测试中表现优于传统的残差连接，显示出其在大规模预训练中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.11765', 'title': 'Thinking Inertia: LLMs Keep Thinking When Told Not To', 'url': 'https://huggingface.co/papers/2610.11765', 'abstract': 'Abstract  Large Language Models (LLMs) increasingly ship with explicit "thinking modes", yet their counterpart, "no-thinking", has received far less attention. We study LLMs\' no-thinking behavior along two axes. a. How to measure no-thinking? Prior work typically defines no-thinking through proxies such as a disabled thinking mode or the absence of long traces. These proxies are unreliable: disabled thinking modes may still emit reasoning, while long traces may contain filler rather than genuine inference. We instead normalize each response into a pre-answer trace and final answer, and evaluate it at three levels: (i) Empty-Thinking Rate for strict answer-only compliance; (ii) instruction-aware Question-Pre-answer Relevance for similarity between the question and pre-answer trace; and (iii) LLM-as-judge Explicit Inference Rate for visible explicit inference. Together, these metrics distinguish answer-only output, relevant but non-inferential text, and explicit inference. b. How does no-thinking vary across tasks and models? We evaluate six prompting interventions on six LLMs across Boolean, multiple-choice, and open-ended questions. We find that explicit no-think controls cannot reliably eliminate visible inference. Models instead exhibit "Thinking Inertia": explicit inference persists even under strict controls and becomes more prevalent as the answer space opens. Accuracy remains stable on Boolean and multiple-choice tasks, whereas open-ended tasks reveal a trade-off between answer-only compliance and task accuracy. Rewriting the same questions across answer spaces shows that supplying candidate answers makes answer-only responses easier to produce. These findings establish no-thinking as a non-trivial capability: stopping explicit reasoning cannot be assumed from model settings or instructions alone and deserves systematic evaluation alongside reasoning ability.', 'score': 5, 'issue_id': 3402, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '9131388e94a5366d', 'authors': ['Dianqiao Lei', 'Kevin Qinghong Lin', 'Pan Lu', 'Philip Torr', 'James Zou'], 'affiliations': ['STANFORD UNIVERSITY', 'TSINGHUA UNIVERSITY', 'UNIVERSITY OF OXFORD'], 'pdf_title_img': 'assets/pdf/title_img/2610.11765.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Инерция мышления: почему модели не могут остановить рассуждение по команде', 'desc': "В статье исследуется поведение больших языковых моделей в режиме без явного мышления, в противоположность режимам с активированным 'thinking'. Авторы предлагают новые метрики для измерения качества ответов без рассуждений: метрика пустого мышления для проверки ответов без предварительных рассуждений, релевантность вопроса и предварительного ответа, и оценка явных логических выводов через LLM-судью. Исследование показало, что модели демонстрируют 'инерцию мышления': явные рассуждения сохраняются даже при строгих ограничениях и усиливаются по мере расширения пространства ответов. Работа подчёркивает, что способность моделей давать ответы без видимых рассуждений является сложным навыком, требующим систематической оценки наряду с оценкой способности к логическому анализу."}, 'en': {'title': 'Understanding No-Thinking in Large Language Models', 'desc': "This paper investigates the 'no-thinking' behavior of Large Language Models (LLMs), which is less studied compared to their 'thinking modes'. It introduces new metrics to measure no-thinking, focusing on how strictly models can provide answers without engaging in reasoning. The study finds that even with controls in place, models often display 'Thinking Inertia', where inference continues to appear in responses. Additionally, the research highlights a trade-off between compliance with answer-only outputs and accuracy in open-ended tasks, suggesting that no-thinking is a complex capability that requires careful evaluation."}, 'zh': {'title': '无思考能力：超越模型设置的复杂性', 'desc': '本文研究了大型语言模型（LLMs）在"无思考"状态下的表现。我们提出了一种新的测量方法，通过规范化每个响应为预回答轨迹和最终回答，评估无思考行为的三个层面。研究发现，尽管有明确的无思考控制，模型仍然表现出"思维惯性"，即在严格控制下显式推理依然存在。我们的结果表明，无思考能力是一个复杂的特性，不能仅通过模型设置或指令来假设，值得与推理能力一起进行系统评估。'}}}, {'id': 'https://huggingface.co/papers/2610.13832', 'title': 'SpatialASM: Internalizing Active Mentalization for Spatial Reasoning', 'url': 'https://huggingface.co/papers/2610.13832', 'abstract': 'Abstract  When solving complex spatial reasoning tasks, ordinary humans naturally revisit the scenes from task-relevant viewpoints and mentally reconstruct the spatial layouts from those viewpoints. But can Large Vision-Language Models (LVLMs) proactively think in the same way? We term this ability Active Spatial Mentalization (ASM), an intrinsic component of visual intelligence that remains substantially underdeveloped in current LVLMs. To bridge this gap, we introduce SpatialASM, a scalable framework to internalize ASM into LVLMs through training-time spatial simulation. SpatialASM employs an allocentric novel-view generator to ground hypothetical viewpoints in visual evidence and produces two complementary forms of supervision: i) explicit ASM trajectories that teach LVLMs when and how to adaptively invoke view planning and imagination during spatial reasoning, and ii) automatically-constructed perspective-taking tasks that further strengthens viewpoint-conditioned scene imagination. On seven benchmarks spanning relatively perception-oriented spatial understanding to more challenging tasks requiring multi-image, cross-view and viewpoint-transformation reasoning, SpatialASM yields performance gain on LVLMs of four LVLM backbones in spatial reasoning while retaining their original general vision capabilities. The experimental results demonstrate that our approach improves average accuracy across the seven spatial benchmarks. And the synthesis of ASM trajectories provides a scalable pathway to alleviate the scarcity of spatial Chain-of-Thought (CoT) supervision for eliciting active viewpoint exploration and mental scene simulation.', 'score': 3, 'issue_id': 3402, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '5305650530df4d8b', 'authors': ['Yuhong Liu', 'Shenxi Wu', 'Junyi Chi', 'Beichen Zhang', 'Xuanlang Dai', 'Jiaqi Wang', 'Yuhang Zang', 'Dahua Lin'], 'affiliations': ['CPII under InnoHK', 'Fudan University', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.13832.jpg', 'data': {'categories': ['#training', '#benchmark', '#multimodal', '#cv'], 'emoji': '🔄', 'ru': {'title': 'Обучение моделей видения активно переключать точки зрения для пространственного мышления', 'desc': 'Работа посвящена развитию способности больших видео-языковых моделей (LVLM) к активной пространственной ментализации — умению мысленно перестраивать сцены с разных точек зрения для решения пространственных задач. Авторы предлагают SpatialASM, фреймворк, который внедряет эту способность в LVLM через симуляцию пространственных сцен во время обучения, используя генератор альтернативных видов. Метод генерирует две формы обучающего сигнала: явные траектории ментализации, которые обучают модель планировать переключение точек зрения, и автоматические задачи смены перспективы. Эксперименты на семи бенчмарках показывают значительные улучшения в пространственных рассуждениях, сохраняя при этом общие способности моделей в обработке визуальной информации.'}, 'en': {'title': 'Enhancing Spatial Reasoning in LVLMs with Active Spatial Mentalization', 'desc': 'This paper introduces a new concept called Active Spatial Mentalization (ASM), which refers to the ability of models to think and visualize scenes from different viewpoints, similar to how humans do. The authors propose a framework named SpatialASM that enhances Large Vision-Language Models (LVLMs) by incorporating training-time spatial simulation to develop this ability. SpatialASM uses a novel-view generator to create hypothetical viewpoints based on visual evidence and provides two types of training: explicit trajectories for adaptive view planning and perspective-taking tasks to improve scene imagination. The results show that SpatialASM significantly boosts the spatial reasoning performance of LVLMs across various benchmarks while maintaining their general vision capabilities.'}, 'zh': {'title': '提升视觉语言模型的空间推理能力', 'desc': '在解决复杂的空间推理任务时，普通人会从与任务相关的视角重新审视场景，并在脑中重建空间布局。本文提出了一种名为主动空间心理化（ASM）的能力，认为这是视觉智能的重要组成部分，但目前的大的视觉语言模型（LVLMs）在这方面仍然不足。为了解决这个问题，我们引入了SpatialASM，这是一个可扩展的框架，通过训练时的空间模拟将ASM内化到LVLMs中。实验结果表明，SpatialASM在七个基准测试中提高了LVLMs的空间推理性能，同时保持了其原有的视觉能力。'}}}, {'id': 'https://huggingface.co/papers/2610.09396', 'title': 'ARCS: Towards Precise Text-to-SQL via Structured Disambiguation', 'url': 'https://huggingface.co/papers/2610.09396', 'abstract': "Abstract  As text-to-SQL systems move beyond demonstrations toward real-world deployment, ambiguity in user questions becomes a primary source of errors. Such ambiguities are often subtle, domain- or data-specific, and can silently cause system outputs to deviate from the user's true intent. Ambiguity is traditionally addressed through conversational clarification, which is often inefficient, cognitively demanding, and poorly aligned with real-world user workflows. We propose structured disambiguation, a new paradigm in which ambiguity is resolved through explicit, constrained interactions rather than free-form dialogue. We construct ARCS (Ambiguity Resolution Corpus for SQL), the first text-to-SQL benchmark featuring naturally occurring, unconstrained ambiguities over real-world databases, with complete annotations of all valid ambiguity points, interpretations, and SQL queries. Experimental results show that text-to-SQL remains challenging in the presence of ambiguity: gpt-6-sol achieves only 51% end-to-end execution accuracy, and no open-source model exceeds 27%.", 'score': 1, 'issue_id': 3402, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '34060e69ba1ef335', 'authors': ['Yihao Hu', 'Yanlin Feng', 'Naoki Otani', 'Nikita Bhutani'], 'affiliations': ['Duke University', 'Megagon Labs'], 'pdf_title_img': 'assets/pdf/title_img/2610.09396.jpg', 'data': {'categories': [], 'emoji': '❓', 'ru': {'title': 'Структурированное разрешение неоднозначности в text-to-SQL системах', 'desc': 'В работе рассматривается проблема неоднозначности в системах text-to-SQL при переходе от тестовых примеров к реальному развертыванию. Авторы предлагают новую парадигму структурированной дизамбигуации, где неоднозначность разрешается через явные, ограниченные взаимодействия вместо свободного диалога. Они создали ARCS — первый бенчмарк для text-to-SQL с естественно возникающей неоднозначностью над реальными базами данных с полными аннотациями всех неоднозначных точек и интерпретаций. Эксперименты показывают, что даже GPT-4 достигает только 51% точности, что подчеркивает сложность задачи.'}, 'en': {'title': 'Resolving Ambiguity in Text-to-SQL with Structured Interactions', 'desc': "This paper addresses the challenges faced by text-to-SQL systems when users pose ambiguous questions. Ambiguities can lead to incorrect outputs that do not reflect the user's true intent, especially in real-world applications. The authors introduce a method called structured disambiguation, which focuses on resolving ambiguities through specific interactions instead of open-ended conversations. They also present ARCS, a new benchmark that highlights these ambiguities in SQL queries, revealing that current models struggle significantly with accuracy in ambiguous scenarios."}, 'zh': {'title': '结构化消歧：提升文本到SQL的准确性', 'desc': '随着文本到SQL系统从演示走向实际应用，用户问题中的模糊性成为主要错误来源。这种模糊性往往是微妙的、特定于领域或数据的，可能会导致系统输出偏离用户的真实意图。传统上通过对话澄清来解决模糊性，但这种方法效率低下，认知负担重，且与实际用户工作流程不匹配。我们提出了一种结构化消歧的新范式，通过明确的、受限的交互来解决模糊性，而不是自由形式的对话。'}}}, {'id': 'https://huggingface.co/papers/2609.33304', 'title': 'Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents', 'url': 'https://huggingface.co/papers/2609.33304', 'abstract': "Abstract  Personal Graphical User Interface (GUI) agents rely on interaction history to infer what a user wants from ambiguous instructions and to anticipate recurring routines. Existing approaches retrieve task-relevant history and append it to the policy's context, implicitly assuming that experience relevant to a task remains useful for each decision within it. We find that this help is largely spent at the first decision: retrieved history strongly improves the opening step of an episode, yet provides little sustained benefit over the remaining 90\\% of steps, and offers weak guidance on whether a proactive suggestion is warranted. A relevant record may tell the agent where to begin, but not which past action applies to the current screen or whether a routine is due now. The underlying issue is that relevance does not imply applicability}: relevance is determined at the task level, whereas applicability depends on the situation at decision time. We therefore recast personalization as experience activation and introduce ExpActivator, a training-free framework that activates only the experience applicable to the current situation. During execution, ExpActivator matches each new screen to historical states in the frozen GUI backbone's latent space and supplies the corresponding action as a reference. Before execution, it activates a recurring intent only when the current time and scenario provide sufficient support, and otherwise abstains. Across four GUI backbones, ExpActivator improves within-trajectory step success by 28\\% on average, achieves the best personalized execution on every backbone while using about one-fifth as many history tokens, and reaches approximately 2.3times the Matthews correlation coefficient of the strongest proactive baseline. Experience pays where it is activated, not where it is appended.", 'score': 1, 'issue_id': 3402, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': 'e562bde63fb3355a', 'authors': ['Fuyao Zhang', 'Xuan Wang', 'Zherui Li', 'Jiaming Zhang', 'Longtao Huang', 'Wei Yang Bryan Lim'], 'affiliations': ['Alibaba', 'NTU'], 'pdf_title_img': 'assets/pdf/title_img/2609.33304.jpg', 'data': {'categories': ['#agents'], 'emoji': '⚙️', 'ru': {'title': 'Активация опыта вместо его добавления: персонализация GUI агентов через применимость, а не релевантность', 'desc': 'Статья предлагает новый подход к персонализации GUI агентов, которые взаимодействуют с графическим интерфейсом на основе истории действий пользователя. Авторы выявили, что традиционный метод добавления релевантной истории в контекст политики малоэффективен: история помогает только на первом шаге, но не влияет на остальные 90% решений. Они предложили ExpActivator — фреймворк, который активирует только применимый опыт, сопоставляя текущий экран с исторических состояний в латентном пространстве и определяя, действительно ли нужно применить проактивное предложение. Экспериментальные результаты демонстрируют 28% улучшение успешности шагов внутри траектории и достижение лучших результатов при использовании в пять раз меньше токенов истории.'}, 'en': {'title': 'Activating Relevant Experience for Better GUI Decisions', 'desc': 'This paper discusses a new approach for Personal Graphical User Interface (GUI) agents that improves how they use past interaction history to make decisions. The authors introduce a framework called ExpActivator, which focuses on activating only the relevant past experiences that apply to the current situation, rather than just appending all past experiences to the decision-making process. They found that traditional methods provide limited benefits after the initial decision, as relevance does not guarantee applicability in different contexts. By using ExpActivator, the agents showed a significant improvement in decision-making success, demonstrating that experience is most valuable when it is contextually activated.'}, 'zh': {'title': '激活经验，提升决策效率', 'desc': '个人图形用户界面（GUI）代理依赖于交互历史来推断用户的意图，并预测重复的操作。现有方法假设与任务相关的经验在每个决策中都是有用的，但研究发现这种帮助主要体现在决策的第一步，后续步骤的效果有限。我们提出了ExpActivator框架，它在执行过程中仅激活与当前情况相关的经验，从而提高了决策的准确性。通过在四个GUI基础上进行测试，ExpActivator平均提高了28%的成功率，并显著减少了历史记录的使用。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (2)', '#agi', '#alignment', '#architecture', '#audio', '#benchmark (3)', '#cv (2)', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability (1)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source', '#optimization', '#plp', '#rag', '#reasoning (1)', '#rl', '#rlhf', '#robotics', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (1)', '#transfer_learning', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-13 02:21',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-13 02:21')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-13 02:21')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
