    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.09802', 'title': 'SWE-Bench ProMax: Benchmarking Agents on Large-Scale Multilingual Code Refactoring', 'url': 'https://huggingface.co/papers/2608.09802', 'abstract': 'Abstract  As AI coding agents take on increasingly complex, long-horizon software engineering tasks, existing benchmarks are rapidly saturating and their evaluation quality has come under serious scrutiny: a recent audit found that nearly 60% of unsolved SWE-bench Verified instances contain flawed tests -- either overly narrow tests that reject correct solutions or overly broad tests that check unstated requirements -- and that frontier models can verbatim reproduce gold patches from training data. Code refactoring, which requires coordinated, behavior-preserving changes across many files, offers a substantially harder and more realistic test of agent capability, yet remains underserved by current benchmarks. We introduce SWE-Bench ProMax, an expert-curated, multilingual code refactoring benchmark of 170 instances drawn from real commits across seven programming languages (Python, Java, TypeScript, Go, C, C++, and Rust). Every instance undergoes rigorous, multi-stage curation that directly addresses the quality problems identified in prior benchmarks: issue descriptions are rewritten from scratch to provide precise, unambiguous specifications, and test suites are manually reviewed to remove overly narrow and overly broad tests. Tasks with insufficient complexity or limited cross-file scope are filtered out, yielding a benchmark of challenging, large-scale refactoring tasks that average 11.4 modified files and 261.6 lines of code per instance, substantially exceeding the scale of existing benchmarks. Experiments with frontier models under two agent scaffolds show that the best model achieves only 41.2% resolve rate, confirming that SWE-Bench ProMax presents a meaningful and unsaturated challenge for current AI coding agents. Our benchmark is available at https://huggingface.co/datasets/swe-bench-promax/SWE-Bench-ProMax.', 'score': 36, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'bce586d468a7dec3', 'authors': ['Yuling Shi', 'Jinghan Xu', 'Kelin Fu', 'Wenhao Zeng', 'Shilin He', 'Lei Zhang', 'Yue Liu', 'Zelin Zhao', 'Terry Yue Zhuo', 'Jialun Cao', 'Siyu Ye', 'Tianyu Liu', 'Kai Cai', 'Shing-Chi Cheung', 'Xiaodong Gu'], 'affiliations': ['Douyin Group', 'Monash University', 'National University of Singapore', 'Peking University', 'Shanghai Jiao Tong University', 'The Hong Kong University of Science and Technology', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.09802.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#multilingual', '#dataset', '#plp', '#agents'], 'emoji': '🔨', 'ru': {'title': 'Надёжный бенчмарк для проверки агентов на реалистичном рефакторинге кода', 'desc': 'В статье представлен новый бенчмарк SWE-Bench ProMax для оценки способностей AI кодирующих агентов на задачах рефакторинга кода. Авторы выявили серьёзные проблемы в существующих бенчмарках, включая ошибочные тесты и утечку данных из обучающих наборов, поэтому создали мультиязычный датасет из 170 экземпляров реальных коммитов на семи языках программирования. Каждый экземпляр тщательно курирован: описания задач переписаны для точности, тесты проверены на корректность, а задачи отфильтрованы по сложности, в результате чего в датасете остались только требовательные задачи рефакторинга, охватывающие в среднем 11,4 файла и 261,6 строк кода. Эксперименты показали, что даже передовые модели достигают только 41,2% успеха, что подтверждает значимость и релевантность нового бенчмарка для оценки прогресса в области автоматизации разработки программного обеспечения.'}, 'en': {'title': 'SWE-Bench ProMax: Raising the Bar for AI Code Refactoring Challenges', 'desc': "The paper introduces SWE-Bench ProMax, a new benchmark designed to evaluate AI coding agents on complex code refactoring tasks. It addresses issues found in existing benchmarks, such as flawed tests and insufficient task complexity, by providing 170 carefully curated instances from real-world software commits across multiple programming languages. Each instance features clear specifications and rigorous test suites to ensure high-quality evaluation. The results show that even advanced models struggle with these tasks, achieving only a 41.2% resolve rate, highlighting the benchmark's effectiveness in challenging AI capabilities."}, 'zh': {'title': 'SWE-Bench ProMax：挑战AI编码代理的新基准', 'desc': '随着人工智能编码代理承担越来越复杂的软件工程任务，现有基准测试的评估质量受到严重质疑。我们提出了SWE-Bench ProMax，这是一个专家策划的多语言代码重构基准，包含170个实例，来自七种编程语言的真实提交。每个实例经过严格的多阶段策划，以解决之前基准测试中发现的质量问题，确保任务的复杂性和跨文件范围。实验表明，当前最好的模型在这些任务中的解决率仅为41.2%，证明了SWE-Bench ProMax为现有AI编码代理提供了有意义且未饱和的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.09819', 'title': 'Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA', 'url': 'https://huggingface.co/papers/2608.09819', 'abstract': 'Abstract  Macaron-V1 is an open agent-model family for experiential intelligence: learning from experience in real environments and continuing to learn after deployment. It is organized around two system goals. Adaptation is pursued through recursive improvement of versioned model-harness pairs, where experience from one configuration is evaluated under an external contract and used to construct its successor. Collaboration is pursued via the Mixture-of-LoRA (MoL) architecture that freezes a base model, composes specialist LoRA adapters, and selects one LoRA per user turn. The flagship Macaron-V1-Venti combines a 744B GLM-5.2 base with four LoRAs for chat, agent, coding, and GenUI; the Qwen3.6-based Macaron-V1-Tall (50B) uses the same design for local deployment. This report presents Macaron-V1 as a co-designed system spanning architecture, algorithms, and infrastructure. The MoL architecture supports continual learning through extensible LoRA specialists. The algorithm combines Model-Harness Co-design and recursive self-improvement loop, including the UI4A component-native GenUI harness, a stateful action substrate, versioned HCP contract, and the agentic RL framework MindForge. The supporting infrastructure includes the post-training platform MinT, the long-context RL method LongStraw, and stability techniques for sparse MoE and DSA base models. We evaluate Macaron-V1 on Personal Intelligence, GenUI, and general capability benchmarks against frontier baselines. Our results validate the current system, while compounding gains from continual learning and collective intelligence remain open questions.', 'score': 30, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'ce6309ffcf9d9383', 'authors': ['Mind Lab', ':', 'Vin Bo', 'Asher Cai', 'Jingwei Cao', 'Song Cao', 'Vic Cao', 'Amelia Chen', 'Andrew Chen', 'Kaijie Chen', 'Cleon Cheng', 'Steven Chiang', 'Kaixuan Fan', 'Hera Feng', 'Huan Feng', 'Arthur Fu', 'Jun Gao', 'Pyke Han', 'Nolan Ho', 'Ori Hong', 'Hailee Hou', 'Piers Hua', 'Charles Huang', 'Miles Jiang', 'Nora Jiang', 'Yuyi Jiang', 'Qiuyu Jin', 'Fancy Kong', 'Kuss Koo', 'Jaron Lee', 'Andrew Lei', 'Alexy Li', 'Dawn Li', 'Lucian Li', 'Ray Li', 'Ricardo Li', 'Smith Li', 'Theo Li', 'Allen Lin', 'Elliot Lin', 'Fan Lin', 'Chen Ling', 'Kairus Liu', 'Kieran Liu', 'Logan Liu', 'Neo Liu', 'Xiang Liu', 'Yuxin Lu', 'Maeve Luo', 'Pony Ma', 'Verity Niu', 'Cole Qiao', 'Guian Qiu', 'Vince Qu', 'Sentry', 'Niko Song', 'Vincent Wang', 'Bo Wu', 'Rio Yang', 'Evelyn Ye', 'Fiona Ye', 'Ina Ye', 'Regis Ye', 'Josh Ying', 'Atlas Zeng', 'Danney Zeng', 'Salmon Zhan', 'Anya Zhang', 'Di Zhang', 'Mia Zhang', 'Sueky Zhang', 'Wei Zhao', 'Ada Zhou', 'Adrian Zhou', 'Yuhua Zhou', 'Juno Zhu', 'Murphy Zhuang'], 'affiliations': ['Mind Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.09819.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#long_context', '#rl', '#architecture', '#optimization', '#transfer_learning', '#training', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Учиться на опыте: модульные агенты с непрерывным самоулучшением', 'desc': 'Macaron-V1 — это семейство открытых агент-моделей, которые обучаются на опыте взаимодействия в реальных окружениях и продолжают улучшаться после развертывания. Система использует два ключевых подхода: адаптация через итеративное улучшение пар модель-окружение с оценкой внешних контрактов, и сотрудничество через архитектуру Mixture-of-LoRA, которая замораживает базовую модель и комбинирует специализированные адаптеры LoRA. Флагманская версия Macaron-V1-Venti объединяет 744B параметров GLM-5.2 с четырьмя LoRA-специалистами для чата, агентских задач, кодирования и генерации интерфейсов. Система включает инфраструктуру для постобучения MinT, методы для работы с длинными контекстами LongStraw и техники стабилизации для разреженных смешанных экспертов.'}, 'en': {'title': 'Empowering Agents with Continual Learning and Collaboration', 'desc': 'Macaron-V1 is a new family of models designed for experiential intelligence, which means they learn from real-world experiences and keep improving even after they are deployed. It focuses on two main goals: adaptation through continuous improvement of model-harness pairs and collaboration using a Mixture-of-LoRA (MoL) architecture that allows for specialized learning. The flagship model, Macaron-V1-Venti, utilizes a large base model with multiple specialized adapters for different tasks, while Macaron-V1-Tall is designed for local use. The system incorporates advanced techniques like continual learning, recursive self-improvement, and various supporting infrastructures to enhance its performance and capabilities.'}, 'zh': {'title': '体验智能的持续学习与协作', 'desc': 'Macaron-V1是一个开放的智能体模型家族，旨在通过在真实环境中学习经验并在部署后继续学习来实现体验智能。该系统围绕两个目标组织：通过递归改进版本化模型与工具的配对来实现适应性，并通过Mixture-of-LoRA（MoL）架构促进协作。MoL架构支持持续学习，结合了模型-工具共同设计和递归自我改进的算法。我们在个人智能、GenUI和一般能力基准上评估了Macaron-V1，结果验证了当前系统的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.09873', 'title': 'Sci-VBench: Evaluating Knowledge- and Reasoning-Intensive Video Generation in Science Domains', 'url': 'https://huggingface.co/papers/2608.09873', 'abstract': 'Abstract  We introduce Sci-VBench, a comprehensive benchmark for evaluating knowledge- and reasoning-intensive video generation across scientific domains. It contains 1,253 expert-annotated examples spanning 60 subjects across four core disciplines: Natural Science, Healthcare, Humanities & Social Sciences, and Engineering. Each example requires models to generate temporally rich videos that demand scientific reasoning and knowledge-grounded synthesis, going beyond surface-level visual plausibility. We further establish a rubric-based evaluation protocol. Our analysis shows that, under this protocol, both non-expert human evaluators and MLLM-as-Judge systems can achieve relatively high agreement with expert judgments, supporting reproducible evaluation at scale. We benchmark 16 frontier proprietary and open-source models and find that, while automatic perceptual-quality scores cluster tightly across systems, performance on Prompt Grounding and Scientific and Causal Correctness varies substantially, with a pronounced proprietary-open-source gap. These findings show that advances in visual realism have not yet translated into reliable modeling of scientific and causal dynamics.', 'score': 17, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'a6fb3c08c6fdc964', 'authors': ['Diandian Zhang', 'Tingyu Song', 'Lin Fu', 'Zheyuan Yang', 'Yilun Zhao'], 'affiliations': ['Tongji University', 'UCAS', 'Yale University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.09873.jpg', 'data': {'categories': ['#video', '#open_source', '#benchmark', '#dataset', '#reasoning', '#multimodal', '#science'], 'emoji': '🎬', 'ru': {'title': 'Научное видео: визуальное совершенство без логики', 'desc': 'В работе представлен Sci-VBench — комплексный бенчмарк для оценки генерации видео, требующей научных знаний и логического мышления в различных научных областях. Бенчмарк содержит 1253 примера, аннотированные экспертами, охватывающие 60 дисциплин в четырёх основных областях: естественные науки, здравоохранение, гуманитарные науки и инженерия. Авторы разработали протокол оценки на основе рубрик и показали, что как люди, так и мультимодальные LLM могут достигать высокого согласия с экспертными суждениями. Тестирование 16 моделей выявило существенный разрыв между проприетарными и открытыми системами в моделировании научной корректности, хотя визуальное качество улучшилось.'}, 'en': {'title': 'Benchmarking Scientific Video Generation: Bridging Knowledge and Visual Realism', 'desc': 'Sci-VBench is a new benchmark designed to assess video generation models that require deep knowledge and reasoning in scientific fields. It includes 1,253 examples across four main disciplines, challenging models to create videos that are not only visually appealing but also scientifically accurate. The study introduces a structured evaluation method that allows both human judges and machine learning models to assess video quality effectively. Results indicate that while visual quality is improving, there is still a significant gap in accurately modeling scientific concepts and causal relationships, especially between proprietary and open-source models.'}, 'zh': {'title': '科学视频生成的评估新基准', 'desc': '我们介绍了Sci-VBench，这是一个全面的基准，用于评估科学领域中知识和推理密集型的视频生成。该基准包含1253个专家注释的示例，涵盖自然科学、医疗保健、人文与社会科学和工程四个核心学科。每个示例要求模型生成时间丰富的视频，这需要科学推理和知识基础的综合，超越表面视觉的可信度。我们的分析表明，在这种评估协议下，非专家人类评估者和MLLM作为评判系统可以与专家判断达成相对高的一致性，支持大规模的可重复评估。'}}}, {'id': 'https://huggingface.co/papers/2608.04419', 'title': 'SPOT: Sparse Probing and Outcome Calibration for On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.04419', 'abstract': 'Abstract  On-policy distillation (OPD) provides dense teacher supervision on student-generated trajectories, but standard reverse-KL training can assign insufficient probability to other plausible continuations. Teacher entropy alone does not reveal whether uncertainty is concentrated among a few plausible next tokens or dispersed over a long probability tail, nor whether the student already represents those candidates well. Moreover, local teacher probabilities may not predict downstream success. We introduce Sparse Probing and Outcome-calibrated Targets OPD (SPOT), which addresses two coupled decisions, where to probe and what to distill, through an acquisition--exploration--exploitation procedure. During acquisition, a position-level score combines normalized teacher entropy, the probability mass captured by a small top-k candidate set, and student--teacher mismatch to allocate a limited probing budget. During exploration, SPOT evaluates teacher-proposed candidates through verifier-scored student continuations. During exploitation, these outcomes produce a closed-form, KL-regularized target that favors candidates with better downstream outcomes while remaining anchored to the teacher distribution. Extensive experiments across multiple student models and reasoning benchmarks demonstrate the effectiveness of SPOT in improving reasoning performance while balancing solution quality and coverage.', 'score': 14, 'issue_id': 2912, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'e4aa6f2385bd23aa', 'authors': ['Zikun Qu', 'Min Zhang', 'Mingze Kong', 'Zhiwei Shang', 'Yikun Ban', 'Shuang Qiu', 'Zhongxiang Dai'], 'affiliations': ['Beihang University', 'City University of Hong Kong', 'East China Normal University', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2608.04419.jpg', 'data': {'categories': ['#training', '#rlhf', '#reasoning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Целевая дистилляция: выбирая, где учиться и на что равняться', 'desc': 'В статье предлагается метод SPOT для дистилляции знаний от учителя к студенту, который решает задачу выбора наиболее информативных позиций для обучения и определения оптимальных целевых распределений вероятностей. Авторы используют комбинированный score, учитывающий энтропию учителя, концентрацию вероятностной массы на топ-k кандидатов и различия между предсказаниями учителя и студента, чтобы эффективно распределить ограниченный бюджет проб. Через процедуру acquisition-exploration-exploitation модель оценивает предложенные кандидаты, используя верификаторы, а затем генерирует калиброванные целевые распределения с KL-регуляризацией, которые благоприятствуют вариантам с лучшим качеством на выходе. Экспериментальные результаты показывают, что SPOT значительно улучшает производительность моделей рассуждения, достигая баланса между качеством и разнообразием решений.'}, 'en': {'title': 'Enhancing Student Learning with SPOT: Smart Probing for Better Outcomes', 'desc': 'The paper introduces Sparse Probing and Outcome-calibrated Targets OPD (SPOT), a method that enhances on-policy distillation by effectively managing teacher supervision on student trajectories. It addresses the limitations of standard reverse-KL training, which may not adequately represent diverse plausible continuations. SPOT employs a systematic approach that includes acquisition, exploration, and exploitation phases to optimize the probing process and distillation targets. Experimental results show that SPOT significantly improves reasoning performance in student models while ensuring a good balance between solution quality and coverage.'}, 'zh': {'title': '提升推理性能的稀疏探测方法', 'desc': '本文提出了一种新的方法，称为稀疏探测和结果校准目标的在线蒸馏（SPOT），旨在改善学生模型的推理性能。SPOT通过获取、探索和利用的过程，解决了在蒸馏过程中如何选择探测位置和蒸馏内容的两个关键决策。它结合了教师的熵、候选集的概率质量和学生与教师之间的不匹配，来优化探测预算。通过大量实验，SPOT在多个学生模型和推理基准上显示了其在提高推理性能方面的有效性，同时平衡了解决方案的质量和覆盖率。'}}}, {'id': 'https://huggingface.co/papers/2608.09119', 'title': 'Motif 3: Technical Report', 'url': 'https://huggingface.co/papers/2608.09119', 'abstract': 'Abstract  We introduce Motif 3, a decoder-only Mixture-of-Experts language model with 314 billion total parameters and 13.2 billion activated per token. Each sparse MoE layer contains 384 routed experts, with eight selected per token. This fine-grained sparsity provides substantial expert capacity while limiting computation. Motif 3 is built around Grouped Differential Latent Attention (GDLA), which integrates grouped differential attention with the compressed key-value representation of Multi-head Latent Attention. The architecture further incorporates modified manifold-constrained hyper-connections, Expert Specific PolyNorm activations, and multi-token prediction to improve optimization stability, expert specialization, and inference efficiency. We pretrain Motif 3 on approximately 12.5 trillion tokens spanning web documents, STEM, code, mathematics, multilingual content, and domain-specialized corpora. Expert-balancing and numerical-stabilization techniques support stable training at scale, while selective MXFP8 computation and communication, memory-efficient fused kernels, and window-aware context parallelism enable training with context lengths up to 256K tokens. Our post-training pipeline combines general supervised fine-tuning, six specialist teachers trained with reinforcement learning, a software-engineering teacher trained with supervised fine-tuning, and Multi-teacher On-Policy Distillation. The resulting unified model consolidates complementary capabilities in reasoning, coding, tool use, professional work, long-context understanding, calibrated abstention, and instruction following. Across a broad evaluation suite, Motif 3 demonstrates competitive performance against leading open weight models, including strong results on long-horizon agentic tasks, mathematical reasoning, scientific knowledge, and hallucination-sensitive evaluation.', 'score': 12, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'c51652bf9238e6eb', 'authors': ['Junghwan Lim', 'Joon Son Chung', 'Sungmin Lee', 'Wai Ting Cheung', 'Gihun Cho', 'Minsu Ha', 'Sangho Kang', 'Beomgyu Kim', 'Dongseok Kim', 'Jangwoong Kim', 'Taehyun Kim', 'Taewhan Kim', 'Jeesoo Lee', 'Jeongdoo Lee', 'Junhyeok Lee', 'Dongpin Oh', 'Hyeyeon Cho', 'Dahye Choi', 'Jaeheui Her', 'Hanbin Jung', 'Changjin Kang', 'Minjae Kim', 'Youngrok Kim', 'Hyukjin Kweon', 'Hongjoo Lee', 'Yeongjae Park', 'Bokki Ryu'], 'affiliations': ['Motif Technologies'], 'pdf_title_img': 'assets/pdf/title_img/2608.09119.jpg', 'data': {'categories': ['#rlhf', '#open_source', '#math', '#multilingual', '#long_context', '#architecture', '#optimization', '#science', '#training', '#plp', '#agents'], 'emoji': '⚡', 'ru': {'title': 'Эффективная разреженная сеть экспертов с инновационным вниманием для масштабных языковых моделей', 'desc': 'Представлена Motif 3 — декодер-only языковая модель на основе смеси экспертов (MoE) с 314 миллиардами параметров, из которых активируется лишь 13.2 миллиарда на токен, что обеспечивает эффективность вычислений при сохранении ёмкости. Архитектура использует инновационный механизм Grouped Differential Latent Attention для оптимизации внимания и компрессии представлений ключ-значение, дополненный специализированными техниками активации и многотокенным предсказанием. Модель предварительно обучена на 12.5 триллионах токенов разнообразных корпусов с применением методов стабилизации обучения в масштабе и оптимизации памяти, включая контексты до 256K токенов. Post-training этап объединяет supervised fine-tuning и reinforcement learning с несколькими специализированными учителями, позволяя модели достичь конкурентной производительности в рассуждениях, кодировании, длинноконтекстном понимании и других сложных задачах.'}, 'en': {'title': 'Unlocking Language with Expert Precision', 'desc': 'Motif 3 is a large language model that uses a decoder-only architecture with a total of 314 billion parameters, focusing on a Mixture-of-Experts (MoE) approach. It activates 13.2 billion parameters per token by routing eight out of 384 experts for each token, allowing for efficient computation while maintaining high capacity. The model employs advanced techniques like Grouped Differential Latent Attention (GDLA) and specialized activations to enhance optimization and inference efficiency. After extensive pretraining on diverse datasets, Motif 3 achieves strong performance across various tasks, including reasoning and coding, while effectively managing long context lengths up to 256K tokens.'}, 'zh': {'title': 'Motif 3：高效的混合专家语言模型', 'desc': 'Motif 3 是一种解码器专用的混合专家语言模型，拥有3140亿个参数和每个token激活的132亿个参数。该模型采用稀疏的MoE层，每层包含384个专家，每个token选择8个专家，从而在保持计算效率的同时提供强大的专家能力。Motif 3的架构结合了分组差异注意力和压缩的多头潜在注意力的键值表示，进一步增强了优化稳定性和专家专业化。经过在约12.5万亿个token上的预训练，Motif 3在推理、编码和长文本理解等多个任务上表现出色，展现了与领先模型的竞争力。'}}}, {'id': 'https://huggingface.co/papers/2608.08021', 'title': 'Evidence-RL: Towards Evidence-intensive Visual Reasoning', 'url': 'https://huggingface.co/papers/2608.08021', 'abstract': 'Abstract  Vision-Language Models (VLMs) should answer from concrete image evidence rather than language priors, dataset shortcuts, or irrelevant visual context. Existing perception-aware post-training methods encourage image use through global perturbations or attention proxies, but they do not test whether a sampled answer causally depends on the local evidence that supports it. We propose Counterfactual Evidence Disentanglement (CED), a training-time evidence audit for VLM grounding. For each response, CED neutralizes an object-centric Evidence Region and compares the resulting support drop against matched non-evidence Regions. We combine this signal with answer correctness inside GRPO, rewarding correct answers that rely on the evidence path rather than shortcut or nuisance paths. CED uses weak object-level proposals, requires no question-specific evidence annotations, and adds no inference-time overhead. Across nine public benchmarks and four backbones, CED outperforms prior RL-based post-training methods, with targeted analyses verifying its object-centric signal.', 'score': 6, 'issue_id': 2912, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '658b453289c7030f', 'authors': ['Haojie Huang', 'Xinlei Yu', 'Chengming Xu', 'Zhangquan Chen', 'Cheng Yang', 'Qingdong He', 'Yu Yang', 'Jiangning Zhang', 'Xiaobin Hu'], 'affiliations': ['Fudan University', 'National University of Singapore', 'Tencent', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.08021.jpg', 'data': {'categories': ['#rl', '#benchmark', '#multimodal', '#rlhf'], 'emoji': '🔍', 'ru': {'title': 'Учим модели видения с языком полагаться на визуальные доказательства, а не на языковые штампы', 'desc': 'В работе предложен метод Counterfactual Evidence Disentanglement (CED) для обучения Vision-Language моделей правильно использовать визуальные доказательства при ответе на вопросы. Метод работает во время обучения, проверяя, действительно ли ответ модели зависит от локальных объектов изображения, а не от языковых закономерностей или контекстных артефактов. CED нейтрализует области с объектами и сравнивает изменение уверенности модели, комбинируя этот сигнал с правильностью ответа в процессе обучения с подкреплением. Метод не требует дополнительных аннотаций и показывает улучшения на множестве бенчмарков по сравнению с существующими подходами.'}, 'en': {'title': 'Enhancing VLMs with Evidence-Centric Learning', 'desc': "This paper introduces Counterfactual Evidence Disentanglement (CED), a method designed to improve Vision-Language Models (VLMs) by ensuring their answers are based on relevant image evidence rather than shortcuts or irrelevant context. CED works by neutralizing specific object-centric regions in an image and measuring how this affects the model's ability to provide correct answers. By rewarding answers that depend on the correct evidence path, CED enhances the model's grounding capabilities without requiring additional annotations or slowing down inference. The results show that CED significantly outperforms previous reinforcement learning methods across multiple benchmarks, demonstrating its effectiveness in promoting evidence-based reasoning in VLMs."}, 'zh': {'title': '提升视觉语言模型的证据使用效率', 'desc': '本文提出了一种新的训练方法，称为反事实证据解耦（CED），旨在提高视觉语言模型（VLMs）的性能。CED通过中和与对象相关的证据区域，来审计模型的证据使用情况，并比较支持度的变化。该方法结合了答案的正确性，奖励那些依赖于真实证据路径的正确答案，而不是依赖于捷径或无关路径的答案。实验结果表明，CED在多个基准测试中优于之前的基于强化学习的后训练方法。'}}}, {'id': 'https://huggingface.co/papers/2608.02508', 'title': 'RoMeRL: Balancing Feedback Coverage and the Memory-Reward Trap in Self-Evolving Agent Memory via Reduced-Order Utility States', 'url': 'https://huggingface.co/papers/2608.02508', 'abstract': 'Abstract  Learning-based memory systems for self-evolving LLM agents face two tightly coupled challenges. First, trajectory-indexed utilities grow with the interaction history, thereby dispersing limited feedback over an ever-expanding state space. Second, because trajectory-level rewards are jointly assigned to co-retrieved memories, irrelevant experiences may receive misleading utility updates and consequently enter the memory-reward trap. To address these challenges, we introduce Reduced-Order Memory Reinforcement Learning (RoMeRL), which represents the growing trajectory-indexed utility space using a fixed-dimensional per-task memory state factorized by outcome polarity and memory dynamics. RoMeRL incorporates new experiences through a fixed set of semantic coordinates whose contents are updated or replaced over time, thereby concentrating feedback over a bounded utility support. Theoretically, we show that this reduced-order parameterization increases the average feedback received by each utility coordinate and characterize the steady-state occupancy of erroneous coordinates under a generic coordinate-transition model. Empirically, across ALFWorld and LifelongAgentBench, RoMeRL improves task performance, reduces the Cold-Q ratio by 80.0%, increases feedback density by approximately 6.0 times, reduces the maintained memory size by 84.4%, and cuts LLM calls by 21.1%. These results show that reduced-order utility states support efficient self-evolving agent memory while limiting persistent reward contamination. Code is available at: https://github.com/YOUNG-fnxm/RoMeRL', 'score': 5, 'issue_id': 2912, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'cc938acc86369263', 'authors': ['Yi Yang', 'Zhennan Chen', 'Yihong Zhuang', 'Tiehan Fan', 'Yinan Chen', 'Jian Li', 'Jian Yang', 'Ying Tai'], 'affiliations': ['Nanjing University', 'Xiamen University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02508.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Эффективная память агента через редуцированное пространство полезности', 'desc': 'В статье предлагается метод Reduced-Order Memory Reinforcement Learning (RoMeRL) для обучения самоэволюционирующих LLM-агентов с памятью. Основная проблема заключается в том, что полезность траекторий растёт с историей взаимодействия, рассеивая обратную связь по расширяющемуся пространству состояний, а также в том, что совместно извлечённые воспоминания получают вводящие в заблуждение обновления наград. RoMeRL решает эту проблему, представляя пространство полезности с фиксированной размерностью, факторизованное по полярности исходов и динамике памяти, что концентрирует обратную связь в ограниченной области. Экспериментально доказано, что метод улучшает качество выполнения задач, значительно уменьшает размер памяти на 84.4%, снижает количество вызовов LLM на 21.1% и увеличивает плотность обратной связи примерно в 6 раз.'}, 'en': {'title': 'Efficient Memory Management for Self-Evolving Agents', 'desc': 'This paper presents Reduced-Order Memory Reinforcement Learning (RoMeRL), a novel approach to enhance memory systems in self-evolving large language model (LLM) agents. It addresses the challenges of growing trajectory-indexed utilities and misleading updates from irrelevant experiences by using a fixed-dimensional memory state that factors in outcome polarity and memory dynamics. RoMeRL allows for efficient integration of new experiences while concentrating feedback, leading to improved task performance and reduced memory size. The empirical results demonstrate significant enhancements in feedback density and a reduction in the Cold-Q ratio, showcasing the effectiveness of the proposed method.'}, 'zh': {'title': '减少阶数，提升记忆效率！', 'desc': '本论文提出了一种名为减少阶数记忆强化学习（RoMeRL）的方法，旨在解决自我进化大型语言模型（LLM）代理在学习过程中面临的两个主要挑战。首先，随着交互历史的增加，轨迹索引的效用会不断增长，导致有限的反馈分散在不断扩展的状态空间中。其次，轨迹级奖励共同分配给共同检索的记忆，可能导致无关经验获得误导性的效用更新，从而陷入记忆奖励陷阱。RoMeRL通过固定维度的任务记忆状态来表示增长的轨迹索引效用空间，从而提高了每个效用坐标接收到的平均反馈，并在多个实验中显著提升了任务性能。'}}}, {'id': 'https://huggingface.co/papers/2608.09096', 'title': 'Evo-Bench: Can Language Models Improve Agent Harness?', 'url': 'https://huggingface.co/papers/2608.09096', 'abstract': "Abstract  Large Language Models (LLMs) have driven rapid progress in autonomous agents, yet standard evaluations remain confined to static task solving. An emerging frontier is harness evolution---the agent's capacity to autonomously optimize its own operating harness. However, systematically benchmarking this capability remains challenging, as existing evaluations fail to isolate harness improvements from base model strength, prevent task-specific overfitting, or capture long-horizon iterative research. To address these challenges, we introduce Evo-Bench, the first benchmark designed to evaluate models' intrinsic harness-evolving capabilities across Search, Office, and General agent domains. To rigorously isolate this capability, Evo-Bench employs a novel harness-guided construction framework: it leverages auxiliary-task evolution to identify tasks genuinely sensitive to framework improvements, followed by sensitivity-aware stratified splitting to ensure robust cross-suite generalization. Extensive evaluations across nine frontier and open-weight models reveal that top models achieve massive absolute gains reaching 16.6 points, closely approaching state-of-the-art human-engineered baselines. Crucially, while autonomous evolution outpeforms artificial harness in General tasks and excels in Search tasks, it struggles in Office tasks that demand highly specific processing workflows. Furthermore, our analysis exposes critical temporal anomalies like early saturation, while demonstrating that the synthesized harnesses act as highly transferable reasoning structures, consistently boosting diverse policy models.", 'score': 2, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'f18bbff1e8507823', 'authors': ['Lisheng Huang', 'Chen Yang', 'Hao Zhou', 'Huatong Song', 'Zongchao Chen', 'Ran Le', 'Yang Song', 'Wayne Xin Zhao', 'Tao Zhang'], 'affiliations': ['BOSS Zhipin, Beijing, China', 'Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.09096.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#reasoning', '#optimization', '#transfer_learning', '#agents'], 'emoji': '🧬', 'ru': {'title': 'Автономная эволюция собственной архитектуры интеллектуальными агентами', 'desc': 'В статье представлена Evo-Bench — первый бенчмарк для оценки способности языковых моделей к автономной оптимизации собственной архитектуры и процесса обработки задач. Авторы разработали инновационный фреймворк на основе вспомогательных задач, который позволяет изолировать улучшения самой системы от улучшений базовой модели и предотвращает переобучение на конкретных задачах. Экспериментальная оценка девяти современных моделей показала, что топ-модели достигают существенных прибыльных улучшений до 16,6 пункта, при этом автономная эволюция демонстрирует лучшие результаты на задачах поиска, но испытывает трудности с офисными приложениями. Исследование выявило, что синтезированные системные архитектуры работают как высокотрансферабельные структуры рассуждений, улучшающие работу разнообразных моделей политик.'}, 'en': {'title': 'Evo-Bench: Benchmarking Autonomous Harness Evolution in LLMs', 'desc': 'This paper introduces Evo-Bench, a new benchmark for evaluating the ability of large language models (LLMs) to autonomously improve their operational frameworks, known as harnesses. The authors highlight the limitations of current evaluation methods that do not effectively separate harness enhancements from the inherent strengths of the models. Evo-Bench uses a unique approach that combines auxiliary-task evolution and sensitivity-aware stratified splitting to ensure that the evaluation is robust and generalizes well across different agent domains. The findings show that while autonomous evolution significantly improves performance in general and search tasks, it faces challenges in office tasks that require specific processing workflows.'}, 'zh': {'title': '自主演变：智能体的未来', 'desc': '大型语言模型（LLMs）在自主智能体的发展中取得了快速进展，但标准评估仍然局限于静态任务解决。本文提出了Evo-Bench，这是第一个旨在评估模型内在自我优化能力的基准，涵盖搜索、办公和通用智能体领域。Evo-Bench通过新颖的框架，利用辅助任务的演变来识别对框架改进敏感的任务，并确保跨任务的稳健泛化。评估结果显示，顶尖模型在自主演变方面取得了显著进展，接近人类工程基准，但在需要特定处理流程的办公任务中表现不佳。'}}}, {'id': 'https://huggingface.co/papers/2608.09420', 'title': 'Intent Speaks Louder: Controllable User Simulation Beyond Response Imitation', 'url': 'https://huggingface.co/papers/2608.09420', 'abstract': 'Abstract  User simulators are widely used as scalable environments for training and evaluating interactive assistants. Generating the next user turn is inherently one-to-many: the same profile and dialogue context may support multiple plausible continuations with different local interaction intents. A fluent response may therefore advance the dialogue through an inappropriate intent, such as acceptance rather than repair. Our key insight is that controllable user simulation should separate which local interaction intent the next user turn should realize from how that intent is expressed in language. We introduce UserIDA (User Intent-Directive Alignment), which exposes interaction intent as an explicit per-turn directive. UserIDA defines a six-way intent interface, learns directive-conditioned generation through supervised fine-tuning, and uses intent-calibrated policy optimization during group-based reinforcement learning. The reward preserves composite response quality while ensuring that intent-violating candidates rank below compliant alternatives in mixed groups. On LMSYS-USP, UserIDA achieves 86.6\\% intent accuracy, outperforming the strongest dedicated user-simulator baseline by 24.3 percentage points while improving semantic and stylistic similarity. In within-context interventions, it realizes at least four of the six target intents in 91.7\\% of evaluated dialogue states, compared with 22.9\\% for the strongest external baseline. These results establish per-turn intent control as a complementary dimension to response fidelity in user simulation.', 'score': 2, 'issue_id': 2912, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'e393ae98f2e2b8c6', 'authors': ['Bo Wang', 'Ruixing Zhang', 'Yunqi Liu', 'Yang Zhang', 'Liangzhe Han', 'Tongyu Zhu', 'Leilei Sun'], 'affiliations': ['the State Key Laboratory of Complex and Critical Software Environment, Beihang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.09420.jpg', 'data': {'categories': ['#training', '#rlhf', '#benchmark', '#agents'], 'emoji': '🎭', 'ru': {'title': 'Управляемая симуляция пользователя через явное управление интентами диалога', 'desc': 'В статье предложен метод UserIDA для более точного управления симуляторами пользователей, которые используются для обучения диалоговых систем. Основная идея заключается в разделении выбора интента (цели) пользователя от способа его выражения в языке, что позволяет явно контролировать направление диалога. Авторы используют технику контролируемой тонкой настройки и reinforcement learning с калибровкой по интентам для обучения модели генерировать ответы пользователя, соответствующие заданному интенту. Экспериментальные результаты показывают значительное улучшение точности реализации интентов и качества диалога по сравнению с существующими методами.'}, 'en': {'title': 'Enhancing User Simulation with Intent Control', 'desc': 'This paper presents UserIDA, a novel approach to user simulation for interactive assistants that focuses on separating the intent of user responses from their linguistic expression. By introducing a six-way intent interface, UserIDA allows for more precise control over the interaction intents that a simulated user can express. The method employs supervised fine-tuning and intent-calibrated policy optimization to enhance the quality of generated responses while maintaining intent accuracy. The results demonstrate significant improvements in intent accuracy and response quality compared to existing user simulators, highlighting the importance of intent control in dialogue systems.'}, 'zh': {'title': '用户意图控制：提升对话质量的新方法', 'desc': '用户模拟器被广泛用于训练和评估交互助手的可扩展环境。生成下一个用户发言时，存在多种可能的意图，因此同一用户档案和对话上下文可以支持多种合理的对话延续。我们提出了UserIDA（用户意图指令对齐），它将交互意图作为每轮对话的明确指令，从而实现意图与语言表达的分离。通过监督微调和基于意图的强化学习，UserIDA在意图准确性和对话质量上都取得了显著提升。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (5)', '#agi', '#alignment', '#architecture (2)', '#audio', '#benchmark (5)', '#cv', '#data', '#dataset (2)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (2)', '#multimodal (3)', '#open_source (5)', '#optimization (4)', '#plp (2)', '#rag', '#reasoning (3)', '#rl (2)', '#rlhf (4)', '#robotics', '#science (2)', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (4)', '#transfer_learning (2)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article =>

                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories &&

                    );

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;

        }

            filterAndRenderArticles();

            updateUrlWithCategories();

        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-11 03:28',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-11 03:28')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-11 03:28')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
