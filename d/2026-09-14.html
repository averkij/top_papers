    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.11115', 'title': 'Benchmark Radar: A Living Database and Search Engine for AI Benchmarks and Evaluation', 'url': 'https://huggingface.co/papers/2609.11115', 'abstract': 'Abstract Benchmark Radar is a searchable living database and discovery engine for AI evaluation benchmarks that aggregates sources, score histories, and evidence to support benchmark selection and comparison.  Generated by thinkingmachines/Inkling-Small Benchmark researchers and developers of large language models (LLMs) and other AI systems need to find relevant evaluations, locate their benchmark datasets and code, and understand the settings behind reported scores. We present Benchmark Radar, a living database and search engine for retrieval and discovery of AI benchmarks, covering LLM evaluation, agentic and tool-use benchmarks, coding, reasoning, safety, and domain-specific evaluations. The system combines daily discovery of benchmark papers, repositories, datasets, and releases with a searchable benchmark catalog, mentions in model cards and technical reports, and score histories. It retains source identities and citations so readers can inspect candidate benchmarks and their evaluation evidence. Daily discovery draws on 37 sources: 13 direct connectors and 24 first-party research and engineering feeds. The catalog contains 1,283 source records drawn from 4 benchmark catalogs and 12,916 numeric observations on 790 records. We describe collection and retrieval, audit the full catalog, and examine benchmark saturation, adoption trends, and the limits of score comparisons. A worked example walks through a complete prior-art search, showing how to query the catalog and inspect benchmark evidence when designing a new evaluation. We release the web dashboard with a benchmark leaderboard, a Pareto frontier view of score against measured use, saturation and trend views, daily feeds, downloadable evidence, a command-line interface (CLI) for offline queries, and reproducible analysis.', 'score': 45, 'issue_id': 3271, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '56b05f4c99a4281c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark', '#survey', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Единая система для поиска и сравнения бенчмарков в оценке AI моделей', 'desc': 'Benchmark Radar — это живая база данных и поисковая система для обнаружения и сравнения бенчмарков оценки AI систем. Система агрегирует информацию из 37 источников, включая исследовательские статьи, репозитории и карточки моделей, содержащую более 12,900 числовых наблюдений о 790 бенчмарках. Платформа позволяет разработчикам LLM и других AI систем находить релевантные оценки, локализовать наборы данных, понимать параметры экспериментов и анализировать историю результатов. Инструмент предоставляет веб-интерфейс с анализом насыщенности бенчмарков, трендами принятия, представлением границ Парето и CLI для автоматизированных запросов.'}, 'en': {'title': 'Discover and Compare AI Benchmarks Effortlessly!', 'desc': 'Benchmark Radar is a comprehensive database designed to help researchers and developers in the AI field find and compare evaluation benchmarks for large language models and other AI systems. It aggregates various sources, including benchmark datasets and code, while providing insights into the settings behind reported scores. The platform features a searchable catalog that includes daily updates from multiple sources, allowing users to access a wealth of benchmark information and evidence. Additionally, it offers tools for analyzing benchmark trends and comparisons, making it easier for users to design effective evaluations.'}, 'zh': {'title': 'AI评估基准的智能搜索引擎', 'desc': 'Benchmark Radar 是一个可搜索的数据库和发现引擎，专门用于人工智能评估基准的聚合和比较。它帮助研究人员和开发者找到相关的评估、基准数据集和代码，并理解报告分数背后的设置。该系统每天更新基准论文、数据集和发布内容，并提供可搜索的基准目录，保留来源身份和引用，方便读者检查候选基准及其评估证据。我们还提供了一个网络仪表板，包含基准排行榜、分数与使用情况的视图、趋势分析等功能。'}}}, {'id': 'https://huggingface.co/papers/2609.13141', 'title': 'SAS: Simple Attention Sparsification via End-to-End Optimization of Context Ranking', 'url': 'https://huggingface.co/papers/2609.13141', 'abstract': "Abstract SAS improves sparse attention by training a selector end-to-end with language modeling loss via continuous gating inside attention softmax, yielding better context ranking under tight budgets.  Generated by thinkingmachines/Inkling-Small Post-training attention sparsification reduces the quadratic cumulative attention cost of pretrained Transformers by selecting a small set of context units (tokens or blocks) for each query. Existing trainable methods usually use a lightweight selector to score context units, followed by hard Top-K selection that blocks gradients from the language modeling loss. Consequently, these methods commonly distill layer-wise dense attention distributions. Although this encourages the selector to rank context units by dense attention weights in the original model, the ranking is not directly aligned with their impact on predictions under a fixed attention budget (i.e., the number of attended context units per query), potentially wasting the limited budget on less useful units. To address this misalignment, we propose Simple Attention Sparsification (SAS), a gated sparse attention mechanism that optimizes context ranking end-to-end with the language modeling loss. The key idea is to inject the selector's continuous scores into attention logits during training, allowing the loss to update the selector through standard backpropagation. We identify several choices crucial for this simple design to work well in practice: placing the gate inside the attention softmax in log form, using normalized softmax gates to calibrate historical context against the always-retained current block, and preserving continuous selector scores so the model learns relative priorities rather than only hard selections. To support long-sequence training, we implement a memory-efficient Triton kernel that integrates SAS into FlashAttention-style computation. Across reasoning, long-context understanding, and agentic tasks, SAS consistently outperforms trainable sparse attention baselines across attention budgets, with especially large gains under tight budgets, demonstrating more effective context ranking for downstream tasks.", 'score': 43, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': 'c6e96fad71ecce6d', 'authors': ['Zhiwei Li', 'Lei Zhu', 'Hao Gu', 'Xiang Hu', 'Yan Wang', 'Haitao Mi', 'Sirui Han', 'Leo Liang', 'Zhijiang Guo'], 'affiliations': ['Hong Kong University of Science and Technology', 'Hong Kong University of Science and Technology (Guangzhou)', 'Tencent HY LLM Frontier'], 'pdf_title_img': 'assets/pdf/title_img/2609.13141.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Прямая оптимизация выбора контекста через дифференцируемые оценки внимания', 'desc': 'В работе предложен метод Simple Attention Sparsification (SAS) для оптимизации разреженного внимания в Трансформерах через обучение селектора контекста непосредственно с целевой функцией языкового моделирования. Ключевое отличие от существующих методов состоит в использовании непрерывных оценок селектора внутри операции softmax внимания, что позволяет градиентам потерь влиять на ранжирование контекстных единиц. Авторы демонстрируют, что правильное размещение гейта внутри softmax в логарифмической форме и нормализация оценок приводит к более эффективному использованию бюджета внимания для выбора релевантных токенов. Метод показывает значительные улучшения на задачах рассуждения, понимания длинных последовательностей и в агентных системах, особенно при жестких ограничениях на количество посещаемых контекстных единиц.'}, 'en': {'title': 'Optimizing Sparse Attention for Better Context Ranking', 'desc': 'The paper introduces Simple Attention Sparsification (SAS), a method that enhances sparse attention in Transformers by training a selector using language modeling loss. Unlike traditional methods that use hard Top-K selection, SAS employs continuous gating within the attention softmax, allowing for better context ranking while adhering to fixed attention budgets. This approach ensures that the selector is optimized end-to-end, aligning context unit rankings with their actual impact on predictions. The results show that SAS outperforms existing sparse attention techniques, particularly in scenarios with limited attention resources, leading to improved performance in various tasks.'}, 'zh': {'title': '简单注意力稀疏化：优化上下文选择的有效方法', 'desc': '本文提出了一种简单的注意力稀疏化方法（SAS），通过在语言建模损失下端到端训练选择器，来改善稀疏注意力。SAS在注意力softmax中引入了连续的选择器评分，从而优化上下文单位的排名，避免了传统方法中梯度阻断的问题。该方法能够在固定的注意力预算下，更有效地选择对预测有影响的上下文单位。实验结果表明，SAS在推理、长上下文理解和智能任务中，均优于现有的可训练稀疏注意力基线，尤其在预算紧张的情况下表现更为突出。'}}}, {'id': 'https://huggingface.co/papers/2609.12641', 'title': 'Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models', 'url': 'https://huggingface.co/papers/2609.12641', 'abstract': "Abstract LIT improves robot action generalization by first training pose-conditioned action priors without images, then constraining visual inputs through a pose-supervised latent interface that preserves spatial goal information.  Generated by thinkingmachines/Inkling-Small Robot foundation models achieve strong in-distribution performance but often degrade under visual distribution shifts. When learning to generate actions from pretrained visual representations, models may exploit task-irrelevant visual cues that correlate with demonstrated actions within the training distribution. Such vision-action shortcuts can undermine generalization when these correlations change under distribution shifts. Mitigating these shortcuts requires constraining how visual information is used for action generation while preserving task-relevant spatial information. We propose Latent Interface Training (LIT), a framework-agnostic two-stage strategy that first establishes a spatial-goal-conditioned action prior without images, then constrains visual conditioning through a pose-supervised latent interface. Stage 1 trains the action expert to generate action chunks conditioned on language, robot state, and each demonstrated chunk's terminal SE(3) end-effector pose, learning goal-directed action generation independently of visual cues. Stage 2 introduces a latent interface that aggregates visual and semantic representations and serves as the pretrained action expert's only visual conditioning pathway. The interface is supervised to reconstruct the terminal pose previously used to condition Stage 1, encouraging it to retain the goal-relevant spatial information needed for action generation. Across four vision-language-action and world-action architectures (Pi0.5, MolmoAct2, FAST-WAM, and ImageWAM), LIT improves overall LIBERO-Plus success by 3.87-10.70 percentage points while preserving or improving average LIBERO success. Real-world evaluations show 13.30-16.70 percentage-point gains in success aggregated across three tasks under unseen camera configurations, lighting variations, and distractors.", 'score': 37, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '85eb882a70551289', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#architecture', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Разделённое обучение: контроль визуальных входов через пространственные ограничения для обобщения действий робота', 'desc': 'В работе предлагается метод LIT для улучшения обобщения действий робота на новые визуальные распределения данных. Подход состоит из двух этапов: сначала обучается приоритет действий, обусловленный позой конечного эффектора, без использования изображений, а затем визуальные входы ограничиваются через интерфейс, контролируемый позой. Такая архитектура предотвращает использование модельными визуальных артефактов, не релевантных задаче, и сохраняет пространственную информацию о целевых позициях. Метод показывает значительные улучшения на тестовых наборах LIBERO-Plus и в реальных экспериментах с робот-манипуляторами при столкновении с новыми ракурсами камер и условиями освещения.'}, 'en': {'title': 'Enhancing Robot Action Generalization with LIT', 'desc': "The paper presents Latent Interface Training (LIT), a method that enhances the ability of robots to generalize actions across different visual conditions. It does this by first training action priors based on pose information without relying on images, which helps avoid learning irrelevant visual cues. In the second stage, a latent interface is introduced to combine visual and semantic data while ensuring that the robot retains important spatial information for action generation. The results show significant improvements in action success rates across various tasks and conditions, demonstrating LIT's effectiveness in real-world scenarios."}, 'zh': {'title': '提升机器人动作泛化能力的潜在接口训练', 'desc': 'LIT（潜在接口训练）通过两个阶段的策略来提高机器人动作的泛化能力。第一阶段在没有图像的情况下训练与姿态相关的动作先验，第二阶段通过姿态监督的潜在接口来约束视觉输入，从而保留空间目标信息。该方法有效减少了视觉-动作的捷径，确保机器人在不同视觉条件下仍能生成有效的动作。实验结果表明，LIT在多个任务中显著提高了成功率，尤其是在未见过的环境中。'}}}, {'id': 'https://huggingface.co/papers/2609.11682', 'title': 'COBRA-Skills: Contextual Bandit-Guided Evolution for Agent Skill Optimization', 'url': 'https://huggingface.co/papers/2609.11682', 'abstract': 'Abstract COBRA-Skills improves LLM agent skill optimization by using contextual-bandit prioritization and evidence-based evolution to cut evaluation costs while maintaining high performance.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents can benefit from reusable skills distilled from prior task experience, yet existing skill optimization methods often rely on costly execution-based evaluation and substantial task data. We introduce COBRA-Skills, an efficient framework that formulates skill optimization as budgeted sequential optimization over a dynamically evolving candidate space. COBRA-Skills couples contextual-bandit-guided prioritization with evidence-grounded skill evolution, selectively allocating evaluations to promising or informative candidates while continually refining the skill population from execution feedback. Across six heterogeneous agent benchmarks and three target models, COBRA-Skills consistently achieves the strongest average performance among compared methods, while reducing optimization cost by 55--58\\% relative to SkillOpt and using only 50 unique optimization examples per benchmark. Further analyses show that COBRA-Skills remains robust to changes in the agent harness and performs effectively when the target model itself is used for skill generation and refinement.', 'score': 24, 'issue_id': 3270, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'dd7d09e98fd25f64', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Умная оптимизация навыков агентов: экономия вычислений через контекстный бандит', 'desc': 'В статье представлен COBRA-Skills — эффективный фреймворк для оптимизации навыков LLM-агентов, который использует контекстный многорукий бандит для приоритизации кандидатов и эволюционный процесс, основанный на доказательствах. Метод формулирует задачу как последовательную оптимизацию с ограниченным бюджетом вычислений над динамически изменяющимся пространством кандидатов. COBRA-Skills значительно снижает стоимость оценки на 55-58% по сравнению с существующими подходами, при этом используя всего 50 примеров оптимизации на каждом бенчмарке. Экспериментальные результаты на шести разнородных бенчмарках демонстрируют, что предложенный метод достигает лучшей производительности и остаётся устойчивым к изменениям архитектуры агента.'}, 'en': {'title': 'Efficient Skill Optimization for LLM Agents with COBRA-Skills', 'desc': 'COBRA-Skills is a new framework designed to enhance the optimization of skills in large language model (LLM) agents. It uses a method called contextual-bandit prioritization to focus on the most promising skills, which helps reduce the costs associated with evaluating these skills. By continuously refining skills based on execution feedback, COBRA-Skills can adapt and improve over time. The framework has shown to significantly lower optimization costs while maintaining high performance across various benchmarks.'}, 'zh': {'title': 'COBRA-Skills：高效的技能优化新方法', 'desc': 'COBRA-Skills 是一种改进大语言模型（LLM）代理技能优化的方法。它通过上下文赌博优先级和基于证据的演化来降低评估成本，同时保持高性能。该框架将技能优化视为预算序列优化，动态调整候选空间。实验表明，COBRA-Skills 在多个基准测试中表现优异，优化成本降低了55%到58%。'}}}, {'id': 'https://huggingface.co/papers/2608.30597', 'title': 'PLC-DPO: Posterior Label Correction in Noisy and Ambiguous Preference Optimization', 'url': 'https://huggingface.co/papers/2608.30597', 'abstract': "Abstract Posterior Label Correction DPO improves preference optimization by routing noisy pairwise labels into clean, flipped, or tied cases using calibrated policy-reference margins.  Generated by thinkingmachines/Inkling-Small Direct Preference Optimization (DPO) simplifies alignment through pairwise comparisons but assumes all observed preferences are reliable. Real data often violates this assumption, leading to reversed, weak, or ambiguous labels that cause harmful policy updates. To address this, we propose Posterior Label Correction DPO (PLC-DPO) to robustly optimize preferences by routing each pair's training signal as a clean, flip, or tie case. The key idea is to use the calibrated policy-reference margin as online evidence to take appropriate correction actions. This reframes noisy preference learning as actively correcting supervision direction and strength rather than merely filtering suspicious examples. Across 57 dataset-model-benchmark cells, PLC-DPO obtains the best mean win rate against DPO (60.5 vs. 55.5 for the next-best method). Injected-noise and tie stress tests, human disagreement analysis, and self-confirmation diagnostics further show that the routing remains stable and distinguishes flipped from weakly directional pairs.", 'score': 22, 'issue_id': 3270, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '19ed22f2a621efb4', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rlhf', '#training'], 'emoji': '🎯', 'ru': {'title': 'Исправление шумных предпочтений через активную маршрутизацию меток', 'desc': 'Статья предлагает Posterior Label Correction DPO — улучшенный метод оптимизации предпочтений, который обрабатывает зашумлённые парные метки путём их маршрутизации в три категории: чистые, перевёрнутые и неоднозначные случаи. Метод использует откалиброванный margin между политикой и референсной моделью как онлайн-сигнал для принятия решений о коррекции. Вместо фильтрации подозрительных примеров, PLC-DPO активно корректирует направление и силу обучающих сигналов, что делает обучение более устойчивым к шуму в данных. Экспериментальные результаты показывают превосходство метода над базовым DPO на 57 различных комбинациях датасетов, моделей и бенчмарков.'}, 'en': {'title': 'Robust Preference Learning with Posterior Label Correction', 'desc': 'The paper introduces Posterior Label Correction DPO (PLC-DPO), a method that enhances preference optimization in machine learning by addressing the issue of noisy pairwise labels. Traditional Direct Preference Optimization (DPO) assumes that all observed preferences are accurate, which is often not the case in real-world data. PLC-DPO improves this by categorizing training signals into clean, flipped, or tied cases based on calibrated policy-reference margins, allowing for more robust learning. The results demonstrate that PLC-DPO outperforms standard DPO across various datasets, effectively correcting supervision direction and strength in the presence of label noise.'}, 'zh': {'title': '后验标签修正，提升偏好优化的鲁棒性', 'desc': '本文提出了一种名为后验标签修正直接偏好优化（PLC-DPO）的方法，旨在提高偏好优化的鲁棒性。传统的直接偏好优化（DPO）假设所有观察到的偏好都是可靠的，但实际数据常常存在噪声，导致标签反转或模糊。PLC-DPO通过将每对训练信号分类为干净、翻转或平局案例，来有效地优化偏好。该方法利用校准的策略参考边际作为在线证据，主动纠正监督方向和强度，从而改善学习效果。'}}}, {'id': 'https://huggingface.co/papers/2609.12945', 'title': 'StepAudio 3 Gen Technical Report', 'url': 'https://huggingface.co/papers/2609.12945', 'abstract': 'Abstract StepAudio 3 Gen is a discrete autoregressive audio generation model using residual vector quantization tokens to unify text-to-speech, voice design, sound effects, and music within a single framework.  Generated by thinkingmachines/Inkling-Small We introduce StepAudio 3 Gen, a general-purpose audio generation model that supports zero-shot text-to-speech (TTS), voice design, vocal generation, sound effects, music, vibe speech, and mixtures of multiple audio types within a unified framework. At its core, StepAudio 3 Gen is a discrete autoregressive generator that models audio directly over residual vector quantization (RVQ) tokens, departing from the diffusion Transformer-based continuous generation paradigm prevalent in recent general audio models. Its StepAudio Tokenizer represents general audio at 12.5 Hz in a shared 16 times 2048 residual code space, jointly quantizing semantic and waveform-level acoustic features so that each code layer preserves both types of information. For generation, the backbone predicts the first codebook along the time axis using autoregressive modeling, while a lightweight causal Transformer completes the remaining fifteen codebooks along the codebook axis. Our study further identifies three key design principles: (1) interference-aware progressive pretraining for acquiring audio capabilities while preserving the textual abilities of the large language model, (2) RVQ Adaptor for effectively incorporating multi-codebook acoustic representations, and (3) discrete autoregressive modeling over a shared representation across general audio domains. With progressive pretraining, multi-task instruction training, and supervised fine-tuning, StepAudio 3 Gen achieves state-of-the-art performance on both TTS and voice design, while retaining strong generation capabilities across speech, vocals, sound effects, and music. Audio samples are available at https://stepaudiollm.github.io/step-audio-3-gen/.', 'score': 20, 'issue_id': 3271, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': 'da2dd0ebfcdc8a7c', 'pdf_title_img': 'assets/pdf/title_img/2609.12945.jpg', 'data': {'categories': ['#multimodal', '#open_source', '#training', '#audio', '#architecture'], 'emoji': '🎵', 'ru': {'title': 'Единая авторегрессивная модель для всех типов звука', 'desc': 'Представлена StepAudio 3 Gen — универсальная модель для генерации аудио, которая использует дискретное авторегрессивное моделирование на основе остаточного векторного квантования (RVQ) для единой обработки синтеза речи, дизайна голоса, звуковых эффектов и музыки. Модель кодирует аудио в виде дискретных токенов RVQ с разрешением 12.5 Hz, объединяя семантические и волновые акустические признаки в общем пространстве представлений. Архитектура использует авторегрессивный трансформер для предсказания первого кодбука по временной оси и легковесный причинный трансформер для заполнения оставшихся пятнадцати кодбуков. Ключевые инновации включают помехоустойчивое прогрессивное предобучение для сохранения текстовых способностей LLM, RVQ адаптер для интеграции мультикодбуковых представлений и дискретное авторегрессивное моделирование в общем пространстве признаков для всех типов аудио.'}, 'en': {'title': 'Unifying Audio Generation with StepAudio 3 Gen', 'desc': "StepAudio 3 Gen is an advanced audio generation model that integrates various audio tasks like text-to-speech, voice design, and music generation into one system. It uses a discrete autoregressive approach with residual vector quantization tokens to effectively model audio data. The model's unique StepAudio Tokenizer captures both semantic and waveform features, allowing for high-quality audio generation. With innovative training techniques, it achieves top performance in generating diverse audio types while maintaining the ability to understand and produce text-based audio."}, 'zh': {'title': '统一音频生成的全能模型', 'desc': 'StepAudio 3 Gen 是一种离散自回归音频生成模型，使用残差向量量化（RVQ）令牌，将文本到语音、声音设计、音效和音乐统一在一个框架内。该模型支持零-shot 文本到语音（TTS）和多种音频类型的生成，采用了新的生成方法，区别于传统的扩散 Transformer 模型。其核心是通过 RVQ 令牌直接建模音频，使用 StepAudio Tokenizer 在共享的残差编码空间中量化语义和波形特征。通过逐步预训练和多任务训练，StepAudio 3 Gen 在 TTS 和声音设计上达到了最先进的性能，同时在语音、声乐、音效和音乐生成方面也表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.08418', 'title': 'Feyospace-v1: How the Cyber Mercury Seven Trained Frontier Cyber Models', 'url': 'https://huggingface.co/papers/2609.08418', 'abstract': 'Abstract A data-centric framework with specialized systems for reasoning analysis, cost reduction, and execution verification enables small teams to train open-weight cyber agents that achieve top-tier performance on benchmark suites.  Generated by thinkingmachines/Inkling-Small Training capable cyber agents is often treated primarily as a problem of model scale, yet open-weight post-training is constrained more directly by the cost of executable environments, reliable multi-turn supervision, and access to strong teachers. We present a data-centric framework that addresses these bottlenecks through five complementary systems: Choulea analyzes hidden reasoning signatures, SkyReal reduces teacher-sampling cost, Hongzwang bypasses API restrictions on teacher execution, PSBreakup restores capabilities weakened by model merging, and Kreator converts expert interventions into trainable reasoning. Our data engine constructs resettable coding, vulnerability, CTF, kernel-history, full-exploit, firmware, and device-backed environments. Candidate trajectories are retained only after execution verification and evidence auditing, yielding 164,269 trajectories for long-context supervised fine-tuning. The three checkpoints improve over their starting models by an average of 23.76% on the full CyberGym suite and 10.49% across the pooled CTF suites. As of September 1, 2026, Feyospace-s1 achieves a verified success rate of 63.24% and ranks 10th on the official CyberGym leaderboard, while all three checkpoints rank 1st among models at comparable parameter scales. To our knowledge, this is the first end-to-end demonstration that a seven-person independent team can train open-weight models with leading agentic cyber capability.', 'score': 12, 'issue_id': 3271, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '8a656bb3f1afc63f', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#synthetic', '#benchmark', '#optimization', '#dataset', '#long_context', '#data', '#training', '#open_source', '#agents', '#reasoning', '#small_models'], 'emoji': '🛡️', 'ru': {'title': 'Качество данных важнее масштаба: как малая команда создала top-tier киберагента', 'desc': 'В работе представлена data-centric методология для обучения открытых киберагентов, которая вместо масштабирования модели фокусируется на качестве данных и эффективности обучения. Авторы разработали пять специализированных систем для анализа рассуждений, снижения стоимости обучения, обхода ограничений API и восстановления возможностей моделей, а также конвертации экспертных вмешательств в обучаемые стратегии. Система включает резетируемые окружения для кодирования, поиска уязвимостей и CTF-задач, с проверкой каждой траектории выполнения перед включением в fine-tuning датасет. Результаты показывают, что небольшая команда смогла натренировать киберагент, достигший лучших показателей на бенчмарках и заняв 10-е место в официальном рейтинге CyberGym.'}, 'en': {'title': 'Empowering Small Teams to Train Top Cyber Agents Efficiently', 'desc': 'This paper introduces a data-centric framework designed to enhance the training of open-weight cyber agents, focusing on improving performance while minimizing costs. It identifies key challenges such as the need for reliable supervision and effective execution environments, and proposes five specialized systems to address these issues. The framework allows for the analysis of reasoning patterns, reduces the costs associated with teacher sampling, and ensures that only verified execution paths are retained for training. The results show significant performance improvements on benchmark suites, demonstrating that small teams can achieve top-tier results in cyber agent training.'}, 'zh': {'title': '数据驱动，提升网络代理训练效率', 'desc': '这篇论文提出了一种以数据为中心的框架，旨在解决训练开放权重网络代理时的瓶颈问题。通过五个互补系统，该框架能够分析推理签名、降低教师采样成本、绕过API限制等，从而提高训练效率。研究表明，经过验证的执行轨迹可以显著提升模型在网络安全基准测试中的表现。最终，七人团队成功训练出具有领先能力的开放权重模型，展示了小团队在这一领域的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.13146', 'title': 'SNAP3D: Physically Grounded 3D Parts for Assembly from a Single Image', 'url': 'https://huggingface.co/papers/2609.13146', 'abstract': 'Abstract A physics-guided framework improves part-aware 3D generation by resolving inter-part penetration, recovering contact graphs, and refining parameterized connectors via simulation feedback to ensure stable, physically valid assemblies.  Generated by thinkingmachines/Inkling-Small Part-aware 3D asset generation enables applications such as editing, articulation, simulation, and fabrication, yet existing methods can generate visually complete individual parts without ensuring that they form a valid physical assembly. Consequently, generated neighboring parts may interpenetrate, lack valid connections, or collapse under gravity. We propose a physics-guided framework for improving single-image part-aware 3D generation with physically compatible geometry and stable connections. Our method resolves inter-part penetration, recovers a contact graph between neighboring parts, and introduces parameterized connectors at their contact surfaces. Using feedback from physical simulation, we refine connector placement, orientation, and dimensions to improve assembly stability while preserving the generated geometry. We further introduce a physics-based evaluation protocol that complements conventional geometric metrics by directly testing assembly validity and stability under gravity. Experiments comparing against multiple part-aware 3D generators show substantial improvements in physical realizability and stability while maintaining geometric quality. We additionally validate the resulting parts through 3D printing and real-world assembly.', 'score': 1, 'issue_id': 3270, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '05e3651d1f2b7d59', 'pdf_title_img': 'assets/pdf/title_img/2609.13146.jpg', 'data': {'categories': [], 'emoji': '🔧', 'ru': {'title': 'Физически обоснованная генерация сборных 3D-объектов со стабильными соединениями', 'desc': 'Статья предлагает структуру, управляемую физикой, для улучшения генерации 3D-объектов из отдельных частей. Метод решает проблему взаимного проникновения деталей, восстанавливает граф контактов между соседними частями и вводит параметризованные соединители на поверхностях контакта. Используя обратную связь от физической симуляции, алгоритм уточняет размещение, ориентацию и размеры соединителей для повышения стабильности сборки. Авторы также предлагают новый протокол оценки на основе физики, который проверяет валидность и стабильность сборки под воздействием гравитации.'}, 'en': {'title': 'Building Better 3D Parts with Physics!', 'desc': 'This paper presents a new method for generating 3D models of parts that fit together correctly, addressing common issues like parts overlapping or not connecting properly. The authors introduce a physics-guided framework that uses simulations to ensure that the generated parts can be assembled in a stable and physically valid way. By recovering contact graphs and refining connectors between parts, the method enhances the quality of 3D assets for applications like editing and fabrication. The results show significant improvements in the physical stability of the assemblies while maintaining their geometric integrity.'}, 'zh': {'title': '物理引导的3D生成，确保稳定组装', 'desc': '本论文提出了一种物理引导的框架，以改善基于单图像的部件感知3D生成。该方法解决了部件间的相互穿透问题，恢复了邻近部件之间的接触图，并通过物理仿真反馈优化了连接器的参数。通过这种方式，生成的3D模型不仅在视觉上完整，而且在物理上也能稳定组装。实验结果表明，与现有方法相比，我们的方法在物理可实现性和稳定性方面有显著提升，同时保持了几何质量。'}}}, {'id': 'https://huggingface.co/papers/2609.05824', 'title': 'Beyond Top-k Skill Retrieval: Diversity-Aware Skill Routing for LLM Agents', 'url': 'https://huggingface.co/papers/2609.05824', 'abstract': 'Abstract Diverse Skill Routing improves LLM agent skill selection by balancing relevance with non-redundancy via a determinantal point process, boosting multi-skill coverage.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents increasingly rely on external skills, but routing user requests over large skill registries is difficult because many skills are functionally redundant while complex tasks often require complementary skill sets. Existing skill routers typically rank candidates independently by query relevance, which can waste context budget on redundant skills. We propose Diverse Skill Routing (DSR), a diversity-aware reranking framework that uses a Determinantal Point Process to balance relevance and non-redundancy. DSR introduces a query-residual diversity kernel that penalizes redundant skill overlap while reducing penalties caused only by shared query relevance. On the SkillRouter benchmark, DSR improves recall and full coverage over a strong pointwise reranking baseline, with larger gains on multi-skill queries. These results suggest that skill routing should be treated not only as relevance ranking, but also as complementary set selection.', 'score': 1, 'issue_id': 3271, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '302170a2d6f5130a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Умный выбор дополняющих навыков вместо простого ранжирования', 'desc': 'Статья предлагает новый метод Diverse Skill Routing для улучшения выбора навыков в агентах на основе больших языковых моделей. Вместо независимого ранжирования навыков по релевантности, авторы используют детерминантный точечный процесс для балансировки между релевантностью и разнообразием, избегая избыточных навыков. Предложенный подход вводит ядро разнообразия на основе остатков запроса, которое штрафует дублирующиеся навыки и сохраняет релевантные результаты. На бенчмарке SkillRouter метод показывает улучшение в полноте поиска и покрытии всех требуемых навыков, особенно для сложных запросов, требующих нескольких дополнительных инструментов.'}, 'en': {'title': 'Enhancing Skill Selection with Diverse Skill Routing', 'desc': 'The paper introduces Diverse Skill Routing (DSR), a new framework for selecting skills in large language model (LLM) agents. DSR uses a Determinantal Point Process to ensure that selected skills are both relevant and non-redundant, which is important for complex tasks that require a variety of skills. By implementing a query-residual diversity kernel, DSR minimizes the overlap of redundant skills while still considering their relevance. The results show that DSR significantly improves the ability to cover multiple skills in queries compared to traditional methods, highlighting the need for a more nuanced approach to skill selection.'}, 'zh': {'title': '多样化技能路由：提升技能选择的智能', 'desc': '多样化技能路由（DSR）通过使用行列式点过程来改善大型语言模型（LLM）代理的技能选择，平衡相关性与非冗余性，从而增强多技能覆盖。现有的技能路由器通常独立地根据查询相关性对候选技能进行排名，这可能导致在冗余技能上浪费上下文预算。DSR引入了一种查询残差多样性核，惩罚冗余技能重叠，同时减少仅因共享查询相关性而产生的惩罚。实验结果表明，DSR在技能路由基准测试中显著提高了召回率和全面覆盖，尤其在多技能查询中表现更佳。'}}}, {'id': 'https://huggingface.co/papers/2609.05820', 'title': 'Online Learning with LLM Experts from Limited Feedback', 'url': 'https://huggingface.co/papers/2609.05820', 'abstract': 'Abstract Adaptive routing of prompts to LLM experts is formulated as a contextual bandit problem with limited feedback, yielding algorithms with sublinear regret bounds and effective routing strategies.  Generated by thinkingmachines/Inkling-Small We study adaptive routing of prompts to large language model (LLM) experts to maximize response quality in an online setting with limited feedback. We formulate it as a bandit problem with K actions that represent experts and d features that encode prompts, over a horizon of T rounds. We propose algorithms that strategically select and observe rewards to minimize regret. In the full-information setting, we achieve a regret of O(d T / m), while in the bandit setting we achieve O(d T K / m), where m ll T is a budget on feedback. Our experiments show that we efficiently learn high-quality routing strategies across diverse LLMs from limited feedback.', 'score': 1, 'issue_id': 3271, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '5c228d26a264e82e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔀', 'ru': {'title': 'Умная маршрутизация запросов между экспертными моделями с минимальной обратной связью', 'desc': 'В работе изучается адаптивная маршрутизация запросов к различным экспертам на основе больших языковых моделей с целью максимизации качества ответов в онлайн-режиме с ограниченной обратной связью. Авторы формулируют эту задачу как контекстную многорукую бандиту, где каждый эксперт представляет отдельное действие, а признаки кодируют особенности входящих запросов. Предложенные алгоритмы стратегически выбирают, какие ответы оценивать, чтобы минимизировать сожаление (regret) при ограниченном бюджете обратной связи. Экспериментальные результаты демонстрируют, что подход эффективно обучает высококачественные стратегии маршрутизации между различными LLM на основе небольшого объёма оцененных примеров.'}, 'en': {'title': 'Smart Routing for Better LLM Responses', 'desc': 'This paper addresses the challenge of directing prompts to specific large language model (LLM) experts to enhance the quality of responses in real-time scenarios with restricted feedback. It frames the problem as a contextual bandit problem, where each expert represents an action and the prompts are characterized by features. The authors develop algorithms that aim to minimize regret, which is the difference between the optimal and actual performance, achieving sublinear regret bounds in both full-information and bandit settings. Experimental results demonstrate the effectiveness of these algorithms in learning optimal routing strategies across various LLMs using limited feedback.'}, 'zh': {'title': '智能路由：优化LLM专家的提示分配', 'desc': '本文研究了如何将提示有效地路由到大型语言模型（LLM）专家，以最大化响应质量。我们将这一过程建模为一个上下文赌博机问题，涉及有限的反馈信息。提出的算法能够在不同的专家之间进行策略选择，并通过观察奖励来最小化遗憾值。实验结果表明，我们能够在有限反馈的情况下高效学习出高质量的路由策略。'}}}];
        const articlesContainer = document.getElementById('articles-container');

                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-14 08:22')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-14 08:22')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
