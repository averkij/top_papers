ion, and the ability to represent uncertainty and diverse plausible results.'}, 'zh': {'title': '双域联合流：让图像重建与测量去噪协同完成', 'desc': '这篇论文提出 Dual Flow，用联合流模型同时估计清晰图像和无噪声测量值，以解决线性逆问题。模型将带噪测量值仅用于初始化测量状态，之后在图像域和测量域中交替依据当前状态联合更新，并保证最终结果符合前向模型。作者推导了更新所需的条件均值，并将其转化为带有算子相关相关噪声的图像域高斯去噪问题，再训练速度预测网络来估计该条件均值。实验显示，Dual Flow 在重建精度和感知质量上表现出色，推理时间较短、无需额外超参数调节，并能分析重建的不确定性与多样性。'}}}, {'id': 'https://huggingface.co/papers/2611.16500', 'title': 'EvenVLM: A Text and Multimodal Dataset for the Even Language with Vision-Language Fine-Tuning', 'url': 'https://huggingface.co/papers/2611.16500', 'abstract': "Abstract EvenVLM provides a text and multimodal VQA dataset for the endangered Even language, with tokenizer expansion and LoRA fine-tuning improving translation, text benchmarks, and VQA accuracy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We present EvenVLM, the first text and multimodal (VQA) dataset for Even (Lamut), an endangered Northern Tungusic language spoken by approximately 6,800 people in Siberia. Our dataset comprises 50,521 structured Even-Russian entries extracted from dictionary and phrasebook sources via GPT-4o Mini-based parsing, from which we synthetically generate 107,543 training examples spanning translation, grammar, reading comprehension, and semantic classification. To address tokenization inefficiency on Even's agglutinative morphology, we propose a three-step tokenizer expansion algorithm that adds Even-specific graphemes (eng, oe, o-umlaut), whitelisted vocabulary, and BPE merges, reducing average tokens per word by 27% (4.99 to 3.64). Using LoRA fine-tuning of Qwen3-VL-4B, we adapt the model for text tasks (0.53% trainable parameters, rank 32) and separately for visual question answering (rank 64, frozen vision encoder). Our best configuration achieves 11.4% exact match and a 13.6 weighted score on text benchmarks, 0.1283 chrF for sentence translation, and 65% accuracy on VQA (up from 0% for the base model and text-only fine-tuning). We release our datasets, evaluation benchmarks, and training pipeline to support further research on Even and other low-resource languages.", 'score': 1, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '7884ae545fcd6106', 'authors': ['Daniil Makovetskii', 'Ivan Bondarenko'], 'affiliations': ['Novosibirsk State University, Novosibirsk, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2611.16500.jpg', 'data': {'categories': ['#data', '#multilingual', '#dataset', '#machine_translation', '#multimodal', '#architecture', '#inference', '#training', '#benchmark', '#open_source', '#low_resource', '#synthetic'], 'emoji': '🗣️', 'ru': {'title': 'Возрождаем язык эвенов с помощью LLM и мультимодального обучения', 'desc': 'В статье представлен EvenVLM — первый набор данных для текстовых и мультимодальных задач (VQA) на языке эвенов, находящемся под угрозой исчезновения. Данные извлечены из словарей и разговорников с помощью парсинга на базе GPT-4o Mini и дополнены синтетически сгенерированными примерами для перевода, грамматики и понимания текста. Авторы расширяют токенизатор под агглютинативную морфологию эвенского языка, что сокращает число токенов на слово на 27%. Дообучение Qwen3-VL-4B методом LoRA заметно повышает качество перевода и точность VQA: с 0% у базовой модели до 65%.'}, 'en': {'title': 'Giving Even a Voice in Text and Images', 'desc': 'EvenVLM is a dataset and model adaptation project for Even, an endangered Siberian language. The researchers created text and visual question-answering examples, then expanded the tokenizer to handle Even’s word forms more efficiently. They used LoRA fine-tuning to adapt a vision-language model for language tasks and VQA. The adapted model improved translation and text benchmark results, and reached 65% accuracy on VQA where the original model scored 0%.'}, 'zh': {'title': '扩展分词器并微调模型，让濒危埃文语走向多模态应用', 'desc': '本文提出 EvenVLM，这是首个面向濒危语言埃文语的文本与多模态视觉问答数据集。研究团队从词典和短语书中整理出语料，并生成涵盖翻译、语法、阅读理解和语义分类的训练样本。为改善埃文语黏着词形导致的分词问题，作者扩展了分词器，使平均每词所需的令牌数减少 27%，并使用 LoRA 微调 Qwen3-VL-4B。微调后模型在文本任务上取得一定成绩，视觉问答准确率达到 65%，而基础模型的准确率为 0%。'}}}, {'id': 'https://huggingface.co/papers/2611.15640', 'title': 'MemInStream: Memorizing or Merely Recognizing? Rethinking Streaming Video Memory Evaluation', 'url': 'https://huggingface.co/papers/2611.15640', 'abstract': 'Abstract MemInStream is a benchmark that evaluates memory capabilities in streaming video understanding using evidence-controlled validation to separate memory limitations from visual understanding failures.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Streaming video understanding aims to continuously process incoming visual observations, making the retention and retrieval of relevant information increasingly important as the video history grows. Although existing benchmarks include memory-related questions, question-answering accuracy alone does not reliably measure memory capabilities. Incorrect predictions may arise from failures in visual understanding rather than forgetting, whereas correct predictions may rely on linguistic priors or recent observations without requiring historical memory. To address these ambiguities, we introduce MemInStream, a benchmark dedicated to evaluating memory capabilities in streaming video understanding. We develop an evidence-controlled validation protocol that associates each question with temporally localized evidence intervals. The protocol validates evidence solvability and memory necessity by retaining questions that models can answer from the annotated evidence but cannot resolve using recent observations, post-evidence observations, or textual input alone. This helps disentangle memory limitations from understanding failures while reducing memory-independent shortcuts. MemInStream provides a systematic evaluation of memory capabilities through four major categories, covering Episodic Retrieval, State Tracking \\& Updating, Multi-Evidence Integration, and Contextual Memory across diverse video scenarios. Overall, MemInStream provides a comprehensive and reliable benchmark for systematically evaluating memory capabilities in streaming video understanding.', 'score': 1, 'issue_id': 3540, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'e4e27d7db677088e', 'authors': ['Zhenqi He', 'Dunyuan Xu', 'Yang Bo', 'Kien T. Pham', 'Yanghao Wang', 'Shuhan Li', 'Xintong Guo', 'Yuyang He', 'Fang Liu', 'Huankang Guan', 'Jingyan Chen', 'Rui Liu', 'Long Chen'], 'affiliations': ['CUHK', 'CityU', 'HKUST', 'Huawei Research'], 'pdf_title_img': 'assets/pdf/title_img/2611.15640.jpg', 'data': {'categories': ['#multimodal', '#video', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Проверяем память модели, а не только её зрение, в потоковом видео', 'desc': 'В статье представлен MemInStream — бенчмарк для оценки memory-способностей LLM и AI-моделей при понимании потокового видео. Авторы показывают, что одной точности ответов на вопросы недостаточно: ошибки могут быть вызваны плохим визуальным пониманием, а верные ответы — языковыми priors или недавними кадрами. Для решения этой проблемы предложен протокол evidence-controlled validation, который привязывает вопросы к временным интервалам и отбирает только те, где память действительно необходима. Бенчмарк охватывает четыре категории: Episodic Retrieval, State Tracking & Updating, Multi-Evidence Integration и Contextual Memory.'}, 'en': {'title': 'MemInStream: Test What Video Models Truly Remember', 'desc': 'MemInStream is a benchmark for testing how well models remember information in streaming video. It uses temporally localized evidence and checks that each question can be answered from that evidence, but not from recent video, later observations, or text alone. This evidence-controlled protocol helps distinguish memory failures from visual understanding errors and prevents shortcuts based on linguistic priors. The benchmark evaluates episodic retrieval, state tracking and updating, multi-evidence integration, and contextual memory.'}, 'zh': {'title': '让视频记忆评测真正检验“记住了什么”', 'desc': '这篇论文提出了 MemInStream，一个用于评估模型在流式视频理解中记忆能力的基准。它为每个问题标注视频中对应的证据时间段，并验证模型能否根据这些证据答题，以及是否必须依赖较早的观察。这样可以区分记忆不足与视觉理解错误，并减少模型仅凭语言线索或近期画面答对的情况。基准涵盖情节检索、状态跟踪与更新、多证据整合和情境记忆四类任务。'}}}, {'id': 'https://huggingface.co/papers/2611.16312', 'title': 'Alloy: A Multi-Material Physics Engine for Robot Learning', 'url': 'https://huggingface.co/papers/2611.16312', 'abstract': 'Abstract  Robots handle much more than rigid objects: towels, cables, water, sand. The simulators used to train robots at scale are strongest on rigid bodies, and adding another material usually means a second engine and hand-written glue between the two. We present Alloy, an open-source physics engine for robot learning in which rigid robots, cloth, cables, liquids, granular material and soft bodies share one scene. Each object is described once; Alloy assigns it to a solver suited to its material, couples the solvers inside every control step, and runs the scene in many parallel worlds on one GPU, or on a CPU. Every world carries a health grade, to help tell a failure of the physics from a failure of the policy. Alloy is built on Newton, MuJoCo Warp and Warp, and it is written to be driven by coding agents: its documentation ships inside the package, every error names its fix, and the engine is exposed as tools over the Model Context Protocol. In a cold test, agents that had never seen Alloy installed a pre-release from the package index and trained policies for walking, cable handling and pouring on a single GPU. We also report how throughput grows with the number of worlds, depth-camera throughput, agreement with closed-form references, and a reliability test over a thousand worlds.', 'score': 0, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '6600e006af10bdc3', 'authors': ['Pranay Gupta', 'Deepanshu Rohilla'], 'affiliations': ['Argon Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2611.16312.jpg', 'data': {'categories': ['#agents', '#optimization', '#inference', '#games', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Один движок для всех материалов: от жёстких роботов до жидкостей и ткани', 'desc': 'В статье представлен Alloy — открытый физический движок для обучения роботов (robot learning), в котором жёсткие роботы, ткань, кабели, жидкости, сыпучие материалы и мягкие тела работают в одной сцене. Каждый объект описывается один раз, а движок автоматически назначает ему подходящий солвер и связывает солверы внутри каждого шага управления. Симуляция выполняется параллельно во многих мирах на одном GPU или CPU, а каждый мир получает оценку состояния, помогающую отличить сбой физики от сбоя policy. Движок построен на Newton, MuJoCo Warp и Warp и рассчитан на работу с LLM-агентами через Model Context Protocol.'}, 'en': {'title': 'One Scene, Many Materials, Faster Robot Learning', 'desc': 'Alloy is an open-source physics engine for robot learning that simulates rigid robots and materials such as cloth, cables, liquids, sand, and soft bodies in one scene. It assigns each material to a suitable solver and couples those solvers at every control step, while running many parallel simulations on a GPU or CPU. The engine also tracks the health of each simulated world, helping researchers distinguish physics errors from policy failures. Tests show that coding agents can use Alloy to train robot policies, and the paper measures its speed, accuracy, and reliability.'}, 'zh': {'title': '让多种材料在同一个机器人仿真世界中协同运行', 'desc': '本文介绍 Alloy，一个面向机器人学习的开源物理引擎，可在同一场景中模拟刚体、布料、线缆、液体、颗粒和软体。它会根据材料为物体分配合适的求解器，并在每个控制步中耦合这些求解器，还能在单张 GPU 或 CPU 上并行运行多个仿真环境。引擎为每个环境提供健康度评分，帮助区分物理仿真故障与策略失败；作者还评估了运行速度、深度相机吞吐量、与解析参考结果的一致性及大规模可靠性。实验显示，未接触过 Alloy 的编码智能体也能安装该引擎，并在单张 GPU 上训练行走、操控线缆和倾倒液体等任务的策略。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (5)', '#agents (17)', '#agi (3)', '#alignment (5)', '#architecture (11)', '#audio (2)', '#benchmark (22)', '#cv (6)', '#data (14)', '#dataset (8)', '#diffusion (8)', '#ethics', '#games (3)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference (11)', '#interpretability (6)', '#leakage (3)', '#long_context (2)', '#low_resource (1)', '#machine_translation (1)', '#math (1)', '#multilingual (2)', '#multimodal (11)', '#open_source (13)', '#optimization (16)', '#plp (3)', '#rag (1)', '#reasoning (3)', '#rl (3)', '#rlhf (1)', '#robotics (5)', '#science (6)', '#security (3)', '#small_models (4)', '#story_generation', '#survey (2)', '#synthetic (8)', '#training (19)', '#transfer_learning (1)', '#video (9)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-17 04:56',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-17 04:56')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-17 04:56')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
