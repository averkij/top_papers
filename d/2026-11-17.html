 scores, fresh sampling, a valid reference-evaluation construct, and declared evaluation distributions; they do not establish universal agent safety or robustness to arbitrary distribution shift.', 'score': 11, 'issue_id': 3539, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'a7d7638d786dfdeb', 'pdf_title_img': 'assets/pdf/title_img/2611.16378.jpg', 'data': {'categories': ['#benchmark', '#training', '#agents', '#optimization', '#security', '#alignment'], 'emoji': '🛡️', 'ru': {'title': 'Меняйся только тогда, когда есть доказательства', 'desc': 'Статья предлагает фреймворк Evidence-Governed Evolution (EGE), который разделяет генерацию кандидатов на модификации self-modifying агентов и их подтверждённое принятие. Кандидаты оцениваются на свежих парных аудитах, проверяются на значимое улучшение основной метрики и non-inferiority-тесты для защищённых возможностей, после чего проходят bounded canary deployment. Авторы строят одновременную нижнюю оценку (simultaneous lower bound) с калибровкой оценщика через Hoeffding-границы и независимые калибровочные выборки, а также выводят кумулятивную оценку деградации при смене эталонов через bridge tests. Гарантии действуют при ограниченных парных оценках, честной выборке и корректном эталонном оценивании, а Monte Carlo эксперимент показывает работу калибровки при оптимизме оценщика.'}, 'en': {'title': 'Generate Freely, Adopt Only with Evidence', 'desc': 'Evidence-Governed Evolution (EGE) separates generating agent modifications from deciding whether to adopt them. It tests frozen candidates on fresh, paired audits and requires meaningful improvement on a chosen objective without unacceptable loss in protected capabilities. The framework uses calibrated statistical bounds to account for adaptive candidate selection and possible evaluator bias, and it limits approved changes to bounded canary deployments. Its guarantees depend on assumptions such as fresh samples and valid reference evaluations, so they do not prove universal safety or robustness to arbitrary distribution shifts.'}, 'zh': {'title': '让智能体的自我进化先经证据检验，再谨慎部署', 'desc': '本文提出证据治理演进（EGE）框架，用于决定自主智能体生成的修改是否适合长期采用。框架将修改生成与确认评估分开，并在新的配对审计数据上检验候选方案是否带来预先规定的实质改进，同时用非劣效检验保护已有能力。作者还构造了经过评估器校准的同时置信下界，并通过桥接检验和累积退化界管理参考版本的更替。蒙特卡洛实验展示了该方法在评估器可能偏乐观时的校准表现；其保证依赖若干统计假设，不能证明智能体在所有环境中的安全性或应对任意分布偏移的鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2611.18529', 'title': 'eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means', 'url': 'https://huggingface.co/papers/2611.18529', 'abstract': "Abstract A streaming speaker-diarization method removes the fixed speaker-slot limit by clustering speaker embeddings within slots after all slots are used, allowing unlimited speakers and efficient large-scale linking.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Meetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online, but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational corpora are prepared, and it reaches the clustering quality of Lloyd's k-means several times faster. The method needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.", 'score': 11, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '1982988bcb16e4c6', 'authors': ['Kyudan Jung', 'Jihwan Kim', 'Minwoo Lee', 'Eunji Shin', 'Jaegul Choo'], 'affiliations': ['Ewha W. University', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.18529.jpg', 'data': {'categories': ['#audio', '#architecture'], 'emoji': '🎙️', 'ru': {'title': 'Говорящих без лимита: диаризация спикеров без фиксированных слотов', 'desc': 'Статья предлагает метод потоковой диаризации спикеров, который снимает ограничение на фиксированное число слотов в нейросетевых моделях вроде Streaming Sortformer. Голова слотов по-прежнему определяет активность и перекрытие речи, а эмбеддинги спикеров кластеризуются внутри слота алгоритмом e-means только после заполнения всех слотов. Переклассификация ограничена скользящим окном, что позволяет работать онлайн и с часовыми встречами без роста стоимости обновления. Подход не требует переобучения, быстрее k-means и применим для связывания спикеров в больших архивах.'}, 'en': {'title': 'Unlimited Speakers, Steady Streaming', 'desc': 'The paper removes the fixed speaker limit in streaming diarization without retraining the neural model. The model’s slots still detect speech and overlap, while speaker embeddings are clustered with e-means after all slots are used. A bounded re-clustering window lets the system revise recent labels while keeping its cost per update steady, even in long meetings. It also scales to large recording archives, where e-means matches Lloyd’s k-means clustering quality several times faster.'}, 'zh': {'title': '突破固定槽位限制，让流式说话人分离支持无限说话人', 'desc': '本文提出一种流式说话人分离方法，解决固定输出槽位无法处理过多说话人的问题。系统继续用槽位判断谁在说话以及何时发生重叠，并在槽位用尽后，将说话人嵌入在单个槽位内用 e-means 聚类，无需重新训练模型。在线处理时，系统只在有限窗口内重新聚类，并短暂修正标签，因此即使会议长达一小时，每次更新的计算成本也不会随会议时长增长。该方法能处理超过槽位数的说话人，并可高效关联大型录音档案中的说话人；其聚类质量接近 Lloyd k-means，但速度快数倍。'}}}, {'id': 'https://huggingface.co/papers/2611.14505', 'title': 'Continual-ARC: Measuring Skill Acquisition over a Working Lifetime', 'url': 'https://huggingface.co/papers/2611.14505', 'abstract': "Abstract Continual-ARC, a lifelong stream of ARC-AGI tasks, compares memory- and weight-based continual learning under frozen-weight agent harnesses, revealing that harness persistence rarely improves memorization and most harness methods underperform simple caching, while weight-based learning shows better generalization.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Agent harnesses have emerged as a promising mechanism for continual learning, alongside test-time parametric learning. However, the current benchmarks have several limitations: they generally focus on a single applied domain, serve each instance only once, and assume a single family of learner, so memory-based and weight-based systems are rarely compared on the same scale. We propose Continual-ARC, a lifelong stream built from the three ARC-AGI editions, whose tasks need no domain knowledge. The same tasks return after dormant gaps with fresh instances, while new tasks keep arriving. On each instance, the learner may pay for demonstrations, submit answers, or act inside the harness, with retries permitted on incorrect submissions, which are paid for. Each instance is scored based on the share of this feedback budget consumed. Since a learner may keep anything between instances, memory-based and weight-based systems are scored on the same scale. After the stream, the learner is frozen and tested on fresh instances of the tasks it met, which measures memorization, and on unseen tasks, which measures generalization. We run an agent harness with frozen weights, with and without persistence, on Qwen3.5-9B and GLM-5.3 Flash, comparing them with two prompting floors, a program-induction method and Qwen3.5-9B's weights trained to imitate GLM-5.3 Flash. Persistence in the harness generally does not improve memorization unless provided with explicit expert guidance. Most harness-based methods still learn less than a floor that simply caches each task's demonstrations, across all models we tested. No harness-based method gains on unseen tasks, whereas weight-based learning shows substantial gains. This opens the door to future weight-based continual learning that could teach models to drive harnesses in new domains.", 'score': 10, 'issue_id': 3540, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'd3401ceae30143b3', 'authors': ['Daniel Lenton', 'Yusha Arif', 'Haris Mahmood'], 'affiliations': ['Unify'], 'pdf_title_img': 'assets/pdf/title_img/2611.14505.jpg', 'data': {'categories': ['#transfer_learning', '#agents', '#optimization', '#reasoning', '#training', '#benchmark', '#agi'], 'emoji': '🧠', 'ru': {'title': 'Веса учатся обобщать, а память лишь кэширует', 'desc': 'Статья представляет Continual-ARC — бенчмарк для непрерывного обучения (continual learning) на потоке задач ARC-AGI, где одни и те же задачи возвращаются с новыми экземплярами, а новые задачи постоянно добавляются. Авторы сравнивают memory-based подходы с agent harness при замороженных весах и weight-based обучение (дообучение весов LLM, включая imitation learning с GLM-5.3 Flash), оценивая запоминание на знакомых задачах и обобщение на невидимых. Результаты показывают, что сохранение памяти в harness редко улучшает запоминание, а большинство методов уступают простому кэшированию демонстраций. Ни один harness-метод не даёт прироста на новых задачах, тогда как weight-based обучение демонстрирует заметное улучшение обобщения.'}, 'en': {'title': 'Caching Remembers; Training Weights Generalizes', 'desc': 'Continual-ARC tests how AI systems learn from a stream of tasks that return over time, comparing memory-based methods with weight-based training. Systems can spend a limited feedback budget to view demonstrations, submit answers, and retry mistakes; later tests measure memorization of familiar tasks and generalization to unseen ones. Adding persistence to an agent harness usually did not improve memorization, and most harness methods performed worse than simply caching task demonstrations. In contrast, training model weights to imitate another model improved generalization to unseen tasks.'}, 'zh': {'title': '缓存不及训练：权重式持续学习更能泛化', 'desc': '论文提出 Continual-ARC 基准，用不断返回的 ARC-AGI 任务流比较记忆式与权重式持续学习。学习者可付费获取示范、提交答案或使用智能体工具，成绩反映其消耗的反馈预算，并在训练后测试已见任务和未见任务。实验发现，冻结模型权重的智能体工具即使保留历史信息，通常也没有提升对已见任务的记忆；多数方法甚至不如直接缓存示范。相比之下，权重训练能显著提升对未见任务的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2611.17811', 'title': 'AI Reviews Are Biased Towards the Appendix', 'url': 'https://huggingface.co/papers/2611.17811', 'abstract': "Abstract Large language models used for peer review draw about half or more of their identified weaknesses from paper appendices, whereas human reviewers draw only 8.4% and focus on presentation and core ideas.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) are increasingly used by reviewers to highlight weaknesses during the reviewing process, and their outputs often shape the reviews that humans submit. Prior work studies how LLM reviews align with human ones, yet we know little about which parts of a paper these models actually criticize. In this work, we investigate 2,000 papers from ACL, EMNLP, COLM, and ICLR, and show that the latest GPT and Claude models draw about 50% or more of their review weaknesses from the appendix. This behavior holds across the API, coding-agent, and web access methods for using LLMs to review a paper. In contrast, we find that humans draw only 8.4% of their weaknesses from the appendix, and these weaknesses primarily revolve around a paper's presentation and content related to its core idea. Meanwhile, LLMs draw weaknesses from deep in the appendix that concern fine-grained technical details not central to the paper's contributions. We anticipate that our analysis will contribute to the scholarly discourse on AI reviews. Our code is publicly available at: https://github.com/cincynlp/review_appendix.", 'score': 10, 'issue_id': 3538, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '4f131414ef33f04b', 'authors': ['Saptarshi Ghosh', 'Mohammad Saim', 'Tianyu Jiang'], 'affiliations': ['University of Cincinnati'], 'pdf_title_img': 'assets/pdf/title_img/2611.17811.jpg', 'data': {'categories': ['#data', '#benchmark', '#science', '#alignment'], 'emoji': '📎', 'ru': {'title': 'LLM-рецензенты придираются к приложениям, а люди — к сути работы', 'desc': 'Авторы исследуют, какие части научной статьи критикуют большие языковые модели (LLM) при автоматическом рецензировании. Анализ 2000 статей с конференций ACL, EMNLP, COLM и ICLR показал, что современные модели GPT и Claude выводят около 50% и более своих замечаний из приложений (appendix), тогда как люди делают это лишь в 8,4% случаев. Люди в основном критикуют подачу материала и суть основной идеи, а LLM часто цепляются за мелкие технические детали, далекие от ключевого вклада работы. Результаты показывают систематическое расхождение между AI-рецензиями и человеческими, что важно учитывать при использовании AI в процессе peer review.'}, 'en': {'title': 'AI Reviews Look Deep into the Appendix', 'desc': 'This study analyzes reviews of 2,000 papers from ACL, EMNLP, COLM, and ICLR to see which parts of papers large language models criticize. GPT and Claude models draw at least half of their identified weaknesses from appendices, across API, coding-agent, and web-based review methods. Human reviewers, by contrast, draw only 8.4% of their weaknesses from appendices and focus more on presentation and a paper’s core ideas. LLMs often flag fine-grained technical details in appendices that are less central to the paper’s main contributions.'}, 'zh': {'title': 'AI评审盯住附录，人类评审聚焦核心', 'desc': '这项研究分析了 ACL、EMNLP、COLM 和 ICLR 的 2,000 篇论文，考察大语言模型在评审时会批评论文的哪些部分。研究发现，GPT 和 Claude 提出的弱点中，约一半或更多来自附录，而且这一现象在不同的模型使用方式下都存在。相比之下，人类评审者提出的弱点只有 8.4% 来自附录，他们更关注论文的表达和核心思想。大语言模型则常指出附录深处的细节问题，而这些问题通常并非论文贡献的重点。'}}}, {'id': 'https://huggingface.co/papers/2611.14504', 'title': 'Emergent Biological Capabilities in a Foundation Model for Molecular Interactions', 'url': 'https://huggingface.co/papers/2611.14504', 'abstract': 'Abstract  Foundation models trained on large unlabeled corpora develop emergent capabilities, tasks that go beyond the training objective. We extend this paradigm to multimodal biology with Bonbon, a foundation model for molecular interactions trained on approximately 3.2 trillion tokens of paired protein-ligand sequences. From a single representation space, Bonbon exhibits three zero-shot emergent capabilities at hierarchical levels of resolution: functional (mechanism of action), residue (binding site localization, including orthosteric/allosteric discrimination), and bond (covalent versus non-covalent engagement). All three capabilities generalize to out-of-distribution complexes. Bonbon was trained on protein-ligand sequences alone, without any task-specific supervision and without structural coordinates. We conducted controlled scaling experiments across six model scales from 42M to 1.6B parameters; every capability evaluated shows a sharp jump at the largest scale on continuous metrics, even as pretraining loss decreases smoothly. This demonstrates that loss-based scaling laws alone are insufficient to predict when zero-shot emergent capabilities become available. The capabilities reported here emerge after training at a 1:2,000 parameter-to-token ratio to accommodate the sparsity of paired biological interaction data. The same frozen representations achieve state-of-the-art binding and affinity prediction at five orders of magnitude greater speed than co-folding methods. In prospective wet-lab validation across nine disease targets spanning seven protein families, Bonbon achieves a 61.5% dose-response hit rate on de novo compounds, yielding structurally novel molecules not previously reported to inhibit these proteins, including for out-of-distribution targets.', 'score': 10, 'issue_id': 3538, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'b5617205ca916916', 'authors': ['Adi Mashiach'], 'affiliations': ['Output Labs'], 'pdf_title_img': 'assets/pdf/title_img/2611.14504.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#multimodal', '#training', '#healthcare', '#optimization', '#science'], 'emoji': '🧬', 'ru': {'title': 'Bonbon: эмерджентные способности языковой модели для молекулярных взаимодействий открывают путь к быстрому поиску лекарств', 'desc': 'Авторы представляют Bonbon, foundation model для молекулярных взаимодействий, обученную на примерно 3,2 триллиона токенов парных последовательностей белок-лиганд без структурных координат и разметки. Модель демонстрирует zero-shot emergent capabilities на трёх уровнях: функциональном (механизм действия), остаточном (локализация сайта связывания, включая orthosteric/allosteric) и связевом (ковалентное против нековалентного связывания). Эксперименты по масштабированию от 42M до 1,6B параметров показывают резкий скачок способностей на continuous metrics при largest scale, хотя loss падает плавно, что ставит под сомнение предсказуемость по scaling laws. Замороженные представления дают state-of-the-art предсказание связывания и аффинности в тысячи раз быстрее co-folding методов, а wet-lab валидация на девяти мишенях даёт 61,5% dose-response hit rate на новых соединениях.'}, 'en': {'title': 'From Protein–Ligand Sequences to Drug-Discovery Capabilities', 'desc': 'Bonbon is a foundation model trained on about 3.2 trillion tokens of paired protein–ligand sequences, without task-specific labels or structural coordinates. Its shared representations support three zero-shot capabilities: predicting a molecule’s mechanism of action, locating its binding site, and distinguishing covalent from non-covalent binding, including on unfamiliar complexes. These capabilities appear sharply at the largest tested model size, even though training loss decreases smoothly, showing that loss-based scaling laws do not fully predict when such abilities emerge. The frozen representations also enable fast binding and affinity prediction, and laboratory tests found dose-response activity for 61.5% of newly designed compounds across nine disease targets.'}, 'zh': {'title': '从海量序列中涌现分子交互能力', 'desc': 'Bonbon 是一种用于分子相互作用的基础模型，使用约 3.2 万亿个蛋白质—配体序列词元训练，不需要结构坐标或任务专属标注。它能从同一套表示中零样本判断作用机制、定位结合位点并区分正构与变构结合，还能辨别共价和非共价作用；这些能力也能泛化到分布外的复合物。实验发现，模型规模增至 16 亿参数时，各项能力在连续指标上突然跃升，即使预训练损失一直平滑下降，说明仅靠损失缩放规律无法预测零样本能力何时出现。冻结后的表示能以比协同折叠方法快数十万倍的速度预测结合与亲和力，并在九个疾病靶点的新药实验中取得 61.5% 的剂量反应命中率。'}}}, {'id': 'https://huggingface.co/papers/2611.16439', 'title': 'HALO: Human-Aligned Data Collection for WhoLe-body MObile Manipulation', 'url': 'https://huggingface.co/papers/2611.16439', 'abstract': "Abstract  Learning whole-body mobile manipulation requires demonstrations that coordinate bimanual actions with locomotion across extended workspaces. However, existing interfaces trade off direct robot control, perception and action alignment, and natural operator mobility, making such demonstrations difficult to collect. We introduce HALO, a human-aligned data collection system for whole-body mobile manipulation. The system aligns the operator's perception and action space with the robot while preserving direct physical feedback and natural locomotion. Operators guide the robot end-effectors through kinesthetic teaching and move a low-resistance platform without the deployed mobile base while performing bimanual manipulation. This interface enables more natural whole-body demonstrations, but the close human-robot coupling introduces discrepancies between the demonstration and deployment settings. We address these discrepancies with deployment-aligned demonstration processing, which calibrates and temporally aligns platform motion with the deployed base response and masks and inpaints demonstrator hands in recorded observations. Compared with Mobile ALOHA and VR teleoperation, HALO enables up to 2.9x faster demonstration collection while maintaining comparable or higher success rates. Policies trained with HALO perform precise manipulation tasks, including zip-tie fastening, and achieve a 73.3% success rate on a six-stage long-horizon mobile manipulation task involving repeated coordinated base and arm motion. Project page: https://robbyant-research.github.io/Lingbot-ALOHA/", 'score': 10, 'issue_id': 3538, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '811c4f37df990728', 'authors': ['Shuai Yang', 'Fangyi Xu', 'Yishu Shen', 'Kecheng Zheng', 'Yinghao Xu'], 'affiliations': ['Robbyant', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.16439.jpg', 'data': {'categories': ['#data', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Естественные демонстрации человека — основа умного мобильного робота', 'desc': 'Статья представляет HALO — систему сбора демонстраций для обучения whole-body mobile manipulation, то есть согласованных движений двуруких манипуляций и перемещения робота. Оператор напрямую направляет концевые эффекторы робота через kinesthetic teaching и двигает низкосопротивляемую платформу без работающей базы, что сохраняет физическую обратную связь и естественную мобильность человека. Чтобы устранить расхождения между условиями записи и развёртывания, авторы применяют обработку демонстраций: калибровку и временное выравнивание движения платформы с откликом базы, а также маскирование и inpainting рук оператора на записанных наблюдениях. По сравнению с Mobile ALOHA и VR-телеуправлением HALO ускоряет сбор данных до 2.9x при сопоставимом или более высоком уровне успеха, а обученные на нём policy выполняют точные задачи и достигают 73.3% успеха в длинной шестиэтапной задаче.'}, 'en': {'title': 'Faster, More Natural Demonstrations for Whole-Body Robot Skills', 'desc': 'HALO is a system for collecting demonstrations of whole-body mobile manipulation, where a robot coordinates its arms and movement. It lets operators guide the robot arms by hand and move a lightweight platform, aligning what they see and do with the robot while preserving physical feedback. To address differences between demonstrations and real deployment, HALO calibrates and aligns platform motion with the robot base, and removes demonstrators’ hands from recorded observations. HALO collects demonstrations up to 2.9 times faster than comparison methods, and policies trained on its data achieve precise manipulation and a 73.3% success rate on a challenging six-stage task.'}, 'zh': {'title': '让示范更自然，让移动操作更高效', 'desc': 'HALO 是一种用于全身移动操作的示范数据采集系统，让操作者的感知和动作更贴近机器人，同时保留直接的物理反馈和自然移动能力。操作者通过动觉示教引导机器人的双臂，并推动低阻力平台来配合机器人移动。为缩小采集示范与实际部署之间的差异，系统会校准并对齐平台与机器人底盘的运动，还会遮盖并补全示范者的手部图像。与 Mobile ALOHA 和 VR 遥操作相比，HALO 最多能将示范采集速度提升至 2.9 倍；训练出的策略在多阶段移动操作任务中达到 73.3% 的成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.17440', 'title': 'Interpreting Coding Agents Through Their Behavioral Trajectories', 'url': 'https://huggingface.co/papers/2611.17440', 'abstract': "Abstract  Standard coding-agent benchmarks primarily evaluate binary task success, treating execution as a black box and obscuring the behaviors that produce those outcomes. We analyze a large corpus of 143,209 execution trajectories from 125 agent configurations spanning 117 unique models. To enable comparisons across heterogeneous agent interfaces, we develop a rule-based parser that maps raw execution traces to high-level actions such as repository search, file editing, and test execution, and audit its predictions against a six-model consensus reference on 500 events. We find that agents with similar solve rates can nevertheless differ substantially in how they explore, modify and verify code. Moreover, without using task outcomes, token counts, or tool names as features, aggregate behavioral profiles retrieve the corresponding agent stack across disjoint repository sets and programming languages, although task composition is not fully controlled in the cross-repository setting. Through analyses of frontier models and agent scaffolds, we further show that scaffold choice and reasoning effort systematically shift agents' search, editing, and testing behavior. We release the deterministic parser together with the full annotation and analysis pipeline alongside an annotated trajectory subset.", 'score': 9, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'b7f18bcf5638db1c', 'authors': ['Ibragim Badertdinov', 'Alexander Golubev'], 'affiliations': ['Nebius'], 'pdf_title_img': 'assets/pdf/title_img/2611.17440.jpg', 'data': {'categories': ['#data', '#agents', '#benchmark', '#open_source', '#plp', '#interpretability'], 'emoji': '🔍', 'ru': {'title': 'Успешность агента не говорит, как он работает: смотрим на поведение, а не только на итог', 'desc': 'Статья показывает, что стандартные бенчмарки для coding-агентов оценивают лишь бинарный успех задачи и не учитывают поведение агента. Авторы анализируют 143 209 траекторий выполнения от 125 конфигураций агентов и разработали rule-based парсер, который переводит сырые трейсы в действия вроде поиска по репозиторию, редактирования файлов и запуска тестов. Оказалось, что агенты с похожей долей решённых задач заметно различаются в стиле исследования, модификации и проверки кода. Агрегированные поведенческие профили без использования исходов, токенов и имён инструментов позволяют восстановить стек агента, а выбор scaffold и уровень reasoning effort систематически меняют поведение агента.'}, 'en': {'title': 'Look Beyond Pass or Fail to Understand Coding Agents', 'desc': 'This paper studies 143,209 coding-agent execution traces from 125 agent configurations to understand how agents behave, beyond whether they solve a task. The authors build and audit a rule-based parser that converts raw traces into high-level actions such as searching repositories, editing files, and running tests. Agents with similar success rates show different behavior, and their behavioral profiles can often identify the agent setup across repositories and programming languages. The study also finds that the agent scaffold and reasoning effort influence how agents search, edit, and test code, and releases tools and annotated data for further research.'}, 'zh': {'title': '不只看任务成败：从执行轨迹读懂编码智能体', 'desc': '这篇论文指出，现有编码智能体基准主要用任务是否成功来评分，却看不到智能体完成任务时具体采取了哪些行动。研究者分析了来自125种智能体配置、117个模型的143,209条执行轨迹，并开发规则解析器，将原始记录归类为搜索代码、编辑文件和运行测试等高层行为。结果显示，即使解决率相近，不同智能体的行为模式也可能差异很大；仅根据汇总行为特征，还能在不同代码仓库和编程语言中识别智能体配置，但跨仓库任务构成的影响尚未完全排除。进一步分析发现，智能体框架和推理投入会系统性地改变搜索、编辑与测试行为，研究者也公开了解析器、分析流程和部分标注数据。'}}}, {'id': 'https://huggingface.co/papers/2611.18429', 'title': 'Do Underwater Image Quality Metrics Agree with Human Perception? A Benchmark with Human Choices, Simple Edits and Generative Drift', 'url': 'https://huggingface.co/papers/2611.18429', 'abstract': "Abstract  Underwater image enhancement is challenging to evaluate due to the lack of clean reference images, so researchers rely on no-reference image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learned underwater, vision-language and general-purpose metrics against human preferences on five references: four published opinion-score sets and a new paired-comparison study. For each metric, we measure how often it selects the same image as people when comparing versions of the same scene. We further test whether simple image edits and small adversarial perturbations raise metric scores above the enhancement people preferred, and whether scores decrease as repeated generative edits add noise. Our results show that no metric consistently matches human preferences. The best worst-case Cohen's kappa over the five references is only 0.23 (Q-Align), while two raters in our study agree with a median kappa of 0.41. The widely used UCIQE often favors edits that people reject. On a Nano Banana Pro replica chain that should leave the image unchanged, only 22 of 73 scores decrease at every checkpoint, while noise grows by 2.5 times. We also introduce TrustUIQA, a benchmark that combines the human references, our study choices, the edited, attacked and generated images, and the scores of every metric on every image. The code is available at https://github.com/TrustUIQA/TrustUIQA and TrustUIQA at https://huggingface.co/datasets/TrustUIQA/TrustUIQA.", 'score': 9, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'f1217440d705c07e', 'authors': ['Rishii Kumar Singh', 'Abhinav Rajput', 'Dinesh Kumar Vishwakarma'], 'affiliations': ['Delhi Technological University, India'], 'pdf_title_img': 'assets/pdf/title_img/2611.18429.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#security', '#dataset', '#open_source', '#cv'], 'emoji': '🌊', 'ru': {'title': 'Метрики качества подводных изображений расходятся с мнением людей', 'desc': 'Авторы оценивают 73 метрики no-reference оценки качества изображений (NR-IQA) для улучшения подводных снимков и сравнивают их с человеческими предпочтениями на пяти наборах данных. Ни одна метрика не показывает стабильного согласия с людьми: лучший результат по каспа Коэна составляет лишь 0.23, тогда как согласие между двумя оценщиками достигает 0.41. Метрика UCIQE часто отдаёт предпочтение правкам, которые люди отвергают, а многие метрики не снижаются при повторных генеративных редактированиях, вносящих шум. Для систематической проверки авторы представляют бенчмарк TrustUIQA, объединяющий человеческие оценки, атакованные и сгенерированные изображения и результаты всех метрик.'}, 'en': {'title': 'Underwater Image Metrics Must Earn Human Trust', 'desc': 'This paper tests 73 no-reference image quality assessment (NR-IQA) metrics for underwater images against human judgments from five preference datasets. No metric consistently matches people: the strongest worst-case agreement is low, and UCIQE often prefers edits that people reject. Simple edits and adversarial perturbations can increase some metric scores, while repeated generative edits add noise without reliably lowering scores. The authors introduce TrustUIQA, a benchmark that brings together human judgments, edited and generated images, attacks, and metric scores to support more trustworthy evaluation.'}, 'zh': {'title': '水下图像质量评价，不能只看指标分数', 'desc': '水下图像增强缺少干净的参考图像，因此通常用无参考图像质量评价（NR-IQA）指标来评估，但这些指标是否符合人的判断并不清楚。研究比较了73种指标与五组人类偏好数据，发现没有一种指标能稳定地选出人们更喜欢的图像，最佳指标在最差数据集上的 Cohen’s kappa 也只有0.23。常用的 UCIQE 可能偏爱人们不喜欢的编辑结果；此外，生成式编辑增加噪声时，许多指标也未能持续降低评分，说明它们容易受到图像编辑和对抗扰动的影响。研究还发布了 TrustUIQA 基准，汇集人类评价、编辑与扰动图像及各项指标分数，便于更全面地检验水下图像质量评价的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2611.18130', 'title': 'JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams', 'url': 'https://huggingface.co/papers/2611.18130', 'abstract': 'Abstract  Large language models (LLMs) are increasingly applied to finance, creating a need for benchmarks that evaluate their capabilities across financial systems with different regulations and practices. However, existing financial benchmarks provide limited coverage of country-specific financial systems, and they are difficult to keep up to date as released questions leak into training data. We introduce JFinBench, a Japanese financial benchmark comprising 321 examples from the 2026 editions of six regularly administered certification exams covering accounting, tax, financial planning, and banking. To construct it, we develop a human-in-the-loop agentic pipeline in which a coding agent writes exam-specific conversion code and a review page, while a human verifies every example and feeds corrections back to the agent. This pipeline adapts to heterogeneous exam formats and reduces the effort of incorporating new exam editions, enabling periodic refreshes that mitigate data contamination. Evaluating 12 recent LLMs, we find that Claude Fable 5 and GPT-6 Astra exceed 93% overall, while even the best open-weight model, Kimi K3.1 Pro, trails Claude Fable 5 by 12 percentage points. When models can additionally use a terminal and web access, they retrieve the knowledge they lack and every model improves. The gap narrows but about 4 points remain, and the ranking of models stays largely the same, suggesting that knowledge held in the model itself remains valuable even with tools. We release the dataset, the evaluation code, and the construction pipeline.', 'score': 9, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'edb88839f07205ca', 'authors': ['Issa Sugiura', 'Taro Makino', 'Takashi Ishida'], 'affiliations': ['Institute of Science Tokyo', 'Sakana AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.18130.jpg', 'data': {'categories': ['#benchmark', '#data', '#multilingual', '#agents', '#science', '#synthetic', '#leakage', '#open_source', '#dataset'], 'emoji': '📊', 'ru': {'title': 'Японские финансы проверяют LLM: знания в модели важнее инструментов', 'desc': 'Авторы представляют JFinBench — японский бенчмарк для оценки больших языковых моделей (LLM) в финансовой сфере, состоящий из 321 примера из шести экзаменов на сертификацию по бухгалтерии, налогам, финансовому планированию и банкингу. Данные собираются с помощью human-in-the-loop агентного пайплайна, где coding agent пишет код конвертации, а человек проверяет каждый пример и дает обратную связь. Такой подход позволяет регулярно обновлять бенчмарк и снижает риск data contamination. Оценка 12 LLM показала, что лучшие модели превышают 93% точности, а использование инструментов (terminal и web access) улучшает результаты, однако знания, заложенные в самой модели, остаются ценными.'}, 'en': {'title': 'A Fresh Benchmark for Japanese Financial AI', 'desc': 'The paper introduces JFinBench, a benchmark for testing large language models (LLMs) on Japanese finance topics, including accounting, tax, financial planning, and banking. It contains 321 questions drawn from six certification exams, and a human-in-the-loop pipeline helps adapt the benchmark to different exam formats and update it with new editions. Tests of 12 LLMs show that the strongest models achieve over 93% accuracy, while the best open-weight model scores lower. Web and terminal tools improve every model’s results, but the remaining performance gap suggests that knowledge learned during training still matters.'}, 'zh': {'title': '为日本金融打造可持续更新的模型能力考场', 'desc': '本文提出 JFinBench，这是一个面向日本金融制度的基准测试，包含来自六类资格考试的 321 道题，涵盖会计、税务、理财和银行业务。研究者设计了人机协作的智能体流程：编码智能体转换不同格式的考试材料并生成审核页面，人工逐题核验并反馈修正，从而降低更新新考试版本的成本并减少训练数据污染。对 12 个近期大语言模型的评测显示，Claude Fable 5 和 GPT-6 Astra 的总体准确率超过 93%，而最佳开放权重模型仍落后 12 个百分点；接入终端和网页工具后，各模型表现均有提升，但模型间仍相差约 4 个百分点。结果表明，外部工具可以补充模型缺失的知识，但模型自身掌握的知识仍然重要；作者也公开了数据集、评测代码和构建流程。'}}}, {'id': 'https://huggingface.co/papers/2611.02822', 'title': 'Disen-Forcing: Disentangling Semantic Anchoring from Motion for Autoregressive Video Diffusion', 'url': 'https://huggingface.co/papers/2611.02822', 'abstract': 'Abstract Disen-Forcing is a distillation-time method for autoregressive video diffusion models that disentangles attention-head specialization to improve long-range consistency and motion dynamics in long-horizon video generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Autoregressive video diffusion models (AR-VDMs) enable real-time, long-horizon video generation but degrade rapidly once the inference horizon outruns the training horizon, due to compounding exposure bias. To stabilize long rollouts, recent methods heuristically adopt frame sink, keeping initial frames as a persistent model context, inspired by attention sinks in LLMs. We revisit this design and find that the mechanism by which initial frames stabilize long-range consistency in AR-VDMs is not an LLM-style attention sink; instead, long-range consistency is anchored through a sparse subset of attention heads, while the majority of heads predominantly capture local temporal dynamics. This observation reveals an over-conditioning pathology in existing frame-sink strategies: by universally exposing every head to the pinned initial-frame context, the model becomes prone to collapsing motion toward the low-dynamic modes of the teacher during model distillation. We propose Disen-Forcing, a distillation-time plug-in for AR-VDMs that disentangles and reinforces this head specialization through disentangled context routing and motion-disentangling regularization. On long-horizon video generation benchmarks, Disen-Forcing simultaneously improves long-range consistency and motion dynamics of base AR-VDMs, a trade-off that sink-based methods fail to balance.', 'score': 9, 'issue_id': 3539, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'ae1e480152966eda', 'authors': ['Zhengyang Yu', 'Akio Hayakawa', 'Masato Ishii', 'Qingtao Yu', 'Xuesong Li', 'Takashi Shibuya', 'Yuki Mitsufuji', 'Jing Zhang'], 'affiliations': ['Australian National University', 'CSIRO', 'Sony AI', 'Sony Group Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2611.02822.jpg', 'data': {'categories': ['#training', '#long_context', '#video', '#diffusion', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Разделяй и властвуй: каждая голова внимания должна знать свою роль в видео', 'desc': 'Авторы исследуют авторегрессионные диффузионные модели для видео (AR-VDM), которые быстро деградируют при генерации видео длиннее обучающего горизонта из-за накопления exposure bias. Они показывают, что стабильность долгих роллаутов обеспечивают не LLM-подобные attention sinks, а небольшое подмножество attention heads, тогда как большинство голов отвечает за локальную временную динамику. Предложенный метод Disen-Forcing — плагин для дистилляции, который через disentangled context routing и motion-disentangling regularization разделяет специализацию голов. В результате улучшаются как долгосрочная согласованность, так и динамика движения, чего не удаётся достичь существующим frame-sink методам.'}, 'en': {'title': 'Preserve the story without freezing the motion', 'desc': 'Autoregressive video diffusion models can lose consistency when generating videos much longer than those seen during training. The paper finds that only a small group of attention heads needs access to initial frames to preserve long-range consistency, while most heads focus on nearby motion. Giving every head access to those frames can over-condition the model and reduce motion during distillation. Disen-Forcing routes context separately to different heads and uses a motion-disentangling regularizer, improving both consistency and motion in long videos.'}, 'zh': {'title': '让注意力头各司其职，长视频连贯又灵动', 'desc': '自回归视频扩散模型可以实时生成长视频，但生成时间超过训练范围后，误差会不断累积，导致画面难以保持连贯。论文发现，只有少数注意力头主要负责长程一致性，多数注意力头则侧重捕捉局部运动；让所有注意力头都关注固定的初始帧，可能使生成的动作变得呆板。为此，作者提出 Disen-Forcing，在蒸馏过程中通过分离上下文路由和运动解耦正则化，强化不同注意力头的专长。实验表明，该方法能同时改善长视频的一致性和运动表现，缓解传统帧锚定方法难以兼顾这两者的问题。'}}}, {'id': 'https://huggingface.co/papers/2611.14487', 'title': 'Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game', 'url': 'https://huggingface.co/papers/2611.14487', 'abstract': "Abstract A Twenty Questions-style benchmark for research ideation shows that large language models make most progress early, can recognize good ideas or questions but often cannot generate them, and may benefit from externally sourced candidates in automated research systems.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Research ideation is iterative: researchers refine their ideas step by step based on feedback. Yet existing evaluations obscure this search process, making it difficult to understand how LLMs explore the space of research ideas and what limits their progress. We introduce Re-Search, which adapts the format of Twenty Questions to research ideation: given only the research problem of a published paper, a model must rediscover the paper's core idea by asking yes-or-no questions. Built from 200 ICML 2026 papers, Re-Search tracks how a model's idea evolves as it asks questions and receives binary oracle feedback, isolating ideation from execution. Across six recent LLMs, nearly all progress happens within the first 30 of 100 questions, which largely decide how the game ends; after that, most models plateau. Through controlled interventions on the candidate questions and the hypothesis space, we find that the bottleneck is generation, not judgment: models recognize a good idea or a good question when one is offered, but often cannot produce it on their own. We further analyze the ideation traces and find that models fail by either over-exploiting one direction or over-exploring too many. These findings point to concrete design principles for autoresearch systems: since models can judge candidates they cannot produce, enriching the search with externally sourced ideas and questions may be more effective than improving any single model's generation ability.", 'score': 6, 'issue_id': 3540, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'f95ef41ddb40802a', 'authors': ['Muhan Gao', 'Hangxiao Zhu', 'Xinqi Su', 'Yu Zhang', 'Daniel Khashabi', 'Kuan-Hao Huang'], 'affiliations': ['Johns Hopkins University', 'Texas A&M University'], 'pdf_title_img': 'assets/pdf/title_img/2611.14487.jpg', 'data': {'categories': ['#reasoning', '#science', '#interpretability', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Модели узнают хорошую идею, но сами её редко придумывают', 'desc': 'Авторы представляют Re-Search — бенчмарк в формате игры «Двадцать вопросов», где LLM должна переоткрыть ключевую идею статьи, задавая вопросы с бинарной обратной связью. Эксперименты с шестью современными моделями показывают, что основной прогресс происходит в первых 30 вопросах, после чего качество выходит на плато. Контролируемые эксперименты выявили, что главное узкое место — генерация идей, а не их оценка: модели хорошо распознают удачные идеи, но редко создают их самостоятельно. Из этого следует вывод, что для автоматизированных исследовательских систем полезнее обогащать поиск внешними идеями и вопросами, чем улучшать генеративные способности отдельной модели.'}, 'en': {'title': 'Help Models Find Ideas They Can Recognize', 'desc': 'Re-Search evaluates how large language models (LLMs) develop research ideas by asking yes-or-no questions to rediscover the core idea of a published paper. Across six models, most progress occurs in the first 30 of 100 questions, after which performance usually plateaus. Experiments suggest the main bottleneck is idea generation rather than evaluation: models can recognize strong ideas and questions when presented with them, but often fail to create them. Models also tend to focus too narrowly or explore too many directions, so automated research systems may improve by adding ideas and questions from external sources.'}, 'zh': {'title': '让外部好点子助力 AI 研究探索', 'desc': '本文提出 Re-Search 基准，用“二十问”的形式评估大语言模型能否通过提问重新发现已发表论文的核心研究想法。实验显示，模型的大部分进展发生在前 30 个问题，之后通常陷入停滞。研究发现，主要瓶颈是生成而非判断：模型往往能识别给出的好想法或好问题，却难以自行提出它们；此外，模型还可能过度探索单一方向，或探索得过于分散。研究因此建议，自动化研究系统可引入外部来源的候选想法和问题，以拓展搜索过程。'}}}, {'id': 'https://huggingface.co/papers/2611.17194', 'title': 'eDMD: Endpoint Distribution Matching for Few-Step Diffusion Distillation', 'url': 'https://huggingface.co/papers/2611.17194', 'abstract': "Abstract Endpoint Distribution Matching Distillation trains a shared fake model only on final student outputs and adds precise teacher supervision to better align few-step diffusion students with teacher distributions for 4-step generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Distribution matching distillation (DMD) has emerged as a leading paradigm for distilling diffusion models into few-step students, where an auxiliary fake score model tracks the student's distribution and the discrepancy between the teacher and fake predictions drives the student toward the teacher. In multi-step distillation, although only the student's final output is delivered, existing methods train the fake model on intermediate states or across all denoising steps. Consequently, the student's update signal becomes entangled with intermediate distributions, which can distort the matching direction and remain nonzero even after the student's final outputs already match the teacher distribution. To resolve this mismatch, we propose Endpoint Distribution Matching Distillation (eDMD), which trains a single shared fake model exclusively on the student's final outputs and uses it to correct every denoising step. Our theoretical analysis proves that this endpoint reference guarantees that the distribution matching term vanishes if and only if the student's final output distribution matches the teacher's, regardless of intermediate distributions. Beyond the fake reference, we further strengthen teacher supervision through a precise teacher (PT) that replaces single-step guided predictions with short multi-step trajectories on the final noise interval, paired with a calibrated query density for intermediate steps. Experiments on SD3-Medium, FLUX.2-klein (4B and 9B), and Qwen-Image-2.1 demonstrate that eDMD consistently outperforms existing distribution matching methods for 4-step generation.", 'score': 5, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '1020fc5293101851', 'authors': ['Tong Zhao', 'Xianfang Zeng', 'Yucheng Han', 'Ruoyu Wang', 'Mingkun Lei', 'Gang Yu', 'Chi Zhang'], 'affiliations': ['AGI Lab, Westlake University', 'StepFun', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17194.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#architecture', '#training'], 'emoji': '🎯', 'ru': {'title': 'Выравнивай только финал — и 4 шага хватит для качественной генерации', 'desc': 'Статья предлагает метод Endpoint Distribution Matching Distillation (eDMD) для дистилляции diffusion-моделей в студенческую модель, генерирующую изображения за 4 шага. Вспомогательная fake score model обучается только на финальных выходах студента, а не на промежуточных состояниях, что устраняет искажение направления обновления в DMD. Авторы доказывают, что член distribution matching обнуляется тогда и только тогда, когда распределение финальных выходов совпадает с распределением учителя. Дополнительно используется precise teacher (PT), который заменяет одношаговые предсказания короткими многошаговыми траекториями на последнем интервале шума, что усиливает supervision и даёт превосходство над существующими методами на SD3-Medium, FLUX.2-klein и Qwen-Image-2.1.'}, 'en': {'title': 'Match the Endpoints, Improve Every Step', 'desc': "Endpoint Distribution Matching Distillation (eDMD) trains a diffusion student using only its final outputs as the reference for distribution matching. A shared fake score model learns this endpoint distribution and guides every denoising step, avoiding misleading signals from intermediate states. The matching loss becomes zero exactly when the student's final output distribution matches the teacher's, regardless of the student's intermediate distributions. eDMD also improves teacher supervision with short multi-step teacher trajectories and calibrated sampling, leading to better 4-step generation in experiments."}, 'zh': {'title': '只对齐最终输出，让4步扩散生成更接近教师', 'desc': '本文提出端点分布匹配蒸馏（eDMD），用于将扩散模型蒸馏成仅需4步生成的学生模型。与在中间状态训练假分数模型的方法不同，eDMD只用学生的最终输出训练一个共享假模型，并用它校正每个去噪步骤。理论分析表明，只有当学生最终输出分布与教师分布匹配时，分布匹配项才会归零，与中间状态的分布无关。研究还通过精确教师监督改进训练，并在多个模型上验证了其4步生成效果优于现有分布匹配方法。'}}}, {'id': 'https://huggingface.co/papers/2611.17169', 'title': 'Parsed, Plausible, Wrong: Output Format Controls Silent Errors in Small-Model Semantic Parsing', 'url': 'https://huggingface.co/papers/2611.17169', 'abstract': 'Abstract  A small fine-tuned parser that emits a well-formed but wrong tree fails silently: nothing downstream can tell. We ask whether the output format, a free design choice, controls how often this happens. On the PIZZA ordering benchmark we fine-tune two sub-billion models (Qwen3.5-0.8B and LFM2.5-350M) with LoRA on six lossless encodings of the same target tree, from 44.3 down to 10.9 tokens per order, including two matched-length pairs that vary surface form at fixed length. Across 300 runs (5 training pool sizes, 5 seeds) with a hierarchical bootstrap and Holm correction fixed before the results were read, shortening alone never helps, but writing the target in ordinary words does. The word encoding is the most accurate format on both models (87.5% vs. 85.8% exact match for the native s-expression on Qwen) while emitting 4.1x fewer tokens, and it cuts the silent error rate by 2.3x on Qwen and 1.8x on LFM2, separating at every pool size. Error analysis locates much of the gain in negation. All runs also learn to refuse off-menu input (held out: 95.9-99.0% handled) and to apply in-utterance self-corrections. Strict refusal has a measured price: 2.1-10.1% of real, mostly polite, orders are refused.', 'score': 3, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '469d306c2ee26804', 'authors': ['Umar Ahmed', 'Maxim Dunaev', 'Mohammad Nour Al Awad', 'Sergey Ivanov', 'Ivan Khodnenko'], 'affiliations': ['ITMO University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17169.jpg', 'data': {'categories': ['#data', '#optimization', '#training', '#benchmark', '#small_models', '#alignment', '#synthetic'], 'emoji': '🍕', 'ru': {'title': 'Формат выхода важнее краткости: пиши деревья словами, а не скобками', 'desc': 'Статья исследует, как формат выходного дерева влияет на качество дообученного LLM-парсера заказов пиццы. Авторы дообучают две компактные модели (Qwen3.5-0.8B и LFM2.5-350M) через LoRA на шести эквивалентных кодировках одного и того же дерева, различающихся по длине и форме. Эксперименты (300 запусков, иерархический bootstrap, поправка Holm) показывают, что простое сокращение числа токенов не помогает, а запись целевого дерева обычными словами даёт лучшую точность и в 1.8–2.3 раза меньше тихих ошибок. Дополнительно отмечено, что модели учатся отказывать в обработке заказов вне меню, но строгий отказ приводит к отклонению 2.1–10.1% реальных заказов.'}, 'en': {'title': 'Choose words over shorter tokens to make parsing safer', 'desc': 'This study tests whether the format used to represent target trees affects how often fine-tuned language models make silent parsing errors. On the PIZZA ordering benchmark, two small models were trained with LoRA on six lossless formats; shorter formats alone did not improve accuracy, but a format written in ordinary words performed best. Compared with native s-expressions, the word format reduced silent errors by 2.3 times on Qwen and 1.8 times on LFM2, with much of the gain involving negation. The models also handled most off-menu requests and self-corrections, though strict refusal incorrectly rejected some valid, mostly polite orders.'}, 'zh': {'title': '输出格式不只是形式：用普通词语让解析器更准、更少静默出错', 'desc': '这篇论文研究输出格式是否会影响小型微调解析器出错的方式，并在 PIZZA 点餐基准上比较了六种表示同一目标树的无损编码。研究使用 LoRA 微调两种小于十亿参数的模型，并通过 300 次实验及统计校正进行评估。结果显示，单纯缩短编码并不会提升准确率，但用普通词语表达目标能提高准确率、减少静默错误，且在否定表达的处理上收益明显。模型也能拒绝不在菜单上的输入并处理用户自我更正，不过严格拒绝会误拒少量真实订单。'}}}, {'id': 'https://huggingface.co/papers/2611.17321', 'title': 'BrickFlow: Connectivity-Guided Brick Reconstruction', 'url': 'https://huggingface.co/papers/2611.17321', 'abstract': 'Abstract A set-conditioned SE(3) flow model pretrained on procedurally generated LEGO assemblies and finetuned with image conditioning, combined with analytic connectivity-field guidance, infers part poses to assemble objects from images.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Given a set of LEGO parts and an image of an assembled object, our task is to infer the pose of each part to assemble the object. In contrast with traditional 3D reconstruction, doing so requires satisfying discrete physical constraints, which provide structure but render the problem combinatorial and highly sensitive to small pose errors. To learn a prior over how parts fit together, we train a set-conditioned SE(3) flow model on procedurally generated assemblies. We then finetune this model to inject image conditioning, using 1% as much data. However, while the learned flow captures global structure, it does not enforce connectivity. To address this, we introduce an analytic connectivity-field guidance to pull predictions toward connected assemblies at test time. Through this, we demonstrate improved build quality with model size, pretraining, and guidance. We make our models and data available for research purposes at https://kulits.github.io/BrickFlow/', 'score': 2, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'b11b310731dcc33a', 'authors': ['Peter Kulits', 'Cordelia Schmid'], 'affiliations': ['CNRS', 'Inria', 'Max Planck Institute for Intelligent Systems', 'PSL Research University', 'École Normale Supérieure'], 'pdf_title_img': 'assets/pdf/title_img/2611.17321.jpg', 'data': {'categories': ['#data', '#optimization', '#training', '#synthetic', '#3d', '#cv'], 'emoji': '🧱', 'ru': {'title': 'Собираем LEGO по картинке: генеративные потоки и физика связности', 'desc': 'Авторы решают задачу сборки объекта из LEGO-деталей по изображению: нужно определить позу каждой детали в SE(3), что требует соблюдения дискретных физических ограничений и комбинаторно сложно. Модель потоков (flow model) с set-conditioning обучается на процедурно сгенерированных сборках, а затем дообучается с image conditioning на примерно 1% данных. Чтобы предсказания образовывали связные конструкции, вводится аналитический connectivity-field guidance, который при инференсе притягивает результат к связным сборкам. Эксперименты показывают улучшение качества сборки с ростом размера модели, предобучением и использованием guidance.'}, 'en': {'title': 'From Image to Connected LEGO Assembly', 'desc': 'The paper tackles assembling a LEGO object by predicting the 3D pose of each supplied part from an image. It trains a set-conditioned SE(3) flow model on procedurally generated assemblies to learn how LEGO parts fit together, then fine-tunes it to use image information with much less training data. Because the model alone may predict parts that are not connected, the method adds analytic connectivity-field guidance at test time. The authors report that larger models, pretraining, and this guidance improve the quality of the resulting assemblies.'}, 'zh': {'title': '让模型看图拼乐高：用连接引导拼出可靠结构', 'desc': '这篇论文研究如何根据一张成品图片和一组乐高零件，推断每个零件的位置与朝向，从而拼出目标物体。作者训练了一个以零件集合为条件的 SE(3) 流模型，先用程序生成的拼装数据学习零件之间的组合规律，再用少量图像数据进行图像条件微调。由于模型学到的结构先验并不保证零件实际相连，作者在推理时加入解析式连接场引导，推动预测结果形成连通的拼装结构。实验表明，增大模型、进行预训练并加入连接引导，都能提升拼装质量。'}}}, {'id': 'https://huggingface.co/papers/2611.18550', 'title': 'Restoring Diversity in Distilled Image and Video Generators by Probing Activations', 'url': 'https://huggingface.co/papers/2611.18550', 'abstract': "Abstract Distilled few-step diffusion models exhibit diversity collapse because activation variance is concentrated into fewer directions in an intermediate block at the initial denoising step, and ReDiverse restores sample diversity by reintroducing teacher variance directions through adapter fine-tuning or training-free activation steering while preserving generation quality.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Distilling diffusion models into few-step student models substantially reduces sampling latency, but induces severe diversity collapse: samples generated from different random seeds show minimal variation. In this work, we investigate the root cause of this failure by probing the internal representations of student models relative to their teachers. We find that distilled students maintain total activation variance comparable to their teachers, but concentrate it into substantially fewer directions. This directional collapse is localized to an identifiable intermediate block at the initial denoising step. Consequently, diversity collapse stems from a misallocation of activation variance rather than an inherent loss of generative capacity. Guided by this finding, we propose ReDiverse to reinstate the missing variance directions. At training time, ReDiverse-FT fine-tunes a lightweight adapter that regresses student activations onto the teacher's, reviving the teacher's feature variance characteristic. At inference time, ReDiverse-TF introduces a training-free mechanism that steers activations along precomputed teacher principal directions. Across image and video distillation benchmarks, ReDiverse consistently restores sample diversity while preserving generation quality, further supported by the user study.", 'score': 2, 'issue_id': 3540, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '15ecb7c7461c5408', 'authors': ['Furkan Horoz', 'Ozgur Kara', 'Kaan Oktay', 'Adil Kaan Akan', 'Atakan Kara', 'Anand Bhattad', 'James Matthew Rehg'], 'affiliations': ['Johns Hopkins University', 'University of Illinois at Urbana-Champaign', 'fal'], 'pdf_title_img': 'assets/pdf/title_img/2611.18550.jpg', 'data': {'categories': ['#video', '#optimization', '#architecture', '#inference', '#training', '#diffusion', '#interpretability', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Вернуть разнообразие быстрым диффузионным моделям, не жертвуя качеством', 'desc': 'Дистиллированные диффузионные модели с малым числом шагов генерации работают быстро, но страдают от коллапса разнообразия: изображения, сгенерированные из разных случайных сидов, почти одинаковы. Авторы показывают, что студенческие модели сохраняют общую дисперсию активаций, как у учителя, но концентрируют её в существенно меньшем числе направлений в промежуточном блоке на первом шаге денойзинга. Метод ReDiverse возвращает утраченные направления дисперсии: ReDiverse-FT дообучает легковесный адаптер, а ReDiverse-TF без обучения сдвигает активации вдоль главных направлений учителя. Эксперименты на бенчмарках для изображений и видео показывают, что разнообразие восстанавливается при сохранении качества генерации.'}, 'en': {'title': 'Restore the Directions, Restore the Diversity', 'desc': 'Few-step diffusion models generate images or videos faster, but their outputs often become too similar across different random seeds. The paper finds that this happens because the model concentrates its activation variance into fewer directions in one intermediate block during the first denoising step, rather than losing overall variance. ReDiverse restores the missing directions using either a lightweight adapter trained to match teacher activations or a training-free method that steers activations along teacher directions. Experiments show that both methods improve sample diversity while preserving generation quality.'}, 'zh': {'title': '找回激活方差方向，让少步扩散生成既快又多样', 'desc': '将扩散模型蒸馏成少步数模型可以降低生成延迟，但常会导致不同随机种子生成的样本变得相似。研究发现，学生模型的激活总方差与教师模型相近，却集中在更少的方向上，而这种方向坍缩出现在初始去噪步骤的一个中间层。基于此，ReDiverse通过微调轻量适配器，或在推理时沿教师模型的主成分方向调整激活，来恢复缺失的方差方向。图像和视频实验表明，该方法能提升生成多样性，同时保持生成质量。'}}}, {'id': 'https://huggingface.co/papers/2611.17780', 'title': 'LuthorSQL: A One-Pass Text-to-SQL Model as System 1 for a Slower LLM Agent', 'url': 'https://huggingface.co/papers/2611.17780', 'abstract': "Abstract  Frontier LLM agents that query databases with tools are among the most accurate text-to-SQL systems, but per-query calls to a hosted model are slow, costly, and expose sensitive organizational queries to external APIs. For example, a Claude Opus 5.5 agent serving 10,000 queries a day costs over $70,000 a year at list price. To what extent can local hardware already owned by an organization offload this burden without compromising the agent's accuracy? We present LuthorSQL, a non-autoregressive 7B text-to-SQL model that serves as a rapid System 1 gate for a slower LLM agent (System 2), escalating queries only when uncertain. LuthorSQL makes a single forward pass to predict slot scores over a bounded grammar for query plans, compiles and runs up to 32 candidate plans, and chooses an answer using a trained validator. On its own, LuthorSQL reaches 68.03% execution accuracy on BIRD's hidden test set at 0.84 s per question on a single GPU, maintains its accuracy in 9 GB with 8-bit quantized weights, and transfers zero-shot to Snowflake, BigQuery, MySQL, PostgreSQL, and DuckDB within 3.1 points of its native SQLite accuracy. Combined with Claude Opus 5.5 in a pre-registered confidence cascade over 227 questions on databases published after Opus's training cutoff, LuthorSQL answers nearly half of all questions locally and cuts API cost by 33.3% at the same accuracy. Finally, contamination probing shows that Opus reproduces 48-92% of public benchmark gold queries verbatim without seeing the schema; however, its tool-assisted accuracy holds on renamed schemas and reaches 95.6-97.4% on post-cutoff databases. Code and data: https://github.com/IAMIbrahimmemon/luthorsql", 'score': 2, 'issue_id': 3540, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '017fcb7f3a452cdc', 'authors': ['Ibrahim Memon', 'Armin Karamzade', 'M. Hanif Jhaveri', 'Roy Fox'], 'affiliations': ['Independent Researcher', 'UC Irvine'], 'pdf_title_img': 'assets/pdf/title_img/2611.17780.jpg', 'data': {'categories': ['#agents', '#math', '#inference', '#architecture', '#benchmark', '#small_models', '#open_source', '#plp', '#leakage'], 'emoji': '🗄️', 'ru': {'title': 'Локальная модель берёт на себя запросы, а дорогой LLM-агент подключается только тогда, когда он неуверен', 'desc': 'Авторы представляют LuthorSQL — компактную non-autoregressive модель на 7B параметров для text-to-SQL, которая выступает как быстрый шлюз «System 1» перед медленным LLM-агентом «System 2». Модель за один проход предсказывает оценки слотов по ограниченной грамматике запросов, компилирует до 32 кандидатов и выбирает ответ с помощью обученного validator. На датасете BIRD она достигает 68.03% execution accuracy при 0.84 с на вопрос и работает в 9 ГБ памяти с 8-битной квантизацией, а также переносится на Snowflake, BigQuery, MySQL, PostgreSQL и DuckDB. В confidence cascade с Claude Opus 5.5 модель отвечает примерно на половину вопросов локально и снижает стоимость API на 33.3% при той же точности.'}, 'en': {'title': 'Answer Locally; Escalate Only When Needed', 'desc': 'LuthorSQL is a 7-billion-parameter text-to-SQL model designed to handle easy database questions locally and pass uncertain ones to a larger language model. In one forward pass, it scores possible query plans, tests up to 32 candidates, and uses a trained validator to select an answer. It reaches 68.03% execution accuracy on BIRD while running in 0.84 seconds per question on one GPU, and it transfers to several database systems with little loss in accuracy. In a confidence-based cascade, it answers nearly half of questions locally and reduces API costs by 33.3% without lowering accuracy.'}, 'zh': {'title': '让本地 7B 模型先答，把昂贵的大模型留给难题', 'desc': '这篇论文提出 LuthorSQL，一个非自回归的 7B 文本到 SQL 模型，作为较慢的大语言模型智能体之前的快速“第一道关卡”。它通过一次前向传播为受限语法中的查询计划打分，执行最多 32 个候选计划，再用训练好的验证器选出答案；不确定时才转交给大语言模型。LuthorSQL 在 BIRD 隐藏测试集上达到 68.03% 的执行准确率，每题耗时 0.84 秒，并能以量化权重在 9 GB 显存中运行，也可迁移到多种数据库系统。与 Claude Opus 5.5 配合时，它在准确率不变的情况下本地处理近半数问题，使 API 成本降低 33.3%。'}}}, {'id': 'https://huggingface.co/papers/2610.41354', 'title': 'OneSteer: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control', 'url': 'https://huggingface.co/papers/2610.41354', 'abstract': "Abstract  Deployment objectives often specify desired outcomes without providing revised trajectories, while parts of the original reference must still be followed. We present OneSteer, a one-step diffusion whole-body controller that combines general motion tracking with selective test-time steering. To accommodate new objectives, differentiable task costs guide optimization of the generator's input noise with frozen weights, while body-group reference masks relax selected tracking requirements. Predicted state-action plans provide a shared interface for task optimization and feedback-conditioned execution. For nominal tracking, the model trained from scratch achieves the lowest local tracking error among the evaluated baselines on successful held-out AMASS and BONES clips. For steering, one frozen distilled controller adapts across diverse deployment objectives in simulation, raising the clean passage rate under a 1.25 m bar from 2% to 90%. On a physical Unitree G1, OneSteer completes all 27 nominal tracking trials across nine diverse whole-body motion sequences without falling. With a steering cost derived from a signed distance field built using only onboard LiDAR, it also passes under a 1.1 m low bar in four of five attempts and steps over a 12 cm hurdle without falling in all three attempts. Beyond control, prediction variation in the model trained from scratch ranks likely tracking failures without physics rollouts. This scoring method is more than 10x faster than simulation-based scoring with five rollouts per clip and guides targeted fine-tuning. Project page: https://onesteer.github.io", 'score': 2, 'issue_id': 3540, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '9637244b89576e45', 'authors': ['Yifei Huang', 'Yazhao Yang', 'Li Weijia', 'Tianle Shi', 'Ji Jin', 'Zhihui Cai', 'Zihao Liu', 'Jianzhuang Zhao', 'Songlin Dong', 'Xinyuan Chang', 'Yihong Gong', 'Dian Shen', 'Zhiheng Ma'], 'affiliations': ['Northwestern Polytechnical University', 'Primotion', 'Shenzhen University', 'Shenzhen University of Advanced Technology', 'Southeast University', 'Southern University of Science and Technology', 'The Hong Kong Polytechnic University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.41354.jpg', 'data': {'categories': ['#optimization', '#inference', '#training', '#rl', '#robotics', '#diffusion', '#3d'], 'emoji': '🤖', 'ru': {'title': 'Один шаг диффузии — и робот перешагивает препятствие на ходу', 'desc': 'Статья представляет OneSteer — one-step diffusion контроллер всего тела гуманоидного робота, который совмещает общее трекинг движений с выборочным управлением на этапе инференса. Новые цели задаются через дифференцируемые стоимости задач, которые оптимизируют входной шум генератора при замороженных весах, а маски групп тела ослабляют часть требований к трекингу. Предсказанные планы состояний и действий служат общим интерфейсом для оптимизации и исполнения, а также позволяют ранжировать вероятные сбои без физических роллаутов в 10 раз быстрее симуляции. Эксперименты в симуляции и на роботе Unitree G1 показывают высокую проходимость препятствий и стабильную ходьбу без падений.'}, 'en': {'title': 'One Controller, Steered to Meet New Goals', 'desc': 'OneSteer is a whole-body motion controller that tracks reference movements and can adjust its behavior to meet new goals. It steers a frozen diffusion model by optimizing its input noise using differentiable task costs, while masks let selected body parts deviate from the reference. In simulation, steering increases the rate of passing under a low bar from 2% to 90%, and physical tests show the robot can track motions and handle obstacles. The model can also estimate which motions are likely to fail using prediction variation, a method reported to be over 10 times faster than scoring with physics simulations.'}, 'zh': {'title': '冻结模型也能灵活转向：一步扩散实现全身动作跟踪与任务适应', 'desc': '这篇论文提出 OneSteer，一种一步扩散式全身控制器，既能跟踪参考动作，也能在部署时适应新的任务目标。它在不更新模型权重的情况下，利用可微任务代价优化生成器的输入噪声，并通过身体部位掩码放宽部分参考动作的跟踪要求。仿真和真实机器人实验表明，该方法能适应多种目标，例如让 Unitree G1 从低矮横杆下通过或跨越障碍，同时保持稳定。模型预测结果的变化还可用于快速识别可能跟踪失败的动作片段，其速度比基于物理仿真的评分快十倍以上。'}}}, {'id': 'https://huggingface.co/papers/2611.16661', 'title': 'Reducing Batch Makespan for LLM Agent Workloads through Inference-Environment Coordination', 'url': 'https://huggingface.co/papers/2611.16661', 'abstract': 'Abstract  Efficient batch execution of agent tasks is critical to LLM training and development workflows, including benchmark evaluation, synthetic-data generation, and RL rollouts. Since these tasks alternate between LLM inference and environment interaction, we present coordinated optimizations to reduce batch makespan, the time required to complete all tasks in a batch. For hybrid LLMs, a workload-based resource model guides GPU-memory allocation between key-value (KV) cache and recurrent state and provides a reference sample concurrency to exploit parallelism while limiting recomputation. Trajectory-aware routing and scheduling promote cache reuse while balancing worker load. Under constrained environment capacity, we decouple sample admission from environment execution and introduce Chain-Advancing Action Scheduling (CAAS), which prioritizes long chains using observed progress to shorten the batch tail. Controlled replay combines actual inference with recorded environment responses and durations for ablations of individual optimizations. Live evaluations with Ling-3.0-Flash and Ling-3.1-Flash on the BFCL, SWE-bench Multilingual, WideSearch, and MCP-Atlas benchmarks demonstrate makespan reductions of 10.4% to 65.0%, while evaluation scores remain aligned. Furthermore, these methods have been successfully applied to training and evaluation workflows for the Ling-3.x model series, accelerating the model-development cycle.', 'score': 1, 'issue_id': 3541, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'daf657cbf04715d2', 'authors': ['Wei Feng', 'Meiling Chen', 'Boxiao Chen', 'Lu Liu', 'Bin Zi', 'Libin Ye', 'Xingyu Lu', 'Lei Xu', 'Jun Zhou'], 'affiliations': ['Ling Team, Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.16661.jpg', 'data': {'categories': ['#optimization', '#training', '#science', '#rl', '#inference', '#agents', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Быстрее выполнять батчи агентов — быстрее обучать LLM', 'desc': 'В статье рассматриваются методы ускорения пакетного выполнения агентных задач для LLM, включая задачи бенчмарк-оценки, генерации синтетических данных и RL-роллаутов. Авторы предлагают распределять GPU-память между KV-кэшем и рекуррентным состоянием гибридных моделей, а также использовать маршрутизацию с учётом траекторий и балансировку нагрузки воркеров для повышения переиспользования кэша. Ключевой вклад — алгоритм CAAS (Chain-Advancing Action Scheduling), который разделяет допуск образцов и выполнение среды и приоритизирует длинные цепочки, сокращая «хвост» батча. Эксперименты на BFCL, SWE-bench Multilingual, WideSearch и MCP-Atlas показали сокращение времени выполнения батча (makespan) на 10.4–65.0% при сохранении качества оценок.'}, 'en': {'title': 'Coordinate Inference and Actions to Finish Agent Batches Faster', 'desc': 'The paper speeds up batches of LLM agent tasks, where models alternate between inference and actions in an environment. It allocates GPU memory between the KV cache and recurrent state, and routes and schedules tasks to reuse cached results while balancing worker loads. When environments are capacity-limited, Chain-Advancing Action Scheduling uses task progress to prioritize longer chains and reduce the time spent waiting for the final tasks. Tests across several benchmarks show that these methods reduce batch completion time by 10.4% to 65.0% while keeping evaluation scores aligned.'}, 'zh': {'title': '协同调度，让智能体任务批处理更快完成', 'desc': '本文研究如何更快地批量执行需要交替进行大语言模型推理和环境交互的智能体任务。针对混合式大语言模型，作者提出按工作负载分配 GPU 内存，并设置参考并发度，以兼顾并行效率和重复计算成本；同时利用轨迹信息进行路由与调度，促进缓存复用并平衡工作负载。环境容量受限时，Chain-Advancing Action Scheduling（CAAS）根据任务进度优先推进较长的任务链，从而缩短批次中最后完成任务所造成的等待时间。多项基准测试显示，这些优化可将批次完成时间缩短 10.4% 至 65.0%，且评测分数保持一致，并已用于 Ling-3.x 系列模型的训练与评测流程。'}}}, {'id': 'https://huggingface.co/papers/2611.16010', 'title': 'Iris-Z: Scaling One Generative Model Past Specialist Geometry Models', 'url': 'https://huggingface.co/papers/2611.16010', 'abstract': 'Abstract A unified generative backbone jointly models image appearance and depth, surpassing specialized depth models at scale while preserving general image generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Language moved from many task-specific models to one unified model: a single generative model with a single generative training task that handles all of them within the same backbone, and keeps improving with data, parameters and compute. We believe the bitter lesson applies just as much to computer vision, 3D and spatial understanding, in the end to visual intelligence: the effort should go into general architectures that solve all these tasks in a unified way, and into scaling them, rather than into task-specific designs. We test this on monocular geometry, a task that has belonged to specialised architectures for years. Iris-Z is a general image generator that produces appearance and geometry together. A single backbone denoises, reasons about and understands the image and its depth at the same time, and one set of weights generates images with their depth, estimates depth from photographs and paints images onto a given depth. At enough scale it surpasses state-of-the-art specialists on established depth benchmarks while keeping the generative abilities of the backbone it started from without specialized layers. We release two models for the community.', 'score': 1, 'issue_id': 3541, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'ff0e6a153d1b1344', 'authors': ['Alejandro Cañada', 'Chema Garabito'], 'affiliations': ['SperidLabs'], 'pdf_title_img': 'assets/pdf/title_img/2611.16010.jpg', 'data': {'categories': ['#diffusion', '#training', '#optimization', '#3d', '#multimodal', '#architecture', '#cv'], 'emoji': '🧭', 'ru': {'title': 'Одна генеративная модель вместо множества специалистов: глубина и изображение вместе', 'desc': 'Авторы представляют Iris-Z — универсальную генеративную модель, которая одновременно моделирует изображение и его карту глубины с помощью одного backbone и одного обучающего целевого признака. Вместо набора узкоспециализированных архитектур для отдельных задач используется единый генеративный подход, который масштабируется с ростом данных, параметров и вычислений. На бенчмарках монокулярной оценки глубины модель превосходит state-of-the-art специализированные решения, при этом сохраняя генеративные способности исходной модели без дополнительных специализированных слоев. Одна и та же модель умеет генерировать изображения вместе с глубиной, оценивать глубину по фотографии и синтезировать изображение по заданной карте глубины.'}, 'en': {'title': 'One Generative Model for Images and Depth', 'desc': 'The paper presents Iris-Z, a unified generative model that creates images and their depth using one backbone and one set of weights. It can generate an image with depth, estimate depth from a photograph, or create an image that matches a given depth map. At sufficient scale, it outperforms specialized models on standard monocular depth benchmarks while retaining its general image-generation abilities. These results support scaling general-purpose architectures instead of building separate models for each vision task.'}, 'zh': {'title': '一个骨干网络，统一生成图像与深度', 'desc': '论文提出 Iris-Z，一个统一的图像生成模型，能够在同一骨干网络中同时建模图像外观和深度几何。它使用同一套权重完成图像与深度联合生成、从照片估计深度，以及根据给定深度生成图像。实验表明，模型规模足够大时，它在常用深度基准上的表现超过了专用深度模型，同时保留了通用图像生成能力。论文强调，与其为不同视觉任务设计专用模型，不如扩展统一架构，并利用更多数据、参数和计算资源持续提升能力。'}}}, {'id': 'https://huggingface.co/papers/2611.05843', 'title': 'Dual Flow: Joint Image-Measurement Interpolation for Inverse Problems', 'url': 'https://huggingface.co/papers/2611.05843', 'abstract': 'Abstract  Generative model-based approaches to linear inverse problems typically use the acquired noisy measurement to condition or guide sampling in the image domain. In this work, we introduce Dual Flow, a novel joint-flow model for solving linear inverse problems by jointly estimating the clean image and corresponding noise-free measurement from the observation. Specifically, Dual Flow formulates image reconstruction and measurement denoising as a coupled estimation problem, using coupled flows in the image and measurement domains. The acquired noisy measurement is used only to initialize the measurement state; thereafter, image and measurement states are jointly updated based on their current values. By construction, the final image and measurement estimates are guaranteed to satisfy the underlying forward model. We derive the sampling updates for the joint-flow which involves the conditional mean of the clean image given the joint state. We further derive a closed-form expression for a sufficient statistic of the joint state and show that the required conditional mean can be obtained by solving an image-domain Gaussian denoising problem involving operator-dependent, correlated noise. We train a velocity-prediction network using this formulation to estimate the conditional mean from the derived sufficient statistic. Extensive experiments across various linear inverse problems and image datasets demonstrate state-of-the-art performance in both distortion metrics and perceptual quality. Dual Flow requires no hyperparameter tuning beyond the number of inference steps and achieves shorter reconstruction times than competing methods. Additional analyses assess robustness to model mismatch, as well as the ability to generate diverse plausible reconstructions and characterize reconstruction uncertainty.', 'score': 1, 'issue_id': 3540, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'fada8c969c4472d5', 'authors': ['Sevket Ege Yesilyurt', 'Figen S. Oktem'], 'affiliations': ['Department of Electrical and Electronics Engineering, Middle East Technical University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05843.jpg', 'data': {'categories': ['#optimization', '#architecture', '#inference', '#diffusion', '#cv'], 'emoji': '🔄', 'ru': {'title': 'Совместная оценка изображения и измерения даёт точную реконструкцию за меньшее время', 'desc': 'В статье предлагается метод Dual Flow для решения линейных обратных задач, например восстановления изображений по зашумлённым измерениям. Вместо условной генерации в пространстве изображений модель совместно оценивает чистое изображение и безшумное измерение с помощью связанных потоков (joint flow) в двух доменах. Обучается сеть предсказания скорости, которая оценивает условное среднее через статистику по Гауссову шуму в изображении, зависящему от оператора. Эксперименты показывают лучшие метрики искажений и перцептуального качества, а также меньшее время реконструкции при отсутствии подбора гиперпараметров.'}, 'en': {'title': 'Reconstruct Images by Letting Measurements and Images Flow Together', 'desc': 'Dual Flow solves linear inverse problems by jointly estimating a clean image and its corresponding noise-free measurement. It uses coupled flow models to update both estimates, and the final pair is guaranteed to obey the forward model. A velocity-prediction network estimates the conditional mean needed for these updates using a Gaussian denoising problem with operator-dependent, correlated noise. Experiments show strong image quality, fast reconstruct
