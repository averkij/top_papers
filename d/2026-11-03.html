mization', '#architecture', '#video', '#multimodal', '#robotics', '#diffusion', '#3d', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Видео и 3D-движение предсказываются вместе, физика становится точнее', 'desc': 'Статья представляет WorldFlow — генеративную модель мира, которая совместно предсказывает будущее видео и 3D-траектории объектов. 3D-движение параметризуется непрерывными токенами смещения, выровненными по видеосетке, а единый backbone на основе Mixture-of-Transformers совместно денойзит оба модальных потока по целевой функции rectified flow. Модель обучена на 1,44 млн разнородных образцов из симуляций и реального мира и оценена на новом бенчмарке WorldFlowBench. WorldFlow достигает наименьших ADE и FDE среди learning-based методов, снижая ADE на 54,2% на SpatialCog по сравнению с лучшим внешним baseline.'}, 'en': {'title': 'See the future, track the motion', 'desc': 'WorldFlow predicts future video and 3D object trajectories together, so it models both how a scene looks and how objects move. It represents motion as continuous displacement tokens and uses a Mixture-of-Transformers backbone to predict both kinds of information with a rectified-flow objective. Training on 1.44 million samples from simulated and real-world settings helps it learn physical dynamics across different environments. On several benchmarks, it predicts trajectories more accurately than the evaluated learning-based methods, including a substantial improvement on spatial reasoning tasks.'}, 'zh': {'title': '让视频与三维轨迹协同预测，学会理解真实物理世界', 'desc': 'WorldFlow 是一种生成式世界模型，能够同时预测未来视频和基于查询的三维轨迹。它将三维运动表示为与视频网格对齐的连续位移标记，并使用混合 Transformer（MoT）骨干网络，在整流流目标下联合去噪两种模态。研究团队在涵盖仿真与真实场景的 144 万个物体级样本上训练模型，并构建了包含 11 个数据来源的 WorldFlowBench。实验显示，WorldFlow 在多个基准上的平均位移误差（ADE）和最终位移误差（FDE）最低，尤其在空间推理任务中显著优于基线方法和仅使用流监督的变体。'}}}, {'id': 'https://huggingface.co/papers/2610.41574', 'title': 'BYOD: Build Your Own DLM - Efficient Autoregressive-to-Diffusion Language Model Conversion', 'url': 'https://huggingface.co/papers/2610.41574', 'abstract': 'Abstract BYOD converts autoregressive language models into diffusion models via parameter-efficient LoRA adapters, enabling parallel generation with minimal training cost while preserving base-model knowledge.  Generated by thinkingmachines/Inkling-Small Unlike autoregressive (AR) models, diffusion language models (DLMs) permit parallel token updates, flexible generation, and bidirectional attention, but leading systems rely on costly pretraining or full-model fine-tuning. We present Build Your Own DLM (BYOD), a generalizable LoRA-only recipe for parameter-efficient AR-to-DLM conversion. Without architecture-specific tuning, BYOD induces diffusion generation in Gemma 2 9B, Llama 3.1 8B, Qwen2.5 7B, and Ministral 8B; to our knowledge, this is the first reported AR-to-DLM conversion of a Mistral model. The adapters comprise 4.1-5.8% of final parameters while every base-model parameter remains frozen; each 25,000-iteration conversion needs at most 102.4M tokens, processed in 3.1-4.0 hours on one Google Colab GPU. All four models generate from fully masked sequences, use bidirectional context in a controlled attention test, and retain substantial parent-model knowledge. BYOD-Gemma is the strongest BYOD conversion on our nine-task evaluation, reaching 50.6% average accuracy compared with 51.9% for LLaDA 8B Instruct in the same harness. Open-generation quality at low network function evaluation (NFE) budgets remains the principal limitation: BYOD perplexity is 8.3-11.1 versus 4.1 for LLaDA and 2.2-3.0 for the AR parents when generating 128 tokens in 64 steps. To enable further experimentation and inspection, we provide a standalone training and evaluation implementation and interactive demos for all four conversions. BYOD thus provides a practical route for extending diffusion generation to other existing model families while identifying the gap that efficient conversion must next close.', 'score': 5, 'issue_id': 3493, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '24fc70acc820dbd8', 'authors': ['Ruurd J. A. Kuiper', 'Robert A. Bagheri'], 'affiliations': ['Department of Methodology and Statistics, Utrecht University', 'Julius Center for Health Sciences and Primary Care, University Medical Center Utrecht'], 'pdf_title_img': 'assets/pdf/title_img/2610.41574.jpg', 'data': {'categories': ['#optimization', '#architecture', '#open_source', '#inference', '#training', '#diffusion', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Превращаем авторегрессионные LLM в диффузионные модели дёшево и без потери знаний', 'desc': 'В статье представлен метод BYOD, который превращает авторегрессионные LLM в диффузионные языковые модели (DLM) с помощью LoRA-адаптеров, без переобучения всей модели. Базовые параметры остаются замороженными, а адаптеры составляют около 4–6% от итоговых параметров, что делает конвертацию дешёвой: около 25 000 итераций на одном GPU за несколько часов. Полученные модели генерируют текст из полностью замаскированных последовательностей, используют двунаправленный контекст и сохраняют знания исходной модели, показывая качество, сопоставимое с LLaDA 8B Instruct на ряде задач. Основным ограничением остаётся качество открытой генерации при малом числе шагов вычисления, где перплексия заметно выше, чем у авторегрессионных родителей.'}, 'en': {'title': 'Turn Existing Language Models into Diffusion Models with Lightweight Adapters', 'desc': 'BYOD converts autoregressive language models into diffusion language models using small LoRA adapters, while keeping all original model parameters frozen. The method enables parallel token generation and bidirectional attention with relatively little training data and compute, and works across four model families. Its strongest converted model reaches accuracy close to a comparable diffusion model and retains substantial knowledge from its base model. However, generated text is less fluent at low numbers of denoising steps, so improving generation quality remains an important challenge.'}, 'zh': {'title': '冻结原模型，用轻量 LoRA 解锁扩散式生成', 'desc': '本文提出 BYOD，一种只使用 LoRA 适配器将自回归语言模型转换为扩散语言模型的方法。转换时冻结原模型参数，训练量和计算成本较低，并能让多个模型并行生成、使用双向上下文，同时保留大量原有知识。实验显示，BYOD-Gemma 在九项任务上的平均准确率达到 50.6%，接近同一评测中的 LLaDA 8B Instruct。它的主要不足是在生成步数较少时文本质量仍较弱，论文也提供了训练代码和交互演示，便于进一步研究。'}}}, {'id': 'https://huggingface.co/papers/2610.40293', 'title': 'MAServeBench: Benchmarking Multi-Agent LLM Serving Systems with Hierarchical Collaboration Workloads', 'url': 'https://huggingface.co/papers/2610.40293', 'abstract': 'Abstract MAServeBench evaluates LLM serving and hardware by modeling multi-agent collaboration as a configurable workload dimension with reproducible dependency traces.  Generated by thinkingmachines/Inkling-Small Large language model (LLM)-based multi-agent systems (MAS) coordinate specialized agents to solve complex tasks, turning each user request into interdependent model and tool operations. Unlike independent requests, these operations become ready at different times and consume evolving context as agents coordinate and exchange results. This creates changing patterns of concurrency, computation, and memory demand that can expose different bottlenecks in LLM serving hardware. Yet benchmarking these effects requires capturing the collaboration rules that generate serving workloads, beyond the requests observed during execution. We present MAServeBench, a benchmark that treats multi-agent collaboration as a configurable dimension of serving workloads for LLM serving and hardware evaluation. Its composable stages capture how agents coordinate and exchange context in documented MAS workflows, enabling native executions to generate different workloads even when task inputs and tools remain unchanged. Hierarchical Semantic Traces preserve realized operations and dependencies for reproducible comparisons of legal release constraints at fixed work. Task-linked measurements connect these workloads to serving execution and GPU/NPU hardware behavior, revealing why serving efficiency does not always translate into timely task completion. The benchmark code is available at https://github.com/ShengxuanQiu/MAServeBench.', 'score': 4, 'issue_id': 3492, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '215a2d0afeb73405', 'authors': ['Shengxuan Qiu', 'Haochen Huang', 'Shuzhang Zhong', 'Zizhuo Fu', 'Zebin Yang', 'Meng Li'], 'affiliations': ['1'], 'pdf_title_img': 'assets/pdf/title_img/2610.40293.jpg', 'data': {'categories': ['#agents', '#benchmark', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Эффективность инференса не равна скорости решения задач мультиагентных LLM', 'desc': 'В статье представлен MAServeBench, новый бенчмарк для оценки систем инференса LLM и аппаратного обеспечения в сценариях мультиагентного взаимодействия. Авторы моделируют коллаборацию агентов как настраиваемое измерение нагрузки, которое порождает зависимые операции и меняющуюся конкурентность, память и вычисления. Для воспроизводимого сравнения используются Hierarchical Semantic Traces, сохраняющие реальные операции и зависимости между ними. Результаты показывают, что высокая эффективность serving не всегда означает своевременное выполнение задачи, что важно для оптимизации GPU/NPU.'}, 'en': {'title': 'Benchmark the collaboration behind multi-agent workloads', 'desc': 'MAServeBench benchmarks how multi-agent collaboration changes the workloads handled by large language model (LLM) serving systems. It represents agent coordination and context exchange as configurable stages, so the same tasks and tools can produce different patterns of operations and concurrency. Hierarchical Semantic Traces record operations and their dependencies to support reproducible comparisons at fixed amounts of work. By linking task completion to serving and GPU/NPU measurements, the benchmark helps explain why higher serving efficiency may not lead to faster completion of a task.'}, 'zh': {'title': '让多智能体协作负载可配置、可复现、可衡量', 'desc': '这篇论文提出 MAServeBench，用来评估大语言模型服务系统和硬件处理多智能体协作任务的表现。它把智能体之间的协作方式设计成可配置的工作负载维度，并通过可组合阶段描述智能体如何协调、交换上下文。层次化语义轨迹记录实际执行的操作及其依赖关系，从而支持在固定工作量下进行可复现的比较。将任务完成情况与服务执行及 GPU、NPU 硬件测量关联后，基准还能揭示为什么更高的服务效率不一定意味着任务能更快完成。'}}}, {'id': 'https://huggingface.co/papers/2611.02633', 'title': 'Measuring AI Agents as Teammates with Collaborative Intelligence', 'url': 'https://huggingface.co/papers/2611.02633', 'abstract': 'Abstract The Collaborative Intelligence Benchmark evaluates AI agents as teammates across 240 tasks, revealing that even top models have significant collaboration weaknesses unrelated to individual capability.  Generated by thinkingmachines/Inkling-Small Progress in AI is often measured by what a single model can do on its own. Yet teams of AI agents are starting to make breakthroughs and discoveries in science, medicine, mathematics and software engineering. As AI begins to work in teams of agents and people, the ability to collaborate becomes a core part of their intelligence. Research on human teams has measured this ability for decades. Inspired by this, we introduce the Collaborative Intelligence Benchmark, which measures how well an AI agent works as a teammate. It contains 240 tasks across 8 dimensions of teamwork, from refusing an unsafe shortcut to checking the work that a weaker model leaves behind. Each task comes from a real record or an existing benchmark, from aviation accident reports and clinical cases to coding tasks and negotiations, and has a programmatically verifiable outcome. To isolate teamwork from individual capability, models are scored only on tasks that they can solve by themselves when they have full information. We evaluate 18 closed- and open-weight models and find that every model, across sizes and families, has clear weaknesses as a teammate, with the best model scoring only 82.2 out of 100. Frontier models almost always refuse unsafe shortcuts and report misconduct, yet they cave under interpersonal pressure, reaching the best overall deal in only 14% of conflicts, and their pass rate drops from 97% to 81% when they take over a task in which a weaker model has cheated. Crucially, general capability does not guarantee good teamwork, as models with nearly the same capability score differ by up to 11 points as teammates. The benchmark includes 160 public tasks with code and data, along with 80 held-out tasks for evaluation. As AI agents increasingly work alongside other agents and people, the ability to collaborate effectively is becoming a crucial capability to measure and develop.', 'score': 3, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '211f2a8794c2ab3b', 'authors': ['Sean Wu', 'Aneesh Pappu', 'Jiaru Zou', 'Yubin Kim', 'Yuncong Mao', 'Hongjian Zhou', 'Junchi Yu', 'Jieneng Chen', 'James Zou'], 'affiliations': ['MIT', 'Stanford University', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.02633.jpg', 'data': {'categories': ['#alignment', '#games', '#ethics', '#open_source', '#agents', '#agi', '#dataset', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'Сильный интеллект — это не только умение работать в одиночку, но и умение работать в команде', 'desc': 'Статья представляет Collaborative Intelligence Benchmark, бенчмарк из 240 задач, который оценивает, насколько хорошо AI-агент работает как член команды, а не только как отдельная модель. Задачи охватывают 8 измерений командной работы: от отказа от небезопасных шорткатов до проверки результатов более слабой модели. Оценивается 18 LLM, при этом учитываются только задачи, которые модель способна решить самостоятельно, чтобы изолировать навыки командной работы от индивидуальных способностей. Результаты показывают, что ни одна модель не лишена слабостей: лучшая набирает 82.2 из 100, а модели с близкой общей capability различаются как командные игроки до 11 баллов. Авторы подчеркивают, что коллаборация должна стать отдельной измеряемой и развиваемой способностью AI.'}, 'en': {'title': 'Intelligence Is Better Together', 'desc': 'The Collaborative Intelligence Benchmark measures how well AI agents work with teammates across 240 tasks and eight teamwork dimensions. To separate collaboration from individual ability, models are tested only on tasks they can solve alone when given full information. Across 18 models, even the best scores 82.2 out of 100, with weaknesses such as yielding to interpersonal pressure and failing to catch work tainted by cheating. Similar overall capability does not ensure similar teamwork, so collaboration needs to be measured and improved as a distinct AI capability.'}, 'zh': {'title': '能力强不等于会合作：用基准检验 AI 团队协作', 'desc': '本文提出协作智能基准，用来评估 AI 智能体作为队友的表现。基准包含 240 项任务，覆盖 8 个团队合作维度，并通过可程序化验证的结果进行评分。研究发现，即使顶尖模型也存在明显的协作弱点；单体能力相近的模型，团队表现最高可相差 11 分。模型往往能拒绝不安全捷径，却容易受到人际压力影响，也不总能有效检查较弱模型留下的工作。'}}}, {'id': 'https://huggingface.co/papers/2610.41216', 'title': 'TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents', 'url': 'https://huggingface.co/papers/2610.41216', 'abstract': "Abstract TinyAstral improves robot agent harnesses via recursive self-improvement and distills compact students that retain performance gains with lower compute.  Generated by thinkingmachines/Inkling-Small Robot agents built on vision-language models depend on both the planner and its harness: the tools, feedback, memory, and recovery logic around it. Can improvements to a large teacher's harness be carried into a compact agent with lower inference compute cost? We present TinyAstral, a two-stage approach. We first freeze an open-weight teacher and improve its harness through recursive self-improvement (RSI): frontier LLM agents read the teacher's trajectories and propose harness edits, and each edit is accepted only if it passes a paired statistical test. We then freeze the final harness, collect teacher trajectories with reasoning and failure recovery, and distill a small student that replaces the teacher in the same harness. On RoboTwin, harness evolution raises the teacher's success from 33.4% to 63.6%; the final 4B student reaches 62.8%. Across four harness versions, distilled 4B students score close to their corresponding teachers, and later versions yield stronger students, showing that harness evolution gains carry into compact models. The harness gains also transfer to other frozen planners without retraining. On identical episodes, the final 4B student outperforms open 4B agents, the open 27B harness-RSI model SenseNova-RoboRSI, and our own teacher model placed in three competitors' harnesses. It stays close to its teacher on all three training benchmarks, and on three benchmarks never used for RSI or training it scores close to a 552B planner running the same harness. On the measured deployment episodes, it uses about one fifth of its teacher's accelerator time.", 'score': 3, 'issue_id': 3493, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '34ea753bb8df2840', 'authors': ['Kehong Gong', 'Xiaoxu Zheng', 'Guanli Hou', 'Seunghun Lee', 'Mengqi Guo', 'Runjia Tan', 'Zhengyu Wen', 'Qi Wang', 'Xiaoyu He', 'Mingyuan Zhang', 'Michael Bi Mi'], 'affiliations': ['Huawei Noah Research Institute', 'Huawei Technologies Co., Ltd'], 'pdf_title_img': 'assets/pdf/title_img/2610.41216.jpg', 'data': {'categories': ['#optimization', '#games', '#small_models', '#robotics', '#multimodal', '#agents', '#inference', '#agi', '#synthetic', '#training', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Умный каркас в маленьком роботе: та же эффективность, в пять раз меньше вычислений', 'desc': 'Статья показывает, что улучшения «обвязки» (harness) большого агента-учителя — инструментов, обратной связи, памяти и логики восстановления — можно перенести в компактную модель. Сначала авторы применяют рекурсивное самоулучшение (RSI), где LLM-агенты предлагают правки harness, а каждая правка принимается только после парного статистического теста. Затем финальный harness используется для сбора траекторий учителя и дистилляции маленького студента (4B), который почти не теряет в успешности, но использует примерно пятую часть вычислительных ресурсов. Результаты подтверждены на RoboTwin и других бенчмарках, включая тесты, не использовавшиеся при обучении.'}, 'en': {'title': 'Improve the harness, distill the gains', 'desc': 'TinyAstral improves a robot agent’s harness—the tools, feedback, memory, and recovery logic surrounding its planner—using recursive self-improvement. Frontier language-model agents suggest harness changes, which are kept only when paired statistical tests show they help a frozen teacher. The improved harness then guides trajectory collection and distillation into a compact 4B student, which reaches 62.8% success compared with the teacher’s improved 63.6%. The student retains strong performance across benchmarks while using about one fifth of the teacher’s accelerator time on measured episodes.'}, 'zh': {'title': '进化智能体框架，让小模型以更低算力接近大教师', 'desc': '这篇论文提出 TinyAstral，通过改进机器人智能体的执行框架，再把改进效果迁移到小模型中。研究者冻结视觉语言模型教师，用递归自我改进（RSI）让大语言模型分析执行轨迹并提出框架修改，只有通过配对统计检验的修改才会被采用。随后，他们固定改进后的框架，收集教师的推理与失败恢复轨迹，用知识蒸馏训练 4B 学生模型；在 RoboTwin 上，教师成功率从 33.4% 提升到 63.6%，学生达到 62.8%。实验还显示，框架改进能迁移到其他规划器，学生在多个基准上接近教师表现，而部署时的加速器耗时约为教师的五分之一。'}}}, {'id': 'https://huggingface.co/papers/2610.41296', 'title': 'Self-Improvement with Auxiliary Rewards: Learning from Verified Traces and Evaluating Transfer', 'url': 'https://huggingface.co/papers/2610.41296', 'abstract': 'Abstract Auxiliary trajectory preferences based on entropy and confidence metrics improve small language model self-improvement and transfer by distinguishing learning value among equally correct reasoning traces.  Generated by thinkingmachines/Inkling-Small Answer-level rewards cannot distinguish reasoning traces with equally correct outcomes. We study whether auxiliary trajectory preferences improve small-language-model self-improvement and transfer under limited supervision. We compare confidence-based (SC) and entropy-based metrics (UID-Conj.), which combines global entropy variation and local smoothness, through online reward augmentation and offline training on correct responses. Online experiments adapt Qwen3-1.7B on 30 AIME problems without reference answers; offline experiments use historical AIME problems. UID-Conj. improves the online macro-average across the adaptation benchmark and three transfer benchmarks by 2.08 percentage points over unmodified TTRL. The strongest evidence comes from offline weighted SFT: UID-Conj. exceeds uniform weighting on the same response pool by 1.93 points, with a paired prompt-bootstrap 95\\% CI of [0.44, 3.44]. Benefits are task-dependent: SC rewards judged trace quality and instruction following, while UID-Conj. rewards yield stronger training outcomes in several settings. We find that auxiliary preferences can expose learning value among equally correct traces not captured during inference time, motivating their evaluation through downstream gains.', 'score': 3, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '0cb34cadd2c80a85', 'authors': ['Minju Gwak', 'Alan Ritter'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.41296.jpg', 'data': {'categories': ['#training', '#optimization', '#benchmark', '#reasoning', '#small_models', '#transfer_learning'], 'emoji': '🧠', 'ru': {'title': 'Не все правильные решения одинаково полезны для обучения модели', 'desc': 'В статье исследуется, может ли дополнительная оценка траекторий рассуждений улучшить самообучение небольших языковых моделей (LLM) при ограниченном объёме разметки. Авторы сравнивают метрики на основе уверенности (SC) и энтропии (UID-Conj.), которые используются как дополнительные награды в онлайн-режиме (TTRL) и как веса в offline-обучении через weighted SFT. Эксперименты с Qwen3-1.7B на задачах AIME показывают, что UID-Conj. даёт прирост около 2 процентных пунктов по сравнению с базовым TTRL и превосходит равномерное взвешивание. Результаты говорят о том, что предпочтения по траекториям позволяют выявлять ценность обучения у одинаково правильных решений, которую не видит оценка только по ответу.'}, 'en': {'title': 'Look Beyond Correctness to Find Better Reasoning Traces', 'desc': 'Answer-level rewards treat all correct reasoning traces alike, even though some may be more useful for learning. This paper tests whether confidence-based and entropy-based preferences can help small language models improve and transfer with limited supervision. On AIME tasks, entropy-based UID-Conj. improved results over standard training, including a 1.93 percentage-point gain over uniform weighting in offline supervised fine-tuning. The findings suggest that auxiliary trajectory preferences can identify learning value that correctness alone misses, though the best preference depends on the task.'}, 'zh': {'title': '不止看答案对错，更要看推理轨迹的学习价值', 'desc': '答案级奖励无法区分最终答案同样正确、但学习价值不同的推理轨迹。研究比较了基于置信度的指标 SC 与基于熵的指标 UID-Conj.，后者结合整体熵变化和局部平滑度，用于改进小语言模型的自我提升与迁移。在线实验中，UID-Conj. 相比未修改的 TTRL，在适配任务和三个迁移基准上的宏平均成绩提高了 2.08 个百分点；离线加权监督微调中，它比均匀加权高 1.93 个百分点。不同指标的效果会随任务变化，但按下游表现评估辅助偏好，有助于发现正确推理轨迹中未被答案奖励捕捉的学习价值。'}}}, {'id': 'https://huggingface.co/papers/2611.02928', 'title': 'Lab2Sim: Turning Real-World Experiment Videos into Interactive Virtual Experiments', 'url': 'https://huggingface.co/papers/2611.02928', 'abstract': 'Abstract Lab2Sim introduces a benchmark for converting science videos into interactive virtual experiments, and EduVideo2Code improves apparatus fidelity by encoding procedures as state machines for verified code generation.  Generated by thinkingmachines/Inkling-Small Science experiment videos demonstrate how experiments are performed, but offer no direct interaction for learners. Turning them into virtual experiments requires not only reproducing the observed apparatus and state changes, but also enforcing the preconditions governing each operation. We introduce Lab2Sim, a benchmark of 218 science experiment videos with evidence-grounded specifications and 11,881 rubric items. To address this task, we propose EduVideo2Code, which extracts experimental procedures hierarchically, encodes them as explicit state machines to guide code generation, and refines the resulting pages through execution-based verification. Experiments show that existing multimodal models readily generate runnable pages but struggle to faithfully reconstruct experimental apparatus. EduVideo2Code consistently improves all four evaluation dimensions across two backbone models, with apparatus fidelity gains of 24.15 points.', 'score': 2, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'b957f10cb68440d6', 'authors': ['Xusen Hei', 'Jiali Chen', 'Jinyu Yang', 'Yi Cai'], 'affiliations': ['South China University of Technology', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02928.jpg', 'data': {'categories': ['#video', '#science', '#plp', '#multimodal', '#synthetic', '#dataset', '#benchmark'], 'emoji': '🔬', 'ru': {'title': 'От видео науки к интерактивной виртуальной лаборатории', 'desc': 'Авторы представляют Lab2Sim — бенчмарк из 218 видео научных экспериментов с 11 881 пунктами оценки, предназначенный для превращения видео в интерактивные виртуальные лабораторные работы. Метод EduVideo2Code иерархически извлекает процедуры эксперимента и кодирует их в виде явных state machines, которые направляют генерацию кода. Затем сгенерированные страницы уточняются через execution-based verification, что повышает корректность выполнения. Эксперименты показывают, что существующие multimodal LLM легко генерируют рабочий код, но плохо воспроизводят установку, а EduVideo2Code улучшает точность воспроизведения оборудования на 24.15 пункта.'}, 'en': {'title': 'From Science Videos to Verified Virtual Experiments', 'desc': 'Lab2Sim is a benchmark for turning science experiment videos into interactive virtual experiments, with 218 videos and detailed evaluation rubrics. EduVideo2Code extracts the steps of each experiment and represents them as state machines, which specify how the apparatus changes and what conditions must be met before each operation. It uses these representations to generate code, then checks and improves the pages by running them. Tests show that EduVideo2Code improves four evaluation dimensions across two multimodal models, including apparatus fidelity by 24.15 points.'}, 'zh': {'title': '用状态机把实验视频变成可信的互动虚拟实验', 'desc': '本文提出 Lab2Sim 基准，用于评估模型能否把科学实验视频转化为可交互的虚拟实验，其中包含 218 段视频和 11,881 条评分标准。作者还提出 EduVideo2Code，它先分层提取实验步骤，再将步骤表示为显式状态机，以指导代码生成。随后，系统通过实际运行生成页面来验证并改进结果，确保操作符合相应的前置条件。实验表明，现有多模态模型虽然容易生成可运行页面，却难以忠实还原实验器材；EduVideo2Code 在两种骨干模型的四项评估指标上均有提升，器材还原度提高了 24.15 分。'}}}, {'id': 'https://huggingface.co/papers/2611.03526', 'title': 'Library of Layers (LoL): Adaptively Ordering Transformer Layers at Runtime', 'url': 'https://huggingface.co/papers/2611.03526', 'abstract': 'Abstract Library of Layers dynamically orders transformer blocks during inference to adapt computation to tasks, enabling parameter reuse, sparsity, and interpretable routing across reasoning, multilingual, and safety settings.  Generated by thinkingmachines/Inkling-Small Computer programmers chain together the same reusable computational primitives, for example, conditional statements or loops, but in different orders to implement different algorithms. In contrast, existing language model architectures always execute their layers in the same order. We introduce Library of Layers (LoL), an architecture that dynamically orders its layers during inference to solve the problem at hand. LoL has a single hyperparameter, the size of its global library of transformer blocks, that allows it to transition seamlessly between parameter reuse and sparsity, generalizing the parameter-efficiency and FLOPs-efficiency tradeoffs of dense, depth-recurrent, and mixture of experts architectures in one unified family. We show that LoL achieves competitive performance with all three above baselines when pretrained on text data. On synthetic sudoku and maze data, we observe that the model employs distinct layer orderings to implement different solution strategies, and we can intervene on routing to force a model to apply a specific solution strategy to a problem instance. In a multilingual natural language setting, we find that LoL chooses different layer order patterns based on language and script. Similarly, we train LoL on safety data and fit probes to its router outputs, finding that these probes distinguish safe from unsafe text with high AUROC. LoL provides a path toward a future in which models dynamically compose their own computational graph, enabling more efficient and controllable reasoning.', 'score': 2, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'bae395f075d34bbb', 'authors': ['Abdellah Rahmani', 'Sean McLeish', 'Ang Li', 'Sanae Lotfi', 'Pascal Frossard', 'Micah Goldblum'], 'affiliations': ['Columbia University', 'EPFL', 'New York University', 'University of Maryland'], 'pdf_title_img': 'assets/pdf/title_img/2611.03526.jpg', 'data': {'categories': ['#optimization', '#architecture', '#math', '#alignment', '#reasoning', '#multilingual', '#low_resource', '#interpretability'], 'emoji': '🧩', 'ru': {'title': 'Модель сама собирает свой вычислительный граф под задачу', 'desc': 'Авторы представляют архитектуру Library of Layers (LoL), в которой модель динамически выбирает порядок применения трансформерных блоков из общей библиотеки во время inference. Единственный гиперпараметр, размер библиотеки, позволяет плавно переходить между повторным использованием параметров и разреженностью, объединяя dense, depth-recurrent и mixture of experts архитектуры. На задачах судоку, лабиринтов, многоязычного текста и безопасности LoL формирует разные порядки слоёв, а маршрутизатор можно интерпретировать и даже направлять вручную. Пробы (probes), обученные на выходах роутера, хорошо различают безопасный и небезопасный текст по метрике AUROC.'}, 'en': {'title': 'Let the Model Choose Its Layers', 'desc': 'Library of Layers (LoL) is a transformer architecture that dynamically selects and orders blocks during inference, rather than running layers in a fixed sequence. A global library size controls how much the model reuses parameters versus uses sparse computation, unifying tradeoffs found in dense, recurrent, and mixture-of-experts models. Experiments show competitive performance and reveal that routing patterns vary with reasoning strategy, language, and safety-related content; researchers can also intervene on routing to encourage a particular strategy. These findings suggest dynamic routing could make computation more efficient and reasoning more controllable.'}, 'zh': {'title': '让模型按任务动态编排计算层', 'desc': '本文提出“层库”（LoL），让模型在推理时动态选择并排列 Transformer 层，以适应不同任务。通过调整层库大小，LoL 能在参数复用与计算稀疏性之间灵活取舍，并统一涵盖稠密网络、循环深度模型和专家混合模型的效率权衡。在数独、迷宫、多语言和安全任务中，模型会采用不同的层路由模式；研究者也能干预路由，引导模型使用特定策略。实验表明，路由信息还可用于区分安全与不安全文本，为更高效、可控的推理提供了新方向。'}}}, {'id': 'https://huggingface.co/papers/2610.38637', 'title': 'On-Policy Self-Distillation with Teacher Evolution', 'url': 'https://huggingface.co/papers/2610.38637', 'abstract': "Abstract Teacher-Evolution Self-Distillation improves on-policy self-distillation by continuously enhancing self-teaching reliability through reward-guided teacher optimization and adaptive down-weighting of unreliable samples.  Generated by thinkingmachines/Inkling-Small On-Policy Self-Distillation (OPSD), which aligns a student model's token-level distribution with that of its self-teacher prompted by privileged context, has emerged as a promising direction to mitigate reward sparsity in sequence-level post-training paradigms. However, OPSD often fails to achieve continuous performance gains during training. In this paper, we find that the model's limited self-teaching capability underlies this phenomenon by generating unreliable guidance on certain samples. To address this problem, we propose Teacher-Evolution Self-Distillation (TESD), which enables the self-teacher to generate rollouts and receive environmental feedback based on task correctness and context independence. First, using these rewards as training objectives, we perform teacher-oriented optimization to continuously enhance the model's self-teaching capability during distillation. Second, by estimating teacher guidance reliability from these rewards, we apply adaptive student-oriented optimization to down-weight samples with unreliable guidance. Extensive experiments across multiple datasets and model scales show that TESD consistently outperforms representative token-level and sequence-level methods, highlighting the necessity of improving supervision quality in OPSD.", 'score': 2, 'issue_id': 3492, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '6a8995ffaf8241ae', 'authors': ['Shufan Shen', 'Zhongni Hou', 'Chao Bi', 'Yufei Zhang', 'Guojun Yin', 'Shuhui Wang'], 'affiliations': ['Institute of Computing Technology, Chinese Academy of Sciences', 'Meituan', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.38637.jpg', 'data': {'categories': ['#training', '#alignment', '#optimization', '#rlhf'], 'emoji': '🎓', 'ru': {'title': 'Учитель, который учится сам: надежная супервизия для самодистилляции', 'desc': 'Статья посвящена улучшению On-Policy Self-Distillation (OPSD), где студенческая LLM выравнивает токенные распределения с собственным учителем, использующим привилегированный контекст. Авторы обнаружили, что ограниченная способность модели к самообучению порождает ненадежные сигналы супервизии на части примеров, из-за чего качество не растет стабильно. Предложенный метод TESD оптимизирует самого учителя с помощью наград за корректность и независимость от контекста, повышая надежность его подсказок. Затем адаптивно понижает веса примеров с ненадежной супервизией при оптимизации студента, что ведет к стабильно лучшим результатам на разных датасетах и масштабах моделей.'}, 'en': {'title': 'Improve the Teacher, Trust the Guidance', 'desc': 'On-policy self-distillation trains a model to match guidance from a self-teacher, but that guidance can be unreliable and limit progress. Teacher-Evolution Self-Distillation (TESD) lets the teacher generate answers and receive rewards for correctness and independence from privileged context. It uses these rewards to improve the teacher and to reduce the influence of examples where its guidance is unreliable. Experiments across datasets and model sizes show TESD outperforms several token-level and sequence-level training methods.'}, 'zh': {'title': '让教师不断进化，让可靠指导驱动学生学习', 'desc': '本文提出教师进化自蒸馏（TESD），旨在解决在线自蒸馏中教师有时会提供不可靠指导、训练效果难以持续提升的问题。方法让自教师生成回答，并根据任务正确性和对上下文的依赖程度获取环境反馈。研究利用这些奖励优化教师，逐步提升其自我教学能力。与此同时，方法会估计指导的可靠性，并降低不可靠样本对学生训练的影响；实验显示，TESD在多个数据集和模型规模上优于多种代表性方法。'}}}, {'id': 'https://huggingface.co/papers/2610.27815', 'title': 'ProVe: Proposer-Verifier Decoding', 'url': 'https://huggingface.co/papers/2610.27815', 'abstract': "Abstract ProVe reverses speculative decoding roles by fine-tuning a large model to propose token blocks and verifying them with a smaller or identical model, achieving faster autoregressive generation with adjustable speed-accuracy tradeoffs.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates autoregressive (AR) language models by letting a small model draft tokens serially and a large model verify them in parallel. We reverse these roles. Starting from a standard AR checkpoint, we fine-tune the large model into a proposer that predicts a block of future tokens in a single forward pass, then use one additional forward pass to verify the proposed block. This gives ProVe, Proposer-Verifier decoding. The verifier can be a smaller AR model or the proposer itself; the latter gives ProVe-lossless, which reproduces the proposer's greedy AR decoding. Block proposals already provide substantial room for acceleration: with a block size of 16, the proposed block has an average AR-matching prefix of 6.6 tokens on GSM8K. Across six benchmarks with a 32B proposer, ProVe-lossless reaches 2.5x average AR throughput without training a separate draft head. With a small 3B verifier, ProVe reaches 2.7x average throughput at 2.6 accuracy points below AR on the six-task average, providing a controllable tradeoff between speed and accuracy.", 'score': 2, 'issue_id': 3492, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '13213a9cb37de189', 'authors': ['Ziqi Jin', 'Weiwen Xu', 'Jiaxi Li', 'Yujie Zhong', 'Qi She', 'Aixin Sun'], 'affiliations': ['University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.27815.jpg', 'data': {'categories': ['#training', '#optimization', '#small_models', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Большая модель предлагает блоки токенов, а маленькая их проверяет: быстрее без потери качества', 'desc': 'Статья предлагает ProVe, метод ускорения авторегрессионной генерации, в котором роли спекулятивного декодирования меняются местами: большая модель донастраивается так, чтобы предсказывать целый блок будущих токенов за один проход. Затем дополнительный проход проверяет предложенный блок, при этом в роли верификатора может выступать меньшая LLM или сама большая модель. Вариант ProVe-lossless воспроизводит жадное AR-декодирование без потери качества и даёт ускорение около 2.5x на 32B-модели без обучения отдельной draft-головы. Использование компактного верификатора 3B даёт ускорение около 2.7x с небольшой потерей точности, что позволяет гибко регулировать баланс между скоростью и качеством.'}, 'en': {'title': 'Propose in Blocks, Verify for Speed', 'desc': 'ProVe speeds up autoregressive language model generation by reversing the usual roles in speculative decoding. A fine-tuned large model proposes a block of future tokens in one forward pass, and a verifier checks that block in another pass. When the proposer verifies itself, ProVe-lossless matches its greedy autoregressive output; using a smaller verifier can increase speed while slightly reducing accuracy. In reported tests, ProVe achieved up to 2.5× throughput without a separate draft head, while the smaller-verifier version reached 2.7× throughput with a modest accuracy tradeoff.'}, 'zh': {'title': '让大模型一次提议一组词元，加速生成并灵活权衡准确率', 'desc': 'ProVe 改变了传统推测解码的分工：微调大型语言模型，让它一次预测一组未来词元，再用验证模型检查这组预测。验证模型可以是较小的自回归模型，也可以是提议模型本身；后者能保持与提议模型贪心解码相同的结果。实验中，32B 提议模型配合自身验证时，平均生成速度达到普通自回归解码的 2.5 倍；配合 3B 验证模型时，速度达到 2.7 倍，但平均准确率低 2.6 个百分点。该方法因此能在生成速度与准确率之间提供可调节的取舍，而且不需要额外训练一个草稿头。'}}}, {'id': 'https://huggingface.co/papers/2611.01815', 'title': 'When Does Latent Prediction Error Support Physical Surprise Claims in Video World Models?', 'url': 'https://huggingface.co/papers/2611.01815', 'abstract': "Abstract The study evaluates frozen video representations to show that prediction errors reflect appearance and motion rather than reliably measuring physical surprise.  Generated by thinkingmachines/Inkling-Small Prediction errors from video world models are often treated as physical surprise, but they can also reflect appearance, static content, motion, or ordinary prediction difficulty. We present an evaluation framework that separates what frozen representations contain, how they organize appearance and physical differences, and what changes a model's own prediction error. On IntPhys2, a benchmark of physically possible and impossible events, we compare representations from latent prediction, masked pixel reconstruction, and simple visual statistics. Appearance remains easy to decode, while V-JEPA2 exposes modest information about whether events are possible or impossible. Looking at the latent geometry, appearance changes become smaller compared with differences between videos, their directions line up more consistently across scenes, and their overlap with physical changes decreases in deeper layers. Across action-conditioned models, incorrect actions raise prediction error, while appearance changes also produce substantial responses. In Physion++ video clips, repeating a single frame can produce higher error than the original clip, while changing color throughout the clip can lower it. Using Kubric, a simulation and rendering framework, we find that impossible events can produce lower error than possible events. A fixed error threshold also incorrectly flags many possible events as impossible. A model can therefore represent physical information and respond to incorrect actions without its native prediction error reliably measuring physical surprise.", 'score': 1, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '11b1462d24d2a2bd', 'authors': ['Anton Hristov', 'Aleksandar Slavov', 'Vasil Vasilev'], 'affiliations': ['Baba Tonka High School of Mathematics', 'Technology School Electronic Systems (TUES)'], 'pdf_title_img': 'assets/pdf/title_img/2611.01815.jpg', 'data': {'categories': ['#data', '#video', '#interpretability', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Ошибка предсказания видео-модели — не всегда признак физической невозможности', 'desc': 'Статья оценивает замороженные (frozen) представления видео-моделей мира, чтобы проверить, отражают ли ошибки предсказания физическую неожиданность. Авторы сравнивают латентные предсказательные модели (например, V-JEPA2), реконструкцию замаскированных пикселей и простые визуальные статистики на бенчмарке IntPhys2 и других датасетах. Результаты показывают, что ошибка предсказания в основном чувствительна к внешнему виду, движению и сложности самого предсказания, а не к физической невозможности события. Поэтому использовать ошибку предсказания как надёжный индикатор физического сюрприза без дополнительной проверки нельзя.'}, 'en': {'title': 'Prediction Error Is Not the Same as Physical Surprise', 'desc': 'This study tests whether video world models’ prediction errors reliably indicate physical surprise, using benchmarks and simulated videos. Frozen representations encode appearance strongly, while V-JEPA2 contains some information about whether events are physically possible or impossible. In deeper layers, appearance differences become less prominent relative to video differences, but changes in appearance still affect prediction errors substantially. Because errors can be higher for possible events than impossible ones, prediction error alone is not a dependable measure of physical surprise.'}, 'zh': {'title': '预测误差不等于物理意外', 'desc': '本文评估冻结的视频表征，检验模型预测误差能否可靠表示物理意外。研究发现，表征容易编码外观信息，而 V-JEPA2 也包含一些关于事件物理可能性的信息，但物理差异与外观差异在不同层中的组织方式并不相同。对动作条件模型而言，错误动作会提高预测误差，但改变外观也可能显著影响误差；有时重复单帧或改变视频颜色还会造成与直觉相反的结果。模拟实验进一步表明，不可能事件的误差可能低于可能事件，因此模型虽能表征物理信息，原生预测误差却不能可靠地衡量物理意外。'}}}, {'id': 'https://huggingface.co/papers/2611.01460', 'title': 'Can Large Language Model Agents Learn by Watching Tutorial Videos?', 'url': 'https://huggingface.co/papers/2611.01460', 'abstract': "Abstract Tutorial Agentic Learning enables LLM agents to continuously learn from instructional videos without parameter updates by building a structured tutorialbook memory and retrieving via reasoning-linked table-of-contents trees.  Generated by thinkingmachines/Inkling-Small Humans continuously acquire knowledge from carefully crafted materials such as books and tutorial videos, carrying that understanding into future tasks. Millions of such instructional videos are uploaded online every day, yet LLM agents remain unable to exploit this ever-expanding wealth of human teaching. Their capabilities are frozen after training, while parameter updates at scale remain prohibitively expensive. This raises the central question: can LLM agents learn from this vast instructional resource without parameter updates? We introduce Tutorial Agentic Learning (TAL), a nonparametric continual-learning paradigm that consolidates tutorial videos into a persistent, structured tutorialbook memory through a two-stage adversarial process that harvests hard, video-grounded questions and uses them to refine the memory. At inference time, TAL retrieves through a Table-of-Contents (TOC) tree, tying retrieval directly to the model's reasoning rather than to embedding similarity. To study this setting, we introduce VidLearn, a multimodal QA benchmark built from 72 chess tutorial videos spanning 12 openings. On VidLearn, TAL outperforms all evaluated baselines and improves monotonically as more videos are consumed, achieving up to 113% and 91% relative gains over the corresponding vanilla MLLMs on the training and test splits, respectively. In actual gameplay, TAL reaches a stronger opening-phase position than its vanilla counterpart in 69% of head-to-head games. Evaluation in a second domain further demonstrates the generality of TAL. Together, these results highlight instructional videos as a scalable resource for parameter-update-free agent continual learning.", 'score': 1, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'd995d979f68fd657', 'authors': ['Haoyu Zhao', 'Zafeirios Fountas', 'Jun Wang'], 'affiliations': ['University College London'], 'pdf_title_img': 'assets/pdf/title_img/2611.01460.jpg', 'data': {'categories': ['#video', '#games', '#rag', '#long_context', '#multimodal', '#transfer_learning', '#agents', '#dataset', '#benchmark'], 'emoji': '🎓', 'ru': {'title': 'Агенты учатся на видеоуроках без переобучения модели', 'desc': 'Статья представляет Tutorial Agentic Learning (TAL) — непараметрический подход к continual learning, при котором LLM-агенты учатся на обучающих видео без обновления весов модели. Видео консолидируются в структурированную память tutorialbook через двухэтапный адверсариальный процесс, который генерирует сложные вопросы и уточняет память. На этапе инференса поиск выполняется по дереву Table-of-Contents, связанному с логикой рассуждений модели, а не с embedding similarity. На новом бенчмарке VidLearn по шахматным видео TAL превосходит базовые MLLM до 113% и показывает стабильный рост качества по мере изучения новых видео.'}, 'en': {'title': 'Learn from Every Tutorial—Without Updating the Model', 'desc': 'Tutorial Agentic Learning (TAL) lets large language model agents learn from tutorial videos without updating their model parameters. It builds a persistent memory called a tutorialbook, refined by generating challenging questions grounded in the videos. At inference time, the agent uses a table-of-contents tree to retrieve information in a way linked to its reasoning, rather than relying on embedding similarity. On chess and another domain, TAL outperforms evaluated baselines, and its performance improves as it processes more videos.'}, 'zh': {'title': '不更新参数，也能从教程视频中持续学习', 'desc': '本文提出教程智能体学习（TAL），让大语言模型智能体无需更新模型参数，也能从教学视频中持续学习。TAL 将视频内容整理成持久、结构化的教程记忆，并通过生成难题、再用这些问题改进记忆的两阶段过程来提升内容质量。回答问题时，TAL 沿着目录树检索信息，并将检索过程与模型推理相结合，而不是只依赖向量相似度。在包含国际象棋教学视频的基准测试中，TAL 优于对比方法，而且随着学习的视频增多表现持续提升，也在实际对弈和另一领域的测试中展现出效果。'}}}, {'id': 'https://huggingface.co/papers/2611.00053', 'title': 'SIMIT: Self-Improving Vision-Language Models via Imagination at Test-Time', 'url': 'https://huggingface.co/papers/2611.00053', 'abstract': "Abstract SIMIT is a test-time framework that lets vision-language models generate their own practice data to improve answers on unlabeled queries without external annotations.  Generated by thinkingmachines/Inkling-Small We introduce SIMIT, a test-time self-improvement framework in which a vision-language model creates its own query-specific training data before answering an unlabeled test query. Our goal is to improve performance on a given target test set without annotations or external models. To pursue this goal, some test-time methods improve answers through longer reasoning or repeated sampling but leave the model unchanged. Others update the model using rewards based on majority agreement among multiple candidate answers or the model's own judgments of correctness, but such rewards can reinforce existing mistakes. SIMIT instead imagines similar problems whose solutions it controls: a model need not correctly solve the target query to construct useful practice examples. It synthesizes diverse (question, answer, image) triplets by specifying each answer before realizing its image. To support diverse multimodal tasks, SIMIT combines native image generation with an extensible skill library for structured visuals, including documents, charts, and diagrams. Within this pipeline, multi-stage verification checks that images support their assigned answers, while difficulty filtering retains informative examples. Adaptive budgeting further targets this practice by allocating more samples to queries the model is less confident in answering. The resulting data can improve the model in-context (SIMIT-ICL) or in-weight (SIMIT-FT). Across 17 diverse benchmarks, SIMIT outperforms existing self-improvement methods. Its best configuration achieves a +7.20% mean relative gain over BAGEL-7B, while training-free SIMIT-ICL achieves +6.98%.", 'score': 1, 'issue_id': 3493, 'pub_date': '2026-10-11', 'pub_date_card': {'ru': '11 октября', 'en': 'October 11', 'zh': '10月11日'}, 'hash': '1bebf1b585259f34', 'authors': ['Mehmet Onurcan Kaya', 'Desmond Elliott', 'Dim P. Papadopoulos'], 'affiliations': ['Pioneer Center for AI', 'Technical University of Denmark', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2611.00053.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#synthetic', '#data', '#training', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Модель учится на примерах, которые создаёт сама, прямо во время теста', 'desc': 'SIMIT — это фреймворк для self-improvement на этапе тестирования, в котором vision-language model сама генерирует обучающие примеры под конкретный запрос без разметки и внешних моделей. Вместо того чтобы полагаться на majority voting или собственные оценки, которые могут закреплять ошибки, модель задаёт ответ заранее и затем синтезирует соответствующее изображение и вопрос как тройку (question, answer, image). Для разнообразия используются native image generation и библиотека навыков для структурированных визуалов, а multi-stage verification и difficulty filtering отбирают корректные и информативные примеры. Адаптивное распределение бюджета направляет больше сэмплов на запросы, в которых модель менее уверена, а полученные данные используются либо in-context (SIMIT-ICL), либо для fine-tuning весов (SIMIT-FT), давая в среднем +7.20% относительного прироста над BAGEL-7B на 17 бенчмарках.'}, 'en': {'title': 'Make Your Own Practice to Answer Better', 'desc': 'SIMIT helps a vision-language model improve its answers to unlabeled test questions by creating its own practice examples. It first chooses an answer, then generates a matching image and question, and checks that the image supports the answer. It filters for useful examples and gives more practice to questions the model is less confident about; the examples can be used in-context or to fine-tune the model. Across 17 benchmarks, SIMIT outperforms other self-improvement methods, with its training-free version achieving a 6.98% mean relative gain over BAGEL-7B.'}, 'zh': {'title': '先为答案造练习，再让模型答得更好', 'desc': 'SIMIT 是一种测试时自我改进框架，让视觉语言模型针对未标注的测试问题，先自行生成练习数据再作答。它先设定问题的答案，再生成相匹配的图像，并通过多阶段验证和难度筛选，确保练习样本有用。框架还会根据模型的信心分配生成预算，并可通过上下文学习或微调来利用这些数据。实验显示，SIMIT 在 17 个基准测试上优于现有自我改进方法，最佳配置相对 BAGEL-7B 的平均提升为 7.20%。'}}}, {'id': 'https://huggingface.co/papers/2611.03393', 'title': 'TaoMate-FVSR:Audio-Guided Facial Video Restoration', 'url': 'https://huggingface.co/papers/2611.03393', 'abstract': 'Abstract An audio-guided framework restores facial details in AI-generated videos by combining reference-guided flow modeling with audio synchronization to resolve lip and dental ambiguity.  Generated by thinkingmachines/Inkling-Small AI-generated videos often depict people within detailed scenes while leaving their small facial regions poorly resolved. Visual super-resolution can sharpen these regions without resolving whether the recovered lips and teeth agree with the spoken audio. We present an audio-guided facial video restoration framework that addresses this ambiguity within a reference-guided video flow model. Source--noise mixing initializes reconstruction from a partially preserved observation, and structured reference injection separates appearance anchors from continuous motion context. Training combines restoration of degraded images and videos with correction of degraded dubbed sources under target audio. Appearance and synchronization supervision allow the model to recover facial detail and support visual dubbing when the audio is replaced. On talking-head restoration benchmarks, our method achieves the best paired perceptual similarity and synchronization scores among the compared restoration methods. Component comparisons examine audio conditioning, the reconstruction formulation, and reference injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage. injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage.', 'score': 0, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'e53e4fbc6fc881bb', 'authors': ['Xinyang Li', 'Zeran Xu', 'Qijun Gan', 'Chenwei Zhang', 'Meiguang Jin', 'Junfeng Ma'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.03393.jpg', 'data': {'categories': ['#video', '#multimodal', '#cv', '#synthetic', '#training', '#diffusion'], 'emoji': '🎙️', 'ru': {'title': 'Точные губы и зубы: восстановление лиц в AI-видео под звук', 'desc': 'Статья представляет аудио-управляемую систему восстановления лиц в видео, сгенерированных ИИ, где мелкие детали лица (губы, зубы) часто искажены. Метод основан на reference-guided video flow model, который использует смешивание источника и шума для инициализации реконструкции и структурированную инъекцию референсных изображений для разделения якорей внешнего вида и непрерывного контекста движения. Обучение сочетает восстановление деградированных изображений и видео с коррекцией дубляжа под целевое аудио, а supervision по внешнему виду и синхронизации позволяет согласовывать движения губ с речью. Метод показывает лучшие результаты по метрикам perceptual similarity и синхронизации среди сравниваемых подходов на бенчмарках восстановления говорящих голов.'}, 'en': {'title': 'Sharper Faces, Synchronized Speech', 'desc': 'This paper presents a method for restoring facial details in AI-generated videos while keeping lip movements and teeth consistent with the audio. It uses a reference-guided video flow model, combining appearance references with motion information and starting reconstruction from a partly preserved image. The model is trained on degraded images and videos, including dubbed videos that must be matched to target audio. Tests show improved visual similarity and audio-video synchronization compared with the restoration methods evaluated.'}, 'zh': {'title': '让人脸细节清晰，让嘴型与声音同步', 'desc': '这篇论文提出一种音频引导的人脸视频修复框架，用于改善 AI 生成视频中嘴唇、牙齿等细节模糊的问题。它在参考引导的视频流模型中结合音频同步信息，让修复后的人脸细节既清晰，也与语音内容相符。模型通过源图像与噪声混合来初始化重建，并分别利用外观参考和连续运动信息来引导生成。实验显示，该方法在说话人视频修复基准上取得了较好的感知相似度和音画同步效果，也能支持替换音频后的视觉配音。'}}}, {'id': 'https://huggingface.co/papers/2611.00074', 'title': 'When Morphs Look Better: Face Image Quality as a Training-Free Signal for Morphing Attack Detection', 'url': 'https://huggingface.co/papers/2611.00074', 'abstract': 'Abstract Face image quality assessment methods vary widely in detecting diffusion-based and other morphing attacks, with performance depending heavily on attack type and dataset, and high quality scores for morphs often indicate poor detection.  Generated by thinkingmachines/Inkling-Small Face image quality assessment (FIQA) estimates the utility of a face image for automated face recognition and has been proposed as a morphing attack detection (MAD) signal that requires no morph-specific training. We evaluate 17 FIQA methods from all current FIQA categories on 20 morphing attack sets from two datasets, FRLL and FEI, including five diffusion-based attack sets. Each quality score is used directly as a MAD decision score. Unlike prior work, which inverted a quality measure when this lowered its error, we fix the score direction of each method in advance from its definition, so that cases in which morphs receive higher quality than bona fide samples remain visible. On FRLL, DifFIQA(R) achieves a mean D-EER of 11.42%, and together with CLIB-FIQA and eDifFIQA(L) clearly outperforms all other FIQA methods. A strong separation of bona fide and morph scores does not imply good detection performance: on the diffusion-based attacks, up to 11 of 17 methods assign higher quality to morphs than to bona fide samples, and the largest reversed separation in the study coincides with the worst detection result of the study. Performance also depends strongly on the attack: GraFIQs(L), the best detector of DCMorph and Arc2Morph on FRLL, performs poorly on the landmark-based and GAN-based attacks. On FEI, the lowest mean D-EER is 39.75%, and a threshold set on the bona fide data of one dataset does not transfer to the other.', 'score': 0, 'issue_id': 3493, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '58f6095975714f57', 'authors': ['Hao Peng', 'Fu Bo', 'Mahmoud Elshirbeny', 'Guray Ozgur'], 'affiliations': ['Fraunhofer Institute for Computer Graphics Research IGD, Darmstadt, Germany', 'TU Darmstadt, Darmstadt, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2611.00074.jpg', 'data': {'categories': ['#security', '#cv', '#benchmark'], 'emoji': '🎭', 'ru': {'title': 'Высокое качество лица не всегда означает подлинность: FIQA ненадёжен для детекции морфинг-атак', 'desc': 'В статье исследуется, можно ли использовать оценку качества лица (FIQA) как сигнал для обнаружения морфинг-атак без обучения на морфах. Авторы тестируют 17 методов FIQA на 20 наборах атак из датасетов FRLL и FEI, включая пять диффузионных атак, и используют оценки качества напрямую как решающий скор. Направление оценки каждого метода фиксируется заранее по его определению, поэтому случаи, когда морфы получают более высокое качество, чем подлинные образцы, остаются видимыми. Результаты показывают, что сильное разделение подлинных образцов и морфов не гарантирует хорошего качества детекции, а эффективность сильно зависит от типа атаки и датасета.'}, 'en': {'title': 'Face quality scores can reveal morphs—but not reliably', 'desc': 'The paper tests whether face image quality assessment (FIQA) methods can detect face morphing attacks without training specifically on morphs. It evaluates 17 methods across 20 attack sets from the FRLL and FEI datasets, using each quality score directly as a morph attack detection (MAD) score and fixing its direction in advance. Detection performance varies greatly by method, dataset, and attack type; several methods even score diffusion-generated morphs as higher quality than genuine faces. The results show that strong score separation alone does not guarantee good detection, and thresholds do not reliably transfer between datasets.'}, 'zh': {'title': '质量分数不等于检测能力：人脸变形攻击检测须经多攻击、多数据集验证', 'desc': '人脸图像质量评估（FIQA）用于衡量人脸图像对自动人脸识别的适用性，也可作为无需针对变形攻击训练的检测信号。研究在 FRLL 和 FEI 两个数据集的 20 种攻击集上评估了 17 种 FIQA 方法，并按照各方法的定义预先固定质量分数的方向。FRLL 上表现最好的 DifFIQA(R) 平均 D-EER 为 11.42%，但扩散攻击常使多种方法给变形人脸打出高于真实人脸的质量分数，且质量分数区分度高并不代表检测效果好。检测性能会随攻击类型和数据集显著变化：FEI 上最低平均 D-EER 为 39.75%，在一个数据集真实样本上设定的阈值也无法直接迁移到另一个数据集。'}}}, {'id': 'https://huggingface.co/papers/2611.03219', 'title': 'Can Coding Agents Sustain Continual Evolution without Forgetting?', 'url': 'https://huggingface.co/papers/2611.03219', 'abstract': "Abstract Empirical study shows continual harness self-evolution across software engineering tasks causes severe catastrophic forgetting, with performance on earlier datasets dropping sharply after later evolution.  Generated by thinkingmachines/Inkling-Small Recently, harness self-evolution has emerged as an important paradigm for improving agent performance. Prior studies show that evolving the agent harness can effectively enhance agent capabilities without modifying the foundation model's parameters. We find that existing approaches largely study agent evolution on a single task. In practice, coding agents may need to handle multiple task types over time. Whether an agent harness can continuously evolve across multiple tasks without suffering from catastrophic forgetting remains an important open question.   In this paper, we investigate this open question through a comprehensive empirical study of continual harness self-evolution. We organize three software engineering task datasets into six different evolution directions and apply two representative harness evolution methods to perform continual evolution along these directions. Our experimental results show that evolution on a subsequent dataset can substantially undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731, Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However, after further evolution on FeatureBench, its performance on SWE-Bench drops to 32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based on our experimental findings, we identify several insights, providing directions for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.", 'score': 0, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'd15f0e2016fbc0f6', 'authors': ['Shangziqi Zhao', 'Yitong Zhang', 'Jia Li'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.03219.jpg', 'data': {'categories': ['#transfer_learning', '#agents', '#survey', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Агент, который учится новому, забывает старое', 'desc': 'В статье исследуется непрерывная самоэволюция agent harness, то есть обвязки LLM-агента, без изменения параметров foundation model. Авторы показывают, что при последовательной адаптации к разным задачам разработки ПО (SWE-Bench, FeatureBench и др.) возникает серьёзный catastrophic forgetting: качество на ранее освоенных датасетах резко падает. Например, результат Meta-Harness на SWE-Bench снижается с 94.0% до 32.0% после пяти раундов эволюции на FeatureBench. На основе эмпирических экспериментов авторы формулируют выводы, которые задают направления для будущих исследований непрерывного самообучения агентов.'}, 'en': {'title': 'Improving on New Tasks Shouldn’t Mean Forgetting Old Ones', 'desc': 'This paper studies whether an agent harness can keep improving across different software engineering tasks without forgetting earlier ones. The researchers test two harness-evolution methods on three datasets using six task-evolution sequences. They find that evolving the harness on a new dataset can sharply reduce its performance on previously learned datasets, a problem known as catastrophic forgetting. For example, after improving SWE-Bench performance to 94%, further evolution on FeatureBench lowers it to 32%.'}, 'zh': {'title': '智能体框架持续进化，别让新技能抹去旧本领', 'desc': '本文通过实证研究探讨智能体框架在多个软件工程任务上持续自我演化时，是否会发生灾难性遗忘。研究使用三个任务数据集，设计六种演化顺序，并测试两种代表性的框架演化方法。结果显示，在新数据集上继续演化可能显著损害智能体在先前任务上的表现；例如，SWE-Bench 成绩从 94.0% 降至 32.0%。研究还总结了持续演化实验中的关键发现，为减少遗忘、改进智能体框架提供方向。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (16)', '#agi (8)', '#alignment (5)', '#architecture (6)', '#audio', '#benchmark (23)', '#cv (4)', '#data (5)', '#dataset (7)', '#diffusion (4)', '#ethics (2)', '#games (3)', '#graphs (1)', '#hallucinations', '#healthcare', '#inference (6)', '#interpretability (5)', '#leakage', '#long_context (2)', '#low_resource (1)', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (12)', '#open_source (3)', '#optimization (14)', '#plp (2)', '#rag (2)', '#reasoning (4)', '#rl (2)', '#rlhf (1)', '#robotics (3)', '#science (1)', '#security (1)', '#small_models (5)', '#story_generation', '#survey (3)', '#synthetic (6)', '#training (15)', '#transfer_learning (3)', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
