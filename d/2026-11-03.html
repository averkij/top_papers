    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.42128', 'title': 'DecisionRank: On-Policy Distillation for Decision-Model Rerankers', 'url': 'https://huggingface.co/papers/2610.42128', 'abstract': "Abstract DecisionRank uses item-space on-policy distillation to transfer ranking knowledge from generative teachers to efficient decision models, achieving state-of-the-art retrieval performance with significantly faster inference.  Generated by thinkingmachines/Inkling-Small Decision models target structured tasks by directly predicting choices or scores, avoiding autoregressive decoding latency. However, transferring a generative LLM's ranking knowledge to a decision model remains challenging: the teacher expresses preferences through a ranked list of document ID sequences, while the student determines the ranking using scores from the first-token position. To bridge this gap, we introduce DecisionRank, a decision model trained through item-space on-policy distillation (OPD). Item-space OPD constructs the student's rollout by sorting its document scores into a ranked sequence. A generative teacher takes the resulting ranking list as inputs and provides conditional feedback to directly supervise those scores. Combined with offline ranking supervision, DecisionRank achieves state-of-the-art performance on both general and reasoning-intensive retrieval benchmarks such as TREC DL, BEIR, and BRIGHT. Across four benchmarks, item-space OPD consistently outperforms alternative training objectives. Even at 1.7B parameters, DecisionRank surpasses its 27B generative teacher on TREC DL19--23. At 8B, it outperforms its generative listwise counterpart while running 24.5times faster on TREC DL and 16.7times faster on BRIGHT.", 'score': 4, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '957b962c93a693af', 'authors': ['Yanran Wu', 'Dian Yu', 'Chongyang Bai', 'Jieyi Zhang', 'Rui Liu', 'Tianyi Chen', 'Shike Mei', 'Hang Cui', 'Frank Shyu', 'Sandeep Pandey', 'Luke Simon', 'Chunwei Liu', 'Xi Liu'], 'affiliations': ['Meta', 'Purdue University'], 'pdf_title_img': 'assets/pdf/title_img/2610.42128.jpg', 'data': {'categories': ['#training', '#architecture', '#small_models', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Быстрое ранжирование без потери качества: знания LLM в компактной decision-модели', 'desc': 'В статье представлен DecisionRank, decision-модель для ранжирования, которая получает знания от генеративного учителя (LLM) с помощью item-space on-policy distillation. Модель сортирует собственные оценки документов в ранжированный список, по которому учитель даёт условную обратную связь, напрямую оптимизирующую эти оценки. Метод сочетается с офлайн-supervision и достигает state-of-the-art результатов на TREC DL, BEIR и BRIGHT. Даже модель с 1.7B параметрами превосходит учителя на 27B, а версия на 8B работает в десятки раз быстрее генеративного аналога.'}, 'en': {'title': 'Rank like a generative model, decide at the speed of a scorer', 'desc': 'DecisionRank transfers ranking knowledge from a generative language model to a faster decision model. The student sorts documents using its scores, and the teacher evaluates that ranked list to provide feedback that trains those scores. This item-space on-policy distillation is combined with offline ranking supervision. The resulting model performs strongly on retrieval benchmarks and can be much faster than generative ranking models.'}, 'zh': {'title': '让决策模型学会排序：以更快推理承接生成式教师的知识', 'desc': 'DecisionRank 将生成式教师模型的排序知识迁移到高效的决策模型中，后者直接预测文档分数，避免逐词生成带来的延迟。它采用项目空间在线策略蒸馏：先根据学生模型的文档分数生成排序列表，再让教师模型针对该列表提供反馈，以此直接监督学生的分数。结合离线排序监督后，DecisionRank 在 TREC DL、BEIR 和 BRIGHT 等检索基准上取得了领先表现，且这种蒸馏目标在四个基准上均优于其他训练目标。即使只有 1.7B 参数，它在 TREC DL19–23 上也超过了 27B 的生成式教师；8B 版本则比生成式列表排序模型快得多，同时保持更强的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.37826', 'title': 'DeFT-RAG: Decomposing Multi-Hop Questions into Self-Contained Sub-Questions with Reusable Answers', 'url': 'https://huggingface.co/papers/2610.37826', 'abstract': 'Abstract DeFT-RAG improves multi-hop question answering by generating self-contained sub-questions sequentially, offloading reasoning to rule-based updates and a lightweight decision model, and caching answers to reduce LLM usage.  Generated by thinkingmachines/Inkling-Small Retrieval-augmented generation (RAG) lets a large language model (LLM) answer questions by retrieving relevant passages from a large corpus. However, RAG struggles with multi-hop questions, which require chaining facts spread across several documents through intermediate entities that the question never mentions. Graph-based RAG methods retrieve once from the entities a question names and so rarely recover the full evidence chain. Iterative RAG methods recover it step by step, but their accuracy is limited by the many tasks they ask the LLM to perform, such as planning the sub-questions, deciding their dependencies, rewriting them as answers arrive, and keeping track of what is known. We propose DeFT-RAG, a RAG framework built on three components. First, DeFT-RAG generates one self-contained sub-question at a time from the original question and the sub-questions answered so far with their answers (QA pairs). Each sub-question names every entity it asks about, which removes the need to plan, track dependencies or rewrite, and lets the LLM focus on a single fine-grained task at a time. Second, DeFT-RAG moves the remaining LLM work outside the LLM: rule-based updates to a QA table that keeps track of what is known, and yes/no decisions made by a fine-tuned lightweight decision model. Third, DeFT-RAG caches the QA pairs and reuses an answer when a later question asks a sub-question with the same meaning. On MuSiQue, 2WikiMultiHopQA and HotpotQA, DeFT-RAG achieves the best accuracy among thirteen baselines with both gpt-4o-mini and Qwen3.6 as the backbone, while giving the LLM fewer input tokens than any other iterative method. With a QA cache shared across 1,000 MuSiQue questions, 23.1% of sub-questions are answered from the cache, which reduces LLM calls by 12.9% without lowering accuracy.', 'score': 2, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '85f1b477f47fe4d8', 'authors': ['Dingyi Kang', 'Bingzhe Li'], 'affiliations': ['University of Texas at Dallas'], 'pdf_title_img': 'assets/pdf/title_img/2610.37826.jpg', 'data': {'categories': ['#rag', '#agents', '#reasoning', '#long_context'], 'emoji': '🧩', 'ru': {'title': 'Меньше работы для LLM — точнее ответы на сложные вопросы', 'desc': 'Статья представляет DeFT-RAG — фреймворк для многошаговых вопросов (multi-hop QA), где ответ требует цепочки фактов из нескольких документов. Модель генерирует самодостаточные подвопросы по одному за раз, а часть работы, такую как учёт known-фактов и принятие решений, переносит на rule-based обновления таблицы QA-пар и облегчённую дообученную decision model. Дополнительно используется кэш QA-пар, позволяющий переиспользовать ответы на семантически похожие подвопросы и сокращать количество вызовов LLM. На бенчмарках MuSiQue, 2WikiMultiHopQA и HotpotQA метод превосходит тринадцать baseline-моделей по точности при меньшем числе входных токенов.'}, 'en': {'title': 'Break Down the Question, Cache the Answers', 'desc': 'DeFT-RAG is a retrieval-augmented generation (RAG) framework designed to answer multi-hop questions that require evidence from several documents. It generates self-contained sub-questions one at a time, using earlier question-answer pairs to guide each step. Rule-based updates track known information, while a lightweight decision model handles yes-or-no decisions, reducing the work assigned to the large language model (LLM). On three benchmarks, DeFT-RAG outperforms thirteen baselines, and caching previously answered sub-questions reduces LLM calls without lowering accuracy.'}, 'zh': {'title': '逐步拆解多跳问题，让检索更准、调用更省', 'desc': 'DeFT-RAG 是一种用于多跳问答的检索增强生成（RAG）框架，能够逐步生成包含所需实体的独立子问题。它用规则更新问答表来记录已知信息，并由轻量级决策模型作出是或否判断，从而减少对大语言模型（LLM）的依赖。它还会缓存问答对，在遇到含义相同的子问题时重复利用已有答案。实验显示，该方法在多个基准测试上准确率优于对比方法；共享缓存还能减少 LLM 调用而不降低准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.00172', 'title': 'From Fragmentation to Fusion: A Survey and Roadmap for Omnimodal Embeddings', 'url': 'https://huggingface.co/papers/2611.00172', 'abstract': 'Abstract Embedding research across modalities is converging toward shared principles via contrastive learning and Transformers, and a framework of coverage, comparability, and compositionality is proposed to unify it through transformation, alignment, and joint embedding.  Generated by thinkingmachines/Inkling-Small Embedding models underpin virtually every modern AI system, from search engines to recommendation systems. Despite shared mathematical foundations, research on embedding models remains fragmented by modality: the communities develop largely in isolation, seldom exchanging insights. We argue that this fragmentation obscures a deeper convergence. Driven by contrastive learning, Transformer architectures, and a granularity shift, embedding research across modalities is converging toward a common set of principles, even as modality-specific challenges remain underexplored. To reason across this convergence without conflating it, we propose a framework of three progressively harder capabilities: coverage, comparability, and compositionality. Three paths toward unification satisfy these in turn: transformation broadens coverage, alignment enables comparability, and joint embedding, the terminus we advocate, aims at compositionality. This position paper traces the resulting evolution, providing the first unified, cross-cutting treatment of omnimodal embedding research.', 'score': 1, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'f7264f5c0dd3dcca', 'authors': ['Ziyin Zhang', 'Yuyu Guo', 'Ying Zhang', 'Siqiao Xue', 'Zihan Liao', 'Jin Qin', 'Wenjie Yang', 'Siyuan Yang', 'Shijie Li', 'Cheng Chen', 'Hao Wu', 'Zhaoyang Zhu', 'Ruipeng Li', 'Zhaokun Jiang', 'Lei Lei', 'Rui Wang', 'Hang Yu', 'Rui Wang'], 'affiliations': ['Ant Group', 'Australian National University', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.00172.jpg', 'data': {'categories': ['#multimodal', '#survey'], 'emoji': '🧩', 'ru': {'title': 'Единые эмбеддинги для всех модальностей: от разрозненности к общему пространству смыслов', 'desc': 'Статья утверждает, что исследования эмбеддингов для разных модальностей (текст, изображения, аудио и др.) разрозненны, но на самом деле сходятся к общим принципам благодаря contrastive learning, архитектурам Transformer и сдвигу к более тонкой гранулярности. Авторы предлагают три последовательных возможности: coverage, comparability и compositionality. Пути к объединению: transformation расширяет покрытие, alignment обеспечивает сравнимость, а joint embedding нацелен на compositionality. Работа представляет первый единый обзор omnimodal embedding исследований.'}, 'en': {'title': 'From Separate Modalities to Composable Shared Embeddings', 'desc': 'The paper argues that embedding research for different modalities, such as text, images, and audio, is converging around contrastive learning and Transformer architectures. It proposes three capabilities for comparing progress: coverage, which represents more kinds of data; comparability, which aligns representations across modalities; and compositionality, which combines them meaningfully. The authors describe transformation and alignment as steps toward these capabilities, with joint embedding as the goal. This framework offers a unified way to study multimodal embedding while recognizing that each modality still has distinct challenges.'}, 'zh': {'title': '从变换到联合嵌入，让不同模态的表示真正组合起来', 'desc': '嵌入模型是搜索、推荐等现代人工智能系统的基础，但不同模态的研究长期较为分散。论文指出，对比学习、Transformer 架构和粒度变化正推动各模态的嵌入研究走向共同原则。作者提出覆盖性、可比较性和组合性三个逐步提升的能力，并分别对应变换、对齐和联合嵌入三条统一路径。论文主张以联合嵌入为目标，让不同模态的表示不仅能够相互比较，还能组合起来表达信息。'}}}, {'id': 'https://huggingface.co/papers/2610.40293', 'title': 'MAServeBench: Benchmarking Multi-Agent LLM Serving Systems with Hierarchical Collaboration Workloads', 'url': 'https://huggingface.co/papers/2610.40293', 'abstract': 'Abstract MAServeBench evaluates LLM serving and hardware by modeling multi-agent collaboration as a configurable workload dimension with reproducible dependency traces.  Generated by thinkingmachines/Inkling-Small Large language model (LLM)-based multi-agent systems (MAS) coordinate specialized agents to solve complex tasks, turning each user request into interdependent model and tool operations. Unlike independent requests, these operations become ready at different times and consume evolving context as agents coordinate and exchange results. This creates changing patterns of concurrency, computation, and memory demand that can expose different bottlenecks in LLM serving hardware. Yet benchmarking these effects requires capturing the collaboration rules that generate serving workloads, beyond the requests observed during execution. We present MAServeBench, a benchmark that treats multi-agent collaboration as a configurable dimension of serving workloads for LLM serving and hardware evaluation. Its composable stages capture how agents coordinate and exchange context in documented MAS workflows, enabling native executions to generate different workloads even when task inputs and tools remain unchanged. Hierarchical Semantic Traces preserve realized operations and dependencies for reproducible comparisons of legal release constraints at fixed work. Task-linked measurements connect these workloads to serving execution and GPU/NPU hardware behavior, revealing why serving efficiency does not always translate into timely task completion. The benchmark code is available at https://github.com/ShengxuanQiu/MAServeBench.', 'score': 1, 'issue_id': 3492, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '215a2d0afeb73405', 'authors': ['Shengxuan Qiu', 'Haochen Huang', 'Shuzhang Zhong', 'Zizhuo Fu', 'Zebin Yang', 'Meng Li'], 'affiliations': ['1'], 'pdf_title_img': 'assets/pdf/title_img/2610.40293.jpg', 'data': {'categories': ['#agents', '#benchmark', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Эффективность инференса не равна скорости решения задач мультиагентных LLM', 'desc': 'В статье представлен MAServeBench, новый бенчмарк для оценки систем инференса LLM и аппаратного обеспечения в сценариях мультиагентного взаимодействия. Авторы моделируют коллаборацию агентов как настраиваемое измерение нагрузки, которое порождает зависимые операции и меняющуюся конкурентность, память и вычисления. Для воспроизводимого сравнения используются Hierarchical Semantic Traces, сохраняющие реальные операции и зависимости между ними. Результаты показывают, что высокая эффективность serving не всегда означает своевременное выполнение задачи, что важно для оптимизации GPU/NPU.'}, 'en': {'title': 'Benchmark the collaboration behind multi-agent workloads', 'desc': 'MAServeBench benchmarks how multi-agent collaboration changes the workloads handled by large language model (LLM) serving systems. It represents agent coordination and context exchange as configurable stages, so the same tasks and tools can produce different patterns of operations and concurrency. Hierarchical Semantic Traces record operations and their dependencies to support reproducible comparisons at fixed amounts of work. By linking task completion to serving and GPU/NPU measurements, the benchmark helps explain why higher serving efficiency may not lead to faster completion of a task.'}, 'zh': {'title': '让多智能体协作负载可配置、可复现、可衡量', 'desc': '这篇论文提出 MAServeBench，用来评估大语言模型服务系统和硬件处理多智能体协作任务的表现。它把智能体之间的协作方式设计成可配置的工作负载维度，并通过可组合阶段描述智能体如何协调、交换上下文。层次化语义轨迹记录实际执行的操作及其依赖关系，从而支持在固定工作量下进行可复现的比较。将任务完成情况与服务执行及 GPU、NPU 硬件测量关联后，基准还能揭示为什么更高的服务效率不一定意味着任务能更快完成。'}}}, {'id': 'https://huggingface.co/papers/2610.38637', 'title': 'On-Policy Self-Distillation with Teacher Evolution', 'url': 'https://huggingface.co/papers/2610.38637', 'abstract': "Abstract Teacher-Evolution Self-Distillation improves on-policy self-distillation by continuously enhancing self-teaching reliability through reward-guided teacher optimization and adaptive down-weighting of unreliable samples.  Generated by thinkingmachines/Inkling-Small On-Policy Self-Distillation (OPSD), which aligns a student model's token-level distribution with that of its self-teacher prompted by privileged context, has emerged as a promising direction to mitigate reward sparsity in sequence-level post-training paradigms. However, OPSD often fails to achieve continuous performance gains during training. In this paper, we find that the model's limited self-teaching capability underlies this phenomenon by generating unreliable guidance on certain samples. To address this problem, we propose Teacher-Evolution Self-Distillation (TESD), which enables the self-teacher to generate rollouts and receive environmental feedback based on task correctness and context independence. First, using these rewards as training objectives, we perform teacher-oriented optimization to continuously enhance the model's self-teaching capability during distillation. Second, by estimating teacher guidance reliability from these rewards, we apply adaptive student-oriented optimization to down-weight samples with unreliable guidance. Extensive experiments across multiple datasets and model scales show that TESD consistently outperforms representative token-level and sequence-level methods, highlighting the necessity of improving supervision quality in OPSD.", 'score': 1, 'issue_id': 3492, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '6a8995ffaf8241ae', 'authors': ['Shufan Shen', 'Zhongni Hou', 'Chao Bi', 'Yufei Zhang', 'Guojun Yin', 'Shuhui Wang'], 'affiliations': ['Institute of Computing Technology, Chinese Academy of Sciences', 'Meituan', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.38637.jpg', 'data': {'categories': ['#training', '#alignment', '#optimization', '#rlhf'], 'emoji': '🎓', 'ru': {'title': 'Учитель, который учится сам: надежная супервизия для самодистилляции', 'desc': 'Статья посвящена улучшению On-Policy Self-Distillation (OPSD), где студенческая LLM выравнивает токенные распределения с собственным учителем, использующим привилегированный контекст. Авторы обнаружили, что ограниченная способность модели к самообучению порождает ненадежные сигналы супервизии на части примеров, из-за чего качество не растет стабильно. Предложенный метод TESD оптимизирует самого учителя с помощью наград за корректность и независимость от контекста, повышая надежность его подсказок. Затем адаптивно понижает веса примеров с ненадежной супервизией при оптимизации студента, что ведет к стабильно лучшим результатам на разных датасетах и масштабах моделей.'}, 'en': {'title': 'Improve the Teacher, Trust the Guidance', 'desc': 'On-policy self-distillation trains a model to match guidance from a self-teacher, but that guidance can be unreliable and limit progress. Teacher-Evolution Self-Distillation (TESD) lets the teacher generate answers and receive rewards for correctness and independence from privileged context. It uses these rewards to improve the teacher and to reduce the influence of examples where its guidance is unreliable. Experiments across datasets and model sizes show TESD outperforms several token-level and sequence-level training methods.'}, 'zh': {'title': '让教师不断进化，让可靠指导驱动学生学习', 'desc': '本文提出教师进化自蒸馏（TESD），旨在解决在线自蒸馏中教师有时会提供不可靠指导、训练效果难以持续提升的问题。方法让自教师生成回答，并根据任务正确性和对上下文的依赖程度获取环境反馈。研究利用这些奖励优化教师，逐步提升其自我教学能力。与此同时，方法会估计指导的可靠性，并降低不可靠样本对学生训练的影响；实验显示，TESD在多个数据集和模型规模上优于多种代表性方法。'}}}, {'id': 'https://huggingface.co/papers/2610.41296', 'title': 'Self-Improvement with Auxiliary Rewards: Learning from Verified Traces and Evaluating Transfer', 'url': 'https://huggingface.co/papers/2610.41296', 'abstract': 'Abstract Auxiliary trajectory preferences based on entropy and confidence metrics improve small language model self-improvement and transfer by distinguishing learning value among equally correct reasoning traces.  Generated by thinkingmachines/Inkling-Small Answer-level rewards cannot distinguish reasoning traces with equally correct outcomes. We study whether auxiliary trajectory preferences improve small-language-model self-improvement and transfer under limited supervision. We compare confidence-based (SC) and entropy-based metrics (UID-Conj.), which combines global entropy variation and local smoothness, through online reward augmentation and offline training on correct responses. Online experiments adapt Qwen3-1.7B on 30 AIME problems without reference answers; offline experiments use historical AIME problems. UID-Conj. improves the online macro-average across the adaptation benchmark and three transfer benchmarks by 2.08 percentage points over unmodified TTRL. The strongest evidence comes from offline weighted SFT: UID-Conj. exceeds uniform weighting on the same response pool by 1.93 points, with a paired prompt-bootstrap 95\\% CI of [0.44, 3.44]. Benefits are task-dependent: SC rewards judged trace quality and instruction following, while UID-Conj. rewards yield stronger training outcomes in several settings. We find that auxiliary preferences can expose learning value among equally correct traces not captured during inference time, motivating their evaluation through downstream gains.', 'score': 1, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '0cb34cadd2c80a85', 'authors': ['Minju Gwak', 'Alan Ritter'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.41296.jpg', 'data': {'categories': ['#training', '#optimization', '#benchmark', '#reasoning', '#small_models', '#transfer_learning'], 'emoji': '🧠', 'ru': {'title': 'Не все правильные решения одинаково полезны для обучения модели', 'desc': 'В статье исследуется, может ли дополнительная оценка траекторий рассуждений улучшить самообучение небольших языковых моделей (LLM) при ограниченном объёме разметки. Авторы сравнивают метрики на основе уверенности (SC) и энтропии (UID-Conj.), которые используются как дополнительные награды в онлайн-режиме (TTRL) и как веса в offline-обучении через weighted SFT. Эксперименты с Qwen3-1.7B на задачах AIME показывают, что UID-Conj. даёт прирост около 2 процентных пунктов по сравнению с базовым TTRL и превосходит равномерное взвешивание. Результаты говорят о том, что предпочтения по траекториям позволяют выявлять ценность обучения у одинаково правильных решений, которую не видит оценка только по ответу.'}, 'en': {'title': 'Look Beyond Correctness to Find Better Reasoning Traces', 'desc': 'Answer-level rewards treat all correct reasoning traces alike, even though some may be more useful for learning. This paper tests whether confidence-based and entropy-based preferences can help small language models improve and transfer with limited supervision. On AIME tasks, entropy-based UID-Conj. improved results over standard training, including a 1.93 percentage-point gain over uniform weighting in offline supervised fine-tuning. The findings suggest that auxiliary trajectory preferences can identify learning value that correctness alone misses, though the best preference depends on the task.'}, 'zh': {'title': '不止看答案对错，更要看推理轨迹的学习价值', 'desc': '答案级奖励无法区分最终答案同样正确、但学习价值不同的推理轨迹。研究比较了基于置信度的指标 SC 与基于熵的指标 UID-Conj.，后者结合整体熵变化和局部平滑度，用于改进小语言模型的自我提升与迁移。在线实验中，UID-Conj. 相比未修改的 TTRL，在适配任务和三个迁移基准上的宏平均成绩提高了 2.08 个百分点；离线加权监督微调中，它比均匀加权高 1.93 个百分点。不同指标的效果会随任务变化，但按下游表现评估辅助偏好，有助于发现正确推理轨迹中未被答案奖励捕捉的学习价值。'}}}, {'id': 'https://huggingface.co/papers/2610.39419', 'title': 'Diagnosing the Reference Gap: What Visual Scaffolds Can and Cannot Fix in Multimodal Reasoning', 'url': 'https://huggingface.co/papers/2610.39419', 'abstract': 'Abstract Multimodal language models fail at multi-step visual reasoning due to a reference gap rather than perception, and task-matched external references like numbering significantly improve accuracy without training.  Generated by thinkingmachines/Inkling-Small Multimodal large language models can recognize visual content yet struggle to reason reliably over it across multiple steps. In counting, a model may see all objects but lose track of which ones it has counted. We argue that such failures, commonly attributed to perception, reveal a reference gap: the failure to bind language to the relevant visual entities, regions, or locations. Motivated by the theory of visual routines, we test whether external references such as numbering can narrow this gap. We introduce ReGap-Bench, a paired benchmark of five visual reasoning tasks in which the scene, question, and answer are fixed and only the reference varies. Results show that task-matched references improve accuracy by up to 25\\%, while mismatched references provide little benefit or even hurt performance. These findings identify the reference gap as a bottleneck distinct from visual perception and show that constructing task-appropriate visual references can serve as a training-free visual skill for improving multimodal reasoning.', 'score': 0, 'issue_id': 3492, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '75f31590d2a81e52', 'authors': ['Guizhen Chen', 'Weiwen Xu', 'Wotao Yin', 'Anh Tuan Luu', 'Hou Pong Chan'], 'affiliations': ['DAMO Academy, Alibaba Group', 'Nanyang Technological University', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2610.39419.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#reasoning', '#dataset', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Не зрение, а ссылки: как нумерация объектов поднимает точность мультимодальных моделей без обучения', 'desc': 'Мультимодальные большие языковые модели (LLM) хорошо распознают визуальный контент, но плохо рассуждают над ним в несколько шагов: например, при подсчёте объектов они могут видеть все предметы, но терять учёт уже посчитанных. Авторы объясняют такие ошибки не проблемой восприятия, а «разрывом референсов» — неспособностью связать язык с нужными визуальными сущностями или областями. Для проверки введён бенчмарк ReGap-Bench из пяти задач, где меняется только референс (например, нумерация), и показано, что подходящие референсы повышают точность до 25%, а нерелевантные почти не помогают. Таким образом, построение задаче-ориентированных визуальных референсов работает как навык без дополнительного обучения модели.'}, 'en': {'title': 'Number the Scene, Narrow the Gap', 'desc': 'Multimodal language models can recognize objects but may lose track of which ones matter during multi-step reasoning. The paper calls this a reference gap: a difficulty linking words to the right visual objects, regions, or locations, rather than a failure of perception. On ReGap-Bench, adding task-matched references such as numbered objects improved accuracy by up to 25%, while unsuitable references often did not help. This suggests that carefully chosen visual references can improve reasoning without additional training.'}, 'zh': {'title': '用恰当视觉标记弥合指称差距，提升多模态推理', 'desc': '多模态语言模型能识别图像内容，但在多步推理中常会忘记自己正在处理哪些物体或位置。论文认为，问题不一定出在视觉感知，而在于语言描述与相关视觉实体之间缺少稳定对应，这被称为“指称差距”。研究者提出 ReGap-Bench，通过在相同图像和问题中改变视觉标记，比较不同指称方式对五类推理任务的影响。结果显示，与任务匹配的编号等外部标记无需训练即可将准确率提高最多 25%，而不匹配的标记效果有限，甚至可能降低准确率。'}}}, {'id': 'https://huggingface.co/papers/2610.27815', 'title': 'ProVe: Proposer-Verifier Decoding', 'url': 'https://huggingface.co/papers/2610.27815', 'abstract': "Abstract ProVe reverses speculative decoding roles by fine-tuning a large model to propose token blocks and verifying them with a smaller or identical model, achieving faster autoregressive generation with adjustable speed-accuracy tradeoffs.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates autoregressive (AR) language models by letting a small model draft tokens serially and a large model verify them in parallel. We reverse these roles. Starting from a standard AR checkpoint, we fine-tune the large model into a proposer that predicts a block of future tokens in a single forward pass, then use one additional forward pass to verify the proposed block. This gives ProVe, Proposer-Verifier decoding. The verifier can be a smaller AR model or the proposer itself; the latter gives ProVe-lossless, which reproduces the proposer's greedy AR decoding. Block proposals already provide substantial room for acceleration: with a block size of 16, the proposed block has an average AR-matching prefix of 6.6 tokens on GSM8K. Across six benchmarks with a 32B proposer, ProVe-lossless reaches 2.5x average AR throughput without training a separate draft head. With a small 3B verifier, ProVe reaches 2.7x average throughput at 2.6 accuracy points below AR on the six-task average, providing a controllable tradeoff between speed and accuracy.", 'score': 0, 'issue_id': 3492, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '13213a9cb37de189', 'pdf_title_img': 'assets/pdf/title_img/2610.27815.jpg', 'data': {'categories': ['#training', '#optimization', '#small_models', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Большая модель предлагает блоки токенов, а маленькая их проверяет: быстрее без потери качества', 'desc': 'Статья предлагает ProVe, метод ускорения авторегрессионной генерации, в котором роли спекулятивного декодирования меняются местами: большая модель донастраивается так, чтобы предсказывать целый блок будущих токенов за один проход. Затем дополнительный проход проверяет предложенный блок, при этом в роли верификатора может выступать меньшая LLM или сама большая модель. Вариант ProVe-lossless воспроизводит жадное AR-декодирование без потери качества и даёт ускорение около 2.5x на 32B-модели без обучения отдельной draft-головы. Использование компактного верификатора 3B даёт ускорение около 2.7x с небольшой потерей точности, что позволяет гибко регулировать баланс между скоростью и качеством.'}, 'en': {'title': 'Propose in Blocks, Verify for Speed', 'desc': 'ProVe speeds up autoregressive language model generation by reversing the usual roles in speculative decoding. A fine-tuned large model proposes a block of future tokens in one forward pass, and a verifier checks that block in another pass. When the proposer verifies itself, ProVe-lossless matches its greedy autoregressive output; using a smaller verifier can increase speed while slightly reducing accuracy. In reported tests, ProVe achieved up to 2.5× throughput without a separate draft head, while the smaller-verifier version reached 2.7× throughput with a modest accuracy tradeoff.'}, 'zh': {'title': '让大模型一次提议一组词元，加速生成并灵活权衡准确率', 'desc': 'ProVe 改变了传统推测解码的分工：微调大型语言模型，让它一次预测一组未来词元，再用验证模型检查这组预测。验证模型可以是较小的自回归模型，也可以是提议模型本身；后者能保持与提议模型贪心解码相同的结果。实验中，32B 提议模型配合自身验证时，平均生成速度达到普通自回归解码的 2.5 倍；配合 3B 验证模型时，速度达到 2.7 倍，但平均准确率低 2.6 个百分点。该方法因此能在生成速度与准确率之间提供可调节的取舍，而且不需要额外训练一个草稿头。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (2)', '#agi', '#alignment (1)', '#architecture (1)', '#audio', '#benchmark (4)', '#cv', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability (1)', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source', '#optimization (3)', '#plp', '#rag (1)', '#reasoning (3)', '#rl', '#rlhf (1)', '#robotics', '#science', '#security', '#small_models (3)', '#story_generation', '#survey (1)', '#synthetic', '#training (4)', '#transfer_learning (1)', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-03 03:13',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-03 03:13')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-03 03:13')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
