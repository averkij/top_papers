    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.24053', 'title': 'WeMM-Embedding: WeChat Multi-Modal Embedding Technical Report', 'url': 'https://huggingface.co/papers/2608.24053', 'abstract': 'Abstract WeMM-Embedding is a family of universal multimodal embedding models that align text, images, videos, and interleaved inputs in a shared space, achieving state-of-the-art retrieval and recommendation performance across public benchmarks and large-scale WeChat applications.  Generated by thinkingmachines/Inkling-Small Universal multimodal embeddings are becoming a core component of modern AI systems, enabling heterogeneous content to be represented in a shared space for applications such as retrieval, recommendation, classification, and agentic systems. In this report, we present WeMM-Embedding, a family of universal multimodal embedding models supporting text, images, videos, visual documents, and arbitrarily interleaved multimodal inputs with flexible output dimensions. The family comprises 2B, 4B, and 9B variants and is trained in two stages: a large-scale multimodal alignment stage, followed by a refinement stage using curated data, fine-grained relevance supervision, and cross-scale knowledge transfer. Across extensive evaluations, WeMM-Embedding achieves leading performance on multiple public benchmarks. Notably, the 2B variant already surpasses the previously leading 8B open-source baseline on MMEB-v2, while the 9B variant further achieves a new state-of-the-art overall score of 80.6. WeMM-Embedding also demonstrates strong practical performance across WeChat applications, with substantial gains on a 26-task in-house benchmark and consistent improvements across 14 online A/B tests. It has been deployed at scale across recommendation and search applications, including WeChat Channels, Official Accounts, Moments, and e-commerce services. We have released the model weights and code to facilitate future research at https://github.com/Tencent/WeMM-Embedding.', 'score': 35, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'a7c5b7cace71121c', 'authors': ['Junjie Zhou', 'Ke Mei', 'Lei Li', 'Tianyi Wang', 'Fengyun Rao', 'Jing Lyu'], 'affiliations': ['WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.24053.jpg', 'data': {'categories': ['#training', '#benchmark', '#multimodal', '#dataset'], 'emoji': '🌐', 'ru': {'title': 'Единое пространство для всех модальностей', 'desc': 'WeMM-Embedding представляет семейство универсальных мультимодальных моделей встраивания, которые объединяют текст, изображения, видео и чередующиеся входные данные в единое пространство представлений. Модели обучаются в два этапа: сначала выполняется крупномасштабное мультимодальное выравнивание, а затем тонкая настройка на отобранных данных с использованием перекрёстного трансфера знаний. Семейство включает три варианта размеров (2B, 4B и 9B параметров), достигая лучших результатов на публичных бенчмарках, включая MMEB-v2, и демонстрируя сильную практическую производительность в системах поиска и рекомендаций. Модель уже развёрнута в масштабе в приложениях WeChat для рекомендаций, поиска и электронной коммерции.'}, 'en': {'title': 'Unifying Multimodal Data for Superior AI Performance', 'desc': 'WeMM-Embedding is a set of advanced multimodal embedding models that effectively combine and align various types of data, such as text, images, and videos, into a unified representation space. This approach enhances the performance of retrieval and recommendation systems, achieving top results on public benchmarks and in real-world applications like WeChat. The models are designed with different sizes (2B, 4B, and 9B parameters) and undergo a two-stage training process to ensure high-quality alignment and relevance. The 9B variant has set a new record in performance metrics, demonstrating its effectiveness in diverse applications, including search and recommendation tasks.'}, 'zh': {'title': '多模态嵌入，智能推荐新纪元', 'desc': 'WeMM-Embedding是一种通用的多模态嵌入模型，能够将文本、图像、视频等不同类型的数据对齐到一个共享空间中。这种模型在公共基准测试和大型微信应用中实现了最先进的检索和推荐性能。WeMM-Embedding家族包括多个变体，经过两阶段训练，首先进行大规模的多模态对齐，然后使用精细的数据进行优化。该模型在多个评估中表现出色，尤其是在微信应用中，显著提升了推荐和搜索的效果。'}}}, {'id': 'https://huggingface.co/papers/2608.23041', 'title': 'AutoSaddler: Automatic Harness Optimization with Durable Updates from Agent Execution Traces', 'url': 'https://huggingface.co/papers/2608.23041', 'abstract': 'Abstract AutoSaddler automatically improves LLM agent harnesses via offline failure-driven optimization, boosting performance on long-horizon benchmarks.  Generated by thinkingmachines/Inkling-Small LLM agents remain unreliable on long-horizon tasks, where small local failures can compound over extended interactions and lead to overall task failure. Although external harnesses can substantially improve robustness, harness design remains a manual and expensive process that requires searching over a large space of prompts, tool configurations, and control logic. We propose AutoSaddler, an automatic harness optimization framework that formulates harness improvement as an offline learning problem and iteratively updates the harness using failure signals from mini-batches. AutoSaddler combines failure-trace diagnosis, structured patch generation that treats the harness as code, and validation-based update selection. Experiments on GAIA2, SWE-Bench Pro, and Terminal-Bench 2.0 show that AutoSaddler substantially improves agent performance over the corresponding base harnesses, achieving gains of 9.0, 9.6, and 10.0 percentage points, respectively. Ablation studies further suggest that effective harness optimization benefits from three ingredients: deep debugging rather than shallow reflection, targeted modifications rather than unconstrained editing, and generalization-aware selection rather than trajectory-specific repair. Together, these results suggest that automatic harness optimization is a promising path toward more performant and reliable agent systems.', 'score': 28, 'issue_id': 3163, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '980a6232f6d6bb4c', 'authors': ['Sungho Park', 'Wonjoong Kim', 'Rongyuan Tan', 'Jue Zhang', 'Wook-Shin Han', 'Pengfei Gao', 'Chanyoung Park', 'Yongqiang Yao', 'Rao Fu', 'Elsie Nallipogu', 'Qingwei Lin', 'Saravan Rajmohan', 'Dongmei Zhang'], 'affiliations': ['KAIST', 'Microsoft', 'POSTECH', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.23041.jpg', 'data': {'categories': [], 'emoji': '🔧', 'ru': {'title': 'Автоматическая оптимизация обёрток агентов через анализ сбоев', 'desc': 'AutoSaddler — это система автоматической оптимизации обёрток (harness) для LLM-агентов, которая использует сигналы о сбоях из автономных данных для улучшения их надёжности на долгогоризонтных задачах. Фреймворк формулирует оптимизацию как офлайн-обучение и итеративно обновляет конфигурацию агента через диагностику отказов, генерацию структурированных патчей и валидацию изменений. Экспериментальные результаты на бенчмарках GAIA2, SWE-Bench Pro и Terminal-Bench 2.0 демонстрируют значительное улучшение производительности агентов на 9-10 процентных пункта. Ключевые компоненты успеха включают глубокую отладку ошибок, целевые модификации и обобщение результатов вместо исправления отдельных траекторий.'}, 'en': {'title': "Harnessing Reliability: AutoSaddler's Path to Optimized LLM Performance", 'desc': 'AutoSaddler is a framework designed to enhance the performance of large language model (LLM) agents by optimizing their harnesses through offline failure-driven learning. It addresses the issue of local failures in long-horizon tasks, which can accumulate and lead to overall task failure. By treating harness improvement as an offline learning problem, AutoSaddler uses failure signals to iteratively refine the harness, employing techniques like failure-trace diagnosis and structured patch generation. Experiments demonstrate significant performance gains, indicating that automatic harness optimization can lead to more reliable and effective agent systems.'}, 'zh': {'title': '自动化优化，提升代理性能！', 'desc': 'AutoSaddler 是一个自动化的优化框架，旨在通过离线失败驱动的优化来提升大型语言模型（LLM）代理的性能。该框架将优化过程视为一个离线学习问题，利用失败信号对代理的控制逻辑进行迭代更新。实验结果表明，AutoSaddler 在多个基准测试中显著提高了代理的表现，提升幅度达到 9.0 到 10.0 个百分点。研究还表明，成功的优化依赖于深度调试、针对性修改和具有泛化意识的选择。'}}}, {'id': 'https://huggingface.co/papers/2608.24646', 'title': 'On-Policy Self-Distillation in Diffusion Models', 'url': 'https://huggingface.co/papers/2608.24646', 'abstract': 'Abstract DiffusionOPSD uses on-policy self-distillation to turn image-level rewards into explicit intermediate targets for diffusion models, improving alignment efficiency and enabling separate analysis of target construction and policy fitting.  Generated by thinkingmachines/Inkling-Small Reinforcement learning can align diffusion models with human preferences and task-specific objectives, but endpoint rewards do not specify how an intermediate denoising prediction should change. We introduce DiffusionOPSD as an on-policy self-distillation framework that converts image-level reward guidance into explicit targets for clean-output predictions at sampled queries. At each outer iteration, a frozen behavior policy generates trajectories and supplies query states and anchors. Reward gradients construct bounded positive and negative targets around each anchor. The trainable policy fits these targets as detached supervision through finite fitting before an exponential moving average update refreshes the behavior policy. This setup lets us measure target construction and finite realization separately. Controlled same-query experiments show that larger target-construction gains do not necessarily translate into larger realized gains after a single fitting update. Across SD 3.5-M and the step-distilled Z-Image-Turbo, our approach achieves the best final held-out scores in 19 of 20 reward-matched settings across two backbones and ten evaluators. It outperforms the strongest competing method by up to 44.0% and reduces training GPU-hours relative to DiffusionNFT by 40% on SD 3.5-M and 63% on Z-Image-Turbo. These results support on-policy self-distillation as an efficient and analyzable approach to diffusion post-training by converting image-level reward guidance into explicit and continually refreshed intermediate supervision, thereby opening a path toward more efficient and diagnosable alignment.', 'score': 26, 'issue_id': 3162, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '1be5240c479b8abb', 'authors': ['Wei Zhou', 'Xiongwei Zhu', 'Lingdong Kong', 'Bo Chen', 'Lei Zhang', 'Yongyuan Liang', 'Xiaoxia Hou', 'Ye Tian', 'Xian Sun', 'Yingshuo Wang', 'Linfeng Li', 'Shengqiong Wu', 'Leigang Qu', 'Feng Li', 'Wei Liu', 'Julian McAuley', 'Tat-Seng Chua'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.24646.jpg', 'data': {'categories': ['#training', '#diffusion', '#rl', '#rlhf', '#alignment', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Явные промежуточные цели через self-distillation для выравнивания диффузионных моделей', 'desc': 'Авторы предлагают DiffusionOPSD — фреймворк on-policy self-distillation для обучения диффузионных моделей с подкреплением. Метод преобразует вознаграждение на уровне изображений в явные промежуточные цели для предсказаний на этапе денойзинга, что позволяет более эффективно выравнивать модель с человеческими предпочтениями. Подход разделяет процесс построения целей и их оптимизации, позволяя отдельно анализировать вклад каждого этапа. Экспериментально показано, что DiffusionOPSD достигает лучших результатов в 19 из 20 сценариев, превосходя конкурирующие методы на 44% и сокращая вычислительные затраты на 40-63%.'}, 'en': {'title': 'Transforming Rewards into Targets for Better Model Alignment', 'desc': 'DiffusionOPSD is a novel framework that enhances the training of diffusion models by using on-policy self-distillation to transform image-level rewards into clear intermediate targets. This method allows for better alignment of the models with human preferences and specific tasks by providing explicit guidance on how predictions should evolve. The framework operates by generating trajectories from a fixed behavior policy, which helps in constructing positive and negative targets around specific query states. The results demonstrate significant improvements in performance and efficiency, achieving higher scores and reducing training time compared to existing methods.'}, 'zh': {'title': '高效对齐的自蒸馏方法', 'desc': 'DiffusionOPSD是一种基于策略的自蒸馏框架，旨在将图像级奖励转化为明确的中间目标，以提高扩散模型的对齐效率。通过生成轨迹和提供查询状态，固定的行为策略为清晰输出预测提供了锚点。奖励梯度在每个锚点周围构建有界的正负目标，训练策略通过有限拟合来适应这些目标。我们的实验表明，目标构建的提升不一定会在单次拟合更新后转化为更大的实际收益。'}}}, {'id': 'https://huggingface.co/papers/2608.24876', 'title': 'Recursive Experiential-Working Memory Evolution for Long-Horizon Agent Harnesses', 'url': 'https://huggingface.co/papers/2608.24876', 'abstract': 'Abstract Recuris introduces a recursive memory architecture that tracks progress and guides skill selection to improve long-horizon agent success through localized, validation-gated updates.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement (RSI) remains hard in long-horizon tasks, where growing histories obscure the task state and misalign skill invocation. We introduce Recuris, a recursive Experiential-Working Memory architecture for long-horizon agent harnesses, in which Working Memory tracks task progress and guides skill selection from Experiential Memory, grounding skill use in current needs rather than the full history. This coupling also turns execution into structured evidence that localizes failures to specific memory components. Across tasks, a fixed Meta-Agent turns that evidence into localized, validation-gated updates to Skill Memory that reshape execution and yield new evidence, forming a bounded recursive memory-evolution loop. Across four long-horizon benchmarks and ten models, Recuris improves task success in 35 of the 37 completed model-benchmark pairs, carrying frontier models to SOTA-level task success: on tau-bench it adds +17.8 points to GPT-5.6 Sol and +15.6 to Claude Opus 5, taking Opus 5 to 87.9%, and +16.6/+13.5 points on Qwen3.6-27B/35B on SkillFlow. The advantage widens as the interaction horizon grows, to +32.2 points on the longest tasks, and common long-horizon failures fall by up to 80%. These results position recursively evolving memory as a scalable foundation for RSI, enabling agents to continuously transform accumulated experience into increasingly effective long-horizon behavior. Code: https://github.com/Gen-Verse/Recuris', 'score': 14, 'issue_id': 3162, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'a5af983bb2bd59f3', 'authors': ['Zhaochen Yu', 'Yingcheng Wu', 'Zhenfei Yin', 'Kaiyuan Chen', 'Zhe Zhao', 'Mengdi Wang', 'Shuicheng Yan', 'Ling Yang'], 'affiliations': ['NUS', 'Princeton University', 'Stanford University', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.24876.jpg', 'data': {'categories': ['#training', '#architecture', '#reasoning', '#long_context', '#open_source', '#benchmark', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Рекурсивная эволюция памяти для долгосрочного поведения агентов', 'desc': 'В статье представлена архитектура Recuris, которая использует рекурсивную память для улучшения способности агентов решать долгосрочные задачи. Система состоит из двух типов памяти: рабочей памяти, которая отслеживает прогресс выполнения задачи и направляет выбор навыков, и памяти опыта, которая хранит набор необходимых действий. Мета-агент анализирует ошибки выполнения и применяет локализованные обновления к памяти навыков, создавая цикл непрерывного улучшения. Экспериментальные результаты показывают значительное повышение успешности выполнения задач на различных бенчмарках, особенно на длинных горизонтах взаимодействия.'}, 'en': {'title': 'Recuris: Revolutionizing Long-Horizon Learning with Recursive Memory', 'desc': "The paper presents Recuris, a novel recursive memory architecture designed to enhance the performance of agents in long-horizon tasks. It utilizes a structure called Experiential-Working Memory, which helps track task progress and select skills based on immediate needs rather than relying on a complete history. This approach allows for localized updates to Skill Memory, improving the agent's ability to adapt and learn from failures. The results demonstrate significant improvements in task success rates across various benchmarks, showcasing the potential of recursive memory in advancing long-horizon agent capabilities."}, 'zh': {'title': '递归记忆架构提升长时间任务成功率', 'desc': 'Recuris是一种递归记忆架构，旨在通过局部验证更新来跟踪进展并指导技能选择，从而提高长时间任务中的代理成功率。该架构利用工作记忆跟踪任务进展，并从经验记忆中选择技能，使技能的使用基于当前需求而非完整历史。通过将执行转化为结构化证据，Recuris能够将失败定位到特定的记忆组件。实验结果表明，Recuris在多个长时间基准测试中显著提高了任务成功率，展示了递归演变记忆作为自我改进的可扩展基础。'}}}, {'id': 'https://huggingface.co/papers/2608.24696', 'title': 'On-policy Distillation with Verifiable Reward', 'url': 'https://huggingface.co/papers/2608.24696', 'abstract': "Abstract OPDVR integrates on-policy distillation with verifiable rewards via a ReLU-gated implicit reward reformulation, improving reasoning performance without extra hyperparameters.  Generated by thinkingmachines/Inkling-Small Reinforcement Learning with Verifiable Rewards (RLVR) and on-policy distillation (OPD) have become two widely adopted paradigms for post-training large language models. However, RLVR suffers from sparse task-level feedback, while OPD provides dense token-level guidance but ignores trajectory correctness, limiting its performance to that of the teacher. Combining them is a promising direction: OPD supplies dense supervisory signals, while RLVR provides task-level correctness. Nevertheless, existing integrations often rely on weighted combination or heuristic switching, introducing extra hyperparameters and trade-offs. We propose On-policy Distillation with Verifiable Reward (OPDVR), a simple yet effective method that seamlessly combines OPD and RLVR without adding any hyperparameters. We first reformulate the implicit reward of sampled-token OPD based on trajectory correctness, then apply a ReLU gating mechanism to ensure that correct trajectories receive non-negative rewards and incorrect ones receive non-positive rewards---thereby aligning the distillation signal with task success while preserving the teacher's distributional guidance. Furthermore, our modification transforms sampled-token OPD into a proper RLVR method, making it readily combinable with any policy gradient algorithm, such as GRPO. Experiments on six reasoning benchmarks show that OPDVR consistently outperforms standard OPD. Our code is available at https://github.com/LeapLabTHU/OPDVR.", 'score': 4, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'db6734b993277d58', 'authors': ['Wenze Lin', 'Jiale Zhao', 'Xitai Jiang', 'Songde Rao', 'Yining Li', 'Shenzhi Wang', 'Bingxiang He', 'Gao Huang'], 'affiliations': ['Beihang University', 'LeapLab, Tsinghua University', 'NLPLab, Tsinghua', 'SMS, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.24696.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#open_source', '#rlhf', '#training', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Безхитростное объединение дистилляции и подкрепления для улучшения рассуждений', 'desc': 'В работе предлагается метод OPDVR, который объединяет политику дистилляции с проверяемыми наградами через механизм ReLU-гейтинга неявной функции награды. Авторы решают проблему того, что обучение с подкреплением на проверяемых наградах страдает от разреженной обратной связи на уровне задач, а дистилляция по политике дает плотные сигналы, но не учитывает правильность траектории. Предложенный подход переформулирует неявную награду дистилляции на основе корректности траектории и применяет механизм гейтинга для выравнивания сигналов дистилляции с успехом задачи. Экспериментальные результаты на шести бенчмарках рассуждений показывают, что метод OPDVR превосходит стандартную дистилляцию по политике без дополнительных гиперпараметров.'}, 'en': {'title': 'Enhancing Reasoning with Seamless Reward Integration', 'desc': 'The paper introduces OPDVR, a novel method that combines on-policy distillation (OPD) with verifiable rewards (RLVR) to enhance reasoning performance in large language models. By reformulating the implicit rewards based on trajectory correctness and using a ReLU gating mechanism, OPDVR ensures that only correct trajectories receive positive feedback, aligning the learning process with task success. This integration avoids the need for additional hyperparameters, simplifying the training process while maintaining the benefits of both OPD and RLVR. Experimental results demonstrate that OPDVR outperforms traditional OPD methods across multiple reasoning benchmarks.'}, 'zh': {'title': '无超参数的高效推理方法OPDVR', 'desc': 'OPDVR是一种将在政策蒸馏与可验证奖励相结合的方法，旨在提高推理性能而无需额外的超参数。它通过重构隐式奖励，确保正确的轨迹获得非负奖励，而错误的轨迹则获得非正奖励，从而将蒸馏信号与任务成功对齐。该方法有效地结合了OPD提供的密集监督信号和RLVR提供的任务级正确性，克服了传统方法的局限性。实验结果表明，OPDVR在六个推理基准测试中始终优于标准的OPD。'}}}, {'id': 'https://huggingface.co/papers/2608.24877', 'title': 'From Seeing to Acting: Smart Glasses as First-Person Intelligence Platforms', 'url': 'https://huggingface.co/papers/2608.24877', 'abstract': "Abstract Smart glasses are surveyed as unified first-person intelligence platforms requiring sustained perception-state-interaction-action loops across constrained hardware and diverse applications.  Generated by thinkingmachines/Inkling-Small Smart glasses are evolving from capture and display accessories into first-person intelligence platforms that connect human perception, persistent context, and digital or physical action. Their on-body viewpoint aligns with the wearer's vision, audition, motion, and hand-object interaction, but must operate under tight energy, thermal, privacy, and feedback constraints. Despite rapid progress in augmented reality, egocentric vision, multimodal models, human-computer interaction, and embodied intelligence, the literature remains fragmented across devices, tasks, and benchmarks. The key challenge is not whether a model can recognize, answer, remember, or act in isolation, but whether a complete system can sustain a reliable, temporally valid, correctable, and governable perception-state-interaction-action loop. This survey is the \\textbf{first to systematically study smart glasses through such a unified framework}. We formalize first-person data flow and constrained task utility, characterize devices along eight verifiable hardware capability axes, organize the literature around seven interdependent foundational capabilities, and introduce an L0-L5 framework spanning capture, reactive perception, contextual assistance, persistent state, governed action, and embodied coupling. Across nine application scenes, we connect tasks with datasets, systems, products, stakeholders, failure consequences, and evidence gaps. We further present a nine-dimensional deployment framework, a claim-conditioned evaluation protocol, and an evidence ladder from controlled measurement to longitudinal field validation and audit. Together, these elements make smart glasses more comparable, deployable, and reproducibly evaluated, while outlining a roadmap toward trustworthy first-person intelligence.", 'score': 3, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'e7e8cfa497c5e7da', 'authors': ['Jiangning Zhang', 'Haojun Chen', 'Yong Liu'], 'affiliations': ['Zhejiang University, APRIL Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.24877.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#survey', '#robotics', '#cv', '#benchmark'], 'emoji': '👓', 'ru': {'title': 'Единая архитектура первоуровневого интеллекта в умных очках', 'desc': 'В статье представлен обзор умных очков как платформ для первоуровневого интеллекта, которые должны поддерживать непрерывные циклы восприятия-состояния-взаимодействия-действия с учетом ограниченных ресурсов устройства. Авторы предлагают унифицированный фреймворк для анализа умных очков, включающий формализацию потока данных, характеристику оборудования по восьми осям и организацию литературы вокруг семи фундаментальных возможностей. Введена иерархия L0-L5, охватывающая захват данных, реактивное восприятие, контекстную помощь, сохранение состояния, управляемые действия и встроенное взаимодействие. Исследование предлагает девятимерный фреймворк развертывания и протокол оценки для создания более сравниваемых, надежных и воспроизводимых умных очков.'}, 'en': {'title': 'Transforming Smart Glasses into First-Person Intelligence Platforms', 'desc': 'This paper surveys the evolution of smart glasses into comprehensive first-person intelligence platforms that integrate human perception with digital and physical actions. It emphasizes the importance of maintaining a continuous perception-state-interaction-action loop while addressing constraints like energy and privacy. The authors propose a unified framework to analyze smart glasses, categorizing their capabilities and organizing existing literature into foundational capabilities. Additionally, they introduce a deployment framework and evaluation protocols to enhance the comparability and reliability of smart glasses in various applications.'}, 'zh': {'title': '智能眼镜：第一人称智能的未来', 'desc': '智能眼镜被视为统一的第一人称智能平台，需要在受限的硬件和多样的应用中维持感知-状态-交互-行动的循环。它们不仅是捕捉和显示的配件，而是连接人类感知、持久上下文和数字或物理行动的工具。尽管增强现实和人机交互等领域取得了快速进展，但文献仍然在设备、任务和基准上存在碎片化。本文首次系统性地研究智能眼镜，提出了一个统一框架，旨在使智能眼镜更具可比性、可部署性和可重复评估性。'}}}, {'id': 'https://huggingface.co/papers/2608.24845', 'title': 'LAION-BVD: A 10-Million-Hour Open Video Dataset for Multimodal Pre-training', 'url': 'https://huggingface.co/papers/2608.24845', 'abstract': 'Abstract LAION-BVD is a large-scale open video dataset enabling multimodal pre-training across video, audio, and image modalities with synthetic captions and strong benchmark performance.  Generated by thinkingmachines/Inkling-Small We present LAION-BVD, a large-scale open video dataset for multimodal learning, which contains 1.3B platform-specific video URLs collected from CommonCrawl. From these, we download 80M videos with a total duration of 10 million hours. The dataset is designed for multimodal pre-training across the video, audio, and image modalities. Using content-aware scene detection, we extract clips for which we synthetically generate video and audio captions. Models trained on these data achieve competitive performance on standard video-text and audio-text benchmarks, with consistent improvements as training or model scale increases. Additionally, we explore video frames as an alternative source of image-text data by extracting scene-changing frames. These frames exhibit a visual distribution distinct from standard web image corpora, and models trained on this dataset achieve strong image-text retrieval performance. We release LAION-BVD to the research community. It significantly expands open access to multimodal videos at an unprecedented scale.', 'score': 1, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'ec5bdd5bed928e3c', 'authors': ['Andreas Hochlehnert', 'Marianna Nezhurina', 'Mehdi Cherti', 'Andrej Radonjic', 'Thaddäus Wiedemer', 'Christoph Schuhmann', 'Romain Beaumont', 'Wieland Brendel', 'Bernhard Schölkopf', 'A. Sophia Koepke', 'Jenia Jitsev', 'Matthias Bethge'], 'affiliations': ['JSC, FZJ', 'LAION', 'MPI for Intelligent Systems, ELLIS Institute Tübingen', 'Technical University of Munich, MCML', 'University of Tübingen, Tübingen AI Center', 'Wynd Labs'], 'pdf_title_img': 'assets/pdf/title_img/2608.24845.jpg', 'data': {'categories': ['#audio', '#open_source', '#synthetic', '#dataset', '#video', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Мультимодальное предварительное обучение на беспрецедентно большом наборе видеоданных', 'desc': 'LAION-BVD — это крупномасштабный открытый набор данных видеороликов, содержащий 80 миллионов видео общей длительностью 10 миллионов часов для мультимодального предварительного обучения. Датасет включает видео, аудио и изображения с синтетически сгенерированными подписями, полученными с использованием анализа сцен. Модели, обученные на этих данных, достигают конкурентных результатов на стандартных бенчмарках видео-текст и аудио-текст с улучшениями при масштабировании. Исследователи также использовали кадры видео как источник данных для обучения моделей поиска изображений по текстовому описанию.'}, 'en': {'title': 'Unlocking Multimodal Learning with LAION-BVD', 'desc': 'LAION-BVD is a comprehensive open dataset designed for multimodal learning, integrating video, audio, and image data. It consists of 1.3 billion video URLs, from which 80 million videos have been downloaded, totaling 10 million hours of content. The dataset includes synthetically generated captions for both video and audio, enhancing the training of models for video-text and audio-text tasks. By also utilizing scene-changing frames for image-text retrieval, LAION-BVD demonstrates significant improvements in performance, making it a valuable resource for the research community.'}, 'zh': {'title': 'LAION-BVD：多模态学习的新纪元', 'desc': 'LAION-BVD是一个大规模的开放视频数据集，旨在支持视频、音频和图像的多模态预训练。该数据集包含来自CommonCrawl的13亿个特定平台视频网址，并下载了8000万个视频，总时长达到1000万小时。通过内容感知场景检测，我们提取了视频片段，并为其合成生成了视频和音频的标题。使用该数据集训练的模型在标准的视频-文本和音频-文本基准测试中表现出色，且随着训练规模或模型规模的增加，性能持续提升。'}}}, {'id': 'https://huggingface.co/papers/2608.23566', 'title': 'Best Practice Critic Optimization', 'url': 'https://huggingface.co/papers/2608.23566', 'abstract': 'Abstract BPCO stabilizes critic-based reinforcement learning for language models by combining bounded value predictions, Monte Carlo targets, and adaptive advantage estimation, matching group-based methods with single-response sampling.  Generated by thinkingmachines/Inkling-Small Group-based reinforcement learning methods such as GRPO for large language models avoid training a critic by sampling multiple responses for each prompt. A reliable critic could instead estimate token-level advantages from one response, but standard critic-based training recipes are often unstable. We study this instability and develop **Best Practice Critic Optimization (BPCO)**, a recipe that combines DPPO, value predictions bounded to the reward range, Monte Carlo value targets, unnormalized policy advantages, and length-adaptive generalized advantage estimation. Because the critic is used only during training, BPCO can also condition it on reward-defining information, such as a reference answer or grading rubric, that is hidden from the policy. Controlled experiments isolate the effect of each design choice. Across mathematical reasoning tasks with models ranging from 1.5B parameters to 30B-A3B mixtures of experts, BPCO improves a strong critic-based baseline consistently, and matches or exceeds a group-based baseline while sampling one response per prompt. The same recipe also improves learning with rubric-based rewards. These results show that a carefully designed critic provides a reliable alternative to group-relative advantage estimation. Code is available at https://github.com/QPHutu/golden_critic.', 'score': 1, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'ff6342c265354d9a', 'authors': ['Penghui Qi', 'Xiangxin Zhou', 'Wee Sun Lee'], 'affiliations': ['National University of Singapore', 'Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2608.23566.jpg', 'data': {'categories': ['#rlhf', '#rl', '#small_models', '#training'], 'emoji': '🎯', 'ru': {'title': 'Стабильный критик для эффективного обучения языковых моделей с подкреплением', 'desc': 'В статье предлагается BPCO — метод стабилизации критик-ориентированного обучения с подкреплением для языковых моделей. Авторы комбинируют ограниченные предсказания стоимости, Монте-Карло целевые значения и адаптивную оценку преимущества, чтобы избежать нестабильности при обучении одного ответа на один запрос. Метод позволяет критику получать доступ к дополнительной информации (эталонные ответы, рубрики оценивания), скрытой от политики модели. Эксперименты на задачах математического рассуждения показывают, что BPCO согласуется с групповыми методами при использовании в четыре раза меньшей выборки ответов.'}, 'en': {'title': 'Stabilizing Critic Training for Language Models with BPCO', 'desc': 'This paper introduces Best Practice Critic Optimization (BPCO), a method that enhances critic-based reinforcement learning for language models. BPCO stabilizes training by integrating bounded value predictions, Monte Carlo targets, and adaptive advantage estimation, allowing for effective learning from single responses. The approach addresses the instability often seen in standard critic training by conditioning the critic on reward-defining information, which is not available to the policy. Experimental results demonstrate that BPCO consistently outperforms traditional methods and matches group-based techniques while using only one response per prompt.'}, 'zh': {'title': '稳定强化学习的最佳实践评论优化', 'desc': '本文提出了一种名为最佳实践评论优化（BPCO）的方法，旨在稳定基于评论的强化学习，特别是在语言模型的训练中。BPCO结合了有界价值预测、蒙特卡洛目标和自适应优势估计，能够在单响应采样中匹配基于组的方法。通过对每个设计选择的影响进行控制实验，BPCO在多个数学推理任务中表现出色，显著提高了基于评论的基线性能。研究表明，精心设计的评论器为基于组的优势估计提供了可靠的替代方案。'}}}, {'id': 'https://huggingface.co/papers/2608.24735', 'title': 'Meta^n: Recursive Self-Improvement through Emergent Depth', 'url': 'https://huggingface.co/papers/2608.24735', 'abstract': 'Abstract Meta^n recursively applies a fixed meta-operation to growing inputs, building deeper reasoning layers that improve self-improving LLM agents without destabilizing the system.  Generated by thinkingmachines/Inkling-Small Self-improving LLM agents refine answers, not the process that produces those answers. Systems that add a meta-level hold that level fixed, and those that edit themselves must leave part of their own editing machinery untouched to stay stable, capping the meta-depth they realize at roughly two. We present Meta^n, which keeps the meta-operation fixed and recurses on its input instead. That operation, Ω, is applied repeatedly to its own products, reading the traces of the solver stack below together with the code that produced them, then writing the next layer as a strategic pre-process and a library of callable helpers. Because Ω never changes, it cannot destabilize the system, and because its input strictly grows, each layer reasons from a higher vantage than the last. Depth is set by convergence rather than fixed in advance, and an evolutionary archive searches over layer chains. Across two backbones, Meta^n outperforms prior self-improving agents on all eight benchmark families. The sharpest case is ARC-AGI-2, built to resist skill memorization, where it alone scores above zero. Ablations indicate that most of the gain from recursion comes from the conditioning each layer passes to the next, and distinct layer roles emerge with depth although no prompt prescribes them. Code available at https://github.com/minnesotanlp/meta-n', 'score': 1, 'issue_id': 3162, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'd0e266301fb8110d', 'authors': ['Zae Myung Kim', 'Young-Jun Lee', 'Seungyeon Jwa', 'Dongyeop Kang'], 'affiliations': ['Seoul National University', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2608.24735.jpg', 'data': {'categories': ['#training', '#agi', '#reasoning', '#open_source', '#benchmark', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Бесконечная глубина без нестабильности: рекурсивная мета-операция для саморазвивающихся LLM', 'desc': 'В работе предложен Meta^n — метод для создания саморазвивающихся LLM агентов, который рекурсивно применяет одну и ту же мета-операцию к растущим входным данным, создавая всё более глубокие уровни рассуждений. В отличие от предыдущих подходов, где мета-уровень остаётся фиксированным или система редактирует саму себя (что вызывает нестабильность), Meta^n оставляет операцию неизменной и развивает её входные данные, анализируя трассы выполнения и генерируя стратегические предварительные обработки и библиотеки вспомогательных функций. Глубина рекурсии определяется автоматической сходимостью, а не устанавливается заранее, что позволяет избежать дестабилизации и каждому уровню рассуждать с более высокой позиции. Метод демонстрирует значительное превосходство над существующими саморазвивающимися агентами на всех тестовых наборах, особенно на ARC-AGI-2, где только Meta^n достигает положительных результатов.'}, 'en': {'title': 'Deepening Reasoning Layers for Stable Self-Improvement', 'desc': 'Meta^n is a novel approach that enhances self-improving language models (LLMs) by applying a consistent meta-operation recursively to their inputs. This method allows the model to build deeper reasoning layers without destabilizing its core processes, unlike previous systems that had to maintain fixed meta-levels. By ensuring that the meta-operation remains unchanged and that inputs grow consistently, each layer of reasoning can build upon the insights of the previous one, leading to improved performance. The results show that Meta^n outperforms existing self-improving agents across various benchmarks, particularly in scenarios designed to challenge memorization skills.'}, 'zh': {'title': 'Meta^n：稳定的自我改进推理层', 'desc': 'Meta^n 是一种递归应用固定元操作的机器学习方法，旨在提高自我改进的语言模型（LLM）代理的推理能力而不破坏系统的稳定性。该方法通过不断增加输入，构建更深的推理层，使得每一层都能从更高的视角进行推理。与传统方法不同，Meta^n 保持元操作不变，并在其输入上进行递归处理，从而避免了系统的不稳定性。实验结果表明，Meta^n 在多个基准测试中优于以往的自我改进代理，尤其在抵抗技能记忆的任务中表现突出。'}}}, {'id': 'https://huggingface.co/papers/2608.24794', 'title': 'CAFE: Self-Improving Search Agents Need Co-Evolving Feedback', 'url': 'https://huggingface.co/papers/2608.24794', 'abstract': "Abstract CAFE couples a search agent and critic via shared parameters to learn in-trajectory corrective feedback, improving search performance and reducing hallucinations across benchmarks.  Generated by thinkingmachines/Inkling-Small Outcome-supervised search agents learn when and how to retrieve evidence, but terminal rewards neither localize intermediate errors nor redirect an ongoing trajectory before those errors compound. Treating corrective feedback as a learned in-trajectory intervention couples the two roles: the agent must decide when to request and use feedback, while the critic must infer useful corrections from outcome-confounded rollouts whose failure patterns shift as the agent improves. We introduce CAFE (Coupled Agent--Feedback Evolution), a framework in which a shared-parameter model alternates between search-agent and critic roles. CAFE initializes feedback-conditioned recovery from trajectories built around the base agent's own failures, then couples online and offline optimization. During online RL, a comparative feedback estimate uses a prompt-level call--skip success gap to shape request returns, while feedback-aware advantage shaping reweights token advantages before and after feedback. Offline, rollout-derived preference optimization learns feedback from matched successful and unsuccessful trajectories. On seven agentic search benchmarks, CAFE outperforms the evaluated RL-based search agents on average, retains its gains across all six out-of-domain benchmarks, and reduces answer-level hallucinations. One-sided ablations show that improving only the agent or only the critic eventually plateaus, whereas alternating the two updates continues to improve performance. These findings suggest that a self-improving search agent needs feedback that co-evolves with the policy it guides.", 'score': 1, 'issue_id': 3162, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'd4dc875c9db32cff', 'authors': ['Boyang Liu', 'Senjie Jin', 'Peixin Wang', 'Zhangyue Yin', 'Yibo Wang', 'Yuhao Zhou', 'Xinbing Liang', 'Shizheng Zhu', 'Yuhui Wang', 'Jingqi Tong', 'Zhiheng Xi', 'Jiazheng Zhang', 'Clive Bai', 'Clarenceai', 'Blaze Chen', 'Tao Gui', 'Qi Zhang', 'Xuanjing Huang'], 'affiliations': ['Fudan University', 'LLM Department, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.24794.jpg', 'data': {'categories': ['#training', '#hallucinations', '#reasoning', '#benchmark', '#rl', '#agents', '#alignment'], 'emoji': '🔄', 'ru': {'title': 'Самосовершенствующийся поиск через сопутствующую эволюцию агента и критика', 'desc': 'В статье представлена система CAFE, которая объединяет агента поиска и критика с общими параметрами для обучения на коррекционной обратной связи прямо во время траектории. Традиционные агенты обучаются только на финальных наградах, что не позволяет выявить промежуточные ошибки и исправить их до того, как они накопятся. CAFE использует чередующееся обучение: агент учится решать, когда запросить обратную связь и как её использовать, а критик учится предлагать полезные коррекции на основе анализа собственных ошибок. На семи бенчмарках система показала улучшение по сравнению с другими методами RL-поиска и уменьшила количество галлюцинаций в ответах.'}, 'en': {'title': 'CAFE: Enhancing Search Agents with Coupled Feedback Learning', 'desc': "The paper introduces CAFE, a framework that combines a search agent and a critic using shared parameters to enhance learning through corrective feedback during the search process. This approach allows the agent to learn when to seek feedback and how to apply it effectively, addressing errors in real-time rather than after the fact. By alternating roles between the agent and the critic, CAFE optimizes both online and offline learning, leading to improved performance on various benchmarks. The results show that this coupled feedback mechanism significantly reduces hallucinations and enhances the agent's ability to learn from its mistakes."}, 'zh': {'title': 'CAFE：自我改进的搜索代理与反馈的协同进化', 'desc': 'CAFE是一种将搜索代理和评论者通过共享参数结合起来的框架，旨在学习轨迹中的纠正反馈，从而提高搜索性能并减少幻觉现象。该方法通过让代理决定何时请求和使用反馈，同时让评论者从结果混淆的回滚中推断有用的修正，来实现这一目标。CAFE在在线和离线优化中交替进行，利用反馈条件的恢复来改善基于代理自身失败的轨迹。实验结果表明，CAFE在多个基准测试中优于其他基于强化学习的搜索代理，并有效减少了答案级别的幻觉。'}}}, {'id': 'https://huggingface.co/papers/2608.22274', 'title': 'Length-Adaptive Decoding for Masked Diffusion Machine Translation', 'url': 'https://huggingface.co/papers/2608.22274', 'abstract': 'Abstract Entropy-Valley selects target lengths for masked diffusion translation by scoring predictive entropy, improving adequacy and showing length choice matters more than unmasking order.  Generated by thinkingmachines/Inkling-Small Machine translation tests masked diffusion language models (dLLMs) because every source token must be rendered faithfully, while fixed canvas decoding must choose target length before denoising. Existing masked diffusion decoding work mainly studies token unmasking order, leaving this length decision under-explored despite its direct effect on coverage and redundancy. We introduce Entropy-Valley (EV), a training-free length selector that scores candidate target canvases by mean predictive entropy from all-mask forward passes and selects the canvas the backbone is most prepared to fill. Relative to a baseline using training corpus length statistics, EV recovers 64.9%, 65.3%, and 33.0% of the COMET-22 gain from reference target lengths on EntoZh, ZhtoEn, and EntoDe. Our diagnostics show that denoising-friendly lengths need not match reference lengths. Evaluation by three translation experts supports the EnleftrightarrowZh adequacy gains, with stronger evidence on ZhtoEn. Compared with a LLaMA-3-8B autoregressive (AR) model trained on the same fine-tuning data, the EV system ties on EntoZh and leads on ZhtoEn; an oracle-length diagnostic further shows that, in this masked diffusion MT setting, deciding which tokens to reveal first matters less than how the target length is supplied.', 'score': 1, 'issue_id': 3163, 'pub_date': '2026-08-23', 'pub_date_card': {'ru': '23 августа', 'en': 'August 23', 'zh': '8月23日'}, 'hash': '12405028d52576fa', 'authors': ['Yan Zhan', 'Mengkai Hou', 'Wanting Zhang', 'Zhijun Gao'], 'affiliations': ['BYD Company Limited', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.22274.jpg', 'data': {'categories': ['#multilingual', '#machine_translation', '#diffusion', '#training'], 'emoji': '🎯', 'ru': {'title': 'Энтропийная долина: выбор длины целевого текста как ключ к качеству диффузионного перевода', 'desc': 'В статье предложен метод Entropy-Valley для выбора длины целевого текста в машинном переводе с использованием диффузионных моделей. Авторы показывают, что качество перевода сильно зависит от правильного выбора длины целевого предложения, что до сих пор было малоизучено в контексте маскированных диффузионных моделей. Метод использует прогностическую энтропию для оценки кандидатов на целевую длину и не требует обучения. Эксперименты демонстрируют, что выбор правильной длины текста более важен, чем порядок раскрытия скрытых токенов при денойзировании.'}, 'en': {'title': 'Choosing Target Lengths Matters More Than Unmasking Order!', 'desc': 'The paper introduces a method called Entropy-Valley (EV) for selecting target lengths in masked diffusion translation models. It emphasizes the importance of choosing the right target length over the order in which tokens are unmasked, which has been the focus of previous research. EV scores potential target lengths based on predictive entropy, allowing for better adequacy in translations. The results show that using EV significantly improves translation quality compared to traditional methods that rely on fixed length statistics.'}, 'zh': {'title': '选择目标长度，提升翻译质量！', 'desc': '这篇论文提出了一种名为Entropy-Valley（EV）的目标长度选择方法，用于掩蔽扩散翻译模型。该方法通过预测熵评分来选择目标长度，强调了长度选择对翻译质量的重要性。研究表明，掩蔽解码中的长度决策对覆盖率和冗余性有直接影响，而不仅仅是解掩蔽的顺序。与基线方法相比，EV在多个翻译任务中显著提高了翻译的准确性，证明了在掩蔽扩散机器翻译中，目标长度的选择比解掩蔽顺序更为重要。'}}}, {'id': 'https://huggingface.co/papers/2608.24738', 'title': 'TorchMorph: CUDA-accelerated Morphological Transforms', 'url': 'https://huggingface.co/papers/2608.24738', 'abstract': 'Abstract TorchMorph is a PyTorch extension providing GPU-accelerated morphological and distance-transform operators across up to eight dimensions with a SciPy-compatible API.  Generated by thinkingmachines/Inkling-Small Morphological transforms are long-standing tools for shape and mask processing, but the de facto reference implementation in the Python ecosystem, i.e. scipy.ndimage, is CPU-only, single-array, and therefore unusable inside a GPU training loop without an expensive device-to-host round trip. GPU vision libraries built on PyTorch cover a narrow subset of these operators, typically restricted to two spatial dimensions and flat structuring elements. We present TorchMorph, a lightweight PyTorch extension that closes this gap. TorchMorph exposes 22 public operators covering binary morphology, greyscale morphology, exact and approximate distance transforms, and entropy-regularised optimal transport, all implemented as fused CUDA kernels that operate directly on (B, C, Spatial...) CUDA tensors with up to eight spatial dimensions. The API deliberately mirrors scipy.ndimage argument-for-argument, including border modes, structuring-element origins and pre-allocated outputs, so that existing pipelines port with a change of import. We describe the layered architecture and the kernel designs behind each operator family. Against single-threaded CPU references, batched execution reaches up to 1.1e3 times the throughput of scipy.ndimage on greyscale morphology and up to 350x on exact Euclidean distance transforms, while the Sinkhorn solver runs up to 42x faster than POT. Binary and chamfer operators reproduce their SciPy counterparts exactly, and every float-valued operator agrees with the CPU reference to within 1.8e-6 absolute error. TorchMorph is released under the MIT licence at https://intcomp.github.io/tm.', 'score': 0, 'issue_id': 3163, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'db69157afb27299a', 'authors': ['Kai Zhao'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.24738.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'GPU-ускорение морфологических операций для глубокого обучения', 'desc': 'TorchMorph — это расширение PyTorch, которое обеспечивает ускоренные на GPU морфологические операции и трансформы расстояний для работы с тензорами размерностью до восьми. Библиотека реализует 22 оператора, включая бинарную и полутоновую морфологию, точные и приближённые трансформы расстояний, а также оптимальный транспорт с регуляризацией энтропии через специализированные CUDA ядра. API полностью совместим с scipy.ndimage по аргументам и семантике, что позволяет легко портировать существующий код путём простой смены импорта. В сравнении с CPU-реализациями TorchMorph достигает ускорения в тысячи раз при пакетной обработке, одновременно сохраняя численную точность вплоть до 1.8e-6 абсолютной ошибки.'}, 'en': {'title': 'Accelerate Morphological Processing with TorchMorph!', 'desc': 'TorchMorph is a PyTorch extension that enhances morphological and distance-transform operations by utilizing GPU acceleration, allowing for efficient processing in up to eight dimensions. Unlike the traditional scipy.ndimage, which is limited to CPU and single-array operations, TorchMorph enables seamless integration into GPU training loops without costly data transfers. It offers 22 operators for various morphological tasks, all designed to be compatible with existing SciPy APIs, making it easy for users to transition their workflows. The performance benchmarks show significant speed improvements, with up to 1,100 times faster execution for certain operations compared to CPU implementations.'}, 'zh': {'title': 'TorchMorph：GPU加速的形态学处理利器', 'desc': 'TorchMorph是一个基于PyTorch的扩展，提供了加速的形态学和距离变换操作，支持多达八个维度。与传统的CPU-only实现不同，TorchMorph利用GPU加速，显著提高了处理速度，尤其是在灰度形态学和欧几里得距离变换方面。它的API与SciPy兼容，方便用户在现有管道中进行迁移。TorchMorph的设计使得用户能够在GPU训练循环中高效地使用这些操作。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (3)', '#agi (1)', '#alignment (2)', '#architecture (1)', '#audio (1)', '#benchmark (6)', '#cv (1)', '#data', '#dataset (3)', '#diffusion (2)', '#ethics', '#games', '#graphs', '#hallucinations (1)', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation (1)', '#math', '#multilingual (1)', '#multimodal (3)', '#open_source (4)', '#optimization (2)', '#plp', '#rag', '#reasoning (4)', '#rl (4)', '#rlhf (3)', '#robotics (1)', '#science', '#security', '#small_models (1)', '#story_generation', '#survey (1)', '#synthetic (1)', '#training (8)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-26 04:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-26 04:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-26 04:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
