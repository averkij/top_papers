    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.28227', 'title': 'Qwen-UI-Agent Technical Report: Toward Next-Generation Real-World Centric Foundation GUI Agents', 'url': 'https://huggingface.co/papers/2607.28227', 'abstract': 'Abstract  GUI agents have the potential to become a general purpose executor over existing digital devices. To advance them toward real-world use, we envision agents that operate reliably on real devices, execute workflows across platforms, combine GUI interaction with CLI execution, complete long-horizon tasks, proactively initiate useful services, and autonomously improve their capabilities with minimal human effort. Guided by this vision, we present Qwen-UI-Agent, a real-world centric foundation GUI agent spanning mobile, computer-use, web, and DeepSearch environments. Qwen-UI-Agent combines diverse sandbox environments with a large-scale real-device mobile runtime. Its unified action space interleaves GUI operations with CLI execution and generates batched actions in a single model turn. An AutoResearch-style data flywheel uses agents to construct tasks and environments, diagnose failures, and plan subsequent iterations. Online RL supports training on trajectories exceeding 100 turns, with over 10,000 concurrent environments accelerating rollout. A lightweight harness layer supports proactive service initiation and stateful workflows across mobile and computer.   Across a broad suite of evaluations, Qwen-UI-Agent sets state-of-the-art performance on mobile-use benchmarks while delivering competitive performance on computer- and browser-use tasks against frontier models, including Opus 4.8, Gemini 3.1 Pro, and GPT-5.6 Sol. On mobile use, it achieves 82.1% on MobileWorld, 92.2% on MobileWorld-Real, and 97.5% on AndroidDaily. On computer use, it achieves 79.5% on OSWorld-Verified and a 40.0% partial-progress score on OSWorld-v2. On browser use and GUI grounding, it achieves 73.6% on WebArena and 81.5% on ScreenSpot-Pro, respectively.', 'score': 253, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'c8d10ef1c80e28aa', 'authors': ['Hanzhang Zhou', 'Panrong Tong', 'Xu Zhang', 'Quyu Kong', 'Chenglin Cai', 'Tianyu Xia', 'Gongjie Zhang', 'Jianan Zhang', 'Long Li', 'Long Chen', 'Lei Wang', 'Gaole Dai', 'Pengxiang Li', 'Liangyu Chen', 'Yue Wang', 'Steven Hoi'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.28227.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Универсальный агент для автоматизации взаимодействия с графическим интерфейсом', 'desc': 'В работе представлен Qwen-UI-Agent — универсальный фундаментальный агент для взаимодействия с графическим интерфейсом, который работает на мобильных устройствах, компьютерах и веб-приложениях. Агент использует единое пространство действий, объединяющее операции GUI с командной строкой, и генерирует пакетные действия за один проход модели. Для обучения применяется подход online RL на долгих траекториях с более чем 10 000 параллельными окружениями, а также использован автоматический механизм сбора данных для непрерывного улучшения. Агент демонстрирует наилучшие результаты на мобильных бенчмарках и конкурентоспособную производительность на компьютерных и браузерных задачах по сравнению с передовыми моделями.'}, 'en': {'title': 'Empowering Digital Agents for Seamless Multi-Platform Execution', 'desc': 'The paper introduces Qwen-UI-Agent, a versatile GUI agent designed to operate effectively across various digital platforms, including mobile and computer environments. It integrates graphical user interface (GUI) interactions with command-line interface (CLI) execution, allowing it to handle complex workflows and long-term tasks autonomously. The agent utilizes online reinforcement learning (RL) to improve its performance through extensive training across thousands of concurrent environments. Evaluations show that Qwen-UI-Agent achieves state-of-the-art results in mobile benchmarks and competitive performance in computer and browser tasks, demonstrating its potential as a general-purpose executor.'}, 'zh': {'title': 'Qwen-UI-Agent：跨平台的智能执行者', 'desc': '本论文介绍了一种名为Qwen-UI-Agent的图形用户界面（GUI）代理，旨在实现跨平台的自动化任务执行。该代理结合了图形用户界面操作和命令行接口（CLI）执行，能够在真实设备上可靠地运行。通过在线强化学习（RL），Qwen-UI-Agent能够在超过100个回合的轨迹上进行训练，并在多个环境中加速推广。评估结果显示，该代理在移动设备和计算机任务上均表现出色，超越了现有的前沿模型。'}}}, {'id': 'https://huggingface.co/papers/2607.26760', 'title': 'Metis: Memory Foundation Model', 'url': 'https://huggingface.co/papers/2607.26760', 'abstract': 'Abstract  Recent advances in AI agents have increasingly internalized native capabilities into their underlying foundation models, giving rise to multimodal foundation models and large reasoning models. However, agent memory is still primarily implemented through external modules, leaving the native memory capability largely unexplored. In this paper, we take a first step toward this direction by introducing memory foundation models, which empower foundation models with native memory capabilities. We formalize native memory from two perspectives: a persistent and dynamically evolving memory state within the backbone, and native memory procedures that autonomously store and utilize information through model computation. We show that native memory offers advantages in architecture, end-to-end optimization, and efficiency. Based on this formulation, we propose Metis, the first prototype of memory foundation models. Metis introduces a new architecture that equips a foundation model with a native memory state, allowing historical information to be compressed into the model and accessed through memory attention. We construct large-scale memory-specific training data and introduce multiple optimization objectives to acquire these native memory procedures through mid-training. The online memory maintenance of Metis is gradient-free, and the memory update requires only a forward pass. At inference time, all learned model weights remain frozen, while the native memory states are autonomously transformed through standard forward computation. Through extensive experiments, we show that Metis exhibits native memory capabilities and further provide a detailed analysis of its strengths, limitations, and behaviors. To facilitate future research on memory foundation models, we release our project and model checkpoints.', 'score': 212, 'issue_id': 2809, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '8fe8b933e3e8ff4f', 'authors': ['Zeyu Zhang', 'Ziliang Guo', 'Yihang Sun', 'Xichong Zhang', 'Xixuan Hao', 'Zehao Lin', 'Yang Zhang', 'Xiaoyan Zhao', 'Tong Shen', 'Bo Tang', 'Zhi-Qin John Xu', 'Junchi Yan', 'Haofen Wang', 'Xu Chen', 'Feiyu Xiong', 'Zhiyu Li', 'Tat-Seng Chua'], 'affiliations': ['MemTensor (Shanghai) Technology Co., Ltd.', 'National University of Singapore', 'Renmin University of China', 'Shanghai Jiao Tong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26760.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#agents', '#architecture', '#training', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Встроенная память в фундаментальных моделях вместо внешних хранилищ', 'desc': 'Статья представляет память foundation models — подход, который встраивает возможности памяти непосредственно в архитектуру большой языковой модели вместо использования внешних модулей. Авторы формализуют нативную память как персистентное и динамически развивающееся состояние внутри backbone модели, а также процедуры, которые автономно сохраняют и используют информацию через вычисления модели. Предложенная система Metis — первый прототип, который использует специальный механизм attention для доступа к сжатой исторической информации и обновляет память градиентно-свободным способом при выводе. Такой подход обеспечивает преимущества в архитектуре, сквозной оптимизации и эффективности использования ресурсов по сравнению с традиционными агентскими системами.'}, 'en': {'title': 'Empowering AI with Native Memory: Introducing Metis', 'desc': 'This paper introduces memory foundation models, which enhance traditional foundation models by integrating native memory capabilities directly into their architecture. The authors define native memory as a persistent and evolving memory state that allows models to autonomously store and retrieve information during computation. They present Metis, a prototype that utilizes memory attention to access historical data, improving efficiency and optimization. Through experiments, the paper demonstrates the advantages of native memory in model performance and provides insights into its strengths and limitations.'}, 'zh': {'title': '赋予基础模型原生记忆能力的创新之路', 'desc': '本文介绍了一种新的记忆基础模型，旨在为基础模型赋予原生记忆能力。我们从持久和动态演变的记忆状态以及自主存储和利用信息的记忆过程两个方面对原生记忆进行了形式化定义。通过提出Metis原型，我们展示了如何将历史信息压缩到模型中，并通过记忆注意力进行访问。实验结果表明，Metis在架构、端到端优化和效率方面具有显著优势。'}}}, {'id': 'https://huggingface.co/papers/2607.28618', 'title': 'AskChem: Claim-Centered Infrastructure for Chemistry Literature Synthesis', 'url': 'https://huggingface.co/papers/2607.28618', 'abstract': 'Abstract  Chemistry literature synthesis often requires assembling specific findings scattered across many publications, yet existing literature-search systems primarily return ranked document lists. As a result, scientists and AI agents need to locate relevant information, verify their provenance, and assemble cross-paper answers manually. We present AskChem, a claim-centered infrastructure for cross-paper chemistry search. AskChem changes the unit of retrieval from the paper to the provenance-carrying claim: each paper is converted into atomic, typed claims, each grounded by a source DOI and a verbatim quote or an explicit evidence locator. Over this shared claim store, AskChem exposes complementary structures for search and synthesis: a stabilized faceted taxonomy for hierarchical retrieval and browsing, an evidence graph linking claims through relations, and an exploratory living taxonomy that situates indexed papers under scientific principles. AskChem currently indexes 2.4M claims from 147K papers and provides a web interface, as well as REST, SDK, and MCP access for AI agents. On AskChem-Bench, grounding a GPT-5.5 reader in AskChem yields 100% resolvable DOIs, compared with 88.3% without retrieval, and the highest citation density among five tested systems. AskChem is live at https://askchem.org.', 'score': 199, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'd12e8ba3d5295a02', 'authors': ['Bing Yan', 'Gregory Wolfe', 'Stefano Martiniani', 'Kyunghyun Cho'], 'affiliations': ['New York University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28618.jpg', 'data': {'categories': ['#science', '#open_source'], 'emoji': '🧪', 'ru': {'title': 'От поиска статей к поиску проверенных утверждений в химии', 'desc': 'В статье представлена система AskChem для поиска информации в химической литературе на основе утверждений (claims) вместо полных статей. Каждая научная работа разбивается на атомарные типизированные утверждения, снабженные ссылками на источники и прямыми цитатами, которые хранятся в единой базе данных. Система предоставляет несколько способов поиска и синтеза информации: иерархическую таксономию для просмотра, граф связей между утверждениями и динамическую таксономию, группирующую статьи по научным принципам. Экспериментальные результаты показывают, что использование AskChem как источника информации для LLM значительно повышает надежность и точность цитирования по сравнению с прямым поиском.'}, 'en': {'title': 'Revolutionizing Chemistry Literature Search with Claim-Centered Retrieval', 'desc': 'This paper introduces AskChem, a novel system designed to improve the search and synthesis of chemistry literature by focusing on specific claims rather than entire papers. It transforms each publication into atomic claims that are linked to their sources, allowing for more precise retrieval of information. AskChem features a structured approach to searching, including a faceted taxonomy and an evidence graph that connects related claims. The system has indexed millions of claims and demonstrates superior performance in grounding AI models compared to traditional literature search methods.'}, 'zh': {'title': 'AskChem：化学文献的智能搜索新方式', 'desc': '本论文介绍了AskChem，一个针对化学文献的跨论文搜索基础设施。它将文献检索的单位从整篇论文转变为具体的、带有来源的声明，使得科学家和AI代理能够更方便地找到相关信息。AskChem提供了一个稳定的分面分类法、证据图和探索性分类法，帮助用户进行层次检索和浏览。目前，AskChem已索引240万条声明，显著提高了信息检索的效率和准确性。'}}}, {'id': 'https://huggingface.co/papers/2607.28624', 'title': 'PhiZero: A World Model Built Around Physical Language', 'url': 'https://huggingface.co/papers/2607.28624', 'abstract': "Abstract  We introduce PhiZero, a physical world model built around physical language, a compact discrete representation of world-state transitions. Existing physical world models typically predict future videos directly in pixel space, leaving the underlying world dynamics implicit within high-dimensional visual predictors. Motivated by humans' ability to abstract predictive structure from visual experience and organize it in natural language for explicit reasoning, we learn physical language from in-the-wild videos through self-supervision and use it to explicitly reason about how the physical world evolves. Accordingly, PhiZero adopts a reason-then-render paradigm: it first infers future world evolution as a physical-language sequence and then renders the inferred transitions into videos. Extensive experiments across generation and understanding benchmarks validate the ability of PhiZero to model physically coherent world evolution. We further show its potential for realistic and interactive world modeling, fine-grained action-conditioned simulation, and zero-shot motion transfer.", 'score': 148, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '8fc6a1e385a689be', 'authors': ['Shuyao Shang', 'Yuqi Wang', 'Ruopeng Gao', 'Xu Chen', 'Tieniu Tan', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['NLPR, Institute of Automation, Chinese Academy of Sciences (CASIA)'], 'pdf_title_img': 'assets/pdf/title_img/2607.28624.jpg', 'data': {'categories': ['#video', '#training', '#multimodal', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Физический язык для явного рассуждения о динамике мира', 'desc': 'В работе представляется PhiZero - модель физического мира, которая использует физический язык как компактное дискретное представление переходов состояний мира. В отличие от существующих подходов, которые предсказывают будущие видеокадры непосредственно в пиксельном пространстве, PhiZero сначала выполняет явное рассуждение об эволюции мира через последовательность токенов физического языка, а затем генерирует видео на основе этих предсказаний. Физический язык изучается из видеоданных в условиях самообучения, что позволяет явно кодировать динамику физического мира. Экспериментальные результаты демонстрируют эффективность подхода для генерации физически согласованных видеопоследовательностей, интерактивного моделирования окружающей среды и трансфера движений без обучения.'}, 'en': {'title': 'Reasoning About the Physical World with Language', 'desc': 'PhiZero is a new model that uses a special language to understand and predict how the physical world changes over time. Unlike traditional models that directly predict future images, PhiZero first describes future events in a compact language, making it easier to reason about the dynamics of the world. This approach allows the model to learn from real videos without needing labeled data, using self-supervision to improve its understanding. The results show that PhiZero can effectively simulate realistic scenarios and adapt to new actions without prior examples.'}, 'zh': {'title': 'PhiZero：用物理语言推理世界演变', 'desc': 'PhiZero 是一种基于物理语言的物理世界模型，它使用紧凑的离散表示来描述世界状态的变化。与传统的物理世界模型直接在像素空间预测未来视频不同，PhiZero 通过自我监督从真实视频中学习物理语言，以便明确推理物理世界的演变。该模型采用先推理后渲染的方式，首先推断未来的世界演变为物理语言序列，然后将推断的变化渲染为视频。实验结果表明，PhiZero 能够有效建模物理一致的世界演变，并在现实和交互式世界建模、细粒度动作条件模拟以及零样本运动转移方面展现出潜力。'}}}, {'id': 'https://huggingface.co/papers/2607.28568', 'title': 'Frontis-MA1: Training an AI4AI Model towards Recursive Self-Improvement in Machine Learning Engineering', 'url': 'https://huggingface.co/papers/2607.28568', 'abstract': 'Abstract  Recursive self-improvement (RSI) requires AI systems that improve the process of building AI (i.e., AI4AI); machine learning engineering (MLE) offers a concrete, executable testbed for studying this capability. We introduce OpenMLE, an open full-stack system for RSI research in MLE, spanning verifiable task environments with execution feedback (OpenMLE-Gym), operator learning (OpenMLE-RL), and long-horizon search (OpenMLE-Evo). On this stack we post-train Frontis-MA1 (35B) as a meta-evolution agent for MLE, aligning post-training and inference around four atomic program-evolution operators (Draft, Improve, Debug, Crossover): the same operators are trained via execution-grounded SFT and RL on data deduplicated against all evaluation benchmarks, then composed into long-horizon search, coupling learning and evolution in a single loop. On MLE-Bench Lite under a 12-hour per-task budget on one RTX 4090 capped at 12 GB VRAM, Frontis-MA1 (35B) improves Medal Average from 39.39% to 60.61% over its base model with OpenMLE-Evo, and reaches 71.21% with OpenMLE-Evo-Max (benchmark-independent experience priors and asynchronous search), exceeding GPT-5.5 + Codex and approaching GPT-5.6 Sol and the 2.8T Kimi K3. On held-out NatureBench Lite, both components transfer: with the framework fixed, swapping in the trained model raises Match-SOTA from 50% to 70%; with the model fixed, swapping in OpenMLE-Evo raises it from 20% to 50%. We release the model weights and the full OpenMLE stack to enable reproducible research on executable AI4AI toward RSI. Code: https://github.com/FrontisAI/OpenRSI', 'score': 121, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'd17033e76e1d52dc', 'authors': ['Junlin Yang', 'Che Jiang', 'Yu Fu', 'Tianwei Luo', 'Can Ren', 'Weizhi Wang', 'Kaikai Zhao', 'Hongyi Liu', 'Yuxin Zuo', 'Yuru Wang', 'Yuchen Fan', 'Kai Tian', 'Zhenzhao Yuan', 'Xiaojian Lin', 'Li Sheng', 'Rushi Qiang', 'Guoli Jia', 'Xingtai Lv', 'Ermo Hua', 'Dianqiao Lei', 'Youbang Sun', 'Ning Ding', 'Bowen Zhou', 'Kaiyan Zhang'], 'affiliations': ['Frontis.AI', 'Horizon Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.28568.jpg', 'data': {'categories': ['#transfer_learning', '#plp', '#open_source', '#rl', '#agi', '#benchmark', '#dataset', '#agents', '#training', '#optimization'], 'emoji': '🧬', 'ru': {'title': 'Самообучающиеся AI системы через эволюцию программ', 'desc': 'В работе представлена OpenMLE — полнофункциональная система для исследования рекурсивного самоулучшения AI4AI в контексте машинного обучения. Авторы обучили большую языковую модель Frontis-MA1 (35B) в качестве мета-агента эволюции, используя четыре атомарные операторы эволюции программ (Draft, Improve, Debug, Crossover), которые тренировались через supervised fine-tuning и reinforcement learning на выполняемом коде. Система достигает значительного улучшения метрик на бенчмарке MLE-Bench Lite, превосходя некоторые версии GPT и демонстрируя успешную передачу знаний на отложенные тесты. Авторы открыли веса модели и весь стек OpenMLE для воспроизводимых исследований в области автоматического проектирования AI систем.'}, 'en': {'title': 'Empowering AI through Recursive Self-Improvement with OpenMLE', 'desc': 'This paper presents OpenMLE, a comprehensive system designed for researching recursive self-improvement (RSI) in machine learning engineering (MLE). It includes components like OpenMLE-Gym for task environments, OpenMLE-RL for operator learning, and OpenMLE-Evo for long-horizon search, all aimed at enhancing AI development processes. The authors demonstrate the effectiveness of their approach by post-training the Frontis-MA1 model, which significantly improves performance on various benchmarks through a combination of program-evolution operators. The results show that their system not only surpasses existing models but also facilitates reproducible research in AI4AI.'}, 'zh': {'title': '推动人工智能自我改进的全新系统', 'desc': '递归自我改进（RSI）需要能够提升人工智能构建过程的系统。我们提出了OpenMLE，这是一个用于机器学习工程（MLE）研究的开放全栈系统，包含可验证的任务环境和执行反馈。通过在这个系统上对Frontis-MA1进行后训练，我们实现了一个元进化代理，能够在程序进化的四个基本操作上进行学习和演化。我们的实验结果显示，Frontis-MA1在多个基准测试中显著提高了性能，推动了可执行的AI4AI研究。'}}}, {'id': 'https://huggingface.co/papers/2607.27380', 'title': 'VideoCoCo: Code-as-CoT for Physically-Consistent Video Generation via an Agentic Dual-Engine System', 'url': 'https://huggingface.co/papers/2607.27380', 'abstract': 'Abstract  Text-to-video models have achieved remarkable visual quality, yet they still struggle to generate physically consistent dynamics because the temporal evolution of a scene must be inferred implicitly from a highly compressed text prompt. Existing chain-of-thought approaches introduce intermediate plans or visual states, but these representations are typically non-executable or temporally sparse, limiting their ability to instantiate and control the complete spatiotemporal process. To address this limitation, we introduce VideoCoCo, an agentic dual-engine framework in which executable Blender code serves as a process-level chain of thought. Given a text prompt, a coding agent synthesizes a Blender program that explicitly specifies the scene and its temporal evolution. The executable simulation engine runs the program to produce a deterministic spatiotemporal draft, which is subsequently transformed into a photorealistic video by a generative video engine through draft-conditioned editing. This decomposition separates process-level reasoning from high-fidelity visual realization. To adapt the video editor to simulated drafts, we construct VideoCoCo-3K, a curated dataset of draft-instruction-target triplets. VideoCoCo improves the OmniWeaving baseline from 0.475 to 0.558 on PhyGenBench and from 52.18 to 77.88 on VBench-2.0, achieving the best average score on both benchmarks. These results demonstrate that executable code provides an effective, controllable, and inspectable intermediate representation for physically consistent video generation.', 'score': 61, 'issue_id': 2809, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '1c70a233cdc48301', 'authors': ['Haodong Li', 'Tianfei Ren', 'Xiaoxiao Ma', 'Chunmei Qing', 'Zhen Fang', 'Sipeng He', 'Ziyu Guo', 'Haoyu Wu', 'Juanxi Tian', 'Yihang Zou', 'Ruichuan An', 'Dongzhi Jiang', 'Boxue Yang', 'Ji Xie', 'Xu Huang', 'Wenhao Yan', 'Jialv Zou', 'Zhengrong Yue', 'Yaxin Luo', 'Xiaotong Li', 'Yuzhu Wang', 'Junyan Ye', 'Jinjing Zhao', 'Zehui Chen', 'Lin Chen', 'Renye Yan', 'Feng Zhao', 'Pheng-Ann Heng'], 'affiliations': ['CMU', 'CUHK', 'HKU', 'HUST', 'MBZUAI', 'NTU', 'PKU', 'SCUT', 'SJTU', 'THU', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2607.27380.jpg', 'data': {'categories': ['#video', '#dataset', '#agents', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Исполняемый код как мост между рассуждением и фотореалистичным видео', 'desc': 'В этой работе предложена система VideoCoCo для генерации видео из текстовых описаний с физически корректной динамикой. Авторы используют исполняемый код Blender как промежуточное представление, где агент-кодер синтезирует программу, явно описывающую сцену и её временную эволюцию. Полученный детерминированный черновик затем преобразуется в фотореалистичное видео с помощью диффузионной модели видео-редактора. Авторы создали специальный датасет VideoCoCo-3K и добились значительного улучшения показателей на бенчмарках PhyGenBench и VBench-2.0.'}, 'en': {'title': 'Executable Code for Consistent Video Generation', 'desc': 'This paper presents VideoCoCo, a novel framework for generating videos from text prompts that improves physical consistency in the generated scenes. It utilizes an agentic dual-engine approach where a coding agent creates executable Blender code to define the scene and its dynamics explicitly. This code is then run by a simulation engine to produce a draft video, which is refined into a high-quality output by a generative video engine. The results show that this method significantly enhances performance on benchmark tests, demonstrating the effectiveness of using executable code for video generation.'}, 'zh': {'title': '可执行代码提升视频生成质量', 'desc': '本文介绍了一种名为VideoCoCo的文本到视频生成模型，旨在解决现有模型在生成物理一致动态方面的不足。通过引入可执行的Blender代码作为过程级思维链，该模型能够明确指定场景及其时间演变。生成的程序通过模拟引擎运行，产生确定性的时空草图，随后由生成视频引擎进行编辑，转化为高保真视频。这种分解方法有效地将过程级推理与高保真视觉实现分开，提升了视频生成的质量和控制能力。'}}}, {'id': 'https://huggingface.co/papers/2607.27919', 'title': 'Memory Decoder at Scale: A Pretrained, Parametric Long-Term Memory', 'url': 'https://huggingface.co/papers/2607.27919', 'abstract': 'Abstract  Decoder-only language models entangle long-term memory and reasoning in a single parameter set, making it difficult to scale memory capacity independently. Memory Decoder introduces a parametric long-term memory module but only studies it at a relatively small scale. In this work, we present Memory Decoder at Scale, scaling memory models up to 6.9B parameters and pretraining them on 300B tokens. At this data scale, the combined cost of indexing and search makes a standard Faiss pipeline infeasible. We address this bottleneck with a distributed pipeline for Faiss indexing and retrieval, together with sparse, batch-wise loading of kNN distributions. Across model scales, we find that allocating more parameters to memory yields a better parameter-performance tradeoff than scaling the base model alone. On 17 benchmarks, pairing a 6.9B general memory with Pythia-410M raises its average score from 29.86 to 37.34, surpassing Pythia-12B (37.24) with 39% fewer total parameters. For Qwen3 Base models ranging from 0.6B to 14B, 1.7B domain memories improve the average score across the three domains by more than 9 points at every scale. Overall, our results demonstrate that independently scaling pretrained memory offers a more parameter efficient path to improving language model performance.', 'score': 45, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6bb48ff2b827e2d4', 'authors': ['Rubin Wei', 'Jiaqi Cao', 'Jiarui Wang', 'Junming Zhang', 'Qipeng Guo', 'Bowen Zhou', 'Zhouhan Lin'], 'affiliations': ['Electronic Engineering, Tsinghua University', 'LUMIA Lab, School of Artificial Intelligence, Shanghai Jiao Tong University', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.27919.jpg', 'data': {'categories': ['#benchmark', '#architecture', '#long_context', '#training', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Независимое масштабирование памяти как путь к эффективным языковым моделям', 'desc': 'Статья представляет улучшенную версию Memory Decoder, которая отделяет долгосрочную память от рассуждений в языковых моделях. Авторы масштабировали модель до 6.9 млрд параметров и обучали на 300 млрд токенов, решив проблему производительности индексирования через распределённый pipeline для Faiss. Результаты показывают, что выделение большего количества параметров для модуля памяти даёт лучший компромисс производительность-размер, чем простое увеличение основной модели. Добавление специализированной памяти позволило 410-миллионной модели Pythia превзойти 12-миллиардную версию, используя на 39% меньше параметров.'}, 'en': {'title': 'Unlocking Language Model Potential with Scalable Memory', 'desc': "This paper introduces the Memory Decoder at Scale, which enhances language models by integrating a long-term memory module that can be scaled independently from the model's reasoning capabilities. The authors pretrain this model on a massive dataset of 300 billion tokens, utilizing a distributed pipeline to efficiently handle memory indexing and retrieval. Their findings show that increasing the memory parameters leads to better performance compared to simply enlarging the base model. The results indicate that optimizing memory allocation can significantly improve language model effectiveness while using fewer total parameters."}, 'zh': {'title': '独立扩展记忆，提升语言模型性能', 'desc': '本文提出了一种新的记忆解码器模型，旨在解决传统语言模型在长时记忆和推理能力上的限制。通过引入一个参数化的长期记忆模块，研究者们在大规模数据集上对其进行了预训练，参数规模达到6.9亿。研究表明，增加记忆参数的分配比单纯扩大基础模型的参数更能有效提升模型性能。实验结果显示，结合记忆模块的模型在多个基准测试中表现优于传统模型，证明了独立扩展预训练记忆的有效性。'}}}, {'id': 'https://huggingface.co/papers/2607.28595', 'title': 'Beacon: Knowing When and How to Perform Agentic Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.28595', 'abstract': "Abstract  The fundamental goal of agentic visual reasoning is to improve the success rate of multimodal large language models (MLLMs) on complex tasks, rather than merely equipping them with a sophisticated yet inefficient reasoning paradigm. In this work, we rethink agentic visual reasoning through two key dimensions of tool use: Mode Adaptiveness (MA) and Tool Effect (TE). Mode Adaptiveness characterizes whether an MLLM can recognize when tools are truly necessary and invoke them accordingly, thereby avoiding unnecessary computational overhead while improving performance on challenging problems that require tool assistance. Tool Effect characterizes the actual impact of tool use: tools should extend the model's capabilities on problems unsolvable through text-only reasoning, while avoiding additional errors on problems that the model can already solve without tools. We conduct a comprehensive analysis to quantify these two properties and empirically reveal that existing agentic visual reasoning models exhibit limited Mode Adaptiveness, while the gains produced by tool use on hard examples are largely offset by the harm introduced on easy examples that the models can already solve. Motivated by these observations, we propose Beacon, a novel agentic visual reasoning model that achieves stronger overall performance, improved Mode Adaptiveness, and genuine tool-induced performance gains. At the core of Beacon are the Necessity-Aware Adaptive Reward and the Hint-Guided Capability Expansion mechanism in the reinforcement learning stage, which respectively encourage adaptive tool invocation based on task necessity and strengthen the model's tool-use capability on the most challenging problems. Extensive experiments across diverse benchmarks demonstrate the strong overall performance of Beacon and its substantial improvements in both Mode Adaptiveness and Tool Effect.", 'score': 44, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '0824a88682183715', 'authors': ['Qixun Wang', 'Yang Shi', 'Letian Cheng', 'Zhuoran Zhang', 'Yan He', 'Yuqi Tang', 'Qi Zhang', 'Xinlei Yu', 'Ruizhe Chen', 'Tianrun Xu', 'Yuanxing Zhang', 'Pengfei Wan', 'Haotian Wang', 'Xianghua Ying'], 'affiliations': ['CUHK', 'HKUST(GZ)', 'Kling Team', 'Peking University', 'THU', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2607.28595.jpg', 'data': {'categories': ['#reasoning', '#rl', '#benchmark', '#multimodal', '#agents', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное использование инструментов в визуальном рассуждении мультимодальных моделей', 'desc': 'Статья исследует проблему адаптивного использования инструментов в мультимодальных больших языковых моделях (МЛЛМ) для визуального рассуждения. Авторы выявляют два ключевых аспекта: способность модели правильно определять, когда инструменты действительно необходимы, и реальное воздействие их применения на решение задач. Они показывают, что существующие агентные модели плохо адаптируются к необходимости инструментов и часто причиняют вред на легких примерах, нейтрализуя выигрыш на сложных. Авторы предлагают Beacon — модель с механизмами для адаптивного вызова инструментов и расширения способностей на основе подкрепления.'}, 'en': {'title': 'Enhancing MLLMs with Smart Tool Use for Better Reasoning', 'desc': 'This paper focuses on enhancing the performance of multimodal large language models (MLLMs) in complex tasks through improved agentic visual reasoning. It introduces two important concepts: Mode Adaptiveness, which allows models to determine when to use tools effectively, and Tool Effect, which measures the actual benefits of tool usage. The authors analyze existing models and find that they struggle with Mode Adaptiveness and often introduce errors when using tools on simpler tasks. To address these issues, they propose a new model called Beacon, which incorporates mechanisms to better adapt tool usage based on necessity and improve performance on challenging problems.'}, 'zh': {'title': '提升多模态模型的视觉推理能力', 'desc': '本文探讨了代理视觉推理的基本目标，即提高多模态大型语言模型（MLLMs）在复杂任务上的成功率。我们通过工具使用的两个关键维度：模式适应性（MA）和工具效应（TE）重新思考代理视觉推理。模式适应性描述了MLLM是否能够识别工具的真正必要性并相应地调用它们，从而避免不必要的计算开销。我们提出了Beacon模型，旨在提高整体性能、改善模式适应性，并实现真正的工具引导性能提升。'}}}, {'id': 'https://huggingface.co/papers/2607.26497', 'title': 'BM25 Wins at Scale: A Scaling Study of Retrieval-Augmented Generation Paradigms', 'url': 'https://huggingface.co/papers/2607.26497', 'abstract': 'Abstract  Retrieval-augmented generation (RAG) spans lexical and dense retrieval, graph-based indexing, and agentic search, but these paradigms are usually evaluated on different benchmarks at one corpus size, leaving their accuracy-cost scaling unclear. To bridge this gap, we present a controlled study that varies corpus size along 28 strictly nested tiers spanning roughly 450-fold, while holding questions and a fixed bedrock of relevant and adversarial documents unchanged. Under one reader model and one judging protocol, we measure official accuracy, construction and query tokens, and latency. The results reveal a scale-dependent crossover rather than an unconditional winner. File-System Agent leads at the smallest shared tiers, but its sequential exploration costs 39 times more query tokens at the bedrock and becomes less effective as the search space grows. Around 10 million corpus tokens, BM25 overtakes it and leads at every larger shared tier, with a margin approaching 20 points at full scale. BM25 also anchors the low-cost end of the Pareto frontier without LLM-based construction. Dense retrieval remains efficient but less accurate, whereas graph-based RAG encounters construction walls before deployment scale and its scalable variants remain below BM25 at shared tiers. Overall, corpus growth increasingly favors global candidate ranking: lexical retrieval is the strongest scalable default, while agentic reasoning works best after ranked discovery rather than in place of it.', 'score': 38, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '43f68b108bd8df56', 'authors': ['Pengyu Wang', 'Benfeng Xu', 'Shaohan Wang', 'Xin Zeng', 'Huarui Wu', 'Lei Zhang', 'Licheng Zhang'], 'affiliations': ['Information Technology Research Center, Beijing Academy of Agriculture and Forestry Sciences', 'Metastone Technology', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.26497.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rag', '#optimization'], 'emoji': '📊', 'ru': {'title': 'Масштаб данных определяет выбор: от агентного поиска к лексическому ранжированию', 'desc': 'В этой работе проводится контролируемое исследование различных подходов к поиску и генерации, дополненной информацией (RAG), включая лексический и плотный поиск, поиск на графах и агентный поиск. Авторы систематически варьируют размер корпуса на 28 уровнях, охватывающих примерно 450-кратное увеличение, при этом сохраняя неизменными вопросы и набор релевантных документов. Результаты показывают, что с ростом объёма данных происходит переход от агентного поиска к лексическому методу BM25, который становится доминирующим при корпусах размером свыше 10 миллионов токенов. Исследование демонстрирует, что оптимальный выбор метода поиска зависит от масштаба корпуса, и рекомендует использовать лексический поиск как надёжный базовый подход, применяя агентное рассуждение после ранжирования кандидатов.'}, 'en': {'title': 'Scaling Retrieval: BM25 Triumphs in Large Corpora', 'desc': 'This paper investigates the performance of different retrieval-augmented generation (RAG) methods as the size of the document corpus increases. It conducts a controlled study to measure accuracy, token usage, and latency across various retrieval techniques, including lexical and dense retrieval. The findings indicate that while File-System Agent performs well with smaller datasets, BM25 becomes more effective as the corpus grows, outperforming other methods at larger scales. The study concludes that lexical retrieval is the most scalable approach, while agentic reasoning is more beneficial after initial ranked retrieval rather than as a replacement.'}, 'zh': {'title': '词汇检索是可扩展的最佳选择', 'desc': '这篇论文探讨了检索增强生成（RAG）在不同语料库规模下的表现，比较了词汇检索、密集检索和基于图的索引等方法的准确性和成本。研究显示，随着语料库规模的增加，BM25方法在准确性上超越了其他方法，尤其是在大规模数据集上表现优异。尽管密集检索在效率上仍然不错，但准确性较低，而基于图的RAG在扩展时遇到构建瓶颈。总体而言，随着语料库的增长，词汇检索成为最强的可扩展默认选择，而智能推理在经过排名发现后效果最佳。'}}}, {'id': 'https://huggingface.co/papers/2607.28022', 'title': 'Flux-OPD: On-Policy Distillation with Evolving Contexts', 'url': 'https://huggingface.co/papers/2607.28022', 'abstract': 'Abstract  Large language model training in open-ended domains lacks verifiable rewards, making task preferences difficult to formalize as effective supervision. Contexts can convey such preferences, yet provide little additional supervision once distilled into the student, motivating contexts that evolve with student performance. However, directly using evolving contexts as in-training supervision results in an unstable distillation target and conflicting distributions, requiring mechanisms to stabilize target and downweight conflicts. In this paper, we analyze the effect of contexts through a decomposition of the reverse KL objective, revealing two findings: the student is distilled toward the geometric mean of context-conditioned teachers, and the objective contains a conflict term that measures conflicts among these teachers. Based on this decomposition, we propose Flux-OPD, an OPD paradigm that uses evolving contexts as in-training supervision to capture task preferences in open-ended domains. Flux-OPD treats the differences between context-conditioned and context-free teachers as contextual difference signals, injects them as contextual corrections into the context-free teacher anchor, and weights their correction strength using the conflict term as an indicator. Experiments on open-ended tasks show that Flux-OPD outperforms existing OPD paradigms, highlighting the potential to combine teacher supervision with evolving contexts.', 'score': 36, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '0fba93f3c40a4504', 'authors': ['Yuran Wang', 'Zekun Wang', 'Bohan Zeng', 'Ruixu Zhang', 'Wenxuan Liu', 'Liu Yang', 'Yifan Dai', 'Yang Shi', 'Bozhou Li', 'Chengzhuo Tong', 'Daili Hua', 'Yuanxing Zhang', 'Wentao Zhang'], 'affiliations': ['Beijing Key Laboratory of Data Intelligence and Security', 'Kling Team', 'Peking University', 'Shanghai Jiao Tong University', 'Tsinghua University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2607.28022.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Эволюционирующие контексты для стабильного обучения без явных наград', 'desc': 'В статье предложен новый метод обучения больших языковых моделей в открытых задачах, где сложно определить явные награды за качество. Авторы анализируют, как контексты (дополнительная информация о предпочтениях) влияют на дистилляцию знаний от учителя к ученику через декомпозицию обратной KL дивергенции. Они показали, что студент обучается на геометрическое среднее учителей, обусловленных контекстом, и выявили конфликт между разными контекстными распределениями. На основе этого анализа авторы предложили Flux-OPD — метод, который использует эволюционирующие контексты как сигналы обучения, взвешивая их влияние через меру конфликта для стабилизации процесса.'}, 'en': {'title': 'Harnessing Evolving Contexts for Better Language Model Training', 'desc': 'This paper addresses the challenge of training large language models in open-ended domains where clear rewards are hard to define. It introduces a method called Flux-OPD that uses evolving contexts to guide the training process, allowing the model to better understand task preferences. The authors analyze how these contexts can create conflicts among different teacher models and propose a way to stabilize the training by adjusting the influence of these conflicts. Experiments demonstrate that Flux-OPD significantly improves performance compared to traditional methods by effectively integrating contextual information into the learning process.'}, 'zh': {'title': '动态上下文引导任务偏好的新方法', 'desc': '这篇论文探讨了在开放领域中训练大型语言模型时，如何有效地利用上下文来指导学习。由于缺乏可验证的奖励，任务偏好难以形式化为有效的监督。作者提出了一种名为Flux-OPD的新方法，通过动态上下文作为训练监督，捕捉任务偏好。实验结果表明，Flux-OPD在开放任务上优于现有的OPD范式，展示了结合教师监督与动态上下文的潜力。'}}}, {'id': 'https://huggingface.co/papers/2607.27616', 'title': 'MPIE-Bench: Benchmarking Anatomically Plausible Multi-Person Interaction Editing', 'url': 'https://huggingface.co/papers/2607.27616', 'abstract': 'Abstract  Text-to-image and personalized editing models now synthesize high-fidelity single-subject images with ease. Yet placing multiple named people into shared contact actions such as embrace, carry, or grapple still exposes major failures: fused limbs, invented extremities, and interpenetrating bodies. Existing evaluations largely overlook these anatomical and geometric issues, and VLM-as-a-judge checklists often saturate on Interaction while the errors remain obvious to humans. We introduce MPIE-Bench, a 2,500-sample benchmark of video-mined editing triplets spanning 405 scenes, 14 interaction categories, and four contact densities (C0-C3). We also propose MPIE-Eval, whose two new axes score contact-time geometry from a frozen public multi-person mesh reconstruction. Anatomy asks whether every human-like mass is explained by a complete set of reconstructed bodies, and Interaction asks whether the penetration and surface distance between those bodies match the contact the instruction asked for. Across ten editors, mesh Anatomy tops out at 0.65 and mesh Interaction at 0.72 on two different models, so no single editor is strong on both, while VLM checklists rate the same images above 0.95. A five-rater study confirms that both axes track human judgement more closely than a zero-shot VLM judge, and the rankings hold under ablation of every weight and threshold.', 'score': 35, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '0cec8a540b31d04f', 'authors': ['Jiajia Lin', 'Mingxuan Du', 'Tuowen Zhou', 'Benfeng Xu', 'Hongtao Xie'], 'affiliations': ['Metastone Technology, Beijing, China', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27616.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#cv'], 'emoji': '🤝', 'ru': {'title': 'Честная оценка синтеза взаимодействующих людей через 3D-геометрию', 'desc': 'Статья представляет MPIE-Bench — бенчмарк из 2500 видео-образцов для оценки качества синтеза изображений с несколькими людьми в физическом контакте. Авторы предлагают MPIE-Eval, новую метрику оценки, которая использует реконструкцию 3D-моделей человеческих тел для проверки анатомической корректности и геометрии взаимодействия. Существующие VLM-судьи переоценивают качество синтеза, давая высокие оценки изображениям с видимыми ошибками — скрещенными конечностями и пересекающимися телами. Предложенная метрика показывает, что современные генеративные модели достигают максимум 0.65-0.72 по новым критериям, что значительно ниже оценок VLM и лучше соответствует человеческому восприятию.'}, 'en': {'title': 'Improving Multi-Person Interaction in Image Synthesis', 'desc': 'This paper addresses the challenges in generating images of multiple people interacting in realistic ways using text-to-image models. It highlights common issues such as fused limbs and incorrect body positioning that occur during these interactions. The authors introduce MPIE-Bench, a new benchmark with 2,500 samples to evaluate these interactions across various scenarios and contact types. They also propose MPIE-Eval, which assesses the accuracy of body reconstructions and interactions, showing that current models struggle to perform well on both anatomy and interaction metrics.'}, 'zh': {'title': '提升多人物交互图像生成的评估标准', 'desc': '本文介绍了一个新的基准测试MPIE-Bench，旨在评估文本到图像生成模型在多人物交互场景中的表现。尽管现有模型能够生成高质量的单一主体图像，但在处理多个命名人物的接触动作时仍然存在显著问题，如肢体融合和身体重叠。我们提出的MPIE-Eval通过分析接触时间几何和解剖结构，提供了更准确的评估标准。研究表明，基于网格的解剖和交互评分比现有的VLM评估方法更能反映人类的判断。'}}}, {'id': 'https://huggingface.co/papers/2607.28625', 'title': 'ACE-Data-0: Human-Centric Ambient Capture as Embodied Data Engine', 'url': 'https://huggingface.co/papers/2607.28625', 'abstract': 'Abstract  Embodied intelligence faces a fundamental data bottleneck. Models must capture how first-person perception, whole-body motion, dexterous manipulation, object state, sound, and touch evolve together as humans pursue goals over time. Existing datasets fragment this experience across viewpoints, modalities, or spatial scales, leaving the full perception-action loop only partially observed. We introduce the Ambient Capture Engine (ACE), a human-centric data engine that transforms real home environments into spatially calibrated, temporally synchronized recording studios. ACE operates at two complementary scales: a table-scale configuration resolves hand-object manipulation, while a room-scale configuration captures whole-body motion, locomotion, and interactions across a furnished home. ACE records egocentric and multi-view exocentric video, full-body and articulated hand motion, object geometry and 6-DoF trajectories, audio, and tactile signals as a unified multisensory stream. Using ACE, we build ACE-Data-0, comprising 150 hours and 17M video frames across 200 task categories, performed by 50 participants in 2 environments, for a total of 75,000 interaction episodes. The dataset spans atomic manipulation, long-horizon chains of household activities, and human-scene interaction, while preserving natural behavioral variation through goal-level rather than step-by-step instructions. We further introduce a hierarchical benchmark that progresses from signals to scene components and then to interactions. Evaluations of state-of-the-art methods expose substantial gaps under contact, occlusion, egomotion, and long temporal horizons. ACE-Data-0 provides synchronized human demonstrations with aligned perceptual, kinematic, and contact supervision, offering a scalable foundation for imitation learning, world models, vision-language-action systems, and embodied AI.', 'score': 34, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '5f36a278bd6eec8f', 'authors': ['Yukang Cao', 'Haozhe Xie', 'Beichen Wen', 'Runmao Yao', 'Yinghao Liu', 'Yue Huang', 'Zhichao Liao', 'Yunxiang Wang', 'Haiheng Liu', 'Xingshun Tian', 'Dawei Su', 'Long Zhuo', 'Dacheng Tao', 'Xiaogang Wang', 'Liang Pan', 'Ziwei Liu'], 'affiliations': ['ACE Robotics', 'S-Lab, Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28625.jpg', 'data': {'categories': ['#video', '#robotics', '#dataset', '#benchmark', '#synthetic', '#multimodal', '#audio'], 'emoji': '🏠', 'ru': {'title': 'Синхронный мультимодальный датасет для обучения воплощённого интеллекта', 'desc': 'Работа представляет Ambient Capture Engine (ACE) — систему для сбора многомодальных данных о взаимодействии человека с окружением в натуральных домашних условиях. ACE одновременно записывает видео от первого и третьего лиц, движения рук и всего тела, геометрию объектов, аудио и тактильные сигналы, создавая полный цикл восприятия-действия. На основе этой системы авторы создали датасет ACE-Data-0 с 150 часами видео, 17 миллионами кадров и 75 тысячами эпизодов взаимодействия через 200 категорий задач. Датасет предоставляет синхронизированные демонстрации человека с полной разметкой для обучения через имитацию, обучения world models и развития embodied AI систем.'}, 'en': {'title': 'Revolutionizing Data Capture for Embodied Intelligence', 'desc': 'This paper addresses the challenge of limited data in embodied intelligence by introducing the Ambient Capture Engine (ACE), which creates a comprehensive data collection environment. ACE captures a wide range of human interactions in real home settings, recording both fine-grained hand movements and broader body motions in a synchronized manner. The resulting dataset, ACE-Data-0, includes extensive video footage and sensory data from various tasks, allowing for a more holistic understanding of human perception and action. This resource aims to enhance machine learning models for tasks like imitation learning and vision-language-action systems by providing rich, aligned data for training.'}, 'zh': {'title': '环境捕捉引擎：打破数据瓶颈的关键', 'desc': '本论文介绍了一种新的数据引擎，称为环境捕捉引擎（ACE），旨在解决体现在智能中的数据瓶颈问题。ACE能够将真实家庭环境转化为空间校准和时间同步的录音室，捕捉人类在追求目标时的第一人称感知、全身运动和物体交互。通过ACE，我们构建了ACE-Data-0数据集，包含150小时的录像和1700万帧视频，涵盖200个任务类别，记录了人类的自然行为变化。该数据集为模仿学习、世界模型和具身人工智能提供了可扩展的基础。'}}}, {'id': 'https://huggingface.co/papers/2607.27816', 'title': 'Beyond Borrowed Histories: Person-Aligned User Simulation for Interactive Role-Playing Evaluation', 'url': 'https://huggingface.co/papers/2607.27816', 'abstract': "Abstract  Role-playing agents (RPAs) have become one of the most important consumer applications of large language models. Users engage in multi-turn conversations with RPAs for experiences such as emotional comfort, making reliable evaluation essential for measuring capability, comparing systems, and guiding further improvement. Existing benchmarks, however, typically require an RPA to continue a fixed dialogue history and then evaluate the continuation using a fixed rubric detached from the user. We identify and empirically demonstrate two limitations of this design. First, an RPA's output is shaped by the preceding dialogue history, preventing a scientifically grounded assessment of its role-playing ability in real multi-turn settings. Second, user experience varies substantially across individuals, and conventional fixed rubrics need not align with user satisfaction. We therefore introduce PALATE (Person-Aligned LLM-Simulated-User Assessment with Tailored Evaluation), a scalable RPA benchmark built on user simulators. PALATE is accompanied by a pool of 300 character profiles. Its main evaluation trains five per-user simulators and lets them engage candidate RPAs in free-form, multi-turn conversations over a pre-frozen panel of character profiles. Alongside a general quality rubric, we construct personalized rubrics to measure user satisfaction; on held-out annotated data, the personalized rubrics show higher agreement with human judgments than the general rubric. In the main evaluation of 16 candidates, PALATE separately characterizes generic turn quality, long-horizon session capability, and per-user experience on multi-turn trajectories co-constructed by each candidate. It thereby produces interpretable evaluations of specific user-RPA pairs rather than compressing systems into a single user-independent ranking.", 'score': 30, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'b24acd52c52ba395', 'authors': ['Yuhang Zhu', 'Mingxuan Du', 'Benfeng Xu', 'Jie Gao', 'Lingyun Yu', 'Hongtao Xie'], 'affiliations': ['MetaStone Technology, Beijing, China', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27816.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#agents'], 'emoji': '🎭', 'ru': {'title': 'Персонализированная оценка роль-играющих агентов через симуляцию пользователей', 'desc': 'В работе предлагается PALATE — новый бенчмарк для оценки role-playing агентов на основе LLM, который использует симуляторы пользователей для проведения многоходовых диалогов. Авторы показывают ограничения существующих подходов: фиксированная история диалога не позволяет объективно оценить способность к role-playing, а единые критерии оценки не учитывают индивидуальные предпочтения пользователей. PALATE включает пул из 300 профилей персонажей и конструирует персонализированные рубрики оценки для измерения удовлетворённости конкретных пользователей. Бенчмарк обеспечивает интерпретируемую оценку взаимодействия отдельных пар пользователь-агент, анализируя качество ответов, долгосрочные возможности и персональный опыт в многоходовых траекториях.'}, 'en': {'title': 'Enhancing RPA Evaluation with User-Centric Benchmarks', 'desc': 'This paper discusses the limitations of current evaluation methods for role-playing agents (RPAs) that use large language models. It highlights that existing benchmarks often rely on fixed dialogue histories and rubrics that do not account for individual user experiences. To address these issues, the authors introduce PALATE, a new benchmark that utilizes user simulators and personalized evaluation rubrics. PALATE allows for more accurate assessments of RPAs by focusing on user satisfaction and providing detailed evaluations of interactions between specific users and RPAs.'}, 'zh': {'title': '个性化评估，提升角色扮演代理的用户体验', 'desc': '角色扮演代理（RPA）是大型语言模型的重要应用，用户通过多轮对话获得情感支持。现有的评估方法存在局限，无法科学地评估RPA在真实对话中的表现。我们提出了PALATE，一个基于用户模拟器的可扩展RPA基准，能够根据个性化的评估标准来衡量用户满意度。通过与300个角色档案的对话，PALATE提供了更准确的评估，能够反映用户与RPA之间的具体互动。'}}}, {'id': 'https://huggingface.co/papers/2607.28509', 'title': 'RefCaptioner: Multi-Reference Image-Grounded Video Captioning', 'url': 'https://huggingface.co/papers/2607.28509', 'abstract': 'Abstract  Existing video captioning models generate natural descriptions of video content but cannot explicitly ground local visual elements to multiple reference images. We introduce multi-reference image-grounded video captioning, a new task requiring factual video descriptions with phrase-level reference grounding, and propose RefCaptioner, a two-stage post-training framework for this task. RefCaptioner combines mixed-data SFT with Hierarchical Coverage-Discounted GRPO to jointly improve reference selection, phrase-level binding, distractor rejection, and cross-reference consistency while preserving general video-captioning ability. To support training, we construct a corpus containing 20,000 videos and 171,354 reference images. We further introduce MRVBench, a benchmark for evaluating caption factuality and multi-reference grounding on both real-world and AI-generated videos. Experiments show that RefCaptioner achieves the best overall performance among the open-source models while remaining competitive on standard video captioning benchmarks. Human evaluation further confirms that its captions are preferred by annotators and enable more source-faithful video reconstruction with both open-source and proprietary video generators.', 'score': 24, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6290440868db7f51', 'authors': ['Tengfei Liu', 'Yang Shi', 'Yuran Wang', 'Xiaohan Zhang', 'Yuqing Wen', 'Yuqi Tang', 'Qixun Wang', 'Zhuoran Zhang', 'Xuanyu Zhu', 'Weihong Lin', 'Xinlei Yu', 'Yujie Wei', 'Xinwei Long', 'Fengxiang Wang', 'Xinlong Chen', 'Yue Ding', 'Jialu Chen', 'Haotian Wang', 'Yuanxing Zhang'], 'affiliations': ['CASIA', 'CUHK', 'FDU', 'HKUST(GZ)', 'Kling Team', 'NJU', 'NUS', 'PKU', 'Shanghai AI Lab', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2607.28509.jpg', 'data': {'categories': ['#video', '#dataset', '#benchmark', '#multimodal', '#training', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Привязка видеоописаний к эталонным изображениям через обучение с подкреплением', 'desc': 'В статье представлена задача мультиреференционного видеокэптионинга с обоснованием, где модель должна генерировать описания видео с привязкой фраз к эталонным изображениям. Авторы предлагают RefCaptioner — двухэтапный фреймворк, использующий supervised fine-tuning и новый алгоритм Hierarchical Coverage-Discounted GRPO для одновременного улучшения выбора референций и их согласованности. Для обучения создан корпус из 20 000 видео и 171 354 эталонных изображений, а также разработан бенчмарк MRVBench для оценки точности описаний и качества привязки. Экспериментальные результаты показывают, что RefCaptioner достигает лучших показателей среди открытых моделей и сохраняет конкурентоспособность на стандартных видеокэптионинг бенчмарках.'}, 'en': {'title': 'Grounding Video Captions with Multiple References', 'desc': 'This paper presents a new approach to video captioning called multi-reference image-grounded video captioning, which aims to create accurate descriptions of videos by linking specific phrases to multiple reference images. The authors introduce a model named RefCaptioner, which uses a two-stage post-training framework to enhance the process of selecting references, binding phrases, rejecting distractions, and ensuring consistency across references. To train this model, they developed a large dataset with 20,000 videos and over 171,000 reference images, along with a benchmark called MRVBench for evaluating the accuracy of captions and their grounding to references. Experimental results indicate that RefCaptioner outperforms existing models in generating factual captions while maintaining strong performance on traditional video captioning tasks.'}, 'zh': {'title': '多参考图像基础的视频字幕生成', 'desc': '现有的视频字幕生成模型能够生成自然的视频内容描述，但无法将局部视觉元素明确地与多个参考图像关联。我们提出了一种新的任务——多参考图像基础的视频字幕生成，要求生成具有短语级参考基础的事实视频描述，并提出了RefCaptioner，一个用于该任务的两阶段后训练框架。RefCaptioner结合了混合数据的SFT和分层覆盖折扣的GRPO，以共同提高参考选择、短语级绑定、干扰项拒绝和跨参考一致性，同时保持一般视频字幕生成能力。为了支持训练，我们构建了一个包含20,000个视频和171,354个参考图像的语料库，并进一步引入了MRVBench，一个用于评估字幕事实性和多参考基础的基准。'}}}, {'id': 'https://huggingface.co/papers/2607.27703', 'title': 'SpatialCLI: Learning to Reason With Spatial Tools, Then Without Them', 'url': 'https://huggingface.co/papers/2607.27703', 'abstract': "Abstract  Vision-language models (VLMs) are increasingly used in embodied agents to interpret visual inputs, reason about spatial relationships, and make task-level decisions based on that reasoning. However, a fundamental capability mismatch remains: general VLMs can reason about the overall task but often miss the visual details that determine success, while specialist vision models can capture those details but cannot translate them into task-level decisions. In this work, we propose SpatialCLI, a framework that teaches VLMs to reason with spatial tools and progressively internalize the specialist perceptual capabilities they provide. SpatialCLI proceeds in three stages: (1) Call exposes specialist vision models as spatial tools to augment the VLM's perception; (2) Learn uses Cold-Start SFT and agentic RL to improve tool use; and (3) Internalize verbalizes successful tool-use trajectories to internalize specialist perceptual capabilities. We further introduce SpatialCLI-Bench, a 516-example benchmark for compositional perception across localization, segmentation, depth, and pose. On MindCube, SpatialCLI raises Qwen3-VL-8B-Instruct from 29.3% to 84.6% with tools, surpassing GPT-5.6 Sol with tools (72.1%), while retaining 73.8% without tools after internalization.", 'score': 21, 'issue_id': 2808, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '595ab87129335ff9', 'authors': ['Yang Zhou', 'Zixuan Huang', 'Sunzhu Li', 'Zhuo Yang', 'Chen Zhang', 'Shunian Chen', 'Caijun Yan', 'Jianyao Xu', 'Shunyu Liu', 'Weijie Fu', 'Peiliang Li', 'Xiaozhi Chen', 'Yuxiang Cai'], 'affiliations': ['Beihang University', 'Nanyang Technological University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Electronic Science and Technology of China', 'Zhejiang University', 'Zhuoyu Technology, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27703.jpg', 'data': {'categories': ['#reasoning', '#transfer_learning', '#rl', '#training', '#agents', '#robotics', '#multimodal', '#cv', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Обучение визуальных языковых моделей пространственному рассуждению через специализированные инструменты', 'desc': 'В работе предложена система SpatialCLI, которая учит визуально-языковые модели использовать специализированные инструменты компьютерного зрения для улучшения понимания пространственных отношений в задачах робототехники. Подход состоит из трёх этапов: предоставление специализированных моделей в качестве инструментов, обучение их эффективному использованию через SFT и обучение с подкреплением, и интернализация полученных знаний путём вербализации успешных траекторий. Авторы также создали бенчмарк SpatialCLI-Bench с 516 примерами для оценки композиционного восприятия. Экспериментальные результаты показывают значительное улучшение производительности модели Qwen3-VL-8B-Instruct с 29.3% до 84.6%, которое сохраняется даже после удаления вспомогательных инструментов.'}, 'en': {'title': 'Bridging the Gap: Enhancing VLMs with Spatial Tools', 'desc': 'This paper introduces SpatialCLI, a framework designed to enhance vision-language models (VLMs) by integrating specialist vision capabilities for better task performance. It addresses the gap between general VLMs, which excel at overall task reasoning but struggle with visual details, and specialist models that focus on those details but lack decision-making abilities. SpatialCLI operates in three stages: it first exposes VLMs to specialist tools, then improves their usage through reinforcement learning, and finally helps VLMs internalize these capabilities by verbalizing successful actions. The framework is evaluated using SpatialCLI-Bench, demonstrating significant performance improvements in task execution with enhanced perceptual understanding.'}, 'zh': {'title': '提升视觉语言模型的空间推理能力', 'desc': '本文提出了一种名为SpatialCLI的框架，旨在提升视觉语言模型（VLMs）在空间推理和任务决策中的能力。该框架通过三个阶段来实现：首先，利用专业视觉模型作为空间工具来增强VLM的感知；其次，通过冷启动微调和自主强化学习来改善工具的使用；最后，将成功的工具使用轨迹进行语言化，以内化专业的感知能力。此外，本文还引入了SpatialCLI-Bench，这是一个包含516个示例的基准测试，涵盖了定位、分割、深度和姿态等方面的组合感知。'}}}, {'id': 'https://huggingface.co/papers/2607.26769', 'title': 'See2Think: Do Multimodal Models Really Use Intermediate Visual States?', 'url': 'https://huggingface.co/papers/2607.26769', 'abstract': 'Abstract  Multimodal large language models increasingly use sketches, annotations, tools, and intermediate images during reasoning, but it remains unclear whether they truly rely on these visual states. Existing benchmarks are limited both by task collections with narrow coverage or partially text-solvable samples and by evaluations that emphasize final answers without diagnosing how intermediate visual states are generated, rendered, and used. We introduce See2Think, a unified evaluation framework comprising See2ThinkBench and Visual Action-of-Thought (VAoT). See2ThinkBench contains 1,200 open-ended, visually dependent problems across 12 task categories spanning 2D structured, 3D scene, and real-world reasoning. VAoT records textual thoughts, visual actions, rendered states, and subsequent reasoning under four controlled inference settings. Evaluating representative proprietary and open-source multimodal models, we find that visual reasoning is strongly model- and environment-dependent, with no single setting consistently dominating across tasks. Process analysis further shows that models usually select relevant visual operations, while faithful rendering remains the clearest bottleneck and high feedback uptake does not necessarily translate into accuracy gains. Under task-relevant corrupted feedback, models exhibit behavioral dependence on visual states, with accuracy dropping by over 10 percentage points in controlled interventions.', 'score': 21, 'issue_id': 2811, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '47b8659e2a8e727b', 'authors': ['Siyu Yan', 'Zhuoran Yan', 'Haiying Xu', 'Panhao Zhou', 'Jingyu Chen', 'Chenhao Ji', 'Shuo Cao', 'Yongheng Zhang', 'Haoze Liu', 'Siyu Zhang', 'Xiwen Gu', 'Yihao Liu', 'Alex Jinpeng Wang'], 'affiliations': ['Central South University', 'Fudan University', 'Shanghai AI Laboratory', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Science and Technology of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26769.jpg', 'data': {'categories': ['#multimodal', '#cv', '#dataset', '#interpretability', '#benchmark', '#reasoning'], 'emoji': '👁️', 'ru': {'title': 'Видят ли они? Диагностика истинной визуальной зависимости в мультимодальных моделях', 'desc': 'В работе представлена система See2Think для оценки того, действительно ли мультимодальные большие языковые модели полагаются на визуальные состояния при решении задач. Авторы создали набор данных See2ThinkBench с 1200 открытыми задачами, требующими визуального анализа, и методологию Visual Action-of-Thought для записи промежуточных шагов рассуждений. Они обнаружили, что качество визуального рассуждения сильно зависит от модели и окружения, а главное узкое место заключается в точности визуализации промежуточных состояний. Под воздействием повреждённой визуальной обратной связи модели проявляют зависимость от визуальных входных данных, теряя в точности более чем на 10 процентных пункта.'}, 'en': {'title': 'See2Think: Unraveling Visual Reasoning in Multimodal Models', 'desc': "This paper introduces See2Think, a new evaluation framework designed to assess how multimodal large language models utilize visual information during reasoning tasks. It includes See2ThinkBench, which features 1,200 visually dependent problems across various categories, and Visual Action-of-Thought (VAoT), which tracks the models' thought processes and visual actions. The study reveals that the effectiveness of visual reasoning varies significantly depending on the model and the environment, highlighting that no single approach is universally superior. Additionally, it finds that while models can select appropriate visual operations, issues with rendering quality are a major limitation, and the models' performance can drop significantly when faced with corrupted visual feedback."}, 'zh': {'title': '视觉推理的依赖性与挑战', 'desc': '这篇论文探讨了多模态大型语言模型在推理过程中是否真正依赖于视觉状态，如草图、注释和中间图像。现有的基准测试存在任务范围狭窄和评估方法不足的问题，无法全面诊断中间视觉状态的生成和使用。我们提出了See2Think，一个统一的评估框架，包括See2ThinkBench和视觉思维行为（VAoT），以评估模型在视觉推理中的表现。研究发现，视觉推理强烈依赖于模型和环境，且在任务相关的干扰反馈下，模型的准确性会显著下降。'}}}, {'id': 'https://huggingface.co/papers/2607.28611', 'title': 'Chimera: Designing and Chinchilla-Scaling Hybrid Visual Diffusion Transformers', 'url': 'https://huggingface.co/papers/2607.28611', 'abstract': "Abstract  Visual generation increasingly requires high-resolution images, long videos, and multimodal context, making the quadratic cost of full attention prohibitive. We introduce Chimera, a hybrid visual diffusion backbone with a principled scaling recipe. Chimera processes text, image, and video tokens in one raster-ordered stream without positional embeddings. It combines Kimi Delta Attention (KDA) for long-context state tracking with O(N) complexity, interleaved Multi-head Latent Attention (MLA) for direct global interaction, and modality-aware short convolutions for local spatiotemporal context. Sparse Mixture-of-Experts (MoE) layers expand capacity while controlling activated compute. To scale this heterogeneous architecture, we introduce HeteroP, a module-wise scheme that transfers hyperparameters across width and depth according to each tensor's functional fan-in and model depth. HeteroP yields a consistently tuned family used to fit Chinchilla-style compute-optimal laws for activated model size, training-token count, and image-video data ratio. Guided by these laws, we train an 11B-parameter Chimera with 2B activated parameters. Experiments show three results. First, measured by pretraining diffusion loss, the dense backbone is 1.7x as compute-efficient as a matched full-attention Wan-2.1 2B baseline, while the complete system reaches 7.3x. Second, without length-specific fine-tuning, Chimera extrapolates zero-shot from 5-second training clips to 30-second videos, with only 6.5% FID degradation in the last five seconds. Third, the fitted laws show that compute-optimal image pretraining divides compute nearly evenly between activated model size and training-token count, whereas video pretraining modestly favors model size at higher budgets. These results establish a foundation for designing and scaling efficient long-context diffusion architectures.", 'score': 16, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '1f81e9d06fa2a765', 'authors': ['Chongjian Ge', 'Hanwen Jiang', 'Tianyu Wang', 'Jiuxiang Gu', 'Yiran Xu', 'Ziwen Chen', 'Shaoteng Liu', 'Jing Shi', 'Yicong Hong', 'Zefan Cai', 'Hailin Jin', 'Hao Tan'], 'affiliations': ['Adobe Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.28611.jpg', 'data': {'categories': ['#video', '#diffusion', '#inference', '#cv', '#multimodal', '#architecture', '#long_context', '#training', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Эффективная гибридная архитектура для генерации длинного визуального контента', 'desc': 'В статье представлена Chimera — гибридная архитектура диффузионного визуального backbone для генерации высокого разрешения и длинных видео с эффективным вычислением. Модель использует комбинацию механизмов внимания с разной сложностью: Kimi Delta Attention с линейной сложностью O(N) для отслеживания долгосрочного контекста и Multi-head Latent Attention для глобального взаимодействия, дополненные локальными свёртками. Для масштабирования гетерогенной архитектуры введена схема HeteroP, которая переносит гиперпараметры согласно функциональному входу каждого модуля. Обучение 11B-параметровой модели с 2B активными параметрами показало 7.3x повышение энергоэффективности и успешную экстраполяцию с 5-секундных видео на 30-секундные без специальной доподготовки.'}, 'en': {'title': 'Chimera: Efficient Visual Diffusion for High-Resolution and Long-Context Generation', 'desc': 'The paper presents Chimera, a novel hybrid visual diffusion model designed to efficiently handle high-resolution images and long videos. It utilizes a combination of Kimi Delta Attention and Multi-head Latent Attention to manage long-context tracking and global interactions while maintaining low computational complexity. The model incorporates Sparse Mixture-of-Experts layers to optimize resource usage and introduces HeteroP for effective scaling of hyperparameters. Experimental results demonstrate that Chimera significantly improves compute efficiency and performance in generating longer video sequences without extensive fine-tuning.'}, 'zh': {'title': '高效长时序生成的Chimera模型', 'desc': '本论文介绍了一种名为Chimera的混合视觉扩散模型，旨在处理高分辨率图像和长视频。Chimera通过一种新的模块化方案HeteroP，优化了模型的超参数，使其在计算效率上显著提升。该模型结合了Kimi Delta Attention和多头潜在注意力机制，能够有效地处理文本、图像和视频数据。实验结果表明，Chimera在计算效率和长时序生成能力上均优于传统的全注意力模型。'}}}, {'id': 'https://huggingface.co/papers/2607.28362', 'title': 'ShadowDancer: Teaching Video World Models Any Action by Learning Unified Dynamics Representations from a Video and Its Shadow', 'url': 'https://huggingface.co/papers/2607.28362', 'abstract': 'Abstract  We present ShadowDancer, a novel approach to any-action, frame-level control of interactive video world models. The obstacle is representational: existing interfaces either encode an action loosely, leaving how it unfolds for the model to improvise, or encode it exactly through structured signals that serve one family and are hard to acquire, so precise control across diverse dynamics remains impractical. Demonstration videos are the natural remedy, specifying any dynamics frame by frame; yet a video shows its dynamics only through one particular appearance, a single shadow of the underlying dynamics, so actions learned from demonstrations transfer poorly to new scenes. ShadowDancer addresses this with two key innovations: (1) shadow pairs, video pairs that replay the same dynamics under independently resampled appearance, constructed at scale by our Shadow Library, so that a dynamics family becomes controllable exactly when such pairs can be constructed for it; and (2) cross-shadow prediction, which learns actions by predicting one shadow from the other, so that whatever the pairing resamples is discarded by construction and whatever it preserves becomes the action, yielding a unified dynamics representation that drives a block-causal world model. Any demonstrated clip thus becomes a reusable action asset, replayed in new environments without action labels, motion estimators, or fine-tuning. Experiments demonstrate improved action transfer and long action rollout over strong latent-action and interactive world model baselines across diverse dynamics families, with an average blinded win rate of 86% in rollout comparisons. We show video results at https://ShadowDancer-1.github.io', 'score': 16, 'issue_id': 2810, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '2ab8f0dbea2e0490', 'authors': ['Jin Cao', 'Zian Meng', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.28362.jpg', 'data': {'categories': ['#architecture', '#video', '#training'], 'emoji': '🎬', 'ru': {'title': 'Динамика отделена от визуала: видео как универсальный язык дейс
