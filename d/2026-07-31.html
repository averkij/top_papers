твий', 'desc': 'ShadowDancer — это новый подход к управлению интерактивными видеомоделями мира на уровне отдельных кадров, который решает проблему представления действий. Авторы предлагают использовать пары видео с одинаковой динамикой, но разными визуальными характеристиками, которые автоматически генерируются библиотекой Shadow Library. Модель обучается предсказывать одно видео из пары по другому, что позволяет отделить саму динамику действия от визуального оформления сцены. Такой подход позволяет переносить действия из демонстрационных видео на новые окружения без переобучения, дополнительных разметок и оценки движения.'}, 'en': {'title': 'ShadowDancer: Mastering Action Control in Dynamic Video Worlds', 'desc': "ShadowDancer is a new method for controlling interactive video world models at a frame level, allowing for precise action representation. It overcomes limitations of existing systems that either provide vague action encoding or require complex structured signals. The approach introduces 'shadow pairs', which are video pairs that showcase the same dynamics with different appearances, enabling better action transfer across various scenes. Additionally, it employs 'cross-shadow prediction' to learn actions by predicting one shadow from another, creating a unified representation that enhances action reuse in new environments without the need for extensive fine-tuning."}, 'zh': {'title': '影子舞者：动态控制的新方法', 'desc': 'ShadowDancer是一种新颖的方法，用于对交互式视频世界模型进行任何动作的逐帧控制。它通过引入影子对和跨影子预测两个关键创新，解决了现有接口在动作表示上的不足。影子对是通过独立重采样外观构建的视频对，使得同一动态可以在不同场景中精确控制。跨影子预测则通过预测一个影子来学习动作，从而实现了动态表示的统一，允许在新环境中重用演示片段而无需额外的动作标签或微调。'}}}, {'id': 'https://huggingface.co/papers/2607.28582', 'title': 'β-OPSD: Deriving with Policy Optimization, Training with Self-Distillation', 'url': 'https://huggingface.co/papers/2607.28582', 'abstract': 'Abstract  On-policy self-distillation (OPSD) is a promising approach to improve reasoning language models, but it remains brittle in practice: making it work reliably often requires substantial engineering effort. We identify a structural source of this difficulty: vanilla OPSD is precisely the β=1 member of a broader policy-optimization family, where β weights the KL penalty anchoring the student to a reference policy. This equivalence turns β from an implicit value fixed at one into a controllable regularization parameter, yielding a more general formulation that trades off proximity to a reference policy against privileged teacher guidance. We introduce β-OPSD and derive its optimal policy as a geometric interpolation between the reference policy and the privileged teacher. Directly optimizing this objective with reinforcement learning, however, would be costly and high-variance. Rather than optimize the RL objective directly, we turn its closed-form solution into a distillation target. Each value of β selects a target along the reference-to-teacher path, which we implement efficiently by mixing their token-level logits. In this way, inexpensive distillation approximates the solution of expensive policy optimization. Return-to-go credit assignment further aligns token updates with the sequence-level objective while retaining the simplicity of OPSD. Experiments on mathematical reasoning benchmarks show that β-OPSD consistently outperforms vanilla OPSD, improving optimization stability and downstream reasoning performance. Our results provide a principled route from self-distillation to policy optimization and back without sacrificing the efficiency that makes OPSD practical.', 'score': 13, 'issue_id': 2813, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'ff08896b4a1afdf5', 'authors': ['Jiawei Xu', 'Minghui Liu', 'Juzheng Zhang', 'Tom Goldstein', 'Furong Huang'], 'affiliations': ['University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2607.28582.jpg', 'data': {'categories': ['#optimization', '#math', '#rlhf', '#training', '#reasoning'], 'emoji': '🎯', 'ru': {'title': 'Управляемая самодистилляция через параметризованное смешивание политик', 'desc': 'В статье предложен метод β-OPSD, который улучшает самодистилляцию языковых моделей путем введения параметра β, контролирующего баланс между приверженностью эталонной политике и обучением у учителя. Авторы показывают, что ванильная самодистилляция соответствует частному случаю при β=1, и выводят оптимальную политику как геометрическую интерполяцию между эталонной политикой и учителем. Вместо дорогостоящей оптимизации методом обучения с подкреплением авторы преобразуют закрытое решение в цель дистилляции, реализуя это эффективно через смешивание логитов на уровне токенов. Экспериментальные результаты на задачах математического рассуждения демонстрируют улучшение стабильности оптимизации и качества работы модели.'}, 'en': {'title': 'Enhancing Reasoning in Language Models with β-OPSD', 'desc': 'This paper introduces β-OPSD, an enhanced version of on-policy self-distillation (OPSD) for improving reasoning in language models. It identifies that the traditional OPSD method is limited by its fixed parameter, β, which can be adjusted to balance between a reference policy and a privileged teacher. By treating β as a controllable regularization parameter, the authors derive a more flexible policy optimization approach that allows for efficient distillation. Experiments demonstrate that β-OPSD not only stabilizes the optimization process but also boosts performance on reasoning tasks compared to the standard OPSD method.'}, 'zh': {'title': '提升推理模型的自我蒸馏新方法', 'desc': '本文提出了一种新的方法，称为β-OPSD，旨在改进推理语言模型的自我蒸馏过程。通过将β视为可控的正则化参数，β-OPSD能够在参考策略和特权教师之间进行几何插值，从而提高优化的稳定性。该方法通过混合令牌级别的logits来高效实现目标，而不是直接优化强化学习目标，从而降低了计算成本。实验结果表明，β-OPSD在数学推理基准测试中优于传统的OPSD，提升了推理性能。'}}}, {'id': 'https://huggingface.co/papers/2607.28272', 'title': 'MemHarness: Memory Is Reconstructed, Not Replayed', 'url': 'https://huggingface.co/papers/2607.28272', 'abstract': "Abstract  Retrieving past experiences has become a common strategy to enhance large language model agents. However, most existing memory-augmented agents treat retrieved experiences as static records to be replayed verbatim, injecting them into the context regardless of whether they align with the agent's current situation. This ``replay'' paradigm ignores the gap between the abstract, general nature of stored experience and the concrete, ever-changing states encountered at decision time, frequently causing negative transfer. In contrast, humans rarely recall past experiences verbatim; instead, they reorganize and adapt retrieved memories to fit the present context. Inspired by this, we propose MemHarness, a framework that equips LLM agents to actively harness and reconstruct past experiences based on the present context. At each decision step, a unified policy model critiques and reconstructs the retrieved experience conditioned on the current state, producing context-grounded guidance before acting. This reconstructive ability emerges naturally through end-to-end training with GRPO. Experiments on ALFWorld and WebShop show that MemHarness substantially outperforms pure RL and static memory-augmented baselines, demonstrating strong robustness in out-of-distribution (OOD) scenarios. Furthermore, our analyses reveal that this reconstruction objective not only prevents negative transfer but also serves as latent guidance during training, fundamentally improving the agent's intrinsic reasoning capabilities.", 'score': 13, 'issue_id': 2808, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'd954f3670e0505c7', 'authors': ['Rong Wu', 'Daocheng Fu', 'Licheng Wen', 'Xuemeng Yang', 'Shu Zou', 'Jianbiao Mei', 'Yuxin Wang', 'Hairong Zhang', 'Yu Yang', 'Tao Hu', 'Cong Zhang', 'Botian Shi', 'Pinlong Cai'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'The Australian National University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28272.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Переосмысление памяти: адаптивная реконструкция опыта для умных агентов', 'desc': 'В статье предлагается MemHarness — фреймворк для агентов на основе LLM, который активно перестраивает извлечённые прошлые опыты в соответствии с текущим контекстом, вместо механического воспроизведения статических записей. На каждом шаге принятия решения унифицированная модель политики критикует и реконструирует извлечённый опыт, обусловленный текущим состоянием, чтобы создать контекстуально обоснованное руководство для действия. Способность к реконструкции естественным образом возникает при сквозном обучении с использованием GRPO, что предотвращает отрицательный перенос и улучшает внутренние рассуждения агента. Эксперименты на ALFWorld и WebShop показывают, что MemHarness существенно превосходит базовые модели RL и статических дополненных памятью агентов, демонстрируя высокую робастность в сценариях распределения за пределами обучающего набора.'}, 'en': {'title': 'MemHarness: Adapting Memories for Smarter Decisions', 'desc': "This paper introduces MemHarness, a new framework for enhancing large language model (LLM) agents by allowing them to adaptively reconstruct past experiences based on their current context. Unlike traditional memory-augmented agents that replay experiences verbatim, MemHarness enables agents to critique and modify retrieved memories to better fit the situation at hand. This approach helps prevent negative transfer, where irrelevant past experiences hinder decision-making, and improves the agent's reasoning abilities. The framework shows significant performance improvements in various tasks, demonstrating its effectiveness in dynamic environments."}, 'zh': {'title': '主动重构记忆，提升智能决策', 'desc': '本论文提出了一种名为MemHarness的框架，用于增强大型语言模型代理的记忆能力。与传统的静态记忆重放不同，MemHarness允许代理根据当前情境主动重构和利用过去的经验。通过统一的策略模型，代理在每个决策步骤中对检索到的经验进行批判和重构，从而生成与当前状态相关的指导。实验结果表明，MemHarness在多种场景下显著优于传统的强化学习和静态记忆增强基线，提升了代理的推理能力。'}}}, {'id': 'https://huggingface.co/papers/2607.28410', 'title': 'Can Large Language Models Execute Parent Orders?', 'url': 'https://huggingface.co/papers/2607.28410', 'abstract': 'Abstract  Parent-order execution is a core problem in algorithmic trading, where the goal is to split a large order into smaller orders while reducing execution costs. Existing approaches either rely on pre-specified market assumptions that may not hold in practice, or require task-specific training that limits adaptability to new settings. To overcome these limitations, we present the first systematic study of large language models (LLMs) for parent-order execution. This extends the use of LLMs in finance from what to trade to how to execute. We propose PACE (Plan-Ahead Controlled Execution), a hierarchical framework that decomposes parent-order execution into long-horizon planning and short-horizon execution, requiring neither explicit market assumptions nor task-specific training. Experiments on Shenzhen Stock Exchange Level-1 data show that PACE outperforms TWAP, Almgren-Chriss, and learning-based baselines, exceeding the strongest baseline by 0.65 bps. Behavioral analysis reveals that LLMs make execution decisions differently from human investors: higher model confidence predicts better performance rather than worse returns, and the model trades earlier rather than procrastinating toward the deadline. These findings suggest that LLMs can complement human traders in execution decisions.', 'score': 12, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'ff6f0fcf13d7ff84', 'authors': ['Zane Shen', 'Xinli Xu', 'Guangyi Zhang', 'Jialong Chen', 'Jinsong Zhou', 'Cong Chen', 'Guibao Shen', 'Dongyu Yan', 'Luozhou Wang', 'Zhen Yang'], 'affiliations': ['HKUST(GZ)', 'Independent Researcher', 'SYSU', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2607.28410.jpg', 'data': {'categories': [], 'emoji': '📊', 'ru': {'title': 'Языковые модели для умного исполнения торговых ордеров', 'desc': 'В статье исследуется применение больших языковых моделей (LLM) для решения задачи исполнения родительских ордеров в алготрейдинге. Авторы предлагают фреймворк PACE, который использует иерархический подход с долгосрочным планированием и краткосрочным исполнением, не требуя явных предположений о рынке или специальной обучающей выборки для конкретной задачи. Экспериментальная оценка на данных Шэньчжэньской фондовой биржи показывает превосходство PACE над классическими методами (TWAP, Almgren-Chriss) и методами на основе машинного обучения. Анализ поведения модели выявил, что LLM принимают решения об исполнении иначе, чем люди: высокая уверенность модели коррелирует с лучшими результатами, а торговля происходит раньше срока, а не в конце периода.'}, 'en': {'title': 'Revolutionizing Order Execution with LLMs', 'desc': 'This paper addresses the challenge of parent-order execution in algorithmic trading, which involves breaking down large orders into smaller ones to minimize costs. The authors introduce PACE (Plan-Ahead Controlled Execution), a novel framework that utilizes large language models (LLMs) to enhance execution strategies without relying on fixed market assumptions or specialized training. Through experiments on real market data, PACE demonstrates superior performance compared to traditional methods and other learning-based approaches. The study also highlights that LLMs approach execution differently than human traders, indicating their potential to assist in making more effective trading decisions.'}, 'zh': {'title': '利用大语言模型优化算法交易执行', 'desc': '本文研究了父订单执行问题，这是算法交易中的一个核心问题，旨在将大订单拆分为小订单以降低执行成本。现有方法通常依赖于预设的市场假设或需要特定任务的训练，限制了其适应性。为了解决这些问题，本文提出了PACE（计划前瞻控制执行），这是一个将父订单执行分解为长时间规划和短时间执行的层次框架，无需明确的市场假设或特定任务训练。实验结果表明，PACE在深圳证券交易所的Level-1数据上表现优于传统方法，且LLM在执行决策上与人类投资者存在显著差异。'}}}, {'id': 'https://huggingface.co/papers/2607.26056', 'title': 'INTACT: Isomorphic Intent-to-Action Learning for Search-Free World Models', 'url': 'https://huggingface.co/papers/2607.26056', 'abstract': 'Abstract  Forward latent world models predict how actions change a scene, but recover actions for a desired change only through expensive test-time search. We introduce INTACT (INtent-To-ACTion), an end-to-end JEPA that turns action-labeled, reward-free trajectories into a deployable intent-to-action interface. Each transition supplies physical intent z_{t+1}-z_t, while a future goal supplies deployment intent sg(z_g)-z_t. The architecture is isomorphic between the local and goal motion-intent backbone-input graphs through an identical four-slot grammar and shared parameters, and between supported local and goal motion-intent families through action-law semantics induced by the same predictor rather than pointwise latent equality. INTACT also provides intact transfer from RGB evidence to action-effective latent intent coordinates and from intent families to their corresponding action-law families. Asymmetric endpoint gradients ground physical successors and fix future goals as anchors, joining representation learning and control without pointwise latent matching or globally linear dynamics. The resulting coordinates support a robust distributional action law: its conditional mean serves directly as a search-free policy, while sampling remains available for diversity or optional verification. On the four official LeWM tasks, one-epoch, zero-search models reach 85.78\\%, 100.00\\%, 97.67\\%, and 97.89\\% success. Optional local CEM centered on the Direct plan reaches 96.86\\% macro success using 384 instead of 9,000 candidate sequences, reducing sampling by 23.44times while improving pure CEM by 16.00 points. One shared four-task encoder reaches 89.39\\% E5 Direct macro and improves every task over jointly trained LeWM, while predicted--expert action-family kNN tracks Direct success at r=0.954. Direct inference takes 2.9--5.5 ms.', 'score': 11, 'issue_id': 2809, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f40203db20b293b4', 'authors': ['Junhan Sun', 'Hao Zhao', 'Guofeng Zhang'], 'affiliations': ['InSpatio', 'Institute for AI Industry Research (AIR), Tsinghua University', 'RoboParty Lab', 'State Key Laboratory of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26056.jpg', 'data': {'categories': ['#transfer_learning', '#reasoning', '#rl', '#benchmark', '#architecture', '#training', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'От намерения к действию без дорогостоящего поиска', 'desc': 'В работе предлагается INTACT — архитектура JEPA, которая преобразует размеченные действиями траектории без вознаграждений в развёртываемый интерфейс «намерение-действие». Модель использует физические намерения из переходов состояний и цели развёртывания, применяя изоморфную архитектуру с общими параметрами и единой четырёхслотовой грамматикой для локальных и глобальных движений. Система обучает распределённый закон действия, где условное математическое ожидание работает как безпоисковая политика, устраняя необходимость дорогостоящего поиска во время тестирования. На бенчмарке LeWM модель достигает высокой точности (85-100%) за один эпох без поиска, сохраняя вычислительную эффективность с латентностью 2.9-5.5 мс.'}, 'en': {'title': 'INTACT: Streamlining Action Recovery with Intent-to-Action Models', 'desc': 'The paper introduces INTACT, a novel framework that transforms action-labeled trajectories into a usable intent-to-action interface, enhancing the efficiency of action recovery in machine learning models. It employs a unique architecture that aligns local and goal motion-intent graphs, allowing for seamless integration of representation learning and control. By utilizing a robust distributional action law, INTACT eliminates the need for expensive search processes during deployment, enabling direct policy generation from learned intents. The results demonstrate significant improvements in task success rates and efficiency, showcasing the potential of INTACT in real-world applications.'}, 'zh': {'title': 'INTACT：无搜索的意图到动作转换', 'desc': '这篇论文介绍了一种名为INTACT的模型，它能够将标记了动作的轨迹转化为可部署的意图到动作接口。通过使用物理意图和未来目标，模型能够在没有昂贵搜索的情况下直接生成动作策略。INTACT的架构在局部和目标运动意图之间保持一致性，利用共享参数和相同的语法结构。实验结果表明，该模型在多个任务上表现出色，成功率高达85.78%到100%。'}}}, {'id': 'https://huggingface.co/papers/2607.28374', 'title': 'LEDGERMIND: Provenance-Constrained Multimodal Agentic Reasoning with a Structured Evidence Ledger', 'url': 'https://huggingface.co/papers/2607.28374', 'abstract': 'Abstract  Multimodal agents for visual question answering increasingly operate as multi-step trajectories that interleave perception, retrieval, and reasoning, yet evaluation still largely reduces to final-answer accuracy. This aggregate signal cannot tell whether a correct answer was reached through grounded evidence, language priors, or accidental error cancellation. We propose to treat a multimodal agent trajectory as a provenance-constrained state machine: tool outputs are normalized into a Structured Evidence Ledger that serves as the trajectory state, downstream reasoning and decision claims may cite only active ledger entries, grounding is checked at the entity and numeric level, and repair is realized as typed state transitions that cannot introduce content without tool-produced provenance. We instantiate this design as LedgerMind (Provenance-Constrained Multimodal Agentic Reasoning with a Structured Evidence Ledger), augmented by a Three-Layer Grounding Protocol, an Adaptive Dual-Path Dispatcher that matches reasoning depth to question complexity, and an Event-Triggered Verification-and-Repair engine with a formal provenance non-amplification guarantee. We use LedgerMind to target four recurring failure patterns that final-answer accuracy tends to obscure: unsupported intermediate reasoning, citation-backed entity hallucination (Phantom Grounding), over-reasoning on simple queries, and repair-time amplification. Experiments across multiple multimodal reasoning benchmarks and backbone MLLMs show that LedgerMind improves both answer accuracy and trajectory-level faithfulness.', 'score': 9, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'ebc69452286a36fb', 'authors': ['Enjun Du', 'Hange Zhou', 'Chenxu Du', 'Siyi Liu', 'Zirong Chen', 'Ziyu Zheng', 'Yongqi Zhang'], 'affiliations': ['The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'Tsinghua University', 'University of Sussex'], 'pdf_title_img': 'assets/pdf/title_img/2607.28374.jpg', 'data': {'categories': ['#interpretability', '#reasoning', '#hallucinations', '#benchmark', '#multimodal', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Проверяемое мультимодальное рассуждение через реестр доказательств', 'desc': 'В статье предложена система LedgerMind для мультимодальных агентов, которые отвечают на вопросы о изображениях через многошаговые рассуждения. Основная идея — обрабатывать траекторию агента как конечный автомат с ограничениями на источники информации, где все выводы должны быть подкреплены инструментами анализа и фактическими данными. Система включает три компоненты: трёхуровневый протокол проверки, адаптивный диспетчер для соответствия сложности вопроса и механизм восстановления ошибок с гарантией отсутствия усиления галлюцинаций. Эксперименты показывают, что LedgerMind улучшает как точность ответов, так и надёжность промежуточных рассуждений агента.'}, 'en': {'title': 'Enhancing Multimodal Reasoning with Provenance Tracking', 'desc': 'This paper introduces LedgerMind, a new framework for multimodal agents that enhances visual question answering by focusing on the entire reasoning process rather than just the final answer. It uses a Structured Evidence Ledger to track the sources of information and ensure that all claims made during reasoning are backed by valid evidence. The system includes mechanisms for grounding checks and state transitions that prevent the introduction of unsupported content. By addressing common failure patterns in multimodal reasoning, LedgerMind improves both the accuracy of answers and the reliability of the reasoning process.'}, 'zh': {'title': '提升多模态智能体推理的准确性与可信度', 'desc': '这篇论文提出了一种新的多模态智能体评估方法，称为LedgerMind。它通过构建一个结构化证据账本来跟踪智能体在回答视觉问题时的推理过程。该方法确保所有推理和决策都基于有效的证据，并通过多层次的基础协议来增强推理的深度和准确性。实验结果表明，LedgerMind在提高答案准确性和推理过程的可信度方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2607.28074', 'title': 'Echoverse: Deep, Evolving Environments for Training Computer-Use Agents at Scale', 'url': 'https://huggingface.co/papers/2607.28074', 'abstract': "Abstract  Computer-use agents learn from what their actions change, so training one needs applications it can act on, break and reset. The applications that matter most are login-gated and stateful, so synthetic environments stand in for them. Recent pipelines generate such environments in bulk, which moves the bottleneck from how many exist to what is inside each one. The returns, we find, come from three properties: how much behavioural depth an environment carries, whether it targets the interaction an agent actually fails, and whether it improves alongside the model. We present Echoverse, which compiles specifications into stateful applications whose tasks are graded against the application's own database, and a co-evolution loop that reads every graded rollout twice: as repairs to the environment, its tasks and its verifier, and as training signal for the model. Trained on twelve such environments, a 9B model improves from 36.5% to 67.1% across fourteen evaluation splits, within fourteen points of the much larger frontier model that taught it. We examine each property in turn. On the same domains, shallow environments push live-site accuracy below the base model (80.0 to 75.0) while deep ones raise it (80.0 to 85.0 and 48.0 to 65.0); drilling one interface control across many renderings transfers to held-out widget families and to the open web; and repairing a single environment lifts the model trained on it from 16.2% to 38.5%. The same worlds serve as reinforcement-learning environments, where a reward combining the grounded verifier with a dense per-step judge raises held-out score from 58.8% to 68.0%. We release four environments as a benchmark, with their applications, seed data and grounded graders. Code: https://aka.ms/echoverse", 'score': 9, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'feb33e94bb67099f', 'authors': ['Yash Pandya', 'Sahil Gupta', 'Sarthak Harne', 'Archana Yadav', 'Kavyansh Chourasia', 'Hussein Mozannar', 'Vibhav Vineet', 'Sara Abdali', 'Corby Rosset', 'Yash Lara', 'Ahmed Awadallah', 'Ece Kamar', 'Akshay Nambi'], 'affiliations': ['Microsoft Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.28074.jpg', 'data': {'categories': ['#open_source', '#rl', '#dataset', '#benchmark', '#synthetic', '#agents', '#training'], 'emoji': '🔄', 'ru': {'title': 'Синтетические окружения и совместная эволюция для обучения computer-use агентов', 'desc': 'Статья описывает методику создания синтетических окружений для обучения агентов, способных взаимодействовать с компьютерными приложениями. Авторы представляют систему Echoverse, которая компилирует спецификации в stateful приложения с автоматической проверкой качества, и реализуют co-evolution loop, где данные об ошибках агента используются одновременно для улучшения окружения и обучения модели. Модель размером 9B параметров, обученная на двенадцати таких окружениях, улучшила производительность с 36.5% до 67.1%, приблизившись к результатам значительно более крупных моделей. Исследование показало, что глубокие и динамичные окружения, адаптирующиеся под способности агента, критически важны для качественного обучения computer-use агентов.'}, 'en': {'title': 'Echoverse: Enhancing Agent Learning through Deep Synthetic Environments', 'desc': "This paper introduces Echoverse, a framework for training machine learning agents using synthetic environments that simulate real-world applications. The key focus is on creating stateful applications that provide meaningful interactions for agents to learn from, emphasizing the importance of behavioral depth and targeted interactions. The authors demonstrate that environments with greater complexity and relevance lead to significant improvements in model performance, showcasing a co-evolution loop that enhances both the environment and the agent's learning process. By training a 9B model on these environments, they achieve notable accuracy gains, highlighting the effectiveness of their approach in reinforcement learning settings."}, 'zh': {'title': 'Echoverse：提升代理学习的深度环境', 'desc': '这篇论文介绍了一种名为Echoverse的系统，用于训练计算机代理在复杂环境中学习。该系统通过生成状态保持的应用程序，帮助代理在真实应用中进行交互和学习。研究发现，环境的行为深度、针对代理失败的交互以及与模型的共同进化是提高学习效果的关键因素。通过在多个环境中训练，模型的性能显著提升，展示了深度环境的优势。'}}}, {'id': 'https://huggingface.co/papers/2607.27230', 'title': 'Multi-Head Attention Residuals', 'url': 'https://huggingface.co/papers/2607.27230', 'abstract': 'Abstract  Transformers propagate information across depth through a single additive residual stream: every sublayer reads only the most recent state. Attention residuals relax this by letting each sublayer attend, through a learned softmax. However, that read uses a single query shared across the entire width, so every feature subspace must read the depth history through one distribution. The cost of this forced compromise grows with how much the subspaces disagree about which layers to read, and disagreement grows with model width. We introduce Multi-Head Attention Residuals (MHAR): the routing query is reshaped into H per-subspace heads, each with its own softmax over the depth history. The read becomes block-diagonal, the reshape adds zero parameters and negligible compute, and H = 1 recovers attention residuals exactly. Trained from scratch on a deduplicated Nemotron-based anneal corpus that is quality-filtered and STEM- and code-heavy, MHAR improves validation loss over a standard Transformer at 100M, 350M, and 1B (-0.061, -0.149, and -0.140). It achieves the best result among four methods in every setting, with the gain increasing from 100M to the larger scales. The head count is a real design axis rather than a free knob: validation loss is U-shaped with respect to H, with a flat optimum at H = 4 or H = 8 across scales. We adopt H = 8 for large-scale models; over-splitting beyond this point (H = 16) consistently gives back part of the gain. A direct probe of the trained queries confirms that learned subspace disagreement is the underlying driver. Fused Triton routing kernels increase attention-residual training throughput from 0.2-0.5x to 0.55-0.88x of the baseline while maintaining near-baseline peak memory. An identity-preserving conversion using delta attention residuals supports 8B mid-training, yielding improvements of +3.2 on GSM8K and +3.1 on GPQA.', 'score': 8, 'issue_id': 2809, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'f097690ef2a66664', 'authors': ['Cheng Luo', 'Zefan Cai', 'Junjie Hu'], 'affiliations': ['Independent Researcher', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.27230.jpg', 'data': {'categories': ['#optimization', '#training', '#small_models', '#architecture'], 'emoji': '🔀', 'ru': {'title': 'Голосовой выбор информации: каждое подпространство трансформера выбирает свой путь через слои', 'desc': 'Статья представляет Multi-Head Attention Residuals (MHAR) — новый механизм для улучшения передачи информации через слои трансформера. В стандартных трансформерах информация передается через аддитивный остаточный поток, что создает узкое место, когда разные подпространства признаков должны читать историю глубины через одно распределение вероятностей. MHAR решает эту проблему, позволяя каждому подпространству иметь собственный softmax для выбора слоев, что делает операцию блочно-диагональной без добавления параметров. Метод показывает стабильные улучшения на моделях размером 100M, 350M и 1B параметров, с оптимальным количеством голов H = 8 и поддержкой масштабирования до 8B параметров.'}, 'en': {'title': 'Enhancing Transformers with Multi-Head Attention Residuals', 'desc': 'This paper introduces Multi-Head Attention Residuals (MHAR) to enhance the information flow in Transformer models. Unlike traditional attention mechanisms that use a single query for all features, MHAR allows each feature subspace to have its own query, improving how layers are accessed. This method reduces the negative impact of subspace disagreement, which becomes more pronounced as model width increases. The results show that MHAR significantly lowers validation loss across various model sizes, demonstrating its effectiveness in training large-scale models.'}, 'zh': {'title': '多头注意力残差：提升Transformer性能的新方法', 'desc': '本文提出了一种新的多头注意力残差机制（MHAR），旨在改善传统Transformer模型的信息传播方式。MHAR通过为每个子空间头部引入独立的查询和softmax，使得每个子空间可以更灵活地选择读取的层，从而减少了不同子空间之间的冲突。实验结果表明，MHAR在多个模型规模下的验证损失均优于标准Transformer，且随着模型规模的增大，性能提升更加显著。最终，MHAR在大规模模型中采用H=8的设计，取得了最佳效果。'}}}, {'id': 'https://huggingface.co/papers/2607.27958', 'title': 'Σ-Mem: An Online Reliability Memory for LLM-based Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2607.27958', 'abstract': "Abstract  Memory is central to long-horizon LLM agents, yet existing memory systems primarily preserve interaction content rather than modeling which agents can be trusted and under what conditions. This limitation is particularly important in multi-agent systems, where a central model may be unable to directly verify plausible or correlated peer responses. We introduce Σ-Mem, an online reliability memory that records historical competence evidence for individual peers and peer relationship evidence across the peer set. Both forms of evidence are maintained as real symmetric states and updated from post-decision correctness feedback. By Weyl's inequality, the spectral change caused by each event-level update is bounded, enabling stable online adaptation without retraining the underlying models. Σ-Mem provides a general write-and-read interface: the same memory can be used for residual steering of a central model, response-free peer routing, or reliability-weighted voting. Across five Qwen-family models, Σ-Mem adapts to counterfactual reliability shifts and generalizes to unseen peers and task domains. Direct memory readouts also outperform majority voting and the best fixed peer over the full OOD evaluation set. Moreover, performance improves consistently as more correctness feedback becomes available, indicating that Σ-Mem progressively accumulates actionable reliability information. These results establish reliability memory as a reusable foundation for adaptive coordination in LLM-based multi-agent systems.", 'score': 7, 'issue_id': 2811, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'ea5ecf33518edea4', 'authors': ['Peilin Feng', 'Suorong Yang', 'Soujanya Poria'], 'affiliations': ['Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27958.jpg', 'data': {'categories': ['#alignment', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Надёжная память для координации мультиагентных LLM-систем', 'desc': 'В статье предлагается Σ-Mem, система онлайн-памяти для мультиагентных систем на основе LLM, которая отслеживает надёжность отдельных агентов и взаимосвязи между ними на основе исторических данных. Память поддерживается в виде симметричных матриц состояния и обновляется по спектральному принципу Вейля, что обеспечивает стабильную адаптацию без переобучения основных моделей. Предложенный интерфейс позволяет использовать одну память для рулирования центральной модели, маршрутизации запросов между агентами и взвешенного голосования. Эксперименты на моделях Qwen показывают, что система хорошо адаптируется к изменениям надёжности, обобщается на новые агенты и области задач, и последовательно улучшает качество по мере накопления информации обратной связи.'}, 'en': {'title': 'Building Trust in Multi-Agent Systems with Σ-Mem', 'desc': 'This paper presents Σ-Mem, a novel memory system designed for long-horizon large language model (LLM) agents in multi-agent environments. Unlike traditional memory systems that only store interaction content, Σ-Mem tracks the reliability of individual peers and their relationships based on historical performance feedback. It utilizes real symmetric states to maintain evidence of competence and relationships, allowing for stable online updates without the need for retraining. The results show that Σ-Mem enhances decision-making by adapting to reliability changes and improving performance as more feedback is gathered, making it a valuable tool for coordination among LLM agents.'}, 'zh': {'title': 'Σ-Mem：智能体系统中的可靠性记忆', 'desc': '本文介绍了一种名为Σ-Mem的在线可靠性记忆系统，旨在解决多智能体系统中信任建模的不足。Σ-Mem记录了个体智能体的历史能力证据和智能体之间的关系证据，并通过决策后的反馈进行更新。该系统利用Weyl不等式确保每次更新的谱变化是有界的，从而实现稳定的在线适应，而无需重新训练模型。实验结果表明，Σ-Mem在应对可靠性变化和未见智能体及任务领域时表现出色，且随着正确性反馈的增加，性能持续提升。'}}}, {'id': 'https://huggingface.co/papers/2607.26637', 'title': 'Filesystem-Based Memory for LLM Agents: Organization, Evolution, and Sustainability', 'url': 'https://huggingface.co/papers/2607.26637', 'abstract': "Abstract  Deployed LLM agents increasingly keep their long-term memory as a filesystem: a directory tree of markdown files that the agent itself reads, writes, and reorganizes through generic file tools. Yet research has largely passed over this medium: prior systems design bespoke memory representations and study retrieval over them, leaving the default's two working assumptions untested: that an agent can keep a growing store organized as memories accumulate, conflict, and go stale, and that this organization pays. We present the first systematic exploration of filesystem-based memory for LLM agents. We formalize the setting as three roles around one memory filesystem: a management agent integrates and organizes incoming content, a search agent answers queries with cited sources, and an execution agent supplies task trajectories that are distilled into skills, unifying declarative memory and skills in a single store. Across long-conversation benchmarks and embodied tasks, we vary memory shape (agent-organized hierarchy, verbatim dump, chunk retrieval), stream scale, tool harness (sandboxed shell, memory-tool-style functions, varied search tooling), and the strengths of the management and search agents, tracking answer quality, cost, and store health as memory grows. What organization reliably buys is search economy: organized stores roughly halve retrieval cost where material is large. Today's agents, however, fall short of the default's promise: in our growth study, organization erodes for all but the strongest management agent, and no agent we measure converts organization itself into better answers. And the model is not the only lever over a store's shape: changing the tool set alone reshapes the store as strongly as swapping the model. The study turns the filesystem default from an assumption into a design space for agent memory.", 'score': 6, 'issue_id': 2811, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '401cad35ead9d7fc', 'authors': ['Sizhe Zhou', 'Sheldon Yu', 'Hui Wei', 'Junda Wu', 'Siru Ouyang', 'Yizhu Jiao', 'Shijia Pan', 'Julian McAuley', 'Yu Zhang', 'Tong Yu', 'Jiawei Han'], 'affiliations': ['Adobe Research', 'Texas A&M University', 'University of California, Merced', 'University of California, San Diego', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2607.26637.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#long_context', '#agents'], 'emoji': '🗂️', 'ru': {'title': 'От предположений к дизайну: организация памяти LLM агентов в файловой системе', 'desc': 'В исследовании изучается использование файловой системы в качестве долгосрочной памяти для LLM агентов. Авторы формализуют проблему через три роли: агент управления организует поступающий контент, агент поиска отвечает на запросы с указанием источников, и агент выполнения интегрирует траектории задач в навыки. Систематически варьируя структуру памяти, масштаб потока данных и инструменты, исследователи измеряют качество ответов, стоимость и здоровье хранилища по мере накопления информации. Результаты показывают, что организованная память снижает затраты на поиск примерно вдвое, но современные агенты плохо справляются с поддержанием порядка, и выбор инструментов влияет на структуру памяти так же сильно, как выбор модели.'}, 'en': {'title': 'Optimizing Memory Management in LLM Agents with Filesystem Design', 'desc': 'This paper investigates how large language model (LLM) agents can use a filesystem as their long-term memory. It introduces a structured approach where different roles manage, search, and execute tasks using this memory system. The research shows that while organized memory can reduce retrieval costs, current agents struggle to maintain effective organization as memory grows. Ultimately, the study highlights the importance of filesystem design in enhancing the efficiency of memory management for LLM agents.'}, 'zh': {'title': '优化LLM代理的文件系统记忆组织', 'desc': '本论文探讨了大型语言模型（LLM）代理如何使用文件系统作为长期记忆的存储方式。研究表明，代理可以通过管理代理、搜索代理和执行代理三种角色来组织和检索记忆内容。我们发现，良好的组织可以显著降低检索成本，但当前的代理在组织能力上仍有不足。通过改变工具集和代理的管理能力，可以有效地影响记忆存储的结构和性能。'}}}, {'id': 'https://huggingface.co/papers/2607.26627', 'title': 'Revisiting Lossy Verification in Speculative Decoding: Mechanisms, Trade-offs, and Failure Modes', 'url': 'https://huggingface.co/papers/2607.26627', 'abstract': 'Abstract  Speculative Decoding (SD) accelerates large language model inference by allowing a lightweight draft model to propose tokens that are subsequently verified in parallel by a larger target model. Recent approaches introduce lossy verification schemes to further improve efficiency by relaxing strict distributional matching. Yet such relaxation silently rewrites the decoding distribution, and the resulting acceleration can come at the cost of unstable, sometimes severely degraded generation quality. In this work, we present a principled analysis of the distributions induced by lossy verification methods. We show that many seemingly distinct approaches differ only superficially and can be classified into two categories: truncation-based verification and collaborative verification. We further construct a diagnostic evaluation framework across curated benchmarks. For truncation-based methods, we identify a fundamental pitfall: performance can degrade significantly compared to the true truncation sampling baseline due to distributional distortion. For collaborative verification, we uncover a key principles: controlling the overshoot of draft probabilities relative to target probabilities is essential to prevent low-quality outputs. Our code is available at https://github.com/ZhouYuxuanYX/Fast-HSD.', 'score': 4, 'issue_id': 2809, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'b1a00f9eb943b145', 'authors': ['Tianyu Wang', 'Yuxuan Zhou', 'Wenbin Wang', 'Heng Li', 'Zikai Xiao', 'Junyuan Shang'], 'affiliations': ['Baidu Inc.', 'Independent Researcher', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26627.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Контроль распределений в спекулятивном декодировании для стабильного ускорения инференса', 'desc': 'В работе анализируется спекулятивное декодирование — метод ускорения инференса больших языковых моделей, где лёгкая черновая модель предлагает токены, а крупная целевая модель их проверяет. Авторы исследуют методы с нестрогой верификацией, которые расслабляют требование строгого совпадения распределений для повышения эффективности. Они классифицируют существующие подходы на две категории: верификация на основе усечения и совместная верификация, и показывают, что первые могут вызывать значительное искажение распределения и деградацию качества. Для совместной верификации авторы выявляют критическое условие: контроль превышения вероятностей черновой модели относительно целевой модели необходим для сохранения качества генерации.'}, 'en': {'title': 'Balancing Speed and Quality in Language Model Decoding', 'desc': 'This paper discusses Speculative Decoding (SD), a method that speeds up the process of generating text with large language models by using a smaller draft model to suggest words. It highlights the challenges of using lossy verification methods, which can lead to poor quality outputs due to changes in the decoding distribution. The authors categorize different verification approaches into truncation-based and collaborative methods, analyzing their strengths and weaknesses. They emphasize the importance of managing the relationship between draft and target model probabilities to maintain high-quality text generation.'}, 'zh': {'title': '优化语言模型推理的关键在于控制概率分布', 'desc': '本文探讨了投机解码（SD）在大型语言模型推理中的应用，利用轻量级草稿模型提出令牌，并由更大的目标模型并行验证。近期的方法引入了有损验证方案，以提高效率，但这种放松严格分布匹配的做法可能会导致解码分布的变化，从而影响生成质量。我们分析了有损验证方法所引发的分布，并将其分为基于截断的验证和协作验证两类。研究表明，控制草稿概率相对于目标概率的超出程度对于防止低质量输出至关重要。'}}}, {'id': 'https://huggingface.co/papers/2607.27372', 'title': 'Explorative Modeling: Unlocking a Third Pretraining Axis and End-to-End Generation', 'url': 'https://huggingface.co/papers/2607.27372', 'abstract': 'Abstract  The deep learning revolution, kicked off by AlexNet, taught us that end-to-end training beats decomposing a problem into hand-designed stages. Generative modeling, however, has remained the exception-despite generative models being remarkably capable, they are still not trained end-to-end. This is because, at its core, generative modeling is about handling distributions with many modes, and existing scalable approaches handle this the same way, by factoring the generation procedure, which prevents end-to-end generation. In this work, we introduce Explorative Modeling, a new paradigm that instead factors the training loop, exploring K candidate matches between model generations and data, and training on the best, so predictions commit to modes rather than blurring them. We find Explorative Models (XMs) useful in two settings. First, increasing exploration adds a third pretraining axis beyond parameters and data for existing generative models-where scaling exploration monotonically improves performance across both continuous and discrete domains (images, video, and language). Notably, gains from exploration increase with scale, climbing from 7% to 36% as data scales and from 13% to 23% as models grow, with efficiency gains more than doubling at 3x the compute. Concretely, exploration improves FLOP efficiency by 4.1x, sample efficiency by 6.2x, parameter efficiency by 47%, lifts the strongest of image-generation recipes to a near-state-of-the-art 1.43 FID on ImageNet without guidance, enables scaling how end-to-end existing models are, and unlocks scaling generalization. Second, XMs enable end-to-end reconstructive generative modeling, matching diffusion on control tasks with 16-256x fewer inference steps. Together, these results establish XMs as both a new pretraining axis for existing generative models and a standalone end-to-end generative modeling paradigm.', 'score': 3, 'issue_id': 2809, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '57b54a9d1ee87445', 'authors': ['Alexi Gladstone', 'Heng Ji', 'Yilun Du'], 'affiliations': ['Harvard', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2607.27372.jpg', 'data': {'categories': ['#diffusion', '#multimodal', '#architecture', '#training', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'От размытия к выбору: исследование как третья ось масштабирования генеративных моделей', 'desc': 'В работе предложена новая парадигма Explorative Modeling, которая факторизует цикл обучения вместо факторизации процесса генерации, позволяя моделям исследовать несколько кандидатов и выбирать лучший вариант. Этот подход преодолевает традиционное ограничение генеративных моделей, которые размывают режимы распределений, вместо того чтобы выбирать один определённый режим. Исследование показывает, что добавление компоненты исследования в предварительное обучение значительно улучшает эффективность моделей по параметрам, данным и вычислениям - с выигрышами до 4.1x по FLOP и 6.2x по sample efficiency. Одновременно XMs позволяют достичь истинно сквозного обучения в генеративном моделировании и показывают конкурентные результаты в задачах контролируемой генерации с намного меньшим количеством шагов инференса.'}, 'en': {'title': 'Explorative Modeling: Revolutionizing Generative Training', 'desc': 'This paper introduces a new approach called Explorative Modeling (XM) for generative modeling, which allows for end-to-end training. Traditional generative models often struggle with complex distributions, but XM improves performance by exploring multiple candidate matches between generated data and real data during training. The authors demonstrate that increasing exploration leads to significant performance gains across various domains, including images and language, with improvements in efficiency metrics. Ultimately, XM not only enhances existing generative models but also establishes a new paradigm for reconstructive generative modeling.'}, 'zh': {'title': '探索性建模：生成模型的新范式', 'desc': '深度学习的革命始于AlexNet，表明端到端训练优于将问题分解为手工设计的阶段。然而，生成建模仍然是一个例外，尽管生成模型非常强大，但它们仍未实现端到端训练。本文提出了一种新的范式——探索性建模，通过在模型生成和数据之间探索候选匹配，训练最佳匹配，从而使预测更准确。探索性模型在提高生成模型性能方面表现出色，尤其是在数据和模型规模增加时，效率显著提升。'}}}, {'id': 'https://huggingface.co/papers/2607.20891', 'title': 'Is Deep Research Reliable? Misleading Knowledge Induces False Conclusions', 'url': 'https://huggingface.co/papers/2607.20891', 'abstract': 'Abstract  Deep Research agents extend LLM-based assistants into long-horizon workflows involving planning, retrieval, evidence synthesis, and report generation, yet their reliability in open information environments remains underexplored. A key concern is whether apparently credible but factually misleading knowledge encountered in such environments can propagate through these workflows and be adopted as false conclusions in final reports. To study this failure mode, we introduce MisKnow-Agent, a framework for constructing and validating misleading knowledge for Deep Research tasks. MisKnow-Agent generates misleading instances with controllable authority levels and styles, yielding 5,933 quality-controlled instances built on DeepResearch Benchmark tasks. Extensive experiments across open-source and closed-source Deep Research agents show that even limited exposure to misleading knowledge can induce false-conclusion adoption in final reports, revealing a broad reliability vulnerability in current Deep Research agents. Although search-enabled verifier models consistently identify the retained instances as misleading during focused corpus validation, the same instances can still be adopted during long-horizon research, revealing a disconnect between focused verification and workflow-level evidence use. Finally, we evaluate pre- and post-research defenses, both individually and in combination, finding that all three configurations mitigate but do not fully prevent false-conclusion adoption. Our findings suggest that reliable Deep Research requires evidence verification and correction capabilities at both the model and framework levels, beyond improvements in planning, retrieval, evidence integration, or report-generation abilities.', 'score': 3, 'issue_id': 2810, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': '50562914cde9637e', 'authors': ['Pengyu Zhu', 'Lijun Li', 'Longju Yang', 'Sen Su', 'Jing Shao'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Chongqing University of Posts and Telecommunications', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.20891.jpg', 'data': {'categories': ['#benchmark', '#agents', '#hallucinations', '#dataset', '#open_source', '#synthetic'], 'emoji': '🚨', 'ru': {'title': 'Защита агентов глубокого исследования от ложной информации', 'desc': 'В работе исследуется надёжность агентов глубокого исследования, работающих на основе большие языковые модели, которые выполняют сложные многошаговые задачи с планированием, поиском информации и генерацией отчётов. Авторы показывают, что даже ограниченное воздействие ложной информации может привести к тому, что агенты включат неправильные выводы в итоговые отчёты, выявляя серьёзную уязвимость в надёжности современных систем. Хотя верификаторы с возможностью поиска успешно определяют вводящую в заблуждение информацию при целевой проверке, эта же информация может быть принята во время длительного исследовательского процесса. Исследование показывает, что для обеспечения надёжного глубокого исследования необходима проверка и коррекция доказательств на уровне как модели, так и всей системы.'}, 'en': {'title': 'Ensuring Reliability in Deep Research: Combatting Misleading Knowledge', 'desc': 'This paper introduces MisKnow-Agent, a framework designed to study how misleading information can affect long-term research workflows in machine learning agents. It highlights the risk that seemingly credible but incorrect knowledge can lead to false conclusions in final reports generated by these agents. The research shows that even a small amount of misleading information can significantly impact the reliability of Deep Research agents, despite their ability to identify such misinformation during focused validation. The authors emphasize the need for enhanced verification and correction mechanisms to ensure the accuracy of conclusions drawn from these workflows.'}, 'zh': {'title': '提升深度研究代理的可靠性', 'desc': '本论文探讨了深度研究代理在长时间工作流程中的可靠性，尤其是在开放信息环境中。我们引入了MisKnow-Agent框架，用于构建和验证误导性知识，以研究其在深度研究任务中的影响。实验表明，即使是有限的误导性知识接触，也会导致最终报告中错误结论的采纳，显示出当前深度研究代理的广泛可靠性漏洞。为了提高深度研究的可靠性，必须在模型和框架层面具备证据验证和纠正能力，而不仅仅依赖于规划、检索和报告生成的改进。'}}}, {'id': 'https://huggingface.co/papers/2607.27652', 'title': 'Harness-G: A Graph-Structured Harness for Search Agents', 'url': 'https://huggingface.co/papers/2607.27652', 'abstract': 'Abstract  Reinforcement learning (RL) search agents commonly model retrieval as free-form natural-language query generation and optimize multi-turn interactions using final-answer rewards. Current studies mainly improve training with denser or more structured credit signals, but rarely examine whether retrieval is properly formulated at the policy-environment interface. We observe pronounced retrieval aliasing during Search-R1 training: rollouts for the same question continue to generate distinct query strings, yet their accumulated evidence sets increasingly overlap. We call this phenomenon retrieval-equivalence collapse; in this regime, trajectories approach utility equivalence with respect to retrieval decisions, leaving within-group returns with little effective retrieval contrast. To address this problem, we propose Harness-G, a graph-structured retrieval framework that redesigns this interface. It reformulates free-form query generation as finite action selection: the policy selects an evidence sentence or entity, or chooses to answer, while the environment constructs the menu, tracks retrieval state, and validates and executes each choice. This interface reduces linguistic aliasing and makes same-state alternatives directly comparable. Building on this interface, we introduce Structured Non-myopic Credit (SNC), which uses a frozen answer scorer to compare the selected action with its alternatives and assigns downstream gains to the earlier actions that enabled them. Across six QA benchmarks, Harness-G achieves the highest average F1 at both evaluated model scales, outperforming the strongest baseline, Graph-R1, by 10.74 points at 1.5B and 3.98 points at 3B.', 'score': 2, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '2b17645a00a40b5a', 'authors': ['Yanning Hou', 'Haoyuan Chen', 'Sihang Zhou', 'Xiaoshu Chen', 'Xirui Liu', 'Duanyang Yuan', 'Lingyuan Meng', 'Quan Liu', 'Jian Huang'], 'affiliations': ['National University of Defense Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.27652.jpg', 'data': {'categories': ['#graphs', '#reasoning', '#rl', '#benchmark', '#agents', '#training', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Структурированный поиск информации через переформулирование интерфейса политики и окружения', 'desc': "В статье рассматривается проблема переформулирования задачи поиска информации в системах обучения с подкреплением для ответов на вопросы. Авторы выявили явление 'коллапса эквивалентности поиска', когда разные текстовые запросы приводят к практически идентичным наборам доказательств, что затрудняет обучение политики. Они предлагают Harness-G — фреймворк, который преобразует генерацию свободной формы запроса в выбор конечного числа действий из структурированного графа, а также вводят структурированный неглавный кредит (SNC) для более точного распределения наград. Экспериментальные результаты показывают значительное улучшение производительности на бенчмарках вопросно-ответных систем по сравнению с существующими методами."}, 'en': {'title': 'Harness-G: Redefining Retrieval in Reinforcement Learning', 'desc': 'This paper addresses challenges in reinforcement learning (RL) for search agents, particularly focusing on how queries are generated and evaluated. It identifies a problem called retrieval-equivalence collapse, where different query strings yield similar results, reducing the effectiveness of retrieval decisions. To solve this, the authors propose a new framework called Harness-G, which organizes the retrieval process into a graph structure, allowing for clearer comparisons between actions. Additionally, they introduce Structured Non-myopic Credit (SNC) to better reward earlier actions that lead to successful retrieval outcomes, demonstrating significant performance improvements across various benchmarks.'}, 'zh': {'title': '优化检索代理的强化学习新框架', 'desc': '这篇论文探讨了强化学习中的检索代理如何生成自然语言查询，并优化多轮交互。研究发现，在Search-R1训练中存在检索等价崩溃现象，即相同问题的不同查询字符串产生重叠的证据集。为了解决这个问题，提出了Harness-G框架，通过将自由形式的查询生成重新设计为有限动作选择，减少了语言上的混淆。该框架结合了结构化非短视信用（SNC），在多个问答基准测试中表现优异，显著提高了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2607.28319', 'title': 'Fairness Pruning: Locating Demographic Bias in GLU-MLP Layers via Differential Activations', 'url': 'https://huggingface.co/papers/2607.28319', 'abstract': 'Abstract  This work presents Fairness Pruning, a lightweight structural intervention method designed for the management and future mitigation of demographic bias in large language models (LLMs). As a foundational empirical validation of this method, this work focuses on causal bias localization. Using minimally contrastive prompt pairs and inference-time activation capture, the method identifies neurons that react differentially when processing demographic attributes in GLU architectures, evaluating the signal at the down_proj input. Empirical evaluation was conducted on models of up to 3 billion parameters (Llama-3.2 family and Salamandra-2B), combining standardized benchmark evaluation with qualitative text generation experiments. Results demonstrate that zeroing the identified neurons alters how the model responds to associated demographic variables. However, rather than producing flat mitigation, the intervention causes bidirectional bias destabilization: because BiasScore is unsigned, candidate sets mix neurons that push toward and against the stereotype, and the net effect on aggregate bias depends on which sign dominates. The intervention is extremely surgical: zeroing at most 40 neurons in Llama-3.2-1B (less than 0.031% of total MLP width) achieves a mean retention of 99.49% in reasoning and general knowledge capabilities. These findings empirically confirm that demographic bias processing and model capabilities operate on dissociable circuits, establishing the methodological foundations for transitioning from blind zeroing toward directional behavior modulation.', 'score': 2, 'issue_id': 2811, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'bd789924450865cf', 'authors': ['Pere Martra', 'Eugenio Martínez Cámara', 'Alfonso Ureña López'], 'affiliations': ['Universidad Internacional Menendez Pelayo', 'Universidad de Jaen'], 'pdf_title_img': 'assets/pdf/title_img/2607.28319.jpg', 'data': {'categories': ['#small_models', '#inference', '#interpretability', '#ethics'], 'emoji': '⚖️', 'ru': {'title': 'Хирургическое удаление предвзятости: выделение и нейтрализация демографических смещений в языковых моделях', 'desc': 'Исследование представляет метод Fairness Pruning для управления демографической предвзятостью в больших языковых моделях через структурное вмешательство. Авторы используют минимально контрастные пары подсказок и захват активаций нейронов для локализации смещения в архитектурах GLU, находя нейроны, которые по-разному реагируют на демографические атрибуты. Эксперименты на моделях до 3 миллиардов параметров показали, что обнуление менее 40 нейронов позволяет изменить реакцию модели на демографические переменные при сохранении 99.49% её способностей в рассуждении и знаниях. Результаты подтверждают, что обработка предвзятости и общие способности модели функционируют на независимых нейронных цепях, что открывает путь от простого обнуления к направленной модуляции поведения.'}, 'en': {'title': 'Surgical Bias Mitigation in Language Models', 'desc': "This paper introduces Fairness Pruning, a method aimed at reducing demographic bias in large language models (LLMs) by targeting specific neurons. It employs causal bias localization to identify neurons that respond differently based on demographic attributes, using techniques like minimally contrastive prompt pairs. The method was tested on models with up to 3 billion parameters, showing that selectively zeroing certain neurons can significantly alter the model's responses to demographic variables. The results indicate that while this intervention can mitigate bias, it may also lead to unintended consequences, highlighting the complexity of bias management in LLMs."}, 'zh': {'title': '公平修剪：减轻语言模型中的人口偏见', 'desc': '本文提出了一种名为公平修剪（Fairness Pruning）的轻量级结构干预方法，旨在管理和减轻大型语言模型（LLMs）中的人口统计偏见。该方法通过因果偏见定位，利用最小对比提示对和推理时激活捕获，识别在处理人口属性时反应不同的神经元。实证评估显示，零化这些神经元会改变模型对相关人口变量的响应，但这种干预并不会简单地消除偏见，而是导致双向偏见的不稳定。研究结果表明，人口偏见处理与模型能力在不同的电路上运作，为从盲目零化转向定向行为调节奠定了方法论基础。'}}}, {'id': 'https://huggingface.co/papers/2607.23193', 'title': 'OmniScope: Modality-Decoupled Token Compression for Omnimodal Large Language Models', 'url': 'https://huggingface.co/papers/2607.23193', 'abstract': 'Abstract  Existing token compression methods for omnimodal large language models typically rely on one modality to determine what to retain in the other. We show that this assumption often breaks down: for the same query, audio and video relevance often peaks at different moments. This cross-modal salience mismatch makes unidirectional guidance prone to discarding answer-critical cues under aggressive compression. We propose OmniScope, a training-free token compression framework that uses the query as a shared semantic anchor while estimating relevance separately for audio and video. OmniScope allocates modality-specific token budgets, prunes visual tokens with an anchor-delta strategy that preserves both global context and temporal changes, and merges audio tokens within each second to reduce redundancy while maintaining temporal continuity. Across four audio-video benchmarks and two Qwen2.5-Omni model scales, OmniScope achieves the best average accuracy across all compression settings. At 25% overall token retention, it delivers up to 3.53x prefill speedup and more than 15% GPU memory reduction, with only a 0.35-point drop in average accuracy. These results suggest a simple design principle for OmniLLM inference: share the query across modalities, but not the salience estimates. The code is available at https://github.com/MAC-AutoML/OmniScope.', 'score': 2, 'issue_id': 2815, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'a5f2fbbd484632a6', 'authors': ['Jinsen Su', 'Yongdong Luo', 'Yuexiao Ma', 'Yibo Hu', 'Meiguang Jin', 'Xiaowu Zheng'], 'affiliations': ['Alibaba Group', 'Institute of Artificial Intelligence, Xiamen University', 'Media Analytics and Computing Lab, Xiamen University', 'School of Informatics, Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2607.23193.jpg', 'data': {'categories': ['#inference', '#video', '#multimodal', '#audio', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Независимая оценка релевантности для эффективного сжатия омнимодальных данных', 'desc': 'В работе предложен OmniScope — фреймворк сжатия токенов для омнимодальных больших языковых моделей, который решает проблему несовпадения релевантности между модальностями. Авторы показали, что для одного и того же запроса пики релевантности аудио и видео часто возникают в разные моменты времени, поэтому унидирекциональное руководство одной модальностью может привести к потере критичной информации при агрессивном сжатии. Предложенный метод использует запрос как общий семантический якорь и оценивает релевантность отдельно для каждой модальности, распределяя модально-специфичные бюджеты токенов и применяя стратегию anchor-delta для сохранения глобального контекста и временных изменений. Экспериментальные результаты на четырёх бенчмарках показывают, что при сохранении 25% токенов метод достигает ускорения prefill в 3.53 раза и снижения использования памяти GPU более чем на 15% с падением точности всего на 0.35 пункта.'}, 'en': {'title': 'OmniScope: Smart Token Compression for Audio-Video Models', 'desc': 'This paper introduces OmniScope, a novel token compression framework designed for omnimodal large language models. Unlike traditional methods that rely on one modality to guide the compression of another, OmniScope recognizes that audio and video relevance can peak at different times for the same query. By using the query as a shared semantic anchor, it separately estimates relevance for audio and video, allowing for more effective token pruning. The framework achieves significant improvements in speed and memory efficiency while maintaining high accuracy across various benchmarks.'}, 'zh': {'title': 'OmniScope：跨模态令牌压缩的新方法', 'desc': '现有的多模态大语言模型的令牌压缩方法通常依赖一种模态来决定保留另一种模态的内容。我们发现这种假设常常不成立：对于同一个查询，音频和视频的相关性在不同的时刻达到峰值。这种跨模态的显著性不匹配使得单向指导在激进压缩下容易丢弃关键答案线索。我们提出了OmniScope，一个无训练的令牌压缩框架，它使用查询作为共享语义锚点，同时分别估计音频和视频的相关性。'}}}, {'id': 'https://huggingface.co/papers/2607.18806', 'title': 'AI Tour Meeting: Group Travel Planning by LLM Agents', 'url': 'https://huggingface.co/papers/2607.18806', 'abstract': 'Abstract  This paper proposes AI Tour Meeting, a group travel planning framework powered by multiple Large Language Model (LLM)-based agents. The agents are instantiated with distinct personas and collaboratively seek an itinerary that satisfies their constraints and preferences through natural language discussion. The framework enables easy and flexible orchestration of such discussions by providing interfaces for configuring agent personas, discussion workflows, monitoring, and LLM deployment. Its primary use case is a simulation tool for analyzing the behavior of multiple LLM agents during tour planning discussions. This paper demonstrates the utility of the framework by presenting system validation and several analytical results obtained by the framework.', 'score': 2, 'issue_id': 2809, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '86208ebdefb1d5d1', 'authors': ['Daisuke Kikuta'], 'affiliations': ['NTT, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2607.18806.jpg', 'data': {'categories': [], 'emoji': '✈️', 'ru': {'title': 'Многоагентные LLM как командные консультанты по путешествиям', 'desc': 'Статья предлагает AI Tour Meeting — фреймворк для планирования групповых путешествий, использующий нескольких LLM-агентов с различными персоналиями. Агенты взаимодействуют через естественный язык, совместно разрабатывая маршрут, который учитывает ограничения и предпочтения каждого участника. Фреймворк предоставляет удобные интерфейсы для конфигурации персоналий агентов, управления процессом обсуждения и мониторинга работы моделей. Авторы демонстрируют практическую ценность системы через валидацию и анализ поведения множественных LLM-агентов в контексте планирования туров.'}, 'en': {'title': 'Collaborative Travel Planning with AI Agents', 'desc': 'This paper introduces the AI Tour Meeting framework, which utilizes multiple Large Language Model (LLM)-based agents to assist in group travel planning. Each agent has a unique persona and they work together to create an itinerary that meets various constraints and preferences through natural language interactions. The framework offers tools for configuring agent personas, managing discussion workflows, and monitoring LLM performance, making it adaptable for different scenarios. The authors validate the system and showcase its effectiveness through analytical results derived from simulations of LLM agents engaged in tour planning discussions.'}, 'zh': {'title': '智能旅行规划，协作无界限', 'desc': '本文提出了一种名为AI Tour Meeting的框架，用于群体旅行规划，基于多个大型语言模型（LLM）代理。每个代理具有不同的角色，通过自然语言讨论共同寻找满足其约束和偏好的行程。该框架提供了配置代理角色、讨论工作流程、监控和LLM部署的接口，使得讨论的组织变得简单灵活。本文通过系统验证和多个分析结果展示了该框架的实用性。'}}}, {'id': 'https://huggingface.co/papers/2607.28308', 'title': 'Beyond Geometric Complementarity: Coherent Overlap in Sparse Mixture-of-Experts Routing', 'url': 'https://huggingface.co/papers/2607.28308', 'abstract': 'Abstract  Sparse mixture-of-experts (MoE) language models route each token to multiple experts, suggesting a geometric account of their benefit: co-selected experts should contribute distinct representation directions. Existing evidence often conflates route coherence, candidate quality, and candidate-by-context interaction. We distinguish these quantities using an Expert Subspace Separation Index (ESSI), matched-route residuals, and a prefix-controlled 2times2 factorial; frozen-route interventions and a controlled Top-k study assess functional value. Three paired contrasts organize the findings. First, across six MoE architectures, expert subspaces overlap substantially, yet actual routes explain token representations better than matched alternatives. Second, across the 39 factorial cells in OLMoE, Mixtral, and DeepSeek, the selected candidate explains more of the residual representation than the strongest unselected rival in every cell, yet the actual prefix narrows this advantage throughout: all interactions are negative, and every 95% confidence interval lies below zero. Third, this geometric narrowing does not imply functional redundancy: adding later experts improves next-token prediction in 24 of 39 frozen-route comparisons, while the other 15 estimates are inconclusive; a controlled training study also favors Top-2 over Top-1 in all three seeds. We call this joint pattern coherent overlap: routing selects token-relevant experts from a shared geometric neighborhood, while useful multi-expert computation persists without disjoint linear coverage. Separating these quantities clarifies why geometric similarity alone cannot determine redundancy or pruning value.', 'score': 1, 'issue_id': 2812, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '15016989d3dd29d8', 'authors': ['Huiyuan Tian', 'Bonan Xu', 'Shijian Li'], 'affiliations': ['College of Computer Science and Technology, Zhejiang University', 'Department of Aeronautical and Aviation Engineering, The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28308.jpg', 'data': {'categories': ['#architecture', '#interpretability', '#training', '#optimization'], 'emoji': '🧭', 'ru': {'title': 'Геометрическое перекрытие экспертов в MoE как источник эффективности маршрутизации', 'desc': 'В статье исследуется, как разреженные модели смеси экспертов (MoE) маршрутизируют токены к нескольким экспертам, и авторы предлагают геометрическое объяснение их эффективности. Они вводят метрику Expert Subspace Separation Index (ESSI) и проводят контролируемые эксперименты, чтобы разделить влияние согласованности маршрутизации, качества выбранных экспертов и их взаимодействия с контекстом. Результаты показывают, что подпространства экспертов существенно перекрываются, но выбранные маршруты лучше объясняют представления токенов, и добавление дополнительных экспертов улучшает предсказание следующего токена. Авторы вводят концепцию «когерентного перекрытия»: маршрутизация выбирает релевантные для токена эксперты из общей геометрической окрестности, обеспечивая полезное многоэкспертное вычисление без необходимости в линейно раздельных подпространствах.'}, 'en': {'title': 'Unlocking the Power of Expert Routing in Language Models', 'desc': 'This paper investigates how sparse mixture-of-experts (MoE) language models utilize multiple experts to enhance token representation. It introduces the Expert Subspace Separation Index (ESSI) to differentiate between route coherence, candidate quality, and context interactions. The findings reveal that while expert subspaces overlap, the actual routing of tokens to experts provides better representation than alternative routes. Additionally, the study shows that adding more experts can improve predictions, indicating that geometric similarity does not equate to redundancy in expert contributions.'}, 'zh': {'title': '专家路由的几何优势', 'desc': '这篇论文探讨了稀疏专家混合模型（MoE）在语言模型中的应用，强调了不同专家在表示方向上的独特贡献。研究通过专家子空间分离指数（ESSI）等方法，区分了路由一致性、候选质量和上下文交互等因素。结果表明，尽管专家子空间重叠，但实际路由在解释标记表示方面优于匹配的替代方案。此外，增加后续专家可以改善下一个标记的预测，表明多专家计算的有效性并不依赖于线性覆盖的独立性。'}}}, {'id': 'https://huggingface.co/papers/2607.28627', 'title': 'ReToken: One Token to Improve Vision-Language Models for Visual Retrieval', 'url': 'https://huggingface.co/papers/2607.28627', 'abstract': 'Abstract  Long visual context poses a challenge for vision-language models: performance degrades as the number of distractors grows, and processing all tokens at once is computationally infeasible under GPU memory constraints. We present ReToken, a single learnable embedding trained as an explicit retrieval target that selects a sparse set of query-relevant visual tokens from a pre-filled visual KV cache. Trained on only a small image-QA dataset, ReToken yields consistent gains across image and video benchmarks: on Visual Haystacks it improves Qwen3VL-8B by 13.4 points and InternVL3.5 by 12.4 points (>20% relative), and on LVBench it transfers zero-shot to long video for an 8.0-point gain with Qwen3VL-8B. Thanks to its lightweight design, both training and long-video inference fit on a single H100. Code is available at: https://github.com/avaxiao/ReToken', 'score': 1, 'issue_id': 2809, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6b7683182370cf01', 'authors': ['Yao Xiao', 'Reuben Tan', 'Zhen Zhu', 'Yuqun Wu', 'Jianfeng Gao', 'Derek Hoiem'], 'affiliations': ['Google DeepMind', 'Microsoft Research', 'University of Illinois at Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2607.28627.jpg', 'data': {'categories': ['#video', '#inference', '#transfer_learning', '#open_source', '#cv', '#multimodal', '#long_context'], 'emoji': '🎯', 'ru': {'title': 'Селективное внимание к нужным визуальным признакам через обучаемый токен-мишень', 'desc': 'Статья посвящена проблеме обработки длинного визуального контента в vision-language моделях, где качество падает при увеличении количества отвлекающих элементов. Авторы предлагают ReToken — обучаемое встраивание, которое работает как явная цель поиска и выбирает разреженное подмножество визуальных токенов, релевантных запросу, из предзаполненного KV кэша. Метод обучается на небольшом датасете image-QA и показывает стабильное улучшение производительности на бенчмарках Visual Haystacks и LVBench, повышая результаты на 12-13 пунктов. Благодаря лёгкой архитектуре, обучение и инференс на длинных видео возможны даже на одном GPU H100.'}, 'en': {'title': 'ReToken: Efficient Retrieval for Vision-Language Models', 'desc': 'The paper introduces ReToken, a novel approach to improve vision-language models when dealing with long visual contexts filled with distractors. It utilizes a single learnable embedding that acts as a retrieval target, allowing the model to select only the most relevant visual tokens from a larger set. This method is trained on a small image-QA dataset and demonstrates significant performance improvements on various benchmarks, including image and video tasks. The lightweight design of ReToken enables efficient training and inference, making it feasible to run on a single high-performance GPU.'}, 'zh': {'title': 'ReToken：提升视觉语言模型性能的轻量化解决方案', 'desc': '本论文提出了一种名为ReToken的模型，旨在解决视觉语言模型在处理长视觉上下文时的性能下降问题。ReToken通过学习一个可训练的嵌入，选择与查询相关的稀疏视觉标记，从而提高了处理效率。该模型在小规模图像问答数据集上进行训练，并在多个图像和视频基准测试中取得了显著的性能提升。由于其轻量化设计，ReToken能够在单个H100上完成训练和长视频推理。'}}}, {'id': 'https://huggingface.co/papers/2607.25289', 'title': 'AMRD: Adaptive Multi-Teacher Relational Distillation for Lightweight Speech Emotion Recognition', 'url': 'https://huggingface.co/papers/2607.25289', 'abstract': "Abstract  On-device speech emotion recognition (SER) is critical for real-time applications, yet large self-supervised models that excel at SER are too costly for edge devices. Multi-teacher knowledge distillation can compress them into a lightweight student, but two challenges remain: teacher reliability varies across batches, and logit-level distillation ignores inter-sample relational structure. We propose Adaptive Multi-teacher Relational Distillation (AMRD) to address both. A one-class SVM on each teacher's logit similarity matrix assigns per-batch weights favoring more coherent teachers. A relational distillation loss aligns teacher and student similarity matrices, capturing structure that logit matching misses. On IEMOCAP and CREMA-D datasets across four student architectures, AMRD outperforms single-teacher distillation baselines in most settings, and ablations confirm both components yield complementary gains.", 'score': 0, 'issue_id': 2809, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'e7dc94afddff8aab', 'authors': ['Yuqi Li', 'Yi-Cheng Lin', 'Xianglong Wang', 'Kuo Yang', 'Xiaoqin Feng', 'Yixuan Wang', 'Huiran Duan', 'Yingli Tian'], 'affiliations': ['Department of Electrical Engineering, The City College of New York', 'National Taiwan University', 'University of Minnesota - Twin Cities', 'Wyze Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2607.25289.jpg', 'data': {'categories': [], 'emoji': '👂', 'ru': {'title': 'Адаптивная дистилляция эмоций: облегчение моделей без потери понимания', 'desc': 'В статье предложен метод адаптивной дистилляции знаний от нескольких учителей для распознавания эмоций в речи на мобильных устройствах. Авторы решают две основные проблемы: непостоянное качество учителей при обработке разных батчей и потеря информации о структуре взаимосвязей между образцами при использовании традиционной дистилляции логитов. Предложенный метод AMRD использует одноклассовый SVM для динамического взвешивания учителей и вводит функцию потерь, выравнивающую матрицы сходства между учителями и студентом. Экспериментальные результаты на датасетах IEMOCAP и CREMA-D показывают преимущество предложенного подхода перед базовыми методами дистилляции.'}, 'en': {'title': 'Efficient Speech Emotion Recognition through Adaptive Distillation', 'desc': 'This paper presents a method called Adaptive Multi-teacher Relational Distillation (AMRD) for improving on-device speech emotion recognition (SER) by compressing large self-supervised models into smaller, more efficient versions suitable for edge devices. The authors address two main challenges: the varying reliability of different teacher models and the limitations of traditional logit-level distillation that overlooks the relationships between samples. AMRD uses a one-class SVM to assign weights to teachers based on their logit similarity, ensuring that more reliable teachers have a greater influence. Additionally, it introduces a relational distillation loss that aligns the similarity matrices of the teacher and student models, enhancing the learning process and leading to better performance on SER tasks.'}, 'zh': {'title': '自适应多教师关系蒸馏：提升语音情感识别的效率', 'desc': '本论文提出了一种自适应多教师关系蒸馏（AMRD）方法，用于在边缘设备上进行实时语音情感识别（SER）。该方法解决了教师模型在不同批次中的可靠性变化和传统蒸馏忽略样本间关系结构的问题。通过对每个教师的logit相似度矩阵应用一类支持向量机（SVM），AMRD为每个批次分配权重，优先考虑更一致的教师。实验结果表明，AMRD在多个学生架构上超越了单教师蒸馏的基线，验证了其两个组成部分的互补增益。'}}}, {'id': 'https://huggingface.co/papers/2607.16922', 'title': 'Pedestrian Archetypes Extension -- More Pedestrian Models for Autonomous Vehicle Safety Testing', 'url': 'https://huggingface.co/papers/2607.16922', 'abstract': 'Abstract  In our prior work, Pedestrian Archetypes, we defined pedestrian archetypes as collections of behaviors that uniquely identify a specific type of pedestrian. The first paper proposed 12 pedestrian archetypes, including the Wanderer, Drunk, Distracted, Flash, Indecisive, Blind, Flock, Jaywalker, Elderly, Kid, Eventful, and Parked Pedestrian. These archetypes were introduced to move beyond single behavior labels and provide a more natural way to describe how dangerous pedestrians actually behave progressively in real-world traffic scenarios. However, upon further annotation of YouTube dash
