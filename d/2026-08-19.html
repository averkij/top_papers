    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.12313', 'title': 'AVA-Encoder: Towards Agent-Native Video Representation Learning', 'url': 'https://huggingface.co/papers/2608.12313', 'abstract': 'Abstract AVA-Encoder learns structured video representations via agentic auto-encoding using knowledge graphs and textual-gradient optimization to improve cinematic video generation and reasoning.  Generated by thinkingmachines/Inkling-Small Creative agents still lack an effective way to learn from high-quality human films, limiting their ability to produce cinematic-grade videos. A key challenge is the absence of a structured video representation that is both faithful to film content and directly usable for agentic reasoning and manipulation. To address the challenge, we propose the Agentic Video Auto-Encoder (AVA-Encoder), a framework for learning agent-native video representations via agentic auto-encoding.   AVA-Encoder transforms a video into a knowledge graph (KG) representation and then reconstructs it back into video. Its hierarchy and state nodes store structured text, while a linked asset layer holds generated images, audio, and video. Typed edges preserve the relations between these text descriptions and assets in a form that agents can easily understand, query, and edit. The video reconstruction differences drive a textual-gradient optimization framework, which expresses evaluation feedback as natural-language update directions for Data-Independent Encoding Policy Pseudo-Training in the outer loop and optional Data-Dependent KG Representation Refinement in the test-time inner loop.   Extensive experiments show that AVA-Encoder improves by 20.7 percentage points over the strongest external baseline. In the controlled policy-only setting, its pseudo-trained shot-level Agentic Video Encoder policy also outperforms a carefully human-tuned policy while using 74.3% fewer system-prompt tokens. We release the complete AVA-Encoder framework, a reliable agentic video reconstruction benchmark, and the first dataset of high-quality film KG representations.', 'score': 18, 'issue_id': 3041, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '1dbf7213c8e13939', 'authors': ['Chuyue Li', 'Jinpeng Yu', 'Haozhe Wang', 'Tian Xueyun', 'Zhijing Zhang', 'Bingnan Li', 'Shuqi Gu', 'Kan Ren', 'Jiaming Liu', 'Ruihua Hua'], 'affiliations': ['Institute of Computing Technology', 'Qwen Business Unit of Alibaba', 'ShanghaiTech University', 'Southeast University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.12313.jpg', 'data': {'categories': ['#agents', '#multimodal', '#video', '#benchmark', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Структурированное представление видео через агентный автокодировщик с графами знаний', 'desc': 'AVA-Encoder — это фреймворк, который преобразует видео в структурированное представление в виде графа знаний, сохраняя текстовые описания и цифровые активы в форме, удобной для агентного рассуждения и манипулирования. Система использует технику текстуального градиентного оптимизирования, где обратная связь от восстановления видео преобразуется в естественно-языковые направления обновления для обучения политики модели. Подход демонстрирует значительное улучшение на 20.7 процентных пункта над существующими базовыми методами и достигает производительности ручной настройки при использовании на 74.3% меньше токенов. Фреймворк позволяет агентам эффективнее учиться на высокачественных кинофильмах и генерировать видео кинематографического качества.'}, 'en': {'title': 'Transforming Video Learning with Knowledge Graphs', 'desc': 'The AVA-Encoder is a novel framework designed to enhance how creative agents learn from high-quality films by using structured video representations. It converts videos into knowledge graphs, which help in understanding and manipulating video content more effectively. By employing a textual-gradient optimization method, the framework provides feedback in natural language, allowing for better training of video generation policies. Experimental results demonstrate significant improvements in video quality and efficiency compared to existing methods, showcasing the potential of structured representations in cinematic video generation.'}, 'zh': {'title': '代理自编码：提升视频生成与推理的创新框架', 'desc': 'AVA-Encoder是一种通过代理自编码学习结构化视频表示的方法，利用知识图谱和文本梯度优化来提升电影视频生成和推理能力。该框架将视频转换为知识图谱表示，并能够将其重构回视频，存储结构化文本和生成的图像、音频及视频。通过保留文本描述和资产之间的关系，代理可以更容易地理解、查询和编辑这些信息。实验结果表明，AVA-Encoder在视频重构任务中显著优于现有的基线方法，展示了其在生成高质量电影视频方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.17310', 'title': 'Agentic ESOpt: Fine-Tuning Long-Horizon LLM Agents with Minimal GPU Requirements', 'url': 'https://huggingface.co/papers/2608.17310', 'abstract': 'Abstract Agentic ESOpt uses evolution strategies for scalable full-parameter fine-tuning of long-horizon LLM agents via trajectory-level reward-weighted updates and parameter-context co-evolution.  Generated by thinkingmachines/Inkling-Small Reinforcement Learning (RL) has been promising in single-turn LLM fine-tuning. However, long-horizon agentic reasoning introduces increasingly branching interactions and sparse rewards, exposing several limitations of RL: its heavyweight backpropagation-based training stack makes it impractical to fine-tune larger LLMs, and longer-horizon trajectories make credit assignment in RL substantially harder. This paper argues that evolution strategies (ES) can be a better choice for fine-tuning long-horizon LLM agents. Compared with agentic RL, ES offers three key advantages: 1) Model Scalability: ES enables full-parameter optimization with only minimal, inference-level GPU memory, making it possible to fine-tune large LLMs. 2) Flexibility: its lightweight, black-box feedback interface makes ES fine-tuning easy to compose with prompt-space evolution (e.g., skill optimization & test-time compute); and 3) Long-Horizon Scalability: ES performs trajectory-level parameter attribution without decomposing rewards across horizons, yielding better scalability than Agentic RL as the horizon length grows. Based on this insight, we propose Agentic ESOpt, a full-parameter agentic fine-tuning framework tailored to flexible parameter--context co-evolution. At each step, Agentic ESOpt samples perturbations around the current LLM parameters, evaluates the resulting agents with rewards, and applies an online reward-weighted update. To improve the exploration--adaptation trade-off, Agentic ESOpt further introduces a cosine decay schedule of the perturbation scale σ. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.', 'score': 9, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '8f2a9c65809e859e', 'authors': ['Zhi Zheng', 'Rongsheng Chen', 'Yunpeng Ba', 'Zhenkun Wang', 'Yee Whye Teh', 'Wee Sun Lee'], 'affiliations': ['National University of Singapore', 'Oxford', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.17310.jpg', 'data': {'categories': ['#architecture', '#reasoning', '#optimization', '#training', '#agents', '#rl'], 'emoji': '🧬', 'ru': {'title': 'Эволюционные стратегии вместо обучения с подкреплением для долгосрочных агентов', 'desc': 'В статье предлагается Agentic ESOpt — метод для полнопараметровой тонкой настройки больших языковых моделей, используемых в агентах с долгосрочным горизонтом действия. Вместо традиционного обучения с подкреплением авторы применяют стратегии эволюции, которые требуют значительно меньше памяти GPU и лучше справляются с разреженными наградами на длинных траекториях. Метод сочетает оптимизацию параметров модели с эволюцией подсказок (контекста), используя возмущения параметров и награды на уровне целых траекторий. Экспериментальные результаты показывают улучшение производительности агентов на бенчмарке WebArena-Lite и успешную совместную эволюцию параметров и подсказок во время тестирования.'}, 'en': {'title': 'Revolutionizing LLM Fine-Tuning with Evolution Strategies', 'desc': 'The paper introduces Agentic ESOpt, a method that uses evolution strategies (ES) for fine-tuning large language models (LLMs) over long time horizons. Unlike traditional reinforcement learning (RL), which struggles with credit assignment and resource demands, ES allows for scalable optimization with minimal memory usage. This approach enhances flexibility by enabling easy integration with prompt-space evolution and improves performance in long-horizon tasks by attributing rewards at the trajectory level. The results show significant improvements in model performance, demonstrating the effectiveness of ES in fine-tuning LLMs compared to conventional RL methods.'}, 'zh': {'title': '进化策略：长时间跨度LLM微调的新选择', 'desc': '本文提出了一种名为Agentic ESOpt的框架，利用进化策略（ES）对长时间跨度的语言模型（LLM）进行全参数微调。与传统的强化学习（RL）方法相比，ES在模型可扩展性、灵活性和长时间跨度的可扩展性方面具有显著优势。ES能够在仅需最小推理级GPU内存的情况下实现全参数优化，从而使得大型LLM的微调成为可能。此外，Agentic ESOpt通过在线奖励加权更新和扰动采样，提升了探索与适应的平衡，显著提高了模型性能。'}}}, {'id': 'https://huggingface.co/papers/2608.16002', 'title': 'From Sequence to Structure: Relational Uncertainty Propagation for LLM Agents', 'url': 'https://huggingface.co/papers/2608.16002', 'abstract': 'Abstract RUPA models agent execution as a dependency graph to propagate uncertainty across long trajectories, improving failure detection and confidence estimation for LLM agents.  Generated by thinkingmachines/Inkling-Small Reliable uncertainty quantification (UQ) is essential for deploying large language model (LLM) agents in complex interactive environments. Existing UQ methods largely rely on local signals, such as token probabilities, predictive entropy, or per-step confidence, and therefore overlook the long-range dependencies through which errors accumulate across an execution trajectory. As a result, they may fail to identify agent failures whose causes originate several reasoning or interaction steps before the final answer. We propose RUPA (Relational Uncertainty Propagation for Agents), a trajectory-level UQ framework for LLM agents. RUPA represents an execution history as a directed trajectory graph in which reasoning states, tool interactions, and environment feedback are nodes connected by temporal and semantic dependency edges. It then propagates uncertainty over this graph to capture how execution risk accumulates and transfers across interaction steps. The propagated signal is combined with trajectory-level behavioral features and goal-alignment information to produce a confidence estimate for the full agent trajectory. We evaluate RUPA on representative agent benchmarks, including τ-2, Terminal-Bench-2, and GAIA, using 6 open-source LLMs spanning multiple model families. Experimental results show that RUPA consistently outperforms existing UQ methods by providing more accurate uncertainty estimates, enabling earlier failure detection, and improving uncertainty-guided agent execution across diverse agent tasks. These results demonstrate that explicitly modeling relational dependency is crucial to reliable UQ for long-horizon LLM agents, providing a practical foundation for trustworthy agent execution.', 'score': 5, 'issue_id': 3040, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '608b46206fbcb19d', 'authors': ['Zhengzhao Ma. Boxi Cao', 'Yaojie Lu', 'Hongyu Lin', 'Xianpei Han', 'Le Sun'], 'affiliations': ['Chinese Information Processing Laboratory, Institute of Software, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.16002.jpg', 'data': {'categories': ['#graphs', '#reasoning', '#long_context', '#benchmark', '#agents'], 'emoji': '🕸️', 'ru': {'title': 'Распространение неопределённости через граф зависимостей для надёжных LLM агентов', 'desc': 'Работа представляет RUPA — метод количественной оценки неопределённости для LLM агентов, который моделирует историю выполнения как граф зависимостей. Вместо анализа локальных сигналов (например, вероятностей токенов), RUPA распространяет неопределённость через весь граф, отслеживая, как ошибки накапливаются на протяжении длинных траекторий взаимодействия. Метод комбинирует информацию о распространённой неопределённости с поведенческими признаками и выравниванием целей для получения оценки уверенности для всей траектории агента. Экспериментальные результаты на различных бенчмарках показывают, что RUPA превосходит существующие методы по точности предсказания ошибок и обнаружению сбоев.'}, 'en': {'title': 'RUPA: Enhancing Uncertainty in LLM Agent Execution', 'desc': 'The paper introduces RUPA, a new framework for improving uncertainty quantification (UQ) in large language model (LLM) agents by modeling their execution as a dependency graph. This approach allows for the propagation of uncertainty across long trajectories, addressing the limitations of existing UQ methods that focus on local signals. By representing the execution history as a directed graph with nodes for reasoning states and interactions, RUPA captures how errors accumulate over time. The results show that RUPA enhances failure detection and confidence estimation, making LLM agents more reliable in complex environments.'}, 'zh': {'title': 'RUPA：提升LLM代理执行的可靠性与信心', 'desc': 'RUPA模型将代理执行视为一个依赖图，以传播不确定性，从而提高大型语言模型（LLM）代理的故障检测和信心估计。现有的不确定性量化方法主要依赖于局部信号，忽视了错误在执行轨迹中累积的长程依赖关系。RUPA通过将执行历史表示为一个有向轨迹图，捕捉推理状态、工具交互和环境反馈之间的关系，并在此图上传播不确定性。实验结果表明，RUPA在多个基准测试中优于现有方法，提供了更准确的不确定性估计，能够更早地检测故障，并改善代理执行的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2608.17286', 'title': 'Abra: Scaling Diffusion Image Training', 'url': 'https://huggingface.co/papers/2608.17286', 'abstract': 'Abstract Scaling laws for text-to-image diffusion models reveal predictable compute-optimal training requiring far more data per parameter than language models, with robust overtraining behavior and universal curve shapes.  Generated by thinkingmachines/Inkling-Small Compute-optimal scaling laws guide the training of frontier language models yet remain largely unexplored for visual generation. We present a systematic scaling law study for text-to-image diffusion models using Abra, a controlled family of flow-matching transformers trained across three orders of magnitude worth of compute (10^{19} to 10^{22} FLOPs), reaching significantly larger compute budgets than previous works. We demonstrate that diffusion models scale just as predictably as language models but require far more data to train optimally: compute optimality occurs at approximately 200 image tokens per parameter, ten times the Chinchilla compute-optimal prescription for LLMs. We show that unlike language models, diffusion models are robust to overtraining and that practitioners should err on the side of more data rather than a larger model. Finally, we show that this predictability extends beyond training loss to generative quality metrics, optimal CFG settings, representation quality, and even the shape of the training curves, which collapse onto a universal form.', 'score': 4, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '96c45ba5a52bddd2', 'authors': ['Kyle Chickering', 'Wei-An Lin', 'Swayam Bhanded', 'Dan Saunders', 'Akshat Tripathi', 'Jiaming Song', 'Shyamal Buch', 'Xinchen Yan'], 'affiliations': ['Luma AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17286.jpg', 'data': {'categories': ['#training', '#architecture', '#multimodal', '#diffusion', '#benchmark', '#optimization'], 'emoji': '🖼️', 'ru': {'title': 'Универсальные законы масштабирования для визуальной генерации', 'desc': 'В этой работе исследуются законы масштабирования для text-to-image диффузионных моделей, построенных на основе flow-matching трансформеров. Авторы обнаружили, что эти модели масштабируются предсказуемо, подобно языковым моделям, но требуют значительно больше данных на один параметр — примерно 200 токенов изображения на параметр, что в десять раз превышает оптимальное значение для LLM. Исследование показало, что диффузионные модели устойчивы к переобучению, поэтому лучше увеличивать объём данных, чем архитектуру модели. Предсказуемость этих законов распространяется не только на функцию потерь, но и на метрики качества генерации, параметры CFG и даже форму кривых обучения, которые следуют универсальному паттерну.'}, 'en': {'title': 'Unlocking Predictable Scaling for Text-to-Image Diffusion Models', 'desc': 'This paper investigates the scaling laws for text-to-image diffusion models, highlighting their need for significantly more data per parameter compared to language models. It presents a study using a family of flow-matching transformers trained with a wide range of computational resources, demonstrating that diffusion models exhibit predictable scaling behavior similar to language models. The findings indicate that optimal training for these models occurs at around 200 image tokens per parameter, which is substantially higher than the requirements for language models. Additionally, the research reveals that diffusion models are resilient to overtraining, suggesting that using more data is preferable to simply increasing model size.'}, 'zh': {'title': '扩散模型的计算最优性与数据需求', 'desc': '本文研究了文本到图像扩散模型的规模法则，揭示了计算最优训练需要比语言模型更多的数据。我们使用Abra进行系统的规模法则研究，展示了扩散模型的可预测性与语言模型相似，但训练时需要的数据量是后者的十倍。研究表明，扩散模型对过拟合具有较强的鲁棒性，因此在训练时应优先考虑更多的数据而非更大的模型。最后，我们发现这种可预测性不仅适用于训练损失，还延伸到生成质量指标、最优CFG设置和训练曲线的形状。'}}}, {'id': 'https://huggingface.co/papers/2608.17271', 'title': 'ASI-Bench: At the Dawn of Artificial Superintelligence', 'url': 'https://huggingface.co/papers/2608.17271', 'abstract': "Abstract  Artificial superintelligence (ASI) requires AI to move beyond mastering existing knowledge toward exploring the unknown, creating new knowledge, and turning new ideas into verifiable results. However, the capabilities of today's AI systems are still largely built on learning, compressing, and applying existing human knowledge. Accordingly, existing benchmarks primarily test whether AI can produce correct answers based on learned knowledge, or whether it can complete tasks under extensive human guidance. We therefore introduce ASI-Bench, the first benchmark to jointly evaluate AI systems' capabilities of innovative exploration and autonomous scientific execution across general research domains, and the first to progressively withdraw human methodological guidance within the same research project to test how far AI can proceed on its own. Built by over 40 experts with the cost of 31,000+ human hours, ASI-Bench contains 60 project-level research tasks across 11 scientific domains and progressively reduces methodological guidance to test whether AI can independently select methods, conduct research, and produce verifiable results. All tasks undergo expert review, AI-assisted auditing, sandbox execution, and scorer validation. Across 18 state-of-the-art agent--model configurations, the average score drops from 50.91 with full methodological guidance to 29.10 with only the method specified and 26.62 when agents must determine the method themselves. This sharp decline shows that current systems remain heavily dependent on human guidance and are still far from autonomously conducting end-to-end, project-level scientific research. ASI-Bench is open to the world. We invite researchers and builders everywhere to contribute new tasks, challenge the limits of today's AI, and help accelerate humanity's collective path toward artificial superintelligence at https://asibench.apexin.ai/submit.", 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ba7ecd13b8d01775', 'authors': ['Junwei Zhou', 'Zhen Sun', 'Binyu Li', 'Jiangyu Zhou', 'Yuexi Pan', 'Hengyu Wang', 'Honghe Ren', 'Xiaohan Jia', 'Xueyang Zhou', 'Xiaoyu Cao', 'Yongchao Chen', 'Yuanning Feng', 'Junhao Wu', 'Cheng Zhang', 'Sijia Chen', 'Haoyu Xue', 'Chengsong You', 'Huan Wang', 'Koutian Wu', 'Peigan Gao', 'Jiakun Wu', 'Wenzhe Li', 'Ergan Shang', 'Qingyuan Zheng', 'Jingjing Zhou', 'Ruixuan Jia', 'Yan Xu', 'Hongrui Zhang', 'Xiao-Han Ma', 'Zhengxiang Cheng', 'Yuexing Hao', 'Liting Mai', 'Xianglin Ji', 'Wenjun Zhang', 'Zhuofan Chen', 'Yixiao Huang', 'Chi Wang', 'Wenyue Hua', 'Yilun Hao', 'Yuantao Zhai', 'Ziyan Zhao', 'Jingyan Xie'], 'affiliations': ['AG2 AI', 'Boston University', 'Carnegie Mellon University', 'Flatiron Institute', 'Harvard University', 'Massachusetts Institute of Technology', 'Microsoft Research', 'Tsinghua University', 'University of Illinois Urbana-Champaign', 'University of Michigan', 'University of Queensland', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17271.jpg', 'data': {'categories': ['#agents', '#agi', '#science', '#benchmark', '#open_source'], 'emoji': '🔬', 'ru': {'title': 'От заученных знаний к настоящему научному открытию: измеряем путь к искусственному сверхинтеллекту', 'desc': 'В статье представлен ASI-Bench — первый бенчмарк для оценки способности AI систем к инновационным исследованиям и автономному научному выполнению задач. Бенчмарк содержит 60 проектных исследовательских задач из 11 научных областей и прогрессивно снижает уровень методологической поддержки человека. Результаты показывают резкое падение производительности современных агентов с 50.91 баллов при полной помощи до 26.62 при полной автономии, что демонстрирует зависимость текущих систем от человеческого руководства. Исследование выявляет, что AI системы по-прежнему далеки от самостоятельного проведения полноценных научных проектов от начала до конца.'}, 'en': {'title': 'Pushing AI Beyond Knowledge: The ASI-Bench Challenge', 'desc': "This paper discusses the limitations of current AI systems, which mainly rely on existing human knowledge and guidance. It introduces ASI-Bench, a new benchmark designed to evaluate AI's ability to innovate and conduct scientific research independently. The benchmark includes 60 research tasks across various scientific domains and progressively reduces human assistance to assess AI's autonomy. Results show a significant drop in performance as human guidance decreases, highlighting the need for further advancements toward achieving artificial superintelligence."}, 'zh': {'title': '推动人工智能自主研究的新时代', 'desc': '这篇论文介绍了人工超智能（ASI）的新基准测试——ASI-Bench。该基准旨在评估人工智能系统在创新探索和自主科学执行方面的能力，特别是在减少人类指导的情况下。研究表明，当前的AI系统在完全依赖人类指导时表现较好，但在自主选择方法和进行研究时，性能显著下降。通过60个项目级研究任务，ASI-Bench为推动AI的独立研究能力提供了重要的测试平台。'}}}, {'id': 'https://huggingface.co/papers/2608.05811', 'title': 'Energy-Guided Flow Matching', 'url': 'https://huggingface.co/papers/2608.05811', 'abstract': 'Abstract Energy-Guided Flow Matching improves generative quality by progressively revealing high-frequency details through a moving endpoint and adaptive scheduling, reducing training cost and achieving state-of-the-art FID scores.  Generated by thinkingmachines/Inkling-Small Pixel-space generative models bypass lossy latent compression, yet necessitate joint learning of global structure and fine-grained details in a high-dimensional space. Standard flow matching interpolates noise toward a fixed clean-image endpoint, leaving the spectral evolution to be learned implicitly. In this paper, we introduce Energy-Guided Flow Matching(EG-FM) that explicitly models a coarse-to-fine generative trajectory by moving endpoint. Specifically, EG-FM replaces the fixed endpoint with a heat-kernel-filtered endpoint that evolves smoothly from low-frequency image to clean image. The fraction of high-frequency signal in moving endpoint is released by an image-specific energy-guided scheduling, leading to the re-targeting of velocity in flow matching. Our framework requires no adaptation of the backbone and training data, bringing negligible cost on the training and inference stages. In our experiment, EG-FM consistently achieves lower FID on the ImageNet class-conditional image generation task at 256 times 256 with fewer epochs, reaching an FID of 1.55 at 200 epochs and 1.45 at 600 epochs. We continue training the generation task on the setting of 512 times 512 resolution, yielding a FID of 1.58 after only 40 high-resolution adaptation epochs. Furthermore, we transfer EG-FM on text-to-image generation and achieve 0.85 on GenEval score and 83.9 on DPG-Bench. Code is available at https://github.com/ysng123/EG-FM.', 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'd94445fa284fc1bf', 'authors': ['Haoyang Tong', 'Yu He', 'Fang Li', 'Lichen Ma', 'Jingling Fu', 'Dong Chen', 'Zhen Chen', 'Junshi Huang', 'Jie Cao'], 'affiliations': ['JD.com', 'MAIS & NLPR, CASIA', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05811.jpg', 'data': {'categories': ['#diffusion', '#open_source', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'От размытого к чёткому: энергетически управляемая генерация через движущуюся траекторию', 'desc': 'В работе предложен метод Energy-Guided Flow Matching (EG-FM), который улучшает качество генеративных моделей путём явного моделирования траектории генерации от грубых деталей к точным. Вместо фиксированной конечной точки в процессе интерполяции, метод использует движущуюся конечную точку, отфильтрованную фильтром теплопроводности, которая плавно эволюционирует от изображения с низкими частотами к чистому изображению. Высокочастотные компоненты раскрываются постепенно через адаптивное расписание, управляемое энергией самого изображения, что приводит к переориентированию скорости в flow matching. Метод достигает лучших результатов на задаче класс-условной генерации изображений в ImageNet, получив FID 1.45 при 600 эпохах обучения и FID 1.58 при разрешении 512×512.'}, 'en': {'title': 'Progressive Detail Unveiling in Generative Models', 'desc': 'Energy-Guided Flow Matching (EG-FM) enhances the quality of generative models by progressively revealing high-frequency details during the image generation process. It replaces the traditional fixed endpoint in flow matching with a dynamic endpoint that evolves from low-frequency to high-frequency images, allowing for better control over the generation trajectory. This method reduces training costs while achieving state-of-the-art Fréchet Inception Distance (FID) scores, indicating improved image quality. EG-FM is efficient, requiring no changes to the existing model architecture or training data, and it performs well in both image generation and text-to-image tasks.'}, 'zh': {'title': '能量引导流匹配：提升生成质量的新方法', 'desc': '本文提出了一种名为能量引导流匹配（EG-FM）的方法，旨在提高生成模型的质量。EG-FM通过移动端点和自适应调度，逐步揭示高频细节，从而降低训练成本并实现最先进的FID分数。与传统的流匹配方法不同，EG-FM显式建模了从粗到细的生成轨迹，使用热核滤波器平滑演变的端点。实验结果表明，EG-FM在图像生成任务中表现出色，能够在较少的训练周期内获得更低的FID分数。'}}}, {'id': 'https://huggingface.co/papers/2608.16393', 'title': 'Security Assessment of DeepSeek Harness with A.I.G: Evaluating Resistance to Indirect Prompt Injection', 'url': 'https://huggingface.co/papers/2608.16393', 'abstract': "Abstract Researchers evaluate indirect prompt injection risks in DeepSeek Harness using controlled taint and dual judges, finding notable success rates across text and file channels and recommending controls between untrusted content and sensitive actions.  Generated by thinkingmachines/Inkling-Small We assess indirect prompt injection in DeepSeek Harness (DSH), using AI-Infra-Guard (A.I.G) to construct tests, deliver controlled taint, execute DSH, collect traces, and judge outcomes. The study covers 14,560 controlled executions over 16 indirect-content channels, text and file carrier modes, 35 payload objectives, one unmodified baseline, and 12 attack methods. The experiment preserves DSH's agent loop, tool registry, model adapter, and session-event path; source tools and sensitive sinks are local fixtures, so attempted actions are recorded without external side effects. We evaluate each trace with a deterministic rule-based judge,  (RuleJudge), and a semantic LLM-based judge,  (LLMJudge). The strongest observed attack success rates are 17.0% under  for fake-completion attack in text mode, 25.5% under  for hidden Unicode in file mode, and 16.0% under  for the skills channel in file mode.  also assigns partial compliance more often than  (7.3% versus 2.0%). We relate these results to DSH's treatment of tool results, additional contexts, and tool-call policy hooks, then identify controls that should sit between untrusted content and sensitive actions. Our code is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/Research/deepseek-harness-security-assessment .", 'score': 2, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'aced1c4232fe636c', 'authors': ['Zonghao Ying', 'Xiangfan Wu', 'Huiyu Wu', 'Xing Zheng', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.16393.jpg', 'data': {'categories': [], 'emoji': '🛡️', 'ru': {'title': 'Защита AI-агентов от косвенных инъекций через контролируемое тестирование', 'desc': 'Исследователи оценили риски косвенных prompt injection атак в системе DeepSeek Harness, используя контролируемое заражение данных и двойную систему оценки результатов. Эксперимент включал 14,560 контролируемых выполнений с различными каналами передачи информации, методами атак и целями. Были использованы два судьи для оценки: детерминированный RuleJudge на основе правил и LLMJudge на базе языковой модели. Исследование выявило уязвимости и рекомендует внедрить контроли безопасности между недоверенным контентом и чувствительными операциями.'}, 'en': {'title': 'Mitigating Indirect Prompt Injection Risks in AI Systems', 'desc': 'This paper investigates the risks of indirect prompt injection in the DeepSeek Harness (DSH) system, utilizing a method called controlled taint analysis. The researchers conducted extensive tests, executing over 14,000 trials across various content channels and attack methods to assess the effectiveness of different injection techniques. They employed two types of judges, a rule-based and a semantic LLM-based judge, to evaluate the outcomes of these attacks. The findings highlight significant success rates for certain attack types, leading to recommendations for implementing controls to protect sensitive actions from untrusted content.'}, 'zh': {'title': '评估DeepSeek Harness中的间接提示注入风险', 'desc': '本研究评估了DeepSeek Harness中的间接提示注入风险，使用了受控污点和双重评判的方法。研究涵盖了14,560次受控执行，涉及16个间接内容通道和35个有效载荷目标。实验结果显示，在文本模式下，假完成攻击的成功率为17.0%，而在文件模式下，隐藏Unicode的成功率为25.5%。研究建议在不可信内容和敏感操作之间设置控制措施，以降低潜在风险。'}}}, {'id': 'https://huggingface.co/papers/2608.17800', 'title': 'StartupBench: Benchmarking General-Purpose Agents on Market-Validated End-to-End Workflows', 'url': 'https://huggingface.co/papers/2608.17800', 'abstract': 'Abstract StartupBench evaluates end-to-end AI agents on real-world startup workflows and reveals that even top models complete only about 30% of tasks, highlighting gaps in instruction following and domain expertise.  Generated by thinkingmachines/Inkling-Small Recent advances in Large Language Models(LLMs) and agents have substantially improved the ability of AI systems to execute complex tasks. Yet existing benchmarks largely rely on researcher-selected tasks, leaving uncertain whether such progress extends to the work that real-world users actually demand from AI systems. We introduce StartupBench, an E2E agent benchmark grounded in market-validated AI startup products. Rather than defining tasks from pre-defined assumptions about useful agent capabilities, we systematically study AI products with demonstrated adoption, together with their product workflows and users, to identify real-world tasks for which AI has established practical demand across diverse professional domains. We translate these workflows into complete deliverable-oriented tasks and evaluate them with fine-grained rubrics capturing their complex requirements. Across representative models evaluated under a unified agent harness, even the strongest model successfully completes only approximately 30\\% of StartupBench, despite making substantial partial progress on many tasks. Further analysis identifies aspects like complex instruction following and domain-specific expertise as major sources of failure. Our results reveal that many market-validated workflows remain beyond the reliable capabilities of current general-purpose agents, establishing StartupBench as an empirical measure of progress toward E2E completions of real-world user tasks.', 'score': 2, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '0367b6e747c38770', 'authors': ['Liya Zhu', 'Xin Ma', 'Tao Liu', 'Haodong Wang', 'Ge Zhang', 'Jingzhe Ding', 'Qingshui Gu', 'Yongjie Zhong', 'Jinxiang Meng', 'Yuan Gao', 'Yunqiu Zhou', 'Hao Zhu', 'Jifeng He', 'Yongzhi Liao', 'Xinyi Zhang', 'Chaoxin Li', 'Yi Zhu', 'Xi Lin', 'Duju Zeng', 'Xiang Gao', 'Wen Zhang', 'Yunyang Wang', 'Duo Wang', 'Huan Zhou', 'Zuo Wang', 'Jin Chen', 'Kaiyuan Zhang', 'Chuqian Yu', 'Tianhao Yu', 'Longxiang Liu', 'Jianbo Xue', 'Huimin Che', 'Jiahao Wang', 'Yujia Qin', 'Jiaheng Liu', 'Shen Yan', 'Xiaolong Chang', 'Wenhao Huang'], 'affiliations': ['ByteDance Seed', 'M-A-P', 'Nanjing University', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17800.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset'], 'emoji': '🚀', 'ru': {'title': 'Настоящие задачи требуют большего: реальный мир выявляет пределы возможностей AI агентов', 'desc': 'StartupBench — это бенчмарк для оценки end-to-end AI агентов на реальных рабочих процессах стартапов, основанный на анализе существующих продуктов с установленной пользовательской базой. Исследователи перевели реальные рабочие потоки в задачи ориентированные на результаты и оценили их с помощью детальных критериев, отражающих сложные требования. Результаты показали, что даже лучшие доступные LLM модели успешно завершают только около 30% задач, что указывает на серьёзные пробелы в архитектуре текущих агентов. Анализ выявил, что основные причины неудач — это сложное следование инструкциям и отсутствие специализированных знаний в конкретных предметных областях.'}, 'en': {'title': 'Bridging the Gap: Evaluating AI Agents in Real-World Workflows', 'desc': 'The paper introduces StartupBench, a benchmark designed to evaluate AI agents on real-world startup workflows. It highlights that even the best AI models only complete about 30% of the tasks, indicating significant limitations in their ability to follow complex instructions and demonstrate domain expertise. The study emphasizes the importance of using market-validated tasks rather than researcher-selected ones to assess AI capabilities. By translating actual workflows into measurable tasks, StartupBench provides a clearer picture of the current state of AI performance in practical applications.'}, 'zh': {'title': '评估 AI 代理在真实世界中的能力', 'desc': 'StartupBench 是一个评估 AI 代理在真实创业工作流程中表现的基准。研究发现，即使是最先进的模型也只能完成大约 30% 的任务，这表明在指令遵循和领域专业知识方面存在明显的不足。该基准通过分析市场上已验证的 AI 产品，识别出真实世界中 AI 需要解决的任务，并将这些工作流程转化为可交付的任务进行评估。结果显示，当前通用代理在许多市场验证的工作流程中仍然无法可靠地完成任务，突显了 AI 系统在实际应用中的局限性。'}}}, {'id': 'https://huggingface.co/papers/2608.15454', 'title': 'Dynamic Multi-Byte Prediction With Hierarchical Language Models', 'url': 'https://huggingface.co/papers/2608.15454', 'abstract': 'Abstract Multi-byte prediction accelerates byte-level hierarchical language models by generating parallel bytes via variable-length windows and causal attention masking, improving inference speed with minimal quality loss.  Generated by thinkingmachines/Inkling-Small Byte-level hierarchical language models (LMs) have recently emerged as a robust alternative to their popular counterparts that use subword tokenization. However, generating one byte at a time remains a bottleneck for inference speed. To address this, we introduce multi-byte prediction (MBP), which generates multiple bytes in parallel, speeding up inference with minimal performance impact and no additional parameters. MBP builds on the popular multi-token prediction (MTP) paradigm with two crucial innovations. First, we introduce a variable-length prediction window that aligns with the latent tokens, or segments, of a hierarchical LM. Second, we implement a novel attention-masking scheme that enables parallel byte prediction without violating causality. We show that multi-byte prediction strikes a Pareto-optimal trade-off across multiple generative tasks, instruction following, question answering, summarization, and machine translation, achieving the best trade-off between performance and inference throughput.', 'score': 2, 'issue_id': 3040, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '765aedd22867b35f', 'authors': ['Abraham Toluwase Owodunni', 'Chibuzor Okocha', 'Christan Grant', 'Tomasz Limisiewicz', 'Sachin Kumar'], 'affiliations': ['The Ohio State University', 'University of Florida', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15454.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Параллельная генерация байтов для ускорения языковых моделей без потери качества', 'desc': 'В статье предлагается метод мультибайтового предсказания (MBP) для ускорения байт-уровневых иерархических языковых моделей. Метод генерирует несколько байтов параллельно с помощью переменных окон предсказания и специальной маски внимания, которая сохраняет причинность. Подход основан на парадигме мультитокенного предсказания (MTP) и не требует дополнительных параметров модели. Экспериментальные результаты показывают оптимальный баланс между качеством вывода и скоростью инференса на различных задачах генерации, вопрос-ответных систем и машинного перевода.'}, 'en': {'title': 'Speed Up Language Models with Multi-Byte Prediction!', 'desc': 'This paper presents a method called multi-byte prediction (MBP) to enhance the efficiency of byte-level hierarchical language models. By generating multiple bytes simultaneously using a variable-length prediction window and a causal attention masking technique, MBP significantly speeds up inference without compromising quality. The approach builds on existing multi-token prediction methods and introduces innovations that allow for parallel processing while maintaining the necessary causal relationships in language generation. The results demonstrate that MBP achieves an optimal balance between performance and inference speed across various tasks such as instruction following and machine translation.'}, 'zh': {'title': '多字节预测：加速语言模型的创新之路', 'desc': '多字节预测（MBP）通过生成并行字节来加速字节级层次语言模型的推理速度，且仅有最小的质量损失。该方法解决了逐字节生成的瓶颈问题，允许在不增加额外参数的情况下同时生成多个字节。MBP结合了可变长度的预测窗口和新颖的注意力掩蔽机制，确保了因果性不被破坏。实验表明，MBP在多个生成任务中实现了性能与推理吞吐量之间的最佳平衡。'}}}, {'id': 'https://huggingface.co/papers/2608.18076', 'title': 'From Corpora to Co-Evolving Capabilities: Capability-Centric Data Design for Generalist Image Generation', 'url': 'https://huggingface.co/papers/2608.18076', 'abstract': 'Abstract A capability-driven data infrastructure with curriculum scheduling and specialized data engines trains large multimodal diffusion models on curated heterogeneous supervision for diverse generative tasks.  Generated by thinkingmachines/Inkling-Small Large-scale image generation has benefited from advances in data scale, quality, rebalancing, and recaptioning, yet conventional pipelines typically optimize task-specific datasets in isolation. A central challenge is not only how to curate each task-specific corpus, but also how to organize heterogeneous supervision according to the dependencies among generative capabilities. We present a capability-driven data infrastructure that couples capability-specific supervision construction with capability-aligned curriculum scheduling. Its three specialized yet interoperable data engines build complementary relational supervision for text-image grounding, inter-image transformation, and image-knowledge association, while caption experts align T2I and editing supervision across tasks and granularities. A multi-stage curriculum jointly evolves task composition, visual-concept distribution, data quality, and image resolution along the dependency order of capability acquisition, with capability-aware evaluation closing the loop through targeted retrieval, expert construction, and gap-aware resampling. At scale, the framework curates a 440M-image T2I corpus, 120M editing pairs, and over 27M image-entity pairs. With this infrastructure, we train multimodal diffusion models at two scales from scratch, with 3B and 6B sizes respectively. We conduct quantitative evaluation on CPI-Bench, along with qualitative evaluations across diverse text-to-image and editing scenarios. Experimental results present broad visual coverage, versatile rendering, and effective transfer across generative capabilities.', 'score': 1, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '1c806ab764b141f1', 'authors': ['Xingjian Wang', 'Zhao Wang', 'Taihang Hu', 'Jun Zheng', 'Qing Jin', 'Qinye Zhou', 'Zhengtao Wu', 'Yongchao Du', 'Zuan Gao', 'Chao Lin', 'Yefeng Shen', 'Xiaoli Xu', 'Zhengze Xu', 'Hao Yan', 'Yuhang Yu', 'Mingzhou Zhang', 'Mengting Chen'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.18076.jpg', 'data': {'categories': ['#training', '#synthetic', '#multimodal', '#diffusion', '#data', '#optimization', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Управляемая возможностями инфраструктура данных для обучения диффузионных моделей', 'desc': 'Статья описывает инфраструктуру для подготовки данных, которая организует разнородные источники обучающей информации в соответствии с зависимостями между способностями модели. Авторы предлагают три специализированных движка обработки данных, которые создают дополнительные связанные данные для привязки текста к изображениям, трансформации между изображениями и связи изображений с внешними знаниями. Система использует многоэтапное curriculum learning, которое совместно развивает композицию задач, распределение визуальных концепций и качество данных в соответствии с порядком усвоения способностей. На основе этой инфраструктуры авторы подготовили массивный датасет из 440 млн изображений для text-to-image и обучили большие диффузионные модели размером 3B и 6B параметров с улучшенными результатами по разнообразию и качеству генерации.'}, 'en': {'title': 'Empowering Generative Models with Capability-Driven Data Infrastructure', 'desc': 'This paper introduces a new data infrastructure designed to enhance the training of large multimodal diffusion models for various generative tasks. It emphasizes a capability-driven approach that organizes data based on the dependencies of generative capabilities, allowing for better supervision across different tasks. The framework includes specialized data engines that create complementary supervision for tasks like text-image grounding and image editing, while a multi-stage curriculum optimizes the training process. The results demonstrate significant improvements in visual coverage and versatility in rendering across diverse applications.'}, 'zh': {'title': '能力驱动的数据基础设施，提升多模态生成能力', 'desc': '本文提出了一种以能力为驱动的数据基础设施，结合了能力特定的监督构建和能力对齐的课程调度，旨在训练大型多模态扩散模型。该基础设施通过三个专业的数据引擎，构建了互补的关系监督，支持文本-图像对齐、图像间转换和图像-知识关联等任务。通过多阶段课程的演变，优化了任务组合、视觉概念分布、数据质量和图像分辨率，确保了能力获取的依赖顺序。实验结果显示，该框架在生成能力的广泛视觉覆盖、灵活渲染和有效转移方面表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.17988', 'title': 'GS-Voxel: Fitting-Free Structured Latents for Large-Scale 3DGS Generation', 'url': 'https://huggingface.co/papers/2608.17988', 'abstract': 'Abstract GS-Voxel converts unstructured 3D Gaussian reconstructions into sparse structured latents to enable scalable aerial scene generation via flow models.  Generated by thinkingmachines/Inkling-Small Many scalable latent 3D generators operate on structured tensors, whereas pre-optimized 3D Gaussian Splatting (3DGS) reconstructions are unordered, spatially irregular, and vary widely in primitive count. We present GS-Voxel, a fitting-free structured latent framework, and evaluate it for large-scale aerial 3D Gaussian scene generation. GS-Voxel deterministically converts a compatible pre-optimized 3DGS reconstruction into sparse active voxels without additional per-scene optimization, retaining the sub-voxel positions and rendering attributes of the selected primitives. A GS-specific factorized VAE then separately encodes voxel geometry and local Gaussian attributes into sparse 3D latents whose size grows with the number of occupied voxels rather than being limited by a fixed scene-wide primitive count. We train image-conditioned flow models in the GS-Voxel latent space to generate aerial 3DGS scenes. A key application enabled by GS-Voxel is large-area scene generation: overlap-aware tiled inference extends synthesis beyond a single training crop conditioned on satellite-view images. Our results show that GS-Voxel provides structured latents for pre-optimized aerial 3DGS reconstructions, with latent capacity that grows with the number of occupied voxels.', 'score': 1, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '5867586237373792', 'authors': ['Ming Qian', 'Zijian Wang', 'Minchao Sun', 'Jincheng Xiong', 'Hang Zhang', 'Mu Xu', 'Chi Wang', 'Baoquan Chen'], 'affiliations': ['Amap, Alibaba', 'Peking University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17988.jpg', 'data': {'categories': ['#training', '#architecture', '#diffusion', '#3d', '#optimization'], 'emoji': '🛰️', 'ru': {'title': 'Структурированные вокселы для масштабируемой генерации гауссовых сцен', 'desc': 'GS-Voxel преобразует неструктурированные 3D Gaussian реконструкции в разреженные структурированные латентные представления для масштабируемой генерации аэрофотосцен с помощью диффузионных моделей потока. Метод детерминистически конвертирует предварительно оптимизированные 3DGS реконструкции в активные вокселы без дополнительной оптимизации, сохраняя позиции и атрибуты примитивов. Специализированный факторизованный VAE отдельно кодирует геометрию вокселей и локальные атрибуты гауссианов в разреженные 3D латенты, размер которых растет с количеством занятых вокселей. Модели потока, обучаемые в латентном пространстве GS-Voxel, генерируют большие аэрофотосцены на основе спутниковых изображений, достигая синтеза сцен, превышающих размер одного обучающего образца.'}, 'en': {'title': 'Transforming 3D Gaussian Data for Scalable Aerial Scene Generation', 'desc': 'GS-Voxel is a framework that transforms unstructured 3D Gaussian reconstructions into organized sparse latents, facilitating the generation of large-scale aerial scenes using flow models. Unlike traditional methods that rely on structured tensors, GS-Voxel handles unordered and irregular 3D Gaussian Splatting (3DGS) data without needing scene-specific optimization. It encodes voxel geometry and local Gaussian attributes into sparse 3D latents, allowing the size of the latents to increase with the number of active voxels. This approach enables efficient generation of expansive aerial scenes by leveraging image-conditioned flow models and overlap-aware tiled inference.'}, 'zh': {'title': 'GS-Voxel：可扩展的空中场景生成新方法', 'desc': 'GS-Voxel 是一种将无结构的 3D 高斯重建转换为稀疏结构潜在空间的框架，旨在通过流模型实现可扩展的空中场景生成。与传统的结构化张量生成器不同，GS-Voxel 可以在不需要额外优化的情况下，将预优化的 3D 高斯重建转换为稀疏活跃体素。该方法保留了所选原始体素的亚体素位置和渲染属性，并通过特定的 VAE 编码体素几何和局部高斯属性。GS-Voxel 使得大面积场景生成成为可能，能够基于卫星视图图像进行超出单一训练裁剪的合成。'}}}, {'id': 'https://huggingface.co/papers/2608.17975', 'title': 'aDSL: Agentic 3D Creation via Joint Agent-Program Design', 'url': 'https://huggingface.co/papers/2608.17975', 'abstract': 'Abstract A co-designed domain-specific language and multi-agent system improve LLM-driven 3D program synthesis by using relational operators and iterative execution feedback.  Generated by thinkingmachines/Inkling-Small Programmatic representations provide a compelling paradigm for 3D content creation, enabling fine-grained edits, interpretability, and explicit structural control. Yet, agentic workflows that rely on large language models (LLMs) to author 3D programs remain brittle, often failing to translate high-level intent into consistent low-level geometry. We attribute this fragility to a mismatch between existing programmatic interfaces and the reasoning strengths of LLMs, which favor semantic structure and spatial relations over fragile numeric choices. In this paper, we jointly design an Agent-centric Domain-Specific Language (aDSL) and a role-specialized multi-agent system to close this gap. aDSL bridges semantic logic and geometric constraints by emphasizing composability and spatial reasoning; it enables agents to manipulate geometry through relational operators instead of brittle absolute coordinates. Building on aDSL, our training-free multi-agent system follows a Plan-Execute-Critic loop to decompose requests, synthesize code, and iteratively repair errors and constraint violations using execution feedback. Experiments show that this co-design improves robustness, controllability, and faithfulness to user intent. Our method outperforms prior LLM-based baselines on text-to-shape and image-to-shape tasks while preserving explicit structure, editability, and interpretability. It also enables downstream applications such as articulated object creation and structured scene composition. Our code is available at https://github.com/sig-pku/aDSL.', 'score': 1, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '6eaef21ac69c0b0f', 'authors': ['Rui-Huan Wang', 'Si-Tong Wei', 'Jia-Qi He', 'Heng-Yi Wei', 'Baoquan Chen', 'Peng-Shuai Wang'], 'affiliations': ['Peking University, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17975.jpg', 'data': {'categories': ['#3d', '#agents', '#architecture'], 'emoji': '🏗️', 'ru': {'title': 'Многоагентный синтез 3D-программ через реляционный язык и итеративное исправление', 'desc': 'В статье предложен подход к синтезу трёхмерных программ, где большие языковые модели работают с специально разработанным предметно-ориентированным языком (aDSL), который использует реляционные операторы вместо абсолютных координат. Авторы создали многоагентную систему с архитектурой Plan-Execute-Critic, которая разбивает задачу на этапы: планирование, генерация кода и итеративное исправление ошибок на основе обратной связи от выполнения программы. Совместное проектирование языка и системы агентов позволяет LLM лучше оперировать пространственными отношениями и семантической структурой, что значительно повышает устойчивость и точность синтеза трёхмерного контента. Экспериментально показано, что метод превосходит предыдущие подходы на задачах преобразования текста в форму и изображения в форму, сохраняя при этом интерпретируемость и возможность редактирования.'}, 'en': {'title': 'Bridging Intent and Geometry in 3D Program Synthesis', 'desc': 'This paper presents a new approach to creating 3D programs using a specially designed language and a multi-agent system that works with large language models (LLMs). The proposed Agent-centric Domain-Specific Language (aDSL) enhances the way agents handle geometry by focusing on relational operators, which improves the accuracy of translating user intentions into 3D shapes. The multi-agent system employs a Plan-Execute-Critic loop to refine the generated code, allowing for iterative corrections based on execution feedback. Overall, this method increases the reliability and control of 3D content creation while maintaining clarity and ease of editing.'}, 'zh': {'title': '提升3D程序合成的智能体系统与领域特定语言', 'desc': '本文提出了一种联合设计的面向特定领域的语言（aDSL）和多智能体系统，以改善基于大型语言模型（LLM）的3D程序合成。通过使用关系运算符和迭代执行反馈，aDSL能够更好地桥接语义逻辑与几何约束，使得智能体能够通过关系运算符操作几何体，而不是依赖脆弱的绝对坐标。我们的多智能体系统采用计划-执行-评估循环，能够分解请求、合成代码，并通过执行反馈迭代修复错误和约束违规。实验结果表明，这种联合设计提高了系统的鲁棒性、可控性和对用户意图的忠实度。'}}}, {'id': 'https://huggingface.co/papers/2608.15008', 'title': 'Harness the Memory: A Holistic Evaluation of Memory Substrates in Memory Agents', 'url': 'https://huggingface.co/papers/2608.15008', 'abstract': 'Abstract Empirical evaluation of diverse memory substrates for long-horizon LLM agents reveals regime-dependent trade-offs, motivating adaptive substrate routing for reliable agent memory.  Generated by thinkingmachines/Inkling-Small Memory is becoming core infrastructure for long-horizon LLM agents, yet existing evaluations offer limited guidance on which memory substrate, namely the underlying medium in which memory is represented and stored, should be used under different operating regimes. We present a controlled harness evaluation of memory substrates for memory-augmented agents, covering dense and sparse indices, text records, structural stores, hierarchical stores, refinement-based memories, parametric updates, and activation-compatible context mechanisms. Across three backbone models and four benchmark suites spanning user-centric question answering and agent-centric decision-making, we instrument 26 performance and efficiency metrics under a unified harness. Our results show that no single substrate consistently dominates: broad retrieval benefits long-context factual QA, while excessive retrieval can harm sequential decision-making by shifting attention away from action-critical context. Scalability introduces a further routing axis, as substrates that perform well at moderate history lengths can become costly or brittle at longer horizons. These findings motivate substrate routing as a necessary component of adaptive agent memory systems and provide empirical guidance for designing efficient, reliable, and regime-aware long-term memory for LLM agents. Code will be made available upon acceptance.', 'score': 1, 'issue_id': 3041, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '564de84deeca5556', 'authors': ['Wei-Chieh Huang', 'Weizhi Zhang', 'Yuchen Wu', 'Yankai Chen', 'Eric Hanchen Jiang', 'Wooseong Yang', 'Yiwei Yang', 'Henry Peng Zou', 'Hanrong Zhang', 'Ying Nian Wu', 'Haolun Wu', 'Kai-Wei Chang', 'Philip S. Yu', 'Xue Liu', 'Aylin Caliskan'], 'affiliations': ['MBZUAI', 'McGill University', 'University of California, Los Angeles', 'University of Illinois Chicago', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15008.jpg', 'data': {'categories': ['#long_context', '#agents', '#benchmark', '#open_source', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'Адаптивная маршрутизация памяти для надёжных долгосрочных LLM-агентов', 'desc': 'В этой работе исследуются различные способы организации памяти для LLM-агентов, работающих на длинных горизонтах принятия решений. Авторы провели комплексное тестирование множества архитектур памяти — от плотных и разреженных индексов до иерархических хранилищ и параметрических обновлений — на трёх основных моделях и четырёх наборах бенчмарков. Результаты показывают, что нет универсального решения: для факт-ориентированных задач вопросно-ответного типа выгодна обширная выборка, а для принятия последовательных решений она может быть вредна, отвлекая внимание от критически важного контекста. Исследование подчеркивает необходимость адаптивной маршрутизации выбора памяти в зависимости от режима работы агента.'}, 'en': {'title': 'Adaptive Memory Routing for Enhanced LLM Performance', 'desc': "This paper evaluates different memory types for long-horizon large language model (LLM) agents to understand their effectiveness in various situations. It examines various memory substrates, such as dense and sparse indices, and how they impact performance in tasks like question answering and decision-making. The study finds that no single memory type is best for all scenarios; some are better for retrieving information while others are more suited for maintaining focus on important actions. The authors suggest that adaptive routing of memory types is essential for improving the reliability and efficiency of LLM agents' long-term memory systems."}, 'zh': {'title': '自适应记忆系统：优化长时间跨度的记忆基质', 'desc': '本论文探讨了长时间跨度的语言模型（LLM）代理的记忆基础设施，评估了不同记忆基质在不同操作模式下的表现。研究表明，没有单一的记忆基质在所有情况下都表现最佳，广泛的检索对长上下文的事实问答有利，但过度检索可能会影响顺序决策。论文还指出，记忆基质的可扩展性在历史长度较长时可能会导致成本增加或性能下降。基于这些发现，提出了自适应记忆系统中基质路由的重要性，以设计高效、可靠且适应不同操作模式的长期记忆。'}}}, {'id': 'https://huggingface.co/papers/2608.17512', 'title': 'Embodied-Navigator: Point, Think, Memorize, and Align for Efficient Navigation', 'url': 'https://huggingface.co/papers/2608.17512', 'abstract': "Abstract TAMP-Nav improves embodied navigation by aligning vision-language models with 2D visual prompting, selective reasoning with compressed memory, and dense policy optimization.  Generated by thinkingmachines/Inkling-Small Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting. Specifically, the VLM merely selects 2D pixels, which are then projected into 3D coordinates for a low-level SLAM controller. This design naturally aligns embodied execution with the VLM's inherent 2D visual capabilities. Second, we propose an integrated Selective Reasoning and Anchor-Trajectory Memory mechanism (Think and Memorize), which dynamically triggers Chain-of-Thought and retains high-fidelity memory only at critical nodes, compressing redundant trajectories into lightweight Space-Time Indicators, thereby preserving critical historical information and enhancing spatio-temporal perception. Finally, we design an efficient Two-Level Alignment Paradigm (Align) via Group Relative Policy Optimization (GRPO). By superimposing global outcome rewards with fine-grained process rewards, this dense supervision tightly aligns the agent's cognitive planning with physical environmental feedback, endowing the model with adaptive reasoning capabilities. Experiments demonstrate that TAMP-Nav achieves state-of-the-art performance (e.g., 66.2% SR on R2R-CE) with high runtime and sample efficiency (requiring only 90k training trajectories).", 'score': 0, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'f873ff04e373f466', 'authors': ['Hongyan Feng', 'Sunlai Chen', 'Xuanyu Liu', 'Miao Pan', 'Yangfan Xie', 'Yuxiang Cui', 'Zhongxiang Zhou', 'Rong Xiong', 'Wenqi Zhang', 'Jianwei Yin', 'Yueting Zhuang', 'Xuhong Zhang'], 'affiliations': ['School of Software Technology, Zhejiang University', 'Zhejiang Humanoid Robot Innovation Center Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2608.17512.jpg', 'data': {'categories': ['#rl', '#training', '#agents', '#robotics', '#multimodal'], 'emoji': '🧭', 'ru': {'title': 'Выравнивание видеоязыковых моделей с 2D восприятием для эффективной навигации робота', 'desc': 'TAMP-Nav представляет собой единый фреймворк для улучшения воплощённой навигации робота путём согласования возможностей видеоязыковых моделей с естественным 2D восприятием. Система использует инновационную формулировку «Пиксель-в-3D действие», где VLM выбирает 2D пиксели, которые затем проецируются в 3D координаты для низкоуровневого контроллера SLAM. Фреймворк включает механизм селективного рассуждения и якорной памяти траектории, который динамически активирует цепочку мыслей только в критических узлах, сжимая избыточные траектории в компактные пространственно-временные индикаторы. Оптимизация достигается через двухуровневую парадигму выравнивания с использованием групповой оптимизации относительной политики, сочетающей глобальные награды результата с мелкозернистыми наградами процесса.'}, 'en': {'title': 'Navigating the Future: Aligning Vision and Action in 3D', 'desc': "TAMP-Nav is a new framework that enhances embodied navigation by integrating vision-language models with 2D visual prompts. It reformulates navigation tasks into a 2D pixel selection process, which is then translated into 3D actions for better alignment with the model's pre-training. The framework also introduces a selective reasoning mechanism that optimizes memory usage by focusing on important information and compressing less relevant data. Finally, it employs a two-level alignment strategy that combines global and local rewards to improve the agent's decision-making and adaptability in real-world environments."}, 'zh': {'title': '高效体感导航的新突破', 'desc': 'TAMP-Nav 是一种改进的体感导航框架，通过将视觉-语言模型与二维视觉提示对齐，提升了导航效率。它采用了像素到三维动作的重新定义，使得模型可以直接选择二维像素并将其投影到三维坐标中，从而更好地利用其二维视觉能力。此外，TAMP-Nav 引入了选择性推理和锚点轨迹记忆机制，动态保留重要信息并压缩冗余轨迹，增强了时空感知能力。最后，通过群体相对策略优化的两级对齐范式，模型实现了认知规划与环境反馈的紧密对齐，展现出卓越的适应性推理能力。'}}}];

                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-19 03:40',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-19 03:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-19 03:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
