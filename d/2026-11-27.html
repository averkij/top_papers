dence degrades decision quality, while penalizing excessive confidence drops under unrelated-organ removal. To facilitate rigorous evaluation, we construct CT-Verdict, a comprehensive benchmark spanning binary finding presence, multiple-choice questions, and ordinal severity assessment across both in-distribution and external cohorts. Extensive experiments demonstrate that Radev significantly outperforms state-of-the-art methods in both decision accuracy and confidence calibration, while generalizing robustly under distribution shifts. Project page at https://juntaojianggavin.github.io/projects/Radev/', 'score': 1, 'issue_id': 3570, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '58f0c0c611d20ba8', 'authors': ['Juntao Jiang', 'Wenqi Zhong', 'Guangyu Guo', 'Dexia Chen', 'Yilong Hu', 'Yunhao Bai', 'Zhenyu Yi', 'Jianwei Xu', 'Tony C. W. Mok', 'Muxuan Gao', 'Ling Zhang', 'Yong Liu', 'Jiangning Zhang', 'Zhongwei Qiu'], 'affiliations': ['DAMO Academy, Alibaba Group', 'East China Normal University', 'Hupan Lab', 'Shanghai Jiao Tong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32993.jpg', 'data': {'categories': ['#architecture', '#3d', '#training', '#hallucinations', '#multimodal', '#alignment', '#healthcare', '#security', '#dataset', '#benchmark', '#cv'], 'emoji': '\U0001fa7b', 'ru': {'title': 'Модель, которая знает, насколько она уверена в диагнозе по КТ', 'desc': 'Статья представляет Radev — мультимодальную модель для анализа объёмных КТ-снимков, которая принимает клинические решения и оценивает уверенность в них. Модель использует замороженный 3D-энкодер для извлечения признаков органов и визуальную компрессию, направляемую анатомией, что позволяет языковому бэкбону предсказывать вероятности кандидатов за один проход без autoregressive decoding. Для калибровки уверенности предложен метод Counterfactual-Calibrated Training (CCT), который сравнивает предсказания при сохранённых и удалённых органах и тем самым снижает шорткат-обучение на нерелевантных областях. Авторы также создали бенчмарк CT-Verdict для бинарных, множественных и порядковых задач и показали, что Radev превосходит современные методы по точности и калибровке уверенности.'}, 'en': {'title': 'Ground CT decisions in anatomy—and calibrate confidence with counterfactuals', 'desc': 'Radev is a multimodal model that makes clinical decisions from 3D CT scans while estimating how confident it is. It combines organ-level features from a 3D encoder with relevant details from 2D slices, then predicts candidate probabilities in one pass rather than using autoregressive decoding. Its Counterfactual-Calibrated Training method teaches confidence to fall when evidence from the target organ is removed, but discourages large drops when unrelated anatomy is removed. On the CT-Verdict benchmark, Radev improves decision accuracy and confidence calibration and remains robust across different patient cohorts and distribution shifts.'}, 'zh': {'title': '让 CT 决策更懂解剖，也更会衡量把握', 'desc': '本文提出 Radev，一种面向临床决策的多模态模型，用于从三维 CT 中预测结果并给出可信度。模型利用冻结的三维编码器提取器官级特征，再根据问题选择相关特征，与特定解剖区域内的二维切片信息结合。它通过一次前向计算直接预测候选答案的概率，避免自回归生成；同时，反事实校准训练会检验移除相关或无关器官信息后，预测置信度是否合理变化。研究还构建了 CT-Verdict 基准，实验显示该方法在决策准确性、置信度校准和分布变化下的泛化能力方面表现良好。'}}}, {'id': 'https://huggingface.co/papers/2611.33885', 'title': 'LayoutRecall: Preserving Appearance in Multi-Round 3D Layout-Controlled Image Editing', 'url': 'https://huggingface.co/papers/2611.33885', 'abstract': 'Abstract LayoutRecall is a multi-round 3D layout-controlled image editor that preserves object appearance across edits by storing and retrieving latents in 3D box coordinate systems and conditioning a FLUX.2 editor with geometry-aligned memory.  Generated by deepseek-ai/DeepSeek-V4.1-Flash 3D layout-controlled image editing gives users explicit control over object placement and camera viewpoint. In a sequence of edits, however, the latest image can lose the appearance of an object when it is occluded or leaves view. The target layout specifies where the object should reappear, while its appearance must be recovered from earlier observations. We introduce LayoutRecall, a multi-round editor that stores and reuses appearance in the local coordinate systems of 3D boxes. Box-Surface Latent Memory retains image latents on box faces and retrieves them along rays in the target view. Geometry-Aligned Memory Conditioning supplies the retrieved tokens to a FLUX.2 editor using target-view positions, shared box-local embeddings, and object-wise attention. A correspondence loss encourages the editor to attend to matching observations during denoising. We also introduce LayoutLoop, a multi-round 3D layout-controlled image editing benchmark with calibrated layouts and designed revisits. We conduct extensive experiments on LayoutLoop and real-scene data to verify the ability of our method. The project page is at https://ykchizs.github.io/layoutrecall.github.io/.', 'score': 0, 'issue_id': 3572, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'aecbbb6887e5101f', 'authors': ['Yankuan Chi', 'Xin Lin', 'Baihan Yang', 'Yuheng Liu', 'Jason Li', 'Truong Nguyen'], 'affiliations': ['Nanyang Technological University', 'University of California Irvine', 'University of California San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2611.33885.jpg', 'data': {'categories': ['#architecture', '#cv', '#multimodal', '#3d', '#benchmark', '#dataset'], 'emoji': '🧊', 'ru': {'title': 'Объект помнит свой облик, даже когда скрыт из виду', 'desc': 'LayoutRecall — это мультираундовый редактор изображений с управлением 3D-раскладкой, который сохраняет внешний вид объектов между правками. Метод хранит латентные представления (latents) изображения на гранях 3D-боксов в локальных системах координат и извлекает их вдоль лучей в целевом виде камеры. Эти данные подаются в FLUX.2 editor через Geometry-Aligned Memory Conditioning, а correspondence loss помогает модели при денойзинге опираться на соответствующие наблюдения. Авторы также представляют бенчмарк LayoutLoop с калиброванными раскладками и намеренными возвратами к объектам, на котором подтверждается эффективность подхода.'}, 'en': {'title': 'Remember Objects Across Every View', 'desc': 'LayoutRecall is a multi-round image editor that uses 3D layouts to control object placement and camera views. It stores image latents in the local coordinate systems of 3D boxes, then retrieves relevant appearance information when an object reappears. Geometry-aligned memory conditioning passes the retrieved tokens to a FLUX.2 editor, while a correspondence loss encourages attention to matching past observations. The authors introduce the LayoutLoop benchmark and report experiments on it and real-scene data to evaluate the method.'}, 'zh': {'title': '让物体重回画面时，依然保持熟悉的模样', 'desc': '本文提出 LayoutRecall，一种支持多轮编辑的 3D 布局控制图像编辑方法，帮助物体在被遮挡或离开画面后仍能保持原有外观。它把图像潜变量存储在 3D 物体框的局部坐标系中，并沿目标视角的射线检索相关外观信息。随后，方法通过几何对齐的记忆条件，将检索到的特征提供给 FLUX.2 编辑器，并用物体级注意力和对应关系损失引导生成过程。作者还构建了包含校准布局和专门设计的重复视角场景的 LayoutLoop 基准，并在该基准及真实场景数据上进行了实验验证。'}}}, {'id': 'https://huggingface.co/papers/2611.27112', 'title': 'Markdown Is Not a Firewall: four coding agents, one rules file, four boundaries', 'url': 'https://huggingface.co/papers/2611.27112', 'abstract': "Abstract  Teams put a one-page rules file in a repository and call it a control on coding agents. A registered study found agents rarely look up a repository's contribution rules. I asked the security question: what does a rules file do at a boundary, against a gate? I tested one 278-word rules file, with hypotheses and analysis code deposited first. Claude Code, Codex CLI, Gemini CLI and OpenCode with DeepSeek worked through 20 small repositories with hidden tests, 12 for three of them. Three agents met four boundaries I built: a refused endpoint, a destructive shortcut, a planted instruction and a planted package. Permission prompts, each vendor's own control layer, were off by design. A gate in front of the mock service blocked and logged forbidden requests. Every verdict was read from records the agent could not change. Only my first scoring pass was blind to arm. My checkers found no real bugs, with the file or without it. The file cost one agent a third of its score: Codex CLI fell from 99.0 to 67.7 percent on hidden tests, and in 11 of its 36 steps reported the task complete with all tests passing while under half of the hidden tests passed. Its own tests passed. Faced with two of its rules that clash on these tasks, three agents followed the task and one followed the rule. Pooled, passes fell from 98.2 to 90.9 percent. Matched pairs fell 7.7 points, 1.3 without Codex CLI. Attempts to cross were rare: 5 in 90 gated steps, 3 without the file, 2 with it, all by OpenCode with DeepSeek, all blocked. With no gate, under the neutral file, the same requests reached the mock in 7 of 45 runs. By an error in my run script, the no-file and rules-file arms always ran behind the gate at the three HTTP boundaries, so I could not test whether the file changes what an agent does there. On what I could measure, the file acted as advice. A file tells an agent what you want. A gate decides what it gets.", 'score': 0, 'issue_id': 3571, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': '56f22f2b312fac03', 'authors': ['Sandeep Dhuri'], 'affiliations': ['Independent Researcher, New Jersey, USA'], 'pdf_title_img': 'assets/pdf/title_img/2611.27112.jpg', 'data': {'categories': ['#benchmark', '#security', '#agents', '#alignment'], 'emoji': '🚧', 'ru': {'title': 'Файл правил — это совет, а шлюз — это запрет', 'desc': 'Авторы проверяют, помогает ли файл с правилами (rules file) в репозитории контролировать поведение AI-агентов для кодинга, таких как Claude Code и Codex CLI. Агенты решали небольшие задачи со скрытыми тестами, а их попытки обойти запреты фиксировались внешним шлюзом (gate), который не могли изменить. Файл снизил общий процент прохождения тестов с 98.2% до 90.9%, а у Codex CLI он упал с 99.0% до 67.7%. Вывод: такой файл работает как рекомендация, а реальные ограничения должен задавать шлюз.'}, 'en': {'title': 'Rules advise; gates enforce.', 'desc': 'This study tested whether a repository rules file controls coding agents at security boundaries. Across small repositories with hidden tests, the file did not reduce bugs or reliably stop unsafe actions; when rules conflicted with the task, most agents followed the task. It also reduced Codex CLI’s hidden-test score, while a separate gate blocked and logged forbidden requests. Because the rules-file and no-file runs both used the gate at the HTTP boundaries, the study could not determine whether the file changed agent behavior there.'}, 'zh': {'title': '规则文件给出建议，安全网关守住边界', 'desc': '这项研究测试了一份简短的仓库规则文件，能否约束编码智能体在安全边界上的行为。研究让多个智能体在带有隐藏测试的小型代码库中完成任务，并通过外部网关记录和阻止对模拟服务的违规请求；所有最终判断都依据智能体无法修改的记录。结果显示，规则文件没有减少违规请求尝试，却让一个智能体的隐藏测试得分大幅下降，也使整体任务通过率降低；研究者还发现，没有网关时，部分请求确实到达了模拟服务。由于实验脚本的限制，研究无法比较有无规则文件时智能体在这些 HTTP 边界上的行为，因此结论是：规则文件更像建议，而网关才能实际限制访问。'}}}, {'id': 'https://huggingface.co/papers/2611.31516', 'title': 'InitFree-SfM: When Initialization-Free Bundle Adjustment meets Learned Structure-from-Motion', 'url': 'https://huggingface.co/papers/2611.31516', 'abstract': 'Abstract  Initialization-free bundle adjustment (InitFree BA) aims to jointly recover camera poses and scene structure without requiring an initial global estimate. It is a very challenging problem, especially compared to traditional BA where a good estimation is assumed. While recent methods optimize surrogate Object Space Error (OSE) objectives from random initialization, a low objective value does not necessarily yield an accurate reconstruction, revealing a gap between optimization and reconstruction. We show that existing InitFree BA pipelines struggle to produce accurate 3D reconstructions on modern SfM benchmarks, and demonstrate that incorporating learned metric depth substantially improves their practical feasibility. We introduce InitFree-SfM, a complete initialization-free SfM pipeline combining learned correspondences, metric depth, depth-consistent track construction, and joint metric refinement. Within this framework, we propose a simple depth-augmented OSE (dOSE), which complements the directional constraints of OSE by constraining landmark positions along their viewing rays. Our approach substantially outperforms existing InitFree BA methods and achieves competitive accuracy with established SfM pipelines, including on challenging low-overlap image collections. Importantly, our analysis challenges the prevailing emphasis on surrogate objectives in previous InitFree BA research, revealing that geometric constraints play a central role in accurate reconstruction, while OSE-based optimization provides further improvements.', 'score': 0, 'issue_id': 3570, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '74a1206d98a6d26e', 'authors': ['Simon Weber', 'Mateo de Mayo', 'Je Hyeong Hong', 'Carl Olsson', 'Daniel Cremers', 'Ronald Clark'], 'affiliations': ['Hanyang University', 'Lund University', 'Munich Center for Machine Learning', 'Technical University of Munich', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.31516.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#cv'], 'emoji': '🏗️', 'ru': {'title': 'Геометрия важнее суррогатных целей: точная 3D-реконструкция без инициализации', 'desc': 'Статья посвящена задаче bundle adjustment без инициализации (InitFree BA), где нужно совместно восстановить позы камер и структуру сцены без глобальной начальной оценки. Авторы показывают, что существующие методы, оптимизирующие суррогатную функцию Object Space Error (OSE), часто дают неточные 3D-реконструкции, несмотря на низкое значение целевой функции. Предложен полный конвейер InitFree-SfM, использующий обученные соответствия, метрическую глубину и совместное метрическое уточнение, а также новая функция dOSE, ограничивающая положения точек вдоль лучей обзора. Результаты показывают, что геометрические ограничения играют ключевую роль в точной реконструкции, а не только оптимизация суррогатных целевых функций.'}, 'en': {'title': 'Depth and Geometry Make Initialization-Free SfM Work', 'desc': 'The paper studies initialization-free bundle adjustment, which estimates camera poses and 3D scene structure without starting from a global estimate. It presents InitFree-SfM, a pipeline that combines learned image correspondences and metric depth with depth-consistent tracks and joint refinement. Its depth-augmented objective, dOSE, adds constraints on landmark positions along viewing rays to complement the directional constraints in OSE. Experiments show more accurate reconstructions than prior initialization-free methods, highlighting the importance of geometric constraints as well as objective optimization.'}, 'zh': {'title': '融合度量深度，让初始化自由的三维重建更准确', 'desc': '初始化自由束调整（InitFree BA）旨在不依赖全局初始估计，同时恢复相机位姿和场景结构。论文发现，仅优化替代目标函数并不能保证重建准确，因此引入学习得到的度量深度，并提出完整的 InitFree-SfM 流程，结合图像匹配、深度一致的特征轨迹构建和联合度量优化。作者还提出深度增强型目标函数 dOSE，在原有方向约束之外，沿相机视线约束三维地标位置。实验表明，该方法优于现有初始化自由方法，并在低重叠图像等困难场景中达到与成熟 SfM 流程相近的精度，说明几何约束对准确重建至关重要。'}}}, {'id': 'https://huggingface.co/papers/2611.31155', 'title': 'So Many Ways to Multiply 3times3 Matrices: A Large Dataset of Rank-23 Schemes', 'url': 'https://huggingface.co/papers/2611.31155', 'abstract': 'Abstract  A publicly available dataset of 62029 rank-23 schemes for 3times3 matrix multiplication is presented. Every scheme in it has its own rank pattern, an invariant formed by the ranks of the factor matrices of a scheme, so all schemes are pairwise inequivalent. The schemes were obtained by a numerical method combining gradient descent with alternating least squares and by flip graph search, and have ternary, integer or rational coefficients. Rank 23 is the best known for this format and is optimal for schemes with integer coefficients, but the number of essentially different schemes of this rank was poorly understood: the existing collections of Heule et al. and Mårtensson et al. contain many schemes that share only a small number of rank patterns (17376 schemes with 387 patterns and 15316 schemes with 568 patterns respectively). The dataset shows that the number of different rank patterns is much larger than previously known.', 'score': 0, 'issue_id': 3570, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'eaedc6ed485e15c4', 'pdf_title_img': 'assets/pdf/title_img/2611.31155.jpg', 'data': {'categories': ['#optimization', '#math', '#dataset', '#open_source'], 'emoji': '🧮', 'ru': {'title': 'Тысячи неэквивалентных путей к умножению матриц 3x3 за 23 операции', 'desc': 'В статье представлен публичный датасет из 62029 схем умножения матриц 3x3 рангом 23, где каждая схема имеет уникальный rank pattern и поэтому все схемы попарно неэквивалентны. Схемы получены численным методом, сочетающим gradient descent с alternating least squares, а также поиском на flip graph, при этом коэффициенты тернарные, целые или рациональные. Ранг 23 считается лучшим известным для данного формата и оптимальным для схем с целыми коэффициентами, однако число существенно различных схем такого ранга изучено слабо. Датасет показывает, что количество различных rank patterns значительно больше, чем было известно ранее по коллекциям Heule et al. и Mårtensson et al.'}, 'en': {'title': 'Uncovering a Rich Landscape of Rank-23 Matrix Multiplication Schemes', 'desc': 'The paper presents a public dataset of 62,029 schemes for multiplying 3 × 3 matrices using 23 multiplications. Each scheme has a distinct rank pattern, an invariant based on the ranks of its factor matrices, so the schemes are pairwise inequivalent. The authors found the schemes using gradient descent, alternating least squares, and flip-graph search, with ternary, integer, or rational coefficients. The dataset reveals far more distinct rank patterns than earlier collections, expanding what is known about rank-23 matrix multiplication schemes.'}, 'zh': {'title': '发现矩阵乘法秩 23 方案的丰富多样性', 'desc': '本文发布了一个包含 62029 个 3×3 矩阵乘法秩为 23 的方案的公开数据集。每个方案都有独特的秩模式，即由方案中各因子矩阵的秩构成的不变量，因此这些方案两两不等价。研究者通过结合梯度下降与交替最小二乘的数值方法，以及翻转图搜索，获得了系数为三进制数、整数或有理数的方案。该数据集显示，这类方案的不同秩模式远多于以往已知的数量；秩 23 是目前该格式的最佳已知秩，并且对整数系数方案而言是最优的。'}}}];
        const articlesContainer = document.getElementById('articles-container');

            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');

                const title = document.getElementById('doomgrad');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);

        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (7)', '#agi (1)', '#alignment (3)', '#architecture (10)', '#audio (1)', '#benchmark (13)', '#cv (5)', '#data (4)', '#dataset (7)', '#diffusion (1)', '#ethics (1)', '#games (2)', '#graphs (2)', '#hallucinations (2)', '#healthcare (1)', '#inference (4)', '#interpretability (4)', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (6)', '#open_source (2)', '#optimization (7)', '#plp (1)', '#rag', '#reasoning (3)', '#rl (1)', '#rlhf', '#robotics (1)', '#science', '#security (5)', '#small_models', '#story_generation (1)', '#survey (5)', '#synthetic (1)', '#training (11)', '#transfer_learning', '#video (4)'];

            categories.forEach(category => {

                selectedCategories.push(category);
                button.classList.add('active');

                selectedCategories.splice(index, 1);
                button.classList.remove('active');

            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));

                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

            const urlCategories = getUrlParameters();

                    selectedCategories = JSON.parse(savedCategories);

            updateCategoryButtonStates();

            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });

            console.log(selectedCategories);
            let filteredArticles;

                    ? articlesData
                    : articlesData.filter(article =>

            updateSelectedArticlesTitle();
            updateUrlWithCategories();

                            <div id="abstract-${index}" class="abstract">

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));

                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-28 03:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-28 03:02')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
