    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.34051', 'title': 'Stable Gated DeltaNet-2: Understanding and Mitigating Recurrent State Instability', 'url': 'https://huggingface.co/papers/2611.34051', 'abstract': 'Abstract  Linear attention offers an efficient solution for long-sequence modeling via linear complexity and fixed-size recurrent states. Gated DeltaNet-2 (GDN-2) introduces independent channel-wise control over erasure and writing, enhancing state-update expressiveness and in-context retrieval, yet it suffers from training failures during long-context training. We trace these failures to the asymmetry between reading and modification directions during erasure, which yields non-normal erase operators whose directional gains accumulate across tokens, triggering exponential state growth even without new writes. To resolve this, we propose , employing symmetric erasure to ensure non-expansive state propagation and decay-regulated residual writing to preserve writing flexibility. Theoretically, we establish an O(T) upper bound on recurrent state growth while retaining chunkwise parallel computation. Experiments on ~1.6B parameter models show that  achieves stable training alongside improved long-context retrieval. Compared to GDN-2, it boosts the 128K average RULER score by 6.80 points in the recurrent setting and average accuracy across nine downstream tasks by 0.62 points in the hybrid setting.', 'score': 128, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'e2bf3dac2b7c04ba', 'authors': ['Xichong Zhang', 'Xixuan Hao', 'Zhichen Liu', 'Le Zhou', 'Zeyu Zhang', 'Boyu Chen', 'Mingfei Lu', 'Zehao Lin', 'Bo Tang', 'Yonggang Zhang', 'Linyun Liu', 'Feiyu Xiong', 'Jianlin Su', 'Zhiyu Li'], 'affiliations': ['HKUST', 'HKUST(GZ)', 'MemTensor', 'SJTU', 'SUSTech', 'USTC', 'kexue.fm'], 'pdf_title_img': 'assets/pdf/title_img/2611.34051.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Симметричное стирание стабилизирует память линейного внимания на длинных контекстах', 'desc': 'Статья посвящена линейному вниманию (linear attention) для моделирования длинных последовательностей, где состояние рекуррентной сети фиксированного размера. Авторы выявили, что обучение модели GDN-2 ломается на длинном контексте из-за асимметрии при стирании: несимметричные операторы стирания накапливают усиление и приводят к экспоненциальному росту состояния даже без новых записей. Предложенный метод использует симметричное стирание и декей-регулируемую остаточную запись, что даёт O(T)-оценку роста состояния при сохранении chunkwise-параллельных вычислений. Эксперименты на моделях около 1.6B параметров показывают стабильное обучение и улучшение поиска в длинном контексте, например +6.80 к среднему RULER на 128K.'}, 'en': {'title': 'Stable State Growth for Better Long-Context Retrieval', 'desc': 'Linear attention models long sequences efficiently using linear-time computation and fixed-size recurrent states. Gated DeltaNet-2 improves retrieval with separate controls for erasing and writing, but its asymmetric erasure can cause recurrent states to grow exponentially during long-context training. The paper proposes symmetric erasure and decay-regulated residual writing, which limit state growth to O(T) while preserving flexible writing and chunkwise parallel computation. Experiments with approximately 1.6-billion-parameter models show more stable training and improved retrieval and downstream-task performance compared with Gated DeltaNet-2.'}, 'zh': {'title': '让线性注意力长序列训练更稳、检索更准', 'desc': '线性注意力通过线性复杂度和固定大小的循环状态，高效处理长序列。Gated DeltaNet-2（GDN-2）能分别控制状态的擦除与写入，但擦除操作在读取方向和修改方向上的不对称，会使状态随序列增长而指数膨胀，导致长上下文训练不稳定。本文提出一种采用对称擦除和受衰减调节的残差写入方法，在保持写入灵活性的同时，使状态传播不会放大，并从理论上将状态增长限制在 O(T)。在约 16 亿参数模型上的实验显示，该方法训练更稳定；相比 GDN-2，它在循环设置下的 128K RULER 平均分提高 6.80 分，在混合设置下九项下游任务的平均准确率提高 0.62 分。'}}}, {'id': 'https://huggingface.co/papers/2611.34232', 'title': 'OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms', 'url': 'https://huggingface.co/papers/2611.34232', 'abstract': 'Abstract A live cross-platform benchmark evaluates computer-using agents on long-horizon workflows across Windows, Ubuntu, macOS, iOS, Android, and Web, showing that current agents remain far from platform-robust computer use and trail humans on iOS and macOS.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Computer-using agents are increasingly expected to complete realistic user goals rather than isolated GUI actions. However, existing benchmarks typically isolate web, mobile, or desktop environments, leaving it unclear whether a single generalist agent can execute long-horizon workflows that span multiple operating systems and persistent application states. We introduce OS-Omni, a live cross-platform benchmark and execution environment for evaluating computer-using agents across Windows, Ubuntu, macOS, iOS, Android, and Web environments. OS-Omni is released in versioned waves of 300 tasks each; this paper focuses on the first release, v1, which contains 48 tasks per platform and 12 cross-platform workflows that pair a desktop with an Android phone. OS-Omni provides reproducible initialization, platform-specific adapters, trajectory logging, and executable final-state evaluators, and includes controlled service-backed applications for workflows involving account, cart, budget, calendar, message, and other persistent state. Human studies show that OS-Omni tasks require 67.54 interaction steps, substantially exceeding OSWorld references of 15.0 steps. On v1, the strongest evaluated agent, Claude Opus 5.5, reaches 68.5% average success, trailing the 77.3% human reference by 8.8 points; the gap is uneven across platforms, with frontier models exceeding humans on Linux but trailing them by more than 25 points on iOS and macOS. These results indicate that current agents remain far from platform-robust, long-horizon computer use, especially when success requires sustained state tracking and durable final-state changes.', 'score': 104, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '556d0136387559f3', 'authors': ['Hui Shen', 'Yunta Hsieh', 'Jianing Ma', 'Zhuoran Yin', 'Zhuhan Bao', 'Ziyuan Liu', 'Qi Han', 'Xiuqi Xu', 'Xianbang Wang', 'Wenhao Chai', 'Sihan Xu', 'Chenyang Zhao', 'Yanheng Shang', 'Dongfu Jiang', 'Rui Sun', 'Xingzhi Li', 'Chenqi Yin', 'Zesen Zhao', 'Boyuan Zheng', 'Jisen Li', 'Xiaoxia Wu', 'Ruoyan Zhang', 'Ruiyao Liu', 'Jing Xiong', 'He Xiao', 'Nan Zheng', 'Hangxiang Chen', 'Shengyang Tao', 'Deyang Luorong', 'Yifeng Liu', 'Jingxuan Zhang', 'Chaofan Tao', 'Yuren Wang', 'Jiaqi Mo', 'Rui Hu', 'Xing Wei', 'Xiaofeng Liu', 'Xin Xu', 'Han Wu', 'Mengyao Wen', 'Guobin Zhang', 'Shatong Zhu', 'Hei Ting Una Chan', 'Sicheng Chen', 'Kai Zhang', 'Mengkang Hu', 'Zhongwei Wan', 'Xin Wang', 'Chuanyang Zheng', 'Ziheng Zhang', 'Hengyuan Zhang', 'Zunhai Su', 'Kanzhi Cheng', 'Dehan Kong', 'Yian Wang', 'Hanrong Zhang', 'Jiawei Lu', 'Yifan Zhang', 'Junnan Li', 'Changyi Yang', 'Jintao Qu', 'Wenyao Gao', 'Jiaxuan Luo', 'Jiaxin Deng', 'Yuhao Chen', 'Xuesong Ye', 'Jingwen Gu', 'Yichi Zhang', 'Qun Lou', 'Shen Yan', 'Ben Athiwaratkun', 'Qiushi Sun', 'Mi Zhang', 'Ping Luo', 'Wenhu Chen', 'Ngai Wong'], 'affiliations': ['Boston University', 'MIT', 'Touchstone AI', 'UMich'], 'pdf_title_img': 'assets/pdf/title_img/2611.34232.jpg', 'data': {'categories': ['#agents', '#multimodal', '#survey', '#dataset', '#benchmark', '#agi'], 'emoji': '🧭', 'ru': {'title': 'Агенты пока не умеют уверенно работать с компьютером на всех платформах', 'desc': 'Авторы представляют OS-Omni — живой кроссплатформенный бенчмарк для оценки AI-агентов, работающих с компьютером, на Windows, Ubuntu, macOS, iOS, Android и в вебе. Задачи длинные: в среднем они требуют 67,5 шагов взаимодействия против 15 в OSWorld, и включают сценарии с сохраняемым состоянием (аккаунт, корзина, календарь). Лучший протестированный агент (Claude Opus 5.5) достигает 68,5% успеха при 77,3% у людей, причём на Linux модели превосходят людей, а на iOS и macOS отстают более чем на 25 пунктов. Результаты показывают, что текущим агентам далеко до устойчивого долгосрочного использования компьютера на разных платформах, особенно когда нужно отслеживать состояние и добиваться устойчивых изменений.'}, 'en': {'title': 'One Agent, Many Platforms—A Challenge Still Unsolved', 'desc': 'OS-Omni is a live benchmark for testing computer-using agents on long, realistic workflows across Windows, Ubuntu, macOS, iOS, Android, and the web. It includes reproducible task setups, platform-specific tools, interaction logs, and evaluators that check whether applications reach the required final state. The strongest tested agent achieved 68.5% average success, compared with 77.3% for humans, and struggled especially on iOS and macOS. The results show that agents still need better long-horizon planning and state tracking to work reliably across platforms.'}, 'zh': {'title': '从单步操作走向跨平台长流程：电脑智能体仍有差距', 'desc': '本文提出 OS-Omni，一个用于评估电脑操作智能体的在线跨平台基准，覆盖 Windows、Ubuntu、macOS、iOS、Android 和 Web。它包含长流程任务与跨设备工作流，并通过可复现的环境初始化、操作轨迹记录和最终状态评估，检验任务是否真正完成。测试中，表现最强的智能体平均成功率为 68.5%，低于人类的 77.3%；其表现因平台而异，在 Linux 上超过人类，但在 iOS 和 macOS 上明显落后。结果表明，现有智能体仍难以胜任跨平台、长时程的电脑操作，尤其难以持续跟踪状态并确保应用中的最终变更得到保存。'}}}, {'id': 'https://huggingface.co/papers/2611.34813', 'title': 'Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models', 'url': 'https://huggingface.co/papers/2611.34813', 'abstract': 'Abstract  Video generation models are increasingly evaluated as visual reasoners: given a first frame and a natural-language prompt, can the model produce the video in which the specified task is carried out? The paradigm is considered advantageous because the reasoning is native to the visual medium, unfolding directly in the frames rather than through language or code. Whether this native route is in fact the more reliable path to visual reasoning has not been tested against a symbolic alternative under the same conditions. We therefore pose the same tasks, with identical inputs, output specification and evaluator, to both media: rather than denoising pixels, a coding agent writes a program that renders the answer video, which an unmodified rule-based evaluator scores. On VBVR-Pro-Bench (Xu et al., 2026), a 500-instance suite spanning five cognitive categories with symbolic ground truth, the agent receives the same first frame and prompt as the video model, with no access to ground truth, metadata or generation models, and one attempt per instance. Three closed-model agents (Codex with gpt-6-astra, Claude Code with Fable 5.1 and Gemini CLI with Gemini 3.1 Pro) score 0.923, 0.894 and 0.893, each more than 0.22 above the strongest video model. Among 23 runnable open-weight models, the best, GLM-5, reaches 0.572, above all video models except the RL-trained one. Together, we show that for tasks whose solutions can be computed from a first frame and a prompt, program synthesis is currently a substantially more reliable route to visual reasoning than video generation. We further distinguish depictive programs, which navigate the image to recover a transferable scheme, from propositional programs, which operate on hard-coded values, revealing how visual reasoning unfolds in agent-written programs and what it implies for its nature of reasoning in general.', 'score': 59, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '07520aa193064ba2', 'authors': ['Dezhi Luo', 'Fengyuan Yu', 'Haotian Zhang', 'Zehong Zhao', 'Ran Ji', 'Siyuan An', 'Huayi Qin', 'Qingying Gao', 'Zhongang Cai', 'Lei Yang', 'Ziqi Huang', 'Ruisi Wang', 'Maijunxian Wang', 'Hokin Deng'], 'affiliations': ['Carnegie Mellon University', 'Chinese University of Hong Kong', 'Johns Hopkins University', 'Nanyang Technological University', 'University College London', 'University of California, Berkeley', 'University of California, San Diego', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2611.34813.jpg', 'data': {'categories': ['#agents', '#multimodal', '#survey', '#video', '#plp', '#reasoning', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Программа рисует рассуждение надёжнее, чем видео', 'desc': 'Статья сравнивает два подхода к визуальному рассуждению: генерацию видео (video generation models) и синтез программ, где LLM-агент пишет код, который рендерит ответ-видео. Оба подхода тестируются на одинаковых входах и оцениваются одним rule-based evaluator на бенчмарке VBVR-Pro-Bench из 500 задач. Результаты показывают, что агенты, пишущие программы, существенно превосходят лучшие video models, набирая около 0.9 против менее 0.7. Авторы также разделяют программы на depictive и propositional, что помогает понять природу визуального рассуждения в программах.'}, 'en': {'title': 'For Visual Reasoning, Code Outperforms Video', 'desc': 'This paper compares video generation with program synthesis for solving visual reasoning tasks from a first frame and a natural-language prompt. In a controlled evaluation, coding agents write programs that render answer videos, and a rule-based evaluator scores them on a 500-instance benchmark. The strongest closed-model coding agents substantially outperform the video models, while the best open-weight agent also surpasses most of them. The authors distinguish depictive programs, which extract reusable patterns from images, from propositional programs, which use fixed values, and argue that program synthesis is currently more reliable when a task can be computed from the input frame and prompt.'}, 'zh': {'title': '让程序作答：视觉推理，合成代码胜过生成视频', 'desc': '这篇论文比较了视频生成与程序合成在视觉推理任务上的表现：两种方法接收相同的首帧和自然语言提示，并由同一个规则评估器评分。实验在包含五类认知任务、共500个实例的 VBVR-Pro-Bench 上进行，程序生成智能体不能查看标准答案或元数据，每个任务只有一次尝试。三个闭源编程智能体的得分均超过0.89，比表现最强的视频模型高出0.22以上；最佳开源模型也超过了除经过强化学习训练的模型之外的所有视频模型。结果表明，对于能由首帧和提示确定答案的任务，程序合成目前比视频生成更可靠；论文还区分了用于从图像中归纳可迁移方案的描绘式程序，以及直接处理硬编码值的命题式程序。'}}}, {'id': 'https://huggingface.co/papers/2611.31619', 'title': 'What a Forecasting Leaderboard Can Establish: Resolution Reporting for Zero-Shot Time-Series Models', 'url': 'https://huggingface.co/papers/2611.31619', 'abstract': 'Abstract A tool called Vernier measures the smallest score difference a time-series forecasting leaderboard can distinguish, showing that most boards cannot separate top entries and that ranking order can change with pool composition.  Generated by deepseek-ai/DeepSeek-V4.1-Flash A foundation model for time series is pretrained once and then asked to forecast series it has never seen, so the evidence for it is its score on held-out datasets. Such datasets are scarce, and a few public leaderboards carry most comparisons, yet none of them states how small a difference its datasets can detect. We call that quantity the resolution of a board and introduce Vernier, a tool that computes it from the files a board already publishes. Vernier also reports which entries a board cannot separate from its leader and whether its order changes when unrelated parties submit. GIFT-Eval resolves 6.8 rank places, and its displayed neighbours sit 0.91 apart. The ten places of its top ten hold fewer than two resolvable steps. fev-bench, Chronos Benchmark II and TIME show the same pattern: their resolution is 3.6 to 19 times the gap between neighbours. With each of its 2,554 series as an independent source, BOOM is the one board that resolves its top ten. Below the resolution the order depends on who else submitted: across four boards, rules that rank against the pool reversed 43 top-ten pairs with neither entry rerun, in one update in seven. Boards also do not record how much history a model receives. On 70 configurations, shortening it raised the error of three of four open models, two of them by 15%. We release Vernier, which runs this report with one command on any leaderboard that publishes per-dataset scores: https://github.com/therealram18/vernier', 'score': 57, 'issue_id': 3570, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'e9bffab1dad4b6f3', 'pdf_title_img': 'assets/pdf/title_img/2611.31619.jpg', 'data': {'categories': ['#survey', '#benchmark', '#data', '#open_source'], 'emoji': '📏', 'ru': {'title': 'Лидерборд без разрешения: не все места можно честно различить', 'desc': 'Статья показывает, что публичные лидерборды для foundation model во временных рядах (например, GIFT-Eval, fev-bench, Chronos Benchmark II, TIME) не умеют различать близкие по качеству модели, так как их разрешающая способность (resolution) часто в несколько раз больше разницы между соседними местами. Авторы представляют инструмент Vernier, который вычисляет эту разрешающую способность по опубликованным результатам и показывает, какие модели статистически неотличимы от лидера. Также выявлено, что порядок в рейтинге может меняться при добавлении новых участников, а сокращение истории, подаваемой модели, часто ухудшает прогноз. Инструмент выпущен в открытом доступе для анализа любого бенчмарка с покатегорийными результатами.'}, 'en': {'title': 'Measure What Leaderboards Can Truly Distinguish', 'desc': 'This paper introduces Vernier, a tool that estimates a time-series forecasting leaderboard’s resolution: the smallest score difference its test datasets can reliably distinguish. It finds that several popular boards have too little resolution to separate nearby top models, so rankings can change when the set of submitted models changes. BOOM is an exception, resolving all positions in its top ten, while pool-based ranking rules reversed 43 top-ten pairs across four boards without rerunning the models. The study also finds that leaderboards often omit how much input history models receive, even though shortening that history can increase forecasting error.'}, 'zh': {'title': '看清排行榜的分辨率，别让名次假装精确', 'desc': '本文提出 Vernier，用于衡量时间序列预测排行榜的分辨率，也就是排行榜能区分多小的分数差异。它根据排行榜公开的逐数据集得分，判断哪些模型与领先者无法可靠区分，以及排名是否会随参赛模型集合变化。研究发现，多个常用排行榜的分辨率远低于相邻名次之间的分数差距，因此榜单名次可能显得精确，却难以支持这种精确度。作者还指出，排行榜对模型可使用的历史长度记录不足，而缩短历史长度会使多种开源模型的预测误差上升。'}}}, {'id': 'https://huggingface.co/papers/2611.34457', 'title': 'ProxyGenBench: Benchmarking Proxy-Guided Video Generation', 'url': 'https://huggingface.co/papers/2611.34457', 'abstract': 'Abstract A benchmark assesses how well video generators follow animated 3D blockouts while preserving structure, filling missing content, correcting proxy artifacts, and binding multimodal conditions to the correct entities and events.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent video generators produce realistic videos, yet controlling how scenes unfold remains challenging. Structural proxies, such as animated 3D blockouts, guide generation by specifying scene layout, motion, camera behavior, and event order. However, these coarse inputs leave details unspecified and may contain artifacts that should not be reproduced. Successful proxy-guided generation must therefore Preserve intended structure, Complete missing content and correct proxy artifacts, and Bind text, image, and audio conditions to the right entities and events. We introduce ProxyGenBench to study these interacting requirements, with 312 evaluation cases from 60 scenes across three scene tasks and controlled variations in proxy fidelity, text detail, and multimodal inputs. We evaluate five video generators using verified, case-specific checklists. Experiments show that proxies improve spatiotemporal control, but greater proxy detail can coincide with poorer completion, while strong structural adherence does not ensure correct binding.', 'score': 36, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '9eb002014d7be45b', 'authors': ['Zhenchen Tang', 'Haolin Lu', 'Songlin Yang', 'Xiaotong Zhao', 'Ran Zhang', 'Bo Peng', 'Shuai Li', 'Haotian Fan', 'Haobin Zhong', 'Yanni Zhang', 'Songlian Li', 'Ning Zhang', 'Xun Gao', 'Alan Zhao', 'Jing Dong'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'Tencent', 'The Hong Kong University of Science and Technology', 'University of California, San Diego', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2611.34457.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#video'], 'emoji': '🎬', 'ru': {'title': 'Точная структура видео не гарантирует правильный смысл', 'desc': 'В статье представлен ProxyGenBench, бенчмарк для оценки видеогенераторов, которые создают видео по анимированным 3D-блокаутам. Авторы проверяют три требования: сохранение заданной структуры, дозаполнение недостающего контента с исправлением артефактов прокси и корректную привязку text, image и audio условий к нужным сущностям и событиям. Бенчмарк включает 312 кейсов из 60 сцен и оценивает пять моделей с помощью проверяемых чек-листов. Результаты показывают, что прокси улучшают пространственно-временной контроль, но большая детализация прокси может ухудшать дозаполнение, а хорошее следование структуре не гарантирует правильной привязки условий.'}, 'en': {'title': 'Guide the structure, complete the scene, bind every condition', 'desc': 'ProxyGenBench evaluates whether video generators can use animated 3D blockouts to control scene layout, motion, camera behavior, and event order. It tests three capabilities: preserving intended structure, completing unspecified content and correcting proxy artifacts, and binding text, image, and audio conditions to the correct entities and events. The benchmark contains 312 cases from 60 scenes and evaluates five generators with case-specific checklists. Results show that proxies improve spatiotemporal control, but detailed proxies may hinder content completion, and structural adherence alone does not guarantee correct multimodal binding.'}, 'zh': {'title': '结构要跟准，细节要补全，条件也要绑对', 'desc': '这篇论文提出 ProxyGenBench，用来评估视频生成模型能否根据动画 3D 场景草图生成视频。评测重点包括保留场景结构、补全缺失内容并修正草图中的错误，以及把文本、图像和音频条件对应到正确的实体与事件。该基准包含来自 60 个场景的 312 个测试案例，并通过针对每个案例制定的核对清单，评估了五种视频生成模型。实验发现，场景草图能增强对空间和时间变化的控制，但草图越详细，模型有时越难补全内容；结构跟随得好，也不代表多模态条件绑定正确。'}}}, {'id': 'https://huggingface.co/papers/2611.34290', 'title': 'StateWeaver: Multi-Agent Coordination of Story-State Transitions for Long-Horizon Video Generation', 'url': 'https://huggingface.co/papers/2611.34290', 'abstract': 'Abstract StateWeaver improves long-video generation by preserving cross-shot consistency and updating visual references through active state tracking and hierarchical collaboration.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Modern video foundation models generate high-quality short clips, but preserving long-video consistency and correctly depicting event-driven state changes remain challenging. Existing agentic workflows face these challenges because continual planning and repair accumulate context, while reference updates remain limited. We introduce StateWeaver, which combines Active States and Hierarchical Collaboration to connect review-driven visual reference updates with cross-shot state inheritance. Active States translate state discrepancies identified during review into concrete visual asset requirements that guide reference construction, validation, and regeneration, preserving identity and already-correct content while repairing target attributes. Confirmed generation results are linked to the corresponding asset states, story time, and reference versions for verification and reuse by subsequent shots. Hierarchical Collaboration isolates execution contexts by task, clip, and repair round, and uses hierarchical memory to organize this process across multiple sets. Across multiple benchmarks, StateWeaver outperforms existing methods and produces long videos with sustained cross-shot consistency under predefined and autonomously planned storyboards.', 'score': 27, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'd1469a33f70908c0', 'authors': ['Modi Jin', 'Xuying Zhang', 'Yijing Guo', 'Haoran Li', 'Yanwen Ma', 'Jing Wang', 'Chenyu Ge', 'Ming-Ming Cheng', 'Haoyang Huang'], 'affiliations': ['Beihang University', 'Joy Future Academy, JD', 'Nankai University', 'ShanghaiTech University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34290.jpg', 'data': {'categories': ['#story_generation', '#agents', '#video'], 'emoji': '🎬', 'ru': {'title': 'Длинное видео без потери согласованности: состояние персонажей и сцен сохраняется от кадра к кадру', 'desc': 'Статья представляет StateWeaver — агентную систему для генерации длинных видео, которая сохраняет согласованность между кадрами и корректно отображает изменения состояний, вызванные событиями. Ключевой механизм Active States переводит расхождения состояний, найденные на этапе ревью, в конкретные требования к визуальным ассетам и обновляет референсы через построение, валидацию и регенерацию. Иерархическая коллаборация (Hierarchical Collaboration) изолирует контексты выполнения по задачам, клипам и раундам исправлений, а иерархическая память организует этот процесс для нескольких наборов. Эксперименты на нескольких бенчмарках показывают, что StateWeaver превосходит существующие методы и создаёт длинные видео с устойчивой согласованностью между шотами.'}, 'en': {'title': 'Track visual states, weave consistent long videos', 'desc': 'StateWeaver addresses the challenge of keeping characters, objects, and events consistent across shots in long videos. Its Active States method turns inconsistencies found during review into specific visual references, then validates or regenerates those references while preserving content that is already correct. It records confirmed results alongside asset states, story time, and reference versions, so later shots can reuse the right visual information. Hierarchical Collaboration organizes planning and repair into separate task, clip, and repair contexts, and the paper reports stronger results than existing methods across multiple benchmarks.'}, 'zh': {'title': '让每个镜头承接前文状态，织就连贯长视频', 'desc': 'StateWeaver是一种用于长视频生成的方法，目标是保持不同镜头之间的一致性，并准确呈现事件带来的状态变化。它通过“主动状态”机制，将审查时发现的差异转化为具体的视觉素材需求，再对参考素材进行构建、验证和修复，同时保留角色身份及已正确的内容。系统还会记录已确认的生成结果、对应的素材状态、故事时间和参考版本，供后续镜头核验和复用。它通过分层协作隔离不同任务、片段和修复轮次的上下文，并用分层记忆组织流程；实验表明，该方法在多个基准上优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2611.34693', 'title': 'ShowNow: Fine-Grained Speculative Streaming for Responsive World Models', 'url': 'https://huggingface.co/papers/2611.34693', 'abstract': 'Abstract A fine-grained speculative streaming framework prepares action-conditioned video futures during playback to reduce input-to-display latency in interactive world models while sustaining real-time generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Interactive world models must generate video continuously while responding promptly to user actions. Real-time throughput alone leaves input latency unresolved: coarse generation blocks delay action updates, and generation after input adds work to the response path. We introduce ShowNow, a fine-grained speculative streaming framework that uses computation available during playback to prepare action-conditioned futures before input arrives. Single-latent commitment enables frequent decisions, while configurable preparation covers one to eight actions. We construct a matched multi-future dataset to train alternative continuations from a common state; shared-history tree execution and fused commitment make their preparation efficient. On a single H100, our 5B model sustains 480p generation at 16 fps with eight prepared futures. In ViZDoom, the complete ShowNow deployment reduces median input-to-display latency from 620 to 208 ms relative to the native-block SolarWM-FT deployment. Matched-policy experiments reduce restart empty ticks from 1.56% to 0.09% (94%) and improve on-time responses to action changes. These results establish complementary roles for fine-grained commitment and advance preparation, with measured trade-offs in visual fidelity and long-horizon consistency. ShowNow turns playback-time computation into responsive visual interaction. Project: https://github.com/showlab/ShowNow.', 'score': 19, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '0e429eb711d909cd', 'authors': ['Yiren Song', 'Guian Fang', 'Mike Zheng Shou'], 'affiliations': ['Show Lab, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.34693.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#video', '#inference', '#games', '#dataset'], 'emoji': '⚡', 'ru': {'title': 'Готовим будущее кадра заранее — отклик без задержки', 'desc': 'Статья представляет ShowNow — фреймворк спекулятивной потоковой генерации видео для интерактивных world models, который снижает задержку между действием пользователя и отображением кадра. Вместо ожидания ввода система заранее готовит несколько action-conditioned продолжений видео во время воспроизведения, используя для этого общее историческое состояние и tree-execution. Модель 5B на одном H100 генерирует 480p при 16 fps с восемью подготовленными вариантами будущего, а в ViZDoom медианная задержка падает с 620 до 208 мс. Эксперименты также показывают сокращение пустых тиков при перезапуске с 1.56% до 0.09%, при небольшом компромиссе по визуальному качеству и долгосрочной согласованности.'}, 'en': {'title': 'Prepare the future while the world plays', 'desc': 'ShowNow is a speculative streaming framework for interactive world models that prepares videos for several possible user actions while the current video is playing. It commits to generated video in small steps and efficiently shares computation across alternative futures, reducing the delay between an input and its display. On a single H100, its 5B model generates 480p video at 16 frames per second with eight futures prepared, and its deployment lowers median input-to-display latency from 620 to 208 milliseconds. The results also show fewer restart delays and more timely responses to changing actions, with trade-offs in visual fidelity and long-term consistency.'}, 'zh': {'title': '把播放时间变成准备时间，让交互响应更快', 'desc': '本文提出 ShowNow，一种用于交互式世界模型的细粒度推测式流式框架，利用视频播放期间的计算提前准备用户可能采取动作后的画面。模型每生成一个潜在表示就可以进行一次决策，并可提前准备一到八种动作对应的未来，从而减少输入动作后的等待。作者构建了包含同一状态下多种可能后续的视频数据集，并通过共享历史的树状执行和融合提交提高准备效率。在单张 H100 上，5B 模型可按每秒 16 帧生成 480p 视频；在 ViZDoom 中，输入到显示的中位延迟从 620 毫秒降至 208 毫秒，同时实验显示响应速度提升，但画面保真度和长期一致性存在权衡。'}}}, {'id': 'https://huggingface.co/papers/2611.34852', 'title': 'DRBench Pro: A Knowledge-Centric Benchmark for Professional Deep Research Agents', 'url': 'https://huggingface.co/papers/2611.34852', 'abstract': 'Abstract  Deep research agents gather information from multiple sources and synthesize it into reports on complex, open-ended questions. Existing benchmarks assess report quality along several dimensions, but lack a dedicated knowledge-centric evaluation of which research directions a report covers and how deeply it explores them. We introduce DRBench Pro, a benchmark that makes structured knowledge coverage the primary evaluation target. Our automated pipeline builds local knowledge trees from Wikipedia and uses sampled subgraphs to generate research queries and evidence-grounded rubrics. Each rubric corresponds to a relation in the tree, preserving the structure of the knowledge being evaluated. Agents receive only the research query. This structure allows us to measure breadth across major research directions and depth along related knowledge chains, with their geometric mean giving overall coverage. The benchmark includes 144 cases across 24 domains and 44,102 rubrics. Evaluating 16 deep research agents reveals different strengths in breadth and depth, with the best-performing agent reaching 57.04% overall coverage. Rubric judgments agree closely with human annotations, and agent rankings remain stable across the tested metric configurations.', 'score': 17, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '2602e89066a03ea7', 'authors': ['Han Huang', 'Yuchen Yan', 'Xingyu Wu', 'Yijun Li', 'Chao Deng', 'Jie Liu', 'Jin Ma', 'Yongliang Shen'], 'affiliations': ['Tencent', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34852.jpg', 'data': {'categories': ['#survey', '#agents', '#dataset', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Оцениваем не только отчёт, но и полноту знаний агента', 'desc': 'Статья представляет DRBench Pro — бенчмарк для оценки deep research agents, то есть AI-агентов, которые собирают информацию из нескольких источников и синтезируют отчёты по сложным открытым вопросам. Главная особенность в том, что оценка строится на структурированном покрытии знаний: локальные knowledge trees строятся автоматически по Wikipedia, а из выбранных подграфов генерируются запросы и rubrics, привязанные к отношениям в дереве. Метрика покрытия складывается из breadth (охват основных направлений исследования) и depth (глубина по связанным цепочкам знаний), объединяемых через геометрическое среднее. Бенчмарк включает 144 кейса в 24 доменах и 44 102 rubrics; лучший из 16 протестированных агентов достигает 57.04% покрытия, при этом оценки rubrics хорошо согласуются с человеческой разметкой.'}, 'en': {'title': 'Measure Research by What It Covers—and How Deeply', 'desc': 'DRBench Pro evaluates whether deep research agents cover important knowledge areas and explore them in sufficient depth. It builds structured knowledge trees from Wikipedia and uses sampled subgraphs to create research queries and evidence-grounded rubrics linked to relations in those trees. The benchmark measures breadth across major research directions and depth along related knowledge chains, combining them with their geometric mean as an overall coverage score. Across 144 cases in 24 domains, evaluations of 16 agents show varied strengths, with the top agent achieving 57.04% coverage and rubric judgments closely matching human assessments.'}, 'zh': {'title': '用知识树衡量研究报告的广度与深度', 'desc': '深度研究智能体会从多个来源搜集信息，并综合成报告，但现有评测较少衡量报告覆盖了哪些知识方向，以及探索得有多深入。本文提出 DRBench Pro，将结构化知识覆盖作为主要评测目标：系统从维基百科构建知识树，再据此生成研究问题和有证据支撑的评分标准。基准分别衡量报告覆盖主要研究方向的广度，以及沿相关知识链展开的深度，并用两者的几何平均计算总体覆盖率。基准包含 24 个领域的 144 个案例和 44,102 条评分标准；对 16 个智能体的评测显示，表现最佳者的总体覆盖率为 57.04%，且自动评分与人工标注高度一致。'}}}, {'id': 'https://huggingface.co/papers/2611.32238', 'title': 'Boundary-Aware Policy Learning for Agent-Orchestrated Robot Manipulation', 'url': 'https://huggingface.co/papers/2611.32238', 'abstract': "Abstract A method that explicitly shapes and expands the handoff boundary of visuomotor policies improves coordination between multimodal agents and robot policies, yielding higher success and lower cost.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Agent-orchestrated robot systems combine the general reasoning capability of multimodal agents with the precise physical control of learned visuomotor policies. Yet such systems often fail at the moment of handoff: a policy is reliable only from a limited set of start states, while the agent may invoke it outside this region. We call this region the policy's handoff boundary. Existing whole-task policies typically have handoff boundaries that are narrow and difficult for an agent to characterize, making reliable coordination challenging. We propose Boundary-Aware Policy Learning, which explicitly shapes and then expands the handoff boundary of a visuomotor policy. First, Boundary-Explicit Training fine-tunes the policy on contact segments with diverse start poses, yielding a wide and well-defined boundary that can be communicated to the agent through a simple handoff protocol. Second, Boundary-Expanding Self-Improvement retrains the policy on curated successful system rollouts, extending the boundary toward earlier stages of each task and allowing the agent to hand over sooner with fewer language-model calls. Across RoboTwin 2.0 and RoboDojo, our system outperforms the strongest baseline by over 26 percentage points, reaching 98.4% success in randomized RoboTwin 2.0 scenes, while further reducing its API cost and execution time by 41.3% and 37.5%, respectively. These results suggest that the key to robust agent-policy orchestration lies not only in improving either component individually, but also in explicitly shaping the boundary between them.", 'score': 7, 'issue_id': 3570, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '848e92593576a255', 'authors': ['Kaipeng Fang', 'Yuhao Wang', 'Ji Zhang', 'Yunsong Zhou', 'Jingkuan Song', 'Lianli Gao'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Tongji University', 'University of Electronic Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.32238.jpg', 'data': {'categories': ['#games', '#robotics', '#agents', '#training'], 'emoji': '🤖', 'ru': {'title': 'Граница передачи решает: явно формируем стык между агентом и политикой', 'desc': 'Статья описывает агентно-управляемые роботические системы, где мультимодальный LLM-агент передаёт управление визуомоторной политике в момент handoff, и часто это приводит к сбоям, так как политика надёжна лишь из узкого набора стартовых состояний. Авторы вводят Boundary-Aware Policy Learning, который сначала явно обучает политику на контактных сегментах с разнообразными стартовыми позами (Boundary-Explicit Training), а затем расширяет границу через self-improvement на отобранных успешных траекториях (Boundary-Expanding Self-Improvement). Метод позволяет агенту передавать управление раньше и с меньшим числом вызовов LLM/API. На RoboTwin 2.0 и RoboDojo система превосходит лучший базовый метод более чем на 26 п.п., достигая 98.4% успеха, при снижении стоимости API на 41.3% и времени выполнения на 37.5%.'}, 'en': {'title': 'Shape the handoff boundary for smoother robot teamwork', 'desc': 'The paper introduces Boundary-Aware Policy Learning to make handoffs between multimodal agents and visuomotor policies more reliable. Boundary-Explicit Training teaches a policy to succeed from a wider range of starting poses, making its handoff boundary clearer to the agent. Boundary-Expanding Self-Improvement then uses successful system rollouts to extend that boundary to earlier task stages, so the agent can hand over sooner. Tests on RoboTwin 2.0 and RoboDojo show higher success rates, lower API costs, and shorter execution times than the strongest baseline.'}, 'zh': {'title': '明确并扩展交接边界，让智能体与机器人策略协作更可靠', 'desc': '这篇论文研究多模态智能体把任务交给视觉运动策略时，如何减少交接失败。作者提出边界感知策略学习，先用不同起始姿态的接触片段微调策略，使其可靠工作的起始状态范围更宽、更清晰。随后，方法从成功的系统执行轨迹中筛选数据并重新训练，进一步把策略可接手的范围扩展到任务更早阶段，从而减少智能体调用次数。实验显示，该方法在 RoboTwin 2.0 和 RoboDojo 上提升了任务成功率，并降低 API 成本与执行时间。'}}}, {'id': 'https://huggingface.co/papers/2611.30494', 'title': 'Revisiting LLMs as Context Engineers', 'url': 'https://huggingface.co/papers/2611.30494', 'abstract': 'Abstract  As large language models (LLMs) are used in more and more new tasks, context engineering becomes a fundamental method to efficiently steer LLMs by constructing instruction prompts or metadata without intensive training. A growing number of LLM context engineering (LCE) approaches automate the task by casting the LLM itself as the engineer that draws generalizable instructions or experiences from offline trials as context. Although these methods resemble how humans learn from experiences, it remains unclear when and how LLMs can engineer effective context from data. To answer the question, we first establish a benchmark composed of datasets with different reasoning patterns. We compared different LCE methods with different LLM families in 8B size, showing that there is no single winner for all tasks, even compared with simple baselines like chain-of-thought. Even when scaling model capabilities via more parameters or generation iterations, LCEs do not consistently boost existing performance. Across all datasets and models, the performance gains of LCEs are negatively correlated (r=-0.5, ple 0.05) with the diversity of the failure modes of reasoning trajectories. Investigating how LCEs work, we find that (1) the improvement in instruction adherence can explain some success of LCEs; (2) one major bottleneck is whether LLMs can extract effective experiences out of natively diverse failures. Through this study, we uncover the limited capabilities of LCEs in abstracting principled contexts from diverse failure modes and understand how LCEs work, providing guidelines for future work.', 'score': 4, 'issue_id': 3571, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'd7c74b050228a615', 'authors': ['Junrui Zhang', 'Zeyu Xu', 'Runchuan Zhu', 'Jie Peng', 'Long Zhang', 'Zixin Ding', 'Jiaxin Lin', 'Kai Wang', 'Jianmin Ji', 'Junyuan Hong'], 'affiliations': ['National University of Singapore', 'University of Chicago', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.30494.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#training', '#reasoning', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Контекст от LLM работает не всегда: разнообразие ошибок ломает самообучение промптов', 'desc': 'В статье исследуется LLM context engineering (LCE): подход, при котором сама языковая модель (LLM) формирует инструкции или контекст на основе офлайн-экспериментов, без дообучения. Авторы создали бенчмарк из датасетов с разными паттернами рассуждений и сравнили LCE-методы на моделях семейств LLM размером 8B, включая простой baseline chain-of-thought. Оказалось, что ни один метод не побеждает во всех задачах, а увеличение числа параметров или итераций генерации не даёт стабильного прироста, причём эффект LCE отрицательно коррелирует с разнообразием ошибок в траекториях рассуждений. Авторы выделяют два ключевых фактора: улучшение следования инструкциям и способность LLM извлекать полезный опыт из разнородных ошибок.'}, 'en': {'title': 'Learning from failures only works when the lessons are clear', 'desc': 'This paper studies LLM context engineering (LCE), where language models create instructions or experiences from previous trials to guide future responses. The authors benchmark several LCE methods and 8B models across tasks with different reasoning patterns, finding that no method consistently outperforms alternatives such as chain-of-thought prompting. LCE gains are weaker when reasoning failures are more diverse, and scaling model size or the number of generations does not reliably improve results. The findings suggest that better instruction following explains some successes, while difficulty extracting useful lessons from varied failures remains a key limitation.'}, 'zh': {'title': '从失败中提炼经验，仍是上下文工程的难题', 'desc': '本文研究如何利用离线试验中的经验，自动构造提示词或元数据来引导大语言模型，这类方法称为大语言模型上下文工程（LCE）。作者建立了涵盖不同推理模式的基准，并比较多种 LCE 方法与 8B 规模模型，发现没有一种方法能在所有任务上胜出，扩大模型规模或增加生成轮次也不一定带来提升。LCE 的效果与推理失败模式的多样性呈负相关，且改进指令遵循能力可以解释部分成功。研究指出，关键瓶颈在于模型难以从多样化的失败中提炼出有效经验，因而难以归纳出可靠、通用的上下文。'}}}, {'id': 'https://huggingface.co/papers/2611.30483', 'title': 'When an AI agent makes a mistake in a database, what decides the damage?', 'url': 'https://huggingface.co/papers/2611.30483', 'abstract': "Abstract  AI agents now run statements against production databases, and several of the incidents that followed deleted production data, which came back only through backups or the provider's help. We ask what decides the damage when such an agent makes a mistake: the model, a guard layer in front of the database, or the database engine itself. The study has two preregistered layers. In Layer A, a frozen library of 22 canonical mistakes is applied by script, with no model involved, to four relational engines under five permission arms and two recovery arms, followed by an engine-native recovery drill (792 cells; 874 drill runs including 10-minute repeats). In Layer B, a minimal tool-calling agent driven by six small open-weight models (4B to 12B parameters, plus one 35B mixture-of-experts model with about 3B active, served locally) works on tasks that contain hazards across nine engines: PostgreSQL, MySQL, SQLite, ClickHouse, Apache Cassandra, MongoDB, Valkey, Apache Kafka and OpenSearch (9,468 trials). A secondary run added MariaDB, Redis and Elasticsearch (2,916 trials); each behaved like its closest core engine. Out of the box, the engines differ less in what a mistake destroys than in what they let you undo. Three of the seven preregistered hypotheses met their decision rule: H2 (for one of nine damage classes) and H3 largely by construction of the arms, and H4 only under its original measure. Four did not; one of them (H5) was uninformative, because in its task the agents never found the credential. The post-hoc analyses (S1-S13) are exploratory and uncorrected for multiple comparisons; on PostgreSQL, MySQL, OpenSearch and ClickHouse the preregistered outcome and original-row loss disagree about G1. We report all of them, with every deviation from the preregistration and its timing.", 'score': 4, 'issue_id': 3570, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '114ae772d6a0d84c', 'authors': ['Abdullah Kaya', 'Cevheri Bozoglan', 'Yusuf Gundogdu'], 'affiliations': ['LibreDB Studio project'], 'pdf_title_img': 'assets/pdf/title_img/2611.30483.jpg', 'data': {'categories': ['#agents', '#survey', '#security', '#inference', '#data', '#benchmark'], 'emoji': '🗄️', 'ru': {'title': 'Не модель, а движок решает, можно ли откатить ошибку агента', 'desc': 'Авторы изучают, что определяет масштаб ущерба, когда AI-агент, выполняющий команды в production-базах данных, допускает ошибку: сама модель, защитный слой перед базой или движок базы данных. Исследование состоит из двух этапов: в первом фиксированный набор из 22 типовых ошибок применяется скриптом к четырём реляционным СУБД без участия LLM, а во втором маленькие open-weight модели работают как tool-calling агенты с задачами, содержащими опасные ситуации, в девяти СУБД и системах. Результаты показывают, что по умолчанию движки различаются не столько тем, что именно они способны уничтожить, сколько тем, что из их действий можно откатить. Большинство предзарегистрированных гипотез не подтвердилось, а пост-хок анализы носят исследовательский характер и не скорректированы на множественные сравнения.'}, 'en': {'title': 'When AI Makes a Database Mistake, Recovery Matters Most', 'desc': 'This study tests what affects the damage when an AI agent makes a mistake while using a database: the model, a protective guard layer, or the database engine. In Layer A, scripts apply 22 predefined mistakes to four relational database engines under different permissions and recovery settings, without using a model. In Layer B, six locally run language models use tools to complete hazardous tasks across nine database and data-service engines, with extra tests on three related engines. The results suggest engines differ more in how easily mistakes can be undone than in how much damage they cause, while several preregistered hypotheses were not supported or could not be assessed clearly.'}, 'zh': {'title': '减少误操作损失，关键不只在模型，更在数据库能否恢复', 'desc': '本文研究 AI 智能体误操作数据库时，损失大小主要由模型、数据库前置防护，还是数据库引擎决定。研究分为两层：第一层用固定脚本在多个关系型数据库中测试典型错误、权限设置和恢复方式；第二层则让不同规模的开源模型操作九种数据库，并观察错误后果。结果显示，各数据库在错误会造成什么破坏方面差异较小，但在能否以及如何恢复方面差异更明显；预注册假设中只有部分得到支持。作者也指出部分分析属于探索性结果，并公开报告与预注册方案的偏差及其时间。'}}}, {'id': 'https://huggingface.co/papers/2611.28849', 'title': 'Guarding with Judgment: Learning to Intervene for Multimodal Safety', 'url': 'https://huggingface.co/papers/2611.28849', 'abstract': "Abstract  When visual context makes an ordinary request unsafe to answer as asked, a blanket refusal may leave the user's need unresolved. Choosing how to help requires distinguishing an established hazard from a condition that still needs verification, a distinction that binary safety labels leave unspecified. We formulate this decision through four actions: allow, warn, review, and refuse. To ground these decisions in verifiable evidence, we build a corpus of 20,126 training audits and the JudiBench benchmark, connecting each action to diagnostic judgments, source evidence, and controlled context changes. Our guard, JudiAct, separately states what the source establishes, what condition governs the help, and how the rules apply. It then checks these three brief review items against the original inputs to predict diagnostic labels and a handling action. Supervised training learns individual judgments while comparing label assignments across related cases. A second stage swaps one review item at a time, using the resulting audit feedback to refine review generation. On JudiBench, JudiAct improves request and answer Macro-F1 by more than 28 percentage points over its 4B backbone. Across nine public benchmarks, it outperforms state-of-the-art guards on the mean delivered-answer score in both pre-generation and post-generation settings, cutting MM-SafetyBench attack success from 40.78% to 25.30%.", 'score': 2, 'issue_id': 3570, 'pub_date': '2026-11-21', 'pub_date_card': {'ru': '21 ноября', 'en': 'November 21', 'zh': '11月21日'}, 'hash': '690ad26e4f30f041', 'authors': ['Jipei He', 'Cheng Cheng', 'Liuguo Wang', 'Zihan Wen', 'Changlin Yu', 'Wentao Song', 'Suyun Zhao'], 'affiliations': ['Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.28849.jpg', 'data': {'categories': ['#synthetic', '#training', '#hallucinations', '#multimodal', '#ethics', '#reasoning', '#interpretability', '#alignment', '#data', '#security', '#dataset', '#benchmark'], 'emoji': '⚖️', 'ru': {'title': 'Не просто запрет: помогать безопасно, проверяя факты', 'desc': 'Статья предлагает замену бинарной модели безопасности (разрешить или отказать) на четыре действия: разрешить, предупредить, проверить и отказать, для запросов с визуальным контекстом. Авторы создали корпус из 20 126 аудитов обучения и бенчмарк JudiBench, связывающий каждое действие с диагностическими суждениями и доказательствами из исходных данных. Их LLM-гард JudiAct сначала формулирует три проверяемых пункта (что установлено источником, какое условие определяет помощь, как применяются правила), а затем предсказывает метки и действие. Вторая стадия, основанная на контрольных заменах одного пункта за раз, уточняет генерацию обоснований и даёт прирост Macro-F1 более чем на 28 п.п. относительно базовой 4B-модели.'}, 'en': {'title': 'Beyond Refusal: Match Safety Decisions to the Evidence', 'desc': 'The paper presents JudiAct, a multimodal safety guard that decides whether to allow, warn, review, or refuse a request. It separates evidence about the source, the condition that governs assistance, and how safety rules apply, then predicts diagnostic labels and a handling action. Training uses supervised judgments across related cases, followed by a refinement stage that changes one review item at a time and uses audit feedback. JudiAct improves Macro-F1 on JudiBench and achieves stronger delivered-answer scores across nine benchmarks, while reducing attack success on MM-SafetyBench.'}, 'zh': {'title': '不止允许或拒绝：让视觉安全判断有证据、有层次', 'desc': '论文提出 JudiAct，用于根据视觉上下文判断请求应当如何处理，而不是只在允许和拒绝之间二选一。它将处理方式分为允许、警告、复核和拒绝，并构建包含 20,126 条训练审查记录的语料库及 JudiBench 基准。模型分别说明来源证据、适用条件和规则如何应用，再对照原始输入预测诊断标签与处理方式；训练时结合监督学习、相关案例间的标签比较，以及逐项替换审查内容并利用反馈进行优化。实验显示，JudiAct 在 JudiBench 上的请求与回答 Macro-F1 比其 4B 参数骨干模型高出 28 个百分点以上，并在九个公开基准上提升平均交付答案得分，同时降低 MM-SafetyBench 的攻击成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.34782', 'title': 'Generation as Reverse Encoding', 'url': 'https://huggingface.co/papers/2611.34782', 'abstract': 'Abstract A generative framework reuses a frozen encoder’s intermediate representations as staged targets and shares a DiT backbone to reduce training and sampling cost while preserving image quality.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Pretrained visual representations accelerate generative learning by abstracting away appearance and spatial detail. Yet the same abstraction makes the return to pixels far harder, shifting much of the burden onto a larger decoder. We ask why the representation-to-pixel path should be learned independently when the encoder already provides a learned pixel-to-semantics path (the semantic encoding path). We introduce RevFlow, based on the principle of generation as reverse encoding. RevFlow uses intermediate representations of a frozen encoder as successive generative targets, first generating deep semantic representations, then shallow representations that retain appearance and spatial detail, before decoding to pixels. To learn these transitions without training a separate generator for each stage, we develop HyC-DiT, a unified generative model with a standard DiT backbone shared across stages and stage-specific condition injection. We further show that native matching in semantic representation space enables few-step generation. RevFlow accelerates both learning and sampling. On ImageNet 256 times 256, RevFlow reaches 1.96 FID at 690M and 1.74 FID at 1.55B after only 5 training epochs. It also achieves 30.25 dB reconstruction PSNR with an 89M decoder. After a short native-matching adaptation phase, RevFlow-XL achieves 2.85 FID using a single sampling step in each stage. Our code repository is at https://github.com/ChengShiest/RevFlow', 'score': 2, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '8112f1f19aa0c607', 'authors': ['Cheng Shi', 'Sibei Yang', 'Hanzhong Guo', 'Yipeng Qin', 'Pietro Lio', 'Yizhou Yu'], 'affiliations': ['Cardiff University', 'Sun Yat-sen University', 'University of Cambridge', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2611.34782.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#diffusion', '#inference', '#cv'], 'emoji': '🔄', 'ru': {'title': 'Генерация как обратное кодирование: быстрее обучаем и быстрее генерируем', 'desc': 'Статья представляет RevFlow — генеративную модель, которая рассматривает генерацию как обратное кодирование: промежуточные представления замороженного энкодера используются как последовательные цели, сначала глубокие семантические, затем поверхностные с деталями внешнего вида. Для всех стадий применяется единый DiT-бэкбон с условной инъекцией, специфичной для каждой стадии (HyC-DiT), что снижает стоимость обучения и сэмплирования. Нативное согласование в пространстве семантических представлений позволяет генерировать изображения за несколько шагов. На ImageNet 256×256 метод достигает FID 1.74 после 5 эпох обучения и PSNR 30.25 дБ при декодере в 89M параметров.'}, 'en': {'title': 'Generate images by reversing the encoder’s path', 'desc': 'RevFlow treats image generation as reverse encoding: it generates a frozen encoder’s representations in sequence, moving from deep semantic features to shallow features that preserve appearance and spatial detail, then decodes them into pixels. Its HyC-DiT model shares one diffusion transformer (DiT) backbone across stages, using stage-specific conditioning instead of training a separate generator for each stage. Matching targets in the encoder’s native representation space supports few-step sampling and reduces training and generation costs while maintaining image quality. On ImageNet at 256×256, it reports FID scores of 1.96 and 1.74 after five training epochs at two model sizes, and a variant reaches 2.85 FID with one sampling step per stage.'}, 'zh': {'title': '沿着编码之路反向生成，让图像生成更快更省', 'desc': '这篇论文提出 RevFlow，把图像生成看作对视觉编码过程的反向学习。它使用冻结编码器的中间表示作为分阶段生成目标：先生成语义较深的表示，再逐步生成保留外观和空间细节的浅层表示，最后解码为像素。为避免每个阶段单独训练生成器，作者设计了 HyC-DiT，在各阶段共享同一个 DiT 主干，并注入不同的阶段条件。实验表明，RevFlow 能以较少训练和采样步骤生成高质量图像，且仅用单步采样也取得了较好的 FID。'}}}, {'id': 'https://huggingface.co/papers/2611.34719', 'title': 'Reading, Not Adapting: Unlocking Frozen Visual Knowledge for AI-Generated Image Detection', 'url': 'https://huggingface.co/papers/2611.34719', 'abstract': 'Abstract A frozen vision foundation model can be read out through staged cross-view attention and learnable fusion queries to generalize detection across unseen image generators with very few trainable parameters.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Generalization to unseen image generators has driven efforts to adapt pretrained visual representations for detection. Yet recent findings show that vision foundation models already encode transferable detection knowledge, while further adaptation can impair generalization. This motivates a shift from backbone adaptation to knowledge readout. Conventional linear probing offers a direct way to read this knowledge but is limited to final-layer RGB features. Multi-cue detectors broaden the evidence base, but their designs introduce other tradeoffs: adaptation may compromise pretrained transferability, heterogeneous encoders complicate feature integration, and late fusion precludes intermediate cross-view interaction. To overcome these limitations, we propose ReMoT, a Mixture-of-Transformers-inspired framework that reads complementary knowledge from spatially aligned RGB and wavelet views within a fully frozen visual foundation. ReMoT employs staged joint attention to enable controlled local and global cross-view interaction, while learnable fusion queries progressively read complementary evidence across Transformer depth without writeback. ReMoT achieves 91.2% average accuracy across eight benchmark groups with 3,074 trainable parameters, attaining the highest overall average among the evaluated methods. These results support structured knowledge readout as a promising alternative to backbone adaptation. Code is available at https://github.com/yunncheng/ReMoT.', 'score': 2, 'issue_id': 3570, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'f8d888edcfef3717', 'authors': ['Yuncheng Guo', 'Ying Dong', 'Xiaodong Gu'], 'affiliations': ['Department of Electronic Engineering, Fudan University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34719.jpg', 'data': {'categories': ['#architecture', '#training', '#interpretability', '#security', '#benchmark', '#cv'], 'emoji': '🔍', 'ru': {'title': 'Читать знания замороженной модели, а не переобучать её', 'desc': 'В статье рассматривается задача обнаружения синтетических изображений, созданных неизвестными генеративными моделями, где важна обобщающая способность детектора. Авторы показывают, что замороженная визуальная foundation model уже содержит переносимые знания для детекции, поэтому дообучение бэкбона может ухудшать результат, и предлагают читать эти знания вместо адаптации модели. Метод ReMoT использует поэтапное совместное внимание (joint attention) между пространственно выровненными RGB- и вейвлет-представлениями и обучаемые fusion queries, которые извлекают дополнительные признаки с разных уровней Transformer без обратной записи. При всего 3 074 обучаемых параметрах модель достигает средней точности 91,2% на восьми группах бенчмарков и показывает лучший общий результат среди сравниваемых методов.'}, 'en': {'title': 'Read More from a Frozen Vision Model', 'desc': 'ReMoT detects AI-generated images by reading knowledge already stored in a pretrained vision foundation model, while keeping its backbone frozen. It combines spatially aligned RGB and wavelet features using staged joint attention, allowing information from the two views to interact at local and global levels. Learnable fusion queries gather complementary evidence across Transformer layers without changing the backbone’s features. With only 3,074 trainable parameters, ReMoT achieves 91.2% average accuracy across eight benchmark groups, including tests on unseen image generators.'}, 'zh': {'title': '冻结骨干，跨视图读取生成图像检测知识', 'desc': '本文提出 ReMoT，用于识别由未见过的图像生成器生成的图像。它保持视觉基础模型的参数冻结，并联合读取空间对齐的 RGB 与小波视图中的特征知识。分阶段联合注意力让不同视图在局部和全局层面交互，可学习的融合查询则逐层提取互补信息，但不修改原模型。ReMoT 仅训练 3,074 个参数，在八组基准上的平均准确率达到 91.2%，表明结构化知识读取可以作为调整骨干网络的替代方案。'}}}, {'id': 'https://huggingface.co/papers/2611.30025', 'title': 'Damped Atomic Wave Integration Neurons (DAWIN): A Universal Primitive for Continuous-Time Spatiotemporal Learning', 'url': 'https://huggingface.co/papers/2611.30025', 'abstract': 'Abstract  Conventional artificial neurons separate spatial feature aggregation from continuous physical time, limiting their ability to model irregular observations. We introduce the Damped Atomic Wave Integration Neuron (DAWIN), a continuous-time primitive for replacing standard neural layers in MLPs, Transformers, and graph neural networks. DAWIN couples spatial projection with elapsed-time-dependent wave excitation and integrates it into a local complex state through closed-form damped evolution, avoiding numerical differential equation solvers. We show that DAWIN generalizes static sinusoidal and memoryless wave neurons on interval-augmented inputs, derive closed-form gradients, and establish bounded-input bounded-output stability for positive damping and sampling intervals bounded away from zero. An associative Triton prefix-scan implementation, DAWINLinear, uses FP32 accumulation and achieves O(log L) parallel depth for sequence length L. Across 11 parameter-matched tasks covering irregular oscillators, MuJoCo dynamics, pedestrian trajectories, and PhysioNet 2012 clinical sequences, DAWIN outperforms Neural CDE on 9 tasks and ReLU-MLP on 8. It achieves the lowest error on dense clinical dynamics (0.9531 NRMSE, winning across all 10 seeds) and ties for the best mortality prediction (0.9993 AUROC). Shuffling elapsed intervals increases error by 58.2%-77.4% on selected dynamics tasks, versus 0.06% on a time-irrelevant control, supporting reliance on physical timing. On NVIDIA B200 GPUs, parallel wave integration accelerates inference by up to 2,630 times over its serial implementation and reduces peak GPU memory by up to 97.6% relative to Mamba in the tested configurations.', 'score': 1, 'issue_id': 3571, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '3b2fbd3f62e155a8', 'authors': ['Byunggu Yu', 'Justin Kim'], 'affiliations': ['Department of Computer Science and Information Technology, University of the District of Columbia, Washington, DC, USA'], 'pdf_title_img': 'assets/pdf/title_img/2611.30025.jpg', 'data': {'categories': ['#optimization', '#training', '#inference', '#architecture', '#graphs'], 'emoji': '🌊', 'ru': {'title': 'Нейрон, который чувствует физическое время и затухающие волны', 'desc': 'В статье предлагается DAWIN — нейрон непрерывного времени, который заменяет стандартные слои в MLP, Transformer и графовых нейросетях. Он объединяет пространственную проекцию признаков с возбуждением волны, зависящим от прошедшего времени, и интегрирует их в комплексное состояние через аналитически заданную затухающую эволюцию, без численных решателей ОДУ. Авторы выводят замкнутые градиенты, доказывают BIBO-устойчивость и реализуют параллельное префиксное сканирование на Triton (DAWINLinear) с логарифмической глубиной O(log L). На 11 задачах DAWIN превосходит Neural CDE и ReLU-MLP, особенно на нерегулярных временных рядах, а на GPU NVIDIA B200 ускоряет инференс до 2630 раз и снижает пиковую память до 97,6% по сравнению с Mamba.'}, 'en': {'title': 'Neurons That Learn from the Rhythm of Time', 'desc': 'The paper introduces DAWIN, a continuous-time neural unit that combines spatial feature projection with waves whose behavior depends on elapsed time. It updates a local complex-valued state using a closed-form damped integration, so it does not need a numerical differential equation solver. Tests across 11 tasks show that DAWIN often performs better than Neural CDEs and ReLU MLPs, and that changing the time intervals can substantially hurt performance on timing-dependent tasks. A parallel prefix-scan implementation makes inference much faster than serial integration in the tested settings.'}, 'zh': {'title': '让神经网络读懂时间：以阻尼波积分高效建模不规则序列', 'desc': '这篇论文提出阻尼原子波积分神经元（DAWIN），让神经网络在处理空间特征时，也能利用观测之间经过的实际时间。它通过带阻尼的闭式波动演化更新局部复数状态，不需要数值求解微分方程，并可替代多层感知机、Transformer 和图神经网络中的常规层。作者给出了闭式梯度与稳定性条件，并实现了可并行的前缀扫描算法；在11项任务中，DAWIN多次优于Neural CDE和ReLU-MLP，也能高效处理长序列。实验还显示，打乱时间间隔会显著降低部分任务表现，说明模型确实利用了时间信息；在指定GPU测试中，其推理速度最高提升2630倍。'}}}, {'id': 'https://huggingface.co/papers/2611.30723', 'title': 'BiSAT: Bidirectionally Aligned Semantic-Acoustic Tokenization for Speech Language Models', 'url': 'https://huggingface.co/papers/2611.30723', 'abstract': "Abstract  Speech language models (LMs) generate speech as sequences of discrete tokens. Their tokenizer must therefore preserve both acoustic detail and linguistic content at a low bitrate. Semantic-enhanced tokenizers may lose acoustic detail, whereas acoustic-oriented tokenizers retain acoustic variation that makes language modeling harder. Unified tokenizers combine both, but representing acoustic detail and linguistic content within a single feature space can cause interference between the two objectives, and existing approaches typically align acoustic representations to fixed semantic targets from a frozen teacher. We propose Bidirectionally Aligned Semantic-Acoustic Tokenization (BiSAT), a unified tokenization framework with separate acoustic and semantic branches aligned by a shared-index mechanism. This design learns acoustic and semantic representations in separate continuous spaces while producing a single discrete code sequence, and it jointly optimizes both encoders without relying on fixed semantic teacher targets. Based on BiSAT, we develop BiSAT-TTS, a zero-shot text-to-speech system comprising an autoregressive text-speech LM and a conditional flow-matching acoustic decoder. Reconstruction, downstream understanding, and diagnostic analyses show that BiSAT effectively preserves semantic and acoustic information in the code stream, performs well on in-the-wild and out-of-domain speech, and learns complementary codebook representations. The frozen-code understanding results also support its feasibility and potential for code-based reward modeling in reinforcement learning post-training. BiSAT-TTS performs comparably to state-of-the-art speech LM-based TTS baselines with less training data, further supporting BiSAT's effectiveness for speech language modeling. The audio demos are available at https://seekmind-lab.github.io/bisat-demo.", 'score': 1, 'issue_id': 3571, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'db2f469a6aeb2b73', 'authors': ['Y. Lu', 'L. Wang', 'S. Okada'], 'affiliations': ['Graduate Student Member, IEEE', 'Member, IEEE'], 'pdf_title_img': 'assets/pdf/title_img/2611.30723.jpg', 'data': {'categories': ['#architecture', '#rl', '#training', '#audio'], 'emoji': '🗣️', 'ru': {'title': 'Речь в токенах: семантика и акустика в одном коде', 'desc': 'В статье предлагается BiSAT — унифицированный токенизатор речи, в котором акустическая и семантическая ветви работают в отдельных непрерывных пространствах признаков и выравниваются через общий индекс, что снижает интерференцию задач. Обе ветви обучаются совместно, без фиксированных семантических целей от замороженного учителя, а на выходе формируется единая дискретная последовательность кодов. На основе BiSAT построена система zero-shot TTS BiSAT-TTS, включающая авторегрессионную text-speech LM и акустический декодер на основе conditional flow-matching. Эксперименты показывают, что токены сохраняют и семантику, и акустику, а качество синтеза сопоставимо с современными TTS на базе speech LM при меньшем объёме обучающих данных.'}, 'en': {'title': 'One token stream, two kinds of speech information', 'desc': 'BiSAT is a speech tokenizer that aims to preserve both what was said and how it sounded, even at a low bitrate. It learns semantic and acoustic features in separate branches, then uses a shared-index mechanism to represent them in one sequence of discrete tokens. Unlike approaches that depend on fixed targets from a frozen teacher, BiSAT jointly trains both branches. A text-to-speech system built with BiSAT performs comparably to leading speech language model systems with less training data, while tests show that its tokens retain useful acoustic and linguistic information.'}, 'zh': {'title': '语义与声学双向对齐，让语音 token 兼顾内容与声音', 'desc': '这篇论文提出了双向对齐语义—声学分词框架 BiSAT，用于把语音压缩为离散 token，同时保留语言内容和声音细节。它通过共享索引机制连接彼此独立的语义与声学表示，并联合训练两个编码器，无需依赖冻结教师模型提供固定的语义目标。基于 BiSAT，作者构建了零样本文本转语音系统 BiSAT-TTS，结合自回归文本—语音语言模型与条件流匹配声学解码器。实验表明，BiSAT 能保留互补的语义和声学信息，且 BiSAT-TTS 使用较少训练数据也能达到与先进语音语言模型 TTS 系统相近的效果。'}}}, {'id': 'https://huggingface.co/papers/2611.31491', 'title': 'Pretrained Tabular Features and the Measurement of Financial Proximity', 'url': 'https://huggingface.co/papers/2611.31491', 'abstract': 'Abstract Using frozen internal representations of tabular foundation models as financial dissimilarity measures in a spatial asset-pricing model yields positive estimated gains over direct disclosure distance once broad SEC filing data are included.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Spatial arbitrage pricing theory (S-APT) extends factor models to allow returns to spill over between connected firms, beyond what common risk factors explain. In recent years, tabular foundation models (TFMs) have matched or outperformed tuned gradient-boosted and bagged ensembles on small and medium-sized tabular benchmarks. Although their predictive performance is strong, these models reveal little about what they have learned, which limits their use in regulated financial applications that require explanation. Internal representations are widely used to probe what neural networks learn and to measure similarity. In this paper, we use the frozen representations of four TFMs as a measure of financial dissimilarity in a spatial asset-pricing model of US equities from 2011 to 2025, and find that their estimated gains over a direct distance between the same disclosures become consistently positive once broad SEC filing data are included. This reframes tabular foundation models from black-box predictors into instruments for measuring economic structure, with immediate applications to peer selection, risk attribution and network-based asset pricing. More broadly, our findings suggest that the internal representations of foundation models, not only their predictions, deserve study as economic objects, opening a new line of research on what pretrained models know about firms.', 'score': 1, 'issue_id': 3570, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '09bf0d996aa0cd8c', 'pdf_title_img': 'assets/pdf/title_img/2611.31491.jpg', 'data': {'categories': ['#architecture', '#graphs', '#interpretability', '#data', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Внутренние представления моделей раскрывают экономическую структуру фирм', 'desc': 'В статье исследуется использование замороженных внутренних представлений табличных фундаментальных моделей (TFM, tabular foundation models) как меры финансовой непохожести между компаниями в пространственной модели ценообразования активов (S-APT). Авторы применяют четыре TFM к данным по акциям США за 2011–2025 годы и сравнивают их с прямым расстоянием между раскрытиями SEC. При включении широкого набора отчетов SEC оценённый прирост качества стабильно положителен. Работа показывает, что внутренние представления LLM и AI-моделей можно использовать не только для предсказаний, но и для интерпретации экономической структуры.'}, 'en': {'title': 'Beyond Predictions: Foundation Models Reveal Financial Connections', 'desc': 'This paper uses frozen internal representations from four tabular foundation models to measure how financially dissimilar US firms are. It applies these measures in a spatial asset-pricing model, which captures how returns can spill over between connected firms beyond shared risk factors. When the models use broad SEC filing data, their estimated gains over distances calculated directly from disclosures are consistently positive. The results suggest that model representations can help explain economic relationships and support tasks such as peer selection and risk attribution.'}, 'zh': {'title': '不只看预测：用模型内部表示读懂公司的经济联系', 'desc': '本文研究如何把表格基础模型学到的内部表示用于股票定价。研究者冻结四种模型的参数，并用它们的内部表示衡量美国上市公司之间的金融差异，再将这种差异纳入空间套利定价模型。结果显示，加入更广泛的美国证券交易委员会（SEC）申报数据后，基于模型表示的估计收益持续高于直接比较公司披露信息所得的结果。这表明，基础模型不仅能用于预测，其内部表示也可帮助识别公司间的经济联系，并支持同业筛选、风险归因和网络资产定价。'}}}, {'id': 'https://huggingface.co/papers/2611.32993', 'title': 'Decision-Native Multimodal Clinical Modeling via Anatomical Grounding and Confidence Calibration', 'url': 'https://huggingface.co/papers/2611.32993', 'abstract': 'Abstract  Structured clinical decisions from volumetric computed tomography (CT) require anatomically grounded predictions and calibrated confidence estimates. However, existing 3D medical multimodal models often suffer from uncalibrated autoregressive decoding and shortcut reliance on irrelevant anatomical regions. We introduce Radev, a decision-native multimodal model that integrates anatomy-guided visual compression, direct candidate prediction, and counterfactual confidence supervision. To bridge global context with fine-grained slice details, a frozen 3D encoder extracts reusable organ-level features, which are dynamically selected by the query to attend to 2D slice features within predicted anatomical bounds. The resulting compact visual tokens enable the language backbone to estimate candidate probabilities in a single forward pass without autoregressive decoding. We further propose Counterfactual-Calibrated Training (CCT) to compare predictions under intact and intervened organ representations. CCT encourages confidence to decrease when removing target-organ evi
