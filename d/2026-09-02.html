    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');

                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {

            body.classList.toggle('light-theme');

            const isDarkMode = body.classList.contains('dark-theme');

            if (isDarkMode) {

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.01591', 'title': 'StudentSim: Training LLM-based Student Simulators', 'url': 'https://huggingface.co/papers/2609.01591', 'abstract': "Abstract StudentSim trains personalized student simulators from sparse data to mirror learner responses and adapt to tutor guidance, outperforming existing models across chess, writing, and math.  Generated by thinkingmachines/Inkling-Small AI tutors are most useful when they adapt to each student's strengths, weaknesses, and preferred guidance, but evidence about which guidance works for which student is sparse, slow, and costly to collect from real learners. Student simulators can provide this signal as a proxy, yet existing approaches are limited: state-tracking models fit student behavior but struggle to process explanations or corrections, while LLM role-play follows guidance fluently but does not reliably match the competence of the student being imitated. We present StudentSim, a training framework that turns sparse per-student data into individualized simulators through pooled training followed by per-student specialization. The resulting simulators both mirror a student's own responses and update them under tutor guidance. We also introduce StudentSimEval, a standardized protocol covering 60 students across chess, second-language English writing, and mathematics, using public learner datasets with de-identified records shared for research. StudentSimEval measures behavioral fidelity (F), or how well a simulator matches a student's responses, and guidance responsiveness (R), or how readily it updates under tutor guidance, with all methods fit and evaluated on the same records. Across all three domains, StudentSim outperforms GPT-5.4 on both metrics. In chess, StudentSim reaches F=0.51 and R=0.91, compared with 0.23 and 0.72 for GPT-5.4 and 0.45 and 0.27 for Maia2. As a proof of concept, using StudentSim as a reward model for tutor reinforcement learning produces a chess tutor that expert humans rate as more accurate, better-guided, and more personalized than a no-RL baseline and a tutor trained against a GPT-5.4 simulator reward. Code is available at https://github.com/microsoft/StudentSim.", 'score': 255, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'c861844d7bb953c1', 'authors': ['Ke Yang', 'Chenglong Wang', 'Michel Galley', 'Chandan Singh', 'Jeevana Priya Inala', 'ChengXiang Zhai', 'Jianfeng Gao'], 'affiliations': ['Microsoft Research', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.01591.jpg', 'data': {'categories': [], 'emoji': '👨\u200d🎓', 'ru': {'title': 'Персонализированный симулятор студента для адаптивного обучения', 'desc': 'StudentSim — это фреймворк для обучения персонализированных симуляторов студентов на основе ограниченных данных, которые воспроизводят реакции учащихся и адаптируются к рекомендациям репетитора. Исследователи использовали трансфер-лёрнинг с предварительной подготовкой на объединённых данных, а затем тонкую настройку для каждого студента. Авторы представили стандартизированный набор для оценки StudentSimEval, охватывающий три домена (шахматы, английский язык и математика), измеряющий верность поведения и готовность к обновлению под влиянием инструкций. Эксперименты показали, что StudentSim превосходит большие языковые модели как по точности воспроизведения компетенций студента, так и по способности реагировать на коррекции репетитора.'}, 'en': {'title': 'Personalized Learning with StudentSim: Adapting to Every Learner', 'desc': 'StudentSim is a novel framework that creates personalized student simulators using limited data to accurately reflect learner responses and adapt to tutor guidance. It addresses the challenges of existing models by combining pooled training with individual specialization, allowing for better imitation of student behavior and responsiveness to guidance. The framework is evaluated through StudentSimEval, which assesses how well the simulators match actual student responses and how effectively they adapt to tutoring. Results show that StudentSim significantly outperforms previous models, demonstrating its effectiveness in educational applications across various subjects.'}, 'zh': {'title': '个性化学生模拟器的创新训练框架', 'desc': 'StudentSim 是一种个性化学生模拟器的训练框架，能够从稀疏数据中学习并模拟学生的反应，适应导师的指导。它通过汇总训练和个性化专门化，将每个学生的数据转化为个体化的模拟器。与现有模型相比，StudentSim 在国际象棋、写作和数学等领域的表现更为出色。该框架还引入了 StudentSimEval，一个标准化的评估协议，用于测量模拟器的行为忠实度和响应性。'}}}, {'id': 'https://huggingface.co/papers/2609.00111', 'title': 'Qwen-Drive-1.0: An Initial Step towards a Vision-Language Foundation Model for Autonomous Driving', 'url': 'https://huggingface.co/papers/2609.00111', 'abstract': "Abstract Qwen-Drive-1.0 is a vision-language foundation model for autonomous driving that unifies 3D perception, visual question answering, and motion planning via shared representations and staged training.  Generated by thinkingmachines/Inkling-Small We present Qwen-Drive-1.0, an initial step towards a vision-language foundation model for autonomous driving. Qwen-Drive-1.0 retains the architecture of the pretrained vision-language model (VLM) and integrates 3D perception, visual question answering, and motion planning within a unified framework. An external bird's-eye-view (BEV) perception head jointly performs 3D object detection, semantic occupancy prediction, and BEV map segmentation. It serves as a probe of the 3D information accessible from the shared representations and provides an explicit, inspectable interface to 3D scene structure. A Planning Expert conditions on shared VLM representations to generate future ego trajectories. A staged training recipe combines driving supervision with general-purpose vision-language data to acquire driving-specific competence while helping preserve broad visual understanding and instruction-following capabilities. Experiments demonstrate strong 3D perception and driving scene understanding while largely preserving general vision-language capability. Comprehensive evaluations across open-loop, pseudo-closed-loop, and closed-loop settings further show highly competitive motion-planning performance.", 'score': 78, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '43763d4b3151ee4c', 'pdf_title_img': 'assets/pdf/title_img/2609.00111.jpg', 'data': {'categories': ['#multimodal', '#3d', '#robotics', '#cv', '#open_source', '#training', '#architecture'], 'emoji': '🚗', 'ru': {'title': 'Единая модель для автономного вождения через унифицированные представления', 'desc': 'Qwen-Drive-1.0 — это унифицированная модель зрения и языка для автономного вождения, которая интегрирует 3D восприятие, ответы на визуальные вопросы и планирование движения через общие представления. Модель использует предварительно обученную архитектуру VLM и добавляет специальный модуль восприятия с представлением в системе координат птичьего полёта, который выполняет детекцию объектов, предсказание семантической занятости и сегментацию карты. Планировщик движения на основе общих представлений модели генерирует траектории движения автомобиля в будущем. Стратегия поэтапного обучения комбинирует данные с разметкой дорожного поведения с универсальными данными о видении и языке, сохраняя способность модели к общему пониманию визуального контента и следованию инструкциям.'}, 'en': {'title': 'Unified Vision-Language Model for Autonomous Driving', 'desc': "Qwen-Drive-1.0 is a vision-language foundation model designed for autonomous driving, integrating 3D perception, visual question answering, and motion planning into a single framework. It utilizes a bird's-eye-view (BEV) perception head for tasks like 3D object detection and semantic segmentation, allowing for a clear understanding of the 3D environment. The model employs a staged training approach that combines driving-specific supervision with general vision-language data, enhancing its ability to understand driving scenarios while maintaining broad visual capabilities. Experimental results indicate that Qwen-Drive-1.0 excels in 3D perception and motion planning, demonstrating strong performance across various evaluation settings."}, 'zh': {'title': '统一3D感知与运动规划的自动驾驶模型', 'desc': 'Qwen-Drive-1.0 是一个用于自动驾驶的视觉-语言基础模型，它通过共享表示和分阶段训练，统一了3D感知、视觉问答和运动规划。该模型保留了预训练视觉-语言模型的架构，并在一个统一的框架内整合了多种功能。它的外部鸟瞰视图（BEV）感知头可以同时进行3D物体检测、语义占用预测和BEV地图分割。实验结果表明，该模型在3D感知和驾驶场景理解方面表现出色，同时保持了广泛的视觉-语言能力。'}}}, {'id': 'https://huggingface.co/papers/2609.01343', 'title': 'SMELT: Scaling Laws for Compute-Matched MoE Looped Transformers', 'url': 'https://huggingface.co/papers/2609.01343', 'abstract': "Abstract Looping middle layers in sparse Mixture-of-Experts Transformers improves training efficiency and downstream performance while matching per-token FLOPs, parameters, and cache budgets.  Generated by thinkingmachines/Inkling-Small Looped Transformers increase effective depth by iterating a shared block of layers, but most evaluations compare at fixed model size, conflating architectural advantage with extra FLOPs. We study looping on Mixture-of-Experts Transformers while closely matching per-token FLOPs, total non-embedding parameters, and KV cache. Through a series of ablations, we arrive at a recipe we call SMELT (Sparse MoE Transformer, middle layers Loop Twice), which loops the middle half of layers twice while matching the unlooped Baseline on all three budgets. We scale SMELT across four sizes up to 54B non-embedding parameters and fit a separate Chinchilla-style scaling law for each architecture. SMELT's loss drops faster with compute, saving 6.8--18.0\\% of training FLOPs on the compute-optimal frontier. The advantage transfers to downstream benchmarks beyond what validation loss predicts, is largest on Code, and grows with sample length and the number of in-context examples. Mechanistic analysis shows that the second visit reduces the attention sink and redirects mass toward content-relevant tokens, an inductive bias that may underlie the observed performance gains. These results show that looping can improve Transformers even under budget matching, offering a practical recipe that turns depth reuse into measurable gains.", 'score': 56, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '88f07ef2fd3bac2d', 'authors': ['Shaowen Wang', 'Ge Zhang', 'Kairong Luo', 'Yuhao Wu', 'Shaofan Liu', 'Jiaheng Liu', 'Wenhao Huang', 'Shen Yan', 'Jian Li'], 'affiliations': ['ByteDance Seed', 'M-A-P', 'TokenWave.AI', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01343.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🔄', 'ru': {'title': 'Повторное использование глубины слоёв для эффективной масштабируемости Трансформеров', 'desc': 'В статье исследуется техника повторного использования слоёв (looping) в разреженных Трансформерах с Mixture-of-Experts архитектурой для улучшения эффективности обучения. Авторы предлагают SMELT — метод, который дважды проходит через средние слои модели, при этом сохраняя одинаковое количество вычислений (FLOPs), параметров и объём кеша ключей-значений с базовой моделью. Экспериментальные результаты показывают, что SMELT позволяет экономить 6.8–18.0% вычислений на оптимальной граничной кривой и демонстрирует значительный прирост производительности на задачах с кодом и длинными последовательностями. Анализ механизмов работы выявляет, что второе прохождение через слои уменьшает эффект внимания к началу последовательности и перенаправляет внимание на содержательно релевантные токены.'}, 'en': {'title': 'Looping Layers for Enhanced Transformer Performance', 'desc': "This paper introduces a method called SMELT (Sparse MoE Transformer, middle layers Loop Twice) that enhances the training efficiency and performance of Mixture-of-Experts Transformers by looping the middle layers. By iterating a shared block of layers, SMELT maintains the same computational budget while effectively increasing the model's depth. The authors demonstrate that this approach leads to faster loss reduction during training and improved performance on various downstream tasks, particularly in code-related benchmarks. Mechanistic analysis reveals that the looping process helps focus attention on relevant tokens, contributing to the observed performance improvements."}, 'zh': {'title': '循环中间层，提升Transformer性能！', 'desc': '这篇论文探讨了在稀疏混合专家Transformer中循环中间层的效果，能够提高训练效率和下游性能，同时保持每个token的计算量、参数和缓存预算一致。研究提出了一种名为SMELT的方案，通过将中间一半的层循环两次，来匹配未循环基线的预算。实验结果表明，SMELT在计算资源最优的情况下，训练所需的计算量减少了6.8%到18.0%。此外，循环的机制分析显示，第二次访问可以减少注意力的集中，重新引导注意力到与内容相关的token上，从而提升模型性能。'}}}, {'id': 'https://huggingface.co/papers/2609.00028', 'title': 'UI-Venus-2 Technical Report', 'url': 'https://huggingface.co/papers/2609.00028', 'abstract': 'Abstract UI-Venus-2 is a general-purpose multimodal GUI agent that uses unified reasoning-action loops, expanded environment coverage, and robust verification to enable reliable real-world digital automation.  Generated by thinkingmachines/Inkling-Small Multimodal GUI agents have emerged as a promising paradigm for digital task automation, yet transitioning from benchmark-oriented models to dependable real-world applications remains challenging due to limited environment coverage, brittle task construction, and unreliable reward verification. In this work, we present UI-Venus-2, a general-purpose foundation GUI agent designed to operate across mobile, web, and desktop environments through a unified closed-loop reasoning-action framework. To bridge the gap toward practical deployment, we jointly scale three critical dimensions: (1) Environments, expanding coverage to more than 170 multilingual mobile apps and native desktop operating systems; (2) Tasks, employing a deep-research pipeline for function-grounded instruction generation; and (3) Verification, adopting trace-level and sample-level evaluators with visual keypoints and multi-model voting to ensure reliable RL signals for training. Furthermore, we integrate safety-aware mechanisms to ensure controlled execution of consequential actions. By offering a capable, efficient, and open-source foundation, UI-Venus-2 advances the field toward more generalizable, verifiable, and self-reflective agents for real-world applications.', 'score': 50, 'issue_id': 3202, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '5c28802c4e3de181', 'authors': ['Venus Team', 'Zhuohan Cai', 'Haoxing Chen', 'Jiaxuan Chen', 'Weizhi Chen', 'Changlong Gao', 'Zhangxuan Gu', 'Yuan Guo', 'Yusong Hu', 'Jianrong Jiang', 'Jianguo Li', 'Runze Li', 'Jinzhen Lin', 'Zhenyu Ma', 'Changhua Meng', 'Han Peng', 'Xinyu Qiu', 'Shuheng Shen', 'Zhongyi Shui', 'Weiqiang Wang', 'Ming Wen', 'Zhuoer Xu', 'Hang Yan', 'Kaiwen Yang', 'Ruilin Yao', 'Nanjun Yu', 'Zhengwen Zeng', 'Lianrui Zhang', 'Yunzhu Zhang', 'Zhe Zhao', 'Beitong Zhou'], 'affiliations': ['Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.00028.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#agents', '#benchmark', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Универсальный UI-агент для надёжной автоматизации цифровых процессов', 'desc': 'UI-Venus-2 представляет собой многомодальный AI агент, который автоматизирует задачи на цифровых интерфейсах через единую систему рассуждения и действий. Система охватывает более 170 приложений и операционных систем, работая с мобильными, веб и десктопными платформами одновременно. Авторы решили критические проблемы надёжности, масштабируя три направления: разнообразие окружений, качество генерации задач и точность верификации результатов с использованием визуальных ориентиров и ансамблевого голосования моделей. Встроенные механизмы безопасности обеспечивают контролируемое выполнение чувствительных операций для практического применения.'}, 'en': {'title': 'Empowering Reliable Digital Automation with UI-Venus-2', 'desc': 'UI-Venus-2 is a versatile multimodal GUI agent designed for automating digital tasks across various platforms like mobile, web, and desktop. It utilizes a unified reasoning-action loop to enhance its operational reliability in real-world scenarios. The agent expands its capabilities by covering over 170 multilingual applications and employing advanced methods for generating task instructions. Additionally, it incorporates robust verification techniques to ensure the accuracy of its actions, making it a significant step towards dependable automation solutions.'}, 'zh': {'title': 'UI-Venus-2：通用的多模态自动化代理', 'desc': 'UI-Venus-2 是一种通用的多模态图形用户界面（GUI）代理，旨在通过统一的推理-行动循环、扩展的环境覆盖和稳健的验证来实现可靠的数字自动化。该代理能够在移动、网络和桌面环境中操作，解决了从基准模型到实际应用的转变难题。它通过扩展覆盖超过170种多语言移动应用和本地桌面操作系统，采用深度研究管道生成功能基础的指令，并使用视觉关键点和多模型投票的验证机制，确保训练的可靠性。UI-Venus-2 提供了一个高效、开源的基础，推动了更具通用性、可验证性和自我反思能力的代理的发展。'}}}, {'id': 'https://huggingface.co/papers/2609.00188', 'title': 'ZimaBlue: Evolving Generalizable World Action Models through Scalable Video Pre-training', 'url': 'https://huggingface.co/papers/2609.00188', 'abstract': 'Abstract ZimaBlue learns generalizable world action models from large-scale egocentric video via a three-stage curriculum and a slow-fast architecture, substantially improving zero-shot robotic manipulation.  Generated by thinkingmachines/Inkling-Small Robotic manipulation faces a fundamental scaling challenge: robust generalization demands broad physical experience, yet action-labeled robot trajectories are expensive to collect and inherently limited in diversity. Egocentric videos offer a far more scalable source of embodied experience, capturing object interactions, contact dynamics, tool use, and long-horizon behaviors across diverse environments. The central challenge is how to convert this abundant but action-free experience into effective robot control. We introduce ZimaBlue, a scalable framework for learning generalizable World Action Models (WAMs) from large-scale video. ZimaBlue follows a three-stage training curriculum: it first performs causal embodied video pre-training on large-scale human and robot egocentric videos, then grounds the learned visual dynamics in heterogeneous robot trajectories through video-action mid-training with a unified action representation, and finally specializes the model to a target robot for deployment. To make generative WAMs practical for real-time control, ZimaBluefurther adopts an asynchronous Slow-Fast dual-system architecture, where a high-capacity Slow world model provides generalizable spatiotemporal representations and a lightweight Fast branch enables 30 Hz action prediction on NVIDIA RTX 4090. On real-robot zero-shot evaluations, scaling from target-robot data alone to over 120,000 hours of embodied video improves success from 36.1% to 77.8%. ZimaBlue further delivers strong performance across multiple benchmarks, with particularly pronounced gains on unseen tasks.', 'score': 36, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b3a9d08afb107c29', 'pdf_title_img': 'assets/pdf/title_img/2609.00188.jpg', 'data': {'categories': ['#robotics', '#architecture', '#training', '#video'], 'emoji': '🤖', 'ru': {'title': 'От видео людей к действиям роботов через обобщаемые модели мира', 'desc': 'ZimaBlue — это фреймворк для обучения обобщаемых моделей действий в мире (World Action Models) из больших объёмов эгоцентрического видео. Система использует трёхэтапный учебный план: сначала предварительное обучение на видео с причинно-следственными связями, затем привязка к траекториям робота с единой репрезентацией действий, и наконец специализация для целевого робота. Для эффективного реального управления применяется асинхронная архитектура Slow-Fast с мощной медленной моделью для пространственно-временных представлений и лёгкой быстрой ветвью для предсказания действий на 30 Hz. Эксперименты показывают, что масштабирование с 120,000 часов эгоцентрического видео улучшает успех манипуляций робота с 36.1% до 77.8% в нулевых условиях обучения.'}, 'en': {'title': 'Learning to Manipulate: Robots that Understand from Video', 'desc': 'ZimaBlue is a machine learning framework designed to improve robotic manipulation by learning from large amounts of egocentric video data. It uses a three-stage curriculum to train models that can generalize actions without needing extensive labeled data. The framework incorporates a Slow-Fast architecture, allowing it to balance detailed world modeling with fast action predictions. As a result, ZimaBlue significantly enhances the ability of robots to perform tasks they have not been explicitly trained on, achieving impressive success rates in zero-shot evaluations.'}, 'zh': {'title': 'ZimaBlue：从视频中学习通用机器人控制', 'desc': 'ZimaBlue 是一个从大规模自我中心视频中学习通用世界动作模型的框架，旨在提高零-shot 机器人操作的能力。它采用三阶段的训练课程，首先在大规模人类和机器人视频上进行因果预训练，然后通过视频-动作中期训练将学习到的视觉动态与异构机器人轨迹结合，最后将模型专门化以适应目标机器人。ZimaBlue 还采用了异步的慢-快双系统架构，使得高容量的慢世界模型提供通用的时空表示，而轻量级的快分支则实现了实时的动作预测。通过使用超过 120,000 小时的自我中心视频，ZimaBlue 在真实机器人零-shot 评估中显著提高了成功率，从 36.1% 提升至 77.8%。'}}}, {'id': 'https://huggingface.co/papers/2609.01560', 'title': 'H3-World: Turning Language Understanding into World Control', 'url': 'https://huggingface.co/papers/2609.01560', 'abstract': 'Abstract  We present H3-World, an efficient framework that turns the 33B MiniMax-H3 video generator into an interactive world model. Our key finding is that, as large video generators become more capable, language is emerging as a natural interface for control. MiniMax-H3, for example, already supports zero-shot control of character behavior and camera motion through natural-language instructions. Building on this, H3-World turns this coarse language interface into precise, temporally grounded world control, without introducing dedicated action modules. Specifically, we represent each action as a structured combination of character and camera instructions, and align them with the corresponding temporal video latents. To make the control temporally precise, we further introduce temporal attention routing, which restricts each instruction to its intended time interval and reduces control leakage across actions. Importantly, H3-World directly reuses the semantic representations learned during large-scale video pretraining and requires only lightweight adaptation. With only 8,000 gameplay samples, 10,000 LoRA optimization steps, and 0.199% trainable parameters, H3-World achieves effective character and camera control while preserving strong generation quality. It also generalizes to unseen scenarios. These results show that the control capabilities emerging in large video generators can be efficiently transformed into interactive world control.', 'score': 31, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '9f1db4a5061b2081', 'authors': ['Danze Chen', 'Zeqing Wang', 'Ziyue Lin', 'Xingyi Yang', 'Yeying Jin'], 'affiliations': ['National University of Singapore', 'Tencent', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01560.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Язык как естественный интерфейс управления в видеогенераторах', 'desc': 'Авторы представляют H3-World — эффективную систему, которая преобразует видеогенератор MiniMax-H3 в интерактивную модель мира. Ключевое открытие заключается в том, что естественный язык становится удобным интерфейсом управления видеогенератором, позволяя контролировать поведение персонажей и движение камеры через текстовые инструкции. Система представляет каждое действие как структурированную комбинацию команд для персонажей и камеры, выравнивая их с временными представлениями видео и используя механизм temporal attention routing для точного управления во времени. Благодаря переносу обучения и LoRA, H3-World достигает эффективного управления с использованием только 0.199% обучаемых параметров и обобщается на новые сценарии.'}, 'en': {'title': 'Transforming Video Generation into Interactive Control with H3-World', 'desc': 'H3-World is a new framework that enhances the MiniMax-H3 video generator, allowing it to function as an interactive world model. The study reveals that as video generators improve, using natural language for control becomes more effective. H3-World enables precise control of character actions and camera movements by structuring these commands and aligning them with specific video moments. This approach requires minimal additional training and demonstrates strong performance even in new scenarios, showcasing the potential of large video models for interactive applications.'}, 'zh': {'title': '将语言转化为互动世界控制的高效框架', 'desc': 'H3-World是一个高效的框架，将33B MiniMax-H3视频生成器转变为一个互动世界模型。研究发现，随着大型视频生成器能力的提升，语言逐渐成为控制的自然接口。H3-World通过将粗略的语言接口转化为精确的时间基础世界控制，避免了引入专用的动作模块。该框架利用大规模视频预训练中学习到的语义表示，仅需轻量级的适应，就能实现有效的角色和相机控制，同时保持强大的生成质量。'}}}, {'id': 'https://huggingface.co/papers/2608.30468', 'title': 'Hi-Q: Hierarchical Evidence-guided Query Refinement for Multi-Hop Question Answering', 'url': 'https://huggingface.co/papers/2608.30468', 'abstract': 'Abstract Hi-Q is an evidence-conditioned framework that dynamically refines multi-hop queries into hierarchical trees guided by corpus support signals, improving retrieval and answer accuracy without fixed graphs.  Generated by thinkingmachines/Inkling-Small A central bottleneck in multi-hop Question Answering (QA) is that the granularity at which a question is expressed often differs from the granularity at which corpus evidence is retrievable. Existing methods address this mismatch by imposing fixed graph structures over the corpus, by iteratively reformulating the query, or by executing a generated program over it, but these strategies do not explicitly decide when a query unit is already supported by evidence and when it should be refined. We formulate this bottleneck as retrievable granularity discovery and introduce Hi-Q, an evidence-conditioned framework for hierarchical query refinement. At each query node, a resolution operator tests whether retrieved evidence supports the current query unit; resolved nodes terminate, while unresolved nodes are expanded by a dependency-preserving binary operator and checked by a semantic coverage verifier. Hi-Q therefore grows a query tree whose topology is determined by corpus support signals rather than by a fixed decomposition template or a pre-built graph. We evaluate Hi-Q on three multi-hop QA benchmarks, primarily under full-corpus retrieval, where dependent evidence must be located among open-domain distractors rather than within a small annotated pool. In this setting Hi-Q reaches 52.3 EM and 64.0 F1 averaged over the three benchmarks, ahead of the iterative retrieval baseline IRCoT by 15.1 EM / 18.2 F1 on that same average, and ahead of the graph-based RAG baseline PropRAG by 11.5 EM / 12.0 F1 on MuSiQue-full, without corpus-wide graph construction. In the restricted supporting/distractor setting used by prior work, Hi-Q likewise attains the best accuracy, with 57.9 EM and 69.3 F1 on average, ahead of PropRAG by 5.6 EM / 3.9 F1 and IRCoT by 13.7 EM / 15.8 F1. The project page is available at https://hi-q-project.github.io/.', 'score': 22, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '122a18935dd76d6e', 'authors': ['Jueun Kim', 'Sungho Park', 'Wook-Shin Han'], 'affiliations': ['Department of Computer Science and Engineering, POSTECH', 'Graduate School of Artificial Intelligence, POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2608.30468.jpg', 'data': {'categories': ['#rag', '#benchmark'], 'emoji': '🌳', 'ru': {'title': 'Динамическое разбиение вопросов на иерархические деревья с поддержкой корпуса', 'desc': 'Hi-Q представляет фреймворк для многошагового поиска ответов, который динамически разбивает сложные вопросы на иерархические деревья запросов, руководствуясь сигналами поддержки из корпуса документов. Основная идея решает проблему несоответствия между уровнем детализации вопроса и уровнем, на котором информация доступна в корпусе. Система использует оператор разрешения для проверки, поддерживается ли текущий элемент запроса найденными доказательствами, а нерешённые узлы расширяются бинарным оператором с проверкой семантического покрытия. Hi-Q достигает лучших результатов на нескольких бенчмарках многошагового QA, превосходя методы на основе итеративного поиска и графовые подходы без необходимости предварительного построения графа всего корпуса.'}, 'en': {'title': 'Dynamic Query Refinement for Enhanced Multi-Hop QA', 'desc': 'Hi-Q is a novel framework designed to enhance multi-hop Question Answering (QA) by refining queries into hierarchical trees based on evidence from the corpus. It addresses the challenge of mismatched granularity between questions and retrievable evidence by dynamically determining when a query unit is supported by existing data. Instead of relying on fixed graph structures or iterative reformulations, Hi-Q uses an evidence-conditioned approach to grow a query tree guided by corpus support signals. This method significantly improves retrieval and answer accuracy, outperforming existing benchmarks in multi-hop QA tasks.'}, 'zh': {'title': 'Hi-Q：动态层次查询细化的创新框架', 'desc': 'Hi-Q是一个基于证据的框架，能够动态地将多跳查询细化为由语料库支持信号引导的层次树，从而提高检索和答案的准确性，而不依赖于固定的图结构。该方法解决了多跳问答中，问题表达的粒度与可检索证据的粒度不匹配的问题。Hi-Q通过在每个查询节点上测试检索到的证据是否支持当前查询单元，来决定何时终止或扩展查询节点。通过这种方式，Hi-Q构建的查询树的拓扑结构由语料库的支持信号决定，而不是由固定的分解模板或预构建的图决定。'}}}, {'id': 'https://huggingface.co/papers/2609.01404', 'title': 'Evaluating Multimodal LLMs as Generalist Vision-Language-Action Agents for Drone Control: Commanding, Approaching, Tracking and Searching', 'url': 'https://huggingface.co/papers/2609.01404', 'abstract': "Abstract DroneCATS evaluates multimodal language models as drone controllers and finds that small open models navigate well but fail at protocol adherence and termination, highlighting a gap between spatial perception and disciplined action.  Generated by thinkingmachines/Inkling-Small Multimodal Large Language Models (MLLMs) are strong perceivers of images and video. We ask how far that reach extends into acting: dropping an MLLM directly into a drone's control loop, with its entire action space declared solely in the prompt. Recent systems approach this setting but increasingly narrow the model's decision-making. We widen it back. We introduce DroneCATS-Agent, an architecture where the MLLM is a swappable component, and DroneCATS, a benchmark treating the model as the independent variable. Beyond merely flying toward a pixel, our agent entrusts the model to yaw and search, deliberate when unsure, and self-declare arrival---all without fine-tuning or function-calling schemas. Evaluating frontier and open models across four core capabilities---approaching a visible target, tracking a moving one, searching outside the initial view, and commanding a multi-drone fleet---reveals that even the simplest embodied settings are far from solved. Crucially, to identify what breaks first at the edge, our roster scales down to 2B parameters. The findings expose a stark paradox: it is not the flying that fails. Small open models often navigate into the success radius more reliably than frontier models, yet lose the episode by declaring arrival prematurely or not at all. Multi-drone commanding amplifies this divide, with small models failing by blindly copying a single coordinate across distinct views. Viewed as vision-language-action agents, the models' spatial perception holds up, but their action protocol does not. What separates a deployable edge model from a frontier model is not navigation, but the discipline to sustain a declared protocol and emit the correct terminating action. The open problem is closing this gap at onboard compute costs---yielding a fast model that plans persistently and knows exactly when it is done---and DroneCATS is built to measure that distance.", 'score': 17, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '42b5cbb2f72bf82b', 'authors': ['Jaewoo Park', 'Minyoung Lee', 'Sukmin Seo', 'Moonbin Yim', 'Hyunwook Yoon', 'Dohoon Ryu', 'Daehee Kim', 'Myungseo Song', 'Jihyuk Byun', 'Seunggyu Chang', 'Taeho Kil', 'Jiseob Kim', 'Bado Lee', 'Geewook Kim'], 'affiliations': ['NAVER Cloud'], 'pdf_title_img': 'assets/pdf/title_img/2609.01404.jpg', 'data': {'categories': ['#multimodal', '#robotics', '#interpretability', '#open_source', '#small_models', '#agents', '#games', '#benchmark'], 'emoji': '🚁', 'ru': {'title': 'Восприятие против дисциплины: парадокс маленьких моделей в управлении дронами', 'desc': 'В работе представлена система DroneCATS для оценки мультимодальных языковых моделей (MLLM) в качестве контроллеров беспилотников. Исследование показывает, что маленькие открытые модели хорошо справляются с навигацией и восприятием визуальной информации, но часто нарушают установленные протоколы действий и неправильно определяют момент завершения задачи. Бенчмарк включает четыре ключевых способности: приближение к видимой цели, отслеживание движущихся объектов, поиск вне начального поля зрения и управление несколькими беспилотниками. Полученные результаты демонстрируют парадокс: пространственное восприятие моделей работает надёжно, но им не хватает дисциплины для соблюдения протоколов действий и правильной генерации сигнала завершения.'}, 'en': {'title': 'Bridging the Gap: From Navigation to Disciplined Drone Control', 'desc': 'The paper introduces DroneCATS, a framework for evaluating multimodal language models (MLLMs) as drone controllers. It finds that while smaller open models can navigate effectively, they struggle with adhering to action protocols and properly terminating tasks. The study highlights the importance of disciplined action over mere navigation capabilities, revealing that even simple tasks are not fully solved. The authors propose DroneCATS-Agent, which allows for flexible integration of MLLMs in drone control, aiming to bridge the gap between spatial perception and disciplined execution.'}, 'zh': {'title': '缩小空间感知与行动协议的差距', 'desc': 'DroneCATS评估了多模态语言模型作为无人机控制器的能力，发现小型开放模型在导航方面表现良好，但在遵循协议和终止操作方面存在不足。这表明空间感知与有序行动之间存在差距。我们引入了DroneCATS-Agent架构，使多模态大语言模型（MLLM）可以作为可替换组件，并创建了DroneCATS基准，专注于模型的独立变量。研究结果显示，尽管小型模型在导航上表现更可靠，但在执行操作协议时却常常提前或未能正确声明到达，揭示了可部署边缘模型与前沿模型之间的关键区别。'}}}, {'id': 'https://huggingface.co/papers/2609.01607', 'title': 'Uncovering Understanding-Generation Synergy in Native Unified Multimodal Models: From Representation, Task to System', 'url': 'https://huggingface.co/papers/2609.01607', 'abstract': 'Abstract Unified multimodal models achieve synergy between visual understanding and generation through specialized architectures, shared knowledge, and end-to-end optimization rather than simple functional unification.  Generated by thinkingmachines/Inkling-Small While unified multimodal models (UMMs) jointly perform visual understanding and generation within a single model, functional unification does not guarantee learning synergy: the two objectives may reinforce each other, compete for capacity, or merely coexist. We investigate their relationship at the representation, task, and system levels in a controlled, structurally native setting without pretrained vision priors. At the representation level, we find that each objective provides useful signal to the other: generation enriches the visual features learned for understanding, while understanding strengthens vision--language alignment for generation. However, when both objectives are forced through the same computation path, one tends to dominate. A task-decoupled architecture that specializes conflicting visual computation while preserving semantic interaction avoids this asymmetric degradation. At the task level, through three case studies, we find positive bidirectional transfer when understanding and generation tasks rely on shared knowledge. At the system level, we show that an end-to-end UMM outperforms a matched planner--executor pipeline on complex tasks that explicitly require both image understanding and generation. Together, these results show that the value of UMMs extends beyond a unified interface: appropriate specialization, shared task knowledge, and end-to-end optimization can turn coexistence into synergy.', 'score': 17, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'c4908ca47d939662', 'authors': ['Penghao Wu', 'Haiwen Diao', 'Weichen Fan', 'Lewei Lu', 'Dahua Lin', 'Ziwei Liu'], 'affiliations': ['S-Lab, Nanyang Technological University', 'SenseTime Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.01607.jpg', 'data': {'categories': ['#multimodal', '#cv', '#transfer_learning', '#architecture'], 'emoji': '🎨', 'ru': {'title': 'От сосуществования к синергии: специализация в объединённых мультимодальных моделях', 'desc': 'В работе исследуется, как объединённые мультимодальные модели, одновременно выполняющие задачи понимания и генерации изображений, могут достичь синергии между этими целями. Авторы показывают, что просто объединить две задачи недостаточно — они могут конкурировать за ресурсы модели или друг друга подавлять, поэтому требуется специализированная архитектура с разделением конфликтующих вычислений. На уровне представлений обнаружено, что генерация обогащает визуальные признаки для понимания, а понимание улучшает выравнивание визуальных и языковых пространств. Результаты демонстрируют, что правильная архитектура со специализацией, общим знанием задач и сквозной оптимизацией превращает сосуществование целей в истинную синергию.'}, 'en': {'title': 'Unlocking Synergy in Unified Multimodal Models', 'desc': 'This paper explores how unified multimodal models (UMMs) can effectively combine visual understanding and generation. It highlights that simply merging these functions does not ensure they work well together; instead, they can compete for resources or coexist without enhancing each other. The authors demonstrate that when tasks are decoupled and specialized, both understanding and generation can benefit from shared knowledge, leading to improved performance. Ultimately, they show that a well-structured UMM can outperform traditional systems by leveraging synergy through specialized architectures and end-to-end optimization.'}, 'zh': {'title': '统一多模态模型的协同效应', 'desc': '统一的多模态模型（UMMs）通过专门的架构、共享知识和端到端优化，实现视觉理解与生成之间的协同，而不仅仅是简单的功能统一。研究表明，生成任务可以丰富视觉特征，而理解任务则增强视觉与语言的对齐，但当两个目标强制通过同一路径计算时，往往会出现一个目标主导的情况。为了解决这一问题，采用任务解耦的架构可以专门处理冲突的视觉计算，同时保持语义交互。最终，研究结果表明，适当的专业化、共享任务知识和端到端优化能够将共存转化为协同效应。'}}}, {'id': 'https://huggingface.co/papers/2609.00092', 'title': 'Safin-1: Safety from Within through Memory-Native State Evolution', 'url': 'https://huggingface.co/papers/2609.00092', 'abstract': "Abstract Safin-1 introduces a memory-routing architecture that embeds safety as an internal, evolving model state rather than an external constraint.  Generated by thinkingmachines/Inkling-Small Long-horizon complex tasks require foundation models to accumulate information, maintain internal states, and adapt over extended interactions. Safety should be an intrinsic property of the model itself, rather than a behavioral constraint relying solely on external safeguards or post-hoc alignment such as supervised fine-tuning. This motivates Safety from Within, where safety-relevant capabilities are represented and invoked through the model's native computation. We present Safin-1, a family of foundation models realizing this principle through memory routing and state evolution. Safin-1 is built on Memory-Anchor Routing across Context History (MARCH), a network architecture that maintains structured memory states and selectively retrieves relevant historical information through content-conditioned routing. It supports test-time adaptation of persistent capability states without repeatedly modifying the backbone, enabling controlled specialization over a shared foundation. We investigate this interface on downstream safety tasks through a Safety State, demonstrating effective state-based adaptation with substantial safety improvements. More broadly, the routed-state interface unifies contextual memory and persistent capability adaptation within the model's native computation, reframing memory from a passive record of prior context into an active substrate for maintaining and evolving model behavior. Evaluations across general capabilities, long-context understanding, retrieval, and efficiency further validate Safin-1. These findings provide a path toward safety as a state-native and adaptively maintainable capability. This work is only an initial architectural exploration of Safety from Within, and substantial further work is needed to realize this broader vision.", 'score': 17, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '08153fd142d51659', 'authors': ['Ming Zhang', 'Kaisen Yang', 'Shu Yu', 'Ermo Hua', 'Zhekai Chen', 'Cheng Jin', 'Jingnan Zheng', 'Yi Zhang', 'Zhongtian Ma', 'Jiawei Zhou', 'Sirui Chen', 'Qiaosheng Zhang', 'Xiang Wang', 'Ning Ding', 'Xia Hu', 'Bowen Zhou', 'Youbang Sun', 'Chaochao Lu'], 'affiliations': ['Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2609.00092.jpg', 'data': {'categories': ['#interpretability', '#alignment', '#long_context'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность из глубины: встроенное состояние вместо внешних ограничений', 'desc': 'В работе предложена архитектура Safin-1, которая встраивает безопасность как внутреннее, эволюционирующее состояние модели, а не как внешнее ограничение. Основу составляет алгоритм MARCH (Memory-Anchor Routing across Context History), который поддерживает структурированную память и селективно извлекает релевантную историческую информацию через content-conditioned routing. Модель поддерживает адаптацию во время инференса через специальное состояние безопасности, что позволяет контролируемую специализацию без модификации основной архитектуры. Работа демонстрирует, что безопасность может быть встроена как нативная способность модели, развивающаяся через её собственные вычисления и управление памятью.'}, 'en': {'title': 'Safety from Within: Evolving Model States for Intrinsic Safety', 'desc': "The paper introduces Safin-1, a novel memory-routing architecture that integrates safety directly into the model's internal state rather than relying on external constraints. This approach, termed 'Safety from Within', allows the model to adapt and maintain safety-relevant capabilities through its own computations. Safin-1 utilizes a technique called Memory-Anchor Routing across Context History (MARCH) to manage and retrieve structured memory states, enabling the model to specialize its capabilities without altering its core structure. The research demonstrates that this architecture significantly enhances safety in long-horizon tasks by allowing the model to evolve its behavior based on past experiences."}, 'zh': {'title': '安全性内生化：Safin-1的创新之路', 'desc': 'Safin-1提出了一种内存路由架构，将安全性作为模型内部不断演变的状态，而不是外部约束。该模型能够在长时间复杂任务中积累信息，保持内部状态，并在延续的交互中进行适应。安全性应当是模型自身的内在属性，而不是仅依赖外部保护措施或后期调整。通过内存锚定路由（MARCH），Safin-1实现了结构化的记忆状态和选择性检索相关历史信息，从而在模型的原生计算中有效地维护和演变安全能力。'}}}, {'id': 'https://huggingface.co/papers/2609.00768', 'title': 'DiagEvo: Diagnosis-Guided Self-Evolution via Hierarchical Error Memory', 'url': 'https://huggingface.co/papers/2609.00768', 'abstract': "Abstract DiagEvo improves language-model self-evolution by deriving training direction from internal failure history via hierarchical error-cause memory and double-confidence filtering, outperforming external-resource baselines.  Generated by thinkingmachines/Inkling-Small Self-play is an effective paradigm for language-model self-evolution, but without guidance, solver performance can plateau or decline across rounds. Unguided methods steer question generation with signals such as difficulty, learnability, or diversity. These signals keep questions challenging and varied but do not specify which unresolved reasoning weaknesses later rounds should target. Guided methods obtain direction from external task resources, including human examples, document corpora, or specified difficulty targets, and therefore rely on task information supplied outside the self-play loop. We show that the needed direction can instead be derived from the solver's own failure history. We introduce DiagEvo, whose diagnostician extracts recurring error causes from this history and stores them in a hierarchical error-cause memory. The memory groups related causes under skill nodes and tracks each as Active or Mastered according to self-consistency on targeted questions. The challenger uses these states and recurrence counts to balance cause-targeted generation with free exploration. Double-confidence filtering retains intermediate-difficulty questions only when the most common solver answer has a clear vote lead. DiagEvo derives its curriculum from information produced during self-play, without external task resources. With the default 4B diagnostician, DiagEvo outperforms every baseline in mean accuracy across all nine benchmarks for each of the three solvers: Qwen3-4B, Qwen3-8B, and OctoThinker-8B. On Qwen3-8B, it reaches 72.3% mean accuracy across five mathematical reasoning benchmarks, 4.5 percentage points above R-Zero. Its mean accuracy across all nine benchmarks is 57.4%, 1.1 percentage points above DARC. Ablations show that the hierarchical error-cause memory and double-confidence filtering both contribute to these gains.", 'score': 9, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'e57196526d792bbb', 'authors': ['Xincheng Wei', 'Yifan Ding', 'Yoshua Li', 'Dongsheng Ma', 'Rongxiang Weng', 'Xunliang Cai', 'Wenjian Ding', 'Yao Zhang'], 'affiliations': ['Faculty of Health Data Science, Juntendo University, Chiba, Japan', 'Meituan, LongCat Team', 'Peking University', 'School of Statistics and Data Science, LPMC, KLMDASR & AAIS, Nankai University, China', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2609.00768.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#training', '#math', '#rl'], 'emoji': '🔄', 'ru': {'title': 'Самообучение языковых моделей через анализ собственных ошибок', 'desc': 'DiagEvo — это метод самосовершенствования языковых моделей, который использует историю ошибок самой модели для определения направления обучения, вместо полагания на внешние ресурсы. Система включает иерархическую память причин ошибок, которая группирует ошибки по навыкам и отслеживает их статус (активные или освоенные), позволяя целенаправленно генерировать обучающие примеры. Двойной фильтр уверенности отбирает только вопросы среднего уровня сложности, где ответы моделей согласованы. Эксперименты показывают, что DiagEvo превосходит все базовые методы на девяти тестовых наборах, достигая 72.3% точности на математических задачах с Qwen3-8B.'}, 'en': {'title': 'Self-Improvement Through Self-Reflection in Language Models', 'desc': 'DiagEvo is a method that enhances the self-evolution of language models by using their own past mistakes to guide future training. It creates a hierarchical memory of error causes, allowing the model to focus on specific weaknesses while still exploring new challenges. This approach eliminates the need for external resources, making the training process more efficient and self-sufficient. By implementing double-confidence filtering, DiagEvo ensures that only the most relevant and appropriately challenging questions are used for training, leading to improved accuracy across various benchmarks.'}, 'zh': {'title': '自我进化的新方向：DiagEvo', 'desc': 'DiagEvo是一种改进语言模型自我进化的方法，它通过分析内部失败历史来确定训练方向。该方法使用层次错误原因记忆和双重置信过滤，能够超越依赖外部资源的基线模型。DiagEvo的诊断器提取重复的错误原因，并将其存储在层次结构中，以便更好地指导问题生成。实验结果表明，DiagEvo在多个基准测试中表现优异，平均准确率显著高于其他方法。'}}}, {'id': 'https://huggingface.co/papers/2609.00551', 'title': 'EM^2Mem: Event-Centric Multimodal Memory for Large Language Models', 'url': 'https://huggingface.co/papers/2609.00551', 'abstract': 'Abstract EM²Mem binds multimodal evidence to event anchors for compact, generation-ready memory in long-video question answering.  Generated by thinkingmachines/Inkling-Small Multimodal memory offers a scalable interface for long-video question answering, but existing methods often retrieve captions, frames, transcripts, summaries, or graph facts as isolated fragments. Although searchable, such fragments are not generation-ready: language models must reconstruct cross-modal and temporal alignments at inference time, when context is limited and attribution is difficult. We propose EM^2Mem, an event-centric multimodal memory framework that binds heterogeneous evidence to event anchors during memory construction. Each event-indexed memory cell aligns multimodal records, temporal context, graph-linked relations, semantic facts, and provenance, enabling compact evidence readout over grounded multimodal events rather than modality-specific fragments. Across three long-video QA benchmarks, EM^2Mem improves average accuracy over the strongest memory baseline by 2.0, 2.4, and 3.7 points, improves strict event-level Top-5 evidence recall by 7.0 points, and reduces per-query latency by 4.67 times and total inference tokens by 63.66% (The code will be integrated into https://github.com/zjunlp/LightMem).', 'score': 6, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'f05f53266a864ac9', 'authors': ['Yijun Chen', 'Yaqi Zheng', 'Yanya Li', 'Boyi Xiao', 'Buqiang Xu', 'Shuofei Qiao', 'Jizhan Fang', 'Xinle Deng', 'Yunzhi Yao', 'Xuehai Wang', 'Liuxin Zhang', 'Hui Li', 'Huajun Chen', 'Shumin Deng'], 'affiliations': ['Lenovo Group Limited', 'South China University of Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.00551.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#inference', '#video'], 'emoji': '🎬', 'ru': {'title': 'События как якоря мультимодальной памяти для вопросов о видео', 'desc': 'В работе предлагается EM²Mem — фреймворк мультимодальной памяти, центрированный на событиях для ответов на вопросы о длинных видео. Система связывает разнородные доказательства (текст, кадры, транскрипты, графы) с якорями событий во время построения памяти, создавая компактное представление, готовое для генерации. Благодаря выравниванию мультимодальных записей, временного контекста и семантических отношений, модель уменьшает необходимость реконструкции кросс-модальных связей на этапе инференса. Экспериментально показано улучшение точности на бенчмарках, снижение задержки и значительное сокращение числа токенов при генерации ответов.'}, 'en': {'title': 'Event-Centric Memory for Enhanced Long-Video QA', 'desc': 'The paper introduces EM²Mem, a framework designed to enhance long-video question answering by creating a multimodal memory system that organizes information around specific events. Unlike traditional methods that treat different types of data (like captions and frames) as separate pieces, EM²Mem binds these pieces together with event anchors, making it easier for language models to access relevant information. This approach allows for better alignment of multimodal data and temporal context, leading to more accurate and efficient responses. The results show significant improvements in accuracy and speed compared to existing memory systems, demonstrating the effectiveness of this event-centric memory construction.'}, 'zh': {'title': '事件中心的多模态记忆框架', 'desc': 'EM²Mem是一种事件中心的多模态记忆框架，旨在为长视频问答提供紧凑且适合生成的记忆。它通过将异构证据绑定到事件锚点，解决了现有方法中孤立片段的问题。这种方法能够在记忆构建过程中对多模态记录、时间上下文和语义事实进行对齐，从而实现更高效的证据读取。实验结果表明，EM²Mem在多个长视频问答基准上显著提高了准确率和检索效率。'}}}, {'id': 'https://huggingface.co/papers/2609.00621', 'title': 'Control-Data Flow Separation: Stable Prompt Optimization in Multi-Agent LLMs', 'url': 'https://huggingface.co/papers/2609.00621', 'abstract': 'Abstract The framework separates structured execution protocols from optimizable language content to prevent prompt optimization from corrupting multi-agent pipelines.  Generated by thinkingmachines/Inkling-Small Prompt optimization can improve multi-agent LLM systems, but the prompts being optimized often serve two entangled roles: generating task-relevant content and specifying execution-critical protocols, such as message routing, output formatting, and termination signals, on which the underlying code relies. As a result, a prompt edit intended to improve content generation can inadvertently corrupt the protocol and cause the entire agent pipeline to fail. Our key observation is that these two roles have different representations: execution protocols are typically structured, while task-relevant content is usually expressed in unstructured language. Based on this, we propose control-data flow separation, where execution-critical control is represented as typed, validated program objects, while task-relevant language remains the optimizable data flow for agent communication. This design allows optimizers to improve multi-agent behavior without exposing the routing or formatting interface to prompt drift. Across synthetic reasoning, collaborative review generation, and insurance rating workflows, our framework empirically achieves 100% eventual protocol validity while consistently improving task performance.', 'score': 5, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'cef7a36cf1e4a9ee', 'authors': ['Wentao Zhang', 'Syed Shariyar Murtaza', 'Junaid Ahmad Bhatti', 'Utkarsh Soni', 'Yifan Nie', 'Eugene Wen', 'Yuntian Deng'], 'affiliations': ['Manulife', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2609.00621.jpg', 'data': {'categories': [], 'emoji': '🔀', 'ru': {'title': 'Разделение управления и данных в мультиагентных системах для безопасной оптимизации', 'desc': 'Статья предлагает новый подход к оптимизации мультиагентных систем на основе LLM, разделяя выполнение программы на две части: структурированные протоколы управления и оптимизируемое языковое содержание. Авторы показывают, что при совместной оптимизации промптов протоколы маршрутизации и форматирования могут быть скомпрометированы, что приводит к отказам пайплайна. Предложенное решение использует типизированные объекты программы для управления потоком данных, оставляя только содержимое сообщений между агентами доступным для оптимизации. Экспериментальные результаты демонстрируют 100% корректность протоколов при одновременном улучшении производительности в задачах рассуждения, рецензирования и оценивания.'}, 'en': {'title': 'Optimizing Multi-Agent Systems Without Compromising Protocols', 'desc': 'This paper presents a framework that separates the structured execution protocols from the optimizable language content in multi-agent systems. The authors highlight that prompt optimization can enhance performance but risks corrupting critical execution protocols if not handled properly. By distinguishing between structured execution protocols and unstructured task-relevant content, the framework allows for safer optimization without compromising the integrity of the agent pipeline. The proposed method demonstrates significant improvements in task performance while maintaining protocol validity across various applications.'}, 'zh': {'title': '分离控制与内容，提升多智能体性能', 'desc': '本文提出了一种框架，将结构化执行协议与可优化的语言内容分开，以防止提示优化破坏多智能体管道。提示优化可以提升多智能体大语言模型系统的性能，但优化的提示往往同时承担生成任务相关内容和指定执行关键协议的双重角色。我们观察到这两种角色具有不同的表示方式：执行协议通常是结构化的，而任务相关内容通常以非结构化语言表达。基于此，我们提出了控制数据流分离的概念，使得执行关键控制以类型化、验证的程序对象表示，而任务相关语言则保持为可优化的数据流，从而在不影响路由或格式接口的情况下提升多智能体的行为。'}}}, {'id': 'https://huggingface.co/papers/2608.28612', 'title': 'InternReviewer & InternAdvocate: Objective Reward and Evaluation for Agentic Reinforcement Learning in Peer Review and Rebuttal', 'url': 'https://huggingface.co/papers/2608.28612', 'abstract': 'Abstract Specialized scholarly agents use reinforcement learning and real-time citation verification to improve reasoning and factual accuracy in peer review and rebuttal generation.  Generated by thinkingmachines/Inkling-Small Generating professional scholarly content, such as peer reviews and rebuttals, requires an intricate synergy between domain reasoning and factual grounding. This work presents a comprehensive framework for the development and evaluation of specialized scholarly agents, InternReviewer and InternAdvocate. We first establish a large-scale, high-quality scholarly dataset and integrate a high-efficiency arXiv retrieval tool to enable active evidence gathering. To optimize these agents, we implement an agentic Reinforcement Learning (RL) paradigm driven by a unified objective metric and reward system. This system avoids the biases of subjective model-based judging by employing multi-dimensional criteria, including reference-anchored semantic alignment, structural compliance, and a strict verification mechanism that cross-checks citations against real-time interaction logs to eliminate hallucinations. Experimental results demonstrate that agents trained within this closed-loop framework exhibit significant improvements in reasoning depth and citation accuracy.', 'score': 5, 'issue_id': 3202, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'eb9b60a8da54da8c', 'authors': ['Xuerui Su', 'Liya Guo', 'Qizhi Pei', 'Qipeng Guo', 'Zhongbo Tian', 'Lijun Wu', 'Kai Chen', 'Zun Wang'], 'affiliations': ['Beijing Jiaotong University', 'Renmin University of China', 'Shanghai AI Laboratory', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28612.jpg', 'data': {'categories': ['#reasoning', '#agents', '#dataset', '#science', '#optimization', '#hallucinations', '#benchmark', '#rl'], 'emoji': '📚', 'ru': {'title': 'Умные научные агенты с проверкой фактов через обучение с подкреплением', 'desc': 'В работе представлена система специализированных агентов для автоматического написания рецензий и возражений на научные статьи, использующая обучение с подкреплением и проверку цитат в реальном времени. Авторы разработали большой датасет высокого качества и интегрировали инструмент для поиска статей на arXiv, что позволяет агентам активно собирать доказательства. Для оптимизации агентов применяется система вознаграждений с многомерными критериями оценки, включая семантическое выравнивание, соответствие структуре и верификацию цитат. Экспериментальные результаты показывают, что агенты, обученные в этой замкнутой системе, демонстрируют значительное улучшение в глубине рассуждений и точности цитирования.'}, 'en': {'title': 'Enhancing Scholarly Review with Reinforcement Learning', 'desc': 'This paper introduces specialized scholarly agents that utilize reinforcement learning to enhance the quality of peer reviews and rebuttals. The agents, named InternReviewer and InternAdvocate, are developed using a large-scale scholarly dataset and a tool for efficient citation retrieval. A unique reinforcement learning framework is employed, which focuses on a unified objective metric and a reward system to minimize biases in evaluation. The results show that these agents significantly improve their reasoning capabilities and citation accuracy through a rigorous verification process.'}, 'zh': {'title': '提升学术代理的推理与准确性', 'desc': '本研究提出了一种专门的学术代理框架，旨在通过强化学习和实时引用验证来提高同行评审和反驳生成的推理能力和事实准确性。我们建立了一个大规模的高质量学术数据集，并集成了高效的arXiv检索工具，以支持主动证据收集。通过实施基于统一目标指标和奖励系统的代理强化学习范式，优化这些代理的表现，避免了主观模型判断的偏见。实验结果表明，在这一闭环框架内训练的代理在推理深度和引用准确性方面显著提升。'}}}, {'id': 'https://huggingface.co/papers/2609.01572', 'title': 'From Production Traffic to Post-Training: Building a Self-Hosted LLM That Covers the Corporate Request Mix', 'url': 'https://huggingface.co/papers/2609.01572', 'abstract': "Abstract A smaller self-hosted LLM trained with separate GRPO experts merged via SLERP outperforms a much larger baseline on instruction following, function-calling, and internal tasks while serving half of platform traffic at lower cost.  Generated by thinkingmachines/Inkling-Small Data-residency constraints force enterprises to self-host LLMs, but continuous adoption of newer models without decommissioning their predecessors expands the serving fleet, fragmenting a finite GPU pool. We consolidate traffic from over 200 internal applications onto a single model by closing quality gaps identified through production error analysis along three axes: instruction following, function-calling, and internal task distribution. Quality is tracked by offline benchmarks stratified to production traffic and scored by deterministic verifiers or calibrated LLM judges. Rather than optimising all objectives jointly, which introduces cross-domain reward interference, we train a separate GRPO expert per axis and merge them via two-stage SLERP. Each expert's reward exposes a distinct failure mode, namely semantic collapse, over-calling, and verbosity hacking, each requiring a domain-specific fix. In non-reasoning mode the recipe surpasses a {sim}7times larger by total parameters baseline on the in-house Arena with 69.6 to 65.8, instruction following with 0.85 to 0.83, and function-calling with 0.79 to 0.77, while lifting general dialogue benchmarks. The model absorbs 50% of platform traffic, 116M requests per month, at a fraction of the serving cost.", 'score': 4, 'issue_id': 3203, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '32c8c09e8cd79591', 'authors': ['Olga Tsymboi', 'Dmitrii Stoianov', 'Ramil Latypov', 'Danil Taranets', 'Daniil Dryabin', 'Mikhail Gashkov', 'Viktor Zelenkovskiy', 'Aleksandr Fida', 'Gleb Alektorov', 'Nikita Gulyakov', 'Arthur Babkin', 'Aleksandr Medvedev', 'Pavel Gein', 'Anatolii Potapov'], 'affiliations': ['T-Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.01572.jpg', 'data': {'categories': ['#small_models', '#benchmark', '#training', '#rlhf'], 'emoji': '⚡', 'ru': {'title': 'Слияние экспертов вместо размера: как компактная LLM заменила гигант', 'desc': 'Исследователи разработали компактную самостоятельно размещённую LLM, которая обучается несколькими специализированными экспертами GRPO, оптимизированными для разных задач: следования инструкциям, вызова функций и внутренних приложений. Вместо совместной оптимизации всех целей, что вызывает конфликты между областями обучения, авторы тренируют отдельного эксперта для каждой оси и объединяют их через двухэтапную SLERP интерполяцию. Каждый эксперт выявляет уникальный тип ошибок — коллапс семантики, чрезмерный вызов функций и манипуляция многословностью — требующих специфичных для области решений. Полученная модель превосходит базовый вариант в семь раз больший по параметрам и обслуживает половину трафика платформы (116 млн запросов в месяц) при значительно меньших затратах на вычисления.'}, 'en': {'title': 'Smaller Model, Bigger Impact: Efficient LLM Performance', 'desc': "This paper presents a smaller self-hosted language model (LLM) that outperforms a significantly larger baseline model in various tasks such as instruction following and function-calling. The authors address the challenge of managing GPU resources by consolidating traffic from over 200 applications onto a single model, which is trained using separate Generalized Reward Policy Optimization (GRPO) experts for different tasks. By merging these experts through a two-stage Spherical Linear Interpolation (SLERP), the model effectively mitigates issues like semantic collapse and verbosity. The resulting model not only handles half of the platform's traffic but also does so at a lower operational cost while maintaining high performance across benchmarks."}, 'zh': {'title': '小模型，大智慧：自托管LLM的成功之道', 'desc': '这篇论文介绍了一种较小的自托管大型语言模型（LLM），通过将不同的GRPO专家合并，使用SLERP方法，能够在指令跟随、函数调用和内部任务上超越一个更大的基线模型。由于数据驻留的限制，企业需要自托管LLM，但不断采用新模型会导致GPU资源的分散。我们通过分析生产错误，识别质量差距，并在三个方面进行改进，成功将200多个内部应用的流量整合到一个模型上。最终，这个模型以更低的成本处理了50%的平台流量，显示出优越的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.01481', 'title': 'Harness-of-Harness: Multi-Day Autonomous Software Development with Continual Improvement', 'url': 'https://huggingface.co/papers/2609.01481', 'abstract': 'Abstract Harness-of-Harness enables autonomous coding agents to iteratively improve software through structured planning-coding-testing loops, yielding substantial performance gains and fully developed applications.  Generated by thinkingmachines/Inkling-Small This paper studies autonomous software development, in which LLM-based coding agents transform high-level requirements into complete, functional, and usable software systems without human intervention. We introduce Harness-of-Harness (HoH), a framework that enables coding agents to continually improve software during autonomous development. HoH operates on existing coding-agent harnesses, and organizes their executions into iterative planning-coding-testing loops. To sustain improvement across loops, HoH balances repair with capability growth, scopes development into small and verifiable increments, separates implementation-time testing from independent evaluation, and constrains verifiable outputs rather than prescribing agent workflows. It progressively exposes deliverables, role-specific tools, and skills, encourages reuse rather than recreation, and maintains versioned project histories. On GameCraft-Bench, FrontierSWE, and ProgramBench, three harness-model pairs (Codex with GPT-5.5, OpenCode with DeepSeek-V4-Pro, and Pi with MiniMax-M3), HoH consistently outperforms the corresponding standalone harnesses, achieving an average relative gain of 52.25 percent and a maximum gain of 82.86 percent after three iterations. In a multi-day deployment with more than 70 iterations, HoH autonomously develops a first-person-shooter game, featuring a coherent storyline, fully implemented core mechanics, human-playable experience, polished visuals and integrated audio. Github: https://github.com/Flesymeb/HarnessOfHarness Project Page: https://flesymeb.github.io/HarnessOfHarness/', 'score': 4, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '48b655b3f59e09af', 'pdf_title_img': 'assets/pdf/title_img/2609.01481.jpg', 'data': {'categories': ['#benchmark', '#agents', '#plp'], 'emoji': '🔄', 'ru': {'title': 'Итеративное совершенствование автономной разработки через циклы планирования-кодирования-тестирования', 'desc': 'В этой работе предлагается фреймворк Harness-of-Harness (HoH) для автономной разработки программного обеспечения с использованием LLM-агентов. Система организует работу кодирующих агентов в итеративные циклы планирования-кодирования-тестирования, что позволяет последовательно улучшать качество генерируемого кода. HoH балансирует между исправлением ошибок и расширением функциональности, разбивая разработку на верифицируемые инкременты и поддерживая историю версий проекта. На трёх бенчмарках (GameCraft-Bench, FrontierSWE, ProgramBench) фреймворк показал улучшение на 52% в среднем, а в долгосрочном эксперименте успешно разработал полнофункциональную видеоигру.'}, 'en': {'title': 'Empowering Autonomous Software Development with Harness-of-Harness', 'desc': 'The paper presents Harness-of-Harness (HoH), a framework designed for autonomous software development using coding agents powered by large language models (LLMs). HoH facilitates iterative improvement of software through structured planning, coding, and testing loops, allowing agents to transform high-level requirements into complete applications without human input. It emphasizes balancing repair and capability growth, scoping development into manageable increments, and maintaining versioned project histories to ensure continuous enhancement. The results show that HoH significantly outperforms standalone coding harnesses, achieving impressive performance gains in developing complex software systems like a first-person shooter game.'}, 'zh': {'title': 'Harness-of-Harness：自主软件开发的新框架', 'desc': '这篇论文研究了自主软件开发，提出了一种名为Harness-of-Harness（HoH）的框架，旨在通过结构化的规划-编码-测试循环，使编码代理能够不断改进软件。HoH利用现有的编码代理工具，组织其执行过程，以实现迭代的开发和持续的性能提升。该框架通过平衡修复与能力增长，确保开发过程中的小步验证，促进了软件的高效生成。实验结果表明，HoH在多个基准测试中显著优于独立的编码工具，展示了其在自主开发中的强大能力。'}}}, {'id': 'https://huggingface.co/papers/2608.30478', 'title': 'Agents in the Large: Perception-Centered Architecture for Persistent Agents', 'url': 'https://huggingface.co/papers/2608.30478', 'abstract': "Abstract The paper proposes a perception-centered architecture for persistent language agents that continuously adapt service procedures by perceiving signals from tasks, context, and environmental changes.  Generated by thinkingmachines/Inkling-Small Cognitive language agents have achieved substantial progress by equipping language models with memory, tools, and decision-making procedures, enabling agents to reason and act in interactive environments. Existing frameworks largely cast these agents as systems for solving user-specified, bounded tasks. An increasingly important goal is for language agents to provide persistent assistance in long-lived settings where user needs, context, and service procedures persist and change, and to remain useful across the broad range of tasks that arise over time. Yet we still lack a framework to characterize persistent AI agents, organize existing work, and guide future development. To this end, we propose a Perception-Centered Architecture for Persistent Agents (Pera). Pera describes a persistent agent organized around perception and control components that continually perceive service-relevant signals from episodic task executions, internal context, and changes in the surrounding environment, and use these signals to construct lifecycle tasks. These tasks drive the ongoing operation and adaptation of the agent's service procedures. We use Pera to retrospectively organize recent work, examine a detailed case study, and offer forward-looking insights for building more capable persistent agents. Just as software engineering moved from programming in the small to programming in the large, Pera frames the evolution of language agents as an analogous architectural transition toward long-lived, adaptive intelligence systems.", 'score': 4, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '28da51590b9f610b', 'authors': ['Shihan Dou', 'Haoxiang Jia', 'Shichun Liu', 'Feng Chen', 'Chenhao Huang', 'Yujiong Shen', 'Shaofan Liu', 'Jiayi Chen', 'Jiahang Lin', 'Honglin Guo', 'Qianyu He', 'Minghao Guo', 'Ziyi Ye', 'Pluto Zhou', 'Tao Gui', 'Qi Zhang', 'Xuanjing Huang'], 'affiliations': ['CCDS, Nanyang Technological University', 'Hunyuan Team, Tencent', 'NLP Lab, Fudan University', 'PL Lab, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30478.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'От статичных помощников к живым адаптивным агентам', 'desc': 'В статье предложена архитектура для персистентных языковых агентов, которые непрерывно адаптируют свои процедуры обслуживания на основе сигналов от задач, контекста и изменений окружающей среды. Авторы вводят концепцию Perception-Centered Architecture for Persistent Agents (Pera), организованную вокруг компонентов восприятия и управления, которые постоянно анализируют релевантные сигналы из выполнения задач, внутреннего контекста и экологических изменений. Эта архитектура преобразует собранные сигналы в задачи жизненного цикла, которые направляют адаптацию служебных процедур агента. Работа предлагает переход в разработке языковых агентов от решения отдельных ограниченных задач к созданию долгоживущих адаптивных интеллектуальных систем, способных оставаться полезными в долгосрочных взаимодействиях.'}, 'en': {'title': 'Building Adaptive Language Agents for Persistent Assistance', 'desc': 'This paper introduces a new framework called Perception-Centered Architecture for Persistent Agents (Pera), designed for language agents that need to adapt continuously to changing tasks and environments. Pera focuses on how these agents can perceive relevant signals from their surroundings and internal states to improve their service procedures over time. The goal is to create agents that can provide ongoing assistance in various contexts, rather than just solving specific tasks. By organizing existing research and providing a case study, the paper aims to guide the development of more capable and adaptive language agents.'}, 'zh': {'title': '以感知为中心的持久语言代理架构', 'desc': '本文提出了一种以感知为中心的架构，用于持久语言代理，这些代理能够通过感知任务、上下文和环境变化的信号来持续适应服务程序。通过结合记忆、工具和决策程序，语言代理在互动环境中实现了显著进展。现有框架主要将这些代理视为解决用户指定的有限任务的系统，而本文的目标是使语言代理在长期环境中提供持续的帮助，适应不断变化的用户需求和服务程序。我们提出的Pera架构为持久AI代理的特征化、现有工作的组织和未来发展的指导提供了框架。'}}}, {'id': 'https://huggingface.co/papers/2608.30730', 'title': 'E-Commerce Bench: Evaluating LLM Agents on Long-Horizon Autonomous Business Operation', 'url': 'https://huggingface.co/papers/2608.30730', 'abstract': 'Abstract A year-long e-commerce benchmark evaluates LLM agents on multi-store negotiation, dynamic market events, and long-horizon policy adaptation across 18 frontier models.  Generated by thinkingmachines/Inkling-Small Long-horizon agentic tasks go beyond chaining short tasks over more interaction turns. Their evolving dynamic environments and long-range dependencies require Large Language Models (LLMs) to continually explore, learn from experience, and adapt their policies over thousands of steps. We introduce E-Commerce Bench, the first open-source benchmark that integrates multi-round counterpart negotiation and dynamic events into a year-long business operation. Over a 365-day year, an LLM agent concurrently runs mult
