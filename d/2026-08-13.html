    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.00677', 'title': 'OpenART: Scaling Agent Red Teaming via Open-Ended Environment Evolution', 'url': 'https://huggingface.co/papers/2608.00677', 'abstract': "Abstract OpenART introduces a scalable red-teaming arena with evolving stateful environments to evaluate long-horizon AI agent safety, using the EMHA attack policy to expose increasing failure rates as task complexity grows.  Generated by thinkingmachines/Inkling-Small AI agents operate in persistent environments where early state changes can influence decisions far into the future. Unlike conventional language-model interactions, agent behavior is mediated through a shared state that is repeatedly modified and reused across long-horizon workflows. Current safety benchmarks often fail to capture these cumulative risks because they focus on short, static tasks. To address these limitations, we introduce OpenART, an open-ended arena for scalable agent red teaming through environment evolution. OpenART provides over 10,000 validated stateful scenarios across 50 domains, drawing from a pool of more than 500,000 tools and skills. These tasks require a median of 97 tool calls and enable unified evaluation across 75 different agent-model configurations. To systematically explore these evolving attack surfaces, we propose the Evolutionary Markov Hypergraph Attack (EMHA). EMHA is a black-box policy that performs feedback-driven environment evolution by coordinating authorized state transitions without requiring parameter updates. Throughout the evaluation, task objectives remain fixed while only the environment state changes. Across all configurations, EMHA achieves a pooled Attack Success Rate (ASR) of 85.0%. Its advantage over instruction-only evolution increases from approximately 2% on simple environments to over 17% on the most complex ones, demonstrating that environment evolution increasingly exposes safety failures as task complexity grows. Furthermore, our analysis shows that the specific runtime implementation of an agent explains a significant portion of safety variation beyond the underlying model's capabilities. These results establish OpenART as a scalable foundation for studying agent safety in complex, evolving environments.", 'score': 99, 'issue_id': 2951, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '39f38029b1b8e2e6', 'authors': ['Yunhao Chen', 'Xin Wang', 'Yixu Wang', 'Yi Liu', 'Jie Li', 'Yan Teng', 'Xingjun Ma', 'Xia Hu', 'Yu-Gang Jiang'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'XSafeAI'], 'pdf_title_img': 'assets/pdf/title_img/2608.00677.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Эволюция окружения как инструмент для выявления уязвимостей AI-агентов', 'desc': 'В статье представлена платформа OpenART для систематического тестирования безопасности AI-агентов в долгосрочных задачах с использованием эволюционирующих окружений. Авторы предлагают метод EMHA (Evolutionary Markov Hypergraph Attack), который генерирует возрастающие по сложности сценарии атак через эволюцию состояния окружения без обновления параметров модели. Платформа содержит более 10 тысяч валидированных сценариев с сохраняющимся состоянием в 50 различных доменах и позволяет оценивать 75 конфигураций агентов. Результаты показывают, что с ростом сложности задач метод EMHA всё более эффективно выявляет проблемы безопасности, достигая уровня успешных атак в 85%.'}, 'en': {'title': 'Evaluating AI Safety in Evolving Environments with OpenART', 'desc': 'OpenART is a new platform designed to test the safety of AI agents in complex and changing environments. It uses a method called the Evolutionary Markov Hypergraph Attack (EMHA) to simulate how agents respond to evolving tasks over time. This approach reveals that as tasks become more complicated, the likelihood of AI agents failing increases significantly. OpenART offers a large variety of scenarios to ensure comprehensive evaluation of agent behavior and safety across different configurations.'}, 'zh': {'title': 'OpenART：评估AI代理安全性的可扩展平台', 'desc': 'OpenART是一个可扩展的红队测试平台，旨在评估长期AI代理的安全性。它使用演化的状态环境和EMHA攻击策略，揭示任务复杂性增加时的失败率。与传统的语言模型交互不同，代理行为通过共享状态进行调控，这种状态在长时间工作流中反复修改和重用。OpenART提供超过10,000个经过验证的状态场景，能够系统性地探索演变的攻击面，成为研究复杂环境中代理安全性的基础。'}}}, {'id': 'https://huggingface.co/papers/2608.12307', 'title': 'AI4AI at Test-Time: Strong-to-Weak Capability Transfer via Harnesses', 'url': 'https://huggingface.co/papers/2608.12307', 'abstract': "Abstract Stronger models can build inference-time harnesses that substantially improve weaker models' task performance without parameter updates by offloading reasoning into structured code and routing.  Generated by thinkingmachines/Inkling-Small Recent work on distillation transfers the capabilities of large models to smaller ones often by updating the latter's parameters, through teacher forcing, on-policy distillation, and related training-time methods. In this paper, we ask whether such transfer can instead occur at test time. We study strong-to-weak scaffolding: whether a stronger builder model can construct inference-time harnesses that help a weaker target model solve tasks more reliably without any parameter updates. Using four representative Theory-of-Mind benchmarks, each builder model uses 5% of the data as a validation set to iteratively refine its harness over multiple rounds, after which the finalized harness is evaluated on the full test set. Empirically, this form of test-time capability transfer is highly effective, nearly doubling average target-model performance from 0.49 to 0.91. Our analysis shows that the gains come primarily from offloading unstable model reasoning into deterministic code, benchmark-specific routing, and strict answer-format enforcement, rather than from encouraging the target model to reason more extensively or sample more broadly. We further find that builder-model reasoning effort improves harness quality monotonically, platform effects are modest relative to the builder model's own capability, and weaker target models receive the largest gains. These results suggest that inference-time harness design is an important complement to conventional training-time distillation, enabling strong models to transfer cognitive structure to weaker models without retraining.", 'score': 72, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'bcb940d633c2cf52', 'authors': ['Cheng Qian', 'Wenting Zhao', 'Liangwei Yang', 'Heng Wang', 'Jielin Qiu', 'Heng Ji', 'Silvio Savarese', 'Huan Wang', 'Shelby Heinecke'], 'affiliations': ['Salesforce AI Research', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.12307.jpg', 'data': {'categories': ['#small_models', '#training', '#transfer_learning', '#inference', '#reasoning'], 'emoji': '🏗️', 'ru': {'title': 'Помощник сильной модели: трансфер знаний через инференс-время конструкции', 'desc': 'В работе исследуется возможность передачи способностей от более мощных моделей к более слабым моделям во время инференса, без обновления параметров. Сильная модель-строитель создает специальные вспомогательные структуры (harnesses), которые включают детерминированный код, маршрутизацию и форматирование ответов для улучшения производительности целевой модели. Экспериментально показано, что такой подход значительно повышает эффективность - в среднем с 0.49 до 0.91 на бенчмарках Theory-of-Mind. Результаты демонстрируют, что передача когнитивной структуры через инференс-время дизайн может быть эффективной альтернативой традиционной дистилляции с переобучением параметров.'}, 'en': {'title': 'Empowering Weaker Models with Stronger Inference-Time Harnesses', 'desc': 'This paper explores a novel approach to enhance the performance of weaker machine learning models during inference without changing their parameters. It introduces the concept of strong-to-weak scaffolding, where a stronger model creates structured inference-time harnesses that guide the weaker model in solving tasks more effectively. The study demonstrates that this method can significantly improve the performance of the target model, nearly doubling its effectiveness on specific benchmarks. The findings indicate that the improvements stem from offloading complex reasoning into structured code and enforcing strict answer formats, rather than simply increasing the reasoning capacity of the weaker model.'}, 'zh': {'title': '推理时能力转移：强模型助力弱模型', 'desc': '本文探讨了如何在测试时将强模型的能力转移到弱模型，而无需更新参数。通过构建推理时的结构化代码和路由，强模型可以帮助弱模型更可靠地完成任务。研究表明，这种测试时能力转移显著提高了弱模型的性能，几乎将其平均表现从0.49提升到0.91。结果表明，推理时的设计是传统训练时蒸馏的重要补充，能够在不重新训练的情况下将认知结构转移给弱模型。'}}}, {'id': 'https://huggingface.co/papers/2608.11924', 'title': 'Spark-to-Paper: End-to-End Research Paper Generation as a Composable Skill', 'url': 'https://huggingface.co/papers/2608.11924', 'abstract': 'Abstract Spark-to-Paper is a lightweight, composable workflow inside coding assistants that generates research papers by separating planning from reporting, enforcing evidence-based claim revision, and using integrity checks to reduce fabrication.  Generated by thinkingmachines/Inkling-Small Turning a research idea into a complete paper requires more than text generation: the system must retrieve literature, design and execute experiments, revise claims according to evidence, produce publication-ready figures, and maintain consistency across a long generation process. We present Spark-to-Paper, an end-to-end research paper generation system implemented as thirteen composable skills inside an existing coding assistant, without requiring a separate agent platform or orchestration service. Spark-to-Paper separates model-based judgment from deterministic operations that can be directly executed and checked. It further separates experiment planning from reporting, so that required evidence is specified before results are observed and manuscript claims are revised according to measured outcomes. To improve reliability over long research trajectories, the system combines deterministic integrity checks with self-critique and bounds a failure mode we call the Self-Refutation Loop, in which repeated experiments continue to reject the original research objective. Spark-to-Paper also produces editable vector figures through programmatic plotting for experimental results and code-based reconstruction for generated method diagrams. Across eight controlled research topics, Spark-to-Paper achieves 99.5% citation validity and 96.4% figure editability. A controlled ablation increases fabrication detection from 14% for a single-pass draft to 92% with the full integrity and review stack, while adversarial review achieves 74% precision. The full system uses 11.9M tokens, costs $8.1 per manuscript, and requires 3.2 hours on average. These results show that end-to-end research paper generation can be implemented as a lightweight, composable workflow inside existing coding assistants while keeping experimental evidence central to how claims are accepted, revised, or abandoned.', 'score': 65, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'eefa211984d29d4b', 'authors': ['Zhuoyang Qian', 'Biao Wu', 'Yiran Wang', 'Chris D Yan', 'Desan Dai', 'Liangwei Zheng', 'Jin Jiang', 'Junsheng Zhang', 'Wenhao Wang'], 'affiliations': ['University of Technology Sydney', 'Vast Intelligence Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.11924.jpg', 'data': {'categories': ['#long_context', '#science', '#hallucinations'], 'emoji': '📄', 'ru': {'title': 'Исследования, не выдуманные: автоматическая генерация статей с проверкой доказательств', 'desc': 'Spark-to-Paper — это система для автоматической генерации научных статей, встроенная в coding assistant в виде 13 компонуемых навыков. Система разделяет планирование экспериментов от их проведения и отчётности, что позволяет формировать доказательственную базу до того, как будут сделаны заявления. Для повышения надёжности применяются детерминированные проверки целостности, самокритика и механизмы обнаружения фабрикации с достижением 92% при полном наборе проверок. Система демонстрирует высокую валидность цитирований (99.5%) и редактируемость фигур (96.4%) при относительно низкой стоимости ($8.1 за статью).'}, 'en': {'title': 'Automating Research: Evidence-Driven Paper Generation', 'desc': 'Spark-to-Paper is a novel system designed to automate the generation of research papers by integrating various machine learning techniques. It separates the planning of experiments from the reporting of results, ensuring that claims are revised based on actual evidence gathered during the research process. The system employs integrity checks to minimize the risk of fabricating data and enhances reliability through self-critique mechanisms. With impressive metrics like 99.5% citation validity and 96.4% figure editability, Spark-to-Paper demonstrates that a structured, composable approach can effectively streamline the research paper creation process.'}, 'zh': {'title': '轻松生成高质量研究论文的智能助手', 'desc': 'Spark-to-Paper 是一个轻量级的研究论文生成系统，它通过将规划与报告分开，确保基于证据的声明修订，并使用完整性检查来减少虚假信息。该系统实现了十三个可组合的技能，能够在现有的编码助手中生成完整的研究论文，而无需单独的平台或协调服务。它将模型判断与可直接执行和检查的确定性操作分开，并在观察结果之前指定所需的证据，从而提高了研究的可靠性。通过程序化绘图生成可编辑的图形，Spark-to-Paper 在八个受控研究主题中实现了99.5%的引用有效性和96.4%的图形可编辑性。'}}}, {'id': 'https://huggingface.co/papers/2608.08160', 'title': 'Can LLM Agents Stick to the Script? A Benchmark for Long-Horizon Consistency in Interactive Narratives', 'url': 'https://huggingface.co/papers/2608.08160', 'abstract': 'Abstract The study introduces a benchmark and formalizes narrative commitment preservation to evaluate long-horizon logical consistency in interactive storytelling with large language models.  Generated by thinkingmachines/Inkling-Small The rapid advancement of Large Language Models (LLMs) is revolutionizing AI for Games by enabling open-ended and fluid interactive storytelling. However, existing research has largely overlooked the critical challenge of maintaining long-horizon logical consistency and narrative integrity against unconstrained user interventions. To address this, we formulate this challenge as Narrative Commitment Preservation (NCP), and take interactive narrative as our testbed. We introduce NCP-Bench, a benchmark of 100 narrative environments derived from movie synopses. Each environment includes a structured narrative specification (trajectory, commitments, and initial facts) that we can automatically check throughout the interaction between the player agent and the narrator agent. Experiments across state-of-the-art LLMs reveal a substantial long-horizon consistency gap: high linguistic quality does not guarantee commitment preservation; even strong models frequently generate logically conflicting content under adversarial interventions, with the best-performing model (GPT-5.2) achieving only 42% survival rate after 20 turns and fact conflict rates ranging from 40% to 68% across models, and only isolated runs satisfying all achievement commitments within the 100-turn limit.', 'score': 25, 'issue_id': 2950, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '6913f7c9b84dadf4', 'authors': ['Yingpeng Ma', 'Jianhao Yan', 'Bei Shi', 'Ka Hou Kam', 'Runnan Wang', 'Xuebo Liu', 'Yulong Chen', 'Yue Zhang', 'Derek F. Wong'], 'affiliations': ['Harbin Institute of Technology, Shenzhen, China', 'NLP2CT Lab, University of Macau, Macau, China', 'University of Aberdeen, Aberdeen, United Kingdom', 'University of Cambridge, Cambridge, United Kingdom', 'Westlake University, Hangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.08160.jpg', 'data': {'categories': ['#agents', '#story_generation', '#benchmark', '#games', '#long_context', '#reasoning', '#dataset'], 'emoji': '📖', 'ru': {'title': 'Логическая согласованность повествования в играх с использованием нейросетей', 'desc': 'В статье представлен новый бенчмарк NCP-Bench для оценки способности больших языковых моделей сохранять логическую согласованность на протяжении длительного интерактивного повествования. Авторы формализуют задачу сохранения нарративных обязательств (Narrative Commitment Preservation) как критическую проблему при использовании LLM для интерактивных игровых историй. Через эксперименты на современных моделях выявлено значительное расхождение между качеством текста и способностью поддерживать логическую согласованность, где даже лучшие модели генерируют конфликтующие факты. Результаты показывают, что стабильность нарратива остаётся серьёзным вызовом для LLM-систем при адверсариальных вмешательствах пользователя.'}, 'en': {'title': 'Ensuring Coherent Storytelling in AI with Narrative Commitment Preservation', 'desc': 'This paper addresses the challenge of maintaining logical consistency in interactive storytelling using large language models (LLMs). It introduces the concept of Narrative Commitment Preservation (NCP), which focuses on ensuring that the narrative remains coherent despite user interactions. The authors present NCP-Bench, a benchmark consisting of 100 narrative environments to evaluate how well different LLMs can preserve narrative commitments. Experiments show that even advanced models struggle with long-horizon consistency, highlighting a significant gap between linguistic quality and logical coherence in generated narratives.'}, 'zh': {'title': '维护叙事一致性，提升互动体验', 'desc': '本研究提出了一个基准，并正式定义了叙事承诺保持（Narrative Commitment Preservation, NCP），以评估大型语言模型在互动叙事中的长期逻辑一致性。随着大型语言模型的快速发展，AI在游戏中的应用正在改变开放式和流畅的互动叙事方式。然而，现有研究在维护长期逻辑一致性和叙事完整性方面面临重大挑战，尤其是在用户干预的情况下。我们引入了NCP-Bench，这是一个基于电影梗概的100个叙事环境的基准，旨在自动检查玩家代理与叙述者代理之间的互动中的叙事承诺。'}}}, {'id': 'https://huggingface.co/papers/2608.12314', 'title': 'StateFlow: Building, Evolving, and Accessing 3D World States for Previsualization', 'url': 'https://huggingface.co/papers/2608.12314', 'abstract': 'Abstract StateFlow introduces a persistent 3D world state to enable iterative, controllable previsualization for film and game design by constructing, evolving, and accessing structured scene and camera representations.  Generated by thinkingmachines/Inkling-Small Previsualization is an intermediate layer between ideas and production in film, games, architecture, and urban design. It lets creators iteratively refine scenes, actions, cameras, and spatial-temporal dynamics. Yet existing generative methods rely on simple prompts to jointly control all of these factors through one-shot image or video synthesis, offering weak controllability and limited support for iterative editing. Fundamentally, a world comprises multiple elements with geometry, appearance, and other attributes, together with cameras. Different frames are produced through local modifications or recombinations of this shared state, which is otherwise largely reused. Therefore, we argue that the missing component is an explicit and persistent working state. To address this, we present StateFlow, a state-centric framework for generative previsualization. Rather than generating videos in one shot, StateFlow uses an editable 3D world to organize scene structure, evolution, and cameras, while off-the-shelf video models enhance visual quality when higher fidelity is desired. This world is maintained as a persistent structured 3D state of scene elements and camera configurations, serving as the core working representation for previsualization. Built on this insight, StateFlow has three stages to construct, evolve, and access the world state. State construction lifts generated 2D content into a coherent 3D world through prior-guided, conflict-aware dual-view initialization, while State evolution translates user intent into structured state transitions while preserving world memory, avoiding full-scene regeneration for each edit. State access uses render-feedback reflection to refine camera plans into visually feasible trajectories, avoiding reliance on VLM semantics alone. Experiments show that StateFlow produces high-quality 3D worlds for video creation and game-like prototyping.', 'score': 22, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'a6ee2f850d4a09fd', 'authors': ['Yuyang Yin', 'Zixiang Li', 'Longxuan Deng', 'Hongkai Li', 'Shifang Zhao', 'Junnan Liu', 'Weirong Huang', 'Mengyu Wang', 'Tianxiao Fu', 'Yikai Wang', 'Peng-Shuai Wang', 'Xiaojie Jin', 'Yao Zhao', 'Yunchao Wei'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'Beijing Jiaotong University', 'Beijing Normal University', 'Mootion AI', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.12314.jpg', 'data': {'categories': ['#open_source', '#games', '#multimodal', '#3d', '#video'], 'emoji': '🎬', 'ru': {'title': 'Персистентное 3D состояние мира для контролируемой генеративной превизуализации', 'desc': 'StateFlow представляет инновационный подход к генеративной превизуализации, вводя персистентное 3D представление мира вместо традиционного одноразового синтеза видео. Система использует трёхступенчатый процесс: конструирование согласованного 3D мира из 2D контента, эволюцию состояния мира в соответствии с намерениями пользователя, и доступ к миру через рендеринг с обратной связью для уточнения камер. Такой подход обеспечивает гораздо лучшую контролируемость и поддержку итеративного редактирования сцен для кино, игр и архитектурной визуализации. StateFlow демонстрирует, что структурированное состояние сцены служит более эффективной рабочей репрезентацией, чем совместное управление всеми элементами через единую генерацию.'}, 'en': {'title': 'Empowering Creators with Persistent 3D World States', 'desc': 'StateFlow is a framework designed for generative previsualization in film and game design, allowing creators to build and manipulate a persistent 3D world state. It enables iterative refinement of scenes, actions, and camera dynamics, overcoming limitations of existing methods that rely on one-shot synthesis. By maintaining a structured 3D representation of scene elements and camera configurations, StateFlow facilitates efficient state construction, evolution, and access. This approach enhances controllability and visual quality, making it easier for creators to visualize and edit their ideas before production.'}, 'zh': {'title': 'StateFlow：可控的三维预可视化框架', 'desc': 'StateFlow 是一个用于生成预可视化的框架，它引入了一个持久的三维世界状态，使得电影和游戏设计中的场景和相机表现可以迭代和可控。该框架通过构建、演变和访问结构化的场景和相机表示，帮助创作者逐步完善场景、动作和空间时间动态。与现有的生成方法不同，StateFlow 允许在编辑过程中保持世界状态，避免每次编辑都需要重新生成整个场景。实验表明，StateFlow 能够生成高质量的三维世界，适用于视频创作和游戏原型设计。'}}}, {'id': 'https://huggingface.co/papers/2608.12036', 'title': 'Mechanist: AI as a Scientific Instrument for Discovering the Mechanisms of Intelligence', 'url': 'https://huggingface.co/papers/2608.12036', 'abstract': 'Abstract Mechanist is an autonomous agentic system that uses AI to discover and control the mechanisms underlying model intelligence, generating hypotheses, performing causal interventions, and improving safety and performance.  Generated by thinkingmachines/Inkling-Small AI models have achieved remarkable success across diverse domains, yet the mechanisms underlying their capabilities and the risks they may pose remain poorly understood. As AI development becomes faster and increasingly automated, mechanistic exploration remains largely manual, widening the gap between what models can do and our ability to understand and control them. To bridge this gap, we introduce Mechanist, an agentic system that uses AI as a scientific instrument for the autonomous discovery of mechanisms underlying AI intelligence. To support autonomous mechanistic discovery, we construct an interpretability-focused knowledge graph of approximately 13,000 papers and integrate it with a multidisciplinary database of 43 million papers spanning 26 fields. We further curate a library of 32 foundational methods for mechanism analysis, causal intervention, and validation. Compared with Claude Code and existing AI-scientist systems, Mechanist generates more valuable mechanism hypotheses and executes experiments more reliably. Mechanist also demonstrates a progression from discovering model behaviors to explaining and controlling AI models. Specifically, Mechanist first uncovers a counterintuitive safety risk in scientific laboratories, showing that unsafe traits can transfer across modalities through apparently safe training data. Mechanist then develops a mechanism theory of belief, revealing how models represent world knowledge, form beliefs, infer the beliefs of others, and how these mechanisms emerge during pretraining. Finally, Mechanist translates these mechanistic insights into practical interventions that improve model performance across diverse scenarios and steer scientific foundation models toward generating DNA sequences with specified properties.', 'score': 21, 'issue_id': 2953, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '124fbbfbe16e204a', 'authors': ['Mengru Wang', 'Junfeng Fang', 'Shuofei Qiao', 'Zhenqian Xu', 'Haoming Xu', 'Haoxiong Wang', 'Shumin Deng', 'Linyi Yang', 'Zhixiang Cui', 'Xin Xu', 'Yunzhi Yao', 'Buqiang Xu', 'Fei Shen', 'Haozhe Luo', 'Yunxiang Wei', 'Ningyu Zhang', 'Julian McAuley', 'Tat Seng Chua', 'Huajun Chen'], 'affiliations': ['National University of Singapore', 'University of California San Diego', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.12036.jpg', 'data': {'categories': ['#agents', '#multimodal', '#science', '#security', '#alignment', '#training', '#interpretability'], 'emoji': '🔬', 'ru': {'title': 'Использование AI для автоматического открытия и управления механизмами работы нейросетей', 'desc': 'Mechanist — это автономная агентная система, которая использует искусственный интеллект для самостоятельного изучения механизмов, лежащих в основе интеллекта моделей. Система генерирует гипотезы о работе моделей, проводит причинно-следственные вмешательства и валидирует результаты, опираясь на граф знаний из 13 000 статей и библиотеку 32 фундаментальных методов анализа. Исследователи продемонстрировали прогрессию от обнаружения поведения моделей к их объяснению и контролю, включая выявление скрытых рисков безопасности и разработку механистической теории представления убеждений. Практические результаты показывают, что выявленные механизмы позволяют улучшить производительность моделей и направить их поведение в желаемое русло.'}, 'en': {'title': 'Unlocking AI: Mechanist for Autonomous Mechanistic Discovery', 'desc': 'The paper introduces Mechanist, an autonomous AI system designed to explore and understand the mechanisms behind model intelligence. It generates hypotheses and performs causal interventions to enhance safety and performance in AI models. By integrating a vast knowledge graph and a library of foundational methods, Mechanist autonomously discovers and analyzes mechanisms, bridging the gap between AI capabilities and our understanding of them. The system not only identifies safety risks but also develops theories on how models represent knowledge and beliefs, leading to practical improvements in AI performance.'}, 'zh': {'title': 'Mechanist：智能模型机制的自主探索与控制', 'desc': 'Mechanist是一个自主智能系统，利用人工智能发现和控制模型智能背后的机制。它生成假设，进行因果干预，并提高安全性和性能。通过构建一个包含约13000篇论文的可解释性知识图谱，Mechanist能够支持自主的机制发现。与现有的AI科学家系统相比，Mechanist在生成机制假设和执行实验方面表现更为可靠。'}}}, {'id': 'https://huggingface.co/papers/2608.10708', 'title': 'Self-Geometry: GT-Free and Plug-and-Play Test-Time Adaptation for Geometrically Consistent 3D Vision Foundation Models', 'url': 'https://huggingface.co/papers/2608.10708', 'abstract': 'Abstract Self-Geometry improves vision foundation model predictions by enforcing explicit multi-view geometric constraints via test-time adaptation with LoRA, disentangled losses, and angular neighbor sampling.  Generated by thinkingmachines/Inkling-Small Recent Vision Foundation Models (VFMs) predict depth, camera pose, and pointmap in a single forward pass without per-scene optimization, achieving strong generalization. However, enforcing explicit multi-view geometric consistency, e.g., through bundle adjustment, is computationally costly and is thus not imposed during VFM pretraining, so such inconsistency can arise. To address this, implicit self-consistency derived from model outputs (e.g., pointmaps, features), though enforced at test-time in prior work, delivers inherently limited performance gain, especially on scenes where the pretrained VFM is highly inaccurate. In contrast to this implicit signal, we propose Self-Geometry, a plug-and-play test-time adaptation pipeline that directly imposes explicit multi-view geometric constraints using 2D pixel correspondences as pseudo ground-truth. Our proposed Self-Geometry consists of Geometric Disentanglement Optimization, which combines Multi-View Consistency and Epipolar Consistency losses with Gradient Disentanglement to prevent gradient conflict; Frame Angular-Neighbor, a view sampler based on SO(3) geodesic distances for lightly imposing these constraints; and Lightweight TTA, which adapts VFMs via LoRA. Our method achieves consistent improvements in both pose and geometry estimation across six VFMs (VGGT, π^3, DA3-Giant/Large/Base/Small) and four benchmarks (7Scenes, ETH3D, ScanNet++, HiRoom).', 'score': 11, 'issue_id': 2950, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'beb631c62b6ccb51', 'authors': ['Seokhyun Youn', 'Dahyeon Kye', 'Sung-Ho Bae', 'Jihyong Oh'], 'affiliations': ['CMLab, Chung-Ang University', 'Kyung Hee University'], 'pdf_title_img': 'assets/pdf/title_img/2608.10708.jpg', 'data': {'categories': ['#architecture', '#training', '#cv'], 'emoji': '🔄', 'ru': {'title': 'Явные геометрические ограничения для уточнения предсказаний моделей зрения', 'desc': 'Статья предлагает Self-Geometry — метод адаптации фундаментальных моделей компьютерного зрения (VFM) на этапе тестирования, который вводит явные геометрические ограничения из нескольких видов сцены. Авторы используют комбинацию потерь для консистентности между несколькими видами и эпиполярной геометрии, а также специальный градиентный механизм для предотвращения конфликтов во время обратного распространения. Предложенный подход использует LoRA для эффективной адаптации модели и угловое соседство кадров на основе геодезических расстояний в SO(3) для выборки представлений. Метод демонстрирует улучшения в оценке позы камеры и геометрии сцены на множестве фундаментальных моделей и бенчмарков.'}, 'en': {'title': 'Enhancing Vision Models with Explicit Geometric Constraints', 'desc': 'The paper introduces Self-Geometry, a method that enhances the predictions of vision foundation models (VFMs) by applying multi-view geometric constraints during test-time adaptation. It addresses the limitations of previous approaches that relied on implicit self-consistency, which often resulted in poor performance in complex scenes. Self-Geometry utilizes explicit geometric constraints derived from 2D pixel correspondences, improving the accuracy of depth and camera pose estimations. The method combines various techniques, including Geometric Disentanglement Optimization and Frame Angular-Neighbor sampling, to achieve significant improvements across multiple benchmarks.'}, 'zh': {'title': '自几何：提升视觉模型的多视角一致性', 'desc': 'Self-Geometry是一种改进视觉基础模型预测的方法，通过在测试时适应中强制执行显式的多视角几何约束。该方法结合了几何解耦优化和轻量级测试时适应，利用2D像素对应关系作为伪真值来提高模型的准确性。与以往的隐式自一致性方法相比，Self-Geometry在姿态和几何估计上都取得了显著的提升。该方法在多个视觉基础模型和基准测试中表现出色，展示了其在复杂场景中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.11562', 'title': 'From Synthesis to Removal: Physics-Grounded Reflection Simulation and Diffusion-Based Video Dereflection', 'url': 'https://huggingface.co/papers/2608.11562', 'abstract': 'Abstract A closed-loop framework combining physics-based video synthesis, diffusion-based video dereflection, and a new benchmark achieves state-of-the-art video reflection removal with fast inference.  Generated by thinkingmachines/Inkling-Small Videos captured through glass often contain reflections that degrade visual quality and interfere with downstream vision tasks. Although single-image reflection removal has been extensively studied, video reflection removal remains largely underexplored due to the lack of paired video data, temporally coherent removal models, and dedicated evaluation benchmarks. We present a closed-loop framework that unifies physics-grounded reflection simulation, diffusion-based video dereflection, and benchmark evaluation. Our S2R-Synthesis pipeline generates paired reflected and reflection-free videos by performing physics-grounded augmentation in the structure space and rendering realistic reflected videos with a trained video diffusion renderer; the augmentation models key glass-related effects including roughness-induced blur, thickness-induced ghosting, and reflectance variation. Based on the synthesized data, we introduce S2R-Removal, the first diffusion-based video reflection removal model, which adapts a pretrained video diffusion prior through reflection-aware latent adaptation and one-step pixel-geometric refinement, recovering the clean transmission in a single denoising step. We further build S2R-Bench, the first benchmark for video reflection removal, supporting both full-reference evaluation and real-world human perceptual assessment. Experiments on S2R-Bench and multiple public image benchmarks demonstrate state-of-the-art performance and faster inference than even non-diffusion baselines, and validate the effectiveness of S2R-Synthesis. Project page: https://codingwzp.github.io/VideoDereflection_S2R.', 'score': 6, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'a11c44b5a4da9ba6', 'authors': ['Zepeng Wang', 'Jiagao Hu', 'Fuhao Li', 'Yuxuan Chen', 'Fei Wang', 'Daiguo Zhou'], 'affiliations': ['MiLM Plus, Xiaomi Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.11562.jpg', 'data': {'categories': ['#diffusion', '#cv', '#benchmark', '#synthetic', '#dataset', '#video'], 'emoji': '🪟', 'ru': {'title': 'Физически обоснованное удаление отражений в видео через диффузионные модели', 'desc': 'Статья описывает закрытую систему для удаления отражений в видео, которая объединяет физически обоснованный синтез видео, диффузионные модели и новый бенчмарк. Авторы разработали S2R-Synthesis для создания пар видео с отражениями и без них путём моделирования реальных оптических эффектов стекла. На основе синтезированных данных они обучили S2R-Removal — первую диффузионную модель для удаления отражений в видео, которая работает за один шаг денойзинга. Они также создали S2R-Bench — первый специализированный бенчмарк для оценки качества удаления отражений, достигая лучшей производительности при более быстром выводе.'}, 'en': {'title': 'Revolutionizing Video Reflection Removal with Physics and Diffusion', 'desc': 'This paper presents a novel closed-loop framework for removing reflections from videos captured through glass, which often degrade visual quality. The framework combines physics-based video synthesis and a diffusion-based model for video dereflection, achieving state-of-the-art results with quick inference times. It introduces a new benchmark, S2R-Bench, for evaluating video reflection removal methods, addressing the challenges of lack of paired video data and temporal coherence. The proposed S2R-Synthesis pipeline generates realistic paired videos, while S2R-Removal effectively recovers clean images using advanced diffusion techniques.'}, 'zh': {'title': '创新闭环框架，实现视频反射去除的突破', 'desc': '这篇论文提出了一个闭环框架，结合了基于物理的视频合成、基于扩散的视频去反射和新的基准测试，达到了最先进的视频反射去除效果，并且推理速度很快。通过物理基础的增强，生成成对的反射和无反射视频，解决了视频反射去除中缺乏配对数据和时间一致性模型的问题。我们引入了第一个基于扩散的视频反射去除模型，能够在单次去噪步骤中恢复干净的传输图像。最后，建立了第一个视频反射去除基准，支持全面参考评估和真实世界的人类感知评估。'}}}, {'id': 'https://huggingface.co/papers/2608.11878', 'title': 'ToolHazard: Scaling Adversarial Environments for Security Evaluation and Alignment of LLM-based Agents', 'url': 'https://huggingface.co/papers/2608.11878', 'abstract': 'Abstract ToolHazard is a scalable framework that synthesizes adversarial environments to test LLM agents against indirect prompt injections, revealing vulnerabilities and improving defensive alignment.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents integrated with external tools are vulnerable to indirect prompt injections embedded in environmental states. However, existing studies largely rely on manually implemented or reused environments, stochastic LLM-based tool simulation, and predefined injection locations, limiting scalable security research across broader domains. To bridge this gap, we propose **ToolHazard**, a scalable adversarial environment synthesis framework that reduces human engineering and supports expansion with additional seed domains and compute. Through an Environment Simulator, an Attacker Agent, and a User Simulator, ToolHazard synthesizes executable stateful environments, discovers viable injection points and generates environment-specific payloads, and constructs state-grounded long-horizon tasks. Based on ToolHazard, we build **ToolHazard-Bench** for stress-testing agents under complex workflows and diverse environmental attacks. Experiments reveal substantial agent vulnerabilities and show that injection timing and placement affect attack effectiveness. Moreover, ToolHazard-generated alignment data improves security on both ToolHazard-Bench and AgentDojo while preserving benign task utility.', 'score': 6, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'b8ae47dd15d50f65', 'authors': ['Yutao Mou', 'Pengfei Yang', 'Zhe Yin', 'Zhangchi Xue', 'Xiaotian Luan', 'Dingyao Yu', 'Tong Zhang', 'Shikun Zhang', 'Wei Ye'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Harbin Institute of Technology', 'National Engineering Research Center for Software Engineering, Peking University', 'Weixin AI, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.11878.jpg', 'data': {'categories': ['#alignment', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Автоматизированный синтез враждебных окружений для защиты LLM-агентов от prompt injection', 'desc': 'В работе представлена ToolHazard — масштабируемая система для синтеза враждебных окружений, которая тестирует LLM-агентов на уязвимость к косвенным prompt injection атакам через внешние инструменты. Авторы решают проблему ограниченности существующих подходов, которые полагаются на ручное создание окружений и предопределённые точки инъекций, путём автоматизации генерации опасных сценариев и полезных нагрузок для различных предметных областей. Система включает трёхкомпонентную архитектуру: симулятор окружения, агент-атакующий и симулятор пользователя, что позволяет генерировать реалистичные долгосрочные задачи с встроенными уязвимостями. Экспериментальные результаты показывают, что данные, полученные при защитном выравнивании на основе ToolHazard, повышают безопасность агентов на множественных бенчмарках без потери полезности.'}, 'en': {'title': 'ToolHazard: Enhancing LLM Security Through Adversarial Environment Synthesis', 'desc': 'The paper introduces ToolHazard, a framework designed to create adversarial environments for testing large language model (LLM) agents against indirect prompt injections. It addresses the limitations of current methods that rely on manual setups and predefined injection points, which restrict the scalability of security research. ToolHazard automates the synthesis of environments, identifies potential injection points, and generates specific payloads for testing. The framework not only reveals significant vulnerabilities in LLM agents but also enhances their security while maintaining their performance on benign tasks.'}, 'zh': {'title': 'ToolHazard：提升LLM代理安全性的对抗性环境框架', 'desc': 'ToolHazard是一个可扩展的框架，用于合成对抗性环境，以测试大型语言模型（LLM）代理在间接提示注入下的脆弱性，从而提高防御对齐能力。该框架通过环境模拟器、攻击者代理和用户模拟器，生成可执行的状态环境，发现可行的注入点，并生成特定于环境的有效载荷。实验表明，代理在复杂工作流和多样化环境攻击下存在显著脆弱性，注入的时机和位置会影响攻击的有效性。此外，ToolHazard生成的对齐数据在保持良性任务效用的同时，提高了ToolHazard-Bench和AgentDojo的安全性。'}}}, {'id': 'https://huggingface.co/papers/2608.06270', 'title': 'The Illusion of Visual Tool-Use: A Causal Audit of Thinking with Images', 'url': 'https://huggingface.co/papers/2608.06270', 'abstract': 'Abstract Visual tool-use in multimodal LLMs often lacks causal effectiveness, with returned observations frequently failing to influence answers or being used incoherently despite aggregate accuracy improvements.  Generated by thinkingmachines/Inkling-Small The "thinking-with-images" paradigm equips multimodal LLMs with active visual operations such as crop-and-zoom. However, models using these operations often achieve only marginal or negative gains over direct inference at substantially higher token cost. They may also repeatedly crop irrelevant regions and fail on questions that direct inference answers correctly. We ask whether the returned visual evidence causally affects the answer. To answer this question, we formulate visual tool-use as a causal graph that separates observation-mediated paths from action-induced shortcuts. We then audit it through interventions at the three levels: policy (comparing tool-use with direct inference), trajectory (corrupting all observations during rollout), and step (counterfactually replacing one individual observation under a fixed prefix). Our step-level estimand, Visual Evidence Gain, isolates the contribution of each returned observation. Across six representative models and five fine-grained perception benchmarks, we uncover policy miscalibration with two failure modes. In Calling Without Looking, returned observations have no causal effect on the answer. In Looking Without Planning, observations are informative but the call schedule is incoherent. A trajectory-level diagnostic decomposes the policy-level accuracy gain and shows that the gain is concentrated in a Calibrated minority. We term this discrepancy the illusion of visual tool-use: despite aggregate accuracy gains, visual tool-use is not causally effective across a broad range of rollouts. The code is available at https://github.com/OpenCausaLab/CauAudit.', 'score': 6, 'issue_id': 2950, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '986be49c5233b2a0', 'authors': ['Zhiheng Wang', 'Bo Peng', 'Lai Wei', 'Chaochao Lu'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.06270.jpg', 'data': {'categories': ['#benchmark', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Визуальные инструменты LLM: за иллюзией эффективности скрывается отсутствие причинного влияния', 'desc': 'В статье исследуется проблема неэффективности визуальных инструментов в мультимодальных LLM, несмотря на улучшение общей точности. Авторы формулируют использование визуальных инструментов как причинно-следственный граф и проводят аудит через вмешательства на трёх уровнях: политики модели, траектории выполнения и отдельных шагов. Они вводят метрику Visual Evidence Gain для оценки причинного влияния каждого возвращённого наблюдения на финальный ответ. Исследование выявляет две основные ошибки: модель вызывает визуальные инструменты без реального влияния на ответ или использует наблюдения некогерентно, что создаёт иллюзию эффективности визуальных инструментов.'}, 'en': {'title': 'Unmasking the Illusion of Visual Tool-Use in LLMs', 'desc': "This paper investigates the effectiveness of visual tool-use in multimodal large language models (LLMs) and its impact on causal reasoning. The authors introduce a causal graph framework to analyze how visual observations influence model answers, revealing that many models exhibit miscalibration in their use of visual evidence. They identify two main failure modes: 'Calling Without Looking', where observations do not affect answers, and 'Looking Without Planning', where observations are relevant but poorly integrated. Ultimately, the study highlights that despite improvements in overall accuracy, visual tool-use often lacks true causal effectiveness, leading to what the authors call the 'illusion of visual tool-use'."}, 'zh': {'title': '视觉工具使用的幻觉：有效性不足的挑战', 'desc': '这篇论文探讨了多模态大语言模型（LLMs）在视觉工具使用中的因果有效性问题。尽管使用视觉工具可以提高整体准确性，但返回的观察结果往往对答案没有实际影响，甚至可能导致错误。研究者通过构建因果图来分析视觉工具的使用，发现存在两种主要的失败模式：一种是返回的观察对答案没有因果影响，另一种是观察信息虽然有用，但使用方式不合理。最终，研究表明，尽管视觉工具使用在整体上看似有效，但在广泛的应用中并不具备因果有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.11350', 'title': 'Self-Evolving Embodied Agents via Skill-Harness Evolution', 'url': 'https://huggingface.co/papers/2608.11350', 'abstract': 'Abstract SHAPER is a train-free framework that improves embodied agents by evolving reusable skills and a context-code harness around a frozen foundation model through environment rollouts.  Generated by thinkingmachines/Inkling-Small Embodied agents are increasingly built as systems around foundation models, where performance depends not only on model weights but also on the skills, context, action interfaces, and execution harness surrounding the model. While supervised fine-tuning and reinforcement learning can adapt agents to new environments, they require additional data, rewards, and training runs; meanwhile, many train-free code-centric approaches rely on programmable robot APIs that may be unavailable in fixed-interface settings. We propose SHAPER, a self-evolving framework for train-free embodied adaptation that keeps model parameters frozen and improves the non-parametric agent system by evolving reusable skills and a context-code harness through target-environment rollouts. In SHAPER, the same frozen model can serve as both planner and optimizer, refining its external skills and context-code harness without parameter updates. We evaluate SHAPER on VLABench and ESI-Bench, covering embodied agents with different low-level action interfaces, and compare against pure execution, supervised fine-tuning, and test-time-scaling baselines such as verifier-free selection and voting. Our results suggest that skill-and-harness optimization is a practical route to self-evolving embodied agents when model training is expensive, unavailable, or undesirable.', 'score': 4, 'issue_id': 2952, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '46266e1260c51e62', 'authors': ['Peidong Wang', 'Zhiming Ma', 'Ying Chang', 'Xufang Luo', 'Xiaocui Yang', 'Shi Feng', 'Yuqing Yang', 'Dongsheng Li'], 'affiliations': ['Microsoft Research', 'Northeastern University'], 'pdf_title_img': 'assets/pdf/title_img/2608.11350.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Эволюция навыков без обучения модели', 'desc': 'SHAPER — это фреймворк для адаптации воплощённых агентов без обучения, который совершенствует поведение агента путём эволюции переиспользуемых навыков и контекстного обёртывания вокруг замороженной foundation model. Система сохраняет веса модели неизменными, а вместо этого оптимизирует непараметрические компоненты агента через взаимодействие с окружением. SHAPER использует саму замороженную модель одновременно как планировщик и оптимизатор, улучшая внешние навыки и структуру выполнения кода без обновления параметров. Метод продемонстрирован на бенчмарках VLABench и ESI-Bench и показывает, что оптимизация навыков и архитектуры является практичным подходом к эволюции агентов, когда обучение модели дорого или недоступно.'}, 'en': {'title': 'Evolving Skills for Train-Free Embodied Agents', 'desc': "SHAPER is a novel framework designed to enhance embodied agents without the need for traditional training methods. It focuses on evolving reusable skills and a context-code harness while keeping the foundation model's parameters fixed. This approach allows the agent to adapt to new environments through rollouts, improving its performance without requiring additional data or training runs. The evaluation of SHAPER on various benchmarks demonstrates its effectiveness in optimizing agent capabilities in scenarios where conventional training is impractical."}, 'zh': {'title': '无训练的自我进化智能体框架', 'desc': 'SHAPER是一个无训练框架，通过环境回放来进化可重用技能和上下文代码，提升具身智能体的表现。该框架保持基础模型的参数不变，专注于优化非参数智能体系统。SHAPER允许同一个冻结模型同时作为规划者和优化器，改进外部技能和上下文代码，而无需更新参数。我们的实验表明，在模型训练成本高昂或不可用的情况下，技能和代码优化是自我进化具身智能体的有效途径。'}}}, {'id': 'https://huggingface.co/papers/2608.11274', 'title': 'Agent Safety Should Be a Runtime Contract', 'url': 'https://huggingface.co/papers/2608.11274', 'abstract': 'Abstract Agent safety should be enforced at runtime through preventive controls and verifiable evidence rather than relying solely on training-time alignment methods.  Generated by thinkingmachines/Inkling-Small The dominant paradigm treats AI safety as a property to be instilled during model training via RLHF, DPO, or Constitutional AI. We argue this is structurally insufficient for autonomous agents that execute code, mutate files, send messages, and modify databases. Agent safety should be a runtime contract enforced by the harness, and the contract has two complementary faces. The preventive face blocks dangerous actions before they happen via sandboxes, permission gates, output filters, and trajectory monitors. The evidential face requires verifiable proof that good actions actually happened, gating task submission on hard evidence such as test runs, log captures, file diffs, and citation grounding. We ground the position in four lines of public evidence, with row-level protocols and data released in the supplementary JSON files: a survey of 52 documented AI-agent and LLM safety incidents, a false-completion audit with 31 non-contested core cases plus one disputed illustrative case, a trajectory-schema audit of 12 public agent systems and harnesses, and a title-level audit of all 28,560 papers accepted at NeurIPS, ICML, and ICLR 2023-2025 showing a pooled 8-12x imbalance between training-time and deployment-time publication. Two prior communities that needed to enforce safety, computer security and the experimental sciences, converged on runtime contracts with both preventive and evidential elements; agentic AI is now under the same pressure. We formalize an Agent Trajectory Schema and Evidence Chain, state a compositional gating proposition based on standard monitor composition, and outline a research agenda. The right unit of safety in agentic AI is the trajectory-with-checkable-evidence, not the model.', 'score': 3, 'issue_id': 2950, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'afb16f86a3a67af2', 'authors': ['Albus W. Ng', 'Yi Han', 'Jusheng Zhang', 'Wenhao Wang'], 'affiliations': ['Southwest University', 'Sun Yat-sen University', 'Vast Intelligence Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.11274.jpg', 'data': {'categories': ['#agents', '#alignment', '#rlhf', '#benchmark', '#dataset', '#ethics', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность агентов — это контракт во время выполнения, а не только обучение', 'desc': 'В статье утверждается, что безопасность автономных агентов не должна полагаться только на методы выравнивания моделей во время обучения, такие как RLHF и DPO. Авторы предлагают применить контрактный подход на этапе выполнения, который включает две дополняющие друг друга стратегии: превентивный контроль через песочницы и фильтры, а также верифицируемые доказательства корректности действий через логи и тесты. В работе проанализированы 52 документированных инцидента с AI-агентами, аудит ложных завершений и обзор 28,560 статей из топовых конференций, показывающий дисбаланс в исследованиях на пользу обучающих методов. Авторы предлагают формализовать схему траектории агента и цепь доказательств как основной единицы безопасности вместо сосредоточения на самой модели.'}, 'en': {'title': 'Ensuring AI Safety: Runtime Contracts Over Training Methods', 'desc': 'This paper argues that ensuring the safety of autonomous AI agents should happen during their operation, not just during their training. It introduces a dual approach to safety: a preventive aspect that stops harmful actions before they occur, and an evidential aspect that requires proof of safe actions after they happen. The authors highlight the inadequacy of traditional training methods like Reinforcement Learning from Human Feedback (RLHF) for managing risks in real-time operations. They propose a structured framework for monitoring AI actions, emphasizing the importance of verifiable evidence in maintaining safety during deployment.'}, 'zh': {'title': '智能体安全：运行时契约的必要性', 'desc': '本论文提出了在运行时通过预防控制和可验证证据来确保智能体安全，而不仅仅依赖于训练时的对齐方法。我们认为，传统的安全方法不足以应对能够执行代码、修改文件和数据库的自主智能体。智能体安全应作为一种运行时契约来执行，包含预防性和证据性两个方面。预防性措施通过沙箱、权限门和输出过滤器等手段阻止危险行为，而证据性措施则要求提供可验证的证据，确保良好行为的发生。'}}}, {'id': 'https://huggingface.co/papers/2608.10450', 'title': 'Persistent Recursive Worlds Enable Autonomous Software Evolution', 'url': 'https://huggingface.co/papers/2608.10450', 'abstract': 'Abstract Genesis organizes long-horizon software development around a persistent project rather than persistent agents, enabling multi-day compiler construction and numerical module reimplementation with low cost and high performance.  Generated by thinkingmachines/Inkling-Small Complex software systems develop over timescales that exceed the lifespan of any individual coding agent. Most agentic software systems preserve continuity through persistent sessions, memories, managers or shared context. We introduce EvoX Genesis (hereafter, Genesis), which instead makes the software project persistent while allowing local agents to remain finite-lived. Genesis represents software as a persistent recursive world: each local world is situated by an accepted version and a repository path, finite-lived agents propose local changes, recursive delegation moves work across paths, and only accepted consequences advance the persistent version history. We evaluate this organization across formation, continuation and redevelopment. Starting from a repository with no compiler implementation, Genesis used DeepSeek V4 Flash to build a Rust-based C compiler with about 250k tracked lines; the run lasted over 120 hours, archived over 1,000 agent episodes and incurred only US$44 in model-token charges. The compiler passed the complete c-testsuite and most LLVM and Csmith tests. In a separate compiler world generated with GLM 5.2, development continued after repeated agent replacement while retaining full test performance. Genesis also reimplemented 13 MESA modules with over 100k Fortran lines as a Rust workspace with nearly 90k Rust lines; across six numerical workloads, it achieved median speedups of 1.55--6.87x. These results show that long-horizon software development can be organized around a persistent project rather than a persistent agent.', 'score': 2, 'issue_id': 2951, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '2dbc0a5d971740e1', 'authors': ['Beichen Huang', 'Zhenyu Liang', 'Bowen Zheng', 'Ran Cheng'], 'affiliations': ['Department of Data Science and Artificial Intelligence, The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2608.10450.jpg', 'data': {'categories': ['#open_source'], 'emoji': '🏗️', 'ru': {'title': 'Проект, который живёт дольше агентов', 'desc': 'Genesis — это новая система для долгосрочной разработки программного обеспечения, которая организует процесс вокруг постоянного проекта вместо постоянных агентов. Система представляет код как персистентный рекурсивный мир, где конечные агенты предлагают локальные изменения, а версионирование сохраняет только принятые изменения. Авторы продемонстрировали возможность Genesis, построив полнофункциональный Rust-компилятор для языка C за 120 часов с затратами всего $44, что прошёл полный набор тестов. Система также успешно переработала численные модули MESA с Fortran на Rust, достигнув ускорения в 1.55—6.87 раза, сохраняя качество при замене агентов.'}, 'en': {'title': 'Persistent Projects Over Persistent Agents in Software Development', 'desc': 'The paper introduces EvoX Genesis, a novel approach to organizing long-term software development by focusing on a persistent project instead of relying on continuous coding agents. This method allows for the construction of complex software systems over extended periods, enabling local agents to make temporary contributions while maintaining a consistent project history. The authors demonstrate that Genesis can effectively build a Rust-based C compiler and reimplement numerical modules, achieving significant performance improvements and low operational costs. Overall, the findings suggest that this project-centric model can enhance the efficiency and continuity of software development processes.'}, 'zh': {'title': '持久项目驱动的软件开发新模式', 'desc': 'Genesis 是一种新的软件开发组织方式，它围绕持久的项目而不是持久的代理进行长时间的软件开发。该方法允许局部代理在有限的生命周期内进行工作，同时保持软件项目的持续性。通过使用递归世界的概念，Genesis 使得每个局部世界都基于一个接受的版本和一个代码库路径，局部代理可以提出更改并进行递归委托。实验结果表明，Genesis 在构建编译器和重实现模块方面表现出色，证明了持久项目的组织方式在长时间的软件开发中是有效的。'}}}, {'id': 'https://huggingface.co/papers/2608.11616', 'title': 'MBA: Multimodal Benchmark and Agents for Real-World Business Ideation', 'url': 'https://huggingface.co/papers/2608.11616', 'abstract': 'Abstract Researchers introduce MBA-Bench, a multimodal benchmark for business ideation agents, and propose MBA-b and MBA-k models trained with creativity and feasibility rewards via LoRA fine-tuning and group relative policy optimization, significantly outperforming text-only and multimodal baselines.  Generated by thinkingmachines/Inkling-Small Agentic systems powered by large language models (LLMs) have opened new opportunities for business ideation. Yet existing approaches remain confined to a text-only paradigm, despite the inherently multimodal nature of real-world contexts. We thus introduce MBA-Bench, the first multimodal benchmark for training and evaluating business ideation agents, comprising 30K samples across six domains, each domain characterized by distinct visual cues not fully conveyed by text alone. Concretely, we automatically caption images and employ GPT-4o to generate five reference ideas for each of three business questions through retrieval query generation, market evidence retrieval, and evidence-augmented synthesis. Following prior work, we evaluate agents across six business-oriented criteria using MLLM-as-a-Judge. To consider settings where criteria are hidden or disclosed, we present MBA-b and MBA-k for blind and known, respectively. We train both with two novel reward objectives---creativity and feasibility---while MBA-k further optimizes the six disclosed criteria for eight in total. Both are trained via LoRA-based supervised fine-tuning followed by group relative policy optimization with these setting-specific rewards. For extensive experiments on MBA-Bench, we set up two baselines accommodating either captions only or multimodal inputs, with the latter nearing closed-source performance on several metrics. MBA-b and MBA-k outperform caption baselines by 63.9% and 77.1%, and multimodal baselines by 25.6% and 35.8%, respectively.', 'score': 2, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'cce842d449116ef3', 'authors': ['Hojun Choi', 'Jaeyo Shin', 'Suin Lee', 'Hyunjung Shim'], 'affiliations': ['KAIST AI, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2608.11616.jpg', 'data': {'categories': ['#agents', '#rlhf', '#training', '#benchmark', '#multimodal', '#dataset'], 'emoji': '💡', 'ru': {'title': 'Мультимодальные агенты для генерации инновационных бизнес-идей', 'desc': 'Исследователи представили MBA-Bench — первый мультимодальный бенчмарк для обучения и оценки агентов по генерации бизнес-идей, содержащий 30 тысяч примеров с изображениями и текстом из шести бизнес-доменов. Авторы предложили две модели MBA-b и MBA-k, которые обучались с помощью техники LoRA и методом group relative policy optimization, используя награды за креативность и осуществимость идей. Мультимодальный подход значительно превосходит текстовые базовые модели и другие мультимодальные системы — на 25-35% в зависимости от сложности задачи. Модели демонстрируют способность эффективно комбинировать визуальную информацию и текстовые данные для создания более качественных и реалистичных бизнес-предложений.'}, 'en': {'title': 'Unlocking Business Creativity with Multimodal AI', 'desc': "The paper presents MBA-Bench, a new benchmark designed for evaluating business ideation agents that utilize multiple types of data, such as text and images. It introduces two models, MBA-b and MBA-k, which are trained using innovative reward systems focused on creativity and feasibility, enhancing their performance significantly over traditional text-only models. The benchmark includes a diverse dataset of 30,000 samples across six domains, allowing for a comprehensive assessment of the agents' capabilities in real-world scenarios. The results show that the proposed models outperform existing multimodal and text-only baselines, demonstrating the effectiveness of integrating multimodal inputs in business ideation tasks."}, 'zh': {'title': '多模态商业创意的未来', 'desc': '研究人员提出了MBA-Bench，这是一个用于商业创意代理的多模态基准，并提出了MBA-b和MBA-k模型，这些模型通过LoRA微调和组相对策略优化，利用创造性和可行性奖励进行训练，显著超越了仅文本和多模态的基线。MBA-Bench是第一个用于训练和评估商业创意代理的多模态基准，包含来自六个领域的30,000个样本，每个领域都有独特的视觉线索，文本无法完全传达。我们自动为图像生成标题，并使用GPT-4o通过检索查询生成、市场证据检索和证据增强合成，为每个商业问题生成五个参考创意。实验结果表明，MBA-b和MBA-k在多个指标上均显著优于现有的基线模型。'}}}, {'id': 'https://huggingface.co/papers/2608.12313', 'title': 'AVA-Encoder: Towards Agent-Native Video Representation Learning', 'url': 'https://huggingface.co/papers/2608.12313', 'abstract': 'Abstract AVA-Encoder learns structured video representations via agentic auto-encoding using knowledge graphs to enable cinematic video generation and reasoning with reduced token usage.  Generated by thinkingmachines/Inkling-Small Creative agents still lack an effective way to learn from high-quality human films, limiting their ability to produce cinematic-grade videos. A key challenge is the absence of a structured video representation that is both faithful to film content and directly usable for agentic reasoning and manipulation. To address the challenge, we propose the Agentic Video Auto-Encoder (AVA-Encoder), a framework for learning agent-native video representations via agentic auto-encoding.   AVA-Encoder transforms a video into a knowledge graph (KG) representation and then reconstructs it back into video. Its hierarchy and state nodes store structured text, while a linked asset layer holds generated images, audio, and video. Typed edges preserve the relations between these text descriptions and assets in a form that agents can easily understand, query, and edit. The video reconstruction differences drive a textual-gradient optimization framework, which expresses evaluation feedback as natural-language update directions for Data-Independent Encoding Policy Pseudo-Training in the outer loop and optional Data-Dependent KG Representation Refinement in the test-time inner loop.   Extensive experiments show that AVA-Encoder improves by 20.7 percentage points over the strongest external baseline. In the controlled policy-only setting, its pseudo-trained shot-level Agentic Video Encoder policy also outperforms a carefully human-tuned policy while using 74.3% fewer system-prompt tokens. We release the complete AVA-Encoder framework, a reliable agentic video reconstruction benchmark, and the first dataset of high-quality film KG representations.', 'score': 2, 'issue_id': 2950, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '1dbf7213c8e13939', 'authors': ['Chuyue Li', 'Jinpeng Yu', 'Haozhe Wang', 'Tian Xueyun', 'Zhijing Zhang', 'Bingnan Li', 'Shuqi Gu', 'Kan Ren', 'Jiaming Liu', 'Ruihua Hua'], 'affiliations': ['Institute of Computing Technology', 'Qwen Business Unit of Alibaba', 'ShanghaiTech University', 'Southeast University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.12313.jpg', 'data': {'categories': ['#agents', '#benchmark', '#multimodal', '#dataset', '#video'], 'emoji': '🎬', 'ru': {'title': 'Структурированное видеопредставление через агентивное автокодирование с графами знаний', 'desc': 'AVA-Encoder — это фреймворк для обучения структурированных видеопредставлений с помощью агентивного автокодирования, который преобразует видео в граф знаний и восстанавливает его обратно в видеоформат. Система использует иерархию узлов для хранения структурированного текста и связанный слой активов с изображениями, аудио и видео, при этом типизированные рёбра сохраняют отношения между элементами в форме, доступной для понимания и редактирования агентами. Оптимизация основана на текстовых градиентах, которые выражают обратную связь как естественноязыковые инструкции для обновления политики кодирования во время обучения и уточнения представления графа на этапе тестирования. Экспериментальные результаты показывают, что AVA-Encoder превосходит конкурентов на 20.7 процентных пункта и использует на 74.3% меньше токенов, чем ручная настройка.'}, 'en': {'title': 'Revolutionizing Video Learning with Knowledge Graphs', 'desc': 'The AVA-Encoder is a novel framework designed to enhance how creative agents learn from high-quality films by using structured video representations. It converts videos into knowledge graphs, which help in understanding and manipulating video content more effectively. By employing agentic auto-encoding, it allows for efficient video generation and reasoning while significantly reducing the number of tokens needed for processing. The framework demonstrates a substantial improvement in performance over existing methods, showcasing its potential for cinematic video production.'}, 'zh': {'title': '代理视频自编码器：提升视频生成与推理的革命性框架', 'desc': 'AVA-Encoder是一种通过代理自编码学习结构化视频表示的方法，利用知识图谱来实现电影级视频生成和推理，同时减少了令牌的使用。该框架将视频转换为知识图谱表示，然后再重建为视频，存储结构化文本和生成的图像、音频及视频。通过文本梯度优化框架，AVA-Encoder能够有效地进行评估反馈，并在测试时进行可选的数据依赖知识图谱表示优化。实验结果表明，AVA-Encoder在性能上比最强的外部基线提高了20.7个百分点，且在使用更少的系统提示令牌的情况下，表现优于经过精心调优的人类策略。'}}}, {'id': 'https://huggingface.co/papers/2608.10615', 'title': 'Simplex Relaxation for Discrete Diffusion', 'url': 'https://huggingface.co/papers/2608.10615', 'abstract': 'Abstract Simplax enriches uniform discrete diffusion via Dirichlet-categorical augmentation to improve reverse sampling and generative quality on text and Sudoku tasks.  Generated by thinkingmachines/Inkling-Small Discrete diffusion models for categorical generation are defined by a corruption kernel, which determines the intermediate state space and the associated reverse prediction problem. We study uniform discrete diffusion and ask whether its training objective and reverse transitions can be enriched without changing the underlying categorical corruption process. We introduce Simplax, an exact Dirichlet--categorical augmentation that couples each corrupted categorical state with an auxiliary simplex-valued variable while preserving the original uniform diffusion process as its categorical marginal. This augmentation yields a tractable Rao--Blackwellized reverse-bridge objective and a corresponding stochastic reverse sampler, while retaining the corrupted categorical state as the denoiser input. Empirically, Simplax improves the generative perplexity--entropy tradeoff on unconditional OpenWebText generation. On Sudoku, a model trained exclusively on 30-clue puzzles achieves the highest accuracy among the compared methods across all evaluated clue densities, including the minimum uniquely solvable 17-clue regime, and also achieves the highest validity in unconditional generation.', 'score': 2, 'issue_id': 2952, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '766282126e2801f4', 'authors': ['Jinya Sakurai', 'Patrick Pynadath', 'Satoshi Hayakawa', 'Jaehong Yoon', 'Xulei Yang', 'Nancy F. Chen', 'Xun Xu'], 'affiliations': ['Centre for Frontier AI Research (CFAR), A*STAR', 'Institute for Advanced Intelligence and Computing (IAIC), A*STAR', 'NTU Singapore', 'Purdue University', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.10615.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization', '#diffusion'], 'emoji': '🎲', 'ru': {'title': 'Обогащение дискретной диффузии через симплекс-аугментацию для лучшей генерации текста и Судоку', 'desc': 'В статье представлен метод Simplax, который улучшает дискретные модели диффузии путём добавления вспомогательной переменной на симплексе, сохраняя исходный процесс равномерной корруптации. Авторы вводят Rao-Blackwellizированный объект обучения для обратного процесса, который позволяет более эффективно предсказывать промежуточные состояния при генерации дискретных последовательностей. Метод демонстрирует улучшения в качестве генерации текста на наборе данных OpenWebText и показывает выдающиеся результаты на задаче решения головоломок Судоку, включая случаи с минимальным числом подсказок. Подход является точным расширением существующей процедуры без изменения основного процесса корруптации, что делает его универсально применимым к различным категориальным задачам генерации.'}, 'en': {'title': 'Enhancing Discrete Diffusion with Simplax for Better Generative Models', 'desc': 'The paper introduces Simplax, a method that enhances uniform discrete diffusion models by using Dirichlet-categorical augmentation. This approach improves the reverse sampling process and the quality of generated outputs for tasks like text generation and Sudoku solving. By coupling corrupted categorical states with auxiliary simplex-valued variables, Simplax maintains the original diffusion process while enabling a more effective reverse-bridge objective. The results show significant improvements in generative performance, particularly in perplexity-entropy tradeoff and accuracy in Sudoku puzzles.'}, 'zh': {'title': 'Simplax：提升生成质量的新方法', 'desc': 'Simplax通过Dirichlet-分类增强丰富了均匀离散扩散，以改善文本和数独任务的反向采样和生成质量。该方法引入了一种精确的Dirichlet-分类增强，将每个被破坏的分类状态与一个辅助的单纯形变量耦合，同时保持原始的均匀扩散过程。通过这种增强，Simplax实现了可处理的Rao-Blackwell化反向桥接目标和相应的随机反向采样器，同时保留了被破坏的分类状态作为去噪输入。实验证明，Simplax在无条件OpenWebText生成中改善了生成的困惑度-熵权衡，并在数独任务中达到了最高的准确性和有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.11216', 'title': 'AutoWorldModel-Bench: A State-Centric Benchmark for Automated World-Model Research', 'url': 'https://huggingface.co/papers/2608.11216', 'abstract': 'Abstract The benchmark evaluates autonomous coding agents on open-ended world-model research by having them iteratively improve a starter model across game environments using a shared structured-state format.  Generated by thinkingmachines/Inkling-Small World modeling is an unsettled field: architectures, training objectives, and state representations interact in complex ways, and no single recipe dominates across environments. This makes it an ideal testbed for AI coding agents acting as autonomous researchers--a setting in which the improvement direction is not specified in advance, unlike the engineering-to-spec tasks that dominate current agent benchmarks. We introduce AutoWorldModel-Bench, a closed-loop benchmark in which frontier coding agents autonomously improve a provided world-model starter under a fixed compute budget. The benchmark spans eight game environments under a unified structured-state representation--ground-truth entity state extracted from each game and consumed through a shared tensor format--which isolates dynamics modeling from perception and enables minutes-per-run iteration. Across 64 sessions, Codex-5.4 and Claude Opus 4.6 improve their starter on 63; in 91% of sessions the winning edit is a non-trivial research-style modification--a new objective, representation, rollout procedure, or architectural change--rather than a hyperparameter tweak. Our benchmark offers a setting in which frontier coding agents can be evaluated on open-ended research rather than engineering-to-spec problems.', 'score': 2, 'issue_id': 2950, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '4d317a1064658ad3', 'authors': ['Marjan Moodi', 'Xuankang Zhu', 'Fernando De Mesentier Silva', 'Harold Chaput', 'Mohammad Reza Taesiri'], 'affiliations': ['Electronic Arts', 'Simon Fraser University'], 'pdf_title_img': 'assets/pdf/title_img/2608.11216.jpg', 'data': {'categories': ['#agents', '#games', '#benchmark', '#optimization', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Автономные AI исследователи: от инженерии к открытым научным задачам', 'desc': 'В работе представлен AutoWorldModel-Bench — бенчмарк для оценки автономных кодирующих агентов, которые самостоятельно улучшают модели мира в игровых окружениях с использованием единого формата структурированного состояния. Исследователи организовали замкнутый цикл, где frontier LLM модели, такие как Codex и Claude, итеративно модифицируют стартовую модель в рамках фиксированного бюджета вычислений. Бенчмарк охватывает восемь игровых окружений с извлечением ground-truth состояния сущностей, что позволяет отделить моделирование динамики от восприятия и достигнуть быстрой итерации. Результаты показывают, что AI агенты успешно генерируют нетривиальные исследовательские модификации архитектуры и целевых функций, демонстрируя способность к открытому исследованию вместо инженерных задач по спецификации.'}, 'en': {'title': 'Empowering AI Agents for Open-Ended Research in Game Environments', 'desc': 'This paper presen
