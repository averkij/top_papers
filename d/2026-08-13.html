ts AutoWorldModel-Bench, a benchmark designed to evaluate autonomous coding agents in the context of open-ended world-model research. The benchmark allows agents to iteratively enhance a starter model across various game environments using a shared structured-state format, which simplifies the interaction between architectures, training objectives, and state representations. Unlike traditional benchmarks that focus on specific engineering tasks, this framework encourages agents to explore innovative modifications, such as new objectives or architectural changes. The results show that advanced coding agents like Codex-5.4 and Claude Opus 4.6 can significantly improve their models, demonstrating the effectiveness of this approach in fostering autonomous research.'}, 'zh': {'title': '开放式世界模型研究的新基准测试', 'desc': '这篇论文介绍了一个新的基准测试，名为AutoWorldModel-Bench，旨在评估自主编码代理在开放式世界模型研究中的表现。该基准允许编码代理在固定的计算预算下，迭代改进一个初始的世界模型，涵盖八个游戏环境，并使用统一的结构化状态表示。研究表明，Codex-5.4和Claude Opus 4.6在大多数会话中成功改进了初始模型，且大部分改动是非平凡的研究风格修改，而非简单的超参数调整。这个基准测试为评估前沿编码代理在开放式研究中的能力提供了一个理想的平台。'}}}, {'id': 'https://huggingface.co/papers/2608.11574', 'title': 'Hand Visibility Detector: Per-Keypoint Visibility Estimation for Hands', 'url': 'https://huggingface.co/papers/2608.11574', 'abstract': 'Abstract This work introduces a dedicated model for per-joint hand visibility estimation and demonstrates its benefit for multi-view 3D hand pose annotation.  Generated by thinkingmachines/Inkling-Small Hand Pose Estimation (HPE) is a fundamental technology for various applications such as AR/VR and robotics. In these applications, the visibility of each hand joint in the image is crucial for assessing the reliability of estimation results under occlusion. However, most existing HPE methods output joint positions without explicitly indicating their visibility. Although some methods account for occlusion or visibility, visibility estimation has mainly been used as an auxiliary signal for improving pose estimation. To our knowledge, per-joint hand visibility estimation has not been systematically studied as a standalone task. In this work, we propose Hand Visibility Detector, a model for estimating the visibility of individual hand joints, and present the first systematic investigation of visibility estimation as an independent task. We show that leveraging the prior knowledge of HPE models pretrained on large-scale data as a backbone yields high performance in this task. We further demonstrate the utility of Hand Visibility Detector on a downstream task of 3D hand pose annotation via multi-view triangulation of 2D keypoints, showing that visibility-weighted triangulation reduces reprojection error. Our method is released as a ready-to-use package, and the code and demo are available at https://github.com/ryhara/hand_visibility_detector .', 'score': 1, 'issue_id': 2952, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '20413bb9d36d2e38', 'authors': ['Ryosei Hara', 'Masashi Hatano', 'Rintaro Yanagi', 'Atsushi Hashimoto', 'Takuma Yagi', 'Mariko Isogawa'], 'affiliations': ['Keio University', 'National Institute of Advanced Industrial Science and Technology (AIST)', 'OMRON SINIC Corporation', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.11574.jpg', 'data': {'categories': ['#robotics', '#open_source', '#3d', '#cv'], 'emoji': '🖐️', 'ru': {'title': 'Видимость каждого сустава - ключ к надёжной оценке позы руки', 'desc': "В работе представлена специализированная модель для оценки видимости каждого сустава руки на изображении. Авторы впервые систематически исследуют задачу определения видимости суставов как самостоятельную проблему, отдельную от основной задачи оценки позы руки. Предложенный метод использует предварительно обученные модели оценки позы руки в качестве backbone'а для достижения высокой производительности. Демонстрируется практическая полезность подхода на задаче аннотации 3D позы руки через триангуляцию с использованием весов видимости суставов."}, 'en': {'title': 'Enhancing Hand Pose Estimation with Joint Visibility Detection', 'desc': 'This paper presents a new model called Hand Visibility Detector, which focuses on estimating the visibility of each hand joint in images. This is important for improving the accuracy of 3D hand pose estimation, especially in situations where parts of the hand may be hidden or occluded. Unlike previous methods that treated visibility as a secondary factor, this work treats it as a primary task, providing a systematic approach to visibility estimation. The authors demonstrate that using a pretrained hand pose estimation model enhances performance and that their method effectively reduces errors in 3D hand pose annotation through visibility-weighted triangulation.'}, 'zh': {'title': '手部可见性估计：提升3D手势标注的关键', 'desc': '本文介绍了一种专门用于每个关节手部可见性估计的模型，并展示了其在多视角3D手势标注中的优势。手部可见性估计对于增强现实、虚拟现实和机器人等应用至关重要，尤其是在遮挡情况下评估估计结果的可靠性。尽管现有的手势估计方法通常输出关节位置，但并未明确指示其可见性。我们提出的手部可见性检测器模型，首次系统地将可见性估计作为独立任务进行研究，并在3D手势标注中展示了其有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.12123', 'title': 'Ready Cohorts: Bounding GPU Opportunity and Avoiding Host Round Trips in LLM-Agent Control', 'url': 'https://huggingface.co/papers/2608.12123', 'abstract': 'Abstract Two studies define measurable GPU control gates for LLM-agent services by analyzing concurrent cohort scheduling and on-device routing versus host redispatch.  Generated by thinkingmachines/Inkling-Small LLM-agent services repeatedly execute small deterministic transitions between model and tool calls: route an outcome, update state, and emit the next effect. We ask when this control path exposes enough concurrent work for GPU execution, and what changes when a GPU-computed route decision remains on device. We formalize the ready-cohort boundary using fixed-partition share F, exact offline share P*, local upper bound U, and online achieved share A. Under zero service time, unlimited capacity, and equal relative launch deadlines, a specialized dynamic program computes P* exactly. In a stationary Poisson replay of one pinned 851-session public trace panel, the primary condition at 100,000 target active sessions, K=256, and a 50 ms launch deadline gives F=30.19%, P*=43.00%, and U=45.85%. Exact packing recovers 81.83% of the opportunity lost at fixed window boundaries. The outcome-derived route key is a conditioning proxy, not proof of executable identity. A separate mechanism study keeps a GPU-computed binary decision on device instead of returning four bytes to the host and redispatching. Across four named GPU placements, the device-resident path is faster in all 36 configurations; within-placement row-median ratios range from 1.19x to 2.39x. Across both admissible mechanisms, all 14,557,440 tested batched invocations match a separately implemented host oracle. A fixed nested device graph that removes no host decision is slower in all 60 configurations across five placements. Together, the studies establish two measurable gates for GPU agent control: deadline-feasible cohort supply and observation placement. A joined finite online runtime is required to measure A, CPU displacement, and service-level benefit.', 'score': 1, 'issue_id': 2953, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': 'a6f0b3f747430882', 'authors': ['Josef Liyanjun Chen'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.12123.jpg', 'data': {'categories': [], 'emoji': '⚙️', 'ru': {'title': 'Управление параллелизмом GPU для LLM-агентов: оптимизация маршрутизации и локальное принятие решений', 'desc': 'В статье исследуются управляющие вентили для сервисов на базе больших языковых моделей (LLM-агентов), которые многократно выполняют цикл «маршрутизация → обновление состояния → генерация эффекта». Авторы анализируют, когда цепочка управления обеспечивает достаточно параллельной работы для GPU, и как на производительность влияет сохранение решения о маршрутизации на самом устройстве вместо отправки на хост. Используя формализацию границы готовых когорт через параметры F, P*, U и A, исследователи с помощью динамического программирования определяют оптимальное распределение нагрузки на реальных трассировках: при 100k активных сеансов восстанавливается 81,83% потерянных возможностей. Экспериментально доказано, что сохранение бинарного решения на GPU быстрее во всех конфигурациях (ускорение 1,19–2,39x), устанавливая два измеримых критерия эффективного управления агентом: достаточность когорт по срокам и размещение вычислений.'}, 'en': {'title': 'Optimizing GPU Control for Efficient LLM-Agent Services', 'desc': 'This paper investigates how to optimize GPU control for large language model (LLM) agent services by analyzing scheduling and routing strategies. It introduces measurable metrics such as fixed-partition share and online achieved share to evaluate GPU execution efficiency. The studies demonstrate that keeping certain computations on-device can significantly improve performance compared to redispatching to the host. Overall, the findings establish key parameters for enhancing GPU agent control in real-time applications.'}, 'zh': {'title': 'GPU代理控制的可测量门', 'desc': '本文通过分析并发队列调度和设备内路由与主机重调度，定义了可测量的GPU控制门，以支持大规模语言模型（LLM）代理服务。研究探讨了在何种情况下控制路径能够为GPU执行提供足够的并发工作，以及当GPU计算的路由决策保留在设备上时会发生什么变化。通过固定分区共享、离线共享、局部上限和在线实现共享等指标，研究了在特定条件下的性能表现。最终，研究确立了GPU代理控制的两个可测量门：符合截止日期的队列供应和观察放置。'}}}, {'id': 'https://huggingface.co/papers/2608.08107', 'title': 'NeuPAT: Neuron-aware Plasticity Allocation Tuning for Language-Preserving MLLMs', 'url': 'https://huggingface.co/papers/2608.08107', 'abstract': 'Abstract NeuPAT selectively constrains updates to language-sensitive neurons during multimodal tuning to preserve LLM language capabilities while enabling perceptual adaptation.  Generated by thinkingmachines/Inkling-Small Multimodal expansion of large language models (LLMs) enables new perceptual capabilities but often compromises the language intelligence acquired during pretraining. In this work, we investigate this phenomenon from the perspective of internal adaptation dynamics and discover that neurons in pretrained LLMs exhibit heterogeneous plasticity during multimodal learning: some neurons are critical for preserving language capabilities, while others are more adaptive to multimodal knowledge. Based on this insight, we propose NeuPAT (Neuron-aware Plasticity Allocation Tuning), a lightweight and architecture-agnostic framework that allocates neuron-wise update constraints during multimodal instruction tuning. NeuPAT uses a small-scale probing stage to estimate neuron adaptation patterns and selectively protects language-sensitive neurons while promoting multimodal adaptation through more plastic neurons. Experiments across diverse LLM families demonstrate that NeuPAT recovers 94.5\\% of the language capability degradation caused by vanilla tuning on 11 language benchmarks while maintaining comparable multimodal performance, providing an effective approach for capability-preserving multimodal expansion.', 'score': 1, 'issue_id': 2950, 'pub_date': '2026-08-08', 'pub_date_card': {'ru': '8 августа', 'en': 'August 8', 'zh': '8月8日'}, 'hash': '7a4253f6404e9260', 'authors': ['Jiayue Jin', 'Jingwei Zhang', 'Chen Wang', 'Jing Liu', 'Longteng Guo'], 'affiliations': ['College of Intelligent Robotics and Advanced Manufacturing, Fudan University', 'Institute of Automation, Chinese Academy of Sciences', 'Nankai University', 'School of Artificial Intelligence, University of Chinese Academy of Sciences', 'Tianjin University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2608.08107.jpg', 'data': {'categories': ['#training', '#architecture', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Избирательная защита языковых нейронов при мультимодальной адаптации', 'desc': 'NeuPAT — это метод для адаптации больших языковых моделей к мультимодальным задачам, который сохраняет языковые способности модели. Исследователи обнаружили, что нейроны в предобученных LLM имеют разную пластичность: одни критичны для языковых навыков, а другие легче адаптируются к новым модальностям. Предложенный подход использует зондирующий этап для определения паттернов адаптации нейронов и селективно защищает языко-чувствительные нейроны, позволяя пластичным нейронам обучаться мультимодальному знанию. Эксперименты показали, что NeuPAT восстанавливает 94.5% потерь языковых способностей при мультимодальном обучении, сохраняя производительность по мультимодальным задачам.'}, 'en': {'title': 'NeuPAT: Balancing Language and Multimodal Learning in LLMs', 'desc': 'The paper introduces NeuPAT, a framework designed to enhance large language models (LLMs) during multimodal tuning while preserving their language capabilities. It identifies that different neurons in pretrained LLMs have varying levels of adaptability, with some being crucial for language tasks and others more suited for multimodal tasks. NeuPAT selectively constrains updates to language-sensitive neurons, allowing for better retention of language skills while still enabling the model to adapt to new multimodal information. Experimental results show that NeuPAT significantly reduces language capability loss during tuning, achieving high performance across multiple language benchmarks without sacrificing multimodal effectiveness.'}, 'zh': {'title': '保护语言能力，实现多模态适应', 'desc': 'NeuPAT是一种新方法，旨在在多模态调优过程中保护语言敏感神经元的能力，同时允许感知适应。研究发现，预训练的大型语言模型（LLM）中的神经元在多模态学习中表现出不同的可塑性，有些神经元对语言能力至关重要，而另一些则更适应多模态知识。NeuPAT通过在多模态指令调优中分配神经元更新约束，选择性地保护语言敏感神经元，同时促进更具可塑性的神经元进行多模态适应。实验表明，NeuPAT能够恢复94.5%的语言能力损失，同时保持相似的多模态性能，提供了一种有效的能力保护多模态扩展方法。'}}}, {'id': 'https://huggingface.co/papers/2608.06729', 'title': 'AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2608.06729', 'abstract': 'Abstract AtlasVLA improves embodied AI by replacing reactive control with proactive reasoning via persistent world-ego memory, enabling robust long-horizon manipulation from a single wrist camera.  Generated by thinkingmachines/Inkling-Small While Vision-Language-Action (VLA) models have advanced embodied AI, their fundamentally reactive paradigm severely limits performance in partially observable and long-horizon tasks. When restricted to a single wrist-mounted camera, they inevitably suffer from perception forgetting as objects exit the field of view, and temporal task-progress forgetting} during multi-step execution. To overcome these bottlenecks, we propose AtlasVLA, a novel framework that transitions from direct reactive manipulation to proactive reasoning through a persistent world-ego state. AtlasVLA features a dual-memory architecture: a 4D Persistent World State Memory that lifts transient 2D observations into a globally updated, voxel-hashed spatial state to resolve visual blind spots, and an Ego-Working State Memory that tracks historical ego state and task progress. By conditioning a diffusion transformer (DiT) on this joint World-Ego state, AtlasVLA enables robust spatial reasoning. Extensive evaluations across LIBERO, RLBench, and real-world benchmarks demonstrate that AtlasVLA achieves state-of-the-art performance using solely a wrist camera. Remarkably, it decisively outperforms multi-view baselines, yielding absolute success rate improvements of 9.4% on LIBERO-Long and 17.5% in real-world long-horizon tasks.', 'score': 1, 'issue_id': 2951, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'c677c8490f5f7941', 'authors': ['Guiyu Zhao', 'Longteng Guo', 'Yanghong Mei', 'Zilin Zhu', 'Yu Zhang', 'Bin Cao', 'Mingming Yu', 'Xingjian He', 'Jie Jiang', 'Jing Liu'], 'affiliations': ['Beihang University', 'Beijing Freedo Technology Co., Ltd.', 'Institute of Automation, Chinese Academy of Sciences, Beijing, China', 'University of Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.06729.jpg', 'data': {'categories': ['#cv', '#multimodal', '#agents', '#architecture', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'От реактивного управления к предусмотрительному рассуждению через память о мире', 'desc': 'AtlasVLA — это новая архитектура для воплощённого AI, которая преодолевает ограничения реактивных Vision-Language-Action моделей путём введения устойчивой памяти о мире и агенте. Система использует двойную архитектуру памяти: четырёхмерную память глобального состояния мира (на основе вокселей) для отслеживания объектов вне поля зрения, и память рабочего состояния агента для учёта истории действий и прогресса задачи. Эта информация из памяти подаётся на вход диффузионному трансформеру, что позволяет проводить пространственное рассуждение и плани́рование на протяжении длинной последовательности действий. Модель демонстрирует лучшие результаты среди аналогов, работая только с одной камеры на запястье манипулятора и значительно превосходя системы с несколькими камерами.'}, 'en': {'title': 'Proactive Reasoning for Enhanced Embodied AI', 'desc': "AtlasVLA enhances embodied AI by shifting from reactive control to proactive reasoning, utilizing a persistent memory of the world and the agent's state. This framework addresses challenges in long-horizon tasks by maintaining a comprehensive understanding of the environment, even when objects are not visible. It employs a dual-memory architecture that combines a 4D Persistent World State Memory with an Ego-Working State Memory to improve spatial reasoning and task execution. As a result, AtlasVLA demonstrates superior performance in various benchmarks, significantly outperforming traditional multi-view approaches."}, 'zh': {'title': 'AtlasVLA：从反应控制到主动推理的革命', 'desc': 'AtlasVLA是一种新颖的框架，通过持久的世界自我记忆，改善了具身人工智能的能力。它采用双重记忆架构，能够将瞬时的2D观察提升为全球更新的4D持久世界状态，从而解决视觉盲点问题。AtlasVLA还跟踪历史自我状态和任务进展，使得在单一手腕相机的情况下，能够进行更强大的空间推理。经过广泛评估，AtlasVLA在多个基准测试中表现出色，显著提高了成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.11215', 'title': "Poor Man's Agentic Modeling: Simulating Large LLM-Agent Societies on a Laptop", 'url': 'https://huggingface.co/papers/2608.11215', 'abstract': 'Abstract Replacing individual LLM agents with low-parameter surrogates fitted from cheap queries enables scalable society simulations, with validity predicted by an interaction-order and memory taxonomy.  Generated by thinkingmachines/Inkling-Small Simulating societies of many large language model (LLM) agents is expensive, yet the questions asked of such simulations are usually macroscopic: phase behaviour, stylised facts, and scaling with the number of agents N, not the cognition of any single agent. We turn a statistical-physics observation into a method: replace each LLM agent by a low-parameter model fitted from a few hundred to a few thousand cheap queries, then run the society at any N on a laptop. Whether this works is decided before the simulation runs, chiefly by what each agent perceives. We introduce an [interaction order x memory] taxonomy that maps perception and memory to an effective theory and a predicted N-trend of the surrogate error. We validate it on a faithful reimplementation of the LLM macroeconomy EconAgent and seven further named LLM simulations, with agent decisions cloned from genuine LLM elicitations (primarily DeepSeek) for a few dollars; the predicted error trends hold cell by cell, and the two refuted predictions, both on a strongly saturating response and traced to its curvature, are themselves matched quantitatively by the theory with no free parameters.', 'score': 1, 'issue_id': 2952, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': '8fdd999b80aca61e', 'authors': ['Igor Itkin'], 'affiliations': ['Independent Researcher, Tel Aviv, Israel'], 'pdf_title_img': 'assets/pdf/title_img/2608.11215.jpg', 'data': {'categories': [], 'emoji': '🏘️', 'ru': {'title': 'Дешёвые суррогаты вместо дорогих агентов: масштабируемые симуляции обществ LLM', 'desc': 'В этой работе предлагается метод замены дорогостоящих LLM агентов на лёгкие суррогатные модели с малым числом параметров, обученные на небольшом количестве дешёвых запросов. Это позволяет масштабировать симуляции больших обществ агентов на обычном ноутбуке, сохраняя корректность предсказаний макроскопических свойств системы. Авторы развивают таксономию «порядок взаимодействия × память», которая связывает восприятие и память агентов с эффективной теорией и предсказывает тренд ошибки суррогатов при масштабировании числа агентов N. Метод валидирован на нескольких известных LLM симуляциях, включая EconAgent, с предсказаниями, совпадающими с экспериментальными данными без настраиваемых параметров.'}, 'en': {'title': 'Scalable Society Simulations with Low-Parameter Surrogates', 'desc': 'This paper presents a method to simulate large societies of language model agents using low-parameter surrogates, which are simpler models derived from a limited number of queries. The approach leverages a statistical-physics observation to replace expensive individual LLM agents with these surrogates, allowing for scalable simulations on standard hardware. The authors introduce an interaction-order and memory taxonomy to predict the validity of these simulations based on how agents perceive their environment. The method is validated through various simulations, demonstrating that the predicted error trends align with actual outcomes, confirming the effectiveness of the surrogate models.'}, 'zh': {'title': '用低参数模型高效模拟社会', 'desc': '这篇论文提出了一种用低参数替代模型来模拟大型语言模型（LLM）代理的方法，从而降低了模拟社会的成本。通过对少量便宜查询的拟合，这些低参数模型可以有效地替代每个LLM代理。论文中引入了一种交互顺序与记忆的分类法，帮助预测替代模型的误差趋势。研究结果表明，这种方法在多个LLM模拟中得到了验证，且预测的误差趋势与实际结果一致。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (8)', '#agi', '#alignment (3)', '#architecture (4)', '#audio', '#benchmark (8)', '#cv (4)', '#data', '#dataset (7)', '#diffusion (2)', '#ethics (1)', '#games (3)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (1)', '#interpretability (1)', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (7)', '#open_source (3)', '#optimization (2)', '#plp', '#rag', '#reasoning (2)', '#rl', '#rlhf (2)', '#robotics (2)', '#science (2)', '#security (3)', '#small_models (1)', '#story_generation (1)', '#survey', '#synthetic (1)', '#training (6)', '#transfer_learning (1)', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-13 09:55',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-13 09:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-13 09:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
