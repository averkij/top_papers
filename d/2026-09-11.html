    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.10715', 'title': 'NCP-ArchPreview Technical Report: Moving towards Latent Space Language Models through Next Concept Prediction', 'url': 'https://huggingface.co/papers/2609.10715', 'abstract': 'Abstract NCP-ArchPreview is a large latent-space language model that jointly trains next-token and next-concept prediction to improve pretraining efficiency and downstream performance.  Generated by thinkingmachines/Inkling-Small We introduce NCP-ArchPreview, a latent-space language model that pushes autoregressive pretraining beyond standard next-token prediction (NTP). Alongside NTP, the model learns through Next Concept Prediction (NCP) to predict discrete concepts that span multiple tokens, introducing an explicit and more challenging concept-level objective while preserving standard token-level autoregressive generation. NCP-ArchPreview builds a latent space by constructing a product-quantized concept vocabulary directly from its hidden states, and subsequently learns to predict future concepts via a dedicated Concept Module. These predicted concepts are then fed back to the token level to guide subsequent generation, with NTP and NCP trained jointly end-to-end. We scale this architecture to 8.9B parameters and train it on 5.73T tokens from the Dolma-3 dataset, marking the largest demonstration of a latent-space language model to date. Remarkably, by consuming only 51.3% of the total training tokens, NCP-ArchPreview achieves the final pretraining loss of OLMo-3-7B. Following full pretraining, it outperforms OLMo-3-7B by 2.45 points on the downstream macro-average, including a notable 5.99-point gain on GSM8K. Controlled experiments isolate a clear progression of performance gains stemming from both the latent architecture and the NCP objective. Furthermore, utilizing only 85% of the standard computation, NCP-ArchPreview approaches the training loss of a strictly parameter-aligned 8.9B baseline. The learned latent space remains highly valuable after the pretraining stage: updating just the 17M-parameter VQ module yields a novel, lightweight interface for domain adaptation, while a simple injection of concept representations into a DFlash2 drafter improves the mean accepted length by 4.17% with negligible overhead.', 'score': 91, 'issue_id': 3256, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'f78923f33c617d1b', 'authors': ['The Intern-NCP Team', ':', 'Jiaqi Cao', 'Chiyu Chen', 'Shuang Cheng', 'Xu Cheng', 'Beiya Dai', 'Yufan Feng', 'Kewen Ge', 'Ruijun Ge', 'Jiayi Huang', 'Yang Jiao', 'Dahua Lin', 'Zhouhan Lin', 'Yifan Liu', 'Yuliang Liu', 'Biqing Qi', 'Mowen Ruan', 'Junzhe Shen', 'Yunchong Song', 'Hao Sun', 'Zhongbo Tian', 'Yixuan Wang', 'Rubin Wei', 'Jiaxin Xiong', 'Kangyu Yang', 'Qian Yao', 'Qi Zhang', 'Bowen Zhou'], 'affiliations': ['LUMIA Lab, Shanghai Jiao Tong University', 'Shanghai AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.10715.jpg', 'data': {'categories': ['#open_source', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Двухуровневое предсказание: от токенов к концептам', 'desc': 'NCP-ArchPreview — это большая языковая модель в скрытом пространстве, которая одновременно обучается предсказанию следующего токена и следующего концепта для повышения эффективности предварительного обучения. Модель использует продуктивную квантизацию для создания словаря концептов на основе скрытых состояний и обучается предсказывать будущие концепты через специальный Модуль Концептов. Параллельное обучение NTP и NCP происходит end-to-end, при этом предсказанные концепты направляются обратно на уровень токенов для управления генерацией. Масштабируясь до 8.9B параметров, модель достигает производительности OLMo-3-7B, потребив только 51.3% обучающих данных, и показывает значительные улучшения на downstream задачах.'}, 'en': {'title': 'Revolutionizing Language Modeling with Conceptual Insights', 'desc': 'NCP-ArchPreview is a novel language model that enhances pretraining efficiency by integrating next-token prediction with next-concept prediction. This dual approach allows the model to learn not only individual tokens but also broader concepts that span multiple tokens, creating a richer understanding of language. By constructing a latent space from its hidden states, the model can predict future concepts, which are then used to inform token generation. With 8.9 billion parameters, NCP-ArchPreview demonstrates significant performance improvements on downstream tasks while using fewer training tokens and computational resources compared to traditional models.'}, 'zh': {'title': '联合训练提升语言模型性能的创新', 'desc': 'NCP-ArchPreview是一种大型潜在空间语言模型，它通过联合训练下一个标记预测和下一个概念预测来提高预训练效率和下游性能。该模型不仅进行标准的下一个标记预测（NTP），还学习通过下一个概念预测（NCP）来预测跨多个标记的离散概念，从而引入了更具挑战性的概念级目标。NCP-ArchPreview构建了一个潜在空间，并通过专门的概念模块学习预测未来的概念，这些预测的概念随后反馈到标记级别以指导后续生成。该模型在Dolma-3数据集上训练，参数规模达到8.9亿，显著提高了下游任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.11929', 'title': 'SenseNova-U1.5: Towards Native Unified Visual Intelligence', 'url': 'https://huggingface.co/papers/2609.11929', 'abstract': 'Abstract SenseNova-U1.5 is an 8B native unified multimodal model that performs visual understanding, reasoning, and generation without encoders or VAEs, achieving high fidelity and instruction following through patch reconstruction, curated data, expert optimization, and on-policy distillation.  Generated by thinkingmachines/Inkling-Small We launch SenseNova-U1.5, an 8B-MoT native unified multimodal model that understands, reasons about, and generates visual content within an encoder-free and VAE-free architecture. We strengthen its visual interface through spatially coherent patch reconstruction and scale its training with carefully curated generation and editing data, improved task formulation, structural prompt enhancement, and native resolutions of up to 4K. For post-training, we optimize specialized experts for visual aesthetics, bilingual text rendering, infographic generation, and image editing, and consolidate their capabilities through multi-expert on-policy distillation. Across extensive evaluations, SenseNova-U1.5 largely advances image fidelity, text rendering, complex composition, multi-reference editing, and interleaved generation, while improving instruction following and preserving subject identity, geometry, and unmodified regions. Despite limited exposure to structured formats in its generation data, SenseNova-U1.5 generalizes effectively to long, complex, and structured visual instructions, further proving that multimodal understanding can transfer to visual planning and creation. Together, these findings position native unified modelling as a promising path towards systems that perceive, reason and create within a fully end-to-end framework. We will open-source training code, including supervised fine-tuning, reinforcement learning, and on-policy distillation.', 'score': 53, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9601460bf133a313', 'pdf_title_img': 'assets/pdf/title_img/2609.11929.jpg', 'data': {'categories': ['#video', '#optimization', '#training', '#architecture', '#multimodal', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Единая мультимодальная модель для понимания, рассуждения и создания визуального контента', 'desc': 'SenseNova-U1.5 — это 8-миллиардная унифицированная мультимодальная модель, которая понимает, рассуждает о визуальном контенте и генерирует изображения без использования энкодеров или VAE. Модель достигает высокой точности воспроизведения через патч-реконструкцию и обучение на курированных данных с высоким разрешением до 4K. Авторы оптимизировали специализированные эксперты для различных задач — эстетики, многоязычного текста, инфографики и редактирования — и объединили их возможности через дистилляцию на основе политики. Система демонстрирует превосходные результаты в качестве изображений, рендеринге текста, сложной композиции и точно следует инструкциям при сохранении идентичности объектов и геометрии.'}, 'en': {'title': 'Revolutionizing Visual Understanding with Unified Multimodal Models', 'desc': 'SenseNova-U1.5 is a powerful multimodal model designed to understand, reason, and generate visual content without using traditional encoders or variational autoencoders (VAEs). It enhances visual processing through techniques like patch reconstruction and utilizes a carefully curated dataset for training, which allows it to generate high-quality images and text. The model also employs specialized experts for tasks such as image editing and infographic generation, optimizing their performance through a method called on-policy distillation. Overall, SenseNova-U1.5 demonstrates significant advancements in image fidelity and complex visual tasks, showcasing the potential of unified models in multimodal understanding and creative generation.'}, 'zh': {'title': '统一多模态模型的未来之路', 'desc': 'SenseNova-U1.5 是一个具有 80 亿参数的统一多模态模型，能够在没有编码器或变分自编码器的情况下进行视觉理解、推理和生成。该模型通过空间一致的补丁重建和精心策划的数据集来增强其视觉接口，并支持高达 4K 的原生分辨率。后期训练中，我们优化了专门的专家模型，以提升视觉美学、双语文本渲染和图像编辑能力。研究表明，SenseNova-U1.5 在图像保真度、文本渲染和复杂组合方面取得了显著进展，证明了多模态理解可以有效转移到视觉规划和创作中。'}}}, {'id': 'https://huggingface.co/papers/2609.05903', 'title': 'EvoSafeHarness: Evolving Model- and Domain-Specific Harnesses for Securing Agents', 'url': 'https://huggingface.co/papers/2609.05903', 'abstract': "Abstract EvoSafeHarness optimizes deployable safety harnesses by jointly searching natural-language policies and executable logic tailored to a frozen model and target domain, improving safety-utility trade-offs across agent benchmarks.  Generated by thinkingmachines/Inkling-Small Large Language Model (LLM) agents are turning language into real-world effects, making safety necessary against both indirect prompt injections and direct harmful requests. System-level safety harnesses add an enforcement layer beyond model-level defenses, but existing harnesses are usually designed once by experts and applied across heterogeneous models and domains. Effective protection is deployment-dependent: models differ in how much enforcement they need before utility declines, while domains differ in the effects, state, and action sequences that must be governed. A harness that is strict enough for one model may over-block another, and a policy that transfers across domains may miss application-specific safety relations.   We present EvoSafeHarness, a safety-specific optimization framework that synthesizes a deployable harness for a frozen model in a target domain. It jointly searches a natural-language policy and executable code logic, guided by model behavior, domain specifications, and fresh-context adversarial review to reject benchmark-specific rules. Across four agent benchmark families, EvoSafeHarness achieves a stronger safety-utility frontier than fixed expert-designed defenses. On DecodingTrust-Agent, it reduces average attack success rate from 45.6% to 10.0% at a 3.3-point utility cost and achieves the best score in 14 of 15 cells. On AgentDojo, it reaches 82.8% utility at 0.0% ASR, twice CaMeL's utility at the same operating point, and transfers unchanged to unseen AgentDyn suites. It also achieves the best score on Agent-SafetyBench for every victim and keeps mean ASR below 20% under adaptive PAIR attacks with a refinement budget of 16. Analysis shows that domain semantics determine which safety relations and trajectory state are needed, while model and runtime behavior determine how and where those relations should be enforced.", 'score': 30, 'issue_id': 3256, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '03822c3b59e6d608', 'authors': ['Nanxi Li', 'Yingzi Ma', 'Yulong Cao', 'Edward Suh', 'Bo Li', 'Dawn Song', 'Chaowei Xiao'], 'affiliations': ['Johns Hopkins University', 'NVIDIA', 'UC Berkeley', 'University of Illinois Urbana-Champaign', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.05903.jpg', 'data': {'categories': ['#optimization', '#training', '#alignment', '#benchmark', '#agents', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Эволюционная оптимизация персонализированных защит для языковых агентов', 'desc': 'EvoSafeHarness — это фреймворк оптимизации безопасности, который автоматически генерирует защитные механизмы для языковых моделей путём совместного поиска естественно-языковых политик и исполняемого кода логики. Система адаптируется к конкретной замороженной модели и целевой предметной области, учитывая поведение модели и спецификации домена. Подход значительно улучшает баланс между безопасностью и полезностью на различных бенчмарках агентов, снижая успешность атак при минимальном снижении полезности. Экспериментальные результаты показывают превосходство метода над статичными экспертными защитами и хорошую обобщаемость на невидимые домены.'}, 'en': {'title': 'Optimizing Safety Harnesses for Tailored Model Protection', 'desc': 'EvoSafeHarness is a framework designed to enhance the safety of machine learning models by optimizing safety harnesses that adapt to specific deployment contexts. It combines natural-language policies with executable logic to create tailored safety measures for different models and domains. This approach allows for a more effective balance between safety and utility, as it considers the unique behaviors of models and the specific requirements of their operating environments. By outperforming traditional expert-designed defenses, EvoSafeHarness demonstrates significant improvements in reducing attack success rates while maintaining high utility across various benchmarks.'}, 'zh': {'title': 'EvoSafeHarness：优化安全性与效用的平衡', 'desc': 'EvoSafeHarness 是一个优化可部署安全保护装置的框架，它通过联合搜索自然语言策略和可执行逻辑，针对冻结模型和目标领域进行优化，从而改善安全性与效用之间的权衡。该框架能够有效应对间接提示注入和直接有害请求带来的安全风险，提供比传统专家设计的防御更强的保护。EvoSafeHarness 在四个代理基准测试中表现出色，显著降低了攻击成功率，同时保持了较高的效用。通过分析，发现领域语义决定了所需的安全关系，而模型和运行时行为则决定了这些关系的执行方式和位置。'}}}, {'id': 'https://huggingface.co/papers/2609.07064', 'title': 'SpatialBlock: Enhancing Spatial Intelligence in LVLMs via Synthetic Block-Stacking Problem', 'url': 'https://huggingface.co/papers/2609.07064', 'abstract': "Abstract Large vision-language models trained on synthetic block-manipulation tasks improve 3D spatial reasoning and generalize to real-world visual tasks.  Generated by thinkingmachines/Inkling-Small Large Vision-Language Models (LVLMs) have achieved strong performance on diverse visual tasks, yet their ability to reconstruct and reason about the 3D structure of the scene depicted in 2D images -- referred to as spatial intelligence -- remains limited. Existing approaches attempt to address this gap by using real-scene spatial question answering datasets that require dense geometric annotations. However, constructing such labels is costly, time-consuming, and often noisy due to reliance on external perception modules. In this work, we propose a novel paradigm inspired by human cognitive development: learning foundational spatial skills through structured block-manipulation tasks. We introduce SpatialBlock-15k, a synthetic dataset of 15,000 block-stacking problems covering 3D-to-2D projection, viewpoint transformation, and structural combination. The dataset further incorporates controlled color modulation as visual cues to encourage anchor-based reasoning in visually complex conditions. Experiments demonstrate that LVLMs trained on our dataset through either direct answering or reasoning-based prediction significantly outperform baselines and generalize to real-world spatial tasks, despite the dataset's synthetic and compact nature. Code and data are available at https://github.com/rsoohyun/SpatialBlock.", 'score': 24, 'issue_id': 3256, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '6f8b942ac11727b9', 'authors': ['Soohyun Ryu', 'Sohee Kim', 'Eunho Yang'], 'affiliations': ['AITRICS', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2609.07064.jpg', 'data': {'categories': ['#synthetic', '#reasoning', '#training', '#cv', '#multimodal', '#dataset', '#3d', '#open_source'], 'emoji': '🧊', 'ru': {'title': 'Синтетические блоки для развития пространственного мышления больших визуально-языковых моделей', 'desc': 'Исследователи предложили новый подход для улучшения пространственного мышления больших视觉-языковых моделей путём обучения на синтетическом датасете задач со складыванием блоков. Они создали SpatialBlock-15k — компактный датасет из 15 000 синтетических примеров, которые включают трёхмерные проекции, трансформации точек зрения и структурные комбинации блоков. Модели, обученные на этом датасете с использованием прямого ответа или рассуждений, значительно превосходят базовые подходы и успешно обобщаются на реальные пространственные задачи. Такой подход вдохновлён когнитивным развитием человека и демонстрирует, что синтетические данные могут эффективно улучшать понимание трёхмерной структуры сцен в двумерных изображениях.'}, 'en': {'title': 'Enhancing Spatial Intelligence in LVLMs through Synthetic Block Manipulation', 'desc': 'This paper presents a new approach to enhance the spatial reasoning abilities of large vision-language models (LVLMs) by training them on a synthetic dataset called SpatialBlock-15k. The dataset consists of 15,000 block-manipulation tasks that help models learn foundational spatial skills without the need for expensive and noisy real-world annotations. By using structured tasks that simulate human cognitive development, the authors show that LVLMs can improve their performance on 3D spatial reasoning and generalize better to real-world visual tasks. The results indicate that training on this synthetic dataset allows models to effectively handle complex visual scenarios, demonstrating the potential of synthetic data in machine learning.'}, 'zh': {'title': '通过块操作任务提升空间智能', 'desc': '本文提出了一种新的学习方法，通过结构化的块操作任务来提高大型视觉语言模型（LVLMs）的空间智能。我们创建了一个名为SpatialBlock-15k的合成数据集，包含15,000个块堆叠问题，涵盖了3D到2D的投影、视角变换和结构组合。该数据集还引入了受控的颜色调节作为视觉线索，以促进在复杂视觉条件下的基于锚点的推理。实验结果表明，基于我们数据集训练的LVLMs在直接回答或基于推理的预测中显著优于基线，并能很好地推广到真实世界的空间任务。'}}}, {'id': 'https://huggingface.co/papers/2609.11499', 'title': 'Recursive Code World Models: Building Complex Worlds through Recursive Scene Programs', 'url': 'https://huggingface.co/papers/2609.11499', 'abstract': 'Abstract RCWM recursively builds complex 3D worlds as executable code from a single image by alternating global and local reconstruction with shared camera alignment.  Generated by thinkingmachines/Inkling-Small Code world models represent worlds as executable programs, but this representation alone does not determine how to construct a complex world. We introduce Recursive Code World Models (RCWM), a framework for reconstructing complex 3D worlds in code from a single reference image. RCWM couples a Recursive Scene Program (RSP) representation with a construction solver that recursively calls itself. An RSP represents the executable world as compositional scene code, while each solver call follows the same complete process: establish the whole, recursively reconstruct unresolved parts, and revisit the whole to refine their composition. This global-local-global recursion gives fine-scale structures their own perception-and-editing loops while preserving scene-wide geometry and relationships. Reference-aligned views propagate a shared camera projection across levels, while parent revisitation addresses boundaries, spatial relations, and shared errors that emerge after local refinement. A vision-language coding agent directly compares reference images with scene renders to guide refinement, recursive descent, and return. Across complex scenes, RCWM outperforms prior code-based image-to-scene reconstruction methods. Ablation studies further support the benefits of recursive construction and suggest that deeper calls can improve finer-scale reconstruction. RCWM provides a recursive construction principle for building complex executable worlds from visual evidence.', 'score': 4, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'ae9c1b29ffc534c7', 'authors': ['Zhiqi Li', 'Yuxuan Liao', 'Bo Zhu'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.11499.jpg', 'data': {'categories': [], 'emoji': '🌍', 'ru': {'title': 'Рекурсивное построение 3D миров из одного изображения через исполняемый код', 'desc': 'Авторы предлагают Recursive Code World Models (RCWM) — фреймворк для реконструкции сложных 3D сцен в виде исполняемого кода по одному входному изображению. Система использует рекурсивное представление сцены (RSP), которое описывает мир как композиционный программный код, позволяя сохранять глобальную геометрию и пространственные отношения. Алгоритм работает по принципу глобально-локально-глобальной рекурсии: сначала устанавливается общая структура, затем рекурсивно восстанавливаются отдельные части, и наконец происходит уточнение всей сцены. Видео-языковой агент сравнивает эталонные изображения с рендерами сцены для направления процесса рефинирования, что позволяет RCWM превосходить предыдущие методы в задаче реконструкции сложных сцен.'}, 'en': {'title': 'Building 3D Worlds Recursively from a Single Image', 'desc': 'The paper introduces Recursive Code World Models (RCWM), a novel framework that constructs complex 3D worlds from a single image by using a recursive approach. It combines a Recursive Scene Program (RSP) representation with a construction solver that iteratively refines the world model. This method alternates between global and local reconstruction, allowing for detailed structures to be built while maintaining overall scene coherence. The results show that RCWM outperforms previous methods in image-to-scene reconstruction, demonstrating the effectiveness of recursive construction in generating executable 3D environments.'}, 'zh': {'title': '从单图像构建复杂3D世界的递归方法', 'desc': 'RCWM（递归代码世界模型）是一种从单张图像重建复杂3D世界的框架。它通过递归调用构建求解器，结合递归场景程序（RSP）表示可执行的世界。该方法在全局和局部重建之间交替进行，确保细节结构的感知和编辑，同时保持场景的几何关系。RCWM在复杂场景的重建中优于以往的代码基础图像到场景的重建方法，展示了递归构建的优势。'}}}, {'id': 'https://huggingface.co/papers/2609.06931', 'title': 'CARDEA: Auditable Reasoning Grounded in Spatial Evidence for End-to-End Coronary Angiography Interpretation', 'url': 'https://huggingface.co/papers/2609.06931', 'abstract': 'Abstract A unified vision-language model for coronary angiography uses chain-of-box reasoning and reinforcement learning with verifiable rewards to provide auditable diagnoses and improve zero-shot report generation.  Generated by thinkingmachines/Inkling-Small Invasive coronary angiography (CAG) is the gold standard for diagnosing coronary artery disease, but interpretation varies substantially among observers. Existing AI systems can improve consistency but lack auditable decision processes and are limited in comprehensive open-ended assessment, undermining clinician trust and clinical adoption readiness. We developed CARDEA, a unified large vision-language model that serves as the inference core of a CAG pipeline. It was trained solely on public datasets and closed-ended tasks in three stages: visual feature alignment, a self-distilled Chain-of-Box (CoB) cold start, and reinforcement learning with verifiable rewards (RLVR) with a CoB reward encouraging bounding-box use in the reasoning trace. We assessed its two study-level diagnoses, dominance classification and complexity assessment, against a dedicated classifier and two interventional cardiologists. Report generation was excluded from training and evaluated zero-shot across stages on an external cohort using vessel-severity macro-F_1. CARDEA trailed the classifier on in-distribution dominance but drew level under domain shift (accuracy, 0.91 [95% confidence interval (CI), 0.86 to 0.95]) and was comparable to the cardiologists on complexity assessment (accuracy, 0.90 [CI, 0.82 to 0.97]). Only RLVR improved zero-shot report generation, raising its vessel-severity macro-F_1 (0.686 [CI, 0.664 to 0.707]) above the untuned base model (0.513) and over twice the always-normal floor (0.312). CARDEA runs an end-to-end CAG pipeline from raw multi-view videos through keyframe selection to study-level diagnosis while exposing auditable spatial evidence behind its conclusions. RLVR on verifiable closed-ended tasks surfaced open-ended reporting ability that supervised imitation did not. Clinical use requires prospective validation against expert cardiologists.', 'score': 3, 'issue_id': 3256, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'c75a31fdc96cf6ce', 'authors': ['Jia-Jen Lee', 'Shih-Yen Hou', 'Kee Koon Ng', 'Wei-Chun Wang', 'Shih-Sheng Chang'], 'affiliations': ['Artificial Intelligence and Robotics Innovation Center, China Medical University Hospital, Taichung, Taiwan', 'Department of Neurology, China Medical University Hospital, China Medical University, Taichung, Taiwan', 'Division of Cardiovascular Medicine, Department of Internal Medicine, China Medical University Hospital, Taichung, Taiwan', 'Neuroscience and Brain Disease Center, China Medical University, Taichung, Taiwan', 'School of Medicine, China Medical University, Taichung, Taiwan'], 'pdf_title_img': 'assets/pdf/title_img/2609.06931.jpg', 'data': {'categories': ['#reasoning', '#rl', '#cv', '#science', '#multimodal', '#rlhf', '#open_source', '#healthcare'], 'emoji': '🫀', 'ru': {'title': 'Прозрачный диагноз через верифицируемое обучение с подкреплением', 'desc': 'Авторы разработали CARDEA — единую vision-language модель для анализа коронарной ангиографии, которая обеспечивает прозрачные и проверяемые диагнозы. Модель обучалась в три этапа: выравнивание визуальных признаков, самодистилляция с использованием цепочки ограничивающих рамок (Chain-of-Box) и обучение с подкреплением с верифицируемыми вознаграждениями (RLVR). Система демонстрирует сопоставимую с кардиологами точность при классификации сложности и оценке доминантности коронарных артерий, а также показывает улучшенную генерацию клинических отчётов в режиме zero-shot. Ключевой вклад работы заключается в том, что обучение с подкреплением на проверяемых закрытых задачах улучшило способность модели к открытой генерации отчётов, превысив базовую модель более чем в два раза.'}, 'en': {'title': 'CARDEA: Trustworthy AI for Coronary Angiography Diagnosis', 'desc': 'The paper presents CARDEA, a unified vision-language model designed for interpreting coronary angiography (CAG) images. It employs chain-of-box reasoning and reinforcement learning with verifiable rewards to enhance the accuracy and transparency of diagnoses. CARDEA was trained on public datasets and is capable of generating reports without prior training on specific cases, demonstrating strong performance in zero-shot scenarios. The model aims to improve clinician trust by providing auditable decision-making processes and comprehensive assessments of coronary artery disease.'}, 'zh': {'title': 'CARDEA：提升冠状动脉造影诊断的智能模型', 'desc': '这篇论文介绍了一种统一的视觉-语言模型CARDEA，用于冠状动脉造影（CAG）的诊断。该模型采用链式框推理和可验证奖励的强化学习，旨在提高报告生成的准确性和可审计性。通过在公共数据集上训练，CARDEA能够在不同的任务中进行有效的推理，并在复杂性评估中与心脏病专家的表现相当。研究结果表明，CARDEA在零样本报告生成方面的表现优于未调优的基线模型，显示出其在临床应用中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.11548', 'title': 'World in World: Explore the World with World Models', 'url': 'https://huggingface.co/papers/2609.11548', 'abstract': "Abstract A training-free interface enables flexible camera and time control in frozen autoregressive video world models by routing heterogeneous visual evidence through native self-attention with correspondence-guided queries and per-channel attention guidance.  Generated by thinkingmachines/Inkling-Small Autoregressive video world models enable interactive, long-horizon exploration, but flexible control remains challenging. Exploring a source video from new viewpoints requires the generated rollout to remain synchronised with the recorded event, place observed content in the requested view, plausibly complete newly exposed regions, and recover previously generated appearance on revisits. Existing methods typically address these requirements through task-specific modules or additional training. We present World in World, a training-free inference-time interface that converts heterogeneous control evidence into camera- and time-labelled clean visual states, which are read through the native self attention of a frozen causal video model. The evidence comprises source-video observations, target-view scene projections, geometry renderings that guide completion of newly exposed subject regions, and retrieved generated states beyond the rolling cache. Each evidence source carries token-level support and its own availability schedule. A correspondence router combines persistent point identities with geometry to establish token correspondences, guiding supported queries towards matching source-video tokens. Evidence-wise attention CFG (EWA) then independently regulates each auxiliary channel's additional contribution using attention responses from the same denoising forward pass. The shared interface supports camera-controlled rerendering, long-horizon revisiting, and human-motion transfer with the same frozen backbone. We evaluate World in World on camera-controlled video rerendering under diverse viewpoint changes, assessing perceptual quality, temporal consistency, and camera-following accuracy.", 'score': 2, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'dbd3e0dc736350fa', 'authors': ['Chenxi Song', 'Yanming Yang', 'Chi Zhang'], 'affiliations': ['AGI Lab, Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2609.11548.jpg', 'data': {'categories': ['#inference', '#long_context', '#video', '#architecture'], 'emoji': '🎥', 'ru': {'title': 'Управление видео без переобучения через умную маршрутизацию внимания', 'desc': 'Статья описывает World in World — метод для гибкого управления камерой и временем в замороженных авторегрессивных видео-моделях мира без дополнительного обучения. Система маршрутизирует разнородные визуальные доказательства (исходное видео, целевая проекция, геометрия, закешированные состояния) через встроенный self-attention механизм с помощью соответствия точек и per-channel guidance. Ключевая инновация — correspondence router, который связывает персистентные идентичности точек с геометрией, направляя запросы к релевантным токенам исходного видео. Evidence-wise Attention CFG независимо регулирует вклад каждого вспомогательного канала, позволяя одному замороженному базовому моделю выполнять переренdering с изменением камеры, долгосрочное посещение и передачу движения.'}, 'en': {'title': 'Flexible Video Control Without Training', 'desc': 'This paper introduces a novel interface called World in World, which allows for flexible control of video generation without the need for additional training. It utilizes a frozen autoregressive video model that processes various types of visual evidence through self-attention mechanisms. The method effectively synchronizes generated video content with real-world events, enabling users to explore videos from different perspectives while maintaining visual coherence. By employing a correspondence router and evidence-wise attention, the approach enhances the quality and consistency of the generated video outputs during interactive exploration.'}, 'zh': {'title': '灵活控制视频生成的新方法', 'desc': '这篇论文介绍了一种名为"World in World"的训练无关接口，旨在实现灵活的相机和时间控制。该方法通过自注意力机制处理不同来源的视觉信息，使得生成的视频能够在不同视角下保持一致性。它利用几何渲染和对应路由来引导新曝光区域的补全，同时支持长时间的回访和人类动作的转移。通过这种方式，研究者们能够在不需要额外训练的情况下，实现高质量的视频重渲染。'}}}, {'id': 'https://huggingface.co/papers/2609.10712', 'title': 'An Open Recipe for IMO Gold: Training Nemotron for Olympiad Mathematics', 'url': 'https://huggingface.co/papers/2609.10712', 'abstract': 'Abstract A natural-language proof-generation pipeline using post-trained Nemotron 3 Ultra checkpoints achieves gold-medal performance on IMO 2026 through iterative verification and refinement without external tools.  Generated by thinkingmachines/Inkling-Small We study how model post-training and test-time inference design affect natural-language proof generation for hard olympiad mathematics. Starting from Nemotron 3 Ultra, we train two specialist checkpoints using supervised fine-tuning and reinforcement learning, and evaluate checkpoint choice, verification, and refinement. Based on these findings, we present an open-model test-time-compute pipeline. The system operates entirely in natural language, with no formal prover, external tools, or internet access. Three Nemotron 3 Ultra checkpoints - the general-availability model and two post-trained specialists - power an iterative search that generates, verifies, and refines candidate proofs; a separate high-compute stage then selects each final submission. The system scored 30 out of 42 points at IMO 2026, reaching the gold-medal threshold. We release the two post-trained checkpoints as well as the training data, the training and inference code, the submitted solutions, and Nemotron-IMO-Bench, a new benchmark of 200 novel olympiad-level problems.', 'score': 1, 'issue_id': 3256, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '8d7c7736ab576468', 'authors': ['Ivan Moshkov', 'Stephen Ge', 'George Armstrong', 'Wei Du', 'Sadegh Mahdavi', 'Igor Gitman'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.10712.jpg', 'data': {'categories': ['#reasoning', '#science', '#training', '#math', '#inference', '#benchmark', '#dataset', '#open_source'], 'emoji': '🏅', 'ru': {'title': 'Языковые модели решают олимпиадные задачи через итеративное уточнение доказательств', 'desc': 'Авторы разработали конвейер для генерации математических доказательств на естественном языке, используя пост-обученные модели Nemotron 3 Ultra. Система применяет supervised fine-tuning и reinforcement learning для создания специализированных контрольных точек, которые работают в режиме итеративного поиска с генерацией, верификацией и уточнением кандидатов доказательств. Весь процесс происходит полностью на естественном языке без использования формальных верификаторов и внешних инструментов. Система достигла результата, соответствующего золотой медали на Международной математической олимпиаде 2026, набрав 30 из 42 баллов.'}, 'en': {'title': 'Revolutionizing Proof Generation with Natural Language Models', 'desc': "This paper presents a natural-language proof-generation system that utilizes post-trained Nemotron 3 Ultra models to achieve high performance in generating proofs for complex mathematics problems. The authors explore how post-training and the design of inference processes impact the effectiveness of proof generation, employing techniques like supervised fine-tuning and reinforcement learning. The system operates entirely in natural language, eliminating the need for formal provers or external tools, and employs an iterative process for generating, verifying, and refining proofs. The results demonstrate the system's capability, achieving a score that meets the gold-medal criteria at the IMO 2026 competition, and the authors provide access to their models and a new benchmark for future research."}, 'zh': {'title': '自然语言证明生成的金牌之路', 'desc': '这篇论文介绍了一种自然语言证明生成的流程，使用了经过后训练的Nemotron 3 Ultra模型，在IMO 2026比赛中取得了金牌表现。研究了模型后训练和测试时推理设计如何影响难度较大的奥林匹克数学的自然语言证明生成。通过监督微调和强化学习训练了两个专业检查点，并评估了检查点选择、验证和精炼的效果。系统完全在自然语言中运行，无需正式证明器、外部工具或互联网访问，最终在IMO 2026中获得了30分，达到了金牌门槛。'}}}, {'id': 'https://huggingface.co/papers/2608.27875', 'title': 'HyQuant: Hybrid-Precision Quantization for LLM Attention', 'url': 'https://huggingface.co/papers/2608.27875', 'abstract': 'Abstract HyQuant improves low-bit LLM attention quantization by preserving critical vertical-line tokens and local windows in high precision while quantizing the rest, maintaining accuracy with low overhead.  Generated by thinkingmachines/Inkling-Small Quantization has been widely adopted in LLM training and inference to reduce cost and improve efficiency. However, low-bit quantization of the attention module often introduces large errors at very low bit-widths, causing performance degradation. Existing methods mainly rely on smoothing techniques to handle outliers, while we propose a hybrid quantization design to better balance accuracy and efficiency. Specifically, we propose HyQuant, an efficient hybrid quantization framework for LLM attention. HyQuant quantizes most attention states into low-bit formats while retaining a small set of vertical-line tokens and local-window states in high precision. These accuracy-critical regions are selected using lightweight vertical-line-aware attention-pattern signals, reducing quantization error with limited overhead. In the Prefill stage, HyQuant uses a hybrid-precision quantized attention operator that preserves vertical-line tokens and a local sliding window in full precision while quantizing the remaining context. In the Decode stage, HyQuant applies the same principle to KV-cache compression and fuses KV dequantization with attention computation to improve memory and hardware efficiency. Across diverse tasks, models, and datasets, HyQuant maintains nearly lossless accuracy with an extremely simple design, demonstrating the efficiency and practical feasibility of hybrid quantization for LLM attention. Code is available at: https://github.com/jerrysfls/HyQuant .', 'score': 1, 'issue_id': 3256, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'e2f1b9b867bf9fd7', 'authors': ['Jiatong Ding', 'Bingxin Xing', 'Yu Zhang', 'Dian Ding', 'Xiaodong Yi', 'Xianbin Ouyang', 'Feihu Zhou', 'Kun Zhang', 'Zhenyu Guo', 'Hao Pan', 'Guangtao Xue', 'Yiming Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'Tencent Penglai Lab', 'Xiamen University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27875.jpg', 'data': {'categories': ['#inference', '#small_models', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Гибридная квантизация: сохранение точности при экономии ресурсов', 'desc': 'HyQuant предлагает гибридный подход к квантованию внимания в больших языковых моделях, сохраняя критически важные токены и локальные окна в высокой точности, а остальное состояние переводя в низкобитовый формат. Метод использует легковесные сигналы паттернов внимания для идентификации областей, чувствительных к точности, что позволяет минимизировать ошибки квантования с небольшими вычислительными затратами. На этапе предзаполнения и декодирования фреймворк применяет гибридную точность, сжимая KV-кэш и интегрируя деквантование с вычислением внимания для улучшения эффективности памяти. Экспериментальные результаты демонстрируют, что HyQuant достигает почти безубыточной точности при экстремально низкой битности с простым и практичным дизайном.'}, 'en': {'title': 'HyQuant: Smart Hybrid Quantization for Efficient LLM Attention', 'desc': 'HyQuant is a novel hybrid quantization framework designed to enhance the efficiency of low-bit quantization in large language model (LLM) attention mechanisms. It intelligently preserves critical vertical-line tokens and local windows in high precision while quantizing the majority of attention states into low-bit formats. This approach minimizes quantization errors that typically arise at very low bit-widths, thus maintaining model accuracy with minimal overhead. By employing lightweight attention-pattern signals, HyQuant effectively balances the trade-off between accuracy and efficiency across various tasks and datasets.'}, 'zh': {'title': 'HyQuant：高效的混合量化框架', 'desc': 'HyQuant是一种改进低比特大语言模型（LLM）注意力量化的方法，它通过保留关键的垂直线标记和局部窗口的高精度来实现，同时对其余部分进行量化，从而在低开销下保持准确性。传统的低比特量化方法在注意力模块中常常引入较大的误差，导致性能下降，而HyQuant采用混合量化设计，更好地平衡了准确性和效率。具体来说，HyQuant将大多数注意力状态量化为低比特格式，同时保留少量的垂直线标记和局部窗口状态为高精度，这样可以减少量化误差。通过在不同任务、模型和数据集上的测试，HyQuant展示了其几乎无损的准确性和混合量化的高效性和实用性。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');

        let selectedArticles = [];
        let sortBy = 'issue_id';

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (1)', '#agi', '#alignment (1)', '#architecture (2)', '#audio', '#benchmark (2)', '#cv (2)', '#data', '#dataset (2)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (3)', '#interpretability', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (3)', '#open_source (5)', '#optimization (3)', '#plp', '#rag', '#reasoning (3)', '#rl (1)', '#rlhf (1)', '#robotics', '#science (2)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic (1)', '#training (5)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);

                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);

                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']

                const articleHTML = `

                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>

                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>

                                <div id="toggle-${index}" class="abstract-toggle">...</div>

                            <div class="links">

                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;

        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

            categoryFiltersContainer.classList.toggle('expanded');

            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {

            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-11 05:29',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-11 05:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-11 05:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
