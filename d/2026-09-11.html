    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.10715', 'title': 'NCP-ArchPreview Technical Report: Moving towards Latent Space Language Models through Next Concept Prediction', 'url': 'https://huggingface.co/papers/2609.10715', 'abstract': 'Abstract NCP-ArchPreview is a large latent-space language model that jointly trains next-token and next-concept prediction to improve pretraining efficiency and downstream performance.  Generated by thinkingmachines/Inkling-Small We introduce NCP-ArchPreview, a latent-space language model that pushes autoregressive pretraining beyond standard next-token prediction (NTP). Alongside NTP, the model learns through Next Concept Prediction (NCP) to predict discrete concepts that span multiple tokens, introducing an explicit and more challenging concept-level objective while preserving standard token-level autoregressive generation. NCP-ArchPreview builds a latent space by constructing a product-quantized concept vocabulary directly from its hidden states, and subsequently learns to predict future concepts via a dedicated Concept Module. These predicted concepts are then fed back to the token level to guide subsequent generation, with NTP and NCP trained jointly end-to-end. We scale this architecture to 8.9B parameters and train it on 5.73T tokens from the Dolma-3 dataset, marking the largest demonstration of a latent-space language model to date. Remarkably, by consuming only 51.3% of the total training tokens, NCP-ArchPreview achieves the final pretraining loss of OLMo-3-7B. Following full pretraining, it outperforms OLMo-3-7B by 2.45 points on the downstream macro-average, including a notable 5.99-point gain on GSM8K. Controlled experiments isolate a clear progression of performance gains stemming from both the latent architecture and the NCP objective. Furthermore, utilizing only 85% of the standard computation, NCP-ArchPreview approaches the training loss of a strictly parameter-aligned 8.9B baseline. The learned latent space remains highly valuable after the pretraining stage: updating just the 17M-parameter VQ module yields a novel, lightweight interface for domain adaptation, while a simple injection of concept representations into a DFlash2 drafter improves the mean accepted length by 4.17% with negligible overhead.', 'score': 196, 'issue_id': 3256, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'f78923f33c617d1b', 'authors': ['The Intern-NCP Team', ':', 'Jiaqi Cao', 'Chiyu Chen', 'Shuang Cheng', 'Xu Cheng', 'Beiya Dai', 'Yufan Feng', 'Kewen Ge', 'Ruijun Ge', 'Jiayi Huang', 'Yang Jiao', 'Dahua Lin', 'Zhouhan Lin', 'Yifan Liu', 'Yuliang Liu', 'Biqing Qi', 'Mowen Ruan', 'Junzhe Shen', 'Yunchong Song', 'Hao Sun', 'Zhongbo Tian', 'Yixuan Wang', 'Rubin Wei', 'Jiaxin Xiong', 'Kangyu Yang', 'Qian Yao', 'Qi Zhang', 'Bowen Zhou'], 'affiliations': ['LUMIA Lab, Shanghai Jiao Tong University', 'Shanghai AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.10715.jpg', 'data': {'categories': ['#open_source', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Двухуровневое предсказание: от токенов к концептам', 'desc': 'NCP-ArchPreview — это большая языковая модель в скрытом пространстве, которая одновременно обучается предсказанию следующего токена и следующего концепта для повышения эффективности предварительного обучения. Модель использует продуктивную квантизацию для создания словаря концептов на основе скрытых состояний и обучается предсказывать будущие концепты через специальный Модуль Концептов. Параллельное обучение NTP и NCP происходит end-to-end, при этом предсказанные концепты направляются обратно на уровень токенов для управления генерацией. Масштабируясь до 8.9B параметров, модель достигает производительности OLMo-3-7B, потребив только 51.3% обучающих данных, и показывает значительные улучшения на downstream задачах.'}, 'en': {'title': 'Revolutionizing Language Modeling with Conceptual Insights', 'desc': 'NCP-ArchPreview is a novel language model that enhances pretraining efficiency by integrating next-token prediction with next-concept prediction. This dual approach allows the model to learn not only individual tokens but also broader concepts that span multiple tokens, creating a richer understanding of language. By constructing a latent space from its hidden states, the model can predict future concepts, which are then used to inform token generation. With 8.9 billion parameters, NCP-ArchPreview demonstrates significant performance improvements on downstream tasks while using fewer training tokens and computational resources compared to traditional models.'}, 'zh': {'title': '联合训练提升语言模型性能的创新', 'desc': 'NCP-ArchPreview是一种大型潜在空间语言模型，它通过联合训练下一个标记预测和下一个概念预测来提高预训练效率和下游性能。该模型不仅进行标准的下一个标记预测（NTP），还学习通过下一个概念预测（NCP）来预测跨多个标记的离散概念，从而引入了更具挑战性的概念级目标。NCP-ArchPreview构建了一个潜在空间，并通过专门的概念模块学习预测未来的概念，这些预测的概念随后反馈到标记级别以指导后续生成。该模型在Dolma-3数据集上训练，参数规模达到8.9亿，显著提高了下游任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.11929', 'title': 'SenseNova-U1.5: Towards Native Unified Visual Intelligence', 'url': 'https://huggingface.co/papers/2609.11929', 'abstract': 'Abstract SenseNova-U1.5 is an 8B native unified multimodal model that performs visual understanding, reasoning, and generation without encoders or VAEs, achieving high fidelity and instruction following through patch reconstruction, curated data, expert optimization, and on-policy distillation.  Generated by thinkingmachines/Inkling-Small We launch SenseNova-U1.5, an 8B-MoT native unified multimodal model that understands, reasons about, and generates visual content within an encoder-free and VAE-free architecture. We strengthen its visual interface through spatially coherent patch reconstruction and scale its training with carefully curated generation and editing data, improved task formulation, structural prompt enhancement, and native resolutions of up to 4K. For post-training, we optimize specialized experts for visual aesthetics, bilingual text rendering, infographic generation, and image editing, and consolidate their capabilities through multi-expert on-policy distillation. Across extensive evaluations, SenseNova-U1.5 largely advances image fidelity, text rendering, complex composition, multi-reference editing, and interleaved generation, while improving instruction following and preserving subject identity, geometry, and unmodified regions. Despite limited exposure to structured formats in its generation data, SenseNova-U1.5 generalizes effectively to long, complex, and structured visual instructions, further proving that multimodal understanding can transfer to visual planning and creation. Together, these findings position native unified modelling as a promising path towards systems that perceive, reason and create within a fully end-to-end framework. We will open-source training code, including supervised fine-tuning, reinforcement learning, and on-policy distillation.', 'score': 156, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9601460bf133a313', 'pdf_title_img': 'assets/pdf/title_img/2609.11929.jpg', 'data': {'categories': ['#video', '#optimization', '#training', '#architecture', '#multimodal', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Единая мультимодальная модель для понимания, рассуждения и создания визуального контента', 'desc': 'SenseNova-U1.5 — это 8-миллиардная унифицированная мультимодальная модель, которая понимает, рассуждает о визуальном контенте и генерирует изображения без использования энкодеров или VAE. Модель достигает высокой точности воспроизведения через патч-реконструкцию и обучение на курированных данных с высоким разрешением до 4K. Авторы оптимизировали специализированные эксперты для различных задач — эстетики, многоязычного текста, инфографики и редактирования — и объединили их возможности через дистилляцию на основе политики. Система демонстрирует превосходные результаты в качестве изображений, рендеринге текста, сложной композиции и точно следует инструкциям при сохранении идентичности объектов и геометрии.'}, 'en': {'title': 'Revolutionizing Visual Understanding with Unified Multimodal Models', 'desc': 'SenseNova-U1.5 is a powerful multimodal model designed to understand, reason, and generate visual content without using traditional encoders or variational autoencoders (VAEs). It enhances visual processing through techniques like patch reconstruction and utilizes a carefully curated dataset for training, which allows it to generate high-quality images and text. The model also employs specialized experts for tasks such as image editing and infographic generation, optimizing their performance through a method called on-policy distillation. Overall, SenseNova-U1.5 demonstrates significant advancements in image fidelity and complex visual tasks, showcasing the potential of unified models in multimodal understanding and creative generation.'}, 'zh': {'title': '统一多模态模型的未来之路', 'desc': 'SenseNova-U1.5 是一个具有 80 亿参数的统一多模态模型，能够在没有编码器或变分自编码器的情况下进行视觉理解、推理和生成。该模型通过空间一致的补丁重建和精心策划的数据集来增强其视觉接口，并支持高达 4K 的原生分辨率。后期训练中，我们优化了专门的专家模型，以提升视觉美学、双语文本渲染和图像编辑能力。研究表明，SenseNova-U1.5 在图像保真度、文本渲染和复杂组合方面取得了显著进展，证明了多模态理解可以有效转移到视觉规划和创作中。'}}}, {'id': 'https://huggingface.co/papers/2609.07064', 'title': 'SpatialBlock: Enhancing Spatial Intelligence in LVLMs via Synthetic Block-Stacking Problem', 'url': 'https://huggingface.co/papers/2609.07064', 'abstract': "Abstract Large vision-language models trained on synthetic block-manipulation tasks improve 3D spatial reasoning and generalize to real-world visual tasks.  Generated by thinkingmachines/Inkling-Small Large Vision-Language Models (LVLMs) have achieved strong performance on diverse visual tasks, yet their ability to reconstruct and reason about the 3D structure of the scene depicted in 2D images -- referred to as spatial intelligence -- remains limited. Existing approaches attempt to address this gap by using real-scene spatial question answering datasets that require dense geometric annotations. However, constructing such labels is costly, time-consuming, and often noisy due to reliance on external perception modules. In this work, we propose a novel paradigm inspired by human cognitive development: learning foundational spatial skills through structured block-manipulation tasks. We introduce SpatialBlock-15k, a synthetic dataset of 15,000 block-stacking problems covering 3D-to-2D projection, viewpoint transformation, and structural combination. The dataset further incorporates controlled color modulation as visual cues to encourage anchor-based reasoning in visually complex conditions. Experiments demonstrate that LVLMs trained on our dataset through either direct answering or reasoning-based prediction significantly outperform baselines and generalize to real-world spatial tasks, despite the dataset's synthetic and compact nature. Code and data are available at https://github.com/rsoohyun/SpatialBlock.", 'score': 81, 'issue_id': 3256, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '6f8b942ac11727b9', 'authors': ['Soohyun Ryu', 'Sohee Kim', 'Eunho Yang'], 'affiliations': ['AITRICS', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2609.07064.jpg', 'data': {'categories': ['#synthetic', '#reasoning', '#training', '#cv', '#multimodal', '#dataset', '#3d', '#open_source'], 'emoji': '🧊', 'ru': {'title': 'Синтетические блоки для развития пространственного мышления больших визуально-языковых моделей', 'desc': 'Исследователи предложили новый подход для улучшения пространственного мышления больших视觉-языковых моделей путём обучения на синтетическом датасете задач со складыванием блоков. Они создали SpatialBlock-15k — компактный датасет из 15 000 синтетических примеров, которые включают трёхмерные проекции, трансформации точек зрения и структурные комбинации блоков. Модели, обученные на этом датасете с использованием прямого ответа или рассуждений, значительно превосходят базовые подходы и успешно обобщаются на реальные пространственные задачи. Такой подход вдохновлён когнитивным развитием человека и демонстрирует, что синтетические данные могут эффективно улучшать понимание трёхмерной структуры сцен в двумерных изображениях.'}, 'en': {'title': 'Enhancing Spatial Intelligence in LVLMs through Synthetic Block Manipulation', 'desc': 'This paper presents a new approach to enhance the spatial reasoning abilities of large vision-language models (LVLMs) by training them on a synthetic dataset called SpatialBlock-15k. The dataset consists of 15,000 block-manipulation tasks that help models learn foundational spatial skills without the need for expensive and noisy real-world annotations. By using structured tasks that simulate human cognitive development, the authors show that LVLMs can improve their performance on 3D spatial reasoning and generalize better to real-world visual tasks. The results indicate that training on this synthetic dataset allows models to effectively handle complex visual scenarios, demonstrating the potential of synthetic data in machine learning.'}, 'zh': {'title': '通过块操作任务提升空间智能', 'desc': '本文提出了一种新的学习方法，通过结构化的块操作任务来提高大型视觉语言模型（LVLMs）的空间智能。我们创建了一个名为SpatialBlock-15k的合成数据集，包含15,000个块堆叠问题，涵盖了3D到2D的投影、视角变换和结构组合。该数据集还引入了受控的颜色调节作为视觉线索，以促进在复杂视觉条件下的基于锚点的推理。实验结果表明，基于我们数据集训练的LVLMs在直接回答或基于推理的预测中显著优于基线，并能很好地推广到真实世界的空间任务。'}}}, {'id': 'https://huggingface.co/papers/2609.05903', 'title': 'EvoSafeHarness: Evolving Model- and Domain-Specific Harnesses for Securing Agents', 'url': 'https://huggingface.co/papers/2609.05903', 'abstract': "Abstract EvoSafeHarness optimizes deployable safety harnesses by jointly searching natural-language policies and executable logic tailored to a frozen model and target domain, improving safety-utility trade-offs across agent benchmarks.  Generated by thinkingmachines/Inkling-Small Large Language Model (LLM) agents are turning language into real-world effects, making safety necessary against both indirect prompt injections and direct harmful requests. System-level safety harnesses add an enforcement layer beyond model-level defenses, but existing harnesses are usually designed once by experts and applied across heterogeneous models and domains. Effective protection is deployment-dependent: models differ in how much enforcement they need before utility declines, while domains differ in the effects, state, and action sequences that must be governed. A harness that is strict enough for one model may over-block another, and a policy that transfers across domains may miss application-specific safety relations.   We present EvoSafeHarness, a safety-specific optimization framework that synthesizes a deployable harness for a frozen model in a target domain. It jointly searches a natural-language policy and executable code logic, guided by model behavior, domain specifications, and fresh-context adversarial review to reject benchmark-specific rules. Across four agent benchmark families, EvoSafeHarness achieves a stronger safety-utility frontier than fixed expert-designed defenses. On DecodingTrust-Agent, it reduces average attack success rate from 45.6% to 10.0% at a 3.3-point utility cost and achieves the best score in 14 of 15 cells. On AgentDojo, it reaches 82.8% utility at 0.0% ASR, twice CaMeL's utility at the same operating point, and transfers unchanged to unseen AgentDyn suites. It also achieves the best score on Agent-SafetyBench for every victim and keeps mean ASR below 20% under adaptive PAIR attacks with a refinement budget of 16. Analysis shows that domain semantics determine which safety relations and trajectory state are needed, while model and runtime behavior determine how and where those relations should be enforced.", 'score': 47, 'issue_id': 3256, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '03822c3b59e6d608', 'authors': ['Nanxi Li', 'Yingzi Ma', 'Yulong Cao', 'Edward Suh', 'Bo Li', 'Dawn Song', 'Chaowei Xiao'], 'affiliations': ['Johns Hopkins University', 'NVIDIA', 'UC Berkeley', 'University of Illinois Urbana-Champaign', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.05903.jpg', 'data': {'categories': ['#optimization', '#training', '#alignment', '#benchmark', '#agents', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Эволюционная оптимизация персонализированных защит для языковых агентов', 'desc': 'EvoSafeHarness — это фреймворк оптимизации безопасности, который автоматически генерирует защитные механизмы для языковых моделей путём совместного поиска естественно-языковых политик и исполняемого кода логики. Система адаптируется к конкретной замороженной модели и целевой предметной области, учитывая поведение модели и спецификации домена. Подход значительно улучшает баланс между безопасностью и полезностью на различных бенчмарках агентов, снижая успешность атак при минимальном снижении полезности. Экспериментальные результаты показывают превосходство метода над статичными экспертными защитами и хорошую обобщаемость на невидимые домены.'}, 'en': {'title': 'Optimizing Safety Harnesses for Tailored Model Protection', 'desc': 'EvoSafeHarness is a framework designed to enhance the safety of machine learning models by optimizing safety harnesses that adapt to specific deployment contexts. It combines natural-language policies with executable logic to create tailored safety measures for different models and domains. This approach allows for a more effective balance between safety and utility, as it considers the unique behaviors of models and the specific requirements of their operating environments. By outperforming traditional expert-designed defenses, EvoSafeHarness demonstrates significant improvements in reducing attack success rates while maintaining high utility across various benchmarks.'}, 'zh': {'title': 'EvoSafeHarness：优化安全性与效用的平衡', 'desc': 'EvoSafeHarness 是一个优化可部署安全保护装置的框架，它通过联合搜索自然语言策略和可执行逻辑，针对冻结模型和目标领域进行优化，从而改善安全性与效用之间的权衡。该框架能够有效应对间接提示注入和直接有害请求带来的安全风险，提供比传统专家设计的防御更强的保护。EvoSafeHarness 在四个代理基准测试中表现出色，显著降低了攻击成功率，同时保持了较高的效用。通过分析，发现领域语义决定了所需的安全关系，而模型和运行时行为则决定了这些关系的执行方式和位置。'}}}, {'id': 'https://huggingface.co/papers/2609.11317', 'title': 'Mi-Ripple: Restoring Images Degraded by Iterative AI Editing', 'url': 'https://huggingface.co/papers/2609.11317', 'abstract': 'Abstract Mi-Ripple reduces digital ripple artifacts in edited images by separating lattice artifacts from texture and applying targeted spectral filtering and reference cleaning.  Generated by thinkingmachines/Inkling-Small Iterative reference-conditioned image editing can introduce grid-like and granular textures, commonly described as digital ripple. We present Mi-Ripple, a diagnosis-guided restoration workflow that suppresses this digital ripple while protecting image structure. Mi-Ripple separates periodic lattice artifacts from content-entangled granular texture, then combines selective spectral notching, structure-aware smoothing, and cleaned-reference regeneration. This separation enables low-distortion filtering when artifacts are spectrally isolated and visual reconstruction when filtering would erase legitimate detail. Across fourteen notch-only executions, whole-image residual standard deviation is 0.08--0.44 in CIELAB lightness units. In a paired regeneration example, reference cleaning reduces output debris density by 45\\%. Mi-Ripple links measurable artifact reduction to visibly cleaner generated images, rather than optimizing a spectral score alone.', 'score': 35, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '6ee4e3033dd997b5', 'authors': ['Jiayin Chen', 'Yicheng Xu', 'Muting Wang'], 'affiliations': ['Institute of Software, Chinese Academy of Sciences, Beijing, China', 'Key Laboratory of System Software (Chinese Academy of Sciences), Beijing, China', 'Miyang Technology (Shanghai) Co., Ltd., Shanghai, China', 'Shanghai Jiao Tong University, Shanghai, China', 'Tianjin University, Tianjin, China', 'University of Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.11317.jpg', 'data': {'categories': [], 'emoji': '✨', 'ru': {'title': 'Избавление от цифровой пульсации через диагностированное разделение артефактов и спектральную очистку', 'desc': 'В статье представлен Mi-Ripple — метод для удаления цифровых артефактов пульсации, возникающих при итеративном редактировании изображений. Подход разделяет периодические решеточные артефакты от текстурного содержимого, применяя селективную спектральную фильтрацию и очистку опорных изображений. Метод комбинирует спектральное подавление помех, структурно-ориентированное сглаживание и восстановление с очищенной ссылкой, сохраняя при этом важные детали изображения. Результаты показывают значительное снижение остаточного стандартного отклонения и видимое улучшение качества генерируемых изображений без чрезмерной потери информации.'}, 'en': {'title': "Clean Images, Clear Artifacts: Mi-Ripple's Smart Filtering", 'desc': 'Mi-Ripple is a method designed to reduce unwanted digital ripple artifacts in edited images, which often appear as grid-like or granular textures. It works by distinguishing between periodic lattice artifacts and the actual texture of the image, allowing for more effective filtering. The technique employs targeted spectral filtering and reference cleaning to minimize distortion while preserving important image details. By focusing on measurable artifact reduction, Mi-Ripple ensures that the final images are visually cleaner and more appealing.'}, 'zh': {'title': 'Mi-Ripple：清晰图像的数字波纹修复技术', 'desc': 'Mi-Ripple是一种用于减少编辑图像中数字波纹伪影的技术。它通过将周期性晶格伪影与内容纠缠的颗粒纹理分离，应用有针对性的频谱过滤和参考清理。该方法能够在保持图像结构的同时，有效抑制数字波纹。通过对伪影的频谱隔离，Mi-Ripple实现了低失真过滤和视觉重建。'}}}, {'id': 'https://huggingface.co/papers/2609.11412', 'title': 'X-AuT: Progressive Audio-Encoder Compression for Speech LLMs with Cross-Scale Distillation', 'url': 'https://huggingface.co/papers/2609.11412', 'abstract': 'Abstract X-AuT progressively prunes audio-encoder layers in speech large language models and restores accuracy via behavioral probes, representation alignment, cross-scale distillation, and LoRA adaptation.  Generated by thinkingmachines/Inkling-Small Reducing audio-encoder depth lowers the inference cost of speech large language models, but removing complete blocks perturbs the embeddings consumed by the decoder and can cause deletion and premature end-of-sequence errors. We introduce X-AuT, a progressive framework that selects layer combinations through short behavioral probes and restores the pruned model through representation alignment, cross-scale distillation, scheduled student-policy supervision, and LoRA finetuning. The language-model backbone remains frozen, while attention LoRA adapters and the tied output embedding adapt during distillation. Training uses the highest-agreement tier from a transcript-consistency pipeline, followed by source reweighting during finetuning. On ten public Chinese--English benchmarks, compressing Qwen3-ASR-0.6B from 18 to 16 audio-encoder layers reduces macro-average error from 5.61% to 5.27%. The 14-layer model reaches 5.75% with 20.7% fewer audio-tower parameters. Under the matched recipe, the 1.7B teacher yields 5.55% mean error, compared with 8.45% for self-distillation, and progressive 18rightarrow14 pruning outperforms direct pruning (5.75% vs. 6.73%). These single-run results establish two practical operating points and show that the accuracy effects vary across benchmarks. Project website: https://xpeng-ai.github.io/x-aut', 'score': 28, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '3cf8624638c7b093', 'authors': ['Haojun Zhang', 'Yi Zou', 'Min Chen', 'Qize Yu', 'Lianrui Fan', 'Xini Ding', 'Hao Li', 'Shuchang Zhou', 'Xianming Liu', 'Shiyu Huang'], 'affiliations': ['XPeng Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.11412.jpg', 'data': {'categories': ['#multilingual', '#training', '#small_models', '#inference', '#audio'], 'emoji': '🎵', 'ru': {'title': 'Эффективное сжатие речевых моделей через умную обрезку и дистилляцию', 'desc': 'В статье представлена методика X-AuT для прогрессивной обрезки слоёв аудио-энкодера в речевых языковых моделях с целью снижения вычислительных затрат при инференсе. Авторы предлагают восстанавливать точность обрезанной модели через поведенческие зонды для выбора комбинаций слоёв, выравнивание представлений, кросс-масштабную дистилляцию знаний и адаптацию через LoRA. Экспериментальные результаты на китайско-английских бенчмарках показывают, что сжатие модели с 18 до 14 слоёв аудио-энкодера уменьшает количество параметров на 20,7% при незначительном росте ошибок распознавания. Метод демонстрирует превосходство прогрессивной обрезки над прямой обрезкой и эффективность использования дистилляции от более крупного учителя.'}, 'en': {'title': 'Efficient Layer Pruning for Speech Models with X-AuT', 'desc': 'The paper introduces X-AuT, a method for progressively pruning audio-encoder layers in speech large language models to reduce inference costs while maintaining accuracy. It employs behavioral probes to select which layers to prune and uses techniques like representation alignment and cross-scale distillation to restore performance. The model adapts through LoRA finetuning, allowing the language model backbone to remain unchanged while optimizing the audio-encoder. Results show that reducing layers can significantly lower error rates on various benchmarks, demonstrating the effectiveness of this approach in model compression.'}, 'zh': {'title': '逐步修剪，提升语音模型效率', 'desc': 'X-AuT是一种逐步修剪音频编码器层的框架，旨在提高语音大语言模型的效率。通过行为探测、表示对齐、跨尺度蒸馏和LoRA适应等技术，X-AuT能够在降低推理成本的同时恢复模型的准确性。研究表明，将Qwen3-ASR-0.6B的音频编码器层从18层减少到16层，宏平均错误率从5.61%降低到5.27%。此外，逐步修剪的方法在准确性上优于直接修剪，显示出在不同基准测试中的效果差异。'}}}, {'id': 'https://huggingface.co/papers/2609.11561', 'title': 'Memory as Plans: World-Action Modeling with Memory-Grounded Planning', 'url': 'https://huggingface.co/papers/2609.11561', 'abstract': 'Abstract MaP-WAM improves non-Markovian robotic manipulation by separating memory-grounded planning from plan-conditioned execution, using compact episodic segment records and progress-calibrated action chunks to maintain fixed inference latency.  Generated by thinkingmachines/Inkling-Small Mainstream robotic policies often adopt a Markovian formulation, but many complex real-world manipulation tasks are inherently non-Markovian, requiring long-horizon memory beyond the current observation. Existing memory mechanisms often rely on language summaries, growing visual windows, or their combinations, and may therefore lose fine-grained visual evidence or face a trade-off between history coverage and execution efficiency. We introduce MaP-WAM, a Memory-as-Plans framework that decomposes memory-dependent world-action modeling into memory-grounded planning and plan-conditioned execution, and uses long-term multimodal episodic context as planning-time evidence rather than repeatedly conditioning the executor on the full history. MaP-WAM represents memory as completed segment records containing language instructions and sparse visual context, and converts this episodic memory into compact plans comprising the next segment-level language plan and corresponding visual guidance. A World-Action-Progress (WAP) model executes each plan over an unknown duration by jointly predicting action chunks and corresponding execution progress at inference time, calibrating predicted progress through plan-observation alignment for adaptive segment transitions and closed-loop context updates. MaP-WAM keeps the executor context length fixed, while structured attention further enables key-value caching in both planning and execution. MaP-WAM achieves state-of-the-art performance on RMBench with an 83.3% success rate and attains 78.0% success on real-robot tasks, while maintaining approximately constant executor inference latency as task history grows.', 'score': 23, 'issue_id': 3258, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '44c3b89fd2308b05', 'authors': ['Sizhe Zhao', 'Haozhe Xie', 'Weiyu Zhao', 'Chenchu Zhang', 'Huan Wang', 'Chenyang Wang', 'Qinglin Liu', 'Shengping Zhang'], 'affiliations': ['Alibaba Group', 'Harbin Institute of Technology', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2609.11561.jpg', 'data': {'categories': ['#multimodal', '#inference', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Память как планы: эффективное управление робототехникой с долгосрочным контекстом', 'desc': 'MaP-WAM — это фреймворк для обучения роботических манипуляторов выполнять сложные задачи, которые требуют долгосрочной памяти о прошлых действиях. Система разделяет процесс на два этапа: сначала компактный планировщик преобразует историю задачи в план следующего сегмента, затем исполнитель выполняет этот план, предсказывая действия и прогресс их выполнения. Память представляется в виде структурированных эпизодических записей с текстовыми инструкциями и визуальным контекстом, что позволяет избежать потери важной информации. Метод сохраняет постоянную задержку вывода при растущей длине истории задачи и достигает наилучших результатов на тестовых наборах данных и реальных роботах.'}, 'en': {'title': 'Revolutionizing Robotic Manipulation with Memory-as-Plans', 'desc': 'The paper presents MaP-WAM, a novel framework for robotic manipulation that addresses the challenges of non-Markovian tasks by separating planning from execution. It utilizes episodic memory to store compact segment records that include language instructions and visual context, allowing for efficient planning without overwhelming the executor with full historical data. The World-Action-Progress model enables the robot to predict action chunks and their execution progress, ensuring adaptive transitions and updates during task execution. This approach not only improves performance on benchmark tasks but also maintains consistent inference latency, making it suitable for complex real-world applications.'}, 'zh': {'title': 'MaP-WAM：提升非马尔可夫机器人操控的记忆规划框架', 'desc': 'MaP-WAM是一种改进非马尔可夫机器人操控的方法，它将基于记忆的规划与计划条件执行分开。该框架使用紧凑的情节段记录和进度校准的动作块，以保持固定的推理延迟。MaP-WAM通过将记忆表示为包含语言指令和稀疏视觉上下文的完成段记录，来优化记忆依赖的世界-动作建模。该方法在RMBench上实现了83.3%的成功率，并在真实机器人任务中达到了78.0%的成功率，同时在任务历史增长时保持了近乎恒定的推理延迟。'}}}, {'id': 'https://huggingface.co/papers/2609.11486', 'title': 'FreeFlow: A Bias-free Hierarchical Transformer for Optical Flow Estimation', 'url': 'https://huggingface.co/papers/2609.11486', 'abstract': 'Abstract FreeFlow is a hierarchical transformer for optical flow that eliminates task-specific inductive biases and achieves state-of-the-art accuracy using window, shifted-window, and global attention.  Generated by thinkingmachines/Inkling-Small Optical flow methods typically rely on task-specific inductive biases, such as correlation volumes, feature warping, and iterative refinement, among others, to reach high accuracy. While effective, such biases constrain the model to predefined heuristics, which can limit its expressivity and lead to more complex pipelines and additional computational cost. We present FreeFlow, a hierarchical transformer built without any flow-specific components, using instead a single feed-forward encoder--decoder. FreeFlow combines three attention variants: window attention for local processing, shifted-window attention for cross-window information exchange, and a global attention operating at a reduced resolution. The resulting architecture scales naturally with model capacity, enabling a consistent accuracy gain from small to large variants. Despite the absence of standard inductive biases, FreeFlow achieves state-of-the-art results on major benchmarks, including Sintel (0.68/1.48 EPE on Clean/Final), KITTI-2015 (3.23 Fl-all), and Spring (3.192 1px), while remaining memory efficient at 1080p inference.', 'score': 21, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9f4d6b87dfcbe36e', 'authors': ['Vladislav Bargatin', 'Alexander Yakovenko', 'Khaled Abud', 'Dmitriy Vatolin'], 'affiliations': ['AI Center, Lomonosov MSU, Moscow, Russia', 'Lomonosov Moscow State University, Moscow, Russia', 'MSU Institute for Artificial Intelligence, Moscow, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2609.11486.jpg', 'data': {'categories': ['#benchmark', '#cv', '#architecture'], 'emoji': '🌊', 'ru': {'title': 'Трансформер без предрассудков: оптический поток через чистую архитектуру внимания', 'desc': 'FreeFlow — это иерархический трансформер для оценки оптического потока, который отказывается от специфичных для задачи индуктивных смещений и использует вместо них комбинацию трёх видов attention механизмов: локального window attention, shifted-window attention для обмена информацией между окнами и глобального attention с пониженным разрешением. Архитектура построена как простой кодировщик-декодировщик без каких-либо компонентов, специфичных для оптического потока, что делает её более гибкой и выразительной. Несмотря на отсутствие традиционных индуктивных смещений, модель достигает лучших результатов на ключевых бенчмарках и остаётся эффективной по памяти. Масштабируемость архитектуры позволяет получать улучшение точности при увеличении ёмкости модели.'}, 'en': {'title': 'Revolutionizing Optical Flow with Bias-Free Transformers', 'desc': 'FreeFlow is a novel hierarchical transformer designed for optical flow estimation that avoids traditional task-specific biases. Instead of relying on predefined heuristics like correlation volumes or iterative refinement, it utilizes a single feed-forward encoder-decoder architecture. The model incorporates three types of attention mechanisms: window attention for local features, shifted-window attention for inter-window communication, and global attention for broader context at lower resolutions. This innovative approach allows FreeFlow to achieve state-of-the-art accuracy across various benchmarks while maintaining efficiency in memory usage during high-resolution inference.'}, 'zh': {'title': 'FreeFlow：无偏差的光流变换器', 'desc': 'FreeFlow是一种用于光流的层次化变换器，它消除了特定任务的归纳偏差，并通过窗口、移动窗口和全局注意力实现了最先进的准确性。传统的光流方法依赖于特定的归纳偏差，如相关体、特征扭曲和迭代细化，这些方法虽然有效，但限制了模型的表达能力。FreeFlow使用单一的前馈编码器-解码器结构，结合了三种注意力变体，能够在不同的模型规模下自然扩展，确保从小到大的模型都能获得一致的准确性提升。尽管没有标准的归纳偏差，FreeFlow在主要基准测试中仍然取得了最先进的结果，同时在1080p推理时保持了内存效率。'}}}, {'id': 'https://huggingface.co/papers/2609.10712', 'title': 'An Open Recipe for IMO Gold: Training Nemotron for Olympiad Mathematics', 'url': 'https://huggingface.co/papers/2609.10712', 'abstract': 'Abstract A natural-language proof-generation pipeline using post-trained Nemotron 3 Ultra checkpoints achieves gold-medal performance on IMO 2026 through iterative verification and refinement without external tools.  Generated by thinkingmachines/Inkling-Small We study how model post-training and test-time inference design affect natural-language proof generation for hard olympiad mathematics. Starting from Nemotron 3 Ultra, we train two specialist checkpoints using supervised fine-tuning and reinforcement learning, and evaluate checkpoint choice, verification, and refinement. Based on these findings, we present an open-model test-time-compute pipeline. The system operates entirely in natural language, with no formal prover, external tools, or internet access. Three Nemotron 3 Ultra checkpoints - the general-availability model and two post-trained specialists - power an iterative search that generates, verifies, and refines candidate proofs; a separate high-compute stage then selects each final submission. The system scored 30 out of 42 points at IMO 2026, reaching the gold-medal threshold. We release the two post-trained checkpoints as well as the training data, the training and inference code, the submitted solutions, and Nemotron-IMO-Bench, a new benchmark of 200 novel olympiad-level problems.', 'score': 20, 'issue_id': 3256, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '8d7c7736ab576468', 'authors': ['Ivan Moshkov', 'Stephen Ge', 'George Armstrong', 'Wei Du', 'Sadegh Mahdavi', 'Igor Gitman'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.10712.jpg', 'data': {'categories': ['#reasoning', '#science', '#training', '#math', '#inference', '#benchmark', '#dataset', '#open_source'], 'emoji': '🏅', 'ru': {'title': 'Языковые модели решают олимпиадные задачи через итеративное уточнение доказательств', 'desc': 'Авторы разработали конвейер для генерации математических доказательств на естественном языке, используя пост-обученные модели Nemotron 3 Ultra. Система применяет supervised fine-tuning и reinforcement learning для создания специализированных контрольных точек, которые работают в режиме итеративного поиска с генерацией, верификацией и уточнением кандидатов доказательств. Весь процесс происходит полностью на естественном языке без использования формальных верификаторов и внешних инструментов. Система достигла результата, соответствующего золотой медали на Международной математической олимпиаде 2026, набрав 30 из 42 баллов.'}, 'en': {'title': 'Revolutionizing Proof Generation with Natural Language Models', 'desc': "This paper presents a natural-language proof-generation system that utilizes post-trained Nemotron 3 Ultra models to achieve high performance in generating proofs for complex mathematics problems. The authors explore how post-training and the design of inference processes impact the effectiveness of proof generation, employing techniques like supervised fine-tuning and reinforcement learning. The system operates entirely in natural language, eliminating the need for formal provers or external tools, and employs an iterative process for generating, verifying, and refining proofs. The results demonstrate the system's capability, achieving a score that meets the gold-medal criteria at the IMO 2026 competition, and the authors provide access to their models and a new benchmark for future research."}, 'zh': {'title': '自然语言证明生成的金牌之路', 'desc': '这篇论文介绍了一种自然语言证明生成的流程，使用了经过后训练的Nemotron 3 Ultra模型，在IMO 2026比赛中取得了金牌表现。研究了模型后训练和测试时推理设计如何影响难度较大的奥林匹克数学的自然语言证明生成。通过监督微调和强化学习训练了两个专业检查点，并评估了检查点选择、验证和精炼的效果。系统完全在自然语言中运行，无需正式证明器、外部工具或互联网访问，最终在IMO 2026中获得了30分，达到了金牌门槛。'}}}, {'id': 'https://huggingface.co/papers/2609.11499', 'title': 'Recursive Code World Models: Building Complex Worlds through Recursive Scene Programs', 'url': 'https://huggingface.co/papers/2609.11499', 'abstract': 'Abstract RCWM recursively builds complex 3D worlds as executable code from a single image by alternating global and local reconstruction with shared camera alignment.  Generated by thinkingmachines/Inkling-Small Code world models represent worlds as executable programs, but this representation alone does not determine how to construct a complex world. We introduce Recursive Code World Models (RCWM), a framework for reconstructing complex 3D worlds in code from a single reference image. RCWM couples a Recursive Scene Program (RSP) representation with a construction solver that recursively calls itself. An RSP represents the executable world as compositional scene code, while each solver call follows the same complete process: establish the whole, recursively reconstruct unresolved parts, and revisit the whole to refine their composition. This global-local-global recursion gives fine-scale structures their own perception-and-editing loops while preserving scene-wide geometry and relationships. Reference-aligned views propagate a shared camera projection across levels, while parent revisitation addresses boundaries, spatial relations, and shared errors that emerge after local refinement. A vision-language coding agent directly compares reference images with scene renders to guide refinement, recursive descent, and return. Across complex scenes, RCWM outperforms prior code-based image-to-scene reconstruction methods. Ablation studies further support the benefits of recursive construction and suggest that deeper calls can improve finer-scale reconstruction. RCWM provides a recursive construction principle for building complex executable worlds from visual evidence.', 'score': 17, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'ae9c1b29ffc534c7', 'authors': ['Zhiqi Li', 'Yuxuan Liao', 'Bo Zhu'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.11499.jpg', 'data': {'categories': [], 'emoji': '🌍', 'ru': {'title': 'Рекурсивное построение 3D миров из одного изображения через исполняемый код', 'desc': 'Авторы предлагают Recursive Code World Models (RCWM) — фреймворк для реконструкции сложных 3D сцен в виде исполняемого кода по одному входному изображению. Система использует рекурсивное представление сцены (RSP), которое описывает мир как композиционный программный код, позволяя сохранять глобальную геометрию и пространственные отношения. Алгоритм работает по принципу глобально-локально-глобальной рекурсии: сначала устанавливается общая структура, затем рекурсивно восстанавливаются отдельные части, и наконец происходит уточнение всей сцены. Видео-языковой агент сравнивает эталонные изображения с рендерами сцены для направления процесса рефинирования, что позволяет RCWM превосходить предыдущие методы в задаче реконструкции сложных сцен.'}, 'en': {'title': 'Building 3D Worlds Recursively from a Single Image', 'desc': 'The paper introduces Recursive Code World Models (RCWM), a novel framework that constructs complex 3D worlds from a single image by using a recursive approach. It combines a Recursive Scene Program (RSP) representation with a construction solver that iteratively refines the world model. This method alternates between global and local reconstruction, allowing for detailed structures to be built while maintaining overall scene coherence. The results show that RCWM outperforms previous methods in image-to-scene reconstruction, demonstrating the effectiveness of recursive construction in generating executable 3D environments.'}, 'zh': {'title': '从单图像构建复杂3D世界的递归方法', 'desc': 'RCWM（递归代码世界模型）是一种从单张图像重建复杂3D世界的框架。它通过递归调用构建求解器，结合递归场景程序（RSP）表示可执行的世界。该方法在全局和局部重建之间交替进行，确保细节结构的感知和编辑，同时保持场景的几何关系。RCWM在复杂场景的重建中优于以往的代码基础图像到场景的重建方法，展示了递归构建的优势。'}}}, {'id': 'https://huggingface.co/papers/2609.11548', 'title': 'World in World: Explore the World with World Models', 'url': 'https://huggingface.co/papers/2609.11548', 'abstract': "Abstract A training-free interface enables flexible camera and time control in frozen autoregressive video world models by routing heterogeneous visual evidence through native self-attention with correspondence-guided queries and per-channel attention guidance.  Generated by thinkingmachines/Inkling-Small Autoregressive video world models enable interactive, long-horizon exploration, but flexible control remains challenging. Exploring a source video from new viewpoints requires the generated rollout to remain synchronised with the recorded event, place observed content in the requested view, plausibly complete newly exposed regions, and recover previously generated appearance on revisits. Existing methods typically address these requirements through task-specific modules or additional training. We present World in World, a training-free inference-time interface that converts heterogeneous control evidence into camera- and time-labelled clean visual states, which are read through the native self attention of a frozen causal video model. The evidence comprises source-video observations, target-view scene projections, geometry renderings that guide completion of newly exposed subject regions, and retrieved generated states beyond the rolling cache. Each evidence source carries token-level support and its own availability schedule. A correspondence router combines persistent point identities with geometry to establish token correspondences, guiding supported queries towards matching source-video tokens. Evidence-wise attention CFG (EWA) then independently regulates each auxiliary channel's additional contribution using attention responses from the same denoising forward pass. The shared interface supports camera-controlled rerendering, long-horizon revisiting, and human-motion transfer with the same frozen backbone. We evaluate World in World on camera-controlled video rerendering under diverse viewpoint changes, assessing perceptual quality, temporal consistency, and camera-following accuracy.", 'score': 17, 'issue_id': 3256, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'dbd3e0dc736350fa', 'authors': ['Chenxi Song', 'Yanming Yang', 'Chi Zhang'], 'affiliations': ['AGI Lab, Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2609.11548.jpg', 'data': {'categories': ['#inference', '#long_context', '#video', '#architecture'], 'emoji': '🎥', 'ru': {'title': 'Управление видео без переобучения через умную маршрутизацию внимания', 'desc': 'Статья описывает World in World — метод для гибкого управления камерой и временем в замороженных авторегрессивных видео-моделях мира без дополнительного обучения. Система маршрутизирует разнородные визуальные доказательства (исходное видео, целевая проекция, геометрия, закешированные состояния) через встроенный self-attention механизм с помощью соответствия точек и per-channel guidance. Ключевая инновация — correspondence router, который связывает персистентные идентичности точек с геометрией, направляя запросы к релевантным токенам исходного видео. Evidence-wise Attention CFG независимо регулирует вклад каждого вспомогательного канала, позволяя одному замороженному базовому моделю выполнять переренdering с изменением камеры, долгосрочное посещение и передачу движения.'}, 'en': {'title': 'Flexible Video Control Without Training', 'desc': 'This paper introduces a novel interface called World in World, which allows for flexible control of video generation without the need for additional training. It utilizes a frozen autoregressive video model that processes various types of visual evidence through self-attention mechanisms. The method effectively synchronizes generated video content with real-world events, enabling users to explore videos from different perspectives while maintaining visual coherence. By employing a correspondence router and evidence-wise attention, the approach enhances the quality and consistency of the generated video outputs during interactive exploration.'}, 'zh': {'title': '灵活控制视频生成的新方法', 'desc': '这篇论文介绍了一种名为"World in World"的训练无关接口，旨在实现灵活的相机和时间控制。该方法通过自注意力机制处理不同来源的视觉信息，使得生成的视频能够在不同视角下保持一致性。它利用几何渲染和对应路由来引导新曝光区域的补全，同时支持长时间的回访和人类动作的转移。通过这种方式，研究者们能够在不需要额外训练的情况下，实现高质量的视频重渲染。'}}}, {'id': 'https://huggingface.co/papers/2609.10016', 'title': 'MetroLLM-Bench: Evaluating Language Models as Transit Kiosk Runtimes', 'url': 'https://huggingface.co/papers/2609.10016', 'abstract': 'Abstract A benchmark for transit-kiosk policy reasoning shows that small parameter-efficiently fine-tuned language models can match larger models on structured tool-use and fare-quoting tasks.  Generated by thinkingmachines/Inkling-Small We introduce MetroLLM-Bench, a 955-case benchmark for testing language models as the policy layer of a transit kiosk. It covers six real metro systems, ranging from 37 to 414 stations, and eleven categories that include routing, fare calculation, disruptions, accessibility, and adversarial input. In each case, the model must call structured tools and submit a machine-renderable terminal state containing an outcome, a per-ticket fare quote when applicable, and a kiosk action. Fourteen deterministic scoring components form Tier 1; eight semantic-quality components form Tier 2, six of which use a language-model judge. We report Tier 1 and the combined score of both tiers. A stratified 75/25 split reserves 717 cases for training-data generation and 238 for held-out evaluation.   We evaluate twenty-six models from six vendors, of which twenty-three are ranked. On the held-out partition, a 4B Qwen 3.5 student trained through parameter-efficient fine-tuning (PEFT) exceeds both GPT-5.6 tiers on Tier 1 (91.3 against 90.6 and 90.0) and matches GPT-5.4 full at maximum reasoning effort (91.4), with a 2.6 GB Q4_K_M footprint. Larger 9B and 27B students provide no further Tier 1 improvement over the 4B student at this training scale. Across the four Qwen sizes, the PEFT gain over the corresponding base model decreases from +7.03 points at 2B (three training seeds) to -0.91 at 27B; every seed shows the same direction at every size. A deterministic rule-based baseline reaches 84.6 on Tier 1, with the remaining language-model advantage concentrated in policy adaptation, compound scenarios, accessibility, and temporal reasoning. Muse Glimmer 30B leads the composite ranking, and serving configuration alone moves the Qwen 3.5-to-3.8 comparison by 2.7 Tier 1 points. The benchmark, harness, reproduction guide, and fine-tuned students are released at https://github.com/continker/metrollm-bench.', 'score': 17, 'issue_id': 3257, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '24e966fe7f000aa7', 'pdf_title_img': 'assets/pdf/title_img/2609.10016.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#training', '#small_models', '#optimization', '#reasoning'], 'emoji': '🚇', 'ru': {'title': 'Малые модели с параметрически эффективной адаптацией конкурируют с большими на задачах управления транспортом', 'desc': 'В работе представлен MetroLLM-Bench — бенчмарк из 955 примеров для оценки языковых моделей в роли системы управления транспортными киосками. Исследование показывает, что небольшая 4-миллиардная модель Qwen, эффективно дообученная методом PEFT, может достичь производительности более крупных моделей при выполнении структурированных задач вызова инструментов и расчёта тарифов. Бенчмарк включает шесть реальных метросистем и охватывает маршрутизацию, вычисление стоимости, обработку сбоев и другие сценарии, оцениваемые детерминированными и семантическими метриками. Результаты демонстрируют, что параметрическая эффективность является ключевой для развёртывания LLM в практических приложениях, особенно когда требуется компактный размер модели.'}, 'en': {'title': 'Small Models, Big Impact: Efficient Transit Kiosk Reasoning', 'desc': 'This paper presents MetroLLM-Bench, a benchmark designed to evaluate the performance of language models in transit kiosk policy reasoning tasks. It demonstrates that smaller, parameter-efficient models can perform comparably to larger models in tasks such as fare quoting and routing. The evaluation involved 26 models, revealing that a 4B parameter model fine-tuned with parameter-efficient techniques outperformed larger models in specific structured tasks. The results indicate that while larger models do not necessarily provide better performance, fine-tuning can significantly enhance the capabilities of smaller models in practical applications.'}, 'zh': {'title': '小模型也能大作为！', 'desc': '本研究介绍了MetroLLM-Bench，这是一个包含955个案例的基准，用于测试语言模型在交通自助服务机中的政策推理能力。该基准涵盖六个真实地铁系统，涉及路线规划、票价计算、干扰、无障碍和对抗输入等多个类别。研究表明，通过参数高效微调的小型语言模型在结构化工具使用和票价报价任务上可以与大型模型相匹配。结果显示，4B的Qwen 3.5模型在Tier 1评分上超过了GPT-5.6的两个版本，展示了小模型在特定任务上的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.09143', 'title': 'Studying Image Tokenizers as Visual Languages in Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2609.09143', 'abstract': "Abstract Using a controlled autoregressive testbed, the study analyzes task-specific validation losses during multimodal pretraining to evaluate how image tokenizer design affects joint text-image modeling and downstream performance.  Generated by thinkingmachines/Inkling-Small Image tokenizers define the ``visual language'' of unified multimodal models, yet are commonly studied through isolated metrics or generation-/understanding-only evaluations. These evaluations do not fully capture how visual tokens behave when modeled jointly with text. We build a controlled pure-autoregressive testbed and track task-specific validation losses during multimodal continual pretraining across text, image, text-to-image (T2I), and image-to-text (I2T) prediction. We examine how these losses scale and relate to downstream performance, then use them to study multimodal learnability---how well image and text tokens are jointly modeled---and tokenizer design. We find that (1) losses should be analyzed by task, since they exhibit distinct scaling behavior and rank tokenizers differently. (2) The loss--performance relationship depends on the predicted token space: for a fixed tokenizer, T2I and I2T losses correlate with generation quality, but across tokenizers, the T2I loss--performance relationship shifts with the image-token space, whereas I2T loss, computed over a shared text vocabulary, provides a more consistent signal. I2T loss also correlates with both generation and visual understanding performance after supervised finetuning. Using losses as a lens, we show that (3) better reconstruction does not necessarily yield lower task-specific losses or stronger downstream performance, and that (4) image tokenizer choice can affect text modeling under joint optimization. As case studies, we revisit three tokenizer design axes---the discriminator, semantic supervision, and vocabulary size---to examine their effects on joint modeling and downstream performance. Together, our testbed offers a complementary perspective on image tokenizers as visual languages, highlighting their interplay with text in joint multimodal training.", 'score': 17, 'issue_id': 3261, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '3dcf17ad45bd566d', 'authors': ['Siting Li', 'Zhengyang Wang', 'Simon Shaolei Du', 'Xi Chen', 'Yang Liu'], 'affiliations': ['Amazon', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2609.09143.jpg', 'data': {'categories': ['#optimization', '#training', '#multimodal', '#architecture'], 'emoji': '🎨', 'ru': {'title': 'Визуальный язык моделей: как токенайзеры изображений влияют на совместное обучение текста и видео', 'desc': 'В работе исследуется, как архитектура визуального токенайзера влияет на совместное моделирование текста и изображений в мультимодальных моделях. Авторы создали контролируемый автарегрессивный стенд и отслеживали функции потерь для разных задач (текст, изображение, преобразование текста в изображение и наоборот) во время предварительного обучения. Ключевое открытие состоит в том, что потери нужно анализировать отдельно для каждой задачи, так как они по-разному ранжируют токенайзеры и имеют различное отношение к качеству вниз по потоку. Исследование показывает, что выбор визуального токенайзера влияет не только на обработку изображений, но и на моделирование текста при совместной оптимизации.'}, 'en': {'title': 'Unlocking Multimodal Performance: The Power of Image Tokenizer Design', 'desc': 'This paper investigates how the design of image tokenizers influences the performance of multimodal models that combine text and images. By using a controlled autoregressive testbed, the authors analyze task-specific validation losses during pretraining to understand the relationship between image and text modeling. They find that losses vary by task and that the choice of tokenizer can significantly impact downstream performance. The study emphasizes the importance of evaluating image tokenizers not just in isolation but in the context of their joint modeling with text.'}, 'zh': {'title': '图像标记器设计对多模态建模的影响', 'desc': '本研究使用受控的自回归测试平台，分析多模态预训练中的任务特定验证损失，以评估图像标记器设计如何影响文本-图像联合建模和下游性能。研究发现，损失应按任务分析，因为它们表现出不同的缩放行为，并且对标记器的排名不同。我们还发现，图像标记器的选择可以影响文本建模，尤其是在联合优化的情况下。通过案例研究，我们探讨了标记器设计的不同维度对联合建模和下游性能的影响。'}}}, {'id': 'https://huggingface.co/papers/2609.01515', 'title': 'TempCloze: Can Video-LLMs Identify the Missing Middle?', 'url': 'https://huggingface.co/papers/2609.01515', 'abstract': 'Abstract TempCloze evaluates visual temporal reasoning in Video-LLMs by requiring identification of missing video segments from distractors targeting semantics, alignment, and progression.  Generated by thinkingmachines/Inkling-Small Temporal reasoning benchmarks for Video-LLMs are often mediated by language, leaving room for linguistic shortcuts from option wording, answer correlations, or language priors. To reduce such shortcuts, we introduce TempCloze, a video cloze benchmark for evaluating visual temporal reasoning in Video-LLMs. Given the beginning and ending clips of a video, models must identify the true missing middle from four candidates. TempCloze contains 1,521 carefully filtered videos from seven sources, mainly long-take and egocentric videos. We construct same-source distractors along three dimensions: Semantic asks what event should happen, Alignment probes when it should occur, and Progression tests how it should unfold, while shared scenes and objects reduce appearance cues. Our evaluation of 10 proprietary and 21 open-source Video-LLMs reveals Alignment as the primary bottleneck: models often recognize plausible semantic content and local event progression but struggle with temporal alignment. We further conduct error pattern and behavioral sensitivity analyses on TempCloze-Mixed and TempCloze-Hard with four representative models to examine where errors arise and how candidate order, context direction, visible span, frame density, and test-time scaling influence model choices.', 'score': 17, 'issue_id': 3257, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '2eac500d2f680f46', 'authors': ['Wenqi Pei', 'Henry Hengyuan Zhao', 'Yilai Liu', 'Jiahao Meng', 'Han Chen', 'Ziyu Wang', 'Hongyang Du'], 'affiliations': ['National University of Singapore', 'Peking University', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.01515.jpg', 'data': {'categories': ['#video', '#dataset', '#benchmark', '#multimodal'], 'emoji': '⏱️', 'ru': {'title': 'Временное выравнивание — главная проблема видео-LLM в понимании последовательности событий', 'desc': 'TempCloze — это новый бенчмарк для оценки временного рассуждения в видео-LLM моделях, где модели должны определить пропущенный средний фрагмент видео из четырёх вариантов по начальному и конечному клипам. Набор данных содержит 1521 тщательно отобранные видео с отвлекающими вариантами, разработанными по трём измерениям: семантика (какое событие должно произойти), выравнивание (когда оно должно произойти) и прогрессия (как оно должно развиваться). Оценка 31 видео-LLM модели показала, что основным узким местом является временное выравнивание — модели часто распознают правдоподобное содержание, но затрудняются с точным позиционированием событий во времени. Авторы проводят детальный анализ ошибок и чувствительности модели к различным факторам, включая порядок вариантов, видимый диапазон кадров и плотность кадров.'}, 'en': {'title': 'TempCloze: Enhancing Visual Temporal Reasoning in Video-LLMs', 'desc': 'The paper introduces TempCloze, a benchmark designed to assess visual temporal reasoning in Video-LLMs (Video Language Models). It focuses on identifying missing segments in videos by providing the beginning and ending clips, requiring models to select the correct middle segment from distractors. The benchmark aims to minimize linguistic shortcuts by using distractors that challenge models on semantic content, temporal alignment, and event progression. Evaluation results indicate that while models perform well on semantic and progression tasks, they struggle significantly with temporal alignment, highlighting a key area for improvement in Video-LLMs.'}, 'zh': {'title': 'TempCloze：视频时间推理的新基准', 'desc': 'TempCloze 是一个用于评估视频大语言模型（Video-LLMs）视觉时间推理的新基准。它要求模型在给定视频的开头和结尾片段的情况下，从四个候选片段中识别出缺失的中间片段。该基准通过语义、对齐和进展三个维度构建干扰项，以减少语言上的捷径。我们的评估显示，对齐是主要瓶颈，模型在识别语义内容和事件进展方面表现良好，但在时间对齐上存在困难。'}}}, {'id': 'https://huggingface.co/papers/2608.27875', 'title': 'HyQuant: Hybrid-Precision Quantization for LLM Attention', 'url': 'https://huggingface.co/papers/2608.27875', 'abstract': 'Abstract HyQuant improves low-bit LLM attention quantization by preserving critical vertical-line tokens and local windows in high precision while quantizing the rest, maintaining accuracy with low overhead.  Generated by thinkingmachines/Inkling-Small Quantization has been widely adopted in LLM training and inference to reduce cost and improve efficiency. However, low-bit quantization of the attention module often introduces large errors at very low bit-widths, causing performance degradation. Existing methods mainly rely on smoothing techniques to handle outliers, while we propose a hybrid quantization design to better balance accuracy and efficiency. Specifically, we propose HyQuant, an efficient hybrid quantization framework for LLM attention. HyQuant quantizes most attention states into low-bit formats while retaining a small set of vertical-line tokens and local-window states in high precision. These accuracy-critical regions are selected using lightweight vertical-line-aware attention-pattern signals, reducing quantization error with limited overhead. In the Prefill stage, HyQuant uses a hybrid-precision quantized attention operator that preserves vertical-line tokens and a local sliding window in full precision while quantizing the remaining context. In the Decode stage, HyQuant applies the same principle to KV-cache compression and fuses KV dequantization with attention computation to improve memory and hardware efficiency. Across diverse tasks, models, and datasets, HyQuant maintains nearly lossless accuracy with an extremely simple design, demonstrating the efficiency and practical feasibility of hybrid quantization for LLM attention. Code is available at: https://github.com/jerrysfls/HyQuant .', 'score': 17, 'issue_id': 3256, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'e2f1b9b867bf9fd7', 'authors': ['Jiatong Ding', 'Bingxin Xing', 'Yu Zhang', 'Dian Ding', 'Xiaodong Yi', 'Xianbin Ouyang', 'Feihu Zhou', 'Kun Zhang', 'Zhenyu Guo', 'Hao Pan', 'Guangtao Xue', 'Yiming Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'Tencent Penglai Lab', 'Xiamen University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27875.jpg', 'data': {'categories': ['#inference', '#small_models', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Гибридная квантизация: сохранение точности при экономии ресурсов', 'desc': 'HyQuant предлагает гибридный подход к квантованию внимания в больших языковых моделях, сохраняя критически важные токены и локальные окна в высокой точности, а остальное состояние переводя в низкобитовый формат. Метод использует легковесные сигналы паттернов внимания для идентификации областей, чувствительных к точности, что позволяет минимизировать ошибки квантования с небольшими вычислительными затратами. На этапе предзаполнения и декодирования фреймворк применяет гибридную точность, сжимая KV-кэш и интегрируя деквантование с вычислением внимания для улучшения эффективности памяти. Экспериментальные результаты демонстрируют, что HyQuant достигает почти безубыточной точности при экстремально низкой битности с простым и практичным дизайном.'}, 'en': {'title': 'HyQuant: Smart Hybrid Quantization for Efficient LLM Attention', 'desc': 'HyQuant is a novel hybrid quantization framework designed to enhance the efficiency of low-bit quantization in large language model (LLM) attention mechanisms. It intelligently preserves critical vertical-line tokens and local windows in high precision while quantizing the majority of attention states into low-bit formats. This approach minimizes quantization errors that typically arise at very low bit-widths, thus maintaining model accuracy with minimal overhead. By employing lightweight attention-pattern signals, HyQuant effectively balances the trade-off between accuracy and efficiency across various tasks and datasets.'}, 'zh': {'title': 'HyQuant：高效的混合量化框架', 'desc': 'HyQuant是一种改进低比特大语言模型（LLM）注意力量化的方法，它通过保留关键的垂直线标记和局部窗口的高精度来实现，同时对其余部分进行量化，从而在低开销下保持准确性。传统的低比特量化方法在注意力模块中常常引入较大的误差，导致性能下降，而HyQuant采用混合量化设计，更好地平衡了准确性和效率。具体来说，HyQuant将大多数注意力状态量化为低比特格式，同时保留少量的垂直线标记和局部窗口状态为高精度，这样可以减少量化误差。通过在不同任务、模型和数据集上的测试，HyQuant展示了其几乎无损的准确性和混合量化的高效性和实用性。'}}}, {'id': 'https://huggingface.co/papers/2609.11699', 'title': 'Negative Self-Distillation: Learning to Reason by Avoiding Flaws', 'url': 'https://huggingface.co/papers/2609.11699', 'abstract': "Abstract Negative Self-Distillation improves large language model reasoning by pushing models away from self-generated flawed reasoning via a dynamic gating mechanism that protects linguistic capabilities.  Generated by thinkingmachines/Inkling-Small On-Policy Self-Distillation (OPSD) has emerged as a popular paradigm for large language model (LLM) self-improvement, allowing models to act as their own teachers by leveraging privileged information such as ground-truth solutions. However, recent findings indicate that OPSD can severely degrade the performance of LLMs on complex reasoning tasks: By forcing the student to imitate an artificially confident reasoning trace conditioned on privileged information, OPSD inadvertently suppresses expressions of uncertainty and penalizes the exploratory, self-corrective behaviors required to solve challenging problems. To address this, we introduce Negative Self-Distillation (NSD), a new framework that optimizes LLMs by diverging from flawed reasoning rather than imitating privileged solutions. Instead of relying on ground-truth answers or external supervision, NSD uses the model itself to generate a question-specific negative condition (eg, acting as a ``careless reasoner'') and pushes the student's distribution away from this self-generated negative teacher. Naively applying unlearning objectives to achieve this divergence is problematic, as flawed reasoning tokens are confounded with basic linguistic tokens; indiscriminately penalizing both risks catastrophically degrading the model's foundational language capabilities. We resolve this by designing a dynamic gating mechanism that automatically identifies and isolates reasoning-critical tokens, ensuring gradient updates target only behavioral flaws while preserving the model's linguistic priors. Empirically, NSD consistently outperforms OPSD and other label-free, self-bootstrapping reinforcement learning (RL) baselines.", 'score': 15, 'issue_id': 3258, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'a7b6e6931cac0dfc', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#reasoning', '#training', '#optimization'], 'emoji': '🚫', 'ru': {'title': 'От подражания ошибкам к отталкиванию от них', 'desc': 'В статье предлагается метод Negative Self-Distillation (NSD) для улучшения способности больших языковых моделей к рассуждению. Авторы показывают, что традиционный подход самодистилляции (OPSD) подавляет выражение неуверенности и исследовательское поведение, необходимое для решения сложных задач. NSD решает эту проблему, заставляя модель расходиться с собственными ошибочными рассуждениями, генерируя вспомогательного «невнимательного рассуждающего» вместо имитации правильных решений. Динамический механизм гейтирования автоматически выделяет критичные для рассуждения токены и изолирует их от обновлений градиента, что сохраняет базовые лингвистические способности модели.'}, 'en': {'title': 'Enhancing Reasoning by Diverging from Flaws', 'desc': "Negative Self-Distillation (NSD) is a novel approach that enhances the reasoning abilities of large language models (LLMs) by steering them away from incorrect self-generated reasoning. Unlike On-Policy Self-Distillation (OPSD), which can hinder performance by enforcing imitation of confident but flawed reasoning, NSD encourages models to learn from their mistakes. It employs a dynamic gating mechanism to differentiate between critical reasoning tokens and basic linguistic tokens, ensuring that only flawed reasoning is penalized without harming the model's language skills. This method has shown to outperform OPSD and other self-bootstrapping reinforcement learning techniques in complex reasoning tasks."}, 'zh': {'title': '负自我蒸馏：提升语言模型推理能力的新方法', 'desc': '负自我蒸馏（NSD）是一种新框架，通过使大型语言模型（LLM）远离自我生成的错误推理来优化模型。与传统的自我蒸馏方法不同，NSD不依赖于真实答案，而是利用模型自身生成特定问题的负面条件，推动学生模型的分布远离这些错误推理。为了解决错误推理与基本语言标记混淆的问题，NSD设计了动态门控机制，确保只针对行为缺陷进行梯度更新，同时保留模型的语言能力。实验结果表明，NSD在复杂推理任务上优于传统的自我蒸馏方法。'}}}, {'id': 'https://huggingface.co/papers/2609.11156', 'title': 'UniH^3: Unifying Hierarchical Homogeneity and Heterogeneity for All-in-One Medical Image Restoration', 'url': 'https://huggingface.co/papers/2609.11156', 'abstract': 'Abstract UniH3 unifies hierarchical homogeneity and heterogeneity for universal medical image restoration via memory-based homogeneity priors and a heterogeneity balancer.  Generated by thinkingmachines/Inkling-Small All-in-One medical image restoration (MedIR) aims to address diverse tasks across modalities and degradation types using a single universal model. Existing methods typically prioritize modeling inter-task heterogeneity (e.g., distinct data distributions and degradation types). However, they largely neglect the inherent homogeneity present in medical images, such as widely shared anatomical structures within and across modalities, which can be leveraged to ease model training and improve generalization. To this end, we propose UniH3, a novel framework that Unifies Hierarchical Homogeneity and Heterogeneity for all-in-one medical image restoration. Specifically, to comprehensively exploit homogeneity, we introduce a Hierarchical Homogeneity Memory (H2M) module that progressively distills intra- and inter-task homogeneity priors from high-quality images during training, and adaptively retrieves the most relevant priors tailored to the input for guided restoration. These retrieved priors are then injected into the restoration pipeline via an efficient Homogeneity-Guided Attention (HGA) mechanism. Furthermore, to comprehensively address heterogeneity, we design a Hierarchical Heterogeneity Balancer (H2B) that mitigates both inter- and intra-task conflicts during optimization, facilitating balanced and effective multi-task learning. Extensive experiments on two large-scale benchmarks, MedIR-2D-500K and MedIR-3D-3K, demonstrate that UniH3 achieves state-of-the-art performance on both all-in-one and single-task medical image restoration. We hope this work establishes a strong benchmark and advances the development of general-purpose medical image restoration models. Code is available at https://github.com/Yaziwel/UniH3.', 'score': 14, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '518c3b0771ab555f', 'authors': ['Zhiwen Yang', 'Jiayin Li', 'Chengyu Liu', 'Hui Zhang', 'Bingzheng Wei', 'Yan Xu'], 'affiliations': ['Department of Biomedical Engineering, Tsinghua University, Beijing 100084, China', 'School of Biological Science and Medical Engineering, Beihang University, Beijing 100191, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.11156.jpg', 'data': {'categories': ['#dataset', '#architecture', '#benchmark', '#training', '#healthcare'], 'emoji': '🏥', 'ru': {'title': 'Единая модель для восстановления медицинских изображений через баланс общих и уникальных признаков', 'desc': 'UniH3 представляет новый подход к универсальной реставрации медицинских изображений, объединяя концепции гомогенности и гетерогенности. Модель использует модуль Hierarchical Homogeneity Memory (H2M) для извлечения и адаптивного применения общих анатомических паттернов, присутствующих в медицинских изображениях разных модальностей. Для работы с различиями между задачами применяется Hierarchical Heterogeneity Balancer (H2B), который балансирует конфликты при многозадачном обучении. Метод достигает лучших результатов на двух крупномасштабных бенчмарках, демонстрируя эффективность единой модели для разнообразных задач восстановления медицинских изображений.'}, 'en': {'title': 'Unifying Homogeneity and Heterogeneity for Superior Medical Image Restoration', 'desc': "The paper introduces UniH3, a framework designed for universal medical image restoration that effectively combines hierarchical homogeneity and heterogeneity. It utilizes a Hierarchical Homogeneity Memory (H2M) module to extract and apply shared features from high-quality images, enhancing the model's ability to generalize across different tasks. Additionally, a Hierarchical Heterogeneity Balancer (H2B) is implemented to manage conflicts arising from diverse data distributions and degradation types during training. The results show that UniH3 outperforms existing methods on large-scale medical image datasets, setting a new standard for multi-task image restoration."}, 'zh': {'title': '统一医疗图像恢复中的同质性与异质性', 'desc': 'UniH3是一个新颖的框架，旨在通过记忆基础的同质性先验和异质性平衡器来统一医疗图像恢复中的层次同质性和异质性。该模型能够处理多种任务和退化类型，充分利用医疗图像中共享的解剖结构，以提高模型的训练效率和泛化能力。UniH3引入了层次同质性记忆模块（H2M），从高质量图像中提取同质性先验，并通过同质性引导注意力机制（HGA）将其注入恢复流程。同时，层次异质性平衡器（H2B）帮助解决优化过程中的任务冲突，促进多任务学习的平衡与有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.11808', 'title': 'Generative Late-Interaction Embeddings For Visual Document Retrieval', 'url': 'https://huggingface.co/papers/2609.11808', 'abstract': "Abstract Generative Late-Interaction Embeddings compress visual document retrieval vectors by learning a small basis set that regenerates full embeddings on demand, improving accuracy under tight storage limits without r
