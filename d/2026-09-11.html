etraining the encoder.  Generated by thinkingmachines/Inkling-Small Late-interaction retrieval is the state-of-the-art for visual document search, but it pays for its accuracy in storage. Existing compression methods retain a subset or local average of the N~1,000 vectors per page. Under aggressive storage budgets, however, these methods degrade sharply, and alternatives require retraining the encoder. Investigating this degradation across three encoders, we found two consistent properties: the vectors lie exactly on the unit sphere and concentrate near a manifold of intrinsic dimension five to six. This geometry yields two insights. First, standard k-means centroids fall inside the sphere, causing systematic underestimation of MaxSim scores. Normalizing them to the surface is a free correction worth up to +0.093 nDCG@5 over raw centroids. Second, because the page manifold has few degrees of freedom, the full set of vectors can be regenerated from only a few. To this end, we introduce Generative Late-Interaction Embeddings (GLIE): k << N vectors per page learned from the normalized centroids to serve as both a lightweight index and a basis for regenerating the page's full embedding set. At query time, search runs exclusively on these k vectors, and a decoder expands only the top candidates back to all N vectors for exact rescoring. At four vectors per page on ViDoRe v1, GLIE retains nearly 80% of the uncompressed system's nDCG@5, against 70% for the best prior post-hoc method. These results use a 415K-parameter network fitted in under three GPU-minutes on just a thousand training pages. At a matched training budget, fine-tuning the encoder does not reach even the training-free stage of GLIE, and the full system beats it at every budget. These patterns hold across a second encoder and ViDoRe v2. By reconstructing evidence on demand rather than sampling it, GLIE opens a new axis for storage-efficient retrieval, with the decoder as its main design surface.", 'score': 13, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '03fb333a36b81716', 'authors': ['Mohamed Eltahir', 'Talal Aloushan', 'Rose Khairoalsendi', 'Jana Shata', 'Mohammed Alhassan', 'Leen Alrehaili', 'Tanveer Hussain', 'Naeemullah Khan'], 'affiliations': ['Edge Hill University', 'King Abdullah University of Science and Technology (KAUST)'], 'pdf_title_img': 'assets/pdf/title_img/2609.11808.jpg', 'data': {'categories': ['#small_models', '#benchmark', '#cv', '#inference'], 'emoji': '📦', 'ru': {'title': 'Генеративное сжатие: восстановление полных представлений из минимального базиса', 'desc': 'В работе предложен метод сжатия векторных представлений для визуального поиска документов под названием Generative Late-Interaction Embeddings (GLIE). Авторы обнаружили геометрическое свойство векторов поиска: они лежат на единичной сфере и концентрируются вблизи многообразия размерности пять-шесть, что позволяет восстанавливать полные представления из небольшого набора базисных векторов. Метод GLIE использует небольшой набор k векторов на странице, которые служат как индексом для поиска, так и основой для восстановления полного набора из N векторов при необходимости переоценки результатов. При экстремальном ограничении памяти (четыре вектора на страницу) предложенный подход сохраняет 80% качества несжатой системы, превосходя существующие методы без переобучения энкодера.'}, 'en': {'title': 'Efficient Visual Retrieval with Generative Embeddings', 'desc': 'This paper introduces Generative Late-Interaction Embeddings (GLIE), a method that enhances visual document retrieval by compressing embedding vectors without needing to retrain the encoder. GLIE learns a small set of basis vectors that can regenerate full embeddings on demand, significantly improving accuracy while adhering to strict storage constraints. The authors discovered that the original vectors lie on a unit sphere and can be effectively represented with fewer dimensions, allowing for better performance with fewer vectors. By using a decoder to expand only the top candidates, GLIE achieves nearly 80% of the accuracy of uncompressed systems, demonstrating a novel approach to storage-efficient retrieval.'}, 'zh': {'title': '生成性晚期交互嵌入：高效存储的视觉检索新方法', 'desc': '本文提出了一种名为生成性晚期交互嵌入（GLIE）的方法，用于压缩视觉文档检索向量。GLIE通过学习少量基向量来再生完整的嵌入，从而在存储限制下提高检索准确性，而无需重新训练编码器。研究发现，向量分布在单位球面上，并集中在五到六维的流形上，这为向量的再生提供了几何上的依据。通过使用标准的k-means质心并进行归一化，GLIE能够有效地减少存储需求，同时保持高水平的检索性能。'}}}, {'id': 'https://huggingface.co/papers/2609.10445', 'title': 'Building Multilingual Bridges: Data Mixing as the Pillar of Generalization for In-Language Reasoning', 'url': 'https://huggingface.co/papers/2609.10445', 'abstract': "Abstract Optimized supervised fine-tuning data composition enables reasoning models to consistently process and respond in diverse non-English languages without requiring reasoning supervision in each target language.  Generated by thinkingmachines/Inkling-Small Reasoning language models have made substantial advances on a variety of complex tasks, yet their capabilities remain overwhelmingly English-centric: models primarily reason in English regardless of the language they are prompted in. This is inaccessible for non-English-speaking users, risks losing the intent of the original question, and forgoes knowledge more readily expressed in the target language. In this work, we advance L2 reasoning, the ability of a model to reason consistently in the language of the user's prompt, thus building an in-language bridge between the prompt and the answer. We approach this problem from a data-centric angle, investigating how to optimize data composition and scheduling in SFT for reasoning generalization. Building Tiny Aya L2-Thinker at 3.35B scale, we achieve an L2 reasoning rate above 93% across 60 languages on 6 benchmarks spanning math, commonsense reasoning, instruction following, open-ended generation, and cultural reasoning while keeping performance strong. We show the path to generalizing L2 reasoning to held-out languages goes through broader language coverage, readily available multilingual non-reasoning data, and a sufficient English reasoning backbone. These findings indicate that reasoning is a language-agnostic behavior that can be transferred across typologically diverse languages through careful data mixing and without requiring reasoning supervision in every target language. We release our model weights and multilingual reasoning data to support further research on accessible, in-language reasoning.", 'score': 13, 'issue_id': 3259, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'dd31dc867b70cfd6', 'authors': ['Mehrnaz Mofakhami', 'Ananya Sahu', 'Alejandro R. Salamanca', "Daniel D'souza", 'Alexandre Berard', 'Thomas Euyang', 'Marzieh Fadaee', 'Julia Kreutzer'], 'affiliations': ['Cohere', 'Cohere Labs'], 'pdf_title_img': 'assets/pdf/title_img/2609.10445.jpg', 'data': {'categories': ['#reasoning', '#transfer_learning', '#open_source', '#low_resource', '#training', '#benchmark', '#dataset', '#small_models', '#multilingual'], 'emoji': '🌍', 'ru': {'title': 'Универсальное рассуждение без границ языков через оптимизацию данных', 'desc': 'В работе исследуется проблема многоязычного рассуждения в языковых моделях, которые традиционно рассуждают на английском языке независимо от языка входного запроса. Авторы применяют подход, ориентированный на данные, оптимизируя композицию и расписание данных для supervised fine-tuning, чтобы улучшить способность моделей рассуждать на языке пользователя. Они создали модель Tiny Aya L2-Thinker размером 3.35B, достигнув уровня многоязычного рассуждения выше 93% на 60 языках по различным задачам. Исследование показывает, что способность к рассуждению является языково-агностичным навыком, который можно передавать между типологически различными языками через тщательное смешивание данных без требования обучения с supervision для каждого целевого языка.'}, 'en': {'title': 'Empowering Multilingual Reasoning with L2 Models', 'desc': "This paper presents a method for improving reasoning models to work effectively in multiple non-English languages without needing separate supervision for each language. The authors introduce the concept of L2 reasoning, which allows models to understand and respond in the language of the user's prompt. They focus on optimizing the composition and scheduling of supervised fine-tuning (SFT) data to enhance reasoning capabilities across 60 languages. Their results show that with the right data strategies, reasoning can be achieved in a language-agnostic manner, benefiting users who speak diverse languages."}, 'zh': {'title': '跨语言推理的桥梁', 'desc': '本研究提出了一种优化的监督微调数据组合方法，使得推理模型能够在多种非英语语言中一致地处理和响应，而无需在每种目标语言中进行推理监督。我们开发了Tiny Aya L2-Thinker模型，能够在60种语言上实现超过93%的L2推理率，涵盖数学、常识推理、指令跟随、开放式生成和文化推理等任务。研究表明，通过优化数据组合和调度，可以在不同语言之间实现推理的迁移，而不需要在每种语言中进行单独的推理监督。这些发现为非英语用户提供了更好的访问推理能力的途径，促进了多语言推理的研究。'}}}, {'id': 'https://huggingface.co/papers/2609.06931', 'title': 'CARDEA: Auditable Reasoning Grounded in Spatial Evidence for End-to-End Coronary Angiography Interpretation', 'url': 'https://huggingface.co/papers/2609.06931', 'abstract': 'Abstract A unified vision-language model for coronary angiography uses chain-of-box reasoning and reinforcement learning with verifiable rewards to provide auditable diagnoses and improve zero-shot report generation.  Generated by thinkingmachines/Inkling-Small Invasive coronary angiography (CAG) is the gold standard for diagnosing coronary artery disease, but interpretation varies substantially among observers. Existing AI systems can improve consistency but lack auditable decision processes and are limited in comprehensive open-ended assessment, undermining clinician trust and clinical adoption readiness. We developed CARDEA, a unified large vision-language model that serves as the inference core of a CAG pipeline. It was trained solely on public datasets and closed-ended tasks in three stages: visual feature alignment, a self-distilled Chain-of-Box (CoB) cold start, and reinforcement learning with verifiable rewards (RLVR) with a CoB reward encouraging bounding-box use in the reasoning trace. We assessed its two study-level diagnoses, dominance classification and complexity assessment, against a dedicated classifier and two interventional cardiologists. Report generation was excluded from training and evaluated zero-shot across stages on an external cohort using vessel-severity macro-F_1. CARDEA trailed the classifier on in-distribution dominance but drew level under domain shift (accuracy, 0.91 [95% confidence interval (CI), 0.86 to 0.95]) and was comparable to the cardiologists on complexity assessment (accuracy, 0.90 [CI, 0.82 to 0.97]). Only RLVR improved zero-shot report generation, raising its vessel-severity macro-F_1 (0.686 [CI, 0.664 to 0.707]) above the untuned base model (0.513) and over twice the always-normal floor (0.312). CARDEA runs an end-to-end CAG pipeline from raw multi-view videos through keyframe selection to study-level diagnosis while exposing auditable spatial evidence behind its conclusions. RLVR on verifiable closed-ended tasks surfaced open-ended reporting ability that supervised imitation did not. Clinical use requires prospective validation against expert cardiologists.', 'score': 13, 'issue_id': 3256, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'c75a31fdc96cf6ce', 'authors': ['Jia-Jen Lee', 'Shih-Yen Hou', 'Kee Koon Ng', 'Wei-Chun Wang', 'Shih-Sheng Chang'], 'affiliations': ['Artificial Intelligence and Robotics Innovation Center, China Medical University Hospital, Taichung, Taiwan', 'Department of Neurology, China Medical University Hospital, China Medical University, Taichung, Taiwan', 'Division of Cardiovascular Medicine, Department of Internal Medicine, China Medical University Hospital, Taichung, Taiwan', 'Neuroscience and Brain Disease Center, China Medical University, Taichung, Taiwan', 'School of Medicine, China Medical University, Taichung, Taiwan'], 'pdf_title_img': 'assets/pdf/title_img/2609.06931.jpg', 'data': {'categories': ['#reasoning', '#rl', '#cv', '#science', '#multimodal', '#rlhf', '#open_source', '#healthcare'], 'emoji': '🫀', 'ru': {'title': 'Прозрачный диагноз через верифицируемое обучение с подкреплением', 'desc': 'Авторы разработали CARDEA — единую vision-language модель для анализа коронарной ангиографии, которая обеспечивает прозрачные и проверяемые диагнозы. Модель обучалась в три этапа: выравнивание визуальных признаков, самодистилляция с использованием цепочки ограничивающих рамок (Chain-of-Box) и обучение с подкреплением с верифицируемыми вознаграждениями (RLVR). Система демонстрирует сопоставимую с кардиологами точность при классификации сложности и оценке доминантности коронарных артерий, а также показывает улучшенную генерацию клинических отчётов в режиме zero-shot. Ключевой вклад работы заключается в том, что обучение с подкреплением на проверяемых закрытых задачах улучшило способность модели к открытой генерации отчётов, превысив базовую модель более чем в два раза.'}, 'en': {'title': 'CARDEA: Trustworthy AI for Coronary Angiography Diagnosis', 'desc': 'The paper presents CARDEA, a unified vision-language model designed for interpreting coronary angiography (CAG) images. It employs chain-of-box reasoning and reinforcement learning with verifiable rewards to enhance the accuracy and transparency of diagnoses. CARDEA was trained on public datasets and is capable of generating reports without prior training on specific cases, demonstrating strong performance in zero-shot scenarios. The model aims to improve clinician trust by providing auditable decision-making processes and comprehensive assessments of coronary artery disease.'}, 'zh': {'title': 'CARDEA：提升冠状动脉造影诊断的智能模型', 'desc': '这篇论文介绍了一种统一的视觉-语言模型CARDEA，用于冠状动脉造影（CAG）的诊断。该模型采用链式框推理和可验证奖励的强化学习，旨在提高报告生成的准确性和可审计性。通过在公共数据集上训练，CARDEA能够在不同的任务中进行有效的推理，并在复杂性评估中与心脏病专家的表现相当。研究结果表明，CARDEA在零样本报告生成方面的表现优于未调优的基线模型，显示出其在临床应用中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.11085', 'title': 'Beyond Solver Verdicts: Generative Reward Models for Autoformalization', 'url': 'https://huggingface.co/papers/2609.11085', 'abstract': "Abstract Neurosymbolic reasoning is vulnerable to incorrect but verdict-matching formal translations, which are addressed by a generative verification method that scores reference equivalence without an oracle and improves downstream accuracy.  Generated by thinkingmachines/Inkling-Small Neurosymbolic systems rely on mathematical solvers to guarantee reasoning correctness, yet solvers are fundamentally blind to whether a formal translation maintains strict reference-equivalence to a designated formalization. We formalize this vulnerability as Verdict-Preserving-Unfaithfulness (VPU): a failure mode where an incorrect encoding executes successfully and matches the expected verdict. We theoretically prove that structural, verdict-only verification heuristics are mathematically bounded to chance-level detection on these deceptively valid traces. To resolve this, we introduce Generative Verification (GenV), which distills an offline Z3-equivalence oracle into a reference-free, continuous reference-equivalence score by repurposing the language model's native vocabulary space. Mechanistic analysis via decision-projected logit lenses and sparse autoencoders shows this generative readout natively extracts precise spatial error coordinates without explicit localization training. Empirically, our oracle-mined verifier (GenV+HN) achieves 0.961 AUROC in reference-equivalence verification, generalizes zero-shot across unseen translators and divergent formal styles, and yields an 11.3-point downstream accuracy gain in agentic test-time compute allocation.", 'score': 12, 'issue_id': 3259, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9dcc00dd69743f7c', 'authors': ['Vikash Singh', 'Debargha Ganguly', 'Aman Goel', 'Ali Torkamani', 'Xiaoxue Han', 'Joseph Lilien', 'Ferhat Erata', 'Vipin Chaudhary'], 'affiliations': ['Amazon Web Services', 'Case Western Reserve University'], 'pdf_title_img': 'assets/pdf/title_img/2609.11085.jpg', 'data': {'categories': ['#architecture', '#agents', '#training'], 'emoji': '🔍', 'ru': {'title': 'Верификация без оракула: обнаружение скрытых ошибок в нейросимволических системах через порождающие модели', 'desc': 'В статье рассматривается уязвимость нейросимволических систем, которые используют математические решатели для проверки корректности рассуждений. Авторы выявляют проблему Verdict-Preserving-Unfaithfulness (VPU), когда неправильное кодирование логической задачи дает правильный результат, обманывая проверку. Они предлагают метод Generative Verification (GenV), который использует языковую модель для оценки эквивалентности формальных представлений без обращения к оракулу-решателю. Подход показывает высокую точность верификации (0.961 AUROC) и повышает точность на 11.3 пункта при распределении вычислительных ресурсов во время тестирования.'}, 'en': {'title': 'Enhancing Neurosymbolic Reasoning with Generative Verification', 'desc': 'This paper addresses a problem in neurosymbolic reasoning where incorrect formal translations can still produce correct outputs, a situation termed Verdict-Preserving-Unfaithfulness (VPU). The authors propose a new method called Generative Verification (GenV) that evaluates the equivalence of translations without needing a reference oracle. By leveraging language models, GenV provides a continuous score for reference-equivalence, improving the accuracy of reasoning systems. The results show that this approach significantly enhances performance in verifying translations and boosts downstream task accuracy.'}, 'zh': {'title': '生成验证：提升神经符号推理的准确性', 'desc': '神经符号推理容易受到不正确但与判决匹配的形式翻译的影响。我们提出了一种生成验证方法，能够在没有预言机的情况下评分参考等价性，从而提高下游任务的准确性。我们将这种脆弱性形式化为判决保持不忠实性（VPU），并证明了结构性验证启发式在这些误导性有效轨迹上的检测能力是有限的。通过生成验证（GenV），我们能够提取精确的空间错误坐标，并在参考等价性验证中实现了显著的准确性提升。'}}}, {'id': 'https://huggingface.co/papers/2609.11155', 'title': 'DRG-MAPPO: Hierarchical Dynamic Role-Graph Multi-Agent Reinforcement Learning for Cooperative Air Combat', 'url': 'https://huggingface.co/papers/2609.11155', 'abstract': "Abstract A hierarchical multi-agent reinforcement learning framework combining graph attention and dynamic role assignment improves tactical coordination and win rates in air combat.  Generated by thinkingmachines/Inkling-Small Multi-Agent Reinforcement Learning (MARL) has emerged as a pivotal paradigm for complex decision-making in autonomous systems and air combat. While MARL has demonstrated significant potential in air combat, achieving sophisticated tactical coordination remains a non-trivial challenge. This difficulty is largely attributed to two primary limitations: (1) the absence of structured relational modeling hinders agents from capturing complex, time-varying interactions among battlefield entities; and (2) conventional flat architectures often lack the capability to explicitly model tactical roles, leading to ambiguous task allocation in highly dynamic environments. To address these challenges, we propose Hierarchical Dynamic Role-Graph Multi-Agent Proximal Policy Optimization (DRG-MAPPO), a novel MARL framework that integrates graph-based relational modeling with dynamic role assignment. Specifically, DRG-MAPPO constructs a graph-based representation of battlefield interactions and leverages graph attention mechanisms to extract critical relational features among allies, enemies, and threats. Subsequently, a high-level policy employs a dynamic role assignment mechanism to determine tactical responsibilities (e.g., ``leader'' and ``supporter''). Conditioned on these roles and encoded graph-relational features, a low-level policy executes discrete maneuver actions, facilitating the joint optimization of tactical strategy and collaborative execution. Furthermore, a target-priority auxiliary task is designed to foster the emergence of behaviors such as focus-fire. Experimental results demonstrate that DRG-MAPPO achieves a state-of-the-art win rate of 87%, suggesting that our framework effectively balances relational modeling, interpretability, and optimization stability for cooperative air combat.", 'score': 12, 'issue_id': 3257, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '99f1c8fb6ab7faf6', 'authors': ['Junlin Liu', 'Chengwei Li', 'Yang Gao', 'Hui Chang', 'Xinchen Zhang', 'Zhijun Zhao', 'Hao Zhao'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences', 'The Key Laboratory of Cognition and Decision Intelligence for Complex Systems, CASIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.11155.jpg', 'data': {'categories': ['#rl', '#architecture', '#agents'], 'emoji': '🛩️', 'ru': {'title': 'Иерархическая координация агентов через динамические роли и граф-внимание', 'desc': 'В статье предложен новый подход к многоагентному обучению с подкреплением для воздушного боя, названный DRG-MAPPO, который объединяет иерархическую архитектуру с динамическим назначением ролей и механизмом внимания на графах. Фреймворк решает проблему моделирования сложных взаимодействий между боевыми единицами на поле боя, используя граф-ориентированное представление отношений между союзниками, врагами и угрозами. Система работает на двух уровнях: высокоуровневая политика назначает тактические роли агентам (лидер, поддержка), а низкоуровневая политика выполняет конкретные манёвры, основываясь на этих ролях и закодированных признаках графа. Экспериментальные результаты показывают достижение 87% процента побед, что подтверждает эффективность предложенного подхода для тактической координации в кооперативных сценариях воздушного боя.'}, 'en': {'title': 'Enhancing Air Combat Coordination with Dynamic Role Assignment', 'desc': 'This paper presents a new framework called Hierarchical Dynamic Role-Graph Multi-Agent Proximal Policy Optimization (DRG-MAPPO) for improving coordination among agents in air combat scenarios. It addresses the challenges of complex interactions and role assignments by using graph attention mechanisms to model relationships between agents and battlefield entities. The framework dynamically assigns tactical roles, allowing agents to adapt their strategies based on their assigned responsibilities. Experimental results show that DRG-MAPPO significantly enhances win rates, demonstrating its effectiveness in cooperative decision-making in dynamic environments.'}, 'zh': {'title': '层次化多智能体强化学习提升空战胜率', 'desc': '本文提出了一种层次化的多智能体强化学习框架，结合了图注意力机制和动态角色分配，以提高空战中的战术协调和胜率。该框架名为动态角色图多智能体近端策略优化（DRG-MAPPO），通过图形化建模捕捉战场实体之间复杂的、随时间变化的互动。高层策略利用动态角色分配机制来确定战术责任，如“领导者”和“支持者”。实验结果表明，DRG-MAPPO在空战中实现了87%的胜率，展示了其在合作空战中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.10745', 'title': 'Think Before You Link: Rarity, Reasoning, and Retrieval in Multilingual Entity Linking', 'url': 'https://huggingface.co/papers/2609.10745', 'abstract': 'Abstract A reasoning-capable vision-language model that iteratively retrieves and reasons over Wikipedia improves multimodal entity linking for rare entities defined by knowledge-graph structure.  Generated by thinkingmachines/Inkling-Small Multimodal entity linking grounds entity mentions in text and images to knowledge-base entries. These systems degrade on rare entities, but prior work measures rarity primarily through popularity-based metrics such as pageviews. We broaden this view using knowledge-graph structural metrics that capture how well an entity is documented and connected. These metrics identify many rare entities that popularity metrics miss. Across the resulting rare-entity slices, state-of-the-art accuracy drops by 15.4-39.9%, showing that different rarity definitions expose different failure modes. To address these failures, we introduce a simple, training-free framework in which a reasoning-capable vision-language model iteratively searches and reasons over Wikipedia, gathering evidence dynamically. Controlled experiments show that reasoning and retrieval are complementary. Reasoning alone does not significantly improve accuracy on rare entities. Retrieval without reasoning improves rare-entity accuracy but can hurt overall accuracy. Their combination performs best. On MERLIN, a multilingual multimodal entity linking benchmark over five languages (Hindi, Indonesian, Japanese, Tamil, Vietnamese), our best system improves over the state of the art by 6.9% overall and by up to 23.3% on rare-entity slices. We release MERLIN-Rare, rare-entity test slices for targeted evaluation, with our framework.', 'score': 12, 'issue_id': 3260, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'aeba4bfe315d99a7', 'authors': ['Parinthapat Pengpun', 'Simran Khanuja', 'Graham Neubig'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2609.10745.jpg', 'data': {'categories': ['#rag', '#open_source', '#benchmark', '#multilingual', '#reasoning', '#graphs', '#dataset', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Рассуждение и поиск над графом знаний для связывания редких сущностей в мультимодальных данных', 'desc': "В статье представлена мультимодальная модель на основе vision-language архитектуры, которая решает задачу связывания сущностей из текста и изображений с записями в базе знаний. Исследователи предложили новый подход к определению редких сущностей, используя структурные метрики графа знаний вместо традиционных показателей популярности. Основной вклад заключается в разработке framework'а, где модель итеративно извлекает информацию из Wikipedia и применяет рассуждения для сбора доказательств, что показало, что комбинация retrieval'а и reasoning'а дополняет друг друга. Метод достигает улучшения на 6.9% в целом и на 23.3% для редких сущностей на многоязычном бенчмарке MERLIN, охватывающем пять языков."}, 'en': {'title': 'Enhancing Rare Entity Linking through Reasoning and Retrieval', 'desc': 'This paper presents a vision-language model that enhances multimodal entity linking, particularly for rare entities, by utilizing a reasoning process over Wikipedia. Traditional methods often rely on popularity metrics, which overlook many rare entities; this research introduces knowledge-graph structural metrics to better identify these entities. The authors demonstrate that combining reasoning and retrieval methods leads to improved accuracy, especially for rare entities, compared to using either method alone. Their approach achieves significant performance gains on a multilingual benchmark, showcasing the effectiveness of their framework in addressing the challenges of rare-entity linking.'}, 'zh': {'title': '推理与检索结合，提升稀有实体链接准确性', 'desc': '这篇论文介绍了一种具有推理能力的视觉-语言模型，该模型通过迭代检索和推理维基百科，改善了稀有实体的多模态实体链接。传统的实体链接系统在处理稀有实体时表现不佳，主要是因为它们依赖于基于流行度的指标，如页面浏览量。论文提出使用知识图谱结构指标来评估实体的文档化和连接程度，从而识别出许多流行度指标无法捕捉的稀有实体。通过结合推理和检索，这种新方法在多语言的多模态实体链接基准上显著提高了准确性，尤其是在稀有实体的处理上。'}}}, {'id': 'https://huggingface.co/papers/2608.15380', 'title': 'Adaptive Bridge: A Proxy-Based Decoupling Layer for Mitigating DDS Backpressure in ROS 2', 'url': 'https://huggingface.co/papers/2608.15380', 'abstract': "Abstract A proxy layer isolates critical ROS 2 subscribers from degraded ones via topic splitting and dynamic rate control to eliminate DDS backpressure.  Generated by thinkingmachines/Inkling-Small In systems built on Robot Operating System 2 (ROS 2) and using Data Distribution Service (DDS), a single network-impaired or throttled subscriber on a RELIABLE topic can cause backpressure that degrades throughput and latency for all other subscribers, including safety-critical ones sharing the publisher, because the publisher's DDS writer can no longer accept new samples. We present Adaptive Bridge, a proxy-based layer that decouples critical subscribers from degraded or noncritical ones, thereby isolating the critical path through topic splitting and dynamic rate control. The proxy acts as a middleman and subscribes to the original topic and republishes the messages to two independent DDS writers: one RELIABLE writer for critical nodes and one BEST EFFORT writer for noncritical or degraded nodes, thus isolating the degraded nodes and safeguarding the publisher and critical nodes from backpressure. A probe-based classifier actively monitors subscriber health through sampling with hysteresis and adjusts subscriber rate limits in real time. We evaluate the system under a Gilbert-Elliott bursty wireless loss model using a reproducible Docker-based harness. The results show that using the Adaptive Bridge in our evaluation harness reduces the critical subscriber tail p95 latency from up to 15 s to 1.55 ms across all impairment severities while preserving the publisher's configured throughput.", 'score': 12, 'issue_id': 3259, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': '3bc97fc6144c27ba', 'authors': ['Kaushalraj Puwar', 'B. Thangaraju'], 'affiliations': ['International Institute of Information Technology Bangalore'], 'pdf_title_img': 'assets/pdf/title_img/2608.15380.jpg', 'data': {'categories': ['#robotics'], 'emoji': '🌉', 'ru': {'title': 'Изолирование критических подписчиков от деградированных через адаптивный прокси-слой', 'desc': 'В статье представлен прокси-слой Adaptive Bridge для систем на базе ROS 2 и DDS, который решает проблему обратного давления, возникающего когда один деградированный подписчик блокирует критически важные каналы данных. Система использует разделение топиков и динамическое управление скоростью передачи, создав отдельные надёжные каналы для критических узлов и best-effort каналы для некритических подписчиков. Классификатор на основе проб активно мониторит здоровье подписчиков и в реальном времени подстраивает ограничения скорости, используя гистерезис для стабильности. Экспериментальная оценка на симуляции потерь данных в беспроводных сетях показала снижение задержки с 15 секунд до 1.55 миллисекунды для критических подписчиков.'}, 'en': {'title': 'Isolating Critical Subscribers to Enhance ROS 2 Performance', 'desc': "The paper introduces Adaptive Bridge, a proxy layer designed to protect critical subscribers in ROS 2 systems from performance degradation caused by impaired subscribers. By implementing topic splitting and dynamic rate control, it effectively isolates critical nodes from noncritical ones, preventing backpressure that can affect overall system performance. The proxy subscribes to the original topic and uses two separate DDS writers: a RELIABLE writer for critical nodes and a BEST EFFORT writer for degraded nodes. Evaluation results demonstrate significant improvements in latency for critical subscribers while maintaining the publisher's throughput, showcasing the effectiveness of this approach in managing network impairments."}, 'zh': {'title': '隔离关键订阅者，提升系统稳定性', 'desc': '本文提出了一种名为Adaptive Bridge的代理层，旨在通过主题分割和动态速率控制来隔离关键的ROS 2订阅者与受损的订阅者，从而消除DDS的背压问题。在ROS 2系统中，单个网络受损或限速的订阅者可能会导致所有其他订阅者的吞吐量和延迟下降，尤其是那些安全关键的订阅者。Adaptive Bridge通过将关键订阅者与非关键或受损的订阅者解耦，确保了关键路径的稳定性。实验结果表明，使用Adaptive Bridge后，关键订阅者的尾部延迟显著降低，同时保持了发布者的配置吞吐量。'}}}, {'id': 'https://huggingface.co/papers/2609.10539', 'title': 'IdeaAMBIG: Benchmarking Implementation-Critical Gaps in Research-Idea Specifications', 'url': 'https://huggingface.co/papers/2609.10539', 'abstract': 'Abstract The study introduces a benchmark to evaluate whether research methods are specified clearly enough for implementation, finding that identifying missing details is the primary challenge for language models.  Generated by thinkingmachines/Inkling-Small A research idea may be novel, coherent, and scientifically plausible, yet its proposed method may remain insufficiently specified for faithful implementation. We study the codification readiness of implementation-facing research-method specifications, defined by whether they provide sufficient methodological information for a competent implementer or coding agent to construct the intended method without unsupported assumptions. We construct evidence-grounded specifications and their supported resolutions from papers, codebases, issue threads, and reproduction artifacts. We introduce IdeaAMBIG, a benchmark of 660 evidence-grounded instances: 163 real-world gaps from reproducibility reports and GitHub issues, and 497 controlled synthetic gaps injected into codification-ready references. IdeaAMBIG evaluates three capabilities: codification-readiness assessment, defect localization, and clarification action generation. Defect localization receives only the specification, whereas clarification additionally receives the annotated defect. Across 13 LLMs, the best model achieves 9.6% Macro Defect Recovery Rate on real-world instances but 80.6% Macro Clarification Action Success Rate when given the defect. In an oracle study, supplying the gold resolution raises the downstream codification-ready rate from 14% to 98%. Across all evaluated models, defect localization is the main bottleneck, with stronger clarification given the defect.', 'score': 11, 'issue_id': 3259, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '842b105998700974', 'authors': ['Yiling Ma', 'Yilun Zhao', 'Sihong Wu', 'Manasi Patwardhan', 'Arman Cohan'], 'affiliations': ['TCS Research', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.10539.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#synthetic', '#science', '#plp'], 'emoji': '🔍', 'ru': {'title': 'Поиск скрытых пробелов в описании методов: бенчмарк для оценки готовности кода', 'desc': 'Исследование представляет бенчмарк IdeaAMBIG для оценки качества описания методологии в научных работах с целью проверить, достаточно ли информации для их практической реализации. Авторы определяют готовность к кодификации как наличие достаточного методологического описания для компетентного разработчика или AI-агента реализовать метод без необоснованных предположений. Бенчмарк содержит 660 примеров с реальными пропусками из отчётов о воспроизводимости и синтетическими пробелами, и оценивает три способности моделей: распознавание недостатков, локализацию дефектов и генерацию уточняющих действий. Результаты показывают, что локализация дефектов является главным узким местом для LLM, однако когда дефект уже известен, модели достигают высокой точности в генерации правильных уточнений.'}, 'en': {'title': 'Bridging the Gap: Enhancing Research Method Clarity for Implementation', 'desc': 'This paper presents a benchmark called IdeaAMBIG to assess how well research methods are specified for implementation in machine learning. It highlights that many research ideas, while innovative, often lack the detailed methodology needed for accurate execution by coding agents. The study identifies that the main challenge for language models is to pinpoint missing details in these specifications. Through extensive evaluation, it shows that while defect localization is difficult, providing additional context significantly improves the ability to clarify and implement the methods correctly.'}, 'zh': {'title': '提升研究方法实施的清晰度', 'desc': '本研究提出了一个基准，用于评估研究方法是否足够清晰，以便于实施。研究发现，识别缺失细节是语言模型面临的主要挑战。我们构建了IdeaAMBIG基准，包含660个基于证据的实例，评估模型在方法规范的准备性、缺陷定位和澄清行动生成方面的能力。结果显示，缺陷定位是主要瓶颈，而在提供缺陷信息的情况下，澄清行动的成功率显著提高。'}}}, {'id': 'https://huggingface.co/papers/2609.09076', 'title': 'ActReview: Rebuttal-Guided Training Data and Rubric Rewards for Actionable Peer Review Generation', 'url': 'https://huggingface.co/papers/2609.09076', 'abstract': 'Abstract ActReview is a rebuttal-guided post-training framework that generates diagnostic claims and concrete revision suggestions for peer review by leveraging author responses as latent supervision.  Generated by thinkingmachines/Inkling-Small As LLMs are increasingly used for pre-submission self-review, there is growing demand for feedback that not only identifies weaknesses but also guides authors toward concrete revisions. We study this as Actionable Peer-review Generation and decompose it into two subtasks: diagnostic claim generation and revision suggestion generation. We introduce ActReview, a rebuttal-guided post-training framework that connects paper-specific diagnoses to concrete, grounded revision plans. Our central insight is that author rebuttals reveal plausible actions for addressing reviewer concerns and can therefore provide latent supervision for revision-oriented feedback. From real review-rebuttal threads on OpenReview, we construct ActReview-40K by aligning reviewer weaknesses with author responses and grounding the resulting feedback in localized paper evidence. We post-train Qwen3-8B-Base with multi-task supervised fine-tuning followed by GRPO using candidate-aware, weakness-specific rubric rewards. We also introduce ActReview-Bench, a human-curated benchmark of 1,000 instances for evaluating diagnostic quality and revision usefulness. Experiments show that ActReview outperforms prior specialized review-generation models on actionability and grounding while remaining competitive with strong prompt-based LLMs. Human evaluation confirms improved revision usefulness while revealing a remaining gap in technical accuracy, and additional analyses support generalization to held-out papers and robustness across independent judges.', 'score': 11, 'issue_id': 3259, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '7945ec8a5fee569c', 'authors': ['Yiling Ma', 'Yilun Zhao', 'Sihong Wu', 'Ziyu Chen', 'Manasi Patwardhan', 'Arman Cohan'], 'affiliations': ['TCS Research', 'University of Chicago', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.09076.jpg', 'data': {'categories': ['#open_source', '#science', '#optimization'], 'emoji': '📝', 'ru': {'title': 'От критики к действию: автоматическая генерация практичных советов по доработке научных работ', 'desc': 'ActReview — это фреймворк дополнительного обучения больших языковых моделей, который генерирует диагностические заключения и конкретные предложения по доработке научных работ на основе ответов авторов на замечания рецензентов. Авторы используют ответы авторов как скрытый сигнал обучения, создав датасет ActReview-40K из реальных пар рецензия-ответ с OpenReview, где связывают замечания рецензентов с действиями, предложенными авторами. Модель обучается с помощью многозадачной тонкой подстройки и алгоритма GRPO с использованием рубрик на основе конкретных замечаний. Эксперименты показывают, что ActReview превосходит существующие модели генерации рецензий по практичности и обоснованности обратной связи, что подтверждается человеческой оценкой полезности предложенных доработок.'}, 'en': {'title': 'Transforming Peer Review with Actionable Insights', 'desc': "ActReview is a framework designed to enhance the peer review process by generating actionable feedback for authors. It focuses on two main tasks: creating diagnostic claims about a paper's weaknesses and suggesting specific revisions to address those issues. By utilizing author rebuttals as a source of guidance, ActReview connects identified problems with concrete solutions, making the feedback more relevant and useful. The framework has been tested against existing models and has shown improvements in providing actionable insights while maintaining a competitive edge in overall performance."}, 'zh': {'title': '同行评审的智能修订助手', 'desc': 'ActReview 是一个基于反驳指导的后训练框架，旨在为同行评审生成诊断性声明和具体的修订建议。该框架利用作者的回应作为潜在监督，帮助识别论文中的弱点并指导作者进行具体的修订。我们将这一过程分解为两个子任务：诊断声明生成和修订建议生成。实验结果表明，ActReview 在可操作性和基础性方面优于之前的专门评审生成模型，同时在修订的实用性上也得到了人类评估的认可。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (3)', '#agi', '#alignment (1)', '#architecture (7)', '#audio (1)', '#benchmark (10)', '#cv (4)', '#data', '#dataset (7)', '#diffusion', '#ethics', '#games', '#graphs (1)', '#hallucinations', '#healthcare (2)', '#inference (6)', '#interpretability', '#leakage', '#long_context (1)', '#low_resource (1)', '#machine_translation', '#math (1)', '#multilingual (3)', '#multimodal (7)', '#open_source (9)', '#optimization (7)', '#plp (1)', '#rag (1)', '#reasoning (7)', '#rl (3)', '#rlhf (1)', '#robotics (2)', '#science (4)', '#security (1)', '#small_models (5)', '#story_generation', '#survey', '#synthetic (2)', '#training (12)', '#transfer_learning (1)', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-12 15:22',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-12 15:22')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-12 15:22')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
