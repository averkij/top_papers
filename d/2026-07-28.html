 It incorporates prompts derived from award-winning films, ensuring that each prompt is linked to real-life references and follows established shot lists. The evaluation framework is comprehensive, featuring a three-level taxonomy that assesses various cinematic components, allowing for a more nuanced analysis of video quality. The results show that current models perform significantly lower on these rigorous standards compared to previous benchmarks, highlighting areas for improvement in dynamic aesthetics and multi-shot coherence.'}, 'zh': {'title': '引领视频生成的新标准：FilmBench', 'desc': '本论文介绍了FilmBench，这是一个基于专业电影语言的文本到视频（T2V）和参考到视频（R2V）基准测试。与传统的基准测试不同，FilmBench的提示是从获奖电影片段中反向工程而来，确保每个提示都有真实的参考。评估标准采用了三层次的电影分类法，涵盖多个维度和子指标，以更准确地评估视频生成的质量。通过对领先的视频生成模型进行基准测试，FilmBench的评估结果与人类评估者的排名高度一致，显示出其在动态美学和多镜头表现上的优势。'}}}, {'id': 'https://huggingface.co/papers/2607.23806', 'title': 'A Frozen 12B Beats Frontier Models on Verified Work: 100% Accuracy, 0 Tokens, Bit-Exact, Forever', 'url': 'https://huggingface.co/papers/2607.23806', 'abstract': 'Abstract  Improving a language model today means retraining it: enormous compute, a new opaque model each cycle, non-deterministic output. We take the opposite path: the model stays frozen, and a persistent memory of verified solutions grows beside it. Once a problem family is solved and has passed an independent verification step that never consults the answer key, every new instance of that family is answered at zero generation tokens, bit-exact, deterministically. Across 180 fresh instances spanning nine problem families, four architectures from four vendors - dense and mixture-of-experts - each score 180/180 at zero generation tokens per answer: execution-bound capability decoupled from parameter scaling. A negative control attributes the capability fully to the memory: emptied, it solves nothing. The same verify-before-store contract holds for open-ended reasoning: 88/88 consistency-gated acceptances across all four models, machine-checked formal proof, and reasoning-method transfer at 77/80. Memory selection takes 1.4 microseconds; a full reuse completes in 6-23 ms at 36 mWh. Approximate similarity retrieval selects the wrong item 94.3% of the time on a 4,500-item verified store where exact addressing makes zero errors. The store also serves as working context at a scale no shipped engine matches: a 6,000,000-token movable window on a single 46 GB GPU at flat memory, where vLLM stops at 30,399 tokens and SGLang silently truncates past 32,000. On published benchmarks, frontier models remain far ahead of any 12B at raw from-scratch reasoning; on everything this system has solved and verified, the comparison inverts: a frontier API call pays a fresh generation pass on every query, forever, while verified reuse costs zero tokens and returns the identical bits every time. A public testbench with free, rate-limited access accompanies this report: https://corbenic-galahad-bench.hf.space', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'd90bdd4ba5450bc5', 'authors': ['Sietse Schelpe'], 'affiliations': ['Corbenic AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.23806.jpg', 'data': {'categories': ['#optimization', '#open_source', '#long_context', '#inference', '#benchmark', '#training'], 'emoji': '💾', 'ru': {'title': 'Замороженная модель плюс верифицированная память вместо переобучения', 'desc': 'Работа предлагает альтернативный подход к улучшению языковых моделей без переобучения: вместо этого используется постоянная память проверенных решений, которая растет рядом с замороженной моделью. Когда семейство задач решено и прошло независимую верификацию, каждый новый экземпляр этого семейства решается без генерации новых токенов с битовой точностью и детерминированно. Система достигает 100% точности на 180 свежих экземплярах, работая с четырьмя архитектурами разных производителей, причем производительность зависит только от размера памяти, а не от масштаба параметров модели. Подход также поддерживает открытое рассуждение с проверкой консистентности и может обрабатывать контекст в 6 миллионов токенов на одном GPU, что превышает возможности существующих решений.'}, 'en': {'title': 'Memory-Driven Language Model Efficiency', 'desc': 'This paper presents a novel approach to improving language models by utilizing a persistent memory of verified solutions instead of retraining the model. The authors demonstrate that once a problem family is solved and verified, new instances can be answered deterministically and without generating additional tokens. They achieve perfect accuracy across multiple problem families and architectures, showing that the memory system is crucial for performance. The results indicate that this method allows for efficient reasoning and retrieval, significantly outperforming traditional models in specific tasks without the need for extensive computational resources.'}, 'zh': {'title': '记忆驱动的语言模型改进方法', 'desc': '这篇论文提出了一种改进语言模型的新方法，模型保持不变，而是通过不断增长的持久记忆来存储经过验证的解决方案。通过这种方式，解决特定问题家族的每个新实例都可以在零生成代币的情况下，确定性地得到答案。研究表明，在180个新实例中，四种不同架构的模型都能以零生成代币的方式获得完美的分数，显示出执行能力与参数规模的解耦。该方法还在开放式推理中表现出色，确保了高一致性和有效的记忆选择。'}}}, {'id': 'https://huggingface.co/papers/2607.23687', 'title': 'GNM Head: A Generative aNthropometric Model of the human head', 'url': 'https://huggingface.co/papers/2607.23687', 'abstract': 'Abstract  Parametric models of the human head are essential tools traditionally used in computer vision and graphics for animation, rendering, and reconstruction. More recently, they serve as crucial conditioning signals within generative large vision models, allowing for tight spatial control of generated imagery. However, existing publicly available models are typically limited in anatomical scope, modeling only outer geometry while ignoring intra-oral and ocular structures, and frequently suffer from reduced geometric quality stemming from low-fidelity input datasets. In this report we introduce a new parametric model dubbed Generative aNthropometric Model (GNM), named as a homophone of the human genome. GNM encompasses the head, face, neck, eyeballs, teeth, and tongue, and it is built on an extensive database of high-resolution 3D scans combined with high-quality anatomy specific artist-made samples. This report details the data provenance, the model architecture including the specialized sub-models for the ocular and intra-oral structures, and shows its SotA performance on fitting target 3D face scans. To foster community innovation, the complete GNM framework is made publicly available.', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '1f0f8a5181ff097f', 'authors': ['Stylianos Ploumpis', 'Jan Bednarik', 'Gaspard Zoss', 'Ruslan Guseinov', 'Luca Prasso', 'Prashanth Chandran', 'Oliver Boyne', 'Vasileios Choutas', 'Timo Bolkart', 'Daoye Wang', 'Menglei Chai', 'Di Qiu', 'Sebastian Winberg', 'Gilles Rainer', 'Lewis Bridgeman', 'Delio Vicini', 'Jérémy Riviere', 'Yannick Boetzel', 'Alexander Koumis', 'Jay Busch', 'Cynthia Herrera', 'Jacob Still', 'Scott Ysebert', 'Peter Lincoln', 'Sergio Orts Escolano', 'Christoph Rhemann', 'Erroll Wood', 'Thabo Beeler', 'Stefanos Zafeiriou'], 'affiliations': ['Google'], 'pdf_title_img': 'assets/pdf/title_img/2607.23687.jpg', 'data': {'categories': ['#3d', '#open_source', '#architecture', '#dataset', '#cv'], 'emoji': '😊', 'ru': {'title': 'Полная параметрическая модель головы с внутренней анатомией для синтеза и реконструкции', 'desc': 'В работе представлена новая параметрическая модель человеческой головы под названием GNM (Generative aNthropometric Model), которая охватывает не только внешнюю геометрию лица, но и внутриротовые структуры, глазные яблоки и язык. Модель построена на основе обширной базы данных высокого качества трёхмерных сканов и художественных анатомических образцов, что позволяет достичь высокого уровня геометрической точности. GNM использует специализированные подмодели для моделирования глаз и внутриротовых структур, показывая лучшие результаты при адаптации к целевым 3D сканам лиц. Авторы делают полный фреймворк публично доступным для развития сообщества и применения в компьютерном зрении, графике и генеративных моделях.'}, 'en': {'title': 'Revolutionizing Human Head Modeling with GNM', 'desc': 'This paper presents the Generative aNthropometric Model (GNM), a new parametric model of the human head that includes detailed anatomical features such as the face, neck, eyeballs, teeth, and tongue. Unlike existing models that only capture outer geometry, GNM is built on a comprehensive dataset of high-resolution 3D scans and artist-made samples, ensuring high geometric quality. The model architecture includes specialized sub-models for ocular and intra-oral structures, enhancing its accuracy in fitting 3D face scans. The authors aim to promote innovation in the field by making the complete GNM framework publicly available.'}, 'zh': {'title': '全面的人头参数化模型，推动视觉生成技术', 'desc': '本文介绍了一种新的参数化模型，称为生成性人类测量模型（GNM），用于人头的计算机视觉和图形学应用。GNM模型不仅包括头部、面部和颈部，还涵盖了眼球、牙齿和舌头，提供了更全面的解剖结构建模。该模型基于高分辨率3D扫描和高质量艺术样本构建，解决了现有模型在几何质量和解剖范围上的不足。为了促进社区创新，完整的GNM框架已公开发布。'}}}, {'id': 'https://huggingface.co/papers/2607.21936', 'title': 'Leveraging External Knowledge for Historical Document Restoration via Retrieval-Augmented Large Language Models', 'url': 'https://huggingface.co/papers/2607.21936', 'abstract': 'Abstract  Historical documents act as invaluable knowledge archives but often suffer from illegibility due to physical deterioration and damage. While existing restoration methods based on masked language modeling effectively utilize local context, they struggle to restore named entities that require external historical knowledge. To address this limitation, we introduce a novel framework for historical document restoration that leverages large language models with retrieval-augmented generation (RAG). By combining the implicit knowledge of pre-trained LLMs with explicitly retrieved external context, our model ARI effectively mitigates the challenge of inferring context-dependent proper nouns. Extensive experiments on Korean historical documents demonstrate that our approach significantly outperforms baselines, achieving substantial gains in restoring both general characters and named entities. Furthermore, comprehensive evaluations including expert assessments confirm that ARI serves as a practical tool for domain experts, promising to accelerate the analysis of historical records.', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '5ea44d51749a9827', 'authors': ['Gabeen Kim', 'Kyeongpil Kang'], 'affiliations': ['Kangwon National University'], 'pdf_title_img': 'assets/pdf/title_img/2607.21936.jpg', 'data': {'categories': [], 'emoji': '📜', 'ru': {'title': 'Восстановление истории: RAG для реставрации исторических текстов', 'desc': 'В статье предлагается новый подход к восстановлению исторических документов, который страдают от разборчивости. Авторы используют большие языковые модели с методом поиска дополнительного контекста (RAG) для эффективного восстановления поврежденного текста. Система ARI комбинирует встроенные знания предварительно обученных LLM с явно полученной внешней информацией из исторических источников. Экспериментальные результаты на корейских исторических документах показывают значительное улучшение восстановления как обычных символов, так и именованных сущностей.'}, 'en': {'title': 'Reviving History: Enhancing Document Restoration with AI', 'desc': 'This paper presents a new method for restoring historical documents that are often damaged and hard to read. The proposed framework, called ARI, combines large language models with retrieval-augmented generation (RAG) to improve the restoration of named entities that require specific historical knowledge. By integrating pre-trained language models with external information, ARI enhances the accuracy of restoring both general text and proper nouns. Experiments on Korean historical documents show that ARI outperforms existing methods, making it a valuable tool for historians and researchers.'}, 'zh': {'title': '历史文档修复的新突破', 'desc': '本论文提出了一种新的历史文档修复框架，利用大型语言模型和检索增强生成（RAG）技术。现有的修复方法在处理命名实体时存在局限性，而我们的模型通过结合预训练语言模型的隐性知识和外部检索的显性上下文，有效解决了这一问题。实验结果表明，该方法在修复韩国历史文档时，显著优于传统基线，尤其在恢复命名实体方面表现突出。综合评估显示，ARI模型为领域专家提供了实用工具，能够加速历史记录的分析。'}}}, {'id': 'https://huggingface.co/papers/2607.24651', 'title': 'Evidence Attribution in Visual Document Understanding without Coordinates or Region Labels', 'url': 'https://huggingface.co/papers/2607.24651', 'abstract': 'Abstract  Reliable visual document understanding requires a model to attribute each answer to the evidence regions that support it. Recent benchmarks and systems express this step through a coordinate interface: the model outputs the coordinates of bounding boxes that mark the evidence regions in the document. Under this interface, vision-language models often fail to identify the right regions even when the answer is correct, a failure known as Attribution Hallucination. We present a study that investigates whether this failure is partially limited by what the model can express through coordinates. On a verified bilingual CiteVQA subset, we compare the coordinate interface with a language interface in which the model outputs only text, quoting its evidence verbatim, and a multimodal retriever returns the location of each quote as a page region proposed by a layout parser (tables and figures are quoted through their captions or notes); the comparison is repeated over six open vision-language models. Compared with the coordinate interface, evidence recall rises from at most 8 points to between 26 and 47 and the hallucination rate roughly halves, with little change in answer quality. Building on this comparison, we use the same quote-and-retrieve pipeline as a training scaffold: because region-level evidence labels are expensive to collect for long documents, we introduce a GRPO recipe whose reward is a judge\'s reading of the gold answer and crops of the retrieved regions, training the model to quote better evidence without any region labels and raising an 8B backbone\'s strict attributed accuracy from 22.4 to 33.8. These findings indicate a practical path to improve attribution"without a coordinate interface and without costly region-level supervision.', 'score': 2, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'c776bc28c651a758', 'authors': ['Zhuchenyang Liu', 'Yao Zhang', 'Yu Xiao'], 'affiliations': ['Aalto University'], 'pdf_title_img': 'assets/pdf/title_img/2607.24651.jpg', 'data': {'categories': ['#hallucinations', '#alignment', '#multimodal', '#benchmark', '#training', '#rlhf', '#cv'], 'emoji': '📄', 'ru': {'title': 'От координат к цитатам: улучшение атрибуции в понимании документов через текстовые ссылки', 'desc': 'Исследование посвящено проблеме атрибуции ответов в моделях технического зрения и обработки языка при анализе документов. Авторы показывают, что использование текстового интерфейса, где модель цитирует доказательства прямым текстом вместо координат ограничивающих прямоугольников, значительно снижает галлюцинации и повышает качество атрибуции. Они предлагают метод GRPO, который использует извлечение цитат как этап обучения без дорогостоящих аннотаций регионов изображения. Результаты демонстрируют практический способ улучшить точность атрибуции моделей без необходимости в разметке координат и дорогостоящей разметке областей документов.'}, 'en': {'title': 'Enhancing Document Understanding: From Coordinates to Quotes', 'desc': 'This paper addresses the challenge of reliable visual document understanding by focusing on how models attribute answers to supporting evidence regions. It highlights a problem called Attribution Hallucination, where models provide correct answers but fail to identify the correct evidence regions using a coordinate interface. The authors compare this approach with a language interface that outputs text quotes of evidence, finding that the language method significantly improves evidence recall and reduces hallucination rates. They propose a new training method that enhances model performance without needing expensive region-level labels, demonstrating a practical way to improve attribution in document understanding tasks.'}, 'zh': {'title': '提升视觉文档理解的归因准确性', 'desc': '本研究探讨了视觉文档理解中的归因问题，特别是模型如何将答案与支持证据区域关联。我们发现，使用坐标接口时，模型常常无法正确识别证据区域，这种现象称为归因幻觉。通过比较坐标接口和语言接口，我们发现语言接口在证据召回率和幻觉率方面表现更好。基于这些发现，我们提出了一种新的训练方法，能够在没有区域标签的情况下提高模型的归因准确性。'}}}, {'id': 'https://huggingface.co/papers/2607.23242', 'title': 'IndicTalk: A Large-Scale Persona-Based Multilingual Conversational Corpus for Indic Languages', 'url': 'https://huggingface.co/papers/2607.23242', 'abstract': 'Abstract  Large Language Models (LLMs) have transformed conversational AI, yet high-quality multilingual code-mixed dialogue resources remain scarce, particularly for Indic languages where speakers naturally alternate between English and their native language in both native-script and Romanized forms. We present IndicTalk, one of the largest multilingual Indic code-mixed conversational corpora, comprising over 13,28,604 event-grounded multi-turn conversations across 18 language varieties covering 9 Indic languages. The corpus is generated through a fully automated pipeline that combines real-world news grounding, persona-conditioned dialogue generation using multilingual LLMs, and automatic quality validation. Extensive linguistic, automatic, and human evaluations demonstrate that IndicTalk produces fluent, coherent, and naturally code-mixed conversations across both script variants. We will release IndicTalk to support the development and evaluation of multilingual conversational AI for underrepresented Indic languages. The dataset is available at: https://huggingface.co/datasets/LingoIITGN/IndicTalk .', 'score': 2, 'issue_id': 2775, 'pub_date': '2026-07-25', 'pub_date_card': {'ru': '25 июля', 'en': 'July 25', 'zh': '7月25日'}, 'hash': '774005cba5256ce3', 'authors': ['Sahil Deepak Gawande', 'Mayank Singh'], 'affiliations': ['IIT Gandhinagar'], 'pdf_title_img': 'assets/pdf/title_img/2607.23242.jpg', 'data': {'categories': [], 'emoji': '🗣️', 'ru': {'title': 'Многоязычные диалоги на индийских языках: корпус для недопредставленных языков', 'desc': 'В статье представлена IndicTalk — один из крупнейших многоязычных корпусов диалогов на индийских языках, содержащий более 1,3 млн разговоров на 18 языковых вариантах. Датасет был создан с помощью автоматического конвейера, который сочетает привязку к реальным новостям, генерацию диалогов с использованием многоязычных большых языковых моделей и автоматическую валидацию качества. Корпус включает естественное переключение между английским языком и индийскими языками в разных вариантах письма, что отражает реальные языковые практики носителей. Авторы провели лингвистическую оценку и валидацию на людях, подтвердив текучесть и согласованность сгенерированных диалогов.'}, 'en': {'title': 'Empowering Multilingual AI with IndicTalk!', 'desc': 'This paper introduces IndicTalk, a large dataset designed for multilingual code-mixed conversations, particularly focusing on Indic languages. It consists of over 1.3 million multi-turn dialogues that reflect the natural language use of speakers who switch between English and their native languages. The dataset is created using an automated process that incorporates real-world news and utilizes multilingual large language models for dialogue generation. Evaluations show that IndicTalk provides fluent and coherent conversations, making it a valuable resource for advancing conversational AI in underrepresented languages.'}, 'zh': {'title': '支持多语言对话的IndicTalk语料库', 'desc': '大型语言模型（LLMs）已经改变了对话式人工智能，但高质量的多语言混合对话资源仍然稀缺，尤其是在印度语言中。我们提出了IndicTalk，这是一个最大的多语言印度混合对话语料库，包含超过1328604个基于事件的多轮对话，涵盖9种印度语言的18种语言变体。该语料库通过全自动流程生成，结合了现实新闻的基础、基于角色的对话生成和自动质量验证。广泛的语言学、自动化和人工评估表明，IndicTalk能够生成流畅、一致且自然的混合对话，支持多语言对话式人工智能的发展。'}}}, {'id': 'https://huggingface.co/papers/2607.22639', 'title': 'TRACE: Business Rule-Grounded Reasoning Curriculum for Knowledge-Preserving Parametric Tool Retrieval in Enterprise LLMs', 'url': 'https://huggingface.co/papers/2607.22639', 'abstract': 'Abstract  Parametric retrieval enables LLMs to retrieve tools implicitly by assigning each API a unique virtual token and training the model to generate it via constrained beam search. Toolsense shows that this regime has two critical drawbacks: it destroys parametric tool knowledge during training, and its beam-search decoding is too slow for real-time deployment. We introduce TRACE (Tool Retrieval via Augmented Chain-of-thought and Enterprise rules), a two-stage curriculum that resolves this dissociation. Stage 1 reuses the multi-format memorization SFT from ToolSense to seed tool knowledge with LoRA. Stage 2 is our core contribution: the model is trained to emit a thinking trace before producing a JSON list of tool tokens, using two data sources -- RRB pairs from ToolSense and queries synthesized to target business rules curated by domain experts -- both augmented with reasoning traces. This training objective preserves Stage 1 MCQ and QA probing accuracy while enabling single-beam greedy decoding at production latency. Evaluated on a combined enterprise catalog of 8,300+ tools across two enterprise product lines, TRACE training for Stage 2 not only preserves but improves tool understanding: MCQ accuracy gains +3.2 pp and QA probing gains +9 pp over Stage 1. On retrieval, TRACE achieves ~86% recall on Domain A and ~60% on Domain B -- compared to embedding baseline performance of ~27% & ~52% -- both with single-beam greedy decoding, making it directly deployable at production latency.', 'score': 2, 'issue_id': 2778, 'pub_date': '2026-06-22', 'pub_date_card': {'ru': '22 июня', 'en': 'June 22', 'zh': '6月22日'}, 'hash': '11a52ab9de8d7ac5', 'authors': ['Sai Shruthi Sistla', 'Ashutosh Hathidara', 'Christopher Toukmaji', 'Mayank Shrivastava', 'Karthikeyan Asokkumar'], 'affiliations': ['SAP Labs'], 'pdf_title_img': 'assets/pdf/title_img/2607.22639.jpg', 'data': {'categories': ['#reasoning', '#rag', '#training', '#open_source'], 'emoji': '🔧', 'ru': {'title': 'Быстрое и точное извлечение инструментов через рассуждение и бизнес-правила', 'desc': 'В работе предлагается TRACE — двухэтапный метод обучения для извлечения инструментов (API) из большых языковых моделей. На первом этапе используется LoRA для сохранения знаний об инструментах, полученных при обучении на размеченных данных. На втором этапе модель обучается генерировать цепочку рассуждений перед выводом списка токенов инструментов, используя как исторические данные, так и синтетические запросы, соответствующие бизнес-правилам. Метод достигает высокого качества извлечения (86% recall на одном наборе данных) при использовании быстрого жадного декодирования вместо медленного beam search, что позволяет применять его в промышленных системах с жесткими требованиями к задержке.'}, 'en': {'title': 'TRACE: Enhancing Tool Retrieval with Reasoning and Efficiency', 'desc': "This paper introduces TRACE, a new method for improving tool retrieval in large language models (LLMs). TRACE addresses the limitations of previous methods by using a two-stage training process that enhances the model's ability to understand and retrieve tools. The first stage builds on existing knowledge, while the second stage focuses on generating reasoning traces before producing tool tokens. The results show that TRACE significantly improves retrieval accuracy and efficiency, making it suitable for real-time applications."}, 'zh': {'title': 'TRACE：提升工具检索的智能新方法', 'desc': '本文介绍了一种名为TRACE的工具检索方法，旨在解决现有参数检索的缺陷。TRACE通过两个阶段的课程学习来增强模型的工具知识，第一阶段利用多格式记忆的SFT来初始化工具知识，第二阶段则训练模型在生成工具令牌之前发出思维轨迹。该方法在保持准确性的同时，显著提高了工具理解能力，并在实际应用中实现了快速解码。经过评估，TRACE在多个企业产品线的工具检索中表现优异，显著超越了传统的嵌入基线。'}}}, {'id': 'https://huggingface.co/papers/2607.23402', 'title': 'Characterizing Warp Divergence from Pascal to Blackwell', 'url': 'https://huggingface.co/papers/2607.23402', 'abstract': "Abstract  Since Volta introduced Independent Thread Scheduling (ITS), NVIDIA GPUs have been widely assumed to handle warp divergence in a fixed manner. We test this assumption across Ampere, Hopper, and datacenter and consumer Blackwell GPUs, using pre-ITS Pascal as a baseline. Combining cycle-accurate microbenchmarks, hardware counters, and static analysis of compiler-generated SASS, we separate stable behavior from architectural change. Across all tested generations, divergent paths serialize linearly with the number of paths k, following T(k) approx sk with no super-linear reconvergence penalty. Warp execution efficiency falls as 32/k, the penalty is independent of occupancy, and predication removes the serialization cost. The same behavior appears on Pascal, showing that this programmer-visible cost model predates ITS. The compiler-emitted reconvergence machinery, however, has changed substantially. Pascal uses a per-warp SSY/SYNC instruction stack, whereas later generations use barrier-register instructions. Deferred reconvergence beyond the immediate post-dominator falls from 29 cases on Ampere to 2 on Blackwell. Blackwell also introduces a two-tier convergence-barrier classification, uniform-branch instructions, and explicit partial-mask warp synchronization, none of which appear on Ampere or Hopper. Controlled bit-flip experiments indicate that the new barrier class is a static compiler classification with no observable runtime effect in our tests. Thus, divergence retains a stable and predictable performance cost even as NVIDIA's control-flow ISA and reconvergence mechanisms continue to evolve.", 'score': 1, 'issue_id': 2777, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '4fb8d2016f9e6bb5', 'authors': ['Alpin Dale'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.23402.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Стабильная цена расходимости потоков: от Pascal к Blackwell', 'desc': 'Исследование показывает, что расходимость потоков (warp divergence) на GPU NVIDIA имеет предсказуемую стоимость производительности, которая остаётся стабильной на протяжении нескольких поколений архитектур, включая Ampere, Hopper и Blackwell. Авторы обнаружили, что время выполнения расходящихся путей растёт линейно с количеством путей, без суперлинейного штрафа на повторную сходимость, и эффективность выполнения потоков падает пропорционально количеству путей. Механизмы повторной сходимости (reconvergence) в компиляторе значительно изменились: от стека инструкций SSY/SYNC на Pascal к инструкциям барьеров на новых поколениях, однако это не влияет на финальные затраты производительности. Результаты демонстрируют, что программисты могут полагаться на консистентную модель стоимости расходимости потоков при оптимизации кода для современных GPU.'}, 'en': {'title': 'Stable Performance Costs of Warp Divergence in Evolving NVIDIA Architectures', 'desc': 'This paper investigates how NVIDIA GPUs manage warp divergence across different architectures, specifically from Volta to Blackwell. The authors find that the performance cost of divergent paths remains stable and predictable, despite changes in the underlying hardware and compiler optimizations. They demonstrate that the serialization of divergent paths is linear with the number of paths, and that newer architectures have improved reconvergence mechanisms. Overall, the study reveals that while the hardware has evolved, the fundamental cost model for warp divergence has remained consistent.'}, 'zh': {'title': 'NVIDIA GPU的warp分歧性能稳定性研究', 'desc': '本文探讨了NVIDIA GPU在处理warp分歧时的性能表现，特别是在不同架构（如Ampere、Hopper和Blackwell）之间的比较。研究表明，尽管控制流指令集和重聚机制不断演变，warp执行效率的性能成本依然稳定且可预测。通过对不同代GPU的微基准测试和硬件计数器分析，发现分歧路径的序列化与路径数量成线性关系。最后，文章指出，尽管编译器生成的重聚机制发生了显著变化，但在Pascal架构中观察到的性能成本模型在后续架构中依然存在。'}}}, {'id': 'https://huggingface.co/papers/2607.23370', 'title': 'Bitcoin Price Direction Prediction via Regime-Aware Multi-Modal Fusion of Social Sentiment and Technical Features', 'url': 'https://huggingface.co/papers/2607.23370', 'abstract': 'Abstract  Bitcoin price prediction on sub-daily timescales is a hard open problem in computational finance. Bitcoin exhibits fat-tailed returns, non-stationary dynamics, and a price discovery process influenced by social discourse on Reddit and Twitter. Conventional approaches fuse OHLCV technical features with sentiment via static concatenation, applying identical fusion weights regardless of market state. This is inconsistent with the behavioural finance literature, which shows that retail sentiment is most predictive during volatile periods and noisy during calm ones. This paper proposes Regime-Aware Multi-Modal Learning (RAML), which conditions fusion of sentiment and price features on a dynamically detected binary market regime. Rolling 24-hour volatility partitions observations into stable and volatile regimes; a learnable sigmoid gate adjusts the weight of the sentiment embedding relative to the price embedding, trusting sentiment more during volatility and price dynamics more during stable phases. The system is evaluated on 3,491 hourly observations (July 2024-September 2025), combining Bitcoin OHLCV data with Reddit /r/Bitcoin FinBERT sentiment. Four models are compared - price-only BiLSTM, sentiment-only classifier, static-concatenation BiLSTM, and RAML - across 3-hour and 6-hour horizons, with an ablation study isolating the sentiment branch, regime detection, and adaptive fusion. RAML achieves macro-F1 of 0.5474 (3h) and 0.5513 (6h), with the highest AUC at 3 hours (0.5084), indicating better calibration. Ablation confirms every component is necessary, and replacing adaptive weighting with concatenation causes recall collapse at 6 hours (F1: 0.14). These results establish regime-conditioned adaptive fusion as a necessary design principle for multi-modal financial forecasting.', 'score': 1, 'issue_id': 2783, 'pub_date': '2026-07-25', 'pub_date_card': {'ru': '25 июля', 'en': 'July 25', 'zh': '7月25日'}, 'hash': '318956d29b6828f2', 'authors': ['Muhammad Abdullah Haroon'], 'affiliations': ['Department of Computer Science, FAST National University of Computer and Emerging Sciences (FAST-NUCES), Lahore, Pakistan'], 'pdf_title_img': 'assets/pdf/title_img/2607.23370.jpg', 'data': {'categories': ['#training', '#multimodal'], 'emoji': '📈', 'ru': {'title': 'Адаптивная мульти-модальная фузия для предсказания цены криптовалюты в зависимости от рыночного режима', 'desc': 'В работе предлагается новый подход к предсказанию цены Bitcoin на коротких временных масштабах, который решает проблему неэффективной интеграции технических признаков и анализа тональности текстов из социальных сетей. Авторы развивают метод Regime-Aware Multi-Modal Learning (RAML), который адаптивно взвешивает вклад сентимента и ценовых данных в зависимости от текущего рыночного режима, обнаруженного через волатильность за 24 часа. Система использует обучаемый гейт (sigmoid функцию) для динамической балансировки двух модальностей: во время волатильных периодов больше доверия сентименту, а во время стабильных фаз - ценовой динамике. На наборе данных из 3491 наблюдения модель RAML показывает лучшую производительность (F1-score 0.5474 для 3-часового горизонта), и абляционное исследование подтверждает необходимость каждого компонента системы.'}, 'en': {'title': 'Adaptive Fusion for Better Bitcoin Price Predictions', 'desc': 'This paper addresses the challenge of predicting Bitcoin prices on short time scales by introducing a new method called Regime-Aware Multi-Modal Learning (RAML). RAML dynamically adjusts the importance of sentiment data from social media based on the current market conditions, distinguishing between stable and volatile periods. By using a learnable sigmoid gate, the model enhances the predictive power of sentiment during market volatility while relying more on price data during stable times. The results show that RAML outperforms traditional methods, highlighting the importance of adapting to market regimes in financial forecasting.'}, 'zh': {'title': '状态感知自适应融合：比特币价格预测的新方法', 'desc': '本文探讨了比特币价格预测的挑战，特别是在短时间尺度上。研究提出了一种名为“状态感知多模态学习”（RAML）的方法，该方法根据市场状态动态调整情感和价格特征的融合。通过检测市场的稳定和波动状态，RAML能够在波动期更信任情感数据，而在稳定期则更依赖价格数据。实验结果表明，RAML在多模态金融预测中表现优越，验证了状态感知自适应融合的重要性。'}}}, {'id': 'https://huggingface.co/papers/2607.23373', 'title': 'UltraViT: Latency-Optimized On-device Vision Encoder for Large Vision-Language Models', 'url': 'https://huggingface.co/papers/2607.23373', 'abstract': 'Abstract  Large Vision-Language Models (LVLMs) remain bottlenecked by massive computational footprints, precluding their deployment on resource-constrained edge devices. While efforts to compress LVLMs focus heavily on vision token reduction or smaller language models, the vision encoder is largely overlooked, typically deployed as a monolithic, computationally heavy feature extractor. Moreover, there is no previous effort that designs a vision encoder for LVLMs directly optimized for on-device latency. In this paper, we present UltraViT, a vision encoder for LVLMs, explicitly designed and optimized for on-device performance. Specifically, by taking into account real on-device latencies, we systematically design a pyramidal architecture that strategically integrates and adapts heterogeneous spatial mixers at the macro-block level. Furthermore, to pre-train UltraViT, we propose a novel two-stage generative pre-training strategy: cultivating rich spatial features via dense distillation, followed by direct generative supervision from a capacity-mixed frozen LLM. Compared to standard contrastive and SSL, we show that our pre-training is much more effective for achieving high-level semantic grounding for UltraViT needed for the subsequent generative multimodal alignment of LVLM training. Extensive experiments demonstrate that our on-device latency-informed design combined with our tailored training strategy establishes a new state-of-the-art for efficient LVLM encoding, significantly outperforming existing encoder-centric baselines while operating on-device at nearly 1.7xthe speed.', 'score': 1, 'issue_id': 2780, 'pub_date': '2026-07-25', 'pub_date_card': {'ru': '25 июля', 'en': 'July 25', 'zh': '7月25日'}, 'hash': '6c73cd1d571c62dc', 'authors': ['Ioannis Maniadis Metaxas', 'Adrian Bulat', 'Alberto Baldrati', 'Anestis Zaganidis', 'Yassine Ouali', 'Hyeonuk Kim', 'Georgios Tzimiropoulos'], 'affiliations': ['Queen Mary University of London', 'Samsung AI Cambridge', 'Technical University of Iasi'], 'pdf_title_img': 'assets/pdf/title_img/2607.23373.jpg', 'data': {'categories': ['#inference', '#training', '#multimodal', '#small_models', '#cv', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Сверхбыстрый визуальный энкодер для мобильных мультимодальных моделей', 'desc': 'В работе представлен UltraViT — эффективный визуальный энкодер для больших мультимодальных моделей, оптимизированный специально для работы на устройствах с ограниченными ресурсами. Авторы разработали пирамидальную архитектуру с гетерогенными пространственными миксерами, учитывающую реальную задержку выполнения на устройстве. Предложена двухэтапная стратегия предварительного обучения: сначала培養 богатые пространственные признаки через плотную дистилляцию, затем прямой генеративный контроль от замороженной языковой модели. Экспериментально показано, что такой подход на 1,7 раза ускоряет работу энкодера при сохранении качества мультимодального выравнивания.'}, 'en': {'title': 'UltraViT: Optimizing Vision Encoders for Efficient LVLMs on Edge Devices', 'desc': 'This paper introduces UltraViT, a vision encoder specifically designed for Large Vision-Language Models (LVLMs) to enhance performance on resource-limited edge devices. Unlike traditional models that focus on reducing vision tokens or using smaller language models, UltraViT optimizes the vision encoder for on-device latency. The architecture employs a pyramidal design with heterogeneous spatial mixers to improve efficiency. Additionally, a novel two-stage generative pre-training strategy is proposed, which enhances semantic grounding and aligns multimodal training, resulting in a significant speed improvement over existing models.'}, 'zh': {'title': 'UltraViT：高效的视觉编码器优化设备性能', 'desc': '本文提出了一种名为UltraViT的视觉编码器，专为大型视觉语言模型（LVLMs）设计，旨在优化设备上的性能。我们通过考虑实际的设备延迟，系统性地设计了一种金字塔结构，巧妙地整合和适应异构空间混合器。为了预训练UltraViT，我们提出了一种新颖的两阶段生成预训练策略，首先通过密集蒸馏培养丰富的空间特征，然后通过容量混合的冻结语言模型进行直接生成监督。实验结果表明，我们的设计和训练策略在设备上实现了显著的性能提升，超越了现有的编码器基线。'}}}, {'id': 'https://huggingface.co/papers/2607.22682', 'title': 'A Vocabulary for Multi-Agent Automated Research Systems', 'url': 'https://huggingface.co/papers/2607.22682', 'abstract': 'Abstract  We introduce a vocabulary for automated research systems built from one or more agents to make their design choices easier to describe and compare. The vocabulary specifies 1) who the agents are, 2) what operations are available in the system, 3) who may invoke them, 4) how agents communicate, 5) what information is visible within and across runs, 6) how the next action is chosen, 7) how a run begins, and 8) how outputs are evaluated. A trajectory records one run from the input task to the returned artifact. Because agents, operations, and initialization may be stochastic, repeated runs on the same task induce a distribution over trajectories rather than a single behavior.   Our vocabulary turns structural design questions, such as when agents should communicate, gain or lose a capability, or carry information across runs, into testable choices. It also makes the evaluator a component of the system, since reported gains depend on how closely the proxy score matches true quality. That separation also splits the vague complaint that these systems lack taste into two failures with different solutions. Generative taste is the rate at which a system proposes novel trajectories before any score is observed, and evaluative taste is the gap between the proxy score and the quality it should match. We instantiate the vocabulary on recent autoresearch systems to illustrate that it covers designs that differ widely in structure.', 'score': 1, 'issue_id': 2779, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'a33c61816f4cb26c', 'authors': ['Bardiya Akhbari'], 'affiliations': ['Amazon AGI'], 'pdf_title_img': 'assets/pdf/title_img/2607.22682.jpg', 'data': {'categories': ['#science', '#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Единый язык для проектирования автоматизированных исследовательских систем', 'desc': 'Авторы предлагают формальный словарь для описания автоматизированных исследовательских систем, состоящих из одного или нескольких агентов. Словарь определяет восемь ключевых аспектов: агентов, доступные операции, права вызова, механизмы коммуникации, видимость информации, процесс выбора действий, инициализацию и оценку результатов. Такой подход превращает архитектурные вопросы о взаимодействии агентов в тестируемые проектные решения и выделяет оценку как важный компонент системы. Авторы вводят понятия генеративного вкуса (разнообразие предлагаемых траекторий) и оценочного вкуса (точность метрик) для анализа качества исследовательских систем.'}, 'en': {'title': 'Designing Smarter Agents: A Vocabulary for Automated Research Systems', 'desc': 'This paper presents a structured vocabulary for designing automated research systems that utilize one or more agents. It outlines key components such as agent roles, available operations, communication methods, and how actions are selected and evaluated. The authors emphasize the stochastic nature of these systems, where multiple runs can produce a distribution of outcomes rather than a single result. By framing design choices as testable questions, the vocabulary helps clarify issues related to system performance and quality assessment.'}, 'zh': {'title': '自动化研究系统设计的新词汇', 'desc': '本文介绍了一种用于自动化研究系统的词汇，旨在简化设计选择的描述和比较。该词汇定义了代理的角色、可用操作、调用者、代理间的通信方式、可见信息、行动选择、运行开始方式以及输出评估。由于代理和操作可能是随机的，因此在相同任务上的多次运行会产生轨迹的分布，而不是单一行为。通过将结构设计问题转化为可测试的选择，本文为自动化研究系统的设计提供了新的视角。'}}}, {'id': 'https://huggingface.co/papers/2607.23909', 'title': 'WorldDiT: A Unified Diffusion Architecture for World and Action Modeling', 'url': 'https://huggingface.co/papers/2607.23909', 'abstract': 'Abstract  Many recent robot policies pursue stronger control by using large pretrained vision-language models (VLMs) as the action backbone. We introduce WorldDiT, a unified diffusion transformer architecture that couples action generation with visual world modeling and achieves strong performance without a large pretrained VLM action backbone. During training, a single diffusion transformer generates continuous action chunks and predicts normalized RGB patch targets from future camera frames. Across four LIBERO simulation suites, WorldDiT lies on the reported Pareto frontier for total model parameters and mean success among methods reporting all four suites. These results provide a strong sub-billion-parameter baseline for future scaling studies.', 'score': 0, 'issue_id': 2779, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'cb6c4ce39abc860a', 'authors': ['Sen Wang', 'R. Gnana Praveen', 'Bidhan Roy', 'Marcos Villagra'], 'affiliations': ['Bagel Labs'], 'pdf_title_img': 'assets/pdf/title_img/2607.23909.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Диффузионный трансформер для управления роботом без больших видео-языковых моделей', 'desc': 'В статье представлена WorldDiT — унифицированная архитектура диффузионного трансформера для управления роботом, которая объединяет генерацию действий с визуальным моделированием окружающего мира. В отличие от недавних подходов, использующих большие предобученные видео-языковые модели, WorldDiT достигает сильных результатов без них, одновременно генерируя последовательности действий и предсказывая будущие кадры камеры. Модель была протестирована на четырех наборах данных LIBERO и показала оптимальный баланс между количеством параметров и качеством выполнения задач. Результаты исследования устанавливают прочный базовый уровень для систем управления роботами с менее чем миллиардом параметров.'}, 'en': {'title': 'WorldDiT: Efficient Robot Control Without Heavy VLMs', 'desc': 'This paper presents WorldDiT, a novel diffusion transformer architecture designed for robot control that integrates action generation with visual world modeling. Unlike many existing methods that rely on large pretrained vision-language models (VLMs), WorldDiT operates effectively without them, generating continuous action sequences and predicting visual targets from future camera frames. The model demonstrates competitive performance across multiple simulation environments, achieving a balance between model size and success rate. This work establishes a new baseline for future research in scaling robot control systems with fewer parameters.'}, 'zh': {'title': 'WorldDiT：无须大型预训练模型的强大机器人控制', 'desc': '本文介绍了一种名为WorldDiT的统一扩散变换器架构，它将动作生成与视觉世界建模结合在一起，能够在没有大型预训练视觉语言模型的情况下实现强大的性能。在训练过程中，单个扩散变换器生成连续的动作片段，并预测来自未来相机帧的标准化RGB补丁目标。在四个LIBERO仿真套件中，WorldDiT在总模型参数和平均成功率方面位于报告的Pareto前沿。这些结果为未来的扩展研究提供了一个强大的不足十亿参数的基准。'}}}, {'id': 'https://huggingface.co/papers/2607.23822', 'title': 'DriveDNA: A Large-Scale Multimodal Naturalistic Driving Dataset and Benchmark for Driving Style Identification', 'url': 'https://huggingface.co/papers/2607.23822', 'abstract': 'Abstract  Driving style captures stable, driver-specific patterns in how a vehicle is driven. In naturalistic data, however, this signal is hard to isolate because drivers are observed in different vehicles, on different roads, and under different conditions, so models may mistake vehicle- or situation-specific regularities for driver-specific style. We introduce DriveDNA, a large-scale naturalistic dataset and benchmark for personalized driving-style modeling, comprising 4,121 drives from 465 drivers across 115 vehicle models and totaling 975 hours of human-controlled driving at 10 Hz with forward video, collected from community drivers in everyday use. DriveDNA defines driving style as a consistent, driver-specific behavioral pattern in how a vehicle moves under similar conditions. The benchmark evaluates this signal through three core tasks: few-shot driver re-identification, personalized behavior prediction, and condition-matched comparison, and provides behavioral annotations plus 276,248 rule-generated maneuver events across six classes with large-scale human auditing. We evaluate baselines spanning classical descriptors, supervised and self-supervised time-series encoders, multimodal fusion, probabilistic prediction, and zero-shot foundation models under a fixed multi-seed protocol. Learned representations substantially outperform classical descriptors on unseen drivers (AUROC .935 vs. .707) and retain driver-specific information under matched driving conditions, while descriptor performance approaches chance. Video-only models achieve comparable re-identification accuracy but exhibit severe route leakage, showing that strong recognition may arise from contextual shortcuts rather than driving behavior. These findings show that reliable driving-style evaluation must assess both the behavioral value of learned representations and their robustness to vehicle, drive, and condition confounds.', 'score': 0, 'issue_id': 2774, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '61d42bb9ba4d9200', 'authors': ['Yuhang Wang', 'Lingyao Li', 'Hao Zhou'], 'affiliations': ['University of Arizona', 'University of South Florida'], 'pdf_title_img': 'assets/pdf/title_img/2607.23822.jpg', 'data': {'categories': ['#video', '#multimodal', '#benchmark', '#dataset'], 'emoji': '🚗', 'ru': {'title': 'DriveDNA: Раскрытие истинного стиля вождения через устойчивые к искажениям модели', 'desc': 'Работа представляет DriveDNA — большой датасет для моделирования персонализированного стиля вождения, содержащий 4121 поездку от 465 водителей на 115 типах автомобилей. Исследователи определяют стиль вождения как устойчивый, специфичный для водителя паттерн поведения, и предлагают три основные задачи для его оценки: переидентификацию водителя по малому числу примеров, предсказание поведения и сравнение в сопоставимых условиях. В работе протестированы различные подходы от классических дескрипторов до современных нейросетевых моделей, включая self-supervised кодировщики временных рядов и мультимодальное слияние. Результаты показывают, что глубокие модели значительно превосходят классические методы, но важно проверять их робастность к конфаундирующим факторам, так как видеомодели могут опираться на контекстные признаки вместо подлинного стиля вождения.'}, 'en': {'title': 'DriveDNA: Unraveling Personalized Driving Styles with Data', 'desc': 'This paper presents DriveDNA, a comprehensive dataset designed to analyze personalized driving styles by capturing consistent patterns in how individual drivers operate vehicles. It addresses the challenge of distinguishing driver-specific behaviors from variations caused by different vehicles and driving conditions. The dataset includes extensive driving data from numerous drivers and vehicles, enabling the evaluation of various machine learning models on tasks like driver re-identification and behavior prediction. The results indicate that advanced learned representations significantly outperform traditional methods, highlighting the importance of robust evaluation in driving style analysis.'}, 'zh': {'title': '个性化驾驶风格建模的新基准', 'desc': '本论文介绍了DriveDNA，这是一个大规模的自然驾驶数据集和个性化驾驶风格建模的基准。该数据集包含465名驾驶员在115种车型上进行的4,121次驾驶记录，总计975小时的驾驶数据。DriveDNA定义了驾驶风格为在相似条件下，驾驶员特有的行为模式，并通过几个核心任务来评估这一信号。研究表明，学习到的表示在未见驾驶员的表现上显著优于传统描述符，且在匹配的驾驶条件下保留了驾驶员特有的信息。'}}}, {'id': 'https://huggingface.co/papers/2607.21606', 'title': 'TILT: Improving Compositional Generation in Diffusion Models with a Model-Intrinsic Reward', 'url': 'https://huggingface.co/papers/2607.21606', 'abstract': 'Abstract  Recent advances in powerful text-to-image generation models have made it increasingly important to develop test-time methods that modify the sampling trajectory to produce images more faithful to complex compositional prompts. We present TILT, a training-free framework for compositional text-to-image generation via test-time reward alignment. We interpret compositional failures as overlap modes between joint and single-concept distributions, and define a reward that favors samples where all concepts are jointly present. This reward is intrinsic to the base model and does not require any external supervision or reward models. This yields a KL-constrained objective with a closed-form tilted target distribution and principled guiding steps for diffusion sampling. The interaction of concept distributions together with the above reward naturally leads to two different guidance strategies while a hybrid approach that balances their respective benefits produces stronger performance. Experiments on prompts from T2ICompBench show that our method improves compositional alignment while preserving image quality compared to previous baselines.', 'score': 0, 'issue_id': 2780, 'pub_date': '2026-05-16', 'pub_date_card': {'ru': '16 мая', 'en': 'May 16', 'zh': '5月16日'}, 'hash': '1ffe05e2f6a9442f', 'authors': ['Debottam Dutta', 'Jaehoon Hahm', 'Jianchong Chen', 'Romit Roy Choudhury'], 'affiliations': ['Electrical and Computer Engineering, University of Illinois Urbana-Champaign, Urbana, IL, USA', 'Physics, University of Illinois Urbana-Champaign, Urbana, IL, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.21606.jpg', 'data': {'categories': ['#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Направленная композиция: улучшение текстовых промптов без обучения моделей', 'desc': 'В работе предлагается TILT — метод для улучшения качества композиционной генерации изображений из текста во время вывода без обучения модели. Авторы интерпретируют ошибки композиции как перекрытие мод между распределениями отдельных концепций и совместным распределением, определяя награду, которая поощряет одновременное присутствие всех концепций. Метод использует внутренний reward модели, не требуя внешнего контроля, и формулирует задачу как KL-ограниченную оптимизацию с закрытым решением для направления диффузионной генерации. Гибридный подход, комбинирующий две стратегии guidance на основе взаимодействия распределений концепций, достигает лучшего баланса между композиционной верностью и качеством изображения.'}, 'en': {'title': 'Enhancing Text-to-Image Generation with TILT: Aligning Concepts for Better Images', 'desc': 'This paper introduces TILT, a novel framework designed to enhance text-to-image generation by improving how models interpret complex prompts. It focuses on aligning the sampling process with a reward system that encourages the presence of all concepts in the generated images. By analyzing the overlap between joint and single-concept distributions, TILT establishes a KL-constrained objective that guides the diffusion sampling effectively. The results demonstrate that TILT not only improves the alignment of generated images with the prompts but also maintains high image quality compared to existing methods.'}, 'zh': {'title': '提升组合生成的图像质量', 'desc': '本文介绍了一种名为TILT的框架，用于在测试阶段通过奖励对齐来生成符合复杂组合提示的图像。我们将组合失败视为联合和单一概念分布之间的重叠模式，并定义了一种奖励机制，鼓励所有概念共同出现的样本。该奖励机制是内在于基础模型的，无需外部监督或奖励模型。实验结果表明，我们的方法在保持图像质量的同时，改善了组合对齐效果。'}}}];

                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-28 22:08',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-28 22:08')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-28 22:08')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
