    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

c': 'Представляем Kimi K3 — мощную модель Mixture-of-Experts с 2.8 триллионами параметров и 104 миллиардами активных параметров, способную обрабатывать контекст из миллиона токенов и работать с изображениями. Модель использует новые архитектурные решения: Delta Attention и Attention Residuals для улучшения информационного потока, а также Stable LatentMoE для эффективной маршрутизации между экспертами, что обеспечивает 2.5-кратное улучшение масштабируемости. Обучение модели включает reinforcement learning по различным направлениям — общим задачам, агентским системам и кодированию с разными уровнями рассуждений. Kimi K3 демонстрирует передовые результаты в задачах долгосрочного кодирования, агентских действиях, рассуждениях и обработке изображений, уступая только самым мощным проприетарным моделям, и выпускается в открытом доступе.'}, 'en': {'title': 'Kimi K3: Pushing the Boundaries of Mixture-of-Experts Models', 'desc': 'Kimi K3 is a large Mixture-of-Experts model with 2.8 trillion parameters, designed to enhance performance in various tasks including vision and coding. It utilizes advanced techniques like Kimi Delta Attention and Stable LatentMoE to improve efficiency and information flow, achieving a significant boost in scaling efficiency compared to its predecessor, Kimi K2. The model supports a million-token context window and incorporates reinforcement learning to enhance its reasoning capabilities across different domains. Although it does not surpass the most powerful proprietary models, Kimi K3 demonstrates superior performance compared to other models and is made available for further research and development.'}, 'zh': {'title': 'Kimi K3：前沿智能的突破性进展', 'desc': 'Kimi K3 是一个拥有 2.8 万亿参数的混合专家模型，具有 1040 亿个激活参数和原生视觉能力。它采用了 Kimi Delta Attention 和 Attention Residuals 技术，提升了信息在序列长度和模型深度之间的流动。通过有效激活每个 token 的 16 个专家，Kimi K3 在整体扩展效率上比 Kimi K2 提高了约 2.5 倍。该模型在长时间编码、智能体、知识、推理和视觉任务上表现出色，尽管整体性能仍落后于一些最强大的专有模型。'}}}, {'id': 'https://huggingface.co/papers/2607.23588', 'title': 'JarvisHub: An Open Harness for Canvas-Native Multimodal Creative Agents', 'url': 'https://huggingface.co/papers/2607.23588', 'abstract': "Abstract  Creative AI is moving from single-step asset generation toward long-horizon multimodal production. Although recent generative models can synthesize high-quality images, videos, audio clips, UI elements, storyboards, slides, and other creative assets, real-world creative work requires more than isolated prompt-output interactions. It involves references, drafts, alternatives, edits, failed attempts, version relations, tool actions, evaluation signals, and human feedback, which together form an evolving project state. Existing prompt-based, chat-based, and node-based generation systems only partially support this state, as they often discard intermediate context, rely on linear conversations, or require manually specified workflows. Recent commercial systems indicate a shift toward agent-assisted creative production, but their closed architectures make it difficult to study how agents represent context, choose tools, revise artifacts, recover from failures, and maintain consistency over time. To address this gap, we introduce JarvisHub, a canvas-native creative agent harness for long-horizon multimodal creation. JarvisHub treats an editable canvas as the user workspace, the agent's external memory, action space, and shared project state, representing multimodal artifacts, dependencies, versions, and feedback as typed canvas nodes and links. Through a three-layer architecture of canvas state, protocol bridge, and agent runtime, JarvisHub enables agents to act within an inspectable and editable creative state. This design moves creative agents beyond isolated tool use toward sustained, human-steerable creative automation, where agents can progressively plan, generate, revise, and organize multimodal projects while users remain able to inspect, guide, and intervene throughout the process.", 'score': 102, 'issue_id': 2775, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'bdf5358053461935', 'authors': ['Yunlong Lin', 'Zixu Lin', 'Zhaohu Xing', 'Biqiang Li', 'Chenxin Li', 'Haonan Wang', 'Haitao Wu', 'Hengyu Liu', 'Jianghai Chen', 'Kaituo Feng', 'Kaixin Li', 'Shawn Chen', 'Shijue Huang', 'Sixiang Chen', 'Tsung-Yi Ho', 'Wenxuan Huang', 'Xiangyan Liu', 'Xiaomeng Hu', 'Xuanhua He', 'Yan Sun', 'Yunqing Zhao', 'Zhiqin Yang', 'Zehan Wang', 'Zhengyang Tang', 'Tianyu Pang', 'Xiangyu Yue'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.23588.jpg', 'data': {'categories': ['#agents', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Интеллектуальный холст для управляемой творческой автоматизации', 'desc': 'Статья представляет JarvisHub — систему для долгосрочного мультимодального творческого производства, которая переходит от простого преобразования одного промпта в один результат к сложным многошаговым проектам. В отличие от существующих систем, основанных на диалогах и линейных рабочих процессах, JarvisHub использует холст как общее рабочее пространство, внешнюю память агента и представление полного состояния проекта с помощью типизированных узлов и связей. Архитектура состоит из трёх слоёв: состояния холста, протокольного моста и среды выполнения агента, что позволяет системе отслеживать и редактировать все промежуточные артефакты, версии, зависимости и обратную связь. Такой подход обеспечивает непрерывную творческую автоматизацию с возможностью пользователя контролировать, направлять и вмешиваться на любом этапе создания мультимодального проекта.'}, 'en': {'title': 'Empowering Creative Collaboration with JarvisHub', 'desc': 'This paper introduces JarvisHub, a creative AI platform designed for long-horizon multimodal production. Unlike traditional generative models that focus on single outputs, JarvisHub allows for an evolving project state that incorporates user feedback, drafts, and revisions. It utilizes a canvas as a workspace where agents can manage multimodal artifacts and their relationships, enabling a more interactive and flexible creative process. The architecture supports sustained collaboration between humans and AI, allowing users to guide and intervene in the creative workflow effectively.'}, 'zh': {'title': 'JarvisHub：推动创意代理的多模态协作', 'desc': '这篇论文介绍了JarvisHub，一个用于长时间多模态创作的创意代理工具。它将可编辑的画布视为用户的工作空间和代理的外部记忆，支持多种创意资产的生成和管理。与现有的生成系统不同，JarvisHub允许用户在创作过程中进行检查、指导和干预，促进了人机协作。通过三层架构，JarvisHub使得创意代理能够在可检视和可编辑的创作状态中进行持续的创作自动化。'}}}, {'id': 'https://huggingface.co/papers/2607.24280', 'title': 'From Proprietary to Open-Source: Bridging the Distribution Gap via Multi-Agent Protocol Distillation in Agentic Search', 'url': 'https://huggingface.co/papers/2607.24280', 'abstract': 'Abstract  Agentic search enables large language models to solve knowledge-intensive tasks by interleaving multi-step reasoning with retrieval, yet optimizing this with outcome-based reinforcement learning (RL) provides only sparse supervision. Knowledge distillation can supply denser guidance, and advanced proprietary models with their strong reasoning capabilities are promising teachers. While distilling from proprietary models can densify this supervisory signal, conventional logit-matching is precluded by hidden logits and mismatched tokenizers, whereas raw natural language trajectory imitation transfers superficial stylistic artifacts rather than core reasoning competence. To address the heterogeneous distillation problem and bridge the distribution gap, we propose Multi-Agent Protocol Distillation (MAPD), a joint distillation and RL framework uses a structured, style-normalized protocol as an intermediate representation. An offline multi-agent system (MAS) decomposes each query, retrieves supporting evidence, repairs failed searches, and converts the resulting exploration trace into a JSON protocol containing the task type, reasoning plan, and extractive grounding facts. During training, the protocol is provided only to a privileged branch of the student policy, whose token distributions furnish a dense distillation signal alongside the sparse RL objective. Extensive evaluations across seven QA benchmarks demonstrate that MAPD consistently outperforms competitive distillation and RL, achieving average success rates of 39.4\\% on Qwen3-1.7B and 44.4\\% on Qwen3-4B. Crucially, the framework generalizes robustly across diverse proprietary teachers while effectively mitigating the student policy from style drift and verbosity degeneration.', 'score': 64, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '31bf3674090a2caf', 'authors': ['Junlin Liu', 'Jiangwang Chen', 'Zixin Song', 'Shuaiyu Zhou', 'Chunji Lv', 'Hank Wu', 'Kailin Jiang', 'Jinyang Wu', 'Bohan Yu', 'Chenxi Zhou'], 'affiliations': ['Beijing Institute of Technology', 'East China Normal University', 'Peking University', 'Tsinghua University', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24280.jpg', 'data': {'categories': ['#rag', '#optimization', '#rl', '#benchmark', '#training', '#reasoning', '#agents', '#transfer_learning'], 'emoji': '🔄', 'ru': {'title': 'Структурированная дистилляция знаний через промежуточные протоколы', 'desc': 'В работе предлагается метод Multi-Agent Protocol Distillation (MAPD) для обучения языковых моделей решать задачи, требующие поиска информации и многошагового рассуждения. Авторы используют промежуточное представление в виде структурированного JSON-протокола, который содержит тип задачи, план рассуждения и извлечённые факты, полученные от более мощных учительских моделей. Студент-модель обучается на основе как плотного сигнала дистилляции от протокола, так и разреженного сигнала reinforcement learning, что позволяет эффективно передать компетенцию рассуждения без копирования поверхностных стилистических особенностей. Экспериментальные результаты на семи бенчмарках показывают значительное улучшение в сравнении с традиционными методами дистилляции и RL, при этом обеспечивая хорошую обобщаемость между разными учительскими моделями.'}, 'en': {'title': 'Enhancing Language Models with Multi-Agent Protocol Distillation', 'desc': "This paper introduces Multi-Agent Protocol Distillation (MAPD), a new framework that enhances the training of large language models by combining reinforcement learning (RL) with knowledge distillation. MAPD addresses the challenges of sparse supervision in RL by using a structured protocol that captures reasoning plans and supporting evidence in a JSON format. The framework employs an offline multi-agent system to improve query handling and ensure that the student model learns from a rich, normalized representation of the teacher's reasoning capabilities. Evaluations show that MAPD significantly outperforms existing methods in various question-answering tasks, demonstrating its effectiveness in transferring knowledge from advanced models while avoiding common pitfalls like style drift."}, 'zh': {'title': '多智能体协议蒸馏：优化语言模型的新方法', 'desc': '本文提出了一种名为多智能体协议蒸馏（MAPD）的新方法，旨在通过结合强化学习和知识蒸馏来优化大型语言模型的知识密集型任务。该方法使用结构化的、风格标准化的协议作为中间表示，帮助模型更好地理解和处理查询。通过离线多智能体系统，MAPD能够分解查询、检索支持证据并修复失败的搜索，从而生成包含任务类型、推理计划和基础事实的JSON协议。实验结果表明，MAPD在多个问答基准测试中表现优异，成功率显著高于传统的蒸馏和强化学习方法。'}}}, {'id': 'https://huggingface.co/papers/2607.24731', 'title': 'Rethinking Classifier-Free Guidance in On-Policy Diffusion Distillation', 'url': 'https://huggingface.co/papers/2607.24731', 'abstract': "Abstract  On-policy distillation (OPD) adapts diffusion models by querying a teacher along trajectories generated by the current student, but how it should behave under classifier-free guidance (CFG), a default component of modern diffusion systems, remains poorly understood. Existing OPD methods naturally extend velocity matching to the CFG-composed prediction, directly matching teacher and student guided velocities. We show that this objective is under-identified at the branch level: positive- and negative-branch errors can compensate in the guided prediction. Through two contrasting cases, we find that naive matching remains effective under shared negative conditioning, where both branch errors decrease jointly. When the model's native CFG schema retains privileged information in the teacher's negative branch that is unavailable to the student, however, this joint reduction breaks down and the composed objective induces antagonistic branch-error dynamics, reducing the positive-branch error while increasing the negative-branch error. We term this failure mode Negative Branch Asymmetry (NBA). To address NBA, we introduce Positive--Direction Matching (PDM), a branch-aware OPD objective that separately constrains the positive prediction and the CFG conditional direction. We apply PDM to dense-to-sparse video control, where naive guided matching is highly sensitive to inference guidance scales, while branch-aware supervision enables more robust and effective knowledge transfer.", 'score': 61, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '731a1813942fcb94', 'authors': ['Bingnan Li', 'Haozhe Wang', 'Haozhong Xiong', 'Fangtai Wu', 'Jinpeng Yu', 'Yang Shi', 'Jiaming Liu', 'Ruihua Huang'], 'affiliations': ['Qwen Business Unit of Alibaba'], 'pdf_title_img': 'assets/pdf/title_img/2607.24731.jpg', 'data': {'categories': ['#optimization', '#video', '#training', '#transfer_learning', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Правильная ветвление при дистилляции диффузионных моделей с классификаторно-свободной ориентацией', 'desc': 'В работе рассматривается адаптация диффузионных моделей через on-policy дистилляцию, при которой студент обучается на траекториях, сгенерированных под руководством учителя. Авторы исследуют проблему применения классификаторно-свободной ориентации (CFG) в контексте дистилляции и обнаруживают, что наивное совпадение скоростей не работает, когда учитель имеет дополнительную информацию в отрицательной ветви, недоступную студенту. Это явление названо Negative Branch Asymmetry и приводит к противоположной динамике ошибок между ветвями. Для решения этой проблемы предложен метод Positive-Direction Matching, который отдельно контролирует положительное предсказание и условное направление CFG, обеспечивая более надежную передачу знаний.'}, 'en': {'title': 'Enhancing Diffusion Models with Positive-Direction Matching', 'desc': 'This paper discusses a method called On-policy Distillation (OPD) for improving diffusion models by using guidance from a teacher model. It highlights a problem known as Negative Branch Asymmetry (NBA), where errors in predictions can negatively affect the learning process when the teacher has information that the student does not. The authors propose a new approach called Positive-Direction Matching (PDM) to better manage these errors by separately addressing the positive and negative predictions. By applying PDM, they demonstrate improved performance in video control tasks, showing that this method allows for more effective knowledge transfer between models.'}, 'zh': {'title': '解决负分支不对称的创新方法', 'desc': '本文探讨了在无分类器引导下的在线策略蒸馏（OPD）如何适应扩散模型。研究发现，现有的OPD方法在处理正负分支错误时存在不足，可能导致负分支不对称（NBA）的问题。为了解决这一问题，提出了正向匹配（PDM）方法，该方法能够分别约束正向预测和无分类器引导的方向。通过在稠密到稀疏的视频控制中应用PDM，显著提高了知识转移的鲁棒性和有效性。'}}}, {'id': 'https://huggingface.co/papers/2607.21655', 'title': 'Progress Reward Modeling for Robotic Learning: A Comprehensive Survey', 'url': 'https://huggingface.co/papers/2607.21655', 'abstract': 'Abstract  Robotic learning takes place in dynamic environments with large behavior spaces. A terminal success signal only tells the robot whether the task is completed. It does not explain whether the current behavior is making progress, remaining unchanged, or undoing earlier progress. For this reason, recent studies have increasingly explored progress rewards that provide feedback during task execution. However, the current literature lacks a shared framework. Existing methods use different observations, goal specifications, output signals, supervision sources, and evaluation protocols. This makes it difficult to compare them and understand what their results actually validate. In this survey, we provide a unified view of progress reward modeling for robotic learning. We organize the field in three connected steps. We first study the interface of a progress model. This defines the problem from the outside by asking what information the model receives and what form of progress signal it produces. We then move inside the model and study the methods used to construct this signal. This reveals the different assumptions and mechanisms behind progress estimation and reward generation. Finally, we examine the data and benchmarks that support these methods. This shows how progress supervision is obtained and what different evaluations actually measure. Together, these three perspectives connect what a progress model is, how it is built, and how its quality is validated. We further summarize the main limitations of current approaches and discuss future research directions.', 'score': 58, 'issue_id': 2774, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'bb4eac6b2a829c41', 'authors': ['Jianshu Zhang', 'Keliang Wu', 'Haoran Lu', 'Anbang Liu', 'Ce Zhang', 'Weijie Yin', 'Chengxuan Qian', 'Xiyuan Yang', 'Zhenyu Pan', 'Guo Ye', 'Han Liu'], 'affiliations': ['Carnegie Mellon University', 'Northwestern University', 'University of California, Santa Barbara', 'University of Illinois Urbana-Champaign', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.21655.jpg', 'data': {'categories': ['#rl', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Единая структура моделей прогресса для обучения роботов', 'desc': 'Это обзорная статья о прогресс-наградах в робототехническом обучении, которые предоставляют обратную связь во время выполнения задачи, а не только финальный сигнал успеха. Авторы предлагают единую структуру для организации этого направления исследований, разделяя её на три аспекта: интерфейс модели прогресса (какие данные она получает и какой сигнал выдаёт), методы построения этого сигнала (предположения и механизмы оценки прогресса), и данные с бенчмарками для валидации подходов. Такая систематизация помогает сравнивать различные методы и понять, что именно они измеряют в контексте обучения с подкреплением. Авторы выявляют основные ограничения текущих подходов и указывают направления для будущих исследований.'}, 'en': {'title': 'Unifying Progress Rewards for Smarter Robotic Learning', 'desc': "This paper discusses the challenges in robotic learning, particularly in environments where robots must learn from their actions. It highlights the need for progress rewards that provide ongoing feedback about a robot's performance, rather than just a final success signal. The authors propose a unified framework to analyze and compare different methods of progress reward modeling, focusing on the interface, construction, and evaluation of these models. They also identify limitations in current approaches and suggest directions for future research to improve robotic learning."}, 'zh': {'title': '统一进展奖励模型，提升机器人学习效果', 'desc': '本论文探讨了机器人学习中的进展奖励模型，特别是在动态环境和复杂行为空间中的应用。传统的成功信号只能告诉机器人任务是否完成，但无法提供关于行为进展的反馈。我们提出了一个统一的框架，分析了进展模型的接口、构建方法和支持数据，帮助理解不同方法的假设和机制。最后，我们总结了当前方法的局限性，并讨论了未来的研究方向。'}}}, {'id': 'https://huggingface.co/papers/2607.22798', 'title': 'StateAct: Program State, before Pixels, for Long-Horizon Computer-Use Agents', 'url': 'https://huggingface.co/papers/2607.22798', 'abstract': "Abstract  Computer-use agents are usually improved by strengthening perception: better models for reading a screenshot and choosing where to click. Yet a screenshot is only a lossy rendering of the underlying program state, e.g., the files, application backends, and DOM that hold the task data. Different states can produce the same pixels, while code can inspect and modify that state directly. StateAct is a code-first, multi-agent harness built around this distinction. Its main agent works directly with program state by using code, while a dedicated GUI subagent handles screenshot-and-click interaction on the few subgoals that need it, just 28 of 108 tasks and 1.1% of main-agent steps. The same direct access to program state also supports verification: an independent finish gate double-checks the saved result for structural failures, e.g., output that is missing, unsaved, or written to the wrong path. To stay on track over hundreds of steps, the main agent hands subgoals to fresh subagents, keeping its own context focused. On OSWorld 2.0, StateAct lifts Claude Opus 4.8 from 20.6% to 26.9% on binary success, and from 54.8% to 61.6% on partial success, at ~ 9x lower cost per task than the same model driven by screenshots alone; a code-only variant with no GUI subagent reaches only 45.9% partial, below that screenshot-based baseline's 54.8%. In general, grounding action, verification, and memory in state, what we call state-grounding, shifts the main bottleneck from perception toward reasoning: failures depend more on what the agent thinks than on what it sees.", 'score': 51, 'issue_id': 2774, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'd767f0c8834a5ffe', 'authors': ['Yan Yang', 'Xiangru Jian', 'Ziyang Luo', 'Zirui Zhao', 'Yutong Dai', 'Ziji Shi', 'Hanshu Yan', 'Jun Hao Liew', 'Silvio Savarese', 'Junnan Li'], 'affiliations': ['Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.22798.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'От восприятия к рассуждению: state-grounding для компьютерных агентов', 'desc': 'В статье представляется StateAct — фреймворк для агентов, работающих с компьютером, который использует прямой доступ к состоянию программы через код вместо анализа скриншотов. Основной агент взаимодействует с программным состоянием посредством кодирования, а специализированный GUI подагент обрабатывает визуальное взаимодействие только для небольшой части задач. Система включает независимый механизм верификации, который проверяет корректность результатов, обнаруживая структурные ошибки в выходных данных. На бенчмарке OSWorld 2.0 подход достигает значительного улучшения производительности при девятикратном снижении стоимости, переместив основное узкое место с восприятия на рассуждение.'}, 'en': {'title': 'Empowering Agents with Direct State Access for Better Reasoning', 'desc': "This paper introduces StateAct, a multi-agent system that enhances computer-use agents by allowing them to interact directly with program state instead of relying solely on screenshots. By using a main agent that accesses the underlying code and a GUI subagent for limited visual interactions, the system improves task performance while reducing costs. The approach emphasizes 'state-grounding', which shifts the focus from perception to reasoning, leading to better decision-making by the agent. The results show significant improvements in task success rates compared to traditional screenshot-based methods."}, 'zh': {'title': '通过状态驱动推理，提升智能体性能', 'desc': '本论文提出了一种名为StateAct的多智能体框架，旨在通过直接访问程序状态来提升计算机代理的性能。与传统依赖截图的方式不同，StateAct的主要代理使用代码直接与程序状态交互，而专门的GUI子代理仅处理少量需要截图和点击的子目标。该方法不仅提高了任务成功率，还通过独立的验证机制确保结果的准确性。总体而言，StateAct通过将行动、验证和记忆与程序状态相结合，减少了对感知的依赖，增强了推理能力。'}}}, {'id': 'https://huggingface.co/papers/2607.24744', 'title': 'Data Pyramid for Embodied Manipulation', 'url': 'https://huggingface.co/papers/2607.24744', 'abstract': 'Abstract  Multimodal foundation models learned to see and to speak by consuming the whole internet. Embodied agents admit no such shortcut, since they require data that couple observations with physical states and actions. These signals can be provided, to varying degrees, by multiple data sources. In this work, we organize the embodied data ecosystem as a "pyramid" spanning five complementary sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. We organize the pyramid around the tension between scalability and robot alignment, and further characterize each source in terms of data quality, diversity, reusability, and physical fidelity. We then analyze recent embodied foundation models through the lens of their data recipes, examining how different sources are selected, aligned, and mixed during pretraining. For embodied brain models, vision-language-action models, and world-action models alike, we relate data composition to capabilities in perception, reasoning, planning, action generation, and world prediction. We close by discussing six open challenges: building large-scale tactile datasets, collecting failure and recovery data, developing scalable data-collection pipelines, aligning actions across embodiments, leveraging egocentric data for dexterous manipulation, and designing principled data recipes for robot learning. We hope this work paves the foundation for the design of next-generation embodied systems.', 'score': 30, 'issue_id': 2774, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'a5fdfd228251ff75', 'authors': ['Yifan Ye', 'Yankai Fu', 'Yaoxu Lv', 'Bohan Hou', 'Jun Cen', 'Lingdong Kong', 'Duo Zheng', 'Tianxing Chen', 'Jiaming Liu', 'Ziang Cao', 'Yunfan Lou', 'Wei Chow', 'Xian Sun', 'Yingshuo Wang', 'Kuangzhi Ge', 'Xiaowei Chi', 'Xidong Zhang', 'Zhibo Pang', 'Yiwu Zhong', 'Sirui Han', 'Zhihe Lu', 'Weihao Yuan', 'Qifeng Chen', 'Michael Yu Wang', 'Yao Mu', 'Ziwei Liu', 'Jianfei Yang', 'Ping Luo', 'Shanghang Zhang'], 'affiliations': ['CUHK', 'Duke', 'GBU', 'HKU', 'HKUST', 'NJU', 'NTU', 'NUS', 'PKU', 'SJTU', 'UCB'], 'pdf_title_img': 'assets/pdf/title_img/2607.24744.jpg', 'data': {'categories': ['#multimodal', '#science', '#data', '#dataset', '#robotics', '#survey'], 'emoji': '🤖', 'ru': {'title': 'Пирамида данных: как правильно смешивать источники для обучения воплощённых агентов', 'desc': 'В этой работе авторы анализируют экосистему данных для обучения воплощённых агентов (роботов), организуя различные источники данных в пирамиду: от реальных роботов до синтетических симуляций и общих видео-языковых наборов данных. Они исследуют компромисс между масштабируемостью данных и их релевантностью для конкретных роботов, оценивая качество, разнообразие и физическую достоверность каждого источника. Авторы анализируют недавние фундаментальные модели для роботики через призму их рецептов обучения, связывая состав данных с возникающими способностями в восприятии, рассуждении, планировании и предсказании динамики. Работа выявляет шесть критических вызовов в сборке больших тактильных датасетов, обработке отказов и разработке принципиальных стратегий комбинирования данных для обучения роботов.'}, 'en': {'title': 'Building the Future of Embodied AI with Diverse Data Sources', 'desc': "This paper discusses the development of embodied agents in machine learning, which require specific data that connects observations with physical actions. It introduces a 'pyramid' structure to categorize five types of data sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. The authors analyze how these data sources impact the training of embodied foundation models, focusing on their quality, diversity, and alignment with robotic actions. They also identify six key challenges in advancing embodied systems, such as creating large tactile datasets and improving data collection methods."}, 'zh': {'title': '构建下一代具身智能系统的基础', 'desc': '这篇论文探讨了多模态基础模型如何通过互联网学习视觉和语言。与此不同，具身智能体需要将观察与物理状态和动作结合的数据。作者将具身数据生态系统组织成一个五层金字塔，涵盖真实机器人数据、UMI风格数据、自我中心和外部中心数据、仿真数据以及通用视觉-语言数据。论文还分析了不同数据源在预训练过程中的选择、对齐和混合方式，并讨论了构建下一代具身系统的六个开放挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.24027', 'title': 'Sol-Attn: Accelerating Video Generation Inference via On-the-Fly Attention Sparsification', 'url': 'https://huggingface.co/papers/2607.24027', 'abstract': 'Abstract  Diffusion transformers are essential for high-fidelity video generation, but long token sequences make attention a dominant inference bottleneck. Training-free dynamic sparse attention alleviates this bottleneck by computing only selected key-value blocks, yet existing methods struggle to sparsify attention both efficiently and accurately for two reasons: (1) Rigid, unpredictable, and costly routing: selecting a fixed fraction of top-ranked blocks by proxy score imposes fixed budgets, whereas retaining blocks to reach a target cumulative proxy probability mass yields dynamic but potentially imbalanced budgets; both incur non-negligible overhead from computing and materializing proxy scores. (2) Lossy keep-or-drop sparsification: unselected blocks are discarded entirely, degrading accuracy under aggressive sparsity. These limitations motivate cheaper dynamic-budget routing while limiting accuracy degradation. In this paper, we introduce training-free Sol-Attn (Sparsifying online attention), which unifies dynamic routing, sparse computation, and approximation correction in a single online-softmax pass, achieving a better accuracy-efficiency trade-off in sparse attention. The core of Sol-Attn is on-the-fly block thresholding with proxy-score reuse, which selects critical blocks by comparing block proxy scores against a threshold during online softmax. This design enables dynamic yet controllable block budgets without materializing the proxy map, while directly reusing the proxy scores of unselected blocks to approximate their contribution. Experiments across image and video generation tasks show that Sol-Attn advances the quality-efficiency frontier of training-free sparse attention, delivering 2.1 times and 2.3 times end-to-end speedups for video generation and editing, respectively, while preserving visual quality.', 'score': 24, 'issue_id': 2776, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '499e1de96f8702d2', 'authors': ['Haopeng Li', 'Yitong Li', 'Junsong Chen', 'Tian Ye', 'Haozhe Liu', 'Jincheng Yu', 'Duomin Wang', 'Ruihua Zhang', 'Zeke Xie', 'Enze Xie', 'Song Han'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.24027.jpg', 'data': {'categories': ['#inference', '#optimization', '#architecture', '#video', '#diffusion'], 'emoji': '⚡', 'ru': {'title': 'Онлайн-разреживание внимания без обучения для быстрой генерации видео', 'desc': 'В статье предложен метод Sol-Attn для оптимизации механизма внимания в диффузионных трансформерах, используемых для генерации видео высокого качества. Основная идея заключается в динамической разреживании внимания путём выбора только критически важных блоков ключ-значение без необходимости обучения модели. Метод объединяет динамическую маршрутизацию с переменным бюджетом блоков, разреженные вычисления и коррекцию аппроксимации в единственном проходе онлайн-софтмакса. Экспериментальные результаты показывают ускорение генерации видео в 2.1-2.3 раза при сохранении визуального качества.'}, 'en': {'title': 'Dynamic Sparse Attention for Efficient Video Generation', 'desc': 'This paper presents Sol-Attn, a novel approach to improve the efficiency of attention mechanisms in video generation using dynamic sparse attention. Traditional methods face challenges with fixed routing and lossy sparsification, which can lead to inefficiencies and reduced accuracy. Sol-Attn addresses these issues by implementing on-the-fly block thresholding and reusing proxy scores, allowing for a more flexible and efficient selection of attention blocks. The results demonstrate significant speed improvements in video tasks while maintaining high visual quality, showcasing a better balance between accuracy and efficiency in sparse attention mechanisms.'}, 'zh': {'title': '动态稀疏注意力的高效新方法', 'desc': '扩散变换器在高保真视频生成中至关重要，但长序列令注意力机制成为推理的瓶颈。本文提出了一种无训练的动态稀疏注意力方法Sol-Attn，通过在线软最大化过程统一动态路由、稀疏计算和近似修正，从而提高稀疏注意力的准确性和效率。Sol-Attn的核心在于动态阈值选择关键块，避免了计算和存储代理分数的开销，同时通过重用未选择块的代理分数来近似其贡献。实验表明，Sol-Attn在视频生成和编辑任务中实现了显著的速度提升，同时保持了视觉质量。'}}}, {'id': 'https://huggingface.co/papers/2607.23855', 'title': 'OmniVAE: An Audio-Video VAE with Cross-Modal Alignment for Joint Generation', 'url': 'https://huggingface.co/papers/2607.23855', 'abstract': 'Abstract  Recent generative models are moving beyond silent video or standalone audio synthesis toward the joint generation of synchronized audio and video. Despite this progress, jointly generating audio and video with fine-grained cross-modal correspondence remains challenging due to their fundamental structural differences. Most existing methods use audio and video VAEs trained separately. As a result, the two latent spaces lack cross-modal alignment, leaving the downstream generative model to learn cross-modal synchronization from scratch. We present OmniVAE, a jointly trained audio-video VAE that learns fine-grained semantic alignment between audio and video latent representations. Beyond reconstruction, OmniVAE uses a segment-level audio-video contrastive objective to capture temporal-semantic correspondence and align the two latent spaces. In parallel, it distills features from pretrained modality-specific semantic encoders into each modality, improving the downstream learnability of both latent spaces. Extensive experiments show that both objectives consistently improve the learnability of the latent spaces, translating into higher generation quality and more accurate cross-modal synchronization in downstream text-to-audio-video generation. These findings underscore the importance of learning unified representations as a foundation for omnimodal modeling.1', 'score': 21, 'issue_id': 2775, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '4a328b4e9db20aa1', 'authors': ['Jun Zhan', 'Chen Yang', 'Yitian Gong', 'Donghua Yu', 'Kuangwei Chen', 'Wenbo Zhang', 'Kexin Huang', 'Qi Luo', 'Zhe Xu', 'Ying Zhu', 'Jin Wang', 'Tengyue Zhang', 'Qi Chen', 'Cheng Chang', 'Songlin Wang', 'Junqi Dai', 'Jiasheng Ye', 'Xiaogui Yang', 'Tianyi Liang', 'Xiangyu Peng', 'Zhaoye Fei', 'Shimin Li', 'Qinyuan Cheng', 'Xie Chen', 'Xinchi Chen', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'MOSI Intelligence', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.23855.jpg', 'data': {'categories': ['#audio', '#architecture', '#video', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Единое латентное пространство для синхронной генерации аудио и видео', 'desc': 'В работе предлагается OmniVAE — единая вариационная автокодировщик для совместного обучения на аудио и видео данных. Основная идея заключается в создании согласованных латентных пространств для обеих модальностей через контрастивное обучение на уровне сегментов и дистилляцию знаний от специализированных энкодеров. Предложенный подход позволяет достичь точного кроссмодального выравнивания и синхронизации между звуком и видео за счёт улучшения обучаемости латентных представлений. Экспериментальные результаты демонстрируют, что такой подход значительно повышает качество генерации мультимодального контента в задачах условной генерации текст-в-аудио-видео.'}, 'en': {'title': 'Unified Audio-Video Generation with OmniVAE', 'desc': 'This paper introduces OmniVAE, a novel approach for jointly generating synchronized audio and video using a variational autoencoder (VAE) framework. Unlike traditional methods that train audio and video separately, OmniVAE learns a unified latent space that captures fine-grained semantic alignment between the two modalities. It employs a segment-level audio-video contrastive objective to enhance temporal-semantic correspondence, ensuring better synchronization. The results demonstrate that this method significantly improves the quality of generated content and the accuracy of cross-modal synchronization in applications like text-to-audio-video generation.'}, 'zh': {'title': 'OmniVAE：音视频联合生成的新突破', 'desc': '最近的生成模型正在从静态视频或独立音频合成，转向同步生成音频和视频。尽管取得了一些进展，但由于音频和视频在结构上存在根本差异，联合生成具有细粒度跨模态对应关系的音频和视频仍然具有挑战性。现有的大多数方法使用分别训练的音频和视频变分自编码器（VAE），导致两个潜在空间缺乏跨模态对齐。我们提出了OmniVAE，这是一种联合训练的音频-视频 VAE，能够学习音频和视频潜在表示之间的细粒度语义对齐。'}}}, {'id': 'https://huggingface.co/papers/2607.21694', 'title': 'Oxygen-TryOn: Fashion-Native Foundation Model for Any-item Virtual Try-On', 'url': 'https://huggingface.co/papers/2607.21694', 'abstract': 'Abstract  We present Oxygen-TryOn, a unified foundation model for any-item virtual try-on. Rather than repurposing a general-purpose image editor, Oxygen-TryOn is fashion-native, built for try-on through a dedicated data engine and try-on-specific training. Given one or more reference items (clean product shots or in-the-wild worn-on photos) and a single target subject image, it synthesizes a photorealistic image of the subject wearing the items across virtually any fashion category. Prior systems handle a single garment category in a studio setting, and recent multi-reference methods remain garment-centric; in contrast, Oxygen-TryOn supports diverse items and scenarios, including full- and half-body views, a variable number of references, and free multi-item composition, while faithfully preserving both subject identity and item appearance. Instead of mask-based inpainting, we reformulate try-on as a multi-reference, understanding-driven generation task. We build a data engine that collects, manufactures, annotates, and filters high-quality try-on data at scale, and design a three-stage recipe of continued pre-training (CPT), supervised fine-tuning (SFT), and reinforcement learning (RL). The RL stage uses a hybrid reward combining an in-house try-on reward model with a proprietary, rubric-guided general-purpose model, jointly supervising fine-grained consistency and instruction-level quality. It also follows general editing instructions (e.g., pose changes) in the same pass. Across public benchmarks and our in-house Oxygen-TryOn Bench, it achieves state-of-the-art consistency and realism on single-item try-on and leads on multi-item try-on, matching or surpassing both leading proprietary systems (Nano Banana Pro, GPT-Image-2, Seedream5 Lite) and open-source models (FLUX.2).', 'score': 20, 'issue_id': 2775, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': '8a3d480cea2a23f6', 'authors': ['Yong Liu', 'Xiaolong Fu', 'Zihang Xu', 'Wen Xue', 'Xueheng Li', 'Lin Song', 'Yuan Zhang', 'Chuyang Zhao', 'Haoyang Huang', 'Nan Duan', 'Yipeng Sun', 'Yan Li', 'Simiu Gu'], 'affiliations': ['AIGC Group & Joy Future Academy, JD'], 'pdf_title_img': 'assets/pdf/title_img/2607.21694.jpg', 'data': {'categories': ['#rl', '#data', '#benchmark', '#dataset', '#training', '#cv'], 'emoji': '👗', 'ru': {'title': 'Специализированная модель для фотореалистичной виртуальной примерки любой одежды', 'desc': 'Oxygen-TryOn — это специализированная фундаментальная модель для виртуальной примерки одежды любого типа. Вместо использования универсальных редакторов изображений, модель разработана специально для задачи примерки с собственным конвейером данных и специфичными для примерки методами обучения. Система преобразует задачу примерки из простого инpaintинга на основе масок в задачу многореференцной генерации с глубоким пониманием контента. Модель обучается в три этапа — continued pre-training, supervised fine-tuning и reinforcement learning с гибридной функцией вознаграждения — и достигает лучших результатов по консистентности и реалистичности как для одиночной, так и для множественной примерки одежды.'}, 'en': {'title': 'Revolutionizing Virtual Try-On with Oxygen-TryOn', 'desc': 'Oxygen-TryOn is a specialized machine learning model designed for virtual try-on of fashion items, allowing users to see how different clothing looks on them. Unlike previous models that focused on single garment categories, this model can handle multiple items and various scenarios, providing a realistic representation of the subject wearing the items. It utilizes a unique data engine for collecting and processing high-quality try-on data and employs a three-stage training approach that includes continued pre-training, supervised fine-tuning, and reinforcement learning. The model excels in maintaining the identity of the subject while ensuring the appearance of the items is preserved, achieving top performance in both single and multi-item try-on tasks.'}, 'zh': {'title': 'Oxygen-TryOn：时尚虚拟试穿的新标准', 'desc': 'Oxygen-TryOn 是一个统一的基础模型，专为任何物品的虚拟试穿而设计。与一般的图像编辑器不同，Oxygen-TryOn 是时尚原生的，专注于通过专门的数据引擎和训练进行试穿。它能够根据一个或多个参考物品和一个目标主体图像，合成出主体穿着这些物品的逼真图像，支持多种时尚类别。该模型通过多参考、理解驱动的生成任务，结合强化学习，达到了在单件和多件试穿上的最佳一致性和真实感。'}}}, {'id': 'https://huggingface.co/papers/2607.24720', 'title': 'The Physics of Multi-Turn Long-Horizon Planning: From Pre-training to Post-training via Single- and Multi-Teacher On-Policy Agentic Distillation', 'url': 'https://huggingface.co/papers/2607.24720', 'abstract': "Abstract  Multi-turn long-horizon planning is critical for foundation model agents, yet how to fundamentally improve it remains unclear. Existing models are trained on uncontrollable and opaque Internet data, making it difficult to identify how planning ability is acquired, shaped, and integrated. To address this challenge, we introduce a unified and controlled multi-turn environment that enables precise control. It allows systematically study long-horizon planning across three stages. (1) Planning ability acquisition during pre-training. We study data format, distribution, and quality. Explicit world model construction through CoT state transition modeling yields stronger long-horizon generalization. Atomic skills alone are insufficient for compositional generalization, whereas a litte long-horizon data works. Moreover, suboptimal trajectories severely impair performance because errors amplify over long horizons. (2) Planning ability shaping via GRPO and OPD post-training. Through mutual information, we distinguish general planning patterns from task-specific planning knowledge. For planning patterns, we identify three application regions of post-training: unnecessary, effective, and unsupported. OPD has a broader effective region than GRPO under low-quality and long-horizon settings, as it provides more consistent update directions. For planning knowledge, distilling unseen procedures from a teacher with different knowledge may impair student's prior world modeling without fully establishing new knowledge. (3) Planning ability integration through MOPD post-training. We show that multi-teacher on-policy distillation (MOPD) integrates capabilities by converging to shared planning-pattern across environments. Compatible patterns enable cross-environment generalization, partially shared patterns support continual learning, while completely conflicting patterns cause severe interference.", 'score': 19, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '523edb8c1d0a1a19', 'authors': ['Tianyi Men', 'Zhuoran Jin', 'Kang Liu', 'Jun Zhao'], 'affiliations': ['School of Artificial Intelligence, University of Chinese Academy of Sciences, Beijing, China', 'The Key Laboratory of Cognition and Decision Intelligence for Complex Systems, Institute of Automation, Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24720.jpg', 'data': {'categories': ['#optimization', '#long_context', '#rlhf', '#training', '#reasoning', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Фундамент для многошагового планирования: от данных к интеграции знаний', 'desc': 'В статье исследуется проблема многошагового планирования на длительных горизонтах для агентов на основе foundation models. Авторы создали контролируемую среду для систематического изучения трёх этапов: приобретения способности планирования при предварительном обучении (где они показали, что явное моделирование мира и долгоиграющие данные критичны), формирования планирования через post-training методы GRPO и OPD (выявив три области эффективности), и интеграции способностей через многоучительское обучение MOPD. Результаты демонстрируют, что качество траекторий и согласованность паттернов планирования между окружениями определяют успех обобщения и непрерывного обучения агентов.'}, 'en': {'title': 'Enhancing Long-Horizon Planning in AI Agents', 'desc': 'This paper addresses the challenge of improving multi-turn long-horizon planning in foundation model agents. It introduces a controlled environment to study how planning abilities are acquired, shaped, and integrated through three stages: acquisition during pre-training, shaping via post-training methods, and integration through multi-teacher distillation. The authors find that the quality and format of training data significantly impact long-horizon generalization, and that certain planning patterns can be effectively distinguished and utilized. Additionally, they demonstrate that integrating capabilities from multiple teachers can enhance cross-environment generalization and support continual learning, while conflicting patterns can hinder performance.'}, 'zh': {'title': '提升多轮长远规划能力的关键方法', 'desc': '这篇论文探讨了多轮长远规划在基础模型代理中的重要性，并提出了一种统一的可控多轮环境，以便更好地研究规划能力的获取、塑造和整合。研究表明，数据格式、分布和质量对规划能力的获取至关重要，构建明确的世界模型可以增强长远泛化能力。通过后训练方法GRPO和OPD，论文区分了通用规划模式和特定任务的规划知识，并分析了不同后训练方法的有效性。最后，采用多教师在线蒸馏（MOPD）方法，论文展示了如何通过共享规划模式实现能力的整合和跨环境的泛化。'}}}, {'id': 'https://huggingface.co/papers/2607.23518', 'title': 'Chamaileon: Cross-Context Binder Design with Contextualized Modeling and Mixed Sampling', 'url': 'https://huggingface.co/papers/2607.23518', 'abstract': 'Abstract  The rapid evolution of generative models has unlocked new potentials in protein binder design, a pivotal task in structural biology, by facilitating end-to-end generation via joint sequence-structure modeling or hallucination. However, existing approaches are predominantly implemented under a single-target, single-state assumption, limiting their ability to model multi-target or multi-state interactions required for advanced function-oriented protein design. Here, we introduce Chamaileon, which unifies multi-target and multi-state binder design by formulating the problem as cross-context binding landscape modeling. The framework is underpinned by a training paradigm termed In-Context Complex Co-Design (I3CD) for context-aware sequence-structure co-modeling. During inference, we employ Mixture-of-Paths Sampling (MoPS), a scalable strategy that optimizes a single sequence across contexts while alleviating the scarcity of high-quality multi-conformational paired data. Extensive evaluation on our newly constructed benchmark, CROSS, demonstrates that Chamaileon effectively generates sequences adaptable to diverse conformational landscapes and multi-target requirements. The code is available on https://github.com/caohengyuan/Chamaileon.', 'score': 6, 'issue_id': 2776, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'b99dddc6a2f4983c', 'authors': ['Hengyuan Cao', 'Shizhuo Cheng', 'Mingxuan Liu', 'Weicheng Huang', 'Yunhong Lu', 'Chenxi Cai', 'Yan Zhang', 'Min Zhang'], 'affiliations': ['Fudan University, Shanghai, China', 'Shanghai Institute for Advanced Study Zhejiang University, Shanghai, China', 'Shanghai Institute for Mathematics and Interdisciplinary Sciences, Shanghai, China', 'Zhejiang University, Hangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.23518.jpg', 'data': {'categories': ['#open_source', '#science'], 'emoji': '🧬', 'ru': {'title': 'Универсальный дизайн многоцелевых белков через контекстно-осведомленное совместное моделирование', 'desc': 'В статье представлена система Chamaileon для дизайна белков-связывающих веществ, которая преодолевает ограничения существующих методов путём одновременного моделирования множественных мишеней и конформационных состояний. Основной подход основан на формулировке задачи как моделирования ландшафта связывания в различных контекстах с использованием парадигмы обучения In-Context Complex Co-Design. Для генерации белковых последовательностей применяется стратегия Mixture-of-Paths Sampling, которая оптимизирует одну последовательность сразу для нескольких конформационных пространств. Модель демонстрирует высокую эффективность на новом бенчмарке CROSS, создавая адаптивные белки для сложных биологических задач.'}, 'en': {'title': 'Chamaileon: Revolutionizing Multi-Target Protein Binder Design', 'desc': 'This paper presents Chamaileon, a novel framework for designing protein binders that can adapt to multiple targets and states. It addresses the limitations of existing generative models that typically focus on single-target, single-state scenarios. By employing a training method called In-Context Complex Co-Design (I3CD), Chamaileon enables context-aware modeling of protein sequences and structures. The framework also utilizes Mixture-of-Paths Sampling (MoPS) to efficiently generate sequences that can function across various conformational landscapes, as demonstrated by extensive evaluations on a new benchmark dataset.'}, 'zh': {'title': 'Chamaileon：多目标多状态蛋白质设计的新方法', 'desc': '本论文介绍了一种名为Chamaileon的生成模型，用于蛋白质结合物的设计。该模型通过跨上下文结合景观建模，统一了多目标和多状态的结合物设计。我们提出了一种新的训练范式，称为上下文复杂共设计（I3CD），以实现上下文感知的序列-结构共同建模。在推理过程中，采用了一种可扩展的策略，称为路径混合采样（MoPS），以优化在不同上下文中的单一序列生成。'}}}, {'id': 'https://huggingface.co/papers/2607.22148', 'title': 'dRAE: Representation Autoencoder with Hyper-Spherical Codes', 'url': 'https://huggingface.co/papers/2607.22148', 'abstract': 'Abstract  In this work, we aim to discretize the high-dimensional visual representations to bridge the gap with language models - a non-trivial challenge, as existing quantization methods suffer from codebook collapse, failing to scale while preserving semantic coherence. We identify the root cause as metric mismatch: standard Euclidean codebook objectives are fundamentally misaligned with the anisotropic geometry of representation space, leading to codebook embeddings with high-variance magnitude scales and uneven angular distributions that hinder scalability. To address this, we propose Hyper-Spherical Quantization (HSQ), which decouples semantic content from feature magnitude via angular routing, preventing code assignment from being dominated by scale rather than meaning. The resulting discrete Representation Autoencoder (dRAE) achieves high-fidelity reconstruction while preserving semantic integrity and supporting scalable codebook budget. Extensive experiments demonstrate consistent performance gains as the vocabulary size scales to 131{,}072, along with 100\\% codebook utilization, simplified training pipeline, and strong performance across understanding and generation tasks.', 'score': 6, 'issue_id': 2775, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '65988d97a7798382', 'authors': ['Tianren Ma', 'Lin Long', 'Chuyan Chen', 'Mu Zhang', 'Junbo Zhao', 'Tong Zhang', 'Qixiang Ye'], 'affiliations': ['Ant Group', 'Peking University', 'University of Chinese Academy of Sciences', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.22148.jpg', 'data': {'categories': [], 'emoji': '🌐', 'ru': {'title': 'Квантизация на гиперсфере: смысл важнее масштаба', 'desc': 'В этой работе авторы предлагают метод дискретизации высокоразмерных визуальных представлений для совместимости с языковыми моделями. Они выявили проблему коллапса кодбука, вызванную несоответствием между евклидовой метрикой и анизотропной геометрией пространства представлений. Предложенный метод Hyper-Spherical Quantization использует угловую маршрутизацию для отделения семантического содержания от масштаба признаков, что предотвращает доминирование величины над смыслом при назначении кодов. Разработанный дискретный автокодировщик представлений достигает высокого качества реконструкции, сохраняет семантическую целостность и масштабируется до словаря из 131,072 кодов с полным использованием всех элементов кодбука.'}, 'en': {'title': 'Bridging Visual and Language Models with Hyper-Spherical Quantization', 'desc': 'This paper addresses the challenge of converting high-dimensional visual data into discrete representations that can effectively interact with language models. The authors identify that traditional quantization methods struggle due to a mismatch in metrics, which leads to ineffective codebook embeddings. To solve this, they introduce Hyper-Spherical Quantization (HSQ), which separates the meaning of the data from its scale, allowing for better code assignments based on semantic content. Their proposed discrete Representation Autoencoder (dRAE) not only reconstructs data accurately but also maintains semantic coherence and scales efficiently with larger vocabulary sizes.'}, 'zh': {'title': '超球面量化：连接视觉与语言的桥梁', 'desc': '本文旨在将高维视觉表示离散化，以缩小与语言模型之间的差距。现有的量化方法存在代码本崩溃的问题，无法在保持语义一致性的同时扩展。我们提出了超球面量化（HSQ），通过角度路由将语义内容与特征幅度解耦，避免了代码分配被幅度主导。实验表明，离散表示自编码器（dRAE）在扩展词汇量时，能够实现高保真重建和语义完整性，同时支持可扩展的代码本预算。'}}}, {'id': 'https://huggingface.co/papers/2607.24516', 'title': 'DecoupleMix: Decoupled Ratio Search and Convex Allocation for Scalable VLM Data Recipes', 'url': 'https://huggingface.co/papers/2607.24516', 'abstract': 'Abstract  While data curation for Vision Language Models (VLMs) is increasingly active, public practice for constructing pretraining mixtures remains largely heuristic: practitioners stack datasets that pass quality filters, set cross-domain ratios by intuition, and lack a principled, attributable criterion for admitting new data, while frontier recipes remain undisclosed. We formulate data construction as a systematic mixture-optimization problem and turn it into a reproducible engineering discipline by decoupling the mixture into two orthogonal sub-problems: inter-class ratios across capabilities and intra-class ratios within a category. For inter-class allocation, we use a single-variable iterative search; for intra-class composition, we apply a multidimensional, dataset-level assessment scoring Quality and Difficulty, and formulate selection as a constrained convex optimization with a diversity objective. The DecoupleMix framework delivers two critical capabilities: guiding what data to collect next and rendering dataset validation a controlled, attributable experiment. Experiments show our approach consistently surpasses heuristic baselines. Moreover, optimal ratios discovered on small-scale proxies transfer seamlessly to larger scales without retuning. Using 80B additional multimodal continue-pretraining tokens, our VLM is competitive with strong open-source models trained with substantially larger multimodal budgets.', 'score': 5, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '2e62f61c52f7c952', 'authors': ['Jiahao Xie', 'Zhongbin Guo', 'Qianle Wang', 'Ruiqi Lu', 'Dongling Xiao', 'Wanxuan Sun', 'Cheng Yang'], 'affiliations': ['ByteDance Commercial AI Team'], 'pdf_title_img': 'assets/pdf/title_img/2607.24516.jpg', 'data': {'categories': ['#optimization', '#open_source', '#data', '#multimodal', '#dataset', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Систематическая оптимизация смеси данных для эффективного предварительного обучения мультимодальных моделей', 'desc': 'Авторы предлагают систематический подход к формированию наборов данных для предварительного обучения мультимодальных моделей (VLM), заменяя интуитивное комбинирование датасетов принципиальной оптимизацией смеси. Они декомпозируют задачу на два ортогональных компонента: межклассовое распределение между различными способностями модели и внутриклассовое распределение внутри каждой категории данных. Для межклассового распределения используется одномерный итеративный поиск, а для внутриклассового состава применяется многомерная оценка качества и сложности датасетов с последующей оптимизацией с ограничениями и учётом разнообразия. Экспериментальные результаты демонстрируют, что оптимальные соотношения, найденные на малых масштабах данных, успешно масштабируются на большие объёмы без переполадки модели.'}, 'en': {'title': 'Optimizing Data Mixtures for Vision Language Models', 'desc': 'This paper addresses the challenges in data curation for Vision Language Models (VLMs) by proposing a systematic approach to optimize dataset mixtures. It introduces the DecoupleMix framework, which separates the data construction process into inter-class and intra-class optimization problems. The framework employs iterative search for inter-class ratios and a constrained convex optimization for intra-class composition, focusing on quality and difficulty metrics. The results demonstrate that this method not only outperforms traditional heuristic approaches but also allows for effective scaling of dataset ratios without the need for extensive retuning.'}, 'zh': {'title': '系统化优化视觉语言模型数据构建', 'desc': '本文提出了一种系统化的数据构建方法，旨在优化视觉语言模型（VLMs）的预训练数据混合。我们将数据混合分解为两个正交的子问题：跨类别的比例分配和类别内的比例构成。通过迭代搜索和多维评估，我们能够有效选择数据集，并将选择过程转化为受约束的凸优化问题。实验结果表明，我们的方法在性能上超越了传统的启发式基线，并且在小规模代理上发现的最佳比例可以无缝迁移到更大规模的应用中。'}}}, {'id': 'https://huggingface.co/papers/2607.22098', 'title': 'Reasoning Denoiser: Denoising Reasoning Traces for Hallucination Detection in Large Reasoning Models', 'url': 'https://huggingface.co/papers/2607.22098', 'abstract': 'Abstract  Large reasoning models (LRMs) generate long reasoning traces before producing final answers. While these traces may contain useful signals for hallucination detection, harnessing them is non-trivial because long trajectories often include noisy steps that obscure the cues relevant to truthfulness assessment. In this paper, we identify two prevalent forms of reasoning noises, i.e., irrelevant steps and repetitive steps, and show that both substantially degrade hallucination detection performance. Existing confidence-based scores and naive embedding-based filtering fail to reliably separate noisy from informative steps. To address this challenge, we propose REDE, a novel learning framework for denoising reasoning traces for hallucination detection. Specifically, REDE leverages final-answer attention as an automatic supervision signal to shape the step-level representation space, yielding refined embeddings in which noisy steps can be reliably identified and filtered. REDE can be readily plugged into diverse hallucination detectors by operating on the filtered reasoning trajectory after removing noisy steps. Extensive experiments on multiple reasoning benchmarks show that REDE consistently improves detection performance over competitive baselines.', 'score': 5, 'issue_id': 2776, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '03c1cef69d16f590', 'authors': ['Junlin Fang', 'Do Nguyen-Thanh', 'Xiaogang Xu', 'Zhen Fang', 'Sean Du'], 'affiliations': ['Australian Artificial Intelligence Institute, University of Technology Sydney', 'College of Computing and Data Science, Nanyang Technological University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.22098.jpg', 'data': {'categories': ['#reasoning', '#hallucinations'], 'emoji': '🧹', 'ru': {'title': 'Очистка цепочек рассуждений от шума для надёжного обнаружения галлюцинаций', 'desc': 'Статья посвящена проблеме обнаружения галлюцинаций в больших моделях рассуждений, которые генерируют длинные цепочки промежуточных шагов перед выдачей ответа. Авторы выявляют два типа шума в цепочках рассуждений: нерелевантные и повторяющиеся шаги, которые снижают качество детектирования галлюцинаций. Они предлагают метод REDE, который использует внимание к финальному ответу как автоматический сигнал обучения для очистки представлений шагов рассуждения. Экспериментальные результаты показывают, что предложенный подход можно интегрировать в различные детекторы галлюцинаций и он последовательно улучшает их производительность.'}, 'en': {'title': 'Enhancing Hallucination Detection with REDE Framework', 'desc': 'This paper discusses the challenges of detecting hallucinations in large reasoning models (LRMs) due to the presence of noisy reasoning traces. It identifies two main types of noise: irrelevant steps and repetitive steps, which hinder the accuracy of hallucination detection. The authors introduce a new framework called REDE, which uses final-answer attention to improve the representation of reasoning steps, allowing for better identification and filtering of noise. Through extensive testing, REDE demonstrates significant improvements in detection performance compared to existing methods.'}, 'zh': {'title': '提升幻觉检测的推理去噪新框架REDE', 'desc': '大型推理模型（LRMs）在生成最终答案之前会产生长的推理轨迹。这些轨迹中可能包含用于检测幻觉的有用信号，但由于长轨迹中常常包含噪声步骤，导致相关线索被掩盖。本文识别了两种常见的推理噪声形式，即无关步骤和重复步骤，并表明这两者显著降低了幻觉检测的性能。为了解决这个问题，我们提出了REDE，一个新的学习框架，用于去噪推理轨迹，以提高幻觉检测的准确性。'}}}, {'id': 'https://huggingface.co/papers/2607.22561', 'title': 'Codifying the Judge: Scalable Evaluation via Program Distillation', 'url': 'https://huggingface.co/papers/2607.22561', 'abstract': "Abstract  LLM-as-a-judge has become the standard for automated evaluation, but it suffers from high cost, significant latency, and opaque decisions -- limitations that undermine its scalability and reliability. We address these with a simple, efficient alternative: program distillation. Instead of prompting an LLM at the evaluation time, we distill its decision logic into a committee of programs that score candidates directly. These programmatic judges offer transparency, are easily inspected or edited, and eliminate per-sample API costs. Building on this notion, we introduce PAJAMA, a system that synthesizes programs as judges, aggregates their decisions into a joint verdict, and incorporates a fallback mechanism to selectively escalate low-confidence cases to an LLM. Across five datasets and four model families, we show that programmatic judges can match the performance of a 13B-size LLM judge. When using program outputs as routing signals, PAJAMA improves both accuracy and throughput and advances the Pareto frontier. Beyond evaluation, programmatic judges produce cheap and effective reward signals: on RewardBench, a reward model distilled from programs' verdicts outperforms one trained on a proprietary LLM's labels at two orders of magnitude lower API cost.", 'score': 5, 'issue_id': 2775, 'pub_date': '2026-05-29', 'pub_date_card': {'ru': '29 мая', 'en': 'May 29', 'zh': '5月29日'}, 'hash': '01ca0a1e15aaa337', 'authors': ['Tzu-Heng Huang', 'Shengqi Qiu', 'Frederic Sala'], 'affiliations': ['University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.22561.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'От чёрного ящика LLM к прозрачным программным судьям', 'desc': 'В статье предлагается альтернатива дорогостоящей оценке качества с помощью больших языковых моделей (LLM) - программная дистилляция. Вместо обращения к LLM во время оценки, авторы переносят логику принятия решений в набор прозрачных программ, которые напрямую оценивают кандидатов. Система PAJAMA синтезирует программные судьи, агрегирует их вердикты и использует механизм отката для сложных случаев. Экспериментально показано, что программные судьи достигают качества 13B LLM-судьи, но при этом снижают стоимость API и повышают пропускную способность.'}, 'en': {'title': 'Program Distillation: A Transparent and Efficient Alternative to LLMs for Evaluation', 'desc': 'The paper introduces a new method called program distillation as an alternative to using large language models (LLMs) for automated evaluation. Instead of relying on LLMs, which can be costly and slow, the authors propose creating a committee of simpler programs that can directly score candidates based on distilled decision logic. This approach not only enhances transparency and allows for easy inspection of the decision-making process but also significantly reduces costs associated with API usage. The proposed system, PAJAMA, demonstrates that these programmatic judges can achieve comparable performance to a large LLM while improving efficiency and accuracy in various evaluation tasks.'}, 'zh': {'title': '程序蒸馏：高效透明的评估新方法', 'desc': '本文提出了一种新的评估方法，称为程序蒸馏，旨在解决大型语言模型（LLM）作为评判者的高成本和延迟问题。通过将LLM的决策逻辑提炼成一组程序，这些程序可以直接对候选者进行评分，从而提高透明度和可检查性。我们介绍的PAJAMA系统能够合成程序作为评判者，并将它们的决策汇总为最终结果，同时在低置信度情况下可以选择性地调用LLM。实验结果表明，程序评判者的性能可以与大型LLM相媲美，并且在成本和效率上具有显著优势。'}}}, {'id': 'https://huggingface.co/papers/2607.24743', 'title': 'ClinFusion: A Vision-Centric Multimodal LLM System for Holistic Medical Understanding', 'url': 'https://huggingface.co/papers/2607.24743', 'abstract': "Abstract  Multimodal large language models (MLLMs) hold immense potential to revolutionize clinical practice, yet deploying them in the medical domain is fundamentally a vision-centric challenge: models must absorb knowledge from heterogeneous 2D and 3D medical images, and evaluation protocols must align with radiologists' clinical practice and provide an accurate, fine-grained and factualness-driven assessment. In this paper, we introduce ClinFusion, a vision-centric MLLM designed for holistic medical understanding that systematically addresses these limitations. We propose a compositional and cascaded vision encoder architecture featuring a Cascade Spatial-Aware Locality Fusion operator that unifies diverse 2D and native 3D medical image understanding within a fused encoder. We further introduce a vision-grounded evaluation framework, including MedIF-Bench for instruction-following assessment and a region-of-interest-grounded method for clinically aligned and factualness-driven report generation evaluation. We show that ClinFusion sets a new state-of-the-art across a comprehensive suite of 2D and 3D multimodal medical benchmarks---spanning visual question answering, report generation, and instruction following---as well as textual medical tasks, outperforming leading open-source medical MLLMs (e.g., Hulu-Med, Lingshu) on 20 out of 24 benchmarks and demonstrating multimodal capabilities better than powerful proprietary models such as GPT-5.2 and Gemini-3-Flash on 13 out of 16 benchmarks, and can be further augmented with agentic tool use for retrieval-augmented and tool-assisted clinical workflows. A blinded evaluation by board-certified radiologists confirms that ClinFusion produces the highest-ranked reports, and validates our RoI-grounded metric as achieving the strongest correlation with expert judgment among all automatic evaluation metrics examined.", 'score': 4, 'issue_id': 2774, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '54e00d9dac5c5f4e', 'authors': ['Hangjie Yuan', 'Yichen Qian', 'Zhiwei Tang', 'Xianzhe Xu', 'Lirong Wu', 'Sicheng Yang', 'Jinwang Wang', 'Pengju Wang', 'Zhitao Zeng', 'Yizeng Han', 'Yan Xing', 'Shengxuan Luo', 'Tao Feng', 'Qing Xie', 'Weigen Yao', 'Yi Yang', 'Zuozhu Liu', 'Jiasheng Tang', 'Shaocheng Wang', 'Jitao Wang', 'Jiahong Dong', 'Weihua Chen', 'Feng Xu', 'Fan Wang'], 'affiliations': ['Beijing National Research Center for Information Science and Technology, Tsinghua University, Beijing, China', 'College of Computer Science and Technology, Zhejiang University, Hangzhou, China', 'DAMO Academy, Alibaba Group, Beijing, China', 'DAMO Academy, Alibaba Group, Hangzhou, China', 'Department of Computer Science and Technology, Tsinghua University, Beijing, China', 'Department of Radiology, The Affiliated Yangming Hospital of Ningbo University, Yuyao, China', 'Hepato-Pancreato-Biliary Center, Beijing Tsinghua Changgung Hospital, School of Clinical Medicine, Tsinghua Medicine, Tsinghua University, Beijing, China', 'Hupan Laboratory, Hangzhou, China', 'School of Software, Tsinghua University, Beijing, China', 'Zhejiang University-University of Illinois Urbana-Champaign Institute, Zhejiang University, Haining, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24743.jpg', 'data': {'categories': ['#rag', '#multimodal', '#science', '#cv', '#architecture', '#benchmark', '#healthcare', '#agents', '#3d', '#open_source'], 'emoji': '🏥', 'ru': {'title': 'Стратегическое объединение видеопотоков: MLLM для клинической медицины', 'desc': 'В статье представлена ClinFusion — многомодальная большая языковая модель, специально разработанная для клинического анализа медицинских изображений. Авторы предложили инновационную архитектуру видеоэнкодера с оператором Cascade Spatial-Aware Locality Fusion, которая единообразно обрабатывает 2D и 3D медицинские изображения. Введена новая система оценки моделей — MedIF-Bench и метод на основе region-of-interest для клинически обоснованного анализа качества генерируемых отчётов. ClinFusion продемонстрировала лучшие результаты на 20 из 24 медицинских бенчмарков и получила подтверждение от сертифицированных радиологов, что модель генерирует отчёты наивысшего качества.'}, 'en': {'title': 'ClinFusion: Revolutionizing Medical Understanding with Multimodal AI', 'desc': "This paper presents ClinFusion, a multimodal large language model (MLLM) specifically designed for medical applications. It integrates knowledge from both 2D and 3D medical images using a unique compositional and cascaded vision encoder architecture. The model is evaluated through a new framework that aligns with clinical practices, ensuring accurate and factual report generation. ClinFusion outperforms existing medical MLLMs and demonstrates superior multimodal capabilities, validated by expert radiologists' assessments."}, 'zh': {'title': 'ClinFusion：医学领域的视觉中心多模态语言模型', 'desc': '多模态大型语言模型（MLLMs）在临床实践中具有巨大的潜力，但在医学领域的应用面临视觉中心的挑战。本文介绍了ClinFusion，这是一种以视觉为中心的MLLM，旨在全面理解医学，系统解决现有的局限性。我们提出了一种组合和级联的视觉编码器架构，结合了多样的2D和3D医学图像理解。研究表明，ClinFusion在多项医学基准测试中设立了新的最先进水平，超越了许多领先的开源医学模型。'}}}, {'id': 'https://huggingface.co/papers/2607.24241', 'title': 'FilmBench: A Film-Grade Benchmark for Cinematic Video Generation', 'url': 'https://huggingface.co/papers/2607.24241', 'abstract': 'Abstract  Progress in video generation keeps narrowing the visual gap between AI-generated and professionally produced footage, yet most benchmarks still draw prompts from web sources or LLM templates and score them with untrained, generic multimodal models. More fundamentally, their evaluation taxonomies remain rudimentary (overall visual quality, coarse text alignment and temporal smoothness) rather than the professional Cinematic Language criteria by which films are actually made and judged, so they assess basic video plausibility rather than film-grade craft. We introduce FilmBench, a text-to-video (T2V) and reference-to-video (R2V) benchmark grounded in the professional Cinematic Language of the film- academy tradition and co-developed with directors and faculty from the Beijing Film Academy and the Hujing Digital Media & Entertainment Group film studio. It rests on three choices. First, prompts are reverse-engineered from clips of award-winning films spanning 20 cinematic genres and chosen by professional directors, so every prompt is anchored to a verified live-action reference; the prompts follow real shot lists, and most script multiple shots (1,056 of the 1,169 prompts are multi-shot), unlike prior single-clip benchmarks. Second, evaluation follows a three-level Cinematic taxonomy of 3 axes, 12 components and 35 (T2V) +3 (R2V-only) sub-metrics. Third, we develop an in-house expert-grade automatic evaluation agent and open-source its core suite of Cinematic Language operators (FilmOps). Benchmarking leading video generation models (9 for T2V, 7 for R2V), the evaluator reproduces the human model ranking at model-level Spearman ho = 0.95 (T2V) and 0.96 (R2V). Scores fall well below prior web-style benchmarks, with two consistent gaps in dynamic aesthetics and a marked single- to multi-shot performance drop that widens for weaker models.', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'b5c348a4fe1a7724', 'authors': ['Shengyi Wang', 'Niantong Li', 'Guangzheng Hu', 'Hong Qi', 'Fei Ding', 'Weixu Qiao', 'Jinlin Wang', 'Xiaotong Lv', 'Peng Han', 'Zimeng Li', 'Fanshu Ding', 'Yushu Wang', 'Han Wu', 'Jingjing Chen', 'Chongxiao Wang', 'Yanhao Wu', 'Chenglong Huang', 'Xiaoqian Zhu', 'Jie Tian', 'Hua Li', 'Jingjing Fan', 'Mingshuang Tang', 'Zhong Li', 'Hengxia Qiang', 'Weibin Chen', 'Jinyang Zhen', 'Bing Zhao', 'Lin Qu', 'Jing Li', 'Hu Wei'], 'affiliations': ['Alibaba Group', 'Beijing Film Academy', 'Moku Lab, Hujing Digital Media & Entertainment Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.24241.jpg', 'data': {'categories': ['#open_source', '#video', '#multimodal', '#benchmark', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Кинематографический стандарт оценки для генерации видео', 'desc': 'В работе представлен FilmBench — новый бенчмарк для оценки моделей генерации видео, разработанный совместно с профессиональными режиссёрами на основе критериев кинематографического языка киноиндустрии. В отличие от существующих бенчмарков, датасет содержит промпты, обратно спроектированные из фрагментов известных фильмов разных жанров с учётом реальных сценариев, включая многокадровые сцены. Оценка проводится по трёхуровневой таксономии с 12 компонентами и 38 метриками, а также используется специально разработанный эксперт-уровневый автоматический агент на основе операторов кинематографического языка (FilmOps). Результаты показывают, что ведущие модели генерации видео значительно отстают по качеству динамических элементов и демонстрируют падение производительности при переходе от однокадровых к многокадровым сценам.'}, 'en': {'title': 'Raising the Bar for Video Generation with FilmBench', 'desc': 'This paper presents FilmBench, a new benchmark for evaluating video generation models based on professional cinematic standards rather than generic metrics.
