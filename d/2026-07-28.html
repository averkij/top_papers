    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.22798', 'title': 'StateAct: Program State, before Pixels, for Long-Horizon Computer-Use Agents', 'url': 'https://huggingface.co/papers/2607.22798', 'abstract': "Abstract  Computer-use agents are usually improved by strengthening perception: better models for reading a screenshot and choosing where to click. Yet a screenshot is only a lossy rendering of the underlying program state, e.g., the files, application backends, and DOM that hold the task data. Different states can produce the same pixels, while code can inspect and modify that state directly. StateAct is a code-first, multi-agent harness built around this distinction. Its main agent works directly with program state by using code, while a dedicated GUI subagent handles screenshot-and-click interaction on the few subgoals that need it, just 28 of 108 tasks and 1.1% of main-agent steps. The same direct access to program state also supports verification: an independent finish gate double-checks the saved result for structural failures, e.g., output that is missing, unsaved, or written to the wrong path. To stay on track over hundreds of steps, the main agent hands subgoals to fresh subagents, keeping its own context focused. On OSWorld 2.0, StateAct lifts Claude Opus 4.8 from 20.6% to 26.9% on binary success, and from 54.8% to 61.6% on partial success, at ~ 9x lower cost per task than the same model driven by screenshots alone; a code-only variant with no GUI subagent reaches only 45.9% partial, below that screenshot-based baseline's 54.8%. In general, grounding action, verification, and memory in state, what we call state-grounding, shifts the main bottleneck from perception toward reasoning: failures depend more on what the agent thinks than on what it sees.", 'score': 18, 'issue_id': 2774, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'd767f0c8834a5ffe', 'authors': ['Yan Yang', 'Xiangru Jian', 'Ziyang Luo', 'Zirui Zhao', 'Yutong Dai', 'Ziji Shi', 'Hanshu Yan', 'Jun Hao Liew', 'Silvio Savarese', 'Junnan Li'], 'affiliations': ['Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.22798.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'От восприятия к рассуждению: state-grounding для компьютерных агентов', 'desc': 'В статье представляется StateAct — фреймворк для агентов, работающих с компьютером, который использует прямой доступ к состоянию программы через код вместо анализа скриншотов. Основной агент взаимодействует с программным состоянием посредством кодирования, а специализированный GUI подагент обрабатывает визуальное взаимодействие только для небольшой части задач. Система включает независимый механизм верификации, который проверяет корректность результатов, обнаруживая структурные ошибки в выходных данных. На бенчмарке OSWorld 2.0 подход достигает значительного улучшения производительности при девятикратном снижении стоимости, переместив основное узкое место с восприятия на рассуждение.'}, 'en': {'title': 'Empowering Agents with Direct State Access for Better Reasoning', 'desc': "This paper introduces StateAct, a multi-agent system that enhances computer-use agents by allowing them to interact directly with program state instead of relying solely on screenshots. By using a main agent that accesses the underlying code and a GUI subagent for limited visual interactions, the system improves task performance while reducing costs. The approach emphasizes 'state-grounding', which shifts the focus from perception to reasoning, leading to better decision-making by the agent. The results show significant improvements in task success rates compared to traditional screenshot-based methods."}, 'zh': {'title': '通过状态驱动推理，提升智能体性能', 'desc': '本论文提出了一种名为StateAct的多智能体框架，旨在通过直接访问程序状态来提升计算机代理的性能。与传统依赖截图的方式不同，StateAct的主要代理使用代码直接与程序状态交互，而专门的GUI子代理仅处理少量需要截图和点击的子目标。该方法不仅提高了任务成功率，还通过独立的验证机制确保结果的准确性。总体而言，StateAct通过将行动、验证和记忆与程序状态相结合，减少了对感知的依赖，增强了推理能力。'}}}, {'id': 'https://huggingface.co/papers/2607.24744', 'title': 'Data Pyramid for Embodied Manipulation', 'url': 'https://huggingface.co/papers/2607.24744', 'abstract': 'Abstract  Multimodal foundation models learned to see and to speak by consuming the whole internet. Embodied agents admit no such shortcut, since they require data that couple observations with physical states and actions. These signals can be provided, to varying degrees, by multiple data sources. In this work, we organize the embodied data ecosystem as a "pyramid" spanning five complementary sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. We organize the pyramid around the tension between scalability and robot alignment, and further characterize each source in terms of data quality, diversity, reusability, and physical fidelity. We then analyze recent embodied foundation models through the lens of their data recipes, examining how different sources are selected, aligned, and mixed during pretraining. For embodied brain models, vision-language-action models, and world-action models alike, we relate data composition to capabilities in perception, reasoning, planning, action generation, and world prediction. We close by discussing six open challenges: building large-scale tactile datasets, collecting failure and recovery data, developing scalable data-collection pipelines, aligning actions across embodiments, leveraging egocentric data for dexterous manipulation, and designing principled data recipes for robot learning. We hope this work paves the foundation for the design of next-generation embodied systems.', 'score': 14, 'issue_id': 2774, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'a5fdfd228251ff75', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#science', '#data', '#dataset', '#robotics', '#survey'], 'emoji': '🤖', 'ru': {'title': 'Пирамида данных: как правильно смешивать источники для обучения воплощённых агентов', 'desc': 'В этой работе авторы анализируют экосистему данных для обучения воплощённых агентов (роботов), организуя различные источники данных в пирамиду: от реальных роботов до синтетических симуляций и общих видео-языковых наборов данных. Они исследуют компромисс между масштабируемостью данных и их релевантностью для конкретных роботов, оценивая качество, разнообразие и физическую достоверность каждого источника. Авторы анализируют недавние фундаментальные модели для роботики через призму их рецептов обучения, связывая состав данных с возникающими способностями в восприятии, рассуждении, планировании и предсказании динамики. Работа выявляет шесть критических вызовов в сборке больших тактильных датасетов, обработке отказов и разработке принципиальных стратегий комбинирования данных для обучения роботов.'}, 'en': {'title': 'Building the Future of Embodied AI with Diverse Data Sources', 'desc': "This paper discusses the development of embodied agents in machine learning, which require specific data that connects observations with physical actions. It introduces a 'pyramid' structure to categorize five types of data sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. The authors analyze how these data sources impact the training of embodied foundation models, focusing on their quality, diversity, and alignment with robotic actions. They also identify six key challenges in advancing embodied systems, such as creating large tactile datasets and improving data collection methods."}, 'zh': {'title': '构建下一代具身智能系统的基础', 'desc': '这篇论文探讨了多模态基础模型如何通过互联网学习视觉和语言。与此不同，具身智能体需要将观察与物理状态和动作结合的数据。作者将具身数据生态系统组织成一个五层金字塔，涵盖真实机器人数据、UMI风格数据、自我中心和外部中心数据、仿真数据以及通用视觉-语言数据。论文还分析了不同数据源在预训练过程中的选择、对齐和混合方式，并讨论了构建下一代具身系统的六个开放挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.21655', 'title': 'Progress Reward Modeling for Robotic Learning: A Comprehensive Survey', 'url': 'https://huggingface.co/papers/2607.21655', 'abstract': 'Abstract  Robotic learning takes place in dynamic environments with large behavior spaces. A terminal success signal only tells the robot whether the task is completed. It does not explain whether the current behavior is making progress, remaining unchanged, or undoing earlier progress. For this reason, recent studies have increasingly explored progress rewards that provide feedback during task execution. However, the current literature lacks a shared framework. Existing methods use different observations, goal specifications, output signals, supervision sources, and evaluation protocols. This makes it difficult to compare them and understand what their results actually validate. In this survey, we provide a unified view of progress reward modeling for robotic learning. We organize the field in three connected steps. We first study the interface of a progress model. This defines the problem from the outside by asking what information the model receives and what form of progress signal it produces. We then move inside the model and study the methods used to construct this signal. This reveals the different assumptions and mechanisms behind progress estimation and reward generation. Finally, we examine the data and benchmarks that support these methods. This shows how progress supervision is obtained and what different evaluations actually measure. Together, these three perspectives connect what a progress model is, how it is built, and how its quality is validated. We further summarize the main limitations of current approaches and discuss future research directions.', 'score': 11, 'issue_id': 2774, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'bb4eac6b2a829c41', 'authors': ['Jianshu Zhang', 'Keliang Wu', 'Haoran Lu', 'Anbang Liu', 'Ce Zhang', 'Weijie Yin', 'Chengxuan Qian', 'Xiyuan Yang', 'Zhenyu Pan', 'Guo Ye', 'Han Liu'], 'affiliations': ['Carnegie Mellon University', 'Northwestern University', 'University of California, Santa Barbara', 'University of Illinois Urbana-Champaign', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.21655.jpg', 'data': {'categories': ['#rl', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Единая структура моделей прогресса для обучения роботов', 'desc': 'Это обзорная статья о прогресс-наградах в робототехническом обучении, которые предоставляют обратную связь во время выполнения задачи, а не только финальный сигнал успеха. Авторы предлагают единую структуру для организации этого направления исследований, разделяя её на три аспекта: интерфейс модели прогресса (какие данные она получает и какой сигнал выдаёт), методы построения этого сигнала (предположения и механизмы оценки прогресса), и данные с бенчмарками для валидации подходов. Такая систематизация помогает сравнивать различные методы и понять, что именно они измеряют в контексте обучения с подкреплением. Авторы выявляют основные ограничения текущих подходов и указывают направления для будущих исследований.'}, 'en': {'title': 'Unifying Progress Rewards for Smarter Robotic Learning', 'desc': "This paper discusses the challenges in robotic learning, particularly in environments where robots must learn from their actions. It highlights the need for progress rewards that provide ongoing feedback about a robot's performance, rather than just a final success signal. The authors propose a unified framework to analyze and compare different methods of progress reward modeling, focusing on the interface, construction, and evaluation of these models. They also identify limitations in current approaches and suggest directions for future research to improve robotic learning."}, 'zh': {'title': '统一进展奖励模型，提升机器人学习效果', 'desc': '本论文探讨了机器人学习中的进展奖励模型，特别是在动态环境和复杂行为空间中的应用。传统的成功信号只能告诉机器人任务是否完成，但无法提供关于行为进展的反馈。我们提出了一个统一的框架，分析了进展模型的接口、构建方法和支持数据，帮助理解不同方法的假设和机制。最后，我们总结了当前方法的局限性，并讨论了未来的研究方向。'}}}, {'id': 'https://huggingface.co/papers/2607.24743', 'title': 'ClinFusion: A Vision-Centric Multimodal LLM System for Holistic Medical Understanding', 'url': 'https://huggingface.co/papers/2607.24743', 'abstract': "Abstract  Multimodal large language models (MLLMs) hold immense potential to revolutionize clinical practice, yet deploying them in the medical domain is fundamentally a vision-centric challenge: models must absorb knowledge from heterogeneous 2D and 3D medical images, and evaluation protocols must align with radiologists' clinical practice and provide an accurate, fine-grained and factualness-driven assessment. In this paper, we introduce ClinFusion, a vision-centric MLLM designed for holistic medical understanding that systematically addresses these limitations. We propose a compositional and cascaded vision encoder architecture featuring a Cascade Spatial-Aware Locality Fusion operator that unifies diverse 2D and native 3D medical image understanding within a fused encoder. We further introduce a vision-grounded evaluation framework, including MedIF-Bench for instruction-following assessment and a region-of-interest-grounded method for clinically aligned and factualness-driven report generation evaluation. We show that ClinFusion sets a new state-of-the-art across a comprehensive suite of 2D and 3D multimodal medical benchmarks---spanning visual question answering, report generation, and instruction following---as well as textual medical tasks, outperforming leading open-source medical MLLMs (e.g., Hulu-Med, Lingshu) on 20 out of 24 benchmarks and demonstrating multimodal capabilities better than powerful proprietary models such as GPT-5.2 and Gemini-3-Flash on 13 out of 16 benchmarks, and can be further augmented with agentic tool use for retrieval-augmented and tool-assisted clinical workflows. A blinded evaluation by board-certified radiologists confirms that ClinFusion produces the highest-ranked reports, and validates our RoI-grounded metric as achieving the strongest correlation with expert judgment among all automatic evaluation metrics examined.", 'score': 2, 'issue_id': 2774, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '54e00d9dac5c5f4e', 'authors': ['Hangjie Yuan', 'Yichen Qian', 'Zhiwei Tang', 'Xianzhe Xu', 'Lirong Wu', 'Sicheng Yang', 'Jinwang Wang', 'Pengju Wang', 'Zhitao Zeng', 'Yizeng Han', 'Yan Xing', 'Shengxuan Luo', 'Tao Feng', 'Qing Xie', 'Weigen Yao', 'Yi Yang', 'Zuozhu Liu', 'Jiasheng Tang', 'Shaocheng Wang', 'Jitao Wang', 'Jiahong Dong', 'Weihua Chen', 'Feng Xu', 'Fan Wang'], 'affiliations': ['Beijing National Research Center for Information Science and Technology, Tsinghua University, Beijing, China', 'College of Computer Science and Technology, Zhejiang University, Hangzhou, China', 'DAMO Academy, Alibaba Group, Beijing, China', 'DAMO Academy, Alibaba Group, Hangzhou, China', 'Department of Computer Science and Technology, Tsinghua University, Beijing, China', 'Department of Radiology, The Affiliated Yangming Hospital of Ningbo University, Yuyao, China', 'Hepato-Pancreato-Biliary Center, Beijing Tsinghua Changgung Hospital, School of Clinical Medicine, Tsinghua Medicine, Tsinghua University, Beijing, China', 'Hupan Laboratory, Hangzhou, China', 'School of Software, Tsinghua University, Beijing, China', 'Zhejiang University-University of Illinois Urbana-Champaign Institute, Zhejiang University, Haining, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24743.jpg', 'data': {'categories': ['#rag', '#multimodal', '#science', '#cv', '#architecture', '#benchmark', '#healthcare', '#agents', '#3d', '#open_source'], 'emoji': '🏥', 'ru': {'title': 'Стратегическое объединение видеопотоков: MLLM для клинической медицины', 'desc': 'В статье представлена ClinFusion — многомодальная большая языковая модель, специально разработанная для клинического анализа медицинских изображений. Авторы предложили инновационную архитектуру видеоэнкодера с оператором Cascade Spatial-Aware Locality Fusion, которая единообразно обрабатывает 2D и 3D медицинские изображения. Введена новая система оценки моделей — MedIF-Bench и метод на основе region-of-interest для клинически обоснованного анализа качества генерируемых отчётов. ClinFusion продемонстрировала лучшие результаты на 20 из 24 медицинских бенчмарков и получила подтверждение от сертифицированных радиологов, что модель генерирует отчёты наивысшего качества.'}, 'en': {'title': 'ClinFusion: Revolutionizing Medical Understanding with Multimodal AI', 'desc': "This paper presents ClinFusion, a multimodal large language model (MLLM) specifically designed for medical applications. It integrates knowledge from both 2D and 3D medical images using a unique compositional and cascaded vision encoder architecture. The model is evaluated through a new framework that aligns with clinical practices, ensuring accurate and factual report generation. ClinFusion outperforms existing medical MLLMs and demonstrates superior multimodal capabilities, validated by expert radiologists' assessments."}, 'zh': {'title': 'ClinFusion：医学领域的视觉中心多模态语言模型', 'desc': '多模态大型语言模型（MLLMs）在临床实践中具有巨大的潜力，但在医学领域的应用面临视觉中心的挑战。本文介绍了ClinFusion，这是一种以视觉为中心的MLLM，旨在全面理解医学，系统解决现有的局限性。我们提出了一种组合和级联的视觉编码器架构，结合了多样的2D和3D医学图像理解。研究表明，ClinFusion在多项医学基准测试中设立了新的最先进水平，超越了许多领先的开源医学模型。'}}}, {'id': 'https://huggingface.co/papers/2607.23822', 'title': 'DriveDNA: A Large-Scale Multimodal Naturalistic Driving Dataset and Benchmark for Driving Style Identification', 'url': 'https://huggingface.co/papers/2607.23822', 'abstract': 'Abstract  Driving style captures stable, driver-specific patterns in how a vehicle is driven. In naturalistic data, however, this signal is hard to isolate because drivers are observed in different vehicles, on different roads, and under different conditions, so models may mistake vehicle- or situation-specific regularities for driver-specific style. We introduce DriveDNA, a large-scale naturalistic dataset and benchmark for personalized driving-style modeling, comprising 4,121 drives from 465 drivers across 115 vehicle models and totaling 975 hours of human-controlled driving at 10 Hz with forward video, collected from community drivers in everyday use. DriveDNA defines driving style as a consistent, driver-specific behavioral pattern in how a vehicle moves under similar conditions. The benchmark evaluates this signal through three core tasks: few-shot driver re-identification, personalized behavior prediction, and condition-matched comparison, and provides behavioral annotations plus 276,248 rule-generated maneuver events across six classes with large-scale human auditing. We evaluate baselines spanning classical descriptors, supervised and self-supervised time-series encoders, multimodal fusion, probabilistic prediction, and zero-shot foundation models under a fixed multi-seed protocol. Learned representations substantially outperform classical descriptors on unseen drivers (AUROC .935 vs. .707) and retain driver-specific information under matched driving conditions, while descriptor performance approaches chance. Video-only models achieve comparable re-identification accuracy but exhibit severe route leakage, showing that strong recognition may arise from contextual shortcuts rather than driving behavior. These findings show that reliable driving-style evaluation must assess both the behavioral value of learned representations and their robustness to vehicle, drive, and condition confounds.', 'score': 0, 'issue_id': 2774, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '61d42bb9ba4d9200', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#multimodal', '#benchmark', '#dataset'], 'emoji': '🚗', 'ru': {'title': 'DriveDNA: Раскрытие истинного стиля вождения через устойчивые к искажениям модели', 'desc': 'Работа представляет DriveDNA — большой датасет для моделирования персонализированного стиля вождения, содержащий 4121 поездку от 465 водителей на 115 типах автомобилей. Исследователи определяют стиль вождения как устойчивый, специфичный для водителя паттерн поведения, и предлагают три основные задачи для его оценки: переидентификацию водителя по малому числу примеров, предсказание поведения и сравнение в сопоставимых условиях. В работе протестированы различные подходы от классических дескрипторов до современных нейросетевых моделей, включая self-supervised кодировщики временных рядов и мультимодальное слияние. Результаты показывают, что глубокие модели значительно превосходят классические методы, но важно проверять их робастность к конфаундирующим факторам, так как видеомодели могут опираться на контекстные признаки вместо подлинного стиля вождения.'}, 'en': {'title': 'DriveDNA: Unraveling Personalized Driving Styles with Data', 'desc': 'This paper presents DriveDNA, a comprehensive dataset designed to analyze personalized driving styles by capturing consistent patterns in how individual drivers operate vehicles. It addresses the challenge of distinguishing driver-specific behaviors from variations caused by different vehicles and driving conditions. The dataset includes extensive driving data from numerous drivers and vehicles, enabling the evaluation of various machine learning models on tasks like driver re-identification and behavior prediction. The results indicate that advanced learned representations significantly outperform traditional methods, highlighting the importance of robust evaluation in driving style analysis.'}, 'zh': {'title': '个性化驾驶风格建模的新基准', 'desc': '本论文介绍了DriveDNA，这是一个大规模的自然驾驶数据集和个性化驾驶风格建模的基准。该数据集包含465名驾驶员在115种车型上进行的4,121次驾驶记录，总计975小时的驾驶数据。DriveDNA定义了驾驶风格为在相似条件下，驾驶员特有的行为模式，并通过几个核心任务来评估这一信号。研究表明，学习到的表示在未见驾驶员的表现上显著优于传统描述符，且在匹配的驾驶条件下保留了驾驶员特有的信息。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (2)', '#agi', '#alignment', '#architecture (1)', '#audio', '#benchmark (4)', '#cv (1)', '#data (1)', '#dataset (2)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (3)', '#open_source (1)', '#optimization', '#plp', '#rag (1)', '#reasoning', '#rl (1)', '#rlhf', '#robotics (2)', '#science (2)', '#security', '#small_models', '#story_generation', '#survey (1)', '#synthetic', '#training', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

                articles = articles.slice(0, 50);

                            <div id="abstract-${index}" class="abstract">

                                <div id="toggle-${index}" class="abstract-toggle">...</div>

                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-28 02:45',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-28 02:45')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-28 02:45')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
