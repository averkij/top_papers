    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.31620', 'title': 'FuseReg: Regularizing Layer Fusion Mitigates the Reconstruction-Generation Gap in Representation Autoencoders', 'url': 'https://huggingface.co/papers/2609.31620', 'abstract': 'Abstract  Representation autoencoders (RAEs) reuse features from a pretrained visual encoder as reconstruction and diffusion latents, integrating strong visual representations into image generation. However, RAEs still need to decide which encoder layers form the shared latent space for the generator and pixel decoder. This choice involves a trade-off. Shallower layers tend to preserve fine pixel details better, while deeper layers tend to yield better generation metrics. A fixed heuristic layer fusion therefore couples two stages that benefit from different information. We introduce FuseReg, which replaces heuristic feature selection with training over random subsets of encoder layers. We theoretically analyze the underlying mechanism: subset sampling explicitly penalizes sensitivity to cross-layer disagreement. On ImageNet-256 with DINOv3-L, a single FuseReg decoder reconstructs from full, sparse, and single-layer fusions without retraining, achieving higher PSNR than decoders specialized to fixed fusions. This flexibility also benefits generation: decoder replacement alone reduces unguided gFID by 27% with an unchanged RAEv2 DiT-XL generator. The same regularization principle extends to diffusion training, with joint regularization of both stages reducing unguided gFID by 29% on DiT-Base. These results show that training downstream models for layer-fusion robustness narrows the reconstruction-generation gap without modifying the pretrained encoder.', 'score': 93, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'a76bb06816e71823', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#architecture', '#optimization', '#diffusion', '#training'], 'emoji': '🔀', 'ru': {'title': 'FuseReg: обучение робастности к выбору слоёв для моста между реконструкцией и генерацией', 'desc': 'В работе предложен метод FuseReg для автокодировщиков представлений (RAE), которые переиспользуют признаки из предобученного визуального энкодера для реконструкции и латентных переменных диффузии. Основная проблема заключается в выборе слоёв энкодера для формирования общего латентного пространства, так как поверхностные слои лучше сохраняют детали пикселей, а глубокие слои обеспечивают лучшие метрики генерации. Авторы предлагают заменить эвристический выбор слоёв на обучение по случайным подмножествам слоёв энкодера, что явно штрафует чувствительность к рассогласованию между слоями. На датасете ImageNet-256 метод достигает высоких показателей PSNR при реконструкции и снижает метрику gFID на 27-29% для генерации без переобучения энкодера.'}, 'en': {'title': 'Enhancing Image Generation with Flexible Layer Fusion', 'desc': 'This paper introduces Representation Autoencoders (RAEs) that enhance image generation by utilizing features from a pretrained visual encoder. The challenge lies in selecting which layers of the encoder to use for creating a shared latent space, balancing between preserving fine details and improving generation quality. The authors propose FuseReg, a method that trains on random subsets of encoder layers instead of relying on fixed heuristics, which helps mitigate issues from layer disagreements. Their experiments demonstrate that FuseReg improves reconstruction quality and generation metrics significantly, showing that robust layer fusion can effectively bridge the gap between reconstruction and generation tasks.'}, 'zh': {'title': '灵活的层融合，提升图像生成质量', 'desc': '本论文介绍了一种新的方法FuseReg，用于改进图像生成中的表示自编码器（RAEs）。该方法通过训练随机选择的编码器层来替代固定的启发式特征选择，从而提高了重建和生成的灵活性。研究表明，FuseReg能够在不重新训练的情况下，显著提高图像重建的质量和生成的效果。通过联合正则化，FuseReg在不同阶段的训练中减少了重建与生成之间的差距，展示了其在图像生成任务中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.18703', 'title': 'RayOrch: Programming and Executing Lineage-Controlled Multi-Grain Dataflows for Foundation-Model Data Preparation', 'url': 'https://huggingface.co/papers/2609.18703', 'abstract': 'Abstract  Preparing high quality training data for foundation models requires scalable pipelines that transform heterogeneous documents and videos into structured records. Such pipelines expand each parent item into an ordered and input dependent sequence of children, whose counts may be long tailed. GPUs should batch children across parents while preserving parent relationships, child order, completion status, and result routing. Existing systems either hide parallelism behind coarse grained jobs or expose flat records that force applications to manage lineage and regrouping. We present RayOrch, a programming model and distributed execution engine that preserves parent child relations throughout execution. Programs declare ordered variable cardinality expansions and matching gathers. The compiler validates each pair, while the runtime records child membership, immediate parents, immutable ordinals, and terminal states. Per Call FIFO Ready Queues batch ready children across parents. Gathers reconstruct results from declared membership and ordinals rather than batch boundaries or completion order. Parents can advance as soon as all required children become terminal. Typed parent scoped failures suppress undispatched siblings of the failed parent while allowing unrelated parents to continue. On NVIDIA H20 GPUs, RayOrch achieves 15.14 times speedup when scaling MinerU from 4 to 64 GPUs and 7.82 times speedup when scaling a video pipeline from 8 to 64 GPUs. It reduces end to end time by 13.1 percent versus Ray Data and 29.0 percent versus Daft on MinerU, and by 16.0 percent versus Ray Data on Docling. Code available at https://github.com/OpenDCAI/RayOrch .', 'score': 37, 'issue_id': 3345, 'pub_date': '2026-09-16', 'pub_date_card': {'ru': '16 сентября', 'en': 'September 16', 'zh': '9月16日'}, 'hash': 'cd3bc0f3920b85a4', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Эффективная обработка иерархических данных для обучения моделей с помощью RayOrch', 'desc': 'В статье представлена RayOrch — система для подготовки высокого качества обучающих данных для foundational models, которая обрабатывает гетерогенные документы и видео в структурированные записи. Система использует модель программирования с сохранением связей между родительскими и дочерними элементами, позволяя масштабируемо расширять каждый элемент в упорядоченную последовательность потомков с переменной мощностью. Компилятор валидирует операции расширения и сбора результатов, а runtime отслеживает принадлежность дочерних элементов, их порядок и статусы завершения для корректной маршрутизации. На GPU NVIDIA H20 RayOrch демонстрирует значительные ускорения — 15.14× при масштабировании MinerU с 4 до 64 GPU и сокращает общее время обработки на 13-29% по сравнению с существующими системами.'}, 'en': {'title': 'Efficient Data Processing with RayOrch: Scaling Training Pipelines', 'desc': "This paper introduces RayOrch, a new programming model and distributed execution engine designed to efficiently manage the preparation of high-quality training data for foundation models. It focuses on maintaining the relationships between parent and child data items while processing them in parallel, which is crucial for handling complex data structures like documents and videos. RayOrch utilizes a unique batching system that allows for the dynamic management of child items based on their completion status and relationships to their parent items. The results show significant performance improvements on NVIDIA H20 GPUs, demonstrating RayOrch's effectiveness in scaling data processing tasks."}, 'zh': {'title': 'RayOrch：高效处理训练数据的解决方案', 'desc': '本论文介绍了一种名为RayOrch的编程模型和分布式执行引擎，旨在为基础模型准备高质量的训练数据。RayOrch能够在执行过程中保持父子关系，支持有序的变量基数扩展和匹配收集。该系统在NVIDIA H20 GPU上实现了显著的加速效果，尤其是在处理视频管道时。通过优化数据处理流程，RayOrch有效减少了端到端的处理时间，提升了整体性能。'}}}, {'id': 'https://huggingface.co/papers/2609.31394', 'title': 'InternW0-Δ: A World Action Model Bridging Predictive Dynamics and Actions with 20K+ Hours of Open Data', 'url': 'https://huggingface.co/papers/2609.31394', 'abstract': 'Abstract  World Action Models (WAMs) jointly model visual dynamics and action generation for generalist robot manipulation. A central challenge is to integrate priors from large-scale pretrained models---including visual dynamics, scene semantics, geometry, and motion---into a unified framework for robot action generation. We introduce InternW0-Δ, a unified WAM pretrained on a heterogeneous corpus that outperforms prior methods across simulation benchmarks and real-robot platforms.   InternW0-Δ combines pretrained visual dynamics, scene-level semantics, 4D geometric and motion priors, and action generation within a Mixture-of-Transformers (MoT) framework. A pretrained video expert and an action expert interact under semantic guidance from a frozen VLM, while a pretrained 4D foundation model injects geometric and motion priors through training-only distillation. We further introduce Causal Imprint, which learns future-relevant scene changes from training-only future supervision and provides predictive representations directly to the action expert without future-video rollout at inference.   For large-scale joint training, we construct a heterogeneous corpus of robot demonstrations, UMI data, egocentric human demonstrations, and Ego2Robot data, curated and aligned under a common state-action representation. The resulting corpus contains over 20K hours of processed training data, to our knowledge the largest open-source corpus of its kind. We pretrain InternW0-Δ on this corpus and demonstrate strong performance across simulation benchmarks and real-robot platforms. We will open source the training code, model weights, infrastructure, data-processing pipeline, and processed data where licenses permit. Project page: https://internrobotics.github.io/InternW0-Delta/', 'score': 17, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'bda37519edbba0ad', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#multimodal', '#architecture', '#robotics', '#video', '#training'], 'emoji': '🤖', 'ru': {'title': 'Единая предварительно обученная модель для универсальной робототехнической манипуляции через интеграцию множественных приоров', 'desc': 'В работе представлен InternW0-Δ — объединённая World Action Model, которая совместно моделирует визуальную динамику и генерацию действий для манипуляции роботом. Модель интегрирует предварительно обученные компоненты (визуальную динамику, семантику сцены, геометрические и кинематические приоры) в единый архитектурный каркас на основе Mixture-of-Transformers. Авторы предложили метод Causal Imprint для обучения предсказательных представлений будущих изменений сцены, что позволяет избежать развёртывания видео во время инференса. Модель обучена на гетерогенном корпусе из 20K часов роботизированных и человеческих демонстраций и показывает превосходные результаты как в симуляционных бенчмарках, так и на реальных робото-платформах.'}, 'en': {'title': 'Unified Action Models for Enhanced Robot Manipulation', 'desc': 'The paper presents World Action Models (WAMs) that integrate visual dynamics and action generation for robots. It introduces InternW0-Δ, a unified model that leverages large-scale pretrained data to enhance robot manipulation capabilities. The model combines various priors, including visual dynamics and geometric information, within a Mixture-of-Transformers framework. Additionally, it employs a novel technique called Causal Imprint to improve predictive representations for action generation without needing future video rollouts during inference.'}, 'zh': {'title': '统一的世界动作模型，提升机器人操作能力', 'desc': '本文介绍了世界动作模型（WAMs），它们用于联合建模视觉动态和机器人操作的动作生成。研究的核心挑战是将大规模预训练模型的先验知识整合到一个统一的框架中，以便生成机器人动作。我们提出了InternW0-Δ，这是一种在异构语料库上预训练的统一WAM，能够在模拟基准和真实机器人平台上超越以往的方法。该模型结合了预训练的视觉动态、场景语义、4D几何和运动先验，并在Mixture-of-Transformers框架内进行动作生成。'}}}, {'id': 'https://huggingface.co/papers/2609.31093', 'title': 'Block Sparse Attention with Log-Linear Complexity', 'url': 'https://huggingface.co/papers/2609.31093', 'abstract': 'Abstract  Scaling language models to long contexts is limited by the quadratic cost of self-attention. Block sparse attention offers an efficient alternative, but selecting the retained blocks remains a bottleneck. Conventional block selection requires scoring all query-block pairs and therefore remains quadratic in sequence length. To address this issue, we propose PISA, a block-sparse attention mechanism that employs a pyramid Top-K selection strategy. The main idea is to gradually narrow down the candidates across different levels, making it more efficient to find the most relevant keys. Specifically, we construct a coarse-to-fine hierarchy of keys and perform selection from the coarsest level. At each level, LogSumExp scoring is applied to a bounded candidate set to select candidates for the next finer level, continuing until the finest level is reached. Through pooling, we construct O(log N) levels of keys, yielding an overall complexity of O(Nlog N), where N denotes the sequence length. We develop hardware-aware Triton kernels for both training and inference, fusing hierarchical routing and LogSumExp scoring without materializing the query-key score matrix. We further evaluate our method on language modeling tasks. Compared with the baseline, our method achieves comparable performance on benchmarks such as commonsense reasoning while delivering better results on retrieval tasks.', 'score': 14, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '49221d0597d578b7', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#long_context', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Иерархический отбор для эффективного внимания на длинных последовательностях', 'desc': 'В статье предложен PISA — механизм блочно-разреженного внимания для эффективной обработки длинных последовательностей в больших языковых моделях. Авторы решают проблему квадратичной сложности стандартного self-attention, используя пирамидальную стратегию Top-K отбора блоков ключей. Алгоритм строит иерархию ключей от грубого к точному уровню и на каждом этапе применяет LogSumExp для отбора кандидатов следующего уровня, достигая сложности O(N log N). Разработаны оптимизированные ядра на Triton для обучения и инференса, результаты показывают сравнимую производительность с базовыми методами на бенчмарках рассуждений и улучшения на задачах поиска.'}, 'en': {'title': 'Efficient Attention with PISA: Scaling Language Models Smartly', 'desc': 'This paper introduces PISA, a new block-sparse attention mechanism designed to improve the efficiency of language models when handling long contexts. Traditional methods for selecting relevant blocks of attention are limited by their quadratic complexity, which becomes impractical for longer sequences. PISA employs a pyramid Top-K selection strategy that narrows down candidates through multiple levels, significantly reducing the computational cost to O(N log N). The authors demonstrate that PISA not only maintains performance on standard benchmarks but also excels in retrieval tasks, showcasing its effectiveness in real-world applications.'}, 'zh': {'title': '高效的块稀疏注意力机制PISA', 'desc': '本文提出了一种新的块稀疏注意力机制PISA，旨在提高长文本上下文的处理效率。传统的块选择方法在序列长度上仍然是二次复杂度，而PISA通过金字塔Top-K选择策略逐步缩小候选块，提高了选择效率。该方法构建了一个粗到细的键层次结构，并在每个层次上应用LogSumExp评分，从而实现了O(Nlog N)的整体复杂度。实验结果表明，PISA在语言建模任务中表现出色，尤其在检索任务上优于基线方法。'}}}, {'id': 'https://huggingface.co/papers/2609.25716', 'title': 'FoMo: Forking Moment in Generative Trajectory as a Perceptual Distance', 'url': 'https://huggingface.co/papers/2609.25716', 'abstract': 'Abstract  Reference-based image quality assessment (IQA) metrics aim to reflect how humans perceive the perceptual distance between a pair of images. To learn how the human visual system (HVS) operates, recent reference-based IQA metrics heavily rely on human-annotated data. Mean opinion score (MOS)-based pointwise scoring, which assigns a scalar quality value per image, is preferable for annotation but is prohibitively expensive to collect at scale and is known to be noisy due to inconsistent human judgments. As an alternative, two-alternative forced choice (2AFC) pairwise labels have gained popularity due to their reliability and efficiency, but they capture only relative comparisons between pairs. In this paper, we propose a fully automated data generation pipeline that generates pointwise perceptual distance labels between image pairs without any human annotation. Our approach exploits the generative dynamics of diffusion models as a perceptual distance proxy, where the coarse structure of an image is generated in the early timesteps and the fine details are generated in the later timesteps. Images that fork early in the generation process share only coarse structure and are perceptually far apart; images that fork late differ only in fine detail. We demonstrate that the diffusion trajectory aligns well with the human visual system, and use this forking moment, FoMo, as a reference-grounded distance label to supervise the training of a reference-based IQA metric. The pointwise labels, which support universal comparison between arbitrary image pairs, enable an information-rich training objective. Extensive experiments across diverse backbone architectures confirm the effectiveness of our generation pipeline, outperforming human-annotated datasets in multiple benchmarks.', 'score': 7, 'issue_id': 3345, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '32b2e23b4c6ec477', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#synthetic', '#diffusion', '#dataset', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Диффузионные модели как учителя для оценки качества изображений', 'desc': 'Статья предлагает автоматический метод создания разметки для метрик оценки качества изображений (IQA), основанный на диффузионных моделях. Авторы используют момент "ветвления" в процессе генерации диффузионной модели как прокси для перцептивного расстояния между изображениями: ранние шаги генерации содержат грубую структуру, а поздние - тонкие детали. Этот подход позволяет автоматически генерировать поточечные метки расстояния без участия человека, избегая проблем с шумом и дороговизной ручной аннотации. Эксперименты показывают, что предложенный метод превосходит человеческую разметку на различных бенчмарках и архитектурах.'}, 'en': {'title': 'Automating Image Quality Assessment with Diffusion Models', 'desc': 'This paper introduces a new method for assessing image quality by generating pointwise perceptual distance labels without human input. It leverages diffusion models to simulate how images evolve over time, allowing for the identification of perceptual differences based on when images diverge in their generation process. The proposed approach, called FoMo, uses these generated labels to train a reference-based image quality assessment metric more effectively than traditional human-annotated methods. The results show that this automated pipeline can outperform existing datasets that rely on human judgments, providing a more reliable and scalable solution for image quality evaluation.'}, 'zh': {'title': '自动生成图像质量评估标签的新方法', 'desc': '本文提出了一种全自动的数据生成管道，用于生成图像对之间的点状感知距离标签，而无需人工注释。我们利用扩散模型的生成动态，早期生成图像的粗略结构，后期生成细节，从而捕捉图像之间的感知差异。通过这种方法，我们能够生成可靠的参考基础距离标签，来监督参考图像质量评估指标的训练。实验结果表明，我们的方法在多个基准测试中超越了人工注释的数据集，证明了其有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.31199', 'title': 'Enhancing Photogrammetric Digital Surface Models with Pretrained Diffusion Models and Multimodal Conditioning', 'url': 'https://huggingface.co/papers/2609.31199', 'abstract': 'Abstract  Large-scale Digital Surface Models (DSMs) can be produced cost-effectively from satellite images via stereo-photogrammetry. However, the resulting 3D maps are often contaminated by noise, outliers, and voids. On the other hand, aerial LiDAR provides high-accuracy elevation measurements at a substantially higher cost. In this work, we study diffusion models conditioned both on photogrammetric DSMs and Pléiades imagery to refine vertically co-registered DSMs. We introduce a modified Stable Diffusion 3 architecture with a pruned text stream and a patch-wise normalization strategy, enabling stable training on LiDAR data and transfer from natural images to elevation maps. Experiments in French cities demonstrate that multimodal conditioning improves elevation accuracy, reducing Dense Urban RMSE from 6.00 to 3.45 m in the in-context cities and from 4.16 to 2.77 m in the held-out city of Bordeaux.', 'score': 6, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'b298ea8746e50770', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#architecture', '#inference', '#3d', '#training', '#multimodal'], 'emoji': '🛰️', 'ru': {'title': 'Диффузионные модели для рафинирования спутниковых цифровых моделей рельефа', 'desc': 'В работе предложен метод улучшения цифровых моделей рельефа, полученных из спутниковых снимков через стерео-фотограмметрию, с использованием условных диффузионных моделей. Авторы адаптировали архитектуру Stable Diffusion 3, добавив многомодальное кондиционирование на основе фотограмметрических данных и изображений со спутника Pléiades, а также внедрили нормализацию по патчам для стабильного обучения. Модель обучалась на высокоточных измерениях лидара и демонстрирует успешный перенос знаний с естественных изображений на карты высот. Эксперименты во французских городах показали значительное снижение ошибки RMSE с 6.00 до 3.45 м на обучающих городах и с 4.16 до 2.77 м на тестовом городе Бордо.'}, 'en': {'title': 'Enhancing DSM Accuracy with Diffusion Models', 'desc': 'This paper presents a method to enhance the accuracy of Digital Surface Models (DSMs) created from satellite images by using diffusion models. The authors address the common issues of noise and inaccuracies in DSMs by integrating high-quality LiDAR data with photogrammetric DSMs and Pléiades imagery. They propose a modified Stable Diffusion 3 architecture that incorporates a pruned text stream and patch-wise normalization, allowing for effective training on LiDAR data. The results show significant improvements in elevation accuracy, particularly in urban areas, demonstrating the effectiveness of multimodal conditioning in refining DSMs.'}, 'zh': {'title': '多模态条件提升高程测量精度', 'desc': '本研究探讨了如何利用立体摄影测量生成的大规模数字表面模型（DSM）来改进高程测量。我们提出了一种改进的稳定扩散模型架构，结合了光学影像和激光雷达数据，以提高DSM的精度。通过多模态条件的训练，我们在法国城市的实验中显著降低了高程误差。结果表明，结合不同数据源可以有效提升城市地区的高程测量准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.30216', 'title': "Jev in the Wild: A Data-Driven Analysis of the Jev Model's Functionality, Applications and Ecosystem", 'url': 'https://huggingface.co/papers/2609.30216', 'abstract': "Abstract  Jev is a fast, low-cost decision model that answers natural-language questions with choices, binary judgments, and scores. As its public ecosystem grows rapidly, it remains unclear how Jev is used across applications and how public attention relates to project distribution. To answer these questions, we conduct a large-scale, data-driven analysis of 2,170 publicly available Jev projects collected from GitHub as of September 22, 2026. We find rapid early growth in Jev's public ecosystem, with both new projects and integration into existing repositories. Across diverse domains, projects use Jev for multiple decision purposes and combine its interfaces. Attribute judgment and scoring are widely used, while the use of action selection, content filtering, and model and tool selection varies across domains. These patterns suggest that Jev serves as a reusable decision component whose functionality varies with the surrounding workflow. Meanwhile, public attention is concentrated in routing and interface agents and does not track project counts. Our findings provide a quantitative view of Jev's emerging ecosystem and inform the design and evaluation of general-purpose decision models across diverse application contexts.", 'score': 5, 'issue_id': 3345, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'aa4140bf691dc2f0', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Jev как универсальный компонент для принятия решений в разнообразных приложениях', 'desc': 'В статье анализируется экосистема Jev — быстрой и эффективной модели принятия решений, которая обрабатывает естественный язык и выдает выбор, бинарные суждения и оценки. Исследователи провели масштабный анализ 2170 публичных проектов на GitHub, чтобы понять, как Jev используется в различных приложениях. Выявлено, что проекты применяют Jev для разных целей: оценки атрибутов и скоринга наиболее популярны, а отбор действий и фильтрация контента варьируются в зависимости от домена. Jev функционирует как переиспользуемый компонент принятия решений, и полученные результаты помогают улучшить проектирование универсальных моделей для разнообразных применений.'}, 'en': {'title': 'Jev: A Versatile Decision-Making Model for Diverse Applications', 'desc': "The paper presents Jev, a decision-making model that efficiently processes natural-language questions to provide choices, binary judgments, and scores. It analyzes 2,170 Jev projects from GitHub to understand its application and public interest. The study reveals that Jev is rapidly growing, with diverse uses across various domains, particularly in attribute judgment and scoring. The findings highlight Jev's role as a versatile decision-making tool, while also noting that public attention does not correlate with the number of projects."}, 'zh': {'title': 'Jev：快速决策模型的崛起', 'desc': 'Jev是一种快速、低成本的决策模型，可以用来回答自然语言问题，包括选择、二元判断和评分。我们对2170个公开的Jev项目进行了大规模的数据驱动分析，发现Jev的公共生态系统正在快速增长，新的项目不断涌现并与现有代码库整合。Jev在多个领域被广泛应用于决策目的，尤其是在属性判断和评分方面，而在行动选择、内容过滤和模型选择的使用上则因领域而异。这些发现为Jev的生态系统提供了定量视角，并为通用决策模型的设计和评估提供了参考。'}}}, {'id': 'https://huggingface.co/papers/2609.30222', 'title': 'TrackEverything: Long Horizon Dense Tracking via De-Duplicating 3D Scene Representations', 'url': 'https://huggingface.co/papers/2609.30222', 'abstract': "Abstract  Existing point tracking models face a fundamental tradeoff: they can either track a sparse set of query points over long horizons, or track all points across only short clips. We introduce TrackEverything, a 3D point tracker that breaks this trade-off by representing videos as persistent 3D scene tracks in world coordinates. Grounded in the insight that videos are 2D projections of an underlying 3D world, TrackEverything decouples model complexity from video duration, allowing it to scale with unique physical scene geometry instead. Our approach introduces three key innovations. First, we employ a voxelization-based de-duplication mechanism at sliding-window boundaries to merge co-located tracks, preventing repeated observations of the same surface from redundantly accumulating. Second, we decompose tracking into an endpoint refiner that predicts each point's destination and static-versus-dynamic classification, followed by a lightweight trajectory refiner that decodes dense trajectories exclusively for dynamic points. Third, we propose 3D WAFT, replacing memory-prohibitive 4D correlation volumes with efficient feature sampling in the scene cloud. To the best of our knowledge, TrackEverything is the first 3D tracker capable of tracking all visible points across videos exceeding 1000 frames within 40 GB of GPU memory. On TAPVid-3D, TrackEverything outperforms all open-source all-frame dense 3D trackers by more than 20% APD on short clips, while remaining competitive with state-of-the-art sparse trackers on long sequences, despite tracking far more points.", 'score': 5, 'issue_id': 3345, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '6a3131eb0f5d83b5', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#3d', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Отслеживание каждой точки в видео благодаря 3D геометрии сцены', 'desc': 'TrackEverything предлагает новый подход к отслеживанию точек в видео, представляя видео как постоянные 3D треки сцены в мировых координатах вместо традиционного выбора между отслеживанием разреженного набора точек на длительных видео или всех точек на коротких клипах. Модель использует три ключевых инновации: механизм дедупликации на основе вокселизации для слияния совпадающих треков, декомпозицию отслеживания на предсказание конечных точек и классификацию статичных/динамичных объектов, а также 3D WAFT для эффективной выборки признаков вместо громоздких 4D корреляционных объёмов. Благодаря представлению видео как 2D проекций 3D мира, сложность модели зависит от геометрии сцены, а не от длительности видео. TrackEverything первый 3D трекер, способный отслеживать все видимые точки в видео длиной более 1000 кадров при использовании всего 40 ГБ памяти GPU, значительно превосходя конкурирующие подходы на коротких клипах.'}, 'en': {'title': 'Track Everything: Unifying Long and Short Video Tracking in 3D', 'desc': 'The paper presents TrackEverything, a novel 3D point tracking model that overcomes the limitations of existing models by enabling the tracking of all visible points in long video sequences. It achieves this by representing videos as persistent 3D scene tracks, which allows the model to scale with the unique geometry of the scene rather than the duration of the video. Key innovations include a voxelization-based mechanism to merge overlapping tracks, a two-step tracking process that refines point destinations and classifies points as static or dynamic, and a new 3D WAFT method that efficiently samples features without the need for large memory volumes. TrackEverything demonstrates superior performance on the TAPVid-3D dataset, significantly improving tracking accuracy while managing memory usage effectively.'}, 'zh': {'title': '打破跟踪限制，TrackEverything！', 'desc': '现有的点跟踪模型面临一个基本的权衡：要么在长时间内跟踪稀疏的查询点，要么在短片段中跟踪所有点。我们提出了TrackEverything，这是一种3D点跟踪器，通过将视频表示为世界坐标中的持久3D场景轨迹，打破了这一权衡。该方法的创新之处在于，它采用了体素化去重机制、跟踪分解为端点细化和轻量级轨迹细化，以及3D WAFT来提高效率。TrackEverything是首个能够在40GB GPU内存下跟踪超过1000帧视频中所有可见点的3D跟踪器。'}}}, {'id': 'https://huggingface.co/papers/2609.29050', 'title': 'SLCA-GRPO: Resolving Cross-Segment Credit Misattribution in Tool-Calling RL', 'url': 'https://huggingface.co/papers/2609.29050', 'abstract': 'Abstract  Tool-calling agents produce heterogeneous outputs, interleaving structured tool invocations with user-facing natural language summaries. This output heterogeneity presents a structural failure mode in standard on-policy Reinforcement Learning (RL): algorithms like GRPO indiscriminately broadcast a homogeneous trajectory-level scalar advantage to all tokens. Consequently, gradient noise from summary generation leaks into tool-decision tokens, causing cross-segment credit misattribution and brittle optimization. In this work, we propose SLCA-GRPO, a framework incorporating Segment-Locked Credit Assignment (SLCA). To enable scalable exploration without costly real APIs and stable training, we first construct the Schema-Guided LLM Simulator (SGLS) as foundational training infrastructure. Building on this, SLCA decouples advantage estimation at the structural segment level within a single group of rollouts, without requiring additional rollouts from intermediate states. Supported by Hierarchical Rewards (HierR), SLCA routes execution advantages to tool tokens and preference advantages to summary tokens, eliminating advantage contamination (the dominant cross-segment credit misattribution channel) within each policy update. On a 7B backbone, SLCA-GRPO accelerates convergence and outperforms standard GRPO, ToolPO, and RLTR by +2.53 pp on in-domain evaluation, +1.36 pp on the Berkeley Function-Calling Leaderboard (BFCL), and +9.15 pp on τ^2-Bench under the same training budgets, achieving higher accuracy with reduced tool redundancy and costs.', 'score': 5, 'issue_id': 3344, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'bca2cd56a6980dd6', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#agents', '#training'], 'emoji': '🔧', 'ru': {'title': 'Правильное распределение градиентов в многозадачных языковых агентах', 'desc': 'В работе предложен метод SLCA-GRPO для обучения агентов, которые одновременно генерируют структурированные вызовы инструментов и естественноязычные ответы. Основная проблема заключается в том, что стандартные алгоритмы RL типа GRPO неправильно распределяют градиенты между разными типами токенов, что приводит к неправильной оценке вклада каждого токена в результат. Авторы вводят Segment-Locked Credit Assignment (SLCA), которая отдельно оценивает значение (advantage) для токенов инструментов и резюме, используя иерархические награды. Кроме того, они создают Schema-Guided LLM Simulator для стабильного обучения без использования дорогостоящих API, что позволяет достичь лучших результатов и ускорить сходимость алгоритма.'}, 'en': {'title': 'Enhancing Tool-Calling Agents with SLCA-GRPO for Better RL Performance', 'desc': 'This paper addresses the challenges faced by tool-calling agents in Reinforcement Learning (RL) due to the mixed outputs of structured tool calls and natural language summaries. The authors introduce SLCA-GRPO, a new framework that uses Segment-Locked Credit Assignment (SLCA) to improve the credit assignment process during training. By utilizing the Schema-Guided LLM Simulator (SGLS), SLCA allows for better advantage estimation at the segment level, which helps to prevent gradient noise from affecting tool decision-making. The results show that SLCA-GRPO significantly enhances performance and convergence speed compared to existing methods, leading to improved accuracy and reduced costs in tool usage.'}, 'zh': {'title': '提升工具调用代理的优化效率', 'desc': '本文提出了一种新的框架SLCA-GRPO，旨在解决工具调用代理在生成输出时的异质性问题。传统的强化学习算法在处理这些异质输出时，容易导致梯度噪声和信用错误归因，从而影响优化效果。SLCA通过在结构段级别解耦优势估计，避免了不同输出之间的优势污染，提高了训练的稳定性和效率。实验结果表明，SLCA-GRPO在多个评估指标上均优于传统方法，显示出更高的准确性和更低的工具冗余。'}}}, {'id': 'https://huggingface.co/papers/2601.06352', 'title': 'CARD: Cluster-level Adaptation with Reward-guided Decoding for Personalized Text Generation', 'url': 'https://huggingface.co/papers/2601.06352', 'abstract': 'Abstract  Adapting large language models to individual users remains challenging due to the tension between fine-grained personalization and scalable deployment. We present CARD, a hierarchical framework that achieves effective personalization through progressive refinement. CARD first clusters users according to shared stylistic patterns and learns group-specific LoRA adapters, enabling robust generalization and strong low-resource performance. To capture individual differences within each cluster, we propose an implicit preference learning mechanism that contrasts user-authored text with cluster-level generations, allowing the model to infer user-specific style preferences without manual annotation. At inference time, CARD injects personalization exclusively at decoding via lightweight user preference vectors and low-rank logit corrections, while keeping the base model frozen. Experiments on the LaMP and LongLaMP benchmarks show that CARD achieves superior generation quality compared to baselines, while significantly improving efficiency and scalability for practical personalized text generation.', 'score': 4, 'issue_id': 3345, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': 'aef8dcdba99caaf3', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#multimodal', '#benchmark'], 'emoji': '👤', 'ru': {'title': 'Эффективная персонализация LLM через иерархическую кластеризацию и неявное обучение стиля', 'desc': 'В статье предлагается CARD — иерархическая система для адаптации больших языковых моделей к индивидуальным пользователям. Система сначала группирует пользователей по схожим стилистическим паттернам и обучает групповые LoRA адаптеры, что обеспечивает хорошую обобщаемость и эффективность при малом объёме данных. Для захвата индивидуальных различий предложен механизм неявного обучения предпочтений, который сравнивает текст пользователя с поколениями на уровне кластера, позволяя модели инфере стиль без ручной разметки. При инференсе персонализация добавляется только на этапе декодирования через векторы предпочтений и низкорассовые коррекции логитов, что позволяет масштабировать решение.'}, 'en': {'title': 'Personalized Language Models Made Efficient with CARD', 'desc': 'The paper introduces CARD, a framework designed to personalize large language models for individual users while maintaining scalability. It clusters users based on similar stylistic patterns and employs group-specific LoRA adapters to enhance performance with limited resources. To address individual preferences, CARD uses an implicit learning mechanism that differentiates user-generated text from cluster outputs, allowing the model to adapt to unique styles without needing manual input. During text generation, CARD applies user-specific adjustments at the decoding stage, ensuring efficient and high-quality personalized outputs.'}, 'zh': {'title': '个性化文本生成的新突破：CARD框架', 'desc': '本文提出了一种名为CARD的层次框架，旨在解决大型语言模型在个性化与可扩展性之间的矛盾。CARD通过逐步细化的方式实现有效的个性化，首先根据用户的风格模式进行聚类，并学习特定于群体的LoRA适配器。为了捕捉每个聚类内的个体差异，CARD引入了一种隐式偏好学习机制，通过对比用户创作的文本与群体生成的文本，推断用户特定的风格偏好。实验结果表明，CARD在生成质量上优于基线模型，同时显著提高了个性化文本生成的效率和可扩展性。'}}}, {'id': 'https://huggingface.co/papers/2609.31590', 'title': 'AgentWorld: Benchmarking Long-Horizon Collaboration of Multi-agent LLMs', 'url': 'https://huggingface.co/papers/2609.31590', 'abstract': "Abstract  Existing multi-agent benchmarks primarily test in competitive settings, short-horizon interactions under 20 steps, or simply aggregate individual performance, failing to isolate and highlight genuine collaboration capabilities of LLM-based agents. We introduce AgentWorld, a benchmark of 100 human-annotated tasks (with 100 augmented variants) for evaluating long-horizon, multi-agent collaboration. Tasks span 50+ interaction rounds across a rich MMORPG sandbox and require 3-20 agents with asymmetric roles and abilities to coordinate through communication, joint planning, and resource sharing under a blackbox setting where each agent acts independently without access to others' internal states. To quantify collaboration effectiveness in addition to conventional binary task success, we propose Causal Collaboration Effectiveness (CCE), a graph-based metric that traces causal dependencies between agent actions and measures what fraction of a team's effort actually contributed to the outcome. Experiments with Gemini 3 Flash, Claude Haiku 4.5, GPT-5 Mini, and DeepSeek R1-70B show that even the best model achieves only 52.0% task success, with systematic failure modes including communication breakdowns, role confusion, and inability to maintain shared plans across rounds. AgentWorld is fully open-source.", 'score': 4, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '40d41ad9a2aadf85', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'Измерение истинной кооперации в многоагентных системах через причинные связи действий', 'desc': 'В статье представлен AgentWorld — бенчмарк из 100 аннотированных человеком задач для оценки способности LLM-агентов к долгосрочной многоагентной кооперации. Задачи требуют координации от 3 до 20 агентов с асимметричными ролями в MMORPG-окружении через общение, совместное планирование и обмен ресурсами на протяжении более 50 взаимодействий. Авторы предлагают метрику Causal Collaboration Effectiveness (CCE), которая граф-ориентированным методом измеряет, какая доля усилий команды фактически способствовала достижению результата. Эксперименты показали, что даже лучшие современные модели (Gemini 3 Flash, Claude Haiku 4.5, GPT-5 Mini, DeepSeek R1-70B) достигают только 52% успеха, выявляя критические проблемы в коммуникации агентов и поддержании общих планов.'}, 'en': {'title': 'AgentWorld: Evaluating True Collaboration in Multi-Agent Systems', 'desc': 'This paper presents AgentWorld, a new benchmark designed to evaluate the collaborative abilities of large language model (LLM) agents in multi-agent settings. Unlike previous benchmarks, AgentWorld focuses on long-horizon tasks that require agents to work together over many interactions, emphasizing communication, joint planning, and resource sharing. The authors introduce a novel metric called Causal Collaboration Effectiveness (CCE) to measure how effectively agents collaborate, beyond just task success rates. Experiments reveal that even advanced models struggle with collaboration, highlighting challenges such as communication failures and role confusion.'}, 'zh': {'title': '评估多智能体协作的新基准：AgentWorld', 'desc': '现有的多智能体基准主要测试竞争环境、短期互动或简单汇总个体表现，未能有效评估基于大语言模型的智能体的真正协作能力。我们提出了AgentWorld，这是一个包含100个人工标注任务（及其100个增强变体）的基准，用于评估长期的多智能体协作。任务涉及50多个互动回合，要求3到20个具有不对称角色和能力的智能体通过沟通、联合规划和资源共享进行协调。为了量化协作效果，我们提出了因果协作有效性（CCE），这是一种基于图的度量，追踪智能体行动之间的因果依赖关系，并衡量团队努力中有多少实际贡献于结果。'}}}, {'id': 'https://huggingface.co/papers/2609.31473', 'title': 'Game Arena: Strategic LLM Evaluation in Competitive Environments', 'url': 'https://huggingface.co/papers/2609.31473', 'abstract': "Abstract  We introduce Kaggle Game Arena, an open and ever-expanding platform to evaluate large language models (LLMs) through competitive games. Different from static benchmarks, game arena enables models to play head-to-head matchups in structured environments where the gameplay strength naturally increases as models evolve, preventing performance saturation. This technical report details the infrastructure behind Game Arena and describes the three pilot game environments: Chess, Poker, and Werewolf. These environments span perfect information, imperfect information, and multiplayer game settings, enabling a systematic study of models' strategic planning, adaptation, and robustness under uncertainty. For each game, we provide a detailed description of the environment, evaluation metrics, and results from running full competitions across models. Through robust infrastructure and large-scale ground-truth based evaluation, Game Arena ensures reproducibility, transparency and generalizability to new games and variants over time.", 'score': 4, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '6fbf8a8214f7c1fe', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎮', 'ru': {'title': 'Играем и учимся: оценка LLM через игры', 'desc': 'Kaggle Game Arena — это платформа для оценки LLM через соревновательные игры. В отличие от статических тестов, здесь модели играют друг против друга, что позволяет избежать насыщения производительности. В отчёте описываются три пилотные игры: шахматы, покер и мафия, которые помогают изучать стратегическое планирование и адаптацию моделей. Платформа обеспечивает воспроизводимость и прозрачность результатов, а также возможность добавления новых игр.'}, 'en': {'title': 'Kaggle Game Arena: Leveling Up Language Models Through Competition', 'desc': "The paper presents Kaggle Game Arena, a platform designed to assess large language models (LLMs) through competitive gameplay. Unlike traditional benchmarks, this arena allows models to compete against each other in dynamic environments, which helps to measure their performance as they improve. The report outlines the technical framework of the Game Arena and introduces three initial game environments: Chess, Poker, and Werewolf, each representing different types of information and player interactions. By providing structured evaluations and metrics, the platform aims to enhance the understanding of models' strategic capabilities and adaptability in uncertain scenarios."}, 'zh': {'title': 'Kaggle游戏竞技场：评估语言模型的新平台', 'desc': '我们介绍了Kaggle游戏竞技场，这是一个开放且不断扩展的平台，用于通过竞争游戏评估大型语言模型（LLMs）。与静态基准测试不同，游戏竞技场允许模型在结构化环境中进行面对面的对抗，随着模型的进化，游戏的强度自然增加，从而防止性能饱和。该技术报告详细介绍了游戏竞技场的基础设施，并描述了三个试点游戏环境：国际象棋、扑克和狼人游戏。这些环境涵盖了完美信息、不完美信息和多人游戏设置，使得对模型的战略规划、适应能力和在不确定性下的鲁棒性进行系统研究成为可能。'}}}, {'id': 'https://huggingface.co/papers/2601.06362', 'title': 'Do Implicit Personalization and Explicit Styles Conflict? PsPLUG: A Lightweight Plug-in for Balancing Personalization and Style in Customized LLMs', 'url': 'https://huggingface.co/papers/2601.06362', 'abstract': 'Abstract  Personalized large language models are often expected to follow explicit style instructions, yet we find that such instructions can undermine the user-specific characteristics that personalization methods aim to preserve. We call this failure mode personalization collapse: explicit style control can conflict with implicit user preferences. To address this challenge, we propose PsPLUG, a lightweight plug-in that learns a user-specific residual after accounting for the requested style. PsPLUG also allows us to tune personalization strength at inference time. Our experiments show that explicit style instructions can diminish personalization in existing methods, whereas PsPLUG better preserves user preferences while providing precise control over the balance between personalization and style adherence.', 'score': 3, 'issue_id': 3345, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': 'f15f551bfbcd9ed5', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Балансировка персонализации и стилевого контроля в LLM через остаточное обучение', 'desc': 'В работе исследуется проблема конфликта между персонализацией большых языковых моделей и явными инструкциями по стилю — явление, называемое коллапсом персонализации. Авторы предлагают PsPLUG, лёгкий модуль, который обучается предсказывать пользовательский остаток после учёта запрошенного стиля. Метод позволяет контролировать силу персонализации во время инференции и достигает баланса между сохранением индивидуальных предпочтений пользователя и точным следованием стилистическим инструкциям. Экспериментальные результаты показывают, что PsPLUG эффективнее сохраняет пользовательские характеристики по сравнению с существующими методами персонализации.'}, 'en': {'title': 'Balancing Personalization and Style in Language Models with PsPLUG', 'desc': "This paper discusses the issue of 'personalization collapse' in large language models, where explicit style instructions can interfere with the unique characteristics that personalization aims to maintain. The authors introduce PsPLUG, a lightweight plug-in designed to learn a user-specific residual that accounts for the requested style while preserving user preferences. PsPLUG also offers the ability to adjust the strength of personalization during inference, allowing for better control over the output. Experimental results indicate that PsPLUG effectively balances the need for style adherence with the preservation of individual user preferences, outperforming existing methods."}, 'zh': {'title': '个性化与风格控制的完美平衡', 'desc': '个性化的大型语言模型通常需要遵循明确的风格指令，但我们发现这些指令可能会削弱个性化方法所希望保留的用户特征。我们称这种失败模式为个性化崩溃：明确的风格控制可能与隐含的用户偏好相冲突。为了解决这个问题，我们提出了PsPLUG，这是一种轻量级插件，可以在考虑请求的风格后学习用户特定的残差。实验表明，明确的风格指令会降低现有方法的个性化效果，而PsPLUG则更好地保留用户偏好，同时精确控制个性化与风格遵循之间的平衡。'}}}, {'id': 'https://huggingface.co/papers/2609.24385', 'title': 'Tactile-JEPA: Topology-Aware Self-Supervised Representation Learning for Distributed Tactile Sensors', 'url': 'https://huggingface.co/papers/2609.24385', 'abstract': 'Abstract  Tactile sensing is an essential modality for robots performing contact-rich, dexterous manipulation, particularly under visual occlusion. While pre-trained image encoders are standard in robot learning pipelines, tactile encoders are still commonly trained from scratch from raw, noisy signals, which might limit their expressivity. Existing self-supervised learning (SSL) approaches focus predominantly on vision-based tactile sensors, leaving distributed electronic skins largely unaddressed. These sensors, however, have a distinctive property: their sensing elements are sparse and irregularly arranged over the surface they cover, which makes direct reuse of visual SSL methods suboptimal. We present Tactile-JEPA, an efficient self-supervised pre-training method that uses the spatial arrangement of tactile sensors to learn topology-aware representations. Specifically, it is trained to predict the embeddings of masked sensing elements from the unmasked remainder, using the sensor connectivity graph to guide spatial masking. Our analysis shows that effective tactile representations require capturing both local contact details and the global state of the tactile surface, which we achieve through dual-scale masking. Across three diverse datasets spanning magnetic and piezoresistive sensors, different robot embodiments, and single- and paired-sensor configurations, Tactile-JEPA reduces force estimation error by 6.3% and in-hand orientation error by 20.8% over the prior state-of-the-art, with consistent gains in other downstream applications, including policy learning. Overall, our results demonstrate that the benefit of tactile sensing depends critically on the quality of encoder pre-training, a problem which Tactile-JEPA addresses directly. Code is available at https://github.com/E-Kovtun/tactile.', 'score': 2, 'issue_id': 3345, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '331a7af6bd2621d1', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#robotics', '#training', '#multimodal'], 'emoji': '👋', 'ru': {'title': 'Топологически-осведомленное предварительное обучение для тактильного восприятия роботов', 'desc': 'Статья посвящена самообучению (SSL) тактильных энкодеров для роботов, выполняющих точные манипуляции с контактом. Авторы предлагают Tactile-JEPA — метод предварительного обучения, который использует пространственное расположение тактильных сенсоров для изучения топологически-осведомленных представлений. Ключевой особенностью подхода является двухмасштабное маскирование элементов сенсора, которое захватывает как локальные детали контакта, так и глобальное состояние тактильной поверхности. Метод демонстрирует значительное улучшение в оценке силы и ориентации объекта на нескольких наборах данных, превосходя предыдущие подходы.'}, 'en': {'title': 'Enhancing Robot Tactile Sensing with Tactile-JEPA', 'desc': "This paper introduces Tactile-JEPA, a self-supervised learning method designed to improve tactile sensing for robots. Unlike traditional methods that train tactile encoders from scratch, Tactile-JEPA leverages the unique spatial arrangement of tactile sensors to create more effective representations. It uses a technique called dual-scale masking to predict missing sensor data, enhancing the model's ability to understand both local and global tactile information. The results show significant improvements in force estimation and orientation accuracy, highlighting the importance of quality pre-training for tactile encoders in robotic applications."}, 'zh': {'title': '提升触觉感知的自监督学习方法', 'desc': '触觉感知是机器人进行接触丰富的灵巧操作的重要方式，尤其是在视觉受阻的情况下。现有的自监督学习方法主要集中在基于视觉的触觉传感器，而对分布式电子皮肤的研究较少。我们提出了Tactile-JEPA，这是一种高效的自监督预训练方法，利用触觉传感器的空间排列来学习拓扑感知表示。实验结果表明，Tactile-JEPA在多个数据集上显著提高了触觉表示的质量，从而减少了力估计和手中方向的误差。'}}}, {'id': 'https://huggingface.co/papers/2609.30670', 'title': 'TRACE: Temporal Audit and Condition-aware Evaluation of Streaming Video Understanding', 'url': 'https://huggingface.co/papers/2609.30670', 'abstract': 'Abstract  Streaming video understanding requires models to interpret evidence as it arrives, yet current evaluations often report task scores without specifying when evidence becomes valid, how visual history is maintained, or how responses are triggered. As a result, similar scores may correspond to different workloads, failure modes, and operational behavior. We introduce TRACE (Temporal Audit and Condition-aware Evaluation), a condition-aware benchmark and evaluation framework that makes these factors explicit. TRACE combines temporally audited visual tasks with evidence timing and instruction-dependent trigger annotations, a unified causal Core--Adapter protocol that controls information availability while recording actual history processing and response events, and multidimensional reporting of answer quality, timeliness, response-selection behavior, workload, completion, and reliability. On 1,240 records from 517 videos, we evaluate eight publicly available models or systems in eight configurations. We find that nearly identical QA accuracy can mask substantial differences in completion, answer validity, and generation workload, while proactive performance separates into response quality, response delay, false alarms (responses emitted while no target window is currently valid and a later one remains), and missed target windows. These results show that streaming-video performance should be interpreted as execution-conditioned system behavior rather than a single score. Our benchmark and code can be accessed at https://github.com/om-ai-lab/trace-bench{https://github.com/om-ai-lab/trace-bench}.', 'score': 2, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '2dc47719544f2d2b', 'pdf_title_img': 'assets/pdf/title_img/2609.30670.jpg', 'data': {'categories': ['#video', '#survey', '#benchmark', '#open_source'], 'emoji': '📹', 'ru': {'title': 'Временная аудит моделей понимания видео: от метрик к поведению системы', 'desc': 'Статья представляет TRACE — фреймворк для оценки моделей понимания видео в режиме реального времени, который явно учитывает временные аспекты обработки информации. Авторы показывают, что традиционные метрики точности скрывают существенные различия в полноте ответов, валидности результатов и вычислительной нагрузке моделей. Предложенный бенчмарк использует специальный протокол управления доступностью информации и многомерную оценку качества, учитывающую скорость ответов, ложные срабатывания и пропущенные целевые окна. На примере восьми моделей и систем демонстрируется, что производительность потокового видео следует интерпретировать как поведение системы в конкретных условиях, а не как единый числовой результат.'}, 'en': {'title': 'TRACE: Evaluating Streaming Video Models with Context and Timing', 'desc': 'This paper presents TRACE, a new evaluation framework for streaming video understanding models. It emphasizes the importance of timing and context in assessing model performance, as traditional metrics can be misleading. TRACE introduces a structured way to analyze how models process visual information over time and respond to it, considering factors like workload and response accuracy. The findings reveal that similar accuracy scores can hide significant differences in how models operate under varying conditions.'}, 'zh': {'title': '流媒体视频理解的新评估标准', 'desc': '本论文提出了一种新的评估框架TRACE（时间审计和条件感知评估），用于流媒体视频理解。该框架明确了证据何时有效、视觉历史如何维护以及如何触发响应等因素。通过结合时间审计的视觉任务和依赖指令的触发注释，TRACE能够记录实际的历史处理和响应事件。研究表明，流媒体视频性能应被视为执行条件下的系统行为，而不是单一的评分。'}}}, {'id': 'https://huggingface.co/papers/2609.31002', 'title': 'ZooWork-ShopRanker: An Open, Preference-Aligned E-Commerce Reranker', 'url': 'https://huggingface.co/papers/2609.31002', 'abstract': 'Abstract  Open rerankers trained for general web retrieval transfer imperfectly to e-commerce, where ranking decisions depend not only on topical relevance but also on user preferences, product constraints, and comparative product fit. These preference signals are difficult to supervise at scale: real search traffic provides authentic queries and candidates but no clean pairwise labels. We present ZooWork-ShopRanker, a family of e-commerce rerankers (0.6B, 4B, and 8B) aligned to judge-labeled shopping preference. Training pairs are labeled by a panel of reasoning large language models (LLMs) from different families acting as a preference oracle, with position-debiased judgments and agreement tiers, and the rerankers are trained on these labels. The aligned 8B flagship then serves as a distillation teacher for the efficient 4B and 0.6B models, which are fit to its scores and sharpened on judged pairs. To measure progress, we introduce ShopRank-Bench, a contamination-limited benchmark of ~10,000 private-traffic preference pairs in both text formats, tiered by how many judge families committed to each label. ZooWork-ShopRanker-8B and -4B significantly outperform the strongest open reranker baseline, every model significantly beats its own un-aligned base, and ZooWork-ShopRanker-0.6B beats its size peer; the gains hold in both formats and extend to common MTEB benchmarks. We release the models and the dual-format ShopRank-Bench to facilitate further research.', 'score': 2, 'issue_id': 3345, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '7b909b4cdc7a6cc6', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#transfer_learning', '#alignment', '#small_models', '#training', '#multimodal', '#dataset', '#benchmark', '#open_source'], 'emoji': '🛒', 'ru': {'title': 'Переранжирование с предпочтениями: LLM-размеченные модели для умного поиска товаров', 'desc': 'В работе представлена семья моделей переранжирования для e-commerce под названием ZooWork-ShopRanker, которые учитывают не только релевантность, но и предпочтения пользователей и характеристики товаров. Для обучения используется инновационный подход: панель LLM из разных семейств выступает в роли оракула предпочтений и автоматически размечает пары товаров без предвзятости по позиции. Модели размером 0.6B, 4B и 8B обучаются на этих размеченных данных, причём меньшие модели дистиллируются из старшей 8B модели. Авторы также представили ShopRank-Bench — бенчмарк с ~10,000 пар предпочтений из реального трафика, и продемонстрировали значительное улучшение над открытыми базовыми моделями.'}, 'en': {'title': 'Enhancing E-commerce Ranking with User Preferences', 'desc': 'This paper introduces ZooWork-ShopRanker, a set of e-commerce rerankers designed to improve product ranking by incorporating user preferences and product constraints. Traditional web retrieval models struggle in e-commerce due to the lack of clean pairwise labels for training, as real search traffic does not provide clear preferences. The authors propose using large language models as preference oracles to generate labeled training pairs, which helps in aligning the rerankers with actual shopping preferences. The results show that the ZooWork-ShopRanker models significantly outperform existing open rerankers, demonstrating their effectiveness in both text formats and on established benchmarks.'}, 'zh': {'title': '电商重排序的新突破', 'desc': '这篇论文介绍了一种新的电商重排序模型ZooWork-ShopRanker，旨在解决电商搜索中的排名问题。传统的网页检索模型在电商中表现不佳，因为电商排名不仅依赖于主题相关性，还受到用户偏好和产品限制的影响。为了训练这些模型，研究者使用了大型语言模型（LLMs）作为偏好评判的来源，生成了成对的标签数据。实验结果表明，ZooWork-ShopRanker在多个基准测试中显著优于现有的开放重排序模型，展示了其在电商领域的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.28660', 'title': 'Morphometric Imitation: From Morphology and Contact Aware Hand Retargeting to Sim-to-Real Visuomotor Policy', 'url': 'https://huggingface.co/papers/2609.28660', 'abstract': 'Abstract  Human hand-object interactions (HOIs) provide a rich source of demonstrations for dexterous manipulation, but learning directly from them presents challenges in bridging morphology gaps, ensuring dynamical feasibility, and sim-to-real deployment. We present Morphometric Imitation, a three-stage framework that transforms reconstructed HOIs into zero-shot sim-to-real visuomotor policies. First, morphometric optimization (MMO) kinematically retargets human motion across hand morphologies while preserving demonstrated contacts. Second, residual reinforcement learning (RL) refines the kinematic reference using object pose and contact information from the human motion to produce dynamically feasible robot demonstrations. Third, these demonstrations are distilled into visuomotor policies. Across three robot hands and ten HOIs, MMO improves contact F1 over the strongest of five baselines by at least 8 points for every hand, while also improving the success rate of downstream dynamic retargeting by as much as 35 points. Ablations on the residual RL show complementary benefits from using object pose and contact information. Finally, the visuomotor policies achieve 89.3% zero-shot success in 300 real-world trials on 30 objects. Project page: https://morphometricimitation.github.io{this https URL}', 'score': 1, 'issue_id': 3344, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '72320598eee2467c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'От человеческих жестов к роботизированной ловкости через морфометрический перенос', 'desc': 'В работе предлагается фреймворк Morphometric Imitation для преобразования видеозаписей взаимодействия человека с объектами в политики управления роботизированными руками. Метод состоит из трёх этапов: морфометрическая оптимизация для кинематического переноса движений между разными морфологиями рук с сохранением контактов, обучение с подкреплением для обеспечения динамической реализуемости движений робота, и дистилляция полученных траекторий в визуомоторные политики. Подход обеспечивает значительное улучшение качества переноса контактов и успешности динамического переноса движений на всех протестированных роботизированных руках. Полученные визуомоторные политики достигают 89.3% успеха в реальных экспериментах без каких-либо адаптаций к конкретным объектам.'}, 'en': {'title': 'Transforming Human Motion for Robotic Dexterity', 'desc': 'This paper introduces Morphometric Imitation, a framework designed to learn from human hand-object interactions (HOIs) for robotic manipulation. It consists of three stages: first, morphometric optimization (MMO) adapts human motion to different hand shapes while keeping the same contact points. Next, residual reinforcement learning (RL) fine-tunes these motions to ensure they are dynamically feasible for robots. Finally, the refined demonstrations are converted into visuomotor policies, achieving high success rates in real-world applications.'}, 'zh': {'title': '形态模仿：从人手交互到机器人运动的桥梁', 'desc': '本文提出了一种名为形态模仿的三阶段框架，用于将重建的人手物体交互（HOIs）转化为零-shot的仿真到现实的视觉运动策略。首先，通过形态优化（MMO）在保持接触的同时，针对不同手部形态对人类运动进行运动学重定向。其次，利用残差强化学习（RL）结合物体姿态和接触信息，优化运动学参考，生成动态可行的机器人演示。最后，这些演示被提炼为视觉运动策略，在300个真实世界试验中实现了89.3%的零-shot成功率。'}}}];
