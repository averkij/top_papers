    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.28236', 'title': 'EmbodiedMemory-Bench: Benchmarking Embodied Memory for Long-Horizon Embodied Tasks', 'url': 'https://huggingface.co/papers/2609.28236', 'abstract': 'Abstract  Long-horizon embodied interaction requires agents to retain and continually update information about the environment as they observe, act, and encounter change. Yet current agents struggle to maintain such memory reliably. Our analysis traces this limitation to four key deficiencies: weak fine-grained visual memory, unreliable dynamic world-state tracking, failing to record world state revealed by interaction outcomes, and limited generalization from prior experience. However, existing benchmarks do not directly assess these memory capabilities during long-horizon embodied interaction. To address this gap, we introduce EmbodiedMemory-Bench (EMem-Bench), comprising 2,554 interactive episodes across four task families. EMem-Bench requires agents to build and update memory from interaction history, then use it to complete a later task by acting in the environment. We further present Embodied-Memorizer (EMem), an external memory system that organizes embodied experience into spatial, event, and scene memories. We also train EMem-8B, an 8B policy that manages and uses these memories. We evaluate a diverse range of open-source and proprietary MLLMs and representative multimodal memory systems. Results show that current models remain weak and uneven across the four challenges. Under matched backbones, EMem achieves the best overall performance among the evaluated memory systems and improves both open-source and proprietary models, while EMem-8B further improves over its backbone. Project page: https://zju-omniai.github.io/EmbodiedMemoryBench/', 'score': 10, 'issue_id': 3348, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '23d497762e7ec373', 'authors': ['Lizhou Liang', 'Xinyu Zhong', 'Miao Pan', 'Xiaohe Zhou', 'Xuanyu Liu', 'Qinfeng Li', 'Peng Li', 'Jintao Chen', 'Xuhong Zhang', 'Wenqi Zhang'], 'affiliations': ['Central South University', 'Institute of Software, Chinese Academy of Sciences', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.28236.jpg', 'data': {'categories': ['#dataset', '#training', '#agents', '#multimodal', '#robotics', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Структурированная внешняя память для долгосрочного воплощённого взаимодействия', 'desc': 'В статье представлен анализ проблем с памятью у агентов, действующих в физическом мире на протяжении длительного времени: слабая визуальная память, ненадёжное отслеживание состояния окружающей среды, неспособность фиксировать информацию из результатов взаимодействия и ограниченное обобщение опыта. Авторы создали EmbodiedMemory-Bench — бенчмарк с 2554 интерактивными эпизодами для оценки способности агентов строить и обновлять память на основе истории взаимодействий. Предложена система Embodied-Memorizer, которая организует опыт агента в виде пространственной, событийной и сценической памяти, а также обучена политика EMem-8B размером 8 миллиардов параметров для управления этими типами памяти. Экспериментальные результаты показывают, что текущие мультимодальные модели остаются слабыми в решении выявленных проблем, но предложенный подход улучшает их производительность.'}, 'en': {'title': 'Enhancing Agent Memory for Long-Horizon Interactions', 'desc': "This paper addresses the challenges faced by agents in retaining and updating information during long-horizon embodied interactions. It identifies four main deficiencies in current memory systems: poor visual memory, unreliable tracking of dynamic environments, failure to record interaction outcomes, and limited generalization from past experiences. To evaluate and improve these memory capabilities, the authors introduce a new benchmark called EmbodiedMemory-Bench (EMem-Bench), which consists of 2,554 interactive episodes across various tasks. They also present the Embodied-Memorizer (EMem), an external memory system designed to enhance agents' performance by organizing their experiences into different types of memories, demonstrating significant improvements in memory management and task completion."}, 'zh': {'title': '提升智能体记忆能力的关键', 'desc': '本论文探讨了在长时间交互中，智能体如何保持和更新对环境的信息。当前的智能体在记忆保持方面存在四个主要缺陷，包括视觉记忆不够细致、动态世界状态跟踪不可靠、未能记录交互结果揭示的世界状态，以及从先前经验中泛化能力有限。为了解决这些问题，作者提出了EmbodiedMemory-Bench（EMem-Bench），这是一个包含2554个交互情节的基准测试，旨在评估智能体在长时间交互中的记忆能力。论文还介绍了Embodied-Memorizer（EMem），一个外部记忆系统，能够将经验组织为空间、事件和场景记忆，并展示了其在多种模型中的优越表现。'}}}, {'id': 'https://huggingface.co/papers/2609.32472', 'title': 'AdaTutoRank: Learning to Rerank Document Sets via Adaptive Tutoring Optimization for RAG and Deep Research', 'url': 'https://huggingface.co/papers/2609.32472', 'abstract': "Abstract  Document rerankers determine what evidence reaches the downstream model in RAG and deep research, yet mainstream rerankers select by relevance matching, and individually relevant documents rarely constitute the complete, complementary, non-redundant set a complex information need demands. Prior work rewards a set by its aggregate rubric score, shifting the objective from ranking documents to composing sets. Yet that score is one scalar shared by every document in the set, so the supervision is sparse: a redundant document is rewarded with the rest whenever the set scores well, and a decisive one penalized with the rest whenever it does not; credit assignment leaves contributors indistinguishable from free riders. On-policy distillation could densify this supervision, but existing methods give every rollout the same fixed guidance, too prescriptive for strong rollouts and too abstract for weak ones. We therefore propose AdaTutoRank, a setwise reranker trained with Adaptive Tutoring Optimization (ATO) under a three-level hierarchy of nine rubric dimensions, which supplies silver labels for the cold start, rewards for reinforcement learning, and hints for distillation. ATO draws three hint forms of increasing specificity from the policy's own frozen snapshot: the rubrics alone, a self-selector's sibling-set chosen under rubrics, and a self-reflector's reflection contrasting the rollout with that sibling-set; each rollout receives the form matched to its quality. Re-scoring that rollout under the hint-conditioned frozen teacher and the hint-free snapshot distills the hint's effect into a token-level advantage that complements the group-relative outcome advantage. Across ten benchmarks spanning RAG, deep research, and setwise evaluation, AdaTutoRank attains the best overall performance while issuing fewer retrieval calls.", 'score': 7, 'issue_id': 3348, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'c0604c0b0a6f7cde', 'authors': ['Kailin Jiang', 'Lei Liu', 'Jian Xi', 'Yangqi Chen', 'Hui Xu', 'Hongwei Zhao', 'Bin Li', 'Yu Lu', 'Haibo Shi'], 'affiliations': ['University of Science and Technology of China', 'Yuanbao Team, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2609.32472.jpg', 'data': {'categories': ['#rag', '#training', '#rl', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное обучение для выбора дополняющих документов в системах поиска', 'desc': 'Статья описывает AdaTutoRank — модель переранжирования документов для RAG систем, которая выбирает дополняющие друг друга релевантные документы вместо просто релевантных. Основная проблема в том, что традиционный подход присваивает одну оценку всему набору документов, что затрудняет обучение выделить полезные документы от избыточных. Авторы предлагают Adaptive Tutoring Optimization (ATO) — метод обучения с подкреплением, который адаптивно предоставляет подсказки разного уровня специфичности в зависимости от качества предложенного набора документов. Модель достигает лучших результатов на десяти бенчмарках при меньшем количестве запросов к системе поиска.'}, 'en': {'title': 'Enhancing Document Selection with Adaptive Tutoring Optimization', 'desc': 'This paper introduces AdaTutoRank, a novel setwise reranker designed to improve the selection of documents for complex information needs in retrieval-augmented generation (RAG) and deep research tasks. Traditional rerankers often focus solely on relevance matching, which can lead to incomplete and redundant document sets. AdaTutoRank employs Adaptive Tutoring Optimization (ATO) to provide tailored guidance during training, enhancing the credit assignment process for individual documents within a set. The method demonstrates superior performance across multiple benchmarks by optimizing the document selection process while minimizing retrieval calls.'}, 'zh': {'title': '提升文档重排序的智能选择', 'desc': '本文提出了一种新的文档重排序方法，称为AdaTutoRank，旨在改善信息检索中的文档选择。传统的重排序方法主要依赖相关性匹配，往往无法满足复杂信息需求的完整性和互补性。AdaTutoRank通过自适应辅导优化（ATO）在三层次的九个评分维度下进行训练，提供了更细致的监督信号。该方法在多个基准测试中表现出色，能够在减少检索调用的同时提高整体性能。'}}}, {'id': 'https://huggingface.co/papers/2609.32444', 'title': 'Rethinking Training-Inference Mismatch in LLM Reinforcement Learning: Where It Arises and How to Correct It', 'url': 'https://huggingface.co/papers/2609.32444', 'abstract': 'Abstract  We study training-inference mismatch in reinforcement learning with verifiable rewards (RLVR) for large language models, where rollouts are sampled by an inference engine while gradients are computed by a training engine, and the two engines assign different probabilities to the same tokens. To account for this discrepancy in policy updates, we introduce calibrated importance sampling (CIS). CIS is motivated by an empirically supported logit-displacement characterization that expresses the mismatch as an additive displacement varepsilon_t in log-odds, determined by the per-logit perturbation before the softmax, whose distribution is approximately invariant to token confidence. This characterization motivates a confidence-aware truncation: large positive displacements are truncated at a single constant threshold, which maps back to an importance-ratio cap that tightens as token confidence increases. Theoretically, we show that CIS replaces the unbounded second moment that governs the error of exact importance sampling with a term bounded by a constant, at the cost of a bias controlled by the truncated excess. In evaluation across three mixture-of-experts models and five mathematical reasoning benchmarks, CIS achieves the highest five-benchmark average on all three models among the evaluated baselines. Diagnostic analyses show that CIS places less truncation bias on low-confidence tokens than truncated importance sampling, while upward clipping of small importance weights reduces held-out accuracy.', 'score': 3, 'issue_id': 3348, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '0b2b2ce392aca668', 'authors': ['Tianrun Yu', 'Kaixiang Zhao', 'Shangzhe Li', 'Yuxiao Yang', 'Porter Jenkins', 'Weitong Zhang', 'Taylor W. Killian'], 'affiliations': ['Brigham Young University', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2609.32444.jpg', 'data': {'categories': ['#rlhf', '#training', '#rl', '#math'], 'emoji': '⚖️', 'ru': {'title': 'Калиброванное importance sampling для синхронизации обучения и инференса в обучении с подкреплением', 'desc': 'В статье изучается проблема рассогласования между процессами обучения и инференса в обучении с подкреплением и проверяемыми наградами для больших языковых моделей, когда два разных двигателя присваивают разные вероятности одним и тем же токенам. Для решения этого несоответствия авторы предлагают калиброванное importance sampling (CIS), которое основано на эмпирически подтвержденной характеристике смещения логитов как аддитивного отклонения в логарифме шансов. Метод использует уверенность в предсказании для адаптивной обрезки больших положительных смещений с единственным порогом, что соответствует тесно связанному ограничению на важность выборки. Теоретический анализ показывает, что CIS заменяет неограниченный второй момент ошибки на ограниченный член с контролируемым смещением от усеченного избытка.'}, 'en': {'title': 'Calibrated Importance Sampling: Bridging Training and Inference in RL', 'desc': 'This paper addresses the issue of training-inference mismatch in reinforcement learning with verifiable rewards, particularly in large language models. The authors propose a method called calibrated importance sampling (CIS) to correct discrepancies in token probabilities between the training and inference phases. CIS uses a logit-displacement approach to adjust the policy updates, ensuring that the importance sampling remains effective even with varying token confidence. The results demonstrate that CIS outperforms traditional methods across multiple models and benchmarks, while effectively managing bias in low-confidence scenarios.'}, 'zh': {'title': '校准重要性采样：提升强化学习的准确性', 'desc': '本文研究了在强化学习中，训练和推理之间的不匹配，特别是在可验证奖励的情况下。我们提出了一种称为校准重要性采样（CIS）的方法，以解决训练引擎和推理引擎在相同标记上分配不同概率的问题。CIS通过引入一个与标记置信度相关的截断机制，来减少低置信度标记的偏差。实验结果表明，CIS在多个模型和基准测试中表现优异，能够有效提高模型的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.33757', 'title': 'YuE2: Unifying Symbolic and Audio Music Generation at Frontier Quality', 'url': 'https://huggingface.co/papers/2609.33757', 'abstract': 'Abstract  Symbolic models make melody, harmony, rhythm, and form explicit but typically stop before a finished recording; audio models produce complete songs while leaving composition implicit. We introduce YuE2, which unifies symbolic and audio music generation at frontier quality through symbolic planning. A single AR-NAR Mixture-of-Transformers (MoT) first writes a readable score specifying melody and harmony, expands it into semantic music tokens, and realizes it as full-song audio. In comparisons using the same checkpoint, experts prefer symbolic planning for overall quality and musicality, with 49.3% of overall preferences versus 34.6% without planning. Experts also favor the unified model over a separate language model and diffusion Transformer. On WildSongBench, YuE2 scores 6.73 on SongBench Global Avg, exceeding all evaluated public baselines. Selecting from eight candidates (best-of-8), YuE2 reaches 6.96, the highest observed mean among all evaluated systems. Expert listening further establishes its competitiveness with proprietary song generators, favoring best-of-8 over Suno v4.5 and yielding nearly balanced preferences against Suno v5. To learn this generation process from recordings without aligned scores, we introduce MERT2 and SheetSage2 to supply semantic and symbolic supervision. MERT2 sets a new state of the art in music representation learning, surpassing previous best results on 14 of 15 MARBLE metrics; SheetSage2 leads 12 of 15 benchmark-metric pairs in our lead-sheet transcription comparison. The same checkpoint follows score edits while largely preserving unedited musical content and generates zero-shot covers without cover-specific training. Its readable score also enables agentic music editing, with external language models translating user feedback into revisions of the composition.', 'score': 2, 'issue_id': 3348, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': '2223f74e7f040e95', 'authors': ['Ruibin Yuan', 'Jiahao Pan', 'Junyan Jiang', 'Zhiyue Wu', 'Ziya Zhou', 'Jiankai Sun', 'Yizhi Li', 'Ge Zhang', 'Yicheng Gu', 'Zeyue Tian', 'Junyu Dai', 'Hanfeng Lin', 'Kai Li', 'Shangda Wu', 'Xuanjie Liu', 'Jiaming Wang', 'Zihan Liu', 'Yue Wang', 'Yinghao Ma', 'Hanzhi Yin', 'Kangrui Chen', 'Xinyue Zhang', 'Ziyang Ma', 'Mengqi Liao', 'Hejia Zhao', 'Guowei Huang', 'Chao Yan', 'Lei Ke', 'Jianwei Yu', 'Bei Liu', 'Joe Guo', 'Liumeng Xue', 'Gus Xia', 'Wei Xue', 'Yike Guo'], 'affiliations': ['ACE Studio', 'HKGAI', 'HKUST', 'M-A-P', 'MBZUAI', 'New York University', 'Stanford University', 'Tokenwave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.33757.jpg', 'data': {'categories': ['#agents', '#multimodal', '#architecture', '#audio', '#open_source', '#benchmark'], 'emoji': '🎵', 'ru': {'title': 'Объединение нотной записи и аудиогенерации в единую модель трансформера', 'desc': 'Авторы предлагают YuE2 — единую модель для генерации музыки, которая объединяет символический (нотная запись) и аудио подходы через архитектуру Mixture-of-Transformers. Модель сначала генерирует читаемую партитуру с мелодией и гармонией, затем преобразует её в семантические музыкальные токены и синтезирует полную композицию в виде аудио. Для обучения на реальных записях без разметки они разработали MERT2 (для семантического представления музыки) и SheetSage2 (для транскрипции), которые достигли state-of-the-art результатов. Система показывает конкурентоспособность с коммерческими генераторами и поддерживает редактирование музыки через естественный язык.'}, 'en': {'title': 'Unifying Symbolic and Audio Music Generation with YuE2', 'desc': 'The paper presents YuE2, a novel model that combines symbolic and audio music generation to create high-quality music. It uses a single Mixture-of-Transformers architecture to first generate a readable musical score, which includes melody and harmony, and then transforms it into full audio. The model outperforms existing systems in expert evaluations, demonstrating superior musicality and quality, particularly when using symbolic planning. Additionally, it introduces MERT2 and SheetSage2 for enhanced music representation learning and transcription, achieving state-of-the-art results on various benchmarks.'}, 'zh': {'title': 'YuE2：音乐生成的新纪元', 'desc': '本文介绍了一种名为YuE2的音乐生成模型，它将符号音乐生成和音频音乐生成结合在一起。YuE2通过符号规划实现高质量的音乐创作，首先生成可读的乐谱，然后将其扩展为语义音乐标记，最终生成完整的音频歌曲。与没有规划的模型相比，专家更倾向于使用符号规划，认为其在整体质量和音乐性上更优。YuE2在WildSongBench上的表现超越了所有评估的公共基准，显示出其在音乐生成领域的竞争力。'}}}, {'id': 'https://huggingface.co/papers/2609.33855', 'title': 'Program-Verified Self-Evolution for Vision-Language Models', 'url': 'https://huggingface.co/papers/2609.33855', 'abstract': "Abstract  Self-evolving vision-language models train on questions they generate from unlabeled images. Since these questions have no gold answers, prior methods label them by majority vote over sampled answers or by a model judge. In a human evaluation, we find that 24\\% of majority-vote labels and 18\\% of model-judge labels produced during self-evolution are wrong. To address this problem, we present Verifiable QA Generation for Self-Evolving Models (VQS), which changes how the model judges answers. Instead of voting on an answer, the model parses each image into a structured record, such as a scene graph, a chart table, or a diagram graph. Fixed programs then write a question from the record and compute its answer. The model still acts as a visual checker, but it only confirms the individual facts the program reads, one short claim at a time. These claim-level checks select the parser's training targets, so the parser also improves without labels. Human raters find 94\\% of VQS answers correct, against 76\\% for majority voting. Across ten benchmarks, VQS improves Qwen3-VL by up to 3.18 points at the 2B, 4B, and 8B scales and outperforms the strongest self-evolving baseline at each. Gains keep growing over three training rounds, reaching 3.84 points at 2B. Code is released at https://github.com/ahmedheakl/VQS", 'score': 1, 'issue_id': 3348, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': '6f03b658c306a138', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#training', '#multimodal', '#cv', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Верификация через структурированное представление для самообучающихся видео-языковых моделей', 'desc': 'В статье предлагается метод Verifiable QA Generation for Self-Evolving Models (VQS) для улучшения самообучающихся видео-языковых моделей. Основная идея заключается в том, что вместо голосования по ответам на самогенерируемые вопросы модель парсит изображение в структурированное представление (граф сцены, таблицу или диаграмму) и использует фиксированные программы для генерации вопросов и ответов. Модель выступает визуальным проверяющим, подтверждая отдельные факты на уровне коротких утверждений, что позволяет одновременно улучшать и парсер без внешних аннотаций. Предложенный подход повышает корректность ответов с 76% до 94% и демонстрирует стабильные улучшения на десяти бенчмарках, достигая прироста до 3.84 точек на модели Qwen3-VL масштаба 2B.'}, 'en': {'title': 'Enhancing Vision-Language Models with Verifiable Question Generation', 'desc': 'This paper introduces a new method called Verifiable QA Generation for Self-Evolving Models (VQS) that enhances the training of vision-language models by generating questions from unlabeled images. Instead of relying on majority voting or a model judge to label answers, VQS uses a structured approach where the model parses images into detailed records like scene graphs. It then formulates questions based on these records and verifies answers through claim-level checks, significantly improving accuracy. The results show that VQS achieves a higher correctness rate in human evaluations and outperforms previous methods across multiple benchmarks.'}, 'zh': {'title': '自我进化模型的可验证问答生成', 'desc': '这篇论文介绍了一种自我进化的视觉-语言模型，能够根据未标记的图像生成问题进行训练。以往的方法通过多数投票或模型判断来标记这些问题的答案，但发现这些方法的准确率较低。为了解决这个问题，论文提出了一种可验证的问答生成方法（VQS），通过解析图像生成结构化记录，并基于这些记录生成问题和答案。实验表明，VQS的答案正确率高达94%，显著优于传统的多数投票方法。'}}}, {'id': 'https://huggingface.co/papers/2609.33803', 'title': 'Diffusion Reward Models', 'url': 'https://huggingface.co/papers/2609.33803', 'abstract': 'Abstract  Reward models underpin the alignment of large language models, yet the dominant designs reduce each prompt--response pair to a point estimate or to a distribution from a fixed parametric family. This is at odds with human preference, which is inherently multimodal: the same response can be reasonably judged in many ways, and no single family covers all of them. To better fit this structure, we introduce DRM, a Diffusion Reward Model that recasts reward modeling as conditional density estimation over p(rmid x,y). Conditioned on a frozen LLM encoder, a lightweight Diffusion Transformer denoises Gaussian noise into a reward vector, placing no parametric assumption on the output distribution and naturally representing its multimodal structure. A single architecture handles both multi-attribute regression and pairwise preference data, and at inference N samples form an empirical reward distribution that can be aggregated into a scalar, a variance, or quantiles. Across five benchmarks, DRM matches or surpasses baselines under matched data and backbone, stays competitive with much larger discriminative, distributional, and generative RMs despite its modest training scale, and recovers multimodal reward structure where conventional heads collapse to a point. Uncertainty-aware rejection and lower-confidence-bound (LCB) aggregation further demonstrate that DRM can exploit distributional information beyond a scalar reward to improve reward-model decisions. Downstream RLHF experiments additionally show that using DRM as the training-time reward leads to improved policy performance, directly validating the practical benefit of diffusion-based reward modeling for RLHF training.', 'score': 1, 'issue_id': 3348, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': 'e684a1f11c0d149d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#architecture', '#alignment', '#diffusion', '#rlhf'], 'emoji': '🎲', 'ru': {'title': 'Мультимодальная оценка вознаграждения через диффузионные модели', 'desc': 'В работе предлагается Diffusion Reward Model (DRM) — новый подход к моделированию вознаграждения для выравнивания больших языковых моделей. Вместо того чтобы сводить оценку ответа к одной точке или распределению из фиксированного семейства, DRM использует диффузионный трансформер для оценки условной плотности вероятности вознаграждения, что позволяет естественным образом представить мультимодальную структуру человеческих предпочтений. Модель не требует параметрических предположений о распределении и может работать как с многоатрибутной регрессией, так и с попарными сравнениями, генерируя при выводе эмпирическое распределение вознаграждений. Эксперименты показывают, что DRM сравнима или превосходит базовые модели и демонстрирует практическую пользу при использовании в RLHF тренировке политик.'}, 'en': {'title': 'Unlocking Multimodal Rewards with Diffusion Models', 'desc': 'This paper introduces the Diffusion Reward Model (DRM), which enhances reward modeling for large language models by treating it as conditional density estimation. Unlike traditional methods that simplify responses to single estimates, DRM captures the multimodal nature of human preferences, allowing for a richer representation of how responses can be evaluated. By using a lightweight Diffusion Transformer, DRM generates reward vectors from Gaussian noise without imposing strict parametric assumptions, thus accommodating diverse reward structures. The model demonstrates superior performance across various benchmarks and improves reinforcement learning from human feedback (RLHF) by leveraging the full distribution of rewards rather than just scalar values.'}, 'zh': {'title': '扩散奖励模型：提升语言模型对齐的创新方法', 'desc': '本论文介绍了一种新的奖励模型，称为扩散奖励模型（DRM），旨在更好地对齐大型语言模型。传统的奖励模型通常将每个提示-响应对简化为单一估计，这与人类的多模态偏好不符。DRM通过条件密度估计来处理奖励建模，能够自然地表示多模态结构，并且在推理时可以生成多个样本的奖励分布。实验结果表明，DRM在多个基准测试中表现优异，能够有效利用分布信息来改善奖励模型的决策。'}}}, {'id': 'https://huggingface.co/papers/2609.32353', 'title': 'Fewer Tokens, More Self-Teaching: On-Policy Self-Distillation for Extreme Visual Token Reduction', 'url': 'https://huggingface.co/papers/2609.32353', 'abstract': 'Abstract  Visual token reduction is an effective way to accelerate multimodal large language models (MLLMs), but performance deteriorates rapidly under extremely low token budgets. Existing work has explored both visual-token selection and training-based adaptation to reduced visual inputs. We take a step further by asking how a heavily compressed MLLM should learn from the states induced by its own generations. This setting naturally calls for on-policy self-distillation: a heavily compressed model is supervised on the states induced by its own generations, while its full-token counterpart serves as an information-rich teacher. Based on this insight, we propose LT-OPD, a training framework for extreme visual-token reduction. The student rolls out responses with only a small fraction of visual tokens, and a frozen full-token copy of the same MLLM provides distributional supervision along these student-generated trajectories. To stabilize on-policy learning when visual evidence is severely limited, we further introduce a budget-level curriculum that progressively decreases the token budget during training. Across nine benchmarks on Qwen3.5-4B, LT-OPD raises average retained performance under 5% visual-token retention from 68.6% to 82.3%, outperforming training-free, training-based, and reinforcement-learning baselines at the same budget. The gains transfer consistently to Qwen3.5-9B, GLM-4.6V-9B, and LLaVA-OV-1.5-4B. LT-OPD also reduces KV-cache usage by 85.2% and prefill FLOPs by 85.4% without additional inference overhead, demonstrating that on-policy learning can substantially recover capabilities lost to extreme visual-token reduction.', 'score': 1, 'issue_id': 3348, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'e0ad8e13e6d375ec', 'authors': ['Junxian Li', 'Ruixuan Yang', 'Tianao Zhang', 'Tiange Xu', 'Weisheng Dong', 'Yulun Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'University of Cambridge', 'Xian Jiaotong University', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2609.32353.jpg', 'data': {'categories': ['#small_models', '#inference', '#multimodal', '#training'], 'emoji': '🎯', 'ru': {'title': 'На-politique самодистилляция для экстремального сжатия визуальных токенов в мультимодальных моделях', 'desc': 'Исследование посвящено ускорению мультимодальных больших языковых моделей через экстремальное сокращение визуальных токенов. Авторы предлагают LT-OPD — фреймворк для обучения сжатой модели на основе на-politique самодистилляции, где сжатая модель учится на состояниях, порождённых её собственными ответами, при помощи полной модели в качестве учителя. Для стабилизации обучения при критическом дефиците визуальной информации применяется curriculum learning, постепенно снижающий бюджет токенов во время тренировки. Метод достигает восстановления 82.3% производительности при сохранении всего 5% визуальных токенов и одновременно снижает потребление памяти KV-cache на 85.2% и вычисления prefill на 85.4% без дополнительных расходов на инференс.'}, 'en': {'title': 'Boosting MLLM Performance with Smart Token Reduction', 'desc': 'This paper introduces LT-OPD, a novel training framework designed to enhance the performance of multimodal large language models (MLLMs) under extreme visual-token reduction. It employs on-policy self-distillation, where a compressed model learns from its own generated states while being guided by a full-token model acting as a teacher. The framework also incorporates a budget-level curriculum that gradually decreases the token budget during training, stabilizing the learning process. Experimental results show that LT-OPD significantly improves performance and reduces computational costs compared to existing methods, making it a promising approach for efficient MLLM training.'}, 'zh': {'title': '极限视觉标记减少的自我蒸馏学习', 'desc': '视觉标记减少是一种加速多模态大型语言模型（MLLMs）的方法，但在极低的标记预算下性能会迅速下降。本文提出了一种新的训练框架LT-OPD，通过自我蒸馏的方式，让压缩后的模型从自身生成的状态中学习，同时利用完整标记的模型作为信息丰富的教师。我们还引入了预算级课程，逐步减少训练过程中的标记预算，以稳定在视觉证据严重有限时的学习。实验结果表明，LT-OPD在多个基准测试中显著提高了在极低视觉标记保留下的平均性能。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (2)', '#agi', '#alignment (1)', '#architecture (2)', '#audio (1)', '#benchmark (4)', '#cv (1)', '#data', '#dataset (2)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (4)', '#open_source (1)', '#optimization', '#plp', '#rag (1)', '#reasoning', '#rl (2)', '#rlhf (2)', '#robotics (1)', '#science', '#security', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#training (6)', '#transfer_learning', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-29 02:27',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-29 02:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-29 02:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
