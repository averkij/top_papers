': 'Ask the right clinical question to find ultrasound landmarks', 'desc': 'Kev-Bio is a vision-language model that uses clinical questions to guide the detection of anatomical landmarks in ultrasound images. It matches language-generated queries with dense image features to create spatial probability maps, which represent where each caliper endpoint is likely to be. The model is trained end-to-end with losses for both landmark localization and clinical measurement, then uses the predicted locations to calculate measurements. On a nine-view ultrasound biometry dataset, it outperformed the compared baselines, helping reduce variability in manual caliper placement.'}, 'zh': {'title': '用空间概率图，让超声测量定位更准、更稳', 'desc': 'Kev-Bio 是一种视觉-语言模型，用临床测量问题引导超声图像中的解剖标志点定位。模型为卡尺的两个端点生成查询，并将其与超声图像的密集特征匹配，得到表示位置可能性的空间概率图，再据此计算标志点坐标和临床测量值。它通过端点定位损失和临床测量损失进行端到端训练，从而显式表示定位的不确定性。实验显示，Kev-Bio 在包含九种视图的数据集上优于所比较的基线方法，有助于降低超声测量中的操作者差异。'}}}, {'id': 'https://huggingface.co/papers/2610.36915', 'title': 'Do We Need an LLM to Know Why Sources Conflict? Decision Models for Knowledge-Conflict Typing in RAG', 'url': 'https://huggingface.co/papers/2610.36915', 'abstract': "Abstract Typed decision models classify source-conflict types faster and cheaper than frontier LLMs, with cascades matching top accuracy at lower cost, though they vary in sensitivity and false-source detection.  Generated by thinkingmachines/Inkling-Small When the sources retrieved for a query disagree, the right response depends on why they disagree: a question with several valid answers, a contested topic, stale information and a false source each call for different behaviour. Cattan et al. (2025) showed that telling a generator the conflict type improves its responses by about 24 points, but that predicting the type is hard even for frontier LLMs. We study whether typed decision models, which return probabilities over fixed options in a single forward pass instead of generating text, can do this classification fast and cheaply. Using the CONFLICTS benchmark and the original paper's prompt verbatim, we evaluate all 11 decision models served by one commercial inference gateway, from 7 providers, against Gemini models on identical inputs. Asked directly, the decision models reach 50.0--67.0% accuracy; 10 of the 11 match or exceed Gemini 2.5 Flash, the paper's model (61.3%), at 4--39x lower billed cost (2 were free) and 2.6--6.0x lower latency. The current Gemini 3.8 Flash (70.0%) is significantly more accurate than 8 of them, but sending each decision model's least confident quarter of queries to it gives a cascade statistically tied with it for 8 of the 11, at 25--37% of its cost. End to end, answers generated with the types of 10 of the 11 follow the expected behaviour as often as with the LLM's types. Decomposing the taxonomy into yes/no questions lowers accuracy for every model, and a repair fitted on one model does not transfer. Pre-specified diagnostics show that dates play no measurable role and that sensitivity to source order varies widely between models. Decision models detect a planted false source less reliably than the LLM as hard labels, but their probabilities still separate planted from clean sources. We release code, prompts and all model outputs at https://github.com/Parv17k/decision-models-conflict-typing.", 'score': 2, 'issue_id': 3497, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'a907472e6f388f89', 'authors': ['Parv Khatri', 'Harshul Jain', 'Mehak Kapoor', 'Tanya Sah'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.36915.jpg', 'data': {'categories': ['#small_models', '#hallucinations', '#optimization', '#open_source', '#benchmark', '#data', '#rag', '#inference', '#interpretability'], 'emoji': '⚖️', 'ru': {'title': 'Быстрая и дешёвая классификация конфликтов источников вместо дорогих LLM', 'desc': 'В статье исследуется, можно ли использовать typed decision models для классификации типа конфликта между источниками вместо дорогих LLM. Модели возвращают вероятности по фиксированным классам за один forward pass, что делает классификацию быстрее и дешевле. На бенчмарке CONFLICTS большинство из 11 моделей не уступает Gemini 2.5 Flash по точности, а каскад с Gemini 3.8 Flash даёт сопоставимое качество при 25–37% стоимости. При этом модели хуже обнаруживают ложные источники, но их вероятности всё же различают подложные и чистые источники.'}, 'en': {'title': 'Fast, Low-Cost Models Triage Source Conflicts', 'desc': 'The paper tests whether typed decision models can classify why retrieved sources disagree, such as because of stale information or a false source. These models predict among fixed options in one pass, and most match or beat Gemini 2.5 Flash while costing less and responding faster. A cascade that sends uncertain cases to Gemini 3.8 Flash reaches similar accuracy at a fraction of its cost. However, models differ in sensitivity to source order, and they are less reliable than the LLM at labeling planted false sources.'}, 'zh': {'title': '用低成本决策模型识别冲突，难题再交给强模型', 'desc': '论文研究如何判断检索到的来源为何互相冲突，例如答案各有道理、话题存在争议、信息过时或来源造假。研究者测试了能直接输出各类别概率的决策模型，发现它们通常比大型语言模型更快、更便宜，而且准确率相近。把模型最没把握的部分交给较强的语言模型处理，可以在接近其准确率的同时降低成本。不同模型对来源顺序的敏感程度不一；它们较难直接识别假来源，但输出的概率仍能区分造假来源与正常来源。'}}}, {'id': 'https://huggingface.co/papers/2611.01927', 'title': 'Is Your Long-Horizon Benchmark Really Deep? Measuring and Synthesizing Depth in Terminal Tasks', 'url': 'https://huggingface.co/papers/2611.01927', 'abstract': 'Abstract DEPTH generates complex terminal tasks by measuring sequential dependency depth rather than turn count, producing harder benchmarks that improve agent fine-tuning.  Generated by thinkingmachines/Inkling-Small Long-horizon terminal tasks are used to evaluate and train agents. Human-curated datasets are scarce, so many synthesis methods have emerged. They usually measure the length of a task by the turns a model needs to pass it, and its difficulty by labels the LLM sets during generation. We find, however, that the turn count largely reflects the habits of the model, not only the demands of the task, and that the labels barely track how often models pass. We describe a terminal task by its work, the number of operations it requires, and its depth, the number of turns that must happen in sequence because the commands of each turn can only be chosen after reading the output of the previous one. Estimating depth as the smallest turn cap, stated to the agent, under which the task passes, we audit 734 tasks from six existing datasets. Synthesis has mostly added work, not depth: 94% of the solved synthetic tasks pass within three turns, yet depth, unlike the turn count, predicts difficulty beyond work. We propose DEPTH, in which a generation agent writes each task one segment at a time in a real software environment, carrying out each segment before writing it and starting the next from the state it leaves. Our 105 tasks exceed every audited dataset in depth and work, and none of six current models passes half of them. Fine-tuning Qwen3-8B on runs from these tasks improves it on two terminal benchmarks.', 'score': 2, 'issue_id': 3497, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '1e2503cd5ccc92fd', 'authors': ['Yu Jiang', 'Yue Huang', 'Hang Hua', 'Yuyang Wu', 'Zixuan Weng', 'Olexandr Isayev', 'Yue Zhao', 'Zinan Lin', 'Xiangliang Zhang'], 'affiliations': ['CMU', 'Carnegie Mellon University', 'Georgia Institute of Technology', 'IBM Research', 'MIT-IBM Watson AI Lab', 'Microsoft Research', 'University of Notre Dame', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2611.01927.jpg', 'data': {'categories': ['#training', '#dataset', '#synthetic', '#agents', '#benchmark', '#survey', '#data'], 'emoji': '🧭', 'ru': {'title': 'Сложность задачи определяется глубиной последовательных зависимостей, а не числом ходов', 'desc': 'Авторы предлагают метрику глубины (depth) для терминальных задач, которая измеряет число последовательных шагов, зависящих от вывода предыдущих команд, вместо простого подсчёта ходов агента. Анализ 734 задач из шести датасетов показывает, что число ходов отражает скорее привычки модели, а не сложность задачи, а метки сложности, заданные LLM, слабо коррелируют с реальной успешностью. Предложенный метод DEPTH генерирует задачи по сегментам в реальной программной среде, выполняя каждый сегмент до написания следующего, и даёт набор из 105 задач, более сложный по глубине и объёму работы. Дообучение Qwen3-8B на траекториях, полученных из этих задач, улучшает результаты на двух терминальных бенчмарках.'}, 'en': {'title': 'Build Deeper Tasks to Train Stronger Terminal Agents', 'desc': 'This paper introduces DEPTH, a method for creating challenging tasks for terminal-use agents. It measures task work by the number of operations and task depth by how many turns must depend on earlier command outputs. An audit of 734 tasks finds that existing synthetic datasets mostly increase work, while depth better predicts difficulty beyond work. DEPTH creates tasks step by step in a real software environment, producing deeper tasks that are difficult for current models and whose training runs improve Qwen3-8B on two benchmarks.'}, 'zh': {'title': '不只增加操作，更要加深任务的连续依赖', 'desc': '本文提出 DEPTH，一种生成更具挑战性的终端任务的方法。作者指出，任务所需的回合数容易受模型习惯影响，而任务难度标签也难以反映实际通过率；相比之下，工作量表示所需操作数量，依赖深度表示必须根据前一回合输出才能决定后续命令的连续回合数。作者审查了六个现有数据集中的 734 项任务，发现合成任务大多增加了工作量而非依赖深度，且依赖深度在工作量之外也能预测难度。DEPTH 在真实软件环境中逐段生成并执行任务，得到的 105 项任务具有更高的工作量和依赖深度；用这些任务的执行轨迹微调 Qwen3-8B 后，模型在两个终端基准上有所提升。'}}}, {'id': 'https://huggingface.co/papers/2610.41366', 'title': 'What We Keep of What We Forget: Replacement Operators and Routing Semantics in Training-Free MoE Expert Pruning', 'url': 'https://huggingface.co/papers/2610.41366', 'abstract': "Abstract Comparing replacement operators for pruned mixture-of-experts experts reveals that gate scaling and calibration domain strongly affect performance, with a proposed tilted novice operator improving results without dominating all settings.  Generated by thinkingmachines/Inkling-Small Training-free expert pruning makes two decisions: which experts to remove, and what the layer computes when its router still selects a removed expert. Published methods change both at once. Holding the mask fixed, we compare replacement operators from three families on OLMoE, DeepSeek-V2-Lite and Moonlight, with Granite as a fourth router, using paired, multiplicity-corrected tests. The largest effect is a choice usually left implicit: the survivors' gate scale. On routers trained without top-k renormalization, renormalizing the survivors' gates, a common implementation choice, costs 0.8-8.5 points and reverses whether rerouting beats MoNE's mean-output replacement; on two routers trained with renormalization, the trained scale wins at 50% pruning. We introduce the tilted novice, a closed-form low-rank map of the pruned expert's input whose rank-0 case is MoNE's constant. At 50% pruning it adds 1.2-1.8% parameters and gains 3.45 and 1.37 points over the constant on OLMoE and Moonlight, stable across calibration draws and largely unchanged by 4- and 3-bit quantization. No operator dominates: trained-scale rerouting is best on DeepSeek-V2-Lite, and a partial copy of each pruned expert is statistically indistinguishable from the tilted novice on two models. Evaluation can change conclusions: at 25% pruning MoNE's constant keeps 92-97% of dense multiple-choice accuracy but only 5-65% of GSM8K and 0-17% of code scores, and the calibration domain moves the mask 4-9 times more than resampling. We propose a five-item reporting checklist.", 'score': 2, 'issue_id': 3497, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '123864e6d79afcfb', 'pdf_title_img': 'assets/pdf/title_img/2610.41366.jpg', 'data': {'categories': ['#optimization', '#open_source', '#inference', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Масштаб gate-весов и калибровка решают судьбу прунинга экспертов в MoE', 'desc': 'Статья сравнивает способы замены удалённых экспертов (experts) в mixture-of-experts LLM после training-free прунинга, при неизменной маске удаления. Ключевой эффект связан с масштабом gate-весов выживших экспертов: их ренормализация без top-k renormalization ухудшает качество, тогда как обученный масштаб лучше при 50% прунинге. Авторы предлагают tilted novice, низкоранговое отображение входа удалённого эксперта, которое обобщает константу MoNE (rank-0) и даёт прирост на OLMoE и Moonlight при +1.2-1.8% параметров. Итог: ни один оператор не доминирует везде, а результаты сильно зависят от калибровочного домена и выбора метрик, поэтому авторы предлагают чек-лист из пяти пунктов для отчётности.'}, 'en': {'title': 'Prune experts carefully: replacement and gate scale matter', 'desc': 'The paper studies how to replace mixture-of-experts (MoE) experts after pruning, while keeping the set of removed experts fixed. It finds that the surviving experts’ gate scale—the weights assigned by the router—can strongly affect performance, and the best choice depends on how the router was trained. The proposed tilted novice replacement uses a low-rank map of the removed expert’s input and improves on a constant-output replacement on two models, but no method works best in every setting. Results also depend on the calibration data and evaluation task, so the authors recommend a five-item checklist for reporting pruning experiments.'}, 'zh': {'title': '剪枝不只看删谁：替代方式与门控缩放同样关键', 'desc': '论文研究混合专家模型剪枝后，路由器选中已删除专家时，不同替代算子如何影响性能。实验发现，幸存专家的门控权重缩放方式影响很大：应采用与路由器训练时一致的缩放，否则性能可能明显下降。作者提出“倾斜新手”算子，用低秩映射近似被剪枝专家的输出；在部分模型上，它优于用常数输出替代，但并非在所有设置中都最好。论文还指出，评测任务和校准数据域会显著改变剪枝结论，并建议报告五项关键信息以便公平比较。'}}}, {'id': 'https://huggingface.co/papers/2611.04467', 'title': 'Is Forgetting Unified? Exploring Concept Unlearning in Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2611.04467', 'abstract': 'Abstract Cross-pathway concept unlearning in unified multimodal models is addressed by a new benchmark and method that jointly suppresses target concept generation and recognition while preserving other capabilities.  Generated by thinkingmachines/Inkling-Small Unified multimodal models (UMMs) integrate image generation and visual understanding, but are existing single-pathway unlearning methods sufficient to suppress target concepts across both? In this work, we study cross-pathway concept unlearning. Our goal is to prevent a model from both generating images of a target concept and identifying it in input images, while preserving other capabilities. To this end, we introduce UUBench, a diagnostic benchmark covering 30 target concepts and 60 semantically related neighboring concepts. Experiments on representative UMMs show that the evaluated single-pathway methods achieve limited joint forgetting: generation-side editors strongly suppress target generation but yield limited forgetting in visual understanding, while understanding-side baselines struggle to achieve substantial forgetting even in their own pathway. Their direct composition also yields limited joint forgetting. We therefore propose UniForget, achieving joint forgetting rates of 80.0% on BAGEL-7B-MoT and 92.7% on Janus-Pro-7B, outperforming representative baselines. Further analysis reveals trade-offs between joint forgetting and capability preservation.', 'score': 2, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '1289771d48fdf95e', 'authors': ['Zhongkai Xue', 'Junkai Chen', 'Mingcong Lei', 'Rumo Zhang', 'Yixiao Liu', 'Zhimin Sun', 'Shu Wu', 'Qiang Liu', 'Lihua Zhang', 'Liang Wang'], 'affiliations': ['ByteDance', 'Institute of Automation, Chinese Academy of Sciences', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2611.04467.jpg', 'data': {'categories': ['#security', '#ethics', '#benchmark', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Забыть концепт во всех каналах модели сразу: генерация и распознавание под контролем', 'desc': 'Статья рассматривает проблему cross-pathway concept unlearning в унифицированных мультимодальных моделях (UMM), которые одновременно генерируют изображения и понимают визуальный контекст. Авторы вводят бенчмарк UUBench с 30 целевыми концептами и 60 семантически близкими соседними концептами для диагностики забывания. Показано, что существующие методы unlearning, применяемые только к одному пути (генерации или пониманию), плохо справляются с совместным забыванием, а их простая композиция тоже недостаточна. Предложенный метод UniForget достигает совместного забывания 80.0% на BAGEL-7B-MoT и 92.7% на Janus-Pro-7B, превосходя базовые подходы, при этом анализ выявляет компромисс между забыванием и сохранением остальных возможностей модели.'}, 'en': {'title': 'Forget the Concept Across Both Seeing and Creating', 'desc': 'This paper studies how to make unified multimodal models both stop generating images of a target concept and stop recognizing that concept in input images. It introduces UUBench, a benchmark with 30 target concepts and 60 related concepts for measuring forgetting across both tasks. Existing methods that focus on generation or understanding often fail to forget the concept in both pathways, even when combined. The proposed UniForget achieves stronger joint forgetting, while analysis shows a trade-off between forgetting and preserving other capabilities.'}, 'zh': {'title': '让多模态模型同时忘掉如何生成与识别目标概念', 'desc': '本文研究统一多模态模型中的跨路径概念遗忘，目标是让模型既不生成指定概念的图像，也无法在输入图像中识别该概念，同时保留其他能力。作者提出 UUBench 基准，涵盖 30 个目标概念及 60 个语义相关的邻近概念，用于评估遗忘效果。实验发现，现有只针对生成或理解单一路径的方法，以及两者的直接组合，都难以同时有效遗忘目标概念。为此，作者提出 UniForget，在两种模型上实现了 80.0% 和 92.7% 的联合遗忘率，并分析了遗忘效果与能力保留之间的权衡。'}}}, {'id': 'https://huggingface.co/papers/2610.39251', 'title': 'Where to Learn and How Far to Roll Out: Efficient Adaptive Training for GUI Agents', 'url': 'https://huggingface.co/papers/2610.39251', 'abstract': 'Abstract A two-stage adaptive framework improves multi-step GUI agent training by using intermediate checkpoints and selective rollout ranges to reduce environment interactions while boosting performance.  Generated by thinkingmachines/Inkling-Small Trajectory-level GRPO is a common approach for training multi-step GUI agents, but repeatedly rolling out complete trajectories from the task root can be inefficient: task-level rewards provide coarse supervision over which intermediate decisions require improvement, while already-mastered prefixes are repeatedly re-executed before reaching difficult states. We introduce a two-stage adaptive training framework that jointly addresses where to learn and how far to roll out. We first construct reusable intermediate checkpoints from successful expert trajectories and select informative pivots using action disagreement, which measures uncertainty directly from sampled GUI actions. Stage I performs one-step RL at these pivots to improve uncertain local decisions. Stage II then progressively expands policy responsibility through adaptive Local, Suffix, and Root training according to task progress. Recoverable checkpoints enable repeated training from intermediate states without replaying the preceding trajectory. Across MobileGym and CUA-Gym-Hub, our method reduces environment interaction by 56-61% relative to Vanilla GRPO while improving task performance, demonstrating that jointly allocating training across states and rollout ranges can substantially improve GUI-agent RL efficiency.', 'score': 2, 'issue_id': 3496, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '2c3fa04ff91f1366', 'authors': ['Yuxiang Chai', 'Quyu Kong', 'Panrong Tong', 'Steven Hoi', 'Yue Wang'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'MMLab, The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.39251.jpg', 'data': {'categories': ['#reasoning', '#rl', '#optimization', '#agents', '#training'], 'emoji': '🧭', 'ru': {'title': 'Учим агента там, где он ошибается, а не с самого начала', 'desc': 'Статья предлагает двухэтапную адаптивную схему обучения GUI-агентов с помощью RL и алгоритма GRPO. На первом этапе из успешных экспертных траекторий строятся промежуточные чекпоинты, а опорные состояния (pivots) выбираются по метрике action disagreement, отражающей неопределенность действий LLM-агента. На втором этапе глубина развертки постепенно расширяется от Local к Suffix и Root обучению в зависимости от прогресса задачи. Такой подход сокращает число взаимодействий с окружением на 56-61% по сравнению с Vanilla GRPO и при этом повышает качество выполнения задач.'}, 'en': {'title': 'Train at the Hard Parts, Not from the Start', 'desc': 'The paper presents a two-stage method for training GUI agents with fewer environment interactions and better task performance. First, it creates checkpoints from successful expert trajectories and uses disagreement among sampled actions to find uncertain decisions, then improves those decisions with one-step reinforcement learning. Next, it gradually expands training from local actions to suffixes and full tasks as the agent makes progress. On MobileGym and CUA-Gym-Hub, the method uses 56–61% fewer environment interactions than Vanilla GRPO while improving performance.'}, 'zh': {'title': '从关键检查点出发，让 GUI 智能体少走重复路', 'desc': '本文提出一种两阶段自适应训练框架，让多步 GUI 智能体减少重复操作并提升任务表现。首先，框架从成功的专家轨迹中建立可复用的中间检查点，并用动作分歧度衡量不确定性，挑选值得改进的决策点；第一阶段在这些位置进行单步强化学习。第二阶段根据任务进展，自适应地从局部训练扩展到后缀训练和根节点训练，使策略逐步承担更长的轨迹。实验显示，该方法在两个基准上比 Vanilla GRPO 减少 56%–61% 的环境交互，同时提升任务性能。'}}}, {'id': 'https://huggingface.co/papers/2611.04785', 'title': 'Kierston & KierstonBench: Simulation of Allentown, PA and Evaluation of Language Models in Crime Investigation and Surveillance Tasks', 'url': 'https://huggingface.co/papers/2611.04785', 'abstract': "Abstract Kierston and KierstonBench provide a simulated city-scale environment to evaluate large language models on criminal investigation tasks using linked surveillance records, revealing that only frontier models perform reliably while remaining vulnerable to deception.  Generated by thinkingmachines/Inkling-Small Large language models are candidates for collecting and analyzing records in criminal investigations and mass surveillance. Their capability and accuracy in this work cannot currently be measured. Real deployments lack the ground truth needed to score a model's conclusions, and no benchmark evaluates these capabilities in a simulated environment. We present Kierston, a city-scale simulation engine, and KierstonBench, a benchmark that tests these capabilities against known simulated events. Kierston models approximately 125,000 residents of Allentown, Pennsylvania, generating their daily activities and the telecommunications, financial, administrative and license-plate records that surveillance and investigative systems collect about them. These records derive from a common behavioral timeline and are distributed across sources representing separate providers. Models investigate through a restricted records interface, linking observations across sources without access to the underlying simulation. The benchmark comprises 32 task families covering record linkage, routine reconstruction, incident investigation and assessment of deceptive accounts. In an evaluation of sixteen language models, most could not perform records investigation and submitted identifications the records did not support. A small number of frontier models solved most of the tasks and abstained when evidence was insufficient. In some cases these models still fell for common deceptions and assumptions, and none replaced an investigator.", 'score': 1, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '5a5e6e97e0f37e85', 'authors': ['Andrew Semenov', 'Svyatoslav Dorofeev'], 'affiliations': ['Kiz8 Team'], 'pdf_title_img': 'assets/pdf/title_img/2611.04785.jpg', 'data': {'categories': ['#leakage', '#ethics', '#dataset', '#security', '#agents', '#benchmark'], 'emoji': '🕵️', 'ru': {'title': 'Языковые модели пока не заменят следователя: без проверки на ground truth им нельзя доверять расследования', 'desc': 'В статье представлены Kierston, симулятор городской среды на основе около 125 000 виртуальных жителей Аллентауна, и KierstonBench, бенчмарк из 32 задач для оценки LLM в расследованиях по записям сотовой связи, финансовым, административным данным и данным о номерах автомобилей. Модели работают через ограниченный интерфейс записей и должны связывать наблюдения из разных источников без доступа к истинной симуляции, что позволяет проверять качество record linkage и выводов по известному ground truth. Эксперименты на шестнадцати моделях показали, что большинство из них не справляется с задачей и выдает идентификации, не подтвержденные данными, тогда как лишь несколько frontier-моделей решают большинство задач и воздерживаются от ответа при недостатке доказательств. Однако даже лучшие модели уязвимы к распространенным обманам и ложным допущениям, поэтому ни одна из них не может заменить следователя.'}, 'en': {'title': 'Test the evidence before trusting the model', 'desc': 'Kierston simulates a city of about 125,000 people and generates linked surveillance records based on their daily activities. KierstonBench tests whether language models can investigate events by querying records from separate sources and connecting the evidence. Across 32 task families, most of the 16 models made unsupported identifications, while a few frontier models solved most tasks and abstained when evidence was insufficient. Even the strongest models sometimes fell for deception, so the benchmark suggests they cannot replace human investigators.'}, 'zh': {'title': '以城市级模拟检验大模型调查能力：能关联证据，仍难免受骗', 'desc': '本文提出 Kierston 城市规模模拟器和 KierstonBench 基准，用于评估大语言模型分析刑事调查记录的能力。模拟环境包含约 12.5 万名居民的活动，以及来自电信、金融、行政和车牌系统的关联记录；模型只能通过受限接口检索记录，无法查看真实事件。基准涵盖 32 类任务，包括跨来源记录关联、日常活动重建、事件调查和识别欺骗性陈述。对 16 个模型的评估发现，只有少数前沿模型能可靠完成多数任务并在证据不足时弃答，但它们仍可能受骗，因此不能取代调查人员。'}}}, {'id': 'https://huggingface.co/papers/2611.02476', 'title': 'GigaSpeech 3: Scaling Multi-Dialect Arabic Speech Recognition with Weakly Labeled Data', 'url': 'https://huggingface.co/papers/2611.02476', 'abstract': 'Abstract GigaSpeech 3 provides 39,000 hours of weakly transcribed dialectal Arabic speech, enabling improved recognition across five dialects via self-supervised labeling and noisy-student refinement.  Generated by thinkingmachines/Inkling-Small Dialectal Arabic speech recognition remains constrained by the scarcity of dialect-resolved transcribed speech despite the abundance of web audio. We introduce GigaSpeech 3, a corpus of 39,000 hours and 10 million weakly transcribed speech segments covering Algerian, Egyptian, Iraqi, Saudi, and Syrian Arabic. Starting from 60 hours of manual transcription per dialect, we train labeling models using speech-recognition-biased self-supervised learning and apply them to dialect-matched web audio. Data selection and four rounds of noisy-student refinement for Saudi and Syrian Arabic yield the final corpus. We validate its utility through dialect-specific and multi-dialect speech recognition training and cross-domain evaluation. On GigaSpeechBench, the final dialect-specific models outperform their labeling models across all five dialects and achieve a macro-average word error rate of 23.86%, a 16.6% relative reduction from the strongest third-party system covering all five dialects, while outperforming the best third-party result on three dialects. A multi-dialect model using self-predicted dialect identities achieves a macro-average word error rate of 25.51% while also supporting Modern Standard Arabic. Across eight conditions from three external corpora, a GigaSpeech 3-trained Zipformer achieves the lowest word error rate among six evaluated models in every condition, while adapting the Qwen3 speech recognizer on GigaSpeech 3 improves performance across all eight conditions. We release the corpus and recipes as a foundation for dialect-aware Arabic speech processing.', 'score': 1, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'b5ded65449971c15', 'authors': ['Junzhe Liu', 'Yujie Tu', 'Yifan Yang', 'Peng Wang', 'Haoran Wang', 'Guodong Lin', 'Leyan Liao', 'Chengquan Zhang', 'Zhifu Gao', 'Xiangang Li', 'Qinyuan Cheng', 'Xipeng Qiu', 'Wei-Qiang Zhang', 'Guoguo Chen', 'Kai Yu', 'Xie Chen'], 'affiliations': ['Alibaba Token Foundry', 'Dalian University of Technology', 'Fudan University', 'Seasalt.ai', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'SpeechColab', 'The Chinese University of Hong Kong, Shenzhen', 'Tsinghua University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2611.02476.jpg', 'data': {'categories': ['#training', '#low_resource', '#dataset', '#synthetic', '#multilingual', '#open_source', '#benchmark', '#data', '#audio'], 'emoji': '🎙️', 'ru': {'title': 'Тысячи часов диалектной арабской речи для точного распознавания', 'desc': 'Статья представляет GigaSpeech 3 — корпус из 39 000 часов диалектной арабской речи и 10 миллионов слабо размеченных сегментов для пяти диалектов. Разметка выполняется моделями, обученными через self-supervised learning с учётом распознавания речи, а затем данные уточняются методом noisy-student refinement. Модели, обученные на этом корпусе, превосходят сторонние системы по WER и показывают улучшения на внешних датасетах, в том числе при дообучении Qwen3 ASR. Авторы публикуют корпус и рецепты как основу для диалектно-ориентированной обработки арабской речи.'}, 'en': {'title': 'More Dialectal Speech, Better Arabic Recognition', 'desc': 'GigaSpeech 3 is a dataset containing 39,000 hours of weakly transcribed speech across five Arabic dialects. The researchers use self-supervised learning to build speech-recognition labeling models, then improve the labels through data selection and repeated noisy-student training. Models trained on the resulting corpus achieve lower word error rates than earlier systems, including on speech from external datasets. The corpus and training recipes provide resources for building speech recognizers that handle Arabic dialects and Modern Standard Arabic.'}, 'zh': {'title': '用海量弱标注语音，让阿拉伯方言识别更进一步', 'desc': '这篇论文发布了 GigaSpeech 3，一个包含 3.9 万小时弱转录语音、覆盖五种阿拉伯方言的数据集。研究者从每种方言约 60 小时的人工转录开始，利用面向语音识别的自监督学习训练标注模型，再为网络音频生成标签，并通过数据筛选和“噪声学生”迭代改进数据。实验显示，基于该数据集训练的方言专用模型在五种方言上的平均词错误率为 23.86%，多方言模型也能支持现代标准阿拉伯语。跨数据集评测中，使用该数据训练或适配的模型在所有八种测试条件下都取得了更好的识别效果。'}}}, {'id': 'https://huggingface.co/papers/2611.03183', 'title': 'Auto-Research Agent on MSA Organization to Improve Protein-Protein Complex Structure Prediction', 'url': 'https://huggingface.co/papers/2611.03183', 'abstract': "Abstract An autonomous agent adaptively designs target-specific multiple sequence alignments for AlphaFold 3 by reasoning over biological hypotheses and self-directed experimentation, improving protein interface prediction with fewer sequences.  Generated by thinkingmachines/Inkling-Small Protein-complex structure prediction with AlphaFold 3 depends on MSA content, depth, and cross-chain pairing. Current pipelines apply uniform recipes, typically maximizing depth and pairing by species, yet even whether cross-chain pairing helps AF3 remains contested. We show that the value of both depth and pairing is strongly target-dependent, so no single recipe is optimal across interfaces. We introduce an autonomous agent that treats a frozen AF3 as a black-box experimental instrument. For each target, the agent formulates biological hypotheses, analyzes and reorganizes the MSA, and iteratively refines sequence selection and pairing using predictor label-free signals alone. On 1{,}015 protein--protein interfaces from three benchmarks released after AF3's training cutoff, the agent improves overall interface DockQ over AF3's default pipeline and fixed MSA recipes on every benchmark, while using on average 60\\% fewer MSA sequences than the default. Gains are largest for inter-species heteromers, where species-based pairing is unreliable: mean DockQ increases from 0.465 to 0.612 on FoldBench and from 0.482 to 0.562 on HD439. The improvements arise from both sequence construction and pairing policy, including deliberate non-pairing.These results recast MSA design as a target-specific problem and show that an autonomous agent can adapt it at test time through biological reasoning and self-directed, confidence-guided experimentation.", 'score': 1, 'issue_id': 3497, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'f3212fdc18f655f6', 'authors': ['Zilu Zhang', 'Jing Bao', 'Lifeng Qiao', 'Sheng Xu', 'Qiantai Feng', 'Siqi Sun', 'Yang Yang'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.03183.jpg', 'data': {'categories': ['#optimization', '#agents', '#science', '#benchmark'], 'emoji': '🧬', 'ru': {'title': 'Каждой мишени — свой MSA: агент подбирает выравнивание под белок', 'desc': 'Статья показывает, что оптимальный способ подбора и выравнивания последовательностей (MSA) для AlphaFold 3 сильно зависит от конкретной белковой мишени, поэтому универсальные рецепты не работают. Авторы представляют автономного агента, который рассматривает замороженную модель AF3 как «чёрный ящик», формулирует биологические гипотезы и итеративно отбирает последовательности и правила спаривания, опираясь только на label-free сигналы уверенности предсказания. Эксперименты на 1015 интерфейсах белок-белок показывают рост DockQ относительно стандартного пайплайна при использовании в среднем на 60% меньше последовательностей MSA. Наибольший выигрыш получен для межвидовых гетеромеров, где спаривание по видам ненадёжно.'}, 'en': {'title': 'One alignment recipe doesn’t fit every protein', 'desc': 'The paper presents an autonomous agent that customizes multiple sequence alignments (MSAs) for each protein complex before prediction with AlphaFold 3. It treats the frozen predictor as a black box, using biological hypotheses and confidence signals to test different sequence selections and cross-chain pairing strategies without requiring labeled examples. Across three benchmarks, its target-specific MSAs improve interface DockQ scores over standard pipelines while using about 60% fewer sequences on average. The largest gains occur for complexes from different species, where pairing sequences by species can be unreliable; sometimes leaving chains unpaired works better.'}, 'zh': {'title': '让 MSA 因目标而变：自主实验提升 AlphaFold 3 界面预测', 'desc': 'AlphaFold 3 的蛋白质复合物预测效果会受到多序列比对（MSA）的序列数量、内容和链间配对方式影响，而且最佳设置因目标蛋白而异。研究提出一种自主智能体：它把冻结的 AlphaFold 3 当作黑箱实验工具，根据生物学假设调整 MSA，并利用模型的置信度信号反复筛选序列和配对方式。该方法在三个基准的 1,015 个蛋白质界面上都优于默认流程和固定方案，平均使用的 MSA 序列还减少了约 60%。在跨物种异源复合物上提升尤其明显，结果表明 MSA 设计应针对每个目标进行，并可通过自主实验在推理阶段优化。'}}}, {'id': 'https://huggingface.co/papers/2611.05255', 'title': 'Going Deeper With Memories', 'url': 'https://huggingface.co/papers/2611.05255', 'abstract': 'Abstract DeepMem is a causal multiscale byte-level architecture that uses invertible subband transforms and fast weight memory to compress sequences for efficient reasoning while preserving exact byte identity via lossless carriers and attention-based super-resolution decoding.  Generated by thinkingmachines/Inkling-Small Byte level language models avoid tokenizer dependence and provide universal coverage, but processing every byte at full resolution is expensive. We introduce DeepMem, a causal multiscale architecture that separates semantic compression from exact byte preservation. A learned invertible subband transform constructs a hierarchy of shorter sequences, while a lossless carrier and explicit detail sidebands preserve byte identity. Fast weight memory blocks operate along the encoder, with iterative shared state computation at the compressed bottleneck, while an attention based super resolution decoder restores byte resolution representations. DeepMem achieves stronger language modeling performance than a matched byte level Transformer on FineWeb-Edu and PG19, and obtains the best macro average performance across the evaluated FLORES languages. It also improves PIQA accuracy while remaining competitive on code modeling, multiple choice reasoning, and byte level corruption robustness. Bottleneck refinement requires approximately 7{,}600times fewer counted FLOPs than equivalent full resolution reasoning, while maintaining competitive evaluation throughput.', 'score': 1, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '68510ab5a2ee4a68', 'authors': ['Afshin Khadangi'], 'affiliations': ['SnT, University of Luxembourg'], 'pdf_title_img': 'assets/pdf/title_img/2611.05255.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#multilingual', '#architecture', '#machine_translation', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Сжимай смысл, сохраняй каждый байт', 'desc': 'DeepMem — это каузальная многомасштабная архитектура уровня байтов, которая отделяет семантическое сжатие от точного сохранения байтов. Обучаемое обратимое subband-преобразование строит иерархию более коротких последовательностей, а lossless carrier и детальные sideband-каналы сохраняют идентичность каждого байта. Блоки fast weight memory работают в энкодере, итеративное вычисление общего состояния выполняется в сжатом bottleneck, а декодер на основе attention восстанавливает представления на полном разрешении байтов. Модель превосходит байтовый Transformer по language modeling на FineWeb-Edu и PG19 и требует примерно в 7 600 раз меньше FLOPs для рассуждений в bottleneck.'}, 'en': {'title': 'Compress for Efficient Reasoning, Preserve Every Byte', 'desc': 'DeepMem is a causal, multiscale byte-level language model that reduces computation by reasoning over shorter, compressed sequences. A learned invertible transform builds these sequences, while lossless carriers and detail sidebands preserve the exact original bytes. Fast weight memory processes the compressed representation, and an attention-based decoder reconstructs representations at full byte resolution. DeepMem outperforms a comparable byte-level Transformer on several language modeling benchmarks and uses far fewer FLOPs for bottleneck refinement than full-resolution reasoning.'}, 'zh': {'title': '压缩序列高效推理，原始字节无损还原', 'desc': 'DeepMem 是一种因果多尺度字节级架构，目标是在减少计算量的同时保留原始字节信息。它通过可学习的可逆子带变换缩短序列，并用无损载体和细节侧带确保字节内容能够精确还原。模型在压缩后的瓶颈表示上使用快速权重记忆进行推理，再由基于注意力的超分辨率解码器恢复到字节级表示。在多个语言建模和推理基准上，DeepMem 的表现优于或接近对照模型，而且瓶颈推理所需的计算量大幅降低。'}}}, {'id': 'https://huggingface.co/papers/2611.03747', 'title': 'Enhancing Stock Market Information Retrieval with Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2611.03747', 'abstract': 'Abstract A retrieval-augmented generation system for stock market queries improves response accuracy and speed, validated by high ROUGE scores and low latency.  Generated by thinkingmachines/Inkling-Small Natural Language Processing (NLP) has been widely applied in financial domains, enabling automated analysis and retrieval of stock market information. However, traditional NLP-based systems often struggle with maintaining contextual accuracy and generating relevant responses in dynamic financial environments. To address these challenges, Retrieval-Augmented Generation (RAG) models have emerged as a powerful solution, combining retrieval-based methods with generative capabilities to enhance response quality. In this study, we present a Retrieval-Augmented Generation (RAG) system designed to generate responses related to stock market information. The system integrates retrieval-based and generative approaches to enhance the accuracy and relevance of financial text generation. To evaluate its effectiveness, we employ the ROUGE metric, specifically ROUGE-1, ROUGE-2, and ROUGE-L, to measure lexical and structural similarity between generated and reference texts. Experimental results on a dataset of 100 stock market-related queries demonstrate high ROUGE scores, indicating strong alignment with reference documents. Additionally, we assess latency to evaluate the system responsiveness, achieving an average response time of 1.16 seconds. These findings confirm that our RAG model is capable of providing accurate and timely stock market insights, making it a promising approach for financial information retrieval.', 'score': 1, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '2f4579fc4855d550', 'authors': ['Huan Phong Thai', 'Thu Anh Ngoc Le', 'Nhu Huynh Thi Le', 'Nhan Huu Tran', 'Lenh Cong Phan Pham', 'Hong Nhung Nguyen'], 'affiliations': ['Department of Software Engineering, FPT University, Can Tho, Viet Nam'], 'pdf_title_img': 'assets/pdf/title_img/2611.03747.jpg', 'data': {'categories': ['#science', '#rag', '#benchmark'], 'emoji': '📈', 'ru': {'title': 'RAG-система даёт точные и быстрые ответы о фондовом рынке', 'desc': 'Статья описывает RAG-систему (Retrieval-Augmented Generation) для ответов на вопросы о фондовом рынке, которая сочетает поиск релевантных документов с генеративной LLM. Такой подход повышает точность и актуальность ответов по сравнению с традиционными NLP-системами, которые плохо справляются с динамичным финансовым контекстом. Качество оценивалось метриками ROUGE-1, ROUGE-2 и ROUGE-L на 100 запросах и показало высокое лексическое и структурное совпадение с эталонными текстами. Среднее время ответа составило 1.16 секунды, что подтверждает применимость системы для быстрого получения финансовой информации.'}, 'en': {'title': 'Retrieve the facts, generate faster stock market insights', 'desc': 'The paper presents a retrieval-augmented generation (RAG) system for answering stock market questions. It retrieves relevant financial information and uses a language model to generate responses, aiming to improve accuracy and relevance. On 100 queries, the system achieved high ROUGE-1, ROUGE-2, and ROUGE-L scores, showing similarity to reference answers. Its average response time was 1.16 seconds, suggesting it can provide timely financial insights.'}, 'zh': {'title': '检索增强生成，让股票信息回答更准更快', 'desc': '本文提出一种用于回答股票市场问题的检索增强生成（RAG）系统，将信息检索与文本生成结合起来。系统先从相关资料中检索信息，再据此生成回答，以提升内容的准确性和相关性。研究使用100条股票市场问题进行评估，并以ROUGE-1、ROUGE-2和ROUGE-L衡量生成文本与参考文本的相似度。实验显示系统取得较高的ROUGE分数，平均响应时间为1.16秒，表明它能较快地提供贴合资料的市场信息。'}}}, {'id': 'https://huggingface.co/papers/2611.01598', 'title': 'QFabric: Guarded Cross-Domain Task Recovery and Its Limits on a Linux-RTOS Board', 'url': 'https://huggingface.co/papers/2611.01598', 'abstract': 'Abstract QFabric demonstrates that migrating tasks to a microcontroller on heterogeneous boards fails to isolate them from Linux interference, emphasizing that guarded recovery mechanisms are essential to prevent harmful migrations.  Generated by thinkingmachines/Inkling-Small Heterogeneous embedded boards pair a Linux application processor with a real-time microcontroller (MCU), which suggests moving a task between the two domains when its timing degrades. We present QFabric, a prototype that treats cross-domain placement as guarded recovery from a violated empirical soft real-time contract: a bounded task is compiled for both domains, monitored in windows with hysteresis, switched only after semantic and capacity admission at a quiescent epoch boundary, and committed or rolled back after probation. On an Arduino UNO Q (Cortex-A53 Linux and a Cortex-M33 running Zephyr), we characterize the stock Bridge RPC interconnect and measure five workloads in both domains under idle, CPU-load, and higher-priority SCHED_FIFO contention, with ordinary and real-time callers. Each MCU invocation costs about 19 ms of dispatch regardless of compute, the MCU runs the heaviest kernel 34x slower, and because every call traverses Linux userspace, Linux contention inflates the MCU path far more than the Linux path (p99 up to 400 ms versus 17.0 ms). Across 30 cells of a four-node chain, Linux meets every contract within 0.8% misses and QFabric correctly never migrates; a controller without hysteresis migrates in 7 cells, raising p95 by up to 177x, and probation rolls back 5 of those moves. On Linux-dispatched heterogeneous boards, migration therefore cannot isolate a task from Linux interference, and recovery guards matter chiefly by preventing harmful moves. This paper supersedes an earlier artifact release whose reported improvement arose from measurement defects that we identify. All source, raw traces, and generators are public.', 'score': 0, 'issue_id': 3498, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'a24e17f782676d3a', 'authors': ['Ayushman Bhattacharya', 'Anwesha Chakraborty'], 'affiliations': ['JIS University'], 'pdf_title_img': 'assets/pdf/title_img/2611.01598.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🔀', 'ru': {'title': 'Миграция между доменами не спасает от помех Linux: защита важнее переноса', 'desc': 'В статье представлен QFabric — прототип, который рассматривает перенос задачи между Linux-процессором приложений и микроконтроллером (MCU) как защищённое восстановление после нарушения мягкого real-time контракта. Система использует мониторинг в окнах с гистерезисом, переключает задачу только на quiescent-границе эпохи после проверки семантики и ёмкости, а затем фиксирует или откатывает перенос после probation-периода. Эксперименты на Arduino UNO Q показывают, что вызовы через Bridge RPC добавляют около 19 мс накладных расходов, а конкуренция в Linux сильно раздувает задержки пути через MCU (p99 до 400 мс против 17 мс). Итог: на платах с Linux-диспетчеризацией миграция не изолирует задачу от помех Linux, а защитные механизмы важны прежде всего для предотвращения вредных переносов.'}, 'en': {'title': 'Guard Every Migration: Moving Work to an MCU May Not Escape Linux', 'desc': 'QFabric studies whether moving a task from Linux to a microcontroller (MCU) can protect its timing on a heterogeneous board. It monitors soft real-time contracts and permits migration only after checks, at a safe task boundary, with a probation period and rollback. Experiments show that MCU calls still pass through Linux, so Linux contention can make them much slower; in the tested workloads, Linux met the timing contracts and migration was unnecessary. Without safeguards, a controller sometimes migrated tasks and sharply worsened their latency, showing why guarded recovery is important.'}, 'zh': {'title': '迁移不等于隔离：用防护机制挡住有害任务迁移', 'desc': '本文研究异构嵌入式板卡上的任务迁移：这类板卡同时配有运行 Linux 的应用处理器和实时微控制器（MCU）。QFabric 将跨处理器迁移设计为受保护的恢复机制，通过监控软实时期限、设置滞回，并在任务静止时检查语义与资源条件后，才尝试迁移；试运行失败则回滚。实验发现，MCU 调用必须经过 Linux 用户空间，因而 Linux 竞争会显著增加 MCU 路径的延迟，迁移无法隔离这种干扰，甚至可能使性能变差。滞回和试运行回滚等防护措施能阻止有害迁移；论文还指出，先前版本所报告的性能提升源于测量缺陷。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (25)', '#agi (1)', '#alignment (4)', '#architecture (11)', '#audio (3)', '#benchmark (33)', '#cv (8)', '#data (14)', '#dataset (12)', '#diffusion (3)', '#ethics (3)', '#games (5)', '#graphs', '#hallucinations (1)', '#healthcare (2)', '#inference (11)', '#interpretability (2)', '#leakage (1)', '#long_context (3)', '#low_resource (2)', '#machine_translation (2)', '#math (2)', '#multilingual (3)', '#multimodal (13)', '#open_source (10)', '#optimization (25)', '#plp (3)', '#rag (3)', '#reasoning (11)', '#rl (7)', '#rlhf (2)', '#robotics (6)', '#science (6)', '#security (3)', '#small_models (4)', '#story_generation', '#survey (4)', '#synthetic (12)', '#training (25)', '#transfer_learning (2)', '#video (7)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-04 20:12',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-04 20:12')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-04 20:12')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
