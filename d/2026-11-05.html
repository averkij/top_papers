    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.05275', 'title': 'Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems', 'url': 'https://huggingface.co/papers/2611.05275', 'abstract': 'Abstract Route Anything is a framework for dynamically selecting and coordinating specialized AI models and policies across diverse tasks to improve performance and efficiency.  Generated by thinkingmachines/Inkling-Small Artificial general intelligence (AGI) requires a method that can understand, generate, reason, and act across diverse domains and modalities. Rather than relying on a single model to master every capability, a promising path toward AGI now is to orchestrate a heterogeneous ecosystem of specialized models, tools, and policies (candidates) into a unified AI system. At the heart of this vision lies a fundamental question: how can an AI system dynamically select and coordinate the most capable candidate for each task while balancing performance and computational cost? In this work, we present Route Anything, a unified framework for studying model and policy routing across general-purpose AI systems. We develop a unified theoretical foundation that characterizes optimal routing under quality--cost trade-offs and establishes how the information available to a router determines its attainable performance. To systematically investigate routing across diverse capabilities, we first construct an omni-modal trajectory matrix spanning 25 benchmarks across language understanding, image, video, and speech generation, coding and workplace agents, and robotic manipulation, comprising 374,401 scored runs from 452 candidate configurations. Building on this framework, we train and test different routers to investigate the potential of omni-modal model routing, the capabilities of learned routers, and the conditions under which routing improves efficiency. Our results reveal substantial opportunities for capability orchestration: per-input oracle routing outperforms the best fixed candidate by 5.4 points, and learned routers outperform it by 0.3 points across 16 benchmarks, by 2.1 points on video generation, and by 1.1 points on robot manipulation while using 24% less policy time. More importantly, routing raises efficiency by 8.82x on average compared with the reference model.', 'score': 83, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'b1a92ec35f0f9d91', 'authors': ['Pengfei Zhou', 'Yixing Ma', 'Hexin Wang', 'Weidong Tang', 'Zhenglin Wan', 'Wangbo Zhao', 'Yang You'], 'affiliations': ['Cardinal AI Lab', 'HPC-AI Lab', 'Hong Kong University of Science and Technology', 'Inf Rec', 'National University of Singapore', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.05275.jpg', 'data': {'categories': ['#video', '#multimodal', '#cv', '#optimization', '#agi', '#games', '#agents', '#benchmark', '#data', '#robotics', '#inference', '#audio'], 'emoji': '🧭', 'ru': {'title': 'Не одна модель, а оркестр специалистов: умная маршрутизация повышает качество и экономит ресурсы', 'desc': 'Route Anything — это фреймворк, который динамически выбирает и координирует множество специализированных AI-моделей и политик (policies) для разных задач. Авторы строят теоретическую основу маршрутизации с учётом компромисса между качеством и вычислительной стоимостью и показывают, как информация, доступная роутеру, ограничивает достижимую производительность. Для экспериментов собрана omni-modal trajectory matrix из 25 бенчмарков (текст, изображения, видео, речь, код, робототехника) и 374 401 оценённых запусков от 452 конфигураций. Результаты показывают, что обученные роутеры превосходят лучшую фиксированную модель, а маршрутизация повышает эффективность в среднем в 8.82 раза по сравнению с референсной моделью.'}, 'en': {'title': 'Route Each Task to the Right AI', 'desc': 'Route Anything studies how to route tasks to specialized AI models and policies rather than relying on one model for everything. It provides a framework for choosing candidates while balancing task quality against computational cost, and examines how a router’s available information affects its choices. The researchers evaluate 452 candidate configurations across 25 benchmarks covering language, images, video, speech, coding, workplace tasks, and robotics. Learned routers improve performance on several tasks while using less policy time, and routing achieves an average 8.82× efficiency gain over the reference model.'}, 'zh': {'title': '让合适的模型处理合适的任务', 'desc': '这篇论文提出 Route Anything，用于根据任务动态选择和协调不同的专用模型、工具与策略。研究建立了分析路由的理论框架，说明路由器可获得的信息如何影响表现，以及如何在任务质量与计算成本之间权衡。作者整理了涵盖语言、图像、视频、语音、编程、工作代理和机器人操作的基准数据，并训练路由器进行测试。结果显示，学习型路由器在多个任务上优于固定模型，平均效率提升 8.82 倍，并减少了策略运行时间。'}}}, {'id': 'https://huggingface.co/papers/2611.00617', 'title': 'Words Caught in the Heart: Simulating Person-Specific Expression for Self-Opaque Clients in Psychotherapy', 'url': 'https://huggingface.co/papers/2611.00617', 'abstract': "Abstract Pandora is a psychotherapy client simulation framework that models evolving psychological and relational states to generate more authentic, individually aligned expressions and reduce AI-like responses.  Generated by thinkingmachines/Inkling-Small Psychotherapy clients may experience distress before they can coherently describe it, and their expression changes with emotion, perceived safety, and trust. Large language model-based client simulators often rely on clinically organized case descriptions, which can encourage responses explaining the client's difficulties more clearly than their current understanding warrants. We propose Pandora, a psychotherapy client simulation framework that models how psychological experience becomes situated, individual expression. Pandora updates psychological and relational states in response to therapist interventions, constructs subjective appraisals and attributions, and plans response content and strategy. A separate expression planner combines these decisions with language patterns distilled from the client's utterances to guide linguistic realization. We evaluate Pandora against five baselines on 115 cases from four counseling and motivational interviewing datasets. It achieves the highest expression similarity and overall disclosure-alignment score among the compared systems. In a four-evaluator study of 45 matched disclosure items, Pandora receives AI-like judgments in 7.2% of ratings, compared with 43.3--67.2% for the baselines and 35.6% without expression planning. The ablation also reduces expression similarity. These results support explicit expression planning in client simulation to improve alignment with individual language patterns and reduce perceived AI-like expression in the evaluated setting.", 'score': 67, 'issue_id': 3497, 'pub_date': '2026-10-31', 'pub_date_card': {'ru': '31 октября', 'en': 'October 31', 'zh': '10月31日'}, 'hash': '8b0cb6695f9c4f53', 'authors': ['Mengxi Xiao', 'Jingjing Chen', 'Ziyan Kuang', 'Jiarong Song', 'Wenhao Zhao', 'Zuchen Han', 'Yihuai Xu', 'Xiyang Huang', 'Jie Gong', 'Yuechen Jiang', 'Xueqing Peng', 'Yankai Chen', 'Xiaoyan Qu', 'Min Peng', 'Qianqian Xie'], 'affiliations': ['Cognitive Language and Information Lab', 'Huazhong Agricultural University', 'Mohamed bin Zayed University of Artificial Intelligence', 'University of Manchester', 'Wuhan University', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2611.00617.jpg', 'data': {'categories': ['#agents', '#healthcare', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Клиент, который звучит как живой человек, а не как ИИ', 'desc': 'Pandora — это фреймворк для симуляции клиента психотерапии, который моделирует эволюционирующие психологические и relational-состояния клиента. Система обновляет эти состояния после вмешательств терапевта, формирует субъективные оценки и атрибуции, а отдельный expression planner переводит решения в язык, опираясь на языковые паттерны конкретного клиента. На 115 кейсах из четырёх датасетов Pandora показала наибольшее сходство выражений и лучшее соответствие раскрытия, а в оценке людьми доля AI-like ответов составила всего 7.2% против 43.3–67.2% у baseline-моделей. Результаты подтверждают, что явное планирование выражения в LLM-симуляторах клиентов делает ответы более аутентичными и индивидуальными.'}, 'en': {'title': 'Plan the client’s feelings and words for more human-like therapy conversations', 'desc': 'Pandora is a framework for simulating psychotherapy clients whose feelings, trust, and sense of safety change during a conversation. It updates psychological and relationship states in response to a therapist, then plans what the client might think, disclose, and say. A separate expression planner uses language patterns from the client’s earlier utterances to make replies sound more individual. Across 115 cases, Pandora scored highest among five systems for expression similarity and disclosure alignment, and evaluators judged its replies as AI-like less often.'}, 'zh': {'title': '先模拟感受，再说出属于来访者的话', 'desc': 'Pandora 是一个心理治疗来访者模拟框架，它会根据治疗师的回应持续更新来访者的心理状态和关系状态。它还会模拟来访者如何理解自身经历，并规划要表达的内容与表达方式；表达规划器会参考来访者过往的语言习惯生成回复。在115个案例的评估中，Pandora的表达相似度和披露对齐得分高于五种基线系统。评审者认为Pandora的回复像AI的比例较低，结果表明显式规划表达有助于生成更贴合个体语言风格的模拟回复。'}}}, {'id': 'https://huggingface.co/papers/2611.04814', 'title': 'Think Less, Locally: Local Preference Learning for Reasoning Compression', 'url': 'https://huggingface.co/papers/2611.04814', 'abstract': "Abstract LoCo uses local preference learning to teach reasoning models when to stop deliberating, reducing output length substantially while preserving or improving accuracy across math and code tasks.  Generated by thinkingmachines/Inkling-Small Large reasoning models achieve strong performance on challenging tasks, but their long chain-of-thought often incurs substantial inference costs by continuing to deliberate after sufficient information has been obtained. Existing reasoning compression methods primarily operate on reasoning trajectories, paying less attention to the local decision of whether further reasoning is necessary given the current state. We propose LoCo, a local preference learning method for reasoning compression. LoCo detects candidate overthinking states from the model's own traces, freezes the corresponding reasoning prefixes, regenerates shorter verified continuations from the same states, and trains on the resulting state-conditioned preference pairs with DPO. This formulation teaches the model when to continue reasoning and when to conclude, rather than simply encouraging shorter trajectories overall. We construct training data entirely from self-generated mathematical traces and evaluate LoCo on five mathematical and three code generation benchmarks. LoCo reduces completion length by 41.7\\%--45.4\\% on mathematics and 23.4\\%--36.3\\% on code, while maintaining or improving accuracy and achieving the best AUC across all code benchmarks. LoCo consistently improves the accuracy-efficiency trade-off on mathematics and transfers effectively to code generation despite math-only training, demonstrating the cross-domain generality of local preference learning for reasoning compression. The code and model will be publicly released at https://github.com/MuyaoYuan/LoCo.", 'score': 64, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '400ff0a4674eae32', 'authors': ['Muyao Yuan', 'Liyan Xu', 'Weizhan Zhang', 'Muyan Jiao', 'Jiangnan Li', 'Jinchao Zhang', 'Jie Zhou'], 'affiliations': ["MOE KLINNS, School of Computer Science and Technology, Xi'an Jiaotong University", 'WeChat AI, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.04814.jpg', 'data': {'categories': ['#rlhf', '#training', '#optimization', '#math', '#reasoning', '#open_source', '#benchmark', '#plp', '#inference', '#alignment'], 'emoji': '🧠', 'ru': {'title': 'Учим модель вовремя остановиться и дать ответ', 'desc': 'Статья представляет LoCo — метод локального обучения предпочтениям (local preference learning) для сжатия рассуждений больших reasoning-моделей. Метод находит состояния, где модель избыточно «думает», замораживает префиксы рассуждений и генерирует более короткие проверенные продолжения, после чего обучает модель через DPO на парах предпочтений. Так модель учится понимать, когда продолжать рассуждение, а когда завершать его, а не просто сокращать все цепочки рассуждений целиком. Обучение проводится только на математических данных, но метод заметно сокращает длину ответов как в математике, так и в задачах генерации кода, сохраняя или улучшая точность.'}, 'en': {'title': 'Teach Models When to Stop Thinking', 'desc': 'LoCo teaches reasoning models when to stop thinking, reducing inference cost without sacrificing task performance. It finds points in generated reasoning traces where the model may be overthinking, then compares the original continuation with a shorter, verified one from the same prefix. Using these state-conditioned preference pairs, it applies Direct Preference Optimization (DPO) to train the model to continue or conclude appropriately. Across math and code benchmarks, LoCo substantially shortens outputs while maintaining or improving accuracy, and math-only training transfers effectively to code.'}, 'zh': {'title': '让模型知道何时该停：更短推理，不减准确率', 'desc': 'LoCo 是一种局部偏好学习方法，旨在教会推理模型判断何时应继续思考、何时可以结束。它从模型生成的推理轨迹中找出可能过度思考的状态，固定这些状态之前的推理前缀，再生成更短且经过验证的后续内容，并用 DPO 训练模型偏好这些续写。实验显示，LoCo 在数学任务中将生成长度缩短 41.7%–45.4%，在代码任务中缩短 23.4%–36.3%，同时保持或提升准确率。即使训练数据只来自数学推理，LoCo 也能有效迁移到代码生成，改善准确率与推理效率之间的权衡。'}}}, {'id': 'https://huggingface.co/papers/2611.02737', 'title': 'MoviEdit: Long-form Multi-Shot Video Editing Made Easy', 'url': 'https://huggingface.co/papers/2611.02737', 'abstract': 'Abstract MoviEdit is an end-to-end framework for long-form multi-shot video editing that uses cascaded bidirectional-autoregressive modeling and a new benchmark to maintain coherence across scenes while reducing manual data annotation.  Generated by thinkingmachines/Inkling-Small Long-form multi-shot video editing requires an intended edit to remain coherent across abrupt changes in scene, viewpoint, and subject appearance, while processing substantially longer visual context than conventional single-shot editors. We introduce MoviEdit, an end-to-end framework for scalable long-form multi-shot video editing that jointly addresses the challenges of data, modeling, and evaluation. To provide cross-shot supervision data at scale, we develop automatic data-generation pipelines spanning synchronized multi-view footage, real-world multi-shot videos, and generated multi-shot content, yielding 87K paired editing videos without manual annotation. Architecturally, MoviEdit employs a cascaded bidirectional-autoregressive design: a lightweight bidirectional stage first establishes a globally coherent editing draft over a spatiotemporally compressed representation, which is then autoregressively propagated and refined over the full video. We further introduce MoviEdit-Bench, a dedicated benchmark for systematic evaluation of long-form multi-shot video editing. Extensive experiments show that MoviEdit substantially outperforms existing open-source models and performs on par with industry frontier models across text-guided and image-guided editing. Visit our project page for complete results and to access the benchmark: https://multi-shot-edit.github.io/', 'score': 61, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '453f52284d1f881b', 'authors': ['Suhyeon Lee', 'Zhengang Li', 'Soo Ye Kim', 'Peihao Zhu', 'Jong Chul Ye', 'Chun-Hao Paul Huang', 'Duygu Ceylan', 'Yan Kang', 'Hyeonho Jeong'], 'affiliations': ['Adobe', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2611.02737.jpg', 'data': {'categories': ['#data', '#synthetic', '#architecture', '#video', '#dataset', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Монтаж длинного видео без швов: связность между кадрами без ручной разметки', 'desc': 'Статья представляет MoviEdit — end-to-end фреймворк для монтажа длинных многокадровых видео, который сохраняет связность при смене сцен, ракурсов и внешности персонажей. Авторы автоматически собрали около 87K парных обучающих видео без ручной разметки, используя мультиракурсные записи, реальные многокадровые ролики и сгенерированный контент. Архитектура построена на каскадной схеме: лёгкий bidirectional-этап создаёт глобально согласованный черновик на сжатом спатиотемпоральном представлении, который затем autoregressive-механизм распространяет и уточняет на всё видео. Вместе с фреймворком предложен бенчмарк MoviEdit-Bench, на котором MoviEdit превосходит открытые модели и сравним с индустриальными передовыми решениями в текстово- и изображение-управляемом редактировании.'}, 'en': {'title': 'Edit Every Shot as One Coherent Story', 'desc': 'MoviEdit is an end-to-end framework for editing long videos with multiple shots while keeping scenes visually coherent. It creates 87,000 paired training examples using automated data pipelines, avoiding manual annotation. Its cascaded model first creates a globally coherent draft on a compressed video representation, then autoregressively refines that draft across the full video. The authors also introduce MoviEdit-Bench for evaluation and report results that outperform existing open-source models and match leading industry models on text- and image-guided editing.'}, 'zh': {'title': '先统筹全片，再逐镜精修，让长视频编辑连贯如一', 'desc': 'MoviEdit 是一个端到端框架，用于编辑较长、包含多个镜头的视频，并帮助不同场景之间保持连贯。研究者通过自动化流程制作了 8.7 万组配对编辑视频，无需人工标注。模型先用双向处理建立整体连贯的编辑草稿，再通过自回归生成逐步处理和细化完整视频。研究还提出了 MoviEdit-Bench 评测基准；实验显示，该方法优于现有开源模型，效果可与领先的工业界模型相当。'}}}, {'id': 'https://huggingface.co/papers/2611.04916', 'title': 'Behind Video Generation: Observations and Insights on Multimodal Understanding from Kling', 'url': 'https://huggingface.co/papers/2611.04916', 'abstract': "Abstract Kling's multimodal understanding stack links caption density, perceptual text encoding, reward modeling, and evaluation protocols to improve controllable video generation.  Generated by thinkingmachines/Inkling-Small Video generation has progressed from isolated clips to coherent short-form audiovisual sequences, and the bottleneck is shifting from rendering to semantic control. This report summarizes the observations and insights on multimodal understanding gained from successive generations of Kling. We argue that generation quality is the projection of multimodal understanding through the entire data--conditioning--alignment--evaluation chain, and we examine this chain module by module. Kling-MLLM, a shared multimodal foundation model that unifies image, video, audio, synchronized audio--video, and interleaved inputs, is specialized for each downstream module. Because a DiT is trained on far fewer training samples than a language model, we treat captioning as a semantic contract that maximizes description density, and extend it to reference-grounded captioning that makes reference bindings explicit. Prompt enhancement translates user intent into this caption distribution: basic PE is derived from captions of compelling videos and refined with text-level and generator-in-the-loop reinforcement learning, while agentic PE refines the story and retrieves compelling examples. We show that a reliable text encoder comes from perceptual training rather than from stronger language ability, and that candidates can be screened from text alone before end-to-end training. Reward modeling pairs a general reward model for explainable, localized critiques with a decision reward model for fast multidimensional scoring, treating perceptual bandwidth as a first-class design parameter. Finally, we review task-specific automatic evaluation, focusing on protocols that expose scoring shortcuts and help trace failures to their upstream source. We hope these lessons offer practical guidance for building the understanding stack behind controllable video generation.", 'score': 51, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '76af3a69039a56d1', 'authors': ['Kling Team', 'Dong Chen', 'Jialu Chen', 'Xinlong Chen', 'Yifan Dai', 'Haotian Dong', 'Binzong Geng', 'Yushuo Guan', 'Minghui Guo', 'Guanlin He', 'Guanxiao He', 'Jingyun Hua', 'Yanwei Huang', 'Yiyan Ji', 'Xueping Jia', 'Yizhuo Jia', 'Bozhou Li', 'Jiaze Li', 'Min Li', 'Shihao Li', 'Shujie Li', 'Shengyi Liao', 'Weihong Lin', 'Shiyuan Liu', 'Xinyu Liu', 'Siyang Mao', 'Xiaoru Qu', 'Dianmo Sheng', 'Yang Shi', 'Jiafu Tang', 'Longxiang Tang', 'Yuqi Tang', 'Chengzhuo Tong', 'Kuo Wang', 'Qixun Wang', 'Rui Wang', 'Tianduo Wang', 'Yuran Wang', 'Zekun Wang', 'Zihao Wang', 'Boyang Xia', 'Yifan Xu', 'Liu Yang', 'Zhenlong Yuan', 'Bohan Zeng', 'Mujin Zhang', 'Yuanxing Zhang', 'Zhicheng Zhang', 'Zhuoran Zhang', 'Yuanhong Zheng', 'Kun Gai', 'Chengru Song', 'Pengfei Wan'], 'affiliations': ['Kling'], 'pdf_title_img': 'assets/pdf/title_img/2611.04916.jpg', 'data': {'categories': ['#data', '#rlhf', '#alignment', '#video', '#multimodal', '#audio', '#training', '#survey', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Качество видео начинается с понимания мультимодальных данных', 'desc': 'Статья описывает, как понимание мультимодальных данных (изображения, видео, аудио и их комбинации) влияет на качество генерации видео. Авторы представляют Kling-MLLM — общую мультимодальную foundation model, которая специализируется под разные модули: captioning с высокой плотностью описаний, prompt enhancement с RL, text encoder, обученный на перцептивных данных, и reward modeling. Отдельно рассматриваются автоматические метрики оценки, которые выявляют лазейки в скоринге и помогают находить источник ошибок. Работа даёт практические рекомендации по построению стека понимания для управляемой генерации видео.'}, 'en': {'title': 'Build Understanding Across the Pipeline for More Controllable Video', 'desc': 'The paper argues that controllable video generation depends on a full pipeline of multimodal understanding, from training data and captions to conditioning, reward alignment, and evaluation. It describes Kling-MLLM, a shared multimodal foundation model adapted to handle images, video, audio, and synchronized or mixed inputs. Dense, reference-grounded captions and prompt enhancement help translate user intent into useful generation conditions, while perceptual training makes text encoders better at matching visual content. The paper also recommends combining explainable and fast reward models with task-specific evaluations that reveal shortcuts and help trace failures to their source.'}, 'zh': {'title': '让多模态理解贯穿全链路，提升视频生成的可控性', 'desc': '本文总结了可控视频生成中的多模态理解流程，涵盖数据描述、条件输入、对齐和评估。作者提出，视频字幕应包含高密度语义信息，并明确描述文本与参考对象之间的对应关系。提示词增强会把用户意图转化为适合生成模型的描述；文本编码器则应通过感知训练提升对视觉内容的理解。论文还介绍了奖励模型与任务专用评估方法，用于发现生成问题并追溯其来源。'}}}, {'id': 'https://huggingface.co/papers/2611.05377', 'title': 'DreamX: Video Diffusion Model is a Universal Latent Action Learner', 'url': 'https://huggingface.co/papers/2611.05377', 'abstract': "Abstract DreamX leverages a pretrained video diffusion model to learn compact, appearance-invariant latent actions that enable cross-embodiment transfer and efficient policy learning.  Generated by thinkingmachines/Inkling-Small Learning a universal action representation from video requires modeling dynamics that are consistent across different executions of the same action yet invariant to changes in embodiment and appearance. Existing latent action models infer actions from visual transitions, but their representations often entangle the underlying action with irrelevant visual variations, limiting transfer across embodiments. We introduce DreamX, which repurposes a pretrained video diffusion model as a universal latent action learner. Our approach extracts compact latent actions from the video model's rich spatiotemporal features, compressing each latent video frame by 300times (1{,200 rightarrow 4} tokens). In addition, by leveraging the video model's generative prior, these latent actions capture action-relevant dynamics disentangled from visual appearance. The resulting latent space serves as a shared action interface across embodiments (human and robot), environments, and action parameterizations. On LARY-Bench, DreamX achieves state-of-the-art performance among latent action models. Moreover, actions encoded in one setting remain effective in another: the latent space supports any-to-any video transfer and zero-shot action transfer across diverse embodiments and environments. Furthermore, this shared interface also enables policy learning in a compact latent action space, reducing the computational cost of video-diffusion-based policies.", 'score': 49, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '1359940f64d7188f', 'authors': ['Jisoo Kim', 'Chaehyun Kim', 'Junsu Kim', 'Jiho Park', 'Seongchan Kim', 'Eunbeen Hong', 'Soowon Son', 'Fu-En Yang', 'Seungryong Kim'], 'affiliations': ['KAIST', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.05377.jpg', 'data': {'categories': ['#video', '#diffusion', '#training', '#cv', '#architecture', '#transfer_learning', '#benchmark', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Universal Action Language: одно латентное пространство действий для роботов и людей', 'desc': 'DreamX использует предобученную video diffusion модель как универсальный обучатель латентных действий, извлекая из её пространственно-временных признаков компактные представления, которые сжимают каждый кадр видео в 300 раз (с 1200 до 4 токенов). Благодаря генеративному prior модели эти латентные действия отделяют динамику, связанную с действием, от визуального внешнего вида, что делает их инвариантными к embodiment и окружению. Полученное латентное пространство служит общим интерфейсом для людей, роботов и разных параметризаций действий, обеспечивая state-of-the-art результаты на LARY-Bench, any-to-any перенос видео и zero-shot перенос действий. Кроме того, обучение policy в компактном латентном пространстве действий заметно снижает вычислительные затраты video-diffusion-based политик.'}, 'en': {'title': 'One compact action space for humans, robots, and new worlds', 'desc': 'DreamX uses a pretrained video diffusion model to learn compact latent actions from video. These actions capture motion dynamics while ignoring changes in appearance and embodiment, such as whether a human or robot performs the action. This shared representation enables transfer between different bodies and environments, including zero-shot transfer, and achieves state-of-the-art results among latent action models on LARY-Bench. It also supports policy learning in a smaller action space, reducing the computational cost of video-diffusion-based policies.'}, 'zh': {'title': '从视频中提炼通用潜在动作，让策略跨形态迁移', 'desc': 'DreamX 利用预训练视频扩散模型，从视频中学习紧凑且不依赖外观的潜在动作表示。它将每帧压缩为少量令牌，并借助模型的生成先验，把动作相关的动态与外观变化分离。由此得到的共享动作空间支持在人类与机器人、不同环境及动作参数化方式之间迁移，并在 LARY-Bench 上取得潜在动作模型中的领先表现。该表示还可用于紧凑潜在动作空间中的策略学习，降低基于视频扩散模型的策略计算成本。'}}}, {'id': 'https://huggingface.co/papers/2611.02497', 'title': 'RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild', 'url': 'https://huggingface.co/papers/2611.02497', 'abstract': 'Abstract RoboColosseum evaluates general robot policies across diverse embodiments and environments, revealing weak cross-embodiment agreement, limited open-world reliability, and substantial differences between zero-shot and fine-tuned performance.  Generated by thinkingmachines/Inkling-Small General-purpose robot policies must work across robots, tasks, and environments, yet the variation that makes physical trials informative also makes them difficult to reproduce. We introduce RoboColosseum, a distributed evaluation framework that combines unified policy serving and standardized protocols across a network of locally operated robots in diverse environments. Our initial study evaluates five vision-language-action (VLA) policies and three frontier AI agents across four embodiments (SO-101, Franka, Bimanual-YAM, and G1 Humanoid). The Open Track compares models without task-specific adaptation in blinded, pairwise trials under matched local conditions. The Fine-tune Track measures how well VLA policies adapt to 20 tasks across all four embodiments when each policy receives the same 100 demonstrations per task. Across 5,699 pairwise Open Track comparisons at 124 sites, frontier agents rival specialized VLA policies, while all systems struggle to complete open-world tasks reliably. After fine-tuning, GR00T N1.7 leads on SO-101 and pi0.5 leads on Franka and Bimanual-YAM. Policy rankings show weak agreement across embodiment-specific task suites (Kendall W = 0.24). Open Track rankings poorly predict relative performance after fine-tuning, with substantial rank reversals on all three embodiments shared between tracks. Measuring partial progress reveals differences that task success alone misses. On the G1 Humanoid, no policy completes any of the five tasks, yet average progress ranges from 13.3% to 23.2% across policies. Open Track rankings stabilize as trials accumulate, and active matchmaking achieves comparable ranking agreement with substantially fewer physical trials than uniform sampling. These results show how distributed physical evaluation can reveal where robot policies generalize, how well they adapt to new tasks, and how far they progress on tasks they fail to complete.', 'score': 43, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'da4f185d0aeeba8d', 'authors': ['Tan Sang Nguyen', 'Yi Ru Wang', 'Shailesh Shailesh', 'Gang Yang', 'Jiamo Hu', 'Jianuo Jiang', 'Haoquan Fang', 'Zhongzheng Ren', 'Zhongyi Luo', 'Ian Chong', 'Aaron Tung', 'Santiago Pravisani', 'Minghui Lin', 'Yao Mo', 'Ishneet Singh', 'Benjamin Tee', 'Harold Soh', 'Siddhartha Srinivasa', 'Dieter Fox', 'David Hsu', 'Haoming Song', 'Maxime Ellerbach', 'Thomas Wolf', 'Pepijn Kooijmans', 'Ruijie He', 'Michael Cho', 'Jiafei Duan'], 'affiliations': ['Allen Institute for AI', 'BitRobot', 'Hugging Face', 'National University of Singapore', 'Singapore Embodied AI Centre', 'Stanford University', 'University of North Carolina at Chapel Hill', 'University of Oxford', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.02497.jpg', 'data': {'categories': ['#games', '#optimization', '#agents', '#training', '#survey', '#benchmark', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Распределённая физическая оценка роботов выявляет то, что не видно в симуляции', 'desc': 'В статье представлен RoboColosseum — распределённая платформа для оценки универсальных роботизированных политик (robot policies) на разных роботах и в разных средах. Исследование охватывает пять VLA-моделей и три AI-агента на четырёх платформах, сравнивая их в режиме Open Track (без дообучения, попарные слепые тесты) и в режиме Fine-tune (100 демонстраций на задачу). Результаты показывают слабую согласованность рейтингов между роботами (Kendall W = 0.24), низкую надёжность в открытых средах и существенные расхождения между zero-shot и дообученными моделями. Авторы также показывают, что метрика частичного прогресса и адаптивный подбор пар (active matchmaking) позволяют получать стабильные оценки меньшим числом физических испытаний.'}, 'en': {'title': 'Test Robot Policies Across Bodies, Not Just Benchmarks', 'desc': 'RoboColosseum is a distributed framework for evaluating robot policies on different robots and in real-world environments. It compares vision-language-action policies and AI agents both without task-specific training and after fine-tuning on the same demonstrations. Results show that rankings vary across robot types, and success without fine-tuning does not reliably predict performance after fine-tuning. Measuring partial task progress and using active matchmaking can reveal useful differences while reducing the number of physical trials.'}, 'zh': {'title': '跨机器人实测，揭示策略泛化与适应的真实边界', 'desc': '本文提出 RoboColosseum，这是一个分布式评测框架，用统一的策略服务和标准化流程，在多种机器人及真实环境中评估通用机器人策略。研究比较了视觉-语言-动作（VLA）策略与前沿 AI 智能体，发现它们在开放环境任务中的可靠性都有限，不同机器人上的表现排名也只有较弱的一致性。使用每项任务 100 个示范进行微调后，表现最佳的策略会因机器人类型而异，而且零样本评测的排名难以预测微调后的表现。研究还表明，衡量任务完成进度能补充单纯的成功率；主动匹配也能用更少的实体试验获得相近的排名稳定性。'}}}, {'id': 'https://huggingface.co/papers/2611.05193', 'title': 'Factorized MLLM Embeddings for Composed Image Retrieval', 'url': 'https://huggingface.co/papers/2611.05193', 'abstract': "Abstract FactEmbed improves composed image retrieval by decoupling query understanding from embedding construction through factorized latents that simulate visual modifications before retrieval.  Generated by thinkingmachines/Inkling-Small Composed Image Retrieval (CIR) aims to retrieve a target image given a reference image and a modification text. Although recent approaches leveraging Multimodal Large Language Models (MLLMs) have shown significant progress, we argue that the MLLM's compositional understanding remains underutilized. This stems from directly mapping composed queries into a retrieval embedding via contrastive supervision alone, without explicitly resolving the intended visual modifications. In this work, we introduce Factorized MLLM Embeddings (FactEmbed), which decouples compositional query comprehension from building discriminative embeddings. Rather than directly projecting the composed query into a single embedding without internal reasoning, FactEmbed employs a set of factorized latents that simulate the intended visual modifications via an intermediate target imagination objective. This process encourages the latents to ground into target semantics before forming discriminative representations for retrieval. Subsequently, to propagate these factorized representations throughout the model for retrieval, we optimize a factor-level contrastive loss while distilling the decomposed representations into a deeper attention layer of the MLLM. Finally, for efficient inference, we retain the [EOS] token to establish a global-level embedding on top of these factorized latents, while we exploit the mean-pooled factorized latents to rerank a short candidate list at negligible cost, as both are produced by the same forward pass. Extensive evaluations demonstrate that FactEmbed outperforms prior works across CIR benchmarks.", 'score': 42, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'a6ef1a098cdf38c0', 'authors': ['WonJun Moon', 'Seongchan Kim', 'Dahun Kim', 'Seungryong Kim'], 'affiliations': ['Google DeepMind', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.05193.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#optimization', '#architecture', '#benchmark', '#rag', '#reasoning'], 'emoji': '🖼️', 'ru': {'title': 'Сначала представь изменение, потом ищи картинку', 'desc': 'FactEmbed — это новый метод для Composed Image Retrieval (CIR), где по опорному изображению и текстовому описанию изменений ищется целевая картинка. Авторы утверждают, что существующие подходы на базе MLLM не используют композиционное понимание модели в полной мере, так как запрос напрямую отображается в эмбеддинг только через контрастивную supervision. Предложенный метод разделяет понимание запроса и построение дискриминативных эмбеддингов: набор факторизованных латентов имитирует целевые визуальные модификации через промежуточную цель target imagination, а затем factor-level contrastive loss и дистилляция в более глубокий attention-слой MLLM распространяют эти представления. Для эффективного инференса используется глобальный эмбеддинг на основе токена [EOS], а средний пулинг факторизованных латентов применяется для переранжирования короткого списка кандидатов, что почти не добавляет вычислительных затрат.'}, 'en': {'title': 'Imagine the Change Before You Search', 'desc': 'FactEmbed improves composed image retrieval, where a system finds an image matching a reference image and a text-described change. It separates understanding the requested visual modification from creating the embedding used for retrieval, using factorized latent representations to imagine the target image’s semantics. A factor-level contrastive loss trains these representations, which are also distilled into a deeper MLLM attention layer. At inference, the model uses an [EOS]-based embedding to retrieve candidates and mean-pooled factorized latents to rerank them, achieving better results than prior methods on CIR benchmarks.'}, 'zh': {'title': '先想清图像如何改变，再精准检索目标', 'desc': '这篇论文研究组合图像检索：根据一张参考图像和一段修改描述，找到符合要求的目标图像。作者提出 FactEmbed，将理解修改意图与构造检索向量分开处理，并用一组因子化潜变量模拟图像应发生的视觉变化。模型通过中间的目标想象任务，让这些潜变量先对应到目标图像的语义，再利用因子级对比损失和知识蒸馏学习适合检索的表示。推理时，模型用 [EOS] 标记生成全局检索向量，并用因子化潜变量对少量候选结果重排；实验显示该方法在多个基准上优于以往方法。'}}}, {'id': 'https://huggingface.co/papers/2611.03233', 'title': 'Axion 1.0: Open Agent Foundation Models, Simplified', 'url': 'https://huggingface.co/papers/2611.03233', 'abstract': "Abstract Axion 1.0 is an open agent foundation model trained via a concise three-stage pipeline of supervised fine-tuning and reinforcement learning, achieving competitive agentic performance while fully releasing its data and training recipe.  Generated by thinkingmachines/Inkling-Small We introduce Axion 1.0, a fully open agent foundation model that combines strong and broad agentic capabilities with a remarkably simple training recipe. Axion 1.0 is trained in only three stages: two lightweight supervised fine-tuning stages followed by reinforcement learning, without dedicated mid-training, direct preference optimization (DPO), or on-policy distillation (OPD). The first SFT stage develops strong self-contained reasoning through model-aware data construction, where we synthesize challenging problems and adversarially strengthen them based on the base model's own successful solution strategies. The second stage extends these capabilities to tool-dependent reasoning through a scalable pipeline for constructing diverse and automatically verifiable tasks grounded in real-world data sources and deterministic computation. Finally, reinforcement learning further strengthens long-horizon reasoning and interaction with external tools and environments. Despite this compact training recipe, Axion 1.0 achieves strong performance across a broad suite of agentic benchmarks and is competitive with leading commercial models on several of them. Equally importantly, Axion 1.0 is open beyond model weights: we release the complete recipe, including data construction, generation, filtering, verification, prompts, and training code, enabling the entire development process to be reproduced and extended. Axion 1.0 demonstrates that strong agent foundation models can be both open and simple, offering a practical and reproducible path toward advancing open agentic intelligence.", 'score': 38, 'issue_id': 3497, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '9961442f25abf735', 'authors': ['Yuqi Jia', 'Yunjie Tian', 'Jiayu Zheng', 'Yijun Liang', 'Jingchen Sun', 'Mengyu Zhao', 'Di Fu'], 'affiliations': ['ByteDance', 'Duke University', 'University at Buffalo', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2611.03233.jpg', 'data': {'categories': ['#rl', '#training', '#dataset', '#synthetic', '#agents', '#open_source', '#benchmark', '#data', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Открытый агент: мощно и просто, без лишних этапов обучения', 'desc': 'Статья представляет Axion 1.0 — открытую агентную foundation model, обученную всего в три этапа: два этапа supervised fine-tuning и затем reinforcement learning. Первый SFT-этап развивает самостоятельное рассуждение через model-aware построение данных и адверсариальное усложнение задач на основе успешных стратегий базовой модели. Второй этап расширяет способности до tool-dependent рассуждения с помощью автоматически верифицируемых задач, а RL укрепляет долгосрочное рассуждение и взаимодействие с внешними инструментами и средами. Модель показывает результаты, сопоставимые с ведущими коммерческими LLM, при полной публикации весов, данных и кода обучения.'}, 'en': {'title': 'Strong Open Agents, Built with a Simple Recipe', 'desc': 'Axion 1.0 is an open agent foundation model trained with two supervised fine-tuning stages followed by reinforcement learning. The first stage builds self-contained reasoning skills, while the second teaches the model to solve tasks using tools and external information. Reinforcement learning further improves the model’s ability to handle long tasks and interact with tools and environments. It performs competitively on many agent benchmarks, and its data, training recipe, and code are released so others can reproduce and extend it.'}, 'zh': {'title': '简洁训练，打造开放且强大的智能体', 'desc': 'Axion 1.0 是一个开放的智能体基础模型，采用简洁的三阶段训练流程。前两个阶段使用监督微调，先提升独立推理能力，再训练模型借助工具解决问题；第三阶段通过强化学习增强长程推理和与外部环境的交互能力。尽管没有使用专门的中期训练、直接偏好优化或在线策略蒸馏，它在多项智能体基准测试中仍取得了有竞争力的表现。研究团队还公开了数据构建、筛选、验证和训练代码等完整流程，便于复现和扩展。'}}}, {'id': 'https://huggingface.co/papers/2611.05036', 'title': 'ToolSpace: Scaling Tool-Centric Environment Synthesis for Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2611.05036', 'abstract': 'Abstract ToolSpace constructs realistic multi-environment tool-use benchmarks by mining execution traces, clustering tool compositions, and validating tasks through replayable state-aware random walks.  Generated by thinkingmachines/Inkling-Small Large language models are deployed as long-horizon agents that compose diverse tools across MCP services into executable workflows. Existing MCP environment-scaling methods are data-centric: they first synthesize a database and scenario, then derive tools and tasks from them. As a result, tool interfaces may not match real ones, tool compositions are not grounded in execution, and tasks rarely span more than one environment. We propose ToolSpace, a tool-centric framework that reverses this order. ToolSpace mines data, state, and retry dependencies from adjacent calls in execution traces of real MCP services and open agent corpora, using deterministic rules rather than LLM judgment, and clusters the resulting weighted tool-composition graph into environments. Databases are synthesized only for state-mutating environments, while query and stateless tools replay recorded returns. ToolSpace then performs state-aware random walks with rollback and decompiles each chain into a natural-language task with assertion-based checks, keeping only samples that replay successfully from the initial state. Applied to AutomationBench and tau3-Bench Banking, the pipeline produces harder Pro versions on which 7 frontier models drop by up to 38.2 points. Across seven long-horizon tool-use benchmarks, ToolSpace raises Qwen3.6-35B-A3B from 23.0 to 41.0 average score (43.2 with RL) and GLM-5.2 from 44.6 to 56.6, on par with Claude Opus 5. Ablations show that execution-witnessed edges clearly outperform LLM-judged ones, and performance keeps improving with data and environment scale.', 'score': 34, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'f9508694a6056f9e', 'authors': ['Guanting Dong', 'Zhichao Sun', 'Xinyu Yang', 'Rui Wang', 'Xin Deng', 'Jiajie Jin', 'Zhixiong Yang', 'Junhao Huang', 'Han Han', 'Mingyu Ma', 'Xiaotao Wang', 'Yuyang Hu', 'Xiaoshuai Song', 'Xiaoxi Li', 'Jiejun Tan', 'Zhecan Wang', 'Shihan Dou', 'Honglin Guo', 'Zhiheng Xi', 'Tao Gui', 'Tao Ji', 'Qi Zhang', 'Yutao Zhu', 'Ji-Rong Wen', 'Zhicheng Dou'], 'affiliations': ['Fudan University', 'Renmin University of China', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05036.jpg', 'data': {'categories': ['#rl', '#training', '#optimization', '#synthetic', '#agents', '#benchmark', '#data'], 'emoji': '🧩', 'ru': {'title': 'Инструменты, проверенные выполнением, а не догадками LLM', 'desc': 'Статья представляет ToolSpace — фреймворк, который строит реалистичные бенчмарки для LLM-агентов, использующих инструменты MCP-сервисов. В отличие от подходов, где сначала синтезируется база данных, здесь зависимости между вызовами инструментов извлекаются из реальных execution traces детерминированными правилами, а не оценками LLM. Граф композиций инструментов кластеризуется в окружения, а задачи генерируются через state-aware random walks с откатом и проверяются assertion-based проверками. Результаты показывают, что обучение на данных ToolSpace заметно повышает качество агентов и что производительность растёт с масштабом данных и окружений.'}, 'en': {'title': 'Build Tool Benchmarks from Real Tool Use', 'desc': 'ToolSpace builds realistic benchmarks for language-model agents that use tools across multiple environments. It mines real execution traces to find which tools work together, then groups these tool compositions into environments. It creates tasks by walking through tool sequences, checking their state changes, and keeping only tasks that replay successfully from the starting state. The resulting harder benchmarks expose weaknesses in current models and improve training results, with execution-based tool relationships outperforming relationships judged by an LLM.'}, 'zh': {'title': '让基准任务扎根于真实工具调用', 'desc': 'ToolSpace 是一种以工具为中心的方法，用来构建真实、复杂的多环境工具使用基准。它从真实工具调用记录中提取工具之间的依赖关系，并将常一起使用的工具聚类成不同环境。它通过考虑环境状态的随机游走生成任务，再用回放和断言检查验证任务是否能成功执行。实验显示，这些基准能更好地区分模型能力，并提升模型在长程工具使用任务上的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.05280', 'title': 'YANAMI: A Large-Scale Multimodal Dataset and Benchmark for Multiturn Stateful Interaction', 'url': 'https://huggingface.co/papers/2611.05280', 'abstract': "Abstract YANAMI introduces a large-scale multimodal dialogue dataset and benchmark for stateful interaction, requiring models to track and realize evolving dialogue states across turns, and reveals that current unified multimodal models still struggle with this task.  Generated by thinkingmachines/Inkling-Small Unified Multimodal Models (UMMs) integrate visual understanding, generation, and editing within a single unified framework. However, existing unified multimodal datasets and benchmarks remain dominated by single-turn tasks. Even in recent multi-turn datasets, many turns can be solved independently without tracking information across turns. Consequently, they provide limited supervision and evaluation for multimodal stateful interaction, which requires models to understand, maintain, update, and faithfully realize evolving dialogue states across turns. To address this gap, we introduce YANAMI, the first large-scale multimodal dialogue dataset and benchmark for stateful interaction, comprising YANAMI-400K and YANAMI-Bench. YANAMI-400K contains 400K multi-turn multimodal dialogues, with more than 2M images and 2.6M dialogue turns. The dialogues span four representative scenarios: Multi-Image Fusion, Image Editing, World Modeling, and Visual Reasoning, and require models to continuously track, preserve, and revise evolving multimodal dialogue states across turns. YANAMI-Bench comprises 400 multi-turn dialogues for systematically evaluating multimodal stateful interaction. It jointly evaluates Dialogue State Understanding and Visual Realization, characterizing the gap between models' ability to understand evolving dialogue states and their ability to faithfully realize them in visual outputs. Experiments show that fine-tuning BAGEL on YANAMI-400K improves image editing, generation, and multimodal stateful interaction by 10.3%, 2.0%, and 13.23%, respectively, while preserving its general visual understanding capabilities. Evaluations on YANAMI-Bench further reveal that existing UMMs still struggle to maintain, update, and visually realize evolving multimodal dialogue states.", 'score': 26, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'd700df0342c9bde9', 'authors': ['Shengyu Wang', 'Tengyue Nong', 'Junming Liu', 'Haosong Peng', 'Siyu Li', 'Ruiqi Lei', 'Fushuo Huo', 'Yuhao Pan', 'Yunfeng Fan', 'Ding Wang', 'Nan Cheng', 'Haozhao Wang', 'Wenchao Xu'], 'affiliations': ['Huazhong University of Science and Technology', 'Imperial College London', 'Independent Researcher', 'Shanghai Artificial Intelligence Laboratory', 'Southeast University', 'The Chinese University of Hong Kong, Shenzhen', 'The Hong Kong Polytechnic University', 'The Hong Kong University of Science and Technology', 'The University of Melbourne', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05280.jpg', 'data': {'categories': ['#training', '#multimodal', '#synthetic', '#dataset', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Мультимодальные модели должны помнить, что было раньше, и честно воплощать это в картинках', 'desc': 'В статье представлен YANAMI — первый крупномасштабный мультимодальный датасет диалогов с сохранением состояния (stateful interaction), содержащий 400K многоходовых диалогов и более 2M изображений. Авторы также создали бенчмарк YANAMI-Bench для оценки понимания состояния диалога (Dialogue State Understanding) и визуальной реализации (Visual Realization). Дообучение модели BAGEL на YANAMI-400K улучшает редактирование изображений, генерацию и stateful-взаимодействие, сохраняя способности к визуальному пониманию. Однако эксперименты показывают, что современные унифицированные мультимодальные модели (UMM) всё ещё плохо отслеживают и обновляют состояние диалога в визуальных ответах.'}, 'en': {'title': 'Track Every Turn, Realize Every Change', 'desc': 'YANAMI is a large-scale dataset and benchmark for training and evaluating models on multimodal conversations whose visual details change over multiple turns. Its 400,000 dialogues cover image fusion, image editing, world modeling, and visual reasoning, and require models to track and update dialogue state. YANAMI-Bench measures both dialogue state understanding and whether models can faithfully produce the requested visual outputs. Fine-tuning BAGEL on the dataset improves editing, generation, and stateful interaction, but evaluations show that current unified multimodal models still struggle with these tasks.'}, 'zh': {'title': '让多模态对话记住变化，并把状态准确呈现在图像中', 'desc': '本文提出 YANAMI，这是用于评估多模态模型跨轮次状态交互的大规模数据集与基准。YANAMI-400K包含40万段多轮对话，覆盖多图融合、图像编辑、世界建模和视觉推理等任务，要求模型持续跟踪并更新对话状态。YANAMI-Bench通过评估对话状态理解和视觉实现，衡量模型能否准确理解不断变化的需求，并将其落实到视觉输出中。实验显示，使用该数据集微调可提升 BAGEL 的多项能力，但现有统一多模态模型仍难以稳定维护、更新并实现跨轮次状态。'}}}, {'id': 'https://huggingface.co/papers/2611.04418', 'title': 'VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks', 'url': 'https://huggingface.co/papers/2611.04418', 'abstract': 'Abstract VidUEU-Agent automates instruction data synthesis from raw videos via a multi-stage pipeline with autonomous iteration, yielding a 100K-sample dataset that improves multimodal model performance.  Generated by thinkingmachines/Inkling-Small The advancement of multimodal learning is heavily constrained by the scarcity and high annotation cost of high-quality instruction data. While raw videos offer an abundant and dynamic source of visual knowledge, transforming them into precise instruction data remains highly challenging. To bridge this gap, we present VidUEU-Agent, an automated pipeline that synthesizes instruction data from raw videos for multimodal understanding, editing, and unified tasks. VidUEU-Agent follows a four-stage pipeline: it performs global perception to filter low-quality shots, mines keyframes and multimodal signals, constructs metadata and routes the metadata to synthesize instruction samples. More importantly, our agent framework can autonomously iterate the data distribution based on downstream training results, thereby optimizing data quality, balance, and training effectiveness. Scaling this pipeline, we construct VidUEU-100K, a large-scale dataset of 100K training samples spanning multiple domains and tasks, providing a robust foundation for developing comprehensive multimodal capabilities. Extensive experiments demonstrate that fine-tuning baseline models on VidUEU-100K yields significant and consistent performance gains across diverse representative benchmarks, validating the effectiveness of our proposed agent framework and dataset.', 'score': 23, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '7c210aac29699119', 'authors': ['Tengju Ru', 'Weitong Lian', 'Zecong Tang', 'Lingyi Meng', 'Haoran Li', 'Zhejun Cui', 'Yichen Zhu', 'Hangshuo Cao', 'Qi Kang', 'Yechi Liu', 'Kaixuan Wang', 'Yu-Jie Yuan', 'Chunwei Wang', 'Yu Zhang', 'Bo Dai'], 'affiliations': ['Huawei Technologies Ltd.', 'Institute of Automation, Chinese Academy of Sciences', 'The University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.04418.jpg', 'data': {'categories': ['#video', '#multimodal', '#training', '#optimization', '#dataset', '#synthetic', '#agents', '#open_source', '#data'], 'emoji': '🎬', 'ru': {'title': 'Видео становится обучающими данными: агент сам улучшает свой датасет', 'desc': 'Статья представляет VidUEU-Agent — автоматизированный пайплайн, который синтезирует инструкционные данные для мультимодальных моделей из сырых видео. Пайплайн состоит из четырёх этапов: глобальное восприятие для фильтрации низкокачественных шотов, извлечение ключевых кадров и мультимодальных сигналов, построение метаданных и синтез инструкционных примеров. Агент автономно итеративно перестраивает распределение данных на основе результатов обучения downstream-задач, оптимизируя качество, баланс и эффективность. На основе этого подхода создан датасет VidUEU-100K из 100 тысяч примеров, дообучение на котором даёт стабильный прирост качества на разных бенчмарках.'}, 'en': {'title': 'Turn raw video into better multimodal training data', 'desc': 'VidUEU-Agent is an automated pipeline that turns raw videos into instruction data for multimodal models. It filters video shots, extracts keyframes and multimodal signals, builds metadata, and uses that metadata to create training examples. The agent also adjusts the data distribution using downstream training results to improve data quality and balance. The resulting 100K-sample dataset, VidUEU-100K, consistently improves fine-tuned models across a range of benchmarks.'}, 'zh': {'title': '让原始视频自动变成高质量多模态指令数据', 'desc': '这篇论文提出 VidUEU-Agent，一个能从原始视频自动生成多模态指令数据的流程。它先筛除低质量片段，再提取关键帧和多模态信息，构建元数据并据此合成指令样本。该系统还能根据下游模型的训练结果自主迭代，调整数据分布，以提升数据质量、平衡性和训练效果。研究团队用它构建了包含 10 万条样本的 VidUEU-100K 数据集，实验表明，用该数据集微调基线模型能在多项基准测试中稳定提升表现。'}}}, {'id': 'https://huggingface.co/papers/2610.39813', 'title': 'EvoTeam: Multi-Agent Collaboration via Evolving Teams', 'url': 'https://huggingface.co/papers/2610.39813', 'abstract': 'Abstract EvoTeam evolves multi-agent collaboration by jointly adapting team organization, interaction rules, and agent skills through execution experience while maintaining reusable team libraries.  Generated by thinkingmachines/Inkling-Small LLM-based multi-agent systems (MAS) rely on collaboration among specialized agents to solve complex tasks. Existing methods improve MAS by refining the prompts, skills, and execution strategies of individual agents based on task feedback. However, improving individual agents does not necessarily lead to better team collaboration. Recent studies have therefore extended evolution to the collaboration level, using collective execution experience to adjust team organization, and inter-agent interactions. Nevertheless, evolving collaboration across heterogeneous tasks remains challenging, as existing approaches often constrain team reorganization within a shared structure and reuse interaction rules across incompatible team contexts. In this paper, we propose EvoTeam, a collaboration-centric evolution framework that jointly evolves team organization, interaction rules, and individual agent skills through execution experience. It maintains a library of reusable teams, selecting or creating agent teams and guiding collaboration through team-specific interaction rules. Collaboration experience accumulates within compatible team contexts, while individual skills remain reusable across teams. Experiments across four benchmarks demonstrate its effectiveness. Our code is available at https://github.com/DEEP-JLU/EvoTeam.', 'score': 23, 'issue_id': 3497, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '814c73b40ebcb743', 'authors': ['Qinuo Cao', 'Xin He', 'Dianxuan Fu', 'Lizhi Zhang', 'Zhaoqing Xing', 'Jiapu Wang', 'Xin Wang', 'Na Zou', 'Yi Chang', 'Qinggang Zhang'], 'affiliations': ['Jilin University', 'Nanjing University of Science and Technology', 'Shanghai AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.39813.jpg', 'data': {'categories': ['#optimization', '#agents', '#reasoning', '#training'], 'emoji': '🤝', 'ru': {'title': 'Учим не только агентов, но и их команду работать вместе', 'desc': 'Статья представляет EvoTeam — фреймворк, который эволюционирует коллаборацию в мультиагентных LLM-системах, а не только отдельных агентов. Он совместно адаптирует структуру команды, правила взаимодействия и навыки агентов на основе опыта выполнения задач. Для этого используется библиотека переиспользуемых команд, из которой выбираются или создаются новые команды с собственными правилами взаимодействия. Эксперименты на четырёх бенчмарках показывают эффективность подхода.'}, 'en': {'title': 'Evolve the Team, Not Just the Agents', 'desc': 'EvoTeam improves multi-agent systems by evolving how agents work together, not just how each agent performs alone. It uses execution experience to adapt team organization, team-specific interaction rules, and individual agent skills. A library of reusable teams lets the framework select or create teams suited to different tasks, while keeping collaboration experience within compatible team contexts and reusing skills across teams. Experiments on four benchmarks show that this approach is effective.'}, 'zh': {'title': '让团队协作与智能体技能共同进化', 'desc': '这篇论文提出 EvoTeam，一个以协作为核心的多智能体系统进化框架。它利用任务执行经验，同时调整团队组织方式、团队专属的交互规则，以及各个智能体的技能。EvoTeam 会维护可复用的团队库，并根据任务选择或创建团队；协作经验只在相容的团队情境中积累，而个人技能可以跨团队复用。在四个基准测试上的实验表明，该方法有效。'}}}, {'id': 'https://huggingface.co/papers/2611.03634', 'title': 'WebHarbor: Docking Real Websites for Evolving GUI Agent Environments', 'url': 'https://huggingface.co/papers/2611.03634', 'abstract': 'Abstract WebHarbor provides 153 executable, dockerized web environments for stable evaluation and reinforcement learning training of GUI agents, enabling strong generalization across multi-step and post-authentication tasks.  Generated by thinkingmachines/Inkling-Small GUI web agents require realistic and interactive environments that remain stable during both evaluation and training. Live website evaluation suffers from changing content, access restrictions, and limited coverage of authenticated workflows, while existing synthetic environments for training often lack functional depth and visual fidelity. We propose WebHarbor, a suite of 153 executable and dockerized website environments that faithfully reconstruct the visual interfaces, content, and functional workflows of real-world web services under deterministic control. We build WebHarbor through task-driven human-agent collaboration, where environments evolve as new tasks expand their functional scope, coding agents implement the required changes, and human contributors audit visual fidelity, functional correctness, and task validity. The resulting suite comprises 3,518 tasks spanning multi-step and post-authentication workflows, where existing works often fail to cover. Beyond reliable evaluation, WebHarbor provides high-fidelity synthetic web environments for cost-efficient reinforcement learning (RL). We demonstrate that a Qwen 4B-level GUI agent trained with RL in WebHarbor generalizes to unseen tasks and performs competitively with leading open-source GUI web agents across four benchmarks. The code and data are publicly available at https://github.com/aiming-lab/WebHarbor.', 'score': 19, 'issue_id': 3497, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '3172b30a52886155', 'pdf_title_img': 'assets/pdf/title_img/2611.03634.jpg', 'data': {'categories': ['#rl', '#training', '#dataset', '#games', '#synthetic', '#agents', '#open_source', '#benchmark', '#data'], 'emoji': '🌐', 'ru': {'title': 'Стабильные веб-полигоны для обучения и оценки GUI-агентов', 'desc': 'В статье представлен WebHarbor, набор из 153 исполняемых веб-окружений в Docker, которые точно воспроизводят интерфейсы и функции реальных сервисов. Окружения создавались совместно людьми и coding agents, а итогом стали 3 518 задач, включая многошаговые сценарии и сценарии после авторизации. Такие среды позволяют стабильно оценивать GUI agents и обучать их с помощью reinforcement learning без рисков, связанных с изменяющимся контентом живых сайтов. Эксперименты показывают, что агент уровня Qwen 4B, обученный в WebHarbor, хорошо обобщается на новые задачи и конкурирует с ведущими open-source агентами на четырёх бенчмарках.'}, 'en': {'title': 'A Stable Harbor for Training GUI Agents', 'desc': 'WebHarbor is a collection of 153 dockerized website environments built to train and evaluate GUI agents. The environments recreate real websites with stable, interactive workflows, including multi-step tasks and tasks that require signing in. Human contributors and coding agents build and check the environments to ensure their appearance and functionality are accurate. Reinforcement learning in WebHarbor helped a small GUI agent generalize to new tasks and compete with leading open-source agents on four benchmarks.'}, 'zh': {'title': '用稳定逼真的网站环境，训练能泛化的 GUI 智能体', 'desc': 'WebHarbor 构建了 153 个可执行、可用 Docker 部署的网站环境，用于稳定地评测和训练图形用户界面（GUI）智能体。这些环境在可控条件下还原真实网站的界面、内容和操作流程，并包含多步骤及登录后的任务，共有 3,518 项任务。研究团队通过人类与智能体协作扩展环境功能，并由人工检查视觉还原度、功能正确性和任务有效性。实验表明，在 WebHarbor 中进行强化学习训练的 Qwen 4B 级 GUI 智能体能够泛化到未见任务，并在四个基准测试中达到有竞争力的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.02079', 'title': 'ParetoSaddler: Pareto-Guided Optimization of Agent Harnesses for Quality and Cost', 'url': 'https://huggingface.co/papers/2611.02079', 'abstract': 'Abstract ParetoSaddler improves LLM agent harnesses by separately promoting intermediate candidates via Bayesian bootstrap Pareto support and selecting final deployments, boosting quality while reducing cost.  Generated by thinkingmachines/Inkling-Small Harness optimization can substantially improve LLM agents without modifying model weights, but existing methods primarily optimize response quality. Extending them to joint quality--cost optimization introduces a challenge: applying the deployment preference during intermediate updates can prematurely reject candidates that are valuable for later improvements. We introduce ParetoSaddler, which addresses this mismatch by separating intermediate candidate promotion from final deployment selection. At each iteration, an optimizer updates a parent harness to produce a candidate, and then compares the two over repeated executions and uses Bayesian bootstrap Pareto support to promote candidates showing credible progress in either quality or cost. Promoted candidates receive broader development evaluation and remain available as parents for later optimization steps. We evaluate ParetoSaddler on ClawMark and GAIA2 using domain-disjoint splits. On ClawMark, ParetoSaddler improves quality from 70.86\\% to 81.35\\% while reducing cost from \\1.17 to 1.01 per task; on GAIA2, it improves quality from 56.22\\% to 62.89\\% while reducing cost from \\0.78 to 0.45 per task. The Pareto-selected harnesses also achieve higher quality at lower cost than quality-only harness optimization. Analysis shows that Pareto-aware optimization retains intermediate candidates that would be discarded by deployment preference but can support later improvements, while Bayesian bootstrap screening filters out candidates whose gains are weakly supported across runs.', 'score': 16, 'issue_id': 3496, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '0323d34b2ba8737a', 'authors': ['Xingzhi Qian', 'Sungho Park', 'Rongyuan Tan', 'Jianbo Yu', 'Jue Zhang', 'Lorenzo Cavallaro', 'Menglin Xia', 'Yanzhi Chen', 'Xinnuo Xu', 'Yu Kang', 'Xinran Zheng', 'Gagan Somashekar', 'Xuchao Zhang', 'Chetan Bansal', 'Qingwei Lin', 'Victor Rühle'], 'affiliations': ['Microsoft', 'Mohamed bin Zayed University of Artificial Intelligence', 'Pohang University of Science and Technology', 'Southeast University', 'Southern University of Science and Technology', 'University College London'], 'pdf_title_img': 'assets/pdf/title_img/2611.02079.jpg', 'data': {'categories': ['#alignment', '#optimization', '#agents', '#training', '#benchmark'], 'emoji': '⚖️', 'ru': {'title': 'Оптимизируем агентов по качеству и цене, не теряя перспективных кандидатов', 'desc': 'В статье предлагается метод ParetoSaddler для оптимизации harness у LLM-агентов без изменения весов модели, который одновременно улучшает качество ответов и снижает стоимость. Ключевая идея: промежуточных кандидатов продвигают по Парето-фронту с помощью Bayesian bootstrap, а итоговый выбор конфигурации делают отдельно. Такое разделение позволяет не отбрасывать перспективные варианты, которые могут дать улучшения на следующих итерациях. Эксперименты на ClawMark и GAIA2 показывают рост качества и заметное снижение стоимости по сравнению с оптимизацией только по качеству.'}, 'en': {'title': 'Keep promising candidates; deliver better, cheaper agents', 'desc': 'ParetoSaddler improves LLM agents by optimizing their harnesses without changing model weights. It separates promoting promising intermediate candidates from choosing the final deployment, so candidates are not discarded too early just because they do not yet match deployment preferences. Bayesian bootstrap Pareto support checks repeated runs to identify candidates with credible gains in quality or cost. Tests on ClawMark and GAIA2 show that it improves quality while reducing cost compared with existing optimization approaches.'}, 'zh': {'title': '质量与成本兼顾，让有潜力的候选走得更远', 'desc': '这篇论文提出 ParetoSaddler，用来改进大语言模型智能体的运行框架，而不需要修改模型权重。它把中间候选框架的晋级与最终部署选择分开，避免候选方案因为当前偏好的质量或成本而过早被淘汰。系统通过多次运行和贝叶斯自助法估计帕累托优势支持度，晋级在质量或成本上有可信进步的候选方案。实验显示，该方法在 ClawMark 和 GAIA2 上都提高了任务质量并降低了成本。'}}}, {'id': 'https://huggingface.co/papers/2610.39714', 'title': 'MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery', 'url': 'https://huggingface.co/papers/2610.39714', 'abstract': 'Abstract MoLRSI is an AI agent that optimizes molecular design workflows and retains cross-task memory to improve search policies, achieving higher experimental hit rates in antibiotic and peptide binder discovery than expert-led methods.  Generated by thinkingmachines/Inkling-Small Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not address how to optimize workflows for new tasks or improve their development through experience. Here we introduce MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity, producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided workflow optimization can address competing discovery objectives while improving the search strategies used in subsequent campaigns.', 'score': 15, 'issue_id': 3497, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '7dad8818ea7a2b24', 'authors': ['Yikun Zhang', 'Xiwei Cheng', 'Mingze Yuan', 'Yu Zhang', 'Brian Shim', 'Aarti Krishnan', 'Daniel Rosen', 'Kunyang Sun', 'Yingze Wang', 'Zhenfeng Deng', 'Botao Yu', 'Bingxu Liu', 'David Liu', 'Tianyu Liu', 'Yuanqi Du', 'Nir Hacohen', 'James J. Collins', 'Wengong Jin'], 'affiliations': ['Broad Institute of MIT and Harvard', 'Cornell University', 'Harvard Medical School', 'Harvard University', 'Massachusetts General Hospital', 'Massachusetts Institute of Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.39714.jpg', 'data': {'categories': ['#optimization', '#agents', '#science', '#benchmark'], 'emoji': '🧬', 'ru': {'title': 'Агент, который учится на своём опыте и находит молекулы лучше экспертов', 'desc': 'MoLRSI — это AI-агент для молекулярного дизайна, который оптимизирует workflow и архитектуры моделей, а также хранит persistent cross-task memory для рекурсивного улучшения своей search policy. Агент учитывает результаты выполнения, feedback и outcomes предыдущих поисков, что позволяет улучшать не только сами пайплайны, но и стратегию их построения. В экспериментах по поиску антибиотиков hit rate составил 15,9% против 8,7% у экспертного workflow, а при дизайне пептидных MHC-связывателей были получены восемь экспериментально подтверждённых хитов с предпочтительным связыванием. Работа показывает, что experience-guided оптимизация помогает одновременно решать конкурирующие цели дискавери.'}, 'en': {'title': 'An AI Agent That Learns to Search Better for Molecules', 'desc': 'MoLRSI is an AI agent that improves molecular discovery workflows and remembers lessons from earlier tasks. It uses workflow results and execution feedback to refine its search policy over time. In antibiotic discovery, it achieved a 15.9% experimental hit rate, compared with 8.7% for an expert-designed workflow. For peptide-MHC binder design, it produced eight experimentally validated hits with preferential binding to the intended targets over tested off-targets.'}, 'zh': {'title': '让分子发现工作流程从经验中不断进化', 'desc': 'MoLRSI 是一种用于分子发现的 AI 智能体，能够优化分子设计工作流程，并通过跨任务记忆积累经验、改进搜索策略。它会利用工作流程表现、优化结果和执行反馈，持续调整工作流程及其开发方法。在抗生素发现中，它取得了 15.9% 的实验命中率，高于使用相同数据和筛选库的专家设计流程的 8.7%；在肽-MHC 结合剂设计中，它也找到了经实验验证且具有特异性的候选分子。研究表明，基于经验的工作流程优化有助于应对相互竞争的发现目标，并提升后续搜索效果。'}}}, {'id': 'https://huggingface.co/papers/2611.02501', 'title': 'SpecPilot: Autonomous Algorithm Discovery and Systems Optimization for Speculative Decoding', 'url': 'https://huggingface.co/papers/2611.02501', 'abstract': "Abstract SpecPilot autonomously discovers deployment-specific algorithms and system optimizations to maximize speculative decoding speedups across diverse models, drafters, and serving regimes without quality loss.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates memory-bound LLM decoding with a lightweight drafter, and parallel drafters extend this speedup by drafting a whole block in one forward pass. However, it remains unclear whether their released systems (stock) attain the full speedup that parallel drafting permits. We identify three challenges. First, with one request, each step accepts few tokens but reads every target weight. Second, with batching, per-request verification work roughly halves the speedup over autoregressive (AR) decoding. Third, speculative decoding is deployment-specific, and no universal optimization fits every serving regime, drafter, target model and GPU. To address these challenges, we present SpecPilot, an autonomous agentic loop that discovers algorithms and systems optimizations for each deployment. In each round, a cost model locates the largest gaps between the current system and its ceiling. Parallel agents explore directions and integrate the successful ones. Token forcing checks every output token against stock to detect reward hacking. A structured memory carries validated mechanisms to new rounds and deployments. SpecPilot discovered a general lossless 12-bit weight format, tree verification for hybrid recurrent targets, two-level verification and three batching mechanisms. We evaluate it across four target models, three drafters, two GPU platforms and five benchmarks. Without training or quality loss, it raises the speedup over AR from stock's 4.46times to 10.87times with one request, and from 1.94times to 3.93times with batching.", 'score': 15, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '2a65163c417bc864', 'authors': ['Kunjun Li', 'Wenhao Chai', 'Yihao Liang', 'Yuezhou Hu', 'Shuyao Xu', 'Yi Pan', 'William X. Zheng', 'Kannan Ramchandran', 'Kurt Keutzer', 'Jiantao Jiao'], 'affiliations': ['NVIDIA', 'Princeton University', 'Stanford University', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.02501.jpg', 'data': {'categories': ['#agents', '#inference', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Автопилот, который сам находит самый быстрый путь декодирования LLM без потери качества', 'desc': 'Статья представляет SpecPilot — автономный аг
