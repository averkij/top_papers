: 'Текстовый поток MMDiT — управляемый дискриминатор для генерации за один шаг', 'desc': 'В статье предлагается метод адверсариальной дистилляции диффузионных трансформеров с мультимодальной архитектурой (MMDiT), где дискриминатор опирается не на признаки изображения, а на промежуточные состояния текстовых токенов, которые через joint attention уже учли изображение. Введённая Aspect-Cued Discrimination (ACD) позволяет управлять дискриминатором через условие по аспектам, таким как типографика, объекты или стиль. Эти идеи реализованы в NitroFusion2, который снижает число шагов генерации с 4–8 до 1–2 при сопоставимом качестве. На одном шаге модель хорошо воспроизводит читаемый текст и мелкие детали, что делает одношаговую генерацию практичной.'}, 'en': {'title': 'Turn the Text Stream into a Steering Wheel for One-Step Image Generation', 'desc': 'This paper introduces Text-Stream Adversarial Distillation (TSAD), which uses intermediate text-token states in multimodal diffusion transformers as features for adversarial training. Since joint attention lets these text states incorporate image information while remaining linked to the text prompt, they can help the discriminator judge how well an image matches its condition. Aspect-Cued Discrimination (ACD) further steers the discriminator to focus on properties such as typography, objects, or style. Together, TSAD and ACD form NitroFusion2, which generates high-quality images in one or two steps, reducing the usual four-to-eight-step process while maintaining competitive quality.'}, 'zh': {'title': '让文本流成为可引导的判别信号，实现高质量一两步生成', 'desc': '本文提出文本流对抗蒸馏（TSAD），利用多模态扩散 Transformer 中间文本 token 的状态作为判别器的对抗表示。由于文本流通过联合注意力已读取图像内容，改变文本条件就能影响它从图像中提取的信息。作者进一步提出方面提示判别（ACD），让判别器关注文字、物体或风格等不同属性，并将两种方法整合进 NitroFusion2。实验表明，NitroFusion2 能将图像生成压缩到 1–2 步，同时保持有竞争力的质量，并在一步生成中呈现清晰文字与丰富细节。'}}}, {'id': 'https://huggingface.co/papers/2610.41432', 'title': 'Hybrid Computer Use: A Unified Programmatic, Semantic, and Visual Interface for General Agents', 'url': 'https://huggingface.co/papers/2610.41432', 'abstract': "Abstract Hybrid Computer Use unifies programmatic, accessibility-based, and visual interaction channels to improve agent efficiency and success on complex desktop tasks.  Generated by thinkingmachines/Inkling-Small Computer-use agents increasingly tackle tasks ranging from everyday desktop activities to long-horizon professional workflows. Yet interfaces centered on screenshots and mouse-and-keyboard actions can impose a human-interaction prior, requiring repeated screen interpretation while leaving the computer's semantic and programmatic capabilities underexposed. We argue for exposing these capabilities and letting models choose and combine them. We introduce Hybrid Computer Use (HCU), a unified interface for general agents that combines three complementary channels: programmatic interaction through code and command-line tools, semantic interaction through accessibility (AX), and visual interaction through graphical user interfaces (GUI). Our HCU supports efficient AX interaction and guards against stale-state actions during channel switching. A supplementary HCU skill guides agents in selecting and coordinating channels to use the unified interface effectively. Our designed AX tools return compact observations, execute actions in batches, and report their effects as AX diffs, so the model needs fewer round trips. On OSWorld 2.0, HCU achieves the highest Partial and Binary scores among the compared systems. Analyzing agent trajectories, we find that all evaluated models improve with HCU yet allocate work across the channels differently and consistently outperform compared baselines in terms of both efficiency and task success, highlighting the value of unified computer-use interfaces that allow flexible channel selection and combination.", 'score': 6, 'issue_id': 3501, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '47204b3d2275d5f4', 'authors': ['Haoqing Wang', 'Xiaoyi Zhang', 'Sicheng Fan', 'Zhexin Zhang', 'Xinjie Zhang', 'Jiahao Li', 'Bin Li', 'Yan Lu'], 'affiliations': ['Fudan University', 'Microsoft Research', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.41432.jpg', 'data': {'categories': ['#benchmark', '#agents', '#architecture'], 'emoji': '🖥️', 'ru': {'title': 'Один интерфейс, три канала: компьютер понимает агента лучше, когда агент может выбирать, как с ним говорить', 'desc': 'В статье представлен Hybrid Computer Use (HCU) — унифицированный интерфейс для агентов на базе LLM, который объединяет три канала взаимодействия: программный (код и командные утилиты), семантический через accessibility (AX) и визуальный через GUI. Авторы показывают, что AX-инструменты возвращают компактные наблюдения, выполняют действия пакетами и сообщают об эффектах в виде AX diff, что уменьшает число round trip и защищает от действий над устаревшим состоянием при переключении каналов. Дополнительный HCU skill помогает агенту выбирать и координировать каналы. На бенчмарке OSWorld 2.0 HCU показывает лучшие Partial и Binary результаты и превосходит базовые AI-системы по эффективности и успешности выполнения задач.'}, 'en': {'title': 'Let Agents Choose the Best Way to Use a Computer', 'desc': 'Hybrid Computer Use (HCU) gives computer-use agents three ways to interact: programmatic tools, accessibility (AX) interfaces, and graphical user interfaces (GUI). Agents can choose and combine these channels, while compact AX observations, batched actions, and AX diffs reduce unnecessary interaction steps. HCU also helps prevent actions based on outdated screen state when switching between channels. On OSWorld 2.0, it achieved the best Partial and Binary scores among the compared systems, improving task success and efficiency across evaluated models.'}, 'zh': {'title': '打通代码、语义与图形界面，让智能体灵活操作电脑', 'desc': '本文提出混合式计算机操作（HCU）接口，让智能体可以结合代码与命令行、无障碍语义信息（AX）以及图形界面（GUI）来完成桌面任务。AX 工具会提供精简的观察结果、批量执行操作，并以差异形式报告操作效果，从而减少交互轮次；切换操作渠道时，也会防止智能体依据过时状态采取行动。实验显示，在 OSWorld 2.0 上，HCU 在部分完成度和二元成功率指标上优于所比较的系统，且不同模型都能从中受益。结果表明，让智能体灵活选择并组合多种操作渠道，有助于提升复杂任务的效率与成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.03404', 'title': 'VidDub: Replacement-Aware Distillation for Two-Step Video Dubbing', 'url': 'https://huggingface.co/papers/2611.03404', 'abstract': "Abstract VidDub is a two-step diffusion video dubbing model that uses replacement-aware cross-audio supervision to avoid conflicting source-mouth targets and achieves strong lip synchronization with high visual fidelity.  Generated by thinkingmachines/Inkling-Small Video dubbing aims to synthesize lip movements that match target speech while preserving the speaker identity, head pose, and background of a source video. Existing editors are predominantly trained via self-reconstruction under original paired audio, even though the source mouth becomes a conflicting target when driving speech is replaced. We introduce replacement-aware cross-audio supervision: paired-audio samples use full-frame reconstruction, whereas unpaired replacement-audio samples mask out source-mouth reconstruction losses and supervise the mouth solely through audio-visual synchronization while preserving unmasked facial regions and background. Because offline dubbing provides the complete source video and target speech beforehand, we present VidDub, a full-context diffusion editor distilled into two denoising steps (2 NFE). Our replacement-aware teacher first learns accurate lip synchronization without regressing toward conflicting source mouth movements. Matched trajectory regression then transfers the teacher's CFG-guided trajectories to a two-step student, and distribution matching distillation recovers visual quality after step compression. We will release the curated training dataset, VidDub-Bench, fixed paired- and cross-audio evaluation manifests, preprocessing outputs, and unified evaluation code. Across three training seeds, masking out conflicting source-mouth reconstruction improves cross-audio Sync-C by 0.833; the final two-step model combines strong lip synchronization with superior visual quality, identity preservation, and visual speech recognition across four benchmarks.", 'score': 6, 'issue_id': 3500, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '0de9ed60b5542dec', 'authors': ['Yexin Liu', 'Yunlong Lin', 'Zehan Wang', 'Guangxin He', 'Xinli Xu', 'Jiajun Zha', 'Yaofu Liu', 'Yueze Wang', 'Bowen Ping', 'Yuanming Li', 'Amie Wang', 'Bernard Ghanem', 'Bing Li', 'Harry Yang'], 'affiliations': ['HKUST', 'Independent Researcher', 'KAUST', 'Tencent', 'Tsinghua University', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2611.03404.jpg', 'data': {'categories': ['#training', '#benchmark', '#cv', '#optimization', '#audio', '#dataset', '#inference', '#diffusion', '#video'], 'emoji': '🎬', 'ru': {'title': 'Губы говорят то, что нужно: быстрый дубляж видео без конфликтов с исходным ртом', 'desc': 'В статье представлена модель VidDub для дубляжа видео, основанная на диффузионной архитектуре и генерирующая движения губ, соответствующие новой речи. Ключевая идея — replacement-aware cross-audio supervision: при замене аудио потери на реконструкцию области рта маскируются, а синхронизация с аудио задаётся через audio-visual synchronization, чтобы не возникало конфликта с исходными движениями. Диффузионный редактор сжат до двух шагов денойзинга (2 NFE) за счёт дистилляции: сначала учитель обучается с CFG-guided траекториями, затем matched trajectory regression переносит их ученику, а distribution matching distillation восстанавливает визуальное качество. Модель обеспечивает высокую синхронизацию губ и качество изображения, сохраняя идентичность говорящего, позу головы и фон.'}, 'en': {'title': 'Dub in Two Steps, Keep the Speaker True', 'desc': 'VidDub is a video dubbing model that changes a speaker’s lip movements to match new speech while preserving their identity, pose, and surroundings. Its training method avoids teaching the model to copy mouth movements from the original video when they conflict with the replacement speech. The model uses audio-visual synchronization to guide the new mouth movements, then compresses a full-context diffusion editor into two denoising steps using trajectory regression and distribution matching. Across four benchmarks, VidDub achieves strong lip synchronization and visual quality, while preserving identity.'}, 'zh': {'title': '屏蔽冲突口型，让两步扩散配音同步又自然', 'desc': 'VidDub 是一种两阶段扩散视频配音模型，用目标语音生成与声音同步的嘴部动作，同时保留说话者身份、头部姿态和背景。训练时，模型对原始配对音频使用完整画面重建；对替换音频则屏蔽源视频嘴部的重建损失，避免模型被原有口型误导，并通过音画同步信号学习新口型。随后，模型将教师模型的生成轨迹迁移给只需两步去噪的学生模型，并通过分布匹配蒸馏恢复画面质量。实验显示，这种训练方式提升了跨音频唇形同步效果，最终模型也能较好地保持视觉质量、身份特征，并在多个基准测试中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2611.05304', 'title': 'LoopVQ: Sub 1-bit KV Cache Quantization for Looped Transformers', 'url': 'https://huggingface.co/papers/2611.05304', 'abstract': 'Abstract  Looped transformers are a parameter-efficient alternative to standard transformers for language modeling. By reapplying the same layers across multiple loop steps, recent looped language models match the performance of non-looped models several times their size. While this architecture effectively reduces parameter memory, each loop step still stores its own keys and values, so the key-value (KV) cache grows linearly with the number of loop steps and becomes the main memory bottleneck. We observe that the KV cache of looped models is highly redundant along the loop axis and that the loop steps differ substantially in their sensitivity to quantization. Based on these observations, we propose LoopVQ, a KV cache vector quantization method for looped transformers that codes channels of multiple loop steps jointly, and fine-tunes the codebooks to match the output of the full-precision model. At 0.5 bits per element, LoopVQ outperforms existing KV cache vector quantization methods for standard LLMs on general, long chain-of-thought reasoning, and long-context retrieval tasks with Ouro and Huginn models. Its design is orthogonal to these methods, and combined with TaSQ, it retains much of the BF16 accuracy even at 0.25 bits per element. We also implement LoopVQ in SGLang, where it nearly halves the decode latency at a 32K-token context and raises the peak serving throughput by up to 4.3times and 6.1times on the 1.4B and 2.6B Ouro models compared to the BF16 baseline.', 'score': 6, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '1ee89b1539ec0a5d', 'authors': ['Minsoo Cheong', 'Sungjoo Yoo'], 'affiliations': ['Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05304.jpg', 'data': {'categories': ['#optimization', '#architecture', '#inference', '#long_context'], 'emoji': '🔁', 'ru': {'title': 'Сжимаем повторы в цикле — экономим память KV-кэша без потери качества', 'desc': 'Статья посвящена looped transformers — архитектуре, которая многократно применяет одни и те же слои и тем самым экономит параметры при сохранении качества языковых моделей (LLM). Основная проблема такой архитектуры в том, что KV-кэш растёт линейно с числом итераций цикла и становится главным узким местом по памяти. Авторы предлагают LoopVQ — метод векторного квантования KV-кэша, который совместно кодирует каналы нескольких шагов цикла и дообучает кодовые книги под выход полноточной модели. При 0.5 битах на элемент метод превосходит существующие подходы на задачах рассуждений и поиска в длинном контексте, а реализация в SGLang почти вдвое снижает задержку декодирования и увеличивает пиковую пропускную способность.'}, 'en': {'title': 'Compress the Cache, Keep the Reasoning', 'desc': 'Looped transformers reuse the same layers across multiple steps, saving model parameters but still using a large key-value (KV) cache. The paper introduces LoopVQ, which jointly vector-quantizes cache channels across loop steps and fine-tunes its codebooks to preserve the full-precision model’s outputs. At low bit rates, LoopVQ performs well on language, reasoning, and retrieval tasks, and can be combined with another quantization method to retain accuracy using even less memory. In SGLang, it also reduces decoding latency and increases serving throughput for the tested models.'}, 'zh': {'title': '跨循环联合量化 KV 缓存，以更少显存实现更快推理', 'desc': '循环 Transformer 通过重复使用相同的层来减少模型参数，但每个循环步骤仍需保存键值（KV）缓存，导致显存占用随循环次数增长。论文发现，不同循环步骤的 KV 缓存存在大量冗余，而且对量化的敏感程度不同，因此提出 LoopVQ，将多个循环步骤的通道联合进行向量量化，并微调码本以贴近全精度模型的输出。在每元素 0.5 比特时，LoopVQ 在通用任务、长链式推理和长上下文检索任务上优于现有的 KV 缓存向量量化方法；与 TaSQ 结合后，即使降至 0.25 比特也能保留大部分 BF16 精度。作者还将其集成到 SGLang，在 32K 上下文下几乎将解码延迟减半，并使服务吞吐量最高提升至 BF16 基线的 4.3 倍和 6.1 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.06083', 'title': 'SleuthVLM: Do We Really Need Audio-in-Video for Omni Video Understanding?', 'url': 'https://huggingface.co/papers/2611.06083', 'abstract': 'Abstract SleuthVLM uses a vision-language model with transcribed speech and autonomous video sleuthing to outperform direct audio-hearing omni models on long-video benchmarks, showing that agentic reasoning matters more than auditory input.  Generated by thinkingmachines/Inkling-Small Omni models answer questions about videos by jointly processing sampled frames and audio in one turn, with progress driven largely by scaling model size and omni training data. We ask whether a model needs to hear the audio directly at all, and present SleuthVLM, an agent harness built on a VLM that never hears the audio directly: speech will be transcribed into text, and the VLM will sleuth the video on its own without any predefined workflow. On four omni benchmarks with videos up to 90 minutes, SleuthVLM achieves the best average accuracy: 75.0%, 2.6 points above Gemini 3.8 Flash, and it also tops the Video-MME-v2 leaderboard with 77.8%; with an open-source 27B VLM, it beats all open-source omni models. We draw three findings: SleuthVLM beats a model that glances; hearing is not the bottleneck, agentic ability is; omni understanding needs better agentic ability, not just more omni data for modality alignment. So we provide a simple but effective starting point for doing omni video understanding. Omni understanding needs better agents, not just bigger models that hear.', 'score': 5, 'issue_id': 3500, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '7e129b6dbddca2b4', 'authors': ['Peiran Wu', 'Fangfei Gou', 'Zhaoxi Mu', 'Changhao Zhang', 'Jian Liu', 'Weiqiang Wang', 'Yuntao Wang', 'Yuanchun Shi', 'Junxiao Shen'], 'affiliations': ['Ant Group', 'Tsinghua University', 'University of Bristol'], 'pdf_title_img': 'assets/pdf/title_img/2611.06083.jpg', 'data': {'categories': ['#benchmark', '#agents', '#audio', '#multimodal', '#reasoning', '#video'], 'emoji': '🕵️', 'ru': {'title': 'Важен не слух, а агент: умный поиск побеждает просто большие omni-модели', 'desc': 'В статье предлагается SleuthVLM — агентная система на базе vision-language model (VLM), которая не обрабатывает аудио напрямую, а транскрибирует речь в текст. Модель самостоятельно исследует видео без заранее заданного workflow, используя агентное рассуждение. На четырёх omni-бенчмарках с видео до 90 минут SleuthVLM показывает лучшую среднюю точность (75,0%) и превосходит Gemini 3.8 Flash. Авторы делают вывод, что для понимания омни-видео важнее агентные способности модели, а не слух и не объём данных для выравнивания модальностей.'}, 'en': {'title': 'Better video agents matter more than models that hear', 'desc': 'SleuthVLM is an agent-based video system built on a vision-language model (VLM) that does not directly process audio. Instead, speech is transcribed into text, and the VLM autonomously searches the video for useful visual evidence. It achieves higher average accuracy than tested audio-hearing omni models on long-video benchmarks, including with an open-source 27B model. The results suggest that agentic reasoning—the ability to plan and gather evidence—matters more than direct auditory input or simply scaling omni training data.'}, 'zh': {'title': '理解视频，靠的是会主动探查的智能体，不只是听得更多', 'desc': 'SleuthVLM 是一个视频理解系统，它不会直接听视频音频，而是先把语音转成文字，再让视觉语言模型自主查看视频并推理。它在四个长视频基准测试中取得平均 75.0% 的准确率，比 Gemini 3.8 Flash 高 2.6 个百分点，并在 Video-MME-v2 上达到 77.8%。使用开源 27B 视觉语言模型时，它也超过了所有受测的开源全模态模型。研究表明，提升模型自主搜寻和推理视频信息的智能体能力，比单纯增加音频输入或全模态训练数据更重要。'}}}, {'id': 'https://huggingface.co/papers/2610.40516', 'title': 'How I Aligned Your Model: Scaling Up Multilingual Safety Training with Templates', 'url': 'https://huggingface.co/papers/2610.40516', 'abstract': 'Abstract Researchers developed a scalable template-based pipeline to generate multilingual safety datasets, revealing that English-only evaluations misjudge multilingual model safety and that culturally localized training improves alignment across languages.  Generated by thinkingmachines/Inkling-Small Safety alignment for Large Language Models is heavily focused on English with limited multilingual representation, particularly damaging low-resource language performance. Related open training datasets are often limited in size or do not follow region-localized harmful topics to broaden the scope of alignment beyond cultures. We propose a scalable template-based augmentation pipeline to produce massive multilingual refusal and benign corpora, extracting safe templates from harmful prompts, translating them and then filling in the slots with culturally authentic entities, both harmful and benign. As a result, we release MSafeTemp, a validated corpus spanning 60 languages useful for multilingual safety alignment and evaluation. Using the dataset, we show that English-only evaluation misjudges multilingual safety: for several models, attacks that fail in English succeed once translated, while culturally localized variants expose further failures that translation alone misses. We also confirm that augmenting safety training data through templates allows for higher diversity and quality of alignment, resulting in improved safety performance beyond English. MSafeTemp and the respective pipeline are aimed at facilitating research and development of safer and more responsible models for less-represented cultures.', 'score': 4, 'issue_id': 3500, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '8a1d5725bd4fc487', 'authors': ['Max Neuwinger', 'Hanna Yukhymenko', 'Imanol Schlag'], 'affiliations': ['ETH Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2610.40516.jpg', 'data': {'categories': ['#data', '#benchmark', '#training', '#security', '#alignment', '#multilingual', '#low_resource', '#dataset', '#machine_translation', '#open_source', '#synthetic', '#ethics'], 'emoji': '🌍', 'ru': {'title': 'Безопасность ИИ должна говорить на всех языках мира', 'desc': 'Авторы предложили масштабируемый конвейер на основе шаблонов для генерации многоязычных датасетов по безопасности LLM. Метод извлекает безопасные шаблоны из вредоносных промптов, переводит их и заполняет слоты культурно достоверными сущностями, как вредоносными, так и безобидными. На основе этого создан корпус MSafeTemp, охватывающий 60 языков, пригодный для alignment и оценки безопасности. Эксперименты показывают, что оценка только на английском языке не выявляет уязвимости моделей, тогда как культурно локализованные данные повышают безопасность на разных языках.'}, 'en': {'title': 'Safer AI Starts with Culturally Aware, Multilingual Training', 'desc': 'The paper presents a scalable method for creating multilingual safety datasets using reusable templates, translations, and culturally relevant examples. It introduces MSafeTemp, a validated dataset covering 60 languages for training and evaluating language-model safety. Tests show that English-only evaluations can miss safety failures, including attacks that work after translation or cultural adaptation. Training with more diverse, culturally localized examples improves safety alignment across languages.'}, 'zh': {'title': '让安全对齐跨越语言，也贴近文化', 'desc': '本文提出一种可扩展的模板增强流程，用于生成多语言的拒绝回答与良性内容数据。研究团队发布了经过验证的 MSafeTemp 数据集，覆盖 60 种语言，并融入符合当地文化的实体与情境。实验发现，只用英语评估会误判模型的多语言安全性：有些攻击在翻译后能够成功，而本地化内容还会暴露翻译未发现的漏洞。使用这些多样化数据进行安全对齐训练，可提升模型在多种语言中的安全表现。'}}}, {'id': 'https://huggingface.co/papers/2611.04634', 'title': 'VeriSpoof: Beyond Real or Fake with One Audio LLM', 'url': 'https://huggingface.co/papers/2611.04634', 'abstract': 'Abstract VeriSpoof is an audio language model that unifies deepfake detection, generator attribution, source verification, and evidence-based rationale generation with minimal parameter updates.  Generated by thinkingmachines/Inkling-Small A speech deepfake detector estimates whether a recording is synthetic, but a forensic analyst also asks which system produced it, whether recordings share a source, and what evidence supports each conclusion. We present VeriSpoof, an audio language model that unifies five tasks with shared weights: deepfake detection, generator attribution (generator, acoustic model and vocoder), recording-condition analysis, synthesized-span localisation, and source verification. Each decision is supported by grounded rationales whose statements can be independently verified. Answers are scored by sentence likelihood, allowing detection and source verification to be thresholded without separate heads. Rationale statements can be checked against waveform measurements, span labels, or generator metadata. Counterfactual examples train decisions to follow the stated evidence. Across the 14 Speech-DF-Arena test sets, VeriSpoof-Plus achieves 2.14% pooled EER, ranking third of 28 systems and first among open-weight systems. VeriSpoof-Base, trained only on official training splits of eight corpora, achieves 4.43% EER, less than half that of the next open-weight detector. With the same weights, VeriSpoof-Plus verifies whether recordings from generators unseen in training share a source at 6.2% EER. Controlled studies show that the audio representation governs detection, the LLM governs recording comparison, and source supervision is necessary for neural-codec fakes. Statement-checkable rationales catch partial fakes missed by one-step answers (99.6% vs. 78.4% on PartialEdit) and determine decisions under edits unseen in training (99.5%). Training updates only 29.7M of 2.85B parameters, fitting a single 24 GB GPU with gradient checkpointing. We release both models, inference code, a demo, and VeriSpoof-Bench, the evaluation suite covering these questions.', 'score': 4, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '6d8fc24420f2df71', 'authors': ['Yang Xiao', 'Ting Dang'], 'affiliations': ['The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2611.04634.jpg', 'data': {'categories': ['#benchmark', '#training', '#security', '#interpretability', '#audio', '#dataset', '#open_source', '#multimodal', '#ethics'], 'emoji': '🎧', 'ru': {'title': 'Не просто «подделка или нет»: ИИ, который доказывает свой вывод по звуку', 'desc': 'Статья представляет VeriSpoof, аудио LLM, которая объединяет пять задач: детекцию дипфейков, определение генератора, анализ условий записи, локализацию синтезированных участков и верификацию источника. Модель обучается с помощью минимального числа обновляемых параметров (29,7 млн из 2,85 млрд) и даёт обоснования, которые можно проверить по измерениям сигнала и метаданным. Контрфактуальные примеры учат модель опираться на заявленные доказательства, что повышает точность на частично подделанных записях. На 14 тестовых наборах Speech-DF-Arena VeriSpoof-Plus показывает 2,14% EER и лучший результат среди открытых систем.'}, 'en': {'title': 'One audio model, evidence for every deepfake decision', 'desc': 'VeriSpoof is an audio language model that uses shared weights to detect deepfakes, identify the generator, analyze recording conditions, locate synthesized spans, and verify whether recordings share a source. It provides evidence-based rationales that can be checked against audio measurements, span labels, and generator metadata, and uses counterfactual examples to make its decisions follow the evidence. VeriSpoof-Plus achieves a pooled equal error rate (EER) of 2.14% across 14 test sets, while the smaller-training VeriSpoof-Base achieves 4.43%; the same model can also verify sources from unseen generators. Training updates only 29.7 million of its 2.85 billion parameters, and checkable rationales improve detection of partial fakes and edits not seen during training.'}, 'zh': {'title': '让语音伪造检测有证据，也能追溯来源', 'desc': 'VeriSpoof 是一种音频语言模型，可用同一套模型完成五项任务：检测语音是否为深度伪造、判断生成来源、分析录音条件、定位合成片段，以及验证不同录音是否来自同一来源。它会给出可核查的理由，依据包括波形测量、片段标签和生成器元数据，并通过反事实样例训练模型让判断与证据一致。在 14 个测试集上，VeriSpoof-Plus 的总体等错误率（EER）为 2.14%，在 28 个系统中排名第三，也是开放权重系统中的第一名；模型还可识别训练中未见过的生成器来源。训练时只更新 28.5 亿个参数中的 2970 万个参数，研究也显示，可核查的理由有助于发现简单判断容易漏掉的局部伪造。'}}}, {'id': 'https://huggingface.co/papers/2611.05593', 'title': 'GaussianRenderFormer: Transformer-based Rendering of 3D Gaussian Splats', 'url': 'https://huggingface.co/papers/2611.05593', 'abstract': 'Abstract  Can a neural network learn to render 3D Gaussian splats on its own, with no rasterizer in the renderer? We present GaussianRenderFormer, a transformer that takes a set of Gaussians and a camera and outputs the image directly. Each Gaussian becomes one token in a view-independent encoder, and a view-dependent decoder turns small patches of camera rays into pixels by attending to those tokens. Trained on 26,820 Objaverse objects pruned to 20,000 Gaussians each, GaussianRenderFormer renders 300 unseen objects at 38.08 dB PSNR against the full, unpruned splats, while rasterizing the same pruned input reaches 44.02 dB. The gap is not one of generalization, and our diagnostics are consistent with a bottleneck in the view decoder: telling it the projected footprint of each Gaussian, which it could in principle infer, adds 1.4 dB. Under-training is not ruled out. Code, trained models and videos: https://svlwoof.github.io/gaussianrenderformer', 'score': 3, 'issue_id': 3501, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'af65d601c2b275fa', 'pdf_title_img': 'assets/pdf/title_img/2611.05593.jpg', 'data': {'categories': ['#architecture', '#3d', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Нейросеть рисует 3D-сцены сама, без растеризатора', 'desc': 'Авторы исследуют, может ли нейронная сеть научиться рендерить 3D Gaussian splats без классического растеризатора. Предложенная модель GaussianRenderFormer — это трансформер: каждый гауссиан становится одним токеном в view-independent энкодере, а view-dependent декодер преобразует патчи лучей камеры в пиксели через attention к этим токенам. На 300 новых объектах из Objaverse модель достигает 38.08 dB PSNR относительно полных сплатов, тогда как растеризация тех же данных даёт 44.02 dB. Диагностика указывает на узкое место в декодере, а передача проецированных размеров гауссианов улучшает результат на 1.4 dB.'}, 'en': {'title': 'Render Gaussian Splats Directly with a Transformer', 'desc': 'GaussianRenderFormer is a transformer that renders images directly from 3D Gaussian splats and a camera, without using a rasterizer. It encodes each Gaussian as a token, then uses a camera-aware decoder to turn patches of camera rays into pixels by attending to those tokens. On 300 unseen objects, it reaches 38.08 dB PSNR compared with full, unpruned splats, while rasterizing the same pruned splats reaches 44.02 dB. The results suggest that the view-dependent decoder is a bottleneck: giving it each Gaussian’s projected footprint improves PSNR by 1.4 dB, though the model may also need more training.'}, 'zh': {'title': '让 Transformer 直接从 3D 高斯生成图像', 'desc': '本文提出 GaussianRenderFormer，一种无需光栅化器、直接把 3D 高斯和相机转换成图像的 Transformer。模型将每个高斯编码为一个标记，再由依赖视角的解码器读取这些标记，并把相机射线的小块预测为像素。模型在 Objaverse 数据集的 26,820 个物体上训练，在 300 个未见物体上的 PSNR 为 38.08 dB，低于对同一组精简高斯进行光栅化得到的 44.02 dB。诊断结果表明，解码器可能是性能瓶颈：额外提供高斯投影到图像上的覆盖范围可提升 1.4 dB，但训练不足也可能有影响。'}}}, {'id': 'https://huggingface.co/papers/2611.05609', 'title': 'On the Generalization Limitation of On-Policy Distillation for Post-RL Consolidation', 'url': 'https://huggingface.co/papers/2611.05609', 'abstract': "Abstract  Multi-teacher on-policy distillation (MOPD) extends on-policy distillation (OPD) to consolidate capabilities from multiple teachers. Although prior work reports near-perfect in-distribution (IND) distillation performance, we find that this can mask incomplete capability consolidation beyond the supervised distribution. A preliminary study on synthetic reasoning shows that OPD does not fully transfer teachers' generalization capabilities. We then extend this investigation to real-world tasks, evaluating extrapolative and compositional generalization across mathematical reasoning, coding, agent, and long-context capabilities using Qwen3 models. Across extrapolative settings, OPD and MOPD reach 96.04-102.73% of their teachers' IND scores. Yet their out-of-distribution (OOD) scores remain 2.45-16.25% below the base model's. Across three compositional settings, MOPD improves IND performance over the base model, but its performance on composed tasks as OOD remains 18.19-24.34% below that of the best teachers. To understand these gaps, we examine teacher capability and data coverage as two potential bottlenecks. Jointly alleviating these bottlenecks eliminates OOD forgetting in our experiments and suggests the potential for generalization beyond the teacher. (M)OPD also reduces OOD forgetting on average relative to its reinforcement learning (RL) baselines. Analysis of the associated update geometry reveals smaller and more spectrally concentrated updates on average than those of the RL baselines, along with greater shared update structure under MOPD. Motivated by these findings, we propose geometry-based patching and base-preserving replay to improve OOD performance while largely preserving IND performance. Our findings identify a blind spot in capability consolidation via (M)OPD, highlighting the need for algorithms that explicitly support OOD retention and generalization.", 'score': 3, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '479d7de72c3ba593', 'authors': ['Yichen Wang', 'Yufa Zhou', 'Siqi Zhu', 'Haozheng Luo', 'Jingzhi Bao', 'Zhichao Liu', 'Zijun Wei'], 'affiliations': ['ByteDance', 'Duke University', 'Northwestern University', 'UIUC', 'University of Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2611.05609.jpg', 'data': {'categories': ['#training', '#benchmark', '#optimization', '#alignment', '#reasoning'], 'emoji': '🧑🏫', 'ru': {'title': 'Дистилляция из нескольких учителей не гарантирует обобщение: ученик забывает за пределами обучающих данных', 'desc': 'В статье исследуется multi-teacher on-policy distillation (MOPD), то есть дистилляция из нескольких учителей на on-policy данных, которая объединяет способности нескольких моделей-учителей в одну модель-ученика. Авторы показывают, что высокие результаты на in-distribution (IND) задачах скрывают неполный перенос обобщающей способности: на out-of-distribution (OOD) задачах, включая экстраполяцию и композиционное обобщение, модели хуже базовой и лучших учителей. Анализ выявляет два узких места: качество учителей и покрытие данных, а также геометрию обновлений весов, которая отличается от RL-бейзлайнов. На основе этого предлагаются geometry-based patching и base-preserving replay, улучшающие OOD-производительность при сохранении IND-результатов.'}, 'en': {'title': 'Distill More Than the Training Distribution', 'desc': 'This paper studies whether on-policy distillation (OPD) and multi-teacher OPD (MOPD) transfer teachers’ abilities beyond the training distribution. Although both methods often match teachers on in-distribution tasks, they can perform worse on out-of-distribution tasks, especially when tasks require extrapolation or combining capabilities. The authors find that weak teacher capabilities and gaps in training-data coverage contribute to this forgetting, and that addressing both can eliminate it in their experiments. They also propose geometry-based patching and base-preserving replay, which improve out-of-distribution performance while largely maintaining in-distribution results.'}, 'zh': {'title': '蒸馏不止要学会，更要保住分布外泛化能力', 'desc': '本文研究多教师在线策略蒸馏（MOPD）能否把多个教师的能力有效迁移到学生模型中。实验发现，即使模型在训练分布（IND）上的表现接近教师，在分布外（OOD）的推理、编程、智能体和长上下文任务上仍可能出现能力遗忘，尤其是组合任务。教师能力不足和训练数据覆盖不够是造成这一差距的两个潜在瓶颈；同时改善它们后，实验中的 OOD 遗忘得以消除。作者还提出基于更新几何的修补方法和保留基模型的回放策略，以提升 OOD 表现并尽量维持 IND 表现。'}}}, {'id': 'https://huggingface.co/papers/2611.03330', 'title': 'The SIMPLE Law for Energy Cost of LLM Inference', 'url': 'https://huggingface.co/papers/2611.03330', 'abstract': 'Abstract A four-parameter analytical law predicts LLM inference energy across architectures, revealing quadratic prefill costs, GQA savings, and super-linear growth from reasoning budgets and agentic serving.  Generated by thinkingmachines/Inkling-Small Generative AI is billed per token, yet tokens are not equally expensive. Each token enters the KV-cache and raises the cost of those that follow, so energy grows non-linearly along a sequence whose tokens look identical. No analytical model states what a token costs, and the most accurate SOTA model is a fit, not a law: it absorbs architecture into fitted coefficients, requiring per-LLM fitting. We derive closed-form expressions of the computational and memory-access complexity of LLM inference in terms of architectural hyperparameters, covering MHA and GQA, and compare a family of analytical models of increasing granularity. From these, we obtain the SIMPLE Inference Model to Predict LLMs Energy (SIMPLE), a four-parameter law that separates prefill from decode, and decode into KV-cache cost and next-token computation. Over traces of 13 dense LLMs from six families on NVIDIA H100 GPUs, it attains R2 = 0.969 and 11.97% MAPE, 3.1-3.5x below the SOTA, without per-LLM calibration. The SIMPLE law explains as well as predicts: prefill energy grows quadratically with the hidden dimension, so larger LLMs suffer most from long inputs; and more aggressive GQA KV grouping reduces the per-token energy by up to 3x relative to standard MHA. Increasing the reasoning token budget pushes output length beyond the analytically derived energy minimum, driving super-linear energy growth; although accuracy grows with the budget, energy grows faster, so Intelligence per Joule peaks at an intermediate budget and falls by up to 3.14x across a 4.0x reasoning-budget range. Agentic serving raises energy per request by 13.0x relative to non-agentic ones, driven by the growth of both the prefill and the KV-cache terms with input length; while prefix caching removes most of the prefill cost (-93%), the KV-cache term is unaffected, so even a cached agentic request costs 4.8x more.', 'score': 2, 'issue_id': 3501, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '5dabd33ea6d268f2', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#optimization', '#architecture', '#survey'], 'emoji': '⚡', 'ru': {'title': 'Не все токены одинаково дороги: закон энергии LLM', 'desc': 'В статье предлагается SIMPLE — аналитический закон из четырёх параметров, который предсказывает энергопотребление инференса LLM без калибровки под каждую модель. Модель разделяет префилл и декодирование, а декодирование — на затраты KV-cache и вычисление следующего токена. На 13 плотных LLM на GPU H100 закон даёт R² = 0.969 и MAPE 11.97%, что в 3.1–3.5 раза точнее текущего SOTA. Авторы показывают, что стоимость префилла растёт квадратично с размерностью скрытого слоя, GQA снижает энергию на токен до 3 раз, а агентный режим увеличивает энергию запроса в 13 раз.'}, 'en': {'title': 'A Simple Law for the True Energy Cost of LLM Inference', 'desc': 'The paper introduces SIMPLE, a four-parameter analytical model that predicts LLM inference energy without fitting separate coefficients for each model. It separates energy into prefill, KV-cache access during decoding, and next-token computation, and covers both multi-head attention (MHA) and grouped-query attention (GQA). The model predicts energy accurately across 13 LLMs and shows that prefill energy grows quadratically with hidden dimension, while GQA can reduce per-token energy by up to three times. It also finds that large reasoning budgets and agentic requests can raise energy sharply, and that prefix caching reduces prefill energy but not KV-cache costs.'}, 'zh': {'title': '用四参数解析模型，揭示大模型推理能耗规律', 'desc': '本文提出 SIMPLE 模型，用四个参数估算不同架构大语言模型推理时的能耗，并将预填充阶段与解码阶段的成本分开分析。该模型进一步拆分解码能耗中的 KV 缓存访问和下一个 token 的计算成本，无需针对每个模型单独拟合，在 13 个模型上的预测表现优于此前的基准方法。分析表明，预填充能耗会随隐藏维度呈平方增长，而更强的分组查询注意力（GQA）可降低 KV 缓存相关能耗；推理 token 预算过高时，能耗会超线性增长，使单位能耗智能度在中等预算处达到峰值。智能体请求因输入更长而能耗大幅增加，前缀缓存虽能显著降低预填充能耗，却无法减少 KV 缓存成本。'}}}, {'id': 'https://huggingface.co/papers/2611.06042', 'title': 'UniRestorer++: Scalable Universal Image Restoration with Multi-Granularity Degradation Modeling', 'url': 'https://huggingface.co/papers/2611.06042', 'abstract': 'Abstract UniRestorer++ scales universal image restoration via multi-granularity degradation modeling and adaptive routing, achieving stronger scaling and generalization across diverse degradations.  Generated by thinkingmachines/Inkling-Small Universal image restoration aims to handle diverse degradations within a single model, but a reliable scaling strategy remains underexplored. Increasing backbone depth and width can lead to performance saturation, while degradation-aware specialization depends on accurate degradation estimation and is vulnerable to errors on out-of-distribution and real-world inputs. We propose UniRestorer++, a scalable framework based on multi-granularity degradation modeling. It progressively refines degradation groups and introduces group-specific experts, coupling capacity growth with specialization. Degradation-estimation-based routing selects a root-to-leaf path, while granularity-estimation-based routing chooses a level along that path to balance specialization and robustness. Spatially dense degradation representation maps further enable region-aware routing for spatially non-uniform corruptions. We develop CDD-50, a benchmark covering 50 degradation categories from single to penta-degradation. Experiments show approximately log-linear PSNR trends over the evaluated model-size range and stronger scaling gains on out-of-distribution and real-world data than vanilla MoE scaling. UniRestorer++ achieves state-of-the-art performance across benchmarks and demonstrates zero-shot generalization and few-shot transfer on real-world images. Code: https://github.com/mrluin/UniRestorer_plusplus', 'score': 2, 'issue_id': 3501, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '7b21e97cd6255636', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#training', '#architecture', '#cv', '#optimization', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Одна модель, которая растёт вместе с задачей: масштабируемое восстановление изображений от любых искажений', 'desc': 'В статье представлен UniRestorer++ — масштабируемая архитектура для универсального восстановления изображений, которая одной моделью устраняет множество типов деградаций. Авторы вводят многоуровневое моделирование деградаций (multi-granularity degradation modeling) и группоспецифичных экспертов, объединённых в MoE-подобную структуру с адаптивной маршрутизацией по дереву деградаций. Маршрутизация учитывает как оценку типа деградации, так и уровень гранулярности, а также пространственно плотные представления для неоднородных искажений. Модель демонстрирует почти логарифмически-линейный рост PSNR с увеличением размера, лучше масштабируется на out-of-distribution и реальных данных и показывает zero-shot и few-shot обобщение, а также достигает SOTA на новом бенчмарке CDD-50.'}, 'en': {'title': 'One Restorer, Many Degradations—Scaling Through Adaptive Experts', 'desc': 'UniRestorer++ is a single model designed to restore images affected by many kinds of damage. It organizes degradations into increasingly specific groups and adds specialized experts, with routing that selects both an expert path and the right level of specialization. Dense degradation maps also let the model route different image regions separately when damage varies across an image. Tests on a new benchmark and other datasets show that it scales well and generalizes strongly to unfamiliar and real-world degradations, including in zero-shot and few-shot settings.'}, 'zh': {'title': '让专家按退化分工，让图像复原随规模持续变强', 'desc': '本文提出 UniRestorer++，旨在用单一模型处理多种图像退化，并通过多粒度退化建模实现可扩展的图像复原。它逐步细分退化类别并为各组配置专属专家，再依据退化估计选择专家路径、依据粒度估计选择路径层级，从而兼顾专业化与鲁棒性。对于图像中不同区域受损程度不一的情况，模型还利用稠密空间退化表示进行区域级路由，并构建涵盖 50 类退化的 CDD-50 基准。实验显示，该方法随模型规模扩大持续提升性能，在分布外与真实图像上优于常规混合专家扩展，并具备零样本泛化和少样本迁移能力。'}}}, {'id': 'https://huggingface.co/papers/2611.04760', 'title': 'Koopman Generative Operators for Efficient Probabilistic Time-Series Forecasting', 'url': 'https://huggingface.co/papers/2611.04760', 'abstract': 'Abstract KGO unifies structured latent dynamics with single-step flow matching and adaptive uncertainty gating to achieve accurate, efficient probabilistic time-series forecasting.  Generated by thinkingmachines/Inkling-Small Probabilistic time-series forecasting requires models that simultaneously capture structured temporal dynamics, expressive uncertainty, and efficient inference, yet existing approaches fall short of this goal: latent dynamical models impose structure but rely on restrictive generation mechanisms, while modern generative methods such as diffusion and flow matching achieve flexibility at the cost of iterative and computationally expensive sampling. We introduce the Koopman Generative Operator (KGO), a probabilistic forecasting method that conceptualizes prediction as the evolution of structured uncertainty. KGO integrates three core components: (1) Koopman Patch Embedding (KoPE) for temporally consistent latent trajectory extrapolation; (2) Koopman Flow Matching (KoFM), which enables fast, single-step generation through a closed-form matrix exponential in a Koopman latent space, bypassing iterative sampling; and (3) an Adaptive Uncertainty Gate (AUG), which provides probabilistic forecasts by adapting uncertainty per-variable and per-horizon, corresponding to a learned decomposition of aleatoric uncertainty without manual tuning. By unifying these components, KGO achieves state-of-the-art accuracy on 13/17 ProbTS benchmarks in CRPS and 16/17 in NMAE. Further, by eliminating iterative sampling, KGO delivers at least a 25times reduction in inference time compared to iterative generative models. These results position KGO as a practical and principled framework that advances the accuracy-efficiency trade-off in probabilistic time-series forecasting, combining leading accuracy on the evaluated benchmarks with fast, single-step generation.', 'score': 2, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'fe950da52e8ec581', 'authors': ['Raz Marshanski', 'Liran Nochumsohn', 'Mayank Jauhari', 'Boris N. Oreshkin', 'Omri Azencot'], 'affiliations': ['Amazon Science', 'Ben-Gurion University of the Negev'], 'pdf_title_img': 'assets/pdf/title_img/2611.04760.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#architecture', '#inference'], 'emoji': '📈', 'ru': {'title': 'Прогноз за один шаг: точность вероятностных временных рядов без итеративного сэмплирования', 'desc': 'Статья представляет Koopman Generative Operator (KGO) — метод вероятностного прогнозирования временных рядов, который рассматривает предсказание как эволюцию структурированной неопределённости. Модель объединяет Koopman Patch Embedding для согласованной экстраполяции латентных траекторий, Koopman Flow Matching, позволяющий генерировать прогноз за один шаг через матричную экспоненту в латентном пространстве Купмана, и Adaptive Uncertainty Gate, адаптивно настраивающий алеаторическую неопределённость по переменным и горизонтам. По результатам на бенчмарках ProbTS KGO превосходит современные методы по CRPS и NMAE, а время инференса сокращается минимум в 25 раз по сравнению с итеративными генеративными моделями.'}, 'en': {'title': 'Forecast Time Series Accurately—in One Fast Step', 'desc': 'The paper introduces the Koopman Generative Operator (KGO), a probabilistic model for forecasting time series. It uses Koopman Patch Embedding to represent temporal patterns and Koopman Flow Matching to generate forecasts in one step, avoiding slow iterative sampling. An Adaptive Uncertainty Gate estimates uncertainty separately for each variable and forecast horizon. KGO achieves strong accuracy on many benchmarks while reducing inference time by at least 25 times compared with iterative generative models.'}, 'zh': {'title': '单步生成，兼顾时间序列预测的准确性与效率', 'desc': '这篇论文提出 Koopman Generative Operator（KGO），用于概率时间序列预测，将预测建模为结构化不确定性的演化。它通过 Koopman Patch Embedding 保持潜在轨迹的时间一致性，并利用 Koopman Flow Matching 在 Koopman 潜在空间中通过矩阵指数实现单步生成，无需反复采样。自适应不确定性门控会针对不同变量和预测时距调整不确定性，从而学习刻画偶然不确定性。KGO 在 17 个基准中的 13 个取得最佳 CRPS、16 个取得最佳 NMAE，且推理速度至少比迭代式生成模型快 25 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.05988', 'title': 'LiveFoley: Dynamic Real-Time Video-to-Audio Generation for Immersive Interactive Worlds', 'url': 'https://huggingface.co/papers/2611.05988', 'abstract': 'Abstract LiveFoley improves streaming video-to-audio generation by using a trailing sliding window for visual alignment and expanded temporal denoising windows for audio quality with minimal latency.  Generated by thinkingmachines/Inkling-Small Streaming video-to-audio (V2A) generation is essential for immersive interactive applications. However, real-time constraints leave existing streaming V2A methods far behind offline models: (1) visual frontends shrink their receptive fields to cut look-ahead latency, severely degrading audio-visual alignment; (2) causal autoregressive diffusion backends denoise each audio patch in isolation, impairing audio quality. To this end, we present LiveFoley, a streaming causal autoregressive diffusion architecture that addresses both bottlenecks with imperceptible latency. For the visual frontend, we introduce a Trailing Sliding Window that converts non-causal segment-level encoders into streaming modules without retraining. By simply realigning the window, it preserves precise audio-visual alignment, while a configurable hop size reduces the frontend look-ahead well below the human perceptual threshold. Building on this tunable hop size, we propose the Unified Varhop Framework to accommodate scenarios with diverse latency and computation budgets. For the audio backend, we explore widening the denoising window of the local diffusion transformer (LocDiT) head in two temporal directions. History LocDiT adds past context to improve quality at no latency cost and serves as our default. Alternatively, Future-Warmup LocDiT breaks the autoregressive deadlock with an approximate future condition, further improving generation quality at the cost of an acceptable backend look-ahead. Extensive experiments demonstrate that LiveFoley matches offline models in temporal alignment and leads streaming systems in generation quality. Project page: https://dalision.github.io/livefoley-page/', 'score': 1, 'issue_id': 3501, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '0c2d116f56cac70e', 'authors': ['Yusheng Dai', 'Vladimir Iashin', 'Kangdi Wang', 'Yuxuan Jiang', 'Ilpo Viertola', 'Weiqiang Wang', 'Qiuhong Ke', 'Min Zhao', 'Jianfei Cai'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Monash University', 'Nanjing University', 'ShengShu Technology', 'Tampere University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05988.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#inference', '#synthetic', '#audio', '#video'], 'emoji': '🎬', 'ru': {'title': 'Звук в реальном времени: точная синхронизация с видео без задержки', 'desc': 'Статья представляет LiveFoley — потоковую причинную (causal) архитектуру авторегрессионной диффузии для генерации аудио по видео в реальном времени. Для визуальной части предложено Trailing Sliding Window, которое превращает сегментные энкодеры в потоковые без переобучения и сохраняет точное аудиовизуальное выравнивание при малой задержке. Для аудио-бэкенда (LocDiT) расширено окно шумоподавления за счёт History LocDiT и Future-Warmup LocDiT, что повышает качество звука при минимальной задержке. Эксперименты показывают, что LiveFoley по временному выравниванию не уступает оффлайн-моделям и превосходит потоковые системы по качеству генерации.'}, 'en': {'title': 'Stream Sound with Better Timing and Quality', 'desc': 'LiveFoley is a streaming video-to-audio system designed to generate well-aligned, high-quality sound with very little delay. Its Trailing Sliding Window adapts existing visual encoders for streaming, while a configurable hop size lets users balance latency and computation. On the audio side, History LocDiT uses past context to improve sound quality without adding latency; Future-Warmup LocDiT can improve quality further by using an approximate future condition, with some extra delay. Experiments show that LiveFoley achieves temporal alignment comparable to offline models and strong audio quality among streaming systems.'}, 'zh': {'title': '低延迟流式生成，让视频与声音精准同步', 'desc': 'LiveFoley 是一种用于实时视频转音频的流式生成架构，旨在兼顾低延迟、视听对齐和音频质量。它采用“尾随滑动窗口”，将非因果视觉编码器改造成流式模块，无需重新训练，并可通过调整步长适应不同的延迟和计算预算。音频端使用局部扩散 Transformer 扩大去噪的时间窗口：历史上下文方案无需增加延迟即可提升质量，未来预热方案则以少量前瞻延迟换取进一步提升。实验表明，LiveFoley 的时间对齐效果可媲美离线模型，生成质量也优于其他流式系统。'}}}, {'id': 'https://huggingface.co/papers/2611.03394', 'title': 'TaoMate-HD: Progressive-Resolution Autoregressive Audio-Video Generation', 'url': 'https://huggingface.co/papers/2611.03394', 'abstract': 'Abstract TaoMate-HD is an autoregressive streaming model that generates high-resolution audiovisual content in chunks with progressive denoising, history-based continuation, and optimized parallel deployment for faster, coherent long-form output.  Generated by thinkingmachines/Inkling-Small Streaming digital humans produce detailed video while continuing speech as new text arrives. High-resolution denoising is costly, and text updates can cause repeated or interrupted speech. We present TaoMate-HD, an autoregressive model for high-resolution audio-video streaming. For each short segment, or chunk, two denoising steps establish coarse video structure at low resolution. A final step refines the video to high resolution, with audio generated throughout the same trajectory. Each stage passes its audiovisual predictions to the same stage of the next chunk as history. Across text updates, the model retains this history to infer what has already been spoken. Continuation training utilizes asymmetric text conditioning, with separate text windows for generation and distillation. Experiments show a 1.6x speedup over direct high-resolution generation with the same model and hardware. Optimized stage-parallel deployment provides a further 1.9x overall speedup over serial progressive generation. Our continuation training reduces character error rate by 11.18 percentage points relative to the baseline. The model also supports hour-long audiovisual generation. Our project page is https://taoliveaigc.github.io/TaoMate-HD.', 'score': 0, 'issue_id': 3501, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '19c79369b73e7a5a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#diffusion', '#training', '#inference', '#multimodal', '#synthetic', '#optimization', '#audio', '#long_context', '#video'], 'emoji': '🎬', 'ru': {'title': 'Потоковые цифровые люди: быстрое видео в высоком разрешении без повторов речи', 'desc': 'В статье представлена TaoMate-HD — авторегрессионная потоковая модель для генерации высококачественного аудиовидео по частям (чанкам) с прогрессивным диффузионным шумоподавлением. На каждом чанке два шага денойзинга формируют грубую структуру видео в низком разрешении, а финальный шаг доводит его до высокого, при этом аудио генерируется на той же траектории. История предыдущих чанков передаётся между стадиями и при обновлении текста позволяет модели понимать, что уже было произнесено, без повторов и обрывов. Обучение продолжению использует асимметричное текстовое обусловливание, а этапно-параллельный деплой даёт ускорение около 1.9x, при этом character error rate снижается на 11.18 п.п., и модель способна генерировать часовые ролики.'}, 'en': {'title': 'Stream First, Refine Fast, Keep the Story Going', 'desc': 'TaoMate-HD is an autoregressive model that creates high-resolution video and audio in short streaming chunks. It first denoises video at low resolution to form a rough structure, then refines it to high resolution while generating audio. The model uses previous chunks as history, helping it continue smoothly when new text arrives and avoid repeating spoken words. Progressive generation and parallel deployment make it faster, while continuation training lowers character error rate and supports hour-long output.'}, 'zh': {'title': '渐进去噪与历史续写，让长时高分辨率视听生成更快更连贯', 'desc': 'TaoMate-HD 是一种自回归流式模型，能分段生成高分辨率视频和音频，并在收到新文本时继续生成内容。它先在低分辨率下进行两步渐进式去噪以确定视频结构，再用最后一步提升分辨率，同时生成音频。每一段的预测会作为后续生成的历史信息，帮助模型跨越文本更新保持视听连贯，并避免重复或中断语音。实验显示，该方法比直接生成高分辨率内容快1.6倍，阶段并行部署又带来1.9倍整体加速；续写训练还将字符错误率降低了11.18个百分点，并支持长达一小时的生成。'}}}, {'id': 'https://huggingface.co/papers/2611.04949', 'title': 'HERIT: Enabling Global Access to Hanja-to-English Historical Translation by Mitigating Temporal Bias', 'url': 'https://huggingface.co/papers/2611.04949', 'abstract': 'Abstract HERIT adapts machine translation to historical archives via retrieval-augmented pseudo-labeling, improving accuracy across time periods and unlocking global access.  Generated by thinkingmachines/Inkling-Small Historical archives are invaluable for multidisciplinary research but remain inaccessible globally due to severe language barriers. While manual translation is prohibitively expensive and time-consuming, simply applying existing machine translation models is inadequate due to unique linguistic nuances and the temporal bias inherent in scarce human-labeled corpora. To address these challenges, we propose HERIT, a systematic domain-adaptation pipeline that leverages retrieval-augmented generation (RAG) to generate high-quality pseudo-labeled data from abundant Hanja-Korean corpora. This approach substantially expands the training dataset, mitigating both data scarcity and temporal overfitting across different historical periods. Extensive automated and human evaluations demonstrate that HERIT consistently outperforms baselines. Finally, we translate previously untranslated portions of the archives using our model, thereby enabling global access to these resources for researchers.', 'score': 0, 'issue_id': 3501, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '221e861c1f28e82e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#data', '#training', '#low_resource', '#synthetic', '#multilingual', '#rag', '#translation'], 'emoji': '📜', 'ru': {'title': 'Исторические архивы открываются миру благодаря ИИ-переводу', 'desc': 'Статья представляет HERIT — конвейер адаптации домена для машинного перевода исторических архивов с ханмуна (ханча) на корейский язык. Авторы используют retrieval-augmented generation (RAG) для генерации псевдоразмеченных данных (pseudo-labeling) из большого корпуса ханча-корейских текстов, что расширяет обучающую выборку и снижает переобучение под конкретные исторические периоды. Эксперименты, включающие автоматическую и человеческую оценку, показывают превосходство HERIT над базовыми моделями. С помощью модели авторы перевели ранее непереведённые части архивов, сделав их доступными для исследователей по всему миру.'}, 'en': {'title': 'HERIT: Opening Historical Archives with Retrieval-Augmented Translation', 'desc': 'HERIT adapts machine translation to translate historical Hanja into Korean. It uses retrieval-augmented generation to create pseudo-labeled training data from existing corpora. The expanded dataset helps address limited labeled data and reduces temporal overfitting across historical periods. Automated and human evaluations show improved translation quality, enabling researchers worldwide to access previously untranslated archives.'}, 'zh': {'title': '用检索增强伪标注，让历史档案跨越语言与时代的壁垒', 'desc': '这篇论文提出了 HERIT，用于将机器翻译模型适配到历史档案的翻译任务。它利用检索增强生成（RAG），从大量汉字—韩语语料中生成高质量的伪标注数据，扩充训练集。扩充后的数据缓解了标注数据稀缺和模型过度偏向特定历史时期的问题，并在自动评测和人工评测中优于基线方法。研究团队还用该模型翻译了档案中此前未翻译的内容，让全球研究者更容易获取这些历史资料。'}}}, {'id': 'https://huggingface.co/papers/2610.36544', 'title': "Monitor Accuracy Isn't the Answer: A Decision-Value Framework for Evaluating AI Agent Restart Monitors", 'url': 'https://huggingface.co/papers/2610.36544', 'abstract': 'Abstract  Classification accuracy and true-positive and false-positive rates alone do not determine whether restarting an AI agent improves success. Using an exact alarm-to-action identity for an independent clean restart with zero monitoring overhead, we show analytically that a monitor with fixed 90% accuracy can swing from a five-percentage-point loss to a 35-point gain in success rate, depending solely on the replacement attempt\'s residual-budget success probability. We introduce two techniques for evaluating monitors and progress signals in decision terms. First, a decision-sufficiency criterion, a binary-action specialization of Blackwell\'s comparison of experiments, identifies which progress representations or context compressions preserve the information needed to choose optimally between the specified actions, independent of trace reconstruction fidelity. Second, a finite-sample, model-free decision audit uses simultaneous binomial intervals over existing agent traces, without additional model calls, to certify a preference for "restart" or "continue" under stated sampling assumptions, or return "abstain" when evidence is insufficient. In a study of 194 externally evaluated model executions on 19 selected SymPy issues from SWE-bench Verified, with a retrospective audit of 130 of these traces, we find a 2.29-point apparent restart gain traced to a single surviving failed attempt, a 42.29-point loss on a second model, no positive replication of the initial gain on prospective task cohorts, and zero of 103 live comparisons meeting the specified certification bar. These results motivate evaluating agent monitors through recovery opportunity, decision value, and statistical support, rather than classification performance alone.', 'score': 0, 'issue_id': 3501, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'f11eb339ddf67bf1', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Точность монитора не равна пользе перезапуска: оценивайте решения, а не только классификацию', 'desc': 'Статья показывает, что точность классификации и доли верно и ложно срабатывающих алармов сами по себе не определяют, поможет ли перезапуск AI-агента, потому что итоговый эффект зависит от вероятности успеха повторной попытки в оставшемся бюджете. Авторы вводят критерий достаточности решения, частный случай сравнения экспериментов по Блэквеллу для бинарного выбора «перезапуск» или «продолжение», и модель-независимый аудит решений на основе биномиальных доверительных интервалов по уже имеющимся трассам без дополнительных вызовов LLM. На 194 запусках моделей по задачам SWE-bench Verified обнаружены нестабильные эффекты: кажущийся выигрыш и проигрыш, не подтверждённые на новых выборках, а ни одно из 103 живых сравнений не прошло порог сертификации. Вывод: мониторы агентов нужно оценивать по возможности восстановления, ценности решения и статистической надёжности, а не только по качеству классификации.'}, 'en': {'title': 'Judge Monitors by Whether They Improve Decisions', 'desc': 'The paper shows that a monitor’s accuracy alone cannot tell us whether an AI agent should restart or continue: the value of restarting depends on how likely a fresh attempt is to succeed with the remaining budget. It introduces a decision-sufficiency criterion, based on Blackwell’s comparison of experiments, to test whether a progress signal retains the information needed to choose between those actions. It also presents a model-free audit that uses simultaneous binomial confidence intervals on existing agent traces to recommend restarting, continuing, or abstaining when evidence is too weak. In experiments, restart outcomes varied widely across models and tasks, and none of 103 live comparisons met the audit’s certification bar, so the authors argue monitors should be judged by decision value and statistical evidence, not classification accuracy alone.'}, 'zh': {'title': '评估监控器，关键不在分类准不准，而在重启是否值得', 'desc': '仅看监控器的分类准确率、真正率和假正率，无法判断重启智能体是否会提高成功率；关键还在于替换后的尝试在剩余预算内成功的可能性。论文提出“决策充分性”标准，用来判断进度表示或上下文压缩是否保留了在“重启”和“继续”之间做最佳选择所需的信息。论文还提出一种无需额外调用模型的有限样本审计方法：利用已有轨迹和二项分布置信区间，在证据不足时明确弃权。对 SWE-bench Verified 中的任务进行研究后，作者发现重启收益缺乏稳定的正向验证，且 103 次在线比较均未达到预设的认证标准，因此建议依据恢复机会、决策价值和统计证据评估监控器。'}}}, {'id': 'https://huggingface.co/papers/2611.03517', 'title': "Ask, Don't Equip: Question-Driven Coding Agents for Deep Kernel Optimization", 'url': 'https://huggingface.co/papers/2611.03517', 'abstract': 'Abstract A question-driven LLM agent improves CUDA kernels by asking targeted questions at decision points, achieving faster FlashAttention implementations than a tool-rich autonomous baseline.  Generated by deepseek-ai/DeepSeek-V4.1-Flash LLM agents for GPU kernel optimization sit at two ends of a structure-freedom tradeoff. Scripted agents fix what the model does at each step, via a learned policy, an optimization menu, or fixed roles, and are sample-efficient where the recipe applies and stall where it does not. Open-ended agents let a self-directed model mutate a population of kernels and pay for the freedom in trials: thousands of evaluations, repeated edits, and wrong candidates. Both respond to hard targets by equipping the agent with more: parsed profiler output, disassembly analysis, retrieval over documentation and libraries, and stores of lessons. We argue that both lack direction, a hypothesis about where the remaining gap is, and that a short question asked at the right moment supplies it without narrowing what the agent may do next. We present KernelSeek, a question-driven agent that makes an existing CUDA kernel faster with no operator-specific knowledge and no faster implementation to imitate: a general-purpose coding agent, a minimal harness that enforces a verifiable goal, and questions at decision points, first from a human, then from a bank the agent applies to itself. On the same task, evaluator, hardware, and week, a tool-rich autonomous agent built in the prevailing style plateaued at 0.50x FlashAttention-3 after 133 model-driven steps; KernelSeek reached 1.13x. It then produced dependency-free FlashAttention forward kernels for Hopper and Blackwell, single CUDA files with no CUTLASS, CuTe, cuBLAS, or cuDNN, correct on all 182 scenarios per architecture and 1.16x FlashAttention-3 and 1.46x FlashAttention-4 (geometric mean). Across 162 human messages and 11.5K agent tool calls, every large gain followed a question that moved the agent to a different layer of the system or rejected a claimed limit, never one that supplied information. We release the kernels, harness, question bank, and all traces.', 'score': 0, 'issue_id': 3501, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '6014878bf25cb3da', 'authors': ['Gabriele Oliaro', 'Jaeseong Lee', 'Zhaoyuan Su', 'Sreeram Vennam', 'Zhihao Jia', 'Samyam Rajbhandari'], 'affiliations': ['1', '2'], 'pdf_title_img': 'assets/pdf/title_img/2611.03517.jpg', 'data': {'categories': ['#plp', '#benchmark', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Не больше инструментов, а правильный вопрос в нужный момент', 'desc': 'Статья представляет KernelSeek — LLM-агента для оптимизации CUDA-ядер, который работает без знаний о конкретном операторе и без готовой быстрой реализации для подражания. Агент получает не больше инструментов, а короткие вопросы в ключевых точках принятия решений, сначала от человека, затем из банка вопросов, который агент применяет к себе сам. На той же задаче и железе он превзошёл инструментально богатый автономный baseline: 1.13x против 0.50x относительно FlashAttention-3. Итоговые ядра для архитектур Hopper и Blackwell, написанные без CUTLASS, CuTe, cuBLAS и cuDNN, работают в среднем в 1.16x быстрее FlashAttention-3 и в 1.46x быстрее FlashAttention-4.'}, 'en': {'title': 'Ask the right question to unlock faster GPU kernels', 'desc': 'KernelSeek is an LLM agent that improves CUDA kernels by asking focused questions at key decision points. Unlike scripted agents, it can choose its own optimization strategy, while the questions help it identify where performance is still being lost. It outperformed a tool-rich autonomous baseline on FlashAttention and produced correct, dependency-free kernels for Hopper and Blackwell GPUs. The results suggest that well-timed questions can guide kernel optimization without prescribing the solution.'}, 'zh': {'title': '关键时刻问对问题，让 CUDA 内核更快', 'desc': '这篇论文提出 KernelSeek，一种通过在关键决策点提出有针对性问题来优化 CUDA 内核的 LLM 智能体。它不依赖针对特定算子的知识或现成的高速实现，而是借助可验证的目标和问题引导，促使通用代码智能体探索优化方向。与使用丰富工具但缺乏明确方向的自主基线相比，KernelSeek 将 FlashAttention-3 的性能提升到 1.13 倍，并生成了适用于 Hopper 和 Blackwell 架构、通过全部测试场景的独立 CUDA 内核。实验显示，显著性能提升通常来自能促使智能体转向系统其他层面或重新审视性能限制的问题，而非直接提供答案的问题。'}}}, {'id': 'https://huggingface.co/papers/2611.03852', 'title': 'Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost', 'url': 'https://huggingface.co/papers/2611.03852', 'abstract': "Abstract Rewriting reasoning histories into compact state records reduces future reasoning length and token costs in open-weight models without retraining.  Generated by thinkingmachines/Inkling-Small Reasoning substantially improves language models' ability to solve difficult problems, but long reasoning traces make these gains expensive. Efficient reasoning should express useful analysis in fewer tokens by reducing repetition and text that adds little value to solving the problem. Progress in proprietary models motivates this goal, yet their hidden scratchpads limit direct study of how it is achieved. We investigate whether open-weight models can generate less verbose reasoning by changing the form of their own earlier thoughts, without retraining. Our intervention rewrites prior reasoning into compact state records before pending tool results are revealed, then compares continuations from original and compact histories. Across the tested models, accepted compact histories usually shorten future reasoning; a coding case study also shows less repeated verification after a shared candidate solution. In software-agent deployments, compaction can reduce total spending, although task quality and rewrite-inclusive time depend on the target and compressor. These findings identify reasoning history as one way to reduce future reasoning-token use and motivate model-specific compaction policies evaluated for both efficiency and retained capability.", 'score': 0, 'issue_id': 3501, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '574941dd21e1382d', 'pdf_title_img': 'assets/pdf/title_img/2611.03852.jpg', 'data': {'categories': ['#inference', '#optimization', '#agents', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Сжимаем мысли модели, а не её знания: короче рассуждения без переобучения', 'desc': 'Статья предлагает метод сокращения длины рассуждений языковых моделей без дообучения: перед тем как станут доступны результаты инструментов, предыдущие цепочки рассуждений переписываются в компактные записи состояний. Затем сравниваются продолжения, сгенерированные по исходной и сжатой истории. Эксперименты с открытыми моделями показывают, что принятые сжатые истории обычно уменьшают объём последующих рассуждений и снижают повторные проверки, например, в задачах программирования. Метод может сокращать расходы на токены в программных агентах, однако качество решений и общее время зависят от модели и используемого компрессора.'}, 'en': {'title': 'Compact the Past, Spend Less on the Next Thought', 'desc': 'The paper studies whether open-weight language models can use fewer tokens by rewriting their earlier reasoning into compact state records, without retraining. The compact records preserve useful information while removing repetition and low-value text. Across tested models, accepted compact histories generally shorten later reasoning, and a coding study finds less repeated verification. Compaction can lower software-agent costs, but its effects on task quality and total time vary by model and compressor.'}, 'zh': {'title': '压缩推理历史，让后续思考更省 token', 'desc': '本文研究如何在不重新训练模型的情况下，把先前的推理改写成更精简的状态记录，以减少后续推理所需的长度和 token 成本。方法是在工具结果揭晓前压缩推理历史，并比较模型基于原始历史或压缩历史继续作答的表现。实验发现，模型接受的精简记录通常能缩短后续推理；在编程案例中，也减少了对同一候选方案的重复验证。实际软件智能体应用显示，压缩有望降低总成本，但效果、任务质量和耗时取决于目标模型与压缩器，因此需要针对不同模型评估效率与能力保留情况。'}}}, {'id': 'https://huggingface.co/papers/2611.05029', 'title': 'DRAP: Dynamics-Risk Adaptive Plasticity for Continual Learning in Physical AI', 'url': 'https://huggingface.co/papers/2611.05029', 'abstract': 'Abstract DRAP improves replay-free continual learning for physical AI by adaptively reducing plasticity of critical model components based on trajectory-amplification risk, enhancing retention of past behaviors without sacrificing new task learning.  Generated by thinkingmachines/Inkling-Small Continual learning in physical AI differs from conventional continual learning because small per-step policy errors can accumulate over a trajectory. Each deviation may move the agent outside the training distribution, increase subsequent prediction errors, and ultimately cause closed-loop task failure. This work introduces Dynamics-Risk Adaptive Plasticity (DRAP), a replay-free method that estimates the historical importance of adaptable model tensors from sample-level action gradients weighted by local trajectory-amplification risk. A ridge-regularized local linear model is fitted to expert state-action transitions, and the largest singular value of its state-transition matrix provides a policy-independent, Lyapunov-inspired estimate of one-step perturbation amplification. After each task, risk-weighted squared gradients are accumulated in a tensor-level importance memory. During subsequent tasks, DRAP uses normalized cumulative importance to scale the effective AdamW learning rate of each tensor, immediately reducing the plasticity of components that supported previous behavior at dynamically sensitive trajectory points. We instantiate DRAP on a fixed KappaTune-selected subnetwork of OpenVLA and evaluate replay-free sequential adaptation across the LIBERO Spatial, Object, and Goal suites. Compared with standard AdamW fine-tuning and EWC, the results show substantially improved retention of previously learned behaviors while preserving strong new-suite acquisition.', 'score': 0, 'issue_id': 3501, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '5153bd3dd7779b72', 'authors': ['Oswaldo Ludwig'], 'affiliations': ['Email: oswaldoludwig@gmail.com'], 'pdf_title_img': 'assets/pdf/title_img/2611.05029.jpg', 'data': {'categories': ['#robotics', '#rl', '#training', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Учиться новому, не забывая старое: адаптивная пластичность для роботов', 'desc': 'В статье предлагается DRAP — метод непрерывного обучения без повторного использования старых данных (replay-free) для физического ИИ, например роботов на базе OpenVLA. Ошибки на отдельных шагах траектории могут накапливаться и приводить к провалу задачи, поэтому метод оценивает чувствительность динамики через наибольшее сингулярное значение локальной линейной модели. Важность параметров накапливается по градиентам, взвешенным этим риском, и затем уменьшает скорость обучения наиболее важных тензоров при освоении новых задач. Эксперименты на наборах LIBERO показывают лучшее сохранение прежних навыков по сравнению с AdamW и EWC при сохранении качества на новых задачах.'}, 'en': {'title': 'Protect what matters, keep learning what’s next', 'desc': 'DRAP is a replay-free method for helping a robot policy remember earlier tasks while learning new ones. It estimates which model components are important by combining action gradients with a measure of how strongly small errors can grow along a trajectory. After each task, it remembers these importance scores and lowers the learning rate of components that were important for past behavior. In tests on OpenVLA, DRAP retained earlier behaviors better than standard fine-tuning and EWC while still learning new tasks well.'}, 'zh': {'title': '识别轨迹风险，稳住旧能力，也学好新任务', 'desc': '在物理智能体的持续学习中，微小的策略误差可能沿着行动轨迹不断放大，最终导致任务失败。本文提出 DRAP，一种无需回放旧数据的方法，用局部状态转移模型估计误差放大的风险，并结合动作梯度衡量模型各部分对旧行为的重要性。完成一个任务后，DRAP 会累积这些重要性分数，并在后续任务中降低关键模型张量的有效学习率，以保护已有能力。实验显示，在 OpenVLA 上，DRAP 比标准 AdamW 微调和 EWC 更能保留旧任务表现，同时仍能学习新任务。'}}}];
