ентный цикл, который сам находит алгоритмические и системные оптимизации для спекулятивного декодирования LLM под конкретное развёртывание. Авторы выделяют три проблемы: при одном запросе каждый шаг принимает мало токенов, при батчинге проверка снижает ускорение почти вдвое, а оптимальные решения зависят от модели, драфтера и GPU. Система использует cost model для поиска самых больших разрывов с теоретическим пределом, параллельных агентов, token forcing для защиты от reward hacking и структурированную память. Без обучения и потери качества SpecPilot повышает ускорение относительно AR с 4.46x до 10.87x при одном запросе и с 1.94x до 3.93x при батчинге.'}, 'en': {'title': 'Let Each Deployment Discover Its Fastest Speculative Decoding', 'desc': 'Speculative decoding speeds up language model generation by using a small drafter to propose tokens that a larger target model checks. Existing systems often fall short of their potential, especially for single requests and batched serving, and the best optimizations vary across models, drafters, and GPUs. SpecPilot uses an autonomous search loop: a cost model identifies bottlenecks, agents test optimizations, and token-by-token checks ensure outputs stay identical to the stock system. Across several models and hardware setups, it finds lossless optimizations that increase speedup over standard autoregressive decoding from 4.46× to 10.87× for one request, and from 1.94× to 3.93× with batching.'}, 'zh': {'title': '让投机解码因部署而优化，把速度潜力变成实际加速', 'desc': '投机解码用轻量草稿模型先生成候选 token，再由目标模型验证，从而加快大语言模型的生成。论文指出，现有并行投机解码系统在单请求和批处理场景中都未充分发挥潜在加速，而且最佳优化取决于模型、草稿器、GPU 和服务方式。SpecPilot 是一个自主优化框架：它用成本模型找出性能差距，让多个代理探索优化，并通过逐 token 对照确保输出与原系统一致。它发现了多种无损算法与系统优化，使相对自回归解码的加速比从单请求的 4.46 倍提升至 10.87 倍、从批处理的 1.94 倍提升至 3.93 倍。'}}}, {'id': 'https://huggingface.co/papers/2610.40753', 'title': '"Shall We Approve?" Consequence-Aware Approval for Autonomous Coding Agents', 'url': 'https://huggingface.co/papers/2610.40753', 'abstract': "Abstract Caper pre-executes shell commands in isolated sandboxes to evaluate real-world effects before approval, reducing harmful outcomes compared to text-based approvers.  Generated by thinkingmachines/Inkling-Small Coding agents increasingly rely on automated approvers to decide whether a proposed shell command may run. Existing approvers, from rule-based checkers to guardrail models and deployed permission classifiers, base their decisions on the text of the request and command. Yet a command's behavior depends on the code it invokes and the state of the workspace, and systems that observe file changes leave the assessment to the agent or a human after execution. We present Caper, a consequence-aware approval mechanism that pre-executes each command in a snapshotted sandbox, provides an independent approver with a bounded report of its observed effects, commits allowed commands, and rolls back blocked ones with a reason the agent can act on. Compared with six existing systems, Caper achieves the lowest harmful-outcome rate on SABER (6.7% versus at least 14.8%) and YoloFS-Ext, a benchmark we build in which harmful behavior is hidden inside invoked tools (7.8% versus at least 35.3%), while blocking 1.0% of the safe twins of the dangerous tasks in YoloFS-Ext.", 'score': 11, 'issue_id': 3497, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '4d78e5d77cc13fd9', 'authors': ['Weiheng Wu', 'Junkai Chen', 'Zhensu Sun', 'Jieke Shi', 'Yunbo Lyu', 'David Lo'], 'affiliations': ['University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.40753.jpg', 'data': {'categories': ['#security', '#agents', '#benchmark'], 'emoji': '🛡️', 'ru': {'title': 'Проверяй последствия команд до их выполнения, а не после', 'desc': 'Статья представляет Caper — механизм одобрения команд, который предварительно выполняет shell-команды в изолированной песочнице со снимком файловой системы. Независимый approver (классификатор или LLM) получает ограниченный отчёт о наблюдаемых эффектах, а не только текст запроса, что важно, поскольку поведение команды зависит от вызываемого кода и состояния рабочей среды. Разрешённые команды фиксируются, заблокированные откатываются вместе с объяснением причины, которое агент может использовать для исправления. На бенчмарках SABER и YoloFS-Ext Caper показывает наименьшую долю вредных исходов (6.7% и 7.8%) по сравнению с шестью существующими системами, при этом блокируя лишь 1.0% безопасных аналогов опасных задач.'}, 'en': {'title': 'Test Commands Before They Touch Your Workspace', 'desc': 'Caper is a command-approval system for coding agents that checks what shell commands actually do, not just how they look in text. It runs each command in an isolated, snapshotted sandbox and gives an independent approver a limited report of the observed effects. If the command is allowed, Caper commits its changes; if blocked, it rolls them back and explains why. In evaluations, Caper had lower harmful-outcome rates than six existing systems, including when harmful behavior was hidden inside tools the commands invoked.'}, 'zh': {'title': '先在沙盒看清后果，再决定是否放行', 'desc': '这篇论文提出 Caper，一种用于审核智能体所提 shell 命令的机制。它会先在隔离的沙盒中运行命令，并观察命令对文件等工作区状态造成的影响，再把有限的结果报告交给独立审核器判断。获准的命令会被提交，遭到拦截的命令则会回滚，并附上智能体可据以调整的原因。实验显示，Caper 在两个基准上的有害结果率低于六种现有系统，同时很少误拦安全任务。'}}}, {'id': 'https://huggingface.co/papers/2610.40747', 'title': 'Mage-VL-Cowork: A Full Training Recipe to Learn Hybrid Computer Use From Evolved Harnesses', 'url': 'https://huggingface.co/papers/2610.40747', 'abstract': 'Abstract Mage-VL-Cowork is a 4B hybrid computer-use agent trained via a progressive curriculum and scalable synthetic data generation, achieving state-of-the-art performance on OSWorld-Verified with efficient reasoning.  Generated by thinkingmachines/Inkling-Small Effective computer-use agents (CUAs) should seamlessly combine visual GUI interaction with code and terminal execution within a single policy. We present Mage-VL-Cowork, a 4B hybrid CUA trained from a general multimodally aligned checkpoint through an end-to-end, progressive five-stage curriculum across midtraining, SFT, and RL. To power this curriculum at scale, Mage-CUA-Forge replaces per-task agent construction with reusable, skill-conditioned generation workflows and application-specific preparers, synthesizing 293,806 desktop and web tasks across 6,915 skills while reducing recurring per-task expenditure by 82.6%. Rather than directly distilling a default teacher, we evolve the teacher harness and instantiate specialized CUA harnesses to yield high-quality trajectories alongside stage-specific supervision. Mage-VL-Cowork-4B finally climbs to 66.0% on OSWorld-Verified through different training stages with more efficient reasoning cost, achieving state-of-the-art performance at its parameter size and pushing forward the frontier of on-device intelligence.', 'score': 11, 'issue_id': 3496, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'e91ad6efb3af9c87', 'authors': ['Xiaoyi Zhang', 'Haoqing Wang', 'Xinjie Zhang', 'Xiang Ming', 'Xing Wang', 'Senqiao Yang', 'Kaichen Zhang', 'Zhaoyang Jia', 'Andong Tan', 'Xinjiang Wang', 'Jinghao Guo', 'Yifei Shen', 'Xiao Li', 'Peng Zhang', 'Xun Guo', 'Jiahao Li', 'Shicheng Zheng', 'Jinglu Wang', 'Zongyu Guo', 'Wenxuan Xie', 'Bin Li', 'Yan Lu'], 'affiliations': ['Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2610.40747.jpg', 'data': {'categories': ['#data', '#synthetic', '#small_models', '#rl', '#optimization', '#dataset', '#multimodal', '#agents', '#training', '#benchmark'], 'emoji': '🖥️', 'ru': {'title': 'Компактный агент, который работает с компьютером как человек, и без лишних затрат', 'desc': 'Статья представляет Mage-VL-Cowork, компактного гибридного computer-use agent (CUA) с 4 млрд параметров, который объединяет визуальное взаимодействие с GUI и выполнение кода и терминальных команд в одной политике. Модель обучается через прогрессивный пятиэтапный curriculum (midtraining, SFT и RL) на синтетических данных, которые генерирует фреймворк Mage-CUA-Forge на основе переиспользуемых skill-conditioned workflow. Авторы эволюционируют teacher harness и создают специализированные harness для получения качественных траекторий вместо прямой дистилляции одного учителя. Итог: 66.0% на OSWorld-Verified при меньших затратах на reasoning и state-of-the-art результат для своего размера.'}, 'en': {'title': 'A Small Agent, Trained to Master the Desktop', 'desc': 'Mage-VL-Cowork is a 4B-parameter agent that uses visual interaction, code, and terminal commands to operate computers. It is trained through a five-stage curriculum combining midtraining, supervised fine-tuning (SFT), and reinforcement learning (RL). Its data-generation system creates nearly 294,000 tasks across 6,915 skills, while reducing repeated task-generation costs by 82.6%. The model reaches 66.0% on OSWorld-Verified, achieving state-of-the-art performance for its size with efficient reasoning.'}, 'zh': {'title': '小模型也能高效操作电脑：渐进训练与规模化合成数据带来新突破', 'desc': 'Mage-VL-Cowork 是一个拥有 40 亿参数的电脑操作智能体，能在同一套策略中结合屏幕视觉、图形界面操作、代码和终端执行。研究团队采用由易到难的五阶段训练课程，并设计可重复使用的数据生成流程，合成了覆盖 6,915 项技能的近 30 万个桌面与网页任务，同时降低了数据制作成本。团队还逐步改进教师智能体和任务执行框架，以生成高质量训练轨迹和适合各阶段的监督信号。该模型在 OSWorld-Verified 上取得 66.0% 的成绩，在同等参数规模中达到领先表现，并以较低推理成本推动端侧智能发展。'}}}, {'id': 'https://huggingface.co/papers/2611.04035', 'title': 'Recursa: Toward Recursively Self-Improving Foundation Model Systems', 'url': 'https://huggingface.co/papers/2611.04035', 'abstract': "Abstract Recursa is a self-improving foundation model system that adapts to new domains by recursively learning from its own experience, storing skills and reflections in a knowledge repository, and validating improvements without human supervision or stronger teachers.  Generated by thinkingmachines/Inkling-Small Foundation models in changing environments can encounter unfamiliar domain knowledge that their original training did not cover. However, new domains rarely provide large amounts of expert-created training data or reliable supervisory signals for further training. We introduce Recursa, a foundation model system that adapts to new domains by learning from its own experience without human experts or a stronger teacher model. Recursa uses a knowledge repository to store what it learns: domain-specific skills and instructions on when to apply them, along with memories of past task experiences and reflections on what to improve. Recursa bootstraps the repository from domain materials and then refines it through recursive self-improvement. It uses parallel learners to execute tasks and synthesize local improvements, then validates and merges the improvements into the knowledge repository. On Harvey LAB's Firm Knowledge benchmark, Recursa raises the all-pass rate on held-out test tasks from 30.0% to 55.0% with DeepSeek-V4.1-Flash and from 35.0% to 46.0% with Qwen3.8-Flash.", 'score': 10, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'ad466bb6a929f87a', 'authors': ['Erkang Zhu', 'Yin Lin', 'Xiaorong Shi', 'Xuanrui Lin', 'Jingren Zhou'], 'affiliations': ['Recursa Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.04035.jpg', 'data': {'categories': ['#data', '#reasoning', '#optimization', '#agents', '#training', '#benchmark'], 'emoji': '🔁', 'ru': {'title': 'Модель, которая учится на собственном опыте, без учителя и людей', 'desc': 'Статья представляет Recursa — систему на основе foundation model, которая адаптируется к новым предметным областям без участия человека-эксперта и более сильной модели-учителя. Модель хранит полученные навыки, инструкции и рефлексии в репозитории знаний и рекурсивно улучшает его через параллельных learners, которые выполняют задачи и предлагают локальные улучшения. Улучшения проверяются и объединяются в репозиторий, что позволяет самосовершенствоваться на основе собственного опыта. На бенчмарке Harvey LAB Firm Knowledge доля полностью успешных held-out задач выросла с 30% до 55% для DeepSeek-V4.1-Flash и с 35% до 46% для Qwen3.8-Flash.'}, 'en': {'title': 'Learn from experience, improve without a teacher', 'desc': 'Recursa helps foundation models adapt to unfamiliar domains without human experts or a stronger teacher model. It stores domain skills, guidance on when to use them, and reflections on past tasks in a knowledge repository. Parallel learners propose improvements through experience, which the system validates before adding them to the repository. On a firm-knowledge benchmark, Recursa improved the models’ all-pass rates on held-out tasks.'}, 'zh': {'title': '让模型从经验中学习，在新领域持续进步', 'desc': 'Recursa 是一种能在新领域中持续自我改进的基础模型系统，不需要人工专家或更强的教师模型。它把领域技能、使用说明、任务经历和改进反思存入知识库，并先利用领域材料建立知识库。系统让多个学习器并行完成任务、总结改进，再验证这些改进并合并到知识库中。实验显示，在 Harvey LAB 的 Firm Knowledge 基准上，Recursa 提高了测试任务的全通过率。'}}}, {'id': 'https://huggingface.co/papers/2611.04303', 'title': 'FlowTranslator: Training-Free In-Image Machine Translation with Flow-Based Editing', 'url': 'https://huggingface.co/papers/2611.04303', 'abstract': 'Abstract FlowTranslator is a training-free framework for in-image machine translation that uses diffusion trajectory controls to generate accurate translated text within images without paired training data.  Generated by thinkingmachines/Inkling-Small In-image machine translation (IIMT) replaces text in an image with its translation while preserving the surrounding visual context. Existing task-specific models achieve convincing performance but require massive paired training images before and after translation. As advanced text-to-image (T2I) models have reached a practically usable level of multilingual text generation, we argue that this capability can be transferred to IIMT and present FlowTranslator. It is a training-free IIMT framework that first employs an OCR model and an LLM to generate the translation prompt, which is injected into the T2I-based diffusion model. To optimize the accurate and natural generation of translated text, we introduce two trajectory controls: Region Coupling Release (RCR) partially decorrelates target-branch noise inside the text region early in the trajectory, while Coupling Expansion (CE) amplifies the emerging edit displacement mid-trajectory. Under the EasyOCR read-back protocol, FlowTranslator achieves average PRIM BLEU and COMET scores of 20.6 and 57.2, respectively, substantially outperforming the strong training-based baseline UniTranslator. On the more challenging and realistic whole-image ScenePair photographs translated into Chinese, it reaches 40.1\\% exact-match accuracy and surpasses existing editing systems, some of which only address the text-rendering stage rather than the complete IIMT task. These results establish flow-based editing as a strong, fully training-free baseline for IIMT.', 'score': 9, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'a959af4dc35e5d7c', 'authors': ['Zhixian Li', 'Xingsong Ye', 'Yongkun Du', 'Yunyan Xiao', 'Yanglin Huang', 'Pinxuan Chen', 'Jiyu Zhuang', 'Cong Xu', 'Zhineng Chen'], 'affiliations': ['Fudan University', 'Shanghai Key Laboratory of Multimodal Embodied AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.04303.jpg', 'data': {'categories': ['#diffusion', '#multimodal', '#cv', '#multilingual', '#benchmark', '#machine_translation', '#inference'], 'emoji': '🖼️', 'ru': {'title': 'Перевод текста на картинке без обучения: диффузия сама переписывает надписи', 'desc': 'В статье представлен FlowTranslator — фреймворк для машинного перевода текста внутри изображений (IIMT), который не требует обучения. Сначала OCR-модель и LLM извлекают текст и формируют промпт для перевода, который подаётся в диффузионную модель text-to-image. Для точной и естественной генерации переведённого текста вводятся два контроля траектории: Region Coupling Release (RCR) и Coupling Expansion (CE). Результаты показывают, что подход превосходит обученный baseline UniTranslator и существующие системы редактирования, устанавливая flow-based редактирование как сильную базовую линию без обучения.'}, 'en': {'title': 'Translate Image Text Without Paired Training Data', 'desc': 'FlowTranslator translates text inside images while preserving the surrounding visuals, without training on paired before-and-after images. It uses OCR to read the original text and an LLM to create a translation prompt for a text-to-image diffusion model. Two trajectory controls guide the diffusion process: Region Coupling Release changes noise within the text region early, and Coupling Expansion strengthens the edit later. The method outperforms strong existing systems on reported translation and image-editing benchmarks, establishing flow-based editing as a promising training-free approach to in-image machine translation.'}, 'zh': {'title': '无需训练，让扩散模型准确翻译图片文字', 'desc': '本文提出 FlowTranslator，一种无需训练的图像内机器翻译框架，可将图片中的文字替换为译文，同时保留周围的视觉内容。它先用 OCR 识别原文，再由大语言模型生成翻译提示，并将提示输入基于扩散模型的文生图模型。为提升译文的准确度与自然度，方法设计了两种扩散轨迹控制：区域耦合释放会在生成早期调整文字区域内目标分支的噪声，耦合扩张则会在中期增强编辑变化。实验表明，FlowTranslator 在多项评测中优于强训练型基线，说明基于流的图像编辑可以成为图像内机器翻译的有效免训练方案。'}}}, {'id': 'https://huggingface.co/papers/2611.04870', 'title': 'PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations', 'url': 'https://huggingface.co/papers/2611.04870', 'abstract': 'Abstract PrimeSim is an action-conditioned multiview world model that uses progressive training, unified action representations, view-aware attention, and hierarchical memory to enable consistent, long-horizon robot simulation and policy optimization.  Generated by thinkingmachines/Inkling-Small A robot world model that serves as a simulator must do more than generate plausible videos: it must faithfully follow commanded actions, maintain consistency across camera views, and sustain coherent long-horizon rollouts. We present PrimeSim, an action-conditioned, multiview world model simulator that addresses these challenges through progressive midtraining and posttraining. Starting from a pretrained video generator, we midtrain on 30,110 hours of robot demonstrations spanning 22 platforms. To improve action following, we introduce a unified cross-embodiment action representation and frame-aligned dual-path conditioning to strengthen action-frame correspondence. To maintain multiview consistency, we develop view-aware interleaved attention with explicit camera identities, enabling cross-view information exchange while preserving view-specific representations. We further introduce a fast-video, slow-memory posttraining framework that transforms the bidirectional video generator into an efficient autoregressive simulator. By combining fast causal generation, self-rollout training, and hierarchical temporal memory, PrimeSim mitigates error accumulation from self-generated histories and supports coherent long-horizon simulation. PrimeSim runs at 10.1 FPS, remains stable over long-horizon rollouts on rigid and deformable manipulation tasks, and transfers to held-out platforms within 100 to 200 gradient steps where the pretrained backbone does not. Against five open-source action-conditioned world models it leads four of the five WorldSimProbe suites and posts the best overall EWMBench score, while fine-grained local calibration still trails the field; its rollouts are faithful enough to support GRPO-based policy optimization. We release the model weights, inference code, and training code.', 'score': 9, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'b75586385aae33d8', 'authors': ['Travis Davies', 'Wentao Ma', 'Lihao Guo', 'Tengfei Ma', 'Xiaowen Chang', 'Jiafeng Xu', 'Shilong Wang', 'Yiqi Deng', 'Shaowen He', 'Xiaoqi Li', 'Qian Zhu', 'Ran Cheng', 'Hao Dong'], 'affiliations': ['Beihang University', 'Peking University', 'PrimeBot Research', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Southeast University', 'The Chinese University of Hong Kong', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2611.04870.jpg', 'data': {'categories': ['#synthetic', '#cv', '#architecture', '#rl', '#optimization', '#video', '#training', '#benchmark', '#long_context', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Робот учится в симуляции, которой можно доверять', 'desc': 'В статье представлена PrimeSim — мультивью world model-симулятор роботов, управляемый действиями (action-conditioned), который обучается на 30 110 часах демонстраций с 22 платформ. Для точного следования командам используются унифицированное кроссэмбодимент-представление действий и dual-path условие, а для согласованности между камерами — view-aware interleaved attention с явными идентификаторами камер. Посттренировка по схеме fast-video, slow-memory превращает двунаправленный генератор в эффективный autoregressive-симулятор, который работает со скоростью 10.1 FPS и сохраняет стабильность на длинных горизонтах благодаря иерархической временной памяти. Модель обходит пять открытых аналогов по большинству тестов и поддерживает GRPO-оптимизацию политик.'}, 'en': {'title': 'A Robot Simulator That Follows Actions and Stays Consistent', 'desc': 'PrimeSim is an action-conditioned world model that simulates robot behavior consistently across camera views and over long time periods. It improves action following with a shared representation for different robot platforms and frame-aligned action conditioning, while view-aware attention helps keep camera views consistent. Its fast-video, slow-memory training combines autoregressive generation, self-rollout training, and hierarchical temporal memory to reduce errors that build up during long simulations. PrimeSim performs well on several benchmarks, transfers to new platforms with limited training, and produces rollouts useful for GRPO-based policy optimization, though fine-grained local calibration remains a weakness.'}, 'zh': {'title': '让机器人世界模型听从动作指令，稳定推演更长未来', 'desc': 'PrimeSim 是一种受动作条件控制的多视角世界模型，旨在生成能忠实执行机器人指令、保持不同摄像机视角一致，并支持长时间推演的模拟。它通过渐进式训练学习机器人演示数据，并采用统一的跨机器人动作表示和帧对齐的双路径条件机制，加强动作与视频帧之间的对应关系。为提升多视角一致性和长时稳定性，模型结合视角感知注意力、快速视频生成、层级时间记忆及自我推演训练，减少误差累积。实验显示，PrimeSim 在多项基准测试中表现突出，也能用于基于 GRPO 的策略优化，但细粒度的局部校准仍有改进空间。'}}}, {'id': 'https://huggingface.co/papers/2610.40574', 'title': 'Every Token Needs Its Own Teacher: Multi-teacher Adaptive On-policy Self-distillation', 'url': 'https://huggingface.co/papers/2610.40574', 'abstract': 'Abstract Multi-teacher Adaptive On-policy Self-Distillation selects a preferred teacher for each token during training, improving mathematical reasoning performance over fixed-teacher methods.  Generated by thinkingmachines/Inkling-Small On-policy Self-distillation (OPSD) has proven effective for post-training large language models by constructing a teacher conditioned on privileged references. However, existing approaches keep the teacher fixed either throughout training by consistently exposing it to the full reference, or within each response by adaptively varying partial reference exposure only across responses. In this paper, we argue that neither of them is sufficient. Instead, every token needs its own teacher, as the teacher preference can vary token by token within the same response. Through a teacher-intervention pilot study, we validate that the teacher preference differs across tokens, and reveal that a preferred teacher can be identified for each token through majority voting and KL-based selection. Motivated by these findings, we propose Multi-teacher Adaptive On-policy Self-Distillation (MTA-OPSD), the first token-level adaptive OPSD method. Our method constructs a multi-teacher pool consisting of candidate teachers, and enables every token to adaptively select its preferred teacher during training. Experiments with Qwen3 models on mathematical reasoning tasks show that MTA-OPSD consistently outperforms existing OPSD approaches with an average gain of up to +5.9 over the base model, highlighting the importance of adapting teacher supervision at the token level. The code is available at https://github.com/xingzhejun/MTA-OPSD.', 'score': 8, 'issue_id': 3497, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'fca2631f89b5066c', 'authors': ['Yifu Luo', 'Chuang Ma', 'Zeyu Chen', 'Enkelejda Kasneci', 'Qi Chen', 'Gjergji Kasneci'], 'affiliations': ['Aalto University', 'ELLIS Institute Finland', 'Kyoto University', 'Munich Center for Machine Learning (MCML)', 'NII LLMC', 'TU Munchen', 'relAI Konrad Zuse School of Excellence in Reliable AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.40574.jpg', 'data': {'categories': ['#optimization', '#math', '#reasoning', '#training'], 'emoji': '🎯', 'ru': {'title': 'Свой учитель для каждого токена: точнее дистилляция в LLM', 'desc': 'Статья предлагает метод Multi-teacher Adaptive On-policy Self-Distillation (MTA-OPSD) для дообучения LLM на задачах математического рассуждения. В отличие от существующих подходов с фиксированным учителем, здесь каждый токен получает собственного учителя, которого выбирают через majority voting и KL-based selection из пула кандидатов. Авторы показывают, что предпочтения учителя действительно различаются от токена к токену, даже внутри одного ответа. Эксперименты с моделями Qwen3 demonstrate прирост качества до +5.9 по сравнению с базовой моделью и превосходство над другими OPSD-методами.'}, 'en': {'title': 'Choose the Right Teacher for Every Token', 'desc': 'On-policy self-distillation trains a language model using guidance from a teacher conditioned on reference answers. Earlier methods use one fixed teacher, but this paper finds that different tokens in a response can benefit from different teachers. MTA-OPSD creates a pool of teachers and lets each token choose its preferred teacher using methods such as majority voting or KL-based selection. Tests on mathematical reasoning tasks show that this token-level teacher selection improves performance over existing self-distillation methods.'}, 'zh': {'title': '让每个词元都选对老师', 'desc': '论文提出多教师自适应在线策略自蒸馏方法（MTA-OPSD），用于提升大语言模型的数学推理能力。不同于为整段回答固定教师的方法，它让每个词元都能从多个候选教师中选择更合适的教师。研究发现，同一回答中不同词元的教师偏好可能不同，并可通过多数投票或基于 KL 散度的选择来识别。实验显示，MTA-OPSD 在数学推理任务上优于现有在线策略自蒸馏方法，相比基础模型最高平均提升 5.9 分。'}}}, {'id': 'https://huggingface.co/papers/2611.04449', 'title': 'Near-Zero Token Embeddings Silently Stall Training in Gated Sequence Models', 'url': 'https://huggingface.co/papers/2611.04449', 'abstract': "Abstract Near-zero input embeddings in untied gated language models cause extreme gradient amplification and training instability, which is addressed by GroupClip and GateFloor remedies.  Generated by thinkingmachines/Inkling-Small Among 291 surveyed open-weight language model repositories (280 distinct embedding tables), 52.6% of untied gated and hybrid checkpoints (20/38) contain reachable input embeddings with norms below 10^{-6}, compared with 0% of weight-tied models. Such near-zero rows can arise during pretraining when unseen rare or template tokens receive zero input gradients while AdamW weight decay shrinks untied embeddings. In tested Transformer configurations, non-initial positions or a BOS token prevent this failure mode. In gated sequence models (Mamba, Gated DeltaNet, xLSTM), a near-zero token can amplify input-embedding gradients by more than 30 orders of magnitude (up to 35). At zero input, current-token readout factors (SiLU gates or linear queries) vanish, suppressing historical-state readout. Residual RMS values can then fall below the square root of the RMSNorm floor across consecutive layers, causing Pre-RMSNorm to amplify backward gradients by up to 10^3 per layer. When a gradient entry exceeds 1.84 times 10^{19}, FP32 global-norm clipping in PyTorch, Hugging Face Trainer, and FSDP2 can overflow to infinity and zero the current batch's gradients. In Telugu continual pretraining of Nemotron-3-Nano-4B, this discards updates on approximately 20% of steps and leaves triggered rows frozen. We propose two remedies. For released checkpoints, GroupClip decouples input-embedding clipping using a 64-bit or rescaled norm; its rescaled implementation eliminates update loss and heals triggered rows in one step with negligible measured end-to-end overhead. For pretraining, GateFloor (SiLU(z) + δ, δin [0.01, 0.1]) keeps the gate positive at zero input, reducing near-zero gradients by 28 orders of magnitude in experiments up to 370M parameters, with perplexity comparable to the baseline.", 'score': 7, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'd858a3ba56d45a46', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#architecture', '#low_resource', '#small_models', '#optimization', '#training'], 'emoji': '🧊', 'ru': {'title': 'Почти нулевой эмбеддинг взрывает градиенты, а GateFloor не даёт ему замёрзнуть', 'desc': 'Авторы показывают, что в языковых моделях с untied и gated архитектурами (Mamba, Gated DeltaNet, xLSTM) эмбеддинги отдельных токенов могут схлопываться почти в ноль, из-за чего градиенты взрываются и обрезка градиентов (gradient clipping) обнуляет обновления весов. Причиной служит комбинация отсутствия обучения редких токенов и AdamW weight decay, а также обнуление gate-факторов при нулевом входе. Для уже обученных моделей предлагается GroupClip, раздельная обрезка градиентов эмбеддингов с 64-битной или масштабированной нормой, а для предобучения GateFloor, добавляющий δ к SiLU, что сохраняет градиенты ненулевыми. Эксперименты до 370M параметров показывают снижение почти нулевых градиентов без ухудшения перплексии.'}, 'en': {'title': 'Stop Tiny Embeddings from Derailing Gated Model Training', 'desc': 'The paper finds that untied gated language models can develop near-zero input embeddings, especially for rare or template tokens that receive no input gradients while weight decay shrinks their embeddings. In gated models, these embeddings can suppress readout of historical states and trigger large gradient amplification through Pre-RMSNorm, sometimes causing FP32 gradient clipping to overflow and discard training updates. GroupClip prevents this for released checkpoints by clipping embedding gradients with a numerically safe norm, while GateFloor keeps gate values positive near zero during pretraining. Experiments show both remedies reduce the failure, with GroupClip restoring updates and GateFloor greatly reducing gradient spikes while maintaining comparable perplexity.'}, 'zh': {'title': '稳住门控梯度：从嵌入裁剪到门控加底', 'desc': '本文发现，在不共享输入与输出权重的门控语言模型中，接近零的输入嵌入可能导致梯度放大和训练不稳定。稀有或模板词元若在预训练中没有输入梯度，其嵌入可能被 AdamW 的权重衰减压到接近零；此时门控序列模型中的历史状态读取会受到抑制，RMSNorm 还可能进一步放大反向梯度。梯度过大时，FP32 全局范数裁剪可能溢出并把当前批次的梯度清零，导致更新丢失。作者提出 GroupClip 以更稳健地裁剪已发布模型的输入嵌入梯度，并提出 GateFloor 为门控函数添加正偏移，以减少预训练中的梯度爆炸；实验显示这两种方法能缓解问题，且对性能影响很小。'}}}, {'id': 'https://huggingface.co/papers/2611.05345', 'title': 'Adversarial Speculative Reasoning Improves Long Horizon Agents', 'url': 'https://huggingface.co/papers/2611.05345', 'abstract': 'Abstract Speculative decoding can be trained to reject critical reasoning tokens so they are verified by the target model, reducing numerical noise and improving long-horizon agent accuracy without altering the target model.  Generated by thinkingmachines/Inkling-Small Speculative decoding has been treated purely as a systems optimization that speeds up large language model decoding without changing the model behavior. Under this view, the growing effort to train better draft models has been focused solely on acceptance rate. We argue that this view does not hold true for long-horizon agent reasoning. Measuring frontier open-weight models on complex agentic tasks with different speculative decoding approaches, we found that numerical noise grows within verification windows, and the draft acceptance results of the thinking process can change the output distribution of the model after 30 steps, thus noticeably influencing the reasoning accuracy of long-horizon agents in random directions. In this work, we improve the reasoning capability of target models by controlling such noise. While we cannot change the overall token distribution verified by the target model, we can encode critical reasoning with highest precision by training the draft model to be rejected. We identify these points in agent traces and train the draft model to favor adversarial preference. At inference the trained draft and the target part ways precisely at these decision points, verification restarts, so that critical thinking tokens are sampled from the target model and encoded under its least noisy conditions. This approach makes critical reasoning better indexed and more durable over a long horizon. On complex agentic coding benchmarks, our approach raises end-to-end success rate with no change to the target model or its output distribution. Our results recast the speculative decoding mechanism from a pure accelerator into an active allocator for context precision that improves the accuracy of long-horizon agents by training 0.06% to 0.28% of hosted parameters.', 'score': 6, 'issue_id': 3498, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '686c386a4250c04d', 'authors': ['Hongyin Luo', 'Wei Fang', 'Lijie Yang', 'Owen Stepan', 'Daniel Suit', 'Jeff Krapf', 'Dana Wensberg', "Jack O'Brien"], 'affiliations': ['Massachusetts Institute of Technology', 'Northeastern University', 'Princeton University', 'Subconscious Systems Technologies, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.05345.jpg', 'data': {'categories': ['#reasoning', '#training', '#optimization', '#plp', '#inference', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Speculative decoding как инструмент точности, а не только ускорения', 'desc': 'Статья показывает, что speculative decoding нельзя рассматривать только как ускорение инференса: на длинных агентных задачах числовой шум внутри окон верификации и принятие токенов черновой (draft) моделью влияют на распределение выходов целевой модели и точность рассуждений. Авторы предлагают обучать draft-модель отвергать критически важные токены рассуждений, чтобы их генерировала целевая LLM в наименее шумных условиях. Метод не меняет распределение целевой модели и обучает лишь 0.06–0.28% её параметров. Это повышает долю успешно решённых задач в сложных агентных benchmark по кодингу.'}, 'en': {'title': 'Spend Precision Where Reasoning Matters Most', 'desc': 'The paper shows that speculative decoding can introduce numerical noise that changes an agent’s reasoning over long sequences. It trains the draft model to reject tokens at important reasoning decisions, so the target model generates those tokens under more precise conditions. This improves success on complex agentic coding tasks without changing the target model or its output distribution. The method uses a small fraction of hosted model parameters to allocate more precision to critical reasoning steps.'}, 'zh': {'title': '让关键推理由目标模型精准把关', 'desc': '本文研究推测解码如何影响长程智能体推理的准确性。作者发现，草稿模型与目标模型在验证窗口中的数值噪声会累积，使推理过程逐步偏离，并影响最终结果。为此，他们训练草稿模型在关键推理位置主动给出会被拒绝的草稿，让目标模型重新开始验证，并以较低噪声生成关键 token。该方法无需改变目标模型或其输出分布，只训练少量参数，就能提升复杂智能体编程任务的端到端成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.05306', 'title': "You don't need long context", 'url': 'https://huggingface.co/papers/2611.05306', 'abstract': 'Abstract Frequent context compaction preserves task accuracy across long-horizon and long-input tasks, suggesting that long-context language models may be unnecessary and motivating semantic state space models.  Generated by thinkingmachines/Inkling-Small Later tokens are costlier to generate than earlier tokens. On frontier open weight models, the disparity in cost may rise to as much as 7x. Through frequent compaction, we show across a broad range of long-horizon and long-input tasks that frontier language models sacrifice little to no task accuracy when maintaining short contexts. We further demonstrate that LLM performance does not collapse on long-horizon software engineering tasks even when taking at most one action per context, and based on that we outline the concept of semantic state space models (SSSMs). Our findings question the need for long-context language models.', 'score': 6, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '6cea4b9ebef8f3c5', 'authors': ['Peter Belcak', 'Saurav Muralidharan', 'Jindong Jiang', 'Yonggan Fu', 'Wonmin Byeon', 'Hanrong Ye', 'Ryan Angilly', 'Ali Taghibakhshi', 'Shih-Yang Liu', 'Siru Ouyang', 'Greg Heinrich', 'Pavlo Molchanov'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.05306.jpg', 'data': {'categories': ['#architecture', '#inference', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Короткий контекст с частым сжатием может заменить длинный', 'desc': 'Авторы показывают, что частое сжатие контекста (context compaction) позволяет большим языковым моделям (LLM) сохранять точность на длинных задачах и задачах с длинным входом, почти не теряя в качестве. Поскольку поздние токены генерируются дороже ранних, на современных открытых моделях разница в стоимости может достигать семикратной. Даже в задачах долгосрочной разработки ПО, где модель делает не более одного действия в каждом контексте, производительность не падает. На основе этих результатов вводится концепция семантических моделей пространства состояний (SSSM), а также ставится под вопрос необходимость моделей с длинным контекстом.'}, 'en': {'title': 'Keep the context short; keep the task on track', 'desc': 'The paper finds that language models can frequently summarize or compact their context and still perform well on long-input and long-horizon tasks. This matters because generating later tokens can cost much more than generating earlier ones, so keeping contexts short may reduce computation. Even on long software engineering tasks, models retain their performance when taking only one action before compacting their context. These results question the need for long-context models and motivate semantic state space models (SSSMs), which track tasks through compact semantic states.'}, 'zh': {'title': '频繁压缩上下文，短上下文也能胜任长任务', 'desc': '生成较靠后的 token 成本更高，在前沿开放权重模型中最多可达早期 token 的 7 倍。研究发现，通过频繁压缩上下文，语言模型在多种长时程和长输入任务中使用较短上下文时，准确率几乎没有下降。在长时程软件工程任务中，即使每段上下文只执行一个操作，模型表现也没有明显崩溃。基于这些结果，作者提出语义状态空间模型（SSSM）的概念，并质疑是否确实需要长上下文语言模型。'}}}, {'id': 'https://huggingface.co/papers/2611.02017', 'title': 'Switch-SWE: Do Coding Agents Hold Focus When Switching Between Unfinished Tasks?', 'url': 'https://huggingface.co/papers/2611.02017', 'abstract': "Abstract A benchmark for resuming interrupted software tasks reveals performance drops from interleaved work, and a context-management module improves recovery.  Generated by thinkingmachines/Inkling-Small Software development sessions often involve several unfinished tasks rather than one issue carried through to completion. As coding agents take on repository-level development, they need to recover an earlier task's requirements and partial progress after intervening work. Existing repository-level benchmarks typically score one issue-to-patch episode and do not directly measure whether an agent can resume a task after advancing other unfinished work in the same repository. We introduce \\ourmethod, a benchmark for focus-task resumption in sessions that interleave unfinished tasks drawn from the same source repository, with a persistent checkout for each task. Each focus task is evaluated in matched uninterrupted and switched sessions with identical focus requirements and executable verifiers. The switched session interleaves ordered stages from other unfinished tasks in the same repository, while only the final focus patch is scored. \\ourmethod~contains 200 focus tasks from 19 Python repositories, reconstructed from issue, pull-request, and review histories and rendered as 400 matched session specifications. Across 7 coding agents, interleaved unfinished work produces an average focus-task resolution gap of 11.5 percentage points, ranging from 6.0 to 15.0 percentage points. Trajectory analysis identifies cross-task requirement confusion and loss of task state as recurrent resumption behaviors. We introduce a plug-in context-management module that selects task-relevant history and maintains concise task-state summaries. On OpenCode, the module improves focus-task completion under same-repository task switching by 5.5 to 15.5 percentage points across the evaluated models. Code is available at github.com/Miraclecsc/Switch-SWE.", 'score': 6, 'issue_id': 3497, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'b0e0247a875470b9', 'authors': ['Shuochen Chang', 'Qianli Ma', 'Yibo Miao', 'Qingyang Liu', 'Bingjie Gao', 'Haonan Zhao', 'Siyu Sun', 'Yulin Sun', 'Han Zhao', 'Jiangtong Li'], 'affiliations': ['Shanghai Jiao Tong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02017.jpg', 'data': {'categories': ['#data', '#agents', '#plp', '#benchmark'], 'emoji': '🔀', 'ru': {'title': 'Не потерять нить: возвращение к задаче после переключения контекста', 'desc': 'Авторы представляют новый бенчмарк для проверки того, способны ли LLM-агенты для разработки ПО возобновлять прерванную задачу после работы над другими незавершёнными задачами в том же репозитории. Оценка проводится на 200 задачах из 19 Python-репозиториев, построенных на основе issue и pull-request, в парных сессиях без переключений и с переключениями. Во всех 7 протестированных агентах переключение задач снижает долю решённых задач в среднем на 11,5 п.п., что выявляет смешение требований между задачами и потерю состояния задачи. Предложенный модуль управления контекстом, который выбирает релевантную историю и поддерживает краткие саммари состояния задач, повышает качество на 5,5–15,5 п.п.'}, 'en': {'title': 'Keep the task in focus, even when work switches', 'desc': 'The paper introduces a benchmark that tests whether coding agents can resume an unfinished software task after working on other tasks in the same repository. It compares matched sessions with and without task switching, scoring only the final patch for the focus task. Across seven agents, interleaved work reduces task resolution by an average of 11.5 percentage points, often because agents confuse requirements or lose track of task state. A context-management module that selects relevant history and summarizes task state improves completion by 5.5 to 15.5 percentage points across evaluated models.'}, 'zh': {'title': '管好上下文，让编程智能体切换任务后也能接续完成', 'desc': '这篇论文提出一个基准，用于评估编程智能体在处理同一代码库中的其他未完成任务后，能否恢复并完成原先的任务。基准将任务分为不中断和穿插切换两种匹配情境，并通过可执行验证器评估最终补丁。对7种编程智能体的测试发现，穿插任务会使原任务的完成率平均下降11.5个百分点，常见问题包括混淆不同任务的需求和遗失任务状态。作者还提出一个上下文管理模块，通过筛选相关历史并维护简洁的任务状态摘要，在多种模型上将任务切换后的完成率提升5.5至15.5个百分点。'}}}, {'id': 'https://huggingface.co/papers/2611.02244', 'title': 'Can AI Reviewers See Your Efforts to Improve Your Paper? A Large-Scale Study of Paper Revision Trajectories', 'url': 'https://huggingface.co/papers/2611.02244', 'abstract': 'Abstract AI reviewers often fail to reflect manuscript improvements in scores, with user opinions frequently overriding observed revision gains.  Generated by thinkingmachines/Inkling-Small AI reviewers are increasingly used to assess scientific manuscripts, yet it remains unclear whether their judgments reflect the improvements authors make through revision. We investigate this question using PaperTrajectory-2026, the 2026 release of PaperTrajectory, a dataset of 6,959 paper trajectories across five AI conferences, with automatic annotations of changes along 14 dimensions and separate judgments of overall quality. The annotations show that major improvements emphasize empirical evidence and framing, while later revisions tend toward incremental improvement. Using independent assessments of manuscript versions from eight AI reviewers, we examine whether annotated major improvements receive higher scores, which revision dimensions are associated with score changes, and whether user opinions can outweigh observed revision gains. Every reviewer leaves scores unchanged on most major improvements, and agreement on the direction of score changes is weak. Revision dimensions show some reviewer-specific associations with score increases, but provide limited predictive discrimination and no consistent guide across reviewers. Even when a revision earns a higher neutral score, a brief negative user opinion can erase or reverse that advantage, with substantial variation across reviewers. These findings show that substantive revisions are not consistently reflected in review scores and that observed scoring gains can be vulnerable to user framing, motivating assessments that connect manuscript evidence to overall judgments and remain stable when no scientific evidence changes.', 'score': 6, 'issue_id': 3496, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'b78f7f898810117f', 'authors': ['Yaochen Wang', 'Chenguang Wang', 'Ming Li', 'Haomin Zhuang', 'Xinyue Zeng', 'Han Chen', 'Kwesi Adu Cobbina', 'Dang Nguyen', 'Dianqi Li', 'Dawei Zhou', 'Tianyi Zhou'], 'affiliations': ['MBZUAI', 'University of Maryland', 'University of Notre Dame', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2611.02244.jpg', 'data': {'categories': ['#alignment', '#science', '#dataset', '#agents', '#benchmark', '#ethics'], 'emoji': '🧠', 'ru': {'title': 'AI-рецензенты не всегда замечают реальные улучшения статей', 'desc': 'Авторы изучают, отражают ли AI-рецензенты (LLM-ревьюеры) реальные улучшения научных статей при их доработке. Для анализа используется датасет PaperTrajectory-2026 из 6 959 траекторий правок статей с конференций по AI, где изменения размечены по 14 измерениям. Оказалось, что большинство значимых улучшений не приводит к росту оценок, а направление изменения баллов согласуется между рецензентами слабо. Кроме того, краткий негативный отзыв пользователя может полностью сводить на нет преимущество улучшенной версии, что показывает уязвимость оценок к формулировкам.'}, 'en': {'title': 'Better revisions deserve evidence-based, stable scores', 'desc': 'This study examines whether AI reviewers give higher scores when scientific manuscripts improve. Using PaperTrajectory-2026, researchers analyzed 6,959 paper histories and independent evaluations from eight AI reviewers. Reviewers often did not change scores after major improvements, and revision features only weakly predicted score changes across reviewers. Negative user opinions could erase or reverse score gains, suggesting that reviews should better connect evidence in the manuscript to overall judgments and resist framing effects.'}, 'zh': {'title': '让评审评分跟上论文改进，不被主观意见左右', 'desc': '本文研究 AI 评审是否会在论文修改后，依据实际改进调整评分。研究使用涵盖五个 AI 会议、共 6,959 条论文修改轨迹的数据集，并分析 8 个 AI 评审对不同版本的独立评分。结果显示，评审通常不会因重大改进而改变分数，且修改内容与分数变化之间缺乏稳定、可预测的关系。即使中立评分有所提高，简短的负面用户意见也可能抵消甚至逆转这一优势，说明评审需要更紧密地将论文证据与总体判断关联起来，并避免受无关意见影响。'}}}, {'id': 'https://huggingface.co/papers/2611.03685', 'title': 'LOLPlay: Benchmarking Real-Time Visual Agents in League of Legends', 'url': 'https://huggingface.co/papers/2611.03685', 'abstract': 'Abstract LOLPlay evaluates visual agents on real-time League of Legends tasks, finding that increased reasoning effort does not improve success and can reduce interaction time.  Generated by thinkingmachines/Inkling-Small Visual agents need to coordinate reasoning and action while their environment evolves during inference. We introduce LOLPlay, a benchmark in native League of Legends with 36 champion-specific tasks spanning resource management, combat, cooperation, and objectives. Agents interact through screenshots and mouse--keyboard actions; automated initialization and 82 executable subgoal checks distinguish partial progress from completion. Across 324 task evaluations of three models at three reasoning-effort settings, GPT-6 Astra achieves the highest task success rate of 25.0\\% at low and medium effort, and the highest subgoal success rate of 40.3\\% at medium effort. However, high effort improves neither metric over low effort for any model. For Astra, longer requests leave fewer interaction rounds, suggesting a cost to additional reasoning in real-time control. Trajectories reveal incomplete subgoal composition and actions executing after the observed scene changes, motivating agents that combine visual reasoning with timely action.', 'score': 6, 'issue_id': 3496, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': '377646c7717d3b8a', 'pdf_title_img': 'assets/pdf/title_img/2611.03685.jpg', 'data': {'categories': ['#cv', '#games', '#reasoning', '#multimodal', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'В реальном времени побеждает не тот, кто думает дольше, а тот, кто вовремя действует', 'desc': 'Статья представляет LOLPlay — бенчмарк для оценки визуальных агентов в реальном времени на базе игры League of Legends. Агенты взаимодействуют с игрой через скриншоты и действия мышью и клавиатурой, а 36 задач, связанных с конкретными чемпионами, проверяются с помощью 82 исполняемых проверок промежуточных подцелей. Эксперименты с тремя моделями при трёх уровнях reasoning effort показали, что лучшая модель GPT-6 Astra достигает наибольшей успешности при низком и среднем уровне усилий, а высокий уровень не улучшает результат. Авторы объясняют это тем, что дополнительные рассуждения сокращают число раундов взаимодействия, поэтому важно сочетать визуальный анализ с быстрыми и своевременными действиями.'}, 'en': {'title': 'Think Fast, Act in Time', 'desc': 'The paper introduces LOLPlay, a benchmark for testing visual agents on real-time League of Legends tasks. Agents use screenshots and mouse-and-keyboard actions to complete 36 tasks covering resource management, combat, cooperation, and objectives. In tests of three models, higher reasoning effort did not improve task or subgoal success, and longer reasoning requests sometimes left less time for interaction. The results point to a need for agents that combine visual reasoning with timely actions and reliably complete sequences of subgoals.'}, 'zh': {'title': '实时游戏中，推理不如及时行动', 'desc': '本文提出 LOLPlay，这是一个基于《英雄联盟》的视觉智能体基准，包含 36 项英雄专属任务，涵盖资源管理、战斗、协作和目标争夺。智能体通过游戏截图观察环境，并用鼠标和键盘执行操作；基准还利用自动化初始化和 82 项可执行子目标检查，区分部分进展与任务完成。实验发现，增加推理力度并未提升任何模型的任务成功率，反而可能减少实时交互轮次；其中 GPT-6 Astra 在低、中推理力度下的任务成功率最高，为 25.0%，在中等力度下的子目标成功率最高，为 40.3%。结果表明，实时视觉控制需要更好地协调视觉推理与及时行动，并提升子目标组合能力，避免环境变化后仍执行过时操作。'}}}, {'id': 'https://huggingface.co/papers/2611.03998', 'title': 'Dory1.0-4B: A Looped Normalized-GPT', 'url': 'https://huggingface.co/papers/2611.03998', 'abstract': 'Abstract Dory1.0-4B is a 4-billion-parameter recurrent language model with elastic depth that improves accuracy and token efficiency by looping a shared block, outperforming larger models on multiple benchmarks.  Generated by thinkingmachines/Inkling-Small We introduce Dory1.0-4B, a 4-billion-parameter looped (latent-recurrent) language model with elastic depth: a single checkpoint serves different inference compute budgets. Dory1.0-4B is built on a normalized Transformer (nGPT) backbone with interleaved sliding-window and full-attention layers, organized into an input block, a shared recurrent block, and an output block. At inference, the recurrent block can be applied a variable number of times. We pre-trained Dory1.0-4B on 6 trillion tokens. The first 4.5 trillion tokens were trained in NVFP4, and additional pre-training then extended the context length to 256K tokens. Next, we post-trained the model using Supervised Fine-Tuning (SFT) and Reinforcement Learning with Verifiable Rewards (RLVR), with a difficulty-aware loop curriculum that routes harder prompts to deeper loops. Increasing the loop count improves accuracy, with the largest gains on coding, agentic, and long-context benchmarks. With two or more loops, Dory1.0-4B outperforms larger models such as Qwen3.5-9B, Gemma 4 12B, and Gemma 4 26B-A4B on average across 12 benchmarks. Looping also makes Dory1.0-4B more token-efficient on agentic benchmarks: with four loops, it generates 1.3-2.5x fewer tokens than with one loop, as the extra computation is spent in latent space rather than on longer outputs. To reduce memory during looping, Dory1.0-4B caches keys and values only from the last loop, keeping its KV-cache footprint equal to that of a non-looped model at any loop count while retaining most of the accuracy gains. We open-source the BF16, MXFP8, NVFP4, and GGUF quantized checkpoints.', 'score': 4, 'issue_id': 3498, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '2fa0a54279b1799e', 'authors': ['Maxim Fishman', 'Simeng Sun', 'Shantanu Acharya', 'Faisal Ladhak', 'Brian Chmiel', 'Santiago Akle Serano', 'Ron Banner', 'Boris Ginsburg', 'Krishna C. Puvvada'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.03998.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#long_context', '#small_models', '#open_source', '#inference', '#agents', '#architecture', '#rl'], 'emoji': '🔁', 'ru': {'title': 'Думать дольше, а не писать больше: рекуррентная LLM с эластичной глубиной', 'desc': 'Авторы представляют Dory1.0-4B — языковую LLM с 4 миллиардами параметров, которая использует рекуррентную архитектуру с эластичной глубиной: общий блок повторно применяется несколько раз на этапе inference. Модель построена на основе нормализованного Transformer (nGPT) с чередованием sliding-window и full-attention слоёв и была предобучена на 6 триллионах токенов, а затем дообучена через SFT и RLVR с учебным планом по сложности. Увеличение числа итераций цикла повышает точность, особенно в задачах программирования, агентных сценариях и работе с длинным контекстом, а при двух и более циклах модель превосходит более крупные аналоги. Кроме того, при хранении KV-кэша только от последнего цикла модель сохраняет эффективность по памяти и генерирует меньше токенов.'}, 'en': {'title': 'Think Deeper with Every Loop', 'desc': 'Dory1.0-4B is a 4-billion-parameter language model that repeatedly applies a shared Transformer block, allowing one model to use more or less inference compute by changing its loop count. It was pretrained on 6 trillion tokens and then tuned with supervised fine-tuning and reinforcement learning, including a curriculum that gives harder prompts more loops. More loops improve accuracy, especially on coding, agentic, and long-context tasks, and the model with at least two loops outperforms several larger models on average across 12 benchmarks. Looping can also reduce generated output tokens, while caching key-value states only from the final loop keeps memory use comparable to a model that does not loop.'}, 'zh': {'title': '反复计算，不必更大：用弹性循环提升模型能力与效率', 'desc': 'Dory1.0-4B 是一个拥有 40 亿参数的循环语言模型，通过反复运行同一个共享模块，让单一模型能按推理计算预算调整循环深度。模型基于 nGPT Transformer 架构，并经过 6 万亿 token 的预训练，以及监督微调和基于可验证奖励的强化学习。增加循环次数通常能提升准确率，尤其有利于编程、智能体和长上下文任务；循环两次或更多时，它在 12 项基准上的平均表现超过了一些更大的模型。循环还可减少智能体任务生成的 token 数量，而只缓存最后一轮的键和值，使 KV 缓存占用不随循环次数增加。'}}}, {'id': 'https://huggingface.co/papers/2611.05163', 'title': 'RoboTryOn: Synthesizing Dexterous Robot Demonstrations from Human Videos via Virtual Try-On', 'url': 'https://huggingface.co/papers/2611.05163', 'abstract': 'Abstract RoboTryOn translates human demonstration videos into robot videos to train control policies without real robot demonstrations, improving success rates and reducing data collection costs.  Generated by thinkingmachines/Inkling-Small Robot foundation models have shown remarkable performance in robot control, yet adapting them to a new task still relies heavily on teleoperated demonstrations. Egocentric human videos offer a scalable substitute, but overlaying rendered robots on human videos or retargeting human poses into robot actions leaves significant visual or action gaps for high-DoF robot embodiments. To address this limitation, we propose RoboTryOn, which treats human-to-robot translation as virtual try-on: try-on keeps the person and swaps the garment, RoboTryOn keeps the demonstrated motion and swaps the human for the robot. Specifically, RoboTryOn converts a human video into a video of the target robot specified by a reference image, while preserving the original task, objects, and background. To maintain visual consistency, we translate selected keyframes autoregressively and use them to guide video synthesis with motion conditioned on the human hand skeleton. Additionally, we use an inverse dynamics model (IDM) that incorporates depth features to infer action labels from synthesized videos for policy learning. Our experiments across multiple humanoid embodiments show that policies trained with our synthetic data improve the average success rate on novel tasks, including challenging bimanual manipulation, from 2% to 60%, without any real robot demonstration of those tasks. Moreover, training with our synthetic data matches the performance of policies trained solely on teleoperated demonstrations at approximately a third of the collection cost, demonstrating the cost efficiency of our approach.', 'score': 4, 'issue_id': 3497, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'e32b80bb319ae9b8', 'authors': ['Seungyong Lee', 'Suhyeok Jang', 'Minyoung Kim', 'Jinwoo Shin'], 'affiliations': ['KAIST', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2611.05163.jpg', 'data': {'categories': ['#video', '#training', '#synthetic', '#games', '#data', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Робот примеряет человеческие движения: учим политики без телеуправления', 'desc': 'Статья представляет RoboTryOn — метод, который переводит видео с демонстрацией задачи человеком в видео с роботом, чтобы обучать политики управления без реальных демонстраций от робота. Подход рассматривает перенос человека в робота как виртуальную примерку: сохраняется движение, объекты и фон, а человек заменяется на целевого робота, заданного референсным изображением. Ключевые кадры переводятся авторегрессивно и используются для генерации видео с учетом скелета кисти, а inverse dynamics model с признаками глубины восстанавливает action labels для обучения policy. Эксперименты на нескольких гуманоидных платформах показывают рост success rate на новых задачах, включая двуручные манипуляции, с 2% до 60%, при стоимости сбора данных примерно в три раза ниже, чем у teleoperation.'}, 'en': {'title': 'Try on a robot, not just a garment', 'desc': 'RoboTryOn turns human demonstration videos into videos showing a chosen robot performing the same task, while preserving the objects and background. It creates consistent video frames guided by the human hand motion, then uses an inverse dynamics model with depth features to infer robot actions. These videos provide synthetic training data for robot control policies without collecting real robot demonstrations for each task. Across several humanoid robots, this approach raises success on new tasks from 2% to 60% and can match teleoperation-trained policies at about one-third the data collection cost.'}, 'zh': {'title': '把人类示范“试穿”给机器人，以更低成本学会新任务', 'desc': 'RoboTryOn 将第一人称人类示范视频转换成指定机器人的视频，同时保留原有动作、任务、物体和背景。它通过逐步生成关键帧，并根据人手骨架引导视频合成，减少机器人外观和动作上的不一致。随后，系统使用结合深度特征的逆动力学模型，从合成视频中推断动作标签，以训练机器人控制策略。在多种人形机器人上的实验显示，该方法无需为新任务采集真实机器人示范，就能将平均成功率从 2% 提升到 60%，且数据采集成本约为遥操作示范的三分之一。'}}}, {'id': 'https://huggingface.co/papers/2610.00854', 'title': 'Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena', 'url': 'https://huggingface.co/papers/2610.00854', 'abstract': 'Abstract Frontier vision-language models vary widely in embodied task performance, with closed-weight systems leading in planning and manipulation while open-weight models lag, and failure patterns reveal distinct geometric, control, and reasoning errors rather than uniform deficits.  Generated by thinkingmachines/Inkling-Small A robot generalist must interpret a scene, act on it, and satisfy every condition of a task. How far do frontier vision-language models (VLMs) meet these demands? We introduce Embodied Agent Arena, evaluating ten VLM agents across Geometry, Spatial Reasoning, Affordance, Task Planning, and Manipulation. Its 1,000 cases combine 32 established sources with GeoProbe, our 168-case benchmark for camera, motion, depth, and scale estimation. A minimal harness leaves task decisions to the model through source-native interfaces. Closed-weight models lead all five domains, whereas open-weight VLMs show useful spatial reasoning but substantially lower planning and manipulation success. Beneath these averages, similar geometric errors conceal different scale and shape distortions, and valid region estimates need not identify usable action points. During execution, agents can achieve early subgoals yet lose object control, bind an action to the wrong receiving region, or stop before the required physical state holds. Additional computation does not uniformly resolve these failures: code repair can restore execution without completing the task, while self-review can reverse correct judgments. Failure costs also differ: the strongest planners concentrate failed-token expenditure in prolonged body-control tasks, whereas other models fail broadly across procedures. Matched traces show how successful recovery uses feedback to restore a missing prerequisite and advance the remaining task.', 'score': 3, 'issue_id': 3496, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': '07dd6c60fff8a03d', 'authors': ['Haojian Huang', 'Pukun Zhao', 'Zexi Li', 'Yehang Zhang', 'Yangkai Wei', 'Wenqian Li', 'Han Yang', 'Kaiwen Zhou', 'Ying-Cong Chen', 'Yinchuan Li'], 'affiliations': ['HKUST (GZ)', 'Knowin AI', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.00854.jpg', 'data': {'categories': ['#cv', '#reasoning', '#dataset', '#multimodal', '#agents', '#survey', '#benchmark', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Сильные VLM планируют, но спотыкаются на физике: у каждой модели свои слепые зоны', 'desc': 'Авторы представляют Embodied Agent Arena, новый бенчмарк из 1000 кейсов для оценки 10 VLM-агентов в задачах воплощённого ИИ: геометрия, пространственное рассуждение, affordance, планирование задач и манипуляции, включая собственный GeoProbe. Закрытые модели (closed-weight) заметно опережают открытые (open-weight) в планировании и манипуляциях, при этом ошибки имеют разную природу: масштабные и геометрические искажения, потеря контроля над объектом, неверная привязка действия к области. Дополнительные вычисления, такие как исправление кода или self-review, не устраняют ошибки равномерно и иногда ухудшают корректные решения. Анализ показывает, что успешное восстановление после сбоя достигается за счёт использования обратной связи для восстановления пропущенного предусловия.'}, 'en': {'title': 'From Seeing to Doing: Testing the Full Embodied Agent', 'desc': 'The paper introduces Embodied Agent Arena, a benchmark of 1,000 tasks for evaluating vision-language model agents across geometry, spatial reasoning, affordance, planning, and manipulation. Closed-weight models perform best across all five domains, while open-weight models show stronger spatial reasoning than planning and manipulation. The analysis finds distinct failure modes, including inaccurate estimates of scale or shape, choosing unusable action points, losing object control, and stopping before a task is physically complete. More computation does not always help: code repair may fix execution without completing a task, while self-review can undo correct judgments; feedback-based recovery can help agents restore prerequisites and continue.'}, 'zh': {'title': '从看懂场景到完成操作：揭示具身智能体的真实差距', 'desc': '本文提出 Embodied Agent Arena，用 1000 个案例评估 10 种视觉语言模型智能体在几何、空间推理、可供性、任务规划和操作五个领域的表现。评测结果显示，闭源模型整体领先；开源模型虽具备一定空间推理能力，但在规划和操作任务上的成功率明显较低。错误分析发现，模型会出现尺度与形状估计偏差、无法找到可执行的操作点、失去对物体的控制，以及未达到目标状态就停止等问题。增加计算或进行自我检查并不能稳定解决这些问题，而有效的恢复策略会利用反馈补足缺失的前置条件，再继续完成任务。'}}}, {'id': 'https://huggingface.co/papers/2611.02568', 'title': 'SeMo3D: Unifying 3D Generation, Editing, and Completion via Selective Modeling', 'url': 'https://huggingface.co/papers/2611.02568', 'abstract': 'Abstract SeMo3D unifies 3D generation, editing, and completion through selective region modeling, using region-selective denoising and a multi-condition diffusion transformer to preserve unchanged content and enable training without paired data.  Generated by thinkingmachines/Inkling-Small 3D generation, editing, and completion are typically treated as regenerating the complete 3D asset under task-specific constraints, even when only a local region needs modification. This leads to task isolation, inconsistency in content that should remain unchanged, and dependence on task-specific paired data. We address these issues with a key observation: the three tasks all synthesize a designated region while keeping the rest intact---the full region for generation, the target region for editing, and the missing region for completion. We term this paradigm Selective Modeling and build SeMo3D upon it; it naturally unifies the three tasks, preserves unchanged content by construction, and enables training without paired editing or completion data, since any 3D asset can be partitioned into a selected region and its context. For training, we propose region-selective denoising, which randomly selects regions of varying sizes on standard 3D assets and applies noise and loss only to them, jointly learning all three tasks. For architecture, we propose Omni3DiT, a multi-condition 3D diffusion transformer that distinguishes regions to create from those to retain and fuses image, text, and point guidance for fine-grained control. Experiments across three benchmarks show SeMo3D surpasses state-of-the-art methods on all tasks, delivering multimodal controllability in generation and strong consistency and accuracy in editing and completion. SeMo3D further serves as a unified modeling tool for agents, enabling efficient 3D creation through natural-language interaction. Project page: https://xiaokunsun.github.io/SeMo3D.github.io/.', 'score': 3, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '4b7bae8c6a9805e7', 'pdf_title_img': 'assets/pdf/title_img/2611.02568.jpg', 'data': {'categories': ['#synthetic', '#3d', '#architecture', '#diffusion', '#multimodal', '#agents', '#training'], 'emoji': '🧊', 'ru': {'title': 'Меняем только нужный регион 3D-объекта, сохраняя остальное', 'desc': 'Статья представляет SeMo3D, единую модель для генерации, редактирования и дополнения 3D-объектов через селективное моделирование только нужной области. Метод использует region-selective denoising, при котором шум и функция потерь применяются лишь к случайно выбранным регионам стандартных 3D-ассетов, что позволяет обучаться без парных данных. Архитектура Omni3DiT, основанная на multi-condition 3D diffusion transformer, различает регионы для создания и сохранения и объединяет условия по изображению, тексту и точкам. Эксперименты показывают превосходство над state-of-the-art методами во всех трёх задачах, а также применимость модели как инструмента для AI-агентов.'}, 'en': {'title': 'Create the region you want—keep everything else intact', 'desc': 'SeMo3D unifies 3D generation, editing, and completion by creating only a selected region while preserving the rest of the asset. Its region-selective denoising trains on ordinary 3D assets by adding noise and computing loss only in randomly selected regions, so paired editing or completion data is not required. The Omni3DiT diffusion transformer separates regions to create from regions to retain and uses image, text, and point-cloud guidance. Experiments show strong results across all three tasks, with controllable generation and consistent, accurate editing and completion.'}, 'zh': {'title': '只改需要的区域，统一 3D 生成、编辑与补全', 'desc': '这篇论文提出 SeMo3D，用一种称为“选择性建模”的方法统一 3D 生成、编辑和补全：只生成指定区域，并保留其余内容。训练时，模型随机选取 3D 资产的不同区域，仅对选中区域加噪并计算损失，因此无需配对的编辑或补全训练数据。其核心架构 Omni3DiT 是多条件扩散 Transformer，能够区分需要创建和保留的区域，并结合图像、文本与点云条件进行控制。实验表明，该方法在三个任务上都优于现有方法，同时保持内容一致性，并支持通过自然语言交互创建 3D 资产。'}}}, {'id': 'https://huggingface.co/papers/2611.03806', 'title': 'BEND 2.0: Benchmarking the Capabilities Needed to Design DNA', 'url': 'https://huggingface.co/papers/2611.03806', 'abstract': "Abstract BEND 2.0 evaluates DNA language models on predicting mutation effects and guiding sequence design, revealing that linear readouts and post-training improve performance but context-specific and multi-objective design remain challenging.  Generated by thinkingmachines/Inkling-Small Genomic foundation models are increasingly used to propose DNA sequences and edits. But successful design requires capabilities that current benchmarks do not measure. Here we introduce BEND 2.0 (BENchmark for DNA language models), which tests how well models predict the effects of DNA changes and whether these predictions can guide sequence design. Across eight tasks built on five experimental datasets, we find that model choice and how representations are accessed both affect performance. Linear readouts fitted to frozen representations can match or exceed models' native outputs, and functional post-training substantially improves the models' capabilities. Linear readouts transfer well across experimental assays and genes, suggesting that models capture functional patterns beyond the data used to fit individual predictors. At the same time, strong prediction of average effects can conceal weaker prediction of context-specific effects, and accurate prediction of combined mutation effects does not imply accurate prediction of their interactions. In design tasks, model predictions can reduce the number of candidates needed to find a desired response, but still leave substantial room for better design choices, particularly for context-specific and multi-cell objectives. Our benchmark reveals that genomic models now display signs of general utility but have yet to saturate on performance in even simple tasks.", 'score': 2, 'issue_id': 3498, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '01f3f929196cf8e5', 'authors': ['Andreas Bjerregaard', 'Rachael DeVries', 'Dionysia Danai Brilli', 'Panagiotis Antoniadis', 'Yan Li', 'Anders Krogh', 'Wouter Boomsma', 'Ole Winther', 'Frederikke Isa Marin'], 'affiliations': ['Novo Nordisk A/S', 'Technical University of Denmark', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2611.03806.jpg', 'data': {'categories': ['#optimization', '#interpretability', '#transfer_learning', '#dataset', '#benchmark', '#science'], 'emoji': '🧬', 'ru': {'title': 'Геномные модели уже полезны, но до совершенства в дизайне ДНК еще далеко', 'desc': 'В статье представлен BEND 2.0 — новый бенчмарк для DNA language models, который проверяет, насколько хорошо модели предсказывают эффекты мутаций и могут ли эти предсказания помогать в дизайне последовательностей. Авторы оценивают модели на восьми задачах, построенных на пяти экспериментальных датасетах, и показывают, что линейные readouts поверх замороженных representations часто не уступают или превосходят нативные выходы моделей. Функциональный post-training заметно улучшает возможности моделей, а линейные предикторы хорошо переносятся между экспериментами и генами. Однако предсказание средних эффектов может скрывать слабость в предсказании контекстно-зависимых эффектов и взаимодействий мутаций, а задачи multi-objective дизайна остаются сложными.'}, 'en': {'title': 'DNA models can guide design, but context still matters', 'desc': 'BEND 2.0 benchmarks DNA language models on predicting mutation effects and helping design DNA sequences. Linear readouts trained on frozen model representations can match or outperform native predictions, while functional post-training can further improve performance. These readouts transfer across assays and genes, but models are less reliable at predicting context-specific effects and mutation interactions. Model-guided design can reduce the number of candidates to test, though context-specific and multi-objective design remain challenging.'}, 'zh': {'title': 'DNA 语言模型已显现通用能力，序列设计仍待突破', 'desc': '本文提出 BEND 2.0，用多个实验数据集评估 DNA 语言模型预测 DNA 变异效应和辅助序列设计的能力。研究发现，使用冻结模型表示训练线性读出层，有时能达到或超过模型原生输出的表现，而功能性后训练也能显著提升性能。线性读出层可迁移到不同实验和基因，但模型对特定上下文中的效应及突变间相互作用仍预测较弱。模型预测能减少找到目标序列所需测试的候选数量，不过在上下文特异性和多目标设计方面仍有很大改进空间。'}}}, {'id': 'https://huggingface.co/papers/2610.37914', 'title': 'Muon Makes the First Mixture-of-Experts Layer Harder to Balance', 'url': 'https://huggingface.co/papers/2610.37914', 'abstract': "Abstract Using Muon to train mixture-of-experts language models increases routing imbalance in early layers, which can be mitigated by centering router inputs or reducing the optimizer learning rate.  Generated by thinkingmachines/Inkling-Small Many open mixture-of-experts (MoE) language models train with Muon instead of AdamW. Most balance the load with a bias on each expert's routing score, adjusted after every step. Their recipes disagree on whether Muon should also train the router. In models with 55M and 108M active parameters, we measure how the optimizer changes the span of these biases, the largest minus the smallest in a layer. The span grows when all tokens favor the same experts, so it shows how hard a layer is to balance. At learning rates tuned on shorter runs, Muon raised the span of the first MoE layer at every seed, roughly doubling it on average, while the other layers changed much less. The rise came from Muon on the rest of the network, whichever optimizer trained the router. In those runs, the inputs to the first router shared a direction, and soon after the warmup its busiest expert averaged four to seven times its fair share. Over the first 3,000 steps, subtracting the batch mean from these inputs removed this overload while barely changing the loss. On the smaller model, halving Muon's learning rate removed most of the rise and slightly improved the loss. Moving only the router to AdamW made the loads shift more during the warmup and slightly raised the loss, so at this scale the results favor keeping the router on Muon.", 'score': 2, 'issue_id': 3497, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '8544a3f991e36708', 'authors': ['Marcos Hernanz'], 'affiliations': ['Universidad Autónoma de Madrid'], 'pdf_title_img': 'assets/pdf/title_img/2610.37914.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Muon усиливает дисбаланс экспертов в MoE, но его можно укротить центрированием входов роутера', 'desc': 'Статья исследует, как оптимизатор Muon влияет на балансировку нагрузки в Mixture-of-Experts (MoE) языковых моделях по сравнению с AdamW. Авторы измеряют разброс смещений роутера (router bias) по слоям и обнаруживают, что Muon усиливает дисбаланс в первом MoE-слое, где входы роутера оказываются сонаправленными. Центрирование входов роутера по батчу устраняет перегрузку экспертов почти без потери качества, а снижение learning rate для Muon дает схожий эффект. Перевод роутера на AdamW, напротив, ухудшает балансировку и слегка повышает loss, поэтому при таком масштабе рекомендуется оставлять роутер на Muon.'}, 'en': {'title': 'Center Router Inputs to Balance Muon-Trained Experts', 'desc': 'The paper studies how Muon affects expert routing balance in mixture-of-experts language models. At the tested learning rates, Muon increases routing imbalance in the first MoE layer, even when AdamW is used for the router. The imbalance is linked to router inputs that share a common direction, and subtracting their batch mean or lowering Muon’s learning rate largely reduces it with little change to loss. These results favor keeping the router on Muon at this scale rather than switching it to AdamW.'}, 'zh': {'title': '校正输入与学习率，让 Muon 下的专家负载更均衡', 'desc': '本文研究 Muon 优化器如何影响混合专家（MoE）语言模型中的专家负载均衡。实验发现，使用 Muon 训练网络会加剧首个 MoE 层的路由偏斜，使最忙的专家承接远超公平份额的 token。对路由器输入减去批次均值，或降低 Muon 的学习率，都能缓解这种过载，而且几乎不损害损失表现。相比之下，仅将路由器改用 AdamW 并未改善负载均衡，因此在这些模型规模下，结果支持继续用 Muon 训练路由器。'}}}, {'id': 'https://huggingface.co/papers/2611.03360', 'title': 'Every Pixel Is an Option: A System One Model for Medical Ultrasound Biometry', 'url': 'https://huggingface.co/papers/2611.03360', 'abstract': 'Abstract Kev-Bio is a vision-language model that guides ultrasound landmark detection via clinical questions, generating spatial probability maps to derive measurements with reduced operator variability.  Generated by thinkingmachines/Inkling-Small **Purpose:** Ultrasound biometry is widely used across various clinical applications, including prenatal and cardiac examinations, to obtain quantitative measurements by placing calipers at anatomical landmarks. However, these measurements remain subject to interoperator variability as they rely largely on manual caliper placement. Conventional methods often use specialized prediction heads for different ultrasound tasks, whereas vision-language models offer flexibility through text instructions. However, direct coordinate prediction does not explicitly model spatial likelihood distributions, limiting the representation of localization ambiguity.   **Methods:** We propose Kev-Bio, a vision-language model that uses clinical measurement questions to guide ultrasound landmark detection. Inspired by System One decision models, Kev-Bio uses decision representations of the language model to generate queries for each caliper endpoint. These queries are matched against shared dense ultrasound features to produce spatial probability maps, from which landmark coordinates and clinical measurements are derived. The model is trained end-to-end using both landmark localization and clinical measurement losses.   **Results:** On the nine-view FU/GU Biometry 2026 dataset, Kev-Bio achieves a mean radial error (MRE) of 22.50 pixels and a clinical measurement mean absolute error (MAE) of 15.38, outperforming the compared baselines in overall performance.   **Conclusion:** These results demonstrate the effectiveness of Kev-Bio for ultrasound landmark detection and clinical measurement across different anatomical views. Our code and models are available at https://github.com/moeinheidari7829/Kev-Bio.', 'score': 2, 'issue_id': 3497, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'b1328420009fbfa9', 'authors': ['Moein Heidari', 'Junbo Rao', 'Yudan Chen', 'Yasamin Medghalchi', 'River Jiang', 'Wenjin Chen', 'David J. Foran', 'Jasmine Grewal', 'Ilker Hacihaliloglu'], 'affiliations': ['Rutgers Cancer Institute', 'University of British Columbia'], 'pdf_title_img': 'assets/pdf/title_img/2611.03360.jpg', 'data': {'categories': ['#science', '#multimodal', '#cv', '#healthcare', '#architecture'], 'emoji': '🩺', 'ru': {'title': 'Текстовые вопросы направляют ИИ к точным измерениям на УЗИ', 'desc': 'В статье представлена модель Kev-Bio — vision-language model, которая использует клинические вопросы в виде текста, чтобы находить анатомические ориентиры на УЗИ-снимках. Модель формирует spatial probability maps для каждой точки измерения, из которых вычисляются координаты landmarks и клинические показатели. Обучение проходит end-to-end с использованием функций потерь для локализации и для измерений. На датасете FU/GU Biometry 2026 модель превосходит базовые методы по MRE и MAE, что говорит о снижении межоператорской вариабельности.'}, 'en': {'title
