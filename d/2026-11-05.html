pen-source omni models. We draw three findings: SleuthVLM beats a model that glances; hearing is not the bottleneck, agentic ability is; omni understanding needs better agentic ability, not just more omni data for modality alignment. So we provide a simple but effective starting point for doing omni video understanding. Omni understanding needs better agents, not just bigger models that hear.', 'score': 3, 'issue_id': 3500, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '7e129b6dbddca2b4', 'authors': ['Peiran Wu', 'Fangfei Gou', 'Zhaoxi Mu', 'Changhao Zhang', 'Jian Liu', 'Weiqiang Wang', 'Yuntao Wang', 'Yuanchun Shi', 'Junxiao Shen'], 'affiliations': ['Ant Group', 'Tsinghua University', 'University of Bristol'], 'pdf_title_img': 'assets/pdf/title_img/2611.06083.jpg', 'data': {'categories': ['#benchmark', '#agents', '#audio', '#multimodal', '#reasoning', '#video'], 'emoji': '🕵️', 'ru': {'title': 'Важен не слух, а агент: умный поиск побеждает просто большие omni-модели', 'desc': 'В статье предлагается SleuthVLM — агентная система на базе vision-language model (VLM), которая не обрабатывает аудио напрямую, а транскрибирует речь в текст. Модель самостоятельно исследует видео без заранее заданного workflow, используя агентное рассуждение. На четырёх omni-бенчмарках с видео до 90 минут SleuthVLM показывает лучшую среднюю точность (75,0%) и превосходит Gemini 3.8 Flash. Авторы делают вывод, что для понимания омни-видео важнее агентные способности модели, а не слух и не объём данных для выравнивания модальностей.'}, 'en': {'title': 'Better video agents matter more than models that hear', 'desc': 'SleuthVLM is an agent-based video system built on a vision-language model (VLM) that does not directly process audio. Instead, speech is transcribed into text, and the VLM autonomously searches the video for useful visual evidence. It achieves higher average accuracy than tested audio-hearing omni models on long-video benchmarks, including with an open-source 27B model. The results suggest that agentic reasoning—the ability to plan and gather evidence—matters more than direct auditory input or simply scaling omni training data.'}, 'zh': {'title': '理解视频，靠的是会主动探查的智能体，不只是听得更多', 'desc': 'SleuthVLM 是一个视频理解系统，它不会直接听视频音频，而是先把语音转成文字，再让视觉语言模型自主查看视频并推理。它在四个长视频基准测试中取得平均 75.0% 的准确率，比 Gemini 3.8 Flash 高 2.6 个百分点，并在 Video-MME-v2 上达到 77.8%。使用开源 27B 视觉语言模型时，它也超过了所有受测的开源全模态模型。研究表明，提升模型自主搜寻和推理视频信息的智能体能力，比单纯增加音频输入或全模态训练数据更重要。'}}}, {'id': 'https://huggingface.co/papers/2611.04634', 'title': 'VeriSpoof: Beyond Real or Fake with One Audio LLM', 'url': 'https://huggingface.co/papers/2611.04634', 'abstract': 'Abstract VeriSpoof is an audio language model that unifies deepfake detection, generator attribution, source verification, and evidence-based rationale generation with minimal parameter updates.  Generated by thinkingmachines/Inkling-Small A speech deepfake detector estimates whether a recording is synthetic, but a forensic analyst also asks which system produced it, whether recordings share a source, and what evidence supports each conclusion. We present VeriSpoof, an audio language model that unifies five tasks with shared weights: deepfake detection, generator attribution (generator, acoustic model and vocoder), recording-condition analysis, synthesized-span localisation, and source verification. Each decision is supported by grounded rationales whose statements can be independently verified. Answers are scored by sentence likelihood, allowing detection and source verification to be thresholded without separate heads. Rationale statements can be checked against waveform measurements, span labels, or generator metadata. Counterfactual examples train decisions to follow the stated evidence. Across the 14 Speech-DF-Arena test sets, VeriSpoof-Plus achieves 2.14% pooled EER, ranking third of 28 systems and first among open-weight systems. VeriSpoof-Base, trained only on official training splits of eight corpora, achieves 4.43% EER, less than half that of the next open-weight detector. With the same weights, VeriSpoof-Plus verifies whether recordings from generators unseen in training share a source at 6.2% EER. Controlled studies show that the audio representation governs detection, the LLM governs recording comparison, and source supervision is necessary for neural-codec fakes. Statement-checkable rationales catch partial fakes missed by one-step answers (99.6% vs. 78.4% on PartialEdit) and determine decisions under edits unseen in training (99.5%). Training updates only 29.7M of 2.85B parameters, fitting a single 24 GB GPU with gradient checkpointing. We release both models, inference code, a demo, and VeriSpoof-Bench, the evaluation suite covering these questions.', 'score': 3, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '6d8fc24420f2df71', 'authors': ['Yang Xiao', 'Ting Dang'], 'affiliations': ['The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2611.04634.jpg', 'data': {'categories': ['#benchmark', '#training', '#security', '#interpretability', '#audio', '#dataset', '#open_source', '#multimodal', '#ethics'], 'emoji': '🎧', 'ru': {'title': 'Не просто «подделка или нет»: ИИ, который доказывает свой вывод по звуку', 'desc': 'Статья представляет VeriSpoof, аудио LLM, которая объединяет пять задач: детекцию дипфейков, определение генератора, анализ условий записи, локализацию синтезированных участков и верификацию источника. Модель обучается с помощью минимального числа обновляемых параметров (29,7 млн из 2,85 млрд) и даёт обоснования, которые можно проверить по измерениям сигнала и метаданным. Контрфактуальные примеры учат модель опираться на заявленные доказательства, что повышает точность на частично подделанных записях. На 14 тестовых наборах Speech-DF-Arena VeriSpoof-Plus показывает 2,14% EER и лучший результат среди открытых систем.'}, 'en': {'title': 'One audio model, evidence for every deepfake decision', 'desc': 'VeriSpoof is an audio language model that uses shared weights to detect deepfakes, identify the generator, analyze recording conditions, locate synthesized spans, and verify whether recordings share a source. It provides evidence-based rationales that can be checked against audio measurements, span labels, and generator metadata, and uses counterfactual examples to make its decisions follow the evidence. VeriSpoof-Plus achieves a pooled equal error rate (EER) of 2.14% across 14 test sets, while the smaller-training VeriSpoof-Base achieves 4.43%; the same model can also verify sources from unseen generators. Training updates only 29.7 million of its 2.85 billion parameters, and checkable rationales improve detection of partial fakes and edits not seen during training.'}, 'zh': {'title': '让语音伪造检测有证据，也能追溯来源', 'desc': 'VeriSpoof 是一种音频语言模型，可用同一套模型完成五项任务：检测语音是否为深度伪造、判断生成来源、分析录音条件、定位合成片段，以及验证不同录音是否来自同一来源。它会给出可核查的理由，依据包括波形测量、片段标签和生成器元数据，并通过反事实样例训练模型让判断与证据一致。在 14 个测试集上，VeriSpoof-Plus 的总体等错误率（EER）为 2.14%，在 28 个系统中排名第三，也是开放权重系统中的第一名；模型还可识别训练中未见过的生成器来源。训练时只更新 28.5 亿个参数中的 2970 万个参数，研究也显示，可核查的理由有助于发现简单判断容易漏掉的局部伪造。'}}}, {'id': 'https://huggingface.co/papers/2610.40516', 'title': 'How I Aligned Your Model: Scaling Up Multilingual Safety Training with Templates', 'url': 'https://huggingface.co/papers/2610.40516', 'abstract': 'Abstract Researchers developed a scalable template-based pipeline to generate multilingual safety datasets, revealing that English-only evaluations misjudge multilingual model safety and that culturally localized training improves alignment across languages.  Generated by thinkingmachines/Inkling-Small Safety alignment for Large Language Models is heavily focused on English with limited multilingual representation, particularly damaging low-resource language performance. Related open training datasets are often limited in size or do not follow region-localized harmful topics to broaden the scope of alignment beyond cultures. We propose a scalable template-based augmentation pipeline to produce massive multilingual refusal and benign corpora, extracting safe templates from harmful prompts, translating them and then filling in the slots with culturally authentic entities, both harmful and benign. As a result, we release MSafeTemp, a validated corpus spanning 60 languages useful for multilingual safety alignment and evaluation. Using the dataset, we show that English-only evaluation misjudges multilingual safety: for several models, attacks that fail in English succeed once translated, while culturally localized variants expose further failures that translation alone misses. We also confirm that augmenting safety training data through templates allows for higher diversity and quality of alignment, resulting in improved safety performance beyond English. MSafeTemp and the respective pipeline are aimed at facilitating research and development of safer and more responsible models for less-represented cultures.', 'score': 2, 'issue_id': 3500, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '8a1d5725bd4fc487', 'authors': ['Max Neuwinger', 'Hanna Yukhymenko', 'Imanol Schlag'], 'affiliations': ['ETH Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2610.40516.jpg', 'data': {'categories': ['#data', '#benchmark', '#training', '#security', '#alignment', '#multilingual', '#low_resource', '#dataset', '#translation', '#open_source', '#synthetic', '#ethics'], 'emoji': '🌍', 'ru': {'title': 'Безопасность ИИ должна говорить на всех языках мира', 'desc': 'Авторы предложили масштабируемый конвейер на основе шаблонов для генерации многоязычных датасетов по безопасности LLM. Метод извлекает безопасные шаблоны из вредоносных промптов, переводит их и заполняет слоты культурно достоверными сущностями, как вредоносными, так и безобидными. На основе этого создан корпус MSafeTemp, охватывающий 60 языков, пригодный для alignment и оценки безопасности. Эксперименты показывают, что оценка только на английском языке не выявляет уязвимости моделей, тогда как культурно локализованные данные повышают безопасность на разных языках.'}, 'en': {'title': 'Safer AI Starts with Culturally Aware, Multilingual Training', 'desc': 'The paper presents a scalable method for creating multilingual safety datasets using reusable templates, translations, and culturally relevant examples. It introduces MSafeTemp, a validated dataset covering 60 languages for training and evaluating language-model safety. Tests show that English-only evaluations can miss safety failures, including attacks that work after translation or cultural adaptation. Training with more diverse, culturally localized examples improves safety alignment across languages.'}, 'zh': {'title': '让安全对齐跨越语言，也贴近文化', 'desc': '本文提出一种可扩展的模板增强流程，用于生成多语言的拒绝回答与良性内容数据。研究团队发布了经过验证的 MSafeTemp 数据集，覆盖 60 种语言，并融入符合当地文化的实体与情境。实验发现，只用英语评估会误判模型的多语言安全性：有些攻击在翻译后能够成功，而本地化内容还会暴露翻译未发现的漏洞。使用这些多样化数据进行安全对齐训练，可提升模型在多种语言中的安全表现。'}}}, {'id': 'https://huggingface.co/papers/2611.05609', 'title': 'On the Generalization Limitation of On-Policy Distillation for Post-RL Consolidation', 'url': 'https://huggingface.co/papers/2611.05609', 'abstract': "Abstract  Multi-teacher on-policy distillation (MOPD) extends on-policy distillation (OPD) to consolidate capabilities from multiple teachers. Although prior work reports near-perfect in-distribution (IND) distillation performance, we find that this can mask incomplete capability consolidation beyond the supervised distribution. A preliminary study on synthetic reasoning shows that OPD does not fully transfer teachers' generalization capabilities. We then extend this investigation to real-world tasks, evaluating extrapolative and compositional generalization across mathematical reasoning, coding, agent, and long-context capabilities using Qwen3 models. Across extrapolative settings, OPD and MOPD reach 96.04-102.73% of their teachers' IND scores. Yet their out-of-distribution (OOD) scores remain 2.45-16.25% below the base model's. Across three compositional settings, MOPD improves IND performance over the base model, but its performance on composed tasks as OOD remains 18.19-24.34% below that of the best teachers. To understand these gaps, we examine teacher capability and data coverage as two potential bottlenecks. Jointly alleviating these bottlenecks eliminates OOD forgetting in our experiments and suggests the potential for generalization beyond the teacher. (M)OPD also reduces OOD forgetting on average relative to its reinforcement learning (RL) baselines. Analysis of the associated update geometry reveals smaller and more spectrally concentrated updates on average than those of the RL baselines, along with greater shared update structure under MOPD. Motivated by these findings, we propose geometry-based patching and base-preserving replay to improve OOD performance while largely preserving IND performance. Our findings identify a blind spot in capability consolidation via (M)OPD, highlighting the need for algorithms that explicitly support OOD retention and generalization.", 'score': 1, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '479d7de72c3ba593', 'authors': ['Yichen Wang', 'Yufa Zhou', 'Siqi Zhu', 'Haozheng Luo', 'Jingzhi Bao', 'Zhichao Liu', 'Zijun Wei'], 'affiliations': ['ByteDance', 'Duke University', 'Northwestern University', 'UIUC', 'University of Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2611.05609.jpg', 'data': {'categories': ['#training', '#benchmark', '#optimization', '#alignment', '#reasoning'], 'emoji': '🧑🏫', 'ru': {'title': 'Дистилляция из нескольких учителей не гарантирует обобщение: ученик забывает за пределами обучающих данных', 'desc': 'В статье исследуется multi-teacher on-policy distillation (MOPD), то есть дистилляция из нескольких учителей на on-policy данных, которая объединяет способности нескольких моделей-учителей в одну модель-ученика. Авторы показывают, что высокие результаты на in-distribution (IND) задачах скрывают неполный перенос обобщающей способности: на out-of-distribution (OOD) задачах, включая экстраполяцию и композиционное обобщение, модели хуже базовой и лучших учителей. Анализ выявляет два узких места: качество учителей и покрытие данных, а также геометрию обновлений весов, которая отличается от RL-бейзлайнов. На основе этого предлагаются geometry-based patching и base-preserving replay, улучшающие OOD-производительность при сохранении IND-результатов.'}, 'en': {'title': 'Distill More Than the Training Distribution', 'desc': 'This paper studies whether on-policy distillation (OPD) and multi-teacher OPD (MOPD) transfer teachers’ abilities beyond the training distribution. Although both methods often match teachers on in-distribution tasks, they can perform worse on out-of-distribution tasks, especially when tasks require extrapolation or combining capabilities. The authors find that weak teacher capabilities and gaps in training-data coverage contribute to this forgetting, and that addressing both can eliminate it in their experiments. They also propose geometry-based patching and base-preserving replay, which improve out-of-distribution performance while largely maintaining in-distribution results.'}, 'zh': {'title': '蒸馏不止要学会，更要保住分布外泛化能力', 'desc': '本文研究多教师在线策略蒸馏（MOPD）能否把多个教师的能力有效迁移到学生模型中。实验发现，即使模型在训练分布（IND）上的表现接近教师，在分布外（OOD）的推理、编程、智能体和长上下文任务上仍可能出现能力遗忘，尤其是组合任务。教师能力不足和训练数据覆盖不够是造成这一差距的两个潜在瓶颈；同时改善它们后，实验中的 OOD 遗忘得以消除。作者还提出基于更新几何的修补方法和保留基模型的回放策略，以提升 OOD 表现并尽量维持 IND 表现。'}}}, {'id': 'https://huggingface.co/papers/2611.04760', 'title': 'Koopman Generative Operators for Efficient Probabilistic Time-Series Forecasting', 'url': 'https://huggingface.co/papers/2611.04760', 'abstract': 'Abstract KGO unifies structured latent dynamics with single-step flow matching and adaptive uncertainty gating to achieve accurate, efficient probabilistic time-series forecasting.  Generated by thinkingmachines/Inkling-Small Probabilistic time-series forecasting requires models that simultaneously capture structured temporal dynamics, expressive uncertainty, and efficient inference, yet existing approaches fall short of this goal: latent dynamical models impose structure but rely on restrictive generation mechanisms, while modern generative methods such as diffusion and flow matching achieve flexibility at the cost of iterative and computationally expensive sampling. We introduce the Koopman Generative Operator (KGO), a probabilistic forecasting method that conceptualizes prediction as the evolution of structured uncertainty. KGO integrates three core components: (1) Koopman Patch Embedding (KoPE) for temporally consistent latent trajectory extrapolation; (2) Koopman Flow Matching (KoFM), which enables fast, single-step generation through a closed-form matrix exponential in a Koopman latent space, bypassing iterative sampling; and (3) an Adaptive Uncertainty Gate (AUG), which provides probabilistic forecasts by adapting uncertainty per-variable and per-horizon, corresponding to a learned decomposition of aleatoric uncertainty without manual tuning. By unifying these components, KGO achieves state-of-the-art accuracy on 13/17 ProbTS benchmarks in CRPS and 16/17 in NMAE. Further, by eliminating iterative sampling, KGO delivers at least a 25times reduction in inference time compared to iterative generative models. These results position KGO as a practical and principled framework that advances the accuracy-efficiency trade-off in probabilistic time-series forecasting, combining leading accuracy on the evaluated benchmarks with fast, single-step generation.', 'score': 0, 'issue_id': 3500, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'fe950da52e8ec581', 'authors': ['Raz Marshanski', 'Liran Nochumsohn', 'Mayank Jauhari', 'Boris N. Oreshkin', 'Omri Azencot'], 'affiliations': ['Amazon Science', 'Ben-Gurion University of the Negev'], 'pdf_title_img': 'assets/pdf/title_img/2611.04760.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#architecture', '#inference'], 'emoji': '📈', 'ru': {'title': 'Прогноз за один шаг: точность вероятностных временных рядов без итеративного сэмплирования', 'desc': 'Статья представляет Koopman Generative Operator (KGO) — метод вероятностного прогнозирования временных рядов, который рассматривает предсказание как эволюцию структурированной неопределённости. Модель объединяет Koopman Patch Embedding для согласованной экстраполяции латентных траекторий, Koopman Flow Matching, позволяющий генерировать прогноз за один шаг через матричную экспоненту в латентном пространстве Купмана, и Adaptive Uncertainty Gate, адаптивно настраивающий алеаторическую неопределённость по переменным и горизонтам. По результатам на бенчмарках ProbTS KGO превосходит современные методы по CRPS и NMAE, а время инференса сокращается минимум в 25 раз по сравнению с итеративными генеративными моделями.'}, 'en': {'title': 'Forecast Time Series Accurately—in One Fast Step', 'desc': 'The paper introduces the Koopman Generative Operator (KGO), a probabilistic model for forecasting time series. It uses Koopman Patch Embedding to represent temporal patterns and Koopman Flow Matching to generate forecasts in one step, avoiding slow iterative sampling. An Adaptive Uncertainty Gate estimates uncertainty separately for each variable and forecast horizon. KGO achieves strong accuracy on many benchmarks while reducing inference time by at least 25 times compared with iterative generative models.'}, 'zh': {'title': '单步生成，兼顾时间序列预测的准确性与效率', 'desc': '这篇论文提出 Koopman Generative Operator（KGO），用于概率时间序列预测，将预测建模为结构化不确定性的演化。它通过 Koopman Patch Embedding 保持潜在轨迹的时间一致性，并利用 Koopman Flow Matching 在 Koopman 潜在空间中通过矩阵指数实现单步生成，无需反复采样。自适应不确定性门控会针对不同变量和预测时距调整不确定性，从而学习刻画偶然不确定性。KGO 在 17 个基准中的 13 个取得最佳 CRPS、16 个取得最佳 NMAE，且推理速度至少比迭代式生成模型快 25 倍。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (7)', '#agi', '#alignment (2)', '#architecture (6)', '#audio (3)', '#benchmark (11)', '#cv (3)', '#data (3)', '#dataset (6)', '#diffusion (3)', '#ethics (2)', '#games (2)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (4)', '#interpretability (2)', '#leakage (1)', '#long_context (2)', '#low_resource (1)', '#machine_translation', '#math', '#multilingual (1)', '#multimodal (7)', '#open_source (4)', '#optimization (11)', '#plp', '#rag (1)', '#reasoning (3)', '#rl (3)', '#rlhf (1)', '#robotics (3)', '#science (1)', '#security (2)', '#small_models', '#story_generation', '#survey (1)', '#synthetic (1)', '#training (13)', '#transfer_learning (2)', '#video (9)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-05 08:47',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-05 08:47')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-05 08:47')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
