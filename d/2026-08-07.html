    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.05631', 'title': 'ChronoVision: Temporal Reasoning via Latent State Reconstruction', 'url': 'https://huggingface.co/papers/2608.05631', 'abstract': 'Abstract  Multimodal large language models excel at passive perception but struggle with complex visual cognitive tasks requiring multi-step temporal reasoning. This degradation largely stems from the inherent ambiguity of language-based reasoning, which often fails to accurately articulate continuous visual transformations. To address this, we propose ChronoVision, a multimodal framework designed to align visual logic with latent imagery. During supervised fine-tuning, a Reconstructive Visual Head predicts the latent representation of the final transformed state, while an ROI Attention Locating module focuses the model on key visual evidence via semantic span queries. In post-training, we apply reinforcement learning with an implicit process grounding mechanism, guided by a composite reward function that evaluates outcome correctness, latent process alignment, and unsupervised visual focus. Furthermore, we introduce Vbvr-VQA, a novel dataset that evaluates temporal tracking by reformulating video reasoning into a strict image-ordering task. Experiments demonstrate that ChronoVision achieves state-of-the-art performance on Vbvr-VQA with 74.8% in-domain and 71.6% out-of-domain accuracy, alongside a strong 55.0% accuracy on IntPhys2, a highly challenging cross-domain benchmark.', 'score': 6, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '4629d381d1088675', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#video', '#alignment', '#benchmark', '#dataset', '#reasoning', '#rlhf'], 'emoji': '🎬', 'ru': {'title': 'Понимание временных преобразований в визуальном мышлении мультимодальных моделей', 'desc': 'В статье предложена ChronoVision — мультимодальная архитектура для улучшения способности больших языковых моделей решать сложные задачи визуального мышления с многошаговым временным рассуждением. Модель использует Reconstructive Visual Head для предсказания скрытых представлений трансформированных состояний и ROI Attention Locating для фокусировки на ключевых визуальных деталях через семантические span queries. Обучение дополняется reinforcement learning с неявным механизмом grounding процесса и композитной функцией награды, оценивающей корректность результата и согласованность скрытого процесса. Авторы представили новый датасет Vbvr-VQA для оценки временного отслеживания путём преобразования видео-рассуждений в задачу упорядочивания изображений.'}, 'en': {'title': 'ChronoVision: Bridging Visual Logic and Language for Enhanced Reasoning', 'desc': 'This paper introduces ChronoVision, a multimodal framework that enhances the ability of large language models to perform complex visual reasoning tasks. It addresses the limitations of language-based reasoning by aligning visual logic with latent imagery through a Reconstructive Visual Head and an ROI Attention Locating module. The model is fine-tuned using supervised learning and further improved with reinforcement learning, which incorporates a composite reward function to evaluate performance. The authors also present the Vbvr-VQA dataset, which tests temporal tracking by converting video reasoning into an image-ordering challenge, showing that ChronoVision achieves impressive accuracy on various benchmarks.'}, 'zh': {'title': 'ChronoVision：提升视觉推理的多模态框架', 'desc': '这篇论文提出了一种名为ChronoVision的多模态框架，旨在解决大型语言模型在复杂视觉认知任务中的不足。该框架通过重建视觉头和ROI注意力定位模块来对齐视觉逻辑与潜在图像，从而提高模型的推理能力。通过强化学习和复合奖励函数，ChronoVision能够更好地评估结果的正确性和潜在过程的对齐。实验结果表明，ChronoVision在新提出的Vbvr-VQA数据集上表现优异，达到了74.8%的领域内准确率。'}}}, {'id': 'https://huggingface.co/papers/2608.06060', 'title': 'Learning from Failures: Retrieval-Centric CoT via Hard Negatives for Unified Multimodal Retrieval', 'url': 'https://huggingface.co/papers/2608.06060', 'abstract': 'Abstract  Unified multimodal retrieval aims to identify candidates that satisfy complex user intent expressed through heterogeneous inputs. Although Large Vision-Language Model (LVLM)-based retrievers are efficient and scalable, directly encoding raw multimodal inputs often misses fine-grained discriminative cues, leading to confusion among semantically similar candidates. Recent methods mitigate this limitation by generating Chain-of-Thought (CoT) rationales to enrich the query representation. However, such reasoning is typically derived from the query alone: it explains what the query describes, but not what the retriever misunderstands. We argue that effective retrieval reasoning should instead be conditioned on retrieval feedback. Based on this insight, we introduce UniME-R1, an embedder-adviser framework that learns to reason over initially retrieved candidates and generate Retrieval-Centric Chain-of-Thought (RC-CoT). The adviser analyzes candidates individually to identify the discriminative cues confused by the embedder. If the target appears in the initial top-k set, UniME-R1 directly reranks the candidates; otherwise, it generates RC-CoT to refine the retrieval direction and performs full-corpus re-retrieval with a dual-mode embedder. To train the framework, we mine hard negatives to simulate realistic retrieval failures, jointly optimize direct retrieval and RC-CoT-augmented retrieval, and align the adviser with retrieval outcomes through supervised learning and retrieval-oriented reinforcement learning. Extensive experiments on MMEB-V2 and a diverse set of general multimodal retrieval benchmarks demonstrate that UniME-R1 consistently improves retrieval performance over strong baselines.', 'score': 4, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'dae611bf98b93e5c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#rl', '#benchmark', '#rag', '#training'], 'emoji': '🔍', 'ru': {'title': 'Рассуждение, ориентированное на ошибки поиска, для улучшения мультимодального retrieval', 'desc': 'В работе предложен новый подход к мультимодальному поиску, использующий большие видео-языковые модели с механизмом рассуждения, обусловленным результатами поиска. Система состоит из двух компонентов: embedder извлекает начальные кандидаты, а adviser анализирует их и генерирует цепочку рассуждений, сфокусированную на ошибках поиска (RC-CoT). Если целевой объект найден в топ-k результатов, модель переранжирует кандидатов; иначе она уточняет направление поиска и проводит повторный поиск по полному корпусу. Модель обучается на сложных отрицательных примерах с использованием supervised learning и reinforcement learning, ориентированного на метрики поиска.'}, 'en': {'title': 'Enhancing Multimodal Retrieval with Feedback-Driven Reasoning', 'desc': 'This paper presents UniME-R1, a novel framework for unified multimodal retrieval that enhances the retrieval process by incorporating feedback from initially retrieved candidates. Unlike traditional methods that rely solely on the query for reasoning, UniME-R1 generates Retrieval-Centric Chain-of-Thought (RC-CoT) to address misunderstandings in candidate selection. The framework employs an adviser that analyzes candidates to identify and clarify discriminative cues, improving the accuracy of retrieval. Through extensive experiments, the authors demonstrate that UniME-R1 significantly outperforms existing retrieval methods, showcasing its effectiveness in handling complex user intents across multimodal inputs.'}, 'zh': {'title': '提升多模态检索的智能化思维', 'desc': '统一多模态检索旨在识别满足复杂用户意图的候选项，这些意图通过不同类型的输入表达。虽然基于大型视觉语言模型的检索器高效且可扩展，但直接编码原始多模态输入常常会遗漏细微的区分线索，导致语义相似的候选项之间产生混淆。为了解决这个问题，本文提出了UniME-R1框架，通过分析初步检索到的候选项，生成以检索为中心的思维链（RC-CoT），从而改善检索方向。实验结果表明，UniME-R1在多个多模态检索基准上显著提高了检索性能。'}}}, {'id': 'https://huggingface.co/papers/2608.05248', 'title': 'WorldClaw: Agentic 3D Open-World Generation at Scale', 'url': 'https://huggingface.co/papers/2608.05248', 'abstract': 'Abstract  Generating large-scale, freely explorable 3D worlds from open-ended text remains challenging because a system must jointly maintain global spatial coherence, rich local content, and explicit assets suitable for downstream editing and reuse. We present WorldClaw, a fully agentic, coarse-to-fine framework for open-world 3D scene generation. Planning agents translate a text prompt into a structured specification of regions, terrain, assets, materials, and spatial relations. WorldClaw then builds a globally coherent terrain foundation from semantic layouts, reusable assets, generative or procedural materials, and a region-aware height field. For detail-demanding regions, it generates terrain-conditioned compositions, reconstructs editable textured meshes, and recovers their placement on the terrain; render-based agents further refine terrain, objects, appearance, and contacts. Across diverse open-world prompts, WorldClaw produces large-scale scenes with coherent spatial organization, visually compelling local content, and editable instance-level assets while preserving a consistent global terrain structure.', 'score': 2, 'issue_id': 2867, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '9a406cd7ebda73dc', 'authors': ['Chunchao Guo', 'Jinpeng Li', 'Yang Li', 'Zilong Huang'], 'affiliations': ['Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2608.05248.jpg', 'data': {'categories': ['#agents', '#multimodal', '#3d'], 'emoji': '🌍', 'ru': {'title': 'Агентная генерация больших 3D миров из текста с сохранением пространственной согласованности', 'desc': 'WorldClaw — это агентная система для генерации больших 3D миров на основе текстового описания. Система использует многоагентный подход: планирующие агенты преобразуют текстовый запрос в структурированную спецификацию с регионами, террейном и пространственными отношениями. Фреймворк построен по принципу «от общего к частному», сначала создавая глобально согласованный рельеф и материалы, затем генерируя детальное локальное содержимое с редактируемыми мешами. Рендер-агенты уточняют финальные детали, обеспечивая визуальную привлекательность при сохранении глобальной пространственной согласованности и возможности последующего редактирования.'}, 'en': {'title': 'Crafting 3D Worlds from Text: WorldClaw Unleashed!', 'desc': 'WorldClaw is a novel framework designed for generating expansive 3D environments from text descriptions. It utilizes planning agents to convert text prompts into detailed specifications that include terrain, assets, and spatial relationships. The system ensures global spatial coherence while allowing for rich local details and editable components. By employing a coarse-to-fine approach, WorldClaw effectively creates visually appealing and structured 3D scenes that can be easily modified for various applications.'}, 'zh': {'title': 'WorldClaw：生成开放世界3D场景的新方法', 'desc': '本文介绍了一种名为WorldClaw的框架，用于生成开放世界的3D场景。该系统通过规划代理将文本提示转化为结构化的区域、地形、资产和材料规范。WorldClaw能够构建全球一致的地形基础，并生成细节丰富的区域内容。最终，它能够生成可编辑的实例级资产，同时保持一致的全球地形结构。'}}}, {'id': 'https://huggingface.co/papers/2608.05802', 'title': 'On-Policy Delta Distillation for Multilingual Math Reasoning', 'url': 'https://huggingface.co/papers/2608.05802', 'abstract': 'Abstract  On-Policy Distillation (OPD) is emerging as a promising alternative to reinforcement learning for LLM post-training, yet its effectiveness in multilingual settings remains underexplored. We study OPD and its advanced variant, On-Policy Delta Distillation (OPD^2), for mathematical reasoning in English, Korean, and Japanese. OPD^2 improves OPD by using the probability gap between a post-trained teacher and its base model as the learning signal. Experiments with Qwen3 show that OPD^2 consistently outperforms the original OPD, with particularly strong improvements in Korean and Japanese, and generally narrows the English-Korean performance gap. We further find that English-only OPD can also increase performance for Korean and Japanese, but often shifts the responses toward English, highlighting the importance of multilingual data to preserving target-language responses.', 'score': 1, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'f2f88893497ccd7b', 'authors': ['Byeongho Heo', 'Jaehui Hwang', 'Sangdoo Yun', 'Dongyoon Han'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.05802.jpg', 'data': {'categories': ['#training', '#multilingual', '#math'], 'emoji': '🌍', 'ru': {'title': 'Дистилляция знаний для многоязычного математического рассуждения в LLM', 'desc': 'В статье исследуется метод On-Policy Distillation (OPD) и его улучшенный вариант OPD^2 для обучения больших языковых моделей на задачах математического рассуждения на английском, корейском и японском языках. OPD^2 превосходит стандартный OPD благодаря использованию вероятностного зазора между обученной учительской моделью и её базовой версией в качестве сигнала обучения. Экспериментальные результаты на Qwen3 показывают, что OPD^2 последовательно демонстрирует лучшую производительность, особенно на неанглийских языках. Авторы обнаруживают, что обучение только на английских данных может привести к смещению ответов в сторону английского языка, что подчёркивает важность многоязычных данных для сохранения целевого языка.'}, 'en': {'title': 'Enhancing Multilingual Learning with On-Policy Distillation', 'desc': 'On-Policy Distillation (OPD) is a new method that offers a different approach to training large language models (LLMs) after their initial training, especially in multilingual contexts. The paper introduces an enhanced version called On-Policy Delta Distillation (OPD^2), which uses the difference in probabilities between a teacher model and its base model to improve learning. Experiments show that OPD^2 significantly enhances performance in Korean and Japanese, while also reducing the performance gap between English and Korean. Additionally, using English-only OPD can help improve results for Korean and Japanese, but may lead to responses that are more English-like, emphasizing the need for diverse language data.'}, 'zh': {'title': '多语言环境下的强化学习新方法', 'desc': '本文探讨了在多语言环境中，On-Policy Distillation（OPD）及其改进版本On-Policy Delta Distillation（OPD^2）在数学推理中的应用。OPD^2通过利用后训练教师模型与基础模型之间的概率差距作为学习信号，从而提升了OPD的效果。实验结果表明，OPD^2在处理韩语和日语时表现显著优于原始的OPD，并且缩小了英语与韩语之间的性能差距。研究还发现，仅使用英语的OPD也能提高韩语和日语的表现，但往往会使回答偏向英语，这突显了多语言数据在保持目标语言响应中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.05747', 'title': 'GST-Bench: Can VLMs Develop Global Spatial Awareness from Video?', 'url': 'https://huggingface.co/papers/2608.05747', 'abstract': 'Abstract  Spatial intelligence is fundamental to embodied agents, yet existing benchmarks focus on local spatial perception from single or few viewpoints, overlooking global spatial awareness over continuous, long-horizon visual streams. To address this limitation, we introduce the Global-Spatial-Temporal Benchmark (GST-Bench), a VQA benchmark for global spatial intelligence in video understanding, comprising human-verified questions derived from 6,790 minutes of synthetically generated video. It requires models to perform accurate spatial inference from novel viewpoints unseen in the input video and to map egocentric observations onto global top-down images. A comprehensive evaluation of 22 state-of-the-art VLMs exposes a striking gap between models and humans: the strongest zero-shot model attains only 42.68, far below the human score of 79.08. To probe the cause of this gap, we construct GST-Bench-Local and find that models, despite strong local spatial understanding under the same task formulation, still fail to consolidate long-horizon observations into a globally consistent scene representation. We further provide GST-Train, a dataset for global spatial reasoning, as a complementary resource to facilitate future research on this challenge.', 'score': 0, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'e82b058806995c62', 'authors': ['Qifeng Zhang', 'Kaixiang Huang', 'Heng Dong', 'Huang Fang', 'Junting Chen', 'Junjie Zhu', 'Yonghang Chen', 'Zhiyu Zhang', 'Wei Li'], 'affiliations': ['ByteDance Seed', 'National University of Singapore', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05747.jpg', 'data': {'categories': ['#multimodal', '#video', '#robotics', '#benchmark', '#dataset', '#synthetic', '#long_context'], 'emoji': '🌍', 'ru': {'title': 'Глобальное пространственное понимание: от локальных наблюдений к единому представлению мира', 'desc': 'В работе представлен новый бенчмарк GST-Bench для оценки глобального пространственного понимания видеоагентами через задачу VQA на синтетических видео длительностью 6790 минут. Авторы выявили значительный разрыв между современными моделями на основе видео-языковых трансформеров и человеческими способностями: лучшая модель достигает только 42.68% точности против 79.08% у людей. Исследование показало, что модели хорошо понимают локальные пространственные отношения, но не могут интегрировать долгосрочные наблюдения в согласованное глобальное представление сцены. Авторы предоставляют дополнительный датасет GST-Train для обучения моделей пространственному рассуждению в видео.'}, 'en': {'title': 'Bridging the Gap in Global Spatial Intelligence', 'desc': 'This paper introduces the Global-Spatial-Temporal Benchmark (GST-Bench), which evaluates global spatial intelligence in video understanding. Unlike existing benchmarks that focus on local spatial perception, GST-Bench requires models to infer spatial relationships from unseen viewpoints and to integrate egocentric observations into a global context. The evaluation of 22 state-of-the-art vision-language models (VLMs) reveals a significant performance gap between these models and human capabilities, with the best model scoring only 42.68 compared to a human score of 79.08. To address this issue, the authors also present GST-Train, a dataset designed to enhance global spatial reasoning in future research.'}, 'zh': {'title': '全球空间智能的新基准挑战', 'desc': '空间智能对具身智能体至关重要，但现有基准主要关注局部空间感知，忽视了对连续长时间视觉流的全球空间意识。为了解决这个问题，我们提出了全球空间时间基准（GST-Bench），这是一个用于视频理解的视觉问答基准，包含来自6790分钟合成视频的人类验证问题。该基准要求模型从输入视频中未见的新视角进行准确的空间推理，并将自我中心的观察映射到全球俯视图像上。通过对22个最先进的视觉语言模型的全面评估，我们发现模型与人类之间存在显著差距，最强的零样本模型得分仅为42.68，远低于人类的79.08分。'}}}, {'id': 'https://huggingface.co/papers/2608.06301', 'title': 'HarnessOpt-Bench: Evaluating LLMs at Harness Optimization', 'url': 'https://huggingface.co/papers/2608.06301', 'abstract': "Abstract  As LLMs are increasingly deployed within agentic systems, their capabilities depend not only on the model weights but also on the harness: the prompts, tools, control flow, memory, and orchestration code surrounding them. This makes automated harness optimization -- the iterative and evaluation-guided improvement of a harness by an AI system -- both an important route to improving AI systems and a demanding capability for AI systems themselves. Yet the community lacks a common protocol for measuring how well frontier LLMs perform at this task. We introduce HarnessOpt-Bench, a benchmark for end-to-end harness optimization under expensive and stochastic evaluation. An optimizer, an LLM paired with a coding harness, receives a target agent's seed harness, graded evaluation feedback, and a fixed target-evaluation budget. It edits the harness and nominates a final candidate, which is scored by its normalized gain over the seed on a held-out test partition that remains inaccessible throughout search. A trusted execution environment enforces the evaluation boundary, meters target-agent resource use, and preserves candidate versions for audit. We evaluate 5 frontier LLMs as optimizers both under a shared coding harness and under their native harnesses across 4 downstream tasks, over 111 scored runs. Experiment results show that optimizer models separate more than the coding harnesses they act through, native harnesses are not consistently superior, and gains vary substantially across tasks and seed regimes. These results establish harness optimization as a measurable and discriminative capability with large space for improvement.", 'score': 0, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'e87eea6e71a8e5ee', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#benchmark', '#agents'], 'emoji': '🛠️', 'ru': {'title': 'Автоматическая оптимизация конфигурации агентов через самосовершенствующиеся языковые модели', 'desc': 'В статье предлагается HarnessOpt-Bench — первый бенчмарк для оценки способности большых языковых моделей оптимизировать «обвязку» агентских систем, включающую промпты, инструменты и управление памятью. Авторы разработали методику тестирования, где модель-оптимизатор получает начальную конфигурацию, обратную связь от оценивающей функции и фиксированный бюджет вычислений, затем итеративно улучшает систему. Проведено сравнение пяти передовых LLM-моделей как оптимизаторов на четырёх задачах с более чем 110 запусками, с использованием защищённого окружения для валидации результатов. Результаты показывают значительные различия между моделями и задачами, подтверждая, что оптимизация обвязки — это измеримый и важный навык для автоматического улучшения AI-систем.'}, 'en': {'title': 'Harness Optimization: Unlocking LLM Potential', 'desc': "This paper discusses the importance of optimizing the 'harness' around large language models (LLMs) to enhance their performance in agentic systems. The authors introduce HarnessOpt-Bench, a benchmark designed to evaluate how well LLMs can improve their harnesses through automated optimization. The study evaluates five advanced LLMs as optimizers, revealing that their performance can vary significantly depending on the tasks and the initial harnesses used. The findings highlight the need for a standardized approach to measure harness optimization capabilities in AI systems."}, 'zh': {'title': '优化环境，提升AI能力！', 'desc': '随着大型语言模型（LLMs）在智能系统中的应用越来越广泛，它们的能力不仅依赖于模型权重，还依赖于周围的环境，包括提示、工具、控制流程、记忆和协调代码。因此，自动化的环境优化，即通过AI系统对环境进行迭代和评估指导的改进，成为提升AI系统的重要途径。我们提出了HarnessOpt-Bench，这是一个用于在高成本和随机评估下进行端到端环境优化的基准测试。实验结果表明，优化模型的表现与其所使用的编码环境有显著区别，原生环境并不总是优于共享环境，且不同任务和种子条件下的提升幅度差异很大。'}}}, {'id': 'https://huggingface.co/papers/2608.06374', 'title': 'DyPES-VLA: Learning Shared Dynamics Priors and Embodiment-Specific Control for Cross-Embodiment Manipulation', 'url': 'https://huggingface.co/papers/2608.06374', 'abstract': "Abstract  Vision-Language-Action (VLA) models have become a powerful paradigm for robot manipulation, but training a single generalist policy for heterogeneous robot embodiments remains an open problem. Existing methods have two main limitations. First, they underuse dynamics priors shared across diverse visual and interaction data, limiting cross-embodiment transfer. Second, they require extensive manual preprocessing to convert embodiment-specific actions into a common format. To overcome these limitations, we propose DyPES-VLA, a cross-embodiment VLA that learns shared Dynamics Priors and Embodiment-Specific control. First, we learn shared dynamics priors by training the vision-language model (VLM) with a future-prediction objective on cross-embodiment data, driving the shared query representation to capture object motion, contact, and interaction-induced scene changes. Second, an embodiment-specific Mixture-of-Experts (MoE) action head translates these shared dynamics priors into executable controls directly in each embodiment's native action space, without manually pre-aligning heterogeneous actions into a common format. This head shares attention layers to capture common temporal action structures, while its embodiment-specific feed-forward experts resolve the unique kinematic constraints and control semantics of distinct embodiments. As a generalist policy, our \\ourmethod achieves state-of-the-art performance across simulation and real-world evaluations, reaching 98.0% success on LIBERO, 59.25% on RoboCasa-GR1, and 89.02% on RoboTwin~2.0.", 'score': 0, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '886fba2835e43b01', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#robotics', '#architecture', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единая политика управления для разных роботов через общие приоритеты динамики', 'desc': 'Работа представляет DyPES-VLA — модель Vision-Language-Action для управления роботами-манипуляторами, которая способна работать с несколькими различными типами роботических систем. Основная идея заключается в обучении общих приоритетов динамики на основе данных с разных роботов, используя задачу предсказания будущих состояний сцены через vision-language модель. Авторы предлагают специализированный Mixture-of-Experts головной модуль действий, который переводит эти общие приоритеты динамики в команды управления для каждого типа робота напрямую, без необходимости ручного приведения действий к единому формату. Подход достигает лучших результатов на нескольких бенчмарках, включая симуляции и реальные робототехнические системы.'}, 'en': {'title': 'Empowering Robots with Shared Dynamics for Versatile Manipulation', 'desc': 'The paper introduces DyPES-VLA, a new model designed to improve robot manipulation by addressing the challenges of training a single policy for different robot types. It leverages shared Dynamics Priors to enhance the transfer of knowledge across various embodiments, allowing for better performance in diverse scenarios. The model uses a Mixture-of-Experts (MoE) action head to convert these shared dynamics into specific actions for each robot, eliminating the need for extensive manual preprocessing. As a result, DyPES-VLA achieves impressive success rates in both simulated and real-world tasks, demonstrating its effectiveness as a generalist policy.'}, 'zh': {'title': '跨体现的智能机器人控制新方法', 'desc': '本文提出了一种新的跨体现视觉-语言-动作（VLA）模型，称为DyPES-VLA，旨在解决机器人操作中的一些关键问题。现有方法在利用共享动态先验方面存在不足，限制了不同机器人之间的迁移能力，同时需要大量手动预处理以将特定于体现的动作转换为通用格式。DyPES-VLA通过在跨体现数据上训练视觉-语言模型来学习共享动态先验，并使用特定于体现的专家混合（MoE）动作头将这些先验直接转换为可执行的控制。该模型在模拟和现实世界评估中表现出色，达到了多个基准测试的最佳性能。'}}}];

            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (2)', '#agi', '#alignment (1)', '#architecture (1)', '#audio', '#benchmark (4)', '#cv', '#data', '#dataset (2)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (5)', '#open_source', '#optimization (1)', '#plp', '#rag (1)', '#reasoning (1)', '#rl (1)', '#rlhf (1)', '#robotics (2)', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic (1)', '#training (3)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-07 02:12',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-07 02:12')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-07 02:12')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
