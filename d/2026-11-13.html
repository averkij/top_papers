    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.14815', 'title': 'BirdDreams: Joint Perspective and BEV Video Generation for a Plausible, Reactive Driving World Model', 'url': 'https://huggingface.co/papers/2611.14815', 'abstract': "Abstract  Driving world models aim to simulate how a scene unfolds under different ego actions. This requires plausible motion of surrounding vehicles as well as precise ego-trajectory control. Learning vehicle motion from perspective video alone is challenging because motion is entangled with appearance and vehicles can be occluded. Prior work therefore conditions video generation on layouts that specify vehicle motion, providing control over surrounding vehicles but requiring their future trajectories as inputs. We introduce BirdDreams, an autoregressive driving world model that jointly generates perspective video and a schematic bird's-eye-view (BEV) video, making scene layout part of the predicted future. The BEV, rendered from scene annotations for training, depicts roads and vehicles as simple shapes at a fixed metric scale, providing a top-down view of their positions and motion with reduced occlusion between vehicles. Perspective video, by contrast, retains scene details that the BEV omits, such as traffic signals and object appearance. Joint attention between two video diffusion transformers, one per stream, lets each stream inform the other during generation. The predicted BEV also provides a geometric interface for ego control: we translate and rotate its latest frame along an input ego trajectory and use the resulting frames as a soft condition that shows how the scene would appear to move if only the ego vehicle moved. At inference, BirdDreams generates both videos from a single camera image without requiring an HD map or vehicle-state inputs. On PhysicalAI-AV and nuScenes, BirdDreams follows input ego trajectories more faithfully than prior driving world models and generates more plausible ego motion without ego-action conditioning. Human evaluation shows that BirdDreams outperforms a perspective-only baseline in generating realistic surrounding-vehicle behavior.", 'score': 34, 'issue_id': 3528, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '1d376866ff5c7346', 'authors': ['Junyoung Seo', 'Jaewoo Seo', 'Seungryong Kim', 'Laura Leal-Taixé', 'Xiuming Zhang', 'Seung Wook Kim'], 'affiliations': ['KAIST', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.14815.jpg', 'data': {'categories': ['#multimodal', '#3d', '#architecture', '#video', '#diffusion'], 'emoji': '🚗', 'ru': {'title': 'Видим дорогу сверху и спереди: мир вождения, который предсказывает себя сам', 'desc': 'Статья представляет BirdDreams — авторегрессионную модель мира для вождения, которая совместно генерирует перспективное видео и схематичное видео вида сверху (BEV) с помощью двух video diffusion transformers с joint attention. BEV-поток задаёт геометрический интерфейс для управления эго-траекторией: последний кадр BEV сдвигается и поворачивается по заданной траектории, что служит мягким условием генерации. Модель работает только по одному изображению с камеры, без HD-карт и состояния автомобиля. На PhysicalAI-AV и nuScenes она точнее следует заданным траекториям и правдоподобнее моделирует поведение окружающих машин, чем предыдущие подходы.'}, 'en': {'title': 'See the road from above to drive the future more faithfully', 'desc': 'BirdDreams is an autoregressive driving world model that jointly generates a camera-view video and a bird’s-eye-view (BEV) video. The BEV represents roads and vehicles at a fixed scale, making their positions and motion easier to predict despite occlusion, while the camera view captures visual details such as traffic signals. Two video diffusion transformers use joint attention so that each view can inform the other, and the BEV also provides a soft condition for controlling the ego vehicle’s trajectory. On PhysicalAI-AV and nuScenes, BirdDreams follows requested trajectories more accurately and produces more plausible vehicle behavior than the compared models, without requiring an HD map or vehicle-state inputs.'}, 'zh': {'title': '双视角协同生成，让驾驶世界模型更懂场景与轨迹', 'desc': 'BirdDreams 是一种自回归驾驶世界模型，能够同时生成透视视频和鸟瞰图（BEV）视频，让场景布局也成为模型预测的一部分。BEV以固定的真实尺度显示道路和车辆的位置与运动，较少受到车辆遮挡的影响；透视视频则保留交通灯和物体外观等细节。模型使用两个视频扩散 Transformer，并通过联合注意力让两种视角在生成过程中相互提供信息；它还会根据输入的自车轨迹变换最新的BEV画面，作为软条件来引导自车运动。实验表明，BirdDreams无需高清地图或车辆状态输入，就能更准确地跟随指定轨迹，并生成更合理的自车运动和周围车辆行为。'}}}, {'id': 'https://huggingface.co/papers/2611.15131', 'title': 'Duo: A Reciprocal World Model for Full-Duplex Interaction', 'url': 'https://huggingface.co/papers/2611.15131', 'abstract': 'Abstract A reciprocal world model enables real-time full-duplex audiovisual interaction by jointly modeling intent and realization using autoregressive reasoning, synchronized attention, and dual rollout distillation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In this report, we introduce the Reciprocal World Model (RWM) and present Duo v1, a full-duplex world model that continuously perceives audiovisual inputs while responding to users in real time. The RWM treats intelligence and physical reality as equally fundamental to what constitutes a world. Existing world models largely focus on simulating the latter, leaving reasoning and decision-making as external controls rather than intrinsic parts of the world itself. In RWM, we identify two equally fundamental capabilities: Intent, which provides the cognition underlying world interactions, and Realization, which generates coherent audio-visual behavior. To realize this formulation, Duo v1 introduces three key technical designs: (1) Leveraging autoregressive modeling for continuous interaction reasoning and participation decisions, rather than restricting it to instruction understanding for diffusion models. (2) Constructing chunk-specific conditions and synchronize tokens across Intent and Realization on a unified timeline. Module-specific attention masks enforce causal dependencies both within and across chunks, preventing access to future inputs. (3) Mitigating distribution shift in both modules through dual rollout distillation, training on autoregressively generated Intent tokens and synthesized audiovisual histories from Realization. Both modules continuously perceive real-time audio, video, and text, enabling full-duplex interaction with spontaneous conversations and interruptions. Beyond conversation, users can share real objects, reshape virtual scenes, guide assistants, or play audiovisual games without mouse or keyboard controls. The release of Duo v1 makes our first step, with the next version coming soon. We look forward to broader exploration of this emerging field.', 'score': 24, 'issue_id': 3528, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '493a17f20b6b643f', 'pdf_title_img': 'assets/pdf/title_img/2611.15131.jpg', 'data': {'categories': ['#audio', '#agents', '#multimodal', '#interpretability', '#architecture', '#agi', '#video', '#training', '#games'], 'emoji': '🎭', 'ru': {'title': 'Модель мира, которая не только видит и слышит, но и сама решает, когда и как ответить', 'desc': 'Статья представляет Reciprocal World Model (RWM) и систему Duo v1 — full-duplex модель мира, которая непрерывно воспринимает аудио- и видеовход и отвечает пользователю в реальном времени. Авторы разделяют две равноправные способности: Intent (намерение, отвечающее за рассуждение и решения о участии через autoregressive моделирование) и Realization (генерация согласованного аудиовизуального поведения). Для синхронизации используются chunk-специфичные условия, общий timeline с synchronized tokens и module-specific attention masks, обеспечивающие причинность без доступа к будущим входам. Для борьбы со distribution shift применяется dual rollout distillation, которая обучает модули на собственных сгенерированных токенах и аудиовизуальных историях.'}, 'en': {'title': 'One model thinks, listens, and responds in real time', 'desc': 'The Reciprocal World Model (RWM) treats reasoning about what to do (Intent) and generating what happens (Realization) as equally important parts of a world model. Duo v1 uses autoregressive modeling so it can continually reason about interactions and decide when to respond. Synchronized tokens, chunk-specific conditions, and causal attention masks keep its reasoning and audiovisual outputs aligned without letting it use future information. Dual rollout distillation trains both modules on generated histories, helping the model handle real-time, full-duplex interaction, including interruptions.'}, 'zh': {'title': '让意图与行动同步，开启实时全双工交互', 'desc': '本文提出互惠世界模型（RWM），让模型把意图推理与现实中的行为生成视为同等重要的部分。其系统 Duo v1 持续接收音频、视频和文本，并能在用户说话时同步回应，实现实时全双工交互。模型通过自回归建模推理交互意图，并用统一时间线、同步标记和因果注意力机制协调意图与音视频生成，避免利用未来信息。双重 rollout 蒸馏则让训练过程贴近模型实际生成的意图和音视频历史，从而减少分布偏移。'}}}, {'id': 'https://huggingface.co/papers/2611.05984', 'title': 'On the Design of Hyper-Connections: Simplification, Stability, and Scalability', 'url': 'https://huggingface.co/papers/2611.05984', 'abstract': 'Abstract A systematic study of Hyper-Connections architectures identifies the simpler efficient design SimpleHC, which removes residual mixing and uses shared memory access to match mHC performance while adding minimal training overhead and improving stability.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Hyper-Connections (HC) architectures are increasingly adopted in frontier language models, yet their components remain insufficiently understood and introduce non-negligible training overhead. In this work, we systematically study the HC architecture to understand its components and identify simpler, more efficient designs. We find that learned read/write gating without mixing and unconstrained mixing with fixed gates form two effective interaction groups: either alone achieves performance comparable to mHC. We also identify repeated access to the expanded residual state as a major source of training overhead, even without mixing. These findings lead to SimpleHC, which simplifies the architecture by removing residual mixing and simplifies execution through shared memory access, using the resulting additive structure and shared gate inputs. Layer-specific gates share a group-entry state, enabling batched reads and deferred writes; scalar corrections exactly preserve preceding sublayer output contributions. Our analyses support both the retained residual structure and the design of shared memory access. SimpleHC incurs only 2.4% extra end-to-end training time over a vanilla residual baseline at the largest tested scale. It maintains performance comparable to mHC when scaling from 15B to 30B MoE models, exhibits smoother gradient dynamics during standard training, and remains stable under stress. We hope SimpleHC will encourage a broader pursuit of simplicity in foundation model design, making performance gains more accessible and practical at scale.', 'score': 22, 'issue_id': 3528, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '9ef94a34cd03b418', 'authors': ['Xiangdong Zhang', 'Xiaohan Qin', 'Sunan Zou', 'Tuo Dai', 'Bizhao Shi', 'Zhuo Xia', 'Yebin Yang', 'Yizhou Chen', 'Yuliang Liu', 'Yu Cheng', 'Junchi Yan'], 'affiliations': ['Dots Studio, Xiaohongshu Inc.', 'Independent Researcher', 'Nanyang Technological University', 'School of AI, Shanghai Jiao Tong University', 'School of CS, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05984.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Проще — значит быстрее и стабильнее: SimpleHC против лишней сложности', 'desc': 'Авторы систематически изучают архитектуры Hyper-Connections (HC), которые всё чаще применяют в современных LLM, и выясняют роль их компонентов. Показано, что обучаемые гейты чтения и записи без смешивания, а также неограниченное смешивание с фиксированными гейтами по отдельности дают качество, сопоставимое с mHC. Предложенная архитектура SimpleHC убирает смешивание остаточного состояния и использует общий доступ к памяти с батчевыми чтениями и отложенными записями, что снижает накладные расходы на обучение всего до 2.4%. Модель сохраняет качество при масштабировании от 15B до 30B MoE и демонстрирует более стабильную динамику градиентов.'}, 'en': {'title': 'Simpler Connections, Strong Performance', 'desc': 'This paper studies Hyper-Connections (HC) and finds that some of their components add training cost without being necessary for strong performance. It introduces SimpleHC, which removes residual mixing and uses shared memory access to reduce repeated reads and writes to the expanded residual state. SimpleHC achieves performance comparable to mHC, while adding only 2.4% training time over a standard residual architecture at the largest tested scale. It also shows smoother gradient dynamics and remains stable during training, including at larger model scales and under stress.'}, 'zh': {'title': '简化超连接：以共享内存访问实现高效稳定训练', 'desc': '本文系统研究了超连接（HC）架构，发现去掉残差混合后，采用共享内存访问仍能达到与 mHC 相近的效果。研究指出，反复读取扩展残差状态是训练开销的重要来源，因此提出 SimpleHC，以加法结构和共享门控输入简化计算。SimpleHC 通过批量读取、延迟写入和标量校正保留各子层输出的贡献，在最大测试规模下仅比普通残差结构多耗时 2.4%。它在 15B 到 30B 的 MoE 模型扩展中保持了相近性能，并呈现更平滑的梯度动态和更好的训练稳定性。'}}}, {'id': 'https://huggingface.co/papers/2611.15777', 'title': 'SO-Arena: Benchmarking the Capability Spectrum and Reliability of System One Models', 'url': 'https://huggingface.co/papers/2611.15777', 'abstract': 'Abstract SO-Arena evaluates System One models across domains and capability families, revealing that scaling and reasoning gains vary and that high overall accuracy does not ensure reliable decision-making.  Generated by deepseek-ai/DeepSeek-V4.1-Flash System One models promise fast, general-purpose decision-making without lengthy token generation. However, understanding their capability spectrum and decision reliability requires more than aggregate performance on current benchmarks. Existing evaluations often provide limited insight into the breadth of model capabilities and the reliability of their decisions. We introduce SO-Arena, a benchmark characterizing the capability spectrum and decision reliability of System One models across 11 domains and five capability families. For the capability spectrum, SO-Arena offers evidence-grounded evaluation through reliable sources and manual verification of reference labels against model-visible inputs; fine-grained capability assessment through domain-specific difficulty criteria; and realistic interactive evaluation, where models iteratively execute actions in sandboxes. Reasoning-intensive tasks further enable system one-two comparison. Beyond accuracy, SO-Arena assesses decision reliability through two complementary measures: decision stability under controlled option-set changes and missing-answer recognition when no valid option is available. Evaluations across 21 models reveal that the benefits of scaling and additional reasoning vary substantially across domains. More importantly, strong overall performance does not necessarily imply reliable decision-making: the best-performing System One model ranks only seventh in reliability. Together, these findings highlight the need to characterize capability spectrum and decision reliability as complementary dimensions, providing a systematic view of the strengths and limitations of System One models.', 'score': 15, 'issue_id': 3528, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'cf20d9a1a952a373', 'authors': ['Lichen Li', 'Ziping Dong', 'Sicheng Feng', 'Qi Li', 'Xinchao Wang'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.15777.jpg', 'data': {'categories': ['#interpretability', '#survey', '#reasoning', '#data', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Высокая точность не означает надёжность: оценивайте System One модели по-новому', 'desc': 'Статья представляет SO-Arena — бенчмарк для оценки System One моделей (быстрых LLM без длинной генерации токенов) в 11 доменах и пяти семействах способностей. Помимо точности, авторы измеряют надёжность решений: устойчивость ответов при изменении набора вариантов и распознавание ситуации, когда правильного ответа нет. Оценка 21 модели показала, что выгода от масштабирования и reasoning сильно различается по доменам. Главный вывод: высокая общая точность не гарантирует надёжность, и лучшая модель по точности занимает лишь седьмое место по надёжности.'}, 'en': {'title': 'Measure What Models Know—and Whether Their Decisions Can Be Trusted', 'desc': 'SO-Arena is a benchmark for evaluating System One models across 11 domains and five capability families. It tests model capabilities using verified reference answers, domain-specific difficulty levels, and interactive tasks, including tasks that compare System One and System Two reasoning. It also measures decision reliability by checking whether answers stay stable when options change and whether models recognize when no valid answer exists. Results from 21 models show that scaling and extra reasoning help unevenly across domains, and high accuracy does not guarantee reliable decisions.'}, 'zh': {'title': '不止看准确率：全面评估模型能力与决策可靠性', 'desc': '本文提出 SO-Arena，用于评估 System One 模型在 11 个领域和五类能力上的表现与决策可靠性。基准通过可靠来源和人工核验参考标签、按领域细分难度，以及在沙盒中进行交互式任务，提供更全面的能力评估。它还衡量模型在选项集合变化时的决策稳定性，以及在没有正确选项时识别并拒答的能力。对 21 个模型的评测显示，扩展模型规模和增加推理带来的收益因领域而异，而且总体准确率高并不代表决策可靠。'}}}, {'id': 'https://huggingface.co/papers/2611.17167', 'title': 'Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2611.17167', 'abstract': "Abstract A decision model that acts poorly can still teach reinforcement learning policies effectively by judging complete action trajectories, improving success on ALFWorld and WebShop.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decision models answer a question with a typed output, such as a choice among options with a probability for each, so one model can choose an agent's actions, evaluate actions already taken, or score every action to teach a policy with reinforcement learning. Prior work has studied them mainly as actors, judging their usefulness by how well they act. We ask whether a decision model that acts poorly can still teach well. We compare three decision models and three general LLMs as actors and judges on ALFWorld, and use JEV as a teacher on ALFWorld and WebShop. As actors, all six models are pulled away from a subgoal that must come first by an easier one. As judges that see the whole trajectory, the same models credit the steps toward that subgoal, and asking whether each action helped, rather than whether the task will succeed, separates useful from useless actions. As a teacher, JEV raises a Qwen2.5-1.5B policy over GRPO from 72.8% to 82.9% success on ALFWorld and from 56.8% to 71.4% on WebShop. These results suggest that a poor actor can still teach well, because judging an action after the episode ends reveals the consequences that acting must anticipate. Code is available at https://github.com/ZJU-REAL/decision-agents.", 'score': 12, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'a3666ba3d084cf6d', 'authors': ['Haochen Liu', 'Qianhao Zhu', 'Zixuan Wang', 'Dingming Li', 'Tongbo Chen', 'Peng Qiu', 'Yingqi Qu', 'Weiming Lu', 'Jun Xiao', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17167.jpg', 'data': {'categories': ['#agents', '#optimization', '#benchmark', '#rl', '#games'], 'emoji': '🎓', 'ru': {'title': 'Плохой актёр может стать хорошим учителем', 'desc': 'Авторы показывают, что decision-модель (LLM, выдающая типизированный выбор с вероятностями), которая плохо действует сама, может всё равно эффективно обучать reinforcement learning-политику. Модели сравнивались как actor и judge на ALFWorld, а JEV использовался как teacher для обучения Qwen2.5-1.5B с помощью GRPO. Оценка действий по всей траектории после её завершения, с вопросом «помогло ли действие», отделяет полезные шаги от бесполезных лучше, чем оценка вероятности успеха задачи. Это повышает успешность на ALFWorld с 72.8% до 82.9% и на WebShop с 56.8% до 71.4%.'}, 'en': {'title': 'A Poor Actor Can Still Be a Great Teacher', 'desc': 'The paper studies whether a decision model that performs poorly as an agent can still teach a reinforcement learning policy. Across ALFWorld and WebShop, models acting step by step often choose easy subgoals instead of necessary ones, but can judge full action trajectories more effectively. Evaluating whether each action helped, rather than predicting whether the whole task will succeed, makes the judgments more useful for learning. Training with JEV improves a Qwen2.5-1.5B policy’s success rates over GRPO on both benchmarks, showing that a weak actor can still be a strong teacher.'}, 'zh': {'title': '行动未必出色，评判也能教出更强策略', 'desc': '论文研究决策模型能否在自身行动表现不佳时，仍然有效地指导强化学习策略。实验发现，模型作为评判者查看完整行动轨迹时，能识别出有助于完成任务的步骤；询问每个动作是否有帮助，比询问最终能否成功更能区分有效与无效动作。研究者将这种评判方法用于强化学习，在 ALFWorld 和 WebShop 上都提升了策略的任务成功率。结果说明，行动能力弱的模型也可能成为好老师，因为事后评估完整轨迹能看出行动的实际后果。'}}}, {'id': 'https://huggingface.co/papers/2611.16217', 'title': 'WorldDraft: If Code Builds the World, Can Video Models Just Render It?', 'url': 'https://huggingface.co/papers/2611.16217', 'abstract': 'Abstract  Multimodal coding agents decouple 4D world construction from visual generation, repurposing video models from world generators toward generative renderers. This division of labor raises a fundamental question: if code builds the world, can video models just render it? A reliable generative renderer hinges on two complementary criteria: (i) world preservation, retaining prescribed 4D kinematics and camera paths; and (ii) visual realization, persistently binding text-specified target attributes over time. To evaluate this capability, we introduce WorldDraft, a benchmark of 432 strictly paired test cases across 48 executable 4D world families spanning six dynamic challenge categories. Under a 3 times 3 factorial design, WorldDraft orthogonally crosses draft granularity (abstract proxy to previs) and appearance alignment (neutral to conflicting) under identical dynamics. Extensive evaluations across 12 representative models reveal that: (I) world preservation and visual realization remain in stark operational tension; (II) richer draft scaffolding anchors structure but paradoxically impairs appearance fidelity; and (III) conflicting source cues trigger severe source leakage (up to 64%), exposing fragile cross-modal disentanglement. To mitigate these bottlenecks, we propose WorldDraft-Primer, a plug-and-play visual prompting strategy that consistently improves both objectives across frozen video renderers. Together, WorldDraft and WorldDraft-Primer lay a foundation for bridging programmatic 4D simulation with video generation, advancing physically grounded generative rendering.', 'score': 11, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '19ef60edbda734f9', 'authors': ['Zhiyu Hou', 'Wen-Jie Shu', 'Harold Haodong Chen', 'Weilin Ruan', 'Chenfei Liao', 'Liuzhou Zhang', 'Disen Lan', 'Xiaogang Xu', 'Qi Chen', 'Ser-Nam Lim'], 'affiliations': ['CUHK', 'FDU', 'HKUST', 'HKUST(GZ)', 'SUSTech', 'UCF', 'ZJU', 'ZODA'], 'pdf_title_img': 'assets/pdf/title_img/2611.16217.jpg', 'data': {'categories': ['#3d', '#multimodal', '#agents', '#leakage', '#video', '#diffusion', '#benchmark', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Код строит мир, видео лишь рисует его: проверяем генеративный рендеринг', 'desc': 'В статье рассматриваются мультимодальные coding agents, которые отделяют построение 4D-мира от визуальной генерации и используют video-модели как генеративные рендереры. Авторы представляют бенчмарк WorldDraft из 432 парных тестов на 48 исполняемых 4D-мирах с 3×3 факторным дизайном, варьирующим детализацию черновика и согласованность внешнего вида. Оценка 12 моделей показывает напряжение между сохранением структуры мира и визуальной реализацией, а также утечку источника при конфликтующих текстовых указаниях до 64%. Для смягчения проблем предлагается WorldDraft-Primer, plug-and-play стратегия visual prompting, улучшающая оба критерия для замороженных video-рендереров.'}, 'en': {'title': 'Build the world with code; render it faithfully with video models', 'desc': 'The paper studies video models used as renderers for worlds built by code, focusing on two goals: preserving the world’s motion and camera paths, and accurately showing attributes described in text over time. It introduces WorldDraft, a benchmark with 432 paired tests across 48 executable 4D world families, to measure both goals under different draft and appearance conditions. Tests on 12 models show that preserving structure can conflict with appearance accuracy, detailed drafts can reduce visual fidelity, and conflicting visual cues can cause models to copy unwanted source details. The authors also propose WorldDraft-Primer, a visual prompting method that improves both goals across video renderers without changing the models.'}, 'zh': {'title': '让视频模型既守住四维世界，也画对目标外观', 'desc': '这篇论文研究多模态编码智能体如何先用代码构建四维世界，再用视频模型将其渲染成画面。作者提出 WorldDraft 基准，包含 432 组严格配对的测试案例，用来评估模型能否保留世界的运动和相机路径，同时持续呈现文本指定的外观。对 12 个模型的测试发现，保留世界结构与准确生成外观之间存在明显冲突；草图提供更多结构线索虽能帮助模型保留场景，却可能降低外观准确度，互相矛盾的视觉线索还会造成严重的来源泄漏。作者进一步提出 WorldDraft-Primer 视觉提示策略，无需微调模型即可同时改善结构保留和外观生成，为结合程序化四维模拟与视频生成提供了新方法。'}}}, {'id': 'https://huggingface.co/papers/2611.16748', 'title': "PhysLoop: Harnessing LLMs' Physics Awareness for Self-Improving Video Generation Models", 'url': 'https://huggingface.co/papers/2611.16748', 'abstract': 'Abstract PhysLoop leverages large language models to guide video generation, selection, and correction, enabling physically consistent self-improvement and controllable data construction for video models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Video generation models produce visually realistic videos but still struggle with physical dynamics and causal consistency. Learning from generated videos requires fine-grained physical supervision, yet reliable quality judgments, correction pairs, and controlled variations are difficult to obtain. Large language models (LLMs) possess physical knowledge, but struggle to reliably guide video generation models in producing their training videos. We present PhysLoop, a unified harness designed to support physically grounded self-improvement in video generation models. The harness guides and constrains LLMs throughout video generation, selection, and correction, distilling their physical knowledge into physically consistent videos. The framework supports controllable training-data construction and inference-time video repair. By identifying and correcting failures, PhysLoop marks a key milestone toward recursive self-improvement (RSI) in video generation models with limited human intervention. We release 100K videos spanning diverse, realistic indoor and outdoor scenes, along with generation tools and two evaluation datasets: PhysLoop-Gen and PhysLoop-Repair. We evaluate controllable generation and localized repair on these datasets, respectively, and assess physical behavior on the external Physics-IQ Verified benchmark.', 'score': 11, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '1202ffc3feb68530', 'authors': ['Yuxuan Chen', 'Xiaojie Li', 'Hao Chen', 'Juncheng Ma', 'Kewei Zhang', 'Zhongjing Du', 'Guoqiang Wei', 'Fangfang Wang', 'Zhen Dong', 'Zhiyang Dou', 'Liming Zhao', 'Yan Zeng', 'Jianwei Zhang', 'Daquan Zhou'], 'affiliations': ['ByteDance Seed', 'Hangzhou Normal University', 'Massachusetts Institute of Technology', 'Peking University', 'University of California, Santa Barbara', 'Universität Hamburg'], 'pdf_title_img': 'assets/pdf/title_img/2611.16748.jpg', 'data': {'categories': ['#synthetic', '#agi', '#training', '#video', '#data', '#benchmark', '#dataset', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Физически правдивые видео: LLM учит модели генерации видео законам физики', 'desc': 'Статья представляет PhysLoop — унифицированный фреймворк, который использует LLM для направления генерации, отбора и исправления видео в моделях генерации видео. Фреймворк переносит физические знания LLM в процесс создания обучающих данных, помогая получать физически согласованные ролики. Система также поддерживает контролируемое построение датасетов и восстановление видео на этапе инференса, выявляя и исправляя ошибки. Авторы выпустили 100K видео, инструменты генерации и два оценочных датасета, а результаты проверены на бенчмарке Physics-IQ Verified.'}, 'en': {'title': 'Make Video Models Learn from Their Own Physical Mistakes', 'desc': 'PhysLoop uses large language models (LLMs) to guide video generation, select good results, and correct physical errors. This helps video models produce clips with more consistent physical dynamics and cause-and-effect relationships. The framework also builds controllable training data and can repair videos during inference. The authors release 100,000 videos and evaluation datasets, and test the approach on video generation, repair, and physical reasoning benchmarks.'}, 'zh': {'title': '让视频生成懂物理：生成、筛选、修正，循环进步', 'desc': '视频生成模型虽然能生成逼真的画面，但常常无法准确表现物理运动和因果关系。PhysLoop 用大语言模型指导视频的生成、筛选与修正，把模型的物理知识转化为物理规律更一致的视频。它还支持按需构建训练数据，并在推理时修复视频中局部的物理错误。研究者发布了 10 万段视频、生成工具和评测数据集，用于评估可控生成、局部修复及物理行为。'}}}, {'id': 'https://huggingface.co/papers/2611.16905', 'title': 'Factored One-sided Adam-Moment for Practical and Scalable SOAP', 'url': 'https://huggingface.co/papers/2611.16905', 'abstract': "Abstract FOAM is a lightweight SOAP variant that uses input-only preconditioning and a factored Adam-moment estimator to match strong second-order and Muon baselines in LLM pre-training while using half the optimizer state and running at Muon-class speed.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Second-order optimizers (e.g., Shampoo, SOAP) have emerged as compelling alternatives to Adam/AdamW and promise faster per-step convergence than AdamW in transformer training. However, they still remain costly in practice, and even SOAP still pays substantial optimizer-state memory and eigendecomposition overhead. We ask whether the benefits of SOAP can be retained at nearly the efficiency of AdamW. In this paper, we answer yes with a lightweight SOAP variant, Factored One-sided Adam-Moment (FOAM). The path to practical impact is twofold: first, FOAM employs input-only preconditioning, dropping the output-side Kronecker factor to reduce memory and remove one eigendecomposition. The Kronecker structure of the Hessian shows that this is exact for a diagonal output-side curvature and nearly lossless for a near-diagonal one, as we observe empirically. Second, FOAM replaces SOAP's dense rotated second moment with a factored Adam-moment estimator based on row-by-column statistics. Under the K-FAC Fisher assumption with a diagonal output curvature, this estimator exactly recovers SOAP's dense second moment, and we measure only a 15-20% K-FAC violation, with negligible effect on the update. Our empirical results support the claim that FOAM matches strong SOAP and Muon baselines in validation loss across scales of large language model (LLM) pre-training, uses half of SOAP's optimizer state, runs at Muon-class wall-clock time, and retains robustness across a three-fold learning-rate range. The results hold from 124M to 760M parameters, demonstrating that SOAP's gains need not require SOAP's cost. Code: https://github.com/naver-ai/foam", 'score': 9, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '2397da6a75353b7e', 'pdf_title_img': 'assets/pdf/title_img/2611.16905.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Преимущества SOAP без его высокой цены', 'desc': 'В статье представлен FOAM — облегчённый вариант оптимизатора SOAP для обучения больших языковых моделей (LLM). Метод использует предобуславливание только по входам (input-only preconditioning), что убирает один фактор Кронекера и одну эйгендекомпозицию, а также заменяет плотный вращённый второй момент факторизованной оценкой на основе статистик по строкам и столбцам. Эмпирически FOAM сопоставим по validation loss с SOAP и Muon на моделях от 124M до 760M параметров, при этом использует вдвое меньше состояния оптимизатора. Таким образом, преимущества методов второго порядка достигаются при скорости, близкой к AdamW.'}, 'en': {'title': 'SOAP’s gains, with less cost', 'desc': 'FOAM is a lightweight optimizer designed to keep SOAP’s training benefits while reducing its cost. It uses input-only preconditioning, which removes one Kronecker factor and its eigendecomposition. It also estimates the second moment using compact row-and-column statistics instead of a dense matrix. In LLM pre-training experiments, FOAM matches SOAP and Muon in validation loss, uses half SOAP’s optimizer memory, and runs at about Muon’s speed.'}, 'zh': {'title': '保留 SOAP 的效果，减半优化器状态', 'desc': 'FOAM 是一种轻量级的 SOAP 优化器变体，旨在降低大语言模型预训练中的计算和内存开销。它只使用输入侧预条件，从而省去输出侧的矩阵分解，并用基于行列统计的因子化 Adam 二阶矩估计替代稠密估计。在特定的曲率与 K-FAC 假设下，这种估计可以准确还原 SOAP 的二阶矩；实验中假设偏差对更新影响很小。对于 1.24 亿到 7.6 亿参数的模型，FOAM 的验证损失可媲美 SOAP 和 Muon，同时只需 SOAP 一半的优化器状态，并达到接近 Muon 的运行速度。'}}}, {'id': 'https://huggingface.co/papers/2611.17060', 'title': 'Ropedia Xperience 2: A Gold Standard for Scaling Physical AI Environments and Behaviors', 'url': 'https://huggingface.co/papers/2611.17060', 'abstract': 'Abstract  Large foundation models such as GPT-6 Astra and Claude Fable 5.1 have recently been shown to control robots directly from visual observations. They nevertheless remain brittle on long-horizon, contact-rich tasks in real-world environments. Further progress depends on two complementary resources: demonstrations of human behavior that supervise how tasks are performed, and interactive environments in which policies can be rolled out, evaluated, and improved in closed loop. Language models have advanced along well-characterized scaling laws; the corresponding question for physical AI is how capability scales with environments and behaviors, which first requires identifying which data to scale and how to produce and reuse such data continuously. To address this question, we introduce Ropedia Xperience 2, comprising 1,589 released metric-scale 3D scans and a collection of 4,230 egocentric recordings of 74 tasks (131 hours). We further show that each capture can be repurposed for robot learning: scenes are converted into physically interactive simulation environments, human motion is retargeted to whole-body robot trajectories, and additional robot behaviors are obtained through virtual teleoperation and automated long-horizon trajectory generation. We propose this joint capture of environments and behaviors as a gold standard for physical AI data collection, laying a data foundation for establishing scaling laws over environments and behaviors.', 'score': 8, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'c352c02aa956a9e7', 'authors': ['Hao Li', 'Fangzhou Hong', 'Zhaoxi Chen', 'Hui En Pang', 'Kairui Hu', 'Mingze Sun', 'Runmao Yao', 'Xinhao Ji', 'Xiyuan Zheng', 'Xuanli Chen', 'Yalun Dai', 'Yap Kim Hui', 'Dingwen Zhang', 'Yuanyuan Gao', 'Ziang Cao', 'Cheng Huang Yean', 'Jackson Peng', 'Rui Duan', 'Yaobo Liu', 'Zetong Wang', 'Ziwei Liu'], 'affiliations': ['Ropedia'], 'pdf_title_img': 'assets/pdf/title_img/2611.17060.jpg', 'data': {'categories': ['#multimodal', '#3d', '#synthetic', '#data', '#robotics', '#dataset', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Масштабировать физический AI можно только через совместный сбор сред и поведений', 'desc': 'Статья описывает набор данных Ropedia Xperience 2, включающий 1589 3D-сканов сцен в метрическом масштабе и 4230 эгоцентричных записей 74 задач общей длительностью 131 час. Авторы показывают, что каждая запись можно использовать для обучения роботов: сцены превращаются в физически интерактивные симуляционные среды, движения человека переносятся на траектории всего тела робота, а дополнительные поведения генерируются через виртуальную телеоперацию и автоматическую генерацию длинных траекторий. Предлагается совместный сбор данных об окружении и поведении как эталон для Physical AI. Это создаёт основу для изучения скейлинг-законов по средам и поведениям, аналогичных тем, что уже описаны для LLM.'}, 'en': {'title': 'Scale Robot Learning by Capturing Worlds and Behaviors Together', 'desc': 'The paper introduces Ropedia Xperience 2, a dataset for training physical AI systems that control robots. It includes 1,589 metric-scale 3D scans and 4,230 egocentric recordings covering 74 tasks. The captured scenes are converted into interactive simulations, while human motions are retargeted to robot trajectories and expanded with virtual teleoperation and automated generation. By collecting environments and behaviors together, the dataset supports research into how robot capabilities scale with training data.'}, 'zh': {'title': '环境与行为同步扩展，推动物理 AI 持续进化', 'desc': '本文介绍 Ropedia Xperience 2，一个面向具身智能研究的数据集，包含 1,589 个真实尺度的三维场景扫描，以及 74 类任务的 4,230 段第一人称视频，总时长 131 小时。研究将采集到的场景转换为可交互的物理仿真环境，并把人的动作重定向为机器人全身运动轨迹。研究还通过虚拟遥操作和自动生成长时程轨迹，扩充可用于机器人学习的行为数据。作者提出同时采集环境与行为作为物理 AI 数据建设的标准，为研究模型能力如何随环境和行为数据规模增长奠定基础。'}}}, {'id': 'https://huggingface.co/papers/2611.13004', 'title': 'G-STAR: Group-Scaled Token Capacity for Deeply Compressed Autoregressive Generation', 'url': 'https://huggingface.co/papers/2611.13004', 'abstract': 'Abstract  Discrete autoregressive models offer a scalable framework for image generation. However, they face a fundamental trade-off: long token sequences preserve representation quality but slow generation, while aggressive spatial compression reduces representation capacity. Based on product quantization, we show that, under a fixed nominal information budget, group size should scale quadratically with the per-axis spatial compression factor. Building on this principle, we propose GSTAR, a spatial--group co-scaling framework that enables \\(32\\times\\) and even effective \\(64\\times\\) compression while preserving strong reconstruction, understanding, and generation performance. Since larger groups introduce intra-group dependencies that must be modeled efficiently, we analyze their impact on inference latency and generation quality and introduce a semi-autoregressive decoder that combines parallel feature computation with lightweight causal modeling. With these designs, our highly compressed models perform competitively with leading models across five representative text-to-image benchmarks (GenEval, DPG-Bench, PRISM, LongText-Bench, and Qwen-Image-Bench). At \\(1024\\times1024\\) resolution, our model delivers a \\(20\\times\\) speedup over prior discrete autoregressive models, generating each image in 2.5 seconds on a single NVIDIA H200. Together, these results show that highly compressed discrete representations can enable high-quality autoregressive generation at low latency.', 'score': 8, 'issue_id': 3528, 'pub_date': '2026-11-08', 'pub_date_card': {'ru': '8 ноября', 'en': 'November 8', 'zh': '11月8日'}, 'hash': 'da0fdd01e67f6541', 'authors': ['Xu Huang', 'Ye Huang', 'Xiaotong Li', 'Zhengrong Yue', 'Jialv Zou', 'Minhao Jing', 'Haodong Li', 'Wenhao Yan', 'Yaxin Luo', 'Duomin Wang', 'Daquan Zhou'], 'affiliations': ['Huazhong University of Science and Technology', 'MBZUAI', 'Meituan Longcat', 'Peking University', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.13004.jpg', 'data': {'categories': ['#inference', '#multimodal', '#architecture', '#cv', '#benchmark'], 'emoji': '🚀', 'ru': {'title': 'Сильное сжатие — быстрая и качественная генерация изображений', 'desc': 'В статье предлагается GSTAR — фреймворк для дискретных авторегрессионных моделей генерации изображений, основанный на product quantization. Авторы показывают, что при фиксированном информационном бюджете размер группы должен масштабироваться квадратично по коэффициенту пространственного сжатия, что позволяет достичь сжатия 32× и 64×. Для моделирования внутригрупповых зависимостей вводится полуавторегрессионный декодер, сочетающий параллельное вычисление признаков с лёгким каузальным моделированием. Модель конкурирует с ведущими LLM и AI-моделями на пяти text-to-image бенчмарках и генерирует изображение 1024×1024 за 2.5 секунды на NVIDIA H200, что в 20 раз быстрее прежних дискретных авторегрессионных моделей.'}, 'en': {'title': 'Compress More, Generate Faster', 'desc': 'The paper introduces GSTAR, a discrete autoregressive image-generation framework that jointly scales spatial compression and product-quantization group size. This design enables strong image reconstruction, understanding, and generation even when representations are compressed by 32× or effectively 64×. To handle dependencies among tokens within larger groups, GSTAR uses a semi-autoregressive decoder that computes features in parallel while modeling dependencies with a lightweight causal process. On five text-to-image benchmarks, it performs competitively with leading models and generates 1024×1024 images in 2.5 seconds on one NVIDIA H200, a 20× speedup over earlier discrete autoregressive models.'}, 'zh': {'title': '空间压缩与分组协同，让高质量自回归图像生成更快', 'desc': '离散自回归模型可以逐步生成图像，但生成速度与图像表示能力之间存在取舍：序列太长会变慢，空间压缩太强则可能损失信息。本文基于乘积量化提出 GSTAR，指出在名义信息预算固定时，分组大小应随每个空间维度的压缩倍数的平方增长，并据此联合调整空间压缩与分组。针对大分组带来的组内依赖，作者设计半自回归解码器，将并行特征计算与轻量因果建模结合，在保持重建、理解和生成质量的同时提高推理效率。实验显示，模型在五个文生图基准上表现有竞争力，并能以单张 NVIDIA H200 在 2.5 秒内生成 1024×1024 图像，速度比此前离散自回归模型快 20 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.16517', 'title': 'UniSpark: Exploring Hybrid Attention for Multimodal Understanding and Generation', 'url': 'https://huggingface.co/papers/2611.16517', 'abstract': 'Abstract  We present UniSpark-9B, a unified multimodal model that investigates hybrid attention for visual understanding and generation. Built on a Mixture-of-Transformer-Experts backbone with approximately 9B parameters in each branch, UniSpark combines full attention for explicit token interactions with GatedDeltaNet linear attention for compact context propagation. Autoregressive text prediction and visual flow matching jointly support visual question answering, text-to-image generation, instruction-guided editing, and interleaved text-image prediction. In interleaved generation, noisy visual targets are isolated from subsequent predictions, while clean visual representations provide context for later outputs. A blockwise protocol enforces this distinction through attention masks in full-attention layers and recurrent-state retention rules in linear-attention layers. The selected training sources contain 159.7M generation samples, 213.4M understanding samples, and 624.8K interleaved sequences. A four-stage curriculum jointly trains multimodal understanding and visual generation, refining answer accuracy and instruction following while extending image synthesis to 2K. UniSpark scores 2470.3 on MME-S and 0.83 on GenEval. Qualitative examples further illustrate its capabilities in interleaved image generation, video synthesis, and video editing. Together, these results demonstrate that hybrid attention provides an effective backbone for unified multimodal understanding and generation.', 'score': 7, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '4e13dbfb877ef42a', 'pdf_title_img': 'assets/pdf/title_img/2611.16517.jpg', 'data': {'categories': ['#multimodal', '#architecture', '#synthetic', '#cv', '#training', '#video', '#diffusion', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Гибридное внимание объединяет понимание и генерацию изображений', 'desc': 'В статье представлена UniSpark-9B, унифицированная мультимодальная модель, которая совмещает визуальное понимание и генерацию изображений на основе гибридного внимания. Архитектура Mixture-of-Transformer-Experts с полным вниманием (full attention) и линейным вниманием GatedDeltaNet объединяет точные взаимодействия токенов с компактным распространением контекста. Модель обучается совместно: авторегрессионное предсказание текста и visual flow matching поддерживают VQA, text-to-image генерацию, редактирование по инструкции и interleaved предсказание текста и изображений. Четырёхэтапный curriculum learning на сотнях миллионов примеров даёт результаты 2470.3 на MME-S и 0.83 на GenEval, что подтверждает эффективность гибридного внимания как основы для унифицированных мультимодальных моделей.'}, 'en': {'title': 'One hybrid-attention model for seeing, creating, and editing', 'desc': 'UniSpark-9B is a multimodal model that combines full attention with GatedDeltaNet linear attention to understand and generate visual content. Its mixture-of-experts backbone is trained to answer visual questions, create and edit images from instructions, and predict sequences that mix text and images. A blockwise protocol prevents noisy image targets from influencing later predictions, while allowing clean image representations to provide useful context. Training on a four-stage curriculum yields strong benchmark results and supports image generation up to 2K resolution, as well as video synthesis and editing.'}, 'zh': {'title': '混合注意力，让多模态理解与生成融为一体', 'desc': '论文提出 UniSpark-9B，一个统一的多模态模型，可同时理解视觉内容并生成图像。它采用混合注意力架构，将全注意力与 GatedDeltaNet 线性注意力结合，并以专家混合 Transformer 为基础。模型通过联合训练文本预测和视觉流匹配，支持视觉问答、文生图、指令编辑，以及文字与图像交错生成。实验结果显示，这种架构能有效支持多模态理解与生成，并在图像生成和视觉问答基准上取得良好表现。'}}}, {'id': 'https://huggingface.co/papers/2610.41453', 'title': 'Evidence-Guided Recovery for AI Agents with Ambiguous Tool Outcomes and Partial Execution', 'url': 'https://huggingface.co/papers/2610.41453', 'abstract': 'Abstract  Tool timeouts can leave AI agents facing ambiguous tool outcomes and partial execution: an action may have failed, committed or remained in flight while other workflow steps have already completed. We formulate evidence-guided task recovery over approved obligations, provider capabilities and states compatible with public evidence. A shared admissibility check handles key expiry, authorization timing, dependencies and residual effects; a terminal certificate separates actual goal satisfaction from publicly supported safe completion. The known-model implementation combines standard observation-contingent planning with a separately implemented effect-history adjudicator. In a finite study of 37 assignments, planning and three active controls each certify 28 completions; four saved synthetic fee units incur additional computation. A preregistered assignment-held-out comparison then evaluates planning advice against evidence prompting with two local model bundles. Across 58 paired units in 19 previously developed task families, advice certifies 30 completions versus 9, a 36.2-percentage-point difference (exact family sign-flip p=0.0078), using 272 proposals versus 399. All 116 trajectories pass independent replay. Both models exhibit a positive completion difference. The comparison measures the evaluated advice interface under a common shield; search-versus-rule advice requires a separate matched comparison. Unknown and handoff outcomes remain explicit, with guarantees tied to the declared provider capabilities rather than arbitrary third-party exactly-once execution.', 'score': 2, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '9af71733457c383a', 'authors': ['Genliang Zhu', 'Xiaobo Chen', 'Ziyuan Wang', 'Chu Wang'], 'affiliations': ['Accentrust', 'Duke University', 'Georgia Institute of Technology', 'University of Illinois Urbana-Champaign', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2610.41453.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#agents', '#benchmark'], 'emoji': '🛠️', 'ru': {'title': 'Восстановление агента после сбоя: доказуемое завершение вместо догадок', 'desc': 'Статья посвящена тому, как AI-агенты должны восстанавливаться после таймаутов инструментов, когда результат действия неизвестен, а часть шагов уже выполнена. Авторы формализуют восстановление задач как планирование с учётом наблюдений и проверяют допустимость действий (срок действия ключей, авторизация, зависимости, остаточные эффекты). В эксперименте планирование с советами (advice) на 58 парных задачах сертифицирует 30 завершений против 9 у подсказок на основе доказательств, при этом использует меньше предложений (272 против 399). Все траектории проходят независимую проверку, а гарантии опираются на заявленные возможности провайдера, а не на произвольное exactly-once выполнение.'}, 'en': {'title': 'When Tools Time Out, Plan from Evidence', 'desc': 'The paper studies how AI agents can safely recover when a tool times out and it is unclear whether an action failed, succeeded, or is still running. It uses evidence-guided planning to choose actions that meet approved obligations while accounting for permissions, dependencies, and possible side effects. In tests, planning advice certified more task completions than evidence prompts, with every tested trajectory passing an independent replay check. Its guarantees depend on stated provider capabilities, and uncertain outcomes remain explicit rather than being treated as success or failure.'}, 'zh': {'title': '超时之后，依据证据安全恢复任务', 'desc': '论文研究工具超时后 AI 智能体如何安全恢复任务，因为操作可能已经失败、成功提交，或仍在执行。方法根据已批准的任务要求、工具能力和公开证据，判断哪些后续操作仍然允许，并区分目标确已完成与仅能安全确认的情况。在 58 组配对测试中，规划建议完成并认证了 30 项任务，证据提示完成了 9 项；所有执行轨迹都通过独立复核。研究也明确保留结果未知和需要交接处理的情况，且安全保证仅适用于预先声明的工具能力。'}}}, {'id': 'https://huggingface.co/papers/2611.00428', 'title': 'Do Multimodal Models Decide Consistently on Equivalent Optical Spectra?', 'url': 'https://huggingface.co/papers/2611.00428', 'abstract': 'Abstract  A spectrum can be given to a model as a table in nanometers or as a plot in photon energy, and the decision should not depend on which one it sees. When the data needed for an answer are missing, the model should say so. We test representation invariance and abstention on measured optical spectra of silicon metasurfaces (MOCLIP) and gold nanoparticles, with labels computed from the data. Each spectrum is shown as four tables (nm, μm, scientific notation, eV) and two plots (nm, eV), and partial spectra remove data inside or outside the queried range. We evaluate the decision models d3-nano and Jev 1.13, three GPT-6 Luna configurations and the Qwen3.5-2B base model. Changing only the representation moves accuracy by up to 41 percentage points within one model, mostly on photon-energy tables and plots. With the same evidence, asking in photon energy instead of wavelength helps some model-view pairs by 16-50 points and hurts others by up to 25. When the relevant extremum is removed, unadapted models rarely answer "undetermined". LoRA fine-tuning of d3-nano improves comparisons on the trained table formats, but much of its gain on unanswerable questions comes from a shortcut: it abstains whenever the input is truncated. Training with answerable truncations avoids the shortcut in all six seeds, with a 90-100 point gap between abstention after inside and outside cuts on held-out structures; with the same amount of extra original-task data, five of six seeds keep the shortcut. On gold spectra the two training sets perform similarly. Multimodal language models used for scientific decisions should be tested on equivalent representations and on missing evidence, not only on average accuracy. We release the tasks, per-response results and analysis code.', 'score': 1, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '6ddd74050d7120d1', 'authors': ['Ziyuan Wang', 'Genliang Zhu', 'Xiaobo Chen'], 'affiliations': ['Georgia Institute of Technology', 'Independent Researcher', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2611.00428.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#interpretability', '#science', '#cv', '#training', '#hallucinations', '#benchmark', '#dataset', '#alignment'], 'emoji': '🔬', 'ru': {'title': 'Модель должна давать одинаковый ответ на одни и те же данные и честно говорить, когда данных не хватает', 'desc': 'Статья исследует, как языковые модели (LLM) принимают научные решения по оптическим спектрам, которые можно подавать в разных представлениях: таблицах и графиках в нанометрах или электронвольтах. Авторы показывают, что точность сильно зависит от формата данных, хотя смысл вопроса не меняется, а модели редко признают, что данных недостаточно. Дообучение с помощью LoRA помогает, но модель нередко учится «шорткату» и отказывается отвечать при любом обрезании спектра, поэтому нужны обучающие примеры с отвечаемыми обрезками. Вывод: мультимодальные LLM для научных задач нужно проверять на эквивалентных представлениях и на нехватке данных, а не только по средней точности.'}, 'en': {'title': 'Same Spectrum, Same Decision—And Abstain When Evidence Is Missing', 'desc': 'This paper tests whether machine-learning models make consistent decisions when the same optical spectrum is presented in different formats, such as wavelength tables, photon-energy tables, or plots. Across several models, changing only the representation can shift accuracy substantially, and the effect varies by model and format. When data needed to answer a question are missing, most unadapted models rarely abstain; LoRA fine-tuning can improve abstention, but training only on unanswerable truncated spectra encourages the shortcut of abstaining whenever input is truncated. The results show that scientific models should be evaluated for both representation invariance and reliable abstention when evidence is missing.'}, 'zh': {'title': '科学模型既要看得准，也要知道何时该弃答', 'desc': '这篇论文研究模型能否在光谱以不同形式呈现时，仍做出一致的判断，并在缺少关键数据时选择弃答。研究者使用硅超表面和金纳米颗粒的实测光谱，将数据表示为不同单位的表格或图，并测试多种模型。仅改变表示形式，就会使同一模型的准确率最多相差41个百分点；当决定答案所需的极值被删去时，未经适配的模型也很少回答“无法确定”。LoRA微调可以改善部分任务，但若训练数据设计不当，模型可能学会看到截断输入就一律弃答，因此科学决策模型应同时接受等价表示和证据缺失测试。'}}}, {'id': 'https://huggingface.co/papers/2611.00359', 'title': 'Humanized but Still True? Auditing Facts and Detection in AI-Text Humanizers', 'url': 'https://huggingface.co/papers/2611.00359', 'abstract': 'Abstract  AI "humanizers" rewrite machine-generated text so that detectors classify it as human-written. Public leaderboards score evasion and embedding similarity, but not whether checkable details survive. We check whether numbers, dates, person and organization names, and quoted spans survive each rewrite, using a rule-based checker validated by two AI annotators (precision 0.84-1.00, recall 0.93-0.95; no human annotation). In the October 2026 cycle of a public humanizer leaderboard, all 11 commercial tools changed or dropped at least one of these units in 35-65% of the documents that contained one. Most changes were to quoted spans; counting numbers and names alone, 10 of the 11 tools still altered at least one in 20% or more of the documents. The September 2026 cycle was similar (19-50%). An open 12B humanizer kept at least 97% of numbers and names in fact-dense U.S. federal agency text, but reworded 67-78% of the quoted spans, against its own prompt. Unit retention and detector evasion were not clearly related across tools (Spearman rho = -0.46, 95% CI -0.65 to 0.08), and the open model\'s four released files (two of them quantization-aware low-bit files) did not show the pre-registered monotone trade-off. On federal texts with matched human, AI-styled and humanized versions, a general-purpose decision model, Jev, asked a single zero-shot question, separated human originals from humanized rewrites with AUROC 0.864 (0.827-0.902), 0.18-0.22 higher than Binoculars, Fast-DetectGPT and the adversarially trained RADAR, while calling 24% of the human originals AI at a 0.5 threshold. On the AI-styled rewrites by 2026 models, both perplexity-based detectors scored below chance (AUROC 0.37 and 0.39), also with line breaks removed. Hypotheses, data rules and analyses were frozen before the main runs; two earlier data contacts are disclosed. We release the checker and the per-item results.', 'score': 1, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'd5f64e0c0496ea71', 'authors': ['Ziyuan Wang', 'Genliang Zhu', 'Xiaobo Chen'], 'affiliations': ['Georgia Institute of Technology', 'Independent Researcher', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2611.00359.jpg', 'data': {'categories': ['#ethics', '#benchmark', '#security', '#data', '#hallucinations'], 'emoji': '🔍', 'ru': {'title': 'Гуманизаторы текста ломают факты быстрее, чем их ловят детекторы', 'desc': 'Статья исследует, сохраняют ли AI-«гуманизаторы» текста проверяемые детали — числа, даты, имена людей и организаций, цитаты — при переписывании машинно-сгенерированных текстов. Авторы используют rule-based checker, проверенный двумя LLM-аннотаторами, и показывают, что большинство коммерческих инструментов искажает хотя бы одну такую деталь в значительной доле документов. Отдельно сравниваются детекторы AI-текста: модель Jev с zero-shot вопросом лучше отличает человеческие тексты от переписанных, чем Binoculars, Fast-DetectGPT и RADAR, а перплексийные детекторы на текстах моделей 2026 года работают хуже случайного угадывания. Авторы также подчёркивают строгую предрегистрацию гипотез и публикуют чекер и результаты по каждому примеру.'}, 'en': {'title': 'Humanizing Text Shouldn’t Rewrite the Facts', 'desc': 'This study tests whether AI humanizers preserve verifiable details, including numbers, dates, names, and quotations, while rewriting text to evade AI detectors. Across leaderboard tools, many documents lost or changed at least one such detail, and keeping details intact did not clearly predict detector evasion. A general-purpose model identified humanized rewrites better than several specialized detectors, although it also mislabeled some human writing as AI-generated. Perplexity-based detectors performed worse than chance on AI-styled text, and the researchers release their checker and item-level results.'}, 'zh': {'title': '改写可以藏过检测，却未必保得住事实', 'desc': '本文评估 AI“人类化工具”改写文本时，是否会保留数字、日期、人名、机构名和引文等可核查内容。研究发现，所有 11 种商业工具都会在不少文本中改动或删除这些信息，尤其常改写引文；保留信息的能力与绕过 AI 检测器的效果没有明确关联。一个通用决策模型能较好地区分人类原文与人类化文本，但也会把一部分人类原文误判为 AI 所写；两种基于困惑度的检测器在新模型生成的 AI 风格文本上表现低于随机猜测。作者公开了检测工具和逐项结果，并说明研究方案与分析在主要实验前已预先确定。'}}}, {'id': 'https://huggingface.co/papers/2611.16321', 'title': 'From Large Language Models to Efficient System One Models via Adaptive Computation', 'url': 'https://huggingface.co/papers/2611.16321', 'abstract': 'Abstract  Transferring LLMs into System One decision models typically replaces the language modeling head with a decision head while retaining the full backbone, making every decision pay for all layers. Yet it remains unclear how much depth such decisions require. We find that decision information is concentrated in intermediate layers, with early layers building essential features and the final six layers removable without loss, while independently trained smaller models largely mimic the full model rather than developing specialized decision capabilities. These findings suggest that efficiency requires not simply smaller backbones, but shared computation across different depths. Building on this, we propose , which jointly trains a full model with prefix sub-models that share its final layers and decision head through self-distillation. A lightweight gate reads the hidden state at each exit to determine whether additional computation is needed, allowing one model to operate at multiple layers. Across seven decision benchmarks, our approach matches or outperforms independently trained models at every depth, while achieving better accuracy-efficiency trade-offs through adaptive computation.', 'score': 1, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'd87beb912e737c3a', 'authors': ['Minh-Anh Nguyen'], 'affiliations': ['Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.16321.jpg', 'data': {'categories': ['#inference', '#architecture', '#optimization', '#training', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Один кусок модели — много глубин: быстрые решения без потери точности', 'desc': 'Авторы исследуют, как превратить LLM в модель принятия решений в духе System One, заменяя языковую головку decision head, но сохраняя весь backbone. Оказалось, что информация для решений сосредоточена в средних слоях, а последние шесть слоев можно удалить без потери качества, при этом небольшие независимые модели лишь копируют полную модель. Предложенный метод совместно обучает полную модель и префиксные подмодели, использующие общие последние слои и decision head, с помощью self-distillation. Лёгкий gate на каждом выходе решает, нужны ли дополнительные вычисления, и благодаря адаптивному вычислению один набор весов работает на нескольких глубинах, превосходя независимо обученные модели на семи бенчмарках.'}, 'en': {'title': 'One Model, Many Depths: Compute Only What Each Decision Needs', 'desc': 'The paper finds that decision-making information in large language models is concentrated in intermediate layers: early layers build useful features, while the final six layers can be removed without hurting performance. Smaller models trained separately mostly imitate the full model instead of learning specialized decision abilities. The proposed approach jointly trains a full model and shorter prefix models, sharing later layers and a decision head through self-distillation. A lightweight gate decides whether to use more layers, giving adaptive computation that matches or beats separately trained models across seven benchmarks with better accuracy-efficiency trade-offs.'}, 'zh': {'title': '共享计算、按需加深：让一个模型兼顾决策准确率与效率', 'desc': '将大语言模型用于快速决策时，通常会保留整个模型骨干网络，因此每次决策都要计算所有层。研究发现，决策信息主要集中在中间层：前面的层负责构建必要特征，而最后六层可以移除且不损失性能；单独训练的小模型则往往只是模仿完整模型。为提高效率，本文提出一种联合训练方法，让完整模型与多个共享末端层和决策头的前缀子模型，通过自蒸馏共同学习。模型还使用轻量门控器判断是否需要继续计算；在七个决策基准上，该方法在不同深度均达到或超过独立训练模型的表现，并通过自适应计算取得更好的准确率与效率平衡。'}}}, {'id': 'https://huggingface.co/papers/2611.08219', 'title': 'Agent-R^2: Scaling Agents for Realistic Productivity Work via Real-Source Data Synthesis', 'url': 'https://huggingface.co/papers/2611.08219', 'abstract': 'Abstract A real-source data synthesis framework trains a 4B agent on 4k task instances with supervised fine-tuning and rubric-based reinforcement learning, improving realistic productivity work and file-grounded reasoning over larger models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models have made rapid progress in agentic reasoning and tool use, raising expectations for agents that can take over realistic productivity work from humans. However, current agents still struggle to finish such tasks, where success requires following long-horizon professional workflows, understanding heterogeneous file contexts, and producing usable deliverables under fine-grained requirements. A key bottleneck is the lack of scalable post-training data that reflects real work intent, authentic file environments, and deliverable-level evaluation. To close this gap, we introduce Agent-R^2, a real-source data synthesis framework that scales training data for realistic productivity work. Instead of relying on manually specified workflows or LLM-generated files, Agent-R^2 grounds synthesis throughout the pipeline in real occupational seeds, corpus-derived workflow evidence, and authentic web-sourced files. From 10k web-corpus candidates, Agent-R^2 distills 4k task instances that pair real multi-format attachments with fine-grained, deliverable-level rubrics. On this data, we train Agent-R^2-4B via supervised fine-tuning and rubric-based reinforcement learning, improving both end-to-end productivity performance and file-grounded reasoning. Trained on only 4k instances, Agent-R^2-4B surpasses Qwen3-235B-A22B-Thinking-2507 on both GDPval (51.0% vs. 48.0%) and OfficeQA (14.8% vs. 13.8%). Further analysis shows that Agent-R^2 mitigates shortcut behavior, where agents produce superficially plausible deliverables before sufficiently grounding, constructing, or verifying them, while promoting sustained exploration.', 'score': 0, 'issue_id': 3528, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'e91211f6df4b8455', 'authors': ['Teng Pan', 'Zixuan Wang', 'Yuchen Yan', 'Qifei Wu', 'Yao Chen', 'Yingqi Qu', 'Ruiqing Zhang', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.08219.jpg', 'data': {'categories': ['#small_models', '#agents', '#synthetic', '#optimization', '#training', '#reasoning', '#data', '#benchmark', '#rl', '#dataset'], 'emoji': '📊', 'ru': {'title': 'Реальные данные делают маленького агента сильнее гигантов в офисной работе', 'desc': 'Статья представляет Agent-R^2 — фреймворк синтеза данных, который создаёт обучающие примеры из реальных профессиональных сценариев и веб-файлов, а не из вручную заданных workflow или файлов, сгенерированных LLM. На основе 4 тысяч задач с детальными rubric-оценками по готовым результатам обучается агент на 4B параметров через supervised fine-tuning и reinforcement learning с rubric-based наградой. Несмотря на малый размер модели и объём данных, он превосходит Qwen3-235B-A22B-Thinking-2507 на бенчмарках GDPval и OfficeQA. Анализ показывает, что такой подход уменьшает shortcut-поведение, когда агент выдаёт правдоподобный, но необоснованный результат, и поощряет более глубокое исследование файлов.'}, 'en': {'title': 'Train Smaller Agents on Real Work for Better Results', 'desc': 'Agent-R^2 creates training tasks from real workplace examples, evidence about professional workflows, and authentic files found online. It turns 10,000 candidate examples into 4,000 tasks with realistic attachments and detailed rubrics for judging finished work. Using supervised fine-tuning and rubric-based reinforcement learning, the researchers train a 4-billion-parameter agent that performs better on productivity and file-based reasoning benchmarks than a much larger model. The agent is also less likely to give a plausible-looking answer without checking its files and work, and more likely to explore and verify its results.'}, 'zh': {'title': '用真实工作数据，让小模型更会办事', 'desc': '本文提出 Agent-R^2，一种为真实办公任务构造训练数据的框架。它从真实职业需求、工作流程证据和网络文件中整理出 4,000 个任务，并为每项任务配套多种格式的真实附件和细致的交付物评分标准。研究者用监督微调和基于评分标准的强化学习训练了一个 40 亿参数模型，使其更擅长完成完整办公任务，并依据文件内容进行推理。尽管训练数据规模较小，该模型在 GDPval 和 OfficeQA 上超过了更大的模型，也更少凭表面猜测作答，而会持续查找、构建和核验结果。'}}}];

        }
