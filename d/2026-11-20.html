    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.21373', 'title': 'WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection', 'url': 'https://huggingface.co/papers/2611.21373', 'abstract': 'Abstract WeVisForensics coordinates self-evolving visual and audio forensic inspector agents under a dual-timescale reinforcement learning policy to detect generated-video artifacts with localized evidence and high accuracy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeVisForensics, an agentic framework in which a main investigator agent coordinates a self-evolving library of forensic inspector sub-agents spanning visual and audio cues. The investigator learns which artifact type to examine, over which window, and when to conclude, and these interactions provide shared feedback for both levels of agents. Our dual-timescale policy optimization strategy, DTPO, closes this loop through fast reinforcement learning of the investigator and slower refinement of the inspectors, guided by annotated artifact intervals, to report subtle artifacts they once dismissed. Furthermore, we curate ForenCue-30K, combining role-specific forensic annotations and interaction trajectories to supervise individual inspections and their coordination, with an accompanying reinforcement-learning pool. Experiments show that WeVisForensics averages 95.2% detection accuracy across in-domain, out-of-domain and agentic benchmarks, 9.0% above the strongest prior detector, while grounding its verdicts in localized evidence.', 'score': 49, 'issue_id': 3551, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '4d36ff005c6e5c36', 'authors': ['Yipeng Du', 'Yuxi Li', 'Ying Zhang', 'Chong Sun', 'Chen Li', 'Jing Lyu', 'Ying Tai'], 'affiliations': ['Nanjing University', 'WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.21373.jpg', 'data': {'categories': ['#video', '#cv', '#benchmark', '#agents', '#rl', '#audio', '#dataset', '#training', '#security'], 'emoji': '🎬', 'ru': {'title': 'Агенты-криминалисты находят следы подделки видео с точностью до интервала', 'desc': 'В статье представлен WeVisForensics — агентный фреймворк для обнаружения артефактов в сгенерированных видео, где главный агент-исследователь координирует библиотеку самообучающихся суб-агентов-инспекторов по визуальным и аудио признакам. Агент обучается с помощью reinforcement learning выбирать тип артефакта, временное окно проверки и момент завершения анализа. Двухмасштабная стратегия оптимизации DTPO сочетает быстрое обучение исследователя и медленное дообучение инспекторов на размеченных интервалах артефактов, а также вводится датасет ForenCue-30K с аннотациями и траекториями взаимодействий. Модель в среднем достигает 95.2% точности на разных бенчмарках и превосходит лучший предыдущий детектор на 9.0%, опираясь на локализованные доказательства.'}, 'en': {'title': 'A Team of Forensic Agents Finds the Clues in Generated Video', 'desc': 'WeVisForensics detects AI-generated video by coordinating agents that inspect visual and audio clues. A lead investigator chooses what to inspect, which time segment to examine, and when there is enough evidence to decide. Its dual-timescale policy optimization uses fast reinforcement learning to improve the investigator and slower refinement to improve the specialist inspectors. The system reaches 95.2% average detection accuracy and supports its decisions with evidence localized to specific video intervals.'}, 'zh': {'title': '协同进化，精准定位生成视频的伪造痕迹', 'desc': '本文提出 WeVisForensics，用多个视觉与音频取证子智能体协作检测生成视频中的伪造痕迹，并定位相关证据。主调查智能体会决定检查哪类痕迹、分析哪个时间片段，以及何时结束调查。双时间尺度策略优化（DTPO）通过强化学习快速优化调查智能体，并以较慢的方式改进取证子智能体，使两者能从调查反馈中共同进步。实验中，该方法在域内、域外和智能体基准上的平均检测准确率达到 95.2%，比最强的先前检测器高 9.0%。'}}}, {'id': 'https://huggingface.co/papers/2611.26444', 'title': 'Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation', 'url': 'https://huggingface.co/papers/2611.26444', 'abstract': 'Abstract A diagnostic benchmark of 180 simulated manipulation configurations evaluates whether embodied systems can combine history-based reasoning, precise execution, and closed-loop environmental feedback, revealing that single-view competence does not transfer to composed tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Embodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a failure comes from reasoning, execution, or their composition. We introduce Mind2Act World, a diagnostic benchmark of 30 simulated manipulation tasks from five real-world application domains. Each task has three difficulty levels and two scene settings (Clean and Random), yielding 180 configurations. The tasks form three views: Mind tests decisions based on past observations, Act tests precise and timely execution, and Mind2Act combines both in closed-loop tasks where action outcomes guide later decisions. Comparing the three views shows whether a system lacks a capability or fails to compose capabilities it already has. A diagnosis harness further attributes the failed episodes of three representative systems to Mind, Act, or their composition and summarizes each system in a profile card. Our evaluation of multimodal agents, vision-language-action models (VLAs), and world-action models (WAMs) shows that competence in a single view does not carry over to Mind2Act tasks. Even the strongest agent succeeds in 52.7% of Mind and 39.0% of Act episodes but in only 12.0% of Mind2Act episodes. The strongest agent retains task state but struggles with sustained contact, whereas end-to-end policies execute practiced motions but retain little task state. These findings point to composing reasoning and execution through environmental feedback as the main open problem.', 'score': 45, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '60a94e89fd84b06b', 'authors': ['Yuzhi Huang', 'Jie Wu', 'Fanding Huang', 'Junchao Lin', 'Weichen Zhang', 'Ziyi Xiong', 'Yang Li', 'Zhengwei Xie', 'Zhimin Wang', 'Zhen Liu', 'Jiazhen Huang', 'Yuzheng Zhang', 'Yuche Liu', 'Hongyi Yang', 'Chen Tang', 'Shixiang Tang', 'Hakan Aktas', 'Adam Wu', 'Duo Wu', 'Kangye Ji', 'Shuzhao Xie', 'Huanan Liu', 'Weijue Bu', 'Chenxin Li', 'Xinyuan Wang', 'Tianyi Bai', 'Yinan Mao', 'Jiawei Wang', 'Minglei Li', 'Heng Yu', 'Ehsan Adeli', 'Minchen Li', 'Yong-Lu Li', 'Cengiz Öztireli', 'Huazhe Xu', 'Chao Yu', 'Jing Zhang', 'Shanghang Zhang', 'Weitao Zhou', 'Wenwu Zhu', 'Cheng Chi', 'Jingyan Jiang', 'Zhi Wang'], 'affiliations': ['Baidu AI Cloud', 'Carnegie Mellon University', 'Fudan University', 'Hong Kong University of Science and Technology', 'Oxford', 'Peking University', 'Renmin University of China', 'Shanghai Jiao Tong University', 'Shenzhen University', 'Simple AI', 'Stanford University', 'The Chinese University of Hong Kong', 'Tsinghua University', 'University of Cambridge', 'University of Hong Kong', 'Velabot AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.26444.jpg', 'data': {'categories': ['#reasoning', '#multimodal', '#benchmark', '#agents', '#robotics', '#games'], 'emoji': '🤖', 'ru': {'title': 'Умение думать и действовать по отдельности — не равно умению делать это вместе', 'desc': 'В статье представлен Mind2Act World — диагностический бенчмарк из 180 конфигураций симулированных задач манипуляции, который проверяет три способности embodied AI: рассуждение на основе истории наблюдений, точное исполнение действий и их композицию через обратную связь от среды. Бенчмарк разделён на три вида задач: Mind, Act и Mind2Act, что позволяет понять, является ли сбой следствием отсутствия способности или неспособности её комбинировать. Оценка мультимодальных агентов, VLA-моделей и WAM показала, что высокие результаты в отдельных видах задач не переносятся на Mind2Act, где лучший агент успешен лишь в 12% эпизодов. Авторы делают вывод, что ключевой открытой проблемой остаётся композиция рассуждения и исполнения через feedback среды.'}, 'en': {'title': 'Reasoning and action must work together', 'desc': 'The paper introduces Mind2Act World, a benchmark for testing robots’ reasoning from past observations, precise action execution, and their ability to combine both using feedback from the environment. It includes 30 simulated manipulation tasks across five domains, tested at different difficulty levels and in clean or randomized scenes. Results show that strong performance on reasoning or execution alone does not guarantee success when both must work together: the best system succeeds on just 12% of combined tasks. The findings identify closed-loop composition of reasoning and action as a major challenge for embodied AI.'}, 'zh': {'title': '推理与执行，须在环境反馈中真正合拍', 'desc': '本文提出 Mind2Act World，一个用于评估机器人操作能力的诊断基准，包含 30 项模拟任务、三种难度和两类场景，共 180 种配置。基准从三个角度测试系统：根据历史观察进行推理（Mind）、精准及时地执行动作（Act），以及结合环境反馈交替推理与执行（Mind2Act）。实验显示，系统在单独的推理或执行任务中表现良好，并不代表它能在闭环任务中有效组合这两种能力；最强系统在 Mind2Act 任务中的成功率仅为 12%。研究指出，利用动作结果和环境反馈持续协调推理与执行，仍是具身智能面临的主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2611.26409', 'title': 'WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding', 'url': 'https://huggingface.co/papers/2611.26409', 'abstract': 'Abstract WeMM-Video is a family of Chinese-English bilingual omni-modal foundation models that unify text, image, audio, and video processing for joint audio-visual perception and reasoning, using hybrid thinking modes and large-scale training to achieve strong open-source video understanding results.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Video understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct responses and a thinking mode for explicit step-by-step reasoning. The models are trained on a large-scale multimodal corpus of approximately 1.2 trillion tokens through progressive pre-training and a multi-stage post-training pipeline incorporating multi-teacher OPD, anti-repetition MrDPO, and specialist RL. Evaluated across more than 120 benchmarks, WeMM-Video demonstrates superior performance in omni-modal video understanding and reasoning, while maintaining highly competitive capabilities across general audio, silent video, image, and text tasks. Specifically, in omni-modal video evaluations, our flagship WeMM-Video-35B-A3B establishes a new open-source state of the art, substantially outperforming proprietary models such as Qwen3.5-Omni-Flash and Seed2.0-Mini-0428 while narrowing the gap with the strong Gemini-3.0-Flash, and our compact WeMM-Video-9B surpasses the larger open-source Qwen3-Omni-30B-A3B-Instruct. We publicly release the WeMM-Video family along with our evaluation and reproduction pipeline to foster further research and development in the open-source community.', 'score': 39, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'fb6ea60b202934de', 'authors': ['Changli Tang', 'Jie Yang', 'Tianyi Wang', 'Lei Li', 'Daoze Zhang', 'Zijie Xin', 'Zhan Liu', 'Li Li', 'Jinchang Xu', 'Fengyun Rao', 'Chao Zhang', 'Jing Lyu'], 'affiliations': ['Tsinghua University', 'WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.26409.jpg', 'data': {'categories': ['#video', '#multimodal', '#benchmark', '#rl', '#rlhf', '#multilingual', '#audio', '#training', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Видео со звуком понимается лучше: открытая омни-модель, которая обгоняет проприетарные аналоги', 'desc': 'В статье представлено семейство двуязычных (китайский и английский) омни-модальных фундаментальных моделей WeMM-Video, которые объединяют обработку текста, изображений, аудио и видео для совместного аудиовизуального восприятия и рассуждений. Модели поддерживают гибридный режим мышления: быстрый прямой ответ без явных рассуждений и пошаговое рассуждение, а обучены на корпусе примерно в 1,2 триллиона токенов с помощью прогрессивного предобучения и многоэтапного post-training с multi-teacher OPD, MrDPO против повторов и специализированным RL. На более чем 120 бенчмарках флагманская модель WeMM-Video-35B-A3B задаёт новый open-source SOTA в понимании омни-модального видео, превосходя проприетарные модели, а компактная 9B-версия обходит более крупную Qwen3-Omni-30B-A3B-Instruct. Авторы публикуют модели вместе с пайплайном для оценки и воспроизведения.'}, 'en': {'title': 'One Model, Four Modalities, Stronger Video Understanding', 'desc': 'WeMM-Video is a family of Chinese-English multimodal foundation models that process text, images, audio, and video together. It offers a fast instruction mode and a thinking mode for step-by-step reasoning. Trained on about 1.2 trillion tokens and refined with several post-training methods, the models were tested on more than 120 benchmarks. The largest model achieves leading open-source results in video understanding, while the 9B model outperforms a larger open-source competitor.'}, 'zh': {'title': '让模型听懂声音、看懂视频并联合推理', 'desc': 'WeMM-Video 是一系列中英双语全模态基础模型，可联合处理文本、图像、音频和视频，重点提升音视频理解与推理能力。模型提供快速直接回答的指令模式，以及逐步推理的思考模式，并包含 2B、4B、9B 和 35B-A3B 等规模。它们使用约 1.2 万亿词元的多模态数据进行渐进式预训练和多阶段后训练，并在 120 多项基准测试中接受评估。结果显示，旗舰模型在开源全模态视频理解评测中达到领先水平，团队也公开了模型及评测复现流程。'}}}, {'id': 'https://huggingface.co/papers/2611.26590', 'title': 'Probing the "Conscious" Mind: Selective Access and Global Workspace in Vision-Language Models', 'url': 'https://huggingface.co/papers/2611.26590', 'abstract': 'Abstract  Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map intermediate states to a shared semantic space defined by the decoder\'s output vocabulary to compare concept accessibility across modalities. MC-Lens supports internal concept interventions to examine the role of accessed concepts in downstream computation. (i) Accessibility and selective access. Multimodal concept information is readable in intermediate states and selectively accessible as tasks require. We extend "readout carriers" from one name token to a token set to better capture and express concept information and support counterfactual experiments. (ii) Concepts in downstream computation. Counterfactual experiments show that accessed concept information participates in downstream computation and reasoning. (iii) Development of cross-modal alignment and selective access. We develop two J-space metrics tracking the development of cross-modal concept alignment more clearly than hidden state cosine in controlled VLM training. The experiment also shows that reliable selective access develops later than concept accessibility. (iv) Shared functions across models. Across VLM families and sizes, we find shared patterns of concept accessibility, query-dependent selectivity and cross-task intervention effects despite differences in internal organisation. These findings offer an experimental basis to study GWT in multimodal artificial systems and how it can guide cross-modal alignment improvements.', 'score': 35, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'bde6d0b45b5a033b', 'authors': ['Jiahao Huang', 'Jun Wang'], 'affiliations': ['Imperial College London, UK', 'University College London, UK'], 'pdf_title_img': 'assets/pdf/title_img/2611.26590.jpg', 'data': {'categories': ['#multimodal', '#alignment', '#architecture', '#training', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Заглядываем внутрь VLM: как мультимодальные модели выбирают и используют концепты', 'desc': 'Статья предлагает MC-Lens — мультимодальный якобиан-инструмент для анализа того, как vision-language модели (VLM) представляют концепты во внутренних состояниях. Авторы проецируют промежуточные состояния энкодера изображений и декодера языка в общее семантическое пространство, заданное словарём выходных токенов, и сравнивают доступность концептов между модальностями. Контрфактуальные интервенции показывают, что доступная информация о концептах реально участвует в вычислениях и рассуждениях модели. Работа также вводит метрики J-space для отслеживания развития кросс-модального выравнивания при обучении и демонстрирует общие закономерности у разных семейств VLM, опираясь на теорию глобального рабочего пространства (GWT).'}, 'en': {'title': 'Opening the Shared Workspace of Vision-Language Models', 'desc': 'The paper introduces the Multimodal Concept Lens (MC-Lens), a method for examining how vision-language models represent and use concepts internally. It maps visual and language states into a shared semantic space, making concepts easier to compare and intervene on. Experiments show that concepts are accessible in intermediate states, selected depending on the task, and can affect later reasoning. Cross-modal alignment and reliable selective access develop over training, and similar patterns appear across different model families.'}, 'zh': {'title': '透视多模态模型的概念工作空间', 'desc': '本文提出多模态概念透镜（MC-Lens），用雅可比透镜将视觉编码器和语言解码器的中间状态映射到共同的语义空间，从而比较不同模态中的概念表征。实验发现，概念可以从中间状态中读出，但模型会根据任务需求选择性地访问相关概念；反事实干预也表明，这些被访问的概念会参与后续计算与推理。研究还提出两种 J 空间指标，用于追踪跨模态概念对齐的发展，并发现概念可访问性先于可靠的选择性访问形成。不同架构和规模的视觉语言模型呈现出相似的概念可访问性、任务依赖选择性及干预效应，为在多模态模型中检验全局工作空间理论和改进跨模态对齐提供了实验方法。'}}}, {'id': 'https://huggingface.co/papers/2611.26595', 'title': 'Coda-DaVinci: Reimagining Video Generation with Code2Video', 'url': 'https://huggingface.co/papers/2611.26595', 'abstract': 'Abstract A task-adaptive agentic framework utilizes 3D proxies, physics simulation, and multi-agent coordination to enhance the structural control, physical plausibility, and visual realism of generated videos.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Code2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium-grained proxies favor consistency. Physics simulation and proxy-aligned prompting further improve average quality. Guided by these findings, we introduce Coda-DaVinci, a task-adaptive agentic framework for Code2Video generation that selects between proxy-guided and direct generation, adapts modeling granularity to each entity, and coordinates simulation with proxy-grounded prompting. Its multi-agent harness preserves scene assets and guides repairs through visual inspection and independent review. Experiments demonstrate leading instruction following on VTR and scene consistency on R2M, improved physical plausibility over direct generation, and higher visual realism than the compared Code2Video baselines. Long-video evaluations further show gains in event structure and consistency across successive interactions, while revealing limitations in transition stability and adherence to scene settings.', 'score': 32, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '2aedb140701ca26a', 'authors': ['Yiyan Ji', 'Qixun Wang', 'Yang Shi', 'Zhuoran Zhang', 'Yifan Xu', 'Tengfei Liu', 'Yuqi Tang', 'Xiaohan Zhang', 'Shujie Li', 'Jiafu Tang', 'Xuanyu Zhu', 'Xinyu Liu', 'Yan He', 'Yushuo Guan', 'Zihao Wang', 'Xianghua Ying', 'Shixuan Liu', 'Haotian Wang', 'Wenjing Yang', 'Zhaoxiang Zhang', 'Yuanxing Zhang', 'Pengfei Wan', 'Jiaheng Liu'], 'affiliations': ['Hong Kong University of Science and Technology', 'KlingAI Research', 'Nanjing University (Guangzhou)', 'Peking University', 'Tsinghua University', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2611.26595.jpg', 'data': {'categories': ['#3d', '#video', '#optimization', '#benchmark', '#agents', '#long_context', '#synthetic'], 'emoji': '🎬', 'ru': {'title': 'Умные 3D-прокси и адаптивные агенты делают генерацию видео физичнее и реалистичнее', 'desc': 'В статье изучается, как 3D-прокси, сгенерированные агентами, влияют на качество видео, созданного через Code2Video. Авторы показывают, что грубые прокси лучше передают естественное движение, а средние по детализации обеспечивают лучшую согласованность сцены, а физическая симуляция и промптинг, выровненный с прокси, дополнительно повышают качество. На основе этих результатов предложен фреймворк Coda-DaVinci, который мультиагентно выбирает между прокси-управляемой и прямой генерацией и адаптирует детализацию моделирования под каждую сущность. Эксперименты показывают улучшение следования инструкциям, физической правдоподобности и визуального реализма, хотя при длинных видео остаются проблемы со стабильностью переходов.'}, 'en': {'title': 'Adapt the 3D Guide to Make Better Videos', 'desc': 'This paper studies how 3D proxies, physics simulation, and prompts affect videos generated from code. Its experiments find that coarse proxies can produce more natural motion, while medium-grained proxies can improve consistency; simulation and prompts aligned with the proxies also help. The authors propose Coda-DaVinci, an agentic framework that chooses proxy-guided or direct generation and adjusts each entity’s modeling detail to the task. Tests show stronger instruction following, scene consistency, physical plausibility, and visual realism than comparison methods, though long videos can still struggle with transitions and scene settings.'}, 'zh': {'title': '因任务而变：让代理模型、物理模拟与多智能体协同生成更可信的视频', 'desc': '本文研究如何用 3D 代理模型、物理模拟和多智能体协作来提升文本生成视频的结构控制、物理合理性与视觉真实感。实验发现，粗粒度代理更适合自然运动，中等粒度代理更有利于保持一致性；物理模拟和与代理相匹配的提示词也能提升生成质量。基于这些发现，作者提出 Coda-DaVinci：它会根据任务选择代理引导或直接生成，为不同实体调整建模粒度，并协调模拟、提示词和多智能体检查修复。实验显示，该方法在指令遵循、场景一致性和物理合理性等方面优于多种基线，但长视频中的转场稳定性和场景设定遵循仍有不足。'}}}, {'id': 'https://huggingface.co/papers/2611.26629', 'title': 'Posterior Matching Distillation', 'url': 'https://huggingface.co/papers/2611.26629', 'abstract': "Abstract Posterior Matching Distillation trains a stochastic student to match a teacher diffusion model’s full posterior via tilted mean constraints, enabling high-quality few-step image generation without auxiliary score networks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Diffusion distillation accelerates image and video generation by compressing a pretrained teacher's iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student's output distribution to the teacher's. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distribution-based distillation family that combines mode-covering posterior sampling with any-step generation. At zero population loss, PMD recovers the teacher's full posterior of clean images at each trained noise level. Its stochastic student supports any-step sampling budgets within the trained timestep grid without further training. To learn these posteriors, PMD matches exponentially reweighted averages of student samples conditioned on a fixed noisy state to corresponding teacher posterior means. Under Gaussian corruption, exponentially tilted posterior mean is a single teacher evaluation at a shifted input. We prove that, matching tilted means over an open neighborhood uniquely identifies the full posterior. PMD thus supervises the entire conditional distribution through a family of mean constraints, without any auxiliary student-score network. Experiments on SDXL and FLUX.2 [klein] 4B demonstrate that PMD achieves the best FID among 4-step methods on both models, while maintaining competitive or leading performance across prompt-alignment and perceptual-quality metrics.", 'score': 31, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '75739c85754760a4', 'authors': ['Hidir Yesiltepe', 'Julius Berner', 'Arash Vahdat', 'Pinar Yanardag'], 'affiliations': ['NVIDIA', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2611.26629.jpg', 'data': {'categories': ['#diffusion', '#inference', '#cv', '#optimization', '#training'], 'emoji': '🎨', 'ru': {'title': 'Учим студента помнить всё распределение, а не только самую частую моду', 'desc': 'В статье предлагается метод Posterior Matching Distillation (PMD) для дистилляции диффузионных моделей, который обучает стохастического студента сопоставлять полное апостериорное распределение учителя через ограничения на экспоненциально взвешенные средние. В отличие от reverse-KL подходов, склонных к mode-seeking, PMD использует mode-covering сэмплирование и сохраняет разнообразие генераций. Благодаря этому студент поддерживает генерацию за любое число шагов в обученной сетке без дополнительного обучения и не требует вспомогательной score-сети. Эксперименты на SDXL и FLUX.2 [klein] 4B показывают лучший FID среди 4-шаговых методов при конкурентоспособных метриках выравнивания с промптом и перцептивного качества.'}, 'en': {'title': 'Match the Full Posterior for Better Few-Step Generation', 'desc': 'Posterior Matching Distillation (PMD) trains a stochastic student to reproduce a diffusion teacher’s full posterior distribution, rather than only its most likely outputs. It matches tilted posterior means, which under Gaussian noise can be computed using a single teacher evaluation at a shifted input. Matching these means across nearby shifts identifies the full posterior, without requiring an auxiliary student score network. Experiments show that PMD enables high-quality image generation in four steps and supports different sampling budgets without retraining.'}, 'zh': {'title': '匹配倾斜均值，蒸馏完整后验', 'desc': '扩散模型蒸馏通过减少采样步骤，让图像和视频生成更快。本文提出后验匹配蒸馏（PMD），让随机学生模型学习教师模型在不同噪声水平下的完整图像后验分布，从而避免反向 KL 散度偏向少数主要模式、损害样本多样性的问题。PMD 通过匹配学生样本的指数倾斜均值与教师的后验均值来训练；在高斯噪声条件下，教师均值只需一次模型计算，而且不需要额外的学生评分网络。实验显示，PMD 在 SDXL 和 FLUX.2 上取得了四步生成方法中最佳的 FID，并在文本对齐和感知质量方面表现出竞争力。'}}}, {'id': 'https://huggingface.co/papers/2611.21383', 'title': 'The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation', 'url': 'https://huggingface.co/papers/2611.21383', 'abstract': 'Abstract A plug-and-play objective, VODA, groups per-pixel contributors by local depth to supervise all Gaussians in selected depth clusters, improving volumetric segmentation and enabling evaluation via Removal-3D and Removal Depth Error.  Generated by deepseek-ai/DeepSeek-V4.1-Flash 3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure to group per-pixel contributors and directly supervises all Gaussians in selected depth clusters, bypassing contribution-weighted gradient delivery. To evaluate volumetric completeness, we introduce Removal-3D, a synthetic object-removal benchmark, and the Removal Depth Error (RDE), a metric comparing predicted and ground-truth depth changes. Across four rendering-based baselines, VODA consistently improves volumetric segmentation on Removal-3D while maintaining or improving performance on LERF and ScanNet. Further analysis shows that VODA recovers lower-contribution Gaussians, while simple gradient reweighting and spatial propagation fail to reproduce comparable gains.', 'score': 30, 'issue_id': 3551, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'cbc95cc339b8ae9e', 'pdf_title_img': 'assets/pdf/title_img/2611.21383.jpg', 'data': {'categories': ['#3d', '#cv', '#benchmark', '#dataset', '#training'], 'emoji': '🧊', 'ru': {'title': 'Сегментируем не только то, что видно, но и весь объём 3D-модели', 'desc': 'Статья предлагает VODA — подключаемую (plug-and-play) функцию потерь для сегментации 3D Gaussian Splatting. Метод группирует вклады пикселей по локальной глубине и напрямую контролирует все Gaussians выбранных кластеров глубины, обходя взвешивание градиентов по вкладу. Для оценки полноты объёма введены бенчмарк Removal-3D и метрика Removal Depth Error (RDE), сравнивающая предсказанные и истинные изменения глубины. Эксперименты показывают стабильное улучшение объёмной сегментации на Removal-3D без ухудшения результатов на LERF и ScanNet.'}, 'en': {'title': 'See Beyond the Render: Supervise Every Gaussian in Depth', 'desc': 'Existing 3D Gaussian Splatting segmentation methods can produce accurate rendered masks while missing Gaussians hidden behind or contributing little to the image. VODA is a plug-and-play training objective that groups pixel contributors by local depth and directly supervises all Gaussians in selected depth clusters. The authors also introduce Removal-3D, a benchmark for testing whether selected Gaussians form complete 3D objects, and Removal Depth Error, a metric based on changes in rendered depth after object removal. VODA improves volumetric segmentation over four rendering-based baselines and recovers low-contribution Gaussians, while maintaining or improving results on LERF and ScanNet.'}, 'zh': {'title': '不只分割显眼部分：用深度簇监督补全三维高斯', 'desc': '3D 高斯泼溅可以用高斯基元表示场景，但现有分割方法主要根据渲染图像训练，可能只选中显眼的高斯，而遗漏被遮挡或贡献较小的部分。论文提出 VODA，这是一种可直接加入现有方法的监督目标，它利用像素附近的深度信息将高斯贡献者分组，并监督选定深度簇中的所有高斯。为评估分割在三维空间中的完整性，论文构建了模拟物体移除的 Removal-3D 基准，并提出衡量预测与真实深度变化差异的指标 RDE。实验表明，VODA 能提升多种基线方法在 Removal-3D 上的体积级分割效果，并在 LERF 和 ScanNet 上保持或提升性能。'}}}, {'id': 'https://huggingface.co/papers/2611.26603', 'title': 'Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth', 'url': 'https://huggingface.co/papers/2611.26603', 'abstract': 'Abstract A single scalable network estimates dense metric depth for images and video at native resolution, jointly improving metric accuracy, boundary sharpness, and temporal consistency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We present Depth Pro 2, an approach to estimating dense metric depth for images and video at full resolution. By analyzing prior methods for monocular depth estimation, we find that they commonly trade off temporal consistency and boundary sharpness: multi-frame methods favor consistency, single-frame methods favor sharpness. To overcome this trade-off, we train a single, scalable network that processes both images and video and predicts depth maps at native resolution. Depth Pro 2 produces depth maps that are metrically accurate, sharp, and temporally consistent all at once, outperforming prior work in all of these dimensions. We release a family of models that define a new Pareto frontier in terms of metric accuracy, sharpness, temporal consistency, and runtime. We release code and weights at https://apple-aiml-research.github.io/ml-depth-pro-2/', 'score': 28, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '1151a1c38c880a52', 'authors': ['Peiyun Hu', 'Marko Mihajlovic', 'Lyndon Duong', 'Lahav Lipson', 'Wei Dong', 'Amaël Delaunoy', 'Stephan R. Richter', 'Vladlen Koltun'], 'affiliations': ['Apple'], 'pdf_title_img': 'assets/pdf/title_img/2611.26603.jpg', 'data': {'categories': ['#video', '#cv', '#optimization', '#architecture', '#training'], 'emoji': '🌊', 'ru': {'title': 'Точная, резкая и стабильная глубина в одной модели', 'desc': 'Авторы представляют Depth Pro 2 — модель для оценки плотной метрической глубины по изображениям и видео в исходном разрешении. Предыдущие методы монокулярной оценки глубины обычно жертвуют либо временной согласованностью (мультикадровые подходы), либо резкостью границ (однокадровые подходы). Чтобы преодолеть этот компромисс, авторы обучают единую масштабируемую нейросеть, которая обрабатывает и изображения, и видео. Результатом становятся карты глубины, одновременно точные по метрике, чёткие и согласованные во времени, а также новый Парето-фронт по качеству и скорости работы.'}, 'en': {'title': 'One network for sharp, accurate, and consistent depth', 'desc': 'Depth Pro 2 estimates dense metric depth from images and video at their original resolution. Earlier methods often trade sharp depth boundaries for consistent predictions across video frames. The authors train one scalable network to handle both images and video, aiming to achieve metric accuracy, sharp boundaries, and temporal consistency together. Their models outperform previous methods across these measures and offer different trade-offs with runtime.'}, 'zh': {'title': '一个网络，让深度预测又准又清晰又稳定', 'desc': '这篇论文提出 Depth Pro 2，用一个可扩展的网络为图像和视频估计稠密的度量深度。以往方法往往难以兼顾视频帧之间的时间一致性与深度边界的清晰度。Depth Pro 2 在原生分辨率下预测深度图，同时提升度量准确性、边界锐利度和时间一致性。研究团队还发布了多个模型版本，在准确度、清晰度、一致性和运行速度之间取得了更好的权衡。'}}}, {'id': 'https://huggingface.co/papers/2611.26380', 'title': 'EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning', 'url': 'https://huggingface.co/papers/2611.26380', 'abstract': "Abstract  Egocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer's motion. Existing caption formats also offer limited support for combining detailed narration with precise timing. We present EgoCaptioner, which pairs a video-level overview of the setting, participants, and the wearer's overall activity with timed steps whose narration adapts to varying perceptual demands and marks key moments at specific timestamps. We develop a coarse-to-fine annotation pipeline that establishes event structure before expanding step descriptions, yielding 50,000 training examples from eight egocentric video sources. Complementary rewards assess factual accuracy and coverage, measure step-level temporal alignment, and penalize fragmented or redundant narration, guiding caption refinement through Group Relative Policy Optimization (GRPO). To improve the reliability of factual supervision, we supplement caption references with pose-derived motion facts when sensor data are available. Across five egocentric benchmarks, EgoCaptioner achieves leading performance among evaluated open-source models in caption quality, caption-conditioned question answering, and temporal alignment. It also surpasses Gemini 3.1 Pro on PhysCapBench and all evaluated proprietary baselines on Minerva-Ego under the caption-to-QA protocol. Ablations support the complementary roles of factual and temporal rewards and show that coarse-to-fine annotation provides more effective supervision than single-pass annotation.", 'score': 24, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'd86b23e0f1c3f6b6', 'authors': ['Yuqi Tang', 'Yang Shi', 'Yuran Wang', 'Tengfei Liu', 'Rundong Wang', 'Zongyang Qiu', 'Qixun Wang', 'Zhuoran Zhang', 'Xuanyu Zhu', 'Yifan Xu', 'Yiyan Ji', 'Shujie Li', 'Shixuan Liu', 'Haotian Wang', 'Yuanxing Zhang', 'Pengfei Wan', 'Chengwei Qin'], 'affiliations': ['HKU', 'HKUST(GZ)', 'KlingAI Research', 'NJU', 'PKU', 'THU', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2611.26380.jpg', 'data': {'categories': ['#cv', '#video', '#optimization', '#multimodal', '#benchmark', '#rl', '#dataset', '#training', '#synthetic', '#data'], 'emoji': '🎥', 'ru': {'title': 'Точные описания эгоцентрического видео с временными метками, обученные через GRPO', 'desc': 'В статье представлен EgoCaptioner — модель для генерации подробных описаний эгоцентрических видео, которая сочетает общий обзор события с временными метками для ключевых шагов. Авторы используют двухэтапный конвейер разметки (coarse-to-fine) и датасет из 50 000 примеров из восьми источников, а для обучения применяют GRPO с наградами за фактическую точность, покрытие и временное выравнивание. Для повышения надёжности разметки дополнительно используются факты о движении, извлечённые из данных сенсоров и позы. На пяти бенчмарках модель превосходит открытые аналоги по качеству описаний, ответам на вопросы и временной привязке, а также обгоняет Gemini 3.1 Pro на PhysCapBench.'}, 'en': {'title': 'See the Big Picture, Get Every Moment Right', 'desc': 'EgoCaptioner generates egocentric video captions with an overview and timed descriptions of individual steps, capturing actions and their order. Its coarse-to-fine annotation pipeline first identifies event structure, then adds detailed narration to create training examples. The model is refined with Group Relative Policy Optimization (GRPO), using rewards for factual accuracy, coverage, temporal alignment, and concise narration; pose-derived motion facts can also improve factual supervision. Across five benchmarks, it performs strongly in caption quality, caption-based question answering, and temporal alignment, with ablations highlighting the value of its rewards and annotation process.'}, 'zh': {'title': '先理清事件，再精准讲述第一人称视频', 'desc': '本文提出 EgoCaptioner，用于生成第一人称视频字幕，结合场景与整体活动概述，以及带时间戳、按感知需求调整细节的分步叙述。研究者设计由粗到细的标注流程，先确定事件结构再补充步骤描述，并据此构建包含五万条样本的训练数据。模型通过组相对策略优化（GRPO）训练，奖励机制兼顾事实准确性、内容覆盖、步骤级时间对齐，并抑制叙述碎片化和重复；有传感器数据时，还利用姿态信息补充动作事实。实验显示，EgoCaptioner 在多个第一人称视频基准上的字幕质量、基于字幕的问答和时间对齐表现突出，消融实验也验证了各项奖励及由粗到细标注的作用。'}}}, {'id': 'https://huggingface.co/papers/2611.26107', 'title': 'HiUni: Harmonizing Understanding and Generation in Shared Visual Space', 'url': 'https://huggingface.co/papers/2611.26107', 'abstract': 'Abstract  Unified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unification. In this paper, we present HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly extended into a unified model with extensive parameter sharing. Specifically, HiUni reuses the same language-aligned ViT and dense Transformer backbone for both capabilities, while confining task-specific computation to the output side. Yet such a design introduces two key challenges. Generation in pixel space is difficult to optimize, and semantic abstraction in pretrained ViT discards fine spatial details required for synthesis. To address these challenges, HiUni introduces a Pixel Diffusion Head tailored to direct pixel-space optimization and a lightweight HiGate pathway that provides fine-grained spatial details near the output stage. Extensive experiments show that HiUni achieves a similar average understanding score to the pretrained VLM while attaining competitive performance on image generation and editing. Controlled comparisons and analyses further demonstrate that a single dense backbone can effectively support both capabilities without task-specific backbone computation, highlighting a simpler path toward unified multimodal modeling.', 'score': 23, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'dbf2858baf76c8f6', 'authors': ['Jiahao Hu', 'Jingdong Du', 'Yichen Zhang', 'Yi Song', 'Zhenyu Zhang', 'Jiaxin Niu', 'Ruihang Li', 'Xiangzhao Hao', 'Yiqian Zhang', 'Yong Huang', 'Zefeng Zhang', 'Zheyuan Gu', 'Shuohuan Wang'], 'affiliations': ['Baidu Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.26107.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#cv', '#multimodal'], 'emoji': '🧩', 'ru': {'title': 'Один бэкбон для понимания и генерации изображений', 'desc': 'Авторы представляют HiUni — унифицированную мультимодальную модель, которая использует одну и ту же языково-согласованную ViT и плотный Transformer-бэкбон как для понимания изображений, так и для их генерации и редактирования. Вся задача-специфичная логика вынесена на выходную сторону: для генерации в пиксельном пространстве применяется Pixel Diffusion Head, а для сохранения мелких пространственных деталей — легковесный путь HiGate. Эксперименты показывают, что по качеству понимания модель почти не уступает исходной предобученной VLM, а в генерации и редактировании изображений демонстрирует конкурентные результаты. Работа показывает, что один плотный бэкбон может эффективно решать обе задачи без отдельных вычислений под каждую из них.'}, 'en': {'title': 'One shared backbone for seeing and creating', 'desc': 'HiUni extends a pretrained vision-language model to handle both visual understanding and image generation using the same language-aligned Vision Transformer (ViT) and dense Transformer backbone. It keeps the backbone shared and places task-specific processing only at the output. A Pixel Diffusion Head makes pixel-space image generation easier to optimize, while a lightweight HiGate pathway restores fine spatial details that the pretrained ViT may discard. Experiments show that HiUni retains similar visual-understanding performance to the pretrained model while achieving competitive image generation and editing results.'}, 'zh': {'title': '一个共享主干，同时理解与生成', 'desc': '本文提出 HiUni，探索如何将预训练视觉语言模型扩展为统一的视觉理解与生成模型。它让两项任务共享同一个与语言对齐的视觉 Transformer（ViT）和稠密 Transformer 主干网络，只在输出阶段使用任务专属模块。为改善像素空间生成的优化，并补足预训练 ViT 丢失的细粒度空间信息，HiUni 引入了像素扩散头和轻量级 HiGate 通路。实验表明，该模型在保持接近原预训练模型的视觉理解表现时，也能实现有竞争力的图像生成与编辑效果。'}}}, {'id': 'https://huggingface.co/papers/2611.25387', 'title': 'TuringSpace: Grounding Spatial Intelligence in Action with Interactive CAPTCHAs', 'url': 'https://huggingface.co/papers/2611.25387', 'abstract': 'Abstract  Humans act in the visual world by inferring the 3D layout behind a 2D view, predicting how an action changes it, and correcting themselves after seeing the result. Can multimodal large language models (MLLMs) do the same? CAPTCHAs offer a natural test, since humans solve them through this very loop, clicking and dragging on the screen and adjusting after each result. Yet existing CAPTCHA benchmarks are largely solved and rarely spatial, while spatial benchmarks rarely require action. We therefore present TuringSpace, a synthetic web environment of 125 interactive CAPTCHAs that span five spatial abilities and must be solved through clicks and drags on the screen. Every task is a program that generates new instances with a checker and an oracle, so the tasks also form a scalable training gym. Humans solve 94.1% of the tasks, whereas the best model, GPT-6 Astra, still fails 25.9% of them, and the best open-weight model, Kimi K3, fails 68.0%. Our further analysis shows that most failures come from misreading the screenshot, and that model reasoning rarely corrects a wrong belief but hallucinates evidence to defend it. To test whether such spatial abilities can be learned, we fine-tune Qwen3.5-9B on this gym. Its success rate rises from 1.6% to 33.1%, above Kimi K3, and it improves on all seven out-of-distribution benchmarks, including a 9.9-point gain on the real-world indoor videos of VSI-Bench. These results show that grounding spatial intelligence in screen actions exposes what MLLMs lack and offers a scalable way to teach it, with gains that transfer to real-world scenes. We will release TuringSpace to support further study.', 'score': 22, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'fac3183c0d384d81', 'authors': ['Xuwei Ding', 'Skylar Zhai', 'Linxin Song', 'Jiarui Feng', 'Dongqi Fu', 'Huajun Xi', 'Junnan Li', 'Jingcheng Liang', 'Jieyu Zhao', 'Yinglong Xia', 'Hong Li', 'Jian Kang'], 'affiliations': ['MBZUAI', 'Meta', 'University of Minnesota', 'University of Pennsylvania', 'University of Southern California', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2611.25387.jpg', 'data': {'categories': ['#cv', '#multimodal', '#benchmark', '#agents', '#hallucinations', '#dataset', '#training', '#games', '#synthetic'], 'emoji': '🧩', 'ru': {'title': 'Пространственный интеллект MLLM — через действия на экране, а не только через картинку', 'desc': 'Авторы представляют TuringSpace — синтетическую веб-среду из 125 интерактивных CAPTCHA, которые требуют пространственного мышления и действий (кликов и перетаскиваний) на экране. Люди решают 94.1% задач, тогда как лучшая LLM (GPT-6 Astra) проваливает 25.9%, а лучшая open-weight модель (Kimi K3) — 68.0%. Анализ показывает, что большинство ошибок связано с неправильным чтением скриншота, а рассуждения модели редко исправляют ошибочные убеждения, часто галлюцинируя подтверждающие доказательства. Дообучение Qwen3.5-9B на этом наборе (gym) повышает успешность с 1.6% до 33.1% и улучшает результаты на семи внешних бенчмарках, включая +9.9 п.п. на реальных видео VSI-Bench.'}, 'en': {'title': 'Teach spatial intelligence through actions, not just images', 'desc': 'The paper introduces TuringSpace, a collection of 125 interactive CAPTCHA tasks that tests whether multimodal large language models can understand spatial layouts and act through clicks and drags. People solve most tasks, while leading models often fail, mainly because they misread the screen and then defend incorrect beliefs. Fine-tuning Qwen3.5-9B on generated TuringSpace tasks raises its success rate from 1.6% to 33.1%. The tuned model also improves on seven other benchmarks, suggesting that interactive spatial training can transfer to real-world scenes.'}, 'zh': {'title': '让模型在屏幕上动手，学会真正的空间推理', 'desc': '论文提出 TuringSpace，这是一个包含 125 种交互式验证码的合成环境，用来测试多模态大语言模型通过屏幕点击和拖动解决空间任务的能力。每项任务都由程序生成，并配有判定器和标准答案，因此也能作为可扩展的训练环境。实验发现，模型常因误读截图而失败；推理过程往往无法纠正错误判断，反而会编造证据来支持它。用该环境微调 Qwen3.5-9B 后，成功率从 1.6% 提升到 33.1%，并在七项分布外基准上有所进步，说明通过屏幕动作训练空间能力可以迁移到真实场景。'}}}, {'id': 'https://huggingface.co/papers/2611.26414', 'title': 'ZeroVLN: Learning to Navigate without Supervised Fine-Tuning of the VLM Brain', 'url': 'https://huggingface.co/papers/2611.26414', 'abstract': "Abstract ZeroVLN is a slow-fast vision-language navigation framework that avoids navigation-domain supervised fine-tuning of the VLM brain by using a semantic tool-calling interface and closed-loop reinforcement learning to coordinate a language-based brain with an action expert, improving VLN-CE performance while preserving general visual capabilities.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Representative vision-language navigation (VLN) methods typically couple a vision-language model (VLM) brain with a learnable action head and fine-tune the VLM brain on navigation-domain data to predict geometric goals. However, such adaptation can substantially alter base VLM weights and degrade general visual capabilities. We introduce ZeroVLN, a slow-fast navigation framework that achieves effective navigation with zero navigation-domain SFT of the VLM brain. Rather than teaching the brain to predict geometric goals, we equip it with a semantic tool-calling interface for conveying movement decisions to an action expert in natural language. We first adapt the action expert to carry out these movement requests, then jointly improve the brain's movement decisions and the action expert's continuous execution through closed-loop reinforcement learning (RL). Trained on the same navigation episodes, ZeroVLN substantially outperforms representative SFT-based hierarchical VLN methods on standard VLN-CE (continuous environments) benchmarks, while inducing only minor changes to the brain's weights and largely preserving its general capabilities. To our knowledge, ZeroVLN is the first slow-fast VLN framework with zero navigation-domain SFT of the VLM brain, and the first to jointly optimize its slow and fast policies through closed-loop agentic RL in VLN-CE.", 'score': 21, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '92d96fb7fcc0bdbb', 'authors': ['Zixuan Huang', 'Yang Zhou', 'Guli Zhang', 'Sunzhu Li', 'Hongyan Xie', 'Zehao Chen', 'Fuzhen Zhuang', 'Kaixuan Wang', 'Xiaozhi Chen', 'Yikun Ban', 'Deqing Wang'], 'affiliations': ['Beihang University', 'Zhejiang University', 'Zhuoyu Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.26414.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#robotics', '#agents', '#rl', '#benchmark', '#alignment', '#training'], 'emoji': '🧭', 'ru': {'title': 'Навигация без переобучения: мозг думает словами, а не координатами', 'desc': 'В статье представлен ZeroVLN — двухуровневая (slow-fast) система навигации по визуальным и языковым инструкциям, где VLM-мозг не дообучается на navigation-данных с помощью SFT. Вместо предсказания геометрических целей мозг вызывает семантические инструменты и передает решения о движении action expert через естественный язык. Затем action expert учится выполнять эти запросы, а мозг и исполнитель совместно оптимизируются с помощью closed-loop reinforcement learning. Метод превосходит SFT-базированные иерархические подходы на бенчмарках VLN-CE, сохраняя общие визуальные возможности модели.'}, 'en': {'title': 'Navigate with language, not navigation-specific fine-tuning', 'desc': "ZeroVLN is a slow-fast vision-language navigation framework that keeps the vision-language model (VLM) brain from being supervised fine-tuned on navigation data. Instead, the brain uses a semantic tool-calling interface to request movements in natural language, and a separate action expert carries them out. Closed-loop reinforcement learning jointly improves the brain's decisions and the expert's continuous actions. This approach outperforms representative fine-tuned methods on VLN-CE benchmarks while largely preserving the VLM's general visual capabilities."}, 'zh': {'title': '不微调导航大脑，让语言决策与动作专家闭环协作', 'desc': 'ZeroVLN 是一种快慢协同的视觉语言导航框架，无需用导航数据对视觉语言模型（VLM）进行监督微调。它让 VLM 通过自然语言工具调用向动作专家提出移动指令，而不是直接预测几何目标。随后，框架使用闭环强化学习联合优化 VLM 的决策和动作专家的连续执行。实验显示，ZeroVLN 在连续环境导航基准上优于多种监督微调方法，同时较好地保留了 VLM 原有的通用视觉能力。'}}}, {'id': 'https://huggingface.co/papers/2611.26073', 'title': 'AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators', 'url': 'https://huggingface.co/papers/2611.26073', 'abstract': 'Abstract A statistical test, AltRA-Test, determines when large language models can replace human annotators by comparing inter-annotator agreement in resampled mixed human-LLM panels, and evaluations show it often requires about 100 items and makes better replacement decisions than baselines.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) are increasingly used as judges and graders to replace human annotators, raising the question of when such replacement is statistically justified. To support such decisions, the Alternative Annotator Test (Alt-Test) was introduced for dense settings where all items are annotated by the same annotators. However, in many large-scale annotation settings, items are annotated by different subsets of annotators. We therefore propose the Alternative Annotator Test with Resampled Annotations (AltRA-Test), a statistical test that does not require that all items are annotated by the same annotators. AltRA-Test uses a bootstrap that resamples items, draws k human annotations for each item, and substitutes one of them with an LLM annotation. This produces paired all-human and mixed human-LLM panels. A replacement is supported when the inter-annotator agreement (IAA) of the mixed panel is statistically non-inferior to the IAA of the all-human panel, i.e., when the LLM preserves the signal that the human annotators share. We establish that AltRA-Test is a consistent test of asymptotic level alpha. We then evaluate it through simulations and real-world experiments in which we test 18 LLMs and 5 prompting techniques on 20 datasets across text, image, audio, and video. Across these evaluations, about 100 items often suffice for the test. In simulations, where we know whether the LLM is a better or a worse annotator than the humans, AltRA-Test makes more correct replacement decisions than existing baselines. In real-world data experiments, LLMs pass the test in about half of the setups, depending mainly on the task. Since replacement is not always justified, we encourage researchers to test it for their task.', 'score': 20, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'ba9a0e7f25a3471e', 'authors': ['Nagham Omar', 'Rotem Dror', 'Almog Gueta', 'Avigdor Gal', 'Roi Reichart', 'Nitay Calderon'], 'affiliations': ['Google Research', 'Technion', 'University of Haifa'], 'pdf_title_img': 'assets/pdf/title_img/2611.26073.jpg', 'data': {'categories': ['#multimodal', '#audio', '#video', '#benchmark', '#cv', '#data'], 'emoji': '⚖️', 'ru': {'title': 'Заменять ли людей LLM — проверяем статистикой, а не на глаз', 'desc': 'Статья представляет AltRA-Test — статистический тест, который определяет, можно ли заменить человеческих разметчиков на LLM (large language models) в задачах аннотирования данных. Тест работает даже тогда, когда элементы размечают разные подмножества аннотаторов: с помощью bootstrap-ресэмплинга создаются смешанные панели из людей и LLM и сравнивается межаннотаторское согласие (IAA). Замена считается обоснованной, если IAA смешанной панели статистически не хуже, чем у панели из одних людей. Эксперименты с 18 LLM, 5 техниками промптинга и 20 датасетами (текст, изображения, аудио, видео) показали, что для теста обычно достаточно около 100 элементов, а по точности решений он превосходит существующие бейзлайны.'}, 'en': {'title': 'Test Before You Replace: Measure Whether an LLM Preserves Human Agreement', 'desc': 'AltRA-Test checks whether an LLM can replace a human annotator when different items were labeled by different groups of people. It uses bootstrap resampling to compare agreement in an all-human panel with agreement in a mixed panel where one human label is replaced by an LLM label. The test supports replacement when the mixed panel’s inter-annotator agreement is statistically non-inferior to the human panel’s agreement. Experiments across 20 datasets found that about 100 items often suffice, and the test made more accurate replacement decisions than existing baselines in simulations.'}, 'zh': {'title': '用一致性检验，让模型替代人工有据可依', 'desc': '论文提出 AltRA-Test，用于判断大型语言模型是否能在统计上合理地替代人工标注员，即使不同项目由不同的人标注也适用。该方法通过自助重采样项目，为每个项目抽取多个人工标注，并将其中一个替换为模型标注，比较纯人工组与人机混合组的标注者间一致性。若混合组的一致性在统计上不劣于纯人工组，就认为模型保留了人工标注者共享的信息，替代有依据；论文还证明了该检验具有渐近有效性。在涵盖20个数据集的实验中，约100个项目通常就足以进行检验，而且 AltRA-Test 比现有基线更常作出正确的替代判断。'}}}, {'id': 'https://huggingface.co/papers/2611.24011', 'title': 'WAM-Policy: World Action Models with On-Policy Distillation for Quadrupedal Loco-Manipulation', 'url': 'https://huggingface.co/papers/2611.24011', 'abstract': 'Abstract  Arm-free quadrupeds can perform loco-manipulation, walking on three legs while manipulating with a front leg, yet no existing policy for it follows language instructions. World action models (WAMs) have emerged as effective language-conditioned manipulation policies, but are pretrained for robot arms and sample slowly. WAM-Policy turns one WAM into a quadrupedal loco-manipulation policy via two stages. The first, Cross-Morphology Policy Adaptation and Acceleration, adapts the arm-centric WAM to quadrupeds and distills the transferred policy into a student with one video and two action steps by on-policy self-distillation (OPSD). This student, however, is bounded by its teacher, which only imitates demonstrations. The second stage, Task-Specific Improvement and Merging, therefore tunes the teacher by reinforcement learning (RL) and merges the slow specialists into one few-step student by multi-teacher on-policy distillation (M-OPD). On QLM-Bench, ten simulated tasks with 1,000 demonstrations synthesized without teleoperation, the transferred policy reaches 77.0%, and the OPSD student keeps 76.7% while sampling 14 times faster. Task-specific RL and M-OPD lift it to 85.0%. We also deploy the OPSD student on a real Unitree Go2 Air. WAM-Policy thus achieves a stronger quadrupedal policy at a fraction of the inference cost.', 'score': 16, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': 'd5be85f645721cbb', 'authors': ['Junlin Long', 'Xu Deng', 'Yiran Wang', 'Yue Yang', 'Yang Zhao', 'Zeyu Zhang'], 'affiliations': ['Australian Centre for Robotics, USYD', 'La Trobe University', 'Maincode', 'UNSW Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2611.24011.jpg', 'data': {'categories': ['#inference', '#optimization', '#rlhf', '#robotics', '#rl', '#benchmark', '#small_models', '#transfer_learning', '#training', '#games', '#data'], 'emoji': '🐕', 'ru': {'title': 'Быстрый четвероногий робот, который понимает команды и умеет манипулировать', 'desc': 'В статье представлен WAM-Policy — метод, который превращает языково-обусловленную World Action Model (WAM), изначально обученную для роботов с манипуляторами, в политику для четвероногих роботов, перемещающихся на трёх ногах и манипулирующих четвёртой. Первый этап адаптирует политику к другой морфологии и дистиллирует её в быстрого студента через on-policy self-distillation (OPSD), что ускоряет инференс примерно в 14 раз без заметной потери качества. Второй этап дообучает учителя с помощью reinforcement learning (RL) под конкретные задачи и объединяет специалистов в одного few-step студента через multi-teacher on-policy distillation (M-OPD). На бенчмарке QLM-Bench из десяти симулированных задач метод повышает успешность до 85.0%, а развёрнутая на реальном роботе Unitree Go2 Air модель демонстрирует работоспособность при значительно меньших вычислительных затратах.'}, 'en': {'title': 'Teach a quadruped to act faster—and do more', 'desc': 'WAM-Policy adapts a language-conditioned world action model (WAM), originally built for robot arms, to quadrupeds that walk while manipulating objects. It first uses on-policy self-distillation (OPSD) to create a fast student policy, which achieves nearly the teacher’s performance while sampling 14 times faster. The method then improves task-specific teachers with reinforcement learning (RL) and combines them into one student using multi-teacher on-policy distillation (M-OPD). On ten simulated tasks, this process raises success to 85.0%, and the OPSD student is also deployed on a real Unitree Go2 Air.'}, 'zh': {'title': '让四足机器人听懂指令，快稳兼顾地行走与操作', 'desc': '本文提出 WAM-Policy，让四足机器人能依照语言指令行走并用前腿操作物体。方法分两阶段：先将原本面向机械臂的世界动作模型迁移到四足机器人，再用在线策略自蒸馏（OPSD）训练快速学生策略。由于学生策略的能力受模仿示范的教师限制，研究进一步用强化学习（RL）提升教师，并通过多教师在线策略蒸馏（M-OPD）将多个专长策略合并为一个快速学生策略。在 QLM-Bench 上，该方法的成功率从迁移策略的 77.0% 提升至 85.0%；OPSD 学生策略在成功率几乎不变的情况下，推理速度提高 14 倍，并已部署到真实四足机器人上。'}}}, {'id': 'https://huggingface.co/papers/2611.26627', 'title': 'RL Post-Training in Diffusion Transformers Is Activation Steering', 'url': 'https://huggingface.co/papers/2611.26627', 'abstract': 'Abstract A fixed set of steering vectors added to a frozen diffusion transformer recovers most of the quality gains from reinforcement learning post-training, indicating that much of the improvement comes from a constant shift rather than prompt-specific transformations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Reinforcement learning (RL) post-training substantially improves the visual quality, text rendering, and compositional accuracy of diffusion transformers. Because capabilities such as rendering requested text or composing multiple objects are inherently prompt-dependent, a natural hypothesis is that improving them requires learning complex, input-dependent transformations. To isolate how much of these gains an input-independent shift explains, we probe each RL-tuned model with a deliberately simple parameterization: a fixed set of steering vectors added to the block outputs of the frozen base model. On SD3.5-M, these vectors hold 65x fewer parameters than the RL-tuned LoRA (0.29M against 18.8M). We fit them to match the velocity predictions of public RL-tuned checkpoints, with no reward in the objective. Although the vectors are identical for every prompt, token, and sampling seed, they recover 90.0-96.3% of the reward gains of six RL-tuned image models, and 89.8% and 111.9% on two RL-tuned video models. Initialized at zero and trained with online RL, the vectors alone exceed the reward gains of weight-based RL on text rendering (OCR) and human preference (PickScore) on SD3.5-M. A constant shift thus suffices for most of the gain of policy-gradient RL post-training: without new input-dependent transformations, it steers the pretrained generator toward what it can already compute.', 'score': 14, 'issue_id': 3553, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'd2e360012889688f', 'authors': ['Tuna Han Salih Meral', 'Kaan Oktay', 'Alec Helbling', 'Atakan Kara', 'Duen Horng Chau', 'Pinar Yanardag'], 'affiliations': ['Georgia Tech', 'IBM Research', 'Virginia Tech', 'fal'], 'pdf_title_img': 'assets/pdf/title_img/2611.26627.jpg', 'data': {'categories': ['#rl', '#video', '#training', '#diffusion', '#rlhf', '#architecture', '#cv', '#optimization'], 'emoji': '🧭', 'ru': {'title': 'Одно постоянное смещение может заменить большую часть RL-дообучения диффузионных моделей', 'desc': 'Авторы показывают, что значительную часть улучшений, которые дает обучение с подкреплением (RL) диффузионным трансформерам, можно воспроизвести простым постоянным сдвигом. Они добавляют фиксированный набор steering vectors к выходам блоков замороженной базовой модели, обучая их имитировать velocity-предсказания RL-настроенных чекпоинтов без использования reward. Эти векторы имеют в 65 раз меньше параметров, чем LoRA, но восстанавливают 90–96% прироста reward у шести моделей генерации изображений и до 112% у видеомоделей. Вывод: такой сдвиг, не зависящий от входа, достаточен для большинства улучшений, а не новые input-dependent преобразования.'}, 'en': {'title': 'A Small, Fixed Shift Unlocks Most of RL’s Gains', 'desc': 'The paper tests whether reinforcement learning (RL) improvements to diffusion transformers require prompt-specific changes. It adds a small, fixed set of steering vectors to the outputs of a frozen model and trains them to match predictions from RL-tuned models, without using rewards as the training objective. Despite using far fewer parameters than LoRA, these vectors recover most of the reward gains across image and video models, and online RL with the vectors alone can outperform weight-based RL on some measures. The results suggest that much of RL post-training’s benefit comes from a constant shift that redirects capabilities the pretrained model already has.'}, 'zh': {'title': '固定向量，小幅拨动，释放模型已有能力', 'desc': '这篇论文研究强化学习后训练带来的扩散模型提升，是否需要依赖随提示变化的复杂变换。作者在冻结的扩散 Transformer 各层输出上添加固定的 steering vectors，并让它们拟合强化学习模型的速度预测，不使用奖励作为训练目标。在 SD3.5-M 上，这些向量的参数量比 LoRA 少 65 倍，却恢复了六个图像模型 90.0%–96.3% 的奖励提升，也恢复了两个视频模型的大部分提升。结果表明，强化学习后训练的大部分收益可由一个与输入无关的恒定偏移实现，它引导预训练模型更好地发挥已有能力。'}}}, {'id': 'https://huggingface.co/papers/2611.24193', 'title': 'WM^MLLM: Turning MLLMs into World Models', 'url': 'https://huggingface.co/papers/2611.24193', 'abstract': 'Abstract WM^MLLM uses multimodal large language models to maintain an external panorama state with revision history, enabling persistent, editable world generation from a single image with exact revisits and local edits.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Video world models keep the world in the context of a generator, so a revisit is synthesized again and earlier edits can drift or disappear. We present WM^MLLM, the first interactive world model built on multimodal large language models (MLLMs), for persistent, editable world generation from a single image. WM^MLLM keeps the world state outside every generator, as a panorama with a revision history, and lets the MLLMs write it: they turn each request into operations on this state, select where a local edit is written, and check every candidate before it becomes the next state. Image generators only propose views, and video only presents them. Users can walk to new places and return, edit objects through text or a box, place subjects, and change lighting, weather or season. By construction, a revisit at the same revision reproduces the earlier view exactly, a local edit leaves every panorama pixel outside its region unchanged, and each request starts from the result of the previous one. Against six world model baselines on MBench-A, WM^MLLM has the highest mean on all four environment-recovery metrics (Epipolar 91.5 versus 0.1 to 74.0) and completes the most camera round trips (85.3% versus at most 50.9%). It has the best value in all 15 CompBench columns against 15 baselines. On 112 local edits judged blind, selecting the region to write after generation raises completion from 34.8% to 83.0%. On 258 WBench and MBench-A items, all 46 revisits recover their earlier views, and all 97 local edits that pass the check leave panorama pixels outside their region unchanged.', 'score': 14, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': 'f34439799b4b17bf', 'authors': ['Baiang Li', 'Enze Xie', 'Jincheng Yu', 'Jin Wang', 'Haozhe Liu', 'Yitong Li', 'Juanxi Tian', 'Felix Heide'], 'affiliations': ['NVIDIA', 'OpenEnvision', 'Princeton University'], 'pdf_title_img': 'assets/pdf/title_img/2611.24193.jpg', 'data': {'categories': ['#video', '#cv', '#multimodal', '#benchmark', '#agents', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'Мир, который помнит свои правки и возвращается точно таким, каким был', 'desc': 'Статья представляет WM^MLLM — интерактивную модель мира, которая строит постоянную и редактируемую генерацию мира по одному изображению. Состояние мира хранится вне генератора в виде панорамы с историей ревизий, а мультимодальные LLM (MLLM) переводят запросы пользователя в операции над этим состоянием и проверяют каждый результат. Благодаря такой архитектуре повторный переход к тому же месту точно воспроизводит прежний вид, а локальные правки не затрагивают пиксели вне своей области. На бенчмарках MBench-A и CompBench модель превосходит шесть базовых world model и пятнадцать бейзлайнов по метрикам восстановления среды и завершённости круговых маршрутов.'}, 'en': {'title': 'A World You Can Revisit, Revise, and Trust', 'desc': 'WM^MLLM is an interactive world model that uses multimodal large language models to create and edit a persistent world from one image. It stores the world as a panorama with revision history, while image generators propose views and the model checks edits before saving them. This design supports exact revisits and local edits that preserve panorama pixels outside the edited region. Across several benchmarks, WM^MLLM outperforms prior systems on environment recovery, camera round trips, and object and scene editing.'}, 'zh': {'title': '让生成的世界持久可回访，让每次编辑精准可控', 'desc': '这篇论文提出 WM^MLLM，一种基于多模态大语言模型的交互式世界模型，可从单张图像生成能够持续保存和编辑的场景。它把全景图及其修订历史保存在生成器之外，并让模型将用户请求转换为对场景状态的操作，再检查候选结果后更新状态。用户可以探索新地点、返回旧地点，也能通过文字或框选修改物体，并调整光照、天气和季节；相同版本的回访会精确还原原先画面，局部编辑则不改变指定区域之外的像素。实验显示，该方法在多项环境恢复、相机往返和场景编辑基准上优于对比方法，且通过检查的局部编辑都保留了区域外的全景像素。'}}}, {'id': 'https://huggingface.co/papers/2611.26408', 'title': 'Training Vision Models for LLM-Driven Weight-Space Programming', 'url': 'https://huggingface.co/papers/2611.26408', 'abstract': 'Abstract  It has been demonstrated that, in certain settings, large language models can perform weight-space programming to directly modify the weights of neural networks. However, it is unknown how dedicated training of these networks can contribute to the successes of weight-space programming. We present a benchmark of LLM-driven weight-space programming on vision models, in which five LLMs edit convolutional networks and vision transformers on relabeling and error-correction tasks on Waterbirds, CIFAR-100, PACS and Entity-30. We report more than 2,600 such edit processes, whereby each edit is scored on held-out images for success, side effects and accuracy loss. We compare standard training with label smoothing, gradient-based editable training, and our Edit-Ready Training (ERT), a novel method that rehearses the direct, closed-form weight edits LLMs perform. We show that preparing networks for editing raises the success of LLM edits substantially where standard networks are hard to edit. ERT further achieves the highest mean score for GPT-6 Astra and Claude Opus 5.5 across all evaluated baselines. We will release our LLM testing framework alongside all tasks, editing trajectories and scores. Project page: https://viscom.uni-ulm.de/wsp', 'score': 12, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'feff8a589da3b5ec', 'authors': ['Timo Ropinski', 'Sebastian Kranz'], 'affiliations': ['Ulm University'], 'pdf_title_img': 'assets/pdf/title_img/2611.26408.jpg', 'data': {'categories': ['#optimization', '#interpretability', '#training', '#benchmark', '#cv', '#open_source'], 'emoji': '🧠', 'ru': {'title': 'Готовим нейросеть к правкам: LLM меняют веса напрямую, если модель заранее подготовлена', 'desc': 'Статья исследует, насколько LLM способны напрямую модифицировать веса нейронных сетей (weight-space programming) для задач компьютерного зрения, например, перемаркировки и исправления ошибок на датасетах Waterbirds, CIFAR-100, PACS и Entity-30. Авторы провели более 2600 таких правок на свёрточных сетях и vision transformer и оценили успех, побочные эффекты и потерю точности. Они сравнивают стандартное обучение, label smoothing, градиентно-редактируемое обучение и новый метод Edit-Ready Training (ERT), который заранее «репетирует» закрытые формулы правок весов. Результаты показывают, что подготовка сети к редактированию заметно повышает успешность правок LLM, а ERT даёт лучший средний результат.'}, 'en': {'title': 'Train Vision Models to Be Ready for LLM Edits', 'desc': 'This paper studies how large language models (LLMs) can directly edit neural network weights to change predictions, a process called weight-space programming. The authors benchmark five LLMs editing convolutional networks and vision transformers on image relabeling and error-correction tasks, measuring success, side effects, and accuracy loss on held-out data. They compare standard training and other approaches with Edit-Ready Training (ERT), which rehearses the closed-form weight edits that LLMs make. Preparing networks for editing improves LLM edit success, and ERT achieves the best average score for two of the tested LLMs.'}, 'zh': {'title': '让模型为编辑而生：用 ERT 提升大语言模型的权重编程能力', 'desc': '本文研究大型语言模型如何通过直接修改神经网络权重来完成任务，并评估这种“权重空间编程”在视觉模型上的效果。研究者让五种大语言模型编辑卷积网络和视觉 Transformer，在多个数据集上执行标签重映射与错误纠正，并评估编辑成功率、副作用和准确率损失。实验比较了常规训练、标签平滑、基于梯度的可编辑训练，以及一种名为 Edit-Ready Training（ERT）的新方法；ERT 会预先训练模型，使其适应大语言模型所执行的直接闭式权重编辑。结果表明，专门为编辑做准备能显著提高编辑成功率，而 ERT 在多个基准方法中取得了最佳平均得分。'}}}, {'id': 'https://huggingface.co/papers/2611.26268', 'title': 'Accelerating Mixture of Block Attention via Dynamic Routing, KV-Centric Execution and Runtime Pipelining', 'url': 'https://huggingface.co/papers/2611.26268', 'abstract': "Abstract LightningMoBA combines dynamic routing, KV-centric ownership, and runtime pipelining to accelerate long-context attention while maintaining or improving quality.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Mixture of Block Attention (MoBA) reduces long-context computation by selecting key-value (KV) blocks for each query. FlashMoBA implements MoBA efficiently but retains a fixed Top-k budget and query-centric schedule. Fixed Top-k applies one budget across different score distributions and couples routing to task granularity; query-range ownership fragments K/V reuse when several ranges select the same column. We present LightningMoBA, which co-designs selection and execution through dynamic routing, KV-centric ownership, and runtime pipelining. Dynamic routing thresholds MoBA's per-query block scores and directly emits variable-cardinality sparse metadata. KV-centric ownership groups selected rows by (query head, KV block) column, splits high-fa
