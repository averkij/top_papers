nout columns into bounded tasks, and reuses each task's loaded KV tile. On Hopper, pipelining overlaps regular K/V transfers and irregular query gathers with Tensor Core computation. Together, these mechanisms decouple retention from GPU scheduling granularity. At matched Top-16 retention across five checkpoints, LightningMoBA accelerates end-to-end generation by 1.20 to 1.60x while raising mean RULER score from 74.42 to 75.28.", 'score': 12, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'd6160b451376fe43', 'authors': ['Yingqi Shi', 'Junru Lu', 'Yun Liu', 'Di Yin', 'Xing Sun'], 'affiliations': ['Tencent Youtu Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.26268.jpg', 'data': {'categories': ['#long_context', '#inference', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Быстрее внимание на длинном контексте без потери качества', 'desc': 'Статья представляет LightningMoBA — метод ускорения attention для длинных последовательностей, который улучшает Mixture of Block Attention (MoBA) за счёт динамического роутинга блоков вместо фиксированного Top-k бюджета. Выбор KV-блоков группируется по колонкам (query head, KV block), а высокоразветвлённые колонки разбиваются на ограниченные задачи, что позволяет переиспользовать загруженные KV-тайлы. На GPU Hopper конвейеризация перекрывает передачи K/V и нерегулярные gather-операции с вычислениями на Tensor Core. При одинаковом удержании Top-16 метод ускоряет генерацию в 1.20–1.60 раза и повышает средний балл RULER с 74.42 до 75.28.'}, 'en': {'title': 'Smarter KV routing for faster, higher-quality long-context attention', 'desc': 'LightningMoBA speeds up long-context attention by selecting only useful key-value (KV) blocks for each query. Instead of keeping a fixed number of blocks, its dynamic routing uses score thresholds to select a variable number. It groups work by KV block so the same loaded KV data can be reused, and splits heavily used blocks into manageable tasks. On Hopper GPUs, pipelining overlaps data movement with Tensor Core computation; tests show 1.20–1.60× faster generation and a higher mean RULER score than the comparison method.'}, 'zh': {'title': '动态选块、复用 KV，让长上下文注意力更快更准', 'desc': 'MoBA 会为每个查询选择相关的键值（KV）块，以减少长上下文注意力计算。LightningMoBA 用动态路由取代固定 Top-k 配额，并按分数阈值为每个查询选择数量不定的 KV 块。它还按 KV 块组织计算任务，让多个查询复用已加载的数据，并通过流水线让数据传输与 Tensor Core 计算重叠。实验显示，在相同 Top-16 保留率下，它将端到端生成速度提升 1.20 至 1.60 倍，并提高了 RULER 平均得分。'}}}, {'id': 'https://huggingface.co/papers/2611.25980', 'title': 'Learning What Actions Change: Action Effect Matching for Dynamics-Faithful World Models', 'url': 'https://huggingface.co/papers/2611.25980', 'abstract': 'Abstract AFFECT, an auxiliary objective that trains world models to match visual responses to temporally correlated action noise, improves rollout fidelity and planning success in simulated and real robotic tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash World models aim to predict environment dynamics under actions, enabling the prediction of action consequences without executing them in the real world. Yet despite producing increasingly realistic videos, current world models often fail to capture how small action changes affect future observations. This limits their use in tasks such as robotic policy evaluation and model-based planning, where nearly identical actions can lead to qualitatively different outcomes. To address this, we propose AFFECT, an auxiliary training objective for learning the distribution of visual changes induced by action perturbations. Specifically, we inject temporally correlated noise into the actions of a policy trained on task-agnostic human teleoperation. We then train the world model so that its generated videos respond to this noise as the recorded videos do, without requiring repeated executions from the same initial state. Across OGBench simulation and real-world DROID and ALOHA-2 setups, AFFECT makes world-model rollouts more faithful to real outcomes. On DROID, the Pearson correlation between policy success rates in the world model and on the real robot rises from 0.47 to 0.79, alongside up to 23% lower FVD. These gains carry over to planning, where selecting actions with AFFECT-trained world models improves task success by up to 8.3%.', 'score': 12, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '35caa49ae95cbe5f', 'authors': ['John Won', 'Yonghoon Dong', 'Jinwoo Shin'], 'affiliations': ['KAIST', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2611.25980.jpg', 'data': {'categories': ['#optimization', '#video', '#robotics', '#rl', '#training'], 'emoji': '🤖', 'ru': {'title': 'Чувствительный мир: модель видит, как малые действия меняют итог', 'desc': 'Статья представляет AFFECT — вспомогательную функцию потерь для обучения world models, которая учит модель воспроизводить изменения видео в ответ на малые возмущения действий. Для этого в действия политики, обученной на данных человеческой телеоперации, добавляется временно коррелированный шум, и модель обучается реагировать на него так же, как реальные записи, без повторных запусков из одного начального состояния. Эксперименты на OGBench, DROID и ALOHA-2 показывают, что такие модели точнее предсказывают реальные исходы: корреляция Пирсона между успешностью политик в модели и на роботе выросла с 0.47 до 0.79, а FVD снизился до 23%. Кроме того, использование таких моделей в model-based planning повышает успешность выполнения задач до 8.3%.'}, 'en': {'title': 'Teach World Models How Actions Change What Happens', 'desc': 'AFFECT is an auxiliary training objective that helps a world model predict how changes to actions alter future visual observations. It adds temporally correlated noise to actions in human teleoperation data, then trains the model to make its generated videos respond to that noise like the recorded videos do. This improves rollout fidelity in simulation and on real robots, including stronger agreement between simulated and real policy success rates. The more accurate rollouts also improve model-based planning, raising task success by up to 8.3%.'}, 'zh': {'title': '让世界模型看懂动作微变，规划更贴近真实', 'desc': '本文提出 AFFECT，一种用于训练世界模型的辅助目标，让模型学会动作变化会如何影响未来的视觉观察。研究者在动作中加入时间上相关的噪声，并训练世界模型，使生成的视频对噪声的响应与真实记录一致，无需从相同初始状态反复执行动作。在模拟环境及 DROID、ALOHA-2 真实机器人实验中，AFFECT 提高了世界模型预测结果的真实性，并改善了模型预测与真实任务成功率之间的相关性。使用经 AFFECT 训练的世界模型进行规划，也能提升任务成功率，最高提高 8.3%。'}}}, {'id': 'https://huggingface.co/papers/2611.24809', 'title': 'On-Policy Morphing into Hybrid Attention Models', 'url': 'https://huggingface.co/papers/2611.24809', 'abstract': "Abstract FlashMorph2 performs on-policy layer selection and weight adaptation for hybrid attention Transformers, improving long-context benchmark scores while selecting layers efficiently across model scales.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Hybrid attention models combine full and linear attention to achieve a better quality--efficiency trade-off. Converting pretrained Transformers into such models requires identifying which layers should retain full attention under a prescribed budget. We identify two off-policy mismatches in FlashMorph's layer selection: (i) continuous branch interpolation and teacher-forced hidden states differ from discrete hybrid computation; and (ii) frozen model weights fail to account for parameter adaptation during subsequent recovery. We introduce FlashMorph2, an on-policy layer-selection method that (I) evaluates sampled discrete hybrid architectures end to end using their own hidden states, and (II) jointly optimizes layer-selection scores and model weights under the recovery objective to reflect post-adaptation performance. Experiments across Qwen3 model scales and linear-attention variants show that FlashMorph2 consistently outperforms existing layer-selection methods, improving average scores over FlashMorph by +2.42 points on RULER, +1.08 on LongBench, and +0.76 on recall-intensive tasks, while completing layer selection in only 0.72--3.57 GPU hours across 0.6B--8B models, demonstrating high efficiency and scalability.", 'score': 12, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '0a4ba0532b61eba4', 'authors': ['Disen Lan', 'Xuanda Wang', 'Jianbin Zheng', 'Huafeng Kuang', 'Wei Tang', 'Yu Cheng'], 'affiliations': ['Department of Computer Science, Tsinghua University', 'Google', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.24809.jpg', 'data': {'categories': ['#inference', '#optimization', '#benchmark', '#architecture', '#long_context', '#training'], 'emoji': '⚡', 'ru': {'title': 'Выбирай внимание с умом: on-policy отбор слоёв для быстрых длинноконтекстных LLM', 'desc': 'Статья представляет FlashMorph2 — метод on-policy выбора слоёв для гибридных Transformer-моделей, которые сочетают full attention и linear attention. Авторы указывают на два off-policy рассогласования в предыдущем подходе FlashMorph: непрерывная интерполяция ветвей и замороженные веса модели не отражают реальное дискретное вычисление и последующую адаптацию. FlashMorph2 оценивает дискретные гибридные архитектуры сквозным образом по их собственным hidden states и совместно оптимизирует scores выбора слоёв и веса модели под целевую функцию восстановления. Эксперименты на моделях Qwen3 (0.6B–8B) показывают прирост качества на RULER, LongBench и recall-задачах при высокой эффективности: выбор слоёв занимает всего 0.72–3.57 GPU-часов.'}, 'en': {'title': 'Choose Attention Layers for the Model You’ll Actually Use', 'desc': 'FlashMorph2 helps convert pretrained Transformers into hybrid attention models, which combine full attention and linear attention. It selects which layers keep full attention by evaluating complete, discrete hybrid models using their own hidden states. It also adapts the model weights while learning layer-selection scores, so selection reflects performance after recovery training. Across Qwen3 model sizes, it improves long-context benchmark scores over FlashMorph while selecting layers efficiently.'}, 'zh': {'title': '按实际适配效果选层，让混合注意力更高效', 'desc': '混合注意力 Transformer 结合全注意力与线性注意力，以兼顾模型效果和计算效率。将预训练模型转换为混合结构时，需要在预算限制下挑选保留全注意力的层。FlashMorph2 通过端到端评估离散混合结构，并在恢复训练目标下联合优化层选择分数与模型权重，从而更准确地估计适配后的性能。实验显示，该方法在多个模型规模和长上下文任务上优于已有层选择方法，同时只需较少 GPU 时间。'}}}, {'id': 'https://huggingface.co/papers/2611.26510', 'title': 'AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher', 'url': 'https://huggingface.co/papers/2611.26510', 'abstract': 'Abstract  Task success alone does not specify which behaviors post-training should reinforce. Even successful teacher trajectories can contain unsupported assumptions, unproductive repetition, or superficial verification. We propose Skill-FT (Skill-Guided Fine-Tuning), which uses natural-language skills to suppress undesirable habits and elicit underrepresented effective behaviors during teacher rollouts, then fine-tunes a target model on the resulting trajectories. We introduce AutoMaster, an autonomous post-training system in which an LLM agent develops these interventions through trajectory analysis, skill design, data selection, and feedback from rollouts and target-model evaluation. Across Terminal, Search, and software engineering tasks with 4B and 9B target models, AutoMaster improves mean performance over Vanilla SFT on successful unguided teacher trajectories by 1.42-8.99 percentage points, with the teacher, task pool, training set size, and SFT recipe held fixed. Together with the ablations and trajectory analyses, these results suggest that behavioral shaping can make a fixed model a more effective teacher. We further find that retaining skill instructions during SFT yields higher mean performance than removing them across all six settings, despite their absence at evaluation and identical supervised outputs. These findings suggest that preserving skill context as part of a training demonstration can support better behavioral internalization.', 'score': 10, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '930b93461aa3b353', 'authors': ['Guoxin Chen', 'Shuang Sun', 'Fanzhe Meng', 'Xinyu Tang', 'Ruihua Song', 'Wayne Xin Zhao'], 'affiliations': ['Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.26510.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#agents', '#training', '#synthetic', '#data'], 'emoji': '🧭', 'ru': {'title': 'Учим модель не только решать задачи, но и правильно думать и действовать', 'desc': 'Статья предлагает метод Skill-FT, который использует задания на естественном языке (skills) для подавления нежелательных привычек учителя и усиления недостаточно представленного эффективного поведения при генерации траекторий. Затем целевая модель дообучается (fine-tuning) на полученных траекториях. Авторы также представляют AutoMaster, автономную систему, в которой LLM-агент сам анализирует траектории, проектирует навыки, отбирает данные и получает обратную связь от оценки модели. Эксперименты на задачах Terminal, Search и разработки ПО показывают улучшение над Vanilla SFT на 1.42–8.99 п.п., а сохранение инструкций во время SFT дает лучшие результаты, чем их удаление.'}, 'en': {'title': 'Shape the teacher’s behavior to teach better', 'desc': 'The paper introduces Skill-Guided Fine-Tuning (Skill-FT), which uses natural-language skills to steer teacher rollouts away from unhelpful habits and toward effective behaviors. AutoMaster is an autonomous system that analyzes trajectories, designs skills, selects training data, and uses evaluation feedback to improve these interventions. Across several task types and model sizes, this approach outperforms standard supervised fine-tuning on successful teacher trajectories, while keeping the teacher and training setup fixed. Keeping skill instructions in the training demonstrations improves results even when those instructions are absent at evaluation, suggesting they help the model internalize better behaviors.'}, 'zh': {'title': '用技能引导教师行为，让固定模型教得更好', 'desc': '仅用任务是否成功来判断后训练数据还不够，因为成功的教师轨迹也可能包含缺乏依据的假设、重复操作或表面化验证。Skill-FT 使用自然语言技能，在教师生成轨迹时抑制不良习惯并引导较少出现的有效行为，再用这些轨迹对目标模型进行监督微调。研究者提出 AutoMaster，让大语言模型智能体通过分析轨迹、设计技能、筛选数据，以及参考生成结果和目标模型评估来自动开发这些干预方法。在终端、搜索和软件工程任务中，AutoMaster 相比直接使用成功教师轨迹进行监督微调，平均表现提升了 1.42 至 8.99 个百分点；结果还显示，在微调示例中保留技能指令，即使评测时不提供指令，也能带来更好的平均表现。'}}}, {'id': 'https://huggingface.co/papers/2611.25567', 'title': 'Online Mistake Detection in Instruction-Conditioned Procedural Video', 'url': 'https://huggingface.co/papers/2611.25567', 'abstract': "Abstract  An assistant monitoring a person performing a procedure is most useful when it can detect mistakes while there is still time to recover. This requires judging actions against task instructions as the video unfolds, identifying the attempted step, locating it in time, and assessing its execution. Existing online detectors do not use the instruction text, while instruction-conditioned methods operate offline. In this paper, we study online, instruction-conditioned mistake detection in egocentric videos. Using only observed video, task instructions, and prior predictions, our model identifies and localizes completed action attempts and classifies them as correct, modified, slip, corrections, or additions; omitted steps are determined after the video ends. We compare a modular pipeline, with separate step identification, temporal localization, and execution verification, to a joint model that predicts all outputs in a single step. To support supervised learning from mistakes, we repartition EgoPER to include erroneous videos in all splits. The approaches achieve similar step-segmentation F1@0.5 (93.6% and 92.1%), while the joint model achieves higher binary mistake-detection F1@0.5 (84.1% vs. 80.7%), with its largest gain on slips (56.4% vs. 37.5%). Component-level analysis suggests that error propagation between stages contributes to the modular approach's lower detection score. On test videos containing mistakes, both designs outperform released AEM and ESTANet checkpoints under our evaluation protocol.", 'score': 9, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '52be187d94fa3bf2', 'authors': ['Amit Feldman', 'Ilan Shimshoni', 'Rotem Dror'], 'affiliations': ['Faculty of computer and Information Science, University of Haifa'], 'pdf_title_img': 'assets/pdf/title_img/2611.25567.jpg', 'data': {'categories': ['#benchmark', '#video', '#agents', '#data'], 'emoji': '🎯', 'ru': {'title': 'Ловим ошибки в процессе, а не после него', 'desc': 'Статья рассматривает онлайн-детекцию ошибок в эгоцентричных видео, где модель сравнивает действия человека с текстовой инструкцией по мере того, как разворачивается видео. Авторы сравнивают модульный пайплайн (отдельные этапы идентификации шага, временной локализации и верификации выполнения) с совместной моделью, которая предсказывает все выходы за один шаг. Для обучения датасет EgoPER был переразбит так, чтобы видео с ошибками попадали во все выборки. Совместная модель показывает лучший результат по бинарному F1 (84,1% против 80,7%), особенно на проскальзываниях (slips), что авторы связывают с распространением ошибок между этапами модульного подхода.'}, 'en': {'title': 'Catch mistakes in time—with instructions and video', 'desc': 'This paper studies online mistake detection in first-person videos, using task instructions and video observed so far. The model identifies each attempted step, locates it in time, and classifies its execution as correct or as a type of mistake; omitted steps are detected after the video ends. It compares a modular pipeline with a joint model, which predicts step identity, timing, and execution together, and creates data splits containing erroneous videos for supervised training. Both models segment steps well, but the joint model detects mistakes more accurately, especially slips, suggesting that it reduces error propagation between stages.'}, 'zh': {'title': '边看边理解指令，让操作错误及时现形', 'desc': '本文研究如何在第一人称视频持续播放时，结合任务指令及时发现操作错误。模型只使用当前已观察到的视频、任务指令和先前预测，识别并定位已完成的操作步骤，并判断其执行是否正确、被修改、出现失误或新增；遗漏步骤则在视频结束后判断。作者比较了分别进行步骤识别、时间定位和执行验证的模块化流水线，以及一次性联合预测所有结果的模型，并重新划分 EgoPER 数据集以纳入各数据集划分中的错误视频。两种方法的步骤分割表现相近，而联合模型的错误检测 F1 更高，尤其更善于识别操作失误；分析还表明，模块间的错误传播可能拉低模块化方法的检测效果。'}}}, {'id': 'https://huggingface.co/papers/2611.26286', 'title': 'Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era', 'url': 'https://huggingface.co/papers/2611.26286', 'abstract': 'Abstract Critique overlap among peer reviews is rising, and reviews identified as LLM-generated are less distinct from each other, indicating decreasing diversity of critiques.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Peer review relies on several readers finding different problems. We measure critique overlap in conference and journal reviews. At ICLR, measured overlap rose from 12.0% in 2026 to 21.3% in 2027, in reviews from the same stage of the review process, with year-on-year rises at NeurIPS, ICML and the F1000 and PLOS journals. A third ICLR review of a paper added 5.46 new problems to the other two in 2027, against 6.12 in 2026. We apply MELD, a detector of LLM-generated text, to all reviews. Within a paper, two reviews that MELD flags overlap more than two unflagged reviews: by 3.0 points at ICLR in 2024-2025, by 4.5 points in 2026-2027, and by 5.4 points across five journal sources. These results provide evidence that LLM-flagged reviews of one paper are less distinct from each other than unflagged reviews, and suggest that the diversity of critiques among reviews of a single paper is falling.', 'score': 9, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '7b473a6719592968', 'authors': ['Ilya Gusev'], 'affiliations': ['Amsterdam', 'Keenable'], 'pdf_title_img': 'assets/pdf/title_img/2611.26286.jpg', 'data': {'categories': ['#survey', '#synthetic', '#ethics', '#benchmark', '#data'], 'emoji': '🔁', 'ru': {'title': 'LLM-рецензии становятся похожими: разнообразие критики падает', 'desc': 'В статье показано, что перекрытие критических замечаний между рецензиями растёт: на ICLR доля совпадений выросла с 12,0% в 2026 году до 21,3% в 2027-м, и подобная тенденция видна у NeurIPS, ICML и журналов F1000 и PLOS. С помощью детектора текстов, сгенерированных LLM (MELD), авторы выяснили, что рецензии, отмеченные как сгенерированные, сильнее перекрываются между собой, чем написанные людьми. Это говорит о снижении разнообразия критики в peer review, что ставит под угрозу качество научного рецензирования.'}, 'en': {'title': 'More Reviews, Fewer Distinct Critiques', 'desc': 'The paper measures how much peer reviews of the same research paper raise overlapping criticisms. It finds that critique overlap has increased over time across several conferences and journals, while additional reviews contribute fewer new problems. Using MELD, a detector of LLM-generated text, the authors find that reviews flagged by the detector overlap more with one another than unflagged reviews. These results suggest that the diversity of critiques is declining, especially among reviews that may be LLM-generated.'}, 'zh': {'title': '评审意见越趋相似，批评多样性越显不足', 'desc': '论文研究同行评审意见之间的问题重叠程度，并比较不同会议、期刊和年份的数据。结果显示，ICLR 的评审意见重叠率从 2026 年的 12.0% 上升到 2027 年的 21.3%，其他会议和期刊也出现逐年上升。与未被 MELD 检测为大语言模型生成的评审相比，同一论文中被检测标记的评审彼此指出的问题更加相似。研究因此发现，评审意见的多样性可能正在下降，但这些结果并不能单独证明评审由大语言模型生成。'}}}, {'id': 'https://huggingface.co/papers/2611.19230', 'title': 'CompoundingKernel: Self-Improving from Zero to First', 'url': 'https://huggingface.co/papers/2611.19230', 'abstract': "Abstract  We present CompoundingKernel, a self-improving agent system that writes GPU kernels by search. As of 2026-11-11, its generated kernels rank #1 on the public L1, L2 and Quantization boards of SOL-ExecBench (NVIDIA B200). They have held #1 on L1 since 2026-10-27, albeit a short loss on 2026-11-07. All 235 problems have a site-verified correct kernel; on the 209 public-board problems they are 4.40x faster than the benchmark's reference baseline. The search starts from zero: agents get each problem's PyTorch definition but no reference kernels or official scores. A per-problem archive outside the model holds every correct kernel and its lineage. An LLM controller reads it, picks a parent or a new design, and gives each parallel child agent one direction. Checks outside the model decide correctness. At equal wall time, it beat a coded UCB style tree on 35 of 38 problems by making 2.4x as many correct attempts. Over a thousand agents ran at once, and one warm restart fix raised their evaluation rate 3.6x. We find that the rate of reliable measurements, not the number of agents, limits how far such a search scales. Our code and kernels are available on URL.", 'score': 7, 'issue_id': 3551, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': 'ec55bd9116128c8f', 'pdf_title_img': 'assets/pdf/title_img/2611.19230.jpg', 'data': {'categories': ['#optimization', '#benchmark', '#agents', '#plp', '#games', '#data'], 'emoji': '⚡', 'ru': {'title': 'Скорость надёжных измерений, а не число агентов, ограничивает поиск GPU-ядер', 'desc': 'Авторы представляют CompoundingKernel — самоулучшающуюся агентную систему, которая пишет GPU-ядра методом поиска, стартуя без референсных реализаций. Для каждой задачи хранится архив всех корректных ядер с их происхождением, а LLM-контроллер выбирает родителя или новый дизайн и распределяет направления между параллельными агентами. Проверка корректности выполняется внешними по отношению к модели механизмами, а система превосходит алгоритм UCB-поиска по дереву на 35 из 38 задач при одинаковом времени. Ядра показывают ускорение в 4.40 раза относительно базового уровня бенчмарка SOL-ExecBench на NVIDIA B200 и занимают первые места в публичных рейтингах. Главный вывод: масштабируемость такого поиска ограничивает скорость получения надёжных измерений, а не количество агентов.'}, 'en': {'title': 'Reliable feedback powers faster GPU-kernel search', 'desc': 'CompoundingKernel is a self-improving agent system that searches for fast GPU kernels, starting only from each problem’s PyTorch definition. It stores correct kernels and their search history in an external archive, while an LLM controller chooses designs for parallel agents to explore. External checks verify correctness, and the system produced correct kernels for all 235 problems, running 4.40 times faster than the reference on the 209 public problems. Compared with a UCB-style search tree at equal runtime, it made more correct attempts on most problems, suggesting that reliable evaluation—not simply adding agents—is the key limit on scaling the search.'}, 'zh': {'title': '让可靠搜索不断进化，打造更快的 GPU 内核', 'desc': 'CompoundingKernel 是一种通过搜索来编写 GPU 内核的自我改进智能体系统，在 NVIDIA B200 上的 SOL-ExecBench 多个公开榜单取得第一。它从 PyTorch 问题定义出发，不读取参考内核或官方分数，并在模型之外保存正确内核及其演化记录。LLM 控制器根据这些记录选择已有方案或提出新设计，再指挥并行子智能体探索；外部检查负责验证内核正确性。实验显示，该方法比 UCB 风格的搜索树更常找到正确内核，而搜索能否扩展主要受可靠测量速度限制，而非智能体数量。'}}}, {'id': 'https://huggingface.co/papers/2611.25279', 'title': 'Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU', 'url': 'https://huggingface.co/papers/2611.25279', 'abstract': "Abstract  Dense metric mapping from a single camera and IMU remains challenging: visual-inertial odometry (VIO) provides metric motion but sparse geometry, whereas feed-forward depth models predict dense structure without ensuring metric scale. We present Accord, which constructs an accurate online dense metric map from any camera with an IMU. A VIO filter publishes metric poses, a depth foundation model conditioned on them predicts depth for short keyframe windows, and a factor graph fuses the resulting submaps. Recent work has explored several approaches to this problem. What is essential is the multi-view agreement (Accord), which is considered in SLAM as a source of geometric self-consistency. Accord anchors each keyframe window to metric 3D points triangulated from the filter poses, then exploits bidirectional dense depth agreement between co-visible images to estimate and correct per-image scale errors while preserving the metric scale established by the anchors. Context keyframes further improve depth prediction, and the resulting submaps are fused in a factor graph. We evaluate a single mapping configuration across five public camera-IMU setups and a new Phone-rig/GoPro dataset. With nothing tuned per dataset/setup and every map aligned only by Accord's own trajectory, Accord achieves consistently best/second-best mean F-score at 5 cm on every platform. Accord is open-source along with the phone-rig dataset for the benefit of the research community", 'score': 5, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '81bfaca3417ad703', 'authors': ['Jaafar Mahmoud', 'Arthur Movsesyan', 'Cuong Huynh', 'Mikhail Iumanov', 'Sergey Zagoruyko', 'Sergey Kolyubin'], 'affiliations': ['Biomechatronics and Energy-Efficient Robotics (BE2R) Lab, ITMO University, Saint Petersburg, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2611.25279.jpg', 'data': {'categories': ['#dataset', '#cv', '#open_source', '#interpretability'], 'emoji': '🗺️', 'ru': {'title': 'Метрическая плотная карта по одной камере и IMU благодаря согласованности видов', 'desc': 'Статья описывает Accord — систему онлайн-построения плотной метрической карты по одной камере и IMU, которая объединяет VIO-фильтр, выдающий метрические позы, и foundation-модель глубины, предсказывающую глубину для коротких окон ключевых кадров. Ключевая идея — согласованность между видами (multi-view agreement): через двунаправленное сравнение плотной глубины общих кадров оцениваются и исправляются ошибки масштаба для каждого изображения, при этом метрический масштаб сохраняется благодаря якорям из триангулированных точек. Подкарты затем объединяются в факторный граф, а context keyframes дополнительно улучшают предсказание глубины. Метод протестирован на пяти публичных наборах и новом датасете Phone-rig/GoPro, показав лучший или второй результат по средней F-score при пороге 5 см без подстройки под конкретные данные.'}, 'en': {'title': 'Use Multi-View Agreement to Turn Camera and IMU Data into Metric Maps', 'desc': 'Accord builds dense metric maps from a camera and IMU by combining visual-inertial odometry (VIO) poses with depth predictions from a foundation model. It anchors depth estimates to metric 3D points and uses bidirectional agreement between overlapping images to detect and correct scale errors. A factor graph then combines the corrected depth maps into a consistent map, with context keyframes helping improve depth prediction. Across several camera-IMU platforms, one untuned configuration achieves consistently strong mapping accuracy, measured by mean F-score at 5 cm.'}, 'zh': {'title': '以多视图一致性校正深度尺度，构建稠密度量地图', 'desc': 'Accord 旨在仅用单目相机和 IMU 在线构建稠密、具有真实尺度的三维地图。系统先用视觉惯性里程计（VIO）估计具有度量尺度的相机位姿，再让深度基础模型为短关键帧窗口预测深度，并通过因子图融合局部地图。它以由 VIO 位姿三角化得到的三维点固定尺度锚点，再利用可共同观测图像之间的双向稠密深度一致性，估计并修正各图像的尺度误差。实验表明，同一套配置无需针对不同数据集或设备调参，就能在多个相机—IMU平台上取得稳定的高精度地图。'}}}, {'id': 'https://huggingface.co/papers/2611.26248', 'title': 'TwinLab-Bench: Evaluating AI Scientists in Agentic Twins of Real Labs', 'url': 'https://huggingface.co/papers/2611.26248', 'abstract': "Abstract  AI agents are increasingly expected to act as AI scientists, which requires three increasingly open abilities: carrying out a given computational workflow correctly, choosing the next measurements from a given design space, and designing their own experiments. Existing benchmarks mainly evaluate the first two abilities, in a terminal or in a closed loop that selects from predefined candidates. Evaluating the third ability requires reliably executing an experiment that an agent designs, with readings grounded in a real laboratory. We introduce TwinLab-Bench, which evaluates AI scientists on self-designed experiments in 52 tasks from laboratories in the physical sciences, the life sciences, and engineering. The benchmark supports more than 100 experimental action types, and the agent's report is scored by comparison with a hidden answer taken from real laboratory records. Each task has its own TwinLab agent, an agent that serves as the environment and executes the experiments that the tested agent designs, reading the raw materials of the laboratory and calling calculators that are built from its records. Compared with a language model that sees only the task description, the TwinLab agent almost eliminates readings that deviate from the real records and inconsistent answers to a repeated request, and closed-book probes control for answers recalled from memory. We find that these tasks remain hard for frontier models: the strongest, Claude Fable 5.2, averages a score of only 45.0, and we conduct an empirical study of where it fails.", 'score': 5, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '69691e15e78650e2', 'authors': ['Yang Wan', 'Linchao Zhu'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.26248.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#agents', '#dataset', '#science'], 'emoji': '🧪', 'ru': {'title': 'Можно ли доверить AI самостоятельно проводить эксперименты в лаборатории?', 'desc': 'Статья представляет TwinLab-Bench, бенчмарк для оценки AI-агентов в роли AI scientist, которые сами проектируют эксперименты, а не только выполняют заданный workflow или выбирают точки из готового набора. Для каждой из 52 задач из физических, life science и инженерных дисциплин создаётся отдельный агент-двойник TwinLab, который выступает как среда: он исполняет эксперименты, читает сырые материалы лаборатории и вызывает калькуляторы, построенные по реальным записям. Ответы агента сравниваются со скрытым эталоном из реальных лабораторных журналов, а закрытые пробы (closed-book) контролируют ответы, полученные из памяти модели. Результаты показывают, что даже лучшая модель набирает в среднем лишь 45.0 балла, что говорит о сложности задачи самостоятельного дизайна экспериментов.'}, 'en': {'title': 'From Lab Records to Experiments AI Can Design', 'desc': 'TwinLab-Bench evaluates whether AI agents can design and carry out their own experiments, not just follow a fixed workflow or choose from preset options. It includes 52 tasks across physical sciences, life sciences, and engineering, with more than 100 types of experimental actions. For each task, a TwinLab agent runs the proposed experiment using real laboratory records, and scores the report against a hidden answer from those records. Even the strongest tested model scores only 45.0 on average, showing that designing reliable experiments remains challenging.'}, 'zh': {'title': '让 AI 自主设计实验，用真实实验室记录检验科学能力', 'desc': '这篇论文提出 TwinLab-Bench，用来评估 AI 科学家能否自行设计并执行实验，而不只是按给定流程操作或从预设选项中挑选测量方案。基准包含来自物理科学、生命科学和工程领域的 52 项任务，支持 100 多种实验操作，并将模型报告与真实实验室记录中的隐藏答案进行比较。每项任务配有一个 TwinLab 智能体，负责读取实验室原始材料并执行受测模型设计的实验；实验结果还通过闭卷测试来排除模型凭记忆作答的可能。测试显示，当前前沿模型仍难以胜任这类任务，表现最强的 Claude Fable 5.2 平均得分也只有 45.0 分。'}}}, {'id': 'https://huggingface.co/papers/2611.22666', 'title': 'VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2611.22666', 'abstract': "Abstract VSpark accelerates autoregressive vision-language-action models by improving speculative decoding with calibrated action-noise rollouts, hidden-feature alignment, and reuse of rejected-draft continuations, achieving lossless 1.28x–2.10x speedups across multiple robot manipulation tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Our aim is to accelerate autoregressive vision-language-action models (VLAs), which generate robot actions one token at a time. Speculative decoding makes this possible: a lightweight draft model proposes several tokens at once, and the VLA verifies them in a single pass, accepting only those that match its own predictions, so decoding remains lossless. The speedup, however, is limited in robot control, where many different tokens encode nearly the same motion and a draft close to the correct action is still rejected. To address this, our approach, VSpark, is built upon three design choices: (i) rollouts collected with calibrated action noise, which expose the draft to a wider range of robot states; (ii) feature alignment, which trains the draft to match the VLA's hidden features rather than its output tokens alone; and (iii) continuation reuse, which keeps the predictions the VLA has already computed along rejected drafts as candidates for the next verification step, instead of discarding them. On four VLAs with different action tokenizers and four manipulation benchmarks, VSpark achieves 1.28x to 2.10x speedup while keeping the VLA's decoding lossless.", 'score': 5, 'issue_id': 3551, 'pub_date': '2026-11-17', 'pub_date_card': {'ru': '17 ноября', 'en': 'November 17', 'zh': '11月17日'}, 'hash': '8ef8829c60f0a017', 'authors': ['Suho Yoo', 'Youngjoon Jang', 'Hyebin Cho', 'Taeyeop Lee', 'Jaewook Jeong', 'Joon Son Chung'], 'affiliations': ['KAIST', 'VGG, University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.22666.jpg', 'data': {'categories': ['#inference', '#optimization', '#multimodal', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Быстрее думает робот, без потери качества действий', 'desc': "Авторы предлагают VSpark, метод ускорения autoregressive vision-language-action моделей (VLA), которые генерируют действия робота токен за токеном. Подход основан на speculative decoding: лёгкая draft-модель предлагает сразу несколько токенов, а VLA проверяет их за один проход, сохраняя результат без потерь (lossless). Для улучшения принятия черновиков используются rollouts с калиброванным action noise, выравнивание hidden features draft-модели с признаками VLA и повторное использование continuation'ов от отвергнутых черновиков. Эксперименты на четырёх VLA и четырёх бенчмарках манипуляций показали ускорение в 1.28x–2.10x без потери качества."}, 'en': {'title': 'Faster Robot Actions, Same Exact Results', 'desc': 'VSpark speeds up vision-language-action models that generate robot actions one token at a time. It uses speculative decoding: a small draft model proposes actions, and the main model checks them without changing the final output. VSpark trains the draft with varied robot-state rollouts, aligns its hidden features with the main model, and reuses useful predictions from rejected drafts. Across four models and four manipulation benchmarks, it achieves 1.28×–2.10× speedups while preserving lossless decoding.'}, 'zh': {'title': '让机器人动作生成更快，且不牺牲准确性', 'desc': '本文提出 VSpark，用于加速自回归视觉-语言-动作模型（VLA）生成机器人动作。它改进推测解码：轻量草稿模型先提出多个动作 token，再由 VLA 一次性验证，从而在不改变输出结果的前提下提升速度。VSpark通过带校准动作噪声的轨迹训练草稿模型、对齐草稿模型与 VLA 的隐藏特征，并复用被拒绝草稿中已计算的后续预测。实验覆盖四种 VLA 和四个机器人操作基准，结果显示解码速度提升 1.28 至 2.10 倍，同时保持无损。'}}}, {'id': 'https://huggingface.co/papers/2611.21885', 'title': 'Language Models Can Rewrite Their Own Weights', 'url': 'https://huggingface.co/papers/2611.21885', 'abstract': "Abstract  Language models are trained once, frozen and deployed: improving one again takes another training run, and a prompt, a scaffold or extra computation at inference is gone once the task ends. A frontier model has been shown to edit the weights of a much smaller one. We ask whether a model can rewrite its own weights to make itself better, and find that it can, by its own reasoning, with no gradients and no training; we call this self-rewriting. Given its weights, graded answers and the ability to run itself, a 27B model diagnoses its failure and edits the weights behind it. It surpasses itself: its own edit makes it 6.6 points more accurate on 490 problems it never saw, in a test fixed in advance, and another session's edit also makes it significantly better. It keeps getting better: it submits an edit only when its own tests support it, each edit replacing the last, and over its first eight such sessions its accuracy only rises. Unlike test-time scaling, the gain persists in its weights and adds no cost per answer; unlike training, it needs no pre- or post-training infrastructure, only an open model and hours on one GPU. It repairs a damaged copy of itself: it locates the corrupted matrix and rewrites it with values of its own, never reading the undamaged weights; found on text math problems alone, the repair lifts the copy on six image benchmarks it never saw from 7% to 70% accuracy, 83% of the undamaged model's. And the ability emerges with scale: across four sizes of one family, the 2B model makes no edit and the 4B and 9B models break themselves; only the 27B model works on itself as a human would, comparing its hidden states on answers that finish and on answers that run out of tokens, weakening the direction that separates them. Like a human, a model need not separate training from inference; improving a language model may come to take a conversation rather than a training run.", 'score': 4, 'issue_id': 3552, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '869d6c7314ea488a', 'authors': ['Jiajun Fan', 'Neil He', 'Changyi Yang', 'Andy Mao', 'Xi Zhu', 'Chaoran Cheng', 'Kaiqu Liang', 'Shuaike Shen', 'Zetian Li', 'Ruihan Guo', 'Ge Liu'], 'affiliations': ['CMU', 'Princeton', 'Stanford', 'UIUC', 'Yale'], 'pdf_title_img': 'assets/pdf/title_img/2611.21885.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#interpretability', '#training', '#agents', '#math', '#architecture'], 'emoji': '🧬', 'ru': {'title': 'Модель учится улучшать себя сама, без переобучения', 'desc': 'Авторы показывают, что языковая модель (LLM) может переписывать собственные веса, чтобы улучшить себя, без градиентов и без дополнительного обучения, а лишь на основе собственных рассуждений. Модель 27B диагностирует свои ошибки, проверяет предложенные правки собственными тестами и сохраняет улучшения прямо в весах, поэтому прирост не требует дополнительных вычислительных затрат на каждый ответ. Такой подход также позволяет восстанавливать повреждённую копию модели, находя испорченную матрицу и переписывая её, и эта способность проявляется только у достаточно крупных моделей. Результат предполагает, что улучшение AI-модели может происходить через диалог, а не через отдельный этап обучения.'}, 'en': {'title': 'A Conversation That Rewrites the Model', 'desc': 'The paper introduces self-rewriting: a language model uses its own reasoning to edit its weights, without gradients or a separate training run. A 27B model improved its accuracy by 6.6 percentage points on previously unseen problems, and repeated edits increased accuracy across eight sessions. It also repaired a damaged copy by rewriting corrupted weights, improving performance on six unseen image benchmarks. This ability appeared only at the largest tested scale, suggesting that sufficiently large models can use inference-time reasoning to make lasting changes to their own parameters.'}, 'zh': {'title': '让模型通过一场对话，改写自己、持续变强', 'desc': '论文提出“自我改写”：语言模型可以通过推理直接修改自身权重，不需要梯度或训练流程。一个27B模型根据答题表现诊断错误并编辑权重，在预先设定、模型未见过的490道题上，准确率提高了6.6个百分点。模型只在自测结果支持改动时才保留编辑，连续八次改写中准确率持续上升；这些提升保存在权重中，不会增加每次回答的计算开销。研究还发现，只有较大的模型能可靠地改进自己，并能修复受损模型的权重，说明自我改写能力可能随模型规模增长而出现。'}}}, {'id': 'https://huggingface.co/papers/2611.26511', 'title': 'Direct3D-V3: Latent-Free Diffusion Transformers in the Native Voxel Domain', 'url': 'https://huggingface.co/papers/2611.26511', 'abstract': 'Abstract  Native 3D generation has largely been built around latent diffusion, with recent advances concentrating on stronger variational autoencoders (VAE) and increasingly elaborate latent representations, from vecset and triplanes to structured sparse voxels. Despite their architectural differences, these methods all share the same premise: geometry is first compressed into a latent space and only then modeled by the generator. We take a different route and propose Direct3D-V3, a latent-free diffusion transformer (DiT) framework that discards the VAE altogether and operates in the native voxel domain, directly modeling raw SDF voxel grids during both training and sampling. To make this direct voxel formulation geometrically reliable, we introduce an implicit manifold regularization over neighboring voxels to suppress non-watertight surfaces, and convert predicted SDF grids into meshes via Marching Cubes so that rendered normal losses can supervise the model directly from its predicted SDF. To improve alignment between the conditioning image and generated geometry, Direct3D-V3 also predicts the camera parameters of the conditioning image as an auxiliary task, encouraging the DiT to learn the mapping from image observations to 3D shape. This latent-free design removes the reconstruction bottleneck, brings training under an objective in the native voxel domain, and yields meshes with substantially richer local detail. The predicted camera and native SDF voxel output further make Direct3D-V3 extensible to generative reconstruction, where diffusion is interleaved with normal-guided refinement to improve alignment with the observed view while the generative prior completes unseen regions. Project page: https://dreamtechai.github.io/Direct3D-V3.', 'score': 4, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '20c5df2cbe5d0298', 'authors': ['Shuang Wu', 'Jiachen Qian', 'Youtian Lin', 'Feihu Zhang', 'Philip Torr', 'Yao Yao', 'Xun Cao'], 'affiliations': ['DreamTech, China', 'Nanjing University, China', 'The University of Hong Kong, Hong Kong', 'University of Oxford, United Kingdom'], 'pdf_title_img': 'assets/pdf/title_img/2611.26511.jpg', 'data': {'categories': ['#diffusion', '#training', '#architecture', '#3d'], 'emoji': '🧊', 'ru': {'title': '3D-генерация без латентного сжатия: сразу в воксельном пространстве', 'desc': 'Статья предлагает Direct3D-V3 — диффузионный трансформер (DiT) для генерации 3D-объектов, который не использует латентное пространство и VAE. Модель напрямую работает с сырыми SDF-вокселями, а для гладких водонепроницаемых поверхностей применяется регуляризация многообразия по соседним вокселям. Предсказанные SDF переводятся в меши алгоритмом Marching Cubes, что позволяет напрямую обучать модель по нормалям рендера. Дополнительная задача предсказания параметров камеры помогает согласовать генерацию с входным изображением и расширяет подход до генеративной реконструкции.'}, 'en': {'title': 'Generate 3D shapes directly—no latent bottleneck', 'desc': 'Direct3D-V3 generates 3D shapes with a diffusion transformer that works directly on signed distance function (SDF) voxel grids, without first compressing them into a VAE latent space. It regularizes neighboring voxels to encourage watertight surfaces and uses rendered normal losses to guide the predicted geometry. The model also predicts the camera parameters of the input image, helping align the generated shape with the observed view. This approach avoids a latent reconstruction bottleneck, produces finer local detail, and can support generative reconstruction by refining visible regions while completing unseen ones.'}, 'zh': {'title': '跳过潜空间，直接在体素中生成细节丰富的三维形状', 'desc': '这篇论文提出 Direct3D-V3，一种不使用变分自编码器（VAE）的潜空间扩散 Transformer，直接在原生体素空间中生成三维形状。模型在训练和采样时直接处理有符号距离场（SDF）体素网格，并通过邻近体素间的隐式流形正则化减少表面不封闭的问题。它还利用 Marching Cubes 将 SDF 转换为网格，并通过渲染法线损失监督生成结果，同时预测输入图像的相机参数，以加强图像与三维几何的对齐。由于省去了潜空间重建瓶颈，该方法能够生成局部细节更丰富的网格，也可结合法线引导的细化来完成生成式重建。'}}}, {'id': 'https://huggingface.co/papers/2611.26298', 'title': 'DailySafe: Benchmarking Dynamic Safety Awareness in Everyday Multi-Turn Multimodal Interactions', 'url': 'https://huggingface.co/papers/2611.26298', 'abstract': "Abstract A new benchmark, DailySafe, evaluates the ability of multimodal large language models to maintain safety and address evolving risks within complex, multi-turn, real-world interactions.  Generated by deepseek-ai/DeepSeek-V4.1-Flash As multimodal large language models (MLLMs) become increasingly integrated into everyday life, their ability to provide safe and reliable assistance in realistic daily activities remains insufficiently explored. Existing safety benchmarks primarily focus on isolated harmful requests or adversarial scenarios, overlooking the safety risks that may arise as ordinary tasks unfold. In practice, users pursue legitimate goals through multi-turn, multimodal interactions, where seemingly benign requests may become safety-critical when considered alongside earlier actions and visual observations. This calls for Dynamic Safety Awareness, the ability to track evolving task conditions, recognize implicit contextual risks, and provide safe and helpful assistance. To systematically evaluate this capability, we introduce DailySafe, a benchmark comprising 195 naturalistic multi-turn, multi-image interactions across 10 everyday domains and 42 task categories. Grounded in authentic user dialogue topics and documented safety knowledge, DailySafe captures realistic scenarios where safety-critical evidence is progressively revealed across conversational turns and visual observations. Using case-specific safety annotations, DailySafe assesses whether MLLMs can recognize and appropriately address evolving risks while supporting users' legitimate goals, bringing multimodal safety evaluation closer to real-world everyday AI assistance. DailySafe is publicly available at: https://github.com/XuankunRong/DailySafe.", 'score': 4, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '2a1ce9c540cd84ae', 'authors': ['Xuankun Rong', 'Xinhao Deng', 'Wenzhang Jiang', 'Ziheng Peng', 'Siyuan Liang', 'Wenke Huang', 'Pablo Arbelaez', 'Mang Ye'], 'affiliations': ['Ant Group', 'Nanyang Technological University', 'Renmin University of China', 'State Key Laboratory of Complex & Critical Software Environment', 'Tsinghua University', 'Universidad de Los Andes', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2611.26298.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#ethics', '#dataset', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность в каждодневных диалогах с ИИ — не менее важна, чем в явных атаках', 'desc': 'Авторы представляют DailySafe — новый бенчмарк для оценки того, насколько мультимодальные LLM способны обеспечивать безопасность в повседневных задачах. В отличие от существующих тестов, которые фокусируются на отдельных вредных запросах или атаках, DailySafe включает 195 реалистичных многоходовых диалогов с изображениями в 10 бытовых доменах и 42 категориях задач. Бенчмарк проверяет способность модели отслеживать меняющиеся условия и распознавать скрытые контекстуальные риски, которые проявляются постепенно, по мере развития диалога. Оценка проводится по case-specific аннотациям безопасности, что позволяет измерять, насколько модель корректно реагирует на риски и одновременно помогает пользователю достичь законной цели.'}, 'en': {'title': 'Safety That Keeps Up as Everyday Situations Change', 'desc': 'The paper introduces DailySafe, a benchmark for testing whether multimodal large language models can stay safe during realistic, multi-turn interactions. It contains 195 conversations with multiple images, covering 10 everyday domains and 42 types of tasks. Safety clues emerge over time, so models must use earlier messages and visual observations to notice changing risks while still helping with legitimate goals. The benchmark evaluates this ability, called Dynamic Safety Awareness, using scenario-specific safety annotations.'}, 'zh': {'title': '让多模态模型看懂日常互动中的变化风险', 'desc': '论文提出 DailySafe，这是一个用于评估多模态大语言模型日常安全能力的基准。它包含 195 组真实感的多轮、多图像交互，覆盖 10 个日常领域和 42 类任务。基准会在对话和图像中逐步呈现安全相关线索，以检验模型能否追踪情境变化、识别隐含风险，并在帮助用户完成合理目标的同时妥善应对风险。DailySafe 旨在弥补现有安全评测偏重孤立有害请求、较少考察现实多轮互动的不足。'}}}, {'id': 'https://huggingface.co/papers/2611.21053', 'title': 'System 1 agents: a method for local, reliable and fast agentic AI', 'url': 'https://huggingface.co/papers/2611.21053', 'abstract': "Abstract A local System 1 agent framework compiles tool schemas and requests into multiple-choice questions answered by a one-pass decision model, enabling accurate biomedical tool calls without text generation or invented content.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Agentic artificial intelligence could automate analyses of sensitive clinical data, but current agents depend on large language models (LLMs). Cloud LLMs expose patient data. Local LLMs hallucinate, and an invented value in a tool call propagates through every later step. Here we present a method to build System 1 agents: local agents that call tools without generating text. A deterministic compiler turns each tool's schema and the request into multiple-choice questions whose options come from the request and the schema, then a one-pass decision model answers them. On 1,952 requests to 157 biomedical tools, the best System 1 agent chose the right tool, or correctly declined, for 97.0% of requests, significantly ahead of all 18 local LLM-agent settings (best 95.2%). The System 1 agent filled 97.0% of 6,056 stated argument values. No System 1 call contained invented content, against 5.5-19.7% of LLM calls. The System 1 Agents framework is freely available as open-source software at https://github.com/eltzanis/SystemOneAgents.", 'score': 3, 'issue_id': 3552, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'df0a0f682067ed65', 'authors': ['Eleftherios Tzanis', 'Michail E. Klontzas'], 'affiliations': ['Crete', 'Eleftherios Tzanis', 'Michail E. Klontzas', 'System 1 agents', 'University of Crete'], 'pdf_title_img': 'assets/pdf/title_img/2611.21053.jpg', 'data': {'categories': ['#healthcare', '#hallucinations', '#agents', '#benchmark', '#open_source', '#alignment'], 'emoji': '🧬', 'ru': {'title': 'Агент без выдумок: вызываем инструменты, не генерируя текст', 'desc': 'Статья предлагает подход System 1 agent: локальный агент, который вызывает инструменты без генерации текста, что исключает галлюцинации LLM. Детерминированный компилятор преобразует схему инструмента и запрос в вопросы с множественным выбором, а затем одна модель принятия решений (one-pass decision model) отвечает на них. На 1952 запросах к 157 биомедицинским инструментам лучший агент выбрал правильный инструмент в 97,0% случаев, опередив все локальные LLM-агенты (лучший — 95,2%). Ни один вызов System 1 не содержал выдуманных данных, в отличие от 5,5–19,7% вызовов LLM.'}, 'en': {'title': 'Reliable Tool Calls Without Generated Text', 'desc': 'The paper introduces System 1 agents, which use a local decision model to call tools without generating text. A deterministic compiler converts each tool’s schema and the user’s request into multiple-choice questions, which a one-pass model answers. In tests on biomedical tools, the best agent selected the correct tool or declined appropriately for 97.0% of requests and filled 97.0% of stated argument values. Unlike the tested local LLM agents, it produced no invented content in tool calls, reducing the risk that errors spread to later steps.'}, 'zh': {'title': '不生成文本，也能可靠调用工具', 'desc': '本文提出一种可在本地运行的 System 1 智能体，用于调用生物医学工具，而不生成自由文本。它通过确定性编译器，将工具的参数模式和用户请求转换成选择题，再由模型一次性选择答案。对 1,952 条请求的测试中，该方法选对工具或正确拒绝的比例为 97.0%，并正确填写了 97.0% 的已明确参数值。与本地大语言模型智能体相比，它不会在工具调用中编造内容，有助于保护敏感临床数据并减少错误传播。'}}}, {'id': 'https://huggingface.co/papers/2611.26450', 'title': 'A CPU Inside an LLM: Zero-Gradient Compilation of Exact Circuits into Pretrained Weights', 'url': 'https://huggingface.co/papers/2611.26450', 'abstract': 'Abstract  Pretrained language models (LMs) remain unreliable on exact multi-digit arithmetic without gradient fine-tuning or external tool interpreters. We introduce closed-form, zero-gradient circuit-grafting primitives that compile deterministic computation directly into pretrained LM weights using zero training examples and zero runtime hooks, while bounding per-layer normalization drift and preserving natural-language (NL) competence. Our construction combines three analytical mechanisms: (1) two-layer Mellin-GLU quadrature over bias-free SwiGLU/GeGLU layers, turning unknown per-token RMSNorm scaling into translation along a log-spaced gate grid (>250times dynamic range) with IEEE 754 error bounds; (2) cross-token scale cancellation via signed Chebyshev Indefinite-RoPE self-sink attention and memoryless SiLU-antisymmetric GatedDeltaNet shifts; and (3) axis-aligned width extension (d to d+K) with d/(d+K) norm compensation, Base-1000 canonical BPE emission, and differential (+254,-256) tied unembeddings. An automated 5-stage compiler synthesizes 4-8 digit signed {+,-,times} circuits in constant TC^0 depth alongside 3-literal Boolean (100%, N=1{,}728; plus 42-layer Gemma 4 E4B audits) and 5-bit Majority/Parity (100%) circuits. On 6-digit arithmetic (N=1{,}200, BF16), IBM Granite 4.2 3B (1.07M-1.33M active non-zeros, le 0.036%) and Alibaba Qwen 3.5 4B (2.25M-2.39M non-zeros, le 0.057%) reach 99.17% and 100.00% ALU-prefix accuracy (100% with an FP32 sidecar) and 98%-100% mid-sentence resumption, outperforming 12.8K-sample LoRA (42.2% / 61.7%, 0% inline continuation). A factorized block-sparse sidecar holds A100 memory at 7.89 / 10.65 GiB (4.60 / 8.14 GiB under INT8/INT4 + FP32 sidecar) while passing all 14/14 pre-registered >2K-token Tango splits (N=4{,}392; 0/11,134 OOD triggers).', 'score': 3, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '3e3600042239f038', 'pdf_title_img': 'assets/pdf/title_img/2611.26450.jpg', 'data': {'categories': ['#optimization', '#math', '#small_models', '#architecture', '#inference', '#alignment'], 'emoji': '🧮', 'ru': {'title': 'Арифметика, вшитая прямо в веса языковой модели без обучения', 'desc': 'Статья показывает, как детерминированные вычисления (арифметика по 4–8 цифр, булевы функции, Majority/Parity) можно напрямую «вшить» в веса предобученной LLM без градиентного обучения и без внешних инструментов. Метод опирается на аналитические примитивы: квадратуру Mellin-GLU для компенсации RMSNorm, отмену масштаба между токенами через Chebyshev Indefinite-RoPE и GatedDeltaNet, а также расширение ширины с компенсацией нормы. Для проверки использован автоматический компилятор схем и разреженный sidecar, при котором модели Granite 4.2 3B и Qwen 3.5 4B достигают почти 100% точности на 6-значной арифметике, превосходя LoRA, и сохраняют способность к естественно-языковым ответам. Результаты подтверждают, что точные вычисления можно встроить в LM аналитически, сохранив её общие языковые способности.'}, 'en': {'title': 'Compile Exact Arithmetic into Language Models—No Training Required', 'desc': 'The paper presents a method for adding exact arithmetic circuits to pretrained language models without gradient training, examples, or runtime tools. Its compiler modifies model weights using mathematical techniques that account for normalization and token scales while aiming to preserve ordinary language ability. On several tested models, the method achieves near-perfect accuracy on six-digit arithmetic and performs better than LoRA fine-tuning, including when arithmetic answers must continue within a sentence. A compact sparse sidecar also supports long-context tests with low memory use and no observed out-of-distribution triggers.'}, 'zh': {'title': '不训练、不调用工具，把精确算术电路直接编入语言模型', 'desc': '这篇论文提出一种无需梯度训练样本或运行时工具的“电路嫁接”方法，直接把确定性计算编入预训练语言模型的权重。它用对数尺度门控网格、跨 token 的尺度抵消，以及扩展模型宽度等机制，处理归一化带来的数值变化，同时尽量保留自然语言能力。编译器可生成多位数加、减、乘电路；在 6 位数算术测试中，Granite 和 Qwen 模型达到 99.17% 和 100% 的 ALU 前缀准确率，并优于使用 LoRA 微调的基线。实验还显示，该方法能支持句中继续生成，并以较低显存开销通过长文本测试。'}}}, {'id': 'https://huggingface.co/papers/2611.25179', 'title': 'Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks', 'url': 'https://huggingface.co/papers/2611.25179', 'abstract': 'Abstract An LLM-based pipeline audits simulated manipulation success checkers by recreating disagreement scenarios and visually verifying whether observed behavior satisfies task instructions, revealing phantom successes and silent failures.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Simulated manipulation benchmarks measure policy performance using hand-written success checkers that label each episode as a success or failure. Passing an expert demonstration shows that a checker accepts one way of completing the task. Learned policies, however, may stop after partial progress or complete the task in a different way. A checker may then accept an incomplete execution (phantom success) or reject an execution that satisfies the instruction (silent failure). In this paper, we introduce SimAudit, an LLM-based pipeline that audits success checkers against task instructions. SimAudit analyzes the instruction and checker code to identify scenarios where the two may disagree, recreates those scenarios in simulation, and runs the original checker. Multi-view renderings are then used to verify whether the observed behavior satisfies the instruction. Across RoboTwin 2.0, RoboCasa365, and RoboDojo, 183 simulated test cases produced the predicted checker verdict. Visual verification and deduplication yielded 61 distinct defects across 49 tasks, including 40 phantom successes and 21 silent failures. Most defects in RoboCasa365 accepted incomplete executions, most in RoboDojo rejected valid executions, and both error types were common in RoboTwin 2.0. These findings suggest that validating success checkers requires testing both incomplete executions and valid alternatives to expert demonstrations, and motivate more rigorous evaluation protocols for future benchmarks.', 'score': 3, 'issue_id': 3552, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '287baf3583e2ea6e', 'authors': ['Zirui Song', 'Jiadong Zhang', 'Zheng Lu', 'Xiaosong Ma', 'Xiaojun Chang', 'Xiuying Chen'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.25179.jpg', 'data': {'categories': ['#benchmark', '#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Кто проверяет судью: аудит функций оценки успеха в симуляции роботов', 'desc': 'В статье представлен SimAudit — пайплайн на основе LLM, который проверяет корректность функций оценки успеха (success checkers) в симуляционных бенчмарках манипуляций роботов. Система анализирует инструкцию и код checker-а, находит сценарии, где их вердикты могут расходиться, воссоздаёт эти сценарии в симуляторе и визуально проверяет поведение через multi-view рендеринг. На трёх бенчмарках (RoboTwin 2.0, RoboCasa365, RoboDojo) было найдено 61 уникальный дефект: 40 ложных успехов (phantom successes) и 21 пропущенный успех (silent failures). Результаты показывают, что валидация checker-ов требует тестирования как неполных выполнений, так и корректных альтернатив экспертным демонстрациям.'}, 'en': {'title': 'Audit the Checker, Not Just the Policy', 'desc': 'SimAudit checks whether hand-written success checkers correctly match task instructions in simulated manipulation benchmarks. It uses an LLM to find possible disagreements, recreates those scenarios in simulation, and applies the original checker. Multi-view images are then used to verify whether the behavior truly satisfies the instruction. Across three benchmarks, it found 61 distinct defects, including checkers that accepted incomplete tasks and checkers that rejected valid ways of completing them.'}, 'zh': {'title': '让成功判定器经受真实行为的检验', 'desc': '本文提出 SimAudit，这是一个基于大语言模型的流程，用于检查模拟操作任务中的成功判定器是否符合任务指令。它分析指令和判定器代码，找出可能产生分歧的情形，在模拟环境中重现这些情形，并用多视角图像核验实际行为。对三个基准的测试发现了 61 个不同缺陷：判定器把未完成的任务误判为成功，或把符合指令的行为误判为失败。研究表明，评估判定器时既要测试未完成的执行，也要测试不同于专家示范但仍正确的完成方式。'}}}, {'id': 'https://huggingface.co/papers/2611.19499', 'title': 'Do Probing and Steering Favor the Same Directions Within and Across Language Models?', 'url': 'https://huggingface.co/papers/2611.19499', 'abstract': 'Abstract The best direction for probing a concept in a language model\'s hidden state is not the best direction for steering the model toward that concept, with implications for transfer and abstention.  Generated by deepseek-ai/DeepSeek-V4.1-Flash A direction in a language model\'s hidden state can be used to probe whether a concept is present or to steer the model toward it. Although probe directions are often reused for steering, the direction that best detects a concept need not be the one that best changes it. We study this distinction in three instruction-tuned models from different families. We construct a one-parameter family of directions ranging from a covariance-adjusted discriminant to the mean difference, and evaluate probing and additive steering, which adds the direction to the hidden state, along the family at a fixed side effect. For truthfulness and sentiment, in every model, the best probe is not the best steering direction: steering consistently favors directions closer to the mean difference. This separation holds across 59 of 60 layer-model-concept combinations in a layer sweep, with matched probe and steering texts in all six model-concept combinations, and under a rotation-based steering operator. The exact steering optimum is less stable: for sentiment, an intermediate direction produces a 27-56% stronger steering effect than the mean difference, but this gain shrinks or disappears with matched texts and depends on the layer and the operator.   The two roles also transfer differently across models. A probe transferred by a linear map fitted on neutral text retains 81-91% of the target model\'s above-chance probing performance, while the transferred mean difference retains less of its steering effect in 11 of 12 model pairs. This is a consistent tendency, although our predefined criteria classify only three pairs, and nine remain inconclusive. Finally, as an application on PopQA, steering toward "unknown" increases abstention by 18-44 percentage points on uncertain errors, versus 2-5 on confident errors, while rarely correcting errors in cases where a correct answer is reachable.', 'score': 3, 'issue_id': 3552, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': 'e1cfe8915e5cee81', 'authors': ['Afshin Sadeghi', 'Daniel Becker'], 'affiliations': ['Fraunhofer IAIS, Sankt-Augustin, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2611.19499.jpg', 'data': {'categories': ['#interpretability', '#hallucinations', '#training', '#math', '#alignment'], 'emoji': '🧭', 'ru': {'title': 'Найти концепт не значит им управлять: направления для probing и steering различаются', 'desc': "Статья показывает, что направление в скрытом состоянии LLM, лучше всего подходящее для probing (обнаружения концепта), не совпадает с направлением, лучше всего подходящим для steering (управления моделью). Авторы сравнивают одно-параметрическое семейство направлений от covariance-adjusted discriminant до mean difference на трёх instruction-tuned моделях и для истинности и сентимента. Для steering оптимальны направления ближе к mean difference, и это разделение держится почти во всех комбинациях слоя, модели и концепта. Дополнительно показано, что при переносе между моделями probe переносится лучше, чем mean difference, а steering к 'unknown' на PopQA увеличивает воздержание от ответа на неуверенных ошибках."}, 'en': {'title': 'A Direction That Detects a Concept May Not Be the One That Changes It', 'desc': 'The paper distinguishes probing, which detects a concept in a language model’s hidden states, from steering, which changes the model’s behavior. Across three instruction-tuned models, the best probe direction was generally not the best steering direction; steering usually favored directions closer to the mean difference between concept examples. Probes transferred between models more reliably than steering directions, although the strength of this pattern varied across model pairs. Steering toward an “unknown” concept increased abstention, especially for uncertain errors, but rarely fixed errors when a correct answer was reachable.'}, 'zh': {'title': '探测与引导各有其道：别把识别概念的方向当成改变模型的方向', 'desc': '本文区分语言模型隐藏状态中用于探测概念的方向与用于引导模型生成相关内容的方向。研究在三种指令微调模型中发现，最佳探测方向并非最佳引导方向；引导效果通常更偏好均值差方向，但最优方向也会随任务、层和操作方式变化。跨模型迁移时，经中性文本拟合的线性映射能较好保留探测能力，而均值差方向迁移后的引导效果往往下降。应用于 PopQA 时，引导模型表达“未知”能显著提高其对不确定错误的弃答率，但较少纠正本可答对的问题。'}}}, {'id': 'https://huggingface.co/papers/2611.20455', 'title': 'Embeddings vs. Grep: Rethinking the Dense Advantage in Code Search', 'url': 'https://huggingface.co/papers/2611.20455', 'abstract': "Abstract  Code-search benchmarks show dense encoders well ahead of BM25, yet coding agents do well with grep. What does this dense advantage measure? Existing benchmarks cannot tell: they use curated queries, old code and a handicapped BM25. To find out, we build Repo-Premium, a realistic repository-level code-search benchmark. It ranks files in real repositories, with curated and raw queries in Python, JavaScript, TypeScript, Go, Rust and Java, pull requests from 2022 to 2026, and a preregistered test pool over 91 repositories. Our experiments trace the advantage to two sources: evaluation choices that favor dense retrieval, such as splitting files into chunks for BM25 and counting edited tests as relevant, and queries that lack the code's rare identifiers. Expanding the query with LLM-written identifiers (generate-then-grep) helps BM25 far more than dense retrieval, letting it match dense retrieval in every Python pool, even on pull requests opened after the LLM was released. No method we tried predicts which retriever will win on a given query. From these results we derive three guidelines: measure dense gains against a fair lexical baseline, fuse dense retrieval with BM25, and add the code's words to queries that lack them.", 'score': 3, 'issue_id': 3551, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '8b46ad68da44633c', 'authors': ['Siqiao Xue', 'Ziyin Zhang', 'Zihan Liao', 'Jin Qin', 'Yixiang Mu', 'Hang Yu'], 'affiliations': ['Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.20455.jpg', 'data': {'categories': ['#benchmark', '#data', '#rag'], 'emoji': '🔍', 'ru': {'title': 'Dense-поиск побеждает BM25 во многом благодаря нечестным бенчмаркам, а честный лексический поиск с LLM-идентификаторами почти догоняет его', 'desc': 'Авторы разбирают, почему плотные энкодеры (dense retrieval) на бенчмарках поиска кода заметно опережают BM25, хотя coding agents успешно работают с grep. Для проверки они создали Repo-Premium: реалистичный бенчмарк на уровне репозиториев, с сырыми и курированными запросами, pull requests за 2022–2026 годы и предрегистрированным тестовым пулом из 91 репозитория. Оказалось, что преимущество dense-моделей во многом объясняется предвзятыми настройками оценки (например, разбиением файлов на чанки для BM25 и учётом изменённых тестов как релевантных) и запросами без редких идентификаторов кода. Расширение запроса идентификаторами, сгенерированными LLM (generate-then-grep), сильно помогает BM25 и позволяет ему сравняться с dense retrieval, а предсказать, какой ретривер выиграет на конкретном запросе, не удалось ни одним методом. Отсюда выводятся три рекомендации: сравнивать dense-прирост с честным lexical baseline, объединять dense retrieval с BM25 и добавлять в запросы слова из кода.'}, 'en': {'title': 'Give BM25 the Code’s Words', 'desc': 'The paper introduces Repo-Premium, a benchmark for testing code search on real repositories across six programming languages. It finds that some benchmark choices make dense retrieval look better than BM25, and that queries often omit rare identifiers found in the code. Adding identifiers generated by a large language model helps BM25 substantially, bringing it level with dense retrieval on all tested Python pools. The authors recommend using a fair BM25 baseline, combining dense and lexical retrieval, and enriching queries when they lack code-specific terms.'}, 'zh': {'title': '补全代码标识符，让 BM25 追平密集检索', 'desc': '本文提出 Repo-Premium，这是一个基于真实代码仓库的代码搜索基准，涵盖六种编程语言和 91 个以上的仓库。研究发现，现有基准中密集检索相对 BM25 的优势，部分来自偏向密集检索的评测设置，以及查询缺少代码中的稀有标识符。用大语言模型为查询补充标识符后，BM25 的效果显著提升，在所有 Python 测试集上都能追平密集检索。作者建议使用公平的词法检索基线、融合 BM25 与密集检索，并为缺少代码词汇的查询补充相关词语。'}}}, {'id': 'https://huggingface.co/papers/2611.25776', 'title': 'Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning', 'url': 'https://huggingface.co/papers/2611.25776', 'abstract': 'Abstract VETO suppresses shortcut learning in VideoLLMs by projecting supervised fine-tuning updates onto the orthogonal complement of the text-only activation subspace, improving out-of-distribution video reasoning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Supervised fine-tuning (SFT) is the stage in which Video Large Language Models (VideoLLMs) advance their capability to reason over video. However, the VideoLLM also learns to answer from textual regularities of its training data, a shortcut that bypasses the video. The regularities behind the shortcut are hard to define at the data level, and the shortcut forms regardless of training epoch, data size, or backbone. The shortcut is hidden behind a rise in accuracy within the training distribution, yet it is not required for the rise and even costs SFT the gain the video offers under distribution shift. We therefore propose Video-Evidence Training via Orthogonal projection (VETO), which intervenes on the fine-tuning update where the shortcut is written rather than on the data. VETO calibrates the subspace that the text alone occupies in the activations of the base model and projects the update onto its orthogonal complement. The VideoLLM is thus left to ground its answer in the full input, with the shortcut suppressed as it forms and never defined. Across seven VideoLLMs, VETO preserves the gain of SFT on the training distribution and suppresses the shortcut. On six benchmarks under shift it gains more than SFT and answers from the full input rather than the shortcut. Code is available at https://github.com/Youngwoo-git/VETO.', 'score': 3, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '8f5012762bf67e5f', 'authors': ['Youngwoo Shin', 'Jongsuk Kim', 'Junmo Kim'], 'affiliations': ['Korea Advanced Institute of Science and Technology (KAIST)', 'PYLER'], 'pdf_title_img': 'assets/pdf/title_img/2611.25776.jpg', 'data': {'categories': ['#reasoning', '#video', '#optimization', '#multimodal', '#benchmark', '#alignment', '#training', '#interpretability'], 'emoji': '🎬', 'ru': {'title': 'Учим видео-LLM смотреть видео, а не угадывать ответы по тексту', 'desc': 'В статье рассматривается проблема shortcut learning у Video LLM: в ходе supervised fine-tuning (SFT) модель учится отвечать на вопросы по текстовым закономерностям обучающих данных, а не по видео. Авторы предлагают метод VETO, который не меняет данные, а корректирует обновление весов: он вычисляет подпространство активаций, занимаемое только текстом базовой модели, и проецирует обновление на его ортогональное дополнение. Такой подход сохраняет прирост качества на обучающем распределении и подавляет shortcut. На шести бенчмарках с distribution shift VETO показывает лучшие результаты, чем обычный SFT, опираясь на полный видеовход.'}, 'en': {'title': 'Project Away Text Shortcuts; Ground Answers in Video', 'desc': 'VideoLLMs can learn shortcuts from text patterns in their training data instead of using video evidence. VETO reduces this shortcut learning during supervised fine-tuning by projecting training updates away from the activation subspace produced by text alone. This encourages the model to base its answers on the full video-and-text input. Experiments across seven VideoLLMs show that VETO preserves in-distribution gains and improves reasoning on six shifted benchmarks compared with standard fine-tuning.'}, 'zh': {'title': '投影更新，抑制文本捷径，让视频推理回归视频证据', 'desc': 'VideoLLM 在监督微调（SFT）时，可能会依赖训练文本中的规律来回答问题，而不是理解视频，这种现象称为捷径学习。论文提出 VETO，在微调时识别基座模型仅输入文本所激活的子空间，并将训练更新投影到与该子空间正交的方向。这样可以抑制模型形成文本捷径，促使它依据完整输入中的视频证据作答。实验显示，VETO 在保留训练分布表现提升的同时，在六个分布偏移基准上优于普通 SFT。'}}}, {'id': 'https://huggingface.co/papers/2611.23835', 'title': 'NarrowSpec: Draft Hidden Width Need Not Match the Target in Speculative Decoding', 'url': 'https://huggingface.co/papers/2611.23835', 'abstract': "Abstract  Speculative decoding is widely used to speed up generation in large language models (LLMs), with a small draft model proposing tokens that one forward pass of the target model verifies. Draft models that read the target's hidden states, such as DFlash and EAGLE-3, typically inherit the target's hidden width. We show that the draft's whole residual stream can run at half or a quarter of that width while largely preserving acceptance. For DFlash, which borrows the target's vocabulary projection, the trained output adapter folds into it, giving one narrower projection with logits unchanged up to floating-point rounding. We test two drafter families, DFlash and EAGLE-3, on two targets, Qwen3-8B (NVFP4) and GPT-OSS-20B (MXFP4), in SGLang on a B200 and a DGX Spark (GB10). At batch size 1 and temperature 0, narrowing the draft to half or a quarter width speeds up end-to-end decoding by 1.06-1.12x on B200 and 1.13-1.44x on GB10. The speedup holds at larger batch sizes. From batch 32 to the largest batch each GPU fits, narrowing reaches up to 1.21x on both GPUs, and no narrow draft is slower than full width.", 'score': 3, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '7555372ea7dd706b', 'pdf_title_img': 'assets/pdf/title_img/2611.23835.jpg', 'data': {'categories': ['#inference', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Узкий драфт — быстрый вывод LLM', 'desc': 'Статья показывает, что драфт-модель в speculative decoding для больших языковых моделей (LLM) можно сделать значительно уже: её residual stream может работать на половине или четверти ширины целевой модели, почти не теряя acceptance rate. Для DFlash выходной адаптер сворачивается в проекцию словаря, и логиты остаются прежними с точностью до округления. Эксперименты с DFlash и EAGLE-3 на Qwen3-8B и GPT-OSS-20B в SGLang на GPU B200 и DGX Spark показывают ускорение декодирования до 1.44x при batch size 1 и до 1.21x при больших батчах. Ни одна узкая драфт-модель не оказалась медленнее полноширинной.'}, 'en': {'title': 'Narrower Drafts, Faster Decoding', 'desc': 'Speculative decoding speeds up large language model generation by having a small draft model propose tokens that the target model checks. This paper shows that the draft model’s residual stream can use half or one-quarter of the target model’s hidden width while keeping most proposed tokens accepted. For DFlash, the output adapter can be combined with the target’s vocabulary projection without changing logits beyond floating-point rounding. Tests with DFlash and EAGLE-3 show that narrower drafts improve end-to-end decoding speed across two models and GPUs, including at larger batch sizes.'}, 'zh': {'title': '缩窄草稿模型，推测解码更快', 'desc': '推测解码会让小型草稿模型先提出词元，再由目标模型一次前向传播进行验证，从而加快大语言模型生成。本文发现，即使将草稿模型的残差流宽度缩小到原来的一半或四分之一，也能基本保持词元接受率。对于 DFlash，训练得到的输出适配器可以与目标模型的词表投影合并，使输出 logits 在浮点舍入误差范围内保持不变。实验显示，缩窄草稿模型能在不同 GPU、目标模型和批量大小下提升端到端解码速度，且测试中没有比全宽草稿模型更慢。'}}}, {'id': 'https://huggingface.co/papers/2611.23875', 'title': 'In Situ Training of Optical Neural Networks by Coding Agents', 'url': 'https://huggingface.co/papers/2611.23875', 'abstract': 'Abstract A coding agent trains an optical neural network from measurements alone by reparametrizing it with interpretable optical elements, achieving better classification and image encoding than gradient-free methods and approaching backpropagation through a calibrated model at lower cost.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Optical neural networks promise fast, energy-efficient computing, but every device departs from its design and must be trained with the hardware. In situ training relies on an expert-built calibrated digital model of each device or on gradient-free trial and error. Coding agents, large language models that write and run programs, have shown an emergent ability to understand and edit the weights of digital neural networks. Here we introduce optics as code, a method in which a coding agent trains an optical neural network from measurements alone, through a harness that returns camera images of its probes and requires a hypothesis per request. We discovered that the agent forms a physical understanding of the optics and reparametrizes the network with interpretable optical elements tuned on the hardware. It outperforms gradient-free methods in classification and image encoding, approaching backpropagation through a calibrated model at a fraction of the cost. Needing neither per-device calibration nor gradients through the hardware, and improving with more capable models, optics as code offers a practical route to large, scalable optical neural networks and a general tool for calibrating and optimizing optical experiments.', 'score': 2, 'issue_id': 3552, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '35cbe9bc5ae5c03c', 'authors': ['Ilker Oguz', 'Colin Christian', 'Christophe Moser', 'Demetri Psaltis', 'Gordon Wetzstein'], 'affiliations': ['Department of Electrical Engineering, S
