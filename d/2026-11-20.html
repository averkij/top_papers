tanford University, Stanford, CA, USA', 'School of Engineering, Institute of Electrical and Micro Engineering, Ecole polytechnique fédérale de Lausanne, Lausanne, Switzerland'], 'pdf_title_img': 'assets/pdf/title_img/2611.23875.jpg', 'data': {'categories': ['#science', '#optimization', '#interpretability', '#training', '#agents', '#architecture', '#inference'], 'emoji': '🔬', 'ru': {'title': 'Агент сам учит оптическую нейросеть, глядя на свет через камеру', 'desc': 'Оптические нейронные сети обещают быстрые и энергоэффективные вычисления, но реальные устройства отличаются от проектных параметров и требуют обучения непосредственно на железе. Авторы предлагают метод optics as code, в котором AI-агент (LLM, пишущая и запускающая программы) обучает оптическую сеть только по измерениям с камеры, без калиброванной цифровой модели и без градиентов через устройство. Агент формирует физическое понимание оптической схемы и переparametrизует сеть интерпретируемыми оптическими элементами, настраивая их на самом оборудовании. Метод превосходит безградиентные алгоритмы в задачах классификации и кодирования изображений, приближаясь к backpropagation через калиброванную модель при значительно меньших затратах.'}, 'en': {'title': 'Let the Agent Learn the Optics', 'desc': 'The paper introduces “optics as code,” where a coding agent trains an optical neural network using measurements from the physical device. The agent probes the hardware, receives camera images, and proposes a hypothesis for each request, without needing a calibrated model or gradients through the device. It learns to represent the network using interpretable optical elements and tunes them directly on the hardware. This approach performs better than gradient-free methods on classification and image encoding, and comes close to calibrated-model backpropagation at lower cost.'}, 'zh': {'title': '让智能体读懂光学，让光学网络边测边学', 'desc': '光学神经网络速度快、能耗低，但真实器件与设计往往有偏差，因此需要在硬件上训练。本文提出“光学即代码”，让编程智能体仅凭测量结果训练光学神经网络：它通过探测获取相机图像，并为每次操作提出假设。智能体逐渐形成对光学系统的理解，并用易解释的光学元件重新参数化网络，再直接在硬件上调整参数。该方法在分类和图像编码任务上优于无梯度方法，效果接近基于校准模型的反向传播，同时成本更低，也不需要逐台校准或计算硬件梯度。'}}}, {'id': 'https://huggingface.co/papers/2611.26211', 'title': 'SpecWM: Turning Verification into Refinement for Streaming World Models', 'url': 'https://huggingface.co/papers/2611.26211', 'abstract': "Abstract SpecWM is a training-free inference framework for streaming video world models that verifies draft chunks using the target model's latent velocity field and applies reusable corrections via threshold-based accept/refine/reject decisions to improve visual quality, control, and speed.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recently, video world models have advanced interactive generation, with large models offering higher quality and smaller models enabling faster inference. Existing speculative methods combine their strengths through fast draft generation and selective target regeneration guided by rewards on decoded frames. However, verification covers only the external scorer's evaluation dimensions and adds decoding and scoring costs. Moreover, these scores provide no correction, requiring costly target regeneration for rejected drafts. To address these limitations, we propose Speculative World Model (SpecWM), a unified, training-free inference framework for streaming world models. It verifies draft chunks using the target's latent velocity field. Verification also yields a reusable correction; two thresholds select Accept, Refine, or Reject. Specifically, one-step refinement reuses it to improve perceptual quality, while three-step refinement strengthens camera following and trajectory consistency. These findings motivate transition-aware refinement. On WBench Navigation, SpecWM improves visual quality at 1.63times speedup over the target and raises NavScore from the draft's 75.99 to 85.63, achieving the best quality-speed-control trade-off. Additionally, our LongSpecBench shows sustained quality and control over long, multi-turn rollouts, while experiments on Hy-Nomas validate SpecWM across backbones and denoising budgets.", 'score': 2, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'b5bf34da801b0c20', 'authors': ['Jiaming Li', 'Lingzhen Li', 'Xiaze Yang', 'Chenyu Zhu', 'Kaiqi Liu', 'Xiaotong Zhao', 'Songlian Li', 'Toyota Li', 'Alan Zhao', 'Haobin Zhong', 'Yue Ma', 'Zhiyuan Ma'], 'affiliations': ['Huazhong University of Science and Technology', 'Peking University', 'Tencent', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.26211.jpg', 'data': {'categories': ['#benchmark', '#video', '#inference', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Быстрее и точнее: проверяем черновик видео без переобучения', 'desc': 'Статья представляет SpecWM — фреймворк для потоковых видео world models, работающий без дополнительного обучения (training-free). Он проверяет черновые фрагменты (draft chunks) через latent velocity field целевой модели и формирует переиспользуемую поправку, на основе двух порогов принимая решение Accept, Refine или Reject. Одношаговое и трёхшаговое уточнение улучшают перцептивное качество и согласованность траектории камеры, что даёт ускорение в 1.63 раза и рост NavScore с 75.99 до 85.63. Метод также показывает стабильное качество и управляемость на длинных многоходовых роллаутах (LongSpecBench) и хорошо обобщается на разные backbone-модели.'}, 'en': {'title': 'Verify in latent space, refine once, and stream better video faster', 'desc': 'SpecWM is a training-free inference method that helps video world models generate faster while preserving quality and control. It checks draft video chunks against the target model’s latent velocity field, avoiding extra decoding and external scoring. The check produces a reusable correction, and two thresholds decide whether to accept, refine, or reject each chunk. Experiments show improved visual quality and navigation control at higher speed, with benefits that persist across long interactions and different model settings.'}, 'zh': {'title': '借助潜在速度场校验与修正，让视频生成更快、更稳、更可控', 'desc': 'SpecWM 是一种无需训练的推理框架，用于让视频世界模型更快地生成连续视频。它利用目标模型的潜在速度场检查草稿视频片段，并从检查结果中提取可重复使用的修正信息。框架根据两个阈值决定接受草稿、进行细化或拒绝草稿；细化可提升画面质量，也能加强镜头跟随和轨迹一致性。在 WBench Navigation 上，它以 1.63 倍加速提升视觉质量，并将 NavScore 从 75.99 提高到 85.63，同时在长序列生成及不同模型设置中保持良好表现。'}}}, {'id': 'https://huggingface.co/papers/2611.26617', 'title': 'One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning', 'url': 'https://huggingface.co/papers/2611.26617', 'abstract': 'Abstract O2LaF repurposes a shared pretrained video model to learn inverse and forward latent action dynamics from unlabeled videos, achieving state-of-the-art few-shot action probing and zero-shot action transfer.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Videos reveal how the world changes, but rarely the actions that cause those changes. Latent action learning recovers such supervision from visual transitions, yet often learns the underlying dynamics largely from scratch. We ask whether a pretrained video generator can instead provide the prior for both inverse and forward dynamics. We introduce O^{2}LaF, built on a simple principle: one prior, two dynamics. We initialize both models from the same pretrained video DiT and adapt them to their distinct roles: a feed-forward transition encoder with learnable action queries for inverse dynamics, and a causal, action-conditioned video generator for forward dynamics. By controlling information access and optimizing both dynamics end-to-end through a compact bottleneck, O^{2}LaF learns transferable actions from unlabeled videos. Across navigation and robotic manipulation, O^{2}LaF sets a new state of the art in few-shot action probing and enables stronger zero-shot action transfer across visual contexts and embodiments. Beyond generative video priors, we further extend our framework to predictive representation priors such as V-JEPA2, achieving competitive performance. Our findings suggest a broader paradigm for latent-action learning: repurposing pretrained video models to discover transferable actions and predict their consequences.', 'score': 2, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '0e14515d5cec5fa8', 'authors': ['Yuxin Jiang', 'Wenqiang Sun', 'Jiaqi Li', 'Yuchao Gu', 'Lvmin Zhang', 'Ivor Tsang', 'Mike Zheng Shou'], 'affiliations': ['A*STAR, Singapore', 'Show Lab, National University of Singapore', 'Stanford University', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2611.26617.jpg', 'data': {'categories': ['#diffusion', '#video', '#optimization', '#robotics', '#architecture', '#training'], 'emoji': '🎬', 'ru': {'title': 'Одна предобученная видеомодель — два направления динамики: учим действия из видео без разметки', 'desc': 'Статья представляет O²LaF — метод обучения латентных действий по неразмеченным видео, в котором одна предобученная видеомодель (video DiT) используется как общий априор для двух моделей: инверсной динамики и прямой динамики. Инверсная модель, основанная на трансформере-энкодере с обучаемыми action queries, восстанавливает латентное действие по переходу между кадрами, а прямая — каузальный генератор видео, условленный на действии, предсказывает следующий кадр. Обе модели оптимизируются end-to-end через компактное бутылочное горлышко, что позволяет извлекать переносимые действия без разметки. Метод достигает state-of-the-art результатов в few-shot action probing и zero-shot переносе действий между визуальными контекстами и воплощениями робота, а также показывает конкурентоспособные результаты при использовании предиктивного априора V-JEPA2.'}, 'en': {'title': 'One Video Prior, Two Dynamics, Transferable Actions', 'desc': 'O2LaF learns hidden actions from unlabeled videos by using one pretrained video model as a starting point for two tasks. An inverse dynamics model infers actions from changes between video frames, while a forward dynamics model predicts future frames given actions. A compact bottleneck and controlled information flow help the two models learn transferable actions together. O2LaF achieves state-of-the-art few-shot action probing and stronger zero-shot transfer across visual contexts and robot embodiments.'}, 'zh': {'title': '一个预训练先验，学会推断动作与预测变化', 'desc': 'O²LaF 从无标签视频中的画面变化学习潜在动作，并利用一个预训练视频模型同时初始化逆向动力学和前向动力学模型。逆向模型从视觉变化推断动作，前向模型则根据动作预测之后的视频，两者通过紧凑的潜在瓶颈端到端训练。该方法在导航和机器人操作任务上取得了领先的少样本动作探测效果，并提升了跨视觉环境和不同机器人形态的零样本动作迁移能力。研究还将框架扩展到 V-JEPA2 等预测表征模型，表明预训练视频模型可以帮助发现可迁移的动作并预测其后果。'}}}, {'id': 'https://huggingface.co/papers/2611.25005', 'title': 'Inhabitant: An Agent Framework for Long-Horizon Human-Scene Interaction with Spatial Control and Quantitative Feedback', 'url': 'https://huggingface.co/papers/2611.25005', 'abstract': 'Abstract Inhabitant enables a language-model agent to plan and execute long-horizon human-scene interactions by specifying motions spatially, measuring deviations, and revising control, achieving high task completion on the Inhabit benchmark.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent work on human-scene interaction (HSI) generation moves from single interactions to long-horizon interaction, where a language-model agent plans and executes a sequence of interactions in a 3D scene under one instruction. However, existing agents struggle in challenging everyday scenarios (e.g., picking up a toy and throwing it into a basket) because they lack spatial control over the motion and quantitative feedback on its execution, and they often fail to complete the interaction sequence. To address these gaps, we present Inhabitant, a training-free agent framework in which the agent specifies each motion through positions, paths and poses, measures how the executed interaction deviates from its intent, and revises the control specification accordingly. For an extensive evaluation in such scenarios, we build Inhabit, a benchmark of 75 household tasks in 31 furniture layouts of an apartment, in which every task chains one to three goals on movable objects and is carried out by the whole body, excluding fingers. On Inhabit, Inhabitant completes 98.7\\% of the tasks with Claude Opus 5.5, and 93.3\\% and 82.7\\% with Claude Sonnet 5.5 and Gemini 4 Argon, respectively. Ablations confirm that without spatial control the agent fails most tasks, and without quantitative feedback its motion becomes less precise. Code is available on the project page.', 'score': 2, 'issue_id': 3551, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '118a0cfcfc2739ff', 'authors': ['Yao Zhang', 'Zhuchenyang Liu', 'Yu Xiao'], 'affiliations': ['Aalto University'], 'pdf_title_img': 'assets/pdf/title_img/2611.25005.jpg', 'data': {'categories': ['#reasoning', '#3d', '#robotics', '#benchmark', '#agents', '#games', '#science'], 'emoji': '🏠', 'ru': {'title': 'Агент, который учится жить в 3D-квартире: пространственный контроль плюс обратная связь', 'desc': 'Статья представляет Inhabitant — фреймворк на базе LLM-агента, который без дообучения (training-free) планирует и выполняет длинные последовательности взаимодействий человека со сценой в 3D. Агент задаёт движения через позиции, траектории и позы, измеряет отклонение выполненного действия от намерения и корректирует управление по количественной обратной связи. Авторы также создали бенчмарк Inhabit из 75 бытовых задач в 31 планировке квартиры, где задачи требуют цепочек из одного-трёх целей с перемещаемыми объектами. Абляции показывают, что без пространственного контроля агент проваливает большинство задач, а без количественной обратной связи точность движений падает.'}, 'en': {'title': 'Plan in space, measure, and refine', 'desc': 'Inhabitant is a training-free framework that lets a language-model agent carry out long sequences of whole-body interactions in 3D scenes. The agent specifies motions using positions, paths, and poses, then measures how the executed motion differs from its intended motion and revises its controls. The authors introduce Inhabit, a benchmark of 75 household tasks across 31 apartment layouts, with each task involving one to three goals using movable objects. Inhabitant achieves high task-completion rates with several language models, and ablations show that spatial control and quantitative feedback improve task success and motion precision.'}, 'zh': {'title': '用空间控制与反馈，让语言模型完成长程交互', 'desc': '这篇论文提出 Inhabitant，一个无需训练的智能体框架，让语言模型规划并执行长序列的人与场景交互任务。智能体用位置、路径和姿态来描述动作，并量化实际执行结果与预期动作之间的偏差，再据此调整控制方案。作者还构建了 Inhabit 基准，包含 75 个家庭任务，覆盖公寓中的 31 种家具布局。实验显示，Inhabitant 在多个语言模型上都取得较高的任务完成率；消融实验也表明，空间控制和量化反馈对任务成功与动作精度都很重要。'}}}, {'id': 'https://huggingface.co/papers/2611.00911', 'title': 'S1CogBench: What System One Decision Models Can and Cannot Do on Cognitive Experiments', 'url': 'https://huggingface.co/papers/2611.00911', 'abstract': 'Abstract S1CogBench evaluates System One decision models on 24 cognitive tasks, revealing that fast decisions often lack evidence-based reasoning and vary widely in reliability.  Generated by thinkingmachines/Inkling-Small Decision-making in humans and AI involves multiple cognitive abilities. System One decision models produce fast, structured choices. Their cognitive strengths and limitations, however, remain poorly understood. We introduce S1CogBench, a benchmark of 24 established cognitive tasks and 27 evaluation modes, evaluating seven open models and the API model Jev. It combines human-response prediction, autonomous execution, and controlled task manipulations to reveal strengths and failures that aggregate scores miss. We find distinct behavioral profiles across the evaluated models. In these models, strong performance on some learning tasks coexists with failures to gather information or adapt to feedback, while high accuracy does not guarantee human-like responses to changing task demands. Shared readout controls show that model rankings depend partly on how choices are extracted. Separate latency comparisons with generative language models show that long responses are much slower than direct decisions, whereas matched one-token generation adds little overhead. To our knowledge, S1CogBench is the first benchmark of System One decision models on established cognitive experiments. It provides a common empirical basis for identifying their capabilities and limitations before integrating them into automated decision systems.', 'score': 2, 'issue_id': 3551, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': 'a2760e291be245eb', 'pdf_title_img': 'assets/pdf/title_img/2611.00911.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#optimization', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Быстрое решение не всегда осмысленное: проверяем System One модели на когнитивных тестах', 'desc': 'В статье представлен S1CogBench — бенчмарк для оценки моделей System One, которые делают быстрые структурированные решения, на основе 24 классических когнитивных задач и 27 режимов оценки. Авторы сравнивают семь открытых LLM и одну API-модель, сочетая предсказание человеческих ответов, автономное выполнение задач и контролируемые манипуляции с заданиями. Результаты показывают, что высокая точность на отдельных задачах обучения не гарантирует адаптацию к обратной связи и человекоподобное поведение, а рейтинги моделей зависят от способа извлечения ответов. Также измерена задержка: длинные ответы заметно медленнее прямых решений, тогда как генерация одного токена почти не добавляет накладных расходов.'}, 'en': {'title': 'Fast decisions need more than accuracy', 'desc': 'S1CogBench evaluates seven open models and one API model on 24 cognitive tasks using 27 evaluation modes. It tests how well the models predict human responses, make decisions on their own, and adapt when task conditions change. The results show different strengths across models: success on some learning tasks can coexist with failures to gather information or respond to feedback, and high accuracy does not always mean human-like behavior. The benchmark also finds that results depend partly on how choices are extracted, while direct decisions are much faster than long generated responses.'}, 'zh': {'title': '用认知基准看清快速决策模型的能力与局限', 'desc': '本文提出 S1CogBench，这是一个包含 24 项经典认知任务和 27 种评估方式的基准，用于测试快速决策模型。研究通过预测人类反应、独立完成任务和控制任务条件，比较了七个开放模型与一个 API 模型。结果显示，不同模型的行为特点差异明显；它们可能擅长某些学习任务，却不善于主动收集信息或根据反馈调整策略，而且准确率高不代表能像人一样应对任务变化。研究还发现，模型排名会受到选择结果读取方式的影响，而直接生成决策比输出长文本快得多。'}}}, {'id': 'https://huggingface.co/papers/2611.26624', 'title': 'PlayCraft: Designing Engaging Games from Agent Play Experience', 'url': 'https://huggingface.co/papers/2611.26624', 'abstract': 'Abstract PlayCraft uses a vision-based player agent and a crafter agent to iteratively revise games, improving player learning gains and slopes across intelligence settings.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent AI agents can generate playable games, but these games are not necessarily engaging. Mastery is a key source of engagement, yet designing for it requires extensive human play and tuning. We propose PlayCraft, an automated framework that uses a vision-based agent to play games and draws on its detailed play experience to revise them for mastery. Starting from an initial game, PlayCraft alternates between playing and crafting. In the playing stage, a player agent watches the game screen, uses the controls, and pursues the game objective over repeated episodes while retaining memory. After each episode, it reports its progress, outcomes, decisions, and reflections. In the crafting stage, a crafter agent uses these reports to revise the game. It estimates player abilities, predicts performance at different proficiency levels, and compares those predictions with a target learning progression. It diagnoses the game and addresses the gaps by giving players meaningful opportunities to improve through better decisions and execution. We evaluate games in fresh runs with player agents across three intelligence settings, measuring learning gain and learning slope. Compared with the initial games, PlayCraft yields larger learning gains and steeper learning slopes in most games. It also outperforms the baselines on the macro-average of each metric at every intelligence setting.', 'score': 2, 'issue_id': 3551, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '031d049a084efc0b', 'pdf_title_img': 'assets/pdf/title_img/2611.26624.jpg', 'data': {'categories': ['#benchmark', '#agents', '#cv', '#rl'], 'emoji': '🎮', 'ru': {'title': 'Игра, которую проходит AI, становится интереснее благодаря своему опыту', 'desc': 'В статье представлен PlayCraft, автоматический фреймворк, в котором vision-based LLM-агент играет в игру и на основе своего опыта улучшает её. Агент-игрок получает визуальный вход, управляет игрой и сохраняет память между эпизодами, а агент-создатель (crafter) оценивает способности игрока и предсказывает его результаты. Цикл игры и доработки повторяется, пока кривая обучения не приблизится к целевой прогрессии, что повышает learning gain и learning slope. Эксперименты показывают, что PlayCraft превосходит базовые подходы на разных уровнях интеллекта агентов.'}, 'en': {'title': 'Play, Learn, and Craft Better Games', 'desc': 'PlayCraft is an automated framework that improves games by alternating between playing them and revising them. A vision-based player agent plays repeated episodes, remembers past attempts, and reports its progress, choices, and reflections. A crafting agent uses these reports to estimate player abilities and adjust the game toward a target learning progression, creating better chances to practice useful skills. Tests across agents with different intelligence levels show that PlayCraft usually improves learning gains and learning slopes compared with the original games and other methods.'}, 'zh': {'title': '让智能体边玩边改，打造更能促进掌握的游戏', 'desc': 'PlayCraft 是一个自动改进游戏的框架，目标是通过支持玩家逐步掌握游戏来提升游戏的吸引力。它让视觉智能体反复游玩游戏，并记录进度、结果、决策和反思，再由另一个智能体据此修改游戏。修改时，系统会估计玩家能力、预测不同熟练程度下的表现，并找出游戏与预期学习进程之间的差距。实验显示，在多种智能水平下，PlayCraft 通常能提高玩家的学习增益和学习斜率，并在各智能水平的平均指标上优于基线方法。'}}}, {'id': 'https://huggingface.co/papers/2611.15941', 'title': 'Lang-SVG: Hierarchical Image Vectorization with Language Priors', 'url': 'https://huggingface.co/papers/2611.15941', 'abstract': 'Abstract  Image vectorization reconstructs raster images as compact scalable vector graph- ics (SVG), providing a structured and editable code representation of images. However, most existing vectorization methods optimize for pixel-level render- ing fidelity, often producing SVGs that lack alignment with human-perceived object-part hierarchies, making them difficult to manipulate. To address this, we propose Lang-SVG, which introduces an explicit tree structure to organize SVG primitives with semantic labels and parent-child relationships. Lang-SVG incorporates granularity-controllable and open-vocabulary segmentation priors to initialize object-part hierarchies and leverages multimodal large language models (MLLMs) with SVG tree context to assign semantic labels to unlabeled nodes. To reduce redundancy, we introduce depth-adaptive simplification to reduce shape complexity and Tree-Guided Pruning and Merging to eliminate redundant SVG nodes. L1-SAM-Prompting further recovers missing regions to improve recon- struction fidelity and structural completeness. Beyond reconstruction fidelity, we introduce a new evaluation protocol that measures structural quality and semantic part alignment. Experiments demonstrate that Lang-SVG achieves state-of-the-art performance in both rendering fidelity and structural quality. Project website: https://xiliu8006.github.io/Lang-SVG/.', 'score': 1, 'issue_id': 3553, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '5e83b2abbc147f72', 'authors': ['Xi Liu', 'Chaoyi Zhou', 'Run Wang', 'Jiaang Li', 'Feng Luo', 'Junxiang Huang', 'Siyu Huang'], 'affiliations': ['Clemson University', 'University of Copenhagen', 'eBay'], 'pdf_title_img': 'assets/pdf/title_img/2611.15941.jpg', 'data': {'categories': ['#interpretability', '#multimodal', '#cv', '#benchmark'], 'emoji': '🖼️', 'ru': {'title': 'Векторные картинки, которые понимают структуру объектов', 'desc': 'Статья представляет Lang-SVG — метод векторизации изображений, который превращает растровую картинку в SVG с явной древовидной структурой, где каждый элемент имеет семантическую метку и связь родитель-потомок. Для построения иерархии объект-часть используются сегментационные модели с управляемой гранулярностью и открытым словарём, а MLLM (multimodal LLM) назначают метки узлам с учётом контекста SVG-дерева. Для уменьшения избыточности применяются depth-adaptive упрощение, Tree-Guided Pruning and Merging и L1-SAM-Prompting для восстановления пропущенных областей. Авторы также предлагают протокол оценки структурного качества и семантического соответствия частей, где Lang-SVG демонстрирует state-of-the-art результаты.'}, 'en': {'title': 'Make SVGs Editable by Giving Every Shape a Place in the Picture', 'desc': 'Lang-SVG converts raster images into editable SVGs organized as trees of meaningful objects and parts. It uses segmentation models to propose object hierarchies and multimodal large language models to label parts. Simplification, tree-guided pruning and merging, and a prompting method for recovering missing regions help create cleaner, more complete SVGs. The method achieves strong rendering fidelity and structural quality, including better alignment with human-perceived parts.'}, 'zh': {'title': '让 SVG 不只像图，更看得懂物体结构', 'desc': '这篇论文提出 Lang-SVG，将图像矢量化结果组织成带有语义标签和父子关系的显式树结构，使 SVG 更符合人们对物体及其部件的理解，也更易编辑。它利用可调粒度和开放词汇的分割先验构建物体部件层级，并借助多模态大语言模型结合 SVG 树上下文，为节点添加语义标签。为简化结构，方法采用深度自适应简化以及树引导的剪枝与合并来减少形状和节点冗余，并通过 L1-SAM-Prompting 补全缺失区域。论文还提出评估结构质量和语义部件对齐的新方案；实验表明，Lang-SVG 在图像渲染保真度和结构质量上均达到当前最优水平。'}}}, {'id': 'https://huggingface.co/papers/2611.25200', 'title': 'Squoosh Bench: Evaluating UX-1 on 318 Historical Website A/B Tests', 'url': 'https://huggingface.co/papers/2611.25200', 'abstract': 'Abstract  Experimentation teams must decide which proposed website changes to test with live traffic. We evaluated whether forecasts from simulated shoppers could inform that choice. We screened 412 historical website A/B tests and evaluated four systems on the 318 that ran longer than 21 days. Each system predicted an original win, a variant win, or an inconclusive result. Page roles were masked and recorded outcomes were withheld during inference. Squoosh UX-1, a model fine-tuned on human browsing data, simulated 1,000 shoppers per arm and correctly classified 267 of 318 outcomes (84.0%, 95% Wilson interval 79.5-87.6%, treating experiments as independent). Qwen3 Next 80B, the strongest general-purpose configuration on outcome accuracy, correctly classified 196 of 318 (61.6%). UX-1 favored the variant in 126 experiments. In the live tests, 118 of those variants won (93.7%), four lost, and four had inconclusive results. The remaining 192 experiments included 19 additional variant wins.', 'score': 1, 'issue_id': 3553, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': 'f953e2d35850e713', 'authors': ['Rohith Pasula', 'Johari Dramiga', 'Viraj Shah', 'Suzan Halim', 'Tyler Dooskin'], 'affiliations': ['Squoosh AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.25200.jpg', 'data': {'categories': ['#data', '#benchmark', '#science', '#agents', '#synthetic'], 'emoji': '🛒', 'ru': {'title': 'Симулированные покупатели предсказывают победителя A/B-теста', 'desc': 'Авторы оценивают, могут ли прогнозы симулированных покупателей помочь выбрать изменения сайта для A/B-тестов. Четыре системы проверялись на 318 исторических тестах, а каждая предсказывала победу оригинала, варианта или неубедительный результат без доступа к реальным исходам. Модель Squoosh UX-1, дообученная на данных человеческого поведения в браузере, правильно классифицировала 84% экспериментов, что заметно выше, чем у универсальной LLM Qwen3 Next 80B с точностью 61.6%. Когда UX-1 отдавала предпочтение варианту, он реально побеждал в 93.7% таких случаев, что говорит о высокой практической ценности подхода для отбора гипотез.'}, 'en': {'title': 'Simulated Shoppers, Smarter Website Tests', 'desc': 'The paper tests whether simulated shoppers can help teams choose which website changes to test with live traffic. Researchers evaluated four systems on 318 historical A/B tests, asking each to predict whether the original page or the variant would win, or whether the result would be inconclusive. Squoosh UX-1, fine-tuned on human browsing data, correctly classified 84.0% of outcomes, outperforming the strongest general-purpose model, which achieved 61.6%. When UX-1 favored a variant, that variant won in 118 of 126 tests, suggesting its forecasts may help prioritize experiments.'}, 'zh': {'title': '先用模拟购物者预测，再把流量留给更有希望的改版', 'desc': '这篇论文研究模拟购物者的预测能否帮助团队决定哪些网站改动值得进行真实流量 A/B 测试。研究者筛选了 412 个历史实验，并在持续超过 21 天的 318 个实验上评估四种系统；系统在看不到页面角色和实验结果的情况下，预测原方案胜出、改版胜出或结果不确定。基于人类浏览数据微调的 Squoosh UX-1 模拟每组 1,000 名购物者，正确判断了 318 个实验中的 267 个，准确率为 84.0%，高于表现最好的通用模型 Qwen3 Next 80B 的 61.6%。UX-1 预测改版会胜出的 126 个实验中，有 118 个改版最终胜出，显示模拟预测可能有助于筛选测试方案，但仍需通过真实 A/B 测试验证。'}}}, {'id': 'https://huggingface.co/papers/2611.26540', 'title': 'AURA: AUdio-dRiven streaming Avatar', 'url': 'https://huggingface.co/papers/2611.26540', 'abstract': "Abstract AURA enables low-latency, causal video generation for streaming applications by utilizing a rolling KV cache and a two-stage distillation pipeline to significantly reduce the required diffusion steps.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Current audio-driven video diffusion models can synthesize realistic talking-head videos but generally require dozens of diffusion denoising steps over multi-second video chunks, making them unsuitable for streaming applications such as voice assistants and virtual avatars, where low-latency and online causal generation are required properties. AURA generates video chunk by chunk with a rolling KV cache, requiring only the audio of the current chunk to start generating, rather than a multi-second audio look-ahead like bidirectional models. It comes in two sizes: AURA 1.3B streams 576p video in real time on a single GPU (20.7 fps for a 16 Hz playback rate), making it suited to interactive avatar applications, and AURA 5B streams 720p video at 9.7 fps. Our two-stage distillation pipeline first aligns the causal student with the teacher, by training it to match the teacher's trajectories with fewer diffusion steps and a chunk-wise sliding window causal attention mask, then applies Distribution Matching Distillation (DMD) with backward simulation to close the remaining quality gap. On standard talking-head benchmarks, AURA 1.3B runs 23x faster than its own bidirectional teacher and reaches a quality comparable to TalkVerse at a lower resolution, and AURA 5B matches its TalkVerse teacher at 720p while running 17x faster. To support reproducibility and further research on streaming avatar generation, we release the weights of both models along with a dataset of 30K synthetic videos and their precomputed teacher trajectories.", 'score': 1, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '3a8ac98c6d6ef92c', 'authors': ['Nathaniel Cohen', 'Nicolas Dufour', 'Amélie Royer', 'Alasdair Newson', 'Patrick Pérez'], 'affiliations': ['Institute of Computer Science', 'University of Oslo'], 'pdf_title_img': 'assets/pdf/title_img/2611.26540.jpg', 'data': {'categories': ['#dataset', '#diffusion', '#audio', '#video', '#training', '#synthetic', '#open_source', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Видеоаватары в реальном времени без задержек', 'desc': 'Статья представляет AURA, систему для потоковой генерации видео с говорящей головой по аудио с низкой задержкой и причинно-следственным (causal) порядком обработки. Модель генерирует видео чанками, используя скользящий KV-кэш и требуя аудио только текущего фрагмента, что отличает её от двунаправленных диффузионных моделей. Для ускорения применяется двухэтапная дистилляция: сначала студент выравнивается с учителем через сокращённое число шагов диффузии и причинную маску внимания со скользящим окном, затем применяется Distribution Matching Distillation (DMD) с backward simulation. В результате AURA 1.3B работает в 23 раза быстрее двунаправленного учителя, а AURA 5B в 17 раз быстрее при сопоставимом качестве на 720p.'}, 'en': {'title': 'AURA: Fast, Causal Video Generation for Streaming Avatars', 'desc': 'AURA generates audio-driven talking-head video one chunk at a time, so it can start using only the audio for the current chunk. A rolling key-value (KV) cache supports causal generation, avoiding the long audio look-ahead used by bidirectional models. A two-stage distillation pipeline trains a faster student to follow a teacher’s diffusion trajectories, then uses Distribution Matching Distillation with backward simulation to improve video quality. The 1.3B and 5B models stream video much faster than their teachers, making them useful for low-latency applications such as virtual avatars.'}, 'zh': {'title': '用因果生成与两阶段蒸馏，让虚拟形象实时开口', 'desc': 'AURA 是一种用于实时交互的音频驱动视频生成模型，能按视频片段逐段生成，并只需当前片段的音频即可开始工作。它利用滚动 KV 缓存保存上下文，并通过两阶段蒸馏减少扩散去噪步数，同时保持因果生成能力。AURA 有 1.3B 和 5B 两种规模，分别支持实时生成 576p 视频和较快生成 720p 视频，在基准测试中比教师模型快 17 到 23 倍且画质相近。研究还公开了模型权重、3 万段合成视频及教师轨迹，以支持复现和后续研究。'}}}, {'id': 'https://huggingface.co/papers/2611.25935', 'title': 'TwinD: Generalizing Deepfake Detection from Blending to Entire Face Synthesis', 'url': 'https://huggingface.co/papers/2611.25935', 'abstract': 'Abstract TwinD, trained on reconstruction and blob twins derived from real frames, detects both blending and entire-face-synthesis deepfakes, improving AUROC over prior detectors.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Facial deepfake detectors are usually trained on blending fakes, where a generated face is pasted back into a real frame. Recent generators synthesize the entire face and leave no traces of blending. On a benchmark of 19 datasets released from 2019 to 2026, the best prior facial deepfake detector reaches a mean AUROC of 96.2% on ten blending datasets, but none exceeds 78.1% on five datasets of entire face synthesis (EFS). AI-generated content (AIGC) detectors do not close this gap. We propose TwinD, a detector trained on FaceForensics++ fakes and two kinds of twins: fakes made from a real frame. A reconstruction twin is a real frame reconstructed by an autoencoder, with the real pixels put back in a random region. It targets the neural traces of a decoder. A blob twin blends an altered copy of a real frame with the frame itself, targeting blending artifacts. It needs no generator and no face-shaped mask. Together, these twins provide two complementary forensic cues that generalize to unseen manipulations. TwinDreaches a mean AUROC of 96.3%, 8.9 points above the prior state-of-the-art, with 98.1% on the blending datasets and 95.6% on the EFS datasets. Trained on twins alone, without a deepfake dataset, single models still reach 94.3% on average over three seeds. For reproducibility, the code, trained model, and training data are at: https://github.com/yermandy/TwinD', 'score': 1, 'issue_id': 3552, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'bd266d5f786907ae', 'authors': ['Andrii Yermakov', 'Jan Cech', 'Mario Fritz', 'Jiri Matas'], 'affiliations': ['CISPA Helmholtz Center for Information Security', 'Czech Technical University in Prague'], 'pdf_title_img': 'assets/pdf/title_img/2611.25935.jpg', 'data': {'categories': ['#interpretability', '#security', '#training', '#synthetic', '#cv', '#data'], 'emoji': '🎭', 'ru': {'title': 'Ловим дипфейки по следам, которых не оставил генератор', 'desc': 'Статья представляет TwinD — детектор дипфейков лиц, обученный на FaceForensics++ и на «двойниках» (twins), созданных из реальных кадров: реконструкциях автоэнкодером и blob-двойниках с имитацией артефактов смешивания. Существующие детекторы хорошо находят подмену лица (blending), но плохо справляются с полностью синтезированными лицами (EFS), где следов смешивания нет. Два дополняющих друг друга сигнала позволяют TwinD обобщаться на неизвестные манипуляции и достигать средней AUROC 96.3%, превосходя предыдущий state-of-the-art на 8.9 пункта. Даже обучение только на двойниках без реальных дипфейков даёт около 94.3%, а код, модель и данные опубликованы для воспроизводимости.'}, 'en': {'title': 'Two Kinds of Twins, One Stronger Deepfake Detector', 'desc': 'TwinD detects facial deepfakes by learning two complementary forensic cues. Reconstruction twins use autoencoder-reconstructed frames with some original pixels restored, helping the model recognize traces left by a neural decoder. Blob twins blend an altered frame with the original, teaching the model to detect blending artifacts without requiring a face-shaped mask or a generator. Across 19 datasets, TwinD achieves a mean AUROC of 96.3%, including strong results on both blending and entire-face-synthesis deepfakes.'}, 'zh': {'title': '用两类真实帧孪生样本，识破拼接与整脸合成深伪', 'desc': '现有面部深伪检测器多在“拼接式”伪造上训练，因此难以识别直接合成整张脸的伪造。本文提出 TwinD，使用真实视频帧生成两类训练样本：重建孪生样本用于捕捉解码器留下的神经痕迹，斑块孪生样本用于捕捉图像混合伪影。两类样本提供互补的取证线索，且不需要生成器或人脸形状遮罩。TwinD 在 19 个数据集上取得 96.3% 的平均 AUROC，在拼接式和整脸合成数据集上分别达到 98.1% 和 95.6%。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (4)', '#agents (17)', '#agi', '#alignment (6)', '#architecture (14)', '#audio (4)', '#benchmark (28)', '#cv (15)', '#data (10)', '#dataset (8)', '#diffusion (6)', '#ethics (2)', '#games (5)', '#graphs', '#hallucinations (3)', '#healthcare (1)', '#inference (10)', '#interpretability (10)', '#leakage', '#long_context (3)', '#low_resource', '#machine_translation', '#math (3)', '#multilingual (1)', '#multimodal (14)', '#open_source (5)', '#optimization (20)', '#plp (1)', '#rag (1)', '#reasoning (6)', '#rl (8)', '#rlhf (3)', '#robotics (8)', '#science (4)', '#security (3)', '#small_models (2)', '#story_generation', '#survey (1)', '#synthetic (8)', '#training (24)', '#transfer_learning (1)', '#video (14)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-21 00:34',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-21 00:34')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-21 00:34')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
