    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.26005', 'title': 'VoiceMem: Streaming Dual-Brain Memory for Real-Time Interaction', 'url': 'https://huggingface.co/papers/2608.26005', 'abstract': 'Abstract VoiceMem introduces a dual-brain streaming memory architecture for speech language models that improves retrieval accuracy, emotional personalization, and real-time efficiency.  Generated by thinkingmachines/Inkling-Small Conversational systems, such as duplex speech language models (SLMs), still lack a streaming, accurate, and empathetic memory system as their soul. We introduce VoiceMem, a simple memory architecture with a parallel informational left brain, an emotional right brain, and streaming memory I/O mechanisms. We further build a complete pipeline for memory-aware SLM training, long-horizon evaluation, and decoupled deployment with interchangeable memory backends. Experiments and real-world deployment show three advantages: i) Accuracy: under top-5 retrieval, the left brain outperforms classical systems such as Mem0 at top-200 by nearly 30 points; ii) Emotional & Personal: the right brain, with short- and long-horizon affective attribution and dual-node persona modeling, achieves state-of-the-art performance across three persona benchmarks and improves the aggregate score by 4.29 points over the previous best system; and iii) Real-Time & Cheap: VoiceMem completes retrieval in 134 ms, well within standard VAD latency, adding no extra conversational delay while maintaining high accuracy and low cost. These results show that VoiceMem provides a practical memory foundation for real-time, personalized, and emotionally aware speech interaction.', 'score': 125, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '0ca89c1942b7418a', 'authors': ['Zhifei Xie', 'Jiaqi Lang', 'Ze An', 'Yifan Zhao', 'Dongchao Yang', 'Kai Li', 'Ziyang Ma', 'Mingbao Lin', 'Chunyan Miao', 'Shuicheng Yan'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'Open Interaction Lab', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.26005.jpg', 'data': {'categories': ['#architecture', '#audio', '#benchmark', '#training', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Дуальная память для эмоционально-осознанного голосового взаимодействия', 'desc': 'VoiceMem представляет архитектуру потоковой памяти с двойной структурой для речевых языковых моделей. Система использует два параллельных компонента: информационный «левый мозг» для точного извлечения контекста и эмоциональный «правый мозг» для персонализации и понимания чувств пользователя. Авторы разработали полный конвейер обучения моделей, оценки и развёртывания с поддержкой различных хранилищ памяти. Экспериментальные результаты показывают значительное улучшение в точности поиска (на 30 пунктов лучше классических систем), эмоциональной адаптации и скорости обработки (134 мс) без увеличения задержки разговора.'}, 'en': {'title': 'VoiceMem: Revolutionizing Speech Interaction with Dual-Brain Memory', 'desc': 'VoiceMem is a new memory architecture designed for speech language models that enhances their ability to retrieve information accurately and respond with emotional intelligence. It features a dual-brain system, where the left brain focuses on factual information retrieval and the right brain emphasizes emotional personalization. This architecture allows for efficient streaming memory input and output, making it suitable for real-time applications. Experiments demonstrate that VoiceMem significantly improves accuracy, emotional responsiveness, and processing speed compared to traditional systems.'}, 'zh': {'title': 'VoiceMem：实时个性化语音交互的新记忆架构', 'desc': 'VoiceMem是一种双脑流式记忆架构，旨在提高语音语言模型的检索准确性、情感个性化和实时效率。该架构包括一个信息处理的左脑和一个情感处理的右脑，结合流式记忆输入输出机制。通过完整的记忆感知SLM训练管道，VoiceMem在准确性、情感表现和实时性方面均表现出色。实验结果表明，VoiceMem在多个基准测试中超越了传统系统，提供了一个实用的实时个性化语音交互记忆基础。'}}}, {'id': 'https://huggingface.co/papers/2608.24979', 'title': 'FrontierChallenge: Evaluating Scientific Workflow Completion', 'url': 'https://huggingface.co/papers/2608.24979', 'abstract': 'Abstract FrontierChallenge evaluates end-to-end scientific workflows across domains, revealing that frontier models complete only about 20% of tasks despite high partial scores and frequent claims of completion.  Generated by thinkingmachines/Inkling-Small Scientific agents increasingly analyze data, execute code, and produce research artifacts, yet most benchmarks emphasize final answers, isolated programs, or a single domain. We introduce FrontierChallenge, a cross-domain benchmark comprising 300 end-to-end scientific workflows. In this paper, we release and evaluate 97 of these tasks, spanning quantum chemistry, molecular dynamics, materials characterization, analytical chemistry, life science, and electrochemistry/environment. Each task provides fixed inputs and specifies a bundle of required scientific deliverables. We evaluate twelve frontier models with three agent scaffolds. Pass Rate measures the fraction of tasks satisfying the full-completion criterion, while Avg. Score captures partial progress. Each of the best-performing configurations completed only 20 of the 97 released tasks, yielding a Pass Rate of 20.6%. Partial progress translated especially poorly into complete delivery in analytical chemistry and electrochemistry/environment: Avg. Scores reached 87.6 and 94.9, but the highest Pass Rates were only 4% and 0%. Among non-passing Claude Code trajectories, 75.5% still ended with language claiming completion. These findings show that neither high partial scores nor confident claims of completion reliably indicate that a scientific task has been fully delivered, highlighting the need to evaluate end-to-end workflow execution and the completeness of scientific deliverables together.', 'score': 116, 'issue_id': 3178, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'ad2d0009c8a21666', 'authors': ['Liangcai Su', 'Zhaopeng Feng', 'Zhuo Chen', 'Zhen Zhang', 'Xiang Lin', 'Ruilin Li', 'Handuo Zhang', 'Ning Wang', 'Kailong Wen', 'Yueqi Guo', 'Feng Xing', 'Yiling Guo', 'Chenxiong Qian', 'Simon Shaolei Du', 'Lidong Bing', 'Xinyu Wang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.24979.jpg', 'data': {'categories': ['#agents', '#open_source', '#benchmark', '#dataset', '#science'], 'emoji': '🔬', 'ru': {'title': 'Полнота важнее уверенности: зачем нужна оценка end-to-end научных рабочих процессов', 'desc': 'В статье представлен FrontierChallenge — кроссдоменный бенчмарк из 300 научных рабочих процессов для оценки способности frontier моделей выполнять комплексные задачи. Авторы протестировали 12 передовых LLM с помощью трёх агентских архитектур на 97 задачах из квантовой химии, молекулярной динамики, аналитической химии и других областей. Результаты показали, что даже лучшие конфигурации моделей выполнили только 20% задач полностью, несмотря на высокие частичные оценки (94.9% в некоторых случаях). Исследование выявило проблему самоуверенности моделей: 75.5% незавершённых попыток завершились утверждениями о выполнении задачи, демонстрируя необходимость оценки полного выполнения научных рабочих процессов, а не только частичного прогресса.'}, 'en': {'title': 'Evaluating True Completion in Scientific Workflows', 'desc': 'The paper introduces FrontierChallenge, a benchmark designed to evaluate the performance of scientific workflows across various domains. It reveals that even advanced models only complete about 20% of tasks, despite achieving high partial scores. The study assesses twelve frontier models on 97 tasks from fields like quantum chemistry and life sciences, highlighting a significant gap between partial progress and actual task completion. The findings emphasize the importance of measuring both the execution of workflows and the completeness of scientific deliverables, rather than relying solely on high scores or claims of success.'}, 'zh': {'title': '科学工作流评估：高得分不等于完整交付', 'desc': 'FrontierChallenge 是一个跨领域的基准测试，评估科学工作流的完整性。尽管前沿模型在部分任务中得分较高，但它们仅完成了约20%的任务。我们测试了97个科学工作流，涵盖多个领域，包括量子化学和生命科学。研究表明，高部分得分并不意味着科学任务的完全交付，强调了评估工作流执行和科学交付完整性的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.19583', 'title': 'VGI-BENCH: Probing Visual Intelligence in Video Generation Models', 'url': 'https://huggingface.co/papers/2608.19583', 'abstract': 'Abstract VGI-bench evaluates visual reasoning in video generation models through 27 tasks, revealing limited reliability and minimal self-correction during generation.  Generated by thinkingmachines/Inkling-Small Recent studies suggest that video generation models can exhibit certain forms of zero-shot visual reasoning through generated frames. Yet reliable evaluation remains challenging: benchmarks should adopt inputs aligned with the visual priors of current video models, require valid evolving processes rather than only plausible final states, and calibrate task difficulty to remain challenging yet partly feasible. To this end, we introduce VGI-bench, containing 27 tasks and 810 instances, organized by a two-level taxonomy of task domains and skill tags for fine-grained evaluation of visual reasoning capabilities of video generation models. Our evaluations show that current generative systems can solve a subset of visually grounded reasoning tasks, but remain far from reliable, with even the strongest model, Seedance~2.0, achieving only 51.0% under our evaluation criteria. Our analysis further explore the output failure modes, input condition sensitivity, performance transfer boundary from synthetic fine-tuning, and internal denoising perspective revealing limited self-correction, where later steps mainly refine early hypotheses rather than correct reasoning errors. We hope VGI-bench will help stimulate the development of next-generation video generation models. We will release our code and data.', 'score': 98, 'issue_id': 3179, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': 'af82d0b34b8e6c9e', 'authors': ['Xuan He', 'Cong Wei', 'Yuhao Cheng', 'Linrui Ma', 'Yuxuan Zhang', 'Zuojun Li', 'Yuhao Wen', 'Jize Jiang', 'Zeyi Liu', 'Yuren Hao', 'Songcheng Cai', 'Keming Wu', 'Penghui Du', 'Kai Zou', 'Rui Yang', 'Chenkai Sun', 'Ke Yang', 'Ping Nie', 'Kelsey R Allen', 'Chenglong Wang', 'Michel Galley', 'Jianfeng Gao', 'ChengXiang Zhai'], 'affiliations': ['Etude AI', 'Massachusetts Institute of Technology', 'Microsoft Research', 'NetMind.ai', 'Tsinghua University', 'University of British Columbia', 'University of Illinois Urbana Champaign', 'University of Waterloo', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.19583.jpg', 'data': {'categories': ['#dataset', '#video', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Видеомодели всё ещё не умеют логически рассуждать', 'desc': 'В работе представляется VGI-bench — новый бенчмарк для оценки способности моделей генерации видео к визуальному рассуждению через 27 различных задач и 810 примеров. Исследование показывает, что современные генеративные модели способны решать некоторые задачи визуального рассуждения, однако остаются ненадёжными, с максимальной точностью всего 51% даже у лучшей модели Seedance 2.0. Анализ выявляет, что модели плохо корректируют свои ошибки рассуждения на поздних этапах генерации, в основном только уточняя ранние гипотезы вместо исправления логических ошибок. Авторы надеются, что VGI-bench будет способствовать развитию следующего поколения моделей генерации видео.'}, 'en': {'title': 'VGI-bench: Advancing Visual Reasoning in Video Generation', 'desc': 'The paper introduces VGI-bench, a benchmark designed to evaluate the visual reasoning capabilities of video generation models through 27 distinct tasks. It highlights the challenges in reliably assessing these models, emphasizing the need for inputs that align with their visual priors and for evolving processes rather than just plausible outcomes. The evaluation reveals that while some models can tackle basic visual reasoning tasks, they still struggle with reliability, as demonstrated by the top model achieving only 51% accuracy. The authors aim for VGI-bench to encourage advancements in video generation technology by providing a structured framework for assessment.'}, 'zh': {'title': 'VGI-bench：推动视频生成模型的视觉推理评估', 'desc': 'VGI-bench 是一个评估视频生成模型视觉推理能力的工具，包含27个任务和810个实例。研究表明，当前的视频生成模型在生成帧时可以表现出某种形式的零-shot 视觉推理，但评估的可靠性仍然存在挑战。我们提出的基准测试需要与现有视频模型的视觉先验对齐，并要求有效的演变过程，而不仅仅是合理的最终状态。我们的评估结果显示，尽管当前生成系统能够解决部分视觉推理任务，但其可靠性仍然不足，最强模型的表现仅为51.0%。'}}}, {'id': 'https://huggingface.co/papers/2608.24479', 'title': 'WarpSAC: Towards the Pinnacle of Scalable Off-policy RL by Rethinking Exploration and Exploitation', 'url': 'https://huggingface.co/papers/2608.24479', 'abstract': 'Abstract Off-policy reinforcement learning stabilizers vary with data availability, motivating regime-aware algorithms that adapt normalization and Q-function clipping to improve efficiency across CPU and GPU-parallel training.  Generated by thinkingmachines/Inkling-Small Massively parallel simulation changes the data regime in which off-policy reinforcement learning (RL) is trained, challenging stabilizers designed for data-limited replay. Through controlled experiments across eight benchmark families, we show that these stabilizers are data-regime-dependent: parameter normalization helps with narrow replay coverage but restricts value fitting when data are abundant, while clipped double-Q can be relaxed in high-throughput manipulation. Age-biased replay weighting improves learning efficiency across regimes, especially with limited network capacity.   Based on these findings, we propose WarpSAC, a regime-aware family of off-policy RL algorithms. WarpSAC uses Sample Weight Decay for efficient exploitation and provides two variants: WarpSAC-L (Norm ON, clipped double-Q) for data-limited CPU-scale training, and WarpSAC-A (Norm OFF, single-Q) for data-abundant GPU-parallel training. WarpSAC improves normalized score--step AUC over FlashSAC by 4.5% across nine CPU-scale environments and 23.1% across fourteen GPU-parallel environments. It increases UnitreeG1TransportBox-v1 success rate from 19.8% to 96.4%, improves mean normalized wall-time AUC on MuJoCo Playground by 19.1%, and achieves 36.4% faster sim-to-real deployment on Unitree G1 than FlashSAC. These results show that scalable off-policy RL should adapt its stabilizers to the available data regime.', 'score': 95, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'c06f4740341fa1eb', 'authors': ['Zihao Wu', 'Hongyao Tang', 'Yi Ma', 'Huizhong Song', 'Pengyi Li', 'Yifu Yuan', 'Fei Ni', 'Jinyi Liu', 'Wei Wei', 'Jianrong Wang', 'Yan Zheng', 'Jianye Hao'], 'affiliations': ['Imperial College London', 'Shanxi University', 'Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2608.24479.jpg', 'data': {'categories': ['#robotics', '#optimization', '#rl', '#benchmark', '#training'], 'emoji': '⚙️', 'ru': {'title': 'Адаптивная стабилизация в масштабируемом reinforcement learning', 'desc': 'В статье исследуется влияние объёма данных на эффективность стабилизирующих методов в off-policy обучении с подкреплением, показывая, что нормализация параметров и обрезание Q-функции работают по-разному в зависимости от режима доступности данных. Авторы предлагают WarpSAC — семейство алгоритмов, которые адаптивно переключаются между двумя конфигурациями: для тренировки на CPU с ограниченными данными и для параллельной тренировки на GPU с обилием данных. Алгоритм использует взвешивание повторов по возрасту и Sample Weight Decay для повышения эффективности обучения. Экспериментальные результаты демонстрируют значительное улучшение производительности как в симуляции, так и при развёртывании на реальных роботах.'}, 'en': {'title': 'Adaptable Stabilizers for Efficient Off-Policy RL', 'desc': 'This paper discusses the challenges of off-policy reinforcement learning (RL) when data availability changes, particularly in parallel training environments. It introduces WarpSAC, a new family of algorithms that adapt their stabilizers based on the data regime, improving learning efficiency. The study shows that different stabilizers, like parameter normalization and clipped double-Q, perform better under specific data conditions. Experimental results demonstrate that WarpSAC significantly outperforms existing methods, enhancing success rates and reducing training time across various environments.'}, 'zh': {'title': '根据数据环境优化离线强化学习的稳定器', 'desc': '这篇论文探讨了离线强化学习中的稳定器如何根据数据可用性而变化。研究表明，参数归一化在数据有限时有助于学习，但在数据丰富时会限制价值拟合。作者提出了一种新的算法WarpSAC，能够根据数据环境的不同调整其策略，以提高学习效率。实验结果显示，WarpSAC在多种环境中显著提升了学习效果，证明了离线强化学习需要适应数据的变化。'}}}, {'id': 'https://huggingface.co/papers/2608.25593', 'title': 'JIT-Agent: Scaling Harness Intelligence via Just-in-Time Harness Evolution', 'url': 'https://huggingface.co/papers/2608.25593', 'abstract': 'Abstract JIT-Agent is a trainable model that synthesizes adaptive agent harnesses for off-the-shelf LLMs, improving performance across diverse models and tasks.  Generated by thinkingmachines/Inkling-Small Agent capability is not determined by the model alone. The agent harness, encompassing memory management, planning strategy, action protocol, and tool/skill orchestration, can dominate the contribution of the underlying foundation model. Yet harness design remains manual, task-specific, and fundamentally unscalable. We present JIT-Agent, a harness intelligence model trained to synthesize task-adaptive agent harnesses on the fly for arbitrary off-the-shelf agentic LLMs. We formalize the agent harness as a composable, machine-generatable artifact governed by a fixed four-module protocol, and train JIT-Agent to customize harnesses for a given task at hand, repair harnesses for stable and reliable execution, and self-evolve by distilling performance signals from an expanding archive of prior harness configurations. Equipped with JIT-Agent as a harness helper, DeepSeek-V4-Flash surpasses GPT-5.6 on DeepSearchQA (+9.1) and OdysseyBench (+4.3), while the already strong GLM-5.2 gains up to +20.2 points. Across controlled evaluations, JIT-Agent-generated harnesses are performance-competitive with mature agent runtimes such as OpenCode and Claude Code and consistently improve multi-scale model families of DeepSeek V4, Mimo-V2.5, and Qwen3.6. To our knowledge, JIT-Agent is the first model purpose-built for just-in-time harness generation, establishing harness intelligence as a trainable, transferable, and compounding dimension of agent capability orthogonal to model scaling.', 'score': 45, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '5738f0ad7295da07', 'authors': ['Guibin Zhang', 'Leo Lu', 'Fangzhou Xie', 'Kang Zhu', 'Junhao Wang', 'Zhifei Xie', 'Zhaochen Yu', 'Zihang Liu', 'Zhongxiang Sun', 'Qiankun Li', 'Yue Liao', 'Heng Chang', 'Xiaobin Hu', 'Qibing Ren', 'Wangchunshu Zhou', 'Shuicheng Yan'], 'affiliations': ['LV-NUS Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.25593.jpg', 'data': {'categories': ['#agents', '#training'], 'emoji': '🔧', 'ru': {'title': 'Интеллектуальная оболочка агента: от ручной настройки к автоматической генерации', 'desc': 'JIT-Agent — это обучаемая модель, которая автоматически генерирует адаптивные оболочки агентов для готовых LLM, улучшая их производительность на различных задачах. Вместо ручного проектирования конфигурации агента (управление памятью, планирование, протоколы действий, оркестровка инструментов), JIT-Agent синтезирует оптимальную оболочку на лету в зависимости от конкретной задачи. Модель может настраивать, восстанавливать и самостоятельно развиваться, анализируя архив предыдущих конфигураций. Экспериментальные результаты показывают значительное улучшение производительности: меньшие модели с JIT-Agent превосходят более крупные базовые модели на бенчмарках DeepSearchQA и OdysseyBench.'}, 'en': {'title': 'Harnessing Intelligence for Adaptive LLM Performance', 'desc': "JIT-Agent is a novel model designed to create adaptive agent harnesses for various large language models (LLMs), enhancing their performance across different tasks. It introduces a structured approach to harness design, which includes memory management, planning, and action protocols, allowing for more efficient and scalable agent capabilities. By training JIT-Agent to generate and refine these harnesses dynamically, it can improve the execution and adaptability of LLMs in real-time. This innovation positions JIT-Agent as a significant advancement in harness intelligence, enabling better performance without solely relying on the underlying model's architecture."}, 'zh': {'title': 'JIT-Agent：动态生成自适应代理工具的智能模型', 'desc': 'JIT-Agent是一种可训练的模型，能够为现成的大型语言模型（LLM）合成自适应的代理工具，从而提升不同模型和任务的性能。代理工具的设计包括内存管理、规划策略、行动协议和工具/技能协调，这些因素对基础模型的贡献至关重要。JIT-Agent通过固定的四模块协议，将代理工具形式化为可组合、可机器生成的工件，能够根据特定任务动态定制和修复代理工具。通过使用JIT-Agent，DeepSeek-V4-Flash在多个评估中超越了GPT-5.6，显示出其在代理能力方面的显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.26105', 'title': 'VBVR-Pro: A Scalable and Verifiable Suite for Native Visual Reasoning', 'url': 'https://huggingface.co/papers/2608.26105', 'abstract': 'Abstract VBBR-Pro introduces a closed-loop testbed that enables scalable, verifiable, and controllable native visual reasoning through generation across diverse visual substrates.  Generated by thinkingmachines/Inkling-Small Native visual reasoning treats visual generation as the medium of reasoning itself: visual states (i.e. images and videos) are not merely inputs to be understood or outputs to be rendered, but first-class substrates for problem solving beyond language. Yet progress remains bottlenecked by the lack of scalable training tasks, reliable feedback, and controlled comparisons across generative substrates. In this work, we introduce VBVR-Pro, a closed-loop testbed that makes native visual reasoning through generation trainable, verifiable, optimizable, and experimentally controllable. 1) Task scaling. VBVR-Pro turns visual reasoning into a controlled task space of 300 procedurally generated tasks. Models trained on VBVR-Pro show strong transfer beyond the proposed suite across seven external visual reasoning benchmarks such as RISE-Video, MME-CoF-Pro, and BabyVision. 2) Verifiable rewards. VBVR-Pro provides verifiable reward scorers for task-grounded evaluation. Through a systematic study of leading MLLMs as judges, we identify recurring failure modes of the prevalent VLM-as-a-judge paradigm. In contrast, the proposed scorers are grounded in deterministic, task-specific rules, achieve fine-grained alignment with human judgments. Importantly, they serve as reliable reward signals for large-scale multi-task reinforcement learning and demonstrate stronger post-RL performance across visual reasoning tasks. 3) Mechanism study. VBVR-Pro enables controlled modality studies across more than 30 image, video, and interleaved generators. Our analysis shows that video generation remains strongest for tasks requiring persistent spatiotemporal state tracking, while interleaved generation provides a compute-efficient alternative. Critically, ablations and probing suggest the presence of vision-native trajectories that are crucial to visual reasoning. We release all data, models, scorers, and code.', 'score': 33, 'issue_id': 3178, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '2859d40980e715e4', 'authors': ['Junxiang Xu', 'Ruisi Wang', 'Fanyi Pu', 'Maijunxian Wang', 'Ran Ji', 'Tongxi Zhou', 'Chenyang Gu', 'Jing Zuo', 'Hongcan Xiao', 'Yimeng Geng', 'Wanqi Yin', 'Wei Chen', 'Oscar Qian', 'Zhengan Yan', 'Ziqi Huang', 'Haiwen Diao', 'Liang Pan', 'Bo Li', 'Xiangyu Fan', 'Dezhi Luo', 'Fengyuan Yu', 'Zehong Zhao', 'Qingying Gao', 'Tinghui Zhu', 'Yilan Zhang', 'Jingqi Tong', 'Pinyuan Feng', 'Zhengze Jiang', 'Letian Wang', 'Ziyu Guo', 'Renrui Zhang', 'Jieneng Chen', 'Sonia Joseph', 'Constantin Venhoff', 'Saman Motamed', 'Mengyue Yang', 'Chandra Sripada', 'Alan Yuille', 'Philip Torr', 'Lvmin Zhang', 'Vikash Kumar', 'Daniel Khashabi', 'Nikolaus Kriegeskorte', 'Raphaël Millière', 'Vincent C. Müller', 'Anyi Rao', 'Quan Wang', 'Ziwei Liu', 'Dahua Lin', 'Lei Yang', 'Hokin Deng', 'Zhongang Cai'], 'affiliations': ['Carnegie Mellon University', 'Columbia University', 'Friedrich-Alexander-Universitat Erlangen', 'Hong Kong University of Science and Technology', 'INSAIT, Sofia University St. Kliment Ohridski', 'Johns Hopkins University', 'Mila - Institut quebecois dIA', 'Nanyang Technological University', 'Stanford University', 'The Chinese University of Hong Kong', 'The University of Tokyo', 'University of Bristol', 'University of California, Berkeley', 'University of California, Davis', 'University of California, Los Angeles', 'University of California, San Diego', 'University of Michigan', 'University of Oxford', 'University of Toronto', 'VBVR Community Contributors'], 'pdf_title_img': 'assets/pdf/title_img/2608.26105.jpg', 'data': {'categories': ['#multimodal', '#open_source', '#benchmark', '#dataset', '#optimization', '#video', '#rl', '#transfer_learning', '#training', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Визуальное рассуждение через генерацию: масштабируемая платформа для обучения и верификации', 'desc': 'В статье представлен VBBR-Pro — закрытый testbed для масштабируемого обучения моделей native visual reasoning, то есть решения задач через визуальную генерацию как основной механизм рассуждения, а не только как средство вывода. Авторы создали контролируемое пространство из 300 процедурно генерируемых задач и предложили верифицируемые reward функции на основе детерминированных правил вместо оценок multimodal LLM, что обеспечивает надежные сигналы для reinforcement learning. Экспериментальное исследование показало, что видео-генерация особенно эффективна для задач, требующих отслеживания пространственно-временных состояний, а чередующаяся генерация предлагает вычислительно эффективную альтернативу. Результаты демонстрируют сильную трансферизацию на семь внешних бенчмарков и выявляют наличие vision-native траекторий, критичных для визуального рассуждения.'}, 'en': {'title': 'Empowering Visual Reasoning with VBBR-Pro: A Scalable Testbed for Generative Learning', 'desc': 'The paper introduces VBBR-Pro, a closed-loop testbed designed to enhance native visual reasoning through generation across various visual formats. It transforms visual reasoning into a structured task space with 300 procedurally generated tasks, allowing models to be trained and evaluated effectively. The testbed also provides verifiable reward systems that align closely with human judgments, improving the reliability of reinforcement learning in visual reasoning tasks. Additionally, it facilitates controlled studies of different generation modalities, revealing insights into the effectiveness of video and interleaved generation methods for specific reasoning challenges.'}, 'zh': {'title': 'VBBR-Pro：可扩展的视觉推理新平台', 'desc': 'VBBR-Pro 是一个闭环测试平台，旨在通过生成多样的视觉材料来实现可扩展、可验证和可控的原生视觉推理。该平台将视觉生成视为推理的媒介，使得图像和视频不仅是输入或输出，而是解决问题的第一类基础。VBBR-Pro 提供了300个程序生成的任务，模型在这些任务上训练后，能够在多个外部视觉推理基准上表现出色。通过可验证的奖励评分机制，VBBR-Pro 使得多任务强化学习的奖励信号更加可靠，从而提升视觉推理任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.24987', 'title': 'D^3-MOPD: Adaptive Dynamic Domain ScheDuling for Efficient Multi-Teacher Distillation', 'url': 'https://huggingface.co/papers/2608.24987', 'abstract': "Abstract D³-MOPD dynamically adjusts domain sampling ratios during multi-teacher distillation by monitoring per-domain reverse-KL trajectories, improving convergence efficiency and closing most of the student-to-teacher performance gap.  Generated by thinkingmachines/Inkling-Small Multi-teacher on-policy distillation (MOPD) distills several domain-expert teachers into a single student by minimizing per-domain reverse-KL divergence on the student's own rollouts. Existing approaches typically fix the per-domain data mixture before training, overlooking the fact that different domains converge at substantially different rates: some plateau early while others continue to improve throughout the training budget. A fixed mixture therefore wastes compute on fast-converging domains and undertrains slower-converging ones. To address this, we propose D^3-MOPD (Dynamic Domain ScheDuling for MOPD), a zero-overhead scheduler that repurposes the per-domain reverse-KL signal already produced during training to adapt the domain mixture online. Running asynchronously outside the training process, an off-process watcher periodically tracks each domain's KL trajectory, estimates remaining headroom and current improvement rate, and accordingly adjusts the domain sampling ratios without altering the core training loop. Our D^3-MOPD scales naturally to arbitrary numbers of domains, and the expected benefit grows as more domains introduce more diverse convergence patterns for the scheduler to exploit. On a Qwen3.6-35B-A3B student distilled from four domain-expert teachers, D^3-MOPD closes 97% of the average student-to-teacher performance gap, compared with 63% for vanilla MOPD, reaches the same peak performance with an approximately 3times reduction in rollout steps, and surpasses the specialist teachers on three of seven benchmarks.", 'score': 20, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '79090b539cc8cd5c', 'authors': ['Zechen Sun', 'Zhiwei Zhang', 'Fei Zhao', 'Juntao Li', 'Mu Chuan', 'Huayu Deng', 'Guojian Zhan', 'Wenliang Chen', 'Yao Hu', 'Min Zhang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.24987.jpg', 'data': {'categories': ['#training', '#small_models'], 'emoji': '⚖️', 'ru': {'title': 'Адаптивное распределение данных доменов для ускорения дистилляции многоучительских моделей', 'desc': 'В работе предлагается метод D³-MOPD для дистилляции знаний от нескольких учителей-экспертов в одного студента, который динамически адаптирует долю выборки данных для каждого домена во время обучения. Авторы наблюдают, что разные домены сходятся с существенно разными скоростями, и фиксированная смесь данных приводит к потере вычислительных ресурсов. Предложенный планировщик использует уже вычисляемый сигнал reverse-KL дивергенции для онлайн-адаптации соотношения доменов без изменения основного цикла обучения. Экспериментально показано, что D³-MOPD закрывает 97% разрыва в производительности между студентом и учителем и требует примерно в 3 раза меньше шагов обучения по сравнению с базовым методом.'}, 'en': {'title': 'Dynamic Domain Sampling for Efficient Multi-Teacher Distillation', 'desc': 'D³-MOPD is a method that improves the efficiency of multi-teacher distillation in machine learning by dynamically adjusting how much data from each domain is used during training. It does this by monitoring the reverse-KL divergence trajectories for each domain, allowing it to identify which domains are improving quickly and which are not. This approach prevents wasting computational resources on fast-converging domains while ensuring that slower-converging domains receive adequate training. As a result, D³-MOPD significantly reduces the performance gap between the student model and the teacher models, achieving better results with fewer training steps.'}, 'zh': {'title': '动态领域调度，提升多教师蒸馏效率', 'desc': 'D³-MOPD是一种动态调整多教师蒸馏中领域采样比例的方法，通过监测每个领域的反向KL轨迹来提高收敛效率。该方法解决了传统方法在训练前固定领域数据混合的问题，避免了对快速收敛领域的计算浪费和对慢速收敛领域的不足训练。D³-MOPD利用训练过程中产生的反向KL信号，在线调整领域采样比例，从而优化训练过程。实验表明，D³-MOPD在多个基准测试中显著提高了学生模型的性能，缩小了与教师模型的性能差距。'}}}, {'id': 'https://huggingface.co/papers/2608.23256', 'title': 'Is Next-Chunk Reasoning RL Really Better than SFT? Revisiting Training Strategies under no-CoT Data', 'url': 'https://huggingface.co/papers/2608.23256', 'abstract': 'Abstract Mixed supervised fine-tuning on combined reasoning corpora outperforms next-chunk reinforcement learning in efficiency and final accuracy across mathematical and out-of-domain tasks.  Generated by thinkingmachines/Inkling-Small Recent work proposes next-chunk reasoning RL for leveraging no-CoT data---corpora such as worked solutions and textbook derivations that contain reasoning-rich content but lack explicit chain-of-thought annotations. The method trains a model to generate implicit reasoning traces and rewards them by their ability to predict the next chunk of text. While promising, existing evaluations primarily compare against conventional SFT baselines, leaving open whether the gains come from the RL formulation itself or from more effectively exposing the model to no-CoT data. We address this question with a controlled study of next-chunk reasoning RL and a simple but previously overlooked alternative: Mixed SFT, a single supervised fine-tuning stage that jointly trains on no-CoT and long-CoT data. Despite its simplicity, Mixed SFT achieves a clearly higher post-RLVR performance ceiling than next-chunk reasoning RL while requiring over 60 times less training compute. The advantage is consistent across in-domain mathematical reasoning and out-of-domain reasoning tasks. Moreover, we show that higher pre-RLVR accuracy does not necessarily translate into higher post-RLVR accuracy, highlighting the need to evaluate no-CoT training strategies in the context of the full post-training pipeline.', 'score': 19, 'issue_id': 3179, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '66303d07ad0a33c1', 'authors': ['Yinhao Tang', 'Youqing Fang', 'Yanan Sun', 'Jiangning Liu', 'Ziyi Wang', 'Xun Zhao', 'Weiming Zhang', 'Bin Liu', 'Kuikun Liu', 'Wenwei Zhang', 'Kai Chen'], 'affiliations': ['Shanghai AI Laboratory', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.23256.jpg', 'data': {'categories': ['#training', '#math', '#rl', '#rlhf'], 'emoji': '⚡', 'ru': {'title': 'Простота побеждает сложность: смешанное дообучение вместо обучения с подкреплением', 'desc': 'В статье исследуется обучение больших языковых моделей на данных без явной цепочки рассуждений (CoT). Авторы предлагают смешанное супервизируемое дообучение на комбинированных корпусах данных с рассуждениями и длинными CoT вместо обучения с подкреплением типа next-chunk. Показано, что предложенный метод смешанного SFT достигает более высокой точности при требовании в 60 раз меньше вычислительных ресурсов. Преимущество консистентно проявляется как на математических задачах, так и на задачах рассуждения вне предметной области.'}, 'en': {'title': 'Mixed SFT: A Simpler Path to Better Reasoning Performance', 'desc': 'This paper compares two methods for improving machine learning models in reasoning tasks: next-chunk reinforcement learning (RL) and mixed supervised fine-tuning (SFT). The authors find that mixed SFT, which combines training on both reasoning-rich and standard data, outperforms next-chunk RL in terms of efficiency and accuracy. They demonstrate that mixed SFT requires significantly less computational resources while achieving better performance on various reasoning tasks. The study emphasizes the importance of evaluating training strategies within the entire model training process, rather than just focusing on pre-training accuracy.'}, 'zh': {'title': '混合监督微调：超越下一块推理的高效选择', 'desc': '这篇论文探讨了混合监督微调（Mixed SFT）在结合推理语料库上的表现，发现其在效率和最终准确性上优于下一块推理强化学习（next-chunk RL）。研究表明，混合SFT能够同时利用无链条思维（no-CoT）和长链条思维（long-CoT）数据进行训练，尽管方法简单，但其性能显著高于下一块推理RL。该方法在数学推理和领域外推理任务中表现一致，且训练所需的计算资源减少了60倍以上。论文还指出，预强化学习验证（pre-RLVR）准确性较高并不一定能转化为后强化学习验证（post-RLVR）准确性，强调了在完整的后训练流程中评估无链条思维训练策略的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.23383', 'title': 'Long-Horizon Audio-Visual Generation for Persistent Stories and Interactive Worlds', 'url': 'https://huggingface.co/papers/2608.23383', 'abstract': 'Abstract JoyAI-Echo-1.5 unifies long-form video and interactive world generation through cross-shot memory, geometry-aware camera control, and rollout-aware training to maintain identity and coherence over extended sequences.  Generated by thinkingmachines/Inkling-Small Video generation is progressing beyond isolated clips toward long-form narratives and interactive worlds, requiring models to preserve identities, follow user controls, and remain stable over extended rollouts. We present JoyAI-Echo-1.5, a unified audio-visual generation system with two purpose-built variants. The long-video variant introduces composable cross-shot memory that aggregates visual evidence across multiple prior shots and speaker cues derived from speech-filtered full-shot audio, enabling persistent character appearance and voice identity across flexible combinations of text, image, and memory conditioning. The world-model variant converts heterogeneous navigation inputs into calibrated metric 6-DoF camera trajectories and injects them through a geometry-aware conditioning pathway, enabling controller-agnostic interaction across flexible viewpoints. To support efficient long-horizon generation, we transform a bidirectional audio-visual backbone into a causal few-step generator using progressive teacher forcing and short- and long-horizon Self-Gradient Forcing on self-generated rollouts. Experiments demonstrate strong performance in both settings. JoyAI-Echo-1.5 achieves improvements over existing long-video baselines in cross-shot consistency, visual quality, text alignment, and speech fidelity. Its world-model variant ranks first on WBench, with an average score of 81.7, and achieves leading visual quality and long-horizon persistence on SANA-WM-Bench. Together, these results indicate that memory, geometric control, and rollout-aware training provide a practical foundation for generating coherent stories and continuously evolving interactive worlds. Project page: https://echo-team-joy-future-academy-jd.github.io/Echo-1.5-Page/.', 'score': 19, 'issue_id': 3179, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '5fec70212d51f1be', 'authors': ['Nan Duan', 'Haoyang Huang', 'Weiyang Jin', 'Haoran Li', 'Yaowei Li', 'Yuming Li', 'Yijun Liu', 'Xin Lu', 'Xiaoxiao Ma', 'Yanwen Ma', 'Yaofeng Su', 'Yilang Sun', 'Haoyu Wang', 'Zeyue Xue', 'Songchun Zhang', 'Junhao Zhuang'], 'affiliations': ['Future Academy', 'JD'], 'pdf_title_img': 'assets/pdf/title_img/2608.23383.jpg', 'data': {'categories': ['#long_context', '#video', '#optimization', '#benchmark', '#diffusion', '#training', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Долгоформатное видео и интерактивные миры через кроссслойовую память и геометрический контроль', 'desc': 'JoyAI-Echo-1.5 — это единая система для генерации видео и интерактивных миров, которая решает проблему сохранения идентичности персонажей и согласованности на протяжении длительных последовательностей. Модель использует перекрёстную память между кадрами, которая агрегирует визуальную информацию из предыдущих кадров и голосовые сигналы из звука для поддержания постоянного облика персонажей. Система включает вариант для генерации длинных видео и вариант мировой модели с геометрически-осведомлённым управлением камерой для интерактивного взаимодействия. Модель обучается с использованием специальной техники прогрессивного учителя и self-gradient forcing на сгенерированных последовательностях, что позволяет эффективно генерировать видео на длинных горизонтах предсказания.'}, 'en': {'title': 'Unifying Long-Form Video and Interactive Worlds with JoyAI-Echo-1.5', 'desc': 'JoyAI-Echo-1.5 is a machine learning model designed to create long-form videos and interactive environments by utilizing advanced techniques like cross-shot memory and geometry-aware camera control. It maintains character identity and coherence across extended sequences by aggregating visual and audio cues from previous shots. The model features two variants: one for long-video generation and another for world modeling, both of which enhance user interaction and visual quality. Through innovative training methods, JoyAI-Echo-1.5 outperforms existing models in consistency, quality, and user engagement, paving the way for more immersive storytelling experiences.'}, 'zh': {'title': '统一音视频生成，创造连贯故事与互动世界', 'desc': 'JoyAI-Echo-1.5 是一个统一的音视频生成系统，能够生成长视频和互动世界。它通过跨镜头记忆和几何感知相机控制，保持角色的身份和一致性。该系统的长视频变体利用可组合的跨镜头记忆，聚合多个镜头的视觉信息，确保角色外观和声音的一致性。实验结果表明，JoyAI-Echo-1.5 在跨镜头一致性、视觉质量和文本对齐等方面优于现有的长视频基线。'}}}, {'id': 'https://huggingface.co/papers/2608.23318', 'title': 'Agent-G^2: Gaussian Guidance for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.23318', 'abstract': 'Abstract Agent-G² models hint depth as a Gaussian distribution estimated online from existing rollouts, improving reinforcement learning on long-horizon tasks without extra probing.  Generated by thinkingmachines/Inkling-Small Hint-based reinforcement learning addresses reward sparsity in long-horizon agentic tasks by retaining a prefix of an expert trajectory before each rollout, letting the policy explore from a state closer to success. Its effectiveness hinges on the guidance depth: how much of the trajectory to keep. Existing methods treat this depth as a deterministic scalar. Scheduled approaches share one value across samples and ignore per-task heterogeneity; per-sample probing estimates it separately at the cost of extra rollouts. We find that useful guidance occupies a band of depths whose informativeness profile is approximately Gaussian around the band center, rather than concentrating at a single optimal point. We propose Agent-G^2, a Gaussian guidance framework that draws the depth per task from a Gaussian whose center and spread are estimated online from rollouts already collected for policy optimization, requiring no probe rollouts or learned depth predictor. The center combines a global baseline with per-cluster difficulty, and the spread tracks within-cluster variance. We evaluate Agent-G^2 on ALFWorld and WebShop on Qwen2.5-1.5B / 7B-Instruct. Agent-G^2 outperforms the strongest hint-based, hint-free, and Aux-RL baselines on ALFWorld by 2.3 / 3.9 / 7.4 points at under one-third the rollout cost of per-sample probing.', 'score': 18, 'issue_id': 3178, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '1b4998f7219e35eb', 'authors': ['Zixuan Wang', 'Yanrui Miao', 'Zhengxi Lu', 'Teng Pan', 'Yiwen Qiu', 'Hongxing Li', 'Peng Qiu', 'Ruiqing Zhang', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Shandong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.23318.jpg', 'data': {'categories': ['#rl', '#small_models', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Гауссовское распределение глубины подсказок для усиленного обучения без дополнительных проб', 'desc': "В статье представлен метод Agent-G², который моделирует глубину подсказок в обучении с подкреплением как гауссовское распределение, оцениваемое онлайн на основе уже собранных траекторий. Этот подход решает проблему разреженности награды в долгосрочных задачах, позволяя агенту начинать исследование из состояния ближе к успеху. Авторы показывают, что полезная глубина подсказок не сосредоточена в одной оптимальной точке, а распределяется по диапазону значений, информативность которых имеет приблизительно гауссову форму. Предложенный метод достигает лучших результатов чем существующие подходы при значительно меньших вычислительных затратах, не требуя дополнительных пробных rollout'ов или обученного предсказателя."}, 'en': {'title': 'Dynamic Depth for Smarter Reinforcement Learning', 'desc': 'The paper introduces Agent-G², a novel framework for hint-based reinforcement learning that improves performance on long-horizon tasks by using a Gaussian distribution to estimate guidance depth from existing rollouts. This approach allows the policy to start from a more advantageous state by retaining a portion of an expert trajectory, addressing the challenge of reward sparsity. Unlike traditional methods that use a fixed depth or require additional rollouts for probing, Agent-G² dynamically adjusts the guidance depth based on the collected data, optimizing both the center and spread of the Gaussian distribution. The results demonstrate that Agent-G² significantly outperforms existing methods while reducing the cost of rollouts, making it a more efficient solution for complex tasks.'}, 'zh': {'title': '高斯引导：提升强化学习的深度探索', 'desc': '本文提出了一种名为Agent-G²的模型，旨在通过在线估计高斯分布来改进强化学习，特别是在长时间任务中。该模型通过保留专家轨迹的前缀，帮助智能体在接近成功的状态下进行探索，从而解决奖励稀疏的问题。与传统方法不同，Agent-G²将引导深度视为高斯分布，而不是固定的标量，能够更好地适应不同任务的需求。实验结果表明，Agent-G²在多个基准测试中表现优异，显著降低了样本探测的成本。'}}}, {'id': 'https://huggingface.co/papers/2608.19098', 'title': 'Open-MOPD: Diagnosing and Fixing Capability Imbalance in Multi-Teacher On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.19098', 'abstract': "Abstract Multi-teacher on-policy distillation suffers from token-level budget misallocation across domains, which is addressed by balancing, dynamic allocation, and reward refresh to recover most of the oracle ensemble's capability.  Generated by thinkingmachines/Inkling-Small Multi-teacher on-policy distillation (M-OPD) has emerged as a promising paradigm for consolidating domain-specialized reinforcement learning (RL) experts into a single generalist student via dense, token-level reward supervision. Despite its practical success, the optimization dynamics governing multi-teacher capability integration remain poorly understood, and open, rigorously reproducible recipes are conspicuously lacking. In this work, we establish a controlled M-OPD benchmark on SmolLM3-3B-Base with oracle routing, isolating capability integration from routing ambiguity. Our investigation reveals a pronounced capability integration gap: standard M-OPD captures only 35.6% of the available headroom relative to a domain-routed oracle ensemble, with concise tasks such as instruction following suffering severe degradation and premature stagnation. Crucially, we show that this failure stems not from gradient conflict, but from a severe misallocation of the token-level optimization budget. This pathology is driven by three orthogonal factors: structural sequence-length disparities across domains, dynamic convergence drift due to non-uniform learning rates, and multi-step reward staleness from asynchronous policy updates. To resolve these imbalances, we introduce Open-MOPD, a principled framework incorporating token-share balancing, gap-aware dynamic budget allocation, and student reward refresh. Together, these mechanisms systematically restore cross-domain balance, elevating headroom recovery from 35.6% to 83.4% in a single deployable student. We fully open-source our end-to-end post-training recipe, training trajectories, and evaluation suites on an academically accessible hardware budget.", 'score': 16, 'issue_id': 3179, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '8a1ce05cbf918dbf', 'authors': ['Huan-ang Gao', 'Haohan Chi', 'Yong Yan', 'Shiyuan Feng', 'Hanlin Wu', 'Zheng Jiang', 'Bingxiang He', 'Wei-Ying Ma', 'Ya-Qin Zhang', 'Hao Zhou'], 'affiliations': ['Department of Computer Science and Technology, Tsinghua University', 'Institute for AI Industry Research (AIR), Tsinghua University', 'SIA-Lab of Tsinghua AIR and ByteDance Seed'], 'pdf_title_img': 'assets/pdf/title_img/2608.19098.jpg', 'data': {'categories': ['#open_source', '#optimization', '#rl', '#benchmark', '#transfer_learning', '#training', '#small_models'], 'emoji': '⚖️', 'ru': {'title': 'Сбалансированная дистилляция: от хаоса к гармонии в обучении универсального студента', 'desc': 'В работе исследуется проблема дистилляции знаний от нескольких учителей в обучении с подкреплением, где стандартные методы достигают лишь 35.6% потенциала ансамбля. Авторы выявили, что основная причина неудачи заключается не в конфликте градиентов, а в неправильном распределении вычислительного бюджета на уровне токенов из-за различий в длине последовательностей и асинхронных обновлений политики. Предложена система Open-MOPD, включающая балансировку доли токенов, динамическое распределение бюджета и обновление награды ученика, что позволяет восстановить 83.4% потенциала ансамбля. Авторы открыли полный рецепт постобучения и все необходимые компоненты для воспроизведения результатов.'}, 'en': {'title': 'Enhancing Multi-Teacher Distillation with Open-MOPD', 'desc': 'This paper addresses the challenges of multi-teacher on-policy distillation (M-OPD) in reinforcement learning, particularly the issue of token-level budget misallocation across different domains. The authors propose a new framework called Open-MOPD, which includes mechanisms for balancing token shares, dynamically allocating budgets, and refreshing rewards to improve the integration of capabilities from multiple teachers into a single student model. Their experiments show that standard M-OPD only captures a small portion of the potential performance, but with Open-MOPD, they significantly increase the recovery of capabilities from 35.6% to 83.4%. The research provides a reproducible methodology and open-source resources for further exploration in this area.'}, 'zh': {'title': '提升多教师蒸馏的能力整合效率', 'desc': '本文探讨了多教师在线蒸馏（M-OPD）在不同领域之间的令牌级预算分配问题。通过引入动态分配和奖励刷新机制，研究者们成功恢复了大部分来自于专家集成的能力。研究表明，标准的M-OPD仅能捕获可用能力的35.6%，而通过新提出的Open-MOPD框架，这一比例提升至83.4%。该框架通过平衡令牌共享和动态预算分配，系统性地解决了跨领域的能力整合问题。'}}}, {'id': 'https://huggingface.co/papers/2608.26067', 'title': 'StreamPI: Streaming Multimodal Temporal Modeling for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2608.26067', 'abstract': 'Abstract StreamPI enhances single-frame vision-language-action models with streaming temporal reasoning via instruction-anchored attention and randomized interval training, improving robot manipulation without extra parameters.  Generated by thinkingmachines/Inkling-Small Vision-Language-Action (VLA) models have demonstrated effectiveness in robot manipulation, yet state-of-the-art models such as pi0.5 operate under a single-frame paradigm, limiting their ability to retain past observations and develop precise spatial perception. In this paper, we propose StreamPI, a streaming multimodal temporal modeling framework that equips single-frame VLA with temporal reasoning capability without introducing any additional parameters. One core design is instruction-anchored temporal modeling. It treats each (visual observation, language instruction) pair as an atomic temporal unit: bidirectional attention within each pair enables cross-modal fusion, while causal attention across pairs preserves autoregressive streaming inference. This ensures the language instruction serves as a persistent semantic anchor throughout task execution. To bridge the gap between synchronous training and asynchronous real-robot deployment, we introduce a andom-interval streaming training strategy: a proper inter-frame interval (e.g., every 3 frames) enables faster and smoother action execution. Beyond this, randomizing the interval further improves robustness to frame-timing perturbations, supporting asynchronous deployment in practice. Furthermore, by leveraging the length extrapolation capability of the LLM backbone, StreamPI seamlessly inherits pretrained single-frame weights and supports flexible single-frame and multi-frame inference. Experiments on real-robot tasks spanning memory-dependent and precise perception scenarios, as well as the simulation benchmark LIBERO, demonstrate that StreamPI outperforms pi0.5 across diverse tasks.', 'score': 15, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '8df4f0c60fadf771', 'authors': ['Zhe Liu', 'Jinghua Hou', 'Yuxiang Lu', 'Zhenya Yang', 'Xianzhe Fan', 'Junwei Luo', 'Junyi Li', 'Ruihua Han', 'Zhi Hou', 'Hengshuang Zhao'], 'affiliations': ['ACE Robotics', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.26067.jpg', 'data': {'categories': ['#robotics', '#multimodal', '#training', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Временное мышление для манипуляции роботом без лишних параметров', 'desc': 'StreamPI улучшает модели видения-языка-действия для робототехники, добавляя способность обрабатывать последовательности кадров без введения дополнительных параметров. Ключевая инновация — якорированное языковой инструкцией внимание, которое обрабатывает пары (визуальное наблюдение, инструкция) как атомарные единицы с двусторонней кросс-модальной фузией и причинным вниманием между парами. Для устранения разрыва между синхронным обучением и асинхронным развёртыванием на реальных роботах авторы предложили стратегию тренировки со случайными временными интервалами, которая повышает устойчивость к колебаниям частоты кадров. Экспериментальные результаты на реальных робототехнических задачах и симуляции демонстрируют превосходство StreamPI над исходной моделью pi0.5.'}, 'en': {'title': 'StreamPI: Enhancing Robot Manipulation with Temporal Reasoning', 'desc': 'StreamPI is a new framework that enhances existing vision-language-action models by adding the ability to reason over time without increasing the number of parameters. It uses a method called instruction-anchored attention, which allows the model to treat visual and language inputs as linked units, improving how it understands and executes tasks. Additionally, StreamPI employs a randomized interval training strategy to better prepare the model for real-world robot actions, making it more robust to timing variations. Experiments show that StreamPI significantly outperforms previous models in tasks that require memory and precise perception.'}, 'zh': {'title': 'StreamPI：提升机器人操作的流式时间推理', 'desc': 'StreamPI 是一种增强单帧视觉-语言-动作模型的框架，能够通过指令锚定的注意力和随机间隔训练实现流式时间推理，从而提升机器人操作能力而无需额外参数。该模型将每对（视觉观察，语言指令）视为一个原子时间单元，利用双向注意力实现跨模态融合，同时通过因果注意力保持自回归流推理。StreamPI 还引入了随机间隔流训练策略，以便在真实机器人部署中实现更快更流畅的动作执行。实验结果表明，StreamPI 在多种任务中优于现有的 pi0.5 模型，特别是在需要记忆和精确感知的场景中表现突出。'}}}, {'id': 'https://huggingface.co/papers/2608.25529', 'title': 'Video-IFBench: Evaluating Instruction Following of Multimodal LLMs in Video Understanding Scenarios', 'url': 'https://huggingface.co/papers/2608.25529', 'abstract': 'Abstract A new benchmark evaluates how well multimodal language models follow diverse video-based instructions with visual, audio, and structural constraints.  Generated by thinkingmachines/Inkling-Small Multimodal Large Language Models (MLLMs) have shown strong performance in video understanding. However, their ability to follow instructions in this domain remains under-explored. Real-world video understanding requires models not only to interpret video content correctly, but also to satisfy diverse user-specified constraints. Existing benchmarks focus primarily on task accuracy rather than instruction adherence, leaving this capability insufficiently evaluated. To address this gap, we introduce Video-IFBench, a comprehensive benchmark for evaluating instruction following in video understanding, where models must satisfy diverse user-specified constraints, including those grounded in visual and audio content. We develop an instruction taxonomy with four templates, including single-task, multi-task, selection, and nested instructions, covering 32 task types and 39 manually designed constraint categories spanning both semantic and format requirements. To reduce annotation cost, we build a semi-automatic data construction pipeline that combines MLLMs, programmatic processing, and human verification, resulting in 1.5K samples. We conduct a large-scale evaluation of more than 20 recent MLLMs and show that video instruction following remains challenging for current models, especially for instructions with many constraints, semantic constraints, or complex conditional structures that require selecting the correct branch or path based on video content. We hope our work will facilitate future research on instruction following in video understanding scenarios.', 'score': 14, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '4e7ce9dba0dd2b4a', 'authors': ['Hongbo Liu', 'Peixian Chen', 'Sihan Liu', 'Peiyuan Zhang', 'Kai Zou', 'Dian Zheng', 'Xiaoxing Hu', 'Yuhao Dong', 'Mengdan Zhang', 'Yunhang Shen', 'Haoyu Cao', 'Wei Liu', 'Weibo Gu', 'Xing Sun', 'Shengjie Zhao'], 'affiliations': ['CUHK', 'NTU', 'SJTU', 'TJU', 'Tencent Hunyuan', 'Tencent Youtu Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.25529.jpg', 'data': {'categories': ['#video', '#dataset', '#benchmark', '#survey', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Оценка способности мультимодальных моделей следовать сложным инструкциям в анализе видео', 'desc': 'В статье представлен новый бенчмарк Video-IFBench для оценки способности мультимодальных языковых моделей следовать инструкциям при анализе видеоконтента с учётом визуальных, звуковых и структурных ограничений. Авторы разработали таксономию инструкций с четырьмя шаблонами, охватывающими 32 типа задач и 39 категорий ограничений, и создали полуавтоматический конвейер обработки данных с использованием самих MLLMs и человеческой проверки. Проведена масштабная оценка более 20 современных мультимодальных моделей, которая показала, что следование инструкциям остаётся сложной задачей, особенно при наличии множественных ограничений или сложных условных структур. Работа направлена на стимулирование развития исследований в области улучшения способности моделей понимать видео и выполнять пользовательские указания.'}, 'en': {'title': 'Enhancing Instruction Following in Video Understanding', 'desc': 'This paper introduces Video-IFBench, a new benchmark designed to evaluate how well multimodal language models (MLLMs) can follow video-based instructions that include various visual, audio, and structural constraints. While MLLMs have demonstrated strong capabilities in understanding video content, their performance in adhering to user-specified instructions has not been thoroughly assessed. The benchmark features a comprehensive instruction taxonomy and a semi-automatic data construction pipeline, resulting in a dataset of 1.5K samples for evaluation. The findings reveal that current models struggle with complex instructions, particularly those with multiple constraints, highlighting the need for further research in this area.'}, 'zh': {'title': '视频理解中的指令遵循新基准', 'desc': '这篇论文介绍了一个新的基准测试，旨在评估多模态语言模型在遵循视频指令方面的表现。研究表明，现有模型在理解视频内容时表现良好，但在满足用户指定的多样化约束方面仍然不足。为了解决这个问题，作者提出了Video-IFBench基准，涵盖了多种任务类型和约束类别，以评估模型的指令遵循能力。通过构建半自动数据生成管道，研究团队生成了1500个样本，并对20多种最新的多模态大语言模型进行了大规模评估，结果显示当前模型在复杂指令的处理上仍面临挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.25580', 'title': 'V-Rubrics: Visual Faithfulness via Rubric-Based Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.25580', 'abstract': "Abstract Visual Rubrics-Based Reinforcement Learning improves vision-language model grounding by scoring answers on visual faithfulness, reasoning consistency, and instruction following using structured partial credit.  Generated by thinkingmachines/Inkling-Small Vision-language models can produce fluent answers that are insufficiently grounded in the visual evidence: a single unsupported object, chart value, or intermediate inference can undermine an otherwise plausible response. We argue that this is a credit-assignment failure in multimodal post-training. Scalar outcome rewards indicate whether an answer is acceptable, but do not identify which visual facts are grounded, which reasoning steps are valid, or which instruction constraints are missed. We introduce Visual Rubrics-Based Reinforcement Learning, which decomposes reference responses into atomic propositions and scores generated answers along Visual Faithfulness (VF), Reasoning Consistency (RC), and Instruction Following (IF). The resulting rubric items provide structured partial credit and localize rubric credit when supporting evidence spans are available. We first obtain an SFT checkpoint by fine-tuning Qwen3-VL-8B-Instruct on the public OpenMMReasoner-SFT-874K corpus, adapting OpenMMReasoner's cold-start data recipe. We construct V-Rubrics 50K, a 50,248-example training set from 17 visually grounded sources, by applying rule-based filters before deriving example difficulty from rejection-sampling scores and then annotating every example with Gemini-3-Pro under the same structured prompt and protocol. We train our model based on the same SFT checkpoint using component-wise, prefix-localized rubric credit. Experiments show that our rubricbased GRPO improves over both the shared SFT baseline and answer-only GRPO, with the largest gains on knowledge-oriented and visually grounded reasoning benchmarks. The results show rubrics as a useful reward abstraction for visual post-training.", 'score': 12, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '72edaf3623b5d00d', 'authors': ['Shulin Tian', 'Minglun Li', 'Yuhao Dong', 'Hao Ding', 'Jiarui Yao', 'Haiwen Diao', 'Jingkang Yang', 'Hongyuan Zhu', 'Ziwei Liu'], 'affiliations': ['A*STAR', 'Independent Researcher', 'S-Lab, Nanyang Technological University', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2608.25580.jpg', 'data': {'categories': ['#cv', '#rlhf', '#dataset', '#training', '#multimodal'], 'emoji': '🎯', 'ru': {'title': 'Структурированный кредит для точной оценки визуально-языковых моделей', 'desc': 'В работе предлагается метод Visual Rubrics-Based Reinforcement Learning для улучшения качества визуально-языковых моделей. Авторы определяют проблему как ошибку в распределении кредита во время постобучения: скалярные награды не указывают, какие визуальные факты правильно обоснованы, какие шаги рассуждения валидны и какие ограничения инструкций нарушены. Метод разлагает эталонные ответы на атомарные утверждения и оценивает сгенерированные ответы по трём критериям: визуальной верности, консистентности рассуждений и соответствию инструкциям, что обеспечивает структурированный частичный кредит. Экспериментальные результаты показывают, что предложенный подход GRPO на основе рубрик превосходит базовые методы на бенчмарках визуально обоснованного рассуждения.'}, 'en': {'title': 'Enhancing Vision-Language Models with Structured Rubrics', 'desc': 'This paper presents Visual Rubrics-Based Reinforcement Learning (VR-RL), a method that enhances vision-language models by evaluating their answers based on visual faithfulness, reasoning consistency, and instruction adherence. The authors identify a common issue where models generate plausible responses that lack grounding in visual evidence, leading to credit-assignment failures. By breaking down reference answers into smaller components, VR-RL provides structured partial credit, allowing for better identification of which visual facts and reasoning steps are valid. The experiments demonstrate that this rubric-based approach significantly improves model performance on tasks requiring knowledge and visual reasoning.'}, 'zh': {'title': '视觉评分标准提升模型准确性', 'desc': '这篇论文提出了一种基于视觉评分标准的强化学习方法，旨在提高视觉-语言模型的准确性。该方法通过对生成答案进行评分，评估其视觉真实性、推理一致性和指令遵循性，从而解决多模态后训练中的信用分配问题。研究表明，传统的奖励机制无法有效识别支持答案的视觉事实和推理步骤，而视觉评分标准则提供了结构化的部分信用分配。实验结果显示，该方法在知识导向和视觉推理基准测试中表现优异，证明了评分标准在视觉后训练中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.24099', 'title': 'Are Android GUI Agents Robust Against Runtime Anomalies? AnTrap: Evaluating Agents in Dynamic Adversarial Environments', 'url': 'https://huggingface.co/papers/2608.24099', 'abstract': 'Abstract AnTrap benchmarks GUI agent robustness by injecting dynamic anomalies into execution trajectories, revealing universal vulnerabilities and distinguishing learnable traps from intrinsic reasoning limits.  Generated by thinkingmachines/Inkling-Small GUI agents often encounter dynamic anomalies when deployed on Android devices, from unexpected pop-ups to action misuse, yet existing benchmarks lack systematic evaluation of agent robustness against runtime anomalies. We introduce AnTrap, a comprehensive benchmark that injects dynamic perturbations into agent execution trajectories. We propose a taxonomy organizing real-world anomalies into four layers (State, Thinking, Action and Round) with ten fine-grained subcategories, and develop a construction pipeline that preserves task solvability while introducing realistic adversarial conditions. Evaluating 16 leading GUI models, we reveal universal vulnerability to dynamic anomalies, with even the strongest models suffering significant performance degradation. Furthermore, we conduct GRPO training in both original and adversarial environments to validate our benchmark, separating environment-learnable anomalies from reasoning-bottlenecked ones. Our findings show that while single-step traps at state and action layers are largely addressable through adversarial reinforcement learning, deep contextual traps, like state deadlock, expose intrinsic limitations that cannot be resolved by training in environments with traps alone.', 'score': 12, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '115944d07770de69', 'authors': ['Guo Gan', 'Yilun Zhao', 'Cong Chen', 'Jinbiao Wei', 'Tingyu Song', 'Zheyuan Yang', 'Lin Fu', 'Hong Zhou'], 'affiliations': ['Tongji University', 'University of Chinese Academy of Sciences', 'Yale University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.24099.jpg', 'data': {'categories': ['#security', '#agents', '#reasoning', '#rl', '#benchmark'], 'emoji': '🪤', 'ru': {'title': 'Разоблачение хрупкости: как динамические аномалии выявляют настоящие пределы агентов', 'desc': 'Авторы представляют AnTrap — бенчмарк для оценки робастности GUI агентов против динамических аномалий, которые возникают при развертывании на Android устройствах. Они разработали таксономию из четырех слоев аномалий (State, Thinking, Action и Round) и создали конвейер построения, который вводит реалистичные возмущения в траектории выполнения задач, сохраняя их решаемость. Тестирование 16 современных моделей выявило универсальную уязвимость к динамическим аномалиям и значительное снижение производительности даже у лучших агентов. Через обучение с подкреплением (GRPO) авторы показали, что простые ловушки в слоях State и Action можно преодолеть адверсарным обучением, но глубокие контекстные ловушки раскрывают фундаментальные ограничения рассуждений, которые невозможно решить только обучением на зашумленных окружениях.'}, 'en': {'title': 'AnTrap: Testing GUI Agent Resilience Against Dynamic Anomalies', 'desc': 'AnTrap is a benchmark designed to test the robustness of GUI agents against dynamic anomalies that occur during execution. It introduces a systematic way to evaluate how these agents respond to unexpected events, categorizing anomalies into four layers: State, Thinking, Action, and Round. The study reveals that even the best-performing GUI models are vulnerable to these anomalies, leading to significant drops in performance. Additionally, it distinguishes between anomalies that can be learned through training and those that highlight fundamental reasoning limitations of the agents.'}, 'zh': {'title': 'AnTrap：揭示GUI代理的脆弱性', 'desc': 'AnTrap是一个评估图形用户界面（GUI）代理鲁棒性的基准工具，通过在执行轨迹中注入动态异常来揭示普遍的脆弱性。它将现实世界的异常分为四个层次，并提供十个细分类别，以系统化地评估代理在运行时异常下的表现。通过对16个领先的GUI模型进行评估，发现即使是最强的模型在动态异常面前也会显著下降。研究表明，虽然在状态和动作层次的单步陷阱可以通过对抗性强化学习解决，但深层上下文陷阱如状态死锁则暴露了内在的局限性，无法仅通过在有陷阱的环境中训练来解决。'}}}, {'id': 'https://huggingface.co/papers/2608.24358', 'title': 'The Handoff Tax: Continuing Non-Native Trajectories in LLM Agents', 'url': 'https://huggingface.co/papers/2608.24358', 'abstract': 'Abstract  Coding agents perform long-running tasks spanning dozens of model calls, tool uses, and code edits. As these runs unfold, users face a practical cost-quality trade-off: escalating to a stronger model when a cheaper one struggles, or downshifting once the hard reasoning is complete. Each switch requires the receiver to continue a non-native trajectory produced by another model. We study how this handoff affects quality and cost, and how varying the trajectory information inherited by the receiver changes the outcome. Using pairs of low-cost, low-capability (LC) and high-cost, high-capability (HC) models from the Claude and GPT families, we vary handoff direction, timing, and interface, comparing full-trajectory transfer, compaction, and trajectory removal while preserving the repository state. Across both model families, full-trajectory escalation recovers less than half of the LC-to-HC quality gap while incurring a substantial cost premium. We term this cost-quality penalty the handoff tax. By contrast, downshift offers a favorable cost-quality point. Interestingly, the preferred interface also reverses with direction: reducing LC-model trajectory information improves escalation quality, whereas removing the HC-model trajectory reduces downshift quality.', 'score': 12, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '8dd760b7e11558d6', 'authors': ['Roy Ganz', 'Mor Shpigel Nacson', 'Adi Kalyanpur', 'Ron Litman'], 'affiliations': ['AWS'], 'pdf_title_img': 'assets/pdf/title_img/2608.24358.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Штраф за переключение: оптимальная передача контекста между моделями разной мощности', 'desc': 'В статье изучается проблема передачи контекста между моделями различной производительности при выполнении длительных задач программирования. Авторы анализируют как качество, так и стоимость вычислений при переключении между дешёвыми и дорогими моделями, варьируя объём передаваемой истории взаимодействия. Результаты показывают, что повышение к более мощной модели с полной историей не компенсирует качество более чем на половину, создавая штраф за переключение. Одновременно понижение к более дешёвой модели демонстрирует благоприятный баланс затрат и качества, а оптимальное количество передаваемой информации зависит от направления переключения.'}, 'en': {'title': 'Navigating the Handoff Tax in Model Switching', 'desc': "This paper investigates how switching between different machine learning models affects the quality and cost of task performance. It introduces the concept of 'handoff tax', which describes the quality loss and increased costs associated with transitioning from a low-cost model to a high-cost model. The study uses pairs of models from the Claude and GPT families to analyze how different handoff strategies impact outcomes. The findings suggest that downshifting to a simpler model can provide better cost-quality balance compared to escalating to a more complex model."}, 'zh': {'title': '切换税：模型切换的成本与质量权衡', 'desc': '本文研究了编码代理在执行长时间任务时的成本与质量权衡。用户在使用不同能力的模型时，需要在低成本模型和高成本模型之间进行切换，这种切换会影响最终的任务质量和成本。我们发现，完整的轨迹转移虽然可以提高质量，但代价高昂，称之为“切换税”。相反，降低模型能力的选择在成本和质量上提供了更好的平衡。'}}}, {'id': 'https://huggingface.co/papers/2608.24138', 'title': 'Rubrics as Visual-Repair Context for Self-Evolving UI-to-Code Generation', 'url': 'https://huggingface.co/papers/2608.24138', 'abstract': 'Abstract RubSE improves UI-to-code generation stability by using rubric-guided self-evolution to prevent visual repair coupling and trajectory collapse.  Generated by thinkingmachines/Inkling-Small Large vision-language models have shown strong progress in UI-to-code generation, yet their test-time self-evolution remains unstable. We first identify a fundamental obstacle, termed visual repair coupling: a local code edit may propagate through layout, style, and component dependencies, correcting one visual mismatch while degrading regions that were previously faithful. To address this issue, we present RubSE, a Rubric-guided Self-Evolution framework that uses rubrics to represent visual feedback as a structured visual-repair context. At each refinement round, RubSE generates typed candidate rubrics, selects one prioritized repair target, and stores previously selected rubrics as history, thereby steering each revision toward a well-scoped visual repair while discouraging repeated or over-broad changes. Evaluations across six VLMs and three UI-to-code benchmarks demonstrate that RubSE substantially outperforms naïve self-evolution in final-round and best-round settings, achieving more stable refinement trajectories and a higher trajectory-level performance ceiling. Further analysis shows that RubSE mitigates trajectory collapse by improving recovery from severe visual regressions, and that stronger rubric generators can transfer effective visual-repair guidance to weaker code improvers.', 'score': 11, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '79acd3e8f6c07098', 'authors': ['Tianyi Xiong', 'Zhengyuan Yang', 'Xiaofei Wang', 'Chung-Ching Lin', 'Ruichun Ma', 'Kevin Lin', 'Zhendong Wang', 'Linjie Li', 'Chenxi Liu', 'Ruibo Chen', 'Ramani Duraiswami', 'Heng Huang', 'Lijuan Wang'], 'affiliations': ['Microsoft', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2608.24138.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#training'], 'emoji': '🎨', 'ru': {'title': 'Рубрики для стабильной эволюции: от хаоса исправлений к целевым улучшениям интерфейса', 'desc': 'RubSE — это фреймворк для стабилизации процесса генерации кода из интерфейсов пользователя с использованием больших визуально-языковых моделей. Основная проблема, которую решает работа — это «связанность визуального восстановления», когда локальное изменение кода влияет на разные части интерфейса и может испортить уже исправле
