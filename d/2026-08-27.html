нные регионы. Предложенный метод использует структурированные рубрики для представления визуальной обратной связи и направляет каждую итерацию улучшения на конкретную задачу восстановления, сохраняя историю предыдущих исправлений. Экспериментальные результаты на шести различных визуально-языковых моделях показывают, что RubSE достигает более стабильных траекторий развития и предотвращает коллапс процесса оптимизации.'}, 'en': {'title': 'Stabilizing UI-to-Code Generation with Rubric-Guided Self-Evolution', 'desc': 'RubSE is a framework designed to enhance the stability of UI-to-code generation by addressing issues related to visual repair coupling and trajectory collapse. It utilizes rubric-guided self-evolution, which means it uses structured feedback to guide the code refinement process. By generating candidate rubrics and prioritizing specific repair targets, RubSE ensures that changes made to the code do not negatively impact other visual elements. Evaluations show that RubSE significantly improves the performance and stability of the code generation process compared to traditional methods.'}, 'zh': {'title': 'RubSE：提升UI到代码生成的稳定性', 'desc': 'RubSE是一种基于评分标准的自我演化框架，旨在提高用户界面到代码生成的稳定性。它通过解决视觉修复耦合问题，避免了局部代码编辑导致的视觉不匹配传播。RubSE在每个优化轮次中生成类型化的候选评分标准，选择优先修复目标，并记录历史评分标准，从而引导修订过程。实验结果表明，RubSE在多个视觉语言模型和用户界面到代码基准测试中，显著优于传统的自我演化方法，提供了更稳定的优化轨迹和更高的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.23564', 'title': 'SWE Refactor Bench: Can Coding Agents Complete a Long-Horizon, Whole-Repository Stack Migration?', 'url': 'https://huggingface.co/papers/2608.23564', 'abstract': 'Abstract The study introduces a benchmark for evaluating autonomous software migration by coding agents, finding that current models rarely complete migrations correctly.  Generated by thinkingmachines/Inkling-Small Modern software systems accumulate technical debt over decades of development, which makes migration expensive and largely manual. As coding agents become increasingly capable at bug fixing, can they autonomously perform such migrations? Existing benchmarks cannot answer this question because they evaluate only behavioural correctness, not whether the migration actually occurred. This leads an easy hack: agents copy the original implementation to make tests pass. We call this Blindness. To address this problem, we introduce SWE Refactor Bench, a benchmark comprising 20 whole-repository migrations, covering 4 kinds of technical debt. A three-stage evaluation protocol measures both migration completeness and behavioural correctness. (1) Migration Audit verifies that the migration occurred. (2) Behavioural Tests measure correctness with a fixed test suite. (3) Agentic Verification uses 6 independent coding agents to generate targeted tests for hidden behavioural differences. Across 520 runs from 8 frontier models and 26 model-effort configurations, only 28 of 520 runs (5.4%) pass all three stages, 13 of the 20 tasks receive no accepted solution, and the best model (claude-opus-5) scores 47.0/100. Migration completeness and behavioural correctness are distinct abilities: a few runs preserve behaviour by skipping the migration and are stopped at Migration Audit; most attempt it and break behaviour, and are stopped at Behavioural Tests. Agents cannot deliver a perfect migration: among the 340 runs that pass Migration Audit, 58% reach 99% of the fixed checks, yet only 26% reach 100%. Agent capability differs across migration categories: agents score 31.4 on build toolchain rewrites but only 5.6 on language rewrites. Together, these findings position SWE Refactor Bench as a rigorous testbed for developing coding agents for reliable whole-repository migrations.', 'score': 11, 'issue_id': 3179, 'pub_date': '2026-08-24', 'pub_date_card': {'ru': '24 августа', 'en': 'August 24', 'zh': '8月24日'}, 'hash': '7192c0da104a6d02', 'authors': ['Deyao Hong', 'Yizhe Chi', 'Wenyi Li', 'Xiaoqiu Wang', 'Mingju Gao', 'Kaisen Yang', 'Bingxiang He', 'Youjie Zheng', 'Calvin Xiao', 'Qinhuai Na'], 'affiliations': ['Einsia.AI', 'Navers Lab', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.23564.jpg', 'data': {'categories': ['#plp', '#open_source', '#agents', '#reasoning', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Оценка истинной способности AI-кодировщиков к миграции программного кода', 'desc': 'В статье представлен новый бенчмарк SWE Refactor Bench для оценки способности coding agents выполнять автоматическую миграцию программного кода. Авторы выявили критическую проблему существующих бенчмарков — они не различают между истинной миграцией кода и просто сохранением исходной реализации для прохождения тестов (явление, названное авторами Blindness). Предложенный протокол оценки состоит из трёх этапов: проверка факта миграции, тестирование поведенческой корректности и верификация через независимые агенты. Результаты показывают крайне низкую эффективность текущих моделей: только 5.4% из 520 запусков прошли все три этапа, что свидетельствует о значительном разрыве между способностью моделей к исправлению ошибок и выполнению сложных миграций.'}, 'en': {'title': 'Evaluating Coding Agents: Beyond Just Passing Tests!', 'desc': "This paper presents SWE Refactor Bench, a new benchmark designed to evaluate the effectiveness of coding agents in performing autonomous software migrations. The study highlights that existing models often fail to complete migrations correctly, leading to a phenomenon called 'Blindness' where agents simply replicate the original code to pass tests. The benchmark includes a three-stage evaluation process that assesses both the completeness of the migration and its behavioral correctness. Results show that only a small percentage of runs successfully pass all evaluation stages, indicating that migration completeness and behavioral correctness are distinct challenges for coding agents."}, 'zh': {'title': '自主软件迁移的评估新基准', 'desc': '本研究提出了一个基准，用于评估编码代理的自主软件迁移能力。现有模型在迁移过程中很少能正确完成任务，导致代理可能通过复制原始实现来通过测试，这种现象被称为“盲目性”。为了解决这个问题，研究引入了SWE Refactor Bench基准，包含20个完整的代码库迁移案例，涵盖4种技术债务。通过三阶段评估协议，研究测量了迁移的完整性和行为的正确性，结果显示大多数代理无法实现完美的迁移。'}}}, {'id': 'https://huggingface.co/papers/2608.25927', 'title': 'Code World Model: Coding Agent as World Brain', 'url': 'https://huggingface.co/papers/2608.25927', 'abstract': 'Abstract Code World Model separates persistent world dynamics from visual rendering by using a language model to generate executable state updates and a video model to render observations from proxy representations.  Generated by thinkingmachines/Inkling-Small World models aim to simulate how complex environments evolve under actions and events, yet existing video-based world models primarily learn dynamics from visual observations, which reveal outcomes rather than the underlying knowledge, rules, and mechanisms governing world evolution. This makes it difficult to maintain persistent consequences and support coherent, open-ended evolution. We introduce Code World Model, a framework that separates world evolution from visual realization by combining the reasoning and coding capabilities of language models with the generative priors of video models. A coding agent serves as the world brain, reasoning about events and their consequences and generating executable code to maintain persistent world state and perform rule-consistent evolution. To connect executable state with visual generation, we introduce a proxy representation that encodes frame-wise spatiotemporal constraints and is compiled into a proxy video, which conditions a video model to render high-fidelity visual observations. We further develop data pipelines for constructing aligned proxy-observation pairs from gameplay and real-world videos. After fine-tuning on paired gameplay data, MiniMax-H3 follows proxy-based spatiotemporal specifications from simple interactive worlds built by the coding agent while preserving rich visual details and dynamics. These results demonstrate the potential of combining code for persistent world evolution with video models for flexible visual realization, providing a new path toward open-ended world models.', 'score': 10, 'issue_id': 3178, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '34013ddb8b7a50f5', 'authors': ['Yiwen Chen', 'Guosheng Lin', 'Chi Zhang'], 'affiliations': ['AGI Lab, Westlake University', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2608.25927.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#games', '#video', '#training', '#synthetic', '#reasoning'], 'emoji': '🌍', 'ru': {'title': 'Код как мозг мира: разделение логики и визуализации в мировых моделях', 'desc': 'Работа представляет Code World Model — фреймворк, который разделяет эволюцию виртуального мира от его визуального представления. Система использует языковую модель для генерации исполняемого кода, который поддерживает постоянное состояние мира и обеспечивает логически согласованную эволюцию среды. Для преобразования абстрактного состояния в реалистичные визуальные наблюдения используется промежуточное представление (proxy representation) и видеомодель, которая генерирует высокочастотные визуальные данные. Подход демонстрирует эффективность комбинирования символического кодового мышления с глубокими генеративными моделями для создания открытых мировых моделей.'}, 'en': {'title': 'Revolutionizing World Models: Code Meets Vision', 'desc': 'The Code World Model introduces a novel approach to simulating complex environments by separating the dynamics of world evolution from visual rendering. It utilizes a language model to generate executable state updates, allowing for coherent and persistent consequences in the environment. By combining this with a video model, the framework can render high-fidelity visual observations based on proxy representations that encode spatiotemporal constraints. This innovative method enhances the ability to create open-ended world models that evolve consistently under various actions and events.'}, 'zh': {'title': '代码与视觉的完美结合，开启开放式世界模型的新路径', 'desc': '代码世界模型通过使用语言模型生成可执行的状态更新，并通过视频模型从代理表示中渲染观察，来将持久的世界动态与视觉渲染分开。现有的视频基础世界模型主要从视觉观察中学习动态，这使得它们难以维护持久的后果并支持连贯的开放式演化。我们提出的代码世界模型框架结合了语言模型的推理和编码能力与视频模型的生成先验，旨在实现世界演化与视觉实现的分离。通过引入代理表示，我们能够将可执行状态与视觉生成连接起来，从而实现高保真的视觉观察。'}}}, {'id': 'https://huggingface.co/papers/2608.25512', 'title': 'A Programming Paradigm for Spatiotemporal Composability', 'url': 'https://huggingface.co/papers/2608.25512', 'abstract': "Abstract A calculus and framework unify revertible effects and reactive coeffects into a context paradigm enabling spatiotemporal composability for dynamic software components.  Generated by thinkingmachines/Inkling-Small Modern software -- from plugin systems to self-evolving agent harnesses -- increasingly requires dynamic composition, yet its formal foundations remain underdeveloped. We identify two orthogonal dimensions of the problem: temporal composability, the ability to completely revert a component's side effects upon removal, and spatial composability, the ability to declare and reactively manage inter-component dependencies. We address the two dimensions by lifting classical effect and coeffect concepts to runtime mechanisms. In particular, we formalize revertible effects, in which every context transformation carries an inverse that the runtime holds, establishing temporal composability local to one component. We formalize reactive coeffects, in which every context change is classified against a component's coeffect specification to drive its activation and deactivation, establishing spatial composability local to one component. We then unify the effect context and the coeffect context into a single context type and mediate every effect and coeffect through it, yielding a discipline we call the context paradigm; the mediation induces an observational equivalence up to which the effects of distinct components interleave without disturbing one another. Combining these mechanisms into the notion of a component, we give a calculus of dynamic composition whose metatheory carries spatiotemporal composability from a single component to a whole system of interleaved components. We implement these ideas in Cordis, a meta-framework of spatiotemporal composability that provides a core library with effect tracking and coeffect resolution, as well as a declarative component loader with configuration reconciliation and hot module replacement.", 'score': 8, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'b2a261a483f0c888', 'authors': ['Yifan Shi', 'Wei Zhang', 'Tianyi Cui'], 'affiliations': ['DeepSeek-AI', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.25512.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Контекстная парадигма для динамической и обратимой композиции компонентов', 'desc': 'В работе предложен формальный исчисления и фреймворк для унификации обратимых эффектов и реактивных коэффектов в единую контекстную парадигму. Авторы решают проблему динамической композиции компонентов программного обеспечения, разделяя её на два аспекта: временную композируемость (возможность полностью откатить побочные эффекты при удалении компонента) и пространственную композируемость (управление зависимостями между компонентами). Формализация основана на классических концепциях эффектов и коэффектов, поднятых на уровень runtime-механизмов, с единой контекстной типизацией для обоих. Предложенный фреймворк Cordis реализует эти идеи с отслеживанием эффектов, разрешением коэффектов и поддержкой горячей замены модулей.'}, 'en': {'title': 'Unifying Effects and Coeffects for Dynamic Software Composition', 'desc': 'This paper presents a new framework that combines revertible effects and reactive coeffects to improve how software components can be dynamically composed. It introduces the concepts of temporal composability, which allows for the complete reversal of side effects when a component is removed, and spatial composability, which manages dependencies between components. By formalizing these concepts, the authors create a unified context type that mediates effects and coeffects, ensuring that components can interact without interference. The proposed system, implemented in a framework called Cordis, enhances the ability to manage dynamic software systems effectively.'}, 'zh': {'title': '动态软件组件的时空组合性', 'desc': '本文提出了一种统一可逆效应和反应性共同效应的框架，形成了一种上下文范式，以实现动态软件组件的时空组合性。我们识别出两个正交维度：时间组合性和空间组合性，分别处理组件的副作用和组件间的依赖关系。通过将经典的效应和共同效应概念提升到运行时机制，我们实现了可逆效应和反应性共同效应的形式化。最终，我们将效应上下文和共同效应上下文统一为单一上下文类型，形成了一种新的动态组合计算法，支持复杂系统中组件的无缝交互。'}}}, {'id': 'https://huggingface.co/papers/2608.25864', 'title': 'MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization', 'url': 'https://huggingface.co/papers/2608.25864', 'abstract': 'Abstract MA-VLA enables multi-arm collaboration by assigning atomic actions to individual arms and using training-time permutations to generalize to unseen coordination patterns.  Generated by thinkingmachines/Inkling-Small Multi-arm collaboration is becoming a core capability in embodied manipulation. Recent vision-language-action (VLA) models integrate perception, language, and control, but most represent language as a single global instruction and do not provide an explicit mechanism for assigning and composing arm-specific behaviors. This design limits transfer to collaboration patterns that differ from those observed during training. We present MA-VLA, a unified framework for multi-arm collaboration via atomic action assignment. MA-VLA decomposes cooperative behavior into mid-level atomic prompts and allocates them to individual arms, enabling explicit subgoal specification and compositional reuse across tasks. To reduce reliance on fixed execution roles, we introduce Arm Shuffle, a training-time permutation of the observation, state, and assigned atomic prompts for each arm. This permutation enforces role-agnostic instruction following and supports recomposition into unseen coordination patterns, which we term multi-arm compositional generalization. We also construct a benchmark in which test-time collaboration patterns are absent in training set. Across simulation and real-world evaluations, prior state-of-the-art VLAs largely fail under these unseen collaborations, while MA-VLA consistently succeeds. These results indicate that structured, per-arm atomic action assignment offers a practical route to scalable generalization in multi-arm embodied systems. Code, models, and data are available at https://github.com/zhangzaibin/future-robots', 'score': 5, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'b82dc7a0ff47fe5c', 'authors': ['Zaibin Zhang', 'Junlan Xiao', 'Zhongbo Zhang', 'Yifan Wang', 'Li Kang', 'Yiran Qin', 'Changxing Xia', 'Heng Zhou', 'Talas Fu', 'Enshen Zhou', 'Ruimao Zhang', 'Zhenfei Yin', 'Huchuan Lu', 'Lijun Wang'], 'affiliations': ['Beihang University', 'Dalian University of Technology', 'Shanghai Jiao Tong University', 'Sun Yat-sen University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Oxford', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.25864.jpg', 'data': {'categories': ['#robotics', '#dataset', '#benchmark', '#training', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Композиционное обобщение в многорукой манипуляции через атомарное распределение действий', 'desc': 'MA-VLA — это фреймворк для координации многорукых манипуляторов, который разбивает совместные действия на атомарные подкоманды и распределяет их между отдельными руками. Модель использует архитектуру vision-language-action, интегрирующую зрение, язык и управление, но обрабатывает инструкции более структурированно через per-arm ассигнации. Для улучшения обобщения на невиданные паттерны координации авторы вводят метод Arm Shuffle — перестановку наблюдений и приписанных действий на этапе обучения, что обеспечивает робастность к изменению ролей. Экспериментальные результаты показывают, что предложенный подход значительно превосходит существующие VLA модели при работе с новыми схемами сотрудничества как в симуляции, так и в реальных условиях.'}, 'en': {'title': 'Empowering Robots with Flexible Multi-Arm Collaboration', 'desc': 'The paper introduces MA-VLA, a framework designed for multi-arm collaboration in robotic systems. It assigns atomic actions to individual robotic arms, allowing for more flexible and specific control over their behaviors. By using a technique called Arm Shuffle, the framework can generalize to new coordination patterns that were not seen during training. This approach enhances the ability of robots to work together effectively in various tasks, demonstrating improved performance in both simulations and real-world scenarios.'}, 'zh': {'title': '多臂协作的新方法：MA-VLA', 'desc': 'MA-VLA是一种多臂协作的统一框架，通过将原子动作分配给各个臂来实现。它将合作行为分解为中级原子提示，并为每个臂分配这些提示，从而实现明确的子目标规范和任务间的组合重用。为了减少对固定执行角色的依赖，MA-VLA引入了Arm Shuffle，在训练时对观察、状态和分配的原子提示进行排列组合。这种方法支持在未见过的协作模式中进行重组，从而实现多臂组合泛化。'}}}, {'id': 'https://huggingface.co/papers/2608.15062', 'title': 'Gated Recurrent Transformers: Expressive Depth through Recurrent Modulation', 'url': 'https://huggingface.co/papers/2608.15062', 'abstract': 'Abstract A gated recurrent transformer reuses a shared core across depth with adaptive update gates, achieving comparable or better quality than deeper models with far fewer parameters and lower memory.  Generated by thinkingmachines/Inkling-Small Scaling transformer language models creates an inherent tension between expressivity and memory efficiency. While unique weights across layers preserve functional specialization---from input-grounding to abstract refinement---they incur a substantial memory footprint. Conversely, standard depth-sharing enforces uniform transformations that collapse representational diversity and degrade modeling quality. We introduce Gated Recurrent Transformer, a recurrent depth transformer where fixed-depth prelude and coda blocks bracket a single shared core iterated R times. Inspired by gated recurrent neural networks, we employ a lightweight projection and an elementwise update gate---conditioned on the hidden state, the fixed prelude output, and noise resampled at every step---to modulate the recurrent update. This allows the model to specialize the input to the same few layers across recurrences, rather than requiring many unique layers to achieve functional diversity. Under an isoFLOPS constraint, a 3-layer Gated Recurrent Transformer matches the accuracy of a 12-layer GPT-2 Small baseline with similar training and inference FLOPs, and leads MoR and heavy-tail depth sampling in all nine scale-by-budget cells; at medium and large scale it approaches dense quality at the standard token budget and overtakes it at medium scale once that budget is doubled. Under an isoPARAMS constraint, deeper recurrence achieves a 2.76 validation loss versus 2.84 for a non-recurrent counterpart at matched parameter and data budget. Our results demonstrate that adaptive depth reuse is a principled strategy for trading parameters for quality: at large scale, 63% fewer parameters and 59% less peak decoding memory for a 10% increase in compiled generation latency.', 'score': 5, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '9a693d3e665018a8', 'authors': ['Amr Hegazy', 'Amr Alanwar', 'Mostafa Elhoushi'], 'affiliations': ['Cerebras Systems Inc.', 'Technical University of Munich', 'The German University in Cairo'], 'pdf_title_img': 'assets/pdf/title_img/2608.15062.jpg', 'data': {'categories': ['#training', '#small_models', '#architecture'], 'emoji': '🔄', 'ru': {'title': 'Глубина через переиспользование: эффективные трансформеры с адаптивными вентилями', 'desc': 'В работе предложен Gated Recurrent Transformer, архитектура трансформера, которая переиспользует общее ядро на нескольких слоях с адаптивными вентилями обновления. Модель содержит фиксированные блоки предварительной и постобработки, между которыми находится одно общее ядро, повторяемое несколько раз с модуляцией обновлений на основе скрытого состояния и добавленного шума. Такой подход позволяет достичь функциональной специализации слоёв без избыточного увеличения параметров модели. Экспериментальные результаты показывают, что 3-слойный Gated Recurrent Transformer соответствует качеству 12-слойного GPT-2 Small при аналогичных вычислительных затратах, при этом использует на 63% меньше параметров и на 59% меньше памяти при незначительном увеличении латентности генерации.'}, 'en': {'title': 'Efficient Depth Reuse for Enhanced Transformer Performance', 'desc': 'The paper introduces the Gated Recurrent Transformer, a novel architecture that optimizes the use of parameters and memory in transformer models. By reusing a shared core across multiple layers with adaptive update gates, it achieves similar or better performance compared to deeper models with significantly fewer parameters. This approach allows the model to maintain functional diversity without the high memory costs associated with unique weights for each layer. The results show that this method can lead to improved efficiency, achieving lower validation loss and reduced memory usage while maintaining high-quality outputs.'}, 'zh': {'title': '门控递归变换器：少参数高质量的创新模型', 'desc': '本文介绍了一种新的模型，称为门控递归变换器（Gated Recurrent Transformer），它通过自适应更新门在深度上重用共享核心，从而在参数更少和内存更低的情况下，达到与更深模型相当或更好的质量。该模型结合了递归神经网络的灵感，使用轻量级投影和逐元素更新门来调节递归更新，使得模型能够在相同的少数层中专门化输入，而不需要许多独特的层来实现功能多样性。实验结果表明，在相同的计算预算下，3层的门控递归变换器在准确性上与12层的GPT-2小型基线相匹配，并在多个规模中超越了传统模型。总的来说，适应性深度重用是一种有效的策略，可以在参数和质量之间进行权衡。'}}}, {'id': 'https://huggingface.co/papers/2608.25625', 'title': 'RetrievalRouter: Joint Modality and Architecture Selection for Document Retrieval', 'url': 'https://huggingface.co/papers/2608.25625', 'abstract': 'Abstract RetrievalRouter adaptively selects retrieval pipelines per query to improve both accuracy and speed across diverse document benchmarks.  Generated by thinkingmachines/Inkling-Small Document retrieval increasingly supports high-stakes information access in finance, healthcare, and law. Modern retrieval pipelines vary both in modality (text or multimodal) and in retrieval architecture (dense or late-interaction). These choices impose a hard compromise: the most effective pipelines are too slow and expensive to run at scale, while the fastest fail to retrieve evidence from complex documents. Practitioners must therefore choose between missed evidence and unusable latency, with no principled basis for adapting that choice at the query level. We show that this compromise is unnecessary. Not every query requires the same pipeline. Across benchmarks spanning financial and scientific corpora, no static pipeline dominates. We introduce RetrievalRouter, a lightweight query-aware router that learns, from the query text alone, which retrieval pipeline best fits each query. A single tunable parameter exposes the full accuracy-latency frontier, and for every static baseline, RetrievalRouter offers an operating point that is simultaneously more accurate and faster. Against the best static baseline, RetrievalRouter is 2.5% more accurate and 12.4 times faster. Furthermore, compared with prior adaptive strategy selection methods, RetrievalRouter achieves significantly higher nDCG@5 across accuracy-oriented settings, while matching or numerically outperforming them on both nDCG@5 and latency in latency-oriented settings. Our code and data are available at https://github.com/emrekuruu/retrieval-router.', 'score': 2, 'issue_id': 3179, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '86203a2cc4710d37', 'authors': ['Emre Kuru', 'Mehmet Onur Keskin', 'Reza Farahbakhsh', 'Noel Crespi'], 'affiliations': ['SAMOVAR, Télécom SudParis, Institut Polytechnique de Paris', 'Özyegin University'], 'pdf_title_img': 'assets/pdf/title_img/2608.25625.jpg', 'data': {'categories': ['#inference', '#rag', '#benchmark'], 'emoji': '🛣️', 'ru': {'title': 'Умный маршрутизатор запросов: выбирать лучший поиск для каждого вопроса', 'desc': 'RetrievalRouter — это адаптивная система выбора моделей извлечения информации, которая анализирует каждый запрос и динамически выбирает наиболее подходящий pipeline для оптимального баланса между точностью и скоростью. Система работает с различными архитектурами поиска (плотные векторы и late-interaction модели) и модальностями (текстовые и мультимодальные), решая проблему компромисса между качеством результатов и вычислительной эффективностью. Легковесный маршрутизатор обучается на текстах запросов предсказывать, какой retrieval pipeline будет оптимален для каждого конкретного случая, предоставляя единый параметр для управления фронтиром точности-задержки. В экспериментах RetrievalRouter показал 2.5% улучшение точности и ускорение в 12.4 раза по сравнению с лучшими статическими базовыми моделями.'}, 'en': {'title': 'Smart Query Routing for Faster, More Accurate Document Retrieval', 'desc': 'RetrievalRouter is a novel approach that dynamically selects the best retrieval pipeline for each query to enhance both accuracy and speed in document retrieval tasks. It addresses the challenge of choosing between slow, accurate pipelines and fast, less effective ones, which is crucial in high-stakes fields like finance and healthcare. By learning from the query text, RetrievalRouter identifies the optimal pipeline, allowing for a more efficient retrieval process without compromising on performance. The results show that it outperforms static baselines in both accuracy and speed, making it a significant advancement in adaptive retrieval strategies.'}, 'zh': {'title': '智能选择检索管道，提升效率与准确性', 'desc': 'RetrievalRouter 是一种自适应的检索管道选择方法，旨在提高在不同文档基准上的准确性和速度。它通过分析查询文本，智能选择最适合的检索管道，从而避免了在速度和准确性之间的妥协。与静态管道相比，RetrievalRouter 在准确性上提高了 2.5%，并且速度快了 12.4 倍。该方法在金融和科学文献的基准测试中表现出色，能够在不同的设置下提供更好的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.25204', 'title': 'LibriBrain100: One Hundred Hours of Broad and Deep MEG Data for Neural Speech Decoding at Scale', 'url': 'https://huggingface.co/papers/2608.25204', 'abstract': 'Abstract LibriBrain100 is a large-scale MEG speech dataset that demonstrates improved decoding through extensive within-subject recordings and multi-subject supervised fine-tuning of pre-trained models.  Generated by thinkingmachines/Inkling-Small We introduce LibriBrain100, a large-scale MEG dataset for speech decoding designed from the ground up for reproducible, standardised evaluation. LibriBrain100 more than doubles the size of the original LibriBrain release, resulting in over 100 hours of high-quality MEG acquired while subjects listened to naturalistic continuous speech. With sim80 hours from a single subject, LibriBrain100 sets a new record for deep, within-subject neural data (8times more than the next comparable dataset and roughly 80times more than other datasets). To demonstrate the payoff of this depth-first design, we evaluate on a word-classification benchmark---an increasingly well-established stepping stone towards the open challenge of noninvasive brain-to-text decoding. Using an existing decoding model, we achieve state-of-the-art performance---validating both the quality of the recordings and the value of within-subject data at scale. Because collecting 80 hours of data per user is impractical for real-world applications, we also collected sim40 minutes of additional data from each of 32 subjects. Using the same word-classification benchmark, we demonstrate the value of broad multi-subject data: supervised finetuning of a pre-trained model can substantially compensate for limited per-subject data. We provide standard train, validation, and test splits, all reproducible through an open-sourced Python library that supports easy downloading, optional preprocessing, and data loading for common deep learning frameworks. In addition, the dataset and evaluation infrastructure are being released alongside an open machine-learning competition with a public leaderboard for standardised benchmarking. Ultimately, our hope is that LibriBrain100 will accelerate progress towards practical non-invasive brain-computer interfaces, capable of restoring communication to people living with severe paralysis.', 'score': 2, 'issue_id': 3179, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '65a93477ac6b1c39', 'authors': ['Francesco Mantegna', 'Dulhan Jayalath', 'Gereon Elvers', 'Tasha Kim', 'Benjamin Ballyk', 'Alex Fung', 'SungJun Cho', 'Teyun Kwon', 'Luisa Kurth', 'Miran Özdogan', 'Gilad Landau', 'Pratik Somaiya', 'Natalie Voets', 'Mark Woolrich', 'Oiwi Parker Jones'], 'affiliations': ['FMRIB, Oxford Centre for Integrative Neuroimaging, University of Oxford, UK', 'OHBA, Oxford Centre for Integrative Neuroimaging, University of Oxford, UK', 'PNPL, Department of Engineering Science, University of Oxford, UK'], 'pdf_title_img': 'assets/pdf/title_img/2608.25204.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Масштабные данные мозга: от глубины к обобщению в декодировании речи', 'desc': 'LibriBrain100 — это крупномасштабный набор данных МЭГ (магнитоэнцефалография) для декодирования речи, содержащий более 100 часов высокачественных записей мозговой активности. Исследователи продемонстрировали, что глубокие внутрисубъектные записи (80 часов от одного человека) позволяют достичь государственного уровня производительности при классификации слов с помощью предварительно обученных моделей. Дополнительно авторы собрали данные от 32 испытуемых, показав, что supervised fine-tuning предварительно обученной модели может компенсировать ограниченный объём данных от каждого отдельного субъекта. Датасет выпущен с открытым исходным кодом, стандартными разделениями для обучения и оценки, а также соревнованием с публичной таблицей лидеров для стандартизированного сравнения моделей.'}, 'en': {'title': 'Unlocking Speech Decoding with LibriBrain100', 'desc': 'LibriBrain100 is a large-scale dataset designed for decoding speech from MEG (magnetoencephalography) recordings, significantly enhancing the amount of data available for training machine learning models. It features over 100 hours of high-quality recordings, with a focus on within-subject data collection, which allows for more accurate model training and evaluation. The dataset not only improves performance on word-classification tasks but also demonstrates the effectiveness of fine-tuning pre-trained models with multi-subject data. By providing a standardized framework and an open competition, LibriBrain100 aims to advance the development of non-invasive brain-computer interfaces for individuals with severe communication impairments.'}, 'zh': {'title': 'LibriBrain100：加速非侵入性脑机接口的进展', 'desc': 'LibriBrain100是一个大规模的MEG语音数据集，旨在通过广泛的个体内录音和多主体监督微调预训练模型来提高解码效果。该数据集的规模超过了原始LibriBrain发布的两倍，提供了超过100小时的高质量MEG数据，记录了受试者听自然连续语音的过程。通过在词分类基准上进行评估，我们验证了录音质量和大规模个体内数据的价值，达到了最先进的性能。LibriBrain100的发布希望能加速非侵入性脑机接口的进展，帮助重建严重瘫痪患者的沟通能力。'}}}, {'id': 'https://huggingface.co/papers/2608.21839', 'title': 'FIRM-Video: Check Before You Score for Reliable Text-to-Video Reward Modeling', 'url': 'https://huggingface.co/papers/2608.21839', 'abstract': 'Abstract FIRM-Video uses checklist-driven verification of temporal visual evidence to build reliable reward models for text-to-video evaluation and alignment.  Generated by thinkingmachines/Inkling-Small Reliable reward models are essential for text-to-video evaluation and alignment. However, the trade-off between evaluation accuracy and inference efficiency places high demands on the quality of training supervision. Existing approaches often rely on holistic judges with fixed rubrics or open-ended reasoning, leading to incomplete inspection, unfaithful justification, and entangled attribution. We introduce FIRM-Video, a unified checklist-driven data construction framework based on a check-before-score principle: construct dimension-specific checklists, verify each criterion against temporal visual evidence, and aggregate only verified decisions. For Instruction Following, FIRM-Video decomposes prompts into weighted atomic requirements; for World Coherence, it constructs prompt-calibrated, target-specific checks grounded in visible entities and actions; and for Perceptual Quality, it applies a generic taxonomy of visual defects. The verified criteria and scores are further transformed into natural-language analyses for end-to-end reward modeling. Subsequently, we construct FIRM-Video-90K with 88,044 dimension-specific instances from 29,348 videos, and introduce FIRM-Video-Bench with 750 point-wise human annotations across 250 videos. The Qwen3-VL-based FIRM-Video-8B achieves the best overall MAE on FIRM-Video-Bench while consistently delivering the highest VBench Total, Quality, and Semantic Scores in Best-of-8 sampling across three video generators.', 'score': 2, 'issue_id': 3179, 'pub_date': '2026-08-22', 'pub_date_card': {'ru': '22 августа', 'en': 'August 22', 'zh': '8月22日'}, 'hash': '0004b9eeddfc1be2', 'authors': ['Peiyuan Zhang', 'Xiangyu Zhao', 'Hongbo Liu', 'Xiaoxing Hu', 'Mingxin Liu', 'Shuran Ma', 'Yunhang Shen', 'Jian Hu', 'Haihan Gao', 'Haoyu Cao', 'Xue Yang'], 'affiliations': ['Shanghai Jiao Tong University', 'Tencent Youtu Lab', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2608.21839.jpg', 'data': {'categories': ['#video', '#dataset', '#benchmark', '#training', '#multimodal'], 'emoji': '✅', 'ru': {'title': 'Чек-листовая верификация для надежного оценивания видео', 'desc': 'FIRM-Video представляет новую методологию для создания надежных моделей вознаграждения в задаче оценки видео, сгенерированного из текста. Система использует принцип «проверить перед оценкой», разлагая оценку на отдельные критерии, проверяемые на основе временных визуальных доказательств. Авторы создали датасет FIRM-Video-90K с 88 тысячами аннотированных примеров и бенчмарк FIRM-Video-Bench для валидации подхода. Модель FIRM-Video-8B на базе Qwen3-VL показывает лучшие результаты на предложенном бенчмарке и достигает высоких метрик качества на нескольких генераторах видео.'}, 'en': {'title': 'Reliable Video Evaluation through Checklist Verification', 'desc': 'FIRM-Video is a framework designed to improve the evaluation and alignment of text-to-video models by using a checklist-driven approach. It focuses on creating reliable reward models by verifying visual evidence against specific criteria before scoring. This method addresses the limitations of previous approaches that relied on subjective judgments and often resulted in incomplete evaluations. By constructing a large dataset and employing a systematic verification process, FIRM-Video enhances the accuracy and efficiency of video evaluation tasks.'}, 'zh': {'title': 'FIRM-Video：提升文本到视频评估的可靠性', 'desc': 'FIRM-Video 是一种基于检查表驱动的框架，用于构建可靠的文本到视频评估和对齐的奖励模型。该方法通过在评分前进行检查，确保每个标准都经过时间视觉证据的验证，从而提高评估的准确性和效率。FIRM-Video 还将提示分解为加权的原子要求，并构建与可见实体和动作相关的特定检查。最终，经过验证的标准和分数被转化为自然语言分析，以实现端到端的奖励建模。'}}}, {'id': 'https://huggingface.co/papers/2608.19556', 'title': 'Stream4D: 4D-Consistency for Streaming Autoregressive Diffusion Video Models', 'url': 'https://huggingface.co/papers/2608.19556', 'abstract': 'Abstract Stream4D improves autoregressive video generation by replacing static 3D critics with a dynamic 4D reconstruction reward and motion prior to preserve coherent motion and reduce geometric drift.  Generated by thinkingmachines/Inkling-Small Streaming autoregressive diffusion models enable real-time, long-horizon video generation, but their training objectives optimize local frame prediction rather than the geometry and dynamics of a coherent world: long rollouts accumulate geometric drift and degrade into static or unnatural motion. Recent bidirectional approaches address this problem using rewards signals built upon 3D Gaussian-Splatting reconstruction. However, a single rigid 3d reconstruction cannot model a dynamic scene, so this critic penalizes genuine object motion as reconstruction error and is maximized by freezing the video. This shortcut is especially detrimental in the AR setting, where each chunk can propagate an already-static configuration. In this work, we propose Stream4D, which replaces the static critic with a feed-forward 4D reconstruction reward that explicitly models scene dynamics, allowing coherent motion to receive high consistency rewards. To further guide motion magnitude and quality, we add a motion prior that rewards natural scene-flow magnitude while penalizing jitter and non-rigid artifacts. Our final recipe combines these two terms with a lightweight perceptual anchor. Across various autoregressive video backbones and various generation horizons, Stream4D improves 4D reconstruction quality, preserves motion more effectively, and achieves higher human-aligned preference. Project page: https://banyuanhao.github.io/Stream4D/', 'score': 2, 'issue_id': 3179, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '12edb5f94e570050', 'authors': ['Yuanhao Ban', 'Jiaqi Feng', 'Hengguang Zhou', 'Xiaohuan Pei', 'Justin Cui', 'Cho-Jui Hsieh'], 'affiliations': ['Tsinghua University', 'UCLA'], 'pdf_title_img': 'assets/pdf/title_img/2608.19556.jpg', 'data': {'categories': ['#architecture', '#video', '#optimization', '#rl', '#diffusion', '#training'], 'emoji': '🎬', 'ru': {'title': 'Динамическая 4D-награда для сохранения естественного движения в видеогенерации', 'desc': 'Stream4D решает проблему накопления геометрических ошибок в авторегрессивных моделях генерации видео, заменяя статичную 3D-критику на динамическую 4D-реконструкцию. Новый подход явно моделирует динамику сцены, позволяя алгоритму корректно вознаграждать естественное движение объектов вместо их замораживания. Авторы дополняют 4D-награду приором движения, который поощряет реалистичное оптическое течение и штрафует артефакты и дрожание. Экспериментальные результаты показывают, что Stream4D улучшает качество 4D-реконструкции, лучше сохраняет движение и демонстрирует более высокие оценки предпочтения людей.'}, 'en': {'title': 'Stream4D: Dynamic Rewards for Coherent Video Generation', 'desc': 'Stream4D enhances video generation by introducing a dynamic 4D reconstruction reward that captures scene motion, addressing the limitations of static 3D critics. This approach reduces geometric drift, which often leads to unnatural motion in generated videos. By incorporating a motion prior, Stream4D encourages realistic scene flow while minimizing jitter and artifacts. Overall, this method improves the coherence and quality of generated videos across different models and time horizons.'}, 'zh': {'title': '动态重建，提升视频生成质量', 'desc': 'Stream4D通过用动态的4D重建奖励和运动先验替代静态的3D评估器，来改善自回归视频生成。这种方法能够更好地保持一致的运动，减少几何漂移。与传统的3D重建方法不同，Stream4D能够建模动态场景，从而避免对真实物体运动的惩罚。最终，Stream4D在多个自回归视频模型和生成时间范围内，提升了4D重建质量，更有效地保持了运动一致性，并获得了更高的人类偏好。'}}}, {'id': 'https://huggingface.co/papers/2608.21140', 'title': 'A Modular Agent for Reliable and Auditable Spatial Relation Verification in CT Scans', 'url': 'https://huggingface.co/papers/2608.21140', 'abstract': 'Abstract A modular medical imaging agent decomposes spatial relation verification into parsing, anatomical localization, and geometric rules to outperform end-to-end vision-language models on CT spatial reasoning.  Generated by thinkingmachines/Inkling-Small Reliable spatial understanding is an important prerequisite for future medical vision-language systems that aim to support radiological report generation and structured image understanding. While modern vision-language models (VLMs) show promising performance on many medical imaging tasks, recent evidence suggests they remain weak in controlled spatial reasoning and often fail to reliably ground spatial relations in image evidence. Given that radiological reasoning hinges on understanding the relative positions of anatomical structures and findings, this spatial weakness poses risks to diagnostic accuracy. We present a modular medical imaging agent for binary spatial relation verification in axial CT slices. Instead of directly predicting spatial answers end-to-end, the system decomposes the task into explicit stages: language parsing, anatomical localization, and deterministic geometric verification. Natural-language queries are converted into structured relation tuples, queried organs are localized with a YOLO-based detector, and the final spatial decision is computed from object centers using deterministic geometric rules. We evaluate the approach on the held-out MIRP spatial QA benchmark and compare it against representative end-to-end VLM baselines. The best-performing hybrid configuration reaches 94.1% accuracy and 94.2% F1, outperforming direct Qwen2-VL prompting by 42.5 percentage points in accuracy, while preserving interpretable intermediate representations and auditable reasoning stages. The results suggest that explicit modular spatial verification can serve as a promising building block for future report-oriented medical imaging agents.', 'score': 1, 'issue_id': 3179, 'pub_date': '2026-08-21', 'pub_date_card': {'ru': '21 августа', 'en': 'August 21', 'zh': '8月21日'}, 'hash': 'f15d9ca8160944f3', 'authors': ['Simon Vincent Abel', 'Heiko Hillenhagen', 'Michael Götz', 'Timo Ropinski', 'Ayhan Can Erdur', 'Daniel Santak Wolf'], 'affiliations': ['Chair for AI in Healthcare and Medicine, Technical University of Munich (TUM) and TUM University Hospital, Germany', 'Department of Radiation Oncology, TUM University Hospital, Germany', 'Diagnostic and Interventional Radiology, Ulm University Hospital, Germany', 'Visual Computing Group, Institute of Media Informatics, Ulm University, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2608.21140.jpg', 'data': {'categories': ['#cv', '#agents', '#benchmark', '#healthcare', '#multimodal'], 'emoji': '🏥', 'ru': {'title': 'Модульность как путь к надёжному пониманию пространства в медицинской визуализации', 'desc': 'В статье предлагается модульный агент для медицинской визуализации, который решает задачу верификации пространственных отношений в КТ-снимках. Вместо прямого предсказания end-to-end моделей, система разлагает задачу на три этапа: парсинг естественного языка, локализация анатомических структур с помощью YOLO-детектора и детерминированная геометрическая верификация на основе центров объектов. Подход достигает 94.1% точности на бенчмарке MIRP, превосходя современные vision-language модели на 42.5 процентных пункта и обеспечивая интерпретируемость каждого этапа рассуждения. Модульная архитектура показывает, что явная декомпозиция пространственной верификации является перспективным подходом для будущих медицинских систем, ориентированных на генерацию радиологических отчётов.'}, 'en': {'title': 'Modular Approach Enhances Spatial Reasoning in Medical Imaging', 'desc': 'This paper introduces a modular medical imaging agent designed to improve spatial relation verification in CT scans. Unlike traditional end-to-end vision-language models, this approach breaks down the task into three clear stages: parsing the language, localizing anatomical structures, and applying geometric rules for verification. By using structured relation tuples and a YOLO-based detector, the system achieves high accuracy in spatial reasoning tasks. The results indicate that this modular method significantly enhances diagnostic accuracy and provides interpretable reasoning, making it a valuable tool for future medical imaging applications.'}, 'zh': {'title': '模块化医学影像代理：提升空间推理的准确性', 'desc': '这篇论文提出了一种模块化的医学影像代理，用于在CT图像中进行空间关系验证。该系统将任务分解为语言解析、解剖定位和几何验证三个明确阶段，而不是直接进行端到端的预测。通过这种方法，系统在空间推理方面的表现优于传统的视觉-语言模型，准确率达到94.1%。研究结果表明，明确的模块化空间验证可以为未来的医学影像报告生成系统提供有力支持。'}}}, {'id': 'https://huggingface.co/papers/2608.24909', 'title': 'Super Star: Towards Streaming Real-time Interactive Agents for Digital Humans', 'url': 'https://huggingface.co/papers/2608.24909', 'abstract': 'Abstract A real-time framework for online co-speech gesture generation uses a causal multimodal autoregressive model with streaming speech and motion history, supported by synthetic dialogue data and continual user-feedback adaptation.  Generated by thinkingmachines/Inkling-Small Existing co-speech gesture generation methods are predominantly studied in offline settings, where gestures are synthesized from complete speech segments. However, interactive digital humans in real-world scenarios are required to generate speech-synchronous gestures online, using only currently available response audio under strict latency constraints. As a result, prior methods are unsuitable for real-time interaction, as they either rely on future speech information or incur substantial inference delay. In this paper, we formulate online co-speech gesture generation for interactive digital humans and propose a real-time interactive framework that couples a streaming speech response module with an online gesture generation module. Specifically, the gesture generator is designed as a causal multimodal autoregressive model that predicts body motion from streaming response speech and motion history, enabling low-latency and speech-aligned gesture synthesis without access to future speech. To support this setting, we further propose an offline data synthesis pipeline tailored to virtual companion scenarios, which leverages topic- and emotion-aware subject corpora to construct diverse human-agent dialogues and then generates co-speech gestures conditioned on the agent responses. Moreover, to bridge the gap between offline data construction and online deployment, we establish a self-evolving training loop by incorporating user feedback collected during online interaction into the data generation process, enabling continual adaptation to user preferences. Extensive experiments demonstrate that our framework achieves superior better latency-quality trade-off, stronger speech-motion synchronization, and higher user preference than competitive existing baselines. Project Page: https://super-star-2026.github.io/', 'score': 1, 'issue_id': 3179, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'e0330883ff9b2b7f', 'authors': ['Wentao Jiang', 'Youchen Xie', 'Haidi Fan', 'Yajing Chen', 'Xin Wang', 'Ye Shi', 'Jingya Wang'], 'affiliations': ['LIGHTSPEED', 'ShanghaiTech University'], 'pdf_title_img': 'assets/pdf/title_img/2608.24909.jpg', 'data': {'categories': ['#open_source', '#synthetic', '#agents', '#video', '#training', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Синхронизация жестов и речи в реальном времени для интерактивных цифровых персонажей', 'desc': 'В статье представлена система реального времени для генерации жестов цифровых персонажей, синхронизированных с речью, без доступа к будущей информации о речи. Авторы предлагают причинную мультимодальную авторегрессивную модель, которая предсказывает движения тела на основе потокового аудио и истории движений с минимальной задержкой. Для обучения модели разработан конвейер синтеза данных с использованием диалогов с учётом тематики и эмоций, а также механизм адаптации через обратную связь пользователей. Экспериментальные результаты показывают превосходное качество синхронизации речи и движений при низкой задержке в сравнении с существующими методами.'}, 'en': {'title': 'Real-Time Gesture Generation for Interactive Digital Humans', 'desc': 'This paper presents a real-time framework for generating co-speech gestures in interactive digital humans using a causal multimodal autoregressive model. Unlike traditional methods that rely on complete speech segments, this approach generates gestures synchronously with ongoing speech, addressing the need for low-latency interactions. The framework incorporates a streaming speech response module and an online gesture generation module, allowing for immediate gesture synthesis based on current audio and motion history. Additionally, it adapts to user feedback, ensuring that the system evolves to meet individual preferences while maintaining high-quality gesture generation.'}, 'zh': {'title': '实时在线共语手势生成的创新框架', 'desc': '本论文提出了一种实时的在线共语手势生成框架，使用因果多模态自回归模型，结合流式语音和运动历史。与传统的离线手势生成方法不同，该框架能够在严格的延迟限制下，实时生成与语音同步的手势。我们设计的手势生成器能够从当前的语音响应和运动历史中预测身体动作，而无需依赖未来的语音信息。此外，通过用户反馈的自我演化训练循环，我们的框架能够持续适应用户的偏好，提升交互体验。'}}}, {'id': 'https://huggingface.co/papers/2608.22071', 'title': 'Real-TurnTurk: A Multimodal Turkish Corpus for Turn-Taking Prediction', 'url': 'https://huggingface.co/papers/2608.22071', 'abstract': 'Abstract A multimodal Turkish dialogue dataset and genetic algorithm-optimized interpretable rules are used to predict turn transitions from visual, acoustic, and linguistic cues.  Generated by thinkingmachines/Inkling-Small Turn-taking is a basic organizational feature of human conversation and remains difficult to model in natural, synchronous dialog systems. While existing research has explored multimodal approaches and large language models for turn-ending prediction, there is a lack of naturalistic conversational corpora specifically addressing turn-taking dynamics in Turkish. This study introduces a multimodal Turkish conversational dataset of unscripted dyadic interactions, comprising synchronized front-facing video, per-speaker audio channels that allow overlapping speech to be attributed to individual speakers, and time-aligned transcriptions. Turn-taking prediction is formulated as a binary classification problem, and a Genetic Algorithm (GA) is employed to optimize interpretable decision rules derived from visual, acoustic, and linguistic features. A hybrid AND-OR rule representation is adopted in the proposed framework to represent the alternative cue combinations that precede a turn transition.', 'score': 0, 'issue_id': 3179, 'pub_date': '2026-08-22', 'pub_date_card': {'ru': '22 августа', 'en': 'August 22', 'zh': '8月22日'}, 'hash': '2b2ff64076f2b219', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#multimodal', '#multilingual'], 'emoji': '🗣️', 'ru': {'title': 'Генетические алгоритмы для интерпретируемого предсказания смены участников в мультимодальном диалоге', 'desc': 'В работе представлен мультимодальный датасет турецких диалогов с синхронизированным видео, аудио и текстом для моделирования смены участников разговора. Авторы формулируют задачу предсказания переходов очередности как проблему бинарной классификации, используя признаки из визуального, акустического и лингвистического модальностей. Для оптимизации интерпретируемых правил принятия решений применяется генетический алгоритм с гибридным представлением AND-OR правил, которые отражают альтернативные комбинации сигналов перед сменой говорящего. Такой подход позволяет создать прозрачную и объяснимую модель динамики диалога на турецком языке, превосходящую существующие методы на основе больших языковых моделей.'}, 'en': {'title': 'Optimizing Turn-Taking Predictions in Turkish Dialogue', 'desc': 'This paper presents a new dataset for Turkish dialogue that captures how people take turns in conversation using visual, acoustic, and linguistic signals. It addresses the challenge of predicting when one speaker will stop talking and another will start, which is crucial for creating more natural dialogue systems. The authors use a Genetic Algorithm to optimize decision rules that help in making these predictions based on the different cues. By combining these cues into a hybrid rule framework, the study aims to improve the understanding of turn-taking dynamics in Turkish conversations.'}, 'zh': {'title': '优化对话轮流发言的多模态预测', 'desc': '本研究提出了一个多模态的土耳其对话数据集，旨在通过视觉、声学和语言线索预测对话中的轮流发言。研究中使用遗传算法优化可解释的决策规则，以提高对话系统的表现。该数据集包含同步的视频、每个说话者的音频通道和时间对齐的转录文本，能够处理重叠发言。通过将轮流发言预测视为二分类问题，研究展示了如何利用多种特征组合来改善对话的自然性和流畅性。'}}}];

            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (8)', '#agi', '#alignment', '#architecture (5)', '#audio (1)', '#benchmark (17)', '#cv (3)', '#data', '#dataset (9)', '#diffusion (2)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (1)', '#interpretability', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (13)', '#open_source (5)', '#optimization (5)', '#plp (2)', '#rag (1)', '#reasoning (4)', '#rl (7)', '#rlhf (2)', '#robotics (3)', '#science (1)', '#security (1)', '#small_models (5)', '#story_generation', '#survey (1)', '#synthetic (2)', '#training (17)', '#transfer_learning (2)', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-27 13:25',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-27 13:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-27 13:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
