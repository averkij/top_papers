it evaluates student rollouts. Our code is available at https://github.com/HancCui/opd_hacking.", 'score': 27, 'issue_id': 3385, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '0632af1aeeb5ca42', 'authors': ['Han Cui', 'Jianhao Yan', 'Yun Luo', 'Hongbo Zhang', 'Zhizhang Fu', 'Yue Zhang'], 'affiliations': ['Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.03185.jpg', 'data': {'categories': [], 'emoji': '🎓', 'ru': {'title': 'Когда учитель нечаянно учит неправильному: взлом дистилляции языковых моделей', 'desc': 'В статье исследуется метод обучения языковых моделей через дистилляцию от учителя к ученику (OPD). Авторы показывают, что этот подход работает через механизм неявного вознаграждения: учитель косвенно поощряет поведение ученика, даже если сам его редко демонстрирует. Проблема заключается в том, что когда оценка качества становится ненадежной, происходит reward hacking — модель начинает генерировать чрезмерно длинные и повторяющиеся тексты. Исследователи предлагают решение через маскирование плохих ответов во время обучения и использование инициализации через SFT, что эффективно предотвращает деградацию качества.'}, 'en': {'title': 'Enhancing Language Models: Balancing Rewards and Responses in OPD', 'desc': "This paper discusses On-policy Distillation (OPD) in language model post-training, highlighting its potential to improve performance while also risking excessive repetition in generated text. The authors analyze OPD through a reinforcement learning lens, revealing that the teacher model's implicit rewards can lead to unintended behaviors in the student model. They find that when the teacher's reward model is reliable, it helps the student generate better responses, but misalignment can cause 'reward hacking', resulting in poor quality outputs. To address these issues, the paper suggests techniques like masking undesirable responses and using supervised fine-tuning (SFT) initialization to stabilize training outcomes."}, 'zh': {'title': '优化在线策略蒸馏，提升生成质量', 'desc': '本文探讨了在语言模型后训练中，在线策略蒸馏（OPD）所带来的性能提升及其潜在问题。研究发现，OPD可能导致生成内容过长和重复，且其背后的机制尚不清楚。通过强化学习的视角，我们发现教师模型对学生行为的隐性奖励可能导致这种现象。为了解决这一问题，本文提出在训练过程中屏蔽不健康的响应，并使用SFT初始化，以有效减轻生成崩溃的现象。'}}}, {'id': 'https://huggingface.co/papers/2610.08995', 'title': 'PhysEvo: Astra Can Act, Let It', 'url': 'https://huggingface.co/papers/2610.08995', 'abstract': "Abstract  Astra can act, yet reliable manipulation depends on the system through which it observes and controls the world. We introduce PhysEvo, a framework for physical recursive self-improvement (RSI) around a single frozen model. A task agent executes robot tasks; a meta-agent uses the resulting trajectories to diagnose failures, revise tools and skills, and test corrections. The meta-agent can also improve its own diagnostic tools, so retained revisions support both later action and later self-improvement. This process develops joint-level control, evidence-seeking observation, and reusable manipulation skills without model-weight updates or a separately trained action policy. Across 42 RoboDojo tasks, held-out-layout evaluation of retained task-specific deployment versions yields a five-dimension average score of 68.14/100 and 62.00% success, compared with 47.17% for RoboDawn's one-shot Astra agent, the strongest published reference in our comparison. On eight manipulation tasks challenging direct Astra, PhysEvo achieves 55.00% success, compared with 1.25% for the direct-Astra reference. Deploying the simulation-evolved harness on AgileX PiPER and continuing skill revision yields 90.60/100 average score and 84.00% success across 25 trials on five real-world tasks. PhysEvo turns the consequences of action into persistent, testable changes to how a frozen model acts and improves.", 'score': 26, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'b11c58c5c190f9c9', 'authors': ['Wenqing Tian', 'Zeyu Zhang', 'Zhaocheng Liu', 'Fengwei Liu', 'Qiang Liu', 'Liang Wang'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'Tsinghua University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.08995.jpg', 'data': {'categories': ['#agents', '#rl', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Самоулучшение робота через анализ действий без переобучения модели', 'desc': 'В работе представлена PhysEvo — фреймворк для физической рекурсивной самоулучшения робота на основе замороженной модели без обновления весов. Агент задач выполняет манипуляционные операции, в то время как мета-агент анализирует полученные траектории, диагностирует ошибки и итеративно улучшает инструменты и навыки. Система позволяет разрабатывать управление суставами, поисковое наблюдение и переиспользуемые манипуляционные навыки через циклический процесс коррекции и тестирования. Экспериментальная оценка показала значительное улучшение производительности на задачах манипуляции: 62% успешного выполнения на 42 задачах в симуляции и 84% на реальном роботе AgileX PiPER.'}, 'en': {'title': 'Empowering Robots with Self-Improvement through PhysEvo', 'desc': "The paper presents PhysEvo, a framework designed for physical recursive self-improvement (RSI) using a single static model. It features a task agent that performs robot tasks while a meta-agent analyzes the outcomes to identify failures and enhance tools and skills. This meta-agent can also refine its diagnostic capabilities, allowing for ongoing improvements in both task execution and self-optimization. The results demonstrate significant performance gains in various robotic tasks compared to existing methods, showcasing the effectiveness of this approach in achieving reliable manipulation without altering the model's weights."}, 'zh': {'title': 'PhysEvo：让机器人自我改进的框架', 'desc': '本文介绍了PhysEvo框架，它通过一个固定模型实现物理递归自我改进。任务代理执行机器人任务，元代理利用结果轨迹诊断失败，修订工具和技能，并测试修正。元代理还可以改进自己的诊断工具，从而支持后续的行动和自我改进。通过这种方式，PhysEvo在不更新模型权重或单独训练行动策略的情况下，发展了联合控制、证据寻求观察和可重用的操作技能。'}}}, {'id': 'https://huggingface.co/papers/2610.07591', 'title': 'Recurrent Looped Transformer', 'url': 'https://huggingface.co/papers/2610.07591', 'abstract': "Abstract  State tracking requires an update at every input, but the depth a Transformer applies to each token is fixed regardless of sequence length. We introduce the Recurrent Looped Transformer (RLT), which splits its layers between a parallel causal encoder and a recurrent decoder. At each token, the decoder merges the encoder output with the previous token's final decoder state, so the computation path grows with sequence length at a fixed per-token cost. On six algorithmic tasks, we compare five splits of eight layers with an eight-layer Transformer over three seeds. Trained on at most 40 bits, two RLT splits generalize parity to 256 bits with 100% accuracy in every seed, while the Transformer stays at chance. On swap-based S_5 permutation tracking at eight times the training length, RLT reaches 97% final-state accuracy versus under 1% for the Transformer, and accuracy increases with decoder depth. On modular arithmetic beyond the training lengths, RLT reaches up to 93% versus 33% for the Transformer. Ablations show that these gains depend on the feedback: removing it drops parity and swap-based S_5 to chance at every split. Updating the feedback once per four-token chunk lets known tokens in a chunk run in parallel and keeps 64-bit parity at 99%, while permutation tracking depends on per-token feedback: chunking lowers length-64 swap-based S_5 from 100% to 20%.", 'score': 26, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '3ebe6b135d1d5547', 'authors': ['Yifan Zhang', 'Jichen Feng', 'Shihan Qin'], 'affiliations': ['Princeton University', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2610.07591.jpg', 'data': {'categories': ['#long_context', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Рекуррентная обратная связь для отслеживания длинных последовательностей', 'desc': 'В работе предложен Recurrent Looped Transformer (RLT) — новая архитектура, которая разделяет слои между параллельным причинным энкодером и рекуррентным декодером. Основная идея заключается в том, что декодер на каждом токене объединяет выход энкодера с предыдущим состоянием декодера, что позволяет глубине вычислений расти вместе с длиной последовательности при фиксированной стоимости на токен. Модель демонстрирует значительное превосходство над стандартным Transformer на задачах отслеживания состояния, таких как проверка четности, перестановки и модульная арифметика, особенно при обобщении на последовательности, превосходящие длину обучения. Эксперименты показывают, что улучшения зависят от обратной связи между декодером и энкодером на каждом шаге.'}, 'en': {'title': 'Revolutionizing State Tracking with Recurrent Looped Transformers', 'desc': 'The paper presents the Recurrent Looped Transformer (RLT), a novel architecture designed to improve state tracking in sequences. Unlike traditional Transformers, which apply a fixed depth to each token, RLT utilizes a recurrent decoder that integrates previous states with current inputs, allowing for a dynamic computation path that scales with sequence length. Experimental results demonstrate that RLT significantly outperforms standard Transformers on various algorithmic tasks, achieving high accuracy in parity and permutation tracking. The study highlights the importance of feedback mechanisms in enhancing model performance, showing that removing feedback leads to a drastic drop in accuracy.'}, 'zh': {'title': '递归循环变换器：提升状态跟踪的准确性', 'desc': '本文提出了一种新的模型，称为递归循环变换器（RLT），用于状态跟踪任务。RLT通过将层分为并行因果编码器和递归解码器来处理输入序列，使得每个令牌的计算成本保持固定。实验结果表明，RLT在多个算法任务上表现优于传统的变换器，尤其是在处理较长序列时。通过反馈机制的优化，RLT在准确性上取得了显著提升，尤其是在模运算和置换跟踪任务中。'}}}, {'id': 'https://huggingface.co/papers/2609.33678', 'title': 'SWE-Game: Can Coding Agents Build the Games We Want?', 'url': 'https://huggingface.co/papers/2609.33678', 'abstract': 'Abstract  We introduce SWE-Game, a benchmark of 247 tasks grounded in 41 executable reference Godot games spanning 13 gameplay categories in 2D and 3D. Five task types cover development from a brief, implementation from a game design document, skeleton completion, repair of 83 injected-fault cases, and Godot-to-Unity porting. Reference materials specify the intended gameplay, while a shared instrumentation interface lets evaluator-owned drivers and probes execute actions and observe independently implemented games. Evaluation combines engine-state checks, certified reference-input replay, and agent-authored feature demonstrations to assess mechanic correctness, demonstrated playability, and behavioral restoration and preservation after repairs. Game-specific vision-language rubrics separately assess presentation. Across six models, Opus5 achieves the highest overall score in all five task types. Best overall scores remain below 60 out of 100 across the three construction tasks, with Brief-to-Game reaching 50.38. Analysis of reviewed submissions identifies requirement omissions and gameplay logic errors as predominant implementation problems. On human-labeled behaviors from 100 agent-built games, executable checks achieve 92.59% balanced accuracy, compared with 78.41% for a video-based VLM judge. Rubric-based visual scores reach a Spearman correlation of 0.829 with human ratings of 200 gameplay clips. Together, these results characterize current agent capabilities across game-development activities and support combining runtime evidence with visual assessment.', 'score': 24, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '99e8772f28a51463', 'authors': ['Xiaoyu Chen', 'Lai Wei', 'Jin Wang', 'Xiangyu Zou', 'Ruochen Fan', 'Enze Luo', 'Mingzhe Yao', 'Jiahui Zhu', 'Yuhua Wen', 'Linghe Kong', 'Weiran Huang'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Elbetech Technology', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Shenzhen University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2609.33678.jpg', 'data': {'categories': ['#games', '#open_source', '#dataset', '#cv', '#agents', '#multimodal', '#3d', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Оценка способности AI создавать видеоигры через комбинированный анализ кода и визуального контента', 'desc': 'SWE-Game - это бенчмарк для оценки возможностей AI-агентов в разработке видеоигр, содержащий 247 задач на основе 41 исполняемых игр на движке Godot. Система предусматривает пять типов задач: разработку по краткому описанию, реализацию по игровому дизайну, дополнение кода, исправление ошибок и портирование из Godot в Unity. Оценка проводится комбинированным методом, включающим проверку состояния движка, воспроизведение эталонных входных данных и демонстрацию функций, созданных агентом. Результаты показывают, что лучшие LLM достигают менее 60% точности в задачах создания игр, при этом исполняемые проверки превосходят видео-анализ для определения корректности игровой механики.'}, 'en': {'title': 'SWE-Game: Benchmarking Game Development with AI Agents', 'desc': 'The paper presents SWE-Game, a comprehensive benchmark consisting of 247 tasks derived from 41 executable Godot games across various gameplay categories. It includes five distinct task types that focus on different aspects of game development, such as implementation and fault repair. The evaluation process utilizes a combination of engine-state checks and visual assessments to measure the correctness and playability of the games created by agents. Results indicate that while the highest scoring model, Opus5, performs well, overall scores remain low, highlighting common issues in game logic and implementation among the submissions.'}, 'zh': {'title': 'SWE-Game：游戏开发的基准与评估', 'desc': '我们介绍了SWE-Game，这是一个基于41个可执行参考Godot游戏的247个任务基准，涵盖了13种2D和3D游戏玩法类别。任务类型包括从简要说明到游戏设计文档的实现、骨架完成、修复83个注入故障案例以及Godot到Unity的移植。评估结合了引擎状态检查、认证参考输入重放和代理生成的特征演示，以评估机制的正确性、可玩性以及修复后的行为恢复和保留。分析显示，当前代理在游戏开发活动中的能力，以及运行时证据与视觉评估的结合。'}}}, {'id': 'https://huggingface.co/papers/2610.00994', 'title': 'VIEScore2: Unified Image Evaluation with Spatially Grounded Explanations', 'url': 'https://huggingface.co/papers/2610.00994', 'abstract': 'Abstract  Existing synthetic image evaluators typically provide only a scalar quality score and do not identify the image regions that support it. We introduce VIEScore2, a unified evaluator for image generation and editing tasks with optional conditioning images. VIEScore2 represents an image as an N x N grid and jointly predicts quality scores and defect locations in a single model pass. Its text-native grid representation provides a common interface for heterogeneous spatial supervision and enables directly verifiable post-training objectives. We train on 38K examples spanning score-only, localization-only, and joint supervision across generation and editing tasks. Starting from supervised fine-tuning, we further apply GRPO to improve defect localization using rewards that combine cell-level Dice overlap, score accuracy, and output-format validity. A parameter-free parser converts the structured predictions into readable explanations. On the primary suite, VIEScore2 achieves an overall-score SRCC of 0.601, compared with 0.491 for Gemini-3-Flash, the strongest zero-shot general-purpose VLM baseline under matched inputs. For defect localization, VIEScore2 outperforms both general-purpose VLMs and specialized spatial evaluators on three of six benchmarks in per-image grid IoU and ranks among the top three on five, including datasets beyond its training sources.', 'score': 23, 'issue_id': 3385, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '3f615b989d78a70f', 'authors': ['Xianda Du', 'Max Ku', 'Weiming Ren', 'Zhi Rui Tam', 'Chunlin Ren', 'Ping Nie', 'Min-Hung Chen', 'Wenhu Chen'], 'affiliations': ['NVIDIA', 'Nanyang Technological University', 'National Taiwan University', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2610.00994.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Локализованная оценка качества синтетических изображений с единой сеточной архитектурой', 'desc': 'В работе представлена VIEScore2 — унифицированная модель для оценки качества синтетических изображений при их генерации и редактировании. Модель предсказывает не только общую оценку качества, но и точное местоположение дефектов в виде сетки NxN, что позволяет получить детальную информацию о проблемах в изображении. Авторы обучают модель на 38K примерах с использованием разных типов разметки (только оценка, только локализация или их комбинация) и применяют метод GRPO для улучшения локализации дефектов через набор вознаграждений. VIEScore2 значительно превосходит современные базовые модели визуального понимания языка по точности оценки качества и локализации дефектов на нескольких бенчмарках.'}, 'en': {'title': 'VIEScore2: Revolutionizing Image Evaluation with Quality and Defect Insights', 'desc': 'VIEScore2 is a new tool for evaluating synthetic images that not only gives a quality score but also highlights specific areas of the image that may have defects. It uses a grid system to represent images, allowing it to predict both quality scores and defect locations in one go. The model is trained on a large dataset and employs a method called GRPO to enhance the accuracy of defect localization. Overall, VIEScore2 shows improved performance in both scoring and localization compared to existing models, making it a valuable tool for image generation and editing tasks.'}, 'zh': {'title': 'VIEScore2：图像质量与缺陷定位的统一评估器', 'desc': 'VIEScore2 是一种新的图像评估器，能够同时预测图像质量分数和缺陷位置。它将图像表示为 N x N 网格，并在一次模型推理中完成所有预测。通过这种文本原生的网格表示，VIEScore2 可以处理不同的空间监督任务，并提供可验证的训练目标。经过训练后，VIEScore2 在多个基准测试中表现优异，尤其在缺陷定位方面超越了其他通用和专用评估器。'}}}, {'id': 'https://huggingface.co/papers/2610.08963', 'title': 'On KL-Regularized Policy Optimization', 'url': 'https://huggingface.co/papers/2610.08963', 'abstract': "Abstract  Asynchronous reinforcement learning (RL) for large language model (LLM) agents trains one policy on trajectories generated by another: rollouts come from stale checkpoints, and the inference engine's probabilities differ from the trainer's even at identical parameters. Standard remedies either clip importance ratios, which biases the update, or, as in GRPO, sample a group of responses per prompt, which is costly when episodes are long. We propose KL-Regularized Policy Optimization (KLPO), a framework that anchors the KL regularizer at the sampler. The regularized improvement step then has a closed-form Gibbs solution, and KLPO fits its log-ratio optimality condition by least squares on the sampler's own trajectories, so the sampler probability enters through a log-ratio and no importance weights are needed. Profiling out the regression intercept replaces the intractable log-partition function with the signal's sampler mean plus a sampler-to-trainer KL divergence. For token-level policy mirror descent targets, we show that the resulting gradient can be computed from terminal returns without a critic, via sampler-centered scores or a single trajectory residual, even under stochastic tool outputs. We further prove that independent Monte Carlo estimates of the KL term keep these gradients unbiased, derive the exact KL gap of cheaper top-K and binary approximations, and show that SPPO, GPO, REBEL, and BPO arise as special cases of KLPO. The result is a critic-free update that uses one rollout per prompt and requires neither a learned normalizer nor a group of responses.", 'score': 19, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '04405185ca0868b2', 'pdf_title_img': 'assets/pdf/title_img/2610.08963.jpg', 'data': {'categories': ['#agents', '#rl', '#training', '#rlhf'], 'emoji': '⚖️', 'ru': {'title': 'Оптимизация политики без важности: KLPO для эффективного обучения языковых агентов', 'desc': 'В статье предлагается KL-Regularized Policy Optimization (KLPO) — новый подход к асинхронному обучению с подкреплением для больших языковых моделей, который решает проблему рассогласования между политиками sampler и trainer. Авторы показывают, что использование KL регуляризации, якорированной на sampler, позволяет получить closed-form решение Гиббса и избежать использования importance weights, которые могут вносить смещение в обновления. Метод имеет замкнутую форму решения и может вычислять градиенты только по терминальным наградам без необходимости в critic, используя sampler-centered scores или остаток одной траектории. Авторы доказывают, что KLPO объединяет несколько существующих методов (SPPO, GPO, REBEL, BPO) как частные случаи и требует только одного rollout на один prompt, что значительно экономит вычислительные ресурсы.'}, 'en': {'title': 'Efficient Policy Updates with KL-Regularized Optimization', 'desc': 'This paper introduces KL-Regularized Policy Optimization (KLPO), a new method for asynchronous reinforcement learning in large language models. KLPO addresses the challenge of training policies using outdated data by employing a KL regularizer that simplifies the update process without needing importance weights. The method allows for efficient computation of gradients from terminal returns, making it possible to update policies with just one rollout per prompt. Additionally, KLPO encompasses several existing methods as special cases, demonstrating its versatility and efficiency in policy optimization.'}, 'zh': {'title': '高效的KL正则化策略优化方法', 'desc': '这篇论文提出了一种新的异步强化学习框架，称为KL正则化策略优化（KLPO），用于大语言模型（LLM）代理的训练。KLPO通过在采样器上锚定KL正则化器，避免了传统方法中重要性权重的偏差问题。该方法能够在不需要评论者的情况下，仅通过一个回合的输出计算梯度，从而简化了更新过程。最终，KLPO提供了一种高效的策略更新方式，适用于长时间的训练任务。'}}}, {'id': 'https://huggingface.co/papers/2610.04722', 'title': 'NAMVIS: Next-Scale Autoregressive Multi-View Image Synthesis', 'url': 'https://huggingface.co/papers/2610.04722', 'abstract': 'Abstract  Sparse-view novel view synthesis is a central problem in 3D content creation, but diffusion-based approaches remain limited by iterative denoising, making multi-view generation expensive at inference time. We introduce NAMVIS, a diffusion-free framework that reformulates multi-view image synthesis as geometry-conditioned next-scale autoregression. Instead of generating target views through repeated denoising, NAMVIS predicts discrete visual tokens through a small number of coarse-to-fine scale steps, while sampling all tokens within each scale and across target views in parallel. To anchor this generation process to explicit camera geometry, we propose Multi-scale Projective Pose Encoding, which injects source and target camera transformations into both target-view self-attention and source-to-target cross-attention at every resolution. NAMVIS further combines global conditioning with dense geometry-aware cross-attention, enabling the model to preserve source-view appearance while maintaining target-view consistency. Across Objaverse, GSO, and OmniObject3D, NAMVIS outperforms diffusion-based baselines in PSNR, SSIM, and LPIPS, while running over 3 times faster than the evaluated diffusion baselines under the same evaluation setting. These results suggest that geometry-conditioned next-scale autoregression is a promising and efficient alternative to diffusion for sparse-view multi-view synthesis. Additional qualitative results, videos, and resources are available at https://corl-team.github.io/namvis/', 'score': 18, 'issue_id': 3386, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': 'e8cd84e17bd2aeeb', 'authors': ['Ramil Khafizov', 'Ilya Statsenko', 'Ruslan Rakhimov', 'Artem Komarichev', 'Peter Wonka', 'Evgeny Burnaev'], 'affiliations': ['AXXX', 'Applied AI Institute', 'KAUST', 'T-Tech'], 'pdf_title_img': 'assets/pdf/title_img/2610.04722.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Быстрый синтез многовидовых изображений через геометрически-обусловленную автогрессию', 'desc': "В работе предложен NAMVIS — новый подход к синтезу новых видов из разреженных изображений, который отказывается от дорогостоящего итеративного денойзинга диффузионных моделей. Вместо этого авторы используют автогрессивную генерацию дискретных визуальных токенов в несколько масштабов, обрабатывая все токены параллельно как внутри каждого масштаба, так и для всех целевых видов. Ключевой компонент — Multi-scale Projective Pose Encoding, который встраивает информацию о камерах источника и целевого вида в механизмы self-attention и cross-attention на каждом разрешении. Экспериментальные результаты на датасетах Objaverse, GSO и OmniObject3D показывают, что NAMVIS превосходит диффузионные baseline'ы по качественным метрикам и работает более чем в 3 раза быстрее."}, 'en': {'title': 'Efficient Multi-View Synthesis with Geometry-Conditioned Autoregression', 'desc': "This paper presents NAMVIS, a novel framework for synthesizing multi-view images without relying on diffusion processes. Instead of iterative denoising, NAMVIS uses geometry-conditioned next-scale autoregression to generate images in fewer steps. It incorporates Multi-scale Projective Pose Encoding to effectively utilize camera geometry, enhancing the model's ability to maintain visual consistency across different views. The results show that NAMVIS significantly outperforms traditional diffusion methods in both speed and image quality metrics like PSNR and SSIM."}, 'zh': {'title': 'NAMVIS：高效的稀疏视图多视图合成新方法', 'desc': '这篇论文介绍了一种名为NAMVIS的新框架，用于稀疏视图的多视图图像合成。与传统的基于扩散的方法不同，NAMVIS通过几何条件的自回归来生成图像，避免了迭代去噪的过程。它通过少量的粗到细的步骤预测离散的视觉标记，并在每个尺度和目标视图之间并行采样所有标记。实验结果表明，NAMVIS在多个数据集上表现优于扩散基线，并且速度快了三倍，显示出其在稀疏视图多视图合成中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.09920', 'title': 'Inverting Multi-Vector Visual Document Indices', 'url': 'https://huggingface.co/papers/2610.09920', 'abstract': 'Abstract  Prevailing multi-vector visual document retrievers store each page as about a thousand patch vectors, often in vector databases run by a third party. Since no one can read a page from its vectors, this index is easily treated as less sensitive than the page. However, because the index keeps one vector per patch in raster order, and each vector is computed by a vision-language model pre-trained to read documents, we hypothesize that whoever runs or breaches the store can reproduce a page from its index alone. We frame inversion as conditional document image generation and infer from the vectors what the attack needs: the encoder, the page shape and, for shuffled vectors, their order. On the ViDoRe v3 benchmark, pages inverted from raw indices recover 47% of the words and 45% of the sensitive tokens. Used as queries against the stored indices, they rank their source page first 98.4% of the time. We test two cheap protections, token pooling and shuffling, which both cut word recall to about 8%. A model that restores the order of a shuffled index raises the share of source pages ranked first from 3.8% to 93.5%, while inverting a pooled index remains open. To test generalisation, we apply the same attack unchanged to another multi-vector retriever: its inverted pages still rank their source page first 70.2% of the time, though its word recall stays below a nearest-neighbour baseline. Multi-vector visual document retrievers are therefore vulnerable to inversion through their stored index, which should be protected like the documents it encodes.', 'score': 18, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'c9093267ef6d8186', 'authors': ['Zhuchenyang Liu', 'Yao Zhang', 'Yu Xiao'], 'affiliations': ['Aalto University'], 'pdf_title_img': 'assets/pdf/title_img/2610.09920.jpg', 'data': {'categories': ['#security', '#leakage', '#rag', '#cv', '#multimodal', '#benchmark'], 'emoji': '🔓', 'ru': {'title': 'Векторные индексы документов раскрывают свои секреты', 'desc': 'В работе исследуется уязвимость мультивекторных визуальных индексов документов для поиска. Авторы демонстрируют, что из векторов, хранящихся в индексе, можно восстановить исходные страницы документов, сформулировав задачу как условную генерацию изображений. Предложенная атака инверсии может восстановить 47% слов и 45% чувствительных токенов из необработанных индексов, а инвертированные страницы ранжируются первыми в 98.4% случаев. Авторы тестируют защиты, такие как pooling и shuffling векторов, и показывают, что индексы требуют такой же конфиденциальности, как и исходные документы.'}, 'en': {'title': 'Protecting Document Vectors: A Call for Security in Multi-Vector Retrieval', 'desc': 'This paper discusses the vulnerabilities of multi-vector visual document retrievers, which store document pages as numerous patch vectors. The authors hypothesize that these vectors can be used to reconstruct the original pages, as they are generated by a vision-language model that understands document structure. They demonstrate that by inverting the stored vectors, a significant portion of the original text can be recovered, highlighting the risks associated with storing sensitive information in vector databases. The study also evaluates potential protective measures, revealing that simple techniques like token pooling and shuffling can significantly reduce the effectiveness of such attacks.'}, 'zh': {'title': '保护多向量视觉文档检索器的安全性', 'desc': '本论文探讨了多向量视觉文档检索器的安全性问题。这些检索器将每个页面存储为大约一千个补丁向量，通常在第三方的向量数据库中运行。研究表明，攻击者可以仅通过索引重建页面，恢复出47%的单词和45%的敏感标记。为了保护这些索引，作者提出了两种简单的保护措施，但效果有限，表明多向量视觉文档检索器需要像文档本身一样进行保护。'}}}, {'id': 'https://huggingface.co/papers/2610.05034', 'title': 'Agentic RAG Evaluation: Budget Allocation Across Questions, Trajectories, and Reads', 'url': 'https://huggingface.co/papers/2610.05034', 'abstract': 'Abstract  Evaluation budgets in agentic retrieval-augmented generation span questions, search trajectories, and repeated answers. We measure allocation precision, reading efficiency, and cost boundaries using a retrieval-feedback comparison on HotpotQA and MuSiQue. At 34.14--34.39M model tokens, broader question coverage lowers standard error by 33\\% versus five reads and 12.6\\% versus three trajectories. Archived nested and Q-only forecasts predict these allocations within 4.0\\% and 3.5\\%, respectively. Depth subsets establish no clear forecasting advantage beyond the two-trajectory audit. One-read variance penalties relative to the fitted optimum at the same token budget are 0--9.9\\%, with substantial Pro uncertainty. Under recorded model fees, more questions beat more trajectories at search prices of \\$0--1 per 1,000 requests; question-versus-read fee rankings remain unresolved. Temperature zero cuts answer disagreement from 14.3\\% to 3.4\\% while comparison precision stays similar. \\par\\medskip\\noindentKeywords: Agentic RAG; Evaluation budget; Generalizability theory; Repeated sampling.', 'score': 18, 'issue_id': 3385, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '8195087fcd731935', 'authors': ['Jingjie Ning', 'Xueqi Li', 'Yibo Kong'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05034.jpg', 'data': {'categories': ['#agents', '#benchmark', '#rag'], 'emoji': '⚖️', 'ru': {'title': 'Оптимальное распределение вычислительного бюджета в агентном поиске с пополнением контекста', 'desc': 'В работе исследуется оптимальное распределение бюджета вычислений при оценке агентных систем retrieval-augmented generation. Авторы анализируют компромиссы между количеством вопросов, глубиной поиска и числом повторений ответов, используя методы обобщающей теории. Эксперименты на датасетах HotpotQA и MuSiQue показывают, что увеличение количества вопросов при фиксированном бюджете токенов модели снижает стандартную ошибку лучше, чем углубление поиска. Предложены методы прогнозирования оптимальных распределений бюджета с точностью до 4% без проведения полного поиска.'}, 'en': {'title': 'Optimizing Retrieval Budgets for Better Question Coverage', 'desc': 'This paper investigates how to optimize evaluation budgets in retrieval-augmented generation (RAG) systems by analyzing questions, search paths, and repeated answers. It presents a comparison of retrieval-feedback methods on datasets like HotpotQA and MuSiQue, focusing on metrics such as allocation precision and reading efficiency. The findings suggest that broader question coverage can significantly reduce standard error, and that certain forecasting methods can predict allocation outcomes with high accuracy. Additionally, the study highlights the trade-offs between the number of questions and search trajectories, revealing that more questions generally yield better results at lower costs.'}, 'zh': {'title': '优化检索增强生成的评估预算', 'desc': '本文探讨了在代理检索增强生成中，评估预算如何影响问题、搜索轨迹和重复答案的分配。通过在HotpotQA和MuSiQue上进行检索反馈比较，我们测量了分配精度、阅读效率和成本边界。研究发现，较广泛的问题覆盖可以显著降低标准误差，并且在相同的模型令牌预算下，更多的问题比更多的轨迹更具优势。最后，温度为零的设置显著减少了答案的不一致性，同时保持了比较精度的稳定。'}}}, {'id': 'https://huggingface.co/papers/2610.07226', 'title': 'Minimal Witness Reinforcement Learning', 'url': 'https://huggingface.co/papers/2610.07226', 'abstract': "Abstract  ``What are the irreducible conditions that are sufficient to produce an outcome?'' is one of the most common questions that recur across computation and science. Its answers, the minimal sufficient witnesses, are what we mean by explanations, mechanisms and reasons. These problems usually ask for multiple minimal witnesses, yet standard RL methods may reveal only one solution or redundant ones. We formalize this problem as minimal-witness identification and introduce Minimal-Witness Reinforcement Learning (MWRL). MWRL takes the union of the sets certified by successful proposals sampled from the policy and credits each proposal for the coverage the group union would lose without that proposal. This credit assignment, derived directly from the problem definition, unifies the demands for minimality and recovery of alternatives from a single black-box verifier bit. Under this principle, we derive a value iteration planner that recovers the entire family of witnesses and a policy gradient method that can scale to large language models. Across different experimental settings, MWRL recovers most minimal witnesses, while other methods return redundant supersets or a single witness. By making witness families learnable from verifier feedback, MWRL expands the scope of reinforcement learning beyond single-solution optimization. Our code is available at https://github.com/TSUITUENYUE/MWRL.", 'score': 17, 'issue_id': 3385, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '4032c1ba5a212e93', 'authors': ['T. Y. Tsui', 'Zihao Ye', 'Pengxiang Cai', 'Yanchao Li', 'Yuqiang Li', 'Zhehong Ai'], 'affiliations': ['Shanghai AI Laboratory', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2610.07226.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Поиск всех минимальных причин через reinforcement learning', 'desc': 'Работа представляет новый подход к поиску всех минимальных достаточных условий для получения желаемого результата, что важно для понимания механизмов и причин явлений. Авторы формализуют эту задачу как проблему идентификации минимальных свидетельств и предлагают метод MWRL, который использует обратную связь от верификатора для поиска семейства решений. Ключевая идея — присваивать кредиты предложениям полиси на основе того, сколько покрытия теряется без каждого предложения, объединяя требования минимальности и разнообразия. Метод включает планировщик на основе итерации по значениям и метод градиента полиси, масштабируемый до больших языковых моделей.'}, 'en': {'title': 'Unlocking Multiple Solutions in Reinforcement Learning', 'desc': 'This paper addresses the challenge of identifying minimal sufficient witnesses in reinforcement learning (RL), which are essential for understanding outcomes in computational and scientific contexts. It introduces Minimal-Witness Reinforcement Learning (MWRL), a method that captures multiple minimal witnesses instead of just one or redundant solutions. MWRL utilizes a unique credit assignment mechanism based on the coverage loss of proposals, allowing it to unify the goals of minimality and alternative recovery. The approach is demonstrated to effectively recover a wide range of minimal witnesses across various experimental settings, thus broadening the application of RL beyond traditional single-solution methods.'}, 'zh': {'title': '最小见证强化学习：超越单一解决方案的探索', 'desc': '本文探讨了在计算和科学中，如何识别产生结果的最小充分条件。我们提出了最小见证强化学习（MWRL），它通过从策略中采样的成功提案的集合来识别多个最小见证。MWRL通过信用分配机制，确保每个提案的贡献被合理评估，从而统一了最小性和替代方案的需求。实验结果表明，MWRL能够有效恢复大多数最小见证，而其他方法往往只能返回冗余的超集或单一见证。'}}}, {'id': 'https://huggingface.co/papers/2610.09684', 'title': 'From Pareto to Preference: Personalized Test-Time Scaling via Amortized Agentic Policy Discovery', 'url': 'https://huggingface.co/papers/2610.09684', 'abstract': 'Abstract  Test-time scaling (TTS) improves the reasoning capabilities of large language models by allocating additional inference computation. Existing approaches to improving TTS efficiency largely optimize accuracy against one resource dimension at a time, advancing either the accuracy--cost or accuracy--latency Pareto frontier. Yet user requirements are multidimensional: users may specify accuracy, latency, and inference-cost requirements jointly, and different requirements can favor different controllers. We formulate Personalized Test-Time Scaling as discovering executable controllers that maximize the joint satisfaction rate of user-specific requirements. To reduce the overhead of repeated policy discovery for new user profiles, we propose PersonTTS, an amortized agentic policy-discovery framework that reuses prior search experience through requirement-matched controller initialization and source-distilled procedural guidance, while retaining target-profile evaluation for every candidate. Experiments on AIME and HMMT show that PersonTTS substantially outperforms strong TTS baselines in joint requirement satisfaction on unseen user profiles and held-out problems. Under the same candidate-evaluation budget, cross-user experience reuse further improves policy quality while substantially reducing discovery-agent time and cost.', 'score': 16, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'd413f433606e3ca4', 'authors': ['Xinglin Wang', 'Zishen Liu', 'Tong Zheng', 'Shaoxiong Feng', 'Peiwen Yuan', 'Yiwei Li', 'Jiayi Shi', 'Yueqi Zhang', 'Chuyi Tan', 'Ji Zhang', 'Boyuan Pan', 'Kan Li'], 'affiliations': ['Beijing Institute of Technology', 'Xiaohongshu Inc'], 'pdf_title_img': 'assets/pdf/title_img/2610.09684.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Персонализированное масштабирование инференса под многомерные требования пользователя', 'desc': 'Статья посвящена оптимизации тестирования больших языковых моделей путём распределения дополнительных вычислительных ресурсов во время инференса. Авторы формулируют задачу персонализированного масштабирования во время тестирования как поиск контроллеров, которые максимизируют удовлетворение многомерных требований пользователя (точность, задержка и стоимость инференса одновременно). Предложен фреймворк PersonTTS, который переиспользует опыт предыдущих поисков через инициализацию контроллеров на основе требований и процедурное руководство, получаемое из исходных моделей. Экспериментальные результаты на тестах AIME и HMMT показывают, что PersonTTS значительно превосходит базовые методы по совместному удовлетворению требований пользователя и снижает затраты на поиск политики.'}, 'en': {'title': 'Maximizing User Satisfaction with Personalized Test-Time Scaling', 'desc': 'This paper introduces a method called Personalized Test-Time Scaling (PersonTTS) to enhance the performance of large language models during inference. It addresses the challenge of optimizing multiple user requirements, such as accuracy, latency, and cost, simultaneously rather than focusing on one at a time. The proposed framework utilizes previous experiences to efficiently discover effective controllers that meet specific user needs. Experiments demonstrate that PersonTTS significantly improves user satisfaction across various profiles while minimizing the time and resources needed for policy discovery.'}, 'zh': {'title': '个性化测试时间缩放：满足多维需求的智能推理', 'desc': '本文提出了一种名为个性化测试时间缩放（PersonTTS）的方法，旨在提高大型语言模型的推理能力。该方法通过发现可执行的控制器，最大化用户特定需求的联合满足率，解决了用户在准确性、延迟和推理成本等多维度需求上的挑战。为了减少为新用户配置重复发现策略的开销，PersonTTS利用先前的搜索经验，通过匹配需求的控制器初始化和源蒸馏程序指导来实现。实验结果表明，PersonTTS在未见用户配置和保留问题上显著优于传统的测试时间缩放基线。'}}}, {'id': 'https://huggingface.co/papers/2610.07874', 'title': 'On-Policy Distillation with Negative-Policy Rollouts', 'url': 'https://huggingface.co/papers/2610.07874', 'abstract': 'Abstract  On-policy distillation (OPD) has been widely studied as a post-training method in which a student model obtains token-level supervision from a stronger teacher on its own rollouts. Recent studies have improved OPD through alternative distillation reward formulations and teacher configurations, while the objective of distillation remains centered on mimicking the teacher. However, when a stronger teacher has limited distributional overlap with the student, such positive guidance can provide insufficient learning signals. In this work, we introduce Negative-Policy OPD (NP-OPD), which complements teacher supervision with rollouts from a lower-performing, lower-capability negative policy that serves as a negative reference for the student. Rather than modifying the distillation reward formulation, NP-OPD introduces the negative policy at the rollout stage, continuously supplying tokens preferred by the negative policy over the teacher so that they remain exposed to teacher supervision throughout training. This provides an explicit negative signal through negative-policy rollouts while preserving the positive teacher supervision used in OPD. Through extensive experiments, we show that NP-OPD improves OPD across model scales, generation modes, reasoning domains, and different OPD variants. Furthermore, our analyses show that NP-OPD effectively suppresses tokens preferred by the negative policy over the teacher and moves the student away from the negative policy. These results support our design of introducing negative signals through negative-policy rollouts and provide new insight into the role of the rollout policy in OPD. Code will be available at https://github.com/naver-ai/np-opd.', 'score': 16, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'f0547eadf64cc973', 'pdf_title_img': 'assets/pdf/title_img/2610.07874.jpg', 'data': {'categories': ['#training', '#rlhf'], 'emoji': '🎯', 'ru': {'title': 'Отрицательная политика как противовес в дистилляции моделей', 'desc': 'В этой работе предлагается метод Negative-Policy OPD (NP-OPD) для улучшения дистилляции политики на этапе постобучения. Авторы добавляют отрицательную политику — модель с более низкой производительностью — которая служит отрицательным примером для обучаемой модели-студента. Метод работает на уровне семплирования траекторий, постоянно предоставляя токены, которые предпочитает отрицательная политика, чтобы студент мог от них отходить под влиянием учителя. Экспериментальные результаты показывают, что NP-OPD улучшает качество обучения студента за счёт явного отрицательного сигнала, сохраняя при этом позитивное руководство от учителя.'}, 'en': {'title': 'Enhancing Learning with Negative Signals in Distillation', 'desc': "This paper presents a new method called Negative-Policy On-Policy Distillation (NP-OPD) that enhances the traditional On-Policy Distillation (OPD) approach. NP-OPD introduces a negative policy, which is a weaker model, to provide additional learning signals to the student model during training. By using rollouts from this negative policy alongside the stronger teacher's guidance, the student can learn to avoid poor token choices while still benefiting from positive supervision. The experiments demonstrate that NP-OPD outperforms existing OPD methods across various scenarios, highlighting the importance of incorporating negative signals in the training process."}, 'zh': {'title': '引入负面信号，提升在线蒸馏效果', 'desc': '本文提出了一种新的方法，称为负策略在线蒸馏（NP-OPD），用于改进在线蒸馏（OPD）。传统的OPD依赖于强教师模型的正面指导，但当教师与学生模型的分布重叠有限时，这种指导可能不足。NP-OPD通过引入一个表现较差的负策略，提供负面参考，帮助学生模型学习。实验结果表明，NP-OPD在多个模型规模和生成模式下均能有效提升OPD的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.10047', 'title': 'AdSpark: A Large-Scale Dataset and Benchmark for Product-Centric Advertisement Video Generation', 'url': 'https://huggingface.co/papers/2610.10047', 'abstract': 'Abstract  Product-centric advertisement video generation aims to create promotional videos that preserve fine-grained product identity while presenting selling points through coherent multi-shot narratives. However, this emerging task remains underexplored due to the lack of large-scale advertisement-specific datasets and comprehensive evaluation frameworks. To address this gap, we introduce AdSpark, a large-scale dataset and benchmark for product-centric advertisement video generation, based on data from a major e-commerce platform. AdSpark-300K contains approximately 300K reference image--prompt--video triplets, comprising a real-world subset and a synthetic subset. Each sample provides structured advertisement annotations, including product identity annotations, selling-point descriptions, creative plans, and aligned audio scripts, enabling models to learn product preservation and advertisement-oriented visual storytelling. We further propose AdSpark-Bench, a diagnostic benchmark that evaluates generated advertisements across six dimensions, including visual quality, product fidelity, instruction adherence, temporal coherence, audio alignment, and advertisement effectiveness. Based on AdSpark-Bench, we evaluate representative models, revealing key challenges in product preservation, multi-shot storytelling, and selling-point visualization. Experiments with AdSpark-300K-finetuned models further validate the effectiveness of our dataset. AdSpark provides a unified dataset and benchmark for future research, and we will release the dataset upon acceptance.', 'score': 16, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '7f6f2cd1da06372a', 'authors': ['Zhifei Yang', 'Zhao Jiang', 'Keyang Lu', 'Honghe Zhu', 'Zheng Zhang', 'Jingjing Lv', 'Changping Peng', 'Ching Law', 'Zhen Xiao'], 'affiliations': ['JD.com', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.10047.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#multimodal', '#video'], 'emoji': '🎬', 'ru': {'title': 'Датасет и бенчмарк для генерации видеореклам с сохранением идентичности товара', 'desc': 'В работе представлен AdSpark — большой датасет и бенчмарк для генерации рекламных видеороликов с фокусом на сохранение идентичности товара. Датасет содержит 300 тысяч троек "изображение-промпт-видео" с подробными аннотациями, включая описания преимуществ товара, творческие планы и синхронизированные аудиоскрипты. Авторы предложили комплексную систему оценки AdSpark-Bench, анализирующую сгенерированные видео по шести измерениям: качество визуализации, верность отображения товара, соответствие инструкциям, временная согласованность, синхронизация с аудио и эффективность рекламы. Экспериментальные результаты выявили ключевые вызовы в сохранении идентичности товара и многокадровом повествовании.'}, 'en': {'title': 'AdSpark: Revolutionizing Product-Centric Video Ads', 'desc': 'This paper introduces AdSpark, a large-scale dataset designed for generating product-centric advertisement videos. It contains around 300,000 triplets of images, prompts, and videos, which help models learn to maintain product identity while effectively telling a story. The dataset includes detailed annotations for each sample, such as product details and selling points, which are crucial for training models in advertisement video generation. Additionally, the paper presents AdSpark-Bench, a benchmark for evaluating the quality of generated advertisements across multiple criteria, highlighting the challenges in maintaining product fidelity and coherence in storytelling.'}, 'zh': {'title': '广告视频生成的新突破', 'desc': '本论文介绍了一种新的产品中心广告视频生成方法，旨在创建能够展示产品特性和销售亮点的宣传视频。为了解决缺乏大规模广告特定数据集的问题，作者提出了AdSpark数据集，包含约30万个图像-提示-视频三元组，支持模型学习产品保留和广告视觉叙事。论文还提出了AdSpark-Bench，一个评估生成广告的基准，涵盖视觉质量、产品忠实度、指令遵循等六个维度。通过对代表性模型的评估，揭示了在产品保留和多镜头叙事方面的主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.05289', 'title': 'Mobile-4DGS: Unified Static-Dynamic Real-time Mobile Gaussian Splatting', 'url': 'https://huggingface.co/papers/2610.05289', 'abstract': 'Abstract  Recent advances in 3D Gaussian Splatting (3DGS) have achieved remarkable performance in novel view synthesis, yet deploying both static and dynamic Gaussian representations on resource-constrained mobile devices remains challenging due to heavy storage, redundant primitives, and costly per-frame computation. We present Mobile-4DGS, a unified lightweight framework for high-fidelity real-time static and dynamic Gaussian rendering on mobile platforms. For compact appearance modeling, we introduce a Monte Carlo Specular Energy Aggregator that compresses high-order radiance residuals into the first-order Spherical Harmonics (SH), together with an Attribute-Conditioned SH Enhancement module whose predicted offsets are pre-baked before inference. We further propose a Multi-View Alpha-Based Densification and Pruning strategy to suppress redundant primitives while maintaining multi-view consistency. For dynamic scenes, we develop a compact explicit 4D representation by constructing second-order Gaussian motion, learnable temporal support, and a binary static-dynamic partition, enabling continuous-time modeling without runtime deformation networks. Based on this partition, a Depth-Order Certificate selectively reuses previously committed depth orders to reduce re-projection, sorting, merging, and index-buffer updates during playback. Extensive experiments on static and dynamic scenes demonstrate that Mobile-4DGS substantially reduces storage and rendering overhead while maintaining competitive visual quality, enabling real-time 3D and 4D Gaussian Splatting on mobile devices. magenta{https://xiaobiaodu.github.io/mobile-4dgs-project/{Code has been released: https://xiaobiaodu.github.io/mobile-4dgs-project/}}.', 'score': 16, 'issue_id': 3385, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'a0bec41734f021dc', 'pdf_title_img': 'assets/pdf/title_img/2610.05289.jpg', 'data': {'categories': [], 'emoji': '📱', 'ru': {'title': 'Лёгкий Gaussian Splatting для мобильных устройств', 'desc': 'В работе представлена мобильная оптимизация метода 3D Gaussian Splatting для рендеринга статических и динамических сцен на устройствах с ограниченными ресурсами. Авторы предложили несколько ключевых улучшений: компактное представление внешнего вида через агрегацию спектральной энергии и улучшение сферических гармоник, а также стратегию удаления избыточных примитивов с сохранением многовидовой согласованности. Для динамических сцен разработано компактное 4D представление с явным моделированием движения гауссианов и бинарной классификацией статических и динамических элементов. Предложенный подход значительно снижает требования к памяти и вычислениям, обеспечивая высококачественный рендеринг в реальном времени на мобильных устройствах.'}, 'en': {'title': 'Real-Time 3D and 4D Gaussian Rendering on Mobile Devices', 'desc': 'The paper introduces Mobile-4DGS, a lightweight framework designed for efficient real-time rendering of static and dynamic Gaussian representations on mobile devices. It addresses challenges such as high storage requirements and computational costs by utilizing a Monte Carlo Specular Energy Aggregator for compact appearance modeling and an Attribute-Conditioned SH Enhancement module for pre-baked predictions. Additionally, it implements a Multi-View Alpha-Based Densification and Pruning strategy to eliminate redundant data while ensuring consistency across multiple views. The framework also features a novel 4D representation for dynamic scenes, allowing for continuous-time modeling and significantly reducing rendering overhead without sacrificing visual quality.'}, 'zh': {'title': '轻量级高斯渲染，移动设备的新选择', 'desc': '本论文介绍了一种名为Mobile-4DGS的轻量级框架，旨在实现高保真实时的静态和动态高斯渲染，特别适用于资源受限的移动设备。我们提出了一种蒙特卡洛镜面能量聚合器，将高阶辐射残差压缩为一阶球谐函数，并引入了属性条件的SH增强模块，以提高渲染效果。为了减少冗余原始数据并保持多视图一致性，我们还提出了一种基于多视图的α密集化和修剪策略。通过构建紧凑的显式4D表示，Mobile-4DGS能够在动态场景中实现连续时间建模，显著降低存储和渲染开销，同时保持竞争力的视觉质量。'}}}, {'id': 'https://huggingface.co/papers/2610.03036', 'title': 'WebFovea: When the Model Is Right but the Click Is Wrong -- Reliable Round Trips for Vision-Based Web Agents on Live Websites', 'url': 'https://huggingface.co/papers/2610.03036', 'abstract': "Abstract  We present WebFovea, a vision-based web agent that placed 2nd in the WebRetriever Challenge 2026 with a final score of 57.0 out of 100. The challenge evaluates agents end to end on Protocol III of the WebRetriever benchmark (arXiv:2607.06118): starting from an entry URL on a live website, the agent must operate the site's own interface and return a verifiable answer. A capable multimodal large language model (LLM) is necessary for this, but not sufficient. The model's decisions reach the browser through the harness, the code between the model and the page. At every step, four things must go right: the model's reply must be parsed into the intended action, the action must take effect on the page, the result must be reported back accurately, and the model must be shown the information it needs. On real websites, many of the failures we observed occurred at one of these four stages rather than in the model's reasoning. A coordinate-space mismatch placed every click at 3/4 of its intended coordinates; actions on native dropdowns, inside iframes, and in text boxes failed silently; and self-generated chat-template tokens contaminated 4.9% of task episodes. WebFovea hardens each stage and surrounds the loop with guardrails that keep the agent within the rules and its budget. The four-stage view does not depend on the model, although some individual fixes do. Because we used the same model in all four submissions, the rise of our official hidden-set score from 31.0 to 57.0 reflects changes to the harness, up to run-to-run variance on live sites. We describe the design, the evidence for each component (including negative results), a failure analysis, the limitations, and a roadmap that includes routing different steps to different models. Code is available at https://github.com/jianganghan/WebFovea.", 'score': 16, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '2b7fb1ae273c4984', 'pdf_title_img': 'assets/pdf/title_img/2610.03036.jpg', 'data': {'categories': ['#open_source', '#agents', '#cv', '#multimodal', '#benchmark'], 'emoji': '🕷️', 'ru': {'title': 'Инженерия имеет значение: оптимизация промежуточных этапов для web-агентов', 'desc': 'WebFovea — это vision-based агент для автоматизации взаимодействия с веб-сайтами, основанный на multimodal LLM и занявший второе место в WebRetriever Challenge 2026. Авторы показали, что успех агента зависит не только от качества языковой модели, но и от четырёх критических этапов: корректного парсинга действий, их выполнения на странице, точной обработки результатов и правильной визуализации информации пользователю. Команда выявила и исправила множество технических проблем в промежуточном слое кода между моделью и браузером, включая ошибки координат, невидимые ошибки с элементами интерфейса и загрязнение контекста служебными токенами. Системные улучшения в harness позволили поднять скор модели с 31.0 до 57.0 баллов без изменения самой LLM, демонстрируя важность инженерной оптимизации для практических AI-систем.'}, 'en': {'title': 'WebFovea: Enhancing Web Interaction with Robust Agent Design', 'desc': "WebFovea is a vision-based web agent that achieved second place in the WebRetriever Challenge 2026, scoring 57.0 out of 100. The agent operates by interacting with live websites, requiring a multimodal large language model (LLM) to interpret and execute actions based on the site's interface. The process involves four critical stages: parsing the model's response, executing the action on the webpage, accurately reporting the outcome, and providing the model with necessary information. The paper discusses the design improvements made to the agent's harness, which enhanced its performance by addressing failures that occurred at each stage of interaction."}, 'zh': {'title': 'WebFovea：提升网络代理性能的关键', 'desc': '本文介绍了WebFovea，一个基于视觉的网络代理，在2026年WebRetriever挑战赛中获得第二名，最终得分为57.0分。该挑战评估代理在WebRetriever基准的第三协议下的端到端表现，代理需要从一个入口URL开始，操作网站的界面并返回可验证的答案。为了实现这一目标，必须使用多模态的大型语言模型（LLM），但这并不足够。WebFovea通过强化每个步骤并设置保护措施，确保代理在规则和预算内运行，从而提高了整体性能。'}}}, {'id': 'https://huggingface.co/papers/2610.10437', 'title': 'Q-Learning with Scalar Adjoint Matching', 'url': 'https://huggingface.co/papers/2610.10437', 'abstract': "Abstract  Flow policies capture rich and diverse action distributions, and fine-tuning them with off-policy RL to improve beyond the demonstrations has drawn growing interest. However, fine-tuning a flow policy against a learned value function is not trivial, because the policy generates its action over many flow steps. Adjoint matching offers a principled way to update the flow model itself by propagating value information from the final action back to each flow step, but it requires a vector--Jacobian product through the policy at every step, a cost that grows with the number of flow steps and the policy size. We observe that the batch-averaged velocity Jacobian of pretrained flow policies concentrates on its diagonal. Motivated by this finding, we derive a closed-form scalar adjoint that scales the value gradient at the final action by the flow time, eliminating the per-step vector--Jacobian products. We further find that controlling the critic's value at policy-generated actions is particularly important under the scalar adjoint. Based on these findings, we propose Q-learning with Scalar Adjoint Matching (SQAM), which combines the scalar adjoint with a value penalty at those actions. SQAM's gains concentrate on the four hardest OGBench domains, where its success rate exceeds that of the strongest baseline in each domain by 18 to 35 percentage points. To test whether SQAM extends to large pretrained policies, we also fine-tune a vision-language-action policy on a real bimanual robot. SQAM improves over supervised fine-tuning on all three tasks.", 'score': 14, 'issue_id': 3386, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'eebd42bef9bc96e5', 'authors': ['Yonghoon Dong', 'Minsung Yoon', 'Jaehyuk Kim', 'Jungwoo Park', 'Changyeon Kim', 'Jinwoo Shin'], 'affiliations': ['KAIST', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2610.10437.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🌊', 'ru': {'title': 'Эффективная тонкая настройка flow-политик через скалярное сопряженное соответствие', 'desc': 'В статье предлагается метод SQAM для улучшения политик на основе потоков через обучение с подкреплением вне политики. Авторы обнаружили, что матрица Якобиана скоростей предтренированных flow-политик сосредоточена на диагонали, что позволило вывести закрытую формулу для скалярного сопряженного градиента. Это решение устраняет необходимость в дорогостоящих векторно-якобианских произведениях на каждом шаге обучения. Метод комбинирует скалярное сопряженное соответствие с штрафом за значение критика и показывает значительные улучшения как на синтетических бенчмарках, так и при управлении реальным двуручным роботом.'}, 'en': {'title': 'Enhancing Flow Policies with Scalar Adjoint Matching', 'desc': 'This paper introduces a method called Q-learning with Scalar Adjoint Matching (SQAM) to enhance flow policies in reinforcement learning. Flow policies are complex models that generate actions over multiple steps, and fine-tuning them can be challenging due to the computational cost of updating each step. The authors propose a new approach that simplifies the update process by using a scalar adjoint, which reduces the need for extensive calculations at each flow step. Their method shows significant improvements in performance, particularly in difficult tasks, outperforming existing techniques by a notable margin.'}, 'zh': {'title': '标量伴随匹配：优化流政策的新方法', 'desc': '本文提出了一种新的强化学习方法，称为标量伴随匹配（SQAM），用于优化流政策。流政策能够生成丰富的动作分布，但在与学习的价值函数进行微调时面临挑战。通过引入标量伴随，SQAM消除了每一步的向量-雅可比乘积，从而简化了计算过程。实验结果表明，SQAM在多个复杂任务中显著提高了成功率，尤其是在四个最具挑战性的OGBench领域。'}}}, {'id': 'https://huggingface.co/papers/2610.10497', 'title': 'QuadTok: Quadtree Visual Tokenizer for Autoregressive Image Generation', 'url': 'https://huggingface.co/papers/2610.10497', 'abstract': 'Abstract  We introduce QuadTok, a novel framework for visual tokenization and autoregressive image generation. Compared to traditional approaches using 2D grids or 1D token sequences, we propose a hierarchical quadtree structure, bridging the gap between 2D spatial binding and 1D sequence-level flexibility. The QuadTok tokenizer dynamically allocates representational capacity to visually intricate areas while leaving homogeneous regions at a coarse resolution. Compared with a fixed 256-token grid, our ImageNet-trained tokenizer saves approximately 10% of tokens on ImageNet and 9% when transferred zero-shot to the COCO dataset, while maintaining comparable reconstruction fidelity. Furthermore, the natural causality introduced by the tree structure seamlessly enables autoregressive image generation. Conditioned on a quadtree topology supplied before generation, our 947M GPT-style generative model achieves a 2.08 gFID on the ImageNet 256 times 256 benchmark. Additionally, leveraging the strong spatial correlation preserved by the quadtree structure, the QuadTok generator enables zero-shot spatially controlled image generation capabilities. Code: https://github.com/myc634/QuadTok.', 'score': 12, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '9448941170bcc53f', 'authors': ['Yucheng Mao', 'Zeyuan Chen', 'Xiaojun Shan', 'Xiang Zhang', 'Divyansh Srivastava', 'Bingnan Li', 'Zhuowen Tu'], 'affiliations': ['University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.10497.jpg', 'data': {'categories': [], 'emoji': '🌳', 'ru': {'title': 'Квадтри для умной токенизации: экономия и контроль в генеративных моделях', 'desc': 'В работе предложен QuadTok — фреймворк для визуальной токенизации и авторегрессивной генерации изображений, использующий иерархическую структуру квадтри вместо традиционных 2D сеток или 1D последовательностей. Токенизатор динамически распределяет representational capacity, выделяя больше ресурсов сложным визуальным областям и оставляя однородные регионы с грубым разрешением. На датасете ImageNet токенизатор экономит примерно 10% токенов по сравнению с фиксированной сеткой из 256 токенов, сохраняя качество реконструкции. Природная каузальность древовидной структуры позволяет использовать GPT-подобную модель размером 947M для авторегрессивной генерации изображений с достижением 2.08 gFID на бенчмарке ImageNet 256×256, а также обеспечивает способность к zero-shot пространственно управляемой генерации.'}, 'en': {'title': 'Efficient Image Generation with Hierarchical Quadtree Tokenization', 'desc': 'QuadTok is a new framework designed for visual tokenization and generating images in a step-by-step manner. It uses a hierarchical quadtree structure, which allows it to efficiently manage complex visual details while simplifying areas that are less detailed. This approach reduces the number of tokens needed for image representation, achieving significant savings compared to traditional methods, while still producing high-quality images. Additionally, the quadtree structure supports autoregressive generation, enabling the model to create images with controlled spatial features effectively.'}, 'zh': {'title': 'QuadTok：创新的视觉标记化与图像生成框架', 'desc': '我们介绍了QuadTok，这是一种新颖的视觉标记化和自回归图像生成框架。与传统的2D网格或1D标记序列方法相比，我们提出了一种分层的四叉树结构，弥合了2D空间绑定和1D序列灵活性之间的差距。QuadTok标记器动态分配表示能力给视觉复杂的区域，同时对均匀区域保持较粗的分辨率。与固定的256标记网格相比，我们的标记器在ImageNet上节省了大约10%的标记，并在COCO数据集上零-shot转移时节省了9%，同时保持了相似的重建保真度。'}}}, {'id': 'https://huggingface.co/papers/2610.07659', 'title': 'DLoop: Looped Speculative Decoding', 'url': 'https://huggingface.co/papers/2610.07659', 'abstract': 'Abstract  Speculative decoding accelerates autoregressive generation in large language models. In each drafting stage, a lightweight draft model proposes tokens that the target model subsequently verifies. With increasingly capable draft models, we find that the target model frequently accepts all tokens produced in a drafting stage. A verification nevertheless follows each drafting stage, resulting in unnecessary target-model forward passes even when drafting could have continued. Adaptive draft length methods decide during decoding how many draft tokens precede a verification, but they raise the speedup only for autoregressive draft models. For a parallel draft model, drafting further requires target-model hidden states for draft tokens that have not been verified. We propose DLoop, a looped form of speculative decoding that adaptively performs multiple drafting stages before verification. DLoop continues drafting while the draft model remains confident and verifies all accumulated draft tokens together. Loop-aware training keeps the draft model reliable in the additional drafting stages by exposing it to its own hidden states for unverified draft tokens. By spending additional draft-model forward passes, DLoop reduces the number of target-model forward passes required for verification. Across diverse speculative decoding methods including EAGLE-3, DFlash, Domino, DSpark, and multi-token prediction modules, DLoop improves the wall-clock speedup by 5 to 41 percent while preserving lossless decoding. Code will be available at https://github.com/naver-ai/DLoop.', 'score': 11, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'cef13f9990b00590', 'authors': ['Geonmo Gu', 'Byeongho Heo', 'HeeJae Jun', 'Yoohoon Kang', 'Sangmin Lee', 'Sangdoo Yun', 'Dongyoon Han'], 'affiliations': ['Korea University', 'NAVER AI Lab', 'NAVER AI Search Platform'], 'pdf_title_img': 'assets/pdf/title_img/2610.07659.jpg', 'data': {'categories': ['#optimization'], 'emoji': '⚡', 'ru': {'title': 'Адаптивное спекулятивное декодирование с накоплением неверифицированных токенов', 'desc': 'В статье предложен метод DLoop, который ускоряет автоregressive генерацию в большиx языковых моделях через адаптивное спекулятивное декодирование. Вместо проверки после каждого этапа черновика, метод продолжает генерировать несколько этапов токенов параллельной моделью, пока она уверена в предсказаниях. Специальное loop-aware обучение сохраняет надежность черновик-модели при работе со своими скрытыми состояниями непроверенных токенов. Метод снижает количество forward pass целевой модели на 5-41%, сохраняя качество декодирования без потерь.'}, 'en': {'title': 'DLoop: Accelerating Decoding with Adaptive Drafting', 'desc': 'This paper introduces DLoop, a new method for speculative decoding that enhances the efficiency of autoregressive generation in large language models. DLoop allows for multiple drafting stages before verification, enabling the draft model to continue generating tokens as long as it remains confident. By verifying all accumulated draft tokens at once, DLoop minimizes the number of forward passes required by the target model, leading to significant speed improvements. The method demonstrates a 5 to 41 percent increase in decoding speed while maintaining the quality of the generated output.'}, 'zh': {'title': 'DLoop：加速自回归生成的新方法', 'desc': '本文提出了一种名为DLoop的循环推测解码方法，旨在加速大语言模型的自回归生成。在每个草拟阶段，轻量级草拟模型生成候选标记，目标模型随后进行验证。DLoop允许在草拟模型保持信心的情况下，进行多个草拟阶段，直到进行验证，从而减少目标模型的前向传递次数。通过循环感知训练，DLoop提高了草拟模型的可靠性，同时在多种推测解码方法中实现了5%到41%的速度提升。'}}}, {'id': 'https://huggingface.co/papers/2610.07250', 'title': 'Internalizing Agent Experience into Diffusion Model Weights via On-Policy Context Distillation', 'url': 'https://huggingface.co/papers/2610.07250', 'abstract': "Abstract  Wrapping an image generation model in an agentic harness can effectively boost Text-to-Image task performance: the harness can leverage memory, skills, workflow orchestration, result verification, and iterative refinement to continually construct and revise prompts, thereby eliciting better images. These gains, however, remain external to the diffusion model and are realized only while the full harness runs. We propose Diffusion On-Policy Context Distillation (D-OPCD), which treats the agent-improved prompt as privileged context and distills the knowledge encoded in the agent harness into the weights of the diffusion model, so that the model retains part of the harness's benefit when conditioned on the original query alone. Using a Text-to-Image agent equipped with our proposed Auto Skill Evolver (ASE), we show that D-OPCD can internalize harness capabilities into the generator's weights, raising the average direct-generation score from 60.52 to 65.09 across four benchmarks. With this knowledge absorbed into the weights, the harness can shed its saturated skills and resume evolving: a second ASE round on the updated generator improves on a skill-free harness by additional 1.83 points, pointing toward text-to-image systems in which harness and model keep improving each other through continual co-evolution.", 'score': 10, 'issue_id': 3385, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'df98e08db0695f97', 'authors': ['Wenxuan Wang', 'Zekai Liu', 'Weinan Zhang', 'Yu Cheng', 'Yang Yang'], 'affiliations': ['Harbin Institute of Technology', 'Nanyang Technological University', 'Shandong University', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.07250.jpg', 'data': {'categories': ['#agents', '#cv', '#benchmark', '#training'], 'emoji': '🎨', 'ru': {'title': 'Дистилляция знаний агента в диффузионную модель для лучшей генерации изображений', 'desc': 'В статье предлагается метод дистилляции знаний из агентного обёртывания в веса диффузионной модели для улучшения генерации изображений по текстовому описанию. Авторы используют специальный агент, который итеративно уточняет текстовые подсказки, используя память, навыки и проверку результатов, что значительно повышает качество генерации. Предложенный метод D-OPCD позволяет перенести эти улучшения прямо в веса модели, так чтобы она лучше работала даже без полного агентного обёртывания. Кроме того, авторы вводят Auto Skill Evolver для автоматической эволюции навыков агента, что создаёт цикл взаимного улучшения между моделью и агентом.'}, 'en': {'title': 'Empowering Image Generation through Knowledge Distillation', 'desc': 'This paper introduces a method called Diffusion On-Policy Context Distillation (D-OPCD) that enhances Text-to-Image generation models by integrating knowledge from an agentic harness. The harness improves image generation by refining prompts and leveraging memory and skills, but its benefits are typically temporary. D-OPCD allows the diffusion model to internalize these improvements, so it retains some advantages even without the harness. The results show a significant increase in performance metrics, indicating a promising direction for ongoing improvements in text-to-image systems through mutual enhancement of the model and the harness.'}, 'zh': {'title': '持续进化的文本到图像生成系统', 'desc': '本文提出了一种名为D-OPCD的方法，通过将代理改进的提示作为特权上下文，将代理的知识提炼到扩散模型的权重中。这种方法使得模型在仅依赖原始查询时，仍能保留部分代理的优势。实验表明，使用D-OPCD后，生成模型的平均直接生成分数从60.52提高到65.09，显示出显著的性能提升。此外，模型在吸收知识后，能够与代理持续共同进化，进一步提升生成能力。'}}}, {'id': 'https://huggingface.co/papers/2610.09484', 'title': 'MIMESIS: Learning User Simulators as Training Environments for Interactive Agents', 'url': 'https://huggingface.co/papers/2610.09484', 'abstract': 'Abstract  Training and evaluating interactive language agents typically requires rich user interactions, yet collecting human feedback is expensive and difficult to scale. Simulated users offer a scalable alternative, but they must both resemble real user behavior and provide useful learning experiences for agents. In contrast, most agent-training frameworks rely on off-the-shelf assistant LLMs, whose helpfulness can make them overly cooperative, explicit, and behaviorally homogeneous compared with real users. We introduce MIMESIS, a purpose-built user simulator trained on human conversations with explicit reasoning supervision and 13 realistic behavioral patterns derived from real user interactions. Empirically, our 9B model achieves a SOUL-Index of 65.7, surpassing the strongest frontier model. Compared with Claude-Opus-5, the strongest baseline on RealUserSim and SimulatorArena, MIMESIS improves behavioral fidelity by 13.4 points and reduces Turing distance by 3.6 points, respectively. We then freeze the simulator and train an agent by interacting with the frozen simulator using multi-turn reinforcement learning. Across eight environments, training with MIMESIS yields better agent performance than training with GPT-5.5 under all nine unseen user simulators, demonstrating stronger generalization to new user simulators. Moreover, we propose Coached On-Policy Self-Distillation (CSD), which leverages simulator-generated private reasoning traces and subsequent utterances as feedback on how well the agent addresses user needs. A coach converts this information into concise coaching notes that describe how the agent can better anticipate user needs and adapt its behavior over the course of an interaction. CSD turns this feedback into dense, token-level supervision beyond sparse task rewards, yielding further gains across all nine evaluation user models.', 'score': 9, 'issue_id': 3387, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '027e5b484f2bc08e', 'authors': ['Hoang Phan', 'Dat Huynh', 'Andrey Zhmoginov', 'Qi Zeng', 'Wancen Mu', 'Yue Cao', 'Shengjie Bi', 'Yun He', 'Changdae Oh', 'Deren Lei'], 'affiliations': ['Meta Superintelligence Labs', 'New York University', 'University of Wisconsin - Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.09484.jpg', 'data': {'categories': ['#reasoning', '#rl', '#optimization', '#multimodal', '#training', '#alignment', '#agents'], 'emoji': '🎭', 'ru': {'title': 'Реалистичный симулятор пользователей для обучения интерактивных агентов', 'desc': 'В работе представлен MIMESIS — специализированный симулятор пользователей, обученный на реальных диалогах с явным контролем рассуждений и 13 реалистичными поведенческими паттернами. Симулятор достигает более высокой верности поведения и ближе к реальным пользователям по сравнению с готовыми LLM-ассистентами, которые часто бывают чрезмерно кооперативны. Авторы обучают агента взаимодействовать с замороженным симулятором используя многошаговое обучение с подкреплением, демонстрируя лучшую обобщаемость на новых симуляторах. Дополнительно предложен метод Coached On-Policy Self-Distillation, который преобразует рассуждения симулятора в плотный токен-уровневый контроль, улучшая способность агента предвидеть потребности пользователя.'}, 'en': {'title': 'MIMESIS: Realistic User Simulation for Enhanced Agent Training', 'desc': 'This paper presents MIMESIS, a user simulator designed to enhance the training of interactive language agents by mimicking real user behavior. Unlike traditional models that rely on generic language models, MIMESIS incorporates explicit reasoning and diverse behavioral patterns derived from actual human conversations. The simulator significantly improves agent performance through multi-turn reinforcement learning, demonstrating better generalization to new user scenarios. Additionally, the proposed Coached On-Policy Self-Distillation (CSD) method provides detailed feedback to agents, enabling them to better understand and meet user needs during interactions.'}, 'zh': {'title': 'MIMESIS：提升交互语言代理的用户模拟器', 'desc': '本论文介绍了一种名为MIMESIS的用户模拟器，旨在提高交互语言代理的训练效果。MIMESIS通过对人类对话进行训练，并结合明确的推理监督和13种真实用户行为模式，提供了更真实的用户交互体验。与传统的助手模型相比，MIMESIS在行为保真度和图灵距离上都有显著提升，能够更好地适应新的用户模拟器。我们还提出了教练式在线自蒸馏（CSD），利用模拟器生成的推理轨迹作为反馈，帮助代理更好地满足用户需求。'}}}, {'id': 'https://huggingface.co/papers/2610.06505', 'title': 'Improving Proactive AI Assistance with Hierarchical Procedural Understanding', 'url': 'https://huggingface.co/papers/2610.06505', 'abstract': "Abstract  Proactive AI assistants continuously observe a user's activity and decide whether to provide new guidance or remain silent. They should provide appropriate guidance for the task, determine when to provide the next guidance based on task progress, and adjust the guidance level to the user's expertise and needs. Supporting these capabilities requires training and evaluation data that reflect procedural structure and capture how guidance should adapt to task progress and user needs. However, existing datasets either focus on detection-based proactive understanding or provide procedural guidance at a fixed granularity. Fixed-granularity guidance provides limited information about fine-grained progress and broader procedural context, making it difficult to determine completion and adapt guidance granularity. To address these limitations, we introduce the ProactiveCoach suite, comprising ProactiveCoach-Instruct for training, ProactiveCoachBench for evaluation, and fine-tuned VLMs with an adaptive guidance system. ProactiveCoach-Instruct provides hierarchically structured guidance at the phase, step, and action levels for learning task progress and procedural context. ProactiveCoachBench evaluates whether models provide appropriate guidance at the right time across different guidance levels and adapt when the requested level changes. We fine-tune pretrained VLMs on ProactiveCoach-Instruct and demonstrate its effectiveness across backbones. Compared with fixed-granularity supervision, hierarchical supervision improves overall performance across backbones by up to 9.6%p. We further build an adaptive guidance system by combining our fine-tuned model with a lightweight guidance router. Without additional fine-tuning, our system outperforms the in-context adaptation baseline by 57.1%p across four guidance-level transitions. Our project page is available at https://jinsuby.github.io/ProactiveCoach/.", 'score': 9, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '50dd55d05f83c02c', 'authors': ['Jin-Seop Lee', 'TaeYeon Won', 'SeongJun Jung', 'JungHoon Kim', 'Boyang Albert Li', 'JinYeong Bak', 'Jaehong Yoon', 'Jee-Hyong Lee'], 'affiliations': ['College of Computing and Data Science, Nanyang Technological University, Singapore', 'Department of Artificial Intelligence, Sungkyunkwan University, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2610.06505.jpg', 'data': {'categories': ['#synthetic'], 'emoji': '🧑\u200d🏫', 'ru': {'title': 'Иерархическое адаптивное руководство дл
