source before a downstream encoder, codebook, rate, distortion target, or optimizer is chosen. This paper studies when one such reduction preserves the complete downstream problem family, a property termed Task-Sufficient Contraction. The reduced source is fixed by the task before the later operating point is selected. An exact contraction allows the later problem to be solved on that source with the same result as if the full source had been retained.   For a machine with a fixed set of possible actions and a fixed loss, the paper identifies a consumer-specific source by merging states only when every available action has the same regret in both. For finite action sets, replacing the richer source by this reduced source preserves the complete one-step rate-regret curve, even though the reduction is fixed before the distortion target is chosen. A second result gives an exact characterization for quadratic loss on affine feasible-action sets: the canonical reduced source is the projection onto the directions in which feasible actions can differ. Under a fixed energy budget, this becomes centered load, while retaining only the optimal water-filled action is too coarse. Earlier Information Bottleneck, semantic rate-distortion, and goal-oriented quantization results are then used to distinguish exact, architecture-conditioned, approximate, failed, and corrected contractions. The framework suggests a way for heterogeneous machines to exchange what a receiving task needs without first aligning their full internal representations.', 'score': 1, 'issue_id': 3386, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '15be420c40117558', 'pdf_title_img': 'assets/pdf/title_img/2610.08884.jpg', 'data': {'categories': ['#math', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Задача определяет сжатие: сохранение оптимальности при редукции данных', 'desc': 'В статье исследуется концепция Task-Sufficient Contraction — свойство, при котором редукция исходных данных, определённая задачей, сохраняет всю семью последующих проблем оптимизации. Авторы показывают, что для фиксированного набора действий и функции потерь можно идентифицировать оптимальное сжатое представление источника, объединяя состояния с одинаковым сожалением для всех доступных действий. Для квадратичной функции потерь канонически редуцированный источник представляет собой проекцию на направления, в которых допустимые действия могут различаться, и под бюджетом энергии сводится к центрированной нагрузке. Результаты применяются в контексте Information Bottleneck и семантического rate-distortion, предлагая способ для разнородных систем обмениваться только необходимой информацией без полного согласования внутренних представлений.'}, 'en': {'title': 'Simplifying Sources While Preserving Task Integrity', 'desc': 'This paper introduces the concept of Task-Sufficient Contraction, which examines how a reduced source can maintain the integrity of a downstream problem in machine learning. It shows that by merging states with identical regret for all actions, a simpler source can be used without losing essential information about the task. The authors provide a specific case for quadratic loss, demonstrating that the optimal reduced source can be derived from the feasible actions available. This framework allows different machine learning models to share necessary information for a task without needing to align their entire internal structures.'}, 'zh': {'title': '任务驱动的源简化与下游问题保持一致', 'desc': '本文研究了在选择下游编码器、码本、速率、失真目标或优化器之前，如何通过任务来认证一个简化的源。我们定义了一个称为任务充分收缩的性质，探讨了这种收缩如何保持完整的下游问题家族。对于具有固定动作集和损失的机器，本文通过合并状态来识别特定消费者的源，确保每个可用动作在两个状态中具有相同的遗憾。研究结果表明，在有限动作集下，使用简化源可以保留完整的一步速率-遗憾曲线，即使该收缩是在选择失真目标之前固定的。'}}}, {'id': 'https://huggingface.co/papers/2610.09228', 'title': 'Co-Evolving Robot Orchestrators and Policies through Deployment', 'url': 'https://huggingface.co/papers/2610.09228', 'abstract': "Abstract  Vision-language-action (VLA) policies trained on large datasets are capable within their training domains, yet they still fail to generalize to the variety of situations a robot meets in real-world deployment. Agentic robot systems complement the policy with a vision-language model (VLM) orchestrator that learns when to call the policy, how to instruct it, and when to use scripted skills instead. However, because the harness is built around a frozen policy that has limited language steerability, the orchestrator can avoid the policy's failures but never overcome them. The policy becomes the bottleneck of the whole system. Fine-tuning the policy can remove this bottleneck, but updating it alone decouples it from an orchestrator tuned to its old behavior. We propose Robo-COP, in which the orchestrator and policy co-evolve during deployment. Robo-COP curates skill demonstrations from its own executions, fine-tunes the policy when this data can address recurring failures, and adopts each new policy only after it improves the skills it was trained for. Across ten simulated RoboLab tasks, Robo-COP raises mean held-out success from 64.8% to 73.8% over the same harness with a frozen policy, while fine-tuning on a fixed schedule without verification reaches only 65.8%. On three real-world tasks, Robo-COP raises held-out success from 38.3% to 50.0%. Robo-COP turns deployment into a self-improving flywheel in which robots learn by doing, with each improvement in execution producing better data for the next round of learning. Videos and code are available at https://robo-cop.pages.dev/.", 'score': 1, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'a6089f13ece65abe', 'authors': ['Xilun Zhang', 'Maggie Wang', 'Erik Bauer', 'Hong-Xing Yu', 'Huang Huang', 'Jiajun Wu', 'Marco Pavone'], 'affiliations': ['NVIDIA Research', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.09228.jpg', 'data': {'categories': ['#agents', '#training', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Самоулучшающиеся роботы через совместную эволюцию политики и оркестратора', 'desc': 'Статья посвящена проблеме обобщения видео-языково-действийных (VLA) политик для робототехники на новые ситуации при развёртывании. Авторы предлагают Robo-COP — систему, в которой оркестратор на основе VLM и основная политика коэволюционируют совместно во время работы робота. Система автоматически собирает примеры навыков из собственных попыток выполнения задач, улучшает политику через дообучение когда данные могут устранить повторяющиеся ошибки, и внедряет новую версию только после проверки улучшений. Экспериментальные результаты показывают значительный прирост успешности выполнения задач как в симуляции (с 64.8% до 73.8%), так и на реальных роботах (с 38.3% до 50.0%).'}, 'en': {'title': 'Robo-COP: Evolving Robot Intelligence Through Self-Improvement', 'desc': "This paper introduces Robo-COP, a system designed to enhance the performance of vision-language-action (VLA) policies in robotic applications. Unlike traditional methods that rely on a static policy, Robo-COP allows both the policy and the orchestrator to evolve together during deployment. It achieves this by curating skill demonstrations from the robot's own experiences and fine-tuning the policy to address specific failures. The results show significant improvements in task success rates, demonstrating that Robo-COP creates a self-improving cycle of learning for robots in real-world scenarios."}, 'zh': {'title': 'Robo-COP：让机器人通过实践自我提升', 'desc': '本文提出了一种名为Robo-COP的机器人系统，旨在解决现有视觉-语言-行动（VLA）策略在真实环境中泛化能力不足的问题。Robo-COP通过让策略和协调器在部署过程中共同进化，来克服策略的局限性。该系统能够从自身执行中收集技能演示，并在识别到重复失败时对策略进行微调。实验结果表明，Robo-COP在多个模拟和真实任务中显著提高了成功率，展示了机器人通过实践学习的自我改进能力。'}}}, {'id': 'https://huggingface.co/papers/2610.04012', 'title': 'Beyond the Parameter Monolith: Reconstructive Memories, Executable Skills, and Residual Assembly for Language Models', 'url': 'https://huggingface.co/papers/2610.04012', 'abstract': "Abstract  Language-model systems can separate contextual computation, persistent storage, and exact execution instead of updating all capabilities through one shared parameter system. We investigate FEM-ASM, a finite-element-method-inspired organization in which independently constructed document states and deterministic executable skills contribute typed proposals to a shared language-model state. An explicit residual operator reconciles proposals attached to common interface nodes. We evaluate this organization through controlled experiments and negative results rather than claiming a physical finite-element formulation of language. An attention-free Multi-Mesh prototype learns causal language modeling but does not establish competitive general capability. A versioned store contains 52,809 reconstructive memory elements near a 1.7-billion-floating-value budget; reconstruction is incomplete, with approximately 75\\% token accuracy. Support-aware lexical indices make these elements addressable under provenance-controlled query construction. For executable arithmetic, positional result observations substantially improve neural rendering relative to a repeated global result vector, and output substitutions change the model's preferred answer. A bounded attachment demonstration further measures the effect of making selected evidence available, without establishing the utility of loading an entire multi-billion-value store. The results support a separation of storage, execution, and neural coordination, while identifying unresolved limitations in question-only retrieval, unrestricted answer generation, and end-to-end efficiency.", 'score': 0, 'issue_id': 3387, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'f4163e37665843e0', 'pdf_title_img': 'assets/pdf/title_img/2610.04012.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🏗️', 'ru': {'title': 'Модульная архитектура языковых моделей: разделение хранения, вычислений и выполнения', 'desc': 'Исследование предлагает архитектуру языковой модели, вдохновленную методом конечных элементов, где вычисления, хранение данных и выполнение операций разделены вместо обновления единых параметров модели. Система использует независимые состояния документов и детерминированные навыки, которые предоставляют типизированные предложения общему состоянию языковой модели через явный оператор невязки. Авторы проводят контролируемые эксперименты с прототипом Multi-Mesh, достигающим 75% точности токенов на хранилище из 52,809 элементов памяти при бюджете 1,7 миллиарда значений с плавающей точкой. Результаты демонстрируют потенциал разделения памяти, выполнения и нейронной координации, однако выявляют ограничения в извлечении информации и end-to-end эффективности.'}, 'en': {'title': 'Separating Storage, Execution, and Coordination in Language Models', 'desc': 'This paper explores a new approach to language models called FEM-ASM, which organizes computation, storage, and execution separately. It uses a finite-element-method-inspired structure where different document states and skills contribute to a shared language model. The study includes experiments that highlight the limitations of this approach, such as incomplete reconstruction and challenges in achieving competitive performance. Overall, the findings suggest that separating these components can enhance model organization but also reveal areas needing improvement in efficiency and retrieval capabilities.'}, 'zh': {'title': '分离存储、执行与神经协调的语言模型', 'desc': '本文探讨了一种新的语言模型系统FEM-ASM，该系统通过独立构建的文档状态和确定性可执行技能来分离上下文计算、持久存储和精确执行。研究表明，使用显式残差算子可以协调附加到公共接口节点的提案。通过控制实验评估该组织的效果，结果显示在因果语言建模方面的表现不够竞争力。尽管存在存储和执行的分离，但在问题检索和答案生成的效率上仍存在未解决的限制。'}}}, {'id': 'https://huggingface.co/papers/2610.05003', 'title': 'How corner is a corner case? Percentile control for highway scenario generation', 'url': 'https://huggingface.co/papers/2610.05003', 'abstract': 'Abstract  Generating corner-case scenarios with appropriate adversity in a simulation environment is critical for testing an autonomous vehicle (AV) software stack\'s safety performance before deployment. Existing autonomous-driving scenario generators can enforce specific behavior, adversity, or feasibility conditions, but they provide limited control over how extreme a generated scenario is relative to plausible futures in the same traffic context. This study represents the adversity of a generated scenario as its percentile in the conditional distribution of future risk given the observed history. This view supports calibrated answers to two questions: how "corner" a generated corner-case scenario is and how its "cornerness" can be fine-tuned.   To this end, we formulate history-conditioned risk-percentile requests and learn a reference risk distribution that maps each requested percentile to a physical risk target. We then use a percentile-conditioned joint diffusion model with sampling-time risk guidance to generate multi-agent futures, together with a reference-based criterion for evaluating percentile realization.   Experiments use the minimum post-encroachment time (PET) between the ego and its surrounding vehicles as the risk surrogate on highD. On the primary evaluation set, our method realizes 1,422 of 1,440 requests within a 0.05 percentile tolerance (98.75%), with mean percentile error 0.00673 and PET-target error 0.00991 seconds. The resulting interface connects context-relative risk specification, physical realization, and evaluation through a common risk scale. Project website and videos of generated scenarios are available at https://hhj233.github.io/CornerPercentile/.', 'score': 0, 'issue_id': 3387, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '42d86740e29ee4e4', 'authors': ['Jiaxi Liu', 'Hang Zhou', 'Hangyu Li', 'Yifan Wang', 'Keke Long', 'Chengyuan Ma', 'Bin Ran', 'Xiaopeng Li'], 'affiliations': ['Department of Civil and Environmental Engineering, University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.05003.jpg', 'data': {'categories': ['#benchmark', '#robotics'], 'emoji': '🚗', 'ru': {'title': 'Генерация угловых случаев с контролем риска через процентильную шкалу', 'desc': 'В этой работе предлагается новый подход к генерации опасных сценариев для тестирования автономных автомобилей. Авторы представляют экстремальность сценария через его процентиль в условном распределении риска, что позволяет точно контролировать степень опасности. Они разработали диффузионную модель, кондиционированную на запрашиваемый процентиль риска и историю наблюдений, для генерации траекторий нескольких агентов. Метод достигает высокой точности реализации заданных уровней риска (98.75% запросов в пределах допуска 0.05 процентиля) на датасете highD, используя минимальное время пост-конфликта как суррогат риска.'}, 'en': {'title': 'Calibrating Corner-Case Scenarios for Safer Autonomous Vehicles', 'desc': 'This paper focuses on improving the generation of corner-case scenarios for testing the safety of autonomous vehicle (AV) software. It introduces a method to represent the adversity of scenarios using percentiles in a conditional risk distribution, allowing for better control over the extremity of generated scenarios. The authors develop a joint diffusion model that generates multi-agent future scenarios based on specified risk percentiles, ensuring that the scenarios reflect realistic traffic conditions. Their experiments demonstrate high accuracy in meeting percentile requests, indicating that the method effectively connects risk specification with physical scenario generation and evaluation.'}, 'zh': {'title': '生成极端场景，提升自动驾驶安全性', 'desc': '本研究提出了一种生成极端场景的方法，以测试自动驾驶汽车软件的安全性能。我们通过历史数据的条件分布来表示生成场景的风险百分位，从而更好地控制场景的极端程度。研究中使用了联合扩散模型，并结合风险指导生成多智能体的未来场景。实验结果显示，该方法在高D数据集上实现了高精度的风险请求，验证了其有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.09683', 'title': 'System Switch: When Should a Fast Decision Model Stop and Think?', 'url': 'https://huggingface.co/papers/2610.09683', 'abstract': 'Abstract  Dual-process agents pair a fast policy with a slow deliberative model. In real-time settings the slow model usually runs continuously; in turn-based agents and robot planners it is invoked on events such as uncertainty or a detected failure. We study a fast learned actor that takes every decision and hands control to a reasoning vision-language model only when a gate opens, while the game keeps running. We use closed-loop Doom and the new open "System One" typed-decision models, served through a common llama.cpp interface. On 900 held-out questions, (i) zero-shot decision models from 0.15B to 9B parameters choose to collect items 1.6-1.8 times more often than chance among their errors, in any option order, although the order changes some models\' accuracy; (ii) accuracy, calibration and sensitivity (how well confidence separates right from wrong answers) are distinct: models of similar accuracy differ widely in AUROC, and the confidence of the most sensitive one tracks which kinds of situation it fails, not which answers are wrong; (iii) offline, deferring the least confident 30% of decisions to a reasoning model gains over random deferral in proportion to the actor\'s AUROC (rank correlation 0.87); with actor and rate chosen on held-out games the gain is +0.13 [0.08, 0.18] with doomLaya\'s option order and +0.08 [0.02, 0.14] with shuffled options, and reasoning carries about half of it; (iv) in closed loop (33 games, three seeds) no variant reaches the exit. Committing to plans, the reasoner\'s or a fixed explore rule\'s, opens more doors and makes an actor that stands still play; with the rule the agent dies more often. Told that some doors need keys, the reasoner takes ordinary doors for locked ones, which the state cannot tell apart; without that knowledge it goes back to collecting. We release code, prompts, data and logs.', 'score': 0, 'issue_id': 3387, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '370c75f90b312240', 'authors': ['Gian Luca Bailo'], 'affiliations': ['Independent Researcher, Recco (Genoa), Italy'], 'pdf_title_img': 'assets/pdf/title_img/2610.09683.jpg', 'data': {'categories': ['#robotics', '#reasoning', '#interpretability', '#benchmark', '#multimodal', '#games', '#dataset', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Интеллектуальное управление: когда быстро считать, когда остановиться и подумать', 'desc': 'В статье исследуются двухпроцессные агенты, которые сочетают быструю нейронную сеть с медленной моделью рассуждения на основе видения и языка. Быстрый актор принимает все решения, но может передать управление большой языковой модели, когда открывается специальный вентиль для принятия сложных решений. Авторы тестируют различные модели размером от 150М до 9B параметров на задачах с закрытым циклом обратной связи в среде Doom и показывают, что точность, калибровка и чувствительность моделей—это различные характеристики. Результаты демонстрируют, что отложение неуверенных решений для рассуждения улучшает производительность, но полное решение задачи в режиме реального времени остаётся нерешённой проблемой.'}, 'en': {'title': 'Enhancing Decision-Making with Dual-Process Agents', 'desc': 'This paper explores dual-process agents that combine a fast decision-making policy with a slower, more deliberative reasoning model. The fast actor makes decisions in real-time, while the reasoning model is activated during specific events like uncertainty or failures. The study shows that using a reasoning model can improve decision-making accuracy and sensitivity, especially when the least confident decisions are deferred to it. The results indicate that the integration of these models can enhance performance in complex environments, such as games, by allowing for better handling of uncertainty and decision-making strategies.'}, 'zh': {'title': '双过程智能体：快速决策与深度推理的结合', 'desc': '本文研究了一种双过程智能体，它结合了快速决策策略和缓慢推理模型。在实时环境中，缓慢模型通常持续运行，而在回合制智能体和机器人规划中，它在不确定性或检测到失败时被调用。我们提出了一种快速学习的决策者，它在每次决策时运行，并在特定条件下将控制权交给推理模型。实验结果表明，模型在决策准确性和信心度方面表现出显著差异，且通过合理的决策延迟可以提高整体性能。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (4)', '#agents (19)', '#agi', '#alignment (2)', '#architecture (11)', '#audio (3)', '#benchmark (21)', '#cv (9)', '#data (2)', '#dataset (12)', '#diffusion (3)', '#ethics (1)', '#games (4)', '#graphs', '#hallucinations', '#healthcare', '#inference (3)', '#interpretability (2)', '#leakage (2)', '#long_context (4)', '#low_resource', '#machine_translation', '#math (3)', '#multilingual (1)', '#multimodal (16)', '#open_source (12)', '#optimization (14)', '#plp (1)', '#rag (3)', '#reasoning (8)', '#rl (8)', '#rlhf (5)', '#robotics (12)', '#science', '#security (3)', '#small_models (3)', '#story_generation', '#survey', '#synthetic (3)', '#training (27)', '#transfer_learning (3)', '#video (9)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-08 20:26',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-08 20:26')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-08 20:26')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
