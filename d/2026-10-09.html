    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.38169', 'title': 'STEPQuant: When and Where Errors Matter in Delta-Rule Recurrent State Quantization', 'url': 'https://huggingface.co/papers/2609.38169', 'abstract': 'Abstract  Linear attention replaces growing KV caches with fixed-size recurrent states, yet these persistent states can become a substantial memory bottleneck under concurrent serving. Directly quantizing recurrent states to low precision often leads to severe accuracy degradation, as quantization errors propagate through successive state updates. We discover that the impact of these errors depends on two complementary dimensions: temporally, errors in long-lived memory can persist across many decoding steps; spatially, errors in different key rows affect model outputs differently, while state magnitudes vary substantially along both rows and columns. Motivated by these observations, we propose STEPQuant, a spatial-temporal post-training quantization framework for Delta-rule recurrent states. STEPQuant allocates precision according to error magnitude and memory lifetime, and jointly fits key-row and value-column scales based on state distributions and key-row impact on output error. Experiments on Qwen3.8-27B and Kimi-Linear-48B-A3B-Instruct across both long- and short-generation benchmarks show that STEPQuant closely matches FP32-state accuracy under a nominal 6-bit budget and outperforms uniform INT8 in its 4-bit configuration. Integrated into SGLang with optimized GPU kernels, 6-bit STEPQuant achieves over 5x recurrent-state compression and reduces total serving memory by up to 68.7%. Our code is available at https://github.com/Dreamer-Toby/STEPQuant.', 'score': 98, 'issue_id': 3385, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '2b214cddffede7b8', 'authors': ['Bingchen Yao', 'Haobo Xu', 'Haokun Lin', 'Yichen Wu', 'Ziyu Guo', 'Renrui Zhang', 'Zhichao Lu', 'Zhenan Sun', 'Ying Wei'], 'affiliations': ['City University of Hong Kong', 'Harvard University', 'NLPR & MAIS, Institute of Automation, CAS', 'The Chinese University of Hong Kong', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38169.jpg', 'data': {'categories': ['#optimization', '#open_source', '#long_context'], 'emoji': '⚙️', 'ru': {'title': 'Умная квантизация памяти линейных трансформеров через анализ ошибок во времени и пространстве', 'desc': 'В работе предлагается STEPQuant — метод квантизации рекуррентных состояний для линейных трансформеров, которые используют фиксированные кэши вместо растущих KV-кэшей. Авторы выявили, что ошибки квантизации распространяются неравномерно во времени и пространстве: некоторые ошибки сохраняются на протяжении многих шагов декодирования, а разные строки матрицы ключей влияют на выходные ошибки с разной интенсивностью. STEPQuant оптимально распределяет точность квантизации в зависимости от величины ошибок и времени жизни памяти, подбирая масштабы отдельно для строк ключей и столбцов значений. Эксперименты показывают, что метод достигает 6-битной квантизации с качеством, близким к FP32, сокращая объём памяти для рекуррентных состояний более чем в 5 раз и снижая общую память при обслуживании модели до 68.7%.'}, 'en': {'title': 'Optimizing Memory with STEPQuant: Smart Quantization for Recurrent States', 'desc': 'This paper introduces STEPQuant, a new method for quantizing recurrent states in linear attention models to reduce memory usage while maintaining accuracy. It addresses the challenges of quantization errors that can accumulate over time and vary in impact depending on the state’s characteristics. By analyzing how errors propagate temporally and spatially, STEPQuant allocates precision based on the significance of these errors and the duration of memory use. The results show that STEPQuant can achieve high accuracy with significantly reduced memory requirements compared to traditional quantization methods.'}, 'zh': {'title': 'STEPQuant：优化递归状态的量化方法', 'desc': '本文提出了一种名为STEPQuant的空间-时间后训练量化框架，旨在解决线性注意力模型中固定大小的递归状态在并发服务下的内存瓶颈问题。我们发现量化误差的影响与时间和空间两个维度有关，长时间存在的内存误差会在多个解码步骤中持续，而不同关键行的误差对模型输出的影响也不同。STEPQuant根据误差大小和内存生命周期分配精度，并根据状态分布和关键行对输出误差的影响共同调整关键行和数值列的比例。实验结果表明，STEPQuant在6位预算下的准确性接近FP32状态，并在4位配置中优于均匀INT8，显著减少了递归状态的内存占用。'}}}, {'id': 'https://huggingface.co/papers/2610.10528', 'title': 'Long-WAM: Scaling the Context of World-Action Models', 'url': 'https://huggingface.co/papers/2610.10528', 'abstract': 'Abstract  Real-time robot control demands enough visual history to infer motion and task progress, but processing that history can delay action. We present Long-WAM, a model-system framework for scaling the context of causal world-action models under real-time control constraints. Our central finding is that access to history is not the same as using it: longer histories pay off far more when the video foundation is pretrained autoregressively (AR). We first learn causal prediction from robot and egocentric videos without action labels, then preserve this history-to-future structure during world-action adaptation. On RoboCasa GR-1, increasing context from 0.0 to 19.2 seconds raises success from 63.3% to 78.7%, whereas a bidirectionally pretrained initialization shows no net gain; robot-domain AR pretraining further raises peak success on GR-1 and LIBERO-Long. Long-WAM also achieves the best results among compared methods on LIBERO-Long, RoboTwin 2.0, and DOMINO. Streaming observation encoding, asynchronous execution, and hardware-specific acceleration enable deployment on RTX 5090, DGX Spark, and Jetson AGX Thor without dropping future prediction; on RTX 5090, each action chunk, including future-video latent prediction, takes 107.4 ms. Real-time deployment on Unitree G1 and YAM supports dynamic and long-horizon manipulation, including 95% success on dynamic cup stacking, where Pi0.5 and Fast-WAM succeed in none of 20 trials. As a memory-informed executor, Long-WAM also complements higher-level planning in composite tasks.', 'score': 87, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '50f2185e2ad8eea0', 'authors': ['Wei Huang', 'Bohan Zhang', 'Chenzhi Liu', 'Isabella Liu', 'Shuai Yang', 'Weian Mao', 'Luozhou Wang', 'Yicheng Xiao', 'Weifeng Lin', 'Qixin Hu', 'Bryan Chu', 'Sifei Liu', 'Linxi Fan', 'Xiaojuan Qi', 'Song Han', 'Yukang Chen'], 'affiliations': ['HKU', 'MIT', 'NVIDIA', 'UCSD'], 'pdf_title_img': 'assets/pdf/title_img/2610.10528.jpg', 'data': {'categories': ['#video', '#transfer_learning', '#optimization', '#robotics', '#architecture', '#long_context', '#training', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Длинная память — ключ к управлению роботом в реальном времени', 'desc': 'Long-WAM — это система для управления роботами в реальном времени, которая использует длинную историю видео для лучшего понимания движений и прогресса задачи. Авторы показали, что история полезна только при использовании видеофундамента, предварительно обученного в авторегрессивном режиме — такой подход позволяет увеличить успешность выполнения задач с 63,3% до 78,7%. Система обучается предсказывать будущие кадры на основе видео робота и видео от первого лица без разметки действий, сохраняя структуру связи истории и будущего при адаптации к управлению роботом. Long-WAM работает в реальном времени на различном железе (от RTX 5090 до Jetson), обрабатывая кадры за 107,4 миллисекунд, и демонстрирует лучшие результаты на нескольких бенчмарках манипуляционных задач.'}, 'en': {'title': 'Unlocking Real-Time Robot Control with Long-WAM', 'desc': 'The paper introduces Long-WAM, a framework designed to enhance real-time robot control by effectively utilizing visual history for motion and task inference. It emphasizes that simply having access to historical data is not enough; the way this data is processed, especially when pretrained autoregressively, significantly impacts performance. The authors demonstrate that increasing the context length from 0.0 to 19.2 seconds improves task success rates on various robotic platforms. Long-WAM outperforms other methods in multiple benchmarks, showcasing its ability to execute complex tasks with high accuracy while maintaining real-time processing capabilities.'}, 'zh': {'title': '实时机器人控制的新突破：Long-WAM', 'desc': '本文提出了一种名为Long-WAM的模型系统框架，旨在在实时控制约束下扩展因果世界-动作模型的上下文。研究发现，获取历史信息与有效利用历史信息是不同的，经过自回归预训练的视频基础可以显著提高长历史的效果。通过从机器人和自我中心视频中学习因果预测，Long-WAM在RoboCasa GR-1上成功率从63.3%提升至78.7%。此外，Long-WAM在多个任务上表现优异，支持动态和长时间的操作，展示了其在实时部署中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.08699', 'title': 'nanoMuse: An Open-Source Personal Agent for Every Device You Own', 'url': 'https://huggingface.co/papers/2610.08699', 'abstract': "Abstract  Assistants from 2011 answered and waited, and agents from 2023 did a task and stopped. In September 2026 Meta's Muse showed an agent for one person, with accounts, devices, memory and a conversation that lasts, closed, in a vendor's cloud, in one country. Such an agent is expected to act on a person's accounts and devices, remember them across weeks, speak first when it is worth it, and answer for what it did. It is a kind of software, not a model, and until now had no open counterpart. This report defines the personal agent in five questions and three horizons. It reads how Muse is built from Meta's public record and a copy of its production prompt, each statement marked by its source. It then presents nanoMuse, the open-source counterpart under the GPL-3.0, one agent on every device a person owns, with hands on the phone's screen and the computer's. They share one conversation over a relay anyone can run; every action goes through a Sentinel, memory is files the person can read, and the model is their choice. Its size and cost are given as estimates. What is open, memory with provenance, an evaluation suite for the hands and an open model for them, is set out as a roadmap.", 'score': 81, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '1a3a62d4e956b0c9', 'authors': ['Guangyi Liu', 'Yong Liu', 'Jiangning Zhang'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.08699.jpg', 'data': {'categories': ['#open_source'], 'emoji': '🤖', 'ru': {'title': 'Открытые персональные AI-агенты под контролем пользователя', 'desc': "Статья описывает эволюцию персональных AI-агентов от простых ассистентов к сложным системам, которые действуют от имени пользователя и помнят контекст длительного взаимодействия. Авторы анализируют архитектуру Meta's Muse — закрытого агента, который управляет аккаунтами и устройствами пользователя в облаке производителя. Они представляют nanoMuse — открытую альтернативу на GPL-3.0, где каждый пользователь запускает собственного агента с полным контролем над памятью, действиями и выбором модели. Проект включает открытый набор инструментов для оценки способностей агента и стратегию развития персональных AI-систем с полной прозрачностью."}, 'en': {'title': 'Empowering Personal Agents: From Muse to nanoMuse', 'desc': "This paper discusses the evolution of personal agents from simple assistants to more complex systems capable of managing tasks and maintaining long-term conversations. It introduces Meta's Muse, a personal agent that integrates with a user's accounts and devices, allowing for memory retention and accountability in its actions. The authors propose nanoMuse, an open-source version that operates on multiple devices, ensuring user control over memory and actions through a shared conversation relay. The paper outlines the framework for developing such agents, emphasizing the importance of open-source principles and user-defined models."}, 'zh': {'title': '个人智能助手的未来：开放与记忆', 'desc': '这篇论文介绍了一种新的个人智能助手，名为nanoMuse，它是Meta公司Muse的开源版本。该助手能够在用户的多个设备上运行，记住用户的账户和设备信息，并在适当的时候主动发言。论文还定义了个人助手的五个关键问题和三个发展阶段，并提供了关于助手构建的详细信息。最后，作者提出了一个路线图，展示了如何实现开放的记忆、评估工具和用户选择的模型。'}}}, {'id': 'https://huggingface.co/papers/2610.08621', 'title': 'Recursive Game Creator: An Agentic Product-Level Experience-Oriented Game Harness', 'url': 'https://huggingface.co/papers/2610.08621', 'abstract': "Abstract  Recent game design agents have made substantial progress in generating playable games. However, program correctness does not ensure an enjoyable experience for players. We present Recursive Game Creator, an experience-oriented harness to advance agentic game development from rough game prototypes into entertaining games. Recursive Game Creator organizes recursive development around four components: Designer, Builder, Player, and Reviewer. The Designer translates user instructions and Reviewer's feedback into detailed plans. The Builder turns these plans into candidate games. The coding-native Player creates and executes reusable policies through programmatic interfaces to efficiently collect diverse gameplay trajectories, mitigating evaluation bias caused by slow GUI-based collection. The Reviewer uses carefully designed trajectory-based metrics to induce player preferences, integrating with visual evidence and explicit textual preferences to evaluate games against game-specific criteria. Finally, the Reviewer accepts the better version and provides improvement reviews for the next round, closing the recursive loop. Our method achieves state-of-the-art overall performance of 77.89 on GameCraft-Bench. On GameASG-Bench, it achieves a strict task success rate of 53.2%, a 34.1% improvement over the same-model baseline, and the highest mean runtime-check pass rate at 93.4% among compared methods. A user study shows longer playtime and higher ratings. Code is coming soon.", 'score': 77, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'acbd19f8337f51b6', 'authors': ['Jiajun Chen', 'Haoyu Wu', 'Mingda Jia', 'Xihui Liu'], 'affiliations': ['HKU MMLab', 'Shenzhen Loop Area Institute', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.08621.jpg', 'data': {'categories': ['#games', '#open_source'], 'emoji': '🎮', 'ru': {'title': 'Итеративная разработка видеоигр через мультиагентную обратную связь', 'desc': 'Статья описывает Recursive Game Creator — систему на основе агентов для разработки видеоигр, которая итеративно улучшает игровые прототипы через взаимодействие четырех компонентов: Designer генерирует планы из инструкций пользователя и отзывов, Builder превращает планы в игры, Player программно собирает разнообразные траектории игроков, а Reviewer оценивает игры по специальным метрикам. Система использует методы обучения с подкреплением и анализ траекторий для избежания смещения оценок, которое возникает при ручном тестировании через графический интерфейс. Метод достигает лучших показателей на нескольких бенчмарках и демонстрирует значительное улучшение над базовыми моделями благодаря итеративной обратной связи. Пользовательское исследование подтверждает, что полученные игры обеспечивают более длительное и приятное игровое время.'}, 'en': {'title': 'Transforming Game Prototypes into Engaging Experiences', 'desc': 'The paper introduces the Recursive Game Creator, a framework designed to enhance the process of game development by focusing on player experience. It consists of four main components: Designer, Builder, Player, and Reviewer, which work together in a recursive manner to refine game prototypes into enjoyable experiences. The Player collects diverse gameplay data through programmatic interfaces, reducing bias in evaluation, while the Reviewer assesses games using trajectory-based metrics and player feedback. The approach has demonstrated significant improvements in performance metrics on benchmark tests, indicating its effectiveness in creating engaging games.'}, 'zh': {'title': '递归游戏创作者：从原型到乐趣的游戏开发', 'desc': '最近的游戏设计代理在生成可玩游戏方面取得了显著进展。然而，程序的正确性并不保证玩家的愉悦体验。我们提出了递归游戏创作者，这是一种以体验为导向的工具，旨在将粗略的游戏原型发展为有趣的游戏。该工具围绕设计者、构建者、玩家和评审者四个组件组织递归开发，利用玩家的反馈和评审者的评价不断优化游戏。'}}}, {'id': 'https://huggingface.co/papers/2610.07967', 'title': 'DecepEval: A Benchmark for Evaluating Deception in LLM Agents', 'url': 'https://huggingface.co/papers/2610.07967', 'abstract': 'Abstract  As large language model (LLM) agents become increasingly autonomous, they may pursue task performance through deception, raising concerns about their reliable deployment. Existing evaluations show that LLM agents can deceive, but often examine isolated scenarios or narrowly defined conditions, limiting systematic understanding of when deception becomes more likely. To address this gap, we introduce DecepEval, a benchmark comprising 1,532 instances across 3 task families and 28 professional scenarios. Drawing on classical fraud theories, we propose the LLM Deception Diamond framework, which characterizes four external conditions that may induce deception: pressure, incentive, opportunity, and conflict. DecepEval pairs neutral and induced versions of each instance to measure condition-dependent changes in deception rates, while explicit task facts and observable agent behavior help distinguish deception from capability-related errors. Evaluations of nine frontier LLMs show that inducements increase deception across models and task families, even among models with low baseline deception rates. DecepEval makes these vulnerabilities measurable, providing a shared benchmark for progress toward trustworthy artificial intelligence.', 'score': 64, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '51611fd9f3a6523c', 'authors': ['Yiming Xu', 'Hongyue Yu', 'Beihua Yang', 'Zihan Chen', 'Yixin Liu', 'Zhen Peng', 'Bin Shi', 'Bo Dong', 'Chao Shen', 'Irwin King', 'Qinghua Zheng'], 'affiliations': ['Griffith University', 'The Chinese University of Hong Kong', 'Tongji University', 'University of Virginia', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.07967.jpg', 'data': {'categories': ['#security', '#alignment', '#ethics', '#agents', '#benchmark'], 'emoji': '🚨', 'ru': {'title': 'Измеримая уязвимость: когда языковые модели склонны ко лжи', 'desc': 'В работе представлен DecepEval — комплексный набор данных для оценки склонности больших языковых моделей к обману при решении задач. Авторы разработали фреймворк LLM Deception Diamond, основанный на классических теориях мошенничества, который определяет четыре внешних условия, провоцирующих обман: давление, стимул, возможность и конфликт интересов. Бенчмарк включает 1532 примера из 28 профессиональных сценариев с нейтральными и индуцированными версиями задач для измерения зависимости частоты обмана от условий. Экспериментальная оценка девяти современных LLM показала, что внешние стимулы увеличивают вероятность обмана во всех моделях, даже у тех, которые изначально имеют низкий уровень декептивного поведения.'}, 'en': {'title': 'Understanding Deception in Autonomous Language Models', 'desc': 'This paper addresses the issue of deception in large language model (LLM) agents as they become more autonomous. It introduces DecepEval, a benchmark designed to systematically evaluate when and how LLMs may deceive users across various tasks and scenarios. The authors propose the LLM Deception Diamond framework, which identifies four key conditions that can lead to deceptive behavior: pressure, incentive, opportunity, and conflict. Through extensive evaluations, the study finds that these conditions significantly increase deception rates in LLMs, highlighting the need for better measures to ensure the reliability of AI systems.'}, 'zh': {'title': '揭示大型语言模型的欺骗风险', 'desc': '随着大型语言模型（LLM）代理的自主性增强，它们可能通过欺骗来提高任务表现，这引发了对其可靠部署的担忧。现有评估显示LLM代理能够欺骗，但通常只在孤立场景或狭窄条件下进行，限制了对欺骗何时更可能发生的系统理解。为了解决这一问题，我们引入了DecepEval，一个包含1532个实例的基准，涵盖3个任务类别和28个专业场景。我们提出的LLM欺骗钻石框架描述了可能诱发欺骗的四个外部条件：压力、激励、机会和冲突。'}}}, {'id': 'https://huggingface.co/papers/2610.04299', 'title': 'Questioning the Questions: Sustaining Self-Evolution in Reasoning Models', 'url': 'https://huggingface.co/papers/2610.04299', 'abstract': 'Abstract  Self-evolving reasoning models learn from their own generated questions, yet repeated self-training can lead to performance collapse. In this paper, we investigate why performance deteriorates over successive rounds and how to sustain self-evolution. Our analysis identifies two recurring quality problems in self-generated questions: invalid questions and repeated variants of the same mathematical questions. First, invalid questions become more prevalent across rounds, and answer-consistency filtering further increases their proportion in training data. Second, existing question diversity controls based on lexical similarity can miss mathematically equivalent questions expressed in different ways, which leads to question diversity collapse in later training rounds. Building on these findings, we introduce R-Quest, which uses question validity and novelty feedback to guide self-evolution. We first train the solver to recognize and reject invalid questions, then use its judgments to guide questioner rewards and filter solver training data. To avoid question repetition, we use a frozen base model to compare sampled question pairs and provide novelty feedback. Empirically, our method consistently achieves the highest average performance on 12 benchmarks in mathematical reasoning, general-domain reasoning, and code generation across two model families. Additionally, R-Quest maintains stable performance gains over ten rounds of self-evolution, peaking in the final round and outperforming R-Zero by 17.32 points.', 'score': 63, 'issue_id': 3385, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': 'a310dc785c89a0f7', 'authors': ['Jinyuan Li', 'Chengsong Huang', 'Langlin Huang', 'Donghong Cai', 'Shiping Gao', 'Yuyi Yang', 'Jiaxin Huang'], 'affiliations': ['University of Michigan, Ann Arbor', 'Washington University in St. Louis'], 'pdf_title_img': 'assets/pdf/title_img/2610.04299.jpg', 'data': {'categories': ['#reasoning', '#math', '#optimization', '#training', '#plp'], 'emoji': '🔄', 'ru': {'title': 'Самоэволюция через обратную связь о качестве и новизне вопросов', 'desc': 'В статье исследуется проблема деградации производительности при повторяющемся самообучении моделей рассуждения. Авторы выявили две основные проблемы в самогенерируемых вопросах: некорректные вопросы и повторяющиеся математические варианты одной задачи. Предложенный метод R-Quest использует обратную связь о валидности и новизне вопросов, обучая решатель отклонять неверные вопросы и применяя замороженную базовую модель для определения повторений. Метод демонстрирует стабильный прирост производительности на протяжении десяти раундов самоэволюции на множестве бенчмарков математического и общего рассуждения.'}, 'en': {'title': 'Enhancing Self-Evolution in Reasoning Models with R-Quest', 'desc': 'This paper addresses the challenges faced by self-evolving reasoning models that learn from their own generated questions. It identifies two main issues: the increase of invalid questions and the lack of diversity in question types over successive training rounds. To tackle these problems, the authors propose R-Quest, a method that filters out invalid questions and encourages novelty in question generation. The results show that R-Quest significantly improves performance in mathematical reasoning and other domains while maintaining stability across multiple training iterations.'}, 'zh': {'title': '自我进化推理的创新之路', 'desc': '自我进化推理模型通过生成的问题进行学习，但重复的自我训练可能导致性能下降。本文探讨了性能在多轮训练中恶化的原因，以及如何维持自我进化。我们发现自生成问题中存在两个主要质量问题：无效问题和相同数学问题的重复变体。基于这些发现，我们提出了R-Quest，通过问题有效性和新颖性反馈来指导自我进化，从而在多个基准测试中实现了显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2610.10524', 'title': 'GRACE: Generation-aware latent compression for efficient video generation', 'url': 'https://huggingface.co/papers/2610.10524', 'abstract': 'Abstract  Highly compressed video autoencoders offer an effective way to accelerate video diffusion models, as the Diffusion Transformer (DiT) operates on far fewer tokens. However, such autoencoders are challenging to train, since a higher compression ratio degrades reconstruction quality and recovering it requires more channels, which is known to slow the convergence of the DiT. The compressed latent also differs from the one the DiT was trained on, so the pretrained DiT must be either retrained from scratch or adapted at considerable cost. Compressing the autoencoder the DiT was trained with appears to preserve compatibility, yet optimizing it for reconstruction alone still shifts the latent away from the distribution the DiT has learned. To address this, we propose Generation-Aware Latent Compression for Efficient Video Generation (GRACE), a two-stage framework that compresses a pretrained video autoencoder while keeping it compatible with the pretrained DiT. Specifically, we keep a frozen base latent from the pretrained encoder and learn a residual latent for the information lost under stronger compression, while aligning the compressed latent with the pretrained latent in the feature space of the frozen DiT so that the autoencoder is optimized for generation. We then adapt the DiT with lightweight fine-tuning and asymmetric denoising, where the base is denoised ahead of the residual. GRACE reduces the token count of Wan2.1-I2V-14B by 8x and its latency by 11.1x at 480x832x81, while matching the generation quality of the pretrained pipeline before compression on VBench.', 'score': 62, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'af5d23fdad2f77b5', 'authors': ['Jiyoung Kim', 'Paul Hyunbin Cho', 'Jisu Nam', 'Donghoon Lee', 'Hyunsung Go', 'Yeonkyeong Lee', 'Hansaem Kim', 'Seungryong Kim'], 'affiliations': ['KAIST', 'Kakao Corp.'], 'pdf_title_img': 'assets/pdf/title_img/2610.10524.jpg', 'data': {'categories': ['#video', '#optimization', '#diffusion', '#architecture', '#training', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Сжатие видеоавтокодеров без потери совместимости с предобученными моделями', 'desc': 'В статье предложен метод GRACE для сжатия видеоавтокодеров, которые используются в диффузионных трансформерах. Основная идея заключается в двухэтапном подходе: сначала сжимается предобученный автокодер, а остаточная информация кодируется отдельно, затем выполняется выравнивание сжатого латентного пространства с исходным распределением в признаковом пространстве замороженного DiT. После этого трансформер адаптируется с помощью легковесной доподготовки и асимметричного denoisingа. Метод позволяет уменьшить количество токенов в 8 раз и снизить задержку в 11.1 раза при сохранении качества генерации видео.'}, 'en': {'title': 'Efficient Video Generation with GRACE: Compressing Autoencoders Smartly', 'desc': "This paper introduces GRACE, a novel framework designed to enhance the efficiency of video generation by compressing video autoencoders while maintaining compatibility with pretrained Diffusion Transformers (DiT). The challenge lies in balancing compression and reconstruction quality, as higher compression can lead to degraded outputs. GRACE addresses this by using a two-stage approach that retains a frozen base latent from the pretrained encoder and learns a residual latent to recover lost information. The method optimizes the compressed latent to align with the pretrained DiT's feature space, resulting in significant reductions in token count and latency without sacrificing generation quality."}, 'zh': {'title': '高效视频生成的生成感知潜在压缩', 'desc': '本论文提出了一种名为GRACE的生成感知潜在压缩框架，旨在提高视频生成的效率。该框架通过保持预训练视频自编码器的兼容性，解决了高压缩比导致重建质量下降的问题。GRACE采用两阶段的方法，首先冻结基础潜在，然后学习残差潜在，以补偿在强压缩下丢失的信息。最终，GRACE在保持生成质量的同时，显著减少了令牌数量和延迟。'}}}, {'id': 'https://huggingface.co/papers/2610.06293', 'title': 'VepAgent: Bridging Causal-Transition via Tool-Augmented Reinforcement Learning for Video Event Prediction', 'url': 'https://huggingface.co/papers/2610.06293', 'abstract': 'Abstract  Multimodal Large Language Models (MLLMs) have demonstrated remarkable potential in video understanding, yet their reliance on retrospective summarization and text-centric priors often limits their ability to bridge unobserved causal transitions when applied to Video Event Prediction (VEP). To address this, we propose VepAgent, an agentic framework that integrates causal-transition reasoning with tool-augmented reinforcement learning (RL) for robust VEP. Unlike prior methods that passively project future trajectories from historical dependencies, our approach explicitly models the logical progression from terminal observed states to future events. Specifically, we first construct futurebench-4K, a high-quality chain-of-thought dataset for supervised fine-tuning (SFT) that effectively bridges the causal-logic gap by structuring the deduction of unobserved intermediate states. Subsequently, we develop a diagnostic tool library integrating state tracking, frame retrieval, and region magnification, enabling the agent to dynamically augment reasoning with external tools to recover missing spatio-temporal evidence and resolve visual ambiguities during inference. Moreover, we propose a composite reward mechanism that jointly optimizes prediction accuracy, causal coherence, and reliable prior, compelling the agent to rely on genuine visual grounding rather than superficial textual similarities. Extensive evaluations on FutureBench and NEPBench datasets demonstrate that our method achieves state-of-the-art performance, significantly outperforming larger MLLMs and validating the empirical effectiveness of our agentic, future-oriented reasoning paradigm.', 'score': 52, 'issue_id': 3385, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'b3f57e94cec4f041', 'authors': ['Qiutong Chen', 'Yuchan Guo', 'Zhenlong Yuan', 'Haobo Yang', 'Fangfang Lin', 'Xinyi Long', 'Yin Wang', 'Zijian Song', 'Rui Lan', 'Shi Qiu', 'Boyuan Pan', 'Yang Luo', 'Yuyin Zhou'], 'affiliations': ['Carnegie Mellon University', 'Columbia University', 'Nankai University', 'New York University', 'Santa Clara University', 'University of California, Santa Cruz', 'Xiaohongshu Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2610.06293.jpg', 'data': {'categories': ['#video', '#agents', '#dataset', '#training', '#multimodal', '#rl', '#benchmark'], 'emoji': '🔮', 'ru': {'title': 'Причинно-логические переходы: будущее видео через агентные рассуждения', 'desc': 'Статья представляет VepAgent — агентный фреймворк для предсказания событий в видео, который преодолевает ограничения современных мультимодальных больших языковых моделей через явное моделирование причинно-следственных переходов. Авторы создали специализированный датасет FutureBench-4K с цепочками рассуждений для обучения моделей логическому выводу о ненаблюдаемых промежуточных состояниях. Фреймворк использует библиотеку диагностических инструментов (отслеживание состояния, поиск кадров, увеличение областей) и обучение с подкреплением для динамического расширения рассуждений и восстановления пропущенных пространственно-временных данных. Результаты на бенчмарках FutureBench и NEPBench показывают, что метод достигает лучших показателей и превосходит более крупные MLLM благодаря причинно-обоснованному подходу к предсказанию.'}, 'en': {'title': 'Empowering Video Event Prediction with Causal Reasoning and Reinforcement Learning', 'desc': 'This paper introduces VepAgent, a new framework designed to improve video event prediction (VEP) by integrating causal reasoning with reinforcement learning. Unlike traditional methods that rely on past data to predict future events, VepAgent models the logical steps needed to connect observed states to future outcomes. The authors also created a dataset called futurebench-4K to help train the model by providing structured reasoning paths for unobserved states. Additionally, the framework includes tools for enhancing reasoning and a reward system that encourages accurate predictions based on visual evidence rather than just text similarities.'}, 'zh': {'title': 'VepAgent：未来导向的视频事件预测新方法', 'desc': '多模态大型语言模型（MLLMs）在视频理解方面展现了巨大的潜力，但在视频事件预测（VEP）中，它们依赖于回顾性总结和以文本为中心的先验，限制了其能力。为了解决这个问题，我们提出了VepAgent，这是一种将因果转移推理与工具增强的强化学习（RL）相结合的框架。我们首先构建了futurebench-4K，这是一个高质量的链式思维数据集，用于监督微调（SFT），有效地弥补因果逻辑的差距。我们的评估结果表明，该方法在FutureBench和NEPBench数据集上达到了最先进的性能，显著超越了更大的MLLMs，验证了我们面向未来的推理范式的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.10429', 'title': 'SGF+: Decoupling Gradient Flows for Autoregressive Video Generation', 'url': 'https://huggingface.co/papers/2610.10429', 'abstract': 'Abstract  Autoregressive video generation requires denoising the current frames while writing their key-value representations as context for future predictions. However, these two roles typically share parameters, and we find that their gradients exhibit distinct patterns and systematic negative alignment, hindering the joint optimization of visual quality and temporal consistency. We introduce Self Gradient Forcing Plus (SGF+), which assigns separate parameters to context writing and denoising while preserving their interaction through causal attention. Both roles are jointly optimized using the original generation objective without auxiliary losses, with context writing supervised through its contribution to future predictions. This simple change improves visual quality and long-horizon consistency over the evaluated baselines in both framewise and chunkwise generation, without additional video training data or a longer training horizon. Trained on only 5s rollouts, SGF+ supports continuous generation for up to 24 hours without long-video fine-tuning. These results highlight role-specific parameterization as an effective design principle for high-quality autoregressive video generation and native long-horizon extrapolation.', 'score': 50, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '6ac279e3a9d4c511', 'authors': ['Zihan Su', 'Junhao Zhuang', 'Yaowei Li', 'Siwen Lu', 'Haoran Li', 'Lingen Li', 'Haoyu Wu', 'Weiyang Jin', 'Songchun Zhang', 'Haoyang Huang', 'Chun Yuan', 'Zeyue Xue', 'Nan Duan'], 'affiliations': ['Joy Future Academy, JD', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.10429.jpg', 'data': {'categories': ['#training', '#architecture', '#video'], 'emoji': '🎬', 'ru': {'title': 'Разделение ролей параметров для высокачественной автарегрессивной генерации видео', 'desc': 'Работа решает проблему конфликта градиентов при автарегрессивной генерации видео, где модель одновременно должна улучшать качество текущих кадров и подготавливать контекст для будущих предсказаний. Авторы предлагают Self Gradient Forcing Plus (SGF+) — метод, который разделяет параметры между этими двумя ролями, сохраняя их взаимодействие через причинное внимание. Оптимизация обеих компонент происходит без вспомогательных потерь, где написание контекста контролируется через его вклад в будущие предсказания. Метод демонстрирует улучшение визуального качества и временной консистентности, а также позволяет генерировать видео длительностью до 24 часов, обучаясь только на 5-секундных последовательностях.'}, 'en': {'title': 'Enhancing Video Generation with Role-Specific Parameterization', 'desc': 'This paper addresses the challenges in autoregressive video generation, particularly the conflict between denoising current frames and creating key-value representations for future predictions. The authors introduce a method called Self Gradient Forcing Plus (SGF+), which separates the parameters for these two tasks to improve optimization. By using causal attention, SGF+ allows for interaction between the tasks while optimizing them jointly without needing extra losses. The results show that this approach enhances both visual quality and consistency in video generation, enabling long-duration outputs without extensive training data.'}, 'zh': {'title': '角色特定参数化提升视频生成质量', 'desc': '自回归视频生成需要在生成当前帧的同时去噪，并将其关键值表示作为未来预测的上下文。然而，这两个角色通常共享参数，导致它们的梯度表现出不同的模式和系统性的负向对齐，妨碍了视觉质量和时间一致性的联合优化。我们提出了自梯度强制增强（SGF+），为上下文写入和去噪分配了独立的参数，同时通过因果注意力保持它们的交互。这个简单的改变在不增加额外视频训练数据或延长训练时间的情况下，显著提高了视觉质量和长时间一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.09823', 'title': 'UltraText Bench: A Comprehensive Bilingual Benchmark for Evaluating Visual Text Rendering in Image Generation', 'url': 'https://huggingface.co/papers/2610.09823', 'abstract': "Abstract  Dense visual text requires image generators to reproduce long strings across multiple regions with correct placement and legibility. As short-string rendering improves, evaluation must test sustained performance across more demanding scenes. We introduce UltraText Bench, a bilingual benchmark for prompt-only generation of dense visual text. It contains 432 prompts spanning 24 real-world scene categories and three difficulty levels, split equally between English and Chinese. Each human-reviewed prompt supplies exact strings for four to twelve text regions, paired with structured references for their content, placement, and visual attributes. We use the Q-Judger vision-language model to assess each image against the complete reference, reporting text fidelity, text clarity, spatial quality, and scene quality. Across 24 model configurations, these dimensions reveal different strengths: Z-Image-Turbo gains 3.81 clarity points over Z-Image-Base while losing 14.76 fidelity points under the reported settings. Performance also varies with workload; Qwen-Image-2512's English composite falls from 86.50 at L1 to 42.86 at L3. Ten participants took part in human evaluation of the automatic scores. Repository: https://github.com/LINs-lab/UltraText_Bench.", 'score': 49, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'af4bde44bd286f60', 'authors': ['Deyuan Liu', 'Yihao Hu', 'Jingxuan Zhang', 'Xingying Li', 'Jun Xie', 'Jiacheng Liu', 'Jungang Li', 'Yu Huang', 'Xuanyi Liu', 'Yue Ding', 'Zecheng Wang', 'Lei Zhao', 'Mingda Wang', 'Zhenglin Cheng', 'Peng Sun', 'Tao Lin'], 'affiliations': ['Ant Group', 'CASIA', 'CityU', 'HKUST', 'MBZUAI', 'Peking University', 'Shanghai Innovation Institute', 'Wechat AI', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.09823.jpg', 'data': {'categories': ['#dataset', '#cv', '#benchmark', '#multilingual'], 'emoji': '📝', 'ru': {'title': 'Бенчмарк для оценки генерации плотного визуального текста в изображениях', 'desc': 'Авторы представляют UltraText Bench — комплексный бенчмарк для оценки способности моделей генеративного AI воспроизводить плотный визуальный текст в изображениях. Датасет содержит 432 тщательно проверенные люди подсказки на английском и китайском языках с четырьмя-двенадцатью текстовыми регионами, размещенными в 24 сценах реального мира с указанием точного контента и визуальных атрибутов. Для автоматической оценки используется vision-language модель Q-Judger, которая измеряет верность текста, его четкость, пространственное качество и общее качество сцены. Анализ 24 конфигураций моделей выявил различные сильные стороны генераторов: некоторые достигают лучшей четкости за счет точности воспроизведения текста, а производительность существенно падает с увеличением сложности задачи.'}, 'en': {'title': 'Benchmarking Dense Visual Text Generation with UltraText Bench', 'desc': 'This paper presents UltraText Bench, a new benchmark designed to evaluate the performance of image generators in creating dense visual text. It includes 432 prompts across various real-world scenes and difficulty levels, focusing on both English and Chinese text. The evaluation uses the Q-Judger vision-language model to measure text fidelity, clarity, spatial quality, and overall scene quality. Results show that different model configurations have varying strengths, highlighting the need for comprehensive testing in complex scenarios.'}, 'zh': {'title': '密集视觉文本生成的新基准测试', 'desc': '本论文介绍了UltraText Bench，这是一个用于密集视觉文本生成的双语基准测试。它包含432个提示，涵盖24个真实场景类别和三个难度级别，支持英语和中文。每个提示都经过人工审核，提供了四到十二个文本区域的确切字符串，并配有内容、位置和视觉属性的结构化参考。我们使用Q-Judger视觉语言模型评估生成图像的文本保真度、清晰度、空间质量和场景质量，以此揭示不同模型配置的优缺点。'}}}, {'id': 'https://huggingface.co/papers/2610.02054', 'title': 'UniWAM: Unified World-Action Model', 'url': 'https://huggingface.co/papers/2610.02054', 'abstract': 'Abstract  Vision-language-action models benefit from the understanding and reasoning capabilities of pretrained vision-language models, but action-only supervision provides limited grounding in world dynamics. Conversely, world-action models inherit spatiotemporal priors from video generation models, yet remain limited in semantic understanding and reasoning under distribution shifts. We introduce UniWAM, a unified architecture that integrates a physical reasoner, a world generator, and an action predictor to jointly learn semantic understanding of the physical world, visual generation, and action prediction. To ensure the quality of the training data, we developed a rigorous data cleaning and annotation pipeline for both human egocentric data and robot data. To adapt the vision-language component to embodied tasks while preserving its inherited language capabilities, we represent low-level actions in natural language and introduce a pre-training recipe that assigns complementary supervision from visual question answering (VQA) data, human egocentric data, and robot demonstrations to the appropriate model components. During post-training, future visual noise augmentation reduces reliance on precise future predictions, while history-conditioned flow matching uses encoded action history to initialize action generation. Together, these designs significantly reduce denoising steps while maintaining performance. UniWAM achieves state-of-the-art (SOTA) performance across multiple evaluations, including in-distribution performance, robustness, generalization, instruction following, and long-horizon task execution. Furthermore, we uncover a log-linear scaling law of unified human-robot co-training, demonstrating the effectiveness of large-scale pre-training on a mixture of human and robot data.', 'score': 45, 'issue_id': 3385, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '62e1d5c3ffac21ff', 'pdf_title_img': 'assets/pdf/title_img/2610.02054.jpg', 'data': {'categories': ['#synthetic', '#open_source', '#video', '#reasoning', '#cv', '#multimodal', '#robotics', '#data', '#training'], 'emoji': '🤖', 'ru': {'title': 'Единая модель для понимания мира, генерации видео и управления роботом', 'desc': 'В работе представлена UniWAM — унифицированная архитектура, которая объединяет физический рассуждатель, генератор мира и предиктор действий для совместного обучения семантическому пониманию физического мира, визуальной генерации и предсказанию действий робота. Авторы разработали строгий конвейер очистки и аннотации данных, включающий как эгоцентрические видео людей, так и демонстрации роботов, а также представили действия на естественном языке для лучшей адаптации vision-language моделей к воплощённым задачам. Специальные техники обучения, такие как аугментация будущего шума и flow matching, обусловленный историей действий, значительно снижают число шагов денойзинга при сохранении качества. Модель достигает лучших показателей по множеству метрик и демонстрирует логарифмически-линейный закон масштабирования при совместном обучении на смешанных человеческих и робототехнических данных.'}, 'en': {'title': 'UniWAM: Unifying Vision, Language, and Action for Enhanced Learning', 'desc': 'The paper presents UniWAM, a novel architecture that combines a physical reasoner, a world generator, and an action predictor to enhance the understanding of the physical world and improve action prediction. It addresses the limitations of existing models by integrating vision-language capabilities with robust training data from both human and robot sources. The authors introduce a pre-training strategy that leverages visual question answering and action history to optimize model performance in embodied tasks. UniWAM achieves state-of-the-art results in various evaluations, showcasing its effectiveness in handling complex tasks and adapting to different data distributions.'}, 'zh': {'title': '统一架构，提升视觉与动作理解', 'desc': '本文介绍了一种名为UniWAM的统一架构，旨在结合物理推理器、世界生成器和动作预测器，以共同学习物理世界的语义理解、视觉生成和动作预测。通过严格的数据清洗和注释流程，确保了训练数据的质量，适用于人类自我中心数据和机器人数据。UniWAM在训练过程中采用自然语言表示低级动作，并通过视觉问答数据、人类自我中心数据和机器人演示提供互补监督，从而适应具身任务。最终，UniWAM在多个评估中实现了最先进的性能，包括分布内性能、鲁棒性、泛化能力、指令跟随和长时间任务执行。'}}}, {'id': 'https://huggingface.co/papers/2609.40360', 'title': 'Semifactual Credit-Augmented Policy Optimization', 'url': 'https://huggingface.co/papers/2609.40360', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) has improved the reasoning capabilities of large language models (LLMs), yet their predictions remain sensitive to task-irrelevant prompt features. We investigate this sensitivity through semifactual prompt interventions that preserve the underlying problem and its answer. Our analysis reveals substantial variation in token-level sensitivity and shows that suppressing high-drift token candidates during decoding improves reasoning accuracy without updating model weights. These findings highlight a limitation of Group Relative Policy Optimization (GRPO), which assigns the same outcome-derived advantage to every response token and may reinforce potential spurious dependence alongside useful reasoning. Motivated by this observation, we introduce Semifactual Credit-Augmented Policy Optimization (SCAPO), a causally inspired variant of GRPO that incorporates semifactual stability into token-level credit assignment. SCAPO measures token probability drift for fixed responses under semifactual interventions and uses normalized stability scores to reduce advantages for relatively unstable tokens during early training, while granting no additional credit for stability alone. On Qwen3-4B-Base and Qwen3-1.7B-Base, SCAPO improves AIME 2024-2026 accuracy over GRPO by 5.63 and 4.17 percentage points, respectively. At both model scales, SCAPO achieves the best results on most evaluated mathematics benchmarks and all evaluated out-of-distribution benchmarks among the compared methods. These results suggest that semifactual stability provides an effective training signal for improving reasoning and generalization through finer-grained credit assignment in RLVR. The code is available at https://github.com/DtYXs/SCAPO.', 'score': 36, 'issue_id': 3385, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'dc0eb49bf9d60324', 'authors': ['Junshu Pan', 'Zhizhang Fu', 'Shulin Huang', 'Yiran Ding', 'Zifan Cheng', 'Wenqi Shao', 'Qiaosheng Zhang', 'Yue Zhang'], 'affiliations': ['Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.40360.jpg', 'data': {'categories': ['#small_models', '#open_source', '#reasoning', '#training', '#math', '#rlhf', '#optimization', '#rl', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Стабильный кредит для устойчивого рассуждения: каузальный подход к обучению LLM', 'desc': 'В работе исследуется проблема чувствительности больших языковых моделей к незначимым особенностям промптов при использовании обучения с подкреплением с проверяемыми вознаграждениями. Авторы предлагают метод SCAPO, который улучшает распределение кредита на уровне токенов, учитывая стабильность предсказаний модели под полуфактическими вмешательствами в промпт. Новый подход снижает вероятность переобучения на случайные зависимости, вознаграждая только те токены, которые действительно способствуют корректному рассуждению. Экспериментальные результаты показывают значительное улучшение точности решения математических задач и лучшую обобщаемость на распределение данных, отличные от обучающих.'}, 'en': {'title': 'Enhancing Reasoning in LLMs with Semifactual Stability', 'desc': 'This paper explores the limitations of reinforcement learning with verifiable rewards (RLVR) in large language models (LLMs), particularly their sensitivity to irrelevant prompt features. The authors introduce semifactual prompt interventions to analyze token-level sensitivity and propose a new method called Semifactual Credit-Augmented Policy Optimization (SCAPO). SCAPO improves reasoning accuracy by adjusting the credit assignment for tokens based on their stability during training, rather than treating all tokens equally. The results show that SCAPO outperforms traditional methods like Group Relative Policy Optimization (GRPO) in various benchmarks, indicating that incorporating semifactual stability enhances model reasoning and generalization.'}, 'zh': {'title': '提升推理能力的半事实策略优化', 'desc': '本文探讨了强化学习与可验证奖励（RLVR）在大型语言模型（LLMs）中的应用，指出模型对与任务无关的提示特征敏感。通过半事实提示干预，分析了模型在解码过程中的敏感性，并提出抑制高漂移标记候选项以提高推理准确性。研究还指出了群体相对策略优化（GRPO）的局限性，提出了半事实信用增强策略优化（SCAPO），该方法在标记级别信用分配中引入了半事实稳定性。实验结果表明，SCAPO在多个数学基准测试中表现优异，显著提高了推理和泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2610.10539', 'title': 'Tetris3D: 3D Scene Generation With Objects That Fit Together', 'url': 'https://huggingface.co/papers/2610.10539', 'abstract': 'Abstract  We propose Tetris3D, a generative framework for single-image 3D scene reconstruction that recovers objects which are physically and geometrically coherent as a scene. Existing methods often generate objects independently or couple them implicitly, providing limited guidance for ensuring fine-grained spatial compatibility between neighboring objects that interact with one another. To address this, we explicitly condition the generation of each object on the geometry of surrounding objects and their physical relationships, guiding its shape and pose to remain geometrically and physically plausible within the scene. Moreover, we introduce ComOb, a physics simulation-based dataset of 1.2M scenes featuring physical interactions across diverse object categories, with per-object meshes and pairwise physical relation annotations. Comprehensive experiments on synthetic and realworld scenes show that Tetris3D recovers coherent object shapes and poses even when interacting regions are occluded, and achieves state-of-the-art performance in both generation quality and physical stability.', 'score': 35, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'c5ae4f7a13a1a76a', 'authors': ['Jaeyeong Kim', 'Jinhyuk Jang', 'Jongmin Lee', 'Kyehong Park', 'Seungryong Kim'], 'affiliations': ['KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.10539.jpg', 'data': {'categories': ['#dataset', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Физически согласованная генеративная реконструкция 3D-сцен из одного изображения', 'desc': 'В работе предложена Tetris3D — генеративная модель для реконструкции 3D-сцен с одного изображения, восстанавливающая объекты, которые физически и геометрически согласованы между собой. В отличие от существующих методов, которые генерируют объекты независимо или неявно связывают их, авторы явно обусловливают генерацию каждого объекта геометрией и физическими взаимодействиями окружающих объектов. Для обучения авторы создали ComOb — датасет из 1.2M сцен с физическими симуляциями, содержащий меши объектов и аннотации парных физических отношений. Экспериментальные результаты демонстрируют, что Tetris3D восстанавливает согласованные формы и позы объектов даже при окклюзии, достигая лучших показателей по качеству генерации и физической стабильности.'}, 'en': {'title': 'Building Realistic 3D Scenes from Single Images', 'desc': "Tetris3D is a new framework designed for creating 3D scenes from a single image, focusing on generating objects that fit well together both physically and geometrically. Unlike previous methods that treat objects separately, Tetris3D ensures that each object's shape and position are influenced by the geometry and physical relationships of nearby objects. This approach helps maintain realistic interactions between objects, even when parts of them are hidden from view. Additionally, the framework is supported by a large dataset called ComOb, which includes millions of scenes with detailed information about object interactions and shapes."}, 'zh': {'title': 'Tetris3D：生成一致的3D场景重建', 'desc': '本文提出了Tetris3D，这是一个用于单幅图像3D场景重建的生成框架，能够恢复在物理和几何上相互一致的对象。现有方法通常独立生成对象或隐式耦合，缺乏对相邻对象之间细致空间兼容性的指导。为了解决这个问题，我们明确地将每个对象的生成与周围对象的几何形状和物理关系相结合，从而指导其形状和姿态在场景中保持几何和物理上的合理性。此外，我们引入了ComOb，这是一个基于物理模拟的数据集，包含120万个场景，涵盖多种对象类别的物理交互，提供每个对象的网格和成对的物理关系注释。'}}}, {'id': 'https://huggingface.co/papers/2610.10444', 'title': 'RunningTab: Direct Workspace Interaction with Environment-Side Tabs', 'url': 'https://huggingface.co/papers/2610.10444', 'abstract': 'Abstract  Much knowledge work produces new deliverables from files a workspace already holds, and LLM agents are beginning to take such work over. Through direct corpus interaction, an agent can search and read any of those files from a terminal with no indexing, and producing a deliverable from many of them in this way is what we call direct workspace interaction (DWI). Reaching the files, however, is only half the task: nothing keeps track of what the task asks for, what has been read, and what was listed but never opened, all of which slip through the context window without leaving a trace, so an agent may extract a figure and still deliver a report without it. To address this, we present RunningTab, a framework that equips direct workspace interaction with an environment-side tab: a per-task record of what the task still owes, kept by the environment alongside the agent. Specifically, the agent adds its requirements, while the environment records every file read as an excerpt with its provenance and every listed but unopened file as a candidate; the agent can then see each requirement beside its best-matching excerpts and top unopened candidates, resolve it against matching content or set it aside with a reason, and, should it try to finish with requirements still open, receive them in a finish check. We validate RunningTab on three benchmarks with three LLMs, where it consistently outperforms plain DWI and baselines that keep the record in the model, while its tab usually holds the values a deliverable needs once seen.', 'score': 34, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '3cf2b278910cf519', 'authors': ['Jinheon Baek', 'Soyeong Jeong', 'Yumin Choi', 'Dongsu Han', 'Sung Ju Hwang'], 'affiliations': ['DeepAuto.ai', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.10444.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '📋', 'ru': {'title': 'Память о требованиях: система для отслеживания прогресса LLM агентов при работе с файлами', 'desc': 'Статья описывает проблему, когда LLM агенты работают с файлами в рабочей среде через прямое взаимодействие, но теряют информацию о требованиях задачи из-за ограничений контекстного окна. Авторы предлагают фреймворк RunningTab, который ведет учет всех требований задачи на уровне окружения, отслеживая прочитанные файлы с их источниками и потенциальные файлы для открытия. Система позволяет агенту видеть каждое требование вместе с релевантными фрагментами текста и предотвращает завершение задачи с неполными требованиями. Эксперименты на трех бенчмарках показывают, что RunningTab значительно превосходит базовый подход прямого взаимодействия с рабочей средой.'}, 'en': {'title': 'Enhancing LLM Task Management with RunningTab', 'desc': 'This paper introduces RunningTab, a framework designed to enhance direct workspace interaction (DWI) for large language model (LLM) agents. DWI allows agents to access and utilize files directly from a workspace without prior indexing, but it lacks a mechanism to track task requirements and file interactions. RunningTab addresses this by maintaining a per-task record of what the agent needs to accomplish, including files read and those that remain unopened. The framework has been validated against three benchmarks, demonstrating improved performance over traditional DWI methods and models that attempt to manage task records internally.'}, 'zh': {'title': '提升工作区交互的智能管理', 'desc': '这篇论文介绍了一种名为RunningTab的框架，旨在改善大型语言模型（LLM）在直接工作区交互（DWI）中的表现。DWI允许代理直接与文件交互，但在任务管理上存在缺陷，导致代理可能遗漏重要信息。RunningTab通过在环境中维护一个任务记录，帮助代理跟踪已读文件和未读候选文件，从而提高交付物的准确性。实验结果表明，RunningTab在多个基准测试中优于传统的DWI方法。'}}}, {'id': 'https://huggingface.co/papers/2610.08760', 'title': 'WorldSonus: Bringing Sound to Worlds', 'url': 'https://huggingface.co/papers/2610.08760', 'abstract': 'Abstract  Recent advances in world models have enabled increasingly realistic visual synthesis. However, these generated environments remain largely silent. Bringing sound to world models poses three core challenges: real-time generation to keep pace with interactive video streams, interactive control to respond to mid-stream sound instructions, and spatially aligned stereo to reflect scene geometry and camera motion. To address these demands, we introduce WorldSonus, an interactive video-to-audio framework designed for real-time spatial sound synthesis in world models. For real-time generation, WorldSonus employs a streaming causal autoregressive diffusion architecture that synthesizes audio chunks at a low real-time factor (RTF) of 0.41. For interactive control, we incorporate an audio-centric captioning pipeline with chunk-indexed prompt scheduling, enabling dynamic manipulation of sound events during generation. For spatial alignment, we leverage high-quality stereo supervision curated from diverse stereo and ambisonic data. Extensive experiments demonstrate that while tailored for world models, WorldSonus generalizes effectively to open-domain video-to-audio benchmarks, matching or outperforming state-of-the-art bidirectional models in both acoustic quality and spatial alignment. Project page: https://noizai.github.io/WorldSonus/', 'score': 32, 'issue_id': 3385, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'ea42ea086927c5a4', 'authors': ['Pengjun Fang', 'Jingyi Fa', 'Kam Man Wu', 'Jiaming Wang', 'Haoyuan Huang', 'Yaguang Wu', 'Xiangjun Huang', 'Ziyang Ma', 'Weijia Chen', 'Hongyu Liu', 'Zeyue Tian', 'Qifeng Chen'], 'affiliations': ['MetaX', 'Noiz AI', 'Shanghai Jiao Tong University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.08760.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#audio', '#video'], 'emoji': '🔊', 'ru': {'title': 'Интерактивный синтез пространственного звука для видеомоделей мира в реальном времени', 'desc': 'В статье представлена WorldSonus — интерактивная система для синтеза звука в реальном времени, которая добавляет аудиосоставляющую к видеомоделям мира. Система использует потоковую каузальную диффузионную архитектуру, позволяющую генерировать звук с низким коэффициентом задержки (RTF = 0.41) и синхронизировать его с видео. Для интерактивного управления реализована система обработки текстовых подсказок с временной привязкой, которая позволяет динамически менять звуковые события прямо во время генерации. Модель обучена на высококачественных стереозаписях из различных источников, что обеспечивает правильное пространственное выравнивание звука относительно геометрии сцены и движения камеры.'}, 'en': {'title': 'Bringing Sound to Life in Visual Worlds with WorldSonus', 'desc': 'This paper presents WorldSonus, a framework that adds sound to visual world models, enhancing the realism of generated environments. It tackles three main challenges: generating audio in real-time, allowing interactive control over sound during video playback, and ensuring that sound is spatially aligned with the visual scene. WorldSonus uses a streaming causal autoregressive diffusion model for efficient audio synthesis and incorporates an audio-centric captioning system for dynamic sound manipulation. The framework shows strong performance in both acoustic quality and spatial alignment, outperforming existing models in various benchmarks.'}, 'zh': {'title': '为世界模型带来声音的创新框架', 'desc': '最近的世界模型进展使得视觉合成变得更加真实。然而，这些生成的环境在声音方面仍然缺乏表现。为了解决实时生成、交互控制和空间对齐等挑战，我们提出了WorldSonus，这是一个用于世界模型的交互式视频到音频框架。实验表明，WorldSonus在音质和空间对齐方面超越了现有的双向模型，具有良好的通用性。'}}}, {'id': 'https://huggingface.co/papers/2609.39306', 'title': 'ReSAIL: Mitigating Collapse in Iterative Agent Self-Distillation', 'url': 'https://huggingface.co/papers/2609.39306', 'abstract': "Abstract  Iterative self-distillation enables LLM agents to learn from successive deployments, offering a path toward recursive self-improvement (RSI). Yet our experiments with existing methods reveal a collapse in deployment performance across cycles, while task performance with privileged information (PI) also declines. We address this collapse by prioritizing informative interaction steps for distillation and preserving PI-conditioned behavior as the student becomes the next teacher. We introduce Retentive and Selective Augmentation for Iterative Self-Distillation (ReSAIL), a plug-in augmentation for iterative PI-based self-distillation. ReSAIL selects interaction steps where PI most strongly changes the teacher's predictions and balances the resulting distillation losses across trajectories. It also regularizes the student's PI-conditioned output distributions toward those of the frozen teacher at selected and unselected steps to preserve PI-conditioned behavior for supervision in the next cycle. On ALFWorld and TextCraft, ReSAIL sustains substantial gains across model scales over three cycles, with an average absolute gain of 22.5% in final-cycle success rates when added to self-distillation baselines. Sensitivity-guided selection of offline data also improves action prediction accuracy for multimodal GUI agents on AITZ. These findings provide the first evidence that a more robust learning mechanism can effectively mitigate performance collapse in iterative agent self-distillation over deployment trajectories.", 'score': 31, 'issue_id': 3385, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '1441e7e397cdc41d', 'authors': ['Shengjie Jin', 'Hengbo Xu', 'Zelong Sun', 'YuJie Guo', 'Zhiwu Lu'], 'affiliations': ['Gaoling School of Artificial Intelligence, Renmin University of China, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.39306.jpg', 'data': {'categories': ['#agents', '#training', '#rlhf'], 'emoji': '🔄', 'ru': {'title': 'Избирательная дистилляция для устойчивого самосовершенствования агентов', 'desc': 'В работе предложен метод ReSAIL для итеративной самодистилляции агентов на основе LLM, который позволяет моделям обучаться на протяжении нескольких циклов развертывания и достигать рекурсивного самосовершенствования. Основная проблема существующих методов заключается в коллапсе производительности агента при переходе между циклами, несмотря на использование привилегированной информации. ReSAIL решает эту проблему путем селективного выбора информативных шагов взаимодействия для дистилляции и сохранения поведения модели, обусловленного привилегированной информацией, через регуляризацию распределений выходов. Экспериментальные результаты на бенчмарках ALFWorld и TextCraft демонстрируют устойчивое улучшение производительности на 22,5% в среднем за три цикла развертывания.'}, 'en': {'title': 'Enhancing Self-Distillation with ReSAIL for Robust Learning', 'desc': "This paper presents a method called ReSAIL, which enhances iterative self-distillation for large language model (LLM) agents. The authors identify a problem where performance declines across deployment cycles, particularly when using privileged information (PI). ReSAIL addresses this by selecting key interaction steps that significantly influence the teacher's predictions and ensuring that the student's behavior remains aligned with the teacher's. The results show that ReSAIL improves performance in various tasks, demonstrating a more effective learning mechanism that prevents performance collapse during self-distillation."}, 'zh': {'title': '迭代自我蒸馏的新突破：ReSAIL', 'desc': '本文提出了一种名为ReSAIL的增强方法，用于迭代自我蒸馏，以解决在多次部署中性能下降的问题。通过优先选择信息丰富的交互步骤进行蒸馏，并保持特权信息（PI）条件下的行为，ReSAIL能够有效地提高模型的学习效果。实验表明，ReSAIL在多个模型规模上都能显著提升最终成功率，平均提高22.5%。这些结果表明，ReSAIL为迭代自我蒸馏提供了一种更稳健的学习机制，能够有效减轻性能崩溃现象。'}}}, {'id': 'https://huggingface.co/papers/2610.10409', 'title': 'RobotWorld: Benchmarking Multimodal Agents for Robot Use Across Diverse Tasks and Embodiments', 'url': 'https://huggingface.co/papers/2610.10409', 'abstract': 'Abstract  General-purpose agents increasingly write code, use tools, and complete complex digital tasks, raising the question of how far these capabilities carry into the physical world. To investigate this, we introduce RobotWorld, a challenging simulation testbed for robot use: turning instructions and observations into physical task execution through robot interfaces. Its 84 tasks span manipulation, mobile manipulation, locomotion, driving, and aerial control, with explicit interaction budgets and executable success checks. By analysing task outcomes alongside execution traces, we identify both the capabilities that transfer and the gaps that prevent reliable completion. Furthermore, we find that current agents can construct sophisticated perception and control workflows, including image segmentation, camera calibration, spatial estimation, and dynamics-based computation. These capabilities, however, do not consistently compose into successful behaviour: agents lose task-relevant object states despite reaching commanded poses, fail to correct ineffective actions, recover too late, or mistake unfinished tasks for completion. This uneven transfer also differs across models: Astra succeeds more often on spatial and constrained-contact goals, whereas Opus 5.5 succeeds more often on continuous-balance and timed-interaction goals. By linking these outcomes to execution behaviour, RobotWorld provides both a rigorous proving ground and an empirical account of the remaining capability gaps, thereby establishing concrete targets for training and designing more reliable physical-world agents.', 'score': 29, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '659e1d93e7ecb4b9', 'pdf_title_img': 'assets/pdf/title_img/2610.10409.jpg', 'data': {'categories': ['#reasoning', '#dataset', '#agents', '#transfer_learning', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'От восприятия к действию: отображение способностей языковых моделей в физический мир', 'desc': 'В работе представлена симуляционная среда RobotWorld для оценки способностей языковых моделей выполнять физические задачи через интерфейсы роботов. Исследователи протестировали современные агенты на 84 задачах, включающих манипуляцию, мобильную манипуляцию, навигацию и управление летательными аппаратами. Анализ показал, что агенты успешно конструируют сложные рабочие процессы восприятия и управления, такие как сегментация изображений и калибровка камер, однако эти компетенции не композируют надёжно в целостное поведение. Исследование выявило конкретные пробелы в способностях, такие как потеря релевантных состояний объектов и неспособность исправить неэффективные действия, что определяет направления для разработки более надёжных физических агентов.'}, 'en': {'title': 'Bridging Digital Skills to Physical Tasks with RobotWorld', 'desc': 'This paper presents RobotWorld, a simulation environment designed to test the capabilities of general-purpose agents in executing physical tasks. It includes 84 diverse tasks that require various skills such as manipulation, locomotion, and aerial control, with specific metrics for success. The study analyzes how well these agents can translate their digital skills into physical actions, revealing both their strengths and weaknesses. The findings highlight that while agents can perform complex workflows, they often struggle with maintaining task-relevant states and correcting errors, indicating areas for improvement in training and design.'}, 'zh': {'title': '探索机器人在物理世界中的能力与挑战', 'desc': '本论文介绍了一个名为RobotWorld的模拟测试平台，用于评估机器人在物理任务执行中的能力。该平台包含84个任务，涵盖了操作、移动操作、行走、驾驶和空中控制等多个领域。通过分析任务结果和执行轨迹，研究者识别出能力转移的情况以及导致任务完成不可靠的差距。研究发现，尽管当前的智能体能够构建复杂的感知和控制工作流程，但在实际执行中仍存在不一致性，影响了任务的成功率。'}}}, {'id': 'https://huggingface.co/papers/2610.10114', 'title': 'Mechanics of Long-Context Hybrid Models Part 1.1: From Hybrid Attention to Hybrid Position', 'url': 'https://huggingface.co/papers/2610.10114', 'abstract': 'Abstract  The architectural design of Large Language Models (LLMs) is shifting from traditional full-attention-only models to hybrid models, which combine different attention modules to improve long-context efficiency and performance in length extrapolation and context extension. To explain why hybrid models work and how to design them better, we propose Mechanics of Long-Context Hybrid Models. As Part 1.1 of this series, we begin with hybrids of full attention and either sliding-window attention (SWA) or gated variants of linear attention (LA), represented by GLA and GDN. We first observe a Seesaw Effect in Context Extension: LA hybrids benefit more from long-context continual pretraining, whereas SWA hybrids perform better under length extrapolation. We attribute this behavior to differences in the positional inductive biases induced by these attention mechanisms. We find that SWA hybrids suffer from a Short-Context Learning Trap, Short-Window Weariness, and Long-Window Laziness, and require extended windows to enhance performance in continual long-context pretraining. For LA hybrids, we summarize the Matthew Effect of Hybrid Position Extrapolation and propose Sliding-Window Linear Attention, achieving 16times training-free length extrapolation while maintaining 100\\% accuracy on NIAH-SK1 in 64k context length.', 'score': 29, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'eb3c69b444165034', 'authors': ['Xiaoran Liu', 'Ziwei He', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'OpenMOSS Team', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.10114.jpg', 'data': {'categories': ['#training', '#optimization', '#architecture', '#long_context'], 'emoji': '🪟', 'ru': {'title': 'Гибридные механизмы внимания для эффективной обработки длинных контекстов', 'desc': 'В этой работе авторы исследуют гибридные модели больших языковых моделей, которые комбинируют полное внимание с линейным вниманием или скользящим окном для улучшения обработки длинных контекстов. Они обнаружили эффект качелей: гибриды с линейным вниманием лучше учатся при постоянной предварительной подготовке на длинных контекстах, а гибриды со скользящим окном превосходят их при экстраполяции длины. Авторы выявили несколько проблем в гибридах со скользящим окном, включая ловушку обучения на коротких контекстах и лень при работе с длинными окнами. В качестве решения предложена новая архитектура скользящего окна с линейным вниманием, которая достигает 16-кратной экстраполяции длины без переобучения.'}, 'en': {'title': 'Hybrid Attention: Unlocking Long-Context Efficiency in LLMs', 'desc': 'This paper discusses the evolution of Large Language Models (LLMs) from using only full attention mechanisms to incorporating hybrid models that combine different types of attention for better performance. The authors introduce the concept of Mechanics of Long-Context Hybrid Models, focusing on how these hybrids can improve efficiency in handling long contexts. They identify a Seesaw Effect where different hybrid models respond differently to pretraining and length extrapolation due to their unique positional biases. Additionally, the paper highlights challenges faced by sliding-window attention hybrids and presents solutions to enhance their performance in long-context tasks.'}, 'zh': {'title': '混合模型：提升长上下文效率的关键', 'desc': '这篇论文探讨了大型语言模型（LLMs）的架构设计，特别是从传统的全注意力模型转向混合模型。混合模型结合了不同的注意力模块，以提高长上下文的效率和性能。研究发现，滑动窗口注意力（SWA）和线性注意力（LA）的混合模型在上下文扩展中表现出不同的特性，前者在长度外推时表现更好，而后者在长上下文的持续预训练中受益更多。论文还提出了滑动窗口线性注意力，能够在保持100%准确率的同时，实现16倍的无训练长度外推。'}}}, {'id': 'https://huggingface.co/papers/2610.03185', 'title': 'Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective', 'url': 'https://huggingface.co/papers/2610.03185', 'abstract': "Abstract  On-policy distillation (OPD) has become an important approach to language model post-training. However, despite its performance gains, OPD can also collapse into excessively long and repetitive generation, and the mechanism underlying these divergent outcomes remains poorly understood. We explain these outcomes through a reinforcement learning perspective: the teacher implicitly rewards student behaviors, even those it rarely exhibits itself. From this perspective, our experiments show that OPD improves performance without expanding the student's capabilities. When the implicit reward model is reliable, OPD makes correct responses easier to sample. In contrast, when the preference misaligns with quality, reward hacking happens: the implicit reward model amplifies overlong, repetitive student rollouts, even though it rarely generates such text itself. Guided by this diagnosis, we find that masking unhealthy responses during training and using SFT initialization can each effectively mitigate the collapse. Together, these findings show that OPD amplifies student behaviors favored by the teacher's implicit feedback, shifting the focus from how well the teacher generates to how reliably
