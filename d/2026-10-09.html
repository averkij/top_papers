я проактивных AI помощников', 'desc': 'В работе представлен набор данных ProactiveCoach для обучения проактивных AI ассистентов, которые наблюдают за действиями пользователя и принимают решения о предоставлении рекомендаций. Датасет включает иерархически структурированное руководство на уровнях фазы, шага и действия, что позволяет моделям лучше понимать прогресс выполнения задачи и контекст процедуры. Авторы демонстрируют, что иерархическая супервизия при fine-tuning предтренированных vision-language моделей улучшает производительность на 9.6% по сравнению с фиксированной гранулярностью руководства. Предложенная адаптивная система руководства с использованием lightweight роутера достигает превосходства на 57.1% при переходах между уровнями детализации без дополнительного fine-tuning.'}, 'en': {'title': 'Empowering AI with Adaptive Guidance for Enhanced User Support', 'desc': 'This paper presents ProactiveCoach, a suite designed to enhance proactive AI assistants by providing adaptive guidance based on user activity and expertise. It introduces ProactiveCoach-Instruct, which offers structured guidance at various levels to better understand task progress and procedural context. The evaluation tool, ProactiveCoachBench, assesses the effectiveness of guidance timing and adaptability across different levels. The results show that hierarchical supervision significantly improves performance compared to fixed-granularity methods, leading to a more responsive and effective AI assistant.'}, 'zh': {'title': '智能助手：根据用户需求提供灵活指导', 'desc': '本论文介绍了一种主动AI助手，能够根据用户的活动提供适时的指导。为了实现这一目标，研究者们提出了ProactiveCoach套件，包括用于训练的ProactiveCoach-Instruct和用于评估的ProactiveCoachBench。该系统通过分层结构的指导，帮助AI理解任务进展和用户需求，从而提供更合适的支持。与传统的固定粒度指导相比，分层指导显著提高了模型的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2610.09127', 'title': 'CADFather: Autonomous CAD Reconstruction through Coordinated Tool Use', 'url': 'https://huggingface.co/papers/2610.09127', 'abstract': 'Abstract  Reconstructing an editable CAD model from a 3D shape remains a challenging engineering task. Existing methods can propose CAD operations, but no single source of proposals works equally well across different part geometries and stages of reconstruction. We introduce CADFather, an autonomous agentic system that coordinates complementary tools to recover parametric CAD programs from 3D meshes. A vision-language assistant inspects renders of the target and intermediate reconstructions, then decides which candidate CAD programs to extend, which tools to invoke, how many proposals to generate, and when to finish. Learned and algorithmic tools propose CAD operations, while numerical optimization refines the parameters of existing programs. Proposed or refined programs are executed and evaluated to provide feedback for subsequent decisions. The agent maintains alternative candidate programs for each target part and preserves the best valid result throughout reconstruction. CADFather uses pretrained generation and assistant models without additional training. We evaluate reconstruction quality and execution validity on the full DeepCAD, Fusion360, and MCB test sets, as well as on CADENA-Bench, CADBench, and BenchCAD. We additionally analyze computational cost and the trade-off between cost and reconstruction quality.', 'score': 8, 'issue_id': 3386, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': 'f72bb6031aa064a7', 'authors': ['Gennadiy Savrasov', 'Maksim Elistratov', 'Nikita Gavrilov', 'Albert Garifullin', 'Oleg Pavlov', 'Soslan Kabisov', 'Vladimir Frolov', 'Anton Konushin', 'Andrey Kuznetsov', 'Dmitrii Zhemchuzhnikov'], 'affiliations': ['FusionBrain Lab', 'Innopolis University', 'Lomonosov Moscow State University'], 'pdf_title_img': 'assets/pdf/title_img/2610.09127.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#optimization', '#agents', '#3d', '#open_source'], 'emoji': '🏗️', 'ru': {'title': 'Агентная система для автоматического восстановления параметрических CAD-моделей из 3D-геометрии', 'desc': 'В статье представляется CADFather — автономная агентная система для восстановления параметрических CAD-программ из 3D-сеток. Система использует vision-language модель для анализа рендеров целевых форм и промежуточных реконструкций, принимая решения о том, какие кандидаты расширять, какие инструменты использовать и когда остановиться. Система координирует работу обученных и алгоритмических инструментов для предложения CAD-операций и численную оптимизацию для уточнения параметров программ. CADFather оценивается на нескольких крупных бенчмарках (DeepCAD, Fusion360, MCB и других) с анализом качества реконструкции, валидности выполнения и вычислительной эффективности.'}, 'en': {'title': 'Transforming 3D Shapes into Editable CAD Models with CADFather', 'desc': 'The paper presents CADFather, an innovative system designed to convert 3D shapes into editable CAD models. It utilizes a combination of learned and algorithmic tools to propose and refine CAD operations, ensuring adaptability across various geometries. A vision-language assistant plays a crucial role by evaluating the reconstruction process and making decisions on which CAD programs to pursue. The system is evaluated on multiple datasets, demonstrating its effectiveness in balancing reconstruction quality and computational efficiency.'}, 'zh': {'title': 'CADFather：智能重建3D模型的利器', 'desc': '本文介绍了一种名为CADFather的系统，它能够从3D形状重建可编辑的CAD模型。该系统协调多种工具，利用视觉-语言助手来检查目标和中间重建的渲染图像，并决定扩展哪些候选CAD程序。CADFather结合了学习和算法工具，提出CAD操作，并通过数值优化来细化现有程序的参数。最终，该系统在多个测试集上评估重建质量和执行有效性，同时分析计算成本与重建质量之间的权衡。'}}}, {'id': 'https://huggingface.co/papers/2609.33659', 'title': 'Learning Multimodal Embeddings with Evidence-Aligned Readout', 'url': 'https://huggingface.co/papers/2609.33659', 'abstract': 'Abstract  Multimodal large language models can expose task-relevant evidence through generation, but producing useful evidence does not by itself determine how it enters a retrieval embedding. We study whether the semantic organization of that evidence can also specify where representations are read. To address this question, we introduce EviAlign, which couples Semantic Evidence Generation with Boundary Readout in a shared multimodal large language model. It organizes evidence into five semantic units, reads the contextualized state at each unit boundary, and aggregates these states into a single normalized embedding. Generation and contrastive retrieval objectives jointly train this shared structure. With the same trailing readout, semantic evidence and free-form CoT yield nearly identical retrieval performance, suggesting that evidence organization alone does not explain the full gain. A controlled 2times3 study compares consistent and permuted evidence organization across three readout strategies, using training targets with matched evidence spans. With five readout states and the same mean pooling, the advantage of consistent semantic organization grows from 0.65 points at length-based training positions to 2.39 at evidence boundaries, yielding a 1.74-point co-design interaction. Across 12 MMEB retrieval tasks, EviAlign achieves 76.9 average Recall@1 with 500K training pairs while retaining single-vector indexing and scoring.', 'score': 8, 'issue_id': 3385, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': 'da55c78d322f41a9', 'authors': ['Zirong Chen', 'Fuda Ye', 'Enjun Du', 'Junfu Pu', 'Xinlei Wang', 'Xinyu Zuo', 'Lisheng Duan', 'Haijin Liang', 'Jin Ma', 'Jiachuan Wang', 'Yongqi Zhang'], 'affiliations': ['ARC Lab, Tencent', 'Tencent Yuanbao', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'Tsinghua University', 'University of Tsukuba'], 'pdf_title_img': 'assets/pdf/title_img/2609.33659.jpg', 'data': {'categories': ['#training', '#multimodal', '#rag'], 'emoji': '🧩', 'ru': {'title': 'Выравнивание семантических доказательств через организованное считывание границ', 'desc': 'В работе изучается, как организация семантических доказательств, генерируемых мультимодальной языковой моделью, влияет на место считывания представлений для задачи поиска. Авторы предлагают EviAlign — метод, который связывает генерацию семантических доказательств с считыванием границ единиц в единой модели, организуя доказательства в пять семантических блоков. Модель обучается совместно на целевых функциях генерации и контрастного поиска, считывая контекстуализированные состояния на границах блоков и агрегируя их в единственный нормализованный эмбеддинг. Экспериментальные результаты показывают, что согласованная организация доказательств дает значительный прирост производительности при использовании фиксированного считывающего блока, достигая 76.9 Recall@1 на 12 задачах MMEB с сохранением одновекторной индексации.'}, 'en': {'title': 'Enhancing Retrieval with Semantic Evidence Organization', 'desc': 'This paper introduces EviAlign, a method that enhances multimodal large language models by organizing evidence into semantic units for better retrieval performance. It combines Semantic Evidence Generation with Boundary Readout to create a structured approach for reading and aggregating contextualized states. The study shows that while evidence organization improves retrieval, it is not the sole factor in performance gains. EviAlign achieves high recall rates across various tasks, demonstrating the effectiveness of its design in managing evidence organization and retrieval strategies.'}, 'zh': {'title': '证据组织提升检索性能的关键', 'desc': '这篇论文研究了多模态大语言模型如何通过生成任务相关的证据来提高检索效果。我们提出了EviAlign，它将语义证据生成与边界读取结合在一起，组织证据为五个语义单元，并在每个单元边界读取上下文状态。通过联合训练生成和对比检索目标，EviAlign在检索任务中表现出色，尤其是在一致的语义组织下。实验结果表明，证据的组织方式对检索性能有显著影响，尤其是在证据边界处。'}}}, {'id': 'https://huggingface.co/papers/2610.09832', 'title': 'SkillForge: Co-Evolving Skills and Agents via Dynamic Skill Lifecycles', 'url': 'https://huggingface.co/papers/2610.09832', 'abstract': "Abstract  Memory-augmented reinforcement learning strengthens LLM agents' ability to solve complex long-horizon tasks. Skills are one such form of memory, pairing instructions with an applicability condition over task types. However, retaining every skill indiscriminately as the policy improves lets obsolete or harmful entries accumulate and mislead the agent. We propose SkillForge, an agentic RL method that compiles and evolves the skill library through a fitness-driven skill lifecycle of trial, active, stable, and retired states, so that the skills and the model co-evolve throughout training. A pre-RL evaluation phase first uses the base model's own rollouts to pre-retire low-fitness skills, yielding a filtered library that then seeds supervised fine-tuning. Reinforcement learning takes over from this checkpoint, and at each iteration selective retirement, stabilization, and LLM-guided mutation continue to forge the skill library alongside policy optimization. Across multiple interactive agent benchmarks, SkillForge achieves the highest aggregate success rate, delivering up to 7.8% relative improvement over the strongest baseline while keeping the skill library compact throughout training. We introduce SkillFurnace, a dataset of 5k+ annotated records bundling retirement-filtered SFT trajectories, evolved skill libraries with fitness annotations, and retirement events with human-annotated failure categories to support research on skill quality and lifecycle management.", 'score': 7, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '05ea6a3f12b55307', 'authors': ['Yuyao Ge', 'Yiwei Wang', 'Yuchen He', 'Baolong Bi', 'Lingrui Mei', 'Jiayu Yao', 'Lizhe Chen', 'Shenghua Liu'], 'affiliations': ['Institute of Computing Technology, Chinese Academy of Sciences', 'Tsinghua University', 'University of California, Merced'], 'pdf_title_img': 'assets/pdf/title_img/2610.09832.jpg', 'data': {'categories': ['#open_source', '#reasoning', '#agents', '#dataset', '#training', '#rl', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Эволюция библиотеки навыков через жизненный цикл для усиления RL-агентов', 'desc': 'В статье предлагается SkillForge — метод обучения с подкреплением для LLM-агентов, который управляет библиотекой навыков через жизненный цикл состояний: пробные, активные, стабильные и архивированные. Система использует фитнес-функции для отбора полезных навыков и удаления устаревших или вредных записей, позволяя модели и навыкам совместно развиваться во время обучения. Предварительная фаза оценки отфильтровывает низкокачественные навыки перед supervised fine-tuning, а затем обучение с подкреплением продолжает эволюцию библиотеки через селективное архивирование, стабилизацию и LLM-управляемую мутацию. Метод показывает улучшение на 7.8% относительно лучших базовых решений и сохраняет компактность библиотеки навыков.'}, 'en': {'title': 'Evolving Skills for Smarter Agents with SkillForge', 'desc': 'This paper presents SkillForge, a novel approach in memory-augmented reinforcement learning that enhances the performance of large language model (LLM) agents on complex tasks. It introduces a structured skill lifecycle that includes trial, active, stable, and retired states to manage the skills effectively, preventing the accumulation of outdated or harmful skills. The method begins with a pre-RL evaluation phase to filter out low-fitness skills, which helps in refining the skill library before reinforcement learning begins. SkillForge demonstrates significant improvements in success rates across various benchmarks while maintaining a compact skill library throughout the training process.'}, 'zh': {'title': 'SkillForge：智能技能管理的强化学习新方法', 'desc': '记忆增强的强化学习提高了大型语言模型（LLM）代理解决复杂长期任务的能力。技能是一种记忆形式，将指令与任务类型的适用条件相结合。然而，随意保留每个技能会导致过时或有害的条目积累，从而误导代理。我们提出了SkillForge，这是一种代理强化学习方法，通过试验、主动、稳定和退休状态的适应性驱动技能生命周期来编译和演化技能库，使技能与模型在训练过程中共同演化。'}}}, {'id': 'https://huggingface.co/papers/2610.07862', 'title': 'A self-learning scientific agent for X-ray diffraction', 'url': 'https://huggingface.co/papers/2610.07862', 'abstract': 'Abstract  A central challenge for scientific agents is to turn analytical experience into reusable expertise grounded in physical evidence. Here we introduce Gan Jiang, a self-learning agent for powder X-ray diffraction built on a diffraction-analysis ecosystem we developed: XMatcher, XQueryer, XDecomposer and WPEM. Together, these engines span phase identification, multiphase decomposition and physics-constrained whole-pattern modelling. Gan Jiang converts analytical experience into executable skills by diagnosing failures, revising skill instructions and code, and validating revisions before reuse, without retraining the language model or changing the underlying physical models. Skills selected using development data and frozen before held-out evaluation achieve higher refinement scores than the original expert-designed skills across FullProf, GSAS-II and PyWPEM. The agent resolves strongly overlapping reflections, quantifies a five-phase ancient Egyptian cosmetic, tracks lattice evolution in an operating battery and compares atomic configurations in a disordered oxide catalyst. On DeltaXRDbench, it leads the evaluated methods in single- and multiphase identification across simulated and experimental data. Without supplied composition, single-phase top-1 accuracies reach 96.30\\%, 81.78\\% and 40.83\\% on MP500, RRUFF and opXRD, respectively, compared with 58.00\\%, 58.47\\% and 26.45\\% for the strongest comparator. These results demonstrate how an integrated scientific tool ecosystem can support agents that extract structural knowledge from measurements while accumulating validated analytical expertise that transfers to new samples.', 'score': 6, 'issue_id': 3386, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '57b8a73ab5a37fb1', 'authors': ['Bin Cao', 'Huichi Zhou', 'Runyu Yang', 'Jingsong Li', 'Shuchen Sun', 'Yan Song', 'Hanyu Gao', 'Zhongwei Yu', 'Tong-Yi Zhang', 'Jun Wang'], 'affiliations': ['AI Lab, The Yangtze River Delta, China', 'Institute of Automation, Chinese Academy of Sciences, China', 'The Hong Kong University of Science and Technology (Guangzhou), China', 'University College London, United Kingdom'], 'pdf_title_img': 'assets/pdf/title_img/2610.07862.jpg', 'data': {'categories': [], 'emoji': '🔬', 'ru': {'title': 'Интеллектуальный агент, который учится анализировать кристаллические структуры из опыта', 'desc': 'Представлена система Gan Jiang — самообучающийся агент для анализа порошковой рентгеновской дифракции, построенный на экосистеме специализированных инструментов для идентификации фаз и моделирования дифракционных картин. Агент преобразует аналитический опыт в переиспользуемые навыки путём диагностики ошибок, пересмотра инструкций и валидации без переобучения языковой модели. Система достигает значительно более высоких показателей точности идентификации фаз по сравнению с экспертными методами на различных датасетах, включая реальные физические измерения и синтетические данные. Демонстрируется практическое применение для анализа сложных многофазных материалов, включая древние косметические средства и батарейные материалы.'}, 'en': {'title': 'Empowering Self-Learning in X-Ray Diffraction Analysis', 'desc': 'This paper presents Gan Jiang, a self-learning agent designed for analyzing powder X-ray diffraction data. It utilizes a suite of tools, including XMatcher and XQueryer, to perform tasks like phase identification and multiphase decomposition. Gan Jiang enhances its analytical skills by diagnosing errors and refining its methods without needing to retrain its underlying models. The agent demonstrates superior performance in identifying phases and quantifying materials, achieving high accuracy rates compared to traditional methods.'}, 'zh': {'title': '智能体Gan Jiang：将分析经验转化为可重用技能', 'desc': '本文介绍了一种名为Gan Jiang的自学习智能体，专门用于粉末X射线衍射分析。它基于我们开发的衍射分析生态系统，包括XMatcher、XQueryer、XDecomposer和WPEM，能够进行相位识别、多相分解和物理约束的全模式建模。Gan Jiang通过诊断失败、修订技能指令和代码，并在重用前验证修订，来将分析经验转化为可执行的技能，而无需重新训练语言模型或更改基础物理模型。该智能体在多个数据集上表现出色，显示了集成科学工具生态系统如何支持提取结构知识并积累经过验证的分析专业知识。'}}}, {'id': 'https://huggingface.co/papers/2610.05336', 'title': 'SheetSage2: Coherent Lead-Sheet Transcription with Synthetic Supervision', 'url': 'https://huggingface.co/papers/2610.05336', 'abstract': 'Abstract  Transcribing music into a human-readable score requires a coherent understanding of rhythm, harmony, melody, and form. Two obstacles limit this goal: annotated recordings are scarce, and accurate local predictions can still produce inconsistent musical sequences. We present SheetSage2, a unified music transcription framework that combines synthetic data, task-specific structured decoding, and autoregressive distillation. Automatically annotated MIDI, rendered into audio, provides scalable supervision across music understanding tasks. Task-specific structured decoders integrate complementary musical cues and their temporal dependencies to produce musically coherent scores. Autoregressive distillation further retains transcription accuracy without task-specific dynamic programming at inference. Across eight benchmark collections, a single SheetSage2-AR model exceeds the listed prior systems on 12 of 15 benchmark--metric pairs in our evaluation, substantially improving over SheetSage1 and surpassing task-specific models on several benchmarks. Model weights and inference code are publicly available.', 'score': 6, 'issue_id': 3386, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'cfaae2593f7335f6', 'authors': ['Junyan Jiang', 'Ruibin Yuan', 'Jiahao Pan', 'Wei Xue', 'Yike Guo', 'Gus Xia', 'Yann LeCun'], 'affiliations': ['ACE Studio', 'MBZUAI', 'Multimodal Art Projection', 'New York University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.05336.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#audio', '#open_source', '#synthetic', '#training'], 'emoji': '🎵', 'ru': {'title': 'Единая модель для согласованной музыкальной транскрипции с синтетическими данными и структурированным декодированием', 'desc': 'SheetSage2 представляет единый фреймворк для автоматической транскрипции музыки в нотную запись, решая проблему нехватки аннотированных данных за счёт синтетических данных на основе MIDI. Модель использует структурированное декодирование, учитывающее музыкальные закономерности и временные зависимости между элементами, чтобы генерировать согласованные и музыкально корректные партитуры. Техника дистилляции авторегрессивной модели позволяет сохранить высокую точность транскрипции без вычислительно сложного динамического программирования во время инференса. Единая модель SheetSage2-AR превосходит специализированные системы на большинстве бенчмарков и значительно улучшает результаты по сравнению с предыдущей версией.'}, 'en': {'title': 'Revolutionizing Music Transcription with SheetSage2', 'desc': 'SheetSage2 is a new framework designed to transcribe music into readable scores by addressing challenges like the lack of annotated recordings and the inconsistency in musical sequences. It utilizes synthetic data and structured decoding to enhance the understanding of rhythm, harmony, and melody. The framework employs autoregressive distillation to maintain high transcription accuracy without needing complex programming during inference. In evaluations, SheetSage2 outperformed previous models, demonstrating significant improvements in music transcription tasks.'}, 'zh': {'title': 'SheetSage2：音乐转录的新突破', 'desc': '本论文介绍了一种名为SheetSage2的音乐转录框架，旨在将音乐转录为人类可读的乐谱。该框架结合了合成数据、特定任务的结构解码和自回归蒸馏技术，以克服注释录音稀缺和局部预测不一致的问题。通过自动注释的MIDI音频，SheetSage2在音乐理解任务中提供了可扩展的监督。实验结果表明，SheetSage2在多个基准测试中超越了之前的系统，显著提高了转录的准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.09450', 'title': 'Iris-3B: Going Beyond the Latent with Pixel-Space Diffusion Training, Conversion and Fine-Tuning', 'url': 'https://huggingface.co/papers/2610.09450', 'abstract': 'Abstract  Pixel-space diffusion models avoid the lossy VAE of latent models, which suggests an advantage on downstream tasks where fine-grained detail matters. We test this claim along both routes to a pixel-space backbone. We pretrain Iris-3B, a 3B-parameter pixel-space text-to-image transformer, from scratch through a 256to512to1024 curriculum, after first ablating the prediction target and representation alignment at 256^2 to decide what to scale. We also convert a pretrained latent model, FLUX.2 Klein base 4B, to pixel space. We fine-tune both families for monocular depth estimation and for image restoration/super-resolution. We find no significant improvement from using a pixel-space generative prior. Fine-tuned for depth with one matched direct-regression recipe, Iris-3B is level with the latent FLUX.2 Klein and the converted pixel FLUX.2 Klein falls behind it, and on 4times DIV2K restoration neither pixel model beats a latent FLUX.2 Klein fine-tune, the converted one trailing it slightly. We document the recipes, the failure modes and the remaining confounds behind this negative result. Nevertheless, Iris-3B shows that pixel-space pretraining with the pixel-transformer (PiT) head of PixelDiT scales to 3B parameters and to text-to-image quality competitive with latent models, matching Qwen-Image on OneIG under the official evaluators at 1024^2. We release its weights and training code in the hope that they help pave the way for further work on pixel-space generation.', 'score': 5, 'issue_id': 3387, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '36a875e0e5c368d8', 'authors': ['Hanqiu Li Cai', 'Chema Garabito'], 'affiliations': ['SperidLabs'], 'pdf_title_img': 'assets/pdf/title_img/2610.09450.jpg', 'data': {'categories': ['#diffusion', '#cv', '#architecture', '#open_source', '#training', '#small_models'], 'emoji': '🖼️', 'ru': {'title': 'Пиксельные диффузионные модели не дают преимуества для downstream задач', 'desc': 'Исследование сравнивает пиксельные и латентные модели диффузии для генерации изображений, проверяя гипотезу о преимуществе пиксельного пространства для задач, требующих высокой детализации. Авторы предварительно обучили трёхмиллиардную пиксельную модель Iris-3B с использованием учебного плана масштабирования и преобразовали предобученную латентную модель FLUX.2 Klein в пиксельное пространство. При дообучении на оценке глубины и восстановлении изображений пиксельные модели не показали значительного улучшения по сравнению с латентными аналогами. Несмотря на отрицательный результат для downstream задач, Iris-3B демонстрирует конкурентоспособное качество генерации текст-в-изображение и масштабируемость пиксельного подхода до 3 млрд параметров.'}, 'en': {'title': 'Unlocking Pixel-Space Potential in Image Generation', 'desc': 'This paper explores the effectiveness of pixel-space diffusion models compared to latent models in machine learning tasks that require high detail, such as image restoration and depth estimation. The authors pretrain a large pixel-space text-to-image transformer called Iris-3B and compare its performance against a converted latent model, FLUX.2 Klein. Despite the initial hypothesis that pixel-space models would outperform latent models, the results show no significant improvement in performance for the tasks tested. However, Iris-3B demonstrates competitive quality in text-to-image generation, suggesting potential for future research in pixel-space generation techniques.'}, 'zh': {'title': '像素空间生成的潜力与挑战', 'desc': '这篇论文探讨了像素空间扩散模型在下游任务中的优势，尤其是在细节处理上。研究中，作者预训练了一个名为Iris-3B的像素空间文本到图像的变换器，并与预训练的潜在模型FLUX.2 Klein进行了比较。尽管在单目深度估计和图像恢复/超分辨率任务中，像素空间生成先验未显示出显著的改进，但Iris-3B在文本到图像质量上与潜在模型相当。作者希望通过发布模型权重和训练代码，促进像素空间生成的进一步研究。'}}}, {'id': 'https://huggingface.co/papers/2610.10460', 'title': 'Composing What Each Teacher Learned: Multi-Teacher On-Policy Distillation through Teacher-Relative Shifts', 'url': 'https://huggingface.co/papers/2610.10460', 'abstract': "Abstract  Multi-teacher on-policy distillation (MOPD) is used in two settings. In common-domain composition, several teachers score each student rollout from one prompt domain and their signals form a single target; in routed-domain distillation, prompts from different domains are assigned to the corresponding specialist. Both settings usually transfer each teacher's endpoint policy, which mixes what post-training changed with preferences inherited from the teacher's base. We introduce Δ-MOPD, which transfers each teacher's teacher-minus-base logit shift re-anchored at the student's frozen initialization, and compare it with endpoint supervision in both settings while holding teacher selection fixed. We first expose the mechanism that impedes endpoint transfer: inherited base pull can exceed the post-training shift. Removing it reduces the teacher-term norm ratio and target--student KL.   Across our experiments, the results suggest that shift targets are particularly useful when teacher signals are combined at a state. With three composed teachers, Δ-MOPD exceeds endpoint composition by 4.11 Math and 1.95 five-benchmark points; with two, it matches endpoint accuracy. Under phased routing, it achieves higher mean performance in both phase orders and reduces the observed order gap from 10.50 to 6.42 points. Under interleaved routing, where each update involves one teacher, the two targets perform comparably. The phased results provide supporting evidence that the benefit may extend to signals accumulated across training phases. Target construction is thus an independent design axis in MOPD, complementary to teacher selection.", 'score': 5, 'issue_id': 3387, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '16c6cad81359dc0a', 'authors': ['Hejian Sang', 'Zhengze Zhou', 'Shayan Mohajer Hamidi', 'Xiaomin Li', 'Rohit Jain', 'Alborz Geramifard'], 'affiliations': ['Harvard University', 'Iowa State University', 'LinkedIn'], 'pdf_title_img': 'assets/pdf/title_img/2610.10460.jpg', 'data': {'categories': ['#transfer_learning', '#rlhf', '#training', '#optimization'], 'emoji': '🧑\u200d🎓', 'ru': {'title': 'Передача разности вместо итога: как правильно дистиллировать знания нескольких учителей', 'desc': 'В статье представлен метод Δ-MOPD для дистилляции знаний от нескольких учителей к студенту на основе policy gradient обучения. Авторы предлагают передавать не финальные policy учителей, а разницу между изменениями, внесёнными при обучении, и исходной базовой моделью, пересчитанную относительно инициализации студента. Такой подход решает проблему нежелательного влияния унаследованных базовых предпочтений учителей, которые могут конфликтовать с новыми знаниями. Экспериментально показано, что shift targets особенно эффективны при композиции сигналов нескольких учителей, обеспечивая улучшение производительности до 4.11 пункта на задачах математики.'}, 'en': {'title': 'Enhancing Student Learning with Targeted Teacher Signals', 'desc': "This paper introduces a new method called Δ-MOPD for multi-teacher on-policy distillation, which improves how student models learn from multiple teacher models. It focuses on two scenarios: common-domain composition, where teachers provide a unified target, and routed-domain distillation, where prompts are directed to specialized teachers. The authors highlight that traditional endpoint transfer can be hindered by inherited biases from teachers, and their method aims to mitigate this by using a logit shift based on the teacher's performance minus their base performance. Experimental results show that Δ-MOPD outperforms traditional methods in accuracy and reduces performance gaps across different training phases."}, 'zh': {'title': '提升教师信号的有效性', 'desc': '多教师在线蒸馏（MOPD）在两种设置中使用：共同领域组合和路由领域蒸馏。在共同领域组合中，多个教师对来自同一提示领域的学生回合进行评分，并形成一个单一目标；而在路由领域蒸馏中，不同领域的提示被分配给相应的专家。我们引入了Δ-MOPD，它在学生的冻结初始化上重新锚定每个教师的教师减去基础的对数偏移，并在两种设置中与端点监督进行比较。实验结果表明，当教师信号在状态下结合时，偏移目标特别有用，Δ-MOPD在多个教师组合中表现优于传统的端点组合。'}}}, {'id': 'https://huggingface.co/papers/2610.10164', 'title': 'UniSkill: Learning Actor-Aligned Skill Proposals for an Evolving Policy', 'url': 'https://huggingface.co/papers/2610.10164', 'abstract': "Abstract  Large language model agents can improve across tasks by retaining reusable skills distilled from prior interactions. Recent work jointly optimizes task execution and skill extraction, enabling the policy and skillbank to co-evolve. However, as the actor continues learning, rewarding skill proposals through their reuse in subsequent training steps may conflate skill benefits with actor improvement, while directly testing each proposed skill requires costly additional actor rollouts. In this paper, we introduce UniSkill, which uses a shared policy to interact with the environment and propose skillbank edits (Add, Update, or No Edit) from the resulting trajectories. Specifically, the actor learns from environment rewards, while contrastive action feedback guides skill proposal learning. This feedback provides an actor-alignment signal by measuring how replacing the retrieved skill with a proposed skill changes the current actor's action log-likelihood gap between previously collected successful and failed trajectories from the same task, thereby avoiding new rollouts for each proposal. Since proposal-level feedback may suppress an otherwise appropriate edit operation when the proposed skill content scores poorly, we further apply skill-edit support regularization to preserve exploration. Empirically, UniSkill achieves strong performance, reaching 98.4% success on ALFWorld and 84.7% on WebShop while maintaining stable joint training. Further ALFWorld experiments show that UniSkill remains effective when the shared policy uses a smaller backbone. Our implementation is available at https://github.com/LimOkii/UniSKill.", 'score': 5, 'issue_id': 3386, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '83a3058572905ea7', 'authors': ['Yifei Lu', 'Cheng Liu', 'Dianzhi Yu', 'Hui Xiang', 'Ji Zhang', 'Yuanchu Xiao', 'Rong Liang'], 'affiliations': ['Ant Group, Hangzhou, China', 'Qiantang Credit, Hangzhou, China', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.10164.jpg', 'data': {'categories': ['#optimization', '#agents', '#rl', '#open_source', '#training'], 'emoji': '🎯', 'ru': {'title': 'Совместное обучение политики и навыков через контрастивную обратную связь без дополнительных взаимодействий', 'desc': 'В статье предлагается UniSkill — метод обучения агентов на основе больших языковых моделей, который позволяет накапливать переиспользуемые навыки из предыдущих взаимодействий. Ключевая идея заключается в использовании единой политики для взаимодействия с окружением и предложения изменений в хранилище навыков (добавление, обновление или отсутствие изменений), при этом агент обучается на наградах окружения, а предложения навыков направляются контрастивной обратной связью на основе действий. Контрастивная обратная связь оценивает, как замена извлечённого навыка предложенным навыком влияет на зазор функции логарифма вероятности действий актора между успешными и неудачными траекториями, избегая дорогостоящих новых взаимодействий. Метод достигает 98.4% успеха на ALFWorld и 84.7% на WebShop, демонстрируя эффективность совместного обучения политики и хранилища навыков без дополнительных вычислительных затрат.'}, 'en': {'title': 'Enhancing Learning with Reusable Skills in Language Models', 'desc': "This paper presents UniSkill, a method for improving large language model agents by allowing them to learn and propose reusable skills from their interactions with the environment. UniSkill uses a shared policy to suggest edits to a skillbank based on the agent's experiences, optimizing both task execution and skill extraction simultaneously. The approach employs contrastive action feedback to evaluate skill proposals without requiring additional costly rollouts, thus streamlining the learning process. The results demonstrate that UniSkill achieves high success rates in various tasks while ensuring stable joint training, even with a smaller model backbone."}, 'zh': {'title': 'UniSkill：共享策略下的技能优化', 'desc': '本文介绍了一种名为UniSkill的模型，旨在通过共享策略与环境互动来优化技能提议。UniSkill通过对环境奖励的学习和对比动作反馈来指导技能提议的学习，从而避免了每次提议都需要额外的演员回合。该方法通过测量替换技能对演员行为的影响，提供了对齐信号，确保了技能提议的有效性。实验结果表明，UniSkill在多个任务上表现出色，成功率高达98.4%。'}}}, {'id': 'https://huggingface.co/papers/2610.10533', 'title': 'EngramEdit: Decoupled Knowledge Updates in LLMs through Conditional Memory', 'url': 'https://huggingface.co/papers/2610.10533', 'abstract': "Abstract  Conditional memory architectures such as DeepSeek Engram use input n-grams to look up learned embeddings, expanding the capacity of large language models (LLMs) with limited additional computation. Beyond model scaling, this architecture has demonstrated the potential to decouple factual knowledge storage from general-purpose computation, offering a promising route to updating factual knowledge while keeping the Transformer backbone fixed. Realizing this potential is challenging because different expressions of a fact may activate different n-gram embeddings, while updating shared embeddings can unintentionally change the model's predictions about other facts. We propose EngramEdit for decoupled knowledge updates through conditional memory. EngramEdit first computes target memory representations that make the model predict the updated fact across multiple expressions. It then jointly updates the shared n-gram embeddings to match these targets across expressions and edits, penalizing updates to frequently reused embeddings more strongly to preserve unrelated knowledge. Experiments show that EngramEdit enables independent factual knowledge updates through conditional memory, achieving near-perfect editing success. Revised knowledge is usable across unseen expressions and in multi-hop reasoning, with nearly three times the strongest baseline's accuracy under chain-of-thought (CoT) prompting. Unrelated knowledge and general capabilities are largely preserved even as factual updates accumulate. These findings show that EngramEdit turns conditional memory into an editable knowledge interface, extending its role beyond model scaling to support decoupled knowledge updates.", 'score': 4, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'cad2725f50d5d1f5', 'authors': ['Hongru Cai', 'Ran Wei', 'Wenjie Wang', 'Chengfa Wu', 'Ning Song', 'Yongqi Li', 'Wenjie Li'], 'affiliations': ['Hangzhou Diagens Biotechnology Co., Ltd', 'The Hong Kong Polytechnic University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.10533.jpg', 'data': {'categories': ['#training', '#architecture'], 'emoji': '📝', 'ru': {'title': 'Редактирование фактических знаний через условную память без переобучения', 'desc': 'В статье предлагается метод EngramEdit для обновления фактических знаний в больших языковых моделях, которые используют условную архитектуру памяти на основе n-грамм. Авторы решают проблему того, что одного факта можно выразить разными способами, активирующими разные эмбеддинги, и что обновление общих эмбеддингов может случайно изменить предсказания модели о других фактах. Метод вычисляет целевые представления памяти и совместно обновляет эмбеддинги n-грамм, штрафуя изменения часто используемых эмбеддингов для сохранения несвязанных знаний. Экспериментальные результаты показывают, что EngramEdit достигает почти идеального успеха в редактировании фактов с сохранением других знаний и способности модели к многошаговым рассуждениям.'}, 'en': {'title': 'Editable Knowledge Updates in Language Models', 'desc': 'The paper introduces EngramEdit, a method for updating factual knowledge in large language models (LLMs) using conditional memory architectures like DeepSeek Engram. This approach allows the model to maintain its general capabilities while enabling independent updates to factual knowledge without altering unrelated information. EngramEdit achieves this by computing target memory representations for various expressions of a fact and updating shared n-gram embeddings accordingly, with a focus on preserving frequently reused embeddings. The results demonstrate that EngramEdit can effectively edit knowledge while maintaining high accuracy in reasoning tasks, showcasing its potential as an editable knowledge interface.'}, 'zh': {'title': 'EngramEdit：独立更新知识的条件记忆架构', 'desc': '本文提出了一种名为EngramEdit的条件记忆架构，用于独立更新事实知识。该方法通过计算目标记忆表示，使模型能够在多种表达方式下预测更新后的事实。EngramEdit还联合更新共享的n-gram嵌入，同时对频繁使用的嵌入施加更强的惩罚，以保护无关知识。实验结果表明，EngramEdit能够实现接近完美的编辑成功率，并在多跳推理中保持较高的准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.03799', 'title': 'StepCAD: Mesh-to-CAD Code Generation via LLM Policy and Geometry-Guided Search', 'url': 'https://huggingface.co/papers/2610.03799', 'abstract': 'Abstract  Recovering executable CAD programs from 3D meshes is challenging due to the compositional nature of CAD construction and the interaction between discrete modeling choices and continuous parameters. Many learning-based methods predict complete programs in a single pass and rely predominantly on sketch-extrude representations, limiting operation diversity and opportunities to correct geometric errors during reconstruction. We introduce StepCAD, a generative optimization approach that combines a state-conditioned CAD policy with geometry-guided search. Given an input mesh, the policy predicts construction actions conditioned on both target and intermediate geometry, and an IoU-guided tree search refines the resulting program through local edits. We also introduce ARCADE-1.5M, a large-scale dataset of 1.5M executable CAD programs spanning diverse operations, sequences with a maximum length of 150+ counted operations, and 12.5M intermediate state-action transitions. Experiments across multiple CAD reconstruction benchmarks show that StepCAD achieves state-of-the-art geometric reconstruction accuracy with consistently high validity, yielding up to 87.2% relative IoU improvement over the strongest evaluated baseline, with particularly large gains on complex shapes. Project page: https://ghadinehme.com/stepcad.github.io/', 'score': 3, 'issue_id': 3386, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'a870528e969cfb95', 'authors': ['Ghadi Nehme', 'Faez Ahmed'], 'affiliations': ['Massachusetts Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.03799.jpg', 'data': {'categories': ['#benchmark', '#3d', '#dataset'], 'emoji': '🏗️', 'ru': {'title': 'Пошаговое восстановление CAD программ через кондиционированную политику и поиск по геометрии', 'desc': 'В работе предложен StepCAD — генеративный подход оптимизации для восстановления исполняемых CAD программ из 3D сеток. Метод использует state-conditioned политику, которая предсказывает действия конструирования, учитывая как целевую геометрию, так и промежуточные состояния, а затем уточняет программу через управляемый геометрией поиск по дереву. Авторы представили ARCADE-1.5M — большой датасет из 1.5 миллионов CAD программ с разнообразными операциями и более чем 150 операциями в последовательности. Экспериментальные результаты показывают, что StepCAD достигает state-of-the-art точности геометрической реконструкции с улучшением IoU на 87.2% относительно базовых методов, особенно на сложных формах.'}, 'en': {'title': 'StepCAD: Revolutionizing CAD Program Recovery from 3D Meshes', 'desc': 'This paper presents StepCAD, a novel approach for converting 3D meshes into executable CAD programs. Unlike traditional methods that predict entire programs at once, StepCAD uses a generative optimization strategy that incorporates a state-conditioned policy and a geometry-guided search. This allows for more diverse operations and the ability to correct geometric errors during the reconstruction process. The authors also introduce a large dataset, ARCADE-1.5M, which contains a wide variety of CAD programs to support their experiments, demonstrating significant improvements in reconstruction accuracy.'}, 'zh': {'title': 'StepCAD：高效的3D CAD程序恢复方法', 'desc': '本论文提出了一种名为StepCAD的方法，用于从3D网格恢复可执行的CAD程序。该方法结合了状态条件的CAD策略和几何引导搜索，能够在考虑目标和中间几何的基础上预测构建操作。通过局部编辑，IoU引导的树搜索进一步优化生成的程序。实验结果表明，StepCAD在几何重建精度上达到了最先进的水平，尤其在复杂形状上表现出显著的改进。'}}}, {'id': 'https://huggingface.co/papers/2610.10388', 'title': 'RoboQuest: Generalist Physical Agents that Search, Inspect and Test', 'url': 'https://huggingface.co/papers/2610.10388', 'abstract': 'Abstract  Recent advances in multimodal foundation models have made them capable generalist physical agents for a range of manipulation tasks. However, successful operation in an unfamiliar environment may require an agent to seek task-relevant information through interaction when it is absent from the observations: it may need to determine where a relevant object is, inspect an unobserved property, or discover the effect of an unfamiliar tool. We thus introduce RoboQuest, a benchmark for goal-directed embodied exploration, where agents must actively acquire task-relevant information through physical interaction, use the resulting evidence to adapt subsequent actions, and autonomously decide when to commit to task completion. RoboQuest comprises ten mobile manipulation tasks centered on three forms of uncertainty: search, manipulation-based inspection, and interactive testing. We evaluate five frontier multimodal agents through a common visuomotor interface, as well as a π_{0.5} policy fine-tuned on the full-episode demonstrations we release. The best agent succeeds in only 23\\% of the episodes, and the fine-tuned policy almost never succeeds. Isolated tests of the execution skills the tasks are built from, with the hidden information supplied, show that the agents can carry out most of the required actions, and our failure analysis attributes only a minority of the failures to execution. Our failure analysis further finds that the agents often stop exploring too early as they make decisions before observing the required evidence for task completion. We also find that agents rarely prevent or repair the disturbances caused by their exploration. Moreover, learning by trial and error remains difficult for most models.', 'score': 3, 'issue_id': 3385, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '0db7cbd27e110190', 'authors': ['Liu Renhang', 'Navonil Majumder', 'Tej Deep Pala', 'Soujanya Poria'], 'affiliations': ['Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2610.10388.jpg', 'data': {'categories': ['#games', '#agents', '#dataset', '#robotics', '#multimodal', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Активное исследование окружения для робототехники через физическое взаимодействие', 'desc': 'Статья представляет RoboQuest — бенчмарк для оценки способности мультимодальных foundation models к целенаправленной исследовательской деятельности в физическом мире. Агенты должны активно собирать информацию, релевантную для выполнения задачи, путем взаимодействия с окружением, и адаптировать свои действия на основе полученных данных. Бенчмарк включает десять задач мобильной манипуляции, сфокусированных на трех типах неопределенности: поиск объектов, инспекция скрытых свойств и интерактивное тестирование инструментов. Анализ результатов показал, что лучшие агенты решают лишь 23% эпизодов, так как часто прекращают исследование преждевременно и не могут эффективно обучаться методом проб и ошибок.'}, 'en': {'title': 'RoboQuest: Empowering Agents to Explore and Adapt in Uncertain Environments', 'desc': 'This paper introduces RoboQuest, a benchmark designed to evaluate multimodal foundation models as physical agents in goal-directed exploration tasks. The focus is on how these agents can actively seek out information through interaction when it is not readily available in their observations. The study highlights the challenges faced by agents, such as premature decision-making and difficulties in learning from trial and error, which hinder their performance in completing tasks. The evaluation of various agents reveals that while they can perform individual actions well, their overall success in complex tasks remains low due to issues with exploration and adaptation.'}, 'zh': {'title': 'RoboQuest：主动探索与任务完成的挑战', 'desc': '最近，多模态基础模型的进展使其能够作为通用的物理代理执行多种操作任务。然而，在不熟悉的环境中成功操作可能需要代理通过交互获取与任务相关的信息。我们引入了RoboQuest，这是一个以目标为导向的身体探索基准，代理必须通过物理交互主动获取任务相关信息，并根据获得的证据调整后续行动。我们的分析发现，代理在探索过程中常常过早停止，导致任务完成的决策缺乏必要的证据。'}}}, {'id': 'https://huggingface.co/papers/2610.05324', 'title': 'CoDance: Learning Reactive and Compliant Human-Humanoid Interaction from Video', 'url': 'https://huggingface.co/papers/2610.05324', 'abstract': "Abstract  Partnered human-humanoid interaction couples locomotion with continuous physical contact. A humanoid needs to coordinate with a person's motion while responding to interaction forces and maintaining stable and natural movement. We present CoDance, a framework for learning reactive and compliant human-humanoid interaction from video. We study partnered dancing as a challenging instantiation, where a humanoid coordinates its footsteps with a moving partner and maintains continuous two-hand contact. Given a single video of two human dancers, CoDance retargets their motions into a robot reference and a moving partner. We introduce a multi-link compliance augmentation that transforms the kinematic demonstration into force-aware training data by adapting the robot reference under structured forces at both hands. Policies trained on this data follow the observed partner while preserving the demonstrated locomotion style and responding compliantly to physical interaction. In simulation, the policies adapt their footsteps to changes in the partner and reproduce approximately 80% of the wrist displacement encoded by the augmented demonstrations. On a physical humanoid, CoDance enables sustained two-hand dancing with a human partner including repeated transitions between forward and backward motions.", 'score': 2, 'issue_id': 3387, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '1d1b7e6c13edc73b', 'authors': ['Zhuoqun Chen', 'Shucheng Jia', 'Boyuan Chen'], 'affiliations': ['Duke University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05324.jpg', 'data': {'categories': ['#video', '#robotics', '#training'], 'emoji': '💃', 'ru': {'title': 'Робот, танцующий в ритме: обучение послушному взаимодействию через видео', 'desc': 'В работе представлена система CoDance для обучения гуманоидного робота взаимодействию с человеком на основе видео. Авторы используют демонстрации партнёрских танцев, где робот должен синхронизировать своё движение с движением человека, сохраняя контакт двумя руками и стабильность локомоции. Ключевой инновацией является техника multi-link compliance augmentation, которая преобразует кинематическую демонстрацию в данные, учитывающие силовое взаимодействие в суставах рук. Обученные политики робота адаптируют свои движения к изменениям в поведении партнёра, воспроизводя наблюдаемый стиль локомоции и реагируя на физические силы, достигая примерно 80% точности воспроизведения движений.'}, 'en': {'title': 'CoDance: Learning Humanoid Interaction Through Dance', 'desc': "The paper introduces CoDance, a framework designed for teaching humanoid robots to interact with humans through partnered dancing. It focuses on learning how to coordinate movements and respond to physical forces while maintaining a natural interaction. By using video of human dancers, CoDance retargets their motions to a robot, allowing it to adapt its movements in real-time. The framework incorporates a multi-link compliance augmentation to create training data that helps the robot learn to follow a partner's movements while preserving the style of locomotion and responding to physical contact."}, 'zh': {'title': '人机舞蹈：自然互动的新境界', 'desc': '本论文介绍了一种名为CoDance的框架，用于从视频中学习人类与类人机器人之间的互动。该框架特别关注于伴随舞蹈的场景，类人机器人需要协调步伐并保持与人类舞者的双手接触。通过将人类舞者的动作转化为机器人参考，CoDance能够在物理互动中保持自然的运动风格。实验表明，经过训练的策略能够适应舞伴的变化，并在物理类人机器人上实现持续的双手舞蹈。'}}}, {'id': 'https://huggingface.co/papers/2609.36995', 'title': 'Salt++: Context-Aligned Post-Training for Few-Step Streaming Multimodal Generation', 'url': 'https://huggingface.co/papers/2609.36995', 'abstract': 'Abstract  Few-step streaming audio--video generation requires both causal modeling and step distillation, yet standard training recipes face two context-related challenges. Teacher forcing pairs clean history with a noisy target, but supervises predictive contextual representations only indirectly through velocity prediction. Meanwhile, directly reusing bidirectional score models in causal Distribution Matching Distillation (DMD) creates a mismatch between generation and scoring contexts. We address these challenges with Salt++, a two-stage post-training framework comprising Causal Self-Flow (CSF) and context-aligned autoregressive DMD. CSF exploits contextual information asymmetry by varying the history while keeping the noisy target fixed: a noise-mixed-history student aligns its intermediate representations with those of a clean-history exponential-moving-average teacher. This self-supervised signal encourages the student to extract semantic information and improves cross-modal alignment. Context-aligned AR DMD shares the causal mask and prefix across generator sampling, fake-score training, and real-score evaluation to match generated and reference distributions under a block-conditional KL objective. With calibrated teacher guidance, it performs clean-prefix few-step distillation and then adapts to generated histories without switching objectives or requiring separate consistency distillation. At 480p, Salt++ improves visual and motion quality by 57% and 45% over OmniForcing on JavisBench under the same 4-step causal setting. A separate scale-wise post-training stage extends Salt++ to 4-step 1664times960 generation, outperforming bidirectional LTX-2 on six of seven reported metrics. Project page: https://xingtongge.github.io/Saltpp', 'score': 2, 'issue_id': 3386, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '7d71fcaf93551628', 'authors': ['Xingtong Ge', 'Yutong Wang', 'Lunjie Zhu', 'Haitao Lin', 'Fangyu Lin', 'Yushi Huang', 'Xin Zhang', 'Yi Zhang', 'Yu Liu', 'Jun Zhang'], 'affiliations': ['The Hong Kong University of Science and Technology', 'The University of Sydney', 'Vivix Group Limited', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2609.36995.jpg', 'data': {'categories': ['#multimodal', '#optimization', '#audio', '#video', '#training', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Согласованное дистиллирование для причинной генерации видео', 'desc': 'В статье представлен Salt++, двухэтапный фреймворк для улучшения генерации аудио-видео за несколько шагов с помощью причинного моделирования. Авторы решают проблему асимметрии контекста, предложив метод Causal Self-Flow, где студент выравнивает свои представления с экспоненциально усреднённым учителем, используя зашумленную историю. Второй компонент - context-aligned autoregressive Distribution Matching Distillation - согласует маски и префиксы между генерацией и оценкой, используя block-conditional KL цель для правильного распределения. Экспериментальные результаты показывают значительное улучшение качества видео и движения при малом числе шагов генерации.'}, 'en': {'title': 'Enhancing Audio-Video Generation with Salt++ Framework', 'desc': "This paper introduces Salt++, a two-stage framework designed to improve few-step streaming audio-video generation by addressing challenges in causal modeling and step distillation. It employs Causal Self-Flow (CSF) to enhance the learning process by aligning a student's representations with a teacher's clean history, thus improving semantic extraction and cross-modal alignment. Additionally, the context-aligned autoregressive Distribution Matching Distillation (DMD) ensures that the generation and scoring contexts are consistent, leading to better performance in generating high-quality outputs. The results show significant improvements in visual and motion quality, demonstrating the effectiveness of the proposed methods over existing approaches."}, 'zh': {'title': 'Salt++：提升音视频生成质量的新方法', 'desc': '这篇论文提出了一种名为Salt++的两阶段后训练框架，用于解决少步流媒体音视频生成中的因果建模和步骤蒸馏问题。通过Causal Self-Flow (CSF)，该方法利用上下文信息的不对称性，调整历史数据以提高学生模型的语义信息提取能力。接着，使用上下文对齐的自回归分布匹配蒸馏（AR DMD），确保生成和评分上下文的一致性，从而优化生成质量。实验结果表明，Salt++在480p分辨率下的视觉和运动质量分别提高了57%和45%。'}}}, {'id': 'https://huggingface.co/papers/2610.02368', 'title': 'Rethinking World-Action Model for Compositional and In-Context Robotic Manipulation', 'url': 'https://huggingface.co/papers/2610.02368', 'abstract': 'Abstract  Long-horizon compositional manipulation has become increasingly important for real-world robot deployment, where a single task involves multiple coordinated subtasks. Existing world-action models (WAMs) jointly predict short-horizon visual futures and actions, but typically lack explicit subtask-level reasoning. We propose Visual Goal-conditioned Action Reasoning (ViGAR), a hierarchical framework that factorizes manipulation into a visual subgoal planner and a subgoal executor. Given the current observation and global instruction, the subgoal planner predicts a visual subgoal for the next subtask. The subgoal executor then jointly generates future visual trajectories and actions conditioned on the predicted subgoal. Both components share a pretrained world-model representation, enabling task-level planning and action generation to benefit from common physical knowledge. Moreover, our framework naturally supports in-context learning: using a global goal image as context can induce different subtask decompositions and behaviors without parameter updates. On the RoboTwin Clean2Random benchmark, ViGAR achieves 82.00% and 67.02% success rates under the Clean and Random settings, respectively, surpassing the strongest baseline by 12.86 percentage points in average success rate. Real-world robot experiments on five compositional and two in-context learning tasks further confirm the effectiveness of ViGAR.', 'score': 2, 'issue_id': 3385, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd3e455cb9cb38b9b', 'authors': ['Shukai Gong', 'Xuanran Zhai', 'Yintianrun Zhang', 'Ruopeng Cui', 'Ye Huang', 'Yiyang Fu', 'Dexuan Lyu', 'Chaojie Li', 'Xinyi Song', 'Peiwen Lin', 'Chuang Wang', 'Mingyuan Jia', 'Yufan Deng', 'Jiaxin Fang', 'Bo Liang', 'Jiaxin Li', 'Yuxiang Gao', 'Hao Liu', 'Daquan Zhou'], 'affiliations': ['AgiBot', 'CocoMatrix', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02368.jpg', 'data': {'categories': ['#cv', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Иерархическое управление роботом через визуальные подцели', 'desc': 'В работе предложена иерархическая система ViGAR для управления роботом при выполнении сложных многоэтапных задач манипуляции. Система разделяет процесс на две компоненты: планировщик визуальных подцелей, который предсказывает промежуточные визуальные ориентиры, и исполнитель подцелей, генерирующий траектории и управляющие команды. Обе компоненты используют общее представление предварительно обученной модели мира, что позволяет совместно улучшать планирование и генерацию действий на основе физических законов. Система поддерживает контекстное обучение, позволяя менять стратегию разбиения задачи на подтаски без переобучения параметров.'}, 'en': {'title': 'Hierarchical Action Reasoning for Smart Robot Manipulation', 'desc': 'This paper introduces Visual Goal-conditioned Action Reasoning (ViGAR), a new framework for robotic manipulation that breaks down complex tasks into manageable subtasks. ViGAR consists of a visual subgoal planner that predicts the next visual target based on the current observation and a subgoal executor that generates actions and visual trajectories. By sharing a pretrained world-model representation, both components enhance their planning and execution capabilities through common physical knowledge. The framework also allows for in-context learning, enabling robots to adapt their behavior based on different global goals without needing to retrain the model.'}, 'zh': {'title': '层次化操作，智能机器人新选择', 'desc': '本文提出了一种名为视觉目标条件动作推理（ViGAR）的层次框架，用于长时间的组合操作。该框架将操作分解为视觉子目标规划和子目标执行两个部分，能够在给定当前观察和全局指令的情况下预测下一个子任务的视觉子目标。子目标执行器则根据预测的子目标生成未来的视觉轨迹和动作。ViGAR在RoboTwin Clean2Random基准测试中表现优异，成功率显著高于现有的最强基线，验证了其在实际机器人任务中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.09457', 'title': 'DSReg: Provably Recovering Individual World Latents without Reconstruction', 'url': 'https://huggingface.co/papers/2610.09457', 'abstract': 'Abstract  Methods that recover individual latent variables of the world, from nonlinear ICA to dictionary learning and causal representation learning, anchor the latents to observations through reconstruction, auxiliary supervision, or distributional asymmetries such as non-Gaussianity. Methods without these anchors, including joint-embedding predictive architectures (JEPAs), identify the latent state only up to a linear transformation, so individual latents remain mixed. We close this gap: individual world latents can be provably recovered with no reconstruction, no decoder, and no labels. The key condition is Structural Diversity: different latents leave distinct dependency footprints on observations, just as no two snowflakes are alike. Building on the linear identifiability that LeJEPA provides, we prove that under Structural Diversity, DSReg (Dependency-Sparsity Regularization) recovers individual world latents up to signed permutation, without reconstruction or a decoder. It applies post hoc to any linearly identified representation, reusing trained checkpoints at no loss over joint training, and establishes the first fully identifiable JEPA that recovers every world latent. Moreover, as a condition on dependency footprints, Structural Diversity is strictly weaker than all structural conditions of prior identifiable latent variable models. Across synthetic regimes, world model probes, learned visual encoders, and external renderers, DSReg preserves dense prediction while improving individual-latent recovery and downstream use with scales.', 'score': 1, 'issue_id': 3387, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '79f8384a7f869926', 'authors': ['Yujia Zheng', 'David Klindt', 'Randall Balestriero', 'Bernhard Schölkopf'], 'affiliations': ['Brown University', 'Cold Spring Harbor Laboratory', 'ELLIS Institute Tubingen', 'Max Planck Institute for Intelligent Systems', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.09457.jpg', 'data': {'categories': ['#interpretability', '#architecture', '#training'], 'emoji': '❄️', 'ru': {'title': 'Каждая скрытая переменная имеет свой уникальный отпечаток', 'desc': 'В работе предложен метод для восстановления отдельных скрытых переменных мира без использования реконструкции или разметки данных. Ключевое условие — Structural Diversity: каждая скрытая переменная оставляет уникальный отпечаток зависимостей в наблюдениях. Авторы вводят DSReg (Dependency-Sparsity Regularization), который может быть применён к любому представлению, полученному методом LeJEPA, и гарантирует идентифицируемость всех скрытых переменных с точностью до перестановки знаков. Метод работает как постобработка существующих моделей и показывает улучшение восстановления скрытых переменных и качества на различных задачах.'}, 'en': {'title': 'Unlocking Individual Latents with Structural Diversity', 'desc': 'This paper introduces a new method for recovering individual latent variables in machine learning without relying on reconstruction or labels. The authors propose a concept called Structural Diversity, which ensures that different latent variables have unique effects on observations, allowing for their identification. They present Dependency-Sparsity Regularization (DSReg), which can be applied to any linearly identified representation to recover individual latents effectively. The method shows improved performance in various applications, demonstrating that it can enhance the recovery of latent variables while maintaining prediction accuracy.'}, 'zh': {'title': '无重建恢复个体潜在变量的创新方法', 'desc': '本文提出了一种新方法，可以在没有重建、解码器或标签的情况下恢复个体潜在变量。关键条件是结构多样性，不同的潜在变量在观察中留下独特的依赖足迹。通过依赖稀疏正则化（DSReg），我们证明在结构多样性条件下，可以恢复个体世界潜在变量。该方法适用于任何线性识别的表示，并在合成环境、世界模型探测器和学习的视觉编码器中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2610.07258', 'title': 'Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents', 'url': 'https://huggingface.co/papers/2610.07258', 'abstract': "Abstract  Enterprise AI agents that share a memory store face two unaddressed risks: sensitive data can leak through legitimately computed results the requester could not derive, and departments can silently compute a same-named key performance indicator (KPI) through conflicting logic. Existing agent-memory systems (e.g., MemGPT, Zep, A-MEM) gate retrieval by content, ownership, and role, not derivation, missing a cached insight that embeds a forbidden column. We introduce the Analytical Memory Unit (AMU), a memory schema that attaches a full derivation (lineage) graph to every cached result, gated by a retrieval policy that serves a hit only when the requester is authorised for every column touched. Provided lineage recording is complete, we prove by construction that the policy blocks retrieval of results derived from a sensitive column outside the requester's permissions, at O(n) worst case -- a conditional design guarantee, not an empirical claim, that excludes derived features encoding sensitive information without naming their source. Eliminating measured leakage required 75-90% recorded lineage completeness, so we treat 90% as a conservative deployment target. Across six experiments, lineage-gated retrieval removes the 18.8-25.5% cross-department leakage naive content-gated memory suffers, keeping 81.5-82.6% of memory reuse at 13.8 microsecond worst-case overhead. A real-agent proof-of-concept with LLM-generated SQL is consistent with the guarantee: zero leaks over 9 round-trips, two conflicts caught automatically -- though a feasibility demonstration, not evidence of production viability. This offers a practical governance layer for shared agent memory, complementing source-layer access control and supporting EU AI Act compliance.", 'score': 1, 'issue_id': 3387, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '1f32e5101e2a0d1f', 'authors': ['Venkata M Sangaraju', 'Sudhir Vissa'], 'affiliations': ['Independent Researcher', 'SAGE7 AI, Georgetown, Texas, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.07258.jpg', 'data': {'categories': ['#security', '#data', '#leakage', '#agents'], 'emoji': '🔐', 'ru': {'title': 'Защита чувствительных данных в общей памяти AI агентов через граф происхождения результатов', 'desc': 'Статья представляет Analytical Memory Unit (AMU) — новую архитектуру памяти для enterprise AI агентов, которая решает проблему утечки чувствительных данных через кэшированные результаты вычислений. Система прикрепляет граф происхождения (lineage graph) к каждому сохранённому результату и использует политику доступа, которая разрешает извлечение данных только если запросчик авторизован для всех столбцов, использованных при вычислении. Авторы доказывают, что при полной записи lineage такая политика блокирует утечку результатов, полученных из защищённых данных, с гарантией на уровне дизайна, а не только эмпирически. Экспериментальная оценка показывает, что lineage-based gating устраняет 18.8-25.5% утечек между подразделениями, сохраняя 81.5-82.6% переиспользования памяти с минимальной задержкой.'}, 'en': {'title': 'Secure Memory Retrieval with Lineage-Gated Access', 'desc': "This paper addresses the risks of sensitive data leakage and conflicting logic in enterprise AI agents that share a memory store. It introduces the Analytical Memory Unit (AMU), which enhances memory retrieval by attaching a lineage graph to each cached result, ensuring that only authorized users can access sensitive data. The AMU's retrieval policy effectively blocks access to results derived from sensitive columns outside a requester's permissions, achieving a significant reduction in data leakage. Experimental results demonstrate that lineage-gated retrieval can maintain high memory reuse while preventing cross-department data leaks, providing a governance layer for shared AI memory systems."}, 'zh': {'title': '分析内存单元：保护企业AI的敏感数据', 'desc': '本文提出了一种新的内存架构，称为分析内存单元（AMU），旨在解决企业AI代理在共享内存存储时面临的敏感数据泄露和逻辑冲突问题。AMU通过为每个缓存结果附加完整的推导图，确保只有在请求者被授权访问所有相关列时，才能检索结果。研究表明，记录完整的推导信息可以有效阻止敏感数据的泄露，且在多个实验中，AMU显著减少了跨部门的数据泄露。该方法为共享代理内存提供了实用的治理层，支持合规性要求。'}}}, {'id': 'https://huggingface.co/papers/2609.38466', 'title': 'PAMI: Part Anchored Motion for Text to Human-Object Interaction Generation', 'url': 'https://huggingface.co/papers/2609.38466', 'abstract': 'Abstract  Text-conditioned full-body human-object interaction (HOI) generation requires synthesizing human motion and object trajectories that match the input text while remaining precisely coordinated over time. Most methods represent the human and object as separate trajectories and predict the global human-object couplings. Learning this complex, dynamically changing relationship implicitly, however, often yields object drift, missed contact, and penetration. We introduce PAMI, a Part-Anchored Motion framework for Interaction generation. Inspired by the classic Hough Transform, our key idea is to localize object motion by letting body-part anchors vote for it: we express object motion relative to multiple body-part anchors and use PamiVAE to learn an interaction latent space, decoding frame-wise weights that aggregate these part-specific votes. Building on this representation, PAMI generates interactions in a coarse-to-fine hierarchy. PamiGen first generates a coarse human-object interaction from text in this structured latent space, and PamiRefiner then recursively resolves fine-grained contact geometry using a hybrid surface-sensing representation, combining long-range probes that capture overall body-part influence with short-range sensors that resolve detailed contacts near the object surface. Experiments on InterAct show that PAMI generates more faithful interactions and more accurate human-relative object motion than previous methods, achieving 14.5% higher contact recall than the previous state of the art. Extensive ablations validate the contributions of both the part-anchored voting representation and hybrid surface-sensing refinement.', 'score': 1, 'issue_id': 3387, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '1ff462acb0dfc5e2', 'authors': ['Chuqiao Li', 'Xianghui Xie', 'Yong Cao', 'Andreas Geiger', 'Gerard Pons-Moll'], 'affiliations': ['Max Planck Institute for Informatics, Saarland Informatics Campus, Germany', 'Tubingen AI Center, University of Tubingen, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2609.38466.jpg', 'data': {'categories': ['#cv', '#multimodal', '#architecture'], 'emoji': '🤝', 'ru': {'title': 'Якорный подход к синтезу реалистичного взаимодействия человека с объектами через текст', 'desc': 'Статья представляет PAMI, фреймворк для генерации взаимодействия человека и объекта на основе текста, используя часть-якорный подход, вдохновленный преобразованием Хафа. Основная идея заключается в локализации движения объекта посредством голосования якорей различных частей тела, что выражает траекторию объекта относительно нескольких точек опоры. Модель использует VAE для обучения пространства взаимодействия с последующей иерархической генерацией от грубого к точному уровню детализации. Гибридное представление с долгодействующими и короткодействующими датчиками позволяет разрешать как общее влияние тела, так и детальные контакты с объектом, достигая значительного улучшения в точности генерируемых взаимодействий.'}, 'en': {'title': 'PAMI: Precision in Human-Object Interaction Generation', 'desc': 'The paper presents PAMI, a Part-Anchored Motion framework designed for generating human-object interactions based on text input. It addresses the challenges of traditional methods that treat human and object trajectories separately, which can lead to issues like object drift and missed contacts. PAMI innovatively uses body-part anchors to localize object motion, allowing for a more accurate representation of interactions. The framework employs a two-step process, first generating a coarse interaction and then refining it to ensure precise contact geometry, resulting in improved performance over existing methods.'}, 'zh': {'title': 'PAMI：精准的人物与物体交互生成框架', 'desc': '本文提出了一种名为PAMI的框架，用于生成文本条件下的全身人类与物体交互。该方法通过将物体运动相对于多个身体部位锚点进行定位，解决了传统方法中存在的物体漂移和接触缺失问题。PAMI采用了粗到细的层次结构，首先生成粗略的人物交互，然后通过混合表面感知表示来细化接触几何。实验结果表明，PAMI在生成更真实的交互和更准确的人物相对物体运动方面，优于之前的方法。'}}}, {'id': 'https://huggingface.co/papers/2605.09742', 'title': 'TIDES: Implicit Time-Awareness in Selective State Space Models', 'url': 'https://huggingface.co/papers/2605.09742', 'abstract': 'Abstract  Selective state space models (SSMs), such as Mamba, achieve strong per-token expressivity by making the time discretization step TildeΔ a learned function of the input. However, in doing so, TildeΔ no longer equals the physical time gap Δ between consecutive observations, limiting the ability of these models to handle irregular time series. Continuous time SSMs, such as S5, keep TildeΔequivΔ and therefore handle irregular timestamps natively, but their dynamics remain linear time invariant (LTI), limiting per token expressivity. We propose TIDES, a selective SSM variant that reconciles selective and continuous architectures by moving input dependence off the step size and onto the diagonal state matrix. As a result, TildeΔequivΔ as in S5, allowing the model to handle irregular timestamps natively without sacrificing the per-token expressivity that makes selective SSMs effective. We show this on a novel Fading Flash experimental benchmark, a compact controlled diagnostic for sequence models that jointly tests input dependence and extrapolation to out-of-distribution Δ values, and isolates the distinct failure modes of current state-of-the-art architectures that TIDES avoids by construction. On large-scale benchmarks, TIDES sets the new best average rank on UEA time series classification and the Physiome ODE regression benchmark, and matches or exceeds the reference baseline model on 6 of 8 natively irregular datasets from astronomy, agriculture, neuromorphic sensing, and climate events. Code available at: https://github.com/TaylanSoydan/TIDES.', 'score': 1, 'issue_id': 3386, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '6d53e9ec906d3dda', 'authors': ['Taylan Soydan', 'Miguel A. Bessa', 'Dirk Mohr', 'Rui Barreira'], 'affiliations': ['AIMM, ETH Zürich', 'Inspire AG', 'School of Engineering Brown University'], 'pdf_title_img': 'assets/pdf/title_img/2605.09742.jpg', 'data': {'categories': ['#benchmark', '#architecture', '#dataset'], 'emoji': '⏰', 'ru': {'title': 'Селективные state space модели для нерегулярных временных рядов', 'desc': 'В статье предлагается TIDES — новая архитектура селективных state space моделей, которая решает проблему обработки нерегулярных временных рядов. Основная идея заключается в том, чтобы перенести зависимость от входных данных с шага дискретизации на диагональную матрицу состояния, сохраняя при этом физическое время между наблюдениями. Это позволяет модели сочетать выразительность селективных SSM с способностью непрерывных моделей естественно работать с нерегулярными временными метками. Авторы демонстрируют эффективность подхода на новом диагностическом бенчмарке и на реальных задачах классификации и регрессии, достигая лучших результатов на нескольких наборах данных.'}, 'en': {'title': 'TIDES: Bridging Selective and Continuous State Space Models for Irregular Time Series', 'desc': "The paper introduces TIDES, a new type of selective state space model (SSM) that improves the handling of irregular time series data. Unlike previous models, TIDES maintains a direct relationship between the learned time discretization step and the actual time gap between observations, allowing it to process irregular timestamps effectively. It achieves this by shifting the input dependence from the step size to the diagonal state matrix, enhancing the model's expressivity without losing the ability to manage irregularities. The authors demonstrate TIDES' effectiveness through various benchmarks, showing it outperforms existing models in time series classification and regression tasks."}, 'zh': {'title': 'TIDES：融合选择性与连续性的状态空间模型', 'desc': '选择性状态空间模型（SSMs）如Mamba，通过将时间离散化步长TildeΔ作为输入的学习函数，获得了强大的每个标记表达能力。然而，这样一来，TildeΔ不再等于连续观测之间的物理时间间隔Δ，限制了这些模型处理不规则时间序列的能力。连续时间SSMs如S5保持TildeΔ等于Δ，因此能够原生处理不规则时间戳，但其动态仍然是线性时间不变（LTI），限制了每个标记的表达能力。我们提出了TIDES，这是一种选择性SSM变体，通过将输入依赖性从步长转移到对角状态矩阵，调和了选择性和连续架构，使得TildeΔ等于Δ，允许模型原生处理不规则时间戳，同时不牺牲选择性SSMs的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.02832', 'title': 'FastOPD: On-Policy Distillation for Lightweight VLA Deployment', 'url': 'https://huggingface.co/papers/2610.02832', 'abstract': 'Abstract  Vision-Language-Action (VLA) foundation models have scaled rapidly to enhance manipulation performance and generalizability, but this scaling incurs high computational costs that render real-world deployment increasingly challenging. Existing approaches typically mitigate this issue by designing smaller architectures or reducing the iterative denoising steps in flow-based policies. In this work, we propose FastOPD, a foundation-to-lightweight VLA framework that enables the practical deployment of large-scale VLAs through efficient on-policy distillation. Specifically, FastOPD adapts a flow map for single-state teacher supervision and combines it with a self-consistency objective to construct a compact student that learns the teacher dynamics. Furthermore, we theoretically demonstrate that minimizing this objective allows the distilled student to recover a distribution on par with that induced by an ideal few-step teacher model. We evaluate FastOPD across diverse foundation policies in simulation and real-world experiments. On LIBERO, FastOPD retains 84% of the performance of π_{0.5} with only two inference steps, reducing inference latency by 78.1% while outperforming existing few-step distillation baselines in average success rate. With LingBot-VLA as the teacher, FastOPD improves the single-step success rate over the base student by 15.9 percentage points on RoboTwin 2.0. We further demonstrate its applicability to a World Action Model (WAM) and deploy a compact student distilled from MolmoAct2 on a real robot.', 'score': 1, 'issue_id': 3386, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '07a4a9355e0ce935', 'authors': ['Yoojin Oh', 'Jeongsol Kim', 'Yeonwoo Seo', 'Jangho Park', 'Seonghyun Jin', 'Sunwoo Park', 'Youngmin Kim', 'Youngjun Jun', 'Kyumin Choi', 'Jong Chul Ye'], 'affiliations': ['KAIST', 'Sungkyunkwan University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02832.jpg', 'data': {'categories': ['#multimodal', '#optimization', '#inference', '#robotics', '#small_models', '#training'], 'emoji': '🤖', 'ru': {'title': 'Быстрое развертывание больших VLA моделей через эффективную дистилляцию', 'desc': 'В этой работе предлагается FastOPD — фреймворк для эффективного сжатия крупных Vision-Language-Action моделей через on-policy дистилляцию знаний. Авторы адаптируют flow map для одношагового обучения студента от учителя и применяют self-consistency objective, что позволяет компактной модели воспроизводить динамику больших foundation models. Теоретически доказано, что минимизация этой целевой функции позволяет дистиллированному студенту восстановить распределение, эквивалентное идеальной многошаговой учительской модели. Эксперименты показывают, что FastOPD сохраняет 84% производительности при двухшаговом inference с ускорением на 78.1% и успешно развертывается на реальных роботах.'}, 'en': {'title': 'FastOPD: Efficiently Distilling Large VLA Models for Real-World Use', 'desc': 'This paper introduces FastOPD, a new framework designed to make large Vision-Language-Action (VLA) models more efficient for real-world use. It achieves this by using on-policy distillation, which helps create a smaller, faster model (the student) that learns from a larger model (the teacher). The authors show that their method can significantly reduce the time it takes for the model to make decisions while still maintaining high performance. FastOPD outperforms existing methods in both simulation and real-world tests, demonstrating its effectiveness in practical applications.'}, 'zh': {'title': '高效轻量化的视觉-语言-动作模型', 'desc': '本文提出了一种名为FastOPD的框架，旨在通过高效的在线策略蒸馏实现大规模视觉-语言-动作（VLA）模型的轻量化部署。FastOPD结合了单状态教师监督的流图和自一致性目标，构建了一个紧凑的学生模型，使其能够学习教师模型的动态。通过理论证明，最小化自一致性目标可以使蒸馏后的学生模型恢复与理想的少步教师模型相当的分布。实验结果表明，FastOPD在保持高性能的同时显著减少了推理延迟，展示了其在真实机器人上的应用潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.08884', 'title': 'Task-Sufficient Contraction: Source Selection for Machine Information Interfaces', 'url': 'https://huggingface.co/papers/2610.08884', 'abstract': 'Abstract  A declared task can sometimes certify a reduced
