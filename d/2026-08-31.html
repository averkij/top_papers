single sequence-level reward and applies the resulting advantage uniformly to all tokens, weakening credit assignment. We propose Rubric-to-Code Credit Assignment (RCCA), a reinforcement learning framework that converts rubric-level functional feedback into localized optimization signals over generated code. RCCA builds training tasks around explicit functional rubrics, uses a hierarchical reward to separate format, source-code, runtime, and functional failures, and aligns evaluator-generated textual attributions with responsible code spans and generated tokens. The resulting model, Ling-RCCA-Flash, scores 41.25 on MiniAppBench, improving Ling-3.0-Flash by 32.20 points and slightly surpassing Claude Opus 4.5. It also reaches 76.19 on ArtifactsBench, improving the SFT model by 4.48 points and establishing a new top score under the official ArtifactsBench leaderboard setting by surpassing the GPT-5 score by 3.64 points, suggesting transferable implementation-level gains.', 'score': 3, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '477611a6b66aeb70', 'authors': ['Rui Jin', 'Jikai Chen', 'Yihan Chen', 'Hao Zhou', 'Demin Zhu', 'Kaichen Yang', 'Dong Wang', 'Chenyi Zhuang'], 'affiliations': ['Inclusion AI, Ant Group', 'Zhongnan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27906.jpg', 'data': {'categories': ['#benchmark', '#rlhf', '#rl', '#plp'], 'emoji': '🎯', 'ru': {'title': 'Точное распределение ответственности: от рубрик оценки к локальной оптимизации кода', 'desc': 'RCCA — это новый подход к обучению с подкреплением для генерации интерактивных веб-приложений, который улучшает распределение кредита между частями сгенерированного кода. Вместо того чтобы давать одно вознаграждение на уровне всей последовательности, метод использует иерархическую систему обратной связи на основе функциональных критериев оценки. Модель связывает текстовые объяснения оценивающей системы с конкретными участками кода и токенами, что позволяет более точно оптимизировать каждый регион отвечающий за отдельный функционал. Результирующая модель Ling-RCCA-Flash достигает выдающихся результатов на бенчмарках MiniAppBench и ArtifactsBench, превосходя сильные базовые модели и установив новые рекорды в лидерборде.'}, 'en': {'title': 'Localized Feedback for Better Code Generation', 'desc': 'The paper introduces Rubric-to-Code Credit Assignment (RCCA), a novel reinforcement learning approach that enhances the generation of interactive web applications from natural language inputs. RCCA improves the credit assignment process by providing localized feedback based on specific functional requirements, rather than a single overall reward. This method allows the model to optimize different code regions, such as event handlers and CSS selectors, more effectively. The results show significant performance improvements on benchmark tests, indicating that RCCA can lead to better quality web applications.'}, 'zh': {'title': '局部信用赋值，提升交互式应用生成质量', 'desc': 'RCCA（Rubric-to-Code Credit Assignment）是一种强化学习框架，旨在通过基于评分标准的反馈为代码区域分配局部信用，从而改善交互式网页应用生成。与传统的代码生成方法不同，应用程序的质量依赖于多个用户功能需求，这些需求通常与特定的代码区域相关。RCCA通过将功能评分转化为局部优化信号，使用分层奖励机制来区分格式、源代码、运行时和功能失败，从而提高了生成代码的质量。最终模型Ling-RCCA-Flash在多个基准测试中表现优异，显著提升了生成应用的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.25697', 'title': 'LMSM: LLM Security Framework Inspired by Linux Security Modules', 'url': 'https://huggingface.co/papers/2608.25697', 'abstract': 'Abstract LMSM applies a modular security framework to LLM serving by separating evidence calibration, policy evaluation, and output gating, enabling flexible interpretability-based enforcement without rebuilding request handling.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly deployed with layered defenses, yet malicious prompts can still bypass them. Interpretability methods can expose model-internal signals along the generation path that could inform enforcement, but these signals are not security controls by themselves. Deployments that adapt them for safety typically couple each signal to its own calibration, policy logic, and intervention code, so each new artifact creates integration work instead of strengthening a shared defense. We present Language Model Security Modules (LMSM), a security framework that adapts the separation behind Linux Security Modules (LSM) to LLM serving. In LMSM, a selected security backend exposes calibrated evidence, a versioned policy evaluates active rules over trusted per-request context, and a separate gate authorizes buffered output release. This design separates mediation correctness from policy effectiveness, and it allows backend, rule, or schedule changes without rebuilding request handling or enforcement. Our prototype shows the separation working in practice: with Hugging Face Transformers and continuously batched vLLM, the same substrate hosts artifact-backed sparse autoencoder (SAE) and transcoder deployments and task-fitted dense probes, preserves request-specific decisions under scheduler churn, and selectively enforces and composes multiple rules per request. On Qwen3-4B, LMSM-Checkpoint reduces HarmBench attack success rate from 39.20% to 3.32%, with XSTest false refusals rising from 2.40% to 4.40%, while retaining 98.14% of the throughput of a matched serving path that performs no monitoring work at 32 active sequences. LMSM gives advances in interpretability and model-internal analysis a common path to runtime enforcement.', 'score': 3, 'issue_id': 3191, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'c287ec017dced5ba', 'authors': ['XiuYu Zhang', 'Bonan Ruan', 'Junfeng Fang', 'An Zhang', 'Tat-Seng Chua', 'Zhenkai Liang'], 'affiliations': ['National University of Singapore', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.25697.jpg', 'data': {'categories': ['#inference', '#interpretability', '#security', '#small_models', '#architecture'], 'emoji': '🔒', 'ru': {'title': 'Модульная безопасность: разделение забот при защите больших языковых моделей', 'desc': 'В статье представлена архитектура Language Model Security Modules (LMSM), которая применяет модульный подход к безопасности при обслуживании больших языковых моделей. Система разделяет три независимых компонента: калибровку доказательств (evidence) из внутренних сигналов модели, оценку политики безопасности и управление выводом, что позволяет гибко комбинировать различные методы интерпретируемости без переписания кода обработки запросов. Авторы демонстрируют, что такой модульный дизайн позволяет эффективно применять разные артефакты анализа (разреженные автокодировщики, транскодеры, пробы), сохраняя при этом производительность системы и снижая успешность атак вредоносных промптов. LMSM показывает практическую пользу разделения проблем: методы интерпретируемости получают единый путь к применению в боевых условиях, а политики безопасности можно менять без переработки инфраструктуры обслуживания.'}, 'en': {'title': 'Modular Security for Safer Language Models', 'desc': 'The paper introduces Language Model Security Modules (LMSM), a framework designed to enhance the security of large language models (LLMs) by modularizing their defense mechanisms. It separates the processes of evidence calibration, policy evaluation, and output gating, allowing for flexible and interpretable enforcement without the need to overhaul existing request handling systems. By adapting concepts from Linux Security Modules, LMSM enables the integration of various security controls while maintaining high throughput and minimizing integration work. The prototype demonstrates significant improvements in reducing attack success rates while preserving performance, showcasing a new approach to runtime enforcement in LLM deployments.'}, 'zh': {'title': 'LMSM：灵活的语言模型安全防护框架', 'desc': 'LMSM（语言模型安全模块）是一种安全框架，旨在为大型语言模型（LLM）提供灵活的安全防护。它通过将证据校准、策略评估和输出控制分离，避免了在处理请求时需要重建系统。该框架允许在不影响请求处理的情况下，进行后端、规则或调度的更改，从而提高了安全性和可解释性。实验结果表明，LMSM显著降低了攻击成功率，同时保持了高效的处理能力。'}}}, {'id': 'https://huggingface.co/papers/2608.24804', 'title': 'StarHarness: Evolving Harnesses with Stratified Search for Enterprise Environments', 'url': 'https://huggingface.co/papers/2608.24804', 'abstract': 'Abstract StarHarness evolves fixed-weight agent harnesses via stratified task pools and hidden selection to improve enterprise tool-use performance and cross-model transfer.  Generated by thinkingmachines/Inkling-Small We present StarHarness, a framework for evolving environment-specific agent harnesses while keeping model weights fixed. The evolved harness can include prompt and task framing, tool interfaces, skills, MCP-backed providers, subagent structure, and agent-loop configuration. StarHarness constructs a compact evolution pool by stratifying tasks according to baseline failure behavior, separates proposer-visible search tasks from proposer-hidden selection tasks, and reserves held-out tasks for evaluating generalization. Across ITBench SRE, EnterpriseOps-Gym ITSM, and AutomationBench Finance, harness evolution improves full-benchmark performance by 20-35 percentage points over the default harness after 4-12 accepted changes per environment. These gains persist on tasks excluded from evolution and transfer without re-evolution across GPT and Qwen model families. Trace analysis links the improvements to interface repairs, environment conventions, and operational knowledge that compresses search, with fewer false-positive diagnoses and shorter trajectories in several settings. StarHarness therefore offers a practical way to reduce persistent model-environment mismatch in tool-rich enterprise tasks.', 'score': 3, 'issue_id': 3192, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '8b138cad2b0ae856', 'authors': ['Esakkivel Esakkiraja', 'Denis Akhiyarov', 'Vikas Yadav', 'Sai Rajeswar', 'Patrice Bechard', 'Sridhar Nemala', 'Sagar Davasam'], 'affiliations': ['Mila', 'ServiceNow', 'Université de Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2608.24804.jpg', 'data': {'categories': [], 'emoji': '🧬', 'ru': {'title': 'Эволюция архитектуры агента для преодоления несоответствия между моделью и окружением', 'desc': "StarHarness — это фреймворк для эволюционной оптимизации окружения агента при сохранении фиксированных весов модели. Система эволюционирует компоненты harness'а, включая prompt'ы, интерфейсы инструментов, структуру подагентов и конфигурацию цикла агента, используя стратифицированные пулы задач с разделением видимых и скрытых задач поиска. Экспериментально подтверждено, что эволюция harness'а улучшает производительность на 20-35 процентных пункта в корпоративных средах SRE, ITSM и Finance после 4-12 принятых изменений. Полученные улучшения обобщаются на исключённые из эволюции задачи и переносятся между семействами моделей GPT и Qwen без повторной оптимизации."}, 'en': {'title': 'Evolving Agent Harnesses for Enhanced Tool Performance', 'desc': 'StarHarness is a framework designed to enhance the performance of fixed-weight agents in specific environments by evolving their harnesses. It achieves this by using stratified task pools and hidden selection methods to optimize how agents interact with tools and tasks. The framework allows for the integration of various components like skills and task framing while keeping the underlying model weights unchanged. Results show significant performance improvements across multiple benchmarks, demonstrating the ability to generalize and transfer learning effectively between different model families.'}, 'zh': {'title': 'StarHarness：提升企业工具使用性能的创新框架', 'desc': 'StarHarness 是一个框架，用于在保持模型权重不变的情况下，进化特定环境的代理工具。它通过分层任务池和隐藏选择来提高企业工具使用的性能和跨模型转移能力。经过进化的代理工具可以包括提示、任务框架、工具接口和技能等多种元素。研究表明，StarHarness 在多个基准测试中显著提高了性能，解决了模型与环境之间的持续不匹配问题。'}}}, {'id': 'https://huggingface.co/papers/2608.20965', 'title': 'Training, learning and inference: unified dynamics of neural systems', 'url': 'https://huggingface.co/papers/2608.20965', 'abstract': 'Abstract Atomic generation facts compiled into a graph enable recursive scientific processes, and training-learning dynamics in nanoGPT are characterized by state-conditioned parameter updates, persistent functional reorganization, and frozen inference projections validated across architectures.  Generated by thinkingmachines/Inkling-Small We define an atomic generation fact f=(u,tau,omega,z;rho), recording the origin, realized transformation, concrete occurrence, generated result and relation role. Compiled into a Generation-Fact Graph (GFG), these facts provide an AI-native, compilable scientific fact substrate preserving generation histories. We establish a GFG-based recursive scientific process in which analysis, intervention, replay and validation form facts for later cycles. Using nanoGPT, we establish unified training-learning dynamics. Training is the evolution of a parameter-optimizer system with state and memory: each actual training action enters the receiving state and produces a finite-amplitude nonlinear functional response conditioned by that state and target-specific update geometry. Learning is the persistent reorganization of distributed functional support by these responses; capability formation, maintenance, decline or recovery becomes observable when target-specific states are evaluated against their readout boundaries. Three primary coordinates - target-boundary state, target-specific update geometry and parameter-Adam receiving state - yield a second-order predictor operating before post-update outputs are read. On held-out runs, it achieved 91.43% accuracy and 91.49% macro-averaged recall across four transitions. We further establish inference as a frozen projection of training-learning dynamics. Component gating and rollback show causal recruitment and non-additive combination of query-conditioned support formed during training, deriving organizational conditions realized by Attention. Controlled feedback indicates possible double-edged reinforcement effects. ResNet/CIFAR-100 and diffusion/CIFAR-10 experiments confirm receiving-state-conditioned responses, persistent support reorganization and frozen inference projection beyond nanoGPT.', 'score': 2, 'issue_id': 3191, 'pub_date': '2026-08-21', 'pub_date_card': {'ru': '21 августа', 'en': 'August 21', 'zh': '8月21日'}, 'hash': '67340a168f2c96fa', 'authors': ['Mian Wang'], 'affiliations': ['Wuhan Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2608.20965.jpg', 'data': {'categories': ['#training', '#interpretability', '#small_models', '#science', '#architecture'], 'emoji': '🧬', 'ru': {'title': 'Граф фактов генерации: декодирование динамики обучения нейросетей через состояние-обусловленные обновления', 'desc': 'В работе предложена концепция графа фактов генерации (GFG), который представляет атомарные факты о процессах обучения нейросетей и позволяет реализовать рекурсивные научные циклы. Авторы показывают, что динамика обучения в nanoGPT описывается обусловленными состоянием обновлениями параметров, где каждое действие обучения вызывает нелинейный функциональный ответ, зависящий от текущего состояния оптимизатора и геометрии обновления. Они демонстрируют, что способности моделей формируются через перестройку распределённой функциональной поддержки и могут быть предсказаны с точностью 91.43% на основе трёх координат: целевого состояния, геометрии обновления и состояния параметров. Результаты подтверждены на архитектурах ResNet и диффузионных моделях, показывая универсальность подхода.'}, 'en': {'title': 'Harnessing Atomic Facts for Enhanced AI Learning Dynamics', 'desc': 'This paper introduces a novel approach to scientific processes using a Generation-Fact Graph (GFG) that captures atomic generation facts, which include various attributes like origin and transformation. The authors describe how nanoGPT utilizes state-conditioned parameter updates to enhance training and learning dynamics, allowing for effective memory and response management. They demonstrate that this method leads to improved accuracy and recall in predictive tasks, showcasing the potential of GFG in recursive scientific analysis and validation. Additionally, the study highlights the importance of controlled feedback and attention mechanisms in optimizing the learning process and achieving robust inference projections.'}, 'zh': {'title': '基于生成事实图的递归科学过程', 'desc': '本文提出了一种基于生成事实图（GFG）的递归科学过程，利用原子生成事实记录科学数据的来源和转化。通过nanoGPT，我们实现了统一的训练-学习动态，训练过程通过状态和记忆演化参数优化系统。学习则是通过这些响应的持续重组，观察能力的形成、维护和衰退。实验结果表明，该方法在多个任务上达到了高准确率，验证了训练-学习动态的有效性。'}}}];

        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (5)', '#agi', '#alignment', '#architecture (5)', '#audio', '#benchmark (6)', '#cv (2)', '#data', '#dataset (3)', '#diffusion (3)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability (2)', '#leakage', '#long_context (3)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (6)', '#open_source (4)', '#optimization (4)', '#plp (1)', '#rag', '#reasoning (3)', '#rl (2)', '#rlhf (2)', '#robotics (2)', '#science (2)', '#security (2)', '#small_models (4)', '#story_generation', '#survey (1)', '#synthetic (1)', '#training (9)', '#transfer_learning (1)', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-31 09:07',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-31 09:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-31 09:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
