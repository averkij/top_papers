    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.28122', 'title': 'Agentic Artifact Creation: Systems, Evaluation, Principles, and Opportunities', 'url': 'https://huggingface.co/papers/2608.28122', 'abstract': "Abstract This survey defines agentic artifact creation as stateful, feedback-driven construction of deliverables by AI systems and analyzes 259 works across artifact families, settings, and evaluation practices to propose principles for accountable control.  Generated by thinkingmachines/Inkling-Small Generative models can turn natural-language prompts into images, text, code, and other content, lowering the cost of producing drafts and components. Their practical impact increasingly depends on whether those pieces can become complete, dependable deliverables. This survey examines agentic artifact creation, which we define as stateful construction in which an AI system materially constructs or revises a deliverable and intermediate observations redirect later work. Functionally, the process links an operational representation of the artifact, a construction policy, and runtime verification whose feedback can redirect later actions. We reviewed 259 works available through August 20, 2026: 230 systems meeting this definition and 29 benchmarks of agentic artifact construction. We compare six artifact families, then analyze application settings and evaluation practice as separate dimensions. Across families, construction challenges reflect not only modality but also how tightly decisions are coupled and whether failures become visible while they remain repairable. Decomposition can reduce local complexity while increasing coordination and reassembly costs. Learned judges may add little independent evidence when they share the generator's preferences or blind spots. We formulate principles for keeping commitments and responsibility explicit, turning feedback into targeted repair, and revalidating affected state after change. We also identify opportunities for sustaining coherent, accountable control as artifacts, creator intent, and construction systems evolve. A curated paper list is available at https://github.com/GeminiLight/awesome-agentic-artifact-creation.", 'score': 36, 'issue_id': 3192, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '8bec7f4870f9299e', 'authors': ['Tianfu Wang', 'Zhezheng Hao', 'Xilin Xia', 'Lixin Liu', 'Mengkang Hu', 'Hongzhang Liu', 'Xi Chen', 'Ziyan Liu', 'Xiankun Lin', 'Weijia Zhang', 'Nicholas Jing Yuan', 'Hui Xiong'], 'affiliations': ['Sun Yat-sen University', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'The University of Sydney', 'Tsinghua University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28122.jpg', 'data': {'categories': ['#survey', '#benchmark', '#agents', '#multimodal'], 'emoji': '🔄', 'ru': {'title': 'Итеративное создание артефактов: принципы ответственного контроля в агентных системах', 'desc': 'Это исследование анализирует агентную генерацию артефактов — процесс, при котором AI системы итеративно создают и улучшают готовые продукты на основе обратной связи, сохраняя состояние между операциями. Авторы рассмотрели 259 работ, включая 230 систем и 29 бенчмарков, классифицируя их по семействам артефактов (текст, код, изображения и т.д.) и анализируя вызовы в различных модальностях. Исследование показывает, что основные проблемы связаны не только с типом контента, но и с тем, как взаимозависимы решения и насколько видны ошибки в процессе работы. Авторы предложили принципы ответственного контроля, включая явную фиксацию намерений создателя, превращение обратной связи в целевые исправления и переvalidation состояния системы после изменений.'}, 'en': {'title': 'Empowering AI: Building Reliable Artifacts Through Feedback and Accountability', 'desc': 'This paper surveys the concept of agentic artifact creation, where AI systems actively construct and revise deliverables based on feedback. It analyzes 259 works to establish principles for ensuring accountability in AI-generated outputs. The study emphasizes the importance of stateful construction, where intermediate observations influence future actions, and highlights challenges in different artifact families. The authors propose strategies for maintaining control and responsibility as AI systems evolve and produce complex artifacts.'}, 'zh': {'title': '代理人工件创建：智能构建与反馈控制的未来', 'desc': '本研究定义了代理人工件创建为由人工智能系统驱动的状态反馈构建过程，并分析了259项相关工作。生成模型能够将自然语言提示转化为图像、文本、代码等内容，从而降低草稿和组件的生产成本。研究探讨了代理人工件创建的过程，包括人工智能系统如何构建或修订交付物，以及如何通过反馈重定向后续工作。我们提出了保持承诺和责任明确的原则，并识别了在人工件、创作者意图和构建系统演变过程中维持一致性和可问责控制的机会。'}}}, {'id': 'https://huggingface.co/papers/2608.27549', 'title': 'Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning', 'url': 'https://huggingface.co/papers/2608.27549', 'abstract': 'Abstract Code-as-World represents physical environments as executable code to enable quantitative reasoning and scalable supervision for vision-language models.  Generated by thinkingmachines/Inkling-Small Physical understanding and reasoning depend on forming compact and generalizable representations of the world. While modern vision-language models can recognize and explain diverse physical events, they often lack explicit representations of the underlying mechanisms-such as object states, physical parameters, and governing dynamics-needed for reliably reasoning how the world evolves and responds to interventions. In this work, we introduce Code-as-World, a paradigm that represents physical worlds through executable world representations. By expressing physical composition, dynamic evolution, and visual appearance as executable code, Code-as-World provides a compact, quantitatively grounded, and controllable abstraction of the physical world. To construct such representations from multimodal observations, such as natural-language descriptions or real-world videos, we develop an agentic discovery loop inspired by abductive reasoning, where an agent proposes, executes, renders, verifies, and iteratively refines executable world hypotheses. As a concrete application, we use verified executable worlds to provide scalable physical supervision for training vision-language models on quantitative physical reasoning. Experiments show that Code-as-World-VL achieves state-of-the-art performance on QuantiPhy and surpasses leading proprietary models, highlighting the potential of executable world representations as a scalable foundation for physical intelligence.', 'score': 32, 'issue_id': 3191, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '245d573f48911d09', 'pdf_title_img': 'assets/pdf/title_img/2608.27549.jpg', 'data': {'categories': ['#multimodal', '#training', '#reasoning', '#benchmark', '#agents', '#open_source', '#science'], 'emoji': '🌍', 'ru': {'title': 'Физический мир как исполняемый код для рассуждений видео-языковых моделей', 'desc': 'В работе предложена парадигма Code-as-World, которая представляет физические окружения через исполняемый код, позволяя создавать компактные и управляемые абстракции реального мира. Для построения таких представлений из мультимодальных наблюдений (текстовых описаний и видео) используется агентный цикл открытия, вдохновленный абдуктивным рассуждением, где модель итеративно предлагает, выполняет и проверяет гипотезы о мире. Верифицированные исполняемые представления мира используются для обеспечения масштабируемого обучения vision-language моделей на задачах количественного физического рассуждения. Экспериментальные результаты показывают, что Code-as-World-VL достигает лучших показателей на бенчмарке QuantiPhy, превосходя ведущие проприетарные модели.'}, 'en': {'title': 'Code-as-World: Executable Representations for Enhanced Physical Reasoning', 'desc': 'The paper introduces a new approach called Code-as-World, which represents physical environments as executable code to enhance reasoning in vision-language models. This method allows for a better understanding of physical events by providing explicit representations of object states and dynamics. By using a discovery loop that iteratively refines hypotheses based on multimodal observations, the framework enables scalable supervision for training models in quantitative physical reasoning. The results demonstrate that this approach significantly improves performance on benchmarks, showcasing its potential for advancing physical intelligence in AI systems.'}, 'zh': {'title': '可执行世界：物理智能的新基础', 'desc': '本论文提出了Code-as-World的概念，将物理环境表示为可执行代码，以便于对视觉-语言模型进行定量推理和可扩展监督。通过将物理组成、动态演变和视觉外观表达为可执行代码，Code-as-World提供了一种紧凑、定量基础和可控的物理世界抽象。我们开发了一种基于溯因推理的代理发现循环，从多模态观察中构建这些表示，以便提出、执行、渲染、验证和迭代优化可执行世界假设。实验结果表明，Code-as-World-VL在定量物理推理任务中表现优异，超越了领先的专有模型，展示了可执行世界表示作为物理智能可扩展基础的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.26582', 'title': 'J-Zero: Unified Challenger--Solver--Judge Co-Evolution from Zero Data', 'url': 'https://huggingface.co/papers/2608.26582', 'abstract': "Abstract J-Zero enables self-improving language models across verifiable and unverifiable domains through adversarial co-evolution of a task generator, solver, and judge using predefined preference pairs.  Generated by thinkingmachines/Inkling-Small Self-evolving language models have recently emerged as a promising path toward superintelligence, with the advantage of reducing the cost of human supervision. While considerable progress has been made in verifiable domains, self-evolution in unverifiable domains remains substantially less explored. We propose Judge co-adaptation from Zero data (J-Zero), a unified Challenger--Solver--Judge co-evolution framework that supports self-improvement across both domains. The Challenger and Solver co-evolve through an adversarial interaction: the Challenger generates increasingly difficult tasks, while the Solver learns to produce higher-quality responses to them. In parallel, the Judge co-adapts using preference pairs whose ordering is known in advance from how each response was produced, i.e., the Solver's answer over the Challenger's, and its decomposed-and-recombined answer over its one-shot answer, rather than from the Judge's own scores. J-Zero outperforms the baselines by an average of 4.2 points on verifiable and 8.0 points on unverifiable domains, and continues to improve through at least ten iterations, whereas the baselines degrade after two.", 'score': 29, 'issue_id': 3192, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '2380c5259fc0517c', 'authors': ['Gyouk Chu', 'Myeongho Jeon', 'Eunho Yang'], 'affiliations': ['KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2608.26582.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Самосовершенствующиеся модели через состязательную тройственную эволюцию', 'desc': 'В статье предложена J-Zero — фреймворк для самосовершенствования языковых моделей, основанный на совместной эволюции трёх компонентов: генератора задач (Challenger), решателя (Solver) и судьи (Judge). Компоненты взаимодействуют через состязательный процесс, где Challenger создаёт всё более сложные задачи, а Solver учится давать качественные ответы. Судья обучается на основе предопределённых пар предпочтений, извлекая сигналы из способа производства ответов, а не из собственных оценок. Метод показывает значительные улучшения как на проверяемых, так и на непроверяемых задачах, продолжая прогрессировать через десять итераций против деградации базовых подходов.'}, 'en': {'title': 'Empowering Language Models Through Adversarial Co-Evolution', 'desc': 'J-Zero is a framework that enhances language models by allowing them to improve themselves in both verifiable and unverifiable tasks. It uses a system where a Challenger creates challenging tasks, a Solver generates responses, and a Judge evaluates these responses based on predefined preferences. This adversarial co-evolution helps the Solver learn to produce better answers over time, while the Judge adapts to improve its evaluation process. J-Zero shows significant performance gains over traditional methods, especially in challenging unverifiable domains, demonstrating its effectiveness in self-improvement.'}, 'zh': {'title': 'J-Zero：自我进化的语言模型新路径', 'desc': 'J-Zero是一种自我改进的语言模型框架，能够在可验证和不可验证的领域中通过对抗性共同进化实现自我提升。该框架包括挑战者、求解者和评判者三者的协同进化，挑战者生成越来越困难的任务，而求解者则学习提供更高质量的回答。评判者通过预定义的偏好对进行共同适应，利用已知的回答顺序来评估结果，而不是依赖于自身的评分。实验结果表明，J-Zero在可验证领域平均提高了4.2分，在不可验证领域提高了8.0分，并且在至少十次迭代中持续改进。'}}}, {'id': 'https://huggingface.co/papers/2608.27529', 'title': 'Revisiting Local Context for Long-Horizon Streaming 3D Reconstruction', 'url': 'https://huggingface.co/papers/2608.27529', 'abstract': 'Abstract ABot-Recon achieves stable long-horizon streaming 3D reconstruction by using only local temporal context and frame-independent predictions composed sequentially, reducing drift via a lightweight temporal refiner and composition-aware pose loss.  Generated by thinkingmachines/Inkling-Small Streaming 3D reconstruction from extremely long videos requires estimating camera motion and scene geometry online under bounded memory and computation. Early streaming models achieve causal, bounded-cost inference using finite context buffers or compact recurrent states, yet their estimates often deteriorate as sequences grow. Recent methods improve long-horizon stability by coupling short-range context with persistent or multi-level long-range memory. We pursue a different route: we keep the learned temporal state strictly local and formulate predictions whose targets remain independent of sequence length. We present ABot-Recon, a simple streaming model that caches KV features from only the preceding 11 frames. It predicts a point map in the current camera coordinate system together with an adjacent-frame relative pose. These predictions remain equivariant under changes of reference frame, and global poses and geometry are recovered through sequential composition. To reduce accumulated drift, a lightweight temporal refiner improves relative rotations using recent visual and motion context, while a composition-aware pose loss supervises multi-step pose composition. Extensive evaluations on challenging long-sequence benchmarks demonstrate the superior long-horizon performance of our local-context approach. On Oxford Spires, ABot-Recon achieves an ATE of 4.35 m and an RPE-R of 0.12^circ, reducing both errors by approximately 40\\% relative to the best prior results.', 'score': 27, 'issue_id': 3192, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '2a133a11c44c3e1e', 'authors': ['Jiarong Han', 'Jincheng Xiong', 'Yuzhou Liu', 'Linzhe Shi', 'Changjie Wu', 'Ning Guo', 'Mu Xu', 'Hang Zhang', 'Ming Qian'], 'affiliations': ['AMAP CV Lab Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.27529.jpg', 'data': {'categories': ['#benchmark', '#video', '#3d'], 'emoji': '🎬', 'ru': {'title': 'Стабильная потоковая реконструкция через локальный контекст и композиционные предсказания', 'desc': 'ABot-Recon решает задачу потоковой 3D реконструкции из длинных видеопоследовательностей, используя только локальный временной контекст из 11 предыдущих кадров. Модель предсказывает карту точек в текущей системе координат камеры и относительную позу между соседними кадрами, что позволяет избежать накопления ошибок при обработке последовательности неограниченной длины. Для уменьшения дрейфа применяется лёгкий временной уточнитель и специальная loss-функция, учитывающая композицию поз при многошаговом предсказании. Метод достигает значительного улучшения на сложных бенчмарках, снижая ошибки позиционирования и ориентации примерно на 40% по сравнению с предыдущими подходами.'}, 'en': {'title': 'Stable 3D Reconstruction with Local Context', 'desc': 'ABot-Recon is a machine learning model designed for stable long-horizon streaming 3D reconstruction from lengthy video sequences. It utilizes local temporal context and frame-independent predictions to minimize drift, employing a lightweight temporal refiner and a composition-aware pose loss. Unlike previous models that rely on extensive memory, ABot-Recon focuses on a limited cache of features from the last 11 frames, ensuring predictions are consistent regardless of sequence length. The model demonstrates significant improvements in accuracy, achieving a 40% reduction in error rates compared to prior methods on challenging benchmarks.'}, 'zh': {'title': 'ABot-Recon：稳定的长时间流式3D重建', 'desc': 'ABot-Recon是一种稳定的长时间流式3D重建方法，它仅使用局部时间上下文和独立于帧的预测来减少漂移。该模型通过轻量级的时间细化器和考虑组合的姿态损失来提高重建精度。与早期模型不同，ABot-Recon保持学习的时间状态严格局部，并且其预测目标与序列长度无关。经过广泛评估，ABot-Recon在长序列基准测试中表现出色，显著降低了重建误差。'}}}, {'id': 'https://huggingface.co/papers/2608.27550', 'title': 'Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2608.27550', 'abstract': 'Abstract VLAct improves vision-language-action model performance by pre-training on diverse robot data with preserved vision-language priors and shared action semantics, achieving strong results across simulations and unseen embodiments with limited compute.  Generated by thinkingmachines/Inkling-Small Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodiment robot data before task-specific fine-tuning. VLAct preserves the broad VLM prior and encourages shared action semantics across embodiments through VLM-prior preservation, multi-head continuous action co-supervision, and a partially unified cross-embodiment action layout, while allowing task-specific action heads during fine-tuning. Across simulation, real-world, and unseen-embodiment transfer, VLAct consistently improves downstream performance under fixed fine-tuning protocols. On LIBERO-Plus and RoboTwin 2.0, VLAct surpasses industrial VLA systems including ABot-M0 and LingBot-VLA, achieving success rates of 82.6% and 92.5%. On RoboDojo, VLAct ranks sixth among all policies by success rate and outperforms all explicitly designated world-action model (WAM) entries on both metrics. Most notably, on RoboCasa-GR1, an unseen humanoid embodiment, VLAct using only 20% of downstream trajectories outperforms the full-data GR00T-N1.6 baseline. These results are obtained using fully open-source data and only a 16-GPU training setup, showing that representation-centric continued pre-training can deliver highly competitive performance under a modest compute budget and is an important independent axis of VLA progress beyond data scaling.', 'score': 25, 'issue_id': 3191, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '0e6e041ad822639f', 'pdf_title_img': 'assets/pdf/title_img/2608.27550.jpg', 'data': {'categories': ['#training', '#multimodal', '#robotics', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Качество представлений вместо масштаба: как малобюджетное обучение делает универсальных робототехнических агентов', 'desc': 'VLAct — это модель Vision-Language-Action, которая улучшает производительность робототехнических систем через предварительное обучение на разнообразных данных с сохранением знаний из vision-language моделей и общей семантики действий. Авторы предлагают подход, где на этапе предварительного обучения используются данные от различных типов роботов, а затем проводится доводка под специфические задачи. Ключевая идея заключается в том, что качество представлений критично при ограниченном бюджете робототехнических данных, поэтому нужно развивать трансфируемые знания, а не просто переподгонять действия. Модель достигает впечатляющих результатов в симуляциях и на неизвестных конфигурациях роботов, используя только 20% данных при обучении на новых воплощениях.'}, 'en': {'title': 'VLAct: Elevating Vision-Language-Action Models with Efficient Pre-Training', 'desc': 'VLAct is a vision-language-action model that enhances performance by pre-training on a variety of robot data while maintaining important vision-language relationships and shared action meanings. It addresses the challenge of limited robot trajectory data by focusing on transforming these limited examples into useful visual-action knowledge instead of just fitting actions. The model employs a backbone that preserves broad vision-language model (VLM) knowledge and incorporates multi-embodiment action supervision, allowing it to adapt to different tasks effectively. As a result, VLAct demonstrates superior performance in simulations and real-world applications, outperforming existing industrial models with significantly less computational resources.'}, 'zh': {'title': 'VLAct：提升视觉-语言-动作模型的关键', 'desc': 'VLAct是一种改进的视觉-语言-动作(VLA)模型，通过在多样化的机器人数据上进行预训练，保留视觉-语言先验和共享动作语义，从而提升模型性能。由于机器人轨迹的收集成本高且覆盖范围有限，代表性质量成为一个关键瓶颈。VLAct在广泛的多样化机器人数据上进行训练，鼓励不同体现之间的共享动作语义，并在任务特定的微调中允许特定的动作头。实验结果表明，VLAct在多个模拟和真实世界任务中表现优异，超越了现有的工业VLA系统。'}}}, {'id': 'https://huggingface.co/papers/2608.28476', 'title': 'ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL', 'url': 'https://huggingface.co/papers/2608.28476', 'abstract': 'Abstract ContextPilot improves long-horizon agent reasoning by expanding context-editing tools and using reinforcement learning with branch sampling to identify critical context decisions.  Generated by thinkingmachines/Inkling-Small Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face three key limitations: (1) a limited toolset restricted to search, deletion, and summarization, with no support for global planning, long-term memory, and adaptive compression; (2) inefficient exploration that treats context management actions uniformly despite their heterogeneous impacts on final outcomes; and (3) coarse-grained credit assignment that assigns the final trajectory-level reward to all intermediate context editing actions during RL. To bridge these gaps, we introduce ContextPilot, a proactive context management framework for long-horizon agentic reasoning. Our approach systematically augments the toolset with planning, long-term memory, and soft context offloading tools. We further propose an RL method tailored for context management, which uses context and entropy variation to identify critical editing decisions for branch sampling and estimates action-level advantages from all branched trajectories that pass through the corresponding context editing action. Experiments on long-context QA and deep search tasks show that ContextPilot achieves stronger performance with a more compact working context, consistently outperforming existing baselines across various base models and benchmarks. Code is available at https://github.com/Tencent/ContextPilot.', 'score': 21, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'eb471973663a2425', 'authors': ['Zhuoshi Pan', 'Qizhi Pei', 'Junru Lu', 'Honglin Lin', 'H. Vicky Zhao', 'Di Yin', 'Xing Sun'], 'affiliations': ['Shanghai AI Lab', 'Tencent Youtu Lab', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28476.jpg', 'data': {'categories': ['#rl', '#reasoning', '#optimization', '#long_context', '#benchmark', '#agents', '#open_source'], 'emoji': '🧠', 'ru': {'title': 'Умное управление контекстом для долгих цепочек рассуждений агентов', 'desc': 'ContextPilot — это фреймворк для управления контекстом агентов на основе больших языковых моделей при решении долгогоризонтных задач. Авторы расширили набор инструментов редактирования контекста, добавив планирование, долгосрочную память и мягкую разгрузку контекста, что позволяет моделям более эффективно работать с информацией. Предложен новый метод обучения с подкреплением, использующий выборку ветвей для определения критических решений управления контекстом и точной оценки преимуществ действий на уровне отдельных операций редактирования. Экспериментальные результаты показывают, что ContextPilot достигает лучшей производительности с более компактным рабочим контекстом на задачах вопросно-ответного поиска и глубокого поиска информации.'}, 'en': {'title': 'Empowering Long-Horizon Agents with ContextPilot', 'desc': 'ContextPilot enhances the reasoning capabilities of long-horizon agents by improving context management tools and employing reinforcement learning with branch sampling. It addresses limitations in existing methods by introducing a broader toolset that includes global planning and long-term memory, allowing for more effective context editing. The proposed reinforcement learning approach focuses on identifying critical context decisions and assigning action-level advantages, leading to better exploration and credit assignment. Experiments demonstrate that ContextPilot not only maintains a more compact working context but also outperforms existing models in various tasks.'}, 'zh': {'title': 'ContextPilot：提升长时间推理的上下文管理', 'desc': 'ContextPilot 是一个用于长时间推理的主动上下文管理框架。它通过扩展上下文编辑工具和使用强化学习来识别关键的上下文决策，从而改善智能体的推理能力。该方法解决了现有上下文管理工具的局限性，增加了规划、长期记忆和软上下文卸载工具。实验结果表明，ContextPilot 在长上下文问答和深度搜索任务中表现优异，能够在更紧凑的工作上下文中实现更强的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.28460', 'title': 'LayerRecall: A State-Conditioned Memory Router for Long-Horizon Consistency in Video Generation', 'url': 'https://huggingface.co/papers/2608.28460', 'abstract': 'Abstract LayerRecall selectively routes long-range historical memory into specific video diffusion layers to improve long-video consistency, supervised by cross-horizon prediction matching.  Generated by thinkingmachines/Inkling-Small Autoregressive video diffusion enables scalable long-video generation by producing chunks from a bounded recent context. While recency-based caching preserves local continuity, it evicts historical cues needed when subjects, objects, scenes, or attributes reappear. Existing memory mechanisms expose models to nonlocal history, but access alone does not ensure effective use. Our analysis reveals that video DiT layers exhibit distinct preferences for current, recent, and distant context, suggesting that long-range memory requires deciding both what to retrieve and where to use it. We introduce LayerRecall, a current-conditioned, layer-selective memory router that retrieves relevant historical K/V states and injects them only into backbone-specific memory-sensitive layers while preserving local attention elsewhere. To reduce reliance on scarce high-quality long-horizon videos and explicit memory-allocation labels, we further propose Cross-Horizon Prediction Matching (CHPM), which uses a privileged long-context reference to supervise the bounded-memory router in prediction space. Across 100 multi-shot evaluation prompts, LayerRecall achieves the best overall results on MemoBench and MovieBench while matching its backbone on VBench-Long, demonstrating stronger long-range recovery without sacrificing local continuity. Qualitative analyses further reveal memory-guided self-correction, whereby initially mismatched local attributes return to their historical appearance without resetting ongoing motion or scene structure. Additional analyses show cross-backbone portability and negligible inference overhead.', 'score': 18, 'issue_id': 3192, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'a42fae7c13326257', 'authors': ['Yixuan Ding', 'Jiahao Kong', 'Wei Huang', 'Ruijie Quan', 'Yi Yang'], 'affiliations': ['The University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28460.jpg', 'data': {'categories': ['#diffusion', '#video', '#training', '#architecture', '#long_context'], 'emoji': '🎬', 'ru': {'title': 'Умная память для генерации видео: вспоминать нужное в нужном месте', 'desc': 'В статье представлен LayerRecall — метод для улучшения согласованности видео при генерации длинных последовательностей с помощью диффузионных моделей. Подход селективно маршрутизирует историческую память в специфические слои нейросети, позволяя модели вспоминать релевантные детали из давних частей видео, которые теряются при стандартном кэшировании только недавнего контекста. Авторы предложили метод Cross-Horizon Prediction Matching для обучения маршрутизатора памяти без необходимости в больших объёмах размеченных данных длинных видео. Экспериментальные результаты показывают, что LayerRecall значительно улучшает восстановление дальних зависимостей в видео, сохраняя при этом локальную согласованность и требуя минимальных вычислительных затрат.'}, 'en': {'title': 'Enhancing Long-Video Consistency with LayerRecall', 'desc': 'The paper introduces LayerRecall, a novel memory routing mechanism designed to enhance long-video generation by selectively integrating historical memory into specific layers of a video diffusion model. It addresses the challenge of maintaining consistency in long videos by using a method called Cross-Horizon Prediction Matching (CHPM), which helps the model learn from long-context references without needing extensive labeled data. The approach allows the model to effectively retrieve and utilize relevant past information while preserving local continuity in the video. Experimental results demonstrate that LayerRecall outperforms existing methods in long-range memory recovery while maintaining the quality of local details in generated videos.'}, 'zh': {'title': '长视频生成中的智能记忆选择', 'desc': '本文提出了一种名为LayerRecall的机制，用于在视频生成中选择性地引入长时间历史记忆，以提高长视频的一致性。通过交叉视野预测匹配（CHPM），该方法能够在有限的记忆空间中有效地利用历史信息，确保模型在生成视频时能够保持局部连续性。研究表明，视频生成模型在处理当前、近期和远期上下文时具有不同的偏好，因此需要在检索和使用记忆时做出明智的选择。LayerRecall通过在特定的内存敏感层中注入相关的历史状态，显著提升了长范围记忆的恢复能力，同时保持了局部注意力的稳定性。'}}}, {'id': 'https://huggingface.co/papers/2608.28478', 'title': 'Blind Men and the Elephant: Probing the Epistemic Myopia of LLMs under Long-Tail Divergent Knowledge', 'url': 'https://huggingface.co/papers/2608.28478', 'abstract': 'Abstract ElephantBench evaluates whether large language models retain multiple conflicting accounts of long-tail facts through a graph-based pipeline that creates verifiable multi-account questions, revealing widespread epistemic incompleteness.  Generated by thinkingmachines/Inkling-Small Factual question answering (QA) typically assumes a single canonical answer, obscuring whether large language models (LLMs) retain divergent accounts of long-tail facts. To address this gap, we introduce ElephantBench, a closed-book knowledge probe comprising 1,094 questions generated through an auditable graph-based pipeline. The pipeline retrieves related documents from a low-exposure web corpus, identifies naturally occurring disagreements, and converts them into multi-account QA records. Each answer is verified against the originating documents and authoritative public web sources and is then reviewed by human annotators. Across 32 models, even the strongest model recovers both accounts on only 52.4% of questions, while on nearly all remaining questions it recalls one account but omits the other. Scaling model size and inference-time reasoning improve recall but do not eliminate this incompleteness. Corpus analysis further shows that exposure imbalance favors the dominant account, whereas greater minority-side exposure is associated with more complete recall. These findings establish ElephantBench as a reproducible knowledge probe for diagnosing epistemic myopia in parametric memory. More broadly, our graph-based benchmark construction pipeline provides an efficient and scalable way to turn long-tail corpora into source-traceable knowledge probes, supporting efforts to evaluate and advance the epistemic rigour of next-generation LLMs. Code is available at https://github.com/Tencent/ElephantBench.', 'score': 13, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'a6132b6882b86f7d', 'authors': ['Zhuoshi Pan', 'Junru Lu', 'Yan Qian', 'H. Vicky Zhao', 'Di Yin', 'Xing Sun'], 'affiliations': ['Tencent Youtu Lab', 'Tsinghua University', 'University of Warwick'], 'pdf_title_img': 'assets/pdf/title_img/2608.28478.jpg', 'data': {'categories': [], 'emoji': '🐘', 'ru': {'title': 'Диагностика неполноты знаний: когда языковые модели забывают альтернативные версии фактов', 'desc': 'Работа представляет ElephantBench — набор данных из 1,094 вопросов для оценки способности больших языковых моделей запоминать множественные противоречивые версии фактов с низкой частотностью. Авторы разработали конвейер на основе графов, который извлекает конфликтующие версии из веб-корпуса, верифицирует их с помощью исходных документов и человеческих аннотаторов. Тестирование 32 моделей показало, что даже лучшие модели восстанавливают обе версии только в 52,4% случаев, в остальном вспоминая только одну из них. Результаты демонстрируют, что увеличение размера модели и применение методов рассуждения улучшают полноту воспроизведения, но не устраняют фундаментальную проблему неполноты знаний.'}, 'en': {'title': 'ElephantBench: Uncovering Knowledge Gaps in Language Models', 'desc': "The paper introduces ElephantBench, a tool designed to evaluate how well large language models (LLMs) remember conflicting information about less common facts. It uses a graph-based method to create questions that can be verified against reliable sources, highlighting the models' tendency to miss alternative perspectives. The study finds that even the best-performing models only recall both sides of a fact about half the time, indicating a significant gap in their knowledge. This research not only identifies issues in LLMs' memory but also provides a framework for improving their understanding of complex information."}, 'zh': {'title': '揭示大型语言模型的知识盲点', 'desc': 'ElephantBench 是一个评估大型语言模型（LLMs）是否保留多个相互矛盾的长尾事实的工具。它通过图形化的管道生成可验证的多账户问题，揭示了广泛存在的知识不完整性。研究表明，即使是最强的模型，在52.4%的问题上也只能恢复两个账户中的一个，而在几乎所有其他问题上则只记住一个账户而遗漏另一个。该研究为评估和提升下一代 LLMs 的知识严谨性提供了有效的工具。'}}}, {'id': 'https://huggingface.co/papers/2608.27370', 'title': "Puro-2B: Poor Lab's Qwen2-1.5B Trained on RTX 5090 within $5090", 'url': 'https://huggingface.co/papers/2608.27370', 'abstract': 'Abstract A cost-efficient open-source pretraining recipe trains 2B-parameter models on consumer GPUs for under $7K, yielding performance near larger baselines while deriving cost scaling laws and studying data curricula.  Generated by thinkingmachines/Inkling-Small Language model pretraining has become almost synonymous with prohibitive cost, placing it out of reach for much of the academic and open-source communities. Although strong open-source efforts already exist, including open-weight models and open-source training recipes, a cost-efficient, hardware-accessible, and open-source pretraining recipe has long been missing. Even at a small scale, training Llama-3.2-3B costs over \\1.5M, and reproducing SmolLM3-3B needs over 700K. In this report, we present an open pretraining recipe designed to lower this barrier. Using this recipe, we train a collection of Puro-2B models from scratch on up to 1.4 trillion tokens with FP8 precision on consumer-grade RTX 5090 GPUs. The models in the collection differ in token budgets and selected recipe variants. Our best model is trained at a compute cost of less than \\6.9K and approaches Qwen2.5-1.5B performance under our evaluation protocol. This cost efficiency is enabled by a combination of approaches, including hardware selection, low-precision training, hyperball optimization, curriculum model averaging, and the data recipe. Beyond the recipe itself, we provide two additional results. First, across the Puro-2B collection, we derive a Puro Cost Scaling Law that relates training cost to average model performance; the fitted law suggests that about 4.4K, less than \\$5,090, is sufficient to reach the performance of Qwen2-1.5B. Second, as an end-to-end case study, we examine how pretraining data curricula shape downstream performance after post-training. Such controlled studies are enabled by having access to the full pretraining pipeline rather than model weights alone. We release the full training recipe for Puro-2B, including data, code, and model weights under Apache 2.0 at https://huggingface.co/collections/thu-pacman/puro-2b.', 'score': 13, 'issue_id': 3192, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'e768091531265859', 'authors': ['Kairong Luo', 'Jiarui Cui', 'Yaorui Yin', 'Shengqi Chen', 'Yiming Yang', 'Linxiang Gao', 'Yanmohan Wang', 'Mingzhe Zhang', 'Kaiyue Wen', 'Kaifeng Lyu', 'Wenguang Chen'], 'affiliations': ['Pengcheng Laboratory', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27370.jpg', 'data': {'categories': ['#small_models', '#training', '#open_source', '#optimization', '#dataset'], 'emoji': '💰', 'ru': {'title': 'Демократизация предобучения языковых моделей через доступный рецепт на потребительском оборудовании', 'desc': 'Исследователи разработали доступный рецепт предобучения для тренировки моделей с 2 миллиардами параметров на потребительских GPU менее чем за 7000 долларов. Используя техники низкоточной арифметики (FP8), оптимизацию гиперпараметров и усреднение моделей по curriculum, они достигли производительности, близкой к более крупным базовым моделям. Авторы вывели закон масштабирования вычислительных затрат для своей коллекции Puro-2B и исследовали, как различные стратегии формирования обучающих данных влияют на качество финальной модели. Полный рецепт, включая код, данные и веса моделей, открыто опубликован для воспроизведения результатов научным сообществом.'}, 'en': {'title': 'Affordable Large Language Model Training for Everyone', 'desc': 'This paper presents a cost-effective open-source pretraining recipe for training large language models with 2 billion parameters on consumer-grade GPUs. The approach allows for training these models for under $7,000, making advanced machine learning more accessible to researchers and developers. The authors explore various techniques such as low-precision training and curriculum model averaging to optimize performance while minimizing costs. Additionally, they introduce a Puro Cost Scaling Law that connects training expenses to model performance, demonstrating that significant results can be achieved with limited resources.'}, 'zh': {'title': '开源预训练，低成本高性能！', 'desc': '这篇论文介绍了一种成本效益高的开源预训练方案，可以在消费级GPU上以不到7000美元的成本训练出2B参数的模型。该方案通过使用低精度训练、硬件选择和数据课程等方法，显著降低了训练成本，同时在性能上接近更大规模的基线模型。研究还提出了Puro成本缩放法则，表明大约4400美元的成本足以达到Qwen2-1.5B的性能。最后，论文提供了完整的训练配方，包括数据、代码和模型权重，供学术界和开源社区使用。'}}}, {'id': 'https://huggingface.co/papers/2608.25417', 'title': 'Paint What You See: Benchmarking Dexterous Visual Tool Use in Multimodal Agents', 'url': 'https://huggingface.co/papers/2608.25417', 'abstract': 'Abstract EASEL benchmarks fine-grained visual tool use through reference-guided reconstruction and semantic tasks, revealing that current multimodal agents struggle with closed-loop precision and trajectory stability.  Generated by thinkingmachines/Inkling-Small Evaluation is shifting from static QA toward agentic settings where models act through external tools. We identify a critical yet underexplored capability within this space - dexterous visual tool use: fine-grained, closed-loop parameterized visual action in which models infer tool parameters from visual evidence, and those parameters directly govern the final result. Existing benchmarks cover web navigation, GUI operation, and software engineering, but rarely target this coupling between visual evidence and execution precision. We propose EASEL, a benchmark evaluating a controlled instance of dexterous visual tool use that adopts reference-guided visual reconstruction as its primary proxy task: the agent incrementally paints a canvas to match a reference image. EASEL additionally includes semantic tasks spanning region annotation, handwriting, and path planning. We further provide EASEL-Data, a 440k-sample two-stage curriculum dataset for trajectory supervision, and EASEL-9B to investigate its effect on this capability. Evaluation of 25 models reveals that current multimodal agents systematically struggle on EASEL. Reconstruction similarity bottlenecks at low levels (0.40-0.54), while trajectory diagnostics expose severe closed-loop instability - models typically saturate early or degrade post-peak. Semantic tasks reveal sharp capability boundaries in precision annotation and path planning. EASEL-9B, trained on EASEL-Data, surpasses the base model by a relative 6.3%, ranking third among all evaluated models.', 'score': 13, 'issue_id': 3192, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': '7ea85b0f6c0f921a', 'authors': ['Shudong Liu', 'Dongyang Chen', 'Enci Zhang', 'Jinwei Liang', 'Zheng Ma', 'Lewei Lu'], 'affiliations': ['Peking University', 'SenseTime Research', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.25417.jpg', 'data': {'categories': ['#benchmark', '#small_models', '#multimodal', '#cv', '#agents', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'От восприятия к прецизионному действию: обучение визуальному управлению инструментами', 'desc': 'Работа представляет EASEL - бенчмарк для оценки способности мультимодальных агентов к точному визуальному управлению инструментами через задачи восстановления изображений и семантическую разметку. Авторы выявили, что современные модели испытывают серьёзные затруднения с закрытым циклом управления и стабильностью траекторий действий, достигая низких показателей схожести восстановления (0.40-0.54). Для решения этой проблемы предложен датасет EASEL-Data с 440k примерами для обучения с учителем и модель EASEL-9B, которая показывает на 6.3% лучший результат по сравнению с базовой моделью. Бенчмарк включает задачи рисования на канве, аннотации регионов, рукописного ввода и планирования пути, выявляя критические ограничения современных мультимодальных агентов.'}, 'en': {'title': 'EASEL: Benchmarking Precision in Visual Tool Use for Multimodal Agents', 'desc': 'The paper introduces EASEL, a benchmark designed to assess fine-grained visual tool use in multimodal agents through reference-guided reconstruction and semantic tasks. It highlights the challenges these agents face in achieving closed-loop precision and maintaining trajectory stability during visual tasks. The benchmark focuses on the relationship between visual evidence and execution precision, which has been underexplored in existing evaluations. EASEL includes a dataset for trajectory supervision and demonstrates that current models struggle significantly with the tasks, revealing critical areas for improvement in dexterous visual tool use.'}, 'zh': {'title': 'EASEL：提升视觉工具使用精度的基准测试', 'desc': 'EASEL基准测试通过参考引导重建和语义任务评估细粒度的视觉工具使用，揭示了当前多模态代理在闭环精度和轨迹稳定性方面的不足。该研究提出了一种新的能力，即灵巧的视觉工具使用，强调模型如何从视觉证据中推断工具参数，并直接影响最终结果。EASEL基准测试的主要任务是通过逐步绘制画布来匹配参考图像，同时还包括区域标注、手写和路径规划等语义任务。评估结果显示，现有多模态代理在EASEL上表现不佳，重建相似度和轨迹稳定性均存在显著瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2608.24777', 'title': 'StepGuard: Learning Step-Level Guardrails with Scalable Supervision and Safety-Utility Balancing', 'url': 'https://huggingface.co/papers/2608.24777', 'abstract': 'Abstract StepGuard is a step-level guard model that audits agent actions before execution, trained via automatic trajectory generation and balanced reinforcement learning to reduce attacks with minimal utility loss.  Generated by thinkingmachines/Inkling-Small LLM-based agents can interact with external environments through tool invocation, but this capability also introduces security risks such as file modification, information leakage, and unauthorized actions. Existing guardrails often evaluate completed trajectories, leaving pre-execution monitoring of step-level actions underexplored. We propose StepGuard, a step-level guard model that can audit completed agent trajectories and check tool actions before they are executed. To train StepGuard, we introduce StepGen, an automatic data engine that generates safe and unsafe trajectories with the same context but different actions at the risky step. To further reduce over-defense and under-defense, we propose Balance-GRPO, which dynamically balances learning between safe and unsafe actions based on their observed accuracy. Experiments show that StepGuard achieves the highest average accuracy among open-weight guard models, with performance comparable to GPT-5.4. When used to guard agents on AgentDojo and AgentDyn, StepGuard reduces mean attack success rate by 77.3% relative to the no-guard setting, while mean utility drops by only 2.8 percentage points.', 'score': 13, 'issue_id': 3192, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '36d1a4adca8d2dfe', 'authors': ['Zhijie Zheng', 'Yu Li', 'Chen Qian', 'Yuqian Fu', 'Yanwei Fu', 'Lu Sheng', 'Jing Shao', 'Dongrui Liu'], 'affiliations': ['Beihang University', 'Fudan University', 'KAUST', 'Renmin University of China', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.24777.jpg', 'data': {'categories': ['#optimization', '#security', '#open_source'], 'emoji': '🛡️', 'ru': {'title': 'Контроль безопасности действий агентов перед их выполнением', 'desc': 'StepGuard — это модель-охранник уровня шагов, которая проверяет действия агента перед их выполнением. Модель обучается на автоматически сгенерированных траекториях с использованием сбалансированного алгоритма обучения с подкреплением (Balance-GRPO), который динамически балансирует обучение между безопасными и опасными действиями. StepGen — это механизм автоматического создания данных, генерирующий пары траекторий с одинаковым контекстом, но различными действиями на критическом шаге. Эксперименты показывают, что StepGuard снижает успешность атак на 77,3% при минимальной потере полезности функционала агента (всего 2,8 процентных пункта).'}, 'en': {'title': 'StepGuard: Securing Agent Actions with Pre-Execution Audits', 'desc': "StepGuard is a novel guard model designed to enhance the security of agent actions by auditing them before execution. It utilizes a technique called automatic trajectory generation to create both safe and unsafe action scenarios, which helps in training the model effectively. The model employs balanced reinforcement learning through a method named Balance-GRPO, which ensures that the learning process is optimized between safe and unsafe actions. Experimental results demonstrate that StepGuard significantly reduces the success rate of attacks while maintaining a minimal impact on the utility of the agent's actions."}, 'zh': {'title': 'StepGuard：智能代理的安全守护者', 'desc': 'StepGuard是一种逐步级别的保护模型，能够在执行之前审计代理的动作。它通过自动轨迹生成和均衡强化学习进行训练，以减少攻击并保持最小的效用损失。我们引入了StepGen，一个自动数据引擎，生成具有相同上下文但在风险步骤上采取不同动作的安全和不安全轨迹。实验表明，StepGuard在开放权重保护模型中实现了最高的平均准确率，并显著降低了攻击成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.18524', 'title': 'DART-SD: Diamond-topology Aware Retrieval and Tuning for Self-Distillation of Multi-Turn Tool-Calling Agents', 'url': 'https://huggingface.co/papers/2608.18524', 'abstract': 'Abstract DART-SD improves multi-turn tool-calling agents by modeling execution as a diamond-topology graph, identifying critical failure points, and applying localized self-distillation to preserve valid reasoning while correcting errors.  Generated by thinkingmachines/Inkling-Small Equipping Large Language Models (LLMs) with multi-turn tool-calling capabilities is essential for building autonomous agents. However, progress is fundamentally limited by the reliance on full-length trajectory imitation. For tasks involving multiple order-independent sub-goals, the optimal solution space forms a vast combinatorial diamond lattice. Forcing this rich topology into monolithic trajectories causes a severe topological collapse, indiscriminately penalizing valid alternative explorations and severely degrading policy diversity. To address this, we propose DART-SD (Diamond-topology Aware Retrieval and Tuning for Self-Distillation), a novel framework that shifts the paradigm from global forcing to topology-guided localized correction. DART-SD first models the execution process as a converging Interaction-State Transition Graph (ISTG), faithfully capturing the inherent diamond topology of successful and failed exploratory paths. During autonomous rollouts, the framework identifies the Critical Topological Breakpoint (CTB) and retrieves success-supported recovery references. Finally, we introduce a progressive self-distillation paradigm through CTB-guided localized supervision, ensuring that the training loss is calculated exclusively on the generated recovery steps while strictly protecting the valid reasoning prefix from destructive gradient updates. Experiments on complex multi-turn tool-calling benchmarks demonstrate that DART-SD significantly outperforms traditional full-trajectory baselines.', 'score': 11, 'issue_id': 3192, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '7bcde70756663fcf', 'authors': ['Hangrui Xu', 'Jiarui Wang', 'Yang Yang', 'Chuanbo Zhu', 'Fangda Chen', 'Ziqi Wu', 'Jingming Cai', 'Yan Song'], 'affiliations': ['ByteDance', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.18524.jpg', 'data': {'categories': ['#training', '#agents', '#rlhf'], 'emoji': '💎', 'ru': {'title': 'Сохранять валидные пути, исправлять ошибки локально', 'desc': 'DART-SD — это новая методология для обучения агентов на основе LLM, способных использовать инструменты в несколько шагов. Авторы предлагают моделировать процесс выполнения задач как граф переходов состояний, который отражает алмазную топологию — множество валидных альтернативных путей решения. Фреймворк определяет критические точки отказа в процессе инференса и применяет локализованную дистилляцию знаний, обновляя только ошибочные шаги, чтобы защитить корректные рассуждения от разрушительных градиентных обновлений. Эксперименты показывают значительное улучшение по сравнению с традиционными методами полной траекторной имитации.'}, 'en': {'title': 'Enhancing Multi-Turn Agents with Diamond-Topology Insights', 'desc': 'DART-SD is a new framework designed to enhance multi-turn tool-calling agents by using a diamond-topology graph to model their execution. It identifies critical failure points during the process and applies localized self-distillation to maintain valid reasoning while correcting mistakes. This approach allows the model to focus on successful recovery paths instead of penalizing all alternatives, which improves policy diversity. Experiments show that DART-SD outperforms traditional methods that rely on full-length trajectory imitation.'}, 'zh': {'title': 'DART-SD：拓扑引导的自蒸馏新框架', 'desc': 'DART-SD是一种改进多轮工具调用代理的方法，通过将执行过程建模为钻石拓扑图，识别关键失败点，并应用局部自蒸馏来保持有效推理并纠正错误。该框架改变了从全局强制到拓扑引导的局部修正的范式，能够更好地处理多个无序子目标的任务。DART-SD通过构建交互状态转移图（ISTG）来捕捉成功和失败路径的内在钻石拓扑，并在自主执行过程中识别关键拓扑断点（CTB）。实验结果表明，DART-SD在复杂的多轮工具调用基准测试中显著优于传统的全轨迹基线。'}}}, {'id': 'https://huggingface.co/papers/2608.28192', 'title': 'Locate Anything in Videos: Rethinking Efficient Generative Spatio-Temporal Video Grounding', 'url': 'https://huggingface.co/papers/2608.28192', 'abstract': 'Abstract Parallel Tube Decoding enables simultaneous spatial and temporal video grounding by removing autoregressive dependencies, drastically cutting latency while improving accuracy.  Generated by thinkingmachines/Inkling-Small Spatio-temporal video grounding (STVG) requires models to identify when a referred event occurs and localize the target entity throughout that interval. Existing multimodal large language models typically serialize dense localization trajectories autoregressively, causing decoding latency to grow with tube length and allowing localization errors to propagate across time. We introduce Parallel Tube Decoding (PTD), a generative formulation that decomposes grounding into a temporal block followed by time-conditioned spatial blocks decoded simultaneously. This removes both token-level and trajectory-level dependencies, reducing the sequential decoding depth to a fixed 1 + 1 rounds, independent of tube length. To enable parallel spatial generation, we introduce Decoupled Block Attention, which preserves access to shared video-query context while eliminating cross-box dependencies, together with localization-aware policy optimization for temporal boundaries and spatial geometry. On VidSTG, PTD reduces Tube Completion Latency by 79x and increases spatial decoding throughput by 92x over standard autoregressive decoding, while also improving grounding accuracy. With a compact 4B backbone, our model performs favorably well on VidSTG and HC-STVG, and generalizes zero-shot to temporal grounding, grounded VideoQA, and referring video object tracking. Our results show parallel tube generation is an efficient and effective alternative to autoregressive localization in videos.', 'score': 10, 'issue_id': 3192, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'ca3194eddf4ce3d8', 'authors': ['Hanoona Rasheed', 'Haania Siddiqui', 'Ming-Hsuan Yang', 'Fahad Shahbaz Khan', 'Salman Khan'], 'affiliations': ['Apertix', 'Mohamed bin Zayed University of Artificial Intelligence', 'University of California, Merced'], 'pdf_title_img': 'assets/pdf/title_img/2608.28192.jpg', 'data': {'categories': ['#inference', '#video', '#multimodal'], 'emoji': '⚡', 'ru': {'title': 'Параллельное декодирование вместо последовательного: революция в скорости видеогрундинга', 'desc': 'Статья предлагает метод Parallel Tube Decoding для одновременной пространственно-временной привязки объектов в видео, который избегает авторегрессивного декодирования и, как следствие, значительно снижает задержку обработки. Вместо последовательной генерации координат объекта во времени, метод разбивает задачу на временной блок и параллельно декодируемые пространственные блоки, что убирает зависимости между предсказаниями. Введён механизм Decoupled Block Attention, который позволяет моделям сохранять контекст видео-запроса при устранении кросс-зависимостей между окнами локализации. На бенчмарке VidSTG метод достигает 79-кратного сокращения времени декодирования и улучшения точности грундинга с компактной 4B моделью.'}, 'en': {'title': 'Revolutionizing Video Grounding with Parallel Tube Decoding', 'desc': 'This paper presents Parallel Tube Decoding (PTD), a new method for improving video grounding by processing spatial and temporal information simultaneously. Traditional methods rely on autoregressive decoding, which can slow down the process and lead to errors as the length of the video increases. PTD eliminates these dependencies by using a generative approach that decodes temporal and spatial information in parallel, significantly reducing latency and enhancing accuracy. The authors demonstrate that their model outperforms existing techniques in terms of speed and precision on various video grounding tasks.'}, 'zh': {'title': '并行管道解码：高效视频定位的新方法', 'desc': '并行管道解码（PTD）通过消除自回归依赖，实现了视频的空间和时间同时定位，显著降低了延迟并提高了准确性。该方法将定位过程分解为时间块和时间条件空间块的同时解码，避免了传统方法中因管道长度增加而导致的解码延迟和错误传播。我们引入了解耦块注意力机制，确保在生成空间信息时仍能访问共享的视频查询上下文，同时消除了跨框依赖。实验结果表明，PTD在VidSTG数据集上将管道完成延迟减少了79倍，并提高了空间解码吞吐量92倍，同时在多个任务上表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.24115', 'title': 'PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control', 'url': 'https://huggingface.co/papers/2608.24115', 'abstract': "Abstract PonderPounce leverages native causal context in multimodal language models as robot episode memory, jointly training a reasoning System2 module and a fast System1 action model to improve long-horizon policy performance without dedicated memory architectures.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) can integrate long visual histories, reason under partial observability, and infer behavior from a few examples. Yet vision-language-action (VLA) models generally inherit pretrained representations without using this contextual capacity as episode memory. Memory-dependent policies address this gap through purpose-built history mechanisms. PonderPounce instead reuses an MLLM's native causal context as robot memory. Ponder, a System2 MLLM, accumulates episode observations, demonstrations, and prior cognition in its native causal context and can generate subgoal text and demonstration reasoning for internal use. Pounce, a System1 VLA, receives the current observation, instruction, and proprioception directly; through the Ponder--Pounce interface, it asynchronously receives only the newest continuous cognition token and its age. Both are jointly trained end to end without a purpose-built memory module or separate bridge pretraining. Optimized serving achieves p50 latencies of 78ms for cognition refresh and 25ms for action-model invocation, supporting 20Hz action playback. On RoboMME with base-scale training data, PonderPounce reaches 60.83% with 9B and 50.04% with 0.8B under the same Pounce architecture and interface, versus 44.51% for FrameSamp+Modul and 17.93% for the current-observation π_{0.5}. With 9x data, it reaches 75.54% versus 57.88% for FrameSamp+Modul. On RoboCasa-DC, the same interface learns from action supervision alone and reaches 12.5% versus 11.6% for the strongest published demonstration-conditioned baseline, falling to 8.6% when cognition is replaced by a learned null state.", 'score': 10, 'issue_id': 3191, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '63249266d3374eff', 'authors': ['Suhwan Choi', 'Jaeyoon Jung', 'Sungkyung Kim', 'Yunsung Lee', 'Youngjae Yu'], 'affiliations': ['MAUM.AI', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2608.24115.jpg', 'data': {'categories': ['#robotics', '#optimization', '#multimodal', '#training', '#reasoning', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Двухсистемная архитектура для памяти робота через встроенный контекст языковой модели', 'desc': 'PonderPounce — это система для управления роботами, которая использует встроенный причинный контекст мультимодальных языковых моделей в качестве памяти эпизода. Система состоит из двух компонентов: Ponder (System2 модуль для рассуждений), который накапливает наблюдения и генерирует промежуточные цели, и Pounce (System1 модель действий), которая принимает текущее состояние и выполняет действия, получая информацию от Ponder через асинхронный интерфейс. Оба компонента обучаются совместно end-to-end без отдельных архитектур памяти, что позволяет эффективно использовать контекст предварительно обученной языковой модели. Экспериментальные результаты показывают значительное улучшение производительности длинногоризонтной политики управления робота по сравнению с базовыми подходами, достигая низких латентностей (78ms для рассуждений и 25ms для действий) при поддержке частоты 20Hz.'}, 'en': {'title': 'Harnessing Causal Context for Enhanced Robot Memory', 'desc': "PonderPounce is a novel approach that utilizes the inherent causal context of multimodal language models (MLLMs) to enhance robot memory without needing specialized memory systems. It combines two components: Ponder, a System2 module that accumulates observations and reasoning, and Pounce, a System1 action model that executes actions based on current inputs. This method allows for efficient long-horizon policy performance by leveraging the MLLM's existing capabilities for reasoning and action generation. The system is trained end-to-end, achieving significant improvements in performance on robotic tasks compared to traditional methods."}, 'zh': {'title': '利用因果上下文提升机器人记忆的智能策略', 'desc': 'PonderPounce 是一种利用多模态语言模型的因果上下文作为机器人记忆的方法。它联合训练了一个推理系统（System2）和一个快速行动模型（System1），以提高长期策略的表现，而无需专门的记忆架构。通过重用多模态大语言模型的因果上下文，PonderPounce 能够有效地积累观察、演示和先前的认知。该方法在 RoboMME 和 RoboCasa-DC 数据集上表现出色，显著提高了任务完成率。'}}}, {'id': 'https://huggingface.co/papers/2608.27763', 'title': 'Fast Weight Attention for Continual Learning', 'url': 'https://huggingface.co/papers/2608.27763', 'abstract': 'Abstract Recurrent fast-weight memories and selective state-space models are analyzed as online learning rules under autoregressive semantics, yielding normalized update families with stable renormalization that improve length extrapolation.  Generated by thinkingmachines/Inkling-Small Recurrent fast-weight memories and selective state-space models compress an expanding context into a fixed-size recurrent state, making the state transition an online learning rule. We study this rule under read-after-write autoregressive semantics. For the prefix-prediction objective considered here, the local fast-memory example revealed at step t is the prefix-aligned pair (x_t,y_t)=(ϕ(k_{t-1}),v_t). The common same-step association (ϕ(k_t),v_t) remains causal, but optimizes a different internal objective. We derive normalized first-order updates for squared-error regression and negative inner-product objectives. The regression family comprises Falcon-1 (a scalar NLMS update), Falcon-2 (its per-column extension), and Falcon-3 (a sliding-window mini-batch update); Falcon-1A/Falcon-2A/Falcon-3A are the corresponding inner-product variants. We provide recurrent, masked-parallel, and chunk-parallel forms, together with numerically stable positive-decay renormalization. Representative variants remain competitive in language modeling and improve length extrapolation on variable-digit addition. This framework separates temporal alignment, plasticity, forgetting, and bounded rehearsal in recurrent sequence models.', 'score': 8, 'issue_id': 3192, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '3b4fe919cb8116d3', 'authors': ['Yifan Zhang', 'Steve Ta', 'Jasper Zhang', 'Jichen Feng', 'Shuzhen Li', 'Yongxin Zhang', 'Yifeng Liu', 'Huizhuo Yuan', 'Mengdi Wang', 'Quanquan Gu', 'Andrew Chi-Chih Yao'], 'affiliations': ['Bytedance Seed', 'Hyperbolic Labs', 'Princeton University', 'Tsinghua University', 'UCLA'], 'pdf_title_img': 'assets/pdf/title_img/2608.27763.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Нормализованные правила онлайн-обучения для рекуррентных последовательностных моделей', 'desc': 'В работе исследуются рекуррентные быстрые памяти и селективные модели пространства состояний как правила онлайн-обучения с авторегрессивной семантикой. Авторы выводят нормализованные семейства обновлений с устойчивой ренормализацией, которые улучшают экстраполяцию на длинные последовательности. Предложены варианты алгоритмов Falcon с различными целевыми функциями (квадратичная ошибка и внутренний продукт) и реализациями (рекуррентная, параллельная с маской, параллельная по блокам). Демонстрируется, что предложенный подход конкурирует с существующими методами в языковом моделировании и достигает лучшей экстраполяции на задачах с переменной длиной.'}, 'en': {'title': 'Enhancing Online Learning with Recurrent Fast-Weight Memories', 'desc': 'This paper explores recurrent fast-weight memories and selective state-space models as methods for online learning in autoregressive contexts. These models effectively compress information into a fixed-size state, allowing for efficient state transitions during learning. The authors derive normalized update rules for various regression objectives, enhancing performance in tasks like language modeling and length extrapolation. The framework also distinguishes between different aspects of learning, such as temporal alignment and plasticity, which are crucial for improving model performance.'}, 'zh': {'title': '递归模型中的在线学习与长度外推优化', 'desc': '本文分析了递归快速权重记忆和选择性状态空间模型在自回归语义下的在线学习规则。这些模型能够将扩展的上下文压缩为固定大小的递归状态，从而使状态转移成为一种在线学习规则。我们研究了在读后写自回归语义下的更新规则，并推导出平方误差回归和负内积目标的标准化一阶更新。该框架在语言建模中表现出竞争力，并在可变数字加法的长度外推上有所改善。'}}}, {'id': 'https://huggingface.co/papers/2608.26794', 'title': 'Ring Forcing: Towards Precise Long-Term Memory for Autoregressive Video Diffusion', 'url': 'https://huggingface.co/papers/2608.26794', 'abstract': 'Abstract Ring Forcing is an autoregressive video diffusion framework that improves long-term memory through ring-structured training, history compression, and sparse rotary embeddings to achieve minute-long coherence.  Generated by thinkingmachines/Inkling-Small Scaling video generation to long durations reveals a critical bottleneck: current models lack robust long-term memory. This deficiency can be studied along two critical aspects: object permanence, the ability to precisely reproduce the appearance of objects upon re-entry; and memory capacity, the ability to process ultra-long context and use information from distant history. Robust long-term memory requires both: object permanence without sufficient context handling limits the temporal scope, while long context length without permanence fails to maintain identity. To address this, we present Ring Forcing, an autoregressive video diffusion framework designed to robustly construct and precisely utilize long-term memory. Our ring-structured training strategy enforces retrieval from distant history, effectively reconciling the trade-off between strict historical adherence and generative diversity. To expand memory capacity, we introduce a compression and timestep composition strategy. Under fixed sequence length constraints, this method extends the effective historical span to minutes-long durations and achieves a comprehensive receptive field over the entire history. Furthermore, we present a sparse RoPE mechanism to enable flexible, scalable memory adaptation while fully exploiting pre-trained priors. Extensive experiments demonstrate that Ring Forcing achieves superior minutes-long coherence and object permanence, significantly outperforming state-of-the-art methods.', 'score': 5, 'issue_id': 3192, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': 'b13798c60c1b8b3e', 'authors': ['Bowen Xue', 'Brandon Y. Feng', 'Chenguo Lin', 'Yuchen Lin', 'Yujia Zeng', 'Lvmin Zhang', 'Maneesh Agrawala', 'Honglei Yan', 'Panwang Pan'], 'affiliations': ['ByteDance', 'Massachusetts Institute of Technology', 'Peking University', 'Stanford University', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2608.26794.jpg', 'data': {'categories': ['#diffusion', '#video', '#training', '#architecture', '#long_context'], 'emoji': '🎬', 'ru': {'title': 'Кольцевая память для долгосрочной согласованности видео', 'desc': 'Ring Forcing — это авторегрессивный фреймворк для видео-диффузии, который решает проблему долгосрочной памяти в генерации видео. Авторы предлагают кольцевую стратегию обучения, которая заставляет модель извлекать информацию из далекого прошлого, а также используют сжатие истории и разреженные ротационные embeddings. Эти методы позволяют модели одновременно сохранять постоянство объектов (их корректное восстановление при повторном появлении) и обрабатывать ультрадолгий контекст. В результате модель достигает согласованности в генерации видео длительностью в минуты, значительно превосходя существующие подходы.'}, 'en': {'title': 'Enhancing Video Coherence with Ring Forcing', 'desc': 'Ring Forcing is a new framework for generating videos that focuses on improving long-term memory retention. It uses a unique training method that organizes data in a ring structure, allowing the model to effectively recall information from the past while generating new content. The framework addresses two key challenges: maintaining the identity of objects over time (object permanence) and handling long sequences of information (memory capacity). By combining these strategies, Ring Forcing achieves impressive coherence in videos that last for minutes, outperforming existing models in the field.'}, 'zh': {'title': '增强视频生成的长期记忆能力', 'desc': 'Ring Forcing是一种自回归视频扩散框架，通过环状训练、历史压缩和稀疏旋转嵌入来增强长期记忆，从而实现分钟级的连贯性。当前模型在长时间记忆方面存在瓶颈，主要体现在物体持久性和记忆容量两个方面。Ring Forcing通过环状训练策略有效地从远程历史中检索信息，平衡了历史遵循性和生成多样性之间的权衡。实验结果表明，Ring Forcing在分钟级连贯性和物体持久性方面显著优于现有的最先进方法。'}}}, {'id': 'https://huggingface.co/papers/2608.28549', 'title': 'Video Generative Models as Geometry Learner', 'url': 'https://huggingface.co/papers/2608.28549', 'abstract': 'Abstract GeoNeXt repurposes pretrained video generative models as a unified framework for geometry estimation via next-frame prediction, enabling efficient joint modeling of depth and surface normals with minimal labeled data.  Generated by thinkingmachines/Inkling-Small Recent generative approaches to geometry estimation adapt pretrained image diffusion models and treat the task as image-conditioned generation. Leveraging off-the-shelf image diffusion models, they either (i) train task-specific geometry models (for depth and surface normal estimation) independently, losing the opportunity of exploring the intrinsic correlation of these geometric targets, or (ii) jointly fine-tune modified image diffusion backbones (e.g., altered self-attention), which typically demands substantial labeled data. To overcome these limitations in a principled fashion, we repurpose pretrained video generative models as a unified and data-efficient framework for geometry estimation, formulated innovatively as a next-frames prediction task. Our method, GeoNeXt, inherits naturally structured knowledge and richer priors from the video model, while further adapting them for joint modeling of images and geometry targets (image <-> geometry), enabling more data efficient and effective learning of geometry. Extensive experiments validate our method for zero-shot monocular depth and surface normal estimation across diverse datasets, outperforming both previous task-specific and unified generative competitors while using substantially less training data. Notably, our method rivals discriminative state-of-the-art approaches trained on over 100x more data and even standouts on several benchmarks.', 'score': 4, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '93e1c69b842dff68', 'authors': ['Haosen Yang', 'Jifei Song', 'Zhensong Zhang', 'Xiatian Zhu', 'Jiankang Deng'], 'affiliations': ['Imperial College London', 'University of Surrey'], 'pdf_title_img': 'assets/pdf/title_img/2608.28549.jpg', 'data': {'categories': ['#video', '#diffusion', '#training', '#transfer_learning', '#synthetic', '#cv'], 'emoji': '🎬', 'ru': {'title': 'От видео к геометрии: единый фреймворк через предсказание кадров', 'desc': 'GeoNeXt переосмысляет предобученные видеогенеративные модели как единую архитектуру для оценки геометрии, формулируя задачу как предсказание следующего кадра. Метод совместно моделирует глубину и нормали поверхности, естественно наследуя структурированное знание из видеомоделей с более богатыми априорными представлениями. Подход требует минимальное количество размеченных данных благодаря эффективной адаптации образных представлений из видеодомена. Эксперименты показывают, что GeoNeXt превосходит специализированные и другие объединённые методы, достигая производительности дискриминативных моделей, обученных на 100 раз большем объёме данных.'}, 'en': {'title': 'Revolutionizing Geometry Estimation with Video Models', 'desc': 'GeoNeXt is a novel approach that uses pretrained video generative models to estimate geometry, specifically depth and surface normals, by predicting the next frame in a sequence. This method allows for efficient joint modeling of geometric targets with minimal labeled data, overcoming limitations of previous methods that either trained models independently or required extensive fine-tuning. By leveraging the structured knowledge from video models, GeoNeXt enhances the learning process for geometry estimation, making it more effective and data-efficient. Experimental results show that GeoNeXt performs exceptionally well in zero-shot scenarios, surpassing traditional methods that rely on much larger datasets.'}, 'zh': {'title': 'GeoNeXt：高效的几何估计新方法', 'desc': 'GeoNeXt是一种新方法，它利用预训练的视频生成模型来进行几何估计，特别是通过预测下一帧来实现。这种方法可以高效地联合建模深度和表面法线，且只需很少的标记数据。与传统方法不同，GeoNeXt避免了独立训练几何模型的局限性，能够更好地探索几何目标之间的内在关联。实验结果表明，GeoNeXt在零样本单目深度和表面法线估计方面表现优异，使用的数据量远低于以往的方法。'}}}, {'id': 'https://huggingface.co/papers/2608.27906', 'title': 'Rubric-to-Code Credit Assignment for Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.27906', 'abstract': 'Abstract RCCA improves reinforcement learning for interactive web app generation by assigning localized credit to code regions based on rubric-level feedback, yielding substantial benchmark gains.  Generated by thinkingmachines/Inkling-Small Interactive web application generation requires models to produce usable HTML, CSS, and JavaScript applications from natural language requests. Unlike conventional code generation, application quality depends on multiple user-facing functional requirements, each often tied to localized code regions such as event handlers, state updates, DOM fragments, or CSS selectors. Standard GRPO collapses these structured outcomes into a
