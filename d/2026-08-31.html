    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.27549', 'title': 'Code as Worlds: Agentic Discovery of Executable World Representations for Physical Reasoning', 'url': 'https://huggingface.co/papers/2608.27549', 'abstract': 'Abstract Code-as-World represents physical environments as executable code to enable quantitative reasoning and scalable supervision for vision-language models.  Generated by thinkingmachines/Inkling-Small Physical understanding and reasoning depend on forming compact and generalizable representations of the world. While modern vision-language models can recognize and explain diverse physical events, they often lack explicit representations of the underlying mechanisms-such as object states, physical parameters, and governing dynamics-needed for reliably reasoning how the world evolves and responds to interventions. In this work, we introduce Code-as-World, a paradigm that represents physical worlds through executable world representations. By expressing physical composition, dynamic evolution, and visual appearance as executable code, Code-as-World provides a compact, quantitatively grounded, and controllable abstraction of the physical world. To construct such representations from multimodal observations, such as natural-language descriptions or real-world videos, we develop an agentic discovery loop inspired by abductive reasoning, where an agent proposes, executes, renders, verifies, and iteratively refines executable world hypotheses. As a concrete application, we use verified executable worlds to provide scalable physical supervision for training vision-language models on quantitative physical reasoning. Experiments show that Code-as-World-VL achieves state-of-the-art performance on QuantiPhy and surpasses leading proprietary models, highlighting the potential of executable world representations as a scalable foundation for physical intelligence.', 'score': 11, 'issue_id': 3191, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '245d573f48911d09', 'pdf_title_img': 'assets/pdf/title_img/2608.27549.jpg', 'data': {'categories': ['#multimodal', '#training', '#reasoning', '#benchmark', '#agents', '#open_source', '#science'], 'emoji': '🌍', 'ru': {'title': 'Физический мир как исполняемый код для рассуждений видео-языковых моделей', 'desc': 'В работе предложена парадигма Code-as-World, которая представляет физические окружения через исполняемый код, позволяя создавать компактные и управляемые абстракции реального мира. Для построения таких представлений из мультимодальных наблюдений (текстовых описаний и видео) используется агентный цикл открытия, вдохновленный абдуктивным рассуждением, где модель итеративно предлагает, выполняет и проверяет гипотезы о мире. Верифицированные исполняемые представления мира используются для обеспечения масштабируемого обучения vision-language моделей на задачах количественного физического рассуждения. Экспериментальные результаты показывают, что Code-as-World-VL достигает лучших показателей на бенчмарке QuantiPhy, превосходя ведущие проприетарные модели.'}, 'en': {'title': 'Code-as-World: Executable Representations for Enhanced Physical Reasoning', 'desc': 'The paper introduces a new approach called Code-as-World, which represents physical environments as executable code to enhance reasoning in vision-language models. This method allows for a better understanding of physical events by providing explicit representations of object states and dynamics. By using a discovery loop that iteratively refines hypotheses based on multimodal observations, the framework enables scalable supervision for training models in quantitative physical reasoning. The results demonstrate that this approach significantly improves performance on benchmarks, showcasing its potential for advancing physical intelligence in AI systems.'}, 'zh': {'title': '可执行世界：物理智能的新基础', 'desc': '本论文提出了Code-as-World的概念，将物理环境表示为可执行代码，以便于对视觉-语言模型进行定量推理和可扩展监督。通过将物理组成、动态演变和视觉外观表达为可执行代码，Code-as-World提供了一种紧凑、定量基础和可控的物理世界抽象。我们开发了一种基于溯因推理的代理发现循环，从多模态观察中构建这些表示，以便提出、执行、渲染、验证和迭代优化可执行世界假设。实验结果表明，Code-as-World-VL在定量物理推理任务中表现优异，超越了领先的专有模型，展示了可执行世界表示作为物理智能可扩展基础的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.27550', 'title': 'Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2608.27550', 'abstract': 'Abstract VLAct improves vision-language-action model performance by pre-training on diverse robot data with preserved vision-language priors and shared action semantics, achieving strong results across simulations and unseen embodiments with limited compute.  Generated by thinkingmachines/Inkling-Small Scaling robot data is crucial for building generalist Vision-Language-Action (VLA) models, yet robot trajectories are harder to scale than web-scale image-text data because embodied collection is costly and sparsely covers the physical world. This makes representation quality a central bottleneck: under a fixed robot-data budget, continued pre-training must turn limited trajectories into transferable visual-action knowledge rather than merely fit actions. We propose VLAct, a VLA-oriented VLM backbone trained on broad, heterogeneous, multi-embodiment robot data before task-specific fine-tuning. VLAct preserves the broad VLM prior and encourages shared action semantics across embodiments through VLM-prior preservation, multi-head continuous action co-supervision, and a partially unified cross-embodiment action layout, while allowing task-specific action heads during fine-tuning. Across simulation, real-world, and unseen-embodiment transfer, VLAct consistently improves downstream performance under fixed fine-tuning protocols. On LIBERO-Plus and RoboTwin 2.0, VLAct surpasses industrial VLA systems including ABot-M0 and LingBot-VLA, achieving success rates of 82.6% and 92.5%. On RoboDojo, VLAct ranks sixth among all policies by success rate and outperforms all explicitly designated world-action model (WAM) entries on both metrics. Most notably, on RoboCasa-GR1, an unseen humanoid embodiment, VLAct using only 20% of downstream trajectories outperforms the full-data GR00T-N1.6 baseline. These results are obtained using fully open-source data and only a 16-GPU training setup, showing that representation-centric continued pre-training can deliver highly competitive performance under a modest compute budget and is an important independent axis of VLA progress beyond data scaling.', 'score': 5, 'issue_id': 3191, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '0e6e041ad822639f', 'pdf_title_img': 'assets/pdf/title_img/2608.27550.jpg', 'data': {'categories': ['#training', '#multimodal', '#robotics', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Качество представлений вместо масштаба: как малобюджетное обучение делает универсальных робототехнических агентов', 'desc': 'VLAct — это модель Vision-Language-Action, которая улучшает производительность робототехнических систем через предварительное обучение на разнообразных данных с сохранением знаний из vision-language моделей и общей семантики действий. Авторы предлагают подход, где на этапе предварительного обучения используются данные от различных типов роботов, а затем проводится доводка под специфические задачи. Ключевая идея заключается в том, что качество представлений критично при ограниченном бюджете робототехнических данных, поэтому нужно развивать трансфируемые знания, а не просто переподгонять действия. Модель достигает впечатляющих результатов в симуляциях и на неизвестных конфигурациях роботов, используя только 20% данных при обучении на новых воплощениях.'}, 'en': {'title': 'VLAct: Elevating Vision-Language-Action Models with Efficient Pre-Training', 'desc': 'VLAct is a vision-language-action model that enhances performance by pre-training on a variety of robot data while maintaining important vision-language relationships and shared action meanings. It addresses the challenge of limited robot trajectory data by focusing on transforming these limited examples into useful visual-action knowledge instead of just fitting actions. The model employs a backbone that preserves broad vision-language model (VLM) knowledge and incorporates multi-embodiment action supervision, allowing it to adapt to different tasks effectively. As a result, VLAct demonstrates superior performance in simulations and real-world applications, outperforming existing industrial models with significantly less computational resources.'}, 'zh': {'title': 'VLAct：提升视觉-语言-动作模型的关键', 'desc': 'VLAct是一种改进的视觉-语言-动作(VLA)模型，通过在多样化的机器人数据上进行预训练，保留视觉-语言先验和共享动作语义，从而提升模型性能。由于机器人轨迹的收集成本高且覆盖范围有限，代表性质量成为一个关键瓶颈。VLAct在广泛的多样化机器人数据上进行训练，鼓励不同体现之间的共享动作语义，并在任务特定的微调中允许特定的动作头。实验结果表明，VLAct在多个模拟和真实世界任务中表现优异，超越了现有的工业VLA系统。'}}}, {'id': 'https://huggingface.co/papers/2608.28476', 'title': 'ContextPilot: Teaching Agents for Proactive Context Management via Fine-grained RL', 'url': 'https://huggingface.co/papers/2608.28476', 'abstract': 'Abstract ContextPilot improves long-horizon agent reasoning by expanding context-editing tools and using reinforcement learning with branch sampling to identify critical context decisions.  Generated by thinkingmachines/Inkling-Small Long-horizon agentic tasks require large language models (LLMs) to iteratively retrieve, integrate, and maintain dispersed information across multi-turn interactions, but preserving all interaction histories leads to a continuously growing working context. Recent proactive context management methods allow models to edit their own working context with specialized tools, yet they still face three key limitations: (1) a limited toolset restricted to search, deletion, and summarization, with no support for global planning, long-term memory, and adaptive compression; (2) inefficient exploration that treats context management actions uniformly despite their heterogeneous impacts on final outcomes; and (3) coarse-grained credit assignment that assigns the final trajectory-level reward to all intermediate context editing actions during RL. To bridge these gaps, we introduce ContextPilot, a proactive context management framework for long-horizon agentic reasoning. Our approach systematically augments the toolset with planning, long-term memory, and soft context offloading tools. We further propose an RL method tailored for context management, which uses context and entropy variation to identify critical editing decisions for branch sampling and estimates action-level advantages from all branched trajectories that pass through the corresponding context editing action. Experiments on long-context QA and deep search tasks show that ContextPilot achieves stronger performance with a more compact working context, consistently outperforming existing baselines across various base models and benchmarks. Code is available at https://github.com/Tencent/ContextPilot.', 'score': 4, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'eb471973663a2425', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#reasoning', '#optimization', '#long_context', '#benchmark', '#agents', '#open_source'], 'emoji': '🧠', 'ru': {'title': 'Умное управление контекстом для долгих цепочек рассуждений агентов', 'desc': 'ContextPilot — это фреймворк для управления контекстом агентов на основе больших языковых моделей при решении долгогоризонтных задач. Авторы расширили набор инструментов редактирования контекста, добавив планирование, долгосрочную память и мягкую разгрузку контекста, что позволяет моделям более эффективно работать с информацией. Предложен новый метод обучения с подкреплением, использующий выборку ветвей для определения критических решений управления контекстом и точной оценки преимуществ действий на уровне отдельных операций редактирования. Экспериментальные результаты показывают, что ContextPilot достигает лучшей производительности с более компактным рабочим контекстом на задачах вопросно-ответного поиска и глубокого поиска информации.'}, 'en': {'title': 'Empowering Long-Horizon Agents with ContextPilot', 'desc': 'ContextPilot enhances the reasoning capabilities of long-horizon agents by improving context management tools and employing reinforcement learning with branch sampling. It addresses limitations in existing methods by introducing a broader toolset that includes global planning and long-term memory, allowing for more effective context editing. The proposed reinforcement learning approach focuses on identifying critical context decisions and assigning action-level advantages, leading to better exploration and credit assignment. Experiments demonstrate that ContextPilot not only maintains a more compact working context but also outperforms existing models in various tasks.'}, 'zh': {'title': 'ContextPilot：提升长时间推理的上下文管理', 'desc': 'ContextPilot 是一个用于长时间推理的主动上下文管理框架。它通过扩展上下文编辑工具和使用强化学习来识别关键的上下文决策，从而改善智能体的推理能力。该方法解决了现有上下文管理工具的局限性，增加了规划、长期记忆和软上下文卸载工具。实验结果表明，ContextPilot 在长上下文问答和深度搜索任务中表现优异，能够在更紧凑的工作上下文中实现更强的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.28478', 'title': 'Blind Men and the Elephant: Probing the Epistemic Myopia of LLMs under Long-Tail Divergent Knowledge', 'url': 'https://huggingface.co/papers/2608.28478', 'abstract': 'Abstract ElephantBench evaluates whether large language models retain multiple conflicting accounts of long-tail facts through a graph-based pipeline that creates verifiable multi-account questions, revealing widespread epistemic incompleteness.  Generated by thinkingmachines/Inkling-Small Factual question answering (QA) typically assumes a single canonical answer, obscuring whether large language models (LLMs) retain divergent accounts of long-tail facts. To address this gap, we introduce ElephantBench, a closed-book knowledge probe comprising 1,094 questions generated through an auditable graph-based pipeline. The pipeline retrieves related documents from a low-exposure web corpus, identifies naturally occurring disagreements, and converts them into multi-account QA records. Each answer is verified against the originating documents and authoritative public web sources and is then reviewed by human annotators. Across 32 models, even the strongest model recovers both accounts on only 52.4% of questions, while on nearly all remaining questions it recalls one account but omits the other. Scaling model size and inference-time reasoning improve recall but do not eliminate this incompleteness. Corpus analysis further shows that exposure imbalance favors the dominant account, whereas greater minority-side exposure is associated with more complete recall. These findings establish ElephantBench as a reproducible knowledge probe for diagnosing epistemic myopia in parametric memory. More broadly, our graph-based benchmark construction pipeline provides an efficient and scalable way to turn long-tail corpora into source-traceable knowledge probes, supporting efforts to evaluate and advance the epistemic rigour of next-generation LLMs. Code is available at https://github.com/Tencent/ElephantBench.', 'score': 4, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': 'a6132b6882b86f7d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🐘', 'ru': {'title': 'Диагностика неполноты знаний: когда языковые модели забывают альтернативные версии фактов', 'desc': 'Работа представляет ElephantBench — набор данных из 1,094 вопросов для оценки способности больших языковых моделей запоминать множественные противоречивые версии фактов с низкой частотностью. Авторы разработали конвейер на основе графов, который извлекает конфликтующие версии из веб-корпуса, верифицирует их с помощью исходных документов и человеческих аннотаторов. Тестирование 32 моделей показало, что даже лучшие модели восстанавливают обе версии только в 52,4% случаев, в остальном вспоминая только одну из них. Результаты демонстрируют, что увеличение размера модели и применение методов рассуждения улучшают полноту воспроизведения, но не устраняют фундаментальную проблему неполноты знаний.'}, 'en': {'title': 'ElephantBench: Uncovering Knowledge Gaps in Language Models', 'desc': "The paper introduces ElephantBench, a tool designed to evaluate how well large language models (LLMs) remember conflicting information about less common facts. It uses a graph-based method to create questions that can be verified against reliable sources, highlighting the models' tendency to miss alternative perspectives. The study finds that even the best-performing models only recall both sides of a fact about half the time, indicating a significant gap in their knowledge. This research not only identifies issues in LLMs' memory but also provides a framework for improving their understanding of complex information."}, 'zh': {'title': '揭示大型语言模型的知识盲点', 'desc': 'ElephantBench 是一个评估大型语言模型（LLMs）是否保留多个相互矛盾的长尾事实的工具。它通过图形化的管道生成可验证的多账户问题，揭示了广泛存在的知识不完整性。研究表明，即使是最强的模型，在52.4%的问题上也只能恢复两个账户中的一个，而在几乎所有其他问题上则只记住一个账户而遗漏另一个。该研究为评估和提升下一代 LLMs 的知识严谨性提供了有效的工具。'}}}, {'id': 'https://huggingface.co/papers/2608.28549', 'title': 'Video Generative Models as Geometry Learner', 'url': 'https://huggingface.co/papers/2608.28549', 'abstract': 'Abstract GeoNeXt repurposes pretrained video generative models as a unified framework for geometry estimation via next-frame prediction, enabling efficient joint modeling of depth and surface normals with minimal labeled data.  Generated by thinkingmachines/Inkling-Small Recent generative approaches to geometry estimation adapt pretrained image diffusion models and treat the task as image-conditioned generation. Leveraging off-the-shelf image diffusion models, they either (i) train task-specific geometry models (for depth and surface normal estimation) independently, losing the opportunity of exploring the intrinsic correlation of these geometric targets, or (ii) jointly fine-tune modified image diffusion backbones (e.g., altered self-attention), which typically demands substantial labeled data. To overcome these limitations in a principled fashion, we repurpose pretrained video generative models as a unified and data-efficient framework for geometry estimation, formulated innovatively as a next-frames prediction task. Our method, GeoNeXt, inherits naturally structured knowledge and richer priors from the video model, while further adapting them for joint modeling of images and geometry targets (image <-> geometry), enabling more data efficient and effective learning of geometry. Extensive experiments validate our method for zero-shot monocular depth and surface normal estimation across diverse datasets, outperforming both previous task-specific and unified generative competitors while using substantially less training data. Notably, our method rivals discriminative state-of-the-art approaches trained on over 100x more data and even standouts on several benchmarks.', 'score': 1, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '93e1c69b842dff68', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#diffusion', '#training', '#transfer_learning', '#synthetic', '#cv'], 'emoji': '🎬', 'ru': {'title': 'От видео к геометрии: единый фреймворк через предсказание кадров', 'desc': 'GeoNeXt переосмысляет предобученные видеогенеративные модели как единую архитектуру для оценки геометрии, формулируя задачу как предсказание следующего кадра. Метод совместно моделирует глубину и нормали поверхности, естественно наследуя структурированное знание из видеомоделей с более богатыми априорными представлениями. Подход требует минимальное количество размеченных данных благодаря эффективной адаптации образных представлений из видеодомена. Эксперименты показывают, что GeoNeXt превосходит специализированные и другие объединённые методы, достигая производительности дискриминативных моделей, обученных на 100 раз большем объёме данных.'}, 'en': {'title': 'Revolutionizing Geometry Estimation with Video Models', 'desc': 'GeoNeXt is a novel approach that uses pretrained video generative models to estimate geometry, specifically depth and surface normals, by predicting the next frame in a sequence. This method allows for efficient joint modeling of geometric targets with minimal labeled data, overcoming limitations of previous methods that either trained models independently or required extensive fine-tuning. By leveraging the structured knowledge from video models, GeoNeXt enhances the learning process for geometry estimation, making it more effective and data-efficient. Experimental results show that GeoNeXt performs exceptionally well in zero-shot scenarios, surpassing traditional methods that rely on much larger datasets.'}, 'zh': {'title': 'GeoNeXt：高效的几何估计新方法', 'desc': 'GeoNeXt是一种新方法，它利用预训练的视频生成模型来进行几何估计，特别是通过预测下一帧来实现。这种方法可以高效地联合建模深度和表面法线，且只需很少的标记数据。与传统方法不同，GeoNeXt避免了独立训练几何模型的局限性，能够更好地探索几何目标之间的内在关联。实验结果表明，GeoNeXt在零样本单目深度和表面法线估计方面表现优异，使用的数据量远低于以往的方法。'}}}, {'id': 'https://huggingface.co/papers/2608.25697', 'title': 'LMSM: LLM Security Framework Inspired by Linux Security Modules', 'url': 'https://huggingface.co/papers/2608.25697', 'abstract': 'Abstract LMSM applies a modular security framework to LLM serving by separating evidence calibration, policy evaluation, and output gating, enabling flexible interpretability-based enforcement without rebuilding request handling.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly deployed with layered defenses, yet malicious prompts can still bypass them. Interpretability methods can expose model-internal signals along the generation path that could inform enforcement, but these signals are not security controls by themselves. Deployments that adapt them for safety typically couple each signal to its own calibration, policy logic, and intervention code, so each new artifact creates integration work instead of strengthening a shared defense. We present Language Model Security Modules (LMSM), a security framework that adapts the separation behind Linux Security Modules (LSM) to LLM serving. In LMSM, a selected security backend exposes calibrated evidence, a versioned policy evaluates active rules over trusted per-request context, and a separate gate authorizes buffered output release. This design separates mediation correctness from policy effectiveness, and it allows backend, rule, or schedule changes without rebuilding request handling or enforcement. Our prototype shows the separation working in practice: with Hugging Face Transformers and continuously batched vLLM, the same substrate hosts artifact-backed sparse autoencoder (SAE) and transcoder deployments and task-fitted dense probes, preserves request-specific decisions under scheduler churn, and selectively enforces and composes multiple rules per request. On Qwen3-4B, LMSM-Checkpoint reduces HarmBench attack success rate from 39.20% to 3.32%, with XSTest false refusals rising from 2.40% to 4.40%, while retaining 98.14% of the throughput of a matched serving path that performs no monitoring work at 32 active sequences. LMSM gives advances in interpretability and model-internal analysis a common path to runtime enforcement.', 'score': 1, 'issue_id': 3191, 'pub_date': '2026-08-26', 'pub_date_card': {'ru': '26 августа', 'en': 'August 26', 'zh': '8月26日'}, 'hash': 'c287ec017dced5ba', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#interpretability', '#security', '#small_models', '#architecture'], 'emoji': '🔒', 'ru': {'title': 'Модульная безопасность: разделение забот при защите больших языковых моделей', 'desc': 'В статье представлена архитектура Language Model Security Modules (LMSM), которая применяет модульный подход к безопасности при обслуживании больших языковых моделей. Система разделяет три независимых компонента: калибровку доказательств (evidence) из внутренних сигналов модели, оценку политики безопасности и управление выводом, что позволяет гибко комбинировать различные методы интерпретируемости без переписания кода обработки запросов. Авторы демонстрируют, что такой модульный дизайн позволяет эффективно применять разные артефакты анализа (разреженные автокодировщики, транскодеры, пробы), сохраняя при этом производительность системы и снижая успешность атак вредоносных промптов. LMSM показывает практическую пользу разделения проблем: методы интерпретируемости получают единый путь к применению в боевых условиях, а политики безопасности можно менять без переработки инфраструктуры обслуживания.'}, 'en': {'title': 'Modular Security for Safer Language Models', 'desc': 'The paper introduces Language Model Security Modules (LMSM), a framework designed to enhance the security of large language models (LLMs) by modularizing their defense mechanisms. It separates the processes of evidence calibration, policy evaluation, and output gating, allowing for flexible and interpretable enforcement without the need to overhaul existing request handling systems. By adapting concepts from Linux Security Modules, LMSM enables the integration of various security controls while maintaining high throughput and minimizing integration work. The prototype demonstrates significant improvements in reducing attack success rates while preserving performance, showcasing a new approach to runtime enforcement in LLM deployments.'}, 'zh': {'title': 'LMSM：灵活的语言模型安全防护框架', 'desc': 'LMSM（语言模型安全模块）是一种安全框架，旨在为大型语言模型（LLM）提供灵活的安全防护。它通过将证据校准、策略评估和输出控制分离，避免了在处理请求时需要重建系统。该框架允许在不影响请求处理的情况下，进行后端、规则或调度的更改，从而提高了安全性和可解释性。实验结果表明，LMSM显著降低了攻击成功率，同时保持了高效的处理能力。'}}}, {'id': 'https://huggingface.co/papers/2608.24115', 'title': 'PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control', 'url': 'https://huggingface.co/papers/2608.24115', 'abstract': "Abstract PonderPounce leverages native causal context in multimodal language models as robot episode memory, jointly training a reasoning System2 module and a fast System1 action model to improve long-horizon policy performance without dedicated memory architectures.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) can integrate long visual histories, reason under partial observability, and infer behavior from a few examples. Yet vision-language-action (VLA) models generally inherit pretrained representations without using this contextual capacity as episode memory. Memory-dependent policies address this gap through purpose-built history mechanisms. PonderPounce instead reuses an MLLM's native causal context as robot memory. Ponder, a System2 MLLM, accumulates episode observations, demonstrations, and prior cognition in its native causal context and can generate subgoal text and demonstration reasoning for internal use. Pounce, a System1 VLA, receives the current observation, instruction, and proprioception directly; through the Ponder--Pounce interface, it asynchronously receives only the newest continuous cognition token and its age. Both are jointly trained end to end without a purpose-built memory module or separate bridge pretraining. Optimized serving achieves p50 latencies of 78ms for cognition refresh and 25ms for action-model invocation, supporting 20Hz action playback. On RoboMME with base-scale training data, PonderPounce reaches 60.83% with 9B and 50.04% with 0.8B under the same Pounce architecture and interface, versus 44.51% for FrameSamp+Modul and 17.93% for the current-observation π_{0.5}. With 9x data, it reaches 75.54% versus 57.88% for FrameSamp+Modul. On RoboCasa-DC, the same interface learns from action supervision alone and reaches 12.5% versus 11.6% for the strongest published demonstration-conditioned baseline, falling to 8.6% when cognition is replaced by a learned null state.", 'score': 1, 'issue_id': 3191, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': '63249266d3374eff', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#robotics', '#optimization', '#multimodal', '#training', '#reasoning', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Двухсистемная архитектура для памяти робота через встроенный контекст языковой модели', 'desc': 'PonderPounce — это система для управления роботами, которая использует встроенный причинный контекст мультимодальных языковых моделей в качестве памяти эпизода. Система состоит из двух компонентов: Ponder (System2 модуль для рассуждений), который накапливает наблюдения и генерирует промежуточные цели, и Pounce (System1 модель действий), которая принимает текущее состояние и выполняет действия, получая информацию от Ponder через асинхронный интерфейс. Оба компонента обучаются совместно end-to-end без отдельных архитектур памяти, что позволяет эффективно использовать контекст предварительно обученной языковой модели. Экспериментальные результаты показывают значительное улучшение производительности длинногоризонтной политики управления робота по сравнению с базовыми подходами, достигая низких латентностей (78ms для рассуждений и 25ms для действий) при поддержке частоты 20Hz.'}, 'en': {'title': 'Harnessing Causal Context for Enhanced Robot Memory', 'desc': "PonderPounce is a novel approach that utilizes the inherent causal context of multimodal language models (MLLMs) to enhance robot memory without needing specialized memory systems. It combines two components: Ponder, a System2 module that accumulates observations and reasoning, and Pounce, a System1 action model that executes actions based on current inputs. This method allows for efficient long-horizon policy performance by leveraging the MLLM's existing capabilities for reasoning and action generation. The system is trained end-to-end, achieving significant improvements in performance on robotic tasks compared to traditional methods."}, 'zh': {'title': '利用因果上下文提升机器人记忆的智能策略', 'desc': 'PonderPounce 是一种利用多模态语言模型的因果上下文作为机器人记忆的方法。它联合训练了一个推理系统（System2）和一个快速行动模型（System1），以提高长期策略的表现，而无需专门的记忆架构。通过重用多模态大语言模型的因果上下文，PonderPounce 能够有效地积累观察、演示和先前的认知。该方法在 RoboMME 和 RoboCasa-DC 数据集上表现出色，显著提高了任务完成率。'}}}, {'id': 'https://huggingface.co/papers/2608.27906', 'title': 'Rubric-to-Code Credit Assignment for Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.27906', 'abstract': 'Abstract RCCA improves reinforcement learning for interactive web app generation by assigning localized credit to code regions based on rubric-level feedback, yielding substantial benchmark gains.  Generated by thinkingmachines/Inkling-Small Interactive web application generation requires models to produce usable HTML, CSS, and JavaScript applications from natural language requests. Unlike conventional code generation, application quality depends on multiple user-facing functional requirements, each often tied to localized code regions such as event handlers, state updates, DOM fragments, or CSS selectors. Standard GRPO collapses these structured outcomes into a single sequence-level reward and applies the resulting advantage uniformly to all tokens, weakening credit assignment. We propose Rubric-to-Code Credit Assignment (RCCA), a reinforcement learning framework that converts rubric-level functional feedback into localized optimization signals over generated code. RCCA builds training tasks around explicit functional rubrics, uses a hierarchical reward to separate format, source-code, runtime, and functional failures, and aligns evaluator-generated textual attributions with responsible code spans and generated tokens. The resulting model, Ling-RCCA-Flash, scores 41.25 on MiniAppBench, improving Ling-3.0-Flash by 32.20 points and slightly surpassing Claude Opus 4.5. It also reaches 76.19 on ArtifactsBench, improving the SFT model by 4.48 points and establishing a new top score under the official ArtifactsBench leaderboard setting by surpassing the GPT-5 score by 3.64 points, suggesting transferable implementation-level gains.', 'score': 0, 'issue_id': 3191, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '477611a6b66aeb70', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#rlhf', '#rl', '#plp'], 'emoji': '🎯', 'ru': {'title': 'Точное распределение ответственности: от рубрик оценки к локальной оптимизации кода', 'desc': 'RCCA — это новый подход к обучению с подкреплением для генерации интерактивных веб-приложений, который улучшает распределение кредита между частями сгенерированного кода. Вместо того чтобы давать одно вознаграждение на уровне всей последовательности, метод использует иерархическую систему обратной связи на основе функциональных критериев оценки. Модель связывает текстовые объяснения оценивающей системы с конкретными участками кода и токенами, что позволяет более точно оптимизировать каждый регион отвечающий за отдельный функционал. Результирующая модель Ling-RCCA-Flash достигает выдающихся результатов на бенчмарках MiniAppBench и ArtifactsBench, превосходя сильные базовые модели и установив новые рекорды в лидерборде.'}, 'en': {'title': 'Localized Feedback for Better Code Generation', 'desc': 'The paper introduces Rubric-to-Code Credit Assignment (RCCA), a novel reinforcement learning approach that enhances the generation of interactive web applications from natural language inputs. RCCA improves the credit assignment process by providing localized feedback based on specific functional requirements, rather than a single overall reward. This method allows the model to optimize different code regions, such as event handlers and CSS selectors, more effectively. The results show significant performance improvements on benchmark tests, indicating that RCCA can lead to better quality web applications.'}, 'zh': {'title': '局部信用赋值，提升交互式应用生成质量', 'desc': 'RCCA（Rubric-to-Code Credit Assignment）是一种强化学习框架，旨在通过基于评分标准的反馈为代码区域分配局部信用，从而改善交互式网页应用生成。与传统的代码生成方法不同，应用程序的质量依赖于多个用户功能需求，这些需求通常与特定的代码区域相关。RCCA通过将功能评分转化为局部优化信号，使用分层奖励机制来区分格式、源代码、运行时和功能失败，从而提高了生成代码的质量。最终模型Ling-RCCA-Flash在多个基准测试中表现优异，显著提升了生成应用的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.20965', 'title': 'Training, learning and inference: unified dynamics of neural systems', 'url': 'https://huggingface.co/papers/2608.20965', 'abstract': 'Abstract Atomic generation facts compiled into a graph enable recursive scientific processes, and training-learning dynamics in nanoGPT are characterized by state-conditioned parameter updates, persistent functional reorganization, and frozen inference projections validated across architectures.  Generated by thinkingmachines/Inkling-Small We define an atomic generation fact f=(u,tau,omega,z;rho), recording the origin, realized transformation, concrete occurrence, generated result and relation role. Compiled into a Generation-Fact Graph (GFG), these facts provide an AI-native, compilable scientific fact substrate preserving generation histories. We establish a GFG-based recursive scientific process in which analysis, intervention, replay and validation form facts for later cycles. Using nanoGPT, we establish unified training-learning dynamics. Training is the evolution of a parameter-optimizer system with state and memory: each actual training action enters the receiving state and produces a finite-amplitude nonlinear functional response conditioned by that state and target-specific update geometry. Learning is the persistent reorganization of distributed functional support by these responses; capability formation, maintenance, decline or recovery becomes observable when target-specific states are evaluated against their readout boundaries. Three primary coordinates - target-boundary state, target-specific update geometry and parameter-Adam receiving state - yield a second-order predictor operating before post-update outputs are read. On held-out runs, it achieved 91.43% accuracy and 91.49% macro-averaged recall across four transitions. We further establish inference as a frozen projection of training-learning dynamics. Component gating and rollback show causal recruitment and non-additive combination of query-conditioned support formed during training, deriving organizational conditions realized by Attention. Controlled feedback indicates possible double-edged reinforcement effects. ResNet/CIFAR-100 and diffusion/CIFAR-10 experiments confirm receiving-state-conditioned responses, persistent support reorganization and frozen inference projection beyond nanoGPT.', 'score': 0, 'issue_id': 3191, 'pub_date': '2026-08-21', 'pub_date_card': {'ru': '21 августа', 'en': 'August 21', 'zh': '8月21日'}, 'hash': '67340a168f2c96fa', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#interpretability', '#small_models', '#science', '#architecture'], 'emoji': '🧬', 'ru': {'title': 'Граф фактов генерации: декодирование динамики обучения нейросетей через состояние-обусловленные обновления', 'desc': 'В работе предложена концепция графа фактов генерации (GFG), который представляет атомарные факты о процессах обучения нейросетей и позволяет реализовать рекурсивные научные циклы. Авторы показывают, что динамика обучения в nanoGPT описывается обусловленными состоянием обновлениями параметров, где каждое действие обучения вызывает нелинейный функциональный ответ, зависящий от текущего состояния оптимизатора и геометрии обновления. Они демонстрируют, что способности моделей формируются через перестройку распределённой функциональной поддержки и могут быть предсказаны с точностью 91.43% на основе трёх координат: целевого состояния, геометрии обновления и состояния параметров. Результаты подтверждены на архитектурах ResNet и диффузионных моделях, показывая универсальность подхода.'}, 'en': {'title': 'Harnessing Atomic Facts for Enhanced AI Learning Dynamics', 'desc': 'This paper introduces a novel approach to scientific processes using a Generation-Fact Graph (GFG) that captures atomic generation facts, which include various attributes like origin and transformation. The authors describe how nanoGPT utilizes state-conditioned parameter updates to enhance training and learning dynamics, allowing for effective memory and response management. They demonstrate that this method leads to improved accuracy and recall in predictive tasks, showcasing the potential of GFG in recursive scientific analysis and validation. Additionally, the study highlights the importance of controlled feedback and attention mechanisms in optimizing the learning process and achieving robust inference projections.'}, 'zh': {'title': '基于生成事实图的递归科学过程', 'desc': '本文提出了一种基于生成事实图（GFG）的递归科学过程，利用原子生成事实记录科学数据的来源和转化。通过nanoGPT，我们实现了统一的训练-学习动态，训练过程通过状态和记忆演化参数优化系统。学习则是通过这些响应的持续重组，观察能力的形成、维护和衰退。实验结果表明，该方法在多个任务上达到了高准确率，验证了训练-学习动态的有效性。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (2)', '#agi', '#alignment', '#architecture (3)', '#audio', '#benchmark (3)', '#cv (1)', '#data', '#dataset (1)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability (2)', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (3)', '#open_source (2)', '#optimization (2)', '#plp (1)', '#rag', '#reasoning (3)', '#rl (2)', '#rlhf (1)', '#robotics (2)', '#science (2)', '#security (1)', '#small_models (2)', '#story_generation', '#survey', '#synthetic (1)', '#training (5)', '#transfer_learning (1)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-31 02:33',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-31 02:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-31 02:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
