elligence: an agent's ability to understand, manipulate, and improve the data that shapes model capabilities. We introduce AutoDataBench, a controlled testbed built on a conceptual framework of data intelligence spanning data diagnosis, data organization, and data construction, instantiated through three highly curated optimization tasks while holding non-data factors fixed. Across tool use, retrieval, and knowledge injection, we evaluate frontier LLMs' ability to improve training data through iterative experimentation under task-specific resource budgets. Beyond optimization performance, we ask: do LLMs understand what their data interventions do? We compare predictions made before training with observed outcomes to seek evidence of data-effect reasoning beyond trial and error, and explore whether iterative feedback helps LLMs better understand how changes to training data affect model performance. Finally, we show that reusing AutoDataBench trajectories for mid-training improves downstream coding performance, highlighting its value in both evaluating data intelligence and generating high-quality training data. Code and resources are available at https://github.com/AutoDataBench/AutoDataBench.", 'score': 6, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '7f2b6b0d82728161', 'authors': ['Ruifeng Yuan', 'Yizhi Li', 'Yaxin Du', 'Fengyu Cai', 'Yiqi Liu', 'Hou Pong Chan', 'Chenghua Lin', 'Yun Chen', 'Jian Yang', 'Bryan Dai', 'Pinyan Lu', 'Chenghao Xiao'], 'affiliations': ['Beihang University', 'IQuest Research', 'Shanghai Jiaotong University', 'Shanghai University of Finance and Economics', 'TU Darmstadt', 'The Hong Kong Polytechnic University', 'The University of Manchester', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2609.40097.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#training', '#data', '#dataset', '#agents', '#synthetic', '#optimization'], 'emoji': '📊', 'ru': {'title': 'Понимание и оптимизация обучающих данных: измерение интеллекта данных в больших языковых моделях', 'desc': 'В работе представлен AutoDataBench — контролируемый стенд для оценки способности языковых моделей улучшать обучающие данные, охватывающий диагностику данных, их организацию и конструирование. Авторы систематически исследуют, могут ли LLM не только оптимизировать качество данных через итеративное экспериментирование, но и понимать причинно-следственные связи между изменениями в данных и производительностью модели. Бенчмарк позволяет изолировать способности, связанные с «интеллектом данных», от других факторов, влияющих на производительность агентов автоматического исследования. Показано, что траектории оптимизации из AutoDataBench можно переиспользовать для улучшения качества обучающих данных и повышения производительности на задачах кодирования.'}, 'en': {'title': 'Unlocking Model Potential Through Data Intelligence', 'desc': "This paper focuses on the concept of Data Intelligence, which refers to an agent's ability to understand and manipulate data to enhance model performance. The authors introduce AutoDataBench, a testbed designed to evaluate this capability by isolating data-related factors from other variables like training frameworks and hyperparameters. They conduct experiments with large language models (LLMs) to see how well these models can improve training data and whether they can reason about the effects of their data interventions. The findings suggest that LLMs can learn from iterative feedback, leading to better understanding and improved performance in downstream tasks."}, 'zh': {'title': '提升数据智能，优化模型性能', 'desc': '本研究聚焦于数据智能，即代理理解、操作和改善数据的能力。我们提出了AutoDataBench，这是一个控制测试平台，旨在系统评估数据智能的不同方面，包括数据诊断、数据组织和数据构建。通过在固定非数据因素的情况下进行优化任务，我们评估了前沿大型语言模型（LLMs）在特定资源预算下改善训练数据的能力。研究还探讨了LLMs是否理解其数据干预的效果，以及迭代反馈是否能帮助它们更好地理解数据变化对模型性能的影响。'}}}, {'id': 'https://huggingface.co/papers/2610.02201', 'title': 'SILSA: Sliding-Window Slice Latents for Topology-Preserving High-Resolution 3D Generation', 'url': 'https://huggingface.co/papers/2610.02201', 'abstract': 'Abstract  High-resolution 3D generation increasingly relies on voxel latents and multi-stage pipelines that first predict active structure and then synthesize local geometry. While effective, this design fragments continuous surfaces into many local tokens, inflates generation cost, and often weakens topological consistency for thin or highly connected shapes. We introduce SILSA, a topology-aware 3D generation framework that represents shapes with compact sliding-window slice latents. Instead of generating expensive voxel tokens, SILSA uses a fixed set of overlapping slices along the three canonical axes, where each token summarizes a local depth window to preserve cross-sectional continuity and support single-stage rectified-flow generation. A Slice VAE encodes oriented surface samples into multi-axis slice latents and reconstructs them with a sparse volumetric decoder, while a Volumetric Anchor Lattice coordinates directional slice streams through a shared 3D workspace. To preserve structural correctness, we introduce slice-level topology supervision that matches persistence diagrams and aligns Betti transitions across neighboring slices. Experiments show that SILSA improves structural fidelity while substantially reducing generation cost. SILSA improves PSNR by 8.7%, coverage by 5.96 absolute points, and Betti error by 9.2% over the strongest baseline, while using 70.0% fewer tokens than the next-most compact baseline and over 98% fewer tokens than sparse or hierarchical tokenizers, effectively reducing training memory by 40.4% and inference time by 58.5%. Qualitative results further show improved preservation of thin structures, repeated components, and long-range connectivity.', 'score': 5, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'c490c13d9b18333f', 'authors': ['Tianjiao Yu', 'Xinzhuo Li', 'Yifan Shen', 'Ying Shen', 'Kiet A. Nguyen', 'Adheesh Sunil Juvekar', 'Ismini Lourentzou'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02201.jpg', 'data': {'categories': ['#architecture', '#3d', '#inference', '#training'], 'emoji': '🧊', 'ru': {'title': 'Топологически осознанная 3D-генерация через срезовые латентные представления', 'desc': 'Авторы представляют SILSA — новый фреймворк для трёхмерной генерации, который использует компактные срезовые латентные переменные вместо дорогостоящих воксельных токенов. Метод представляет 3D-формы набором перекрывающихся срезов вдоль трёх канонических осей, каждый из которых кодирует локальное окно глубины для сохранения топологической согласованности. Система включает специальный Slice VAE и якорную решётку для координации потоков срезов в общем 3D-пространстве, а также использует топологический супервизор для согласования диаграмм персистентности между соседними слоями. Эксперименты показывают значительное улучшение качества генерации при одновременном снижении вычислительных затрат на 40-98% по сравнению с существующими методами.'}, 'en': {'title': 'SILSA: Efficient and Topology-Aware 3D Shape Generation', 'desc': 'The paper presents SILSA, a new framework for generating high-resolution 3D shapes that focuses on maintaining topological consistency. Unlike traditional methods that use voxel latents and multi-stage processes, SILSA employs compact sliding-window slice latents to represent shapes, which helps in preserving continuous surfaces. This approach reduces the number of tokens needed for generation, leading to lower computational costs and faster inference times. Additionally, SILSA incorporates slice-level topology supervision to ensure structural correctness, resulting in improved fidelity and coverage in the generated 3D models.'}, 'zh': {'title': 'SILSA：高效的拓扑感知3D生成框架', 'desc': '本论文介绍了一种名为SILSA的3D生成框架，旨在提高高分辨率3D形状生成的拓扑一致性。SILSA通过使用重叠的切片潜变量来表示形状，避免了传统方法中生成昂贵的体素标记，从而降低了生成成本。该框架采用切片变分自编码器（Slice VAE）和稀疏体积解码器，能够有效地编码和重建表面样本。实验结果表明，SILSA在结构保真度上有显著提升，同时减少了生成所需的标记数量，降低了训练内存和推理时间。'}}}, {'id': 'https://huggingface.co/papers/2610.02196', 'title': 'InterEvolve: Test-Time Evolution of Reward Programs for Humanoid Loco-Manipulation', 'url': 'https://huggingface.co/papers/2610.02196', 'abstract': "Abstract  We study test-time evolution for humanoid loco-manipulation: solving tasks that a controller was never trained for by repurposing its existing skills, improving from its own attempts, and retaining what it learns, without retraining. Our key insight is that a broad controller already holds much of the competence a new task needs, and that this competence becomes accessible through an interface between planning and control that is expressive enough to specify contact-rich, multi-stage interactions, yet executable and measurable enough that execution feedback can guide planning from experience. InterEvolve realizes this interface with two components. First, we develop an object-aware forward-backward (FB) behavioral foundation model, whose object residuals on a frozen body prior turn a new reward about the body or objects into loco-manipulation behavior at test time. Second, we specify tasks as reward programs: staged rewards with completion conditions and tunable constants. A large language model (LLM) agent revises the program structure in context, drawing on execution feedback and a skill library of verified programs, while a numerical optimizer tunes its constants. With every candidate verified across parallel simulation scenarios, the program explores new ways to induce, repurpose, and compose the controller's existing motor competence for the task at hand, and thus improves over iterations. Experiments show that human-designed rewards leave much of the FB model's loco-manipulation competence untapped, whereas the programs InterEvolve evolves release it, sometimes through novel strategies. It further produces behaviors for diverse tasks, complex scenes, and long-horizon compositions in simulation, and evolved skills run autonomously on a physical Unitree G1 from egocentric onboard perception.", 'score': 4, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '31b7f46cdd9a7305', 'authors': ['Zhuo Lin', 'Sirui Xu', 'Liuyu Bian', 'Yu-Xiong Wang', 'Liang-Yan Gui'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02196.jpg', 'data': {'categories': ['#robotics', '#agents', '#training'], 'emoji': '🤖', 'ru': {'title': 'Раскрытие скрытых навыков робота через эволюцию программ вознаграждения без переобучения', 'desc': 'В работе изучается эволюция контроллера во время тестирования для задач манипуляции гуманоидным роботом без переобучения. Основная идея заключается в том, что предварительно обученный контроллер уже обладает компетенциями, необходимыми для новых задач, и эти компетенции можно раскрыть через интерфейс между планированием и управлением. Система InterEvolve использует фундаментальную модель поведения на основе трансформатора с замороженным приором и специальный интерфейс вознаграждения, а также LLM-агента для эволюции программ вознаграждения и численную оптимизацию их параметров. Экспериментальные результаты показывают, что эволюционированные программы вознаграждения раскрывают скрытые компетенции модели и позволяют роботу выполнять разнообразные задачи, включая сложные сцены и долгие последовательности операций как в симуляции, так и на физическом роботе.'}, 'en': {'title': 'Unlocking Robot Skills: Evolving Competence at Test Time', 'desc': "This paper explores how humanoid robots can adapt their existing skills to perform new tasks without needing retraining. The authors introduce a method called InterEvolve, which uses a combination of a behavioral foundation model and reward programs to enhance the robot's performance. By leveraging execution feedback and a library of verified skills, the robot can refine its approach to tasks over time. The results demonstrate that this method allows for more effective use of the robot's capabilities, enabling it to tackle complex scenarios and operate autonomously in real-world environments."}, 'zh': {'title': '智能控制器的自我进化与任务适应', 'desc': '本论文研究了人形机器人在测试时的演变能力，旨在通过重新利用现有技能来解决未曾训练过的任务。我们发现，广泛的控制器已经具备新任务所需的许多能力，这些能力可以通过规划与控制之间的接口来访问。InterEvolve实现了这一接口，结合了对象感知的前后行为基础模型和奖励程序的任务定义。实验表明，InterEvolve能够有效释放控制器的运动能力，并在多样化的任务和复杂场景中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.32520', 'title': 'When Users Change Their Minds: Measuring and Repairing Intent Drift in LLM Agents', 'url': 'https://huggingface.co/papers/2609.32520', 'abstract': "Abstract  LLM agents often operate over multi-turn interactions in which user intent changes before execution. We study intent drift: the failure mode in which superseded parts of the user's intent continue to influence the final answer or tool action. We introduce IntentFlux, an executable benchmark that converts verifiable tasks into dialogues with controlled intent changes while preserving their original graders. In a 627-case calibration, mean task score falls from 0.476 to 0.384 as dialogues contain more superseded and withdrawn information. Across eight models, the rate of fully correct solutions is significantly lower when the same final task must be recovered from an evolving dialogue rather than given directly in a single turn. We further introduce StateForge, which explicitly maintains the active requirements before generation. On General-Test, it improves mean task score from 0.367 to 0.467. Providing the ground-truth final state improves performance further but still does not recover single-turn performance, indicating that state-estimation errors explain only part of the gap. These results establish intent drift as a measurable multi-turn failure mode and explicit state maintenance as a partial mitigation.", 'score': 4, 'issue_id': 3362, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'f7961b28cd7beb16', 'authors': ['Yanjie Zhang', 'Bowen Cao', 'Zixin Chen', 'Yushi Sun'], 'affiliations': ['CUHK', 'HKUST', 'LIGHTSPEED'], 'pdf_title_img': 'assets/pdf/title_img/2609.32520.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Контроль дрейфа намерения в многошаговых диалогах с языковыми моделями', 'desc': 'В этой работе исследуется проблема дрейфа намерения в мультитурновых диалогах с языковыми агентами, когда устаревшие части пользовательского запроса продолжают влиять на финальный результат. Авторы представляют IntentFlux — тестовый набор, который преобразует проверяемые задачи в диалоги с контролируемыми изменениями намерения, сохраняя исходные метрики оценки. Экспериментально показано, что качество решений падает с 0.476 до 0.384 по мере накопления устаревшей информации, и восемь протестированных моделей значительно хуже справляются с эволюционирующими диалогами по сравнению с прямыми запросами. Предложенный метод StateForge явно отслеживает активные требования и улучшает качество с 0.367 до 0.467, хотя полностью устранить проблему удаётся только при предоставлении истинного финального состояния.'}, 'en': {'title': 'Mitigating Intent Drift in Multi-Turn Dialogues', 'desc': "This paper investigates a problem called intent drift, which occurs when a user's changing intentions during a conversation affect the final outcome of a task performed by language models. The authors introduce IntentFlux, a benchmark that creates dialogues with intentional changes while keeping the original task intact, revealing that task performance declines as more outdated information is included. They also present StateForge, a method that helps maintain the current requirements during task execution, leading to improved performance in multi-turn interactions. The findings highlight intent drift as a significant challenge in multi-turn dialogues and suggest that while state maintenance can help, it does not completely resolve the issue."}, 'zh': {'title': '意图漂移：多轮交互中的挑战与解决方案', 'desc': '本论文研究了在多轮交互中，用户意图变化对大型语言模型（LLM）代理的影响，称为意图漂移。意图漂移是指用户的某些意图被替代后，仍然对最终答案或工具操作产生影响。我们提出了IntentFlux，这是一个可执行的基准，能够将可验证的任务转化为对话，并在保持原始评分者的同时控制意图变化。通过实验，我们发现当对话中包含更多被替代的信息时，任务得分显著下降，并且引入StateForge可以在生成前明确维护活跃需求，从而部分缓解这一问题。'}}}, {'id': 'https://huggingface.co/papers/2609.32536', 'title': 'Do Audio LLMs Listen Before They Act? Diagnosing Acoustic-Context Gating in Voice Agents', 'url': 'https://huggingface.co/papers/2609.32536', 'abstract': 'Abstract  Audio language models can recognize spoken commands and invoke tools, but an agent must first decide whether the acoustic and conversational context warrants action. We introduce VGBench, a 1,018-item diagnostic benchmark for action-level addressedness across side-talk, self-talk, and speaker-switch scenarios. Each item uses a shared action space comprising silence, a tool call, and a natural-language answer. Speaker-switch pairs hold the specified words fixed while source, distance rendering, and a temporal boundary define a controlled wearer-to-bystander shift. Six raw Audio LLMs and three training-free adaptations often identify the target tool yet rarely withhold action under this shift; the highest raw switch mute rate is 14%. We then use VoxGate as a post-training case study. Supervised training mutes 91.3% of switched commands while choosing the correct tool for all nearby wearer commands and text-only controls. An exploratory GRPO stage has similar switch performance; side-talk accuracy rises from 68.4% to 70.9%, and self-talk muting from 52.0% to 60.0%. Factorized controls identify an independent source-change effect, while sensitivity to the far-field manipulation varies across acoustic renderings. The benchmark therefore measures multi-cue acoustic-context gating rather than isolated speaker identity.', 'score': 3, 'issue_id': 3362, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '0c466114bc8668c2', 'authors': ['Yanjie Zhang', 'Nanchen Hu', 'Yushi Sun'], 'affiliations': ['HKUST', 'LIGHTSPEED'], 'pdf_title_img': 'assets/pdf/title_img/2609.32536.jpg', 'data': {'categories': ['#audio', '#benchmark', '#agents', '#training'], 'emoji': '🎤', 'ru': {'title': 'Научить модель различать, когда её слушают: контекстное понимание в аудио-ассистентах', 'desc': 'В работе представлена VGBench — диагностический бенчмарк из 1018 примеров для оценки способности аудио языковых моделей определять, нужно ли выполнять команду в различных акустических контекстах (посторонние разговоры, разговоры с собой, смена говорящего). Авторы показали, что современные Audio LLM хорошо распознают целевые инструменты, но плохо подавляют действия при смене говорящего — лучший результат составляет всего 14% корректного отказа. Используя VoxGate как методологический пример, исследователи продемонстрировали, что контролируемое обучение может подавлять 91.3% команд от посторонних людей, сохраняя корректность выполнения команд владельца устройства. Бенчмарк измеряет комплексное понимание акустического контекста через множество сигналов, а не только идентификацию говорящего.'}, 'en': {'title': 'Enhancing Context Awareness in Audio Language Models', 'desc': "This paper presents VGBench, a benchmark designed to evaluate how well audio language models (LLMs) can determine when to act on spoken commands in various conversational contexts. It includes 1,018 items that test the models' ability to recognize when to mute actions based on speaker changes and background conversations. The study shows that while some models can identify the correct tool to use, they often fail to withhold action when the speaker changes, indicating a need for better context awareness. The results highlight the importance of multi-cue acoustic-context gating in improving the performance of audio LLMs in real-world scenarios."}, 'zh': {'title': '多线索音频上下文的智能门控', 'desc': '本文介绍了VGBench，这是一个包含1018个项目的诊断基准，用于评估音频语言模型在不同对话场景中的行动适当性。研究表明，尽管六种原始音频语言模型能够识别目标工具，但在说话者切换的情况下，它们很少能够抑制不必要的行动。通过监督训练，模型在切换命令时的抑制率达到了91.3%，并且能够正确选择所有附近佩戴者的命令。该基准测试强调了多线索音频上下文的门控能力，而不仅仅是孤立的说话者身份。'}}}, {'id': 'https://huggingface.co/papers/2610.00483', 'title': 'PixelDense: Dense Prediction as Representation Alignment for Pixel Diffusion', 'url': 'https://huggingface.co/papers/2610.00483', 'abstract': "Abstract  Representation alignment (REPA) accelerates diffusion transformer training, but its alignment targets are almost exclusively semantic encoders such as DINOv2 and CLIP. Recent analysis points to spatial structure, not global semantics, as the carrier of the alignment effect, yet dense-prediction foundation models trained to predict that structure remain overlooked as REPA targets. In pixel-space diffusion, SAM2, Depth Anything v2, and Metric3D v2 each outperform the DINOv2-only GenEval baseline, with the two geometric teachers leading the segmentation teacher. A flat sum of all four teachers, however, lands below the best single geometric teacher, as semantic and geometric gradients compete for one denoiser projection. We introduce PixelDense, which routes DINOv2 and SAM2 through a semantic projection stream, routes Depth Anything v2 and Metric3D v2 through a geometric projection stream, and adds a weight-space orthogonality penalty that keeps the two streams in disjoint subspaces. All four teachers are frozen during training and dropped at inference. Applied to PixelGen and DeCo with a single recipe, PixelDense improves GenEval, DPG-Bench, and HPS v2.1, raises PixelGen-XXL's GenEval Overall from 0.7927 to 0.8093, and beats every single-teacher and unfactored multi-teacher variant. In partial-noise reconstruction, independent panoptic, depth, and surface-normal probes show up to 53.1% PQ gain and 36.0% depth AbsRel reduction at τ=0.5 across COCO and Flickr30K. From random initialization, PixelDense also reaches the baseline's peak GenEval 1.23x faster. In SDEdit editing on PIE-Bench, PixelDense keeps more of the source background and layout at every edit strength, raising background PSNR by up to 2.2 dB.", 'score': 3, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '2fe5486a76d22615', 'authors': ['Lehan Yang', 'Daiqing Qi', 'Wenhao Zhang', 'Avery Li', 'Yiqing Yang', 'Yifan Li', 'Yu Kong', 'Haitian Zheng', 'Zhifei Zhang', 'Zhe Lin', 'Varun Jampani', 'Sheng Li'], 'affiliations': ['Adobe', 'Arcade AI', 'Michigan State University', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2610.00483.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training', '#cv', '#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Разделение семантико-геометрических потоков для лучшего выравнивания в диффузионных моделях', 'desc': 'Работа предлагает PixelDense — метод выравнивания представлений для ускорения обучения диффузионных трансформеров, который использует несколько учителей-моделей для предсказания плотных признаков вместо традиционных семантических кодировщиков. Ключевая идея заключается в разделении семантических и геометрических градиентов на отдельные потоки проекций с применением штрафа на ортогональность в пространстве весов, что предотвращает их конкуренцию при обновлении денойзера. Метод демонстрирует значительные улучшения во всех метриках оценки качества генерации изображений, включая восстановление при частичном шуме и редактирование изображений. Благодаря использованию замороженных учителей, которые удаляются на этапе инференса, PixelDense достигает лучших результатов при более быстром обучении по сравнению с однопоточными и нефакторизованными многопоточными альтернативами.'}, 'en': {'title': 'PixelDense: Bridging Semantic and Geometric Learning for Enhanced Diffusion Training', 'desc': 'This paper introduces PixelDense, a novel approach to enhance the training of diffusion transformers by utilizing both semantic and geometric information. It highlights the importance of spatial structure in representation alignment, moving beyond traditional reliance on semantic encoders like DINOv2. By routing different models through separate projection streams and applying an orthogonality penalty, PixelDense effectively prevents competition between semantic and geometric gradients. The results demonstrate significant improvements in various benchmarks, showcasing faster convergence and better performance in tasks like image reconstruction and editing.'}, 'zh': {'title': 'PixelDense：提升扩散变换器训练效率的创新方法', 'desc': '本文提出了一种新的方法PixelDense，用于加速扩散变换器的训练。该方法通过将不同的教师模型（如DINOv2和SAM2）分配到语义和几何投影流中，来优化对齐效果。研究表明，几何教师在像素空间扩散中表现优于传统的语义编码器。实验结果显示，PixelDense在多个基准测试中显著提高了性能，尤其是在图像重建和编辑任务中。'}}}, {'id': 'https://huggingface.co/papers/2610.00544', 'title': 'Memorizon: Training World Models Beyond Their Context Window', 'url': 'https://huggingface.co/papers/2610.00544', 'abstract': 'Abstract  Streaming world models should render a place consistently across repeated visits. Directly supervising such revisits requires training samples that capture both visits, often spanning minutes. Yet dense attention over the full span incurs quadratic costs, making long-span supervision expensive. Memorizon breaks this coupling: long spans are needed for supervision, but not for attention, since the two visits can share a forward pass without including every intervening frame. A training sample covers a span of any length but is scored only on its last k chunks. Instead of tokenizing the history before them, each scored chunk retrieves its own top-K latents by camera co-visibility, and the union of these requests forms a shared bank. The bank is bounded by kK, so the sequence stays bounded however long the span; at the shortest span the recipe is exactly conventional training. Adding the bank raises the cost of a step once; beyond that, a longer span costs little, and going from 100 to 400 s adds 12% to the step time. Against a sliding-window baseline, retrieval raises revisit consistency on every split, and a span long enough to reach the first visit of each return adds a further 24% to 30%, at some cost in image quality; beyond that span, more length no longer helps. Filling the bank from another episode lowers revisit correlation by 83%, so the model uses what it retrieves. Project page: https://tingtingliao.github.io/memorizon', 'score': 2, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '776855dfa2975153', 'authors': ['Tingting Liao', 'Xuezhi Liang', 'Hao Li', 'Guangyi Liu'], 'affiliations': ['IFM, MBZUAI', 'MBZUAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.00544.jpg', 'data': {'categories': ['#video', '#architecture', '#training'], 'emoji': '🎬', 'ru': {'title': 'Эффективная долгосрочная консистентность в потоковых моделях мира через избирательное внимание', 'desc': 'В статье предлагается Memorizon — метод обучения потоковых моделей мира, который эффективно обрабатывает долгие последовательности кадров для обеспечения консистентности визуализации при повторных посещениях одной локации. Ключевая идея состоит в разделении длительного окна обучения (необходимого для контроля качества) и окна внимания (необходимого для вычислений), чтобы избежать квадратичных затрат памяти. Модель использует механизм извлечения top-K скрытых представлений на основе видимости камеры, формируя ограниченный общий банк памяти размером kK независимо от длины последовательности. Экспериментальные результаты показывают значительное улучшение консистентности при повторном посещении (на 24-30%) с минимальными вычислительными затратами.'}, 'en': {'title': 'Efficient Long-Span Supervision with Memorizon', 'desc': 'The paper introduces Memorizon, a novel approach for training streaming world models that need to maintain consistent representations across repeated visits. It addresses the challenge of long-span supervision by allowing attention mechanisms to operate without processing every frame in between visits, thus reducing computational costs. Memorizon utilizes a shared bank of top-K latents based on camera co-visibility, which enables efficient retrieval of relevant information while keeping the sequence length manageable. The results show that this method significantly improves revisit consistency while maintaining reasonable computational efficiency, even as the span of training samples increases.'}, 'zh': {'title': 'Memorizon：提升重访一致性的流媒体模型', 'desc': '这篇论文介绍了一种名为Memorizon的模型，用于改进流媒体世界模型的重访一致性。该模型通过共享前向传递来减少长时间监督的计算成本，而不需要每个中间帧。Memorizon使用一个共享的潜在特征库来提高重访的准确性，并且在长时间跨度的情况下，模型的性能提升显著。实验结果表明，使用Memorizon可以在保持较低计算成本的同时，显著提高重访一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.38886', 'title': 'Benchmarking and Enhancing Skill-Level Memory for Partially Observable Robotic Manipulation', 'url': 'https://huggingface.co/papers/2609.38886', 'abstract': 'Abstract  Recent advances in robot learning have enabled manipulation policies to perform increasingly diverse tasks and generalize across environments. However, reliable execution often depends on hidden task states that cannot be determined from current observations alone, making interaction history essential. We introduce HIDE, a benchmark for evaluating manipulation memory under partial observability. HIDE comprises 15 tasks covering repetition counting, historical-state recall, and execution-progress tracking, with randomized initial configurations and decision points where similar observations require different actions depending on prior events. We further propose SEEK, a framework combining three complementary memory mechanisms to retain historical evidence and track execution state. Evaluations reveal substantial limitations in existing policies on HIDE, while memory augmentation improves task success in both simulation and real-world experiments. Individual mechanisms benefit some tasks but can degrade others; their combination achieves the highest average success rate on HIDE among the evaluated configurations. These findings highlight the importance of maintaining internal representations of hidden task states and matching memory design to task-specific information requirements.', 'score': 2, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'ec21dee306b3665a', 'authors': ['Yansong Shi', 'Jiange Yang', 'Xijie Yang', 'Shaowei Zhang', 'Yuhan Zhu', 'Tao Lu', 'Limin Wang'], 'affiliations': ['Computer Science and Technology, Shanghai Jiaotong University', 'Computer Science and Technology, Zhejiang University', 'School of Information Science And Technology, University of Science and Technology of China', 'Shanghai Artificial Intelligence Laboratory', 'State Key Lab of Novel Software Technology, Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38886.jpg', 'data': {'categories': ['#dataset', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Память робота: как научить манипуляторов запоминать скрытые состояния', 'desc': 'В статье представлен бенчмарк HIDE для оценки способности робототехнических систем работать с частичной наблюдаемостью, когда скрытые состояния задачи нельзя определить только из текущих наблюдений. Авторы предлагают фреймворк SEEK, который комбинирует три дополняющие друг друга механизма памяти для сохранения исторической информации и отслеживания прогресса выполнения задачи. Эксперименты показывают, что существующие политики манипуляции имеют значительные ограничения при работе с HIDE, но добавление механизмов памяти существенно улучшает успешность выполнения как в симуляции, так и в реальных условиях. Исследование демонстрирует важность построения внутренних представлений скрытых состояний и подбора архитектуры памяти в соответствии с требованиями конкретной задачи.'}, 'en': {'title': 'Enhancing Robot Memory for Better Task Performance', 'desc': "This paper presents HIDE, a benchmark designed to assess how well robots can remember and utilize past interactions when performing manipulation tasks under partial observability. The benchmark includes 15 diverse tasks that require robots to count repetitions, recall historical states, and track their progress, all while facing randomized scenarios. The authors introduce SEEK, a framework that integrates three memory mechanisms to enhance a robot's ability to retain crucial historical information and manage its execution state. Results show that while existing policies struggle with HIDE, augmenting memory significantly boosts task success, emphasizing the need for tailored memory strategies based on specific task requirements."}, 'zh': {'title': '提升机器人操控的记忆能力', 'desc': '最近机器人学习的进展使得操控策略能够执行越来越多样化的任务并在不同环境中进行泛化。然而，可靠的执行往往依赖于隐藏的任务状态，这些状态无法仅通过当前观察来确定，因此交互历史变得至关重要。我们提出了HIDE，这是一个用于评估在部分可观察情况下操控记忆的基准，涵盖了15个任务，包括重复计数、历史状态回忆和执行进度跟踪。我们还提出了SEEK框架，结合三种互补的记忆机制，以保留历史证据并跟踪执行状态，评估结果显示现有策略在HIDE上的局限性，而记忆增强在模拟和现实实验中提高了任务成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.38987', 'title': 'Smaller Models, Better Rejects: Preference Distillation Scaling', 'url': 'https://huggingface.co/papers/2609.38987', 'abstract': "Abstract  Preference distillation typically treats a teacher response as preferred and the student's own response as rejected. This assumes that self-generated failures are the most informative negatives and that rejects must come from a model at least as large as the student, making generation costly at scale. We find neither assumption holds: across students from 7B to 72B, smaller frozen models generate rejects with less inference compute yet train stronger students than self-generated rejects, before and after sequence-level knowledge distillation, on code generation and mathematical reasoning. To explain this result, we derive a finite-horizon utility bound for Direct Preference Optimization in a linearized feature model. The bound characterizes favorable reject distributions and motivates three interventions. First, mixing rejects from smaller and student-scale models improves performance as the smaller model's share increases. Second, reassigning rejects to other prompts and shuffling their code tokens still outperform length-matched gibberish, showing that task structure contributes to reject utility. Third, selecting candidates with lower likelihood under the reference policy improves net transfer when higher-likelihood candidates provide less useful contrast. Lower-likelihood selections outperform higher-likelihood ones for every source. These results suggest that effective rejects preserve task structure while limiting coupling to the reference policy, and that smaller frozen models can provide them at low cost.", 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '62865ec1db9aeaac', 'authors': ['Rui Cai', 'Wenhui Zhu', 'Xiwen Chen', 'Jincheng Cao', 'Han Yu', 'Shayan Mohajer Hamidi', 'Zelin He', 'Qiyao Ma', 'Daiwei Chen', 'Xuanzhao Dong', 'Yuanda Xu', 'Jelena Markovic-Voronov', 'Kayhan Behdin', 'Zhengze Zhou', 'Ran He', 'Alborz Geramifard', 'Rohit Jain', 'Zhe Zhao'], 'affiliations': ['Arizona State University', 'Clemson University', 'LinkedIn', 'Pennsylvania State University', 'University of California, Davis', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.38987.jpg', 'data': {'categories': ['#reasoning', '#training', '#plp', '#rlhf', '#transfer_learning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Дешёвые отказы от маленьких моделей обучают больших студентов лучше', 'desc': 'В этой работе авторы переосмысляют процесс дистилляции предпочтений, показывая, что отрицательные примеры (rejected responses) не обязательно должны генерироваться самой студент-моделью или быть от модели больших размеров. Они демонстрируют, что меньшие замороженные модели генерируют более информативные отрицательные примеры с меньшими вычислительными затратами, чем самогенерируемые отказы, улучшая качество обучения студент-моделей на задачах генерации кода и математических рассуждений. Авторы выводят теоретическую границу полезности для Direct Preference Optimization и предлагают три практических метода: смешивание отрицательных примеров от моделей разных размеров, перераспределение примеров между подсказками и выбор кандидатов с низкой вероятностью по эталонной политике. Результаты показывают, что эффективные отрицательные примеры сохраняют структуру задачи, не связывая обучение с эталонной политикой, позволяя масштабировать дистилляцию предпочтений экономнее.'}, 'en': {'title': 'Unlocking the Power of Smaller Models in Preference Distillation', 'desc': "This paper challenges the traditional approach of preference distillation in machine learning, which typically views the teacher's responses as preferred and the student's responses as failures. The authors demonstrate that smaller, frozen models can generate more informative rejects than self-generated ones, leading to stronger student models in tasks like code generation and mathematical reasoning. They introduce a utility bound for Direct Preference Optimization, which helps explain why mixing rejects from smaller models enhances performance. Additionally, they propose that selecting lower-likelihood candidates can improve the transfer of knowledge, suggesting that effective rejects should maintain task structure while minimizing reliance on the reference policy."}, 'zh': {'title': '小模型的拒绝样本更有效！', 'desc': '偏好蒸馏通常将教师模型的响应视为优选，而学生模型的响应视为被拒绝。这种假设认为自生成的失败是最有信息量的负样本，并且拒绝样本必须来自至少与学生模型同等大小的模型，这使得生成过程在大规模时成本高昂。我们的研究发现，这些假设并不成立：在不同规模的学生模型中，较小的冻结模型生成的拒绝样本在推理计算上更少，但能训练出更强的学生模型。我们提出了三种干预措施，以提高拒绝样本的有效性，表明较小的冻结模型可以以低成本提供有用的拒绝样本。'}}}, {'id': 'https://huggingface.co/papers/2610.02122', 'title': 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows', 'url': 'https://huggingface.co/papers/2610.02122', 'abstract': "Abstract  Real-world enterprise data science and analytics workflows require reasoning across dozens of tables, performing statistical analyses, and acting on the results. Established text-to-SQL benchmarks evaluate query generation alone, and audits have found their answer keys frequently wrong. Because real enterprise warehouses are too sensitive to release, these benchmarks are built on public datasets where a business event fits in a single table. We introduce Argo-Bench, an evaluation framework comprising 210 data science and analytics tasks. Drawing on public data, peer-reviewed industry literature, and regulatory filings, we simulate a food delivery platform in New York City at true scale, with 81 million orders in 2024, grounded economics, fraud patterns, and marketplace incentives. We export this world to an ERP warehouse of 235 tables and 7.5 billion rows, modeled on the Oracle E-Business Suite schema. The simulator's ground-truth state is withheld from the warehouse the agent sees, so tasks require reconstructing facts by navigating the warehouse before acting on them. Argo-Bench goes beyond text-to-SQL: the agent files actions such as banning fraudulent accounts, allocating courier incentive budgets, or issuing back pay, and the grader scores each by its consequences in the simulator. Every task has an executable reference solution that demonstrates solvability using only the warehouse. The strongest of 14 frontier and open-weight models scores 95 or higher on only 34.8% of tasks and averages 59.5 points. We hope Argo-Bench drives progress toward agents that understand, navigate, and act within real data environments.", 'score': 1, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'bcd85c09549e6008', 'authors': ['Gabriel Tomitsuka', 'Arman Raayatsanati', 'Emma Xing', 'Duke Gand', 'Joseph J Ma'], 'affiliations': ['TextQL'], 'pdf_title_img': 'assets/pdf/title_img/2610.02122.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#dataset', '#agents', '#survey'], 'emoji': '🏢', 'ru': {'title': 'От запросов к действиям: агенты, понимающие реальные хранилища данных', 'desc': 'Авторы представляют Argo-Bench, новый бенчмарк для оценки способности LLM-агентов работать с реальными корпоративными данными в хранилищах информации. В отличие от существующих text-to-SQL датасетов, которые оценивают только генерацию запросов и часто содержат ошибки в ответах, этот бенчмарк включает 210 задач по анализу данных, где агенты должны исследовать сложную схему из 235 таблиц и 7,5 миллиардов строк. Платформа базируется на реалистичной симуляции сервиса доставки еды в Нью-Йорке и требует от агентов не только составления запросов, но и выполнения действий, которые оцениваются по их последствиям в симуляторе. Результаты показывают, что даже самые продвинутые модели справляются с менее чем 35% задач на оценку 95+, что подчёркивает необходимость развития навыков работы с реальными корпоративными данными.'}, 'en': {'title': 'Argo-Bench: Advancing Data Science Agents in Complex Environments', 'desc': "This paper introduces Argo-Bench, a new evaluation framework designed for real-world data science and analytics tasks that involve complex reasoning across multiple tables. Unlike existing benchmarks that focus solely on query generation, Argo-Bench simulates a comprehensive food delivery platform with a vast dataset, allowing for the assessment of agents' abilities to navigate and act on data. The framework includes 210 tasks that require agents to reconstruct facts and make decisions based on the data warehouse, with performance evaluated based on the consequences of their actions. The results indicate that current models struggle with these tasks, highlighting the need for further advancements in agents that can effectively operate in complex data environments."}, 'zh': {'title': '推动智能体在真实数据环境中的进步', 'desc': '本文介绍了Argo-Bench，一个评估框架，旨在解决企业数据科学和分析工作流中的复杂任务。该框架包含210个任务，模拟了一个真实规模的食品配送平台，涉及81百万个订单和235个表格。与传统的文本到SQL基准不同，Argo-Bench要求智能体在执行操作之前，先在数据仓库中重建事实。通过这种方式，研究希望推动智能体在真实数据环境中理解、导航和行动的能力。'}}}, {'id': 'https://huggingface.co/papers/2609.38585', 'title': 'FlexRouter: Learning Complementary Model Sets for Flexible LLM Routing', 'url': 'https://huggingface.co/papers/2609.38585', 'abstract': 'Abstract  Existing Large Language Model (LLM) routing methods score LLMs independently to select top-k models. However, this ignores model correlations and enforces a rigid computational budget. Consequently, routers often select redundant models that share failure modes, limiting the overall probability of success. To address this, we propose FlexRouter, a routing framework that explicitly models model complementarity. FlexRouter optimizes for answer coverage, maximizing the probability that at least one selected model yields a correct response. This objective aligns with practical inference pipelines where multiple candidate outputs are generated and a downstream verifier or user selects the final one. We formulate routing as a coverage-oriented subset selection problem and model the routing policy using Determinantal Point Processes (DPPs), which naturally capture both model competence and redundancy. To directly optimize coverage without requiring a ground-truth target subset, we introduce a training objective based on marginalizing over failure sets. During inference, we employ a greedy strategy based on marginal log-determinant gains, enabling the router to adaptively determine subset sizes without a predefined budget. Extensive experiments on the large-scale RouterEval benchmark demonstrate that our proposed FlexRouter achieves higher coverage with lower redundancy across both in-domain and out-of-domain tasks than strong baselines while maintaining flexible inference cost.', 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '7935dc14c967844f', 'authors': ['Wang Wei', 'Harry Yang', 'Tiankai Yang', 'Samyadeep Basu', 'Hongjie Chen', 'Andy Zhao', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Hoda Eldardiry'], 'affiliations': ['Adobe Research', 'Dolby Labs', 'Independent Researcher', 'University of Southern California', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.38585.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#inference', '#training'], 'emoji': '🛣️', 'ru': {'title': 'Умная маршрутизация: выбираем дополняющие друг друга модели для максимальной полноты ответа', 'desc': 'В статье предложен новый метод маршрутизации запросов между несколькими большими языковыми моделями, который учитывает корреляции и дополнительность моделей, а не оценивает их независимо. Авторы формулируют задачу как проблему выбора подмножества моделей, максимизирующую вероятность того, что хотя бы одна из выбранных моделей даст правильный ответ. Для моделирования политики маршрутизации используются детерминантные точечные процессы, которые естественным образом отражают как компетентность модели, так и её избыточность. Предложенный метод FlexRouter позволяет достичь большей полноты ответов при меньшей избыточности, а также гибко определять количество моделей без предзаданного бюджета вычислений.'}, 'en': {'title': 'Maximizing Model Coverage with FlexRouter', 'desc': 'The paper introduces FlexRouter, a new framework for routing Large Language Models (LLMs) that improves model selection by considering the complementarity between models rather than evaluating them independently. This approach aims to enhance answer coverage, ensuring that at least one selected model provides a correct response, which is crucial for practical applications. FlexRouter formulates the routing process as a coverage-oriented subset selection problem and utilizes Determinantal Point Processes (DPPs) to effectively balance model competence and redundancy. Experimental results show that FlexRouter outperforms existing methods by achieving higher coverage and lower redundancy, while also allowing for flexible inference costs.'}, 'zh': {'title': 'FlexRouter：优化模型选择的灵活路由框架', 'desc': '现有的大型语言模型（LLM）路由方法独立评分模型以选择前k个模型，但这忽视了模型之间的相关性，并强制执行严格的计算预算。因此，路由器常常选择共享失败模式的冗余模型，限制了成功的整体概率。为了解决这个问题，我们提出了FlexRouter，一个明确建模模型互补性的路由框架。FlexRouter优化答案覆盖率，最大化至少一个选定模型产生正确响应的概率。'}}}, {'id': 'https://huggingface.co/papers/2609.36956', 'title': 'Controlled Decoding Attacks on Black-Box LLMs', 'url': 'https://huggingface.co/papers/2609.36956', 'abstract': 'Abstract  Manipulating next-token probabilities during generation can bypass the safety alignment of large language models. Existing approaches, however, rely on access to model weights or numerical token probabilities and therefore do not apply to interfaces that return only sampled text. Reconstructing probabilities from sampled outputs offers a possible alternative, but finite sampling produces sparse and noisy estimates, while repeating this process at every generation step incurs substantial query costs. Our empirical observations suggest that large distributional changes along successful jailbreak trajectories are concentrated at a small subset of positions, motivating selective control. We introduce , a framework for jailbreaking through text-only continuation interfaces that permit repeated sampling and assistant-prefix continuation. Sample-Based Distribution Reconstruction combines sampled outputs with a prior over unobserved actions to obtain a usable control signal. Risk-Gated Residual Control uses the evolving response prefix to decide when to reconstruct and modify the distribution, concentrating sampling costs at selected positions. Speculative Multi-Token Execution further amortizes target calls by verifying and accepting draft prefixes that require no intervention. Across four target endpoints and three benchmarks,  achieves the highest mean score most comparisons against baselines.', 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '79d911fd62d3a9b1', 'authors': ['Jesson Wang', 'Shawn Li', 'Wei Yang', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Charith Peris', 'Yue Zhao'], 'affiliations': ['Adobe', 'Amazon', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2609.36956.jpg', 'data': {'categories': ['#security', '#alignment'], 'emoji': '🔓', 'ru': {'title': 'Обход защиты LLM через реконструкцию распределений вероятностей в текстовом интерфейсе', 'desc': 'В этой работе исследуется способность манипулировать вероятностями следующего токена во время генерации для обхода механизмов безопасности больших языковых моделей через текстовые интерфейсы. Авторы предлагают框架, который реконструирует распределение вероятностей из сэмплированных выходов, используя приор для ненаблюдаемых действий. Метод использует избирательный контроль на ключевых позициях и спекулятивное выполнение, снижая вычислительные затраты. Экспериментальные результаты на нескольких бенчмарках показывают превосходство предложенного подхода над существующими методами атаки.'}, 'en': {'title': 'Selective Control for Safer Text Generation', 'desc': 'This paper addresses the challenge of manipulating next-token probabilities in large language models to bypass safety measures. Traditional methods require access to model weights or token probabilities, which is not feasible for many applications. The authors propose a new framework that reconstructs probabilities from sampled outputs, allowing for selective control over the generation process. Their approach, which includes techniques like Sample-Based Distribution Reconstruction and Risk-Gated Residual Control, demonstrates improved performance in generating desired outputs while minimizing costs associated with repeated sampling.'}, 'zh': {'title': '通过文本续写破解大型语言模型的安全性', 'desc': '本文探讨了如何在生成过程中操控下一个词的概率，以绕过大型语言模型的安全对齐。现有的方法依赖于模型权重或数值令牌概率，因此不适用于仅返回采样文本的接口。我们提出了一种新的框架，通过文本续写接口进行破解，结合采样输出和未观察到的动作的先验信息，以获得可用的控制信号。实验结果表明，该方法在多个基准测试中表现优异，能够有效降低采样成本并提高生成质量。'}}}, {'id': 'https://huggingface.co/papers/2609.34381', 'title': 'Joint and Cross-Modal Video-Audio Generation and Editing: A Unified Formulation and Design Taxonomy', 'url': 'https://huggingface.co/papers/2609.34381', 'abstract': 'Abstract  Video and audio are perceived together, yet most generative models treat them in isolation. We examine methods that model the two modalities jointly, generate one from the other, or edit them in a coupled manner, organized around a single question: how is the output kept coherent across modalities in time and semantics? A unified formulation casts joint generation, cross-modal generation, and joint editing as three problems defined on a single distribution over audio-visual pairs, and a taxonomy compares methods along five design axes. To our knowledge, this is the first overview to systematically taxonomize joint audio-visual editing, which we map as nine edit categories spanning 28 edit types. We describe methods, datasets, and metrics for each setting and close with the open problems we view as most consequential.', 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '1d1573a3139ef4c1', 'authors': ['Abhinav Sharma', 'Sai Karthik Navuluru', 'Wang Wei', 'Daksh Dangi', 'Xiangbo Gao', 'Li Li', 'Bo Ni', 'Vardhan Dongre', 'Junda Wu', 'Xiyang Hu', 'Jiuxiang Gu', 'Seunghyun Yoon', 'Tong Yu', 'Chien Van Nguyen', 'Mohamed Elmoghany', 'Nedim Lipka', 'Hoda Eldardiry', 'Hongjie Chen', 'Tyler Derr', 'Thien Huu Nguyen', 'Zhengzhong Tu', 'Nesreen K. Ahmed', 'Franck Dernoncourt', 'Ryan A. Rossi'], 'affiliations': ['Adobe Research', 'Arizona State University', 'Cisco', 'Dolby Laboratories', 'Stanford University', 'Texas A&M University', 'University of Illinois Urbana-Champaign', 'University of Massachusetts Amherst', 'University of Oregon', 'University of Southern California', 'University of Texas at Dallas', 'Vanderbilt University', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.34381.jpg', 'data': {'categories': ['#video', '#multimodal', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Согласованная генерация и редактирование видео и аудио через мультимодальные модели', 'desc': 'В статье рассматриваются методы совместной обработки видео и аудио, которые обычно моделируются отдельно. Авторы предлагают единую формулировку для задач совместной генерации, кросс-модальной генерации и совместного редактирования, основанную на распределении пар аудио-видео. Они разработали таксономию методов по пяти ключевым осям и систематизировали редактирование аудио-видео в девять категорий с 28 типами редактирования. Работа описывает методы, датасеты и метрики для каждой задачи, выявляя основные открытые проблемы в области мультимодальной генерации.'}, 'en': {'title': 'Unifying Video and Audio: A Coherent Approach to Joint Generation and Editing', 'desc': 'This paper explores how to generate and edit video and audio together, rather than separately, to maintain coherence in both time and meaning. It introduces a unified framework that treats joint generation, cross-modal generation, and joint editing as interconnected problems based on a shared distribution of audio-visual pairs. The authors provide a comprehensive taxonomy that categorizes joint audio-visual editing into nine categories with 28 specific types of edits. Additionally, they discuss various methods, datasets, and evaluation metrics, while highlighting important open questions in the field.'}, 'zh': {'title': '音视频联合生成与编辑的全新视角', 'desc': '本论文探讨了视频和音频的联合生成模型，强调这两种模态在时间和语义上的一致性。我们提出了一种统一的框架，将联合生成、跨模态生成和联合编辑视为在音视频对的单一分布上定义的三个问题。通过对现有方法的分类，我们识别出九种编辑类别和28种编辑类型。最后，我们讨论了每种设置的方法、数据集和评估指标，并指出了未来研究中最重要的开放问题。'}}}, {'id': 'https://huggingface.co/papers/2610.02181', 'title': 'OmniSeek: Native Tool Integration for Multi-turn Audio-Visual Reasoning', 'url': 'https://huggingface.co/papers/2610.02181', 'abstract': 'Abstract  We present OmniSeek, an agentic framework that transforms an Omni Large Language Model (Omni-LLM) into an active, multi-turn reasoning agent with native tool use. Rather than passively processing an entire audio-visual sequence in a single forward pass, OmniSeek makes evidence acquisition part of the reasoning process: it dynamically decides whether to look or listen, and over which temporal window, to retrieve sparse but critical evidence across different modalities within long contexts. Through an iterative multi-turn protocol, the retrieved raw audio or visual segments are appended back into the context to support subsequent reasoning. To cold-start this capability, we build a data engine that synthesizes OmniTraj-170K, a corpus of multi-hop Chain-of-Thought trajectories with interleaved audio and visual evidence. We first supervise the model on these trajectories to instill multi-turn tool-use behavior, and then further optimize the policy via a two-stage reinforcement learning with verifiable rewards. Moreover, we introduce an Audio-Visual Necessity objective that explicitly rewards successful trajectories whose reasoning depends on both modalities, discouraging single-modality shortcuts. Extensive experiments across a wide range of benchmarks demonstrate that OmniSeek learns adaptive cross-modal evidence seeking and consistently improves audio-visual reasoning performance.', 'score': 1, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '7d49f9e9610ef6f7', 'authors': ['Haibo Wang', 'Jiteng Mu', 'Jialu Li', 'Jingru Yi', 'Yuanjun Xiong', 'Jianming Zhang', 'Lifu Huang', 'Mingze Xu'], 'affiliations': ['Adobe Research', 'University of California, Davis'], 'pdf_title_img': 'assets/pdf/title_img/2610.02181.jpg', 'data': {'categories': ['#reasoning', '#multimodal', '#training', '#long_context', '#dataset', '#video', '#agents', '#rl', '#audio', '#synthetic'], 'emoji': '🔍', 'ru': {'title': 'Активный агент с мультимодальным поиском доказательств для глубокого понимания', 'desc': 'OmniSeek — это агентный фреймворк, который превращает Omni-LLM в активного мультимодального агента, способного самостоятельно использовать инструменты для поиска доказательств. Вместо одноразовой обработки всей аудиовизуальной последовательности, модель итеративно решает, когда смотреть или слушать и из какого временного окна извлекать разреженные, но критически важные мультимодальные данные. Для обучения такому поведению авторы создали синтетический датасет OmniTraj-170K с траекториями рассуждений, содержащими чередующиеся аудио и видео доказательства, и применили supervised learning с последующей reinforcement learning оптимизацией. Введённая Audio-Visual Necessity loss функция явно поощряет решения, зависящие от обеих модальностей, препятствуя опоре только на одну модальность.'}, 'en': {'title': 'Empowering Active Reasoning with OmniSeek', 'desc': "OmniSeek is a framework that enhances a large language model (Omni-LLM) by enabling it to actively seek and use information from audio and visual sources during reasoning tasks. Instead of processing all information at once, it intelligently decides when and what to look for, allowing it to gather important evidence over time. The model is trained using a specially created dataset, OmniTraj-170K, which includes complex reasoning tasks that require both audio and visual inputs. By employing reinforcement learning and a unique objective that encourages the use of both modalities, OmniSeek significantly improves the model's ability to reason across different types of information."}, 'zh': {'title': 'OmniSeek：主动推理与跨模态证据获取的结合', 'desc': '本文介绍了OmniSeek，这是一个将Omni大型语言模型（Omni-LLM）转变为主动的多轮推理代理框架。OmniSeek通过动态决定何时查看或倾听，以及在何种时间窗口内获取证据，使得证据获取成为推理过程的一部分。通过迭代的多轮协议，获取的原始音频或视觉片段被重新加入上下文，以支持后续推理。实验表明，OmniSeek能够学习适应性跨模态证据寻求，并持续提高音频-视觉推理性能。'}}}, {'id': 'https://huggingface.co/papers/2610.00825', 'title': 'Align Then Reason: A Multimodal Lip-Sync Judge for Dubbing', 'url': 'https://huggingface.co/papers/2610.00825', 'abstract': "Abstract  Dubbing quality control requires a reference-free judge that can determine whether a candidate text line matches a speaker's visible articulation in both content and timing, using only silent video and text because dubbed audio may not yet exist. Existing visual speech recognizers and video-language models are poorly suited to this setting: even when fine-tuned to recover spoken content from lip motion, they remain largely insensitive to temporal errors. We introduce Align Then Reason (ATR), a multilingual lip-sync judge that first establishes a monotonic alignment between frame-level lip representations and the phonetic units of the candidate line, then reasons over this alignment to make the final judgment. An alignment scorer provides the LLM with both local evidence for each phonetic unit and a calibrated global alignment score, enabling it to reason jointly about content and timing. On a seven-language benchmark, our method improves mean AUC over the corresponding Qwen3.5 SFT baselines by 59.4%, 50.2%, and 50.8% with 2B, 4B, and 9B reasoners, respectively. The gains generalize across LLM families, reaching mean AUC improvements of 45.9% and 46.6% over the best baseline for LLaMA-3.1-8B and Mistral-7B, respectively. They also transfer across datasets to three unseen MuAViC languages. Furthermore, we evaluate on two downstream tasks built from real dubbing lines. On dub-line reranking, ATR-9B outperforms the best lip-reading baseline by 52.0%, while on script-to-clip assignment, ATR-9B improves over the best lip-reading baseline by 17.7%.", 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '357995f6004c63bd', 'authors': ['Rui Liu', 'Bhavin Jawade', 'Haoqi Li', 'Shivam Mehta', 'Karan Saxena', 'Yinghong Lan', 'Cameron R. Wolfe'], 'affiliations': ['Netflix', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2610.00825.jpg', 'data': {'categories': ['#video', '#multimodal', '#benchmark', '#multilingual'], 'emoji': '🎬', 'ru': {'title': 'Синхронизация губ через выравнивание и рассуждение для контроля качества дубляжа', 'desc': 'Авторы предложили метод ATR для оценки качества дубляжа, который проверяет соответствие текста движениям губ актера в видео без звука. Система использует монотонное выравнивание между представлениями губ на уровне кадров и фонетическими единицами текста, затем передает эту информацию в LLM для анализа. Подход значительно превосходит существующие модели распознавания речи по губам и видео-языковые модели, улучшая метрику AUC в среднем на 50-59% на семиязычном бенчмарке. Метод успешно переносится на новые языки и реальные задачи дубляжа, такие как переранжирование вариантов дубля и привязка сценария к видеоклипам.'}, 'en': {'title': 'Aligning Lip Movements for Better Dubbing Quality', 'desc': 'This paper presents a new method called Align Then Reason (ATR) for evaluating dubbing quality by analyzing silent video and text. ATR creates a precise alignment between lip movements and phonetic units of the spoken text, allowing it to assess both content accuracy and timing. The method significantly outperforms existing visual speech recognizers and language models, achieving substantial improvements in mean AUC across multiple languages and datasets. Additionally, ATR demonstrates strong performance in practical applications like reranking dubbing lines and matching scripts to video clips.'}, 'zh': {'title': '口型同步评估的新方法：Align Then Reason', 'desc': '本论文提出了一种新的多语言口型同步评估方法，称为Align Then Reason (ATR)。该方法通过建立帧级口型表示与候选文本的音素单元之间的单调对齐，来判断口型与文本内容和时序的匹配。ATR利用对齐评分器为大型语言模型提供局部证据和全局对齐分数，从而共同推理内容和时序。实验结果表明，ATR在多种语言基准测试中显著提高了评估性能，尤其在真实配音任务中表现优异。'}}}, {'id': 'https://huggingface.co/papers/2610.00314', 'title': 'Predictive Credit: Measuring What Scientific Explanations Add to Experimental Forecasts', 'url': 'https://huggingface.co/papers/2610.00314', 'abstract': "Abstract  Research agents explain planned experiments. We measure predictive credit with paired forecasts sharing an intervention, forecaster, and outcome while varying description, matched explanation, and donor context. Five checks track commitment, delivery, predictive gain, alignment, and known-signal uptake. Across 336 prospective states in controlled learning, 12 Tox21 endpoints, and 24 OpenML tasks, v5's frozen credit decision was inconclusive. Tox21's preregistered ROC AUC interval-score harm test was unmet (D-M=-.0026, 95 percent interval [-.0174, .0104]); OpenML's joint formation, point-equivalence, and repeatability rule was unmet. Matched point-accuracy gains over description remained unconfirmed, and Tox21/OpenML seed-donor intervals spanned zero. Under requested DeepSeek V4 Pro, matched and donor cards reduced secondary Tox21 drift by 64.5 and 59.1 percent. A DeepSeek V4 Flash replay raised matched point MAE from .01823 to .02020 and missed matched-donor interval-score equivalence. OpenML full-card assignment widened nominal 80 percent intervals by 21 percent, with 49.3 percent coverage versus 51.4 percent for description and content in 66/144 cards. Direct-text Flash delivered all 144 notes without detectable matched point-accuracy gain. A researcher-authored mechanism positive control lowered point MAE by 2.60 percentage points versus description. The protocol measures predictive credit for research-agent benchmarks and scientific forecasting; natural-explanation credit remained unconfirmed at the tested donor resolutions.", 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'b197de94d756f202', 'authors': ['Jingjie Ning', 'Xueqi Li', 'Yibo Kong', 'Dongting Li'], 'affiliations': ['Carnegie Mellon University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00314.jpg', 'data': {'categories': ['#science', '#benchmark', '#agents'], 'emoji': '🔬', 'ru': {'title': 'Объяснения агентов не гарантируют улучшение предсказаний моделей', 'desc': 'В этой работе исследователи оценивают, насколько объяснения экспериментов, предоставленные исследовательскими агентами, улучшают предсказательную способность моделей. Авторы проводят систематическое тестирование на трёх наборах данных (336 проспективных состояний, 12 эндпоинтов Tox21 и 24 задач OpenML), измеряя влияние различных типов описаний и контекста на точность предсказаний. Результаты показывают смешанные результаты: хотя некоторые методы снижали дрейф модели на Tox21 (на 64.5% и 59.1%), основные гипотезы о преимуществах объяснений не подтвердились статистически значимо. Авторы разработали протокол оценки предсказательного выигрыша от естественных объяснений для научного прогнозирования и бенчмарков с участием исследовательских агентов.'}, 'en': {'title': "Exploring Predictive Credit in Research Agents' Experiments", 'desc': 'This paper investigates how research agents can explain their planned experiments and measure the effectiveness of their predictions. It uses paired forecasts to analyze various factors like description and context while tracking metrics such as predictive gain and alignment. The results from multiple tasks showed inconclusive outcomes regarding the predictive credit of the agents, with some tests failing to meet established benchmarks. Overall, the study highlights the challenges in confirming predictive accuracy and the need for better mechanisms in scientific forecasting.'}, 'zh': {'title': '研究代理的预测信用与实验解释', 'desc': '本研究探讨了研究代理如何解释计划的实验。我们通过配对预测来衡量预测信用，这些预测共享干预、预测者和结果，同时变化描述、匹配解释和捐赠者背景。研究结果显示，在336个前瞻性状态和多个任务中，预测信用的决策并不明确，且未能满足预注册的ROC AUC区间分数测试。尽管在某些情况下，匹配和捐赠卡减少了Tox21的漂移，但整体的预测准确性提升仍未得到确认。'}}}, {'id': 'https://huggingface.co/papers/2610.00313', 'title': 'Rules to Tools: Executable Checks for LLM Agents in Scientific Computing', 'url': 'https://huggingface.co/papers/2610.00313', 'abstract': "Abstract  Scientific coding agents receive equations, boundary conditions, and output requirements in writing, then must assess the programs they revise. Rules to Tools (R2T) supplies prepared executable checks of public scientific requirements. Matched SciCode repair groups share written checks, starting programs, model, and budgets; the tool group receives a callable implementation. Across two task-ID cohorts, complete repair is 26/30 with text and 29/30 with the prepared checks. Three task IDs favor tools, one favors text, and eleven tie. The eight-ID cohort scores 13/16 versus 15/16, with a task-cluster bootstrap 95% interval of [-12.5, 43.75] percentage points for the difference. The larger shared-definition SciCode cohort ties at 13/24 per group. Five development-exposed tasks with alternate starting programs score 3/10 versus 7/10. The tool group favors tasks 17, 77, and 11; initial checks flag task 17 and report no violation for tasks 77 and 11. Task 37 favors text and has no initial reported violation. A fresh source-through-Python arm also reaches 15/16, matching the dedicated command's aggregate. In a matched PDE comparison, detailed text scores 23/24 and checks score 24/24, with 31.2% lower reported model output for checks. Agent-side output savings vary by cohort, while public CPU use rises in both task-ID cohorts. These results measure task-dependent repair outcomes and agent-side costs with prepared checks.", 'score': 1, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '9d8bc91882cee8b1', 'authors': ['Jingjie Ning', 'Guojiang Zhao', 'Chen Xu', 'Shanshan Zhong', 'Xiaochuan Li', 'Ji Zeng', 'Guolin Ke'], 'affiliations': ['DP Technology', 'School of Computer Science, Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00313.jpg', 'data': {'categories': ['#science', '#benchmark', '#agents', '#plp', '#optimization'], 'emoji': '🔧', 'ru': {'title': 'Автоматические проверки вместо текста: инструменты для надежного ремонта научного кода', 'desc': 'В статье представлена методология Rules to Tools (R2T) для улучшения работы научных агентов кодирования, которые решают задачи с дифференциальными уравнениями и граничными условиями. Система предоставляет подготовленные проверяемые тесты на основе научных требований, позволяя агентам эффективнее исправлять и валидировать сгенерированный код. Экспериментальные результаты показывают, что использование формальных проверок достигает 26-29 успешных исправлений из 30 задач, при этом эффективность зависит от типа конкретной задачи. Анализ выявляет trade-off между использованием текстовых описаний и автоматических проверок, с вариативностью успеха в зависимости от характеристик задачи и начальных условий.'}, 'en': {'title': 'Enhancing Scientific Coding with Prepared Checks', 'desc': 'This paper discusses a system called Rules to Tools (R2T) that helps scientific coding agents evaluate and improve their programming based on specific requirements. The study shows that using prepared executable checks can enhance the repair success rate of coding tasks compared to traditional text-based methods. Results indicate that while some tasks benefit more from tools, others perform better with text, highlighting the importance of context in machine learning applications. Overall, the findings suggest that integrating prepared checks can lead to more efficient coding practices and reduced computational costs.'}, 'zh': {'title': '科学编码的工具与文本之争', 'desc': '这篇论文探讨了科学编码代理如何处理方程、边界条件和输出要求，并评估他们修订的程序。研究提出了一种名为规则到工具（R2T）的系统，提供了可执行的公共科学要求检查。通过对比不同任务ID的结果，发现使用准备好的检查工具的修复成功率更高。论文还分析了不同任务对文本和工具的偏好，展示了在科学编码中的有效性和效率。'}}}, {'id': 'https://huggingface.co/papers/2609.38104', 'title': 'Explore Broadly, Reason Sharply: Push Small Models toward the Frontier via Sampling', 'url': 'https://huggingface.co/papers/2609.38104', 'abstract': 'Abstract  Power-sharpened sampling is an inference-time alternative to reinforcement-learning (RL) post-training for enhancing reasoning in large language models (LLMs). High-probability sequences are amplified under the base model without parameter updates or external rewards, avoiding the costly optimization and jagged generalization of RL. However, this approach faces a fundamental exploration--exploitation trade-off, as % strong sharpening restricts exploration, trapping samplers in plausible but incorrect reasoning trajectories, whereas weak sharpening leaves the answer distribution diffuse. To resolve this trade-off, we introduce Parallel Power Tempering (PPT), instantiating power-sharpened LLM sampling via parallel tempering. Running multiple interacting replicas in parallel at different sharpening levels allows lower-power replicas to explore diverse reasoning trajectories and higher-power chains to further exploit higher-likelihood responses favored by the sharpened target. Specifically, we tailor  to inference-time sampling by mitigating a truncation bias, identified in prior power samplers, and investigate effective swap strategies under finite memory and compute budgets. Extensive experimentation shows that  substantially improves single-chain power-sharpened sampling and outperforms RL-post-trained models, producing higher-quality reasoning traces and even achieving performance comparable to frontier models.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'c6dc0ba08ca45ced', 'authors': ['Panagiotis Theodoropoulos', 'Nan Jiang', 'Xintong Duan', 'Ali Hasan', 'Yuriy Nevmyvaka', 'Evangelos A. Theodorou', 'Wei Deng'], 'affiliations': ['Georgia Institute of Technology', 'ML Research, Morgan Stanley', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2609.38104.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🧊', 'ru': {'title': 'Параллельное закаливание мощности: исследование и эксплуатация в рассуждениях без переобучения', 'desc': 'В статье предлагается новый метод Power-sharpened sampling для улучшения логических рассуждений в больших языковых моделях без переобучения. Вместо дорогостоящего reinforcement learning авторы используют параллельный temperinng (Parallel Power Tempering), где несколько копий модели работают одновременно с разными уровнями шарпенинга. Низкокомпонентные копии исследуют разнообразные траектории рассуждений, а высококомпонентные эксплуатируют наиболее вероятные ответы, что позволяет преодолеть классический компромисс между исследованием и эксплуатацией. Метод достигает качества логических цепочек, сравнимого с frontier моделями, при этом избегая проблем обобщения, которые встречаются при RL-постобучении.'}, 'en': {'title': 'Enhancing Reasoning in LLMs with Parallel Power Tempering', 'desc': 'This paper presents Power-Sharpened Sampling as a method to improve reasoning in large language models (LLMs) without the need for reinforcement learning (RL) post-training. The authors introduce Parallel Power Tempering (PPT), which allows multiple model replicas to operate at different levels of sharpening, balancing exploration and exploitation effectively. By enabling lower-power replicas to explore various reasoning paths while higher-power replicas focus on the most likely responses, PPT addresses the limitations of traditional power sharpening. Experimental results demonstrate that PPT enhances the quality of reasoning in LLMs, outperforming RL-based approaches and achieving results comparable to state-of-the-art models.'}, 'zh': {'title': '并行功率调温：提升推理质量的新方法', 'desc': '本文提出了一种名为并行功率调温（PPT）的新方法，用于增强大型语言模型（LLMs）的推理能力。该方法通过在不同的功率水平下并行运行多个相互作用的副本，解决了探索与利用之间的权衡问题。低功率副本可以探索多样的推理路径，而高功率链则进一步利用高概率的响应。实验结果表明，PPT显著提高了单链功率增强采样的效果，超越了基于强化学习的后训练模型，生成了更高质量的推理轨迹。'}}}, {'id': 'https://huggingface.co/papers/2609.32259', 'title': 'Prefill-Free Cross-Family KV Cache Transfer for Heterogeneous Multi-Agent LLMs', 'url': 'https://huggingface.co/papers/2609.32259', 'abstract': "Abstract  Recent multi-agent LLM systems increasingly combine heterogeneous models for specialized agent roles. However, text-based communication requires each receiver to prefill shared context already processed by the sender. Reusing the sender's key-value (KV) cache avoids this redundancy, but prefill-free transfer across model families must handle differences in tokenization, model depth, and KV representations. To address these issues, we propose HeteroFold, a prefill-free cross-family KV cache transfer method that keeps both the sender and receiver frozen. HeteroFold aligns model structures, maps the sender cache into the receiver space, and calibrates it to preserve receiver behavior. Across six transfer directions, HeteroFold achieves the best cache-transfer performance on all four long-context benchmarks and most short-context settings. It also matches text-based communication on the multi-agent benchmark. At 32K context length, Llama-3.1-8BrightarrowMinistral-3-14B transfer is 10.7times faster than Native Prefill and 1.18--1.47times faster than the state-of-the-art prefill-free baselines, Dense Latent and KV Ridge. These results show that HeteroFold enables efficient cross-family KV reuse without receiver prefill.", 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'd3008c29585cd643', 'authors': ['Vincent-Daniel Yun', 'Woosang Lim', 'Haneul Yoo', 'Sungjoo Yoo', 'Murali Annavaram', 'Sai Praneeth Karimireddy'], 'affiliations': ['New York University', 'Seoul National University', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2609.32259.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Быстрый трансфер кэша между разными моделей без переобучения', 'desc': 'В статье предлагается HeteroFold — метод безпрефиксного трансфера кэша ключ-значение между различными семействами языковых моделей в мультиагентных системах. Метод решает проблему несовместимости в токенизации, глубине моделей и представлении KV кэша, оставляя обе модели замороженными. HeteroFold выравнивает структуры моделей, трансформирует кэш отправителя в пространство получателя и калибрует его для сохранения поведения. Экспериментальные результаты показывают ускорение в 10.7 раз по сравнению с нативным префиллингом и значительное улучшение по сравнению с существующими методами трансфера KV кэша на бенчмарках с длинным контекстом.'}, 'en': {'title': 'HeteroFold: Efficient KV Cache Transfer for Multi-Agent LLMs', 'desc': "This paper introduces HeteroFold, a method for transferring key-value (KV) caches between different language models without needing to prefill the receiver's context. It addresses challenges like differences in tokenization and model architecture by aligning the structures and calibrating the cache for the receiver. HeteroFold allows for efficient communication between agents by reusing the sender's KV cache, significantly speeding up the process compared to traditional methods. The results demonstrate that HeteroFold outperforms existing techniques in both long and short context scenarios, making it a valuable advancement in multi-agent systems."}, 'zh': {'title': 'HeteroFold：高效的跨家族KV缓存重用', 'desc': '最近的多智能体大语言模型系统越来越多地结合异构模型以实现专业化的代理角色。然而，基于文本的通信要求每个接收者预填充发送者已经处理的共享上下文。重用发送者的关键值（KV）缓存可以避免这种冗余，但跨模型家族的无预填充传输必须处理标记化、模型深度和KV表示的差异。为了解决这些问题，我们提出了HeteroFold，这是一种无预填充的跨家族KV缓存传输方法，能够在保持发送者和接收者不变的情况下，实现高效的缓存传输。'}}}, {'id': 'https://huggingface.co/papers/2609.34621', 'title': 'Does Native 3D Texture Generation Necessarily Require 3D Assets for Training?', 'url': 'https://huggingface.co/papers/2609.34621', 'abstract': 'Abstract  Native 3D texture generation synthesizes colors directly in 3D space for a given geometry, conditioned on multi-view reference images. It is generally believed that training such models requires large-scale, high-quality real 3D asset data, whose acquisition remains a long-standing and challenging problem. In this work, we propose Tex-Zero, demonstrating that a high-fidelity native 3D texture generation framework can be trained without 3D assets. Our key observation is that only high-quality and fine-grained color information is essential for 3D texture training, while the required geometric information is less critical and can be manually constructed rather than obtained from real 3D assets. This finding makes it possible to transform abundant, high-quality 2D images into effective training samples for 3D texture generation. Specifically, we convert high-quality 2D images into 3D training samples by representing each image as a plane in 3D space and applying patch-wise random rotations and aggregation to construct complex geometric structures. Using these constructed image data, we train the Tex-Zero VAE, which can reconstruct real 3D assets with high quality despite never observing them during training. Building upon the Tex-Zero VAE, we train the Tex-Zero DiT also exclusively on the constructed image data, where the conditioning 2D multi-view images are transformed into planes in 3D space and also encoded by the Tex-Zero VAE, thereby reducing the representation gap and improving generation quality. Extensive experiments show that Tex-Zero generates high-fidelity 3D textures with fine-grained details solely using images as training data, offering a promising perspective on the data paradigm for scaling 3D texture generation.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '076c355db0c7a5c8', 'authors': ['Jiangshan Wang', 'Zeqiang Lai', 'Jiayi Guo', 'Xin Yang', 'Xin Huang', 'Jiarui Chen', 'Ziheng Ouyang', 'Chunchao Guo', 'Xiangyu Yue'], 'affiliations': ['Fudan University', 'MMLab, CUHK', 'Nankai University', 'Shanghai Innovation Institute', 'Tencent Hunyuan', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34621.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'ti
