    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.37200', 'title': 'Adaptive Reward Routing: Dynamic Multi-Reward Optimization for Joint Audio-Video Diffusion via Forward-Process RL', 'url': 'https://huggingface.co/papers/2609.37200', 'abstract': 'Abstract  Multi-reward guided reinforcement learning (i.e., RL) offers a promising way to improve joint audio-video diffusion models along several complementary objectives, including modality-specific quality, cross-modal semantic alignment, and temporal synchronization. Its effectiveness, however, depends on two quantities that change during training: where reward-driven updates should act, and how competing rewards should be combined. Existing methods tend to rely on fixed routing and reward weights, failing to track evolving model functions. To address these limitations, we propose Adaptive Reward Routing to jointly adapt update locations and reward coordination during forward-process RL (i.e., DiffusionNFT) of joint audio-video diffusion models. Our method consists of two components. (i) Cross-Modal Influence-Guided Routing (Localizing Updates): We use bidirectional cross-attention responses as an efficient proxy for evolving cross-modal influence, dynamically reweighting token-aware losses and scaling gradients across cross-modal layers without additional model interventions. (ii) Preference-Preserving Modality-Aware Reweighting (Coordinating Rewards): We preserve predefined weights as preference priors and use branch-specific reward-gradient interactions as residual corrections after warm-up. This resolves evolving conflicts without letting dominant rewards suppress weak but essential objectives. Extensive experiments demonstrate consistent improvements in modality quality, semantic consistency, and audio-video synchronization over strong RL baselines. Ablations and mechanism analyses further validate the complementary benefits of adaptive update routing and reward coordination.', 'score': 90, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'fe5a155878eb0a0c', 'authors': ['Songlin Yang', 'Xiaotong Zhao', 'Jiacheng Zhang', 'Zhe Wang', 'Toyota Li', 'Eric Liu', 'Alan Zhao', 'Anyi Rao'], 'affiliations': ['MMLab@HKUST, The Hong Kong University of Science and Technology', 'Tencent Video', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.37200.jpg', 'data': {'categories': ['#multimodal', '#training', '#video', '#rlhf', '#rl', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Адаптивная маршрутизация вознаграждений для совместного синтеза аудио-видео', 'desc': 'В работе предложен метод адаптивной маршрутизации вознаграждений для обучения с подкреплением мультимодальных диффузионных моделей, генерирующих аудио и видео одновременно. Авторы решают проблему фиксированных весов и маршрутов обновления, предложив динамически адаптировать места применения градиентов и комбинацию нескольких вознаграждений во время обучения. Метод использует кросс-внимание между модальностями для определения наиболее влиятельных слоёв и применяет остаточные коррекции вознаграждений для разрешения конфликтов между конкурирующими целями. Эксперименты показывают улучшение качества обеих модальностей, семантической согласованности и синхронизации аудио-видео по сравнению с базовыми подходами.'}, 'en': {'title': 'Adaptive Reward Routing: Enhancing Audio-Video Models with Dynamic Learning', 'desc': 'This paper introduces a method called Adaptive Reward Routing for improving joint audio-video diffusion models using multi-reward guided reinforcement learning. The approach addresses the challenges of determining where to apply updates and how to effectively combine competing rewards during training. It features two main components: Cross-Modal Influence-Guided Routing, which dynamically adjusts updates based on evolving cross-modal influences, and Preference-Preserving Modality-Aware Reweighting, which maintains important reward preferences while correcting for conflicts. The results show significant enhancements in quality, consistency, and synchronization of audio and video outputs compared to existing reinforcement learning methods.'}, 'zh': {'title': '自适应奖励路由：提升音视频模型的强化学习', 'desc': '多奖励引导的强化学习（RL）为改进联合音频-视频扩散模型提供了一种有前景的方法，旨在实现多种互补目标，包括特定模态的质量、跨模态的语义对齐和时间同步。然而，其有效性依赖于训练过程中两个变化的量：奖励驱动更新的作用位置和竞争奖励的组合方式。现有方法通常依赖于固定的路由和奖励权重，无法跟踪模型功能的演变。为了解决这些限制，我们提出了自适应奖励路由，能够在联合音频-视频扩散模型的前向过程强化学习中共同适应更新位置和奖励协调。'}}}, {'id': 'https://huggingface.co/papers/2610.02193', 'title': 'Hierarchical Continuous Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.02193', 'abstract': 'Abstract  Discrete diffusion language models offer a compelling alternative to autoregressive generation for tasks demanding bidirectional reasoning and global constraint satisfaction. Yet they share a structural bottleneck: when decoding in parallel, each token is sampled independently from its marginal, severing the statistical dependencies among the tokens decoded together. Continuous diffusion language models avoid this by denoising a shared continuous state, but their denoiser sees only that state, so nothing ties it to a valid token configuration until it is finally decoded. To address this, we propose Hierarchical Continuous Diffusion Language Models (HC-DLM), which couple discrete token generation with a continuous latent trajectory in a single, principled denoising process, whose training objective is derived from a variational bound on the token likelihood. In contrast to recent methods that attach continuous context to a self-contained discrete chain, HC-DLM makes the latent the only persistent generative state: tokens are read out from it at every step and feed back as a scaffold for the next latent update. On structured reasoning (Sudoku), mathematical planning (Countdown) and language modeling (LM1B), HC-DLM improves over discrete and continuous diffusion baselines at matched model size, in puzzle accuracy on Sudoku and Countdown and in generative perplexity on LM1B. Project page: https://hc-dlm.github.io/.', 'score': 47, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd95a1df458e06db2', 'authors': ['Hui Ren', 'Zihan Li', 'Chang Liu', 'Huidong Liu', 'Alexander Schwing'], 'affiliations': ['Amazon.com, Inc.', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02193.jpg', 'data': {'categories': ['#reasoning', '#diffusion'], 'emoji': '🌊', 'ru': {'title': 'Слияние дискретного и непрерывного: иерархические диффузионные модели для языка', 'desc': 'Статья предлагает новый подход к диффузионным языковым моделям под названием Hierarchical Continuous Diffusion Language Models (HC-DLM), который объединяет дискретное генерирование токенов с непрерывной латентной траекторией в единый процесс денойзирования. В отличие от существующих методов, HC-DLM использует латентное состояние как единственное постоянное состояние генерации, где токены считываются на каждом шаге и подаются обратно как опора для следующего обновления латента. Обучение модели происходит на основе вариационной нижней границы функции правдоподобия токенов. Экспериментальные результаты показывают, что HC-DLM превосходит дискретные и непрерывные диффузионные базовые модели на задачах структурного рассуждения (Судоку), математического планирования (Countdown) и моделирования языка (LM1B).'}, 'en': {'title': 'Revolutionizing Language Generation with Hierarchical Continuous Diffusion', 'desc': 'The paper introduces Hierarchical Continuous Diffusion Language Models (HC-DLM), which enhance the generation of language by combining discrete token generation with a continuous latent state. This approach addresses the limitations of traditional discrete diffusion models, which sample tokens independently, losing important statistical relationships. HC-DLM employs a unified denoising process that maintains a persistent generative state, allowing for better integration of token dependencies during generation. The model demonstrates improved performance in structured reasoning tasks and language modeling compared to existing methods.'}, 'zh': {'title': '层次连续扩散语言模型的创新之路', 'desc': '离散扩散语言模型为需要双向推理和全局约束满足的任务提供了一种有吸引力的替代方案。然而，它们在并行解码时存在结构瓶颈：每个标记独立采样，切断了标记之间的统计依赖关系。连续扩散语言模型通过去噪共享的连续状态来避免这一问题，但其去噪器仅能看到该状态，直到最终解码时才与有效的标记配置关联。为了解决这个问题，我们提出了层次连续扩散语言模型（HC-DLM），将离散标记生成与连续潜在轨迹结合在一个统一的去噪过程中，从而在结构推理和语言建模任务中超越了离散和连续扩散基线。'}}}, {'id': 'https://huggingface.co/papers/2609.35690', 'title': 'Agent Priors-guided Policy Learning', 'url': 'https://huggingface.co/papers/2609.35690', 'abstract': "Abstract  Robots that learn from a few demonstrations often require two forms of generalization. Compositional generalization recombines skills to solve new tasks, and skill generalization lets the learned policy behind each skill work in new situations. The two depend on each other, yet information is lost between composition and the skills it calls. Where a skill works is determined by the structure its policy is trained with, while composition sees the skill only through a separate description, such as a name, an instruction, or a symbolic operator, that omits this structure. Our key idea is to use each policy's structural prior as part of the interface between composition and the skill. A structural prior states what a behavior depends on, for example that a grasp depends only on the gripper's pose relative to the object. Built into training, it shapes where the policy generalizes; stated in language, it tells composition where the policy applies. We instantiate this idea in Agent Priors-guided Policy Learning (APPL). A construction agent segments complete demonstrations into reusable skills, proposes several structural priors for each skill, and trains and verifies one policy per prior. A runtime agent then selects among these prior-specific policies and composes them toward new task goals using their interfaces. Across MetaWorld and long-horizon ManiSkill tasks, APPL improves out-of-distribution skill generalization and enables previously unseen skill compositions; ablating the interface information substantially reduces performance. These results support the use of training-time structural assumptions as a bridge between skill learning and skill composition.", 'score': 41, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '3d9c26b81800ba15', 'authors': ['Puming Jiang', 'Tianrun Hu', 'Haozhe Du', 'Yibo Li', 'Zhiwei Xue', 'Xinhu Li', 'Harold Soh'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.35690.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Структурные приоры как мост между обучением и композицией навыков робота', 'desc': 'В работе предложен метод APPL для обучения роботов на основе нескольких демонстраций, который решает проблему одновременной композиционной генерализации (комбинирование навыков для новых задач) и генерализации навыков (применение политик в новых ситуациях). Ключевая идея заключается в использовании структурных приоров политик как интерфейса между композицией и отдельными навыками — они определяют, от каких факторов зависит поведение. Система состоит из двух агентов: конструктивный агент сегментирует демонстрации на переиспользуемые навыки и обучает политики с разными приорами, а исполнительный агент во время работы выбирает подходящие политики и компонует их для достижения новых целей. Экспериментальные результаты на задачах MetaWorld и ManiSkill показывают, что структурные приоры значительно улучшают генерализацию навыков и позволяют выполнять ранее невиданные комбинации навыков.'}, 'en': {'title': 'Bridging Skills and Composition with Structural Priors', 'desc': 'This paper discusses a method for robots to learn from a few demonstrations by improving two types of generalization: compositional and skill generalization. Compositional generalization allows robots to combine learned skills to tackle new tasks, while skill generalization enables these skills to adapt to different situations. The authors propose using structural priors, which define the dependencies of behaviors, to enhance the connection between skill composition and the underlying policies. Their approach, called Agent Priors-guided Policy Learning (APPL), shows significant improvements in generalization and composition capabilities in various robotic tasks.'}, 'zh': {'title': '通过结构先验提升机器人技能学习与组合', 'desc': '这篇论文探讨了机器人如何通过少量示范学习并实现两种形式的泛化：组合泛化和技能泛化。组合泛化是将技能重新组合以解决新任务，而技能泛化则使得每个技能背后的学习策略能够在新情境中工作。论文提出了一种名为APPL的方法，通过使用每个策略的结构先验作为组合与技能之间的接口，来解决信息丢失的问题。实验结果表明，APPL在不同任务中提高了技能的泛化能力，并支持了新的技能组合。'}}}, {'id': 'https://huggingface.co/papers/2609.39027', 'title': 'A Missing Piece for Trustworthy AI Reviewers: From Benchmarking Rhetorical Robustness to SciCore Review', 'url': 'https://huggingface.co/papers/2609.39027', 'abstract': 'Abstract  AI reviewers can assign different judgments to manuscripts that report the same science in different wording, potentially rewarding rhetorical optimization over scientific improvement. We formulate Rhetorical Robustness as the joint requirement of stability across content-preserving rewrites and discrimination across papers. We introduce RobustReview, a controlled full-manuscript benchmark with 1,260 manuscript versions, and evaluate 30 reviewer configurations. The benchmark reveals false robustness, where low rewrite sensitivity coincides with score collapse across papers, and shows that human alignment and rhetorical robustness rank reviewers differently. Moreover, the evaluated content-focused prompting protocol does not consistently improve robustness across backbones. Motivated by these findings, we introduce SciCore, a dual-branch reviewer that averages a full-manuscript judgment with a judgment based on an extracted, structured science core. This design combines manuscript-level assessment with a content-normalized view intended to reduce rhetorical sensitivity. In our primary GPT-5.5 comparison, SciCore achieves a leading joint stability-discrimination profile among the benchmarked reviewers while maintaining competitive human alignment. These results identify rhetorical robustness as a distinct evaluation target and demonstrate the potential of science-core review to improve it.', 'score': 32, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'fa4dd83acf598cd4', 'authors': ['Chenguang Wang', 'Ming Li', 'Chengrui Fan', 'Jianpeng Chen', 'Han Chen', 'Tianyi Zhou', 'Dawei Zhou'], 'affiliations': ['MBZUAI', 'University of Maryland', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.39027.jpg', 'data': {'categories': ['#science', '#benchmark', '#interpretability', '#dataset', '#alignment'], 'emoji': '📋', 'ru': {'title': 'Риторическая робастность AI-рецензентов: от слов к науке', 'desc': 'Исследование показывает, что AI-рецензенты могут давать разные оценки одинаковым научным работам, переписанным другими словами, что награждает риторическую оптимизацию вместо научного прогресса. Авторы предлагают концепцию риторической робастности как требования стабильности при переформулировке содержания и дискриминативности между работами. Они создают бенчмарк RobustReview с 1260 версиями рукописей и обнаруживают ложную робастность, где низкая чувствительность к переписыванию совпадает с коллапсом различения между статьями. Решение SciCore использует двухветвевую архитектуру, объединяя оценку полного текста с анализом структурного научного ядра, чтобы снизить риторическую чувствительность и улучшить робастность.'}, 'en': {'title': 'Enhancing AI Reviewers with Rhetorical Robustness', 'desc': 'This paper addresses the issue of AI reviewers giving different scores to similar scientific manuscripts based on their wording rather than their actual content. It introduces the concept of Rhetorical Robustness, which requires that reviews remain stable when the text is rewritten while still being able to differentiate between different papers. The authors present RobustReview, a benchmark with numerous manuscript versions to evaluate various reviewer configurations, revealing that some reviewers may appear robust but fail to discriminate effectively. To improve this, they propose SciCore, a dual-branch reviewer that combines overall manuscript evaluation with a focus on the core scientific content, achieving better stability and discrimination in reviews.'}, 'zh': {'title': '提升评审的修辞稳健性', 'desc': '本文探讨了AI评审在评估手稿时可能受到措辞影响的问题，提出了修辞稳健性这一概念，强调在内容保持不变的情况下，评审结果应保持稳定。我们引入了RobustReview基准，包含1260个手稿版本，评估了30种评审配置，发现低重写敏感性可能导致评分不一致。为了解决这一问题，本文提出了SciCore，一个双分支评审系统，结合了完整手稿评估和基于提取的科学核心的评估，以减少对修辞的敏感性。实验结果表明，SciCore在评审的稳定性和区分性方面表现优异，同时保持了与人类评审的一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.01509', 'title': 'Sharpening Tax in Post-Training', 'url': 'https://huggingface.co/papers/2610.01509', 'abstract': 'Abstract  An emerging hypothesis about reinforcement learning (RL) post-training of large language models (LLMs) is that it merely sharpens existing behaviors of a base model, improving single-shot accuracy at the cost of solution coverage. Although this trade-off has been observed in math and coding tasks, it need not extend to agentic tasks, where multi-turn tool use and interaction may require capabilities newly acquired during post-training. Our surprising finding is that pre-trained LLMs, equipped with a light inference harness, can serve as capable agents. Despite far lower accuracy (pass@1), they often surpass their post-trained counterparts in solution coverage (pass@K) given a sufficient test-time budget. We further analyze the underlying mechanism and show that post-training pushes tasks toward two extremes, always solved or never solved, and thereby improves sampling efficiency and consistency at the cost of solution coverage. To measure this cost, we propose Sharpening Tax, a diagnostic metric that quantifies the loss in test-time scalability after post-training. Across 14 base/post-trained model pairs from four families and three agentic benchmarks (42 cases in total), the tax is prevalent in most settings, can be estimated from a few rollouts, and correlates well with other metrics. Finally, we present posterior-tempered group sampling (PTGS), a simple plug-and-play Bayesian sampler that adapts the sampling temperature per prompt to its estimated difficulty. Applied during RL training in two agentic environments, PTGS pays a smaller tax than the fixed-temperature baseline, solving more tasks under repeated sampling while also improving single-shot accuracy.', 'score': 29, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '855b186032d55afe', 'authors': ['Changdae Oh', 'Qi Zeng', 'Qi Qi', 'Andrey Zhmoginov', 'Deren Lei', 'Yun He', 'Hoang Phan', 'Hangoo Kang', 'Azalia Mirhoseini', 'Sharon Li'], 'affiliations': ['Meta Superintelligence Labs', 'NYU', 'Stanford University', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.01509.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#training', '#agents', '#alignment', '#rl', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Налог заточки: когда RL-обучение жертвует разнообразием ради точности', 'desc': 'В этой работе исследуется парадоксальный эффект обучения с подкреплением (RL) для больших языковых моделей: хотя post-training улучшает точность на одной попытке (pass@1), он часто снижает способность модели находить разнообразные решения при многократной генерации (pass@K). Авторы показывают, что базовые предобученные модели с простой системой управления выводом могут работать как эффективные агенты, демонстрируя лучшую покрытие решений при достаточном бюджете тестирования. Введена метрика Sharpening Tax, которая количественно измеряет потерю масштабируемости при тестировании после обучения, и показано, что эта потеря распространена в большинстве случаев. Предложен метод posterior-tempered group sampling (PTGS) — адаптивный байесовский сэмплер, который автоматически подбирает температуру генерации для каждого запроса в зависимости от его сложности, снижая потери и улучшая одновременно как разнообразие, так и точность решений.'}, 'en': {'title': 'Balancing Accuracy and Coverage in Reinforcement Learning for LLMs', 'desc': 'This paper investigates the effects of post-training reinforcement learning (RL) on large language models (LLMs), suggesting that it primarily enhances existing behaviors rather than expanding solution coverage. The authors find that pre-trained LLMs can outperform post-trained models in terms of solution coverage, despite lower single-shot accuracy, when given enough time to test. They introduce a new metric called Sharpening Tax to measure the trade-off between improved sampling efficiency and reduced solution coverage after post-training. Additionally, they propose a novel Bayesian sampling method, posterior-tempered group sampling (PTGS), which adjusts the sampling temperature based on task difficulty, leading to better performance in agentic tasks.'}, 'zh': {'title': '后期训练的锐化税与智能体能力的平衡', 'desc': '这篇论文探讨了强化学习（RL）在大型语言模型（LLMs）后期训练中的作用，提出后期训练主要是增强基础模型的现有行为，虽然提高了单次准确率，但牺牲了解决方案的覆盖率。研究发现，经过预训练的LLMs在轻量推理框架下可以作为有效的智能体，尽管准确率较低，但在解决方案覆盖率上往往超过后期训练的模型。论文还分析了后期训练如何将任务推向两种极端，导致解决方案的效率和一致性提高，但覆盖率下降。为此，提出了“锐化税”这一诊断指标，用于量化后期训练带来的测试时间可扩展性损失，并展示了在多种环境下的普遍性和相关性。'}}}, {'id': 'https://huggingface.co/papers/2610.02162', 'title': 'World Observer: Joint Actor-Observer Generation for Persistent World Modeling', 'url': 'https://huggingface.co/papers/2610.02162', 'abstract': "Abstract  How can a world model continuously observe regions beyond the actor's current view? Video world models simulate how an environment evolves from an agent's actions, yet remain actor-centric. Once an object leaves the actor's view, they lose direct evidence of its evolution, often failing to preserve its state and dynamics upon re-entry. To address this, we introduce World Observer, which decouples observing from acting by jointly generating a perspective actor for the agent-centric view with one or more panoramic observers that watch selected world regions. This allows objects that leave the actor's view to remain visually evolving in an observer, so their updated states are reflected when they re-enter. We ground the actor and observers by warping from a shared panoramic source for explicit geometric correspondence, and introduce an Observer Sink of high-resolution perspective references to restore fine appearance upon re-entry. Since the observers are decoupled from the actor, they can be placed freely across the scene, extended to multiple locations for broader coverage, and driven by control signals to steer out-of-view evolution. To evaluate out-of-view evolution, we further introduce world-space metrics and a benchmark spanning real and synthetic scenes. World Observer substantially improves out-of-view dynamics while remaining competitive in visual fidelity, camera control, and 3D adherence.", 'score': 28, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'b260be5c6f3586db', 'authors': ['Hyunwook Choi', 'Dahyun Chung', 'Hyunsung Kim', 'Siyoon Jin', 'Jinhyeok Choi', 'Junyoung Seo', 'Seungryong Kim'], 'affiliations': ['KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.02162.jpg', 'data': {'categories': ['#video', '#3d', '#benchmark'], 'emoji': '👁️', 'ru': {'title': 'Наблюдатели за пределами экрана: мировая модель с множественной перспективой', 'desc': 'Статья представляет World Observer — видео модель мира, которая решает проблему отслеживания объектов, выходящих из поля зрения агента. Система использует несвязанную архитектуру, одновременно генерируя перспективное представление для основного актора и панорамные наблюдатели для мониторинга выбранных регионов сцены. Метод использует геометрическое преобразование из общего панорамного источника и специальный механизм восстановления деталей при повторном появлении объектов в поле зрения. Авторы вводят новые метрики для оценки эволюции объектов вне видимой области и демонстрируют значительное улучшение качества предсказания динамики.'}, 'en': {'title': 'Enhancing Out-of-View Dynamics with World Observer', 'desc': "This paper presents a new approach called World Observer, which enhances video world models by allowing agents to observe areas beyond their immediate view. Traditional models lose track of objects once they leave the actor's perspective, but World Observer uses panoramic observers to continuously monitor these objects, ensuring their states are updated and accurately reflected when they re-enter the actor's view. The method employs a shared panoramic source for geometric consistency and introduces an Observer Sink for high-resolution details upon re-entry. Overall, World Observer improves the tracking of out-of-view dynamics while maintaining high visual quality and effective camera control."}, 'zh': {'title': '超越视野的观察：World Observer模型', 'desc': '本文提出了一种名为World Observer的模型，旨在解决在机器学习中，智能体在视野之外观察环境的挑战。传统的视频世界模型通常以智能体为中心，一旦物体离开视野，智能体就无法继续跟踪其状态和动态。World Observer通过引入全景观察者，允许智能体在不直接观察的情况下，仍然能够获取物体的演变信息。该模型通过共享全景源进行几何对应，并引入高分辨率的参考点，以确保物体重新进入视野时能够恢复其细致外观。'}}}, {'id': 'https://huggingface.co/papers/2610.00906', 'title': 'ActiveSaddler: Automated Curriculum Learning for Agent Harness Optimization', 'url': 'https://huggingface.co/papers/2610.00906', 'abstract': 'Abstract  Automated harness optimization can substantially improve LLM agents by iteratively updating their prompts, tool interfaces, and control logic from execution feedback. However, existing methods primarily optimize how the harness is updated while largely fixing which training scenarios generate the feedback that drives those updates. As the harness evolves, the scenarios most useful for further optimization can change, suggesting that the training curriculum itself should adapt alongside the harness. We formulate this missing dimension of harness optimization as an automated curriculum learning problem and introduce ActiveSaddler. ActiveSaddler models the evolving curriculum as a non-stationary bandit with dynamically instantiated optimization targets. It abstracts recurring failures into reusable failure-pattern arms, estimates the potential learning progress from further targeting each pattern, and adaptively balances revisiting known weaknesses with exploring unseen scenarios for new ones. Optimization outcomes continually update both the set of discovered failure patterns and their priorities, allowing the curriculum to co-evolve with the harness. Experiments on GAIA2 and Terminal-Bench 2.0 show that ActiveSaddler consistently discovers stronger harnesses, improving test Pass@1 by 4.4 and 7.5 percentage points over the same harness optimizer using a scenario order fixed before optimization, respectively. Ablations further show that these gains depend on dynamically constructing optimization targets, estimating their evolving utility, and balancing continued optimization with new failure discovery. Together, these results establish automated curriculum learning as a new crucial optimization dimension for harness optimization.', 'score': 28, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'bbcc243ce096ebfa', 'authors': ['Sungho Park', 'Wonjoong Kim', 'Jue Zhang', 'Wook-Shin Han', 'Pengfei Gao', 'Chanyoung Park', 'Yongqiang Yao', 'Rao Fu', 'Elsie Nallipogu', 'Qingwei Lin', 'Victor Rühle'], 'affiliations': ['KAIST', 'Microsoft', 'POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2610.00906.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🎯', 'ru': {'title': 'Адаптивная программа обучения для эволюции LLM агентов', 'desc': 'В этой работе предложен метод ActiveSaddler для автоматической оптимизации агентов на основе LLM путём адаптивного выбора обучающих сценариев. Система моделирует процесс обучения как нестационарный многорукий бандит, который группирует повторяющиеся ошибки в переиспользуемые шаблоны отказов и оценивает потенциал обучения от каждого из них. Алгоритм балансирует между углублением работы с известными слабостями и исследованием новых сценариев, позволяя учебной программе развиваться вместе с оптимизируемой системой. Экспериментальные результаты показывают улучшение метрик Pass@1 на 4.4-7.5 процентных пункта по сравнению с методами фиксированного порядка сценариев.'}, 'en': {'title': "Evolving Training for Smarter AI: ActiveSaddler's Dynamic Curriculum Learning", 'desc': 'This paper presents ActiveSaddler, a novel approach to optimize the training harness of large language model (LLM) agents by integrating automated curriculum learning. It addresses the limitation of existing methods that fix training scenarios while optimizing harness updates, proposing that the training curriculum should evolve alongside the harness. ActiveSaddler treats the curriculum as a non-stationary bandit problem, dynamically adjusting optimization targets based on recurring failure patterns and their learning potential. Experimental results demonstrate that this adaptive approach significantly enhances harness performance, highlighting the importance of curriculum evolution in the optimization process.'}, 'zh': {'title': '自动化课程学习：优化的关键维度', 'desc': '这篇论文介绍了一种名为ActiveSaddler的自动化课程学习方法，用于优化大型语言模型（LLM）代理的执行反馈。现有方法主要关注如何更新优化工具，而忽视了生成反馈的训练场景的变化。ActiveSaddler将课程视为一个非平稳的赌博问题，动态调整优化目标，并通过重用失败模式来提高学习效率。实验结果表明，ActiveSaddler能够显著提升优化效果，使得测试通过率提高了4.4到7.5个百分点。'}}}, {'id': 'https://huggingface.co/papers/2610.01215', 'title': 'AutoGUIWorld: Image Generators as Visual World Models for GUI Agent', 'url': 'https://huggingface.co/papers/2610.01215', 'abstract': 'Abstract  GUI agents require high-quality interaction trajectories to learn how software environments respond to actions, maintain state, and support multi-step workflows. However, the diversity of available trajectories is constrained by the applications, interface states, and workflows accessible in the underlying environments. Expanding this coverage requires deploying increasingly diverse and complex software, with specialized applications imposing additional installation, configuration, and runtime costs. We introduce AutoGUIWorld, a data generation framework that combines the visual priors of image generators with the task knowledge of a planner to synthesize GUI interaction trajectories without deploying or running the corresponding software environments. AutoGUIWorld samples initial GUI scenes from structured specifications of operating-system context, visual appearance, and interface state, and generates tasks conditioned on those scenes. A planner then specifies atomic actions and their intended visual consequences, while an image generator iteratively edits the current screenshot to produce subsequent observations. Action grounding and transition-level quality filtering yield 79,266 spatially annotated step-level training samples across Ubuntu, Windows, macOS, and Chrome. Fine-tuning Qwen3.5-35B-A3B on AutoGUIWorld trajectories improves the mean task score on OSWorld from 33.0% to 40.8% and the task success rate on ScienceBoard from 14.0% to 32.2%. These results show that generated trajectories improve GUI-agent performance on real desktop and scientific tasks.', 'score': 26, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e0072d0523271137', 'pdf_title_img': 'assets/pdf/title_img/2610.01215.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#data'], 'emoji': '🖥️', 'ru': {'title': 'Синтез данных для обучения GUI-агентов через генеративные модели', 'desc': 'Авторы представляют AutoGUIWorld — фреймворк для синтетической генерации данных взаимодействия с графическим интерфейсом без необходимости развёртывания реальных приложений. Система комбинирует визуальные модели для генерации изображений с плланировщиком задач, чтобы создавать траектории действий агента на основе структурированных спецификаций интерфейса. Фреймворк генерирует начальные сцены GUI, формирует задачи, планирует атомарные действия и итеративно редактирует скриншоты для создания последовательности наблюдений. Обучение LLM на синтетических данных значительно улучшило производительность агентов на реальных задачах операционных систем и научных приложениях.'}, 'en': {'title': 'Enhancing GUI Agents with AutoGUIWorld: Generate, Train, Succeed!', 'desc': 'This paper presents AutoGUIWorld, a framework designed to generate high-quality interaction trajectories for GUI agents without needing to run actual software environments. It combines visual image generation with task planning to create diverse and complex GUI scenarios, which helps in training agents more effectively. By sampling GUI scenes and generating tasks based on structured specifications, the framework produces a large dataset of annotated training samples. The results demonstrate that fine-tuning a model on these generated trajectories significantly enhances the performance of GUI agents in real-world tasks.'}, 'zh': {'title': 'AutoGUIWorld：无需运行软件的GUI交互轨迹生成', 'desc': '本论文介绍了AutoGUIWorld，这是一个数据生成框架，用于合成高质量的GUI交互轨迹，而无需实际运行软件环境。该框架结合了图像生成器的视觉先验和规划器的任务知识，能够从操作系统上下文、视觉外观和界面状态的结构化规范中采样初始GUI场景。通过规划器指定原子动作及其预期的视觉后果，图像生成器则迭代编辑当前屏幕截图以生成后续观察。实验结果表明，使用AutoGUIWorld生成的轨迹显著提高了GUI代理在实际桌面和科学任务中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.01415', 'title': 'Beyond Memory: Harnessing Long-Horizon Agents with Explicit Belief States', 'url': 'https://huggingface.co/papers/2610.01415', 'abstract': "Abstract  Large language model (LLM) agents can now undertake increasingly complex tasks, but the way they organize interaction history into memory does not ensure a coherent understanding of the current world. We introduce PoS, an inference-time framework that constructs and continually maintains explicit belief states as the agent's decision context. Each belief combines an estimate of the current world state with unresolved task requirements, making explicit what the agent still needs to learn and accomplish. To keep this belief reliable and actionable, PoS validates its consistency and monitors task progress to detect Belief Trapping, where the agent continues to act without making meaningful progress toward the goal. Recovery is then tailored to both the trapping pattern and the type of unresolved task requirement. Experiments on four benchmarks spanning execution and diagnosis show that PoS achieves the highest overall performance on every benchmark with all three LLM backbones. Ablations demonstrate the importance of consistency validation and recovery, while context-scaling experiments show resilience to context growth. Together, these results support belief construction and continual maintenance as a foundation for long-horizon context management beyond history retention and compression.", 'score': 25, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'a09c60be2cfa2f94', 'authors': ['Yu Luo', 'Jiamin Jiang', 'Yimin Zuo', 'Xidao Wen', 'Rongchen Gao', 'Yongqian Sun', 'Shenglin Zhang', 'Guiyang Liu', 'Cheng Zhang', 'Fang Situ', 'Qi Zhou', 'Dan Pei'], 'affiliations': ['Alibaba Group', 'Nankai University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.01415.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Явные модели убеждений для надёжного управления контекстом агентов', 'desc': 'В статье предлагается PoS — это фреймворк, работающий во время инференции, который помогает LLM-агентам создавать и поддерживать явные модели убеждений о состоянии мира. Каждое убеждение объединяет оценку текущего состояния окружения с невыполненными требованиями задачи, делая явным то, что агенту ещё нужно узнать. Система валидирует согласованность убеждений и отслеживает прогресс в решении задачи, обнаруживая ситуации, когда агент действует без реального прогресса. Экспериментальные результаты на четырёх бенчмарках демонстрируют, что PoS превосходит базовые методы со всеми тестируемыми LLM, подтверждая эффективность конструирования и поддержания моделей убеждений для управления контекстом на длинных горизонтах.'}, 'en': {'title': 'Empowering LLMs with Dynamic Belief Management for Effective Task Execution', 'desc': 'This paper presents PoS, a framework designed to enhance the decision-making capabilities of large language model (LLM) agents by maintaining explicit belief states. These belief states integrate the current understanding of the world with outstanding task requirements, allowing the agent to identify what it still needs to learn and achieve. The framework also addresses the issue of Belief Trapping, where agents may act without making real progress, by validating the consistency of beliefs and monitoring task advancement. Experimental results demonstrate that PoS significantly improves performance across various benchmarks, highlighting the importance of belief management for effective long-term task execution.'}, 'zh': {'title': '信念构建与持续维护：超越历史保留的长远管理', 'desc': '大型语言模型（LLM）代理可以执行越来越复杂的任务，但它们的记忆组织方式并不能确保对当前世界的连贯理解。我们提出了PoS框架，在推理时构建并持续维护明确的信念状态，作为代理的决策背景。每个信念结合了对当前世界状态的估计和未解决的任务需求，明确了代理仍需学习和完成的内容。实验表明，PoS在四个基准测试中表现最佳，验证了一致性和恢复的重要性，并展示了在上下文增长方面的韧性。'}}}, {'id': 'https://huggingface.co/papers/2610.02205', 'title': 'ROWBench: Do Video Models Render What the Program Specifies?', 'url': 'https://huggingface.co/papers/2610.02205', 'abstract': "Abstract  Programmable world models separate executable dynamics from visual generation, offering a promising foundation for next-generation game engines. However, their visual adherence to explicit rules and interactions remains insufficiently evaluated. Existing benchmarks assess visual quality, controllability, and instruction or physical adherence, but rarely test fidelity to fine-grained, program-specified world events. We introduce PROWBench, comprising 170 programmatically constructed episodes and 600 proxy videos covering diverse scenes and interactions. PROWBench logs entity states and timestamped events, including those outside the camera's field of view, as replayable world records, from which it renders synchronized views and proxy representations. This enables generated videos to be checked against the observable consequences of program execution. An extensible framework constructs scenes, controls behaviors, and can render each camera view in different representations, such as coarse 3D, and bounding boxes. The benchmark covers first- and third-person perspectives, with synchronized multi-view observations available for a subset of episodes. Grounded in these records, PROWBench evaluates entity control, long-horizon memory, and, with two VLM-based metrics, Logic-Render Alignment and Interaction Success Rate, adherence to the prescribed timeline and the visual realization of timestamped engine-recorded events.", 'score': 21, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'cf01165b11bb989c', 'authors': ['Zheng-Hui Huang', 'Guixu Lin', 'Yu-Ju Tsai', 'Jian-Kai Zhu', 'Fengbo Lan', 'Yu-Lun Liu', 'Yung-Yu Chuang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.02205.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#games', '#long_context', '#video', '#3d'], 'emoji': '🎮', 'ru': {'title': 'Проверка точности визуальной реализации программных правил в world models', 'desc': 'В статье предложен PROWBench — новый бенчмарк для оценки программируемых world models, которые отделяют исполняемую динамику от визуальной генерации. Бенчмарк содержит 170 программно сконструированных эпизодов и 600 прокси-видео с логированием состояний сущностей и timestamped событий, включая события вне поля зрения камеры. Фреймворк позволяет проверять соответствие генерируемых видео предписанной логике программы через две новые метрики на основе VLM: Logic-Render Alignment и Interaction Success Rate. Такой подход обеспечивает комплексную оценку контроля над сущностями, долгосрочной памяти и точной визуализации запрограммированных взаимодействий в world models.'}, 'en': {'title': 'Evaluating Visual Fidelity in Programmable World Models with PROWBench', 'desc': 'This paper presents PROWBench, a new benchmark designed to evaluate the visual fidelity of programmable world models in game engines. It focuses on assessing how well these models adhere to specific program-defined events and interactions, which is often overlooked in existing evaluations. PROWBench includes a comprehensive set of 170 episodes and 600 videos that capture various scenes and interactions, allowing for detailed analysis of entity states and events. The framework supports multiple perspectives and representations, enabling researchers to measure the accuracy of visual outputs against the expected outcomes of program execution.'}, 'zh': {'title': 'PROWBench：提升可编程世界模型的视觉一致性', 'desc': '可编程世界模型将可执行的动态与视觉生成分开，为下一代游戏引擎提供了有希望的基础。然而，它们在视觉上对明确规则和交互的遵循仍然评估不足。我们引入了PROWBench，它包含170个程序构建的剧集和600个代理视频，涵盖多样的场景和交互。该基准测试评估实体控制、长期记忆以及与时间戳引擎记录事件的视觉实现的一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.38024', 'title': 'Retrieval-Augmented Skill Optimization via Cross-Harness Adaptation', 'url': 'https://huggingface.co/papers/2609.38024', 'abstract': 'Abstract  An agent skill is a reusable, actionable natural-language artifact that guides an agent to perform a task effectively under a given harness. Recent studies have explored the optimization of agent skills, contributing to a growing collection of publicly available skills spanning diverse tasks, domains, and harnesses. Despite millions of publicly shared skills, existing skill optimization methods largely overlook this accumulated knowledge, instead relying solely on expensive agent rollouts to iteratively refine skills for a target task. To address this, we propose Retrieval-Augmented Skill Optimization (RASO), a framework that leverages an external skill corpus as prior knowledge throughout skill optimization. RASO retrieves relevant knowledge from existing skills and adapts it to the target task and harness via Cross-Harness Adaptation, accounting for mismatches in both domain and harness. RASO comprises two complementary stages: Retrieval-Augmented Skill Initialization (RASI) constructs a knowledge-grounded initial skill without requiring agent rollouts, while Retrieval-Augmented Skill Update (RASU) iteratively refines the skill by retrieving external knowledge guided by execution feedback. Across four agent benchmarks and two models, extensive experiments show that RASO consistently outperforms baselines without retrieval-augmented skill initialization and updating.', 'score': 21, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '11f5a85f5f7f8192', 'authors': ['Jaewon Chu', 'Ji Soo Lee', 'Jihwan Park', 'Dohwan Ko', 'Jeehye Na', 'Seunghun Lee', 'Taehoon Lee', 'Minseo Yoon', 'Minseok Joo', 'Yunyang Xiong', 'Hyunwoo J. Kim'], 'affiliations': ['KAIST', 'Korea University', 'Meta AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.38024.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rag'], 'emoji': '🔄', 'ru': {'title': 'Переиспользование накопленного опыта для эффективной оптимизации навыков агентов', 'desc': 'В статье предлагается фреймворк RASO для оптимизации навыков агентов, который использует внешний корпус существующих навыков в качестве предварительного знания. Метод включает два этапа: инициализацию навыка на основе извлечённого знания без дорогостоящих взаимодействий агента и итеративное уточнение навыка с использованием обратной связи от выполнения. Ключевая идея — адаптация знаний из разных источников к целевой задаче через механизм Cross-Harness Adaptation, который учитывает различия в доменах и окружениях. Экспериментальные результаты на четырёх бенчмарках показывают, что RASO значительно превосходит методы без retrieval-augmented компонентов.'}, 'en': {'title': 'Enhancing Agent Skills with Knowledge Retrieval', 'desc': 'This paper introduces Retrieval-Augmented Skill Optimization (RASO), a new framework designed to enhance the performance of agent skills by utilizing existing knowledge from a skill corpus. RASO addresses the inefficiencies of traditional skill optimization methods that depend heavily on costly agent rollouts by incorporating relevant skills from a database. The framework consists of two main components: RASI, which creates an initial skill based on prior knowledge, and RASU, which refines the skill using feedback from its execution. Experimental results demonstrate that RASO significantly improves skill performance across various benchmarks compared to methods that do not use retrieval-augmented techniques.'}, 'zh': {'title': '提升智能体技能优化的全新方法', 'desc': '本文提出了一种名为检索增强技能优化（RASO）的框架，旨在提高智能体技能的优化效率。RASO利用外部技能库作为先验知识，通过跨环境适应将相关知识应用于特定任务。该框架包括两个阶段：检索增强技能初始化（RASI）和检索增强技能更新（RASU），前者在不依赖智能体回合的情况下构建初始技能，后者则通过执行反馈迭代优化技能。实验结果表明，RASO在多个基准测试中表现优于传统方法。'}}}, {'id': 'https://huggingface.co/papers/2609.38923', 'title': 'GraphForge: Training Working Agents with Graph-Anchored Workspace Synthesis', 'url': 'https://huggingface.co/papers/2609.38923', 'abstract': "Abstract  Working agents need to read diverse files, coordinate tools, and produce deliverables. Training such agents requires tasks built on many real files with verifiable results, but few pipelines exist to synthesize this kind of data. Existing pipelines either generate files with models, which lack realism and diversity, or build tasks on real files without task-specific verifiers, leaving result quality unchecked. We introduce GraphForge, an evidence-graph based framework that grounds both the task and its verification in real files. Starting from occupation-grounded seeds for controlled diversity, GraphForge assembles a workspace of real files for each seed and builds an evidence graph over their relations. Since the task statement and rubrics are both derived from this graph, task requirements are backed by the workspace files and each criterion is anchored to the files needed to verify it. An initial rollout further tests executability, and a revision agent repairs the task and rubrics against the original files before trajectories are collected. Fine-tuning Qwen3.6-27B on 2,169 GraphForge trajectories brings GDPVal to 1445.7 (+65.7) under OpenHands, and Workspace-Bench-Lite and SpreadsheetBench II to 63.7 (+7.7) and 24.0 (+13.7) under Claude Code. Rejection fine-tuning on the SFT model's own rollouts, with candidates selected by the evidence-anchored rubrics, yields further improvements on all three benchmarks, suggesting that the rubrics provide a useful selection signal. The data and models are available.", 'score': 18, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5723a4c3d45affcd', 'authors': ['Qisheng Su', 'Hanchen Wang', 'Guanru Zhu', 'Huicheng Jiang', 'Qiuyinzhe Zhang', 'Kou Shi', 'Zhen Fang', 'Ziao Zhang', 'Qingnan Ren', 'Zehui Chen', 'Tao Gui', 'Feng Zhao'], 'affiliations': ['Fudan University', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.38923.jpg', 'data': {'categories': ['#dataset', '#agents', '#training'], 'emoji': '🏗️', 'ru': {'title': 'Синтез данных для обучения агентов через графы связей реальных файлов', 'desc': 'Авторы предлагают GraphForge — фреймворк для синтеза высококачественных данных для обучения агентов, которые работают с файлами и инструментами. Вместо генерации синтетических файлов или использования реальных файлов без проверки качества, фреймворк строит граф связей между реальными файлами и привязывает к ним как описание задачи, так и критерии её оценки. Система включает начальный проход для проверки выполнимости и агента-ревизора, который улучшает задачи и рубрики перед сбором траекторий. Fine-tuning моделей на 2169 траекториях GraphForge и последующее rejection fine-tuning с использованием привязанных к графу рубрик значительно улучшают производительность на нескольких бенчмарках.'}, 'en': {'title': 'GraphForge: Real Data for Real Tasks in Agent Training', 'desc': 'This paper presents GraphForge, a framework designed to enhance the training of working agents by utilizing real files for task generation and verification. Unlike existing methods that either lack realism or do not verify results, GraphForge creates a workspace of real files and builds an evidence graph to connect tasks with their verification criteria. The framework ensures that task requirements are directly linked to the files used for verification, improving the quality of the generated tasks. The results show significant performance improvements on various benchmarks after fine-tuning a model using the trajectories generated by GraphForge.'}, 'zh': {'title': 'GraphForge：基于证据图的智能体训练框架', 'desc': '本论文介绍了一种名为GraphForge的框架，用于训练能够处理多样文件的智能体。该框架通过构建基于证据的图，确保任务和验证都基于真实文件，从而提高了结果的真实性和多样性。GraphForge从职业相关的种子开始，组装真实文件的工作空间，并在其关系上构建证据图，以确保任务要求与文件相匹配。通过对Qwen3.6-27B模型进行微调，GraphForge在多个基准测试中显著提高了性能，表明该框架在智能体训练中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.39375', 'title': 'Beyond the Current Scene: Event-Referential Grasping with Active View Selection', 'url': 'https://huggingface.co/papers/2609.39375', 'abstract': "Abstract  A robot that observes people interacting with objects should be able to carry out later requests that refer back to those interactions. Such requests may specify a grasp target by the role it played in a past event rather than by its name or appearance. Moreover, the target may no longer be visible when the robot is asked to act. We present BeyondSCe, a zero-shot robotic grasping system for this event-referential setting. Given the event history and the current scene, the system identifies the requested object or part and localizes it for grasping. If the target is occluded, it combines an event prior recovered from the history with current scene geometry to select camera viewpoints likely to reveal the target. The system uses pretrained models without additional task-specific training. In real-robot experiments with a single wrist-mounted RGB-D camera, it achieves grasp success rates of 76% and 77% for initially visible and occluded targets, respectively, compared with 40% and 55% for the strongest baseline in each condition. On four additional scenes with heavy occlusion, it increases grasp success rates from 75% to 95% while reducing the mean number of views from 3.35 to 2.20, compared with an active-perception baseline given the target's ground-truth 3D bounding box.", 'score': 17, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b14202e698a2cfb1', 'authors': ['Hyunjoon Lee', 'Haebeom Jung', 'Eunsung Cha', 'Daeun Lee', 'Yu-Chiang Frank Wang', 'Jaesung Choe', 'Jaesik Park'], 'affiliations': ['NVIDIA', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39375.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Робот, помнящий события: захват предметов через историю взаимодействий', 'desc': 'BeyondSCe — это система для роботизированного захвата предметов, которая понимает прошлые события с участием человека и объектов. Система может идентифицировать целевой объект или его часть на основе роли, которую они играли в предыдущих взаимодействиях, даже если объект больше не виден. При окклюзии система комбинирует информацию из истории событий с геометрией текущей сцены для выбора оптимальных точек обзора. Система использует предварительно обученные модели без дополнительного обучения на конкретную задачу и достигает высокой точности захвата как для видимых, так и для скрытых целей.'}, 'en': {'title': 'Grasping Beyond Sight: A Zero-Shot Approach to Object Interaction', 'desc': 'The paper introduces BeyondSCe, a robotic grasping system designed to understand and act on requests based on past interactions with objects. It allows the robot to identify and localize objects even when they are not visible, using event history and current scene information. The system employs zero-shot learning, utilizing pretrained models without needing additional training for specific tasks. In experiments, BeyondSCe demonstrated significantly higher grasp success rates compared to existing methods, especially in scenarios with occluded targets.'}, 'zh': {'title': '超越事件的智能抓取系统', 'desc': '本文介绍了一种名为BeyondSCe的机器人抓取系统，能够在观察人类与物体互动后，根据事件历史进行抓取请求。该系统可以在目标物体不可见的情况下，通过结合事件先验和当前场景几何信息来选择合适的摄像机视角。BeyondSCe使用预训练模型，无需额外的特定任务训练，展现出较高的抓取成功率。实验结果表明，该系统在可见和遮挡目标的抓取成功率上均显著优于传统基线。'}}}, {'id': 'https://huggingface.co/papers/2610.01016', 'title': 'Scaling and Distilling Text Embeddings for Better Diffusibility', 'url': 'https://huggingface.co/papers/2610.01016', 'abstract': "Abstract  Diffusion language models (DLMs) offer a promising alternative to autoregressive (AR) language generation. Recent advances in continuous DLMs, which apply latent diffusion to continuous text embeddings, raise a practical question: which embedding makes the best latent space, i.e., the most diffusible? To answer this, we search through different embeddings and find that scaling the embedding model to stronger ones within the same family (T5 to T5Gemma-1 to T5Gemma-2) greatly improves generative performance. But the raw T5Gemma-2 embeddings are still not optimal. They are so discriminative that even the embeddings of plausible alternative words are separated, which makes the generation vulnerable to imperfect sampling. Consequently, continuous diffusion often fails to reach any of them and ends up at an invalid embedding instead. To address this, we distill T5Gemma-2 into a student encoder that learns the teacher's decoded probabilities as soft labels. Learning from such soft labels makes the student pull the alternative embeddings closer while maintaining the encoding-decoding mechanism. The distilled embeddings form a more connected and diffusible latent space, improving over the vanilla T5Gemma-2 embeddings. As a result, our medium-sized DLM achieves Gen. PPL 17.8 (against real-text PPL 15.4) at real-text entropy on OpenWebText, outperforming GPT-2-M on Gen. PPL.", 'score': 15, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '809c8d1fb4fee768', 'authors': ['Zekai Zhang', 'Yunjie Tian', 'Yanjin He', 'Xiaoyan Zhang', 'Dongdi Zhao', 'Qing Qu', 'Di Fu'], 'affiliations': ['University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2610.01016.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#optimization', '#training'], 'emoji': '🌊', 'ru': {'title': 'Дистилляция эмбеддингов для улучшения диффузионной генерации текста', 'desc': 'В работе исследуются диффузионные языковые модели как альтернатива авторегрессивной генерации текста. Авторы показывают, что качество генерации сильно зависит от выбора пространства эмбеддингов, и обнаруживают, что сырые эмбеддинги T5Gemma-2 слишком дискриминативны, разделяя даже правдоподобные альтернативные слова. Для решения этой проблемы они применяют дистилляцию: обучают студент-энкодер воспроизводить вероятности учителя как мягкие метки, что приближает альтернативные эмбеддинги друг к другу. Полученное дистиллированное пространство становится более связным и диффузируемым, позволяя модели среднего размера достичь лучшей перплексии на OpenWebText, чем GPT-2-M.'}, 'en': {'title': 'Enhancing Language Generation with Diffusion Models', 'desc': 'This paper explores diffusion language models (DLMs) as a new approach to language generation, contrasting them with traditional autoregressive models. The authors investigate various text embeddings to determine which provides the best latent space for diffusion, finding that stronger embeddings significantly enhance generative performance. However, they discover that the most powerful embeddings, like T5Gemma-2, are too discriminative, leading to issues in generating plausible alternatives. To resolve this, they propose a student encoder that learns from soft labels of the teacher model, resulting in a more connected latent space that improves generation quality and outperforms existing models like GPT-2-M.'}, 'zh': {'title': '提升生成性能的扩散语言模型', 'desc': '扩散语言模型（DLMs）为自回归语言生成提供了一个有前景的替代方案。研究发现，通过对不同的嵌入进行搜索，增强嵌入模型的能力可以显著提高生成性能。尽管T5Gemma-2的原始嵌入仍然不够理想，但通过将其蒸馏为学生编码器，能够学习教师的解码概率，从而使替代嵌入更加紧密。最终，蒸馏后的嵌入形成了一个更连通和可扩散的潜在空间，提升了生成效果。'}}}, {'id': 'https://huggingface.co/papers/2610.00574', 'title': 'Make Sparse Rewards Count: Density-Aware Reward Aggregation for Multi-Reward RL', 'url': 'https://huggingface.co/papers/2610.00574', 'abstract': "Abstract  Multi-reward reinforcement learning trains large language models to satisfy multiple behavioral objectives simultaneously. Reward-wise normalization, as used in GDPO, preserves reward-specific relative information within rollout groups, but different objectives can still exhibit uneven learning progress. We study this behavior through advantage energy, the sum of a reward's squared advantages over a batch. Under idealized GDPO normalization, we show that this energy is proportional to active-group density: the fraction of rollout groups in which the reward provides nonzero relative advantages. This reveals a residual batch-level signal imbalance and provides a basis for calibrating reward contributions. Based on this relation, we propose Density-Aware Reward Aggregation (DARA). We derive an inverse-square-root density correction that gives greater weight to signals from less frequently active rewards. DARA computes its weights from each rollout batch, adapting to changes in reward activity throughout training without modifying the underlying policy optimization objective. Experiments on tool calling and mathematical reasoning show that DARA learns the targeted behaviors faster than GDPO, reaching high format compliance in up to 26% fewer training steps on tool calling and near-saturated length compliance in up to 65% fewer steps on mathematical reasoning, while remaining competitive in final performance. Our code is available at https://github.com/zhaihaotian/DARA.", 'score': 12, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '44413c735feb9e91', 'authors': ['Tong Zheng', 'Skylar Zhai', 'Zhan Cheng', 'TianMing Sha', 'Youling Huang', 'Shuo Zhou', 'Shaotong Qi', 'Jingcheng Liang', 'Xuwei Ding', 'Pengcheng Xu'], 'affiliations': ['Beijing Foreign Studies University', 'Dalian University of Technology', 'Kuaishou Technology', 'Southeast University', 'Stony Brook University', 'University of Chinese Academy of Sciences', 'University of Minnesota Twin Cities', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.00574.jpg', 'data': {'categories': ['#reasoning', '#training', '#rlhf', '#math', '#alignment', '#open_source', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка множественных целей через адаптивное взвешивание сигналов обратной связи', 'desc': 'Статья посвящена улучшению обучения больших языковых моделей с использованием множественных целевых функций (мульти-ревард обучение с подкреплением). Авторы выявили проблему неравномерного прогресса обучения разных целевых функций и проанализировали это явление через концепцию «advantage energy» — сумму квадратов преимуществ по пакету данных. На основе математического анализа они предложили метод DARA (Density-Aware Reward Aggregation), который адаптивно взвешивает вклады разных целевых функций, уделяя больше внимания редко активирующимся сигналам. Экспериментально показано, что DARA ускоряет сходимость на 26-65% быстрее по сравнению с существующим методом GDPO, сохраняя при этом конкурентоспособность по финальной производительности.'}, 'en': {'title': 'Boosting Learning Efficiency with Density-Aware Reward Aggregation', 'desc': 'This paper introduces a method called Density-Aware Reward Aggregation (DARA) for multi-reward reinforcement learning, which helps large language models learn multiple objectives more effectively. The authors analyze the uneven learning progress of different rewards using a concept called advantage energy, which measures the effectiveness of rewards in training. DARA adjusts the importance of rewards based on their activity levels, giving more weight to less frequently active rewards to balance the learning process. Experiments demonstrate that DARA accelerates the learning of targeted behaviors, achieving better results in fewer training steps compared to existing methods like GDPO.'}, 'zh': {'title': '密度感知奖励聚合：提升多目标学习效率', 'desc': '多奖励强化学习旨在同时满足多个行为目标。我们提出了一种新的方法，称为密度感知奖励聚合（DARA），它通过调整奖励信号的权重来提高学习效率。DARA根据每个回合批次的奖励活动情况动态计算权重，从而更好地利用不常激活的奖励信号。实验结果表明，DARA在工具调用和数学推理任务中比传统方法GDPO更快地学习目标行为，减少了训练步骤。'}}}, {'id': 'https://huggingface.co/papers/2610.02160', 'title': '4Director: Controlling Video World Models with Rigid 3D Geometry', 'url': 'https://huggingface.co/papers/2610.02160', 'abstract': 'Abstract  Precise control over camera and object motion is essential for professional video production. Existing methods control objects only coarsely, through image-plane cues that are ambiguous in depth and rotation or through 3D tracks and blobs that lack complete geometry and lose consistency across viewpoint changes. We introduce 4Director, a video world model conditioned on an explicit 4D scene representation: each object is reconstructed once from the input image as a canonical mesh and moved by one prescribed rigid transformation per frame. This representation provides an intuitive 3D control interface and prevents unobserved geometry from being regenerated independently in every frame. We render the controlled scene as a depth video and introduce a Motion Adapter that transforms this geometric scaffold into video while synthesizing view-consistent appearance, illumination, and non-rigid dynamics. For training, we construct RealCOD-Rigid, a new dataset of 20,774 clips annotated with rigid 3D scenes by our automatic pipeline. We further introduce Identity-Gated IoU (IG-IoU), which jointly evaluates adherence to prescribed object motion and preservation of object identity. Experiments demonstrate that 4Director consistently outperforms prior methods in visual quality and in camera and object control.', 'score': 11, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '164d578e4ca40a0c', 'authors': ['Wei Cao', 'Hao Zhang', 'Vikram Voleti', 'Yuqun Wu', 'Mallikarjun B R', 'Shimon Vainer', 'Mark Boss', 'Yaoyao Liu'], 'affiliations': ['Stability AI', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02160.jpg', 'data': {'categories': ['#video', '#3d', '#benchmark', '#dataset'], 'emoji': '🎬', 'ru': {'title': '4D сцены для прецизионного контроля видеопроизводства', 'desc': 'Авторы представляют 4Director — видео-модель мира, которая использует явное 4D представление сцены для точного контроля движения объектов и камеры. Каждый объект реконструируется один раз как каноническая мешь и трансформируется жёсткой трансформацией на каждом кадре, что обеспечивает интуитивный 3D интерфейс управления. Система использует Motion Adapter для преобразования геометрического каркаса в видео с синтезом согласованного внешнего вида, освещения и нежёстких деформаций. Для обучения создан новый датасет RealCOD-Rigid с 20,774 видеоклипами, аннотированными автоматическим способом, и предложена метрика IG-IoU для оценки точности контроля движения и сохранения идентичности объектов.'}, 'en': {'title': 'Revolutionizing Video Control with 4D Scene Representation', 'desc': 'The paper presents 4Director, a novel video world model that enhances control over camera and object motion in video production. It utilizes a 4D scene representation where each object is reconstructed into a canonical mesh, allowing for precise rigid transformations per frame. This approach addresses limitations of existing methods by providing a consistent geometric framework that avoids independent regeneration of unobserved geometry. The authors also introduce a new dataset and a unique evaluation metric, demonstrating that 4Director significantly improves visual quality and control compared to previous techniques.'}, 'zh': {'title': '4Director：精确控制视频中的相机与物体运动', 'desc': '本文介绍了一种名为4Director的视频世界模型，它基于明确的4D场景表示来实现对相机和物体运动的精确控制。通过将每个物体从输入图像重建为标准网格，并在每帧中施加一个刚性变换，4Director提供了直观的3D控制界面。该模型通过深度视频渲染受控场景，并引入运动适配器，将几何框架转化为视频，同时合成一致的外观、照明和非刚性动态。实验结果表明，4Director在视觉质量以及相机和物体控制方面均优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2610.00964', 'title': 'RPTune: Learned Context Curation for LLM Catalog Search', 'url': 'https://huggingface.co/papers/2610.00964', 'abstract': 'Abstract  For small merchant businesses (SMBs) whose catalogs fit within a long-context LLM, full-catalog prompting offers a compelling alternative to multi-stage retrieval designed primarily for large marketplaces with millions of items. However, fitting the full catalog into the context window does not ensure that the model can use it effectively, since LLMs do not exploit long contexts uniformly. We therefore study in-context catalog search through two complementary questions: (1) how to curate and present catalogs to the LLM, and (2) how to adapt the LLM for product selection on curated contexts.   We propose RPTune, an end-to-end framework that couples learned catalog curation with LLM post-training using automatically generated, catalog-grounded supervision. An encoder-reorganizer curator orders and prunes products guided by downstream LLM feedback, while the resulting curated catalogs in turn improve the effectiveness of LLM post-training with a context-relative reward. We evaluate RPTune on 7 real merchants spanning distinct retail verticals, using 100 complex conversational queries per merchant. RPTune consistently improves search accuracy across both proprietary and open-weight LLMs, with context curation yielding gains of up to 31.4 percentage points and post-training adding a further 10.3 points on average.', 'score': 9, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '9a2414c9ae500b44', 'authors': ['Chuxuan Hu', 'Hejie Cui', 'Norman Huang', 'Shubham Kumar Bharti', 'Wang-Chiew Tan', 'Sercan Ö. Arık'], 'affiliations': ['Google', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.00964.jpg', 'data': {'categories': ['#long_context', '#optimization'], 'emoji': '🛍️', 'ru': {'title': 'Умная организация каталогов для поиска товаров в LLM', 'desc': 'В статье предлагается RPTune — фреймворк для улучшения поиска товаров в каталогах малых бизнесов, когда весь каталог помещается в контекстное окно LLM. Авторы решают две взаимосвязанные задачи: оптимальное представление каталога моделе и адаптация LLM для эффективной работы с подготовленными данными. Система включает куратора-реорганизатора, который переупорядочивает и сокращает товары на основе обратной связи от LLM, а также дообучение модели с использованием автоматически сгенерированного надзора. Экспериментальные результаты на 7 реальных магазинах показывают значительное улучшение точности поиска, достигая прироста до 31.4 процентных пункта при кураторстве каталога и дополнительные 10.3 пункта после дообучения.'}, 'en': {'title': 'Enhancing SMB Product Search with RPTune: Smart Catalog Curation and LLM Adaptation', 'desc': "This paper introduces RPTune, a framework designed to enhance product search for small merchant businesses using long-context large language models (LLMs). It addresses the challenge of effectively utilizing full catalogs within the LLM's context window by focusing on how to curate and present these catalogs. The framework combines catalog curation with post-training of the LLM, utilizing feedback to optimize product selection. Evaluation shows that RPTune significantly improves search accuracy, demonstrating the benefits of context-aware catalog management and LLM adaptation."}, 'zh': {'title': '优化小型商家的产品搜索', 'desc': '这篇论文探讨了如何为小型商家（SMB）优化长上下文的语言模型（LLM）以进行产品搜索。研究提出了一种名为RPTune的框架，通过学习的目录策划和LLM后训练来提高搜索准确性。该框架使用编码器-重组器来整理和修剪产品，并根据LLM的反馈进行调整。实验结果表明，RPTune在多个零售领域的真实商家中显著提高了搜索准确率，最大提升可达31.4个百分点。'}}}, {'id': 'https://huggingface.co/papers/2609.40362', 'title': 'Multimodal Flow: Unified Flow Modeling of Language and Vision in Embedding Spaces', 'url': 'https://huggingface.co/papers/2609.40362', 'abstract': 'Abstract  We present Multimodal Flow, a fully continuous generative model of language and vision. Most unified multimodal models either model both language and quantized images as discrete tokens or combine discrete language prediction with continuous image generation. The former introduces a visual quantization bottleneck. The latter requires modality-dependent objectives and sampling procedures. Fully continuous modeling avoids these trade-offs and enables a shared generative process, but remains underexplored for multimodal pretraining. Multimodal Flow introduces a unified continuous architecture that integrates multimodal continuous representations with a shared chunk-causal flow backbone. It organizes text blocks and images as ordered continuous hyperchunks, preserving textual token order and visual spatial structure. The backbone learns a single vector field over these hyperchunks through Flow Matching. Joint attention enables cross-modal interaction, while modality-specific feed-forward networks process each modality. The model predicts multiple target chunks in parallel during training and generates hyperchunks sequentially at inference. We instantiate MF-1 and pretrain it on multimodal data. Across 0.6B, 1.2B, and 1.6B scales, continued pretraining consistently improves multimodal modeling. With only 150B pretraining tokens, MF-1 achieves an average score of 82.8 across GenEval and DPG-Bench and 75.3 across VQAv2, MMBench, and POPE, remaining competitive with unified models trained on substantially more data. Under matched data, optimization, and parameter budgets, Multimodal Flow further outperforms representative hybrid and discrete models. These results establish continuous chunk-based embedding flow modeling as a new fully continuous paradigm for unified multimodal modeling. The related code and model are publicly released at https://github.com/hustvl/Multimodal-Flow.', 'score': 6, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '584e0dce504656c3', 'authors': ['Hongyuan Tao', 'Xinggang Wang', 'Lianghui Zhu', 'Yongkang Li', 'Yunchao Wei', 'Bin Feng', 'Shaoyu Chen', 'Qian Zhang', 'Chang Huang', 'Kai Yu'], 'affiliations': ['Beijing Jiaotong University', 'Horizon Robotics', 'Huazhong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.40362.jpg', 'data': {'categories': ['#multimodal', '#training', '#diffusion', '#architecture', '#open_source'], 'emoji': '🌊', 'ru': {'title': 'Непрерывный поток: единая модель для текста и зрения без квантизации', 'desc': 'В статье представлена Multimodal Flow — полностью непрерывная генеративная модель для совместной обработки текста и изображений. Модель преодолевает ограничения существующих подходов, избегая квантизации визуальной информации и использования отдельных целевых функций для разных модальностей благодаря единому архитектурному решению. Основой служит Flow Matching — метод обучения векторного поля над структурированными блоками текста и изображений (hyperchunks), которые организованы с сохранением порядка токенов и пространственной структуры. Модель демонстрирует конкурентные результаты на бенчмарках VQAv2, MMBench и других при меньшем объёме предварительного обучения по сравнению с аналогичными системами.'}, 'en': {'title': 'Revolutionizing Multimodal Modeling with Continuous Flow', 'desc': 'The paper introduces Multimodal Flow, a novel generative model that seamlessly integrates language and vision in a continuous manner. Unlike traditional models that rely on discrete tokens or separate objectives for each modality, this approach utilizes a unified architecture that maintains the order of text and the spatial structure of images. By employing a shared chunk-causal flow backbone, the model learns to represent multimodal data as continuous hyperchunks, allowing for efficient cross-modal interactions. The results demonstrate that Multimodal Flow achieves competitive performance with fewer pretraining tokens compared to existing models, highlighting its potential as a new paradigm in multimodal modeling.'}, 'zh': {'title': '全连续多模态建模的新范式', 'desc': '本文提出了一种名为Multimodal Flow的全连续生成模型，旨在同时处理语言和视觉信息。与传统的多模态模型不同，该模型避免了视觉量化瓶颈，并通过共享的生成过程实现了语言和图像的连续建模。Multimodal Flow使用了一种统一的连续架构，将文本块和图像组织为有序的连续超块，并通过流匹配学习单一的向量场。实验结果表明，该模型在多模态建模上表现优异，超越了许多混合和离散模型。'}}}, {'id': 'https://huggingface.co/papers/2609.40097', 'title': 'AutoDataBench: A Data-centric Testbed for Accelerating Auto Research', 'url': 'https://huggingface.co/papers/2609.40097', 'abstract': "Abstract  Existing auto-research benchmarks often entangle multiple sources of improvement, including training frameworks, hyperparameters, compute budgets, and data, making it difficult to attribute why one frontier agent outperforms another to specific research capabilities. In this work, we isolate and systematically evaluate Data Int
