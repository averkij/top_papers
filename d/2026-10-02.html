tle': 'От двумерных изображений к трёхмерным текстурам без 3D-данных', 'desc': 'В этой работе предлагается метод Tex-Zero для генерации трёхмерных текстур без использования реальных 3D-данных. Авторы показывают, что для обучения моделей синтеза текстур в 3D-пространстве достаточно высокачественной информации о цвете, а геометрия может быть сконструирована искусственно. Они трансформируют двумерные изображения в трёхмерные обучающие примеры, представляя каждое изображение как плоскость в пространстве с применением случайных ротаций и агрегации. Модель Tex-Zero VAE, обученная только на таких синтетических данных, способна восстанавливать реальные 3D-активы с высокой точностью, что открывает новую парадигму масштабирования генерации трёхмерных текстур.'}, 'en': {'title': 'Tex-Zero: 3D Texture Generation Without 3D Assets!', 'desc': 'The paper introduces Tex-Zero, a novel framework for generating high-quality 3D textures without the need for real 3D asset data. It highlights that while high-quality color information is crucial for training, geometric details can be manually created, allowing the use of abundant 2D images as training samples. By representing 2D images as planes in 3D space and applying transformations, the model can effectively learn to reconstruct 3D textures. The Tex-Zero VAE and Tex-Zero DiT models demonstrate that high-fidelity 3D textures can be generated solely from 2D images, paving the way for new approaches in 3D texture generation.'}, 'zh': {'title': '无3D资产的高保真纹理生成', 'desc': '本论文提出了一种名为Tex-Zero的框架，用于在没有真实3D资产的情况下生成高保真3D纹理。研究表明，3D纹理训练只需要高质量的颜色信息，而几何信息可以通过手动构建来获得。通过将高质量的2D图像转换为3D训练样本，Tex-Zero能够有效地生成复杂的几何结构。实验结果表明，Tex-Zero能够仅使用图像作为训练数据，生成具有细致纹理的高质量3D模型。'}}}, {'id': 'https://huggingface.co/papers/2610.01017', 'title': 'Pay for the Fault, Not the Flow: Label-Free In-Flow Multi-Agent Workflow Optimization', 'url': 'https://huggingface.co/papers/2610.01017', 'abstract': "Abstract  Large language models (LLMs) increasingly construct multi-agent workflows that decompose a complex task and assign specialist agents from a pool. However, building such a workflow well remains challenging: how finely to divide the task, which agent to trust with each subtask, and when to create a new specialist are all critical decisions a workflow constructor needs to settle up front. Thus, whether each subtask succeeds remains unknown until the workflow runs. Yet, improving a workflow is costly. Locating a fault usually requires a reference answer, a graded outcome, or a trained assessor, and the fix is applied to the whole workflow through re-execution, re-search, or retraining. We propose InFlowOp, which prices every decision in one label-free cost that weighs how well an agent's competence meets what a subtask demands against how much that agent takes to run. Before execution, InFlowOp bidirectionally determines the granularity of task decomposition and agent assignment following from the cost rather than from a fixed template. During execution, InFlowOp corrects a fault with the cheapest move via the same cost that serves the workflow both as it is built and as it runs. Facing the workflow-level evaluation challenge, we introduce Braid, a benchmark whose tasks require multi-agent coordination beyond single-agent capability. Across various domains and backbones, InFlowOp outperforms single agent baselines by up to +11.97%, achieving +9.64% with in-flow optimization. Our project page: https://xhguo7.github.io/InFlowOp/.", 'score': 0, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'b362d708da341223', 'authors': ['Xuehang Guo', 'Haoyu Wang', 'Shengyu Chen', 'Zach Chen', 'Wei Cheng', 'Qingyun Wang', 'Haifeng Chen'], 'affiliations': ['NEC Corporation of America', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2610.01017.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '⚙️', 'ru': {'title': 'Самооптимизирующиеся многоагентные рабочие процессы без разметки данных', 'desc': 'В статье предлагается метод InFlowOp для автоматической оптимизации многоагентных рабочих процессов, построенных на основе больших языковых моделей. Ключевая инновация заключается в введении единой метрики стоимости без использования размеченных данных, которая оценивает компетентность агента относительно требований подзадачи и вычислительных затрат. Метод работает как на этапе проектирования рабочего процесса (определяя гранулярность декомпозиции задачи и распределение агентов), так и во время выполнения (исправляя ошибки наиболее экономичным способом). Авторы представляют бенчмарк Braid для оценки многоагентной координации, на котором InFlowOp показывает улучшение до 11.97% по сравнению с одноагентными подходами.'}, 'en': {'title': 'Optimizing Multi-Agent Workflows with InFlowOp', 'desc': 'This paper introduces InFlowOp, a method for optimizing multi-agent workflows in large language models (LLMs). It addresses the challenges of task decomposition and agent assignment by evaluating the cost-effectiveness of each decision before execution. InFlowOp dynamically adjusts the granularity of tasks and agent roles based on their competence and operational costs. The authors also present Braid, a benchmark for testing multi-agent coordination, demonstrating that InFlowOp significantly improves performance over traditional single-agent approaches.'}, 'zh': {'title': '优化多代理工作流的智能决策', 'desc': '本文提出了一种名为InFlowOp的方法，用于优化多代理工作流的构建和执行。该方法通过一种无标签的成本评估机制，帮助决策任务的细分和代理的分配，从而提高工作流的效率。InFlowOp在执行过程中能够根据成本动态修正错误，确保工作流的顺利进行。实验结果表明，InFlowOp在多个领域的表现优于单一代理基线，显示出其在多代理协调任务中的优势。'}}}, {'id': 'https://huggingface.co/papers/2610.00737', 'title': 'Personalized Image Generation with Reasoning and Reflection', 'url': 'https://huggingface.co/papers/2610.00737', 'abstract': "Abstract  Personalized image generation has remained narrowly focused on conditional synthesis from curated visual exemplars, rather than capturing who a user is. In practice, however, a user's personal context is much richer, comprising reviews, posts, images, captions, and metadata accumulated over time. A truly personalized generator should leverage this history to produce images aligned with the user's lifestyle and aesthetic preferences. To this end, we introduce the first unified benchmark for personalized image generation from user histories. The benchmark comprises two complementary tasks and a multi-axis evaluation protocol that assesses target fidelity, visual quality, user distinguishability, semantic alignment with the user's history, and task-specific utility. Grounded in real-world e-commerce and social media settings, the benchmark includes: (1) Personalized Scene Generation, which places a given object in a scene that reflects a user's preferences and lifestyle, motivated by personalized product presentation; and (2) Personalized Creative Generation, which generates a novel image on a specified topic that is faithful to a user's aesthetic and visual identity, motivated by social media content creation. We further propose PEARL, which couples a multimodal reasoner with a frozen image generator in an interleaved reason-reflect loop optimized with differential data reward. Across both tasks, PEARL outperforms strong baselines, achieving an average improvement of 15% across personalization metrics.", 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5e39afc79d3a43cd', 'authors': ['Bo Ni', 'Ngoc N. Tran', 'Qinwen Ge', 'Franck Dernoncourt', 'Seunghyun Yoon', 'Samyadeep Basu', 'Sungchul Kim', 'Puneet Mathur', 'Nedim Lipka', 'Tong Yu', 'Yu Wang', 'Ryan A. Rossi', 'Tyler Derr'], 'affiliations': ['Adobe Systems', 'University of Georgia', 'University of Maryland, College Park', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00737.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#optimization', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Персонализованная генерация изображений через историю пользователя', 'desc': 'В статье представлена первая унифицированная бенчмарк для персонализированной генерации изображений на основе истории пользователя, которая включает его отзывы, посты, фотографии и метаданные. Авторы определяют две дополнительные задачи: персонализированную генерацию сцен для товаров и творческую генерацию изображений, соответствующие предпочтениям пользователя. Предложенный метод PEARL использует мультимодальный рассуждающий модуль с замороженным генератором изображений в интерактивном цикле, оптимизированном через дифференцируемую награду за данные. Модель PEARL превосходит базовые подходы, достигая в среднем 15% улучшения по метрикам персонализации.'}, 'en': {'title': 'Revolutionizing Personalized Image Generation with User Histories', 'desc': "This paper addresses the challenge of personalized image generation by utilizing a user's comprehensive history, including reviews, posts, and images, rather than just curated examples. It introduces a new benchmark that evaluates personalized image generation through two tasks: creating scenes that reflect user preferences and generating novel images aligned with a user's aesthetic. The proposed method, PEARL, combines a multimodal reasoner with an image generator to enhance personalization through a feedback loop. The results show that PEARL significantly improves personalization metrics, outperforming existing methods by an average of 15%."}, 'zh': {'title': '个性化图像生成的新标准', 'desc': '这篇论文探讨了个性化图像生成的研究，强调了用户的个人背景信息在生成过程中的重要性。作者提出了一个统一的基准，旨在通过用户的历史数据来生成符合其生活方式和审美偏好的图像。基准包括两个互补的任务：个性化场景生成和个性化创意生成，并采用多维度评估协议来衡量生成图像的质量和与用户历史的语义一致性。论文中还提出了PEARL模型，通过多模态推理器与图像生成器的结合，显著提高了个性化生成的效果。'}}}, {'id': 'https://huggingface.co/papers/2609.38593', 'title': 'Prompt2Skill: Unsupervised Skill Optimization From Natural Language Instructions', 'url': 'https://huggingface.co/papers/2609.38593', 'abstract': 'Abstract  Skills are external artifacts that Large Language Models (LLMs) consume at inference time to improve their performance on specialized domains by incorporating relevant procedural and domain knowledge. Expert-authored skills are expensive to produce, and the resulting artifacts are not optimized for the specific model that consumes them, whose failure modes can vary with version, scale and training. In addition, emerging tasks may fall outside the scope of existing skill libraries, creating a need to develop new skills before curated training data become available. Recent works have explored automated skill optimization through reflection, but they require a curated, in-distribution training set, which users might not always have. To address these limitations, we present Prompt2Skill, a framework that builds skills from natural-language task description alone. From the prompt, the system derives a task specification, discovers or synthesizes datasets, and refines the skill in a closed loop of reflective editing. Across four domains spanning question answering, reading comprehension, spreadsheet manipulation, and mathematical reasoning, Prompt2Skill consistently outperforms the direct prompting baseline, achieving an average improvement of 10.8 across open-source and frontier models.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'ea26f264d3c40e72', 'authors': ['Bo Ni', 'Li Li', 'Ryan A. Rossi', 'Franck Dernoncourt', 'Tyler Derr'], 'affiliations': ['Adobe Systems', 'University of Southern California', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38593.jpg', 'data': {'categories': [], 'emoji': '🛠️', 'ru': {'title': 'Автоматическое создание навыков LLM из описания задачи', 'desc': 'В статье представляется фреймворк Prompt2Skill, который автоматически создаёт специализированные навыки для больших языковых моделей прямо из текстового описания задачи, без необходимости в предварительно размеченных данных. Система извлекает спецификацию задачи из промпта, генерирует или находит подходящие датасеты и итеративно улучшает навык через рефлексивное редактирование. Подход решает проблему дорогостоящего ручного создания навыков и их неоптимизированности под конкретные модели с их уникальными модами отказа. Экспериментальные результаты показывают, что Prompt2Skill в среднем улучшает производительность на 10,8 пункта по сравнению с прямым промптингом на различных доменах: ответы на вопросы, понимание текста, работа с таблицами и математические рассуждения.'}, 'en': {'title': 'Empowering LLMs with Skills from Simple Descriptions', 'desc': 'This paper introduces Prompt2Skill, a framework designed to create skills for Large Language Models (LLMs) using only natural-language task descriptions. It addresses the challenges of expensive expert-authored skills and the need for model-specific optimizations by deriving task specifications and synthesizing datasets automatically. The framework employs a closed-loop reflective editing process to refine the skills, making it adaptable to emerging tasks without requiring curated training data. The results show that Prompt2Skill significantly enhances performance across various domains, outperforming traditional prompting methods by an average of 10.8.'}, 'zh': {'title': '通过自然语言生成技能的创新框架', 'desc': '本论文介绍了一种名为Prompt2Skill的框架，旨在通过自然语言任务描述自动生成技能，以提高大型语言模型（LLMs）在特定领域的表现。该系统从提示中提取任务规范，发现或合成数据集，并通过反思编辑的闭环过程来优化技能。与传统的技能优化方法相比，Prompt2Skill不需要预先准备的训练集，解决了现有技能库的局限性。实验结果表明，在问答、阅读理解、电子表格操作和数学推理等四个领域，Prompt2Skill的表现优于直接提示基线，平均提升达10.8。'}}}, {'id': 'https://huggingface.co/papers/2609.37362', 'title': 'Pretrain Once, Route Anywhere: Towards a Foundation Model for LLM Routing', 'url': 'https://huggingface.co/papers/2609.37362', 'abstract': 'Abstract  Large language model (LLM) routing aims to assign each query to the most suitable model from a heterogeneous candidate pool, improving the quality--efficiency trade-off of LLM inference. Existing routers are typically learned through local fitting: a router is optimized for a particular query workload and candidate pool, and often requires additional supervision or retraining as the routing environment changes. We ask whether LLM routing can instead be approached from a foundation-model perspective, learning a reusable routing capability that generalizes across tasks, candidate models, and deployment conditions. To this end, we introduce RouteFM, which learns to characterize anonymous candidate models from behavioral context and infer their target-specific capabilities, rather than binding routing decisions to fixed model identities or a single environment. Through episodic pretraining across heterogeneous routing environments, this capability can be reused by a frozen router and adapted to new environments through context alone. Experiments demonstrate transfer across changes in domains, modalities, candidate pools, and context budgets, with the largest gains when behavioral evidence is limited. On MMR-Bench, which is excluded from pretraining, RouteFM outperforms the strongest baseline by 2.23 quality points with only eight observations per candidate. These results support moving LLM routing from repeated local fitting toward a pretrain once, route anywhere paradigm. Our code is publicly available at https://github.com/LAMDA-Model-Reuse/RouteFM.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'e453d57b810c9428', 'authors': ['Guannan Lai', 'Han-Jia Ye'], 'affiliations': ['National Key Laboratory for Novel Software Technology, Nanjing University', 'School of Artificial Intelligence, Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2609.37362.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#inference', '#training'], 'emoji': '🚦', 'ru': {'title': 'Универсальная маршрутизация LLM через pretrain once, route anywhere', 'desc': 'В работе представлена RouteFM — система маршрутизации запросов между большими языковыми моделями, которая обучается как foundation model для переноса знаний между различными задачами и окружениями. Вместо привязки к конкретным моделям и рабочим нагрузкам, система учится понимать возможности неизвестных кандидатов через их поведение в контексте, позволяя переиспользовать обученную модель без переобучения. Эпизодическое предобучение на разнообразных сценариях маршрутизации обеспечивает хорошую обобщаемость: система демонстрирует успешный трансфер при изменении доменов, модальностей и пула моделей. Экспериментальные результаты показывают улучшение на 2.23 пункта качества на тестовом наборе MMR-Bench при использовании минимального количества наблюдений.'}, 'en': {'title': 'RouteFM: Generalizing LLM Routing for Enhanced Efficiency', 'desc': 'This paper introduces RouteFM, a novel approach to large language model (LLM) routing that enhances the efficiency of model selection for various queries. Instead of optimizing routers for specific tasks or environments, RouteFM learns a generalizable routing capability that can adapt to different models and conditions. By using episodic pretraining, it characterizes candidate models based on their behavior, allowing for effective routing without needing constant retraining. The results show significant improvements in routing performance across diverse scenarios, demonstrating the potential of a reusable routing strategy in LLM applications.'}, 'zh': {'title': '从局部拟合到一次预训练，随处路由的转变', 'desc': '大型语言模型（LLM）路由旨在将每个查询分配给最合适的模型，以提高LLM推理的质量和效率。现有的路由器通常通过局部拟合进行学习，针对特定的查询工作负载和候选池进行优化，且在路由环境变化时常需额外监督或重新训练。我们提出RouteFM，从基础模型的角度出发，学习可重用的路由能力，能够跨任务、候选模型和部署条件进行泛化。通过在异构路由环境中的情节预训练，RouteFM能够在新环境中仅通过上下文进行适应，实验结果显示其在多个领域和条件下的转移能力显著。'}}}, {'id': 'https://huggingface.co/papers/2610.00360', 'title': 'DexPolicy: Scheduled Exploration for Trajectory-Guided Dexterous Manipulation', 'url': 'https://huggingface.co/papers/2610.00360', 'abstract': 'Abstract  Reinforcement learning (RL) for dexterous manipulation must discover finger-object contacts and then control the object precisely; the action noise that serves the first goal can interfere with the second. In trajectory-guided settings such as ViViDex, where RL refine hand-object trajectories from human video, our baseline PPO runs end near their initial action noise after 5M steps, motivating explicit control of exploration scale. DexPolicy makes that scale an explicit function of training steps, annealing from broad to narrow exploration while holding loss, architecture, reward, and optimizer settings fixed. We study three policy-optimization settings: PPO, critic-free GRPO continuation, and a flow-parameterized PPO variant (FPO). Across five YCB objects and three training seeds, mean deterministic Target success rises from 49.4% to 68.1% (FPO), 14.1% to 45.4% (GRPO), and 32.0% to 35.7% (PPO). On a RealMan RM75 arm with an Inspire/RH56 hand, 360 trials over three objects raise mean Target success from 25.0% to 85.0% (FPO), 10.0% to 63.3% (GRPO), and 8.3% to 43.3% (PPO), with one trained model per object-method condition. PPO component screening favors noise control over the tested optimizer contraction; the selected PPO schedule yields higher mean Target success than linear decay with the same endpoints on three tested objects. Training return, deterministic Target success, and tolerance to execution noise dissociate; schedules should therefore be judged by terminal task success under the intended execution conditions, per task and policy-optimization setting. Code: https://github.com/AIGeeksGroup/DexPolicy. Website: https://aigeeksgroup.github.io/DexPolicy.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '9248936e38e941ec', 'authors': ['Haoyu Wang', 'Siyuan Qian', 'Yanjun Li', 'Zeyu Zhang', 'Yandong Guo', 'Boxin Shi', 'Hao Tang'], 'affiliations': ['AI2 Robotics', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00360.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Управление исследованием через контроль шума в ловком манипулировании', 'desc': 'В статье предлагается DexPolicy — метод для улучшения обучения с подкреплением в задачах ловкого манипулирования объектами. Авторы решают проблему конфликта между исследованием пространства действий (exploration) и точным управлением объектом, делая масштаб шума явной функцией шагов обучения. Они тестируют три алгоритма оптимизации политики (PPO, GRPO и FPO) и показывают значительное улучшение успешности выполнения задач как в симуляции, так и на реальном робототехническом манипуляторе. Ключевой вывод заключается в том, что расписание контроля шума более важно для финального успеха задачи, чем другие гиперпараметры.'}, 'en': {'title': 'DexPolicy: Optimizing Exploration for Better Dexterous Manipulation', 'desc': 'This paper discusses a method called DexPolicy for improving reinforcement learning in dexterous manipulation tasks. It addresses the challenge of balancing exploration and exploitation by adjusting the scale of exploration as training progresses. The authors compare different policy optimization techniques, including PPO and GRPO, and demonstrate that their approach significantly increases the success rate of manipulating objects. The results show that careful control of exploration noise leads to better performance in achieving task goals.'}, 'zh': {'title': '优化探索规模，提高灵巧操作成功率', 'desc': '本论文探讨了强化学习在灵巧操作中的应用，特别是如何在控制物体时处理手指与物体的接触。研究提出了一种名为DexPolicy的方法，通过调整探索规模来提高学习效果，从而在训练过程中实现更精确的控制。实验结果显示，使用不同的策略优化方法（如PPO和GRPO）可以显著提高目标成功率。最终，研究强调了在特定执行条件下评估训练效果的重要性。'}}}, {'id': 'https://huggingface.co/papers/2609.34677', 'title': 'Learning What to Recall: Adaptive Multi-Cue Episodic Memory for World Models', 'url': 'https://huggingface.co/papers/2609.34677', 'abstract': 'Abstract  World models predict future observations from current experience and actions, yet prediction can depend on observations seen far in the past. Episodic memory preserves past observations for later recall; however, as memory accumulates, it raises a fundamental question: which memories are useful for the current prediction, and which available retrieval cues should be trusted to find them? This is challenging because fixed criteria based on recency, pose overlap, or visual similarity can be unreliable across environments and queries. We propose Future-Aware Recall (FAR), a framework that learns episodic recall from future-aware predictive supervision and adaptive multi-cue scoring. During training, FAR measures predictive utility by the conditional log-likelihood of the realized future given recalled context, approximated by negative diffusion prediction loss, and uses it to train a retriever that remains future-blind at inference. The retriever learns cue-specific relevance and automatically determines which available retrieval cues, such as time, pose, vision, and audio, to trust for each query when selecting memories. Across three complementary settings, FAR outperforms hand-designed recall even with the same retrieval cues, automatically adapts which available cues to trust, and recalls the right history as the world changes. Together, these results establish FAR as a flexible, principled approach to episodic memory access in world models.', 'score': 0, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '2f617c80684724d4', 'authors': ['Beomsu Kim', 'Chieh-Hsin Lai', 'Bac Nguyen', 'Amir Bar', 'Jong Chul Ye', 'Yuki Mitsufuji'], 'affiliations': ['Imperial College London', 'KAIST', 'Sony Group Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2609.34677.jpg', 'data': {'categories': ['#diffusion', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Будущее как учитель: обучение памяти предсказаниями завтра', 'desc': 'В работе предложен метод Future-Aware Recall (FAR) для обучения эпизодической памяти в мировых моделях, которые предсказывают будущие наблюдения. Система учится определять, какие прошлые наблюдения полезны для текущего предсказания, используя суперконтрастное обучение на основе условного логарифма правдоподобия реализованного будущего. FAR использует адаптивное мульти-сигнальное оценивание (время, поза, визуальная информация, аудио) и автоматически определяет, каким сигналам доверять при поиске релевантных воспоминаний для каждого запроса. Экспериментальные результаты показывают, что FAR превосходит ручной подход к выбору памяти и адаптируется к изменениям окружающей среды.'}, 'en': {'title': 'Enhancing Memory Recall with Future Awareness', 'desc': "This paper introduces Future-Aware Recall (FAR), a new framework for improving episodic memory in world models. FAR focuses on predicting future observations by effectively recalling relevant past experiences, using a method that adapts to different cues like time and visual context. It learns which memories are most useful for current predictions by evaluating their predictive utility during training, while remaining flexible during inference. The results show that FAR outperforms traditional methods by automatically selecting the most relevant cues for memory retrieval, enhancing the model's ability to adapt to changing environments."}, 'zh': {'title': '未来感知回忆：灵活的情节记忆访问方法', 'desc': '本论文提出了一种名为未来感知回忆（FAR）的框架，用于从未来感知的预测监督中学习情节回忆。FAR通过评估回忆上下文的条件对数似然性来衡量预测效用，并利用负扩散预测损失进行训练。该框架能够自动确定在选择记忆时应信任的检索线索，如时间、姿态、视觉和音频。实验结果表明，FAR在多个设置中优于手动设计的回忆方法，能够灵活适应环境变化。'}}}, {'id': 'https://huggingface.co/papers/2610.01026', 'title': 'It Takes Workflows to Evolve Better Workflows', 'url': 'https://huggingface.co/papers/2610.01026', 'abstract': "Abstract  Tackling complex real-world tasks can exceed the capabilities of a single large language model (LLM), motivating the use of multi-agent workflows that coordinate specialized agents to work together on these tasks. Recent methods train LLMs to construct better workflows from execution outcomes, but they optimize only the workflow generator, while the other agents that build or execute each workflow remain fixed even though every outcome depends on all of them. However, extending training beyond the generator is challenging: the agents are coupled, and a workflow's outcome is a single sparse score that cannot tell which agent causes a failure. We propose FloWright, which leverages the workflow as a harness to optimize workflows. By introducing a hierarchical, structure-aware reward paradigm, FloWright enables one role to self-evolve and two or more roles to co-evolve, with no additional models, labels, or executions. Considering the limitation that workflows are commonly trained and evaluated on data that a single agent can already handle, we further propose DataWright, an adaptive data hardening approach that converts existing datasets into workflow-level tasks with increased difficulty. Across document, slide, chart, code, math, and finance tasks, small open models trained with FloWright achieve improved performance by up to +7.41%, with co-evolving (+5.03%) more roles gaining more than optimizing one of them alone (+2.83%). Our project page: https://xhguo7.github.io/FloWright/.", 'score': 0, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '4641271fc1838904', 'authors': ['Xuehang Guo', 'Haoyu Wang', 'Haifeng Chen', 'Yangyi Chen', 'Zhenhailong Wang', 'Qingyun Wang'], 'affiliations': ['NEC Corporation of America', 'University of Illinois Urbana-Champaign', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2610.01026.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Совместная эволюция агентов в многоагентных рабочих процессах', 'desc': 'В работе предлагается FloWright — метод для оптимизации многоагентных систем на основе LLM, где несколько специализированных агентов сотрудничают при решении сложных задач. Авторы вводят иерархическую, структурно-ориентированную систему вознаграждений, которая позволяет одному агенту самоэволюционировать, а двум и более агентам совместно развиваться без дополнительных моделей и размеченных данных. Дополнительно предлагается DataWright — метод адаптивного усложнения данных, который преобразует существующие датасеты в задачи уровня рабочих процессов с повышенной сложностью. Экспериментально показано, что малые модели, обученные с FloWright, достигают улучшения производительности до 7.41%, причём совместная эволюция нескольких агентов (+5.03%) даёт лучший результат, чем оптимизация одного агента (+2.83%).'}, 'en': {'title': 'Empowering Multi-Agent Workflows for Enhanced Task Performance', 'desc': 'This paper introduces FloWright, a method for optimizing multi-agent workflows in complex tasks using large language models (LLMs). Unlike previous approaches that only optimize the workflow generator, FloWright allows all agents involved in the workflow to evolve together, improving overall performance. The authors also present DataWright, a technique that enhances existing datasets to create more challenging workflow-level tasks. The results show that small open models trained with FloWright can achieve significant performance improvements across various tasks by enabling agents to co-evolve.'}, 'zh': {'title': '优化多代理工作流，提升任务性能！', 'desc': '本论文提出了一种名为FloWright的方法，旨在优化多代理工作流，以解决复杂的现实任务。通过引入层次化的奖励机制，FloWright使得不同角色能够自我进化和共同进化，从而提高工作流的整体性能。我们还提出了DataWright，一种自适应数据增强方法，将现有数据集转化为更具挑战性的工作流任务。实验结果表明，使用FloWright训练的小型开放模型在多个任务上性能提升显著，尤其是共同进化的角色表现更佳。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (4)', '#agents (13)', '#agi', '#alignment (4)', '#architecture (5)', '#audio (4)', '#benchmark (19)', '#cv (2)', '#data (2)', '#dataset (9)', '#diffusion (5)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference (3)', '#interpretability (1)', '#leakage', '#long_context (4)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (10)', '#open_source (2)', '#optimization (11)', '#plp (2)', '#rag (1)', '#reasoning (8)', '#rl (5)', '#rlhf (3)', '#robotics (4)', '#science (3)', '#security (1)', '#small_models', '#story_generation', '#survey (1)', '#synthetic (2)', '#training (18)', '#transfer_learning (1)', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-02 06:30',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-02 06:30')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-02 06:30')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
