 'Nastasia Prutianova', 'Bobak Shahriari', 'Jean Tarbouriech', 'Pavel Tyletski', 'Çağlar Ünlü', 'Cindy Wu', 'Glenn Cameron', 'Jerome Connor', 'Sertan Girgin', 'Maarten Grootendorst', 'Alon Levkovitch', 'Eliya Nachmani', 'Omar Sanseviero', 'Piotr Stanczyk', 'Quentin Berthet', 'Andrew Campbell', 'Clément Crepy', 'Valentin De Bortoli', 'Arnaud Doucet', 'Romuald Elie', 'Alexandre Galashov', 'Klaus Greff', 'Alexis Jacq', 'David Ruhe', 'Yu-Han Wu', 'Sebastian Flennerhag', "Brendan O'Donoghue", 'George Scrivener', 'Shantanu Thakoor'], 'affiliations': ['Google DeepMind'], 'pdf_title_img': 'assets/pdf/title_img/2608.00146.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#multimodal', '#long_context', '#architecture', '#inference', '#training', '#open_source', '#rl'], 'emoji': '⚡', 'ru': {'title': 'Параллельная генерация текста через дискретную диффузию вместо последовательного декодирования', 'desc': 'В работе представлен DiffusionGemma — открытая языковая модель, основанная на дискретной диффузии для параллельной генерации текста с исключительной скоростью. Вместо последовательного декодирования по одному токену модель итеративно уточняет блоки из 256 токенов одновременно, избегая узких мест автоRegressive моделей. DiffusionGemma получена путем fine-tuning модели Gemma 4 с архитектурой mixture-of-experts, используя менее 10% вычислительных ресурсов оригинальной модели. Двухэтапное обучение включает supervised fine-tuning для бидирекционального denoising и усиленное обучение с дистилляцией сэмплера для оптимизации качества генерации и эффективности инференса.'}, 'en': {'title': 'Revolutionizing Text Generation with Speed and Efficiency', 'desc': 'DiffusionGemma is a new language model that generates text quickly by using discrete diffusion techniques. Instead of producing one word at a time like traditional models, it processes blocks of 256 words simultaneously, which speeds up the generation process. The model is built on the existing Gemma 4 framework and is fine-tuned to enhance its performance while using significantly less training data. It achieves impressive output rates, generating around 1,500 tokens per second, while still supporting complex tasks and maintaining the ability to generate text in a traditional autoregressive manner.'}, 'zh': {'title': 'DiffusionGemma：高速文本生成的新突破', 'desc': 'DiffusionGemma是一种实验性的开放权重语言模型，采用离散扩散技术以极高的速度生成文本。与传统的自回归模型逐个解码不同，DiffusionGemma能够并行处理256个令牌的块，从而避免了顺序解码的瓶颈。该模型通过对Gemma 4模型进行微调而获得，使用了3.8B的激活参数和25.2B的总参数，训练过程高效且节省计算资源。DiffusionGemma在生成速度和模型能力之间建立了新的平衡，能够在单个NVIDIA H100 GPU上每秒生成约1500个输出令牌，显著快于传统的自回归模型。'}}}, {'id': 'https://huggingface.co/papers/2608.01735', 'title': 'DAPD: Dual-Anchored Policy Distillation', 'url': 'https://huggingface.co/papers/2608.01735', 'abstract': 'Abstract  On-policy (self) distillation (OPSD) is increasingly adopted for language-model post-training. It strengthens the teacher with privileged information but can induce a privilege illusion: the student learns privilege-dependent behavior it cannot reproduce from its inference-time context, yet behaves as if the training-time privileged information remained available, ultimately degrading performance. In this paper, we identify information asymmetry between the privileged teacher and the student at inference as the root cause of this failure in OPSD. To resolve this asymmetry, we propose Dual-Anchored Policy Distillation (DAPD), a unified framework with two levels of anchoring. Dual-Path Anchoring (DPA) introduces a self-conditioned bridge and aligns reference and rollout behavior along two matched-information paths, preventing privilege-dependent behavior from being transferred to the inference-time student. Dual-Source Anchoring (DSA) applies these paths in both reference-to-rollout and rollout-to-reference directions, reducing reliance on privileged reference guidance while preserving correctness supervision. Extensive experiments show that DAPD significantly alleviates privilege illusion, outperforming OPSD on Qwen3-4B by +2.00 points on average across tasks. Notably, its gains persist across scales, reaching +2.69 at 4B and +2.78 at 32B.', 'score': 2, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'c037e8e8eff733cd', 'authors': ['Jianyu Wu', 'Yizhou Wang', 'Encheng Su', 'Chen Tang', 'Shixiang Tang'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'The University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01735.jpg', 'data': {'categories': [], 'emoji': '🎓', 'ru': {'title': 'Преодоление иллюзии привилегий в дистилляции языковых моделей', 'desc': 'В статье исследуется проблема привилегированной иллюзии в методе дистилляции политики на своих данных (OPSD), когда студент-модель учится поведению, зависящему от информации, недоступной во время инференса. Авторы предлагают метод Dual-Anchored Policy Distillation (DAPD), который устраняет информационную асимметрию между учителем и студентом через двухуровневое якорирование. Фреймворк использует Dual-Path Anchoring для выравнивания поведения по двум согласованным информационным путям и Dual-Source Anchoring для двусторонней передачи знаний. Экспериментальные результаты показывают, что DAPD значительно повышает качество дистилляции, улучшая производительность на +2.00 пункта в среднем и сохраняя преимущества при масштабировании до 32B параметров.'}, 'en': {'title': 'Bridging the Gap: Enhancing Language Models with Dual-Anchored Policy Distillation', 'desc': 'This paper discusses a method called Dual-Anchored Policy Distillation (DAPD) to improve on-policy self distillation in language models. The authors identify a problem where the student model learns behaviors based on privileged information that it cannot access during inference, leading to poor performance. DAPD introduces two anchoring techniques to align the learning process and reduce reliance on this privileged information. Experimental results show that DAPD significantly enhances model performance compared to traditional on-policy self distillation methods.'}, 'zh': {'title': '双锚策略蒸馏：消除特权幻觉的有效方法', 'desc': '本文提出了一种新的框架，称为双锚策略蒸馏（DAPD），旨在解决在语言模型后训练中出现的特权幻觉问题。特权幻觉是指学生模型在推理时无法重现训练时获得的特权信息，从而导致性能下降。通过双路径锚定和双源锚定，DAPD能够在两个信息路径上对齐参考和执行行为，减少对特权信息的依赖。实验结果表明，DAPD在多个任务上显著优于传统的自我蒸馏方法，提升了模型的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2608.00574', 'title': 'Relax Within, Balance Across: Geometry-Guided Load Balancing for Vision-Language Mixture-of-Experts', 'url': 'https://huggingface.co/papers/2608.00574', 'abstract': 'Abstract  Vision-language MoE batches contain different numbers of image and text tokens. Image resolution, image count, tiling, and prompt length all change this token mix. We call the standard token-level Switch auxiliary loss Std-Aux. Std-Aux balances only the mixed load, so large image and text load errors can cancel at one mix. On our main model, the same trained router shows more than a fivefold change in load imbalance across image resolutions. We hold the image and text load profiles fixed and derive the exact load curve as the token mix varies. The image-text load gap controls sensitivity to the token mix. Physical preprocessing can also change the conditional profiles. The fixed-profile law excludes such changes. To design a remedy, we examine the router input structure. Image and text occupy distinct regions, while visual tokens group strongly by source image. The modality boundary motivates separate image and text terms. The image boundary motivates one equal-weight routing instance per image. ReBA, or Relax Within, Balance Across, implements both choices. Across four split backbones, ReBA lowers load on every reported benchmark input while keeping mean task accuracy comparable to Std-Aux. ReBA also lowers average load over the tested range and worst physical load under resolution and tiling shifts. Code is available at https://github.com/ZiangWu-77/ReBA.', 'score': 1, 'issue_id': 2840, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '8c73c646b6d406f6', 'authors': ['Ziang Wu', 'Peng Jin', 'Qishen Yin', 'Munan Ning', 'Hao Li', 'Peizhen Zhang', 'Li Yuan'], 'affiliations': ['Peng Cheng Laboratory', 'Qwen Team', 'School of Software and Microelectronics, Peking University', 'Shenzhen Graduate School, Peking University', 'Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00574.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#architecture', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка нагрузки между модальностями в vision-language MoE', 'desc': 'Статья посвящена оптимизации маршрутизации в Mixture of Experts (MoE) моделях для vision-language задач. Авторы выявили, что стандартный вспомогательный loss (Std-Aux) неэффективно балансирует нагрузку между модальностями изображений и текста, особенно при изменении разрешения и количества токенов. Они предложили новый метод ReBA (Relax Within, Balance Across), который использует отдельные термины маршрутизации для изображений и текста, а также применяет равномерную маршрутизацию для каждого исходного изображения. Экспериментально показано, что ReBA снижает дисбаланс нагрузки на всех тестовых наборах данных, сохраняя при этом качество решения основной задачи.'}, 'en': {'title': 'Balancing Loads for Efficient Vision-Language Processing', 'desc': 'This paper introduces a method called ReBA (Relax Within, Balance Across) to improve the efficiency of vision-language models by addressing load imbalance in token processing. The authors highlight that traditional methods, like the standard token-level Switch auxiliary loss (Std-Aux), do not effectively manage the varying loads of image and text tokens, leading to inaccuracies. By analyzing the input structure of images and text, they propose a new routing strategy that separates the processing of these modalities, which helps to maintain accuracy while reducing computational load. The results show that ReBA consistently lowers the load across different benchmarks without sacrificing performance, making it a significant advancement in optimizing vision-language tasks.'}, 'zh': {'title': '优化视觉-语言模型的负载分配', 'desc': '这篇论文探讨了视觉-语言模型中的混合负载问题，特别是在图像和文本标记数量不同的情况下。作者提出了一种新的方法ReBA（Relax Within, Balance Across），旨在优化图像和文本的负载分配。通过固定图像和文本的负载配置，ReBA能够在不同的输入条件下降低负载，同时保持任务准确性。实验结果表明，ReBA在多个基准测试中表现优于传统的标准辅助损失方法。'}}}, {'id': 'https://huggingface.co/papers/2608.01755', 'title': 'Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs', 'url': 'https://huggingface.co/papers/2608.01755', 'abstract': 'Abstract  Recent Vision-Language-Action (VLA) models for autonomous driving (AD) increasingly utilize chain-of-thought (CoT) supervision to enhance the reasoning capabilities of their Vision-Language Model (VLM) components, yet existing annotation pipelines commonly expose the teacher model to the logged ground-truth (GT) future trajectory. We empirically show that this induces trajectory anchoring bias: teacher models rationalize the revealed outcome rather than infer a decision from scene evidence, producing less causally faithful CoTs and substantially more severe hallucinations, especially in causally challenging scenes. Removing the GT trajectory eliminates this shortcut, but open-ended trajectory generation entangles high-level decision-making with precise geometric synthesis and low-level dynamics. To make trajectory-level driving decisions verifiable without requiring open-ended trajectory synthesis, we introduce Autonomous-Driving Multiple-Choice Question (AD-MCQ), which casts planning as selection among explicit trajectory candidates. Taking this a step further, we propose Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR) to transform future trajectories from pre-decision anchors into post-decision verification targets. Experimental results show that DEFT-RLVR improves AD reasoning while preserving or even enhancing general visual capabilities. With VLM-only inference and controllable difficulty through candidate construction, AD-MCQ provides a flexible, scalable, and extensible foundation for future research on verifiable AD reasoning.', 'score': 0, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '6c381be0cfaffa29', 'authors': ['Zixuan Huang', 'Yang Zhou', 'Kaixuan Wang', 'Guli Zhang', 'Hongyan Xie', 'Yakun Zhu', 'Hao Geng', 'Yikun Ban', 'Deqing Wang'], 'affiliations': ['Beihang University', 'Shanghai Jiao Tong University', 'Zhejiang University', 'Zhuoyu Technology, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01755.jpg', 'data': {'categories': ['#multimodal', '#training', '#rlhf', '#agents', '#cv'], 'emoji': '🚗', 'ru': {'title': 'Избегаем якорения: от открытого синтеза к верификации траекторий в автономном вождении', 'desc': 'В работе изучается проблема смещения в цепочке рассуждений (CoT) при обучении моделей Vision-Language-Action для автономного вождения, когда учительская модель получает доступ к истинной траектории движения и начинает объяснять уже известный результат вместо причинного вывода из сцены. Авторы предлагают новый подход AD-MCQ, который переформулирует задачу планирования как выбор из предложенных кандидатов траекторий вместо открытого синтеза. Для решения проблемы якорения разработан метод DEFT-RLVR, который изменяет роль будущих траекторий с анкоров принятия решений на цели верификации после принятия решения. Экспериментальные результаты показывают, что предложенный метод улучшает качество рассуждений модели в задачах автономного вождения при сохранении общих возможностей зрительно-языковых моделей.'}, 'en': {'title': 'Enhancing Autonomous Driving Reasoning with Selective Trajectory Planning', 'desc': 'This paper addresses the challenges faced by Vision-Language-Action (VLA) models in autonomous driving, particularly the issue of trajectory anchoring bias caused by exposing teacher models to ground-truth future trajectories. The authors propose a new framework called Autonomous-Driving Multiple-Choice Question (AD-MCQ) that allows for planning decisions to be made by selecting from explicit trajectory candidates, rather than relying on open-ended trajectory generation. Additionally, they introduce Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR), which shifts the focus from pre-decision anchors to post-decision verification, enhancing the reasoning capabilities of the models. Experimental results demonstrate that DEFT-RLVR not only improves decision-making in complex driving scenarios but also maintains or boosts the overall visual performance of the models.'}, 'zh': {'title': '提升自动驾驶推理能力的新方法', 'desc': '最近的视觉-语言-动作（VLA）模型在自动驾驶（AD）中越来越多地利用思维链（CoT）监督来增强其视觉-语言模型（VLM）的推理能力。然而，现有的注释流程常常使教师模型接触到真实的未来轨迹，这会导致轨迹锚定偏差，使得教师模型更倾向于解释已知结果，而不是从场景证据中推断决策。为了解决这个问题，本文提出了自主驾驶多项选择题（AD-MCQ），将规划视为在明确轨迹候选中进行选择，并进一步提出了未来轨迹的延迟暴露（DEFT-RLVR），将未来轨迹从决策前的锚点转变为决策后的验证目标。'}}}];

        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (3)', '#agents (8)', '#agi', '#alignment', '#architecture (3)', '#audio (2)', '#benchmark (12)', '#cv (3)', '#data (1)', '#dataset (9)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (13)', '#open_source (5)', '#optimization (2)', '#plp (1)', '#rag (1)', '#reasoning (3)', '#rl (3)', '#rlhf (1)', '#robotics (1)', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic (3)', '#training (9)', '#transfer_learning', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-04 07:33',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-04 07:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-04 07:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
