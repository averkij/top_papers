    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.02023', 'title': 'SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks', 'url': 'https://huggingface.co/papers/2608.02023', 'abstract': 'Abstract  Speech and audio generation is often needed in animation dubbing, audio drama, movies, advertising, games, podcasts, and short-video production. In these scenarios, creators may need to design voices without reference recordings, control speaker styles with natural language, support acoustic scenes with environments and audio effects, and later reuse the designed voices. Therefore, it is important to support multi-speaker speech and audio generation for both instruct and zero-shot tasks. The instruct task requires a caption of the environment, speaker styles, and fine-grained content, while the zero-shot task uses reference audio together with the same fine-grained content. We address these tasks from both the data and model sides. First, we propose SwanData-Caption, which cleans raw speech and audio data, adds targeted synthetic coverage, and annotates diverse and accurate multi-level captions. Then, we propose SwanTale, a multi-speaker expressive speech and audio generation model that supports both zero-shot and instruct tasks. We introduce SwanVAE to support high-quality multi-audio-modality generation. Then, we adopt reward-conditioned quality control and Engram conditioning, along with Unified MoE for multi-task and multi-audio-modality modeling. In addition, we use curriculum learning and GRPO post-training to let the model progressively learn and strengthen its capabilities. Experimental results show that SwanTale leads on multiple key zero-shot and instruct metrics, achieves the best expressiveness scores in both tasks, and supports complex instruct generation involving multi-speaker speech and audio. Demos can be found at https://swanaigc.github.io/\\#swantale.', 'score': 28, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4b04115678abc0cc', 'authors': ['Yu Zhang', 'Ruiqi Li', 'Changhao Pan', 'Ke Lei', 'Xiang Yin', 'Cheng Yang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02023.jpg', 'data': {'categories': ['#games', '#training', '#audio', '#data', '#open_source', '#synthetic', '#dataset'], 'emoji': '🎙️', 'ru': {'title': 'Выразительная генерация речи и аудио с контролем по инструкциям и примерам', 'desc': 'В статье представлена система SwanTale для генерации многоголосой экспрессивной речи и аудио, которая поддерживает как инструктивные задачи с текстовым описанием сцены, так и нулевые примеры с референсным аудио. Авторы разработали датасет SwanData-Caption с чисткой данных, синтетическим расширением и многоуровневой аннотацией для обучения модели. Модель использует SwanVAE для высококачественной генерации мультимодального аудио, награду-обусловленный контроль качества, расширенное кодирование и унифицированную MoE архитектуру для обработки различных задач и модальностей. Система демонстрирует превосходные результаты по метрикам экспрессивности и качества в обеих постановках задач, включая сложные сценарии с несколькими говорящими.'}, 'en': {'title': 'Empowering Creative Voices with Advanced Audio Generation', 'desc': 'This paper presents advancements in speech and audio generation for various creative applications, such as animation and gaming. It introduces SwanData-Caption, a method for enhancing and annotating audio data to improve multi-speaker generation tasks. The authors also propose SwanTale, a model that excels in both instruct and zero-shot tasks, allowing for expressive audio generation without prior recordings. The model incorporates techniques like reward-conditioned quality control and curriculum learning to enhance its performance and adaptability.'}, 'zh': {'title': '多说话人语音生成的创新解决方案', 'desc': '本论文探讨了多说话人语音和音频生成在动画配音、音频剧、电影等场景中的应用。我们提出了SwanData-Caption，用于清理原始语音数据并添加多样化的注释，以支持指令和零样本任务。接着，我们介绍了SwanTale模型，能够生成高质量的多音频模态，并通过奖励条件质量控制和课程学习来提升模型能力。实验结果表明，SwanTale在多个关键指标上表现优异，支持复杂的多说话人语音生成。'}}}, {'id': 'https://huggingface.co/papers/2607.28590', 'title': 'VAD: Attributing Visual Evidence for Target Reconstruction in Multimodal On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.28590', 'abstract': 'Abstract  Multimodal on-policy distillation (OPD) transfers fine-grained visual knowledge by supervising student-generated trajectories with a privileged-view teacher. Yet its next-token corrections are source-mixed, combining visual signals with linguistic priors and teacher-specific effects. The key challenge is to estimate which corrections are supported by visual evidence, not merely where or how strongly to distill. We introduce Visual Attribution Distillation (VAD), a counterfactual target-reconstruction algorithm that estimates the visually attributable part of a teacher correction. At each student-generated prefix, VAD evaluates the same fixed teacher with the relevant evidence present and removed. The corresponding change in centered log-probabilities defines ut, a signed proxy for the visual evidence direction that estimates how revealing the evidence supports or refutes candidate tokens. VAD projects the original correction onto this proxy to obtain an intervention-aligned component and a proxy-unexplained residual, then reconstructs a student-anchored target from the former. During training, this reconstructed target supplies the primary supervision signal, while the privileged teacher contributes a weak regularizer. Across six fine-grained visual benchmarks at 4B and 9B scales, VAD outperforms direct privileged-view distillation and visual-advantage weighting. Token- level and controlled-target analyses show that the proxy-aligned component is enriched in task-relevant visual corrections and yields stronger target shifts, especially when evidence refutes a mistaken answer. These results support counterfactual target reconstruction as an effective alternative to source-mixed supervision.', 'score': 23, 'issue_id': 2839, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'f3f1d830b7497087', 'authors': ['Kangning Zhang', 'Yixing Li', 'Shuai Shao', 'Qingyao Li', 'Zhengxi Lu', 'Zhiyuan Yao', 'Jianghao Lin', 'Wenxiang Jiao', 'Yuan Lu', 'Weiwen Liu', 'Weinan Zhang', 'Yong Yu'], 'affiliations': ['Shanghai Jiao Tong University', 'Southeast University', 'The Chinese University of Hong Kong', 'Xiaohongshu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28590.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training'], 'emoji': '👁️', 'ru': {'title': 'Выделение визуальной атрибуции при дистилляции мультимодальных моделей', 'desc': 'В работе предлагается метод Visual Attribution Distillation (VAD) для улучшения дистилляции мультимодальных моделей. Основная идея заключается в том, чтобы выделить из корректив учителя только ту часть, которая действительно обусловлена визуальной информацией, отделив её от лингвистических приоритетов. Метод использует контрфактический подход: оценивает предсказания учителя при наличии и отсутствии визуальных доказательств, определяя таким образом влияние зрительных сигналов. Экспериментальные результаты на шести бенчмарках показывают, что VAD превосходит стандартную дистилляцию с привилегированным视представлением и более эффективно передаёт визуальные знания студенческой модели.'}, 'en': {'title': 'Enhancing Visual Knowledge Transfer with VAD', 'desc': "This paper presents Visual Attribution Distillation (VAD), a method that improves the transfer of visual knowledge in machine learning by focusing on the visual evidence behind teacher corrections. VAD uses a counterfactual approach to determine which parts of a teacher's guidance are supported by visual data, rather than just combining visual and linguistic signals. By evaluating the impact of visual evidence on the teacher's corrections, VAD creates a more accurate supervision signal for training student models. The results show that VAD significantly enhances performance on visual tasks compared to traditional methods, especially when the evidence contradicts incorrect predictions."}, 'zh': {'title': '视觉归因蒸馏：提升知识转移的有效方法', 'desc': '多模态的在线策略蒸馏（OPD）通过使用特权视角教师来监督学生生成的轨迹，从而转移细粒度的视觉知识。本文提出了视觉归因蒸馏（VAD），这是一种反事实目标重建算法，用于估计教师修正中由视觉证据支持的部分。VAD在每个学生生成的前缀上评估固定教师的相关证据，并通过比较有无证据的变化来定义视觉证据的方向。实验结果表明，VAD在多个细粒度视觉基准测试中表现优于直接的特权视角蒸馏，证明了反事实目标重建作为一种有效的监督替代方案。'}}}, {'id': 'https://huggingface.co/papers/2608.02499', 'title': 'SWE-Touch: Benchmarking Coding Agents When Users Touch the Code', 'url': 'https://huggingface.co/papers/2608.02499', 'abstract': 'Abstract  Real-world software development requires coding agents to operate in shared workspaces where users may inspect and modify code during an ongoing task, yet existing repository-level benchmarks typically evaluate agents working alone or restrict user participation to messages. This leads us to ask: how do coding agents understand and respond to code changes in a shared workspace? We introduce SWE-Touch, a framework that stress-tests this setting through validated Counter-Edits: plausible edits to task-relevant code that conflict with task completion. SWE-Touch mines task-critical regions from multiple repair trajectories, uses a separate User Patch Generator to construct the edits, and injects them with contextual user messages when agents reach the relevant code. We evaluate nine coding models on SWE-bench Verified, with additional experiments on longer-horizon tasks from SWE-Bench Pro and DeepSWE. Counter-Edit lowers average resolve rate by 7.7 percentage points on SWE-bench Verified, with degradation also persisting on both longer-horizon benchmarks. Trajectory analysis links these failures to limited awareness of the evolving workspace: agents may retain conflicting code or replace it without sufficiently re-inspecting the repository and validating the revised code with targeted tests. These findings show that strong autonomous performance does not yet ensure the state awareness and adaptive behavior needed for shared-workspace collaboration, and point to detecting workspace changes, reconciling conflicting edits with the task, and verifying the affected behavior as key capabilities for future optimization.', 'score': 13, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e7489fa536aa40aa', 'authors': ['Yuqiao Tan', 'Jinxiang Meng', 'Fangyu Lei', 'Minzheng Wang', 'Shizhu He', 'Jun Zhao', 'Kang Liu'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.02499.jpg', 'data': {'categories': ['#benchmark', '#plp', '#dataset', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Когда агентам не хватает внимания: совместная разработка кода требует осознания изменений', 'desc': 'В статье представлена система SWE-Touch для оценки способности coding agents работать в общих рабочих пространствах, где пользователи могут изменять код во время выполнения задачи. Система использует Counter-Edits — правдоподобные конфликтующие изменения кода — для стресс-тестирования девяти моделей на бенчмарках SWE-bench. Результаты показали, что средний процент успешного разрешения задач снизился на 7,7 пункта из-за ограниченной осведомленности агентов о динамических изменениях в репозитории. Исследование выявило критические недостатки в отслеживании состояния рабочего пространства и рекомендует разработать механизмы для обнаружения изменений, разрешения конфликтов и верификации затронутого кода.'}, 'en': {'title': 'Enhancing Coding Agents for Collaborative Workspaces', 'desc': "This paper introduces SWE-Touch, a framework designed to evaluate how coding agents handle code changes in collaborative environments. It focuses on the concept of Counter-Edits, which are plausible modifications that conflict with the agents' tasks. The study reveals that existing coding models struggle with awareness of changes in shared workspaces, leading to a decrease in their performance. The findings suggest that improving agents' ability to detect changes, reconcile conflicts, and validate code is essential for enhancing their collaborative capabilities."}, 'zh': {'title': '共享工作空间中的编码代理挑战', 'desc': '这篇论文探讨了在共享工作空间中，编码代理如何理解和响应代码的变化。研究提出了SWE-Touch框架，通过验证的反向编辑来测试这一环境，反向编辑是与任务完成相冲突的合理代码修改。实验表明，编码模型在处理这些反向编辑时的平均解决率下降了7.7个百分点，且这种下降在更长时间的任务中也存在。研究结果表明，强大的自主性能并不意味着编码代理具备在共享工作空间中所需的状态意识和适应行为，未来的优化应关注检测工作空间变化、调和冲突编辑与任务的关系，以及验证受影响行为的能力。'}}}, {'id': 'https://huggingface.co/papers/2608.02583', 'title': 'UEmbed: Unified Sparse and Dense Multimodal Embeddings', 'url': 'https://huggingface.co/papers/2608.02583', 'abstract': "Abstract  Sparse retrieval underpins modern search systems, from web search to retrieval-augmented generation. Existing work has introduced Learned Sparse Retrieval (LSR) to push beyond exact lexical matching toward richer semantics. Yet LSR has so far remained tied to encoder-style bidirectional architectures, and its extension to multimodal settings still relies heavily on auxiliary cross-modal modules. To address these limitations, we introduce UEmbed (Unified Embedding), a decoder-only multimodal embedding model that produces both sparse lexical and dense representations in one causal forward pass. UEmbed appends N learnable special tokens to the input and partitions the vocabulary into N disjoint subsets. Each token's causal hidden state predicts sparse weights over its assigned subset, and the N subsets are concatenated into the full sparse vector. Trained on public data, we release UEmbed at 2B, 4B, and 9B scales. UEmbed-9B reaches 71.8 (dense) and 71.0 (sparse) on MMEB-v2, outperforming multimodal embedding models trained on publicly available data (e.g., RzenEmbed). On BEIR, UEmbed also remains competitive with strong dense and sparse baselines. Furthermore, we demonstrate the practical utility of UEmbed across three dimensions: effectiveness, efficiency, and agentic applications. Overall, UEmbed offers a new paradigm: it unifies dense and sparse embeddings in one model, while further extending sparse retrieval to unify text and multimodal inputs.", 'score': 13, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '8b7e72d84edb3411', 'authors': ['Tingyu Song', 'Mingxin Li', 'Yanzhao Zhang', 'Dingkun Long', 'Pengjun Xie', 'Zhijie Nie', 'Yilun Zhao', 'Shu Wu'], 'affiliations': ['Alibaba Group', 'CASIA', 'University of Chinese Academy of Sciences', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02583.jpg', 'data': {'categories': ['#multimodal', '#rag', '#benchmark', '#agents', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Единая модель для разреженного и плотного поиска в мультимодальных данных', 'desc': 'В работе представлена UEmbed — единая модель для создания как разреженных лексических, так и плотных представлений текста и изображений в одном проходе декодера. Модель использует специальные обучаемые токены, которые предсказывают разреженные веса над разными подмножествами словаря, что позволяет избежать использования вспомогательных кросс-модальных модулей. UEmbed достигает конкурентных результатов на бенчмарках MMEB-v2 и BEIR, превосходя существующие многомодальные модели embeddings, обученные на открытых данных. Модель демонстрирует практическую полезность через эффективность поиска, вычислительную экономичность и применимость в агентных системах.'}, 'en': {'title': 'Unifying Dense and Sparse Retrieval with UEmbed', 'desc': 'This paper presents UEmbed, a novel decoder-only multimodal embedding model designed for sparse retrieval in search systems. UEmbed combines both sparse lexical and dense representations in a single forward pass, enhancing the retrieval process beyond traditional methods. By introducing learnable special tokens and partitioning the vocabulary, UEmbed efficiently predicts sparse weights, achieving high performance on multimodal benchmarks. The model demonstrates significant improvements in effectiveness and efficiency, making it a versatile tool for integrating text and multimodal inputs in retrieval tasks.'}, 'zh': {'title': '统一稀疏与稠密嵌入的新范式', 'desc': '这篇论文介绍了一种新的模型UEmbed（统一嵌入），它在稀疏检索中结合了稠密和稀疏表示。UEmbed使用解码器结构，通过一次前向传播生成稀疏和稠密的嵌入，克服了以往模型的局限性。该模型通过添加可学习的特殊标记，将词汇分成多个不相交的子集，从而提高了检索的语义丰富性。UEmbed在多个基准测试中表现优异，展示了其在有效性、效率和应用方面的实用性。'}}}, {'id': 'https://huggingface.co/papers/2607.29613', 'title': 'WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.29613', 'abstract': "Abstract  Reinforcement learning (RL) post-training of Vision-Language-Action (VLA) models has shown strong promise for robotic manipulation. Among RL methods, critic-based approaches rely on a value estimator that predominantly operates on single-frame observations or single-frame VLM backbone latents, which is a fundamental mismatch with the partially observable nature of robot control. A naive approach to incorporate observation history into the critic incurs exponential complexity with high-dimensional visual space, and still fails because pure scalar-return regression provides insufficient supervision for learning cross-temporal dynamics. We identify the root cause as a state approximation problem: without an explicit world modeling objective, the critic's representation cannot capture the temporal structure needed for accurate value estimation. To address this, we propose the World Critic Model (WCM), built on a lightweight LeJEPA architecture; WCM jointly predicts future latent state and estimates values, such that the critic's representation is explicitly trained to capture temporal dynamics rather than merely regress scalar returns. WCM integrates seamlessly into both on-policy and off-policy training pipelines and is compatible with state-of-the-art VLA backbones including Pi0, Pi0.5, and OpenVLA-OFT. Extensive experiments on 149 tasks across four benchmarks demonstrate that WCM consistently achieves state-of-the-art performance in both in-distribution and out-of-distribution settings, with particularly strong generalization gains. We further validate WCM on seven real-world manipulation tasks using OpenVLA-OFT and Pi0.5 with off-policy RL, confirming stable deployment across diverse settings.", 'score': 13, 'issue_id': 2839, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'c7f7e6f3142b7614', 'authors': ['Senyu Fei', 'Xiaopeng Yu', 'Siyin Wang', 'Xianzhong Zhao', 'Jingjing Gong', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29613.jpg', 'data': {'categories': ['#rl', '#multimodal', '#training', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Критик с моделированием мира для временной динамики в робототехнике', 'desc': 'В статье предложен метод улучшения обучения с подкреплением для робототехнических манипуляторов, использующих модели Vision-Language-Action. Авторы выявили проблему: критики в методах на основе оценки стоимости работают с отдельными кадрами, что не соответствует частичной наблюдаемости в управлении роботами. Решением является World Critic Model, построенная на архитектуре LeJEPA, которая одновременно предсказывает будущие скрытые состояния и оценивает значения, явно обучаясь захватывать временную динамику. Модель успешно интегрируется в on-policy и off-policy обучение и демонстрирует улучшение производительности на 149 задачах и семи реальных манипуляционных задачах.'}, 'en': {'title': 'Enhancing Robotic Learning with Temporal Awareness', 'desc': 'This paper introduces the World Critic Model (WCM) to improve reinforcement learning for robotic manipulation by addressing the limitations of traditional critic-based approaches. The WCM enhances value estimation by jointly predicting future states and capturing temporal dynamics, rather than just regressing scalar returns. This model is designed to work with various Vision-Language-Action (VLA) architectures and can be integrated into both on-policy and off-policy training methods. Experimental results show that WCM outperforms existing methods across multiple tasks, demonstrating its effectiveness in both familiar and novel environments.'}, 'zh': {'title': '提升机器人操作的世界评论者模型', 'desc': '强化学习（RL）在视觉-语言-动作（VLA）模型的后期训练中显示出强大的潜力，尤其是在机器人操作方面。现有的基于评论者的方法主要依赖于单帧观察或单帧VLM骨干的价值估计，这与机器人控制的部分可观察性特性不匹配。我们提出了世界评论者模型（WCM），它通过轻量级的LeJEPA架构共同预测未来的潜在状态并估计价值，从而显著改善了时间动态的捕捉。实验结果表明，WCM在多个基准测试中表现出色，尤其在真实世界的操作任务中也展现了稳定的部署能力。'}}}, {'id': 'https://huggingface.co/papers/2608.02603', 'title': 'WorldExam: Benchmarking World Models from Apparent Appearance to Inherent Reactivity', 'url': 'https://huggingface.co/papers/2608.02603', 'abstract': 'Abstract  Controllable video generation models are increasingly being developed as world models. Accordingly, evaluating them in this role extends beyond the apparent appearance of generated videos to the inherent reactivity of the worlds they depict: the ability to infer from the scene state how the world should react and to generate plausible consequences not explicitly described in the input. Yet existing benchmarks mainly assess visual quality or explicit instruction fulfillment by checking whether requested actions and interaction outcomes are realized, leaving inherent reactivity underexamined. We introduce WorldExam, a hierarchical diagnostic benchmark spanning four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. It comprises 1,474 cases across eight dedicated tasks and supports unified evaluation of camera-, action-, and language-driven model paradigms. The World Reactivity level evaluates scene-conditioned reactions and goal-directed behaviors beyond what is explicitly specified in the input. Evaluation of 20 representative models reveals a clear capability split. Camera-driven models excel at camera control, but their interfaces do not support dynamic interaction; action-driven models control subjects more precisely but often leave the world unresponsive; and language-driven models perform better on interaction but follow complex controls less faithfully. No model combines broad task coverage with consistently strong performance, showing that high visual quality and explicit instruction fulfillment do not guarantee inherent reactivity.', 'score': 11, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '02882d4253b0287f', 'authors': ['Yuxue Yang', 'Shuyao Shang', 'Jiahe Wang', 'Zitong Zhou', 'Liang Tan', 'Junhan Zeng', 'Ruizhi Li', 'Junyan Li', 'Yu Liu', 'Xiao Yang', 'Yong Li', 'Jun Zhu', 'Hongsheng Li', 'Tieniu Tan', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['Chinese Academy of Sciences', 'Tsinghua University', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.02603.jpg', 'data': {'categories': ['#benchmark', '#video', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Оценка реактивности виртуальных миров в моделях генерации видео', 'desc': 'В статье представлен WorldExam — иерархический бенчмарк для оценки моделей генерации видео, которые используются в качестве мировых моделей. Бенчмарк включает четыре уровня оценки: качество визуализации, соответствие управлению, пространственная согласованность и реактивность мира, охватывая 1474 случая в восьми различных задачах. Особое внимание уделяется оценке реактивности мира — способности модели предсказывать и генерировать правдоподобные последствия происходящего в сцене, которые не были явно указаны во входных данных. Анализ 20 моделей показал, что камеро-ориентированные модели хорошо управляют камерой, но не поддерживают динамическое взаимодействие, действие-ориентированные модели точнее контролируют объекты, но часто оставляют мир нереактивным, а языковые модели лучше справляются с взаимодействием, но менее точно следуют сложным командам.'}, 'en': {'title': 'Evaluating Video Models: Beyond Visuals to World Reactivity', 'desc': "This paper discusses the development of controllable video generation models that act as world models, focusing on their ability to react to scene states. It highlights the limitations of current evaluation benchmarks, which primarily assess visual quality and adherence to explicit instructions, neglecting the models' inherent reactivity. The authors introduce WorldExam, a comprehensive benchmark that evaluates models across four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. Their findings reveal that while different model types excel in specific areas, none achieve a balance of high performance across all tasks, indicating that visual appeal and instruction compliance do not ensure effective world interaction."}, 'zh': {'title': '评估视频生成模型的内在反应性', 'desc': '可控视频生成模型正在被开发为世界模型。评估这些模型不仅要看生成视频的外观，还要考虑它们所描绘世界的内在反应能力。现有的基准主要关注视觉质量和明确指令的实现，而对内在反应性关注不足。我们提出了WorldExam，这是一个分层诊断基准，涵盖视觉质量、控制遵循、空间一致性和世界反应性四个层面。'}}}, {'id': 'https://huggingface.co/papers/2608.02287', 'title': 'SKT: Skill-Use Training at Scale via Verified Synthetic Data Generation', 'url': 'https://huggingface.co/papers/2608.02287', 'abstract': 'Abstract  Agent skills have become an important mechanism for equipping language-model agents with reusable procedural knowledge. However, providing skills alone does not guarantee that current models can effectively identify, apply, and coordinate them. To improve skill-use capabilities, we introduce SKT, a verified data synthesis pipeline that constructs skill-grounded tasks and executable trajectories from large collections of agent skills. SKT selects suitable single-skill and multi-skill configurations, synthesizes tasks through rule-based and agent-based verification with feedback-guided repair, and retains only successful trajectories that substantially use every required skill. Using 2,000 public skills, SKT produces 4,000 task packages and 27,164 verified trajectories. Based on the same pipeline and a disjoint test pool, we further construct SkillEval, a held-out executable benchmark for evaluating skill use. Experiments across diverse models, benchmarks, and agent harnesses show that supervised fine-tuning on SKT-generated trajectories consistently improves skill-use performance. Verification ablations, cross-harness evaluation, and scaling experiments further demonstrate that these gains depend on high-quality supervision, extend beyond a single agent interface, and increase with broader skill coverage. Together, these results establish verified data synthesis as an effective and scalable approach for skill-use training.', 'score': 10, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '3306ffc2ed710b66', 'authors': ['Zelin Tan', 'Yiqun Zhang', 'Hao Li', 'Zhiyao Cui', 'Hejia Geng', 'Shao Zhang', 'Hangfan Zhang', 'Yang Chen', 'Xiaosong Wang', 'Lilong Wang', 'Zhenfei Yin', 'Shuyue Hu', 'Chen Zhang', 'Lei Bai'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.02287.jpg', 'data': {'categories': ['#training', '#reasoning', '#agents', '#benchmark', '#synthetic', '#dataset'], 'emoji': '🛠️', 'ru': {'title': 'Верифицированный синтез данных для обучения агентов использованию навыков', 'desc': 'В статье предлагается SKT — конвейер синтеза верифицированных данных для обучения агентов на основе больших языковых моделей эффективно использовать навыки. Система автоматически создаёт задачи и траектории выполнения, проверяя качество синтезированных данных с помощью обратной связи. Из 2000 публичных навыков генерируется 4000 пакетов задач и более 27000 верифицированных траекторий. Эксперименты показывают, что обучение с учителем на синтезированных данных стабильно улучшает способность моделей к координации и применению навыков.'}, 'en': {'title': 'Enhancing Agent Skills with Verified Data Synthesis', 'desc': 'This paper presents SKT, a data synthesis pipeline designed to enhance the skill-use capabilities of language-model agents. SKT constructs skill-grounded tasks and executable trajectories by selecting appropriate single and multi-skill configurations from a large pool of agent skills. The pipeline employs rule-based and agent-based verification methods to ensure that only successful trajectories that effectively utilize the required skills are retained. The results show that training on SKT-generated data significantly improves the performance of various models in skill application, highlighting the importance of high-quality supervision and broad skill coverage.'}, 'zh': {'title': '验证数据合成：提升技能使用的有效方法', 'desc': '本论文介绍了一种名为SKT的数据合成管道，用于构建基于技能的任务和可执行轨迹，以提高语言模型代理的技能使用能力。SKT通过选择合适的单技能和多技能配置，结合基于规则和基于代理的验证，合成任务并进行反馈修复，最终保留成功的轨迹。使用2000个公共技能，SKT生成了4000个任务包和27164个经过验证的轨迹。实验结果表明，在SKT生成的轨迹上进行监督微调可以显著提高技能使用性能，验证数据合成被确立为一种有效且可扩展的技能训练方法。'}}}, {'id': 'https://huggingface.co/papers/2608.01973', 'title': 'Roomer: Reflective Object-Grounded Model Editing and Repair for 3D Indoor Layout Synthesis', 'url': 'https://huggingface.co/papers/2608.01973', 'abstract': "Abstract  Existing indoor layout generators produce globally plausible layouts yet may retain local violations such as collisions, out-of-bounds placements, obstructed openings, and blocked circulation. Most prior work focuses on full-scene synthesis or scene-level optimization, with limited support for identifying responsible objects and locally repairing affected regions. We present Roomer, a reflective repair framework that casts these violations as sparse, object-grounded repair problems. Roomer encodes layouts as ``RoState'' and uses ``RoReview'' to bind measured violations to implicated objects. A geometry-conditioned vision-language model planner proposes a structured local edit, while a deterministic solver validates it and generates a finite set of candidate edits when needed. Each candidate is committed only if full-scene verification confirms that it resolves the target violation without new hard violations or broken protected constraints. We train the planner on Roomer-CC, a controlled-corruption dataset that pairs faulty layouts with object-grounded violation evidence and known-feasible inverse StatePatches. Since existing benchmarks rarely assess whether physically valid layouts are usable, we introduce Roomer-Eval to assess distributional quality, physical validity, and practical usability. Experiments show that Roomer repairs residual violations while preserving valid regions, improves physical validity and usability, and transfers across external generators.", 'score': 6, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '1bfea2972109a104', 'authors': ['Lingwei Dang', 'Ziyan Qiu', 'Jiajia Cheng', 'Shishuo Shang', 'Zhenhao Zhang', 'Yufei Zhu', 'Qingxin Xiao', 'Pan Liu', 'Shenghui Huang', 'Yun Hao', 'Juntong Li', 'Qingyao Wu'], 'affiliations': ['School of Information Science and Technology, ShanghaiTech University', 'School of Software Engineering, South China University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.01973.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#dataset'], 'emoji': '🏠', 'ru': {'title': 'Локальное восстановление планировок помещений через обоснованное редактирование', 'desc': 'В статье представлена система Roomer для исправления локальных нарушений в сгенерированных планировках помещений, таких как коллизии объектов и перекрытие проходов. Система использует vision-language модель для предложения структурированных локальных редактирований и детерминированный решатель для проверки их корректности. Авторы создали специальный датасет Roomer-CC для обучения модели на парах ошибочных планировок с аннотациями нарушений. Предложен также новый бенчмарк Roomer-Eval для оценки не только физической валидности, но и практической удобства использования сгенерированных сцен.'}, 'en': {'title': 'Roomer: Smart Fixes for Indoor Layouts', 'desc': 'The paper introduces Roomer, a framework designed to fix local layout violations in indoor spaces, such as collisions and blocked openings. It treats these issues as specific problems linked to individual objects, allowing for targeted repairs. Roomer uses a combination of a geometry-conditioned vision-language model and a deterministic solver to propose and validate local edits to the layout. The framework is trained on a dataset that includes faulty layouts and their corresponding violation evidence, and it also introduces a new evaluation method to ensure the usability and physical validity of the generated layouts.'}, 'zh': {'title': 'Roomer：智能室内布局修复框架', 'desc': '本文介绍了一种名为Roomer的室内布局修复框架，旨在解决现有布局生成器在局部区域存在的违规问题，如碰撞和阻塞。Roomer将这些违规视为稀疏的、与对象相关的修复问题，通过编码布局为“RoState”并使用“RoReview”将违规与相关对象绑定。该框架利用几何条件的视觉-语言模型规划器提出结构化的局部编辑，并通过确定性求解器验证这些编辑。实验表明，Roomer能够修复剩余的违规，同时保持有效区域，提高物理有效性和可用性。'}}}, {'id': 'https://huggingface.co/papers/2608.01954', 'title': 'StyleForge: Indoor Furniture Styling by Counterfactual Reasoning in a Hypergraph Field', 'url': 'https://huggingface.co/papers/2608.01954', 'abstract': 'Abstract  Fixed-layout indoor furniture styling requires selecting assets that form a coherent room without changing the prescribed furniture categories, positions, orientations, or scales. Existing approaches typically retrieve each asset independently or rely on static local relations, making them prone to shape, material, and color conflicts after scene composition. We introduce StyleForge, a scene-level structured selection framework built on a dynamic hypergraph style field. A frozen multimodal large language model extracts structured style priors from an open-ended style request and the fixed layout, while StyleForge maintains a learnable candidate distribution for each furniture slot. Conditioned on the target style, the dynamic hypergraph style field adaptively activates and weights layout-induced hyperedges to capture higher-order dependencies among furniture. Counterfactual style preference learning then treats each candidate as a local substitution in the current style field and evaluates its contextual compatibility using Mahalanobis energies. Training alternates between optimizing the style field and the candidate logits. At inference, the model remains frozen and test-time training updates only room-specific candidate logits, progressively correcting cross-slot style conflicts as the global scene context evolves. Experiments on 3D-FRONT demonstrate state-of-the-art furniture retrieval and scene-level style coherence, producing more coherent fixed-layout furniture arrangements than object- and scene-level retrieval baselines.', 'score': 5, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e63a4aa860176486', 'authors': ['Lingwei Dang', 'Shishuo Shang', 'Pan Liu', 'Jiajia Cheng', 'Ziyan Qiu', 'Zhenhao Zhang', 'Yufei Zhu', 'Shenghui Huang', 'Qingxin Xiao', 'Yun Hao', 'Juntong Li', 'Qingyao Wu'], 'affiliations': ['School of Information Science and Technology, ShanghaiTech University', 'School of Software Engineering, South China University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.01954.jpg', 'data': {'categories': ['#3d', '#multimodal', '#training'], 'emoji': '🛋️', 'ru': {'title': 'Согласованный выбор мебели через динамическое гиперграфовое поле стиля', 'desc': 'StyleForge представляет собой фреймворк для выбора мебели в интерьере, который поддерживает фиксированные позиции и ориентации предметов. Система использует замороженную многомодальную LLM для извлечения стилевых приоритетов из пользовательского запроса и макета помещения. Динамическое гиперграфовое поле стиля адаптивно активирует связи между предметами мебели, учитывая их взаимные влияния при оценке совместимости. Обучение использует контрфактический анализ предпочтений стиля с энергией Махаланобиса для проверки согласованности стиля на уровне всей сцены.'}, 'en': {'title': 'StyleForge: Coherent Furniture Selection for Fixed Layouts', 'desc': 'The paper presents StyleForge, a novel framework for selecting indoor furniture that maintains a coherent style while adhering to fixed layout constraints. It utilizes a dynamic hypergraph style field to capture complex relationships between furniture pieces, allowing for better integration of style preferences. By employing a frozen multimodal large language model, StyleForge extracts structured style information from user requests and optimizes the selection process through counterfactual learning. The results show that StyleForge outperforms existing methods in achieving coherent furniture arrangements, demonstrating its effectiveness in scene-level style coherence.'}, 'zh': {'title': '智能家具风格选择，提升室内设计一致性', 'desc': '本文介绍了一种名为StyleForge的室内家具风格选择框架，旨在在固定布局下选择和组合家具。该框架利用动态超图样式场，能够提取结构化的样式先验，并在每个家具位置维护可学习的候选分布。通过对目标风格的条件化，StyleForge能够捕捉家具之间的高阶依赖关系，从而减少样式冲突。实验结果表明，StyleForge在家具检索和场景风格一致性方面表现优越，能够生成更为协调的固定布局家具安排。'}}}, {'id': 'https://huggingface.co/papers/2608.02358', 'title': 'ScrambleToolBench: Agents Search Exhaustively Even When Their Own Map Points to the Next Step', 'url': 'https://huggingface.co/papers/2608.02358', 'abstract': 'Abstract  To operate robustly in open-world environments, autonomous agents should be able to infer the behavior of unfamiliar systems through interaction alone, even in the absence of documentation. However, existing tool-use benchmarks expose semantic tool schemas in static environments, allowing agents to rely on prior knowledge rather than autonomous discovery. To address this limitation, we introduce ScrambleToolBench, an interactive terminal benchmark designed to isolate behavioral reasoning. By removing semantic cues and enforcing a continuous task curriculum, the benchmark requires agents to uncover hidden tool behaviors entirely through trial-and-error interaction. The benchmark further introduces dynamic challenges, including mapping drift, stochastic action failures, and temporal execution windows, to evaluate whether agents can revise and adapt their hypotheses as the environment changes. Our evaluation of state-of-the-art language models reveals that successful initial discovery does not translate into robust adaptation. When faced with structural changes such as mapping drift, agents fail to use deductive strategies such as cycle tracing, and instead exhibit belief inertia or fall back to exhaustive search. Increasing test-time reasoning only amplifies this expensive brute-force search rather than enabling deductive recovery. While equipping agents with persistent memory reduces compounding errors, they remain unable to efficiently infer structural changes, highlighting a gap in current agent reasoning.', 'score': 4, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e17650db15adbe80', 'authors': ['Vernon Toh', 'Navonil Majumder', 'Zhengyuan Liu', 'Nancy F. Chen', 'Soujanya Poria'], 'affiliations': ['Agency for Science, Technology, and Research (A*STAR), Singapore', 'DeCLaRe Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.02358.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔧', 'ru': {'title': 'Агенты LLM не умеют приспосабливаться: разрыв между открытием и адаптацией', 'desc': 'В работе представлена система ScrambleToolBench для оценки способности автономных агентов на основе больших языковых моделей (LLM) открывать и адаптировать поведение незнакомых инструментов исключительно через взаимодействие, без доступа к семантической информации. Бенчмарк удаляет семантические подсказки и использует прогрессивный curriculum обучения, заставляя агентов методом проб и ошибок выяснять скрытую функциональность инструментов. Исследование выявило критический разрыв: современные LLM успешно открывают начальное поведение инструментов, но не способны эффективно адаптироваться при изменении окружения, таких как сдвиг отображения или стохастические сбои. Агенты полагаются на перебор вариантов вместо дедуктивных стратегий вроде трассировки циклов, что указывает на недостаток в способности агентов к гипотетическому рассуждению и адаптивному обучению.'}, 'en': {'title': 'Discovering Tools Through Interaction: A New Benchmark for Autonomous Agents', 'desc': "This paper presents ScrambleToolBench, a new benchmark for testing how autonomous agents can learn about unfamiliar tools through interaction without prior knowledge. Unlike existing benchmarks that provide semantic cues, ScrambleToolBench focuses on behavioral reasoning by requiring agents to discover tool functions via trial-and-error. The benchmark introduces dynamic challenges like mapping drift and stochastic failures to assess agents' adaptability in changing environments. The findings show that while agents can initially discover tool behaviors, they struggle to adapt to structural changes, indicating a need for improved reasoning strategies in machine learning models."}, 'zh': {'title': '自主代理的行为推理新挑战', 'desc': '为了在开放世界环境中稳健地操作，自主代理需要通过交互推断不熟悉系统的行为，而不依赖文档。现有的工具使用基准测试在静态环境中暴露了语义工具模式，使代理依赖于先前知识，而不是自主发现。为了解决这个问题，我们引入了ScrambleToolBench，这是一个交互式基准测试，旨在隔离行为推理。该基准通过消除语义线索和强制连续任务课程，要求代理完全通过试错交互来发现隐藏的工具行为。'}}}, {'id': 'https://huggingface.co/papers/2608.00440', 'title': 'Poplar: A Scalable Pipeline for Human-Centric Image Dataset Synthesis', 'url': 'https://huggingface.co/papers/2608.00440', 'abstract': 'Abstract  Recent image generators can synthesize convincing human-centric images, yet producing a useful collection remains different from producing a single successful image. A human-centric dataset must cover varied people and contexts, avoid implausible attribute combinations, preserve an everyday photographic character, and expose quality-control decisions at scale. We present Poplar, a reproducible Specify--Render--Inspect pipeline for human-centric image dataset synthesis. Specify samples structured attributes under commonsense constraints and verbalizes them as photography-oriented prompts. Render uses a realism-adapted image generator across composition-aware aspect ratios and retries obvious technical failures. Inspect applies a single structured vision--language review to each candidate, preserving the original prompt while rejecting intrinsic image defects or material prompt mismatches. Using Poplar, we construct Poplar-9K: 9,401 curated human-centric image--text pairs retained from 11,765 reviewed candidates (79.9\\% acceptance). We release the dataset together with the pipeline, configurations, immutable generation prompts, and auditable inspection records as a compact resource for building customizable human-centric collections.', 'score': 2, 'issue_id': 2839, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '9b73548a6fe0055c', 'authors': ['Zhishan Zou'], 'affiliations': ['Beijing University of Posts and Telecommunications'], 'pdf_title_img': 'assets/pdf/title_img/2608.00440.jpg', 'data': {'categories': ['#multimodal', '#cv', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Автоматизированный конвейер для синтеза качественных датасетов людей', 'desc': 'Авторы представляют Poplar — воспроизводимый конвейер для синтеза человеко-центричных датасетов с использованием генераторов изображений. Система работает в три этапа: спецификация структурированных атрибутов под логические ограничения, рендеринг изображений с адаптацией к реалистичности, и инспекция с помощью мультимодальной модели зрения-языка. На основе этого подхода создан датасет Poplar-9K из 9,401 высококачественной пары изображение-текст с 79,9% acceptance rate. Разработчики открывают датасет вместе с полным конвейером, конфигурациями и аудит-логами для создания кастомизированных человеко-центричных коллекций.'}, 'en': {'title': 'Poplar: Crafting Quality Human-Centric Image Datasets', 'desc': 'This paper introduces Poplar, a new pipeline designed for creating high-quality human-centric image datasets. The pipeline consists of three main steps: Specify, Render, and Inspect, which work together to ensure that the generated images meet specific criteria. It emphasizes the importance of structured attributes and commonsense constraints to avoid unrealistic combinations in the images. The authors also present the Poplar-9K dataset, which includes over 9,000 curated image-text pairs, providing a valuable resource for future machine learning applications.'}, 'zh': {'title': '构建高质量人类中心图像数据集的创新管道', 'desc': '最近的图像生成器可以合成逼真的人类图像，但制作一个有用的图像集合与生成单个成功图像是不同的。我们提出了Poplar，这是一个可重复的指定-渲染-检查管道，用于人类中心图像数据集的合成。该管道通过常识约束来指定结构化属性，并将其转化为摄影导向的提示。使用Poplar，我们构建了Poplar-9K：从11,765个候选图像中保留的9,401个经过审查的人类中心图像-文本对。'}}}, {'id': 'https://huggingface.co/papers/2608.01755', 'title': 'Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs', 'url': 'https://huggingface.co/papers/2608.01755', 'abstract': 'Abstract  Recent Vision-Language-Action (VLA) models for autonomous driving (AD) increasingly utilize chain-of-thought (CoT) supervision to enhance the reasoning capabilities of their Vision-Language Model (VLM) components, yet existing annotation pipelines commonly expose the teacher model to the logged ground-truth (GT) future trajectory. We empirically show that this induces trajectory anchoring bias: teacher models rationalize the revealed outcome rather than infer a decision from scene evidence, producing less causally faithful CoTs and substantially more severe hallucinations, especially in causally challenging scenes. Removing the GT trajectory eliminates this shortcut, but open-ended trajectory generation entangles high-level decision-making with precise geometric synthesis and low-level dynamics. To make trajectory-level driving decisions verifiable without requiring open-ended trajectory synthesis, we introduce Autonomous-Driving Multiple-Choice Question (AD-MCQ), which casts planning as selection among explicit trajectory candidates. Taking this a step further, we propose Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR) to transform future trajectories from pre-decision anchors into post-decision verification targets. Experimental results show that DEFT-RLVR improves AD reasoning while preserving or even enhancing general visual capabilities. With VLM-only inference and controllable difficulty through candidate construction, AD-MCQ provides a flexible, scalable, and extensible foundation for future research on verifiable AD reasoning.', 'score': 0, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '6c381be0cfaffa29', 'authors': ['Zixuan Huang', 'Yang Zhou', 'Kaixuan Wang', 'Guli Zhang', 'Hongyan Xie', 'Yakun Zhu', 'Hao Geng', 'Yikun Ban', 'Deqing Wang'], 'affiliations': ['Beihang University', 'Shanghai Jiao Tong University', 'Zhejiang University', 'Zhuoyu Technology, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01755.jpg', 'data': {'categories': ['#multimodal', '#training', '#rlhf', '#agents', '#cv'], 'emoji': '🚗', 'ru': {'title': 'Избегаем якорения: от открытого синтеза к верификации траекторий в автономном вождении', 'desc': 'В работе изучается проблема смещения в цепочке рассуждений (CoT) при обучении моделей Vision-Language-Action для автономного вождения, когда учительская модель получает доступ к истинной траектории движения и начинает объяснять уже известный результат вместо причинного вывода из сцены. Авторы предлагают новый подход AD-MCQ, который переформулирует задачу планирования как выбор из предложенных кандидатов траекторий вместо открытого синтеза. Для решения проблемы якорения разработан метод DEFT-RLVR, который изменяет роль будущих траекторий с анкоров принятия решений на цели верификации после принятия решения. Экспериментальные результаты показывают, что предложенный метод улучшает качество рассуждений модели в задачах автономного вождения при сохранении общих возможностей зрительно-языковых моделей.'}, 'en': {'title': 'Enhancing Autonomous Driving Reasoning with Selective Trajectory Planning', 'desc': 'This paper addresses the challenges faced by Vision-Language-Action (VLA) models in autonomous driving, particularly the issue of trajectory anchoring bias caused by exposing teacher models to ground-truth future trajectories. The authors propose a new framework called Autonomous-Driving Multiple-Choice Question (AD-MCQ) that allows for planning decisions to be made by selecting from explicit trajectory candidates, rather than relying on open-ended trajectory generation. Additionally, they introduce Deferred Exposure of Future Trajectories for RLVR (DEFT-RLVR), which shifts the focus from pre-decision anchors to post-decision verification, enhancing the reasoning capabilities of the models. Experimental results demonstrate that DEFT-RLVR not only improves decision-making in complex driving scenarios but also maintains or boosts the overall visual performance of the models.'}, 'zh': {'title': '提升自动驾驶推理能力的新方法', 'desc': '最近的视觉-语言-动作（VLA）模型在自动驾驶（AD）中越来越多地利用思维链（CoT）监督来增强其视觉-语言模型（VLM）的推理能力。然而，现有的注释流程常常使教师模型接触到真实的未来轨迹，这会导致轨迹锚定偏差，使得教师模型更倾向于解释已知结果，而不是从场景证据中推断决策。为了解决这个问题，本文提出了自主驾驶多项选择题（AD-MCQ），将规划视为在明确轨迹候选中进行选择，并进一步提出了未来轨迹的延迟暴露（DEFT-RLVR），将未来轨迹从决策前的锚点转变为决策后的验证目标。'}}}];

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (5)', '#agi', '#alignment', '#architecture (1)', '#audio (1)', '#benchmark (7)', '#cv (3)', '#data (1)', '#dataset (6)', '#diffusion', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (7)', '#open_source (2)', '#optimization', '#plp (1)', '#rag (1)', '#reasoning (1)', '#rl (1)', '#rlhf (1)', '#robotics (1)', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic (2)', '#training (6)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-04 04:57',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-04 04:57')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-04 04:57')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
