    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.07624', 'title': 'Beneath the Surface: What We Overlook When We Talk About Agent Evolution', 'url': 'https://huggingface.co/papers/2611.07624', 'abstract': 'Abstract  Agent harness evolution enables recursive self-improvement (RSI) without updating model weights. We examine whether higher benchmark scores yield reliable, efficient, and transferable improvement. We evaluate four methods across harnesses, general and coding tasks. Repeated evaluations, controlled agent expansion, component interventions, and admission replays reveal recurring patterns. All sixteen evolved agents gain previously uncovered tasks while losing previously covered ones. In one general-task case, reliability rises by 5.2 points despite losing ten previously covered tasks. Most reliability gains also increase deployment cost. Specific changes usually outperform generic reminders, but their benefits can change when combined. The highest-scoring agent does not yield the largest mean improvement in any of our four pools, and stricter admission can discard useful alternatives. Transfer selectively preserves gains: coverage usually falls on the general-task target across both harness types and paradigms, but rises on the coding target with the outer-layer-only harness. These findings motivate preservation-aware evaluation, tested decision rules, and explicit applicability conditions. As a constructive follow-up, EvoAudit turns these diagnostics into revisions of select, analyze, mutate, and gate, achieving the best performance.', 'score': 12, 'issue_id': 3514, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '2198db2d1e188c4e', 'authors': ['Xiaobo Wang', 'Zimu Wang', 'Siyu Ye', 'Jiaqi Li', 'Min Tang', 'Jun Bai', 'Yuling Shi', 'Ruobing Wang', 'Jingjing Zhang', 'Chaofan Wang', 'Kai Wu', 'Mengnan Qi', 'Kai Cai', 'Xiaodong Gu', 'Qi Liu', 'Zilong Zheng'], 'affiliations': ['Beijing Institute for General Artificial Intelligence', 'Shanghai Jiaotong University', 'Simple Agent Lab', 'University of California, Berkeley', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.07624.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#training', '#reasoning', '#agents'], 'emoji': '🧬', 'ru': {'title': 'Высокий балл не означает настоящего прогресса: сохраняй то, что уже работает', 'desc': 'Статья исследует рекурсивное самоулучшение LLM-агентов через эволюцию agent harness, то есть обвязки вокруг модели, без обновления её весов. Авторы показывают, что рост benchmark-оценок не гарантирует надёжности, эффективности и переносимости: эволюционировавшие агенты получают новые задачи, но часто теряют ранее решённые. Выявлено, что большинство улучшений надёжности увеличивают стоимость развёртывания, а высший балл не равен наибольшему среднему приросту. Предложенный EvoAudit переписывает этапы select, analyze, mutate и gate на основе этих диагностик и даёт лучший результат.'}, 'en': {'title': 'Improve the harness, but preserve what already works', 'desc': 'The paper studies recursive self-improvement in AI agents by changing their harnesses and tools without updating model weights. Across general and coding tasks, evolved agents often gain new task coverage while losing some tasks they could previously solve, and reliability improvements can increase deployment costs. Higher benchmark scores do not reliably predict which agent will improve most, and changes can behave differently when combined or transferred to new settings. The authors propose EvoAudit, which uses these findings to revise how agents are selected, analyzed, modified, and evaluated before admission.'}, 'zh': {'title': '别只追求高分：让智能体改进可保留、可迁移、可验证', 'desc': '本文研究在不更新模型权重的情况下，通过改进智能体运行框架实现递归自我改进。实验发现，演化后的智能体会学会解决一些新任务，却也可能失去原本能解决的任务；可靠性提升通常还会增加部署成本。最高基准分数不一定带来最大的平均改进，而严格筛选也可能丢弃有用方案，改进能否迁移则取决于任务和框架。作者据此提出 EvoAudit，通过改进方案选择、分析、变异和筛选流程，取得了最佳表现。'}}}, {'id': 'https://huggingface.co/papers/2611.06748', 'title': 'EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models', 'url': 'https://huggingface.co/papers/2611.06748', 'abstract': 'Abstract  Generative video models are increasingly used as visual world simulators, yet their primary strength lies in rendering plausible pixels rather than reasoning about how a world should evolve. Coherent world evolution requires more than visual fidelity: when an event occurs, a model must infer its consequences for the entities in the world and then render the resulting state. For example, after a wild beast appears, the model should not only depict the wild beast, but also infer whether a nearby person should flee, take cover, or fight back based on the realized scene. Existing diffusion-based video models lack an explicit mechanism for maintaining world state and reasoning over such event-conditioned consequences, often producing visually plausible but behaviorally static or causally inconsistent outputs. To make this reasoning gap concrete and measurable, we propose a new problem, Out-of-Sight Causal Evolution, which requires a model to render an event, reason about its consequences for the evolving world state, and reveal a causally plausible outcome as the world continues to evolve, even out of sight. As a baseline reference solution, we introduce EvoWorld, a brain-renderer collaboration framework in which a vision-language model serves as the world brain: it observes generated segments, maintains an evolving account of the world, and reasons about plausible state transitions, while a segment-autoregressive video renderer realizes them visually. We further introduce EvoWorld-Data and EvoWorld-Bench for training and evaluating event realization, causal reactions, and revisit consistency. Experiments show that EvoWorld substantially improves event-conditioned causal evolution over recent models while preserving visual quality and consistency, establishing a reference point for reasoning-guided, autonomous world evolution beyond the current field of view.', 'score': 7, 'issue_id': 3514, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '68cb7100fa3f18ff', 'authors': ['Yequan Bie', 'Dengyang Jiang', 'Zhixuan Chen', 'Xiaozhuan Liang', 'Haoxuan Che', 'Quande Liu', 'Xi Chen', 'Hao Chen'], 'affiliations': ['Tencent', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.06748.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#multimodal', '#video', '#architecture', '#agi', '#reasoning', '#agents'], 'emoji': '🌍', 'ru': {'title': 'Видеомодель, которая не только рисует, но и понимает, что будет дальше', 'desc': 'Статья рассматривает генеративные видеомодели как симуляторы мира, которые умеют хорошо рисовать пиксели, но плохо рассуждают о том, как мир должен развиваться после события. Авторы формулируют задачу Out-of-Sight Causal Evolution, где модель должна отрисовать событие, вывести его последствия для состояния мира и показать причинно правдоподобный исход даже вне поля зрения. Предложенный базовый подход EvoWorld сочетает VLM в роли «мозга», который отслеживает состояние мира и делает выводы, и сегментно-авторегрессивный видеорендерер, который визуализирует эти переходы. Дополнительно представлены датасет EvoWorld-Data и бенчмарк EvoWorld-Bench для оценки реакции на события, причинности и согласованности при повторном обращении к сцене.'}, 'en': {'title': 'From Plausible Pixels to Causally Evolving Worlds', 'desc': 'The paper studies whether video models can simulate how a world changes after an event, rather than only generate realistic-looking frames. It introduces Out-of-Sight Causal Evolution, a task that tests whether models can infer event consequences and produce plausible outcomes, including when events happen outside the camera’s view. Its EvoWorld framework pairs a vision-language model that tracks world state and reasons about changes with a video renderer that generates the resulting scenes. New datasets and benchmarks support training and evaluation, and experiments show improved causal reactions and consistency while maintaining visual quality.'}, 'zh': {'title': '让视频模型不只生成画面，更懂世界如何因事件而变化', 'desc': '论文指出，生成式视频模型虽然能生成逼真的画面，却往往缺少对世界状态的持续追踪，也难以推断事件会如何影响其中的实体。为此，作者提出“视野外因果演化”任务，要求模型呈现事件、推理其后果，并生成因果合理的后续世界变化，即使变化发生在当前画面之外。作者提出 EvoWorld 框架，由视觉语言模型充当“世界大脑”，观察视频片段、维护不断演化的世界状态并推理状态转移，再由分段自回归视频生成器将推理结果呈现出来。作者还构建了 EvoWorld-Data 和 EvoWorld-Bench；实验表明，EvoWorld 能提升事件条件下的因果演化能力，同时保持画面质量与一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.35959', 'title': 'AgentBaton: Efficient Model Collaboration in Agentic Tasks', 'url': 'https://huggingface.co/papers/2610.35959', 'abstract': 'Abstract Capable-to-efficient model handoffs at suitable task stages preserve accuracy while cutting costs, and a lightweight detector, AgentBaton, achieves large API cost savings and extends the accuracy-cost Pareto frontier.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Solving long-horizon agentic tasks requires language agents to interact with their environments over multiple steps, and reliable performance often comes from the expensive capable models available through cloud providers. Meanwhile, alternative efficient models with inferior performance but a much lower cost are emerging, including lower-tier cloud models and smaller open-weights models deployable on local hardware. This raises a natural question that remains less explored than traditional query-level routing: can capable and efficient models collaborate within a single long-horizon agentic task to substantially reduce cost while preserving task accuracy? In this paper, we systematically investigate key design choices for such collaboration through model handoffs, where one model takes over from another, focusing on handoff direction and context transfer. We find that efficient-to-capable handoffs generally underperform capable-only execution with limited or even no cost reduction, whereas capable-to-efficient handoffs at suitable stages of task progress largely preserve or even improve accuracy while substantially reducing cost. These findings suggest that a one-time, simple, well-timed handoff strategy is good enough for cost-effective agent collaboration, motivating AgentBaton, a lightweight detector that learns when to hand off from recurring patterns in task progress. Across 11 model pairs and two representative benchmarks, AgentBaton reduces API costs by 65.9% on average while largely preserving task accuracy, with accuracy gains of up to 8.8 percentage points over capable-only execution. Experiments across various reasoning-effort settings further show that AgentBaton extends the empirical accuracy-cost Pareto frontier.', 'score': 3, 'issue_id': 3514, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': '91e23a1fbcd9791a', 'authors': ['Junlong Li', 'Jindong Jiang', 'Yonggan Fu', 'Jiarui Yao', 'Hanrong Ye', 'Wonmin Byeon', 'Peter Belcak', 'Hao Zhang', 'Pavlo Molchanov'], 'affiliations': ['The Hong Kong University of Science and Technology', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.35959.jpg', 'data': {'categories': ['#reasoning', '#agents', '#benchmark', '#optimization'], 'emoji': '🤝', 'ru': {'title': 'Вовремя переданная эстафета: мощная модель начинает, дешёвая завершает', 'desc': 'Статья исследует совместную работу мощных и эффективных LLM внутри одной долгой агентной задачи через передачу управления (model handoff). Авторы показывают, что передача от мощной модели к эффективной на правильном этапе выполнения сохраняет или даже повышает точность при значительном снижении стоимости API, тогда как обратный порядок обычно хуже. На основе этого предложен AgentBaton, лёгкий детектор, который обучается определять момент передачи по повторяющимся паттернам прогресса задачи. На 11 парах моделей и двух бенчмарках он снижает расходы на API в среднем на 65.9% и расширяет Парето-фронт точности и стоимости.'}, 'en': {'title': 'Hand Off at the Right Moment: Lower Costs, Stronger Agents', 'desc': 'This paper studies how capable, expensive language models can work with cheaper, less capable models during long agent tasks. It finds that handing off from a capable model to an efficient model at the right stage can cut costs while maintaining or improving accuracy. The authors introduce AgentBaton, a lightweight detector that uses patterns in task progress to decide when to hand off. Across 11 model pairs and two benchmarks, AgentBaton cuts API costs by an average of 65.9% and improves the accuracy-cost Pareto frontier.'}, 'zh': {'title': '把强模型用在关键阶段：AgentBaton 以更低成本完成长程任务', 'desc': '本文研究长程智能体任务中，能力较强但成本较高的模型与高效低成本模型如何协作。实验发现，在合适的任务阶段从强模型切换到高效模型，通常能大幅降低成本，同时保持甚至提升准确率；反向切换则往往效果有限。作者据此提出轻量级检测器 AgentBaton，它根据任务进展中的重复模式判断何时进行模型交接。在 11 组模型配对和两个基准测试中，AgentBaton 平均减少 65.9% 的 API 成本，准确率最高提升 8.8 个百分点，并拓展了准确率与成本之间的帕累托前沿。'}}}, {'id': 'https://huggingface.co/papers/2611.09382', 'title': 'Exploring Weight-Space Programming: Capabilities, Generalization, and Limitations', 'url': 'https://huggingface.co/papers/2611.09382', 'abstract': "Abstract Weight-Space Programming can improve reasoning performance through small, localized edits to neural network parameters, but its editing reliability and cross-task generalization remain uneven.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Weight-Space Programming (WSP) enables reasoning agents to directly inspect and modify neural network parameters, offering an alternative to gradient-based model adaptation. However, its capabilities, cross-task generalization, and practical limitations remain insufficiently understood. We systematically investigate WSP through 16 editing trajectories across seven benchmarks and two model scales (Qwen3.5-0.8B and Qwen3.5-9B). Our findings reveal three key insights. First, WSP can achieve substantial performance gains through highly localized interventions. On full held-out evaluations, accuracy improves by up to 29.45, 4.42, 36.72, and 17.11 percentage points on MATH-500, GPQA Diamond, IFEval, and SciBench, respectively. Notably, modifying only 1,023 parameters yields a 29.45-point improvement. Second, WSP exhibits promising but uneven cross-task generalization. A Math-edited checkpoint improves GPQA Diamond, IFEval, and SciBench by 3.03, 12.18, and 20.10 points, respectively, without further editing, while leaving SciCode performance unchanged. Third, effective editing remains challenging and inconsistent. Outcomes vary substantially across trajectories, and six of the 16 trajectories retain the original weights when candidate improvements cannot be reliably validated. Together, these results highlight WSP's potential for highly localized model adaptation while revealing important challenges in intervention discovery, reliability, and cross-task transfer.   Homepage: https://wsp-scope.github.io/ GitHub: https://github.com/WSP-Scope/WSP-Scope-Project", 'score': 3, 'issue_id': 3514, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'f6775a18d95dbabf', 'authors': ['Junru Hu', 'Cheng Tang', 'Wei Li', 'Hongze Zhu', 'Chun-Mei Feng', 'Qi Zhang', 'Yirong Chen', 'Ming Hu'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.09382.jpg', 'data': {'categories': ['#transfer_learning', '#benchmark', '#interpretability', '#optimization', '#open_source', '#training', '#reasoning', '#agents', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Точечные правки весов LLM могут заметно улучшить рассуждения, но пока ненадежно', 'desc': 'Статья исследует Weight-Space Programming (WSP) — подход, при котором агент напрямую изменяет параметры нейронной сети вместо градиентного дообучения. Авторы провели 16 траекторий редактирования на семи бенчмарках для моделей Qwen3.5-0.8B и Qwen3.5-9B. Показано, что изменение всего около 1 тысячи параметров может дать прирост точности до 29 п.п. на MATH-500, а также наблюдается перенос улучшений между задачами, например, с математики на GPQA и IFEval. При этом результаты редактирования нестабильны, а в шести из 16 траекторий веса оставляли без изменений, так как улучшения нельзя было надежно проверить.'}, 'en': {'title': 'Small Weight Edits, Big Gains—But Reliability Still Matters', 'desc': 'The paper studies Weight-Space Programming (WSP), a method that directly edits a neural network’s parameters rather than adapting it with gradient-based training. Across seven benchmarks and two model sizes, the researchers find that small, localized edits can substantially improve accuracy, including a 29.45-point gain on MATH-500 from changing only 1,023 parameters. Edits can also transfer to other tasks, but this cross-task generalization is uneven and does not help every benchmark. Results vary across editing attempts, showing that finding and validating reliable parameter edits remains a major challenge.'}, 'zh': {'title': '少量改动激发模型潜力，可靠迁移仍待突破', 'desc': '这项研究系统评估了权重空间编程（WSP）：推理智能体直接检查并修改神经网络参数，以适配模型，而不依赖梯度更新。研究在两个规模的模型、七个基准和16条编辑轨迹上进行实验，发现只修改少量参数也能显著提升多个任务的表现。经过数学任务编辑的模型还能在部分其他任务上取得收益，但跨任务迁移效果不均，有些任务没有改善。编辑结果在不同轨迹间差异很大，且部分候选修改无法可靠验证，说明提升编辑发现与验证的可靠性仍是重要挑战。'}}}, {'id': 'https://huggingface.co/papers/2611.06043', 'title': 'Confucius4-R2T2: A Stable-Prefix Streaming ASR Model for Real Real-Time Transcription', 'url': 'https://huggingface.co/papers/2611.06043', 'abstract': "Abstract A stable-prefix streaming speech recognition model achieves near full-context accuracy with low latency by post-training on longest stable prefix labels without architectural changes.  Generated by thinkingmachines/Inkling-Small Streaming speech recognition is increasingly consumed by machines, such as translators and voice agents, that act on each token as it appears. A token that is later revised costs wasted work or a wrong action. In this work, we present Confucius4-R2T2 (short for Real Real-Time Transcription), a stable-prefix streaming ASR model that never modifies its earlier output while maintaining high accuracy and low latency. R2T2 is obtained by post-training Qwen3-ASR-1.7B on 1,500 hours of Chinese and English audio while freezing its pre-trained audio encoder and projector. The adaptation is based on the concept of Longest Stable Prefix (LSP), a new notion that we introduce in this work. We prove that LSP is monotone under the prefix order, consistent with the full-audio output, and maximal among labels that equal a whole earlier output. Learning from LSP labels converts a full-context model into a stable-prefix streaming one without any architectural change. Extensive evaluations show that R2T2 brings streaming recognition close to the base model's full-context quality while delivering stable text with low emission lag. Its gains extend beyond the post-training languages, demonstrating a practical path from full-context ASR to stable streaming. We open-source the model weights and code at https://huggingface.co/netease-youdao/Confucius4-R2T2 and https://github.com/netease-youdao/Confucius4-R2T2.", 'score': 3, 'issue_id': 3514, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '5173acef7ab70331', 'pdf_title_img': 'assets/pdf/title_img/2611.06043.jpg', 'data': {'categories': ['#multilingual', '#optimization', '#open_source', '#audio', '#training', '#transfer_learning'], 'emoji': '🎙️', 'ru': {'title': 'Текст, который не переписывают: стабильное потоковое распознавание речи без потери точности', 'desc': 'Статья представляет модель Confucius4-R2T2 для потоковой системы распознавания речи (streaming ASR), которая никогда не изменяет уже выданный текст и при этом сохраняет высокую точность и низкую задержку. Модель получена дообучением Qwen3-ASR-1.7B на 1500 часах китайской и английской речи при замороженных аудиоэнкодере и проекторе, без изменения архитектуры. Ключевая идея — понятие Longest Stable Prefix (LSP), для которого авторы доказывают монотонность относительно порядка префиксов, согласованность с полным аудио и максимальность. Обучение на LSP-метках превращает полноконтекстную LLM-подобную модель в стабильную потоковую, а эксперименты показывают качество, близкое к базовой модели, и на языках, не входивших в дообучение.'}, 'en': {'title': 'Stream speech with stable words and near full-context accuracy', 'desc': 'The paper introduces Confucius4-R2T2, a streaming automatic speech recognition (ASR) model that outputs text without later revising earlier tokens. It post-trains a pre-trained model using Longest Stable Prefix (LSP) labels, while keeping the audio encoder and projector frozen and making no architectural changes. The authors show that LSP labels have useful consistency properties and enable a full-context model to learn stable streaming output. Evaluations find that the model approaches full-context recognition accuracy with low latency, and its improvements also extend to languages beyond those used in post-training.'}, 'zh': {'title': '让语音识别实时输出，生成后不再改写', 'desc': '本文提出 Confucius4-R2T2，一种低延迟的流式自动语音识别模型，它输出的文字一旦生成就不会再被修改。研究者在 1,500 小时中英文语音数据上对 Qwen3-ASR-1.7B 进行后训练，并冻结预训练的音频编码器和投影层。训练使用最长稳定前缀（LSP）标签；理论分析表明，LSP 随输入前缀增长而单调延伸，与完整音频识别结果一致，并且是符合条件的最长标签。实验显示，该方法无需改动模型架构，就能让流式识别准确率接近完整上下文模型，同时保持较低的输出延迟，效果也能推广到后训练所用语言之外。'}}}, {'id': 'https://huggingface.co/papers/2611.07461', 'title': 'The Last Mile to the Real World: Agent-Native Primitives as Reusable Building Blocks for Solving Real-World Tasks', 'url': 'https://huggingface.co/papers/2611.07461', 'abstract': "Abstract  How can an agent handle a real-world task end to end? Frontier models with their own harnesses still fall short on real-world benchmarks: on Terminal-Bench 4.0, GPT-5.6 Sol with Codex resolves 37.3% of the tasks and Claude Opus 5 with Claude Code 51.8%. These tasks fail at the step from reaching a resource to applying it, which we call the last mile to the real world. Existing approaches put the resource within reach but leave the competence to apply it with the caller, so each harness rebuilds that competence. We introduce agent-native primitives, reusable units that equip a resource with a resident LLM that applies it in context and communicates with other primitives, and HEELO (Harness Engineering around Evolving Agent-Native Primitives for the Last Mile to Real-WOrld Tasks), a harness engineering framework that builds each task's harness from a library of such primitives. HEELO composes the primitives a task needs into a task-specific graph, verifies the result against evidence from the environment, revises the primitives a failure implicates, and admits new or improved primitives after validation. We instantiate HEELO with eight primitive families, each built for one kind of task, and evaluate them on more than twenty benchmarks. Dev-Primitives raise Terminal-Bench 4.0 resolution from 37.3% under Codex to 55.5% on the same backbone, Harness Primitives composed per task raise Terminal-Bench 2.0 Pass@1 from 60.0% for the seed harness to 72.2%, Tool Primitives raise ToolBench pass rate from 55.8% to 75.1%, and Navigation Primitives raise GAIA-Text-103 accuracy from 45.6% to 58.3%. On the 46 real-world tasks of our heelo.dev platform, Claude Opus 5.5 with Claude Code and GPT-6.1 Sol with Codex complete 9 each on their own and 39 and 35 when connected to HEELO through our MCP server, with 1.9times and 2.3times less time and 1.55times lower cost per completed task.", 'score': 0, 'issue_id': 3514, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '8b409f14a13663d6', 'authors': ['Haibo Jin', 'Peng Kuang', 'Xiaopeng Yuan', 'Lucheng Fu', 'Jerry Wang', 'Xucheng Yu', 'Yaoning Yu', 'Dehao Wu', 'Runguo Li', 'Colin Su', 'Jingxuan Sun', 'Xuyang Liu', 'Haojing Luo', 'Haohan Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of Illinois Urbana-Champaign', 'heelo.dev'], 'pdf_title_img': 'assets/pdf/title_img/2611.07461.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#agi', '#architecture', '#agents'], 'emoji': '🧩', 'ru': {'title': 'Агент, который доводит реальную задачу до конца, собирая свой harness из примитивов', 'desc': 'Статья показывает, что современные LLM-агенты плохо справляются с реальными задачами, потому что не умеют применять найденные ресурсы, и предлагает HEELO, фреймворк инженерии harness. Он собирает harness под каждую задачу из библиотеки agent-native primitives, то есть переиспользуемых модулей, где каждому ресурсу приставлена резидентная LLM. Система строит граф примитивов, проверяет результат по данным среды, пересматривает проблемные примитивы и добавляет валидированные новые. Эксперименты на более чем двадцати бенчмарках и на платформе heelo.dev показывают заметный рост качества, скорости и снижение стоимости выполнения задач.'}, 'en': {'title': 'Give AI agents the skills to take the last mile', 'desc': 'The paper introduces agent-native primitives: reusable components that pair a resource with an LLM capable of using it and coordinating with other components. HEELO builds a task-specific harness by connecting relevant primitives into a graph, checking results against evidence from the environment, and improving primitives when failures reveal weaknesses. Across more than twenty benchmarks, this approach improves task completion in software development, tool use, navigation, and other settings. On real-world tasks, connecting existing AI agents to HEELO substantially increases completed tasks while reducing time and cost per task.'}, 'zh': {'title': '让每种资源自带会使用它的智能体，打通真实任务最后一公里', 'desc': '现实任务常常不是找不到资源，而是找到资源后，代理仍不会正确使用它，这就是通往真实世界的“最后一公里”。论文提出“智能体原生原语”：每个可复用单元都带有常驻大语言模型，能在具体情境中操作资源，并与其他原语协作。基于此，HEELO 会为任务组合专属原语图，根据环境证据检查结果，并在失败后改进相关原语。实验显示，这种方法在多项基准测试和真实任务中提升了完成率，同时减少完成任务所需的时间与成本。'}}}, {'id': 'https://huggingface.co/papers/2611.04434', 'title': 'Sketchpad: certified exact arithmetic with a small vision-language model', 'url': 'https://huggingface.co/papers/2611.04434', 'abstract': 'Abstract  Language models are accurate on most long-arithmetic problems, but their accuracy is estimated on samples and carries no guarantee for an unseen input; tool use is exact but moves the computation outside the network. We show that exactness at all input lengths becomes a finite, checkable property of a network when each of its steps reads only a bounded view of an external working memory. In Sketchpad, Qwen3.5-0.8B with a low-rank adapter executes arithmetic procedures on a rendered sheet. Each forward pass reads a three-cell view and emits one step: a digit, a carry or borrow, and the next operation. A fixed runtime moves the view and writes no digit of a result. We prove in Lean that the model is then exact on all inputs of any length if and only if it is exact on the finite set of views the runtime presents, that no finite test suffices when steps also read earlier steps, and that the guarantee tolerates bounded numerical perturbation and extends to compositions of procedures. All 2,446 views pass on the deployment device, a laptop GPU running the model in a web browser. The certified model performs signed addition and subtraction, long multiplication and division, square roots and greatest common divisors at arbitrary length. It solved 200 of 200 pre-registered problems in the browser, and 220 of 220 sums of up to 1,000 digits and products of up to 20 digits, of which GPT-6.1 Sol, the strongest of ten other models, solved 217. A symbolic runtime built on these procedures solves, expands and factors polynomials with every number computed by the model, and a multiplicative gate on the adapter recovers the base model exactly when the sheet is not in use.', 'score': 0, 'issue_id': 3514, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'b9012a2fcd105cd8', 'authors': ["Mostafa 'Neo' Mohsenvand"], 'affiliations': ['MIT Media Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.04434.jpg', 'data': {'categories': ['#benchmark', '#architecture', '#training', '#agents', '#small_models', '#math'], 'emoji': '🧮', 'ru': {'title': 'Точная арифметика на любой длине: проверяемость вместо надежды на выборку', 'desc': 'Авторы предлагают Sketchpad: языковая модель (LLM) Qwen3.5-0.8B с low-rank адаптером выполняет арифметические процедуры на внешнем «листе», читая на каждом шаге лишь ограниченное окно из трёх ячеек. Они доказывают в Lean, что точность модели на входах любой длины эквивалентна её корректности на конечном наборе проверяемых окон, что делает свойство точности верифицируемым. Гарантия устойчива к ограниченным численным возмущениям и распространяется на композиции процедур, а модель работает прямо в браузере на ноутбуке. На тестах она превосходит значительно более крупные модели, включая GPT-6.1 Sol, в операциях над длинными числами.'}, 'en': {'title': 'Prove Every View, Solve Arithmetic at Any Length', 'desc': 'The paper presents Sketchpad, a language model system that performs arithmetic by reading a small, fixed-size view of an external working memory and emitting one step at a time. The authors prove in Lean that the system is correct for inputs of any length if and only if it passes a finite set of runtime-generated views, provided each step cannot read earlier steps. They verify all 2,446 possible views and report strong results on long arithmetic, including problems with numbers up to 1,000 digits. The approach also supports composing arithmetic procedures and polynomial operations, while a gate lets the adapted model behave exactly like its original base model when the working sheet is unused.'}, 'zh': {'title': '把无限长度的算术精确性，化为有限视图的可验证保证', 'desc': '本文提出 Sketchpad，让语言模型通过读取外部工作表上的有限局部视图，逐步执行算术过程。模型每一步只读取三个单元格，并输出数字、进位或借位以及下一步操作；固定运行时负责移动视图和写入结果数字。作者在 Lean 中证明，只要模型在运行时可能呈现的所有有限视图上都正确，它就能对任意长度输入保持精确；若步骤还读取先前步骤，则有限测试无法提供同样保证。该方法还支持对数值扰动的容忍和过程组合，并在浏览器中通过了全部 2,446 个视图的检查，可执行任意长度的多种算术运算。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (6)', '#agi (2)', '#alignment', '#architecture (3)', '#audio (1)', '#benchmark (6)', '#cv', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability (1)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (1)', '#open_source (2)', '#optimization (5)', '#plp', '#rag', '#reasoning (4)', '#rl', '#rlhf', '#robotics', '#science', '#security', '#small_models (2)', '#story_generation', '#survey', '#synthetic', '#training (4)', '#transfer_learning (2)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-09 03:49',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-09 03:49')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-09 03:49')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
