    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        function toggleTheme() {

            const isDarkMode = body.classList.contains('dark-theme');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.21653', 'title': 'Molt: A Scalable PyTorch-Native Training Framework for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.21653', 'abstract': 'Abstract  Agentic reinforcement learning research is constant algorithm modification, new estimators, new pipeline stages, new rollout schemes, and in mainstream frameworks each change threads through layers of trainer, distributed backend, and rollout glue: the cost lands on the researcher at every iteration. Molt is a PyTorch-native training framework built to keep that cost small: a codebase compact and clean enough for a researcher to hold in their head, and for an AI coding assistant to read and reason about in its entirety, so the algorithm flow can be traced and changed end to end. The agent is an ordinary program, and one asynchronous loop trains multimodal and mixture-of-experts policies while never training on a token it did not generate, consistent in tokens, policy versions, and model semantics. Leanness does not cost performance: under a matched, fully asynchronous protocol, Molt is statistically comparable to a state-of-the-art Megatron-based stack. Molt is open source and provides recipes and containers at https://github.com/NVIDIA-NeMo/labs-molt.', 'score': 3, 'issue_id': 2764, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '972751777540b57c', 'authors': ['Jian Hu', 'Huiying Li', 'Hao Zhang', 'Binfeng Xu', 'Yifan Zhang', 'Shaokun Zhang', 'Hemil Desai', 'Michael Demoret', 'Pavlo Molchanov', 'Jan Kautz', 'Yi Dong'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.21653.jpg', 'data': {'categories': ['#agents', '#open_source', '#rl', '#training', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Простота и мощь: минималистичный фреймворк для исследований в reinforcement learning', 'desc': 'Molt — это PyTorch-фреймворк для обучения агентов с подкреплением, разработанный для минимизации накладных расходов при модификации алгоритмов. Фреймворк отличается компактной архитектурой, которую легко понять и модифицировать исследователю, позволяя полностью контролировать процесс обучения от начала до конца. Система обучает мультимодальные политики через асинхронный цикл, гарантируя консистентность токенов и версий модели, никогда не обучаясь на токенах, которые не сгенерировала сама политика. Несмотря на упрощенный дизайн, Molt показывает сравнимую с современными Megatron-based системами производительность при асинхронном протоколе обучения.'}, 'en': {'title': 'Molt: Simplifying Reinforcement Learning Training', 'desc': 'This paper introduces Molt, a new training framework for reinforcement learning that simplifies the process of algorithm modification and experimentation. It is designed to be compact and clean, allowing researchers to easily understand and modify the codebase while maintaining a clear flow of the algorithm. Molt supports training multimodal and mixture-of-experts policies in an asynchronous manner, ensuring that the agent only trains on data it has generated itself. Despite its simplicity, Molt achieves performance levels comparable to advanced frameworks like Megatron, making it a valuable tool for researchers in the field.'}, 'zh': {'title': 'Molt：简化强化学习训练的高效框架', 'desc': '这篇论文介绍了Molt，一个基于PyTorch的强化学习训练框架。Molt旨在简化算法修改和训练过程，使研究人员能够更轻松地管理代码和算法流。它支持多模态和专家混合策略的异步训练，并确保训练的一致性。Molt的性能与最先进的Megatron框架相当，同时保持代码的简洁性，适合开源共享。'}}}, {'id': 'https://huggingface.co/papers/2607.22529', 'title': 'Skill Self-Play: Pushing the Frontier of LLM Capability with Co-Evolving Skills', 'url': 'https://huggingface.co/papers/2607.22529', 'abstract': 'Abstract  LLM training is shifting from manual design and annotation to interaction-driven self-evolution. However, existing self-evolutionary methods face a fundamental dilemma between task diversity and verification reliability: environment-bound methods obtain precise feedback but confine learning to narrow domains, while open-ended self-generation broadens the task space but lacks reliable verification, allowing misleading rewards to pollute the training loop. We identify agent skills as a powerful middle ground to reconcile this tension: each skill ensures deep, verifiable execution in a specific scenario, while dynamic routing across skills maintains open-ended task variety. Leveraging this insight, we introduce Skill Self-Play (Skill-SP), a co-evolutionary framework comprising a proposer, a solver, and a dynamic skill controller. Orchestrated via a reinforcement learning loop, these components co-evolve in a continuous self-play loop: the proposer generates challenging tasks conditioned on dynamically sampled skills; the solver explores candidate solutions to push its capability boundaries; and the skill controller collects execution feedback to update and expand the skill library. This interactive co-evolution effectively bridges the gap between structured verification and open-ended exploration. Empirical evaluations on tool-use and reasoning benchmarks demonstrate that Skill-SP, serving as a robust evolution engine, consistently pushes the performance ceiling of competent backbones while catalyzing striking turnarounds for initially misaligned models. Our code is available at https://github.com/Qwen-Applications/skill-self-play.', 'score': 2, 'issue_id': 2764, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '50c8553c9332b2d4', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#reasoning', '#benchmark', '#open_source', '#rl', '#optimization', '#training'], 'emoji': '🎯', 'ru': {'title': 'Навыки как мост между структурированной проверкой и открытым исследованием в обучении LLM', 'desc': 'Статья представляет метод Skill Self-Play для самосовершенствования больших языковых моделей через взаимодействие, избегая дилеммы между разнообразием задач и надёжностью проверки. Система состоит из трёх компонентов: генератора задач, решателя и контроллера навыков, которые коэволюционируют в цикле обучения с подкреплением. Генератор создаёт сложные задачи на основе динамически выбранных навыков, решатель расширяет свои возможности, а контроллер собирает обратную связь для обновления библиотеки навыков. Экспериментальные результаты показывают, что метод эффективно улучшает производительность моделей на задачах с использованием инструментов и рассуждениями.'}, 'en': {'title': 'Bridging Task Diversity and Verification in LLM Training', 'desc': 'This paper discusses a new approach to training large language models (LLMs) called Skill Self-Play (Skill-SP). It addresses the challenge of balancing task diversity with reliable feedback during self-evolutionary learning. By introducing agent skills, the framework allows for deep execution in specific scenarios while maintaining a variety of tasks through dynamic routing. The co-evolutionary framework consists of a proposer, a solver, and a skill controller, which work together in a reinforcement learning loop to enhance model performance and adapt skills effectively.'}, 'zh': {'title': '技能自我游戏：平衡多样性与可靠性', 'desc': '本论文探讨了大规模语言模型（LLM）训练的自我进化方法，强调了任务多样性与验证可靠性之间的矛盾。现有方法在特定环境中获得精确反馈，但限制了学习的广度，而开放式自生成虽然扩展了任务空间，却缺乏可靠的验证机制。我们提出了技能自我游戏（Skill-SP）框架，通过动态技能路由在特定场景中确保深度可验证的执行，同时保持任务的多样性。实验结果表明，Skill-SP有效提升了模型性能，并为初始不匹配的模型带来了显著的改进。'}}}, {'id': 'https://huggingface.co/papers/2607.22042', 'title': 'LAMAR: An Open Language-Aware Multilingual Alignment Reranker', 'url': 'https://huggingface.co/papers/2607.22042', 'abstract': 'Abstract  In multilingual retrieval augmented generation, a retriever can retrieve relevant documents written in multiple languages, which are subsequently reranked before answer generation. However, it remains unclear whether existing multilingual rerankers consider document language when ordering semantically relevant candidates. Our analysis shows that these rerankers do not consistently prioritize documents written in the same language as the query when semantically equivalent documents are available across languages, even though document language can affect answer generation. We release LAMAR, a language aware multilingual cross encoder trained to account for both semantic relevance and language coherence. LAMAR first uses English anchored relevance distillation to establish consistent relevance scoring across multilingual inputs and then applies preference alignment for language coherence to encourage documents written in the same language as the query to receive higher rankings while retaining semantic relevance. In a controlled experiment designed to assess language coherence, LAMAR achieves the best performance overall and across all languages examined individually. LAMAR also remains competitive on established multilingual reranking benchmarks. In practical retrieval settings, LAMAR achieves the best results across all reported metrics when reranking candidates retrieved in the first stage. These results demonstrate that LAMAR accounts for language coherence while achieving strong performance on general multilingual reranking benchmarks.', 'score': 1, 'issue_id': 2764, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'd509368841508292', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rag', '#benchmark', '#open_source', '#low_resource', '#multilingual'], 'emoji': '🌍', 'ru': {'title': 'Языковая согласованность в многоязычном переранжировании документов', 'desc': 'В статье рассматривается проблема переранжирования документов в многоязычных системах поиска с дополнением контекстом. Авторы показывают, что существующие многоязычные ранжировщики не учитывают язык документа при упорядочении семантически эквивалентных результатов, что влияет на качество генерации ответов. Для решения этой проблемы предложена модель LAMAR — кроссэнкодер, обученный одновременно оценивать семантическую релевантность и языковую согласованность документов с запросом. Модель использует дистилляцию релевантности на английском языке и выравнивание предпочтений для поддержания высокого рейтинга документов на языке запроса, при этом сохраняя качество на стандартных бенчмарках многоязычного переранжирования.'}, 'en': {'title': 'LAMAR: Enhancing Multilingual Retrieval with Language Awareness', 'desc': 'This paper introduces LAMAR, a new model for multilingual retrieval augmented generation that improves how documents are ranked before generating answers. It highlights the importance of considering the language of documents when reranking, as documents in the same language as the query can enhance answer generation. The model uses a technique called English anchored relevance distillation to ensure consistent scoring of relevance across different languages. LAMAR outperforms existing models in terms of language coherence and maintains strong performance on standard multilingual benchmarks, making it effective for practical retrieval tasks.'}, 'zh': {'title': 'LAMAR：语言一致性的多语言重排序新方法', 'desc': '这篇论文介绍了一种多语言检索增强生成的方法，提出了LAMAR模型。LAMAR能够在考虑语义相关性的同时，优先考虑与查询语言一致的文档，从而提高答案生成的质量。研究表明，现有的多语言重排序器在处理语义相似的文档时，未能有效地优先考虑与查询语言相同的文档。通过实验，LAMAR在语言一致性和多语言重排序基准测试中表现出色，证明了其在多语言检索中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2607.22043', 'title': 'Scaling Native Multimodal Pre-Training From Scratch', 'url': 'https://huggingface.co/papers/2607.22043', 'abstract': 'Abstract  Although large language models (LLMs) exhibit remarkable reasoning capabilities, their reliance on text-only pre-training restricts the perception of the multimodal physical world. Native multimodal pre-training avoids this limitation by training models from scratch on multimodal inputs, thereby achieving deep cross-modal integration and mitigating optimization asymmetries inherent to traditional late-fusion architectures. Despite these advantages, the scaling properties of this paradigm remain systematically uncharacterized. To address this gap, we investigate the optimal model size and token count for training a transformer-based vision-language model under a fixed computational budget. We demonstrate that minimal objective loss adheres to a predictable compute law, whereas compute-optimal model sizes and token counts scale as power laws. Notably, language and multimodal objectives manifest distinct scaling behaviors. The language allocation law is largely invariant to the composition of the data, indicating stable language learning regardless of the multimodal data ratio. Conversely, the multimodal allocation law is highly sensitive to this composition. Specifically, text-heavy mixtures become compute-efficient only at larger model scales, shifting the optimal resource allocation toward greater model capacity. Additionally, by modeling the influence of data composition on compute laws and allocation exponents, we derive an efficiency frontier specifying precise configurations of model size, token count, and data mixture. Downstream evaluations further reveal that native multimodal pre-training induces positive cross-modal transfer, thereby enhancing pure-text spatial reasoning and enabling robust multimodal in-context learning. In summary, this empirical research establishes the essential groundwork for predictably scaling multimodal foundation models.', 'score': 1, 'issue_id': 2764, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '4626c84132ad7ced', 'authors': ['Haoyuan Wu', 'Aoqi Wu', 'Hai Wang', 'Jiajia Wu', 'Jinxiang Ou', 'Bei Yu'], 'affiliations': ['LLM Department, Tencent', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.22043.jpg', 'data': {'categories': ['#transfer_learning', '#multimodal', '#optimization', '#training', '#architecture'], 'emoji': '📊', 'ru': {'title': 'Законы масштабирования для мультимодальных моделей зрения-языка', 'desc': 'Исследование изучает оптимальные параметры масштабирования трансформер-моделей зрения-языка при обучении на мультимодальных данных с фиксированным вычислительным бюджетом. Авторы демонстрируют, что минимальная потеря целевой функции следует предсказуемому закону масштабирования вычислений, а оптимальные размеры модели и количество токенов масштабируются по степенным законам. Языковые и мультимодальные задачи показывают различное поведение при масштабировании, при этом состав данных влияет на распределение вычислительных ресурсов между ними. Исследование устанавливает фундаментальные принципы предсказуемого масштабирования мультимодальных foundation-моделей и подтверждает положительный эффект кросс-модального трансфера на качество обучения.'}, 'en': {'title': 'Unlocking the Power of Multimodal Learning for Enhanced Reasoning', 'desc': 'This paper explores the benefits of training large language models (LLMs) using multimodal inputs, which include both text and visual data. It identifies how the size of the model and the number of tokens affect performance under a fixed computational budget, revealing that optimal configurations follow specific scaling laws. The research shows that while language learning remains stable across different data compositions, multimodal learning is sensitive to the ratio of text to visual data. Ultimately, the findings provide a framework for efficiently scaling multimodal models, enhancing their reasoning capabilities across various tasks.'}, 'zh': {'title': '多模态预训练：提升模型能力的关键', 'desc': '这篇论文探讨了大型语言模型（LLMs）在多模态预训练中的应用。通过从头开始对多模态输入进行训练，模型能够实现深度的跨模态整合，克服传统后融合架构的优化不对称性。研究表明，模型的最佳规模和标记数量遵循特定的计算法则，且语言和多模态目标在扩展行为上存在显著差异。最终，这项研究为可预测地扩展多模态基础模型奠定了重要基础。'}}}, {'id': 'https://huggingface.co/papers/2607.22393', 'title': 'SceneActBench: Can Agents Act on the 3D Scenes They See?', 'url': 'https://huggingface.co/papers/2607.22393', 'abstract': 'Abstract  Vision-language model (VLM) agents increasingly use tools to act on 3D scenes rather than only describe them. Existing 3D benchmarks score textual responses or single-object operations, leaving agent action on complete multi-object 3D scenes under evaluated. We present SceneActBench, a benchmark for visually conditioned action across five 3D tasks under a unified agent-environment loop. Given PNG images or sampled video frames and, where applicable, supplied 3D assets, an agent acts on a 3D environment. We evaluate each final output against hidden ground truth with task-specific geometric metrics. SceneActBench comprises five tasks built from 210 source instances, yielding 520 task cases including paired input conditions. Every task runs through one fixed agent loop to keep the comparison fair. Across eleven proprietary VLM configurations, Overall scores span 38.6-50.2, and none performs consistently well across tasks. We further analyse where and how failures manifest.', 'score': 1, 'issue_id': 2764, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'c32d748e76057d39', 'authors': ['Yifei Zhao', 'Xiangxin Zhou', 'Wenhao Yang', 'Jiaqi Tang', 'Pu Jian', 'Huanjin Yao', 'Jiarui Yao', 'Haowei Lin', 'Chunchao Guo', 'Zhuo Chen', 'Wenkai Lyu', 'Jianzhu Ma', 'Xueqian Wang', 'Wenxi Zhu'], 'affiliations': ['HKUST', 'NJU', 'PKU', 'THU', 'Tencent Hunyuan', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2607.22393.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#3d', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Оценка способности визуально-языковых агентов действовать в трёхмерных сценах', 'desc': 'Работа представляет SceneActBench, первый бенчмарк для оценки мультимодальных моделей зрения и языка (VLM), которые используют инструменты для взаимодействия с трёхмерными сценами. В отличие от существующих датасетов, фокусирующихся на описании или единичных операциях, этот бенчмарк измеряет способность агентов выполнять сложные действия в многообъектных 3D окружениях. Бенчмарк содержит пять задач с 520 примерами, где агент принимает PNG-изображения или видеокадры и действует в единой схеме взаимодействия агента с окружением. Результаты показывают, что ни один из одиннадцати тестируемых VLM не демонстрирует стабильно хорошую производительность на всех задачах, указывая на необходимость улучшения моделей для работы с 3D сценами.'}, 'en': {'title': 'Evaluating VLM Agents in Complex 3D Environments', 'desc': 'This paper introduces SceneActBench, a new benchmark designed to evaluate vision-language model (VLM) agents in their ability to perform actions in complex 3D environments. Unlike previous benchmarks that focused on single-object tasks, SceneActBench assesses agents on five different tasks involving multiple objects, providing a more comprehensive evaluation of their capabilities. The benchmark uses a unified agent-environment loop and evaluates agent performance against hidden ground truth using geometric metrics tailored to each task. Results show that while various VLM configurations were tested, none achieved consistent success across all tasks, highlighting areas for improvement in future models.'}, 'zh': {'title': '提升3D场景中代理行为评估的基准测试', 'desc': '本文介绍了一种新的基准测试工具SceneActBench，用于评估视觉语言模型（VLM）在3D场景中的动作能力。现有的3D基准主要关注文本响应或单一物体操作，而忽视了多物体场景中的代理行为。SceneActBench包含五个任务，利用210个源实例生成520个任务案例，评估代理在3D环境中的表现。通过与隐藏的真实值进行比较，使用特定任务的几何指标来评估最终输出，结果显示不同VLM配置的表现差异明显。'}}}, {'id': 'https://huggingface.co/papers/2607.21848', 'title': 'Closing the Loop: Training-Free Revisit Consistency for Autoregressive Generative Rendering', 'url': 'https://huggingface.co/papers/2607.21848', 'abstract': 'Abstract  Recent conditional video generation models have shown promising potentials to transform 3D engine renderings, such as depth maps and untextured geometry, into photorealistic videos for gaming and immersive content creation. These applications require long-horizon auto-regressive generation that continuously synthesizes new frames while preserving a persistent 3D world. Auto-regressive generators synthesize video chunk by chunk with a bounded KV cache, so when the camera revisits a location after its context has been evicted, the model often regenerates inconsistent appearance, even though the conditioning renderings (e.g., depth) remain perfectly aligned with the underlying geometry.We address this revisit inconsistency without any post-training by exploiting correspondences the 3D engine already provides: temporal correspondence retrieves pose-matched historical latent chunks into the KV cache as loop-closure memory, while spatial correspondence from camera pose and depth reprojection biases token-level attention toward geometrically corresponding regions of the retrieved chunks. We demonstrate our method on loop-closure trajectories mined from TartanAir and TartanGround dataset to mirror complicate real-world application scenarios, where it outperforms existing training-free baselines on revisit consistency without losing overall video quality. Project Page: https://wenchao-m.github.io/ClosetheLoop.github.io/', 'score': 1, 'issue_id': 2764, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': 'd076d3e68ab77e42', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#3d', '#architecture', '#video'], 'emoji': '🔄', 'ru': {'title': 'Замыкание петли: консистентность видеогенерации при повторном посещении локаций', 'desc': 'В статье предлагается метод для улучшения качества авторегрессивного видеогенератора при повторном посещении камерой одного и того же места в сцене. Авторы используют трёхмерные соответствия, предоставляемые движком рендеринга: временные соответствия помещают прошлые скрытые представления в кэш памяти, а пространственные соответствия направляют внимание трансформера на геометрически соответствующие области. Метод работает без переобучения модели и демонстрирует улучшение консистентности видео при замыканиях петель на сложных траекториях. Подход протестирован на наборах данных TartanAir и TartanGround, которые моделируют реальные сценарии использования в видеоиграх и создании иммерсивного контента.'}, 'en': {'title': 'Enhancing Video Consistency in 3D Environments', 'desc': 'This paper presents a method to improve the consistency of video generation in 3D environments, particularly when the camera revisits previously rendered locations. It addresses the issue of inconsistent appearances in auto-regressive video generation by utilizing temporal and spatial correspondences from the 3D engine. The approach retrieves historical video chunks based on camera poses and depth information, allowing the model to maintain a coherent visual experience. The results show that this method enhances revisit consistency without compromising the overall quality of the generated videos, outperforming existing methods that require additional training.'}, 'zh': {'title': '提升视频生成的一致性与质量', 'desc': '最近的条件视频生成模型在将3D引擎渲染（如深度图和无纹理几何体）转化为逼真的视频方面展现了良好的潜力。这些应用需要长时间的自回归生成，持续合成新帧，同时保持一个持久的3D世界。我们通过利用3D引擎提供的对应关系来解决重访不一致性问题，使用时间对应关系将历史潜在块检索到KV缓存中作为循环闭合记忆。我们的实验表明，该方法在重访一致性方面优于现有的无训练基线，同时保持整体视频质量。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (3)', '#agi', '#alignment', '#architecture (3)', '#audio', '#benchmark (3)', '#cv', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource (1)', '#machine_translation', '#math', '#multilingual (1)', '#multimodal (2)', '#open_source (3)', '#optimization (2)', '#plp', '#rag (1)', '#reasoning (1)', '#rl (2)', '#rlhf', '#robotics', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (3)', '#transfer_learning (1)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-27 02:06',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-27 02:06')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-27 02:06')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
