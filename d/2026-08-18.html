    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.12898', 'title': 'NaviDC-OCR: Navigating Document Parsing Across Digital and Camera-Captured Documents', 'url': 'https://huggingface.co/papers/2608.12898', 'abstract': 'Abstract NaviDC-OCR is a unified vision-language framework that integrates deformation-aware learning, adaptive layout sampling, and decoupled content-structure training to improve document parsing accuracy and structural reasoning.  Generated by thinkingmachines/Inkling-Small Document parsing aims to transform unstructured documents into structured and machine-readable representations. Recent advances in Vision-Language Models (VLMs) have significantly advanced document parsing. However, existing approaches still face two major challenges. First, decoupled VLM-based methods heavily rely on accurate layout analysis, where geometric distortions in camera-captured documents can introduce cascading errors. Second, although end-to-end VLM-based methods alleviate the dependence on explicit layout detection, they often suffer from redundant generation, hallucinations, and insufficient structural reasoning in high-resolution scenarios. To address these challenges, we propose NaviDC-OCR, a unified framework for document parsing. NaviDC-OCR introduces deformation-aware learning to incorporate geometric perception into VLMs and proposes an adaptive sampling mechanism for complex layout representation. Furthermore, a content-structure decoupled learning strategy is developed to explicitly model formula grammars and table structures, enabling more effective structured representation learning. Extensive experiments demonstrate that NaviDC-OCR achieves state-of-the-art performance across diverse document parsing benchmarks. It obtains overall scores of 96.87, 88.53 and 78.41 on OmniDocBench v1.6, Wild-OmniDocBench, and PureDocBench, respectively, and ranks first in the ICDAR 2026 Sci-ImageMiner Challenge. These results validate the effectiveness and generalization capability of NaviDC-OCR in complex document parsing scenarios.', 'score': 3, 'issue_id': 3017, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '376616dc3b121c6e', 'authors': ['Peng Cai', 'Zhaofan Zou', 'Shifa Liu', 'Yikun Wang', 'Jiawei Tang', 'Kaicheng Yang', 'Meng Tong', 'Zhongjiang He', 'Hao Sun'], 'affiliations': ['China Telecom Artificial Intelligence Technology (Beijing) Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2608.12898.jpg', 'data': {'categories': ['#multimodal', '#hallucinations', '#cv', '#reasoning', '#benchmark'], 'emoji': '📄', 'ru': {'title': 'Восприятие деформаций и структурного анализа в документообороте через vision-language модели', 'desc': 'NaviDC-OCR — это единая архитектура на основе vision-language моделей для распознавания и структурирования документов. Система использует обучение с учётом деформаций для восприятия геометрических искажений в отсканированных документах и адаптивную выборку для представления сложных макетов. Фреймворк применяет отделённое обучение содержания и структуры, что позволяет более эффективно моделировать формулы и таблицы без избыточной генерации текста. Метод достигает лучших результатов на множестве бенчмарков и занял первое место в конкурсе ICDAR 2026.'}, 'en': {'title': 'Revolutionizing Document Parsing with NaviDC-OCR', 'desc': 'NaviDC-OCR is a new framework designed to improve the accuracy of document parsing by combining vision and language processing. It addresses challenges in existing methods, such as errors from layout analysis and issues with generating redundant or inaccurate content. The framework uses deformation-aware learning to better understand document layouts and an adaptive sampling method to handle complex structures. By separating content and structure in its training approach, NaviDC-OCR enhances the ability to represent documents accurately, achieving top performance in various benchmarks.'}, 'zh': {'title': 'NaviDC-OCR：提升文档解析的智能框架', 'desc': 'NaviDC-OCR 是一个统一的视觉-语言框架，旨在提高文档解析的准确性和结构推理能力。它结合了变形感知学习、自适应布局采样和内容-结构解耦训练，以应对现有方法在布局分析和高分辨率场景中的挑战。通过引入几何感知，NaviDC-OCR 能够更好地处理文档中的几何扭曲，并通过解耦学习策略有效建模公式语法和表格结构。实验结果表明，NaviDC-OCR 在多个文档解析基准测试中表现优异，验证了其在复杂文档解析场景中的有效性和泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2608.13900', 'title': 'Agentic Transaction: Towards ACID-Compliant Agent Systems', 'url': 'https://huggingface.co/papers/2608.13900', 'abstract': 'Abstract An ACID-compliant framework for agentic transactions introduces semantic guarantees to ensure reliable, isolated, and durable execution of long-horizon LLM agent workflows.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents are evolving from conversational assistants into autonomous systems that execute long-horizon tasks through reasoning, tool use, code generation, and workspace manipulation. As agents increasingly operate over persistent environments and multi-step workflows, they face challenges analogous to those addressed by transactional database systems: reliable execution, consistent outcomes, safe concurrency, and durable state management. We introduce the concept of an agentic transaction and propose an ACID-compliant agent system framework that reinterprets the classical ACID properties for agent execution through four semantic guarantees: Semantic Atomicity, Semantic Consistency, Semantic Isolation, and Semantic Durability. Together, these properties provide a principled foundation for building reliable agent systems despite model uncertainty and dynamic execution environments. To instantiate this framework, we develop an ACID-compliant data agent that realizes these guarantees through transactional exploration-execution-validation cycles, transactional skill hubs, confidence divergence-based validation, semantic dependency-aware isolation, and transaction-aware semantic state management. Experimental results on widely used benchmarks show that our system achieves a 10.6% improvement over state-of-the-art agents, including Claude Code. This work opens a broader research agenda on extending transactional principles and system architectures toward building trustworthy, scalable, and self-evolving AI agent systems.', 'score': 2, 'issue_id': 3017, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '5b067266cfc326da', 'authors': ['Zhaoyan Sun', 'Xiaoxiao Wang', 'Guoliang Li'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13900.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'Транзакционная надёжность для автономных LLM-агентов', 'desc': 'В статье представлена ACID-совместимая архитектура для агентов, основанных на больших языковых моделях, которая обеспечивает надёжное выполнение многошаговых задач. Авторы переносят классические свойства транзакций из систем баз данных на выполнение агентов через четыре семантических гарантии: атомарность, консистентность, изоляция и долговечность. Система реализует эти гарантии через циклы исследования-выполнения-валидации и семантическое управление состоянием агента. Экспериментальные результаты демонстрируют улучшение на 10,6% по сравнению с современными агентами, включая Claude Code.'}, 'en': {'title': 'Building Reliable AI Agents with ACID Transactions', 'desc': "This paper presents a new framework for managing long-term tasks performed by large language model (LLM) agents, ensuring they operate reliably and consistently. It introduces the concept of 'agentic transactions' that apply ACID properties—Atomicity, Consistency, Isolation, and Durability—to the execution of these agents. By implementing these properties, the framework addresses challenges like reliable execution and safe concurrency in dynamic environments. The proposed system shows significant performance improvements over existing agents, paving the way for more trustworthy and scalable AI systems."}, 'zh': {'title': '构建可靠自主代理的ACID框架', 'desc': '本文提出了一种符合ACID原则的框架，用于确保长时间跨度的LLM代理工作流的可靠、隔离和持久执行。随着LLM代理从对话助手演变为自主系统，它们在执行复杂任务时面临与事务数据库系统类似的挑战。我们引入了代理事务的概念，并提出了四个语义保证：语义原子性、语义一致性、语义隔离和语义持久性，以支持可靠的代理系统构建。实验结果表明，我们的系统在多个基准测试中比现有最先进的代理提高了10.6%的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.15265', 'title': 'VibeWorlding: Can Multimodal Agents Construct 3D Open Worlds End-to-End?', 'url': 'https://huggingface.co/papers/2608.15265', 'abstract': 'Abstract A unified framework benchmarks and trains multimodal agents that infer intent, plan 3D scenes, invoke tools, and reflect on feedback, revealing that reinforcement learning improves open-source models beyond closed-source frontiers.  Generated by thinkingmachines/Inkling-Small Constructing an interactive 3D open world from a user query is important. However, existing methods are primarily evaluated on idealized, simple queries, making it difficult to systematically analyze and compare how multimodal agents understand user intent, use 3D tools, and reason over textual and visual 3D world information. To this end, we propose VibeWorlding, a unified framework for benchmarking and training vibe worlding agents: a multimodal agent that can autonomously infer user intent, plan scene layout, invoke 3D tools, and reflect on the multimodal feedback in a multi-turn agent-environment interaction process. To achieve this, we first build VWE-BENCH, a benchmark of 2,616 high-quality 3D assets, 323 human-annotated seed 3D worlds, and 6,828 reverse-synthesized multimodal user queries, split into verified queries with ground-truth and unverified queries with carefully designed rubrics. Moreover, we develop VibeWorlding-Gym, a joint multimodal RL post-training framework that integrates (1) a sandbox environment unifying asset retrieval, editing, and image rendering as MCP tools, and (2) a rubric-based verifier that combines physical feasibility and intent fulfillment verification, supporting both fair model evaluation and scalable multimodal RL емых систем.'}, 'en': {'title': 'Empowering Multimodal Agents with Reinforcement Learning for 3D Scene Mastery', 'desc': 'This paper introduces VibeWorlding, a framework designed to benchmark and train multimodal agents capable of understanding user intent and manipulating 3D environments. It highlights the limitations of existing methods that only assess simple queries, making it hard to evaluate how well agents can interpret complex user requests. The authors present VWE-BENCH, a comprehensive dataset that includes 3D assets and user queries, which aids in training these agents. The findings suggest that reinforcement learning significantly enhances the performance of open-source models, allowing them to outperform some closed-source counterparts in 3D scene manipulation tasks.'}, 'zh': {'title': '强化学习助力多模态智能体超越边界', 'desc': '本文提出了一个统一框架VibeWorlding，用于基准测试和训练多模态智能体，能够推断用户意图、规划3D场景、调用工具并反思反馈。我们构建了VWE-BENCH基准，包含高质量的3D资产和多种用户查询，以便系统地分析多模态智能体的表现。研究表明，强化学习能够提升开源模型的性能，甚至超越封闭源模型的边界。实验结果显示，当前的前沿多模态语言模型在执行任务时仍存在瓶颈，而通过强化学习训练可以有效改善这一问题。'}}}, {'id': 'https://huggingface.co/papers/2608.15304', 'title': 'Understanding Cognition-Induced Risks in Agentic AI Systems', 'url': 'https://huggingface.co/papers/2608.15304', 'abstract': 'Abstract Agentic systems built on large language models pose escalating risks to human agency and autonomy across physical, social, and self-referential cognitive levels, requiring targeted mitigation strategies.  Generated by thinkingmachines/Inkling-Small Frontier agentic systems powered by large language models (LLMs) exhibit human-like patterns of cognition. As these systems become deeply integrated across different domains, their cognitive engagement raises critical concerns for human society that remain insufficiently studied. To address this gap, we systematically analyze risks induced by expanding cognitive capabilities, following a three-level framework defined by their cognitive scope, from physical cognition to social cognition, and finally to self-referential cognition. We study their potential risks to human agency, autonomy, and control capability, corresponding to each cognitive level. We finally propose strategies to mitigate these risks and enhance the controllability of agentic AI systems, ensuring their long-term safe development.', 'score': 1, 'issue_id': 3017, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': 'bf5a9daf1e81ac25', 'authors': ['Guanchu Wang', 'Qinuo Li', 'Mengnan Du', 'Xia Hu', 'Bowen Zhou'], 'affiliations': ['Beijing Institute of Technology', 'FIT - Institute of Science and Technology', 'IRET - Institute of Cognitive Science and Technologies, National Research Council', 'Sapienza University of Rome'], 'pdf_title_img': 'assets/pdf/title_img/2608.15304.jpg', 'data': {'categories': ['#alignment', '#ethics', '#security'], 'emoji': '⚠️', 'ru': {'title': 'Контроль и безопасность: трёхуровневая защита человеческой автономии от агентных LLM-систем', 'desc': 'В работе анализируются риски, которые создают агентные системы на основе больших языковых моделей для человеческой автономии и свободы воли. Авторы предлагают трёхуровневую классификацию этих рисков: физическое познание, социальное познание и самореферентное познание. Для каждого уровня исследуются потенциальные угрозы контролю человека и его способности принимать независимые решения. В статье также предлагаются стратегии смягчения рисков и повышения управляемости агентных AI-систем для обеспечения их безопасного развития.'}, 'en': {'title': 'Mitigating Risks of Agentic AI for Human Autonomy', 'desc': 'This paper discusses the risks associated with agentic systems that use large language models (LLMs) and their impact on human agency and autonomy. It identifies three levels of cognitive engagement: physical, social, and self-referential, each posing unique challenges to human control. The authors analyze how these systems can mimic human-like cognition and the potential dangers 300 parts and sequence lengths up to 256k tokens. This substantially extends the scale of part-aware 3D generation while preserving compositional structure and enabling fine-grained part-level control. Our method achieves higher mesh quality than baseline autoregressive and diffusion models, showing that compressed discrete part tokens improve not only scalability but also the achievable fidelity of generated geometry. These results suggest that LLM native token-efficient autoregressive modeling is a compelling alternative to diffusion for large-scale part-aware 3D generation. The project page is available at https://expmaster.github.io/megaparts_webpage.', 'score': 1, 'issue_id': 3017, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '62897c6618797415', 'authors': ['Manwen Liao', 'Xinyu Lian', 'Jian Mao', 'Kaixu Chen', 'Li Luo', 'Jinghao Yan', 'Wanshui Gan', 'Qiao Yu', 'Weitian Zhang', 'Chunhua Shen', 'Guang Chen', 'Bo Dai', 'Xudong Xu', 'Zhaoyang Lyu'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'The University of Hong Kong', 'Tongji University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14783.jpg', 'data': {'categories': ['#architecture', '#optimization', '#3d', '#long_context', '#training'], 'emoji': '🧩', 'ru': {'title': 'Экономные токены для генерации сложных многодетальных 3D объектов', 'desc': 'MegaParts представляет новый метод для генерации сложных 3D объектов, состоящих из множества семантических частей. Авторы разработали эффективный векторный квантизатор, который представляет геометрию отдельных частей в виде компактных дискретных токенов, адаптивно сокращая их количество в зависимости от сложности геометрии. На основе этого представления они обучили большую языковую модель генерировать структурированные последовательности, включающие ограничивающие рамки объектов и частей, а также токены форм, что позволяет обрабатывать объекты с сотнями деталей. Метод демонстрирует, что токен-эффективное авторегрессивное моделирование превосходит диффузионные модели по качеству геометрии и масштабируемости для генерации части-ориентированных 3D моделей.'}, 'en': {'title': 'Scalable 3D Generation with Part-Aware Precision', 'desc': 'MegaParts is a novel framework for generating 3D objects that are aware of their parts, which is crucial for applications like modeling and editing. It uses a token-efficient vector-quantized tokenizer to minimize the number of tokens needed while maintaining high-quality geometry. By employing structured autoregressive sequence modeling, it can handle complex objects with up to 300 parts and long sequences of up to 256k tokens. This approach not only improves scalability but also enhances the fidelity of the generated 3D models compared to traditional methods.'}, 'zh': {'title': 'MegaParts：高效的3D生成新方法', 'desc': 'MegaParts 是一种可扩展的自回归 3D 生成框架，旨在解决复杂物体生成中的挑战。它结合了结构化序列建模和高效的向量量化形状标记器，能够在保持高保真重建的同时，减少标记的使用。通过学习离散的潜在表示，MegaParts 可以适应几何复杂度进行动态长度的标记化。该方法在生成具有多达 300 个部分的物体时，显著提高了网格质量，并展示了其在大规模部分感知 3D 生成中的潜力。'}}}];

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-18 02:11',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-18 02:11')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-18 02:11')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
