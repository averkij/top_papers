тличается от успешности самих исправлений ошибок. Для решения проблемы авторы разработали агент аудита, который валидирует и улучшает объяснения, повышая их достоверность.'}, 'en': {'title': 'Enhancing Trust in LLM Agent Explanations with ExplainBench', 'desc': 'This paper discusses the growing use of Large Language Model (LLM) agents in software engineering, particularly in generating substantial code changes. As these agents produce more complex modifications, it becomes challenging for developers to manually review their outputs, prompting a need for reliable explanations of the changes made. The authors introduce ExplainBench, a benchmark designed to assess the quality of explanations provided by coding agents, focusing on their ability to clarify both the intended behavior of code and the impact of the changes. The study reveals that explanation quality is a crucial factor in evaluating agents, leading to the development of an explanation audit agent that enhances the trustworthiness of these explanations.'}, 'zh': {'title': '提升代码生成代理解释的可信度', 'desc': '大型语言模型（LLM）代理在软件工程中得到了快速应用。随着代理在代码生成中的作用越来越大，它们所做的更改也变得更加复杂，涉及数十到数百行代码。这使得手动审查代理结果变得越来越困难，因此开发者开始依赖解释来理解所做的更改。为了解决这一问题，我们提出了ExplainBench，一个用于自动评估编码代理生成的解释的基准，旨在提高解释的可信度。'}}}, {'id': 'https://huggingface.co/papers/2608.03874', 'title': 'ContinualSkillBench: Can LLM Agents Truly Evolve Their Capabilities?', 'url': 'https://huggingface.co/papers/2608.03874', 'abstract': 'Abstract  Modern agent frameworks equip large language models with external skill libraries to solve complex tasks. However, it remains unclear whether these systems can effectively evolve their skills and whether the resulting skills improve task-solving capabilities. To bridge this gap, we introduce ContinualSkillBench, a dynamic evaluation framework for in-context continual skill learning. It covers five representative domains, each containing 100 interconnected subtasks ordered by increasing difficulty and opportunities for cross-task skill reuse. Our experiments show that sequential execution generally improves performance, but the gains vary substantially across models and domains. Moreover, in-context learning performs comparably to explicit skill maintenance on average, suggesting that much of the improvement arises from adaptation to prior context and feedback rather than reusable skill abstraction alone. Explicit skills nevertheless provide selective benefits for tasks requiring reusable procedures or precise outputs. We further find that less capable models tend to accumulate larger, more fragmented collections of task-specific skills. These findings show that current in-context skill evolution mechanisms can support continual adaptation, but still struggle to consistently consolidate experience into robust and transferable skills.', 'score': 9, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'f80e382d2525e916', 'authors': ['Tianyi Guan', 'Yiding Wang', 'Haotong Yang', 'Siyuan Cao', 'Shirui Liu', 'Yi Hu', 'Jiaqi Li', 'Muhan Zhang'], 'affiliations': ['Beijing Institute for General Artificial Intelligence', 'Institute for Artificial Intelligence, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03874.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Эволюция навыков LLM: между адаптацией в контексте и обобщением знаний', 'desc': 'В этой работе авторы предложили ContinualSkillBench -框架для оценки способности большим языковым моделям эволюционировать свои навыки при решении последовательных задач. Эксперименты показали, что последовательное выполнение задач улучшает производительность, но прирост сильно варьируется в зависимости от модели и домена. Интересно, что обучение в контексте работает сравнимо с явным сохранением навыков, что указывает на важность адаптации к предыдущему контексту и обратной связи. Исследование выявило, что менее мощные модели накапливают больше фрагментированных, специфичных для конкретных задач навыков, а не обобщённые переиспользуемые процедуры.'}, 'en': {'title': 'Evolving Skills for Better Task Performance in Language Models', 'desc': 'This paper presents ContinualSkillBench, a framework designed to evaluate how well large language models can learn and adapt their skills over time. It examines five different domains with interconnected subtasks that increase in difficulty, allowing for the reuse of skills across tasks. The results indicate that while sequential task execution generally enhances performance, the effectiveness varies by model and domain. Additionally, the study reveals that in-context learning can be as effective as traditional skill maintenance, highlighting the importance of adapting to previous experiences and feedback.'}, 'zh': {'title': '持续技能学习的动态评估框架', 'desc': '现代智能体框架为大型语言模型提供外部技能库，以解决复杂任务。然而，这些系统是否能够有效地发展其技能，以及这些技能是否能提高任务解决能力，仍不清楚。为了解决这个问题，我们引入了ContinualSkillBench，这是一个动态评估框架，用于上下文中的持续技能学习。我们的实验表明，顺序执行通常能提高性能，但不同模型和领域的增益差异很大。'}}}, {'id': 'https://huggingface.co/papers/2608.01127', 'title': 'MiniWorld: Democratizing the Training of Video World Models from Scratch', 'url': 'https://huggingface.co/papers/2608.01127', 'abstract': 'Abstract  Video world models predict future observations conditioned on historical observations and control signals, enabling long-horizon generation through autoregressive state transitions. Unlike conventional video generation models that primarily capture visual appearance and motion, video world models learn the underlying dynamics governing environment evolution under agent actions, providing a foundation for embodied AI and interactive simulation. Recent progress has largely relied on adapting pretrained video generation models through post-training or distillation. Although effective, these approaches often require complex training pipelines, substantial computational resources, and suffer from the mismatch between bidirectional pretraining and causal streaming inference. Recent studies have shown that training autoregressive video world models from scratch is feasible and scalable. However, the community still lacks a lightweight, transparent, and fully reproducible baseline trainable end-to-end with modest computational resources. We present MiniWorld, a reproducible framework for training streaming video world models from scratch. MiniWorld employs a block-causal Video Diffusion Transformer trained with Flow Matching in the latent space of a pretrained Video VAE. Building on Diffusion Forcing, it adopts a chunk-wise non-decreasing noise schedule and two-stage continued training to improve temporal modeling and stability. During inference, MiniWorld combines a rolling KV cache with pipelined asynchronous denoising for efficient streaming generation under bounded computation. The entire model can be trained within several days on a single 8-GPU server. By releasing the training and inference codebase and pretrained checkpoints, we hope MiniWorld will facilitate future research on video world modeling.', 'score': 9, 'issue_id': 2852, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '032a32327f140658', 'authors': ['Yian Zhao', 'Ruochong Zheng', 'Hongcan Guo', 'Yu Yan', 'Jian Zhang', 'Jie Chen'], 'affiliations': ['Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01127.jpg', 'data': {'categories': ['#small_models', '#video', '#open_source', '#architecture', '#training', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Лёгкий базовый фреймворк для обучения потоковых видео моделей мира с нуля', 'desc': 'В статье представлена MiniWorld — фреймворк для обучения видео моделей мира с нуля, которые предсказывают будущие кадры на основе истории наблюдений и управляющих сигналов. Модель использует блочно-причинный Video Diffusion Transformer, обученный методом Flow Matching в скрытом пространстве предварительно обученного Video VAE. Авторы применяют Diffusion Forcing с кусочно-неубывающим графиком шума и двухэтапное обучение для улучшения моделирования временных зависимостей. Система оптимизирована для эффективного потокового генерирования с использованием rolling KV cache и асинхронного денойзинга, позволяя полностью обучить модель за несколько дней на одном сервере с 8 GPU.'}, 'en': {'title': 'MiniWorld: Simplifying Video World Model Training', 'desc': 'This paper introduces MiniWorld, a framework designed for training video world models from scratch, which predict future video frames based on past observations and control signals. Unlike traditional models that focus on visual aspects, MiniWorld emphasizes understanding the dynamics of environments influenced by agent actions, making it suitable for applications in embodied AI. The framework utilizes a block-causal Video Diffusion Transformer and incorporates techniques like Flow Matching and a unique noise schedule to enhance temporal modeling and stability. By providing a reproducible and efficient training process, MiniWorld aims to lower the barriers for researchers in the field of video world modeling.'}, 'zh': {'title': 'MiniWorld：轻量级视频世界模型训练框架', 'desc': '视频世界模型通过历史观察和控制信号预测未来观察，支持长时间生成。与传统视频生成模型不同，视频世界模型学习环境在代理行为下的动态演变，为具身人工智能和交互式模拟提供基础。尽管现有方法有效，但通常需要复杂的训练流程和大量计算资源。我们提出了MiniWorld，一个轻量级、透明且可完全复现的框架，能够从零开始训练流媒体视频世界模型。'}}}, {'id': 'https://huggingface.co/papers/2608.03700', 'title': 'When Agents Learn to Be You: Benchmarking Privacy Leakage, Impersonation Risk, and Defenses in Persona Skills', 'url': 'https://huggingface.co/papers/2608.03700', 'abstract': 'Abstract  Persona skills distill personal interaction histories into portable and executable artifacts for downstream agents. While enabling flexible personalization, this process concentrates fragmented personal signals, amplifies their impact through reuse, and challenges defenses designed for individual records or retrieval-based memory. To systematically investigate the safety of the persona-skill pipeline, we introduce AntiSkillBench, an end-to-end benchmark for evaluating risks and defenses across the persona-skill pipeline. It comprises: (i) a dataset of 7,500 persona-grounded dialogue traces, constructed from 50 behaviorally rich profiles spanning diverse task scenarios; (ii) an evaluation suite that measures skill-level privacy leakage and agent-level attribute disclosure and behavioral impersonation across three skill-distillation strategies; and (iii) a defense evaluation covering four configurations across online and post-hoc interventions, including active risk suppression and passive provenance protection. Experiments across three frontier agents show that persona-skill risks persist across agent backbones and distillation protocols, extending from explicit attributes to communication styles and personality traits. Existing defenses exhibit limited and distillation-dependent effectiveness, failing to generalize across risk and distillation strategies. These results highlight AntiSkillBench as a challenging benchmark for developing privacy-preserving and authenticity-aware persona skills.', 'score': 8, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'a4c6cb1c6a2abd4f', 'authors': ['Yongli Xiang', 'Zhifang Zhang', 'Bojun Yang', 'Ziming Hong', 'Lei Feng', 'Miao Xu', 'Tongliang Liu'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence', 'Southeast University', 'Sydney AI Centre, The University of Sydney', 'University of Queensland'], 'pdf_title_img': 'assets/pdf/title_img/2608.03700.jpg', 'data': {'categories': ['#leakage', '#training', '#ethics', '#benchmark', '#dataset', '#agents', '#security'], 'emoji': '🔒', 'ru': {'title': 'Безопасность персональных навыков: от оценки рисков к защите приватности', 'desc': 'В статье предлагается AntiSkillBench — комплексный бенчмарк для оценки безопасности при создании персональных навыков (persona skills), которые дистиллируют историю взаимодействия пользователя в переносимые артефакты для агентов. Бенчмарк включает датасет из 7500 диалогов, набор метрик для измерения утечек приватной информации и раскрытия атрибутов пользователя, а также оценку четырёх защитных механизмов. Экспериментальное исследование показывает, что риски персонализации распространяются на стиль коммуникации и черты характера, а существующие защиты имеют ограниченную эффективность. Работа подчёркивает необходимость разработки новых методов для создания приватных и аутентичных персональных навыков в системах с LLM.'}, 'en': {'title': 'Enhancing Privacy in Personalized AI Interactions', 'desc': 'This paper introduces AntiSkillBench, a benchmark designed to evaluate the safety of persona skills, which are tools that personalize interactions based on user history. It includes a dataset of 7,500 dialogue traces from diverse profiles to assess privacy risks and behavioral impersonation. The study reveals that risks persist across different agents and distillation methods, affecting both explicit attributes and communication styles. Additionally, existing defenses are shown to be limited in their effectiveness, emphasizing the need for improved privacy-preserving techniques in persona skill development.'}, 'zh': {'title': '构建安全的个性化技能评估基准', 'desc': '本文介绍了Persona技能如何将个人互动历史提炼成可移植的可执行工件，以便下游代理使用。这一过程虽然实现了灵活的个性化，但也集中化了分散的个人信号，并通过重用放大其影响，挑战了针对单个记录或检索记忆的防御机制。为系统性地研究Persona技能管道的安全性，本文提出了AntiSkillBench，这是一个用于评估Persona技能管道风险和防御的端到端基准。实验结果表明，现有的防御措施在不同的风险和提炼策略下效果有限，强调了开发保护隐私和真实性的Persona技能的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.00371', 'title': "Decoding Children's Gait Behavior", 'url': 'https://huggingface.co/papers/2608.00371', 'abstract': 'Abstract  We introduce a new problem domain for human action recognition: the fine-grained analysis of children\'s gait behaviors from standard RGB video. We specifically target the ambulatory patterns of children aged 3-17 years. Such behaviors arise naturally in the diagnosis and treatment of several critical developmental and neuromuscular disorders, such as cerebral palsy and hemiplegia. Despite their clinical value, current 3D sensor-based gait analysis systems are expensive, intrusive, and often impractical for young subjects. To address this, we introduce a new dataset comprising over 1,100 high-frame-rate (60 FPS) video sequences from 110 subjects, accompanied by synchronized, anonymized pose sequences. In each session, the child performs a 5-second "walk-around" task, capturing the gait cycle from multiple viewpoints. Crucially, we demonstrate that current state-of-the-art approaches, including gait foundation models and Multimodal Large Language Models (MLLMs), fail to effectively resolve these clinical nuances. We identify the key technical challenges in analyzing these erratic and subtle motor patterns and describe a unified end-to-end framework for decoding fundamental components of pediatric gait. Through comprehensive experimental results, we demonstrate the potential of this dataset to drive novel research questions and establish a rigorous baseline for automated child gait assessment.', 'score': 7, 'issue_id': 2852, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '2dfa2c0c88c1ff92', 'authors': ['Yifan Shen', 'Boyi Li', 'Meihuan Huang', 'Yuanzhe Liu', 'Xu Cao', 'Jinyang Jin', 'Zhengyuan Li', 'Anglin Liu', 'Junho Kim', 'Jingyuan Zhu', 'Lan Fangzhou', 'Jianguo Cao', 'Jintai Chen', 'Ismini Lourentzou', 'James Matthew Rehg'], 'affiliations': ['Hong Kong Polytechnic University', 'PediaMed AI', 'Shenzhen Childrens Hospital', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.00371.jpg', 'data': {'categories': ['#video', '#multimodal', '#cv', '#healthcare', '#dataset'], 'emoji': '👧', 'ru': {'title': 'Автоматическая диагностика нарушений походки у детей из видео', 'desc': 'В работе представлена новая задача распознавания действий человека — анализ особенностей походки детей в возрасте 3-17 лет из видео RGB высокого разрешения. Авторы создали датасет более чем из 1100 видеопоследовательностей с частотой 60 кадров в секунду, синхронизированный с данными о позах, что позволяет диагностировать нейромышечные расстройства вроде ДЦП и гемиплегии без дорогостоящих 3D-сенсоров. Показано, что современные модели, включая специализированные модели походки и Multimodal LLM, неэффективны для анализа тонких особенностей детской моторики. Авторы предложили единый end-to-end фреймворк для декодирования компонентов детской походки и установили базовые метрики для автоматизированной оценки.'}, 'en': {'title': 'Revolutionizing Child Gait Analysis with Standard Video', 'desc': "This paper presents a new approach to recognizing children's walking patterns using regular video instead of expensive 3D sensors. It focuses on children aged 3-17 and aims to help diagnose developmental disorders like cerebral palsy. The authors introduce a dataset with over 1,100 videos of children walking, which includes detailed pose information. They highlight the limitations of existing models in analyzing these subtle movements and propose a new framework to improve automated gait assessment for children."}, 'zh': {'title': '儿童步态行为的细致分析', 'desc': '本文介绍了一个新的研究领域：从标准RGB视频中细致分析儿童的步态行为。我们专注于3至17岁儿童的行走模式，这对于诊断和治疗一些关键的发育和神经肌肉疾病具有重要意义。尽管现有的3D传感器步态分析系统具有临床价值，但其成本高、侵入性强且不适合年轻受试者。为此，我们提出了一个新的数据集，包含110名受试者的1100多个高帧率视频序列，并展示了当前最先进的方法在分析这些细微运动模式时的局限性。'}}}, {'id': 'https://huggingface.co/papers/2607.28661', 'title': 'Are the Financial Reasoning from LLMs Credible? A Real World Test over Long-Horizon Statements', 'url': 'https://huggingface.co/papers/2607.28661', 'abstract': 'Abstract  Do Large Language Models (LLMs) possess genuine structural reasoning, or merely rely on surface-level pattern matching? The financial domain, demanding numerical precision and multi-step logic over long contexts, is an ideal testbed. Existing benchmarks fail to capture real-world industrial complexity, predominantly relying on multiple-choice questions or single-hop QA over cropped tables while ignoring intricate cross-statement dynamics and temporal de-cumulation.   To bridge this gap, we introduce FinIndices, a large-scale benchmark evaluating data-processing fidelity over uncropped financial statements (up to 32K tokens). Utilizing an automated synthesis pipeline with adversarial traps, FinIndices encompasses Single-Index computation and Table-Index tabulation to test complex domain, temporal, and caliber reasoning.   Our evaluation reveals two severe LLM vulnerabilities. First, a "Knowledge Bottleneck": despite memorizing formulas during pre-training, models demonstrate fragile pattern matching. Removing explicit formula hints causes performance to collapse (e.g., Gemini-3.1-Pro drops from 70.70% to 38.22% on table tasks), exposing fatal flaws in temporal de-cumulation and stock-flow caliber mismatch. Second, a "Structural Bottleneck": the intense cognitive load of generating multi-metric, multi-period tables actively drains reasoning capacity. Under structural pressure, LLMs that flawlessly execute isolated derivations regress to shallow heuristics, such as fetching incorrect adjacent columns or substituting deep accounting adjustments with lazy literal arithmetic. Finally, Supervised Fine-Tuning (SFT) yields substantial zero-hint gains (+8.54% Single, +3.82% Table), validating that structured logic can be partially restored via data-centric alignment.', 'score': 7, 'issue_id': 2853, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '6579bd8ee8ad482f', 'authors': ['Xinke Tong', 'Xuanming Zhang', 'Tianyi Tang', 'An Yang', 'Jiatu Hu', 'Guojie Lin', 'Zhenzhen Shi', 'Lingfeng Zeng', 'Boyu Yang', 'Bing Zhao', 'Hu Wei', 'Lin Qu', 'Dayiheng Liu'], 'affiliations': ['Alibaba Group', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28661.jpg', 'data': {'categories': ['#long_context', '#dataset', '#reasoning', '#interpretability', '#benchmark', '#training'], 'emoji': '📊', 'ru': {'title': 'Языковые модели не умеют считать: структурные пределы LLM в финансовом анализе', 'desc': 'Работа исследует, способны ли большие языковые модели (LLM) к настоящему структурному рассуждению или они полагаются только на поверхностное распознавание паттернов в финансовой области. Авторы создали FinIndices — крупномасштабный бенчмарк для оценки способности моделей обрабатывать данные из полных финансовых отчётов (до 32K токенов) с учётом сложной логики и временных зависимостей. Исследование выявило два критических недостатка: "Knowledge Bottleneck" — модели забывают формулы без явных подсказок, и "Structural Bottleneck" — когда требуется одновременно генерировать несколько метрик за несколько периодов, LLM переходят на поверхностные эвристики вместо глубокого логического анализа. Однако обучение с учителем (SFT) на структурированных данных позволяет частично восстановить способность моделей к корректному финансовому рассуждению.'}, 'en': {'title': 'Unveiling LLMs: Beyond Pattern Matching in Financial Reasoning', 'desc': "This paper investigates whether large language models (LLMs) can perform genuine structural reasoning in the financial domain, which requires precise numerical and logical processing. The authors introduce FinIndices, a new benchmark that tests LLMs on complex financial statements, addressing the limitations of existing benchmarks that focus on simpler tasks. The study identifies two main vulnerabilities in LLMs: a 'Knowledge Bottleneck' where models struggle without explicit formula hints, and a 'Structural Bottleneck' where the cognitive load of complex tasks leads to shallow reasoning. The results suggest that while LLMs can improve with supervised fine-tuning, they still face significant challenges in handling intricate financial reasoning."}, 'zh': {'title': '揭示大型语言模型的推理瓶颈', 'desc': '这篇论文探讨了大型语言模型（LLMs）在金融领域的结构推理能力。研究发现，现有的基准测试无法有效捕捉真实的工业复杂性，主要依赖于选择题和简单的问答。为此，作者提出了FinIndices，一个大规模基准，评估未裁剪的财务报表上的数据处理能力。结果显示，LLMs在多指标和多周期表格生成方面存在严重的知识和结构瓶颈，但通过监督微调可以部分恢复其结构逻辑。'}}}, {'id': 'https://huggingface.co/papers/2608.00730', 'title': 'Push-Wiper: Toward General-Purpose Robotic Cleaning across Varied Stains and Surfaces with Segmented Pushing Trajectories', 'url': 'https://huggingface.co/papers/2608.00730', 'abstract': 'Abstract  Viscous stains, characterized by high viscosity and complex rheological properties, remain a major challenge for robotic surface cleaning. Conventional wiping often spreads the stain, while scrubbing provides stronger friction but risks damaging the surface. In this paper, we propose Push-Wiper, a framework that reformulates viscous stain cleaning as an aggregation problem. Push-Wiper employs a sponge to progressively gather stains through segmented pushing trajectories, followed by a post-processing phase that detaches the aggregated material and enables sponge self-cleaning. We adopt a stepwise strategy for stain gathering and leverage Diffusion Policy to generate adaptive pushing action sequences. These sequences are executed through our Arbitrary Surface Pose Interpolator (ASPI) and a hybrid force-position controller, allowing the method to generalize to stains with diverse spatial distributions. Push-Wiper achieves a cleaning score (CS), defined as the percentage of stain area removed, up to 130% higher than baseline methods. Without additional training, Push-Wiper also transfers in a zero-shot manner to solid residues, liquid spills, unseen viscous stains, and curved surfaces with varying geometries. Our experiments demonstrate the cleaning effectiveness of Push-Wiper and its strong generalization ability. The project website is available at https://push-wiper.github.io/.', 'score': 6, 'issue_id': 2850, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '1a35fb8696037e25', 'authors': ['Renhao Lu', 'Mingxin Wang', 'Chenyang Cao', 'Yang Yang', 'Guoping Pan', 'Kangkang Dong', 'Yi Cheng', 'Houde Liu'], 'affiliations': ['Tsinghua Shenzhen International Graduate School, Tsinghua University, Shenzhen 518055, China', 'University of Toronto, Toronto M5S 1A1, Canada', 'Z-Lab, Zerith Robotics, Shenzhen 518055, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.00730.jpg', 'data': {'categories': ['#diffusion'], 'emoji': '🤖', 'ru': {'title': 'Агрегирующий подход к робототехнической чистке вязких загрязнений', 'desc': 'В работе предложена система Push-Wiper для решения задачи удаления вязких загрязнений с помощью робота. Авторы переформулируют проблему чистки как задачу агрегации, где губка постепенно собирает загрязнения через серию толчков по заданным траекториям. Для генерации адаптивных последовательностей действий толчков используется Diffusion Policy, а для управления роботом применяется гибридный контроллер сил и позиций. Система демонстрирует высокую эффективность и хорошую способность к обобщению, включая нулевую трансферную обучаемость на новые типы загрязнений и поверхности.'}, 'en': {'title': 'Revolutionizing Robotic Cleaning with Push-Wiper', 'desc': 'This paper introduces Push-Wiper, a novel framework designed to tackle the challenge of cleaning viscous stains using a robotic approach. It reformulates the cleaning process as an aggregation problem, where a sponge is used to gather stains through carefully planned pushing movements. The method incorporates a Diffusion Policy to adaptively generate action sequences for effective stain removal, and it utilizes an Arbitrary Surface Pose Interpolator (ASPI) for versatile application on various surfaces. Push-Wiper demonstrates significant improvements in cleaning efficiency, achieving up to 130% higher cleaning scores compared to traditional methods, while also showing strong adaptability to different types of stains and surfaces without requiring additional training.'}, 'zh': {'title': 'Push-Wiper：高效清洁粘性污渍的新方法', 'desc': '本论文提出了一种名为Push-Wiper的框架，用于清洁高粘度污渍。该方法将污渍清洁重新定义为聚合问题，通过分段推送轨迹逐步收集污渍，并在后处理阶段实现污渍的分离和海绵自清洁。Push-Wiper采用逐步策略和扩散策略生成自适应的推送动作序列，能够适应不同空间分布的污渍。实验结果表明，Push-Wiper的清洁效果显著优于传统方法，且具备良好的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2607.28993', 'title': 'ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts', 'url': 'https://huggingface.co/papers/2607.28993', 'abstract': 'Abstract  World Action Models (WAMs) have emerged as a promising paradigm by jointly modeling robot actions and future visual dynamics. However, their reliance on pixel-generative future supervision can entangle action-relevant state transitions with task-irrelevant visual content, limiting robustness under visual distribution shifts. We identify Training-Distribution Hallucination, a recurring phenomenon in which futures conditioned on visually shifted observations hallucinate training-domain content rather than remain faithful to the current scene. A controlled frame-triplet diagnosis further shows that DINOv3 features remain more stable across visual shifts while better preserving task-state distinctions than Wan-VAE latents. Rather than correcting the predicted futures, we propose Semantic-Temporal WAM (ST-WAM) to improve action robustness by using DINOv3 as a shared semantic representation for future prediction and history retrieval while retaining fine-grained VAE dynamics. Its Dual-Space Future Experts (DSFE) jointly predict future VAE latents and DINO features, while Current-Anchored Intent Retrieval (CAIR) retrieves task-relevant evidence from recent DINO history under the current visual-language context. ST-WAM is trained end-to-end without additional embodied pretraining or task-specific annotations, and requires no explicit future generation at inference. It achieves 98.7% on LIBERO and 92.8% on RoboTwin 2.0; more importantly, compared with Fast-WAM, it improves zero-shot LIBERO-Plus performance by 21.3 percentage points and more than doubles real-world success under visual shifts from 25.8% to 61.5%. These results demonstrate that semantic-temporal modeling effectively complements pixel-generative dynamics for robust manipulation.', 'score': 6, 'issue_id': 2850, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '8caceee5a317c598', 'authors': ['Mingxin Wang', 'Bin Hu', 'Bin Qian', 'Kaitao Jiang', 'Haoning Wu', 'Feng Yan', 'Bowen Jing', 'Ruiyang Hao', 'Enyi Wang', 'Kangning Niu', 'Yandan Yang', 'Mu Xu', 'Yan Wang', 'Houde Liu', 'Tianlun Li'], 'affiliations': ['AMAP-CV-LAB, Alibaba Group', 'Kings College London', 'Shanghai Jiao Tong University', 'The University of Manchester', 'Tsinghua University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28993.jpg', 'data': {'categories': ['#training', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Семантико-временные модели для устойчивого управления роботом', 'desc': 'В статье исследуются World Action Models (WAMs) — модели, которые совместно предсказывают действия робота и будущую визуальную динамику. Авторы выявили проблему Training-Distribution Hallucination, когда модель генерирует визуальное содержимое из обучающего распределения вместо адаптации к текущей сцене при визуальных сдвигах. Предложено решение ST-WAM, которое использует семантические признаки DINOv3 для стабильного представления задачи и VAE латенты для захвата динамики, комбинируя их через архитектуру Dual-Space Future Experts и механизм Current-Anchored Intent Retrieval. Метод достигает значительного улучшения робастности без дополнительного предобучения: на реальном роботе производительность возросла с 25.8% до 61.5% при визуальных сдвигах.'}, 'en': {'title': 'Enhancing Robot Action Predictions with Semantic-Temporal Modeling', 'desc': 'The paper introduces Semantic-Temporal World Action Models (ST-WAM), which enhance the robustness of robot action predictions by addressing the limitations of traditional pixel-generative future supervision. It identifies a problem called Training-Distribution Hallucination, where predictions based on altered visual inputs fail to accurately reflect the current scene. ST-WAM utilizes DINOv3 features for better semantic representation, allowing for improved future predictions and retrieval of relevant task information. The model is trained end-to-end without needing extra pretraining or specific annotations, achieving significant performance improvements in various benchmarks, especially under visual distribution shifts.'}, 'zh': {'title': '语义时间模型提升动作鲁棒性', 'desc': '世界动作模型（WAMs）通过联合建模机器人动作和未来视觉动态，展现出良好的前景。然而，它们依赖于像素生成的未来监督，这可能导致与任务无关的视觉内容干扰动作相关的状态转变，从而限制了在视觉分布变化下的鲁棒性。本文提出了语义时间WAM（ST-WAM），通过使用DINOv3作为共享语义表示来提高动作的鲁棒性，同时保留细粒度的变分自编码器（VAE）动态。ST-WAM在不需要额外的预训练或任务特定注释的情况下进行端到端训练，并在视觉变化下显著提高了实际成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.02218', 'title': 'PosterMELD: Multi-Agent Paper-to-Poster Generation for Controllable Design Diversity with Editable Print-Ready Outputs', 'url': 'https://huggingface.co/papers/2608.02218', 'abstract': "Abstract  Scientific poster construction compresses a long multimodal paper into a readable, editable canvas. Existing systems hide request-level failures by scoring only completed outputs; direct image generation is not element-editable, while coding-agent workflows are costly. PosterMELD is a template-conditioned multi-agent pipeline: capacity-aware slots guide writing before rendering, and deterministic gates plus vision-language model (VLM) review route failures to bounded repair. Each accepted request exports editable PowerPoint (PPTX) and Portable Network Graphics (PNG) artifacts; explicit design controls yield same-paper variants. Across 621 papers, Print-Ready Rate (PRR) counts requests passing geometric, readability, asset-integrity, and obvious-factual-error checks, with native editability reported separately. A frozen VLM assigns conditional Craftsmanship-Harmony-Expressiveness (CHE) scores to print-ready outputs. PosterMELD attains 81.3% PRR, 3.4 times P2P's rate and 5.2 times PosterGen's, and the highest conditional CHE among generated methods with multiple print-ready outputs. Native editability and explicit design controls are retained at a mean cost of USD 0.38 per request, 3.5% of Codex+Skill's. Code and resources are available at https://github.com/Shannon4Science/PosterMELD.", 'score': 4, 'issue_id': 2851, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e6151be63a22f410', 'authors': ['Haojie Hu', 'Chenhao Dang', 'Yaojia Liu', 'Hengrui Kang', 'Conghui He', 'Weijia Li'], 'affiliations': ['Renmin University of China', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'Tongji University', 'Tsinghua Shenzhen International Graduate School, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02218.jpg', 'data': {'categories': ['#open_source', '#science'], 'emoji': '🎨', 'ru': {'title': 'Автоматические научные постеры с гарантированной редактируемостью и высоким качеством', 'desc': 'PosterMELD — это мультиагентный конвейер для автоматического создания научных постеров из статей, использующий шаблоны и модели зрения-языка для направления потока работы. Система использует capacity-aware слоты и детерминированные проверки для маршрутизации ошибок на ограниченное восстановление, что позволяет избежать необратимых отказов, свойственных прямому генерированию изображений. Каждый успешный результат экспортируется в редактируемые форматы PowerPoint и PNG с явными элементами управления дизайном, позволяя создавать варианты одной статьи. Система достигла 81.3% процента готовых к печати постеров со стоимостью всего 0.38 доллара на запрос, превосходя существующие методы по качеству и редактируемости.'}, 'en': {'title': 'Transforming Papers into Editable Posters Efficiently!', 'desc': 'The paper introduces PosterMELD, a multi-agent system designed to create scientific posters from lengthy papers in a more efficient and editable manner. It utilizes a template-conditioned approach with capacity-aware slots to guide the writing process, ensuring that the final output is both readable and visually appealing. The system incorporates a vision-language model (VLM) to assess and improve the quality of generated outputs, achieving a high Print-Ready Rate (PRR) of 81.3%. Additionally, PosterMELD maintains native editability and design controls at a low cost, significantly outperforming existing methods in terms of efficiency and quality.'}, 'zh': {'title': '海报生成的智能化新方法', 'desc': 'PosterMELD 是一个基于模板的多智能体管道，用于将长篇多模态论文压缩成可读的海报。该系统通过容量感知的插槽引导写作，并使用确定性门和视觉语言模型（VLM）来处理失败请求。它能够导出可编辑的 PowerPoint 和 PNG 文件，并保持设计控制，生成不同版本的论文。PosterMELD 在 621 篇论文中实现了 81.3% 的打印准备率，显著高于其他方法，且每个请求的平均成本仅为 0.38 美元。'}}}, {'id': 'https://huggingface.co/papers/2608.01247', 'title': 'RestoreKV: Recovering Full-Cache Behavior Under Aggressive Query-Agnostic KV Cache Eviction', 'url': 'https://huggingface.co/papers/2608.01247', 'abstract': 'Abstract  Query-agnostic KV cache eviction compresses a context once and reuses the resulting cache for arbitrary future queries, but performance can collapse under tight budgets. Existing methods primarily improve which original KV pairs are retained. We introduce RestoreKV, which complements this selection-based formulation with learned restoration under the same total KV budget. Our key insight is that, although the information lost through eviction is context-specific, the mechanism for generating its compact complement can be shared across contexts. After context prefill, a few restore tokens attend to the full KV cache in a single LoRA-adapted pass, generating a compact, context-conditioned restore cache. The base importance scorer and eviction rule remain unchanged, and the adapters are disabled for all subsequent queries and decoding. RestoreKV is trained through parameter-efficient self-distillation from the frozen full-cache model, optimizing only 0.4% of the parameters and requiring no task-specific tuning. Across four backbones and four long-context benchmarks, RestoreKV substantially reduces compression-induced degradation. On Qwen3-4B, it improves 59 of 60 paired, budget-matched settings across five base eviction methods; at a 5% budget, it raises KVzip from 38.2 to 73.2 on RULER-4K. Applied to KVzip+, RestoreKV reaches 86.4 RULER accuracy at 16times compression on the KVPress Benchmark, while adding less than 0.5% one-time cache-construction overhead in a 32K-context evaluation. Our project page is available at https://paper.pnu-cvsp.com/RestoreKV/', 'score': 3, 'issue_id': 2854, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '46dcaefb5a8c760b', 'authors': ['Changwoo Baek', 'Seungjun Shin', 'Kyeongbo Kong'], 'affiliations': ['Pusan National University', 'Sookmyung Womens University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01247.jpg', 'data': {'categories': ['#long_context', '#optimization'], 'emoji': '💾', 'ru': {'title': 'Восстановление потерянной информации вместо просто её удаления из KV кэша', 'desc': 'RestoreKV — это метод сжатия KV кэша для больших языковых моделей, который улучшает качество работы при очень ограниченных бюджетах памяти. Вместо того чтобы только выбирать, какие пары ключ-значение сохранить, метод дополнительно обучает нейронную сеть восстанавливать потерянную информацию из контекста через специальные токены восстановления с использованием LoRA. Механизм восстановления универсален и обобщается на разные контексты, обучается через самодистилляцию с замораживанием исходной модели, требуя оптимизацию только 0,4% параметров. На практике RestoreKV значительно снижает деградацию производительности при сжатии, достигая 86,4% точности на бенчмарке RULER при 16-кратном сжатии кэша.'}, 'en': {'title': 'Enhancing KV Cache Efficiency with Learned Restoration', 'desc': 'The paper introduces RestoreKV, a novel approach to improve the efficiency of key-value (KV) cache eviction in machine learning models. Unlike traditional methods that focus solely on which KV pairs to keep, RestoreKV employs a learned restoration technique to recover lost information while maintaining a fixed budget. This method leverages shared mechanisms across different contexts to generate a compact restore cache after initial context prefill. The results show significant performance improvements across various benchmarks, demonstrating that RestoreKV can effectively reduce the degradation caused by compression in KV caches.'}, 'zh': {'title': 'RestoreKV：优化键值缓存的恢复机制', 'desc': '本文介绍了一种名为RestoreKV的新方法，用于在有限的键值（KV）缓存预算下优化信息恢复。与传统方法主要关注保留哪些原始KV对不同，RestoreKV通过学习恢复机制来补充选择过程，从而在相同的KV预算下提高性能。该方法利用上下文预填充后生成的恢复令牌，能够在一次LoRA适应的传递中生成紧凑的上下文条件恢复缓存。实验结果表明，RestoreKV在多个基准测试中显著减少了压缩引起的性能下降，提升了KVzip的准确性。'}}}, {'id': 'https://huggingface.co/papers/2608.03419', 'title': 'Multi-Task Multi-Frame Visual Piano Transcription', 'url': 'https://huggingface.co/papers/2608.03419', 'abstract': 'Abstract  Audio-based piano transcription performs well on onset, pitch, and velocity, but the sustain pedal lets sound persist long after key release, so audio systems predict pedal-extended offsets rather than physical key release. Yet existing Visual Piano Transcription (VPT) systems focus on onset detection from short video windows, offset accuracy lags onset by a wide margin, and note-level velocity has not been reported. To address these gaps, we present V2N (Video to Notes), the first complete VPT system: a shared temporal backbone feeds task-specific heads for onset, offset, key hold, and velocity, jointly trained with per-frame supervision rather than only at the window center. Ablations show that multi-task supervision enables offset and velocity prediction while improving onset accuracy; longer temporal context yields further improvements. V2N sets new state-of-the-art results on PianoVAM and R3.', 'score': 2, 'issue_id': 2853, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '981ff7ad9bd09a20', 'authors': ['Yonghyun Kim', 'Hoyeol Sohn', 'Juhan Nam', 'Alexander Lerch'], 'affiliations': ['Graduate School of Culture Technology, KAIST, South Korea', 'Music Informatics Group, Georgia Institute of Technology, USA'], 'pdf_title_img': 'assets/pdf/title_img/2608.03419.jpg', 'data': {'categories': [], 'emoji': '🎹', 'ru': {'title': 'От видео к музыке: полная визуальная транскрипция фортепиано', 'desc': 'В статье представлена V2N — первая полная система визуальной транскрипции фортепиано, которая предсказывает не только начало нот, но и их завершение, удержание педали и динамику. Система использует общий временной backbone с несколькими специализированными головками для каждой задачи, обученными с супервизией на каждом кадре. Авторы показали, что многозадачное обучение значительно улучшает точность предсказания окончания нот и силы звука, а увеличение временного контекста дает дополнительные улучшения. V2N достигает новых результатов на бенчмарках PianoVAM и R3.'}, 'en': {'title': 'V2N: Revolutionizing Piano Transcription with Video!', 'desc': 'This paper introduces V2N, a novel Visual Piano Transcription (VPT) system that improves the accuracy of detecting musical notes from video. Unlike previous systems that only focused on the onset of notes, V2N also predicts the offset, key hold duration, and velocity of each note. The system uses a shared temporal backbone with task-specific heads, allowing it to learn from the entire video frame sequence rather than just the center. The results show that V2N achieves state-of-the-art performance on benchmark datasets by leveraging multi-task learning and longer temporal context.'}, 'zh': {'title': 'V2N：视觉钢琴转录的新突破', 'desc': '这篇论文介绍了一种新的视觉钢琴转录系统V2N（Video to Notes），旨在解决现有系统在音符偏移和力度预测方面的不足。V2N通过共享时间骨干网络，结合任务特定的头部，能够同时预测音符的开始、结束、按键保持和力度。与传统方法不同，V2N采用逐帧监督的方式进行联合训练，从而提高了音符的准确性。实验结果表明，V2N在PianoVAM和R3数据集上达到了新的最先进水平。'}}}, {'id': 'https://huggingface.co/papers/2608.03994', 'title': 'When Attention Goes Blind: Numerical Failure in ALiBi Positional Encodings', 'url': 'https://huggingface.co/papers/2608.03994', 'abstract': "Abstract  We identify a previously overlooked failure mode of ALiBi positional encoding: its linear bias scaling underflows floating-point precision, which zeroes out a large fraction of attention weights and renders the affected attention heads partially blind. We analyze this failure mode, characterize its impact, and examine four mitigation strategies. We further demonstrate its occurrence in state-of-the-art pretrained models based on ALiBi. Comprehensive pretraining experiments with 148M-parameter decoder models help us to disentangle its effects from out-of-context degradation. We find that ALiBi's failure mode can substantially impair token retrieval while having only a minor effect on standard decoder benchmarks. We propose four training-time mitigation strategies and evaluate them individually and in combinations, finding that log-scaled distances yield the most consistent improvements in passkey retrieval. Despite this problem, default ALiBi slopes remain a surprisingly strong baseline, particularly for needle-in-a-haystack retrieval. Based on these findings we provide concrete recommendations on how to train models with ALiBi.", 'score': 2, 'issue_id': 2853, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '6cf99406cce40fb6', 'authors': ['Christopher Schröder', 'Lukas Gienapp', 'Ferdinand Schlatt', 'Martin Potthast', 'Gerhard Heyer'], 'affiliations': ['Institute for Applied Informatics at Leipzig University (InfAI)', 'ScaDS.AI Dresden/Leipzig', 'Seltz', 'University of Kassel', 'hessian.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.03994.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training', '#long_context'], 'emoji': '🔍', 'ru': {'title': 'Потеря точности в ALiBi: как спасти внимание модели от численного подтопления', 'desc': 'В статье выявлен ранее неизвестный недостаток позиционного кодирования ALiBi: линейное масштабирование смещения приводит к потере точности в вычислениях с плавающей точкой, что обнуляет значительную часть весов внимания и делает некоторые головки внимания частично неработающими. Авторы анализируют этот дефект, оценивают его влияние на модели и предлагают четыре стратегии его устранения. Проведены обширные эксперименты предобучения с моделями-декодерами размером 148M параметров, которые помогли разделить эффекты этого дефекта от других проблем. В результате исследования предложены конкретные рекомендации по обучению моделей с ALiBi и выявлено, что логарифмическое масштабирование расстояний дает наиболее стабильные улучшения в задачах поиска токенов.'}, 'en': {'title': "Mitigating ALiBi's Blindness: Enhancing Attention in Models", 'desc': "This paper discusses a problem with ALiBi positional encoding in machine learning models, where its linear bias scaling can lead to floating-point precision issues. This results in many attention weights being set to zero, causing some attention heads to become less effective, or 'blind'. The authors analyze this issue, explore its effects on model performance, and suggest four strategies to mitigate the problem. Their experiments show that while ALiBi can hinder token retrieval, it still performs well in certain tasks, leading to recommendations for better training practices."}, 'zh': {'title': '解决ALiBi编码的失败模式，提升模型性能', 'desc': '本文识别了ALiBi位置编码的一种被忽视的失败模式：其线性偏差缩放导致浮点精度下溢，从而使大量注意力权重归零，导致受影响的注意力头部分失明。我们分析了这种失败模式，描述了其影响，并研究了四种缓解策略。通过对148M参数解码器模型的全面预训练实验，我们发现ALiBi的失败模式会显著影响令牌检索，但对标准解码器基准测试的影响较小。我们提出了四种训练时的缓解策略，并评估了它们的单独和组合效果，发现对数缩放距离在检索性能上提供了最一致的改善。'}}}, {'id': 'https://huggingface.co/papers/2608.02791', 'title': 'Better, Stronger, Faster, and Broader: Structured All-Mask Prediction for MLLM-Based Segmentation', 'url': 'https://huggingface.co/papers/2608.02791', 'abstract': "Abstract  MLLM-based segmentation faces a core segmentation trilemma: high segmentation performance, preserved dialogue ability, and fast inference. Embedding-prediction methods may disrupt language modeling through pixel-level objectives, whereas next-token generation is inefficient for dense masks. We propose All-Mask Prediction, decoupling autoregressive dialogue from non-autoregressive mask prediction. Its binary instantiation, STAMP (Simultaneous Textual All-Mask Prediction), emits an in-vocabulary <SEG> trigger, fuses image-aligned mask tokens with corresponding patch features, and uses hybrid attention to classify all tokens as foreground or background in one pass. It thereby combines strong referring and reasoning segmentation with preserved multimodal ability and efficient inference. However, binary masks cannot retain multiple semantic or instance identities without repeated target-specific predictions. We therefore propose Structured All-Mask Prediction and develop STAMPlus. It generates a target list with explicit IDs and optional boxes, binds these IDs to a shared multi-class mask space, and jointly predicts all targets in one non-autoregressive pass. A single unified checkpoint retains STAMP's referring and reasoning capabilities while extending to open-vocabulary semantic, instance-aware, and remote-sensing small-target segmentation, where high-resolution mask-token scaling preserves finer spatial evidence. Across these settings, STAMPlus achieves state-of-the-art segmentation performance, preserves general multimodal instruction following, and reduces 12-category latency from 13.50s for repeated STAMP inference to 5.16s. Further analyses show that accurate target cues improve segmentation and learned spatial grounding benefits look-twice reasoning. Overall, STAMPlus resolves the trilemma beyond single-target prediction.", 'score': 2, 'issue_id': 2853, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'ba82e8799bc6185a', 'authors': ['Jiazhen Liu', 'Mingkuan Feng', 'Long Chen'], 'affiliations': ['The Hong Kong University of Science and Technology (HKUST)'], 'pdf_title_img': 'assets/pdf/title_img/2608.02791.jpg', 'data': {'categories': ['#multimodal', '#cv', '#inference'], 'emoji': '🎭', 'ru': {'title': 'Единая маска для всех: преодоление триллеммы в сегментации мультимодальных моделей', 'desc': 'Статья предлагает решение для многомодальных больших языковых моделей (MLLM), которые одновременно должны выполнять сегментацию изображений, поддерживать диалоговые способности и работать быстро. Авторы разделяют аутогрессивное предсказание текста от неаутогрессивного предсказания масок, предложив метод All-Mask Prediction с двумя реализациями: STAMP для двоичной маски и STAMPlus для многокласовой структурированной сегментации. STAMPlus генерирует список целевых объектов с ID и опциональными ограничивающими прямоугольниками, затем предсказывает все маски в один проход через совместный гибридный механизм внимания. Модель достигает лучших результатов в различных задачах сегментации (семантической, инстансной и для отслеживания малых объектов на спутниковых снимках) при сохранении способности следовать инструкциям и ускорении вычислений в 2.6 раза.'}, 'en': {'title': 'Revolutionizing Segmentation: Fast, Accurate, and Multimodal!', 'desc': 'This paper addresses the challenges in machine learning-based segmentation, specifically the balance between high performance, dialogue capability, and fast inference. The authors introduce All-Mask Prediction, which separates the tasks of dialogue generation and mask prediction to improve efficiency. They present STAMP, a method that uses a special trigger to classify image segments in one go, enhancing both segmentation quality and speed. The advanced STAMPlus further refines this by allowing for multiple target identities in a single prediction pass, achieving state-of-the-art results while maintaining multimodal functionality and significantly reducing processing time.'}, 'zh': {'title': '解决分割三难问题的全新方法', 'desc': '本文提出了一种新的分割方法，称为结构化全掩码预测（Structured All-Mask Prediction），旨在解决高分割性能、对话能力保持和快速推理之间的矛盾。通过引入目标列表和共享多类掩码空间，STAMPlus能够在一次非自回归的推理中同时预测多个目标。该方法在保持多模态能力的同时，显著提高了分割性能，并将推理时间从13.50秒减少到5.16秒。最终，STAMPlus超越了单目标预测的限制，实现了更高效的语义和实例分割。'}}}, {'id': 'https://huggingface.co/papers/2608.03507', 'title': 'ChronoLens: Measuring Language Change Across Time, Languages, and Linguistic Levels', 'url': 'https://huggingface.co/papers/2608.03507', 'abstract': 'Abstract  Historical language change affects morphology, syntax, semantics, and pragmatics, yet computational studies typically examine these levels with incompatible representations and therefore cannot determine whether they evolve together across languages. We address this problem by asking how the magnitude and direction of change vary across linguistic levels, languages, and historical periods within a single analytical space. We introduce ChronoLens, a framework that combines frozen multilingual language models, feature-aligned crosscoders, and post-hoc linguistic interventions, and apply it to 44.98 million documents and approximately 17.2 billion tokens from five parliamentary traditions spanning 1803--2026. The resulting sparse representations agree substantially more strongly with linguistic statistics than dense embeddings or a pooled sparse autoencoder (ρ=0.72 versus 0.29 and 0.28), and reveal that morphology, syntax, semantics, and pragmatics generally change by comparable amounts within a language, while languages differ markedly in when, how far, and in which direction they change. These findings show that historical language change is a structured, multidimensional process: similar magnitudes can conceal different trajectories, and meaningful cross-linguistic comparison requires measuring both distance and direction.', 'score': 1, 'issue_id': 2854, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'b8d62183d29d2723', 'authors': ['Gagan Bhatia', 'Julian Schlenker', 'Simone Paolo Ponzetto', 'Steffen Eger'], 'affiliations': ['University of Mannheim', 'University of Technology Nuremberg'], 'pdf_title_img': 'assets/pdf/title_img/2608.03507.jpg', 'data': {'categories': [], 'emoji': '⏳', 'ru': {'title': 'Многомерный анализ исторической эволюции языка через замороженные модели', 'desc': 'В работе предложена система ChronoLens для изучения исторических изменений языка на разных уровнях анализа: морфологии, синтаксисе, семантике и прагматике. Авторы использовали замороженные многоязычные языковые модели и специальные методы кодирования для анализа 44.98 миллионов документов из пяти парламентских традиций с 1803 по 2026 год. Полученные разреженные представления показали гораздо более сильную корреляцию с лингвистическими статистиками, чем плотные эмбеддинги. Исследование доказывает, что языковые изменения – это структурированный многомерный процесс, где разные языки развиваются по-разному во времени, и для корректного сравнения необходимо измерять как величину, так и направление изменений.'}, 'en': {'title': 'ChronoLens: Unraveling the Dimensions of Language Change', 'desc': 'This paper introduces ChronoLens, a novel framework designed to analyze historical language change across multiple linguistic levels such as morphology, syntax, semantics, and pragmatics. By utilizing frozen multilingual language models and feature-aligned crosscoders, the framework allows for a comprehensive examination of language evolution over time and across different languages. The study analyzes a vast dataset of nearly 45 million documents, revealing that while different languages change in distinct ways, the magnitude of change is often comparable across linguistic levels. The findings emphasize the importance of considering both the distance and direction of change for meaningful comparisons in historical linguistics.'}, 'zh': {'title': '揭示历史语言变化的多维结构', 'desc': '这篇论文探讨了历史语言变化对形态学、句法学、语义学和语用学的影响。研究提出了ChronoLens框架，结合了多语言模型和特征对齐的跨编码器，分析了来自五个议会传统的文档数据。结果表明，语言的不同层面在变化幅度上通常是相似的，但不同语言在变化的时间、程度和方向上存在显著差异。研究表明，历史语言变化是一个结构化的多维过程，跨语言比较需要同时考虑变化的距离和方向。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (8)', '#agi', '#alignment', '#architecture (4)', '#audio (1)', '#benchmark (11)', '#cv (4)', '#data', '#dataset (6)', '#diffusion (7)', '#ethics (1)', '#games', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (3)', '#interpretability (2)', '#leakage (1)', '#long_context (3)', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (10)', '#open_source (6)', '#optimization (6)', '#plp (1)', '#rag', '#reasoning (2)', '#rl (2)', '#rlhf (1)', '#robotics (1)', '#science (1)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#training (12)', '#transfer_learning', '#video (6)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-05 15:10',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-05 15:10')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-05 15:10')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
