    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.28956', 'title': 'MerchantBench: Benchmarking LLM Agents for Long-Term Coherence in E-Commerce Operations', 'url': 'https://huggingface.co/papers/2607.28956', 'abstract': 'Abstract  Large language model agents are increasingly evaluated as autonomous tool users, yet most benchmarks focus on bounded tasks with immediate success criteria. Real-world deployments often require Long-Term Coherence, the capacity to preserve purposeful behavior across extended horizons while adapting decisions to accumulated evidence. Evaluating this capacity requires a persistent environment in which actions constrain future choices, feedback arrives at heterogeneous delays, and incoherent behavior produces measurable cumulative effects. Seller-side e-commerce provides a suitable setting for this evaluation through recurrent and interdependent decisions over Product Sourcing, Listing and Pricing Control, Cash-Flow Management, and Mixed-Latency Feedback Adaptation. We introduce MerchantBench, a 365-day order-level simulation grounded in 98,843 real e-commerce product records and equipped with 26 tools for agent interaction. MerchantBench couples promptly observable Upstream Supplier Events with delayed Downstream Order Outcomes, requiring agents to follow individual order lifecycles and revisit earlier decisions. We evaluate eight LLMs under two agent frameworks in 48 runs, each spanning 365 simulated days. Our results reveal a substantial gap between even the latest LLMs and human participants, with the best LLM configuration attaining only 27.3\\% of the mean final net assets achieved by human participants.', 'score': 80, 'issue_id': 2850, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '02c84a448e507007', 'authors': ['Qiming Shi', 'Yulong Tao', 'Linbo Jin', 'Zhaolu Kang', 'Yibo Dou', 'Jiawen Zhu', 'Tianjun Pan', 'Shaokang Fu', 'Chengyu Wang', 'Siyue Li', 'Yaping Cheng', 'Di Weng', 'Chengfu Huo'], 'affiliations': ['Alibaba Group', 'College of Computer Science and Artificial Intelligence, Fudan University', 'School of Software Technology, Zhejiang University', 'School of Software and Microelectronics, Peking University', 'State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28956.jpg', 'data': {'categories': [], 'emoji': '🏪', 'ru': {'title': 'Долгосрочная согласованность агентов LLM в сложных многошаговых задачах', 'desc': 'В работе представлена MerchantBench — бенчмарк для оценки способности больших языковых моделей (LLM) к долгосрочной согласованности поведения в реальных условиях. Авторы создали 365-дневную симуляцию e-commerce с использованием 98,843 реальных товаров, где агенты должны принимать взаимозависимые решения по закупкам, ценообразованию и управлению денежными потоками. Симуляция учитывает асинхронную обратную связь с различными задержками, требуя от агентов отслеживать жизненные циклы заказов и пересматривать ранние решения. Результаты показали значительный разрыв между современными LLM и человеческими участниками: лучшая конфигурация модели достигла только 27,3% от среднего размера активов людей.'}, 'en': {'title': 'Evaluating Long-Term Decision Making in LLMs with MerchantBench', 'desc': 'This paper discusses the evaluation of large language model (LLM) agents as autonomous tool users in real-world scenarios, particularly focusing on their ability to maintain Long-Term Coherence. It highlights the limitations of current benchmarks that only assess immediate task success, emphasizing the need for evaluations that consider the impact of decisions over time. The authors introduce MerchantBench, a simulation environment that mimics e-commerce operations, allowing for the assessment of LLMs in a setting with recurrent and interdependent decision-making. The study finds that even the best-performing LLMs fall significantly short of human performance in managing complex, long-term tasks.'}, 'zh': {'title': '评估大型语言模型的长期一致性能力', 'desc': '这篇论文探讨了大型语言模型（LLM）在自主工具使用中的表现，特别是在需要长期一致性的任务中。研究表明，现实世界的应用需要模型在长时间内保持目标导向的行为，并根据累积的证据调整决策。作者提出了MerchantBench，这是一个基于真实电子商务产品记录的365天订单级模拟环境，旨在评估LLM在复杂决策中的表现。实验结果显示，最新的LLM与人类参与者之间存在显著差距，最好的LLM配置仅达到人类参与者平均最终净资产的27.3%。'}}}, {'id': 'https://huggingface.co/papers/2608.03974', 'title': 'JoyAI-Video-Edit: Real-Time Open-Ended Video Editing with Autoregressive Diffusion', 'url': 'https://huggingface.co/papers/2608.03974', 'abstract': 'Abstract  Real-time video editing requires low-latency causal generation with bounded computational resources while preserving source fidelity and long-term temporal consistency. We present JoyAI-Video-Edit, a 16B-parameter autoregressive diffusion framework for real-time, open-ended video editing without access to future frames or a predefined video duration. Our method combines chunk-wise autoregressive adaptation, Source-Anchored Distribution Matching Distillation (SA-DMD), and Long-Horizon Autoregressive Distillation to reduce train--inference mismatch, preserve source fidelity during two-step generation, and mitigate accumulated temporal drift. Extensive automatic and human evaluations show that JoyAI-Video-Edit substantially outperforms existing streaming editors and remains competitive with strong offline systems on both short and long videos. The complete system achieves end-to-end 720p video editing at approximately 30 FPS on a single Nvidia B200 GPU. Code is available at https://github.com/jd-opensource/JoyAI-Video-Edit.', 'score': 71, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'd656cfa9c7e85686', 'authors': ['Yicheng Xiao', 'Wenxun Dai', 'Xinran Qin', 'Lin Song', 'Maoquan Zhang', 'Hang Xu', 'Yukang Chen', 'Yitong Li', 'Guohui Zhang', 'Yuan Zhang', 'Xuying Zhang', 'Tommy Zhang', 'Jianlong Yuan', 'Peihao Li', 'Shuai Lu', 'Siming Fu', 'Chuyang Zhao', 'Xin Han', 'Jie Huang', 'Wenbo Li', 'Guoqing Ma', 'Wei Huang', 'Xiaojuan Qi', 'Haoyang Huang', 'Nan Duan'], 'affiliations': ['JD', 'Joy Future Academy'], 'pdf_title_img': 'assets/pdf/title_img/2608.03974.jpg', 'data': {'categories': ['#open_source', '#inference', '#training', '#optimization', '#diffusion', '#video'], 'emoji': '🎬', 'ru': {'title': 'Потоковое редактирование видео с диффузионной моделью в реальном времени', 'desc': 'В работе представлена система JoyAI-Video-Edit для редактирования видео в реальном времени, использующая 16-миллиардный автогрессивный диффузионный трансформер, который может работать без доступа к будущим кадрам и с неизвестной длительностью видео. Основные инновации включают поэлементную адаптацию, метод SA-DMD для сохранения исходного контента и долгосрочную дистилляцию для уменьшения накопления ошибок во времени. Система достигает скорости 30 FPS при разрешении 720p на одном GPU Nvidia B200, что позволяет обрабатывать видео в реальном времени. Экспериментальные оценки показывают, что метод превосходит существующие потоковые редакторы и конкурирует с офлайн-системами как на коротких, так и на длинных видеороликах.'}, 'en': {'title': 'Real-Time Video Editing with JoyAI-Video-Edit', 'desc': 'JoyAI-Video-Edit is a cutting-edge framework designed for real-time video editing that operates efficiently under limited computational resources. It utilizes a 16B-parameter autoregressive diffusion model to generate video content without needing future frames or a set duration. The framework incorporates advanced techniques like Source-Anchored Distribution Matching Distillation and Long-Horizon Autoregressive Distillation to ensure high fidelity and temporal consistency in the edited videos. Evaluations demonstrate that it significantly outperforms existing streaming video editors while maintaining competitive performance with offline systems.'}, 'zh': {'title': '实时视频编辑的新突破', 'desc': '本论文介绍了一种名为JoyAI-Video-Edit的实时视频编辑框架，具有160亿参数，能够在有限的计算资源下进行低延迟的因果生成。该方法结合了分块自回归适应、源锚定分布匹配蒸馏（SA-DMD）和长时间自回归蒸馏，以减少训练与推理之间的不匹配，并在两步生成过程中保持源的保真度。通过大量的自动和人工评估，JoyAI-Video-Edit在短视频和长视频的编辑效果上显著优于现有的流媒体编辑器，并与强大的离线系统保持竞争力。该系统在单个Nvidia B200 GPU上实现了约30帧每秒的720p视频编辑。'}}}, {'id': 'https://huggingface.co/papers/2608.02602', 'title': 'AURORA-LM: Autoencoding Unified Representation for Continuous-Latent Diffusion Language Modeling', 'url': 'https://huggingface.co/papers/2608.02602', 'abstract': 'Abstract  Language remains an outlier in generative modeling: while images, video, and audio are increasingly modeled in continuous latent spaces, text generation still relies predominantly on discrete tokens. Existing continuous language models either inherit embedding spaces not designed for joint generation and decoding, or compress autoencoded latents to ease diffusion, sacrificing token-level fidelity. Instead of simplifying the representation to suit the generative model, we preserve a high-capacity, decodable text latent and design the diffusion model to learn its distribution directly.   We introduce AURORA-LM, a continuous-latent diffusion language model that separates the construction of a decodable text representation from the modeling of its distribution. A Query-based Encoder-Decoder organizes text into a high-capacity, prefix-aligned latent sequence, and a Block-causal Diffusion Transformer learns its distribution through flow matching, generating blocks left to right while denoising positions within each block in parallel. Because such a latent is harder for diffusion to model, AURORA-LM restricts only the noisy-input pathway while retaining the full clean-latent prediction target, accommodating full-width latents without reducing decoder-facing capacity. We further calibrate the noise-level distribution to the latent width, and introduce self-trajectory consistency to bridge independently sampled training noise and iterative denoising at inference.   AURORA-LM achieves the strongest performance among evaluated continuous and diffusion-based language models on OpenWebText free generation and XSum summarization. Scaling to 1B parameters with about 1500 EFLOPs of total compute yields further gains, surpassing a larger publicly released latent-diffusion language model under a matched evaluation protocol. All experiments are conducted on Ascend NPUs.', 'score': 69, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'b9fb2f9ff0333e14', 'authors': ['Jiajun Liang', 'Yucheng Liao', 'Yukang Cao', 'Jiazhe Wei', 'Ken Li', 'Wende Tan', 'Jiankun Zhang', 'ZY Cui', 'Jingkang Yang', 'Liucheng Guo', 'Shiqi Yang', 'B. Yang', 'Caifeng Shan', 'Ziwei Liu', 'Chenyang Si'], 'affiliations': ['Imperial College London', 'PRLab, Nanjing University', 'S-Lab, Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02602.jpg', 'data': {'categories': ['#architecture', '#training', '#open_source', '#diffusion'], 'emoji': '🌊', 'ru': {'title': 'Непрерывные латенты вместо дискретных токенов: диффузионная генерация текста нового поколения', 'desc': 'В статье представлена AURORA-LM — диффузионная языковая модель, которая работает с непрерывными латентными представлениями текста вместо дискретных токенов. Авторы разработали специальный Query-based Encoder-Decoder для создания высокоёмкого декодируемого латентного пространства и Block-causal Diffusion Transformer для моделирования его распределения через flow matching. Ключевая инновация заключается в том, что модель диффузии учится непосредственно на полнополосных латентах, сохраняя точность на уровне токенов, вместо компрессии представлений. Модель достигает лучших результатов среди непрерывных языковых моделей на задачах генерации текста и суммаризации при эффективной масштабируемости.'}, 'en': {'title': 'Revolutionizing Text Generation with Continuous Latent Diffusion', 'desc': 'This paper presents AURORA-LM, a novel continuous-latent diffusion language model that improves text generation by using a high-capacity, decodable text representation. Unlike traditional models that rely on discrete tokens, AURORA-LM organizes text into a prefix-aligned latent sequence and employs a Block-causal Diffusion Transformer to learn its distribution effectively. The model enhances performance by calibrating the noise-level distribution to the latent width and introducing self-trajectory consistency for better denoising during inference. AURORA-LM outperforms existing continuous and diffusion-based language models in generating text and summarizing content, demonstrating significant advancements in the field.'}, 'zh': {'title': 'AURORA-LM：突破语言生成的新模型', 'desc': '这篇论文介绍了一种新的连续潜在扩散语言模型，名为AURORA-LM。与传统的离散标记生成不同，AURORA-LM保留了高容量的可解码文本潜在表示，并设计了扩散模型直接学习其分布。该模型通过查询编码器-解码器将文本组织成高容量的潜在序列，并使用块因果扩散变换器进行分布建模。实验结果表明，AURORA-LM在文本生成和摘要任务中表现优异，超越了现有的连续和扩散基础语言模型。'}}}, {'id': 'https://huggingface.co/papers/2608.02711', 'title': 'Hunyuan3D-Buffalo 1.0: A Unified Multimodal Model for Scalable 3D Generation, Understanding, and Editing', 'url': 'https://huggingface.co/papers/2608.02711', 'abstract': 'Abstract  Recent advances in image generation have demonstrated the potential of unified multimodal models that integrate understanding, generation, and editing. However, unified 3D modeling remains constrained by scarce multimodal data, particularly the lack of large-scale and geometrically consistent editing data. To address this limitation, we propose Hunyuan3D-Buffalo 1.0, a unified framework supporting 3D understanding, text-to-3D generation, instruction-guided 3D editing, and text-grounded part generation within a single architecture. To enable scalable training, we construct an 87M-scale 3D multimodal corpus, comprising 25M understanding samples, 50M text-to-3D pairs, and 12M editing pairs generated using Nano3D-v2. Architecturally, the framework combines Hunyuan3D-VLM for semantic, structural, and spatial understanding with Hunyuan3D DiT for high-fidelity 3D synthesis. The VLM provides multimodal semantic conditions for generation, while editing and part generation additionally condition the diffusion process on the source object representation to preserve its overall structure and unedited regions. Extensive experiments show that Hunyuan3D-Buffalo 1.0 achieves state-of-the-art or leading performance on text-to-3D generation and 3D editing benchmarks, while exhibiting strong understanding and part-generation capabilities. Our analysis further shows that both generation and understanding improve editing, demonstrating the effectiveness of unified 3D multimodal training. Project Page: https://tencent-hunyuan.github.io/Hunyuan3D-Buffalo1.0/', 'score': 68, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'b4c812b608a2c76b', 'authors': ['Junliang Ye', 'Kenkun Liu', 'Guocun Wang', 'Yang Li', 'Yansong Qu', 'Chunshi Wang', 'Jingwei Xu', 'Yunhan Yang', 'Zibo Zhao', 'Jiachen Xu', 'Jiaao Yu', 'Lifu Wang', 'Zhihao Liang', 'Zhuo Chen', 'Chunchao Guo'], 'affiliations': ['Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2608.02711.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#3d', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Единая архитектура для понимания, генерации и редактирования 3D объектов', 'desc': 'В статье представлена Hunyuan3D-Buffalo 1.0 — унифицированная архитектура для работы с 3D контентом, включающая понимание, генерацию, редактирование и синтез отдельных частей объектов. Авторы создали огромный многомодальный корпус из 87 млн образцов, содержащий пары текст-3D и данные для редактирования, что позволило масштабировать обучение. Фреймворк объединяет vision-language модель Hunyuan3D-VLM для семантического анализа с диффузионной моделью Hunyuan3D DiT для высокофиденльного синтеза 3D объектов. Экспериментальные результаты демонстрируют, что унифицированное многомодальное обучение существенно улучшает как генерацию, так и редактирование 3D контента.'}, 'en': {'title': 'Unified 3D Modeling: Understanding, Generating, and Editing in One Framework', 'desc': 'The paper introduces Hunyuan3D-Buffalo 1.0, a comprehensive framework for 3D modeling that integrates understanding, generation, and editing of 3D objects. It addresses the challenge of limited multimodal data by creating a large-scale 3D multimodal corpus with 87 million samples, which includes understanding, text-to-3D generation, and editing pairs. The architecture combines advanced models for semantic understanding and high-fidelity 3D synthesis, allowing for effective text-guided generation and editing. Experimental results demonstrate that this unified approach achieves top performance in 3D generation and editing tasks, highlighting the benefits of multimodal training in enhancing both generation and understanding capabilities.'}, 'zh': {'title': '统一3D多模态模型的创新之路', 'desc': '最近的图像生成进展显示了统一多模态模型的潜力，这些模型集成了理解、生成和编辑功能。然而，统一的3D建模受到多模态数据稀缺的限制，特别是缺乏大规模和几何一致的编辑数据。为了解决这个问题，我们提出了Hunyuan3D-Buffalo 1.0，这是一个支持3D理解、文本到3D生成、指令引导的3D编辑和文本基础的部件生成的统一框架。通过构建一个包含8700万规模的3D多模态语料库，我们的框架在文本到3D生成和3D编辑基准测试中表现出色，展示了强大的理解和部件生成能力。'}}}, {'id': 'https://huggingface.co/papers/2608.03979', 'title': 'Video-DeepResearch: Towards the Next-Generation Multimodal Deepresearch Agent', 'url': 'https://huggingface.co/papers/2608.03979', 'abstract': 'Abstract  We introduce Video-DeepResearch (Video-DR), extending multimodal agents from static images to continuous video streams, a setting that demands dense spatiotemporal grounding coupled with open-web exploration. Preliminary evaluations reveal two critical bottlenecks in current models: (1) modality bias, where agents bypass visual tools in favor of textual search, and (2) parametric knowledge leakage, where models rely on internal memory rather than genuine tool-augmented execution. To address these challenges, we propose Video-DR, featuring a decoupled perception-exploration pipeline with stage-wise tool unlocking that compels exhaustive cross-frame visual grounding prior to web retrieval. Our framework adopts a two-stage training recipe: supervised fine-tuning followed by Group Relative Policy Optimization (GRPO), enabling autonomous exploration that breaks the imitation-learning ceiling. Furthermore, we curate Video-DR-Bench, a human-AI collaborative benchmark comprising 200 complex, multi-hop VQA instances. Empirical results demonstrate that our Video-DeepResearch-35B-A3B establishes a new state-of-the-art of 64.0% average accuracy, surpassing proprietary Claude-4.5-Sonnet (59.0%) by 5.0 points and significantly outperforming GPT-5 (52.5%) and Gemini 2.5 Pro (57.5%). The 30B-A3B variant achieves 59.3%, competitive with Claude-4.5-Sonnet and demonstrating the effectiveness of our training paradigm even at compact scale. Code: https://github.com/Osilly/Vision-DeepResearch.', 'score': 42, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '211c0dd840c09d1f', 'authors': ['Zhen Fang', 'Yu Zeng', 'Wenxuan Huang', 'Yiming Zhao', 'Shiting Huang', 'Tianfei Ren', 'Qi Lu', 'Qingnan Ren', 'Qisheng Su', 'Lionel Z. Wang', 'Qingyu Yin', 'Shuang Chen', 'Zehui Chen', 'Lin Chen', 'Zhenfei Yin', 'Yao Hu', 'Shaohui Lin', 'Wanli Ouyang', 'Shaosheng Cao', 'Feng Zhao'], 'affiliations': ['University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.03979.jpg', 'data': {'categories': ['#training', '#multimodal', '#rlhf', '#benchmark', '#video', '#dataset', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Агент глубокого исследования видео с инструментами и оптимизацией политики', 'desc': 'В работе представлена система Video-DeepResearch, расширяющая возможности мультимодальных агентов с статических изображений на обработку видеопотоков в реальном времени с пространственно-временным анализом. Авторы выявили два ключевых препятствия в текущих моделях: смещение в сторону текстовых инструментов вместо визуальных и опору на параметрические знания вместо использования внешних инструментов. Предложенный подход включает двухэтапный процесс обучения с использованием supervised fine-tuning и Group Relative Policy Optimization (GRPO) для преодоления ограничений имитационного обучения. Созданная система достигает 64% точности на новом бенчмарке Video-DR-Bench с 200 сложными примерами, превосходя закрытые модели Claude-4.5-Sonnet, GPT-5 и Gemini 2.5 Pro.'}, 'en': {'title': 'Revolutionizing Video Understanding with Video-DeepResearch', 'desc': 'The paper presents Video-DeepResearch (Video-DR), a new framework that enhances multimodal agents to work with continuous video streams instead of just static images. It identifies two main issues in existing models: modality bias, where agents prefer text over visual tools, and parametric knowledge leakage, where they depend on internal memory instead of using external tools effectively. Video-DR introduces a structured approach with a perception-exploration pipeline that ensures thorough visual grounding before retrieving information from the web. The framework is trained using a two-stage method that includes supervised fine-tuning and Group Relative Policy Optimization (GRPO), leading to significant improvements in performance on a new benchmark for video question answering.'}, 'zh': {'title': '视频深度研究：打破模态偏见与知识泄漏的瓶颈', 'desc': '我们介绍了Video-DeepResearch（Video-DR），将多模态智能体从静态图像扩展到连续的视频流。这种设置需要密集的时空定位和开放网络探索。我们发现当前模型存在两个主要瓶颈：模态偏见和参数知识泄漏。为了解决这些问题，我们提出了Video-DR，采用解耦的感知-探索管道，并通过阶段性工具解锁，强制进行全面的跨帧视觉定位。'}}}, {'id': 'https://huggingface.co/papers/2608.02738', 'title': 'Knowledge-Geometry Decoupling: Refreshable Pretrained Transfer for Streaming Recommendation', 'url': 'https://huggingface.co/papers/2608.02738', 'abstract': 'Abstract  Industrial recommenders increasingly adopt the pretrain-then-transfer paradigm, yet behavioral distribution drift raises two questions: what to learn from behavior sequences, and how to transfer the learned knowledge while the pretrained model is continually refreshed. To resolve them, we propose Knowledge-Geometry Decoupling (KGD). For what to learn, conventional next-token prediction treats adjacency as dependency and may encode spurious transitions across unrelated sessions. We introduce Behavioral Multi-Token Prediction (BMTP) to retain only collaboratively or semantically related future items as supervision, yielding cleaner and more transferable behavioral knowledge. For how to transfer, pretrained knowledge and task-specific geometry impose conflicting optimization demands on shared parameters. To handle it, KGD assigns them to separate parameter sets: a refreshable encoder owns behavioral knowledge, while a task learner reads contextualized encoder states through read-only cross-attention and writes task-specific geometry through Anchored Calibration Residual (ACR) orthogonal to the pretrained embedding. The decoupled ownership enables continual knowledge refresh without task-gradient interference or invalidating downstream adaptation. KGD improves over strong pretrain-transfer baselines by 4-12% on eight public benchmarks and sustains its advantage over a 90-day production stream where baselines show no gains. KGD has been fully deployed in Shopee. In a live A/B test on Shopee Homepage Search, it increases GMV per user by 1.75% and advertising revenue by 1.53%, demonstrating its high practical value. We provide the core implementation of KGD at https://github.com/FuCongResearchSquad/KGD4REC.', 'score': 36, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '6fd00ccc15257a2f', 'authors': ['Zixuan Wang', 'Yuhong Chen', 'Yuxuan Zhu', 'Guidong Lei', 'Zhiluohan Guo', 'Yu Zhao', 'Kun Wang', 'Bangyang Hong', 'Kangle Wu', 'Yabo Ni', 'Anxiang Zeng', 'Cong Fu', 'Hui Li'], 'affiliations': ['Shopee Pte. Ltd.', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02738.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Разделение знаний и геометрии для эффективного трансфера в рекомендациях', 'desc': 'В статье предлагается метод Knowledge-Geometry Decoupling (KGD) для рекомендательных систем, который решает проблему дрейфа распределения поведения при использовании парадигмы предварительного обучения и трансфера. Авторы вводят Behavioral Multi-Token Prediction (BMTP) для более чистого извлечения знаний о поведении пользователей, оставляя только релевантные будущие элементы в качестве целевого сигнала. KGD разделяет параметры модели на две части: обновляемый энкодер для знаний о поведении и задачно-ориентированный ученик, который работает через механизм кросс-внимания и использует ортогональную калибровку для избежания конфликтов. Метод показал улучшение на 4-12% на восьми публичных бенчмарках и успешно применён в рекомендационной системе Shopee, увеличив выручку на 1.75%.'}, 'en': {'title': 'Decoupling Knowledge for Better Recommendations', 'desc': 'This paper introduces Knowledge-Geometry Decoupling (KGD) to improve industrial recommendation systems that face challenges from behavioral distribution drift. It proposes Behavioral Multi-Token Prediction (BMTP) to focus on learning relevant future items, enhancing the quality of behavioral knowledge. KGD separates the parameters for pretrained knowledge and task-specific geometry, allowing for continual updates without interference. The method shows significant performance improvements in benchmarks and real-world applications, demonstrating its effectiveness in enhancing user engagement and revenue.'}, 'zh': {'title': '知识几何解耦：提升推荐系统的智能与效率', 'desc': '本论文提出了一种新的推荐系统方法，称为知识几何解耦（KGD），以解决行为分布漂移带来的挑战。我们引入了行为多标记预测（BMTP），只关注相关的未来项目，从而提高了行为知识的质量和可转移性。KGD通过将预训练知识和任务特定几何分配到不同的参数集，避免了优化需求的冲突，使得知识可以持续更新而不干扰任务学习。实验结果表明，KGD在多个基准测试中表现优异，并在实际应用中显著提高了用户的购买价值和广告收入。'}}}, {'id': 'https://huggingface.co/papers/2608.01837', 'title': 'PCSD: Persistent Consistency for Self-Distillation in Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.01837', 'abstract': 'Abstract  Large language model agents have shown strong potential in complex interactive tasks, yet their reinforcement learning (RL) is often hindered by sparse rewards, as a long multi-turn trajectory may receive only a single outcome-level signal. On-policy self-distillation (OPSD) provides dense token-level supervision from a privileged teacher, but the teacher may not be reliable at every position. Existing methods commonly rely on isolated token-level discrepancies, which can be sensitive to noise, or assign a shared step-level weight that may overlook positional variation. We propose Persistent Consistency Self-Distillation (PCSD), which derives token-level distillation weights from the local persistence of teacher-favoring signals. PCSD combines adaptive windows with exponentially decayed aggregation to capture persistent relative teacher support, applies trend-aware modulation to attenuate locally declining support, and produces continuous weights through sigmoid gating. The resulting objective is jointly optimized with GRPO, combining dense teacher guidance with sparse environmental feedback. Without inference-time skills, PCSD achieves the best ALFWorld Overall results among all baselines on both backbones, exceeding GRPO by 15.6 and 13.3 points and SDAR by 6.2 and 5.5 points, while remaining competitive on WebShop and gaining 15.8 points over GRPO on unseen ALFWorld split.', 'score': 35, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '9ac7cb10315eed2d', 'authors': ['Chunji Lv', 'Yangguang Wei', 'Junlin Liu', 'Yang Gao', 'Ming Liu', 'Xinming Wang', 'Jinyang Wu', 'Guoren Wang', 'Changsheng Li'], 'affiliations': ['Beijing Institute of Technology', 'Institute of Automation, Chinese Academy of Sciences', 'Meituan', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01837.jpg', 'data': {'categories': ['#training', '#reasoning', '#agents', '#optimization', '#rl'], 'emoji': '🎓', 'ru': {'title': 'Самодистилляция через персистентные сигналы учителя', 'desc': 'Статья предлагает метод Persistent Consistency Self-Distillation (PCSD) для улучшения обучения с подкреплением больших языковых моделей в сложных интерактивных задачах. Проблема заключается в том, что агенты получают редкие награды только после завершения долгих многоходовых траекторий, что затрудняет обучение. Авторы используют привилегированного учителя для генерации плотного сигнала обратной связи на уровне токенов, при этом адаптивно взвешивая его рекомендации на основе локальной консистентности его предсказаний. PCSD комбинируется с методом GRPO и показывает значительное улучшение результатов на бенчмарках ALFWorld и WebShop.'}, 'en': {'title': 'Enhancing Learning with Persistent Teacher Guidance', 'desc': "This paper introduces Persistent Consistency Self-Distillation (PCSD), a method designed to improve reinforcement learning in large language model agents by addressing the challenge of sparse rewards. PCSD enhances token-level supervision by deriving weights from the persistence of teacher signals, allowing for more reliable guidance during training. The method employs adaptive windows and trend-aware modulation to ensure that the model can effectively learn from the teacher's feedback, even when it varies in reliability. The results demonstrate that PCSD significantly outperforms existing methods, achieving superior performance in complex interactive tasks without requiring additional inference-time skills."}, 'zh': {'title': '持久一致性自蒸馏：提升强化学习的有效性', 'desc': '大型语言模型代理在复杂交互任务中展现出强大的潜力，但其强化学习常常受到稀疏奖励的限制。我们提出了一种新的方法，称为持久一致性自蒸馏（PCSD），它通过局部持久性信号来生成令牌级蒸馏权重。PCSD结合自适应窗口和指数衰减聚合，能够捕捉持续的教师支持，并通过趋势感知调制来减弱局部下降的支持。最终，PCSD在多个基准测试中表现优异，超越了现有方法，显示出其在稀疏反馈环境中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.04003', 'title': 'PAST-Bench: Benchmarking the Foundations of Recursive Self-Improvement in Personal Agents', 'url': 'https://huggingface.co/papers/2608.04003', 'abstract': 'Abstract  Recursive self-improvement requires agents to turn accumulated experience into better future behavior. Personal AI agents offer a concrete setting for studying this capability because they retain preferences, task histories, tool routines, and learned skills across sessions. Yet whether retained experience actually improves them over time has not been systematically tested. We introduce PAST-Bench, a benchmark designed to isolate this question. Each agent runs through ordered sequences of fresh-session tasks under matched conditions that turn retained experience on and off. It spans 26 scenarios and 204 episodes across memory, procedural reuse, information gathering, and update. We report both later-task gains and whether those gains follow the intended save, retrieve, and update pathway. Across seven base models and four agent frameworks, improvement is real but uneven across capabilities. Agents with the same headline gain can differ markedly in whether that gain is supported by evidence of the intended pathway. Guided by these findings, we develop Hermes+, which extends Hermes with five targeted interventions across stages of the agent loop. Hermes+ raises the average gain from retained experience and provides clearer pathway evidence, with its strongest improvement on tasks requiring outdated state to be replaced, although the effect remains capability- and model-dependent. Together, PAST-Bench and Hermes+ provide an evaluation and diagnostic foundation for studying how persistent agents can progress from retaining experience to systematically improving through it. Code: https://github.com/Gen-Verse/PAST-Bench', 'score': 28, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '057796f29766e648', 'authors': ['Shuhan Xue', 'Zixin Ding', 'Yichen Shen', 'Yinjie Wang', 'Zhenfei Yin', 'Yingcheng Wu', 'Yuxin Chen', 'Mengdi Wang', 'Ling Yang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.04003.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'От сохранения опыта к систематическому прогрессу: оценка самосовершенствования персональных агентов', 'desc': 'В работе исследуется способность персональных AI агентов к рекурсивному самосовершенствованию путём использования накопленного опыта для улучшения будущего поведения. Авторы представляют PAST-Bench — эталонный набор задач для систематической оценки влияния сохранённого опыта на производительность агентов через механизмы памяти, процедурного переиспользования и обновления знаний. Исследование показывает, что улучшения реальны, но неравномерны: агенты с одинаковым прибыльностью могут существенно различаться по наличию доказательств намеренного пути сохранения, извлечения и обновления информации. Предложена система Hermes+, которая добавляет целевые интервенции на разных этапах цикла агента, повышая среднее улучшение от сохранённого опыта и обеспечивая более ясные свидетельства требуемых механизмов.'}, 'en': {'title': 'Unlocking AI Growth Through Experience Retention', 'desc': 'This paper introduces PAST-Bench, a benchmark designed to evaluate how personal AI agents can improve their performance by utilizing retained experiences from previous tasks. The study systematically tests whether agents can enhance their behavior over time by turning their memory and learned skills on and off during fresh-session tasks. The results show that while agents do improve, the extent of this improvement varies significantly across different capabilities and models. To address these variations, the authors developed Hermes+, which implements targeted interventions to enhance the learning process and provide clearer evidence of improvement pathways.'}, 'zh': {'title': '智能体的经验积累与自我改进', 'desc': '递归自我改进要求智能体将积累的经验转化为更好的未来行为。个人人工智能代理提供了一个具体的环境来研究这一能力，因为它们在多个会话中保留偏好、任务历史、工具例程和学习技能。我们引入了PAST-Bench，这是一个旨在系统性测试保留经验是否真正改善智能体表现的基准。通过对七个基础模型和四个代理框架的实验，我们发现改进是存在的，但在不同能力上表现不均。'}}}, {'id': 'https://huggingface.co/papers/2608.02713', 'title': 'Quo Vadis, World Modeling?', 'url': 'https://huggingface.co/papers/2608.02713', 'abstract': 'Abstract  Continually improving agents require dynamic interaction feedback beyond static supervision, yet direct real-environment interaction is costly, slow, unsafe, and hard to parallelize. World modeling offers a natural intermediate proxy that allows agents to query lower-cost, more controllable feedback before committing to real actions. Classical world models instantiate this proxy primarily through future physical-state prediction, a formulation useful yet narrow for agents that require actionable feedback beyond raw state transitions. In this work, we conceptualize Agent-Centric Interactive World Proxies, shifting the fundamental paradigm from physical state transitions to agent-usable information transitions, such as execution outcomes, retrieved experiences or skills, and verification signals, broadening the scope of world modeling to provide versatile feedback for continually improving agents. To systematically map this design space, we organize world proxies into six functional forms based on their feedback modalities: dynamics, spatial, execution, memory/experience, skill, and reward/verification proxies, which together characterize the primary ways world modeling serves agent improvement. We further analyze how these proxies empower agents across three progressive levels: L.1 Inference-Time Guidance, where proxy outputs enrich in-context information for superior decisions; L.2 Training-Time Optimization, where proxy outputs yield rewards, critiques, or synthetic rollouts for policy learning; and L.3 Agent-Proxy Co-Evolution, where real-environment evidence continuously updates both the proxy and the agent for co-evolution. Ultimately, this work recasts world modeling into an agent-centric paradigm, establishing a roadmap for building world proxies that empower agents to plan better, learn faster, and evolve continually.', 'score': 28, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '424c8d02521ca805', 'authors': ['Yu Yang', 'Xuemeng Yang', 'Licheng Wen', 'Lingdong Kong', 'Xiaobin Hu', 'Dongyue Lu', 'Wei Chow', 'Xiyan Huang', 'Yuxiang Feng', 'Yue Liao', 'Jianbiao Mei', 'Daocheng Fu', 'Rong Wu', 'Pinlong Cai', 'Ran Yi', 'Ying Tai', 'Jiangning Zhang', 'Botian Shi', 'Yong Liu', 'Shuicheng Yan'], 'affiliations': ['APRIL Lab @ Zhejiang University', 'KnowledgeX Lab @ Shanghai AI Laboratory', 'LV-Lab @ National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.02713.jpg', 'data': {'categories': ['#training', '#agents', '#rl'], 'emoji': '🌍', 'ru': {'title': 'От предсказания состояний к интерактивным мирам: моделирование, ориентированное на агента', 'desc': 'В работе предложена новая парадигма моделей мира, ориентированная на агентов, которая расширяет традиционный подход предсказания физических состояний. Вместо этого авторы вводят концепцию интерактивных прокси-моделей, предоставляющих агентам разнообразные типы обратной связи: результаты выполнения действий, извлечённые опыт, навыки и сигналы верификации. Исследователи систематизируют шесть типов прокси-моделей по модальностям обратной связи и описывают три уровня их применения: от обогащения контекста во время вывода до совместной эволюции агента и модели в процессе обучения. Такой подход позволяет агентам принимать лучшие решения, учиться быстрее и непрерывно совершенствоваться без дорогостоящих взаимодействий с реальной средой.'}, 'en': {'title': 'Empowering Agents with Interactive World Proxies', 'desc': 'This paper introduces a new approach to world modeling for agents that need ongoing feedback to improve. Instead of just predicting physical states, it focuses on providing useful information that agents can act on, like outcomes and skills. The authors categorize different types of feedback into six functional forms, which help agents learn and adapt more effectively. By emphasizing the interaction between agents and their world models, this work aims to enhance how agents plan, learn, and evolve over time.'}, 'zh': {'title': '以代理为中心的世界建模：提升智能体的学习与进化', 'desc': '本论文提出了一种新的世界建模方法，称为以代理为中心的交互世界代理，旨在为持续改进的智能体提供更灵活的反馈。与传统的物理状态预测不同，这种方法关注于智能体可用的信息转移，如执行结果、经验和技能。我们将世界代理分为六种功能形式，以便系统化地映射设计空间，并分析这些代理如何在不同层次上增强智能体的能力。最终，这项工作为构建能够帮助智能体更好规划、快速学习和持续进化的世界代理奠定了基础。'}}}, {'id': 'https://huggingface.co/papers/2608.03316', 'title': 'Any-OPD: Heterogeneous On-Policy Distillation for Flow-Matching Models via Representation-Space Bridging', 'url': 'https://huggingface.co/papers/2608.03316', 'abstract': "Abstract  On-policy distillation, in which a teacher corrects samples that the student itself generates, presupposes that the two models speak the same language: identical VAE latents, matching architectures, and a common timestep grid. We ask what happens when none of this holds, as when the strongest teacher available and the student one wishes to deploy come from different model families, and find that the standard recipes have no answer: teacher latents cannot serve as targets in a foreign coordinate system, per-pixel losses against a teacher that stochastically re-draws local detail degenerate into blur or divergence, and timestep indices lose their meaning across mismatched schedules. We present Any-OPD, to our knowledge the first framework for on-policy distillation between arbitrary pairs of latent flow-matching generators. Any-OPD treats the teacher purely as a black-box sampler and connects the two models at exactly one point: a frozen, model-agnostic vision representation in which their independently decoded outputs are compared, sidestepping every assumption about latents, features, or architecture. Trajectory correspondence is recovered by matching continuous noise levels instead of step indices, and a brief anchoring phase, in which teacher samples are re-encoded through the student's own VAE, ensures the on-policy gradient measures sample quality rather than domain mismatch. Distilling the 12B FLUX.1-dev into the 2.5B SD3.5-Medium, Any-OPD lifts the student's PickScore from 0.846 to 0.884 and HPSv3 from 9.12 to 10.97, rivaling the teacher at a fifth of its size, where direct latent regression fails to train at all.", 'score': 21, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '07d570c094971322', 'authors': ['Siming Fu', 'Zheming Fu', 'Ruizhe He', 'Hualiang Wang', 'Jie Huang', 'Xiaoxiao Ma', 'Mingchen Zhong', 'Weihu Huang', 'Xiaoxuan He', 'Haojun Xu'], 'affiliations': ['Joy Future Academy', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03316.jpg', 'data': {'categories': ['#cv', '#training', '#diffusion', '#multimodal', '#optimization'], 'emoji': '🌊', 'ru': {'title': 'Дистилляция без границ: унифицированный подход к обучению разнородных генеративных моделей', 'desc': "В статье предложен метод Any-OPD для дистилляции знаний между генеративными моделями из разных семейств, которые используют latent flow-matching. Основная проблема заключается в том, что стандартные подходы требуют совпадения архитектур, представлений и временных сеток, что невозможно при работе с разнородными моделями. Any-OPD решает эту проблему, рассматривая учителя как чёрный ящик и сравнивая выходы моделей в единой модель-агностичной визуальной репрезентации вместо latent'ов. Метод восстанавливает соответствие траекторий путём сопоставления уровней шума вместо индексов шагов и использует фазу закрепления для обеспечения корректных градиентов."}, 'en': {'title': 'Bridging Model Gaps with Any-OPD for Effective Distillation', 'desc': "This paper introduces Any-OPD, a novel framework for on-policy distillation that allows a student model to learn from a teacher model even when they belong to different model families. Traditional methods require both models to share the same latent space and architecture, which is often not feasible. Any-OPD circumvents these limitations by treating the teacher as a black-box sampler and comparing their outputs through a shared vision representation. The framework improves the student's performance significantly, demonstrating that effective distillation can occur without direct alignment of model components."}, 'zh': {'title': '跨模型的在线蒸馏新方法', 'desc': '本文探讨了在不同模型之间进行在线蒸馏的挑战，尤其是当教师和学生模型来自不同的模型家族时。传统的蒸馏方法在这种情况下无法有效工作，因为教师的潜在变量无法作为目标，且像素损失会导致模糊或发散。为了解决这个问题，本文提出了Any-OPD框架，它将教师视为黑箱采样器，通过比较独立解码的输出，避免了对潜在变量和特征的假设。通过匹配连续的噪声水平而非时间步索引，Any-OPD成功地提高了学生模型的性能，展示了在不同模型间进行有效蒸馏的可能性。'}}}, {'id': 'https://huggingface.co/papers/2608.03812', 'title': 'OmniPack: Unified Token Compression for Efficient Omni-modal Large Language Models', 'url': 'https://huggingface.co/papers/2608.03812', 'abstract': 'Abstract  Omni-modal large language models (Omni-LLMs) have achieved remarkable performance on audio-visual understanding tasks, but processing long and highly redundant visual and audio token sequences incurs substantial computational overhead, demanding aggressive token compression for efficient deployment. Existing methods often degrade at low token budgets: pre-LLM compression may discard structurally important and globally distributed evidence, whereas inner-LLM compression often underexploits query-conditioned audio-visual collaboration. To address these limitations, we propose OmniPack, a training-free framework that coordinates structural compression before the LLM with task-relevant semantic refinement within the LLM. Before the LLM, OmniPack removes structural redundancy through modality-specific importance, global coverage, and similarity-aware merging. After sufficient multimodal interaction, it further consolidates diverse, task-relevant representations through textual guidance and audio-visual collaboration. Extensive experiments on five benchmarks with three Omni-LLM backbones demonstrate that OmniPack consistently achieves the best performance-efficiency trade-off across diverse retention ratios, outperforming all existing methods. Notably, on Qwen2.5-Omni-7B, OmniPack preserves 98.0% of the original performance while reducing FLOPs to 16.7%, and still retains 92.9% of the original performance with only 6.8% of the original FLOPs.', 'score': 20, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'a4e755cd6c73b89c', 'authors': ['Wanshun Su', 'Yang Shi', 'Feihu Liu', 'Ziwen Yu', 'Yan Min', 'Zhuoran Zhang', 'Qixun Wang', 'Haotian Wang', 'Shixuan Liu', 'Yuanxing Zhang', 'Peng Wu', 'Chengfu Huo', 'Liang Ding'], 'affiliations': ['Alibaba Group', 'Northwestern Polytechnical University', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03812.jpg', 'data': {'categories': ['#inference', '#audio', '#video', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Эффективная мультимодальная компрессия без переобучения модели', 'desc': 'В статье предложен OmniPack — метод для эффективной обработки аудиовизуальных данных в мультимодальных больших языковых моделях. Метод решает проблему вычислительной сложности путём координации двухэтапной компрессии токенов: структурная редукция перед моделью удаляет модально-специфичную избыточность, а семантическое уточнение внутри модели использует взаимодействие между модальностями. OmniPack не требует переобучения и показывает оптимальный баланс между качеством и эффективностью на различных степенях сжатия. Экспериментальные результаты демонстрируют, что метод сохраняет 98% качества при 83.3% снижении вычислительных операций.'}, 'en': {'title': 'Efficient Compression for Omni-modal Language Models', 'desc': 'The paper introduces OmniPack, a novel framework designed to enhance the efficiency of Omni-modal large language models (Omni-LLMs) in processing audio-visual data. It addresses the challenges of token compression by implementing a two-step approach: first, it reduces structural redundancy before the LLM using importance and similarity metrics, and then it refines task-relevant representations within the LLM through multimodal interactions. This method allows for better retention of critical information while significantly lowering computational costs. Experimental results show that OmniPack achieves superior performance and efficiency compared to existing compression techniques, maintaining high accuracy even with reduced computational resources.'}, 'zh': {'title': 'OmniPack：高效的多模态压缩解决方案', 'desc': 'Omni-LLMs在音视频理解任务中表现出色，但处理长且冗余的音视频序列会导致计算开销大。现有方法在低令牌预算下效果不佳，可能会丢失重要的结构信息。为了解决这些问题，我们提出了OmniPack，一个无训练的框架，通过任务相关的语义精炼来协调LLM前的结构压缩。实验表明，OmniPack在多个基准测试中实现了最佳的性能与效率平衡，显著优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2608.03457', 'title': 'LLaDA MoE v2: Scaling Mixture-of-Experts Diffusion Language Models', 'url': 'https://huggingface.co/papers/2608.03457', 'abstract': 'Abstract  Diffusion language models (dLLMs) offer an alternative to autoregressive (AR) language modeling, yet the scaling behavior of Mixture-of-Experts (MoE) dLLMs remains poorly understood. We systematically characterize how optimization hyperparameters, compute allocation, and architecture scale for MoE dLLMs, identifying quantitative differences from scaling trends previously reported for AR models. Specifically, for optimization, the optimal nominal batch size grows faster, while the optimal learning rate decays more rapidly with compute. For model--data allocation, IsoFLOP analysis reveals a slight data-side tilt: the optimal token budget grows faster than activated model-side computation. For MoE architecture, larger scales increasingly favor larger expert pools at fixed activated capacity, while moderate expert granularity remains consistently effective and the preferred fraction of activated capacity assigned to shared experts remains stable across scales. Guided by these findings, we train LLaDA MoE v2, a 30B-A3B dLLM, from scratch on 23.5T tokens. With approximately 65\\% as many pretraining tokens as Qwen3, LLaDA MoE v2 approaches Qwen3 on several knowledge, reasoning, and coding benchmarks. After supervised fine-tuning alone, it outperforms SDAR Chat on seven of eight reasoning and coding benchmarks and remains close to Qwen3 on several tasks. These results establish practical scaling laws and design principles for MoE dLLMs.', 'score': 20, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'f107745da99fe0b6', 'authors': ['Fengqi Zhu', 'Shaoxuan Xu', 'Jingyang Ou', 'Zebin You', 'Yipeng Xing', 'Huabin Liu', 'Xiaolu Zhang', 'Jun Zhou', 'Zhenzhong Lan', 'Yankai Lin', 'Wayne Xin Zhao', 'Jianguo Li', 'Chongxuan Li', 'Ji-Rong Wen'], 'affiliations': ['Ant Group', 'Beijing Key Laboratory of Research on Large Models and Intelligent Governance', 'Engineering Research Center of Next-Generation Intelligent Search and Recommendation, MOE', 'Gaoling School of AI, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.03457.jpg', 'data': {'categories': ['#open_source', '#optimization', '#training', '#diffusion', '#benchmark', '#architecture'], 'emoji': '🌊', 'ru': {'title': 'Законы масштабирования для диффузионных языковых моделей с архитектурой экспертов', 'desc': 'В работе исследуются диффузионные языковые модели с архитектурой Mixture-of-Experts, которые предлагают альтернативу традиционным авторегрессивным моделям. Авторы систематически анализируют, как масштабируются гиперпараметры оптимизации, распределение вычислительных ресурсов и архитектурные решения для MoE моделей, выявляя отличия от известных законов масштабирования AR моделей. Их анализ показывает, что оптимальный размер батча растет быстрее, темп обучения убывает резче, а оптимальное соотношение между объемом данных и активных параметров модели смещается в сторону данных. На основе выявленных закономерностей авторы обучают модель LLaDA MoE v2 (30B активных параметров из 3B общих), которая достигает конкурентных результатов по сравнению с Qwen3, используя при этом значительно меньше токенов для предобучения.'}, 'en': {'title': 'Unlocking the Power of Mixture-of-Experts in Diffusion Models', 'desc': 'This paper explores the scaling behavior of Mixture-of-Experts (MoE) diffusion language models (dLLMs) compared to traditional autoregressive models. It identifies key differences in optimization hyperparameters, such as the growth of optimal batch size and the decay of learning rate with increased compute. The study also reveals that the optimal token budget increases faster than the computation required, indicating a data-side tilt in model-data allocation. Finally, the authors present LLaDA MoE v2, a new model that demonstrates competitive performance on various benchmarks, highlighting effective scaling laws and design principles for future MoE dLLMs.'}, 'zh': {'title': '探索混合专家模型的扩展规律', 'desc': '扩散语言模型（dLLMs）为自回归语言建模提供了一种替代方案，但混合专家（MoE）dLLMs的扩展行为仍不够清楚。本文系统地分析了优化超参数、计算分配和架构在MoE dLLMs中的扩展特性，发现与自回归模型的扩展趋势存在定量差异。具体而言，最佳批量大小增长更快，而最佳学习率随着计算的增加而迅速下降。通过这些发现，我们训练了LLaDA MoE v2，一个基于30B-A3B的dLLM，结果在多个知识、推理和编码基准上表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.02589', 'title': 'CAPEval: A Decoupled Caption Evaluation across Understanding and Generation', 'url': 'https://huggingface.co/papers/2608.02589', 'abstract': 'Abstract  Captions serve as a primary supervision signal for both multimodal understanding and text-to-image generation. However, previous evaluations treat the caption quality as a single scalar objective, which conflates two distinct properties: (1) how much visual information a caption covers and (2) how reliably the image supports its stated claims. To this end, we design a decoupled caption evaluation benchmark, CAPEval (Coverage And Precision Evaluation), with human-written ground-truth captions and human-verified atomic checklist items. Specifically, CAPEval decomposes caption quality into Coverage and Precision. The former quantifies how thoroughly a caption covers ground-truth factual content, while the latter reflects the factual correctness rate of all claims expressed in the caption. We select 10 captioners and further conduct controlled downstream end-to-end experiments with them from four model families, where the caption source is the only variable. Empirically, we find a consistent task-dependent dissociation: Coverage serves as the stronger correlate for understanding performance, whereas Precision acts as the dominant predictor for generation performance. This decoupled evaluation paradigm not only delivers a more fine-grained diagnosis of caption quality, but also offers actionable guidance for selecting and optimizing captioners tailored to different downstream tasks.', 'score': 19, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'fc46cf0c06cd6644', 'authors': ['Zhipeng Liu', 'Haochen Wang', 'Zhaoxiang Zhang'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.02589.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Разделение оценки подписей на полноту и точность для разных задач', 'desc': 'В статье предложен новый подход к оценке качества подписей к изображениям, разделяющий эту задачу на две независимые метрики: Coverage (полнота покрытия визуальной информации) и Precision (точность фактических утверждений). Исследователи создали бенчмарк CAPEval с человеческими проверками и атомарными элементами контрольного списка для более детальной оценки. Через контролируемые эксперименты на различных моделях генерации и понимания мультимодальных данных они обнаружили, что Coverage лучше коррелирует с задачами понимания, а Precision - с задачами генерации текста из изображений. Такой разделённый подход позволяет более точно диагностировать качество подписей и дать практические рекомендации по выбору генераторов подписей для конкретных приложений.'}, 'en': {'title': 'Decoupling Caption Quality: Coverage vs. Precision', 'desc': 'This paper introduces a new evaluation method for image captions called CAPEval, which separates the assessment of captions into two key components: Coverage and Precision. Coverage measures how well a caption includes all relevant visual information, while Precision assesses the accuracy of the claims made in the caption. The authors conducted experiments with various captioning models to show that Coverage is more important for understanding tasks, whereas Precision is crucial for generating tasks. This approach provides a clearer understanding of caption quality and helps in choosing the best captioning methods for specific applications.'}, 'zh': {'title': '解耦字幕评估，提升多模态理解与生成', 'desc': '本文提出了一种新的图像字幕评估基准，称为CAPEval（覆盖率和精确度评估），旨在更好地评估图像字幕的质量。传统的评估方法将字幕质量视为单一的标量目标，但实际上字幕的质量可以分为两个方面：覆盖率和精确度。覆盖率衡量字幕覆盖真实内容的程度，而精确度则反映字幕中所有声明的事实正确率。通过对不同模型的实验，研究发现覆盖率与理解性能相关性更强，而精确度则是生成性能的主要预测因素。'}}}, {'id': 'https://huggingface.co/papers/2608.03509', 'title': 'SkillJack: Persistent Skill Backdoors in Self-Evolving Agents', 'url': 'https://huggingface.co/papers/2608.03509', 'abstract': "Abstract  Self-evolving agents increasingly convert interaction histories into reusable skills that persist beyond individual tasks. While prior work studies memory and retrieval poisoning, such attacks only affect agents when poisoned records are retrieved as context. We uncover a new and more fundamental risk: poisoned experiences can be transformed by the agent itself into durable behavioral artifacts. We present SkillJack, the first attack that exploits the experience-to-skill pipeline of self-evolving agents. Instead of directly manipulating runtime context, SkillJack hijacks the agent's own learning process to implant malicious behaviors into its reusable skill repertoire. We identify three key properties of this transformation: sanitization whitewashing, where malicious intent is obscured during skill extraction; cross-layer promotion, where transient experiences become persistent capabilities; and persistence isolation, where the attack survives removal of its original source records. We evaluate SkillJack on two representative systems, SkillX and Anything2Skill, using a shared dataset of 150 trajectories across four policy-risk categories. Results show that skill extraction substantially reduces attack detectability: in SkillX, safety detection drops from 98.5\\% for poisoned trajectories to 11.4\\% for extracted skills, while Anything2Skill shows a similar effect. Meanwhile, the implanted skills remain effective, achieving attack success rates of 56.2\\% and 89.2\\% on the two systems, respectively. Furthermore, 80.0\\% of skill-mediated attacks persist after deleting the original poisoned records, and some skills unintentionally activate on benign queries. Our findings reveal skill evolution as a new attack surface and motivate provenance-aware skill lifecycle protection. Our code is available at https://github.com/Tencent/AI-Infra-Guard/research/skilljack.", 'score': 18, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '567828b50d71d447', 'authors': ['Zonghao Ying', 'Xiangfan Wu', 'Huiyu Wu', 'Xing Zheng', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.03509.jpg', 'data': {'categories': [], 'emoji': '🔓', 'ru': {'title': 'Отравление через навыки: атака на процесс обучения агентов', 'desc': 'В статье представлена новая уязвимость самообучающихся агентов, которые преобразуют историю взаимодействий в переиспользуемые навыки. Авторы предлагают SkillJack — первую атаку, которая эксплуатирует конвейер преобразования опыта в навыки, внедряя вредоносное поведение непосредственно в репертуар умений агента. Атака работает на трёх принципах: маскировка вредоносного намерения при извлечении навыков, преобразование временного опыта в постоянные способности и сохранение эффекта атаки даже после удаления исходных данных. Экспериментальные результаты показывают, что извлечённые навыки значительно снижают обнаружимость атаки (с 98.5% до 11.4%) и сохраняют высокую эффективность на репрезентативных системах.'}, 'en': {'title': 'SkillJack: Hijacking Learning to Embed Malicious Behaviors in AI Skills', 'desc': "This paper introduces SkillJack, a novel attack method targeting self-evolving agents that convert experiences into reusable skills. Unlike traditional attacks that manipulate context, SkillJack exploits the agent's learning process to embed harmful behaviors into its skill set. The authors identify three critical properties of this attack: sanitization whitewashing, cross-layer promotion, and persistence isolation, which allow malicious skills to persist even after the original poisoned experiences are removed. Evaluation on two systems shows that skill extraction significantly reduces the detectability of attacks while maintaining high success rates for the implanted malicious skills."}, 'zh': {'title': '技能进化：新的攻击面', 'desc': '自我进化的智能体能够将交互历史转化为可重复使用的技能，这些技能超越了单一任务。本文揭示了一种新的风险：被污染的经验可以被智能体自身转化为持久的行为特征。我们提出了SkillJack，这是第一个利用自我进化智能体经验到技能转化过程的攻击方法。通过操控智能体的学习过程，SkillJack能够将恶意行为植入其可重复使用的技能库中，且这些技能在删除原始记录后仍然有效。'}}}, {'id': 'https://huggingface.co/papers/2608.03971', 'title': 'UniWorld-Design: From Pixel Generation to Layer-Native Design', 'url': 'https://huggingface.co/papers/2608.03971', 'abstract': 'Abstract  We introduce UniWorld-Design, a framework that redefines image generation from flat pixel synthesis to structured visual composition, with semantic RGBA layers as the atomic units of generation, understanding, and editing. Our key insight is that pixels define how an image is rendered, whereas layers define how an image is created, understood, and edited. Just as human designers create and manipulate visual content through layers rather than raw pixels, UniWorld-Design equips multimodal generative models with a layer-native design space. UniWorld-Design comprises two models. The Text-to-RGBA (T2RGBA) model generates standalone RGBA assets directly from text. The Image-to-Layer (I2L) model conditions on a finished image, a global instruction and per-layer prompts, and jointly produces ordered, complete semantic RGBA layers. Its instruction interface supports top-level decomposition, recursive decomposition and targeted extraction, making layering an instruction-addressable operation for agentic editing. Because I2L learns complete semantic objects rather than visible-pixel partitions, its layers stay usable when moved or removed. On the Crello benchmark, I2L reduces per-layer RGB L1 error by 37% and achieves a 34% relative improvement in Alpha Soft IoU over Qwen-Image-Layered. Separately, T2RGBA achieves the highest CLIP Score, outperforming LayerDiffuse and OmniAlpha.', 'score': 18, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '3d1d5b2e7d180688', 'authors': ['Zongjian Li', 'Zhiyuan Yan', 'Chenxu Bai', 'Chen Chen', 'Haoxiang Sun', 'Shaodong Wang', 'Feize Wu', 'Shenghai Yuan', 'Bin Lin', 'Zheyuan Liu', 'Yuwei Niu', 'Li Yuan'], 'affiliations': ['Peking University', 'Rabbitpre AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.03971.jpg', 'data': {'categories': ['#diffusion', '#benchmark', '#multimodal', '#cv'], 'emoji': '🎨', 'ru': {'title': 'От пикселей к слоям: структурированная композиция вместо синтеза', 'desc': 'Авторы представляют UniWorld-Design — фреймворк, который переопределяет задачу генерации изображений, перемещая фокус с синтеза плоских пикселей на структурированную визуальную композицию со слоями RGBA в качестве базовых единиц. В основе подхода лежит идея, что пиксели определяют рендеринг, а слои определяют создание, понимание и редактирование изображений, подобно тому как работают дизайнеры. Фреймворк включает две модели: T2RGBA для прямой генерации RGBA-слоёв из текста и I2L для разложения готовых изображений на семантические слои с поддержкой рекурсивного разложения и целевой экстракции. I2L демонстрирует значительное улучшение метрик — снижение RGB L1 ошибки на 37% и улучшение Alpha Soft IoU на 34% по сравнению с существующими методами.'}, 'en': {'title': 'Revolutionizing Image Generation with Layered Design', 'desc': 'UniWorld-Design is a new framework for image generation that focuses on structured visual composition using semantic RGBA layers instead of just pixels. This approach allows for better understanding and editing of images, as layers represent how images are created, similar to how human designers work. The framework includes two models: T2RGBA, which generates RGBA assets from text, and I2L, which creates semantic layers from existing images and instructions. The results show significant improvements in image quality and usability of layers, making it easier to manipulate visual content.'}, 'zh': {'title': '图像生成的新视角：从像素到层的转变', 'desc': 'UniWorld-Design是一个新的框架，它将图像生成从简单的像素合成转变为结构化的视觉组合，使用语义RGBA层作为生成、理解和编辑的基本单元。我们的关键见解是，像素定义了图像的渲染方式，而层则定义了图像的创建、理解和编辑方式。UniWorld-Design包含两个模型：Text-to-RGBA（T2RGBA）模型直接从文本生成独立的RGBA资产，而Image-to-Layer（I2L）模型则基于完成的图像和指令生成有序的语义RGBA层。I2L在Crello基准测试中显著降低了每层RGB L1误差，并在Alpha Soft IoU上实现了相对改进。'}}}, {'id': 'https://huggingface.co/papers/2608.04007', 'title': 'TurnSight: Turn-Level Hindsight Self-Distillation for Tool-Integrated Reasoning', 'url': 'https://huggingface.co/papers/2608.04007', 'abstract': 'Abstract  Tool-Integrated Reasoning (TIR) enables LLMs to solve complex tasks through iterative tool interactions. However, existing reinforcement learning methods often rely on trajectory-level supervision, limiting fine-grained credit assignment in long-horizon TIR scenarios. On-policy self-distillation offers denser signals through teacher branches with privileged context, but existing approaches typically derive such context from ground-truth answers or retrieved skills, which may not reflect the states actually visited by the agent. Moreover, token-level supervision fails to capture the turn-level structure of tool interactions. To address this, we propose TurnSight, a turn-level hindsight self-distillation framework that derives supervision directly from execution-conditioned hindsight. It then constructs multiple hindsight views with different lookahead horizons and selects reliable supervision through cross-horizon directional agreement. Finally, the selected hindsight signal is normalized across sibling rollouts and used to adaptively modulate RL advantages while preserving their original optimization direction. Extensive experiments on three benchmarks demonstrate the effectiveness of TurnSight. Our codes are available at https://github.com/quchangle1/TurnSight.', 'score': 15, 'issue_id': 2850, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'b6bb47b4de0c8253', 'authors': ['Changle Qu', 'Sunhao Dai', 'Hengyi Cai', 'Yuqi Zhou', 'Xinran Chen', 'Simon', 'Jun Xu'], 'affiliations': ['Baidu Inc.', 'Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.04007.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Обучение с подкреплением через ретроспективный анализ ходов диалога', 'desc': 'В статье предлагается TurnSight — фреймворк самодистилляции с использованием ретроспективного анализа, который помогает LLM лучше учиться на своих взаимодействиях с инструментами при решении сложных задач. Вместо традиционного обучения с подкреплением на уровне целых траекторий, метод использует сигналы обратной связи на уровне отдельных ходов диалога, извлекая их непосредственно из выполненных действий агента. Система создаёт несколько вариантов ретроспективного анализа с разными горизонтами предсказания и отбирает надёжные сигналы через согласованность между ними. Полученные сигналы нормализуются и используются для адаптивной коррекции преимуществ в алгоритме обучения с подкреплением, улучшая качество обучения агента на длинных последовательностях действий.'}, 'en': {'title': 'Enhancing LLMs with Turn-Level Hindsight for Better Tool Interaction', 'desc': 'This paper introduces TurnSight, a new framework for improving the performance of large language models (LLMs) in complex tasks through better tool interactions. It addresses the limitations of existing reinforcement learning methods that struggle with long-horizon tasks by providing turn-level hindsight self-distillation. This approach generates supervision signals based on the actual execution context rather than relying solely on ground-truth answers. The framework enhances the learning process by using multiple hindsight views and ensuring that the reinforcement learning advantages are effectively modulated, leading to improved task performance across various benchmarks.'}, 'zh': {'title': 'TurnSight：提升工具集成推理的自蒸馏框架', 'desc': '本文提出了一种名为TurnSight的框架，用于改进工具集成推理（TIR）中的强化学习方法。传统方法在长时间跨度的TIR场景中，难以进行细粒度的信用分配，而TurnSight通过回顾性自蒸馏直接从执行条件中获取监督信号。该框架构建了多个不同前瞻视角的回顾性视图，并通过跨视角一致性选择可靠的监督信号。实验结果表明，TurnSight在多个基准测试中表现出色，显著提升了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.02392', 'title': 'GROVE: Growing and Reasoning over Temporally Stratified Memory from Streaming Video Experience', 'url': 'https://huggingface.co/papers/2608.02392', 'abstract': 'Abstract  A wearable assistant should both answer questions about its visual history and recognize when that history is useful to the present situation. Existing video-memory systems primarily support question-conditioned recall, whereas proactive assistants typically use separate memory and control mechanisms. We introduce GROVE, a training-free framework that supports both behaviors with one memory grown causally from a continuous video stream. GROVE retains fine-grained perceptual evidence and incrementally consolidates it into time-stamped moments, coherent episodes, and recurring cross-day patterns. Each stratum is paired with a scale-native retrieval skill for locating an observation, replaying an activity, or traversing long-range regularities. Reactive QA and proactive assistance share this memory and access interface, differing in whether retrieval is initiated by a user query or the current situation. Across multiple benchmarks including the challenging MM-lifelong and EgoServe, GROVE achieves the best results among the compared methods. Controlled ablations show that the temporal strata and their access skills are complementary, with patterns providing the largest benefit when evidence spans multiple days. Code will be available at https://github.com/SitongGong/GROVE.', 'score': 13, 'issue_id': 2850, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '83876082552adf99', 'authors': ['Sitong Gong', 'Caixin Kang', 'Tianyu Yan', 'Guo Chen', 'Bo Zheng', 'Kaipeng Zhang', 'Yunzhi Zhuge', 'Xiang Ruan', 'Huchuan Lu', 'Yifei Huang'], 'affiliations': ['Alaya Lab', 'Dalian University of Technology', 'NVIDIA', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.02392.jpg', 'data': {'categories': ['#agents', '#video', '#benchmark', '#multimodal'], 'emoji': '🎥', 'ru': {'title': 'Единая многоуровневая память для видеоассистентов: ответы на вопросы и проактивная помощь', 'desc': 'GROVE — это обучаемая без обновления весов система для носимых ассистентов, которая строит единую иерархическую память из видеопотока, включая мелкие детали, временные эпизоды и повторяющиеся паттерны. Система поддерживает как реактивные ответы на вопросы пользователя, так и проактивное предложение информации на основе текущей ситуации, используя один интерфейс доступа для разных типов поиска. Каждый уровень памяти (детали, эпизоды, долгосрочные паттерны) имеет свой специализированный механизм поиска для оптимального извлечения информации на соответствующей шкале времени. Экспериментальные результаты на нескольких бенчмарках показывают, что многоуровневая структура памяти с временными стратами значительно улучшает качество извлечения информации, особенно при анализе данных, охватывающих несколько дней.'}, 'en': {'title': 'GROVE: Unified Memory for Reactive and Proactive Assistance', 'desc': 'The paper presents GROVE, a novel framework for wearable assistants that integrates memory and control into a single system. Unlike traditional methods that separate memory recall from proactive assistance, GROVE uses a continuous video stream to build a causal memory that can respond to user queries and situational needs. It organizes information into time-stamped moments and episodes, allowing for efficient retrieval of relevant data. The framework demonstrates superior performance on various benchmarks, highlighting the importance of temporal patterns in enhancing memory recall over extended periods.'}, 'zh': {'title': 'GROVE：智能助手的记忆与反应新模式', 'desc': '这篇论文介绍了一种名为GROVE的可穿戴助手框架，它能够同时回答关于视觉历史的问题，并识别这些历史在当前情境中的实用性。GROVE通过从连续的视频流中因果生长的单一记忆，支持反应式问答和主动辅助两种行为。该框架保留了细致的感知证据，并逐步将其整合为带时间戳的时刻、连贯的事件和跨天的重复模式。通过多个基准测试，GROVE在与其他方法的比较中取得了最佳结果，证明了其在长期记忆和检索技能方面的有效性。'}}}, {'id': 'https://huggingface.co/papers/2607.26451', 'title': 'ExplainBench: Evaluating Code Explanations from Agents', 'url': 'https://huggingface.co/papers/2607.26451', 'abstract': 'Abstract  Large Language Model (LLM) agents have seen rapid adoption in software engineering. As agents take a greater role in the actual generation of code, they are making larger changes, spanning tens to hundreds of lines. This makes manual review of agent results increasingly infeasible, leading developers to turn to explanations to understand enacted changes. Despite this, there are no benchmarks that evaluate the trustworthiness of agent-generated explanations. To bridge this gap, we propose ExplainBench, a benchmark to automatically evaluate explanations from coding agents. ExplainBench is based on the intuition that informative explanations should enable an LLM to correctly answer questions, allowing quantitative comparison of explanation quality between agents. With this observation, we construct a suite of questions that evaluates whether explanations accurately describe (1) the intended behavior of buggy code and (2) the effect of applying the agent patch itself. Experiments first reveal that explanation quality is a distinct axis of agent evaluation: ExplainBench ranks agents differently from the widely-used SWE-bench Verified benchmark. A deeper breakdown of explanation quality in agents shows frequent problems in explanations, such that explanations often claim that a patch is correct when it is not. Based on this insight, we implement and evaluate an explanation audit agent which runs additional tests to validate and refine explanations. This agent improved the explanations of all evaluated agents, demonstrating agent explanations can be automatically made more trustworthy.', 'score': 12, 'issue_id': 2850, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '69549f84583534c3', 'authors': ['Zhiyuan Pan', 'Sungmin Kang', 'Imam Nur Bani Yusuf', 'Abhik Roychoudhury'], 'affiliations': ['National University of Singapore', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26451.jpg', 'data': {'categories': ['#interpretability', '#open_source', '#plp', '#benchmark', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Проверка надежности объяснений кодирующих AI-агентов через автоматический бенчмарк', 'desc': 'Статья представляет ExplainBench — первый бенчмарк для оценки качества объяснений, которые генерируют агенты на основе больших языковых моделей при разработке кода. Авторы предлагают подход, основанный на идее, что информативные объяснения должны позволять LLM правильно ответить на вопросы о поведении кода и влиянии примененных патчей. Исследование выявило, что качество объяснений часто бывает неудовлетворительным и о
