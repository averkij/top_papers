    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.18359', 'title': 'Envisioning Agentic Robotics: A New Era of Robotic Systems', 'url': 'https://huggingface.co/papers/2611.18359', 'abstract': 'Abstract Agentic robotics, centered on an Embodied System 2 formed by a foundation model and embodied harness, requires a shared evaluation framework and research roadmap to achieve reliable physical autonomy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash The release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy. Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework, or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore, we identify the principles that carry over from digital to physical agents and the challenges that must be addressed to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively broader responsibility, from executing individual primitives to fulfilling standing roles.', 'score': 83, 'issue_id': 3538, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '0da6056866d64758', 'authors': ['Grid Robotics', ':', 'Qingfeng Lan', 'Duo Li', 'Siyao Li', 'Yiheng Lyu', 'Shijian Lu', 'Zhenghao Qi', 'Shizun Wang', 'Xinchao Wang', 'Ming Yang', 'Zhiqin Yang', 'Zuhao Yang', 'Tao Yu'], 'affiliations': ['Grid Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2611.18359.jpg', 'data': {'categories': ['#agi', '#benchmark', '#robotics', '#games', '#agents', '#survey'], 'emoji': '🤖', 'ru': {'title': 'От универсального разума к надёжному роботу-агенту в реальном мире', 'desc': 'Статья описывает новую парадигму агентной робототехники, где универсальная foundation model, дополненная embodied harness, выступает ядром принятия решений и работает в замкнутом цикле: наблюдение, рассуждение, вызов навыков и проверка результата. Авторы предлагают evaluation framework, оценивающий как возможности модели, так и производительность всей closed-loop системы в физическом мире. В работе выделяются принципы, переносимые из цифровых агентов в физических, и проблемы, связанные с ограничениями реального времени, механикой и необратимостью последствий. Итогом становится дорожная карта к sustained autonomy — надёжной и безопасной автономии с постепенно расширяющейся ответственностью.'}, 'en': {'title': 'From Foundation Models to Reliable Physical Autonomy', 'desc': 'The paper describes agentic robotics, where a foundation model and an embodied harness work together to control robots in open-ended tasks. The system repeatedly observes its surroundings, reasons about user goals, selects tools or skills, checks results, and adjusts its actions. The authors propose an evaluation framework that measures both model capabilities and the performance of the full closed-loop system under physical constraints. They also outline a research roadmap toward sustained autonomy, in which robots can take on broader responsibilities safely and reliably.'}, 'zh': {'title': '让通用推理落地为可靠的机器人自主行动', 'desc': '本文讨论一种新的机器人范式：智能体机器人，它用基础模型处理多种开放环境任务，而不是为每类任务单独训练策略。系统通过闭环流程观察环境、理解用户意图、推理任务、调用技能与工具、验证结果，并根据变化调整行动。作者将基础模型与具身执行框架构成的“具身系统 2”视为决策核心，并指出它必须在反应时间、机械限制和环境不确定性等物理约束下，把推理转化为有效且可验证的行动。为推动可靠的物理自主，文章提出同时评估模型能力与闭环系统表现的框架，并规划从执行单项技能到承担长期职责的研究路线。'}}}, {'id': 'https://huggingface.co/papers/2611.15789', 'title': 'VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender', 'url': 'https://huggingface.co/papers/2611.15789', 'abstract': 'Abstract  Controllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including scripts, photos, continuations, and reference videos. Each delivery is scored along two evaluation dimensions. Rule-based Scene Check re-runs the code and compares the exported 4D scene with hidden ground truth facts in nine dimensions. VLM-based Screen Check asks a VLM judge whether the facts that pass can be recognized in the proxy video. We analyze the evaluation results and trajectories of 11 frontier coding agents and identify three key observations. First, multimodal understanding separates the agents, especially in understanding space and camera motion. Second, all agents seem to already master basic camera work and staging, and fail at challenging requests. Third, agents inspect their own renders but fail to correct their errors. Agents thus need better visual understanding of space and camera, explicit checks for challenging requests, and item-by-item verification of renders against the brief.', 'score': 76, 'issue_id': 3539, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'dc889ce3bc776f08', 'pdf_title_img': 'assets/pdf/title_img/2611.15789.jpg', 'data': {'categories': ['#benchmark', '#agents', '#multimodal', '#video', '#3d'], 'emoji': '🎬', 'ru': {'title': 'Агенты умеют ставить кадр, но не умеют проверять, что увидели', 'desc': 'Статья представляет VibePrevisBench — бенчмарк для реконструкции 4D-сцен, где coding-агент по краткому описанию создаёт исполняемую сцену в Blender и рендерит её proxy-видео. Бенчмарк содержит 242 задачи с четырьмя типами входных данных: сценарии, фотографии, продолжения и референсные видео. Оценка проводится в два этапа: rule-based Scene Check повторно запускает код и сравнивает экспортированную сцену с эталонными фактами по девяти измерениям, а VLM-based Screen Check с помощью VLM-судьи проверяет, распознаются ли прошедшие проверку факты в видео. Анализ 11 передовых агентов показал, что ключевые слабости — понимание пространства и движения камеры, сложные запросы и неспособность исправлять собственные ошибки после проверки рендеров.'}, 'en': {'title': 'Build the scene, then verify every shot', 'desc': 'VibePrevisBench evaluates coding agents that turn briefs into executable 4D scenes and rendered proxy videos for controllable video generation. Its 242 tasks cover scripts, photos, continuations, and reference videos, and its two checks assess scene facts and whether those facts are visible in the render. Results from 11 advanced agents show that multimodal understanding, especially of space and camera motion, is a major point of difference. Agents handle basic staging but struggle with difficult requests and often fail to fix errors they notice, highlighting the need for stronger visual reasoning and systematic verification.'}, 'zh': {'title': '让智能体不只会搭场景，更要看懂空间、核对镜头并逐项验收', 'desc': '本文提出 VibePrevisBench，用于评测智能体能否根据文字或视觉素材重建可执行的 4D 场景，并渲染灰盒代理视频。基准包含 242 项任务，覆盖剧本、照片、续写内容和参考视频等输入。评测分为两部分：基于规则的场景检查会重新运行代码，并将导出的 4D 场景与隐藏的真实信息进行比较；基于视觉语言模型的画面检查则判断视频中是否能看出场景信息。对 11 种先进编程智能体的分析发现，它们在空间和镜头运动理解上差异明显，虽能完成基本镜头调度，却常无法满足高难度要求，也不善于根据渲染结果纠错。'}}}, {'id': 'https://huggingface.co/papers/2611.18397', 'title': 'Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent', 'url': 'https://huggingface.co/papers/2611.18397', 'abstract': 'Abstract Gamer is a generalist agent framework that integrates perception, memory, and multi-step reasoning, trained through continued pre-training, sparse-thinking instruction tuning, and multi-turn reinforcement learning to interact efficiently in 2D and 3D environments.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning. A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces and complex 3D simulated worlds. We first continue pre-training on a dataset constructed from tens of thousands of hours of device-level keyboard and mouse interaction. These trajectories span simulated games and embodied environments, allowing the model to learn environmental dynamics across both physical and virtual domains. Sparse-thinking instruction tuning then substantially reduces redundant computation while preserving the reasoning needed for complex decisions. We train the policy for long-horizon interaction with a stable multi-turn reinforcement learning method that addresses finite context windows, accumulated rollout errors, and sparse rewards. For real-time interaction, a cloud-edge inference engine serves numerous simulated game environments concurrently, supports unbounded-context execution, and keeps online inference latency low. Across multiple challenging 3D open-world games, Gamer demonstrates solid generalization and operational efficiency comparable to skilled players. It also achieves competitive results on a range of conventional 2D game benchmarks. These results suggest that even repetitive keyboard and mouse trajectories can support substantial gains from scaling data and learning algorithms. Training on these trajectories helps Gamer learn complex skills more steadily in environments with both physical and digital properties. This approach offers a path toward generalist agents that can interact across digital and physical worlds.', 'score': 66, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '9021cf5f2904bb1b', 'authors': ['Run Luo', 'Kuan Zhang', 'Qi Deng', 'Yukun Chen', 'Zhihao Yang', 'Yufei Zhang', 'Renrong Hu', 'Yi Zhang', 'Guiyu Ma', 'Tianyu Fan', 'Longze Chen', 'Hao Sun', 'Jiaming Li', 'Jiaming Yang', 'Xiaohao Liu', 'Tao Tan', 'Minzheng Wang', 'Hangtian Jia', 'Shuai Yuan', 'Lvdi Wang', 'Xiao Liu', 'Chao Ma', 'Yuting Zou', 'Yinhe Zheng', 'Xiaobo Xia', 'Dawei Jiang', 'Shaoqing Ren'], 'affiliations': ['Honkai AI R&D Team', 'miHoYo'], 'pdf_title_img': 'assets/pdf/title_img/2611.18397.jpg', 'data': {'categories': ['#data', '#training', '#robotics', '#agents', '#inference', '#optimization', '#games', '#video', '#agi', '#reasoning', '#rl'], 'emoji': '🎮', 'ru': {'title': 'Универсальный агент учится играть, как человек: масштабируем данные и алгоритмы', 'desc': 'Статья представляет Gamer — универсального агента для длительных задач в интерактивных средах, объединяющего восприятие, управление памятью и многошаговое рассуждение. Модель сначала дообучается (continued pre-training) на десятках тысяч часов записей действий клавиатуры и мыши в играх и физических средах, затем проходит sparse-thinking instruction tuning для снижения избыточных вычислений. Для обучения политики применяется стабильный multi-turn reinforcement learning, учитывающий ограниченный контекст, накопление ошибок и разреженные награды. Агент показывает хорошую генерализацию и эффективность в 3D открытых мирах, сопоставимую с опытными игроками, и конкурентные результаты в 2D играх.'}, 'en': {'title': 'One Agent, Many Worlds', 'desc': 'Gamer is a generalist agent that combines perception, memory, and multi-step reasoning to handle long tasks in 2D and 3D environments. It learns from large collections of keyboard and mouse interaction data, then receives instruction tuning that reduces unnecessary reasoning and multi-turn reinforcement learning to improve decision-making over extended interactions. Its shared system can operate across different environments while managing limited context, accumulated errors, and sparse rewards. Tests show that Gamer generalizes well and performs efficiently in several challenging 3D games and 2D game benchmarks.'}, 'zh': {'title': '从键鼠轨迹中学习，让智能体畅游虚实世界', 'desc': 'Gamer 是一种面向复杂交互环境的通用智能体，能够整合感知、记忆管理和多步推理，完成长期任务。研究者先用大量键盘和鼠标交互轨迹进行持续预训练，再通过稀疏思维指令微调减少不必要的推理计算，同时保留复杂决策能力。随后，研究者采用稳定的多轮强化学习训练策略，以应对上下文窗口限制、执行误差累积和奖励稀疏等问题。实验表明，Gamer 在多种 3D 开放世界游戏和 2D 游戏基准上表现出较强的泛化能力与交互效率。'}}}, {'id': 'https://huggingface.co/papers/2611.18482', 'title': 'MMFlash: Faster Speculative Decoding for Vision-Language Models', 'url': 'https://huggingface.co/papers/2611.18482', 'abstract': 'Abstract MMFlash improves multimodal speculative decoding by adaptively upweighting visually dependent tokens and using sparse attention for long video, yielding up to 3.58× lossless speedup.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Speculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that acceptance rates decrease from 46% in the lowest visual-dependence quartile to 22% in the highest, with this disparity persisting after multimodal training. Motivated by this observation, we propose MMFlash, a simple and effective framework that adaptively upweights visually dependent tokens that the drafter predicts poorly. For long video inputs, MMFlash further employs sparse attention to reduce redundant attention computation and improve drafting quality. Across various multimodal benchmarks, MMFlash achieves lossless decoding speedups of up to 3.58times, outperforming EAGLE-3 and DFlash by up to 195.4% and 17.1%, respectively.', 'score': 32, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '6f11a783281fa006', 'authors': ['Sicheng Feng', 'Zigeng Chen', 'Song Wang', 'Gongfan Fang', 'Xinchao Wang'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.18482.jpg', 'data': {'categories': ['#inference', '#optimization', '#multimodal', '#video'], 'emoji': '⚡', 'ru': {'title': 'Драфтер, который видит картинку: быстрее без потери качества', 'desc': 'Статья посвящена ускорению генерации мультимодальных LLM с помощью speculative decoding, где лёгкая модель-драфтер предлагает блок токенов, а целевая модель проверяет их параллельно. Авторы вводят метрику визуальной зависимости токена на основе KL-дивергенции между распределениями следующего токена с изображением и без него. Выяснено, что accept rate у диффузионного драфтера DFlash падает с 46% до 22% при росте визуальной зависимости, и это расхождение сохраняется после мультимодального обучения. Метод MMFlash адаптивно повышает веса визуально зависимых токенов и использует разреженное внимание для длинных видео, достигая lossless-ускорения до 3.58× и превосходя EAGLE-3 и DFlash.'}, 'en': {'title': 'Draft smarter for faster multimodal decoding', 'desc': 'The paper studies speculative decoding, where a small model drafts tokens for a larger model to verify. It measures how much each token depends on visual input and finds that visually dependent tokens are harder to accept. MMFlash improves drafting by giving extra weight to visually dependent tokens the drafter predicts poorly, and uses sparse attention for long videos. It achieves lossless decoding speedups of up to 3.58× on multimodal benchmarks.'}, 'zh': {'title': '抓住视觉关键词元，让多模态解码快至 3.58 倍', 'desc': '本文研究多模态推测解码：轻量级草稿模型先提出一批候选词元，再由目标模型并行验证。作者用有无视觉输入时下一词元分布的 KL 散度衡量词元对视觉信息的依赖程度，并发现视觉依赖越强，候选词元的接受率越低。为此，MMFlash 会自适应地提高草稿模型难以预测的高视觉依赖词元的权重；处理长视频时，还使用稀疏注意力减少冗余计算并改善草稿质量。在多个多模态基准上，MMFlash 在不损失解码结果的前提下，速度最高提升 3.58 倍，并优于 EAGLE-3 和 DFlash。'}}}, {'id': 'https://huggingface.co/papers/2611.17831', 'title': 'V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations', 'url': 'https://huggingface.co/papers/2611.17831', 'abstract': 'Abstract Counterfactual supervision over pixel transformations enables language models to read motion dynamics from frozen predictive video encoders, yielding V-JEPA-LM models that outperform open video LLMs across benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash World-model video encoders such as V-JEPA learn how scenes change (direction, speed, order, state) from video alone. To answer questions, they are joined to a language model trained on captions and question-answer pairs. But each caption or question names only a few attributes of a clip, so the model learns to retrieve those attributes rather than to read the clip, and the dynamics the encoder carries go unused: on the same items, a linear probe reads speed from frozen V-JEPA features at 87% while the VLM answers at chance. We show where dynamics lives in a frozen encoder: in a subspace shared across videos for predictive encoders such as V-JEPA, but not as a shared component of frame-wise, text-aligned encoders such as SigLIP. We then build counterfactual supervision that makes the language model read it: pixel transformations turn public videos into answer-balanced variants whose answers are set by the transformation and differ only in the change. Trained in a single stage on 4.53M public samples with 32 visual tokens per frame, where open video LLMs use several stages, 9M to 172M samples and 64 to 256 tokens per frame on average, the resulting V-JEPA-LM models (1B to 8B, Qwen3 and Llama) lead every size class in average score across eleven video benchmarks; our 4B model scores 72.1, against 61.1 for the best open 4B and 64.8 for the best open 8B model. A controlled encoder x supervision study shows that the encoder decides what can be read and the supervision what is read: at a matched budget, counterfactual supervision adds 4.5 points on average and 38 on the speed questions of natural benchmarks. Code and models: https://github.com/kkt94/Llama-V-JEPA-LM.', 'score': 18, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '8dd534654d7ddb59', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#data', '#training', '#small_models', '#synthetic', '#multimodal', '#interpretability', '#video', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Энкодер видит движение, но модель должна научиться его читать', 'desc': 'Авторы показывают, что энкодеры видео-мира вроде V-JEPA хранят информацию о динамике сцены (направление, скорость, порядок) в общем подпространстве, чего не делают покадровые энкодеры вроде SigLIP. Обычное обучение LLM на подписях и вопросах-ответах заставляет модель извлекать отдельные атрибуты, а не «читать» динамику клипа. Для решения проблемы предложено контрфактическое обучение: трансформации пикселей создают сбалансированные по ответам варианты видео, где отличается только изменение. Модели V-JEPA-LM (1–8B), обученные одним этапом, превосходят открытые video LLM на одиннадцати бенчмарках.'}, 'en': {'title': 'Teach Language Models to Read Motion, Not Just Describe Videos', 'desc': 'The paper shows that frozen V-JEPA video encoders contain motion information, such as speed and direction, in features shared across videos. Yet language models often fail to use this information when trained only on captions and question-answer pairs. The authors create counterfactual training examples by transforming video pixels so that the correct answer depends on how the video changes, teaching the language model to read motion dynamics. Their V-JEPA-LM models outperform open video language models across eleven benchmarks, with counterfactual supervision improving average scores by 4.5 points and speed-question scores by 38 points.'}, 'zh': {'title': '用反事实监督，读出视频里的运动变化', 'desc': '本文研究如何让语言模型读懂视频中的运动变化。作者发现，冻结的预测式视频编码器 V-JEPA 已经包含速度、方向和顺序等信息，但常规字幕与问答训练没有教会语言模型读取这些信息。为此，他们通过像素变换生成答案平衡的反事实样本，使样本之间仅在运动变化上不同，并用这些样本训练 V-JEPA-LM。该模型在十一项视频基准测试中超过同等规模的开放视频语言模型，实验也表明编码器决定可读取的信息，而监督方式决定模型实际读取什么。'}}}, {'id': 'https://huggingface.co/papers/2611.12901', 'title': 'Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding', 'url': 'https://huggingface.co/papers/2611.12901', 'abstract': 'Abstract StepRefine, a plug-and-play decoding strategy, mitigates hallucinations in multimodal diffusion language models by switching between discrete denoising and latent refinement based on entropy spikes and distributional stability.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advancements in multimodal diffusion language models (MDLMs) have exhibited strong global modeling capabilities through iterative refinement. We observe that mask uncertainty follows an overall downward trend during iterative denoising, while a few denoising steps exhibit localized entropy spikes closely associated with hallucinations. We argue that anomalous steps can be identified by measuring the entropy deviation of each denoising step from its neighboring temporal window. We hypothesize that discrete token commitment discards the distributional information at masked positions, limiting the continued interaction between candidate semantics and the context during entropy spikes. With this goal, we present StepRefine, a plug-and-play decoding strategy that leverages semantic context to achieve reliable denoising. The core of our method lies in a step-aware switch between discrete denoising and latent refinement. The model employs probability-weighted embeddings at entropy spike steps to preserve diverse reasoning hypotheses and performs multiple rounds of continuous refinement. Meanwhile, a refinement controller monitors distributional stability to reduce unnecessary loops and switch the model back to standard discrete denoising. Through extensive experiments, StepRefine demonstrates significant hallucination mitigation across different MDLMs on multimodal benchmarks.', 'score': 18, 'issue_id': 3538, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': 'd3e47188ddfc04cd', 'authors': ['Zhongxing Xu', 'Zhonghua Wang', 'Zhe Qian', 'Shiyan Su', 'Ming Hu', 'Xiaocheng Zou', 'Wei Feng', 'Mingquan Lin', 'Yuyin Zhou', 'Yifan Peng', 'Hamid Rezatofighi', 'Zongyuan Ge'], 'affiliations': ['Cornell University', 'Monash University', 'Northeastern University', 'UC Santa Cruz', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2611.12901.jpg', 'data': {'categories': ['#inference', '#diffusion', '#multimodal', '#hallucinations'], 'emoji': '🧠', 'ru': {'title': 'Не фиксируй токен раньше времени: плавное уточнение снижает галлюцинации', 'desc': 'Статья представляет StepRefine — декодирующую стратегию, которая не требует переобучения модели и снижает галлюцинации в мультимодальных диффузионных языковых моделях (MDLM). Авторы замечают, что на отдельных шагах итеративного шумоподавления энтропия резко возрастает, и такие аномальные шаги связаны с галлюцинациями. Метод переключается между дискретным шумоподавлением и непрерывным латентным уточнением: на шагах со скачком энтропии используются вероятностно взвешенные эмбеддинги, которые сохраняют разные гипотезы. Контроллер уточнения следит за стабильностью распределения, чтобы не делать лишних циклов, и экспериментально показано значительное снижение галлюцинаций на мультимодальных бенчмарках.'}, 'en': {'title': 'Refine at the Spikes, Reduce Hallucinations', 'desc': 'StepRefine is a plug-and-play decoding method that reduces hallucinations in multimodal diffusion language models. It detects unusual denoising steps by measuring entropy spikes relative to nearby steps. At these steps, it uses probability-weighted embeddings and continuous latent refinement to preserve alternative token hypotheses and their context. A controller tracks distributional stability, stopping refinement and returning to discrete denoising when appropriate.'}, 'zh': {'title': '在熵峰值处保留多种可能，让生成少些幻觉', 'desc': '这篇论文提出 StepRefine，一种可直接接入多模态扩散语言模型的解码策略，用来减少生成中的幻觉。作者发现，去噪过程中的不确定性整体会下降，但少数步骤会出现局部熵峰值，这些异常常与幻觉有关。遇到熵峰值时，StepRefine 使用按概率加权的嵌入进行潜在空间细化，以保留多个候选语义及其分布信息，并让它们继续结合上下文进行推理。细化控制器会监测分布稳定性，在不再需要细化时切回离散去噪；实验表明，该方法能在多个多模态基准上减少幻觉。'}}}, {'id': 'https://huggingface.co/papers/2611.12068', 'title': 'MIRIX-2.0: Multi-Agent Memory System', 'url': 'https://huggingface.co/papers/2611.12068', 'abstract': "Abstract MIRIX-2.0 is a multi-agent memory system for LLM agents that achieves high accuracy and efficiency across QA and procedural benchmarks without fine-tuning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Long-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest baseline by 14.3 points, and with AutoDream disabled it gains 31.0 and 22.0 points over HyperMem on single-hop and multi-hop document QA. As procedural memory, it yields the highest mean success among the compared memory methods on ALFWorld and WebShop and reaches 49.2% on MetaClaw-Bench, against 44.0% for MetaClaw's skill library. Six typed memory agents keep complete records as the system of record, and a provenance hypergraph indexes episodic and semantic records with n-ary frames that cite their rows. Retrieval runs under explicit budgets, so the evidence a question inspects does not grow with the history. AutoDream merges duplicate anchors outside the write path without rewriting any record, and it distills task sessions into skills. With AutoDream disabled, MIRIX-2.0 answers faster than HyperMem on all five timed benchmarks. It needs no fine-tuning, runs with closed and open models, and its code is public.", 'score': 16, 'issue_id': 3539, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '44ba052c51fad192', 'authors': ['Wei-Chieh Huang', 'Weizhi Zhang', 'Jiayan Nan', 'Peng Xia', 'Yu Wang'], 'affiliations': ['MIRIX AI', 'Tongji University', 'University of California, San Diego', 'University of Illinois Chicago', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2611.12068.jpg', 'data': {'categories': ['#benchmark', '#agents', '#long_context', '#open_source', '#alignment', '#rag'], 'emoji': '🧠', 'ru': {'title': 'Память LLM-агентов без дообучения: точно, быстро и без потерь деталей', 'desc': 'В статье представлена MIRIX-2.0 — мультиагентная система долговременной памяти для LLM-агентов, которая не требует fine-tuning. Память хранится в виде полных записей, которые индексируются через provenance hypergraph с n-арными фреймами, ссылающимися на исходные строки. Поиск выполняется при явных бюджетах, поэтому объём просматриваемых данных не растёт вместе с историей, а модуль AutoDream объединяет дубликаты и преобразует сессии в навыки. Система показывает лучшую точность на QA-бенчмарках (LoCoMo, LongMemEval-S), высокие результаты в процедурной памяти (ALFWorld, WebShop, MetaClaw-Bench) и более быстрые ответы, чем HyperMem.'}, 'en': {'title': 'Give AI agents reliable memory without growing the search', 'desc': 'MIRIX-2.0 is a multi-agent memory system that helps language model agents remember facts and useful procedures without fine-tuning. Six specialized agents store complete records, while a provenance hypergraph links evidence and supports retrieval within fixed budgets. It performs strongly on question-answering and task benchmarks, often outperforming the compared memory systems, and answers faster than HyperMem on five timed benchmarks when AutoDream is disabled. AutoDream can organize duplicate memory anchors and turn task sessions into reusable skills without rewriting stored records.'}, 'zh': {'title': '完整保存记忆，预算内精准检索', 'desc': 'MIRIX-2.0 是一种用于大型语言模型智能体的多智能体记忆系统，无需微调即可支持个性化问答和复用任务经验。它让六种不同类型的记忆智能体保存完整记录，并用来源可追溯的超图索引情景记忆与语义记忆。检索过程设有明确的预算，因此即使历史记录不断增长，回答问题时需要检查的证据量也不会随之增加；系统还可在写入流程之外合并重复信息，并将任务经历提炼为技能。实验显示，它在多项问答和程序性任务基准上取得领先或较高成绩，并且在关闭自动整理功能时，回答速度也快于 HyperMem。'}}}, {'id': 'https://huggingface.co/papers/2611.18549', 'title': 'JVT: Just Video Transformer makes pixel-space video diffusion simple', 'url': 'https://huggingface.co/papers/2611.18549', 'abstract': 'Abstract JVT, a simple large-patch DiT-style Transformer, enables pixel-space video diffusion without pretrained autoencoders or U-Net skip connections, achieving competitive quality and supporting joint camera-conditioned RGB-disparity generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Direct diffusion modeling of high-dimensional raw video data is challenging, and existing pixel-space methods often rely on specialized architectures. We introduce JVT (Just Video Transformer), a simple large-patch DiT-style Transformer for pixel-space video diffusion, without a pretrained autoencoder, auxiliary detailers, cascaded stages, or U-Net-style skip connections. We systematically examine video patch embeddings, register tokens, and adaptive layer normalization to identify design choices that balance generation quality and computational efficiency. The resulting JVT design achieves generation quality competitive with latent diffusion baselines in both class-conditioned and unconditional settings. The pixel-space formulation of JVT also naturally supports joint generation of pixel-aligned modalities. We demonstrate this capability through camera-conditioned RGB-disparity generation, which improves camera following relative to RGB-only baselines and yields explicit scene geometry without an additional reconstruction model at inference. These results highlight the potential of simple DiT-style Transformers for pixel-space video diffusion, and we hope our findings offer useful insights and practical guidance for future research.', 'score': 14, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '77e367fad8ecaf88', 'authors': ['Jianjun Zhou', 'Hua Geng', 'Haoyu Guo'], 'affiliations': ['Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.18549.jpg', 'data': {'categories': ['#training', '#multimodal', '#video', '#3d', '#architecture', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Простой Transformer способен генерировать видео прямо из пикселей', 'desc': 'Статья представляет JVT (Just Video Transformer) — простой DiT-подобный Transformer с крупными патчами для диффузионной генерации видео прямо в пространстве пикселей, без предобученного автоэнкодера и U-Net-подобных skip connections. Авторы систематически исследуют эмбеддинги видеопатчей, register tokens и adaptive layer normalization, чтобы найти баланс между качеством генерации и вычислительной эффективностью. Модель достигает качества, сопоставимого с latent diffusion baseline в условиях class-conditioned и unconditional генерации. Дополнительно показано совместное генерирование RGB и disparity с управлением камерой, что улучшает следование траектории камеры и даёт явную геометрию сцены без отдельной модели реконструкции.'}, 'en': {'title': 'Simple Transformers, Direct Pixel-Space Video', 'desc': 'JVT is a simple Transformer model that generates video directly in pixel space using diffusion. It uses large patches and does not need a pretrained autoencoder, U-Net skip connections, or extra generation stages. The design choices, including patch embeddings, register tokens, and adaptive layer normalization, are tested to balance video quality and computational cost. JVT matches the quality of latent diffusion models and can jointly generate camera-conditioned RGB video and disparity maps, providing explicit scene geometry.'}, 'zh': {'title': '用简洁的 DiT Transformer，在像素空间直接生成高质量视频', 'desc': '本文提出 JVT（Just Video Transformer），一种采用大尺寸图像块的 DiT 风格 Transformer，用于直接在像素空间生成视频。它不依赖预训练自动编码器、U-Net 跳跃连接、级联阶段或辅助细节增强器，并系统研究视频块嵌入、寄存器令牌和自适应层归一化等设计。实验表明，JVT 在类别条件生成和无条件生成中的质量可与潜空间扩散基线相竞争，同时兼顾计算效率。JVT 还支持联合生成像素对齐的模态；在相机条件下联合生成 RGB 图像与视差图，可改善对相机运动的跟随，并直接提供场景几何信息。'}}}, {'id': 'https://huggingface.co/papers/2611.18338', 'title': 'MEM-SQL: Memory-Empowered Text-to-SQL', 'url': 'https://huggingface.co/papers/2611.18338', 'abstract': "Abstract A history-aware benchmark and memory-powered method improve Text-to-SQL accuracy and reduce cost by reusing verified SQL components and consulting schemas on demand.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Text-to-SQL systems translate natural language questions into SQL queries over increasingly complex databases. However, widely used benchmarks evaluate questions independently, overlooking settings where earlier queries over the same database can supply joins or calculations for a new question. We introduce HARE (History-AwaRe Text-to-SQL BEnchmark) to measure the accuracy and cost of adapting historical SQL. HARE comprises 1,600 requests derived from a fixed pool of 823 verified queries across four datasets. Annotations record which components each request preserves and which edits it requires, distinguishing whole-query adaptation from partial reuse. Our method, MEM-SQL (Memory-EMpowered Text-to-SQL), stores whole-query templates, reusable SQL blocks, and mappings from domain concepts to schema elements. MEM-SQL uses a layer only if every requirement assigned to it has a match above that layer's threshold. With On-demand Schema Linking (OSL), MEM-SQL consults the schema only when no layer qualifies or the generator judges retrieved evidence insufficient. Across six language models on HARE, mean execution accuracy rises from 37.1% for Direct Generation without history to 50.0% for MEM-SQL, with 76.6% fewer input tokens and 68.8% lower latency on average. Further analysis shows that requests reusing several verified queries remain a bottleneck, with accuracy falling from 56.7% to 29.7%, most sharply when reused components must be placed in a new query structure or combined with a shared join. Applying OSL to three other memory designs consistently reduces generation cost, while its accuracy benefit depends on the memory design. Verified history can thus make generation both more accurate and cheaper, but its value depends on the evidence retained and when the system consults the schema.", 'score': 14, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '809872f3295af6d6', 'authors': ['Xiaoqi Wang', 'Wenqi Pei', 'Shizheng Hou', 'Yilai Liu', 'Han Chen', 'Boyan Li', 'Yuyu Luo', 'Hongyang Du'], 'affiliations': ['National University of Singapore', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2611.18338.jpg', 'data': {'categories': ['#benchmark', '#data', '#plp', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'Память о прошлых запросах делает Text-to-SQL точнее и дешевле', 'desc': 'Статья представляет HARE — новый бенчмарк для Text-to-SQL, который оценивает, насколько хорошо модели переиспользуют ранее проверенные SQL-запросы над той же базой данных. Авторы предлагают MEM-SQL — метод на основе памяти, хранящей шаблоны запросов, reusable SQL-блоки и отображения доменных концепций на элементы схемы, с выбором слоя по порогу совпадения. Механизм On-demand Schema Linking (OSL) обращается к схеме только тогда, когда память не даёт достаточных доказательств, что снижает количество входных токенов и задержку. Эксперименты показывают рост средней execution accuracy с 37.1% до 50.0% и значительное удешевление генерации, однако запросы, требующие комбинирования нескольких запросов из истории, остаются сложными.'}, 'en': {'title': 'Reuse trusted SQL to answer new questions more accurately and cheaply', 'desc': 'The paper introduces HARE, a benchmark that tests whether Text-to-SQL systems can reuse verified SQL from earlier questions on the same database. It also proposes MEM-SQL, which stores complete query templates, reusable SQL blocks, and links between domain concepts and database schema elements. Across six language models, MEM-SQL improves execution accuracy from 37.1% to 50.0%, while using fewer input tokens and reducing latency. Reusing several queries at once remains difficult, so the system’s success depends on what it remembers and when it checks the schema.'}, 'zh': {'title': '让已验证的 SQL 记忆提升准确率、降低生成成本', 'desc': '本文提出 HARE 基准，用来评估 Text-to-SQL 系统如何利用同一数据库中已验证的历史 SQL，并衡量准确率与生成成本。作者还提出 MEM-SQL，它会保存完整查询模板、可复用的 SQL 片段，以及领域概念与数据库模式元素之间的映射。系统只有在检索到的证据达到置信度阈值时才使用相应记忆层，并通过按需模式链接，仅在证据不足时查询数据库模式。在六种语言模型上的实验中，MEM-SQL 将执行准确率从 37.1% 提升到 50.0%，同时减少输入词元和延迟；但当多个历史查询需要组合或改写结构时，准确率仍会下降。'}}}, {'id': 'https://huggingface.co/papers/2611.07226', 'title': 'Loopback Transformer: Towards a Unified View of Residual Looped Transformers', 'url': 'https://huggingface.co/papers/2611.07226', 'abstract': "Abstract A looped Transformer that separately controls input strength, total update weight, and per-update allocation achieves lower validation loss and higher downstream accuracy than standard and looped residual baselines while using fewer parameters.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looped Transformers reduce parameter count by repeatedly applying shared blocks, but parameter sharing alone does not determine how the results of repeated computation are reused. We take the depth-memory view of residual connections and analyze which representation is stored after each block application and how later reads weight it. A full block output contains both its input and its new update, so weighting that output also reweights the history already carried by the input. Reading individual updates instead, with the shared stack's input kept on a separate path, gives separate controls over input strength, total update weight, and allocation across updates. The Loopback Transformer implements these controls: geometric decay sets the total update weight and supplies a recency prior, and attention learns how to allocate that weight. On ClimbMix, Loopback reaches lower validation loss than standard Transformer baselines with 40-75% of their Transformer parameters (excluding token embeddings and the output head) at reference scales from 191M to 3B, with training tokens and executed depth matched. It also has higher mean accuracy over thirteen downstream tasks at 1.4B and 3B. At 191M, 374M, and 778M, it has the lowest validation loss and the highest thirteen-task mean among the standard Transformer and seven looped residual designs.", 'score': 14, 'issue_id': 3538, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '992c684605c9f385', 'authors': ['Xuan Ouyang', 'Zefan Cai', 'Chenlong Zhang', 'Cheng Luo', 'Ke Wan', 'Junjie Hu'], 'affiliations': ['California Institute of Technology', 'Microsoft', 'University of California, Santa Barbara', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2611.07226.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '🔁', 'ru': {'title': 'Умное управление повторными обновлениями: меньше параметров, выше качество', 'desc': 'В статье предлагается Loopback Transformer, зацикленная архитектура, которая повторно применяет общие блоки и отдельно управляет силой входного сигнала, общим весом обновлений и их распределением между итерациями. Вход общего стека передаётся по отдельному пути, а отдельные обновления взвешиваются через геометрическое затухание и механизм attention, который обучается распределять вес. На датасете ClimbMix модель при меньшем числе параметров (40–75% от стандартного Transformer) достигает более низкого validation loss и более высокой средней точности на тринадцати downstream-задачах. Преимущество сохраняется в диапазоне от 191M до 3B параметров по сравнению со стандартными Transformer и семью вариантами looped residual архитектур.'}, 'en': {'title': 'Reuse the blocks; control how each update counts.', 'desc': 'Looped Transformers reuse the same blocks to reduce parameter count, but ordinary residual connections mix each new update with the input history. The Loopback Transformer keeps the input on a separate path and reads individual updates, independently controlling input strength, total update weight, and how weight is distributed across updates. A geometric decay provides a preference for recent updates, while attention learns their allocation. On ClimbMix, Loopback achieves lower validation loss and higher downstream accuracy than standard and looped residual baselines, using 40–75% as many Transformer parameters at the reported scales.'}, 'zh': {'title': '让每次更新各尽其用：更少参数，获得更强的循环 Transformer', 'desc': '循环 Transformer 通过反复使用共享模块来减少参数，但如何融合每次计算产生的结果同样重要。论文指出，直接读取完整模块输出会同时改变输入表示和新产生的更新，因此提出将输入路径与各次更新分开处理。Loopback Transformer 用几何衰减控制更新的总权重，并让注意力机制学习如何在不同更新之间分配权重。实验显示，在匹配训练 token 数和计算深度时，它以更少参数取得更低的验证损失，并在多项下游任务上获得更高准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.17814', 'title': 'G-CAST: Governed Continual Self-Training for E-Commerce Agents under Evolving Demands', 'url': 'https://huggingface.co/papers/2611.17814', 'abstract': "Abstract  With the rapid advancement of Large Language Models (LLMs), an increasing number of users are turning to LLM-powered agents for conversational shopping in e-commerce. However, the user needs continue to change as new product categories, procurement scenarios, and feature requests emerge. At the same time, the product's execution harness-including its tools, skills, and operating procedures-continues to evolve to support increasingly sophisticated interactions. These changes create two practical challenges: 1) Demand drift alters the distribution, intent, and complexity of user requests, causing a model trained once to fall behind; 2) Harness evolution requires the model to use newly introduced capabilities correctly without losing behavior that users already rely on. Periodic manual retraining is too delayed and labor-intensive for this setting. To address these challenges, we present G-CAST, a governed continual self-training system that converts daily production evidence under evolving demand and capability contracts into reward-routed, entropy-prioritized training data and governed reward evolution. Governed checkpoint transition under cumulative evaluation controls each model update, enabling the agent to learn newly introduced behaviors without sacrificing previously accepted capabilities. Experiments on a real production e-commerce agent show that G-CAST achieves stronger adaptation to newly introduced demand while better preserving previously accepted behavior compared with a strong autonomous post-training baseline. Ablations further show that both reward-routed, entropy-prioritized data orchestration and governed reward evolution are important to these gains. G-CAST is now deployed in Yuancai(http://cai.1688.com/), a B2B procurement agent on Alibaba's 1688 platform.", 'score': 12, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '306c57e1957348e1', 'authors': ['Yuechun Yu', 'Wenzheng Kong', 'Xiaofeng Mao', 'Jin Zhang'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.17814.jpg', 'data': {'categories': ['#agents', '#data', '#training', '#rlhf'], 'emoji': '🛒', 'ru': {'title': 'Самообучающийся закупщик, который не забывает старое', 'desc': 'В статье представлена система G-CAST, предназначенная для непрерывного самообучения LLM-агентов в e-commerce, когда спрос пользователей и набор инструментов меняются со временем. Авторы предлагают превращать ежедневные данные продакшена в обучающую выборку с маршрутизацией по reward и приоритизацией по энтропии, а также управляемо эволюционировать функцию награды. Обновления модели контролируются через переходы между чекпоинтами с кумулятивной оценкой, что позволяет осваивать новое поведение без потери уже принятых навыков. Эксперименты на реальном агенте 1688 показывают лучшую адаптацию и сохранение прежнего поведения по сравнению с сильным автономным baseline, а система уже развернута в B2B-агенте Yuancai.'}, 'en': {'title': 'Learn What’s New Without Forgetting What Works', 'desc': 'G-CAST helps an e-commerce agent adapt as customer requests and available tools change. It turns daily production data into training examples, prioritizing uncertain cases and routing them according to rewards. Each model update is checked against a cumulative evaluation so it can learn new behaviors while preserving capabilities users already rely on. Tests on a real B2B shopping agent show better adaptation and retention than a strong autonomous post-training baseline.'}, 'zh': {'title': '持续学习新需求，稳稳守住旧能力', 'desc': '这篇论文提出 G-CAST，一种用于电商对话智能体的持续自训练系统，可应对用户需求变化和工具能力不断更新的问题。它从每日生产数据中筛选训练样本，并依据奖励信号分配样本、优先处理模型不确定性较高的内容，同时管理奖励机制的演进。每次模型更新都要经过累积评估和受控检查点切换，以学习新能力并尽量保留已被认可的旧行为。真实电商场景实验表明，G-CAST 比自主后训练基线更能适应新需求、维持原有能力，目前已部署于阿里巴巴 1688 的 B2B 采购智能体。'}}}, {'id': 'https://huggingface.co/papers/2611.17820', 'title': 'Aligning AI Teams', 'url': 'https://huggingface.co/papers/2611.17820', 'abstract': "Abstract Alignment training on individual LLM agents often fails to transfer to multi-agent teams, but designating a safety lead and having a coordinator publish safety specifications can restore single-agent alignment.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Previous work has shown that alignment training on individual LLM agents can fail to transfer to multi-agent settings. We investigate the underlying mechanisms for this failure, and explore interventions to preserve alignment transfer to multi-agent LLM teams. We focus on two software-engineering tasks (sepsis triage, a news recommender) and ten consulting-proposal generation tasks. We present four findings: (1) The single-vs-team safety gap does not show a clear trend with more capable models. We find that Anthropic's Mythos Preview shows the largest gap on one of our tasks but the smallest on another; (2) Many natural interventions, such as having agents critique each other's work or coordinate in a group chat, do not reliably bring agent teams back to single-agent alignment behavior; (3) diffusion of responsibility substantially accounts for the safety gap: agents in teams are less likely to proactively check for system-level safety failures and more likely to ignore, rationalize, or deflect responsibility for issues when they arise; (4) having a designated safety lead agent ensure system-level safety, and having a coordinator agent publish a safety specifications document are effective at restoring single-agent alignment. We also release magelab, a multi-agent LLM orchestration and experimentation framework. Our findings can help practitioners design agent teams that successfully preserve the behaviors expected of aligned individual agents.", 'score': 10, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'd92b87006809ddad', 'authors': ['Siddarth Srinivasan', 'Morgan Jane Matthews', 'Jascha Sohl-Dickstein', 'Erik Jones'], 'affiliations': ['Anthropic', 'Constellation Institute', 'Harvard University'], 'pdf_title_img': 'assets/pdf/title_img/2611.17820.jpg', 'data': {'categories': ['#agents', '#benchmark', '#open_source', '#alignment'], 'emoji': '🤝', 'ru': {'title': 'Безопасность команды агентов держится на чёткой ответственности', 'desc': 'В статье исследуется, почему выравнивание (alignment) отдельных LLM-агентов часто не переносится на многоагентные команды. Авторы сравнивают безопасность одиночных агентов и команд на задачах разработки ПО и генерации консалтинговых предложений и показывают, что разрыв не связан напрямую с возможностями модели. Основная причина — размытие ответственности (diffusion of responsibility): агенты в команде реже проверяют системные риски и чаще перекладывают ответственность. Эффективными оказались назначение агента-ответственного за безопасность (safety lead) и публикация координатором спецификации безопасности, которые восстанавливают поведение одиночного агента.'}, 'en': {'title': 'Give Agent Teams a Safety Lead and a Shared Safety Plan', 'desc': 'This paper studies why safety alignment trained in a single large language model (LLM) may not carry over to teams of agents. Across several tasks, the authors find that team members often take less initiative to spot system-level safety problems and may shift or dismiss responsibility when problems occur. Common approaches, such as peer critique and group chat, do not reliably close this safety gap. Assigning a safety lead and having a coordinator publish a safety specification can help restore the single-agent safety behavior.'}, 'zh': {'title': '明确安全责任，让多智能体团队守住对齐底线', 'desc': '本文研究单个大语言模型经过安全对齐训练后，为什么这些安全行为未必能迁移到多智能体团队。研究发现，团队中的责任分散会让智能体较少主动检查整体安全问题，也更容易忽视、辩解或推卸责任；常见的互相批评和群聊协调并不能稳定解决这一问题。指定一名安全负责人来保障系统级安全，或让协调者发布安全规范文档，都能有效恢复单智能体的对齐行为。研究还发现，安全迁移差距不会随着模型能力增强而呈现明确趋势，并发布了用于多智能体编排与实验的框架 magelab。'}}}, {'id': 'https://huggingface.co/papers/2611.16439', 'title': 'HALO: Human-Aligned Data Collection for WhoLe-body MObile Manipulation', 'url': 'https://huggingface.co/papers/2611.16439', 'abstract': "Abstract  Learning whole-body mobile manipulation requires demonstrations that coordinate bimanual actions with locomotion across extended workspaces. However, existing interfaces trade off direct robot control, perception and action alignment, and natural operator mobility, making such demonstrations difficult to collect. We introduce HALO, a human-aligned data collection system for whole-body mobile manipulation. The system aligns the operator's perception and action space with the robot while preserving direct physical feedback and natural locomotion. Operators guide the robot end-effectors through kinesthetic teaching and move a low-resistance platform without the deployed mobile base while performing bimanual manipulation. This interface enables more natural whole-body demonstrations, but the close human-robot coupling introduces discrepancies between the demonstration and deployment settings. We address these discrepancies with deployment-aligned demonstration processing, which calibrates and temporally aligns platform motion with the deployed base response and masks and inpaints demonstrator hands in recorded observations. Compared with Mobile ALOHA and VR teleoperation, HALO enables up to 2.9x faster demonstration collection while maintaining comparable or higher success rates. Policies trained with HALO perform precise manipulation tasks, including zip-tie fastening, and achieve a 73.3% success rate on a six-stage long-horizon mobile manipulation task involving repeated coordinated base and arm motion. Project page: https://robbyant-research.github.io/Lingbot-ALOHA/", 'score': 10, 'issue_id': 3538, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '811c4f37df990728', 'authors': ['Shuai Yang', 'Fangyi Xu', 'Yishu Shen', 'Kecheng Zheng', 'Yinghao Xu'], 'affiliations': ['Robbyant', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.16439.jpg', 'data': {'categories': ['#data', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Естественные демонстрации человека — основа умного мобильного робота', 'desc': 'Статья представляет HALO — систему сбора демонстраций для обучения whole-body mobile manipulation, то есть согласованных движений двуруких манипуляций и перемещения робота. Оператор напрямую направляет концевые эффекторы робота через kinesthetic teaching и двигает низкосопротивляемую платформу без работающей базы, что сохраняет физическую обратную связь и естественную мобильность человека. Чтобы устранить расхождения между условиями записи и развёртывания, авторы применяют обработку демонстраций: калибровку и временное выравнивание движения платформы с откликом базы, а также маскирование и inpainting рук оператора на записанных наблюдениях. По сравнению с Mobile ALOHA и VR-телеуправлением HALO ускоряет сбор данных до 2.9x при сопоставимом или более высоком уровне успеха, а обученные на нём policy выполняют точные задачи и достигают 73.3% успеха в длинной шестиэтапной задаче.'}, 'en': {'title': 'Faster, More Natural Demonstrations for Whole-Body Robot Skills', 'desc': 'HALO is a system for collecting demonstrations of whole-body mobile manipulation, where a robot coordinates its arms and movement. It lets operators guide the robot arms by hand and move a lightweight platform, aligning what they see and do with the robot while preserving physical feedback. To address differences between demonstrations and real deployment, HALO calibrates and aligns platform motion with the robot base, and removes demonstrators’ hands from recorded observations. HALO collects demonstrations up to 2.9 times faster than comparison methods, and policies trained on its data achieve precise manipulation and a 73.3% success rate on a challenging six-stage task.'}, 'zh': {'title': '让示范更自然，让移动操作更高效', 'desc': 'HALO 是一种用于全身移动操作的示范数据采集系统，让操作者的感知和动作更贴近机器人，同时保留直接的物理反馈和自然移动能力。操作者通过动觉示教引导机器人的双臂，并推动低阻力平台来配合机器人移动。为缩小采集示范与实际部署之间的差异，系统会校准并对齐平台与机器人底盘的运动，还会遮盖并补全示范者的手部图像。与 Mobile ALOHA 和 VR 遥操作相比，HALO 最多能将示范采集速度提升至 2.9 倍；训练出的策略在多阶段移动操作任务中达到 73.3% 的成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.18442', 'title': 'CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving', 'url': 'https://huggingface.co/papers/2611.18442', 'abstract': "Abstract  Open driving releases and usage-based insurance programs often claim to prevent privacy breaches by omitting GPS records when sharing or collecting vehicle data. However, removing GPS coordinates from driving logs does not erase the location information carried by vehicle signals. While prior route-inference attacks have demonstrated that speed, steering, and driving events can be matched to road networks to reconstruct trajectories, existing studies rely on inconsistent prior assumptions and evaluation metrics and are tested only on small, restricted datasets, making their results difficult to compare and their real-world effectiveness uncertain. We release CANTraj, a naturalistic driving dataset pairing decoded CAN events with time-aligned GNSS trajectories (3,940 drives, 454 drivers), and CANTraj-Bench for evaluating trajectory recovery (3,675 drives, 431 drivers, 1,380 hours, 85,919 km). On 776 evaluation drives from 94 unseen drivers, we compare six re-implemented attacks and benchmark baselines under explicit information-access protocols, paired comparisons, and metrics incorporating failures. Experiments show that combining steering signals with road-network constraints yields the largest gain: With a known start and heading, adding steering to speed raises the online map filter's five-minute route recovery from 56% to 87%, with a median average displacement error of 43 m versus 921 m for map-free dead reckoning. Offline beam search recovers 88% of test routes with the heading and 81% without it. Because methods fail on different windows, we also evaluate an LLM harness that selects among candidate routes on 659 five-minute windows; its best configuration recovers 79% of routes on test and 83% on few-shot, outperforming the best baseline on test and matching it on few-shot. Data and code at huggingface.co/datasets/HenryYHW/CANTraj and github.com/WangYuHang-cmd/GPS--CAN.", 'score': 9, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '789a6c52ac4e56bc', 'authors': ['Yuhang Wang', 'Jingxin Yang', 'Chuheng Wei', 'Suyang Chen', 'Haozhuang Chi', 'Hao Zhou'], 'affiliations': ['Nanyang Technological University, Singapore', 'Purdue University, USA', 'Stanford University, USA', 'University of Florida, USA', 'University of South Florida, USA'], 'pdf_title_img': 'assets/pdf/title_img/2611.18442.jpg', 'data': {'categories': ['#benchmark', '#data', '#agents', '#synthetic', '#security', '#leakage', '#open_source', '#dataset'], 'emoji': '🚗', 'ru': {'title': 'Удалил GPS, но маршрут всё равно видно: CAN-сигналы выдают твоё место', 'desc': 'Статья показывает, что удаление GPS-координат из логов вождения не защищает приватность, так как сигналы CAN (скорость, руль, события вождения) можно сопоставить с дорожной сетью и восстановить маршрут. Авторы выпускают датасет CANTraj с парами декодированных CAN-событий и GNSS-траекторий и бенчмарк CANTraj-Bench для единообразной оценки атак восстановления траектории. Сравнение шести атак показывает, что комбинация сигналов руления с ограничениями дорожной сети даёт наибольший прирост: офлайн beam search восстанавливает 88% маршрутов. Также испытывается LLM-агент, выбирающий маршрут из кандидатов, который на тесте достигает 79% восстановленных маршрутов.'}, 'en': {'title': 'No GPS, No Privacy: Vehicle Signals Can Reconstruct Routes', 'desc': 'The paper introduces CANTraj, a large dataset that pairs vehicle CAN signals with GPS trajectories, and CANTraj-Bench, a benchmark for testing how well routes can be recovered from those signals. It compares six route-inference attacks on drives from drivers not seen during training, using clear access assumptions and metrics that account for failures. Combining steering signals with road-network constraints gives the strongest results: an online map-based method recovers 87% of five-minute routes when the start and heading are known, far better than map-free dead reckoning. An LLM-based system that chooses among candidate routes also improves test performance, showing that vehicle data can reveal location even when GPS coordinates are omitted.'}, 'zh': {'title': '删掉 GPS，也挡不住车辆信号重建行程', 'desc': '本文发布了 CANTraj 数据集和 CANTraj-Bench，用于系统评估仅凭车辆 CAN 信号恢复行驶轨迹的能力。研究比较了六种攻击方法，并发现将方向盘转向信号与道路网络约束结合，能显著提升轨迹恢复效果。已知起点和行驶方向时，加入转向信号可使在线地图滤波器的五分钟路线恢复率从 56% 提升至 87%，且定位误差明显低于不使用地图的航位推算。研究还测试了由大语言模型驱动的候选路线选择方法，表明即使删除 GPS，车辆信号仍可能泄露敏感位置轨迹。'}}}, {'id': 'https://huggingface.co/papers/2611.14504', 'title': 'Emergent Biological Capabilities in a Foundation Model for Molecular Interactions', 'url': 'https://huggingface.co/papers/2611.14504', 'abstract': 'Abstract  Foundation models trained on large unlabeled corpora develop emergent capabilities, tasks that go beyond the training objective. We extend this paradigm to multimodal biology with Bonbon, a foundation model for molecular interactions trained on approximately 3.2 trillion tokens of paired protein-ligand sequences. From a single representation space, Bonbon exhibits three zero-shot emergent capabilities at hierarchical levels of resolution: functional (mechanism of action), residue (binding site localization, including orthosteric/allosteric discrimination), and bond (covalent versus non-covalent engagement). All three capabilities generalize to out-of-distribution complexes. Bonbon was trained on protein-ligand sequences alone, without any task-specific supervision and without structural coordinates. We conducted controlled scaling experiments across six model scales from 42M to 1.6B parameters; every capability evaluated shows a sharp jump at the largest scale on continuous metrics, even as pretraining loss decreases smoothly. This demonstrates that loss-based scaling laws alone are insufficient to predict when zero-shot emergent capabilities become available. The capabilities reported here emerge after training at a 1:2,000 parameter-to-token ratio to accommodate the sparsity of paired biological interaction data. The same frozen representations achieve state-of-the-art binding and affinity prediction at five orders of magnitude greater speed than co-folding methods. In prospective wet-lab validation across nine disease targets spanning seven protein families, Bonbon achieves a 61.5% dose-response hit rate on de novo compounds, yielding structurally novel molecules not previously reported to inhibit these proteins, including for out-of-distribution targets.', 'score': 9, 'issue_id': 3538, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'b5617205ca916916', 'authors': ['Adi Mashiach'], 'affiliations': ['Output Labs'], 'pdf_title_img': 'assets/pdf/title_img/2611.14504.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#multimodal', '#training', '#healthcare', '#optimization', '#science'], 'emoji': '🧬', 'ru': {'title': 'Bonbon: эмерджентные способности языковой модели для молекулярных взаимодействий открывают путь к быстрому поиску лекарств', 'desc': 'Авторы представляют Bonbon, foundation model для молекулярных взаимодействий, обученную на примерно 3,2 триллиона токенов парных последовательностей белок-лиганд без структурных координат и разметки. Модель демонстрирует zero-shot emergent capabilities на трёх уровнях: функциональном (механизм действия), остаточном (локализация сайта связывания, включая orthosteric/allosteric) и связевом (ковалентное против нековалентного связывания). Эксперименты по масштабированию от 42M до 1,6B параметров показывают резкий скачок способностей на continuous metrics при largest scale, хотя loss падает плавно, что ставит под сомнение предсказуемость по scaling laws. Замороженные представления дают state-of-the-art предсказание связывания и аффинности в тысячи раз быстрее co-folding методов, а wet-lab валидация на девяти мишенях даёт 61,5% dose-response hit rate на новых соединениях.'}, 'en': {'title': 'From Protein–Ligand Sequences to Drug-Discovery Capabilities', 'desc': 'Bonbon is a foundation model trained on about 3.2 trillion tokens of paired protein–ligand sequences, without task-specific labels or structural coordinates. Its shared representations support three zero-shot capabilities: predicting a molecule’s mechanism of action, locating its binding site, and distinguishing covalent from non-covalent binding, including on unfamiliar complexes. These capabilities appear sharply at the largest tested model size, even though training loss decreases smoothly, showing that loss-based scaling laws do not fully predict when such abilities emerge. The frozen representations also enable fast binding and affinity prediction, and laboratory tests found dose-response activity for 61.5% of newly designed compounds across nine disease targets.'}, 'zh': {'title': '从海量序列中涌现分子交互能力', 'desc': 'Bonbon 是一种用于分子相互作用的基础模型，使用约 3.2 万亿个蛋白质—配体序列词元训练，不需要结构坐标或任务专属标注。它能从同一套表示中零样本判断作用机制、定位结合位点并区分正构与变构结合，还能辨别共价和非共价作用；这些能力也能泛化到分布外的复合物。实验发现，模型规模增至 16 亿参数时，各项能力在连续指标上突然跃升，即使预训练损失一直平滑下降，说明仅靠损失缩放规律无法预测零样本能力何时出现。冻结后的表示能以比协同折叠方法快数十万倍的速度预测结合与亲和力，并在九个疾病靶点的新药实验中取得 61.5% 的剂量反应命中率。'}}}, {'id': 'https://huggingface.co/papers/2611.13509', 'title': 'Mobile AI Factory: Building Specialized Language Models for Your Mobile Device', 'url': 'https://huggingface.co/papers/2611.13509', 'abstract': "Abstract Mobile AI Factory is an agentic system that automatically builds task- and phone-specific fine-tuned quantized small language models, using an orchestrator LLM, real device measurements, and adaptive search to match or outperform larger models with much less GPU time.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Small language models (SLMs) running on mobile devices can keep user data private and work without connectivity. But they perform well only when fine-tuned for the target task and sized for the target device, a process that today requires repeated expert tuning. We present {\\it Mobile AI Factory}, an agentic system that builds a fine-tuned, quantized SLM for a given task and phone. Given a task specification and a target phone, an orchestrator LLM chooses whether to tune hyperparameters, mine real data, or generate synthetic examples, while fixed rules roll back changes that hurt accuracy. The factory searches from small to large models across base models and quantizations, adapts its accuracy goal as it searches, and uses real measurements of the target phone across inference engines and backends. We evaluate Mobile AI Factory on ten tasks and four Android phones. On an unseen testset, its on-device models outperform two five-shot frontier models on five tasks, by up to 0.34, and match them on three more. Its search comes within 0.03 of exhaustively training all 27 model variants on an entity extraction task, while using 19times less GPU time. Phone measurements also matter: the best configuration changes across phones. Without phone measurements, Claude Opus 5.5, given the full hardware and model specifications, misses the app's requirements in 25\\% of easy and moderate cases and in 60\\% of hard ones. Code is available at: https://github.com/evanly-gh/SLM_Factory.", 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'dd73de273aa9922e', 'authors': ['Evan Li', 'Krishna Deshpande', 'Wen Cheng', 'Shyamnath Gollakota'], 'affiliations': ['Paul G. Allen School of Computer Science and Engineering, University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.13509.jpg', 'data': {'categories': ['#benchmark', '#training', '#small_models', '#agents', '#synthetic', '#inference', '#optimization', '#open_source'], 'emoji': '📱', 'ru': {'title': 'Идеальная маленькая модель для вашего телефона — подбирается автоматически', 'desc': 'В статье представлена Mobile AI Factory — агентная система, которая автоматически подбирает и дообучает квантизированные малые языковые модели (SLM) под конкретную задачу и конкретный телефон. Оркестратор на базе LLM решает, что делать: подбирать гиперпараметры, собирать реальные данные или генерировать синтетические примеры, а фиксированные правила откатывают изменения, ухудшающие точность. Система ищет модели от малых к большим, учитывая реальные измерения производительности на устройстве в разных inference-движках и бэкендах. На десяти задачах и четырёх Android-телефонах модели системы превосходят или не уступают пятишотовым frontier-моделям, при этом поиск требует в 19 раз меньше GPU-времени.'}, 'en': {'title': 'Build the right small model for every phone', 'desc': 'Mobile AI Factory automatically creates a small language model fine-tuned for a particular task and optimized for a specific phone. An orchestrator LLM chooses among tuning hyperparameters, collecting real data, and generating synthetic examples, while the system searches over model sizes and quantization options. It measures models directly on the target phone and rolls back changes that reduce accuracy. Across ten tasks and four phones, the system often matched or beat larger models and used 19 times less GPU time than exhaustive training in one comparison.'}, 'zh': {'title': '让每台手机都拥有为任务量身打造的小模型', 'desc': 'Mobile AI Factory 是一个智能体系统，能根据任务和目标手机自动构建经过微调与量化的小型语言模型。它由一个协调器大语言模型决定是否调整超参数、挖掘真实数据或生成合成数据，并用固定规则撤销会降低准确率的改动。系统会搜索不同基础模型、模型规模和量化配置，并在目标手机上实测推理表现，以满足设备要求。在十项任务和四款安卓手机上的测试中，它在多项任务上达到或超过五样本前沿模型的表现，同时大幅减少训练所需的 GPU 时间。'}}}, {'id': 'https://huggingface.co/papers/2611.18429', 'title': 'Do Underwater Image Quality Metrics Agree with Human Perception? A Benchmark with Human Choices, Simple Edits and Generative Drift', 'url': 'https://huggingface.co/papers/2611.18429', 'abstract': "Abstract  Underwater image enhancement is challenging to evaluate due to the lack of clean reference images, so researchers rely on no-reference image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learned underwater, vision-language and general-purpose metrics against human preferences on five references: four published opinion-score sets and a new paired-comparison study. For each metric, we measure how often it selects the same image as people when comparing versions of the same scene. We further test whether simple image edits and small adversarial perturbations raise metric scores above the enhancement people preferred, and whether scores decrease as repeated generative edits add noise. Our results show that no metric consistently matches human preferences. The best worst-case Cohen's kappa over the five references is only 0.23 (Q-Align), while two raters in our study agree with a median kappa of 0.41. The widely used UCIQE often favors edits that people reject. On a Nano Banana Pro replica chain that should leave the image unchanged, only 22 of 73 scores decrease at every checkpoint, while noise grows by 2.5 times. We also introduce TrustUIQA, a benchmark that combines the human references, our study choices, the edited, attacked and generated images, and the scores of every metric on every image. The code is available at https://github.com/TrustUIQA/TrustUIQA and TrustUIQA at https://huggingface.co/datasets/TrustUIQA/TrustUIQA.", 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'f1217440d705c07e', 'authors': ['Rishii Kumar Singh', 'Abhinav Rajput', 'Dinesh Kumar Vishwakarma'], 'affiliations': ['Delhi Technological University, India'], 'pdf_title_img': 'assets/pdf/title_img/2611.18429.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#security', '#dataset', '#open_source', '#cv'], 'emoji': '🌊', 'ru': {'title': 'Метрики качества подводных изображений расходятся с мнением людей', 'desc': 'Авторы оценивают 73 метрики no-reference оценки качества изображений (NR-IQA) для улучшения подводных снимков и сравнивают их с человеческими предпочтениями на пяти наборах данных. Ни одна метрика не показывает стабильного согласия с людьми: лучший результат по каспа Коэна составляет лишь 0.23, тогда как согласие между двумя оценщиками достигает 0.41. Метрика UCIQE часто отдаёт предпочтение правкам, которые люди отвергают, а многие метрики не снижаются при повторных генеративных редактированиях, вносящих шум. Для систематической проверки авторы представляют бенчмарк TrustUIQA, объединяющий человеческие оценки, атакованные и сгенерированные изображения и результаты всех метрик.'}, 'en': {'title': 'Underwater Image Metrics Must Earn Human Trust', 'desc': 'This paper tests 73 no-reference image quality assessment (NR-IQA) metrics for underwater images against human judgments from five preference datasets. No metric consistently matches people: the strongest worst-case agreement is low, and UCIQE often prefers edits that people reject. Simple edits and adversarial perturbations can increase some metric scores, while repeated generative edits add noise without reliably lowering scores. The authors introduce TrustUIQA, a benchmark that brings together human judgments, edited and generated images, attacks, and metric scores to support more trustworthy evaluation.'}, 'zh': {'title': '水下图像质量评价，不能只看指标分数', 'desc': '水下图像增强缺少干净的参考图像，因此通常用无参考图像质量评价（NR-IQA）指标来评估，但这些指标是否符合人的判断并不清楚。研究比较了73种指标与五组人类偏好数据，发现没有一种指标能稳定地选出人们更喜欢的图像，最佳指标在最差数据集上的 Cohen’s kappa 也只有0.23。常用的 UCIQE 可能偏爱人们不喜欢的编辑结果；此外，生成式编辑增加噪声时，许多指标也未能持续降低评分，说明它们容易受到图像编辑和对抗扰动的影响。研究还发布了 TrustUIQA 基准，汇集人类评价、编辑与扰动图像及各项指标分数，便于更全面地检验水下图像质量评价的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2611.16378', 'title': 'Evidence-Governed Adoption of Self-Generated Updates in Autonomous AI Agents', 'url': 'https://huggingface.co/papers/2611.16378', 'abstract': 'Abstract A governance framework separates generation from adoption of self-modifying autonomous-agent changes, using fresh paired audits, non-inferiority checks, and calibrated statistical bounds to confirm improvements before bounded deployment.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Autonomous agents modify prompts, memories, tools, workflows, and policies using interaction histories. Yet a plausible modification is not necessarily suitable for persistent adoption: candidate selection is adaptive, evaluators may be imperfect, and local gains can hide degradation against an earlier baseline. We introduce Evidence-Governed Evolution (EGE), a framework for governing adoption of self-generated agent modifications. EGE separates candidate generation from confirmatory adoption, evaluates frozen candidates on fresh paired audits, requires meaningful improvement on a prespecified primary objective, protects declared capabilities through reference-relative non-inferiority tests, and applies governance constraints before bounded canary deployment. We establish an evaluator-calibrated simultaneous lower-bound construction for a countable sequence of adaptively generated candidates. It combines candidate-wise Hoeffding bounds with independent calibration samples comparing the operational evaluator with a prespecified reference procedure. We also formalise reference replacement through bridge tests, derive a cumulative degradation bound along a versioned reference lineage, and provide an audit-planning condition relatin
