g effect-size margin, sample sizes, and acceptance probability. A Monte Carlo stress test illustrates calibration under candidate-dependent evaluator optimism; it is a stylised statistical experiment, not an evaluation of a deployed agent. The guarantees are conditional on bounded paired scores, fresh sampling, a valid reference-evaluation construct, and declared evaluation distributions; they do not establish universal agent safety or robustness to arbitrary distribution shift.', 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'a7d7638d786dfdeb', 'pdf_title_img': 'assets/pdf/title_img/2611.16378.jpg', 'data': {'categories': ['#benchmark', '#training', '#agents', '#optimization', '#security', '#alignment'], 'emoji': '🛡️', 'ru': {'title': 'Меняйся только тогда, когда есть доказательства', 'desc': 'Статья предлагает фреймворк Evidence-Governed Evolution (EGE), который разделяет генерацию кандидатов на модификации self-modifying агентов и их подтверждённое принятие. Кандидаты оцениваются на свежих парных аудитах, проверяются на значимое улучшение основной метрики и non-inferiority-тесты для защищённых возможностей, после чего проходят bounded canary deployment. Авторы строят одновременную нижнюю оценку (simultaneous lower bound) с калибровкой оценщика через Hoeffding-границы и независимые калибровочные выборки, а также выводят кумулятивную оценку деградации при смене эталонов через bridge tests. Гарантии действуют при ограниченных парных оценках, честной выборке и корректном эталонном оценивании, а Monte Carlo эксперимент показывает работу калибровки при оптимизме оценщика.'}, 'en': {'title': 'Generate Freely, Adopt Only with Evidence', 'desc': 'Evidence-Governed Evolution (EGE) separates generating agent modifications from deciding whether to adopt them. It tests frozen candidates on fresh, paired audits and requires meaningful improvement on a chosen objective without unacceptable loss in protected capabilities. The framework uses calibrated statistical bounds to account for adaptive candidate selection and possible evaluator bias, and it limits approved changes to bounded canary deployments. Its guarantees depend on assumptions such as fresh samples and valid reference evaluations, so they do not prove universal safety or robustness to arbitrary distribution shifts.'}, 'zh': {'title': '让智能体的自我进化先经证据检验，再谨慎部署', 'desc': '本文提出证据治理演进（EGE）框架，用于决定自主智能体生成的修改是否适合长期采用。框架将修改生成与确认评估分开，并在新的配对审计数据上检验候选方案是否带来预先规定的实质改进，同时用非劣效检验保护已有能力。作者还构造了经过评估器校准的同时置信下界，并通过桥接检验和累积退化界管理参考版本的更替。蒙特卡洛实验展示了该方法在评估器可能偏乐观时的校准表现；其保证依赖若干统计假设，不能证明智能体在所有环境中的安全性或应对任意分布偏移的鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2611.18130', 'title': 'JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams', 'url': 'https://huggingface.co/papers/2611.18130', 'abstract': 'Abstract  Large language models (LLMs) are increasingly applied to finance, creating a need for benchmarks that evaluate their capabilities across financial systems with different regulations and practices. However, existing financial benchmarks provide limited coverage of country-specific financial systems, and they are difficult to keep up to date as released questions leak into training data. We introduce JFinBench, a Japanese financial benchmark comprising 321 examples from the 2026 editions of six regularly administered certification exams covering accounting, tax, financial planning, and banking. To construct it, we develop a human-in-the-loop agentic pipeline in which a coding agent writes exam-specific conversion code and a review page, while a human verifies every example and feeds corrections back to the agent. This pipeline adapts to heterogeneous exam formats and reduces the effort of incorporating new exam editions, enabling periodic refreshes that mitigate data contamination. Evaluating 12 recent LLMs, we find that Claude Fable 5 and GPT-6 Astra exceed 93% overall, while even the best open-weight model, Kimi K3.1 Pro, trails Claude Fable 5 by 12 percentage points. When models can additionally use a terminal and web access, they retrieve the knowledge they lack and every model improves. The gap narrows but about 4 points remain, and the ranking of models stays largely the same, suggesting that knowledge held in the model itself remains valuable even with tools. We release the dataset, the evaluation code, and the construction pipeline.', 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': 'edb88839f07205ca', 'authors': ['Issa Sugiura', 'Taro Makino', 'Takashi Ishida'], 'affiliations': ['Institute of Science Tokyo', 'Sakana AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.18130.jpg', 'data': {'categories': ['#benchmark', '#data', '#multilingual', '#agents', '#science', '#synthetic', '#leakage', '#open_source', '#dataset'], 'emoji': '📊', 'ru': {'title': 'Японские финансы проверяют LLM: знания в модели важнее инструментов', 'desc': 'Авторы представляют JFinBench — японский бенчмарк для оценки больших языковых моделей (LLM) в финансовой сфере, состоящий из 321 примера из шести экзаменов на сертификацию по бухгалтерии, налогам, финансовому планированию и банкингу. Данные собираются с помощью human-in-the-loop агентного пайплайна, где coding agent пишет код конвертации, а человек проверяет каждый пример и дает обратную связь. Такой подход позволяет регулярно обновлять бенчмарк и снижает риск data contamination. Оценка 12 LLM показала, что лучшие модели превышают 93% точности, а использование инструментов (terminal и web access) улучшает результаты, однако знания, заложенные в самой модели, остаются ценными.'}, 'en': {'title': 'A Fresh Benchmark for Japanese Financial AI', 'desc': 'The paper introduces JFinBench, a benchmark for testing large language models (LLMs) on Japanese finance topics, including accounting, tax, financial planning, and banking. It contains 321 questions drawn from six certification exams, and a human-in-the-loop pipeline helps adapt the benchmark to different exam formats and update it with new editions. Tests of 12 LLMs show that the strongest models achieve over 93% accuracy, while the best open-weight model scores lower. Web and terminal tools improve every model’s results, but the remaining performance gap suggests that knowledge learned during training still matters.'}, 'zh': {'title': '为日本金融打造可持续更新的模型能力考场', 'desc': '本文提出 JFinBench，这是一个面向日本金融制度的基准测试，包含来自六类资格考试的 321 道题，涵盖会计、税务、理财和银行业务。研究者设计了人机协作的智能体流程：编码智能体转换不同格式的考试材料并生成审核页面，人工逐题核验并反馈修正，从而降低更新新考试版本的成本并减少训练数据污染。对 12 个近期大语言模型的评测显示，Claude Fable 5 和 GPT-6 Astra 的总体准确率超过 93%，而最佳开放权重模型仍落后 12 个百分点；接入终端和网页工具后，各模型表现均有提升，但模型间仍相差约 4 个百分点。结果表明，外部工具可以补充模型缺失的知识，但模型自身掌握的知识仍然重要；作者也公开了数据集、评测代码和构建流程。'}}}, {'id': 'https://huggingface.co/papers/2611.18529', 'title': 'eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means', 'url': 'https://huggingface.co/papers/2611.18529', 'abstract': "Abstract A streaming speaker-diarization method removes the fixed speaker-slot limit by clustering speaker embeddings within slots after all slots are used, allowing unlimited speakers and efficient large-scale linking.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Meetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online, but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational corpora are prepared, and it reaches the clustering quality of Lloyd's k-means several times faster. The method needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.", 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '1982988bcb16e4c6', 'authors': ['Kyudan Jung', 'Jihwan Kim', 'Minwoo Lee', 'Eunji Shin', 'Jaegul Choo'], 'affiliations': ['Ewha W. University', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.18529.jpg', 'data': {'categories': ['#audio', '#architecture'], 'emoji': '🎙️', 'ru': {'title': 'Говорящих без лимита: диаризация спикеров без фиксированных слотов', 'desc': 'Статья предлагает метод потоковой диаризации спикеров, который снимает ограничение на фиксированное число слотов в нейросетевых моделях вроде Streaming Sortformer. Голова слотов по-прежнему определяет активность и перекрытие речи, а эмбеддинги спикеров кластеризуются внутри слота алгоритмом e-means только после заполнения всех слотов. Переклассификация ограничена скользящим окном, что позволяет работать онлайн и с часовыми встречами без роста стоимости обновления. Подход не требует переобучения, быстрее k-means и применим для связывания спикеров в больших архивах.'}, 'en': {'title': 'Unlimited Speakers, Steady Streaming', 'desc': 'The paper removes the fixed speaker limit in streaming diarization without retraining the neural model. The model’s slots still detect speech and overlap, while speaker embeddings are clustered with e-means after all slots are used. A bounded re-clustering window lets the system revise recent labels while keeping its cost per update steady, even in long meetings. It also scales to large recording archives, where e-means matches Lloyd’s k-means clustering quality several times faster.'}, 'zh': {'title': '突破固定槽位限制，让流式说话人分离支持无限说话人', 'desc': '本文提出一种流式说话人分离方法，解决固定输出槽位无法处理过多说话人的问题。系统继续用槽位判断谁在说话以及何时发生重叠，并在槽位用尽后，将说话人嵌入在单个槽位内用 e-means 聚类，无需重新训练模型。在线处理时，系统只在有限窗口内重新聚类，并短暂修正标签，因此即使会议长达一小时，每次更新的计算成本也不会随会议时长增长。该方法能处理超过槽位数的说话人，并可高效关联大型录音档案中的说话人；其聚类质量接近 Lloyd k-means，但速度快数倍。'}}}, {'id': 'https://huggingface.co/papers/2611.02822', 'title': 'Disen-Forcing: Disentangling Semantic Anchoring from Motion for Autoregressive Video Diffusion', 'url': 'https://huggingface.co/papers/2611.02822', 'abstract': 'Abstract Disen-Forcing is a distillation-time method for autoregressive video diffusion models that disentangles attention-head specialization to improve long-range consistency and motion dynamics in long-horizon video generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Autoregressive video diffusion models (AR-VDMs) enable real-time, long-horizon video generation but degrade rapidly once the inference horizon outruns the training horizon, due to compounding exposure bias. To stabilize long rollouts, recent methods heuristically adopt frame sink, keeping initial frames as a persistent model context, inspired by attention sinks in LLMs. We revisit this design and find that the mechanism by which initial frames stabilize long-range consistency in AR-VDMs is not an LLM-style attention sink; instead, long-range consistency is anchored through a sparse subset of attention heads, while the majority of heads predominantly capture local temporal dynamics. This observation reveals an over-conditioning pathology in existing frame-sink strategies: by universally exposing every head to the pinned initial-frame context, the model becomes prone to collapsing motion toward the low-dynamic modes of the teacher during model distillation. We propose Disen-Forcing, a distillation-time plug-in for AR-VDMs that disentangles and reinforces this head specialization through disentangled context routing and motion-disentangling regularization. On long-horizon video generation benchmarks, Disen-Forcing simultaneously improves long-range consistency and motion dynamics of base AR-VDMs, a trade-off that sink-based methods fail to balance.', 'score': 8, 'issue_id': 3539, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'ae1e480152966eda', 'authors': ['Zhengyang Yu', 'Akio Hayakawa', 'Masato Ishii', 'Qingtao Yu', 'Xuesong Li', 'Takashi Shibuya', 'Yuki Mitsufuji', 'Jing Zhang'], 'affiliations': ['Australian National University', 'CSIRO', 'Sony AI', 'Sony Group Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2611.02822.jpg', 'data': {'categories': ['#training', '#long_context', '#video', '#diffusion', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Разделяй и властвуй: каждая голова внимания должна знать свою роль в видео', 'desc': 'Авторы исследуют авторегрессионные диффузионные модели для видео (AR-VDM), которые быстро деградируют при генерации видео длиннее обучающего горизонта из-за накопления exposure bias. Они показывают, что стабильность долгих роллаутов обеспечивают не LLM-подобные attention sinks, а небольшое подмножество attention heads, тогда как большинство голов отвечает за локальную временную динамику. Предложенный метод Disen-Forcing — плагин для дистилляции, который через disentangled context routing и motion-disentangling regularization разделяет специализацию голов. В результате улучшаются как долгосрочная согласованность, так и динамика движения, чего не удаётся достичь существующим frame-sink методам.'}, 'en': {'title': 'Preserve the story without freezing the motion', 'desc': 'Autoregressive video diffusion models can lose consistency when generating videos much longer than those seen during training. The paper finds that only a small group of attention heads needs access to initial frames to preserve long-range consistency, while most heads focus on nearby motion. Giving every head access to those frames can over-condition the model and reduce motion during distillation. Disen-Forcing routes context separately to different heads and uses a motion-disentangling regularizer, improving both consistency and motion in long videos.'}, 'zh': {'title': '让注意力头各司其职，长视频连贯又灵动', 'desc': '自回归视频扩散模型可以实时生成长视频，但生成时间超过训练范围后，误差会不断累积，导致画面难以保持连贯。论文发现，只有少数注意力头主要负责长程一致性，多数注意力头则侧重捕捉局部运动；让所有注意力头都关注固定的初始帧，可能使生成的动作变得呆板。为此，作者提出 Disen-Forcing，在蒸馏过程中通过分离上下文路由和运动解耦正则化，强化不同注意力头的专长。实验表明，该方法能同时改善长视频的一致性和运动表现，缓解传统帧锚定方法难以兼顾这两者的问题。'}}}, {'id': 'https://huggingface.co/papers/2611.17811', 'title': 'AI Reviews Are Biased Towards the Appendix', 'url': 'https://huggingface.co/papers/2611.17811', 'abstract': "Abstract Large language models used for peer review draw about half or more of their identified weaknesses from paper appendices, whereas human reviewers draw only 8.4% and focus on presentation and core ideas.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) are increasingly used by reviewers to highlight weaknesses during the reviewing process, and their outputs often shape the reviews that humans submit. Prior work studies how LLM reviews align with human ones, yet we know little about which parts of a paper these models actually criticize. In this work, we investigate 2,000 papers from ACL, EMNLP, COLM, and ICLR, and show that the latest GPT and Claude models draw about 50% or more of their review weaknesses from the appendix. This behavior holds across the API, coding-agent, and web access methods for using LLMs to review a paper. In contrast, we find that humans draw only 8.4% of their weaknesses from the appendix, and these weaknesses primarily revolve around a paper's presentation and content related to its core idea. Meanwhile, LLMs draw weaknesses from deep in the appendix that concern fine-grained technical details not central to the paper's contributions. We anticipate that our analysis will contribute to the scholarly discourse on AI reviews. Our code is publicly available at: https://github.com/cincynlp/review_appendix.", 'score': 8, 'issue_id': 3538, 'pub_date': '2026-11-13', 'pub_date_card': {'ru': '13 ноября', 'en': 'November 13', 'zh': '11月13日'}, 'hash': '4f131414ef33f04b', 'authors': ['Saptarshi Ghosh', 'Mohammad Saim', 'Tianyu Jiang'], 'affiliations': ['University of Cincinnati'], 'pdf_title_img': 'assets/pdf/title_img/2611.17811.jpg', 'data': {'categories': ['#data', '#benchmark', '#science', '#alignment'], 'emoji': '📎', 'ru': {'title': 'LLM-рецензенты придираются к приложениям, а люди — к сути работы', 'desc': 'Авторы исследуют, какие части научной статьи критикуют большие языковые модели (LLM) при автоматическом рецензировании. Анализ 2000 статей с конференций ACL, EMNLP, COLM и ICLR показал, что современные модели GPT и Claude выводят около 50% и более своих замечаний из приложений (appendix), тогда как люди делают это лишь в 8,4% случаев. Люди в основном критикуют подачу материала и суть основной идеи, а LLM часто цепляются за мелкие технические детали, далекие от ключевого вклада работы. Результаты показывают систематическое расхождение между AI-рецензиями и человеческими, что важно учитывать при использовании AI в процессе peer review.'}, 'en': {'title': 'AI Reviews Look Deep into the Appendix', 'desc': 'This study analyzes reviews of 2,000 papers from ACL, EMNLP, COLM, and ICLR to see which parts of papers large language models criticize. GPT and Claude models draw at least half of their identified weaknesses from appendices, across API, coding-agent, and web-based review methods. Human reviewers, by contrast, draw only 8.4% of their weaknesses from appendices and focus more on presentation and a paper’s core ideas. LLMs often flag fine-grained technical details in appendices that are less central to the paper’s main contributions.'}, 'zh': {'title': 'AI评审盯住附录，人类评审聚焦核心', 'desc': '这项研究分析了 ACL、EMNLP、COLM 和 ICLR 的 2,000 篇论文，考察大语言模型在评审时会批评论文的哪些部分。研究发现，GPT 和 Claude 提出的弱点中，约一半或更多来自附录，而且这一现象在不同的模型使用方式下都存在。相比之下，人类评审者提出的弱点只有 8.4% 来自附录，他们更关注论文的表达和核心思想。大语言模型则常指出附录深处的细节问题，而这些问题通常并非论文贡献的重点。'}}}, {'id': 'https://huggingface.co/papers/2611.06866', 'title': 'GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs', 'url': 'https://huggingface.co/papers/2611.06866', 'abstract': "Abstract  Agentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verified GitHub Agentic Workflows across 5,051 repositories to 4,112,526 run records and 562,877 nonempty execution log archives. The dataset preserves execution evidence subject to GitHub's log-retention limits and links it to repository metadata and generated workflow configurations. Illustrative cases show how the logs expose tool denials, provider failures, changes in an agent's approach, and delegation among agents. These observations enable research on execution failures, tool use, and the relationship between reported run outcomes and visible task progress. Coverage varies across workflows, and the logs provide partial observations rather than complete agent trajectories. Video: https://youtu.be/KIlfmZhHxtA", 'score': 8, 'issue_id': 3538, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '7d1b35e1d49e80d8', 'authors': ['Jasem Khelifi', 'Hao Li', 'Ali Ouni', 'Mohammed Sayagh', 'Mohamed Aymen Saied'], 'affiliations': ['ETS Montreal, University of Quebec', 'Laval university', 'Queens University'], 'pdf_title_img': 'assets/pdf/title_img/2611.06866.jpg', 'data': {'categories': ['#open_source', '#data', '#dataset', '#agents', '#survey'], 'emoji': '🔍', 'ru': {'title': 'Заглянуть внутрь выполнения: логи AI-агентов раскрывают то, что скрывают итоговые статусы', 'desc': 'Статья представляет GH-AWTrace — датасет, который связывает 25 014 проверенных агентных воркфлоу GitHub с 4 112 526 записями о запусках и 562 877 непустыми архивами логов выполнения. Датасет сохраняет данные о выполнении с учётом ограничений хранения логов и связывает их с метаданными репозиториев и сгенерированными конфигурациями воркфлоу. На примерах авторы показывают, как логи раскрывают отказы инструментов, сбои провайдеров LLM, изменения стратегии агента и делегирование задач между агентами. Работа открывает возможности для исследования ошибок выполнения, использования инструментов и связи между отчётными результатами запусков и реальным прогрессом задач, при этом логи дают лишь частичную картину, а не полные траектории агентов.'}, 'en': {'title': 'Look Inside the Runs: A Dataset for Studying GitHub Agents in Action', 'desc': 'This paper introduces GH-AWTrace, a dataset of GitHub agentic workflows linked to millions of run records and hundreds of thousands of execution logs. It preserves evidence of how AI agents act during repository tasks, including tool use, provider failures, and delegation between agents. Researchers can use these logs to study execution failures and compare reported run outcomes with visible task progress. Coverage is uneven, and the logs provide only partial views of agent behavior.'}, 'zh': {'title': '用真实执行日志揭开智能体工作流的运行过程', 'desc': '本文介绍 GH-AWTrace 数据集，收录了 5,051 个代码仓库中 25,014 个经过验证的 GitHub Agentic Workflows，以及数百万条运行记录和执行日志。该数据集将日志与仓库元数据和生成的工作流配置关联起来，并保留 GitHub 日志保留期限内可获取的执行证据。日志展示了工具调用被拒、服务提供方故障、智能体调整策略以及多个智能体之间的任务委派等情况，可用于研究执行失败、工具使用，以及运行结果与任务实际进展之间的关系。由于不同工作流的日志覆盖程度不一，数据只能呈现部分执行过程，并非智能体完整的运行轨迹。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (11)', '#agi (2)', '#alignment (4)', '#architecture (4)', '#audio (1)', '#benchmark (13)', '#cv (1)', '#data (9)', '#dataset (5)', '#diffusion (3)', '#ethics', '#games (2)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference (4)', '#interpretability (3)', '#leakage (2)', '#long_context (2)', '#low_resource', '#machine_translation', '#math', '#multilingual (1)', '#multimodal (6)', '#open_source (8)', '#optimization (6)', '#plp (1)', '#rag (1)', '#reasoning (1)', '#rl (1)', '#rlhf (1)', '#robotics (3)', '#science (3)', '#security (3)', '#small_models (2)', '#story_generation', '#survey (2)', '#synthetic (4)', '#training (10)', '#transfer_learning', '#video (6)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        }

            });

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-16 12:27',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-16 12:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-16 12:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
