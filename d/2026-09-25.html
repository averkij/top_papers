ешения в полные ответы, которые никто из них не смог бы получить самостоятельно. Обученные стратегии демонстрируют хорошую обобщаемость, перенося полученные навыки на новые задачи без переобучения, и достигают существенного повышения точности на математических и физических бенчмарках. Исследование показывает, что ключевой фактор успеха командной работы — это демонстрируемость, то есть способность команды различать корректное и некорректное рассуждение.'}, 'en': {'title': 'Empowering AI through Self-Organization in Teamwork', 'desc': 'This paper presents Self-Organizing Agent Teams (SAT), a novel approach where AI agents learn to collaborate effectively without predefined roles. Unlike traditional AI systems that follow fixed protocols, SAT allows agents to adapt their organization based on past experiences, enhancing their ability to solve complex problems. The study demonstrates that these self-organizing teams can achieve higher accuracy in collaborative tasks compared to individual agents or fixed routing methods. The findings suggest that the ability to organize and reason collectively can be a learned capability for AI agents, leading to improved problem-solving outcomes.'}, 'zh': {'title': '自组织团队：AI的协作新模式', 'desc': '集体智能不仅依赖于团队成员的知识，还依赖于他们如何组织工作。当解决方案的结构未知时，团队必须通过经验学习如何组织推理。我们提出了自组织代理团队（SAT），这些固定的AI代理团队能够从之前的合作中学习可重用的策略，以组织角色、对话阶段、参与和信息流。这些策略使得代理能够进行协作计算，交换、挑战、修复和综合部分推理，从而形成独立成员无法产生的解决方案。'}}}, {'id': 'https://huggingface.co/papers/2609.28473', 'title': 'On the Diffusibility of High-Dimensional Latents', 'url': 'https://huggingface.co/papers/2609.28473', 'abstract': 'Abstract  Representation Autoencoders (RAEs) enable diffusion models to operate in the feature spaces of pretrained visual encoders. However, many off-the-shelf encoders are not optimized for faithful reconstruction, discarding fine-grained visual details. As expected, finetuning these encoders for image reconstruction recovers such details. However, perhaps counterintuitively, this procedure reduces the effective dimensionality of the resulting representation, and the altered geometry has downstream effects on generation. Specifically, we show that using the standard velocity prediction in flow matching in this high-dimensional space requires the model to fit orthogonal noise directions outside the low-dimensional signal manifold, making optimization inefficient. This motivates using the clean data parameterization (x_{0}-prediction) instead, which focuses learning on the underlying signal manifold. Across experiments with multiple strong-reconstruction encoders, we show that x_{0}-prediction consistently improves text-to-image generation performance.', 'score': 4, 'issue_id': 3326, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '1790bb276d31635b', 'authors': ['Chao Feng', 'Zhiyang Xu', 'Bowei Chen', 'Yuanjun Xiong', 'Xiyao Wang', 'Jui-Hsien Wang', 'Richard Zhang', 'Zhe Lin', 'Andrew Owens', 'Yijun Li'], 'affiliations': ['Adobe', 'Cornell University', 'University of Maryland', 'University of Washington', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.28473.jpg', 'data': {'categories': ['#training', '#diffusion', '#architecture', '#cv', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Предсказание исходных данных в диффузионных моделях для качественной генерации изображений', 'desc': 'В работе исследуются представленческие автокодировщики (RAE), которые позволяют диффузионным моделям работать в пространстве признаков предобученных визуальных кодировщиков. Авторы обнаруживают, что при доработке кодировщиков для улучшения качества реконструкции изображений эффективная размерность представления снижается, что влияет на геометрию пространства признаков. Это создает проблемы при использовании стандартного предсказания скорости в flow matching, так как модель вынуждена адаптироваться к шумовым направлениям вне низкомерного многообразия сигнала. Авторы предлагают вместо этого использовать предсказание исходных данных (x₀-prediction), которое сосредоточивает обучение на истинном многообразии сигнала и улучшает качество генерации изображений из текста.'}, 'en': {'title': 'Enhancing Image Generation with x_{0}-Prediction', 'desc': 'This paper discusses Representation Autoencoders (RAEs) that help diffusion models work better with features from pretrained visual encoders. It highlights a problem where many encoders lose important visual details when they are not fine-tuned for reconstruction. Surprisingly, fine-tuning these encoders can reduce the effective dimensionality of the representation, which complicates the generation process. The authors propose using a clean data parameterization method, x_{0}-prediction, to enhance learning on the signal manifold, leading to improved performance in text-to-image generation tasks.'}, 'zh': {'title': '优化生成模型的信号流形', 'desc': '本论文介绍了表示自编码器（RAEs）如何使扩散模型在预训练视觉编码器的特征空间中运行。许多现成的编码器并未针对精确重建进行优化，导致细节丢失。通过微调这些编码器以进行图像重建，可以恢复这些细节，但这也降低了表示的有效维度，影响了生成效果。我们提出使用干净数据参数化（x_{0}-预测），专注于底层信号流形，从而提高文本到图像生成的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.27980', 'title': 'Six Layers Less: Encoder Pruning for Whisper with Label-Free Recovery', 'url': 'https://huggingface.co/papers/2609.27980', 'abstract': "Abstract  Pruning large pre-trained transformer-based ASR models such as OpenAI's Whisper has seen great adoption, as pruning the decoder led to significant end-to-end transcription speedups. For instance, the {\\tt whisper-large-v3-turbo} variant reduced the decoder from 32 to 4 layers, while Distill-Whisper similarly reduced the decoder to only 2 layers. Although some attention has been put towards reducing the size of the encoder, no approach has seen wide adoption. This could be due to the need for custom inference implementations to take advantage of the compressed model. We present an approach that ranks encoder layers by the leave-one-layer-out change in Word Error Rate (WER). The six layers that cause the least change are removed, corresponding to 18.5% of the encoder stack. The pruned model requires no custom inference code as it is simply a more shallow encoder with fewer layers. We further distill using unlabeled monolingual speech data to recover performance degradation caused by the zero-shot layer pruning. Mean WER across four languages increases to 20.1% after distillation, compared to 21.9% zero-shot, going from a baseline of 18.2%. We release all of our code (https://github.com/rasgaard/whisper-encoder-layer-prune) and the pruned model (https://huggingface.co/rasgaard/whisper-large-v3-turbo-encoder-pruned).", 'score': 3, 'issue_id': 3326, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '4ddcb1ec91d5f7ae', 'authors': ['Rasmus Aagaard', 'Nicki Skafte Detlefsen'], 'affiliations': ['Laerdal Medical', 'Technical University of Denmark'], 'pdf_title_img': 'assets/pdf/title_img/2609.27980.jpg', 'data': {'categories': ['#audio', '#inference', '#training'], 'emoji': '✂️', 'ru': {'title': 'Сокращение энкодера Whisper без пользовательского кода инференса', 'desc': 'В статье предлагается метод сокращения размера энкодера в предварительно обученных трансформер-моделях для распознавания речи, таких как Whisper. Авторы ранжируют слои энкодера по изменению Word Error Rate при удалении каждого слоя и удаляют шесть наименее важных слоев, что составляет 18.5% от стека энкодера. Поскольку результирующая модель представляет собой просто более неглубокий энкодер, не требуется пользовательский код для инференса. После дистилляции на немаркированных речевых данных модель достигает среднего WER 20.1% на четырёх языках вместо исходных 18.2%.'}, 'en': {'title': 'Efficient Layer Pruning for Faster ASR Models', 'desc': "This paper discusses a method for pruning the encoder layers of large pre-trained transformer models used in automatic speech recognition (ASR), specifically focusing on OpenAI's Whisper. The authors propose a ranking system based on the impact of removing each layer on the Word Error Rate (WER), allowing them to eliminate six layers with minimal performance loss. They also introduce a distillation process using unlabeled monolingual speech data to recover any performance degradation from the pruning. The final pruned model simplifies the encoder without requiring custom inference code, achieving a competitive WER across multiple languages."}, 'zh': {'title': '优化ASR模型：剪枝与蒸馏的结合', 'desc': '本论文探讨了如何通过剪枝技术来优化大型预训练的变换器模型，特别是自动语音识别（ASR）模型。我们提出了一种方法，通过评估每层对词错误率（WER）的影响，选择性地去除对性能影响最小的编码器层。经过剪枝后，模型的编码器层数从六层减少到四层，且无需额外的推理代码。最终，我们使用无标签的单语音数据进行蒸馏，显著提高了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.25853', 'title': 'MemoryAthena: Adaptive Routing over Latent and Generated Memories', 'url': 'https://huggingface.co/papers/2609.25853', 'abstract': 'Abstract  Learned-memory methods store information in an explicit table and consume it through a separate reader, allowing addressing, storage, and reading to be modified independently. We study whether useful memory can also be generated rather than only retrieved. MemoryAthena uses three pathways: direct Engram retrieval (E), generation from retrieved Engram cues (GE), and generation from causal backbone states without consulting the memory table (GH). Generated memory is conditionally useful: it can complement E in one context but interfere with it in another. MemoryAthena therefore treats E as an anchor and learns when a generated representation should intervene. With the backbone, memory, generators, and readers frozen, a lightweight causal routing head is trained from counterfactual future-token likelihood advantages of GE and GH relative to E. At inference time, an admitted candidate modifies the E residual through bounded interpolation, while rejection recovers the direct pathway exactly. On question answering, MemoryAthena raises the five-task average from 37.65 to 39.28 over the direct pathway of the same checkpoint, while the six-task general-NLP average increases from 76.73 to 79.13. The complete memory-side system contains approximately 201M parameters, excluding the frozen backbone. Further analyses show complementary strengths among E, GE, and GH across tasks and inputs. These results support generated memory as a selective correction to direct retrieval and highlight routing when, which, and how strongly to intervene as the central challenge.', 'score': 3, 'issue_id': 3326, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'a7d10703099dffcd', 'authors': ['Mingyuan Li', 'Guangsheng Yu', 'Juyuan Zhang', 'Xu Wang', 'Zhibo Man', 'Haonan Zhang', 'Shaoxiong Ji'], 'affiliations': ['ELLIS Institute of Finland', 'Shanghai Jiao Tong University', 'University of Science and Technology of China', 'University of Technology Sydney', 'University of Turku'], 'pdf_title_img': 'assets/pdf/title_img/2609.25853.jpg', 'data': {'categories': ['#training', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Гибридная память: когда генерировать информацию лучше, чем просто извлекать', 'desc': 'В работе предлагается MemoryAthena — система с явной памятью, которая не только извлекает информацию из таблицы, но и может генерировать её. Модель использует три пути получения информации: прямое извлечение (E), генерация на основе подсказок из памяти (GE) и генерация из внутренних состояний без обращения к памяти (GH). Ключевая идея заключается в том, чтобы научиться динамически выбирать, когда использовать каждый путь, поскольку сгенерированная память может как помогать, так и мешать прямому извлечению в зависимости от контекста. Система обучается лёгкой причинной головой маршрутизации на основе контрфактических преимуществ, позволяя выбирать нужный источник информации во время инференса.'}, 'en': {'title': 'MemoryAthena: Enhancing Retrieval with Generated Memory', 'desc': 'This paper introduces MemoryAthena, a learned-memory method that enhances information retrieval by generating useful memory representations. It operates through three pathways: direct retrieval of existing memories, generation of memories based on cues, and generation from underlying states without accessing the memory table. The study shows that generated memories can either complement or interfere with direct retrieval, depending on the context. The findings emphasize the importance of selectively routing memory interventions to improve performance in tasks like question answering, demonstrating a significant increase in accuracy across various benchmarks.'}, 'zh': {'title': '生成记忆：超越直接检索的智能选择', 'desc': '本文研究了一种名为MemoryAthena的学习记忆方法，该方法不仅可以检索信息，还能生成有用的记忆。MemoryAthena通过三条路径进行操作：直接的记忆检索、从检索到的线索生成记忆，以及在不查阅记忆表的情况下从因果状态生成记忆。生成的记忆在不同上下文中可能是有用的，也可能会干扰直接检索的结果，因此系统需要学习何时介入生成的表示。实验结果表明，MemoryAthena在问答任务中显著提高了性能，展示了生成记忆作为直接检索的选择性修正的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.27158', 'title': 'The Linear Representation Hypothesis Needs a Group Action', 'url': 'https://huggingface.co/papers/2609.27158', 'abstract': 'Abstract  To make claims about representations that generalize beyond a particular trained model, we need to specify when two representations should count as equivalent. The Linear Representation Hypothesis is often discussed without making this equivalence explicit. Different notions of equivalence preserve different structures, so metrics, probes, and interventions that appear to study the same representation may in fact correspond to different hypotheses. We therefore argue that the Linear Representation Hypothesis is not one hypothesis but a family of claims distinguished by representation equivalence. We formalize this idea using group actions, specifying the representation object, the procedure that produces it, and the property ultimately asserted, while accounting for equivalences imposed by the model architecture. This framework clarifies how assumptions can change across metrics, reading points, and analysis stages, and we use it to audit common representation quantities and recent interpretability analyses.', 'score': 2, 'issue_id': 3327, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '19a071bea8701ac0', 'authors': ['Louie Hong Yao', 'Yuhao Li', 'Shengchao Liu'], 'affiliations': ['Independent Researcher', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.27158.jpg', 'data': {'categories': ['#interpretability'], 'emoji': '🔍', 'ru': {'title': 'Представления имеют много лиц: уточняем Linear Representation Hypothesis через эквивалентность', 'desc': 'Статья раскрывает проблему интерпретации Linear Representation Hypothesis, показывая, что это не единая гипотеза, а семейство утверждений, различающихся понятием эквивалентности представлений. Авторы формализуют этот подход с помощью групповых действий, чтобы явно описать объект представления, процедуру его получения и проверяемое свойство, учитывая эквивалентности архитектуры модели. Они демонстрируют, как разные представления эквивалентности сохраняют различные структуры, что делает метрики и анализ интерпретируемости непрямо сравнимыми. Предложенный математический фреймворк позволяет проаудировать распространённые методы анализа представлений и выявить скрытые предположения в интерпретируемости моделей.'}, 'en': {'title': 'Clarifying Equivalence in Linear Representation Hypothesis', 'desc': 'This paper discusses the need for clear definitions of equivalence when comparing representations in machine learning models. It introduces the Linear Representation Hypothesis, emphasizing that it encompasses multiple claims based on different notions of equivalence. The authors propose a formal framework using group actions to specify the representation, the method of its creation, and the properties being asserted. This approach helps to clarify how different assumptions can affect the interpretation of representation metrics and analyses.'}, 'zh': {'title': '线性表示假设：等价性的多样性', 'desc': '本文讨论了线性表示假设的等价性问题。为了使模型的表示能够推广到其他模型，我们需要明确何时两个表示可以视为等价。不同的等价概念会保留不同的结构，因此看似研究相同表示的度量、探针和干预实际上可能对应不同的假设。我们提出线性表示假设并不是单一假设，而是一组通过表示等价性区分的主张，并用群作用形式化这一思想。'}}}, {'id': 'https://huggingface.co/papers/2609.26634', 'title': 'Knowledge Pull Requests for Continual Document Authoring', 'url': 'https://huggingface.co/papers/2609.26634', 'abstract': 'Abstract  We introduce Knowledge Pull Requests (KPRs), a framework for continual document authoring that makes each change interpretable. Documents require ongoing revision as new knowledge surfaces from other sources, languages, or times, but existing approaches either edit with no account of what knowledge changed or regenerate from scratch. A KPR integrates new knowledge into a document by extracting claims, filtering and routing them to sections, and flagging conflicts with existing content, producing a ChangeLog that separates what knowledge changes (claim proposal) from how the text changes (document diff). We evaluate KPRs on revising Wikipedia across languages and updating query-driven reports on RAGTIME. KPRs integrate more information and better preserve existing content than rewriting from sources or regenerating from scratch, while adding the most information per token generated. A KPR-revised article also grounds question answering better than a frontier model with search, which does not surface knowledge documented only in other languages.', 'score': 2, 'issue_id': 3327, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'dade3a811997ebe5', 'authors': ['Alexander Martin', 'Benjamin Van Durme'], 'affiliations': ['Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2609.26634.jpg', 'data': {'categories': ['#multilingual', '#rag', '#benchmark'], 'emoji': '📝', 'ru': {'title': 'Интерпретируемое редактирование документов через управление знаниями', 'desc': 'В работе представлена концепция Knowledge Pull Requests — фреймворк для постоянного редактирования документов, который делает каждое изменение интерпретируемым. Система извлекает утверждения из новых источников, фильтрует и маршрутизирует их по разделам документа, а также выявляет конфликты с существующим контентом. Ключевой вклад заключается в разделении информации о том, какие знания изменились (предложение утверждений), от информации о том, как изменился текст (различия в документе). Эксперименты на примере редактирования Wikipedia и обновления отчётов показали, что подход лучше сохраняет существующий контент и добавляет больше информации на токен, чем переписывание с нуля.'}, 'en': {'title': 'Revolutionizing Document Updates with Knowledge Pull Requests', 'desc': 'Knowledge Pull Requests (KPRs) are a new method for continuously updating documents while keeping track of changes. Unlike traditional methods that either make edits without clarity or start over completely, KPRs extract new claims and intelligently integrate them into existing content. This process includes filtering and routing information to the appropriate sections and identifying any conflicts with current material. The evaluation shows that KPRs enhance information integration and maintain the integrity of existing content better than previous approaches, while also improving the quality of question answering by utilizing multilingual knowledge.'}, 'zh': {'title': '知识拉取请求：持续文档创作的新方法', 'desc': '我们提出了知识拉取请求（KPRs），这是一个持续文档创作的框架，使每个更改都可以解释。文档需要不断修订，因为新的知识会从其他来源、语言或时间中出现，但现有的方法要么在没有考虑知识变化的情况下进行编辑，要么从头开始重新生成。KPR通过提取主张、过滤和路由到相应部分，并标记与现有内容的冲突，来将新知识整合到文档中，生成一个变更日志，区分知识变化（主张提议）和文本变化（文档差异）。我们在跨语言修订维基百科和更新基于查询的报告方面评估了KPR，结果表明KPR比从源头重写或从头生成更好地整合信息，并更好地保留现有内容。'}}}, {'id': 'https://huggingface.co/papers/2609.26489', 'title': 'Calibration as a First-Class Criterion in LLM Evaluation', 'url': 'https://huggingface.co/papers/2609.26489', 'abstract': "Abstract  Calibration of language models -- the alignment between expressed or implicit confidence and empirical correctness -- is a well-studied subfield within NLP. Methods to measure it already exist. The problem is adoption: outside this subfield, NLP research regularly introduces new models, datasets, and benchmarks without checking whether the model's confidence scores are meaningful. We argue that this adoption gap is a major obstacle to trustworthy LLM evaluation. Miscalibration causes problems in two distinct areas: at deployment, where overconfident mistakes cause real harm, and inside the research pipeline, where methods like LLM-as-a-judge, synthetic data generation, and active learning rely on calibrated confidence without verifying it. Standard calibration metrics only require two inputs per example: a confidence score and a correctness judgment. Most benchmarks in use today already provide both, meaning calibration can be reported immediately. For open-ended generation, however, defining these two inputs is still an open challenge. We argue that each NLP subfield should pair its main performance metric with a calibration score and call for treating calibration as an essential property of every model rather than a niche topic.", 'score': 2, 'issue_id': 3326, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '22ccfc82de7ba351', 'authors': ['Mario Sanz-Guerrero', 'Katharina von der Wense'], 'affiliations': ['Johannes Gutenberg University Mainz, Germany', 'University of Colorado Boulder, USA'], 'pdf_title_img': 'assets/pdf/title_img/2609.26489.jpg', 'data': {'categories': ['#benchmark', '#alignment', '#training', '#interpretability', '#synthetic'], 'emoji': '📊', 'ru': {'title': 'Калибровка доверия: обязательная проверка уверенности языковых моделей', 'desc': 'В статье обсуждается проблема калибровки языковых моделей — соответствия между выражаемой уверенностью и фактической правильностью ответов. Авторы указывают, что методы измерения калибровки существуют, но они редко применяются при разработке новых моделей и датасетов, что создает серьезный разрыв между исследованиями и практикой. Некалиброванные модели вызывают проблемы как при развертывании в production, так и внутри исследовательского процесса, например в методах LLM-as-a-judge и синтетической генерации данных. Авторы призывают рассматривать калибровку как обязательное свойство каждой модели и предлагают пары основной метрики производительности с показателем калибровки.'}, 'en': {'title': 'Bridging the Calibration Gap for Trustworthy Language Models', 'desc': 'This paper discusses the importance of calibrating language models, which means ensuring that their confidence levels match their actual accuracy. It highlights that many new NLP models are introduced without checking if their confidence scores are reliable, leading to potential issues in real-world applications and research. The authors emphasize that miscalibration can result in overconfident errors during deployment and affect research methods that depend on accurate confidence levels. They propose that every NLP subfield should include calibration scores alongside performance metrics to improve the trustworthiness of language models.'}, 'zh': {'title': '校准：提升语言模型可信度的关键', 'desc': '本文讨论了语言模型的校准问题，即模型表达的信心与实际正确性之间的对齐。尽管已有测量方法，但在自然语言处理（NLP）领域外，研究人员常常忽视模型信心分数的有效性。我们认为，这种采纳差距是评估大型语言模型（LLM）可信度的主要障碍。文章呼吁每个NLP子领域都应将校准分数与主要性能指标结合，视校准为每个模型的重要特性。'}}}, {'id': 'https://huggingface.co/papers/2609.27308', 'title': 'EmbodiedSWE: Coding Agents for Long Horizon Dexterous Robotics', 'url': 'https://huggingface.co/papers/2609.27308', 'abstract': 'Abstract  We study coding agents for long-horizon, dexterous robotics and ask whether their solutions can provide scalable supervision for learning general robot policies. To test this, we develop EMBODIEDSWE-BENCH, a simulation benchmark for coding agents spanning contact-rich manipulation, deformable objects, and long-horizon tasks requiring up to half an hour of continuous interaction. We find that frontier coding agents can solve complex long-horizon tasks and transfer prior solutions across both tasks and embodiments. We also design supporting tools that help agents more effectively solve these tasks. However, the resulting solutions require substantial iterative interaction and are typically specialized to individual task instances. We therefore introduce EMBODIEDSWE-GEN, which expands a single solution from coding agent into large diverse trajectories for training a VLA. VLA performance improves with more generated demonstrations, and agent-aided diversification improves generalization to held-out task variations. We also show that a VLA finetuned solely on coding-agent-generated simulation demonstrations completes a long-horizon task on real robot. Together, our framework uses coding agents to solve complex robotics tasks and turn verified solutions into scalable supervision for robot policies.', 'score': 2, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'e0fd975bfb64c7d5', 'authors': ['Haoxiang You', 'Zeyu Shen', 'Yilang Liu', 'Zhicheng Zheng', 'Lihan Zha', 'Kashu Yamazaki', 'Mingtong Zhang', 'Suning Huang', 'Jiankai Sun', 'Qianzhong Chen', 'Lucy He', 'Kaiyuan Liu', 'Haoran Chang', 'Katerina Fragkiadaki', 'Dhruv Shah', 'Mac Schwager', 'Peter Henderson', 'Ian Abraham', 'Canwen Xu'], 'affiliations': ['ByteDance Seed', 'Carnegie Mellon University', 'Princeton University', 'Stanford University', 'University of California, Los Angeles', 'University of Washington', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.27308.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#synthetic', '#training', '#agents', '#transfer_learning', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Coding agents как учителя: от верифицированных решений к масштабируемому обучению робот-политик', 'desc': 'Исследователи разработали EMBODIEDSWE-BENCH — симуляционный бенчмарк для тестирования coding agents на сложных задачах манипуляции роботом, включая работу с деформируемыми объектами и долгосрочные взаимодействия. Они обнаружили, что передовые coding agents способны решать сложные задачи и переносить решения между различными задачами и типами роботов. Затем авторы предложили EMBODIEDSWE-GEN — метод расширения единственного решения coding agent в большой набор разнообразных траекторий для обучения VLA (vision-language-action модели). Полученная VLA, обученная только на синтетических демонстрациях, успешно выполняет долгосрочные задачи на реальном роботе, демонстрируя масштабируемый способ получения обучающих данных из решений coding agents.'}, 'en': {'title': 'Empowering Robots with Coding Agents for Complex Tasks', 'desc': 'This paper explores the use of coding agents to enhance the learning of robot policies for complex tasks that require long-term interaction. The authors introduce EMBODIEDSWE-BENCH, a simulation environment designed to evaluate these agents on challenging manipulation tasks. They demonstrate that coding agents can effectively solve intricate tasks and adapt their solutions across different scenarios. Additionally, they present EMBODIEDSWE-GEN, a method to generate diverse training trajectories that improve the performance of a Variational Learning Algorithm (VLA) when fine-tuned on these generated demonstrations.'}, 'zh': {'title': '利用编码代理实现机器人任务的可扩展监督', 'desc': '本文研究了用于长时间、灵巧机器人任务的编码代理，并探讨其解决方案是否能为学习通用机器人策略提供可扩展的监督。我们开发了EMBODIEDSWE-BENCH，这是一个涵盖接触丰富的操作、可变形物体和需要长达半小时连续交互的任务的仿真基准。研究发现，前沿编码代理能够解决复杂的长时间任务，并在任务和实体之间转移先前的解决方案。我们还引入了EMBODIEDSWE-GEN，将编码代理的单一解决方案扩展为多样化的轨迹，以训练变换学习算法（VLA），从而提高其在新任务变体上的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2609.28470', 'title': 'StudentBench: AI and human tutoring yield equivalent GRE learning gains', 'url': 'https://huggingface.co/papers/2609.28470', 'abstract': 'Abstract  Artificial intelligence offers an unprecedented opportunity to augment human capabilities, yet progress at the frontier has focused primarily on advancing model capabilities. We introduce StudentBench, a suite of AI teaching evaluations and a public platform that enables large-scale data collection with over 175,000 student-AI messages to study whether large language models (LLMs) produce learning gains equivalent to human tutoring. Using StudentBench, we measured learning gains on Quantitative and Verbal GRE questions across 2,383 human participants receiving AI tutoring, human tutoring, or no tutoring. We establish that AI tutoring is statistically equivalent to expert human tutoring for GRE learning gains (p = .015), and in five of the seven GRE domains, the best performing AI tutor surpassed the human tutor, on average. In a second study, expert human tutors compared LLM-generated lesson plans and practice problems through 2,028 pairwise rubric evaluations. Together, the two studies clearly separate AI tutors across: (1) lesson planning, (2) practice-problem creation, (3) conversational pedagogy, (4) cost, and (5) engagement. Surprisingly, one AI tutor achieved learning gains equivalent to human tutoring (p = .044) at 918 times lower cost (USD 0.0052 for AI versus USD 4.81 for human, per percentage point gained). For Quantitative GRE sessions, faster AI replies correlated with more student messages, more messages with more correct practice, and more correct practice with larger learning gains (all p < .002). The StudentBench platform is freely available at https://studentbench.org.', 'score': 2, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '50458e4d54f04920', 'pdf_title_img': 'assets/pdf/title_img/2609.28470.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#open_source'], 'emoji': '🎓', 'ru': {'title': 'AI-репетиторы достигают эффективности человека при минимальной стоимости', 'desc': 'В работе представлена платформа StudentBench для оценки способности больших языковых моделей обучать студентов, аналогично человеческим репетиторам. Исследователи провели масштабное исследование с участием 2383 человека, сравнивая эффективность AI-репетиторства, человеческого репетиторства и отсутствия обучения на примере подготовки к GRE экзамену. Результаты показали, что лучший AI-репетитор достиг статистически эквивалентных результатов обучения по сравнению с экспертным человеческим репетитором, при этом превзойдя его в пяти из семи тестовых областей и обходясь в 918 раз дешевле. Исследование выявило ключевые компоненты качественного AI-репетиторства: планирование уроков, создание практических задач, педагогическая коммуникация, стоимость и вовлечение студентов.'}, 'en': {'title': 'AI Tutoring: Cost-Effective Learning Gains Comparable to Human Tutors', 'desc': 'This paper presents StudentBench, a platform designed to evaluate AI tutoring effectiveness compared to human tutoring. The study involved over 2,383 participants and found that AI tutoring can produce learning gains similar to those achieved through expert human tutoring, particularly in GRE preparation. Notably, one AI tutor outperformed human tutors in several areas while being significantly more cost-effective. The research highlights the potential of large language models (LLMs) in educational settings, emphasizing their ability to enhance learning outcomes.'}, 'zh': {'title': 'AI辅导：超越人类的学习新选择', 'desc': '这篇论文介绍了StudentBench，这是一个用于评估人工智能教学效果的平台。研究表明，使用大型语言模型（LLMs）进行的AI辅导在GRE学习成绩上与人类专家辅导的效果相当。通过对2383名参与者的研究，发现某些AI辅导在多个GRE领域的表现优于人类辅导。AI辅导的成本显著低于人类辅导，且在学习效果上也取得了可观的进展。'}}}, {'id': 'https://huggingface.co/papers/2609.25187', 'title': 'X-Planner: Event-Structured Task Planning for Embodied Intelligence', 'url': 'https://huggingface.co/papers/2609.25187', 'abstract': 'Abstract  Task planning bridges high-level instructions and executable behavior in long-horizon manipulation, yet modern Vision-Language-Action (VLA) systems often leave this intermediate structure implicit. Existing chain-of-thought (CoT) planners also tend to rely on coarse task-level annotations or serialize long reasoning traces token by token. We present X-Planner, a planning front-end that addresses both the supervision and representation of embodied reasoning. Our planning data combine Ego, UMI, and teleoperation under a hierarchy granularity with source-dependent annotation depth. Takeover-time annotations and human-designed failures supervise ongoing error recognition. On the model side, a shared VLM backbone exposes two event-structured plan forms: a discrete interface that emits interpretable event states and a latent interface that relays continuous CoT states across staggered Transformer depths through Staircase Decoding. A frozen latent-to-text reconstruction objective provides a semantic anchor for the latent representation. Offline two-step planning evaluation places X-Planner second among four evaluated models on both BERTScore-F1 and a judge-based Overall score. In real-robot experiments, respectively, outperforming the evaluated baselines. These results characterize planning-text quality and downstream execution.', 'score': 1, 'issue_id': 3327, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '434eddb4f4f400e8', 'pdf_title_img': 'assets/pdf/title_img/2609.25187.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#robotics', '#training', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Структурированное промежуточное планирование для воплощённого искусственного интеллекта', 'desc': 'Статья представляет X-Planner — систему промежуточного планирования для робототехнических манипуляций, которая делает неявную структуру рассуждений явной в Vision-Language-Action моделях. Авторы разработали иерархический датасет с аннотациями разной глубины для обучения распознаванию ошибок и планированию действий. Модель использует разделяемый VLM backbone с двумя интерфейсами: дискретным для интерпретируемых состояний событий и латентным для непрерывного цепочного мышления через Staircase Decoding. Система превосходит базовые подходы как при оценке качества планирования на бенчмарках, так и при выполнении задач в реальных робототехнических экспериментах.'}, 'en': {'title': 'X-Planner: Bridging Vision and Action for Smarter Task Planning', 'desc': 'The paper introduces X-Planner, a new system designed to improve task planning in Vision-Language-Action (VLA) systems for long-horizon manipulation. It enhances the representation and supervision of embodied reasoning by integrating various planning data sources and using a hierarchical annotation approach. X-Planner features two types of plan forms: a discrete interface for clear event states and a latent interface for continuous reasoning through advanced decoding techniques. The results show that X-Planner performs well in both offline evaluations and real-robot experiments, surpassing existing models in planning quality and execution effectiveness.'}, 'zh': {'title': 'X-Planner：提升任务规划与执行的智能系统', 'desc': '本文介绍了一种新的任务规划系统X-Planner，旨在改善长时间操作中的高层指令与可执行行为之间的桥接。X-Planner通过结合Ego、UMI和遥操作的数据，提供了更细致的任务层次和注释深度，从而增强了对体现在推理过程中的监督和表示。该系统采用共享的视觉语言模型（VLM）骨干，能够生成可解释的事件状态和连续的推理状态，提升了任务规划的质量。在真实机器人实验中，X-Planner的表现超越了其他基线模型，展示了其在规划文本质量和后续执行中的优势。'}}}, {'id': 'https://huggingface.co/papers/2609.27657', 'title': 'FLEET: From Logits Entropy to Enhanced Trajectories in Text Generation', 'url': 'https://huggingface.co/papers/2609.27657', 'abstract': 'Abstract  Solutions based on large language models (LLMs) often rely on temperature sampling to improve accuracy and stability by aggregating multiple samples from the completion distribution. However, this memoryless approach is inherently suboptimal: because it lacks awareness of prior generations and their evaluations, it produces an increasing proportion of semantically duplicate answers as more samples are drawn, leading to diminishing returns. To address this limitation, we introduce FLEET, a novel method that integrates a memory mechanism into the generation process. FLEET represents each generation as a sparse trajectory through states whose entropy exceeds a predefined threshold and uses these trajectories to infer per-token utility scores that adjust the logits. Benchmark evaluations demonstrate that FLEET achieves the same accuracy as the repeated sampling baseline, with a 3x speedup, and substantially improves accuracy on complex coding tasks (LiveCodeBench Pass@32 increases from 59.9% to 66.2%) under the same budget. Furthermore, in the greedy-decoding configuration evaluated here, the approach is deterministic and uses a single calibration pass to derive its principal hyperparameters, requiring only minimal modifications to existing LLM pipelines.', 'score': 1, 'issue_id': 3326, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'eb22dbefaa1af06d', 'authors': ['Oleksii Streltsov', 'Oleksandra Vitko'], 'affiliations': ['Department of Artificial Intelligence, Kharkiv National University of Radio Electronics, Kharkiv, Ukraine'], 'pdf_title_img': 'assets/pdf/title_img/2609.27657.jpg', 'data': {'categories': ['#optimization'], 'emoji': '⚡', 'ru': {'title': 'Память вместо случайности: ускоренная генерация с адаптивной утилитой токенов', 'desc': "В статье предложен метод FLEET, который улучшает качество работы больших языковых моделей за счёт интеграции механизма памяти в процесс генерации текста. Вместо обычного температурного семплирования, которое часто генерирует семантически дублирующиеся ответы, FLEET отслеживает траектории генерации через состояния с высокой энтропией и использует эту информацию для вычисления утилит-баллов для каждого токена. Метод достигает той же точности, что и базовый подход множественного семплирования, но работает в 3 раза быстрее, а на сложных задачах кодирования показывает существенное улучшение качества. FLEET является детерминированным методом, требующим минимальных изменений в существующие pipeline'ы LLM."}, 'en': {'title': 'FLEET: Memory-Enhanced Language Generation for Better Accuracy and Speed', 'desc': 'This paper presents FLEET, a new method that enhances large language models (LLMs) by incorporating a memory mechanism into the text generation process. Traditional temperature sampling can lead to repetitive and less informative outputs due to its lack of awareness of previous generations. FLEET addresses this by representing each generation as a sparse trajectory, allowing it to evaluate and adjust the utility of each token based on prior outputs. The results show that FLEET not only matches the accuracy of existing methods but also speeds up the generation process while improving performance on complex tasks.'}, 'zh': {'title': 'FLEET：提升语言模型生成效率的新方法', 'desc': '本论文提出了一种名为FLEET的新方法，旨在改善大型语言模型（LLMs）在生成过程中的准确性和稳定性。传统的温度采样方法由于缺乏对先前生成内容的记忆，导致生成的答案中语义重复的比例增加，从而降低了效果。FLEET通过引入记忆机制，将每次生成视为通过状态的稀疏轨迹，并利用这些轨迹推断每个标记的效用分数，从而调整生成的结果。实验结果表明，FLEET在复杂编码任务上显著提高了准确性，并且在相同预算下实现了三倍的速度提升。'}}}, {'id': 'https://huggingface.co/papers/2609.24815', 'title': 'Uranus: Building the Next-Generation Simulation Infrastructure for Embodied AI', 'url': 'https://huggingface.co/papers/2609.24815', 'abstract': 'Abstract  Scalable simulation is essential for robot data generation, policy training, evaluation, and safe iteration, yet real-world interaction is costly and conventional simulators require labor-intensive construction. We present Uranus, a data-driven robot simulator built around a joint-trajectory-conditioned autoregressive diffusion model. Uranus offers three key capabilities: (1) streaming, open-ended rollout, which receives future joint-position trajectories online and autoregressively generates one latent frame per step, corresponding to four RGB frames, without a fixed horizon; (2) low-latency generation, achieving 24 FPS after inference optimization; and (3) scalable, extensible robot control, providing a unified interface for synchronized multi-view generation across diverse robot embodiments and camera configurations. We conduct comprehensive quantitative and qualitative evaluations on both in-distribution and out-of-distribution data, providing an objective assessment of Uranus and clearly identifying its current limitations. We release the code and model weights to empower the community with practical tools and insights.', 'score': 0, 'issue_id': 3326, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '2d8326981d3db8bc', 'authors': ['Wenkang Qin', 'Yukun Zhou', 'Noah Shen', 'Jisong Cai', 'Dongxiao Mao', 'Baicheng Li', 'Yue Zhang', 'Wei Sui'], 'affiliations': ['D-Robotics Large Model Team'], 'pdf_title_img': 'assets/pdf/title_img/2609.24815.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Генеративный симулятор для робототехники в реальном времени', 'desc': 'Авторы представляют Uranus — симулятор роботов, основанный на диффузионной модели, которая обусловлена траекториями суставов. Система способна генерировать видеопоследовательности в режиме реального времени, принимая будущие позиции суставов и авторегрессивно производя кадры без фиксированного горизонта предсказания. Модель достигает низкой латентности в 24 кадра в секунду и может масштабироваться на разные типы робототехнических платформ и конфигурации камер через единый интерфейс. Авторы провели комплексную оценку на распределённых и нераспределённых данных, выявив возможности и ограничения подхода, а также открыли исходный код для использования сообществом.'}, 'en': {'title': 'Uranus: Revolutionizing Robot Simulation with Real-Time Data Generation', 'desc': 'The paper introduces Uranus, a novel robot simulator that leverages a joint-trajectory-conditioned autoregressive diffusion model for efficient data generation. It features streaming capabilities that allow for continuous rollout of joint-position trajectories, generating frames in real-time without a predetermined endpoint. Additionally, Uranus achieves low-latency performance, producing 24 frames per second after optimization, making it suitable for dynamic environments. The simulator is designed to be scalable and extensible, supporting various robot types and camera setups, and the authors provide thorough evaluations to highlight its strengths and weaknesses.'}, 'zh': {'title': 'Uranus：高效的机器人数据生成与模拟', 'desc': 'Uranus是一种基于数据驱动的机器人模拟器，采用联合轨迹条件的自回归扩散模型。它具有三大核心功能：首先，支持在线流式生成未来关节位置轨迹，能够自回归生成每一步的潜在帧；其次，经过推理优化后，能够实现低延迟生成，达到每秒24帧的速度；最后，提供可扩展的机器人控制接口，支持多视角生成，适用于不同的机器人和摄像头配置。我们对Uranus进行了全面的定量和定性评估，明确识别了其当前的局限性，并发布了代码和模型权重，以便社区使用。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (8)', '#agi', '#alignment (2)', '#architecture (6)', '#audio (2)', '#benchmark (12)', '#cv (2)', '#data', '#dataset (9)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability (3)', '#leakage (1)', '#long_context (3)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual (1)', '#multimodal (7)', '#open_source (5)', '#optimization (6)', '#plp (3)', '#rag (1)', '#reasoning (5)', '#rl (4)', '#rlhf (3)', '#robotics (6)', '#science (1)', '#security', '#small_models', '#story_generation', '#survey', '#synthetic (4)', '#training (16)', '#transfer_learning (3)', '#video (4)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

                articles = articles.slice(0, 50);
                showLimitHint = true;

                    console.log(`Omitting JSON. ${item["raw_data"]}`);

                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"

                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']

                const articleHTML = `

                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>

                            </div>

                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-24 22:53',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-24 22:53')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-24 22:53')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
