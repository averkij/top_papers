    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

            const isDarkMode = body.classList.contains('dark-theme');

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.26780', 'title': 'SpeakerMem-R1: Speaker-Centered Dual-Track Memory for Multi-Party Dialogue', 'url': 'https://huggingface.co/papers/2609.26780', 'abstract': "Abstract  Long-term conversational memory in multi-party settings requires more than retrieving relevant content from long-term conversations: it must distinguish who said what, whom each statement concerns, how individuals perceive one another, what information is shared by the group, and how states change over time. Recent studies on multi-party dialogue benchmarks show that existing general-purpose LLM memory systems tend to lose person and group relations or struggle to integrate clues distributed across members, groups, and time. Together, these issues reveal two core bottlenecks: message attribution and relational understanding in multi-party dialogue, and state reconstruction from interleaved histories. To address both, we propose SpeakerMem-R1: its dual-track memory stores speaker-labeled verbatim messages and derived states organized into person-level and group-level views, then combines evidence from both tracks by entity, event, and time at query time. To reduce attribution and update errors during structured memory construction while enabling local deployment, we train Writer-R1 with SpeakerLevenshtein and speaker-conditioned GRPO. On GroupMemBench, SocialMemBench, and EverMemBench, SpeakerMem-R1 achieves binary accuracies of 47.9%, 69.2%, and 61.9%, respectively. On the publicly reported EverMemBench leaderboard from EverMind-AI, we achieves 62.33%, the best reported result among the latest state-of-the-art frameworks. It also achieves 70.85% on all 1,986 LoCoMo questions, which we use as a two-person long-term conversation boundary test. In a controlled evaluation of 305 questions, RL raises the SFT Writer's mean accuracy from 57.38% to 68.20%. We report both binary accuracy and token-F1, and ablations show that the verbatim and structured tracks, as well as person-level and group-level views, are complementary under the standardized evaluation interface.", 'score': 77, 'issue_id': 3325, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '8fee4d7ff9d1ae55', 'authors': ['Haobo Zheng', 'Tan Tang', 'Yan Chen', 'Weijie Wang', 'Yingcai Wu'], 'affiliations': ['State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.26780.jpg', 'data': {'categories': ['#benchmark', '#long_context', '#multimodal', '#open_source', '#training', '#optimization', '#rl', '#dataset'], 'emoji': '💬', 'ru': {'title': 'Двухслойная память для отслеживания отношений и атрибуции в групповых диалогах', 'desc': 'В статье предлагается система SpeakerMem-R1 для сохранения долгосрочной памяти в многопартийных диалогах, которая решает проблемы определения, кто что сказал, и отслеживания отношений между участниками. Система использует двухслойную архитектуру памяти: одна дорожка хранит точные сообщения с указанием говорящего, а другая - производные состояния, организованные по уровням отдельных лиц и групп. Для обучения модели Writer-R1 применяются методы обучения с подкреплением (GRPO) и метрика SpeakerLevenshtein, чтобы снизить ошибки при атрибуции сообщений и реконструкции состояний. Достигнутые результаты на нескольких бенчмарках показывают, что предложенный подход превосходит существующие решения для задачи запоминания информации из длинных многопартийных диалогов.'}, 'en': {'title': 'Enhancing Multi-Party Dialogue with SpeakerMem-R1', 'desc': 'This paper introduces SpeakerMem-R1, a memory system designed for long-term conversations in multi-party settings. It addresses challenges like message attribution and understanding relationships among speakers by using a dual-track memory that organizes messages and states at both person and group levels. The system combines evidence from these tracks to improve accuracy in recalling who said what and how group dynamics evolve over time. The results show that SpeakerMem-R1 outperforms existing models on various benchmarks, demonstrating its effectiveness in managing complex conversational histories.'}, 'zh': {'title': '多方对话中的长期记忆新突破', 'desc': '这篇论文探讨了在多方对话中实现长期记忆的挑战，特别是如何区分发言者、理解人际关系以及信息的共享。现有的通用大语言模型在处理这些问题时常常会失去对人和群体关系的把握，或者难以整合分散在不同成员、群体和时间上的线索。为了解决这些问题，作者提出了SpeakerMem-R1，这是一种双轨记忆系统，能够存储标记发言者的原始信息和派生状态，并在查询时结合这些信息。通过在多个基准测试中验证，SpeakerMem-R1在准确性上达到了最新的最佳结果，显示出其在多方对话中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.23038', 'title': 'Spatial-Interactor: Learning Spatial Reasoning through Interaction with the Observable Physical World', 'url': 'https://huggingface.co/papers/2609.23038', 'abstract': "Abstract  Spatial reasoning is essential for vision-language models (VLMs) to understand and act in the physical world. Reasoning in dynamic environments requires VLMs to perceive local state transitions caused by object motion and viewpoint changes and integrate them over long trajectories to maintain an updated spatial state, yet existing VLMs remain limited in both capabilities. Current spatial training primarily focuses on static questions about object attributes and spatial relations, providing limited direct supervision for state transitions; in contrast, interaction trajectories naturally connect a preceding observation, an action, and a subsequent observation, offering direct supervision for local state transitions, while complete trajectories reveal dependencies among consecutive transitions. We therefore introduce Spatial-Interactor, a framework that trains VLMs to model physical-world state transitions through interaction, organizing this learning process into a three-level curriculum covering L1 passive world-state transitions, L2 active self-state transitions, and L3 long-horizon interaction trajectories. Accordingly, we construct the Learning from Spatial Interaction dataset (LSI-108K) from simulated and real interaction trajectories, with tasks aligned with the objective of each level. Our two-stage training strategy applies Supervised Fine-Tuning (SFT) to L1 and L2 for local transition modeling, and On-Policy Distillation (OPD) then uses privileged self-distillation: a teacher branch given segment-level transition descriptions supervises the student's on-policy CoT, helping the student learn to integrate consecutive transitions over L3 long trajectories. Experiments across multiple VLMs and spatial benchmarks show consistent gains in local transition modeling and long-horizon integration.", 'score': 41, 'issue_id': 3325, 'pub_date': '2026-09-19', 'pub_date_card': {'ru': '19 сентября', 'en': 'September 19', 'zh': '9月19日'}, 'hash': 'a7a86c7c81df987d', 'authors': ['Kaixiang Yao', 'Xu Wang', 'Miao Pan', 'Hu Xiyue', 'Weishi Wang', 'Daniel Dahlmeier', 'Jintao Chen', 'Yongliang Shen', 'Xuhong Zhang', 'Wenqi Zhang'], 'affiliations': ['SAP', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.23038.jpg', 'data': {'categories': ['#reasoning', '#rlhf', '#long_context', '#multimodal', '#synthetic', '#training', '#dataset', '#cv'], 'emoji': '🎬', 'ru': {'title': 'Обучение VLM пространственному мышлению через моделирование переходов состояния взаимодействия', 'desc': 'Работа представляет Spatial-Interactor, фреймворк для обучения визуально-языковых моделей моделированию переходов состояния в физическом мире через взаимодействие. Авторы вводят иерархический трёхуровневый curriculum обучения: пассивные переходы мира, активные переходы агента и долгосрочные траектории взаимодействия. Они создали датасет LSI-108K на основе симулированных и реальных траекторий взаимодействия с задачами, выровненными под каждый уровень обучения. Стратегия двухэтапного обучения применяет Supervised Fine-Tuning для локального моделирования переходов и On-Policy Distillation с привилегированной самодистилляцией для интеграции последовательных переходов на длинных траекториях.'}, 'en': {'title': 'Enhancing VLMs with Spatial Interaction Learning', 'desc': 'This paper introduces Spatial-Interactor, a new framework designed to enhance vision-language models (VLMs) by improving their ability to understand spatial reasoning in dynamic environments. It emphasizes the importance of modeling state transitions caused by object movements and viewpoint changes, which current VLMs struggle with. The framework employs a three-level curriculum that trains VLMs on passive and active state transitions, culminating in long-horizon interaction trajectories. Additionally, the Learning from Spatial Interaction dataset (LSI-108K) is created to support this training, leading to improved performance in local transition modeling and integration over time.'}, 'zh': {'title': '通过交互提升空间推理能力', 'desc': '空间推理对于视觉语言模型（VLMs）理解和在物理世界中行动至关重要。现有的VLM在动态环境中的能力有限，无法有效处理物体运动和视角变化带来的状态转变。我们提出了Spatial-Interactor框架，通过交互来训练VLM建模物理世界的状态转变，并设计了一个三层次的学习课程。我们的实验表明，该方法在局部状态转变建模和长时间轨迹整合方面取得了一致的提升。'}}}, {'id': 'https://huggingface.co/papers/2609.24308', 'title': 'HappyWorld-Bench', 'url': 'https://huggingface.co/papers/2609.24308', 'abstract': 'Abstract  Evaluating world models requires assessing both the quality of the worlds they generate and their consistency and responsiveness under exploration, interaction, and modification. We introduce HappyWorld-Bench, a comprehensive benchmark that evaluates whether generated worlds remain reliable as agents interact with them. Our design is built on a hierarchical capability framework of six world capabilities (W1-W6), from generative construction to unified world modeling, instantiated across three independent evaluation tracks: video world models, spatial world models, and embodied world models. HappyWorld-Bench comprises 1,138 video prompts, 300 spatial scenes, and 254 embodied test cases. Across all three tracks, we build and operate HappyWorld-Arena to organize human A/B comparisons and derive model-level Elo ratings, which complement newly designed automated metrics that capture behavioral correctness. We evaluate 14 video world models, 9 spatial systems, and 8 embodied candidates under this unified framework. Results reveal remaining reliability gaps across all three tracks: video models exhibit reduced consistency during extended rollouts and revisits, spatial models achieve at best 70.14% placement accuracy and 73.33% edit execution, and embodied models struggle to preserve state across multi-step actions and respond precisely to altered action conditions and physical rules. These findings highlight the need to evaluate world models not only by visual quality, but also by state consistency and the correctness of their responses to actions and interventions.', 'score': 39, 'issue_id': 3325, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '61aa17134088db31', 'pdf_title_img': 'assets/pdf/title_img/2609.24308.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#video', '#agents', '#3d'], 'emoji': '🌍', 'ru': {'title': 'Надёжные миры: бенчмарк для проверки последовательности и отзывчивости генеративных моделей миров', 'desc': 'В работе представлена HappyWorld-Bench — комплексный бенчмарк для оценки качества мировых моделей, которые генерируют виртуальные миры. Бенчмарк основан на иерархической структуре из шести возможностей (W1-W6) и охватывает три типа моделей: видео-миры, пространственные миры и воплощённые миры. Исследование включает оценку 14 видео-моделей, 9 пространственных систем и 8 воплощённых кандидатов с использованием как человеческих сравнений (A/B тесты и рейтинги Elo), так и автоматических метрик. Результаты выявили значительные проблемы с надёжностью и согласованностью состояния во всех трёх направлениях, подчеркивая необходимость оценивать мировые модели не только по визуальному качеству, но и по способности сохранять логическую консистентность и правильно реагировать на действия агентов.'}, 'en': {'title': 'Evaluating World Models: Beyond Visual Quality to Reliability and Responsiveness', 'desc': 'This paper presents HappyWorld-Bench, a benchmark designed to evaluate the reliability of world models in machine learning. It assesses how well these models maintain consistency and responsiveness when agents interact with them. The evaluation framework includes six capabilities and three tracks: video, spatial, and embodied world models, with a total of over 1,600 test cases. The results indicate significant reliability gaps, emphasizing the importance of evaluating world models not just on visual quality, but also on their ability to maintain state and respond accurately to actions.'}, 'zh': {'title': '评估世界模型的全面基准测试', 'desc': '本论文介绍了一个名为HappyWorld-Bench的基准测试，用于评估世界模型的质量和一致性。该基准测试包括六种世界能力，从生成构建到统一世界建模，并分为视频世界模型、空间世界模型和具身世界模型三个独立评估轨道。研究结果显示，视频模型在长时间运行和重访时一致性降低，空间模型的放置准确率和编辑执行率最高分别为70.14%和73.33%，而具身模型在多步动作中难以保持状态。论文强调，评估世界模型不仅要考虑视觉质量，还要关注状态一致性和对动作及干预的正确响应。'}}}, {'id': 'https://huggingface.co/papers/2609.28466', 'title': 'The Past Frames the Future: Memory for Autoregressive Video Generation', 'url': 'https://huggingface.co/papers/2609.28466', 'abstract': 'Abstract  Advances in generative models have improved video fidelity, enabling long-horizon generation, interactive world modeling, and evolving visual environments. Autoregressive (AR) video generation extends visual sequences through causal rollouts. However, a fundamental bottleneck emerges: as the generated sequence expands, practical models must operate under strictly bounded context windows, storage, and computational limits. Consequently, critical historical information, e.g., entity identities, dynamic states, and intervention-induced causal changes, often leaves the active context long before its relevance diminishes. Overcoming this limitation and maintaining temporal persistence constitutes a fundamental memory problem. We present a systematic and comprehensive review of memory mechanisms in AR video generation. We formulate memory operationally as persistent historical information maintained across outer AR steps, capable of influencing future generation even after the originating evidence is no longer locally accessible. Building upon this unified framework, we organize the literature through five complementary perspectives: (I) Forms, the representational carriers of history; (II) Functions, the specific semantic and physical information requiring preservation; (III) Operations, the lifecycle of writing, reading, updating, managing, and integrating memory; (IV) Learning, the optimization of memory behaviors under closed-loop rollouts; and (V) Evaluation, the paradigms for diagnosing genuine memory capabilities. We conclude by synthesizing open challenges, including composable and resource-aware memory architectures, trustworthy state updating, self-rollout learning, and standardized evaluation. By bridging representations, mechanisms, and learning paradigms, this paper establishes a structured foundation for developing reliable, memory-conditioned video generation systems.', 'score': 36, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '14ad5a85348ecdac', 'authors': ['Harold Haodong Chen', 'Rongjin Guo', 'Disen Lan', 'Wen-Jie Shu', 'Hongfei Zhang', 'Hanzhe Hu', 'Shengtao Yao', 'Zixin Zhang', 'Guibin Zhang', 'Zhefan Rao', 'Jinxiu Liu', 'Yexin Liu', 'Rui Peng', 'Yuhao Liu', 'Bin Ren', 'Shuai Yang', 'Yukang Chen', 'Salman Khan', 'Ying-Cong Chen', 'Ser-Nam Lim', 'Rynson W. H. Lau', 'Nicu Sebe', 'Yu Cheng', 'Ming-Hsuan Yang', 'Qifeng Chen'], 'affiliations': ['CMU', 'CityUHK', 'FDU', 'Georgia Tech', 'HKUST', 'HKUST(GZ)', 'MBZUAI', 'NTU', 'NUS', 'NVIDIA', 'NYU', 'PKU', 'UC Merced', 'UCF', 'UNITN', 'ZODA'], 'pdf_title_img': 'assets/pdf/title_img/2609.28466.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Память как фундамент для длительной генерации видеопоследовательностей', 'desc': 'В статье рассматривается проблема сохранения памяти в автарегрессивных моделях генерации видео, которые расширяют визуальные последовательности пошаговым предсказанием. Авторы показывают, что при увеличении длины генерируемого видео важная историческая информация об объектах и их состояниях выходит за пределы ограниченного контекстного окна модели, что приводит к потере пространственно-временной последовательности. В работе предложена систематическая классификация механизмов памяти, охватывающая пять аспектов: формы представления информации, функции хранения, операции с памятью, методы обучения и парадигмы оценки. Авторы формулируют открытые проблемы и предлагают основу для разработки надежных систем генерации видео с механизмами долговременной памяти.'}, 'en': {'title': 'Enhancing Memory for Better Video Generation', 'desc': 'This paper discusses the challenges of maintaining memory in autoregressive (AR) video generation models, which are used to create long sequences of video. As these models generate longer videos, they face limitations in context windows and computational resources, leading to the loss of important historical information. The authors review various memory mechanisms that can help retain relevant data over time, ensuring that past information can still influence future video generation. They propose a structured framework to address these memory issues, highlighting the need for improved memory architectures and evaluation methods in AR video systems.'}, 'zh': {'title': '构建可靠的记忆驱动视频生成系统', 'desc': '本论文探讨了自回归视频生成中的记忆机制，旨在解决生成序列扩展时的历史信息丢失问题。我们将记忆定义为在外部自回归步骤中保持的持久历史信息，这些信息能够影响未来的生成过程。文章通过五个互补的视角组织相关文献，包括记忆的形式、功能、操作、学习和评估。最后，我们总结了当前面临的挑战，并为开发可靠的、基于记忆的视频生成系统奠定了结构化基础。'}}}, {'id': 'https://huggingface.co/papers/2609.27334', 'title': 'Just-in-Time Memory: Learning to Curate Task-Adaptive Memory for LLM Agents', 'url': 'https://huggingface.co/papers/2609.27334', 'abstract': 'Abstract  Agentic memory systems reuse past experience to improve future performance, yet most existing designs curate memory at write time: once a task is completed, its trajectory is distilled into a fixed artifact, such as a reflection, workflow, skill, or reasoning strategy, that is later retrieved by similarity. This forces the system to decide what is worth remembering before the future query is known, irreversibly discarding information and producing a query-independent summary that must serve many possible downstream tasks. Learning such a write-time curator is also difficult because the value of a storage decision may only become apparent when a relevant query arrives, potentially many tasks later, creating a long-horizon credit-assignment problem. We instead retain raw trajectories and defer curation until read time, when the current task is known. Given the retrieved traces and the new task, a memory curator synthesizes a compact, task-adaptive payload tailored to the immediate need. Because this payload is consumed on the same task, the curator can be trained directly from immediate task success, avoiding delayed utility signals and the need to artificially group related tasks. Across ALFWorld, WebShop, and τ^2-bench, our Just-in-Time Memory (JitMem) consistently outperforms no-memory agents as well as heuristic and learned write-time memory methods, improving over the strongest baseline by 16.2, 16.3, and 3.9 absolute success-rate points, respectively. Notably, even an untrained curator is already competitive with or surpasses these baselines, showing that task-adaptive read-time curation itself is a major source of the gain; training the curator further compounds the improvement.', 'score': 33, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '259800bc315483d5', 'authors': ['Yefan Zhou', 'Yang Li', 'Zeyu Leo Liu', 'Semih Yavuz', 'Shafiq Joty'], 'affiliations': ['Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.27334.jpg', 'data': {'categories': ['#training', '#agents'], 'emoji': '💾', 'ru': {'title': 'Память в реальном времени: кураторство при прочтении вместо предварительной фильтрации', 'desc': 'В работе предложена новая архитектура памяти для агентов, которая отличается от традиционного подхода сохранением полных траекторий вместо их сжатия на этапе записи. Система деферирует кураторство памяти до момента чтения, когда известна текущая задача, что позволяет синтезировать компактные, адаптивные к задаче полезные нагрузки. Куратор можно обучать напрямую на основе успеха текущей задачи без задержанных сигналов о полезности, решая сложную проблему кредит-ассайнмента на длинном горизонте. Метод Just-in-Time Memory показывает значительное улучшение производительности на нескольких бенчмарках, превосходя эвристические и выученные методы кураторства памяти на этапе записи.'}, 'en': {'title': 'Empowering Agents with Just-in-Time Memory', 'desc': 'This paper introduces a novel approach called Just-in-Time Memory (JitMem) that enhances agentic memory systems by deferring the curation of memory until the moment it is needed. Instead of summarizing past experiences into fixed artifacts at write time, JitMem retains raw trajectories and curates them based on the current task at read time. This method allows for a more adaptive and efficient use of memory, as the curator can directly learn from immediate task success without the complications of delayed feedback. The results demonstrate that JitMem significantly outperforms traditional memory methods across various benchmarks, highlighting the effectiveness of task-adaptive memory curation.'}, 'zh': {'title': '即时记忆：任务驱动的智能记忆系统', 'desc': '本文提出了一种新的记忆系统，称为即时记忆（JitMem），它在读取时进行记忆整理，而不是在写入时。这样可以保留原始的记忆轨迹，直到需要时再进行处理，从而避免了在任务完成前就决定哪些信息值得记住的问题。通过这种方法，记忆策展人能够根据当前任务合成适应性强的记忆负载，直接从任务成功中进行训练。实验结果表明，JitMem在多个基准测试中表现优于传统的无记忆代理和其他记忆方法，显示出即时整理的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.22947', 'title': 'RewardVerse: Rubric-Guided Policy Optimization for Video Reward Modeling', 'url': 'https://huggingface.co/papers/2609.22947', 'abstract': 'Abstract  Reinforcement learning (RL) is vital for optimizing video generation models, with a robust reward model (RM) serving as the cornerstone. However, existing video reward models often produce unstable scalar scores because they directly map complex, subjective video quality into a single score without explicit evaluation criteria. This leads to scalar drift, where the scoring scale collapses or shifts across different prompts, making the reward unreliable for RL. Drawing inspiration from professional human annotation engineering, we address this problem with RewardVerse, a rubric-based video reward framework that introduces a dynamic rubric as an intermediate representation between the evaluation query and the scorer. Instead of unconstrained direct scoring, RewardVerse first generates explicit evaluation criteria and then performs rubric-guided scoring, providing a stable semantic anchor that mitigates scalar drift. To efficiently optimize this collaborative pipeline, we propose Rubric-Guided Policy Optimization (RGPO), a two-stage training algorithm. RGPO first warms up the scorer using self-evolving seed rubrics and then jointly optimizes the rubric generator to produce query-adaptive evaluation criteria while continuously aligning the scorer with human ratings. Extensive experiments on the 16-dimensional EvalVerse benchmark and external datasets demonstrate that RewardVerse mitigates scalar drift, achieves state-of-the-art performance on both pointwise and pairwise evaluation, and provides a robust and interpretable reward signal for RL in video generation.', 'score': 20, 'issue_id': 3325, 'pub_date': '2026-09-19', 'pub_date_card': {'ru': '19 сентября', 'en': 'September 19', 'zh': '9月19日'}, 'hash': '1ec57088e4079af8', 'authors': ['Zhenchen Tang', 'Yang Li', 'Songlin Yang', 'Bo Peng', 'Xiaotong Zhao', 'Shuai Li', 'Haotian Fan', 'Alan Zhao', 'Jing Dong'], 'affiliations': ['New Laboratory of Pattern Recognition, Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences', 'Tencent', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.22947.jpg', 'data': {'categories': ['#training', '#benchmark', '#rl', '#video'], 'emoji': '📋', 'ru': {'title': 'Рубрики как якорь стабильности: от хаоса оценок к надежному вознаграждению', 'desc': 'Статья описывает RewardVerse — фреймворк для оценки качества видео, основанный на явных критериях оценки (рубриках), который решает проблему нестабильности скалярных оценок в существующих моделях вознаграждения. Вместо прямого преобразования качества видео в единую оценку, метод сначала генерирует детальные критерии оценки, а затем использует их для стабильной и интерпретируемой оценки. Авторы предлагают алгоритм RGPO (Rubric-Guided Policy Optimization), который двухэтапно оптимизирует генератор критериев и оценщик, выравнивая их с человеческими оценками. Экспериментальные результаты показывают, что RewardVerse обеспечивает надежный сигнал вознаграждения для обучения с подкреплением моделей генерации видео и превосходит существующие подходы.'}, 'en': {'title': 'Stable Rewards for Video Generation with RewardVerse', 'desc': 'This paper presents RewardVerse, a new framework for improving video reward models in reinforcement learning (RL). Traditional models struggle with unstable scalar scores due to their direct mapping of subjective video quality into a single score, leading to unreliable rewards. RewardVerse introduces a rubric-based approach that generates explicit evaluation criteria, allowing for more stable and interpretable scoring. The proposed Rubric-Guided Policy Optimization (RGPO) algorithm enhances this process by optimizing both the rubric generator and the scorer, resulting in better alignment with human ratings and improved performance in video generation tasks.'}, 'zh': {'title': '动态评分标准，稳定视频生成奖励', 'desc': '强化学习在视频生成模型的优化中至关重要，而强大的奖励模型是其基础。然而，现有的视频奖励模型常常因为直接将复杂的主观视频质量映射为单一分数而导致不稳定的标量评分。这种标量漂移使得奖励在不同提示下变得不可靠。为了解决这个问题，本文提出了RewardVerse，一个基于评分标准的视频奖励框架，通过动态评分标准作为评估查询与评分者之间的中介表示，从而提供稳定的语义锚点。'}}}, {'id': 'https://huggingface.co/papers/2609.26355', 'title': 'PACT: From Credit Assignment to Critic Alignment', 'url': 'https://huggingface.co/papers/2609.26355', 'abstract': 'Abstract  Reinforcement learning has become a central component of large language model (LLM) post-training, yet token-level credit lacks a generally accepted mathematical definition, leaving its relationship to commonly used training signals unclear. We formulate three regularity conditions, namely Completeness, Prefix Consistency, and Neutrality, and prove that they uniquely determine token-level credit. This characterization provides a unified basis for explaining phenomena across existing algorithms and guides the development of an improved actor-critic training procedure. Through this lens, an ideal teacher in On-Policy Distillation (OPD) acts as an implicit critic, yielding an expected policy gradient proportional to that induced by token-level credit. Response-level REINFORCE Leave-One-Out (RLOO) signals match the expected policy-gradient contribution of token-level credit despite their coarser granularity. We further establish approximate credit sparsity under bounded outcome rewards and show how intermediate critic errors in Generalized Advantage Estimation (GAE) can become comparable to the underlying credit. These motivate Policy Aligned Critic Training (PACT), which adopts an Actor-then-Critic update order to apply importance sampling correction to critic training and better align the critic with the updated policy. In agentic mathematical reasoning, PACT achieves 72.87% average accuracy across four benchmarks, outperforming GRPO and PPO by 8.80 and 13.16 percentage points, respectively. On SWE-bench Verified, PACT achieves a pass rate of 67.4%, outperforming PPO, GRPO, and SAO by 2.4, 2.0, and 3.8 percentage points, respectively.', 'score': 14, 'issue_id': 3325, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '9c9c65d3b8dd92e7', 'pdf_title_img': 'assets/pdf/title_img/2609.26355.jpg', 'data': {'categories': ['#reasoning', '#rlhf', '#alignment', '#training', '#optimization', '#rl', '#plp', '#math'], 'emoji': '🎯', 'ru': {'title': 'Математическая формализация кредита на уровне токенов для улучшения обучения LLM с подкреплением', 'desc': 'Статья исследует проблему распределения кредита на уровне токенов в обучении больших языковых моделей с подкреплением, предложив математическую формализацию через три условия регулярности: Полнота, Согласованность префикса и Нейтральность. Авторы доказывают, что эти условия однозначно определяют кредит на уровне токенов и объясняют связь существующих алгоритмов обучения с этой концепцией. На основе этого анализа предложен новый алгоритм PACT (Policy Aligned Critic Training), который улучшает обучение актор-критик путём применения коррекции важности выборки и лучшего выравнивания критика с обновленной политикой. Экспериментальные результаты показывают значительное улучшение: на математических рассуждениях PACT достигает 72.87% точности, а на SWE-bench Verified — 67.4% успеха, превосходя существующие методы как PPO, так и GRPO.'}, 'en': {'title': 'Defining Token-Level Credit for Enhanced Reinforcement Learning', 'desc': 'This paper addresses the challenges in defining token-level credit in reinforcement learning for large language models. It introduces three regularity conditions—Completeness, Prefix Consistency, and Neutrality—that help clarify the relationship between token-level credit and training signals. The authors propose a new training method called Policy Aligned Critic Training (PACT), which improves the alignment of the critic with the policy using an Actor-then-Critic update order. Experimental results show that PACT significantly outperforms existing methods like GRPO and PPO in various benchmarks, demonstrating its effectiveness in enhancing agentic reasoning.'}, 'zh': {'title': '强化学习中的令牌级信用新定义', 'desc': '强化学习在大型语言模型的后期训练中变得至关重要，但令牌级别的信用缺乏普遍接受的数学定义，导致其与常用训练信号的关系不明确。我们提出了三个规律性条件：完整性、前缀一致性和中立性，并证明它们唯一确定了令牌级别的信用。这一特征为解释现有算法中的现象提供了统一基础，并指导改进的演员-评论家训练程序的发展。通过这种视角，政策对齐评论家训练（PACT）采用演员-然后-评论家的更新顺序，应用重要性采样修正评论家训练，从而更好地将评论家与更新的策略对齐。'}}}, {'id': 'https://huggingface.co/papers/2609.27891', 'title': "Schrödinger's Code Repository: Have LLMs Learned SWE-bench or Memorized It?", 'url': 'https://huggingface.co/papers/2609.27891', 'abstract': "Abstract  Repository-level coding benchmarks have become the standard for evaluating coding agents, yet they inherently suffer from data leakage because they are built upon popular open-source repositories repeatedly used for training. Consequently, strong performance may reflect memorization of canonical repository cues rather than robust repository reasoning. We propose SchrodingerRepo (Schrödinger's Repository), an evaluation framework for testing coding agents under dynamically instantiated repository representations. Instead of repeatedly using a static representation of the test repository, SchrodingerRepo treats the test repository as an evaluation-time latent variable that is dynamically instantiated only when the agent enters the evaluation environment. The instantiated repository preserves the original executable behavior while eroding familiar cues such as naming conventions, file layouts, and implementation patterns through four transformation levels: problem statement reconstruction, namespace remapping, intra-file layout reordering, and functionality-preserving code rewriting. We evaluate popular LLMs on SWE-bench Verified and SWE-QA. Results show that removing familiar repository cues consistently degrades agent performance and substantially increases interaction costs across models. Further analysis reveals that the additional cost is primarily caused by increased difficulty in repository exploration and localization. These findings suggest that current coding agents may partially rely on memorized repository-side cues, highlighting the need for evaluation under dynamically instantiated repository representations.", 'score': 14, 'issue_id': 3325, 'pub_date': '2026-08-21', 'pub_date_card': {'ru': '21 августа', 'en': 'August 21', 'zh': '8月21日'}, 'hash': '2e9c14046379743f', 'authors': ['Silin Chen', 'Yufei Yang', 'Xiaodong Gu', 'Yuling Shi', 'Chengcheng Wan', 'Haibing Guan'], 'affiliations': ['East China Normal University', 'Shanghai Jiao Tong University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.27891.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#plp', '#agents', '#leakage'], 'emoji': '🔀', 'ru': {'title': 'Разоблачение меморизации: динамическая трансформация репозиториев для честной оценки кодирующих агентов', 'desc': 'В статье исследуется проблема утечки данных при оценке агентов, решающих задачи кодирования, используя популярные открытые репозитории. Авторы предлагают SchrodingerRepo — фреймворк для тестирования, который динамически трансформирует репозитории во время оценки, сохраняя их функциональность, но удаляя знакомые подсказки, такие как соглашения об именовании и структура файлов. Эксперименты на бенчмарках SWE-bench показывают, что удаление этих подсказок существенно снижает производительность LLM и увеличивает затраты на взаимодействие с кодом. Результаты свидетельствуют, что современные агенты для кодирования частично полагаются на запомненные особенности репозиториев, а не на истинное понимание кода.'}, 'en': {'title': 'Dynamic Evaluation to Uncover True Coding Agent Skills', 'desc': 'This paper introduces SchrodingerRepo, a new framework for evaluating coding agents that addresses the issue of data leakage in traditional benchmarks. By dynamically changing the representation of test repositories, it prevents agents from relying on memorized cues from familiar code structures. The framework applies various transformations to the repository, making it harder for agents to exploit known patterns. The results indicate that when familiar cues are removed, coding agents struggle more, suggesting they often depend on memorization rather than true understanding of code.'}, 'zh': {'title': '动态评估编码代理的能力', 'desc': '本论文提出了一种新的评估框架，名为SchrodingerRepo，用于测试编码代理在动态生成的代码库表示下的表现。传统的评估方法容易受到数据泄露的影响，因为它们使用的是常见的开源代码库，这可能导致代理仅仅记忆了这些库的特征，而不是具备真正的推理能力。SchrodingerRepo通过四个转化层次，动态改变测试代码库的结构，去除熟悉的线索，从而更真实地评估编码代理的能力。研究结果表明，去除熟悉的代码库线索会显著降低代理的表现，增加交互成本，说明当前的编码代理在一定程度上依赖于记忆的代码库特征。'}}}, {'id': 'https://huggingface.co/papers/2609.25963', 'title': 'GeoPair: Geometry-Preserving Cross-Layer Factorization for Training-Free Transformer Compression', 'url': 'https://huggingface.co/papers/2609.25963', 'abstract': "Abstract  Transformer architectures exhibit cross-layer redundancies, yet post-training compression pipelines typically optimize layers in isolation or rely on heuristic grouping strategies that disregard layer-specific activation geometries. We introduce a principled, training-free framework that sequentially optimizes cross-layer weight pairings and shared-dictionary factorizations. Rather than forcing weights of adjacent layers to share a basis or heuristically merging activation statistics, our approach identifies structurally compatible projections and learns a shared representation that better preserves each layer's distinct calibration geometry. Coupled with structured sparsity, this yields highly efficient weight decompositions without sacrificing functional fidelity. Across diverse architectures, scales, and modalities, our method achieves state-of-the-art results, consistently outperforming independent structured weight decompositions and alternative pairwise weight factorizations, which operate under heuristic grouping strategies. By replacing heuristic engineering strategies with a convergent, optimization-driven pipeline, we establish a theoretically grounded foundation for scalable, transformer compression across different modalities.", 'score': 11, 'issue_id': 3326, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '48b557357e9c08f9', 'authors': ['Baher Mohammad', 'Ammar Ali', 'Stamatios Lefkimmiatis'], 'affiliations': ['MWS AI', 'MWS AI, ITMO University'], 'pdf_title_img': 'assets/pdf/title_img/2609.25963.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🗜️', 'ru': {'title': 'От эвристик к оптимизации: принципиальное сжатие трансформеров через кросс-слойную факторизацию', 'desc': 'В статье предложен новый подход к сжатию трансформеров, который использует принципиальную оптимизацию перекрёстных связей между слоями вместо эвристических методов. Авторы разработали беспошаговый метод факторизации весов, который последовательно находит совместимые проекции и учит общее представление, сохраняя геометрию активаций каждого слоя. Метод комбинируется со структурированной разреженностью, что позволяет получить эффективные декомпозиции весов без потери функциональности. На различных архитектурах и модальностях подход показывает лучшие результаты, чем независимые методы разложения и эвристические стратегии.'}, 'en': {'title': 'Optimizing Transformer Compression Through Layer Synergy', 'desc': "This paper presents a new method for compressing transformer models by optimizing the relationships between layers instead of treating them separately. The authors propose a training-free framework that finds compatible weight pairings and shared representations, which helps maintain the unique characteristics of each layer. By incorporating structured sparsity, their approach achieves efficient weight reductions while keeping the model's performance intact. The results show that this method outperforms traditional techniques, providing a more effective way to compress transformers across various architectures and applications."}, 'zh': {'title': '优化变压器压缩的新方法', 'desc': '本文提出了一种新的变压器压缩方法，旨在优化跨层权重配对和共享字典分解。与传统方法不同，我们的方法不依赖于启发式分组，而是通过识别结构兼容的投影来学习共享表示，从而更好地保留每层的独特校准几何。结合结构稀疏性，这种方法实现了高效的权重分解，同时保持了功能的准确性。我们的实验表明，该方法在多种架构和模态下均取得了最先进的结果，超越了现有的独立结构权重分解和其他启发式方法。'}}}, {'id': 'https://huggingface.co/papers/2609.23784', 'title': 'PackLab: A Comprehensive Framework for Developing, Training, and Evaluating MLLMs in Robotic Bin Packing', 'url': 'https://huggingface.co/papers/2609.23784', 'abstract': 'Abstract  Robotic bin packing requires long-horizon sequential decision-making, as each object placement affects the available space for subsequent packing. Existing methods primarily rely on hand-crafted geometric heuristics that optimize predefined objectives or reinforcement learning policies learned through trial and error over predefined training configurations. Despite recent advances in multimodal large language models (MLLMs) for this task, their potential for closed-loop sequential decisions across heterogeneous packing configurations remains underexplored. To address this gap, we introduce PackLab, a comprehensive framework for developing, training, and evaluating MLLMs for closed-loop robotic bin packing. PackLab-Suite provides a physics-based simulation platform for scalable generation of diverse training packing trajectories and evaluation of their physical outcomes. PackLab-VLM is a packing-specialized MLLM that understands the evolving object and container states to jointly select objects and predict placements in a closed-loop manner. PackLab-Bench provides standardized packing scenarios at multiple difficulty levels for systematic evaluation. Extensive experiments demonstrate that, on average, PackLab-VLM outperforms conventional packing heuristics, traditional reinforcement learning methods, and general-purpose MLLMs across object sets and container configurations, highlighting the potential of MLLMs for long-horizon robotic packing. The code, model, dataset, and benchmark are available at https://github.com/Correr-Zhou/PackLab .', 'score': 10, 'issue_id': 3325, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': 'ecdfe5f66a702568', 'authors': ['Donghao Zhou', 'Jia-Hui Pan', 'Fan Zhang', 'Xingyuan Bu', 'Shilong Li', 'Xiaojie Gao', 'Yun-Hui Liu', 'Chi-Wing Fu', 'Pheng-Ann Heng'], 'affiliations': ['Chinese University of Hong Kong', 'SenseTime Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.23784.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#multimodal', '#open_source', '#rl', '#dataset'], 'emoji': '📦', 'ru': {'title': 'Языковые модели для интеллектуальной укладки: от зрения к действию', 'desc': 'В работе представлена PackLab — комплексная система для обучения и оценки мультимодальных больших языковых моделей (MLLM) в задаче робототехнического укладывания предметов в контейнеры. Авторы разработали специализированную модель PackLab-VLM, которая анализирует текущее состояние объектов и контейнера, чтобы одновременно выбирать предметы и предсказывать их размещение в замкнутом цикле управления. Система включает симулятор на основе физики для генерации разнообразных обучающих траекторий и набор стандартизированных сценариев для систематической оценки. Экспериментальные результаты показывают, что PackLab-VLM превосходит традиционные эвристики, методы обучения с подкреплением и универсальные MLLM, демонстрируя эффективность мультимодальных языковых моделей для долгогоризонтного решения задач робототехники.'}, 'en': {'title': 'Revolutionizing Robotic Bin Packing with PackLab', 'desc': 'This paper presents PackLab, a new framework designed for robotic bin packing that utilizes multimodal large language models (MLLMs). Unlike traditional methods that depend on fixed geometric rules or reinforcement learning, PackLab allows for dynamic decision-making by understanding the changing states of objects and containers. The framework includes a simulation platform for generating diverse training scenarios and a specialized MLLM that can predict optimal placements in real-time. Experimental results show that PackLab-VLM significantly outperforms existing packing strategies, demonstrating the effectiveness of MLLMs in complex packing tasks.'}, 'zh': {'title': 'PackLab：机器人装箱的新突破', 'desc': '本论文介绍了一种名为PackLab的框架，用于开发和评估多模态大型语言模型（MLLMs）在机器人装箱中的应用。PackLab通过物理仿真平台生成多样化的训练轨迹，并评估其物理结果，从而支持长时间序列决策。PackLab-VLM是一个专门针对装箱的MLLM，能够理解物体和容器状态的变化，并在闭环中选择物体和预测放置。实验结果表明，PackLab-VLM在多种物体和容器配置下，平均表现优于传统的装箱启发式方法和一般目的的MLLM，展示了MLLM在长时间机器人装箱中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.28256', 'title': 'MemBodied: Recurrent Associative Memory for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2609.28256', 'abstract': 'Abstract  Vision-Language-Action models provide a strong foundation for general-purpose robot control, yet a vast majority of policies do not preserve and leverage episode-level information beyond the current observation. This limitation is consequential in history-dependent manipulation tasks that depend on information available only in past observations. Retaining past observations in context can aid in recovering this information, but at the significant cost of ever-growing, bloated context and inference latency. We thus introduce MemBodied, a fixed-size episodic memory with two complementary components: an associative state that records interactions across policy calls and an episode anchor that preserves a compact representation of the initial scene as a reference. At each policy call, the model conditions action generation on the current input and the memory components, rather than directly using past observations. Across five evaluated RMBench tasks requiring memory, MemBodied achieves 7.81times the mean success rate of a stateless policy and 2.98times of vanilla recurrent memory, while outperforming the strongest memory-augmented baseline by 1.3times with 10times fewer added parameters. On the fully observable LIBERO-Long suite, it reached 90.6%, a 5.4% improvement over the stateless π_0 policy. These findings support MemBodied as a practical alternative to expanding the policy context for history-dependent manipulation.', 'score': 9, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'bc41cde2ae637581', 'authors': ['Tej Deep Pala', 'Navonil Majumder', 'Bryce Goh', 'Raphael Yee', 'Jianfei Yang', 'Liming Chen', 'Soujanya Poria'], 'affiliations': ['Ecole Centrale de Lyon', 'Griffin Labs', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2609.28256.jpg', 'data': {'categories': ['#robotics', '#architecture', '#long_context', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Компактная память для истории-зависимого управления роботами', 'desc': 'Статья представляет MemBodied — модель для управления роботами, которая использует фиксированный размер эпизодической памяти для решения задач манипуляции, зависящих от истории. Предложенный подход состоит из двух компонентов: ассоциативного состояния, записывающего взаимодействия, и якоря эпизода, сохраняющего компактное представление начальной сцены. Вместо того чтобы раздувать контекст прошлыми наблюдениями, модель кондиционирует генерацию действий на текущем вводе и компонентах памяти. На бенчмарках MemBodied достигает значительного прироста точности — в 7.81 раза выше, чем базовая политика без памяти, при этом используя в 10 раз меньше параметров.'}, 'en': {'title': 'MemBodied: Efficient Memory for Robot Control', 'desc': 'The paper introduces MemBodied, a novel approach to enhance robot control by incorporating a fixed-size episodic memory. This memory consists of an associative state for recording interactions and an episode anchor for maintaining a compact scene representation. By conditioning action generation on both the current input and memory components, MemBodied effectively retains crucial past information without the drawbacks of bloated context. The results demonstrate significant improvements in task success rates compared to traditional stateless and recurrent memory policies, showcasing its efficiency in history-dependent manipulation tasks.'}, 'zh': {'title': 'MemBodied：历史依赖操作的新选择', 'desc': '本文介绍了一种名为MemBodied的模型，它通过固定大小的情节记忆来改善机器人控制中的历史依赖任务。该模型包含两个互补组件：一个关联状态记录策略调用中的交互，另一个情节锚点保留初始场景的紧凑表示。通过在每次策略调用时结合当前输入和记忆组件，MemBodied显著提高了成功率，超越了无状态策略和传统递归记忆。研究结果表明，MemBodied是处理历史依赖操作的有效替代方案。'}}}, {'id': 'https://huggingface.co/papers/2609.27284', 'title': 'Hunyuan-A13B Technical Report', 'url': 'https://huggingface.co/papers/2609.27284', 'abstract': 'Abstract  We present Hunyuan-A13B, an open-source large language model based on a Mixture-of-Experts architecture. It contains 80 billion total parameters but activates only 13 billion during inference, balancing model capability, computational efficiency, and deployment cost. The model is pretrained on a rigorously filtered 20T-token corpus with enhanced STEM data curation, improving factual reliability and reasoning ability. High-quality supervised fine-tuning and large-scale reinforcement learning further enhance its overall performance. Hunyuan-A13B also introduces a dual-mode Chain-of-Thought framework that adapts reasoning depth to task complexity: fast thinking for routine queries and slow thinking for complex, multi-step problems. Evaluations show competitive performance across mathematics, science, programming, general language understanding, and agent tasks, often approaching that of much larger models. Its high inference throughput makes it suitable for latency-sensitive applications. We release Hunyuan-A13B to support open research and practical LLM deployment.', 'score': 8, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'c708bdaa734a0a82', 'authors': ['Tencent Hunyuan Team', 'Ao Liu', 'Botong Zhou', 'Can Xu', 'Chayse Zhou', 'ChenChen Zhang', 'Chengcheng Xu', 'Chenhao Wang', 'Decheng Wu', 'Dengpeng Wu', 'Dian Jiao', 'Dong Du', 'Dong Wang', 'Feng Zhang', 'Fengzong Lian', 'Guanghui Xu', 'Guanwei Zhang', 'Hai Wang', 'Haipeng Luo', 'Han Hu', 'Huilin Xu', 'Jiajia Wu', 'Jianchen Zhu', 'Jianfeng Yan', 'Jiaqi Zhu', 'Jihong Zhang', 'Jinbao Xue', 'Jun Xia', 'Junqiang Zheng', 'Kai Liu', 'Kai Zhang', 'Kai Zheng', 'Kejiao Li', 'Keyao Wang', 'Lan Jiang', 'Lixin Liu', 'Lulu Wu', 'Mengyuan Huang', 'Peijie Yu', 'Peiqi Wang', 'Qian Wang', 'Qianbiao Xiang', 'Qibin Liu', 'Qingfeng Sun', 'Richard Guo', 'Ruobing Xie', 'Saiyong Yang', 'Shaohua Chen', 'Shihui Hu', 'Shuai Li', 'Shuaipeng Li', 'Shuang Chen', 'Suncong Zheng', 'Tao Yang', 'Tian Zhang', 'Tinghao Yu', 'Weidong Han', 'Weijie Liu', 'Weijin Zhou', 'Weikang Wang', 'Wesleye Chen', 'Xiao Feng', 'Xiaoqin Ren', 'Xingwu Sun', 'Xiong Kuang', 'Xuemeng Huang', 'Xun Cao', 'Yanfeng Chen', 'Yang Du', 'Zhen Yang', 'Yangyu Tao', 'Yaping Deng', 'Yi Shen', 'Yigeng Hong', 'Yiqi Chen'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2609.27284.jpg', 'data': {'categories': ['#reasoning', '#rlhf', '#science', '#architecture', '#open_source', '#training', '#optimization', '#plp', '#agents'], 'emoji': '⚡', 'ru': {'title': 'Экономная мощь: умная смесь экспертов для быстрого и точного рассуждения', 'desc': 'Представлена открытая языковая модель Hunyuan-A13B, построенная на архитектуре Mixture-of-Experts с 80 миллиардами параметров, из которых активируются только 13 миллиардов при инференции, что обеспечивает баланс между производительностью и вычислительной эффективностью. Модель предварительно обучена на тщательно отфильтрованном корпусе из 20 триллионов токенов с усиленной курацией STEM-данных для повышения фактической надежности и способности к рассуждениям. Качественная supervised fine-tuning и масштабное reinforcement learning дополнительно улучшают общую производительность. Модель внедряет адаптивную двухрежимную систему Chain-of-Thought, которая варьирует глубину рассуждений в зависимости от сложности задачи, обеспечивая высокую пропускную способность при инференции для приложений с чувствительностью к задержкам.'}, 'en': {'title': 'Efficient Reasoning with Hunyuan-A13B: A Smart Language Model', 'desc': 'Hunyuan-A13B is an open-source large language model that uses a Mixture-of-Experts architecture, activating only a portion of its parameters during inference to optimize efficiency. It is pretrained on a vast dataset, focusing on STEM content to enhance its factual accuracy and reasoning skills. The model employs a dual-mode Chain-of-Thought framework, allowing it to adjust its reasoning approach based on the complexity of the task at hand. Evaluations demonstrate its strong performance in various domains, making it a viable option for applications requiring quick responses.'}, 'zh': {'title': 'Hunyuan-A13B：高效的开源语言模型', 'desc': 'Hunyuan-A13B是一种基于混合专家架构的开源大型语言模型，具有800亿个参数，但在推理时仅激活130亿个参数，从而平衡了模型能力、计算效率和部署成本。该模型在经过严格筛选的20万亿标记语料库上进行预训练，增强了STEM数据的质量，提高了事实可靠性和推理能力。通过高质量的监督微调和大规模强化学习，进一步提升了整体性能。Hunyuan-A13B还引入了双模式思维链框架，根据任务复杂性调整推理深度，适用于快速和复杂问题的处理。'}}}, {'id': 'https://huggingface.co/papers/2609.27490', 'title': 'WhatWorkedBench: Benchmarking Experimental Understanding in AI Agents', 'url': 'https://huggingface.co/papers/2609.27490', 'abstract': 'Abstract  AI research agents need reliable knowledge of how their experiments change outcomes. We introduce WhatWorkedBench to measure experimental understanding, the accuracy of predictions about component changes after budgeted experimentation. Agents inspect code, select measurements, and submit a response surface, a table predicting scores for every configuration of component settings. Exhaustive CPU execution supplies reference effects for changing each component while holding the others fixed. These effects capture combinations of changes across 36 tasks from 30 data sources and 8 workflow types, with 1248 configuration records. Core evaluation combines 4,206 numerical-control records across all eight families and 108 agent episodes across the original six. At eight new measurements, pair-effect ridge selects an optimum on 15 of 22 sources and limits every effect error to 10% of score range on three. Fitting a Gaussian process (GP) to the same agent observations raises effect recovery, accuracy relative to true effect magnitude, from 0.632 to 0.698 in the original Flash cohort and from 0.621 to 0.720 in an additional cohort. On six completed beat-detection and graph submissions, the same-observation GP raises family-macro recovery from 0.303 to 0.455. On six workflows with six binary options at 20 new measurements, encoding code equivalences, configurations with identical behavior, raises GP recovery from 0.248 to 0.462. WhatWorkedBench supports research on experimental agents, adaptive experimental design, numerical inference, and use of program structure.', 'score': 8, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '9a966e6e7b598455', 'authors': ['Jingjie Ning', 'Xueqi Li', 'Yibo Kong', 'Dongting Li'], 'affiliations': ['Carnegie Mellon University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.27490.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '🔬', 'ru': {'title': 'Измерение понимания экспериментов: как AI-агенты учатся предсказывать влияние изменений', 'desc': 'Статья представляет WhatWorkedBench — бенчмарк для оценки способности AI-агентов понимать влияние изменений компонентов на результаты экспериментов. Агенты анализируют код, выбирают метрики и предсказывают поверхность отклика — таблицу, показывающую результаты для всех конфигураций параметров компонентов. Исследователи использовали гауссовские процессы и методы выбора конфигураций для повышения точности восстановления истинных эффектов влияния компонентов. Результаты показывают, что учет эквивалентностей в коде и использование информации о структуре программы значительно улучшают качество предсказаний агентов.'}, 'en': {'title': 'Enhancing Experimental Understanding in AI with WhatWorkedBench', 'desc': 'This paper presents WhatWorkedBench, a tool designed to enhance the understanding of how changes in experimental setups affect outcomes in AI research. It allows agents to analyze code, choose measurements, and predict performance scores for various configurations through a response surface. The tool evaluates the effects of component changes across multiple tasks and data sources, providing a comprehensive dataset for analysis. By employing techniques like Gaussian processes, the study demonstrates improved accuracy in predicting the impact of changes, thereby supporting better experimental design and inference in machine learning.'}, 'zh': {'title': '提升实验理解的工具：WhatWorkedBench', 'desc': '本文介绍了WhatWorkedBench，这是一个用于测量实验理解的工具，帮助AI研究代理评估实验对结果的影响。代理可以检查代码、选择测量并提交响应面，预测不同组件设置的得分。通过对36个任务、30个数据源和8种工作流类型的1248个配置记录进行全面的CPU执行，获取参考效果。研究表明，使用高斯过程（GP）模型可以提高效果恢复的准确性，支持实验代理的研究和自适应实验设计。'}}}, {'id': 'https://huggingface.co/papers/2609.26637', 'title': 'Capable yet Parsimonious: Extracting and Characterizing Hidden Chain-of-Thought in Frontier Models', 'url': 'https://huggingface.co/papers/2609.26637', 'abstract': 'Abstract  The rapid capability gains of frontier language models are widely attributed to improved reasoning abilities, yet this cannot be verified as raw CoT traces in closed-source systems are hidden. By registering a simple custom tool through a standard API feature, we induce frontier models to externalize intermediate reasoning. Because these traces may reflect post-hoc rationalization rather than genuine reasoning, we first evaluate against native CoT on open-source models and extend to closed-source frontier models including GPT-6 Astra. We find that the extracted reasoning matches native reasoning performance and substantially outperforms no-reasoning baselines, across competition mathematics, science, and code generation. We then characterize how frontier models structure their intermediate reasoning. Across token efficiency, reasoning-step types, and induced reasoning trees, we identify systematic differences in how models externalize, compress, and organize reasoning. We find that Astra exhibits token-efficient directed reasoning, selecting a correct trajectory earlier, while resolving elementary steps internally and externalizing only crucial reasoning. These findings provide a behavioral lens on frontier-model reasoning beyond benchmark scores.', 'score': 6, 'issue_id': 3327, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'b8f051f603c69d95', 'authors': ['Xiaoyu Luo', 'Tao Ren', 'Wenrui Yu', 'Xiao Li', 'Qiongxiu Li', 'Johannes Bjerva'], 'affiliations': ['Department of Computer Science, Aalborg University, Copenhagen, Denmark', 'Department of Electronic Systems, Aalborg University, Copenhagen, Denmark', 'Seafill'], 'pdf_title_img': 'assets/pdf/title_img/2609.26637.jpg', 'data': {'categories': ['#interpretability', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Раскрыть скрытый ум: как фронтирные модели на самом деле рассуждают', 'desc': 'В этой работе исследователи разработали метод для извлечения скрытых процессов рассуждения из закрытых больших языковых моделей, используя пользовательский инструмент через стандартный API. Они проверили, что извлеченные цепочки рассуждений совпадают с нативным Chain-of-Thought на открытых моделях и значительно превосходят базовые варианты без рассуждений на задачах математики, науки и генерации кода. Авторы проанализировали, как фронтирные модели структурируют промежуточные шаги, выявив различия в эффективности использования токенов и организации деревьев рассуждений. Исследование показывает, что современные модели применяют избирательное экстернализированное рассуждение, скрывая простые шаги и выделяя только критически важные логические переходы.'}, 'en': {'title': 'Unlocking the Reasoning of Frontier Language Models', 'desc': 'This paper investigates the reasoning capabilities of advanced language models, particularly focusing on how they externalize their thought processes. By using a custom tool to capture intermediate reasoning steps, the authors compare these traces to traditional Chain-of-Thought (CoT) reasoning in both open-source and closed-source models. The results show that the externalized reasoning from frontier models like GPT-6 Astra matches or exceeds the performance of native reasoning and significantly outperforms models that do not utilize reasoning. Additionally, the study reveals distinct patterns in how these models structure their reasoning, highlighting differences in efficiency and organization of thought processes.'}, 'zh': {'title': '揭示前沿模型的推理能力', 'desc': '这篇论文探讨了前沿语言模型的推理能力，尤其是如何通过标准API功能来外部化中间推理过程。研究表明，提取的推理过程与原生推理性能相匹配，并在数学、科学和代码生成等任务中显著优于没有推理的基线模型。作者还分析了前沿模型如何组织和压缩推理，发现Astra模型在推理过程中表现出高效的选择能力，能够更早地选择正确的推理路径。通过这些发现，论文为理解前沿模型的推理行为提供了新的视角。'}}}, {'id': 'https://huggingface.co/papers/2609.27321', 'title': 'Verifiable Hidden Dynamics Play: Generating Agentic RL Environments from Solved Mechanisms', 'url': 'https://huggingface.co/papers/2609.27321', 'abstract': 'Abstract  Language-model agents increasingly face long-horizon tasks with evolving state, interdependent decisions, and delayed outcomes. Scaling their training requires diverse agentic environments, dependable outcome signals, and low extension cost. Existing generation pipelines commonly construct an environment before defining its outcome rule or annotating its trajectories, leaving dynamics and evaluation to be aligned post hoc. VHD-Play reverses this dependency by sampling and solving a mathematical model before a corpus-grounded setter renders its decision process as stateful tools. The executable dynamics and trajectory-scoring reference are inherited from the same solved model. The pipeline produces 3,300 diverse agentic environments at a cost of a few cents each. Training Qwen3.6-35B-A3B on three families raises its mean agentic score from 0.204 to 0.815 in a five-family diagnostic. Gains also appear on held-out instances from all three training families and eight unseen mechanism families, then extend beyond the generated substrate to external benchmarks for general function calling, travel planning, and 365-day e-commerce. On E-Commerce Bench, the trained checkpoint completes every run without bankruptcy and exceeds Qwen3.7-Max. We compare written-out problems with stateful versions that reveal or hide their parameters. The comparison shows that most of the learnable gap lies in stateful interaction rather than underlying problem solving. A frozen 35B setter realizes larger environments, and scale-matched training retains gains as mechanism size and horizon grow, indicating the potential for an evolving training substrate.', 'score': 6, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '216fe536b5d309d0', 'authors': ['Xinjie Shen', 'Wei Fan', 'Xudong Guo', 'Jianhong Tu', 'Yang Su', 'Chuqiao Kuang', 'Yinger Zhang', 'Dayiheng Liu'], 'affiliations': ['Alibaba Token Foundry, Alibaba Group', 'Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.27321.jpg', 'data': {'categories': ['#benchmark', '#synthetic', '#training', '#agents', '#transfer_learning', '#dataset'], 'emoji': '🔄', 'ru': {'title': 'Синтез агентов через решение моделей перед их воплощением', 'desc': 'В статье предлагается VHD-Play — новый подход к синтезу обучающих данных для агентов на основе языковых моделей. Вместо традиционного порядка (сначала окружение, потом оценка), авторы сначала генерируют математическую модель задачи, решают её, а затем преобразуют в интерактивное окружение с инструментами. Метод позволяет создать 3300 разнообразных сценариев обучения дешево и эффективно, значительно улучшив способность модели Qwen решать долгосрочные задачи с зависимыми решениями и отложенными результатами. Обученная модель хорошо обобщается на невидимые задачи и достигает высокой производительности в реальных приложениях вроде планирования путешествий и электронной коммерции.'}, 'en': {'title': 'Revolutionizing Training for Long-Horizon Language-Model Agents', 'desc': "This paper discusses a new approach called VHD-Play for training language-model agents on complex tasks that require long-term decision-making. It emphasizes the importance of creating diverse environments and reliable outcome signals to improve the training process. By solving a mathematical model first, the method ensures that the dynamics and evaluation are aligned from the start, rather than adjusting them later. The results show significant improvements in the agents' performance across various tasks, indicating that stateful interactions are crucial for effective learning."}, 'zh': {'title': '提升语言模型代理的动态决策能力', 'desc': '本文探讨了语言模型代理在处理长期任务时面临的挑战，包括动态状态、相互依赖的决策和延迟的结果。提出的VHD-Play方法通过在生成环境之前先采样和解决数学模型，逆转了传统生成管道的依赖关系。该方法能够以低成本生成多达3300种多样的代理环境，并显著提高了模型的代理评分。实验结果表明，训练后的模型在多种任务上表现优异，显示出其在动态交互中的学习能力。'}}}, {'id': 'https://huggingface.co/papers/2609.27901', 'title': 'All modalities are equal, but video is more equal: Closing the Cross-Attention Gap in Joint Video Generation', 'url': 'https://huggingface.co/papers/2609.27901', 'abstract': 'Abstract  Video is a rich representation of a physical event, capturing appearance, geometry, motion, and temporal evolution. Other modalities, such as 3D body motion or audio, encode narrower aspects of the same event. We find that joint multimodal diffusion transformers exhibit a corresponding asymmetry in cross-modal correspondence: companion modalities develop strong correspondences to video, but the reciprocal correspondences through which they constrain video remain substantially weaker. We express both directions as comparable correspondence distributions over video tokens and define their disagreement as the reciprocal correspondence gap. We introduce RecCAR, standing for Reciprocal Cross-modal Attention Regularization, a KL regularizer that uses the well-established video-to-modality correspondence as a fixed reference and aligns the weaker modality-to-video correspondence toward it. Across joint video-motion and video-audio generation, RecCAR improves the Human Anatomy score from 0.69 to 0.75 and reduces audio-video desynchronization from 0.804 to 0.752, while improving overall generation', 'score': 5, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '27a7368ad547f1cb', 'authors': ['Ohad Rahamim', 'Dvir Samuel', 'Idan Schwartz', 'Gal Chechik'], 'affiliations': ['Bar-Ilan University', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.27901.jpg', 'data': {'categories': ['#video', '#multimodal', '#architecture', '#audio', '#training', '#3d'], 'emoji': '🎬', 'ru': {'title': 'Балансировка кросс-модальной гармонии в мультимодальной генерации видео', 'desc': 'В работе исследуется проблема асимметрии в кросс-модальном соответствии при генерации видео с помощью диффузионных трансформеров. Авторы обнаружили, что сопутствующие модальности (движение тела, аудио) развивают сильные соответствия с видео, но обратные соответствия остаются слабыми. Предложен метод RecCAR, использующий KL-регуляризацию для выравнивания слабых модально-видео соответствий в направлении сильных видео-модальных соответствий. Экспериментальные результаты демонстрируют улучшение качества синтеза видео с движением и аудио, повышение анатомической корректности и синхронизации между модальностями.'}, 'en': {'title': 'Enhancing Cross-Modal Correspondence with RecCAR', 'desc': 'This paper explores how video, as a complex representation of events, interacts with other modalities like 3D body motion and audio. It identifies an imbalance in how well these modalities correspond to video, with video being better at relating to them than vice versa. The authors propose a method called RecCAR, which uses a regularization technique to enhance the weaker modality-to-video correspondences. By applying RecCAR, they achieve significant improvements in generating synchronized audio and motion alongside video, as evidenced by better scores in human anatomy and reduced desynchronization.'}, 'zh': {'title': '提升视频与模态之间的对应关系', 'desc': '本论文探讨了视频与其他模态（如3D身体运动和音频）之间的跨模态对应关系。研究发现，伴随模态与视频之间的对应关系较强，而反向的对应关系则相对较弱。为了解决这一问题，提出了RecCAR（互惠跨模态注意力正则化），通过KL正则化来对齐模态到视频的对应关系。实验结果表明，RecCAR在视频-运动和视频-音频生成任务中显著提高了生成质量。'}}}, {'id': 'https://huggingface.co/papers/2609.27656', 'title': 'InternW0: A Foundational Physical World Model for Efficient Real-World Interactions', 'url': 'https://huggingface.co/papers/2609.27656', 'abstract': 'Abstract  Physical intelligence requires more than predicting how the world may evolve: predictions must remain actionable as the world continues to change. We introduce InternW0, the first instantiation of the InternW physical world model series from Shanghai AI Laboratory, built around omnimodal interfaces, asynchronous multi-frequency processing, and local physical modeling under partial observations and external influences. InternW0 jointly learns future visual dynamics and continuous robot control through an asymmetric video--action architecture with flow matching. A high-capacity video expert provides longer-horizon predictive context, while a lightweight action expert operates at a faster timescale. Instead of regenerating the future for every action update, InternW0 reuses layerwise K/V and adapts it to newly observed states through observation-conditioned context routing. Domain-specific interfaces and soft prompts support heterogeneous embodiments, while contact-aware post-training incorporates force and tactile signals for contact-rich manipulation. We train InternW0 on approximately 7,200 hours of heterogeneous robot and egocentric data, including EgoLab, a 275-hour real-laboratory egocentric dataset. Evaluation spans simulation benchmarks and real-world scientific tasks, including a 15-stage metal--organic framework synthesis workflow and 5-stage contact- and force-aware dexterous manipulation for general-purpose quantitative pipetting. These results advance scalable, asynchronous, and science-native physical world models for universal and efficient real-world interactions.', 'score': 5, 'issue_id': 3325, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '12cbd52d1eb1c135', 'authors': ['Jisong Cai', 'Yao Mu', 'Ganlin Yang', 'Zhe Cao', 'Zhangzheng Tu', 'Xing Gao', 'Kailin Li', 'Xinyu Zhan', 'Lixin Yang', 'Yangkun Zhu', 'Haoxiang Ma', 'Ming Zhou', 'Qiaojun Yu', 'Yufei Xue', 'Liqun He', 'Yifei Yao', 'Yifan Zhu', 'Long Ling', 'Bingqi Jiang', 'Haoyu Guo', 'Xueyue Zhu', 'Bowen Zhou', 'Bin Zhao', 'Tianfan Xue', 'Chunhua Shen', 'Weinan Zhang'], 'affiliations': ['Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2609.27656.jpg', 'data': {'categories': ['#robotics', '#video', '#multimodal', '#training', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Универсальная физическая модель мира для эффективного контроля робота в изменяющихся условиях', 'desc': 'InternW0 — это физическая модель мира, которая предсказывает не только будущее состояние окружения, но и генерирует управляющие сигналы для робота, оставаясь эффективной при изменении условий. Модель использует асимметричную архитектуру с отдельными экспертами для видео и действий, обрабатывающими информацию с разными частотами, и переиспользует внутренние представления через маршрутизацию контекста. Система обучена на 7200 часов разнородных данных роботов и эгоцентрических видео, включая специальный датасет EgoLab, и поддерживает интеграцию тактильных и силовых сигналов для манипуляции. Модель успешно решает сложные задачи в реальном мире, включая синтез органических соединений и точную дозировку жидкостей с учётом контактных взаимодействий.'}, 'en': {'title': 'InternW0: Advancing Actionable Predictions in Dynamic Environments', 'desc': 'The paper presents InternW0, a novel physical world model designed to enhance actionable predictions in dynamic environments. It utilizes an asymmetric architecture that combines a high-capacity video expert for long-term predictions with a lightweight action expert for real-time control. By employing observation-conditioned context routing, InternW0 efficiently adapts to new information without needing to regenerate predictions from scratch. The model is trained on extensive robot and egocentric data, demonstrating its effectiveness in complex tasks like scientific workflows and dexterous manipulation.'}, 'zh': {'title': '实现可操作的物理智能模型', 'desc': '本文介绍了InternW0，这是上海人工智能实验室推出的首个物理世界模型，旨在实现可操作的预测。该模型结合了全模态接口、异步多频处理和局部物理建模，能够在部分观察和外部影响下进行学习。InternW0通过不对称的视频-动作架构共同学习未来的视觉动态和连续的机器人控制，利用高容量视频专家提供长时间的预测上下文。该模型在约7200小时的异构机器人和自我中心数据上进行训练，评估结果显示其在模拟基准和真实科学任务中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.22682', 'title': 'Self-Organizing Agent Teams Learn to Reason Together', 'url': 'https://huggingface.co/papers/2609.22682', 'abstract': "Abstract  Collective intelligence depends not only on what team members know, but also on how they organize their work. When the structure of a solution is unknown, useful roles and divisions of labor cannot be specified in advance; teams must learn from experience how to organize reasoning as it unfolds. Human teams routinely adapt this way, while existing AI agent teams rely on fixed protocols, explicit task decomposition, or routing. We introduce Self-Organizing Agent Teams (SAT), fixed teams of AI agents that learn reusable strategies from prior collaborations to organize roles, conversational phases, participation, and information flow. These strategies enable what we call collaborative computation: agents exchange, challenge, repair, and synthesize partial reasoning into solutions no member produced independently. In two independent settings, we learn teamwork strategies that transfer unchanged to unseen benchmarks, using only 15 mathematics and 25 graduate-level knowledge problems. Across five mathematics and physics benchmarks, self-organizing teams average 66.7% accuracy, versus 48.8% for their strongest member, 58.7% for compute-matched inference by that agent, and 59.0% for a perfect router over members' independent answers; on AIME 2026, they exceed this router by 13.4 points. Because gains vary across benchmarks, we ask when self-organizing collaboration helps. Across eight benchmarks, demonstrability (the organizational-psychology construct of whether a team can distinguish correct from incorrect reasoning) strongly tracks improvement over the strongest member (Spearman ρ=0.90, p=0.005): teams benefit most when correct reasoning can be recognized once it appears. More broadly, these results suggest that organization itself can become an agent capability: agent teams can learn how to reason together and produce solutions their members could not reach independently.", 'score': 4, 'issue_id': 3328, 'pub_date': '2026-09-19', 'pub_date_card': {'ru': '19 сентября', 'en': 'September 19', 'zh': '9月19日'}, 'hash': '5b74a8b210aa58d6', 'authors': ['Aneesh Pappu', 'Mirac Suzgun', 'Yongchan Kwon', 'Federico Bianchi', 'Batu El', 'Mykel J. Kochenderfer', 'Hancheng Cao', 'James Zou'], 'affiliations': ['Goizueta Business School, Emory University', 'Stanford University', 'Together AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.22682.jpg', 'data': {'categories': ['#transfer_learning', '#training', '#benchmark', '#agents', '#reasoning'], 'emoji': '🤝', 'ru': {'title': 'Организация как навык: обучение AI команд коллективному мышлению', 'desc': 'В работе предложена система Self-Organizing Agent Teams (SAT), где фиксированная команда AI агентов обучается адаптивным стратегиям организации ролей и информационного обмена на основе предыдущих взаимодействий. Агенты развивают способность проводить коллективное вычисление: они обмениваются идеями, проверяют рассуждения друг друга и синтезируют частичные р
