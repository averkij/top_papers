    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.24636', 'title': 'Clover-35B-A3B-Preview Technical Report', 'url': 'https://huggingface.co/papers/2611.24636', 'abstract': 'Abstract  We introduce Clover-35B-A3B-Preview (Clover), a mixture-of-experts diffusion language model with 35 billion total parameters and 3 billion activated parameters, supporting thinking-mode generation. Clover adapts Gated Delta Networks to block diffusion by combining recurrent memory of previously generated context with bidirectional softmax attention inside the current block. Historical memory readout competes with current-block tokens in a shared softmax, with learnable block-size calibration and a separate, zero-initialized right-context convolution branch. Clover leads the seven evaluated agent metrics, including 73.6 on SWE-bench Verified and 51.7 on Terminal-Bench 2.1. On internal agent workloads, it reaches a reported generation speed of 680 tokens/s using one NVIDIA GB300 GPU at BF16 precision and batch size one. We organize the evaluation around model quality, drafting and verification costs, and deployment under constrained memory. We also describe a decision-model variant that generates answers to related questions in one denoising pass. On an internal set of 500 groups, joint prediction raises question accuracy from 90.37% to 93.88% and all-correct group accuracy from 65.4% to 77.0%.', 'score': 17, 'issue_id': 3559, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '9cc3543047ef94db', 'authors': ['DiffuSpace Technical Team'], 'affiliations': ['DiffuSpace'], 'pdf_title_img': 'assets/pdf/title_img/2611.24636.jpg', 'data': {'categories': ['#plp', '#inference', '#optimization', '#diffusion', '#benchmark', '#agents', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Быстрая диффузионная MoE-модель с памятью, которая лидирует в агентных задачах', 'desc': 'Авторы представляют Clover-35B-A3B-Preview — языковую модель типа mixture-of-experts с диффузионной генерацией, имеющую 35 млрд параметров, из которых активны 3 млрд. Модель адаптирует Gated Delta Networks к блочной диффузии: рекуррентная память по ранее сгенерированному контексту сочетается с двунаправленным softmax attention внутри текущего блока. На агентных бенчмарках (SWE-bench Verified 73.6, Terminal-Bench 2.1 51.7) модель показывает лидерство, а скорость генерации достигает 680 токенов/с на одном GPU. Также описан вариант decision-модели, который отвечает на связанные вопросы за один проход денойзинга, повышая точность на внутреннем наборе данных.'}, 'en': {'title': 'Clover: Fast Diffusion with Memory for Stronger Agents', 'desc': 'Clover is a 35-billion-parameter mixture-of-experts diffusion language model that activates 3 billion parameters per token and supports step-by-step reasoning. It combines recurrent memory for earlier context with bidirectional attention within each block, helping it use both past and current information. Clover achieved strong results on seven agent benchmarks, including 73.6 on SWE-bench Verified, and reported generation speeds of 680 tokens per second on one NVIDIA GB300 GPU. A variant that predicts answers to related questions together improved both individual accuracy and the chance of getting every answer in a group correct.'}, 'zh': {'title': '融合历史记忆与双向注意力，让扩散模型更快、更强地完成智能体任务', 'desc': 'Clover 是一个支持思考模式的混合专家扩散语言模型，总参数量为 350 亿，生成时激活 30 亿参数。它将门控增量网络用于分块扩散，结合对历史上下文的循环记忆与对当前块的双向注意力，并通过可学习的块大小校准和右侧上下文卷积分支改进信息融合。在七项智能体评测中，Clover 均取得领先成绩，包括 SWE-bench Verified 上的 73.6 分；在单张 NVIDIA GB300 GPU、BF16 精度和批量大小为 1 时，内部智能体任务的生成速度达到每秒 680 个 token。论文还提出一种决策模型变体，可在一次去噪过程中联合回答相关问题；在内部测试中，它提升了单题准确率和整组问题全部答对的准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.15449', 'title': 'Reading the Unreadable: Text-Aware Image Super-Resolution Needs Reasoning', 'url': 'https://huggingface.co/papers/2611.15449', 'abstract': 'Abstract  Text-aware image super-resolution (TAISR) aims to recover high-resolution images from low-resolution inputs while preserving textual content. Existing methods treat this as a visual restoration problem, yet severely degraded text often cannot be read from local visual evidence alone. Humans instead read it by reasoning over image context, logical patterns, and prior knowledge. This raises a fundamental question: Does TAISR need reasoning? To answer this, we introduce two diagnostic tools. The first, ReasonText, is a human-curated benchmark that separates reasoning-required text from locally recoverable text. The second, Ground-Truth Text-Crop Accuracy (GTTCA), is a recognition-based metric that measures text restoration quality without text detection errors. Evaluating twelve recent super-resolution (SR) models, we find a consistent and substantial performance drop on reasoning-required text, revealing a systematic blind spot. Two observations point to a remedy. One is that text-conditioned SR models restore text substantially better when given ground-truth text. The other is that multimodal large language models (MLLMs) can read degraded text in low-resolution images through reasoning. We therefore propose Reasoning Transfer via Captioning (RTC), a training-free plug-in that uses an external MLLM to infer the degraded text and feeds the resulting caption to a text-conditioned SR model. RTC consistently improves all six text-conditioned SR models we evaluate, especially on reasoning-required text. Surprisingly, a real-world SR model with RTC can even outperform the TAISR model with RTC, suggesting that reasoning should be a core design axis for future TAISR.', 'score': 8, 'issue_id': 3559, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': '3dc89fc01960f78d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#transfer_learning', '#multimodal', '#dataset', '#benchmark', '#cv', '#reasoning'], 'emoji': '🔍', 'ru': {'title': 'Чтобы восстановить текст, нужно уметь его понять', 'desc': 'Статья показывает, что существующие модели text-aware image super-resolution (TAISR) плохо восстанавливают сильно искажённый текст, который нельзя прочитать только по локальным визуальным признакам. Авторы вводят бенчмарк ReasonText и метрику GTTCA для оценки качества восстановления текста без ошибок детекции. Предложенный метод RTC — это training-free плагин, который использует внешнюю MLLM (multimodal large language model) для предсказания искажённого текста и передаёт полученную подпись в text-conditioned SR модель. RTC стабильно улучшает все протестированные модели, особенно на тексте, требующем рассуждений, что делает reasoning ключевым направлением для будущих TAISR систем.'}, 'en': {'title': 'Let reasoning guide text restoration', 'desc': 'The paper studies whether text-aware image super-resolution (TAISR) needs reasoning to restore badly degraded text. It introduces ReasonText, a benchmark that distinguishes text needing reasoning from text readable from local image details, and GTTCA, a metric that evaluates restored text without errors from text detection. Tests show that current super-resolution models struggle with reasoning-required text, while text-conditioned models improve when given the correct text. The authors propose RTC, a training-free method that uses a multimodal language model to infer the text and provide it as a caption, improving the performance of all six tested text-conditioned models.'}, 'zh': {'title': '让超分辨率模型学会推理，才能读懂模糊文字', 'desc': '这篇论文研究文字感知图像超分辨率（TAISR）：从低分辨率图像恢复清晰图像，同时保留文字。作者提出 ReasonText 基准和 GTTCA 指标，发现现有超分辨率模型在需要结合上下文推理才能读出的文字上表现明显较差。为解决这一问题，他们提出无需训练的 RTC 方法，先用多模态大语言模型推断模糊文字，再将生成的文字描述提供给文字条件超分辨率模型。实验显示 RTC 能提升所有受测文字条件模型的效果，尤其改善需要推理的文字，说明推理应成为 TAISR 的核心设计方向。'}}}, {'id': 'https://huggingface.co/papers/2611.27963', 'title': 'Non-penetrating World Models', 'url': 'https://huggingface.co/papers/2611.27963', 'abstract': "Abstract A benchmark and lightweight framework leverage hidden states from frozen diffusion transformers to detect and prevent object penetration in interactive video world models, reducing physical violations and generalizing zero-shot.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We study a new problem of preventing object penetration in interactive video world models. To understand how existing models handle this, we introduce NoPeBench, a benchmark that evaluates how world models respond to physical obstacles. Our evaluation reveals that none of the open-source models can reliably prevent such failures. Surprisingly, however, these models already encode the information needed to predict such violations. We find that the hidden states of diffusion transformers (DiTs) can predict whether a candidate action will penetrate an obstacle. Building on this, we introduce NoPeWorld, a lightweight framework that detects and prevents penetration. Specifically, we train a small prediction head on top of a frozen DiT's hidden states to read out if a candidate action is safe or not. Unsafe actions are then replaced with safe ones that best preserve the original intent. Despite its simplicity, NoPeWorld substantially reduces the physical violation rate, averaged over six video world models, from 74% to 16%. Remarkably, our method shows zero-shot generalization to open-domain imagery, third-person viewpoints, and moving obstacles. We publicly release our code, the NoPeBench benchmark, and model weights. Project Page: https://nopeworld.github.io .", 'score': 5, 'issue_id': 3559, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': '8b1ed0c2ecb1c722', 'authors': ['Yuhang Dai', 'Yinwei Wu', 'Ziyue Lin', 'Han Ji', 'Xingyi Yang'], 'affiliations': ['The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2611.27963.jpg', 'data': {'categories': ['#inference', '#open_source', '#diffusion', '#benchmark', '#video', '#training', '#interpretability', '#architecture'], 'emoji': '🧱', 'ru': {'title': 'Модель уже знает, где препятствие: остается лишь научить ее не проходить сквозь стены', 'desc': 'Авторы изучают проблему предотвращения проникновения объектов сквозь препятствия в интерактивных видео world models. Для оценки они создали бенчмарк NoPeBench, на котором выяснилось, что ни одна открытая модель не справляется с такими нарушениями надежно. При этом скрытые состояния диффузионных трансформеров (DiT) уже содержат информацию, достаточную для предсказания таких нарушений. На основе этого предложен легковесный фреймворк NoPeWorld: небольшая prediction head поверх замороженного DiT определяет безопасность действия, а небезопасные действия заменяются ближайшими безопасными, сохраняя исходное намерение, что снижает долю физических нарушений с 74% до 16% и демонстрирует zero-shot обобщение.'}, 'en': {'title': 'Read the Hidden States, Stop the Penetration', 'desc': 'The paper studies how to prevent objects from passing through obstacles in interactive video world models. It introduces NoPeBench, a benchmark that tests whether models respect physical obstacles, and finds that current open-source models often fail. The authors show that frozen diffusion transformers already contain information in their hidden states that can predict whether an action will cause penetration. NoPeWorld uses a small prediction head to identify unsafe actions and replace them with safer alternatives, reducing physical violations and generalizing to new settings.'}, 'zh': {'title': '读懂模型隐藏状态，让视频世界不再穿透障碍', 'desc': '本文研究如何防止交互式视频世界模型生成物体穿透障碍物的行为，并提出评测基准 NoPeBench。评测发现，现有开源模型常出现此类物理违规，但冻结扩散 Transformer（DiT）的隐藏状态已包含预测违规所需的信息。作者提出轻量框架 NoPeWorld，在冻结的 DiT 隐藏状态上训练一个小型预测头，判断候选动作是否安全，并将不安全动作替换为尽量保留原意的安全动作。该方法将六种视频世界模型的平均物理违规率从 74% 降至 16%，且能零样本泛化到开放域图像、第三人称视角和移动障碍物。'}}}, {'id': 'https://huggingface.co/papers/2611.21485', 'title': 'Lost in the Hallway: Benchmarking Persistent Spatial Memory Across Revisits', 'url': 'https://huggingface.co/papers/2611.21485', 'abstract': 'Abstract  Persistent spatial understanding is essential for embodied agents to operate reliably in environments they repeatedly encounter. It requires recognizing revisited places despite viewpoint changes, distinguishing them from similar-looking rooms, and updating memories as environments change. Yet existing evaluations often leave physical place identity across separated visits implicit. We introduce ReSpaceBench, a benchmark comprising 3,244 questions across 590 synthetic and real-home scenes, organized into 9 tasks spanning room association, persistent state tracking, and downstream reasoning. Controlled walkthroughs define visits by physical room entry and deliberately include same-type room distractors and cross-session object changes. Our evaluation of 32 models and 3 agentic video-understanding frameworks reveals substantial limitations: the strongest evaluated zero-shot model achieves 50.5% overall accuracy and 52.2% on a 450-question subset, compared with 90.1% for human annotators. The evaluated agentic frameworks offer no overall improvement over direct inference with the same base model. Analysis of agent execution traces reveals evidence omissions and incorrect cross-visit room associations as major failure modes, suggesting that iterative evidence seeking alone does not ensure consistent spatial memory. Further analyses expose a gap between recognizing familiar rooms and identifying the correct visited room, while annotation-guided sampling highlights the importance of preserving intervening visits and transitions. We also provide RS-30K, a separate training dataset from synthetic sources with no template, scene, route, or video overlap with the benchmark. Fine-tuning Qwen3-VL-8B raises overall accuracy from 35.5% to 60.4%, with the largest gains in association and improvements extending to real-life scenes.', 'score': 5, 'issue_id': 3559, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'f5402003e356bd67', 'authors': ['Henry Zheng', 'Weibo Gong', 'Yang Yue', 'Rui Huang', 'Yang Zhang', 'Gao Huang'], 'affiliations': ['PICO, ByteDance', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.21485.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#dataset', '#benchmark', '#video', '#training', '#agents', '#interpretability', '#synthetic'], 'emoji': '🏠', 'ru': {'title': 'Помнить комнаты так же, как человек: пространственная память для embodied AI', 'desc': 'Статья представляет ReSpaceBench — бенчмарк из 3244 вопросов по 590 сценам (синтетическим и реальным домам) для проверки пространственной памяти embodied-агентов: распознавания повторно посещённых комнат, отличия от похожих комнат и отслеживания изменений объектов. Оценка 32 моделей и 3 агентных video-understanding фреймворков показала, что лучшая zero-shot LLM/VLM достигает 50,5% точности против 90,1% у людей, а агентные подходы не улучшают результат. Анализ трасс выявил пропуск доказательств и ошибочные ассоциации комнат между визитами как основные причины сбоев. Дообучение Qwen3-VL-8B на синтетическом наборе RS-30K повышает точность с 35,5% до 60,4%, при этом улучшения переносятся на реальные сцены.'}, 'en': {'title': 'Reliable Spatial Memory Starts with Linking Each Visit to the Right Room', 'desc': 'The paper introduces ReSpaceBench, a benchmark for testing whether embodied AI systems can remember physical rooms across visits, even when viewpoints change or rooms look alike. It evaluates 32 models and several video-understanding agents on tasks involving room association, tracking changes, and reasoning, and finds that the best zero-shot model reaches only 50.5% accuracy, well below human performance. Common errors include missing evidence and linking a visit to the wrong room, while agentic systems do not improve overall accuracy over direct model inference. The authors also release a separate training dataset, RS-30K, and show that fine-tuning improves accuracy from 35.5% to 60.4%, especially on room association.'}, 'zh': {'title': '让智能体记住去过的地方，并认准同一个房间', 'desc': '本文提出 ReSpaceBench，用于评估具身智能体在多次访问环境时，能否识别同一房间、区分外观相似的房间，并追踪环境变化。该基准包含 590 个合成与真实家庭场景中的 3,244 道题，覆盖房间关联、持续状态追踪和后续推理等 9 项任务。实验显示，现有模型和视频智能体在空间记忆方面仍有明显不足，常见错误包括遗漏证据和把不同访问中的房间错误关联；智能体式推理也没有优于直接使用相同基础模型。研究还提供独立训练集 RS-30K，微调后模型总体准确率从 35.5% 提升至 60.4%，其中房间关联任务进步最大。'}}}, {'id': 'https://huggingface.co/papers/2611.22343', 'title': 'PURE: A Diagnostic Benchmark for Multi-Granularity Multimodal Identity Matching', 'url': 'https://huggingface.co/papers/2611.22343', 'abstract': 'Abstract A diagnostic benchmark evaluates multimodal large language models on multi-granularity identity matching, revealing gaps in understanding, reasoning, and evidence-grounded judgment across base and variant levels.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Identity matching asks whether two records denote the same identity, yet the answer depends on the target granularity. Two records may match at the base level but not at the variant level: they share an underlying design while differing in attributes such as color or size. Final matching accuracy does not separately characterize the capabilities involved. To study this problem, we use e-commerce as a challenging real-world domain. We introduce PURE, a diagnostic benchmark for multi-granularity multimodal identity matching covering four capability dimensions: Perception, Understanding, Reasoning, and Evidence-grounded Judgment. The benchmark comprises 1,457 multiple-choice questions across 14 tasks, derived from real-world matching pairs and verified by two domain experts. Across ten recent MLLMs, overall scores range from 47.1% to 86.0%. Understanding receives the highest mean score and Judgment the lowest, with weaknesses in visual difference localization and variant-level rule judgment. Modality ablations show that models benefit from multimodal evidence but can incorrectly identify conflicts between matching records. In direct matching, most models recognize matching pairs more reliably than non-matching pairs at the base level, whereas the reverse holds at the variant level. PURE therefore reveals what aggregate matching accuracy hides: not only whether models judge a pair correctly, but where they struggle to interpret evidence and apply matching criteria.', 'score': 3, 'issue_id': 3559, 'pub_date': '2026-11-17', 'pub_date_card': {'ru': '17 ноября', 'en': 'November 17', 'zh': '11月17日'}, 'hash': 'cb7f59891bd7ef1e', 'authors': ['Hengyu You', 'Xintong Wang', 'Jin Cao', 'Liang Ding'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.22343.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#dataset', '#interpretability', '#reasoning'], 'emoji': '🔍', 'ru': {'title': 'Общая точность скрывает, где именно MLLM ошибаются при сопоставлении товаров', 'desc': 'В статье представлен PURE — диагностический бенчмарк для мультимодального сопоставления идентичностей на нескольких уровнях гранулярности (базовом и вариантном) на примере e-commerce. Бенчмарк состоит из 1457 вопросов с множественным выбором по 14 задачам и оценивает четыре измерения: восприятие, понимание, рассуждение и суждение, опирающееся на доказательства. Тестирование десяти современных MLLM показало, что модели хуже всего справляются с локализацией визуальных различий и проверкой правил на вариантном уровне, а также могут ошибочно выявлять конфликты между записями при использовании мультимодальных данных. Авторы показывают, что общая точность сопоставления скрывает слабые места моделей, поэтому нужна раздельная диагностика их возможностей.'}, 'en': {'title': 'Beyond Matching Accuracy: Find Where Multimodal Models Go Wrong', 'desc': 'The paper introduces PURE, a benchmark for testing multimodal large language models on whether two e-commerce records describe the same identity. It evaluates four capabilities: perception, understanding, reasoning, and evidence-grounded judgment, across base and variant levels. Results from ten models show that understanding is generally stronger than judgment, with particular difficulty locating visual differences and applying variant-level rules. The benchmark also finds that models can misread evidence and make different errors when matching versus non-matching pairs, showing why overall accuracy alone is insufficient.'}, 'zh': {'title': '不只看匹配对不对，更要看模型如何理解证据', 'desc': '本文提出 PURE 基准，用于评估多模态大语言模型在不同粒度下判断两条记录是否指向同一身份的能力。基准包含 14 项任务和 1,457 道经领域专家核验的选择题，覆盖感知、理解、推理和证据支撑的判断四个维度。对 10 个模型的评测显示，模型在理解方面表现最好，在判断方面最弱，尤其容易漏掉图像差异或误用变体级匹配规则。研究还发现，模型在基础级别更容易识别匹配记录、在变体级别则更容易识别不匹配记录，说明单一总体准确率难以揭示其具体能力短板。'}}}, {'id': 'https://huggingface.co/papers/2611.27229', 'title': 'Prune to Expand: Training Prompt Enhancers with Less to Imitate', 'url': 'https://huggingface.co/papers/2611.27229', 'abstract': 'Abstract Prune to Expand (P2E) refines dense-caption supervision by selectively removing redundant sentences under a per-example deletion bound, improving prompt enhancement alignment with human preferences and visual quality over conventional dense-caption supervised fine-tuning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Prompt enhancement (PE) refines concise user prompts into detailed descriptions to improve the compositional aesthetics of generated images while preserving user intent. A common practice constructs supervised fine-tuning (SFT) pairs by deriving short, user-like prompts from dense captions, implicitly assuming that captions that improve image generation also provide effective supervision. In this paper, however, we uncover a counterintuitive finding: PE models trained on caption pairs with substantial generation gains perform comparably to those trained on pairs with only marginal gains. We argue that dense captions can impose redundant supervision by requiring PE models to reproduce image-specific details weakly related to user intent. Motivated by this discrepancy, we introduce Prune to Expand (P2E), a simple text-only method that refines dense-caption supervision by selectively removing redundant sentences under a per-example deletion bound while preserving explicit user requirements and informative visual structure. Extensive experiments under identical training configurations demonstrate that P2E improves alignment with human preferences and visual quality over conventional dense-caption SFT across diverse image categories and visual generators.', 'score': 2, 'issue_id': 3559, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': 'b3d1a614287345c1', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#training', '#alignment', '#synthetic', '#data'], 'emoji': '✂️', 'ru': {'title': 'Меньше лишнего — лучше генерация: обрезай описания, чтобы расширять промпты', 'desc': 'Авторы показывают, что обучение моделей prompt enhancement на плотных описаниях (dense captions) часто содержит избыточную информацию, не связанную с намерением пользователя. Они предлагают метод Prune to Expand (P2E), который удаляет лишние предложения из описаний с ограничением на количество удалений для каждого примера. При этом P2E сохраняет явные требования пользователя и важную визуальную структуру. Эксперименты показывают, что такой подход лучше соответствует человеческим предпочтениям и повышает визуальное качество генерации изображений по сравнению с обычным SFT на dense captions.'}, 'en': {'title': 'Prune the noise, expand the prompt', 'desc': 'Prompt enhancement expands short prompts into detailed descriptions while preserving what the user wants. The paper finds that dense captions may contain redundant image-specific details that do not help models follow user intent. Its method, Prune to Expand (P2E), removes selected sentences from captions within a per-example deletion limit while keeping user requirements and useful visual structure. Across image categories and generators, P2E improves human-preference alignment and visual quality compared with conventional dense-caption supervised fine-tuning.'}, 'zh': {'title': '剪除冗余监督，让提示词扩写更贴近用户意图', 'desc': '提示词增强会把简短的用户提示扩写成更详细的描述，以提升生成图像的构图与美感，同时保留用户意图。论文发现，用能显著提升图像生成效果的描述来训练增强模型，并不比用提升较小的描述训练效果更好，说明密集描述可能包含与用户意图关系不大的冗余细节。为此，作者提出“剪除再扩写”（P2E），在每个样本的删除数量限制下，移除冗余句子，同时保留明确的用户要求和有用的视觉结构。实验表明，在相同训练设置下，P2E比传统的密集描述监督微调更符合人类偏好，也能提升生成图像的视觉质量。'}}}, {'id': 'https://huggingface.co/papers/2611.24077', 'title': 'AeroRSI: Recursive Self-Improvement for Aerial Vision-Language Navigation', 'url': 'https://huggingface.co/papers/2611.24077', 'abstract': 'Abstract  Vision-language-action (VLA) models enable unmanned aerial vehicles (UAVs) to follow natural-language instructions, yet still fail frequently in closed-loop flight. Correcting these failures requires repairs, i.e., actions that avoid them at the states the policy itself reaches, which human pilots cannot label at scale and rule-based planners cannot supply reliably. In this paper, we present AeroRSI, a recursive self-improvement framework in which an aerial navigation policy iteratively learns from its own failures. Our key insight is that a failing policy should judge its own repairs by flying on from them. Judged in this way, its sampled actions and even rule-based proposals that hurt it when imitated directly become reliable supervision. Moreover, an episode terminates at its first failure, concealing subsequent failures until the earlier ones are repaired. AeroRSI thus renews its supervision in every round, anchoring the failures of the current policy, verifying repairs by its continuation, and distilling them while keeping its behavior elsewhere. On TravelUAV, three rounds raise the success rate of a supervised 2B-parameter policy from 46.4% to 67.5% and reduce collisions by half, surpassing the previous state of the art by 10.6 points from the same initialization without extra human labels or inference cost. Code and models are available at https://github.com/starsholic/AeroRSI.', 'score': 2, 'issue_id': 3559, 'pub_date': '2026-11-18', 'pub_date_card': {'ru': '18 ноября', 'en': 'November 18', 'zh': '11月18日'}, 'hash': '8294278b828988c2', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#robotics', '#multimodal', '#optimization', '#small_models', '#training', '#agents', '#alignment'], 'emoji': '🚁', 'ru': {'title': 'Дрон учится на собственных ошибках без учителя', 'desc': 'Авторы представляют AeroRSI — фреймворк рекурсивного самосовершенствования для навигационной политики беспилотников, которая по естественно-языковым инструкциям управляет полётом. Вместо ручной разметки модель анализирует собственные ошибки в замкнутом цикле и проверяет предлагаемые исправления, продолжая полёт из этих состояний. Эпизод обрывается на первой ошибке, поэтому последующие сбои скрыты, и на каждом раунде обучение получает свежий, точно привязанный к текущей политике сигнал. За три раунда успешность 2B-модели на TravelUAV выросла с 46,4% до 67,5%, а число столкновений сократилось вдвое, без дополнительной разметки и роста затрат на инференс.'}, 'en': {'title': 'Let the policy fly on to learn which repairs work', 'desc': 'AeroRSI improves vision-language-action (VLA) policies for UAV navigation by teaching them from failures encountered during their own flights. It tests possible repairs by continuing the flight from the repair, using whether the policy succeeds afterward as a measure of repair quality. Across repeated rounds, the framework finds newly exposed failures and distills verified repairs into the policy while preserving its behavior elsewhere. On TravelUAV, three rounds increased success from 46.4% to 67.5% and halved collisions, without additional human labels or inference cost.'}, 'zh': {'title': '让无人机从每次失败中学会更好的飞行', 'desc': '视觉-语言-动作（VLA）模型能让无人机听从自然语言指令，但在闭环飞行中仍常常失败。AeroRSI让导航策略反复从自身失败中学习：它针对策略实际到达的失败状态提出修复动作，并通过从修复动作继续飞行来检验其效果。每轮训练都会重新收集当前策略的失败案例，验证并提炼有效修复，同时尽量保持策略在其他情境中的行为。TravelUAV实验中，经过三轮训练，2B参数模型的任务成功率从46.4%提升至67.5%，碰撞次数减半，且无需额外人工标注或增加推理成本。'}}}, {'id': 'https://huggingface.co/papers/2611.27193', 'title': 'cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction', 'url': 'https://huggingface.co/papers/2611.27193', 'abstract': 'Abstract Constraining residual stream mixing within the Birkhoff polytope via geometric contraction improves stability and scalability of hyper-connections in large-scale dense and mixture-of-experts model pretraining.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Manifold-constrained Hyper-Connections (mHC) extends residual connections to multiple streams and stabilizes residual propagation by constraining stream-mixing residual matrices to the Birkhoff polytope, the set of doubly stochastic matrices. In this work, we investigate how to effectively mix residual streams within the Birkhoff polytope. We reveal a mixing trade-off: when under-mixed residual matrices stay close to the vertices of the Birkhoff polytope, hyper-connections will degenerate into a set of nearly independent streams; when over-mixed residual matrices are concentrated around the uniform barycenter of the polytope, streams will become less distinguishable from each other. We theoretically validate our findings by bounding the cumulative residual mixing, stream difference and gradient difference of mixing coefficients across layers. Motivated by these findings, we propose Contraction for Manifold-Constrained Hyper-Connections (cmHC), an exact doubly stochastic method which geometrically contracts the Birkhoff polytope toward its interior. This contraction mitigates under-mixing by forcing the residual matrices to explore deeper into the polytope, with a provable stream mixing bound and no new parameterization. Moreover, we apply a moderate contraction at the shallow layers to prevent over-mixing, enabling stable gradient propagation on extremely large-scale model pretraining. Extensive experiments across dense and mixture-of-experts models at various parameter scales demonstrate the effectiveness and scalability of cmHC. We also develop fused operators for cmHC on Ascend NPUs, reducing hyper-connection execution latency by up to 44.8%.', 'score': 1, 'issue_id': 3559, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': '35d9584e24883d0b', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#training', '#architecture'], 'emoji': '🧩', 'ru': {'title': 'Сжатие многогранника Биркгофа для стабильного смешивания потоков в больших моделях', 'desc': 'Статья посвящена Manifold-constrained Hyper-Connections (mHC), где остаточные связи расширяются до нескольких потоков, а матрицы смешивания ограничиваются многогранником Биркгофа (дважды стохастическими матрицами) для стабильного распространения градиентов. Авторы показывают компромисс: при недостаточном смешивании потоки почти независимы, а при избыточном становятся неразличимыми. Для решения предлагается метод cmHC, который геометрически сжимает многогранник Биркгофа к его внутренности, обеспечивая границу смешивания потоков без новых параметров. Эксперименты на dense и MoE LLM показывают масштабируемость метода, а реализация на Ascend NPU сокращает задержку hyper-connections до 44.8%.'}, 'en': {'title': 'Balance Residual Stream Mixing for Stable, Scalable Training', 'desc': 'This paper studies how to mix multiple residual streams in hyper-connections while keeping the mixing matrices doubly stochastic, meaning their rows and columns each sum to one. It identifies a trade-off: too little mixing leaves streams nearly independent, while too much makes them too similar. The proposed cmHC method contracts the Birkhoff polytope toward its interior to improve mixing, while using moderate contraction in early layers to avoid over-mixing and support stable gradient propagation. Experiments on large dense and mixture-of-experts models show that cmHC scales effectively, and fused Ascend NPU operators reduce execution latency by up to 44.8%.'}, 'zh': {'title': '适度收缩比尔霍夫多面体，让残差流稳定协同', 'desc': '论文研究如何更好地混合超连接中的多条残差流，并指出混合程度需要适中：混合不足会让各条流几乎彼此独立，混合过度则会让它们变得难以区分。为此，作者提出 cmHC，通过将双随机残差矩阵所在的比尔霍夫多面体向内部收缩，促进残差流有效混合，同时不增加新的参数化。理论分析和实验表明，该方法能改善流之间的差异与梯度传播，在大型稠密模型和混合专家模型预训练中提升稳定性与可扩展性。作者还为昇腾 NPU 开发了融合算子，使超连接执行延迟最多降低 44.8%。'}}}, {'id': 'https://huggingface.co/papers/2611.27211', 'title': 'Explicit Style Extraction for Personalized Long-Form Text Generation', 'url': 'https://huggingface.co/papers/2611.27211', 'abstract': "Abstract A method that explicitly extracts a user's stylistic profile and uses it to guide drafting and revision improves personalized long-form text generation over retrieval-augmented baselines.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Personalized long-form generation asks a language model to write new text the way a specific user would. The standard recipe, retrieval-augmented generation, places a few of the user's past texts in the prompt but leaves the model to decide what to take from them. We introduce StylePrism, a taxonomy of 28 stylistic aspects in seven categories, and SP-Refine, an inference-time method that makes style extraction an explicit step: the model first fills StylePrism with the user's patterns, quoted evidence, and habits to avoid, then drafts from the user's samples and revises the draft twice against this profile, guided by its own style scores. On the three long-form tasks of LongLaMP with three LLMs, SP-Refine outperforms LongLaMP's retrieval-augmented baseline in 25 of 27 ROUGE and METEOR comparisons, by 10.2% on average and by up to 35.8%. Annotating users' own texts with the extracted profiles shows that StylePrism captures concrete, checkable habits, from the order of rhetorical moves to a reviewer's sign-off. Ablations show that the profile helps as revision guidance, not as a replacement for the samples: writing from the profile alone is worse in all 27 comparisons, while a single implicit-inference call is a cheaper alternative that comes close. Oracle variants that let the reviser see the reference, together with reference-free controls, show that larger refinement gains require information unavailable at inference time.", 'score': 1, 'issue_id': 3559, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': 'bf983c1fdf1fd098', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#story_generation', '#rag', '#benchmark', '#agents', '#alignment'], 'emoji': '✍️', 'ru': {'title': 'Явное извлечение стиля автора превосходит простой RAG в персонализированной генерации текста', 'desc': 'Статья предлагает метод SP-Refine для персонализированной генерации длинных текстов, который явно извлекает стилевой профиль пользователя по таксономии StylePrism из 28 стилистических аспектов. Модель сначала заполняет профиль паттернами и примерами пользователя, затем пишет черновик по его текстам и дважды ревизирует его с опорой на собственные style scores. На задачах LongLaMP этот подход превосходит retrieval-augmented generation (RAG) базовый метод по ROUGE и METEOR, в среднем на 10.2%. Абляции показывают, что профиль полезен именно как руководство для ревизии, а не как замена примерам текста.'}, 'en': {'title': 'Extract the style, then refine the draft', 'desc': "The paper presents SP-Refine, a method for generating long-form text in a particular user's writing style. It first builds a style profile using StylePrism, which describes 28 stylistic aspects and records evidence from the user's writing. The model uses this profile alongside the user's writing samples to draft text, then revises the draft twice to better match the profile. Across three tasks and three language models, it beats retrieval-augmented baselines in 25 of 27 comparisons, while experiments show that the profile works best as guidance rather than as a replacement for writing samples."}, 'zh': {'title': '先读懂风格，再写出你的样子', 'desc': '个性化长文生成希望模型能模仿特定用户的写作风格。论文提出 StylePrism，用涵盖七类、28个方面的分类体系，明确记录用户的写作习惯、文本证据和应避免的表达。方法 SP-Refine 先根据用户样本文本提取风格档案，再起草文章，并依据档案和模型给出的风格评分进行两轮修改。在 LongLaMP 的三项任务和三种大语言模型上，它在27项 ROUGE 与 METEOR 对比中的25项优于检索增强基线，平均提升10.2%；实验还表明，风格档案适合指导修改，但不能取代原始样本文本。'}}}, {'id': 'https://huggingface.co/papers/2611.25773', 'title': 'Duopra: From Full-Duplex Conversation to Full-Duplex Agency', 'url': 'https://huggingface.co/papers/2611.25773', 'abstract': 'Abstract  Full-duplex interaction models exhibit strong conversational agency, enabling natural, low-latency turn-taking, backchannels, and interruptions. However, completing tasks further requires task agency: timely tool invocation and argument revision following user corrections. Frontend-backend agents separate initiation from execution: the frontend decides whether and what to request, while the backend determines how. Execution can be offloaded, but unsent requests cannot be executed, and incomplete ones can misdirect the backend. On Full-Duplex-Bench v3 (FDB v3), most failures of Realtime-Venus-Audio + Harness in our streaming pipeline occur before a domain tool executes. We introduce Duopra, a full-duplex interaction model that learns task execution alongside conversational control. Duopra treats the backend as a tool, accepting a self-contained natural-language request. Direct calls and backend delegation share an action interface and requirements for faithful initiation and correct execution. Its three-stage training combines protocol SFT, full-duplex RL rewarding timely and complete execution, and projector-only repair of talker conditioning after thinker updates. With the same backend, Pass@1 rises from 4.7% to 44.7%; Duopra achieves 47.7% calling tools directly (26.0% after SFT) and 49.3% with a DeepSeek backend. It improves three FDB v1.0 takeover rates over the base model. These results show that task agency can coexist with key conversational agency.', 'score': 1, 'issue_id': 3559, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'e5c2b93fd2f73e4a', 'authors': ['Chiyu Chen', 'Pengzhou Cheng', 'Yuezhao Ma', 'Xiaocheng Li', 'Can Liu', 'Haonan Hu', 'Yao Yao', 'Yifei Yang', 'Yijie Lu', 'Taolei Wang', 'Yansi Li', 'Muhuan Wu', 'Chenglu Sun', 'Gongshen Liu', 'Zhuosheng Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'Shanghai University', 'Tencent', 'University of Bristol'], 'pdf_title_img': 'assets/pdf/title_img/2611.25773.jpg', 'data': {'categories': ['#agents', '#benchmark', '#audio', '#training', '#rl', '#alignment'], 'emoji': '🤝', 'ru': {'title': 'Говорить и делать одновременно: диалог и задачи в одной full-duplex модели', 'desc': "Статья представляет Duopra — full-duplex модель взаимодействия, которая учится одновременно вести диалог и выполнять задачи через вызов инструментов. Архитектура frontend-backend разделяет инициацию запроса (frontend) и его исполнение (backend), при этом backend рассматривается как инструмент, принимающий самодостаточный запрос на естественном языке. Обучение проходит в три этапа: protocol SFT, full-duplex RL с наградой за своевременное и полное выполнение, а также восстановление talker-conditioning через дообучение только projector'а после обновления thinker'а. На бенчмарке FDB v3 Pass@1 вырос с 4.7% до 44.7%, а на FDB v1.0 улучшены показатели takeover, что доказывает совместимость task agency и conversational agency."}, 'en': {'title': 'Natural Conversation, Reliable Action', 'desc': 'The paper introduces Duopra, a full-duplex model designed to handle both natural conversation and task execution. It treats a backend as a tool and learns to send it complete, accurate requests, while also supporting direct tool calls. Its three-stage training combines supervised fine-tuning, reinforcement learning for timely and complete execution, and projector repair to maintain talker conditioning. On benchmark tests, Duopra substantially improves task success while retaining conversational abilities such as turn-taking and interruptions.'}, 'zh': {'title': '让全双工对话不只会回应，也能及时办成事', 'desc': '全双工交互模型能自然地进行轮流对话、回应和打断，但完成任务还需要及时调用工具，并能根据用户纠正修改请求。Duopra 将后端也视为一种工具，让模型用完整的自然语言请求来委派任务，或直接调用领域工具。它通过三阶段训练，学习交互协议、利用全双工强化学习提升及时且完整的任务执行，并修复说话器对思考模块的条件适配。在同一后端下，Pass@1 从 4.7% 提升到 44.7%；结果表明，任务执行能力可以与自然的对话能力并存。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (5)', '#agi', '#alignment (4)', '#architecture (3)', '#audio (1)', '#benchmark (7)', '#cv (1)', '#data (1)', '#dataset (3)', '#diffusion (2)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability (3)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (5)', '#open_source (1)', '#optimization (4)', '#plp (1)', '#rag (1)', '#reasoning (2)', '#rl (1)', '#rlhf', '#robotics (1)', '#science', '#security', '#small_models (1)', '#story_generation (1)', '#survey', '#synthetic (2)', '#training (6)', '#transfer_learning (1)', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-23 04:55',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-23 04:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-23 04:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
