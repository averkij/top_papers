я достижения баланса между стабильностью и пластичностью нейронной сети.'}, 'en': {'title': 'Adaptive Learning Rates for Continual Knowledge Retention', 'desc': 'This paper addresses the problem of catastrophic forgetting in continual learning using LoRA-based methods. It critiques the common practice of using small learning rates as a heuristic to control gradient scaling, arguing that this approach lacks theoretical backing. The authors propose that the optimal learning rate should adapt based on the effective rank of accumulated knowledge, which helps balance the retention of old information and the integration of new tasks. They introduce PaLoRA, a method that employs adaptive SVD truncation and rank-aware pacing to improve performance on challenging benchmarks, showing significant accuracy gains.'}, 'zh': {'title': '自适应学习率，平衡知识保留与新任务学习', 'desc': '本文探讨了基于LoRA的持续学习方法如何通过不同机制减轻灾难性遗忘。研究发现，固定的小学习率虽然可以减缓遗忘，但无法阻止随着任务增加而加剧的遗忘现象。我们提出了一种自适应的学习率调整方法，能够根据历史知识的有效秩动态调整梯度步长的大小，以平衡稳定性和可塑性。基于这一理论，我们开发了PaLoRA方法，通过自适应SVD截断和梯度投影，显著提高了在长时间任务中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.05750', 'title': 'Beyond Semantic Similarity: Performance and Costs of Agentic Retrieval for Complex Tasks', 'url': 'https://huggingface.co/papers/2610.05750', 'abstract': 'Abstract  Modern information systems, including many agentic workflows, use dense retrieval to explore large amounts of unstructured data. However, dense retrieval relies on surface-level semantic similarity, which is insufficient for increasingly complex search applications. Here, we investigate agentic retrieval that combines the reasoning capabilities of Large Language Models (LLMs) with the efficient corpus exploration of retrievers in a ReAct agentic loop to solve complex retrieval tasks. In our experiments, we show that agentic retrieval is more effective than standard retrieval, improving nDCG@10 by 8.7 points using the same embedding model. Moreover, while specialized retrieval methods struggle on out-of-domain tasks, agentic retrieval is highly generalizable: the same pipeline achieves competitive results on both the ViDoRe v3 and BRIGHT leaderboards. However, this improvement comes at a cost. On average, agentic retrieval takes 107.4 seconds, compared to 0.67 seconds for standard retrieval, and consumes 764.1K input and 5.8K output tokens per query. In short, our study demonstrates the effectiveness of agentic retrieval in modern data systems and motivates future work on more cost-efficient retrieval agents for large-scale deployment.', 'score': 4, 'issue_id': 3379, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'a2a044472986f2f5', 'authors': ['Reza Esfandiarpoor', 'Radek Osmulski', 'Yauhen Babakhin', 'Gabriel de Souza P. Moreira', 'Oliver Holworthy', 'Jie He', 'Ronay Ak', 'Jiarui Cai', 'Ryan Chesler', 'Bo Liu', 'Even Oldridge'], 'affiliations': ['NVIDIA', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2610.05750.jpg', 'data': {'categories': ['#rag', '#agents', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Разумный поиск: LLM-агенты для глубокого анализа документов', 'desc': "Исследование показывает, что агентная система поиска, объединяющая рассуждения Large Language Models с эффективной работой retriever'ов в ReAct цикле, превосходит стандартный плотный поиск, улучшая метрику nDCG@10 на 8.7 пункта. Предложенный подход демонстрирует хорошую обобщаемость на различные задачи поиска, показывая конкурентные результаты на нескольких benchmark'ах, тогда как специализированные методы retrieval'а часто не работают на новых доменах. Основной недостаток подхода заключается в значительных затратах на вычисления: агентная система требует 107.4 секунды на запрос против 0.67 секунды для стандартного поиска и потребляет огромное количество токенов. Работа демонстрирует потенциал агентного поиска для современных информационных систем и подчёркивает необходимость разработки более эффективных решений для масштабного развёртывания."}, 'en': {'title': 'Agentic Retrieval: Smarter Search for Complex Queries', 'desc': 'This paper explores a new approach called agentic retrieval, which enhances traditional dense retrieval methods by integrating the reasoning abilities of Large Language Models (LLMs). Unlike standard retrieval that focuses on surface-level semantic similarity, agentic retrieval can tackle more complex search tasks by utilizing a ReAct agentic loop for better corpus exploration. The experiments show that agentic retrieval significantly outperforms standard methods, achieving an 8.7-point improvement in nDCG@10 while maintaining generalizability across different datasets. However, this advanced method requires more time and resources, highlighting the need for future research on making retrieval agents more efficient for large-scale applications.'}, 'zh': {'title': '代理检索：提升复杂任务的有效性', 'desc': '现代信息系统使用密集检索来探索大量非结构化数据，但这种方法仅依赖表面语义相似性，无法满足复杂搜索应用的需求。本文研究了一种代理检索方法，将大型语言模型（LLMs）的推理能力与检索器的高效数据探索结合在一起，以解决复杂的检索任务。实验结果表明，代理检索比标准检索更有效，nDCG@10提高了8.7个百分点，并且在不同领域的任务中表现出较强的泛化能力。尽管代理检索的时间和资源消耗较高，但其在现代数据系统中的有效性为未来开发更具成本效益的检索代理提供了动力。'}}}, {'id': 'https://huggingface.co/papers/2610.02320', 'title': 'DeskForge: Dense Supervision from Desktop Environments for Computer-Use Agents', 'url': 'https://huggingface.co/papers/2610.02320', 'abstract': 'Abstract  Computer-use agents need to reliably ground action targets in complex desktop scenes, where multiple applications, overlapping windows, and visually similar controls compete for attention. Existing training data rarely pair such scenes with dense annotations or vary them in a controlled way. We introduce DeskForge, a controllable desktop environment that composes and explores real applications to generate large-scale supervision for computer-use agents. It varies application states, content, window layout, appearance, and resolution, and fuses screenshots, accessibility trees, and window geometry into dense element annotations while recording the outcome of each executed action. Using this environment, we construct DeskForge-1M, a corpus of 1.2M annotated desktop observations containing 159.7M element instances. We fine-tune four vision-language models on 200K grounding examples drawn from DeskForge-1M. All four improve across held-out desktop conditions and on all five external GUI grounding benchmarks; for Qwen3.5-4B, accuracy increases by 11.51 percentage points on ScreenSpot-Pro and 10.11 points on OSWorld-G. The gains also translate to long-horizon task completion: under a fixed planner, the fine-tuned action models solve more WebArena-Infinity and OpenApps tasks, with Qwen3.5-4B increasing from 31 to 50 of 119 tasks and from 3 to 15 of 100 tasks, respectively. These results show that controllable composition of real desktop environments provides a scalable source of supervision for improving both GUI grounding and long-horizon computer use. The framework code, the dataset, and the fine-tuned model are available from the project page: https://saidgurbuz.github.io/deskforge/', 'score': 4, 'issue_id': 3378, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'ee822bd85bbd29ce', 'authors': ['A. Said Gurbuz', 'Ahmed Nassar', 'Sunghwan Hong', 'Marc Pollefeys', 'Peter W. J. Staar'], 'affiliations': ['ETH Zurich', 'IBM Research Zurich', 'Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2610.02320.jpg', 'data': {'categories': ['#cv', '#benchmark', '#multimodal', '#agents', '#training', '#dataset'], 'emoji': '🖥️', 'ru': {'title': 'Контролируемая синтетическая генерация данных для обучения агентов компьютерного взаимодействия', 'desc': 'В работе представлена система DeskForge, которая автоматически генерирует большие наборы размеченных данных для обучения агентов, взаимодействующих с компьютером через графический интерфейс. Авторы создали контролируемую среду, которая варьирует состояния приложений, содержимое окон, их расположение и разрешение, генерируя при этом плотные аннотации элементов пользовательского интерфейса. На основе этого подхода построен датасет DeskForge-1M с 1,2 миллионами размеченных наблюдений рабочего стола, содержащий 159,7 миллионов экземпляров элементов. Fine-tuning четырех видео-языковых моделей на примерах из DeskForge-1M показал значительное улучшение производительности как на специализированных бенчмарках для локализации элементов GUI, так и на задачах длительного взаимодействия с компьютером.'}, 'en': {'title': 'Empowering Agents with DeskForge: A New Era in Desktop Interaction', 'desc': 'This paper presents DeskForge, a novel environment designed to generate large-scale training data for computer-use agents in complex desktop settings. It creates diverse desktop scenes by varying application states, layouts, and visual elements, providing dense annotations for each element. The authors constructed a dataset called DeskForge-1M, which includes over 1.2 million annotated observations to improve the performance of vision-language models. The results demonstrate significant improvements in grounding accuracy and task completion for agents trained using this dataset, showcasing the effectiveness of controlled desktop environments for machine learning applications.'}, 'zh': {'title': '可控桌面环境提升计算机使用代理的性能', 'desc': '本论文介绍了DeskForge，一个可控的桌面环境，用于生成大规模的计算机使用代理的监督数据。它通过组合和探索真实应用程序，改变应用状态、内容、窗口布局和外观，生成密集的元素注释。我们构建了DeskForge-1M数据集，包含120万个注释的桌面观察，涵盖了大量元素实例。通过在DeskForge-1M上微调视觉-语言模型，所有模型在不同的桌面条件和外部GUI基准测试中均表现出显著的准确性提升。'}}}, {'id': 'https://huggingface.co/papers/2610.04047', 'title': 'Periscope: Extending Frozen Language Models Beyond Their Context Window', 'url': 'https://huggingface.co/papers/2610.04047', 'abstract': "Abstract  A language model reads long text in one quadratic forward pass, stops at the context window, and loses accuracy with length before reaching it. We ask whether the read can be factorized when deciding over a finite set: which document is relevant, which option is supported, which passage is the evidence. Periscope, a training-free inference method, arranges the N chunks of a text on a K{times}K grid with K{=}lceilNrceil and asks a frozen model the same question about K local spans of consecutive chunks and K strided spans that sample the whole text, reading the log-odds of every answer at one token. Each answer takes its best local and strided score, and scoring every chunk by its two spans gives an evidence map at no further cost, whose peak is the chunk behind the answer. Every probe is about sc tokens for a text of s tokens and chunk size c, so a window of W tokens reaches W^{2}/c tokens at s^{1.5} cost. The map replaces the long read. On LongBench v2, reading only the K chunks the map ranks highest, 9k tokens, matches the same model's best window read across windows from 32k to 1M tokens, and on InfiniteBench, where the median context is 150k tokens, it leads the best window read by 5 points. The same map ranks BRIGHT's long-document corpora with the best NDCG@10 of six methods. Each call caches only one probe, so a 27B model reads 4.5M-token contexts on one 80GB GPU, where a single pass would need 296GB of cache. A long read then needs a GPU that holds the model, not one that holds the text.", 'score': 4, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '502f4661c829d442', 'authors': ['Mohamed Eltahir', 'Anas Obayd', 'Raed Rashid', 'Abdulrahman Alghamdi', 'Abdulrahman Mousa', 'Abdallah Ahmed', 'Tanveer Hussain', 'Naeemullah Khan'], 'affiliations': ['Department of Computer Science, Edge Hill University, Ormskirk, England', 'King Abdullah University of Science and Technology (KAUST), Thuwal, Saudi Arabia'], 'pdf_title_img': 'assets/pdf/title_img/2610.04047.jpg', 'data': {'categories': ['#long_context'], 'emoji': '🔍', 'ru': {'title': 'Факторизация длинного чтения через локальную и глобальную сетку для эффективной работы с контекстом', 'desc': 'В статье предложен метод Periscope для эффективного чтения длинных текстов без переобучения модели. Вместо квадратичного прохода через весь контекст, текст разбивается на чанки и расставляется на K×K сетку, где модель проверяет одинаковый вопрос на локальных и глобальных отрезках текста. Каждый ответ получает оценку от локального и глобального диапазонов, что создает карту доказательств для поиска релевантного чанка без дополнительных затрат. Метод позволяет обрабатывать миллионы токенов на одном GPU, требуя памяти только для модели, а не для всего текста.'}, 'en': {'title': 'Efficient Long-Text Reading with Periscope', 'desc': 'This paper introduces Periscope, a novel inference method for language models that allows them to efficiently read long texts by organizing them into a grid of chunks. Instead of processing the entire text in one go, Periscope evaluates local and strided spans of these chunks to determine relevance and support for answers, creating an evidence map. This approach significantly reduces the computational cost and memory requirements, enabling models to handle much larger contexts without needing extensive caching. The results show that Periscope can match or exceed the performance of traditional long-read methods on benchmark datasets while using far less GPU memory.'}, 'zh': {'title': 'Periscope：高效处理长文本的新方法', 'desc': '这篇论文探讨了一种新的语言模型推理方法，称为Periscope。该方法通过将文本分成多个块，并在一个K×K的网格上排列这些块，来提高长文本的处理效率。Periscope在不需要额外训练的情况下，利用局部和跨步的评分来生成证据图，从而找到与问题相关的文本块。实验结果表明，这种方法在处理长文档时，能够显著减少内存需求，同时保持高准确性。'}}}, {'id': 'https://huggingface.co/papers/2605.21318', 'title': 'TextReg: Mitigating Prompt Distributional Overfitting via Regularized Text-Space Optimization', 'url': 'https://huggingface.co/papers/2605.21318', 'abstract': 'Abstract  Large language models (LLMs) are highly sensitive to the prompts used to specify task objectives and behavioral constraints. Many recent prompt optimization methods iteratively rewrite prompts using LLM-generated feedback, but the resulting prompts often become longer, accumulate narrow sample-specific rules, and generalize poorly beyond the training distribution. We study this failure mode as prompt distributional overfitting and argue that it reflects a lack of representation control in discrete text-space optimization. We formalize this view through representational inefficiency, a dual-factor measure that decomposes prompt inefficiency into capacity cost and scope narrowness, attributing distributional prompt overfitting to their coupled growth during optimization. We propose TextReg, a regularization framework that realizes a soft-penalty objective through regularized textual gradients, combining Dual-Evidence Gradient Purification, Semantic Edit Regularization, and Regularization-Guided Prompt Update. Across multiple reasoning benchmarks, TextReg substantially improves out-of-distribution (OOD) generalization, with accuracy gains of up to +11.8% over TextGrad and +16.5% over REVOLVE.', 'score': 4, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '732a2395f948f19a', 'authors': ['Lucheng Fu', 'Ye Yu', 'Yiyang Wang', 'Yiqiao Jin', 'Haibo Jin', 'B. Aditya Prakash', 'Haohan Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2605.21318.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Регуляризация текстовых градиентов для устойчивой оптимизации подсказок LLM', 'desc': 'В статье изучается проблема переобучения подсказок при оптимизации LLM, когда итеративная переписка приводит к длинным, специфичным для выборки инструкциям с плохой обобщаемостью. Авторы формализуют этот эффект через концепцию репрезентативной неэффективности, которая разлагает неэффективность подсказки на стоимость емкости и узкость охвата. Предложен метод TextReg, использующий регуляризованные текстовые градиенты с тройной техникой: очисткой градиентов, семантической регуляризацией и регуляризованным обновлением подсказок. Экспериментальные результаты показывают существенное улучшение обобщения за пределами распределения данных тренировки, с прибылью до +11.8% сравнительно с TextGrad.'}, 'en': {'title': 'Enhancing Prompt Generalization with TextReg', 'desc': 'This paper addresses the issue of prompt distributional overfitting in large language models (LLMs), where prompts become overly tailored to specific examples and fail to generalize well. The authors introduce a concept called representational inefficiency, which breaks down prompt inefficiency into two factors: capacity cost and scope narrowness. They propose a new regularization framework called TextReg, which uses a soft-penalty objective to improve the optimization of prompts. The results show that TextReg significantly enhances out-of-distribution generalization, achieving notable accuracy improvements on various reasoning tasks.'}, 'zh': {'title': '优化提示，提升泛化能力！', 'desc': '大型语言模型（LLMs）对任务目标和行为约束的提示非常敏感。许多最近的提示优化方法通过使用LLM生成的反馈迭代重写提示，但结果往往导致提示变长，积累特定样本的狭窄规则，并且在训练分布之外的泛化能力较差。我们将这种失败模式称为提示分布过拟合，并认为这反映了离散文本空间优化中缺乏表示控制。我们提出了TextReg，一个正则化框架，通过正则化文本梯度实现软惩罚目标，显著提高了在多个推理基准上的分布外泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2609.32423', 'title': 'PluginRSI: Recursive Improvement of Agent Harnesses with Reusable Plugins', 'url': 'https://huggingface.co/papers/2609.32423', 'abstract': 'Abstract  The harness surrounding a language model is a central determinant of agent performance. Recent methods optimize harnesses by searching over complete programs, where individual mechanisms are difficult to isolate and reuse. We introduce PluginRSI, which represents a harness as a composition of atomized plugins and organizes harness evolution around these plugins. Individual plugins are improved independently and accumulated in a shared library, then recombined into new harnesses at each iteration. PluginRSI improves over existing harness optimization methods across software engineering, command-line interaction, and question-answering tasks. The resulting harnesses retain their advantage when transferred to other solver models without further optimization. The evolved plugin library accelerates subsequent optimization from the initial harness, which helps faster and higher convergence on unseen tasks. These results show that accumulating reusable mechanisms provides an effective basis for continued harness improvement.', 'score': 4, 'issue_id': 3377, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '3edf8cce719459fe', 'authors': ['Yaorui Shi', 'Yuchun Miao', 'Yuxin Chen', 'Jiayuan Zhang', 'Yueqing Sun', 'Xierui Song', 'Xiang Wang', 'An Zhang'], 'affiliations': ['Meituan', 'National University of Singapore', 'University of Science and Technology of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2609.32423.jpg', 'data': {'categories': [], 'emoji': '🧩', 'ru': {'title': 'Модульная эволюция агентов через переиспользуемые плагины', 'desc': 'В статье предложен новый метод PluginRSI для оптимизации архитектуры агентов, работающих с языковыми моделями. Вместо поиска по целым программам, метод разбивает архитектуру на атомарные плагины, которые улучшаются независимо друг от друга и накапливаются в общей библиотеке. На каждой итерации эти плагины переиспользуются и комбинируются по-новому для создания более эффективных агентов. Результаты показывают, что эволюционизированные плагины не только улучшают производительность на исходных задачах, но и хорошо переносятся на другие модели без дополнительной оптимизации.'}, 'en': {'title': 'Modular Plugin Optimization for Language Models', 'desc': 'This paper presents PluginRSI, a new method for optimizing the harness of language models by using a modular approach with plugins. Instead of optimizing entire programs, PluginRSI allows for the independent improvement of small, reusable components called plugins, which can be combined in various ways. This method not only enhances performance across different tasks like software engineering and question-answering but also allows for easy transfer of improvements to other models. The study demonstrates that building a library of these plugins leads to faster optimization and better performance on new tasks.'}, 'zh': {'title': '插件化优化：提升语言模型性能的新方法', 'desc': '本文介绍了一种新的方法PluginRSI，用于优化语言模型的使用环境（harness）。该方法将使用环境表示为一组可重用的插件，并围绕这些插件进行演化。每个插件可以独立改进，并存储在共享库中，随后在每次迭代中重新组合成新的使用环境。PluginRSI在多个任务上表现优越，且其优化结果可以无缝迁移到其他模型，显著加快了后续优化的速度。'}}}, {'id': 'https://huggingface.co/papers/2610.05416', 'title': 'Prism: Dynamic Sparse Attention for Native 2K Joint Video-Audio Generation Model Training', 'url': 'https://huggingface.co/papers/2610.05416', 'abstract': 'Abstract  Natively training joint video-audio generation models at higher resolutions empowers them to learn richer visual details and sharper motion dynamics. However, full attention incurs quadratic cost and, as resolution increases, spreads attention over increasingly redundant tokens, diluting learning signals for informative content and disrupting pretrained priors. Existing sparse attention methods either target training-free acceleration or overlook the unique structure of joint video-audio data, where cross-modal interactions are inherently concentrated around sound-producing regions. To address this, we propose Prism, a dynamic sparse attention framework for natively training joint video-audio generation models at 2K. In particular, Prism organizes the token sequence into spatiotemporal macro-zones, enabling the attention structure to adapt to local content. For each zone, it estimates local information structure via video feature variance along the channel and feature norms from the audio-to-video cross-attention, jointly capturing how visual content varies directionally and how strongly audio influences each visual region. Based on these signals, Prism dynamically assigns a tailored block shape to each zone, applying finer partitioning along axes of rapid visual content variation and strong audio-visual coupling. This encourages tokens within each block to remain semantically coherent, allowing block-level features to capture both visual content and joint video-audio interaction patterns. Prism further adopts a hybrid block selection strategy to dynamically determine per-query sparsity. Experiments show that Prism achieves 2.5times training speedup compared to full attention, while surpassing it in generation quality.', 'score': 4, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'bc2ee33644b809a4', 'authors': ['Shuyuan Tu', 'Qi Tian', 'Yinming Huang', 'Yue Wu', 'Xintong Han', 'Kaihang Pan', 'Weijie Kong', 'Jiangfeng Xiong', 'Jian-Wei Zhang', 'Zuxuan Wu', 'Yu-Gang Jiang'], 'affiliations': ['Fudan University', 'Tencent Hunyuan Foundation Model Team', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05416.jpg', 'data': {'categories': ['#architecture', '#optimization', '#video', '#training', '#audio', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Динамическое разреженное внимание для эффективного обучения видео-аудио генераторов', 'desc': 'В статье предложен Prism — фреймворк динамической разреженной внимания для обучения совместных моделей видео-аудио генерации в высоком разрешении (2K). Авторы заметили, что полное внимание требует квадратичных вычислений и становится неэффективным при растущем разрешении, так как распределяет внимание на избыточные токены. Прием основан на организации последовательности токенов в пространственно-временные макро-зоны и адаптивном назначении структуры блоков внимания на основе анализа локальной информационной структуры видео и кросс-модальных взаимодействий аудио-видео. Экспериментально показано, что метод достигает 2,5-кратного ускорения обучения при улучшении качества генерации.'}, 'en': {'title': 'Prism: Efficient Attention for Rich Video-Audio Generation', 'desc': 'This paper introduces Prism, a dynamic sparse attention framework designed for training joint video-audio generation models at high resolutions. It addresses the inefficiencies of full attention mechanisms, which become costly and less effective as resolution increases. By organizing the token sequence into spatiotemporal macro-zones, Prism adapts the attention structure to focus on relevant content, enhancing the learning of visual and audio interactions. The framework achieves a significant training speedup while improving the quality of generated outputs compared to traditional methods.'}, 'zh': {'title': 'Prism：高效的视频-音频生成模型训练', 'desc': '本论文提出了一种名为Prism的动态稀疏注意力框架，旨在以更高的分辨率训练视频-音频生成模型。Prism通过将令牌序列组织成时空宏区域，使注意力结构能够适应局部内容，从而提高学习效率。该方法利用视频特征方差和音频-视频交叉注意力的特征范数，动态分配每个区域的块形状，确保语义一致性。实验表明，Prism在训练速度上比全注意力快2.5倍，同时在生成质量上也有所提升。'}}}, {'id': 'https://huggingface.co/papers/2610.05739', 'title': 'HLA-WM: Hybrid Linear Attention for Long-Horizon Video World Models', 'url': 'https://huggingface.co/papers/2610.05739', 'abstract': 'Abstract  Long-horizon video world models require persistent memory to preserve scene consistency over extended rollouts. Softmax attention retains the full generation history through a growing KV cache, whereas recurrent linear attention compresses history into fixed-size states with substantially lower memory cost. However, we identify severe long-range forgetting in Gated DeltaNet (GDN), where information from distant but relevant scenes is progressively attenuated by subsequent state updates. To address this limitation, we propose HLA-WM, a training-free hybrid linear-attention framework that combines coarse-grained geometry-guided retrieval with fine-grained recurrent linear-state computation. HLA-WM exploits the affine structure of GDN to cache compact chunk-wise transition summaries, retrieve scene-relevant historical chunks using camera geometry, and recompose them into query-specific recurrent states. On the 60-second SANA-WM-Bench, HLA-WM improves all six aggregate revisit-consistency and camera-control metrics of the base autoregressive generator without additional training, including a 0.74 dB PSNR gain and a 28.5% reduction in rotation error. The improvements persist after downstream refinement and generalize to MBench-A, where HLA-WM consistently improves all three revisit-consistency metrics across all four subsets and all evaluated inference modes over 547 samples. At a 60-second context, HLA-WM reduces historical-state memory by 12times relative to full KV caching while incurring at most a 1.6% reduction in inference throughput. These results demonstrate that selectively addressable recurrent memory can improve long-range scene recall while preserving the efficiency advantages of GDN. Project page: https://caesarhhh.github.io/hla-wm/', 'score': 3, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'ea0acc2c0b103f41', 'authors': ['Zhuokun Chen', 'Feng Chen', 'Xi Lin', 'Xiyu Wu', 'Jiahao He', 'Jianfei Cai', 'Bohan Zhuang'], 'affiliations': ['Monash University', 'The University of Adelaide', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05739.jpg', 'data': {'categories': ['#inference', '#architecture', '#video'], 'emoji': '🎬', 'ru': {'title': 'Гибридное линейное внимание для долгосрочной памяти в видео-моделях мира', 'desc': 'В работе предложен HLA-WM — гибридный фреймворк линейного внимания для видео-генерирующих моделей мира, который решает проблему забывания информации из далёких сцен в рекуррентных архитектурах. Вместо полного сохранения истории как в softmax-внимании или полного сжатия как в линейном внимании, метод комбинирует геометрически-направляемый поиск исторических блоков с рекуррентной обработкой состояния. На эталонном наборе данных из 60-секундных видео HLA-WM достигает улучшения на 0.74 дБ по метрике PSNR и снижает ошибку ориентации на 28.5% без переобучения. Подход сокращает требования к памяти в 12 раз по сравнению с полным кешированием KV-векторов, сохраняя эффективность линейного внимания.'}, 'en': {'title': 'Enhancing Long-Horizon Video Models with Efficient Memory Recall', 'desc': 'This paper introduces HLA-WM, a new framework designed to enhance long-horizon video world models by improving memory efficiency and scene recall. It combines coarse-grained geometry-guided retrieval with fine-grained recurrent linear-state computation to address the issue of long-range forgetting in existing models like Gated DeltaNet. HLA-WM significantly reduces memory usage while maintaining high performance metrics, such as PSNR and rotation error, without requiring additional training. The results show that this approach effectively retains relevant historical information, leading to better scene consistency in video generation tasks.'}, 'zh': {'title': '提升长时记忆，优化视频生成', 'desc': '本论文提出了一种新的混合线性注意力框架HLA-WM，旨在解决长时间视频世界模型中的信息遗忘问题。HLA-WM结合了粗粒度的几何引导检索和细粒度的递归线性状态计算，能够有效缓存和重组历史场景信息。通过在60秒的SANA-WM-Bench上进行测试，HLA-WM在多个指标上显著提高了模型的重访一致性和相机控制性能。该方法在不增加训练的情况下，减少了历史状态内存的使用，同时保持了高效的推理速度。'}}}, {'id': 'https://huggingface.co/papers/2610.05879', 'title': 'Learning to Learn a Language', 'url': 'https://huggingface.co/papers/2610.05879', 'abstract': 'Abstract  We present the Prior-Fitted Language Model (PFLM), a 300M-parameter byte-level transformer pretrained only on samples from a synthetic non-linguistic prior. Given a prefix of real text, it learns to predict the language in context with frozen weights, having never seen a word of any real language. Every training sequence is generated by a recurrent structural causal model drawn fresh from a distribution over such models. The model never sees the same language twice during training, so the only way to predict the continuation is to infer the language from the prefix. Samples from this prior share the statistical signatures of natural text: Zipfian frequencies, slow entropy-rate convergence, and long-range dependence. On Wikipedia in six languages, bits per byte fall from the uniform eight to between 0.9 and 2.4 at one million bytes of context. Given numerals instead of text, PFLM learns to count, to compare magnitudes, and to add approximately. It predicts deterministic sequences like Rudin-Shapiro or the prime indicator, and it compresses six non-text domains, from source code to speech, below gzip and PPMd. The model has not learned a language. It has learned to learn one.', 'score': 3, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'a3de0c01281a92e6', 'authors': ['Lennart Carstens-Behrens', 'Holger Fröhlich'], 'affiliations': ['Fraunhofer Institute for Algorithms and Scientific Computing SCAI', 'University Hospital Bonn'], 'pdf_title_img': 'assets/pdf/title_img/2610.05879.jpg', 'data': {'categories': ['#long_context', '#synthetic', '#architecture', '#training', '#small_models', '#multilingual'], 'emoji': '🧠', 'ru': {'title': 'Модель, которая научилась учиться без примеров', 'desc': 'Авторы представляют Prior-Fitted Language Model (PFLM) — трансформер объёмом 300 миллионов параметров, обученный исключительно на синтетических данных из искусственного приора, никогда не видевший реальный язык. Модель обучается предсказывать продолжение текста, инферируя язык из контекста на основе статистических закономерностей, таких как распределение Ципфа и долгосрочные зависимости. Несмотря на отсутствие контакта с настоящими языками, PFLM достигает компрессии от 0,9 до 2,4 бит на байт на Википедии в шести языках. Модель демонстрирует способность к обобщению, обучаясь считать, сравнивать величины и сжимать различные области данных — от исходного кода до речи.'}, 'en': {'title': 'Learning to Learn: The Power of Prior-Fitted Language Models', 'desc': "The Prior-Fitted Language Model (PFLM) is a 300M-parameter transformer that is pretrained on synthetic data rather than real language. It predicts language context based on a prefix of real text while keeping its weights unchanged, meaning it doesn't adjust its parameters during this phase. The training sequences are generated from a unique structural causal model, ensuring that the model encounters a diverse range of languages without repetition. PFLM demonstrates the ability to infer language patterns and perform tasks like counting and comparing, showcasing its potential in various non-text domains."}, 'zh': {'title': '学习语言的能力，而非语言本身', 'desc': '本文介绍了一种名为优先拟合语言模型（PFLM）的新模型，它是一个300M参数的字节级变换器，仅在合成的非语言先验样本上进行预训练。该模型在给定真实文本前缀的情况下，学习在上下文中预测语言，且在训练过程中从未见过任何真实语言的单词。每个训练序列都是通过从结构因果模型的分布中新生成的，模型在训练中从未见过相同的语言，因此只能通过前缀推断语言。PFLM在处理数字时能够学习计数、比较大小和近似加法，并在多个非文本领域中实现了优于传统压缩算法的效果。'}}}, {'id': 'https://huggingface.co/papers/2610.05033', 'title': 'Code2Games: Enabling Coding Agents for Gaming World Generation', 'url': 'https://huggingface.co/papers/2610.05033', 'abstract': 'Abstract  Generating a high-quality gaming world from a natural-language game intent requires joint reasoning about scene structure, spatial layout, gameplay objectives, interactive entities, and executable gameplay logic. Existing coding agents can generate individual assets, scenes, or scripts, but often struggle to maintain consistency across these components. We propose Code2Games, an agentic framework that builds a structured gaming world upon a base Blender world generated from the same game intent. Code2Games coordinates scene analysis, gameplay planning, constrained gaming-world generation, and gaming-engine customization through a shared scene-gameplay representation with persistent element correspondence. After world generation, Code2Games adapts the generated world to Unreal Engine 5 and employs an execution-guided reconstruction process that uses compilation diagnostics, runtime feedback, and gameplay test results to resolve inconsistencies arising during engine adaptation. To systematically evaluate gaming-world generation, we introduce the GameCode4D benchmark, which comprises ten fixed game prompts spanning different levels of scene and gameplay complexity. We evaluate the generated results across four dimensions: visual quality, interactive fidelity, multimodal artifact quality, and playable-game quality. Experiments demonstrate that, compared with direct gaming-world generation by coding agents and existing baseline methods, Code2Games consistently improves the visual quality and interactive fidelity of generated gaming worlds, as well as the quality of the resulting games after engine adaptation.', 'score': 3, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'aac30226f66931dd', 'authors': ['Wei Wu', 'Ziyang Xu', 'Zeyu Zhang', 'Yang Zhao', 'Hao Tang'], 'affiliations': ['La Trobe University', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05033.jpg', 'data': {'categories': ['#agents', '#benchmark', '#games', '#reasoning', '#multimodal'], 'emoji': '🎮', 'ru': {'title': 'Генерация полносценарных игровых миров из текста с помощью агентной системы и обратной связи от исполнения', 'desc': 'В работе представляется Code2Games — агентная система для генерации полнофункциональных игровых миров на основе естественного языка описания. Система координирует анализ сцены, планирование игровой механики и генерацию игрового мира с помощью единого представления сцены и игровых объектов, обеспечивая согласованность всех компонентов. После создания мира система адаптирует результат к Unreal Engine 5 и применяет процесс реконструкции, управляемый обратной связью от компиляции, выполнения и тестирования геймплея. Авторы вводят бенчмарк GameCode4D и демонстрируют, что их подход превосходит существующие методы по качеству визуализации, интерактивности и общей качеству сгенерированной игры.'}, 'en': {'title': 'Code2Games: Consistent Game World Generation from Intent', 'desc': 'This paper presents Code2Games, a framework designed to generate high-quality gaming worlds from natural language game intents. It addresses the challenge of maintaining consistency across various components like scene structure and gameplay logic, which existing coding agents often struggle with. Code2Games utilizes a shared representation to coordinate scene analysis and gameplay planning, ensuring that all elements correspond correctly throughout the generation process. The framework is evaluated using the GameCode4D benchmark, showing significant improvements in visual quality and interactive fidelity compared to traditional methods.'}, 'zh': {'title': 'Code2Games：高质量游戏世界生成的新方法', 'desc': '本论文提出了一种名为Code2Games的框架，用于从自然语言游戏意图生成高质量的游戏世界。该框架通过共享的场景-游戏表示，协调场景分析、游戏规划和游戏世界生成，确保各个组件之间的一致性。Code2Games在生成的世界中适配Unreal Engine 5，并通过执行引导的重建过程解决适配过程中出现的不一致问题。我们还引入了GameCode4D基准测试，以系统评估生成的游戏世界在视觉质量、互动真实性等方面的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.02076', 'title': 'LLM-as-Jev: LLMs Are Already Jev-Style Decision Models -- When and How to Fine-Tune Them', 'url': 'https://huggingface.co/papers/2610.02076', 'abstract': 'Abstract  Jev-style decision models return categorical probability distributions over predefined options without generating free-form text, enabling software systems to act on their outputs directly. In this work, we investigate the extent to which general-purpose LLMs already possess this capability out of the box, and when fine-tuning is actually necessary. We present LLM-as-Jev, an architecture-preserving framework that extracts calibrated decisions directly from next-token probabilities over bracketed numeric identifiers. LLM-as-Jev provides both a training-free inference recipe and a fine-tuning objective that optimizes candidate selection via a tree-factorized listwise loss while anchoring auxiliary predictions to the base model using KL divergence penalties. Evaluating on Qwen3.5-4B and Qwen3-0.6B, we find that modern LLMs are inherently effective decision models: without training, the 4B model matches community Jev-style models built on the same backbone, outperforms letter-logit readouts, supports arbitrary option counts, and natively handles multimodal decisions over images. Fine-tuning provides targeted rather than universal benefits -- substantially improving weaker models and specific tasks (such as many-option intent routing), but offering diminishing returns for strong backbones. Crucially, our KL anchors prevent behavioral degradation in conversational text generation, with LoRA delivering the strongest performance on capable models.', 'score': 2, 'issue_id': 3379, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '15fcbe0737bd19ce', 'authors': ['Yinheng Li', 'Justin Wagle'], 'affiliations': ['Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2610.02076.jpg', 'data': {'categories': ['#multimodal', '#small_models', '#training', '#inference'], 'emoji': '🎯', 'ru': {'title': 'Языковые модели как встроенные системы классификации', 'desc': 'В работе исследуется способность больших языковых моделей выполнять функции классификаторов, возвращающих вероятностные распределения над предопределёнными категориями без генерации свободного текста. Авторы предлагают LLM-as-Jev — архитектурный подход, который извлекает калибровочные решения прямо из вероятностей следующего токена для числовых идентификаторов в скобках. Фреймворк включает два режима: инференс без обучения и дообучение с использованием tree-factorized listwise loss и KL дивергенции для стабилизации. Результаты показывают, что современные LLM уже хорошо справляются с задачами классификации из коробки, но дообучение даёт значимый прирост только для более слабых моделей и специфичных задач.'}, 'en': {'title': 'Unlocking Decision-Making Power in LLMs', 'desc': 'This paper explores how large language models (LLMs) can be used as decision-making tools that provide categorical probability distributions for predefined options. The authors introduce LLM-as-Jev, a framework that allows these models to make calibrated decisions based on their next-token probabilities without requiring additional training. They demonstrate that modern LLMs, like Qwen3.5-4B, can effectively function as decision models out of the box, matching the performance of specialized Jev-style models. Fine-tuning can enhance performance for specific tasks but is less beneficial for already strong models, while maintaining conversational quality through KL divergence penalties.'}, 'zh': {'title': '大型语言模型的决策能力探索', 'desc': '本研究探讨了通用大型语言模型（LLM）在决策模型中的应用，特别是如何从下一个标记的概率中提取经过校准的决策。我们提出了LLM-as-Jev框架，该框架允许在不进行训练的情况下进行推理，并通过树分解的列表损失优化候选选择。实验表明，现代LLM在决策模型方面表现出色，能够处理多种选项和多模态决策。微调虽然对较弱模型和特定任务有显著提升，但对强大模型的收益逐渐递减。'}}}, {'id': 'https://huggingface.co/papers/2610.05898', 'title': 'Collaborative Personalized Preference Alignment for LLMs under Data Deficiency', 'url': 'https://huggingface.co/papers/2610.05898', 'abstract': 'Abstract  Real-world users often exhibit highly heterogeneous preferences over multiple objectives for LLM responses. A lightweight aligner can tailor these responses to individual preferences, but scarce user-specific feedback makes personalized training difficult. Learning shared initializations across users can support few-shot adaptation. However, heterogeneous preferences and competing objectives cause gradient conflicts across users and within each user, hindering effective initialization learning. This raises a central question: how can we collaboratively learn aligner initializations that support few-shot adaptation to diverse user preferences? To answer this question, we propose Approximate Pareto Optimality (APO). We first group users whose updates are compatible, so that their information can be combined with less interference. Within each group, we combine gradient descent with controlled ascent to coordinate competing objectives and move towards preference-specific points on the Pareto front. This produces an initialization that is close to the optima of the users in the group. We then iteratively refine it using updates from few-shot local adaptation, making it more effective for personalization. Furthermore, we establish conditional suboptimality bounds for a one-local-step collaborative update and characterize how initialization error affects subsequent stochastic adaptation. Experiments on Fed-ChatbotPA and UltraFeedback show consistent improvements over existing methods using only 20 local examples.', 'score': 2, 'issue_id': 3379, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3d75f0dbeba58bc0', 'authors': ['Liyan Yang', 'Yige Yuan', 'Zhiqin Yang'], 'affiliations': ['City University of Hong Kong', 'The Hong Kong University of Science and Technology', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.05898.jpg', 'data': {'categories': ['#optimization', '#alignment'], 'emoji': '⚖️', 'ru': {'title': 'Коллаборативное обучение персонализированных выравниваний LLM через оптимальность Парето', 'desc': 'Статья решает проблему персонализации LLM под разнообразные предпочтения пользователей с использованием минимального объёма обратной связи. Авторы предлагают метод Approximate Pareto Optimality (APO), который группирует пользователей с совместимыми градиентами и обучает общую инициализацию параметров алайнера, которая эффективно работает для всех групп. Метод комбинирует градиентный спуск с контролируемым подъёмом для балансировки конфликтующих целей и движения к парето-оптимальным решениям. Экспериментальные результаты показывают улучшение над базовыми методами при использовании всего 20 примеров для адаптации на каждом пользователе.'}, 'en': {'title': 'Collaborative Learning for Personalized LLM Responses', 'desc': 'This paper addresses the challenge of personalizing responses from large language models (LLMs) to meet diverse user preferences. It introduces a method called Approximate Pareto Optimality (APO) that groups users with similar preferences to minimize conflicts during training. By combining gradient descent with controlled ascent, the method effectively navigates competing objectives to find optimal initializations for each user group. The approach is validated through experiments, demonstrating significant improvements in personalization with minimal user-specific data.'}, 'zh': {'title': '个性化调整的协作学习新方法', 'desc': '本论文探讨了如何为大型语言模型（LLM）响应用户的多样化偏好进行个性化调整。由于用户反馈稀缺，个性化训练变得困难，因此我们提出了一种近似帕累托最优性（APO）的方法。该方法通过将用户分组，协调竞争目标，结合梯度下降和受控上升，来学习有效的初始化。实验结果表明，在仅使用20个本地示例的情况下，我们的方法在Fed-ChatbotPA和UltraFeedback数据集上表现出一致的改进。'}}}, {'id': 'https://huggingface.co/papers/2610.03252', 'title': 'COSMI: COmpositional Synthesis of Multi-object Interactions', 'url': 'https://huggingface.co/papers/2610.03252', 'abstract': 'Abstract  Generative models of human-object interaction are bounded by the data that exists: everyday activities involve several objects, but most captured datasets record one at a time, as multi-object capture is combinatorially expensive. Our observation is that interactions are local, so single-object captures already contain the parts of multi-object activities. We compose them: contact-consistent clips of single interactions, mirrored to balance the hands, transfer between bodies, and a language model and geometric checks admit only the pairings that are plausible, semantically and physically. Therefore, the dataset grows combinatorially with the clips rather than recording time. The COSMI dataset holds 222k sequences and 275 hours with up to five objects, nearly thirty times the largest multi-object capture, and can be extended by adding datasets or even hand-object recordings. On this data we train the COSMI method, a text-to-interaction diffusion transformer that follows how the data is built: weight-shared object slots generate a variable number of objects, predicted relative to the body parts that move them. On a benchmark with an unseen object and unseen interaction combinations, models trained on the dataset generalize to the unseen combinations. COSMI outperforms baselines in text alignment and contact accuracy, where its margin is largest on the unseen object. Code, models, and the dataset pipeline will be released on the project page: https://ptrvilya.github.io/cosmi.', 'score': 2, 'issue_id': 3379, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'a3b9e8cbb725a3d5', 'authors': ['Daniel Eskandar', 'Ilya A. Petrov', 'Gerard Pons-Moll'], 'affiliations': ['Max Planck Institute for Informatics, Saarland Informatics Campus, Germany', 'Tubingen AI Center, Germany', 'University of Tubingen, Germany', 'Zuse School ELIZA, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2610.03252.jpg', 'data': {'categories': ['#open_source', '#dataset', '#synthetic', '#multimodal', '#diffusion', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'Композиция взаимодействий: от одиночных объектов к многообъектным сценам', 'desc': 'В работе предложен новый подход к синтезу видео взаимодействия человека с несколькими объектами путём композиции клипов взаимодействия с одиночными объектами. Авторы используют проверки контактов, зеркальное отражение и языковую модель для отбора физически и семантически корректных комбинаций. На основе этого метода создан датасет COSMI с 222k последовательностями и 275 часами видео, содержащий взаимодействия с до пяти объектами одновременно, что в 30 раз больше существующих наборов данных. Для генерации видео обучена diffusion трансформер архитектура, которая предсказывает движения переменного числа объектов относительно движущихся частей тела и превосходит базовые методы по точности выравнивания с текстом и точности контактов.'}, 'en': {'title': 'Unlocking Multi-Object Interactions with COSMI Dataset', 'desc': 'This paper presents a novel approach to generating human-object interactions using a new dataset called COSMI, which contains a large number of sequences involving multiple objects. The authors leverage single-object captures to create composite interactions, ensuring that the generated clips are both semantically and physically plausible. They introduce a text-to-interaction diffusion transformer that can predict interactions based on the movement of body parts, allowing for flexible generation of various object combinations. The results show that models trained on COSMI outperform existing methods, especially in scenarios involving unseen objects and interactions.'}, 'zh': {'title': 'COSMI：多物体交互的生成模型', 'desc': '本论文提出了一种生成模型，用于人类与物体的交互。由于现有数据集通常只记录单个物体的交互，作者通过组合单物体的交互片段来创建一个更丰富的数据集。COSMI数据集包含22.2万条序列和275小时的多物体交互数据，显著超过了现有的多物体捕捉数据集。通过训练COSMI方法，模型能够在未见过的物体和交互组合上进行有效的泛化，且在文本对齐和接触准确性方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2610.03978', 'title': 'Learning Latent Protein Languages for Autoregressive Generation', 'url': 'https://huggingface.co/papers/2610.03978', 'abstract': "Abstract  Autoregressive transformers remain comparatively weak for protein sequence and structure generation. We study the role of target representation: amino acid tokens encode residue identities without explicit contextual semantics, while backbone coordinates require a discrete representation in our framework. We introduce two learned latent protein languages. Protein Latent Language (PLL) maps sequences to a 4,096-state contextual alphabet built on a frozen ESM-2 encoder, with one token per residue. Structure Latent Language (SLL) adapts GCP-VQVAE Lite with auxiliary sequence and confidence supervision while retaining decoding to backbone coordinates. We separately pretrain autoregressive transformer models on PLL and SLL tokens using next-token prediction, yielding PLLM and SLLM. Under matched downstream sequence training, PLLM has a fitted compute-scaling exponent of 0.038 versus 0.020 for the amino acid autoregressive model. In unconditional sequence generation, PLLM reduces the fraction of samples below a heuristic 1.5-bit residue-composition entropy threshold by 54% relative to the amino acid model across sampling temperatures. For sequence-to-structure prediction, replacing the original GCP-VQVAE Lite tokenizer with SLL reduces best validation perplexity by 34% under matched training. For long proteins, latent-token sampling is approximately 1,000 times faster than MSA-based AlphaFold2 in our measurements. In backbone generation, SLLM compares favorably with other generative models on diversity and novelty. We also observe early signs that using SLLM's internal token confidence for inference-time sampling can improve sequence-to-structure prediction quality beyond a single decoded sample. These results position learned latent protein languages as a promising substrate for autoregressive transformer scaling and inference-time sampling in protein generation.", 'score': 2, 'issue_id': 3379, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'f55d53bc093a2708', 'authors': ['Mahdi Pourmirzaei', 'Farzaneh Esmaili', 'Amir Ziashahabi', 'Mohammadreza Pourmirzaei', 'Dong Xu'], 'affiliations': ['University of Missouri', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2610.03978.jpg', 'data': {'categories': ['#optimization', '#science'], 'emoji': '🧬', 'ru': {'title': 'Скрытые языки белков для эффективной генерации последовательностей и структур', 'desc': 'В работе предложены два выученных скрытых языка для белков: Protein Latent Language (PLL) кодирует последовательности в 4096-символный контекстный алфавит на основе замороженного энкодера ESM-2, а Structure Latent Language (SLL) использует дискретизацию структуры через модифицированный VQVAE. Авторегрессивные трансформеры (PLLM и SLLM), предобученные на этих токенах методом предсказания следующего токена, значительно превосходят базовые модели на аминокислотных токенах. PLLM улучшает показатели масштабирования вычислений и качество безусловной генерации последовательностей, а SLLM повышает качество предсказания структуры и ускоряет инференс в 1000 раз по сравнению с AlphaFold2. Полученные результаты демонстрируют, что выученные скрытые языки белков являются перспективным фундаментом для масштабирования трансформеров и генерации белковых структур.'}, 'en': {'title': 'Revolutionizing Protein Generation with Latent Languages', 'desc': 'This paper explores the limitations of autoregressive transformers in generating protein sequences and structures. It introduces two new learned latent protein languages: Protein Latent Language (PLL) and Structure Latent Language (SLL), which enhance the representation of protein data. PLL uses a contextual alphabet for amino acid sequences, while SLL focuses on backbone coordinates, improving the efficiency and accuracy of protein generation. The results show that these new models outperform traditional methods in both sequence generation and structure prediction, indicating their potential for advancing protein modeling in machine learning.'}, 'zh': {'title': '学习潜在蛋白质语言，提升生成效果', 'desc': '本文研究了自回归变换器在蛋白质序列和结构生成中的不足，提出了两种学习的潜在蛋白质语言。蛋白质潜在语言（PLL）和结构潜在语言（SLL）分别通过不同的编码方式来表示蛋白质序列和结构。研究表明，PLL在无条件序列生成中显著提高了样本质量，而SLL在序列到结构预测中也表现出更好的效果。通过这些方法，作者展示了学习的潜在蛋白质语言在蛋白质生成中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.05790', 'title': 'FairRSFM: A Biome-Aware Benchmark and Debiasing Framework for Remote Sensing Foundation Models', 'url': 'https://huggingface.co/papers/2610.05790', 'abstract': 'Abstract  Remote sensing foundation models (RSFMs) are commonly evaluated using aggregate metrics, which can hide systematic performance disparities across ecological regions. We introduce FairRSFM, a biome-aware benchmark for evaluating ecological group robustness in RSFMs. FairRSFM maps georeferenced samples from 14 terrestrial biome classes into six ecologically meaningful macro-groups and evaluates models under a unified frozen-backbone evaluation protocol. The benchmark covers four downstream datasets: m-EuroSAT, m-BigEarthNet, m-SA-Crop-Type, and MMEarth20K with Dynamic World label maps. Using Prithvi-EO-2.0, SatMAE, and DOFA across three random seeds, we show that aggregate performance consistently masks biome-dependent disparities across architectures and tasks. For example, Prithvi-EO-2.0 reaches 90.98% overall macro-F1 on m-EuroSAT but a mean worst-group score of only 83.72%, while m-SA-Crop-Type drops from 27.30% overall mIoU to 18.47% in the Xeric and Mineralogical group. We further evaluate Biome-Orthogonal Linear Probing (BOLP), Dynamic Biome Reweighting (DBR), and GroupDRO as complementary mitigation baselines. Their effectiveness is model- and task-dependent; for example, BOLP improves Prithvi-EO-2.0 worst-group F1@opt on m-BigEarthNet from 46.12% to 50.27% without updating the RSFM backbone. FairRSFM provides a reusable protocol for diagnosing and mitigating ecological robustness gaps in remote sensing foundation models. Code and datasets are available at: https://github.com/aminurhossain/FairRSFM.', 'score': 2, 'issue_id': 3379, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '09ff59ff41ea78c2', 'authors': ['Md Aminur Hossain', 'Omkumar Vaghasiya', 'Rajeev Ranjan Dwivedi', 'Vinod Kurmi', 'Biplab Banerjee'], 'affiliations': ['Centre of Studies in Resources Engineering (CSRE), Indian Institute of Technology Bombay, India', 'Indian Institute of Science Education and Research Bhopal, Bhopal, India', 'Space Applications Centre, ISRO, Ahmedabad, India'], 'pdf_title_img': 'assets/pdf/title_img/2610.05790.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Справедливая оценка моделей дистанционного зондирования через призму экологических групп', 'desc': 'Работа представляет FairRSFM — бенчмарк для оценки справедливости предобученных моделей на основе спутниковых снимков (RSFM) с учетом экологических регионов. Авторы показывают, что агрегированные метрики скрывают систематические различия в производительности моделей на разных типах биомов, несмотря на высокие общие показатели точности. Они предлагают несколько методов смягчения дисперсии — линейный зондинг, ортогональный биомам (BOLP), динамическую перевзвешивание по биомам (DBR) и GroupDRO для повышения робастности моделей. Бенчмарк включает четыре датасета дистанционного зондирования и демонстрирует, что эффективность методов зависит от архитектуры модели и типа задачи.'}, 'en': {'title': 'Enhancing Ecological Fairness in Remote Sensing Models', 'desc': 'This paper introduces FairRSFM, a new benchmark designed to evaluate the robustness of remote sensing foundation models (RSFMs) across different ecological regions. It categorizes georeferenced samples into six macro-groups based on 14 terrestrial biomes, allowing for a more nuanced assessment of model performance. The study reveals that traditional aggregate metrics can obscure significant performance disparities among various ecological groups, highlighting the need for biome-aware evaluations. Additionally, it explores several mitigation strategies, such as Biome-Orthogonal Linear Probing and Dynamic Biome Reweighting, to address these disparities and improve model robustness.'}, 'zh': {'title': '公平评估生态鲁棒性的基准模型', 'desc': '远程感知基础模型（RSFMs）通常使用聚合指标进行评估，这可能掩盖生态区域之间的系统性性能差异。我们提出了FairRSFM，这是一个关注生物群落的基准，用于评估RSFMs在生态组的鲁棒性。FairRSFM将来自14个陆地生物群落类别的地理参考样本映射到六个生态上有意义的宏观组，并在统一的冻结骨干评估协议下评估模型。我们的研究表明，聚合性能掩盖了不同架构和任务之间的生物群落依赖性差异，FairRSFM为诊断和缓解远程感知基础模型中的生态鲁棒性差距提供了可重用的协议。'}}}, {'id': 'https://huggingface.co/papers/2609.37496', 'title': 'GeoSET: Generalist Foundation Model for SAR-to-EO Image Translation', 'url': 'https://huggingface.co/papers/2609.37496', 'abstract': 'Abstract  Paired synthetic aperture radar (SAR) and electro-optical (EO) imagery is increasingly available across sensors, resolutions, and geographic regions. Yet existing SAR-to-EO image translation (SET) methods are typically trained on a single, limited-scale dataset, producing models specialized to particular sensing conditions. We introduce GeoSET, the first generalist model for SET, built around a single pretrained parent that is adapted to downstream datasets under a common protocol. We curate over 3 million high-quality SAR--EO pairs from a collection of more than 10 million SAR observations, spanning diverse sensors, spatial resolutions, and ground sampling distances. To bridge the modality gap between SAR observations and a pretrained image generator, we develop a speckle-robust SAR encoder and pretrain the conditional generator on this heterogeneous corpus. The resulting parent supports efficient adaptation across downstream datasets through low-rank adaptation (LoRA), updating only 0.60% of the generator parameters and requiring approximately one hour per dataset. Across six downstream benchmarks, GeoSET achieves state-of-the-art results in FID and DISTS with full fine-tuning or LoRA, demonstrating effective transfer across heterogeneous SAR-EO domains.', 'score': 2, 'issue_id': 3378, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '80f9e1d877a0ab5f', 'authors': ['Jeonghyeok Do', 'Munchurl Kim'], 'affiliations': ['Korea Advanced Institute of Science and Technology (KAIST)'], 'pdf_title_img': 'assets/pdf/title_img/2609.37496.jpg', 'data': {'categories': ['#open_source', '#transfer_learning', '#synthetic'], 'emoji': '🛰️', 'ru': {'title': 'Универсальный генератор для трансляции радиолокационных снимков в оптические изображения', 'desc': 'В работе представлена GeoSET — первая универсальная модель для трансляции радиолокационных (SAR) изображений в оптические (EO) изображения, обученная на 3 миллионах пар высокого качества из разнообразных источников. Для преодоления модальности между SAR и предварительно обученным генератором разработан устойчивый к спеклу энкодер и проведен предварительный тренинг на гетерогенном корпусе данных. Адаптация к новым задачам осуществляется через низкоранговую адаптацию (LoRA), изменяя всего 0,60% параметров генератора, что требует около часа на один датасет. Модель достигает государственного уровня результатов по метрикам FID и DISTS, демонстрируя эффективный трансфер обучения между разнородными SAR-EO доменами.'}, 'en': {'title': 'GeoSET: Bridging the Gap Between SAR and EO Imagery', 'desc': 'This paper presents GeoSET, a novel model for translating synthetic aperture radar (SAR) images to electro-optical (EO) images. Unlike previous methods that are limited to specific datasets, GeoSET is designed to adapt to various datasets using a single pretrained model. It utilizes a large collection of over 3 million SAR-EO image pairs to enhance its training and performance. The model employs low-rank adaptation (LoRA) to efficiently update parameters, achieving state-of-the-art results across multiple benchmarks while minimizing computational costs.'}, 'zh': {'title': 'GeoSET：跨模态图像翻译的新突破', 'desc': '本文介绍了一种新的图像翻译模型GeoSET，旨在将合成孔径雷达(SAR)图像转换为电光(EO)图像。与传统方法不同，GeoSET使用一个预训练的父模型，能够适应不同的数据集，解决了现有模型在特定条件下训练的局限性。我们收集了超过300万对高质量的SAR-EO图像对，涵盖了多种传感器和分辨率。GeoSET在多个基准测试中表现出色，证明了其在不同SAR-EO领域之间的有效迁移能力。'}}}, {'id': 'https://huggingface.co/papers/2610.06425', 'title': 'SoK: Semantic Decision Engines in Network Control Loops', 'url': 'https://huggingface.co/papers/2610.06425', 'abstract': 'Abstract  A semantic decision engine such as Jev can return a valid answer and still miss a network deadline, select an infeasible action or leave the service unverified. We systematize 139 paper families by decision interface, execution path and check ownership. Fifty families claim that their engine fits a control loop or time budget, but only four support the claim with matched measurement. Across all 139, four report deadline attainment. The gap concentrates where the decision has no deterministic computation step. Those 72 families make 22 of the claims, none supported, and name a coverage owner in only two. Bounded tests under one event model show that each gap can reverse an admission verdict. A decision that meets a 10 s budget for every isolated request meets it for none once decisions queue ahead of replayed execution times. The same engine passes one coverage check and fails another. We derive a minimum reporting record, design rules and a research agenda for admitting decision engines to control loops.', 'score': 2, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'f00f6302bfee1552', 'authors': ['Delong Li', 'Chen Li', 'Xu Wang', 'Haochen Gong', 'Rui Lang', 'Guangsheng Yu'], 'affiliations': ['University of Technology Sydney, Sydney, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2610.06425.jpg', 'data': {'categories': ['#survey'], 'emoji': '⚙️', 'ru': {'title': 'Верифицируемые гарантии для систем управления: от семантических решений к надёжным контрольным петлям', 'desc': 'В статье анализируются семантические системы принятия решений, которые могут давать формально верные ответы, но не укладываться в дедлайны сети или выбирать неправильные действия. Авторы систематизировали 139 семей работ по интерфейсам решений, путям выполнения и владельцам проверок, обнаружив критический разрыв между заявленными гарантиями и реальной поддержкой измерениями. Особенно проблемны семейства без детерминированного вычислительного шага — 72 работы делают необоснованные претензии на соответствие временным бюджетам. Исследование предлагает минимальный стандарт отчётности и регулирующие правила для допуска систем принятия решений в контрольные петли.'}, 'en': {'title': 'Bridging the Gap in Decision Engine Reliability', 'desc': 'This paper analyzes the performance of semantic decision engines, focusing on their ability to meet deadlines and make feasible decisions. It categorizes 139 different paper families based on their decision interfaces and execution paths, revealing that many claim to fit within control loops but lack supporting evidence. The study highlights a significant gap in deadline attainment, particularly in cases where decisions lack deterministic computation. The authors propose design rules and a research agenda to improve the reliability of decision engines in control systems.'}, 'zh': {'title': '提升决策引擎的可靠性与效率', 'desc': '本文探讨了语义决策引擎在满足网络截止时间方面的挑战。研究系统化了139个论文类别，分析了决策接口、执行路径和检查所有权。尽管有50个类别声称其引擎适合控制循环或时间预算，但只有4个得到了匹配测量的支持。研究发现，决策缺乏确定性计算步骤的地方，存在显著的性能差距，这影响了决策引擎的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.23136', 'title': 'Intent Interpretation at RIC Timescales: Jev Decision Models versus Large Language Models in 6G Open RAN', 'url': 'https://huggingface.co/papers/2609.23136', 'abstract': 'Abstract  Intent-based Open RAN needs an interpreter that turns intents into A1 policies within the loop of the RAN intelligent controller (RIC). Decision models such as Jev-1.13.0 return typed policy fields, whereas generative large language models (LLMs) produce the policy token by token. We ask whether the extra delay of LLMs costs control deadlines, RIC capacity, or radio performance. We compare Jev-1.13.0 and two other decision models with LLMs on the RANIntent v1 benchmark, in closed-loop ns-3 simulation and on a real A1 and E2 path. Median interpretation takes 0.286 to 2.35 s, against under 25 ms for A1 and E2 transfer. Jev-1.13.0 meets the 1 s near-real-time budget on 99.8% of calls, while two hosted LLMs meet it on 17.9% and 0%. In the radio network, ideal enforcement moves the affected-class service-level agreement (SLA) violation by 3.96 percentage points in the direction each intent requests, against no update at the base point. No hosted LLM showed a resolved increase over Jev-1.13.0 at that point. At the same point, per-second direct control gave no resolved SLA reduction over a numerical xApp. Slow interpreters miss the 1 s budget, and two interpreters saturate their queues at 2 intents/s, whereas no radio penalty of slow interpreters was resolved at the base point.', 'score': 2, 'issue_id': 3378, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '84ede3972b0ed952', 'authors': ['Delong Li', 'Xu Wang', 'Haochen Gong', 'Rui Lang', 'Guangsheng Yu'], 'affiliations': ['University of Technology Sydney, Sydney, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2609.23136.jpg', 'data': {'categories': ['#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Скорость важнее масштаба: почему специализированные модели лучше LLM для real-time управления сетями', 'desc': 'В работе исследуется проблема преобразованияIntent-команд в A1 политики для интеллектуального контроллера RAN (RIC) с использованием различных моделей принятия решений. Авторы сравнивают специализированную модель Jev-1.13.0 с большими языковыми моделями (LLM), измеряя время интерпретации, соответствие временным бюджетам и влияние на радиосеть. Результаты показывают, что LLM значительно медленнее (0.286-2.35 сек против <25 мс для передачи), и не соответствуют требованиям real-time контроля (только 17.9% и 0% успешных вызов против 99.8% для Jev-1.13.0). Исследование демонстрирует, что скорость интерпретатора критична для качества обслуживания в сетях, хотя на базовой линии даже идеальное исполнение не показало явного преимущества LLM.'}, 'en': {'title': 'Optimizing Intent Translation in Open RAN: Speed Matters!', 'desc': 'This paper discusses the challenges of using large language models (LLMs) for intent-based Open RAN systems, specifically in translating intents into A1 policies within the RAN intelligent controller (RIC). It compares the performance of LLMs with traditional decision models like Jev-1.13.0, focusing on their ability to meet control deadlines and maintain radio performance. The study finds that while Jev-1.13.0 consistently meets the near-real-time requirements, LLMs struggle significantly, with only 17.9% of calls meeting the 1-second budget. Additionally, the paper highlights that slow interpreters do not improve service-level agreement (SLA) violations compared to faster models, indicating a need for efficient policy interpretation in radio networks.'}, 'zh': {'title': '意图驱动的开放RAN：决策模型与语言模型的比较', 'desc': '这篇论文探讨了意图驱动的开放无线接入网（Open RAN）中，如何将意图转化为A1策略的过程。研究比较了决策模型Jev-1.13.0与生成性大型语言模型（LLMs）在RANIntent v1基准测试中的表现。结果显示，Jev-1.13.0在99.8%的情况下满足1秒的实时预算，而LLMs的表现则远不及。论文还指出，慢速解释器无法满足实时控制的需求，且在无线网络中未能显著改善服务水平协议（SLA）的执行。'}}}, {'id': 'https://huggingface.co/papers/2609.31662', 'title': 'Learning Steadily: Accumulating Relative Point Margin Scores for Face Image Quality Assessment', 'url': 'https://huggingface.co/papers/2609.31662', 'abstract': "Abstract  Face Image Quality Assessment determines the suitability of captured face images for automated face recognition (FR), a critical capability for reliable biometric systems. Existing state-of-the-art FR-integrated FIQA methods suffer from temporal instability: as the feature space evolves during training, single-epoch quality estimates fluctuate, creating a moving target that undermines reliable quality prediction. We introduce CARPM-FIQA, a stabilization strategy for FR-integrated FIQA that accumulates relative point margin measurements, the ratio between intra-class compactness and inter-class separation, across the entire training trajectory rather than relying on single-epoch estimates. This cumulative averaging approach provides theoretically grounded advantages: reduced variance in quality estimates, improved mean squared error, and enhanced ranking stability with convergence guarantees as training progresses. Through controlled experiments on the SynFIQA dataset with labeled quality groups, we demonstrate that cumulative averaging achieves superior discriminative ability, and ablation studies across different training configurations confirm consistent improvements. Evaluated against twelve FIQA methods on eight challenging benchmarks with four FR models at two FMR thresholds, CARPM-FIQA places 4th (CARPM-FIQA(L)) and 6th (CARPM-FIQA(S)) of 17 compared methods by pAUC-EDC and AUC-EDC averaged across FR models and, after per-benchmark normalization, across benchmarks, staying within a few percent of the best method's normalized average for every FR model, providing a principled solution to training instability while maintaining the performance benefits of FR integration. More broadly, our work demonstrates that temporal aggregation strategies can stabilize training objectives in deep learning systems where target values inherently fluctuate due to evolving feature representations.", 'score': 2, 'issue_id': 3378, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': 'e8117591272a8460', 'pdf_title_img': 'assets/pdf/title_img/2609.31662.jpg', 'data': {'categories': ['#cv', '#training', '#benchmark'], 'emoji': '📸', 'ru': {'title': 'Стабилизация оценки качества лицевых изображений через кумулятивное усреднение', 'desc': 'Статья посвящена оценке качества лицевых изображений для автоматического распознавания лиц в биометрических системах. Авторы выявили проблему временной нестабильности в существующих методах: качество изображений, вычисленное в отдельную эпоху обучения, флуктуирует по мере эволюции признакового пространства. Предложен метод CARPM-FIQA, который накапливает относительные измерения маржи (отношение внутриклассовой компактности к межклассовому разделению) на всей траектории обучения, обеспечивая снижение дисперсии и улучшение стабильности ранжирования. Экспериментальные результаты на восьми бенчмарках с четырьмя моделями распознавания лиц показывают, что кумулятивное усреднение достигает четвёртого-шестого места среди 17 методов, демонстрируя эффективность стратегии временной агрегации для стабилизации целевых функций глубокого обучения.'}, 'en': {'title': 'Stabilizing Face Image Quality Assessment with CARPM-FIQA', 'desc': 'This paper addresses the challenge of assessing the quality of face images for automated face recognition (FR) systems, which is crucial for effective biometric identification. The authors introduce CARPM-FIQA, a new method that stabilizes quality predictions by accumulating measurements over the entire training process instead of relying on single-epoch evaluations. This approach reduces variability in quality estimates and improves overall performance metrics, such as mean squared error and ranking stability. Experimental results show that CARPM-FIQA outperforms existing methods, demonstrating the effectiveness of temporal aggregation strategies in enhancing the reliability of deep learning training objectives.'}, 'zh': {'title': '稳定训练，提升面部识别质量评估', 'desc': '本文提出了一种面部图像质量评估（FIQA）方法，旨在提高自动面部识别（FR）系统的可靠性。现有的FR集成FIQA方法在训练过程中存在时间不稳定性，导致质量估计波动。我们引入了CARPM-FIQA，这是一种通过累积相对点边际测量来稳定FIQA的方法，能够在整个训练过程中提供更可靠的质量预测。实验结果表明，CARPM-FIQA在多个基准测试中表现优异，证明了时间聚合策略在深度学习系统中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.02459', 'title': 'OpenRUA: Robot-Use Agents Are Zero-Shot Visuomotor Policies', 'url': 'https://huggingface.co/papers/2610.02459', 'abstract': 'Abstract  Coding agents are extending their reach into the physical world by writing and executing robot control programs. One might expect the agents to use the existing mature software stack that engineers have developed over decades to access sensors and control motion. Yet prior work primarily engineers complex custom harnesses to orchestrate agents for robot use, particularly by prescribing specialized workflows and providing bespoke interfaces. This raises the question: "Is such additional harness engineering necessary?" We introduce OpenRUA, a zero-abstraction harness that bypasses bespoke abstraction layers by providing off-the-shelf coding agents with only terminal access to the robot\'s native software interface ROS 2. OpenRUA employs a minimalist workspace-as-harness design, only offering ROS 2 documentation and basic tools while leaving the coding agent to organize its own work without orchestrating any agentic workflow. Within this workspace, OpenRUA recasts perception as file I/O and manipulation as coding. With Claude Code powered by Claude Opus 5, OpenRUA achieves success rates of 99.0% on CaP-Bench and 87.0% on LIBERO-PRO, demonstrating that an off-the-shelf coding agent can serve as a zero-shot visuomotor policy through the robot\'s native interface, without bespoke primitives or task-specific training. Under this minimalist design, further analysis reveals striking emergent behaviors of coding agents: (1) For perception, the agent spontaneously writes programs that process raw sensory inputs and derive metric measurements in 96.80% of episodes. (2) For manipulation, the agent spontaneously builds motion-control clients (e.g., gripper control) in 95.87% of episodes and closed-loop control programs (e.g., adjusting motion based on sensor feedback) in 50.13% of episodes. Our code is available at https://github.com/terminalworld/OpenRUA.', 'score': 2, 'issue_id': 3378, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '37a0261b68b0e82f', 'authors': ['Zhaoyang Chu', 'Earl T. Barr', 'Claire Le Goues', "Peter O'Hearn", 'Mark Harman', 'Federica Sarro', 'He Ye'], 'affiliations': ['Carnegie Mellon University', 'University College London'], 'pdf_title_img': 'assets/pdf/title_img/2610.02459.jpg', 'data': {'categories': ['#open_source', '#robotics', '#agents', '#plp'], 'emoji': '🤖', 'ru': {'title': 'Агенты-программисты могут управлять роботами через их нативные интерфейсы без специальных обёрток', 'desc': 'В статье представлена OpenRUA — минималистичная система для управления роботами, которая позволяет coding agent получать доступ к роботу только через терминал и нативный ROS 2 интерфейс, без специализированных обёрток и предварительной обработки. Авторы показывают, что готовые модели на базе Claude Opus 5 могут работать как универсальные visuomotor policies, достигая 99% точности на CaP-Bench и 87% на LIBERO-PRO, без необходимости в task-specific обучении. Ключевой вклад заключается в том, что agent спонтанно развивает сложное поведение: в 96.8% эпизодов пишет программы для обработки сенсорных данных, в 95.87% создаёт клиентов управления движением, и в 50.13% реализует замкнутые циклы обратной связи. Это демонстрирует, что минималистичный дизайн без оркестрации рабочего процесса позволяет LLM-агентам самостоятельно организовывать сложные робототехнические задачи через стандартные программные интерфейсы.'}, 'en': {'title': 'Empowering Coding Agents with Minimalist Robot Interfaces', 'desc': "This paper presents OpenRUA, a novel zero-abstraction harness that allows coding agents to directly interact with a robot's native software interface, ROS 2. Instead of relying on complex custom setups, OpenRUA provides a minimalist environment where agents can access documentation and basic tools, enabling them to organize their own workflows. The study shows that coding agents can effectively perform visuomotor tasks without the need for specialized training or bespoke interfaces, achieving high success rates on benchmark tasks. Notably, the agents demonstrate emergent behaviors, such as autonomously writing programs for sensory processing and motion control, showcasing their adaptability and efficiency in robotic applications."}, 'zh': {'title': '简化机器人控制的零抽象框架', 'desc': '本文介绍了OpenRUA，一个零抽象的机器人控制程序框架，旨在简化编码代理与机器人原生软件接口ROS 2的交互。与以往需要复杂定制的工程方法不同，OpenRUA提供了一个极简的工作空间，允许编码代理自主组织工作，而无需额外的工作流管理。研究表明，使用OpenRUA的编码代理在感知和操作任务中表现出色，成功率分别达到99.0%和87.0%。此外，编码代理在处理传感器输入和构建运动控制程序方面展现出自发的能力，显示出其在机器人控制中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.02999', 'title': 'OmniConfess: Eliciting Token Confessions to Mitigate Omni-Modal Hallucination', 'url': 'https://huggingface.co/papers/2610.02999', 'abstract': "Abstract  Omni-modal large language models (OmniLLMs) unify text, images, audio, and video, yet hallucinate when generation relies on the wrong evidence. Existing inference-time methods can reduce hallucinations, but rarely reveal which evidence sustains a generated commitment. We introduce OmniConfess, a training-free method for mitigating omni-modal hallucinations. It fixes a candidate response and re-scores it at token resolution under controlled channel-wise evidence interventions, producing a structured token-by-channel confession that reveals the response's evidential dependence. OmniConfess uses this confession to preserve grounded content and correct commitments driven by irrelevant or contradictory evidence. To evaluate OmniConfess, we construct OmniHalluBench, a 3,540-example benchmark built from six datasets spanning text, image, audio, and video settings and both judgment and free-form generation. Experiments show that OmniConfess mitigates hallucinations across heterogeneous modality and task settings. Our code and benchmark are publicly available at https://github.com/RongHuiQiang/OmniConfess.", 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3f03a60dd329dd97', 'authors': ['Huiqiang Rong', 'Haoran Luo', 'Hui Feng', 'Zhonghong Ou', 'Kaiwen Xue', 'Guoxin Zhang', 'Yifan Zhu'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02999.jpg', 'data': {'categories': ['#inference', '#benchmark', '#multimodal'], 'emoji': '🎭', 'ru': {'title': 'Раскрытие источников ошибок в мультимодальных моделях', 'desc': 'В работе предложен метод OmniConfess для снижения галлюцинаций в мультимодальных больших языковых моделях (OmniLLM), которые обрабатывают текст, изображения, аудио и видео одновременно. Метод является обучаемо-независимым и переоценивает кандидат-ответы на уровне токенов при целевых вмешательствах в отдельные модальности, создавая структурированное свидетельство о том, какие источники информации влияют на генерируемый ответ. Авторы предложили Omni
