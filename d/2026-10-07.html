HalluBench — бенчмарк из 3540 примеров для оценки галлюцинаций в мультимодальных задачах. Экспериментальные результаты демонстрируют эффективность OmniConfess в снижении галлюцинаций при работе с разнородными модальностями.'}, 'en': {'title': 'Mitigating Hallucinations in Omni-Modal Models with OmniConfess', 'desc': "This paper presents OmniConfess, a novel method designed to reduce hallucinations in omni-modal large language models (OmniLLMs) that process text, images, audio, and video. Unlike existing methods, OmniConfess does not require training and instead focuses on analyzing the evidence that supports generated responses. It achieves this by fixing a candidate response and re-evaluating it at a granular level, revealing which pieces of evidence influence the model's output. The effectiveness of OmniConfess is demonstrated through a comprehensive benchmark, OmniHalluBench, which shows significant improvements in reducing hallucinations across various modalities and tasks."}, 'zh': {'title': 'OmniConfess：减轻多模态幻觉的创新方法', 'desc': 'Omni-modal大型语言模型（OmniLLMs）能够统一处理文本、图像、音频和视频，但在生成时可能会出现幻觉，尤其是当依赖错误证据时。现有的推理方法可以减少幻觉，但很少揭示生成内容所依赖的证据。我们提出了一种名为OmniConfess的方法，它不需要训练，可以减轻多模态幻觉。OmniConfess通过在受控的证据干预下重新评分候选响应，揭示响应的证据依赖性，从而保留基于证据的内容并纠正由无关或矛盾证据驱动的承诺。'}}}, {'id': 'https://huggingface.co/papers/2610.04631', 'title': 'The Numerical Linear Algebra of Large Language Models', 'url': 'https://huggingface.co/papers/2610.04631', 'abstract': 'Abstract  Numerical Linear Algebra (NLA) has consistently played a vital role in advancing science by providing tools to solve fundamental problems encountered in scientific and engineering applications. Over the decades, it has continually evolved to meet the demands driven by successive waves of scientific discovery. For instance, during the 1950s and 1960s, substantial efforts were devoted to developing methods for solving eigenvalue problems that emerged from the rapidly growing field of aerodynamics. This led to the discovery of the LR and QR algorithms. Later the attention turned to the solution of sparse linear systems that were common in applications like computational aerodynamics. Today we are experiencing yet another wave of major scientific advancement and NLA is once more at the heart of its development. This Machine Learning (ML) wave is proving to be utterly disruptive in science and engineering. Many tools in ML particularly Large Language Models (LLMs) are grounded in matrix and tensor methods. As we are approaching Artificial General Intelligence (AGI), it is clear that matrix methods will be called to play an even more significant role. For the numerical linear practitioner the speed of the current change makes it particularly challenging to adapt.   This is a survey article that centers on machine learning techniques, with a particular focus on large language models. It has two main objectives. The first is to clarify the core concepts behind Large Language Models in a manner accessible to specialists in numerical methods. The second is to examine the key Numerical Linear Algebra concepts employed by LLM techniques, while also highlighting several significant recent contributions of NLA to the field.', 'score': 1, 'issue_id': 3380, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '3ecc23396517dd8c', 'authors': ['Abdelkader Baggag', 'Yousef Saad'], 'affiliations': ['Qatar Computing Research Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.04631.jpg', 'data': {'categories': ['#agi', '#survey', '#science'], 'emoji': '🧮', 'ru': {'title': 'Матричные методы как фундамент современных языковых моделей', 'desc': 'Статья рассматривает роль численной линейной алгебры (NLA) в развитии машинного обучения, особенно больших языковых моделей. Авторы объясняют основные концепции LLM специалистам в области численных методов, показывая, как матричные и тензорные методы лежат в основе современных моделей глубокого обучения. Исследование выделяет ключевые алгоритмы численной линейной алгебры, которые применяются в технологиях LLM и способствуют их развитию. Работа подчёркивает, что с приближением к искусственному интеллекту общего назначения (AGI) роль матричных методов будет только возрастать.'}, 'en': {'title': 'Bridging Numerical Linear Algebra and Machine Learning for Future Innovations', 'desc': 'This paper discusses the importance of Numerical Linear Algebra (NLA) in the context of recent advancements in Machine Learning (ML), particularly focusing on Large Language Models (LLMs). It highlights how NLA has evolved over the decades to address various scientific challenges, including eigenvalue problems and sparse linear systems. The authors aim to make the core concepts of LLMs understandable for those specialized in numerical methods and to showcase how NLA techniques are integral to the development of these models. As we move towards Artificial General Intelligence (AGI), the paper emphasizes the growing significance of matrix methods in ML applications.'}, 'zh': {'title': '数值线性代数与大型语言模型的结合', 'desc': '数值线性代数（NLA）在科学和工程应用中解决基本问题方面发挥了重要作用。随着科学发现的不断推进，NLA也在不断发展，以满足新的需求。本文主要探讨机器学习技术，特别是大型语言模型（LLM），并旨在使数值方法专家能够理解LLM的核心概念。文章还分析了LLM技术中使用的关键数值线性代数概念，并强调了NLA在该领域的重要贡献。'}}}, {'id': 'https://huggingface.co/papers/2610.04749', 'title': 'Agentic discovery of blood biomarker from distilled private health records', 'url': 'https://huggingface.co/papers/2610.04749', 'abstract': "Abstract  Routine complete blood counts (CBCs) could yield new biomarkers, but the private records needed to evaluate candidates cannot be shared with frontier language model agents that excel at discovery. We distilled the evidence held in the Clalit Health Services panel of over 5.4 million patients into a released scoring tool: for each of 13 immune-mediated diseases, a graph attention network was trained inside the data boundary to predict the case-control AUC of candidate CBC expressions, and only the trained weights were released. The tool grounds an agent's propose-score-refine loop in real-world data without exposing any patient data. In external validation, agent-discovered expressions improved on their literature-seeded starting points by a median of 4.18 AUC percentage points, and across three independent cohorts, reranking the candidates of three frontier research tools improved on their first choices in most comparisons, with gains that varied by cohort. The released scorer supports privacy-preserving biomarker hypothesis generation.", 'score': 1, 'issue_id': 3379, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '696e568a3ab0c6f2', 'authors': ['Seffi Cohen', 'Liat Antwarg Friedman', 'Amir Anisman', 'Ruth Johnson', 'Michelle M. Li', 'Ayush Noori', 'Ben Reis', 'Ran Balicer', 'Noa Dagan', 'Marinka Zitnik'], 'affiliations': ['Clalit Research Institute, Innovation Division, Clalit Health Services', 'Computer and Information Science, Ben Gurion University of the Negev', 'Department of Biomedical Informatics, Harvard Medical School', 'Department of Epidemiology, Biostatistics and Community Health Sciences, Ben-Gurion University of the Negev', 'The Ivan and Francesca Berkowitz Family Living Laboratory Collaboration at Harvard Medical School and Clalit Research Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.04749.jpg', 'data': {'categories': ['#healthcare', '#agents', '#architecture'], 'emoji': '🔬', 'ru': {'title': 'Приватное открытие биомаркеров через обученные нейросетевые модели', 'desc': 'Исследователи разработали инструмент для выявления новых биомаркеров из данных анализа крови, обученный на информации 5.4 миллионов пациентов. Они использовали графовые нейросетевые модели внутри защищённых границ данных для каждого из 13 иммунных заболеваний, обучив их предсказывать диагностическую ценность различных показателей. Вместо передачи конфиденциальных данных агентам, они выпустили только обученные параметры модели, позволяя LLM-агентам генерировать и оценивать гипотезы без доступа к информации пациентов. Метод продемонстрировал улучшение качества обнаруженных биомаркеров на 4.18 процентных пункта AUC по сравнению с известными кандидатами.'}, 'en': {'title': 'Privacy-Preserving Biomarker Discovery from Blood Counts', 'desc': "This paper presents a novel approach to discovering biomarkers from routine complete blood counts (CBCs) while ensuring patient privacy. A graph attention network was trained on a large dataset of over 5.4 million patients to predict the effectiveness of various CBC expressions for 13 immune-mediated diseases. The trained model's weights were shared without revealing any sensitive patient information, allowing for safe exploration of potential biomarkers. The results showed that the new scoring tool significantly improved the performance of existing research methods in identifying promising biomarkers across multiple cohorts."}, 'zh': {'title': '隐私保护下的生物标志物发现工具', 'desc': '这篇论文探讨了如何利用常规的全血细胞计数（CBC）数据来发现新的生物标志物。研究团队在不泄露患者隐私的情况下，使用图注意力网络对超过540万患者的数据进行了训练，以预测候选CBC表达的案例对照AUC。最终，他们发布了一个评分工具，支持在真实数据基础上进行生物标志物假设生成。外部验证显示，使用该工具发现的表达在多个独立队列中显著提高了AUC得分。'}}}, {'id': 'https://huggingface.co/papers/2610.06679', 'title': 'Closing the Context Gap: Activation Alignment for Tabular In-Context Learning', 'url': 'https://huggingface.co/papers/2610.06679', 'abstract': 'Abstract  Tabular foundation models perform in-context learning (ICL) by conditioning predictions on labeled training examples provided as context. Unlike traditional models that separate training from inference, these models must process all training examples in every forward pass, making each prediction expensive. Restricting the number of training examples reduces this cost but substantially degrades performance. Instead of discarding context, we propose activation alignment, a method that leverages the full context to teach a model how to behave when seeing only a subset. This is achieved by training a lightweight linear transformation on synthetic unlabeled data to map the intermediate activations of a data-constrained "student" (using partial context) toward those of a full-context "teacher" (using all data). Training the aligner requires no GPU and converges in seconds to minutes on commodity hardware. We evaluate on 38 classification datasets from the TabArena benchmark using the leading two tabular foundation models, TabPFN-3 and TabFM. Across all context budgets, the aligned student yields broad, statistically significant improvements over the unaligned baseline for both models. In low-data regimes, alignment recovers nearly half of the teacher\'s predictive advantage. The method provides a practical, low-overhead approach to achieving the inference speed of compact contexts while closing a significant fraction of the performance gap to the full-context teacher.', 'score': 1, 'issue_id': 3379, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '4e9e71d36d0ec93f', 'pdf_title_img': 'assets/pdf/title_img/2610.06679.jpg', 'data': {'categories': ['#training', '#inference', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Выравнивание активаций: скорость без потери качества в табулярных моделях', 'desc': 'Статья посвящена методу активационного выравнивания (activation alignment) для табулярных фундаментальных моделей, которые используют обучение в контексте (in-context learning). Проблема состоит в том, что эти модели обрабатывают все примеры обучения при каждом предсказании, что замедляет вывод, а ограничение количества примеров значительно снижает качество. Предложенный метод обучает лёгкую линейную трансформацию на синтетических данных, чтобы выравнивать активации модели с ограниченным контекстом к активациям модели с полным контекстом. Экспериментальные результаты показывают, что выравненная модель достигает статистически значимых улучшений и восстанавливает примерно половину преимущества полного контекста при небольшом объёме данных.'}, 'en': {'title': 'Aligning Activations for Efficient In-Context Learning', 'desc': "This paper introduces a method called activation alignment for improving the efficiency of tabular foundation models during in-context learning (ICL). Traditional models require processing all training examples for each prediction, which is costly, especially when the number of examples is large. The proposed method allows a 'student' model to learn from a 'teacher' model by aligning their activations, even when the student only uses a subset of the training data. This approach not only speeds up inference but also significantly enhances the performance of the student model, especially in scenarios with limited data."}, 'zh': {'title': '激活对齐：提升表格模型推理效率的创新方法', 'desc': '这篇论文介绍了一种新的方法，称为激活对齐，用于提高表格基础模型的推理效率。传统模型在推理时需要处理所有训练示例，而激活对齐方法通过训练一个轻量级的线性变换，将部分上下文的中间激活映射到完整上下文的激活上。这样，模型在使用部分上下文时仍能保持较高的性能，尤其是在数据稀缺的情况下。实验结果表明，使用激活对齐的模型在多个分类数据集上表现显著优于未对齐的基线。'}}}, {'id': 'https://huggingface.co/papers/2610.06804', 'title': 'Sharpen Without Search: On-Policy Distillation of Sequence-Level Power Distribution', 'url': 'https://huggingface.co/papers/2610.06804', 'abstract': "Abstract  A language model can give a correct answer more probability than any single incorrect answer and still usually sample an incorrect one, because the incorrect answers together hold more probability. The power distribution raises each complete answer's probability to a power above one and renormalizes, shifting probability toward answers the model finds most likely (sharpening). Sampling from it improves reasoning without changing parameters, but needs many scored candidates per query. We show that a model can instead be trained to produce such answers in one generation. On-policy power distillation (OPPD) runs a sequential Monte Carlo sampler in which the model being trained generates candidates and a frozen teacher's power distribution weights them; the same probabilities weight each answer in a maximum-likelihood update. Training raises single-generation accuracy by up to 23.0 points on MATH500 and 27.3 on GSM8K over the untrained model at the same temperature, and one generation scores 2.4 and 3.5 points above published power sampling with 64 candidates, recovering 94 percent of the gain that 16 candidates give the untrained model. For context, against GRPO trained with verified rewards from the same checkpoint and budget, OPPD scores 3.8, 4.0 and 5.4 points higher on MATH500, GSM8K and AIME using no reference answers; the two are complementary, and OPPD applied after GRPO adds up to 9.3 points. Trained only on mathematics, OPPD raises HumanEval accuracy by up to 5.3 points. One loss coefficient moves the sharpening exponent the model absorbs between 1.19 and 2.02, against 1.14 for ordinary on-policy distillation, and it rises mostly on the model's own answers. Gains hold across model families and sizes, including a model already trained with verified rewards, where lowering the temperature gives nothing and OPPD adds 4.4 points on MATH500. Code: https://github.com/ArminAzizi98/OPPD.", 'score': 1, 'issue_id': 3379, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '507fd5fa13720669', 'authors': ['Erfan Baghaei Potraghloo', 'Seyedarmin Azizi', 'Arya Fayyazi', 'Saeid Shokoufa', 'Mehdi Kamal', 'Souvik Kundu', 'Massoud Pedram'], 'affiliations': ['Intel AI, USA', 'University of Southern California, Los Angeles, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.06804.jpg', 'data': {'categories': ['#open_source', '#optimization', '#math', '#rlhf', '#reasoning', '#training'], 'emoji': '⚡', 'ru': {'title': 'Обучение моделей генерировать взвешенные ответы через power distillation', 'desc': 'Языковые модели часто генерируют неправильные ответы, потому что совокупная вероятность всех ошибочных ответов выше вероятности любого правильного ответа. Авторы предлагают использовать power distribution — распределение, которое повышает вероятность наиболее вероятных ответов модели, заостряя выбор в сторону правильных решений. Вместо того чтобы семплировать из этого распределения много раз, они обучают модель напрямую генерировать улучшенные ответы за одну попытку, используя метод On-Policy Power Distillation (OPPD) с sequential Monte Carlo семплером. На задачах математического рассуждения (MATH500, GSM8K) этот подход улучшает точность на 23-27 пунктов без изменения параметров модели и превосходит другие методы оптимизации на основе reward.'}, 'en': {'title': 'Boosting Language Model Accuracy with One-Pass Power Distillation', 'desc': "This paper introduces On-policy Power Distillation (OPPD), a method that enhances the accuracy of language models by training them to generate high-quality answers in a single pass. OPPD utilizes a sequential Monte Carlo sampler where the model generates candidate answers, and a frozen teacher model's power distribution evaluates these candidates. The training process significantly improves the model's performance on mathematical tasks, achieving notable accuracy gains compared to traditional methods. The results demonstrate that OPPD can effectively sharpen the probability distribution of answers, leading to better reasoning capabilities without the need for multiple candidate generations."}, 'zh': {'title': '提升语言模型生成准确性的在线策略功率蒸馏', 'desc': '这篇论文探讨了一种新的训练方法，称为在线策略功率蒸馏（OPPD），旨在提高语言模型的生成准确性。通过使用一个固定的教师模型的功率分布来加权候选答案，OPPD能够在一次生成中产生更高质量的答案，而无需改变模型参数。实验结果显示，OPPD在多个数学数据集上显著提高了模型的准确性，尤其是在MATH500和GSM8K上。该方法在不同模型和规模上均表现出良好的效果，展示了其广泛的适用性和潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.02586', 'title': 'Labels Override Definitions in Jev-Style Typed Decision Models', 'url': 'https://huggingface.co/papers/2610.02586', 'abstract': 'Abstract  A typed decision model answers a fixed question about an input by returning a probability for each of several caller-defined options. Each option carries a short label and a written definition, which is where a developer states the rule the model should apply. Jev introduced this interface for routing, moderation and triage, open implementations followed, and the same operation occurs whenever a language model is used as a classifier by scoring label strings. We study the open implementations, whose weights we can inspect and patch, and ask whether the probability follows the definitions or the labels. A preference for the label we call option-label bias. Across four open-weight typed decision models, three ways of reading an answer from a Qwen2.5 backbone, eleven classification tasks and PolicyBench, a synthetic routing suite we introduce in which the rule appears only in the definitions, the answer is mostly the labels. Deleting every definition leaves accuracy unchanged (laya-td: 0.8559 against 0.8487), although those definitions support 0.7971 on their own, and renaming the options to A and B raises accuracy by +0.1511 [+0.1377, +0.1646]. One system, von, is unaffected, and the two code bases differ in one expression: laya writes each option as "{label}: {definition}", while von writes only the definition. Changing that expression in both directions, with no weight changed, makes all three laya checkpoints exactly invariant (+0.0000 [+0.0000, +0.0000]) and creates the effect in von, whose accuracy falls from 0.8511 to 0.2281 when a label contradicts its definition. Earlier work attributed this failure to the constrained decision head these models use in place of a text decoder; our results locate it in the prompt rendering. We give a two-call test that tells a practitioner which case applies to their model, and measure what four mitigations are worth.', 'score': 1, 'issue_id': 3379, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'fab345d0f94d3612', 'authors': ['Seyedarmin Azizi', 'Erfan Baghaei Potraghloo', 'Massoud Pedram'], 'affiliations': ['University of Southern California (USC)'], 'pdf_title_img': 'assets/pdf/title_img/2610.02586.jpg', 'data': {'categories': ['#dataset', '#benchmark'], 'emoji': '🏷️', 'ru': {'title': 'Когда модель выбирает ярлык вместо логики: проблема смещения в классификации на основе языковых моделей', 'desc': 'В статье изучается проблема option-label bias в типизированных моделях принятия решений, которые используют языковые модели для классификации с предоставленными опциями и их определениями. Авторы обнаружили, что модели часто опираются на названия опций (labels) вместо их письменных определений (definitions), игнорируя логику, которую разработчик указал в определениях. Через анализ открытых весов нескольких моделей на базе Qwen2.5 и новом синтетическом наборе PolicyBench, они показали, что проблема заключается не в архитектуре модели, а в том, как опции форматируются в prompt. Авторы предложили двухшаговый тест для диагностики этой проблемы и оценили четыре способа её смягчения.'}, 'en': {'title': 'Understanding Option-Label Bias in Typed Decision Models', 'desc': 'This paper investigates how typed decision models, which provide probabilities for user-defined options, are influenced by the labels and definitions associated with those options. The authors introduce a synthetic routing suite called PolicyBench to analyze the performance of these models across various classification tasks. They discover that the models tend to favor the labels over the definitions, leading to a phenomenon termed option-label bias. The study also presents a method for practitioners to assess their models and evaluates the effectiveness of different mitigation strategies to address this bias.'}, 'zh': {'title': '揭示决策模型中的标签偏差', 'desc': '这篇论文研究了类型化决策模型如何根据输入返回每个选项的概率。模型的每个选项都有一个标签和定义，开发者在定义中说明模型应遵循的规则。研究发现，模型的输出更倾向于标签而非定义，这种现象被称为选项标签偏差。通过对不同模型的实验，论文提出了一种测试方法，帮助实践者判断其模型的表现，并评估四种缓解措施的效果。'}}}, {'id': 'https://huggingface.co/papers/2605.16817', 'title': 'Adaptive Fused Prior Transfer for Controllable Generative Image Compression', 'url': 'https://huggingface.co/papers/2605.16817', 'abstract': 'Abstract  Learned image compression achieves competitive rate-distortion performance, but very-low-bitrate reconstruction remains challenging because the transmitted representation cannot preserve fine textures and local structures. Perceptual and generative codecs synthesize missing details using reconstruction priors, while controllable codecs allow one model to cover different bitrate and reconstruction preferences. However, existing codebook-based controllable designs generally rely on single-codebook reconstruction priors. We propose Adaptive Fused Prior Transfer for Controllable Generative Image Compression (AFP-GIC), a controllable codec that transfers an adaptive fused prior from a frozen pretrained AdaCode model. Encoder-side fused-prior features guide latent formation, while the decoder predicts a compatible fused prior from the compressed representation and selected control variables, enabling prior-guided reconstruction without transmitting the fused prior itself. A motivating analysis shows that better decoder-side fused-prior alignment tightens a reconstruction-error upper bound and that the fused-prior family contains single-codebook choices as special cases. Under the unified benchmark, AFP-GIC achieves 18.1% lower decoder latency and uses 31.10 million (20.5%) fewer inference parameters than DC-VIC. Experiments on Kodak, CLIC2020, and DIV2K show competitive PSNR and SSIM, with the clearest perceptual gains in NIQE scores and very-low-bitrate visual comparisons.', 'score': 1, 'issue_id': 3379, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '7d2a1f49dd1fe175', 'authors': ['Yifei Pei', 'Ying Liu', 'Nam Ling'], 'affiliations': ['Department of Computer Science and Engineering, Santa Clara University, Santa Clara, CA 95053 USA'], 'pdf_title_img': 'assets/pdf/title_img/2605.16817.jpg', 'data': {'categories': ['#cv', '#benchmark', '#inference'], 'emoji': '🖼️', 'ru': {'title': 'Адаптивный объединённый приор для управляемого генеративного сжатия изображений', 'desc': 'В статье предлагается новый метод управляемого сжатия изображений (AFP-GIC), который использует адаптивный объединённый приор, передаваемый от предварительно обученной модели AdaCode. Система работает в два этапа: кодировщик использует признаки приора для формирования латентного представления, а декодировщик восстанавливает совместимый приор прямо из сжатых данных и параметров управления. Метод достигает значительного снижения латентности декодера (на 18,1%) и использует на 20,5% меньше параметров по сравнению с существующими подходами. Экспериментальные результаты показывают конкурентные показатели PSNR и SSIM, особенно заметные улучшения в перцептивном качестве при очень низких битрейтах.'}, 'en': {'title': 'Adaptive Fused Prior Transfer: Enhancing Image Compression Efficiency', 'desc': 'This paper presents a new method called Adaptive Fused Prior Transfer for Controllable Generative Image Compression (AFP-GIC) that improves image compression at very low bitrates. It uses a pretrained model to create adaptive fused prior features that help in forming the compressed representation. The decoder then predicts a compatible prior based on the compressed data and control variables, allowing for better reconstruction without needing to send the prior itself. The results show that AFP-GIC reduces decoder latency and the number of parameters while achieving competitive image quality metrics like PSNR and SSIM, especially in perceptual quality assessments.'}, 'zh': {'title': '自适应融合先验：提升图像压缩质量的关键', 'desc': '本文提出了一种名为自适应融合先验传递的可控生成图像压缩方法（AFP-GIC），旨在解决低比特率重建中的细节丢失问题。该方法通过从预训练的AdaCode模型中转移自适应融合先验，来指导编码器和解码器的特征形成。解码器根据压缩表示和控制变量预测兼容的融合先验，从而实现无须传输融合先验的重建。实验结果表明，AFP-GIC在解码延迟和推理参数上均优于现有方法，并在图像质量上表现出竞争力。'}}}, {'id': 'https://huggingface.co/papers/2610.01789', 'title': 'iADD: Improving Alignment and Diversity in Diffusion Policy Optimization', 'url': 'https://huggingface.co/papers/2610.01789', 'abstract': 'Abstract  Reinforcement learning based post training of diffusion models, such as Denoising Diffusion Policy Optimization (DDPO), optimizes a reverse diffusion process under a reward function. However, current approaches to reward optimizations do so at the cost of diversity and quality. In this paper, we provide better tradeoffs through careful theoretical considerations and method design. We analyze the theoretical framework and mathematically demonstrate that only-latter timestep updates of diffusion model may be harmful for diversity contrary to the conclusions presented in a previous work. Additionally, we propose an incremental Feynman-Kac training based on strong theoretical foundations in order to achieve the best-yet alignment-diversity tradeoffs. We perform extensive experiments and compare our method against related diffusion policy optimization approaches in three different tasks and also provide strong ablations for each component, thus validating strong performance gains in both alignment and diversity.', 'score': 1, 'issue_id': 3379, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'da63220020964990', 'authors': ['Ashok Prasad Neupane', 'Saugat Adhikari', 'Pramish Paudel', 'Ajad Chhatkuli', 'Danda Pani Paudel'], 'affiliations': ['INSAIT, Sofia University St. Kliment Ohridski, Bulgaria', 'NAAMII, Kathmandu, Nepal', 'Pulchowk Campus, IOE, Tribhuvan University, Lalitpur, Nepal'], 'pdf_title_img': 'assets/pdf/title_img/2610.01789.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#alignment'], 'emoji': '🎯', 'ru': {'title': 'Сбалансированная оптимизация: достижение лучшего компромисса между точностью и разнообразием в диффузионных моделях', 'desc': 'В этой работе авторы исследуют проблему оптимизации диффузионных моделей с использованием reinforcement learning, которая часто приводит к снижению разнообразия генерируемых результатов. Они доказывают теоретически, что обновление только на поздних временных шагах обратного процесса диффузии может негативно повлиять на разнообразие выходов. Для решения этой проблемы предлагается метод, основанный на формуле Фейнмана-Каца и имеющий строгое теоретическое обоснование. Экспериментальные результаты на нескольких задачах демонстрируют, что новый подход достигает лучшего баланса между качеством выравнивания с целевой функцией вознаграждения и разнообразием сгенерированных образцов.'}, 'en': {'title': 'Balancing Quality and Diversity in Diffusion Models', 'desc': 'This paper discusses improving reinforcement learning methods for training diffusion models, specifically focusing on Denoising Diffusion Policy Optimization (DDPO). The authors highlight that existing reward optimization techniques often compromise the diversity and quality of the generated outputs. They introduce a new training method based on the Feynman-Kac framework, which aims to balance alignment and diversity more effectively. Through theoretical analysis and extensive experiments, the paper demonstrates that their approach achieves superior performance compared to previous methods.'}, 'zh': {'title': '优化扩散模型的对齐与多样性权衡', 'desc': '本文探讨了基于强化学习的扩散模型后训练方法，特别是去噪扩散策略优化（DDPO）。现有的奖励优化方法往往牺牲了多样性和质量。我们通过理论分析和方法设计，提供了更好的权衡，并指出仅在后期时间步更新扩散模型可能会对多样性产生负面影响。我们提出了一种基于强理论基础的增量费曼-卡克训练，以实现最佳的对齐与多样性权衡，并通过大量实验验证了我们方法的优越性能。'}}}, {'id': 'https://huggingface.co/papers/2609.35652', 'title': 'MM-ABC: Towards Generalist Mobile Manipulation via Seeing, Coordinating and Imagining', 'url': 'https://huggingface.co/papers/2609.35652', 'abstract': 'Abstract  Mobile manipulation extends robot interaction beyond a fixed kinematic workspace by making the reachable region itself controllable. This flexibility introduces two central challenges: spatially grounded perception under continuous ego-motion and coordinated control of heterogeneous arm and base actions. Existing approaches strengthen geometry through explicit 3D representations or predictive world models, and often decouple mobility and manipulation into separate action streams. We argue that effective mobile manipulation requires not only decoupling, but also representations that support efficient cross-stream collaboration. We present MM-ABC, a foundation model built around Seeing, Coordinating, and Imagining Arm-Base Collaboration. MM-ABC combines sparse multi-level VLM features for spatial perception; a training-only future branch that uses world imagination and geometric intent as extra supervision, strengthening perception and manipulation-intent prediction and improving the overall learning signal; and MM-APT, which coordinates separate manipulation and mobility streams through masked joint attention and clean-action x-prediction. In controlled ablations, replacing clean-action prediction with velocity prediction lowers success on RoboCasa365 composite-seen tasks from 32.8% to 29.2%, and removing future supervision or multilevel conditioning causes larger drops. We pretrain MM-ABC on 5,000+ hours of heterogeneous robot data spanning 400K+ episodes, 12 datasets, and 17 embodiments. Experiments cover EBench, RoboCasa365, ManiSkill-HAB, LIBERO, LIBERO-Plus, and real-world mobile manipulation. MM-ABC achieves 44.71% success on EBench, 61.2% on RoboCasa365, 99.1% on LIBERO, 82.8% on LIBERO-Plus without perturbation training, and 83% mean success on five real-world tasks.', 'score': 1, 'issue_id': 3378, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '828adb45e298367a', 'authors': ['Qiwei Liang', 'Guangyu Chen', 'Shaolong Zhu', 'Zikuan Xiao', 'Jinxuan Lu', 'Yifan Xie', 'Renjing Xu', 'Wenbo Ding', 'Tianxing Chen'], 'affiliations': ['The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'Tsinghua University', 'Xspark AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.35652.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#architecture', '#training', '#dataset', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Синергия восприятия и координации для мобильной манипуляции роботов', 'desc': 'В статье представляется MM-ABC, фундаментальная модель для мобильной манипуляции роботов, которая решает проблему координации базы и манипулятора при выполнении задач в открытом пространстве. Авторы предлагают архитектуру, объединяющую восприятие на основе многоуровневых VLM признаков, предсказание будущего состояния мира для усиления сигнала обучения и механизм координации отдельных потоков действий через маскированное совместное внимание. Модель предварительно обучена на более чем 5000 часах данных от различных роботов, охватывающих более 400000 эпизодов из 12 датасетов. Экспериментальные результаты демонстрируют высокую эффективность на различных бенчмарках и реальных задачах мобильной манипуляции.'}, 'en': {'title': 'Enhancing Mobile Manipulation with MM-ABC: A Collaborative Approach', 'desc': "This paper presents MM-ABC, a foundation model designed to enhance mobile manipulation in robotics by integrating spatial perception and coordinated control of arm and base actions. The model addresses challenges in continuous ego-motion and the need for effective collaboration between mobility and manipulation tasks. By utilizing sparse multi-level visual language model features and a unique training approach that includes future supervision, MM-ABC improves the prediction of manipulation intent and overall learning efficiency. Experimental results demonstrate significant success rates across various benchmarks, showcasing the model's effectiveness in real-world mobile manipulation scenarios."}, 'zh': {'title': '移动操控的智能协作新模式', 'desc': '移动操控使机器人能够在可控的空间中进行交互，超越了固定的运动范围。本文提出了MM-ABC模型，旨在解决在持续自我运动下的空间感知和异构臂基动作的协调控制问题。该模型结合了稀疏的多层次视觉语言模型特征，利用世界想象和几何意图作为额外监督，增强了感知和操控意图的预测能力。通过在5000多个小时的异构机器人数据上进行预训练，MM-ABC在多个真实世界任务中取得了显著的成功率。'}}}, {'id': 'https://huggingface.co/papers/2610.06693', 'title': 'Adapting prior-data fitted networks for tabular anomaly detection', 'url': 'https://huggingface.co/papers/2610.06693', 'abstract': 'Abstract  While deep features have transformed anomaly detection in images and video, their impact on tabular data has been less substantial, partly due to the limited availability of strong deep representations. Recently, prior-data fitted networks (PFNs) have emerged as a promising source of such representations for tabular data. In this work, we investigate how PFN representations can be adapted and leveraged for anomaly detection. The question is harder than it looks. No anomalies are available before deploy- ment, so model parameters cannot be tuned with supervision, and the reference set that defines normal behavior may itself contain the very anomalies it is supposed to reveal. We begin our study using frozen TabPFN features. Scoring each sam- ple by its distance to its nearest neighbors in feature space already gives strong results. We identify which layers to use and a feature-extraction procedure suited to the task. Next, to further improve performance, we use the reference set to fine- tune the model, so that the resulting features better separate normal samples from anomalies. On the ADBench benchmark, our fine-tuning free approach (ZEN) reaches a higher mean AUROC than every baseline, and our fine-tuned method (FOCUS) improves on it further. Our approach also generalizes across PFN models.', 'score': 1, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'f36e281bcce6c6dc', 'authors': ['Maximilian Bershtman', 'Niv Cohen'], 'affiliations': ['Faculty of Electrical and Computer Engineering, Technion Israel Institute of Technology, Haifa, Israel'], 'pdf_title_img': 'assets/pdf/title_img/2610.06693.jpg', 'data': {'categories': ['#optimization', '#training', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Глубокие представления для обнаружения аномалий в табулярных данных без примеров аномалий', 'desc': 'В работе исследуется применение представлений, полученных из сетей, обученных на предварительных данных (PFN), для детектирования аномалий в табулярных данных. Авторы предлагают два подхода: ZEN, который использует замороженные признаки PFN и оценивает аномальность через расстояние до ближайших соседей в пространстве признаков, и FOCUS, который дополнительно настраивает модель на эталонном наборе данных для лучшего разделения нормальных и аномальных образцов. Ключевая особенность методов — они не требуют доступа к примерам аномалий во время обучения, что соответствует реальным условиям развертывания. На бенчмарке ADBench оба предложенных метода превосходят существующие базовые подходы и демонстрируют универсальность к различным моделям PFN.'}, 'en': {'title': 'Unlocking Anomaly Detection in Tabular Data with PFNs', 'desc': 'This paper explores the use of prior-data fitted networks (PFNs) for detecting anomalies in tabular data, which has been less effective compared to image and video data. The authors address the challenge of not having labeled anomalies during model training, making it difficult to tune parameters effectively. They propose a method that utilizes frozen TabPFN features and measures the distance of samples to their nearest neighbors in feature space to identify anomalies. Additionally, they enhance performance by fine-tuning the model using a reference set, achieving superior results on the ADBench benchmark compared to existing methods.'}, 'zh': {'title': '利用PFN提升表格数据异常检测的能力', 'desc': '深度特征在图像和视频的异常检测中取得了显著进展，但在表格数据中的应用效果相对较弱。最近，先前数据拟合网络（PFNs）被提出，作为表格数据强深度表示的潜在来源。本文探讨了如何将PFN表示适应并用于异常检测，尤其是在没有异常样本的情况下进行模型参数调整的挑战。我们的方法在ADBench基准测试中表现优异，展示了无需微调的方式（ZEN）和经过微调的方法（FOCUS）都能有效提高异常检测的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.06545', 'title': 'Empirical Variational Autoencoder', 'url': 'https://huggingface.co/papers/2610.06545', 'abstract': 'Abstract  We present Empirical Variational Autoencoder, a general generative framework for continuous-valued (i.e., non-vector-quantized) sequences. EVA is based on the evidence lower bound of the Variational Autoencoder (VAE) but learns autoregressive latent priors empirically from training data, which can be implemented only by an additional single linear layer on top of VAEs. By replacing the conventional standard-Gaussian constraint with the self-predicted priors, EVA significantly alleviates the latent distribution gap between prior and posterior which is typically observed in conventional VAEs, and leads to high-fidelity ancestral sampling for sequential data generation. Extensive experiments on image and sound synthesis demonstrate that EVA achieves competitive generation quality with autoregressive diffusion baselines despite its much faster inference time.', 'score': 1, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'f6f8bb11a272718e', 'authors': ['Kaede Shiohara'], 'affiliations': ['The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2610.06545.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Эмпирические приоры для высококачественной генерации последовательностей', 'desc': 'В статье предлагается Empirical Variational Autoencoder (EVA) — обобщённая генеративная модель для последовательностей непрерывных значений. EVA основана на вариационном нижнем пределе обоснованности VAE, но обучает авторегрессивные априорные распределения непосредственно из данных обучения, что реализуется простым дополнительным линейным слоем. Замена стандартного гауссовского ограничения на самопредсказанные априорные распределения значительно уменьшает разрыв между распределениями в кодировщике и декодировщике, что типично для классических VAE. Экспериментальные результаты на синтезе изображений и звука показывают, что EVA достигает качества, сравнимого с авторегрессивными диффузионными моделями, но работает значительно быстрее.'}, 'en': {'title': 'Empirical Variational Autoencoder: Bridging Latent Gaps for Better Sequence Generation', 'desc': "The Empirical Variational Autoencoder (EVA) is a new framework designed for generating continuous sequences. It builds on the Variational Autoencoder (VAE) by using empirical data to learn autoregressive latent priors, which improves the model's performance. By replacing the standard Gaussian distribution with these self-predicted priors, EVA reduces the gap between the prior and posterior distributions, enhancing the quality of generated sequences. Experiments show that EVA produces high-quality images and sounds quickly, competing well with other advanced models."}, 'zh': {'title': '经验变分自编码器：高效生成连续序列的创新框架', 'desc': '本文提出了一种经验变分自编码器（EVA），这是一个用于连续值序列的通用生成框架。EVA基于变分自编码器（VAE）的证据下界，通过从训练数据中经验性地学习自回归潜在先验，仅需在VAE上添加一个线性层即可实现。通过用自我预测的先验替代传统的标准高斯约束，EVA显著减小了潜在分布的先验与后验之间的差距，从而实现高保真度的序列数据生成。大量在图像和声音合成上的实验表明，EVA在生成质量上与自回归扩散基线相当，同时推理速度更快。'}}}, {'id': 'https://huggingface.co/papers/2609.32510', 'title': 'GeoCR: Learning a Generalist Cloud Removal Prior from Heterogeneous Observations', 'url': 'https://huggingface.co/papers/2609.32510', 'abstract': 'Abstract  Cloud removal methods are typically specialized to individual datasets and input configurations, limiting reuse across sensors, spectral bands, and observation settings. We introduce GeoCR, a generalist model that unifies RGB-only-based CR and multispectral-based CR from single- or multi-temporal cloudy observations, with optional SAR guidance, within a single network. To accommodate different spectral and sensing domains, compact input and output stems extend a pretrained RGB autoencoder while keeping its encoder and decoder trunks frozen. This shared latent interface enables a single flow transformer to jointly model clean RGB and non-RGB latents, conditioned on separate cloudy-observation streams and optional SAR tokens. Through joint pretraining on the training splits of ten datasets comprising 883,331 cloud-free target images, GeoCR learns a shared cloud removal prior across these heterogeneous configurations. The same pretrained checkpoint supports direct inference without dataset-specific fine-tuning and efficient adaptation through low-rank adaptation (LoRA). We evaluate GeoCR against general image restoration and cloud removal methods on test splits of the contributing datasets under full-band and RGB-only settings. GeoCR achieves the best FID and DISTS on full-band SEN12MS-CR and Sen2_MTC_New and RGB-only CUHK-CR2, outperforming existing models and demonstrating the effectiveness of a reusable generative model across diverse settings.', 'score': 1, 'issue_id': 3378, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '99d6ce453c84e0ec', 'authors': ['Jeonghyeok Do', 'Munchurl Kim'], 'affiliations': ['Korea Advanced Institute of Science and Technology (KAIST)'], 'pdf_title_img': 'assets/pdf/title_img/2609.32510.jpg', 'data': {'categories': ['#cv', '#architecture', '#training', '#dataset'], 'emoji': '☁️', 'ru': {'title': 'Универсальная модель удаления облаков для разнородных спутниковых снимков', 'desc': 'В работе представлена GeoCR — универсальная генеративная модель для удаления облаков из спутниковых снимков, работающая с RGB и мультиспектральными данными из одного или нескольких временных срезов с опциональной поддержкой SAR. Архитектура использует замороженный предобученный RGB автокодер с компактными адаптивными слоями для разных спектральных диапазонов, что позволяет единому трансформеру потоков совместно моделировать чистые RGB и не-RGB признаки. Модель прошла совместное предобучение на 883,331 безоблачных изображениях из десяти датасетов, что позволило ей выучить универсальный приор удаления облаков для различных конфигураций датчиков. GeoCR показывает лучшие результаты по метрикам FID и DISTS на нескольких бенчмарках и поддерживает эффективную адаптацию через LoRA без необходимости переобучения на каждом новом датасете.'}, 'en': {'title': 'GeoCR: A Universal Cloud Removal Solution for Diverse Data', 'desc': 'GeoCR is a versatile cloud removal model that integrates both RGB and multispectral data, allowing it to work across various datasets and sensor types. It utilizes a pretrained RGB autoencoder, maintaining its encoder and decoder while extending input and output stems to handle different spectral domains. By employing a shared latent interface and a flow transformer, GeoCR can effectively model clean images from cloudy observations, with optional guidance from SAR data. The model demonstrates superior performance in cloud removal tasks, achieving the best scores on multiple datasets without needing specific fine-tuning, showcasing its adaptability and efficiency.'}, 'zh': {'title': 'GeoCR：通用云去除模型的创新', 'desc': '本文介绍了一种名为GeoCR的通用云去除模型，它能够统一处理基于RGB和多光谱的云去除任务。GeoCR通过共享潜在接口，结合了不同传感器和观测条件下的云观测数据，支持单一网络的高效处理。该模型在十个数据集上进行联合预训练，学习到了一种共享的云去除先验，能够在不同配置下有效应用。GeoCR在多种测试条件下表现优异，超越了现有模型，展示了其在多样化设置中的可重用性。'}}}, {'id': 'https://huggingface.co/papers/2610.04211', 'title': 'CurveCodec 2: Skeleton-agnostic animation compression with a learned entropy model', 'url': 'https://huggingface.co/papers/2610.04211', 'abstract': "Abstract  Skeletal motion is stored as every joint's transform at every frame, yet most of it is implied by the body rather than by what the motion is about. Compression is one way to ask what a motion must still say once the body is known, and a production codec must answer it for any skeleton with a stated error bound. Our earlier codec, CurveCodec, matched the mean error of ACL, the production library of modern game engines, with a learned prior over sparse anchors, but not ACL's worst case, and it counted its payload as floats rather than bits. Here we ask where the redundancy of skeletal motion lies and which part of a codec a learned model should take over. Measurements give three answers. At production precision the largest saving comes from predicting each quantized curve from its own past, the second from choosing per joint, in closed loop through the hierarchy, which samples not to code. On the gaps such an encoder leaves, a nearest-neighbour oracle over millions of training samples is no better than linear interpolation, and no learned in-betweener we tried paid for itself. What a network does learn is the distribution of the residuals the codec must send. CurveCodec 2 codes every sub-track as a curve in the log map, quantized in closed loop and thinned to rate-distortion-selected keys, with residuals entropy-coded under a small learned model whose integer inference is bit-exact across platforms. Two contracts are verified on every decoded clip: ACL's own worst case per joint within a stated tolerance, or ACL's mean error per clip. On a held-out test side of 4,472 clips from 33 datasets, CurveCodec 2 needs 0.37x ACL's bytes at ACL's default precision of 0.01 cm under the worst-case contract and 0.22x at 0.1 cm under the mean contract, decodes on one CPU core, and transfers without retraining to a species absent from training. Project page: https://rubbly.cn/publications/curvecodec/", 'score': 1, 'issue_id': 3378, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '594a5502d9342226', 'authors': ['Mingyi Shi', 'Huancheng Lin', 'Xuelin Chen', 'Taku Komura'], 'affiliations': ['Adobe Research', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.04211.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Учимся сжимать скелетную анимацию, предсказывая остатки нейросетью', 'desc': 'Статья посвящена сжатию данных скелетной анимации, где авторы анализируют, какую избыточность содержат движения скелета при известной его структуре. Они предлагают CurveCodec 2 — кодек на основе машинного обучения, который представляет каждую кривую движения в логарифмическом пространстве с квантованием и прореживанием ключевых кадров. Модель нейронной сети обучается кодировать остатки (residuals) кодека под энтропийным кодированием, что обеспечивает точное битовое представление при декодировании на разных платформах. На тестовом наборе из 4472 клипов CurveCodec 2 достигает 0.37x сжатия по сравнению со стандартной библиотекой ACL при сохранении гарантированной точности воспроизведения движения.'}, 'en': {'title': 'Efficient Skeletal Motion Compression with CurveCodec 2', 'desc': 'This paper presents CurveCodec 2, an advanced codec for compressing skeletal motion data by focusing on the redundancy inherent in the motion. It improves upon the previous CurveCodec by utilizing learned models to predict motion curves based on their historical data, significantly reducing the amount of data needed for storage. The codec achieves high compression rates while maintaining accuracy, meeting or exceeding the performance of existing libraries like ACL. Additionally, it demonstrates the ability to generalize across different skeletons without requiring retraining, making it versatile for various applications.'}, 'zh': {'title': '提升骨骼运动编码效率的创新方法', 'desc': '这篇论文讨论了一种新的骨骼运动编码方法，称为CurveCodec 2。它通过学习模型来减少骨骼运动数据的冗余，从而提高压缩效率。研究表明，预测每个量化曲线的过去信息可以显著节省存储空间。CurveCodec 2在多个数据集上测试，显示出比现有方法更低的字节需求，同时保持高精度。'}}}, {'id': 'https://huggingface.co/papers/2610.06184', 'title': 'Arm-wise Compositional Generalization in Dual-Arm Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.06184', 'abstract': 'Abstract  Generalization in multi-arm collaboration can be studied as composing familiar atomic skills in new ways across arms. However, existing evaluations offer limited insight into which training and architectural choices support this ability under different coordination requirements. We introduce ACG-Bench, a benchmark for Arm-wise Compositional Generalization that provides a common testbed for studying skill recomposition in dual-arm policies. It contains 23 task--condition pairs across 8 task families, with 6 in-domain conditions and 17 unseen compositions covering reordering, synchronization, their combination, and cross-task composition. All methods receive the same per-arm atomic prompts, and success requires achieving the task goal while satisfying physical milestones and specified order or timing constraints. Using π_{0.5} as a common vision-language-action backbone, we compare representative data-augmentation and architectural strategies with shared source data and a common evaluation protocol. Our architectural study examines arm-token grouping, skill-specific LoRA adapters (SkillLoRA), and arm-wise attention (AWA), highlighting the complementarity of skill-conditioned parameters and attention structure. Combining these choices yields AE-VLA, which achieves 21.53\\% generalization success in simulation, compared with 2.94\\% for Single π_{0.5}, 3.06\\% for MA-VLA, and 5.53\\% for two independently controlled π_{0.5} policies. On physical SO101 robots, AE-VLA reaches 39.00\\% mean success across five unseen conditions, compared with 10.00\\% for the strongest baseline. These findings provide empirical guidance for designing dual-arm policies that generalize beyond fixed training routines.', 'score': 1, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '2dfca8befca95fe8', 'authors': ['Zaibin Zhang', 'Binghao Ran', 'Yuhan Wu', 'Zhongbo Zhang', 'Yifan Wang', 'Junwei Jiang', 'Junlan Xiao', 'Wangcheng Shi', 'Li Kang', 'Yiran Qin', 'Zhenfei Yin', 'Lijun Wang', 'Huchuan Lu'], 'affiliations': ['Dalian University of Technology', 'Evolving Machines Lab', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.06184.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#robotics', '#benchmark', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Композиционное обобщение в двурукой робототехнике через структурированные навыки', 'desc': 'В работе представлен бенчмарк ACG-Bench для оценки способности двурукой робототехнической системы обобщать базовые навыки и пере組ывать их в новых комбинациях. Исследование сравнивает различные архитектурные решения для vision-language-action моделей, включая методы группировки токенов рук, адаптеры LoRA для отдельных навыков и механизм внимания, ориентированный на конкретную руку. Авторы демонстрируют, что комбинация этих компонентов (модель AE-VLA) значительно улучшает обобщение на невидимые композиции задач, включая переорdering и синхронизацию. Полученные результаты показывают, что правильный выбор архитектуры критичен для обучения политик, которые могут справляться с новыми комбинациями известных навыков.'}, 'en': {'title': 'Enhancing Dual-Arm Robotics: ACG-Bench for Skill Recomposition', 'desc': 'This paper introduces ACG-Bench, a benchmark designed to evaluate how well multi-arm robotic systems can generalize skills in new ways. It focuses on the ability to recombine atomic skills across different tasks and conditions, providing a structured way to test these capabilities. The study compares various training strategies and architectural choices, such as arm-token grouping and skill-specific adapters, to enhance performance in dual-arm policies. Results show that the proposed AE-VLA model significantly outperforms existing methods in both simulation and real-world robot tasks, demonstrating effective generalization beyond the training data.'}, 'zh': {'title': '提升多臂协作的泛化能力', 'desc': '本论文研究了多臂协作中的泛化能力，重点在于如何将熟悉的基本技能以新方式组合应用于不同的任务。我们提出了ACG-Bench，这是一个用于臂级组合泛化的基准测试平台，包含23个任务-条件对，涵盖了多种任务类型和未见组合。通过比较不同的数据增强和架构策略，我们发现技能条件参数和注意力结构的互补性对提高泛化能力至关重要。最终，AE-VLA模型在模拟环境中实现了21.53%的泛化成功率，显著优于其他基线模型，提供了设计双臂策略的实证指导。'}}}, {'id': 'https://huggingface.co/papers/2610.06850', 'title': 'InterMimicGen: Scaling Humanoid Loco-Manipulation through Self-Evolving Motion Imitation', 'url': 'https://huggingface.co/papers/2610.06850', 'abstract': 'Abstract  Captured human-object interactions provide rich supervision for humanoid loco-manipulation, but they are sparse, heterogeneous, and not directly executable by robots. We introduce InterMimicGen, a self-evolving motion-imitation framework in which robot motion data and a tracking policy improve each other. First, we consolidate motion-captured human-object interaction datasets and retarget them into humanoid robot references while preserving whole-body coordination and dexterous hand-object relationships. This produces a large and diverse humanoid robot reference collection for dexterous whole-body loco-manipulation. Second, we train a physics-based generalist tracker that executes these references in simulation on a humanoid with dexterous hands, covering a scale and diversity beyond prior humanoid tracking systems for loco-manipulation. Third, we close a data flywheel: each round makes small, task-preserving changes to where an interaction takes place and how the body performs it, fine-tunes the tracker on them, and keeps only the variants whose simulated execution completes the task, which seed the next round. With more iterations, these small edits compound into broader coverage around the sparse original demonstrations while preserving task semantics and motion quality. Experiments show contact-preserving retargeting across robot configurations, broad tracking with a single generalist policy, executable motions that keep growing over augmentation rounds, and transfer to real robots. InterMimicGen provides a unified path from heterogeneous human demonstrations to a continually expanding motion resource for humanoid robot learning.', 'score': 1, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'e046b4d05b79748b', 'authors': ['Yucheng Zhang', 'Sirui Xu', 'Jinhong Li', 'Liuyu Bian', 'Anatulya Nandi', 'Derek Zhang', 'Xiangchen Liu', 'Xueting Li', 'Umar Iqbal', 'Yu-Xiong Wang', 'Liang-Yan Gui'], 'affiliations': ['NVIDIA', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.06850.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Самоэволюционирующее обучение роботов через взаимное совершенствование данных и политики', 'desc': 'В работе представляется InterMimicGen — фреймворк для обучения гуманоидных роботов манипуляции объектами на основе захватов движений человека. Авторы разработали метод переноса (retargeting) человеческих взаимодействий с объектами на робота, сохраняя при этом координацию всего тела и ловкость манипулирования рукой. Система использует цикл обратной связи: физически обоснованная политика отслеживания (tracking policy) выполняет эталонные движения в симуляции, а затем автоматически генерирует вариации этих движений с целью расширить разнообразие обучающих данных. Благодаря итеративному процессу аугментации данных система постоянно расширяет репертуар выполняемых движений, сохраняя качество и семантику исходных демонстраций, и успешно переносит навыки на реальных роботов.'}, 'en': {'title': 'Evolving Robot Motion through Human Interaction Mimicry', 'desc': "The paper presents InterMimicGen, a framework designed to enhance humanoid robot loco-manipulation by leveraging human-object interaction data. It consolidates motion-captured datasets and retargets them for humanoid robots, ensuring that the coordination and hand-object interactions are maintained. A physics-based tracker is trained to execute these motions in simulation, allowing for a diverse range of humanoid movements. The framework employs a data flywheel approach, iteratively refining the motion data and expanding the robot's capabilities while preserving the quality and semantics of the tasks."}, 'zh': {'title': '自我进化的运动模仿：人形机器人学习的新路径', 'desc': '本论文介绍了一种名为InterMimicGen的自我进化运动模仿框架，旨在改善人形机器人在复杂环境中的运动能力。通过整合人类与物体交互的数据集，并将其转化为机器人可执行的参考动作，保持全身协调性和灵巧的手部操作关系。该框架还训练了一种基于物理的通用跟踪器，能够在模拟环境中执行这些参考动作，并通过不断迭代优化跟踪器的性能。实验结果表明，该方法能够有效地扩展机器人运动资源，并实现从人类示范到机器人学习的统一路径。'}}}, {'id': 'https://huggingface.co/papers/2609.34227', 'title': 'When Does Selection Replace Extraction? A Pre-Registered Test of Agent Memory with a Typed Decision Model', 'url': 'https://huggingface.co/papers/2609.34227', 'abstract': "Abstract  Does conversational memory need LLM-extracted facts, or is selecting the right raw turns enough? Published results disagree. Extraction-based systems report gains from distilled facts. Recent studies find raw history with good ranking does as well, but disagree about whether ranking matters. We ran a pre-registered study on held-out LoCoMo conversations and LongMemEval. At a tight budget on LoCoMo, raw turns selected by a single call to Jev, a typed decision model, are non-inferior to an LLM-extraction memory (one-sided 95% bound -3.0 points against a -5-point margin). Blind human grading narrows the margin but does not change the result. Raw turns cost 3,061 times less to write, and the result holds with a second answer model. Within this study, reranking's gain shrinks as the budget grows. It adds 17.4 points on LoCoMo and 9.1 on LongMemEval when three of 30 candidates are kept. At generous budgets it adds 1.5 and 1.1, and extraction systems are more accurate. This suggests why published results disagree. At matched context, Jev selects as accurately as an LLM reranker (non-inferiority bound -2.0) at a third of the latency, and more accurately than a multi-call graph traversal. Reranking lowers correct abstention. Plans, code and graded answers are released.", 'score': 0, 'issue_id': 3380, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': 'c75d2e4c1bae1270', 'authors': ['Rishabh Sharma', 'Rishika Lall'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2609.34227.jpg', 'data': {'categories': ['#long_context', '#open_source', '#benchmark', '#data'], 'emoji': '💾', 'ru': {'title': 'Сырая история важнее, чем извлечённые факты: эффективный выбор контекста без LLM', 'desc': 'В статье исследуется вопрос о том, нужны ли языковым моделям извлечённые факты для управления контекстом диалога или достаточно правильно выбрать исходные реплики из истории. Авторы провели контролируемое исследование и показали, что простой выбор сырых текстов с помощью специализированной модели Jev работает не хуже, чем системы с извлечением фактов LLM, но при этом требует в 3000 раз меньше вычислительных ресурсов. Результаты объясняют противоречия в опубликованных работах: переранжирование даёт большой прирост при ограниченном бюджете контекста, но его эффект уменьшается с увеличением доступного места. Модель Jev достигает точности, сопоставимой с LLM-переранжировщиком, но работает в три раза быстрее.'}, 'en': {'title': 'Raw Turns vs. LLM Facts: Cost-Effective Memory in Conversational AI', 'desc': 'This paper investigates whether conversational memory systems benefit more from facts extracted by large language models (LLMs) or from selecting relevant raw conversation turns. The study finds that using a simple decision model, Jev, to select raw turns is as effective as LLM-extracted memory, especially when considering cost and efficiency. Reranking improves performance but its benefits diminish with larger budgets, suggesting that simpler methods can be competitive. The results highlight the importance of context and selection methods in conversational AI, providing insights into why previous studies have shown conflicting results.'}, 'zh': {'title': '对话记忆：原始对话胜过提取事实', 'desc': '这篇论文探讨了对话记忆是否需要从大型语言模型（LLM）中提取的事实，还是仅仅选择合适的原始对话就足够。研究表明，使用原始对话的系统在成本上更具优势，且在某些情况下与提取系统的表现相当。通过对LoCoMo对话和LongMemEval的预注册研究，发现原始对话的选择在预算紧张时表现良好。研究结果表明，重排序的收益在预算增加时会减小，且在高预算下提取系统的准确性更高。'}}}, {'id': 'https://huggingface.co/papers/2610.03123', 'title': 'Foresight: planning future perception in streaming VLMs without retraining', 'url': 'https://huggingface.co/papers/2610.03123', 'abstract': 'Abstract  Existing streaming vision-language models (VLMs) continuously perceive and reason over visual streams, but their computational pathways remain fixed throughout inference. Consequently, they cannot adapt computation to evolving scene dynamics, where different future events demand different levels and forms of perception. We show that streaming VLMs inherently possess the ability to anticipate the immediate future, and leverage this capability to dynamically configure future computation in a training-free manner. Realizing such anticipatory computation, however, is very challenging: future anticipation must be sufficiently reliable to guide computation, planning must run concurrently with streaming inference, and online reconfiguration must incur negligible overhead. To address these challenges, we introduce FORESIGHT, a dual-stream architecture comprising two Siamese LLMs with shared weights, input encoders, and KV cache. The first LLM continuously processes incoming tokens, while the second runs ahead of the stream to anticipate future context, plan future computation, and generate task responses without interrupting streaming inference. Each plan decides when to reason next, what to check then, and how densely to sample, keeping transient evidence separate from persistent control. The resulting computation plan is executed online through an efficient reconfiguration protocol with schemaguided decoding and lightweight diff-based updates, enabling dynamic adaptation with low overhead. With a frozen Qwen3-VL-8B backbone, FORESIGHT achieves 23.0 mean joint F1 on OmniPro Online evaluation beating strongest trained baseline by 9.5%, while improving the backbone by 6.7 on StreamingBench and 15.4 on OVO-Bench, with the largest gain of 18.7 when evidence arrives later in the video stream. Our source code will be made publicly available.', 'score': 0, 'issue_id': 3379, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '31d653098c749661', 'authors': ['Ashok Prasad Neupane', 'Dipan Bartaula', 'Ankit Belbase', 'Saugat Adhikari', 'Samip Ghimire', 'Saroj Poudel', 'Binod Bhattarai', 'Danda Pani Paudel'], 'affiliations': ['INSAIT, Sofia University St. Kliment Ohridski, Bulgaria', 'Independent Researcher', 'NAAMII, Nepal', 'University College London, UK', 'University of Aberdeen, UK'], 'pdf_title_img': 'assets/pdf/title_img/2610.03123.jpg', 'data': {'categories': ['#open_source', '#optimization', '#cv', '#video', '#architecture', '#inference', '#multimodal'], 'emoji': '🔮', 'ru': {'title': 'Предсказание будущего для адаптивных вычислений в потоковых видеомоделях', 'desc': 'В работе представлена система FORESIGHT для потоковых vision-language моделей, которая динамически адаптирует вычисления в зависимости от развития сцены. Модель использует двухпоточную архитектуру с двумя Siamese LLM, где первый обрабатывает входящие токены, а второй предсказывает будущий контекст и планирует вычисления. Система генерирует планы действий, определяющие когда рассуждать, что проверять и как плотно семплировать видео, без прерывания потокового вывода. Подход не требует обучения и достигает значительного улучшения производительности на нескольких бенчмарках, особенно когда доказательства появляются позже в видеопотоке.'}, 'en': {'title': 'Anticipate and Adapt: FORESIGHT in Streaming Vision-Language Models', 'desc': "This paper presents FORESIGHT, a novel streaming vision-language model (VLM) that enhances the ability to adaptively process visual streams by anticipating future events. Unlike traditional VLMs, FORESIGHT employs a dual-stream architecture with two Siamese large language models (LLMs) that work in tandem: one processes incoming data while the other predicts future contexts and plans computations. This anticipatory approach allows the model to dynamically adjust its reasoning and sampling strategies based on evolving scene dynamics, all while maintaining efficient online performance. The results demonstrate significant improvements in performance metrics, showcasing FORESIGHT's capability to outperform existing models in real-time scenarios."}, 'zh': {'title': '动态适应的流媒体视觉语言模型', 'desc': '现有的流媒体视觉语言模型（VLMs）在推理过程中计算路径是固定的，无法适应不断变化的场景动态。本文提出了一种名为FORESIGHT的双流架构，利用两个共享权重的Siamese LLMs来动态配置未来的计算。该模型能够在流媒体推理的同时，预测未来的上下文并生成任务响应，从而实现高效的在线重配置。实验结果表明，FORESIGHT在多个基准测试中表现优异，显著提高了模型的适应性和性能。'}}}, {'id': 'https://huggingface.co/papers/2610.02480', 'title': 'MEA: A Reward-Driven Multi-Agent System for Faithful Model Explanations', 'url': 'https://huggingface.co/papers/2610.02480', 'abstract': 'Abstract  Recent years have seen the employment of a plethora of machine learning (ML) models in high-stakes domains, but they remain largely opaque to the practitioners who act on their predictions. While post-hoc explanation methods offer a lens into this model behavior, wielding them effectively demands expertise most domain experts lack: navigating high-dimensional outputs, selecting the best explanations, and synthesizing evidence across disparate tools. To this end, we present MEA, a multi-agent framework that removes the explanation knowledge barrier entirely: a Proposer agent selects and configures explanation tools based on the question and modality, while an Actor agent is optimized end-to-end against faithfulness, transforming the outputs into natural language explanations grounded in model behavior across tabular, text, and vision modalities. Further, we introduce diverse question types spanning feature attribution, counterfactual reasoning, and spurious feature detection, each paired with a perturbation-based faithfulness metric. We find that frontier LLMs systematically produce unfaithful explanations. By optimizing against faithfulness rewards augmented with a modality-adaptive penalty, MEA consistently outperforms post hoc explainers, agentic, and closed-source baselines across six datasets, with reward-driven optimization yielding faithfulness gains of +28% (tabular), +21% (text), and +34% (vision) over the untrained backbone. More broadly, our findings suggest that AI agents themselves can serve as a scalable, adaptable interface to ML explainability, opening a path toward natural-language explainability that generalizes beyond the fixed, single-purpose tools that have long defined the field.', 'score': 0, 'issue_id': 3378, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e8770993f2b9f0eb', 'authors': ['Yuyang Cheng', 'Raghav Kaushik Ravi', 'Srivarshinee Sridhar', 'Sriparna Saha', 'Akash Ghosh', 'Chirag Agarwal'], 'affiliations': ['Indian Institute of Technology, Patna', 'University of Virginia', 'Vellore Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.02480.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Агентные системы как универсальный интерфейс для интерпретируемости моделей', 'desc': 'В работе представлена система MEA — многоагентный фреймворк, который автоматизирует процесс объяснения предсказаний моделей машинного обучения на основе LLM. Система использует агента-предложителя для выбора подходящих методов интерпретируемости и агента-исполнителя, который оптимизируется для создания верных объяснений на естественном языке. Авторы вводят метрики верности, основанные на возмущениях, и тестируют различные типы вопросов: атрибуция признаков, контрфактуальное рассуждение и обнаружение ложных корреляций. Экспериментально показано, что MEA значительно превосходит существующие методы объяснений на табличных данных, текстах и изображениях, достигая прироста верности на 21-34%.'}, 'en': {'title': 'Bridging the Gap: AI Agents for Clearer ML Explanations', 'desc': "This paper introduces MEA, a multi-agent framework designed to enhance the explainability of machine learning models in complex domains. It features a Proposer agent that selects and configures explanation tools based on specific questions and data types, while an Actor agent generates natural language explanations that are faithful to the model's behavior. The framework addresses various explanation types, including feature attribution and counterfactual reasoning, and employs a faithfulness metric to ensure the reliability of the explanations. The results show that MEA significantly outperforms existing explanation methods, demonstrating that AI agents can effectively bridge the gap between complex model outputs and user-friendly explanations."}, 'zh': {'title': '机器学习可解释性的未来：MEA框架', 'desc': '近年来，机器学习模型在高风险领域的应用越来越广泛，但这些模型的预测结果对实践者来说仍然不够透明。为了解决这一问题，我们提出了MEA框架，它通过多代理系统消除了对解释知识的障碍。该框架中的提议者代理根据问题和模态选择和配置解释工具，而执行者代理则优化输出的可信度，将结果转化为自然语言解释。我们的研究表明，MEA在多个数据集上优于传统的后期解释工具，提供了更高的可信度和更好的可解释性。'}}}, {'id': 'https://huggingface.co/papers/2610.03617', 'title': 'DEPICT: Scoring Text-to-Image Alignment by Answer Agreement', 'url': 'https://huggingface.co/papers/2610.03617', 'abstract': 'Abstract  Image-text alignment is a core problem in computer vision with applications in caption evaluation, hallucination detection, data curation, and the benchmarking of text-to-image (T2I) generators. As T2I models improve, benchmarking has become demanding, requiring metrics capable of finding a series of issues like missing objects, swapped attributes, miscounts, and ignored negations. Recent work addresses this by fine-tuning evaluators on preference data or by prompting a vision-language model, either holistically with the caption or with decomposed verification questions. However, existing approaches fall short: fine-tuned metrics remain bound to one backbone and training distribution; holistic metrics miss fine-grained details; and decomposed metrics rely on a fixed-YES assumption that penalizes faithful images whenever that assumption fails. In contrast, we propose DEPICT, a training-free metric that replaces fixed reference answers with expected agreement between image-based and caption-only answers, weighting questions by how decisively the caption determines them. By replacing fixed references, our agreement rule increases negation accuracy from 19% to 88%. To recover the context lost during decomposition, DEPICT merges this agreement score with a holistic score. We evaluate DEPICT on five benchmarks and eleven backbones from three model families and find that it surpasses all training-free metrics and exceeds fine-tuned evaluators on two out of three human-correlation benchmarks.', 'score': 0, 'issue_id': 3378, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'd7b02b60dee1ed14', 'authors': ['Vasco Ramos', 'Sandra Godinho Silva', 'Joao Magalhaes', 'Ricardo Rei', 'Pedro Henrique Martins'], 'affiliations': ['NOVALINCS, NOVA University of Lisbon', 'Sword Health'], 'pdf_title_img': 'assets/pdf/title_img/2610.03617.jpg', 'data': {'categories': ['#cv', '#multimodal', '#hallucinations', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Оценка выравнивания изображений и текста через согласие вместо фиксированных ответов', 'desc': 'В статье предложен метод DEPICT для оценки соответствия изображений и текстовых описаний в моделях генерации изображений. Вместо использования фиксированных эталонных ответов, метод рассчитывает ожидаемое согласие между ответами на основе изображения и только текста, взвешивая вопросы по тому, насколько решительно текст их определяет. Подход объединяет оценку согласия с голистической оценкой для восстановления контекста и не требует обучения на размеченных данных. Экспериментальные результаты показывают, что DEPICT превосходит все существующие метрики без обучения и даже превышает производительность обученных оценивателей на большинстве бенчмарков.'}, 'en': {'title': 'DEPICT: Revolutionizing Image-Text Alignment Metrics', 'desc': 'This paper addresses the challenge of aligning images and text in computer vision, which is crucial for tasks like evaluating captions and detecting errors in generated images. The authors introduce a new metric called DEPICT, which improves upon existing methods by eliminating fixed reference answers and instead focusing on the expected agreement between image and caption responses. This innovative approach significantly enhances the accuracy of negation detection and retains important contextual information. DEPICT outperforms other training-free metrics and even surpasses some fine-tuned evaluators in various benchmarks, demonstrating its effectiveness in image-text alignment tasks.'}, 'zh': {'title': 'DEPICT：无训练的图像文本对齐评估指标', 'desc': '图像与文本对齐是计算机视觉中的一个核心问题，涉及到图像描述评估、幻觉检测、数据整理等应用。随着文本到图像生成模型的进步，评估标准变得更加复杂，需要能够识别缺失物体、属性交换、计数错误和忽略否定等问题的指标。现有方法如微调评估器或使用视觉-语言模型进行提示，但存在一些局限性，如微调指标受限于特定的基础模型和训练分布。我们提出了DEPICT，这是一种无训练的指标，通过替换固定参考答案为图像和文本答案之间的预期一致性，显著提高了否定准确率，并在多个基准测试中表现优于现有的无训练指标。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (16)', '#agi (1)', '#alignment (4)', '#architecture (16)', '#audio (2)', '#benchmark (31)', '#cv (8)', '#data (1)', '#dataset (11)', '#diffusion (7)', '#ethics (2)', '#games (2)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference (15)', '#interpretability (3)', '#leakage (1)', '#long_context (7)', '#low_resource', '#machine_translation', '#math (4)', '#multilingual (2)', '#multimodal (17)', '#open_source (10)', '#optimization (17)', '#plp (2)', '#rag (3)', '#reasoning (13)', '#rl (2)', '#rlhf (2)', '#robotics (8)', '#science (4)', '#security (3)', '#small_models (5)', '#story_generation', '#survey (2)', '#synthetic (5)', '#training (29)', '#transfer_learning (2)', '#video (10)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }
