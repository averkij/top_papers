    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

            flags.forEach(flag => {

                flag.addEventListener('click', () => {

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.05608', 'title': 'Kandinsky 6.0 Video: Foundation Models for Synchronized Video and Audio Generation', 'url': 'https://huggingface.co/papers/2610.05608', 'abstract': 'Abstract  We present Kandinsky 6.0 Video, a family of foundation diffusion models for synchronized text-to-audio-video generation, comprising Kandinsky 6.0 Video Lite (3B parameters) and Kandinsky 6.0 Video Pro (29B parameters). Both models generate 5-second video clips with synchronized 44 kHz audio, including lip-sync, in text-to-audio-video (T2AV) and image-to-audio-video (I2AV) modes; a built-in super-resolution model raises the output resolution to Full-HD (1920times1080). Building on the video generation capabilities of Kandinsky 5.0, Kandinsky 6.0 Video employs a dual-stream CrossDiT architecture that connects a pretrained video stream and a newly trained audio stream through bidirectional cross-attention for temporal and semantic alignment. Our continuous pretraining strategy first trains the audio stream from scratch on large-scale audio corpora and then trains both streams jointly on paired audio-video data while preserving unimodal fidelity; pretraining is followed by supervised fine-tuning, reinforcement-learning-based post-training, and distillation. In side-by-side human evaluation, Kandinsky 6.0 Video Pro clearly outperforms its predecessor, Kandinsky 5.0 Video Pro, and remains competitive with leading audio-video generation models, particularly in speech quality. To accelerate open research and deployment in multimedia generation, we release the code, model checkpoints, and diffusers integration under the MIT license.', 'score': 113, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '265abad88bdcb329', 'authors': ['Team Kandinsky', 'Julia Agafonova', 'Bulat Akhmatov', 'Mikhail Aksyutin', 'Grigorii Alekseenko', 'Anastasia Aliaskina', 'Olga Androsova', 'Vladimir Arkhipkin', 'Anna Averchenkova', 'Alexander Belykh', 'Serafima Bocharova', 'Sofiya Bogakovskaya', 'Anton Bukashkin', 'Mark Bulygin', 'Kirill Buzygin', 'Irina Cheremnykh', 'Kirill Chernyshev', 'Mikhail Chernyshov', 'Vladimir Chernyy', 'David Chikovani', 'Georgy Daniltsev', 'Denis Dimitrov', 'Anna Dmitrienko', 'Vladimir Dokholyan', 'Sergey Emelyanov', 'Dmitry Ermilov', 'Georgii Fedorov', 'Polina Gavrilova', 'Nikolai Gerasimenko', 'Aleksandr Gordeev', 'Andrey Inozemtsev', 'Andrei Ivaniuta', 'Alexander Ivanov', 'Mikhail Karaev', 'Anastasiia Kargapoltseva', 'Ivan Kirillov', 'Nikita Kiselev', 'Valeria Kobenko', 'Yury Kolabushin', 'Denis Koposov', 'Anatoly Korobov', 'Vladimir Korviakov', 'Kirill Kozlov', 'Denis Krzhivokolskiy', 'Konstantin Kuklev', 'Alexander Kunitsyn', 'Sergey Kuzin', 'Vladislav Lakhtionov', 'Alexey Letunovskiy', 'Maxim Litvinov', 'Alexander Lyulkov', 'Georgy Makarov', 'Kirill Malakhov', 'Egor Malykh', 'Mikhail Mamaev', 'Dmitrii Mikhailov', 'Polina Mikhailova', 'Ivan Mikheev', 'Elizaveta Muromtseva', 'Nikolai Nazarkin', 'Tatiana Nikulina', 'Lev Novitskiy', 'Stanislav Onuchin', 'Nikita Osterov', 'Denis Parkhomenko', 'Anatoliy Parpara', 'Vladimir Polovnikov', 'Konstantin Reznikov', 'Azat Saginbaev', 'Nikita Samsonov', 'Alexander Sentsov', 'Nikita Shaimov', 'Artem Sherstyuk', 'Andrey Shutkin', 'Egor Silvestrov', 'Bulat Suleimanov', 'Matvey Suprunov', 'Sergey Taranov', 'Irina Tolstykh', 'Tatiana Trofimuk', 'Ilya Trushkin', 'Aleksandra Tsybina', 'Olga Varlashina', 'Viacheslav Vasilev', 'Ilya Vasiliev', 'Eugeny Vilisov', 'Sergey Yakubson', 'Konstantin Zakharov'], 'affiliations': ['Kandinsky Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.05608.jpg', 'data': {'categories': ['#architecture', '#small_models', '#open_source', '#video', '#training', '#audio', '#diffusion', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Синхронная генерация видео и аудио через двухпоточную диффузионную архитектуру', 'desc': 'Kandinsky 6.0 Video — это семейство диффузионных моделей для одновременной генерации видео и аудио из текста или изображения. Модели используют двухпоточную архитектуру CrossDiT, которая объединяет предварительно обученный видеопоток с новым аудиопотоком через перекрёстное внимание для синхронизации. Обучение проводится в несколько этапов: предварительная подготовка на больших корпусах данных, совместное обучение обоих потоков, затем финтюнинг с учителем, постобучение методом обучения с подкреплением и дистилляция. Модели генерируют высокое качество синтезированной речи и синхронизации движений губ, превосходя предыдущую версию и конкурируя с лучшими существующими системами в этой области.'}, 'en': {'title': 'Revolutionizing Multimedia Generation with Kandinsky 6.0 Video', 'desc': 'Kandinsky 6.0 Video introduces advanced diffusion models for generating synchronized text-to-audio-video content. It features two versions, Lite and Pro, with varying parameters, capable of producing 5-second video clips with high-quality audio and lip-sync. The model utilizes a dual-stream CrossDiT architecture for effective alignment of audio and video, enhancing the generation process. Through a comprehensive training strategy, including pretraining and fine-tuning, Kandinsky 6.0 Video Pro surpasses its predecessor in performance and is competitive with other leading models in the field.'}, 'zh': {'title': 'Kandinsky 6.0 视频生成的新时代', 'desc': 'Kandinsky 6.0 Video 是一系列基础扩散模型，专注于同步的文本到音频视频生成。它包括两个版本：Kandinsky 6.0 Video Lite 和 Kandinsky 6.0 Video Pro，分别具有3B和29B参数，能够生成5秒的视频片段，并同步44 kHz音频。该模型采用双流CrossDiT架构，通过双向交叉注意力实现时间和语义的对齐，提升了视频生成的质量。通过持续的预训练和监督微调，Kandinsky 6.0 Video Pro在语音质量上明显优于前作，并与其他领先的音频视频生成模型竞争。'}}}, {'id': 'https://huggingface.co/papers/2610.04198', 'title': 'ALoDLM: Adaptively Looped Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.04198', 'abstract': 'Abstract  Diffusion language models (DLMs) enable fast generation by predicting multiple tokens in parallel, but their practical adoption remains limited by a persistent quality gap relative to comparably sized autoregressive (AR) models. We attribute this gap to a computation-difficulty mismatch: within a partially observed sequence, some unknown tokens are easy to predict, while others require substantially more computation. Existing DLMs nevertheless apply uniform computational depth to all unknown positions at each denoising step. We introduce ALoDLM, which replaces uniform computation with token-adaptive latent recurrence. At each denoising step, ALoDLM iteratively refines latent representations and allocates computation according to token difficulty. Tokens ready to commit are fed back as discrete context, while unresolved tokens retain and further refine their latent states through additional recurrent passes. To learn token prediction and computation allocation jointly, we formulate token-wise computation schedules as latent variables and derive a conditional negative evidence lower bound (NELBO). We train ALoDLM at 1.7B and 8B parameter scales. Across eleven benchmarks, ALoDLM outperforms all evaluated DLMs and the corresponding AR baselines in average benchmark score at both scales. ALoDLM also retains fast parallel decoding, yielding a strong quality-efficiency trade-off among evaluated autoregressive and diffusion models under optimized inference engines.', 'score': 55, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '85a8714f5abcbd49', 'authors': ['Liancheng Fang', 'Zhuowei Li', 'Youngeun Kim', 'Tianchen Zhao', 'Rajat Koner', 'Jiaye Wu', 'Linghan Xu', 'Xuanbai Chen', 'Xiang Xu', 'Zheng Zhang', 'Jakub Zablocki', 'Nishant Sankaran', 'Yifan Xing'], 'affiliations': ['Amazon AGI', 'Korea University', 'University of Illinois Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2610.04198.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#inference', '#diffusion'], 'emoji': '⚡', 'ru': {'title': 'Адаптивное распределение вычислений в диффузионных языковых моделях', 'desc': 'В статье предлагается ALoDLM — модель диффузионного языка, которая решает проблему разного уровня сложности предсказания различных токенов при параллельной генерации. Вместо применения одинаковой глубины вычислений к всем неизвестным позициям, модель адаптивно распределяет вычислительные ресурсы в зависимости от сложности предсказания каждого токена. Алгоритм использует рекуррентное уточнение скрытых представлений: готовые токены возвращаются как дискретный контекст, а сложные токены проходят дополнительные итерации. Для обучения совместного распределения вычислений и предсказания токенов авторы формулируют вычислительные расписания как латентные переменные и выводят условную нижнюю границу вариационной оценки (NELBO).'}, 'en': {'title': 'Adaptive Computation for Enhanced Language Modeling', 'desc': 'This paper introduces ALoDLM, a new type of diffusion language model that improves the quality of token generation by adapting the amount of computation based on the difficulty of predicting each token. Unlike traditional models that apply the same computational effort to all tokens, ALoDLM uses a token-adaptive approach, allowing easier tokens to be processed quickly while more complex tokens receive additional computational resources. The model refines latent representations iteratively and uses a novel method to schedule computation, which is learned alongside token prediction. ALoDLM demonstrates superior performance on various benchmarks compared to existing diffusion and autoregressive models, achieving a balance between quality and efficiency.'}, 'zh': {'title': '智能计算，提升生成质量', 'desc': '扩散语言模型（DLMs）通过并行预测多个标记实现快速生成，但与同等规模的自回归（AR）模型相比，其实际应用受到质量差距的限制。我们认为这种差距源于计算难度的不匹配：在部分观察序列中，某些未知标记容易预测，而其他标记则需要更多计算。我们提出了ALoDLM，它用标记自适应的潜在递归替代了均匀计算，在每个去噪步骤中根据标记的难度分配计算资源。ALoDLM在多个基准测试中表现优于所有评估的DLM和相应的AR基线，展现了强大的质量与效率平衡。'}}}, {'id': 'https://huggingface.co/papers/2610.03120', 'title': 'In-Distribution Forcing for Long Video Generation at Test Time', 'url': 'https://huggingface.co/papers/2610.03120', 'abstract': 'Abstract  Modern autoregressive (AR) video diffusion models excel at short-horizon video generation, yet generating long videos remains challenging due to drifting, where colors and textures shift, and motion dynamics decay. Existing works primarily rely on KV conditioning, which selects or modifies cached key-value (KV) entries to mitigate drifting. However, we observe that KV conditioning alone is insufficient as it assumes cached KV entries remain in-distribution. This assumption fails beyond the training horizon: nothing constrains the construction of KV entries during rollout, giving rise to the KV-provenance problem where cached entries themselves become out-of-distribution (OOD). To address this, we propose In-Distribution Forcing (ID-Forcing), a test-time framework that aligns both KV caching and KV conditioning with training configurations. Its key mechanism, self-caching, prevents OOD KV entries at their source. Each chunk is cached without attending to prior KV entry, keeping the rolling window exactly in-distribution. Consequently, ID-Forcing seamlessly extends short-horizon models to minute-scale video generation. Extensive evaluations show that our method remains competitive on standard video generation benchmark while substantially outperforming prior work in mitigating drifting, as validated by both our drift metrics and a user study.', 'score': 28, 'issue_id': 3378, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '0c854299ecf79a85', 'authors': ['Jeongwoo Shin', 'Youngyoon Choi', 'Sangwoo Jo', 'Hyunmog Kim', 'Sungjoon Choi', 'Joonseok Lee', 'Jaewoong Choi', 'Jaemoo Choi'], 'affiliations': ['Georgia Institute of Technology', 'Korea University', 'Seoul National University', 'Sungkyunkwan University'], 'pdf_title_img': 'assets/pdf/title_img/2610.03120.jpg', 'data': {'categories': ['#long_context', '#inference', '#diffusion', '#video'], 'emoji': '🎬', 'ru': {'title': 'Принудительное сохранение распределения для стабильной генерации длинных видео', 'desc': 'В статье рассматривается проблема генерации длинных видео с помощью авторегрессивных диффузионных моделей, которые страдают от дрифта текстур и затухания динамики. Авторы выявили, что традиционный подход KV кондиционирования недостаточен, так как кэшированные ключи и значения выходят за распределение данных обучения во время инференса. Они предлагают метод In-Distribution Forcing (ID-Forcing), который использует механизм self-caching для предотвращения out-of-distribution KV записей и поддержания скользящего окна в рамках обучающего распределения. Метод позволяет расширить короткофокусные модели до генерации видео длительностью в минуты с минимизацией визуального дрифта.'}, 'en': {'title': 'Stabilizing Long Video Generation with In-Distribution Forcing', 'desc': 'This paper addresses the challenges of generating long videos using autoregressive video diffusion models, particularly the issue of drifting, where colors and textures change undesirably over time. The authors critique existing methods that rely on key-value (KV) conditioning, highlighting that these methods fail when the cached KV entries become out-of-distribution during video generation. To solve this problem, they introduce a new framework called In-Distribution Forcing (ID-Forcing), which ensures that KV caching and conditioning remain aligned with the training data. By implementing a self-caching mechanism, ID-Forcing effectively prevents out-of-distribution entries, allowing for more stable and coherent long video generation.'}, 'zh': {'title': '分布内强制：解决视频生成中的漂移问题', 'desc': '现代自回归视频扩散模型在短期视频生成方面表现出色，但生成长视频仍然具有挑战性，主要是因为漂移现象，即颜色和纹理的变化以及运动动态的衰减。现有的方法主要依赖于键值（KV）条件化，通过选择或修改缓存的KV条目来减轻漂移。然而，我们发现仅依靠KV条件化是不够的，因为它假设缓存的KV条目保持在分布内，这一假设在训练范围之外失效。为了解决这个问题，我们提出了分布内强制（ID-Forcing），一种在测试时对KV缓存和KV条件化进行对齐的框架，从而有效地扩展短期模型到分钟级视频生成。'}}}, {'id': 'https://huggingface.co/papers/2610.05162', 'title': 'Memadapter: Counterfactual Adaptation Against Memory-induced Sycophancy', 'url': 'https://huggingface.co/papers/2610.05162', 'abstract': "Abstract  Long-term memory enables LLM-based agents to retain and reuse information across tasks and sessions, supporting personalization and long-horizon interactions. However, persistent memories can also induce sycophancy, causing agents to over-align with users' historical beliefs even when they are inaccurate, outdated, or inconsistent with objective evidence. Existing mitigation methods assume that memory-induced sycophancy originates from biased or incorrect memories and attempt to reduce this risk by filtering such memories at different stages of the memory pipeline. However, in the real world, objective and correct memories can still induce sycophancy, and the same memory can warrant different influence across different contexts. To this end, we propose MemAdapter, a novel framework that adaptively integrates retrieved memories to support objective and reliable reasoning. Specifically, MemAdapter consists of three components: (i) Counterfactual Induction, which leverages counterfactual reasoning to uncover the potential risk of retrieved memories; (ii) Context-Aware Reflection, which calibrates the inferential influence of each retrieved memory in light of the current task via self-reflection; and (iii) Evidence-Based Reasoning, which grounds the final response in appropriate evidence while preserving the legitimate influence of memory. Extensive experiments on three benchmarks demonstrate that MemAdapter consistently improves memory reliability across diverse scenarios. Our code is available at https://github.com/DEEP-JLU/MemAdapter.", 'score': 27, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'bd96946980ba61b8', 'authors': ['Ruqing Ning', 'Haibo Meng', 'Zhishang Xiang', 'Zerui Chen', 'Jinsong Su', 'Xin Wang', 'Qinggang Zhang'], 'affiliations': ['Jilin University', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05162.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Адаптивная память против предвзятости: MemAdapter для объективного рассуждения', 'desc': 'Статья посвящена проблеме сикофантии в LLM-агентах с долгосрочной памятью, когда модели чрезмерно согласовываются с историческими убеждениями пользователей, даже если те неточны или противоречат фактам. Авторы предлагают MemAdapter — фреймворк, который адаптивно интегрирует извлеченные воспоминания для объективного и надежного рассуждения. Решение включает три компонента: контрфактическую индукцию для выявления рисков памяти, контекстно-зависимую рефлексию для калибровки влияния каждого воспоминания, и доказательное рассуждение для обоснованного ответа. Экспериментальные результаты на трех бенчмарках показывают, что предложенный метод последовательно улучшает надежность памяти в различных сценариях.'}, 'en': {'title': 'Enhancing Memory Reliability in LLMs with MemAdapter', 'desc': "This paper introduces MemAdapter, a framework designed to enhance the reliability of long-term memory in large language model (LLM) agents. It addresses the issue of sycophancy, where agents overly conform to users' past beliefs, even if they are incorrect or outdated. MemAdapter employs three key components: Counterfactual Induction to assess the risks of memories, Context-Aware Reflection to adjust memory influence based on the current context, and Evidence-Based Reasoning to ensure responses are grounded in factual evidence. The framework has been tested across various benchmarks, showing significant improvements in memory reliability and reasoning accuracy."}, 'zh': {'title': '提升记忆可靠性的创新框架', 'desc': '本论文提出了一种名为MemAdapter的新框架，旨在解决大规模语言模型（LLM）在长期记忆中可能出现的谄媚现象。该框架通过三个主要组件来实现：反事实推理用于识别检索记忆的潜在风险；上下文感知反思用于根据当前任务调整记忆的推理影响；基于证据的推理则确保最终响应基于适当的证据，同时保留记忆的合理影响。实验结果表明，MemAdapter在多种场景下显著提高了记忆的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2610.04292', 'title': 'LMBuild: Evaluating LLM Agents for Generating Buildable and Functional Structures', 'url': 'https://huggingface.co/papers/2610.04292', 'abstract': 'Abstract  LLM-based agents are increasingly capable of generating complex 3D structures, with the potential to reshape how objects are designed and realized in the physical world. Yet, producing elegant geometry is fundamentally different from producing objects that can be built and perform their intended functions. Existing evaluations largely focus on geometric quality while overlooking physical realizability. We introduce LMBuild, a benchmark for evaluating LLM agents on generating buildable and functional structures. LMBuild represents generated objects as assembled structures comprising part decompositions, joints, materials, and sequences. To support reproducible evaluation, we provide a unified framework consisting of: (1) an interactive environment in which agents can use tools to retrieve, create, and place components to construct objects; (2) a curated benchmark that repurposes established CAD datasets and augments them with knowledge from Wikipedia; and (3) a evaluation framework covering structural soundness, functional affordance, design quality, and physical realization. Evaluations across 30 systems reveal several intriguing findings: (a) Soundness and alignment are no longer the primary bottlenecks for frontier closed-source models, while functional affordance and physical operability remain substantially more challenging; (b) stronger models more effectively create new components, whereas weaker models tend to rely on retrieval; and (c) providing functional specifications substantially improves part completeness, kinematics, and physical operability. These results show that generating real-world structures requires deeper reasoning about functional affordances, mechanics, and designing and creating novel components. We expect LMBuild to provide a foundation for measuring progress and incentivizing research toward agents that generate buildable and functional structures.', 'score': 24, 'issue_id': 3378, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '811ba79cffad9887', 'authors': ['Jiateng Liu', 'Rushi Wang', 'Cheng Qian', 'Xuejun Zhang', 'Sun Li', 'Jiayu Liu', 'Yifan Shen', 'Xu Cao', 'Jiarui Yao', 'Bingxuan Li', 'Ruhi Sarikaya', 'Heng Ji'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.04292.jpg', 'data': {'categories': ['#benchmark', '#agents', '#reasoning', '#3d', '#dataset', '#science'], 'emoji': '🏗️', 'ru': {'title': 'От геометрии к реальности: оценка функциональности и строительной применимости структур, генерируемых LLM', 'desc': 'В статье представлен LMBuild — бенчмарк для оценки способности LLM-агентов генерировать реализуемые и функциональные трёхмерные конструкции. Авторы разработали интерактивную среду, где агенты могут манипулировать компонентами, собирая объекты с учётом разложения на части, соединений и материалов. Предложенная система оценки анализирует как геометрическое качество, так и физическую реализуемость структур, включая проверку прочности, функциональных характеристик и возможности построения. Результаты экспериментов на 30 системах показывают, что главные вызовы заключаются не в синтаксической корректности, а в обеспечении функциональности, физической применимости и создании новых компонентов.'}, 'en': {'title': 'Building the Future: Evaluating LLMs for Functional 3D Design', 'desc': 'This paper introduces LMBuild, a new benchmark for evaluating large language model (LLM) agents in generating 3D structures that are not only geometrically appealing but also buildable and functional. The benchmark assesses the agents on various criteria, including structural soundness, functional affordance, and physical realization, which are crucial for real-world applications. The study reveals that while advanced models can create new components effectively, they still struggle with ensuring functional operability. Overall, LMBuild aims to enhance the evaluation of LLMs in the context of physical object design, encouraging deeper reasoning about mechanics and functionality in generated structures.'}, 'zh': {'title': 'LMBuild：评估可建造结构的基准', 'desc': '本论文介绍了LMBuild，这是一个用于评估大型语言模型（LLM）生成可建造和功能性结构的基准。与传统的几何质量评估不同，LMBuild关注物体的物理可实现性，确保生成的结构不仅美观，还能实际构建和使用。研究发现，功能性和物理可操作性是当前模型面临的主要挑战，而提供功能规格可以显著提高生成部件的完整性和可操作性。LMBuild为评估和推动生成可建造结构的研究提供了基础。'}}}, {'id': 'https://huggingface.co/papers/2609.37267', 'title': 'Foundations of Proactive Agents: Principles, Technical Layers, and Proactivity-Gym', 'url': 'https://huggingface.co/papers/2609.37267', 'abstract': "Abstract  Proactive LLM agents can turn idle compute into useful support before users ask. Yet even correct work can misread user context, impose review costs, or undermine trust. This work proposes foundations for designing, realizing, and evaluating proactive LLM agents around three joint principles (3T): Task Capability, anticipating relevant needs and correctly performing useful work; Temporal Allocation, allocating compute according to resource availability and when results are needed; and Trust, sustaining users' confidence and appropriate reliance on the agent. We connect these objectives to a design space organized around five dimensions: task scope, anticipation horizon, activation trigger, processing timing, and intervention depth, and specify the situation and system modeling needed to support its choices, including user and environment representations, backbone LLMs, and agent harnesses. Lastly, we propose PROACTIVITY-GYM, a simulation-based evaluation testbed including multi-day scenarios, stateful environments, and persona-conditioned simulated users that can evaluate the consequences of proactive assistance across interactions. Evaluations across 23 model-harness configurations uncover substantial performance gaps across 3T and reveal that LLM judges often conflate task capability and trust. A human study with 30 participants demonstrates the importance of the joint 3T optimization: participants show sharp trust declines after intervention misalignment despite correct outcomes, and prefer sleep-time assistance, even when imperfect, to preserve ongoing focus. Together, these findings support designing and evaluating proactive agents through the joint consideration of useful work, compute allocation, and evolving user trust.", 'score': 20, 'issue_id': 3378, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '985b38909ed573e5', 'authors': ['Jio Oh', 'Seunghyun Do', 'Young-Jun Lee', 'Steven Euijong Whang', 'Dongyeop Kang'], 'affiliations': ['KAIST', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2609.37267.jpg', 'data': {'categories': ['#ethics', '#agents', '#alignment', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Уравновешивание полезности, ресурсов и доверия в проактивных агентах', 'desc': 'В работе предлагается фреймворк для разработки проактивных LLM-агентов, которые предвосхищают потребности пользователей и предоставляют помощь до того, как её попросят. Авторы вводят три ключевых принципа: способность выполнять полезные задачи, оптимальное распределение вычислительных ресурсов и поддержание доверия пользователей. Они определяют пространство дизайна из пяти измерений и разработали PROACTIVITY-GYM — среду моделирования для оценки таких агентов с участием реалистичных сценариев и симулированных пользователей. Экспериментальные результаты показывают, что совместная оптимизация трёх принципов критична для успеха, так как неправильно рассчитанное время или способ вмешательства может подорвать доверие даже при корректном выполнении задач.'}, 'en': {'title': 'Empowering Proactive LLM Agents: Balancing Capability, Timing, and Trust', 'desc': "This paper discusses the development of proactive large language model (LLM) agents that can assist users before they even ask for help. It introduces three key principles for these agents: Task Capability, which ensures they perform relevant tasks correctly; Temporal Allocation, which manages when and how resources are used; and Trust, which maintains user confidence in the agent's assistance. The authors also present a framework for evaluating these agents through a simulation environment called PROACTIVITY-GYM, which tests various configurations and user interactions. Findings indicate that even when LLMs perform tasks correctly, misalignment with user expectations can lead to a decline in trust, highlighting the need for a balanced approach to task performance and user relationship management."}, 'zh': {'title': '设计与评估主动代理的三大原则', 'desc': '本论文探讨了主动大型语言模型（LLM）代理的设计与评估，提出了三个核心原则：任务能力、时间分配和信任。任务能力指的是代理能够预见用户需求并有效执行任务；时间分配则是根据资源可用性和结果需求来合理分配计算资源。信任是指维持用户对代理的信心和依赖。研究还提出了一个名为PROACTIVITY-GYM的评估平台，通过模拟用户场景来测试主动代理的效果，发现任务能力和信任之间存在显著的性能差距。'}}}, {'id': 'https://huggingface.co/papers/2610.05076', 'title': 'Self-Generated Feedback Destabilizes Test-Time Training: A Causal Decomposition of Long-Horizon Adaptation', 'url': 'https://huggingface.co/papers/2610.05076', 'abstract': "Abstract  Test-time training (TTT) lets a model store information in its weights during inference. When the model learns from its own output, however, each update also changes the model that generates the next training example. Across 128K-token streams, retaining generated-text updates worsens prediction on independent human-written text with three TTT-E2E model configurations (labeled 125M, 760M, and 3B). The same failure occurs when Adam updates Qwen3-4B's existing weights. The same update mechanisms can improve on real text, so writing itself is not the failure. Three matched comparisons trace the causal pathway. Fixed Generation removes over 98% of the damage at 125M and 760M by using a frozen model to generate training chunks. Recorded Replay separates the loss caused by reading degraded text from the additional loss stored by updating on it. A paired one-update comparison then shows the local conflict: an update predicts its source better but new real text worse. This cost grows after Closed Loop adaptation, with a few trajectories accounting for most large failures. Finally, Settlement evaluates the candidate state on independent real text before commitment. It leaves mean endpoint gaps of 0.07 and -0.02 nats at 125M and 760M while retaining real-text adaptation. These results motivate checking prediction on independent evidence before retaining an update.", 'score': 19, 'issue_id': 3378, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '4451a4a443b17287', 'authors': ['Cheng Luo', 'Bing Li', 'Bernard Ghanem'], 'affiliations': ['King Abdullah University of Science and Technology (KAUST)'], 'pdf_title_img': 'assets/pdf/title_img/2610.05076.jpg', 'data': {'categories': ['#long_context', '#optimization', '#training', '#inference'], 'emoji': '🔄', 'ru': {'title': 'Остановиться перед забыванием: валидация обновлений во время инференса', 'desc': 'В работе исследуется проблема test-time training (TTT), когда модель обновляет свои веса во время инференса, обучаясь на собственных выходах. Авторы обнаружили, что такое самообучение приводит к деградации качества предсказаний на независимом тексте, написанном человеком, несмотря на улучшение на тексте, который сама модель генерировала. Они предложили методы диагностики проблемы (Fixed Generation, Recorded Replay) и решение Settlement, которое проверяет обновления на независимых данных перед их сохранением. Результаты показывают, что проверка качества обновлений на независимой валидации позволяет избежать катастрофального забывания и сохранить адаптацию к реальным текстам.'}, 'en': {'title': 'Enhancing Model Predictions by Evaluating Updates on Independent Data', 'desc': 'This paper discusses Test-time Training (TTT), a method where a model updates its weights during inference based on its own outputs. The authors found that allowing the model to learn from its generated text can lead to worse predictions on independent human-written text. They propose solutions like Fixed Generation and Recorded Replay to mitigate the negative effects of these updates. The findings suggest that evaluating predictions on independent data before committing to updates can improve model performance.'}, 'zh': {'title': '在更新前评估模型预测的必要性', 'desc': '测试时训练（TTT）允许模型在推理过程中将信息存储在其权重中。然而，当模型从自身输出中学习时，每次更新也会改变生成下一个训练示例的模型。在对比实验中，保留生成文本的更新会导致模型在独立的人类文本上的预测性能下降。通过使用固定生成和记录重放等方法，可以显著减少这种损失，并在更新前评估候选状态，以确保模型的适应性和准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.06577', 'title': 'Optimizing the Optimizer: Language Models Discover Faster Molecular Relaxation', 'url': 'https://huggingface.co/papers/2610.06577', 'abstract': "Abstract  Geometry optimization is a major cost in many quantum-chemical workflows: each optimization step requires one force evaluation, and at the density-functional level that evaluation dominates the wall time. Research in this area has produced a broad range of optimization methods, and we ask whether a language model can improve on the best of them through autoresearch. An agent rewrites the optimizer itself to minimize force-call counts, restrained by two admission gates that reject premature stopping and improvements that do not generalize to unseen molecules. Starting from Sella, the fastest open-source optimizer available, the search produces AutoSella, a family of two optimizers. Both of them deliver consistent force-call reductions relative to Sella across held-out molecular benchmarks and potentials not used during the search. Most notably, at the r2SCAN-3c DFT level, the best variant requires only 40.2--77.2% of Sella's force calls while achieving the same energy reduction, even though agent used no DFT gradients.", 'score': 17, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '739eea055dc0a16a', 'authors': ['Artem Tsypin', 'Vladimir Deshchenya', 'Kuzma Khrabrov', 'Denis Potapov', 'Maxim Radchenko', 'Artur Kadurin', 'Michael G. Medvedev'], 'affiliations': ['AXXX, Moscow, Russia', 'ITMO University, Saint Petersburg, Russia', 'N. D. Zelinsky Institute of Organic Chemistry of Russian Academy of Sciences, Moscow, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2610.06577.jpg', 'data': {'categories': ['#open_source', '#science', '#optimization'], 'emoji': '⚛️', 'ru': {'title': 'Язык моделей переучивает себя: AI-оптимизатор для квантовой химии', 'desc': 'В работе предлагается использовать language model как агента для автоматической оптимизации алгоритмов геометрической оптимизации в квантовой химии. Агент переписывает код оптимизатора Sella, минимизируя количество вычислений сил, при этом два фильтра предотвращают преждевременную остановку и невобщаемые улучшения. Полученная система AutoSella демонстрирует последовательное снижение количества вызовов функции сил на новых молекулах и потенциалах, которые не использовались во время поиска. Результаты показывают значительную эффективность: лучший вариант требует только 40-77% вычислений от оригинального Sella при сохранении качества оптимизации.'}, 'en': {'title': 'Revolutionizing Quantum-Chemical Optimization with AutoSella', 'desc': 'This paper discusses a new approach to geometry optimization in quantum chemistry, which is crucial for reducing computational costs. The authors propose using a language model to enhance existing optimization methods by creating an agent that rewrites the optimizer to reduce the number of force evaluations needed. They introduce AutoSella, a family of optimizers derived from the Sella optimizer, which significantly decreases force-call counts while maintaining performance on unseen molecular data. The results show that the best variant of AutoSella can achieve energy reductions with significantly fewer force calls compared to the original Sella optimizer, demonstrating the potential of machine learning in optimizing quantum-chemical workflows.'}, 'zh': {'title': '利用语言模型优化量子化学中的几何优化', 'desc': '几何优化在量子化学工作流程中是一个主要的成本，每一步优化都需要进行一次力评估，而在密度泛函水平上，这种评估占据了大部分时间。本文探讨了是否可以通过自我研究的语言模型来改进现有的优化方法。研究者开发了一种代理，能够重写优化器以减少力调用次数，并设置了两个限制条件以防止过早停止和不具普适性的改进。最终，基于现有的开源优化器Sella，生成了AutoSella系列优化器，在多个分子基准测试中表现出显著的力调用减少。'}}}, {'id': 'https://huggingface.co/papers/2610.06833', 'title': 'Towards Looped Models Done Right, Part II: Rethinking at Fixed Points', 'url': 'https://huggingface.co/papers/2610.06833', 'abstract': "Abstract  Every recurrence of a looped language model adds cost in training, decoding, prefill, and reinforcement learning (RL). The closer recurrent states get to fixed points, the less the path to them matters. This enables truncated backpropagation in training; terminal key-value (KV) sharing for decoding with almost no loss in accuracy; a distilled student that prefills up to 1.79x faster; and RL updates that compute gradients from saved rollout states, 2x faster than backpropagating through the replayed trajectory. We therefore improve the two components of training that shape these fixed points: the depth prior and input injection. Fixed-depth training breaks KV sharing, and Huginn's broad depth prior supports sharing but dilutes supervision at the target depth more than sharing requires; we learn the prior from prediction feedback, with an entropy term that keeps it broad. Existing injection schemes let the state's component along the input amplify or cancel the injection; we remove this component with orthogonal injection. From 100M to 1.6B parameters, the learned prior and orthogonal injection lower perplexity at every scale relative to Huginn's prior and existing injection schemes, respectively. At 1.6B, the learned prior with a 3x smaller KV cache matches the downstream average of fixed-depth training with the full cache.", 'score': 17, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'df69c72d495993dd', 'authors': ['Benhao Huang', 'Chufan Shi', 'Junlin Chen', 'Shicheng Wen', 'Zhengzhong Liu', 'Eric Xing', 'Xuezhe Ma'], 'affiliations': ['Institute of Foundation Models, USC, CMU'], 'pdf_title_img': 'assets/pdf/title_img/2610.06833.jpg', 'data': {'categories': ['#architecture', '#small_models', '#optimization', '#rl', '#training', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Оптимизация рекуррентных моделей через неподвижные точки', 'desc': 'Статья описывает методы оптимизации рекуррентных языковых моделей, которые снижают вычислительные затраты на обучение, декодирование и усиленное обучение. Авторы показывают, что когда рекуррентные состояния приближаются к неподвижным точкам, можно применять усечённую обратную пропаганду и совместное использование кэша ключей-значений с минимальной потерей точности. Предложены два ключевых улучшения: обучаемый приор глубины, который адаптируется через обратную связь предсказания, и ортогональное впрыскивание входных данных для избежания их амплификации в состояниях. Экспериментальные результаты на моделях от 100M до 1.6B параметров демонстрируют снижение перплексии и ускорение обучения в 2-3 раза без значительного ухудшения качества.'}, 'en': {'title': 'Optimizing Language Models for Speed and Efficiency', 'desc': 'This paper discusses improvements in training looped language models by optimizing recurrent states and their fixed points. It introduces techniques like truncated backpropagation and terminal key-value sharing, which enhance training efficiency and decoding speed without sacrificing accuracy. The authors propose a learned depth prior and orthogonal injection methods to reduce perplexity across various model sizes. These innovations allow for faster reinforcement learning updates and better performance with fewer resources, demonstrating significant advancements in language model training.'}, 'zh': {'title': '优化循环语言模型的训练与解码效率', 'desc': '这篇论文探讨了循环语言模型在训练、解码和强化学习中的成本问题。通过优化固定点的接近程度，研究者们实现了更高效的训练和解码过程，包括截断反向传播和终端键值共享。论文提出了一种新的深度先验学习方法和正交注入技术，显著降低了困惑度，并提高了模型的训练效率。最终，研究表明在不同参数规模下，新的方法相较于现有技术都有明显的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2609.36099', 'title': 'Data Unlearning via Inverse Distillation', 'url': 'https://huggingface.co/papers/2609.36099', 'abstract': "Abstract  Multi-step matching models, including flow and diffusion models, produce high-quality outputs but incur substantial inference costs and may reproduce unwanted components of their training datasets. We introduce Inverse Distillation Unlearning (IDU), a unified framework that simultaneously distills a teacher multi-step matching model into an efficient one-step student generator and suppresses outputs corresponding to a designated training subset. We first formulate distillation as a min-max objective over a data distribution and then represent this distribution as a mixture of the forget-set and the generated distributions. This allows us to compare this mixture with the teacher's training distribution and recover only the retained data at the optimum. Our method requires only a pretrained full-data teacher and data from the forget set, without access to retained training examples, extra feature extractors or classifiers. Extensive experiments on MNIST and CIFAR-10 datasets under flow-matching and score-based diffusion settings demonstrate that IDU substantially reduces the generation frequency of forgotten classes while preserving generation quality on the retained classes. To the best of our knowledge, IDU is the first unified framework for simultaneous unlearning and distillation in unconditional flow-matching and score-based models.", 'score': 16, 'issue_id': 3378, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '09341ff882841933', 'authors': ['Aleksei Leonov', 'Nikita Kornilov', 'Zhenhe Zhang', 'Evgeny Burnaev', 'Iaroslav Koshelev', 'Alexander Korotin'], 'affiliations': ['AI Foundation lab, Moscow, Russia', 'AXXX, Moscow, Russia', 'Applied AI Institute, Moscow, Russia', 'BRAIn Lab, Moscow, Russia', 'MIRAI, Moscow, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2609.36099.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Забывчивая компрессия: одновременное разжатие и удаление данных в генеративных моделях', 'desc': 'В статье предложен метод Inverse Distillation Unlearning (IDU), который одновременно компрессирует многошаговую модель matching (учитель) в эффективный одношаговый генератор и удаляет нежелательные компоненты из обученных данных. Авторы формализуют задачу как min-max оптимизацию над распределением данных, представляя его как смесь забываемого набора и сгенерированного распределения. Метод требует только предварительно обученную модель и данные из набора на забывание, без доступа к остальным примерам обучения. Эксперименты на MNIST и CIFAR-10 показывают, что IDU эффективно снижает частоту генерации забытых классов, сохраняя качество на оставшихся классах.'}, 'en': {'title': 'Efficient Unlearning through Inverse Distillation', 'desc': 'This paper presents Inverse Distillation Unlearning (IDU), a new method that improves the efficiency of multi-step matching models while addressing the issue of unwanted outputs from training data. IDU distills a complex teacher model into a simpler student model, allowing for faster inference without losing quality in the generated outputs. The framework also suppresses outputs related to specific training data that should be forgotten, using a unique min-max optimization approach. Experiments on datasets like MNIST and CIFAR-10 show that IDU effectively reduces the generation of unwanted classes while maintaining high quality for the desired outputs.'}, 'zh': {'title': '高效蒸馏与遗忘的统一框架', 'desc': '本文介绍了一种名为逆蒸馏遗忘（IDU）的新框架，旨在提高多步匹配模型的效率，同时抑制与特定训练子集相关的输出。IDU通过将教师模型蒸馏为一个高效的一步学生生成器，来减少推理成本。该方法只需预训练的全数据教师模型和遗忘集的数据，而无需访问保留的训练示例。实验结果表明，IDU在生成质量上保持了保留类别的表现，同时显著降低了遗忘类别的生成频率。'}}}, {'id': 'https://huggingface.co/papers/2610.06648', 'title': 'Representation-Space MMD for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.06648', 'abstract': 'Abstract  We introduce a post-training method for diffusion language models (DLMs) that minimizes Maximum Mean Discrepancy (MMD) between generated and reference distributions in the feature space of a frozen pretrained DLM. To estimate MMD, we retain contextual features at individual token positions, obtaining multiple observations per sequence from a single extractor pass. We optimize this objective using policy gradients for discrete models and direct differentiation through generated latents for continuous models. In both cases, computing the loss directly from these features enables efficient post-training without full sampling trajectories or jointly trained auxiliary models. Experiments show lower generative perplexity at comparable entropy on OpenWebText and better accuracy-computation trade-offs on GSM8K. On 16B DMax-LLaDA2.0 models with hybrid masked-uniform diffusion, we increase decoding parallelism with similar or higher accuracy on math and code benchmarks.', 'score': 16, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '2931ac24532f8121', 'authors': ['Ilya Drobyshevskiy', 'Ilia Sudakov', 'Maksim Semenov', 'Denis Kuznedelev', 'Maksim Ignatov', 'Pavel Temirchev', 'Nikita Balagansky', 'Viacheslav Meshchaninov', 'Nikita Gushchin', 'Dmitry Baranchuk'], 'affiliations': ['AXXX', 'Applied AI Institute', 'Constructor University', 'HSE University', 'T-Tech', 'Yandex Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.06648.jpg', 'data': {'categories': ['#diffusion', '#training', '#math', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Эффективное пост-обучение диффузионных моделей через минимизацию расхождения распределений', 'desc': 'В работе предложен метод пост-обучения для диффузионных языковых моделей, который минимизирует максимальное среднее расхождение между распределениями сгенерированных и эталонных текстов в пространстве признаков замороженной модели. Авторы сохраняют контекстные признаки для каждой позиции токена, позволяя извлекать несколько наблюдений из одного прохода через экстрактор. Оптимизация проводится с помощью градиентной политики для дискретных моделей и прямой дифференциации для непрерывных моделей. Экспериментальные результаты показывают снижение перплексии при сохранении энтропии и улучшение соотношения точность-вычисления на задачах математического рассуждения и генерации кода.'}, 'en': {'title': 'Enhancing Diffusion Language Models with Efficient Post-Training Techniques', 'desc': 'This paper presents a new method for improving diffusion language models (DLMs) after they have been trained. The approach focuses on minimizing the Maximum Mean Discrepancy (MMD) between the distributions of generated text and reference text in a specific feature space. By capturing contextual features at each token position, the method allows for efficient optimization using policy gradients for discrete models and direct differentiation for continuous models. The results demonstrate that this technique leads to lower generative perplexity and better performance on various benchmarks without the need for extensive sampling or additional models.'}, 'zh': {'title': '优化扩散语言模型的后训练方法', 'desc': '我们提出了一种后训练方法，用于扩散语言模型（DLM），该方法通过最小化生成分布和参考分布在特征空间中的最大均值差异（MMD）来优化模型。为了估计MMD，我们保留了每个标记位置的上下文特征，从单个提取器的传递中获得多个观察值。我们使用策略梯度优化离散模型的目标，并通过生成的潜在变量对连续模型进行直接微分。实验结果表明，在OpenWebText上生成的困惑度更低，同时在GSM8K上实现了更好的准确性与计算效率的权衡。'}}}, {'id': 'https://huggingface.co/papers/2610.00923', 'title': 'CANOPY: Adaptive-Granularity Evidence Compression for Multimodal RAG', 'url': 'https://huggingface.co/papers/2610.00923', 'abstract': 'Abstract  Multimodal RAG retrieves text, tables, images, and videos, but choosing a retrieval granularity does not determine how much context to retain within each item. Coarse units include irrelevant content, while uniformly fine selection can remove context needed to interpret the evidence. Existing compressors address this trade-off with modality-specific mechanisms, leaving open a shared procedure for adapting the retained extent region by region across heterogeneous items. We introduce CANOPY (Canonical Projection over Hierarchy), a framework for adaptive-granularity post-retrieval evidence compression. CANOPY represents retrieved items as hierarchies and uses a node encoder fine-tuned on gold evidence to score regions against the query. Parent-relative refinement compares these scores to select multiple regions at different granularities without LLM calls for node-level pruning. Because compression cannot recover evidence that was never retrieved, a critic requests targeted follow-up retrieval when it judges the accumulated evidence insufficient; newly retrieved items are compressed before being added. Across five QA benchmarks over a 33M-item heterogeneous corpus, CANOPY achieves higher average answer accuracy than the evaluated retrieval baselines. Ablations indicate that additional retrieval drives the main accuracy gains on multi-hop QA. In the unrouted Qwen3-VL-8B-Instruct setting, compression reduces reader-input evidence tokens by 14.2-27.7% relative to the same iterative pipeline without compression, with comparable answer accuracy.', 'score': 16, 'issue_id': 3377, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '73ebf20830e040a3', 'authors': ['Hyojeong Yun', 'Jueun Kim', 'Wook-Shin Han'], 'affiliations': ['CSE, POSTECH', 'GSAI, POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2610.00923.jpg', 'data': {'categories': ['#benchmark', '#rag', '#multimodal'], 'emoji': '🌳', 'ru': {'title': 'Адаптивная компрессия доказательств в мультимодальном поиске через иерархическое разбиение', 'desc': 'В статье представлен CANOPY — фреймворк для адаптивной компрессии извлеченных данных в мультимодальных системах поиска с augmented generation. Система представляет полученные элементы (текст, таблицы, изображения, видео) как иерархии и использует обученный энкодер для оценки релевантных регионов относительно запроса пользователя. Фреймворк применяет многоуровневое отсечение без обращения к LLM на каждом узле, а также включает критика, который запрашивает дополнительный поиск, если накопленных доказательств недостаточно. Экспериментально показано, что CANOPY достигает более высокой точности ответов на пяти бенчмарках вопросно-ответных систем и сокращает объем входных токенов на 14-28% без потери качества.'}, 'en': {'title': 'Adaptive Evidence Compression for Enhanced Multimodal Retrieval', 'desc': 'The paper presents CANOPY, a novel framework for adaptive-granularity post-retrieval evidence compression in multimodal retrieval systems. It addresses the challenge of selecting the right amount of context from retrieved items like text, images, and videos, which can vary in relevance and detail. By representing retrieved items as hierarchies and using a node encoder, CANOPY refines the selection of evidence regions based on their relevance to the query. The framework demonstrates improved answer accuracy across multiple question-answering benchmarks while effectively reducing the amount of evidence tokens needed for processing.'}, 'zh': {'title': '自适应粒度的证据压缩框架', 'desc': '这篇论文介绍了一种名为CANOPY的框架，用于在多模态检索后进行自适应粒度的证据压缩。CANOPY通过将检索到的项目表示为层次结构，并使用节点编码器对不同区域进行评分，从而选择不同粒度的区域。该方法避免了对大型语言模型的调用，能够有效地进行节点级修剪。实验结果表明，CANOPY在多个问答基准上表现出更高的答案准确率，并且在压缩过程中显著减少了输入证据的令牌数量。'}}}, {'id': 'https://huggingface.co/papers/2609.24890', 'title': 'OSWorld-Pro: Process-based Evaluation for Computer Use Agents', 'url': 'https://huggingface.co/papers/2609.24890', 'abstract': 'Abstract  Evaluation of Computer-Use Agents (CUAs) is often limited to the final deliverables they create (at the end of hundreds of steps) and assessed with functional verifiers, as seen in OSWorld. However, such evaluation of end-state performance lacks transparency into how and why agents fail in various tasks, obfuscating critical insight for subsequent improvement. For instance, agents that err during keyboard inputs would require a different mitigation strategy from those that fail to precisely provide click-based inputs on the graphical UI. We introduce OSWorld-Pro: a set of over 300 tasks containing over 2800 subgoals to enable the procedural evaluation of CUAs grounded in over 67,000 human annotations. We use robust human-aligned LLM-Judges to evaluate the fulfillment of OSWorld-Pro subgoals and thereby reveal the progress that models make throughout a series of sequentially dependent subgoals. Our findings reveal that OSWorld-Pro is challenging even for state-of-the-art LLMs, with top performers like Claude Opus 5 achieving only 75.7% vs. 83.4% on OSWorld. Furthermore, we identify critical process-focused failure modes of various models (e.g. subgoal-irrelevant actions and click-based mistakes) to provide insights to improve performance and efficiency of CUAs.', 'score': 15, 'issue_id': 3377, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '1e3d7574ba6902ae', 'authors': ['Zhilin Wang', 'Shaokun Zhang', 'Yifan Zhang', 'Hao Zhang', 'Jin Xu', 'Binfeng Xu', 'Jian Hu', 'Yunheng Zou', 'Karan Sapra', 'Andrew Tao', 'Jan Kautz', 'Yi Dong'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.24890.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Прозрачная оценка агентов: от итогов к процессу', 'desc': 'В работе представлен набор данных OSWorld-Pro, содержащий более 300 задач с 2800 подцелями и 67000 человеческих аннотаций для детальной оценки агентов компьютерного взаимодействия. Авторы вводят методологию пошаговой оценки вместо традиционного подхода, сосредоточенного только на итоговом результате, что позволяет лучше понять причины ошибок моделей. Используя LLM-Judges, выровненные с человеческими оценками, исследователи демонстрируют, что даже лучшие модели как Claude Opus 3.5 достигают только 75.7% успеха на OSWorld-Pro. Анализ выявляет специфические типы ошибок моделей, такие как неправильный ввод с клавиатуры и неточные клики, что открывает путь к целенаправленному улучшению агентов.'}, 'en': {'title': 'Unveiling Agent Performance: Beyond Final Outputs', 'desc': "This paper introduces OSWorld-Pro, a comprehensive evaluation framework for Computer-Use Agents (CUAs) that focuses on the procedural assessment of their performance across a wide range of tasks. Unlike traditional methods that only evaluate final outputs, OSWorld-Pro breaks down tasks into over 2800 subgoals, allowing for a detailed analysis of how agents perform at each step. The evaluation utilizes human-aligned LLM-Judges to assess the agents' progress and identify specific failure modes, such as irrelevant actions or input errors. The findings highlight that even advanced language models struggle with these tasks, emphasizing the need for targeted improvements in agent design and functionality."}, 'zh': {'title': '揭示计算机代理的评估新视角', 'desc': '本论文介绍了OSWorld-Pro，这是一个包含超过300个任务和2800个子目标的评估框架，用于计算机使用代理（CUAs）的程序性评估。通过使用67,000多个人工注释，OSWorld-Pro能够揭示模型在一系列依赖子目标中的进展。研究发现，即使是最先进的语言模型（如Claude Opus 5）在OSWorld-Pro上的表现也不如在OSWorld上，显示出其挑战性。我们还识别了不同模型的关键失败模式，以便为CUAs的性能和效率改进提供见解。'}}}, {'id': 'https://huggingface.co/papers/2610.05107', 'title': 'SearchJev: A Fast and Calibrated System-1 Model for Search Agents', 'url': 'https://huggingface.co/papers/2610.05107', 'abstract': 'Abstract  Search agents repeatedly make short decisions about relevance, evidence sufficiency, and search actions. Using generative language models for these decisions introduces latency and unreliable confidence. We present SearchJev, a fast and calibrated System-1 model that separates search decisions from System-2 reasoning and generation. Given a search state and a decision schema, SearchJev directly scores legal options without autoregressive output generation. We propose Soft-Label Learning for Calibrated Decisions (SLCD) to learn decision probabilities from uncertain supervision and calibrate their confidence. In a dual-system search agent, SearchJev handles short decisions and delegates uncertain judgments to System 2, which retains planning, query generation, and answer composition. We also introduce SearchDecision-Bench, a benchmark unifying six types of search decisions for training and evaluation. On SearchDecision-Bench, SEARCHJEV improves decision quality over same-size Qwen3.5 autoregressive models, achieves 5.2-5.3 times faster decisions, and reduces average expected calibration error by 41-74%. On BrowseComp-Plus, the dual-system agents achieve a 3.7-4.7 times speedup in active search time while improving answer accuracy from 45% to up to 54%.', 'score': 14, 'issue_id': 3378, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '0dd5cb06ebe133bc', 'authors': ['Congfeng Cao', 'Lipeng Zuo', 'Konstantinos Papakostas', 'Qiwei Xu', 'Songwei Xu', 'Lun Zhou', 'Zhaochun Ren', 'Yougang Lyu', 'Xiaohui Yan'], 'affiliations': ['Huawei Technologies Co., Ltd.', 'Leiden University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05107.jpg', 'data': {'categories': ['#training', '#agents', '#dataset', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Быстрые калиброванные решения в поиске через разделение System-1 и System-2', 'desc': 'В статье представлена модель SearchJev, которая реализует архитектуру с двумя системами обработки информации для агентов поиска. SearchJev — это быстрая модель System-1, которая принимает решения о релевантности и выборе действий напрямую без авторегрессивной генерации, в отличие от медленных LLM. Для обучения моделей на неполной разметке авторы предлагают метод SLCD (Soft-Label Learning for Calibrated Decisions), который калибрует вероятности решений и повышает надежность предсказаний. В двухсистемном агенте SearchJev обрабатывает быстрые решения, а сложные рассуждения делегирует System-2, достигая ускорения в 5-6 раз при улучшении точности на 9 процентных пункта.'}, 'en': {'title': 'Fast and Reliable Search Decisions with SearchJev', 'desc': 'The paper introduces SearchJev, a novel search agent that enhances decision-making speed and accuracy by separating quick decisions from more complex reasoning processes. It utilizes a System-1 model to quickly score options based on a given search state, avoiding the delays associated with generative language models. The authors propose a new learning method called Soft-Label Learning for Calibrated Decisions (SLCD) to improve the reliability of decision probabilities under uncertain conditions. Additionally, they present SearchDecision-Bench, a benchmark for evaluating search decisions, demonstrating that SearchJev significantly outperforms existing models in both speed and calibration accuracy.'}, 'zh': {'title': '快速且精准的搜索决策模型', 'desc': '本文介绍了一种名为SearchJev的快速且经过校准的搜索决策模型。该模型将搜索决策与更复杂的推理和生成过程分开，从而提高了决策的速度和准确性。通过引入软标签学习（SLCD），SearchJev能够从不确定的监督中学习决策概率，并校准其置信度。实验结果表明，SearchJev在决策质量和速度上均优于传统的自回归模型，显著提升了搜索效率和答案准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.05303', 'title': 'ASCENT: Online Test-Time Training of Long-Horizon Agents via Self-Distillation of Verified Experience', 'url': 'https://huggingface.co/papers/2610.05303', 'abstract': "Abstract  A large language model (LLM) agent solves long-horizon tasks through many reasoning-action turns, with one verification signal at termination. Deployed agents face streams of related tasks, making their trajectories a natural resource for improvement. In-context adaptation agents store reflections, memories, or skills as text, so reuse depends on retrieving the right experience and on a frozen policy executing it. We study Online Agentic Test-Time Training (OaTTT), which trains the LLM's weights on its own execution trajectories during deployment. The agent executes each task once, in one pass over the stream, and the executed trajectory with its verification result is the only learning signal for weight updates that persist across tasks. Directly imitating or reinforcing the generated tokens of this single attempt destabilizes the policy. We introduce ASCENT (Agentic Self-distillation for Cross-task EvolutioN at Test-time), which instead self-distills verified experience. A stable version of the LLM, its frozen initial copy, receives the verified trajectory as privileged information and predicts next-token distributions along it with this hindsight. Distilling them into persistent LoRA fast weights updates the agent for later tasks, without an external reference solution or stronger teacher. By further removing invalid-action turns, ASCENT distills enhanced privileged experience for more efficient execution. We characterize its population target and the limits of sparse outcome selection. Across ALFWorld, WebShop, and AppWorld at varied model scales, ASCENT improves task success and interaction efficiency as experience accumulates, outperforms online adaptation methods, and transfers to held-out scenes, showing that an agent can consolidate verified experience into its weights without a separate training phase or memory retrieval. Project page: https://artificer-ai-lab.github.io/ASCENT", 'score': 14, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'db4cc89258dadb75', 'authors': ['Haodong Lu', 'Dong Gong'], 'affiliations': ['University of New South Wales (UNSW Sydney)'], 'pdf_title_img': 'assets/pdf/title_img/2610.05303.jpg', 'data': {'categories': ['#reasoning', '#transfer_learning', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Агент учится из собственного опыта без учителя', 'desc': 'В статье представлен метод Online Agentic Test-Time Training (OaTTT) для обучения больших языковых моделей на собственных траекториях во время развёртывания. Авторы предлагают ASCENT — алгоритм самодистилляции, который использует замороженную копию модели для предсказания распределений токенов по проверенным траекториям с целью стабилизации обновлений весов. Метод применяет дистилляцию знаний в LoRA адаптеры, позволяя агенту улучшаться на потоке связанных задач без внешних эталонных решений или учителя. Экспериментальная оценка на ALFWorld, WebShop и AppWorld показывает, что ASCENT повышает успешность выполнения задач и эффективность взаимодействия по мере накопления опыта, превосходя другие методы адаптации.'}, 'en': {'title': 'Learning from Experience: ASCENT for Self-Improving Agents', 'desc': "This paper presents a method called ASCENT, which enhances the performance of large language model (LLM) agents during deployment by allowing them to learn from their own execution experiences. Instead of relying on external training signals, ASCENT uses verified trajectories from the agent's past tasks to update its weights, enabling it to adapt and improve over time. The approach focuses on self-distillation, where the agent learns from its own successful actions while avoiding destabilization from imitating all generated outputs. The results show that ASCENT leads to better task success rates and more efficient interactions across various environments without needing a separate training phase."}, 'zh': {'title': 'ASCENT：自我蒸馏提升大语言模型的任务执行效率', 'desc': '这篇论文介绍了一种名为ASCENT的在线自蒸馏方法，用于大语言模型（LLM）在执行任务时的自我学习。通过在任务执行过程中收集验证过的经验，ASCENT能够在没有外部参考的情况下更新模型权重。该方法通过消除无效的动作步骤，提升了执行效率，并在多个任务中表现出色。研究表明，ASCENT可以有效地将验证过的经验整合到模型中，从而提高任务成功率和交互效率。'}}}, {'id': 'https://huggingface.co/papers/2609.39490', 'title': 'OmniReasoning: Pushing the Limits of Audio-Visual Joint Reasoning', 'url': 'https://huggingface.co/papers/2609.39490', 'abstract': 'Abstract  Recent advances have enabled unified omni-modal models in understanding audio, vision, and language. However, existing benchmarks, training data, and learning methods largely treat the modalities independently, leaving the capability of audio-visual joint reasoning poorly evaluated and insufficiently elicited. We address this gap with a benchmark, data engine, and learning method. First, we introduce OmniReasoningBench, a benchmark where both audio and visual evidence are indispensable. It comprises 1,150 multiple-choice and open-ended questions across two tasks, reasoning over video and reasoning beyond video. Second, we develop a data engine OmniQA. It automatically constructs evidence-grounded QA pairs that explicitly necessitate audio-visual joint reasoning, together with time-stamped clue chains that guide the annotation of thinking process. Besides our benchmark, this engine produces training data OmniReasoning-SFT-112K and OmniReasoning-RL-19K. Finally, we propose an on-policy self-distillation method Modality-Factored Self-Distillation (MFSD). It evaluates each sampled response under modality-specific clue contexts, disentangling the contributions of individual clues and their cross-modal interactions for token-level credit assignment. With our training data and learning method, our model OmniReasoning-30B-A3B achieves 50.0% on OmniVideoBench and 42.5% on OmniReasoningBench, improving the base model Qwen3-Omni-30B-A3B-Thinking by 12.8 and 9.3 percentage points, respectively. Moreover, it delivers substantial gains on general and long-video benchmarks, including Video-MME-v2. We hope our work offers a solid step for facilitating future research in omni-modal joint reasoning.', 'score': 12, 'issue_id': 3378, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '591b704b7bb59268', 'authors': ['Junming Lin', 'Yuxuan Wang', 'Zhenxin Lei', 'Yuxin Liu', 'Ruixun Liu', 'Yinsong Yan', 'Ling Wang', 'Minghao Han', 'Yunfei Chu', 'Shun Lei', 'Xueyao Zhang', 'Qize Yang', 'Jin Xu', 'Yiwu Zhong'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'School of Intelligence Science and Technology, Peking University', 'State Key Laboratory of General Artificial Intelligence, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39490.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#synthetic', '#reasoning', '#training', '#dataset', '#video'], 'emoji': '🎬', 'ru': {'title': 'Совместное рассуждение по аудио-визуальным данным через самодистилляцию с факторизацией модальностей', 'desc': 'В работе представлены решения для улучшения мультимодальных моделей, которые одновременно обрабатывают аудио, видео и текст. Авторы создали бенчмарк OmniReasoningBench, где требуется совместное рассуждение на основе аудио и визуальной информации, а также разработали автоматический генератор обучающих данных OmniQA. Предложен новый метод обучения Modality-Factored Self-Distillation (MFSD), который оценивает вклад каждой модальности и их взаимодействия для более точного распределения ошибок при обновлении весов сети. Модель OmniReasoning-30B-A3B показывает значительные улучшения на предложенных бенчмарках и задачах обработки длинных видео.'}, 'en': {'title': 'Enhancing Joint Reasoning with Omni-Modal Models', 'desc': 'This paper presents advancements in omni-modal models that integrate audio, vision, and language for better reasoning capabilities. It introduces a new benchmark called OmniReasoningBench, which requires both audio and visual inputs for answering questions, thus enhancing the evaluation of joint reasoning. The authors also develop a data engine, OmniQA, that generates training data specifically designed for audio-visual reasoning tasks. Additionally, they propose a novel learning method, Modality-Factored Self-Distillation (MFSD), which improves model performance by analyzing the contributions of different modalities during training.'}, 'zh': {'title': '推动音频与视觉联合推理的进步', 'desc': '本论文介绍了一种新的基准和学习方法，旨在提高音频和视觉的联合推理能力。我们提出了OmniReasoningBench基准，包含1150个多项选择和开放式问题，要求同时利用音频和视觉证据进行推理。我们还开发了数据引擎OmniQA，自动生成需要音频-视觉联合推理的问答对，并提供思维过程的时间戳线索链。最后，我们提出了一种新的自蒸馏方法，帮助模型更好地理解不同模态之间的相互作用。'}}}, {'id': 'https://huggingface.co/papers/2610.04929', 'title': 'RobotUse: Allocating Computation, Context, and Decisions', 'url': 'https://huggingface.co/papers/2610.04929', 'abstract': 'Abstract  Robot agents must connect their intended actions to observed outcomes while retaining the context needed to revise their choices over repeated attempts. Existing interfaces often leave these choices inside predefined tools or require agents to manage detailed execution code and its growing history. We introduce RobotUse, a robot agent harness that organizes computation, context, and decisions around specifying and revising physical actions. Agents visually select targets and poses, while the backend handles geometry, motion planning, and control. Subagents retain detailed interactions within each subgoal and return the information needed for subsequent decisions. Continual harnessing lets agents learn from execution by updating a persistent playbook. On RoboLab, RobotUse achieves 45% task success, outperforming CaP-X by 6.7 percentage points while maintaining compact decision contexts and reducing reliance on predefined action abstractions. Furthermore, we show that RobotUse learns from real-world execution despite imperfect feedback and transfers what it learns to subsequent tasks. Project page is available at https://robotuse-team.github.io/.', 'score': 11, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'ecea5d763aed1c73', 'authors': ['Junhoo Lee', 'Injun Baek', 'Seungyeon Kim', 'Suhyun Jeon', 'Minkyu Kim', 'Baekseung Kim', 'Nojun Kwak'], 'affiliations': ['KAIST', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04929.jpg', 'data': {'categories': ['#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Визуальное управление робот-агентом через итеративное уточнение физических действий', 'desc': 'Статья представляет RobotUse — фреймворк для управления робот-агентами, который организует вычисления вокруг задачи выполнения физических действий. Система позволяет агентам визуально выбирать целевые позиции и ориентацию, пока бэкенд обрабатывает геометрию, планирование траекторий и управление. Подагенты сохраняют детальную информацию о взаимодействиях в пределах каждой подцели и возвращают необходимые данные для последующих решений. RobotUse достигает 45% успеха на тестовом наборе RoboLab, превосходя CaP-X на 6.7 процентных пункта, при этом сохраняя компактный контекст решений и обучаясь на реальном опыте выполнения задач.'}, 'en': {'title': 'Empowering Robots to Learn and Adapt Through Contextual Decision-Making', 'desc': 'The paper presents RobotUse, a framework designed for robot agents to improve their decision-making processes by connecting actions to outcomes while maintaining context. It allows agents to visually select targets and poses, simplifying the execution of complex tasks by managing geometry, motion planning, and control in the background. RobotUse enables agents to learn from their experiences by updating a persistent playbook, which helps them refine their actions over time. The results show that RobotUse outperforms existing methods in task success rates while minimizing the need for predefined action templates.'}, 'zh': {'title': '智能机器人决策的新方式', 'desc': '本论文介绍了一种名为RobotUse的机器人代理系统，旨在帮助机器人将预期动作与观察结果连接起来，同时保留必要的上下文以便在多次尝试中修正选择。RobotUse通过可视化选择目标和姿态，简化了计算、上下文和决策的组织，后端则负责几何、运动规划和控制。该系统的子代理能够在每个子目标内保留详细的交互信息，并为后续决策提供所需的信息。实验结果表明，RobotUse在RoboLab上实现了45%的任务成功率，超越了CaP-X，并且能够在真实世界执行中学习，尽管反馈不完美，仍能将所学知识转移到后续任务中。'}}}, {'id': 'https://huggingface.co/papers/2610.05894', 'title': 'Noise Out, Bias In: Targeted Bias Injection in Diffusion Language Models via Closed-Loop Activation Steering', 'url': 'https://huggingface.co/papers/2610.05894', 'abstract': "Abstract  Masked diffusion language models (dLLMs) generate text by iteratively denoising masked positions, re-predicting each token multiple times before it is committed. An autoregressive decoder exposes an answer's distribution once, at the step that commits it; a dLLM exposes it at every denoising step before commitment, and we show that an adversary can exploit this. Since an answer remains open to revision over many denoising steps, an adversary with access to internal activations can watch how likely the model is to produce a chosen answer and adjust the intervention accordingly. Building on this observation, we study targeted bias injection, an attack that steers a frozen dLLM toward a demographic answer selected by the adversary. The attack uses a simple proportional-integral (PI) controller that tracks the target-answer probability during denoising and adapts the strength of a steering vector on the fly. On ambiguous BBQ questions where the correct answer is abstention, our attack raises LLaDA-8B-Instruct's preference for the targeted group from 1.8 to 16.7 percentage points, more than three times the strongest fixed-strength steering baseline, and on SocialStigmaQA it raises the selection of stigmatizing answers from 17.6% to 58.1%. Fitted to other demographic targets, the same attack shifts answers by up to 37 percentage points, and each attack takes about 40 minutes on one GPU. On the primary target, feedback is what makes the attack work: constant steering at the same average strength over the token-committing steps produces a far smaller shift while corrupting nearly three times as many outputs, and a constant strength set separately for each example still falls well short. Our findings identify the denoising trajectory as a new control channel in dLLMs and call for bias audits that examine the serving stack rather than the frozen model alone.", 'score': 11, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3830d5ead4da9246', 'authors': ['Sarim Hashmi', 'Mukul Ranjan', 'Abdelrahman Elsayed', 'Muhammad Umer Sheikh', 'Fahad Shamshad', 'Nils Lukas'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2610.05894.jpg', 'data': {'categories': ['#architecture', '#training', '#diffusion', '#ethics', '#security'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное управление смещением в диффузионных моделях через траекторию денойзинга', 'desc': 'В работе исследуется уязвимость маскированных диффузионных языковых моделей, которые генерируют текст путём итеративного удаления шума с повторным предсказанием токенов. Авторы показывают, что противник может эксплуатировать тот факт, что распределение вероятностей ответа открыто на каждом шаге денойзинга, а не только один раз как в авторегрессивных моделях. Предложена атака целевого внедрения смещения, использующая пропорционально-интегральный регулятор для адаптивного управления силой вектора направления во время генерации, который эффективно смещает модель в сторону выбранного ответа противника. Эксперименты демонстрируют значительное увеличение предпочтения целевой демографической группы (с 1.8% до 16.7% на BBQ) и подчеркивают необходимость аудитов смещения, учитывающих траекторию денойзинга.'}, 'en': {'title': 'Exploiting Denoising: A New Frontier in Bias Injection in Language Models', 'desc': "This paper discusses a new type of language model called masked diffusion language models (dLLMs) that generate text by gradually refining predictions for masked words. Unlike traditional autoregressive models that commit to a prediction at once, dLLMs allow for multiple revisions, which can be exploited by adversaries to inject bias into the generated text. The authors demonstrate a targeted bias injection attack that manipulates the model's output towards a specific demographic answer by adjusting the model's response during the denoising process. Their findings highlight the need for bias audits that consider the entire model operation, not just the static model i
