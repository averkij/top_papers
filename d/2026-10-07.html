tself."}, 'zh': {'title': '揭示去噪过程中的偏见注入攻击', 'desc': '本文介绍了一种新的攻击方法，针对掩蔽扩散语言模型（dLLMs）进行偏见注入。通过观察模型在去噪步骤中对特定答案的生成概率，攻击者可以动态调整干预策略，从而引导模型产生特定的答案。实验表明，这种方法在处理模糊问题时，能够显著提高模型对目标群体答案的偏好。研究结果强调了去噪过程作为dLLMs中的新控制通道，并呼吁对模型进行偏见审计。'}}}, {'id': 'https://huggingface.co/papers/2610.05870', 'title': 'Certification of Real Images through Calibrated Content Authentication', 'url': 'https://huggingface.co/papers/2610.05870', 'abstract': "Abstract  Generative models can synthesize high-quality inauthentic multimedia content that is already being misused at scale. We evaluate twenty deepfake detectors against ten generators released in the last four years and find accuracy decreasing over time, from near-perfect 99.5% to 76%. Adversarial perturbations further reduce every baseline detector to below 2% accuracy, effectively inverting the detector's assigned label. We argue that this unreliability reflects a fundamental ambiguity: generators can reproduce authentic content exactly (e.g., through memorization), so content alone cannot reveal the true provenance label.For this reason, content produced by a generator must admit a faithful reconstruction by that same generator, and finding such a reconstruction makes synthetic provenance plausible and authenticity plausibly deniable.We therefore propose and evaluate a detection paradigm that outputs a calibrated prediction of whether authenticity is plausibly deniable: a faithful reconstruction by any known generator establishes plausible deniability, while calibration bounds how often content from known generators fails to be reproduced. Our evaluation shows that (i) our detector can be calibrated so that at most 1% of generated content is wrongly certified, an operating point at which most baseline detectors reach near-zero recall, including the strongest with 93% accuracy; (ii) calibrating a stricter security threshold on attacked samples preserves this bound against adaptive adversaries within the evaluated bounded-perturbation attack space, whose perturbations break every baseline, but does not cover arbitrary adversarial transformations; and (iii) post-hoc verifiability is eroding, as 1,116 of 3,000 Reddit images resist reproduction by a 2022 generator, but only 55 to 79 resist reproduction by 2024 generators.", 'score': 10, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '4eb3bc66f5573388', 'authors': ['Sarim Hashmi', 'Abdelrahman Elsayed', 'Mohammed Talha Alam', 'Samuele Poppi', 'Nils Lukas'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence Abu Dhabi, UAE'], 'pdf_title_img': 'assets/pdf/title_img/2610.05870.jpg', 'data': {'categories': ['#cv', '#security', '#benchmark', '#synthetic'], 'emoji': '🎭', 'ru': {'title': 'Когда подлинность перестаёт быть очевидной: новый подход к детекции синтетических медиа', 'desc': 'Работа изучает проблему обнаружения дипфейков и находит, что точность детекторов снижается со временем с 99.5% до 76% по мере развития генераторов. Авторы показывают, что состояния самого контента недостаточно для определения его подлинности, так как генеративные модели могут точно воспроизвести оригинальные данные. Они предлагают новую парадигму детекции, основанную на концепции «правдоподобного отрицания подлинности»: если синтетический контент можно верно восстановить известным генератором, то его подлинность становится оспоримой. Экспериментальные результаты демонстрируют, что предложенный подход достигает калибровки с менее чем 1% ошибочной сертификации сгенерированного контента даже при наличии адаптивных противников.'}, 'en': {'title': 'Detecting Deepfakes: A New Paradigm for Plausible Deniability', 'desc': 'This paper investigates the effectiveness of deepfake detectors against advanced generative models that create realistic fake multimedia content. The study reveals a significant decline in detection accuracy over time, dropping from 99.5% to 76%, highlighting the challenges posed by adversarial attacks that can mislead detectors. The authors propose a new detection paradigm that assesses whether the authenticity of content can be plausibly denied, based on the ability of generators to reproduce their own outputs. Their findings indicate that while their method can maintain low false certification rates, the overall reliability of post-hoc verification is diminishing as newer generators become more adept at creating content that resists detection.'}, 'zh': {'title': '生成内容的真实性与可否认性', 'desc': '生成模型可以合成高质量的虚假多媒体内容，这些内容已经被大规模滥用。我们评估了二十种深度伪造检测器对比过去四年发布的十种生成器，发现检测准确率随着时间的推移而下降，从接近完美的99.5%降至76%。对抗性扰动进一步降低了每个基线检测器的准确率至2%以下，实际上颠覆了检测器的标签。我们提出了一种检测范式，能够输出关于真实性是否可以否认的校准预测，确保生成内容的可重建性与真实性的可否认性。'}}}, {'id': 'https://huggingface.co/papers/2610.05719', 'title': 'When to Switch: Reliable Action-Chunk Extension for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.05719', 'abstract': 'Abstract  Vision-Language-Action (VLA) models serve as unified policies for robotic manipulation, yet their expensive inference forces robots to pause between policy calls, resulting in stop-and-go execution that interrupts smooth motion and prolongs task completion. Extending the action chunk reduces policy calls and hence these pauses, but predicting farther into the future makes long-chunk execution unreliable. To understand where this unreliability arises, we analyze action errors within long chunks and find that they concentrate around transitions between manipulation subskills, growing sharply with chunk length. This suggests the importance of transition timing, i.e., when to switch subskills within a chunk. Motivated by this observation, we introduce RACE (Reliable Action-Chunk Extension), a framework that predicts the transition timing from an auxiliary one-step denoising pass and conditions action generation on it. By learning and conditioning on transition timing, RACE reduces errors at subskill transitions and enables reliable execution of longer action chunks. Across simulation benchmarks, RACE outperforms fine-tuning at the same chunk length; with 2x longer chunks, it surpasses recent state-of-the-art and efficient VLAs in success rate, and with 4x longer chunks, it remains competitive. On a real robot, RACE uses 4x longer chunks, which reduces the idle time caused by stop-and-go execution by about 5x, while achieving a higher success rate than fine-tuning with the same chunk length. Code and a real-robot demo are available at https://github.com/Seonghoon-Yu/RACE-VLA', 'score': 9, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '8a07ab3ae601eb97', 'authors': ['Seonghoon Yu', 'Dongwon Kim', 'HyungRok Jung', 'Yoonjae Baek', 'Byung-kwan Lee', 'Suha Kwak', 'Jeany Son'], 'affiliations': ['GIST', 'KAIST', 'NVIDIA', 'POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2610.05719.jpg', 'data': {'categories': ['#robotics', '#inference', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Надёжное расширение действий через предсказание переходов между навыками', 'desc': 'Статья посвящена улучшению Vision-Language-Action моделей для робототехники, которые страдают от дорогостоящей инференции и вынужденных пауз между вызовами политики. Авторы выявили, что ошибки в длинных последовательностях действий концентрируются в переходах между подзадачами манипуляции. Предложенный фреймворк RACE предсказывает моменты переключения подзадач через дополнительный процесс денойзинга и обусловливает генерацию действий этой информацией. Метод позволяет увеличить длину предсказываемых действий в 4 раза, значительно сокращая простои робота и повышая надёжность выполнения задач.'}, 'en': {'title': 'Enhancing Robotic Manipulation with Reliable Action Timing', 'desc': 'This paper introduces RACE, a framework designed to improve the performance of Vision-Language-Action (VLA) models in robotic manipulation. The main issue addressed is the inefficiency caused by frequent pauses during policy calls, which disrupts smooth motion. RACE focuses on predicting the optimal timing for transitions between different manipulation subskills, thereby reducing errors that occur during these transitions. By enabling longer action chunks with reliable execution, RACE significantly enhances the success rate of robotic tasks while minimizing idle time.'}, 'zh': {'title': '提升机器人操作效率的RACE框架', 'desc': '本文介绍了一种名为RACE（可靠动作块扩展）的框架，旨在提高机器人操作中的视觉-语言-动作（VLA）模型的执行效率。通过分析长动作块中的错误，发现错误主要集中在操作子技能之间的过渡时刻。RACE通过预测过渡时机并在此基础上生成动作，从而减少了子技能过渡时的错误，提高了长动作块的可靠性。实验结果表明，RACE在多个模拟基准测试中表现优于同长度的微调方法，并在实际机器人上显著减少了因停顿而造成的空闲时间。'}}}, {'id': 'https://huggingface.co/papers/2610.02331', 'title': 'World Editing: Intervening on Executable Worlds at Increasing Depth', 'url': 'https://huggingface.co/papers/2610.02331', 'abstract': 'Abstract  Interactive world models are increasingly capable of generating environments and acting within them, yet deliberately editing an existing executable world remains underexplored. We formulate world editing as intervening on an existing world while preserving properties that should remain unchanged, and introduce intervention depth as an axis describing how strongly an edit couples world entities, dynamics, and systems. We instantiate this capability through industry-grade game modding and introduce IGMWorld, together with IGMBench, a benchmark of 110 tasks and over 1.1K executable state and behavioral criteria across Minecraft and Terraria. The tasks span property, entity, dynamics, and system interventions and are evaluated through deterministic executability, behavioral, preservation, and visual checks. Frontier coding agents already exhibit substantial world-editing capability: the strongest configuration solves 78.2% of tasks under a strict task-level criterion, while criterion-level performance reaches 94.8%. Reliability generally decreases with intervention depth, and this pattern persists even among tasks with similar numbers of evaluation criteria. Most failed edits still build and load successfully, suggesting that the main difficulty is making the edited world behave as requested. Visual consistency remains a separate weakness, with all evaluated configurations below 50% joint visual pass rate. These results show that world editing is a distinct capability from world generation and interaction, and that executable games provide a practical testbed for studying it.', 'score': 8, 'issue_id': 3379, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e277bc51a2fd7c20', 'authors': ['Max Ku', 'Nok-Kan Law', 'Yu-Chien Tang', 'Shih-Ying Yeh', 'Ping Nie', 'Andy Zheng', 'Tat Hei Lai', 'Fei-Yueh Chen', 'Nikko Yu', 'Wei-Chieh Sun', 'Suzy Huang', 'Chiao-Wei Hsu', 'Chih-Chuan Huang', 'Chak-Wing Mak', 'Ho Yin Sam Ng', 'Edisy Kin Wai Chan', 'Min-Hung Chen', 'Ho Kei Cheng'], 'affiliations': ['Comfy Org Research', 'G-G-G', 'University of Illinois Urbana-Champaign', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2610.02331.jpg', 'data': {'categories': ['#agents', '#games', '#video', '#reasoning', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Редактирование интерактивных миров как отдельная компетенция AI-агентов', 'desc': 'В статье исследуется задача редактирования существующих интерактивных world models, которая заключается в целенаправленном изменении мира при сохранении его неизменяемых свойств. Авторы вводят концепцию глубины intervene, характеризующую степень связности между сущностями, динамикой и системами редактируемого мира. Они создали IGMWorld и IGMBench — benchmark с 110 задачами в Minecraft и Terraria, оценивающими редактирование через детерминированность, поведение, сохранение свойств и визуальную консистентность. Результаты показывают, что coding agents решают до 78.2% задач, но надежность снижается с увеличением глубины intervene, и основная сложность заключается в обеспечении правильного поведения отредактированного мира.'}, 'en': {'title': 'Revolutionizing World Editing: Beyond Generation and Interaction', 'desc': 'This paper explores the concept of world editing in interactive environments, focusing on how to modify existing worlds while keeping certain properties intact. It introduces the idea of intervention depth, which measures the extent to which edits affect various elements of the world. The authors present IGMWorld and IGMBench, a framework and benchmark for evaluating world editing tasks in games like Minecraft and Terraria. The findings reveal that while advanced coding agents can perform well in world editing, challenges remain in ensuring visual consistency and maintaining desired behaviors after edits.'}, 'zh': {'title': '探索世界编辑的新能力', 'desc': '本论文探讨了交互式世界模型在编辑现有可执行世界方面的能力。我们将世界编辑定义为在保持不变属性的情况下对现有世界进行干预，并引入干预深度作为描述编辑强度的指标。通过行业级游戏修改，我们实现了这一能力，并推出了IGMWorld和IGMBench，后者包含110个任务和超过1.1K的可执行状态和行为标准。研究表明，世界编辑与世界生成和交互是不同的能力，且可执行游戏为研究这一能力提供了实用的测试平台。'}}}, {'id': 'https://huggingface.co/papers/2609.36691', 'title': 'Video2Skill: From Streaming Experience to Reusable Embodied Skills', 'url': 'https://huggingface.co/papers/2609.36691', 'abstract': 'Abstract  Manipulation behaviors vary widely across objects and scenes, but they share a small set of reusable skills, and planning with these skills helps embodied agents generalize to new tasks. Yet an agent can only plan with skills it knows. Recovering skills from observed experience, the inverse of planning, builds this knowledge over time and yields skill data for training future agents. Vision-Language Models (VLMs) describe individual manipulation events well, but can they organize a stream of events into reusable skills? We formulate this problem as Streaming Embodied Skill Discovery (SESD): a model watches videos in sequence and maintains a persistent skill library that shapes its later decisions. To systematically measure this ability, we introduce Video2Skill, a benchmark that covers robot tabletop manipulation and human kitchen activity and tests three core capabilities: (i) locating manipulation events in time, (ii) grouping events of the same transformation, and (iii) deciding when to reuse an existing skill or create a new one. Across 19 open-source VLMs, many models group events at near-chance level, and scale does not consistently help. Their errors depend on how perception and library updates are coupled: joint models merge distinct transformations into one skill, while models that update the library from text descriptions duplicate recurring ones. Supervised fine-tuning, including our counterfactual library-state rebalancing (CLaRe), improves grouping but exposes a deeper bottleneck: trained models consolidate familiar skills yet rarely expand the library. Their libraries stall below half the reference size, and transformations unseen in training are located in time but almost never given a new skill. Recognizing when existing skills are insufficient thus emerges as the central challenge.', 'score': 8, 'issue_id': 3379, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '7db60347d2e7fc21', 'authors': ['Jianshu Zhang', 'Ce Zhang', 'Xiyuan Yang', 'Chenwei Xu', 'Haoran Lu', 'Yijiang Li', 'Yaqi Xie', 'Katia P. Sycara', 'Han Liu'], 'affiliations': ['CMU', 'Northwestern', 'UCSD', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2609.36691.jpg', 'data': {'categories': ['#robotics', '#open_source', '#dataset', '#video', '#reasoning', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Открытие переиспользуемых навыков из видеопотока — ключ к обобщению роботов', 'desc': 'В статье исследуется проблема автоматического обнаружения переиспользуемых навыков манипуляции из видеопотока. Авторы предлагают задачу Streaming Embodied Skill Discovery (SESD), где модель должна просматривать видео последовательно и поддерживать персистентную библиотеку навыков, включая способность определять моменты манипуляции, группировать события одного преобразования и решать, переиспользовать существующий навык или создать новый. Они создали бенчмарк Video2Skill с задачами манипуляции роботами и человеческой активностью на кухне, протестировав 19 open-source Vision-Language Models. Главный вывод: существующие VLM плохо справляются с группировкой событий и неохотно расширяют библиотеку новыми навыками, что указывает на необходимость лучше научить модели распознавать недостаточность имеющихся навыков.'}, 'en': {'title': 'Learning to Manipulate: Building a Library of Skills from Experience', 'desc': "This paper discusses how embodied agents can learn and organize manipulation skills from observing videos of tasks. It introduces the concept of Streaming Embodied Skill Discovery (SESD), where a model builds a library of skills by watching sequences of manipulation events. The authors present a benchmark called Video2Skill to evaluate the model's ability to identify, group, and reuse skills effectively. The findings reveal that many existing Vision-Language Models struggle with skill grouping and often fail to expand their skill libraries, highlighting the challenge of recognizing when to create new skills."}, 'zh': {'title': '技能发现：智能体的学习与规划之道', 'desc': '本论文探讨了如何从观察到的经验中恢复技能，以帮助智能体在新任务中进行规划。我们提出了流式具身技能发现（SESD）的问题，模型通过观看视频序列来维护一个持久的技能库。我们引入了Video2Skill基准，测试模型在定位操作事件、分组相同变换事件和决定何时重用技能或创建新技能方面的能力。研究发现，许多模型在事件分组上表现接近随机水平，且现有技能不足的识别成为主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.36684', 'title': 'ProgressCompass: Embodied Progress Reward Models Are Lost Without the Right Context', 'url': 'https://huggingface.co/papers/2609.36684', 'abstract': 'Abstract  Embodied agents now take on ever longer tasks. For long tasks, knowing only whether a task finally succeeds or fails says little; the steps along the way matter. Progress Reward Models (PRMs) score how far a task has come at every step, and serve as dense rewards, verifiers and monitors. Yet in long tasks the current frame alone often cannot tell how far the task has come, because progress depends on what happened before. We call this problem context-dependent progress estimation. Existing benchmarks on progress estimation mostly focus on short tasks whose progress can be read from the current observation, and whether PRMs can estimate progress when context is needed remains underexplored. We therefore build ContextProgress-Bench, with 24 manipulation tasks for 120 episodes. The benchmark covers three settings: (i) State Recall, where information needed for progress appeared earlier but is not in the current frame; (ii) Sequence Tracking, where steps follow a fixed order, so progress requires knowing which steps are done and which comes next; and (iii) Recurrence Disambiguation, where look-alike frames sit at very different progress. We then run a paired diagnosis: each PRM keeps the same input format in both runs, and in one run its instruction integrates the right context. Even PRMs that read the entire history get lost in estimating progress, yet with the right context the same five models cut their progress error by 77-82%. Embodied PRMs are thus not incapable of progress estimation, but lost without the right context. We therefore propose ProgressCompass, an autonomous agentic loop that reorients an existing PRM and uses current general-purpose VLMs to supply the context the PRM needs. Wrapped in the loop, the same frozen PRM cuts its progress error by 63% and raises its rank agreement by 76%. With such a compass, PRMs estimate progress far better on longer, more complex tasks.', 'score': 8, 'issue_id': 3379, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '327488bfe8dd9e17', 'authors': ['Jianshu Zhang', 'Keliang Wu', 'Chengxuan Qian', 'Xiyuan Yang', 'Ce Zhang', 'Ariel Tian', 'Anbang Liu', 'Haoran Lu', 'Han Liu'], 'affiliations': ['CMU', 'Northwestern', 'UCSB', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2609.36684.jpg', 'data': {'categories': ['#robotics', '#long_context', '#agents', '#reasoning', '#multimodal', '#benchmark'], 'emoji': '🧭', 'ru': {'title': 'Компас прогресса: контекст как ключ к пониманию долгосрочных задач', 'desc': 'В статье рассматривается проблема оценки прогресса в долгосрочных задачах для воплощённых агентов. Авторы выявляют, что текущий кадр часто недостаточен для определения прогресса, так как он зависит от контекста предыдущих действий. Они создают ContextProgress-Bench — бенчмарк с 24 задачами манипуляции, охватывающий три типа зависимостей от контекста. Затем предлагают ProgressCompass — автономный цикл, который помогает моделям вознаграждения прогресса лучше оценивать продвижение в сложных задачах, используя информацию из контекста и общих видеомодельных систем.'}, 'en': {'title': 'Navigating Progress: Context is Key for Long Task Success', 'desc': 'This paper addresses the challenge of estimating progress in long tasks for embodied agents, where traditional methods often fail due to context dependency. It introduces Progress Reward Models (PRMs) that provide dense rewards based on task progression at each step, but highlights that these models struggle without the necessary context from previous steps. The authors create a benchmark called ContextProgress-Bench to evaluate PRMs across various scenarios that require recalling past information. They propose a solution, ProgressCompass, which enhances PRMs by integrating context from general-purpose vision-language models, significantly improving progress estimation accuracy in complex tasks.'}, 'zh': {'title': '提升长任务进度估计的关键在于上下文', 'desc': '本文探讨了在长任务中，进度奖励模型（PRMs）如何评估任务的进展。由于长任务的进展依赖于之前的上下文信息，单靠当前帧往往无法准确判断进度。我们提出了ContextProgress-Bench基准，包含24个操作任务，旨在评估PRMs在不同上下文条件下的表现。通过引入ProgressCompass，我们的研究表明，提供正确的上下文信息可以显著提高PRMs在复杂任务中的进度估计能力。'}}}, {'id': 'https://huggingface.co/papers/2610.05622', 'title': 'UndoBench: Separating Task Competence from Recovery Capability in Tool-Using AI Agents', 'url': 'https://huggingface.co/papers/2610.05622', 'abstract': 'Abstract  Tool-using AI agents are increasingly deployed across enterprise software systems, yet widely used benchmarks primarily evaluate nominal task completion, conflating baseline planning competence with operational fault recovery. We introduce UndoBench, a benchmark spanning 36 base workflows and 36 fault scenarios across 8 enterprise domains, decoupling task competence from recovery capability via counterfactual paired trials under identical seeds alongside wire-level effect-history and environment-state oracles. On 12 held-out TEST workflows across two open-weight models, two frameworks, and three recovery paradigms (5,760 executions / 2,880 paired trials) in the frozen lost-acknowledgment study, nominal competence reached 83.54% while conditional recovery success rate (CRSR) fell to 46.72%, with naive retry producing duplicate external effects in 53.33% of trials. Extensions to commercial API models reproduced this competence-recovery separation. Evaluations across complementary execution boundaries show that recovery is phase-dependent: before mutation, methods perform similarly without duplicate effects among capable trials; during partial mutation, naive retry, per-call idempotency, and zero-privilege journaling collapse on the evaluated composite workflows; after commit but before acknowledgment, verification and server-side idempotency substantially improve safety. These findings demonstrate that evaluating nominal completion alone masks critical, phase-dependent recovery vulnerabilities in autonomous agents.', 'score': 8, 'issue_id': 3378, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'f5da0cf0d71fc017', 'authors': ['Dolly Sah', 'Tanmay Sah', 'Harshul Jain', 'Tanya Sah'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.05622.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Разделение оценки компетентности и восстановления в AI агентах', 'desc': 'В работе представлена UndoBench — бенчмарк для оценки способности AI агентов восстанавливаться после ошибок в корпоративном ПО. Авторы показывают, что стандартные метрики завершения задач (83.54%) не отражают реальную способность к восстановлению после сбоев (46.72%), так как наивные повторные попытки приводят к дублированию внешних эффектов. Исследование демонстрирует, что эффективность восстановления зависит от фазы выполнения: разные методы (повторы, идемпотентность, верификация) показывают разные результаты в зависимости от того, когда произошла ошибка. Выводы подчёркивают необходимость разделения оценки планирования и отказоустойчивости при тестировании autonomous agents.'}, 'en': {'title': 'Evaluating AI: Beyond Task Completion to Recovery Resilience', 'desc': "This paper presents UndoBench, a new benchmark designed to evaluate AI agents' ability to recover from faults in enterprise software systems. It separates the assessment of task completion from the ability to recover from errors by using counterfactual trials and detailed tracking of effects and states. The study reveals that while AI agents can achieve high task completion rates, their success in recovering from failures is significantly lower, highlighting vulnerabilities in their operational capabilities. The findings emphasize the importance of evaluating both task competence and recovery strategies to ensure robust performance in real-world applications."}, 'zh': {'title': '评估AI代理的恢复能力至关重要', 'desc': '本文介绍了一种新的基准测试工具，名为UndoBench，旨在评估企业软件系统中使用的AI代理的任务完成能力和故障恢复能力。该基准测试涵盖了36个基本工作流程和36种故障场景，通过对比实验将任务能力与恢复能力分开评估。研究发现，虽然在任务完成率上表现良好，但在故障恢复成功率上却显著下降，显示出仅评估任务完成率可能掩盖了关键的恢复脆弱性。通过对不同执行阶段的评估，结果表明恢复能力与执行阶段密切相关，强调了全面评估AI代理的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.04616', 'title': 'PerturBot: Breaking Shortcut Priors in Vision-Language-Action Models with Perturbative Training', 'url': 'https://huggingface.co/papers/2610.04616', 'abstract': 'Abstract  A vision--language--action (VLA) policy can complete complex tasks while ignoring the evidence that should determine its actions. An object held near the wrist camera can displace the instructed target. Language and action show the same pattern: a familiar noun can trigger the operation it was paired with in training even after the verb changes, and a gripper that closed on nothing may lift anyway. We call these dependencies modality shortcuts: regularities in successful demonstrations make visual, lexical, or motor cues sufficient to predict expert actions without the task evidence needed for the underlying decision. More demonstrations of the same kind can raise task success while leaving these shortcuts intact. We propose Perturbot which makes task-relevant evidence easier to use and shortcuts insufficient on their own: it applies task-preserving wrist-view perturbations, enriches instructions with decision-relevant captions, and adds random and failed trajectory segments relabeled with the behavior they contain. It complements scaling by changing what is scaled, and leaves inference unchanged. Moreover, we propose GroundingFscore, an offline score that diagnoses how severely a policy relies on modality shortcuts. Task success rate shows whether a policy improves, while GroundingFscore reveals whether the policy scales healthily, relying on task evidence rather than shortcuts. Together, Perturbot and GroundingFscore provide a training-and-evaluation framework for disentangling VLA decisions from shortcut priors while preserving responsiveness to task-relevant evidence.', 'score': 8, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '321736009eab9e99', 'authors': ['Mingyu Liu', 'Chonghao Sima', 'Tianjian Feng', 'Hanqing Wang', 'Cong Chen', 'Hao Chen', 'Chunhua Shen'], 'affiliations': ['HKUST(GZ)', 'Shanghai Innovation Institute', 'University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04616.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Борьба с модальными ярлыками в робот-политиках: обучение по настоящим задачам, а не по случайным признакам', 'desc': 'В статье исследуется проблема модальных ярлыков (modality shortcuts) в политиках vision-language-action, когда модель предсказывает действия на основе случайных визуальных или языковых признаков, а не задачи. Авторы предлагают Perturbot — метод обучения, который использует возмущения изображений камеры запястья, расширенные описания инструкций и добавление отказавшихся траекторий для повышения надёжности обучения. Они также вводят GroundingFscore — метрику, которая измеряет степень зависимости политики от модальных ярлыков в отличие от метрики успеха задачи. Предложенный фреймворк позволяет обучать робот-политики, которые полагаются на релевантные задаче доказательства, а не на случайные корреляции в данных.'}, 'en': {'title': 'Enhancing VLA Policies: From Shortcuts to Evidence', 'desc': 'This paper introduces a new approach called Perturbot to improve vision-language-action (VLA) policies in machine learning. It identifies a problem where these policies rely on modality shortcuts, which are cues that can lead to successful actions without considering the actual task evidence. Perturbot enhances the training process by introducing perturbations and enriched instructions, making it harder for the model to depend solely on these shortcuts. Additionally, the authors propose GroundingFscore, a metric to evaluate how much a policy relies on these shortcuts versus actual task evidence, ensuring that improvements in task success are meaningful and robust.'}, 'zh': {'title': '提升视觉-语言-动作策略的有效性', 'desc': '本文提出了一种视觉-语言-动作（VLA）策略，能够在忽略任务证据的情况下完成复杂任务。我们发现，某些模式依赖性（如模态快捷方式）使得视觉、语言或动作线索能够在没有必要的任务证据的情况下预测专家行为。为了解决这个问题，我们提出了Perturbot，它通过引入任务相关的扰动和丰富的指令来增强策略的有效性。我们还提出了GroundingFscore，用于评估策略对模态快捷方式的依赖程度，从而确保策略在依赖任务证据的同时保持响应性。'}}}, {'id': 'https://huggingface.co/papers/2609.39420', 'title': 'QuantCode Model: Specializing Language Models for Executable Algorithmic Trading Code', 'url': 'https://huggingface.co/papers/2609.39420', 'abstract': "Abstract  Large language models are strong general-purpose code generators, but executable algorithmic trading remains a demanding specialization target: a model must translate a natural-language strategy specification into correct program logic for a specialized trading framework, execute on historical data, produce trades, and remain semantically faithful to the request. We study two complementary mechanisms for specializing language models for this setting: continued pretraining on algorithmic-trading framework code and supervised fine-tuning (SFT) on agent-validated request-to-code pairs. Evaluation is centered on QuantCode-Bench, our 400-task benchmark for Backtrader strategy generation, together with a repository-level SWE-bench-like track. Continued pretraining improves single-turn Judge Pass from 41.5% to 47.5% for Qwen3.5-397B-A17B and from 27.8% to 33.0% for Qwen3.6-35B-A3B. SFT applied after continued pretraining yields a larger gain for Qwen3.6-35B-A3B, reaching 58.2% Judge Pass and 83.5% successful backtests; in agentic evaluation it raises first-turn success from 22.3% to 58.3% and final success after up to 10 turns from 47.5% to 79.5%. Continued pretraining alone improves first-turn agentic success but lowers final success after repair from 47.5% to 32.5%, consistent with degraded instruction following, whereas SFT improves both. We also identify a capability-retention failure: domain specialization degrades parser-conformant structured tool calling, and targeted recovery SFT restores tool-call formatting but not the base checkpoint's repository-level agent performance. The results show that framework-oriented pretraining, validated SFT, and explicit capability-retention evaluation address distinct failure modes in domain-specific executable code generation.", 'score': 8, 'issue_id': 3377, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'e14740739029f275', 'pdf_title_img': 'assets/pdf/title_img/2609.39420.jpg', 'data': {'categories': ['#agents', '#optimization', '#open_source', '#training', '#benchmark', '#plp'], 'emoji': '📈', 'ru': {'title': 'Специализация языковых моделей для генерации исполняемого кода алготрейдинга', 'desc': "В работе исследуется адаптация больших языковых моделей для специализированной задачи генерации торговых алгоритмов на платформе Backtrader. Авторы применяют два дополнительных механизма обучения: continued pretraining на коде фреймворка алготрейдинга и supervised fine-tuning на валидированных примерах пар 'запрос-код'. Результаты показывают, что continued pretraining улучшает качество с 41.5% до 47.5% для Qwen3.5-397B, а применение SFT после pretraining достигает 58.2% успешных трансляций и 83.5% корректных backtests. Исследование выявило критическую проблему: специализация домена деградирует способность модели к структурированному форматированию вызовов инструментов, что требует дополнительного целевого обучения для восстановления этой функции."}, 'en': {'title': 'Specializing Language Models for Algorithmic Trading Success', 'desc': "This paper explores how to enhance large language models for generating executable code in algorithmic trading. It introduces two methods: continued pretraining on trading framework code and supervised fine-tuning (SFT) using validated request-to-code pairs. The study uses a benchmark called QuantCode-Bench to evaluate the models' performance, showing significant improvements in generating correct trading strategies. The findings highlight the importance of specialized training and evaluation to address specific challenges in code generation for trading applications."}, 'zh': {'title': '专注于算法交易的语言模型优化', 'desc': '这篇论文研究了如何将大型语言模型专门化为算法交易的代码生成器。作者提出了两种方法：在算法交易框架代码上进行持续预训练，以及在经过验证的请求到代码对上进行监督微调（SFT）。研究表明，持续预训练和SFT都能显著提高模型在交易策略生成任务中的表现。结果显示，框架导向的预训练和经过验证的SFT能够有效解决特定领域可执行代码生成中的不同失败模式。'}}}, {'id': 'https://huggingface.co/papers/2610.06851', 'title': 'Base Models Can Reason By Taking a Cue From Training Data', 'url': 'https://huggingface.co/papers/2610.06851', 'abstract': 'Abstract  In this paper, we study how training data creates associations between the tokens at the start of a base model\'s response and the reasoning behavior that follows. First, we demonstrate that fixing particular starting token cues makes a base model\'s performance competitive with that of its reinforcement learning (RL)-trained counterparts on math and coding. For instance, the cue ".\\n\\nOkay" raises Olmo-3-7B\'s MATH-500 pass@1 accuracy from 42% to 78%, while "Alright," raises Qwen3-14B\'s from 72% to 87%. Second, RL makes these cues more likely, while fixing them recovers much of its performance gain over the base model. Third, we trace the reasoning effects of token cues to the training data. We perform causal data interventions to turn an arbitrary word, such as "chicken", into an effective reasoning cue, or remove an existing cue\'s effect. A similar edit makes the prompt instruction "Think duck duck goose" as effective as "Think step by step" at eliciting reasoning. We also find that the hidden state representations induced by different cues correlate with different document types from the training set. Finally, we extend our study of token cues with a case study in language model safety, finding that different cues elicit distinct refusal and compliance behaviors that correspond to different types of training data.', 'score': 8, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '8015dd8e4a3e5a36', 'authors': ['Sophie L. Wang', 'Amil Dravid', 'Rulin Shao', 'Kevin Farhat', 'Sewon Min', 'Alexei A. Efros'], 'affiliations': ['Allen Institute for AI', 'MIT', 'UC Berkeley', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.06851.jpg', 'data': {'categories': ['#training', '#alignment', '#math', '#interpretability', '#reasoning', '#rlhf'], 'emoji': '🔮', 'ru': {'title': 'Начальные токены как ключ к рассуждениям языковых моделей', 'desc': 'В этой работе исследуется, как данные обучения создают ассоциации между начальными токенами в ответах базовой модели и последующим поведением рассуждений. Авторы показывают, что фиксация определённых стартовых токенов делает производительность базовой модели конкурентной с моделями, обученными через обучение с подкреплением, на задачах математики и кодирования. Через интервенции в обучающих данных они демонстрируют, что можно превратить произвольное слово в эффективный сигнал для рассуждения или удалить эффект существующего сигнала. Исследование также выявляет, что скрытые представления, индуцированные разными токенами, коррелируют с различными типами документов из набора обучения и влияют на поведение моделей в контексте безопасности.'}, 'en': {'title': 'Unlocking Model Performance with Strategic Token Cues', 'desc': "This paper explores how the initial tokens in a model's response influence its reasoning abilities. By fixing specific starting cues, the authors show that a base model can achieve performance levels similar to those trained with reinforcement learning (RL) on tasks like math and coding. They demonstrate that certain cues significantly improve accuracy and that these cues are shaped by the training data. Additionally, the study reveals that different cues can lead to varying behaviors in language model safety, highlighting the importance of token selection in model performance and behavior."}, 'zh': {'title': '训练数据与推理行为的关联', 'desc': '本文研究了训练数据如何在基础模型响应的起始标记与后续推理行为之间建立关联。我们发现，通过固定特定的起始标记提示，可以使基础模型在数学和编码任务上的表现与强化学习（RL）训练的模型相当。例如，提示".\n\nOkay"将Olmo-3-7B的MATH-500通过率从42%提高到78%。此外，强化学习使这些提示更可能出现，而固定这些提示则恢复了基础模型的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2610.04318', 'title': 'Rethinking Long-Video Efficiency: A Joint Allocation Perspective on Frames, Pixels, and Front-End Latency', 'url': 'https://huggingface.co/papers/2610.04318', 'abstract': "Abstract  Efficient long-video understanding with vision-language models (VLMs) is often framed as selecting informative frames or visual tokens at a fixed native resolution. We show that per-frame resolution can instead be traded for denser temporal coverage, while front-end decoding latency depends on the size of the candidate pool rather than the final token budget. An empirical study across multiple VLMs and long-video benchmarks yields three findings: dense low-resolution sampling outperforms sparse native-resolution sampling at matched token budgets; resolution-sensitive tasks benefit from selected high-resolution frames; and front-end decoding dominates wall time for hour-long videos. Motivated by these findings, we introduce LoHi, a training-free, single-pass framework that combines a dense low-resolution video stream with sparse high-resolution image frames through the VLM's native video and image pathways. LoHi-Anchor selects high-resolution frames using codec I-frame metadata, while LoHi-SemDiv uses query relevance and visual diversity over CLIP features. Across three long-video benchmarks, LoHi improves average accuracy by 10.6 percentage points over the native-resolution baseline at a matched token budget and by 5.2 percentage points over the strongest prior efficiency method. It also reduces front-end decoding latency by up to 7x on hour-long videos. Project page: https://sixundong.com/projects/lohi", 'score': 8, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '9c4ed78282dacde3', 'authors': ['Sixun Dong', 'Wei Li', 'Andong Deng', 'Qi Qian', 'Victor Zhu', 'Zhengping Ji', 'Chen Chen'], 'affiliations': ['Axon', 'Meta Reality Labs', 'University of Central Florida'], 'pdf_title_img': 'assets/pdf/title_img/2610.04318.jpg', 'data': {'categories': ['#video', '#inference', '#long_context', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Плотность временных кадров вместо высокого разрешения для анализа длинных видео', 'desc': 'Исследование показывает, что для эффективного анализа длинных видео с моделями vision-language можно использовать комбинацию плотной выборки кадров низкого разрешения с редкой выборкой высокого разрешения. Авторы предлагают LoHi — метод без переобучения, который объединяет низкорезольционный видеопоток с избранными высокорезольционными кадрами через встроенные пути обработки видео и изображений модели. LoHi-Anchor выбирает важные кадры по метаданным кодека, а LoHi-SemDiv использует релевантность запроса и визуальное разнообразие на основе CLIP-признаков. Метод достигает улучшения на 10.6 процентных пункта в точности при одинаковом бюджете токенов и сокращает время предварительной обработки видео в 7 раз.'}, 'en': {'title': 'LoHi: Efficient Long-Video Understanding with Smart Frame Selection', 'desc': 'This paper presents a new approach called LoHi for efficiently understanding long videos using vision-language models (VLMs). It demonstrates that using a combination of low-resolution video frames and selectively chosen high-resolution frames can enhance performance while reducing processing time. The study reveals that dense low-resolution sampling is more effective than sparse high-resolution sampling when the number of tokens is kept constant. LoHi achieves significant improvements in accuracy and reduces decoding latency, making it a promising solution for long-video analysis.'}, 'zh': {'title': '高效长视频理解的新方法：LoHi', 'desc': '这篇论文探讨了如何使用视觉语言模型（VLMs）高效理解长视频。研究表明，低分辨率的密集采样在匹配的标记预算下，优于稀疏的原生分辨率采样。论文提出了LoHi框架，它结合了低分辨率视频流和稀疏的高分辨率图像帧，从而提高了视频理解的准确性和效率。实验结果显示，LoHi在多个长视频基准测试中，平均准确率提高了10.6个百分点，同时前端解码延迟减少了多达7倍。'}}}, {'id': 'https://huggingface.co/papers/2610.04137', 'title': 'Dynamic Harness Search: Building Multi-Agent Systems Per-Query via Prediction', 'url': 'https://huggingface.co/papers/2610.04137', 'abstract': 'Abstract  Agent harnesses specify the roles, instructions, tools, and communication structure used to solve a task, and the right harness depends on the query. Because the value of each design choice is observable only through execution, tailoring a harness to each query has required either executing alternatives at inference time or costly manual design. We introduce SHIFT, which moves execution out of the per-query search loop. A local LLM architect learns a policy over harness-building actions from search, and a value function that predicts, from measured executions, a utility balancing accuracy against execution cost. For each query, Monte Carlo tree search uses these predictions to construct a harness. Across 9,193 tasks in six benchmarks, from math to document and general-assistant tasks, with a Gemini 3.5 Flash executor, SHIFT attains the highest mean accuracy, about 80%, outperforming 17 baselines that span prompting, prompt optimization, and workflow search, and exceeding the strongest baseline by 7.2 percentage points. A cheaper mode of SHIFT also attains a higher mean accuracy than every baseline while using 32% fewer execution tokens than the strongest baseline. We further show that choosing structure, instructions, and tools jointly beats choosing only instructions or only tools by up to 9.1 percentage points, and that learned value selection identifies more accurate harnesses with lower execution cost from candidate pools.', 'score': 7, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'c8470b13b242ffc7', 'authors': ['Som Sagar', 'Shasha Li', 'Hejie Cui', 'Ransalu Senanayake', 'Sercan Ö. Arık'], 'affiliations': ['Arizona State University', 'Google'], 'pdf_title_img': 'assets/pdf/title_img/2610.04137.jpg', 'data': {'categories': ['#agents', '#rl', '#training', '#benchmark'], 'emoji': '🏗️', 'ru': {'title': 'Умная архитектура агентов: учимся выбирать конфигурацию вместо её перебора', 'desc': 'Авторы предлагают SHIFT — метод для автоматического подбора оптимальной конфигурации агента (включая роли, инструкции, инструменты и структуру коммуникации) для каждого запроса без необходимости выполнения всех вариантов во время инференса. Локальная LLM обучается на основе поиска предсказывать оптимальные действия по построению конфигурации и оценивать полезность, балансируя точность и вычислительные затраты. Для каждого запроса используется поиск методом Монте-Карло для конструирования оптимальной конфигурации агента. На наборе из 9193 задач метод достигает 80% точности, превосходя 17 базовых подходов и демонстрируя возможность совместного выбора структуры, инструкций и инструментов для улучшения производительности.'}, 'en': {'title': 'SHIFT: Optimizing Agent Harnesses for Better Performance and Efficiency', 'desc': 'The paper introduces SHIFT, a method for optimizing agent harnesses used in machine learning tasks. It leverages a local large language model (LLM) to learn a policy for building harnesses based on previous executions, thus avoiding the need for costly manual design or real-time execution during query processing. By employing Monte Carlo tree search, SHIFT effectively balances accuracy and execution cost, achieving superior performance across various benchmarks. The results demonstrate that SHIFT not only outperforms existing methods but also reduces execution costs while improving accuracy by selecting the best combination of structure, instructions, and tools.'}, 'zh': {'title': 'SHIFT：优化任务执行的智能代理工具选择', 'desc': '本文介绍了一种名为SHIFT的框架，用于优化任务执行中的代理工具选择。SHIFT通过将执行过程移出每个查询的搜索循环，利用局部大语言模型（LLM）学习构建代理工具的策略和价值函数。通过蒙特卡洛树搜索，SHIFT能够为每个查询构建最优的代理工具组合，从而在多个基准测试中实现了最高的平均准确率，超过了17个基线方法。研究表明，联合选择结构、指令和工具的方式比单独选择指令或工具的方式更具优势，能够显著提高准确性并降低执行成本。'}}}, {'id': 'https://huggingface.co/papers/2610.06617', 'title': 'RealtimeWAM: One-Step Asynchronous World Action Models', 'url': 'https://huggingface.co/papers/2610.06617', 'abstract': "Abstract  World Action Models (WAMs) incorporate visual representations from video generation backbones to guide action prediction. Recent efficient WAMs adopt Mixture-of-Transformers (MoT) architectures and compute video representations once for reuse by the action expert. However, intra-expert iteration (\\ie, multi-step action denoising) and inter-expert waiting (\\ie, sequential execution of the video and action experts) still limit inference efficiency. To this end, we present RealtimeWAM, an extremely efficient WAM variant with one-step action generation and asynchronous inference, addressing these two bottlenecks. To reduce intra-expert iteration, we propose Teacher-Anchored Consistency Distillation (TACD) to address a local-global error gap: low local consistency error alone does not guarantee accurate final actions. TACD supplements local consistency with explicit supervision from the frozen teacher's multi-step rollout endpoint, enabling accurate one-step action generation. Additionally, we propose Cross-Expert Wavefront Pipelining (CEWP) to eliminate unnecessary expert-level waiting. It overlaps the two experts through block-wise sharing of the video KV cache, synchronizing only immediately before the corresponding action attention consumes it. Extensive experiments across diverse benchmarks (\\eg, LIBERO, LIBERO-Plus and RoboTwin) and model variants (\\eg, Fast-WAM and Faster-WAM) demonstrate the superiority of RealtimeWAM. Notably, RealtimeWAM maintains near-lossless performance (\\ie, <1% drop) across these benchmarks while delivering significant end-to-end speedup (\\eg, sim25times on H100). Our code and checkpoints are available via this https://github.com/ModelTC/LightX2V/tree/main/examples/realtimewam{link}.", 'score': 7, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '6d204bc3805c7d0e', 'authors': ['Chengtao Lv', 'Jinyang Du', 'Shuyi Feng', 'Yang Yong', 'Shiqiao Gu', 'Shunzi Yang', 'Ruihao Gong', 'Shen Ren', 'Tianwei Zhang', 'Wenya Wang'], 'affiliations': ['Beihang University', 'Continental Automotive Singapore', 'Nanyang Technological University', 'Sensetime'], 'pdf_title_img': 'assets/pdf/title_img/2610.06617.jpg', 'data': {'categories': ['#architecture', '#video', '#training', '#robotics', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Молниеносное предсказание действий через параллельный конвейер экспертов', 'desc': 'В статье представлена RealtimeWAM — эффективная модель мировых действий, которая предсказывает действия робота на основе видеопотока. Основное улучшение достигается за счёт одношагового генерирования действий вместо многошагового уточнения, а также асинхронной работы видео- и действийных экспертов. Авторы предложили Teacher-Anchored Consistency Distillation для дистилляции знаний от учительской модели и Cross-Expert Wavefront Pipelining для параллельного выполнения компонентов. Экспериментальные результаты показывают ускорение в 25 раз на GPU H100 с минимальной потерей качества предсказания действий.'}, 'en': {'title': 'RealtimeWAM: Fast and Accurate Action Prediction', 'desc': "The paper introduces RealtimeWAM, a highly efficient variant of World Action Models (WAMs) that enhances action prediction by utilizing visual representations from video generation. It addresses inefficiencies in traditional WAMs by implementing one-step action generation and asynchronous inference, which reduces the time taken for predictions. The method employs Teacher-Anchored Consistency Distillation (TACD) to improve action accuracy by aligning local consistency with a teacher model's guidance. Additionally, Cross-Expert Wavefront Pipelining (CEWP) is introduced to minimize waiting times between action and video experts, resulting in significant speed improvements while maintaining high performance across various benchmarks."}, 'zh': {'title': '高效实时动作生成模型', 'desc': '本文介绍了一种新的世界动作模型（WAM）变体，称为RealtimeWAM，旨在提高动作生成的效率。通过引入教师锚定一致性蒸馏（TACD），该方法解决了局部一致性与全局准确性之间的误差差距，从而实现了一步动作生成。为了消除专家级等待，RealtimeWAM采用了跨专家波前流水线（CEWP），通过块级共享视频KV缓存来重叠两个专家的执行。实验结果表明，RealtimeWAM在多个基准测试中表现优越，同时实现了显著的端到端加速。'}}}, {'id': 'https://huggingface.co/papers/2609.35751', 'title': 'How to Loop MoE: Flatten the Experts, Untie the Attention', 'url': 'https://huggingface.co/papers/2609.35751', 'abstract': 'Abstract  Looped Transformers reuse one block of layers several times: by spending extra computation they push a model of fixed size further, and so use its parameters more fully; while sparse mixture-of-experts (MoE) models activate only a few of many experts for each token. Looped MoE bridges these two design philosophies and gives MoE models new potential for better expert usage, but it raises a question: how to loop a MoE? We answer it with Foil. With the expert parameters and the expert compute per token held fixed, Foil (1) flattens the experts, halving the expert layers, doubling the experts per layer and doubling the passes, so that every routing decision chooses from a larger pool, and (2) unties the attention, giving each pass its own attention parameters while the experts and routers stay shared. Experiments show that Foil clearly outperforms the unflattened looped baseline: at 20B tokens every Foil model has lower pretraining loss than the baseline; at 100B tokens the loss improves monotonically with the degree of flattening, the most flattened Foil ending 0.012 nat below the baseline at equal parameters and compute, with downstream accuracy on par or better; untying the attention also yields more balanced and more confident routing at equal shape. Our ablations analyse why Foil works and turn the findings into design guidance for looped MoE: the returns of looping and of widening the expert layers amplify each other, routing confidence tracks healthy expert use better than load balance, and a sparse looped MoE should therefore use more experts per layer and more passes. Code and configurations are available at https://github.com/SR-A-W/how-to-loop-moe.', 'score': 6, 'issue_id': 3378, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '18c4c5cf53c2b514', 'authors': ['Shouren Wang', 'Chuang Ma', 'Mohsen Hariri', 'Debargha Ganguly', 'Wang Yang', 'Xiaoqing Tong', 'Qianying Liu', 'Xiaotian Han', 'Vipin Chaudhary'], 'affiliations': ['Case Western Reserve University', 'Kyoto University', 'NII LLMC'], 'pdf_title_img': 'assets/pdf/title_img/2609.35751.jpg', 'data': {'categories': ['#optimization', '#training', '#architecture'], 'emoji': '🔄', 'ru': {'title': 'Как правильно развернуть циклическую смесь экспертов: расширение вширь для лучшей маршрутизации', 'desc': 'В статье предложен метод Foil для эффективного использования циклических трансформеров с механизмом разреженной смеси экспертов (MoE). Основная идея заключается в переструктуризации экспертных слоёв: авторы увеличивают количество экспертов в каждом слое, уменьшая количество слоёв, что позволяет каждому решению маршрутизации выбирать из большего пула экспертов. Дополнительно они развязывают параметры внимания для каждого прохода через сеть, сохраняя общие параметры экспертов и маршрутизаторов. Экспериментальные результаты показывают, что Foil достигает лучшей потери обучения и сбалансированной маршрутизации по сравнению с базовым подходом при одинаковых параметрах и вычислительных затратах.'}, 'en': {'title': 'Enhancing Expert Utilization with Looped MoE and Foil', 'desc': 'The paper introduces Looped MoE, a new approach that combines the benefits of Looped Transformers and sparse mixture-of-experts (MoE) models. It presents a method called Foil, which optimizes expert usage by flattening the expert layers and allowing multiple passes through the model. This results in improved routing decisions and better performance, as shown by lower pretraining loss and competitive downstream accuracy. The findings provide valuable design guidance for implementing looped MoE models effectively.'}, 'zh': {'title': '循环专家模型的新潜力', 'desc': '这篇论文介绍了一种新的模型设计方法，称为Foil，它结合了循环变换器和稀疏专家混合模型（MoE）的优点。Foil通过扁平化专家层和解耦注意力机制，提升了专家的使用效率，使得每个路由决策可以从更大的专家池中选择。实验结果表明，Foil在预训练损失上明显优于未扁平化的基线模型，并且在下游任务的准确性上表现相当或更好。研究还提供了设计指导，强调了循环和扩展专家层的收益是相互增强的。'}}}, {'id': 'https://huggingface.co/papers/2610.06666', 'title': 'What Matters for Latent Reasoning with Flow Matching', 'url': 'https://huggingface.co/papers/2610.06666', 'abstract': "Abstract  Latent reasoning lets a large language model (LLM) think in a continuous space and verbalize only the answer. We argue that an effective latent thought must meet five requirements: it should be useful, helping produce the correct answer rather than merely changing it, diverse, so that resampling yields different reasoning trajectories, explainable, so that a decoded chain of thought (CoT) reflects reasoning the answer actually follows, refinable with more inference compute, and efficient, costing less than an explicit CoT at comparable accuracy. Current methods rarely meet these requirements: they learn shortcuts from the question, distill the explicit CoT into their weights, or imitate it one token at a time. We focus on flow matching in a learned latent space, the family we argue is best placed to meet them, and identify the training choices that make it work. The result is Flow-based Latent Reasoning (FLaRe), a simple recipe covering what the latent space encodes and how to shape it, where to train the flow, how to read out the answer, and a final stage of training on the model's own verified thoughts. A probe for each requirement shows that FLaRe improves on prior latent methods in all five. It also compares favorably with them on arithmetic benchmarks, while reaching 97% of the accuracy of explicit CoT at a quarter of its latency.", 'score': 6, 'issue_id': 3378, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '900e0f8975b73f0d', 'authors': ['Yassine Ouali', 'Adrian Bulat', 'Georgios Tzimiropoulos'], 'affiliations': ['Queen Mary University of London', 'Samsung AI Cambridge', 'Technical University of Iasi'], 'pdf_title_img': 'assets/pdf/title_img/2610.06666.jpg', 'data': {'categories': ['#interpretability', '#reasoning', '#training', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Скрытое рассуждение через обучение потоков в непрерывном пространстве', 'desc': 'В этой работе предлагается метод скрытого рассуждения для больших языковых моделей, позволяющий им думать в непрерывном пространстве без явной вербализации промежуточных шагов. Авторы определяют пять критериев эффективного скрытого мышления: полезность, разнообразие траекторий рассуждений, интерпретируемость, возможность улучшения с помощью дополнительных вычислений и вычислительная эффективность. Предложенный метод Flow-based Latent Reasoning (FLaRe) использует flow matching в обученном скрытом пространстве и включает специальный этап обучения на проверенных мыслях самой модели. Экспериментальные результаты показывают, что FLaRe достигает 97% точности явной цепи рассуждений при четырёхкратном снижении задержки.'}, 'en': {'title': 'Enhancing LLMs with Flow-based Latent Reasoning', 'desc': 'This paper introduces Flow-based Latent Reasoning (FLaRe), a method that enhances the reasoning capabilities of large language models (LLMs) by operating in a continuous latent space. FLaRe aims to fulfill five key requirements for effective latent reasoning: usefulness, diversity, explainability, refinability, and efficiency. The authors demonstrate that FLaRe outperforms existing latent reasoning methods by improving on all five criteria and achieving high accuracy on arithmetic tasks with significantly lower latency. By focusing on flow matching in a learned latent space, FLaRe provides a structured approach to training and utilizing latent reasoning in LLMs.'}, 'zh': {'title': '流匹配：提升潜在推理的有效性', 'desc': '潜在推理使大型语言模型（LLM）能够在连续空间中思考并仅表达答案。有效的潜在思维必须满足五个要求：有用性、多样性、可解释性、可精炼性和高效性。当前的方法往往无法满足这些要求，通常会从问题中学习捷径或逐个模仿显式思维链。我们提出了一种基于流匹配的潜在推理方法（FLaRe），它在所有五个要求上都优于以往的潜在方法，并在算术基准测试中表现良好。'}}}, {'id': 'https://huggingface.co/papers/2610.02150', 'title': 'From Knowledge Access to Source Learning: Developing Source-Specific Competence', 'url': 'https://huggingface.co/papers/2610.02150', 'abstract': 'Abstract  Large language model (LLM) agents increasingly rely on persistent external sources to solve sequences of knowledge-intensive tasks. Existing methods improve how source content is accessed and organized, while agent-memory systems preserve reusable knowledge from prior interactions, but repeated use of the same source is still largely treated as repeated access rather than an opportunity to progressively improve understanding of that source. We study source learning: developing reusable source-specific competence over a persistent authoritative source. We represent this competence with a persistent source model that captures reusable understanding of the source, including how its knowledge is structured, interpreted, and applied. To construct and progressively refine such models, we propose SourceLearn, which combines two complementary learning mechanisms. Self-Directed Source Learning identifies what remains incompletely understood and adaptively revisits the source, while Task-Guided Source Learning uses downstream experience to reveal local representational gaps and recurring needs in how source knowledge should be organized. In both cases, learning signals determine what should be reconsidered, while persistent updates are reconstructed from the authoritative source. Across five benchmarks and three LLM backends, SourceLearn achieves the best performance in 13 of 15 settings, with gains of up to 22.6 points over Hybrid RAG and substantial overall improvements over static source representations and experience-based memory baselines.', 'score': 6, 'issue_id': 3377, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd09206b5ab2f2201', 'authors': ['Lucheng Fu', 'Kejing Xia', 'Yiyang Wang', 'Yiqiao Jin', 'Jinjin He', 'Xiyuan Yang', 'Haoxin Liu', 'Ye Yu', 'Haibo Jin', 'Yijia Xiao', 'Wenke Lee', 'B. Aditya Prakash', 'Haohan Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of California, Los Angeles', 'University of Illinois at Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02150.jpg', 'data': {'categories': ['#agents', '#benchmark', '#rag'], 'emoji': '📚', 'ru': {'title': 'Обучение источникам: прогрессивное улучшение понимания внешних знаний', 'desc': 'В работе предлагается новый подход к использованию внешних источников информации LLM-агентами через построение персистентных моделей источников. Авторы вводят концепцию source learning — разработка переиспользуемой компетенции для работы с конкретным источником знаний, которая улучшается со временем. Предложенный метод SourceLearn комбинирует два механизма обучения: самостоятельное изучение источника, определяющее пробелы в понимании, и обучение, управляемое задачами, которое выявляет потребности в организации знаний на основе опыта. Экспериментальные результаты показывают существенные улучшения производительности на пяти бенчмарках, превосходя базовые методы RAG на 22.6 пункта.'}, 'en': {'title': 'Empowering LLMs with Source Learning for Deeper Understanding', 'desc': "This paper introduces a new approach called SourceLearn, which enhances how large language model (LLM) agents learn from external sources. It focuses on 'source learning', where agents develop a deeper understanding of a specific source over time, rather than just accessing it repeatedly. SourceLearn employs two learning mechanisms: Self-Directed Source Learning, which identifies gaps in understanding and revisits the source, and Task-Guided Source Learning, which uses task experiences to improve knowledge organization. The results show that SourceLearn significantly outperforms existing methods, achieving better performance across multiple benchmarks."}, 'zh': {'title': '源学习：提升知识理解的关键', 'desc': '本文研究了源学习的概念，旨在提高大型语言模型（LLM）在知识密集型任务中的表现。我们提出了一种持久的源模型，能够捕捉对特定源的可重用理解，包括知识的结构、解释和应用。通过SourceLearn，我们结合了自我导向源学习和任务引导源学习两种机制，以逐步改进对源的理解。实验结果表明，SourceLearn在多个基准测试中表现优异，显著超越了现有的静态源表示和基于经验的记忆方法。'}}}, {'id': 'https://huggingface.co/papers/2610.05538', 'title': 'LiFT: Loop Flow Transformers', 'url': 'https://huggingface.co/papers/2610.05538', 'abstract': "Abstract  We introduce Loop Flow Transformers (LiFT), a family of looped generative models that scales computation by repeatedly applying a shared Diffusion Transformer (DiT) core, with only light changes to the standard architecture. Rather than asking every recurrent step for the final prediction, LiFT trains each step with a single regression target: a point on a straight path from the model's initial estimate to the flow-matching target. Because we index these targets by a continuous depth coordinate, a trained model can loop far beyond its training depth with no retraining, early exits, or other modifications. In our experiments, these longer rollouts improve generation, so inference computation can grow without adding parameters. On ImageNet at 256x256, LiFT-L/2 achieves an FID 3.34 points lower than our dense DiT-XL/2 baseline while using approximately 60% fewer parameters, 32% fewer training FLOPs, and 52% fewer inference FLOPs.", 'score': 5, 'issue_id': 3378, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '48a13e26f386246e', 'authors': ['Mohammad Mahdi Derakhshani', 'Pedro M. P. Curvo', 'Gertjan J. Burghouts', 'Jan-Willem van de Meent', 'Cees G. M. Snoek'], 'affiliations': ['AMLab', 'TNO, Intelligent Imaging', 'University of Amsterdam', 'VISLab'], 'pdf_title_img': 'assets/pdf/title_img/2610.05538.jpg', 'data': {'categories': ['#cv', '#training', '#inference', '#architecture'], 'emoji': '🔄', 'ru': {'title': 'Циклические диффузионные трансформеры для эффективной генерации с масштабируемыми вычислениями', 'desc': 'В работе представлены Loop Flow Transformers (LiFT) — семейство генеративных моделей, которые масштабируют вычисления путём циклического применения одного общего Diffusion Transformer ядра с минимальными архитектурными изменениями. Каждый шаг рекурсии обучается на одну регрессионную цель — точку на прямой линии от начальной оценки модели к целевому значению flow-matching. Благодаря индексированию целей непрерывной координатой глубины, обученная модель может выполнять значительно больше итераций без переобучения и модификаций. Экспериментально показано, что более длинные развёртывания улучшают качество генерации, позволяя увеличивать вычислительные затраты на инференсе без расширения количества параметров.'}, 'en': {'title': 'Efficient Generation with Loop Flow Transformers', 'desc': 'Loop Flow Transformers (LiFT) are a new type of generative model that enhances computation efficiency by using a shared Diffusion Transformer (DiT) core with minimal architectural changes. Instead of making final predictions at each step, LiFT focuses on training each step to reach a specific target along a path from the initial estimate to the desired outcome. This method allows the model to extend its capabilities beyond its training depth without needing retraining or adjustments. In tests, LiFT demonstrated improved generation quality on ImageNet while significantly reducing the number of parameters and computational costs compared to traditional models.'}, 'zh': {'title': '循环流变换器：高效生成的新方法', 'desc': '我们介绍了一种新的生成模型，称为循环流变换器（LiFT），它通过重复应用共享的扩散变换器（DiT）核心来扩展计算能力。LiFT在每个循环步骤中只需一个回归目标，而不是在每个步骤都要求最终预测，这样可以更高效地训练模型。通过使用连续深度坐标来索引这些目标，训练后的模型可以在不重新训练的情况下循环超出其训练深度。实验表明，LiFT在生成质量上有显著提升，同时在参数和计算量上都大幅减少。'}}}, {'id': 'https://huggingface.co/papers/2610.04128', 'title': 'What Gradients Add to Text Leakage in Split Language Models, Counted per Token and per Document', 'url': 'https://huggingface.co/papers/2610.04128', 'abstract': "Abstract  Split learning lets a client train a language model on a server without sending its text. The client runs the first layers itself and sends the server only their output, a vector of numbers for each token. During training, the server sends gradients back. We show that an observer at the split can rebuild most of the client's text from this traffic, and we measure how much the gradients help. On GPT-2, an attacker who holds only the publicly released weights of the client's layers recovers 94.20% of tokens from the activations alone and 97.38% when it also sees the gradients, 3.17 percentage points more 95% interval [2.72, 3.64]. Counted by document, the difference is much larger. The attacker rebuilds 13.71% of 32-token documents exactly without the gradients and 37.77% with them, because a document only counts when every token is right. How we count also changes how good a defence looks. Secret mixup, which blends each outgoing vector with a decoy, stops the attacker from rebuilding almost any document exactly, yet the attacker still recovers 83-91% of tokens. In a second experiment on GPT-2 and Qwen3-0.6B, where the server trains only a run of consecutive layers, the layer at which the run starts changes both model quality and leakage, even when the run's length is fixed. We recommend reporting leakage both per token and per document, and treating what a split model sends as being as sensitive as the text itself.", 'score': 5, 'issue_id': 3378, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '4cf7381e53850be6', 'authors': ['Georgios Politis', 'Evangelos Pappas'], 'affiliations': ['Setloop.io'], 'pdf_title_img': 'assets/pdf/title_img/2610.04128.jpg', 'data': {'categories': ['#security', '#training', '#leakage', '#small_models', '#multilingual'], 'emoji': '🔓', 'ru': {'title': 'Активации в split learning раскрывают исходный текст клиента', 'desc': 'В работе исследуется уязвимость split learning, когда клиент обучает языковую модель на сервере, отправляя только активации первых слоёв вместо исходного текста. Авторы показывают, что злоумышленник может восстановить большую часть исходного текста клиента из перехваченного трафика активаций и градиентов, используя только публичные веса модели. На примере GPT-2 демонстрируется, что без градиентов восстанавливается 94.20% токенов, а с градиентами - 97.38%, причём восстановление полных документов повышается с 13.71% до 37.77%. Работа рекомендует рассматривать активации, отправляемые в процессе split learning, как столь же чувствительные данные, как и исходный текст, и докладывать об утечке информации как на уровне отдельных токенов, так и целых документов.'}, 'en': {'title': 'Protecting Privacy in Split Learning: A Balancing Act', 'desc': "This paper discusses split learning, a method that allows a client to train a language model on a server without sharing its raw text data. Instead, the client processes the initial layers of the model and sends only the output vectors to the server, which then sends back gradients for training. The study reveals that an observer can reconstruct a significant portion of the client's text from the transmitted data, achieving up to 97.38% token recovery when gradients are included. The authors suggest that the way leakage is measured can affect the perceived effectiveness of defenses, recommending that both token and document-level leakage be reported."}, 'zh': {'title': '分割学习中的隐私泄露风险', 'desc': '分割学习允许客户端在服务器上训练语言模型，而无需发送文本。客户端自己运行前几层，并仅将输出（每个标记的数字向量）发送给服务器。在训练过程中，服务器会返回梯度。研究表明，观察者可以从这些数据中重建客户端的大部分文本，且梯度的存在会显著提高重建的准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.02191', 'title': 'The Missing Primitive: Diagnosing and Repairing Mathematical Reasoning in Large Language Models', 'url': 'https://huggingface.co/papers/2610.02191', 'abstract': 'Abstract  While Large Language Models (LLMs) have demonstrated striking capabilities on frontier mathematical problems, it remains unclear whether they possess the structural mathematical understanding underlying their solutions. In this paper, we take a first step toward systematically studying mathematical understanding in LLMs, from diagnosing its distinct capabilities to leveraging these findings to improve post-training. First, we introduce the notion of Mathematical Primitive to probe structural mathematical understanding and propose , a novel benchmark that evaluates mathematical reasoning along four distinct dimensions: Discovery, Generation, Digestion, and Execution. Second, our systematic diagnosis shows that solution accuracy masks distinct capability profiles, primitives unlock substantial latent execution capacity, and Discovery is the dominant bottleneck in mathematical reasoning. Our post-training analysis further shows that discovery-limited failures are particularly amenable to repair. Finally, building on these findings, we introduce , a primitive-privileged self-distillation framework that selectively transfers primitive-guided reasoning into the student model. Extensive experiments demonstrate that  consistently improves mathematical reasoning over baselines across model scales and challenging benchmarks.', 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e67b3411e36129c5', 'authors': ['Shuo Xing', 'Zilin Dai', 'Chengyuan Qian', 'Fangzhou Lin', 'Wenjing Chen', 'Ping He', 'Pan Lu', 'Alvaro Velasquez', 'Mohit Bansal', 'Zhengzhong Tu'], 'affiliations': ['DARPA', 'Harvard University', 'Stanford University', 'Texas A&M University', 'University of North Carolina at Chapel Hill', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02191.jpg', 'data': {'categories': ['#training', '#math', '#benchmark', '#interpretability', '#reasoning'], 'emoji': '🧮', 'ru': {'title': 'Примитивы математического понимания: диагностика и улучшение рассуждений LLM', 'desc': 'В работе исследуется глубина математического понимания в больших языковых моделях, которые часто дают правильные ответы, но не обязательно обладают структурным пониманием. Авторы вводят концепцию «Математического Примитива» для диагностики способностей моделей и создают бенчмарк, оценивающий математическое рассуждение по четырём измерениям: открытие, генерация, усвоение и исполнение. Анализ показал, что точность решений скрывает различные профили способностей, а главным узким местом в математическом рассуждении является этап открытия новых подходов. На основе этих выводов предложен метод самодистилляции, который целенаправленно передаёт примитивное рассуждение в студент-модель, улучшая математические способности моделей разных масштабов.'}, 'en': {'title': 'Unlocking Mathematical Reasoning in LLMs with Primitives', 'desc': "This paper investigates the mathematical understanding of Large Language Models (LLMs) by introducing the concept of Mathematical Primitives, which help assess their reasoning capabilities. It presents a benchmark that evaluates LLMs on four dimensions: Discovery, Generation, Digestion, and Execution. The study reveals that while LLMs can produce accurate solutions, their underlying capabilities vary, with Discovery being the main limitation in their reasoning process. To address this, the authors propose a self-distillation framework that enhances LLMs' reasoning by focusing on primitive-guided learning, leading to improved performance across various benchmarks."}, 'zh': {'title': '提升大型语言模型的数学推理能力', 'desc': '本文探讨了大型语言模型（LLMs）在数学理解方面的能力。我们引入了数学原语的概念，以评估模型的结构性数学理解，并提出了一个新的基准，评估数学推理的四个维度：发现、生成、消化和执行。研究表明，解决方案的准确性掩盖了不同的能力特征，而发现是数学推理中的主要瓶颈。基于这些发现，我们提出了一种自蒸馏框架，能够有效地将原语引导的推理转移到学生模型中，从而显著提升数学推理能力。'}}}, {'id': 'https://huggingface.co/papers/2610.03872', 'title': 'Training Numerical Intelligence via Auto-Diagnosis and Skill Discovery', 'url': 'https://huggingface.co/papers/2610.03872', 'abstract': 'Abstract  AI agents are becoming increasingly capable of generating scientific code, but generating code is not the same as improving the algorithms behind it. For numerical solvers, execution feedback can expose poor performance, but rarely reveals its underlying cause and how to address it. We introduce Auto-Diagnosis and Skill Discovery (ADSD), a framework that links numerical diagnosis to reusable solver self-improvement. ADSD follows a diagnosis-first paradigm that first explains why a solver performs poorly, then uses this diagnosis to guide the discovery of appropriate numerical methods. The resulting knowledge is packaged into reusable solver skills, turning solver improvement from trial-and-error editing into a structured process of diagnosis, discovery, and implementation. Across four challenging numerical domains--power flow equation, AC optimal power flow control, stiff ordinary differential equations, and heterogeneous diffusion PDEs--ADSD consistently improves solver accuracy, robustness, and efficiency. On GOC-500 power flow, for example, ADSD reduces mean solver error by nearly 71times, with improvements further transferring to unseen grid topologies and operating regimes.', 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'e07d3703a9b67a10', 'authors': ['Peter Chen', 'Wotao Yin'], 'affiliations': ['BAIR & EECS University of California, Berkeley', 'Decision Intelligence Lab DAMO Academy, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.03872.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'От диагностики к структурному совершенствованию численных решателей', 'desc': 'Статья описывает фреймворк ADSD, который помогает AI агентам улучшать численные решатели через диагностику и переиспользуемые навыки. Вместо простого экспериментирования с кодом система сначала анализирует, почему решатель работает плохо, а затем целенаправленно ищет подходящие численные методы для решения выявленных проблем. Полученные улучшения упаковываются в переиспользуемые компоненты, которые можно применять к разным задачам. На примере четырёх сложных доменов (включая уравнения потоков энергии и жёсткие дифференциальные уравнения) фреймворк достиг значительного улучшения точности и эффективности решателей.'}, 'en': {'title': 'Transforming Solver Improvement through Diagnosis and Skill Discovery', 'desc': "The paper presents Auto-Diagnosis and Skill Discovery (ADSD), a framework designed to enhance numerical solvers by linking performance diagnosis to solver self-improvement. It emphasizes a diagnosis-first approach, where the framework first identifies the reasons behind a solver's poor performance. This diagnosis then informs the discovery of suitable numerical methods, which are packaged as reusable skills for future use. The results show significant improvements in solver accuracy and efficiency across various numerical challenges, demonstrating the effectiveness of structured diagnosis and skill implementation."}, 'zh': {'title': '智能求解器的自我改进新方法', 'desc': '本文介绍了一种名为自动诊断与技能发现（ADSD）的框架，旨在将数值诊断与可重用的求解器自我改进相结合。ADSD采用先诊断后发现的方法，首先解释求解器性能不佳的原因，然后利用这一诊断指导合适数值方法的发现。最终，所获得的知识被打包成可重用的求解器技能，使求解器的改进过程从试错编辑转变为结构化的诊断、发现和实施过程。在多个复杂的数值领域中，ADSD显著提高了求解器的准确性、鲁棒性和效率。'}}}, {'id': 'https://huggingface.co/papers/2610.04226', 'title': 'PaLoRA: Paced Low-Rank Adaptation for Continual Learning', 'url': 'https://huggingface.co/papers/2610.04226', 'abstract': 'Abstract  LoRA-based continual learning methods mitigate catastrophic forgetting through various mechanisms, yet nearly all complement these with small learning rates as a heuristic to restrict gradient scaling magnitude. Such fixed heuristics lack theoretical guidance on how the strength of this restriction should evolve as tasks accumulate. We reveal that even under directional constraints such as nullspace projection, finite-precision updates inevitably leak into the subspace of accumulated prior knowledge along multiple directions. While small learning rates attenuate such leakage, they cannot prevent the accumulated forgetting from intensifying as the effective rank of historical knowledge grows. We show that the optimal magnitude restriction should adaptively increase with this effective rank to balance stability and plasticity, i.e., preservation of previous knowledge and acquisition of new task information. Under an anisotropic leakage model, we derive a pacing law s^*=R/c that characterizes the optimal scaling of gradient steps, i.e., the magnitude restriction itself, where R is the effective rank of past updates. Based on this insight, we propose PaLoRA, which compresses historical knowledge via adaptive SVD truncation, projects gradients onto the nullspace of prior tasks, and applies rank-aware adaptive pacing. Experiments demonstrate consistent improvements over prior methods, with particularly strong performance in long-horizon settings, achieving substantial gains of 4% accuracy on challenging 50-task ImageNet-A and ImageNet-R benchmarks.', 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '0fb603af9fad51cd', 'authors': ['Yuxuan Li', 'Fanhu Zeng', 'Hao Tang'], 'affiliations': ['Institute of Automation Chinese Academy of Sciences', 'School of Computer Science Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04226.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🧠', 'ru': {'title': 'Адаптивное управление темпом обучения для непрерывного обучения без забывания', 'desc': 'В статье изучается проблема катастрофического забывания в методах непрерывного обучения на основе LoRA. Авторы показывают, что даже при использовании ограничений направления (проекция на нулевое подпространство), обновления с конечной точностью неизбежно просачиваются в подпространство накопленного знания. Они выводят закон темпа обучения s*=R/c, который определяет оптимальное масштабирование градиентов в зависимости от эффективного ранга исторических обновлений. Предложенный метод PaLoRA использует адаптивное SVD-сжатие и динамическое управление темпом обучения дл
