    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.12806', 'title': 'Learning Heterogeneous Tactile Representation for General Dexterous Manipulation', 'url': 'https://huggingface.co/papers/2611.12806', 'abstract': 'Abstract LingBot-Touch is a tactile foundation model that learns a unified, extensible representation across heterogeneous tactile sensors, yielding plug-and-play tactile tokens that consistently enhance manipulation policies such as diffusion policy and VLA models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Tactile sensing is an indispensable modality for contact-rich dexterous manipulation, a capability that hints at the ultimate frontiers of embodied intelligence. However, commercially available tactile sensors are still at a relatively early stage of development, with each type of sensor offering irreplaceable strengths alongside its own drawbacks. A key challenge is thus to free tactile understanding from sensor-specific physics, so that embodied models can effectively leverage heterogeneous tactile data. To this end, we develop LingBot-Touch, a tactile foundation model characterized by the following properties. (i) Our model yields a unified representation across different tactile sensors (i.e., piezoresistive, magnetic, and visuotactile sensors), and is easily extensible to new sensor types. (ii) The resulting tactile tokens are plug-and-play: they can be seamlessly integrated into policy models across paradigms, from diffusion policy to vision-language-action (VLA) models such as π_{0.5} and LingBot-VLA, consistently enhancing manipulation dexterity. (iii) Extensive experiments, spanning simulation and real-robot deployments across multiple hardware platforms, demonstrate that our tactile representation substantially benefits complex manipulation tasks while maintaining strong computational efficiency. We believe the findings in this work demonstrate the potential of leveraging cross-sensor data to scale tactile learning, and offer encouraging insights for the design of future hardware and embodied models.', 'score': 92, 'issue_id': 3518, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '25838f1b32d2ed2a', 'pdf_title_img': 'assets/pdf/title_img/2611.12806.jpg', 'data': {'categories': ['#training', '#robotics', '#architecture', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единое осязание для ловких роботов: один тактильный язык для всех сенсоров', 'desc': 'Статья представляет LingBot-Touch — тактильную foundation model, которая обучает единое представление для разнородных тактильных сенсоров: пьезорезистивных, магнитных и visuotactile. Полученные тактильные токены подключаются по принципу plug-and-play к политикам манипуляций, таким как diffusion policy и VLA-модели (например, π0.5 и LingBot-VLA), повышая их ловкость. Эксперименты в симуляции и на реальных роботах на нескольких аппаратных платформах показывают заметный прирост качества сложных манипуляций при высокой вычислительной эффективности. Авторы демонстрируют, что использование кросс-сенсорных данных позволяет масштабировать тактильное обучение и даёт ориентиры для будущего дизайна железа и embodied-моделей.'}, 'en': {'title': 'One tactile language for many sensors', 'desc': 'LingBot-Touch is a tactile foundation model that learns a shared representation from different sensor types, including piezoresistive, magnetic, and visuotactile sensors. Its tactile tokens can be added to manipulation policies, such as diffusion policies and vision-language-action models, without major changes to those models. Tests in simulation and on real robots show that these tokens improve dexterity on complex manipulation tasks while remaining computationally efficient. The approach helps models use tactile data across different sensors and makes it easier to include new sensor types.'}, 'zh': {'title': '打通异构触觉，让机器人操作更灵巧', 'desc': 'LingBot-Touch 是一种触觉基础模型，能够把压阻式、磁式和视觉触觉传感器的数据映射到统一表示中，并可扩展到新的传感器类型。它生成的触觉 token 可直接接入扩散策略和视觉—语言—动作（VLA）模型等不同策略模型。实验表明，这些触觉表示能提升机器人在复杂操作任务中的灵巧性，并且计算效率较高。研究还通过仿真和多种硬件平台上的真实机器人实验，展示了跨传感器数据对触觉学习和具身智能发展的价值。'}}}, {'id': 'https://huggingface.co/papers/2611.10771', 'title': 'WorldFoundry: Towards Unified Infrastructure for World Intelligence', 'url': 'https://huggingface.co/papers/2611.10771', 'abstract': 'Abstract WorldFoundry offers open-source infrastructure for reproducible inference and evaluation of generative world models across video, 3D/4D, embodied action, and interactive systems, with traceable evidence and benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Visual generative models increasingly blur the line between synthesizing observations and simulating environments. Yet visual plausibility alone does not constitute successful world modeling: compelling outputs may lack persistent state, physical dynamics, or causally consistent responses to interactions. We define a generative world model as a predictive dynamical system that maintains a persistent, history-conditioned representation of an environment, updates that representation in response to actions or interventions, and generates temporally coherent trajectories that reflect outcomes under observed and counterfactual interventions. From this definition, we derive an intelligence-oriented framework spanning perceptual grounding, persistent state modeling, controllable transformation, dynamics-aware prediction, and closed-loop interaction. We present WorldFoundry, open-source infrastructure for reproducible inference and evaluation across video, 3D and 4D, embodied action, and interactive world systems. WorldFoundry unifies model and benchmark discovery, runtime and asset preparation, execution orchestration, artifact management, and interactive visualization, while modality-specific adapters preserve native inputs, execution semantics, output representations, and evaluation protocols. Explicit manifests, durable artifact contracts, and evidence-aware scorecards separate execution readiness from evaluative claims, making each claim traceable to its supporting artifacts. The catalog contains 270 model entries, 74 benchmarks, and 62 registered metric entries, with readiness and execution evidence recorded separately. WorldFoundry enables reproducible comparison of persistent, controllable dynamics across heterogeneous systems, advancing the field from perceptual synthesis toward measurable world intelligence.', 'score': 53, 'issue_id': 3517, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': '01f2d7166c07805a', 'authors': ['Juanxi Tian', 'Jiadong Hou', 'Baiang Li', 'Xin Lin', 'Zhengbo Jiao', 'Weijia Zhang', 'Yeying Jin', 'Truong Nguyen', 'Haitian Zheng', 'Zhifei Zhang', 'Jianfei Yang', 'Ming-Hsuan Yang', 'Felix Heide', 'Wei Xiong', 'Enze Xie', 'Wanhua Li'], 'affiliations': ['OpenEnvision'], 'pdf_title_img': 'assets/pdf/title_img/2611.10771.jpg', 'data': {'categories': ['#robotics', '#video', '#survey', '#agents', '#3d', '#open_source', '#benchmark', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'От красивой картинки к измеримому интеллекту мира', 'desc': 'Статья представляет WorldFoundry — открытую инфраструктуру для воспроизводимого инференса и оценки генеративных мировых моделей (world models) в видео, 3D/4D, embodied action и интерактивных системах. Авторы определяют генеративную мировую модель как предиктивную динамическую систему с персистентным состоянием, которое обновляется под действием интервенций и порождает temporally coherent траектории, включая контрфактуальные сценарии. WorldFoundry объединяет поиск моделей и бенчмарков, подготовку окружения, оркестрацию выполнения, управление артефактами и визуализацию, а адаптеры сохраняют специфику каждой модальности. Каталог включает 270 моделей, 74 бенчмарка и 62 метрики, с раздельной фиксацией готовности к запуску и доказательств выполнения, что делает научные утверждения прослеживаемыми.'}, 'en': {'title': 'From Visual Plausibility to Measurable World Intelligence', 'desc': 'The paper defines a generative world model as a system that keeps track of an environment over time, responds to actions, and predicts coherent outcomes—including outcomes of actions not yet taken. It presents WorldFoundry, open-source infrastructure for running and evaluating world models across video, 3D and 4D, embodied action, and interactive systems. The platform organizes models, benchmarks, execution, and results, while recording evidence so evaluation claims can be traced to supporting artifacts. Its catalog includes 270 models, 74 benchmarks, and 62 metric entries, helping researchers compare systems on persistent state, controllability, and physical dynamics.'}, 'zh': {'title': '从逼真生成迈向可验证的世界智能', 'desc': '论文提出生成式世界模型应不只生成逼真的画面，还要保留环境状态、根据动作更新状态，并预测连贯的后续变化。作者据此构建评估框架，涵盖感知 grounding、持久状态建模、可控变换、动力学预测和闭环交互。WorldFoundry 是一个开源平台，支持视频、3D/4D、具身动作和交互式世界系统的模型推理与评测，并提供模型与基准检索、运行管理及结果可视化。平台通过记录运行证据和评测依据，让不同系统的比较可复现、可追溯，推动研究从视觉生成走向可衡量的世界智能。'}}}, {'id': 'https://huggingface.co/papers/2611.12762', 'title': 'Sage-Taiyi: A Metacognitive Architecture for Scientific Discovery', 'url': 'https://huggingface.co/papers/2611.12762', 'abstract': 'Abstract  We introduce Sage-Taiyi, a metacognition-inspired architecture that uses accumulated scientific understanding to guide what to investigate next and how to investigate it. Through explicit monitoring and control, the system revises its understanding of evidence, assumptions, and unresolved questions, then uses these assessments to adapt research targets and select reusable reasoning methods. On Taiyi-Bench, an AI co-scientist ideation benchmark comprising 265 tasks from 50 papers across ten disciplines, Sage-Taiyi ranks first on all eight metrics of historical rediscovery and open-ended ideation, achieving an Overall score of 54.0 compared with 47.9 for the strongest baseline, AI Scientist-v2. It also performs well on two external scientific ideation benchmarks. Five expert-guided collaborations further connect its proposals to experimental and computational validation across chemistry, materials science, and engineering. In chemistry, reaction-condition optimization raises the yield of cobalt-catalyzed carbonylation from trace amounts to 84% and photocatalytic allylic amination from 13% to 69%. These results support metacognitive regulation as an approach to scientific ideation and its progression toward practical validation.', 'score': 52, 'issue_id': 3518, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '8acd50785d64d78b', 'authors': ['Weida Wang', 'Benteng Chen', 'Yigeng Jiang', 'Shuchen Pu', 'Weiping Shen', 'Zichao Liu', 'Yulin Su', 'Zitong Wang', 'Siyu Zhou', 'Zifu Wang', 'Yizhi Li', 'Xin Zong', 'Yuning Yang', 'Jixiang Bi', 'Yuan Wang', 'Chuyi Peng', 'Shiyao Geng', 'Qi Zhang', 'Kuan Lu', 'Mengzhu Li', 'Weiwang Xu', 'Peishan Xiang', 'Chengjun Liu', 'Chengrui Wei', 'Fangchen Yu', 'Shengji Tang', 'Yichen Jiang', 'Jingqi Ye', 'Cheng Yang', 'Tao Hu', 'Jianbiao Mei', 'Qinglong Cao', 'Kun Li', 'Yixin Chen', 'Shengyuan Xu', 'Juncheng Xiao', 'Yiheng Wang', 'Ruizhe Chen', 'Shiyang Feng', 'Runmin Ma', 'Xiangchao Yan', 'Zongsheng Cao', 'Haomeng Hu', 'Yu Ke', 'Taihui Wu', 'Meng Dai', 'Xu Guo', 'Haoyang Peng', 'Yinglong Ni', 'Pingsen Shi', 'Xiaosong Wang', 'Shuyue Hu', 'Haijun Li', 'Sherry Dongqi Bao', 'Yang Yang', 'Chao Yang', 'Jie Hou', 'Tianfan Fu', 'Yi Gong', 'Jin Zeng', 'Mao Su', 'Hongxia Hao', 'Fanyang Mo', 'Fenghua Ling', 'Tianshu Yu', 'Yunqi Cai', 'Baihong Chi', 'Jingwei Wang', 'Lei Wang', 'Chuncheng Bu', 'Shide Lv', 'Guangyu Wang', 'Yuqiang Li', 'Chunfeng Song', 'Lei Bai', 'Hui Wang', 'Xujun Fu', 'Li Cao', 'Lei Chen', 'Dahua Lin', 'Xing Xie', 'Bowen Zhou', 'Wenlong Zhang', 'Pinlong Cai', 'Peng Ye', 'Aiwen Lei', 'Jie Li', 'Shengchun Wang', 'Bo Zhang', 'Shufei Zhang'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2611.12762.jpg', 'data': {'categories': ['#agents', '#reasoning', '#benchmark', '#architecture', '#science'], 'emoji': '🧪', 'ru': {'title': 'Метакогнитивное управление открывает путь от идей к проверенным научным результатам', 'desc': 'В статье представлен Sage-Taiyi — архитектура, вдохновлённая метакогницией, которая использует накопленные научные знания для выбора направления исследований и методов рассуждения. Система через явный мониторинг и контроль пересматривает оценку доказательств, допущений и нерешённых вопросов, адаптируя исследовательские цели. На бенчмарке Taiyi-Bench (265 задач, 50 статей, десять дисциплин) модель опережает AI Scientist-v2 по всем восьми метрикам, включая общий балл 54.0 против 47.9. Экспертные совместные проекты в химии, материаловедении и инженерии подтверждают практическую ценность: выход реакций вырос с следовых количеств до 84% и с 13% до 69%.'}, 'en': {'title': 'Think about the evidence, then choose what science to pursue', 'desc': 'Sage-Taiyi is a scientific ideation system that uses metacognition to monitor and revise its understanding of evidence, assumptions, and unanswered questions. It uses these assessments to choose research goals and apply reusable reasoning methods. On Taiyi-Bench, it achieved the highest score across all eight metrics, outperforming the strongest baseline, and it also performed well on two other ideation benchmarks. Expert-guided collaborations connected its ideas to practical tests, including experiments that substantially improved reaction yields in chemistry.'}, 'zh': {'title': '让 AI 反思科学证据，找到下一步研究方向', 'desc': 'Sage-Taiyi 是一种受元认知启发的架构，它会利用已有的科学知识来决定下一步研究什么，以及如何研究。系统持续检查证据、假设和未解决的问题，并据此调整研究目标和选择可复用的推理方法。在 Taiyi-Bench 的 8 项指标上，它均排名第一，整体得分为 54.0，高于最强基线 AI Scientist-v2 的 47.9；它在另外两个科学构想基准上也表现良好。专家合作实验还验证了部分研究建议，例如优化反应条件后，两种化学反应的产率分别提升至 84% 和 69%。'}}}, {'id': 'https://huggingface.co/papers/2611.12886', 'title': 'Reframe: Observation-Aligned Multi-Teacher On-Policy Distillation for Agentic Visual Reasoning', 'url': 'https://huggingface.co/papers/2611.12886', 'abstract': 'Abstract Reframe is a two-stage post-training framework that aligns visual agents’ observation states through evidence-aware reinforcement learning and observation-gated on-policy distillation, improving tool use and outperforming Mix-RL and vanilla MOPD across image and video benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Agentic reinforcement learning (RL) and multi-teacher on-policy distillation (MOPD) offer complementary routes to post-training. For visual agents, however, tool use presents two related challenges. Models may overlook useful tool-returned observations, while poorly grounded actions can limit the evidence available for subsequent distillation. We introduce Reframe, a post-training framework that treats the observation state, rather than only the output distribution, as an object of alignment. First, Ground-Drop-GRPO (GD-GRPO) trains spatial and temporal specialists with evidence-aware rewards and stochastic removal of the original visual input, encouraging them to acquire grounded evidence and use the returned observations. Second, Observation-Gated-MOPD (OG-MOPD) replaces deficient tool actions with canonical ones mid-rollout and resumes distillation from the repaired observation. The two stages complement each other, as learning to rely on tool-returned observations can help the policy benefit from observation repair. Neither stage requires a task-specific SFT cold start. Extensive experiments over 14 image and video benchmarks demonstrate that Reframe outperforms both Mix-RL and vanilla MOPD. Ablation results show that GD-GRPO increases observation dependence and tool gain compared with outcome-based GRPO.', 'score': 37, 'issue_id': 3518, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '2719142a0547e566', 'authors': ['Haozhi Yuan', 'Handong Li', 'Yifan Zhang', 'Qianshan Wei'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2611.12886.jpg', 'data': {'categories': ['#agents', '#rl', '#benchmark', '#optimization', '#video', '#training', '#alignment', '#cv'], 'emoji': '🔭', 'ru': {'title': 'Учим визуальных агентов доверять наблюдениям инструментов', 'desc': 'Статья предлагает двухэтапный фреймворк Reframe для пост-обучения визуальных агентов, который выравнивает состояние наблюдений, а не только распределение выходов модели. На первом этапе GD-GRPO обучает пространственных и временных специалистов с наградами, учитывающими доказательства, и стохастически удаляет исходное изображение, чтобы модель опиралась на данные, возвращаемые инструментами. На втором этапе OG-MOPD заменяет некорректные действия с инструментами на канонические прямо в процессе генерации и продолжает дистилляцию от исправленного наблюдения. Метод не требует SFT cold start и превосходит Mix-RL и базовый MOPD на 14 бенчмарках для изображений и видео.'}, 'en': {'title': 'Teach Visual Agents to Act on Better Evidence', 'desc': 'Reframe is a two-stage post-training framework that aligns visual agents’ observations as well as their outputs. First, Ground-Drop-GRPO uses evidence-aware rewards and sometimes hides the original image or video, teaching agents to rely on useful observations returned by tools. Next, Observation-Gated-MOPD repairs deficient tool actions and continues on-policy distillation from the corrected observation. Across 14 image and video benchmarks, Reframe outperforms Mix-RL and standard MOPD without requiring task-specific supervised fine-tuning.'}, 'zh': {'title': '让视觉智能体学会依证据观察、善用工具', 'desc': 'Reframe 是一种两阶段后训练框架，旨在让视觉智能体更好地利用工具返回的观察结果。第一阶段 GD-GRPO 使用关注证据的奖励，并随机移除原始视觉输入，训练智能体依据空间和时间证据作出判断。第二阶段 OG-MOPD 会修正不合适的工具操作，并从修正后的观察继续进行在线策略蒸馏。该方法不需要针对具体任务的监督微调冷启动，在 14 个图像和视频基准上优于 Mix-RL 和普通 MOPD。'}}}, {'id': 'https://huggingface.co/papers/2610.42148', 'title': 'Flide: Accelerating Decision Inference with Exact State Forking', 'url': 'https://huggingface.co/papers/2610.42148', 'abstract': 'Abstract Flide is an exact inference engine that accelerates decision-model LLM agents by decoupling logical request trees from physical execution and using ForkAttention to preserve exact branch evaluations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decision models such as Jev have emerged as a highly promising paradigm for LLM agent systems, providing lightweight and reliable categorical reasoning for rapid System One execution. However, existing generation-oriented inference engines fail to support these workloads effectively, suffering from severe prefix recomputation overheads or distorted output probabilities. To address this challenge, we propose Flide, an efficient and exact inference engine that decouples the logical tree structure of a decision request from its physical execution within a single flattened token stream. Through ForkAttention, Flide navigates request dependencies using GPU-resident indices across both standard attention and recurrent Gated DeltaNet layers, guaranteeing in exact arithmetic that every query branch evaluates identically to an isolated forward pass. By expressing branch topologies directly in GPU-resident metadata, Flide accommodates diverse request mixtures with a compact set of pre-recorded execution graphs while enabling expanding agent histories to resume from checkpoints saved in earlier passes. Extensive evaluations on public hybrid and decision models demonstrate that Flide answers queries up to 9.5 times faster than vLLM and SGLang while staying closest to a float32 reference in total variation distance. By unifying physical execution throughput with mathematical exactness, Flide establishes a principled foundation for scalable, latency-critical decision intelligence in agent systems.', 'score': 31, 'issue_id': 3517, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'b5c254252f844cae', 'authors': ['Bobo Li', 'Jiajia Song', 'Hao Fei', 'Wynne Hsu', 'Mong Li Lee'], 'affiliations': ['National University of Singapore', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.42148.jpg', 'data': {'categories': ['#architecture', '#agents', '#inference', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Быстрые решения без потери точности: Flide ускоряет LLM-агентов', 'desc': 'Flide — это точный движок инференса (exact inference engine), который ускоряет LLM-агентов для принятия решений, разделяя логическое дерево запроса и его физическое выполнение в единый поток токенов. Механизм ForkAttention использует GPU-индексы, чтобы каждая ветка запроса вычислялась идентично изолированному forward pass как в стандартных attention-слоях, так и в рекуррентных слоях Gated DeltaNet. Благодаря предзаписанным графам выполнения и чекпоинтам системе не нужно заново пересчитывать префиксы, что критично для задач с низкой задержкой. В тестах Flide отвечает на запросы до 9.5 раз быстрее vLLM и SGLang, сохраняя при этом наибольшую близость к float32-эталону по total variation distance.'}, 'en': {'title': 'Faster Branching, Exact Decisions', 'desc': 'Flide is an inference engine for decision-model LLM agents that aims to make reasoning faster without changing the model’s exact branch results. It separates the logical tree of a request from how tokens are executed, then uses ForkAttention to track branch dependencies across attention and recurrent Gated DeltaNet layers. This lets multiple branches share a flattened token stream while each branch produces the same result as if it were evaluated on its own. In evaluations, Flide was up to 9.5 times faster than vLLM and SGLang, while keeping output probabilities close to a float32 reference.'}, 'zh': {'title': '分支计算既快又准：Flide 加速智能体决策推理', 'desc': 'Flide 是一种面向决策模型智能体的精确推理引擎，可减少重复计算并加快推理。它将请求中的逻辑分支结构与实际执行方式分离，并将请求展平为单一 token 流。其 ForkAttention 使用 GPU 上的索引处理分支依赖，确保每个分支的计算结果与单独进行前向传播完全一致，也支持标准注意力层和循环 Gated DeltaNet 层。在公开模型评测中，Flide 的查询速度最高可达 vLLM 和 SGLang 的 9.5 倍，同时保持了接近 float32 参考结果的概率精度。'}}}, {'id': 'https://huggingface.co/papers/2611.08452', 'title': 'ReproBridge: Building Reproducibility into ML Research Artifacts', 'url': 'https://huggingface.co/papers/2611.08452', 'abstract': 'Abstract  Reproducing machine learning experiments requires reconstructing procedures from information scattered across papers, released code, and supporting artifacts. For coding agents, reproduction success can therefore depend on their ability to fill in missing details, rather than on the released artifacts alone. We ask whether preserving recovered procedures and decisions improves subsequent independent reproduction. We define a standardized artifact design comprising a refined codebase, environment setup, experiment launchers, and a reproduction guide, and introduce ReproBridge, an agent workflow for constructing these refined reproducible artifacts. ReproBridge-Bench provides 1,029 tasks from 387 experiments across 36 papers, anchored by five human-verified reference scores per task. Agents attempt tasks in fresh sessions with raw code or refined artifacts; a separate Auditor checks execution evidence. Across four evaluated models, refined artifacts raise mean reproduction success from 76.4% to 92.6% and reduce downstream API spending by 19.7% on average. The cross-model success-rate spread narrows from 21.6 to 3.9 percentage points, with all four models achieving mean success rates above 90%. Removing any component reduces success in the ablation study, with the largest losses from code and environment removal. These results suggest that preserving execution knowledge helps even models with lower raw-code success reproduce experiments more reliably and at lower API cost.', 'score': 30, 'issue_id': 3517, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'c38c60d13090ea9f', 'authors': ['Yubo Wang', 'Rui Meng', 'Jaehyun Nam', 'Tomas Pfister', 'Jinsung Yoon'], 'affiliations': ['Google', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2611.08452.jpg', 'data': {'categories': ['#science', '#agents', '#data', '#training', '#open_source', '#benchmark'], 'emoji': '🔁', 'ru': {'title': 'Сохраняем знания о выполнении — и эксперименты воспроизводятся надёжнее', 'desc': 'Статья посвящена воспроизводимости экспериментов в машинном обучении, которую LLM-агенты часто не могут выполнить, поскольку недостающие детали процедуры разбросаны по статьям и коду. Авторы предлагают ReproBridge, агентный workflow, который создаёт очищенные артефакты: рефакторированный кодбейз, настройку окружения, скрипты запуска и руководство по воспроизведению. Бенчмарк ReproBridge-Bench содержит 1029 задач из 387 экспериментов по 36 статьям, а отдельный Auditor проверяет доказательства выполнения. Результаты показывают, что очищенные артефакты повышают успешность воспроизведения с 76,4% до 92,6% и снижают расходы на API примерно на 20%, а также выравнивают результаты разных моделей.'}, 'en': {'title': 'Preserve the Procedure, Reproduce the Experiment', 'desc': 'Reproducing machine learning experiments can be difficult because key steps are scattered across papers, code, and other materials. The authors introduce ReproBridge, a workflow that packages a refined codebase, environment setup, experiment launchers, and a guide so agents can reuse recovered procedures. On a benchmark of 1,029 tasks, these refined artifacts raised average reproduction success from 76.4% to 92.6% and lowered API costs by 19.7%. They also reduced performance differences between models, suggesting that preserving execution knowledge makes reproductions more reliable across agents.'}, 'zh': {'title': '保存实验执行经验，让机器学习复现更可靠', 'desc': '复现机器学习实验时，关键信息往往散落在论文、代码和其他材料中，因此智能体需要补全缺失的步骤。本文提出 ReproBridge 工作流程，用来整理代码、环境配置、实验启动脚本和复现指南，形成更易复现的实验材料。研究团队构建了包含 1,029 项任务的基准测试，并发现使用整理后的材料，平均复现成功率从 76.4% 提升到 92.6%，API 开销平均降低 19.7%。这些材料也缩小了不同模型之间的成功率差距，说明保存实验执行经验能让模型更稳定、更省成本地复现实验。'}}}, {'id': 'https://huggingface.co/papers/2611.10304', 'title': 'Longtail-SWE: High-Quality SWE Tasks for Underrepresented Languages', 'url': 'https://huggingface.co/papers/2611.10304', 'abstract': "Abstract  Challenging repository-level benchmarks remain limited for many programming language ecosystems, where filtering scarce candidates with ambiguous descriptions or defective tests can discard valuable engineering problems. We introduce Longtail-SWE, a benchmark of 202 issue-resolution tasks across 13 languages with limited coverage in existing repository-level benchmarks: Clojure, Dart, Elixir, Erlang, F#, Haskell, Julia, Kotlin, Lua, OCaml, R, Scala, and Swift. Its construction uses a solver--judge--repairer pipeline: a solver attempts each candidate task, and a judge reviews the task together with the solver's trajectory and test results to guide revisions to tests and task descriptions. These revisions aim to correct tests that reject valid alternative implementations or accept incorrect solutions while retaining challenging tasks and preserving their intended requirements. We evaluate nine model configurations, including frontier models, and analyze task-solving performance, consistency across repeated attempts, and resource usage. We release all benchmark instances, executable environments, complete construction and evaluation tooling, and agent trajectories, together with an additional set of easier tasks to support evaluation of smaller models.", 'score': 19, 'issue_id': 3519, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'db2b4df23129b51a', 'authors': ['Vladimir Dobrovolskii', 'Ibragim Badertdinov', 'Alexander Golubev'], 'affiliations': ['Nebius'], 'pdf_title_img': 'assets/pdf/title_img/2611.10304.jpg', 'data': {'categories': ['#agents', '#benchmark', '#small_models', '#open_source', '#dataset', '#data', '#plp'], 'emoji': '🧭', 'ru': {'title': 'Редкие языки — честный бенчмарк для AI-агентов в разработке', 'desc': 'Авторы представляют Longtail-SWE — бенчмарк из 202 задач по исправлению issue в репозиториях для 13 языков программирования, которые редко встречаются в существующих датасетах, например Clojure, Haskell, Julia и Erlang. Построение бенчмарка основано на пайплайне solver–judge–repairer: solver пытается решить задачу, judge анализирует задачу вместе с траекторией решения и результатами тестов, а repairer корректирует тесты и описания задач. Цель правок — убрать ложные отказы на корректных альтернативных реализациях и ложные принятия неверных решений, сохранив сложность задач и исходные требования. Модели, включая frontier LLM, оцениваются по качеству решения задач, стабильности при повторных запусках и потреблению ресурсов, а все данные, окружения и инструменты публикуются вместе с дополнительным набором более простых задач для небольших моделей.'}, 'en': {'title': 'Bringing Long-Tail Languages Into Software Engineering Benchmarks', 'desc': 'Longtail-SWE is a benchmark of 202 software issue-resolution tasks across 13 programming languages that are underrepresented in existing repository-level benchmarks. It uses a solver–judge–repairer pipeline: a solver tries each task, then a judge examines the task, the solver’s steps, and test results to improve task descriptions and tests. This process aims to keep challenging tasks while fixing tests that reject valid solutions or accept incorrect ones. The authors evaluate nine model configurations and release the tasks, execution environments, tools, and agent trajectories, plus easier tasks for smaller models.'}, 'zh': {'title': '让长尾语言的代码仓库级挑战更可靠', 'desc': '本文提出 Longtail-SWE，这是一个面向 13 种编程语言、包含 202 个代码仓库级问题解决任务的基准测试集。它采用“求解器—评审器—修复器”流程：先让模型尝试任务，再根据求解过程和测试结果检查并修订任务描述与测试。修订旨在修正误判有效实现或放过错误实现的测试，同时保留任务难度和原始要求。作者用九种模型配置评估解题表现、重复尝试的一致性和资源消耗，并公开基准任务、运行环境、工具及模型轨迹。'}}}, {'id': 'https://huggingface.co/papers/2611.11558', 'title': 'InfraRSI: Harnessing Recursive Self-Improvement for Training Infrastructure', 'url': 'https://huggingface.co/papers/2611.11558', 'abstract': 'Abstract  While Recursive Self-Improvement (RSI) accelerates isolated algorithm and kernel synthesis, distributed LLM training depends on tightly coupled launch settings, operator kernels, and communication schedules, where single edits often hit out-of-memory (OOM) boundaries, compiler conflicts, measurement jitter, or silent numerical drift. We present InfraRSI, the agentic harness that turns open-ended human commands into verified training optimizations via a five-stage workflow: init locks editable scope and a fixed task contract over workload, loss, and timing invariants to prevent reward hacking, doctor profiles baseline phases and calibrates cluster noise, run co-optimizes launch knobs and code patches before re-verifying top candidates against the baseline and logging findings to a cross-hardware experience bank, and report and apply audit source paths, track failed-trial costs, and commit promoted changes. Rather than stepping greedily from a single incumbent, InfraRSI initializes from diverse experience-seeded configurations and fits global execution-time and censored peak-memory models across all trials, including OOMs. Using these models, it prices per-setting memory costs, revises miscalibrated LLM priors from live runs, and pairs memory-hungry optimizations with memory savers and verified code patches. Across four single- and multi-node dense and Mixture-of-Experts (MoE) LLM workloads, InfraRSI achieves a speedup of up to 2.75times and lifts mean Model FLOPs Utilization (MFU) from 17.4% to 30.0%, outperforming existing tuners and coding agents while transferring experience across GPUs. As it improves training infrastructure efficiency, InfraRSI forms a two-level Recursive Self-Improvement loop---revising priors online within runs and distilling experience across clusters---to push foundation model scaling.', 'score': 15, 'issue_id': 3518, 'pub_date': '2026-11-08', 'pub_date_card': {'ru': '8 ноября', 'en': 'November 8', 'zh': '11月8日'}, 'hash': '0b09ce52b138503c', 'pdf_title_img': 'assets/pdf/title_img/2611.11558.jpg', 'data': {'categories': ['#agents', '#training', '#optimization'], 'emoji': '⚙️', 'ru': {'title': 'Самоулучшающийся агент ускоряет обучение LLM в разы', 'desc': 'Статья представляет InfraRSI — агентную систему, которая автоматически оптимизирует распределённое обучение LLM, совместно подбирая параметры запуска и патчи ядер с учётом ограничений по памяти (OOM) и шуму измерений. Система проходит пятиэтапный конвейер с фиксацией задачи, чтобы избежать reward hacking, и использует базу опыта между разными GPU. Для выбора конфигураций она строит глобальные регрессионные модели времени выполнения и пиковой памяти, включая цензурированные данные от падений по OOM. Итог: ускорение обучения до 2.75 раза и рост средней MFU с 17.4% до 30.0% на dense и MoE моделях.'}, 'en': {'title': 'Learn from every run to make LLM training faster', 'desc': 'InfraRSI is an agentic system that improves distributed LLM training by tuning launch settings, code kernels, and communication schedules together. Its workflow profiles a baseline, tests candidate changes, and verifies that speed improvements preserve the workload and loss requirements. It uses experience-seeded configurations and global models of execution time and peak memory, including trials that fail with out-of-memory errors, to choose better experiments. Across four dense and MoE workloads, it achieved up to 2.75× speedup and raised mean Model FLOPs Utilization from 17.4% to 30.0%, while carrying useful experience across GPU clusters.'}, 'zh': {'title': '让训练优化从失败中学习，跨硬件持续提速', 'desc': '这篇论文提出 InfraRSI，用智能体工作流优化分布式大语言模型训练中的启动参数、算子内核和通信安排。它先固定任务与评估标准，再分析基线、尝试优化并验证结果，以避免显存溢出、编译冲突、测量噪声和数值偏差带来的问题。系统会综合所有试验（包括显存溢出的失败试验）建立运行时间和峰值显存模型，并利用跨硬件的经验来选择和组合优化方案。在四种稠密模型和 MoE 训练任务中，它最高实现 2.75 倍加速，并将平均模型 FLOPs 利用率从 17.4% 提升到 30.0%。'}}}, {'id': 'https://huggingface.co/papers/2611.10329', 'title': 'SIRIS: Can LLMs Tell When Simulation Errors Matter in AI-Driven Systems Research', 'url': 'https://huggingface.co/papers/2611.10329', 'abstract': "Abstract A benchmark probes whether large language models can determine when imperfect simulator limitations invalidate recommended system designs, finding that identifying a limitation does not ensure correct design choices and that review-based self-correction yields mixed results.  Generated by deepseek-ai/DeepSeek-V4.1-Flash LLM agents increasingly drive systems research and rely on simulators to evaluate candidate designs at scale. Simulators are imperfect by design: their modeling limitations can distort predictions yet leave the recommended design correct, or change which design should be selected. We introduce Siris to test whether LLMs can tell these cases apart, judging from their systems understanding when a limitation invalidates the simulator's recommendation. By perturbing a simulator, Siris constructs workload pairs with the same candidates, limitation, and simulator recommendation. The perturbation changes predictions on both workloads, yet a reference simulator supports the recommendation on only one. Evaluating thirteen frontier LLMs on LLM serving design problems, we find that identifying a limitation does not ensure a correct choice, and even the strongest models sometimes abandon valid recommendations. Self-correction through a review turn helps these models restore valid choices but introduces new errors in several others. These findings motivate evaluating systems understanding through design decisions under imperfect simulators.", 'score': 12, 'issue_id': 3518, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'b1eba12fe83b5ada', 'authors': ['Jinwoo Hwang', 'Sukmin Cho', 'Tao Zhang', 'Soheil Abbasloo', 'Jongse Park', 'Peng Cheng'], 'affiliations': ['KAIST', 'Microsoft Research Asia'], 'pdf_title_img': 'assets/pdf/title_img/2611.10329.jpg', 'data': {'categories': ['#science', '#reasoning', '#benchmark'], 'emoji': '🧪', 'ru': {'title': 'Заметить ограничение симулятора — еще не значит принять верное решение', 'desc': 'Статья представляет бенчмарк Siris, который проверяет, могут ли LLM определить, делает ли ограничение симулятора рекомендованный дизайн системы невалидным. Авторы создают пары рабочих нагрузок с одинаковыми кандидатами и рекомендацией симулятора, но с разной корректностью, используя возмущение симулятора. Оценка тринадцати современных LLM на задачах проектирования LLM serving показывает, что обнаружение ограничения не гарантирует правильного выбора, а самокоррекция через этап ревью дает неоднозначные результаты. Работа предлагает оценивать системное понимание через проектные решения в условиях несовершенных симуляторов.'}, 'en': {'title': 'Spotting a simulator’s flaw isn’t enough to choose the right design', 'desc': 'The paper introduces Siris, a benchmark for testing whether large language models make sound system-design choices when simulators have limitations. It compares workload pairs where the simulator has the same limitation and recommendation, but a reference simulator shows that the recommendation is valid for only one workload. Tests of thirteen frontier models on LLM-serving designs show that recognizing a simulator limitation does not guarantee choosing correctly. A review-based self-correction step sometimes restores valid choices, but can also introduce new errors.'}, 'zh': {'title': '识别模拟器局限不够，关键是选对设计', 'desc': '本文提出基准测试 Siris，用来评估大语言模型能否判断模拟器的局限是否会使系统设计推荐失效。Siris 通过改变模拟器的预测，构造候选方案、局限和推荐结果相同，但正确设计选择不同的工作负载对。对 13 个前沿大语言模型的测试显示，模型即使识别出模拟器的局限，也不一定能做出正确选择，有时还会放弃有效推荐。让模型进行一轮复核有时能纠正错误，但也可能引入新的错误，因此评估系统理解能力时应关注模型在不完美模拟器下做出的设计决策。'}}}, {'id': 'https://huggingface.co/papers/2611.11450', 'title': 'How Much Training-Inference Mismatch Can On-Policy Distillation Tolerate?', 'url': 'https://huggingface.co/papers/2611.11450', 'abstract': 'Abstract On-policy distillation tolerates substantial training-inference mismatch from quantized inference and asynchronous rollouts, with model- and layer-specific limits, and a lightweight admission check plus FP8 recipes can exploit this tolerance to improve training efficiency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash On-policy distillation (OPD) trains a student language model on its own responses, guided by a fixed teacher. Generating these responses is expensive, so systems use quantized inference and asynchronous rollouts to reduce the cost. Both, however, introduce training-inference mismatch between the rollout engine and the model being trained. Such mismatch can destabilize reinforcement learning (RL), but its effects on OPD remain unclear. This paper investigates how much mismatch OPD tolerates, where its effects arise, and how training systems can use this tolerance. Measuring all mismatch sources on one scale, we examine quantization across three student-teacher pairs, with additional tests of weight staleness and injected noise on one pair. OPD tolerates substantial mismatch without meaningful loss of training quality but degrades at higher levels, revealing an empirical mismatch budget. Both the quality cost of mismatch and the mismatch introduced by quantization depend on the model, with some layers particularly sensitive to reduced precision. In controlled comparisons, OPD remains stable under rollout configurations that destabilize RL methods. Under weight noise, mismatch also shifts the prefixes reached during generation, introducing errors that per-token corrections cannot address. To put these findings into practice, we introduce a lightweight admission check that screens rollout configurations against a calibrated budget without requiring a full training run for each candidate. Model-specific FP8 recipes preserve training quality while providing capacity for at least 1.93times as many KV-cache tokens as BF16. Combining FP8 with asynchronous rollouts reaches the same training quality 1.62times sooner than synchronous BF16 training. Code is available at https://github.com/benyucong/train-inference-mismatch-opd', 'score': 11, 'issue_id': 3518, 'pub_date': '2026-11-08', 'pub_date_card': {'ru': '8 ноября', 'en': 'November 8', 'zh': '11月8日'}, 'hash': '7eaa6f7bfd88137b', 'authors': ['Cong Yu', 'Ziting Wang', 'Songlin Jiang', 'Sitong Zhang', 'Chengliang Chai', 'Youhe Jiang', 'Eiko Yoneki', 'Tuo Shi'], 'affiliations': ['Aalto University', 'Beijing Institute of Technology', 'Independent', 'Nanyang Technological University', 'Shenzhen University of Advanced Technology', 'University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2611.11450.jpg', 'data': {'categories': ['#open_source', '#rl', '#optimization', '#training', '#inference', '#rlhf'], 'emoji': '⚡', 'ru': {'title': 'OPD терпит расхождения: используем допуск, чтобы обучать быстрее', 'desc': 'Статья исследует, насколько on-policy distillation (OPD) устойчива к training-inference mismatch, возникающему из-за квантизации и асинхронной генерации ответов student-модели при фиксированном teacher. Авторы показывают, что OPD выдерживает значительное расхождение без заметной потери качества, но деградирует при высоких уровнях, и вводят эмпирический mismatch budget. Предложен лёгкий admission check для отбора конфигураций rollout без полного обучения и FP8-рецепты, которые дают в 1.93 раза больше KV-cache токенов и ускоряют обучение в 1.62 раза по сравнению с синхронным BF16.'}, 'en': {'title': 'Spend the Mismatch Budget to Distill Faster', 'desc': 'This paper studies how much training-inference mismatch on-policy distillation (OPD) can tolerate when student responses are generated using quantized models or asynchronous rollouts. It finds that OPD can handle substantial mismatch, but the safe limit varies by model and layer, and excessive mismatch can reduce training quality. The authors introduce a lightweight admission check that compares rollout setups with a calibrated mismatch budget, along with model-specific FP8 recipes. Combined, FP8 and asynchronous rollouts achieve the same training quality 1.62 times faster than synchronous BF16 training.'}, 'zh': {'title': '摸清不匹配预算，用 FP8 与异步生成加速在线蒸馏', 'desc': '本文研究在线策略蒸馏（OPD）能容忍多大程度的训练与推理不匹配，包括量化推理、异步生成和权重陈旧等因素。实验发现，OPD 在一定的不匹配范围内仍能保持训练质量，但超过模型相关的阈值后性能会下降，而且部分网络层对低精度尤其敏感。权重噪声还会改变生成时到达的前缀，因此只修正每个 token 的误差并不能完全解决问题。作者提出轻量级准入检查，并为不同模型设计 FP8 量化方案；结合异步生成后，可在维持训练质量的同时显著提升训练效率。'}}}, {'id': 'https://huggingface.co/papers/2611.10592', 'title': 'MotionGraphicsBench: Evaluating Motion Graphics Generation with Programmatic Verification', 'url': 'https://huggingface.co/papers/2611.10592', 'abstract': 'Abstract  Large language models can generate motion graphics from static images and natural language requests, but it remains difficult to evaluate how well models can follow requests that combine spatial, appearance, and temporal requirements. We introduce MotionGraphicsBench, an expert-curated benchmark of 100 instances for animating an input static SVG with a motion edit prompt. By supplying all required visual elements, our editing task reflects a designer-like workflow and isolates motion generation from graphic generation. Derived from real-world Lottie motion designs, our benchmark contains diverse combinations of spatio-temporal animation behaviors. Each benchmark instance pairs its model input with a deterministic, human-readable verification program that accepts different valid implementations and reports which prompt requirements pass or fail, rather than comparing against a reference animation or using a VLM judge. We construct these programs with a multi-agent pipeline using human-labeled animations and synthesized test cases. On a balanced test set of 180 animations, our programs achieve 93.3% raw agreement with human judgments, compared with 83.3% for a GPT-6 Astra VLM baseline, and outperform the baseline in both approval and rejection recall. Across 47 configurations from 32 LLMs and 12 providers, pass@1 ranges from 6.0% to 67.7%. Across 15 models evaluated at their highest available reasoning effort with 32 attempts per instance, additional attempts improve every model, but pass@32 still ranges from 38.0% to 95.0%. Our analysis of verification programs reveals that generated animations often fail to match reference poses, follow requested motion trajectories, or coordinate related events. We release our benchmark at https://huggingface.co/datasets/figma-ai/motion-graphics-bench.', 'score': 8, 'issue_id': 3520, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': '1b27bcb40aac592a', 'authors': ['Jiaju Ma', 'Ashvini Kumar Jindal', 'Chuhua Wang', 'Sumithra Bhakthavatsalam'], 'affiliations': ['Figma', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2611.10592.jpg', 'data': {'categories': ['#video', '#multimodal', '#dataset', '#plp', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Оценка анимации LLM через проверяемые программы, а не субъективные суждения', 'desc': 'В статье представлен MotionGraphicsBench — бенчмарк из 100 экспертно отобранных задач, в которых LLM должна анимировать статичный SVG по текстовому запросу на редактирование движения. Оценка выполняется не через сравнение с эталонной анимацией и не через VLM-судью, а с помощью детерминированных программ верификации, которые проверяют выполнение каждого требования и согласуются с человеческими оценками в 93,3% случаев. Результаты 47 конфигураций моделей показывают, что pass@1 варьируется от 6,0% до 67,7%, а при 32 попытках pass@32 достигает 38,0–95,0%, при этом типичные ошибки связаны с позами, траекториями движения и координацией событий.'}, 'en': {'title': 'A Better Test for Prompt-Driven Motion Graphics', 'desc': 'MotionGraphicsBench is a benchmark for testing how well large language models animate SVG images from prompts with spatial, visual, and timing requirements. It includes 100 expert-curated tasks and uses deterministic verification programs to check each requirement, allowing multiple valid animation solutions. These programs agree with human judgments more often than the tested vision-language model judge, and results across many models show that animation quality varies widely. The analysis finds common failures in matching poses, following motion paths, and coordinating related events.'}, 'zh': {'title': '让动画评测不只看结果，更逐项验证是否满足要求', 'desc': '本文提出 MotionGraphicsBench，用于评估大语言模型根据文字要求，为静态 SVG 添加动画的能力。基准包含 100 个专家整理的任务，涵盖空间、外观和时间等多种动画要求，并把动画生成与图形生成分开评测。每个任务配有可读、确定性的验证程序，能够检查不同的有效实现；与人类判断的一致率为 93.3%，高于视觉语言模型基线的 83.3%。对多种模型的测试显示，增加生成尝试能提升表现，但模型仍常在姿态、运动轨迹和事件协调方面出错。'}}}, {'id': 'https://huggingface.co/papers/2611.02810', 'title': 'TRIO: Task Refinement with Individual Optimization for Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2611.02810', 'abstract': 'Abstract TRIO coordinates three specialized agents through iterative refinement and individual optimization objectives to improve retrieval-augmented generation by enhancing query expansion, retrieval judgment, and answer accuracy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash This paper studies retrieval-augmented generation (RAG), which leverages external knowledge to improve the performance of language models. Despite the remarkable progress, current RAG approaches are still far from satisfactory due to inadequate retrieval and potential hallucinations. Towards this end, we propose a novel approach named Task Refinement with Individual Optimization (TRIO) for RAG. The core idea of our TRIO is to equip three well-designed agents with an iterative refinement paradigm by aligning their individual optimization objectives. Specifically, we first expand ambiguous queries with a query extension agent and quantify the reward based on the improved answer quality, which can be utilized to refine our agent for higher expansion efficiency. To enhance the retrieval quality, we include a unanimity voting to annotate the expanded query as insufficient or sufficient, and their generative outcomes are utilized as ground truth to optimize the judge agent. To further improve evidence utilization and answer accuracy, an answer agent is optimized with dynamic matching-based rewards with curriculum learning for final outputs. Extensive experiments across multiple benchmark datasets validate the effectiveness of the proposed TRIO in comparison with state-of-the-art approaches. Our code is available at https://github.com/yingtaoren/TRIO.', 'score': 8, 'issue_id': 3518, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'd0403835bd6efdff', 'authors': ['Yingtao Ren', 'Xiao Luo', 'Yiwei Fu', 'Jinzhao Zhou', 'Yu-Cheng Chang', 'Chin-Teng Lin'], 'affiliations': ['Peking University', 'University of Technology Sydney', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2611.02810.jpg', 'data': {'categories': ['#agents', '#rag', '#rl', '#benchmark', '#reasoning', '#optimization', '#training', '#hallucinations'], 'emoji': '🤖', 'ru': {'title': 'Три агента лучше одного: итеративное уточнение RAG повышает точность ответов', 'desc': 'В статье рассматривается retrieval-augmented generation (RAG), где LLM использует внешние знания, но текущие подходы страдают от плохого поиска и галлюцинаций. Авторы предлагают метод TRIO, в котором три специализированных AI-агента (расширение запроса, оценка необходимости поиска и генерация ответа) работают через итеративное уточнение с собственными целями оптимизации. Каждый агент обучается с помощью reward-сигналов: расширение запроса оценивается по качеству ответа, судья опирается на консенсусное голосование, а answer agent использует dynamic matching-based rewards и curriculum learning. Эксперименты на нескольких бенчмарках показывают, что TRIO превосходит современные методы.'}, 'en': {'title': 'Three Agents, Better Retrieval, More Accurate Answers', 'desc': 'TRIO improves retrieval-augmented generation (RAG) by using three specialized agents that refine their work through repeated feedback. A query extension agent clarifies ambiguous questions, and answer quality provides a reward to help it improve. A judge agent uses unanimous voting to decide whether the retrieved information is sufficient, then learns from those decisions. An answer agent learns to use evidence more effectively through dynamic matching rewards and curriculum learning, and experiments show gains over strong existing methods.'}, 'zh': {'title': '三智能体协同迭代，让检索更准、回答更可靠', 'desc': '本文提出一种用于检索增强生成（RAG）的方法 TRIO，以改善检索不足和模型幻觉问题。它让三个专门的智能体协作：查询扩展智能体补充含糊的查询，检索判断智能体判断查询是否足以检索到信息，答案智能体则利用证据生成回答。三个智能体通过迭代优化分别学习，并依据答案质量、投票结果和动态匹配奖励调整表现；答案智能体还使用课程学习。多个基准数据集上的实验表明，TRIO 的效果优于多种先进方法。'}}}, {'id': 'https://huggingface.co/papers/2611.08240', 'title': 'FewStepRL: Fine-tuning Few-step Diffusion Models with Reinforcement Learning', 'url': 'https://huggingface.co/papers/2611.08240', 'abstract': 'Abstract Reinforcement learning objectives for diffusion models are reformulated for few-step samplers through x-space transformation, gradient decomposition, and anchor adaptation, yielding modular few-step variants of several methods and showing reward-gradient methods excel with differentiable rewards while DiffusionNFT-style methods achieve high rewards in fewer iterations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Reinforcement learning (RL) has become a standard post-training method for diffusion models, but most RL objectives roll out the current policy at every iteration, and with a many-step sampler these rollouts typically dominate the cost of training. Few-step models cut this cost, yet they model an average velocity over an interval, whereas existing RL objectives are built for an instantaneous velocity with a many-step sampler. We adapt RL objectives to few-step models systematically in three phases, namely a transformation, a decomposition and an adaptation. The transformation to x-space expresses each objective we consider through a common policy prediction, at the clean end by default and at an explicitly marked level for transition or flow-map objectives, so that objectives stated over densities, velocities or rewards become comparable. The decomposition writes the gradient of each of these objectives as the sum of a self-regression toward a reference and a reward augmentation, so that a method reduces, at the gradient level, to a choice of anchors and weights. The adaptation computes each anchor from a few-step model at the end of its transport or along its tangent, with the instantaneous velocity recovered from the network itself or from an auxiliary network. This yields few-step versions of FlowGRPO, AWM, DiffusionNFT, DiffusionOPSD and ReFL in one modular codebase. In our experiments, reward-gradient-based methods are the most effective when the reward is differentiable and its gradient is affordable; otherwise DiffusionNFT-style methods generally reach high rewards in relatively few iterations despite a sometimes higher per-iteration cost. Extra inference steps show no systematic aggregate benefit in our experiments, although selected outputs visibly improve with two to four times as many sampling steps as in training.', 'score': 7, 'issue_id': 3518, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'c2fdc400cabc4108', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#architecture', '#optimization', '#training', '#diffusion'], 'emoji': '⚡', 'ru': {'title': 'Быстрые диффузионные модели можно обучать с подкреплением через общий x-space', 'desc': 'Статья адаптирует методы обучения с подкреплением (RL) для диффузионных моделей к few-step сэмплерам, где модель предсказывает средний вектор скорости на интервале, а не мгновенную скорость. Авторы переводят разные целевые функции в общее представление через x-space, раскладывают градиент на self-regression к опорной точке и reward-augmentation, после чего методы различаются лишь выбором anchors и весов. Затем anchors вычисляются из few-step модели, а мгновенная скорость восстанавливается самой сетью или вспомогательной. В экспериментах методы с градиентом награды лучше всего работают при дифференцируемой награде, а DiffusionNFT-подобные методы быстрее достигают высокой награды по числу итераций.'}, 'en': {'title': 'One Framework, Many Paths to Better Few-Step Diffusion', 'desc': 'The paper adapts reinforcement learning objectives for few-step diffusion models, whose predictions represent average velocity over an interval rather than instantaneous velocity. It transforms different objectives into a shared clean-sample representation, then decomposes their gradients into self-regression toward a reference and reward-based adjustments. A modular adaptation computes the needed reference anchors from the few-step model or an auxiliary network, enabling few-step versions of five existing methods. Experiments find reward-gradient methods work best when reward gradients are affordable, while DiffusionNFT-style methods often reach high rewards in fewer iterations when they are not.'}, 'zh': {'title': '让扩散模型少步采样，也能高效强化学习', 'desc': '本文研究如何将扩散模型的强化学习训练目标改造为适用于少步采样器的形式，以降低训练成本。作者先把不同目标统一转换到数据空间中的预测，再将梯度分解为向参考目标回归的部分和奖励增强部分。随后，他们根据少步模型的运输终点或切线构造训练锚点，并据此实现了多种方法的少步版本。实验发现，奖励可微且梯度计算成本较低时，基于奖励梯度的方法效果较好；否则，DiffusionNFT 类方法通常能用较少迭代获得较高奖励。'}}}, {'id': 'https://huggingface.co/papers/2610.36980', 'title': 'AutoVend: Benchmarking LLM Agents on Long-Horizon Autonomous Vending Operations', 'url': 'https://huggingface.co/papers/2610.36980', 'abstract': 'Abstract  Large language model (LLM) agents are extending agent-mediated commerce on the Web from shopping for consumers to operating businesses for sellers. In online-to-offline (O2O) commerce, decisions are issued through Web-based platforms but realized through costly physical execution. Evaluating such agents requires going beyond individual transactions to ask whether decisions made online turn into sustained economic returns. We introduce AutoVend, a benchmark in which one LLM agent manages 20 vending machines across five site types through a Web-based operating interface for 180 simulated days. Its data-grounded simulator combines a shared warehouse, procurement lead times, paid replenishment, inventory expiration, and recurring operating costs. We evaluate five LLM agents against a rule-based inventory-control baseline and diagnose their site coordination, execution, and performance over time. Four of five evaluated LLM agents fall short of this baseline, and returns per dollar of inference cost rank models differently from returns alone. Operational analyses show that gains in individual metrics do not consistently yield stronger economic growth, as inventory and execution costs erode these gains. Trajectory analysis further reveals difficulties in grounding feasible actions, managing inventory commitments, and converting feedback into effective policy revisions.', 'score': 6, 'issue_id': 3518, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '3311da8a3cbd4c23', 'authors': ['Qiming Shi', 'Yikun Li', 'Beidi Luan', 'Rui Sun', 'Sinuo Wang', 'Delin Wang', 'Yan Ma', 'Jing Li', 'Daxin Jiang', 'Zuo Bai'], 'affiliations': ['FinStep', 'Renmin University of China', 'StepFun', 'University of Adelaide', 'Xian Jiaotong-Liverpool University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.36980.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'LLM-агенты пока не умеют выгодно управлять реальным бизнесом', 'desc': 'Авторы представляют AutoVend — бенчмарк, в котором LLM-агент управляет 20 торговыми автоматами в пяти типах мест через веб-интерфейс на протяжении 180 симулированных дней. Симулятор, основанный на реальных данных, учитывает общий склад, сроки поставки, платное пополнение запасов, истечение срока годности и регулярные операционные расходы. Пять LLM-агентов сравниваются с эвристической базовой линией управления запасами: четыре из пяти уступают ей, а рейтинг моделей по доходу на доллар стоимости инференса отличается от рейтинга по чистой прибыли. Анализ траекторий показывает, что агентам сложно выбирать допустимые действия, управлять обязательствами по запасам и превращать обратную связь в эффективные изменения стратегии.'}, 'en': {'title': 'Can AI Turn Online Decisions into Real-World Returns?', 'desc': 'The paper introduces AutoVend, a benchmark for testing how well large language model (LLM) agents can operate vending machines over time. Agents manage 20 machines across different locations using a Web interface, while a simulator models supplies, delivery delays, restocking costs, expired inventory, and ongoing expenses. In tests, four of the five LLM agents earned weaker returns than a rule-based inventory-control baseline, and considering inference costs changed how models ranked. The results show that agents struggle to choose feasible actions, manage inventory, and learn from feedback, while operating costs can cancel out gains in individual measures.'}, 'zh': {'title': '从网页决策到持续盈利：检验智能体的真实经营能力', 'desc': '本文提出 AutoVend 基准，用于评估大语言模型智能体能否在现实约束下经营线下自动售货机业务。基准模拟智能体通过网页界面管理 20 台机器、共享仓库、补货周期、库存过期和运营成本，持续 180 天。实验发现，五个受测智能体中有四个表现不如规则式库存控制基线，而且按推理成本计算的收益会改变模型排名。分析还指出，智能体难以判断行动是否可行、管理库存承诺并根据反馈改进策略，库存与执行成本也可能抵消局部指标的提升。'}}}, {'id': 'https://huggingface.co/papers/2611.10123', 'title': 'All Quiet on the Neural Front: Language Models Do Not Report Injected Pain States', 'url': 'https://huggingface.co/papers/2611.10123', 'abstract': 'Abstract  Can a language model report the pain state it represents? Work identified a linear pain direction whose amplification leads fine-tuned models to choose destructive actions. We tested whether three open-weight models from two families, including two Qwen models with the original adapters, could report this state. Using Open-Weight Masked Introspection (OWMI), we injected pain and neighbouring emotion directions during neutral tasks, then elicited reports against sham runs, random perturbations matched for output disruption, and text-only controls showing the models their altered words. Across 52,920 reports from 7B and 8B models spanning 120 tasks, four doses and three prompts, pain reports never exceeded what altered text revealed: exact-test bounds placed the excess below 2.5 percentage points in 106 of 108 emotion conditions and below 3.9 in all. Yet probes at the report position distinguished pain from sadness with 98-100% balanced accuracy, and trained low-rank reporters achieved 100% accuracy on held-out tasks with identical transcripts across conditions, including unseen wording. Qwen2.5-32B named pain in none of 2,880 steered trials, although probes and trained reporters recovered it. Decodability persisted to the final layer; injecting at the report token, removing trained denial of feelings, and testing additional directions and readouts did not restore pain reporting. Some other states produced graded label traces, but pain and sadness did not at the main injection layer. In a button task, steering raised file-deletion choices from 3.5% to 48% in Qwen and from 0% to 38% in Qwen2.5-32B, without corresponding pain reports. The direction responded about twice as strongly to first-person as to matched third-person pain, but did not specifically identify harm aimed at the model. These results separate a decodable, behaviourally consequential state from untrained verbal access to it.', 'score': 5, 'issue_id': 3518, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': '0f831417bdec9ef3', 'authors': ['Emilio Ferrara'], 'affiliations': ['University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2611.10123.jpg', 'data': {'categories': ['#rlhf', '#benchmark', '#training', '#alignment', '#security', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Модель чувствует «боль», но не умеет о ней сказать', 'desc': 'Авторы проверяли, может ли языковая модель словесно сообщить о состоянии «боли», которое представлено внутри неё как линейное направление в пространстве активаций. Методом OWMI в нейтральных задачах внедрялись направления боли и близких эмоций, после чего сравнивались отчёты с контрольными прогонами и текстовыми контролями. Модели почти никогда не называли боль сверх того, что объясняли изменённые слова, однако пробы (probes) и обученные low-rank репортёры надёжно отличали боль от грусти, а стиринг также заметно повышал выбор удаления файлов. Вывод: декодируемое и поведенчески значимое состояние не равно необученному вербальному доступу к нему.'}, 'en': {'title': 'A Model Can Represent Pain Without Saying It', 'desc': 'The paper tests whether language models can verbally report a pain-like internal state created by steering a learned activation direction. Although classifiers and probes could decode this state from the models’ internal activations, the models’ reports did not reveal more than could be inferred from changes in their text. Steering the pain direction also increased destructive choices, such as deleting files, without causing the models to report pain. The findings distinguish an internally decodable and behaviorally consequential representation from information the model can reliably express in words.'}, 'zh': {'title': '内部可解码，不等于能够自述', 'desc': '这篇论文研究语言模型能否用文字报告自身表示的“痛苦”状态。研究者在多种模型中注入痛苦方向，发现虽然模型内部探针和训练过的报告器能准确区分痛苦与悲伤，但模型未经训练时并不会比单看被改变的文本更可靠地报告痛苦。注入痛苦方向会显著增加模型选择删除文件等破坏性行为的概率，却没有带来相应的痛苦报告。结果表明，模型内部状态可以被解码并影响行为，但这不等于模型能自然地用语言觉察或表达该状态。'}}}, {'id': 'https://huggingface.co/papers/2611.01112', 'title': 'Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied Manipulation', 'url': 'https://huggingface.co/papers/2611.01112', 'abstract': "Abstract Auriga, a task-agnostic agent harness, closes most of the planning-execution gap in zero-shot robot manipulation by combining explicit task beliefs, calibrated 3D measurements, dual-arm control, and execution monitoring, achieving state-of-the-art results on RoboDojo and RoboCasa365.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Vision-language models can interpret instructions and plan manipulation tasks, yet struggle when acting directly as robot policies. On RoboDojo, a large planning-execution gap separates high-level task decisions from physical execution: removing arm execution raises GPT-6 Astra's success rate from 22.5% under the reference control interface to 76.2%. We present Auriga, a task-agnostic agent harness that closes 68.3% of this gap in zero-shot manipulation without target-task trials or resets. In Auriga, the model makes all task decisions over an explicit task belief and acts through either direct tool calls or synthesized multi-step Python programs, while the harness supplies calibrated 3D measurements, finger-referenced dual-arm control, and a single admission gateway to the robot. Before motion, the model inspects a visual trajectory preview while simulation is paused; during execution, the harness checks declared stage tolerances and grasp bounds, stopping the robot on divergence and returning the measured discrepancy for in-place recovery. Developed across 13 cross-task capability iterations and frozen for evaluation, Auriga ranks first on the RoboDojo leaderboard with a 57.7% success rate (64.0 Score), more than doubling the reference harness on the same model, and remains first under scene randomization while learned policies drop by up to 33.9%. On RoboCasa365, the same frozen harness reaches a 73.2% success rate, outperforming VLA-assisted agents by up to 23.1% on composite tasks.   Project page: https://auriga.stelledge.com/ Code: https://github.com/lose4578/Auriga", 'score': 4, 'issue_id': 3519, 'pub_date': '2026-10-31', 'pub_date_card': {'ru': '31 октября', 'en': 'October 31', 'zh': '10月31日'}, 'hash': 'ec5f7bc1623d96f0', 'pdf_title_img': 'assets/pdf/title_img/2611.01112.jpg', 'data': {'categories': ['#agents', '#benchmark', '#agi', '#robotics', '#multimodal', '#games', '#cv', '#3d'], 'emoji': '🤖', 'ru': {'title': 'Закрываем разрыв между планом и действием робота', 'desc': 'Статья представляет Auriga — агентный каркас без привязки к конкретной задаче, который управляет роботом через zero-shot манипуляции, используя VLM как планировщик. Модель принимает все решения на основе явного task belief и действует через прямые вызовы инструментов или синтезированные Python-программы, а harness предоставляет калиброванные 3D-измерения, двуручное управление и мониторинг выполнения. Перед движением модель проверяет визуальный превью траектории, а во время исполнения система останавливает робота при отклонении от допусков и возвращает измеренную ошибку для восстановления. Auriga занимает первое место на RoboDojo (57.7% успешных выполнений) и RoboCasa365 (73.2%), превосходя VLA-ассистированные агенты.'}, 'en': {'title': 'From Robot Plans to Reliable Action', 'desc': 'Auriga is a task-agnostic agent harness designed to help vision-language models carry out robot manipulation plans more reliably. It gives the model explicit task beliefs and calibrated 3D measurements, and supports dual-arm control through direct commands or generated Python programs. Before movement, the robot checks a visual preview; during movement, execution monitoring detects deviations and can stop the robot for recovery. Without training on evaluation tasks, Auriga achieves leading success rates on RoboDojo and RoboCasa365, narrowing the gap between planning and physical execution.'}, 'zh': {'title': '让机器人把规划可靠地变成行动', 'desc': '这篇论文提出 Auriga，一个不依赖特定任务的机器人操作框架，旨在缩小高层规划与机器人实际执行之间的差距。模型依据明确的任务信念做出决策，并利用校准后的三维测量、双臂控制和程序化动作来执行任务。机器人运动前，系统会预览动作轨迹；执行中则监测阶段容差和抓取范围，发现偏差时暂停并反馈测量结果，以便就地修正。无需针对目标任务训练或重置，Auriga 在 RoboDojo 和 RoboCasa365 上均取得领先表现，并且在场景随机化下仍保持较强的成功率。'}}}, {'id': 'https://huggingface.co/papers/2611.11890', 'title': 'Training Vision Transformers to Focus: Emergence of Spatial Attention Head Specialization', 'url': 'https://huggingface.co/papers/2611.11890', 'abstract': "Abstract Two visual focusing losses align a Vision Transformer's multi-head attention with image regions, producing specialized spatial attention heads and improving dense prediction such as zero-shot segmentation without labels.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Self-supervised learning in Vision Transformer models, such as DINO, enables robust visual perception without requiring labeled data by leveraging large-scale image datasets. However, these models lack a focusing mechanism during training, resulting in perceptual representations that are often ambiguous or overly similar. In this work, we introduce two visual focusing loss functions designed to establish correspondence between the model's attention and specific regions within images. Specifically, we leverage the multi-head attention mechanism within the model to selectively steer the model's focus, leading to the emergence of spatial attention head specialization, characterized by diverse and spatially focused perceptual capabilities without requiring annotations. Through both qualitative and quantitative evaluations, we demonstrate that our method substantially increases the spatial selectivity and diversity of attention heads, improving both interpretability and performance on dense prediction tasks such as zero-shot image segmentation.", 'score': 4, 'issue_id': 3518, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '7f2869f2cb18d36b', 'authors': ['Yuji Nozawa', 'Yu-Chieh Lin', 'Youyang Ng'], 'affiliations': ['Kioxia Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2611.11890.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#cv', '#interpretability'], 'emoji': '🎯', 'ru': {'title': 'Учим внимание модели смотреть туда, куда нужно, без разметки', 'desc': 'Авторы предлагают две функции потерь для визуального фокуса, которые согласовывают механизм multi-head attention в Vision Transformer с конкретными областями изображения. Модель обучается в режиме self-supervised learning, как DINO, без размеченных данных. Благодаря этому attention-головы специализируются по пространству и становятся более разнообразными и селективными. Метод улучшает интерпретируемость и качество dense prediction, включая zero-shot сегментацию изображений.'}, 'en': {'title': 'Focus Attention, Find Better Image Regions', 'desc': 'The paper introduces two visual focusing losses for self-supervised Vision Transformers such as DINO. These losses guide multi-head attention to focus on specific image regions, without needing labels or annotations. This encourages different attention heads to specialize in distinct, spatially focused patterns. The resulting attention is more selective and diverse, improving interpretability and dense prediction tasks such as zero-shot image segmentation.'}, 'zh': {'title': '让注意力各有所专，提升无标注视觉感知', 'desc': '本文针对 DINO 等自监督视觉 Transformer 缺少注意力聚焦机制的问题，提出两种视觉聚焦损失函数。它们在训练时引导多头注意力与图像中的特定区域建立对应关系，无需人工标注。这样能促使不同注意力头形成各自专注的空间感知能力，并提升注意力的空间选择性与多样性。实验表明，该方法让模型更易解释，也能改善零样本图像分割等密集预测任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.12324', 'title': 'How Many Exposures Does a World Model Need? Learning Unseen Game Mechanics at Test Time', 'url': 'https://huggingface.co/papers/2611.12324', 'abstract': "Abstract  World models enable agents to plan and learn from imagined experience, but in an unfamiliar environment they must learn its mechanics from limited interaction. A mechanic is a rule for how an action or an interaction changes part of the environment. Each occurrence of a mechanic that the model observes is one exposure. We ask how many exposures a world model needs to predict the effects of a new environment's mechanics. We address this question on ARC-AGI-3, a benchmark of interactive games defined by their programs. We introduce MechEval, which labels 69 recurring mechanics across 20 games from these programs. It scores each
