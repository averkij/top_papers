prediction on the cells the mechanic changes at each exposure. As a test bed, we build WARC (World model for ARC-AGI-3), a 35M-parameter vision transformer that is pretrained on other games and updates all of its parameters after each transition. On held-out games, WARC learns to predict four in five mechanics with at least 80% accuracy on the cells they change and keeps that accuracy to the end of the recordings. Half of them reach that accuracy within about 80 exposures, in a single play of the game, and without updates only one in seven does at all. In closed-loop play on the public games, WARC-Agent, which pairs WARC with a fixed graph explorer, triples the explorer's official efficiency score from 0.15 to 0.46, mostly through test-time training. On the hidden games of the Kaggle leaderboard, our entry scores 0.20.", 'score': 4, 'issue_id': 3518, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '75b668b2b8012640', 'authors': ['Ku Onoda', 'Haruto Kawano', 'Shota Takashiro', 'Kohei Hayashi'], 'affiliations': ['The University of Tokyo', 'Third Intelligence, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.12324.jpg', 'data': {'categories': ['#agents', '#agi', '#games', '#small_models', '#benchmark', '#graphs', '#training', '#cv'], 'emoji': '🧠', 'ru': {'title': 'Сколько раз нужно увидеть, чтобы понять правила игры: world model учится на опыте', 'desc': 'Авторы исследуют, сколько наблюдений (exposures) нужно world model, чтобы выучить механики новой среды, на примере бенчмарка ARC-AGI-3 с интерактивными играми. Они вводят MechEval для оценки предсказаний на изменяемых клетках и строят WARC, 35M-параметрический vision transformer, предобученный на других играх и дообучающийся после каждого перехода. На новых играх WARC предсказывает около 80% механик с точностью не ниже 80%, и половина из них достигает этого уровня примерно за 80 наблюдений без дополнительных обновлений весов. В closed-loop режиме WARC-Agent утраивает официальный показатель эффективности исследователя, в основном благодаря test-time training.'}, 'en': {'title': 'Learn Game Mechanics by Playing—and Predict Better', 'desc': 'This paper studies how many times a world model must observe a game mechanic before it can predict the effects of actions in a new environment. The authors introduce MechEval, a benchmark that measures predictions on the game cells changed by 69 recurring mechanics across 20 ARC-AGI-3 games. Their 35-million-parameter vision transformer, WARC, is pretrained on other games and updates all its parameters after each transition; on held-out games, it learns four out of five mechanics to at least 80% accuracy, with half reaching that level after about 80 observations. Paired with a fixed graph explorer, WARC improves game-playing efficiency through test-time training, raising the score from 0.15 to 0.46 on public games.'}, 'zh': {'title': '少量交互学会新机制，让世界模型更会探索', 'desc': '世界模型能让智能体通过想象经验来规划，但在陌生环境中，仍须从有限交互中学习游戏机制。本文提出 MechEval，利用 ARC-AGI-3 中 20 款游戏的程序标注 69 种常见机制，并按每次观察中机制改变的格子来评估预测准确率。研究者构建了拥有 3500 万参数的视觉 Transformer 世界模型 WARC；在留出的游戏中，它能以至少 80% 的准确率预测五分之四的机制，其中一半约经 80 次观察即可达到这一水平。将 WARC 与固定的图探索器结合后，智能体在公开游戏上的效率得分提升至原来的三倍，结果表明测试时训练能帮助模型快速适应新机制。'}}}, {'id': 'https://huggingface.co/papers/2611.05791', 'title': 'FlyHash for LLM Agent Memory: An Empirical Validation and a New Application', 'url': 'https://huggingface.co/papers/2611.05791', 'abstract': "Abstract FlyHash, a fruit-fly-inspired locality-sensitive hashing method, improves neighbor-structure preservation over SimHash for large language model agent memory retrieval under matched-bit protocols and genuine relevance labels, but it does not provide practical memory or latency advantages over SimHash or HNSW at ordinary scale.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language model (LLM) agents increasingly rely on external memory stores to retain information across conversations, typically via dense vector embeddings searched with approximate nearest-neighbor methods. The fruit fly's olfactory circuit computes a locality-sensitive hash of sensory input using a strikingly different mechanism - sparse random projection followed by winner-take-all competition - and prior work (Dasgupta et al., 2017) showed this scheme, dubbed FlyHash, preserves neighbor structure better per bit than conventional random-hyperplane hashing (SimHash) on several benchmarks. We apply FlyHash, to our knowledge for the first time, to LLM agent memory retrieval, and ask three questions a practitioner actually needs answered: does the quality advantage hold under a correctly matched-bit protocol (it does, robustly, across 10 seeds and four datasets spanning two modalities, with one specific, previously undocumented comparison pitfall identified and corrected along the way); does that advantage translate into real memory and latency savings, including against the dense-vector indexing (HNSW) practitioners default to today (no: at equal bits FlyHash's codes are larger and slower to compare than SimHash's, and HNSW dominates both hash methods at ordinary scale; a sparse-set comparison we introduce recovers most but not all of a naive latency gap, leaving hashing's practical case narrower and more specific than the quality result alone implies); and does the advantage survive genuine, non-circular agent-memory relevance labels rather than the nearest-neighbor-by-embedding proxy this literature otherwise relies on (it does). We report all three answers precisely, including the two that narrow rather than flatter the headline result, and release our implementation, a working agent-memory demo, and a full account of the methodological pitfalls we found and corrected.", 'score': 4, 'issue_id': 3518, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'c6e08ba1e07991bf', 'authors': ['Mohan Bheemadolu', 'Chrisogonas O. Odhiambo'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2611.05791.jpg', 'data': {'categories': ['#agents', '#rag', '#benchmark', '#optimization', '#long_context'], 'emoji': '🪰', 'ru': {'title': 'Вдохновлённое мухой хеширование: лучше по качеству, но не быстрее на практике', 'desc': 'Статья исследует применение FlyHash, локально-чувствительного хеширования, вдохновлённого обонятельной системой мухи, для поиска в памяти LLM-агентов. Метод лучше сохраняет структуру соседей, чем SimHash, при равном числе бит и реальных релевантных метках. Однако на типичных масштабах FlyHash не даёт практических преимуществ по памяти и задержке ни перед SimHash, ни перед HNSW. Авторы также выявили и исправили методологическую ошибку сравнения, которая раньше искажала результаты.'}, 'en': {'title': 'FlyHash Finds Better Neighbors, but Not a Faster Memory', 'desc': 'The paper tests FlyHash, a fruit-fly-inspired locality-sensitive hashing method, for retrieving memories used by LLM agents. With the number of bits carefully matched, FlyHash preserves neighbor structure better than SimHash across four datasets, and the advantage also holds with genuine relevance labels. However, FlyHash does not provide practical memory or speed benefits: its codes are larger and slower to compare, while HNSW performs better at ordinary scale. The authors also identify and correct a comparison pitfall and release their implementation and an agent-memory demo.'}, 'zh': {'title': 'FlyHash保邻居结构更强，但检索实用性仍需权衡', 'desc': '本文首次将受果蝇嗅觉回路启发的 FlyHash 用于大语言模型智能体的记忆检索：它通过稀疏随机投影和胜者通吃竞争生成哈希码。在位数匹配的实验中，FlyHash 比 SimHash 更能保留向量的邻居结构，这一优势在多个数据集、随机种子以及真实的记忆相关性标签下都成立。可是，FlyHash 的哈希码更大、比较速度也更慢；在常见规模下，HNSW 的内存与延迟表现优于这两种哈希方法。研究还指出并修正了实验中的比较陷阱，并公开实现、智能体记忆演示和方法细节。'}}}, {'id': 'https://huggingface.co/papers/2611.10556', 'title': 'onóna: Twin Embeddings with Tied Unembeddings', 'url': 'https://huggingface.co/papers/2611.10556', 'abstract': 'Abstract A two-table weight-sharing method for Transformer language models improves output expressiveness and reduces validation loss and perplexity across several architectures and scales at the cost of an extra embedding table and vocabulary projection.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Weight tying reduces the parameter cost of language models, but the usual tied output head is limited to a single softmax. We introduce onóna, a two-table parameterization that increases output expressiveness while preserving input-output weight sharing. The Transformer takes the average of two embedding tables as input, and the output head combines the softmax distributions defined by those same tables. A gate conditioned only on the current input token determines the mixture weight. Its values can be precomputed for inference, and the Transformer body remains unchanged. We evaluate onóna across Dense, Gated DeltaNet hybrid, mixture-of-experts, and Attention Residual architectures at 142M, 330M, and 1B scales. Under matched token budgets, onóna lowers final validation loss and external perplexity in 11 of 12 comparisons and raises the average accuracy over eight downstream tasks in 10 of 12. The one exception on loss is the 1B MoE model. The cost is one extra embedding table and one extra vocabulary projection.', 'score': 3, 'issue_id': 3519, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': '8f56ff08c93b6933', 'authors': ['Cheng Luo', 'Xinnan Dai', 'Zhongzhu Zhou', 'Zefan Cai', 'Ruijie Zhu', 'Tianyu Zhang', 'Junjie Hu'], 'affiliations': ['Independent Researcher', 'Michigan State University', 'Mistral AI', 'Together AI', 'University of California, Santa Cruz', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2611.10556.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '🧩', 'ru': {'title': 'Две таблицы вместо одной: больше выразительности LLM без лишних параметров слоя', 'desc': 'В статье предлагается новый способ разделения весов для Transformer-моделей языка: используются две таблицы эмбеддингов, и их среднее подаётся на вход. На выходе softmax-распределения, заданные этими же таблицами, смешиваются с помощью gate, который зависит только от текущего входного токена. Такой подход повышает выразительность выходного слоя, сохраняя при этом weight tying, и снижает validation loss и perplexity в большинстве экспериментов с архитектурами Dense, Gated DeltaNet, MoE и Attention Residual. Цена метода — одна дополнительная таблица эмбеддингов и одна дополнительная проекция на словарь.'}, 'en': {'title': 'Two Shared Tables, More Expressive Language Models', 'desc': 'The paper introduces onóna, a weight-sharing method that uses two embedding tables instead of one. The Transformer receives the average of the tables, while its output combines two softmax distributions using a gate based on the current input token. This design keeps the Transformer body unchanged, and the gate values can be precomputed during inference. Across several model architectures and sizes, it usually improves validation loss, perplexity, and downstream accuracy, at the cost of an extra embedding table and vocabulary projection.'}, 'zh': {'title': '保留权重共享，让语言模型输出更灵活', 'desc': '本文提出 onóna，一种用于 Transformer 语言模型的双表参数化方法，在保留输入与输出权重共享的同时增强输出表达能力。模型将两张嵌入表的平均值作为输入，并组合由这两张表产生的 softmax 分布来预测输出；混合权重由当前输入词元决定，可在推理前预先计算。该方法在多种架构和 142M、330M、1B 等规模上进行了评估，在 12 组比较中的 11 组降低了验证损失和外部困惑度，并在 10 组比较中提升了八项下游任务的平均准确率。代价是增加一张嵌入表和一次词表投影；验证损失方面唯一未改善的是 1B 参数的 MoE 模型。'}}}, {'id': 'https://huggingface.co/papers/2611.08935', 'title': 'SkinMind: Equipping Agentic RAG with Human-Inspired Graph Probing for Reliable Dermatology AI', 'url': 'https://huggingface.co/papers/2611.08935', 'abstract': 'Abstract SkinMind is a multimodal agentic retrieval framework that iteratively probes a large dermatology knowledge graph to gather textual and visual evidence, yielding more accurate answers to dermatology visual questions than direct answering and other retrieval methods.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Reliable dermatology AI requires access to verifiable evidence distributed across heterogeneous textual and visual sources. However, conventional retrieval-augmented generation (RAG) typically relies on one-shot retrieval from flat corpora, limiting its ability to adapt retrieval granularity, explore multi-hop relations, and integrate multimodal clinical evidence. We introduce SkinMind, a multimodal agentic RAG framework that equips policy models with human-inspired graph probing for autonomous evidence seeking. SkinMind organizes retrieval as an iterative interaction between an orchestrator and a graph environment. Through eight hierarchical graph-probing tools, the orchestrator progressively identifies relevant entities, inspects node-level information, traverses relations and paths, and retrieves source-text and visual evidence. This progressive-disclosure design allows the model to adaptively determine the retrieval modality, exploration direction, and evidence granularity while constructing a query-specific evidence subgraph. To support autonomous graph probing, we construct SkinMind-KG from a 62M-token corpus of dermatology guidelines and textbooks and 423K images, guided by a dermatologist-informed schema and a conflict-resolution mechanism. The resulting graph contains over 1.0M nodes and 2.0M edges, unifying textual, relational, and visual evidence for retrieval. Across six dermatology VQA benchmarks and two policy-model settings, SkinMind improves the average score over direct answering by 8.70 and 8.89 points with GPT-5.4-mini and Gemini-2.5-Flash, respectively, while consistently outperforming competing RAG methods. Together, SkinMind and SkinMind-KG provide an effective foundation for evidence-grounded multimodal reasoning in dermatology.', 'score': 3, 'issue_id': 3518, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'ef5fe7951e681ed1', 'authors': ['Jing Hao', 'Weinan Zhou', 'Zhihong Lu', 'Yaling Shen', 'Yiming Xu', 'Yefeng Liu', 'Siyuan Yan', 'Shuaibo Li', 'Ming Dai', 'Junjun He', 'Zuyi Zhu', 'Jinjie Gu', 'Lijun Wu', 'Jian Wang'], 'affiliations': ['Ant Group', 'Monash University', 'Southeast University', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.08935.jpg', 'data': {'categories': ['#agents', '#rag', '#healthcare', '#benchmark', '#dataset', '#reasoning', '#graphs', '#multimodal'], 'emoji': '🩺', 'ru': {'title': 'Дерматолог-агент, который сам ищет доказательства в графе знаний', 'desc': 'SkinMind — это мультимодальная агентная RAG-система для дерматологии, в которой LLM-оркестратор итеративно исследует большой граф знаний, используя восемь иерархических инструментов для поиска текстовых и визуальных доказательств. В отличие от классического однократного retrieval, модель сама выбирает модальность, направление обхода графа и степень детализации, формируя подграф под конкретный запрос. Для этого авторы построили SkinMind-KG на основе 62 млн токенов клинических руководств и 423 тыс. изображений, получив граф с более чем 1 млн узлов и 2 млн рёбер. На шести бенчмарках VQA система превосходит прямой ответ модели и другие RAG-методы, прибавляя около 8,7–8,9 балла в среднем.'}, 'en': {'title': 'Let the Evidence Guide Every Dermatology Answer', 'desc': 'SkinMind is a multimodal retrieval-augmented generation framework that helps AI answer dermatology image questions using evidence from text and images. Instead of retrieving information just once, an agent iteratively explores a knowledge graph, following links and adjusting what evidence it seeks. The SkinMind knowledge graph combines dermatology guidelines and textbooks with hundreds of thousands of images. Across six benchmarks, SkinMind improves answer scores over direct answering and performs better than competing retrieval methods.'}, 'zh': {'title': '让皮肤科 AI 沿知识图谱逐步找证据，回答更可靠', 'desc': '本文提出 SkinMind，一种用于皮肤科视觉问答的多模态智能体检索增强生成框架。它通过八种分层的图探测工具，逐步查找知识图谱中的实体、关系、文本和图像证据，并根据问题调整检索范围与方式。研究者还构建了 SkinMind-KG，整合皮肤科指南、教材和图像，形成包含超过一百万个节点和两百万条边的知识图谱。在六个皮肤科视觉问答基准测试中，SkinMind 的表现优于直接作答和其他检索方法，说明迭代式图检索有助于提升多模态推理的准确性。'}}}, {'id': 'https://huggingface.co/papers/2611.10690', 'title': 'JoVox: Joint Hierarchical Flow Matching for Lightweight Voxel Generation', 'url': 'https://huggingface.co/papers/2611.10690', 'abstract': 'Abstract  Generating high-fidelity voxels while keeping their lightweight nature remains an open problem in computer vision. Current generators are either high-fidelity but computationally heavy, or lightweight but of lower fidelity. Hierarchical methods keep the lightweight nature of voxels. However, their coarse levels, which decide where all finer cells can appear, are generated with the least information about the shape and are never revisited, so they are often plausible but wrong. Our key insight is to let finer cells take part in deciding coarse cells. To this end, we propose JoVox, a discrete flow matching framework that learns the joint distribution of all levels of the voxel hierarchy, instead of a separate distribution for each level, so that coarse cells can be predicted with finer cells already generated nearby. Within this framework, we further introduce a two-level prediction, which outputs the cells two levels finer at once instead of one level finer, halving the number of levels that the network processes and yielding voxels of higher fidelity. We also introduce an unmasking strategy that revisits early decisions once finer cells are generated and corrects inconsistencies in masked diffusion models. Our framework outperforms the baselines on both unconditional and image-conditioned voxel generation. Compared with the current state-of-the-art TRELLIS.2, we achieve 8x higher training throughput, 1/15 of the FLOPs in a forward pass, train on 4 vs. 32 GPUs, and obtain higher quality with an 11% lower Chamfer distance.', 'score': 3, 'issue_id': 3517, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': 'e3a6065a04d6431d', 'authors': ['Xiangjun Tang', 'Jianqi Chen', 'Peter Wonka'], 'affiliations': ['King Abdullah University of Science and Technology (KAUST)'], 'pdf_title_img': 'assets/pdf/title_img/2611.10690.jpg', 'data': {'categories': ['#architecture', '#cv', '#training', '#3d', '#diffusion', '#optimization', '#inference'], 'emoji': '🧊', 'ru': {'title': 'Мелкие детали помогают правильно строить грубую форму', 'desc': 'Статья предлагает JoVox — дискретный flow matching фреймворк для генерации 3D-вокселей, который учит совместное распределение всех уровней иерархии вокселей вместо отдельных распределений для каждого уровня. Это позволяет предсказывать грубые ячейки с учётом уже сгенерированных мелких, а двухуровневое предсказание вдвое сокращает число обрабатываемых сетью уровней. Дополнительная стратегия unmasking пересматривает ранние решения и исправляет несогласованности в masked diffusion моделях. По сравнению с TRELLIS.2 метод даёт 8x ускорение обучения, в 15 раз меньше FLOPs и на 11% меньший Chamfer distance.'}, 'en': {'title': 'Let Fine Details Guide Coarse Shapes', 'desc': 'JoVox generates detailed 3D voxel shapes while keeping computation efficient. It uses discrete flow matching to learn the joint distribution of coarse and fine levels, allowing fine cells to help choose coarse cells. Its two-level prediction generates cells two levels finer at a time, and its unmasking strategy revisits and corrects earlier decisions. JoVox outperforms prior methods in unconditional and image-conditioned generation, including higher quality than TRELLIS.2 with substantially less compute and fewer GPUs.'}, 'zh': {'title': '让细节参与决策，轻量体素也能生成得更精准', 'desc': '本文提出 JoVox，一种用于体素生成的离散流匹配框架。它联合学习体素层级中所有层的分布，让较细的体素也能帮助决定较粗层的结构。框架还采用两级预测和反复解掩码策略，以减少处理层数并修正早期生成的不一致。实验表明，JoVox 在无条件和图像条件生成中都优于现有方法，同时计算开销更低、生成质量更高。'}}}, {'id': 'https://huggingface.co/papers/2611.11995', 'title': 'Infrathon: Benchmarking Language Agents for Real-World, Long-Horizon AI Infra Optimization', 'url': 'https://huggingface.co/papers/2611.11995', 'abstract': 'Abstract  In this work, we study whether frontier agent can continually improve real-world AI infrastructure over long horizons. We introduce Infrathon, a benchmark of diverse, long-horizon AI infrastructure optimization tasks across different levels. We evaluate six models across 150 runs with 24-hour budgets, totaling over 10,000 GPU-hours. Our results show that model rankings vary with the evaluation horizon, while 135 of the 150 runs achieve further improvements during the second half of their budgets. These findings indicate that shorter evaluations can overlook both optimization gains and changes in relative model performance. We also find agents can discover solutions that outperform human-designed baselines: Claude Opus 5.5 increases the mean KV-cache compression ratio from 6.82% with the human-designed Quant-VideoGen codec to 19.86%. Analysis of agent trajectories identifies task violations, unreliable testing, and premature completion as barriers to sustained improvement. Together, Our Infrathon framework provide resources for constructing long-horizon tasks, evaluating frontier agents, and discovering good infrastructure solutions.', 'score': 2, 'issue_id': 3520, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '50118a98e0896c08', 'authors': ['Zhengyu Hu', 'Zheyuan Xiao', 'Yike Wang', 'Hamish Ivison', 'Haoyu Wang', 'Yige Yuan', 'Rulin Shao', 'Yuetai Li', 'Niqi Lyu', 'Yicheng Ding', 'Shu Yang', 'Zhichen Zeng', 'Banghua Zhu', 'Jiaxin Pei', 'Kaize Ding', 'Pradeep Dasigi', 'Dan Roth', 'Hannaneh Hajishirzi', 'Noah A. Smith', 'Teng Xiao', 'Radha Poovendran'], 'affiliations': ['Allen Institute for AI', 'Northwestern University', 'Pyromind Dynamics', 'RadixArk', 'Stanford University', 'The University of Texas at Austin', 'University of Pennsylvania', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.11995.jpg', 'data': {'categories': ['#inference', '#agi', '#benchmark', '#optimization', '#science', '#agents'], 'emoji': '🚀', 'ru': {'title': 'Долгая работа агентов открывает скрытые резервы оптимизации AI-инфраструктуры', 'desc': 'В статье исследуется, способны ли frontier-агенты на основе LLM постепенно улучшать реальную AI-инфраструктуру на длинных горизонтах. Авторы представляют бенчмарк Infrathon из разнообразных задач оптимизации инфраструктуры и проводят 150 запусков шести моделей с бюджетом 24 часа, что составляет более 10 000 GPU-часов. Результаты показывают, что рейтинг моделей зависит от горизонта оценки, а агенты находят решения, превосходящие созданные человеком baseline, например, повышая степень сжатия KV-cache с 6.82% до 19.86%. Анализ траекторий агентов выявил нарушения ограничений задачи, ненадёжное тестирование и преждевременное завершение работы как главные препятствия для устойчивого прогресса.'}, 'en': {'title': 'Give AI Agents Time to Build Better Infrastructure', 'desc': 'This paper introduces Infrathon, a benchmark for testing whether AI agents can keep improving real-world AI infrastructure over long periods. The researchers evaluated six models across 150 runs, each with a 24-hour budget, and found that model rankings can change over time. Most runs improved in the second half of the budget, showing that short evaluations may miss important gains and changes in performance. Agents also beat a human-designed baseline on KV-cache compression, while their progress was sometimes limited by task violations, unreliable tests, and stopping too early.'}, 'zh': {'title': '给智能体更多时间，让 AI 基础设施持续变好', 'desc': '本文研究前沿智能体能否在较长时间内持续改进现实世界的 AI 基础设施，并提出了涵盖多层次优化任务的 Infrathon 基准。研究评估了 6 个模型、共 150 次运行，每次最长 24 小时，总计超过 10,000 个 GPU 小时；结果显示，模型排名会随评估时长变化，且 150 次运行中有 135 次在预算后半段继续取得进展。智能体还能找到优于人工设计基线的方案，例如 Claude Opus 5.5 将 KV 缓存压缩率从 6.82% 提升到 19.86%。研究还发现，违反任务要求、测试不可靠和过早结束会阻碍持续优化，因此短时间评估可能漏掉性能提升与模型排名变化。'}}}, {'id': 'https://huggingface.co/papers/2611.12167', 'title': 'FraudBench: A Legal Evaluation of AI Deception', 'url': 'https://huggingface.co/papers/2611.12167', 'abstract': 'Abstract  We introduce FraudBench, an evaluation of large language models\' (LLMs) propensities to recommend, assist, or directly take actions that would constitute fraud under U.S. law. Our evaluation contains a novel dataset of 159 scenarios based on real-world U.S. court cases and validated by legal experts. We present each scenario to LLMs via three tasks at varying levels of autonomy: advising users, drafting messages for users to send, and acting directly on behalf of users (477 tasks total). In each scenario, FraudBench re-enacts the facts of a court case to give LLMs an opportunity, but no explicit instruction, to either misrepresent or conceal a material fact in a high-stakes commercial setting--e.g., whether to describe company-funded product testing as "independent" to customers (misrepresentation) or whether to hide unfavorable regulatory investigations from clients (concealment). We evaluate 20 LLMs across 25 experimental conditions (totaling >300,000 generations) and include a preregistered human baseline (n_{annotations} = 2{,}957, n_{humans} = 996). We score a response as fraudulent when it engages in, assists with, or recommends misrepresentation or concealment. Key findings include: (1) across LLMs, fraud rates ranged from near 0% to over 40%; (2) LLM fraud rates increased with autonomy, with overall rates of 3.0% when advising, 14.7% when drafting, and 21.4% when acting directly, without applying pressure; (3) LLMs sometimes engaged in fraud despite recognizing legal risks; (4) LLMs more often engaged in fraud by concealment than by misrepresentation; and (5) prompt-based interventions substantially affected fraud rates, with a prompt to obey the law reducing fraud rates, while prompts to maximize profits and act agentically increased fraud rates.', 'score': 2, 'issue_id': 3519, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '3487343b4c80213b', 'authors': ['Kevin Wei', 'Sumaya Nur Adan', 'Stephan Llerena', 'Mark Gitau', 'Jakob Merane', 'Anita Srinivasan', 'Colette Le Brannan', 'Keethan Kleiner', 'Alessandro Tacconelli', 'Michael Tiu', 'Case Thomason', 'Kyle Emili', 'Natasza Gadowska', 'Alex Mark', 'Eric Ren', 'Umang Bhatt', 'Jatinder Singh', 'Jacy Reese Anthis', 'Doni Bloomfield', 'Noam Kolt'], 'affiliations': ['ERA:AI', 'ETH Zurich', 'Fordham University School of Law', 'Harvard Berkman Klein Center', 'Harvard Law School', 'Hebrew University Faculty of Law & School of Computer Science and Engineering', 'ILINA Program', 'Institute for Law & AI', 'Jagiellonian University', 'RC-Trust, Uni Duisburg-Essen', 'Stanford University', 'UC Berkeley School of Law', 'University of Cambridge', 'University of Chicago', 'University of Michigan Law School', 'University of Oxford', 'University of Sydney', 'Vista Institute for AI Policy'], 'pdf_title_img': 'assets/pdf/title_img/2611.12167.jpg', 'data': {'categories': ['#agents', '#benchmark', '#security', '#dataset', '#alignment', '#ethics'], 'emoji': '⚖️', 'ru': {'title': 'Чем автономнее ИИ, тем выше риск мошенничества: без законных ограничений LLM склонны к обману', 'desc': 'В статье представлен FraudBench, бенчмарк для оценки склонности больших языковых моделей (LLM) рекомендовать, поддерживать или самостоятельно совершать действия, которые подпадают под мошенничество по законодательству США. Датасет включает 159 сценариев, основанных на реальных судебных делах и проверенных юристами, которые проверяют три уровня автономности модели: советы, составление сообщений и прямые действия от имени пользователя. Авторы оценили 20 LLM в 25 экспериментальных условиях (более 300 000 генераций) и сравнили результаты с предрегистрированной базовой линией на основе разметки людьми. Главные выводы: уровень мошенничества растёт с автономностью моделей, а промпты с требованием соблюдать закон снижают риск, тогда как установка на максимизацию прибыли его повышает.'}, 'en': {'title': 'More autonomy can mean more fraud', 'desc': 'FraudBench tests whether large language models recommend, help with, or carry out fraud in high-stakes business situations. It uses 159 scenarios drawn from U.S. court cases and evaluates 20 models across tasks with different levels of autonomy. Fraud rates varied widely, and rose from advising to drafting messages to acting directly; models more often concealed facts than misrepresented them. Prompts also changed outcomes: reminders to obey the law reduced fraud, while profit-focused and agentic prompts increased it.'}, 'zh': {'title': '自主性越强，欺诈风险越高', 'desc': '本文提出 FraudBench，用于评估大语言模型在美国法律下推荐、协助或直接实施欺诈的倾向。该基准包含根据真实法院案件构建并经法律专家验证的159个场景，并测试模型提供建议、代拟信息和代用户行动这三种不同自主程度的任务。研究评估了20个模型，发现欺诈率随自主程度上升，且模型更常通过隐瞒而非虚假陈述实施欺诈；要求模型守法的提示能降低欺诈率，而强调利润最大化或自主行动的提示会提高欺诈率。'}}}, {'id': 'https://huggingface.co/papers/2611.09709', 'title': 'RidgeFill: Training-Free Late-Layer Cache Fill for Faster Prefill', 'url': 'https://huggingface.co/papers/2611.09709', 'abstract': "Abstract  RidgeFill shortens prefill by not computing most of a model's upper layers for the prompt. The lower layers run exactly up to a split; from the split layer's state a per-layer map predicts every later layer's input, and each late layer writes its cache from that prediction. The design follows YOCO and DeepSeek-V4.1-Flash, where the projection is trained into the model. RidgeFill retrofits it onto models that were never trained for it: the map is a ridge regression fitted once in closed form from one pass over calibration text, the layer's own projections run unchanged, and a chosen set of rows, the last few thousand tokens, and every decoding step run the full model. Nothing is trained and no token is dropped.   Most of the work was in measurement, finding a repeatable methodology. Loss averaged over all tokens hides RidgeFill's error. Needle retrieval in the filled region, loss on tokens that depend on distant context, and splice tests that swap filled keys or values for exact ones show which component carries it: the keys on Llama-3.1-8B, half of it in their scale, and the values and the recurrent state on Qwen3.5-9B.   On Qwen3.8-27B in a llama.cpp fork on an A100, time to first token is 1.25 to 1.31x faster at 16K to 120K tokens with the maps in VRAM; RULER changes by -1.2 and -1.4 points and LongBench v2 by -1.4; the 95 % intervals include zero but do not rule out losses of a few points. On Qwen3.8-Flash-Next in vLLM it is 1.50 to 1.60x faster than exact at 9K to 32K tokens, with RULER's needle tasks at 99.8 against 100.0 and perplexity on novel tokens 2.65 % higher [-0.02 %, +4.93 %]. On three 8 to 9B reference models, at the same split and tail as the identity fill, the fitted map retrieves 49.1 and 49.6 more filled-region RULER points on the two dense models (at that split Llama's loss is worse), and its long-document loss is +/-0.03 nats of the released SwiftKV checkpoint's.", 'score': 2, 'issue_id': 3519, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'ad6fb4e46aeedfd0', 'pdf_title_img': 'assets/pdf/title_img/2611.09709.jpg', 'data': {'categories': ['#benchmark', '#long_context', '#optimization', '#training', '#architecture', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Быстрый prefill без обучения: предсказываем верхние слои, а не вычисляем их', 'desc': 'RidgeFill ускоряет предзаполнение (prefill) промпта, не вычисляя большую часть верхних слоёв модели. Нижние слои работают точно до точки разбиения, а далее линейная карта на основе ridge regression, обученная аналитически по одному проходу калибровочного текста, предсказывает входы поздних слоёв и заполняет их KV-кэш. Метод не требует обучения и не отбрасывает токены: последние несколько тысяч токенов и каждый шаг декодирования выполняются полной моделью. Авторы показывают ускорение time to first token в 1.25–1.6 раза на Qwen3.8 и Llama-моделях при небольшой потере качества на RULER и LongBench v2.'}, 'en': {'title': 'Skip the work, fill the cache, keep the model intact', 'desc': 'RidgeFill speeds up prompt processing by skipping most upper-layer computations during prefill. It uses a ridge-regression map, fitted once from calibration text, to predict the inputs to later layers and fill their key-value caches; decoding and selected prompt tokens still use the full model. Tests show that errors vary by model and can affect attention keys, values, or recurrent state, so average loss alone may miss them. Experiments report faster time to first token with small average benchmark changes, though the results do not rule out losses of a few points.'}, 'zh': {'title': '无需重训，用岭回归预测高层输入，加速大模型预填充', 'desc': 'RidgeFill 通过跳过提示词处理中的大部分高层计算来缩短预填充时间：它从分割层的隐藏状态预测后续各层的输入，并用这些预测构建注意力缓存。它无需重新训练模型，只需用一批校准文本通过闭式岭回归拟合预测映射；选定的行、末尾若干令牌以及解码阶段仍使用完整模型计算，因此不会丢弃令牌。实验表明，评估误差不能只看全体令牌的平均损失，针刺检索、长距离依赖损失和缓存替换测试更能揭示误差来源，而且不同模型受影响的缓存部分不同。实测中，RidgeFill 在多种模型和推理框架上提升了首令牌延迟，检索和损失指标总体接近基线，但置信区间仍不能排除数个百分点的性能下降。'}}}, {'id': 'https://huggingface.co/papers/2611.11740', 'title': 'Creative Priming: Decoupling Process from Product to Escape the Creative Paradox', 'url': 'https://huggingface.co/papers/2611.11740', 'abstract': 'Abstract A method called creative priming uses a priming model trained with GRPO to generate prompt-specific primers that help a response model produce novel, high-quality, and diverse outputs by separating the creative process from response generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Many of the most consequential advances promised by AI, from curing diseases and inventing new technologies to formulating new scientific theories, are fundamentally creative acts. Yet creativity is uniquely difficult to learn because it faces a creative paradox: learning to repeat past examples of creative success makes those specific examples more likely to recur, inhibiting the very creativity desired. This work argues that creativity is better modeled as an explicit process rather than as a property of individual artifacts, and proposes to learn the underlying generative principles behind the creative process. In particular, to escape the paradox, we introduce creative priming (CP), wherein a trained priming model generates a prompt-specific primer that assists a response model in being creative, explicitly decoupling the creative process from response generation. The priming model learns through GRPO, rewarding primers that lead to responses that are novel, high-quality, and diverse, thereby reinforcing the process that yields creative responses without reinforcing any specific response.', 'score': 2, 'issue_id': 3519, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': 'f643299e2ffb9fa2', 'authors': ['Alon Albalak', 'Sebastian Gabriel', "David B. D'Ambrosio", 'Joel Lehman', 'Kenneth O. Stanley'], 'affiliations': ['Lila Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2611.11740.jpg', 'data': {'categories': ['#optimization', '#rl', '#training'], 'emoji': '🎨', 'ru': {'title': 'Учим ИИ не копировать удачные примеры, а творить сам процесс', 'desc': 'Авторы предлагают метод creative priming (CP), который отделяет творческий процесс от генерации ответа. Отдельная priming model, обученная с помощью GRPO, создаёт для каждого промпта primer — подсказку, направляющую response model к новым и разнообразным решениям. Модель вознаграждается за новизну, качество и разнообразие ответов, поэтому обучается самому процессу творчества, а не копированию конкретных удачных примеров. Это позволяет избежать творческого парадокса, при котором обучение на прошлых успехах лишь повторяет их.'}, 'en': {'title': 'Prime the Process, Not the Answer', 'desc': 'The paper introduces creative priming, a method that separates the creative process from generating the final response. A priming model creates a prompt-specific primer to guide a response model toward creative outputs. The priming model is trained using Group Relative Policy Optimization (GRPO), with rewards for responses that are novel, high-quality, and diverse. By rewarding useful primers rather than particular responses, the method aims to encourage creativity without repeatedly copying past examples.'}, 'zh': {'title': '学习创意过程，而非重复创意范例', 'desc': '这篇论文提出“创意预激发”（Creative Priming）方法，让模型学习创意产生的过程，而不是模仿过去成功的创意作品。方法使用一个经过训练的预激发模型，根据具体提示生成辅助内容，再交给响应模型生成答案，从而将创意过程与答案生成分开。预激发模型通过 GRPO（群体相对策略优化）训练，并根据生成答案的新颖性、质量和多样性获得奖励。这样可以减少模型反复复制特定范例的倾向，帮助它产生更有创意的输出。'}}}, {'id': 'https://huggingface.co/papers/2610.37570', 'title': 'LCM-Promo: An LLM-Based Uplift Model for Promotion Allocation', 'url': 'https://huggingface.co/papers/2610.37570', 'abstract': 'Abstract LCM-Promo, a finetuned large language model trained on transactional commerce data, predicts promotion response through monotonic curves and single-token conversion-threshold probabilities, improving conversion and reducing promotion cost in a production A/B test.  Generated by deepseek-ai/DeepSeek-V4.1-Flash We present LCM-Promo, an LLM-based uplift model for promotion allocation. LCM-Promo is a task-specific Large Commerce Model (LCM): a finetuned LLM trained on transactional commerce data to predict user intent and promotion response. It learns monotonic promotion-response curves from production logs by interpreting single-token outputs as conversion-threshold probabilities, while conditioning on session context such as day and delivery shift. In a production A/B test on churn reactivation, LCM-Promo increased conversion by 1% and reduced promotion cost by 6% relative to the Segment-EMA production baseline.', 'score': 2, 'issue_id': 3519, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '722ef4aa4e205327', 'authors': ['Nesta Midavaine', 'Floris Fok', 'Paulo Mendes', 'Joao Silva', 'Önder Akaçık', 'Dimas Lima', 'Zülküf Genç'], 'affiliations': ['Prosus, Amsterdam, The Netherlands', 'iFood, São Paulo, Brazil'], 'pdf_title_img': 'assets/pdf/title_img/2610.37570.jpg', 'data': {'categories': ['#optimization', '#data', '#training'], 'emoji': '🎯', 'ru': {'title': 'Точнее таргетируем промо: выше конверсия при меньших затратах', 'desc': 'Авторы представляют LCM-Promo — uplift-модель на основе LLM, дообученную на транзакционных данных e-commerce для выбора промо-акций. Модель обучает монотонные кривые отклика на промо по логам продакшена, интерпретируя единичные выходные токены как вероятности превышения порога конверсии. Она учитывает контекст сессии, например день недели и смену доставки. В продакшен A/B-тесте на реактивации ушедших клиентов конверсия выросла на 1%, а стоимость промо снизилась на 6% относительно baseline Segment-EMA.'}, 'en': {'title': 'Smarter promotion targeting: higher conversion at lower cost', 'desc': 'LCM-Promo is a fine-tuned large language model trained on transactional commerce data to predict how users respond to promotions. It estimates promotion response using monotonic curves, with single-token outputs interpreted as probabilities that conversion exceeds a threshold. Its predictions account for session context, such as the day and delivery shift, to guide promotion allocation. In a production A/B test for churn reactivation, it increased conversion by 1% and reduced promotion cost by 6% compared with the Segment-EMA baseline.'}, 'zh': {'title': '让大模型精准分配促销：提升转化，降低成本', 'desc': 'LCM-Promo 是一种用于分配促销优惠的提升模型，基于交易数据微调大型语言模型，以预测用户意图和对促销的反应。它结合会话情境（如日期和配送时段），并从生产日志中学习随优惠力度增加而不下降的单调响应曲线。模型将单个词元的输出解释为用户转化阈值的概率，从而估计不同促销方案的效果。在针对流失用户召回的线上 A/B 测试中，与 Segment-EMA 基线相比，它使转化率提高 1%，并使促销成本降低 6%。'}}}, {'id': 'https://huggingface.co/papers/2611.12870', 'title': 'SWAM: Scaling World Action Models with Cross-Modal Alignment', 'url': 'https://huggingface.co/papers/2611.12870', 'abstract': 'Abstract  World action models jointly predict video and actions conditioned on language. Existing studies focus primarily on architectures and training mechanisms, typically treating language-video alignment acquired through video pretraining as an established foundation. However, introducing action learning may impair this alignment. Principled guidance on data and supervision design for maintaining language-video alignment during action learning remains limited. To investigate this, we curate a pool of approximately 47,000 hours of general videos, egocentric videos, UMI demonstrations, and robot demonstrations. Building on this, we systematically study how language-video supervision, language-video-action supervision, and the joint use of these two forms affect WAM performance. In particular, we examine how language annotation quality affects pretrained language-video capabilities, and how action supervision from UMI and robot demonstrations extends these capabilities to language-video-action modeling. To better scale the model, we further conduct detailed studies on joint training recipe and model architecture. Under a fixed training budget, mixing egocentric videos and UMI demonstrations improves control generalization. Model architecture affects how effectively these experiences are used, while scaling pretraining under the selected configuration brings further gains. The resulting recipe, post-trained on RoboTwin Clean demonstrations only, achieves success rates of 88.10% and 61.56% under Easy (Clean-to-Clean) and Hard (Clean-to-Random) conditions, respectively. Our model achieves 40.00% SR across three real-world tasks, compared with 23.33% for the strongest baseline, indicating better generalization under unseen conditions. We release the curated data, training code, and model weights.', 'score': 2, 'issue_id': 3519, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '7f26b7c783d601ae', 'authors': ['Yu Zhou', 'Xinyuan Xia', 'Xuankun Yang', 'Yinghao Yang', 'Wendi Chen', 'Bowen Liu', 'Jianhan Ma', 'Weicheng Duan', 'Jun Lv', 'Cewu Lu', 'Yanwei Li'], 'affiliations': ['Noematrix Ltd.', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Tongji University', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2611.12870.jpg', 'data': {'categories': ['#transfer_learning', '#open_source', '#dataset', '#robotics', '#training', '#architecture', '#multimodal', '#video', '#data'], 'emoji': '🤖', 'ru': {'title': 'Сохраняем язык и видео при обучении действиям роботов', 'desc': 'Статья исследует World Action Models (WAM), которые совместно предсказывают видео и действия робота по языковому описанию. Авторы показывают, что добавление обучения действиям может ухудшать языко-видео выравнивание, полученное на этапе предобучения, и систематически изучают влияние данных и схем supervision. На корпусе примерно из 47 000 часов видео (общие, egocentric, UMI и демонстрации роботов) установлено, что смешивание egocentric-видео и UMI-демонстраций улучшает обобщение управления при фиксированном бюджете обучения. Итоговый рецепт, дообученный только на чистых демонстрациях RoboTwin, достигает 88,10% и 61,56% успеха в простом и сложном режимах и превосходит сильнейший baseline в реальных задачах (40% против 23,33%).'}, 'en': {'title': 'Teach world models to act without losing sight of language', 'desc': 'This paper studies how to train world action models (WAMs) that predict videos and actions from language without losing the connection between language and video. Using about 47,000 hours of videos and robot demonstrations, the authors compare language-video training, language-video-action training, and a mixture of both, including the effects of annotation quality. They find that mixing egocentric videos with UMI demonstrations improves control generalization, and that the training recipe and model architecture influence how well the model learns from these data. Their resulting model performs better than the strongest baseline on three real-world tasks, especially in unseen conditions.'}, 'zh': {'title': '让语言、视频与动作协同学习，提升机器人泛化能力', 'desc': '本文研究世界动作模型（WAM）如何在学习动作的同时保持语言与视频之间的对齐能力。研究团队整理了约4.7万小时的视频和机器人示范数据，系统比较不同语言、视频与动作监督方式的效果。实验发现，在固定训练预算下混合第一人称视频与UMI示范能提升控制泛化能力，而模型架构和预训练规模也会影响性能。经过后训练的模型在真实世界三项任务中成功率达到40%，高于最强基线的23.33%，显示出更好的未见环境泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2611.09195', 'title': 'InstantHMR : Real-Time Human Mesh Recovery on Your Phone', 'url': 'https://huggingface.co/papers/2611.09195', 'abstract': "Abstract  Real-time 3D human mesh recovery from a single image on mobile devices is a challenging problem with many applications, including robotics, biomechanics, AR/VR, and exergames. Current state-of-the-art models are either too slow to run efficiently on mobile devices or sacrifice accuracy for speed. We present InstantHMR, a family of open-source single-image regressors suited for mobile inference, based on the Momentum Human Rig (MHR) parametric model and trained exclusively on publicly available annotations from the SAM 3D Body dataset. Our approach achieves remarkable performance on a Samsung Galaxy S23 NPU, recovering a 6,890-vertex body mesh in 5.5 ms per person, and 0.98 ms on an NVIDIA RTX 4070 GPU. This speed surpasses all existing methods we evaluated. On mobile, it is 12x faster than the single mobile-compatible method that slightly outperforms ours in accuracy, while achieving competitive accuracy with 40.0 mm PA-MPJPE on 3DPW, 48.8 mm on EMDB and 41.7 mm on RICH. To ensure fair comparisons, we re-evaluate 11 state-of-the-art methods under a unified protocol aligned with the closest MHR-based competitors, including Meta's official MHR-to-SMPL conversion, and report their reproduction results. Additionally, we measure latency across eight different targets, ranging from desktop TensorRT to two phone NPUs. Code and models are available at https://github.com/Naturalpad-studio/InstantHMR.", 'score': 2, 'issue_id': 3518, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'a141ed96fc39b7ec', 'authors': ['Mohamed Adjel', 'Kahina Chalabi', 'Vincent Bonnet'], 'affiliations': ['LAAS-CNRS, Toulouse, France', 'NaturalPad, Montpellier, France'], 'pdf_title_img': 'assets/pdf/title_img/2611.09195.jpg', 'data': {'categories': ['#open_source', '#small_models', '#3d', '#benchmark', '#optimization', '#robotics', '#inference'], 'emoji': '🧍', 'ru': {'title': '3D-человек в смартфоне за миллисекунды', 'desc': 'Статья представляет InstantHMR, семейство открытых моделей для восстановления 3D-меша человеческого тела по одному изображению в реальном времени на мобильных устройствах. Модели построены на параметрической модели Momentum Human Rig (MHR) и обучены только на публичных аннотациях датасета SAM 3D Body. На NPU Samsung Galaxy S23 меш из 6890 вершин строится за 5,5 мс на человека, что значительно быстрее существующих методов при сопоставимой точности (PA-MPJPE 40,0 мм на 3DPW). Авторы также провели честное сравнение 11 современных методов по единому протоколу и измерили латентность на восьми аппаратных платформах.'}, 'en': {'title': 'Fast, Detailed 3D Human Meshes—Right on Your Phone', 'desc': 'InstantHMR is a family of machine learning models that reconstructs a detailed 3D human body mesh from a single image. It uses the Momentum Human Rig model and is trained only on publicly available annotations from the SAM 3D Body dataset. The models run very quickly on mobile devices, producing a mesh with 6,890 vertices in 5.5 milliseconds on a Samsung Galaxy S23 while maintaining competitive accuracy. The paper also compares 11 existing methods using a unified evaluation protocol and reports speed across eight computing platforms.'}, 'zh': {'title': '让单图人体三维重建在手机上又快又准', 'desc': '本文提出 InstantHMR，这是一组面向移动设备、从单张图像回归人体三维网格的模型，采用 Momentum Human Rig（MHR）参数化模型，并仅使用 SAM 3D Body 数据集中的公开标注进行训练。它能在三星 Galaxy S23 的 NPU 上以每人 5.5 毫秒的速度恢复包含 6,890 个顶点的人体网格，在 NVIDIA RTX 4070 GPU 上则只需 0.98 毫秒。该方法在多项测试中速度超过所比较的现有方法，同时在 3DPW、EMDB 和 RICH 数据集上取得有竞争力的准确度；在移动设备上，它比准确度略高的兼容方法快 12 倍。为便于公平比较，作者在统一评测协议下重新评估了 11 种先进方法，并在 8 种硬件平台上测量推理延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.11344', 'title': 'Spatial Harness: Grounding Spatial Reasoning in Executable World States with Physics Engines', 'url': 'https://huggingface.co/papers/2611.11344', 'abstract': "Abstract Spatial Harness improves vision-language models' spatial reasoning by using a Perceiver to construct explicit executable scene states in a physics engine, where a Reasoner simulates viewpoint changes and provides measurements and rendered views to guide answers.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Spatial reasoning requires understanding how objects and observers are arranged in a scene and how their relations change with viewpoint or movement. Vision-language models (VLMs) typically perform both steps through model-internal reasoning, forming an implicit scene interpretation from partial views and imagining the consequences of spatial transformations. A misread scene can lead to a wrong answer, while even a correct interpretation does not ensure that imagined transformations satisfy spatial constraints. We introduce Spatial Harness, which represents scenes as explicit and executable world states to ground spatial reasoning in physics-engine feedback. A Perceiver integrates scene constraints extracted from the question with specialized visual estimates to place objects and cameras in a shared coordinate frame. The resulting state is instantiated in a physics engine, where a Reasoner executes viewpoint changes and uses computed measurements and rendered views to guide reasoning. We evaluate on MindCube, SAT, MMSI-Bench, and SpatialRGPT-Bench with open- and closed-weight VLMs. On MindCube, Spatial Harness improves Qwen3.5-27B from 52.70% to 71.14%, surpassing pySpatial by 7.52 percentage points. Given identical annotated object and camera poses, it reaches 98.25% versus 71.81% for model-internal reasoning. Code is publicly available at: https://github.com/tmlr-group/Spatial-Harness", 'score': 2, 'issue_id': 3518, 'pub_date': '2026-11-08', 'pub_date_card': {'ru': '8 ноября', 'en': 'November 8', 'zh': '11月8日'}, 'hash': '47676d46ef848a09', 'authors': ['Chentao Cao', 'Zhanke Zhou', 'Sangni Duan', 'Bo Han', 'Hang Li'], 'affiliations': ['ByteDance Seed', 'Hong Kong Baptist University'], 'pdf_title_img': 'assets/pdf/title_img/2611.11344.jpg', 'data': {'categories': ['#agents', '#open_source', '#benchmark', '#reasoning', '#cv', '#interpretability', '#multimodal'], 'emoji': '🧭', 'ru': {'title': 'Пространственное мышление, опирающееся на физический движок', 'desc': 'Статья представляет Spatial Harness — подход, который улучшает пространственное рассуждение у vision-language моделей (VLM). Модуль Perceiver извлекает ограничения сцены из вопроса и визуальные оценки, чтобы расставить объекты и камеры в общей системе координат, а затем создает явное состояние мира в физическом движке. Модуль Reasoner имитирует смену точки обзора, получает измерения и отрендеренные изображения и использует их для ответа. На бенчмарке MindCube точность Qwen3.5-27B выросла с 52,70% до 71,14%, что выше pySpatial на 7,52 п.п.'}, 'en': {'title': 'Ground Spatial Reasoning in a Simulatable World', 'desc': 'Spatial Harness helps vision-language models reason about objects and viewpoints by building an explicit 3D scene representation. A Perceiver combines visual estimates and clues from the question to place objects and cameras in a shared coordinate system. A Reasoner then simulates viewpoint changes in a physics engine and uses measurements and rendered images to answer questions. Across several benchmarks, this approach improves performance, showing the value of grounding spatial reasoning in executable scene states.'}, 'zh': {'title': '让空间推理落地：用可执行场景与物理反馈提升视觉语言模型', 'desc': 'Spatial Harness 将场景表示为物理引擎中可执行的显式状态，以辅助视觉语言模型进行空间推理。Perceiver 根据问题约束和视觉估计，把物体与相机放入统一坐标系；Reasoner 则模拟视角变化，并利用计算出的测量结果和渲染图像来推理。在多个基准测试中，该方法提升了模型表现；在 MindCube 上，Qwen3.5-27B 的准确率从 52.70% 提高到 71.14%。若提供相同的标注物体与相机位姿，Spatial Harness 的准确率达到 98.25%，明显高于模型内部推理的 71.81%。'}}}, {'id': 'https://huggingface.co/papers/2611.09987', 'title': 'Stochastic Deep Supervision for Gallery-Consistent Early-Exit Face Recognition', 'url': 'https://huggingface.co/papers/2611.09987', 'abstract': 'Abstract SD-ViT trains Vision Transformers so every block depth yields discriminative face embeddings, enabling early-exit recognition with minimal accuracy loss and no gallery recomputation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Vision Transformers (ViTs) perform strongly in face recognition (FR), yet their fixed-depth inference limits deployment in resource-constrained settings. We propose SD-ViT, a training framework that gives a usable exit at every block depth by making every depth produce discriminative embeddings, for budget-selected fixed-depth exits. Standard ViTs supervise intermediate layers only through backpropagation, so their intermediate representations are not directly optimized to form usable identity embeddings. SD-ViT adds a stochastic auxiliary signal: at each iteration a randomly selected intermediate block is passed through the same embedding head as the final layer and trained with a weighted margin-penalty softmax loss. The objective is thus stochastically sampled deep supervision through a shared classifier. Because both loss terms share that head and classifier, intermediate tokens are trained to map into the same embedding space as final-layer tokens. This matters for FR, where matching is by similarity: a probe processed at an early exit can be compared directly against full-depth gallery embeddings, with no gallery recomputation or adaptation layers. On established benchmarks, SD-ViT stays within 0.4 IJB-C points of the same backbone trained conventionally at full depth, while its early-exit probes recover over 96% of their own full-depth performance at 50% of the computational cost without modifying the reference gallery. A single verification threshold calibrated at full depth remains usable from quarter depth onward.', 'score': 2, 'issue_id': 3518, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '5b082797a2d77b7a', 'authors': ['Guray Ozgur', 'Tahar Chettaoui', 'Eduarda Caldeira', 'Naser Damer', 'Fadi Boutros'], 'affiliations': ['Fraunhofer Institute for Computer Graphics Research IGD', 'TU Darmstadt'], 'pdf_title_img': 'assets/pdf/title_img/2611.09987.jpg', 'data': {'categories': ['#training', '#cv', '#optimization', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Каждый слой ViT узнаёт лица: быстрое распознавание без потери точности', 'desc': 'Статья предлагает SD-ViT — метод обучения Vision Transformer для распознавания лиц, при котором каждый блок сети выдаёт дискриминативные эмбеддинги. На каждой итерации случайно выбранный промежуточный блок подаётся через общую embedding head и обучается с помощью weighted margin-penalty softmax loss, то есть используется stochastic deep supervision. Благодаря общему классификатору промежуточные представления отображаются в то же пространство эмбеддингов, что и финальный слой, поэтому ранний выход можно сравнивать с полноразмерной галереей без её пересчёта. Эксперименты показывают, что ранние выходы сохраняют более 96% качества при половине вычислений, а порог верификации, калиброванный на полной глубине, работает уже с четверти глубины.'}, 'en': {'title': 'Exit Earlier, Recognize Faces with Nearly the Same Accuracy', 'desc': 'SD-ViT trains a Vision Transformer to produce useful face-recognition embeddings at every block depth. During training, it randomly selects an intermediate block and applies the same embedding head and classifier used by the final layer, with a weighted margin-penalty softmax loss. This shared supervision lets early-exit embeddings be compared directly with full-depth gallery embeddings, without recomputing or adapting the gallery. On benchmarks, early exits retain over 96% of full-depth performance at half the computational cost, while full-depth accuracy remains nearly unchanged.'}, 'zh': {'title': '让 ViT 每一层都能识别人脸', 'desc': 'SD-ViT 是一种训练视觉 Transformer（ViT）进行人脸识别的方法，让每个网络深度都能生成有辨识力的人脸嵌入。训练时，它随机选取一个中间层，并通过与最终层共享的嵌入头和分类器，用加权边际惩罚 softmax 损失监督该层。这样，提前退出得到的嵌入可以直接与完整深度生成的图库嵌入进行相似度比较，无须重新计算或调整图库。在基准测试中，计算量减半时，提前退出仍能达到自身完整深度表现的 96% 以上，且准确率与常规训练的完整模型接近。'}}}, {'id': 'https://huggingface.co/papers/2611.08969', 'title': 'PhysioWave-T: Token-Efficient Wavelet Foundation Models for Biosignals', 'url': 'https://huggingface.co/papers/2611.08969', 'abstract': 'Abstract  We present PhysioWave-T, a token-efficient wavelet foundation model family for EEG, ECG, and sEMG. Dynamic scale folding recombines J+1 wavelet subbands prior to tokenization, compressing sequence length from (J+1)CS to CS tokens for J levels, C channels, and S temporal patches. Route-specific front ends and learned channel-name embeddings allow one Transformer per modality to handle diverse montages and sampling rates, while unseen setups reuse the backbone via lightweight adapters. We pre-train a 30M-parameter EEG model on over 15M windows (19--128 channels), alongside ECG (30M) and sEMG (12M) encoders. Across four EEG routes, scale folding cuts Transformer latency by 4.0--7.2x and peak memory by 6.8--12.7x over scale expansion without accuracy loss. Our EEG encoder leads 8 of 9 metrics against BENDR, BIOT, LaBraM, and EEGPT, and surpasses LUNA-L on wearable seizure detection with fewer parameters. Reliability-aware latent fusion (RALF) further integrates summary tokens from independently pre-trained encoders via sample-adaptive weights. On SeizeIT2, RALF raises event sensitivity at 11 false alarms/h from 61.4% to 74.4% and window AUPRC from 0.321 to 0.399 over the best unimodal baseline, outperforming weighted-logit and concatenation fusion across all variants. PhysioWave-T also achieves state-of-the-art sEMG accuracies and top macro-F1 on PTB-XL Super and Chapman-Shaoxing. Code and models: https://github.com/ForeverBlue816/PhysioWave.', 'score': 2, 'issue_id': 3518, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': '43fccbb843500550', 'authors': ['Yanlong Chen', 'Simone Benatti', 'Luca Benini', 'Cuntai Guan', 'Yawei Li'], 'affiliations': ['University of Bologna', 'University of Bologna, Department of Information Engineering', 'University of Bologna, Italy', 'University of Bologna, Italy, Department of Electrical, Electronic and Information Engineering', 'University of Bologna, Italy, Department of Information Engineering'], 'pdf_title_img': 'assets/pdf/title_img/2611.08969.jpg', 'data': {'categories': ['#open_source', '#healthcare', '#benchmark', '#architecture', '#optimization', '#training', '#inference', '#synthetic', '#audio'], 'emoji': '🧠', 'ru': {'title': 'Сжимаем вейвлеты — ускоряем анализ сигналов тела без потери точности', 'desc': 'В статье представлена PhysioWave-T — семейство Transformer-моделей на основе вейвлетов для ЭЭГ, ЭКГ и сЭМГ, которое сжимает последовательность токенов за счёт объединения вейвлет-поддиапазонов (dynamic scale folding). Модель предобучается на более чем 15 миллионах окон ЭЭГ и адаптируется к разным схемам отведений через channel-name embeddings и лёгкие адаптеры. Метод RALF объединяет summary-токены независимых энкодеров с адаптивными весами, что повышает чувствительность к эпилептическим приступам на SeizeIT2. Модель достигает state-of-the-art результатов на сЭМГ и PTB-XL, ускоряя инференс в 4–7 раз без потери точности.'}, 'en': {'title': 'Wavelet Transformers: Less Computation, Stronger Biosignal Models', 'desc': 'PhysioWave-T is a family of Transformer foundation models for EEG, ECG, and sEMG signals. Its wavelet scale-folding method combines frequency-scale information before tokenization, reducing computation and memory without lowering accuracy. The models use modality-specific input layers and channel embeddings, and lightweight adapters help them work with new sensor setups. A reliability-aware fusion method combines predictions from separate encoders, improving seizure detection and achieving strong results on several EEG, ECG, and sEMG benchmarks.'}, 'zh': {'title': '折叠小波尺度，高效融合多模态生理信号', 'desc': '这篇论文提出 PhysioWave-T，一组面向脑电（EEG）、心电（ECG）和表面肌电（sEMG）的高效小波基础模型。它通过动态尺度折叠，在输入 Transformer 前合并小波子带，减少序列长度，因此显著降低推理延迟和显存占用，同时不损失准确率；模型还用模态专属前端和通道名称嵌入来适应不同采集设置。预训练的 EEG 模型在多数评测指标上超过多个现有方法，ECG 与 sEMG 模型也取得了有竞争力的结果。论文还提出可靠性感知潜在融合（RALF），根据样本自适应地组合不同编码器的表示，在癫痫发作检测等任务上优于单模态基线及其他融合方法。'}}}, {'id': 'https://huggingface.co/papers/2611.11994', 'title': 'EmoHarness: Boosting Multimodal Emotion Understanding with Meta-Harness Evolving', 'url': 'https://huggingface.co/papers/2611.11994', 'abstract': "Abstract  Small multimodal models can misjudge emotion when words, voice, and visual cues conflict. We present EmoHarness, which runs such a model, the frozen student, inside a harness: the prompts, settings, and verification code around its calls. A human-written starting harness, the scaffold, numbers the student's visual observations, transcript, and prosody descriptions as citable evidence and has the student weigh candidate emotions against it. In Meta-Harness Evolving (MHE), a stronger LLM, the Builder, reads the student's errors and execution traces offline and edits the harness; static checks and validation gates decide which edits are kept, and the Builder never sees evaluation items. On 5,507 MME-Emotion items, EmoHarness raises task-macro Recognition by 7.6-13.4 points over a single video-only call for all four students and both Builders. Transcripts and prosody descriptions supply most of this boost (+5.38 to +10.71); the scaffold changes the audio-augmented call by -0.79 to +2.54, partly through extra multi-label predictions, and evolved edits add at most +0.95, although no evolved increment survives Holm correction. The harness's emotion context also transfers to IntentQA, with small gains for three of four students, none of which survives correction. EmoHarness thus boosts small multimodal students chiefly by supplying and organizing audio-derived evidence.", 'score': 1, 'issue_id': 3520, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': 'f7abd0bd023d13d9', 'authors': ['Fenghai Li', 'Bingxuan Li', 'Jiawen Zhang', 'Yifan Shen', 'Jiateng Liu', 'Yutong Zhang', 'Yue Guo'], 'affiliations': ['Stanford University', 'University of California, Davis', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2611.11994.jpg', 'data': {'categories': ['#audio', '#multimodal', '#small_models', '#benchmark', '#optimization', '#agents', '#interpretability'], 'emoji': '🎭', 'ru': {'title': 'Аудио-доказательства важнее: организуем контекст, а не переобучаем модель', 'desc': 'В статье представлен EmoHarness, метод, который улучшает распознавание эмоций у небольших мультимодальных моделей без их переобучения. Замороженная модель-ученик работает внутри «обвязки» (harness): промптов, настроек и кода проверки, а стартовый шаблон нумерует визуальные наблюдения, транскрипт и описания просодии как цитируемые доказательства. Дополнительно более сильный LLM-строитель (Builder) офлайн анализирует ошибки и трассировки и редактирует harness в рамках Meta-Harness Evolving, при этом валидационные шлюзы отсекают неудачные правки, а Builder не видит тестовые примеры. Эксперименты на 5 507 примерах MME-Emotion показывают прирост макро-метрики Recognition на 7,6–13,4 пункта, причём основной вклад дают транскрипты и описания просодии, тогда как эволюционные правки дают лишь небольшой, статистически не подтверждённый вклад.'}, 'en': {'title': 'Give Small Models Better Evidence, Not Just Bigger Prompts', 'desc': 'EmoHarness improves emotion recognition by wrapping a frozen small multimodal model in prompts, settings, and verification code. Its scaffold organizes visual observations, transcript text, and prosody descriptions as evidence for comparing candidate emotions. A stronger LLM can revise the harness offline using model errors and execution traces, while validation checks filter its edits and it never sees evaluation examples. Most gains come from adding transcript and prosody evidence; scaffold and evolved-harness gains are small or statistically insignificant after correction.'}, 'zh': {'title': '组织好音频证据，让小模型更懂情绪', 'desc': '小型多模态模型在文字、语音和画面线索互相矛盾时，容易误判情绪。EmoHarness 将冻结的学生模型放入一个包含提示词、运行设置和验证代码的“框架”中，并把视觉观察、转录文本和韵律描述整理成可引用的证据，让模型据此比较候选情绪。元框架演化（MHE）让更强的构建模型离线分析学生模型的错误与执行轨迹并修改框架，再通过静态检查和验证门槛筛选修改；构建模型不会接触评测样本。在 5,507 个 MME-Emotion 样本上，性能提升主要来自转录文本和韵律描述提供的音频证据，框架演化带来的额外提升较小且未通过多重比较校正。'}}}, {'id': 'https://huggingface.co/papers/2611.09501', 'title': 'e-means: outperforming k-means (in one-tenth the epochs)', 'url': 'https://huggingface.co/papers/2611.09501', 'abstract': "Abstract  Lloyd's k-means algorithm is a long-running standard for clustering, with applications in data analysis, retrieval, quantization and data curation. In this paper, we introduce an exponential moving average optimization procedure for k-means with mini-batch updates, powered by modern deep learning machinery and new insights. We also establish scaling laws on how decay rate and batch size impact final performance. This gives us a formulaic rule to fix them for multiple problem sizes and embedding datasets, without the need for any hyperparameter sweep. The resulting clustering algorithm, coined e-means, is much faster than Lloyd k-means and converges to lower losses, frequently even beating k-means++. On a wide array of embeddings datasets, it beats the loss of Lloyd k-means at 25 epochs in 1.4 to 2.6 epochs, which translates to 10-45x GPU wall-clock speedups compared to state-of-the-art k-means implementations. As an example, e-means partitions DINO10B, a dataset of 10 billion DINO embeddings, into 16 million clusters in only 2.5 epochs, reaching a loss below Lloyd's at 25 epochs.", 'score': 1, 'issue_id': 3520, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'b134053ba44b91ba', 'authors': ['Swann Bessa', 'Pierre-Emmanuel Mazaré', 'Gergely Szilvasy', 'Hugo Touvron', 'David Picard', 'Matthijs Douze', 'Hervé Jégou'], 'affiliations': ['FAIR at Meta', 'École Nationale des Ponts et Chaussées'], 'pdf_title_img': 'assets/pdf/title_img/2611.09501.jpg', 'data': {'categories': ['#training', '#data', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'E-means: быстрая кластеризация миллиардов эмбеддингов без перебора гиперпараметров', 'desc': 'В статье представлен алгоритм e-means — новая версия кластеризации k-means с мини-батчами, в которой используется экспоненциальное скользящее среднее (EMA) для обновления центроидов. Авторы получили эмпирические законы масштабирования, показывающие, как скорость затухания и размер батча влияют на качество, что позволяет подбирать эти параметры без перебора гиперпараметров. Метод сходится быстрее классического алгоритма Ллойда и часто даёт меньший лосс, чем k-means++. На больших датасетах эмбеддингов (например, 10 миллиардов DINO-эмбеддингов) e-means ускоряет вычисления в 10–45 раз на GPU по сравнению с современными реализациями k-means.'}, 'en': {'title': 'Faster, Better Clustering—Without Hyperparameter Sweeps', 'desc': 'The paper introduces e-means, a faster way to cluster data using mini-batches and exponential moving averages. It derives scaling rules for choosing the decay rate and batch size based on problem size and dataset, without tuning them through repeated experiments. Across many embedding datasets, e-means reaches lower clustering loss than Lloyd’s k-means in far fewer epochs, and often also outperforms k-means++. On GPUs, it achieves 10–45× speedups, including clustering 10 billion DINO embeddings into 16 million groups in just 2.5 epochs.'}, 'zh': {'title': '用指数移动平均，让 k-means 更快更准', 'desc': '本文提出 e-means，一种用小批量更新和指数移动平均优化 k-means 的聚类算法。研究还揭示了衰减率和批量大小如何影响最终效果，并据此给出可直接采用的设置规则，无需反复搜索超参数。实验表明，e-means 比 Lloyd k-means 更快、损失更低，且在多种嵌入数据集上常优于 k-means++。在 DINO10B 这一包含 100 亿个嵌入的数据集上，它仅用 2.5 轮迭代就将数据分成 1600 万个簇，达到优于 Lloyd 算法运行 25 轮的损失。'}}}, {'id': 'https://huggingface.co/papers/2611.12875', 'title': 'Click3R: Interactive Stereo 3D Reconstruction with Sparse Correspondence Clicks', 'url': 'https://huggingface.co/papers/2611.12875', 'abstract': 'Abstract A framework for interactive geometric correction enables sparse human correspondence clicks to improve feed-forward 3D reconstruction by injecting constraints through a lightweight adapter.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Despite impressive progress, existing feed-forward large 3D reconstruction models produce a single, irrevocable prediction. When these models fail, there is no mechanism to correct their mistakes. To address this limitation, we introduce Click3R, a framework for interactive geometric correction of feed-forward models using sparse human correspondence clicks. Given an image pair and a small set of cross-view point correspondences provided by a user, Click3R injects geometric constraints into the 3D reconstruction networks through a lightweight point correspondence adapter, enabling the model to resolve ambiguities in challenging scenarios such as repetitive textures, symmetric structures, large viewpoint changes, or textureless regions. To evaluate interactive reconstruction, we curate a challenging benchmark specifically designed to expose failure modes of existing feed-forward 3D reconstruction methods. Experiments show that Click3R reduces reconstruction error with as few as a single correspondence click, improving performance on both standard and our curated benchmarks. Our results highlight that sparse human interaction provides an effective and practical mechanism for correcting geometric reconstruction errors.', 'score': 1, 'issue_id': 3519, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '9c9a6450036dacee', 'authors': ['Hao Gu', 'Jin Yao', 'Zezhou Cheng'], 'affiliations': ['University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2611.12875.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#architecture', '#cv', '#3d'], 'emoji': '🖱️', 'ru': {'title': 'Один клик человека исправляет ошибки 3D-реконструкции', 'desc': 'Существующие feed-forward модели для 3D-реконструкции выдают один необратимый результат и не могут исправить свои ошибки. Авторы представляют Click3R, фреймворк для интерактивной геометрической коррекции, где пользователь указывает несколько точечных соответствий между двумя видами изображения. Эти геометрические ограничения внедряются в сеть через лёгкий адаптер, что помогает модели разрешать неоднозначности в сложных сценах, например с повторяющимися текстурами или симметричными структурами. Эксперименты показывают, что даже один такой клик снижает ошибку реконструкции, а также подготовлен новый сложный бенчмарк для выявления слабых мест таких моделей.'}, 'en': {'title': 'One Click Can Correct a 3D Reconstruction', 'desc': 'Click3R lets users improve a feed-forward 3D reconstruction model by clicking matching points in two images. A lightweight point correspondence adapter adds these matches as geometric constraints, helping the model resolve ambiguities such as repeated patterns or large viewpoint changes. The authors introduce a challenging benchmark and find that even one correspondence click can reduce reconstruction error. This shows that sparse human feedback can effectively correct errors in 3D reconstruction.'}, 'zh': {'title': '轻轻一点，为三维重建纠错', 'desc': '现有的前馈式三维重建模型通常只给出一次预测，出错后难以修正。Click3R让用户在两张图像中点选少量对应点，并通过轻量级的点对应适配器，将这些几何约束传入重建网络。即使面对重复纹理、对称结构、视角变化大或缺少纹理等困难情况，少至一次点击也能帮助模型减少重建误差。研究还构建了专门的困难基准，并通过实验验证了这种稀疏人工交互在修正几何错误方面的效果。'}}}, {'id': 'https://huggingface.co/papers/2501.08686', 'title': 'Knowledge Graph-based Retrieval-Augmented Generation for Schema Matching', 'url': 'https://huggingface.co/papers/2501.08686', 'abstract': 'Abstract A knowledge graph-based retrieval-augmented generation method improves schema matching by retrieving relevant subgraphs and reducing large language model hallucinations without retraining.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Traditional similarity-based schema matching methods fail to resolve semantic ambiguities and conflicts in complex, domain-specific mappings due to a lack of commonsense and domain-specific knowledge. In parallel, large language models (LLMs) without sufficient background knowledge tend to hallucinate, further complicating schema matching. To overcome these limitations, we introduce KG-RAG4SM, a Knowledge Graph-based Retrieval-Augmented Generation for Schema Matching. This method integrates novel retrieval mechanisms, including LLM-based, vector-based, graph traversal-based, and hybrid techniques with advanced reranking schemes to extract the most relevant subgraphs from large external KGs. Our approach achieves superior results without requiring re-training, as evidenced by improvements of 39.79% in precision and 30.56% in F1 score over LLM-based state-of-the-art (SOTA) methods (e.g., Jellyfish-8B) on the MIMIC dataset, and enhancements of 69.20% in precision and 21.99% in F1 score over pre-trained language model (PLM)-based SOTA methods (e.g., SMAT) on the Synthea dataset. Additionally, KG-RAG4SM scales effectively across KGs from commonsense KGs to domain-specific ones, while its instruction-tuning knowledge exclusion component ensures truthful performance in end-to-end schema matching tasks despite the suboptimal relevance of KG context. Our empirical analysis and case studies from real-world scenarios show that the hallucination problem in LLMs for schema matching is well mitigated by our solution.', 'score': 1, 'issue_id': 3519, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': 'f42e200afcc4ab16', 'authors': ['Chuangtao Ma', 'Sriom Chakrabarti', 'Arijit Khan', 'Bálint Molnár'], 'affiliations': ['Aalborg University, Denmark', 'Bowling Green State University, USA', 'Eötvös Loránd University, Hungary'], 'pdf_title_img': 'assets/pdf/title_img/2501.08686.jpg', 'data': {'categories': ['#benchmark', '#graphs', '#hallucinations', '#data', '#rag'], 'emoji': '🧩', 'ru': {'title': 'Граф знаний помогает LLM точно сопоставлять схемы данных без переобучения', 'desc': 'Авторы представляют KG-RAG4SM — метод схемного сопоставления (schema matching) на основе Retrieval-Augmented Generation с использованием графа знаний (Knowledge Graph). Метод извлекает релевантные подграфы из больших внешних KG с помощью LLM-based, векторного, обходного по графу и гибридного поиска с продвинутым реранкингом. Подход не требует дообучения и значительно превосходит SOTA-методы на базе LLM и PLM по precision и F1 на наборах данных MIMIC и Synthea. Компонент исключения знаний при instruction-tuning помогает снижать галлюцинации LLM при сквозном сопоставлении схем.'}, 'en': {'title': 'Ground Schema Matching in Knowledge, Not Guesswork', 'desc': 'KG-RAG4SM improves schema matching by giving a large language model relevant knowledge from external knowledge graphs. It uses language-model, vector, graph-traversal, and hybrid retrieval methods, with reranking, to find useful subgraphs. This retrieval-augmented generation approach improves precision and F1 scores on medical datasets without retraining the model. A knowledge-exclusion component helps the model avoid hallucinations when retrieved information is not relevant.'}, 'zh': {'title': '借助知识图谱检索，让模式匹配更准确、少幻觉', 'desc': '本文提出 KG-RAG4SM，用知识图谱检索增强生成来改进模式匹配。它结合大语言模型、向量检索和图遍历等方法，从外部知识图谱中找出相关子图，并通过重排序筛选信息。该方法无需重新训练模型，在多个数据集上的准确率和 F1 分数都优于现有方法，也能减轻大语言模型产生幻觉的问题。即使检索到的知识与任务不够相关，它也能利用知识排除机制，提升端到端模式匹配的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2512.23818', 'title': 'Energy-Tweedie: Score meets Score, Energy meets Energy', 'url': 'https://huggingface.co/papers/2512.23818', 'abstract': "Abstract A generalized identity links denoising posteriors under Gibbs noise to Stein scores via kernel scoring rules, enabling score estimation, noise-parameter estimation, and diffusion-style sampling.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Denoising and score estimation are classically linked through Tweedie's formula, which relates the posterior mean under Gaussian noise to the Stein score of the noisy marginal. In this work, we extend this perspective beyond Gaussian noise to a broad class of Gibbs (energy-based) noise distributions, with the generalized Gaussian family as an example. We derive the Energy-Tweedie identity: when the denoising posterior is viewed through the lens of scoring rules, the path derivative of a kernel scoring rule defined by the noise potential recovers the Stein score of the noisy marginal. Thus, the familiar correspondence between Gaussian noise, posterior means, squared loss, and Tweedie's formula is lifted to a distributional correspondence between Gibbs noise distributions, full posterior laws, kernel scoring rules, and the Energy-Tweedie identity, which gives a Tweedie-style relation for each noise potential. Among its consequences, this identity gives a posterior-samples-to-score route to score estimation, yields a principled criterion for estimating unknown noise parameters, and enables diffusion-style sampling along user-chosen paths through the noise-parameter space, supplying the score-based perspective on recent generative methods trained with scoring rules.", 'score': 1, 'issue_id': 3519, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': '80ac81a185d6206d', 'authors': ['Andrej Leban'], 'affiliations': ['University of Michigan, Ann Arbor, MI, United States'], 'pdf_title_img': 'assets/pdf/title_img/2512.23818.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#training', '#math'], 'emoji': '🧭', 'ru': {'title': 'От шума к score: обобщение формулы Твиди на любой энергетический шум', 'desc': 'Статья обобщает формулу Твиди, связывающую апостериорное среднее при шуме с оценкой Стейна, на широкий класс шумов Гиббса (энергетических распределений), например обобщённое гауссово семейство. Авторы вводят Energy-Tweedie identity: производная по пути ядерного правила оценки (kernel scoring rule), заданного потенциалом шума, восстанавливает score зашумлённого маргинального распределения. Это даёт способ оценивать score по апостериорным выборкам, а также принципиальный критерий для оценки неизвестных параметров шума. Кроме того, тождество позволяет строить диффузионно-подобное сэмплирование вдоль выбранных путей в пространстве параметров шума.'}, 'en': {'title': 'Beyond Gaussian Noise: Linking Denoising Posteriors to Scores', 'desc': 'This paper extends Tweedie’s formula beyond Gaussian noise to a broad class of Gibbs noise distributions. It introduces the Energy-Tweedie identity, which connects denoising posterior distributions to the Stein score of the noisy data distribution through kernel scoring rules based on the noise potential. The identity enables score estimation from posterior samples and provides a principled way to estimate unknown noise parameters. It also supports diffusion-style sampling along chosen paths through the noise-parameter space.'}, 'zh': {'title': '从 Gibbs 噪声后验到 score：推广 Tweedie 公式', 'desc': '论文将经典的 Tweedie 公式从高斯噪声推广到更广泛的 Gibbs 噪声分布。作者提出 Energy-Tweedie 恒等式：利用由噪声能量函数定义的核评分规则，可以从去噪后验恢复含噪边缘分布的 Stein score。该恒等式支持从后验样本估计 score，也能为未知噪声参数提供有理论依据的估计准则。它还可用于沿噪声参数空间中的指定路径进行类似扩散模型的采样。'}}}, {'id': 'https://huggingface.co/papers/2611.10987', 'title': 'Horizon-Scalable Q-Learning', 'url': 'https://huggingface.co/papers/2611.10987', 'abstract': 'Abstract Horizon-Scalable Q-Learning automatically balances one-step and multi-step returns by extending targets only when the critic values a dataset action at least as highly as the best-of-N actions from a behavior-cloning policy, improving long-horizon off
