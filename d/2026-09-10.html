    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.10522', 'title': 'Show-Harness: Just a VLM Agent Can Play Robots', 'url': 'https://huggingface.co/papers/2609.10522', 'abstract': 'Abstract Show-Harness links vision-language models to robot control via discrete semantic actions interpreted by embodiment-specific modules, enabling zero-shot and efficient fine-tuned deployment across robots and GUIs.  Generated by thinkingmachines/Inkling-Small Foundation vision-language models (VLMs) exhibit broad intelligence about the world, yet translating this intelligence into robot control remains challenging. We present Show-Harness, an Embodied Harness that enables VLMs to "play" robots through a compact semantic interface linking intent to action. Show-Harness exposes discrete semantic action units that VLMs can naturally reason over, while embodiment-specific interpreters deterministically ground them into local robot actions, keeping the VLM directly responsible for fine-grained physical decisions. Through the same interface, Show-Harness demonstrates the feasibility of (1) directly unlocking closed-source frontier VLMs for zero-shot robot control, and (2) adapting small-scale open-source VLMs for low-cost deployment with just a few GPU-hours of fine-tuning. We further develop GUMI (GUI Manipulation Interface), which extends the same semantic action space to GUI-based demonstration collection, allowing humans and agents to "play" robots across embodiments without specialized teleoperation hardware. Extensive experiments show that Show-Harness-equipped VLM agents generalize robustly across tasks, embodiments, and environments, outperforming representative agentic and VLA paradigms. These results suggest that the right interface can unlock substantial embodied capability from foundation VLMs, without requiring additional model capacity or costly embodiment-specific pretraining.', 'score': 77, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '76e9a3cd29ea70d9', 'authors': ['Yanzhe Chen', 'Zechen Bai', 'Zhijun Cao', 'Wenzheng Zeng', 'Kevin Qinghong Lin', 'Yiqi Lin', 'Guoqiang Liang', 'Kevin Yuchen Ma', 'Qiming Huang', 'Mike Zheng Shou'], 'affiliations': ['Show Lab, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.10522.jpg', 'data': {'categories': ['#small_models', '#training', '#robotics', '#multimodal', '#agents', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Семантический мост между языком и действием робота', 'desc': 'Show-Harness представляет собой систему, которая соединяет видеоязыковые модели с управлением роботами через дискретные семантические действия, интерпретируемые специализированными модулями для каждого типа робота. Система позволяет использовать закрытые и открытые VLM для управления роботами как в режиме нулевого обучения, так и с эффективной дообучением на небольшом объёме данных. Авторы разработали GUMI — интерфейс для манипуляции GUI, который расширяет семантическое пространство действий на сбор демонстраций и позволяет управлять роботами без специализированного оборудования телеоперации. Экспериментальные результаты демонстрируют, что правильный семантический интерфейс позволяет раскрыть возможности фундаментальных моделей для воплощённых агентов без дополнительного обучения или специфичного для каждого робота преобучения.'}, 'en': {'title': 'Empowering Robots with Vision-Language Models through Show-Harness', 'desc': 'The paper introduces Show-Harness, a system that connects vision-language models (VLMs) to robot control using discrete semantic actions. This system allows VLMs to effectively translate their understanding of the world into actionable commands for robots, facilitating both zero-shot and fine-tuned deployments. Show-Harness includes embodiment-specific modules that interpret these actions, ensuring that VLMs can make precise physical decisions. Additionally, it extends to GUI manipulation, enabling seamless interaction with robots across different platforms without the need for specialized hardware.'}, 'zh': {'title': 'Show-Harness：解锁机器人控制的新方式', 'desc': 'Show-Harness 是一种将视觉-语言模型与机器人控制连接起来的工具，通过特定的语义动作模块实现。这种方法使得视觉-语言模型能够在没有额外训练的情况下，直接控制机器人并进行高效的微调。Show-Harness 提供了一种紧凑的语义接口，将意图与动作相连接，使得模型能够自然地推理出离散的语义动作单元。通过这种接口，Show-Harness 证明了在不同任务和环境中，视觉-语言模型能够有效地进行机器人控制，展现出强大的通用性和适应性。'}}}, {'id': 'https://huggingface.co/papers/2609.10540', 'title': 'Programmable World Model', 'url': 'https://huggingface.co/papers/2609.10540', 'abstract': 'Abstract A programmable world model separates explicit state evolution from video generation using executable rules and 3D bounding boxes to maintain persistent, controllable environments.  Generated by thinkingmachines/Inkling-Small Recent video world models generate increasingly realistic and interactive visual experiences, yet lack reliable mechanisms for maintaining persistent world state and enforcing programmable rules over extended interactions. We introduce Programmable World Model, a framework that decouples world-state evolution from visual observation generation. An agent translates natural-language instructions into executable programs that specify entity states and state-transition rules, enabling direct control over individual entities and their interactions. A lightweight engine executes these programs to update and maintain an explicit, persistent global world state, including off-screen entities and non-visual attributes. To connect world state with visual generation, we introduce state-augmented 3D oriented bounding boxes (OBBs) as an intermediate representation. This representation, together with the target camera trajectory, is deterministically compiled into pixel-aligned spatiotemporal conditioning signals for a pretrained video model serving as the generative renderer. This design allows users to create playable games with predefined mechanics, direct control over individual entities, and persistent world state throughout gameplay. We further introduce CombatStateBench, a benchmark for evaluating programmable world models. On CombatStateBench, our method achieves 94% Count Accuracy and 98% State Accuracy, substantially outperforming existing interactive video world models while supporting coherent long-horizon generation. These results demonstrate the effectiveness of separating explicit state evolution from generative rendering for building persistent, programmable worlds.', 'score': 53, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'b62a5e3e53d09a8e', 'authors': ['Zheng-Hui Huang', 'Guixu Lin', 'Jiacheng Lin', 'Yi-Chuan Huang', 'Ruihan Yu', 'Muyao Niu', 'Siqi Yang', 'Yu-Lun Liu', 'Yung-Yu Chuang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.10540.jpg', 'data': {'categories': ['#video', '#games', '#multimodal', '#3d', '#long_context', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Разделение логики мира и визуальной генерации для управляемых виртуальных окружений', 'desc': 'В статье предлагается Programmable World Model — фреймворк, который разделяет эволюцию состояния мира от генерации видео. Агент преобразует естественный язык в исполняемые программы, которые управляют состоянием объектов и правилами их взаимодействия, сохраняя при этом стабильное глобальное состояние, включая сущности за пределами экрана. Для связи между состоянием и визуальной генерацией используются 3D ориентированные bounding boxes как промежуточное представление, которые детерминированно преобразуются в сигналы для предварительно обученной модели видео-генерации. Метод достигает 94% точности при подсчёте объектов и 98% точности состояния на новом бенчмарке CombatStateBench, обеспечивая генерацию на долгих горизонтах с полным контролем над каждой сущностью.'}, 'en': {'title': 'Building Interactive Worlds with Programmable State Control', 'desc': 'The paper presents a Programmable World Model that enhances video generation by separating the evolution of the world state from the visual output. It allows agents to interpret natural language commands into executable programs that manage the states and interactions of entities within a persistent environment. By using state-augmented 3D oriented bounding boxes, the model connects the world state to visual generation, enabling coherent and interactive gameplay. The proposed framework outperforms existing models in maintaining a consistent world state and supports long-term interactions, as demonstrated by the CombatStateBench benchmark results.'}, 'zh': {'title': '构建可编程的持久世界', 'desc': '可编程世界模型通过可执行规则和3D边界框，将明确的状态演变与视频生成分离，从而维护持久且可控的环境。该框架允许代理将自然语言指令转化为可执行程序，指定实体状态和状态转移规则，实现对个体实体及其交互的直接控制。轻量级引擎执行这些程序，以更新和维护明确的全球世界状态，包括屏幕外实体和非视觉属性。通过引入状态增强的3D定向边界框，连接世界状态与视觉生成，从而实现用户创建具有预定义机制的可玩游戏。'}}}, {'id': 'https://huggingface.co/papers/2609.08572', 'title': 'AgentGrad: Intervention-guided Prompt Optimization for Multi Agent Systems', 'url': 'https://huggingface.co/papers/2609.08572', 'abstract': "Abstract AgentGrad improves multi-agent prompt optimization by identifying target agents through sequential intervention and clustering gradients semantically to avoid mixing unrelated errors.  Generated by thinkingmachines/Inkling-Small Large language model (LLM)-based multi-agent systems (MAS) achieve strong performance by employing specialized multiple agents, yet their performance depends on the prompt design of each agent. For MAS prompt optimization, textual gradient methods that guide prompt updates using natural-language feedback have emerged as a leading paradigm. In this paper, we identify limitations in two stages of existing textual gradient approaches: gradient extraction and gradient aggregation. In gradient extraction, previous works select a target prompt without verifying whether modifying it resolves the failure, and derive gradients without agent-level supervision over the corresponding agent's intermediate output. In gradient aggregation, individual gradients are randomly grouped and concatenated, often mixing unrelated failure modes and producing prompts that fail to generalize. To address these limitations, we propose AgentGrad, a prompt optimization framework for multi-agent systems based on sequential intervention and semantic textual gradient abstraction. For each failure, sequential intervention modifies the behavior of one agent at a time to identify the target agent whose modification resolves the failure. The modified output of the target agent then serves as agent-level supervision for extracting a fine-grained gradient. Semantic textual gradient abstraction clusters semantically similar gradients to prevent mixing unrelated failure modes, and abstracts each cluster into a generalized gradient that captures the shared corrective pattern. Experimental results show that AgentGrad achieves state-of-the-art performance across five MAS benchmarks and reduces wall-clock optimization time by 2.5times on average compared to the next-fastest baseline.", 'score': 49, 'issue_id': 3251, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'd1bff36947aa5453', 'authors': ['Jaewon Chu', 'Jinwoo Seo', 'Jaewon Cho', 'Jeehye Na', 'Yunyang Xiong', 'Youngdae Kim', 'Hyunwoo J. Kim'], 'affiliations': ['KAIST', 'Korea University', 'Meta AI', 'UNIST'], 'pdf_title_img': 'assets/pdf/title_img/2609.08572.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Умное разделение ошибок для оптимизации многоагентных систем', 'desc': 'AgentGrad — это фреймворк оптимизации промптов для многоагентных систем на основе LLM, который решает проблемы существующих методов текстовых градиентов. Основное улучшение заключается в использовании последовательного вмешательства для точной идентификации целевого агента, чьё изменение устраняет ошибку, и получения градиента с агент-уровневым контролем. Семантическая кластеризация градиентов предотвращает смешивание несвязанных режимов отказа путём группировки похожих по смыслу градиентов и абстрагирования каждого кластера в обобщённый градиент. Экспериментальные результаты демонстрируют, что AgentGrad достигает лучших результатов на пяти бенчмарках и сокращает время оптимизации в 2.5 раза по сравнению с другими методами.'}, 'en': {'title': 'Optimizing Multi-Agent Prompts with Precision and Speed', 'desc': 'AgentGrad is a new framework designed to improve how multi-agent systems optimize their prompts. It does this by focusing on one agent at a time to identify which changes actually fix problems, rather than guessing. Additionally, it groups similar errors together to create clearer guidance for updates, avoiding confusion from unrelated issues. As a result, AgentGrad not only enhances performance but also speeds up the optimization process significantly.'}, 'zh': {'title': 'AgentGrad：智能体优化的新突破', 'desc': 'AgentGrad是一种改进多智能体提示优化的方法，通过顺序干预和语义聚类梯度来识别目标智能体，避免混合无关的错误。该方法解决了现有文本梯度方法在梯度提取和聚合阶段的局限性，确保每次修改都能有效识别出导致失败的智能体。通过对相似梯度进行聚类，AgentGrad能够提取出更精细的梯度，避免了无关失败模式的混合。实验结果表明，AgentGrad在五个多智能体系统基准测试中达到了最先进的性能，并且优化时间平均减少了2.5倍。'}}}, {'id': 'https://huggingface.co/papers/2609.05405', 'title': 'WearableQA: A Benchmark for Health Reasoning over Real-World Wearable Data', 'url': 'https://huggingface.co/papers/2609.05405', 'abstract': "Abstract WearableQA is a benchmark of multiple-choice questions derived from real longitudinal wearable data that evaluates large language model reasoning across data and health dimensions.  Generated by thinkingmachines/Inkling-Small Recent advances in wearable sensing enable continuous monitoring of physiological and behavioral signals, yet existing benchmarks rarely evaluate whether AI systems can reason over a real user's longitudinal wearable record. We introduce WearableQA, a benchmark comprising 4,084 10-option multiple-choice questions constructed from the wearable time series, blood biomarkers, and demographics of 200 real users, each with up to 500 days of daily measurements. WearableQA preserves authentic wearable distributions that include device noise and inter-individual variability. To evaluate distinct reasoning capabilities, we introduce 16 question types organized along two complementary axes: data versus health reasoning, which distinguishes computation over longitudinal measurements from physiological interpretation; and single- versus cross-signal reasoning, which separates reasoning about individual signals from the integration of multiple signals. To construct reliable questions at scale, we adopt a dual-grounding framework that combines literature-grounded physiological findings with statistically validated population-grounded physiological patterns. This enables the capture of meaningful relationships observed in real-world wearable data. Evaluation of 14 proprietary and open-source LLMs demonstrates that WearableQA effectively differentiates model capabilities, with performance ranging from 19.6% to 72.9% against a 10% chance baseline. Moreover, WearableQA remains far from solved: most models achieve accuracies below 60%. Overall, WearableQA provides a realistic and diagnostic benchmark for evaluating LLM reasoning over real-world wearable data.", 'score': 28, 'issue_id': 3250, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': 'e9bcf655d82a2d0e', 'authors': ['Ji Soo Lee', 'Xilun Chen', 'Pierce Chuang', 'Ashish Shenoy', 'Jason Wei', 'Dohwan Ko', 'Hyunwoo J. Kim', 'Benoit Corda'], 'affiliations': ['KAIST', 'Korea University', 'Meta'], 'pdf_title_img': 'assets/pdf/title_img/2609.05405.jpg', 'data': {'categories': ['#healthcare', '#reasoning', '#benchmark', '#science', '#multimodal'], 'emoji': '⌚', 'ru': {'title': 'Оценка рассуждения языковых моделей над реальными данными носимых датчиков', 'desc': 'WearableQA — это бенчмарк для оценки способности больших языковых моделей рассуждать над реальными данными от носимых датчиков. Бенчмарк состоит из 4084 вопросов с множественным выбором, построенных на основе продольных данных 200 реальных пользователей, собранных за период до 500 дней. Вопросы организованы по двум осям: различие между вычислениями над данными и интерпретацией физиологических процессов, а также различие между анализом отдельных сигналов и интеграцией нескольких сигналов. Исследование показало, что LLM значительно отличаются по способности решать эту задачу, с точностью от 19,6% до 72,9%, что указывает на сложность и актуальность проблемы.'}, 'en': {'title': 'Evaluating AI Reasoning with Real Wearable Data', 'desc': 'WearableQA is a new benchmark designed to test how well large language models (LLMs) can reason using real data from wearable devices. It includes over 4,000 multiple-choice questions based on actual health and behavioral data from 200 users, collected over nearly 500 days. The benchmark assesses different reasoning skills, such as understanding individual health signals versus integrating multiple signals, and distinguishes between data analysis and health interpretation. Results show that while some models perform better than others, most still struggle, indicating that this area of AI reasoning is not yet fully developed.'}, 'zh': {'title': 'WearableQA：评估可穿戴数据推理能力的新基准', 'desc': 'WearableQA是一个基准测试，旨在评估大型语言模型在真实可穿戴数据上的推理能力。它包含4084个多项选择题，基于200名用户的可穿戴时间序列、血液生物标志物和人口统计数据。该基准测试通过16种问题类型，考察数据与健康推理的不同能力，帮助理解个体信号与多信号整合的推理。评估结果显示，WearableQA有效区分了不同模型的能力，但大多数模型的准确率仍低于60%。'}}}, {'id': 'https://huggingface.co/papers/2609.08149', 'title': 'SWE-Bench Pro Verified: A Reliable Benchmark for Software Engineering Agents', 'url': 'https://huggingface.co/papers/2609.08149', 'abstract': "Abstract  SWE-Bench Pro has emerged as a standard benchmark for evaluating software engineering agents on challenging repository-level tasks. However, our analysis work show that its evaluation is undermined by two sources of unreliability: reward hacking, enabled by leakage of gold solutions or hidden evaluation information, and task quality issues, including misleading problem statements and improperly scoped tests. These issues can inflate benchmark performance and obscure agents' true coding ability. We present SWE-Bench Pro Verified, a verified version of SWE-Bench Pro that addresses both problems. Our approach combines anti-hacking safeguards that eliminate major leakage channels without disrupting normal agent functionality, with task refinement that minimally corrects inconsistencies within flawed instances. Evaluations on SWE-Bench Pro Verified reveal that some models perform substantially worse than previously reported, suggesting that existing results on SWE-Bench Pro may overestimate real software engineering capability. SWE-Bench Pro Verified offers a more trustworthy benchmark for assessing software engineering agents.", 'score': 18, 'issue_id': 3251, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '5d4cbe11ab09bc4f', 'authors': ['Pujun Zheng', 'Zixin Shang', 'Shufan Jiang', 'Wenhui Tian', 'Dongsheng Zhu', 'Zerun Ma', 'Dingbo Yuan', 'Qi Zhang'], 'affiliations': ['East China Normal University', 'Fudan University', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2609.08149.jpg', 'data': {'categories': ['#science', '#plp', '#leakage', '#agents', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Честная оценка способностей агентов в разработке кода через защиту от манипуляций', 'desc': 'В работе выявлены проблемы надёжности бенчмарка SWE-Bench Pro, который используется для оценки агентов, решающих задачи разработки программного обеспечения на уровне репозиториев. Основные источники неточностей — утечка решений и информации при оценке, а также некачественные задачи с неясными описаниями и неправильно определённым объёмом тестирования. Авторы предложили улучшенную версию SWE-Bench Pro Verified, которая применяет защиту от манипуляций результатами и корректирует несоответствия в задачах. Переоценка моделей на новом бенчмарке показала, что их фактические способности в решении задач программирования значительно ниже, чем демонстрировали предыдущие результаты.'}, 'en': {'title': 'Enhancing Benchmark Integrity for Software Engineering Agents', 'desc': "The paper discusses the limitations of the SWE-Bench Pro benchmark for evaluating software engineering agents, highlighting issues like reward hacking and task quality problems. Reward hacking occurs when agents exploit leaked solutions or hidden information, leading to inflated performance metrics. Additionally, the paper points out that misleading problem statements and poorly defined tests can further distort the evaluation of agents' coding abilities. To address these issues, the authors introduce SWE-Bench Pro Verified, which implements safeguards against hacking and refines task quality, resulting in a more reliable assessment of software engineering capabilities."}, 'zh': {'title': '提供更可靠的软件工程代理评估基准', 'desc': 'SWE-Bench Pro 是一个用于评估软件工程代理的标准基准，但我们的分析发现其评估存在不可靠的两个来源：奖励黑客行为和任务质量问题。奖励黑客行为是由于金标准解决方案或隐藏评估信息的泄露，而任务质量问题则包括误导性的问题陈述和不当范围的测试。这些问题可能会夸大基准性能，掩盖代理的真实编码能力。我们提出了 SWE-Bench Pro Verified，通过消除主要泄露渠道和最小化修正不一致性，提供了一个更可靠的评估软件工程代理的基准。'}}}, {'id': 'https://huggingface.co/papers/2609.09113', 'title': 'SAEScientist-Bench: Can AI Agents Conduct Autonomous SAE Interpretability Research?', 'url': 'https://huggingface.co/papers/2609.09113', 'abstract': 'Abstract The study introduces a benchmark to evaluate AI agents using sparse autoencoders for autonomous mechanistic interpretability and feature discovery, revealing progress but significant gaps versus expert baselines.  Generated by thinkingmachines/Inkling-Small While research on recursive self-improvement (RSI) has predominantly automated model training pipelines, reliable autonomous development demands a missing pillar: post-hoc monitoring and auditing to understand what models learn and ensure safe alignment. Mechanistic interpretability tools are essential to bridge this gap, among which Sparse Autoencoders (SAEs) serve as a cornerstone by isolating interpretable features for model inspection and steering. In this paper, we introduce SAEScientist-Bench to evaluate whether AI agents can act as scientists utilizing SAE tools for autonomous mechanistic discovery. Given a target concept, an agent designs contrastive probes and navigates a Gemma Scope dictionary of 131K+ features in Gemma-2-9B-IT to discover the optimal feature, evaluated against curated expert reference features anchored on Neuronpedia across activation rank, concept selectivity on contrastive texts, and causal steering. Across 10 agent configurations and 20 tasks, frontier agents demonstrate genuine discovery capabilities and lead different evaluation dimensions, but remain well behind the expert baseline, approaching expert levels on separating target concepts from contrastive controls while lagging substantially in causal generation steering. Further analysis reveals that although agents can design contrasts to rule out spurious candidates, they frequently misinterpret experimental measurements. These results establish experimental model understanding as a measurable capability for closed-loop autonomous AI R&D. Our code is available at https://github.com/Trae1ounG/SAEScientist.', 'score': 16, 'issue_id': 3250, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '62abe71e999086be', 'authors': ['Yuqiao Tan', 'Shizhu He', 'Jun Zhao', 'Kang Liu'], 'affiliations': ['School of Artificial Intelligence, University of Chinese Academy of Sciences', 'The Key Laboratory of Cognitive Intelligence, Institute of Automation, CAS'], 'pdf_title_img': 'assets/pdf/title_img/2609.09113.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset', '#open_source', '#alignment', '#interpretability'], 'emoji': '🔬', 'ru': {'title': 'Научный AI: автономное раскрытие механистики нейросетей через редкие автокодировщики', 'desc': 'В статье представлен бенчмарк SAEScientist-Bench для оценки способности AI агентов действовать как учёные, используя Sparse Autoencoders (редкие автокодировщики) для автономного открытия механистических свойств нейронных сетей. Агенты должны разрабатывать контрастные пробы и искать оптимальные признаки в словаре из 131K+ характеристик модели Gemma-2-9B-IT, оцениваемые по рангу активации, селективности концепции и причинному управлению. Исследование показывает, что современные AI агенты демонстрируют настоящие способности к открытию, но значительно отстают от экспертных базовых линий, особенно в задачах причинного генерирования. Работа устанавливает экспериментальное понимание моделей как измеримую способность для замкнутого цикла автономных AI исследований и разработок.'}, 'en': {'title': 'Bridging the Gap: AI Agents in Mechanistic Discovery with Sparse Autoencoders', 'desc': 'This paper presents a new benchmark called SAEScientist-Bench to assess AI agents using Sparse Autoencoders (SAEs) for mechanistic interpretability and feature discovery. The study highlights the importance of post-hoc monitoring to ensure that AI models learn safely and effectively. While the AI agents show some ability to discover features and design experiments, they still fall short compared to human experts in understanding and interpreting results. The findings suggest that while AI can assist in research and development, it requires further improvement to reach expert-level performance in causal generation and feature interpretation.'}, 'zh': {'title': '自主机制可解释性的AI代理评估基准', 'desc': '本研究提出了一个基准，用于评估使用稀疏自编码器的人工智能代理在自主机制可解释性和特征发现方面的表现。尽管代理在某些任务上展示了真实的发现能力，但与专家基准相比仍存在显著差距。稀疏自编码器作为机制可解释性工具的基础，帮助代理识别可解释特征以进行模型检查和引导。研究结果表明，尽管代理能够设计对比实验以排除虚假候选者，但在实验测量的解读上常常出现误差。'}}}, {'id': 'https://huggingface.co/papers/2609.09219', 'title': 'Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol for Auditing AI Research Agents', 'url': 'https://huggingface.co/papers/2609.09219', 'abstract': 'Abstract The Discovery Certification Protocol validates AI research agent outcomes through executable recovery tests, controlled audits, and deterministic verification with finite-sample recovery bounds.  Generated by thinkingmachines/Inkling-Small AI research agents combine prior knowledge, public sources, and experimental feedback to produce useful results. The Discovery Certification Protocol (DCP) turns claims about these results into executable recovery and feedback tests. Gate 1 validates useful improvement on sealed evaluation. Gate 2 gives matched agents the registered starting information and observed Web content while withholding the target research history. Every valid method reaching the numerical target supplies a recovery witness and triggers the Core veto. DCP Core requires adequate controls, zero observed recoveries, and a finite-sample bound on recovery in one fresh registered episode. Optional Gate 3 measures the average effect of truthful feedback relative to a specified neutral policy from a shared checkpoint. DCP Evidence adds this effect after independent null calibration and a registered effect margin. Two controlled audits exercise the complete protocol in SQLite optimization and virtual catalyst control under different models. Each produced zero recoveries in 96 episodes, with an upper bound of 0.0468. Each paired study yielded 30 truthful recoveries and zero neutral recoveries, with passing 60-pair null studies. Additional cases exercise Core, recovered, and audit-incomplete decisions. A deterministic, LLM-free verifier reproduces the decisions from frozen evidence. DCP provides a common evidence language for useful outcomes, alternative routes, and feedback effects across AI research.', 'score': 15, 'issue_id': 3250, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '08a3843f241a4ce4', 'authors': ['Jingjie Ning', 'Shanshan Zhong', 'Xiaochuan Li', 'Ji Zeng'], 'affiliations': ['School of Computer Science, Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2609.09219.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '✅', 'ru': {'title': 'Сертификация открытий через верифицируемые тесты восстановления', 'desc': 'В статье предложен Discovery Certification Protocol (DCP) — система валидации результатов AI research-агентов через выполняемые тесты восстановления, контролируемые аудиты и детерминированную верификацию. Протокол преобразует утверждения о результатах исследований в проверяемые тесты с конечной выборочной гарантией на восстановление результатов. Система использует многоступенчатый процесс: валидация улучшений на закрытом наборе данных, тестирование агентов с контролируемой информацией и измерение эффекта честной обратной связи. Экспериментальная проверка на задачах оптимизации SQL и контроля виртуальных катализаторов показала нулевые восстановления при верхней границе вероятности 0.0468.'}, 'en': {'title': 'Validating AI Outcomes with the Discovery Certification Protocol', 'desc': 'The Discovery Certification Protocol (DCP) is a framework designed to validate the outcomes of AI research agents through rigorous testing and verification methods. It employs executable recovery tests and controlled audits to ensure that the results produced by these agents are reliable and can be reproduced. The protocol includes multiple gates that assess the validity of improvements and the effectiveness of feedback mechanisms, ensuring that claims made by the agents are substantiated. By establishing a common evidence language, DCP facilitates the comparison of outcomes and enhances the credibility of AI research findings.'}, 'zh': {'title': '发现认证协议：确保AI研究结果的可靠性', 'desc': '发现认证协议（DCP）通过可执行的恢复测试、受控审计和有限样本恢复界限的确定性验证来验证人工智能研究代理的结果。该协议将关于结果的声明转化为可执行的恢复和反馈测试，确保研究的有效性。DCP的核心要求有足够的控制、零观察恢复，并在一个新的注册事件中对恢复进行有限样本界限的约束。通过对不同模型下的SQLite优化和虚拟催化控制进行的两次受控审计，验证了协议的有效性，确保了结果的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2609.00369', 'title': 'Puppeteer: Object-Grounded Posture-Aware Co-Speech Gesture Generation', 'url': 'https://huggingface.co/papers/2609.00369', 'abstract': 'Abstract Puppeteer is a diffusion-based co-speech gesture model that uses causal latent tokens and object geometry to generate temporally coherent, physically grounded gestures.  Generated by thinkingmachines/Inkling-Small Generating co-speech gestures that are temporally coherent, semantically aligned with speech, and grounded with surrounding objects remains challenging. Prior speech-driven gesture models emphasize audio-gesture alignment but do not explicitly account for posture constraints or surrounding objects, failing to capture the inherent correlation between body gestures and the physical space. We present Puppeteer, a posture-aware, object-grounded co-speech gesture diffusion model operating in a causal latent space. We decompose long gestures into structured primitives and learn a causal variational autoencoder that encodes them into temporally ordered latent tokens, each depending only on the past. We then perform conditional diffusion directly in the causal latent space, conditioning on speech signals, motion history, an initial posture reference, and object geometry to synthesize physically consistent gestures. This temporally ordered latent formulation enables explicit temporal control and supports tasks such as gesture in-betweening and gesture completion. To better assess co-speech gesture synthesis beyond existing measures, we introduce new evaluation metrics tailored to this task. We also created SceneGes, the first curated synthetic 3D dataset of embodied co-speech gestures and corresponding 3D objects, enabling object-grounded gesture generation. Experiments show that Puppeteer generates more diverse and temporally synchronized gestures than prior methods, while enabling object-grounded gesture synthesis.', 'score': 15, 'issue_id': 3250, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'eb781f48afb69bb4', 'authors': ['Vida Adeli', 'Soroush Mehraban', 'Jacob Rommann', 'Harrison Sanborn', 'Cole Clifford', 'Babak Taati'], 'affiliations': ['Pickford AI', 'University of Toronto', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2609.00369.jpg', 'data': {'categories': ['#synthetic', '#benchmark', '#3d', '#dataset', '#architecture', '#video', '#diffusion', '#multimodal'], 'emoji': '🎭', 'ru': {'title': 'Жесты в речи, управляемые окружающей средой', 'desc': 'Puppeteer — это модель диффузии для синтеза жестов в речи, которая использует причинные латентные токены и геометрию объектов для создания временно согласованных и физически обоснованных жестов. Модель разлагает длинные жесты на структурированные примитивы и обучает причинный вариационный автокодировщик, кодирующий их в упорядоченные во времени латентные токены. Синтез выполняется методом условной диффузии в причинном латентном пространстве, обусловленной речевыми сигналами, историей движений, начальной позой и геометрией окружающих объектов. Авторы представили новые метрики оценки и создали первый кураторский синтетический 3D датасет SceneGes с жестами и соответствующими объектами для обучения.'}, 'en': {'title': 'Puppeteer: Grounded Gestures for Speech with Causal Latent Modeling', 'desc': 'Puppeteer is a novel model designed to generate co-speech gestures that are both temporally coherent and physically grounded in their environment. It utilizes a causal latent space to encode gestures into structured primitives, allowing for better alignment with speech and surrounding objects. By incorporating posture constraints and object geometry, Puppeteer enhances the realism and diversity of generated gestures. Additionally, it introduces new evaluation metrics and a synthetic dataset, SceneGes, to improve the assessment of gesture synthesis performance.'}, 'zh': {'title': 'Puppeteer：生成物体基础的共语手势', 'desc': 'Puppeteer是一种基于扩散的共语手势模型，利用因果潜在标记和物体几何生成时间一致、物理基础的手势。该模型解决了生成与语音语义一致且与周围物体相关的手势的挑战。Puppeteer通过将长手势分解为结构化原语，并学习因果变分自编码器，将其编码为时间有序的潜在标记，从而实现手势的生成。实验表明，Puppeteer生成的手势比以往方法更具多样性和时间同步性，同时支持基于物体的手势合成。'}}}, {'id': 'https://huggingface.co/papers/2609.09155', 'title': 'SyncWorld: Visual Calibration Enables World Models as Zero-Shot Simulators', 'url': 'https://huggingface.co/papers/2609.09155', 'abstract': 'Abstract SyncWorld is an action-conditioned world model that uses visual calibration episodes to learn environment-specific action-to-visual mappings, enabling zero-shot simulation and test-time policy improvement across unseen robotic settings.  Generated by thinkingmachines/Inkling-Small World models are increasingly used as policy-in-the-loop imagination environments, where reliable rollouts require fine-grained controllability with respect to low-level robot actions. A key obstacle to scaling such models in robotics is that actions are not a universal language in pixel space: changes in visual environment, camera view, robot placement, or embodiment alter how the same numerical action manifests visually, leading to conflicting supervision under mixed training and brittle generalization at deployment. We introduce SyncWorld, an action-conditioned world model that serves as a zero-shot simulator across unseen environments without any additional training. SyncWorld leverages a visual calibration episode---paired frames and actions that showcase all the controllable degrees of freedom---to specify the setup-specific Action--Visual Mapping in context. Training with visual calibration contexts teaches the model to interpret actions through visual evidence and to leverage interaction history when explicit calibration is unavailable. Experiments show that SyncWorld can accurately simulate action outcomes in previously unseen settings, and that its capability of simulating rollouts enables test-time policy improvement without training.', 'score': 11, 'issue_id': 3250, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '95a0aa4e999c43fc', 'authors': ['Yuncong Yang', 'Zhengtao Han', 'Furkan Ozyurt', 'Zeyuan Yang', 'Han Yang', 'Junyi Cao', 'Haoyu Zhen', 'Yilun Du', 'Chuang Gan'], 'affiliations': ['Harvard', 'NYU', 'UC Berkeley', 'UMass Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2609.09155.jpg', 'data': {'categories': ['#cv', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Универсальная модель мира для робототехники через визуальную калибровку', 'desc': 'SyncWorld — это модель мира, обусловленная действиями робота, которая использует визуальные калибровочные эпизоды для обучения отображению действий в визуальный домен, специфичному для каждой среды. Ключевая проблема масштабирования таких моделей в робототехнике заключается в том, что одни и те же численные действия производят разные визуальные эффекты в зависимости от конфигурации среды, положения камеры и типа робота. Модель обучается на основе визуальных контекстов калибровки, которые демонстрируют все управляемые степени свободы, позволяя интерпретировать действия через визуальные доказательства. Экспериментальные результаты показывают, что SyncWorld может точно симулировать результаты действий в ранее невиданных условиях и улучшать политику управления во время тестирования без переобучения.'}, 'en': {'title': 'Zero-Shot Simulation for Robotic Adaptability', 'desc': 'SyncWorld is a novel action-conditioned world model designed to enhance robotic simulations by learning specific action-to-visual mappings for different environments. It utilizes visual calibration episodes to understand how actions translate into visual changes, allowing it to operate effectively in new settings without needing additional training. This model addresses the challenge of inconsistent action representations caused by variations in the environment, camera angles, or robot configurations. By enabling zero-shot simulation and improving policies at test time, SyncWorld demonstrates significant advancements in the reliability and adaptability of robotic systems.'}, 'zh': {'title': 'SyncWorld：无缝适应新环境的智能模拟器', 'desc': 'SyncWorld是一种基于动作的世界模型，通过视觉校准集来学习特定环境的动作与视觉之间的映射，从而实现零-shot模拟和测试时策略改进。该模型解决了机器人领域中动作在像素空间中不是通用语言的问题，使得在不同视觉环境下的动作表现一致。SyncWorld利用视觉校准集来指定特定设置的动作-视觉映射，帮助模型通过视觉证据理解动作。实验表明，SyncWorld能够在未见过的环境中准确模拟动作结果，并在测试时实现策略改进，而无需额外训练。'}}}, {'id': 'https://huggingface.co/papers/2609.06703', 'title': 'DianShi-RxnDB: A Large-Scale, Fine-Grained Organic Reaction Data Platform Built via a Fully Automated Pipeline for Researchers and AI Agents', 'url': 'https://huggingface.co/papers/2609.06703', 'abstract': 'Abstract DianShi-RxnDB is an automated platform that extracts and normalizes millions of structured organic reactions from patents to support AI-driven chemistry research.  Generated by thinkingmachines/Inkling-Small High-quality structured organic reaction data are essential for developing artificial intelligence for chemistry (AI4Chem), yet much of this knowledge remains dispersed across patent text, images, and reaction schemes. We present DianShi-RxnDB, a large-scale, fine-grained organic reaction data platform built via a fully automated extraction and normalization pipeline integrating patent text, images, and reaction schemes. Its corpus covers organic synthesis patents from the USPTO and EPO published between 1976 and 2025, yielding approximately 24 million reaction instances, of which approximately 14.8 million (61.7%) pass automated qualification checks. Each instance represents a specific single-step experiment recording participants, roles, quantities, temperatures, reaction times, yields, experimental procedures, and provenance links to source patents. In a manual evaluation of 1,300 sampled qualified instances, the micro-averaged field-level accuracy was 92.95%. A matched comparison with Pistachio further indicated advantages in deduplicated record counts, representation granularity, and field-level exact agreement. The platform provides a Web research workbench for searching, filtering, comparing, and source-verifying records, and a Model Context Protocol (MCP) service offering AI agents composable structured retrieval tools. DianShi-RxnDB is available at https://dianshi.opendatalab.org.cn/ .', 'score': 9, 'issue_id': 3250, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': '1f6b299951eb7310', 'authors': ['Yubin Wang', 'Xingjian Wei', 'Jiang Wu', 'Yinfan Wang', 'Boyu Zhu', 'Lin Zhang', 'Jianing Yu', 'Huazheng Zeng', 'Ruiyi Ding', 'Junyuan Gao', 'Jiaxing Sun', 'Lingli Ge', 'Haote Yang', 'Jingchao Wang', 'Aijia Guo', 'Qian Jiang', 'Yurui Zhao', 'Wenjian Zhang', 'Chen Zhu', 'Lijun Wu', 'Xiaolei Yang', 'Haodong Chen', 'Junjie Yuan', 'Zichao Ye', 'Shaowei Hou', 'Jing Ye', 'Jia Yu', 'Shan Wang', 'Lijun Wu', 'Jiantao Qiu', 'Chao Xu', 'Yuqiang Li', 'Guangyu Wang', 'Bowen Zhou', 'Dahua Lin', 'Conghui He'], 'affiliations': ['East China Normal University', 'East China University of Science and Technology', 'Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06703.jpg', 'data': {'categories': [], 'emoji': '⚗️', 'ru': {'title': 'Структурированная химическая память: миллионы реакций для искусственного интеллекта', 'desc': 'DianShi-RxnDB — это автоматизированная платформа для извлечения и нормализации миллионов структурированных органических реакций из патентов, которые служат ценным источником данных для обучения моделей AI4Chem. Система использует полностью автоматизированный конвейер обработки, объединяющий текст патентов, изображения и схемы реакций, извлекая информацию о реагентах, условиях синтеза, выходах и процедурах. Корпус содержит примерно 24 миллиона реакций из патентов USPTO и EPO (1976–2025 годы), из которых около 14,8 миллиона прошли автоматическую проверку качества с точностью 92,95%. Платформа предоставляет веб-интерфейс для поиска и анализа данных, а также MCP-сервис для интеграции с AI-агентами.'}, 'en': {'title': 'Unlocking Chemistry with Automated Reaction Data', 'desc': 'DianShi-RxnDB is an innovative platform designed to automate the extraction and normalization of organic reaction data from patents, facilitating AI research in chemistry. It compiles a vast dataset of approximately 24 million reaction instances, with a significant portion passing quality checks, ensuring high reliability for AI applications. The platform integrates various data sources, including text and images from patents, to provide detailed information on chemical reactions, such as reactants, conditions, and yields. Additionally, it offers a user-friendly web interface for researchers to access, filter, and analyze this structured data effectively.'}, 'zh': {'title': 'DianShi-RxnDB：化学研究的智能数据平台', 'desc': 'DianShi-RxnDB是一个自动化平台，旨在从专利中提取和规范化数百万个结构化有机反应，以支持基于人工智能的化学研究。该平台通过完全自动化的提取和规范化流程，整合了专利文本、图像和反应方案，构建了一个大规模的有机反应数据平台。它涵盖了1976年至2025年间发布的美国专利商标局和欧洲专利局的有机合成专利，提供约2400万个反应实例，其中约1480万个（61.7%）通过了自动化资格检查。DianShi-RxnDB还提供了一个Web研究工作台，方便用户搜索、过滤、比较和验证记录。'}}}, {'id': 'https://huggingface.co/papers/2609.07103', 'title': 'Revisiting Complete Reasoning Traces for Post-Training', 'url': 'https://huggingface.co/papers/2609.07103', 'abstract': 'Abstract Large language models gain reasoning improvements from truncated trajectory endpoints rather than full reasoning traces, reducing redundancy while benefiting supervised fine-tuning and reinforcement learning.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are often post-trained on pre-collected reasoning trajectories to improve their reasoning capability. Such trajectories tend to be long due to complex, interwoven paths, which often include detours on the path toward the answer. However, it has been underexplored whether LLMs indeed benefit from learning complete trajectories in post-training, such as supervised fine-tuning (SFT). Starting from our pilot study, we find that full trajectories provide only limited benefit, while partial trajectories are effective even under heavy truncation. We analyze redundancy in reasoning trajectories through attention-based analyses and controlled token-removal studies, both of which show that intermediate tokens contribute minimally to final reasoning quality. This suggests that avoiding redundant information may allow LLMs to internally infer coherent alternatives by inferring missing steps from their internal knowledge, given known trajectory endpoints. Furthermore, we show that training LLMs using endpoints leads to consistent changes in reasoning behavior, and that it also benefits post-training methods based on reinforcement learning or on-policy distillation, highlighting the need to revisit complete reasoning traces. Code is available at https://github.com/naver-ai/revisiting-trace.', 'score': 8, 'issue_id': 3249, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '04734da95a89af2d', 'authors': ['Jaehui Hwang', 'Sangdoo Yun', 'Byeongho Heo', 'Dongyoon Han'], 'affiliations': ['NAVER AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.07103.jpg', 'data': {'categories': ['#training', '#rlhf'], 'emoji': '✂️', 'ru': {'title': 'Краткие концовки лучше полных путей: как избежать избыточности при обучении рассуждениям', 'desc': 'В этой работе исследуется, как большие языковые модели учатся на траекториях рассуждений при постобучении. Авторы показали, что полные траектории менее эффективны, чем усечённые траектории, заканчивающиеся ответом, так как промежуточные токены содержат много избыточной информации. Анализ внимания и контролируемое удаление токенов подтвердили, что LLM могут восстанавливать пропущенные шаги из своих внутренних знаний. Такой подход улучшает как supervised fine-tuning, так и методы обучения с подкреплением, предполагая необходимость пересмотра стандартного использования полных траекторий.'}, 'en': {'title': 'Optimize Reasoning: Focus on Endpoints, Not Full Paths!', 'desc': 'This paper explores how large language models (LLMs) can improve their reasoning abilities by focusing on truncated trajectory endpoints instead of complete reasoning paths. The authors find that using partial trajectories, even when heavily truncated, is more effective than relying on full reasoning traces, which often contain redundant information. Through various analyses, they demonstrate that intermediate reasoning steps contribute little to the final outcome, suggesting that LLMs can infer missing information from their existing knowledge. The study highlights the importance of optimizing training methods, particularly in supervised fine-tuning and reinforcement learning, by emphasizing endpoint training over complete trajectories.'}, 'zh': {'title': '优化推理：截断轨迹端点的优势', 'desc': '这篇论文探讨了大型语言模型（LLMs）在推理能力提升方面的研究。研究发现，与完整的推理轨迹相比，截断的轨迹端点能够减少冗余信息，同时在监督微调和强化学习中仍然有效。通过分析推理轨迹中的冗余性，研究表明中间的推理步骤对最终结果的贡献有限。最终，使用轨迹端点进行训练可以显著改变推理行为，并对后续的训练方法产生积极影响。'}}}, {'id': 'https://huggingface.co/papers/2609.10226', 'title': 'Φ-Bench: Can Large Language Models Engineer the Infrastructure That Powers Them?', 'url': 'https://huggingface.co/papers/2609.10226', 'abstract': 'Abstract Φ-Bench evaluates large language models on open-ended engineering of the LLM infrastructure stack across tasks from kernel optimization to end-to-end system design.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) have demonstrated remarkable capabilities in reasoning and code generation, raising the prospect that they could assist in developing and optimizing the very infrastructure that powers them. However, existing benchmarks mainly focus on isolated kernels, predefined operators, or pre-specified optimization targets, and therefore fail to evaluate the ability of LLMs to perform open-ended, long-horizon LLM infrastructure engineering. To address this gap, we present Φ-Bench, a benchmark for systematically evaluating LLMs on engineering the LLM infrastructure stack. Derived from optimization problems studied in frontier research and grounded in real-world code repositories, Φ-Bench provides broad coverage of the LLM infrastructure stack and spans tasks of varying complexity, ranging from localized kernel-level function completion to long-horizon implementation and end-to-end system optimization. Extensive experiments on frontier LLMs reveal their current capabilities and limitations in engineering complex LLM infrastructure, offering insights into the challenges that remain on the path toward autonomous optimization of future AI infrastructure.', 'score': 7, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '0f4bbd40c29371c3', 'authors': ['Leilei Ding', 'Shumin Wang', 'Yuting Huang', 'Fanqi Wan', 'Yinmin Zhang', 'Qi Han', 'Yiming Xu', 'Feiyuan Zhang', 'Xiaomeng Chu', 'Guoliang You', 'Wuyang Zhang', 'Daxin Jiang', 'Yanyong Zhang'], 'affiliations': ['Peking University', 'StepFun', 'The Hong Kong University of Science and Technology', 'University of Pennsylvania', 'University of Science and Technology of China', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.10226.jpg', 'data': {'categories': ['#dataset', '#science', '#reasoning', '#plp', '#optimization', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'Языковые модели как инженеры собственной инфраструктуры', 'desc': 'Φ-Bench — это бенчмарк для оценки способностей больших языковых моделей в инженерии инфраструктуры LLM, от оптимизации ядер до проектирования полноценных систем. В отличие от существующих наборов задач, которые сосредоточены на изолированных компонентах, Φ-Bench оценивает открытые, долгосрочные задачи оптимизации реальной инфраструктуры LLM. Бенчмарк основан на фронтальных исследованиях и включает задачи различной сложности, от заполнения функций на уровне ядра до реализации и оптимизации всей системы. Эксперименты показывают текущие возможности и ограничения современных LLM в автономной оптимизации инфраструктуры искусственного интеллекта.'}, 'en': {'title': 'Empowering LLMs to Engineer Their Own Infrastructure', 'desc': 'Φ-Bench is a new benchmark designed to evaluate large language models (LLMs) on their ability to engineer and optimize their own infrastructure. Unlike previous benchmarks that focus on specific tasks or predefined goals, Φ-Bench assesses LLMs on a wide range of open-ended engineering challenges, from kernel optimization to complete system design. This benchmark is based on real-world code and complex optimization problems, providing a comprehensive evaluation of LLM capabilities. The results from testing various LLMs highlight their strengths and weaknesses in handling intricate infrastructure tasks, shedding light on the future of autonomous AI optimization.'}, 'zh': {'title': '评估大型语言模型的基础设施工程能力', 'desc': 'Φ-Bench是一个用于评估大型语言模型（LLM）在开放式工程任务中的能力的基准测试。它涵盖了从内核优化到端到端系统设计的多种任务，旨在填补现有基准测试的空白。通过对前沿研究中的优化问题进行分析，Φ-Bench能够系统地评估LLM在工程基础设施堆栈中的表现。实验结果揭示了当前LLM在复杂基础设施工程中的能力和局限性，为未来AI基础设施的自主优化提供了重要见解。'}}}, {'id': 'https://huggingface.co/papers/2609.06806', 'title': 'Train Smarter, Not Harder: Switching Signal-Guided Training in Active Learning', 'url': 'https://huggingface.co/papers/2609.06806', 'abstract': "Abstract HybridAL adaptively switches from retraining to fine-tuning during active learning based on online stabilization signals, reducing training time while preserving accuracy and improving calibration.  Generated by thinkingmachines/Inkling-Small Training strategy, namely whether to retrain from scratch or fine-tune from the previous checkpoint, is an overlooked decision variable in active learning. We show that this choice has exploitable structure: retraining is most useful in early rounds, when each batch can substantially reshape the labeled distribution, while fine-tuning becomes safer once the model trajectory stabilizes. We propose HybridAL, an adaptive training schedule that monitors an online stabilization signal and switches from retraining to fine-tuning after sustained stabilization. Two complementary signals, spectral exponent change Δα (weight-based) and accuracy change ΔAcc (validation-based), span different points on the time-calibration trade-off. Across three encoder backbones and six text-classification tasks (five seeds each), HybridAL keeps endpoint macro-F1 non-inferior to retraining and fine-tuning at a 0.010 margin, saves up to 49% of retraining time, and recovers a substantial fraction of retraining's calibration advantage as measured by negative log-likelihood (NLL). Compared with schedules that switch at a pre-committed round, HybridAL obtains lower NLL at moderate additional cost, showing that trajectory-dependent switching provides a stronger time-calibration trade-off than fixed early switching.", 'score': 7, 'issue_id': 3251, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': '935b35fb076150eb', 'authors': ['Nagham Omar', 'Maya Rozenshtein', 'Evgeny Mishlyakov', 'Avigdor Gal'], 'affiliations': ['Faculty of Data and Decision Sciences, Technion'], 'pdf_title_img': 'assets/pdf/title_img/2609.06806.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Адаптивное переключение между переобучением и дообучением в активном обучении', 'desc': 'В статье предложен метод HybridAL, который адаптивно переключается между переобучением модели с нуля и дообучением на предыдущей контрольной точке во время активного обучения. Метод использует онлайн-сигналы стабилизации (изменение спектрального показателя весов и точности на валидационном наборе) для определения момента переключения между двумя стратегиями обучения. Экспериментальные результаты на задачах классификации текстов показывают, что HybridAL сохраняет качество моделей наравне с базовыми подходами, экономит до 49% времени обучения и улучшает калибровку предсказаний. Адаптивное переключение, зависящее от траектории обучения, обеспечивает лучший компромисс между временем обучения и качеством модели по сравнению с фиксированными расписаниями переключения.'}, 'en': {'title': 'HybridAL: Smart Switching for Efficient Active Learning', 'desc': "The paper introduces HybridAL, a novel approach in active learning that dynamically decides between retraining a model from scratch and fine-tuning it based on real-time stabilization signals. This method recognizes that retraining is beneficial in the early stages of learning when the model's understanding of the data is still evolving, while fine-tuning is more effective once the model's performance stabilizes. By utilizing two signals—spectral exponent change and accuracy change—HybridAL optimizes the training process, achieving similar accuracy to traditional methods while significantly reducing training time by up to 49%. The results demonstrate that this adaptive strategy not only maintains performance but also enhances model calibration compared to fixed switching schedules."}, 'zh': {'title': 'HybridAL：智能切换训练策略，提升学习效率', 'desc': 'HybridAL是一种自适应的训练策略，在主动学习中根据在线稳定信号在重新训练和微调之间切换。这种方法可以减少训练时间，同时保持模型的准确性和提高校准效果。研究表明，在早期阶段，重新训练对标签分布的影响更大，而在模型轨迹稳定后，微调则更为安全。HybridAL通过监测稳定信号，优化了训练过程，显著节省了重新训练的时间，并在多个文本分类任务中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.09187', 'title': 'AgenticGen: Reward-Guided Agentic Video Generation for Advertising', 'url': 'https://huggingface.co/papers/2609.09187', 'abstract': 'Abstract AgenticGen improves advertising video generation by decomposing it into strategy selection and draft generation stages supervised by online business feedback and human quality rewards.  Generated by thinkingmachines/Inkling-Small Advertising video generation is not only a video synthesis task, but also a product-conditioned reasoning problem whose success is measured by online business metrics. Recent video foundation models can generate realistic clips from multimodal conditions, yet they do not optimize how a product should be transformed into an effective advertisement or how future generation should be improved from online business feedback. To close this loop, we propose AgenticGen, a reward-guided agentic framework that decomposes advertising video generation into two trainable reasoning stages, strategy selection and draft generation, thereby exposing optimization targets that online business feedback can supervise. AgenticGen learns a performance-based reward from accumulated online feedback and a complementary rubric-based reward aligned with human quality standards, then uses them to supervise policy optimization. DPO first moves the agentic policies toward online preferences, and GRPO further refines both stages with process and outcome rewards. Offline experiments validate the reward models and successive policy optimization. Online A/B experiments in the TikTok advertising system show that AgenticGen after DPO and GRPO improves CTR by 2.72%, CVR by 2.63%, and Advv by 9.61% over the SFT baseline.', 'score': 5, 'issue_id': 3249, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'd4c2563fb7f9ac0f', 'authors': ['Xingyuan Bu', 'Chengru Song', 'Hao Zhou', 'Tao Zhou', 'Dong Li', 'Wei Li', 'Shilong Li', 'Hao Shi', 'Yongxin Guo', 'Donghao Zhou', 'Qiangpeng Yang', 'Shilei Wen'], 'affiliations': ['ByteDance', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.09187.jpg', 'data': {'categories': ['#training', '#video', '#rlhf', '#multimodal', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Агентная генерация видеорекламы с обратной связью от реального бизнеса', 'desc': 'AgenticGen — это система для генерации рекламных видео, которая разбивает задачу на два этапа: выбор стратегии и создание черновика. Модель использует два типа награждающих функций — одну на основе реальных бизнес-метрик из онлайна и другую на основе критериев качества от экспертов. Для оптимизации политики применяются методы DPO и GRPO, которые учитывают как процесс генерации, так и финальный результат. В экспериментах на платформе TikTok система показала улучшение ключевых метрик на 2-10% по сравнению с базовым подходом.'}, 'en': {'title': 'Optimizing Advertising Videos with AgenticGen', 'desc': 'AgenticGen is a novel framework designed to enhance the generation of advertising videos by breaking the process into two key stages: strategy selection and draft generation. This approach is guided by real-time business feedback and human quality assessments, ensuring that the generated content is not only visually appealing but also effective in promoting products. By utilizing a reward-based system that incorporates both online performance metrics and human evaluations, AgenticGen optimizes the video generation process to better align with audience preferences. Experimental results demonstrate significant improvements in click-through rates (CTR), conversion rates (CVR), and advertising value (Advv) compared to traditional methods.'}, 'zh': {'title': '智能广告视频生成的新方法', 'desc': 'AgenticGen 是一种改进广告视频生成的方法，它将生成过程分为策略选择和草稿生成两个阶段，并通过在线商业反馈和人类质量奖励进行监督。该方法不仅关注视频合成，还考虑如何将产品转化为有效的广告，并根据在线业务指标来评估成功。AgenticGen 通过积累的在线反馈学习性能奖励，并结合人类质量标准的评估奖励，来优化生成策略。实验结果表明，AgenticGen 在 TikTok 广告系统中显著提高了点击率和转化率。'}}}, {'id': 'https://huggingface.co/papers/2609.10355', 'title': 'Why Is Video Still So Expensive? A Survey of Inference-Efficiency Mechanisms in Video and Audiovisual LLMs', 'url': 'https://huggingface.co/papers/2609.10355', 'abstract': 'Abstract This survey examines inference-efficiency techniques for video large language models, analyzing cost reductions across frame sampling, encoding, token compression, and language model stages while identifying evaluation gaps.  Generated by thinkingmachines/Inkling-Small Video understanding has rapidly evolved toward video large language models (VideoLLMs): systems that couple video representations with pretrained large language models and condition generation on a textual prompt. Their strong performance on captioning, question answering, retrieval and temporal grounding comes at a computation and memory cost that grows with frame count and context length, limiting deployment in real-time, mobile and resource-constrained settings. This survey covers inference-efficiency mechanisms for visual and audiovisual VideoLLMs that report concrete reductions in parameter count, FLOPs per input, latency, memory, or visual and audio token count. We analyze bottlenecks across frame sampling, modality encoding, connector-level token reduction, and LLM prefilling and decoding. We organize methods by the pipeline stage at which they act, covering VideoLLMs developed since late 2022 together with earlier frame-sampling and vision-encoder mechanisms that remain components of current pipelines. We assemble literature-reported accuracy--cost comparisons under shared host models and input protocols wherever available, distinguish them from heterogeneous cross-paper evidence, and identify gaps in audiovisual efficiency and standardized evaluation. We maintain a repository at https://github.com/momentslab/awesome-efficient-videollm.', 'score': 4, 'issue_id': 3251, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'e8344fa099c913f2', 'pdf_title_img': 'assets/pdf/title_img/2609.10355.jpg', 'data': {'categories': ['#survey', '#audio', '#inference', '#video', '#multimodal', '#optimization', '#long_context', '#open_source'], 'emoji': '⚡', 'ru': {'title': 'Эффективный инфренс видео-моделей: оптимизация на каждом этапе', 'desc': 'Этот обзор исследует методы оптимизации инференса для видео больших языковых моделей, анализируя снижение вычислительных затрат на этапах выборки кадров, кодирования модальностей, сжатия токенов и работы языковой модели. VideoLLM системы демонстрируют высокую производительность в задачах описания видео, ответов на вопросы и временной локализации, но требуют значительных вычислительных ресурсов, что затрудняет их развертывание в условиях ограниченных ресурсов. Авторы систематизируют методы оптимизации по этапам обработки пайплайна: выборка кадров, кодирование модальностей, редукция токенов на уровне коннектора и префилл/декодирование LLM. В обзоре собраны литературные данные о компромиссе между точностью и вычислительной стоимостью, выявлены пробелы в оценке аудиовизуальных моделей и стандартизации бенчмарков.'}, 'en': {'title': 'Boosting Efficiency in Video Large Language Models', 'desc': 'This paper surveys techniques to improve the efficiency of inference in video large language models (VideoLLMs). It focuses on methods that reduce computational costs related to frame sampling, encoding, and token compression, which are crucial for real-time applications. The authors analyze various bottlenecks in the processing pipeline and categorize efficiency methods based on their operational stage. Additionally, they highlight gaps in current evaluation practices and provide a repository for further resources on efficient VideoLLMs.'}, 'zh': {'title': '提升视频大语言模型的推理效率', 'desc': '这篇调查研究了视频大语言模型的推理效率技术，分析了在帧采样、编码、令牌压缩和语言模型阶段的成本降低。视频大语言模型结合了视频表示和预训练的大语言模型，能够在文本提示下生成内容。尽管它们在字幕生成、问答、检索和时间定位方面表现出色，但计算和内存成本随着帧数和上下文长度的增加而增加，限制了在实时、移动和资源受限环境中的应用。本文还整理了自2022年底以来开发的视频大语言模型的推理效率机制，并识别了视听效率和标准化评估中的空白。'}}}, {'id': 'https://huggingface.co/papers/2609.09264', 'title': 'StochBench: A Domain-Specific Benchmark for Stochastic Processes in Lean', 'url': 'https://huggingface.co/papers/2609.09264', 'abstract': 'Abstract StochBench introduces 450 graduate-level stochastic processes problems in Lean 4 to benchmark formal theorem proving on domain-specific applied mathematics.  Generated by thinkingmachines/Inkling-Small Leading benchmarks for formal theorem proving with large language models are small collections drawn from competition math, such as the IMO and Putnam, that poorly represent field-specific applications. We introduce StochBench, a Lean 4 benchmark of 450 graduate stochastic-processes problems at varying abstraction levels, each paired with its natural-language source. Addressing a field underrepresented in Mathlib, it covers finite and countable Markov chains, renewal processes, random walks, martingales, stopping times, queues, Brownian motion, stochastic calculus, weak convergence, and Poisson and continuous-time Markov processes. Our Opus 4.8-based agent achieves a 34.9% proof rate (157/450) under a 15-minute per-problem limit. StochBench better represents domain-specific applied mathematics while remaining challenging for advanced provers.', 'score': 4, 'issue_id': 3252, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'a5e0615e94fdde65', 'authors': ['Idan Davidovich', 'Debargha Ganguly', 'Vikash Singh', 'Vipin Chaudhary'], 'affiliations': ['Case Western Reserve University'], 'pdf_title_img': 'assets/pdf/title_img/2609.09264.jpg', 'data': {'categories': ['#plp', '#math', '#dataset', '#agents', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Формальное доказательство теорем для прикладной математики', 'desc': 'StochBench — это новый бенчмарк, содержащий 450 задач по теории стохастических процессов на языке Lean 4, предназначенный для оценки возможностей больших языковых моделей в формальном доказательстве теорем. В отличие от существующих бенчмарков, основанных на задачах математических олимпиад, StochBench охватывает специализированные области прикладной математики: цепи Маркова, процессы восстановления, случайные блуждания, мартингалы, броуновское движение и стохастическое исчисление. Агент на основе модели Opus 4.8 смог доказать 34,9% задач в отведённое время, что показывает высокий уровень сложности бенчмарка. StochBench лучше представляет реальные применения прикладной математики и обеспечивает более справедливую оценку систем формального доказательства.'}, 'en': {'title': 'StochBench: Advancing Formal Theorem Proving in Stochastic Processes', 'desc': 'StochBench is a new benchmark that includes 450 problems related to stochastic processes, designed for testing formal theorem proving in Lean 4. These problems cover a wide range of topics such as Markov chains, random walks, and stochastic calculus, providing a more comprehensive representation of applied mathematics. Unlike previous benchmarks that focused on competition math, StochBench aims to challenge advanced provers with domain-specific applications. The Opus 4.8-based agent demonstrated a proof rate of 34.9%, indicating the complexity and difficulty of the problems presented.'}, 'zh': {'title': 'StochBench：随机过程的形式化证明基准', 'desc': 'StochBench是一个在Lean 4中引入的基准测试，包含450个研究生级别的随机过程问题，旨在评估形式化定理证明的能力。这些问题涵盖了有限和可数的马尔可夫链、更新过程、随机游走、鞅、停止时间、排队论、布朗运动、随机微积分等主题。与传统的数学竞赛问题相比，StochBench更好地代表了特定领域的应用数学，同时对高级证明者仍然具有挑战性。我们的Opus 4.8基础的代理在每个问题15分钟的限制下，达到了34.9%的证明率。'}}}, {'id': 'https://huggingface.co/papers/2609.09134', 'title': 'Co-Evolving Harnesses and Models: On-Policy Correction Helps Weaker Models Catch Up Where Imitation Fails', 'url': 'https://huggingface.co/papers/2609.09134', 'abstract': "Abstract Combining harness evolution with localized expert correction improves weaker models without disrupting their native planning style.  Generated by thinkingmachines/Inkling-Small Agent harnesses (the system prompt, tool set, execution hooks, and context-management scaffolding around a model) are a critical determinant of agentic task success. Automated harness evolution can enable smaller models to perform well on domain-specific tasks at a fraction of frontier-model cost. Since both the harness and model weights shape behavior, we ask how harness evolution and lightweight fine-tuning should be combined. Across seven enterprise agent tasks, we first evolve a harness with the weaker model, then find that a stronger expert often uses it more effectively, suggesting expert supervision could close the remaining gap. However, training the weaker model on the expert's complete trajectories under the evolved harness backfires: performance regresses on all seven tasks by 4 to 30 points across Qwen3-Coder and Gemma 4, even though the same procedure helps under the unevolved harness. Our analysis shows that imitation transfers knowledge and increases scaffold usage, but disrupts model-harness fit: the weaker model adopts the expert's planning strategy without the competence to execute it and no longer matches the harness evolved around its native planning style. We therefore develop an on-policy expert-correction pipeline, automated by a meta-level MLE agent, that localizes the failing turn in the weaker model's own rollout and asks the expert to rewrite only that turn. This preserves the model's planning style and combines the gains of harness evolution and model adaptation. Our results identify and resolve a source of contention between harness and weight updates, yielding a compatibility-preserving recipe for economical co-evolution on domain-specific enterprise tasks.", 'score': 4, 'issue_id': 3250, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '23c36804daffce1e', 'pdf_title_img': 'assets/pdf/title_img/2609.09134.jpg', 'data': {'categories': ['#optimization', '#small_models', '#training', '#agents'], 'emoji': '🔧', 'ru': {'title': 'Согласованная эволюция: как развивать слабые модели без нарушения их планирования', 'desc': "В работе исследуется, как эволюция системного промпта (harness) и локальная адаптация моделей могут совместно улучшить производительность слабых моделей на специализированных задачах. Авторы показывают, что при наивном обучении на полных траекториях эксперта производительность падает, потому что слабая модель теряет соответствие со своим эволюционировавшим harness'ем. Они предлагают альтернативный подход: на-полис конвейер коррекции эксперта, который выявляет ошибки в собственных прогонах модели и просит эксперта переписать только эти шаги. Такой метод сохраняет исходный стиль планирования модели и успешно комбинирует выгоды эволюции harness и адаптации весов."}, 'en': {'title': 'Enhancing Weaker Models with Expert-Corrected Harness Evolution', 'desc': "This paper discusses a method to enhance weaker machine learning models by combining harness evolution with expert corrections. The harness, which includes the system's tools and context management, plays a crucial role in the model's success on specific tasks. The authors found that while evolving the harness improves performance, directly training the weaker model on expert trajectories can lead to worse results due to a mismatch in planning styles. To address this, they propose a new approach that allows the model to maintain its native planning style while still benefiting from expert guidance, leading to better performance on enterprise tasks."}, 'zh': {'title': '结合工具演化与专家修正，提升模型表现', 'desc': '本文探讨了如何通过结合工具演化与局部专家修正来提升较弱模型的表现，而不干扰其原有的规划风格。研究表明，生成的工具（即系统提示、工具集、执行钩子和上下文管理框架）是影响智能体任务成功的重要因素。通过自动化工具演化，较小的模型能够以较低的成本在特定领域任务中表现良好。我们提出了一种基于专家修正的管道，能够在保持模型规划风格的同时，结合工具演化和模型适应的优势。'}}}, {'id': 'https://huggingface.co/papers/2609.06490', 'title': 'OracleZoom: On-Policy Self-Distillation Inspired Reference-Constrained Recursive Image Super Resolution', 'url': 'https://huggingface.co/papers/2609.06490', 'abstract': 'Abstract OracleZoom improves recursive super-resolution by combining trajectory-based training with cross-scale supervision and a latent prior to reduce hallucinations at extreme magnifications.  Generated by thinkingmachines/Inkling-Small Recursive Super-Resolution (SR) extends fixed-scale SR to extreme magnification by repeatedly feeding predictions back into the same model, analogous to zooming an image repeatedly. However, ground truth availability at every scale, especially at depth, remains challenging as the required source resolution grows geometrically, leaving deeper predictions unsupervised. We present OracleZoom, an on-policy distillation-inspired, reference-constrained framework that trains on its trajectory while carrying the last ground-truth evidence beyond the supervision boundary. Direct and cross-scale supervision constrain verifiable content, while a no-reference quality objective guides unresolved fine-scale detail. A KL-constrained pretrained latent prior limits quality-driven drift, while EMA consistency stabilizes the supervision boundary. Across seven datasets, OracleZoom achieves the state-of-the-art SR quality across zooming scales, averaging 0.713 CLIPIQA, with larger gains on deeper scales, while significantly reducing hallucinations. Code, data, and models are available at https://dipta007.github.io/OracleZoom/ .', 'score': 4, 'issue_id': 3251, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': 'c13b03bae1efaf68', 'authors': ['Shubhashis Roy Dipta', 'Sourajit Saha', 'Shaswati Saha', 'Nobin Sarwar'], 'affiliations': ['University of Maryland, Baltimore County'], 'pdf_title_img': 'assets/pdf/title_img/2609.06490.jpg', 'data': {'categories': ['#hallucinations', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Суперразрешение без галлюцинаций на экстремальных масштабах', 'desc': 'OracleZoom — это метод улучшения рекурсивной суперразрешения, который решает проблему отсутствия ground truth данных на глубоких масштабах путём комбинирования обучения по траектории, кросс-масштабной супервизии и латентного априора. Модель многократно применяется к собственным предсказаниям для экстремального увеличения изображения, но при этом использует последнее доступное ground truth значение за границей супервизии. Фреймворк применяет прямую и кросс-масштабную супервизию для проверяемого контента, а также no-reference качественную метрику для восстановления мелких деталей. KL-ограниченный предварительно обученный латентный prior и EMA-консистентность предотвращают галлюцинации и стабилизируют
