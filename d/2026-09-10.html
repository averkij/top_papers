    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.10522', 'title': 'Show-Harness: Just a VLM Agent Can Play Robots', 'url': 'https://huggingface.co/papers/2609.10522', 'abstract': 'Abstract Show-Harness links vision-language models to robot control via discrete semantic actions interpreted by embodiment-specific modules, enabling zero-shot and efficient fine-tuned deployment across robots and GUIs.  Generated by thinkingmachines/Inkling-Small Foundation vision-language models (VLMs) exhibit broad intelligence about the world, yet translating this intelligence into robot control remains challenging. We present Show-Harness, an Embodied Harness that enables VLMs to "play" robots through a compact semantic interface linking intent to action. Show-Harness exposes discrete semantic action units that VLMs can naturally reason over, while embodiment-specific interpreters deterministically ground them into local robot actions, keeping the VLM directly responsible for fine-grained physical decisions. Through the same interface, Show-Harness demonstrates the feasibility of (1) directly unlocking closed-source frontier VLMs for zero-shot robot control, and (2) adapting small-scale open-source VLMs for low-cost deployment with just a few GPU-hours of fine-tuning. We further develop GUMI (GUI Manipulation Interface), which extends the same semantic action space to GUI-based demonstration collection, allowing humans and agents to "play" robots across embodiments without specialized teleoperation hardware. Extensive experiments show that Show-Harness-equipped VLM agents generalize robustly across tasks, embodiments, and environments, outperforming representative agentic and VLA paradigms. These results suggest that the right interface can unlock substantial embodied capability from foundation VLMs, without requiring additional model capacity or costly embodiment-specific pretraining.', 'score': 4, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '76e9a3cd29ea70d9', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#small_models', '#training', '#robotics', '#multimodal', '#agents', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Семантический мост между языком и действием робота', 'desc': 'Show-Harness представляет собой систему, которая соединяет видеоязыковые модели с управлением роботами через дискретные семантические действия, интерпретируемые специализированными модулями для каждого типа робота. Система позволяет использовать закрытые и открытые VLM для управления роботами как в режиме нулевого обучения, так и с эффективной дообучением на небольшом объёме данных. Авторы разработали GUMI — интерфейс для манипуляции GUI, который расширяет семантическое пространство действий на сбор демонстраций и позволяет управлять роботами без специализированного оборудования телеоперации. Экспериментальные результаты демонстрируют, что правильный семантический интерфейс позволяет раскрыть возможности фундаментальных моделей для воплощённых агентов без дополнительного обучения или специфичного для каждого робота преобучения.'}, 'en': {'title': 'Empowering Robots with Vision-Language Models through Show-Harness', 'desc': 'The paper introduces Show-Harness, a system that connects vision-language models (VLMs) to robot control using discrete semantic actions. This system allows VLMs to effectively translate their understanding of the world into actionable commands for robots, facilitating both zero-shot and fine-tuned deployments. Show-Harness includes embodiment-specific modules that interpret these actions, ensuring that VLMs can make precise physical decisions. Additionally, it extends to GUI manipulation, enabling seamless interaction with robots across different platforms without the need for specialized hardware.'}, 'zh': {'title': 'Show-Harness：解锁机器人控制的新方式', 'desc': 'Show-Harness 是一种将视觉-语言模型与机器人控制连接起来的工具，通过特定的语义动作模块实现。这种方法使得视觉-语言模型能够在没有额外训练的情况下，直接控制机器人并进行高效的微调。Show-Harness 提供了一种紧凑的语义接口，将意图与动作相连接，使得模型能够自然地推理出离散的语义动作单元。通过这种接口，Show-Harness 证明了在不同任务和环境中，视觉-语言模型能够有效地进行机器人控制，展现出强大的通用性和适应性。'}}}, {'id': 'https://huggingface.co/papers/2609.10540', 'title': 'Programmable World Model', 'url': 'https://huggingface.co/papers/2609.10540', 'abstract': 'Abstract A programmable world model separates explicit state evolution from video generation using executable rules and 3D bounding boxes to maintain persistent, controllable environments.  Generated by thinkingmachines/Inkling-Small Recent video world models generate increasingly realistic and interactive visual experiences, yet lack reliable mechanisms for maintaining persistent world state and enforcing programmable rules over extended interactions. We introduce Programmable World Model, a framework that decouples world-state evolution from visual observation generation. An agent translates natural-language instructions into executable programs that specify entity states and state-transition rules, enabling direct control over individual entities and their interactions. A lightweight engine executes these programs to update and maintain an explicit, persistent global world state, including off-screen entities and non-visual attributes. To connect world state with visual generation, we introduce state-augmented 3D oriented bounding boxes (OBBs) as an intermediate representation. This representation, together with the target camera trajectory, is deterministically compiled into pixel-aligned spatiotemporal conditioning signals for a pretrained video model serving as the generative renderer. This design allows users to create playable games with predefined mechanics, direct control over individual entities, and persistent world state throughout gameplay. We further introduce CombatStateBench, a benchmark for evaluating programmable world models. On CombatStateBench, our method achieves 94% Count Accuracy and 98% State Accuracy, substantially outperforming existing interactive video world models while supporting coherent long-horizon generation. These results demonstrate the effectiveness of separating explicit state evolution from generative rendering for building persistent, programmable worlds.', 'score': 4, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': 'b62a5e3e53d09a8e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#games', '#multimodal', '#3d', '#long_context', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Разделение логики мира и визуальной генерации для управляемых виртуальных окружений', 'desc': 'В статье предлагается Programmable World Model — фреймворк, который разделяет эволюцию состояния мира от генерации видео. Агент преобразует естественный язык в исполняемые программы, которые управляют состоянием объектов и правилами их взаимодействия, сохраняя при этом стабильное глобальное состояние, включая сущности за пределами экрана. Для связи между состоянием и визуальной генерацией используются 3D ориентированные bounding boxes как промежуточное представление, которые детерминированно преобразуются в сигналы для предварительно обученной модели видео-генерации. Метод достигает 94% точности при подсчёте объектов и 98% точности состояния на новом бенчмарке CombatStateBench, обеспечивая генерацию на долгих горизонтах с полным контролем над каждой сущностью.'}, 'en': {'title': 'Building Interactive Worlds with Programmable State Control', 'desc': 'The paper presents a Programmable World Model that enhances video generation by separating the evolution of the world state from the visual output. It allows agents to interpret natural language commands into executable programs that manage the states and interactions of entities within a persistent environment. By using state-augmented 3D oriented bounding boxes, the model connects the world state to visual generation, enabling coherent and interactive gameplay. The proposed framework outperforms existing models in maintaining a consistent world state and supports long-term interactions, as demonstrated by the CombatStateBench benchmark results.'}, 'zh': {'title': '构建可编程的持久世界', 'desc': '可编程世界模型通过可执行规则和3D边界框，将明确的状态演变与视频生成分离，从而维护持久且可控的环境。该框架允许代理将自然语言指令转化为可执行程序，指定实体状态和状态转移规则，实现对个体实体及其交互的直接控制。轻量级引擎执行这些程序，以更新和维护明确的全球世界状态，包括屏幕外实体和非视觉属性。通过引入状态增强的3D定向边界框，连接世界状态与视觉生成，从而实现用户创建具有预定义机制的可玩游戏。'}}}, {'id': 'https://huggingface.co/papers/2609.07103', 'title': 'Revisiting Complete Reasoning Traces for Post-Training', 'url': 'https://huggingface.co/papers/2609.07103', 'abstract': 'Abstract Large language models gain reasoning improvements from truncated trajectory endpoints rather than full reasoning traces, reducing redundancy while benefiting supervised fine-tuning and reinforcement learning.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are often post-trained on pre-collected reasoning trajectories to improve their reasoning capability. Such trajectories tend to be long due to complex, interwoven paths, which often include detours on the path toward the answer. However, it has been underexplored whether LLMs indeed benefit from learning complete trajectories in post-training, such as supervised fine-tuning (SFT). Starting from our pilot study, we find that full trajectories provide only limited benefit, while partial trajectories are effective even under heavy truncation. We analyze redundancy in reasoning trajectories through attention-based analyses and controlled token-removal studies, both of which show that intermediate tokens contribute minimally to final reasoning quality. This suggests that avoiding redundant information may allow LLMs to internally infer coherent alternatives by inferring missing steps from their internal knowledge, given known trajectory endpoints. Furthermore, we show that training LLMs using endpoints leads to consistent changes in reasoning behavior, and that it also benefits post-training methods based on reinforcement learning or on-policy distillation, highlighting the need to revisit complete reasoning traces. Code is available at https://github.com/naver-ai/revisiting-trace.', 'score': 1, 'issue_id': 3249, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '04734da95a89af2d', 'authors': ['Jaehui Hwang', 'Sangdoo Yun', 'Byeongho Heo', 'Dongyoon Han'], 'affiliations': ['NAVER AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.07103.jpg', 'data': {'categories': ['#training', '#rlhf'], 'emoji': '✂️', 'ru': {'title': 'Краткие концовки лучше полных путей: как избежать избыточности при обучении рассуждениям', 'desc': 'В этой работе исследуется, как большие языковые модели учатся на траекториях рассуждений при постобучении. Авторы показали, что полные траектории менее эффективны, чем усечённые траектории, заканчивающиеся ответом, так как промежуточные токены содержат много избыточной информации. Анализ внимания и контролируемое удаление токенов подтвердили, что LLM могут восстанавливать пропущенные шаги из своих внутренних знаний. Такой подход улучшает как supervised fine-tuning, так и методы обучения с подкреплением, предполагая необходимость пересмотра стандартного использования полных траекторий.'}, 'en': {'title': 'Optimize Reasoning: Focus on Endpoints, Not Full Paths!', 'desc': 'This paper explores how large language models (LLMs) can improve their reasoning abilities by focusing on truncated trajectory endpoints instead of complete reasoning paths. The authors find that using partial trajectories, even when heavily truncated, is more effective than relying on full reasoning traces, which often contain redundant information. Through various analyses, they demonstrate that intermediate reasoning steps contribute little to the final outcome, suggesting that LLMs can infer missing information from their existing knowledge. The study highlights the importance of optimizing training methods, particularly in supervised fine-tuning and reinforcement learning, by emphasizing endpoint training over complete trajectories.'}, 'zh': {'title': '优化推理：截断轨迹端点的优势', 'desc': '这篇论文探讨了大型语言模型（LLMs）在推理能力提升方面的研究。研究发现，与完整的推理轨迹相比，截断的轨迹端点能够减少冗余信息，同时在监督微调和强化学习中仍然有效。通过分析推理轨迹中的冗余性，研究表明中间的推理步骤对最终结果的贡献有限。最终，使用轨迹端点进行训练可以显著改变推理行为，并对后续的训练方法产生积极影响。'}}}, {'id': 'https://huggingface.co/papers/2609.10226', 'title': 'Φ-Bench: Can Large Language Models Engineer the Infrastructure That Powers Them?', 'url': 'https://huggingface.co/papers/2609.10226', 'abstract': 'Abstract Φ-Bench evaluates large language models on open-ended engineering of the LLM infrastructure stack across tasks from kernel optimization to end-to-end system design.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) have demonstrated remarkable capabilities in reasoning and code generation, raising the prospect that they could assist in developing and optimizing the very infrastructure that powers them. However, existing benchmarks mainly focus on isolated kernels, predefined operators, or pre-specified optimization targets, and therefore fail to evaluate the ability of LLMs to perform open-ended, long-horizon LLM infrastructure engineering. To address this gap, we present Φ-Bench, a benchmark for systematically evaluating LLMs on engineering the LLM infrastructure stack. Derived from optimization problems studied in frontier research and grounded in real-world code repositories, Φ-Bench provides broad coverage of the LLM infrastructure stack and spans tasks of varying complexity, ranging from localized kernel-level function completion to long-horizon implementation and end-to-end system optimization. Extensive experiments on frontier LLMs reveal their current capabilities and limitations in engineering complex LLM infrastructure, offering insights into the challenges that remain on the path toward autonomous optimization of future AI infrastructure.', 'score': 0, 'issue_id': 3249, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '0f4bbd40c29371c3', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#science', '#reasoning', '#plp', '#optimization', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'Языковые модели как инженеры собственной инфраструктуры', 'desc': 'Φ-Bench — это бенчмарк для оценки способностей больших языковых моделей в инженерии инфраструктуры LLM, от оптимизации ядер до проектирования полноценных систем. В отличие от существующих наборов задач, которые сосредоточены на изолированных компонентах, Φ-Bench оценивает открытые, долгосрочные задачи оптимизации реальной инфраструктуры LLM. Бенчмарк основан на фронтальных исследованиях и включает задачи различной сложности, от заполнения функций на уровне ядра до реализации и оптимизации всей системы. Эксперименты показывают текущие возможности и ограничения современных LLM в автономной оптимизации инфраструктуры искусственного интеллекта.'}, 'en': {'title': 'Empowering LLMs to Engineer Their Own Infrastructure', 'desc': 'Φ-Bench is a new benchmark designed to evaluate large language models (LLMs) on their ability to engineer and optimize their own infrastructure. Unlike previous benchmarks that focus on specific tasks or predefined goals, Φ-Bench assesses LLMs on a wide range of open-ended engineering challenges, from kernel optimization to complete system design. This benchmark is based on real-world code and complex optimization problems, providing a comprehensive evaluation of LLM capabilities. The results from testing various LLMs highlight their strengths and weaknesses in handling intricate infrastructure tasks, shedding light on the future of autonomous AI optimization.'}, 'zh': {'title': '评估大型语言模型的基础设施工程能力', 'desc': 'Φ-Bench是一个用于评估大型语言模型（LLM）在开放式工程任务中的能力的基准测试。它涵盖了从内核优化到端到端系统设计的多种任务，旨在填补现有基准测试的空白。通过对前沿研究中的优化问题进行分析，Φ-Bench能够系统地评估LLM在工程基础设施堆栈中的表现。实验结果揭示了当前LLM在复杂基础设施工程中的能力和局限性，为未来AI基础设施的自主优化提供了重要见解。'}}}, {'id': 'https://huggingface.co/papers/2609.08650', 'title': 'Difficulty-Adaptive Tree-Structured Policy Optimization for Expanding Reasoning Coverage in RLVR', 'url': 'https://huggingface.co/papers/2609.08650', 'abstract': "Abstract DATPO improves reasoning coverage in large models by using difficulty-adaptive tree-structured rollouts with sentence-entropy-guided branching and diversity-aware optimization.  Generated by thinkingmachines/Inkling-Small Reinforcement Learning with Verifiable Rewards (RLVR) has been central to the recent success of Large Reasoning Models. However, while RLVR significantly improves single-sample accuracy, it often fails to expand the model's intrinsic reasoning coverage (pass@k) due to limited exploration during training. To address this, we optimize the structural design of train-time rollouts to enhance pass@k. Our analysis identifies three key design principles: (1) difficulty-adaptive rollout can play an important role in expanding pass@k, beyond serving as an efficiency heuristic; (2) tree-based rollout outperforms parallel sampling in discovering correct answers; and (3) sentence-entropy-guided forking overcomes the localization phenomenon of token-level branching to maximize semantic diversity. Building on these insights, we propose DATPO (Difficulty-Adaptive Sentence-entropy-guided Tree-structured Policy Optimization). DATPO integrates difficulty-adaptive tree search with a sibling-diversity advantage term, explicitly promoting semantic diversity to expand reasoning coverage during training. Experiments on mathematical reasoning benchmarks demonstrate that DATPO outperforms baselines especially in pass@k, which directly translates to superior test-time scaling performance.", 'score': 0, 'issue_id': 3249, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'e3a06b324b96da62', 'authors': ['Youngjun Yu', 'Sanghwan Jang', 'Hwanjo Yu'], 'affiliations': ['Pohang University of Science and Technology (POSTECH)'], 'pdf_title_img': 'assets/pdf/title_img/2609.08650.jpg', 'data': {'categories': ['#training', '#math', '#reasoning', '#rl', '#rlhf', '#optimization'], 'emoji': '🌳', 'ru': {'title': 'Древовидный поиск с адаптацией к сложности для расширения разнообразия рассуждений', 'desc': 'DATPO — это метод обучения больших языковых моделей, который улучшает способность модели находить различные пути решения задач (pass@k). Подход использует адаптивный древовидный поиск, где сложность примеров влияет на глубину исследования, и направляет ветвление по энтропии предложений вместо токенов для большей семантической разнообразности. Метод добавляет специальный термин в функцию награды, явно стимулируя разнообразие решений во время обучения с подкреплением. Экспериментально показано, что DATPO превосходит базовые методы в расширении покрытия рассуждений и улучшает масштабируемость при тестировании.'}, 'en': {'title': 'Enhancing Reasoning Coverage with DATPO', 'desc': 'The paper presents DATPO, a method designed to enhance the reasoning capabilities of large models by improving their exploration during training. It introduces difficulty-adaptive tree-structured rollouts that utilize sentence-entropy to guide branching, which helps in discovering diverse and correct answers. The authors identify key principles that contribute to better reasoning coverage, such as the importance of adaptive rollouts and tree-based structures over traditional methods. Experiments show that DATPO significantly improves performance on mathematical reasoning tasks, particularly in terms of pass@k metrics, indicating better scalability during testing.'}, 'zh': {'title': 'DATPO：提升推理覆盖率的创新方法', 'desc': 'DATPO是一种改进大型模型推理覆盖率的方法，采用难度自适应的树结构回滚和基于句子熵的分支优化。通过优化训练时的回滚结构设计，DATPO能够提高模型的推理覆盖率（pass@k），克服了传统方法在训练中探索有限的问题。研究表明，难度自适应回滚不仅提高效率，还能有效扩展推理能力；树结构回滚在发现正确答案方面优于并行采样；而基于句子熵的分叉方法则最大化了语义多样性。实验结果显示，DATPO在数学推理基准测试中表现优异，尤其是在pass@k方面，直接提升了测试时的扩展性能。'}}}, {'id': 'https://huggingface.co/papers/2609.09187', 'title': 'AgenticGen: Reward-Guided Agentic Video Generation for Advertising', 'url': 'https://huggingface.co/papers/2609.09187', 'abstract': 'Abstract AgenticGen improves advertising video generation by decomposing it into strategy selection and draft generation stages supervised by online business feedback and human quality rewards.  Generated by thinkingmachines/Inkling-Small Advertising video generation is not only a video synthesis task, but also a product-conditioned reasoning problem whose success is measured by online business metrics. Recent video foundation models can generate realistic clips from multimodal conditions, yet they do not optimize how a product should be transformed into an effective advertisement or how future generation should be improved from online business feedback. To close this loop, we propose AgenticGen, a reward-guided agentic framework that decomposes advertising video generation into two trainable reasoning stages, strategy selection and draft generation, thereby exposing optimization targets that online business feedback can supervise. AgenticGen learns a performance-based reward from accumulated online feedback and a complementary rubric-based reward aligned with human quality standards, then uses them to supervise policy optimization. DPO first moves the agentic policies toward online preferences, and GRPO further refines both stages with process and outcome rewards. Offline experiments validate the reward models and successive policy optimization. Online A/B experiments in the TikTok advertising system show that AgenticGen after DPO and GRPO improves CTR by 2.72%, CVR by 2.63%, and Advv by 9.61% over the SFT baseline.', 'score': 0, 'issue_id': 3249, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'd4c2563fb7f9ac0f', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#video', '#rlhf', '#multimodal', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Агентная генерация видеорекламы с обратной связью от реального бизнеса', 'desc': 'AgenticGen — это система для генерации рекламных видео, которая разбивает задачу на два этапа: выбор стратегии и создание черновика. Модель использует два типа награждающих функций — одну на основе реальных бизнес-метрик из онлайна и другую на основе критериев качества от экспертов. Для оптимизации политики применяются методы DPO и GRPO, которые учитывают как процесс генерации, так и финальный результат. В экспериментах на платформе TikTok система показала улучшение ключевых метрик на 2-10% по сравнению с базовым подходом.'}, 'en': {'title': 'Optimizing Advertising Videos with AgenticGen', 'desc': 'AgenticGen is a novel framework designed to enhance the generation of advertising videos by breaking the process into two key stages: strategy selection and draft generation. This approach is guided by real-time business feedback and human quality assessments, ensuring that the generated content is not only visually appealing but also effective in promoting products. By utilizing a reward-based system that incorporates both online performance metrics and human evaluations, AgenticGen optimizes the video generation process to better align with audience preferences. Experimental results demonstrate significant improvements in click-through rates (CTR), conversion rates (CVR), and advertising value (Advv) compared to traditional methods.'}, 'zh': {'title': '智能广告视频生成的新方法', 'desc': 'AgenticGen 是一种改进广告视频生成的方法，它将生成过程分为策略选择和草稿生成两个阶段，并通过在线商业反馈和人类质量奖励进行监督。该方法不仅关注视频合成，还考虑如何将产品转化为有效的广告，并根据在线业务指标来评估成功。AgenticGen 通过积累的在线反馈学习性能奖励，并结合人类质量标准的评估奖励，来优化生成策略。实验结果表明，AgenticGen 在 TikTok 广告系统中显著提高了点击率和转化率。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (3)', '#agi', '#alignment', '#architecture', '#audio', '#benchmark (2)', '#cv (1)', '#data', '#dataset (1)', '#diffusion', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (3)', '#open_source', '#optimization (2)', '#plp (1)', '#rag', '#reasoning (2)', '#rl (1)', '#rlhf (3)', '#robotics (1)', '#science (1)', '#security', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#training (4)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-10 02:17',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-10 02:17')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-10 02:17')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
