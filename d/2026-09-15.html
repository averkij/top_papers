    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

                flag.addEventListener('click', () => {

                const titleSign = document.getElementById('doomgrad-icon');

            }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.15973', 'title': 'Discovery Foundation Models: Toward Open-Ended Discovery Intelligence', 'url': 'https://huggingface.co/papers/2609.15973', 'abstract': 'Abstract Discovery Foundation Models enable open-ended scientific discovery through iterative problem formulation, hypothesis testing, and evidence-based revision across dry and wet lab settings.  Generated by thinkingmachines/Inkling-Small Foundation models have progressed from learning and reasoning over existing knowledge, to increasingly learning through action, tool use, and outcome feedback. We argue that the next frontier is a further transition: from solving and acting within problems specified by humans to participating in the process by which new problems, representations, explanations, and knowledge are created. We refer to this capability as Discovery Intelligence. We formulate Discovery Foundation Models (DFMs) as general-purpose model systems for open-ended discovery. A DFM operates over a revisable research state and supports seven coupled capabilities spanning problem discovery, formulation, representation construction, hypothesis formation, intervention, evidence-grounded revision, and continual discovery improvement. We instantiate this framework with Zetema, which couples explicit research-state dynamics, verification and experimental gating, external grounding, and cross-task Discovery Skill evolution. We further ground the framework with GALILEO, a real therapeutic-discovery system in which Dry-Lab reasoning, robotic and hands-on Wet-Lab experimentation, external biological evidence, and iterative hypothesis and design revision form a closed physical discovery loop. We then formulate a unified approach to capability formation and process-centered evaluation, enabling discovery behavior to be trained, improved, and measured beyond final-answer performance. Together, these components establish discovery as a learnable, executable, and evaluable capability of foundation-model systems. We view this shift as a broader progression in intelligence scaling: from learning over existing knowledge, to learning from action outcomes, and ultimately to participating in the construction, testing, and revision of the structures through which new knowledge is discovered. Code: https://github.com/Gen-Verse/DFM-Plans', 'score': 11, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '8568e2d915b23cb5', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#training', '#science', '#agents', '#open_source', '#benchmark', '#robotics'], 'emoji': '🔬', 'ru': {'title': 'От решения задач к созданию новых научных знаний', 'desc': 'В этой работе представлены модели Discovery Foundation Models (DFM), которые выходят за пределы обычного решения задач и участвуют в формулировке новых научных проблем и создании знаний. DFM работают с пересматриваемым исследовательским состоянием и объединяют семь связанных способностей: обнаружение проблем, их формулировку, конструирование представлений, формирование гипотез, проведение экспериментов и эмпирическую проверку. Авторы реализуют этот подход через систему Zetema и физический пример GALILEO, которая замыкает цикл открытия, объединяя сухую лабораторию (рассуждения), влажную лабораторию (физические эксперименты с роботами) и итеративную проверку гипотез. Этот переход от пассивного обучения на известных данных к активному участию в создании новых научных знаний представляет новый уровень развития больших языковых моделей.'}, 'en': {'title': 'Empowering Discovery Through Intelligent Models', 'desc': 'This paper introduces Discovery Foundation Models (DFMs), which enhance scientific discovery by allowing models to engage in iterative problem formulation and hypothesis testing. DFMs are designed to operate over a revisable research state, supporting capabilities such as problem discovery, hypothesis formation, and evidence-based revision. The authors present Zetema, a framework that integrates various research dynamics and skills to facilitate continual discovery improvement. They also discuss GALILEO, a therapeutic-discovery system that combines reasoning and experimentation to create a closed-loop discovery process, emphasizing the evolution of intelligence from knowledge learning to active participation in knowledge creation.'}, 'zh': {'title': '发现基础模型：科学发现的新前沿', 'desc': '本论文介绍了发现基础模型（DFMs），它们能够通过迭代的问题制定、假设测试和基于证据的修订，促进开放式科学发现。DFMs具备七种能力，包括问题发现、假设形成和持续改进等，支持在干实验和湿实验环境中进行研究。我们提出的Zetema框架结合了研究状态动态、验证和实验门控，形成一个闭环的发现过程。通过GALILEO系统，我们展示了如何将干实验推理与湿实验结合，实现真实的治疗发现。'}}}, {'id': 'https://huggingface.co/papers/2609.14858', 'title': 'Dream-RSI: Recursive Self-Improvement through Evolving Worlds', 'url': 'https://huggingface.co/papers/2609.14858', 'abstract': 'Abstract Dream-RSI enables scalable recursive self-improvement by using historical discovery replay to evaluate exploration policies offline, reducing costly online evaluations.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement is becoming increasingly vital for autonomous AI agents, where progress hinges on discovering high-value solutions across complex domains. The driver of this process is effective exploration, however, managing and improving exploration strategies remains a major bottleneck. Current systems face a fundamental dilemma: fixed strategies fail to adapt as search spaces scale, while online policy optimization requires navigating vast meta-search spaces under delayed and expensive feedback over long-horizon rollouts. We introduce Dream-RSI, a framework for scalable and recursively self-improving exploration. A lightweight orchestration layer makes exploration explicit and programmable while leaving the underlying coding agent unchanged. Our key insight is that accumulated discovery history can serve as a replay simulator over the realized search space. By performing dreaming in the replay simulator constructed from historical discovery trees, Dream-RSI secures immediate, low-cost off-policy feedback to evaluate and refine exploration policies without invoking repetitive, expensive online evaluations. The improved policy is subsequently redeployed online to drive further discovery, continuously expanding the simulator pool in a self-improving loop. Across algorithm engineering, mathematical optimization, and GPU kernel engineering, Dream-RSI achieves competitive or improved discovery quality while substantially reducing discovery cost in several settings.', 'score': 10, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'ebaa307947b88fbe', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Самообучение через мечты о прошлых открытиях', 'desc': 'Dream-RSI — это框架 для масштабируемого рекурсивного самосовершенствования, который решает проблему оптимизации стратегий исследования в автономных AI агентах. Ключевая идея заключается в использовании истории прошлых открытий как симулятора для офлайн-оценки политик исследования, что позволяет избежать дорогостоящих онлайн-взаимодействий с окружением. Фреймворк реализует самоулучшающийся цикл: агент исследует пространство решений, накопленная история используется для обучения улучшенной политики, которая затем переразворачивается для дальнейших открытий. Метод демонстрирует конкурентные результаты в задачах оптимизации алгоритмов и GPU ядер при значительном снижении вычислительных затрат.'}, 'en': {'title': 'Dream-RSI: Revolutionizing Exploration with Historical Replay', 'desc': 'Dream-RSI is a framework designed to enhance the exploration capabilities of autonomous AI agents through recursive self-improvement. It utilizes historical discovery replay to evaluate exploration strategies offline, which minimizes the need for costly online evaluations. By leveraging accumulated discovery history as a replay simulator, Dream-RSI provides immediate feedback for refining exploration policies. This approach allows for continuous improvement and adaptation of exploration strategies, leading to better discovery outcomes at a lower cost.'}, 'zh': {'title': 'Dream-RSI：高效的自我改进探索框架', 'desc': 'Dream-RSI 是一种可扩展的递归自我改进框架，旨在通过历史发现重放来离线评估探索策略，从而减少昂贵的在线评估成本。该框架通过轻量级的协调层使探索过程变得明确和可编程，同时保持底层编码代理不变。Dream-RSI 的关键在于利用累积的发现历史作为重放模拟器，以便在实现的搜索空间中进行评估和优化探索策略。通过在重放模拟器中进行“梦境”操作，Dream-RSI 能够获得即时、低成本的离线反馈，从而不断改进探索策略。'}}}, {'id': 'https://huggingface.co/papers/2609.15128', 'title': 'Omni-Streaming Thinking', 'url': 'https://huggingface.co/papers/2609.15128', 'abstract': 'Abstract Omni-Streaming Thinking improves streaming omni-modal reasoning by deferring claims until cross-modal verification, reducing premature commitment and auditory hallucinations.  Generated by thinkingmachines/Inkling-Small Streaming omni-modal models must decide what and when to answer from the video chunks and synchronized audio observed so far. Visual cues often support an interpretation before an utterance or sound event is complete. If that interpretation enters memory as a fact, later reasoning can keep relaying it even after audio contradicts it. We call this failure premature cross-modal commitment. We propose Omni-Streaming Thinking (OST), which generates structured outputs that include evidence observed so far, forecasts of future evidence, and claims based on this evidence. Each claim is initially marked as pending and linked to a future verification interval. Audio and visual evidence are stored separately, and OST checks a claim against the evidence from the specified modality at the end of the verification interval. When contradictory evidence is detected, a refutation process reduces the influence of the claim and its dependent states, and then guides a state update using the new evidence. An answer gate decides whether the answer-critical claims meet the conditions for giving a response. Using a frozen Qwen3-Omni-30B-A3B-Instruct backbone with lightweight adaptation, OST outperforms the strongest open baselines on five streaming and audio-visual benchmarks by more than 10% relative on average. We also introduce OST-DiagBench, which holds video fixed and edits audio to test agreement, absence, contradiction, coexistence, and subtitle-speech conflict. OST reaches d-prime = 2.95, compared with at most 1.38 for open baselines, while reducing vision-induced auditory hallucinations.', 'score': 8, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'fd1ff77267d056d8', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#hallucinations', '#dataset', '#open_source', '#audio', '#multimodal', '#video', '#architecture', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Проверка перед поспешностью: потоковое многомодальное мышление с отложенной верификацией', 'desc': 'В статье предлагается метод Omni-Streaming Thinking для улучшения многомодального рассуждения на потоковых данных путём отложенной верификации утверждений. Основная проблема заключается в преждевременном закреплении информации из одной модальности (например, визуальной) в памяти, что приводит к галлюцинациям при поступлении противоречащей информации из другой модальности (например, аудио). Предложенный подход генерирует структурированные выходы с доказательствами, прогнозами и утверждениями, которые проверяются против кросс-модальных данных в специально определённых интервалах верификации. При обнаружении противоречий система запускает процесс опровержения и обновления состояния, что значительно снижает ошибки и галлюцинации в сравнении с существующими методами.'}, 'en': {'title': 'Deferring Claims for Better Omni-Modal Reasoning', 'desc': 'The paper introduces Omni-Streaming Thinking (OST), a method designed to enhance streaming omni-modal reasoning by delaying claims until they can be verified across different modalities, such as audio and video. This approach helps prevent premature cross-modal commitment, where an interpretation is incorrectly stored as a fact before all evidence is available. OST generates structured outputs that include current evidence, predictions for future evidence, and claims that are initially marked as pending until they can be verified. By separating audio and visual evidence and employing a refutation process for contradictory information, OST significantly improves performance on various benchmarks, reducing errors like auditory hallucinations.'}, 'zh': {'title': '全流式思维：提升多模态推理的准确性', 'desc': '本文提出了一种名为全流式思维（Omni-Streaming Thinking, OST）的方法，旨在改善流式多模态推理。OST通过推迟声明，直到进行跨模态验证，从而减少了过早承诺和听觉幻觉的发生。该方法生成结构化输出，包含已观察到的证据、未来证据的预测以及基于这些证据的声明。通过分开存储音频和视觉证据，OST能够在验证区间结束时检查声明的有效性，从而提高推理的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.13287', 'title': 'LLaDA-UI: Bringing Block-wise Diffusion to Vision-Language GUI Agents', 'url': 'https://huggingface.co/papers/2609.13287', 'abstract': 'Abstract A 16.7B-parameter mixture-of-experts diffusion vision-language agent achieves strong multimodal GUI performance while preserving block-parallel decoding efficiency.  Generated by thinkingmachines/Inkling-Small Diffusion large language models (dLLMs) achieve high decoding efficiency through block-parallel, arbitrary-order generation, making them attractive for latency-sensitive applications. GUI agents represent a natural testbed for this paradigm, as they must repeatedly perceive screen states and emit structured, spatially grounded actions in real time. However, whether dLLMs can be extended into capable multimodal GUI agents while preserving their parallel decoding advantage remains an open question. We present LLaDA-UI, a 16.7B-parameter MoE-based, block-wise diffusion vision-language GUI agent. LLaDA-UI follows a two-stage training pipeline: general multimodal pre-training aligns a native-resolution vision encoder with the LLaDA2.0-mini-base diffusion language backbone, followed by GUI-agent supervised fine-tuning on diverse mobile, desktop, web, and grounding data. Across widely adopted grounding benchmarks and navigation benchmarks spanning multiple platforms, LLaDA-UI substantially outperforms Qwen2.5-VL-7B and surpasses Qwen3-VL-8B on four of six reported GUI benchmarks. These results establish block-wise diffusion as a practical generative paradigm for multimodal GUI agents.', 'score': 5, 'issue_id': 3275, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '4dff4545a5b576fc', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#open_source', '#diffusion', '#multimodal', '#agents', '#architecture', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Диффузионный агент для управления интерфейсом с параллельным декодированием', 'desc': 'В статье представлена LLaDA-UI — мультимодальный агент для взаимодействия с графическим интерфейсом на базе 16.7B-параметрической смеси экспертов и диффузионной языковой модели. Модель использует блочно-параллельное декодирование, что позволяет генерировать действия с низкой задержкой, сохраняя при этом высокую эффективность. Обучение проходит в два этапа: предварительное выравнивание визуального энкодера с диффузионным языковым хребтом, а затем дообучение на задачах управления интерфейсом различных платформ. Экспериментально показано, что модель превосходит существующие решения на бенчмарках навигации и определения местоположения элементов интерфейса.'}, 'en': {'title': 'LLaDA-UI: Revolutionizing GUI Agents with Efficient Multimodal Learning', 'desc': 'This paper introduces LLaDA-UI, a 16.7 billion parameter mixture-of-experts (MoE) model designed for multimodal tasks involving vision and language. It utilizes a block-parallel decoding approach, which allows for efficient processing and real-time action generation in graphical user interface (GUI) applications. The model undergoes a two-stage training process, first aligning a vision encoder with a diffusion language model, and then fine-tuning on various GUI-related datasets. The results demonstrate that LLaDA-UI significantly outperforms existing models on multiple benchmarks, showcasing the effectiveness of block-wise diffusion in creating capable GUI agents.'}, 'zh': {'title': '块式扩散：多模态GUI代理的新突破', 'desc': '本文介绍了一种名为LLaDA-UI的16.7B参数的混合专家扩散视觉-语言代理，该代理在多模态图形用户界面（GUI）性能上表现出色，同时保持了块并行解码的高效性。通过块并行和任意顺序生成，大型语言模型（dLLMs）在延迟敏感的应用中具有很大的吸引力。LLaDA-UI采用两阶段训练流程，首先进行多模态预训练，然后在多种移动、桌面和网页数据上进行GUI代理的监督微调。实验结果表明，LLaDA-UI在多个基准测试中显著超越了其他模型，证明了块式扩散在多模态GUI代理中的实用性。'}}}, {'id': 'https://huggingface.co/papers/2609.15478', 'title': 'BVB: Benchmarking Agentic Video Understanding via Programmatic Reconstruction in Blender', 'url': 'https://huggingface.co/papers/2609.15478', 'abstract': 'Abstract A benchmark requiring agents to programmatically reconstruct real-world videos in Blender reveals that current models achieve high perceptual similarity but struggle to retain spatiotemporal facts.  Generated by thinkingmachines/Inkling-Small Multimodal agents can create complex videos in software such as Blender by coding without relying on diffusion models. Yet video understanding benchmarks still evaluate models mainly through question answering. If an agent truly understands a video, it can reconstruct it programmatically. We introduce BVB, Blender-VideoBench, a benchmark that tests this ability by asking agents to reconstruct real-world videos as animated Blender scenes. To ensure fair comparison, each agent programs the reconstruction through a lightweight harness, Mini-BVB, in an identical sandbox under a shared cost limit. The benchmark renders each reconstruction from its animated camera and evaluates it on two axes: (1) Dual VQA measures how many spatiotemporal facts the reconstruction preserves. (2) Latent Similarity measures how closely the reconstruction matches the source video perceptually. Our overall score, a square-root mean, favors balanced performance. We evaluate 51 configurations from 10 model families and analyze semantic retention, perceptual similarity, reasoning effort, and cost. The best model reaches 88.6 Latent Similarity but retains only 53.7% of the source-correct spatiotemporal answers. Additional reasoning improves visual similarity but does not close this gap in factual accuracy. In a blind study with 15 raters and five configurations, Latent Similarity correlates strongly with human preference. These results show that programmatic reconstruction is a viable test of agentic video understanding, and that semantic retention remains the main challenge.', 'score': 2, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '90bbad0010327b93', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#multimodal', '#agents', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'От восприятия к пониманию: тест на истинное понимание видео через программную реконструкцию', 'desc': 'В статье представлен новый benchmark BVB (Blender-VideoBench), который оценивает способность мультимодальных агентов понимать видео путём программной реконструкции сцен в Blender без использования диффузионных моделей. Тест измеряет два аспекта: сохранение пространственно-временных фактов (через Dual VQA) и перцептивную схожесть с исходным видео (через Latent Similarity). Анализ 51 конфигурации из 10 семейств моделей показал, что текущие подходы достигают высокой перцептивной схожести (до 88.6), но плохо сохраняют семантические факты (только 53.7% корректных ответов). Исследование демонстрирует, что программная реконструкция является эффективным методом оценки понимания видео агентами, и что сохранение семантической информации остаётся главной проблемой.'}, 'en': {'title': 'Reconstructing Reality: A New Benchmark for Video Understanding', 'desc': 'This paper introduces a new benchmark called Blender-VideoBench (BVB) to evaluate how well agents can reconstruct real-world videos in Blender. While current models can create visually similar videos, they often fail to accurately preserve the spatiotemporal facts of the original content. The benchmark assesses agents based on their ability to programmatically reconstruct videos, using metrics like Dual VQA for factual accuracy and Latent Similarity for perceptual resemblance. The findings highlight that while some models achieve high visual similarity, they struggle with maintaining the correct spatiotemporal information, indicating that semantic retention is a key challenge in video understanding.'}, 'zh': {'title': '程序化重建：视频理解的新标准', 'desc': '这篇论文介绍了一个新的基准测试，名为Blender-VideoBench（BVB），用于评估智能体在程序化重建真实世界视频的能力。尽管当前模型在视觉相似性上表现良好，但在保留时空事实方面仍然存在困难。通过使用轻量级的Mini-BVB工具，所有智能体在相同的环境中进行重建，以确保公平比较。研究结果表明，程序化重建是评估视频理解能力的有效方法，而语义保留仍然是主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.11638', 'title': 'Vidu S2: Real-Time Interactive, Editable, and Spatial Video Generation', 'url': 'https://huggingface.co/papers/2609.11638', 'abstract': 'Abstract Vidu S2 introduces real-time interactive avatar and video editing models that support high-resolution spatial video generation and dynamic reference updates.  Generated by thinkingmachines/Inkling-Small We present Vidu S2, which comprises Vidu S2-Avatar, a real-time interactive digital-character model, and Vidu S2-Editing, a real-time video editing model. Moreover, we explore the feasibility of real-time spatial video generation for both Vidu S2-Avatar and Vidu S2-Editing. Compared with Vidu S1, Vidu S2-Avatar supports real-time 720p video generation, generation with dynamic references that can be updated at any moment, and stronger instruction following, such as dancing. Vidu S2-Editing supports editing a video stream in real time, including style rendering, clothing replacement, character replacement, and background replacement. Experiments show that Vidu S2 outperforms all baselines. A playable online demo is available at https://vidu.com/vidu-stream.', 'score': 1, 'issue_id': 3275, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9d3e4b40c124a6e5', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#open_source', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Интерактивное видео в реальном времени: от создания аватаров до редактирования потоков', 'desc': 'Vidu S2 представляет собой систему генеративных моделей, включающую две компоненты: Vidu S2-Avatar для создания интерактивных цифровых аватаров в реальном времени и Vidu S2-Editing для редактирования видео потоков онлайн. Модели поддерживают генерацию пространственного видео высокого разрешения (720p) и позволяют обновлять эталонные изображения в любой момент времени. По сравнению с предыдущей версией, система обладает значительно улучшенной способностью следовать инструкциям пользователя и поддерживает различные операции редактирования: изменение стиля, замену одежды, замену персонажа и фона. Экспериментальные результаты демонстрируют превосходство Vidu S2 над всеми существующими аналогами.'}, 'en': {'title': 'Real-Time Video Magic with Vidu S2!', 'desc': 'Vidu S2 introduces advanced models for creating and editing videos with interactive avatars in real-time. The Vidu S2-Avatar model allows for high-resolution 720p video generation and can dynamically update references, enhancing user interaction and instruction following. Meanwhile, the Vidu S2-Editing model enables real-time video stream editing, including features like style rendering and character replacement. Overall, Vidu S2 demonstrates significant improvements over its predecessor, Vidu S1, in both avatar generation and video editing capabilities.'}, 'zh': {'title': '实时互动与视频编辑的未来', 'desc': 'Vidu S2 是一种实时互动的虚拟角色和视频编辑模型，支持高分辨率空间视频生成和动态参考更新。它包括 Vidu S2-Avatar 和 Vidu S2-Editing 两个部分，前者是实时互动的数字角色模型，后者是实时视频编辑模型。与 Vidu S1 相比，Vidu S2-Avatar 支持实时720p视频生成，并能够在任何时刻更新动态参考，且指令执行能力更强，例如可以跳舞。Vidu S2-Editing 则支持实时编辑视频流，包括风格渲染、服装替换、角色替换和背景替换，实验结果表明 Vidu S2 的性能优于所有基线模型。'}}}, {'id': 'https://huggingface.co/papers/2609.13318', 'title': 'Attention-DP3: Spatially Object-aware 3D Diffusion Policy via Geometry-aligned Attentional Conditioning', 'url': 'https://huggingface.co/papers/2609.13318', 'abstract': 'Abstract Attention-DP3 improves 3D diffusion policies by injecting object-level geometric cues via attention to stabilize performance under heavy clutter.  Generated by thinkingmachines/Inkling-Small 3D point-cloud observations are inherently ambiguous in complex, cluttered manipulation scenes, where target objects may be partially occluded or tightly intermingled with visually similar distractors. As a result, standard 3D diffusion policies often struggle to localize and exploit task-relevant geometry as scene complexity grows. We propose Attention-DP3, a spatially object-aware 3D diffusion policy that injects object-level geometric cues via attention while keeping the DP3 diffusion backbone unchanged. Our pipeline performs open-vocabulary 2D segmentation on RGB images, then lifts predicted target masks into 3D using calibrated camera geometry to obtain object-centric geometric priors. We incorporate these cues through Tri-field Attentional Conditioning, which constructs three complementary fields: (i) a targetness field to anchor the target object, (ii) an intra-target saliency field to emphasize task-relevant geometry within the target, and (iii) a backgroundness field to suppress distractors and clutter. Experiments on Adroit, DexArt, MetaWorld, and the real-world SO101 platform show consistent improvements over DP3, achieving state-of-the-art performance across benchmarks. Notably, as distractor objects increase, DP3 drops sharply, whereas Attention-DP3 remains stable and outperforms DP3 by up to 31\\% under heavy clutter. The code is publicly available at https://github.com/zhangzhongbo2213/Attention-DP3.', 'score': 1, 'issue_id': 3275, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': 'e5d908701ad57dfa', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#diffusion', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Внимание к объектам — ключ к стабильности диффузионных политик в хаотичных сценах', 'desc': 'Статья представляет Attention-DP3 — улучшенный метод для 3D политик диффузии в задачах манипуляции роботов. Основная идея заключается в использовании внимания (attention) для внедрения геометрических признаков на уровне объектов, что помогает модели лучше фокусироваться на целевых объектах в сложных сценах с частичной окклюзией и визуально похожими отвлекающими элементами. Метод использует открытый словарь для 2D сегментации RGB-изображений и затем преобразует полученные маски в 3D пространство с помощью калибровки камеры. Авторы вводят три дополняющих поля внимания: поле целевого объекта, поле значимости внутри целевого объекта и поле фона для подавления помех, что обеспечивает стабильную работу даже в условиях сильной загруженности сцены.'}, 'en': {'title': 'Enhancing 3D Diffusion with Attention for Cluttered Environments', 'desc': 'Attention-DP3 is a novel 3D diffusion policy that enhances performance in cluttered environments by integrating object-level geometric information through an attention mechanism. Traditional 3D diffusion methods struggle with occluded or similar-looking objects, leading to localization challenges. This approach utilizes open-vocabulary 2D segmentation to create 3D object masks, which are then used to inform the diffusion process. By employing Tri-field Attentional Conditioning, Attention-DP3 effectively distinguishes target objects from distractors, resulting in significant performance improvements in complex scenes.'}, 'zh': {'title': 'Attention-DP3：在复杂环境中稳定3D扩散策略的创新', 'desc': 'Attention-DP3是一种改进的3D扩散策略，通过注意力机制注入物体级几何线索，以在复杂环境中稳定性能。该方法解决了在目标物体被遮挡或与相似干扰物混合时，标准3D扩散策略难以定位和利用任务相关几何信息的问题。Attention-DP3保持DP3扩散框架不变，采用开放词汇的2D分割技术，将预测的目标掩膜提升到3D空间，获取物体中心的几何先验。实验结果表明，Attention-DP3在多个基准测试中表现优异，尤其在干扰物增加时，性能显著优于传统的DP3。'}}}];

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (3)', '#agi', '#alignment', '#architecture (2)', '#audio (1)', '#benchmark (4)', '#cv', '#data', '#dataset (1)', '#diffusion (2)', '#ethics', '#games', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (1)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (4)', '#open_source (5)', '#optimization', '#plp', '#rag', '#reasoning (2)', '#rl', '#rlhf', '#robotics (1)', '#science (1)', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (1)', '#transfer_learning', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-15 02:38',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-15 02:38')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-15 02:38')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
