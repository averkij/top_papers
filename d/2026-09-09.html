    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.08183', 'title': 'NeoHorse-1: Towards Recursive Self-Improvement via Agentic Post-Training with Routing Harness', 'url': 'https://huggingface.co/papers/2609.08183', 'abstract': 'Abstract NeoHorse-1 uses agentic post-training with intelligent routing, structured feedback loops, and curriculum-based distillation to improve model capabilities across agent benchmarks.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement (RSI) requires a concrete mechanism through which an AI system observes its capabilities and converts that evidence into the next round of learning. We present NeoHorse-1, a family of agent-native models developed to explore this path through agentic post-training. Our system combines a heterogeneous model pool with intelligent routing, recording the predicted capability demand, selected service tier, and subsequent interaction for each user turn. These records are converted into training examples that preserve interleaved reasoning, tool calls, and harness context, and are admitted through structural validation, six-dimensional semantic evaluation, and subscene-level labeling. Routing signals organize supervised fine-tuning into a three-stage curriculum and extend to routing-guided on-policy distillation, where a teacher supervises student-generated responses under the same progression. Capability-guided allocation then converts evaluation feedback into the next training mixture, closing an evaluation-selection-update loop in which what the system learns to do shapes what it learns from next. Across eleven benchmarks covering harness-based agents, tool use, coding, and instruction following, post-training raises the macro-average from 58.94 to 64.87 at 4B and from 65.60 to 69.04 at 9B, substantially narrowing the aggregate gap between the post-trained 4B model and the 9B base model. NeoHorse-1 provides an initial prototype of this feedback-driven process and a path toward harness-mediated RSI across successive iterations.', 'score': 314, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '1bd9fd7f78b3658e', 'pdf_title_img': 'assets/pdf/title_img/2609.08183.jpg', 'data': {'categories': ['#training', '#small_models', '#agents', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Самоулучшение через循环 обратной связи и интеллектуальную маршрутизацию', 'desc': 'В работе представлена NeoHorse-1 — семейство моделей-агентов, которые используют постобучение с интеллектуальной маршрутизацией и структурированными циклами обратной связи для улучшения способностей модели. Система комбинирует несколько моделей разных размеров с умной маршрутизацией, собирая данные о предсказанных потребностях, выборе уровня обслуживания и взаимодействиях пользователей для создания примеров обучения. Собранные данные проходят структурную валидацию и семантическую оценку, а затем используются в трёхэтапном учебном плане для контролируемой дотренировки и дистилляции моделей. Система создаёт замкнутый цикл обратной связи, где оценка результатов определяет следующие примеры для обучения, что позволяет моделям размером 4B и 9B значительно улучшить производительность на тестах агентов и работе с инструментами.'}, 'en': {'title': 'Empowering AI with Feedback-Driven Learning', 'desc': 'NeoHorse-1 is a machine learning model that enhances its performance through a method called agentic post-training. This approach uses intelligent routing and structured feedback loops to create a learning environment where the model can observe its own capabilities and improve over time. By combining different models and organizing training into a curriculum, NeoHorse-1 effectively learns from user interactions and feedback. The results show significant improvements in performance across various benchmarks, demonstrating the effectiveness of this feedback-driven learning process.'}, 'zh': {'title': '通过反馈驱动提升模型能力的创新方法', 'desc': 'NeoHorse-1 是一种通过智能路由、结构化反馈循环和基于课程的蒸馏来提升模型能力的代理后训练方法。该系统结合了异构模型池和智能路由，记录用户交互中的预测能力需求和选择的服务层级。这些记录被转化为训练示例，保留了交错推理和工具调用的上下文信息。通过这种反馈驱动的过程，NeoHorse-1 在多个基准测试中显著提高了模型的性能，缩小了不同规模模型之间的能力差距。'}}}, {'id': 'https://huggingface.co/papers/2609.08936', 'title': 'AuK Technical Report: An Open-Source Foundational Model for Speech Generation and Editing', 'url': 'https://huggingface.co/papers/2609.08936', 'abstract': 'Abstract AuK is an open-source foundational model that unifies speech generation and editing via natural-language instructions and audio context, using a multimodal language model, joint VAE, hybrid rectified-flow Transformer, and efficient distillation for fast inference.  Generated by thinkingmachines/Inkling-Small We introduce AuK, an open-source foundational model that unifies speech generation and editing through a common interface of natural-language instructions and audio context. To support this broad capability set, we construct approximately 3.03 billion instruction--audio instances and 1.95 million hours of effective supervision across five task families: speech generation, content editing, enhancement and separation, paralinguistic editing, and acoustic editing. AuK combines a multimodal large language model for semantic conditioning, an VAE jointly trained on speech, general audio, and music for acoustic conditioning, and a hybrid rectified-flow Transformer that performs dual-stream MMDiT blocks followed by unified single-stream DiT blocks for generation. Training begins with generation-only warm-up and proceeds to joint generation--editing pre-training. We then apply complementary post-training strategies: human-feedback preference optimization for open-ended editing and reward-based reinforcement learning for speech generation. To reduce inference cost, we further distill the model with consistency initialization and task-routed Decoupled DMD. The resulting AuK-Flash performs 4-step inference without classifier-free guidance and achieves a 4.5 wall-clock speedup over the full model under matched conditions. Experiments demonstrate leading performance on zero-shot and instruction-controlled speech generation and general instruction-guided editing, while remaining competitive on signal-level restoration tasks. We release both the source code and model weights to support reproducibility and further research.', 'score': 152, 'issue_id': 3244, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '6128afd94f8fddfe', 'pdf_title_img': 'assets/pdf/title_img/2609.08936.jpg', 'data': {'categories': ['#open_source', '#rlhf', '#dataset', '#rl', '#inference', '#architecture', '#optimization', '#training', '#audio', '#multimodal'], 'emoji': '🎵', 'ru': {'title': 'Единый интерфейс для генерации и редактирования речи через естественный язык', 'desc': 'AuK — это фундаментальная модель, которая объединяет генерацию и редактирование речи через единый интерфейс естественных языковых инструкций и аудиоконтекста. Модель сочетает мультимодальный большой языковый модель для семантического кондиционирования, совместно обученный VAE для акустического кондиционирования и гибридный выпрямленный поток Трансформера с двойным потоком MMDiT блоков. Авторы собрали 3.03 миллиарда примеров инструкция-аудио и применили комплексные стратегии постобучения, включая оптимизацию предпочтений по обратной связи от человека и обучение с подкреплением на основе награды. Для ускорения инференса модель была дистиллирована, что позволило версии AuK-Flash добиться 4.5-кратного ускорения без использования безклассификаторного руководства.'}, 'en': {'title': 'Unifying Speech Generation and Editing with AuK', 'desc': 'AuK is a foundational model designed for both generating and editing speech using natural language instructions and audio context. It utilizes a multimodal language model and a joint Variational Autoencoder (VAE) to effectively handle various audio tasks, including speech generation and content editing. The model is trained on a vast dataset, allowing it to perform well in zero-shot scenarios and instruction-guided tasks. Additionally, AuK-Flash, a distilled version of the model, significantly speeds up inference while maintaining competitive performance in audio restoration tasks.'}, 'zh': {'title': 'AuK：统一语音生成与编辑的开源模型', 'desc': 'AuK是一个开源的基础模型，能够通过自然语言指令和音频上下文统一语音生成和编辑。它结合了多模态语言模型、联合变分自编码器（VAE）和混合修正流Transformer，以实现快速推理。AuK的训练数据包括约30.3亿个指令-音频实例和195万小时的有效监督，涵盖了语音生成、内容编辑、增强与分离等五个任务领域。通过人类反馈优化和基于奖励的强化学习，AuK在零样本和指令控制的语音生成方面表现出色，同时在信号级恢复任务中也保持竞争力。'}}}, {'id': 'https://huggingface.co/papers/2609.08977', 'title': 'Omni Interaction Agent Technical Report', 'url': 'https://huggingface.co/papers/2609.08977', 'abstract': 'Abstract Gander is an end-to-end framework that integrates continuous multi-modal streaming, real-time full-duplex interaction, and agentic reasoning through a Cerebellum-Brain architecture and a chunk-level token stream design.  Generated by thinkingmachines/Inkling-Small In this work, we present Gander, an end-to-end model that unifies omni perception, realtime interaction, and agentic capabilities within a single framework. In contrast to turn-based conventional paradigms, Gander continuously receives streaming inputs across multiple modalities, including video, speech, and text, enabling natural full-duplex interaction in both everyday conversations and complex workflow-oriented agent scenarios. Users can interrupt the model at any time, while the model can also proactively provide intermediate feedback or ask follow up questions. To natively support these capabilities, Gander adopts two key architectural designs: 1) It employs a Cerebellum-Brain collaborative framework, in which the Cerebellum is responsible for realtime interaction and omni conversational capabilities, while the Brain handles complex reasoning and higher-level agentic tasks. The two components interact continuously through tool calling and the agent orchestration runtime. 2) The Cerebellum is built upon a streaming Thinker-Talker architecture, user inputs and model outputs are further flattened into an ordered token stream at the chunk level, providing a unified representation for low latency, continuous interaction. We conduct comprehensive evaluations of Gander across four dimensions: conversational ability, omni understanding, interactive capability, and agentic intelligence. Internal human evaluations demonstrate that Gander maintains the natural and expressive spoken dialogue capabilities of SOTA open source models while achieving competitive performance in omni interaction. Gander also demonstrates robustness in challenging real-world scenarios, including background noise interference, multi-party interactions, and backchannel communication. We release Gander together with its models, code, and data to facilitate further research and development in the community.', 'score': 99, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'c31ec7143b9e0b94', 'authors': ['Orantqing', 'Shengpeng Ji', 'Junlong Tong', 'Jialong Zuo', 'Dongjie Fu', 'Di Cao', 'Yangzhuo Li', 'Shangda Wu', 'Franz', 'Evan', 'Theron Veyra', 'Changhao Pan', 'Jingyu Lu', 'Dongchao Yang', 'Zhifei Xie', 'Yang Tan', 'Xiaoyu Shen', 'Xiaoda Yang', 'Wenfu Wang', 'Teddysun', 'Steveyves', 'Zhou Zhao', 'Bryanytian'], 'affiliations': ['Hunyuan Speech Team, Tencent', 'Nanyang Technological University', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.08977.jpg', 'data': {'categories': ['#video', '#architecture', '#audio', '#multimodal', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Непрерывный диалог: агент с потоковой архитектурой мозга и мозжечка', 'desc': 'Gander — это сквозная архитектура, которая объединяет непрерывную обработку мультимодальных потоков данных, real-time полнодуплексное взаимодействие и агентное рассуждение в единую систему. Модель использует инновационную архитектуру Cerebellum-Brain, где Cerebellum отвечает за реал-тайм взаимодействие и разговорные способности, а Brain решает сложные задачи рассуждения и агентного управления. Входные данные пользователя и выходы модели представляются как объединённый поток токенов на уровне чанков, обеспечивая низкую задержку и естественное взаимодействие. Система поддерживает многомодальные входы (видео, речь, текст), позволяет пользователю прерывать диалог в любой момент и демонстрирует устойчивость к шумам и сложным сценариям взаимодействия.'}, 'en': {'title': 'Gander: Revolutionizing Real-Time Multi-Modal Interaction', 'desc': 'Gander is an innovative framework that combines continuous multi-modal input processing with real-time interaction and advanced reasoning capabilities. It utilizes a unique Cerebellum-Brain architecture, where the Cerebellum focuses on immediate conversational tasks while the Brain manages complex reasoning. This design allows Gander to engage in natural, full-duplex conversations, enabling users to interrupt and receive feedback seamlessly. Comprehensive evaluations show that Gander excels in conversational ability, omni understanding, and interactive intelligence, even in challenging environments.'}, 'zh': {'title': 'Gander：实时多模态交互的新纪元', 'desc': 'Gander是一个端到端的框架，结合了连续的多模态流媒体、实时双向交互和智能推理。与传统的基于回合的模型不同，Gander能够持续接收视频、语音和文本等多种输入，实现自然的双向对话。它采用小脑-大脑架构，其中小脑负责实时交互，而大脑处理复杂推理任务。Gander在对话能力、全方位理解、交互能力和智能表现等方面进行了全面评估，展现出在复杂场景中的鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2609.08798', 'title': 'Eliciting Weak-to-Strong Generalization with On-Policy Reverse Distillation', 'url': 'https://huggingface.co/papers/2609.08798', 'abstract': "Abstract On-Policy Reverse Distillation enables stronger models to exceed weak supervisors by amplifying verifier-supported policy gradients along the teacher's shift direction, accelerating optimization without imposing capacity limits.  Generated by thinkingmachines/Inkling-Small Weak-to-strong generalization asks whether stronger models can learn from weaker supervisors and surpass them. This question is particularly important for successive model generations and multi-domain consolidation, where repeating frontier-scale post-training from scratch can be prohibitively expensive. Yet conventional distillation treats the weak teacher as an optimization target, potentially imposing its capacity ceiling on the student. We introduce On-Policy Reverse Distillation (OPRD), which evaluates the teacher's policy shift relative to its reference policy on student rollouts and amplifies the component of the student's verifier-driven policy gradient along that direction. By rescaling only verifier-supported updates, OPRD preserves the stationary points of policy optimization while accelerating learning beyond the teacher. In both successive model transfer and multi-teacher distillation, OPRD achieves higher performance with fewer student updates than existing RL and distillation approaches. Response-style analysis shows that OPRD students remain closer to models trained with verifier-based RL alone than to their weak teachers, suggesting that teacher guidance accelerates rather than redirects the student's own optimization. Results in conventional strong-to-weak distillation further demonstrate that OPRD effectively combines verifier-driven policy optimization with teacher guidance regardless of capacity ordering.", 'score': 78, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '697a94b3d2391bee', 'authors': ['Youngrok Park', 'Sangmin Bae', 'Hojung Jung', 'Jongwoo Ko', 'Yunseon Choi', 'Young Jin Kim', 'Pashmina Cameron', 'Aaron Courville', 'Se-Young Yun'], 'affiliations': ['CIFAR AI Chair', 'KAIST AI', 'Microsoft', 'Mila', 'University of Toronto', 'Université de Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2609.08798.jpg', 'data': {'categories': ['#training', '#rl'], 'emoji': '🚀', 'ru': {'title': 'От слабого учителя к сильному ученику: ускоренная дистилляция через усиление градиентов верификатора', 'desc': 'В этой работе предлагается метод обратной дистилляции с обучением по текущей политике (OPRD), который позволяет более сильным моделям превосходить слабых учителей. Ключевая идея состоит в том, чтобы оценивать сдвиг политики учителя относительно его исходной политики и усиливать компонент градиента политики ученика, поддерживаемый верификатором, в направлении этого сдвига. Метод сохраняет стационарные точки оптимизации политики, одновременно ускоряя обучение сверх уровня учителя. Эксперименты показывают, что OPRD достигает более высокой производительности при меньшем количестве обновлений студента по сравнению с существующими подходами на основе обучения с подкреплением и дистилляции.'}, 'en': {'title': 'Empowering Strong Models with Weak Teachers', 'desc': "On-Policy Reverse Distillation (OPRD) is a novel approach in machine learning that allows stronger models to learn from weaker supervisors without being limited by the weaker model's capacity. It enhances the learning process by amplifying the policy gradients that are supported by a verifier, which helps the student model to optimize more effectively. This method is particularly useful in scenarios where training from scratch is costly, such as in successive model generations and multi-domain tasks. OPRD has been shown to achieve better performance with fewer updates compared to traditional reinforcement learning and distillation methods, indicating that it leverages teacher guidance to accelerate the student's learning process."}, 'zh': {'title': '超越弱监督，提升模型学习能力', 'desc': '本文提出了一种新的方法，称为在线反向蒸馏（On-Policy Reverse Distillation, OPRD），旨在帮助强模型从弱监督者中学习并超越它们。OPRD通过放大验证者支持的策略梯度，沿着教师的策略变化方向加速优化，而不限制模型的容量。与传统的蒸馏方法不同，OPRD不将弱教师视为优化目标，而是评估教师策略相对于参考策略的变化，从而保持策略优化的稳定性。实验结果表明，OPRD在模型迁移和多教师蒸馏中，能够以更少的学生更新实现更高的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.06055', 'title': 'DriveZero: End-to-End Driving Beyond Human Demonstrations', 'url': 'https://huggingface.co/papers/2609.06055', 'abstract': 'Abstract DriveZero is an end-to-end autonomous driving system that combines a vision foundation model for perception with a closed-loop reinforcement learning action model to learn driving behaviors beyond human demonstrations.  Generated by thinkingmachines/Inkling-Small Most end-to-end autonomous-driving systems learn by imitating human driving logs, leaving their learned behavior constrained by the quality and behavioral coverage of the recorded trajectories. This report presents DriveZero, an end-to-end system that learns driving behavior beyond human demonstrations. It decomposes driving into a perception model and an action model, pretrains each in the regime best suited to it, and combines them into one end-to-end planner. The two models call for different learning recipes: perception must understand the world, and benefits from massive and diverse visual data; action must interact with it, and requires closed-loop feedback. On the action side, we introduce DriveRL, a mixed-agent closed-loop reinforcement-learning framework. It converts real driving logs into interactive worlds, where a privileged teacher policy is trained with PPO through closed-loop rollouts. For the perception model, DriveVFM consolidates multiple frozen vision foundation models, including DINOv3, SigLIP2, SAM and Depth Anything V2, into a single backbone from raw images alone, requiring no task-specific annotations. DriveZero then unifies the two: a camera-only planner that distills the frozen DriveRL teacher through its rolled-out trajectories. The goal-conditioned teacher can moreover be queried under augmented driving intents, yielding diverse, goal-consistent supervision that logged data cannot provide. On nuPlan, DriveRL with value-guided test-time action search achieves a mean score of 93.57 across the Val14, Test14-hard, and Test14-random community splits in both non-reactive and reactive modes, exceeding the Log-Replay expert on all three splits. DriveZero achieves state-of-the-art performance on NAVSIMv1, NAVSIMv2 and the closed-loop HUGSIM benchmark without any human trajectory supervision.', 'score': 50, 'issue_id': 3243, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': 'c691922ea59a39c7', 'authors': ['Hao He', 'Chengcheng Hu', 'Zirun Su', 'Heng Zhang', 'Haisong Liu', 'Jinke Li', 'Haochen Tian', 'Zhenwei Shen', 'Hongyang Li', 'Zhichao Li', 'Yunchen Yang', 'Bochao Huang', 'Siyu Zhang', 'Kuangye Chen', 'Xiongjie Zhang', 'Wentao Dai', 'Hengchen Dai', 'Siyuan Liu', 'Zehao Huang', 'Naiyan Wang'], 'affiliations': ['AD & Robotics, L3 Team'], 'pdf_title_img': 'assets/pdf/title_img/2609.06055.jpg', 'data': {'categories': ['#rlhf', '#training', '#rl', '#multimodal', '#cv'], 'emoji': '🚗', 'ru': {'title': 'Автономное вождение за пределами человеческих примеров', 'desc': 'DriveZero — это система автономного вождения, которая объединяет визуальную foundation model для восприятия окружения с моделью действий, обученной через reinforcement learning. В отличие от традиционных подходов, которые копируют поведение из логов человеческого вождения, система обучается выходить за рамки этих демонстраций через взаимодействие с интерактивной средой. Авторы используют компонент DriveRL —框架обучения с подкреплением в замкнутом цикле, где привилегированная учительская политика обучается на основе реальных логов вождения. DriveVFM объединяет несколько замороженных vision foundation models в единый backbone, что позволяет системе достигать лучших результатов на бенчмарках без необходимости в аннотированных данных.'}, 'en': {'title': 'DriveZero: Beyond Imitation in Autonomous Driving', 'desc': 'DriveZero is an innovative autonomous driving system that integrates a vision foundation model for perception with a reinforcement learning action model to enhance driving behaviors beyond what humans can demonstrate. Unlike traditional systems that rely solely on human driving logs, DriveZero utilizes a dual approach: a perception model that learns from vast visual data and an action model that learns through interactive feedback. The action model, called DriveRL, employs a closed-loop reinforcement learning framework to create simulated driving environments, allowing for advanced training with a privileged teacher policy. This combination enables DriveZero to achieve superior performance on various benchmarks without needing human trajectory supervision, showcasing its ability to generalize and adapt to diverse driving scenarios.'}, 'zh': {'title': '超越人类示范的自动驾驶新纪元', 'desc': 'DriveZero 是一个端到端的自动驾驶系统，它结合了视觉基础模型用于感知和闭环强化学习动作模型来学习超越人类示范的驾驶行为。与传统的自动驾驶系统依赖人类驾驶日志不同，DriveZero 通过将驾驶分解为感知模型和动作模型，分别进行预训练，从而实现更灵活的学习。感知模型需要理解世界，依赖大量多样的视觉数据，而动作模型则需要与环境互动，并依赖闭环反馈。最终，DriveZero 在多个基准测试中表现出色，达到了最先进的性能，且无需任何人类轨迹监督。'}}}, {'id': 'https://huggingface.co/papers/2609.07398', 'title': 'OpenWAM: An Open, Modular Exploration Towards Systematic World-Action Model Pretraining', 'url': 'https://huggingface.co/papers/2609.07398', 'abstract': 'Abstract OpenWAM factorizes world-action pretraining into modular components to identify key design principles, yielding a scalable open model with strong simulation and real-robot performance.  Generated by thinkingmachines/Inkling-Small World-Action Models inherit world knowledge from video-generative priors, and channel it into executable control signals through embodied experience. Existing systems, however, are monolithic: the generative backbone, visual representation, architecture, information flow, inference procedure, and training data are tightly coupled, obscuring which design choices matter and why. We introduce OpenWAM, an open research stack that turns world-action pretraining into a controlled experimental program. OpenWAM-Infra factorizes the WAM design space into composable modules with unified training, inference, deployment, and evaluation. On this substrate, OpenWAM-Study examines three questions through controlled experiments: what to inherit, how world and action learning interact, and how their synergy scales; and distills three principles: upstream knowledge transfers through a sufficiently capable generative backbone and a compact, information-rich latent space; world-action synergy requires dedicated action capacity, explicit world-to-action information flow, and synchronized joint denoising; and embodied pretraining principally improves out-of-domain generalization, with one-stage co-training over egocentric and robot data integrating world coverage and action grounding. Composing these principles, we build OpenWAM-α, an open WAM pretrained on roughly 6,400 hours of egocentric human and robot data and evaluated across simulation and real-world benchmarks. Across the eight simulation benchmarks and the real-robot experiments, which together span embodiments from single-arm and bimanual manipulation to dexterous hands, OpenWAM-α delivers consistently excellent performance, sustaining its top-tier standing from simulation to the physical world. We release the full stack, including infrastructure, evaluation protocols, pretrained models, and data recipes, to facilitate future research.', 'score': 47, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'c38fca96000713a7', 'authors': ['Yuran Wang', 'Siqiao Huang', 'Mingleyang Li', 'Chenhao Zhang', 'Jiaqi Liang', 'Weiyang Jin', 'Yue Chen', 'Xuemin Chi', 'Donghao Zhou', 'Qize Yu', 'Yu-Kai Wang', 'Yuhan Rui', 'Shenzhe Yao', 'Zhen Yuan', 'Zhenhao Shen', 'Kefei Zhu', 'Zijie Zhu', 'Ning Gao', 'Xiaowei Chi', 'Guanqi He', 'Shanghang Zhang', 'Hao Dong', 'Lin Shao', 'Hang Zhao'], 'affiliations': ['National University of Singapore', 'Peking University', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'The University of Hong Kong', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07398.jpg', 'data': {'categories': ['#open_source', '#transfer_learning', '#training', '#benchmark', '#video', '#dataset', '#architecture', '#optimization', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Модульная факторизация как ключ к масштабируемым и универсальным мировым моделям для роботов', 'desc': 'OpenWAM — это открытая研究платформа, которая разбивает обучение мировых моделей с действиями на модульные компоненты для понимания ключевых принципов проектирования. Авторы систематически исследуют, какие знания переносятся от видеогенеративных моделей, как взаимодействуют обучение мировой модели и управления, и как их синергия масштабируется. Основные выводы показывают, что эффективный трансфер требует мощной генеративной основы, компактного латентного пространства, отдельной ёмкости для действий и синхронного совместного обучения на эгоцентрических и робототехнических данных. Претренированная модель OpenWAM-α демонстрирует консистентно высокую производительность как в симуляции, так и на реальных роботах с различными типами манипуляторов.'}, 'en': {'title': 'Modular Learning for Superior Action Performance', 'desc': 'OpenWAM is a modular framework for world-action pretraining that enhances the design and performance of machine learning models in both simulations and real-world applications. It separates the components of the model, allowing researchers to understand the impact of different design choices on performance. The framework includes OpenWAM-Infra, which organizes the design space into manageable modules, and OpenWAM-Study, which conducts experiments to identify key principles for effective learning. The resulting model, OpenWAM-α, demonstrates superior performance across various tasks, showcasing the benefits of its structured approach to integrating world knowledge and action capabilities.'}, 'zh': {'title': '开放式世界-动作预训练的未来', 'desc': 'OpenWAM 是一种将世界-动作预训练分解为模块化组件的系统，旨在识别关键设计原则，从而实现可扩展的开放模型，具有强大的仿真和真实机器人性能。该系统通过视频生成先验继承世界知识，并通过具身经验将其转化为可执行的控制信号。与现有的单一系统不同，OpenWAM 通过可组合模块化设计，提供统一的训练、推理、部署和评估流程。我们构建的 OpenWAM-α 在约6400小时的人类和机器人数据上进行预训练，并在多个仿真和真实世界基准测试中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.05588', 'title': 'GE-Act 2.0: Pretraining and Scaling a World-Action Model for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2609.05588', 'abstract': 'Abstract GE-Act 2.0 is a world-action model trained from scratch with a control-oriented autoencoder, single-step visual planner, and inverse dynamics model, using knowledge-aligned selective optimization to enable scalable zero-shot robot manipulation across diverse skills and conditions.  Generated by thinkingmachines/Inkling-Small World-action models (WAM) predict future states to guide robot actions, enabling learning from both action-free video and action-labeled interaction. Most inherit pretrained video generators, leaving WAM pretraining and scaling underexplored. We introduce Genie Envisioner Act 2.0 (GE-Act 2.0), a world-action model whose trainable generative and action components are all initialized from scratch on manipulation data. It combines a control-oriented autoencoder (CoAE), a single-step visual planner (SVP), and an inverse dynamics model (IDM). CoAE retains action- and instruction-relevant information under aggressive compression, while SVP produces a complete future state in one differentiable pass, so visual planning and inverse dynamics can be pretrained separately on complementary data. The components are then jointly trained with knowledge-aligned selective optimization (KASO), which reduces mismatched supervision by selecting only predicted futures judged behaviorally compatible with the recorded action. We evaluate pretrained checkpoints directly, without per-task fine-tuning, on 100 tasks across 20 manipulation skill groups with held-out scenes, backgrounds, lighting, and object instances. Scaling co-training data from 300 to 30,000 hours raises success from 17.1% to 44.1% on G1-OP and from 13.4% to 31.1% on G2-90D; despite comprising less than 2% of the co-training data, G2-90D improves by 17.7 points, suggesting cross-embodiment transfer. Gains span 19/20 and 18/20 skill groups, and skill-specific coverage strongly correlates with zero-shot out-of-distribution (OOD) success (Pearson r=0.80; Spearman rho=0.85). Under the same protocol, the model grounds object, color, shape, and position references in at least 90% of trials and follows explicit instructions even when they conflict with an already-committed behavior or a conventional scene association.', 'score': 45, 'issue_id': 3243, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '7405fe2f375e4446', 'pdf_title_img': 'assets/pdf/title_img/2609.05588.jpg', 'data': {'categories': ['#training', '#architecture', '#multimodal', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'От нулевого обучения к универсальному роботу через управляемое предсказание будущего', 'desc': 'GE-Act 2.0 — это модель мира и действий для управления роботом, обученная с нуля на основе управляемого автокодировщика, однопроходного визуального планировщика и модели обратной динамики. Ключевой инновацией является метод Knowledge-Aligned Selective Optimization (KASO), который отбирает только те предсказанные будущие состояния, которые поведенчески совместимы с записанными действиями, устраняя конфликты в обучающих данных. Модель демонстрирует масштабируемость: увеличение данных с 300 до 30 000 часов повысило успешность манипуляций с 17.1% до 44.1%. Без специальной доподготовки на конкретных задачах модель успешно решает 100 задач из 20 групп навыков манипулирования с высокой обобщаемостью на новые сцены и объекты.'}, 'en': {'title': 'Empowering Robots with Zero-Shot Manipulation Skills', 'desc': "GE-Act 2.0 is a novel world-action model designed for robot manipulation, utilizing a control-oriented autoencoder, a single-step visual planner, and an inverse dynamics model. This model is trained from scratch, allowing it to learn from both action-free videos and labeled interactions, which enhances its ability to predict future states and guide robot actions. The training process employs knowledge-aligned selective optimization to improve performance across various tasks without needing fine-tuning for each specific task. The results show significant improvements in task success rates, demonstrating the model's effectiveness in zero-shot scenarios and its ability to generalize across different manipulation skills and conditions."}, 'zh': {'title': 'GE-Act 2.0：零-shot 机器人操作的新突破', 'desc': 'GE-Act 2.0 是一种从零开始训练的世界行动模型，结合了控制导向的自编码器、单步视觉规划器和逆动力学模型。该模型通过知识对齐选择优化，使机器人能够在多种技能和条件下进行可扩展的零-shot 操作。GE-Act 2.0 的生成和动作组件均在操作数据上初始化，能够有效地压缩与动作和指令相关的信息。通过联合训练和选择性优化，该模型在100个任务上取得了显著的成功，展示了跨体态转移的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.08368', 'title': 'Miles v0.1: Production-Level Post-Training', 'url': 'https://huggingface.co/papers/2609.08368', 'abstract': 'Abstract Miles is an open-source, production-ready system for large-scale reinforcement learning and post-training that supports diverse backends, weight synchronization, LoRA, distillation, and diffusion models.  Generated by thinkingmachines/Inkling-Small We present Miles v0.1, a full-stack, production-ready system for frontier post-training. Building upon the clean design of slime, Miles designs each stage of the reinforcement-learning (RL) training loop around a single principle: components should be verified, clean, and customizable. With accuracy, efficiency, reliability, and scalability as first-class goals, Miles aims to make frontier-scale RL accessible to researchers and enterprises alike. This report walks through the system end to end: rollout engines built on SGLang, a trainer with a choice of two backends (NVIDIA Megatron-LM and PyTorch FSDP), and three weight-synchronization transports for different deployment topologies. Beyond full-parameter RL, Miles also supports LoRA RL, on-policy distillation, supervised fine-tuning, and true-on-policy rollout-training alignment, and extends the same architecture to diffusion models. We close with an end-to-end case study: fully asynchronous agentic RL on a GLM-5.2 744B-A40B model over terminal-use coding tasks, running on 64 NVIDIA GB300 GPUs with a median step time of 263 seconds over the first 30 measured steps. Miles is open-sourced at https://github.com/radixark/miles, with the project website at https://miles.radixark.com.', 'score': 44, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '48ef17c8764c2fe1', 'pdf_title_img': 'assets/pdf/title_img/2609.08368.jpg', 'data': {'categories': ['#plp', '#diffusion', '#open_source', '#training', '#rl', '#inference', '#alignment', '#optimization', '#agents'], 'emoji': '🚀', 'ru': {'title': 'Инфраструктура для доступного масштабного обучения с подкреплением', 'desc': 'Miles — это полнофункциональная, готовая к использованию в production система для крупномасштабного обучения с подкреплением и постобучения моделей. Система спроектирована вокруг принципов верифицируемости, чистоты кода и настраиваемости каждого компонента, включая движки rollout на основе SGLang, тренер с поддержкой NVIDIA Megatron-LM и PyTorch FSDP, а также несколько транспортов синхронизации весов. Miles поддерживает не только полнопараметрическое reinforcement learning, но также LoRA, дистилляцию, supervised fine-tuning и асинхронное обучение, с расширением архитектуры на диффузионные модели. Система демонстрирует масштабируемость на примере обучения модели GLM-5.2 размером 744B параметров на 64 GPU NVIDIA GB300 с времени шага 263 секунды.'}, 'en': {'title': 'Miles: Revolutionizing Large-Scale Reinforcement Learning', 'desc': 'Miles is an open-source system designed for large-scale reinforcement learning (RL) and post-training processes. It emphasizes a clean and customizable design for each stage of the RL training loop, ensuring components are verified and efficient. The system supports various backends and advanced techniques like weight synchronization, LoRA, and distillation, making it versatile for both researchers and enterprises. An end-to-end case study demonstrates its capabilities on a powerful model, showcasing its efficiency and scalability in real-world applications.'}, 'zh': {'title': 'Miles：让大规模强化学习触手可及', 'desc': 'Miles是一个开源的、适用于大规模强化学习和后训练的系统，支持多种后端、权重同步、LoRA、蒸馏和扩散模型。该系统的设计围绕一个核心原则：组件应当经过验证、简洁且可定制。Miles的目标是使前沿规模的强化学习对研究人员和企业都变得可及，注重准确性、效率、可靠性和可扩展性。通过一个完整的案例研究，Miles展示了在64个NVIDIA GB300 GPU上进行完全异步的代理强化学习的能力。'}}}, {'id': 'https://huggingface.co/papers/2609.08084', 'title': 'Marigold V2: Revisiting Diffusion Transformers for Monocular Depth Estimation', 'url': 'https://huggingface.co/papers/2609.08084', 'abstract': "Abstract Marigold V2 repurposes diffusion transformers for monocular depth estimation via single-step flow-matching inference, semantic alignment, and a Sinkhorn-based two-stage fine-tuning protocol, yielding sharper out-of-distribution depth maps and strong results on related dense regression tasks.  Generated by thinkingmachines/Inkling-Small Monocular depth estimation is a ubiquitous yet highly ill-posed computer vision task, with downstream applications in scene reconstruction, computational photography, and robotics, among others. Despite the field's maturity, recent models still struggle to generalize to out-of-distribution inputs and to produce sharp and detailed depth maps. In this paper, we revisit Marigold, a set of techniques for repurposing modern image generation and editing models, powered by the diffusion transformer (DiT) architecture, into state-of-the-art monocular depth estimators. Our recipes target single-step inference from pretrained multi-step flow-matching models, with quantization where needed, preserving model capacity while remaining cheap to run. We analyze the artifacts of naive training and identify two effective remedies: aligning the model's internal representations with semantic features extracted from ground-truth, and adopting a 2-stage fine-tuning protocol built around a novel Sinkhorn-based loss. The results are crisper, cleaner depth maps that generalize well out-of-distribution, with 16-26% improvement in AbsRel over the previous best on KITTI and ETH3D. Qualitatively, our model resolves fur, foliage, and hair-thin edges that have eluded prior models. Furthermore, Marigold V2 achieves state-of-the-art results when applied to other dense regression tasks, such as surface normals estimation and intrinsic image decomposition. Project website: https://hf.co/spaces/huawei-bayerlab/marigold-v2-web", 'score': 43, 'issue_id': 3244, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '9551481a998c5ba7', 'authors': ['Igor Pavlovic', 'Thiemo Wandel', 'Anton Obukhov', 'Luca Bartolomei', 'Andrey Davydov', 'Fabio Tosi', 'Matteo Poggi', 'Sabine Süsstrunk', 'Dengxin Dai'], 'affiliations': ['EPFL', 'HUAWEI Bayer Lab', 'University of Bologna'], 'pdf_title_img': 'assets/pdf/title_img/2609.08084.jpg', 'data': {'categories': ['#cv', '#training', '#architecture', '#inference', '#robotics'], 'emoji': '🌑', 'ru': {'title': 'Трансформеры диффузии для четкого видения глубины за пределами распределения', 'desc': 'Marigold V2 переработает диффузионные трансформеры для оценки глубины по одному изображению, используя single-step flow-matching инференс и семантическое выравнивание представлений. Авторы разработали двухэтапный протокол fine-tuning с использованием Sinkhorn-based loss функции, который устраняет артефакты наивного обучения. Модель генерирует более четкие и детализированные карты глубины, которые хорошо обобщаются на данные, отличающиеся от обучающей выборки, показывая улучшение на 16-26% на бенчмарках KITTI и ETH3D. Marigold V2 также достигает state-of-the-art результатов на смежных задачах плотной регрессии, таких как оценка нормалей поверхности и декомпозиция внутренних изображений.'}, 'en': {'title': 'Sharper Depth Maps with Marigold V2: Revolutionizing Monocular Estimation', 'desc': "The paper presents Marigold V2, a novel approach that utilizes diffusion transformers for monocular depth estimation, which is a challenging task in computer vision. It introduces a single-step flow-matching inference method and a two-stage fine-tuning protocol based on Sinkhorn loss, enhancing the model's ability to produce sharp depth maps. The authors address the issue of generalization to out-of-distribution inputs by aligning internal representations with semantic features from ground-truth data. The results show significant improvements in depth estimation accuracy and quality, outperforming previous models on benchmark datasets like KITTI and ETH3D."}, 'zh': {'title': 'Marigold V2：单目深度估计的新突破', 'desc': 'Marigold V2 是一种利用扩散变换器进行单目深度估计的技术。它通过单步流匹配推理、语义对齐和基于 Sinkhorn 的两阶段微调协议，生成更清晰的深度图。该方法在处理分布外输入时表现出色，并在 KITTI 和 ETH3D 数据集上实现了 16-26% 的改进。Marigold V2 还在其他密集回归任务中表现出色，如表面法线估计和内在图像分解。'}}}, {'id': 'https://huggingface.co/papers/2609.09123', 'title': 'Mask Forcing: Improving Autoregressive Video Diffusion Distillation via Dual-Noise Masking Rollout', 'url': 'https://huggingface.co/papers/2609.09123', 'abstract': 'Abstract Mask Forcing mitigates mode collapse in distilled autoregressive video diffusion by injecting masked cleaner signals during self-rollout, improving visual quality without extra training data.  Generated by thinkingmachines/Inkling-Small Autoregressive (AR) video diffusion models have shown great potential in real-time video generation. Recent methods distill pretrained bidirectional video diffusion models into causal AR students through Distribution Matching Distillation (DMD), but the generated videos often suffer from over-saturation and over-smoothing issues, resulting in limited visual quality and realism. The key contributing factor is the mode-seeking behavior of the reverse KL objective in DMD, which can cause the student distribution to collapse onto only a few modes of the teacher distribution. To address this, we propose Mask Forcing, a Dual-Noise Masking Rollout strategy that perturbs the AR student self-rollout to mitigate mode collapse induced by reverse-KL mode seeking. The core idea is to inject cleaner signals into noisy rollout inputs via random masks along spatial and temporal axes during the self-rollout process of AR diffusion distillation. Such perturbations encourage the student rollouts to explore more regions of the teacher distribution, allowing DMD to provide learning signals beyond the modes already covered by the student. Moreover, the cleaner tokens act as denoising guidance for other noisier tokens, improving the intermediate rollout predictions and reducing error accumulation. Extensive experiments demonstrate that our method improves multiple AR video diffusion distillation methods with higher visual quality efficiently, without incorporating real video data or additional post-training stages.', 'score': 43, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '3083ef42e25f8119', 'authors': ['Zhuoran Zhao', 'Shengju Qian', 'Tongtong Liang', 'Xianghao Kong', 'Songchun Zhang', 'Junchao Huang', 'Guian Fang', 'Xin Wang', 'Pan Hui', 'Anyi Rao'], 'affiliations': ['CUHK(SZ)', 'HKUST', 'HKUST(GZ)', 'LIGHTSPEED', 'NUS', 'UCSD'], 'pdf_title_img': 'assets/pdf/title_img/2609.09123.jpg', 'data': {'categories': ['#training', '#architecture', '#video'], 'emoji': '🎬', 'ru': {'title': 'Маскирование от коллапса мод в дистиллированной видеодиффузии', 'desc': 'В работе предложен метод Mask Forcing для улучшения качества видео, генерируемого дистиллированными авторегрессивными моделями диффузии. Основная проблема заключается в том, что обратная дивергенция Кульбака-Лейблера приводит к коллапсу мод, когда модель студента покрывает только несколько режимов распределения учителя. Авторы предлагают инжектировать более чистые сигналы в процесс автоматического развёртывания модели, применяя маски вдоль пространственных и временных осей, что заставляет модель исследовать более широкие области распределения. Экспериментальные результаты показывают, что метод значительно улучшает визуальное качество без требования дополнительных данных и переобучения.'}, 'en': {'title': 'Enhancing Video Generation with Mask Forcing', 'desc': 'This paper introduces Mask Forcing, a technique designed to improve the visual quality of videos generated by autoregressive (AR) video diffusion models. The method addresses the problem of mode collapse, which occurs when the model generates limited variations of output due to the reverse KL divergence objective. By injecting cleaner signals through random masking during the self-rollout process, Mask Forcing encourages the model to explore a wider range of outputs. The results show that this approach enhances the quality of generated videos without requiring additional training data or post-training adjustments.'}, 'zh': {'title': 'Mask Forcing：提升视频生成质量的创新策略', 'desc': '本文提出了一种名为Mask Forcing的方法，用于缓解在自回归视频扩散模型中出现的模式崩溃问题。通过在自我回滚过程中注入随机掩码信号，增强了生成视频的视觉质量，而无需额外的训练数据。该方法通过扰动自回归学生模型的输出，鼓励其探索教师分布的更多区域，从而改善生成结果。实验表明，Mask Forcing显著提高了多种自回归视频扩散模型的视觉质量。'}}}, {'id': 'https://huggingface.co/papers/2609.05594', 'title': 'SceneMosaic: Efficient and Diverse Simulation-Ready Scene Generation via Hybrid Agentic Layout Evolution', 'url': 'https://huggingface.co/papers/2609.05594', 'abstract': 'Abstract SceneMosaic combines learned image priors with vision-language agents to efficiently generate diverse, physically valid indoor scenes by evolving local units and composing them globally.  Generated by thinkingmachines/Inkling-Small Diverse and simulation-ready indoor scenes are essential for interactive entertainment and embodied AI, yet their scalable generation remains challenging. Recent agentic text-to-3D scene pipelines that rely on vision-language models (VLMs) can generate scenes of high fidelity but require costly iterative object placement and refinement. Another mainstream paradigm, parametric image-to-3D scene models, produces scenes efficiently from strong priors learned from 2D images but often leads to imprecise and physically invalid scenes. More importantly, both paradigms struggle to output diverse scenes for a single input, making it hard for them to reflect the dynamically changing nature of real scenes. In this paper we propose SceneMosaic, a framework that combines the merits of both paradigms. It obtains the initial candidate from the learned image-based prior, and subsequently evolves the result through VLM agents, ensuring both efficiency and physical validity. Within the evolution process, SceneMosaic exploits the locality of natural scenes and decomposes a scene into independent local units, allowing separate evolution within each unit before composing the global scene via Cartesian product. On SceneEval-100, SceneMosaic matches the strongest agentic baseline in semantic layout quality with a 24x speedup, substantially reduces physical violations, and receives the highest human ratings. Our code is publicly available at https://github.com/rxjfighting/SceneMosaic.', 'score': 41, 'issue_id': 3243, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '2be39dbebe8df488', 'authors': ['Xingjian Ran', 'Xiaoye Mo', 'Sihao Liu', 'Jianyu Zhang', 'Li Luo', 'Bo Dai'], 'affiliations': ['The University of Hong Kong', 'University of Electronic Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.05594.jpg', 'data': {'categories': ['#open_source', '#3d', '#multimodal', '#cv', '#agents'], 'emoji': '🏠', 'ru': {'title': 'Эффективная генерация реалистичных сцен через локальную эволюцию и глобальную композицию', 'desc': "SceneMosaic — это фреймворк для генерации разнообразных трёхмерных сцен помещений, который объединяет полученные из изображений приоры с агентами на основе vision-language моделей. Метод начинает с кандидата, полученного из обученного приора на 2D изображениях, а затем эволюционирует результат через VLM-агентов для обеспечения эффективности и физической корректности. Ключевая идея заключается в декомпозиции сцены на независимые локальные единицы, которые эволюционируют отдельно, а затем композируются в глобальную сцену через декартово произведение. На бенчмарке SceneEval-100 метод достигает качества семантической разметки сильного baseline'а с ускорением в 24 раза, значительно снижает физические нарушения и получает наивысшие оценки от человеческих экспертов."}, 'en': {'title': 'Efficiently Crafting Diverse Indoor Scenes with SceneMosaic', 'desc': 'SceneMosaic is a novel framework that merges learned image priors with vision-language models to create diverse and physically valid indoor scenes efficiently. It addresses the limitations of existing methods by evolving local scene units independently before combining them into a complete scene. This approach not only enhances the speed of scene generation but also improves the accuracy and realism of the output. The framework demonstrates significant advancements in scene quality and user satisfaction compared to traditional methods.'}, 'zh': {'title': '高效生成多样化室内场景的创新框架', 'desc': 'SceneMosaic 是一个结合了学习图像先验和视觉语言代理的框架，能够高效生成多样化且物理有效的室内场景。该方法通过将场景分解为独立的局部单元，允许在每个单元内进行独立演化，然后通过笛卡尔积组合成全局场景。与传统的文本到3D场景生成方法相比，SceneMosaic 在语义布局质量上表现出色，并且速度提升了24倍，显著减少了物理违规现象。该框架为动态变化的真实场景提供了更好的多样性和有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.04971', 'title': 'BeaconKV: Key-Value Cache Compression Guided by Beacon Queries for Efficient Large Reasoning Model Inference', 'url': 'https://huggingface.co/papers/2609.04971', 'abstract': 'Abstract BeaconKV improves memory efficiency for long reasoning traces by using compact beacon queries to predict which past key-value pairs will be revisited, reducing cache size without sacrificing accuracy.  Generated by thinkingmachines/Inkling-Small Large Reasoning Models (LRMs) achieve superior problem-solving through extended Chain-of-Thought (CoT) generation, but the resulting key-value (KV) cache grows linearly with sequence length and creates severe memory bottlenecks, often exceeding GPU capacity for long reasoning traces. Existing KV cache compression methods rely on recent queries to estimate future token importance, implicitly assuming these serve as reliable proxies for future attention patterns. We demonstrate that this assumption fails in long-horizon reasoning: certain decoding steps generate Thought Revisiting Tokens (TRT) that re-attend to distant previous context, such as task-solving plans formulated early in the trace. Through systematic analysis, we discover that queries corresponding to the TRT cluster into a small number of similarity groups in the embedding space. Based on this insight, we propose BeaconKV, a training-free KV cache compression method that maintains beacon queries, compact representatives for each global query cluster, to anticipate which KV pairs will be revisited without storing the entire query history. Across four open-source LRMs and diverse reasoning benchmarks, BeaconKV generally outperforms existing compression methods, achieving up to 5.8times memory reduction while nearly preserving full cache accuracy and improving throughput by over 4.3times.', 'score': 30, 'issue_id': 3243, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '6c602366e2fc32c3', 'pdf_title_img': 'assets/pdf/title_img/2609.04971.jpg', 'data': {'categories': ['#optimization', '#long_context', '#reasoning'], 'emoji': '💾', 'ru': {'title': 'Предсказание будущих обращений к памяти через компактные представители запросов', 'desc': 'BeaconKV решает проблему чрезмерного потребления памяти в больших языковых моделях при длинных цепочках рассуждений, используя компактные beacon-запросы для предсказания того, какие пары ключ-значение из KV-кэша понадобятся в будущем. Авторы показали, что стандартные методы сжатия кэша неэффективны для долгохоризонтных рассуждений, так как будущие токены часто обращаются к давним контекстам, сформированным в начале трассировки. Предложенный метод, основанный на кластеризации векторов запросов в пространстве эмбеддингов, поддерживает только репрезентативные beacon-запросы вместо всей истории. Метод достигает сокращения памяти в 5.8 раз при сохранении точности и не требует переобучения модели.'}, 'en': {'title': 'Efficient Memory Management for Long Reasoning with BeaconKV', 'desc': 'BeaconKV is a novel method designed to enhance memory efficiency in long reasoning tasks by utilizing compact beacon queries. It predicts which key-value pairs will be revisited, thereby reducing the size of the cache without compromising accuracy. Traditional methods rely on recent queries to estimate future token importance, but this approach often fails in long-horizon reasoning scenarios. By clustering queries into similarity groups, BeaconKV effectively anticipates the need for past information, achieving significant memory savings and improved processing speed across various reasoning benchmarks.'}, 'zh': {'title': 'BeaconKV：高效的长推理内存管理', 'desc': 'BeaconKV通过使用紧凑的信标查询来预测哪些过去的键值对会被重新访问，从而提高了长推理轨迹的内存效率。这种方法减少了缓存大小，而不牺牲准确性。现有的键值缓存压缩方法依赖于最近的查询来估计未来的令牌重要性，但在长时间推理中，这种假设并不成立。BeaconKV通过保持信标查询，能够在不存储整个查询历史的情况下，预见哪些键值对将被重新访问，从而显著提高了内存利用率和推理速度。'}}}, {'id': 'https://huggingface.co/papers/2609.06746', 'title': 'Reason Through the Latent! Making Latent Visual Reasoning Necessary', 'url': 'https://huggingface.co/papers/2609.06746', 'abstract': 'Abstract CVRR enforces recurrent hidden-state computation as the required image-conditioned pathway for visual reasoning, preserving model competence while distinguishing latent information from actual predictive use.  Generated by thinkingmachines/Inkling-Small Latent visual reasoning aims to perform multimodal reasoning through hidden-state computation rather than explicit textual chains of thought. However, visual information being present in a latent state does not imply that the model actually relies on that state when producing its answer, especially when alternative image-conditioned paths remain available. We introduce Causal Visual Recurrent Reasoning (CVRR), which preserves pretrained visual competence while making recurrent computation the required image-conditioned path to prediction. CVRR initializes recurrence from the question hidden state after the pretrained vision-language model has incorporated the image, then repeatedly updates this state while re-reading the same fixed visual evidence. Before decoding, visual states and the original multimodal KV cache are removed so that only the final recurrent state carries image-conditioned information to the answer. Across the V^*, MMVP, BLINK, and MME-RealWorld-Lite benchmarks, CVRR retains strong performance under this strict interface, while compatible latent reasoners fail to recover comparable visual competence even when retrained under the same constraint. Causal interventions further show that predictions remain sensitive to recurrent content when the question is held fixed, and that persistent visual evidence causally revises the recurrent trajectory. These results distinguish latent informativeness from latent computation that is actually used for prediction.', 'score': 29, 'issue_id': 3243, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': 'c3230d27d3690b4e', 'authors': ['Suhyeong Park', 'Junha Jung', 'Jaewoo Kang'], 'affiliations': ['AIGEN Sciences', 'Korea University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06746.jpg', 'data': {'categories': ['#interpretability', '#architecture', '#reasoning', '#multimodal', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Заставить модель думать визуально через рекуррентные вычисления', 'desc': 'В статье предложен метод CVRR (Causal Visual Recurrent Reasoning), который заставляет модель обрабатывать визуальную информацию через рекуррентные вычисления в скрытых состояниях, а не через явные текстовые рассуждения. Метод инициализирует рекуррентное состояние из скрытого представления вопроса после того, как видение-языковая модель обработала изображение, затем многократно обновляет это состояние, пересчитывая одно и то же визуальное свидетельство. Перед декодированием ответа удаляются визуальные состояния и оригинальный KV кэш, оставляя только финальное рекуррентное состояние с визуальной информацией. Экспериментальные результаты показывают, что CVRR сохраняет высокую производительность при таких строгих ограничениях, а причинно-следственный анализ подтверждает, что предсказания действительно зависят от содержимого рекуррентного пути.'}, 'en': {'title': 'Revolutionizing Visual Reasoning with Recurrent Computation', 'desc': "Causal Visual Recurrent Reasoning (CVRR) is a method that enhances visual reasoning by using recurrent hidden-state computation as the main way to process image information. This approach ensures that the model effectively utilizes visual data while distinguishing between useful latent information and what is actually used for making predictions. By initializing the recurrent state from the question and updating it with the same visual evidence, CVRR maintains strong performance across various benchmarks. The findings demonstrate that the model's predictions are influenced by the recurrent content, highlighting the importance of how visual information is integrated into the reasoning process."}, 'zh': {'title': '因果视觉递归推理：提升视觉推理能力', 'desc': 'CVRR（因果视觉递归推理）通过递归隐藏状态计算来实现视觉推理，确保模型在进行预测时依赖于图像信息。该方法在预训练的视觉-语言模型基础上，利用问题的隐藏状态初始化递归，并在读取固定的视觉证据时不断更新状态。CVRR在多个基准测试中表现出色，证明了其在严格接口下仍能保持强大的视觉能力。研究结果表明，潜在信息的有效性与实际用于预测的潜在计算是有区别的。'}}}, {'id': 'https://huggingface.co/papers/2609.06289', 'title': 'Steering Geometry: Validating Human Value Geometry in LLM Steering Space', 'url': 'https://huggingface.co/papers/2609.06289', 'abstract': "Abstract Activation steering vectors in large language models encode theory-aligned human value geometry when derived via distribution-driven methods, with geometric fidelity scaling with model size but declining after instruction tuning.  Generated by thinkingmachines/Inkling-Small As large language models (LLMs) are increasingly deployed in alignment-sensitive contexts, activation steering has emerged as a lightweight, inference-time alternative to fine-tuning methods (e.g., RLHF, DPO) for behavioral control. However, existing work typically validates steering on isolated behaviors, leaving it unclear whether steering vectors encode coherent semantic structure or merely exploit behavior-specific shortcuts. We investigate whether the latent geometry of LLM steering vectors reflects theory-specified structure in human values and morality. Using Schwartz's Theory of Basic Human Values as our primary fine-grained framework, we introduce a 26K-sample benchmark covering 20 human values and analyze distribution-driven methods (e.g., CAA, SphericalSteer, ODESteer) and behavior-centric approaches (e.g., COLD-Steer, BiPO) across diverse model families and sizes. We find that distribution-driven methods recover human value topologies aligned with theoretical predictions (Spearman ρ up to 0.51, p < 10^{-13}). In contrast, behavior-centric methods achieve comparable steering performance but show little correlation with the expected value geometry. Geometric fidelity improves with model scale but drops after instruction tuning. Finally, better geometric alignment also leads to more human-consistent transfer across values: steering one value correctly lifts compatible values and suppresses opposing ones. Code and data are available at: https://github.com/DeepRCL/Steering_Geometry.", 'score': 26, 'issue_id': 3243, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '48a5b67fe889e9b2', 'authors': ['Mohammad Mahdi Abootorabi', 'Armin Saghafian', 'Ali Bazshoushtari', 'Hamid Rezaei', 'EunJeong Hwang', 'Vered Shwartz', 'Parvin Mousavi', 'Purang Abolmaesumi'], 'affiliations': ['Queens University', 'University of British Columbia', 'Vector Institute for AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.06289.jpg', 'data': {'categories': [], 'emoji': '🧭', 'ru': {'title': 'Геометрия человеческих ценностей в векторах управления LLM', 'desc': 'Исследование показывает, что векторы активационного управления в больших языковых моделях кодируют геометрическую структуру человеческих ценностей, когда они получены методами, основанными на распределении данных. Авторы используют теорию базовых человеческих ценностей Шварца для оценки, содержат ли векторы управления истинную семантическую структуру или просто эксплуатируют поведенческие закономерности. Методы, управляемые распределением (как CAA и SphericalSteer), успешно восстанавливают топологию ценностей, согласованную с теоретическими предсказаниями, в то время как поведенческие методы показывают слабую корреляцию с ожидаемой геометрией. Качество восстановления геометрии улучшается с увеличением размера модели, но снижается после инструкционной настройки.'}, 'en': {'title': 'Steering Values: Aligning LLMs with Human Morality Geometry', 'desc': "This paper explores how activation steering vectors in large language models (LLMs) can represent human values and morality through geometric structures. It compares different methods of deriving these vectors, particularly focusing on distribution-driven techniques versus behavior-centric approaches. The study finds that distribution-driven methods align better with theoretical human value frameworks, while behavior-centric methods lack coherent semantic structure. Additionally, the research shows that larger models exhibit better geometric fidelity, but this quality diminishes after instruction tuning, impacting the model's ability to transfer learned values effectively."}, 'zh': {'title': '激活引导：连接人类价值与大语言模型的几何结构', 'desc': '本文探讨了大语言模型中的激活引导向量如何编码与人类价值观几何结构相一致的理论。研究表明，基于分布的方法能够恢复与理论预测一致的人类价值拓扑，而行为中心的方法则表现出较低的相关性。随着模型规模的增加，几何保真度有所提高，但在指令调优后会下降。更好的几何对齐也能促进不同价值之间的一致性转移。'}}}, {'id': 'https://huggingface.co/papers/2609.07498', 'title': 'CosmoH2G: A Hand-to-Gripper Transfer Dataset and Baseline Method for Object Manipulation with Complex Spatial Movements', 'url': 'https://huggingface.co/papers/2609.07498', 'abstract': "Abstract A two-stage framework predicts sparse gripper keyframes and continuous actions to transfer complex hand demonstrations to robotic grippers while reducing drift via kinematic optimization.  Generated by thinkingmachines/Inkling-Small Transferring human hand demonstrations to robotic grippers has recently emerged as a cost-effective solution for robot learning. However, existing methods are largely confined to simple, planar tasks and fail to handle complex spatial movements (e.g., intricate trajectories involving rotations or flips) that are essential for robot manipulation. Motivated by this gap, we adopt an implicit, data-driven approach guided by fine-grained hand-pose motions. To this end, we introduce a scalable acquisition pipeline to collect hand-gripper paired demonstrations, governed by a rigorous protocol that prioritizes motion complexity and leverages a handheld gripper for seamless action mimicry. This yields a large-scale paired dataset comprising 6,189 episodes across 1,254 unique objects, exhibiting significantly higher spatial complexity than existing benchmarks. However, learning such complex mappings remains challenging. We observe that naive end-to-end generation of full gripper pose sequences is insufficient, as minor trajectory deviations compound rapidly under intricate dynamics. To address this, we propose a two-stage framework: Stage I predicts sparse gripper keyframes (initial and terminal) to simplify the mapping objective, while Stage II generates the full continuous action sequence conditioned on these keyframes. Furthermore, to mitigate cumulative drift, we keep the gripper's orientation being learned while post-optimizing its translation based on the grasping heuristic and kinematic consistency. In both simulation and real-robot experiments, our framework enables stable and precise hand-to-gripper transfer of complex spatial manipulations, significantly outperforming traditional baselines. Project page: https://cosmoh2g.github.io.", 'score': 25, 'issue_id': 3243, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'c5f1879fd8d520fc', 'authors': ['Hongxiang Zhao', 'Mutian Xu', 'Zeyu Jin', 'Yiming Hao', 'Shuguang Cui', 'Xiaoguang Han'], 'affiliations': ['FNii-Shenzhen', 'GenuX', 'SSE, CUHKSZ'], 'pdf_title_img': 'assets/pdf/title_img/2609.07498.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'От рук человека к точным движениям робота через ключевые позиции', 'desc': 'В работе предложена двухэтапная архитектура для трансфера демонстраций движений человеческой руки на робототехнические захватчики. На первом этапе модель предсказывает разреженные ключевые фреймы позы захватчика, а на втором этапе генерирует полную последовательность непрерывных действий, обусловленную этими ключевыми позициями. Для борьбы с накоплением ошибок траектории авторы применяют кинематическую оптимизацию, сохраняя ориентацию и постоптимизируя трансляцию на основе эвристик захвата. Фреймворк был протестирован на большом наборе данных из 6189 эпизодов с 1254 объектами и продемонстрировал превосходную точность в передаче сложных пространственных манипуляций.'}, 'en': {'title': 'Transforming Hand Movements to Robotic Grippers with Precision', 'desc': 'This paper presents a two-stage framework designed to enhance the transfer of complex human hand movements to robotic grippers. The first stage focuses on predicting sparse keyframes, which simplifies the mapping of hand motions to gripper actions. The second stage generates continuous action sequences based on these keyframes while addressing issues of drift through kinematic optimization. The approach is validated with a large dataset and demonstrates superior performance in handling intricate spatial manipulations compared to existing methods.'}, 'zh': {'title': '复杂手势的精准转移：机器人抓手的新方法', 'desc': '本论文提出了一种两阶段框架，用于将复杂的人手演示转移到机器人抓手上，同时通过运动学优化减少漂移。该方法采用数据驱动的隐式方式，利用细致的手势动作来指导学习。我们收集了一个大规模的手抓配对演示数据集，包含6189个实例，展现了比现有基准更高的空间复杂性。通过预测稀疏的抓手关键帧并生成连续的动作序列，我们的框架在模拟和真实机器人实验中实现了稳定且精确的复杂空间操作转移。'}}}, {'id': 'https://huggingface.co/papers/2609.07108', 'title': 'Online Draft Co-Training for Speculative Decoding in Large-Scale, Long-Context RL Post-Training', 'url': 'https://huggingface.co/papers/2609.07108', 'abstract': "Abstract A system for large-scale online draft co-training accelerates speculative decoding in RL post-training by extending context-parallel attention and adding cross-stage feature transport.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates rollout generation, which dominates the cost of reinforcement learning (RL) post-training. Online co-training can further increase the draft's accuracy, yielding greater speedups. However, scaling this approach to co-training on large models with long contexts poses two obstacles: (1) branch attention is unsupported by standard causal context-parallel (CP) implementations, and (2) target features span across pipeline-parallel (PP) stages. We address both with an end-to-end system for large-scale online draft co-training. For CP, we extend packed, load-balanced zigzag ring attention by merging rank-local branch attention with causal main-sequence attention. For PP, TapChannel transports intermediate target features across stages via a separate path, leaving the pipeline schedule unaffected. Experiments demonstrate that co-trained drafts closely track the policy baseline while delivering substantial rollout and end-to-end speedups across model scales up to 122B. Our CP design achieves strong scaling at 256K tokens with significant memory savings over prior work, and our PP transport incurs modest overhead. Code can be found at https://github.com/NVIDIA-NeMo/RL/issues/3698.", 'score': 25, 'issue_id': 3243, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '9e27f147d9ebec5a', 'authors': ['Zili Wang', 'Zhaopeng Qiu', 'Yuekai Zhang', 'Shuang Yu', 'Junjie Lai'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.07108.jpg', 'data': {'categories': ['#training', '#architecture', '#rl', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Ускорение обучения с подкреплением через параллельное совместное обучение черновых моделей', 'desc': 'Статья описывает систему для крупномасштабного онлайн-обучения черновых моделей, которая ускоряет спекулятивное декодирование в постобучении с подкреплением. Авторы расширили механизм контекстно-параллельного внимания, добавив поддержку ветвящегося внимания через адаптацию кольцевого внимания, и реализовали транспортировку промежуточных признаков целевой модели через этапы конвейерного параллелизма. Предложенный подход TapChannel позволяет эффективно масштабировать совместное обучение на больших моделях с длинными контекстами без влияния на расписание конвейера. Экспериментальные результаты показывают значительное ускорение генерации обучающих данных и улучшение производительности на моделях размером до 122 миллиардов параметров.'}, 'en': {'title': 'Accelerating RL Post-Training with Online Draft Co-Training', 'desc': 'This paper presents a system that enhances the efficiency of reinforcement learning (RL) post-training through a method called online draft co-training. By improving speculative decoding, the system reduces the time needed for generating rollouts, which is a major cost in RL. The authors tackle challenges related to scaling co-training for large models by introducing advanced attention mechanisms and feature transport methods. Their experiments show that this approach not only maintains accuracy but also significantly speeds up the process, even for very large models.'}, 'zh': {'title': '大规模在线草稿共同训练加速推测解码', 'desc': '本文提出了一种大规模在线草稿共同训练系统，旨在加速强化学习后期训练中的推测解码。通过扩展上下文并行注意力机制并增加跨阶段特征传输，该系统提高了草稿的准确性和生成速度。尽管在长上下文的大模型上进行共同训练面临挑战，但我们通过改进注意力机制和特征传输方法成功克服了这些障碍。实验结果表明，经过共同训练的草稿在多个模型规模上都能有效跟踪策略基线，同时实现了显著的速度提升。'}}}, {'id': 'https://huggingface.co/papers/2609.06758', 'title': 'Agentic Visual Generation: From Generative Models to Agentic Control', 'url': 'https://huggingface.co/papers/2609.06758', 'abstract': "Abstract The abstract proposes a four-level framework classifying agentic visual generation by the controller's direct decision scope over generation operations, from fixed support to experience-adaptive control.  Generated by thinkingmachines/Inkling-Small Visual generation is evolving from generative models used through a single invocation into agentic control processes that can plan, select tools, inspect intermediate synthesized outputs, revise failures, and reuse prior experience. In most existing systems, the controller is an LLM or VLM, while visual generation models serve as tools or executors. However, existing work lacks a consistent criterion for determining when a generation system becomes agentic. Planning depth, tool use, multi-role collaboration, and reinforcement learning are often treated as evidence of agenticity, even though none of them necessarily determines which generation decisions the controller can make. We organize the field according to what the controller can directly control in the generation process. At L1 Conditioning Control, the controller prepares the input to a predetermined generator but does not control which visual operation is executed. At L2 Execution Control, it selects and invokes actual generation, editing, rendering, or other content-modifying operations. At L3 Outcome-Adaptive Control, it observes an intermediat
