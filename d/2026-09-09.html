Compressing large-scale neural networks is essential for deploying models on resource-constrained devices. Most existing methods adopt weight pruning or low-bit quantization individually, often resulting in suboptimal compression rates to preserve acceptable performance drops. We introduce a unified framework for simultaneous pruning and low-bit quantization via Bayesian variational learning (\\method), which achieves higher compression rates than prior baselines while maintaining comparable performance. The key idea is to employ a spike-and-slab prior to induce sparsity and model quantized weights using Gaussian Mixture Models (GMMs) to enable low-bit precision. Due to the intractability of the objective involving spike-and-slab priors with GMMs, we derive an efficient approximation that facilitates effective compression with minimal accuracy loss. In theory, we provide a consistent result for our proposed variational approach to a sparse and quantized deep neural network. Extensive experiments on compressing ResNet, BERT-base, Llama3.2, and Qwen2.5 models show that our method achieves higher compression rates than a line of existing methods with comparable performance drops. Project page: https://comeusr.github.io/SQS_Webpage.', 'score': 14, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '45c307f541caf616', 'authors': ['Ziyi Wang', 'Nan Jiang', 'Guang Lin', 'Qifan Song'], 'affiliations': ['Purdue University', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2510.08999.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🗜️', 'ru': {'title': 'Одновременная обрезка и квантование нейросетей через байесов вариационный вывод', 'desc': 'В работе предлагается объединённый вариационный байесовский подход для одновременного сжатия нейронных сетей путём обрезки весов и низкоразрядного квантования. Метод использует spike-and-slab приор для индукции разреженности и модели смеси Гауссовых распределений для моделирования квантованных весов с минимальной потерей точности. Авторы выводят эффективную аппроксимацию вариационной задачи оптимизации, которая была бы интрактабельна с использованием только spike-and-slab приоров. Экспериментальные результаты на моделях ResNet, BERT-base, Llama3.2 и Qwen2.5 демонстрируют, что предложенный подход достигает более высоких степеней сжатия по сравнению с существующими методами.'}, 'en': {'title': 'Efficient Neural Network Compression with Bayesian Variational Learning', 'desc': 'This paper presents a new method for compressing large neural networks using a unified Bayesian variational framework. It combines spike-and-slab sparsity with Gaussian mixture quantization to achieve high compression rates while minimizing accuracy loss. The approach allows for simultaneous weight pruning and low-bit quantization, which is more effective than traditional methods that use these techniques separately. Experimental results demonstrate that this method outperforms existing compression techniques on various neural network models without significantly degrading their performance.'}, 'zh': {'title': '高效压缩神经网络的新方法', 'desc': '本文提出了一种统一的贝叶斯变分框架，结合了尖峰-板块稀疏性和高斯混合量化，能够在保持较小精度损失的情况下，实现大规模神经网络的高压缩率。该方法通过同时进行权重剪枝和低位量化，克服了传统方法的局限性，显著提高了压缩效率。关键在于使用尖峰-板块先验来诱导稀疏性，并利用高斯混合模型（GMM）对量化权重进行建模。实验结果表明，该方法在压缩ResNet、BERT-base等模型时，达到了比现有方法更高的压缩率，同时保持了相似的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.08108', 'title': 'SynthGait-19K: A Physically Grounded Synthetic Video Dataset for Gait Parameter Estimation', 'url': 'https://huggingface.co/papers/2609.08108', 'abstract': 'Abstract SynthGait-19k is a large synthetic video dataset for gait analysis that enables benchmarking of video-based gait estimation and shows synthetic supervision transfers to real data.  Generated by thinkingmachines/Inkling-Small Accurate estimation of clinically meaningful gait parameters from monocular video is important for scalable mobility assessment, yet progress is limited by the small scale, restricted viewpoints, and limited visual diversity of existing datasets. We introduce SynthGait-19k, a physically grounded synthetic video dataset containing 19,272 walking videos derived from 6,427 MoCap sequences across 437 subjects, with paired SMPL motion and annotations for six gait parameters. To construct the dataset, we develop Gait2Vid, which unifies heterogeneous MoCap recordings through SMPL and synthesizes diverse RGB walking videos under controllable viewpoints and scene appearances. We assess the generated videos for consistency with their conditioning gait kinematics and validate extracted gait events against force-platform measurements. Using SynthGait-19K, we benchmark direct RGB, pose-based, biomechanical, and human-mesh-recovery approaches and analyze viewpoint, training-data scale, and synthetic-to-real domain shift. We also introduce GaitXFormer as a direct RGB reference model for estimating gait parameters. Synthetic supervision transfers effectively to real videos across both GaitXFormer and a pose-based architecture, demonstrating utility across different representations. We further find that spatial gait parameters are more sensitive to visual domain shift and that improved HMR reconstruction alone does not necessarily translate to improved downstream gait estimation.', 'score': 12, 'issue_id': 3245, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '42799ccd88056478', 'authors': ['Soroush Mehraban', 'Xin Lei Lin', 'Vida Adeli', 'Majid Mirmehdi', 'Amirhossein Dadashzadeh', 'Clint Hansen', 'Andrea Iaboni', 'Babak Taati'], 'affiliations': ['KITE Research Institute', 'Kiel University', 'University of Bristol', 'University of Toronto', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2609.08108.jpg', 'data': {'categories': ['#benchmark', '#healthcare', '#multimodal', '#synthetic', '#transfer_learning', '#video', '#dataset'], 'emoji': '🚶', 'ru': {'title': 'Синтетические данные для точной оценки параметров ходьбы из видео', 'desc': 'В статье представлен SynthGait-19k — большой синтетический видеодатасет из 19 272 видео ходьбы для анализа походки и оценки клинически значимых параметров из монокулярного видео. Авторы разработали метод Gait2Vid, который объединяет гетерогенные МоКап записи через SMPL модель и синтезирует разнообразные RGB видео с контролируемыми точками обзора и сценами. Были протестированы различные подходы: прямая обработка RGB, методы на основе поз, биомеханические модели и восстановление человеческой сетки, а также предложена архитектура GaitXFormer как эталонная модель. Исследование показало, что синтетическое обучение эффективно переносится на реальные видео, хотя пространственные параметры больше чувствительны к смещению визуального домена.'}, 'en': {'title': 'Revolutionizing Gait Analysis with SynthGait-19k', 'desc': 'SynthGait-19k is a comprehensive synthetic video dataset designed for gait analysis, consisting of 19,272 walking videos generated from motion capture data. The dataset aims to enhance the estimation of gait parameters from monocular video by providing diverse visual perspectives and conditions. It introduces Gait2Vid, a method that synthesizes realistic walking videos while maintaining consistency with motion data. The study demonstrates that synthetic supervision can effectively improve the performance of both RGB and pose-based models in real-world gait estimation tasks.'}, 'zh': {'title': '合成步态数据集，助力步态估计的进步', 'desc': 'SynthGait-19k是一个大型合成视频数据集，专注于步态分析，旨在为基于视频的步态估计提供基准测试。该数据集包含19,272个行走视频，来源于6,427个运动捕捉序列，涵盖437个受试者，并配有六个步态参数的注释。我们开发了Gait2Vid，通过SMPL统一不同的运动捕捉记录，并在可控的视角和场景下合成多样的RGB行走视频。研究表明，合成监督能够有效转移到真实视频中，展示了在不同表示方法中的实用性。'}}}, {'id': 'https://huggingface.co/papers/2609.07821', 'title': 'A*-Thought-V2: Efficient Latent Reasoning via Geometric Dynamics of LLM', 'url': 'https://huggingface.co/papers/2609.07821', 'abstract': 'Abstract A*-Thought-V2 models chain-of-thought reasoning as hidden-state trajectories to selectively retain explicit reasoning steps or compress them into continuous latent tokens, improving accuracy and efficiency.  Generated by thinkingmachines/Inkling-Small Chain-of-Thought (CoT) improves the reasoning ability of Large Language Models (LLMs) but incurs substantial computation and context costs. Existing methods either lose intermediate information through hard pruning or lack a principled criterion for continuous compression. We present A*-Thought-V2, a geometric dynamics of LLM guided framework that models CoT as a hidden-state trajectory and replaces hard deletion with an explicit-implicit interleaved latent architecture. After projecting question, step, and solution representations into a 3D PCA space, it measures alignment between each local transition and global question-to-solution direction. Aligned steps remain explicit text, whereas deviating steps are compressed into continuous latent tokens. Directional angles capture both local semantics and reasoning dynamics: small angles indicate direct execution and answer formation, while large angles more frequently involve checking, correction, and branch exploration; their temporal variation reveals exploration, convergence, and refinement stages. To train this architecture, we introduce stepwise embedding forcing, which pools each redundant step into a single latent embedding, and label forcing, which supervises that latent token with a soft multi-modal vocabulary distribution instead of a hard one-hot label. Experiments on Qwen3.5-9B and Qwen3.6-27B across six in-domain and out-of-domain benchmarks show that A*-Thought-V2 improves average accuracy by up to 2.6% while reducing response length by up to half, increasing Accuracy per Computation Unit by 2.29times, and reducing preprocessing and training time by 94.6% and up to 80.3%, respectively. Representation analyses suggest that latent states form a compact region distinct from textual states, while higher entropy at latent-token positions reflects broader soft targets that encourage richer step-level feature learning.', 'score': 10, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '1b772f6ce7935159', 'authors': ['Xiaoang Xu', 'Siyuan Liu', 'Shuo Wang', 'Junlan Feng', 'Fanyu Meng', 'Zhu Zhang', 'Jixun Wang', 'Xiaorong Wang', 'Zihan Zhou', 'Xin Li', 'Chaojun Xiao', 'Yiming Zhang', 'Huijia Wu', 'Liuyu Xiang', 'Peipei Li', 'Zhaofeng He'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'JIUTIAN Research, Beijing, China', 'OpenBMB', 'The Hong Kong Polytechnic University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07821.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Геометрическое сжатие цепочки рассуждений через латентные траектории', 'desc': 'В статье предлагается A*-Thought-V2 — фреймворк, который моделирует цепочку рассуждений (CoT) как траекторию скрытых состояний языковой модели, позволяя выборочно сохранять явные шаги рассуждения или сжимать их в непрерывные латентные токены. Метод использует геометрический анализ в PCA-пространстве для оценки выравнивания каждого локального перехода с глобальным направлением от вопроса к решению: согласованные шаги остаются текстом, а отклоняющиеся шаги кодируются латентными токенами. Авторы вводят специальные техники обучения — степень встраивания и принудительное использование меток — которые позволяют латентным состояниям эффективно захватывать семантику и динамику рассуждений. Экспериментальные результаты показывают улучшение точности на 2.6%, сокращение длины ответа вдвое и трёхкратное повышение эффективности с точки зрения вычислений при значительном снижении времени обучения.'}, 'en': {'title': 'Optimizing Reasoning in LLMs with A*-Thought-V2', 'desc': 'A*-Thought-V2 enhances chain-of-thought reasoning in Large Language Models (LLMs) by modeling reasoning as hidden-state trajectories. This approach allows the model to selectively keep important reasoning steps or compress less critical ones into continuous latent tokens, improving both accuracy and efficiency. The method uses a geometric dynamics framework to analyze the alignment of reasoning steps with the overall question-to-solution direction, optimizing the reasoning process. Experiments demonstrate that A*-Thought-V2 significantly boosts accuracy while reducing computational costs and response lengths, making it a more efficient tool for reasoning tasks.'}, 'zh': {'title': 'A*-Thought-V2：高效推理的新方法', 'desc': 'A*-Thought-V2模型将链式思维推理建模为隐藏状态轨迹，能够选择性地保留明确的推理步骤或将其压缩为连续的潜在标记，从而提高准确性和效率。该模型通过几何动态框架，替代了传统的硬删除方法，采用显式-隐式交错的潜在架构来处理推理过程。实验结果表明，A*-Thought-V2在多个基准测试中提高了平均准确率，并显著减少了响应长度和计算成本。通过引入逐步嵌入强制和标签强制，模型能够更有效地学习推理步骤的特征。'}}}, {'id': 'https://huggingface.co/papers/2609.07414', 'title': 'RelightFormer: Feed-forward Generative Transformer for Multiview Object Relighting', 'url': 'https://huggingface.co/papers/2609.07414', 'abstract': 'Abstract A feed-forward generative Transformer enables direct single- and multi-view image relighting by injecting target illumination via cross-attention and processing unordered views with permutation-invariant encodings, trained on a large synthetic dataset.  Generated by thinkingmachines/Inkling-Small Image relighting is traditionally tackled via complex inverse rendering pipelines, which suffer from ill-posed optimization, or single-image generative models that ignore crucial multi-view cues necessary for understanding 3D geometry and material interactions. To address these limitations, we introduce a feed-forward generative Transformer for direct single- and multi-view image relighting that entirely bypasses explicit intrinsic property estimation. Adapted from a video foundation model, our architecture features a latent illumination module that dynamically injects target environment maps into spatial features via cross-attention. Furthermore, we employ permutation-invariant positional encodings to symmetrically process unordered multi-view inputs without sequential bias. To train this robust data-driven model, we construct the massive Laval Objaverse Dataset (LOD), comprising 90K objects and 39K unique illuminations. Extensive experiments demonstrate state-of-the-art visual quality, photorealistic relighting quality, and strong zero-shot generalization across single-view, multi-view, and novel-view relighting tasks.', 'score': 7, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '0dea0cab9821936d', 'authors': ['Hejun Wang', 'Jinxi Li', 'Junwei Jiang', 'Shiwei Mao', 'Hu Cheng', 'Shouwang Huang', 'Bo Yang'], 'affiliations': ['Shenzhen Research Institute, The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07414.jpg', 'data': {'categories': ['#3d', '#architecture', '#multimodal', '#dataset'], 'emoji': '💡', 'ru': {'title': 'Трансформер для фотореалистичного переосвещения через кросс-внимание и мультивидовые данные', 'desc': 'В статье предложен генеративный Transformer для переосвещения изображений, который работает прямым методом без явного оценивания внутренних свойств материала и геометрии. Модель использует кросс-внимание (cross-attention) для внедрения целевых карт освещения и применяет перестановочно-инвариантные кодирования позиций для обработки неупорядоченных мультивидовых входов. Архитектура адаптирована из видеофундаментальной модели и включает модуль латентного освещения, который динамически инжектирует окружающие карты в пространственные признаки. Модель обучена на большом синтетическом датасете Laval Objaverse (90K объектов, 39K уникальных освещений) и демонстрирует лучший результат в переосвещении с нулевым обучением.'}, 'en': {'title': 'Revolutionizing Image Relighting with Generative Transformers', 'desc': 'This paper presents a novel feed-forward generative Transformer designed for image relighting, which allows for both single and multi-view scenarios. It utilizes cross-attention to inject target illumination directly into the image features, avoiding the need for complex inverse rendering techniques. The model processes unordered views using permutation-invariant encodings, ensuring that the input order does not affect the output. Trained on the extensive Laval Objaverse Dataset, the model achieves high-quality, photorealistic relighting and demonstrates impressive generalization capabilities across various relighting tasks.'}, 'zh': {'title': '前馈生成Transformer：图像重光照的新突破', 'desc': '这篇论文介绍了一种前馈生成Transformer模型，用于直接进行单视图和多视图图像重光照。该模型通过交叉注意力机制注入目标光照，并使用置换不变编码处理无序视图，避免了复杂的逆渲染流程。研究者们构建了一个大型合成数据集Laval Objaverse Dataset (LOD)，包含90,000个物体和39,000种独特光照，以训练这个模型。实验结果表明，该模型在视觉质量、照片级重光照质量和零样本泛化能力方面达到了最先进的水平。'}}}, {'id': 'https://huggingface.co/papers/2609.09140', 'title': 'NOAH: Learning the Full Patient Journey. A Longitudinal Multimodal Time-Aware Model for Representation and Forecasting', 'url': 'https://huggingface.co/papers/2609.09140', 'abstract': 'Abstract NOAH is a generative transformer that models full multimodal patient journeys with continuous time dynamics and stochastic latent states, enabling forecasting, zero-shot classification, and counterfactual simulation across diverse clinical data.  Generated by thinkingmachines/Inkling-Small The digitization of healthcare has generated vast, longitudinal, and multimodal patient records over a lifetime, yet fully exploiting these data to represent and predict patient state trajectories remains a critical challenge. Current AI models often struggle to capture the complex, irregular temporal dynamics and inherent stochasticity of real-world multimodal patient data. Existing AI approaches for modeling longitudinal patient records are predominantly discriminative, limited to a few modalities, constrained by closed categorical vocabularies, treating time as a monotonic inductive bias, or they are limited in forecasting future patient states. We introduce NOAH, a time-aware, task-agnostic, generative transformer model representing and forecasting the full multimodal patient journey. NOAH features a novel bidirectional time integration and a variational latent space to capture the continuous evolution of patient states and the stochasticity of clinical trajectories. Built from over 559 million clinical events from 431,000 hospital visits of 299,000 patients across the MIMIC dataset family, NOAH natively processes medical images, time-series and numeric signals, categorical events, as well as structured and unstructured clinical records. NOAH is the first truly holistic generative model in its field, enabling autoregressive forecasting with optional time control, zero-shot classification, and counterfactual intervention simulation. It generates highly informative and predictive patient state representations that demonstrate strong performance in probing for clinical outcomes, 15 ICD chapters, and 29 comorbidities, as well as in time-to-event prediction. Seamlessly handling diverse modalities and complex temporal dynamics, NOAH provides a versatile, task-agnostic, scalable foundation for intelligent predictive systems in personalized clinical care and digital medicine.', 'score': 1, 'issue_id': 3246, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'dc450e5c3b0758ab', 'authors': ['Tobias Susetzky', 'Raphael Rehms', 'Dmitrii Seletkov', 'Özgün Turgut', 'Michelle Espranita Liman', 'Lisa Steinhelfer', 'Rickmer Braren', 'Daniel Rueckert'], 'affiliations': ['Imperial College', 'Institute for Diagnostic and Interventional Neuroradiology, TUM University Hospital', 'Institute for Diagnostic and Interventional Radiology, TUM University Hospital', 'Munich Center for Machine Learning (MCML)', 'TUM University Hospital', 'Technical University of Munich (TUM)', 'University Medical Center Hamburg-Eppendorf'], 'pdf_title_img': 'assets/pdf/title_img/2609.09140.jpg', 'data': {'categories': ['#science', '#healthcare', '#multimodal', '#architecture', '#training', '#dataset'], 'emoji': '🏥', 'ru': {'title': 'Генеративный трансформер для прогнозирования многомодальных траекторий пациентов', 'desc': 'NOAH — это генеративная трансформер-модель, которая моделирует полные многомодальные траектории пациентов с непрерывной динамикой времени и стохастическими латентными состояниями. Модель обучена на более чем 559 миллионах клинических событий из датасета MIMIC и может обрабатывать медицинские изображения, временные ряды, категориальные события и неструктурированные записи. NOAH решает задачи прогнозирования будущих состояний пациентов, нулевошагового классифицирования и контрфактического моделирования вмешательств. Моделью достигнуто качественное предсказание клинических исходов и генерация информативных представлений состояния пациента в условиях сложной многомодальной медицинской информации.'}, 'en': {'title': 'Revolutionizing Patient Journey Forecasting with NOAH', 'desc': 'NOAH is a generative transformer model designed to analyze and predict patient journeys using diverse clinical data. It addresses the challenges of irregular time dynamics and the stochastic nature of patient records by employing a novel bidirectional time integration and a variational latent space. This model can handle various data types, including medical images and time-series data, allowing for accurate forecasting and classification without prior task-specific training. By leveraging a vast dataset, NOAH offers a comprehensive approach to understanding patient trajectories, making it a powerful tool for personalized healthcare and predictive analytics.'}, 'zh': {'title': 'NOAH：全面模拟患者旅程的生成模型', 'desc': 'NOAH是一种生成性变换器模型，能够模拟患者的多模态旅程，考虑时间动态和随机潜在状态。它可以进行预测、零样本分类和反事实模拟，处理各种临床数据。NOAH通过双向时间整合和变分潜在空间，捕捉患者状态的连续演变和临床轨迹的随机性。该模型基于大量临床事件数据，提供了一种全面的生成模型，为个性化临床护理和数字医学中的智能预测系统奠定了基础。'}}}, {'id': 'https://huggingface.co/papers/2609.03209', 'title': 'MasterControl Seventeen Every Time', 'url': 'https://huggingface.co/papers/2609.03209', 'abstract': 'Abstract A governed analytics framework pairs language models for intent interpretation with deterministic policy execution of pre-approved programs, achieving full answer-and-evidence reliability where runtime-planning agents failed.  Generated by thinkingmachines/Inkling-Small We study a governed approach to enterprise analytics: a language model interprets the question, while deterministic policy selects and runs a pre-approved analytical program that returns both results and evidence. We show that this restriction can remain expressive within a defined analytical class, using relational operations plus aggregation, comparison, windows, ranking, and similarity. Fixed meaning, policy, data, and execution rules also make results replayable. Across 440 runs, three 8B models generated SQL and selected tools at runtime, while Qwen3-8B interpreted intent only and policy executed the approved program. None of 330 runtime-planning episodes matched the full answer-and-evidence contract across all test datasets; the policy-executed analyzer matched 110 of 110. This is a configuration-specific result, not evidence that runtime agents cannot succeed under other designs.', 'score': 1, 'issue_id': 3245, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '7a288885bb09f76a', 'authors': ['MasterControl AI Lab'], 'affiliations': ['MasterControl AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2609.03209.jpg', 'data': {'categories': ['#small_models', '#agents'], 'emoji': '🔒', 'ru': {'title': 'Управляемая аналитика вместо хаотичного планирования агентов', 'desc': 'В статье предложена архитектура управляемой аналитики, которая сочетает языковые модели для интерпретации намерений пользователей с детерминированным выполнением предварительно одобренных аналитических программ. Языковая модель понимает вопрос и формируетIntent, а затем политика выбирает и исполняет фиксированную программу, возвращая как результаты, так и доказательства. Авторы показывают, что такой подход обеспечивает полную воспроизводимость и надёжность ответов благодаря фиксированным правилам выполнения и данным. Экспериментальные результаты демонстрируют, что управляемый подход превосходит агентов с runtime-планированием: при стопроцентном успехе на всех тестовых наборах данных в управляемой системе против нулевого совпадения полного контракта ответ-доказательство в агентах.'}, 'en': {'title': 'Reliable Analytics through Governed Language Models and Policies', 'desc': 'This paper presents a governed analytics framework that combines language models for understanding user intent with deterministic policies for executing pre-approved analytical programs. By using this approach, the framework ensures reliable answers and evidence, overcoming limitations faced by runtime-planning agents. The study demonstrates that even with fixed rules for meaning, policy, and execution, the system can still perform complex analytical tasks using relational operations and aggregations. The results show that the policy-executed analyzer consistently meets the full answer-and-evidence requirements, highlighting the effectiveness of this governed approach in enterprise analytics.'}, 'zh': {'title': '受控分析框架：可靠的答案与证据', 'desc': '这篇论文提出了一种受控的分析框架，将语言模型与确定性策略执行相结合，以实现完全的答案和证据可靠性。该框架中，语言模型负责理解问题，而确定性策略选择并运行预先批准的分析程序，返回结果和证据。研究表明，这种限制在定义的分析类别内仍然具有表现力，能够进行关系操作、聚合、比较、窗口、排名和相似性分析。通过440次运行，三种8B模型生成SQL并在运行时选择工具，而Qwen3-8B仅负责意图解释，政策执行批准的程序，结果显示政策执行的分析器在所有测试数据集上完全符合答案和证据的要求。'}}}, {'id': 'https://huggingface.co/papers/2609.06140', 'title': 'Counter-Swarm Doctrine: Containing Coordinated Agent Intrusions', 'url': 'https://huggingface.co/papers/2609.06140', 'abstract': 'Abstract  Agents can turn shared infrastructure into a channel for coordinated intrusion. The Hugging Face incident and a separate public-wiki investigation show why a security assessment may need evidence from several executions and the artifacts they leave behind. We argue that the operational unit of defence should be a revisable coordination episode linking observed transfers, task authority, and response history. The central research problem is prospective episode discovery: finding which actions belong together before an evaluator supplies their membership. We define unsanctioned coordination relative to collaboration and delegated-authority policy, connect storage-mediated coordination to stigmergy, and specify the evidence needed to distinguish influence from common causes. First-contact signals are one possible input to discovery; the design also follows inherited state and later use. A proposed evaluation compares isolated actions, rolling windows, known groups, and prospectively discovered episodes at matched review cost and false-alert workload. It measures harmful outcomes across all assigned population runs and tests recurrence after channel closure and state quarantine. A checksum-verified reconstruction of the public wiki export separates the decline in retained writes from later administrative cleanup. The contribution is an incident-grounded position, descriptive analysis, and evaluation design. It makes the recommendation to monitor across executions testable without claiming a new detector or a measured containment benefit.', 'score': 0, 'issue_id': 3245, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '29895bc57c146d8d', 'authors': ['Gregory N Frank'], 'affiliations': ['MoltAI Corp'], 'pdf_title_img': 'assets/pdf/title_img/2609.06140.jpg', 'data': {'categories': ['#security'], 'emoji': '🕵️', 'ru': {'title': 'Обнаружение скоординированных атак через анализ эпизодов взаимодействия в общей инфраструктуре', 'desc': 'Статья рассматривает проблему скоординированных атак через общую инфраструктуру, когда несколько агентов взаимодействуют для несанкционированного доступа. Авторы предлагают концепцию «эпизода координации» как основной единицы защиты, которая связывает наблюдаемые передачи данных, полномочия и историю ответных действий. Центральная задача исследования — прогностическое обнаружение эпизодов: определение того, какие действия относятся к скоординированной атаке до момента, когда эксперт подтвердит их связь. Работа включает описательный анализ инцидентов, рекомендации по мониторингу между выполнениями и методологию оценки, которая учитывает различные сценарии обнаружения и затраты на проверку.'}, 'en': {'title': 'Uncovering Hidden Threats Through Episode Discovery', 'desc': "This paper discusses how agents can exploit shared systems for coordinated attacks, highlighting the need for thorough security assessments that consider multiple instances of behavior. It introduces the concept of 'prospective episode discovery', which aims to identify related actions before they are officially categorized. The authors propose a framework for evaluating these episodes by analyzing various types of actions and their contexts, focusing on distinguishing between legitimate collaboration and unauthorized coordination. The study emphasizes the importance of monitoring behaviors over time to improve security without relying on new detection methods."}, 'zh': {'title': '前瞻性事件发现：提升安全评估的有效性', 'desc': '本文探讨了如何利用共享基础设施进行协调入侵的安全评估。研究提出了一个新的防御操作单元，即可修订的协调事件，旨在将观察到的转移、任务权限和响应历史联系起来。核心研究问题是前瞻性事件发现，即在评估者提供成员资格之前，找出哪些行为是相关的。文章还提出了一种评估设计，比较孤立行为、滚动窗口、已知群体和前瞻性发现的事件，以测量有害结果。'}}}, {'id': 'https://huggingface.co/papers/2609.04942', 'title': 'Learning 3D Editing without Paired Supervision via Generative Prior Distillation', 'url': 'https://huggingface.co/papers/2609.04942', 'abstract': 'Abstract A feed-forward 3D editing framework distills visual, semantic, and geometric priors from foundation models via differentiable rendering and 3D-aware distribution matching to avoid paired training data.  Generated by thinkingmachines/Inkling-Small Instruction-guided 3D editing is essential for interactive content creation, yet it faces a significant bottleneck: the severe scarcity of high-quality paired training data. Existing approaches attempt to bypass this by either relying on slow test-time optimization or training on pseudo-pairs constructed via complex pipelines, which often introduce structural drift and geometric artifacts. In this paper, we propose a novel framework that learns feed-forward 3D editing without paired 3D supervision via Generative Prior Distillation. Instead of relying on ground-truth 3D pairs, our core idea is to distill visual, semantic, and geometric knowledge from powerful foundation models directly into a 3D editing model. Specifically, through a differentiable rendering pipeline, we supervise the 3D representation using two complementary signals: a 2D visual prior from an image editing model at the main editing view, and a semantic prior from a Vision-Language Model at novel views to ensure strict instruction following and source identity preservation. Crucially, to address the geometric collapse and multi-view inconsistencies inherent in 2D projection supervision, we introduce a 3D-aware Distribution Matching regularization. Acting as a geometric prior, this term operates in the 3D latent space, constraining the edited output to remain within the manifold of realistic 3D assets defined by a pretrained image to 3D teacher model. Extensive experiments demonstrate that our method achieves superior instruction fidelity and cross-view consistency, significantly outperforming state-of-the-art baselines. Our project is available at: https://github.com/thiamine128/PriorEdit3D.', 'score': 0, 'issue_id': 3245, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '6ce71719c17d916b', 'authors': ['Hao Wen', 'Weibin Yun', 'Hongxing Fan', 'Haotian Lu', 'Rui Chen', 'Zehuan Huang', 'Lu Sheng'], 'affiliations': ['Beihang University, China', 'Beijing Key Laboratory of Intelligent Creative Content Generation and Immersive Experience, China', 'Central University of Finance and Economics, China', 'VAST, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.04942.jpg', 'data': {'categories': ['#training', '#multimodal', '#3d'], 'emoji': '🎨', 'ru': {'title': 'Редактирование 3D без парных данных через дистилляцию знаний фундаментальных моделей', 'desc': 'В работе предложен фреймворк для редактирования 3D-объектов по текстовым инструкциям без необходимости в парных данных для обучения. Авторы используют дистилляцию знаний из мощных фундаментальных моделей (image editing model и Vision-Language Model) через дифференцируемый рендеринг. Для решения проблемы геометрических артефактов введена специальная регуляризация 3D-aware Distribution Matching, которая ограничивает редактированный результат многообразием реалистичных 3D-ассетов. Метод демонстрирует высокую точность следования инструкциям и консистентность между различными видами объекта.'}, 'en': {'title': 'Revolutionizing 3D Editing with Unpaired Learning', 'desc': 'This paper presents a new framework for 3D editing that does not require paired training data, which is often hard to obtain. It uses a technique called Generative Prior Distillation to extract visual, semantic, and geometric knowledge from existing foundation models. The framework employs a differentiable rendering pipeline to guide the 3D model using both 2D visual cues and semantic information, ensuring that edits follow instructions accurately. Additionally, it introduces a 3D-aware Distribution Matching regularization to maintain geometric consistency across different views, leading to improved results compared to existing methods.'}, 'zh': {'title': '无配对3D编辑的新方法', 'desc': '本文提出了一种前馈式3D编辑框架，通过可微渲染和3D感知分布匹配，从基础模型中提取视觉、语义和几何先验，以避免使用配对训练数据。该方法不依赖于真实的3D配对，而是直接将强大的基础模型中的知识蒸馏到3D编辑模型中。通过引入3D感知分布匹配正则化，确保编辑输出保持在真实3D资产的流形内，从而解决了2D投影监督中的几何崩溃和多视图不一致性问题。实验结果表明，该方法在指令遵循和跨视图一致性方面显著优于现有的最先进方法。'}}}];

        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (5)', '#agents (9)', '#agi', '#alignment (3)', '#architecture (13)', '#audio (3)', '#benchmark (16)', '#cv (7)', '#data (1)', '#dataset (13)', '#diffusion (2)', '#ethics', '#games', '#graphs (1)', '#hallucinations', '#healthcare (2)', '#inference (6)', '#interpretability (3)', '#leakage', '#long_context (2)', '#low_resource (1)', '#machine_translation (1)', '#math (1)', '#multilingual (1)', '#multimodal (17)', '#open_source (8)', '#optimization (10)', '#plp (2)', '#rag', '#reasoning (5)', '#rl (8)', '#rlhf (2)', '#robotics (6)', '#science (2)', '#security (3)', '#small_models (4)', '#story_generation (1)', '#survey (1)', '#synthetic (3)', '#training (22)', '#transfer_learning (2)', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-09 18:15',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-09 18:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-09 18:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
