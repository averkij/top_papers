e outcome and uses that observation to change a subsequent operation within the current task. At L4 Experience-Adaptive Control, it retains experience from completed tasks and uses that experience to change decisions on future tasks. L0 Fixed Support separately denotes generators, editors, evaluators, reward models, benchmarks, and fixed pipelines without a deployed controller that makes generation-level decisions. These levels describe a progressively broader decision-making scope rather than model size, system complexity, output quality, tool or role count, or training method. Applying this framework across image, video, editing, 3D, world, slide, and user-interface generation reveals how controller capabilities have evolved and how their mechanisms are distributed across levels.", 'score': 24, 'issue_id': 3243, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': 'bf2ca47c359f66ff', 'authors': ['Yinming Huang', 'Shuyuan Tu', 'Xi Yan', 'Jiahao Zhan', 'Zihan Yang', 'Zhen Xing', 'Hui Zhang', 'Tiehua Zhang', 'Yu-Gang Jiang', 'Zuxuan Wu'], 'affiliations': ['CUHK, MMLab', 'Fudan University', 'Shanghai Innovative Institute'], 'pdf_title_img': 'assets/pdf/title_img/2609.06758.jpg', 'data': {'categories': ['#video', '#3d', '#rl', '#survey', '#multimodal', '#cv', '#agents'], 'emoji': '🎮', 'ru': {'title': 'От генератора к агенту: четыре уровня контроля над визуальной генерацией', 'desc': 'Статья предлагает четырёхуровневую классификацию агентных систем генерации изображений на основе того, какие решения может принимать контроллер (обычно LLM или VLM) в процессе создания визуального контента. Уровни варьируются от простого кондиционирования входных данных (L1) до адаптивного управления, основанного на накопленном опыте из предыдущих задач (L4). Авторы утверждают, что истинная агентность системы определяется не сложностью архитектуры или методом обучения, а именно объёмом прямого контроля, который контроллер имеет над операциями генерации. Применение этой классификации к различным типам генерации (изображения, видео, редактирование, 3D) показывает эволюцию возможностей контроллеров и распределение их механизмов по разным уровням.'}, 'en': {'title': 'Evolving Control in Visual Generation: A Four-Level Framework', 'desc': "This paper introduces a four-level framework for classifying agentic visual generation based on the control a controller has over generation processes. It distinguishes between different levels of decision-making, from basic input conditioning to advanced experience-adaptive control, where the controller learns from past tasks. The framework highlights how existing systems often lack a clear definition of agenticity, which is the ability of a controller to make decisions during generation. By organizing the field according to the controller's direct control, the paper provides insights into the evolution of visual generation capabilities across various applications."}, 'zh': {'title': '自主视觉生成的四级框架', 'desc': '本文提出了一个四级框架，用于分类控制器在视觉生成中的决策范围，从固定支持到经验自适应控制。视觉生成正从单次调用的生成模型演变为能够规划、选择工具、检查中间输出、修正失败和重用经验的自主控制过程。现有系统中，控制器通常是大型语言模型（LLM）或视觉语言模型（VLM），而视觉生成模型则作为工具或执行者。然而，现有研究缺乏一致的标准来判断生成系统何时变得具有自主性。'}}}, {'id': 'https://huggingface.co/papers/2609.07816', 'title': 'Kalman Delta Networks: Uncertainty-aware Associative Memory', 'url': 'https://huggingface.co/papers/2609.07816', 'abstract': 'Abstract Kalman Delta Networks reformulate linear attention as a linear-Gaussian state-space model with Kalman-filter updates to track memory uncertainty, yielding efficient scan-compatible approximations that improve language modeling performance.  Generated by thinkingmachines/Inkling-Small Linear attention is increasingly used in frontier language models for efficient long-context inference and constant-memory decoding. Its fixed-size recurrent memory, however, requires an online decision at each token: what to write and how strongly to overwrite existing associations before knowing which information future queries will require. Delta-rule models learn this strength from the current token embedding but do not track confidence in the memory estimate, preventing each write from adapting to accumulated evidence. To represent this uncertainty explicitly, we reformulate recurrent associative memory as a linear--Gaussian state-space model, for which the Kalman filter is the optimal recursive estimator, and introduce a new family of models, Kalman Delta Networks (KDNs). Within KDNs, the transition propagates both the memory state and its uncertainty, allowing the Kalman gain to weight each residual write by accumulated evidence and observation reliability. Under this formulation, Delta-style updates emerge as a special case that substitutes a token-wise isotropic surrogate for predictive covariance and omits covariance tracking. Exact tracking, however, entails a dense, state-dependent Riccati recursion that is poorly suited to GPU-parallel linear-attention scans. To address this issue, we introduce two scan-compatible KDN approximations. Diagonal KDN projects each one-step posterior onto the diagonal Gaussian family through online mean-field variational inference, whereas Isotropic KDN uses an isotropic approximation with a single uncertainty scalar per head. Their uncertainty recurrences are Mobius maps, enabling associative scans with logarithmic parallel depth. Across controlled pretraining at 750M and 1.3B parameters, KDN variants consistently improve perplexity and mean downstream accuracy over state-of-the-art linear-attention models.', 'score': 23, 'issue_id': 3243, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '87d30e7056e2d3ba', 'authors': ['Ngoc Bui', 'Tinglin Huang', 'Rex Ying'], 'affiliations': ['Department of Computer Science, Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07816.jpg', 'data': {'categories': ['#long_context', '#small_models', '#architecture', '#training', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Отслеживание неопределённости в линейном внимании через фильтр Калмана', 'desc': 'В этой работе предлагается новый подход к линейному вниманию, основанный на переформулировке рекуррентной ассоциативной памяти как линейно-гауссовской модели пространства состояний. Авторы вводят фильтр Калмана для оптимального рекурсивного оценивания, который отслеживает неопределённость памяти и взвешивает обновления в зависимости от накопленных свидетельств. Для эффективной реализации на GPU предлагаются две аппроксимации: диагональная и изотропная версии сетей Kalman Delta, которые совместимы с параллельными сканированиями. Экспериментальная оценка показывает, что предложенные модели улучшают перплексию и качество на downstream-задачах в сравнении с современными методами линейного внимания.'}, 'en': {'title': 'Enhancing Memory Uncertainty in Language Models with Kalman Delta Networks', 'desc': 'Kalman Delta Networks (KDNs) introduce a new way to handle memory uncertainty in linear attention models by using a linear-Gaussian state-space framework. This approach allows the model to track how confident it is about the information stored in memory, improving the decision-making process for writing and updating memory with each new token. By employing the Kalman filter, KDNs can weigh updates based on accumulated evidence, leading to more accurate language modeling. The paper also presents efficient approximations for KDNs that maintain performance while being compatible with fast processing techniques like GPU-parallel scans.'}, 'zh': {'title': '卡尔曼增量网络：提升语言模型性能的创新方法', 'desc': '卡尔曼增量网络（KDN）将线性注意力重新构建为线性-高斯状态空间模型，并使用卡尔曼滤波器更新来跟踪记忆的不确定性。这种方法提高了语言建模的性能，并提供了高效的扫描兼容近似。KDN能够在每次写入时根据累积证据和观察可靠性来调整记忆更新的强度，从而显著改善了记忆的适应性。通过对750M和1.3B参数的控制预训练，KDN变体在困惑度和下游任务准确性上均优于最先进的线性注意力模型。'}}}, {'id': 'https://huggingface.co/papers/2609.08404', 'title': 'Environments as Scaffold: Enriching Feedback to Bootstrap Self-Evolving Agents in Long-Horizon Tasks', 'url': 'https://huggingface.co/papers/2609.08404', 'abstract': 'Abstract Feedback-Enriched Environments adapt task settings to provide observation-level guidance, improving reinforcement learning stability and exploration for long-horizon agent tasks.  Generated by thinkingmachines/Inkling-Small Large Language Models demonstrate remarkable proficiency in static reasoning, yet training them as autonomous agents through Reinforcement Learning (RL) for long-horizon tasks is often hindered by severe reward sparsity. While conventional agent-side warming up via supervised fine-tuning (SFT) can alleviate this, it is frequently limited by data scarcity and constrained exploration. To address this, we propose a paradigm shift to environment-side adaptation by constructing Feedback-Enriched Environments (FEEs). Through a pilot study, we establish a feedback design strategy that reformulates environments by transitioning from action guidance to observation enrichment during the later stages of both intra-episode exploration and inter-episode evolution. Large-scale experiments on SciWorld and BFCL benchmarks using various Qwen3 model scales and RL algorithms such as GRPO, GSPO, and DAPO demonstrate that FEEs consistently yield performance improvements over standard settings. Furthermore, our analysis reveals that training with FEEs (1) stabilizes training dynamics by reducing entropy volatility, (2) facilitates proactive state-space exploration in difficult tasks, (3) ensures the internalization of environmental guidance into policy weights rather than acting as a mere inference-time prior, and (4) identifies intra-group feedback consistency as a critical boundary for stable optimization.', 'score': 21, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '1e7c645daa60606f', 'authors': ['Hongbang Yuan', 'Zhuoran Jin', 'Yixin Cao'], 'affiliations': ['CASIA', 'Fudan University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2609.08404.jpg', 'data': {'categories': ['#science', '#training', '#rl', '#reasoning', '#agents', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Адаптация среды вместо агента: как обогащённая обратная связь улучшает обучение больших языковых моделей', 'desc': 'В этой работе предлагается новый подход к обучению больших языковых моделей в качестве автономных агентов через reinforcement learning путём адаптации самой среды, а не только агента. Авторы вводят концепцию Feedback-Enriched Environments (FEE) — сред, обогащённых обратной связью, которые предоставляют наблюдение-уровневые подсказки вместо традиционных рекомендаций по действиям. Экспериментальные результаты на бенчмарках SciWorld и BFCL показывают, что FEE значительно улучшают стабильность обучения, снижают волатильность энтропии и способствуют лучшей исследовательской поведению агента. Ключевое преимущество заключается в том, что окружение направляет обучение таким образом, чтобы полученные знания интегрировались в веса политики, а не использовались только во время инференса.'}, 'en': {'title': 'Enhancing RL Stability with Feedback-Enriched Environments', 'desc': 'This paper introduces Feedback-Enriched Environments (FEEs) to enhance reinforcement learning (RL) for long-horizon tasks by providing observation-level guidance. Traditional methods often struggle with reward sparsity, but FEEs adapt the environment to improve agent exploration and stability. The authors demonstrate that FEEs lead to better training dynamics, allowing agents to explore state spaces more effectively and internalize guidance into their policies. Experiments show that using FEEs consistently outperforms standard training methods across various benchmarks and RL algorithms.'}, 'zh': {'title': '反馈增强环境：提升强化学习的稳定性与探索能力', 'desc': '本文提出了一种反馈增强环境（FEEs），旨在通过提供观察级别的指导来改善强化学习的稳定性和探索能力，特别是在长时间任务中。传统的监督微调方法虽然可以缓解奖励稀疏的问题，但常常受到数据稀缺和探索受限的限制。我们通过实验验证了FEEs的有效性，发现其能够稳定训练动态，促进在困难任务中的主动状态空间探索，并确保环境指导被内化到策略权重中。我们的研究表明，组内反馈一致性是实现稳定优化的关键因素。'}}}, {'id': 'https://huggingface.co/papers/2609.08345', 'title': 'CoVeR: Coverage-Based Token Pruning for Multi-View 3D Reasoning in VLMs', 'url': 'https://huggingface.co/papers/2609.08345', 'abstract': 'Abstract CoVeR is a training-free spatial token selector that preserves 3D reasoning performance by enforcing exact budgets and full scene coverage across multi-view visual tokens.  Generated by thinkingmachines/Inkling-Small Representing a 3D scene as multi-view images allows 2D VLMs to reason in 3D by reusing priors from pre-training, sidestepping the scarcity of annotated 3D data. However, it produces thousands of redundant visual tokens whose cost grows with every view. Existing visual token pruners fall into two families, each limited in the 3D multi-view setting. Learned importance methods rank tokens by attention or encoder features; because redundancy here is fundamentally spatial, they keep near-duplicate tokens from a few prominent regions and leave most of the scene unrepresented. Voxelization methods improve spatial coverage but cannot enforce an exact token budget and saturate as multi-view observations overlap in 3D, capping retention well below the target. We show that spatial coverage is associated with 3D reasoning performance and introduce CoVeR, a deterministic, training-free selector that uses only token coordinates, with no learned signals. CoVeR selects tokens that collectively cover every region of the scene, and solves the limitations of both families: it enforces an exact per-scene budget, breaks the voxelization saturation plateau, and avoids the near-duplicate selections of learned importance. Extensive experiments show CoVeR outperforms prior SOTAs on all three 3D reasoning benchmarks and generalizes as a plug-and-play module tested across four VLMs. Notably, with only approx8% of visual tokens, it preserves 93.5% of full-token performance, surpassing SOTA by 3.9 percentage points on average across benchmarks.', 'score': 20, 'issue_id': 3244, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '84d4a1cbbc05bc3c', 'authors': ['Nhat-Tan Bui', 'Varshini Elangovan', 'Arun Reddy Anugu', 'Sreyas Mohan', 'Wei Ye', 'Dilin Wang', 'JQ Huang', 'Rakesh Ranjan', 'Aviral Chharia', 'Fernando De la Torre'], 'affiliations': ['Carnegie Mellon University', 'Meta Reality Labs'], 'pdf_title_img': 'assets/pdf/title_img/2609.08345.jpg', 'data': {'categories': ['#3d', '#inference', '#benchmark', '#multimodal'], 'emoji': '🎯', 'ru': {'title': 'Полное покрытие сцены при минимальном количестве токенов', 'desc': 'CoVeR — это метод отбора пространственных токенов, который не требует обучения и сохраняет качество трёхмерного рассуждения путём поддержания строгого бюджета токенов и полного покрытия сцены. Авторы показали, что при представлении 3D сцен в виде мультиракурсных изображений возникает проблема избыточных визуальных токенов, которые существующие методы либо выбирают по важности (оставляя дубликаты из выделенных регионов), либо используют воксельное представление (которое насыщается и не может обеспечить точный бюджет). Предложенный детерминированный алгоритм использует только пространственные координаты токенов без обучаемых параметров, обеспечивая равномерное покрытие всей сцены и точное количество выбранных токенов. Экспериментальные результаты демонстрируют, что CoVeR достигает 93,5% производительности полного набора токенов, используя всего 8% токенов, что превосходит существующие методы на всех трёх бенчмарках для 3D рассуждений.'}, 'en': {'title': 'Efficient 3D Reasoning with CoVeR: Smart Token Selection!', 'desc': 'CoVeR is a novel method for selecting visual tokens in 3D reasoning tasks without the need for training. It addresses the issue of redundant tokens generated from multi-view images by ensuring that every part of a scene is represented while adhering to a strict budget. Unlike existing methods that either focus on learned importance or voxelization, CoVeR uses spatial coordinates to select tokens, effectively covering the entire scene without duplication. Experiments demonstrate that CoVeR significantly enhances performance on 3D reasoning benchmarks while using only a fraction of the visual tokens, outperforming state-of-the-art methods.'}, 'zh': {'title': 'CoVeR：高效的3D推理令牌选择器', 'desc': 'CoVeR是一种无需训练的空间令牌选择器，能够在多视图视觉令牌中保持3D推理性能。它通过强制执行精确的预算和全面的场景覆盖，解决了现有视觉令牌剪枝方法的局限性。CoVeR仅使用令牌坐标进行选择，避免了冗余选择，并确保每个场景的令牌数量符合预设预算。实验表明，CoVeR在所有3D推理基准测试中表现优于现有的最先进技术，且在仅使用约8%的视觉令牌时，仍能保持93.5%的完整令牌性能。'}}}, {'id': 'https://huggingface.co/papers/2609.05324', 'title': 'RoboSPA: Can VLA Models Go Beyond Simple Scenes and Short-Horizon Tasks?', 'url': 'https://huggingface.co/papers/2609.05324', 'abstract': 'Abstract RoboSPA is a large-scale robotic manipulation benchmark that evaluates vision-language-action models on fine-grained spatial reasoning and long-horizon procedural planning across progressively harder task variants.  Generated by thinkingmachines/Inkling-Small Vision-Language-Action (VLA) models have shown promising progress in language-conditioned robotic manipulation. However, existing datasets and benchmarks mainly evaluate task completion under predefined settings, offering limited insight into model reasoning under increasing spatial and procedural complexity. We introduce RoboSPA (Robot Spatial-Procedural Assessment), a large-scale robotic manipulation dataset and benchmark for diagnosing embodied reasoning in VLA models. RoboSPA focuses on two core dimensions, Fine-Grained Spatial Reasoning and Long-Horizon Procedural Planning, covering 10 task categories and 56 base tasks. Each task is instantiated across five difficulty levels, yielding 280 variants with increasing spatial ambiguity and procedural complexity. We collect 527K trajectories across multiple embodiments and diverse scenes. Beyond binary success rate, RoboSPA introduces diagnostic metrics for more detailed evaluation. Experiments on representative VLA models show that current systems still struggle with complex spatial relations, precise low-level execution, and memory-intensive planning. These results establish RoboSPA as a challenging diagnostic benchmark for developing more capable, reliable, and generalizable embodied agents. Our data and code are available at https://github.com/fanzhenxuan/RoboSPA.', 'score': 20, 'issue_id': 3244, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': 'c88d9c742c17ca9d', 'authors': ['Zhenxuan Fan', 'Bo Zhang', 'Yutong Lin', 'Yuqian Yuan', 'Juekai Lin', 'Liang Liang', 'Zhuoyi Huang', 'Wenqiao Zhang', 'Juncheng Li', 'Siliang Tang', 'Jun Xiao', 'Yueting Zhuang'], 'affiliations': ['South China Normal University', 'University of Electronic Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.05324.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#agents', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Диагностический бенчмарк для оценки пространственного мышления роботов', 'desc': 'RoboSPA — это крупномасштабный бенчмарк для оценки vision-language-action моделей в задачах роботизированного манипулирования. Датасет содержит 527K траекторий, охватывающих 10 категорий задач с 280 вариантами возрастающей сложности, сосредоточенные на пространственных рассуждениях и долгосрочном планировании. Авторы предлагают диагностические метрики для детальной оценки способности моделей справляться со сложными пространственными отношениями и многошаговым планированием. Эксперименты показывают, что современные VLA модели испытывают трудности с точным исполнением и памятно-интенсивным планированием, что открывает направления для развития более надежных воплощенных агентов.'}, 'en': {'title': 'RoboSPA: Advancing Robotic Manipulation through Complex Reasoning Challenges', 'desc': 'RoboSPA is a new benchmark designed to test robotic manipulation models that use vision and language to understand and perform tasks. It focuses on two main areas: Fine-Grained Spatial Reasoning, which involves understanding complex spatial relationships, and Long-Horizon Procedural Planning, which is about planning actions over a longer sequence of steps. The benchmark includes a wide variety of tasks with increasing difficulty, allowing researchers to evaluate how well models can handle more complex scenarios. By providing detailed diagnostic metrics, RoboSPA aims to help improve the development of more capable and reliable robotic systems.'}, 'zh': {'title': 'RoboSPA：机器人操作的新基准挑战', 'desc': 'RoboSPA是一个大规模的机器人操作基准，旨在评估视觉-语言-动作模型在细粒度空间推理和长远程序规划方面的能力。该基准通过10个任务类别和56个基础任务，涵盖了五个难度级别，共生成280个变体，以测试模型在空间模糊性和程序复杂性增加时的表现。RoboSPA不仅关注任务完成率，还引入了诊断指标，以便更详细地评估模型的推理能力。实验结果表明，当前的视觉-语言-动作模型在处理复杂空间关系、精确低级执行和内存密集型规划方面仍然面临挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.09158', 'title': 'TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model', 'url': 'https://huggingface.co/papers/2609.09158', 'abstract': 'Abstract TANGO is a vision-language framework that predicts whole-body joint actions for humanoid robots to navigate cluttered indoor environments using only simulated training data.  Generated by thinkingmachines/Inkling-Small We study the problem of navigating cluttered indoor environments with a humanoid robot. Unlike conventional methods that model navigation as a 2D path planning problem, humanoid traversal in cluttered environments requires continuous geometry-aware whole-body adaptation, including coordinated arm placement, torso adjustment, and gait modulation for collision-free movement through complex 3D spaces. We introduce TANGO, the first whole-body vision-language navigation framework for language-conditioned humanoid traversal in cluttered environments. Given a natural-language instruction and egocentric RGB observations, TANGO directly predicts 29-DoF joint-space actions for downstream whole-body control. We train TANGO entirely in simulation by synthesizing diverse collision-free traversal behaviors via global path planning, kinematic whole-body motion generation, obstacle-aware motion editing, and RL-based tracking. This pipeline provides dynamically feasible action supervision for learning language-conditioned whole-body policies. In extensive simulation experiments, TANGO demonstrates state-of-the-art performance in vision-language navigation, while outperforming strong modular baselines in navigating challenging scenes requiring obstacle negotiation. Lastly, we deploy TANGO zero-shot on a Unitree G1 humanoid robot, and observe robust language-guided traversal in cluttered real-world scenes without training on any real-world navigation data.', 'score': 19, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '8d3020423dfc86c6', 'authors': ['Anqi Li', 'Yuxin Chen', 'Zhaobo Li', 'Zhuo Cao', 'Junli Ren', 'Masayoshi Tomizuka', 'Dhruv Shah'], 'affiliations': ['Peking University', 'Princeton University', 'The University of Hong Kong', 'Tsinghua University', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2609.09158.jpg', 'data': {'categories': ['#training', '#rl', '#multimodal', '#cv', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Робот, понимающий речь и ловко маневрирующий в узких проходах', 'desc': 'TANGO — это фреймворк, который объединяет компьютерное зрение и обработку естественного языка для управления гуманоидным роботом в загромождённых помещениях. В отличие от традиционных методов навигации, которые работают с 2D планированием пути, TANGO предсказывает координированные действия всего тела робота, включая движение рук, корпуса и походки для преодоления сложных 3D препятствий. Модель полностью обучается в симуляции с использованием комбинации глобального планирования пути, кинематического моделирования движений, редактирования траекторий с учётом препятствий и обучения с подкреплением. После обучения только на симуляционных данных робот способен безошибочно выполнять инструкции на естественном языке в реальных загромождённых сценах без переобучения.'}, 'en': {'title': 'TANGO: Language-Guided Navigation for Humanoid Robots in Cluttered Spaces', 'desc': 'TANGO is a novel framework that enables humanoid robots to navigate complex indoor environments by predicting whole-body joint actions based on natural language instructions. Unlike traditional navigation methods that focus on 2D path planning, TANGO incorporates 3D spatial awareness, allowing for coordinated movements of arms, torso, and legs to avoid obstacles. The framework is trained entirely in simulation, utilizing techniques like global path planning and reinforcement learning to generate diverse and collision-free movement behaviors. Remarkably, TANGO can be deployed in real-world scenarios without prior training on real data, showcasing its effectiveness in language-guided navigation tasks.'}, 'zh': {'title': 'TANGO：类人机器人导航的新突破', 'desc': 'TANGO是一个视觉-语言框架，旨在帮助类人机器人在复杂的室内环境中进行全身关节动作预测。与传统的2D路径规划方法不同，TANGO需要考虑连续的几何适应，包括协调手臂位置、躯干调整和步态调节，以实现无碰撞的3D空间移动。该框架通过自然语言指令和自我中心的RGB观察，直接预测29个自由度的关节空间动作，支持全身控制。TANGO在模拟环境中进行训练，展示了在视觉-语言导航中的先进性能，并在真实场景中实现了强大的语言引导导航。'}}}, {'id': 'https://huggingface.co/papers/2609.09153', 'title': 'Procedural Graphs: Self-Evolving Execution Structures for LLM Agents', 'url': 'https://huggingface.co/papers/2609.09153', 'abstract': "Abstract A procedural graph framework organizes agent actions into structured relational triplets, providing situational guidance and self-evolving topology to improve long-horizon tool use.  Generated by thinkingmachines/Inkling-Small Large language models are increasingly deployed as agents that plan over long horizons and act through external tools. Most agents select actions through unconstrained generation over an accumulating history, leaving implicit the procedural knowledge of what to do, in what order, and under which conditions. As trajectories lengthen, agents can lose track of their objectives, invoke tools out of order, and repeat unproductive actions. We introduce the Procedural Graph: just as a knowledge graph organizes factual knowledge into (entity, relation, entity) triplets for what-is questions, a Procedural Graph organizes procedural knowledge into (procedure, relation, procedure) triplets for what-to-do questions. At each decision step, the framework localizes the agent's active node, and a guidance model translates the surrounding subgraph into step-level situational guidance that biases the solver's next action without dictating it. The graph is self-evolving: an LLM refiner contrasts failed trajectories with successful ones and edits the graph's topology and attributes, committing edits that preserve or improve held-out validation performance while retaining rejected ones to discourage repetition. Starting from a minimal skeleton, the loop builds graphs that match or surpass hand-designed ones. It can also repair a flawed expert prior. Across multiple datasets, task types, and LLMs, the Procedural Graph delivers consistent gains over memory-based baselines, and self-evolution further improves performance without manual engineering.", 'score': 19, 'issue_id': 3243, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': '25f7a3ad1368e63c', 'authors': ['Yuxing Lu', 'Yicheng Chen', 'Shanchan Wu', 'Sercan Ö. Arık'], 'affiliations': ['Georgia Institute of Technology', 'Google', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2609.09153.jpg', 'data': {'categories': ['#graphs', '#optimization', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Самоэволюционирующий граф процедур для улучшения долгосрочного планирования агентов', 'desc': 'В работе предлагается фреймворк Процедурного Графа, который организует действия агента в виде структурированных триплетов (процедура, связь, процедура), аналогично тому, как граф знаний хранит факты. На каждом шаге принятия решения модель-ориентир локализует активный узел агента и преобразует окружающий подграф в ситуационные рекомендации, направляющие следующее действие без жесткого диктата. Граф самоэволюционирует: LLM анализирует неудачные траектории, сравнивает их с успешными и адаптирует топологию графа, сохраняя улучшения и отклоняя вредные изменения. Экспериментально показано, что данный подход обеспечивает стабильный прирост производительности агентов на различных задачах и LLM по сравнению с методами на основе памяти.'}, 'en': {'title': 'Enhancing Agent Action Planning with Procedural Graphs', 'desc': 'This paper introduces the Procedural Graph framework, which organizes agent actions into structured relational triplets to enhance long-term tool usage. By providing situational guidance, it helps agents maintain focus on their objectives and select actions in the correct order. The framework evolves automatically, using a large language model to refine its structure based on successful and failed action trajectories. This self-evolving approach consistently outperforms traditional memory-based methods across various tasks and datasets.'}, 'zh': {'title': '程序图：提升代理行动的智能框架', 'desc': '这篇论文介绍了一种程序图框架，它将代理的行动组织成结构化的关系三元组，以提供情境指导和自我演化的拓扑，从而改善长期工具使用。程序图通过将程序知识组织成（程序，关系，程序）三元组，帮助代理在决策时明确下一步的行动。该框架能够在每个决策步骤中定位代理的活动节点，并通过指导模型将周围的子图转化为情境指导，影响代理的下一步行动。通过自我演化，程序图能够在多个数据集和任务类型中持续提升性能，超越基于记忆的基线。'}}}, {'id': 'https://huggingface.co/papers/2609.07470', 'title': 'Measuring Language Transfer in Robot Policies: Adding Greek to a Cosmos3 Vision-Language-Action Policy', 'url': 'https://huggingface.co/papers/2609.07470', 'abstract': "Abstract Adding Greek to a robot vision-language-action model via machine-translated instructions reveals measurement pitfalls and shows bilingual training improves performance over monolingual baselines, though it remains far below English levels.  Generated by thinkingmachines/Inkling-Small Robot foundation models are trained and evaluated predominantly in English, and robot demonstration corpora do not exist for most languages. We study the addition of Greek to an open vision-language-action stack using only machine-rephrased instructions and no architecture changes. The main challenge is measurement rather than translation. Several plausible instruments produce false conclusions: a color-histogram metric rewards noise, a single-goal benchmark scores 84.6% under correct Greek and 82.6% under deliberately wrong instructions, training loss fails to predict Greek success, and single-run comparisons are dominated by seed variation. On a discriminative ninety-task suite with three seeds per arm, a multilingual text tower without Greek demonstrations remains at its wrong-instruction floor, while Greek-only training exceeds its control by at most 2.7 points. Bilingual training yields a consistent 6.7-7.1 point margin over its control and reaches about two fifths of English performance. The policy also overfits the translator's phrasing; training on seven phrasings per task approximately halves this penalty. Warm-starting from a language-adapted world model and unfreezing the text tower both degrade performance. The results support two practical requirements for low-resource robot-policy localization: build a guaranteed null before trusting a metric, and replicate low-resource-language results across seeds.", 'score': 17, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'd8dd5f5f14318408', 'authors': ['Ayoub Kirouane', 'Georgios Giaples', 'Christos Petrocheilos'], 'affiliations': ['Sophea AI, KIEFER SA, Athens, Greece'], 'pdf_title_img': 'assets/pdf/title_img/2609.07470.jpg', 'data': {'categories': ['#training', '#benchmark', '#low_resource', '#multilingual', '#robotics', '#machine_translation', '#multimodal', '#synthetic'], 'emoji': '🤖', 'ru': {'title': 'Локализация робототехнических моделей: вызовы измерения и потенциал мультиязычного обучения', 'desc': 'В этой работе исследователи добавили греческий язык в робототехнический vision-language-action модель, используя только машинный перевод инструкций без изменений архитектуры. Основная сложность оказалась не в переводе, а в корректном измерении качества: многие метрики дают ложные выводы, включая цветовые гистограммы и однозадачные бенчмарки. На наборе из 90 задач с тремя запусками обучение на двух языках дало улучшение на 6.7-7.1 пункта по сравнению с контролем, но остаётся значительно ниже производительности на английском. Авторы также показали, что переобучение на фразировки переводчика существенно влияет на результаты, и рекомендуют строить нулевой контроль перед проверкой любой метрики для низкоресурсных языков.'}, 'en': {'title': 'Bilingual Training Boosts Robot Performance in Greek!', 'desc': 'This paper explores the integration of Greek into a robot vision-language-action model using machine-translated instructions. It highlights the challenges in measurement accuracy, revealing that certain metrics can lead to misleading conclusions about performance. The study finds that bilingual training significantly improves outcomes compared to monolingual approaches, although performance still lags behind English levels. The authors emphasize the importance of reliable metrics and consistent results across different training seeds for effective low-resource language applications in robotics.'}, 'zh': {'title': '双语训练提升机器人性能的探索', 'desc': '这篇论文探讨了在机器人视觉-语言-行动模型中加入希腊语的效果。研究发现，使用机器翻译的指令进行双语训练，能够提高机器人的表现，尽管仍低于英语水平。主要挑战在于测量而非翻译，多个测量工具可能导致错误结论。结果表明，低资源语言的机器人策略本地化需要建立可靠的基准，并在不同种子间复制结果。'}}}, {'id': 'https://huggingface.co/papers/2609.06665', 'title': 'TransNormal-2: Geometry-Grounded Rectified Flow with Edge-Aware Decoding for Precise Normal Estimation', 'url': 'https://huggingface.co/papers/2609.06665', 'abstract': 'Abstract TransNormal-2 improves monocular normal estimation by correcting VAE reconstruction errors through geometry-aware training losses and a lightweight RGB-guided refinement module, achieving strong results with minimal annotations.  Generated by thinkingmachines/Inkling-Small Diffusion-based models enable monocular geometry estimation, yet their pixel-space precision is limited by a shared, under-studied error source: VAE reconstruction degradation. The 8x spatial compression in the VAE encoder-decoder degrades surface normals at object boundaries; even encoding and decoding ground-truth normals introduces 1.3--8.5° of mean angular error (MAE), with edge MAE reaching 2.8x the global MAE. We present TransNormal-2, a FLUX.2-based rectified-flow framework with single-step deterministic inference that addresses this degradation on both sides of the VAE decoder: in how latent predictions are supervised during training, and in how decoded normals are corrected at inference. First, geometry-aware pixel-space losses, including inverse rendering self-consistency, von~Mises-Fisher angular loss, and wavelet edge-aware regularization, complement latent MSE by enforcing spherical normal geometry and diffuse image-formation cues after VAE decoding. Second, a lightweight Geometric Refinement Module (GRM) applies an RGB-guided residual correction to reduce boundary-localized decoding errors without freely rewriting the coarse prediction. On general-scene benchmarks, TransNormal-2 matches or exceeds MoGe-2 on all eight reported metrics while using only 1.4% as many task-specific normal annotations. The gains are clearest for transparent objects, reducing MAE by 4.2° on ClearGrasp and 3.1° on ClearPose over the strongest prior baselines. Code will be released at https://longxiang-ai.github.io/TransNormal-2.', 'score': 17, 'issue_id': 3243, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': '22c3b57c275ef8d0', 'pdf_title_img': 'assets/pdf/title_img/2609.06665.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#open_source', '#training', '#optimization', '#cv', '#benchmark'], 'emoji': '🔲', 'ru': {'title': 'Исправление VAE деградации для точной оценки нормалей поверхности', 'desc': 'TransNormal-2 улучшает оценку нормалей поверхности из монокулярного изображения, решая проблему деградации качества в VAE кодировщике-декодировщике. Авторы предлагают использовать специализированные функции потерь в пиксельном пространстве, включая обратный рендеринг и угловые потери фон Мизеса-Фишера, которые учитывают геометрические свойства нормалей. Дополнительно разработан лёгкий модуль геометрической очистки, управляемый RGB-информацией, для коррекции ошибок на границах объектов без переписывания исходного предсказания. Модель достигает результатов, сопоставимых с SOTA методами, используя при этом в 70 раз меньше аннотированных данных для обучения.'}, 'en': {'title': 'Enhancing Monocular Normal Estimation with TransNormal-2', 'desc': 'TransNormal-2 enhances the process of estimating surface normals from a single image by addressing errors caused by Variational Autoencoder (VAE) reconstruction. It introduces geometry-aware training losses that improve the accuracy of normal predictions, particularly at object boundaries where traditional methods struggle. Additionally, a lightweight RGB-guided refinement module is employed to correct these predictions without altering the initial coarse outputs. The model demonstrates significant performance improvements on benchmark datasets, achieving high accuracy with minimal reliance on specific annotations.'}, 'zh': {'title': 'TransNormal-2：提升单目法线估计的创新方法', 'desc': 'TransNormal-2 是一种改进的单目法线估计方法，通过几何感知训练损失和轻量级 RGB 引导的修正模块来纠正变分自编码器（VAE）的重建误差。该方法在训练过程中使用几何感知的像素空间损失，确保法线几何的准确性，并在推理时通过几何修正模块减少边界局部的解码错误。TransNormal-2 在多个基准测试中表现优异，使用的任务特定法线注释仅为 1.4%。特别是在透明物体的估计上，MAE 显著降低，显示出该方法的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.06652', 'title': 'VidaForge: Open Research Infrastructure for Video Pretraining Data Recipes', 'url': 'https://huggingface.co/papers/2609.06652', 'abstract': 'Abstract VIDAFORGE is an open infrastructure that models video data recipes as executable workflows to study how data choices affect pretraining of video foundation models.  Generated by thinkingmachines/Inkling-Small Video foundation models increasingly rely on large-scale pretraining data, yet the end-to-end data pipelines behind them remain largely closed and difficult to inspect or reuse. Researchers seeking to understand how video data recipes affect model pretraining often need to build substantial infrastructure before testing even a focused hypothesis. We present VIDAFORGE, an open research infrastructure that represents a video data recipe as an executable five-stage workflow from raw videos to training datasets. A decision in this workflow can be varied to construct alternative datasets while preserving how every sample was produced. To demon strate this research workflow, we compare data recipes with different coverage and quality in early from-scratch pretraining of Wan 2.1 and V-JEPA 2.1. Across both learning objectives, the broader-coverage recipe achieves the highest downstream benchmark scores, while loss-based evaluation favors different recipes. This study demonstrates how VidaForge connects data-recipe choices to downstream model performance. We further release VIDAFORGE-3M, containing 3.14 million scene level clips totaling 6,475 hours, with fine-grained annotations and curation signals for video data-recipe research.', 'score': 17, 'issue_id': 3243, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': 'ad25a6f81f646380', 'authors': ['Yan Ma', 'Jiadi Su', 'Zhulin Hu', 'Ethan Chern', 'Linhao Zhang', 'Tiantian Mi', 'Pengfei Liu'], 'affiliations': ['Fudan University', 'Generative Artificial Intelligence Research Lab (GAIR)', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Shanghai University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06652.jpg', 'data': {'categories': ['#video', '#data', '#training', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Открытая инфраструктура для исследования влияния данных на видео foundation models', 'desc': 'VIDAFORGE — это открытая исследовательская инфраструктура, которая представляет видео-рецепты данных как исполняемые рабочие процессы из пяти этапов для изучения влияния выбора данных на предварительное обучение видео foundation models. Авторы демонстрируют, что разные рецепты данных с различным охватом и качеством приводят к разным результатам при обучении с нуля моделей Wan 2.1 и V-JEPA 2.1. Исследование показывает, что более широкий охват датасета обычно достигает лучших результатов на downstream задачах, однако метрики loss могут отдавать предпочтение другим рецептам. Авторы также выпустили VIDAFORGE-3M с 3.14 миллионами видеоклипов и подробными аннотациями для изучения влияния композиции и качества данных на видео foundation models.'}, 'en': {'title': 'Unlocking Video Data Insights with VIDAFORGE', 'desc': 'VIDAFORGE is a new open infrastructure designed to help researchers understand how different video data recipes impact the pretraining of video foundation models. It allows users to create executable workflows that transform raw video into training datasets, making it easier to test hypotheses about data choices. By comparing various data recipes, the study shows that broader coverage in the dataset leads to better performance in downstream tasks, while different evaluation methods may favor other recipes. Additionally, VIDAFORGE-3M provides a large collection of annotated video clips to support further research in this area.'}, 'zh': {'title': 'VIDAFORGE：视频数据配方的开放研究基础设施', 'desc': 'VIDAFORGE是一个开放的基础设施，旨在将视频数据配方建模为可执行的工作流程，以研究数据选择如何影响视频基础模型的预训练。该系统允许研究人员通过五个阶段的工作流程，从原始视频到训练数据集，灵活地构建和比较不同的数据配方。研究表明，覆盖面更广的数据配方在下游基准测试中表现最佳，而基于损失的评估则偏好不同的配方。VIDAFORGE还发布了包含314万个场景级剪辑的VIDAFORGE-3M，为视频数据配方研究提供了细粒度的注释和策划信号。'}}}, {'id': 'https://huggingface.co/papers/2609.05663', 'title': 'What LLM Trading Agents Actually Do in Production: A Six-Month, Population-Scale Record from Two Fleets', 'url': 'https://huggingface.co/papers/2609.05663', 'abstract': 'Abstract Autonomous language-model trading agents across production systems show behavior driven by interface design rather than strategy, exhibit volatility-blind sizing, fail to capture favorable price excursions, and display no directional edge, with frontier model decision quality statistically indistinguishable across families.  Generated by thinkingmachines/Inkling-Small We present a continuous, population-scale measurement record of autonomous language-model trading agents operating in production across two systems with one design lineage: DX Terminal Pro (3,505 user-funded vaults trading real ETH in Base memecoin markets for 21 days, February to March 2026) and the DXAP live alpha fleet (500 to 599 user-created agents all-history, 91 to 117 concurrently active, trading Hyperliquid perpetuals, June to August 2026). The record spans roughly six months, 7.5M single-model invocations with about 300K onchain actions, and a further 231,638 multi-tool turns producing 14,596 fills. Four findings carry the paper. First, the operating layer determines behavior more than anything written in strategy text: a risk slider explains leverage (+0.425 per level), agent fixed effects absorb 60% of variance, and a leaderboard render boundary causally routes selection (regression discontinuity 1.75x at the top-3 cut). Second, sizing is volatility-blind: median leverage is 5.0x in every volatility sextile, and one posture-slider cell (11% of the book) holds 62% of liquidations. Third, agents capture almost none of the upside they reach: 43.2% of positions saw at least +300 bps of favorable excursion within 24h, yet 49.3% of those closed with a negative trade return; a mechanical bracket recovers +39.0 bps per position. Fourth, neither fleet shows a directional edge. The DXAP fleet is not profitable and trails a matched Hyperliquid retail benchmark (41% vs. 50% roundtrip win rate). A paired-replay league of frontier models on 416 captured production scenarios finds decision quality statistically indistinguishable at this horizon, while choice stability differs sharply across model families. Every headline survives day-clustered inference, permutation nulls, and a common-fee restatement; the paper closes with a 17-rule methodology canon bought with our own retractions.', 'score': 17, 'issue_id': 3243, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '12a8e9781b89b461', 'authors': ['T. J. Barton', 'Chris Constantakis', 'Patti Hauseman', 'Annie Mous', 'Alaska Hoffman', 'Brian Bergeron', 'Hunter Goodreau'], 'affiliations': ['DX Research Group (DXRG)'], 'pdf_title_img': 'assets/pdf/title_img/2609.05663.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Когда интерфейс важнее стратегии: провал LLM-агентов на реальных рынках', 'desc': 'В статье анализируется поведение автономных торговых агентов на основе больших языковых моделей (LLM) в реальных условиях на двух торговых платформах в течение шести месяцев. Исследование показало, что поведение агентов определяется преимущественно дизайном интерфейса, а не стратегией: элементы управления интерфейса объясняют 60% вариации в принятии решений. Агенты демонстрируют неправильное управление размером позиции, не учитывая волатильность, и упускают благоприятные ценовые движения, несмотря на их достижение. Исследование подтвердило, что качество решений фронтирных моделей статистически неразличимо, и торговые агенты не имеют направленного преимущества перед бенчмарком.'}, 'en': {'title': 'Interface Design Drives Trading Agent Performance', 'desc': 'This paper analyzes the performance of autonomous language-model trading agents in real-world trading environments. It finds that the design of the trading interface significantly influences agent behavior, overshadowing the strategies they are programmed with. The study reveals that these agents do not effectively manage risk or capitalize on favorable market movements, leading to poor trading outcomes. Overall, the agents lack a consistent directional advantage and perform worse than a benchmark of retail traders.'}, 'zh': {'title': '自主交易代理的界面设计影响行为', 'desc': '这篇论文研究了自主语言模型交易代理在生产系统中的表现，发现其行为更多受到界面设计的影响，而非策略本身。研究表明，代理在波动性方面缺乏敏感性，无法有效捕捉有利的价格波动，并且没有显示出方向性优势。通过对两个系统中交易代理的连续测量，发现操作层对行为的影响远大于策略文本的内容。最后，论文提出了17条方法论规则，以指导未来的研究和实践。'}}}, {'id': 'https://huggingface.co/papers/2609.05592', 'title': 'What Did I Just Say? Self-Listening for Full-Duplex Speech Models', 'url': 'https://huggingface.co/papers/2609.05592', 'abstract': "Abstract Self-Listening grounds interruption recovery in full-duplex spoken language models by feeding realized speech back as input, improving consistency with actually spoken responses.  Generated by thinkingmachines/Inkling-Small Full-duplex spoken language models can listen and speak simultaneously, enabling them to handle interruptions and backchannels in human conversation. However, text generation, speech synthesis, and audio playback proceed asynchronously. As a result, what a model believes it has said may not match what has actually been played to the user. We refer to the problem of recovering from an interruption while remaining aware of the model's realized speech as anchor interruption. To address this problem, we propose Self-Listening, a full-duplex modeling approach that interleaves user speech, model text, and the model's played speech. By feeding the realized speech output back to the model as an input stream, self-listening grounds interruption recovery in what the user has actually heard. We further introduce AnchorSpeech, a collection with homogeneous training and test splits for tracking which items of structured ordered responses have actually been spoken. AnchorSpeech-test evaluates whether a model can respond consistently with the last completed item before an interruption. Experiments show that, compared with full-duplex baselines, models equipped with self-listening mechanism achieve better anchoring performance.", 'score': 16, 'issue_id': 3245, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': 'f5ce6efaed78dde9', 'authors': ['Xuanning Zhou', 'Junyi Ao', 'Xiaotong Liu', 'Tom Ko', 'Benyou Wang', 'Haizhou Li'], 'affiliations': ['Shenzhen Loop Area Institute', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2609.05592.jpg', 'data': {'categories': ['#audio', '#benchmark', '#dataset'], 'emoji': '🎙️', 'ru': {'title': 'Слушай сам себя: улучшение восстановления после прерываний в диалоговых моделях', 'desc': 'В работе предложен метод Self-Listening для полнодуплексных моделей разговорного языка, который решает проблему восстановления после прерывания пользователя. Основная идея заключается в том, чтобы передавать синтезированную речь модели обратно как входной поток, обеспечивая согласованность между тем, что модель думает, что она сказала, и тем, что пользователь фактически слышит. Авторы также представляют датасет AnchorSpeech для оценки способности модели корректно продолжать ответ после прерывания. Экспериментальные результаты показывают, что Self-Listening улучшает качество восстановления после прерываний по сравнению с базовыми полнодуплексными моделями.'}, 'en': {'title': 'Enhancing Conversation Consistency with Self-Listening', 'desc': "This paper introduces a method called Self-Listening to improve full-duplex spoken language models, which can listen and speak at the same time. The main issue addressed is the mismatch between what the model thinks it has said and what the user actually hears, especially during interruptions. By feeding the model's realized speech back as input, Self-Listening helps the model recover from interruptions more effectively and maintain consistency in responses. The authors also present a dataset called AnchorSpeech to evaluate the model's performance in responding accurately after interruptions, showing that Self-Listening enhances anchoring performance compared to traditional methods."}, 'zh': {'title': '自我聆听：提升对话中断恢复的一致性', 'desc': '这篇论文介绍了一种名为自我聆听的全双工语言模型方法，旨在改善在对话中处理中断时的响应一致性。通过将实际生成的语音反馈作为输入，模型能够更好地理解用户所听到的内容，从而提高中断恢复的效果。论文还提出了AnchorSpeech数据集，用于评估模型在中断前后的一致性响应能力。实验结果表明，采用自我聆听机制的模型在锚定性能上优于传统的全双工模型。'}}}, {'id': 'https://huggingface.co/papers/2609.07670', 'title': 'Harnessing CLIP and DINO: An Uncertainty-Aware Cascaded Fusion Network for Generalizable Deepfake Image Detection', 'url': 'https://huggingface.co/papers/2609.07670', 'abstract': "Abstract UCF-Net improves deepfake detection by fusing CLIP and DINO representations with uncertainty-weighted hierarchical feature aggregation, achieving stronger cross-domain generalization.  Generated by thinkingmachines/Inkling-Small The growing realism and accessibility of manipulated and generated faces threaten the trustworthiness of digital media. To detect such forgeries, deepfake detectors based on vision foundation models have shown promising performance, but they typically rely on a single pretrained representation and are prone to overfitting to particular training distributions. To improve generalization to unseen forgeries, we propose UCF-Net, an uncertainty-aware cascaded fusion network that harnesses CLIP's language-aligned semantic priors and DINO's self-supervised visual-structure priors. UCF-Net extracts hierarchical features across Transformer depths, uses layer-wise expert aggregation to adaptively combine each encoder's multi-level cues, and performs weighted fusion of the resulting representations based on entropy-derived uncertainty. We further consolidate public deepfake datasets into a unified benchmark of approximately 4M images and construct a separate cross-generator evaluation set with over 8K face images from eight recent generators. On the unified benchmark, UCF-Net achieves the best mean AUC among the evaluated methods in both in-domain and cross-domain evaluations. On the cross-generator set, it adapts effectively with limited target-domain data, although zero-shot transfer remains challenging.", 'score': 15, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '4d490c550c771677', 'authors': ['Xuechao Zou', 'Yi Zhou', 'Kai Li', 'Shun Zhang', 'Yuhui Chen', 'Congyan Lang', 'Junliang Xing'], 'affiliations': ['Ant Group', 'Beijing Jiaotong University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07670.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#cv', '#dataset'], 'emoji': '🎭', 'ru': {'title': 'Слияние визуальных приоров для надёжного обнаружения поддельных лиц', 'desc': 'UCF-Net — это нейросетевая архитектура для детектирования дипфейков, которая объединяет представления от двух фундаментальных моделей компьютерного зрения: CLIP с семантическими приорами и DINO с визуальными приорами. Модель извлекает иерархические признаки с разных глубин Трансформера и использует взвешенную агрегацию экспертов для адаптивного комбинирования мультиуровневых сигналов от каждого энкодера. Финальное слияние представлений выполняется на основе энтропийной неопределённости, что позволяет сети более эффективно обобщаться на ненаблюдаемые типы подделок. Экспериментальные результаты на едином бенчмарке демонстрируют улучшенную кросс-доменную генерализацию и стабильность работы с лицами, созданными различными генераторами.'}, 'en': {'title': 'UCF-Net: Enhancing Deepfake Detection with Uncertainty-Aware Fusion', 'desc': 'UCF-Net is a novel approach to enhance deepfake detection by integrating representations from CLIP and DINO through a method that accounts for uncertainty in feature aggregation. This model addresses the limitations of existing detectors that often overfit to specific datasets by employing a hierarchical feature extraction strategy across different layers of Transformers. By using entropy-derived uncertainty to weigh the fusion of features, UCF-Net improves its ability to generalize across various unseen deepfake scenarios. The model has been validated on a comprehensive benchmark of deepfake images, demonstrating superior performance in both familiar and unfamiliar contexts.'}, 'zh': {'title': 'UCF-Net：提升深度伪造检测的跨领域泛化能力', 'desc': 'UCF-Net是一种改进深度伪造检测的方法，通过融合CLIP和DINO的表示，结合不确定性加权的层次特征聚合，增强了跨领域的泛化能力。随着伪造和生成面孔的真实感和可获取性不断提高，数字媒体的可信度受到威胁。传统的深度伪造检测器通常依赖单一的预训练表示，容易对特定的训练分布过拟合。UCF-Net通过提取变换器深度的层次特征，并根据熵导出的不确定性进行加权融合，显著提高了对未见伪造的检测能力。'}}}, {'id': 'https://huggingface.co/papers/2609.07941', 'title': 'ReactVAU: A Slow-Fast Decoupled Framework for Streaming Video Anomaly Understanding', 'url': 'https://huggingface.co/papers/2609.07941', 'abstract': 'Abstract ReactVAU enables real-time streaming video anomaly understanding via a fast detection module, persistent anomaly-aware memory, and an on-demand slow reasoning module that minimizes heavy model usage.  Generated by thinkingmachines/Inkling-Small In this paper, we propose ReactVAU, a Slow-Fast Decoupled Framework for real-time streaming Video Anomaly Understanding (VAU). Existing VAU methods rely on offline inference with global temporal sampling, which violates causality and prevents deployment in live surveillance streams. Conversely, general streaming video models satisfy causal access but dilute rare transient anomalies during memory compression and often invoke heavyweight MLLMs uniformly over long normal intervals. React VAU addresses this gap with three synergistic components: a lightweight Fast Detection Module based on Spatial Grid Folding (SGF) for continuous anomaly filtering; an Anomaly-Aware Persistent Memory (AAPM) that protects critical visual cues from temporal decay; and a heavyweight Slow Reasoning Module that remains dormant during normal streams and is awakened only by suspicious events for semantic verification and causal description. Extensive experiments on multiple benchmarks demonstrate that ReactVAU operates under strict streaming constraints while simultaneously achieving competitive performance in both anomaly detection and causal reasoning, alongside significantly enhanced computational efficiency by minimizing heavyweight MLLM invocations. Project page is available at https://huiyuiui.github.io/React_VAU/', 'score': 15, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'a42513b4fc4e72e8', 'authors': ['Chia-Hui Chen', 'Shih-Ying Yeh', 'Fu-En Yang', 'Min-Hung Chen', 'Shang-Hong Lai'], 'affiliations': ['NVIDIA, Taipei, Taiwan', 'National Tsing Hua University, Hsinchu, Taiwan'], 'pdf_title_img': 'assets/pdf/title_img/2609.07941.jpg', 'data': {'categories': ['#benchmark', '#video', '#multimodal'], 'emoji': '🎥', 'ru': {'title': 'Эффективное понимание аномалий в видеопотоках через адаптивное разделение быстрой и медленной обработки', 'desc': 'В этой работе предлагается ReactVAU — фреймворк для обнаружения аномалий в видеопотоках в реальном времени, который решает проблему причинности, присущую традиционным методам. Система использует быстрый модуль детекции на основе Space Grid Folding для непрерывной фильтрации, аномально-осознающую память для сохранения критических визуальных признаков и медленный модуль рассуждения на базе MLLM, активирующийся только при обнаружении подозрительных событий. Такой подход позволяет значительно снизить вычислительные затраты, избегая избыточного использования тяжёлых моделей на нормальных видеоинтервалах. Экспериментальные результаты показывают, что ReactVAU достигает конкурентных показателей в обнаружении аномалий и семантическом анализе при строгих ограничениях потоковой обработки.'}, 'en': {'title': 'Real-Time Anomaly Detection with Efficient Processing', 'desc': 'ReactVAU is a framework designed for real-time understanding of anomalies in streaming video. It combines a fast detection module that quickly identifies potential anomalies, with a memory system that retains important visual information over time. Additionally, it includes a slow reasoning module that activates only when anomalies are detected, allowing for detailed analysis without constant heavy computation. This approach ensures efficient processing while maintaining high performance in both detecting anomalies and understanding their context.'}, 'zh': {'title': '实时视频异常理解的新突破', 'desc': '本文提出了一种名为ReactVAU的框架，用于实时流视频异常理解。该框架通过快速检测模块、持久异常感知记忆和按需慢推理模块，解决了现有方法在实时监控中因因果性问题而无法应用的局限。ReactVAU的快速检测模块利用空间网格折叠技术进行连续异常过滤，而持久记忆模块则保护关键视觉线索不受时间衰减的影响。实验结果表明，ReactVAU在严格的流媒体约束下，能够实现竞争力的异常检测和因果推理，同时显著提高计算效率。'}}}, {'id': 'https://huggingface.co/papers/2609.06966', 'title': 'MOLE: Detecting Insider Threats in AI Agents', 'url': 'https://huggingface.co/papers/2609.06966', 'abstract': 'Abstract MOLE is a benchmark for evaluating defenses that detect harmful actions by AI agents operating shared services under limited review budgets.  Generated by thinkingmachines/Inkling-Small Model misalignment, prompt injection, or operator misuse could lead AI agents operating frontier-lab accounts to exfiltrate model weights, poison training data, or weaken release gates. Existing benchmarks do not test whether defenders can detect this activity among routine work under a limited review budget. We introduce MOLE, an open benchmark of 150 AI-operated accounts sharing 9 stateful services over 30 workdays, with 12 threats and 8 corpora from four models totaling roughly 20 billion tokens. Of 39 agent models, 72% complete most assigned harmful objectives and agent refusal does not predict completion. MOLE enables comparison of 40 monitors across corpus generators, observability levels, and threats; even the best evaluated monitor in our single-day audit-event comparison misses nearly half of completed harm. MOLE also enables monitor development: benchmark-guided search improves a mid-tier monitor by 49-64%, while selective use of a stronger monitor improves budget-AUC by 10% over applying it to every account-day at comparable modeled cost.', 'score': 15, 'issue_id': 3243, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '7f14afc27c62bc66', 'authors': ['Aashiq Muhamed', 'Virginia Smith'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06966.jpg', 'data': {'categories': ['#open_source', '#security', '#alignment', '#dataset', '#agents', '#benchmark'], 'emoji': '🚨', 'ru': {'title': 'Обнаружение вредоносных действий AI агентов в условиях ограниченных ресурсов', 'desc': 'MOLE — это бенчмарк для оценки защитных механизмов, которые должны обнаруживать опасные действия AI агентов, работающих в общих системах с ограниченным бюджетом проверок. Авторы создали открытый датасет из 150 аккаунтов, управляемых моделями, работающих с 9 сервисами в течение 30 дней и содержащих 12 типов атак, объемом примерно 20 миллиардов токенов. Исследование показало, что 72% протестированных моделей успешно завершают вредоносные задачи, несмотря на встроенные механизмы отказа, а лучшие мониторы пропускают почти половину успешных атак. Бенчмарк позволяет разрабатывать и улучшать детекторы угроз, причём поиск, ориентированный на результаты теста, повышает эффективность мониторов на 49-64%.'}, 'en': {'title': 'MOLE: Benchmarking AI Defense Against Harmful Actions', 'desc': 'The paper introduces MOLE, a new benchmark designed to evaluate defenses against harmful actions by AI agents in shared services with limited review budgets. It highlights the risks of AI misalignment, prompt injection, and operator misuse, which can lead to serious security issues like data exfiltration and training data poisoning. MOLE consists of 150 AI-operated accounts and tests 12 different threats across various models, revealing that a significant percentage of agents can successfully complete harmful tasks. The benchmark also facilitates the development of monitoring systems, showing that targeted improvements can significantly enhance detection capabilities.'}, 'zh': {'title': 'MOLE：AI代理防御评估的新基准', 'desc': 'MOLE是一个用于评估防御机制的基准，旨在检测在有限审查预算下，AI代理在共享服务中执行的有害行为。该基准包含150个AI操作的账户，涉及9个状态服务，覆盖30个工作日，包含12种威胁和来自四个模型的8个语料库，总计约200亿个标记。研究表明，39个代理模型中有72%完成了大部分有害目标，而代理拒绝并不能预测完成情况。MOLE不仅可以比较不同监控器的效果，还能指导监控器的开发，显著提高监控器的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.07139', 'title': "Encoded Early, Used Late: Where Transformers Begin to Act on an Inferred Partner's Expertise", 'url': 'https://huggingface.co/papers/2609.07139', 'abstract': "Abstract In multi-turn dialogues, a model's inference of a partner's expertise becomes readable in early layers but only causally active later, bounding intervention points for steering behavior.  Generated by thinkingmachines/Inkling-Small A transformer can make an attribute linearly decodable in its residual stream at a depth where that attribute does not yet influence the output. This gap between where information is readable and where it is used has been shown for attributes stated directly in the input. We ask whether it also holds for an attribute the model must infer gradually over a conversation, namely how expert its dialogue partner is. Using ExpertCollab, a corpus of multi-turn research-planning dialogues between model-played personas at four expertise levels, we find that partner expertise is most decodable in the early layers and falls to near chance before the midpoint of the network. Counterfactual patching shows that injecting the expertise difference at the layer of peak decodability barely changes a fixed late-layer readout, whereas the same difference injected past the midpoint propagates almost completely, a separation of more than an order of magnitude. A content-matched random control and a probe-free diagnostic place the transition at the same early layer, and a statically specified control attribute stays decodable throughout. An inferred relational attribute is therefore represented well before it becomes causally active, which bounds where any attempt to read out or steer partner-conditioned behavior must intervene. We use one model on a synthetic corpus as an initial demonstration.", 'score': 15, 'issue_id': 3244, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'f0ec72af1bbb2d1a', 'authors': ['Mika Okamoto', 'Gabriele Sarti'], 'affiliations': ['Georgia Institute of Technology', 'Northeastern University'], 'pdf_title_img': 'assets/pdf/title_img/2609.07139.jpg', 'data': {'categories': ['#training', '#architecture', '#interpretability', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'Информация скрывается в ранних слоях, но управляет поведением только в глубоких', 'desc': 'В этой работе исследователи изучают, как трансформеры обрабатывают информацию об экспертизе собеседника в многоходовых диалогах. Они обнаружили, что атрибут (уровень знаний партнёра) становится линейно декодируемым в ранних слоях нейронной сети, но начинает реально влиять на выходные данные только в более глубоких слоях. Используя метод контрфактического патчинга, авторы показали, что модификация информации об экспертизе в слое с максимальной декодируемостью почти не влияет на результат, а вмешательство в более глубокие слои имеет огромный эффект. Исследование демонстрирует, что выведенные моделью реляционные атрибуты представлены намного раньше, чем они начинают влиять на поведение системы.'}, 'en': {'title': 'Understanding Expertise in Dialogue: Early Recognition, Late Action', 'desc': "This paper explores how a machine learning model, specifically a transformer, understands the expertise of its dialogue partner during multi-turn conversations. It finds that the model can recognize this expertise early in its processing layers, but it only starts to use this information effectively later on. The research uses a dataset called ExpertCollab, which includes dialogues between personas with different levels of expertise. The study shows that while the model can read expertise early, it does not influence the model's output until much later, highlighting important points for intervention in dialogue systems."}, 'zh': {'title': '多轮对话中的专业知识推断与干预时机', 'desc': '在多轮对话中，模型对对话伙伴专业知识的推断在早期层次上可读，但在后期层次上才会对输出产生影响。这种信息可读性与实际使用之间的差距在直接输入的属性中已经被证明。我们使用ExpertCollab数据集，发现对话伙伴的专业知识在早期层次上最容易解码，而在网络中点之前几乎无法解码。通过对比实验，我们发现推断的关系属性在变得因果活跃之前就已经被很好地表示，这限制了我们干预对话行为的时机。'}}}, {'id': 'https://huggingface.co/papers/2609.06373', 'title': 'Multi-Grid Post-Training for Long-Form Multi-Shot Video Generation', 'url': 'https://huggingface.co/papers/2609.06373', 'abstract': 'Abstract MovieGrid decomposes long videos into spatially arranged chunks for joint modeling, improving multi-shot coherence and scaling video length efficiently.  Generated by thinkingmachines/Inkling-Small Generating long-form multi-shot videos requires coherent within-shot motion and visually consistent narratives across shots. Existing video generators favor continuous motion and struggle to present complete shot sets when an entire narrative is packed along one temporal axis. We propose MovieGrid, a Multi-Grid Post-Training paradigm that decomposes a long video into shorter, temporally ordered chunks and arranges them on a spatial grid for joint modeling. This design reduces the number of shots handled by each temporal axis while enabling global information exchange across chunks. We construct the Multi-Grid Long Video (MGLV) dataset from 1,000 long-form videos using source video collection, hierarchical segmentation, grid video construction, and character-aware story annotation, producing 54K grid videos paired with story prompts. Our Noise-Free Random-Grid Training retains a random subset of chunks as clean visual context for denoising the remaining chunks. Grid Embedding encodes grid structure, character-aware Story Prompts link recurring entities, and Grid Boundary Loss stabilizes layouts. Under the same token budget, MovieGrid generates 6.05 times more shots than Temporal Packing in a 1,616-frame video. On a benchmark spanning five real-world categories, it achieves state-of-the-art intra-shot consistency (0.9131 versus 0.8086 for HoloCine) and inter-shot consistency (0.5914 versus 0.5384 for StoryMem). MovieGrid can further scale video length with minimal compromise through single or multiple generations.', 'score': 15, 'issue_id': 3243, 'pub_date': '2026-09-06', 'pub_date_card': {'ru': '6 сентября', 'en': 'September 6', 'zh': '9月6日'}, 'hash': '4e70ae4ab03fb011', 'authors': ['Jiawei Mao', 'Haoqin Tu', 'Hardy Chen', 'Yuhan Wang', 'Keyang Xu', 'Jieru Mei', 'Hongliang Fei', 'Ruogu Fang', 'Wei Shao', 'Cihang Xie', 'Yuyin Zhou'], 'affiliations': ['Google', 'UC Santa Cruz', 'University of Florida', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06373.jpg', 'data': {'categories': ['#video', '#story_generation', '#open_source', '#synthetic', '#training', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'MovieGrid: генерация длинных видео через пространственную декомпозицию вместо временной последовательности', 'desc': 'MovieGrid предлагает инновационный подход к генерации длинных видео, разлагая их на пространственно организованные части вместо традиционного временного расположения. Метод использует Multi-Grid Post-Training парадигму, которая позволяет модели обрабатывать меньше кадров на каждой временной оси, при этом обеспечивая глобальный обмен информацией между отдельными сегментами видео. Авторы создали датасет MGLV из 1000 длинных видео с аннотациями персонажей и разработали специальные техники обучения, включая Noise-Free Random-Grid Training и Grid Boundary Loss для стабилизации раскладки. Результаты показывают, что MovieGrid генерирует в 6 раз больше кадров при том же бюджете токенов и достигает лучшей согласованности как внутри отдельных кадров, так и между ними по сравнению с существующими методами.'}, 'en': {'title': 'Revolutionizing Long-Form Video Generation with MovieGrid', 'desc': 'MovieGrid is a novel approach to generating long-form videos by breaking them down into smaller, spatially arranged chunks. This method enhances coherence within individual shots and maintains visual consistency across multiple shots. By utilizing a Multi-Grid Post-Training paradigm, it allows for efficient modeling of video narratives while facilitating global information exchange between chunks. The proposed system outperforms existing methods in generating more shots and achieving higher consistency metrics in both intra-shot and inter-shot evaluations.'}, 'zh': {'title': 'MovieGrid：高效生成长视频的新方法', 'desc': 'MovieGrid是一种新的视频生成方法，它将长视频分解为空间上排列的短片段，以便进行联合建模。这种方法提高了多镜头之间的一致性，并有效地扩展了视频长度。通过构建Multi-Grid Long Video数据集，MovieGrid能够生成更多的镜头，同时保持镜头内和镜头间的一致性。该方法在多个真实世界的基准测试中表现出色，达到了最新的技术水平。'}}}, {'id': 'https://huggingface.co/papers/2609.06008', 'title': 'Cadence: Error-Bounded Lossy Compression of Demand Time Series with a Time-Series Foundation Model', 'url': 'https://huggingface.co/papers/2609.06008', 'abstract': 'Abstract Cadence pairs a time-series foundation model with an adaptive arithmetic coder for error-bounded lossy compression, achieving substantial gains over classical predictors while reporting negative results on lossless coding and cross-batch determinism.  Generated by thinkingmachines/Inkling-Small We present Cadence, an error-bounded lossy compressor for numeric time series pairing a 330M-parameter time-series foundation model (Google TimesFM-3) with an adaptive arithmetic coder, guaranteeing |x_t-x_t|leτ on every sample. One negative result constrains the design space: for lossless coding a foundation model is worth nothing, because bits saved are logarithmic in predictor accuracy, Δb=log_2(MAE_{old}/MAE_{new}). So the 1.51times advantage TimesFM-3 holds over a 32-tap linear predictor buys 0.60 bits of 20.28, a median gain of +0.03%. Error-bounded coding escapes this at one point: once a forecast lands inside the band the residual index is zero and the sample nearly free. Cadence contributes: (1) an adaptive range coder with context-modelled binarization, beating xz/zstd on real indices by 9.7% (15/15) and reversing a finding from a general-purpose back end; (2) a determinism result -- predictions are not bit-identical across batch sizes, and no PyTorch configuration repairs this, forcing group size and execution device into the container format; and (3) domain localization on corpora postdating any plausible training cutoff.   On 49 EIA-930 balancing-authority demand series (2026) Cadence gains 13.3% over the best of six classical predictors, and 28.3% on 50 MTA ridership series (2026): 21.4% median over 297 series-tolerance pairs, winning all 297. Against downsampling, what time-series databases deploy for retention, its guaranteed worst-case error is 28--56times tighter at equal size. End-to-end, once the context bootstrap is paid for, gains run from 6.8% at six months of hourly data to 15.1% asymptotically. Attempting to falsify the domain claim on SDRBench, theory predicts failure and delivers: -0.8% median, 0 of 27 pairs gaining. Three further negative results and eight retracted claims are reported in full.', 'score': 15, 'issue_id': 3244, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': '67c469665981d563', 'authors': ['Roberto Tacconelli'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2609.06008.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#dataset', '#inference', '#optimization', '#training'], 'emoji': '📊', 'ru': {'title': 'Foundation модели для сжатия временных рядов с гарантированной ошибкой', 'desc': 'Cadence объединяет большую foundation model для временных рядов с адаптивным арифметическим кодером для сжатия данных с ограниченной ошибкой. Модель достигает значительных улучшений по сравнению с классическими предикторами на реальных данных, гарантируя, что абсолютная ошибка не превысит заданный порог. Однако авторы честно сообщают о негативном результате: для бесстратного сжатия foundation model не дает выигрыша из-за логарифмической зависимости от точности предиктора. Система включает адаптивный диапазонный кодер с контекстной бинаризацией и решает проблему недетерминизма при различных размерах батчей в PyTorch.'}, 'en': {'title': 'Cadence: Revolutionizing Time-Series Compression with Error-Bounded Lossy Techniques', 'desc': 'The paper introduces Cadence, a novel error-bounded lossy compression method for numeric time series data that combines a large foundation model with an adaptive arithmetic coder. It demonstrates significant improvements over traditional predictors, achieving a median gain of 21.4% across various time series datasets. However, it also highlights limitations in lossless coding, where the foundation model does not provide benefits due to the logarithmic relationship between bits saved and predictor accuracy. Additionally, the study reveals issues with cross-batch determinism, indicating that predictions can vary across different batch sizes, which impacts the reliability of the model in practical applications.'}, 'zh': {'title': 'Cadence：高效的时间序列有损压缩', 'desc': 'Cadence是一种基于时间序列的有损压缩算法，结合了一个330M参数的时间序列基础模型和自适应算术编码器，能够在每个样本上保证误差界限。与传统预测器相比，Cadence在压缩性能上取得了显著提升，但在无损编码和跨批次确定性方面表现不佳。研究表明，基础模型在无损编码中并没有优势，因为节省的比特数与预测器的准确性呈对数关系。Cadence的创新包括自适应范围编码器和上下文建模的二进制化，显著提高了压缩效率。'}}}, {'id': 'https://huggingface.co/papers/2608.29109', 'title': 'Recognition-Refusal Misalignment in LLMs: Why Models Answer Structurally Unanswerable Questions', 'url': 'https://huggingface.co/papers/2608.29109', 'abstract': 'Abstract Large language models encode whether structurally impossible math or code prompts are unanswerable via a hidden-state direction, but fail to abstain because this recognition signal is misaligned with safety-refusal pathways, indicating a routing rather than encoding failure.  Generated by thinkingmachines/Inkling-Small Large language models often answer structurally unanswerable questions, such as computing cot(-540°) or evaluating (1).startswith("1"), instead of abstaining. We ask whether this failure reflects missing recognition or failed routing from recognition to abstention. Across instruction-tuned models from 1.7B to 70B parameters, a single linear direction in the hidden state separates answerable from structurally impossible math and code prompts, showing that models represent impossibility before generation. Yet this recognition direction is nearly orthogonal to the canonical safety-refusal direction that mediates trained harmful-content refusal. An in-domain behavior-defined invalidity-aware direction is closer to recognition, but only partially aligned with it, and remains near-orthogonal to safety refusal. Generation-time steering along the recognition direction changes invalidity-aware behavior bidirectionally and dose-responsively on structural math and code cells, while random directions do not. Base/instruct comparisons further show that the low-cosine geometry is already present at the pretraining endpoint. The confident-on-impossible failure is therefore better explained as a routing failure than as an encoding failure: the model has a usable "no admissible answer" signal, but the safety-refusal pathway is not aligned to use it.', 'score': 15, 'issue_id': 3244, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '00eaac55a45365a7', 'authors': ['Yucheng Du', 'Xiyang Hu'], 'affiliations': ['Arizona State University', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2608.29109.jpg', 'data': {'categories': ['#security', '#plp', '#interpretability', '#alignment', '#training', '#small_models', '#math'], 'emoji': '🛣️', 'ru': {'title': 'Модель видит проблему, но идёт по неправильному пути', 'desc': 'Исследование показывает, что большие языковые модели распознают структурно невозможные математические и кодовые задачи через скрытое направление в представлении состояния, но не могут отказаться от ответа. Авторы обнаружили, что направление признания невозможности почти ортогонально к направлению, отвечающему за отказ в целях безопасности. Это указывает на проблему маршрутизации информации, а не на недостаток её кодирования в модели. Исследование демонстрирует, что модели уже содержат сигнал о невозможности задачи, но механизм безопасности не использует этот сигнал должным образом.'}, 'en': {'title': 'Routing Failures in Language Models: Recognizing Impossibility but Failing to Abstain', 'desc': "This paper investigates why large language models sometimes provide answers to questions that are structurally impossible, like certain math problems or code evaluations. It finds that these models can recognize when a question is unanswerable, but they fail to abstain from answering due to a misalignment in their internal pathways. The research shows that there is a specific direction in the model's hidden state that indicates impossibility, but this direction does not align with the pathways that handle safety refusals. Ultimately, the authors conclude that the issue is more about how the model routes its recognition of impossibility rather than a failure to encode that information."}, 'zh': {'title': '识别与拒绝：大型语言模型的路由挑战', 'desc': '这篇论文探讨了大型语言模型在处理结构上不可能的问题时的表现。研究发现，这些模型能够识别出哪些数学或代码提示是无法回答的，但在实际生成答案时却未能拒绝这些问题。作者指出，这种失败更像是路由问题，而不是编码问题，因为模型在隐藏状态中有一个方向可以区分可回答和不可能的问题。最后，论文提出需要调整安全拒绝路径，以便更好地利用模型的识别信号。'}}}, {'id': 'https://huggingface.co/papers/2510.08999', 'title': 'SQS: Bayesian DNN Compression through Sparse Quantized Sub-distributions', 'url': 'https://huggingface.co/papers/2510.08999', 'abstract': 'Abstract A unified Bayesian variational framework combining spike-and-slab sparsity and Gaussian mixture quantization achieves high compression rates for large neural networks with minimal accuracy loss.  Generated by thinkingmachines/Inkling-Small
