    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.21099', 'title': 'ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models', 'url': 'https://huggingface.co/papers/2611.21099', 'abstract': 'Abstract  Frontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarness, a harness that lets frozen models use force without demonstrations or finetuning. After calibrating hand force from a wrist sensor or joint torques alone, ForceHarness addresses the first challenge with self-terminating force primitives that regulate force on their own and return at a contact event. To address the second challenge, a physics translation layer turns each force trace into physical quantities with uncertainty as the tool result. To evaluate ForceHarness against expert force controllers and learned policies under identical conditions, we also build HiddenPhys, a seven-task MuJoCo benchmark with hidden physical variables. On a real arm without a wrist force sensor, ForceHarness raises the zero-shot success rate of GPT-6 Astra from 3.3% to 90.0%. In simulation, it adds 17.5 percentage points on the public ForceBench suite and 34.3 percentage points on HiddenPhys, surpassing force-aware policies trained on demonstrations on both benchmarks and matching hand-written expert controllers on HiddenPhys. Ablations further show that smaller models make significantly better decisions when given physical quantities rather than raw force values.', 'score': 19, 'issue_id': 3544, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': 'f1c69c334088b414', 'authors': ['Ke Sun', 'Kevin Yuchen Ma', 'Yike Zhang', 'Yanzhe Chen', 'Mike Zheng Shou'], 'affiliations': ['Show Lab, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.21099.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#robotics', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Дай модели почувствовать силу: физика вместо сырых данных', 'desc': 'Авторы представляют ForceHarness, систему-обёртку, которая позволяет замороженной мультимодальной LLM управлять роботом с учётом силы контакта без демонстраций и дообучения. Нижний уровень замыкает управление силой через self-terminating force primitives, которые сами регулируют усилие и возвращаются при событии контакта. Слой физической трансляции превращает сырые данные силы в физические величины с неопределённостью, понятные модели. На бенчмарке HiddenPhys и ForceBench система превосходит policy, обученные на демонстрациях, и не уступает экспертным контроллерам, а на реальной руке повышает zero-shot success rate с 3.3% до 90%.'}, 'en': {'title': 'Turn force into physics a frozen model can understand', 'desc': 'ForceHarness enables frozen, API-only multimodal models to use contact forces without demonstrations or fine-tuning. It uses self-terminating force primitives to control contact quickly, then translates force traces into physical quantities with uncertainty that the model can interpret. The authors also introduce HiddenPhys, a seven-task MuJoCo benchmark with hidden physical properties. ForceHarness improves zero-shot robot success and, on the evaluated benchmarks, outperforms demonstration-trained force-aware policies or matches expert controllers; results also show that physical quantities help smaller models make better decisions than raw force readings.'}, 'zh': {'title': '让冻结模型读懂力，零样本机器人操作更可靠', 'desc': '本文提出 ForceHarness，让冻结的多模态模型无需示范数据或微调，也能利用力信息完成机器人操作。它用可自行调节力度、并在接触事件发生时结束的力控制原语，在模型决策之间快速闭环控制接触力。它还将力传感器或关节力矩得到的原始力信号，转换为带有不确定性的物理量，供模型理解和推理。实验显示，ForceHarness 大幅提升了零样本操作成功率，并在多个基准测试中优于示范训练的力感知策略。'}}}, {'id': 'https://huggingface.co/papers/2611.22055', 'title': "Weight-Space Programming Doesn't Need Transformers", 'url': 'https://huggingface.co/papers/2611.22055', 'abstract': 'Abstract When large language models write neural network weights without gradient-based training, they tend to design sparse table or associative-memory models that outperform same-sized Transformers with far fewer parameters and faster GPU inference, though pretrained LLMs remain more accurate.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed architecture or designing the architecture themselves. When free to design, all three compile plain-text facts into a sparse table queried by a fixed procedure, reaching up to 54.4% test accuracy. An LLM-designed model achieves higher test accuracy than the most accurate released Transformer that the same LLM wrote while using about 1,800x fewer parameters. Without gradients, they choose a table, in which the LLM can state what each weight means and can find and rewrite a wrong one. Each wrong answer points to one row, and removing a row changes about one other answer. From this, we propose an associative-memory-based model up to 17x faster on GPUs than a same-sized Transformer. We also test pretrained weights, other benchmarks, and tasks where models generate answers. Pretrained LLMs remain more accurate; the claim concerns which structure to build when writing weights.', 'score': 18, 'issue_id': 3544, 'pub_date': '2026-11-17', 'pub_date_card': {'ru': '17 ноября', 'en': 'November 17', 'zh': '11月17日'}, 'hash': 'c270249333abe64c', 'authors': ['Hyunjong Ok', 'Jaeho Lee'], 'affiliations': ['Pohang University of Science and Technology (POSTECH)'], 'pdf_title_img': 'assets/pdf/title_img/2611.22055.jpg', 'data': {'categories': ['#optimization', '#interpretability', '#benchmark', '#architecture', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Без градиентов LLM сама выбирает архитектуру: таблица побеждает Transformer', 'desc': 'Авторы исследуют, какую архитектуру нейросети выгоднее создавать, когда LLM пишет веса напрямую, без градиентного обучения. Оказалось, что LLM чаще проектирует разреженные табличные модели или associative-memory модели, которые при меньшем числе параметров превосходят Transformer того же размера и работают быстрее на GPU. Например, LLM-спроектированная модель использует примерно в 1800 раз меньше параметров и достигает большей точности, чем лучший Transformer, написанный той же LLM. Предложенная associative-memory модель до 17 раз быстрее Transformer на GPU, хотя предобученные LLM по-прежнему точнее.'}, 'en': {'title': 'When LLMs write the weights, tables can beat Transformers', 'desc': 'The paper studies how large language models (LLMs) design neural networks by writing their weights directly, without gradient-based training. Given a few examples, LLMs often build sparse tables that store facts and retrieve them with a fixed procedure, rather than using Transformers. These associative-memory models can outperform LLM-written Transformers on test accuracy while using far fewer parameters, and can run faster on GPUs. Pretrained LLMs are still more accurate overall; the findings concern which architecture works best when an LLM writes the weights.'}, 'zh': {'title': '不靠梯度写权重：让稀疏表格取代庞大Transformer', 'desc': '本文研究大型语言模型在不使用梯度训练、而是直接编写模型权重时，应该采用什么网络结构。实验中，模型倾向于把事实整理成稀疏表格，并用固定程序查询；这种结构在多选题上最高达到54.4%的准确率。与同一模型编写的最佳Transformer相比，表格模型准确率更高，参数量约少1800倍；作者还提出一种联想记忆模型，其GPU推理速度最高可快17倍。预训练的大型语言模型仍然更准确，因此本文的结论是：当模型需要直接编写权重时，表格或联想记忆结构可能比Transformer更合适。'}}}, {'id': 'https://huggingface.co/papers/2611.19800', 'title': 'Multi-Branch Transformer', 'url': 'https://huggingface.co/papers/2611.19800', 'abstract': "Abstract Branching Transformer blocks into parallel parameterized branches, combined with shared KV caching, improves language model quality and inference efficiency compared with standard sequential Transformers.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MBT variants: Wide-Shallow preserves block width, Narrow-Deep preserves sequential depth, and Balanced interpolates between them. In controlled pretraining experiments at four mixture-of-experts scales (0.8B to 2.1B total parameters), 2-branch Wide-Shallow MBTs consistently outperform sequential Transformers under matched parameter and training-compute budgets. Balanced MBTs improve further and retain comparable quality as the number of branches increases. To improve inference efficiency at long contexts, we introduce Joint-KV, which constructs a shared KV cache from branch representations at each depth. Our final recipe combines Balanced MBTs with Joint-KV, supported by an inference engine that exploits branch grouping and shared-cache reuse. Fitted scaling curves indicate that standard Transformers require up to 1.26x as much training body compute to match our final models' validation loss. These models reduce full-model KV-cache storage by up to 34% and deliver up to 51.4% higher decoding throughput on a single H200 GPU. Ablation studies show that branching yields gains beyond changes in width and depth, enables an effective KV-sharing strategy (Joint-KV), remains robust across fusion functions, and performs best in the middle layers. These findings show that branching offers a practical path for scaling language models toward both better modeling quality and faster inference.", 'score': 17, 'issue_id': 3544, 'pub_date': '2026-11-15', 'pub_date_card': {'ru': '15 ноября', 'en': 'November 15', 'zh': '11月15日'}, 'hash': 'c2532b0d6739e152', 'authors': ['Gaotang Li', 'Lingjie Chen', 'Chunyuan Deng', 'Zhiwei Xu', 'Hongzheng Chen', 'Christopher De Sa', 'Jingrui He', 'Yingheng Wang', 'Hanghang Tong'], 'affiliations': ['Cornell University', 'Rice University', 'University of Illinois Urbana-Champaign', 'University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2611.19800.jpg', 'data': {'categories': ['#inference', '#architecture', '#optimization', '#training'], 'emoji': '🌿', 'ru': {'title': 'Параллельные ветви Transformer: больше качества и скорости без роста глубины', 'desc': 'В статье предлагается Multi-Branch Transformer (MBT): вместо простого увеличения ширины или глубины модели блоки Transformer выполняются параллельно в нескольких независимо параметризованных ветвях, а их выходы объединяются перед общими финальными слоями. Авторы сравнивают варианты Wide-Shallow, Narrow-Deep и Balanced при одинаковом бюджете вычислений и показывают, что MBT превосходят стандартные последовательные Transformer по качеству языкового моделирования. Для ускорения инференса на длинных контекстах введён метод Joint-KV, который строит общий KV-кэш из представлений ветвей, что снижает объём памяти и повышает пропускную способность декодирования. Итоговый рецепт, сочетающий Balanced MBT и Joint-KV, требует до 1.26x меньше вычислений для достижения того же validation loss и увеличивает throughput на одном H200 до 51.4%.'}, 'en': {'title': 'Branch in parallel for better models and faster inference', 'desc': 'The Multi-Branch Transformer (MBT) runs several independently parameterized Transformer branches in parallel between shared initial and final layers. In controlled pretraining, balanced branching improves validation quality over standard Transformers at similar parameter and compute budgets, with gains beyond simply changing model width or depth. Joint-KV combines branch representations into a shared key-value cache, reducing cache storage by up to 34% and increasing decoding throughput by up to 51.4% on one H200 GPU. The results suggest that branching is a practical way to improve language-model quality while making inference more efficient.'}, 'zh': {'title': '让 Transformer 并行分支，兼顾更强建模与更快推理', 'desc': '本文提出多分支 Transformer（MBT），让输入经过共享的前层后，再由多个各自拥有参数的 Transformer 分支并行处理，最后融合结果并送入共享的后层。在相近的参数量和训练计算量下，实验发现，平衡型 MBT 的验证效果优于标准串行 Transformer，且增加分支数时仍能保持良好表现。为提升长上下文推理效率，作者提出 Joint-KV，在不同分支间共享键值（KV）缓存，并配合专用推理引擎减少缓存存储、加快解码。结果显示，与标准 Transformer 相比，该方案最多可减少 34% 的 KV 缓存，并在单张 H200 GPU 上将解码吞吐量提高 51.4%，说明并行分支有助于同时提升模型质量与推理效率。'}}}, {'id': 'https://huggingface.co/papers/2611.19559', 'title': 'ResWAM: Learning What Changes, Not What Stays, for World-Action Models', 'url': 'https://huggingface.co/papers/2611.19559', 'abstract': 'Abstract ResWAM combines visual residual learning in frozen DINOv3 features with a lightweight dual-branch DiT trained via conditional flow matching to improve vision-language-action policy success while lowering training and inference compute.  Generated by deepseek-ai/DeepSeek-V4.1-Flash World-action models (WAMs) augment vision-language-action policies (VLAs) with future prediction so that the policy can anticipate how its actions will affect the physical world. Existing WAMs supervise complete future observations. However, observations typically change little over an action chunk, so the future loss is dominated by copying static background content rather than learning task-relevant robot and object motion, limiting policy learning. Moreover, existing WAMs rely on large video generation models or separate world models, incurring heavy training and inference compute that hinders closed-loop deployment. To improve policy performance, we propose visual residual learning, supervising only the feature change from the current frame to the future frame in a frozen DINOv3 space. Compared with complete future features, this residual learning target yields a higher feature rank with richer and more diverse representations of scene changes, and spatially concentrates on the robot arm and manipulated objects rather than the background. To further improve computational efficiency, we present ResWAM, a residual world-action model with 2.3B parameters in total, including a lightweight 0.5B dual-branch DiT that jointly trains an action branch and a residual branch via conditional flow matching. Without robot pretraining (i.e., pretraining on external robot action trajectories beyond the benchmark demonstrations), ResWAM achieves top average success rates on LIBERO-Plus (81.1%), RoboTwin 2.0 (93.8%), and RoboDojo (9.40% success, 13.41 score) at the lowest training (2.7-4.0 TFLOPs) and inference compute (1.0-1.4 TFLOPs), and leads real-robot Open, Put, and Stack (80.0% average, +10.0% over π_{0.5}) at 92.7 ms latency.', 'score': 8, 'issue_id': 3544, 'pub_date': '2026-11-14', 'pub_date_card': {'ru': '14 ноября', 'en': 'November 14', 'zh': '11月14日'}, 'hash': 'f8c2eab80519964d', 'authors': ['Chongyu Fan', 'Gaowen Liu', 'Ramana Rao Kompella', 'Jason Corso', 'Sijia Liu'], 'affiliations': ['Cisco', 'IBM Research', 'Michigan State University', 'University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2611.19559.jpg', 'data': {'categories': ['#training', '#diffusion', '#cv', '#benchmark', '#architecture', '#inference', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Учимся предсказывать не фон, а движение: меньше вычислений, больше успеха робота', 'desc': 'В статье представлена ResWAM — модель мира для действий (World-action model) с 2.3 млрд параметров, которая обучается предсказывать не полные будущие наблюдения, а только изменение признаков между текущим и будущим кадром в замороженном пространстве DINOv3. Такая residual-цель убирает доминирование статичного фона в функции потерь и концентрирует обучение на движении манипулятора и объектов. Лёгкий dual-branch DiT (0.5 млрд параметров) совместно обучает action-ветку и residual-ветку с помощью conditional flow matching. Модель показывает лучшие средние результаты на LIBERO-Plus, RoboTwin 2.0 и RoboDojo при минимальных вычислительных затратах и задержке 92.7 мс на реальном роботе.'}, 'en': {'title': 'Predict the Change, Not the Background', 'desc': 'ResWAM helps a vision-language-action policy predict how its actions will change the scene. Instead of predicting the entire future image, it learns changes in frozen DINOv3 visual features, focusing on robot and object motion rather than static backgrounds. A lightweight dual-branch DiT learns both actions and feature changes using conditional flow matching, reducing training and inference compute. ResWAM achieves strong benchmark and real-robot success rates with low latency, without pretraining on extra robot action trajectories.'}, 'zh': {'title': '聚焦变化，以更低算力让机器人预见行动后果', 'desc': '这篇论文提出 ResWAM，让视觉-语言-动作策略预测动作之后的世界变化，同时减少计算开销。它不再预测完整的未来画面，而是在冻结的 DINOv3 特征空间中学习当前与未来特征之间的残差，从而更关注机械臂和物体的运动，而不是静态背景。模型采用轻量级双分支 DiT，通过条件流匹配联合训练动作分支与残差分支。实验显示，ResWAM 在多个仿真基准和真实机器人任务上取得较高成功率，并保持较低的训练、推理计算量与延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.15348', 'title': 'Breath-Dx: A Time Series Classification Benchmark for Disease Screening with eNose', 'url': 'https://huggingface.co/papers/2611.15348', 'abstract': 'Abstract A comprehensive benchmark evaluates time-series classification methods on a large clinical breath dataset under realistic temporal splits, showing that sensor drift lowers performance and recurrent models are most consistent across diseases.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Electronic nose (eNose) technology offers a portable, non-invasive route for disease screening via exhaled breath analysis. However, progress in the field is hindered by the lack of systematic benchmarks that compare machine learning methods under realistic conditions, particularly sensor drift, a known but rarely quantified failure mode. Most existing studies rely on small, private datasets with inconsistent protocols, rendering results non-comparable and slowing progress. We introduce Breath-Dx, the first comprehensive benchmark of time series classification methods for breath-based disease screening. Our work leverages the Scent of Health (S-OH) dataset, the largest public clinical eNose collection to date, comprising 1,234 patients across nine diagnostic groups, each providing a 17-channel multivariate time series with explicit temporal train/test splits that account for sensor drift. We systematically evaluate 10 methods spanning four families: feature-based tabular learners, convolution-based models, graph-based, and time series architectures. All methods degrade significantly under temporal validation (0.05-0.12 AUC drop compared to random cross-validation), confirming that drift embeds a strong temporal signal. Under this realistic evaluation, the best methods achieve ROC AUC of 0.74-0.76 for some lung conditions, though others remain near chance. Recurrent architectures show the most consistent performance across diseases, while specialized time series methods achieve the highest peak results. Demographic confounders matter: breath signals provide independent diagnostic value for some conditions but add little beyond age for others. We release the S-OH dataset, all temporal splits, evaluation protocols, and code to enable reproducible research and accelerate progress in clinical breathomics.', 'score': 8, 'issue_id': 3544, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'd89a1fbcbef55318', 'authors': ['Ivan Poddiakov', 'Ivan Kruzhilov', 'Galina Zubkova', 'Svetlana Erofeeva', 'Andrey Savchenko', 'Pavel Blinov'], 'affiliations': ['HSE University', 'Moscow Power Engineering Institute', 'Moscow Regional Research and Clinical Institute (MONIKI)', 'SQB AI', 'Sber AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.15348.jpg', 'data': {'categories': ['#data', '#survey', '#open_source', '#benchmark', '#graphs', '#healthcare', '#dataset', '#leakage'], 'emoji': '🫁', 'ru': {'title': 'Честный бенчмарк: дрейф сенсоров реально ломает диагностику по дыханию', 'desc': 'Статья представляет Breath-Dx — первый комплексный бенчмарк методов классификации временных рядов для диагностики заболеваний по выдыхаемому воздуху с помощью электронного носа. Авторы используют крупнейший открытый клинический датасет S-OH (1234 пациента, девять диагнозов, 17 каналов сенсоров) с временным разбиением на train и test, учитывающим дрейф сенсоров. Сравниваются 10 методов из четырёх семейств: табличные модели на признаках, свёрточные, графовые и архитектуры для временных рядов. Показано, что при временной валидации качество падает на 0.05–0.12 AUC, а рекуррентные сети оказываются наиболее стабильными между заболеваниями.'}, 'en': {'title': 'Testing Breath-Based Diagnosis Against Real-World Sensor Drift', 'desc': 'This paper introduces Breath-Dx, a benchmark for comparing machine learning methods that classify diseases from electronic-nose breath measurements. It evaluates 10 methods on time-series data from 1,234 patients, using temporal train/test splits that reflect sensor drift. Performance drops under these realistic splits, and recurrent models perform most consistently across diseases, although specialized time-series models achieve the highest scores for some conditions. The benchmark also examines demographic confounders and releases its data, protocols, and code to support reproducible research.'}, 'zh': {'title': '让呼气疾病筛查经得起时间漂移考验', 'desc': '本文提出 Breath-Dx 基准，用于系统比较电子鼻呼气疾病筛查中的时间序列分类方法。研究使用包含 1,234 名患者、九类诊断和 17 通道传感器数据的公开临床数据集，并采用按时间划分的训练集与测试集来评估真实场景下的传感器漂移。结果显示，时间划分下各方法的 AUC 比随机交叉验证低 0.05 至 0.12；循环神经网络在不同疾病上表现最稳定，而专用时间序列模型在部分任务上取得最高表现。研究还发现，呼气信号对某些疾病能提供独立于年龄的诊断信息，并公开数据、划分方案与代码以支持可复现研究。'}}}, {'id': 'https://huggingface.co/papers/2611.20992', 'title': 'MedJev: A System One Vision-Language Decision Model for Fast and Effective Medical Image Understanding', 'url': 'https://huggingface.co/papers/2611.20992', 'abstract': 'Abstract  Medical image understanding with vision-language models (VLMs) typically relies on autoregressively generating reasoning and answer tokens. These unnecessary tokens make the inference cost scale with the response length and force the answer to be parsed from free-form text, incurring avoidable latency and decision errors. To this end, we introduce MedJev, a system one vision-language decision model that maps medical images, questions, and candidate answers directly to decisions in a single multimodal forward pass, without any autoregressive generation process. For fast inference, MedJev removes the upper language layers and the generative output pathway, while keeping the full vision pathway and all visual tokens. On this shortened backbone, a decision head scores each candidate by pretrained query--key matching and refines the scores with a lightweight multilayer perceptron (MLP) residual, coupling the pretrained matching structure with task-specific nonlinear discrimination. Built on Qwen3.5-4B, MedJev-4B improves both accuracy and speed over the original model on each of four medical image classification and visual question answering benchmarks, with an absolute accuracy gain of 7.93\\% and a 6.04times end-to-end speedup. Further comparison with 20 cutting-edge models shows that MedJev-4B achieves state-of-the-art performance and inference speed among 4B--9B general and medical VLMs, indicating that direct multimodal decision making is an effective route to fast and effective medical image understanding.', 'score': 8, 'issue_id': 3544, 'pub_date': '2026-11-16', 'pub_date_card': {'ru': '16 ноября', 'en': 'November 16', 'zh': '11月16日'}, 'hash': '52e184293d3d7e77', 'authors': ['Fan Zhang', 'Hao Wu', 'Jinyang Wu', 'Hongyu Qu', 'Zheng Lian', 'Dongfu Yin', 'Qingsong Wen', 'Pheng-Ann Heng'], 'affiliations': ['Guangdong Laboratory of Artificial Intelligence and Digital Economy (SZ)', 'National University of Singapore', 'Squirrel Ai Learning', 'The Chinese University of Hong Kong', 'Tongji University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.20992.jpg', 'data': {'categories': ['#optimization', '#science', '#multimodal', '#architecture', '#inference', '#healthcare'], 'emoji': '🩺', 'ru': {'title': 'Быстрый медицинский диагноз: решение за один проход вместо генерации текста', 'desc': 'В статье представлена система MedJev — vision-language модель для медицинских изображений, которая выбирает ответ напрямую за один мультимодальный forward pass, без autoregressive генерации токенов. Для ускорения авторы удаляют верхние языковые слои и генеративный выходной путь, но сохраняют полный vision-путь и все visual tokens. Поверх укороченной модели работает decision head, который оценивает кандидатов через предобученное query-key matching и уточняет оценки с помощью лёгкого MLP residual. На базе Qwen3.5-4B модель MedJev-4B повышает точность на 7.93% и ускоряет инференс в 6.04 раза по сравнению с исходной моделью, а также показывает state-of-the-art результаты среди VLM размером 4B–9B.'}, 'en': {'title': 'Decide directly: faster, more accurate medical image understanding', 'desc': 'MedJev answers medical image questions by directly choosing among candidate answers in a single multimodal forward pass, instead of generating text token by token. It speeds inference by removing the upper language layers and text-generation pathway while retaining the full vision pathway and visual tokens. A decision head combines pretrained query–key matching with a lightweight multilayer perceptron (MLP) to score the candidates. On four benchmarks, MedJev-4B improves accuracy by 7.93 percentage points and runs 6.04 times faster than its original model, while achieving state-of-the-art results among compared 4B–9B vision-language models.'}, 'zh': {'title': '跳过冗长生成，让医学影像判断更快更准', 'desc': '这篇论文提出了 MedJev，让视觉语言模型直接根据医学图像、问题和候选答案进行判断，不再逐字生成推理和回答。它精简了模型的语言层与生成模块，同时保留完整的视觉处理路径，并用决策头为候选答案打分。决策头结合预训练模型的查询—键匹配与轻量级多层感知机（MLP），以提升判断能力。在四项医学影像分类和视觉问答基准测试中，MedJev-4B 的准确率绝对提升了 7.93%，端到端推理速度提高了 6.04 倍，并在同规模模型中取得领先表现。'}}}];

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (1)', '#agi', '#alignment', '#architecture (4)', '#audio', '#benchmark (4)', '#cv (1)', '#data (1)', '#dataset (1)', '#diffusion (1)', '#ethics', '#games', '#graphs (1)', '#hallucinations', '#healthcare (2)', '#inference (4)', '#interpretability (1)', '#leakage (1)', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (2)', '#open_source (1)', '#optimization (3)', '#plp', '#rag', '#reasoning', '#rl', '#rlhf', '#robotics (2)', '#science (1)', '#security', '#small_models', '#story_generation', '#survey (1)', '#synthetic', '#training (2)', '#transfer_learning', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-18 04:00',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-18 04:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-18 04:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
