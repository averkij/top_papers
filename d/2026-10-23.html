ting over confidential data. We quantify its realization with 30 synthetic cybersecurity, medical, and military examples, yielding 10,800 final answers from three LLM agents in controlled simulation and 1,440 answers from live agents in two open-source harnesses. Even under benign queries designed to be answerable from one document, GPT-5.6-Sol, the best performing model tested, discloses forbidden composites in 7.08% of answers (95% CI: 3.75-10.67%) in simulation, with worse disclosure rates in live harnesses. Adding visible classification headers and explicit aggregation rules reduces pooled disclosure rates substantially, yet unsafe disclosures persist in 32.37% of simulated answers (95% CI: 28.33-36.19%) across all intents despite these safeguards. Furthermore, increased refusals do not guarantee confidentiality, since significant refusals reveal the prohibited conclusion regardless. These results point to a troubling conclusion: sensitive data leaks via mosaic-style events are an observed confidentiality failure mode in the evaluated settings at non-negligible rates. They motivate stronger controls on what agents may infer and disclose in sensitive data environments with mixed-clearance users.', 'score': 16, 'issue_id': 3455, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'e2187496737893fe', 'authors': ['Daniel Ruiz', 'Luca Luceri', 'Emilio Ferrara'], 'affiliations': ['Information Sciences Institute, University of Southern California, Los Angeles, CA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.30418.jpg', 'data': {'categories': ['#ethics', '#leakage', '#dataset', '#security', '#agents', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Агенты LLM собирают секреты из безобидных кусочков', 'desc': 'Статья исследует проблему «эффекта мозаики», при которой LLM-агенты собирают чувствительные выводы из нескольких конфиденциальных документов, даже если каждый из них по отдельности безопасен. Авторы создали 30 синтетических примеров из кибербезопасности, медицины и военной сферы и оценили ответы трёх моделей в симуляции и двух open-source агентных фреймворков. Даже лучшая модель раскрывала запрещённые композиты в 7,08% ответов, а стандартные меры защиты (заголовки классификации и правила агрегации) снижали утечки, но не устраняли их, оставляя примерно 32% небезопасных ответов. Работа показывает, что повышенный отказ модели не гарантирует конфиденциальность, и призывает к более строгому контролю того, какие выводы агенты могут делать и раскрывать.'}, 'en': {'title': 'Mosaic-Style Disclosure: A Hidden Risk in LLMs', 'desc': 'This paper discusses the risk of sensitive information being leaked by large language model (LLM) agents through a phenomenon called mosaic-style disclosure. Even when safeguards are in place, these agents can combine information from multiple documents to form sensitive conclusions, leading to potential confidentiality breaches. The study quantifies this risk using simulations and real-world tests, revealing that even the best-performing model still discloses sensitive information in a significant percentage of cases. The findings highlight the need for improved controls and guidelines to prevent such leaks in environments handling confidential data.'}, 'zh': {'title': '加强敏感数据保护，防止信息泄露', 'desc': '本论文探讨了大型语言模型（LLM）代理在处理多个机密文档时，如何泄露敏感信息。研究发现，常见的安全措施无法有效消除这种马赛克式的信息泄露风险。通过对30个合成的网络安全、医疗和军事示例进行量化分析，结果显示即使在设计良好的查询下，模型仍然会泄露敏感信息。论文强调需要加强对代理在敏感数据环境中推断和披露信息的控制，以防止数据泄露。'}}}, {'id': 'https://huggingface.co/papers/2610.27712', 'title': 'RLSplat: Resource-Linear Budget Control for Feed-forward 3D Gaussian Splatting', 'url': 'https://huggingface.co/papers/2610.27712', 'abstract': 'Abstract RLSplat enables feed-forward 3D Gaussian splatting with linear reductions in latency, memory, and model size by allocating Gaussians regionally and decoding them via local attention.  Generated by thinkingmachines/Inkling-Small Feed-forward 3D Gaussian Splatting (FF3DGS) reconstructs 3D scenes from images in a single forward pass, making it well-suited to applications that must operate within limited resource budgets. To further improve its practicality, recent budget-controllable FF3DGS methods allow the number of Gaussians to be adjusted at inference, so that the output meets a given storage limit or rendering-latency constraint. However, these methods overlook the cost of inference itself: to produce a representation with the target number of Gaussians, they first predict a dense set of Gaussians and then prune or select from it, requiring nearly constant latency and peak memory regardless of the budget. We therefore propose RLSplat, a resource-linear budget-controllable FF3DGS framework whose representation size, inference latency, and peak memory all decrease linearly as the Gaussian budget is reduced. Instead of pruning or selection, RLSplat learns a Gaussian allocation policy that distributes the budget across local scene regions, so that exactly the requested number of Gaussians is generated. These Gaussians are then refined through resource-linear Gaussian decoding, in which each Gaussian attends only to nearby Gaussians found via an efficient hierarchical neighbor search, so that the decoding cost decreases linearly with fewer Gaussians. In zero-shot evaluation, RLSplat outperforms prior budget-controllable methods at every budget, surpassing the strongest baseline even with 4times fewer Gaussians, while running up to 4.1times faster with 9.6times less peak memory at low budgets.', 'score': 15, 'issue_id': 3453, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '18c40edba9d328ad', 'authors': ['Injae Kim', 'Minseok Joo', 'Jihwan Park', 'Sehyung Kim', 'Minseong Bae', 'Hyunwoo J. Kim'], 'affiliations': ['KAIST', 'Korea University'], 'pdf_title_img': 'assets/pdf/title_img/2610.27712.jpg', 'data': {'categories': ['#3d', '#inference', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Столько гауссиан, сколько нужно: линейная экономия ресурсов в 3D-реконструкции', 'desc': 'В статье представлен RLSplat — фреймворк для feed-forward 3D Gaussian Splatting, в котором число гауссиан задаётся заранее, а затраты на инференс линейно падают вместе с бюджетом. Вместо предсказания плотного набора гауссиан с последующим прунингом модель обучает policy распределения бюджета по локальным регионам сцены. Далее гауссианы уточняются через local attention с иерархическим поиском соседей, так что стоимость декодирования также растёт линейно. На zero-shot бенчмарках RLSplat превосходит предыдущие budget-controllable методы при любом бюджете, работая до 4.1 раза быстрее и с 9.6 раза меньшим пиковым потреблением памяти.'}, 'en': {'title': 'Efficient 3D Scene Reconstruction with RLSplat', 'desc': 'RLSplat is a new method for 3D Gaussian splatting that improves efficiency in terms of latency, memory usage, and model size. It allocates Gaussians based on local scene regions and uses local attention for decoding, allowing for faster processing while maintaining quality. Unlike previous methods that predict a dense set of Gaussians and then prune them, RLSplat generates exactly the number of Gaussians needed, which reduces resource consumption linearly. In tests, RLSplat shows significant improvements over existing methods, achieving faster performance and lower memory usage even with fewer Gaussians.'}, 'zh': {'title': 'RLSplat：高效的3D高斯点云渲染方法', 'desc': 'RLSplat是一种前馈3D高斯点云渲染方法，通过区域分配高斯并利用局部注意力解码，线性降低延迟、内存和模型大小。该方法能够在单次前向传递中从图像重建3D场景，非常适合资源有限的应用。与之前的方法不同，RLSplat通过学习高斯分配策略，确保生成的高斯数量正好满足预算要求，而不是先生成密集的高斯再进行修剪。在零样本评估中，RLSplat在每个预算下都优于之前的预算可控方法，且在低预算情况下运行速度提高了4.1倍，峰值内存减少了9.6倍。'}}}, {'id': 'https://huggingface.co/papers/2610.30755', 'title': 'Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought', 'url': 'https://huggingface.co/papers/2610.30755', 'abstract': 'Abstract Raw retrieval-augmented generation over unprocessed conversation history outperforms complex agentic memory systems across multiple benchmarks, indicating that preserving raw evidence is more critical than elaborate memory transformations.  Generated by thinkingmachines/Inkling-Small LLM memory is widely used in long-term conversation understanding. Agentic memory systems often use mutation, structural organization, learned retrieval strategies, or other complex operations. Is this complexity always necessary? We study Raw-RAG, a naive RAG baseline using dense retrieval and reranking over raw history to supply evidence to a reader LLM. Across LoCoMo, LongMemEval, MEME, and MemoryAgentBench, Raw-RAG ranks first among the compared memory systems in six of seven benchmark-model settings, outperforming the strongest compared agentic memory system by 0.13-5.53 points. We investigate why raw-history retrieval remains competitive. Evidence analysis shows that its higher coverage of necessary evidence can offset lower utilization. Useful evidence includes both answer values and the relations and dependency paths needed to derive them. Even complete access to transformed memory stores leaves an accuracy gap relative to raw evidence, highlighting the importance of preserving raw information. These findings challenge the necessity of complex agentic memory for the evaluated conversation tasks and establish naive RAG as an essential baseline.', 'score': 15, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '937841664c6011bf', 'authors': ['Zhengye Bao', 'Shengtao Zhang', 'Haokai Zhang', 'Shiqi Lou', 'Muning Wen', 'Minnan Luo'], 'affiliations': ['Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Xian Jiaotong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.30755.jpg', 'data': {'categories': ['#benchmark', '#rag', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Сырые данные важнее сложной памяти', 'desc': 'Авторы показывают, что простой RAG (retrieval-augmented generation) по сырой истории диалогов с плотным поиском (dense retrieval) и переранжированием (reranking) часто превосходит сложные агентные системы памяти для LLM. Эксперименты на бенчмарках LoCoMo, LongMemEval, MEME и MemoryAgentBench показали, что Raw-RAG занимает первое место в шести из семи конфигураций. Анализ объясняет это тем, что сырой контекст лучше покрывает нужные доказательства, а не преобразованная память теряет важные связи и зависимости. Работа ставит под сомнение необходимость усложнённой агентной памяти и предлагает считать наивный RAG обязательным базовым уровнем сравнения.'}, 'en': {'title': 'Raw Evidence Trumps Complexity in Memory Systems', 'desc': 'This paper explores the effectiveness of a simple memory system called Raw-RAG, which uses raw conversation history for generating responses. It shows that this straightforward approach outperforms more complex memory systems that rely on advanced techniques like mutation and structural organization. The study reveals that retaining raw evidence is crucial for achieving better performance in long-term conversation understanding. The findings suggest that simpler methods can be just as effective, if not more so, than intricate memory transformations in certain tasks.'}, 'zh': {'title': '原始证据胜过复杂记忆系统', 'desc': '这篇论文探讨了在处理对话历史时，使用原始检索增强生成（Raw-RAG）的方法比复杂的代理记忆系统更有效。研究表明，保留原始证据比进行复杂的记忆转换更为重要。通过对多个基准测试的比较，Raw-RAG在六个测试设置中排名第一，超越了最强的代理记忆系统。研究结果表明，原始历史检索的高覆盖率能够弥补其较低的利用率，强调了保留原始信息的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.31305', 'title': 'Cola2: Co-Adaptive Hierarchical Language Modeling with Continuous Semantic Compression and Balanced Discrete Generation', 'url': 'https://huggingface.co/papers/2610.31305', 'abstract': 'Abstract Cola2 improves hierarchical language generation by jointly optimizing continuous semantic compression, reconstruction-generation balance, and encoder-decoder co-adaptation via dynamic span segmentation, masked diffusion decoding, and flow-matching priors.  Generated by thinkingmachines/Inkling-Small Hierarchical language generation separates continuous semantic modeling from discrete text realization, but its effectiveness depends on what the latent space compresses and how the discrete generator uses it. We propose Cola2, a framework that jointly studies continuous semantic compression, the balance between reconstruction and generation, and continuous-discrete co-adaptation. Cola2 dynamically segments text into semantic spans, controls the compression rate through auxiliary-loss-free negative feedback, and combines reconstruction and generation supervision to learn compact, predictive latent representations. A block-causal masked diffusion decoder is trained with clean, noisy, and dropped latent conditions, while classifier-free guidance adjusts the balance between semantic reconstruction and autonomous generation. Token-prediction gradients update the encoder through the latents, whereas Flow Matching prior learning is decoupled from representation learning by stop-gradient. During inference, generated text is re-encoded under a fixed span layout to keep the latent history consistent with the actual text context. Experiments on five downstream tasks with about 210 billion training tokens validate the core designs and show competitive, unsaturated scaling. With 346.03 billion source tokens, an unconverged checkpoint reaches a 60.10 average across eight tasks and surpasses Llama-3-8B on HellaSwag and StoryCloze despite its reported pretraining budget being over 43 times larger. These results demonstrate the potential of continuous-latent hierarchical language generation.', 'score': 14, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '3164466ce4b9963c', 'authors': ['Hongcan Guo', 'Yian Zhao', 'Feng Wang', 'Shen Nie', 'Guoqiang Wei', 'Yan Zeng', 'Hengshuang Zhao'], 'affiliations': ['ByteDance Seed', 'Peking University', 'Renmin University of China', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.31305.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#architecture', '#training'], 'emoji': '🧩', 'ru': {'title': 'Сжимать смысл, а не слова: иерархическая генерация текста в непрерывном латентном пространстве', 'desc': 'В статье предлагается Cola2 — фреймворк для иерархической генерации текста, который разделяет непрерывное семантическое моделирование и дискретную генерацию токенов. Модель динамически разбивает текст на смысловые спаны и совместно оптимизирует сжатие латентного пространства, баланс между реконструкцией и генерацией, а также адаптацию энкодера и декодера. Декодер на основе block-causal masked diffusion обучается с чистыми, зашумлёнными и отброшенными латентными условиями, а Flow Matching prior обучается отдельно через stop-gradient. Несмотря на меньший бюджет предобучения, непредобученная версия модели с 346 млрд токенов превосходит Llama-3-8B на HellaSwag и StoryCloze.'}, 'en': {'title': 'Cola2: Advancing Hierarchical Language Generation with Continuous-Latent Optimization', 'desc': 'The paper introduces Cola2, a novel framework for improving hierarchical language generation by optimizing the interplay between continuous semantic compression and discrete text generation. It emphasizes the importance of how latent spaces are compressed and utilized by the generator, proposing a method that dynamically segments text into semantic spans. Cola2 employs a masked diffusion decoder and classifier-free guidance to balance semantic reconstruction with autonomous generation, enhancing the quality of generated text. Experimental results show that Cola2 outperforms existing models on various tasks, demonstrating its effectiveness in continuous-latent hierarchical language generation.'}, 'zh': {'title': 'Cola2：提升层次语言生成的潜力', 'desc': 'Cola2是一种改进的层次语言生成框架，通过动态跨度分割、掩蔽扩散解码和流匹配先验，联合优化连续语义压缩、重建-生成平衡和编码器-解码器协同适应。该框架将连续语义建模与离散文本实现分开，强调潜在空间的压缩效果及离散生成器的使用方式。Cola2通过辅助损失无反馈的负反馈控制压缩率，并结合重建与生成监督，学习紧凑且具有预测性的潜在表示。实验结果表明，Cola2在多个下游任务中表现出色，展示了连续潜在层次语言生成的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.20091', 'title': 'RTAformer: Relation-Transition-Aware Transformer for Video Scene Graph Generation', 'url': 'https://huggingface.co/papers/2610.20091', 'abstract': 'Abstract RTAformer separately models persistent entities and changing relations in video scene graphs by injecting calibrated query differences and aligning cross-frame instances to overcome relational semantic inertia.  Generated by thinkingmachines/Inkling-Small Video scene graph generation (VidSGG) aims to capture objects and their evolving relationships in videos. This requires accounting for both the persistence of object identities and abrupt changes in relationships. Existing methods aggregate information across frames to exploit temporal context, but an emphasis on consistency can obscure these changes. As a result, a model may retain its previous prediction even after the underlying relation has changed. We refer to this failure mode as relational semantic inertia. To address this issue, we propose Relation-Transition-Aware Transformer (RTAformer), a one-stage framework that separately models entity persistence and relation changes. It injects calibrated differences between adjacent-frame relation queries to guide predicate updates, while cross-frame instance alignment during training helps reduce cross-frame representational drift. Experiments on Action Genome show improvements in recall and mean recall over existing methods, with ablation studies supporting the contributions of the proposed components and comparisons using matched backbones showing larger gains on relation-transition frames than on non-transition frames.', 'score': 12, 'issue_id': 3454, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': 'fa820c73bab1287d', 'authors': ['Jaeyeon Heo', 'Geuntaek Lim', 'Yukyung Choi'], 'affiliations': ['Sejong University, Seoul, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2610.20091.jpg', 'data': {'categories': ['#graphs', '#benchmark', '#video', '#cv', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Модель, которая замечает, когда отношения между объектами в видео меняются', 'desc': 'В статье представлен RTAformer — одноэтапная Transformer-модель для генерации графов сцены в видео (VidSGG), которая раздельно моделирует устойчивость объектов и изменения отношений между ними. Авторы вводят калиброванные разности между relation-запросами соседних кадров, чтобы управлять обновлением предикатов. Межкадровое выравнивание экземпляров на этапе обучения снижает дрейф представлений между кадрами. Эксперименты на Action Genome показывают прирост Recall и mean Recall, особенно на кадрах с переходами отношений.'}, 'en': {'title': 'Transforming Video Relationships with RTAformer', 'desc': "The paper introduces the Relation-Transition-Aware Transformer (RTAformer), a novel approach for video scene graph generation that effectively distinguishes between persistent entities and their changing relationships. It addresses the problem of relational semantic inertia, where models fail to adapt to new relationships due to an overemphasis on consistency across frames. By injecting calibrated differences in relation queries and aligning instances across frames, RTAformer enhances the model's ability to update relationships dynamically. Experimental results demonstrate that RTAformer outperforms existing methods in capturing evolving relationships in videos, particularly during transitions."}, 'zh': {'title': '突破关系语义惯性，提升视频场景图生成', 'desc': 'RTAformer是一种新型的模型，专门用于视频场景图生成，能够分别处理持久实体和变化关系。它通过注入相邻帧之间的关系查询差异，来指导关系的更新，从而克服关系语义惯性的问题。该模型在训练过程中对跨帧实例进行对齐，减少了跨帧表示的漂移。实验结果表明，RTAformer在召回率和平均召回率上优于现有方法，特别是在关系变化的帧上表现更为突出。'}}}, {'id': 'https://huggingface.co/papers/2610.30866', 'title': 'Verus-Insight: Towards Explainable Artifact Detection in AI-Generated Videos', 'url': 'https://huggingface.co/papers/2610.30866', 'abstract': 'Abstract Verus-Insight improves AI-generated video detection by training artifact detectors through structured inspection planning, evidence verification, and evidence aggregation with human-anchored supervision.  Generated by thinkingmachines/Inkling-Small Recent advances in video generation have made synthetic videos increasingly realistic, placing greater demands on reliable AI-generated video detection. Existing artifact-based detectors typically identify generation artifacts as evidence for source prediction, yet they may either fail to recognize subtle artifacts or reach the correct source decision without faithfully identifying the evidence underlying it. In this work, we systematically investigate how to design and train effective artifact detectors and formulate artifact detection as a structured process comprising three complementary capabilities: Inspection Planning, which determines what should be examined; Evidence Verification, which verifies whether the inspected content exhibits genuine generation artifacts; and Evidence Aggregation, which integrates the verified evidence into the final source decision. Building on this formulation, we introduce Verus-Insight, trained with human-anchored full-process supervision and progressive capability training to strengthen both fine-grained artifact detection and video-level detection. We further introduce Verus-Bench, a benchmark with fine-grained human annotations of perceptible artifacts for evaluating artifact detection. Extensive experiments across diverse benchmarks demonstrate that Verus-Insight achieves strong performance in both fine-grained artifact analysis and AI-generated video detection, with substantial gains in recovering human-perceived artifacts. Further analyses reveal that the three capabilities are complementary yet distinct, and that Verus-Insight more reliably converts relevant inspection targets into supported artifact evidence without increasing spurious artifact claims.', 'score': 12, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '625cff06ca88d381', 'authors': ['Zhuoran Zhang', 'Yang Shi', 'Qixun Wang', 'Tengfei Liu', 'Yuqi Tang', 'Xuanyu Zhu', 'Yizhuo Jia', 'Jingyun Hua', 'Shixuan Liu', 'Xianghua Ying', 'Haotian Wang', 'Yuanxing Zhang', 'Pengfei Wan', 'Wenjing Yang'], 'affiliations': ['Fudan University', 'HKUST (GZ)', 'Kling Team', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.30866.jpg', 'data': {'categories': ['#synthetic', '#interpretability', '#cv', '#dataset', '#security', '#training', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Не просто угадать, а показать улики: пошаговое обнаружение AI-видео', 'desc': 'Статья представляет Verus-Insight — подход к обнаружению видео, сгенерированных AI, который обучает детекторы артефактов как структурированный процесс из трёх этапов: планирование инспекции, проверка доказательств и агрегация доказательств. Модель обучается с помощью human-anchored full-process supervision и progressive capability training, что усиливает как детальный поиск артефактов, так и классификацию на уровне всего видео. Авторы также создали Verus-Bench — бенчмарк с тонкой разметкой заметных человеку артефактов для оценки качества детекции. Эксперименты показывают, что Verus-Insight превосходит аналоги и лучше восстанавливает артефакты, замеченные людьми, не увеличивая количество ложных утверждений об артефактах.'}, 'en': {'title': 'Enhancing AI Video Detection with Structured Artifact Analysis', 'desc': 'The paper presents Verus-Insight, a novel approach to improve the detection of AI-generated videos by focusing on artifact detection. It introduces a structured process that includes Inspection Planning, Evidence Verification, and Evidence Aggregation, which work together to enhance the accuracy of source predictions. By employing human-anchored supervision, Verus-Insight is trained to identify subtle artifacts more effectively and make reliable decisions based on verified evidence. The authors also introduce Verus-Bench, a benchmark for evaluating artifact detection with detailed human annotations, demonstrating that their method significantly outperforms existing techniques in recognizing perceptible artifacts.'}, 'zh': {'title': '提升 AI 生成视频检测的智能化方案', 'desc': 'Verus-Insight 是一种改进 AI 生成视频检测的方法，通过结构化的检查规划、证据验证和证据聚合来训练伪影检测器，并结合人类监督。该方法解决了现有伪影检测器在识别微妙伪影时的不足，并确保在做出源预测时能够准确识别证据。研究表明，Verus-Insight 通过人类监督的全流程训练和逐步能力训练，增强了细粒度伪影检测和视频级检测的效果。实验结果显示，Verus-Insight 在伪影分析和 AI 生成视频检测方面表现出色，显著提高了人类感知伪影的恢复能力。'}}}, {'id': 'https://huggingface.co/papers/2610.31574', 'title': 'Rethinking Sequence Compression with Test-time Regression', 'url': 'https://huggingface.co/papers/2610.31574', 'abstract': 'Abstract Test-time regression provides a learnable, closed-form alternative to pooling for compressing sequences in efficient language and multimodal models.  Generated by thinkingmachines/Inkling-Small Sequence compression is a fundamental operation and a critical information bottleneck in efficient language and multimodal models, and yet prevailing approaches based on pooling or learned projections remain underperforming. We revisit sequence compression through the lens of test-time regression: input tokens define a regression problem whose fitted coefficients form the compressed representation. Importantly, the regression problem is learned end-to-end via backpropagation, while its coefficients are computed efficiently in closed form during the forward pass. This leads to TTR-Compressor, a general alternative to conventional pooling and projection-based compression. We evaluate TTR-Compressor as the compressor for block-wise sparse attention and the visual token merger for multimodal large language models. On block-wise sparse attention, TTR-Compressor improves RULER performance over attention-based compressors by a large margin. For visual token merging, it consistently outperforms the standard MLP merger and matches its performance with 55.6% fewer visual tokens. These results establish test-time regression as an effective primitive for sequence compression in efficient language and multimodal models.', 'score': 12, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'ebbead31614081e8', 'authors': ['Sihan Yang', 'Jie Huang', 'Hanxuan Li', 'Yifan Guo', 'Weigao Sun', 'Yiran Zhong', 'Weiyang Liu'], 'affiliations': ['Independent Researcher', 'The Chinese University of Hong Kong', 'Token Foundry, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.31574.jpg', 'data': {'categories': ['#multimodal', '#long_context', '#inference', '#architecture'], 'emoji': '🧮', 'ru': {'title': 'Сжимаем последовательности через регрессию прямо во время инференса', 'desc': 'В статье предлагается TTR-Compressor, новый способ сжатия последовательностей в эффективных LLM и мультимодальных моделях, основанный на test-time regression. Входные токены задают задачу регрессии, а её коэффициенты, вычисляемые в замкнутом виде в forward pass, и становятся сжатым представлением. Вся регрессия обучается end-to-end через backpropagation, что делает метод обучаемой альтернативой pooling и проекциям. На block-wise sparse attention он заметно улучшает результаты на RULER, а при объединении визуальных токенов в MLLM не уступает MLP-мержеру, используя на 55.6% меньше токенов.'}, 'en': {'title': 'Revolutionizing Sequence Compression with Test-Time Regression', 'desc': 'This paper introduces a new method called test-time regression (TTR) for compressing sequences in language and multimodal models. Unlike traditional methods that rely on pooling or learned projections, TTR uses regression to create a compressed representation of input tokens. The coefficients for this regression are learned through backpropagation and computed efficiently during the forward pass. The results show that TTR significantly enhances performance in tasks like block-wise sparse attention and visual token merging, proving it to be a powerful alternative for sequence compression.'}, 'zh': {'title': '测试时回归：高效序列压缩的新方法', 'desc': '本文提出了一种新的序列压缩方法，称为测试时回归（TTR-Compressor），用于提高语言和多模态模型的效率。传统的池化和学习投影方法在性能上存在不足，而TTR-Compressor通过回归问题来定义输入标记，从而形成压缩表示。该方法通过反向传播进行端到端学习，并在前向传播中高效计算系数。实验结果表明，TTR-Compressor在稀疏注意力和视觉标记合并任务中均显著优于传统方法。'}}}, {'id': 'https://huggingface.co/papers/2610.31494', 'title': 'AgentVQA: A Unified Benchmark for Agentic Visual Understanding', 'url': 'https://huggingface.co/papers/2610.31494', 'abstract': 'Abstract AgentVQA is an offline benchmark assessing vision-language models on realistic agentic tasks across web, robotics, video, games, and spatial planning, revealing that visual grounding and state tracking errors are the primary failure modes.  Generated by thinkingmachines/Inkling-Small Vision-language models (VLMs) can perform a broad range of tasks across diverse settings, yet their performance in agentic contexts remains poorly understood. Although online evaluations in simulators and real-world environments are essential for measuring interactive agent performance, they are costly and challenging to scale. Complementary offline VQA benchmarks can enable faster and more reliable comparisons across agentic domains, yet existing benchmarks remain limited and fragmented. To address this gap, we introduce AgentVQA, an offline benchmark for evaluating VLMs on realistic agentic scenarios across five agent domains: Web Agents, Robotics, Egocentric Videos, Games, and Spatial Planning. We build AgentVQA by manually selecting 1000 challenging, real-world agent examples from 23 source datasets and adapting them for reliable offline evaluation. The resulting benchmark preserves realistic scenarios from interactive environments across diverse domains, and its model rankings track those from corresponding online evaluations. Across the 22 evaluated models, the best achieves only 58.5% accuracy. Our cross-domain analysis shows that errors are driven primarily by failures to ground and maintain accurate representations of the current and evolving visual state, including localizing relevant UI elements, interpreting motion, tracking state changes over time, and inferring 3D spatial relationships, rather than by task misinterpretation or downstream logical reasoning.', 'score': 11, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '8950203e93bfc35f', 'authors': ['Advait Gupta', 'Sachin Konan', 'Tom Yin', 'Gabriel Sarch', 'Zhuang Liu'], 'affiliations': ['Princeton University', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2610.31494.jpg', 'data': {'categories': ['#multimodal', '#robotics', '#interpretability', '#3d', '#cv', '#dataset', '#agents', '#benchmark', '#games', '#video'], 'emoji': '🤖', 'ru': {'title': 'VLM-агентам не хватает зрения: ошибки в понимании состояния сцены, а не в логике', 'desc': 'В статье представлен AgentVQA — оффлайн-бенчмарк для оценки vision-language моделей (VLM) на реалистичных агентных задачах в пяти доменах: веб-агенты, робототехника, egocentric-видео, игры и пространственное планирование. Авторы вручную отобрали 1000 сложных примеров из 23 датасетов, адаптировав их для надёжной оффлайн-оценки, при этом рейтинги моделей совпадают с онлайн-оценками в симуляторах. Лучшая из 22 протестированных моделей достигает лишь 58.5% точности. Анализ ошибок показывает, что главные причины — неспособность к visual grounding и отслеживанию состояния визуальной сцены, а не неверное понимание задачи или логические рассуждения.'}, 'en': {'title': 'AgentVQA: Benchmarking Vision-Language Models for Realistic Agent Tasks', 'desc': 'AgentVQA is a new offline benchmark designed to evaluate vision-language models (VLMs) on realistic tasks that require agent-like behavior across various domains such as robotics and gaming. The benchmark highlights that the main issues with VLMs are related to visual grounding and state tracking, which are crucial for understanding and interacting with dynamic environments. By using a curated set of 1000 challenging examples from multiple datasets, AgentVQA allows for consistent and reliable assessments of model performance without the high costs of online evaluations. The findings indicate that improving visual state representation is essential for enhancing the effectiveness of VLMs in agentic tasks.'}, 'zh': {'title': 'AgentVQA：评估视觉语言模型的新基准', 'desc': 'AgentVQA是一个离线基准，用于评估视觉语言模型在现实代理任务中的表现，包括网络、机器人、视频、游戏和空间规划等领域。研究发现，视觉定位和状态跟踪错误是主要的失败模式。虽然在线评估在模拟器和现实环境中对交互代理性能的测量至关重要，但其成本高且难以扩展。AgentVQA通过从23个数据集中手动选择1000个具有挑战性的真实代理示例，提供了一个可靠的离线评估基准，能够更快、更可靠地比较不同代理领域的模型表现。'}}}, {'id': 'https://huggingface.co/papers/2610.31466', 'title': 'AnyGameRenderer: Entity-Consistent Generative Rendering Across Games and an Entity-Level Benchmark', 'url': 'https://huggingface.co/papers/2610.31466', 'abstract': "Abstract AnyGameRenderer is a video-to-video generative model that transforms low-quality agent-built game footage into high-fidelity visuals while preserving layout, camera, and entity timing.  Generated by thinkingmachines/Inkling-Small AI coding agents can now build small playable games in minutes, but the results usually look like programmer art: gray blockouts, colored geometric primitives, and flat semantic blobs. We present AnyGameRenderer, a video-to-video generative renderer that turns such footage into high-quality visuals with characters, motion detail, and effects. Throughout, it keeps the layout, camera, and every entity's position and timing intact.   Our AnyGameRenderer generalizes across a wide range of genres that agents build, such as tower defense, auto-battlers, top-down survivors, turn-based battles, kart racing, and crowd runners.   AnyGameRenderer takes plain video as its game-state input, with no complex representations such as engine G-buffers, per-object class labels, or low-poly proxies. Gray blockouts, colored primitives, semantic maps, and wireframes all work as input.   It also preserves entity correspondence: group counts stay correct, and entities appear and disappear on the right frame.   We implement AnyGameRenderer by LoRA fine-tuning MiniMax-H3 ref2va, a 33B reference-video-conditioned video generation model. Training uses sim10k paired clips from three sources: (i) multi-stream rendering data from 38 agent-made games exported from GEAR, an AI game-creation tool; (ii) two-stream rendering data from Unreal Engine, with programmatically controlled crowds, count changes, and entity scales; and (iii) real gameplay recordings, with pairs reconstructed via 3D-box detection.   To evaluate the entity correspondence, we propose an entity-level benchmark of 59 held-out cases with 753 entities, scored against ground-truth boxes. Compared with the base model, AnyGameRenderer better preserves entity correspondence: temporal match rises from 50.9\\% to 62.9\\%, missed count changes fall from 34.7\\% to 21.3\\%, and fewer entities are hallucinated or left unrendered.", 'score': 10, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '05a3378efe38b5a7', 'authors': ['Ruicong Liu', 'Liangyang Ouyang', 'Fengbo Lan', 'Zhixiang Wang', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab', 'GEAR', 'MiniMax'], 'pdf_title_img': 'assets/pdf/title_img/2610.31466.jpg', 'data': {'categories': ['#hallucinations', '#multimodal', '#synthetic', '#dataset', '#diffusion', '#training', '#benchmark', '#games', '#video'], 'emoji': '🎮', 'ru': {'title': 'Из серых кубиков — в красивую игру, не теряя ни одного персонажа', 'desc': 'Статья представляет AnyGameRenderer — генеративную модель video-to-video, которая превращает простые видео игр, созданных AI-агентами, в визуально качественные ролики. Модель сохраняет раскладку, камеру и позиции с таймингом всех сущностей, принимая на вход даже серые блокауты или wireframe. Она дообучена через LoRA на базе 33B-модели MiniMax-H3 ref2va на парных данных из игр, Unreal Engine и реальных записей геймплея. Оценка по собственному entity-level benchmark показывает рост temporal match с 50.9% до 62.9% и снижение пропущенных изменений количества сущностей.'}, 'en': {'title': 'Transforming Game Footage into High-Fidelity Visuals', 'desc': 'AnyGameRenderer is a generative model that enhances low-quality game footage into high-quality visuals while maintaining the original layout and timing of game elements. It allows AI coding agents to create playable games quickly, transforming basic graphics into detailed animations and effects. The model works with simple video inputs, avoiding complex representations, and ensures that the number and timing of game entities are accurately represented. By fine-tuning a large video generation model, AnyGameRenderer significantly improves entity correspondence and visual fidelity across various game genres.'}, 'zh': {'title': 'AnyGameRenderer：将低质量游戏视频转化为高保真视觉效果', 'desc': 'AnyGameRenderer是一种视频到视频的生成模型，可以将低质量的游戏视频转换为高保真的视觉效果，同时保持布局、相机和实体的时间同步。该模型能够处理多种游戏类型，包括塔防、自动战斗和赛车等，输入可以是简单的视频，而不需要复杂的表示。通过对MiniMax-H3模型进行LoRA微调，AnyGameRenderer在训练中使用了来自多个来源的配对视频片段。与基础模型相比，AnyGameRenderer在保持实体对应性方面表现更好，时间匹配率和实体计数的准确性都有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2610.20459', 'title': 'MolLean: A Process-Verifiable Language for Chemical Reasoning', 'url': 'https://huggingface.co/papers/2610.20459', 'abstract': 'Abstract MolLean introduces a verifiable chemical reasoning framework with explicit molecular states, Lean-based verification, and interactive tool feedback to reduce hallucinations across generation and reaction tasks.  Generated by thinkingmachines/Inkling-Small Chemical chain-of-thought can contain hallucinated structural and property claims. We thereby introduce MolLean, a process-verifiable language that grounds chemical reasoning in an explicit molecular state. A layered Lean-based kernel checks state transitions and assertions over molecular readouts, from primitive graph edits to compound transformations. Meanwhile, a typed witness protocol separates native structural checks from externally supplied measurements. We further introduce MolLean-MCP, a stateful tool interface that exposes these transitions, checks, and readouts during generation: the model receives feedback to decide its next action, and rejected actions leave the state unchanged. MolLean supports one-pass trace execution, whole-trace refinement, and interactive reasoning through MolLean-MCP. We evaluate these three modes with direct chain-of-thought on 8,800 matched examples across 12 tasks spanning molecular generation, editing, optimization, and reactions. With Qwen3.6-27B, whole-trace refinement outperforms direct chain-of-thought on all 12 tasks. MolLean-MCP complements whole-trace refinement with stepwise verification feedback, reaching better performance in reaction tasks. Together, these results highlight an executable foundation for chemical reasoning, in which explicit chemical commitments can be checked and revised rather than remaining solely in free-form explanations.', 'score': 8, 'issue_id': 3453, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': '346f04e002d0ee9d', 'authors': ['Jiatong Li', 'Yatao Bian'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.20459.jpg', 'data': {'categories': ['#hallucinations', '#reasoning', '#agents', '#benchmark', '#science', '#plp'], 'emoji': '🧪', 'ru': {'title': 'Химические рассуждения, которые можно проверить и исправить', 'desc': 'Статья представляет MolLean — фреймворк для верифицируемых химических рассуждений, в котором явное молекулярное состояние проверяется ядром на основе Lean. Языковая модель (LLM) получает обратную связь через интерфейс MolLean-MCP и может пошагово исправлять свои действия, а отклонённые шаги не меняют состояние. Эксперименты на 8800 примерах и 12 задачах с моделью Qwen3.6-27B показали, что уточнение всей цепочки рассуждений (whole-trace refinement) превосходит прямой chain-of-thought, а MCP-режим дополнительно улучшает результаты в реакционных задачах. Подход уменьшает галлюцинации в химических утверждениях и делает рассуждения проверяемыми, а не только описательными.'}, 'en': {'title': 'MolLean: Verifiable Chemical Reasoning for Accurate Molecular Insights', 'desc': 'MolLean is a new framework designed to improve chemical reasoning by using explicit molecular states and verification methods. It employs a Lean-based kernel to ensure that state transitions and assertions about molecular properties are accurate, reducing the chances of generating incorrect information, known as hallucinations. The framework includes a tool called MolLean-MCP that provides interactive feedback during the generation process, allowing the model to refine its actions based on verification results. Evaluations show that MolLean significantly enhances performance in various chemical tasks by enabling precise checks and revisions of molecular claims.'}, 'zh': {'title': 'MolLean：可验证的化学推理框架', 'desc': 'MolLean 是一个可验证的化学推理框架，旨在减少生成和反应任务中的幻觉现象。它通过明确的分子状态和基于 Lean 的验证来实现这一目标，并提供交互式工具反馈。MolLean 采用分层的 Lean 核心，检查分子状态的转变和属性声明，确保推理过程的准确性。通过 MolLean-MCP 接口，模型可以在生成过程中获得反馈，从而优化其决策，提升在化学生成、编辑和反应任务中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.31668', 'title': 'Reading, Writing, Sharing, and Interacting with the World through Video', 'url': 'https://huggingface.co/papers/2610.31668', 'abstract': 'Abstract This survey unifies video understanding and generation through world modeling, organizing progress around inferring, synthesizing, sharing, and interacting with latent temporal states to emphasize persistent dynamics over clip-level perception.  Generated by thinkingmachines/Inkling-Small Video foundation models have advanced rapidly in understanding and generating visual sequences, while video world models seek to capture the underlying dynamics of the world they depict. Despite their different objectives, both concern the relationship between video observations and an evolving world. This survey adopts world modeling as a unifying lens for examining these developments. Viewing an observed video as a partial, lossy, and temporally ordered projection of a latent temporal world, we organize the literature around four complementary operations: reading infers world properties from observed video; writing synthesizes video from specified or learned world conditions; sharing integrates understanding and generation through common modeling mechanisms; and interacting predicts and updates world states under actions and evolving observations. This perspective distinguishes temporal coherence in observed or generated sequences from consistency in the underlying world state. Across tasks, representations, models, datasets, and benchmarks, we trace a shift in emphasis from clip-level recognition and perceptual fidelity toward persistent state, controllable evolution, physical and causal validity, and evaluation grounded in interaction and downstream decisions, and we distill the open challenges that follow.', 'score': 8, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '3c8f242f6863c60b', 'authors': ['Shengqiong Wu', 'Meng Luo', 'Bobo Li', 'Ziwei Liu', 'Shuicheng Yan', 'Ming-Hsuan Yang', 'Philip Torr', 'Hao Fei'], 'affiliations': ['NTU', 'NUS', 'University of California, Merced', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.31668.jpg', 'data': {'categories': ['#survey', '#dataset', '#benchmark', '#rl', '#video'], 'emoji': '🌍', 'ru': {'title': 'Видео — это проекция мира: от распознавания кадров к моделированию его динамики', 'desc': 'Обзор объединяет понимание и генерацию видео через призму world modeling, то есть моделирования латентного временного мира, который лежит за наблюдаемыми кадрами. Авторы выделяют четыре операции: чтение (inference свойств мира из видео), запись (синтез видео по условиям мира), совместное использование общих механизмов и взаимодействие, при котором предсказываются и обновляются состояния мира под действиями. Главный сдвиг фокуса — от распознавания отдельных клипов и перцептивного качества к устойчивому состоянию, управляемой эволюции, физической и каUsальной корректности. В работе также разбираются датасеты, бенчмарки и открытые проблемы, включая оценку через взаимодействие и последующие решения.'}, 'en': {'title': 'Unifying Video Understanding and Generation through World Modeling', 'desc': 'This paper surveys the integration of video understanding and generation through the concept of world modeling. It highlights how video foundation models and video world models both aim to understand the dynamics of the world depicted in videos, despite having different goals. The authors categorize the literature into four key operations: reading, writing, sharing, and interacting, which focus on inferring world properties, synthesizing video, integrating understanding, and predicting world states. The paper emphasizes a shift from merely recognizing clips to understanding persistent states and their evolution, while also identifying ongoing challenges in the field.'}, 'zh': {'title': '视频理解与生成的统一视角', 'desc': '这篇论文调查了视频理解和生成的统一，通过世界建模来组织进展。它强调了持久动态而非片段级感知，关注视频观察与不断变化的世界之间的关系。论文将文献分为四个互补操作：读取、写入、共享和交互，以探讨如何从观察到的视频推断世界属性、合成视频、整合理解与生成，以及在行动和观察变化下预测和更新世界状态。最后，论文总结了从片段级识别向持久状态和可控演变的转变，以及在交互和下游决策中评估的开放挑战。'}}}, {'id': 'https://huggingface.co/papers/2610.31372', 'title': 'RIDAR: Safeguarding Research Integrity in Autonomous Research Agents via Automated Detection and Runtime Intervention', 'url': 'https://huggingface.co/papers/2610.31372', 'abstract': 'Abstract RIDAR detects and mitigates research integrity violations in autonomous agents via taxonomy-based post-hoc analysis and real-time intervention.  Generated by thinkingmachines/Inkling-Small Autonomous research agents are increasingly used to automate large portions of scientific research, yet they are prone to research integrity violations (RIVs): behaviors that compromise the validity, reproducibility, or faithfulness of the research process. We present RIDAR, a framework for automated RIV detection and runtime intervention. First, we introduce RIVT, a comprehensive taxonomy of 14 RIV types spanning the full research lifecycle. Building on RIVT, we present RIDAR-post-hoc, a framework to detect RIVs within agent trajectories. RIDAR-post-hoc achieves 85.2% F1 performance on RIV-Gold, a benchmark for RIV detection with 60 expert-annotated trajectories. Applying RIDAR-post-hoc to RIV-Wild, a dataset of 300 agent trajectories across 50 distinct research tasks, we detect 3,964 RIV instances in 99.7% of trajectories, revealing the prevalence of RIVs in current agents. Finally, we present RIDAR-runtime, a framework for dynamically detecting and correcting RIVs during agent runtime. RIDAR-runtime effectively reduces agent RIVs remaining at task completion by 36.8%. We will release our code and data to facilitate future research.', 'score': 7, 'issue_id': 3455, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'a07d1ef7c852f1db', 'authors': ['Jiening Siow', 'Amy Xin', 'Junjie Wang', 'Ziyu Tang', 'Zijun Yao', 'Yunjia Qi', 'Fanjin Zhang', 'Lei Hou', 'Jie Tang', 'Juanzi Li'], 'affiliations': ['Renmin University of China', 'Tsinghua University', 'Zhipu AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.31372.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark', '#survey', '#alignment', '#data'], 'emoji': '🔬', 'ru': {'title': 'Честная наука для автономных AI-агентов: находим и исправляем нарушения в реальном времени', 'desc': 'В статье представлен фреймворк RIDAR для обнаружения и устранения нарушений научной добросовестности (RIV) у автономных LLM-агентов, которые проводят исследования. Авторы вводят таксономию RIVT из 14 типов нарушений, охватывающую весь жизненный цикл исследования, и метод post-hoc анализа траекторий агента с F1 85.2% на бенчмарке RIV-Gold. Применение метода к 300 траекториям показало, что нарушения встречаются почти во всех запусках (99.7%). Модуль RIDAR-runtime в реальном времени обнаруживает и исправляет нарушения, снижая их число в итоговых результатах на 36.8%.'}, 'en': {'title': 'Ensuring Research Integrity in Autonomous Agents with RIDAR', 'desc': 'RIDAR is a framework designed to identify and address research integrity violations (RIVs) in autonomous agents used for scientific research. It introduces a taxonomy called RIVT, which categorizes 14 types of RIVs that can occur throughout the research process. The RIDAR-post-hoc component analyzes agent behavior after the fact, achieving a high F1 score in detecting RIVs in expert-annotated data. Additionally, RIDAR-runtime allows for real-time detection and correction of RIVs, significantly improving the integrity of research outcomes by reducing violations during task execution.'}, 'zh': {'title': 'RIDAR：提升自主研究代理的诚信性', 'desc': 'RIDAR是一个用于检测和缓解自主代理研究诚信违规行为的框架。它通过建立一个包含14种违规类型的分类法RIVT，来分析研究过程中的违规行为。RIDAR-post-hoc能够在代理的研究轨迹中检测到违规行为，并在RIV-Gold基准上实现了85.2%的F1性能。RIDAR-runtime则可以在代理运行时动态检测和纠正违规行为，减少了任务完成时剩余的违规行为达36.8%。'}}}, {'id': 'https://huggingface.co/papers/2610.30882', 'title': 'Inherited, Not Invented: Tracing the Provenance of Wait in Reasoning Models', 'url': 'https://huggingface.co/papers/2610.30882', 'abstract': "Abstract Reinforcement learning improves reasoning accuracy without requiring a specific wait marker, which originates from training data rather than RL, and automated evaluation metrics can misrepresent reasoning trends.  Generated by thinkingmachines/Inkling-Small Reinforcement learning (RL) is credited with teaching reasoning models to write {wait} before reconsidering a step, yet large RL accuracy gains do not require the word. This view can confuse what RL discovers with what a model inherits from its training data. We trace the word through open models' training histories, reading it with label-free indices of frequency, position, form and usage and an injected-error test, all computed from sampled outputs. We find that zero-RL almost never coins the marker: on bases that lack the word, RL raises MATH-500 accuracy substantially while {wait} stays near absent. It arrives with training data: mid-training in OLMo-3, and fine-tuning on reasoning traces installs it in most models whose base lacks it. Where the base already uses it, both released RL-Zero recipes (OLMo-3, MiMo) multiply it, whereas KL-free GRPO from the same base does not; OLMo-3's recipe wears down its form and makes it a more sensitive but more liberal alarm; RL after supervised fine-tuning barely changes it, and our GRPO recipe erases a marker seeded by fine-tuning. Finally, we show that marker frequency alone does not indicate RL-induced reasoning and caution against LLM-as-a-judge revision metrics, as automated judges can reverse human-labelled trends.", 'score': 7, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '1a7fd2455cae37ad', 'authors': ['Zhizhuo Kou', 'Sizai Hou', 'Long Chen', 'Jian Yang', 'Junyu Luo', 'Jingshu Peng', 'Wenkai Zhang', 'Sirui Han', 'Yike Guo'], 'affiliations': ["Huawei Noah's Ark Lab", 'Peking University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.30882.jpg', 'data': {'categories': ['#optimization', '#training', '#reasoning', '#alignment', '#benchmark', '#data', '#interpretability'], 'emoji': '🔍', 'ru': {'title': 'RL учит рассуждать, а слово «wait» приходит из данных', 'desc': 'В статье показано, что слово «wait», которое часто связывают с обучением рассуждениям через RL, на самом деле почти не возникает в zero-RL, а приходит из обучающих данных (mid-training и fine-tuning на reasoning traces). Авторы анализируют частоту, позицию, форму и контекст маркера в выходах сэмплированных моделей, а также проверяют его через тест с внедрёнными ошибками. Показано, что RL повышает точность на MATH-500 даже без этого слова, а рецепты обучения по-разному усиливают или стирают маркер. Наконец, авторы предостерегают, что частота маркера не доказывает наличие рассуждений, а LLM-as-a-judge метрики могут искажать выводы.'}, 'en': {'title': 'Reinforcement Learning: Enhancing Reasoning Beyond Markers', 'desc': "This paper explores how reinforcement learning (RL) can enhance reasoning accuracy in models without relying on specific markers like 'wait'. It highlights that significant improvements in accuracy can occur even when these markers are absent from the training data. The authors analyze the training histories of various models to understand the relationship between RL and the emergence of these markers. They caution against using automated evaluation metrics, as they may misrepresent the reasoning capabilities of models by not accurately reflecting the influence of RL."}, 'zh': {'title': '强化学习提升推理准确性，无需特定标记', 'desc': '强化学习（RL）可以提高推理模型的准确性，而不需要特定的等待标记。研究表明，RL的准确性提升并不依赖于训练数据中的某个特定词汇。我们通过分析开放模型的训练历史，发现零强化学习几乎从未使用该标记。最终，我们警告说，仅仅依赖标记频率并不能准确反映RL引发的推理变化。'}}}, {'id': 'https://huggingface.co/papers/2610.31198', 'title': 'Different Tasks, Different Timesteps: Temporal Task-Aware Quantization for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.31198', 'abstract': 'Abstract T2Quant improves diffusion language model quantization by dynamically allocating activation precision across denoising steps based on predicted task- and time-dependent sensitivity.  Generated by thinkingmachines/Inkling-Small Diffusion Language Models (DLMs) introduce unique quantization challenges due to their iterative denoising process. In this work, we reveal that quantization sensitivity is both taskand time-dependent, with different downstream tasks exhibiting distinct precision requirements across denoising steps. We further show that these patterns can be predicted without groundtruth labels or task-specific evaluation metrics. Building on these findings, we introduce T 2Quant, a task and time-aware mixedprecision quantization framework that uses a label-free sensitivity signal to optimally allocate activation precision across denoising steps under a fixed bit-width budget. Extensive experiments across three DLMs and six benchmarks demonstrate that T 2Quant consistently improves the average accuracy of existing quantization methods, achieving gains of up to 6.7 percentage points under the same budget.', 'score': 6, 'issue_id': 3457, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '5fb7d8087456b4b8', 'authors': ['Ofek Avivi', 'Eliron Rahimi', 'Avi Mendelson', 'Chaim Baskin'], 'affiliations': ['INSIGHT Lab, Ben-Gurion University of the Negev', 'Technion Israel Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.31198.jpg', 'data': {'categories': ['#optimization', '#training', '#diffusion', '#inference', '#benchmark'], 'emoji': '🧮', 'ru': {'title': 'Точность там, где она нужна: умное распределение бит по шагам диффузии', 'desc': 'Авторы исследуют квантизацию диффузионных языковых моделей (DLM), где чувствительность к снижению точности зависит и от решаемой задачи, и от шага итеративного денойзинга. Показано, что эти закономерности можно предсказывать без размеченных данных и специфичных метрик оценки. На основе этого предложен фреймворк T²Quant, который распределяет битность активаций по шагам денойзинга с помощью label-free сигнала чувствительности при фиксированном бюджете бит. Эксперименты на трёх DLM и шести бенчмарках показывают прирост средней точности до 6.7 процентных пунктов относительно существующих методов.'}, 'en': {'title': 'Dynamic Precision for Enhanced Language Model Quantization', 'desc': 'T2Quant is a new framework designed to enhance the quantization of diffusion language models by adjusting the precision of activations based on their sensitivity to specific tasks and time during the denoising process. It recognizes that different tasks require varying levels of precision at different stages of denoising, which can be predicted without needing ground truth labels. By implementing a mixed-precision approach, T2Quant optimally allocates resources within a fixed bit-width budget, leading to improved performance. Experiments show that T2Quant outperforms existing quantization methods, achieving significant accuracy improvements across multiple benchmarks.'}, 'zh': {'title': '动态精度分配，提升量化效果', 'desc': 'T2Quant是一种改进扩散语言模型量化的方法，它通过根据预测的任务和时间相关的敏感性动态分配激活精度。扩散语言模型在去噪过程中面临独特的量化挑战，因为其迭代特性使得不同的下游任务在去噪步骤中对精度的需求各不相同。研究表明，量化敏感性与任务和时间相关，可以在没有真实标签或特定评估指标的情况下进行预测。基于这些发现，T2Quant框架能够在固定的比特宽度预算下，最优分配激活精度，从而显著提高现有量化方法的平均准确率。'}}}, {'id': 'https://huggingface.co/papers/2610.31062', 'title': 'SCOPE: Compiling Natural-Language Policies into Neurosymbolic Predicate Programs', 'url': 'https://huggingface.co/papers/2610.31062', 'abstract': 'Abstract SCOPE compiles compound policies into optimized neural-symbolic programs that achieve high accuracy, stability, and interpretability on inexpensive models.  Generated by thinkingmachines/Inkling-Small Policy enforcement for LLM agents has shifted from single-turn content moderation to compound, application-specific policies evaluated over multi-turn transcripts and tool-call trajectories. Fine-tuned guardrail models are efficient but degrade on compound policies, and while LLM-as-a-judge approaches achieve higher accuracy, they incur high inference cost and tend to produce unstable predictions. Neurosymbolic methods offer a natural alternative, decomposing the policy into narrow neural decisions composed under explicit logic. However, existing symbolic layers lack the required expressiveness and are optimized against fixed data rather than the policy itself. To address this, we introduce SCOPE, which compiles a policy into an executable program of neural predicates executed by small models, deterministic extractors, and code that composes their outputs. The program is optimized jointly with its training data, using adversarial generation of counterexamples that target where the program deviates from the policy. We evaluate SCOPE on a benchmark of real-world policy tasks against prompt optimization, task decomposition, and workflow generation methods, achieving the highest average accuracy across tasks and models. Programs optimized with the weakest executor transfer to other models without further optimization. This allows them to be deployed in production on inexpensive models, where they reach accuracy comparable to frontier reasoning models. Unlike these monolithic models, SCOPE produces substantially more stable predictions, and each verdict is interpretable through the predicate outputs that produced it. Additionally, we validate the key components of our method through an ablation study. SCOPE thus enables reliable, interpretable, and efficient policy enforcement at production scale.', 'score': 6, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '76d963e08ab23b58', 'authors': ['Arnon Mazza', 'Elad Levi'], 'affiliations': ['Plurai'], 'pdf_title_img': 'assets/pdf/title_img/2610.31062.jpg', 'data': {'categories': ['#optimization', '#inference', '#architecture', '#agents', '#benchmark', '#alignment', '#security', '#data', '#interpretability'], 'emoji': '🛡️', 'ru': {'title': 'Компилируем политики безопасности LLM-агентов в надёжные и понятные программы', 'desc': 'В статье представлен SCOPE — метод, который компилирует составную политику безопасности в исполняемую нейросимволическую программу из нейронных предикатов, детерминированных экстракторов и кода, объединяющего их выходы. Программа оптимизируется совместно с обучающими данными, а для поиска слабых мест используется состязательная генерация контрпримеров, где программа расходится с политикой. На реальных задачах SCOPE показывает наивысшую среднюю точность среди методов оптимизации промптов, декомпозиции задач и генерации воркфлоу. Благодаря высокой стабильности предсказаний и интерпретируемости вердиктов такие программы можно эффективно разворачивать на дешёвых моделях в продакшене.'}, 'en': {'title': 'Optimizing Policies with Neural-Symbolic Programs for Better Accuracy and Interpretability', 'desc': 'The paper introduces SCOPE, a method that transforms complex policies into optimized neural-symbolic programs for better performance in machine learning tasks. It addresses the limitations of existing models by combining neural networks with explicit logic, allowing for more accurate and stable predictions. SCOPE is designed to work efficiently with smaller models, making it cost-effective while maintaining high accuracy comparable to larger models. The approach also enhances interpretability, as each decision can be traced back to the specific logic used in the program.'}, 'zh': {'title': 'SCOPE：高效、可解释的复合策略执行', 'desc': 'SCOPE 是一种将复合策略编译成优化的神经符号程序的方法，能够在低成本模型上实现高准确性、稳定性和可解释性。该方法通过将策略分解为明确逻辑下的狭窄神经决策，克服了现有符号层的表达能力不足的问题。SCOPE 通过对抗生成反例来优化程序，使其与训练数据共同优化，从而在真实世界的政策任务基准测试中表现出色。与传统的单一模型相比，SCOPE 提供了更稳定的预测结果，并且每个判决都可以通过生成的谓词输出进行解释。'}}}, {'id': 'https://huggingface.co/papers/2610.31576', 'title': 'What Makes a Good Unmasking Policy? A Controlled Study of Learned Unmasking in Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.31576', 'abstract': 'Abstract Optimized unmasking policies for masked diffusion language models improve efficiency by using trajectory-contraction targets with confidence and hidden states, achieving better speed-accuracy trade-offs with minimal overhead.  Generated by thinkingmachines/Inkling-Small Masked diffusion language models generate tokens in parallel, but their efficiency depends on which predictions are committed. Learned unmasking policies improve the speed--accuracy trade-off, yet differ in supervision, inputs, and capacity, obscuring which choices matter. We view supervised policies as distilling a decoding procedure through a teacher and examine independently what the teacher labels as committable, on which states the policy imitates it, what the policy observes, and how much the number of function evaluations (NFE) must decrease to offset policy overhead. We find that labeling predictions matching the final output is overly permissive at low NFE, and hidden states are weak alone but can complement confidence. About a 10% NFE reduction suffices to offset policy overhead for policies up to 7.5M parameters across tested settings. We therefore train a policy on trajectory-contraction targets, which accept only commitments staying on a reference trajectory, using confidence and hidden states. On LLaDA-8B-Instruct, the resulting 856K-parameter policy achieves the best accuracy--NFE frontier and highest throughput on GSM8K, is competitive at moderate targets on MATH-500 and HumanEval, and largely transfers to Dream-7B-Instruct.', 'score': 5, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'c0459497e02c6a39', 'authors': ['Jinya Sakurai', 'Xun Xu', 'Jaehong Yoon'], 'affiliations': ['Centre for Frontier AI Research (CFAR), A*STAR', 'Institute for Advanced Intelligence and Computing (IAIC), A*STAR', 'NTU Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.31576.jpg', 'data': {'categories': ['#optimization', '#small_models', '#diffusion', '#inference', '#training'], 'emoji': '⚡', 'ru': {'title': 'Фиксировать только то, что остаётся на траектории: быстрее декодирование без потери точности', 'desc': 'Статья посвящена оптимизации порядка декодирования в masked diffusion языковых моделях, где токены генерируются параллельно, а эффективность зависит от того, какие предсказания фиксируются на каждом шаге. Авторы рассматривают обученную политику разметки (unmasking policy) как дистилляцию процедуры декодирования учителя и разделяют её компоненты: правила разметки, состояния, которые она имитирует, входные признаки и ёмкость модели. Выяснилось, что простое совпадение предсказаний с финальным ответом слишком мягко при малом числе вычислений, а скрытые состояния слабы сами по себе, но дополняют уверенность модели. Предложенная политика с 856K параметров, обученная на целях trajectory-contraction с признаками confidence и hidden states, даёт лучший баланс точности и NFE на GSM8K и переносится на Dream-7B-Instruct.'}, 'en': {'title': 'Optimizing Efficiency in Masked Diffusion Models', 'desc': 'This paper discusses improvements in masked diffusion language models by optimizing unmasking policies. These policies enhance efficiency by using trajectory-contraction targets, which help balance speed and accuracy with minimal additional costs. The authors analyze how different supervision methods and inputs affect the performance of these policies, particularly focusing on the importance of confidence and hidden states. Their findings indicate that a well-trained policy can significantly reduce function evaluations while maintaining high accuracy, leading to better overall performance in various tasks.'}, 'zh': {'title': '优化去掩蔽策略提升语言模型效率', 'desc': '这篇论文探讨了优化的去掩蔽策略在掩蔽扩散语言模型中的应用，旨在提高效率。通过使用轨迹收缩目标和置信度，研究者们实现了更好的速度与准确性之间的平衡。论文指出，学习的去掩蔽策略在监督、输入和容量上存在差异，这使得选择的重要性变得模糊。最终，研究表明，通过训练一个基于轨迹收缩目标的策略，可以显著减少功能评估次数，从而提高模型的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2610.31623', 'title': 'F2G-Pose: Geometry-Aware Foundation Feature Lifting for Direct RGB-D Category-Level Object Pose Estimation', 'url': 'https://huggingface.co/papers/2610.31623', 'abstract': "Abstract F2G-Pose is a real-time feed-forward framework that predicts category-level object pose, metric size, and completed shape from a single RGB-D image using dense visual features, DGCNN tokenization, and a Mixture-of-Experts Transformer.  Generated by thinkingmachines/Inkling-Small This paper studies category-level RGB-D object pose estimation, which recovers an object's 3D rotation and translation without instance-specific CAD models or reference views. This task is highly ambiguous due to intra-class variations, symmetries, and partial observations. Current solutions struggle to balance reliability and efficiency: methods based on intermediate structures are prone to error propagation, while diffusion models suffer from high inference latency and complex post-hoc candidate extraction. To address this, we present F2G-Pose, a real-time direct, single-pass framework that predicts category-level pose, metric size, and camera-frame completed shape from a single RGB-D observation in one feed-forward pass. F2G-Pose lifts dense visual foundation features to partial point clouds, encodes local geometry with DGCNN tokenization, and integrates object-level structure with a Mixture-of-Experts Transformer. Joint size prediction and camera-frame shape completion encourage metric consistency through dense geometric supervision. With its task-specific network trained only on pose-annotated synthetic SOPE data and its frozen RADIO backbone externally pretrained, F2G-Pose achieves state-of-the-art accuracy on SOPE and ROPE while running at 28 FPS for pose-only inference, and further demonstrates strong camera-frame geometry on HouseCat6D and real-object transfer on HANDAL. Analyses of latency, robustness, shape completion, and GenPose++ candidate behavior further demonstrate the efficiency and reliability of F2G-Pose, with real-world manipulation experiments demonstrating deployment potential under segmented RGB-D inputs. The project page, code, and pretrained models are made available at https://jrryzh.github.io/F2G-Pose/.", 'score': 5, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '11db6a8cc4981b13', 'authors': ['Jinyu Zhang', 'Haitao Lin', 'Jiashu Hou', 'Xiangyang Xue', 'Yanwei Fu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.31623.jpg', 'data': {'categories': ['#robotics', '#3d', '#cv', '#architecture', '#training'], 'emoji': '🧭', 'ru': {'title': 'Поза объекта за один проход: быстро, точно и в реальном времени', 'desc': 'В статье представлен F2G-Pose — быстрый однопроходный фреймворк для оценки позы объекта на уровне категории по одному RGB-D изображению. Модель предсказывает 3D-вращение и трансляцию, метрический размер и полную форму объекта в системе координат камеры без использования CAD-моделей. Для этого признаки из замороженного RADIO backbone переносятся на частичные облака точек, локальная геометрия кодируется через DGCNN tokenization, а глобальный контекст объекта обрабатывается Mixture-of-Experts Transformer. Метод достигает state-of-the-art точности на SOPE и ROPE при скорости около 28 FPS.'}, 'en': {'title': 'Real-Time Object Pose Estimation with F2G-Pose', 'desc': "F2G-Pose is a novel framework designed for real-time category-level object pose estimation from a single RGB-D image. It utilizes dense visual features and a Mixture-of-Experts Transformer to predict an object's 3D pose, size, and shape without needing specific CAD models. The framework addresses challenges like intra-class variations and partial observations, achieving high accuracy while maintaining efficiency at 28 frames per second. By leveraging a task-specific network trained on synthetic data, F2G-Pose demonstrates strong performance in both simulated and real-world scenarios."}, 'zh': {'title': '实时物体姿态估计的新突破', 'desc': 'F2G-Pose 是一个实时的前馈框架，能够从单个 RGB-D 图像中预测类别级别的物体姿态、度量大小和完整形状。该方法利用密集视觉特征、DGCNN 令牌化和专家混合变换器，解决了物体姿态估计中的模糊性问题。与现有方法相比，F2G-Pose 在保持高效性的同时，显著提高了可靠性，避免了错误传播和高延迟的问题。通过在合成数据上训练的任务特定网络，F2G-Pose 在多个基准测试中达到了最先进的准确性，并展示了在实际应用中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.22722', 'title': 'The LLM-Attacker: A Unified Red-Team Framework for Privacy Evaluation of Split and Distributed LLM Systems', 'url': 'https://huggingface.co/papers/2610.22722', 'abstract': 'Abstract LLM-Attacker standardizes privacy evaluations for split language models by recording attacker configurations, enabling comparable scoring of reconstruction attacks, and requiring linked undefended baselines for defense claims.  Generated by thinkingmachines/Inkling-Small Split language models keep input text on a client but send intermediate representations to a server. Attacks can reconstruct text from these messages. Comparing privacy evaluations is difficult when attackers see different messages, know different model weights or use different datasets and recovery measures. We present LLM-Attacker, a framework that records these choices and lets researchers check, compare and extend an evaluation. Compatible attacks reuse recorded messages, and their predictions are saved for independent scoring. The scoring rule requires a linked undefended reference before a defence can pass. Reports also identify attacks that remain untested. In a controlled GPT-2 experiment, adding gradients returned during training increased token recovery from 94.20% to 97.38% and exact-document recovery from 13.71% to 37.77%. The 95% interval for the token gain lay above the two-percentage-point threshold fixed before testing. This experiment is shared with a companion study; here, it tests how the evaluation responds to a change in attacker access. Further studies measure how corpus choice and compression defences affect recovery, compare an adapted published attack with its reference implementation, and test the measurement code. The framework reports implementation checks separately from measured attack effectiveness. Each privacy claim should state the attacker, dataset and scoring rule, report its controls and identify untested attacks.', 'score': 4, 'issue_id': 3458, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'd0b35f2fa5428bd7', 'authors': ['Georgios Politis', 'Evangelos Pappas'], 'affiliations': ['Setloop.io'], 'pdf_title_img': 'assets/pdf/title_img/2610.22722.jpg', 'data': {'categories': ['#open_source', '#security', '#leakage'], 'emoji': '🔐', 'ru': {'title': 'Честная оценка приватности требует сравнения с базовой линией без защиты', 'desc': 'Статья представляет LLM-Attacker, фреймворк для стандартизированной оценки приватности split language models, где входной текст остается у клиента, а на сервер передаются промежуточные представления. Фреймворк фиксирует конфигурацию атакующего, включая данные, веса модели и метрики, что делает разные атаки на реконструкцию текста сопоставимыми. Защита засчитывается только при сравнении с связанной базовой линией без защиты, а отчеты отмечают непроверенные атаки. В эксперименте на GPT-2 возврат градиентов во время обучения повысил восстановление токенов с 94.20% до 97.38%.'}, 'en': {'title': 'Standardizing Privacy Evaluations in Split Language Models', 'desc': 'The paper introduces LLM-Attacker, a framework designed to standardize privacy evaluations for split language models, which keep user input on the client side while sending intermediate data to a server. It addresses the challenges of comparing reconstruction attacks by recording attacker configurations and requiring linked undefended baselines for validating defense claims. The framework allows researchers to reuse recorded messages for compatible attacks and provides a scoring system that necessitates a reference for any defense to be considered effective. Additionally, the paper presents experimental results showing significant improvements in token and document recovery rates when using gradients during training, highlighting the importance of consistent evaluation metrics in privacy research.'}, 'zh': {'title': '标准化隐私评估，提升模型安全性', 'desc': 'LLM-Attacker是一个用于标准化分割语言模型隐私评估的框架。它记录攻击者的配置，使得重建攻击的评分可以进行比较，并要求有链接的未防御基线以验证防御声明。通过这个框架，研究人员可以检查、比较和扩展评估，确保攻击的可重复性和独立评分。实验结果显示，使用训练期间返回的梯度可以显著提高文本恢复的准确率。'}}}, {'id': 'https://huggingface.co/papers/2610.31651', 'title': 'BrickWright: Agentic Creation of Physically Feasible Brick Builds', 'url': 'https://huggingface.co/papers/2610.31651', 'abstract': 'Abstract BrickWright improves physical validity of AI-generated LEGO assemblies by providing agents with an assembly API and feasibility validator, achieving perfect validity while preserving prompt adherence.  Generated by thinkingmachines/Inkling-Small Frontier coding agents are becoming increasingly adept at 3D modeling. Yet, they still face challenges when building objects meant to be assembled in the physical world, often creating invalid assemblies with floating, colliding, or disconnected parts. We argue that providing agents with tools for assembling builds and verifying their physical feasibility is sufficient for them to produce physically valid assemblies that still adhere to input prompts. Focusing on the domain of LEGO brick builds, we present BrickWright, a framework for generating physically feasible brick builds from text or image prompts using pre-trained agents, where a build is physically feasible if it uses only real parts, has no colliding or floating parts, and forms a connected structure if possible. BrickWright guides agents to create builds by writing code with BrickLayer, a Python toolkit with two main components: an ergonomic brick assembly API that halves inference cost compared to working in raw LDraw, and a validator that provides feedback on physical feasibility. Whereas baseline agents achieve physical validity rates ranging from only 9% (GPT-6 Luna) to 69% (GPT-6 Astra), BrickWright-guided agents achieve 100% validity on a sample of 512 prompts, while improving prompt adherence for lightweight agents and maintaining it for stronger agents. Additionally, they outperform specialized models on the text-to-brick task. Code is available on our project page: https://avalovelace1.github.io/brickwright/', 'score': 4, 'issue_id': 3455, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '36e27dbd4e7723c6', 'authors': ['Ava Pun', 'Kevin Dai', 'Sally Chen', 'Maxwell Jones', 'Ruixuan Liu', 'Kangle Deng', 'Changliu Liu', 'Maneesh Agrawala', 'Deva Ramanan', 'Jun-Yan Zhu'], 'affiliations': ['Carnegie Mellon University', 'Independent Researcher', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.31651.jpg', 'data': {'categories': ['#agents', '#benchmark', '#open_source', '#3d', '#games'], 'emoji': '🧱', 'ru': {'title': 'Умные агенты строят LEGO, которые действительно собираются в реальности', 'desc': 'Авторы представляют BrickWright, фреймворк, который помогает AI-агентам создавать физически реализуемые сборки из LEGO по текстовым или графическим запросам. Агенты пишут код с помощью BrickLayer, Python-инструмента с удобным API для сборки и валидатором, который проверяет отсутствие коллизий, висящих деталей и наличие связности конструкции. Такой подход вдвое снижает стоимость инференса по сравнению с работой в сыром формате LDraw. В результате агенты с BrickWright достигают 100% физической валидности на выборке из 512 запросов, сохраняя или улучшая соответствие промпту и превосходя специализированные модели.'}, 'en': {'title': "Building Valid LEGO Models with AI: BrickWright's Perfect Fit!", 'desc': 'BrickWright is a framework designed to enhance the physical validity of AI-generated LEGO models by integrating an assembly API and a feasibility validator. This system allows AI agents to create 3D models that are not only valid but also adhere closely to user prompts. By utilizing a Python toolkit called BrickLayer, BrickWright significantly reduces the computational cost of generating these models while ensuring that they are physically feasible, meaning they consist of real LEGO parts without any collisions or disconnections. The results show that agents guided by BrickWright achieve a perfect validity rate of 100%, outperforming previous models in both physical validity and adherence to prompts.'}, 'zh': {'title': 'BrickWright：实现完美的 LEGO 组装有效性', 'desc': 'BrickWright 是一个改进 AI 生成 LEGO 组装物理有效性的框架。它通过提供组装 API 和可行性验证器，使得生成的 LEGO 组装不仅符合物理规则，还能遵循输入提示。使用预训练的代理，BrickWright 能够从文本或图像提示生成物理可行的 LEGO 组装，确保没有漂浮、碰撞或断开的部分。与基线代理相比，BrickWright 指导的代理在512个提示样本中实现了100%的有效性，且在轻量级代理上提高了提示遵循性。'}}}, {'id': 'https://huggingface.co/papers/2610.30340', 'title': 'Foundation4D: Towards a unified perception and reconstruction model for autonomous vehicles', 'url': 'https://huggingface.co/papers/2610.30340', 'abstract': 'Abstract Foundation4D is a unified feed-forward model that jointly estimates geometry, detects objects, predicts semantic occupancy, and reconstructs Gaussians from multi-camera driving video, achieving state-of-the-art results across several benchmarks.  Generated by thinkingmachines/Inkling-Small We introduce Foundation4D, a unified feed-forward model for geometry estimation, 3D detection, semantic occupancy, and Gaussian reconstruction from multi-camera driving video. A shared backbone uses factorized spatiotemporal attention to efficiently combine observations across cameras and time. Our video inference pipeline uses pose graph optimization to refine camera trajectories and assembles object tracks across input windows. We also develop a data annotation pipeline and release PAI-Foundation4D, a benchmark with dense depth and semantic occupancy labels for 1,253 driving clips. With benchmark-specific fine-tuning, Foundation4D achieves the lowest depth AbsRel on Waymo and nuScenes, the highest detection mAP on nuScenes, and the highest occupancy mIoU on OpenOccupancy among the compared methods. Our task-combination study shows benefits for both detection and geometry: co-training detection with geometry and occupancy improves top-class mAP by 1.2 points over detection-only training, while co-training geometry with detection reduces camera
