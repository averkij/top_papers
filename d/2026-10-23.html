    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.31329', 'title': 'WeVisOne-VL: Unified Visual Perception from Objects to Pixels', 'url': 'https://huggingface.co/papers/2610.31329', 'abstract': 'Abstract WeVisOne-VL unifies object-level and pixel-level visual perception via structured token prediction, supporting detection, localization, counting, OCR, segmentation, and matting with a lightweight pixel decoder and multi-stage training.  Generated by thinkingmachines/Inkling-Small Existing vision-language models (VLMs) remain unreliable for fine-grained visual perception. In this report, we present WeVisOne-VL (WeChat Vision All-in-One), a powerful VLM that unifies object-level and pixel-level perception through structured next-token prediction. It supports multiple visual tasks including object detection, referring localization, counting, OCR, segmentation, and matting, enabling localization at any user-specific granularity, from points and boxes to masks and alpha mattes. Architecturally, we integrate a lightweight pixel decoder into the VLM via a special <OBJ> token to generate instance-level pixel outputs. We train the model with a three-stage curriculum SFT followed by mixed-task RL. Across over 30 benchmarks, WeVisOne-VL demonstrates leading performance on both object-level and pixel-level tasks, while maintaining robust rejection for object-absent queries. By releasing WeVisOne-VL to the open-source community, we hope to advance VLMs from broad visual understanding toward truly reliable perception systems for real-world deployment.', 'score': 229, 'issue_id': 3454, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '551ea491755ed5bc', 'authors': ['Tianming Liang', 'Junyi Pan', 'Yuxi Li', 'Canmiao Fu', 'Zhipeng Huang', 'Chong Sun', 'Chen Li', 'Jing Lyu'], 'affiliations': ['Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2610.31329.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training', '#cv', '#open_source', '#architecture'], 'emoji': '👁️', 'ru': {'title': 'Одна VLM, которая видит и объекты, и каждый пиксель', 'desc': 'В статье представлена модель WeVisOne-VL, которая объединяет восприятие на уровне объектов и на уровне пикселей с помощью предсказания структурированных токенов. Модель решает задачи детекции, локализации по референсу, подсчёта объектов, OCR, сегментации и матирования, а также поддерживает разную степень детализации: от точек и боксов до масок и альфа-матов. Архитектурно к VLM добавляется лёгкий пиксельный декодер через специальный токен <OBJ>, который генерирует выходы на уровне отдельных экземпляров. Обучение проходит в три этапа curriculum SFT с последующим mixed-task RL, и модель показывает лидирующие результаты на более чем 30 бенчмарках.'}, 'en': {'title': 'Unified Visual Perception for All Tasks', 'desc': 'WeVisOne-VL is a vision-language model that enhances visual perception by combining object-level and pixel-level understanding through structured token prediction. It can perform various tasks such as object detection, localization, counting, OCR, segmentation, and matting, making it versatile for different visual applications. The model uses a lightweight pixel decoder and is trained using a three-stage curriculum followed by mixed-task reinforcement learning to improve its performance. By achieving top results across numerous benchmarks, WeVisOne-VL aims to provide a reliable perception system for real-world scenarios.'}, 'zh': {'title': 'WeVisOne-VL：统一视觉感知的强大模型', 'desc': 'WeVisOne-VL 是一种统一对象级和像素级视觉感知的模型，通过结构化的下一个标记预测来实现。它支持多种视觉任务，包括目标检测、定位、计数、光学字符识别、分割和抠图。该模型采用轻量级像素解码器，并通过三阶段的训练策略进行优化，能够在不同的粒度下进行定位。通过开源 WeVisOne-VL，我们希望推动视觉语言模型的发展，使其在实际应用中实现更可靠的感知能力。'}}}, {'id': 'https://huggingface.co/papers/2610.30926', 'title': 'Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation', 'url': 'https://huggingface.co/papers/2610.30926', 'abstract': "Abstract Factor-Aware Predictive Learning enables video diffusion transformers to leverage multimodal language model representations for sparse temporal inference and factor-aware cinematic control through staged grounding and optimization.  Generated by thinkingmachines/Inkling-Small Cinematic video generation requires both temporal inference from limited inputs (i.e., sparse rather than frame-by-frame guidance) and factor-aware control of character, scene, action, and camera. Multimodal large language models (MLLMs) offer useful priors for both capabilities, but their representations are not automatically actionable for video generation: a Video Diffusion Transformer (DiT) may bypass them through native conditioning pathways, and using them does not ensure either factor-aware control or generation-compatible temporal prediction. We propose Factor-Aware Predictive Learning (FAPL), which establishes effective MLLM latent use as a shared prerequisite and then targets the two capabilities with complementary learning signals. First, latent-only generator grounding trains the DiT with a frozen MLLM and connector, strengthening the DiT's use of MLLM latents for generation. Second, for factor-aware control, paired videos specify a target-factor change and non-target preservation, and factor-span replacement trains the DiT to realize this relationship in its output. Third, for temporal inference, text-only and text-plus-complete-video observations share a video target, and the trained DiT is then frozen while the MLLM and connector are optimized through it. This final stage trains limited-input representations for generation while retaining complete-observation reconstruction as a complementary training mode. Extensive experiments demonstrate our consistently better performance on three cinematic video generation tasks (i.e., sparse-to-video, factor-aware editing, and multi-shot generation) over baselines and validate FAPL's contributions to MLLM feature use, temporal control, and factor coordination.", 'score': 165, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'c64c2246d98853ed', 'authors': ['Songlin Yang', 'Zhe Wang', 'Xiaotong Zhao', 'Xi Wang', 'Ran Zhang', 'Shuai Li', 'Taiyi Wu', 'Songlian Li', 'Eric Liu', 'Alan Zhao', 'Anyi Rao'], 'affiliations': ['LIX, Ecole Polytechnique', 'Tencent Video', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.30926.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#diffusion', '#architecture', '#training', '#video'], 'emoji': '🎬', 'ru': {'title': 'Управляй кадром через MLLM: от разреженных подсказок к кинематографическому видео', 'desc': 'В статье представлен метод Factor-Aware Predictive Learning (FAPL), который позволяет Video Diffusion Transformer (DiT) эффективно использовать латентные представления Multimodal LLM для генерации кинематографического видео. Обучение проходит в три этапа: сначала DiT учится опираться на латенты замороженной MLLM, затем — контролировать отдельные факторы (персонаж, сцена, действие, камера) с помощью пар видео и замены фрагментов, и наконец — выполнять временной вывод по разреженным входным данным. Эксперименты показывают превосходство FAPL над базовыми методами в задачах sparse-to-video, редактирования с учетом факторов и многокадровой генерации. Исследование подтверждает вклад каждого этапа в использование признаков MLLM, временной контроль и координацию факторов.'}, 'en': {'title': 'Enhancing Video Generation with Factor-Aware Learning', 'desc': "Factor-Aware Predictive Learning (FAPL) enhances video diffusion transformers by integrating multimodal language model representations for improved temporal inference and cinematic control. It addresses the challenge of generating videos from sparse inputs while maintaining control over various factors like character and scene. FAPL employs a two-step training approach: first, it strengthens the video generator's reliance on language model features, and second, it trains the model to manage specific changes in video factors while preserving others. The results show that FAPL significantly outperforms existing methods in generating cinematic videos, demonstrating its effectiveness in leveraging language model capabilities for video tasks."}, 'zh': {'title': '因子感知预测学习：提升视频生成的智能控制', 'desc': '本文提出了一种名为因子感知预测学习（FAPL）的方法，旨在提高视频扩散变换器在稀疏时间推理和因子感知控制方面的能力。通过利用多模态大语言模型（MLLM）的潜在表示，FAPL 使得视频生成过程能够更好地控制角色、场景、动作和摄像机等因素。该方法包括三个主要步骤：首先，通过冻结的 MLLM 训练生成器，以增强其生成能力；其次，通过配对视频实现因子控制；最后，通过优化 MLLM 和连接器来实现时间推理。实验结果表明，FAPL 在三项电影视频生成任务中表现优于基线方法，验证了其在 MLLM 特征使用、时间控制和因子协调方面的贡献。'}}}, {'id': 'https://huggingface.co/papers/2610.30181', 'title': 'Deep Search in Real-World Web Environments', 'url': 'https://huggingface.co/papers/2610.30181', 'abstract': "Abstract OpenDS-World introduces a live-web benchmark to evaluate autonomous multi-step deep search agents, revealing significant gaps between frontier models and human performance.  Generated by thinkingmachines/Inkling-Small Despite substantial progress in Deep Search agents, their ability to conduct end-to-end research in real-world open Web environments remains insufficiently evaluated. Unlike static retrieval settings, information on the real-world Web is distributed across diverse sources, modalities, and heterogeneous formats, often involving complex interaction mechanisms that require agents to autonomously search for, access, and integrate relevant evidence during execution. To address this gap, we introduce the OpenDS task, designed to evaluate agents' ability to perform multi-step deep search in the live, open Web. This task requires agents to autonomously explore the real Web, discover and connect relevant evidence from multiple independent sources through Web search, browser interaction, and evidence processing, and ultimately determine a unique factual answer. Building on this task formulation, we construct OpenDS-World, a benchmark comprising 200 challenging tasks spanning diverse information modalities, heterogeneous file formats, and interactive access requirements, with independent human verification to ensure evidence validity and answer uniqueness. We evaluate 12 frontier models under a unified tool environment and execution protocol. The best-performing model achieves 39.0% accuracy, while human evaluation across 1,000 independent attempts yields 21.1% accuracy. Further analyses of tool usage, search cost, termination behavior, and failure recovery reveal substantial differences in research strategies across models, as well as persistent challenges in tool coordination and long-horizon search management. OpenDS-World provides a unified evaluation platform for systematically assessing and advancing agents' autonomous deep search capabilities in real-world open Web environments.", 'score': 152, 'issue_id': 3453, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '8df9f24243fdc82d', 'authors': ['Xiaomin Yu', 'Hongliang Chen', 'Zhe Huang', 'Shilin Yan', 'Shao-Rong Su', 'Xuqiao Ma', 'Feiyang Wang', 'Jiayu Chen', 'Jiwei Fang', 'Yu Yan', 'Yini Huang', 'Chen Chen', 'Ruoxi Cheng', 'Yuzhi He', 'Yuhui Zhang', 'Xiaoxing Hu', 'Chen Liu', 'Jianbo Lin', 'Yijiang Li', 'Xiaobin Hu', 'Menglong Li', 'Zhuoran Lu', 'Weishi Wang', 'Zhongqi Yue', 'Chengwei Qin'], 'affiliations': ['FDU', 'HKU', 'HKUST(GZ)', 'IC', 'Microsoft Research', 'NJU', 'NTU', 'NUS', 'SAP', 'SJTU', 'Stanford', 'UCSD', 'UW', 'Yale'], 'pdf_title_img': 'assets/pdf/title_img/2610.30181.jpg', 'data': {'categories': ['#agi', '#survey', '#dataset', '#agents', '#benchmark'], 'emoji': '🔎', 'ru': {'title': 'Насколько далеко ИИ-агенты ушли от человека в глубоком поиске в живом интернете', 'desc': 'В статье представлен OpenDS-World — бенчмарк для оценки автономных агентов глубокого поиска (Deep Search), которые должны проводить многошаговое исследование в реальном открытом интернете. Задача OpenDS требует от агента самостоятельно искать, открывать и объединять информацию из разных источников, модальностей и форматов файлов, а затем находить единственно верный фактический ответ. Набор включает 200 сложных задач с независимой проверкой людьми, а 12 передовых LLM показали лучший результат 39,0% против 21,1% у людей. Анализ использования инструментов, стоимости поиска и восстановления после ошибок выявил серьёзные трудности в координации инструментов и управлении длинными поисковыми цепочками.'}, 'en': {'title': 'Evaluating Deep Search Agents in the Real World', 'desc': 'OpenDS-World presents a new benchmark for evaluating autonomous deep search agents in real-world web environments. It highlights the challenges these agents face in conducting multi-step searches across diverse sources and formats, which differ significantly from traditional static retrieval tasks. The benchmark includes 200 tasks that require agents to autonomously gather and integrate evidence from the live web, with human verification ensuring the accuracy of the results. The study reveals that while frontier models show some progress, they still lag behind human performance, achieving only 39.0% accuracy compared to 21.1% for humans in independent evaluations.'}, 'zh': {'title': '评估自主深度搜索代理的新基准测试', 'desc': 'OpenDS-World 是一个新的基准测试，用于评估自主多步深度搜索代理的能力。尽管深度搜索代理取得了显著进展，但在真实开放网络环境中进行端到端研究的能力仍然不足。该基准测试包含200个具有挑战性的任务，要求代理在真实网络中自主探索、发现和连接来自多个独立来源的相关证据。通过对12个前沿模型的评估，发现最佳模型的准确率为39.0%，而人类的准确率为21.1%，显示出模型与人类在研究策略上的显著差异。'}}}, {'id': 'https://huggingface.co/papers/2610.24738', 'title': 'Editing Images into Reusable Layers via Compositional Edit-Prior Distillation', 'url': 'https://huggingface.co/papers/2610.24738', 'abstract': "Abstract LayerEditor unifies instruction-guided image editing with reusable RGBA layer generation via joint token modeling and edit-prior distillation, enabling precise local manipulation and layer reuse.  Generated by thinkingmachines/Inkling-Small High-quality image editing requires precise modification of target regions while preserving the content of unrelated regions. Existing editing models produce flattened outputs that limit precise local manipulation and layer reuse, while decomposition methods typically optimize layer recovery separately from instruction-driven editing. To this end, we introduce LayerEditor, a unified framework that couples instruction-guided image editing with controllable generation of reusable RGBA layers. At its core, In-Context RGB-Alpha Token Modeling jointly represents the edited canvas and an ordered sequence of RGB-Alpha layers within a single token sequence, enabling semantic edits and explicit control over individual layer content. To retain the pretrained model's editing capability during adaptation to layered outputs, we propose Compositional Edit-Prior Distillation, which transfers its editing prior to both the edited canvas and the image composed from the predicted layers. To support training and evaluation, we construct LayerEditor-100K, a large-scale paired image-editing dataset with ordered RGBA layer annotations, and introduce dedicated benchmarks for layered editing. Extensive experiments demonstrate that LayerEditor maintains strong editing fidelity while generating accurate RGBA layers, supporting both flexible layer-level manipulation and multi-layer decomposition.", 'score': 77, 'issue_id': 3453, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': '691134b7316b8f9c', 'authors': ['Wen Xue', 'Yong Liu', 'Xueheng Li', 'Si Wu', 'Yong Xu', 'Yipeng Sun', 'Yan Li', 'Simiu Gu'], 'affiliations': ['JD.com', 'Peng Cheng Laboratory', 'South China University of Technology', 'Tsinghua University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.24738.jpg', 'data': {'categories': ['#multimodal', '#synthetic', '#cv', '#dataset', '#architecture', '#training', '#benchmark', '#diffusion', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Редактируй изображение слой за слоем — точно и без потерь', 'desc': 'В статье представлен LayerEditor — фреймворк, который объединяет редактирование изображений по текстовой инструкции с генерацией переиспользуемых RGBA-слоёв. Ключевой механизм, In-Context RGB-Alpha Token Modeling, совместно моделирует отредактированное полотно и упорядоченную последовательность слоёв внутри одной последовательности токенов. Для сохранения возможностей предобученной модели используется Compositional Edit-Prior Distillation, которая переносит редакторский prior на полотно и на изображение, собранное из предсказанных слоёв. Авторы также создали датасет LayerEditor-100K с аннотациями RGBA-слоёв и бенчмарки для послойного редактирования, показав высокую точность редактирования и качество слоёв.'}, 'en': {'title': 'Unifying Image Editing with Layered Control', 'desc': 'LayerEditor is a new framework that combines instruction-based image editing with the creation of reusable RGBA layers. It allows users to make precise edits to specific areas of an image while keeping other parts unchanged. The framework uses a method called In-Context RGB-Alpha Token Modeling to manage both the edited image and its layers together, which enhances control over the editing process. Additionally, it introduces Compositional Edit-Prior Distillation to ensure that the model retains its editing skills when adapting to layered outputs, supported by a large dataset for training and evaluation.'}, 'zh': {'title': '统一图像编辑与可重用层生成的创新框架', 'desc': 'LayerEditor 是一个统一的框架，将指令引导的图像编辑与可重用的 RGBA 层生成结合在一起。它通过联合的令牌建模和编辑优先蒸馏，实现了对目标区域的精确修改，同时保留无关区域的内容。该方法允许对单个层内容的显式控制，并支持灵活的层级操作和多层分解。通过构建 LayerEditor-100K 数据集，研究者们为层级编辑提供了训练和评估的基础。'}}}, {'id': 'https://huggingface.co/papers/2610.30949', 'title': 'IQuest-Q1: Advancing Foundation Capabilities for Agentic CLI Systems', 'url': 'https://huggingface.co/papers/2610.30949', 'abstract': 'Abstract IQuest-Q1 is a sparse Mixture-of-Experts foundation model trained via multi-stage pre-training, mid-training, and post-training to achieve strong agentic coding and general capabilities.  Generated by thinkingmachines/Inkling-Small We present IQuest-Q1, a sparse Mixture-of-Experts (MoE) agentic foundation model with 320B total parameters (15B activated). IQuest-Q1 is developed through a three-stage process: (1) stable and efficient pre-training, combining Stable SplitNorm, Muon, and muP with a two-stage curriculum whose second stage increases the coding-data mixture, preserving a wide stability margin between safe and optimal learning rates; (2) fine-grained mid-training, expanding the data mixture across domains and formats and progressively extending the context; and (3) multi-scaffold with multi-version post-training, combining SFT, domain-specialized RL, and MOPD across various scaffolds to integrate complementary training signals and strengthen agentic coding capabilities. Furthermore, model merging combines different experts and checkpoints from different stages while mitigating conflicts among their parameter updates. The resulting IQuest-Q1 demonstrates capabilities in both coding and general tasks. We release IQuest-Q1 as an open-source model to support community research and development.', 'score': 68, 'issue_id': 3454, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '9b0c2a12db797969', 'pdf_title_img': 'assets/pdf/title_img/2610.30949.jpg', 'data': {'categories': ['#plp', '#agents', '#rl', '#optimization', '#training', '#open_source', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Открытая MoE-модель, которая умеет писать код и решать задачи агентно', 'desc': 'Статья представляет IQuest-Q1 — разреженную MoE-модель (Mixture-of-Experts) на 320 млрд параметров, из которых активны около 15 млрд, созданную как агентную foundation model для программирования. Обучение проходит в три этапа: стабильный pre-training с Stable SplitNorm, Muon и muP и двухэтапным curriculum, затем mid-training с расширением данных и контекста, и наконец post-training с SFT, доменным RL и MOPD на нескольких scaffolds. Дополнительно используется model merging, объединяющий экспертов и чекпоинты разных стадий с учетом конфликтов обновлений параметров. Модель демонстрирует сильные результаты как в кодировании, так и в общих задачах и опубликована в открытом доступе.'}, 'en': {'title': 'IQuest-Q1: A Powerful Mixture-of-Experts Model for Coding and Beyond', 'desc': 'IQuest-Q1 is a sophisticated machine learning model that uses a sparse Mixture-of-Experts (MoE) architecture with a total of 320 billion parameters, of which 15 billion are activated during operation. The model undergoes a three-stage training process: first, it is pre-trained using advanced techniques to ensure stability and efficiency; second, it is mid-trained to enhance its ability to handle diverse data types; and finally, it is post-trained using various methods to refine its coding and general capabilities. Additionally, IQuest-Q1 employs model merging to combine different expert models while resolving conflicts in their parameters. This innovative approach allows IQuest-Q1 to excel in both coding tasks and general applications, and it is made available as an open-source resource for further research.'}, 'zh': {'title': 'IQuest-Q1：强大的稀疏专家混合模型', 'desc': 'IQuest-Q1是一种稀疏的专家混合模型，具有3200亿个参数（激活时为150亿）。该模型通过三阶段的训练过程开发，包括稳定高效的预训练、细粒度的中期训练和多版本的后期训练。预训练阶段结合了多种技术，以确保学习的稳定性和效率；中期训练则扩展了数据的多样性；后期训练则通过整合不同的训练信号来增强模型的编码能力。IQuest-Q1在编码和一般任务上表现出色，并作为开源模型发布，以支持社区的研究与开发。'}}}, {'id': 'https://huggingface.co/papers/2610.29677', 'title': 'Toward Recursive Self-Improvement in Physical AI', 'url': 'https://huggingface.co/papers/2610.29677', 'abstract': "Abstract  Recursive self-improvement (RSI) describes a system that improves not only its behavior but also the process by which it improves. Recent digital agents test this idea by rewriting their own code and checking each version with executable tests. Bringing these mechanisms into the physical world requires learning from partial observations through costly trials, while accounting for changing operating conditions and potentially irreversible consequences. We position RSI within robot learning and trace pathways from improving robot capabilities to improving the processes that generate them. We examine how physical experience can strengthen these improvement mechanisms and when the resulting gains can support further self-improvement of the mechanisms themselves. Gains carry forward only when feedback addresses remaining learning needs, the receiving component can use the change, its value survives changes in tasks or hardware, and continued practice remains safe and affordable. Existing studies, concentrated in manipulation, support behavioral improvement, benefits to later learning, and procedure improvement. Some systems also change the improver's knowledge or tools, but the physical studies reviewed here have yet to isolate gains attributable to recursion. We synthesize these findings into evaluation principles and research directions for machines that, trial by trial, safely improve the way they improve.", 'score': 50, 'issue_id': 3453, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '6195074a3cd92d33', 'authors': ['Meng Luo', 'Zechen Bai', 'Shanqing Xu', 'Yanlin Li', 'Kaixin Li', 'Mengchen Qian', 'Weifeng Lu', 'Ran Zhang', 'Yingtian Zou', 'Ziyang Luo', 'Wei Chen', 'Hongzhan Lin'], 'affiliations': ['Hong Kong Baptist University', 'Huazhong University of Science and Technology', 'Nanyang Technological University', 'National University of Singapore', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.29677.jpg', 'data': {'categories': ['#robotics', '#agi', '#survey', '#agents', '#training', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Роботы, которые учатся учиться лучше', 'desc': 'Статья рассматривает рекурсивное самоулучшение (RSI) в робототехнике: система улучшает не только свое поведение, но и сам процесс обучения, который его порождает. Авторы анализируют, как опыт взаимодействия с физическим миром через дорогостоящие пробы может укреплять такие механизмы, и когда полученные выигрыши переносятся на последующее обучение. Обзор существующих работ, в основном по манипуляции, показывает улучшение поведения, пользу для дальнейшего обучения и улучшение процедур, однако выделить вклад именно рекурсии пока не удалось. На основе этих результатов предложены принципы оценки и направления исследований для безопасно самоулучшающихся роботов.'}, 'en': {'title': 'Empowering Robots to Learn How to Learn', 'desc': 'This paper discusses Recursive Self-Improvement (RSI), where systems not only enhance their actions but also refine their improvement processes. It highlights how digital agents can rewrite their own code and validate it through tests, but applying this to physical robots involves learning from incomplete data and managing unpredictable environments. The authors explore how physical experiences can enhance these self-improvement mechanisms and identify conditions under which these improvements can be sustained. They propose evaluation principles and future research directions to ensure that machines can safely and effectively improve their own learning processes over time.'}, 'zh': {'title': '递归自我改进：让机器更聪明的自我提升之路', 'desc': '递归自我改进（RSI）是一种系统，不仅改善其行为，还改善其改进过程。最近的数字代理通过重写自己的代码并使用可执行测试检查每个版本来测试这一理念。将这些机制引入物理世界需要通过昂贵的试验从部分观察中学习，同时考虑变化的操作条件和潜在的不可逆后果。我们将RSI定位于机器人学习中，探讨从改善机器人能力到改善生成这些能力的过程的路径。'}}}, {'id': 'https://huggingface.co/papers/2610.25100', 'title': 'Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models', 'url': 'https://huggingface.co/papers/2610.25100', 'abstract': 'Abstract Deep Fusion Memory integrates predicted parametric memory into intermediate hidden states via gated cross-attention, reducing retrieval overhead and improving knowledge-intensive tasks without online retrieval.  Generated by thinkingmachines/Inkling-Small Large language models need effective ways to acquire and use external knowledge beyond what they retain from pretraining. Continued pretraining risks catastrophic forgetting, while retrieval at inference time can add substantial overhead. External parametric memory avoids online retrieval, but constructing its training data requires extensive offline search, and output-level interpolation provides only shallow fusion. We introduce Deep Fusion Memory (DFM), a parametric memory architecture that reduces this construction workload and incorporates learned memory into intermediate hidden states. A causal memory predictor learns to generate memory from the preceding context, using retrieved chunk embeddings from the corpus as supervision. The predicted memory is shared across tokens within each chunk and fused into their hidden states through gated cross-attention. Memory prediction and fusion are trained end to end with the backbone frozen, and inference requires no explicit retrieval. Compared with existing parametric memory approaches, which often construct token-level memory targets, DFM requires 32times fewer retrieval queries and 2048times fewer retrieved items to construct its training data. Across six QA tasks, DFM performs better over the strongest baseline by 12.71% on Mistral-7B-v0.3 and 11.19% on Qwen3-8B-Base. Beyond QA, domain adaptation yields average gains of 6.51 and 4.38 points over Qwen3-4B-Base and Qwen3-8B-Base, respectively.', 'score': 40, 'issue_id': 3453, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'e2692d8d46d45ece', 'authors': ['Rubin Wei', 'Siyuan Sun', 'Hao Sun', 'Yuliang Liu', 'Xiang Shi', 'Jiarui Wang', 'Junming Zhang', 'Zhouhan Lin'], 'affiliations': ['LUMIA Lab, School of Artificial Intelligence, Shanghai Jiao Tong University', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2610.25100.jpg', 'data': {'categories': ['#rag', '#long_context', '#architecture', '#training'], 'emoji': '🧠', 'ru': {'title': 'Память, встроенная глубоко в модель, заменяет поиск при каждом запросе', 'desc': 'В статье представлен Deep Fusion Memory (DFM) — архитектура параметрической памяти для LLM, которая встраивает предсказанную память в промежуточные скрытые состояния через gated cross-attention. КаUzzal каузальный предиктор памяти генерирует представление по предыдущему контексту, используя эмбеддинги извлечённых чанков как supervision, и память разделяется между токенами внутри чанка. Обучение memory predictor и fusion идёт end-to-end при замороженном backbone, а при инференсе явный retrieval не нужен, что снижает накладные расходы. По сравнению с аналогами DFM требует в 32 раза меньше запросов к retrieval и в 2048 раз меньше извлечённых элементов, при этом превосходит сильнейший baseline на QA-задачах (на 12.71% для Mistral-7B-v0.3 и 11.19% для Qwen3-8B-Base).'}, 'en': {'title': 'Revolutionizing Memory Integration in Language Models', 'desc': 'Deep Fusion Memory (DFM) is a new architecture that enhances language models by integrating learned memory into their hidden states using gated cross-attention. This method reduces the need for extensive retrieval processes during inference, which can slow down performance. DFM allows models to generate memory based on previous context, significantly cutting down the number of retrieval queries needed for training. As a result, DFM shows improved performance on various question-answering tasks and domain adaptation compared to existing memory approaches.'}, 'zh': {'title': '深度融合记忆：高效知识获取的新方法', 'desc': '深度融合记忆（Deep Fusion Memory，DFM）是一种将预测的参数记忆通过门控交叉注意力融入中间隐藏状态的架构。这种方法减少了检索开销，并在知识密集型任务中表现出色，而无需在线检索。DFM通过因果记忆预测器生成记忆，利用从语料库中检索的块嵌入作为监督，显著降低了训练数据构建的工作量。与现有的参数记忆方法相比，DFM在构建训练数据时需要的检索查询次数减少了32倍，检索项目减少了2048倍。'}}}, {'id': 'https://huggingface.co/papers/2610.23987', 'title': 'What Generation Knows: Unlocking Fine-Grained Understanding in Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2610.23987', 'abstract': 'Abstract GAFU leverages native generation-side representations to improve fine-grained visual understanding in unified multimodal models by compressing them into compact tokens for task-conditioned retrieval.  Generated by thinkingmachines/Inkling-Small Fine-grained visual understanding requires distinguishing subtle differences in local attributes and spatial relations, yet remains challenging for existing vision-language models. Unified multimodal models (UMMs) offer a new opportunity through generation pathways that preserve rich visual information complementary to understanding. However, existing generation-assisted understanding methods mainly rely on generative supervision or explicit generation and have not systematically explored direct use of native generation-side representations. To address this gap, we systematically analyze what generation-side representations offer for fine-grained understanding, finding that they are more sensitive to fine-grained semantic changes, capture task-relevant changes missed by understanding-side representations, and depend on correct spatial organization for this advantage. Guided by these findings, we design GAFU, a post-training framework that unlocks native generation-side information for fine-grained understanding. It compresses generation-side visual representations into compact \\(G\\) tokens that preserve fine-grained visual details, enabling task-conditioned retrieval by the understanding pathway. Experiments show that GAFU consistently outperforms SFT baselines trained on the same data across diverse visual understanding tasks and UMM architectures, with maximum relative improvements of 20.00\\%, 17.94\\%, and 8.62\\% on VStar-Bench, OmniSpatial, and VSR-Bench, respectively. Overall, GAFU converts complementary information from the generation pathway into gains in fine-grained visual understanding, providing an effective path toward synergy between generation and understanding in UMMs.', 'score': 32, 'issue_id': 3454, 'pub_date': '2026-10-14', 'pub_date_card': {'ru': '14 октября', 'en': 'October 14', 'zh': '10月14日'}, 'hash': '5689d02134f02639', 'authors': ['Tengju Ru', 'Weitong Lian', 'Zecong Tang', 'Zhiheng Liu', 'Lingyi Meng', 'Haoran Li', 'Kaixuan Wang', 'Bohao Li', 'Xihui Liu'], 'affiliations': ['Shenzhen Loop Area Institute', 'The Chinese University of Hong Kong, Shenzhen', 'The University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.23987.jpg', 'data': {'categories': ['#interpretability', '#multimodal', '#benchmark', '#training', '#cv'], 'emoji': '🔍', 'ru': {'title': 'Генерация помогает видеть детали: используем скрытые знания UMM для точного понимания изображений', 'desc': 'Статья предлагает GAFU, метод постобучения унифицированных мультимодальных моделей (UMM), который использует нативные представления с генеративной стороны для улучшения тонкого визуального понимания. Авторы показывают, что эти представления чувствительнее к мелким семантическим изменениям и фиксируют важные для задачи детали, которые упускают представления на стороне понимания. GAFU сжимает их в компактные G-токены и применяет условный по задаче retrieval, что даёт прирост над SFT-бейзлайнами на VStar-Bench, OmniSpatial и VSR-Bench. Результат демонстрирует синергию генерации и понимания внутри единой модели.'}, 'en': {'title': 'Unlocking Fine-Grained Visual Understanding with GAFU', 'desc': "The paper introduces GAFU, a framework that enhances fine-grained visual understanding in unified multimodal models (UMMs) by utilizing native generation-side representations. It compresses these representations into compact tokens, which are then used for task-specific retrieval, improving the model's ability to distinguish subtle visual differences. The study reveals that generation-side representations are more sensitive to fine-grained semantic changes and capture important task-relevant details that understanding-side representations may overlook. Experimental results demonstrate that GAFU significantly outperforms existing methods, showcasing its effectiveness in integrating generation and understanding pathways for better visual comprehension."}, 'zh': {'title': 'GAFU：提升细粒度视觉理解的有效路径', 'desc': 'GAFU是一种后训练框架，旨在通过压缩生成侧的视觉表示为紧凑的G令牌，来提升细粒度视觉理解。该方法利用统一多模态模型中的生成路径，保留丰富的视觉信息，以改善对细微语义变化的敏感性。研究表明，生成侧表示能够捕捉到理解侧表示所遗漏的任务相关变化，并依赖于正确的空间组织。实验结果显示，GAFU在多个视觉理解任务中显著优于传统的基线方法，证明了生成与理解之间的协同作用。'}}}, {'id': 'https://huggingface.co/papers/2610.27851', 'title': 'LaLa-World: Scaling Latent World Models with Natural Language Actions', 'url': 'https://huggingface.co/papers/2610.27851', 'abstract': 'Abstract LaLa-World is a language-conditioned latent world model that jointly learns from diverse simulation, robot, and video data to enable efficient model-predictive planning and policy initialization.  Generated by thinkingmachines/Inkling-Small This paper shows that JEPA-style latent world models (LWMs) can learn across diverse domains and data sources by adopting the language-conditioned interface of video generation models. We establish this approach as an effective and efficient basis for planning with imagination and downstream policy fine-tuning. To this end, we introduce LaLa-World, a Language-conditioned Latent World model that learns from simulation and robot trajectories together with broader image and video data. Two designs make this work. First, we describe both numerical actions and visual changes in language, enabling joint training of a single future predictor across heterogeneous datasets. Second, we build the predictor on a language model, allowing it to interpret language conditions while predicting future latent states. The resulting predictor achieves higher average MPC planning performance than existing LWMs trained separately for each domain or task. Adding image and video data further improves average planning performance and robustness to action phrasing. In a matched comparison with an RAEv2-based video generation model baseline, LaLa-World reaches comparable planning performance with 6times less training cost and 13.9times faster planning. Beyond planning, the pretrained LaLa-World serves as an initialization for LaLa-Policy, which jointly predicts actions and future visual representations. LaLa-Policy performs competitively with Cosmos Policy on LIBERO and RoboCasa, with up to 5.5times faster inference.', 'score': 29, 'issue_id': 3453, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '3f1c553f3985ecdc', 'authors': ['Junha Song', 'Geonmo Gu', 'Jeongeun Park', 'Heejeong Nam', 'Lucas Maes', 'Byeongho Heo', 'Dongyoon Han', 'Sangdoo Yun'], 'affiliations': ['Brown University', 'Georgia Institute of Technology', 'Mila & Université de Montréal', 'NAVER AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.27851.jpg', 'data': {'categories': ['#games', '#multimodal', '#robotics', '#optimization', '#inference', '#architecture', '#training', '#rl', '#video', '#transfer_learning'], 'emoji': '🤖', 'ru': {'title': 'Один язык — много миров: универсальная модель для планирования роботов', 'desc': 'Авторы представляют LaLa-World — латентную модель мира, управляемую языком, которая обучается одновременно на симуляционных, роботизированных и обычных видео- и image-данных. Численные действия и визуальные изменения описываются текстом, а в основе предсказателя лежит language model, что позволяет предсказывать будущие латентные состояния. Модель превосходит отдельно обученные LWM в планировании через MPC и быстрее в 13.9 раза, требуя при этом в 6 раз меньше затрат на обучение, чем video generation baseline. Предобученная модель служит инициализацией для LaLa-Policy, которая совместно предсказывает действия и будущие визуальные представления, показывая конкурентные результаты на LIBERO и RoboCasa с ускорением инференса до 5.5 раз.'}, 'en': {'title': 'LaLa-World: Bridging Language and Planning for Efficient Learning', 'desc': 'LaLa-World is a novel language-conditioned latent world model that integrates learning from various data sources, including simulations, robot trajectories, and videos, to enhance model-predictive planning and policy initialization. By utilizing a language interface similar to video generation models, it enables the joint training of a future predictor that can handle diverse datasets effectively. This model not only improves planning performance but also reduces training costs significantly compared to traditional methods. Additionally, LaLa-World serves as a strong foundation for LaLa-Policy, which predicts actions and visual outcomes, achieving faster inference times and competitive results in various benchmarks.'}, 'zh': {'title': '语言驱动的高效潜在世界模型', 'desc': 'LaLa-World是一种语言条件的潜在世界模型，它能够从多种模拟、机器人和视频数据中学习，以实现高效的模型预测规划和策略初始化。该模型通过采用视频生成模型的语言条件接口，展示了JEPA风格的潜在世界模型在不同领域和数据源中学习的能力。LaLa-World的设计包括用语言描述数值动作和视觉变化，从而实现跨异构数据集的联合训练。最终，LaLa-World在规划性能上优于单独为每个领域或任务训练的现有潜在世界模型，并且在训练成本和规划速度上也表现出显著优势。'}}}, {'id': 'https://huggingface.co/papers/2610.30320', 'title': 'Self-Distilling Future Video Representations for World Action Models', 'url': 'https://huggingface.co/papers/2610.30320', 'abstract': 'Abstract FRED improves single-step future video representations in world action models through self-distillation and temporal conditioning, boosting robot policy performance on long-horizon and unseen tasks.  Generated by thinkingmachines/Inkling-Small World Action Models (WAMs) have emerged as a promising approach to learning generalist robot policies using rich spatiotemporal priors from pre-trained video diffusion models. A recent line of WAMs improves inference efficiency by conditioning a separate action decoder on intermediate future video representations extracted from a single denoising step, avoiding costly iterative denoising required for video generation. This design makes action prediction depend directly on the quality of these future representations. In this paper, we introduce Future REpresentation learning via self-Distillation with temporal context (FRED), a framework that trains WAMs to improve the quality of future video representations from noise in a single denoising step. Specifically, FRED uses self-distillation to predict future representations from noise, using representations extracted from ground-truth future observations as targets. We further condition the video model on historical observations, providing temporal context for predicting future representations better. Across diverse real-world manipulation scenarios, FRED consistently outperforms competing WAMs. It achieves particularly large gains on long-horizon and out-of-domain tasks under zero-shot environment generalization, and substantially improves human-to-robot skill transfer, reaching 50.0% task success on tasks absent from robot training data and demonstrated only in human videos, compared with 19.4% for the best competing WAM.', 'score': 28, 'issue_id': 3453, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'ca45a1d1d7f7dedf', 'authors': ['Huiwon Jang', 'Suhyeok Jang', 'Hyeonmo Kang', 'Seungku Kim', 'Jinwoo Shin', 'Sihyun Yu'], 'affiliations': ['KAIST', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2610.30320.jpg', 'data': {'categories': ['#robotics', '#optimization', '#diffusion', '#architecture', '#training', '#video', '#transfer_learning'], 'emoji': '🤖', 'ru': {'title': 'Точнее предсказываем будущее — умнее действуем роботы', 'desc': 'В статье представлен метод FRED, который улучшает качество предсказания будущих видеопредставлений в World Action Models (WAM) — моделях, используемых для обучения универсальных политик роботов. Вместо дорогого итеративного денойзинга используется одношаговое извлечение представлений из шума, а для обучения применяется self-distillation, где целевыми значениями служат представления реальных будущих кадров. Модель дополнительно получает историю наблюдений как временной контекст, что делает предсказания точнее. На реальных задачах манипуляции FRED превосходит конкурентов, особенно на длинных и out-of-domain задачах, и значительно улучшает перенос навыков с человека на робота.'}, 'en': {'title': 'Enhancing Robot Learning with Future Representation Distillation', 'desc': 'The paper introduces FRED, a framework that enhances the quality of future video representations in world action models (WAMs) using self-distillation and temporal conditioning. By training on noise and leveraging ground-truth future observations, FRED improves the action prediction capabilities of robots, especially in long-horizon and unseen tasks. This approach allows robots to generalize better to new environments without prior training, achieving significant success rates in tasks demonstrated only through human videos. Overall, FRED represents a significant advancement in robot policy performance by optimizing future video representation learning.'}, 'zh': {'title': 'FRED：提升机器人未来视频表示的创新框架', 'desc': 'FRED是一种通过自蒸馏和时间条件化来改善世界行动模型中单步未来视频表示的方法。它利用从预训练视频扩散模型中提取的丰富时空先验，提升机器人在长时间跨度和未见任务上的策略表现。FRED通过自蒸馏从噪声中预测未来表示，并使用真实未来观察提取的表示作为目标，从而提高未来视频表示的质量。该框架在多种真实世界操作场景中表现优异，尤其在零-shot环境泛化和人机技能转移方面取得显著进展。'}}}, {'id': 'https://huggingface.co/papers/2610.30753', 'title': 'FilmFlow: Agentic System for 3D Virtual Film Cinematography', 'url': 'https://huggingface.co/papers/2610.30753', 'abstract': 'Abstract FilmFlow is an agentic framework that translates natural-language or video instructions into executable camera trajectories for 3D scenes using specialized director, interpreter, scout, and critic agents, evaluated on the CinemaBench dataset.  Generated by thinkingmachines/Inkling-Small Complex camera motion is central to visual storytelling, yet translating cinematographic intent into controllable, executable camera trajectories remains challenging. We introduce FilmFlow, an agentic framework that converts natural-language instructions or reference videos into explicit camera trajectories for dynamic 3D environments. To generate these trajectories, a Director agent constructs executable camera plans by composing high-level motions from concurrent atomic operations that jointly control translation, rotation, and framing. The Director is supported by three specialized agents: an Interpreter that extracts scene-grounded cinematographic intent, a Scout that selects initial viewpoints, and a Critic that evaluates rendered results and provides visual feedback for iterative plan refinement. We also introduce CinemaBench, comprising 150 Blender scenes from self-created and licensed sources, with five camera instructions per scene for 750 text-directed tasks and 60 reference videos associated with a subset of scenes. CinemaBench supports evaluation of both text-directed camera generation and video reference-directed camera generation. Across a diverse set of evaluated baselines, FilmFlow achieves the strongest benchmark performance and the highest user preference, demonstrating effective spatial reasoning, temporal coordination, and visual composition for executable 3D cinematography.', 'score': 26, 'issue_id': 3455, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'a587a47ee49e2c54', 'authors': ['Yiming Zhang', 'Jiarui Guo', 'Haojia Wei', 'Yifei Liu', 'Yifan Yang', 'Hongjie Zhang', 'Xue Yang', 'Zhihang Zhong'], 'affiliations': ['Cornell University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'University of California, Los Angeles'], 'pdf_title_img': 'assets/pdf/title_img/2610.30753.jpg', 'data': {'categories': ['#reasoning', '#dataset', '#video', '#agents', '#benchmark', '#3d', '#games'], 'emoji': '🎬', 'ru': {'title': 'Камера, которая понимает режиссёра: от текста к исполняемой траектории', 'desc': 'В статье представлен FilmFlow — агентная система, которая переводит текстовые или видеоинструкции в исполняемые траектории камеры для динамичных 3D-сцен. Director-агент составляет план, комбинируя одновременные атомарные операции над перемещением, поворотом и кадрированием, а Interpreter, Scout и Critic помогают извлечь замысел, выбрать ракурсы и итеративно уточнить план по визуальной обратной связи. Авторы также представляют бенчмарк CinemaBench: 150 сцен в Blender, 750 текстовых задач и 60 референсных видео. По результатам экспериментов FilmFlow превосходит базовые методы как по метрикам, так и по предпочтениям пользователей.'}, 'en': {'title': 'Transforming Words and Videos into Cinematic Camera Movements', 'desc': 'FilmFlow is a novel framework that transforms natural language or video instructions into precise camera movements for 3D scenes. It utilizes a set of specialized agents: a Director that creates camera plans, an Interpreter that understands cinematographic intent, a Scout that chooses viewpoints, and a Critic that assesses and refines the output. The framework is evaluated using the CinemaBench dataset, which includes various scenes and tasks for testing both text and video-based camera generation. FilmFlow outperforms existing methods, showcasing its ability to effectively manage spatial and temporal aspects of 3D cinematography.'}, 'zh': {'title': '智能摄像机轨迹生成的未来', 'desc': 'FilmFlow是一个智能框架，可以将自然语言或视频指令转换为可执行的3D场景摄像机轨迹。它通过一个导演代理构建可执行的摄像机计划，并结合多个原子操作来控制摄像机的移动、旋转和构图。该框架还包括解释者、侦察者和评论者等专门代理，分别负责提取意图、选择视角和评估结果。通过CinemaBench数据集的评估，FilmFlow在文本和视频指令的摄像机生成任务中表现出色，展示了其在空间推理和视觉构图方面的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.27598', 'title': 'Meta Expert: Cross-Layer Expert Sharing for Storage- and Retrieval-Efficient MoE', 'url': 'https://huggingface.co/papers/2610.27598', 'abstract': "Abstract Shared meta-experts across layers reduce redundancy and improve efficiency compared to layer-specific local experts in mixture-of-experts models.  Generated by thinkingmachines/Inkling-Small As model parameters scale up, sparsely activated Mixture-of-Experts (MoE) approaches have become essential for model scaling. However, mainstream models currently adopt hierarchical architectures, where experts in different layers, although topologically independent, exhibit substantial similarity and redundancy in their stored content. Compared to the hierarchically arranged Local Expert in existing mainstream models, we hypothesize that inter-layer shared Meta Expert hold greater potential. To this end, we conduct a multi-dimensional empirical comparison between Local and Meta Experts, and find that models incorporating Meta Experts exhibit lower parameter redundancy, together with lower cross-entropy loss and higher downstream task accuracy. With the activated quantity and the expert granularity held fixed, our model matches the performance of Vanilla MoE using only 70--80\\% of the experts, substantially improving the model's scaling potential. Beyond removing inter-layer redundancy among experts and improving information storage efficiency, our theoretical analysis further shows that, compared with Local Experts, Meta Experts provide hidden states with more flexible residual pathways, thereby improving information retrieval efficiency.", 'score': 25, 'issue_id': 3453, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'd4c8b780c6fd0068', 'authors': ['Ermo Hua', 'Xiangyu Hong', 'Baiting Wu', 'Che Jiang', 'Haozheng Hou', 'Yicheng Gu', 'Hanjing Wang', 'Qirui Zeng', 'Ming Zhang', 'Ning Ding', 'Qipeng Guo', 'Youbang Sun', 'Biqing Qi', 'Bowen Zhou'], 'affiliations': ['Shanghai AI Laboratory', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.27598.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '🧩', 'ru': {'title': 'Один общий эксперт вместо множества похожих: меньше избыточности, больше масштабируемости', 'desc': 'В статье предлагается заменить послойные локальные эксперты в MoE-моделях на общих мета-экспертов, которые разделяются между слоями. Авторы показывают, что у локальных экспертов в разных слоях сильно похожее содержимое, что приводит к избыточности параметров. Модели с Meta Experts демонстрируют меньшую избыточность, более низкую cross-entropy loss и более высокую точность на downstream-задачах. При тех же активируемых параметрах и гранулярности такая модель достигает качества Vanilla MoE, используя лишь 70–80% экспертов, и теоретически обеспечивает более гибкие residual-пути для поиска информации.'}, 'en': {'title': 'Unlocking Efficiency with Shared Meta-Experts in MoE Models', 'desc': 'This paper discusses a new approach in mixture-of-experts (MoE) models by introducing shared meta-experts across different layers. Unlike traditional local experts that are specific to each layer, meta-experts reduce redundancy and enhance efficiency by sharing knowledge between layers. The authors demonstrate that models using meta-experts achieve better performance with fewer parameters, resulting in lower cross-entropy loss and higher accuracy on downstream tasks. Their findings suggest that meta-experts not only streamline information storage but also improve the flexibility of information retrieval within the model.'}, 'zh': {'title': '跨层共享元专家：提升模型效率的关键', 'desc': '本文探讨了在混合专家模型中，跨层共享的元专家如何减少冗余并提高效率。随着模型参数的增加，稀疏激活的混合专家方法变得至关重要。研究表明，与传统的层级本地专家相比，跨层共享的元专家在参数冗余、交叉熵损失和下游任务准确性方面表现更佳。通过固定激活数量和专家粒度，我们的模型在使用70-80%的专家时，达到了与传统混合专家模型相同的性能，显著提升了模型的扩展潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.28889', 'title': 'Policy-Mask: Budget-Aware Adaptation of Diffusion Features to Discriminative Tasks', 'url': 'https://huggingface.co/papers/2610.28889', 'abstract': 'Abstract Policy-Mask learns a budget-conditioned selection policy over diffusion timesteps, network blocks, and channels to extract compact, task-optimal features for discriminative vision tasks.  Generated by thinkingmachines/Inkling-Small Selecting intermediate features from a frozen diffusion model for discriminative tasks is non-trivial because the useful signal is distributed across the denoising trajectory, network depth, and channels. In practice, this requires choosing a timestep, a block, and a channel subset. Existing methods either fix these choices by hand or optimize only a few extraction hyperparameters, most often the timestep, then reuse the same rule across inputs and budgets. We introduce Policy-Mask, a budget-conditioned policy trained on the downstream objective that jointly selects all three under a prescribed channel budget. Without normalization, the channel-score contribution grows with the number of selected channels and dominates the timestep and block updates. We normalize it by subset cardinality, keeping the three policy heads on comparable scales and stabilizing joint training. At matched budgets, Policy-Mask improves over fixed extraction and feature-filter baselines across segmentation, classification, and semantic correspondence, reaching 38.9 mIoU on ADE20K, 75.4% top-1 on CIFAR-100 at 128 dimensions, and 76.3 PCK@0.1 on SPair-71k. Component-wise ablations show that block selection materially affects downstream accuracy, and the highest recorded channel-budget score occurs at 256 retained channels, identifying a practical operating point for compact diffusion representations. We further adapt Policy-Mask to diffusion transformers, including PixArt-Σ and SD3.5 MMDiT, by replacing U-Net channels with image-token hidden dimensions.', 'score': 24, 'issue_id': 3453, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'e509604313b7d74c', 'authors': ['Ivan Listopadov', 'Maksim Nakhodnov', 'Aibek Alanov'], 'affiliations': ['Constructor University', 'FusionBrain Lab', 'HSE University', 'MSU'], 'pdf_title_img': 'assets/pdf/title_img/2610.28889.jpg', 'data': {'categories': ['#optimization', '#cv', '#diffusion', '#architecture', '#training'], 'emoji': '🎯', 'ru': {'title': 'Умный выбор признаков из диффузии под заданный бюджет', 'desc': 'Статья представляет Policy-Mask — политику выбора признаков, зависящую от бюджета, которая совместно выбирает временной шаг диффузии, блок сети и подмножество каналов из замороженной диффузионной модели. Ключевая проблема в том, что полезный сигнал распределён по траектории денойзинга, глубине сети и каналам, а прежние методы фиксируют эти решения вручную или оптимизируют только timestep. Политика обучается по целевой задаче downstream, а нормализация вклада каналов по мощности подмножества стабилизирует совместное обучение трёх голов. Метод превосходит фиксированные и фильтрующие базовые подходы в сегментации, классификации и семантическом соответствии, а также адаптирован к диффузионным трансформерам вроде PixArt-Σ и SD3.5 MMDiT.'}, 'en': {'title': 'Optimizing Feature Selection with Policy-Mask', 'desc': 'Policy-Mask is a novel approach that learns to select optimal features from a frozen diffusion model for various vision tasks by conditioning on a budget. It addresses the challenge of extracting useful signals from different diffusion timesteps, network blocks, and channels, which are crucial for effective feature representation. Unlike traditional methods that fix parameters or optimize only a few, Policy-Mask dynamically selects all three aspects based on the task requirements. The method shows significant improvements in performance metrics across segmentation, classification, and semantic correspondence tasks, demonstrating its effectiveness in creating compact and efficient feature representations.'}, 'zh': {'title': '智能选择特征，提升视觉任务表现', 'desc': 'Policy-Mask 是一种学习预算条件选择策略的方法，旨在从扩散模型中提取紧凑且任务最优的特征，以用于区分性视觉任务。该方法通过选择扩散时间步、网络块和通道子集来优化特征提取，克服了现有方法手动固定选择或仅优化少量超参数的局限。Policy-Mask 在下游目标上进行联合训练，能够在给定通道预算的情况下同时选择这三者，从而提高了特征提取的效率和准确性。实验结果表明，Policy-Mask 在多个任务上均优于固定提取和特征过滤的基线方法，展示了其在紧凑扩散表示中的实际应用潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.26233', 'title': 'Heartbeat Thinking: Speculative Reasoning and Tool Execution While Listening in Realtime Voice Agents', 'url': 'https://huggingface.co/papers/2610.26233', 'abstract': 'Abstract A heartbeat-style speculative reasoning approach lets voice agents continue preparing tool calls during speech updates, improving coverage and reducing response latency.  Generated by thinkingmachines/Inkling-Small Tool-using voice agents often leave users waiting after speech ends, even when actionable information arrives earlier in the request. Speculative approaches begin work during speech, but chunk-bounded or interrupt-on-update generation can truncate a tool call before its arguments are complete. This couples computation time to speech updates, limiting useful work completed in advance. We introduce Heartbeat Thinking, which handles updated input through new Thinker invocations while allowing ongoing invocations and dispatched tools to finish. Periodic invocations read the latest partial transcript and a shared record of completed reasoning and tool results. These results help resolve missing arguments and initiate dependent calls, allowing preparation to progress across speech updates. Across SpeechFCEval, FDBench v3, and AudioCRAG, Heartbeat improves aggregate speculative tool coverage or retrieval reuse over a SHANKS-style windowed baseline, with benchmark-dependent effects on final task quality. On FDBench v3, it increases tool coverage by 16 percentage points and reduces mean final-response latency by 36.4\\%. The results show that heartbeat thinking paradigm preserving ongoing computation during speech can turn listening time into reusable preparation for faster and more capable voice-agent responses.', 'score': 18, 'issue_id': 3453, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '61bda6f3c49ad14b', 'authors': ['Zhenyu Zhang', 'Kewei Fu', 'Yongqi Tong', 'Chenzhi Zheng', 'Wei Wu', 'Jiang-Ming Yang', 'Jianshe Li'], 'affiliations': ['Ant International'], 'pdf_title_img': 'assets/pdf/title_img/2610.26233.jpg', 'data': {'categories': ['#audio', '#rag', '#reasoning', '#agents', '#benchmark'], 'emoji': '💓', 'ru': {'title': 'Пока пользователь говорит, агент уже думает и готовит ответ', 'desc': 'В статье предлагается метод Heartbeat Thinking для голосовых агентов, использующих инструменты (tool-using voice agents). Вместо прерывания генерации при каждом обновлении речи, система запускает новые вызовы Thinker по расписанию, читая актуальный частичный транскрипт и общий журнал завершённых рассуждений и результатов инструментов. Уже начатые вызовы и запущенные инструменты дорабатываются до конца, что позволяет заполнять недостающие аргументы и инициировать зависимые вызовы. На бенчмарках SpeechFCEval, FDBench v3 и AudioCRAG метод повышает покрытие спекулятивных вызовов инструментов и переиспользование результатов поиска по сравнению с базовым подходом SHANKS, а на FDBench v3 сокращает задержку ответа на 36.4%.'}, 'en': {'title': 'Heartbeat Thinking: Faster Responses for Voice Agents', 'desc': 'This paper presents a new approach called Heartbeat Thinking for voice agents that improves their ability to prepare tool calls while users are speaking. Traditional methods often leave users waiting because they only process information after speech ends, which can lead to delays. Heartbeat Thinking allows the voice agent to continue working on tasks even as new speech updates come in, ensuring that it can handle incomplete information more effectively. The results show significant improvements in tool coverage and reduced response times, making voice agents faster and more efficient in responding to user requests.'}, 'zh': {'title': '心跳思维：加速语音助手响应的创新方法', 'desc': '本文提出了一种心跳式的推测推理方法，使语音助手在语音更新期间能够继续准备工具调用，从而提高覆盖率并减少响应延迟。传统的推测方法在语音进行时开始工作，但由于生成过程的限制，可能会在参数未完整时中断工具调用。心跳思维通过新的思考者调用处理更新输入，同时允许正在进行的调用和已调度的工具完成。实验结果表明，心跳思维显著提高了工具覆盖率，并减少了最终响应的平均延迟，展示了在语音期间保持计算的能力可以加速语音助手的响应。'}}}, {'id': 'https://huggingface.co/papers/2610.28416', 'title': 'Code2Video-Compass: A Comprehensive Benchmark for General-Purpose Code-Based Video Generation across T2V, I2V, and V2V', 'url': 'https://huggingface.co/papers/2610.28416', 'abstract': 'Abstract Code2Video-Compass is a benchmark evaluating multimodal language models on code-based video generation across text, image, and video inputs, revealing significant challenges in complex dynamic and state-dependent tasks.  Generated by thinkingmachines/Inkling-Small Code-based video generation offers fine-grained control, targeted editing, and component reuse compared with direct video generation. This approach requires multimodal large language models (MLLMs) to translate visual and temporal requirements into executable programs that produce complete videos. However, existing code-based benchmarks primarily target specialized tasks, leaving complete video creation across diverse creative categories and input modalities insufficiently evaluated. We introduce Code2Video-Compass, a general-purpose benchmark for code-based video generation across text-to-video (T2V), image-to-video (I2V), and video-to-video (V2V) settings. Code2Video-Compass comprises 2,104 tasks spanning 10 categories, 24 subtypes, and three complexity dimensions covering construction, dynamic animation, and state dependency. It combines tasks curated from textual instructions and visual references with corresponding T2V, I2V, and V2V tasks derived from complete professional and user-created videos. We propose a dual-level evaluation framework combining 12 objective metrics and five subjective metrics. Objective evaluation covers operational performance, video quality, text-video alignment, and reference fidelity, while subjective evaluation uses an MLLM judge to evaluate instruction following and holistic video quality. Extensive evaluation of 15 recent proprietary and open-weight MLLMs from nine families reveals that even leading models face challenges in reliably generating high-quality complete videos aligned with textual and visual requirements, with performance generally declining as construction, dynamic animation, and state-dependency complexity increases. We anticipate that Code2Video-Compass will advance reliable, coherent, and controllable code-based video generation and inspire broader progress in programmatic visual creation.', 'score': 18, 'issue_id': 3453, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '5c0075448eab99ac', 'authors': ['Zhenghan Chen', 'Zekai Shao', 'Xin Lin', 'Leting Cheng', 'Siming Chen'], 'affiliations': ['Fudan University', 'Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2610.28416.jpg', 'data': {'categories': ['#multimodal', '#video', '#dataset', '#benchmark', '#plp'], 'emoji': '🎬', 'ru': {'title': 'Код становится видео: проверяем, насколько MLLM умеют программно создавать кино', 'desc': 'Статья представляет Code2Video-Compass — универсальный бенчмарк для оценки мультимодальных LLM (MLLM), которые генерируют видео через написание исполняемого кода. Он охватывает три режима: text-to-video (T2V), image-to-video (I2V) и video-to-video (V2V), включает 2104 задачи в 10 категориях и 24 подтипах с учётом сложности построения, динамической анимации и зависимости от состояния. Оценка двухуровневая: 12 объективных метрик (производительность, качество видео, соответствие тексту и верность референсу) и 5 субъективных, где MLLM выступает в роли судьи. Тестирование 15 современных моделей показало, что даже лидеры плохо справляются с созданием качественных видео, а качество падает с ростом сложности задач.'}, 'en': {'title': 'Advancing Code-Based Video Generation with Code2Video-Compass', 'desc': "Code2Video-Compass is a new benchmark designed to test multimodal language models on their ability to generate videos from code, using inputs like text, images, and existing videos. This method allows for precise control and editing of video content, which is more flexible than traditional video generation techniques. The benchmark includes a wide range of tasks that assess the models' performance in creating videos that are coherent and aligned with the provided instructions and visual cues. The findings indicate that even the best models struggle with complex video generation tasks, highlighting the need for further advancements in this area."}, 'zh': {'title': '推动代码视频生成的进步', 'desc': 'Code2Video-Compass 是一个基准测试，评估多模态语言模型在基于代码的视频生成任务中的表现。该基准涵盖文本到视频、图像到视频和视频到视频的多种输入方式，揭示了在复杂动态和状态依赖任务中存在的重大挑战。它包含2104个任务，跨越10个类别和24个子类型，结合了文本指令和视觉参考，旨在推动可靠且可控的代码视频生成。通过双层评估框架，我们发现即使是领先的模型在生成高质量完整视频时也面临困难，尤其是在复杂性增加时表现下降。'}}}, {'id': 'https://huggingface.co/papers/2610.19705', 'title': 'RouteWeaver: Weaving Mode Selection and Execution into Unified LLM Routing', 'url': 'https://huggingface.co/papers/2610.19705', 'abstract': 'Abstract RouteWeaver unifies heterogeneous LLM routing modes via coordinated training and progressive exploration, improving accuracy across diverse reasoning tasks.  Generated by thinkingmachines/Inkling-Small LLM routing dynamically selects and coordinates heterogeneous language models across diverse tasks. However, existing approaches are largely built around a predefined execution paradigm, such as single-round, multi-round, or agentic routing, which fixes how model calls are organized and limits adaptation to different query needs. We propose RouteWeaver, a unified routing framework that integrates these routing modes within a single LLM policy, jointly learning which mode to use and how to select models within that mode. To jointly optimize mode selection and within-mode execution, we develop COMET-GRPO (COordinated Mode-Execution Training), which decouples the trajectory-level advantage into separate signals for mode selection and within-mode execution, enabling more targeted credit assignment to each decision level. We further introduce progressive exploration, which gradually shifts training from externally assigned modes to autonomous selection, so that the router first learns how to execute each mode before deciding when to use it. We evaluate RouteWeaver across mathematics, coding, knowledge, logical reasoning, and factual recall. RouteWeaver achieves an average accuracy of 61.4%, an 11.03% relative improvement over the strongest baseline, and outperforms all compared baselines in each of the five domains. Ablations show that both COMET-GRPO and progressive exploration are important for adaptive routing; without progressive exploration, the routing policy collapses entirely to single-round execution.', 'score': 17, 'issue_id': 3453, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '375aac263f174d66', 'authors': ['Xiaohan Wang', 'Haozhen Zhang', 'Qingyuan Liu', 'Tao Feng', 'Wenya Wang'], 'affiliations': ['Huazhong University of Science and Technology', 'Nanyang Technological University', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.19705.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#agents', '#training', '#benchmark', '#rl'], 'emoji': '🧭', 'ru': {'title': 'Один маршрутизатор, все режимы: адаптивный выбор LLM под каждую задачу', 'desc': 'В статье представлен RouteWeaver — единая система маршрутизации, которая объединяет разные режимы работы LLM (одношаговый, многошаговый и агентный) в одной политике. Для совместной оптимизации выбора режима и выбора моделей внутри него авторы предлагают COMET-GRPO, которая разделяет advantage траектории на два отдельных сигнала. Прогрессивное исследование постепенно переводит обучение от заранее заданных режимов к автономному выбору, что помогает модели сначала освоить каждый режим. На тестах по математике, программированию, знаниям, логике и фактам RouteWeaver достигает средней точности 61.4%, что на 11.03% выше сильнейшего базового метода.'}, 'en': {'title': 'Unifying LLM Routing for Enhanced Task Performance', 'desc': 'RouteWeaver is a novel framework that enhances the performance of language models by integrating various routing strategies into a single policy. It allows for dynamic selection and coordination of different models based on the specific requirements of diverse reasoning tasks. The framework employs a training method called COMET-GRPO, which separates the decision-making process for selecting routing modes and executing tasks, improving the learning efficiency. Additionally, RouteWeaver incorporates progressive exploration to gradually transition from fixed routing modes to autonomous decision-making, leading to significant improvements in accuracy across multiple domains.'}, 'zh': {'title': '统一路由，提升推理准确性', 'desc': 'RouteWeaver 是一个统一的路由框架，通过协调训练和渐进探索来整合不同的 LLM 路由模式，从而提高在多种推理任务中的准确性。该框架能够动态选择和协调不同的语言模型，以适应各种任务需求。我们提出的 COMET-GRPO 方法可以优化模式选择和执行过程，使得每个决策层次的信用分配更加精准。通过渐进探索，RouteWeaver 逐步学习如何执行每种模式，然后再决定何时使用，从而实现更灵活的路由策略。'}}}, {'id': 'https://huggingface.co/papers/2610.31158', 'title': 'Beyond Watching and Searching: Benchmarking Agents for Video-centered Deep Research Reports', 'url': 'https://huggingface.co/papers/2610.31158', 'abstract': 'Abstract Researchers introduce a benchmark and evaluation framework for video-centered deep research agents that synthesize external evidence into interactive reports linked to video moments.  Generated by thinkingmachines/Inkling-Small Deep research agents synthesize open-web evidence into long reports, but current benchmarks do not evaluate research centered on a source video. We introduce Video-Centered Deep Research Report Generation. Given a video and user request, an agent identifies research questions, retrieves external multimodal evidence, and produces an interactive report linked to relevant video moments. This task has direct practical value because it helps users locate relevant moments, verify claims, reproduce demonstrated procedures, and make informed decisions from video content. We present a skill-based workflow and OmniDR-Bench for this task. For evaluation, we propose Omni Atomic Rubric Trees (Omni-ARTs). Each tree contains three dimensions, 23 shared directions, and task-specific atomic binary criteria. The directions test audiovisual grounding, multimodal evidence use, and interactive presentation. Audited Rubric Construction (ARC) builds these trees through independent evidence collection, automated checks, behavioral calibration, and iterative human review. OmniDR-Bench contains 50 Chinese and English tasks across 19 realworld subcategories. It includes 6,414 criteria. Across 18 agent configurations, the best system scores 63.3 out of 100. Current agents still need broader content coverage, stronger causal and logical analysis across modalities, and more accurate citation support. We further analyze models, harnesses, skill configurations, video categories, and research trajectories. The code and data are released at https://github.com/marinero4972/OmniDR-Bench.', 'score': 17, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'a1754a40f593730c', 'authors': ['Jiahao Meng', 'Qize Yang', 'Yuxuan Wang', 'Yunfei Chu', 'Wensi Dai', 'Jin Xu', 'Yunhai Tong'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Independent Researcher', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.31158.jpg', 'data': {'categories': ['#multimodal', '#rag', '#multilingual', '#dataset', '#agents', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Агент, который изучает видео и пишет по нему исследование с ссылками на моменты', 'desc': 'Авторы представляют новый бенчмарк OmniDR-Bench и систему оценки для задачи генерации исследовательских отчётов, где агент (deep research agent) опирается на исходное видео и подбирает внешние мультимодальные доказательства. Результатом становится интерактивный отчёт, ссылки в котором ведут на конкретные моменты видео. Для оценки предложены Omni-ARTs — деревья атомарных бинарных критериев, построенные процедурой ARC с независимым сбором данных, автоматическими проверками и итеративной разметкой людьми. Бенчмарк включает 50 задач на китайском и английском языках и 6414 критериев, а тестирование 18 конфигураций агентов показало лучший результат 63.3 балла из 100, что говорит о необходимости улучшения охвата контента, межмодального анализа и точности цитирования.'}, 'en': {'title': 'Revolutionizing Video Research with Interactive Reports', 'desc': "This paper presents a new framework for evaluating video-centered deep research agents that create interactive reports based on video content. The agents analyze a video and user queries to formulate research questions, gather external evidence, and generate reports that link findings to specific moments in the video. The proposed OmniDR-Bench includes a comprehensive set of tasks and criteria for assessing the agents' performance in areas like audiovisual grounding and multimodal evidence integration. The study highlights the need for improvements in content coverage and logical analysis, providing a foundation for future advancements in video-based research synthesis."}, 'zh': {'title': '视频中心深度研究报告生成的创新框架', 'desc': '本研究提出了一种基准和评估框架，用于视频中心的深度研究代理，这些代理能够将外部证据合成到与视频时刻相关的互动报告中。研究代理根据视频和用户请求，识别研究问题，检索多模态证据，并生成与相关视频时刻链接的互动报告。该任务具有直接的实际价值，帮助用户定位相关时刻、验证主张、重现演示过程，并从视频内容中做出明智决策。我们还提出了OmniDR-Bench和Omni Atomic Rubric Trees（Omni-ARTs）用于评估，涵盖了多种任务和标准。'}}}, {'id': 'https://huggingface.co/papers/2610.30418', 'title': 'Agent Mosaic: Recognizing Confidentiality Leaks in Agentic LLM Systems', 'url': 'https://huggingface.co/papers/2610.30418', 'abstract': 'Abstract LLM agents frequently leak sensitive conclusions assembled from multiple confidential documents, and common safeguards fail to eliminate this mosaic-style disclosure risk.  Generated by thinkingmachines/Inkling-Small Modern LLM agents can retrieve information from accessible documents, and then disclose a sensitive conclusion assembled from them. This mosaic effect creates a critical risk for agents opera
