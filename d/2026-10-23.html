-to-rig translation error by 13.4% relative to geometry-only training. We further use the predicted geometry and trajectories as priors for lidarless NuRec, supporting reconstruction of driving scenes for simulation.', 'score': 4, 'issue_id': 3453, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '87d8071582f3b678', 'authors': ['NVIDIA', ':', 'Sérgio Agostinho', 'Maximilian Apodaca', 'Emmanuel Attia', 'Guillem Braso', 'George Dong', 'Ilya Fedorov', 'Michele Fenzi', 'Gang Huang', 'Jiahui Huang', 'Shengyu Huang', 'Bingxin Ke', 'Laura Leal-Taixé', 'Kuan-Ting Lee', 'Mingxuan Liu', 'Tian Liu', 'Tim Meinhardt', 'Aljoša Ošep', 'Naveen Kumar Rai', 'Kefei Ren', 'Cristiano Saltori', 'Keqiang Wu', 'Ning Xu', 'Fei Xue', 'Jin-Bey Yu', 'Lei Zhang', 'Qunjie Zhou'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2610.30340.jpg', 'data': {'categories': ['#multimodal', '#synthetic', '#optimization', '#3d', '#cv', '#dataset', '#architecture', '#training', '#benchmark', '#data', '#video'], 'emoji': '🚗', 'ru': {'title': 'Одна модель для геометрии, объектов и 3D-сцены по видео с камер авто', 'desc': 'Foundation4D — это единая feed-forward модель, которая одновременно оценивает геометрию сцены, детектирует объекты, предсказывает семантическую occupancy и реконструирует Gaussians по видео с нескольких камер автомобиля. Общий backbone с факторизованным spatiotemporal attention эффективно объединяет наблюдения между камерами и во времени, а pose graph optimization уточняет траектории камеры и собирает треки объектов. Авторы также выпустили датасет PAI-Foundation4D с плотными разметками глубины и semantic occupancy для 1253 клипов. Совместное обучение детекции с геометрией и occupancy повышает mAP, а предсказанная геометрия служит приором для lidarless NuRec-реконструкции сцен для симуляции.'}, 'en': {'title': 'Unified Model for Enhanced 3D Understanding in Driving Videos', 'desc': "Foundation4D is a comprehensive machine learning model that integrates multiple tasks such as geometry estimation, object detection, semantic occupancy prediction, and Gaussian reconstruction from driving videos captured by multiple cameras. It employs a shared backbone with factorized spatiotemporal attention to effectively merge data from different cameras and time frames. The model's performance is enhanced through a video inference pipeline that optimizes camera trajectories and consolidates object tracking across various input segments. By fine-tuning on specific benchmarks, Foundation4D achieves leading results in depth estimation, object detection, and occupancy prediction, demonstrating the advantages of co-training different tasks for improved accuracy."}, 'zh': {'title': 'Foundation4D：多任务联合学习的前沿模型', 'desc': 'Foundation4D 是一个统一的前馈模型，能够同时估计几何形状、检测物体、预测语义占用和从多摄像头驾驶视频中重建高斯分布。该模型通过一个共享的骨干网络，利用分解的时空注意力高效地结合来自不同摄像头和时间的观察数据。我们还开发了数据标注管道，并发布了 PAI-Foundation4D 基准数据集，包含 1,253 个驾驶片段的密集深度和语义占用标签。通过基准特定的微调，Foundation4D 在多个基准测试中取得了最先进的结果，显示了检测与几何形状联合训练的优势。'}}}, {'id': 'https://huggingface.co/papers/2610.25835', 'title': 'Diffusion Language Models Change Speed Across Tasks and Languages', 'url': 'https://huggingface.co/papers/2610.25835', 'abstract': "Abstract Diffusion language models spend more computation on novel, rare, or incorrect outputs, and decoding speed can improve inference efficiency and reliability.  Generated by thinkingmachines/Inkling-Small Diffusion language models can write several tokens in one forward pass, and they decide during generation how many passes to spend. Two outputs of the same token length can therefore vary a lot in cost. To understand the underlying factors of this cost variation, we analyze two diffusion models across 10 tasks. We find that the number of forward passes per token depends heavily on the task. Text copied or lightly edited from the input is cheap, while open-ended writing is costly. In DiffusionGemma, generating a token for story writing requires more than three times as many forward passes as for grammar correction. Two output properties explain much of this gap: how much of it is new relative to the input, and how rare its words are within the task. The same holds within a single response when thinking is involved. The final answer is cheap when it repeats the model's reasoning trace and costly when it adds something new. In multilingual generation, we find that highly tokenized languages also require more passes per token, adding to the cost they already pay with more tokens. Finally, cost tracks correctness: on the same math problem, wrong answers take more passes per token than correct ones, and weighting candidate answers by decoding speed beats majority voting by up to 4.2 points at no extra cost. Taken together, our results show that diffusion's computational advantage depends on how much of the output is already determined, while its decoding effort offers a practical signal for making inference more efficient and reliable.", 'score': 3, 'issue_id': 3457, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '9a6d7a56b7579118', 'authors': ['Mohsen Fayyaz', 'Ali Modarressi', 'Daniel Israel', 'Lucas Bandarkar', 'Nanyun Peng'], 'affiliations': ['CIS, LMU Munich', 'Munich Center for Machine Learning', 'University of California, Los Angeles'], 'pdf_title_img': 'assets/pdf/title_img/2610.25835.jpg', 'data': {'categories': ['#low_resource', '#diffusion', '#interpretability', '#multilingual', '#reasoning', '#hallucinations', '#machine_translation', '#inference', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Сложность генерации выдаёт правильность ответа: чем дороже текст, тем он менее предсказуем', 'desc': 'В статье исследуется, сколько вычислений (forward passes на токен) тратят diffusion language models при генерации текста. Авторы показывают, что стоимость сильно зависит от задачи: копирование и лёгкое редактирование дешевле, а свободное письмо дороже, и эту разницу объясняют новизна и редкость слов. Также выявлено, что неправильные ответы требуют больше проходов, чем правильные, поэтому взвешивание ответов по скорости декодирования превосходит majority voting до 4.2 пункта без дополнительных затрат. Работа показывает, что вычислительное преимущество diffusion зависит от того, насколько результат уже определён входом, а сама стоимость декодирования может служить полезным сигналом для повышения эффективности и надёжности инференса.'}, 'en': {'title': 'Optimizing Diffusion Models for Efficient Text Generation', 'desc': 'This paper investigates how diffusion language models allocate computational resources during text generation. It reveals that the cost of generating tokens varies significantly based on the task, with tasks involving novel content requiring more computational passes. The study identifies key factors influencing this cost, such as the novelty of the output and the rarity of the words used. Additionally, it demonstrates that optimizing decoding speed can enhance inference efficiency and reliability, particularly in tasks like multilingual generation and problem-solving.'}, 'zh': {'title': '扩散模型：效率与可靠性的平衡', 'desc': '扩散语言模型在生成新颖、稀有或不正确的输出时消耗更多计算资源，因此解码速度可以提高推理效率和可靠性。通过分析两个扩散模型在10个任务中的表现，我们发现每个标记的前向传递次数与任务密切相关。文本复制或轻微编辑的生成成本较低，而开放式写作则成本较高。我们的研究表明，输出的成本与其新颖性和词汇稀有性密切相关，且在多语言生成中，高度标记化的语言需要更多的前向传递，进一步增加了成本。'}}}, {'id': 'https://huggingface.co/papers/2610.27148', 'title': 'Who Takes the Lead? Model Ability and Task-Conditioned Collaboration with Humans', 'url': 'https://huggingface.co/papers/2610.27148', 'abstract': "Abstract Researchers use a shared-control maze to show that stronger language-model agents selectively involve humans based on route advantage rather than failing to collaborate.  Generated by thinkingmachines/Inkling-Small As language-model agents grow more capable, they can carry more of a task without asking anyone for help. Falling reliance on a human partner is easy to read as a failure of collaboration when it may instead be a correct division of labor, and the rate of human involvement alone cannot tell the two apart. We study this systematically by placing an agent and a person under a shared objective while varying who holds the advantage: the human has a clear advantage, neither does, or the agent does. To obtain this control, we introduce a shared-control maze, in which an agent-controlled and a human-controlled avatar share the objective of reaching a common target in as few team turns as possible. The agent allocates each team turn between acting itself and handing the move to the person, and initial placement sets the human's shortest-path advantage while the task is otherwise unchanged. We evaluate GPT~5.6~Sol, Command~A+, Qwen~3.8~27B, and Command~R, first measuring solo capability with a single avatar and full-map observability, then running co-play with human participants across the three advantage conditions. Across the four models, stronger solo performance is associated with selective, route-conditioned human involvement: the models that solve the maze reliably on their own act for themselves almost without exception when the human holds no advantage, and involve the human on roughly 80% of initial decisions when the human route is shorter. Command R, the model with substantially weaker solo performance, shows no such selectivity.", 'score': 3, 'issue_id': 3455, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '7f32921a9dbe611d', 'authors': ['Weien Li', 'Haochen Liu', 'Zeyu Li', 'Rui Song', 'Zixuan Dong', 'Ye Yuan'], 'affiliations': ['MIT - Massachusetts Institute of Technology', 'McGill University', 'Mila - Quebec AI Institute', 'University of Cambridge', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2610.27148.jpg', 'data': {'categories': ['#multimodal', '#agents', '#agi', '#benchmark', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Умный агент знает, когда передать ход человеку', 'desc': 'Авторы исследуют, как сильные LLM-агенты распределяют ходы между собой и человеком в совместной задаче. Используется shared-control maze, где агент и человек управляют двумя аватарами с общей целью. Варьируется преимущество по кратчайшему пути: у человека, ни у кого или у агента. Результаты показывают, что более сильные модели избирательно привлекают человека в зависимости от маршрута, а не из-за неспособности к кооперации, тогда как слабая модель такой избирательности не демонстрирует.'}, 'en': {'title': 'Smart Agents Collaborate Selectively Based on Advantage', 'desc': 'This paper investigates how advanced language-model agents interact with human partners in a shared-control maze scenario. The study reveals that these agents strategically involve humans based on the advantage of the route, rather than simply relying on them due to a lack of capability. By manipulating the conditions of advantage, the researchers demonstrate that stronger models tend to act independently when they have no advantage, while they actively engage humans when the human has a shorter path. This highlights the importance of understanding collaboration dynamics in human-agent interactions, as reliance on human input can indicate effective task division rather than failure to collaborate.'}, 'zh': {'title': '语言模型的选择性合作与任务分工', 'desc': '本研究探讨了语言模型代理在共享控制迷宫中的表现，显示出更强的语言模型能够根据路线优势选择性地涉及人类，而不是简单地依赖人类合作。研究表明，代理在任务中逐渐减少对人类的依赖并不意味着合作失败，而可能是合理的劳动分工。通过设置不同的优势条件，研究人员观察了代理和人类在共同目标下的互动。结果显示，表现更强的模型在没有人类优势时几乎完全自主行动，而在有优势时则会选择性地涉及人类。'}}}, {'id': 'https://huggingface.co/papers/2610.04184', 'title': 'EvalResearchBench: Can AI Agents Build Their Own Feedback for Recursive Self-Improvement?', 'url': 'https://huggingface.co/papers/2610.04184', 'abstract': 'Abstract AI agents can automate benchmark design to reduce evaluation costs, but their generated evaluators still fall short of target agreement and suffer from budget exhaustion and score dominance issues.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement (RSI) relies on evaluation feedback to assess progress and guide further research, yet repeatedly running complex benchmarks is costly and slows iteration. Human experts reduce this cost by selecting benchmark subsets or designing compact suites. We ask whether AI agents can automate this design process and introduce EvalResearchBench (ERB), a benchmark for autonomous evaluation research. Given target materials, development references, candidate APIs, and fixed time and API budgets, an agent called the researcher selects or synthesizes tasks, implements graders, and revises them in pilot tests before freezing an executable evaluator for coding, co-work, and reasoning. We study 9 researchers and 13 candidate models and compare each frozen evaluator with 14 target benchmarks on score concordance and pairwise agreement. The best evaluators order about 75\\% of candidate pairs as the targets do, below the 91\\% ceiling set by disagreements among the targets. No researcher leads on every metric, and the best evaluator on development targets is not the best on sealed targets hidden from the researcher. A human-designed sample of public tasks remains a strong baseline, and the evaluator with the lowest recorded execution cost attains the highest pairwise agreement. Agents repair tasks and graders through pilot feedback, yet their evaluators can still truncate answers, exhaust the evaluation budget, or let a few questions dominate a domain score.', 'score': 2, 'issue_id': 3458, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '7c7aabfe1d547617', 'authors': ['Yaolun Zhang', 'Tianyi Xu', 'Yujie Zhao', 'Jishen Zhao', 'Qingyun Wu', 'Huazheng Wang'], 'affiliations': ['AG2 AI', 'Oregon State University', 'Pennsylvania State University', 'University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.04184.jpg', 'data': {'categories': ['#agi', '#benchmark', '#agents', '#survey'], 'emoji': '🧪', 'ru': {'title': 'AI-агенты умеют строить бенчмарки, но пока не сравняются с людьми', 'desc': 'Статья показывает, что AI-агенты способны автоматизировать создание бенчмарков для оценки LLM, что важно для рекурсивного самоулучшения (RSI), где частые дорогие прогоны тестов замедляют итерации. Авторы представляют EvalResearchBench (ERB) — бенчмарк, в котором агент-исследователь отбирает или синтезирует задачи, пишет graders и проверяет их на пилотных тестах при фиксированных бюджетах времени и API. Лучшие построенные оценщики согласуют порядок пар моделей примерно в 75% случаев, что ниже потолка в 91%, заданного расхождением между самими целевыми бенчмарками. Человеческая выборка публичных задач остаётся сильным baseline, а при этом агенты всё ещё допускают обрезание ответов, исчерпание бюджета и доминирование нескольких вопросов в оценке домена.'}, 'en': {'title': 'Automating Benchmark Design with AI: Progress and Challenges', 'desc': 'This paper discusses the challenges faced by AI agents in automating the design of evaluation benchmarks for machine learning models. It introduces EvalResearchBench (ERB), a framework that allows AI agents to autonomously select and synthesize tasks, implement grading systems, and refine them based on pilot tests. The study evaluates the performance of these AI-generated evaluators against established benchmarks, revealing that while they can achieve reasonable agreement, they still struggle with issues like budget exhaustion and score dominance. Ultimately, the findings suggest that human-designed benchmarks still provide a strong baseline for evaluation, highlighting the need for further improvements in AI-generated evaluators.'}, 'zh': {'title': 'AI代理助力基准设计的自动化', 'desc': '本文探讨了人工智能代理在自动化基准设计中的应用，以降低评估成本。尽管生成的评估者在目标一致性方面仍存在不足，并面临预算耗尽和分数主导等问题，研究者们提出了EvalResearchBench（ERB）作为一个用于自主评估研究的基准。该代理能够选择或合成任务，实施评分器，并在试点测试中进行修订，从而优化评估过程。研究表明，尽管AI代理在某些指标上表现良好，但仍需人类专家的设计样本作为强有力的基线。'}}}, {'id': 'https://huggingface.co/papers/2610.28950', 'title': 'HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second', 'url': 'https://huggingface.co/papers/2610.28950', 'abstract': 'Abstract HyperDrone is a GPU-accelerated quadrotor simulator using a ray-tracing engine to render high-fidelity observations at high speed, enabling vision-based policy training and real-world transfer.  Generated by thinkingmachines/Inkling-Small We present HyperDrone, an extremely fast quadrotor simulator focused on high-performance batch rendering that is more than 20x faster than existing state-of-the-art batch quadrotor simulators. HyperDrone combines highly optimized multirotor dynamics with HyperLux, a new ray-tracing engine that supports Nvidia OptiX, Vulkan, Apple Metal and WebGPU backends that takes full advantage of modern ray-tracing hardware, capable of running both components entirely on the GPU. HyperLux renders RGB, depth, semantic/instance segmentation, surface normals and optical flow observations at configurable levels of fidelity, including reflections, realistic lighting, motion blur, anti-aliasing, and Physically Based Rendering (PBR). Even in the highest-fidelity settings, HyperLux achieves millions of Frames Per Second (FPS) on consumer-grade GPUs while rendering realistic 3D scenes. We demonstrate the merits of HyperDrone by training a vision-based yaw-control policy purely in simulation and transferring it to a real small-scale quadrotor (Crazyflie) with a camera, running completely onboard.', 'score': 2, 'issue_id': 3455, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': 'b749c2423b7049b9', 'authors': ['Jonas Eschmann', 'Giuseppe Loianno'], 'affiliations': ['University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.28950.jpg', 'data': {'categories': ['#dataset', '#cv', '#rl', '#inference', '#3d', '#games', '#robotics'], 'emoji': '🚁', 'ru': {'title': 'Миллионы кадров в секунду: обучай дроны в симуляции и летай в реальности', 'desc': 'В статье представлен HyperDrone — GPU-ускоренный симулятор квадрокоптеров, который более чем в 20 раз быстрее существующих аналогов для пакетной обработки. Ядро системы — движок ray-tracing HyperLux, работающий на OptiX, Vulkan, Metal и WebGPU и генерирующий RGB, depth, семантическую сегментацию, нормали и optical flow с реалистичным освещением и PBR. Даже при максимальной детализации движок достигает миллионов кадров в секунду на потребительских GPU. Авторы показали, что vision-based политика управления yaw, обученная только в симуляции, успешно переносится на реальный миниатюрный квадрокоптер Crazyflie с камерой.'}, 'en': {'title': 'Accelerating Quadrotor Simulation with HyperDrone', 'desc': 'HyperDrone is a cutting-edge quadrotor simulator that utilizes a ray-tracing engine to produce high-quality visual outputs rapidly. It is designed to be over 20 times faster than current leading simulators, allowing for efficient vision-based policy training. The simulator leverages advanced GPU capabilities to render various types of observations, including RGB images and depth maps, with high fidelity and realism. This technology enables effective transfer of learned policies from simulation to real-world applications, exemplified by training a yaw-control policy for a small quadrotor.'}, 'zh': {'title': '超高速四旋翼模拟器HyperDrone', 'desc': 'HyperDrone是一种基于GPU加速的四旋翼模拟器，使用光线追踪引擎以高速度渲染高保真观察，支持基于视觉的策略训练和现实世界的迁移。它的性能比现有的四旋翼模拟器快20倍以上，结合了高度优化的多旋翼动力学和新的光线追踪引擎HyperLux。HyperLux能够在现代光线追踪硬件上运行，支持多种后端，并以可配置的保真度渲染RGB、深度、语义/实例分割等观察。通过在模拟中训练基于视觉的偏航控制策略，并将其迁移到真实的小型四旋翼上，HyperDrone展示了其优越性。'}}}, {'id': 'https://huggingface.co/papers/2610.22951', 'title': 'MambaAct: Efficient Mamba Action Experts for Flow-Matching Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.22951', 'abstract': 'Abstract MambaAct replaces the transformer action expert in flow-matching VLA policies with a compact Mamba-based expert and a context compressor to cut inference latency while improving robotic manipulation success.  Generated by thinkingmachines/Inkling-Small Vision-language-action (VLA) models have shown strong promise for generalist robotic manipulation, but their inference cost remains a major bottleneck for real-time control. This limitation is especially pronounced in flow-matching VLAs such as π_{0.5}, where the action expert is evaluated repeatedly during iterative denoising. We introduce MambaAct, an efficient Mamba action expert for flow-matching VLA policies. MambaAct retains the pretrained visual-language prefix encoder of π_{0.5}, while replacing its transformer-based action expert with a compact Mamba-based action expert. Within this expert, Mamba serves as the action mixer that models dependencies across the noisy continuous-action sequence. To preserve visual-language conditioning without repeated token-level cross-attention, MambaAct uses a lightweight Context Compressor to map Vision-language model (VLM) prefix tokens into a compact conditioning signal that gates and modulates each Mamba action block. MambaAct uses a 10times smaller action expert and reduces flow-matching denoising latency by 64.8% on LIBERO and 58.8% in real-world deployment, while improving mean LIBERO success by 1.08 percentage points across three independent fine-tuning seeds and maintaining gains on LIBERO-Plus and real-world benchmarks. Our code and model weights are publicly available at https://github.com/giakhuyendihoc/MambaAct.', 'score': 2, 'issue_id': 3454, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '38982135b6522c9e', 'authors': ['Khuyen Pham', 'Tran Nguyen Le', 'Edoardo Fazzari', 'Cesare Stefanini'], 'affiliations': ['Ho Chi Minh City University of Technology', 'Ho Chi Minh City, Vietnam', 'Vietnam National University, Ho Chi Minh City'], 'pdf_title_img': 'assets/pdf/title_img/2610.22951.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#optimization', '#robotics', '#inference', '#open_source', '#architecture'], 'emoji': '🐍', 'ru': {'title': 'Быстрее думать, точнее действовать: Mamba ускоряет роботов', 'desc': 'Авторы предлагают MambaAct — эффективный action expert для flow-matching VLA-политик, который заменяет трансформер в действующей части модели на компактный Mamba-блок. Mamba моделирует зависимости внутри зашумлённой последовательности непрерывных действий, а визуально-языковой префикс сжимается в компактный сигнал через Context Compressor, который модулирует каждый блок. Благодаря action expert, который в 10 раз меньше, задержка денойзинга уменьшается на 64.8% в LIBERO и на 58.8% в реальных экспериментах. При этом средний успех на LIBERO растёт на 1.08 п.п., что подтверждается тремя независимыми сидами обучения.'}, 'en': {'title': 'MambaAct: Speeding Up Robotic Manipulation with Compact Action Experts', 'desc': 'MambaAct is a new approach that enhances flow-matching vision-language-action (VLA) policies by introducing a compact Mamba-based action expert. This method significantly reduces inference latency while improving the success rate of robotic manipulation tasks. By replacing the traditional transformer action expert with a more efficient Mamba expert and utilizing a Context Compressor, MambaAct maintains effective visual-language conditioning without the need for extensive cross-attention. The results show a substantial decrease in latency and an increase in performance, making it a promising solution for real-time robotic applications.'}, 'zh': {'title': 'MambaAct：提升机器人操作效率的创新方案', 'desc': 'MambaAct是一种高效的动作专家，旨在提高流匹配视觉语言行动（VLA）策略的机器人操作成功率，同时降低推理延迟。它通过用紧凑的Mamba动作专家替换传统的变压器动作专家，并引入上下文压缩器来优化性能。MambaAct保留了预训练的视觉语言前缀编码器，并通过轻量级的上下文压缩器将视觉语言模型的前缀标记映射为紧凑的条件信号，从而减少了流匹配去噪的延迟。实验结果表明，MambaAct在多个基准测试中显著提高了成功率，并减少了推理时间。'}}}, {'id': 'https://huggingface.co/papers/2610.30468', 'title': 'SplatLab: Autonomous Scientific Discovery for 3DGS Research', 'url': 'https://huggingface.co/papers/2610.30468', 'abstract': "Abstract SplatLab autonomously reproduces 3D Gaussian Splatting baselines, proposes extensions, and writes manuscripts with fully traceable training logs, improving PSNR by up to 3.78 dB.  Generated by thinkingmachines/Inkling-Small Reproducing a published 3DGS paper takes weeks of expert engineering before any extension can be proposed. Prior autonomous-research systems read papers, draft hypotheses, and write code, but are limited by short fixed templates, low executability, and weak traceability, and none has been demonstrated end-to-end in a live computer-vision subfield with intense activity. SplatLab is an autonomous research system for 3D Gaussian Splatting that addresses these limitations. Given a research prompt, a target-paper URL, or no input at all, it reproduces a published baseline, proposes an extension, trains and ablates across Mip-NeRF 360 and LLFF, writes the manuscript, and binds every reported number to a logged training run. Five design choices distinguish it: (i) candidates mutate plugins from a verified-reproduction backbone matched to published baselines; (ii) a cascade-weighted Elo tournament across eight islands scores candidates on measured GPU PSNR with verbal-gradient feedback; (iii) a standing falsifier subtracts Elo on failure, integrating stress-test survival into selection; (iv) every reported number is bound to a logged training run, and the run cannot terminate while any claim is unbacked; (v) a seven-category 3DGS taxonomy wraps EVOLVE-BLOCK markers in domain-aligned scaffolds transferable across 3DGS repositories. On PSNR-targeted runs, SplatLab's manuscripts beat their reproduced targets by +0.18 to +3.78 dB, including +3.78 dB on astrophotographic nebula rendering, for which no prior 3DGS method exists. The research cycle compresses from months of graduate-student time to days of mostly autonomous compute. Code, all manuscripts, experiment ledgers, and the cross-run paper store are available on the project page.", 'score': 2, 'issue_id': 3454, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': 'f3ab2629219cc02f', 'authors': ['Seemandhar Jain', 'Manmohan Chandraker'], 'affiliations': ['University of California San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.30468.jpg', 'data': {'categories': ['#agents', '#benchmark', '#optimization', '#training', '#cv', '#3d', '#science', '#agi'], 'emoji': '🔬', 'ru': {'title': 'Автономный исследователь 3D-рендеринга: от воспроизведения до статьи за дни', 'desc': 'SplatLab — это автономная исследовательская система для 3D Gaussian Splatting, которая сама воспроизводит опубликованные базовые методы и предлагает их расширения. Она оценивает кандидатов через Elo-турнир на реальных измерениях PSNR, а также использует «фальсификатор», снижающий рейтинг при провале стресс-тестов. Каждое число в статье привязано к логу обучения, поэтому результаты полностью прослеживаемы. В итоге цикл исследования сокращается с месяцев работы аспиранта до нескольких дней почти автономных вычислений, а на отдельных задачах метод улучшает PSNR до +3.78 dB.'}, 'en': {'title': 'Revolutionizing 3D Gaussian Splatting with Autonomous Research', 'desc': 'SplatLab is an autonomous research system designed for 3D Gaussian Splatting that significantly streamlines the research process. It can reproduce existing baselines, propose new extensions, and generate manuscripts with complete training logs, enhancing performance metrics like PSNR by up to 3.78 dB. Unlike previous systems, SplatLab operates end-to-end in a dynamic computer vision field, overcoming limitations in template rigidity and traceability. Its innovative design includes a mutation-based candidate selection, a scoring tournament for performance evaluation, and a robust logging system that ensures all results are verifiable and backed by training runs.'}, 'zh': {'title': 'SplatLab：自动化的 3D 高斯点云研究系统', 'desc': 'SplatLab 是一个自主研究系统，专注于 3D 高斯点云的重现和扩展。它能够根据研究提示或目标论文 URL 自动重现已发布的基线，并提出扩展方案，同时记录每次训练的日志。该系统通过五个设计选择提高了研究的可执行性和可追溯性，显著提升了 PSNR 性能。SplatLab 将研究周期从几个月缩短到几天，极大地提高了计算效率。'}}}, {'id': 'https://huggingface.co/papers/2610.25376', 'title': 'TILDE: Teacher-in-the-Loop Distillation from Embodied Foundation Models', 'url': 'https://huggingface.co/papers/2610.25376', 'abstract': "Abstract TILDE distills embodied foundation model capabilities into robot policies via on-policy teacher supervision and autonomous recovery data collection, improving real-world task performance without large-scale action pretraining.  Generated by thinkingmachines/Inkling-Small Large-scale action pretraining equips Embodied Foundation Models (EFMs) with strong manipulation capabilities, with particular strengths in generalization and closed-loop robustness, but reproducing such pretraining requires substantial robot data and computation. To transfer these capabilities from pretrained EFMs to policies without action pretraining, we introduce TILDE (Teacher-In-the-Loop Distillation from EFMs), which synergizes on-policy distillation at student-induced states with learning from teacher-executed recovery trajectories. We further propose AutoDAgger, an autonomous data aggregation pipeline in which a robotic reward model is utilized to monitor task progress and trigger teacher intervention, thereby collecting recovery experience without human monitoring or manual control. AutoDAgger accelerates recovery-trajectory collection by more than 2times compared with the human-in-the-loop method. By unifying learning from demonstrations, on-policy teacher supervision, and teacher's corrective behavior, TILDE improves task performance by up to 4.1times over behavior cloning across three real-world tasks and supports effective cross-architecture distillation.", 'score': 2, 'issue_id': 3453, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '5257d1391b290f3e', 'authors': ['Yuxiang Lu', 'Yantong Liu', 'Jinghua Hou', 'Xueli Sun', 'Ruihua Han', 'Zhe Liu', 'Hengshuang Zhao'], 'affiliations': ['The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.25376.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Учитель в цикле: роботы учатся на ошибках и восстанавливаются сами', 'desc': 'В статье представлен метод TILDE, который переносит возможности предобученных Embodied Foundation Models (EFM) в политики роботов без дорогостоящего предобучения на действиях. Ключевая идея сочетает on-policy дистилляцию на состояниях, порождённых самим студентом, с обучением на траекториях восстановления, выполненных учителем. Для сбора таких траекторий предложен AutoDAgger, в котором робототехническая reward model автоматически отслеживает прогресс задачи и запускает вмешательство учителя без участия человека. Метод ускоряет сбор данных более чем в 2 раза и улучшает качество выполнения задач до 4.1 раза по сравнению с behavior cloning на трёх реальных задачах.'}, 'en': {'title': 'Enhancing Robot Learning with TILDE: Efficient Knowledge Transfer Without Extensive Pretraining', 'desc': 'The paper introduces TILDE, a method that enhances robot policies by leveraging the capabilities of Embodied Foundation Models (EFMs) without the need for extensive action pretraining. TILDE employs on-policy teacher supervision and collects autonomous recovery data to improve real-world task performance. It also features AutoDAgger, a system that uses a robotic reward model to efficiently gather recovery experiences, significantly speeding up data collection. Overall, TILDE demonstrates a substantial increase in task performance and supports effective knowledge transfer across different robotic architectures.'}, 'zh': {'title': 'TILDE：提升机器人任务表现的新方法', 'desc': 'TILDE是一种新方法，它通过教师监督和自主数据收集，将具身基础模型的能力转化为机器人策略，从而提高实际任务的表现，而无需大规模的动作预训练。该方法结合了在学生诱导状态下的在线蒸馏和教师执行的恢复轨迹学习。我们还提出了AutoDAgger，一个自主数据聚合管道，利用机器人奖励模型监控任务进展并触发教师干预，从而在没有人工监控的情况下收集恢复经验。通过统一演示学习、在线教师监督和教师的纠正行为，TILDE在三个实际任务中将任务表现提高了多达4.1倍。'}}}, {'id': 'https://huggingface.co/papers/2610.26252', 'title': 'SEAM: Spectral Embedding Alignment and Merging for Low-Resource TTS', 'url': 'https://huggingface.co/papers/2610.26252', 'abstract': 'Abstract SEAM initializes unseen token embeddings from subtokens via spectral filtering and ridge regression, reducing training data needs by 75% for low-resource text-to-speech vocabulary expansion.  Generated by thinkingmachines/Inkling-Small Expanding the vocabulary of conditional text-to-speech (TTS) models typically requires extensive fine-tuning with paired audio, creating a major bottleneck for low-resource and cross-lingual adaptation. To address this, we introduce SEAM, a zero-audio initialization method that constructs embeddings for unseen tokens from known subtokens. Unlike standard pooling strategies that ignore sequential structure, SEAM applies a spectral filter to preserve temporal phonetic order and uses closed-form ridge regression to align the new embeddings with the pretrained conditioning manifold. Across three languages and two TTS architectures, SEAM approaches or matches baseline performance using up to four times less training data, reducing sample complexity by 75\\% compared to random initialization and mean pooling. Our approach provides a lightweight, reproducible, and theoretically grounded solution for vocabulary expansion in low-resource speech synthesis.', 'score': 2, 'issue_id': 3453, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'd515ddc7d2b7c2d7', 'authors': ['Walaa Othman', 'Baher Mohammad', 'Stamatios Lefkimmiatis', 'Ammar Ali'], 'affiliations': ['ITMO University', 'MWS AI', 'SPC RAS'], 'pdf_title_img': 'assets/pdf/title_img/2610.26252.jpg', 'data': {'categories': ['#audio', '#machine_translation', '#multilingual', '#training', '#low_resource'], 'emoji': '🗣️', 'ru': {'title': 'Новые слова для синтеза речи без аудио: меньше данных, та же точность', 'desc': 'В статье представлен метод SEAM для расширения словаря моделей синтеза речи (TTS) без аудиоданных. Новые токены получают эмбеддинги из уже известных субтокенов с помощью спектрального фильтра, который сохраняет порядок фонетических единиц, и ridge regression в замкнутой форме, выравнивающей их с предобученным conditioning manifold. На трёх языках и двух архитектурах TTS SEAM достигает качества базовой модели, используя до четырёх раз меньше обучающих данных, что снижает sample complexity на 75% по сравнению со случайной инициализацией и mean pooling. Подход легковесен, воспроизводим и теоретически обоснован, что делает его удобным решением для low-resource синтеза речи.'}, 'en': {'title': 'SEAM: Efficient Vocabulary Expansion for TTS with Minimal Data', 'desc': 'The paper introduces SEAM, a novel method for initializing token embeddings in text-to-speech (TTS) systems without requiring paired audio data. By utilizing spectral filtering and ridge regression, SEAM effectively constructs embeddings for unseen tokens from known subtokens, preserving the phonetic order. This approach significantly reduces the amount of training data needed by 75%, making it particularly beneficial for low-resource and cross-lingual TTS applications. The results demonstrate that SEAM can achieve performance comparable to traditional methods while requiring much less data, thus addressing a key challenge in speech synthesis.'}, 'zh': {'title': 'SEAM：低资源语音合成的高效词汇扩展方法', 'desc': 'SEAM是一种用于扩展文本到语音（TTS）模型词汇的方法，它通过光谱过滤和岭回归从已知的子词生成未见词的嵌入。这种方法减少了对配对音频的需求，使得低资源环境下的词汇扩展变得更加高效。与传统的池化策略不同，SEAM保留了时间上的音素顺序，从而提高了嵌入的质量。通过在三种语言和两种TTS架构上的实验，SEAM在使用更少训练数据的情况下，达到了与基线相当的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.31474', 'title': 'Skeleton-Grounded Latent Action Model for Robot World Models', 'url': 'https://huggingface.co/papers/2610.31474', 'abstract': 'Abstract SkeLAM decomposes latent actions into skeleton-guided kinematic and residual components to improve controllable robot world modeling and motion transfer.  Generated by thinkingmachines/Inkling-Small Robot world models simulate how environments evolve in response to robot actions. Latent action models enable learning dynamics from videos by encoding visual transitions as proxy actions. However, reconstruction-driven latent actions mix robot motion with object responses and other scene changes, complicating their correspondence with robot controls. We propose SkeLAM, a skeleton-guided latent action model for controllable robot world modeling. SkeLAM decomposes latent actions into a kinematic component grounded by robot skeleton supervision and a residual component retaining complementary visual dynamics. Cross-modal swap reconstruction encourages RGB-derived and skeleton-derived kinematic representations to be interchangeable during video reconstruction. The world model incorporates both components through separate conditioning pathways, while branch dropout reduces its dependence on future-derived residual information. A lightweight adapter maps robot actions to the kinematic space, and subsequent world-model fine-tuning adapts generation to these predicted conditions. At inference, the model generates future observations from the current observation and robot actions. On DROID, SkeLAM reduces end-effector ADE by 19.5% and LPIPS by 11.1% compared with DreamDojo. Motion probing supports kinematic specialization, while qualitative results demonstrate zero-shot human-to-robot motion transfer in generated rollouts. Policy evaluation shows agreement between predicted success rates and those measured in real robot executions.', 'score': 2, 'issue_id': 3453, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': 'e33b8cf644ae1718', 'authors': ['Qi Lv', 'Jiayi Lin', 'Yuxin Jiang', 'Jianzong Wang', 'Xiang Deng', 'Mike Shou Zheng'], 'affiliations': ['HIT (Shenzhen)', 'Ping An Tech', 'Show Lab, NUS'], 'pdf_title_img': 'assets/pdf/title_img/2610.31474.jpg', 'data': {'categories': ['#diffusion'], 'emoji': '🦾', 'ru': {'title': 'Разделяй движение робота и мир вокруг, чтобы управлять симуляцией точнее', 'desc': 'Статья представляет SkeLAM — модель латентных действий, направляемая скелетом робота, которая разделяет латентные действия на кинематическую компоненту (опирающуюся на скелетную supervision) и остаточную компоненту с дополнительной визуальной динамикой. Для повышения взаимозаменяемости представлений используется cross-modal swap reconstruction, а world model учитывает обе компоненты через отдельные пути conditioning и branch dropout. На бенчмарке DROID SkeLAM снижает ADE конечного эффектора на 19.5% и LPIPS на 11.1% по сравнению с DreamDojo, а также демонстрирует zero-shot перенос движений человека на робота. Оценка политик показывает согласованность предсказанных и реальных показателей успешности.'}, 'en': {'title': 'SkeLAM: Enhancing Robot Control through Skeleton-Guided Action Decomposition', 'desc': "SkeLAM is a novel model that enhances robot world modeling by breaking down latent actions into two parts: a kinematic component guided by the robot's skeleton and a residual component that captures additional visual dynamics. This separation allows for clearer control over robot movements and better simulation of how environments react to these actions. By using cross-modal swap reconstruction, SkeLAM ensures that both RGB and skeleton data can be used interchangeably, improving the accuracy of video reconstructions. The model has shown significant improvements in performance metrics, demonstrating its effectiveness in enabling robots to predict and execute actions more accurately in real-world scenarios."}, 'zh': {'title': 'SkeLAM：提升机器人运动控制的潜在动作模型', 'desc': 'SkeLAM是一种骨架引导的潜在动作模型，旨在改善可控机器人世界建模和运动转移。它将潜在动作分解为基于机器人骨架的运动学组件和保留视觉动态的残差组件。通过交叉模态重建，SkeLAM鼓励RGB和骨架导出的运动学表示在视频重建中可互换。实验结果表明，SkeLAM在机器人执行中的成功率与预测结果一致，显著提高了机器人运动的控制能力。'}}}, {'id': 'https://huggingface.co/papers/2610.30043', 'title': 'TARSphere: A Robot-Oriented Full-Stack Framework for Long-Horizon Embodied Agents in Evolving Physical and Social Environments', 'url': 'https://huggingface.co/papers/2610.30043', 'abstract': 'Abstract TARSphere is a robot framework that integrates physics simulation, embodied NPCs, and a frozen multimodal language model to evaluate long-horizon embodied agents across diverse indoor tasks and social conditions.  Generated by thinkingmachines/Inkling-Small Robots must act under physical and social constraints while adapting to changes in their environment and human needs. Existing embodied-agent systems often focus on specified goals or abstract execution into symbolic actions, limiting evaluation in an evolving world. We introduce TARSphere, a robot-oriented full-stack framework for physically and socially grounded long-horizon embodied agents. TARSphere-Infra runs robot policies in a physics simulator with embodied NPCs and constrained dialogue. An event-driven finite-state machine (FSM) uses completed actions and delivered information to update task states and evaluate outcomes. TARSphere-Harness, its embodied brain harness, lets a frozen multimodal large language model (MLLM) act through multi-level executable skills, using observations, hierarchical memory, and execution feedback to revise its decisions. On this foundation, agent-in-the-loop curation aligns task semantics, causal dependencies, and scene geometry to construct TARSphere-Bench: 360 episodes across 30 indoor scenes. Five paired conditions assess perceptual robustness, disruption adaptation, task update, human coordination, and intent understanding for navigate-and-report and fetch-and-deliver tasks. Our evaluation of 8 MLLMs shows that general-purpose models can outperform embodied models, while task updates and human interaction remain difficult. Frequent collisions and falls further motivate evaluating execution safety alongside task success, even with a shared action interface and decision budget.', 'score': 1, 'issue_id': 3458, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '4d7f53b5e13aa0a6', 'authors': ['Yicheng Xu', 'Zhikai Xu', 'Ziyuan Chen', 'Yuhang Dong', 'Tao Zhang', 'Zhucun Xue', 'Yong Liu', 'Jiangning Zhang'], 'affiliations': ['Fudan University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.30043.jpg', 'data': {'categories': ['#multimodal', '#agents', '#dataset', '#benchmark', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Робот должен не только выполнить задачу, но и сделать это безопасно и с учётом людей', 'desc': 'Статья представляет TARSphere, полноценную платформу для оценки воплощённых (embodied) агентов на длинных горизонтах задач в физически и социально реалистичной среде. TARSphere-Infra запускает политики робота в физическом симуляторе с NPC и ограниченным диалогом, а конечный автомат, управляемый событиями, обновляет состояния задач. TARSphere-Harness позволяет замороженной мультимодальной LLM (MLLM) действовать через иерархические навыки, используя память и обратную связь при выполнении. На основе этого построен бенчмарк TARSphere-Bench из 360 эпизодов в 30 сценах; оценка 8 MLLM показывает, что универсальные модели иногда превосходят специализированные embodied-модели, а обновление задач и координация с человеком остаются сложными, при частых столкновениях и падениях.'}, 'en': {'title': 'TARSphere: Advancing Robot Evaluation in Dynamic Environments', 'desc': 'TARSphere is a comprehensive robot framework designed to assess long-horizon embodied agents in various indoor environments and social contexts. It combines physics simulation with embodied non-player characters (NPCs) and a frozen multimodal language model to enable robots to adapt to physical and social constraints. The framework utilizes an event-driven finite-state machine to manage task states and outcomes based on completed actions and information shared. Through extensive evaluation across multiple scenarios, TARSphere highlights the challenges of human interaction and task adaptability, while also emphasizing the importance of execution safety in robotic operations.'}, 'zh': {'title': 'TARSphere：评估具身代理的新框架', 'desc': 'TARSphere是一个机器人框架，结合了物理模拟、具身非玩家角色（NPC）和冻结的多模态语言模型，用于评估在多样化室内任务和社交条件下的长时间具身代理。该框架允许机器人在物理和社交约束下行动，并适应环境和人类需求的变化。与现有的具身代理系统不同，TARSphere提供了一个全面的框架，支持在不断变化的世界中进行评估。通过事件驱动的有限状态机和多层次可执行技能，TARSphere能够有效地更新任务状态并评估结果。'}}}, {'id': 'https://huggingface.co/papers/2610.24385', 'title': 'Bridging Exploration and Persona: Information-Directed Dueling for Test-Time Agent Personalization', 'url': 'https://huggingface.co/papers/2610.24385', 'abstract': 'Abstract ID-TAP uses a neural dueling-bandit framework with similarity-weighted warm starts to adapt LLM agents to user preferences via binary response comparisons within a limited interaction budget.  Generated by thinkingmachines/Inkling-Small Effective test-time personalization requires LLM agents to adapt to query-dependent user preferences from lightweight interaction. We study persona selection with binary comparisons between candidate responses as the online signal. We present ID-TAP, a scalable, IDS-inspired neural dueling-bandit framework for large discrete persona spaces. ID-TAP combines a query-conditioned neural utility model with a lightweight Bradley-Terry explorer, and transfers comparison evidence across related queries through similarity-weighted warm starts. The neural model shares statistical strength across queries while preserving query-specific scores, and efficient BT updates score hypothetical challengers. Across seven user-conditioned generation benchmarks under reference- and model-based preference simulators, ID-TAP achieves the strongest aggregate performance among the evaluated baselines within a fixed ten-round comparison budget. These results support information-directed challenger selection as an effective design for test-time persona adaptation.', 'score': 1, 'issue_id': 3455, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': 'd070efbe66f089bd', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rlhf', '#alignment', '#agents', '#benchmark', '#training'], 'emoji': '🎯', 'ru': {'title': 'Быстрая персонализация LLM по парным сравнениям за десять шагов', 'desc': 'В статье представлен метод ID-TAP для персонализации LLM-агентов на этапе инференса без дообучения модели. Система выбирает персону среди большого дискретного набора, используя бинарные сравнения ответов как онлайн-сигнал обратной связи. Ключевая идея: нейросетевая модель полезности, зависящая от запроса, и лёгкий explorer на основе Bradley-Terry, которые передают знания между похожими запросами через warm start с весами по сходству. Метод, вдохновлённый Information-Directed Sampling, показывает лучшие результаты на семи бенчмарках при фиксированном бюджете из десяти раундов сравнений.'}, 'en': {'title': 'Smart Personalization with ID-TAP: Adapting LLMs to User Preferences Efficiently', 'desc': 'The paper introduces ID-TAP, a novel framework that uses a neural dueling-bandit approach to help large language model (LLM) agents adapt to user preferences through binary comparisons. It focuses on efficiently personalizing responses based on limited user interactions by leveraging a query-conditioned neural utility model and a Bradley-Terry explorer. ID-TAP enhances performance by transferring knowledge from similar queries, allowing the model to maintain both general and specific scoring for responses. The results demonstrate that ID-TAP outperforms existing methods in adapting to user preferences within a constrained interaction budget.'}, 'zh': {'title': 'ID-TAP：智能适应用户偏好的新方法', 'desc': 'ID-TAP是一种神经对抗带宽框架，旨在通过有限的交互预算适应用户偏好。它利用二元响应比较来调整大型语言模型（LLM）代理，以满足查询依赖的用户需求。该框架结合了查询条件的神经效用模型和轻量级的Bradley-Terry探索器，通过相似性加权的热启动在相关查询之间转移比较证据。实验结果表明，ID-TAP在固定的十轮比较预算内，在七个用户条件生成基准测试中表现出色，支持信息导向的挑战者选择作为有效的个性化适应设计。'}}}, {'id': 'https://huggingface.co/papers/2610.24383', 'title': 'IF-MAP: Influence-Function-Inspired Agent Prioritization in Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2610.24383', 'abstract': "Abstract IF-MAP identifies high-impact agents in multi-agent LLM systems via prompt perturbation analysis to maximize system-level gains from targeted improvements.  Generated by thinkingmachines/Inkling-Small Improving every agent in an LLM-based multi-agent system can be prohibitively costly, making it important to identify which agent should be prioritized to achieve the greatest system-level gain with limited resources. Failure attribution can inform this decision, but an agent's responsibility for failures does not directly reveal the system-level gains achievable by improving it. We therefore introduce IF-MAP, an influence-function-inspired method for identifying agents with high potential for system-level improvement. For each agent, IF-MAP measures end-to-end loss changes under controlled semantic prompt perturbations, fits a regularized local response model in a low-dimensional prompt-embedding subspace, and uses the estimated response norm as a priority score. This black-box procedure requires no access to model parameters or gradients and produces agent priorities that can guide subsequent improvement effort. We evaluate IF-MAP across six multi-agent workflows spanning code generation, question answering, and mathematical reasoning, using the same priorities for prompt optimization and model upgrades. Optimizing the selected agents' prompts achieves a macro-average gain of 3.81 percentage points, compared with 1.85 for uniform agent selection. Across five target models, upgrading the selected agents yields macro-average gains of 7.62-16.42 percentage points, compared with 3.81-8.62 for uniform agent selection. Despite its probing overhead, IF-MAP reduces Qwen3-8B and DeepSeek-V3.2 token use by 74.2% and 35.2%, respectively, relative to optimizing every agent, and reduces target-model tokens by 63.6-64.9% relative to upgrading every agent. These results support the use of IF-MAP to identify promising agents and direct improvement effort toward greater end-to-end performance gains.", 'score': 1, 'issue_id': 3455, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': '9e924fd676399b6b', 'authors': ['Jie Mao', 'Pingchen Lu', 'Zikun Qu', 'Jiahang Sun', 'Xiangyi Wang', 'Zhiwei Shang', 'Zhiyong Wang', 'Guojun Xiong', 'Zhongxiang Dai'], 'affiliations': ['Harbin Institute of Technology', 'School of Engineering and Applied Sciences, Harvard University', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2610.24383.jpg', 'data': {'categories': ['#agents', '#interpretability', '#benchmark', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Улучшай не всех агентов, а тех, кто решает исход системы', 'desc': 'Статья представляет IF-MAP — метод, вдохновлённый influence functions, для определения агентов в multi-agent LLM системах, улучшение которых даст наибольший прирост качества всей системы. Метод работает в режиме black-box: для каждого агента измеряется изменение end-to-end loss при контролируемых семантических perturbations промптов, затем строится регуляризованная локальная response model в низкоразмерном подпространстве prompt embeddings. Норма оценённого отклика используется как priority score, по которому выбираются агенты для prompt optimization или model upgrade. Эксперименты на шести workflow (code generation, QA, математические рассуждения) показывают, что IF-MAP даёт больший прирост качества, чем равномерный выбор агентов, при существенно меньшем расходе токенов.'}, 'en': {'title': 'Maximizing Multi-Agent Performance with Targeted Improvements', 'desc': 'The paper introduces IF-MAP, a method designed to identify which agents in a multi-agent large language model (LLM) system should be improved to maximize overall system performance. It uses prompt perturbation analysis to measure how changes in prompts affect the performance of each agent, allowing for the prioritization of agents based on their potential impact. By fitting a local response model in a low-dimensional space, IF-MAP generates priority scores without needing access to model parameters or gradients. The results show that optimizing the identified agents leads to significant performance gains compared to uniform selection, demonstrating the effectiveness of targeted improvements in resource-constrained environments.'}, 'zh': {'title': '优先改善高影响力代理，提升系统性能', 'desc': 'IF-MAP是一种通过提示扰动分析来识别多智能体大语言模型系统中高影响力代理的方法。该方法旨在在有限资源下，优先改善能够带来最大系统级收益的代理。IF-MAP通过测量在控制语义提示扰动下的端到端损失变化，来评估每个代理的潜在改进能力。实验结果表明，优化选定代理的提示可以显著提高系统性能，且相较于均匀选择代理，IF-MAP能够有效减少资源消耗。'}}}, {'id': 'https://huggingface.co/papers/2610.12586', 'title': 'Realism VS Accuracy: Event Sequence Forecasting from a Generative Modeling Perspective', 'url': 'https://huggingface.co/papers/2610.12586', 'abstract': 'Abstract Event sequence forecasting is evaluated as conditional generative modeling, revealing a trade-off between accuracy and realism, and a proposed algorithm converts realism into predictive accuracy.  Generated by thinkingmachines/Inkling-Small Event sequences are chains of random events, each described by heterogeneous (numerical and categorical) features. The problem of event sequence forecasting occurs in finance, healthcare, business process intelligence, and other fields. In this work, we study multi-horizon forecasting of event sequences as a conditional generative modeling problem. We evaluate forecasts not only for prediction accuracy, but also for distributional realism. To this end, we present a benchmark comprising metrics for both quality aspects, strong statistical baselines, recent models adapted from adjacent fields, and curated real-world datasets. Careful evaluation reveals that no method excels at both accuracy and realism, highlighting a fundamental trade-off between the two. Finally, we introduce Wasserstein BaryBooster, an algorithm that aggregates samples from a realism-strong diffusion model into a state-of-the-art predictor, demonstrating that distributional realism can be converted into prediction accuracy. Code is available at https://github.com/xaosina/event-sequence-forecasting.', 'score': 1, 'issue_id': 3454, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '52f1a30c98385c15', 'authors': ['Dmitry Osin', 'Egor Surkov', 'Petr Mokrov', 'Igor Udovichenko', 'Ivan Karpukhin', 'Evgeny Burnaev', 'Egor Shvetsov', 'Alexander Korotin'], 'affiliations': ['AXXX', 'Applied AI Institute', 'ITMO University', 'SB AI Lab', 'Vega Institute Foundation'], 'pdf_title_img': 'assets/pdf/title_img/2610.12586.jpg', 'data': {'categories': ['#synthetic', '#benchmark', '#optimization', '#data', '#training', '#diffusion'], 'emoji': '🔮', 'ru': {'title': 'Реалистичность прогноза можно превратить в точность', 'desc': 'Статья рассматривает прогнозирование последовательностей событий как задачу условного генеративного моделирования, где нужно учитывать не только точность предсказаний, но и реалистичность распределения сгенерированных данных. Авторы создали бенчмарк с метриками обоих типов, сильными статистическими бейзлайнами, адаптированными моделями из смежных областей и реальными датасетами. Оказалось, что ни один метод не превосходит остальные одновременно по точности и реалистичности, что указывает на фундаментальный компромисс между ними. Предложенный алгоритм Wasserstein BaryBooster агрегирует сэмплы из диффузионной модели с высокой реалистичностью в предиктор, демонстрируя, что реалистичность распределения можно превратить в точность прогноза.'}, 'en': {'title': 'Balancing Accuracy and Realism in Event Sequence Forecasting', 'desc': 'This paper addresses the challenge of forecasting event sequences, which are series of events characterized by various features. It treats this problem as conditional generative modeling, emphasizing the balance between prediction accuracy and the realism of generated sequences. The authors introduce a new algorithm called Wasserstein BaryBooster, which enhances predictive accuracy by leveraging the realism from a diffusion model. Their findings reveal a trade-off between accuracy and realism, suggesting that improving one often compromises the other.'}, 'zh': {'title': '准确性与现实性的平衡：事件序列预测的新方法', 'desc': '事件序列预测被视为条件生成建模，揭示了准确性与现实性之间的权衡。本文研究了事件序列的多时间段预测，并提出了一种新的算法Wasserstein BaryBooster，该算法能够将现实性转化为预测准确性。我们评估了预测结果，不仅关注预测的准确性，还关注其分布的现实性。通过建立基准和使用真实世界数据集，我们发现没有一种方法能够同时在准确性和现实性上表现出色。'}}}];

        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (8)', '#agents (19)', '#agi (5)', '#alignment (4)', '#architecture (17)', '#audio (2)', '#benchmark (32)', '#cv (11)', '#data (5)', '#dataset (14)', '#diffusion (11)', '#ethics (1)', '#games (6)', '#graphs (1)', '#hallucinations (3)', '#healthcare', '#inference (9)', '#interpretability (9)', '#leakage (2)', '#long_context (3)', '#low_resource (2)', '#machine_translation (2)', '#math', '#multilingual (3)', '#multimodal (14)', '#open_source (6)', '#optimization (16)', '#plp (3)', '#rag (4)', '#reasoning (6)', '#rl (7)', '#rlhf (1)', '#robotics (9)', '#science (2)', '#security (4)', '#small_models (1)', '#story_generation', '#survey (5)', '#synthetic (5)', '#training (25)', '#transfer_learning (2)', '#video (12)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-24 10:41',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-24 10:41')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-24 10:41')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
