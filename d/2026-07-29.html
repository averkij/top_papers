    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.25895', 'title': 'HiFi-UMI: Learning Deployable Manipulation Policies from High-Fidelity UMI Data Alone', 'url': 'https://huggingface.co/papers/2607.25895', 'abstract': 'Abstract  Learning deployable manipulation policies is bottlenecked by the scarcity of data that is both high-fidelity and scalable. Real-robot teleoperation is accurate but costly to scale; robot-free UMI capture scales readily, and current practice uses the resulting data mainly for pre-training, adding a small real-robot "anchor" at post-training. We ask whether raising the fidelity of robot-free UMI data, rather than shrinking the real-robot fraction, can remove that anchor. We present HiFi-UMI, a portable UMI data-production system co-designed for trajectory accuracy, inter-gripper relative pose, synchronization, and field of view: head-mounted offline stereo-inertial SLAM, native rather than reconstructed relative pose, a shared microsecond GPIO trigger, and two wide-angle cameras per hand covering ~200 degrees. It reaches 3 mm workspace-local end-effector accuracy without external tracking infrastructure. Using this corpus, we demonstrate zero-robot post-training: a policy post-trained solely on HiFi-UMI demonstrations deploys directly on a real robot and matches in-domain teleoperation across three backbones spanning the vision-language-action and world-action-model families, with success-rate differences of -2.5, +3.1, and -0.6 percentage points on StarVLA-QwenPI, OpenPI-pi_0.5, and LingBot-VA; the strongest policy reaches 85% on a precision insertion task, even though the teleoperation baseline is collected in the evaluation scene and no HiFi-UMI trajectory is. Pre-training on 4,000 hours from the same corpus lowers action error on ten unseen tasks by 41% and, on StarVLA-QwenPI, raises real-robot success by a further 18.1 percentage points. We open-source HiFi-UMI-2K, 2,000 hours of microsecond-synchronized, ultra-wide-FoV demonstrations, each automatically reconstructed and validated through simulation replay, as a large-scale, high-fidelity resource for the robot-learning community.', 'score': 111, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'db4748a1646ae9fb', 'authors': ['Simple AI', ':', 'Yuteng Wei', 'Jinming Ma', 'Jiawei Wang', 'Weitao Zhou', 'Yushen Zuo', 'Ke Rui', 'Minglei Li', 'Jinhao Zhang', 'Zhikang Pan', 'Xiang Wang', 'Haoran Jia', 'Huan Du', 'Zicheng Zeng', 'Jun Ma', 'Guiyu Qin', 'Di Zhang', 'Xiaofei Li'], 'affiliations': ['Simple World Lab', 'SimpleAI'], 'pdf_title_img': 'assets/pdf/title_img/2607.25895.jpg', 'data': {'categories': ['#dataset', '#data', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'От высокофиделитетной синтетики к политикам, готовым к реальным роботам', 'desc': 'Исследование решает проблему дефицита высокочастотных данных для обучения манипуляционных политик роботов. Авторы разработали HiFi-UMI — портативную систему захвата данных телеуправления без реальных роботов, которая обеспечивает точность 3 мм благодаря стерео-инерциальной SLAM, синхронизации микросекундного уровня и широкоугольным камерам. Они показали, что политика, обученная только на высокофиделитетных данных HiFi-UMI, может напрямую развёртываться на реальном роботе, достигая производительности на уровне телеуправления без промежуточного обучения на реальных роботах. Авторы открыли доступ к датасету из 2000 часов синхронизированных демонстраций, что обеспечивает сообщество робототехники большомасштабным высокофиделитетным ресурсом для обучения.'}, 'en': {'title': 'High-Fidelity Data for Effective Robot Learning', 'desc': 'This paper introduces HiFi-UMI, a system designed to produce high-fidelity data for training manipulation policies in robots. It addresses the challenge of limited high-quality data by using a portable setup that captures accurate trajectory and pose information without the need for external tracking. The authors demonstrate that policies trained solely on HiFi-UMI data can perform effectively on real robots, achieving comparable success rates to those trained with real-robot data. Additionally, they provide a large dataset of synchronized demonstrations to support further research in robot learning.'}, 'zh': {'title': '高保真无机器人数据助力机器人学习', 'desc': '本论文提出了一种新的数据生成系统HiFi-UMI，旨在提高机器人操作策略的学习效率。通过使用高保真度的无机器人数据，研究者们希望减少对真实机器人数据的依赖，从而降低成本并提高可扩展性。HiFi-UMI系统能够在没有外部跟踪基础设施的情况下，实现3毫米的末端执行器精度，并且可以直接在真实机器人上部署学习到的策略。研究结果表明，使用HiFi-UMI数据进行后训练的策略在多个任务中表现出色，成功率显著提高。'}}}, {'id': 'https://huggingface.co/papers/2607.24223', 'title': 'A New Role for Relevance: Guiding Corpus Interaction in Agentic Search', 'url': 'https://huggingface.co/papers/2607.24223', 'abstract': "Abstract  Relevance is a query-dependent estimate of whether a document or excerpt contains useful evidence. Existing retrieval agents use relevance to select top-k content, but document relevance alone cannot localize, compose, or verify the evidence required by complex questions. Direct Corpus Interaction (DCI) enables such fine-grained operations through grep-style exploration, but its relevance-agnostic search can expose useful clues late and delay convergence. Recent advances use relevance to narrow the corpus into a working space for interaction. Once interaction begins, however, relevance still does not directly guide which documents grep searches first or distinguish informative excerpts from a broad set of matches to let LLMs see them first. We introduce the Relevance-Aware RipGrep Search Agent (RARG), which turns relevance into an execution prior for corpus interaction. RARG provides coarse-to-fine relevance guidance: it orders documents for sequential 'ripgrep' traversal to expose globally relevant clues earlier, initializes promising entry points with query-relevant paragraphs, and reranks grep matches to surface informative excerpts that document-level ranking may otherwise obscure. Across challenging browse question answering and reasoning-intensive retrieval, RARG improves the accuracy--efficiency frontier over retrieval-based and direct-interaction agents. These results demonstrate that relevance-aware interaction enables faster and more reliable search convergence.", 'score': 79, 'issue_id': 2786, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '7f6eac33cd3cb34e', 'authors': ['Jiangnan Li', 'Yuqing Li', 'Mo Yu', 'Jinchao Zhang', 'Jie Zhou'], 'affiliations': ['IIE-CAS', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2607.24223.jpg', 'data': {'categories': ['#benchmark', '#rag', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Релевантность как навигатор для умного поиска в текстовых корпусах', 'desc': 'В статье представлен агент RARG, который объединяет поиск по релевантности с прямым взаимодействием с корпусом текстов через grep-подобные операции. Основная идея заключается в использовании оценок релевантности как приоритета для управления порядком поиска: сначала обрабатываются наиболее релевантные документы, затем выбираются релевантные абзацы как точки входа, и наконец переранжируются результаты поиска. Такой подход от грубого к точному поиску позволяет быстрее находить нужные доказательства для сложных вопросов, которые требуют композиции и верификации информации из множества источников. Экспериментальные результаты показывают, что релевантность-ориентированное взаимодействие с корпусом улучшает баланс между точностью и эффективностью поиска в задачах вопросно-ответного поиска.'}, 'en': {'title': 'Revolutionizing Document Retrieval with Relevance-Aware Search', 'desc': 'This paper introduces the Relevance-Aware RipGrep Search Agent (RARG), which enhances document retrieval by integrating relevance into the search process. Traditional retrieval methods often fail to effectively localize and verify evidence for complex queries, but RARG uses relevance to prioritize document exploration. By employing a coarse-to-fine relevance strategy, RARG ensures that the most relevant documents and excerpts are accessed first, improving the efficiency of the search. The results show that RARG significantly boosts accuracy and speed in answering challenging questions compared to existing retrieval and interaction methods.'}, 'zh': {'title': '相关性驱动的高效文档检索', 'desc': '本文提出了一种新的搜索代理，称为相关性意识RipGrep搜索代理（RARG），旨在提高文档检索的效率和准确性。传统的检索方法仅依赖文档的相关性来选择内容，但无法有效定位和验证复杂问题所需的证据。RARG通过将相关性转化为执行优先级，优化了文档的搜索顺序，使得重要线索能够更早被发现。实验结果表明，RARG在处理复杂问题时，能够显著提升检索的准确性和效率。'}}}, {'id': 'https://huggingface.co/papers/2607.25565', 'title': 'ReDesign: Recovering Editable Design Structures from Images via Agentic Decomposition', 'url': 'https://huggingface.co/papers/2607.25565', 'abstract': 'Abstract  Recovering an editable design file from a raster image is a common and costly bottleneck in modern design workflows, yet remains challenging since editability depends on recovering multi-modal attributes, such as typography, vector geometry, colors, grouping, and layer ordering. We present ReDesign, an agentic framework that grows an editable layer hierarchy by selecting and composing specialized tools across modalities. To keep this long decision process reliable despite imperfect tool outputs, we introduce graceful verification at each expansion, which provides local accept, prune, or retry feedback that prevents error accumulation and avoids large scale reruns. To evaluate editability at scale, we introduce the Figma Edit Replay Benchmark, consisting of 909 raw Figma files and 14,796 controlled edit instructions that replay edits on reconstructed outputs. Across this benchmark and standard reconstruction metrics, ReDesign achieves strong visual fidelity while delivering the highest editability across layout, color, and text edits, outperforming layered decomposition baselines and serial tool use pipelines.', 'score': 53, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '16401421ac79e544', 'authors': ['Jooyeol Yun', 'Jintae Park', 'Hyesu Lim', 'Junha Hyung', 'Hyungjin Chung', 'Jaegul Choo'], 'affiliations': ['Helmholtz Munich, Neuherberg, Germany', 'KAIST AI, Daejeon, Korea', 'Korea University, EverEx'], 'pdf_title_img': 'assets/pdf/title_img/2607.25565.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Восстановление редактируемых дизайнов из изображений через агентное композирование инструментов', 'desc': 'ReDesign — это агентная система, которая восстанавливает редактируемые файлы дизайна из растровых изображений путём последовательного применения специализированных инструментов для различных модальностей (типография, векторная геометрия, цвета, группировка слоёв). Система использует механизм graceful verification на каждом этапе расширения иерархии слоёв, что позволяет локально принимать, отсекать или переделывать результаты и предотвращает накопление ошибок. Авторы предложили Figma Edit Replay Benchmark — новый датасет из 909 реальных файлов Figma с 14,796 контролируемых инструкций редактирования для оценки редактируемости восстановленных дизайнов. Экспериментальные результаты показывают, что ReDesign достигает высокой визуальной точности и превосходит базовые подходы по способности сохранять редактируемость при изменении макета, цветов и текста.'}, 'en': {'title': 'Transforming Images into Editable Designs with ReDesign', 'desc': "This paper introduces ReDesign, a framework designed to convert raster images into editable design files by reconstructing multi-modal attributes like typography and vector geometry. It employs a method of selecting and combining specialized tools to build a hierarchy of editable layers, ensuring that the process remains reliable through a verification system that allows for local adjustments. The authors also present the Figma Edit Replay Benchmark, which tests the framework's performance on a large dataset of design files and edit instructions. ReDesign demonstrates superior visual fidelity and editability compared to existing methods, making it a significant advancement in design workflow efficiency."}, 'zh': {'title': 'ReDesign：提升设计文件可编辑性的智能框架', 'desc': '本论文提出了一种名为ReDesign的框架，用于从光栅图像中恢复可编辑的设计文件。该框架通过选择和组合多种专业工具，构建可编辑的层次结构，以应对设计工作流程中的挑战。为了确保决策过程的可靠性，ReDesign在每次扩展时引入了优雅的验证机制，提供局部的接受、修剪或重试反馈，防止错误累积。通过Figma Edit Replay Benchmark的评估，ReDesign在布局、颜色和文本编辑方面展现了卓越的可编辑性，超越了传统的分层分解基线和串行工具使用流程。'}}}, {'id': 'https://huggingface.co/papers/2607.25431', 'title': 'CodeNib: A Multi-View Data System for Serving Repository Context to Coding Agents', 'url': 'https://huggingface.co/papers/2607.25431', 'abstract': 'Abstract  Coding agents repeatedly search, navigate, and retain context from evolving repositories, but disconnected indexes, language servers, and task-local histories force repeated discovery and obscure lifecycle costs. CodeNib builds reusable lexical, dense, and structural views per repository commit, maps outputs to repository-relative source ranges, maintains selected views across edits, and serves ranked search, symbol navigation, and bounded context through one runtime.   Across 100 snapshots, we map quality-cost frontiers across the repository-context lifecycle. When outputs match an independent rebuild, graph and vector updates are 8.7times and 25.4times faster at the median. On the static-navigation subset matching normalized live-server locations (63% of 1,000 requests), the median per-request live/static latency ratio is 4.7times. Across five models, selected context policies preserve localization with 50--87% fewer trajectory tokens than paired grep/read. Together, these results support multi-view repository-context serving with explicit, operation-specific validity boundaries.', 'score': 23, 'issue_id': 2788, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '91ca081314d20458', 'authors': ['Zhongming Yu', 'Hengjia Yu', 'Boqin Yuan', 'Shuting Zhao', 'Yizhao Chen', 'Aryan Dokania', 'Mihir Jagtap', 'Jiayu Chang', 'Yitong Ma', 'Yash Jayswal', 'Wentao Ni', 'Hejia Zhang', 'Zhaoling Chen', 'Gangda Deng', 'Jishen Zhao'], 'affiliations': ['Stanford University', 'UC Riverside', 'UC San Diego', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2607.25431.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Единое многовидовое хранилище контекста для ускорения кодовых агентов', 'desc': 'В работе представлена система CodeNib, которая создает множественные представления (лексические, плотные и структурные) кодовых репозиториев для поддержки агентов, работающих с кодом. Система поддерживает единую точку доступа для поиска, навигации по символам и управления контекстом, избегая повторного обнаружения информации. Авторы демонстрируют значительное ускорение обновлений графов и векторных индексов (в 8.7 и 25.4 раза соответственно) при условии совпадения с независимой пересборкой. Предложенные политики отбора контекста уменьшают количество токенов траектории на 50-87% по сравнению с традиционными методами поиска.'}, 'en': {'title': 'Streamlining Code Navigation with CodeNib', 'desc': 'The paper introduces CodeNib, a system designed to enhance the efficiency of coding agents by providing reusable views of code repositories. It addresses the challenges of disconnected indexes and task-local histories that complicate code navigation and discovery. By maintaining context across edits and offering ranked search and symbol navigation, CodeNib significantly reduces the time and resources needed for code retrieval. The results demonstrate that CodeNib can improve performance by making updates faster and reducing the amount of data processed during navigation tasks.'}, 'zh': {'title': '提升代码管理效率的多视图工具', 'desc': '本文介绍了CodeNib，一个用于代码管理的工具，旨在提高代码搜索和导航的效率。它通过构建可重用的词汇、密集和结构视图，来优化代码库的使用，减少重复发现的成本。研究表明，CodeNib在处理代码快照时，更新速度显著提高，且在请求处理时延迟大幅降低。最终，本文的结果支持了多视图代码库上下文的服务，确保操作的有效性边界。'}}}, {'id': 'https://huggingface.co/papers/2607.24368', 'title': 'Keep It InMind: Benchmarking the Implicit-Association Blind Spot in Agent Memory', 'url': 'https://huggingface.co/papers/2607.24368', 'abstract': 'Abstract  Long-term memory systems store what a user says in an external store and retrieve it when a related query arrives. This interface rests on an assumption so natural that it is rarely stated: a memory that is needed will resemble the query that needs it. World knowledge breaks the assumption. A tree-nut allergy should change the answer to a macaron request through their almond-flour ingredient, yet the two texts share no cue a retriever can see. We call this failure mode the implicit-association blind spot and introduce InMind, a 125-task, expert-verified benchmark spanning ten life domains, with 113 tasks grounded in citable public sources. Its paired controls separate three explanations that existing evaluations conflate: the fact was never stored, the model lacks the bridging knowledge, or the fact was stored and never surfaced. The verdict is clean. With the decisive memory placed in context, the backbone answers 84.0 percent of indirect queries; when the same memory must be retrieved, six vector, graph, and agentic memory systems reach at most 14.4 percent, even though they recall the same facts on demand at up to 100 percent. An embedding with eight times the dimensionality raises answer-blind target recall for every system yet leaves the gap essentially intact. A minimal diagnostic probe that keeps memory visible before the query arrives recovers most of the gap, locating the failure in the query-conditioned interface itself and pointing to routing, deciding which facts must stay visible, as the open problem InMind is built to score.', 'score': 23, 'issue_id': 2786, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'b67c5b812a3cfde2', 'authors': ['Ruizhe Li', 'Mingxuan Du', 'Benfeng Xu', 'Zhendong Mao'], 'affiliations': ['Metastone Technology', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24368.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#rag'], 'emoji': '🧠', 'ru': {'title': 'Побеждая слепую зону: как научить системы памяти находить скрытые связи между информацией', 'desc': "В работе исследуется критическая проблема систем с долгосрочной памятью: они не могут найти релевантную информацию, когда запрос и нужные факты не имеют поверхностного сходства. Авторы вводят InMind — бенчмарк из 125 задач, охватывающих десять жизненных областей и проверенных экспертами, который выявляет эту 'слепую зону неявных связей' в системах retrieval-augmented generation. Через контролируемые эксперименты показано, что различные архитектуры памяти (векторные, графовые и агентные системы) достигают только 14.4% при поиске по запросу, хотя могут воспроизвести те же факты с точностью до 100% при прямом доступе. Исследование определяет основную проблему в query-conditioned интерфейсе и предлагает решение через маршрутизацию видимых фактов."}, 'en': {'title': 'Bridging the Gap: Enhancing Memory Retrieval in Machine Learning', 'desc': "This paper discusses the limitations of long-term memory systems in machine learning, particularly when retrieving information that is contextually relevant but not directly related to a query. It introduces a benchmark called InMind, which evaluates how well these systems can handle indirect queries that require world knowledge, such as understanding allergies in food requests. The study identifies a failure mode termed the 'implicit-association blind spot,' where systems struggle to connect relevant facts due to a lack of contextual awareness. The findings suggest that while memory systems can recall facts accurately, they often fail to retrieve them in the right context, highlighting the need for improved query-conditioned interfaces."}, 'zh': {'title': '记忆系统的隐性关联盲点', 'desc': '长期记忆系统将用户所说的内容存储在外部存储中，并在相关查询到达时检索这些内容。本文提出了一个概念，即隐性关联盲点，指出世界知识会影响查询的答案。我们引入了InMind，这是一个包含125个任务的基准测试，旨在评估记忆系统在不同生活领域的表现。研究表明，尽管现有系统在直接查询中表现良好，但在间接查询中却显著失效，揭示了查询条件接口中的问题。'}}}, {'id': 'https://huggingface.co/papers/2607.26057', 'title': 'Pass the Baton: Trajectory-Relayed On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.26057', 'abstract': "Abstract  On-policy distillation (OPD) grounds token-level supervision in the student's own trajectory, yet suffers from prefix failure: once the student commits to a wrong reasoning direction, all subsequent generation builds on this deviation, producing misdirected continuations that elicit unreliable supervision and waste compute. We identify a teacher-student continuation asymmetry on failed prefixes, where the teacher tends to redirect while the student continues along the original direction, and convert it into a label-free handoff trigger in Relay On-Policy Distillation (Relay-OPD). During training, Relay-OPD constructs relay trajectories by letting the teacher briefly take over at detected trigger points to produce a teacher leg, after which the student resumes and is optimized on the resulting trajectory. A limited relay budget concentrates intervention on critical early positions while limiting departure from the student policy. With a Qwen3-4B-Instruct-2507 teacher and Qwen3-0.6B/1.7B-Non-Thinking students on eight mathematical reasoning benchmarks, Relay-OPD achieves the best or second-best results on every benchmark, outperforming standard OPD by +5.73% and the strongest baseline FastOPD by +1.49% on average for 1.7B, with consistent gains at 0.6B. Training trajectory length is reduced by over 50%.", 'score': 21, 'issue_id': 2787, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '0056fee243c2af80', 'authors': ['Haolei Xu', 'Xiaowen Xu', 'Haiwen Hong', 'Zixuan Ni', 'Hongxing Li', 'Yiwen Qiu', 'Weiming Lu', 'Yongliang Shen'], 'affiliations': ['Yuvion Team, Alibaba Group', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26057.jpg', 'data': {'categories': ['#math', '#optimization', '#small_models', '#training', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Направляй студента через учителя: минимальные вмешательства для эффективной дистилляции', 'desc': 'В статье предложен метод Relay On-Policy Distillation (Relay-OPD) для улучшения дистилляции языковых моделей. Авторы выявили проблему prefix failure, когда студент, допустив ошибку на ранних этапах генерации, продолжает строить на ней весь текст, тратя вычисления впустую. Решение основано на обнаружении асимметрии между учителем и студентом: учитель способен исправить курс, а студент нет. Метод использует бюджет intervencий для создания relay-траекторий, где учитель кратко перехватывает управление в критические моменты, позволяя студенту затем продолжить обучение на исправленных примерах, что сокращает длину обучающих траекторий на 50% и улучшает результаты на математических бенчмарках.'}, 'en': {'title': 'Enhancing Student Learning with Teacher Interventions in Relay-OPD', 'desc': "This paper introduces Relay On-Policy Distillation (Relay-OPD), a method that improves the training of student models by addressing the issue of prefix failure in on-policy distillation. Prefix failure occurs when a student model follows a wrong reasoning path, leading to poor performance in subsequent outputs. Relay-OPD allows a teacher model to intervene at critical points in the student's trajectory, providing better guidance and supervision. The results show that Relay-OPD significantly enhances performance on mathematical reasoning tasks while also reducing the training time needed."}, 'zh': {'title': '引导学生走向正确方向的蒸馏方法', 'desc': '本文提出了一种新的训练方法，称为Relay On-Policy Distillation（Relay-OPD），旨在解决在学生模型生成过程中出现的前缀失败问题。通过识别教师和学生在失败前缀上的不对称性，Relay-OPD允许教师在关键时刻接管生成过程，从而引导学生朝正确的方向继续。该方法在多个数学推理基准测试中表现优异，显著提高了模型的性能，并减少了训练轨迹的长度。Relay-OPD在多个基准上超越了传统的在政策蒸馏方法，展示了其有效性和优势。'}}}, {'id': 'https://huggingface.co/papers/2607.24904', 'title': 'Mage-VL: An Efficient Codec-Native Streaming Multimodal Foundation Model', 'url': 'https://huggingface.co/papers/2607.24904', 'abstract': "Abstract  Standard vision-language models (VLMs) suffer from Moravec's paradox: they excel at complex offline visual reasoning but struggle with simple streaming perception tasks and process them inefficiently. We present Mage-VL, an efficient codec-native streaming foundation model for real-time multimodal understanding and interaction. At its core, our custom tokenizer, Mage-ViT, replaces uniform frame sampling by selectively encoding dynamic, entropy-rich regions using motion vectors and residual energy across sparse anchor (I) and predicted (P) frames. Operating at a 16 x 16 patch level, this reduces visual token consumption by over 75% while preserving spatiotemporal context. Trained from scratch on approximately 560M unlabeled images and 100M unlabeled video frames, Mage-ViT matches or outperforms flagship encoders trained on billions of image-text pairs. We establish AI4AI data pipelines encompassing prompt-code joint optimization for multimodal captioning and AI-driven performance diagnosis to guide training recipes. Furthermore, through a bio-inspired dual-system architecture - a lightweight System 1 event gate and a causal System 2 decoder - Mage-VL enables proactive streaming perception. Extensive evaluations show that Mage-VL-4B matches Qwen3-VL-4B on static tasks while achieving strong gains in video understanding and 2D/3D spatial reasoning, with up to a 3.5x wall-clock inference speedup, and comprehensively surpasses the 15B Phi-4-reasoning-vision baseline. Beyond model artifacts, we deliver seven key empirical findings covering pre-training data efficiency, variable-resolution scaling, codec system acceleration, VideoQA SFT redundancy, motion-spatial synergy, AI4AI data pipelines, and Zero-Vision SFT for multimodal RL.", 'score': 21, 'issue_id': 2786, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '966af4a5faf6ef9d', 'authors': ['Senqiao Yang', 'Kaichen Zhang', 'Zhaoyang Jia', 'Jinghao Guo', 'Yifei Shen', 'Xinjie Zhang', 'Xiaoyi Zhang', 'Haoqing Wang', 'Xiao Li', 'Peng Zhang', 'Xiang An', 'Yin Xie', 'Zhening Liu', 'Xun Guo', 'Jiahao Li', 'Shicheng Zheng', 'Jinglu Wang', 'Zongyu Guo', 'Wenxuan Xie', 'Zihan Zheng', 'Yuxuan Luo', 'Bin Li', 'Yan Lu'], 'affiliations': ['Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2607.24904.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#3d', '#open_source', '#optimization', '#cv', '#inference', '#video', '#training'], 'emoji': '⚡', 'ru': {'title': 'Потоковое видение-языковое понимание с селективной кодировкой динамичных регионов', 'desc': 'В статье представлена Mage-VL — эффективная потоковая модель видение-язык, которая преодолевает парадокс Моравца, позволяя выполнять сложное визуальное рассуждение и обрабатывать видеопоток в реальном времени. Ключевой компонент — кастомный токенизатор Mage-ViT, который использует векторы движения и энергию остатков для выборочного кодирования динамичных регионов вместо равномерной выборки кадров, снижая потребление визуальных токенов на 75%. Модель обучена на 560M немеченых изображений и 100M видеофреймов с применением AI4AI пайплайнов для оптимизации данных и обучения. Архитектура с двумя системами (быстрая System 1 и каузальная System 2) обеспечивает проактивное восприятие потока с ускорением вывода до 3.5x при сравнимом качестве на статичных задачах и превосходстве в видеопонимании.'}, 'en': {'title': 'Mage-VL: Revolutionizing Real-Time Multimodal Interaction', 'desc': 'This paper introduces Mage-VL, a new vision-language model designed to improve real-time multimodal understanding and interaction. It addresses the inefficiencies of standard models in processing streaming perception tasks by using a custom tokenizer that focuses on dynamic regions in video frames. By reducing visual token consumption significantly while maintaining important context, Mage-VL achieves high performance with less data. The model demonstrates superior capabilities in video understanding and spatial reasoning, while also speeding up inference times compared to existing models.'}, 'zh': {'title': 'Mage-VL：高效的实时多模态理解模型', 'desc': '本论文提出了一种名为Mage-VL的高效视觉语言模型，旨在解决传统模型在简单实时感知任务中的低效问题。Mage-VL通过自定义的Mage-ViT分词器，采用动态编码技术，显著减少了视觉标记的消耗，同时保留了时空上下文。该模型在560M未标记图像和100M未标记视频帧上进行训练，表现出色，甚至超过了在数十亿图像-文本对上训练的主流编码器。通过生物启发的双系统架构，Mage-VL实现了主动的流媒体感知，显著提升了视频理解和空间推理的性能。'}}}, {'id': 'https://huggingface.co/papers/2607.23514', 'title': 'Novel Claim or Déjà Vu? Rethinking "Contamination-Free\'\' Dynamic Evaluation for Multimodal Automated Fact-Checking', 'url': 'https://huggingface.co/papers/2607.23514', 'abstract': "Abstract  Multimodal automated fact-checking (MAFC) verifies claims by retrieving and reasoning over external evidence. However, most existing static benchmarks risk contamination: they primarily consist of outdated claims verifiable using an LLM's internal knowledge without external evidence. This can inflate performance estimates and fail to reflect true capability on novel claims that require up-to-date information. To address this, emerging dynamic benchmarks collect claims published after LLMs' knowledge cut-off dates, assuming they are uncontaminated. This work revisits this assumption by empirically studying contamination risks in both the state-of-the-art (SOTA) static AVeriTeC benchmark and our newly constructed dynamic ClaimReview2025Q4 benchmark, as well as their impact on MAFC evaluation. Our experiments yield 16 findings, highlighting three key results: (1) Dynamic evaluation reduces but does not eliminate contamination risks, as 17.09\\%--29.30\\% of post-cut-off claims remain potentially contaminated; (2) Many newly published claims can be verified either directly or by synthesizing multiple pieces of public knowledge available before the cut-off; and (3) Contamination can induce statistically significant inflation in MAFC performance, increasing Macro-F1 by up to 11.34 points and distorting system rankings. In light of these findings, we re-evaluate SOTA LLMs under a strictly contamination-controlled setting. Our study provides practical guidelines for trustworthy MAFC evaluation.", 'score': 12, 'issue_id': 2787, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'f3ee300f9a4a2daf', 'authors': ['Haorui He', 'Xinwen Chen', 'Dacheng Wen', 'Reynold Cheng', 'Francis C. M. Lau', 'Yupeng Li'], 'affiliations': ['Department of Interactive Media, Hong Kong Baptist University', 'Faculty of Science and Technology, Beijing Normal-Hong Kong Baptist University', 'School of Computing and Data Science, The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.23514.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#rag', '#benchmark', '#reasoning', '#leakage'], 'emoji': '🔍', 'ru': {'title': 'Скрытая контаминация в бенчмарках проверки фактов подрывает надёжность оценок', 'desc': 'Работа изучает проблему контаминации данных в многомодальной автоматической проверке фактов, когда модели решают задачи, используя свои внутренние знания вместо извлечения внешних источников. Авторы показали, что даже динамические бенчмарки с утверждениями, опубликованными после даты обучения модели, содержат 17-29% потенциально контаминированных примеров. Исследование демонстрирует, что контаминация может значительно завышать оценки производительности систем на 11 пунктов по метрике Macro-F1 и искажает рейтинги моделей. Авторы предлагают практические рекомендации для надёжной оценки систем проверки фактов без влияния загрязнения данных.'}, 'en': {'title': 'Ensuring Trustworthy Evaluation in Multimodal Automated Fact-Checking', 'desc': 'This paper discusses the challenges in multimodal automated fact-checking (MAFC) due to contamination in benchmarks. It highlights that many existing benchmarks use outdated claims that can be verified without external evidence, leading to inflated performance estimates. The authors introduce a new dynamic benchmark, ClaimReview2025Q4, and investigate contamination risks in both static and dynamic settings. Their findings reveal that while dynamic evaluation reduces contamination, it does not eliminate it, and they provide guidelines for more reliable MAFC assessments.'}, 'zh': {'title': '确保多模态自动事实核查的可信性', 'desc': '多模态自动事实核查（MAFC）通过检索和推理外部证据来验证声明。然而，现有的静态基准测试存在污染风险，主要由过时的声明组成，这些声明可以通过大型语言模型（LLM）的内部知识验证，而不需要外部证据。这可能会夸大性能评估，并未能真实反映在需要最新信息的新声明上的能力。我们的研究通过实证分析静态和动态基准测试中的污染风险，提出了在MAFC评估中需要考虑的实际指导方针。'}}}, {'id': 'https://huggingface.co/papers/2607.25857', 'title': 'Shieldstral', 'url': 'https://huggingface.co/papers/2607.25857', 'abstract': 'Abstract  We introduce Shieldstral, a 3B-parameter policy-adaptive multimodal safety classifier that matches or outperforms models nearly 7times its size on text safety benchmarks and sets a new state of the art on multimodal safety classification. Shieldstral formulates content moderation as a binary question-answering task. This simple formulation unifies diverse moderation tasks into a single yes/no problem, enabling heterogeneous safety datasets with divergent taxonomies to be consolidated under one training framework. We present the data construction recipe, covering curation and generation of approximately 54.1M samples and a fine-grained evaluation set to evaluate policy adaptability. Together, these enable a small adaptive model to match or outperform much larger models.', 'score': 10, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '9c2876252b023daa', 'authors': ['Antonia Calvi', 'Avinash Sooriyarachchi', 'Giada Pistilli', 'Guillaume Lample', 'Maarten Buyl', 'Maximilian Augustin', 'Maximilian Müller', 'Pierre Stock', 'Tom Bewley', 'Wassim Bouaziz', 'Yimu Pan'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.25857.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#dataset', '#small_models', '#training'], 'emoji': '🛡️', 'ru': {'title': 'Компактный страж: маленькая модель с большой защитой', 'desc': 'Представлена Shieldstral — компактная нейросетевая модель с 3 миллиардами параметров для классификации вредоносного контента, которая превосходит модели в 7 раз больше по размеру на тестах безопасности текстов и устанавливает новый рекорд в мультимодальной классификации. Авторы переформулировали задачу модерации контента как бинарное задание вопросно-ответного типа, что позволило унифицировать разнородные наборы данных с разными схемами классификации в единую обучающую систему. Был создан датасет из 54.1 миллионов примеров и специализированный набор для оценки адаптивности модели к различным политикам модерации. Такой подход позволил небольшой адаптивной модели достичь качества намного более крупных аналогов.'}, 'en': {'title': 'Shieldstral: Small Model, Big Safety Impact!', 'desc': "Shieldstral is a multimodal safety classifier with 3 billion parameters that excels in content moderation tasks. It simplifies the moderation process by framing it as a binary question-answering task, which allows for the integration of various safety datasets into one cohesive training framework. This approach not only enhances the model's adaptability but also enables it to achieve state-of-the-art performance on safety benchmarks, even when compared to much larger models. The paper details the data construction process, which includes the curation of 54.1 million samples and a specialized evaluation set to assess the model's policy adaptability."}, 'zh': {'title': '小模型，大安全：Shieldstral的创新之路', 'desc': '我们介绍了Shieldstral，这是一种具有30亿参数的政策自适应多模态安全分类器。在文本安全基准测试中，Shieldstral的表现与接近其七倍大小的模型相当或更好，并在多模态安全分类中设定了新的最先进水平。该模型将内容审核问题表述为一个二元问答任务，从而将不同的审核任务统一为一个简单的是/否问题，使得异构安全数据集能够在一个训练框架下整合。我们还展示了数据构建的过程，包括约5410万样本的策划和生成，以及用于评估政策适应性的细粒度评估集。'}}}, {'id': 'https://huggingface.co/papers/2607.26037', 'title': 'Wonder: Video World Model Done Better', 'url': 'https://huggingface.co/papers/2607.26037', 'abstract': "Abstract  We present Wonder, a general-purpose video world model for real-time, camera-controllable world exploration. Given an image or a conditional video, Wonder constructs a playable world where users can navigate interactively by moving the camera, discovering unseen regions, and revisiting previously observed areas in real time and over a long-term horizon. Achieving this capability requires a system-level co-design of control method, memory mechanism, and training strategy. We introduce a novel camera conditioning with a dense coordinate field whose renderings provide spatially aligned motion and orientation cues, allowing the model to interpret camera motion directly as visual evidence. To support fast and precise memory retrieval over a growing generation context, we propose an efficient sparse attention-based memory mechanism, enabling the model to selectively attend to a small set of relevant context tokens at inference time, regardless of actual context length. We further develop several techniques to rectify the self-forcing-style distillation pipeline, improving the student model's ability to respect control signals, as well as maintaining diverse generation modes and long-term memory from the teacher. Together, these components enable Wonder to synthesize diverse, minute-scale videos at 16 FPS while preserving coherent geometry, appearance, and dynamics across long rollouts. Beyond image-to-video generation, Wonder naturally supports video-conditioned generation, allowing existing dynamic scenes to be re-shot in real time.", 'score': 9, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '14c1f31bf54cb390', 'authors': ['Jiacong Xu', 'Hanwen Jiang', 'Zhixin Shu', 'Kalyan Sunkavalli', 'Vishal M. Patel', 'Yiqun Mei'], 'affiliations': ['Adobe Research', 'Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26037.jpg', 'data': {'categories': ['#architecture', '#open_source', '#long_context', '#video', '#training'], 'emoji': '🎬', 'ru': {'title': 'Интерактивное исследование виртуальных миров через управление камерой', 'desc': 'Авторы представляют Wonder — универсальную видеомодель мира, которая позволяет пользователям интерактивно исследовать сгенерированные сцены в реальном времени, управляя камерой и открывая невидимые области. Система использует инновационный метод кодирования камеры с помощью плотного координатного поля, которое предоставляет пространственно согласованные сигналы движения и ориентации. Модель применяет эффективный механизм памяти на основе разреженного внимания, позволяющий выбирать релевантные токены контекста во время инференса независимо от длины истории. Результирующая система генерирует разнообразные видео длиной в минуты при 16 FPS, сохраняя согласованность геометрии, текстур и динамики на протяжении длительных последовательностей.'}, 'en': {'title': 'Explore Your World in Real-Time with Wonder!', 'desc': "The paper introduces Wonder, a versatile video world model designed for real-time exploration using camera controls. It allows users to navigate through a generated world by interpreting camera movements as visual cues, enhancing the interactive experience. The system employs a unique memory mechanism that utilizes sparse attention to efficiently retrieve relevant information, ensuring quick responses during navigation. Additionally, it incorporates advanced training techniques to improve the model's adherence to control signals and maintain diverse video outputs while ensuring consistent visual quality over time."}, 'zh': {'title': 'Wonder：实时可控的视频世界探索', 'desc': '本文介绍了Wonder，一个通用的视频世界模型，旨在实现实时的、可控的世界探索。该模型能够根据图像或条件视频构建一个可互动的世界，用户可以通过移动相机实时导航，发现未见区域并重访已观察区域。为了实现这一功能，系统设计了控制方法、记忆机制和训练策略的协同工作。Wonder采用了一种新颖的相机条件化方法，结合稠密坐标场，支持高效的稀疏注意力记忆机制，使得模型能够在推理时快速准确地检索相关上下文。'}}}, {'id': 'https://huggingface.co/papers/2607.24957', 'title': 'PerceptionBench: Evaluating Atomic Visual Perception in Multimodal Large Language Models', 'url': 'https://huggingface.co/papers/2607.24957', 'abstract': 'Abstract  We introduce PerceptionBench, a benchmark specifically designed to evaluate the atomic visual perception capabilities of Multimodal Large Language Models (MLLMs). Existing benchmarks often fail to isolate perception: holistic evaluations conflate perceptual errors with failures in reasoning or domain knowledge, while application-driven benchmarks only cover narrow, fragmented domains shaped by heuristic designs. To address these limitations, PerceptionBench adopts a bottom-up approach: by diagnosing the earliest failure points in the responses of frontier MLLMs across 42 existing benchmarks, we construct an error taxonomy whose perception branch defines ten atomic perceptual capabilities. Guided by this taxonomy, we construct 3,000 verified questions with short, unambiguous answers, each isolating a single capability, with difficulty stemming from perception rather than reasoning or knowledge. Benchmark results across sixteen frontier MLLMs reveal that atomic perception remains largely unsolved---no model reaches 60\\% accuracy, perception-related hallucination is the weakest capability on average, and similar overall scores conceal sharply divergent capability profiles. PerceptionBench thus provides a capability-level standard for measuring and diagnosing the visual perception boundaries of MLLMs.', 'score': 9, 'issue_id': 2786, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '622bf9fcc7af32cf', 'authors': ['Zichao Lin', 'Yifeng Xie', 'Bowen Qu', 'Haiming Wang', 'Jia Li', 'Haoning Wu', 'Yuhao Dong', 'Zuhao Yang', 'Jinguo Zhu', 'Haoyu Lu', 'Zijia Zhao', 'Tongtian Yue', 'Zhangyang Qi', 'Junwei Yang', 'Mengfan Dong', 'Peizhou Cao', 'Chenzhuang Du', 'Zaida Zhou', 'Haotian Yao', 'Hao Yang', 'Hongcheng Gao', 'Lin Sui', 'Weihong Li', 'Xinxing Zu', 'Jia Chen', 'Yao Wang', 'Xiaoxue Wu', 'Yalin Wang', 'Y. Charles', 'Yiping Bao', 'Yangyang Liu', 'Zhiqi Huang', 'Xinyu Zhou'], 'affiliations': ['Moonshot AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.24957.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal'], 'emoji': '👁️', 'ru': {'title': 'Измеряем истинные границы визуального восприятия мультимодальных моделей', 'desc': 'Авторы представляют PerceptionBench — бенчмарк для оценки базовых визуальных возможностей восприятия мультимодальных больших языковых моделей. Существующие тесты не разделяют восприятие от рассуждений и знаний, поэтому исследователи провели анализ ошибок на 42 существующих бенчмарках и создали таксономию, выделяющую десять элементарных перцептивных способностей. Они составили 3000 проверенных вопросов, каждый из которых изолирует одну способность и требует только визуального анализа без дополнительных знаний. Результаты показывают, что ни одна из 16 протестированных моделей не достигла 60% точности, выявляя галлюцинации как самую слабую способность.'}, 'en': {'title': 'Isolating Visual Perception in Multimodal Models', 'desc': 'PerceptionBench is a new benchmark created to specifically test the visual perception skills of Multimodal Large Language Models (MLLMs). Unlike previous benchmarks that mix perception with reasoning or knowledge, PerceptionBench focuses solely on perceptual abilities by identifying and categorizing errors in MLLM responses. It includes 3,000 carefully crafted questions that target ten distinct perceptual capabilities, ensuring that the challenges arise from perception alone. The results show that current MLLMs struggle with these atomic perception tasks, highlighting the need for further advancements in this area.'}, 'zh': {'title': '评估多模态语言模型的视觉感知能力新基准', 'desc': '我们介绍了PerceptionBench，这是一个专门设计用于评估多模态大型语言模型（MLLMs）原子视觉感知能力的基准。现有的基准往往无法单独评估感知能力，整体评估将感知错误与推理或领域知识的失败混为一谈。为了解决这些问题，PerceptionBench采用自下而上的方法，通过诊断前沿MLLM在42个现有基准中的早期失败点，构建了一个错误分类法，其中感知分支定义了十种原子感知能力。基于这一分类法，我们构建了3000个经过验证的问题，每个问题都针对单一能力，难度源于感知而非推理或知识。'}}}, {'id': 'https://huggingface.co/papers/2607.25948', 'title': 'MODUS: Decoder-Only Any-to-Any Modeling of Diverse Modalities', 'url': 'https://huggingface.co/papers/2607.25948', 'abstract': "Abstract  Any-to-any models predict any modality from any combination of others within a single network, a formulation used in multimodal vision and vision-language models, and increasingly in scientific domains such as ecology and astronomy. Existing any-to-any models are typically trained from scratch using encoder-decoder or diffusion architectures, impacting their performance and preventing them from using strong pre-trained decoder-only models as a prior. In this work, we investigate decoder-only any-to-any multimodal modeling, which treats all modalities symmetrically and supports arbitrary modalities as inputs and outputs without modality-specific heads, losses, or task pipelines. Because every modality is both an input and an output of the same model, the resulting model, named Modus, can support a range of applications, such as chained generation through intermediate modalities or cross-modal self-verification by scoring the model's own outputs with another generated modality. Modus demonstrates strong out-of-the-box performance and is competitive with specialist and multitask baselines using a single model across various benchmarks. All materials are open-sourced at https://modus-multimodal.epfl.ch/.", 'score': 8, 'issue_id': 2787, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'd01c14ce19179f5b', 'authors': ['Mingqiao Ye', 'Zhaochong An', 'Zhitong Gao', 'Xian Liu', 'François Fleuret', 'Chuan Li', 'Amir Zadeh', 'Serge Belongie', 'Afshin Dehghan', 'Jesse Allardice', 'David Mizrahi', 'Oğuzhan Fatih Kar', 'Roman Bachmann', 'Amir Zamir'], 'affiliations': ['Apple', 'CUHK', 'EPFL', 'Lambda AI', 'University of Copenhagen', 'University of Geneva'], 'pdf_title_img': 'assets/pdf/title_img/2607.25948.jpg', 'data': {'categories': ['#multimodal', '#architecture'], 'emoji': '🔀', 'ru': {'title': 'Единая мультимодальная модель без модальности-специфичных компонентов', 'desc': 'В работе предлагается подход к построению универсальных мультимодальных моделей на основе decoder-only архитектуры, которая обрабатывает все модальности симметрично без специальных головок или потерь для каждой модальности. Модель Modus позволяет предсказывать любую модальность из любой комбинации других в одной сети, используя предварительно обученные веса как приор. Благодаря симметричной обработке, модель поддерживает цепочечную генерацию через промежуточные модальности и кросс-модальную самопроверку путём оценки собственных выходов другой сгенерированной модальностью. Несмотря на использование единой архитектуры, Modus показывает конкурентную производительность со специализированными моделями на различных бенчмарках.'}, 'en': {'title': 'Modus: Unifying Multimodal Predictions in One Model', 'desc': "This paper introduces Modus, a novel any-to-any multimodal model that can predict any type of data from any combination of other data types within a single framework. Unlike traditional models that require separate heads and training for each modality, Modus treats all modalities equally, allowing for flexible input and output configurations. This approach enables advanced functionalities like chained generation and cross-modal self-verification, enhancing the model's versatility. The results show that Modus performs competitively against specialized models while being easier to implement due to its unified architecture."}, 'zh': {'title': 'Modus：任意模态的多模态建模新方法', 'desc': '本文提出了一种新的多模态模型Modus，能够在同一个网络中实现任意模态之间的预测。与传统的编码器-解码器或扩散架构不同，Modus采用解码器单一结构，支持任意模态作为输入和输出。该模型的设计使得每种模态都可以作为输入和输出，促进了多种应用场景，如通过中间模态进行链式生成或跨模态自我验证。Modus在多个基准测试中表现出色，具有竞争力，且所有材料均已开源。'}}}, {'id': 'https://huggingface.co/papers/2607.25537', 'title': 'Visual prompt engineering for video models', 'url': 'https://huggingface.co/papers/2607.25537', 'abstract': 'Abstract  In the age of foundation models, a model is only as good as its prompt. For this reason, prompt engineering has become an essential technique for improving language model performance. Since video models are currently becoming foundation models for visual tasks (e.g., visual reasoning), we here ask whether they similarly benefit from visual prompt engineering: automatically modifying the task image to improve model performance. For example, for a visual physics reasoning task ("Where does the ball land, after passing a set of obstacles?"), an abstract sketch-like scene can be turned into a photorealistic version with a simple call to an image editing model. We find that visual prompt engineering, or VIPE for short, improves video reasoning performance across tasks. In fact, for video models, visual prompt engineering can be even more effective than classic text-based prompt engineering or test-time scaling. Ultimately, just as text-based prompt engineering systematically improves language model performance, visual prompt engineering can serve as a simple, compute-efficient approach to elicit better visual reasoning performance from video models. Example videos on our project page at https://visual-prompt-engineering.github.io/.', 'score': 7, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '268275b91f8d21e5', 'authors': ['Robert Geirhos', 'Yuxuan Li', 'Thaddäus Wiedemer', 'Neha Kalibhat', 'Zi Wang', 'Mani Malek', 'Oyvind Tafjord', 'Kevin Swersky', 'Been Kim', 'Priyank Jaini'], 'affiliations': ['Google DeepMind'], 'pdf_title_img': 'assets/pdf/title_img/2607.25537.jpg', 'data': {'categories': ['#video', '#multimodal', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Оптимизация видеомоделей через визуальное конструирование подсказок', 'desc': 'Статья исследует применение техники инженерии подсказок к видеомоделям, которые становятся фундаментальными моделями для визуальных задач. Авторы предлагают метод VIPE (Visual Prompt Engineering), который автоматически преобразует входные изображения задачи для улучшения производительности видеомоделей. Они демонстрируют, что визуальная модификация входных данных может быть эффективнее традиционной текстовой инженерии подсказок при решении задач визуального рассуждения. Этот подход предоставляет простой и вычислительно экономичный способ повысить качество работы видеомоделей.'}, 'en': {'title': 'Enhancing Video Models with Visual Prompt Engineering', 'desc': "This paper discusses the importance of prompt engineering in enhancing the performance of foundation models, particularly in the context of video models for visual tasks. It introduces a technique called visual prompt engineering (VIPE), which involves modifying images to improve the model's reasoning capabilities. The authors demonstrate that VIPE can significantly boost performance in visual reasoning tasks, sometimes outperforming traditional text-based prompt engineering. Overall, the study suggests that visual prompt engineering is a practical and efficient method to enhance the effectiveness of video models in various applications."}, 'zh': {'title': '视觉提示工程：提升视频模型性能的关键', 'desc': '在基础模型时代，模型的表现与其提示密切相关，因此提示工程成为提升语言模型性能的重要技术。我们研究了视觉模型是否同样能从视觉提示工程中受益，即通过自动修改任务图像来提高模型性能。我们的实验表明，视觉提示工程（VIPE）在视频推理任务中显著提升了性能，甚至比传统的基于文本的提示工程更有效。最终，视觉提示工程为视频模型提供了一种简单且计算高效的方法，以提高其视觉推理能力。'}}}, {'id': 'https://huggingface.co/papers/2607.26004', 'title': 'Parallel Decoding Distillation for Fast Image and Video Generation', 'url': 'https://huggingface.co/papers/2607.26004', 'abstract': 'Abstract  Generation in video diffusion or flow models is computationally expensive due to the slow and iterative sampling process. Current state-of-the-art (SOTA) acceleration methods heavily rely on variational score distillation (VSD) and adversarial losses to distill diffusion models into few-step generators. Albeit achieving high-quality video generation, these training losses are notoriously hard to optimize and suffer from mode collapse, leading to loss of video diversity and lack of motion. In this paper, we introduce Parallel Decoding Distillation (PDD), a simplified and scalable trajectory-based distillation method for fast inference of diffusion and flow matching models. Our architecture and training procedure are compatible with any pre-trained model and support sampling with a varying number of function evaluations (NFE). PDD accelerates generation by predicting multiple denoising steps per network evaluation. Conceptually, it learns a representation of the mean velocity without regressing its derivative using JVPs or finite-difference approximations. Our method achieves SOTA performance with 4-8 NFE on LTX-2.3 Text-to-Video/Audio, Wan 14B Text-to-Video, and Qwen-Image Text-to-Image. Moreover, PDD presents a significant improvement in generated video diversity.', 'score': 6, 'issue_id': 2788, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '9173270c07f8c054', 'authors': ['Neta Shaul', 'Chao Liu', 'Arash Vahdat', 'Julius Berner'], 'affiliations': ['NVIDIA', 'Weizmann Institute of Science'], 'pdf_title_img': 'assets/pdf/title_img/2607.26004.jpg', 'data': {'categories': ['#inference', '#optimization', '#video', '#training', '#diffusion'], 'emoji': '⚡', 'ru': {'title': 'Быстрая генерация видео через параллельное декодирование', 'desc': 'В работе предлагается метод Parallel Decoding Distillation (PDD) для ускорения генерации видео в диффузионных моделях и моделях flow matching. Вместо использования сложных методов дистилляции на основе вариационного score distillation и adversarial losses, авторы применяют упрощённый подход, основанный на траекториях, который предсказывает несколько шагов денойзинга за одну оценку сети. Метод обучается представлению средней скорости изменения без необходимости вычисления производных через JVP или конечные разности. PDD достигает лучших результатов современных методов при 4-8 функциональных оценках и значительно улучшает разнообразие генерируемых видео.'}, 'en': {'title': 'Accelerating Video Generation with Parallel Decoding Distillation', 'desc': 'This paper addresses the challenges of slow and computationally expensive video generation in diffusion models. It introduces a new method called Parallel Decoding Distillation (PDD), which simplifies the distillation process and allows for faster inference. PDD enhances video generation by predicting multiple denoising steps in a single network evaluation, improving efficiency without sacrificing quality. The method not only achieves state-of-the-art performance but also significantly increases the diversity of generated videos.'}, 'zh': {'title': '加速视频生成，提升多样性！', 'desc': '本论文提出了一种名为并行解码蒸馏（PDD）的方法，用于加速视频扩散模型的生成过程。传统的加速方法依赖于变分评分蒸馏和对抗损失，虽然能生成高质量视频，但优化困难且容易导致模式崩溃，影响视频多样性。PDD通过在每次网络评估中预测多个去噪步骤，简化了生成过程，并且与任何预训练模型兼容。实验结果表明，PDD在生成视频的多样性和质量上均达到了最先进的性能。'}}}, {'id': 'https://huggingface.co/papers/2607.25669', 'title': 'OmniDelta: Skill-Driven Budget Allocation for Token Compression in OmniLLMs', 'url': 'https://huggingface.co/papers/2607.25669', 'abstract': 'Abstract  Emerging Omni-modal Large Language Models (OmniLLMs) enable unified understanding of text, audio, and video, but their long audio-video token sequences introduce substantial memory and inference costs. Existing compression methods mainly focus on selecting important tokens under fixed budgets, leaving the preceding budget-allocation problem underexplored. We show that direct query-to-audio/video similarity is unreliable for inter-modal budget allocation, and that uniform intra-modal budgets can miss key evidence while retaining redundant content. To address these limitations, we propose OmniDelta, a training-free, skill-driven framework that couples intent-aware inter-modal allocation with content-aware intra-modal allocation. OmniDelta first constructs audio and video skill pools to shift the fixed retained-token budget according to query demand, then reallocates modality budgets over audio segments and video frames using local complexity and temporal redundancy. The resulting local budgets can be combined with existing pruning strategies, preserving the total retained-token ratio while changing where the budget is spent. Experiments on four audio-video benchmarks with two Qwen2.5-Omni models show that OmniDelta establishes a new accuracy-efficiency Pareto frontier across pruning ratios. At 25% token retention on Qwen2.5-Omni-7B, OmniDelta reduces GPU memory by 22.0% and achieves a 1.64x end-to-end speedup over full-token inference.', 'score': 5, 'issue_id': 2786, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '69cead419fb6e904', 'authors': ['Haoyang Huang', 'Wenjie Huang', 'Tianqi Xu', 'Hongyaoxing Gu', 'Kang Tan', 'Yikai Fu', 'Yuhao Shen', 'Tianyu Liu', 'Baolin Zhang', 'Jun Zhang', 'Xinyi Hu', 'Jun Dai', 'Shuang Ge', 'Lei Chen', 'Yue Li', 'Mingchen Wang', 'Meng Zhang'], 'affiliations': ['Carnegie Mellon University', 'Qwen Application, Alibaba', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25669.jpg', 'data': {'categories': ['#video', '#multimodal', '#inference', '#audio'], 'emoji': '⚡', 'ru': {'title': 'Умное распределение токенов для эффективной обработки мультимодальных данных', 'desc': 'В статье предлагается OmniDelta — метод оптимизации мультимодальных больших языковых моделей, которые обрабатывают текст, аудио и видео одновременно. Основная проблема заключается в том, что длинные последовательности токенов аудио и видео требуют значительных вычислительных ресурсов и памяти. Авторы показывают, что стандартные подходы к выбору важных токенов неэффективны, и предлагают новый алгоритм, который умно распределяет бюджет токенов между модальностями на основе сложности контента и требований запроса. Экспериментальные результаты демонстрируют, что OmniDelta достигает ускорения в 1.64 раза при сохранении качества модели.'}, 'en': {'title': 'Optimizing Resource Allocation in Omni-modal Language Models', 'desc': 'The paper introduces OmniDelta, a novel framework designed to optimize the allocation of resources in Omni-modal Large Language Models (OmniLLMs) that process text, audio, and video. It addresses the challenges of high memory and inference costs caused by long audio-video token sequences by implementing a skill-driven approach to budget allocation. OmniDelta improves upon existing methods by dynamically adjusting the allocation of tokens based on the importance of content and the demands of the query, rather than using fixed budgets. Experimental results demonstrate that OmniDelta significantly enhances efficiency, achieving faster processing speeds and reduced memory usage while maintaining accuracy across various benchmarks.'}, 'zh': {'title': '优化多模态预算分配的OmniDelta框架', 'desc': '本文介绍了一种新型的OmniDelta框架，旨在优化多模态大语言模型（OmniLLMs）在处理音频和视频时的预算分配问题。传统的压缩方法主要关注在固定预算下选择重要的标记，但未能有效解决预算分配的挑战。OmniDelta通过构建音频和视频的技能池，根据查询需求动态调整保留标记的预算，并利用局部复杂性和时间冗余重新分配模态预算。实验结果表明，OmniDelta在保持标记保留比例的同时，显著提高了准确性和效率，减少了GPU内存使用并加快了推理速度。'}}}, {'id': 'https://huggingface.co/papers/2607.24176', 'title': 'Where Quality Breaks in Compressed Short-Text Generation: Staged Bottleneck Localization', 'url': 'https://huggingface.co/papers/2607.24176', 'abstract': 'Abstract  Compressed short-text generators can fail in two different places: the codec may discard information before generation starts, or the latent generator may produce weak codes. Without separating these failure modes, researchers can spend compute improving the wrong component. We study this problem in a controlled 64-to-16 TinyStories case study built from a hierarchical VQ-VAE-2 codec and a masked discrete diffusion generator (MDLM). We use a staged validation protocol that separates codec reconstruction fidelity, latent generation quality, and auxiliary latent diagnostics under one shared external GPT-2 scorer, while reporting complementary semantic metrics for the geometry study. In the tested configuration, codec reconstruction alone raises median external perplexity from 15.17 to 27.36 (+80.4%) and p95 from 25.10 to 98.91 (+294.1%), showing that the dominant quality loss appears before latent generation begins. Under the same scorer, code-space MDLM remains materially stronger than token-space diffusion, reducing mean, median, and p95 by 32.9%, 30.9%, and 36.6%, respectively. Geometry-aware regularization improves local latent proxies but does not improve decoded-text metrics in the available runs. The contribution is methodological rather than algorithmic: the paper presents a reusable staged diagnosis for one concrete pipeline and shows that, in this setting, codec fidelity rather than latent denoising sets the practical quality ceiling.', 'score': 3, 'issue_id': 2788, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '298dc1709be42f98', 'authors': ['Alexey Gavrilov', 'Alan-Barsag Gazzaev', 'Sergey Muravyov'], 'affiliations': ['ITMO University Saint-Petersburg, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2607.24176.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training', '#diffusion', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Диагностика компонентов: где теряется качество в сжатых генераторах текста', 'desc': 'В этой работе авторы исследуют причины неудач в системах сжатого генерирования коротких текстов, разделяя две основные проблемы: потеря информации в кодеке и низкое качество генерации в скрытом пространстве. Для диагностики используется иерархический VQ-VAE-2 кодек и маскированный дискретный diffusion генератор (MDLM) в контролируемом эксперименте. Авторы разработали многоэтапный протокол валидации, который отдельно оценивает верность реконструкции кодека, качество генерации скрытых кодов и вспомогательные диагностики с помощью единого внешнего оценивателя GPT-2. Результаты показывают, что основная потеря качества происходит на этапе кодирования, а не при генерации, что позволяет исследователям сосредоточить вычислительные ресурсы на совершенствовании наиболее слабого компонента.'}, 'en': {'title': 'Codec Fidelity: The Key to Better Text Generation', 'desc': 'This paper investigates the failure points in compressed short-text generators, specifically focusing on the codec and the latent generator. It introduces a staged validation protocol that distinguishes between codec reconstruction quality and latent generation performance, using a shared external scorer. The study reveals that most quality loss occurs before the latent generation phase, emphasizing the importance of codec fidelity. The findings suggest that improving codec reconstruction can significantly enhance overall text generation quality, highlighting a methodological approach to diagnosing issues in text generation pipelines.'}, 'zh': {'title': '编码器质量决定生成文本的上限', 'desc': '这篇论文研究了压缩短文本生成器的两个主要失败模式：编码器在生成开始前丢失信息，或潜在生成器产生弱编码。通过一个64到16的TinyStories案例研究，作者使用了分层VQ-VAE-2编码器和掩蔽离散扩散生成器（MDLM）。研究表明，编码器重建的质量对生成文本的质量影响显著，编码器的重建精度提升可以显著提高外部困惑度。论文提出了一种可重用的分阶段诊断方法，强调在特定设置中，编码器的保真度比潜在去噪更能决定生成文本的质量上限。'}}}, {'id': 'https://huggingface.co/papers/2607.25091', 'title': 'Towards Robust Reinforcement Learning for Small-Scale Language Model Agents', 'url': 'https://huggingface.co/papers/2607.25091', 'abstract': 'Abstract  The alignment of Small Language Models (SLMs) in the 70--500M parameter range using reinforcement learning is often considered unstable, though the underlying failure mechanisms have not been systematically investigated. In the State-of-the-Art (SOTA) research, fifteen (model, corpus) configurations were trained using Proximal Policy Optimization (PPO). The experiments included Pythia-70M, 160M, 410M and SmolLM2-135M, 360M on the TinyStories, CNN/DailyMail, and Wikitext-103 corpora. Three reproducible failure modes were identified in small-scale language models: silent LoRA parameter freezing in standard PEFT/TRL pipelines, numerical overflow in importance ratios when using bfloat16, and catastrophic policy collapse due to reward-model error. These issues were addressed using a merge-and-reinitialize adapter technique, float32 precision during PPO updates, and a three-layer safety mechanism comprising reward whitening, importance-ratio guarding, and weight rollback. In this paper, a capacity-headroom hypothesis is proposed, which states that PPO performance at the SLM scale depends on both a fluent supervised model (PPL<20) and a discriminative reward signal, rather than on the number of model parameters. The proposed system converged stably in all experiments and improved preference win rate over the SFT baseline in configurations with a fluent prior and an informative reward signal. Furthermore, it outperformed instruction-tuned baselines while requiring significantly less training data. All checkpoints, preference datasets, and training scripts are publicly released^§.', 'score': 3, 'issue_id': 2785, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '5b2dcfcc82a34562', 'authors': ['Md Rezwanul Haque', 'Md. Milon Islam', 'Fakhri Karray'], 'affiliations': ['Centre for Pattern Analysis and Machine Intelligence, Department of Electrical and Computer Engineering, University of Waterloo', 'Department of Computer Science and Engineering, Khulna University of Engineering & Technology', 'Department of Machine Learning, Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2607.25091.jpg', 'data': {'categories': ['#open_source', '#training', '#rlhf', '#small_models', '#alignment', '#dataset', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Стабильное выравнивание маленьких языковых моделей через механизмы безопасности и адаптивные техники обучения', 'desc': 'Статья посвящена проблеме нестабильности при обучении маленьких языковых моделей (70-500M параметров) с помощью обучения с подкреплением, в частности алгоритма PPO. Авторы систематически исследовали три основных механизма отказа: замораживание параметров LoRA, численные переполнения при использовании bfloat16 и коллапс политики из-за ошибок модели награды. Для решения этих проблем предложены специальные техники: переинициализация адаптеров, использование float32 точности и трёхслойный механизм безопасности с нормализацией награды и откатом весов. Авторы также выдвинули гипотезу о том, что успех PPO для маленьких моделей зависит от качества начальной модели и информативности сигнала награды, а не от количества параметров.'}, 'en': {'title': 'Stabilizing Small Language Models with Smart Training Techniques', 'desc': 'This paper investigates the challenges of aligning Small Language Models (SLMs) using reinforcement learning, particularly focusing on models with 70 to 500 million parameters. The authors identify three main failure modes that can lead to instability during training, including issues with parameter freezing and numerical overflow. To address these problems, they propose a new technique that combines adapter merging and reinitialization, along with a safety mechanism to ensure stable training. Their findings suggest that the performance of SLMs is more dependent on the quality of the supervised model and the reward signal than on the number of parameters, leading to improved training outcomes with less data.'}, 'zh': {'title': '小型语言模型的稳定性与强化学习的对齐', 'desc': '本文探讨了小型语言模型（SLMs）在70到500M参数范围内使用强化学习的对齐问题，发现其不稳定性背后的机制尚未系统研究。通过使用近端策略优化（PPO）训练了十五种（模型，语料库）配置，识别出三种可重复的失败模式，包括LoRA参数冻结、bfloat16的数值溢出和奖励模型错误导致的策略崩溃。为了解决这些问题，提出了合并与重新初始化适配器技术、在PPO更新中使用float32精度，以及三层安全机制。研究还提出了一个容量余量假设，认为PPO在SLM规模上的表现依赖于流畅的监督模型和判别奖励信号，而不仅仅是模型参数的数量。'}}}, {'id': 'https://huggingface.co/papers/2607.25572', 'title': 'Mapping CVEs to MITRE ATT&CK Techniques: A Curated Gold-Set Classifier and the Limits of LLM-Assisted Label Expansion', 'url': 'https://huggingface.co/papers/2607.25572', 'abstract': 'Abstract  We present a reproducible pipeline for mapping Common Vulnerabilities and Exposures (CVEs) to MITRE ATT&CK Enterprise techniques from free-text vulnerability descriptions. Rather than relying on the CWE->CAPEC->ATT&CK derivation chain, whose table-expansion artifacts we quantify, we train a multi-label classifier on a curated gold dataset of 1,207 CVEs from expert MITRE Center for Threat-Informed Defense mappings. The resulting model approximately doubles recall@5 compared with a zero-shot embedding-similarity baseline and improves every ranking metric. We then investigate whether LLM-assisted labeling can extend the gold dataset. Initial experiments suggest contradictory conclusions: a single run indicates degraded performance, while averaging over five random seeds suggests a small gain. However, an independent replication and an expansion-size study (100--984 additional CVEs) show that the apparent improvement is an evaluation artifact. LLM-generated labels, with approximately 0.39 agreement with expert annotations, provide no reliable improvement at any expansion size and reduce rare-technique coverage at around 1,000 added CVEs (macro-F1 decreases by 0.04). The root cause is evaluation noise. Selecting checkpoints on a small test split effectively maximizes over many noisy evaluations, producing recall@5 differences of up to 0.05 between otherwise identical runs. Using a corrected protocol based on validation-split checkpoint selection, the gold-only model achieves recall@5 of (0.673 \\pm 0.019), and repeating the decisive experiment confirms the null result for LLM expansion. A final scaling study shows that additional expert-curated data consistently improves performance, whereas LLM-labeled data does not, indicating that the classifier is limited by label quality rather than dataset size. All datasets, models, code, and training logs are publicly released.', 'score': 2, 'issue_id': 2787, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'bf5db059275c4356', 'authors': ['Cédric Bonhomme', 'Alexandre Dulaunoy'], 'affiliations': ['Computer Incident Response Center Luxembourg (CIRCL)'], 'pdf_title_img': 'assets/pdf/title_img/2607.25572.jpg', 'data': {'categories': ['#security', '#open_source'], 'emoji': '🛡️', 'ru': {'title': 'Экспертные данные лучше, чем автоматическая разметка LLM', 'desc': 'В работе представлена воспроизводимая система для классификации уязвимостей (CVE) по методам атак MITRE ATT&CK с использованием многоклассового классификатора. Авторы обучили модель на проверенном наборе из 1207 CVE с экспертными разметками, что позволило значительно улучшить качество предсказаний по сравнению с базовыми подходами. Исследование показало, что использование LLM для расширения датасета не приносит надежного улучшения из-за низкого качества автоматической разметки и артефактов при оценке модели. Авторы демонстрируют, что качество классификатора ограничено качеством разметки, а не размером данных, и рекомендуют использовать только экспертную разметку.'}, 'en': {'title': 'Enhancing CVE Mapping with Quality Labels, Not Quantity', 'desc': 'This paper introduces a reproducible method for linking Common Vulnerabilities and Exposures (CVEs) to MITRE ATT&CK techniques using a multi-label classifier trained on a curated dataset. The model significantly improves recall metrics compared to traditional methods, demonstrating the effectiveness of using expert mappings. However, experiments with LLM-generated labels reveal that they do not enhance performance and may even reduce the quality of rare technique coverage. The findings emphasize the importance of high-quality labels over merely increasing dataset size for improving classifier performance.'}, 'zh': {'title': '提升漏洞映射的智能分类器', 'desc': '本文提出了一种可重复的流程，将常见漏洞和暴露（CVE）映射到MITRE ATT&CK企业技术，基于自由文本的漏洞描述。我们训练了一个多标签分类器，使用了来自MITRE专家的1207个CVE的金标准数据集。实验结果显示，该模型在召回率@5上大约提高了一倍，并且改善了所有排名指标。尽管初步实验对LLM辅助标注的效果得出了矛盾的结论，但最终结果表明，LLM生成的标签并未提供可靠的改进，且在扩展数据集时会降低稀有技术的覆盖率。'}}}, {'id': 'https://huggingface.co/papers/2607.24882', 'title': 'Agent Retrieval Bench: Evaluating Repository Context Retrieval for Coding Agents', 'url': 'https://huggingface.co/papers/2607.24882', 'abstract': 'Abstract  Modern coding agents are usually evaluated by whether they eventually produce a correct patch, but patch generation depends on an earlier context-acquisition stage: finding the repository files needed for the task. We introduce Agent Retrieval Bench, a file-level benchmark for this upstream retrieval problem. Samples are built from real coding-workflow signals and evaluated against frozen base-commit repositories, with relevance defined by what an agent needs next rather than direct query-file semantic similarity. The benchmark covers four positive-retrieval tasks: code2test, comment2context, trace2code, and edit2ripple; a fifth subset evaluates selective retrieval using natural evidence-backed no-gold cases and counterfactual wrong-repository controls. Agent Retrieval Bench contains 427 samples across 25 repositories: 345 positive examples, 50 natural no-gold examples, and 32 counterfactual controls. The corpus includes 308 base-commit snapshots, 392,000 files, and 7.9 million chunks. We evaluate lexical retrieval, RepoMap, open-source embeddings, selective abstention, and logged agent context selection. No single retrieval family dominates: Qwen3-Embedding-4B has the best sample-weighted MRR on positive samples, Qwen3-Embedding-8B the best Recall@20, and RepoMap the best budgeted context yield at 8K tokens, with task-level winners differing substantially. Selective thresholds calibrated with counterfactual controls do not improve selective success on natural no-gold cases, revealing a calibration gap. Logged trajectories also miss every gold file on 27-35 percent of samples. A controlled seed-intervention pilot finds th
