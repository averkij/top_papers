at retrieval-derived initial context yields higher file F1 with less post-seed exploration than random non-gold context, while oracle gold context shows substantial remaining headroom.', 'score': 2, 'issue_id': 2791, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'd20b9eb30f5f8e4c', 'authors': ['Bowen Qin', 'Yi Xie'], 'affiliations': ['National University of Singapore (NUS)', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2607.24882.jpg', 'data': {'categories': ['#dataset', '#agents', '#open_source', '#benchmark', '#plp', '#optimization', '#rag'], 'emoji': '🔍', 'ru': {'title': 'Правильный поиск файлов — основа успешного кодирования агентами', 'desc': 'В работе представлен Agent Retrieval Bench — первый бенчмарк для оценки задачи поиска релевантных файлов репозитория, которая предшествует генерации патча в агентах кодирования. Релевантность файлов определяется на основе реальных сигналов рабочего процесса разработчиков, а не семантического сходства с запросом. Бенчмарк включает четыре основные задачи поиска и подмножество для оценки избирательного поиска с контрольными примерами и контрфактическими случаями. Оценка различных методов поиска (лексических, эмбеддингов и других) показала, что не существует универсального решения: разные подходы доминируют на разных метриках и задачах, а стандартные методы калибровки не устраняют разрыв между контролируемыми и естественными сценариями.'}, 'en': {'title': 'Enhancing Code Patch Generation through Context-Aware File Retrieval', 'desc': "This paper presents the Agent Retrieval Bench, a benchmark designed to evaluate the effectiveness of coding agents in retrieving the necessary files for generating code patches. It emphasizes the importance of context acquisition before patch generation, focusing on the relevance of files based on the agent's next needs rather than just their semantic similarity. The benchmark includes various retrieval tasks and a diverse dataset of real coding workflows, highlighting the challenges in achieving effective file retrieval. The findings reveal that no single retrieval method is superior across all tasks, indicating the complexity of the retrieval problem in coding environments."}, 'zh': {'title': '提升编码代理的上下文检索能力', 'desc': '现代编码代理的评估通常关注其是否能生成正确的补丁，但补丁生成依赖于先前的上下文获取阶段，即找到完成任务所需的代码库文件。我们提出了Agent Retrieval Bench，这是一个针对文件级检索问题的基准测试，样本来源于真实的编码工作流程信号，并根据代理下一步所需的内容进行评估，而不是直接的查询文件语义相似性。该基准涵盖四个正向检索任务，并评估使用自然证据的选择性检索，包含427个样本和25个代码库。我们的评估显示，没有单一的检索方法占主导地位，不同任务的最佳表现者各不相同，揭示了选择性成功的校准差距。'}}}, {'id': 'https://huggingface.co/papers/2607.25236', 'title': 'VisualPatchWorld: Code World Models as Latent Structured Representations for Planning', 'url': 'https://huggingface.co/papers/2607.25236', 'abstract': "Abstract  Different research lines use the term world model in different ways, yet they share a common aim: to capture how the world evolves under action in a form that supports perception, simulation, and planning. Two prominent realizations are neural predictors that learn dynamics in continuous vector spaces, and hand-built physics engines that expose explicit state and physical laws. Neural predictors scale from data but leave the form of the dynamics implicit; physics engines are inspectable and editable but difficult to construct at scale. We introduce VisualPatchWorld (VPW), which represents world dynamics as code. VPW first selects a qualitative dynamical form with short active probes, then fits that form's free parameters from recorded state-action traces by minimizing multi-step prediction error. The resulting programs can be rolled forward like a simulator, inspected in source form, and used inside model-predictive control; image-derived scene graphs can supply the live state at replan time. Across comparisons with prior code-based world models, VPW attains 69.0% mean planning success and exceeds the strongest code baseline by 23.5 points. The largest gains arise when choosing the correct qualitative dynamics is essential. Under the same planner, the induced models approach ground-truth engine success on navigation and grasp-rich control; a residual gap remains for contact-rich pushing, and checking a shortlist of promising plans in the engine closes most of that gap. These results establish a practical route toward automatically constructed code world models that are useful for planning. Code is available at https://github.com/HKBU-KnowComp/VisualPatchWorld/.", 'score': 1, 'issue_id': 2788, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '3c9b0c7d39476a15', 'authors': ['Jiaxin Bai', 'Jiaxuan Xiong'], 'affiliations': ['Hong Kong Baptist University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25236.jpg', 'data': {'categories': ['#robotics', '#optimization', '#training', '#open_source', '#reasoning', '#cv'], 'emoji': '🌍', 'ru': {'title': 'Автоматическое построение интерпретируемых кодовых моделей мира для планирования', 'desc': 'В работе предложен VisualPatchWorld — новый подход к построению моделей мира, который представляет динамику окружающей среды в виде исполняемого кода. Метод сначала автоматически выбирает качественную форму динамики с помощью активных проб, а затем подгоняет параметры этой модели по записанным траекториям состояние-действие, минимизируя ошибку многошагового предсказания. Полученные программы можно выполнять как симулятор, инспектировать в исходном коде и использовать для планирования движений с помощью model-predictive control. Экспериментальные результаты показывают, что VPW превосходит существующие кодовые модели мира на 23.5 пункта и достигает 69% успеха при планировании, особенно эффективно работая в случаях, когда выбор правильной формы динамики критичен.'}, 'en': {'title': 'VisualPatchWorld: Bridging Neural Predictors and Physics Engines for Effective Planning', 'desc': 'This paper introduces VisualPatchWorld (VPW), a novel approach to creating world models that represent dynamics as code. VPW combines the strengths of neural predictors and physics engines by selecting a qualitative dynamical form and fitting its parameters using state-action data. This method allows for easy inspection and modification of the model while achieving high planning success rates. The results demonstrate that VPW can effectively support planning tasks, particularly in navigation and control scenarios, while also providing a pathway for automated code generation in world modeling.'}, 'zh': {'title': '自动构建有助于规划的世界模型', 'desc': '本文介绍了一种新的世界模型——VisualPatchWorld (VPW)，它通过代码来表示世界动态。VPW首先使用短期的主动探测选择一种定性的动态形式，然后通过最小化多步预测误差来拟合该形式的自由参数。与传统的基于代码的世界模型相比，VPW在规划成功率上达到了69.0%，并且超越了最强的代码基线。该方法在选择正确的定性动态时表现出显著的优势，为自动构建有助于规划的代码世界模型提供了一条实用的路径。'}}}, {'id': 'https://huggingface.co/papers/2607.25337', 'title': 'Temporal-Distance JEPA: Plan-Aware Representation Learning for Latent World Model Predictive Control', 'url': 'https://huggingface.co/papers/2607.25337', 'abstract': "Abstract  Joint-Embedding Predictive Architectures (JEPAs) learn world models by predicting in representation space rather than reconstructing pixels, making them a natural backbone for latent model predictive control from offline demonstration logs. JEPA-style training optimizes short-horizon latent prediction, whereas planning requires a multi-step ranking of imagined futures by goal progress. Prior JEPA planners often inherit that ranking from embedding geometry, typically latent Euclidean distance, which arises as a byproduct of representation learning rather than as a progress cost mined from the logs. We propose temporal-distance JEPA (TD-JEPA), which retains the LeWM encoder--predictor backbone and mines a directed temporal cost from reward-free trajectories: same-trajectory step order supplies positive targets, cross-trajectory pairs act as heuristic negatives, and a rollout-consistency term matches the planner horizon. The mined supervision serves two roles: as the deployed planning cost when progress is topological, and as a representation signal that improves Euclidean planning when contact geometry dominates. Under locked evaluation, deploying the mined cost raises Two-Room success to 100.0% versus LeWM's 97.4%, while shared Euclidean planning on the same temporally trained checkpoint raises OGB-Cube by 14.2 points over LeWM and improves Push-T. Against LeWM and the concurrent RC-aux baseline under locked evaluation, TD-JEPA matches or exceeds both methods on every environment. Ablations show that the directed head, cross-trajectory negatives, and rollout consistency each contribute. TD-JEPA narrows the train--plan gap for JEPA world-model planners by discovering temporal progress structure in offline logs and co-designing cost form with plan-time deployment. Code is available at https://github.com/HKBU-KnowComp/TD-JEPA.", 'score': 1, 'issue_id': 2788, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'ef0913a8ab33dc7e', 'authors': ['Jiaxin Bai', 'Jiaxuan Xiong'], 'affiliations': ['Hong Kong Baptist University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25337.jpg', 'data': {'categories': ['#architecture', '#training', '#robotics'], 'emoji': '🗺️', 'ru': {'title': 'Добывая временную прогрессию: научите мир планировать лучше', 'desc': 'Статья предлагает улучшение архитектур предсказания совместных представлений (JEPA) для обучения моделей мира на основе офлайн логов демонстраций. Вместо использования евклидова расстояния в пространстве представлений для ранжирования воображаемых траекторий, авторы предлагают добывать направленную стоимость из самих траекторий, используя информацию о временном порядке шагов. Метод использует пары шагов из одной траектории как положительные примеры и пары из разных траекторий как отрицательные примеры для обучения функции стоимости. Экспериментальные результаты показывают, что добытая стоимость значительно улучшает производительность планирования в различных робототехнических задачах по сравнению с базовыми методами.'}, 'en': {'title': 'Enhancing Planning with Temporal Insights in JEPA Models', 'desc': 'Joint-Embedding Predictive Architectures (JEPAs) focus on learning world models by predicting outcomes in a representation space instead of directly reconstructing images. The proposed temporal-distance JEPA (TD-JEPA) enhances planning by using a mined temporal cost from offline demonstration logs, which helps in ranking imagined future states based on goal progress. This method improves the efficiency of planning by utilizing both positive and negative examples from trajectories, leading to better decision-making in multi-step scenarios. The results show that TD-JEPA significantly outperforms previous models, achieving higher success rates and better planning performance across various environments.'}, 'zh': {'title': '时间距离JEPA：提升模型预测控制的创新方法', 'desc': '联合嵌入预测架构（JEPA）通过在表示空间中进行预测来学习世界模型，而不是重建像素，这使其成为离线演示日志中潜在模型预测控制的自然基础。我们提出了时间距离JEPA（TD-JEPA），它保留了LeWM编码器-预测器的结构，并从无奖励轨迹中挖掘出有向时间成本。挖掘的监督信号在规划时作为进展成本，同时也改善了欧几里得规划。实验结果表明，TD-JEPA在多个环境中超越了之前的方法，缩小了JEPA世界模型规划器的训练与规划之间的差距。'}}}, {'id': 'https://huggingface.co/papers/2607.22135', 'title': 'GLI-AL: A Multi-Modal Glioma MRI Label Resource with Unified Anatomy-Lesion Labels', 'url': 'https://huggingface.co/papers/2607.22135', 'abstract': 'Abstract  Existing BraTS-GLI datasets provide a widely used benchmark for adult glioma MRI segmentation, but their task definition focuses on tumor subregions and does not systematically represent coexisting white matter hyperintensities (WMH). In joint segmentation settings, such unlabeled abnormalities introduce task-specific label noise by treating pathological regions as normal tissue. To address this limitation, we introduce BraTS-GLI Anatomy-Lesion, a controlled-access, labels-only derived resource built from the BraTS 2023-GLI training cohort. The resource provides 1,251 unified eight-class anatomy-lesion label sets aligned with the original four-modal MRI cases, including image-repair labels for 116 cases requiring repaired imaging inputs. The cohort is organized into a 394-case purified subset and an 857-case extended subset, with case-level metadata covering label source, image-repair requirements, quality-control status, access conditions, checksums, and release boundaries. Compared with the original BraTS-GLI annotations, the resource substantially expands foreground supervision by incorporating healthy brain tissues and previously unlabeled coexisting abnormalities within a unified label space. A validation study using MedNeXt and T1/FLAIR inputs suggests that WMH-aware supervision preserves healthy-tissue segmentation performance across both in-domain GLI and external WMH datasets, while improving sensitivity to coexisting lesions relative to noisy-control training. The resource is intended for scientific research and supports joint anatomy-lesion supervision, label-noise analysis, and reproducible evaluation. Data are available at https://www.synapse.org/Synapse:syn75210889/wiki/, and code is available at https://github.com/xyx200/brats-gli-anatomy-lesion-code. The data resource DOI is https://doi.org/10.7303/SYN75210889.', 'score': 0, 'issue_id': 2789, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'e2919226cbded4b8', 'authors': ['Xingyu Xiang', 'Shuang Hao', 'Fan Wang', 'Jianhua Ma', 'Chunfeng Lian'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.22135.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Единое аннотирование мозга: анатомия и патология для лучшей сегментации опухолей', 'desc': 'В работе представлен расширенный датасет BraTS-GLI Anatomy-Lesion для сегментации опухолей мозга на МРТ-изображениях, который решает проблему немеченых аномалий белого вещества в существующих бенчмарках. Новый ресурс содержит 1251 унифицированный набор меток из восьми классов, включая здоровые ткани мозга и ранее неразмеченные патологические области, что расширяет объем супервизии для обучения моделей. Исследование валидации с использованием архитектуры MedNeXt показало, что учет белых гиперинтенсивностей при обучении сохраняет качество сегментации здоровых тканей и улучшает чувствительность к коморбидным поражениям по сравнению с шумными контролями. Ресурс предназначен для научных исследований и поддерживает совместную супервизию анатомии-поражения, анализ шума в метках и воспроизводимую оценку моделей.'}, 'en': {'title': 'Enhancing Glioma MRI Segmentation with Unified Anatomy-Lesion Labels', 'desc': 'This paper introduces the BraTS-GLI Anatomy-Lesion dataset, which enhances the existing BraTS-GLI datasets by providing a more comprehensive labeling system for MRI segmentation of gliomas. It addresses the issue of label noise caused by coexisting white matter hyperintensities (WMH) by including these abnormalities in a unified eight-class label set. The dataset consists of 1,251 labeled cases, organized into subsets with detailed metadata, allowing for better supervision in segmentation tasks. Validation results indicate that this new resource improves the sensitivity to lesions while maintaining healthy tissue segmentation performance, making it valuable for research in medical imaging and machine learning.'}, 'zh': {'title': '提升胶质瘤MRI分割的标签资源', 'desc': '现有的BraTS-GLI数据集主要用于成人胶质瘤的MRI分割，但它们的任务定义侧重于肿瘤亚区，并未系统地表示共存的白质高信号（WMH）。为了解决这一问题，我们引入了BraTS-GLI Anatomy-Lesion，这是一个基于BraTS 2023-GLI训练队列构建的受控访问、仅包含标签的资源。该资源提供了1251个统一的八类解剖-病变标签集，涵盖了116个需要修复成像输入的案例，并且大幅扩展了前景监督，纳入了健康脑组织和之前未标记的共存异常。我们的验证研究表明，WMH感知监督在保持健康组织分割性能的同时，提高了对共存病变的敏感性。'}}}, {'id': 'https://huggingface.co/papers/2607.22117', 'title': 'Projection Pursuit CPCANet for Domain Generalization', 'url': 'https://huggingface.co/papers/2607.22117', 'abstract': 'Abstract  Domain Generalization (DG) aims to learn representations robust to distribution shifts. Recent geometric alignment methods, such as CPCANet, extract domain-invariant structures through batch-wise Common Principal Component Analysis (CPCA). However, CPCANet suffers from rank-deficient covariance estimation due to the small-sample-size issue in mini-batch training. To address this limitation, we propose Projection Pursuit CPCANet (PP-CPCANet), a covariance-free framework that learns a global orthogonal basis on the Stiefel manifold and jointly optimizes it with network parameters via the Cayley transform. We further introduce a symmetry-breaking detached-median PP dispersion objective to extract common principal components (CPCs) with dense and robust optimization signals. Experiments on four DG benchmarks show that PP-CPCANet achieves SOTA performance while maintaining stable training.', 'score': 0, 'issue_id': 2789, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '07c071e9cd433dd8', 'authors': ['Yu-Hsi Chen', 'Abd-Krim Seghouane'], 'affiliations': ['The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2607.22117.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#training'], 'emoji': '🧭', 'ru': {'title': 'Без ковариационных матриц: надежное обобщение между доменами через ортогональное выравнивание', 'desc': 'Статья посвящена задаче обобщения по доменам (Domain Generalization), целью которой является обучение представлений, устойчивых к распределению данных из разных источников. Авторы предлагают PP-CPCANet, улучшенный метод геометрического выравнивания, который избегает проблемы плохо обусловленной оценки ковариационной матрицы, работая на многообразии Штифеля и используя преобразование Кэли. Для более надежной оптимизации введена нарушающая симметрию дисперсионная функция потерь, которая выделяет общие главные компоненты с плотным градиентным сигналом. Экспериментальные результаты на четырех бенчмарках показывают, что предложенный метод достигает лучшей производительности и обеспечивает стабильное обучение модели.'}, 'en': {'title': 'Robust Domain Generalization with PP-CPCANet', 'desc': 'This paper presents a new method called Projection Pursuit CPCANet (PP-CPCANet) for Domain Generalization (DG), which focuses on creating models that can perform well across different data distributions. The authors address the limitations of existing methods like CPCANet, which struggle with estimating covariance due to small sample sizes in mini-batch training. PP-CPCANet introduces a covariance-free approach that learns a global orthogonal basis on the Stiefel manifold, optimizing it alongside the network parameters. The proposed method demonstrates superior performance on various DG benchmarks while ensuring stable training processes.'}, 'zh': {'title': '投影追踪CPCANet：提升领域泛化的鲁棒性', 'desc': '领域泛化（DG）旨在学习对分布变化具有鲁棒性的表示。最近的几何对齐方法，如CPCANet，通过批量的共同主成分分析（CPCA）提取领域不变的结构。然而，CPCANet在小样本训练中存在协方差估计不足的问题。为了解决这个限制，我们提出了投影追踪CPCANet（PP-CPCANet），这是一个无协方差的框架，通过Cayley变换在Stiefel流形上学习全局正交基，并与网络参数共同优化。'}}}, {'id': 'https://huggingface.co/papers/2607.12544', 'title': 'Edge-Aware Thermal Infrared UAV Swarm Tracking', 'url': 'https://huggingface.co/papers/2607.12544', 'abstract': 'Abstract  Thermal infrared (TIR) imaging is essential for UAV swarm operations in visually degraded environments. However, tracking tiny UAVs remains challenging due to limited appearance cues, frequent occlusions, and rapid maneuvers. Despite significant progress driven by benchmarks such as the Anti-UAV challenge, existing methods primarily prioritize accuracy while overlooking the computational constraints of real-time edge deployment. The standard Kalman Filter (KF) offers the efficiency required for edge devices, yet its constant-velocity assumption often breaks down under highly dynamic UAV motion and thermal sensor jitter. More sophisticated nonlinear estimators can improve robustness but often introduce additional computational costs. To address this gap, we propose an edge-aware online tracking pipeline centered on the Adaptive Kinematic Kalman Filter (AKKF), which augments the linear KF with state-dependent kinematic modeling while preserving real-time efficiency. Combined with transient false-positive suppression and kinematics-driven predictive coasting, the presented pipeline improves trajectory continuity under challenging TIR conditions. Experiments on the Beyond Strong Baseline (BSB) benchmark provide a starting point for edge-aware UAV tracking by jointly evaluating tracking performance and computational efficiency, offering insights toward future real-time deployment.', 'score': 0, 'issue_id': 2789, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '19e938be4f45492c', 'authors': ['Yu-Hsi Chen'], 'affiliations': ['The University of Melbourne'], 'pdf_title_img': 'assets/pdf/title_img/2607.12544.jpg', 'data': {'categories': ['#cv', '#benchmark', '#robotics'], 'emoji': '🛸', 'ru': {'title': 'Эффективное отслеживание дронов в реальном времени с адаптивным фильтром Калмана', 'desc': 'Статья посвящена отслеживанию маленьких беспилотных летательных аппаратов (БПЛА) в роях с использованием тепловизионной съёмки в условиях плохой видимости. Авторы предлагают адаптивный кинематический фильтр Калмана (AKKF), который улучшает стандартный фильтр Калмана путём добавления зависящего от состояния кинематического моделирования и сохраняет при этом вычислительную эффективность для работы на граничных устройствах. Метод включает подавление ложных срабатываний и предсказательное скольжение на основе кинематики для повышения непрерывности траектории при сложных условиях тепловизионной съёмки. Экспериментальная оценка на бенчмарке BSB демонстрирует баланс между точностью отслеживания и вычислительной эффективностью для развёртывания в реальном времени.'}, 'en': {'title': 'Real-Time UAV Tracking with Adaptive Kinematic Kalman Filter', 'desc': 'This paper presents a new method for tracking small UAVs using thermal infrared imaging, which is crucial in environments with poor visibility. The authors identify challenges such as limited visual cues and rapid movements that complicate tracking efforts. They propose the Adaptive Kinematic Kalman Filter (AKKF) to enhance the traditional Kalman Filter by incorporating state-dependent kinematic modeling, allowing for better performance in dynamic situations while maintaining real-time processing capabilities. The proposed tracking pipeline also includes techniques to reduce false positives and improve trajectory continuity, making it suitable for edge deployment in UAV operations.'}, 'zh': {'title': '边缘计算下的无人机热红外跟踪新方法', 'desc': '本文提出了一种针对无人机群在热红外成像环境下的在线跟踪方法。我们使用自适应运动卡尔曼滤波器（AKKF），在保持实时效率的同时，增强了线性卡尔曼滤波器的状态依赖运动建模。该方法结合了瞬态假阳性抑制和运动驱动的预测平滑，能够在复杂的热红外条件下改善轨迹连续性。通过在Beyond Strong Baseline基准上的实验，我们为边缘计算环境下的无人机跟踪提供了初步的评估。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (2)', '#agi', '#alignment (1)', '#architecture (6)', '#audio (1)', '#benchmark (9)', '#cv (4)', '#data (1)', '#dataset (6)', '#diffusion (2)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (3)', '#interpretability', '#leakage (1)', '#long_context (1)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (7)', '#open_source (6)', '#optimization (7)', '#plp (1)', '#rag (4)', '#reasoning (4)', '#rl', '#rlhf (1)', '#robotics (4)', '#science', '#security (1)', '#small_models (3)', '#story_generation', '#survey', '#synthetic', '#training (11)', '#transfer_learning', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-29 17:07',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-29 17:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-29 17:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
