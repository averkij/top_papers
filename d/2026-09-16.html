    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.06986', 'title': 'Continual Learning Mechanisms Compose for Long-Horizon Memorization', 'url': 'https://huggingface.co/papers/2609.06986', 'abstract': 'Abstract Composing complementary continual learning mechanisms substantially improves long-horizon memorization in language models by combining data, function, and weight anchors with merged low-rank updates.  Generated by thinkingmachines/Inkling-Small Language models may need to internalize information that arrives over time and retain it through many subsequent updates. To study this challenge, we introduce long-horizon memorization, a setting in which a model learns 100 query-answer tasks through continual supervised fine-tuning without retaining earlier training examples or receiving task identifiers at inference. Sequential updates cause catastrophic forgetting, and no single continual learning mechanism we evaluate maintains strong retention at this horizon. We hypothesize that mechanisms addressing complementary sources of forgetting will be more effective when composed. We organize these compositions along two design dimensions. Data, function, and weight anchors specify what prior information each update should preserve, while low-rank allocation rules determine where successive updates are retained. To test this hypothesis systematically, we construct three distinct 100-task memorization datasets. We introduce task-level successive halving to search the combinatorial design space and use a factorial experiment to measure individual and interaction effects. Our best method combines all three anchors with merged LoRA, ranks among the top 3 methods in all datasets, and raises average final retention from 1.2% under naive sequential fine-tuning to 34.9%, a 28-fold improvement. The data anchor and merged LoRA provide the largest average gains and interact super-additively on all three datasets. Together, these results show that composing complementary mechanisms substantially improves long-horizon memorization beyond what any individual mechanism achieves.', 'score': 272, 'issue_id': 3281, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': 'd53d9583662f85b8', 'authors': ['Zheyuan Zhang', 'Alvin Zhang', 'Daniel Khashabi', 'Tianmin Shu'], 'affiliations': ['Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2609.06986.jpg', 'data': {'categories': ['#training', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Синергия механизмов: композиция якорей для запоминания в долгосрочном обучении', 'desc': 'В статье изучается проблема катастрофического забывания при последовательном обучении языковых моделей на сотне задач без доступа к исходным данным. Авторы предлагают композицию дополняющих друг друга механизмов континуального обучения: якоря данных, функций и весов в сочетании с низкорянговыми обновлениями (LoRA). Они систематически исследуют дизайн этих композиций через факторный эксперимент и поиск методом последовательного халвинга на трёх наборах данных. Лучший метод повышает сохранение знаний с 1,2% до 34,9%, демонстрируя, что комбинирование механизмов, адресующих разные источники забывания, даёт синергетический эффект.'}, 'en': {'title': 'Boosting Memory in Language Models with Combined Learning Strategies', 'desc': 'This paper discusses how to improve long-term memory in language models through a combination of different continual learning strategies. It introduces the concept of long-horizon memorization, where models learn multiple tasks without retaining previous examples. The authors propose using complementary mechanisms, such as data, function, and weight anchors, along with low-rank updates, to enhance memory retention. Their experiments show that this combined approach significantly increases retention rates compared to traditional methods, demonstrating the effectiveness of integrating various strategies in continual learning.'}, 'zh': {'title': '组合互补机制提升长期记忆能力', 'desc': '本文探讨了在语言模型中，通过组合互补的持续学习机制来显著提高长期记忆能力。研究表明，模型在没有保留早期训练样本的情况下，通过持续的监督微调学习多个查询-回答任务时，容易出现灾难性遗忘。我们提出了一种新的方法，通过数据、功能和权重锚点的组合，以及低秩更新，来有效地保留重要信息。实验结果显示，最佳方法将最终记忆保持率从1.2%提高到34.9%，证明了组合互补机制在长期记忆中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.11873', 'title': 'The Last AI Built by Humans: Toward Genuine Recursive Self-Improvement', 'url': 'https://huggingface.co/papers/2609.11873', 'abstract': 'Abstract The abstract outlines a roadmap for recursive self-improvement in AI, from autonomy stages to meta-improvement, across domains like scientific discovery and software engineering, while identifying practical challenges.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement (RSI) enables AI systems to turn experience and feedback into persistent changes that improve both their capabilities and the process of future improvement. We first use the Headroom-Closed Index (HCI) to reveal the problems of existing LLMs, then introduce the RSI concept and its development roadmap: from improvement-execution autonomy, improvement-strategy autonomy, experience-acquisition autonomy, and environment-adaptation autonomy, to recursive meta-improvement. Next we examine RSI across scenarios (e.g., scientific discovery, embodied intelligence, software engineering), highlighting their distinct requirements and development speeds. Drawing on diverse industry practices and preliminary empirical evidence, we connect RSI research with practical systems and identify key challenges to achieving genuine RSI.', 'score': 83, 'issue_id': 3282, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '10b5e3daa48e7275', 'authors': ['Yi Duan', 'Ying Liu', 'Zirui Tang', 'Haodong Chen', 'Jun Zhou', 'Yumou Liu', 'Bangrui Xu', 'Yukai Wu', 'Sidi Chen', 'Yuhan Zhou', 'Haoyu Wang', 'Xiaoyou Yu', 'Shaokun Han', 'Xuzhou Zhu', 'Le Zhou', 'Bolin Lu', 'Wei Zhou', 'Jiachen Liu', 'Nuozhou Fang', 'Jiaxin Tian', 'Ruoyu Chen', 'Yuxuan Li', 'Kai Zuo', 'Kaiyan Zhang', 'Qianyu Yang', 'Zijie Wang', 'Jiantao Qiu', 'Conghui He', 'Guoliang Li', 'Bowen Zhou', 'Zhiyuan Liu', 'Zhoufutu Wen', 'Jihua Kang', 'Xuanhe Zhou', 'Fan Wu'], 'affiliations': ['Agent-Native Research Lab', 'ByteDance', 'Frontis.AI', 'Humanlaya', 'ModelBest', 'Shanghai AI Lab', 'Shanghai Jiao Tong University', 'Super Intelligence Team, Xiaohongshu Inc.', 'Theseus Labs', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.11873.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'От опыта к совершенству: рекурсивное самосовершенствование AI систем', 'desc': 'Статья представляет дорожную карту для рекурсивного самосовершенствования AI систем, которые превращают опыт и обратную связь в устойчивые улучшения своих возможностей. Авторы используют метрику Headroom-Closed Index для выявления проблем современных языковых моделей и предлагают пятиуровневую схему развития: от автономии в выполнении улучшений до полного рекурсивного мета-улучшения. Исследование анализирует применение рекурсивного самосовершенствования в различных областях, таких как научные открытия, воплощённый интеллект и разработка программного обеспечения. Авторы соединяют теоретические концепции с практическими системами и определяют ключевые вызовы на пути к достижению истинного рекурсивного самосовершенствования.'}, 'en': {'title': 'Empowering AI Through Recursive Self-Improvement', 'desc': 'This paper presents a roadmap for Recursive Self-Improvement (RSI) in AI, which allows systems to enhance their abilities and improve their improvement processes over time. It introduces the Headroom-Closed Index (HCI) to analyze the limitations of current large language models (LLMs) and outlines a structured approach to achieving various levels of autonomy in improvement strategies. The authors explore the application of RSI in different fields such as scientific discovery and software engineering, noting the unique challenges and requirements of each domain. By linking RSI research to real-world applications, the paper identifies significant obstacles that must be overcome to realize effective recursive self-improvement in AI systems.'}, 'zh': {'title': '人工智能的递归自我改进之路', 'desc': '这篇论文提出了人工智能递归自我改进的路线图，涵盖了从自主阶段到元改进的各个领域，如科学发现和软件工程。递归自我改进（RSI）使得AI系统能够将经验和反馈转化为持久的变化，从而提升其能力和未来改进的过程。论文首先使用头部闭合指数（HCI）揭示了现有大型语言模型（LLM）的问题，然后介绍了RSI的概念及其发展路线图。最后，论文探讨了RSI在不同场景下的应用，强调了各自的独特需求和发展速度。'}}}, {'id': 'https://huggingface.co/papers/2609.16679', 'title': 'AI for Games in the Foundation Model Era', 'url': 'https://huggingface.co/papers/2609.16679', 'abstract': 'Abstract  Foundation models, alongside advances in learned game-world models, are reshaping AI across the game lifecycle. Beyond playing games, recent systems model players and game dynamics, support design and development, adapt player-facing experiences at runtime, and evaluate resulting artifacts. Yet these directions have evolved largely separately, obscuring which capabilities transfer across settings and which remain tied to particular games, engines, interfaces, or player populations. We organize the literature into six roles according to the immediate use of AI output: playing and acting; modeling players and games; designing games; building and maintaining games; generating and adapting at runtime; and testing and evaluating games. For each role, we examine what structure is supplied by the game or workflow, what AI learns or produces, which capabilities and artifacts transfer across settings and roles, and what evidence supports the claims. We identify cross-role connections: trajectories train world models, learned environments provide experience for agents, design specifications drive executable implementations, and play or testing feedback guides revision. However, control schemes, rules, engine interfaces, state representations, and player contexts often remain setting-specific, so downstream claims require validation in the target setting. Evaluation is most standardized for bounded game playing and selected learned environments, while persistent state in learned worlds, repeated software revision, validated player modeling, sustained runtime adaptation, and representative automated testing remain less established. The central challenge is to reuse or transfer outputs and capabilities across roles while re-establishing evidence for effectiveness in the game-specific contexts where they are used.', 'score': 63, 'issue_id': 3281, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': 'acbf0c4b68c13b8a', 'authors': ['Meng Luo', 'Yanlin Li', 'Hao Li', 'Hongzhan Lin', 'Pengfei Zhou', 'Tianjie Ju', 'Ran Zhang', 'Yeying Jin', 'Mong-Li Lee', 'Wynne Hsu'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.16679.jpg', 'data': {'categories': ['#training', '#transfer_learning', '#agents', '#multimodal', '#benchmark', '#games', '#survey'], 'emoji': '🎮', 'ru': {'title': 'AI в игровой индустрии: от единых моделей к переносимым решениям', 'desc': 'В статье рассматривается применение фундаментальных моделей и обученных моделей игровых миров на протяжении всего жизненного цикла видеоигр. Авторы систематизируют литературу по шести ролям использования AI: игровой процесс, моделирование игроков и игровой динамики, дизайн, разработка, генерация и адаптация во время игры, тестирование. Исследование выявляет связи между этими ролями через траектории обучения, обученные окружения и спецификации дизайна, но отмечает, что управление, правила и интерфейсы часто остаются специфичными для конкретной игры. Основная проблема заключается в переносе возможностей AI между разными ролями с сохранением эффективности в контексте конкретных игр.'}, 'en': {'title': 'Transforming AI Across the Game Lifecycle', 'desc': 'This paper discusses how foundation models and advanced game-world models are changing artificial intelligence (AI) in gaming. It categorizes AI applications into six roles, such as playing games, modeling players, and designing games, to understand how AI can be utilized throughout the game lifecycle. The authors highlight the importance of transferring AI capabilities across different gaming contexts while also noting that certain aspects remain specific to individual games or systems. They emphasize the need for validation of AI outputs in the specific settings where they are applied, particularly in areas like player modeling and runtime adaptation.'}, 'zh': {'title': '重塑游戏AI：跨角色能力的转移与验证', 'desc': '基础模型和学习的游戏世界模型正在重塑人工智能在游戏生命周期中的应用。除了玩游戏，最近的系统还能够模拟玩家和游戏动态，支持设计和开发，并在运行时调整玩家体验。尽管这些方向在发展上相对独立，但我们可以将文献组织成六个角色，分析AI输出的直接用途。主要挑战在于如何在不同角色之间重用或转移输出和能力，同时在特定游戏上下文中重新建立有效性证据。'}}}, {'id': 'https://huggingface.co/papers/2609.14005', 'title': 'StepAudio 3 Realtime Technical Report', 'url': 'https://huggingface.co/papers/2609.14005', 'abstract': 'Abstract  Realtime spoken interaction demands deep reasoning, prompt responses, and fluid turn-taking. We present StepAudio 3 Realtime, an audio-language foundation model organized around a continuous listen-converse-think-act loop. Deep Perception captures rich acoustic cues to interpret user intent, while Seamless Duplex models synchronized audio streams to handle pauses, backchannels, and interruptions naturally. Crucially, we resolve the tension between deep deliberation and latency via Think-While-Speaking, executing private reasoning in parallel with spoken delivery. In reasoning mode, StepAudio 3 reaches a 73.0 macro average on StepAudioChat. With Think-While-Speaking, it achieves dialogue and reasoning performance comparable to dedicated reasoning models while speaking in real time. Furthermore, an integrated Voice Agent handles asynchronous tool execution without disrupting the dialogue flow. StepAudio 3 Realtime achieves top-tier performance across key dimensions: an exceptional 90.6 on the MMSU benchmark, 98.9 Overall on the Artificial Analysis Full-Duplex Bench, and a 56.0% macro task-success rate on τ-Voice.', 'score': 21, 'issue_id': 3282, 'pub_date': '2026-09-12', 'pub_date_card': {'ru': '12 сентября', 'en': 'September 12', 'zh': '9月12日'}, 'hash': '45e880b6e867bc44', 'pdf_title_img': 'assets/pdf/title_img/2609.14005.jpg', 'data': {'categories': ['#audio', '#agents', '#benchmark', '#multimodal', '#open_source', '#reasoning'], 'emoji': '🎙️', 'ru': {'title': 'Думай пока говоришь: AI для естественного диалога в реальном времени', 'desc': 'Представлена StepAudio 3 Realtime — аудио-языковая фундаментальная модель для реальной беседы в режиме реального времени. Модель использует архитектуру с непрерывным циклом восприятия, диалога и действия, включая Deep Perception для анализа акустических сигналов и Seamless Duplex для синхронизации двусторонних потоков аудио. Ключевой инновацией является механизм Think-While-Speaking, позволяющий модели выполнять рассуждение параллельно с произнесением слов, решая противоречие между глубокой обработкой информации и минимизацией задержки. Интегрированный Voice Agent обеспечивает асинхронное выполнение инструментов без прерывания диалога, достигая лучших результатов по ключевым бенчмаркам включая MMSU (90.6) и Full-Duplex Bench (98.9).'}, 'en': {'title': 'Revolutionizing Real-Time Dialogue with Think-While-Speaking', 'desc': 'StepAudio 3 Realtime is an advanced audio-language model designed for real-time spoken interactions. It utilizes a continuous listen-converse-think-act loop to enhance communication by interpreting user intent through Deep Perception and managing audio streams with Seamless Duplex. The model introduces Think-While-Speaking, allowing it to reason while speaking, which reduces latency and improves dialogue quality. With impressive performance metrics, it demonstrates capabilities that rival specialized reasoning models while maintaining fluid conversation.'}, 'zh': {'title': '实时语音交互的新突破', 'desc': 'StepAudio 3 Realtime 是一种音频语言基础模型，旨在实现实时的语音交互。它通过深度感知技术捕捉丰富的声学线索，以理解用户意图，并通过无缝双工模型自然处理对话中的暂停和干扰。该模型的创新之处在于“边说边思考”，允许在说话的同时进行私密推理，从而减少延迟。StepAudio 3 在多个基准测试中表现出色，展示了其在对话和推理方面的强大能力。'}}}, {'id': 'https://huggingface.co/papers/2609.16034', 'title': 'StepAudio 3 Music Technical Report', 'url': 'https://huggingface.co/papers/2609.16034', 'abstract': 'Abstract  We introduce StepAudio 3 Music, a large-scale, long-form music generation model that supports explicit musical planning and open-domain text-controlled generation. The StepAudio Music Tokenizer represents audio as a 50-Hz stream from a 65536-entry single codebook, using semantically informed self-supervised and multi-task training to preserve musical structure and reconstruction-relevant information. A flow-matching diffusion Transformer (DiT) predicts continuous StepAudio VAE latents, which our VAE decoder converts into 48-kHz audio. This discrete-continuous design is guided by comparisons of single-codebook VQ, Semantic and Acoustic RVQ, and different DiT configurations. For explicit planning, a Mixture-of-Experts autoregressive model uses ABC notation to produce an intermediate arrangement plan (ABC-CoT) before predicting music tokens, making harmony, rhythm, and melodic structure part of the generation context. A progressive training curriculum and supervised fine-tuning support song and instrumental generation, accompaniment generation from dry vocals, and cover-song synthesis for up to 5 minutes and 30 seconds. With reinforcement learning via direct preference optimization (DPO), the final model achieves the highest AudioBox Content Enjoyment, Content Usefulness, and Production Quality scores and the highest MuQ-MuLan similarity among the evaluated systems, with competitive SongBench results. On the preliminary Artificial Analysis Music Arena Vocals leaderboard, it obtains a Quality Elo of 1105, behind only Suno V5.5 and Mureka and ahead of Suno V5, MiniMax models, and other systems. Audio demonstrations are available at https://stepaudiollm.github.io/step-audio-3-music.', 'score': 18, 'issue_id': 3282, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '319bf554d5d7b46a', 'authors': ['Chengli Feng', 'Zhiyue Wu', 'Jiahao Song', 'Zheqi Dai', 'Boyang Wang', 'Ruibin Yuan', 'Junming Gong', 'Wenxiao Zhao', 'Jing Guo', 'Gang Yu', 'Xiangyu Zhang', 'Xuerui Yang', 'Chao Yan'], 'affiliations': ['ACE', 'StepFun', 'The Chinese University of Hong Kong', 'University of California San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2609.16034.jpg', 'data': {'categories': ['#audio', '#diffusion', '#benchmark', '#training', '#rlhf', '#architecture', '#open_source'], 'emoji': '🎵', 'ru': {'title': 'От текста к музыке: генерация с явным планированием через гибридную архитектуру', 'desc': 'StepAudio 3 Music — это большая модель для генерации музыки длительностью до 5 с половиной минут, поддерживающая явное музыкальное планирование и управление текстом. Модель использует специальный токенайзер, который преобразует аудио в поток с частотой 50 Гц, сохраняя музыкальную структуру благодаря семантически информированному самообучению. Для генерации применяется гибридный подход: flow-matching диффузионный трансформер предсказывает непрерывные латентные представления, а для явного планирования используется модель Mixture-of-Experts с ABC-нотацией для создания промежуточного плана аранжировки. Модель достигла лучших результатов по качеству звука и музыкального содержания, превзойдя многие конкурирующие системы благодаря обучению с подкреплением через DPO.'}, 'en': {'title': 'Revolutionizing Music Generation with StepAudio 3!', 'desc': 'StepAudio 3 Music is a sophisticated model designed for generating long-form music with the ability to plan and control the output using text prompts. It utilizes a unique music tokenizer that encodes audio into a structured format, allowing for better preservation of musical elements during generation. The model employs a flow-matching diffusion Transformer to predict audio latents, which are then decoded into high-quality sound. Additionally, it incorporates a Mixture-of-Experts approach for explicit musical planning, enabling the generation of complex arrangements and achieving high scores in content enjoyment and production quality.'}, 'zh': {'title': '音乐生成的新纪元：StepAudio 3 Music', 'desc': '我们介绍了StepAudio 3 Music，这是一个大规模的长篇音乐生成模型，支持明确的音乐规划和开放领域的文本控制生成。StepAudio音乐分词器将音频表示为来自65536个条目的单一代码本的50赫兹流，采用语义信息自监督和多任务训练，以保留音乐结构和重建相关信息。该模型使用流匹配扩散Transformer（DiT）预测连续的StepAudio VAE潜变量，VAE解码器将其转换为48kHz音频。通过强化学习和直接偏好优化（DPO），最终模型在音频内容享受、内容实用性和制作质量评分中取得了最高分。'}}}, {'id': 'https://huggingface.co/papers/2609.17523', 'title': 'ScienceBuddy: Recursive-in-Recursive Self-Improvement for Interactive Scientific Agents', 'url': 'https://huggingface.co/papers/2609.17523', 'abstract': "Abstract  We introduce and release ScienceBuddy, an interactive scientific research workspace that brings continually improving scientific agents into researchers' everyday workflows. ScienceBuddy supports researchers in carrying out scientific tasks while transforming their requests, feedback, and execution evidence into tasks and evaluation rubrics for continual learning. At its core is recursive-in-recursive self-improvement, a paradigm that couples harness evolution with model reinforcement learning: the inner recursion improves the harness with the model fixed, while the outer recursion trains the model under the improved harness. Harness evolution shapes training experience, and model learning creates new opportunities for harness adaptation. We present case studies of researcher interaction, harness refinement, and model learning, with the benchmark cases spanning four scientific task families. By releasing ScienceBuddy as a research product, we make this paradigm available to the scientific community and take a step toward discovery intelligence: scientific AI that advances through sustained collaboration with researchers and evolves alongside the research it supports. Website: http://science-buddy.io", 'score': 16, 'issue_id': 3281, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': '62db9b7a95195886', 'authors': ['Shuhan Xue', 'Jianyuan Zhong', 'Ziyuan Nan', 'Wenbin Li', 'Zhaochen Yu', 'Jinchao Ding', 'Qiang Gao', 'Pengyu Zhan', 'Yuntong Zhang', 'Tian Cheng', 'Zhenfei Yin', 'Yingcheng Wu', 'Ling Yang'], 'affiliations': ['Phai Labs'], 'pdf_title_img': 'assets/pdf/title_img/2609.17523.jpg', 'data': {'categories': ['#training', '#rl', '#agents', '#open_source', '#benchmark', '#science'], 'emoji': '🧪', 'ru': {'title': 'Научный ассистент с самооптимизацией через взаимодействие с исследователями', 'desc': 'В работе представляется ScienceBuddy — интерактивная рабочая среда, которая интегрирует научных агентов в повседневный процесс научных исследований. Система преобразует запросы исследователей, их обратную связь и результаты выполнения в задачи для обучения модели. В основе подхода лежит парадигма рекурсивной самооптимизации: внутренняя рекурсия улучшает механизм исполнения при фиксированной модели, а внешняя рекурсия обучает модель на основе улучшенного механизма. Такая синергия между эволюцией архитектуры и обучением модели с подкреплением позволяет создать научный AI, который развивается в сотрудничестве с исследователями.'}, 'en': {'title': 'Empowering Researchers with Evolving AI Tools', 'desc': 'ScienceBuddy is an interactive platform designed to assist researchers in their scientific tasks by integrating intelligent agents that learn and improve over time. It utilizes a unique approach called recursive-in-recursive self-improvement, which combines harness evolution with model reinforcement learning to enhance both the tools and the learning models. This system allows for continuous adaptation and refinement based on researcher feedback and task execution evidence. By providing case studies across various scientific tasks, ScienceBuddy aims to foster a collaborative environment where AI evolves in tandem with scientific research.'}, 'zh': {'title': '科学研究的智能助手', 'desc': '我们介绍了ScienceBuddy，这是一个互动的科学研究工作空间，旨在将不断改进的科学代理融入研究人员的日常工作流程中。ScienceBuddy支持研究人员执行科学任务，同时将他们的请求、反馈和执行证据转化为任务和评估标准，以实现持续学习。其核心是递归中的递归自我改进，这种范式结合了进化的利用与模型强化学习：内层递归在固定模型的情况下改进工具，而外层递归则在改进的工具下训练模型。通过发布ScienceBuddy作为研究产品，我们使这一范式可供科学界使用，朝着发现智能的方向迈出了一步：科学AI通过与研究人员的持续合作而不断进步，并与其支持的研究共同演变。'}}}, {'id': 'https://huggingface.co/papers/2609.15972', 'title': 'Mind2Dialogue: Training Human-Aware Language Models by Simulating User Mental States', 'url': 'https://huggingface.co/papers/2609.15972', 'abstract': "Abstract  As language models become more capable, long-term collaboration in learning, reasoning, and decision-making calls for a deeper understanding of the people they serve. Yet training such human-aware language models faces a fundamental supervision gap because current datasets for LLM assistant training contain few if any well-informed responses explicitly grounded in users' unspoken beliefs and goals. Scaling such supervision is inherently constrained, as users' underlying states are not directly observable. We thus propose the Mind2Dialogue framework to mitigate this gap by simulating users' mental states and turning them into privileged supervision for human-aware training. Specifically, we first propose a psychology-guided simulator that preserves personal characteristics while updating mental states through interaction to generate coherent conversations. The key idea is to enforce a shared evolving mental state that drives user behavior and guides an Oracle assistant's responses. Our privileged distillation then trains models on the Oracle's well-informed responses to assist users without direct access to their mental states at deployment. Moreover, we propose to evaluate human-aware learning by combining personalization and theory of mind, examining how models understand people and act on that understanding. Training on the full Mind2Dialogue corpus improves every reported personalization metric over the corresponding Qwen, Llama, and OLMo instruction-tuned baselines, including gains of 26.6 to 40.9 percentage points in preference-following generation. The gains extend to belief and action reasoning on Qwen and Llama, beyond personalized assistance. Looking forward, Mind2Dialogue makes user simulation a foundation for genuine AI collaborators that understand beliefs and intentions behind people's words and support their long-term goals across education, work, and everyday life.", 'score': 4, 'issue_id': 3282, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'e02cc71696c92040', 'authors': ['Zixuan Wang', 'Yufan Zhou', 'Jinzhou Tang', 'Xinle Yu', 'Chengjun Wu', 'Lyumanshan Ye', 'Zhaoxiang Feng', 'Letian Peng', 'Adyasha Patra', 'Fan Bai', 'Enze Ma', 'Zhengding Hu', 'Jianyang Gu', 'Zhao Wang', 'Yufei Ding', 'Jingbo Shang', 'Tianmin Shu', 'Zhiting Hu', 'Zhen Wang'], 'affiliations': ['Johns Hopkins University', 'KU Leuven', 'The Ohio State University', 'UC San Diego', 'University of Illinois Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2609.15972.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Симуляция психического состояния для обучения внимательных к пользователю языковых моделей', 'desc': 'В работе предложен фреймворк Mind2Dialogue для обучения языковых моделей пониманию психического состояния пользователей через симуляцию их внутренних убеждений и целей. Авторы используют психологически обоснованный симулятор для генерации диалогов, в которых согласованное эволюционирующее ментальное состояние управляет поведением пользователя и направляет ответы эксперта-ассистента. Полученный синтетический корпус используется для обучения моделей через привилегированную дистилляцию, позволяя им предоставлять персонализированную помощь без прямого доступа к ментальному состоянию во время инференса. Экспериментальные результаты показывают значительные улучшения в метриках персонализации и теории ума, включая прирост на 26.6-40.9 процентных пункта в генерации, соответствующей предпочтениям пользователей.'}, 'en': {'title': 'Bridging the Supervision Gap for Human-Aware Language Models', 'desc': "This paper introduces the Mind2Dialogue framework, which aims to enhance language models by simulating users' mental states to provide better assistance. It addresses the challenge of a supervision gap in training, where current datasets lack insights into users' unspoken beliefs and goals. By using a psychology-guided simulator, the framework generates coherent conversations that reflect evolving mental states, allowing the model to learn from an Oracle assistant's informed responses. The results show significant improvements in personalization metrics and reasoning capabilities, suggesting that this approach can lead to more effective AI collaborators that understand and support users' long-term objectives."}, 'zh': {'title': 'Mind2Dialogue：理解用户心理的语言模型训练框架', 'desc': '随着语言模型能力的提升，理解用户的需求变得更加重要。现有的数据集在训练人性化语言模型时存在监督缺口，因为它们缺乏与用户隐含信念和目标相关的响应。为了解决这个问题，我们提出了Mind2Dialogue框架，通过模拟用户的心理状态来提供更好的监督。该框架通过心理学指导的模拟器生成连贯的对话，从而帮助模型更好地理解和支持用户的长期目标。'}}}, {'id': 'https://huggingface.co/papers/2609.15975', 'title': 'Disentangling Representation Evolution in Transformers through Directional Decomposition', 'url': 'https://huggingface.co/papers/2609.15975', 'abstract': "Abstract  Transformer representations evolve through learned additive transformations that either preserve their current direction or redirect it. We study this evolution as a functional geometry, decomposing learned updates into parallel and perpendicular components. Across pretrained models, we find substantial parallel components beyond the residual identity path. We then apply the decomposition in two spaces: to attention and MLP updates relative to the hidden state, and to attention value aggregation relative to the current token's value. Targeted edits reveal a strongly space-dependent asymmetry: exclude-self value-space parallel manipulation is markedly more robust than residual-space and perpendicular counterparts, preserving the direct self message while scaling only the non-self aggregate. The same decomposition gives a component-resolved description of compression-induced update error: perpendicular error separates compression methods more clearly than parallel error. Extensive experiments further demonstrate that full-aggregate parallel suppression during from-scratch pretraining lowers validation-loss trajectories and improves downstream averages, with the value-space variant strongest. Together, these results connect representation geometry to editing robustness, compression diagnosis, and training-time intervention. Code is available in the https://github.com/Shwai-He/Transformer-Geometry{project repository}.", 'score': 3, 'issue_id': 3282, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '96309b3aa58e6da0', 'authors': ['Shwai He', 'Haichao Zhang', 'Shen Yan'], 'affiliations': ['ByteDance', 'Northeastern University', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2609.15975.jpg', 'data': {'categories': ['#training', '#architecture'], 'emoji': '🔄', 'ru': {'title': 'Геометрия трансформеров: параллельная и перпендикулярная эволюция представлений', 'desc': 'В работе исследуется эволюция представлений в трансформерах как функциональная геометрия, где изученные обновления представлений раскладываются на параллельные и перпендикулярные компоненты. Авторы обнаружили, что в предобученных моделях существуют значительные параллельные компоненты помимо residual пути идентичности. Они применили такое разложение в пространстве внимания и MLP-слоев, а также при агрегировании значений внимания, выявив асимметрию в том, что манипуляции в пространстве значений более устойчивы к целевым редактированиям. Дополнительные эксперименты показали, что подавление параллельных компонент во время обучения с нуля улучшает траектории валидационных потерь и итоговые метрики на downstream задачах.'}, 'en': {'title': 'Transforming Representations: The Power of Parallel Components in Transformers', 'desc': "This paper explores how transformer models change their representations through learned transformations that can either maintain their direction or change it. The authors analyze these changes by breaking them down into components that are either parallel or perpendicular to the current representation. They discover that the parallel components play a significant role in the model's performance, especially in attention mechanisms and multi-layer perceptrons (MLPs). The findings suggest that manipulating these components can enhance the model's robustness and efficiency during training and compression processes."}, 'zh': {'title': '连接表示几何与编辑鲁棒性', 'desc': '本文研究了变换器模型中表示的演变过程，重点分析了学习到的更新如何分解为平行和垂直分量。我们发现，在预训练模型中，平行分量的存在超出了残差身份路径。通过对注意力和多层感知机（MLP）更新的分解，我们揭示了空间依赖的不对称性，特别是在排除自我值空间的平行操作中表现出更强的鲁棒性。实验结果表明，在从头开始的预训练过程中，完全聚合的平行抑制可以有效降低验证损失，并改善下游任务的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.15982', 'title': 'The Router Within: Eliciting Native Skill Routing from a Frozen LLM', 'url': 'https://huggingface.co/papers/2609.15982', 'abstract': "Abstract Gavel extracts skill-routing signals from frozen LLM hidden states via lightweight linear projections to select tools without external retrieval or context overload.  Generated by thinkingmachines/Inkling-Small Skills extend an LLM agent beyond its parametric knowledge, and the gain they promise rests on picking the right one. Deployed harnesses route by preloading every skill's metadata into the context, which disperses the agent's attention and caps the library size. Retrieval pipelines move the selection out of the context, but also out of the agent's capability. We show that the frozen agent LLM already carries the routing signal in its own forward passes, and that two linear maps suffice to read it out with no skill text in the context. Gavel (Glance And Verdict from a frozen LLM) reads it in two steps. A glance projects the task's and each skill's mid-layer states through the two maps, the only parameters trained, and scores the full library against compact per-skill banks that one forward pass builds at installation. A verdict then resumes the shortlisted skills' forward passes and reads the model's own likelihood and yes/no judgment, fused with the glance as a product of experts. Trained once, Gavel transfers zero-shot to three public benchmarks and SkillTraj, our new benchmark of 372 simulated agent trajectories. On Qwen3-32B it outperforms progressive disclosure and retrieve-and-rerank pipelines that add 1.2B to 16B external parameters, by up to 13.4 points on written tasks and up to 21.9 when the need for a skill arises mid-rollout. Routing accuracy improves as the backbone does, and in a bash-agent harness the same 32B triggers the correct skill on Skill-Use more often than far larger frontier models running in Codex.", 'score': 3, 'issue_id': 3281, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '14c77180f08bc5f9', 'authors': ['Ruishuo Chen', 'Xun Wang', 'Yu Chen', 'Zhuoran Li', 'Longbo Huang'], 'affiliations': ['Institute for Interdisciplinary Information Sciences, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.15982.jpg', 'data': {'categories': ['#training', '#transfer_learning', '#agents', '#benchmark', '#interpretability', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Выбор навыков без контекста: маршрутизация через внутренние представления LLM', 'desc': 'Gavel — это метод маршрутизации навыков в агентах на основе LLM, который использует лёгкие линейные проекции скрытых состояний замороженной нейросети для выбора нужного инструмента без дополнительного поиска информации. Вместо того чтобы загружать метаданные всех доступных навыков в контекст, система учится извлекать сигналы маршрутизации непосредственно из промежуточных слоёв LLM через две обучаемые линейные карты. Подход состоит из двух этапов: сначала модель оценивает релевантность каждого навыка, а затем на основе этих оценок выбирает наиболее подходящие кандидаты для дальнейшей обработки. Экспериментально показано, что Gavel превосходит существующие методы маршрутизации на нескольких бенчмарках и переносится на новые задачи без переобучения.'}, 'en': {'title': 'Gavel: Smart Skill Selection from Frozen LLMs', 'desc': "The paper presents Gavel, a method that extracts skill-routing signals from the hidden states of a frozen large language model (LLM) using lightweight linear projections. This approach allows the LLM agent to select appropriate tools without relying on external retrieval systems or overwhelming context. Gavel operates in two steps: first, it projects the task and skill states to score potential skills, and then it evaluates the shortlisted skills to make a final decision based on the model's own likelihood judgments. The results show that Gavel outperforms traditional retrieval methods and scales effectively across various benchmarks, demonstrating improved routing accuracy with larger backbone models."}, 'zh': {'title': 'Gavel：高效技能路由的创新方法', 'desc': 'Gavel是一种从冻结的LLM隐藏状态中提取技能路由信号的方法，使用轻量级线性投影来选择工具，而无需外部检索或上下文过载。它通过预加载每个技能的元数据来分散代理的注意力，并限制库的大小。Gavel通过两步读取路由信号，首先通过线性映射投影任务和技能的中间层状态，然后根据模型的判断进行筛选。经过一次训练，Gavel在多个基准测试中实现了零-shot转移，表现优于传统的检索和重排名管道。'}}}, {'id': 'https://huggingface.co/papers/2609.17524', 'title': 'Modality-Autoregressive World-Action Models', 'url': 'https://huggingface.co/papers/2609.17524', 'abstract': "Abstract  World-action models (WAMs) jointly model future observations and actions, typically predicting the future as RGB images. Other visual modalities such as depth, pretrained visual features, and point tracks can more efficiently capture geometric, semantic, and motion features. However, how best to combine these modalities within WAMs remains an open question. We introduce ModAR, the first WAM to autoregressively denoise multiple future modalities before predicting actions. This allows each prediction to condition on previously generated modalities. We train from scratch to systematically study how training-data mixtures, predicted modalities, and WAM formulations affect performance. In our evaluations, WAMs benefit from predicting point tracks, DINO features, and depth maps, while additionally predicting future RGB does not provide a consistent benefit. We also find that ModAR's sequential generation outperforms existing WAM formulations, with the highest average success rate at all evaluated data scales. We also fine-tune the video-model-initialized WAM Flex-π on the same data; ModAR achieves a slightly higher observed average success rate (75% vs. 72%) while using approximately 20times fewer training FLOPs and no pretraining. On three real-world bimanual tasks, ModAR outperforms baselines and improves with human videos.", 'score': 2, 'issue_id': 3282, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': '46ef821a5d76f486', 'authors': ['Adam Hung', 'Bardienus P. Duisterhof', 'Deva Ramanan', 'Jeffrey Ichnowski'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2609.17524.jpg', 'data': {'categories': ['#video', '#training', '#robotics', '#multimodal', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Многомодальное предсказание будущего для обучения робототехнике', 'desc': 'В статье представляется ModAR — первая мировая модель действий, которая использует авторегрессивное удаление шума для нескольких модальностей будущего перед предсказанием действий. Авторы систематически исследуют, как комбинирование различных визуальных модальностей (глубина, признаки DINO, точечные треки и RGB) влияет на производительность модели. Результаты показывают, что предсказание траекторий точек, семантических признаков и карт глубины существенно улучшает качество, тогда как добавление RGB не дает стабильного выигрыша. ModAR превосходит существующие подходы по успешности выполнения задач, требуя при этом на 20 порядков меньше вычислительных ресурсов и без предварительного обучения.'}, 'en': {'title': 'ModAR: Enhancing Future Predictions with Multi-Modal Denoising', 'desc': 'This paper introduces ModAR, a novel world-action model (WAM) that enhances the prediction of future actions and observations by autoregressively denoising multiple visual modalities, such as depth and point tracks. By conditioning each prediction on previously generated modalities, ModAR effectively captures geometric and motion features, leading to improved performance. The study reveals that incorporating certain modalities, like point tracks and DINO features, significantly benefits the model, while additional RGB predictions do not consistently enhance results. ModAR demonstrates superior performance compared to existing WAMs, achieving higher success rates with fewer training resources and no pretraining, especially in real-world bimanual tasks.'}, 'zh': {'title': 'ModAR：高效的世界动作模型', 'desc': '世界动作模型（WAMs）旨在共同建模未来的观察和动作，通常以RGB图像的形式预测未来。本文提出了ModAR，这是第一个在预测动作之前自回归去噪多种未来模态的WAM。研究表明，结合点轨迹、DINO特征和深度图可以有效提升模型性能，而额外预测未来RGB图像并未带来一致的好处。ModAR在多个评估数据规模中表现优异，成功率最高，且在训练时使用的计算资源显著减少。'}}}, {'id': 'https://huggingface.co/papers/2609.17521', 'title': 'PhysStream: Streaming Physics-Grounded Video Generation with Structured Scene Memory and Fine-Grained Motion Control', 'url': 'https://huggingface.co/papers/2609.17521', 'abstract': 'Abstract  Interactive control for video generation is moving from coarse prompts toward fine-grained, physically meaningful manipulation of dynamic scenes. Yet existing controllable methods either require the full control schedule before generation starts, or use pixel-space signals that dictate object positions rather than physical dynamics. To address these limitations, we propose PhysStream, an autoregressive model for physics-grounded image-to-video synthesis that incorporates structured scene memory---positional maps and object tracking maps derived online from previously generated frames---and supports fine-grained motion control via sparse velocity-increment signals that encode physical quantities, letting the model learn the underlying dynamics. We train our model in two stages: a bidirectional model is first finetuned with motion-control conditioning, then a causal autoregressive model is trained with additional structured scene memory, further improving physical consistency. PhysStream enables interactive, mid-generation control over multi-object tabletop rigid-body scenes---a capability not supported by prior methods---reducing motion distribution distance (FVMD) by 33% and trajectory error by 12% over the strongest baselines on synthetic benchmarks, and is preferred by human evaluators in over 85% of in-the-wild comparisons. Please check our website for more details: https://czzzzh.github.io/PhysStream', 'score': 2, 'issue_id': 3282, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': '7bd6bcd764c6ef13', 'authors': ['Chuhao Chen', 'Peter Wonka', 'Chaoyang Wang', 'Chen Wang', 'Qiao Feng', 'Sergey Tulyakov', 'Lingjie Liu'], 'affiliations': ['KAUST', 'Snap Inc.', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2609.17521.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Интерактивное управление видеогенерацией через физически обоснованные сигналы', 'desc': 'В статье предлагается PhysStream — авторегрессивная модель для синтеза видео из изображений, которая позволяет интерактивно управлять движением объектов на основе физических принципов. Модель использует структурированную память сцены, включающую карты позиций и отслеживание объектов, извлекаемые из ранее сгенерированных кадров. Контроль движения осуществляется через разреженные сигналы приращения скорости, кодирующие физические величины, что позволяет модели обучиться скрытой динамике сцены. Модель обучается в два этапа: сначала двунаправленная модель дорабатывается с условием контроля движения, затем причинная авторегрессивная модель обучается со структурированной памятью сцены, значительно улучшая физическую согласованность.'}, 'en': {'title': 'PhysStream: Interactive Video Generation with Physics-Grounded Control', 'desc': 'The paper introduces PhysStream, an autoregressive model designed for generating videos with a focus on physical realism and fine-grained control. Unlike previous methods that rely on predefined control schedules or pixel-based signals, PhysStream utilizes structured scene memory to track object positions and dynamics in real-time. The model is trained in two stages, first refining motion control and then enhancing physical consistency through causal autoregression. This approach allows for interactive manipulation of multi-object scenes, significantly improving motion accuracy and user preference in evaluations.'}, 'zh': {'title': '物理驱动的交互式视频生成', 'desc': '本文提出了一种名为PhysStream的自回归模型，用于基于物理的图像到视频合成。该模型通过结构化场景记忆，结合位置图和物体跟踪图，实现了对动态场景的精细控制。与现有方法不同，PhysStream支持在生成过程中进行交互式控制，允许用户通过稀疏的速度增量信号来操控物体运动。实验结果表明，PhysStream在合成基准测试中显著提高了物理一致性，减少了运动分布距离和轨迹误差。'}}}, {'id': 'https://huggingface.co/papers/2609.16204', 'title': 'Decoy Direction Optimization: A Post-Hoc Defense Against LLM Abliteration', 'url': 'https://huggingface.co/papers/2609.16204', 'abstract': "Abstract  Safety guardrails in open-weight language models can be readily bypassed using Refusal Feature Ablation (RFA), a technique that identifies and projects out a linear refusal direction from the residual stream, often achieving a high attack success rate (ASR) while preserving model capability. Defending against these attacks typically requires computationally expensive safety finetuning for every new checkpoint. We introduce Decoy Direction Optimization (DDO), a fast, post-hoc weight-editing defense that requires no base-model finetuning. Our approach is based on a simple mechanistic insight: ablation attacks rely on contrastive estimators to find the refusal direction. Rather than trying to hide the true refusal circuitry, DDO actively injects a high-magnitude, nonlinear decoy signal into the network's MLP neurons. When an attacker attempts to locate the refusal direction, the decoy corrupts their estimator, tricking them into ablating a harmless orthogonal feature while the actual safety mechanism remains intact. We prove a spectral bound formalizing this effect and evaluate DDO across six model families, achieving <10% ASR under standard RFA. On Llama-3-8B-Instruct, DDO remains comparable to trained defenses under adaptive multi-phase attacks (65% vs. 58% worst-case ASR) and reduces Heretic weight-level attack ASR from 88.7% to 18%, all at 30 to 450 times lower optimization cost per configuration than the trained baselines.", 'score': 1, 'issue_id': 3282, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '91d71d8f8d2c0cdf', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#alignment', '#security', '#interpretability', '#training', '#architecture'], 'emoji': '🛡️', 'ru': {'title': 'Обман детектора: фиктивные направления вместо прямой защиты', 'desc': 'В статье предложен метод Decoy Direction Optimization (DDO) для защиты языковых моделей от атак Refusal Feature Ablation, которые обходят механизмы безопасности путём изоляции и удаления направления отказа из остаточного потока модели. Вместо дорогостоящей переподготовки модели авторы используют быструю постредактирование весов, которое вводит в нейроны многослойного перцептрона фиктивные сигналы высокой амплитуды. Когда злоумышленник пытается найти истинное направление отказа через контрастные оценки, фиктивный сигнал искажает его алгоритм, заставляя удалять безвредный ортогональный признак, в то время как механизм безопасности остаётся нетронутым. Метод достигает более чем 30-кратного снижения вычислительных затрат по сравнению с базовыми защитами при сохранении эффективности против адаптивных атак.'}, 'en': {'title': 'Decoy Your Attacker: A New Defense for Language Models', 'desc': "This paper addresses the vulnerability of open-weight language models to attacks that bypass safety guardrails using a method called Refusal Feature Ablation (RFA). The authors propose a new defense technique named Decoy Direction Optimization (DDO), which does not require finetuning the base model and is computationally efficient. DDO works by injecting a strong, nonlinear decoy signal into the model's neurons, which confuses attackers trying to identify the refusal direction. The results show that DDO significantly reduces the attack success rate while maintaining model performance, proving to be a cost-effective solution compared to traditional defenses."}, 'zh': {'title': '诱饵方向优化：高效的语言模型安全防御', 'desc': '本文介绍了一种新的防御技术，称为诱饵方向优化（DDO），旨在保护开放权重语言模型免受拒绝特征消融（RFA）攻击。DDO通过在网络的多层感知器（MLP）神经元中注入高幅度的非线性诱饵信号，来干扰攻击者的估计，从而保护模型的安全机制。与传统的安全微调方法相比，DDO不需要对基础模型进行微调，优化成本显著降低。实验结果表明，DDO在多种模型上表现出色，成功率低于10%，并在适应性多阶段攻击中与训练防御方法相当。'}}}, {'id': 'https://huggingface.co/papers/2609.13680', 'title': 'Drift-Constrained Optimization: Only Direction Matters in Fine-Tuning Instruct Models', 'url': 'https://huggingface.co/papers/2609.13680', 'abstract': 'Abstract  Fine-tuning instruct models often improves target performance while inducing behavioral drift from the reference model, which can degrade existing capabilities. Rather than treating this drift as an uncontrolled consequence of optimization, we specify a behavioral drift budget before optimization and ask how to boost the target-task performance within it. Locally, behavioral drift induces a shared geometry anchored at the reference model, with the drift budget defining a boundary within this space. In this space, drift determines distance from the reference, leaving update direction as the remaining degree of freedom. Fine-tuning updates can therefore be compared through their directional efficiency, naturally reformulating fine-tuning as a direction-selection problem. This reformulation makes a concrete prediction: changing the accessible directions can qualitatively alter the outcome of fine-tuning. We test this prediction in a stringent QA-only setting, where strong instruct models are fine-tuned only on final answers but must still generate multi-step reasoning at inference. Despite this mismatch, a coarse layer-selective probe reverses the failure of QA-only fine-tuning and reveals the existence of effective directions, with multiple neighboring configurations improving target performance while preserving reasoning and general capabilities. Across Qwen3-8B and Qwen3-14B, these directions substantially improve scientific reasoning and multilingual translation. Over more than 100 languages, the resulting models match or outperform dedicated translation systems and provide a stronger initialization for subsequent reinforcement learning. Our results suggest that fine-tuning is not just about how much a model changes, but how that change is spent. https://github.com/CONE-MT/DCO and https://huggingface.co/collections/LLaMAX/dco', 'score': 1, 'issue_id': 3282, 'pub_date': '2026-09-12', 'pub_date_card': {'ru': '12 сентября', 'en': 'September 12', 'zh': '9月12日'}, 'hash': 'fb60bcb33b2a1246', 'authors': ['Fei Yuan', 'Changjiang Gao', 'Yilei Tu', 'Yifeng Liu', 'Shujian Huang', 'Yu Qiao'], 'affiliations': ['National Key Laboratory for Novel Software Technology, Nanjing University', 'Shanghai Artificial Intelligence Laboratory', 'University of British Columbia'], 'pdf_title_img': 'assets/pdf/title_img/2609.13680.jpg', 'data': {'categories': ['#science', '#alignment', '#multilingual', '#training', '#translation', '#optimization', '#open_source'], 'emoji': '🎯', 'ru': {'title': 'Контролируемое отклонение: выбор оптимального направления при fine-tuning моделей', 'desc': 'Работа предлагает новый подход к fine-tuning инструктированных моделей, рассматривая изменение поведения модели как контролируемый процесс с заранее заданным бюджетом отклонения. Авторы переформулируют fine-tuning как проблему выбора направления обновления параметров, где при фиксированном расстоянии от исходной модели можно выбрать наиболее эффективное направление изменения весов. Метод протестирован в сложной задаче, где модель обучается только на финальные ответы в QA, но должна сохранять многошаговые рассуждения. Предложенный подход значительно улучшает возможности моделей Qwen3 в научном рассуждении и многоязычном переводе, демонстрируя, что качество fine-tuning зависит не только от величины изменений, но и от их направления.'}, 'en': {'title': 'Optimizing Fine-Tuning: Balancing Performance and Behavioral Drift', 'desc': "This paper discusses the challenges of fine-tuning instruct models, which can lead to a loss of existing capabilities due to behavioral drift. The authors propose a method to manage this drift by setting a budget before optimization, allowing for improved performance on target tasks while maintaining essential model behaviors. They introduce a new perspective on fine-tuning as a direction-selection problem, where the efficiency of updates is determined by the chosen update direction within a defined drift budget. Their experiments demonstrate that by selecting effective update directions, fine-tuning can enhance performance in tasks like scientific reasoning and multilingual translation without sacrificing the model's general capabilities."}, 'zh': {'title': '优化微调：在行为漂移预算内提升性能', 'desc': '本文探讨了微调指令模型时的行为漂移问题，指出这种漂移可能会降低模型的现有能力。作者提出在优化之前设定一个行为漂移预算，以便在预算范围内提升目标任务的性能。通过重新定义微调为一个方向选择问题，研究了如何有效地利用更新方向来优化模型。实验结果表明，改变可访问的方向可以显著改善微调结果，同时保持推理和通用能力。'}}}, {'id': 'https://huggingface.co/papers/2609.13770', 'title': 'Training Specialist Models without Reasoning Trajectories for Domain Expert Distillation', 'url': 'https://huggingface.co/papers/2609.13770', 'abstract': "Abstract Specialist training without explicit reasoning supervision implicitly selects latent reasoning trajectories that govern distilled students' specialization and generalization trade-offs.  Generated by thinkingmachines/Inkling-Small Specialist distillation effectively transfers domain expertise to student models via teacher-generated reasoning trajectories. However, when these specialists are trained solely on question--answer pairs without explicit reasoning supervision, what governs the trajectories they generate? In this work, we show that specialist optimization implicitly selects from this latent trajectory space. To isolate and observe this latent distribution, we leverage student distillation not as a downstream goal, but as an agnostic probe---since students inherit no parameterization or optimization constraints from the specialist, inheriting only the sampled trajectories themselves. Through this probe, our empirical analysis unveils a tight governing relationship: across 27 specialist--student pairings, their specialization--generalization profiles correlate exceptionally strongly. Crucially, explicitly controlling the specialist's distributional drift systematically shifts both the teacher and its distilled student along a controllable trade-off between domain precision and general-capability retention. Across chemistry, physics, and multilingual settings, distilled students systematically reflect these specialist-induced profiles, even across divergent model families. Our findings establish a new view of specialist training: when gold reasoning is absent, tuning choices directly control the latent supervision passed to downstream models.", 'score': 1, 'issue_id': 3282, 'pub_date': '2026-09-12', 'pub_date_card': {'ru': '12 сентября', 'en': 'September 12', 'zh': '9月12日'}, 'hash': 'f7c8d17d6d2d4d2e', 'authors': ['Yilei Tu', 'Zihao Li', 'Shaoxiong Ji', 'Jörg Tiedemann', 'Fei Yuan'], 'affiliations': ['ELLIS Institute Finland', 'Shanghai Artificial Intelligence Laboratory', 'University of British Columbia', 'University of Helsinki', 'University of Turku'], 'pdf_title_img': 'assets/pdf/title_img/2609.13770.jpg', 'data': {'categories': ['#multilingual', '#training', '#small_models', '#transfer_learning', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Скрытые траектории рассуждений управляют специализацией и обобщением в дистилляции моделей', 'desc': 'В работе исследуется, как специализированные модели-учителя неявно выбирают скрытые траектории рассуждений, которые затем передаются дистиллируемым студентам без явного надзора над процессом рассуждения. Авторы используют дистилляцию студентов как зонд для анализа скрытого распределения этих траекторий, показывая, что оптимизация специалиста напрямую контролирует профили специализации и обобщения получаемых моделей. Результаты демонстрируют сильную корреляцию между траекториями учителя и унаследованными профилями студентов, а также показывают, что явное управление дрейфом распределения позволяет контролировать компромисс между точностью в домене и сохранением общих способностей. Исследование проведено на задачах из химии, физики и многоязычных настройках, что подтверждает универсальность найденных закономерностей.'}, 'en': {'title': 'Implicit Reasoning Shapes Specialist-Student Dynamics', 'desc': "This paper explores how specialist models in machine learning can implicitly guide the training of student models without explicit reasoning supervision. It reveals that the optimization of these specialists selects from a latent space of reasoning trajectories, which affects how well the student models specialize in specific domains while maintaining general capabilities. By analyzing the relationship between specialists and their distilled students, the authors demonstrate that controlling the specialist's training can influence the trade-off between precision in a specific domain and overall generalization ability. The findings suggest that even in the absence of clear reasoning, the choices made during specialist training can significantly impact the performance of downstream models across various fields."}, 'zh': {'title': '专家训练：隐性推理轨迹的力量', 'desc': '本研究探讨了在没有明确推理监督的情况下，专家模型如何影响学生模型的专业化和泛化能力。通过分析专家生成的推理轨迹，我们发现这些轨迹在学生模型的训练中起到了重要作用。研究表明，专家的优化过程会隐式选择潜在的推理轨迹，从而影响学生模型的表现。我们的实证分析显示，专家与学生之间的专业化-泛化特征之间存在强相关性，且通过控制专家的分布漂移，可以系统性地调整学生模型的领域精度与通用能力之间的权衡。'}}}, {'id': 'https://huggingface.co/papers/2609.17320', 'title': 'Emergence World: Adversarial Stress-Testing of Long-Horizon Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2609.17320', 'abstract': 'Abstract  As AI agents move from bounded tasks to persistent deployments, failures can propagate through memory, tools, other agents, and environmental state long after their interactions. This creates a safety regime that cannot be characterized by evaluating model responses in isolation. Emergence World, is a continuously running multi-agent environment for adversarial stress testing of long horizon autonomous systems. We ran eight parallel worlds of ten agents from identical starting conditions: seven homogeneous worlds powered by distinct frontier models and one mixed-model world. Across 16 days, the agents generated more than 850,000 LLM calls and nearly 50 billion tokens while pursuing goals, using/creating tools, maintaining persistent memory, and governing shared institutions. After operational state had accumulated, we delivered three controlled stress events through ordinary interaction surfaces: indirect prompt injection, misinformation, and exposure of private agent memories. No evaluated world achieved full resilience across all three events. Detection did not ensure containment: systems could recognize threats while still interacting with adversarial content, writing it into their own persistent memory, and acting on it up to 46 hours later. Persistent operation also exposed recurring tool errors, goal drift, language opacity, conformity despite private disagreement, and coordinated refusal of assigned work. The same model-persona pairing behaved substantially different in mixed and homogeneous populations. Our results suggest that model-level alignment is not compositional: individually capable and apparently safe agents can form systems with qualitatively different failure modes. As AI becomes persistent and interconnected, the frontier of safety therefore shifts from aligning models to engineering resilient autonomous systems.', 'score': 0, 'issue_id': 3282, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': '4dd74dba39d01847', 'authors': ['Deepak Akkil', 'Tamer Abuelsaad', 'Karthik Vikram', 'Matthew Pace', 'Aditya Vempaty', 'Saahir Beotra', 'Ravi Kokku', 'Satya Nitta'], 'affiliations': ['Emergence AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.17320.jpg', 'data': {'categories': ['#alignment', '#security', '#agents', '#hallucinations', '#benchmark'], 'emoji': '⚠️', 'ru': {'title': 'От выравнивания моделей к инженерии устойчивых многоагентных систем', 'desc': 'Исследование изучает безопасность долгоживущих многоагентных систем на основе LLM, которые работают длительное время с общей памятью и инструментами. Авторы создали симуляционную среду Emergence World с десятью агентами, работающими 16 дней и генерирующими сотни тысяч вызовов к языковым моделям. Система была протестирована на устойчивость к трем типам атак: косвенной prompt injection, дезинформации и утечкам приватной информации. Результаты показали, что выравнивание отдельных моделей не гарантирует безопасность композитных систем, так как агенты могут действовать на основе враждебного контента, сохранять его в памяти и реагировать на него спустя 46 часов после атаки.'}, 'en': {'title': 'From Model Alignment to System Resilience in AI', 'desc': "This paper discusses the challenges of ensuring safety in AI agents that operate continuously in multi-agent environments. It introduces 'Emergence World', a testing ground where agents interact over long periods, revealing how failures can spread through their systems. The study found that even well-aligned models can behave unpredictably when combined with others, leading to new types of failures. The authors argue that the focus should shift from just aligning individual models to creating robust systems that can withstand adversarial conditions."}, 'zh': {'title': '从对齐模型到工程韧性系统的转变', 'desc': '随着人工智能代理从有限任务转向持续部署，失败可能会在记忆、工具、其他代理和环境状态中传播，影响其后续的交互。这种情况使得安全性无法仅通过评估模型的独立响应来表征。我们提出了一个名为Emergence World的多代理环境，用于对长期自主系统进行对抗性压力测试。研究表明，模型级别的对齐并不具备可组合性，个体能力强且看似安全的代理在形成系统时可能会出现质变的失败模式，因此，安全的前沿从对齐模型转向工程化韧性自主系统。'}}}];

                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-16 08:08',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-16 08:08')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-16 08:08')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
