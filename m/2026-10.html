учшение консистентности при повторном посещении (на 24-30%) с минимальными вычислительными затратами.'}, 'en': {'title': 'Efficient Long-Span Supervision with Memorizon', 'desc': 'The paper introduces Memorizon, a novel approach for training streaming world models that need to maintain consistent representations across repeated visits. It addresses the challenge of long-span supervision by allowing attention mechanisms to operate without processing every frame in between visits, thus reducing computational costs. Memorizon utilizes a shared bank of top-K latents based on camera co-visibility, which enables efficient retrieval of relevant information while keeping the sequence length manageable. The results show that this method significantly improves revisit consistency while maintaining reasonable computational efficiency, even as the span of training samples increases.'}, 'zh': {'title': 'Memorizon：提升重访一致性的流媒体模型', 'desc': '这篇论文介绍了一种名为Memorizon的模型，用于改进流媒体世界模型的重访一致性。该模型通过共享前向传递来减少长时间监督的计算成本，而不需要每个中间帧。Memorizon使用一个共享的潜在特征库来提高重访的准确性，并且在长时间跨度的情况下，模型的性能提升显著。实验结果表明，使用Memorizon可以在保持较低计算成本的同时，显著提高重访一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.02202', 'title': 'ScholarCatalyst: A Benchmark for Retrieving Papers That Inspire New Research', 'url': 'https://huggingface.co/papers/2610.02202', 'abstract': 'Abstract  What makes great scientists great? Even as AI systems start to make progress on open problems, scientists remain far ahead of them at sensing which prior idea, buried in an ever-growing archive of research, a new problem needs. To study this skill, we draw on researchers who know firsthand which earlier work advanced their completed projects, with papers serving as pointers to the ideas within. Using our automated pipeline that makes author annotation scalable, we build ScholarCatalyst by having 184 lead authors of 207 recent computer science papers label which candidates did or could have advanced their project, each with a detailed rationale. We introduce a retrieval task with author-provided judgments: given an initial research question, retrieve these papers from only the literature available when the project began. Agentic search does no better than embedding retrieval (0.42 vs. 0.48 Recall@20) despite calling that same retriever as a tool. Even an agent built on Claude Fable 5.1, which may have seen the completed papers during training, reaches only 0.51 R@20. These results highlight the need for new training recipes that equip models with expert intuition for searching broad corpora. We envision ScholarCatalyst as a step toward scientific agents that can take a half-formed idea and point to the prior research it needs.', 'score': 9, 'issue_id': 3364, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'a4833c179262543a', 'authors': ['Sohyeon Kim', 'Yoonho Lee', 'Bo Liu', 'Dayoon Ko', 'Rulin Shao', 'Seungone Kim', 'Graham Neubig', 'Pang Wei Koh', 'Aakanksha Chowdhery', 'Akari Asai', 'Omar Khattab', 'Yejin Choi', 'Gunhee Kim', 'Chelsea Finn'], 'affiliations': ['Allen Institute for AI', 'Carnegie Mellon University', 'MIT', 'Seoul National University', 'Stanford University', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.02202.jpg', 'data': {'categories': ['#open_source', '#science'], 'emoji': '🔍', 'ru': {'title': 'Научные агенты должны учиться находить релевантные идеи, как это делают эксперты', 'desc': 'В этой работе исследуется способность ученых находить релевантные предыдущие исследования для своих новых проектов. Авторы создали ScholarCatalyst — датасет, где 184 ведущих исследователя аннотировали 207 статей по информатике, указывая, какие работы из архива помогли их проектам. Они сформулировали задачу retrieval: по начальному исследовательскому вопросу найти релевантные статьи из литературы, доступной на момент начала проекта. Результаты показали, что даже агентные системы на базе больших языковых моделей значительно уступают эксперт-людям в этой задаче, указывая на необходимость новых подходов к обучению моделей поиску в научных корпусах.'}, 'en': {'title': 'Empowering AI with Scientific Intuition for Better Research Retrieval', 'desc': 'This paper explores the unique ability of scientists to identify relevant prior research that can inform new projects, a skill that current AI systems struggle to replicate. The authors developed a tool called ScholarCatalyst, which uses input from researchers to label papers that contributed to their work, creating a dataset for evaluating retrieval tasks. They found that existing AI models, even advanced ones, performed poorly in retrieving relevant literature compared to human intuition. The study emphasizes the importance of developing new training methods for AI that can better mimic the expert judgment of scientists in navigating vast research archives.'}, 'zh': {'title': '科学家的智慧：从历史中寻找灵感', 'desc': '这篇论文探讨了科学家在解决新问题时如何利用已有研究的能力。研究者们通过分析184位计算机科学论文的作者，了解他们认为哪些先前的工作对他们的项目有帮助。论文提出了一种新的检索任务，旨在从项目开始时可用的文献中检索相关论文。结果显示，现有的检索模型在这一任务上的表现仍有待提高，强调了需要新的训练方法来增强模型的专家直觉。'}}}, {'id': 'https://huggingface.co/papers/2610.01428', 'title': 'Generalization Is Stability, Not Accuracy: Multi-Axis Evaluation of LLMs', 'url': 'https://huggingface.co/papers/2610.01428', 'abstract': 'Abstract  Generalization in large language models (LLMs) is the ability to produce consistent and semantically stable outputs when the same input is expressed in different ways. Existing work typically evaluates generalization through aggregate accuracy on a single prompt format, task, or set of variations, which conflates robustness with overall benchmark performance. In this work, we show generalization evaluation at the level of individual examples, across multiple input variants, and across different aspects of model behavior, focusing on variability rather than reducing performance to a score that can be improved through narrow training or other ways that obfuscate generalization evaluation. Following this view, we introduce the Stability-Aware Generalization Objective (SAGO), a framework that measures how much model behavior changes for the same input under different variations and benchmarks, capturing variability across several dimensions including generation consistency, internal activations, confidence, and response mirroring. We show that many commonly used models exhibit statistically significant and consistent generalization instability: no model generalizes uniformly, behavioral axes capture independent failure modes, and cross-dataset variation can reverse model rankings.', 'score': 9, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '8c87e8732252217e', 'authors': ['Nagham Omar', 'Mahmoud Jabarin', 'Maya Rozenshtein', 'Rom Himelstein', 'Avi Mendelson', 'Amit LeVi'], 'affiliations': ['Technion Israel Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.01428.jpg', 'data': {'categories': ['#interpretability'], 'emoji': '🎯', 'ru': {'title': 'Измеряя истинную стабильность: когда модель дает разные ответы на одно и то же', 'desc': 'В работе исследуется способность больших языковых моделей (LLM) давать стабильные и семантически устойчивые ответы на одинаковые входные данные, выраженные по-разному. Авторы критикуют существующие методы оценки обобщающей способности, которые измеряют производительность в целом, вместо того чтобы анализировать поведение модели на конкретных примерах. Предложен новый фреймворк SAGO (Stability-Aware Generalization Objective), который оценивает вариативность поведения модели по различным аспектам: согласованность генерации, внутренние активации, уверенность модели и отражение ответов. Исследование показывает, что популярные LLM демонстрируют значительную нестабильность при обобщении, и разные измерения выявляют независимые режимы отказа модели.'}, 'en': {'title': 'Measuring Stability for Better Generalization in Language Models', 'desc': 'This paper discusses how large language models (LLMs) can produce stable and consistent outputs when given different forms of the same input. It critiques existing methods that measure generalization by overall accuracy, arguing that this approach mixes robustness with performance metrics. The authors propose a new evaluation framework called the Stability-Aware Generalization Objective (SAGO), which assesses how model behavior varies with different input forms. Their findings reveal that many models show significant instability in generalization, indicating that they do not perform uniformly across different scenarios and that various aspects of their behavior can lead to independent failure modes.'}, 'zh': {'title': '揭示大型语言模型的泛化稳定性', 'desc': '本文探讨了大型语言模型（LLMs）的泛化能力，即在不同表达方式下产生一致且语义稳定的输出。现有研究通常通过单一提示格式或任务的整体准确性来评估泛化，这混淆了鲁棒性与整体基准性能。我们提出了一种新的评估方法，关注个别示例的泛化，强调模型在不同输入变体下的行为变化。我们引入了稳定性意识泛化目标（SAGO），该框架测量相同输入在不同变体下模型行为的变化，揭示了许多常用模型在泛化稳定性方面的显著不一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.37568', 'title': 'Devils in Question Relay: Source-Conditioned Relay Steering to Mitigate Hallucinations in Audio-visual Large Language Models', 'url': 'https://huggingface.co/papers/2609.37568', 'abstract': 'Abstract  Audio-visual large language models (AVLLMs) have made remarkable progress in multimodal understanding and reasoning through interactions among visual, auditory, and linguistic information. However, recent studies show that AVLLMs face a critical challenge: source-confused grounding hallucination, where cues from the unused modality induce responses that the required modality does not support, undermining reliability in real-world applications. Existing methods have made progress in mitigating this failure, yet how it arises from internal cross-modal interactions remains insufficiently understood. To address this gap, we conduct path-intervention and representation analyses, revealing a question-relay mechanism: question states carry interfering cues alongside required-source evidence, undermining grounding in required-modality evidence. Cutting pathways from interfering modality to question states yields greater correct-answer logit recovery than cutting those to the generation position. Motivated by these findings, we propose SECRET (SourcE-Conditioned RElay sTeering), a training-free method that mitigates cross-modal interference at the question relay. Using contrasting question representations elicited through different modality-pathway interventions, SECRET steers the original question states toward required-source evidence. Experiments on two widely adopted benchmarks CMM and AVHBench across three AVLLMs show that SECRET consistently outperforms prior training-free methods, substantially mitigating source-confused grounding hallucinations (e.g., up to +18.0 and +7.1 percentage points over base models). Modality-specific captioning further demonstrates its generalizability to open-ended generation.', 'score': 9, 'issue_id': 3363, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'dd00c858e94317d3', 'authors': ['Yu Zhang', 'Pingrui Zhang', 'Xuefeng Bai', 'Pengfei Zhang', 'Yang Xiang', 'Kehai Chen'], 'affiliations': ['Fudan University', 'Harbin Institute of Technology, Shenzhen, China', 'Peng Cheng Laboratory, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.37568.jpg', 'data': {'categories': ['#cv', '#multimodal', '#audio', '#hallucinations', '#interpretability'], 'emoji': '🎬', 'ru': {'title': 'Устранение межмодальных помех в аудиовизуальных языковых моделях через переориентацию представлений вопросов', 'desc': 'В этой работе исследуются аудиовизуальные большие языковые модели (AVLLM), которые обучены понимать и рассуждать с использованием визуальной, звуковой и текстовой информации одновременно. Авторы выявили критическую проблему: модели генерируют галлюцинации, когда сигналы из неиспользуемой модальности влияют на ответы, которые должны основываться на требуемом источнике информации. Через анализ внутренних механизмов внимания исследователи обнаружили, что помехи возникают на уровне представления вопроса, где смешиваются сигналы разных модальностей. Они предложили метод SECRET, который без дополнительного обучения перенаправляет представление вопроса к требуемому источнику информации, значительно снижая галлюцинации на известных бенчмарках.'}, 'en': {'title': 'Steering Clarity in Multimodal Models with SECRET', 'desc': "This paper discusses the challenges faced by audio-visual large language models (AVLLMs) in understanding and reasoning across different types of information. A specific issue identified is source-confused grounding hallucination, where the model incorrectly uses cues from one modality (like audio) when it should rely on another (like visual). The authors introduce a new method called SECRET, which helps the model focus on the correct source of information by steering question states away from misleading cues. Their experiments show that SECRET significantly improves the model's performance in avoiding these errors compared to previous methods."}, 'zh': {'title': '破解源混淆，提升多模态理解！', 'desc': '音视频大型语言模型（AVLLMs）在多模态理解和推理方面取得了显著进展，但面临源混淆的基础幻觉问题。这种问题是由于未使用的模态的线索干扰了所需模态的响应，降低了模型在实际应用中的可靠性。为了解决这一问题，研究者们提出了一种名为SECRET的方法，通过干预不同模态路径来减少交叉模态干扰，从而提高模型的准确性。实验结果表明，SECRET在多个基准测试中表现优于现有方法，有效减轻了源混淆的基础幻觉。'}}}, {'id': 'https://huggingface.co/papers/2610.02206', 'title': 'KaliBench: A Fine-Grained Benchmark for Cybersecurity Tool Use on Kali Linux with Runtime-Free Verifiable Rewards', 'url': 'https://huggingface.co/papers/2610.02206', 'abstract': "Abstract  LLMs are increasingly applied to cybersecurity workflows, where they are expected to translate analysts' intent into tool invocations. However, existing evaluations focus on knowledge-based assessments or end-to-end agentic tasks, and do not directly measure LLMs' ability to generate executable commands for real-world cybersecurity tools. This gap is critical because cybersecurity operations rely on strict command-line interfaces (CLIs), where minor syntax errors, incorrect flag--value bindings, or argument misordering can invalidate execution. We introduce KaliBench, a fine-grained benchmark and dataset for natural-language--to--CLI translation on Kali Linux, comprising 8,504 query--command pairs spanning 1,642 tools across 23 capability dimensions and 5 security phases. KaliBench is constructed via a manuscript-grounded pipeline with deterministic canonicalization and alias-aware evaluation, enabling precise and reproducible assessment of tool selection and argument construction. To ensure both semantic correctness and practical executability, we develop a multi-stage verification pipeline that combines LLM-based validation, sandboxed terminal execution, and human-in-the-loop refinement. Building on these fine-grained, deterministic signals, KaliBench further enables runtime-free verifiable rewards for training. Across three evaluation modes and 24 configurations of general-purpose and security-focused open-weight models, no open-weight model exceeds 42% exact-command accuracy in the unrestricted setting, highlighting the difficulty of accurate CLI-based cybersecurity tool use without explicit tool hints. We further show that supervised fine-tuning and reinforcement learning with verifiable rewards derived from KaliBench significantly improve an 8B model and achieve performance comparable to a 685B MoE model.", 'score': 8, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'b951a09cc46a7543', 'authors': ['Pengfei Li', 'Naufal Suryanto', 'Sicheng Zhang', 'Muzammal Naseer'], 'affiliations': ['Khalifa University', 'University of Western Australia'], 'pdf_title_img': 'assets/pdf/title_img/2610.02206.jpg', 'data': {'categories': ['#agents', '#security', '#dataset', '#training', '#plp', '#open_source', '#benchmark', '#optimization', '#rlhf'], 'emoji': '🛡️', 'ru': {'title': 'От слов к точным командам: обучение моделей кибербезопасности через верифицируемые вознаграждения', 'desc': 'Исследователи создали KaliBench — эталонный набор данных для оценки способности больших языковых моделей генерировать точные команды командной строки для инструментов кибербезопасности на Kali Linux. Набор включает 8,504 пары запрос-команда, охватывающих 1,642 инструмента и различные фазы безопасности, с детальной проверкой корректности синтаксиса и исполняемости. Авторы разработали многоэтапный конвейер верификации, сочетающий валидацию на основе LLM, песочницу выполнения и участие человека, чтобы обеспечить точность как семантическую, так и практическую. Результаты показывают, что обучение с контролем и обучение с подкреплением используя верифицируемые вознаграждения значительно улучшают способность моделей генерировать корректные команды для реальных задач кибербезопасности.'}, 'en': {'title': 'KaliBench: Bridging Language and Cybersecurity Commands', 'desc': "This paper discusses the challenges of using large language models (LLMs) in cybersecurity, particularly in translating natural language into executable commands for command-line interfaces (CLIs). The authors introduce KaliBench, a new benchmark that includes a dataset of 8,504 query-command pairs to evaluate LLMs' performance in this context. They emphasize the importance of precise command syntax in cybersecurity, as even small errors can lead to execution failures. The study demonstrates that while existing models struggle with command accuracy, fine-tuning and reinforcement learning using KaliBench can significantly enhance performance."}, 'zh': {'title': 'KaliBench：提升网络安全工具命令生成的准确性', 'desc': '本论文介绍了KaliBench，这是一个用于自然语言到命令行接口（CLI）翻译的基准和数据集，专注于网络安全工具的使用。研究发现，现有的评估方法未能直接测量大型语言模型（LLMs）生成可执行命令的能力，而这在网络安全操作中至关重要。KaliBench包含8504个查询-命令对，涵盖1642种工具，提供了精确的工具选择和参数构建评估。通过多阶段验证流程，结合LLM验证和沙箱执行，显著提高了模型在网络安全工具使用中的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.38593', 'title': 'Prompt2Skill: Unsupervised Skill Optimization From Natural Language Instructions', 'url': 'https://huggingface.co/papers/2609.38593', 'abstract': 'Abstract  Skills are external artifacts that Large Language Models (LLMs) consume at inference time to improve their performance on specialized domains by incorporating relevant procedural and domain knowledge. Expert-authored skills are expensive to produce, and the resulting artifacts are not optimized for the specific model that consumes them, whose failure modes can vary with version, scale and training. In addition, emerging tasks may fall outside the scope of existing skill libraries, creating a need to develop new skills before curated training data become available. Recent works have explored automated skill optimization through reflection, but they require a curated, in-distribution training set, which users might not always have. To address these limitations, we present Prompt2Skill, a framework that builds skills from natural-language task description alone. From the prompt, the system derives a task specification, discovers or synthesizes datasets, and refines the skill in a closed loop of reflective editing. Across four domains spanning question answering, reading comprehension, spreadsheet manipulation, and mathematical reasoning, Prompt2Skill consistently outperforms the direct prompting baseline, achieving an average improvement of 10.8 across open-source and frontier models.', 'score': 8, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'ea26f264d3c40e72', 'authors': ['Bo Ni', 'Li Li', 'Ryan A. Rossi', 'Franck Dernoncourt', 'Tyler Derr'], 'affiliations': ['Adobe Systems', 'University of Southern California', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38593.jpg', 'data': {'categories': [], 'emoji': '🛠️', 'ru': {'title': 'Автоматическое создание навыков LLM из описания задачи', 'desc': 'В статье представляется фреймворк Prompt2Skill, который автоматически создаёт специализированные навыки для больших языковых моделей прямо из текстового описания задачи, без необходимости в предварительно размеченных данных. Система извлекает спецификацию задачи из промпта, генерирует или находит подходящие датасеты и итеративно улучшает навык через рефлексивное редактирование. Подход решает проблему дорогостоящего ручного создания навыков и их неоптимизированности под конкретные модели с их уникальными модами отказа. Экспериментальные результаты показывают, что Prompt2Skill в среднем улучшает производительность на 10,8 пункта по сравнению с прямым промптингом на различных доменах: ответы на вопросы, понимание текста, работа с таблицами и математические рассуждения.'}, 'en': {'title': 'Empowering LLMs with Skills from Simple Descriptions', 'desc': 'This paper introduces Prompt2Skill, a framework designed to create skills for Large Language Models (LLMs) using only natural-language task descriptions. It addresses the challenges of expensive expert-authored skills and the need for model-specific optimizations by deriving task specifications and synthesizing datasets automatically. The framework employs a closed-loop reflective editing process to refine the skills, making it adaptable to emerging tasks without requiring curated training data. The results show that Prompt2Skill significantly enhances performance across various domains, outperforming traditional prompting methods by an average of 10.8.'}, 'zh': {'title': '通过自然语言生成技能的创新框架', 'desc': '本论文介绍了一种名为Prompt2Skill的框架，旨在通过自然语言任务描述自动生成技能，以提高大型语言模型（LLMs）在特定领域的表现。该系统从提示中提取任务规范，发现或合成数据集，并通过反思编辑的闭环过程来优化技能。与传统的技能优化方法相比，Prompt2Skill不需要预先准备的训练集，解决了现有技能库的局限性。实验结果表明，在问答、阅读理解、电子表格操作和数学推理等四个领域，Prompt2Skill的表现优于直接提示基线，平均提升达10.8。'}}}, {'id': 'https://huggingface.co/papers/2610.00313', 'title': 'Rules to Tools: Executable Checks for LLM Agents in Scientific Computing', 'url': 'https://huggingface.co/papers/2610.00313', 'abstract': "Abstract  Scientific coding agents receive equations, boundary conditions, and output requirements in writing, then must assess the programs they revise. Rules to Tools (R2T) supplies prepared executable checks of public scientific requirements. Matched SciCode repair groups share written checks, starting programs, model, and budgets; the tool group receives a callable implementation. Across two task-ID cohorts, complete repair is 26/30 with text and 29/30 with the prepared checks. Three task IDs favor tools, one favors text, and eleven tie. The eight-ID cohort scores 13/16 versus 15/16, with a task-cluster bootstrap 95% interval of [-12.5, 43.75] percentage points for the difference. The larger shared-definition SciCode cohort ties at 13/24 per group. Five development-exposed tasks with alternate starting programs score 3/10 versus 7/10. The tool group favors tasks 17, 77, and 11; initial checks flag task 17 and report no violation for tasks 77 and 11. Task 37 favors text and has no initial reported violation. A fresh source-through-Python arm also reaches 15/16, matching the dedicated command's aggregate. In a matched PDE comparison, detailed text scores 23/24 and checks score 24/24, with 31.2% lower reported model output for checks. Agent-side output savings vary by cohort, while public CPU use rises in both task-ID cohorts. These results measure task-dependent repair outcomes and agent-side costs with prepared checks.", 'score': 8, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '9d8bc91882cee8b1', 'authors': ['Jingjie Ning', 'Guojiang Zhao', 'Chen Xu', 'Shanshan Zhong', 'Xiaochuan Li', 'Ji Zeng', 'Guolin Ke'], 'affiliations': ['DP Technology', 'School of Computer Science, Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00313.jpg', 'data': {'categories': ['#science', '#benchmark', '#agents', '#plp', '#optimization'], 'emoji': '🔧', 'ru': {'title': 'Автоматические проверки вместо текста: инструменты для надежного ремонта научного кода', 'desc': 'В статье представлена методология Rules to Tools (R2T) для улучшения работы научных агентов кодирования, которые решают задачи с дифференциальными уравнениями и граничными условиями. Система предоставляет подготовленные проверяемые тесты на основе научных требований, позволяя агентам эффективнее исправлять и валидировать сгенерированный код. Экспериментальные результаты показывают, что использование формальных проверок достигает 26-29 успешных исправлений из 30 задач, при этом эффективность зависит от типа конкретной задачи. Анализ выявляет trade-off между использованием текстовых описаний и автоматических проверок, с вариативностью успеха в зависимости от характеристик задачи и начальных условий.'}, 'en': {'title': 'Enhancing Scientific Coding with Prepared Checks', 'desc': 'This paper discusses a system called Rules to Tools (R2T) that helps scientific coding agents evaluate and improve their programming based on specific requirements. The study shows that using prepared executable checks can enhance the repair success rate of coding tasks compared to traditional text-based methods. Results indicate that while some tasks benefit more from tools, others perform better with text, highlighting the importance of context in machine learning applications. Overall, the findings suggest that integrating prepared checks can lead to more efficient coding practices and reduced computational costs.'}, 'zh': {'title': '科学编码的工具与文本之争', 'desc': '这篇论文探讨了科学编码代理如何处理方程、边界条件和输出要求，并评估他们修订的程序。研究提出了一种名为规则到工具（R2T）的系统，提供了可执行的公共科学要求检查。通过对比不同任务ID的结果，发现使用准备好的检查工具的修复成功率更高。论文还分析了不同任务对文本和工具的偏好，展示了在科学编码中的有效性和效率。'}}}, {'id': 'https://huggingface.co/papers/2609.38104', 'title': 'Explore Broadly, Reason Sharply: Push Small Models toward the Frontier via Sampling', 'url': 'https://huggingface.co/papers/2609.38104', 'abstract': 'Abstract  Power-sharpened sampling is an inference-time alternative to reinforcement-learning (RL) post-training for enhancing reasoning in large language models (LLMs). High-probability sequences are amplified under the base model without parameter updates or external rewards, avoiding the costly optimization and jagged generalization of RL. However, this approach faces a fundamental exploration--exploitation trade-off, as % strong sharpening restricts exploration, trapping samplers in plausible but incorrect reasoning trajectories, whereas weak sharpening leaves the answer distribution diffuse. To resolve this trade-off, we introduce Parallel Power Tempering (PPT), instantiating power-sharpened LLM sampling via parallel tempering. Running multiple interacting replicas in parallel at different sharpening levels allows lower-power replicas to explore diverse reasoning trajectories and higher-power chains to further exploit higher-likelihood responses favored by the sharpened target. Specifically, we tailor  to inference-time sampling by mitigating a truncation bias, identified in prior power samplers, and investigate effective swap strategies under finite memory and compute budgets. Extensive experimentation shows that  substantially improves single-chain power-sharpened sampling and outperforms RL-post-trained models, producing higher-quality reasoning traces and even achieving performance comparable to frontier models.', 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'c6dc0ba08ca45ced', 'authors': ['Panagiotis Theodoropoulos', 'Nan Jiang', 'Xintong Duan', 'Ali Hasan', 'Yuriy Nevmyvaka', 'Evangelos A. Theodorou', 'Wei Deng'], 'affiliations': ['Georgia Institute of Technology', 'ML Research, Morgan Stanley', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2609.38104.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🧊', 'ru': {'title': 'Параллельное закаливание мощности: исследование и эксплуатация в рассуждениях без переобучения', 'desc': 'В статье предлагается новый метод Power-sharpened sampling для улучшения логических рассуждений в больших языковых моделях без переобучения. Вместо дорогостоящего reinforcement learning авторы используют параллельный temperinng (Parallel Power Tempering), где несколько копий модели работают одновременно с разными уровнями шарпенинга. Низкокомпонентные копии исследуют разнообразные траектории рассуждений, а высококомпонентные эксплуатируют наиболее вероятные ответы, что позволяет преодолеть классический компромисс между исследованием и эксплуатацией. Метод достигает качества логических цепочек, сравнимого с frontier моделями, при этом избегая проблем обобщения, которые встречаются при RL-постобучении.'}, 'en': {'title': 'Enhancing Reasoning in LLMs with Parallel Power Tempering', 'desc': 'This paper presents Power-Sharpened Sampling as a method to improve reasoning in large language models (LLMs) without the need for reinforcement learning (RL) post-training. The authors introduce Parallel Power Tempering (PPT), which allows multiple model replicas to operate at different levels of sharpening, balancing exploration and exploitation effectively. By enabling lower-power replicas to explore various reasoning paths while higher-power replicas focus on the most likely responses, PPT addresses the limitations of traditional power sharpening. Experimental results demonstrate that PPT enhances the quality of reasoning in LLMs, outperforming RL-based approaches and achieving results comparable to state-of-the-art models.'}, 'zh': {'title': '并行功率调温：提升推理质量的新方法', 'desc': '本文提出了一种名为并行功率调温（PPT）的新方法，用于增强大型语言模型（LLMs）的推理能力。该方法通过在不同的功率水平下并行运行多个相互作用的副本，解决了探索与利用之间的权衡问题。低功率副本可以探索多样的推理路径，而高功率链则进一步利用高概率的响应。实验结果表明，PPT显著提高了单链功率增强采样的效果，超越了基于强化学习的后训练模型，生成了更高质量的推理轨迹。'}}}, {'id': 'https://huggingface.co/papers/2609.32259', 'title': 'Prefill-Free Cross-Family KV Cache Transfer for Heterogeneous Multi-Agent LLMs', 'url': 'https://huggingface.co/papers/2609.32259', 'abstract': "Abstract  Recent multi-agent LLM systems increasingly combine heterogeneous models for specialized agent roles. However, text-based communication requires each receiver to prefill shared context already processed by the sender. Reusing the sender's key-value (KV) cache avoids this redundancy, but prefill-free transfer across model families must handle differences in tokenization, model depth, and KV representations. To address these issues, we propose HeteroFold, a prefill-free cross-family KV cache transfer method that keeps both the sender and receiver frozen. HeteroFold aligns model structures, maps the sender cache into the receiver space, and calibrates it to preserve receiver behavior. Across six transfer directions, HeteroFold achieves the best cache-transfer performance on all four long-context benchmarks and most short-context settings. It also matches text-based communication on the multi-agent benchmark. At 32K context length, Llama-3.1-8BrightarrowMinistral-3-14B transfer is 10.7times faster than Native Prefill and 1.18--1.47times faster than the state-of-the-art prefill-free baselines, Dense Latent and KV Ridge. These results show that HeteroFold enables efficient cross-family KV reuse without receiver prefill.", 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'd3008c29585cd643', 'authors': ['Vincent-Daniel Yun', 'Woosang Lim', 'Haneul Yoo', 'Sungjoo Yoo', 'Murali Annavaram', 'Sai Praneeth Karimireddy'], 'affiliations': ['New York University', 'Seoul National University', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2609.32259.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Быстрый трансфер кэша между разными моделей без переобучения', 'desc': 'В статье предлагается HeteroFold — метод безпрефиксного трансфера кэша ключ-значение между различными семействами языковых моделей в мультиагентных системах. Метод решает проблему несовместимости в токенизации, глубине моделей и представлении KV кэша, оставляя обе модели замороженными. HeteroFold выравнивает структуры моделей, трансформирует кэш отправителя в пространство получателя и калибрует его для сохранения поведения. Экспериментальные результаты показывают ускорение в 10.7 раз по сравнению с нативным префиллингом и значительное улучшение по сравнению с существующими методами трансфера KV кэша на бенчмарках с длинным контекстом.'}, 'en': {'title': 'HeteroFold: Efficient KV Cache Transfer for Multi-Agent LLMs', 'desc': "This paper introduces HeteroFold, a method for transferring key-value (KV) caches between different language models without needing to prefill the receiver's context. It addresses challenges like differences in tokenization and model architecture by aligning the structures and calibrating the cache for the receiver. HeteroFold allows for efficient communication between agents by reusing the sender's KV cache, significantly speeding up the process compared to traditional methods. The results demonstrate that HeteroFold outperforms existing techniques in both long and short context scenarios, making it a valuable advancement in multi-agent systems."}, 'zh': {'title': 'HeteroFold：高效的跨家族KV缓存重用', 'desc': '最近的多智能体大语言模型系统越来越多地结合异构模型以实现专业化的代理角色。然而，基于文本的通信要求每个接收者预填充发送者已经处理的共享上下文。重用发送者的关键值（KV）缓存可以避免这种冗余，但跨模型家族的无预填充传输必须处理标记化、模型深度和KV表示的差异。为了解决这些问题，我们提出了HeteroFold，这是一种无预填充的跨家族KV缓存传输方法，能够在保持发送者和接收者不变的情况下，实现高效的缓存传输。'}}}, {'id': 'https://huggingface.co/papers/2609.34621', 'title': 'Does Native 3D Texture Generation Necessarily Require 3D Assets for Training?', 'url': 'https://huggingface.co/papers/2609.34621', 'abstract': 'Abstract  Native 3D texture generation synthesizes colors directly in 3D space for a given geometry, conditioned on multi-view reference images. It is generally believed that training such models requires large-scale, high-quality real 3D asset data, whose acquisition remains a long-standing and challenging problem. In this work, we propose Tex-Zero, demonstrating that a high-fidelity native 3D texture generation framework can be trained without 3D assets. Our key observation is that only high-quality and fine-grained color information is essential for 3D texture training, while the required geometric information is less critical and can be manually constructed rather than obtained from real 3D assets. This finding makes it possible to transform abundant, high-quality 2D images into effective training samples for 3D texture generation. Specifically, we convert high-quality 2D images into 3D training samples by representing each image as a plane in 3D space and applying patch-wise random rotations and aggregation to construct complex geometric structures. Using these constructed image data, we train the Tex-Zero VAE, which can reconstruct real 3D assets with high quality despite never observing them during training. Building upon the Tex-Zero VAE, we train the Tex-Zero DiT also exclusively on the constructed image data, where the conditioning 2D multi-view images are transformed into planes in 3D space and also encoded by the Tex-Zero VAE, thereby reducing the representation gap and improving generation quality. Extensive experiments show that Tex-Zero generates high-fidelity 3D textures with fine-grained details solely using images as training data, offering a promising perspective on the data paradigm for scaling 3D texture generation.', 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '076c355db0c7a5c8', 'authors': ['Jiangshan Wang', 'Zeqiang Lai', 'Jiayi Guo', 'Xin Yang', 'Xin Huang', 'Jiarui Chen', 'Ziheng Ouyang', 'Chunchao Guo', 'Xiangyu Yue'], 'affiliations': ['Fudan University', 'MMLab, CUHK', 'Nankai University', 'Shanghai Innovation Institute', 'Tencent Hunyuan', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34621.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'От двумерных изображений к трёхмерным текстурам без 3D-данных', 'desc': 'В этой работе предлагается метод Tex-Zero для генерации трёхмерных текстур без использования реальных 3D-данных. Авторы показывают, что для обучения моделей синтеза текстур в 3D-пространстве достаточно высокачественной информации о цвете, а геометрия может быть сконструирована искусственно. Они трансформируют двумерные изображения в трёхмерные обучающие примеры, представляя каждое изображение как плоскость в пространстве с применением случайных ротаций и агрегации. Модель Tex-Zero VAE, обученная только на таких синтетических данных, способна восстанавливать реальные 3D-активы с высокой точностью, что открывает новую парадигму масштабирования генерации трёхмерных текстур.'}, 'en': {'title': 'Tex-Zero: 3D Texture Generation Without 3D Assets!', 'desc': 'The paper introduces Tex-Zero, a novel framework for generating high-quality 3D textures without the need for real 3D asset data. It highlights that while high-quality color information is crucial for training, geometric details can be manually created, allowing the use of abundant 2D images as training samples. By representing 2D images as planes in 3D space and applying transformations, the model can effectively learn to reconstruct 3D textures. The Tex-Zero VAE and Tex-Zero DiT models demonstrate that high-fidelity 3D textures can be generated solely from 2D images, paving the way for new approaches in 3D texture generation.'}, 'zh': {'title': '无3D资产的高保真纹理生成', 'desc': '本论文提出了一种名为Tex-Zero的框架，用于在没有真实3D资产的情况下生成高保真3D纹理。研究表明，3D纹理训练只需要高质量的颜色信息，而几何信息可以通过手动构建来获得。通过将高质量的2D图像转换为3D训练样本，Tex-Zero能够有效地生成复杂的几何结构。实验结果表明，Tex-Zero能够仅使用图像作为训练数据，生成具有细致纹理的高质量3D模型。'}}}, {'id': 'https://huggingface.co/papers/2610.00737', 'title': 'Personalized Image Generation with Reasoning and Reflection', 'url': 'https://huggingface.co/papers/2610.00737', 'abstract': "Abstract  Personalized image generation has remained narrowly focused on conditional synthesis from curated visual exemplars, rather than capturing who a user is. In practice, however, a user's personal context is much richer, comprising reviews, posts, images, captions, and metadata accumulated over time. A truly personalized generator should leverage this history to produce images aligned with the user's lifestyle and aesthetic preferences. To this end, we introduce the first unified benchmark for personalized image generation from user histories. The benchmark comprises two complementary tasks and a multi-axis evaluation protocol that assesses target fidelity, visual quality, user distinguishability, semantic alignment with the user's history, and task-specific utility. Grounded in real-world e-commerce and social media settings, the benchmark includes: (1) Personalized Scene Generation, which places a given object in a scene that reflects a user's preferences and lifestyle, motivated by personalized product presentation; and (2) Personalized Creative Generation, which generates a novel image on a specified topic that is faithful to a user's aesthetic and visual identity, motivated by social media content creation. We further propose PEARL, which couples a multimodal reasoner with a frozen image generator in an interleaved reason-reflect loop optimized with differential data reward. Across both tasks, PEARL outperforms strong baselines, achieving an average improvement of 15% across personalization metrics.", 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5e39afc79d3a43cd', 'authors': ['Bo Ni', 'Ngoc N. Tran', 'Qinwen Ge', 'Franck Dernoncourt', 'Seunghyun Yoon', 'Samyadeep Basu', 'Sungchul Kim', 'Puneet Mathur', 'Nedim Lipka', 'Tong Yu', 'Yu Wang', 'Ryan A. Rossi', 'Tyler Derr'], 'affiliations': ['Adobe Systems', 'University of Georgia', 'University of Maryland, College Park', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00737.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#optimization', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Персонализованная генерация изображений через историю пользователя', 'desc': 'В статье представлена первая унифицированная бенчмарк для персонализированной генерации изображений на основе истории пользователя, которая включает его отзывы, посты, фотографии и метаданные. Авторы определяют две дополнительные задачи: персонализированную генерацию сцен для товаров и творческую генерацию изображений, соответствующие предпочтениям пользователя. Предложенный метод PEARL использует мультимодальный рассуждающий модуль с замороженным генератором изображений в интерактивном цикле, оптимизированном через дифференцируемую награду за данные. Модель PEARL превосходит базовые подходы, достигая в среднем 15% улучшения по метрикам персонализации.'}, 'en': {'title': 'Revolutionizing Personalized Image Generation with User Histories', 'desc': "This paper addresses the challenge of personalized image generation by utilizing a user's comprehensive history, including reviews, posts, and images, rather than just curated examples. It introduces a new benchmark that evaluates personalized image generation through two tasks: creating scenes that reflect user preferences and generating novel images aligned with a user's aesthetic. The proposed method, PEARL, combines a multimodal reasoner with an image generator to enhance personalization through a feedback loop. The results show that PEARL significantly improves personalization metrics, outperforming existing methods by an average of 15%."}, 'zh': {'title': '个性化图像生成的新标准', 'desc': '这篇论文探讨了个性化图像生成的研究，强调了用户的个人背景信息在生成过程中的重要性。作者提出了一个统一的基准，旨在通过用户的历史数据来生成符合其生活方式和审美偏好的图像。基准包括两个互补的任务：个性化场景生成和个性化创意生成，并采用多维度评估协议来衡量生成图像的质量和与用户历史的语义一致性。论文中还提出了PEARL模型，通过多模态推理器与图像生成器的结合，显著提高了个性化生成的效果。'}}}, {'id': 'https://huggingface.co/papers/2609.38585', 'title': 'FlexRouter: Learning Complementary Model Sets for Flexible LLM Routing', 'url': 'https://huggingface.co/papers/2609.38585', 'abstract': 'Abstract  Existing Large Language Model (LLM) routing methods score LLMs independently to select top-k models. However, this ignores model correlations and enforces a rigid computational budget. Consequently, routers often select redundant models that share failure modes, limiting the overall probability of success. To address this, we propose FlexRouter, a routing framework that explicitly models model complementarity. FlexRouter optimizes for answer coverage, maximizing the probability that at least one selected model yields a correct response. This objective aligns with practical inference pipelines where multiple candidate outputs are generated and a downstream verifier or user selects the final one. We formulate routing as a coverage-oriented subset selection problem and model the routing policy using Determinantal Point Processes (DPPs), which naturally capture both model competence and redundancy. To directly optimize coverage without requiring a ground-truth target subset, we introduce a training objective based on marginalizing over failure sets. During inference, we employ a greedy strategy based on marginal log-determinant gains, enabling the router to adaptively determine subset sizes without a predefined budget. Extensive experiments on the large-scale RouterEval benchmark demonstrate that our proposed FlexRouter achieves higher coverage with lower redundancy across both in-domain and out-of-domain tasks than strong baselines while maintaining flexible inference cost.', 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '7935dc14c967844f', 'authors': ['Wang Wei', 'Harry Yang', 'Tiankai Yang', 'Samyadeep Basu', 'Hongjie Chen', 'Andy Zhao', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Hoda Eldardiry'], 'affiliations': ['Adobe Research', 'Dolby Labs', 'Independent Researcher', 'University of Southern California', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.38585.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#inference', '#training'], 'emoji': '🛣️', 'ru': {'title': 'Умная маршрутизация: выбираем дополняющие друг друга модели для максимальной полноты ответа', 'desc': 'В статье предложен новый метод маршрутизации запросов между несколькими большими языковыми моделями, который учитывает корреляции и дополнительность моделей, а не оценивает их независимо. Авторы формулируют задачу как проблему выбора подмножества моделей, максимизирующую вероятность того, что хотя бы одна из выбранных моделей даст правильный ответ. Для моделирования политики маршрутизации используются детерминантные точечные процессы, которые естественным образом отражают как компетентность модели, так и её избыточность. Предложенный метод FlexRouter позволяет достичь большей полноты ответов при меньшей избыточности, а также гибко определять количество моделей без предзаданного бюджета вычислений.'}, 'en': {'title': 'Maximizing Model Coverage with FlexRouter', 'desc': 'The paper introduces FlexRouter, a new framework for routing Large Language Models (LLMs) that improves model selection by considering the complementarity between models rather than evaluating them independently. This approach aims to enhance answer coverage, ensuring that at least one selected model provides a correct response, which is crucial for practical applications. FlexRouter formulates the routing process as a coverage-oriented subset selection problem and utilizes Determinantal Point Processes (DPPs) to effectively balance model competence and redundancy. Experimental results show that FlexRouter outperforms existing methods by achieving higher coverage and lower redundancy, while also allowing for flexible inference costs.'}, 'zh': {'title': 'FlexRouter：优化模型选择的灵活路由框架', 'desc': '现有的大型语言模型（LLM）路由方法独立评分模型以选择前k个模型，但这忽视了模型之间的相关性，并强制执行严格的计算预算。因此，路由器常常选择共享失败模式的冗余模型，限制了成功的整体概率。为了解决这个问题，我们提出了FlexRouter，一个明确建模模型互补性的路由框架。FlexRouter优化答案覆盖率，最大化至少一个选定模型产生正确响应的概率。'}}}, {'id': 'https://huggingface.co/papers/2609.34381', 'title': 'Joint and Cross-Modal Video-Audio Generation and Editing: A Unified Formulation and Design Taxonomy', 'url': 'https://huggingface.co/papers/2609.34381', 'abstract': 'Abstract  Video and audio are perceived together, yet most generative models treat them in isolation. We examine methods that model the two modalities jointly, generate one from the other, or edit them in a coupled manner, organized around a single question: how is the output kept coherent across modalities in time and semantics? A unified formulation casts joint generation, cross-modal generation, and joint editing as three problems defined on a single distribution over audio-visual pairs, and a taxonomy compares methods along five design axes. To our knowledge, this is the first overview to systematically taxonomize joint audio-visual editing, which we map as nine edit categories spanning 28 edit types. We describe methods, datasets, and metrics for each setting and close with the open problems we view as most consequential.', 'score': 7, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '1d1573a3139ef4c1', 'authors': ['Abhinav Sharma', 'Sai Karthik Navuluru', 'Wang Wei', 'Daksh Dangi', 'Xiangbo Gao', 'Li Li', 'Bo Ni', 'Vardhan Dongre', 'Junda Wu', 'Xiyang Hu', 'Jiuxiang Gu', 'Seunghyun Yoon', 'Tong Yu', 'Chien Van Nguyen', 'Mohamed Elmoghany', 'Nedim Lipka', 'Hoda Eldardiry', 'Hongjie Chen', 'Tyler Derr', 'Thien Huu Nguyen', 'Zhengzhong Tu', 'Nesreen K. Ahmed', 'Franck Dernoncourt', 'Ryan A. Rossi'], 'affiliations': ['Adobe Research', 'Arizona State University', 'Cisco', 'Dolby Laboratories', 'Stanford University', 'Texas A&M University', 'University of Illinois Urbana-Champaign', 'University of Massachusetts Amherst', 'University of Oregon', 'University of Southern California', 'University of Texas at Dallas', 'Vanderbilt University', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.34381.jpg', 'data': {'categories': ['#video', '#multimodal', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Согласованная генерация и редактирование видео и аудио через мультимодальные модели', 'desc': 'В статье рассматриваются методы совместной обработки видео и аудио, которые обычно моделируются отдельно. Авторы предлагают единую формулировку для задач совместной генерации, кросс-модальной генерации и совместного редактирования, основанную на распределении пар аудио-видео. Они разработали таксономию методов по пяти ключевым осям и систематизировали редактирование аудио-видео в девять категорий с 28 типами редактирования. Работа описывает методы, датасеты и метрики для каждой задачи, выявляя основные открытые проблемы в области мультимодальной генерации.'}, 'en': {'title': 'Unifying Video and Audio: A Coherent Approach to Joint Generation and Editing', 'desc': 'This paper explores how to generate and edit video and audio together, rather than separately, to maintain coherence in both time and meaning. It introduces a unified framework that treats joint generation, cross-modal generation, and joint editing as interconnected problems based on a shared distribution of audio-visual pairs. The authors provide a comprehensive taxonomy that categorizes joint audio-visual editing into nine categories with 28 specific types of edits. Additionally, they discuss various methods, datasets, and evaluation metrics, while highlighting important open questions in the field.'}, 'zh': {'title': '音视频联合生成与编辑的全新视角', 'desc': '本论文探讨了视频和音频的联合生成模型，强调这两种模态在时间和语义上的一致性。我们提出了一种统一的框架，将联合生成、跨模态生成和联合编辑视为在音视频对的单一分布上定义的三个问题。通过对现有方法的分类，我们识别出九种编辑类别和28种编辑类型。最后，我们讨论了每种设置的方法、数据集和评估指标，并指出了未来研究中最重要的开放问题。'}}}, {'id': 'https://huggingface.co/papers/2609.36435', 'title': 'MemFold: Learning Compact Soft Memory for Long-Context Personalization via On-Policy Optimization', 'url': 'https://huggingface.co/papers/2609.36435', 'abstract': "Abstract  An assistant that serves the same user over a long horizon has to answer from what that user has revealed: which preferences still hold, which were revised, and which constraints apply now. Retaining that information is not the same as acting on it, and the two are usually optimized as if they were. Keeping the information as text makes the reader's input grow with the retained history, while compressing it into a fixed number of latent vectors bounds the interface but is typically trained to reconstruct text or imitate reference answers, both of which are scored on sequences the reader never produced. We present MemFold, which optimizes a fixed-budget soft memory by the behavior it supports. A query-conditioned textual memory is compressed into K continuous vectors that form the reader's memory interface, and the reader is then trained on its own rollouts under two complementary signals: group-relative rewards for task outcomes, and confidence-gated on-policy distillation in which a frozen textual-memory teacher re-scores the student's sampled tokens under the textual memory. The teacher is never sampled from, so supervision stays on the student's current distribution and adds no autoregressive decoding; at inference it is removed entirely. Across three Qwen backbones, MemFold attains the highest accuracy we measure on PersonaMem-32K and PersonaMem-128K, with margins that widen at the longer history length, and transfers to PrefEval and LongMemEval without target-domain training. Ablations attribute most of the task gain to the reward term and a smaller additional gain to the teacher signal, and memory interventions show that the reader depends on the instance-specific content of its soft memory.", 'score': 6, 'issue_id': 3365, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'ccf791afdc0cfa74', 'authors': ['Jingxuan Wu', 'Yuzhe Yang', 'Yiqiao Huang', 'Chengzhi Liu', 'Qingni Wang', 'Chengxuan Qian', 'Shutong Wu', 'Jiawei Zhang', 'Xin Eric Wang'], 'affiliations': ['Harvard University', 'University of California, Santa Barbara', 'University of North Carolina at Chapel Hill', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.36435.jpg', 'data': {'categories': ['#multimodal', '#rlhf', '#alignment', '#training', '#optimization', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Компактная память для персонализированного ассистента', 'desc': 'В статье представлена MemFold — система для обучения LLM сохранять персональную информацию о пользователе в фиксированном объёме памяти. Авторы компрессируют текстовую историю взаимодействий в K непрерывные векторы, которые формируют интерфейс памяти модели. Модель обучается на собственных откатах, используя две сигналы: относительные награды за качество выполнения задач и дистилляцию с учителем, где замороженный учитель на текстовой памяти переоценивает токены студента. Метод достигает лучших результатов на бенчмарках PersonaMem-32K и PersonaMem-128K, показывая улучшение с увеличением длины истории и хорошо трансферируется на другие наборы данных без дополнительного обучения.'}, 'en': {'title': 'MemFold: Optimizing Memory for Long-Term User Interaction', 'desc': 'The paper introduces MemFold, a machine learning model designed to enhance long-term user interaction by effectively managing user preferences and constraints over time. It utilizes a fixed-budget soft memory system that compresses user input into a limited number of continuous vectors, allowing for efficient memory management. The model is trained using a combination of group-relative rewards and confidence-gated on-policy distillation, ensuring that it learns from its own experiences while being guided by a static teacher model. MemFold demonstrates superior performance on various benchmarks, particularly as the length of user history increases, highlighting its effectiveness in retaining and utilizing user-specific information.'}, 'zh': {'title': '优化长期记忆，提升用户交互体验', 'desc': '本文提出了一种名为MemFold的模型，旨在优化长期用户交互中的记忆管理。MemFold通过将查询条件的文本记忆压缩为固定数量的连续向量，来支持用户的行为。该模型在训练过程中使用两种互补信号：任务结果的相对奖励和基于信心的策略蒸馏。实验结果表明，MemFold在多个基准测试中表现出色，尤其是在处理较长历史记录时，准确率显著提高。'}}}, {'id': 'https://huggingface.co/papers/2610.00437', 'title': 'JevSpawn: Adaptive Agentic Inference through Compositional Action Spaces', 'url': 'https://huggingface.co/papers/2610.00437', 'abstract': 'Abstract  LLM agents generate intermediate reasoning and actions token by token, making extended interactions slow and computationally expensive. Jev-style models offer fast probabilistic predictions over finite fields, but require those fields to be specified in advance. This requirement limits autonomous task solving, where the available actions must be derived from natural language instructions and adapted through interaction. We introduce JevSpawn, a compositional policy that connects natural language task specifications to finite probabilistic exploration. Parallel action spawning is coupled with feedback driven branch selection, representation revision, and recovery from retained alternatives. Shared action structure and model prefixes reduce repeated generation and context computation without additional training. Evaluations on eight benchmark tasks against seven agent baselines and a TypeSafe Jev variant establish JevSpawn as a promising approach to structured agentic inference, with improved task performance and faster navigation.', 'score': 6, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '571414b6da677b3b', 'pdf_title_img': 'assets/pdf/title_img/2610.00437.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Быстрые агенты через структурированное вероятностное исследование действий', 'desc': 'В статье предлагается JevSpawn — композиционная политика для ускорения работы агентов на основе LLM путём использования вероятностных моделей над конечными множествами действий. Система преобразует естественноязычные инструкции в конкретные наборы возможных действий и адаптирует их через взаимодействие с окружением. Параллельное порождение действий комбинируется с обратной связью для выбора ветвей и восстановления из сохранённых альтернатив. Общая структура действий и префиксы модели уменьшают повторную генерацию, что повышает скорость без дополнительного обучения.'}, 'en': {'title': 'JevSpawn: Fast and Adaptive Task Solving for LLM Agents', 'desc': 'This paper presents JevSpawn, a new approach to improve the efficiency of LLM agents in performing tasks based on natural language instructions. Traditional models generate actions slowly and require predefined fields, which limits their adaptability. JevSpawn introduces a compositional policy that allows for fast probabilistic exploration and dynamic action selection based on feedback. The method enhances performance by reducing redundant computations and improving navigation speed across various benchmark tasks.'}, 'zh': {'title': 'JevSpawn：提升语言模型代理效率的新策略', 'desc': '本论文介绍了一种名为JevSpawn的组合策略，旨在提高大规模语言模型（LLM）代理的推理和行动效率。JevSpawn通过将自然语言任务规范与有限概率探索相连接，克服了传统模型在任务解决中的局限性。该方法结合了并行行动生成和基于反馈的分支选择，能够在不增加额外训练的情况下减少重复生成和上下文计算。实验结果表明，JevSpawn在八个基准任务上表现优于七个代理基线，展示了其在结构化代理推理中的潜力。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.36138', 'title': 'When Does Correction Become Repair? Mechanistic Auditing of Internal Interventions in Tool-Using LLMs', 'url': 'https://huggingface.co/papers/2609.36138', 'abstract': 'Abstract  Before invoking external tools, an agentic LLM must select among a K-way action space: executing a call, seeking clarification, answering directly, or declining. While internal activation steering can alter these pre-execution decisions, conventional aggregate metrics obscure where altered states land and what collateral damage they inflict. We present SAKIKO, an auditing framework that formalizes representation repair via directional error discovery, router-conditioned intervention, destination-resolved verification, and prospectively frozen statistical licensing. Across seven LLMs on When2Call and MetaTool, channel-keyed interventions induce direction-specific net gains in five models; across three sealed evaluations, none of 59 budget-matched random directions matches calibrated target gain. Crucially, destination auditing shows that behavioral movement does not equal repair: an intervention achieving +55 net gain corrupts over half of the baseline-correct decisions it touches, and promising point estimates on Qwen3-4B and Gemma-2-9B are formally declined due to finite-sample uncertainty. SAKIKO establishes the necessity of outcome-resolved adjudication before claiming internal repair. Code: https://github.com/ruizheliUOA/mechanistic-tool-use-llm.', 'score': 6, 'issue_id': 3363, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '2e578eed5201748e', 'authors': ['Jiayi Li', 'Ruizhe Li'], 'affiliations': ['School of Computer Science, University of Birmingham, UK', 'University of the Chinese Academy of Sciences, China'], 'pdf_title_img': 'assets/pdf/title_img/2609.36138.jpg', 'data': {'categories': ['#agents', '#training', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Проверка реального ремонта: когда улучшение метрик обманывает', 'desc': 'В работе представлен фреймворк SAKIKO для аудита внутреннего управления поведением больших языковых моделей при выборе инструментов. Авторы разработали метод направленного поиска ошибок и вмешательства в активации нейронов для улучшения решений модели о вызове внешних инструментов. Ключевой вклад заключается в том, что простое улучшение метрик не гарантирует истинное исправление — модель может начать принимать правильные решения в одних случаях, но испортить корректные предсказания в других. Исследование показало, что необходимо тщательное аудирование последствий вмешательств перед тем, как утверждать об успешном исправлении внутреннего представления модели.'}, 'en': {'title': 'SAKIKO: Ensuring True Improvement in LLM Decision-Making', 'desc': "This paper introduces SAKIKO, a framework designed to audit and improve the decision-making processes of large language models (LLMs) when they interact with external tools. It emphasizes the importance of understanding how interventions can lead to both positive and negative outcomes, highlighting that not all behavioral changes indicate true improvement. The framework employs techniques like directional error discovery and destination-resolved verification to ensure that any adjustments made to the model's actions are genuinely beneficial. The findings reveal that while some interventions can yield significant gains, they may also inadvertently harm other decisions, underscoring the need for careful evaluation of model behavior."}, 'zh': {'title': 'SAKIKO：确保大型语言模型的决策修复', 'desc': '本文提出了一种名为SAKIKO的审计框架，用于在调用外部工具之前帮助大型语言模型（LLM）选择最佳行动。该框架通过方向性错误发现、路由器条件干预、目标验证和统计许可等方法，形式化了表示修复的过程。研究表明，尽管某些干预措施在模型中产生了正向收益，但并不意味着所有行为变化都能实现修复，许多干预可能会损害原本正确的决策。SAKIKO强调在声称内部修复之前，必须进行结果导向的裁定。'}}}, {'id': 'https://huggingface.co/papers/2609.36956', 'title': 'Controlled Decoding Attacks on Black-Box LLMs', 'url': 'https://huggingface.co/papers/2609.36956', 'abstract': 'Abstract  Manipulating next-token probabilities during generation can bypass the safety alignment of large language models. Existing approaches, however, rely on access to model weights or numerical token probabilities and therefore do not apply to interfaces that return only sampled text. Reconstructing probabilities from sampled outputs offers a possible alternative, but finite sampling produces sparse and noisy estimates, while repeating this process at every generation step incurs substantial query costs. Our empirical observations suggest that large distributional changes along successful jailbreak trajectories are concentrated at a small subset of positions, motivating selective control. We introduce , a framework for jailbreaking through text-only continuation interfaces that permit repeated sampling and assistant-prefix continuation. Sample-Based Distribution Reconstruction combines sampled outputs with a prior over unobserved actions to obtain a usable control signal. Risk-Gated Residual Control uses the evolving response prefix to decide when to reconstruct and modify the distribution, concentrating sampling costs at selected positions. Speculative Multi-Token Execution further amortizes target calls by verifying and accepting draft prefixes that require no intervention. Across four target endpoints and three benchmarks,  achieves the highest mean score most comparisons against baselines.', 'score': 6, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '79d911fd62d3a9b1', 'authors': ['Jesson Wang', 'Shawn Li', 'Wei Yang', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Charith Peris', 'Yue Zhao'], 'affiliations': ['Adobe', 'Amazon', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2609.36956.jpg', 'data': {'categories': ['#security', '#alignment'], 'emoji': '🔓', 'ru': {'title': 'Обход защиты LLM через реконструкцию распределений вероятностей в текстовом интерфейсе', 'desc': 'В этой работе исследуется способность манипулировать вероятностями следующего токена во время генерации для обхода механизмов безопасности больших языковых моделей через текстовые интерфейсы. Авторы предлагают框架, который реконструирует распределение вероятностей из сэмплированных выходов, используя приор для ненаблюдаемых действий. Метод использует избирательный контроль на ключевых позициях и спекулятивное выполнение, снижая вычислительные затраты. Экспериментальные результаты на нескольких бенчмарках показывают превосходство предложенного подхода над существующими методами атаки.'}, 'en': {'title': 'Selective Control for Safer Text Generation', 'desc': 'This paper addresses the challenge of manipulating next-token probabilities in large language models to bypass safety measures. Traditional methods require access to model weights or token probabilities, which is not feasible for many applications. The authors propose a new framework that reconstructs probabilities from sampled outputs, allowing for selective control over the generation process. Their approach, which includes techniques like Sample-Based Distribution Reconstruction and Risk-Gated Residual Control, demonstrates improved performance in generating desired outputs while minimizing costs associated with repeated sampling.'}, 'zh': {'title': '通过文本续写破解大型语言模型的安全性', 'desc': '本文探讨了如何在生成过程中操控下一个词的概率，以绕过大型语言模型的安全对齐。现有的方法依赖于模型权重或数值令牌概率，因此不适用于仅返回采样文本的接口。我们提出了一种新的框架，通过文本续写接口进行破解，结合采样输出和未观察到的动作的先验信息，以获得可用的控制信号。实验结果表明，该方法在多个基准测试中表现优异，能够有效降低采样成本并提高生成质量。'}}}, {'id': 'https://huggingface.co/papers/2609.34677', 'title': 'Learning What to Recall: Adaptive Multi-Cue Episodic Memory for World Models', 'url': 'https://huggingface.co/papers/2609.34677', 'abstract': 'Abstract  World models predict future observations from current experience and actions, yet prediction can depend on observations seen far in the past. Episodic memory preserves past observations for later recall; however, as memory accumulates, it raises a fundamental question: which memories are useful for the current prediction, and which available retrieval cues should be trusted to find them? This is challenging because fixed criteria based on recency, pose overlap, or visual similarity can be unreliable across environments and queries. We propose Future-Aware Recall (FAR), a framework that learns episodic recall from future-aware predictive supervision and adaptive multi-cue scoring. During training, FAR measures predictive utility by the conditional log-likelihood of the realized future given recalled context, approximated by negative diffusion prediction loss, and uses it to train a retriever that remains future-blind at inference. The retriever learns cue-specific relevance and automatically determines which available retrieval cues, such as time, pose, vision, and audio, to trust for each query when selecting memories. Across three complementary settings, FAR outperforms hand-designed recall even with the same retrieval cues, automatically adapts which available cues to trust, and recalls the right history as the world changes. Together, these results establish FAR as a flexible, principled approach to episodic memory access in world models.', 'score': 6, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '2f617c80684724d4', 'authors': ['Beomsu Kim', 'Chieh-Hsin Lai', 'Bac Nguyen', 'Amir Bar', 'Jong Chul Ye', 'Yuki Mitsufuji'], 'affiliations': ['Imperial College London', 'KAIST', 'Sony Group Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2609.34677.jpg', 'data': {'categories': ['#diffusion', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Будущее как учитель: обучение памяти предсказаниями завтра', 'desc': 'В работе предложен метод Future-Aware Recall (FAR) для обучения эпизодической памяти в мировых моделях, которые предсказывают будущие наблюдения. Система учится определять, какие прошлые наблюдения полезны для текущего предсказания, используя суперконтрастное обучение на основе условного логарифма правдоподобия реализованного будущего. FAR использует адаптивное мульти-сигнальное оценивание (время, поза, визуальная информация, аудио) и автоматически определяет, каким сигналам доверять при поиске релевантных воспоминаний для каждого запроса. Экспериментальные результаты показывают, что FAR превосходит ручной подход к выбору памяти и адаптируется к изменениям окружающей среды.'}, 'en': {'title': 'Enhancing Memory Recall with Future Awareness', 'desc': "This paper introduces Future-Aware Recall (FAR), a new framework for improving episodic memory in world models. FAR focuses on predicting future observations by effectively recalling relevant past experiences, using a method that adapts to different cues like time and visual context. It learns which memories are most useful for current predictions by evaluating their predictive utility during training, while remaining flexible during inference. The results show that FAR outperforms traditional methods by automatically selecting the most relevant cues for memory retrieval, enhancing the model's ability to adapt to changing environments."}, 'zh': {'title': '未来感知回忆：灵活的情节记忆访问方法', 'desc': '本论文提出了一种名为未来感知回忆（FAR）的框架，用于从未来感知的预测监督中学习情节回忆。FAR通过评估回忆上下文的条件对数似然性来衡量预测效用，并利用负扩散预测损失进行训练。该框架能够自动确定在选择记忆时应信任的检索线索，如时间、姿态、视觉和音频。实验结果表明，FAR在多个设置中优于手动设计的回忆方法，能够灵活适应环境变化。'}}}, {'id': 'https://huggingface.co/papers/2610.01026', 'title': 'It Takes Workflows to Evolve Better Workflows', 'url': 'https://huggingface.co/papers/2610.01026', 'abstract': "Abstract  Tackling complex real-world tasks can exceed the capabilities of a single large language model (LLM), motivating the use of multi-agent workflows that coordinate specialized agents to work together on these tasks. Recent methods train LLMs to construct better workflows from execution outcomes, but they optimize only the workflow generator, while the other agents that build or execute each workflow remain fixed even though every outcome depends on all of them. However, extending training beyond the generator is challenging: the agents are coupled, and a workflow's outcome is a single sparse score that cannot tell which agent causes a failure. We propose FloWright, which leverages the workflow as a harness to optimize workflows. By introducing a hierarchical, structure-aware reward paradigm, FloWright enables one role to self-evolve and two or more roles to co-evolve, with no additional models, labels, or executions. Considering the limitation that workflows are commonly trained and evaluated on data that a single agent can already handle, we further propose DataWright, an adaptive data hardening approach that converts existing datasets into workflow-level tasks with increased difficulty. Across document, slide, chart, code, math, and finance tasks, small open models trained with FloWright achieve improved performance by up to +7.41%, with co-evolving (+5.03%) more roles gaining more than optimizing one of them alone (+2.83%). Our project page: https://xhguo7.github.io/FloWright/.", 'score': 6, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '4641271fc1838904', 'authors': ['Xuehang Guo', 'Haoyu Wang', 'Haifeng Chen', 'Yangyi Chen', 'Zhenhailong Wang', 'Qingyun Wang'], 'affiliations': ['NEC Corporation of America', 'University of Illinois Urbana-Champaign', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2610.01026.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Совместная эволюция агентов в многоагентных рабочих процессах', 'desc': 'В работе предлагается FloWright — метод для оптимизации многоагентных систем на основе LLM, где несколько специализированных агентов сотрудничают при решении сложных задач. Авторы вводят иерархическую, структурно-ориентированную систему вознаграждений, которая позволяет одному агенту самоэволюционировать, а двум и более агентам совместно развиваться без дополнительных моделей и размеченных данных. Дополнительно предлагается DataWright — метод адаптивного усложнения данных, который преобразует существующие датасеты в задачи уровня рабочих процессов с повышенной сложностью. Экспериментально показано, что малые модели, обученные с FloWright, достигают улучшения производительности до 7.41%, причём совместная эволюция нескольких агентов (+5.03%) даёт лучший результат, чем оптимизация одного агента (+2.83%).'}, 'en': {'title': 'Empowering Multi-Agent Workflows for Enhanced Task Performance', 'desc': 'This paper introduces FloWright, a method for optimizing multi-agent workflows in complex tasks using large language models (LLMs). Unlike previous approaches that only optimize the workflow generator, FloWright allows all agents involved in the workflow to evolve together, improving overall performance. The authors also present DataWright, a technique that enhances existing datasets to create more challenging workflow-level tasks. The results show that small open models trained with FloWright can achieve significant performance improvements across various tasks by enabling agents to co-evolve.'}, 'zh': {'title': '优化多代理工作流，提升任务性能！', 'desc': '本论文提出了一种名为FloWright的方法，旨在优化多代理工作流，以解决复杂的现实任务。通过引入层次化的奖励机制，FloWright使得不同角色能够自我进化和共同进化，从而提高工作流的整体性能。我们还提出了DataWright，一种自适应数据增强方法，将现有数据集转化为更具挑战性的工作流任务。实验结果表明，使用FloWright训练的小型开放模型在多个任务上性能提升显著，尤其是共同进化的角色表现更佳。'}}}, {'id': 'https://huggingface.co/papers/2609.22753', 'title': 'Replacing Large Language Models with Jev Decision Models for Low-Latency Edge Service Orchestration', 'url': 'https://huggingface.co/papers/2609.22753', 'abstract': "Abstract  Natural-language service requests can require a language-model decision before execution starts, consuming part of the request's latency budget. We integrate Jev's decision-oriented application programming interface (API) into edge service orchestration to reduce this overhead while retaining service completion. The integration extracts four to eight bounded intent fields and applies a shared validator, admission policy, and scheduler, accounting for decision waiting throughout the request timeline. We compare Jev, two self-hosted decision models, and three hosted large language models (LLMs) on 8,280 verified requests and on a live admission path with modeled execution and a real optical character recognition service. Across 33 test conditions, Jev reduces median decision latency by 22.7-64.5% relative to the fastest LLM. This latency barely moves with input size, contract width, or catalog size. On four-field contracts, Jev's API fees per correct decision are 59.7-80.9% lower at a cost of a few exact-match points, while wide contracts mark the limit of the substitution. Receiving the service catalog with each request, Jev names unseen services as accurately as known ones. On the live admission path, Jev keeps 0.91-0.95 of requests exact and on time at loads where the LLMs fall below 0.1. Since caching repeated descriptions gives the interpreters nearly the same latency, Jev's gain lies in fresh decisions. These results support decision-model substitution for latency-bound admission on bounded contracts.", 'score': 5, 'issue_id': 3366, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'd14e7a6b3c9bbac4', 'authors': ['Delong Li', 'Xu Wang', 'Haochen Gong', 'Rui Lang', 'Guangsheng Yu'], 'affiliations': ['School of Electrical, Mechanical and Biomedical Engineering, University of Technology Sydney, Sydney, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2609.22753.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Быстрые решения вместо мощных моделей: замена LLM на специализированные системы для минимизации задержек', 'desc': 'В работе предлагается интегрировать специализированную модель принятия решений Jev в систему оркестрации сервисов на граничных вычислениях для снижения задержки при обработке естественных языковых запросов. Система извлекает ограниченное количество полей намерения пользователя и применяет валидатор, политику допуска и планировщик, учитывая время ожидания решения в течение всего жизненного цикла запроса. Сравнение Jev с самостоятельно развёрнутыми моделями и облачными LLM на реальных данных показало, что Jev снижает медианную задержку принятия решения на 22.7-64.5% при значительно более низких затратах. Результаты демонстрируют, что специализированные модели могут эффективно заменять универсальные LLM для задач принятия решений с ограниченными контрактами и жёсткими требованиями по времени отклика.'}, 'en': {'title': 'Jev: Speeding Up Service Requests with Smart Decisions', 'desc': 'This paper presents Jev, a decision-oriented API designed to enhance the efficiency of natural-language service requests by minimizing latency. By integrating Jev into edge service orchestration, the system can quickly extract intent fields and apply a shared validator and scheduler, which streamlines the decision-making process. The results show that Jev significantly reduces median decision latency by 22.7-64.5% compared to the fastest large language models, while maintaining high accuracy in service naming. Overall, Jev demonstrates a promising approach for improving latency-bound admissions in service requests, especially under varying loads and contract conditions.'}, 'zh': {'title': 'Jev：提升决策效率，降低延迟的智能API', 'desc': '这篇论文探讨了如何通过集成Jev的决策导向API来减少自然语言服务请求的延迟。研究表明，Jev能够在保持服务完成的同时，显著降低决策延迟，减少22.7%到64.5%。通过提取意图字段并应用共享验证器和调度器，Jev在处理请求时表现出色。实验结果显示，Jev在高负载情况下的准确性和及时性远超其他大型语言模型。'}}}, {'id': 'https://huggingface.co/papers/2609.37690', 'title': 'Honeycomb: Constant-Size Scene Memory Representation for Video World Models', 'url': 'https://huggingface.co/papers/2609.37690', 'abstract': 'Abstract  Video world models require persistent scene memory to maintain consistency during long-horizon video generation. Existing spatial memories accumulate RGB observations or latent features, increasing storage requirements as generation proceeds. We introduce Honeycomb, a video world model built on HexMemory, our proposed low-rank representation for storing scene features in a fixed-size memory with a total of six spatial and spatiotemporal planes. A feed-forward writer maps each generated chunk into new plane features. As the spatial coverage or temporal range expands, we warp the previous planes while preserving their dimensions, then fuse them with the new features through confidence-weighted pooling and a learned residual correction. A reader retrieves latents from HexMemory to condition subsequent video generation. The writer processes only observations from the new chunk, avoiding per-scene optimization and repeated processing of the full history. Experiments on WorldScore and RealEstate10K demonstrate strong video generation quality and robust revisit consistency while keeping HexMemory feature storage constant throughout generation. Code and additional visualizations are available on our project page at https://jackswl.github.io/honeycomb/.', 'score': 5, 'issue_id': 3364, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'e8184b366080d052', 'authors': ['Jack Wei Lun Shi', 'Kaichen Zhou', 'Haoyu Chen', 'Yufeng Weng', 'Keane Ong', 'Ruojin Cai', 'Hang Hua', 'Justin K. W. Yeoh', 'Mengyu Wang'], 'affiliations': ['Harvard University', 'MIT', 'MIT-IBM Watson AI Lab', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.37690.jpg', 'data': {'categories': ['#architecture', '#training', '#video'], 'emoji': '🍯', 'ru': {'title': 'Компактная память для видеогенерации через низкоранговое представление', 'desc': 'В работе предлагается Honeycomb — видео world model, использующая HexMemory для компактного хранения информации о сцене в памяти фиксированного размера с помощью шести пространственных и пространственно-временных плоскостей. Модель содержит два компонента: writer, который преобразует каждый новый видеофрагмент в признаки плоскостей, и reader, который извлекает латентные представления для генерации следующих кадров. По мере расширения пространственного охвата или временного диапазона предыдущие плоскости искажаются с сохранением размерности, а затем объединяются с новыми признаками через взвешенное по уверенности объединение и изученную остаточную коррекцию. Экспериментальные результаты на наборах данных WorldScore и RealEstate10K показывают высокое качество видеогенерации и стабильность сцены при постоянном объёме памяти HexMemory.'}, 'en': {'title': 'Efficient Video Generation with Fixed-Size Memory', 'desc': 'This paper presents Honeycomb, a video world model that utilizes HexMemo
