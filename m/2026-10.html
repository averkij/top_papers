ata curation, model training, and video generation processes. The framework includes PhysCapBench, a tool that breaks down physical processes into smaller assertions for better evaluation and refinement of physical captions. The results show that models enhanced with Physis-Lang significantly improve the physical plausibility of generated videos compared to existing state-of-the-art models.'}, 'zh': {'title': '用物理语言提升视频生成的合理性', 'desc': '本论文提出了一种名为Physis-Lang的框架，用于通过物理语言来描述和生成视频。该框架认为，物理知识可以通过语言有效地表示，从而改善视频生成的物理合理性。我们构建了PhysCapBench来评估物理过程的描述，并通过迭代分析错误来优化生成的物理描述。实验结果表明，使用Physis-Lang的模型在物理合理性方面优于现有的领先模型。'}}}, {'id': 'https://huggingface.co/papers/2609.33711', 'title': 'DuoOPD: Learning from Joint Teacher-Student Outcomes for Multi-Task On-Policy Distillation', 'url': 'https://huggingface.co/papers/2609.33711', 'abstract': "Abstract  On-policy distillation (OPD) trains a student on its own responses with token-level feedback from a stronger teacher, yet the teacher can fail on questions the student already answers correctly, and how often each model succeeds varies across tasks. OPD ignores these outcomes and, on average, pushes down even the student's correct responses; gating feedback by student correctness fixes the direction but uses the teacher in the same way whether or not it succeeded. We introduce DuoOPD, in which the student's outcome sets the direction of feedback and the joint teacher-student outcome decides how the teacher supports it: when only the teacher succeeds, its verified answer becomes context for scoring the student's failed response, and when only the student succeeds, a weight shared within the task reinforces the whole response. A single rule covers all four outcome combinations without task-specific settings. Across Qwen3 and Llama, DuoOPD outperforms all five baselines in mean macro accuracy, improving over OPD by 2.58 and 5.98 percentage points, and it also leads on two further task mixtures spanning scientific calculation, instruction following, and code generation. Ablations show that outcome-based direction alone stays near the gated baseline, while the joint-outcome designs supply most of the gain.", 'score': 5, 'issue_id': 3359, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': 'b6c5a007ae52c1e9', 'authors': ['Ao Yu', 'Weibo Gao', 'Heng Zhou', 'Linan Yue', 'Rui Li', 'Suyi Liu', 'Yu Yan', 'Yizhong Zhang', 'Qi Liu'], 'affiliations': ['Southeast University', 'The Hong Kong Polytechnic University', 'The University of Hong Kong', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.33711.jpg', 'data': {'categories': ['#training', '#optimization', '#rlhf'], 'emoji': '🎓', 'ru': {'title': 'Умная дистилляция: пусть совместный результат учителя и студента направляет обучение', 'desc': 'В статье предложен метод DuoOPD для улучшения дистилляции моделей, где студент-модель учится на собственных ответах с обратной связью от более сильного учителя. Ключевая идея состоит в том, чтобы учитывать совместные результаты учителя и студента: когда только учитель правильно решает задачу, его ответ используется как контекст для исправления ошибок студента, а когда только студент прав, его ответ усиливается общим весом. Метод работает без необходимости настройки параметров для каждой задачи и показывает улучшение на 2.58-5.98 процентных пункта по сравнению с базовым методом OPD. Результаты демонстрируют эффективность на различных типах задач: научные вычисления, следование инструкциям и генерация кода.'}, 'en': {'title': 'DuoOPD: Smarter Feedback for Better Learning', 'desc': "The paper introduces DuoOPD, a novel approach to on-policy distillation that enhances the training of a student model using feedback from a teacher model. Unlike traditional methods that treat all feedback equally, DuoOPD tailors the feedback based on the outcomes of both the student and teacher, allowing for more effective learning. This method ensures that when the teacher succeeds, its answers provide context for the student's mistakes, while reinforcing the student's correct responses when they succeed. The results show that DuoOPD significantly improves accuracy across various tasks compared to existing methods, demonstrating its effectiveness in machine learning applications."}, 'zh': {'title': 'DuoOPD：智能反馈提升模型性能', 'desc': '本文提出了一种新的方法，称为DuoOPD，用于在机器学习中进行在线蒸馏（OPD）。DuoOPD通过学生模型的结果来指导反馈方向，并根据教师和学生的联合结果来决定教师的支持方式。与传统的OPD方法相比，DuoOPD在多个任务上表现更好，平均宏观准确率提高了2.58到5.98个百分点。实验结果表明，基于结果的反馈方向和联合结果设计是提升性能的关键。'}}}, {'id': 'https://huggingface.co/papers/2609.37569', 'title': 'Decompose Radicals, Then Reward: Fine-Grained Inspection for Accurate Chinese Text Rendering', 'url': 'https://huggingface.co/papers/2609.37569', 'abstract': 'Abstract  Rendering accurate Chinese text remains challenging for text-to-image models. Existing OCR-based reinforcement-learning rewards compare decoded transcripts with target strings. Such rewards overlook the compositional nature of Chinese writing: an ideograph consists of reusable components arranged through explicit spatial relations, yet OCR evaluates it as an atomic character. Consequently, visually different radical-level errors may receive equally coarse feedback, encouraging glyphs that merely resemble the target instead of faithfully reproducing its internal structure. We employ Ideographic Description Sequences (IDS), which comprise spatial operators and character components, and train an expert IDS recognizer to transcribe rendered Chinese text into this representation. Building on this recognizer, we introduce IDSpect, which deterministically decomposes the target text into IDS tokens and aligns crop-level visual IDS predictions with the target sequence. Globally unique token credit makes this comparison robust to the order of detected text regions. Combined with a whole-character semantic reward, IDSpect supplies fine-grained credit with component and spatial-relation without changing the image generator or adding inference-time cost. Experiments with GRPO post-training of Qwen-Image demonstrate that IDSpect achieves leading structural quality and semantic alignment on LongText and GenTextEval.', 'score': 5, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '309a63b2319609ed', 'authors': ['Yazhen Xie', 'Xingsong Ye', 'Zhineng Chen'], 'affiliations': ['Institute of Trustworthy Embodied AI, Fudan University', 'Shanghai Key Laboratory of Multimodal Embodied AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.37569.jpg', 'data': {'categories': ['#multilingual', '#training', '#cv', '#rlhf'], 'emoji': '🇨🇳', 'ru': {'title': 'Структурная точность китайского текста через разложение на компоненты', 'desc': 'Авторы решают проблему точного рендеринга китайского текста в text-to-image моделях, предложив новый метод оценки качества. Вместо сравнения распознанного текста с целевой строкой они используют Ideographic Description Sequences (IDS) — представление иероглифов через пространственные операторы и компоненты-радикалы. Они обучили специализированный IDS-распознаватель и разработали метод IDSpect, который обеспечивает детальную обратную связь на уровне компонентов и пространственных отношений при использовании reinforcement learning. Экспериментальные результаты показывают, что IDSpect улучшает структурное качество и семантическое соответствие китайского текста в моделях типа Qwen-Image.'}, 'en': {'title': 'Enhancing Chinese Text Rendering with Ideographic Description Sequences', 'desc': 'This paper addresses the challenges of accurately rendering Chinese text in text-to-image models. It critiques existing methods that use OCR-based reinforcement learning, which fail to consider the complex structure of Chinese characters. The authors propose a new approach using Ideographic Description Sequences (IDS) to better represent the components and spatial relationships of Chinese writing. Their method, IDSpect, enhances the training process by providing detailed feedback on character structure, leading to improved visual quality and semantic alignment in generated images.'}, 'zh': {'title': '提升中文文本渲染质量的创新方法', 'desc': '本文探讨了文本到图像模型在渲染中文文本时面临的挑战。现有的基于OCR的强化学习奖励机制未能充分考虑中文书写的组合特性。我们提出了表意描述序列（IDS），通过空间操作符和字符组件来表示中文文本，并训练了一个专家IDS识别器。基于此识别器，我们引入了IDSpect，它能够精确分解目标文本并提供细粒度的反馈，从而提高中文文本的结构质量和语义对齐。'}}}, {'id': 'https://huggingface.co/papers/2609.39661', 'title': 'The Evolution of Attention in Large Language Models: Mechanisms, Trade-offs, and Emerging Trends', 'url': 'https://huggingface.co/papers/2609.39661', 'abstract': 'Abstract  Self-attention gives LLMs fine-grained, query-dependent access to context, but dense token interactions incur quadratic prefill cost and a key--value cache growing with context length. Research thus spans explicit-memory compression, sparse access, recurrent state construction, structured state dynamics, and heterogeneous mechanism composition. This survey analyzes these developments as model-internal contextual memory. We introduce a five-dimensional lens---Memory Representation, Memory Update, Access, Readout, and Integration---describing what is represented, how it changes, what is query-eligible, how it is read, and how readouts form outputs. This lens compares overlapping research lines without imposing one computational model.   We reconstruct mechanism-level developments and architectural adoption using 59 release-level records from 14 major model lineages and 11 high-performing open-weight endpoints. First, explicit-memory and recurrent-state methods retain distinct interfaces but increasingly control overlapping memory functions. Second, heterogeneous architectures increasingly coordinate across network depth: layer-wise composition distributes complementary memory processing across representational stages, while cross-layer reuse carries selected memory and routing artifacts forward. Depth thus becomes a dimension along which contextual memory is constructed and managed. Third, these developments motivate a stateful multidimensional memory-routing hypothesis: persistent memory is organized across temporal scope, network depth, substrate type, and representation granularity, while coordinated Sparse Write and Sparse Read determine what is maintained and what contributes to each query. Overall, efficient sequence architecture design increasingly concerns the organization, lifecycle, and selective use of contextual memory rather than an isolated Attention operator.', 'score': 4, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '80e92adc0ed94881', 'authors': ['Zhentao Tan', 'Jingyi Shen', 'Yanbo Li', 'Yao Liu', 'Yue Wu', 'Jieping Ye'], 'affiliations': ['Alibaba Token Hub, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.39661.jpg', 'data': {'categories': ['#survey', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Контекстная память как ключевое измерение эффективных языковых моделей', 'desc': 'В статье анализируется, как современные большие языковые модели организуют контекстную память для эффективной обработки длинных последовательностей. Авторы предлагают систематизацию различных подходов к сжатию памяти, разреженному доступу и рекуррентным состояниям через пятимерную линзу, описывающую представление, обновление, доступ, считывание и интеграцию памяти. На основе анализа 59 версий релизов из 14 крупных семейств моделей выявлено, что эффективные архитектуры координируют память по глубине сети, используя разреженные операции записи и чтения для избирательного сохранения информации. Исследование показывает, что проектирование современных моделей всё больше сосредоточено на организации и управлении контекстной памятью как многомерной структуре, а не только на оптимизации механизма self-attention.'}, 'en': {'title': 'Revolutionizing Contextual Memory in Language Models', 'desc': 'This paper explores how self-attention mechanisms in large language models (LLMs) manage contextual memory, focusing on the challenges of dense token interactions and memory growth. It introduces a five-dimensional framework to analyze memory representation, updates, access, readout, and integration, allowing for a comprehensive comparison of various memory management techniques. The study highlights the evolution of memory functions across different model architectures, emphasizing the importance of coordinating memory processing at multiple network depths. Ultimately, it suggests that effective sequence architecture design should prioritize the organization and selective use of contextual memory rather than relying solely on attention mechanisms.'}, 'zh': {'title': '高效上下文记忆的组织与利用', 'desc': '自注意力机制为大型语言模型（LLMs）提供了细粒度的、依赖查询的上下文访问，但密集的标记交互导致了二次预填充成本和随着上下文长度增长的键值缓存。因此，研究涵盖了显式内存压缩、稀疏访问、递归状态构建、结构化状态动态和异构机制组合等方面。本文分析了这些发展作为模型内部的上下文记忆，并引入了一个五维视角——记忆表示、记忆更新、访问、读取和整合，描述了表示的内容、如何变化、哪些是查询合格的、如何读取以及读取如何形成输出。总体而言，高效的序列架构设计越来越关注上下文记忆的组织、生命周期和选择性使用，而不是孤立的注意力操作。'}}}, {'id': 'https://huggingface.co/papers/2609.40285', 'title': 'PivotOPD: Learning to Recover from Pivotal Mistakes in Multi-Turn Agents', 'url': 'https://huggingface.co/papers/2609.40285', 'abstract': 'Abstract  On-policy distillation (OPD) is a promising approach for training language agents, providing dense teacher supervision on student-generated trajectories. However, in multi-turn interaction, an incorrect action changes the states the student encounters later, so errors compound across turns. In preliminary experiments across three Qwen3 models (8B to 235B), we find that more than half of the failed rollouts contain a pivotal mistake, an action that moves the agent farther from completing the task, and this mistake typically occurs early. These pivotal mistakes often remain recoverable: guiding the model for only a few turns after the pivotal turn can restore task success. We therefore propose PivotOPD, an on-policy distillation framework that jointly trains the student to prevent pivotal mistakes and to recover from the states they create. At each pivotal mistake, a teacher model provides a gold action and then names a recovery action at each of the next few turns. Preventive distillation uses the gold action with reverse KL to steer the student away from the pivotal mistake, while recovery distillation uses the recovery actions with forward KL to transfer recovery behaviors that the student rarely samples. Against 13 baselines on ALFWorld, WebShop, and Search-based QA, PivotOPD achieves the strongest average performance for both Qwen3-1.7B and Qwen3-8B students, improving over the strongest baseline on ALFWorld by +5.5% with the 1.7B student. The gains also transfer to another model family on the software engineering domain, where PivotOPD raises the resolve rate of a Nemotron-3.5 student on SWE-Bench Verified by +3.2%. Project page: https://research.nvidia.com/labs/lpr/pivotopd/', 'score': 4, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '2d1b581ba6e58988', 'authors': ['Yinghui He', 'Yapei Chang', 'Khushi Bhardwaj', 'Daniele Molinari', 'Tugrul Konuk', 'Jan Kautz', 'Ali Hatamizadeh'], 'affiliations': ['NVIDIA', 'Princeton University', 'University of Maryland'], 'pdf_title_img': 'assets/pdf/title_img/2609.40285.jpg', 'data': {'categories': ['#optimization', '#transfer_learning', '#training', '#agents', '#rlhf', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Предотвращение и восстановление от критических ошибок в дистилляции агентов', 'desc': 'В работе предлагается PivotOPD — фреймворк для обучения языковых агентов на основе дистилляции онлайн, который фокусируется на критических ошибках в многошаговых взаимодействиях. Авторы обнаружили, что более половины неудачных попыток содержат «поворотную ошибку» — действие, которое отдаляет агента от цели и обычно происходит в начале траектории. Метод использует двойную дистилляцию: профилактическую дистилляцию для предотвращения критических ошибок через обратную дивергенцию Кульбака-Лейблера и восстановительную дистилляцию для обучения восстановлению из плохих состояний через прямую дивергенцию. Результаты показывают значительные улучшения на бенчмарках ALFWorld, WebShop и Software Engineering, с приростом производительности до +5.5% для меньших моделей-студентов.'}, 'en': {'title': 'Preventing and Recovering from Pivotal Mistakes in Language Agent Training', 'desc': 'The paper introduces PivotOPD, an on-policy distillation framework designed to enhance the training of language agents by addressing pivotal mistakes during multi-turn interactions. These pivotal mistakes, which often occur early in the process, can lead to compounded errors that hinder task completion. PivotOPD employs a dual approach: it uses preventive distillation to guide the student model away from making pivotal mistakes and recovery distillation to help the model recover from mistakes when they occur. Experimental results show that PivotOPD significantly improves performance across various models and tasks, demonstrating its effectiveness in training more robust language agents.'}, 'zh': {'title': '减少关键错误，提升语言代理的表现', 'desc': '本文提出了一种新的在线策略蒸馏方法，称为PivotOPD，旨在训练语言代理以减少关键错误的发生。关键错误会在多轮交互中导致后续状态的错误，从而影响任务的完成。PivotOPD通过教师模型提供黄金动作和恢复动作，帮助学生模型避免这些关键错误并从错误状态中恢复。实验结果表明，PivotOPD在多个基准测试中表现优异，显著提高了模型的任务成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.39564', 'title': 'A2Z GameSpec-Bench: How Faithfully Can Coding Agents Generate Games from Game Design Specifications?', 'url': 'https://huggingface.co/papers/2609.39564', 'abstract': 'Abstract  Delegating complete application development to coding agents requires preserving the intended design rather than simply producing plausible outputs through naive prompting. Game development provides a demanding testbed, as long-form Game Design Documents (GDDs) describe requirements that must work together across game logic, visual rendering, and player interactions. However, existing game-development benchmarks typically use compact specifications and provide limited support for evaluating interdependent requirements across these aspects in long-form GDDs. We introduce A2Z GameSpec-Bench, a benchmark of 100 long-form GDDs for evaluating end-to-end game development by agents. We measure faithfulness by checking whether the game satisfies the GDD requirements and preserves the relationships among them. Each GDD is turned into a dependency-aware contract that contains rules, constraints, and prerequisite relations. Following game-development practices, we combine source-code inspection with agent-generated test policies for scenario-based replay and adaptive playtesting. The contract remains fixed across agents and revision rounds, while judgments and evidence linked to the same requirements support consistent comparison and failure detection. Our evaluations show that current agents struggle to jointly satisfy interdependent requirements across code implementation and actual play. Requirement-specific feedback improves GDD Fidelity by 10.9% relative to self-revision after two rounds. A2Z GameSpec-Bench assesses end-to-end specification-following ability beyond implementation judgments and provides targeted feedback to support more faithful game development. Code and datasets are available at https://a2z-gamespec-bench.github.io.', 'score': 4, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '9cf45d32301686a3', 'authors': ['Seonho Lee', 'Wonryeol Jeong', 'Alberto Cereser', 'Inha Kang', 'Hyeonjong Kim', 'Seungmin Kwak', 'Dongmin Park'], 'affiliations': ['KAIST', 'KRAFTON', 'Korea National University of Arts'], 'pdf_title_img': 'assets/pdf/title_img/2609.39564.jpg', 'data': {'categories': ['#open_source', '#games', '#dataset', '#benchmark', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Верность спецификации в разработке игр: от документов требований к проверке кода и геймплея', 'desc': 'Статья представляет бенчмарк A2Z GameSpec-Bench для оценки способности кодирующих агентов разрабатывать игры в соответствии с полноценными документами проектирования игр (GDD). Авторы предлагают метод проверки верности, основанный на зависимостях между требованиями, сформулированными как контракты с правилами и ограничениями. Для оценки используется комбинация анализа исходного кода и адаптивного тестирования, генерируемого агентом, что позволяет обнаруживать несоответствия в реализации. Результаты показывают, что современные LLM-агенты испытывают трудности с одновременным соблюдением взаимозависимых требований, однако специализированная обратная связь улучшает качество разработки на 10.9%.'}, 'en': {'title': 'Enhancing Game Development Fidelity with A2Z GameSpec-Bench', 'desc': 'This paper presents A2Z GameSpec-Bench, a new benchmark designed to evaluate the ability of coding agents to develop games according to detailed Game Design Documents (GDDs). It emphasizes the importance of maintaining the relationships among various game requirements, such as game logic and player interactions, rather than just producing plausible outputs. The benchmark consists of 100 long-form GDDs and uses dependency-aware contracts to ensure that agents adhere to the specified rules and constraints. The findings indicate that current agents have difficulty meeting interdependent requirements, but targeted feedback can significantly improve their performance in following GDDs.'}, 'zh': {'title': '提升游戏开发代理的设计忠实度', 'desc': '本论文提出了A2Z GameSpec-Bench，这是一个用于评估游戏开发代理的基准，包含100个长格式的游戏设计文档（GDD）。该基准旨在确保代理在开发过程中能够遵循设计要求，并保持各个要求之间的关系。通过将每个GDD转化为依赖关系意识的合同，论文结合源代码检查和代理生成的测试策略，进行场景重放和自适应游戏测试。研究表明，当前的代理在满足代码实现和实际游戏之间的相互依赖要求方面存在困难，而针对特定要求的反馈可以显著提高GDD的忠实度。'}}}, {'id': 'https://huggingface.co/papers/2609.40137', 'title': 'Game-Guided Skill Discovery through Self-Play for Playable Agent Control', 'url': 'https://huggingface.co/papers/2609.40137', 'abstract': 'Abstract  We present Game-Guided Skill Discovery (GGSD), a framework that uses self-play in games to discover motor skills that are directly playable by humans. Playable skills provide a compact abstraction for controlling embodied agents through a small set of learned behaviors rather than low-level actions. To be effective, these skills should be semantically distinct, interpretable, and expressive; properties that existing unsupervised skill-discovery methods often fail to achieve simultaneously. GGSD achieves these desiderata by grounding skill discovery in competitive gameplay. A hierarchical agent competes against its past selves, with a high-level policy selecting from a small discrete skill set and a skill-conditioned low-level policy learning the corresponding behaviors. After training, a human can replace the high-level policy and directly control the agent through the same discrete skills. Despite the small number of high-level actions, skill transitions give rise to emergent combo behaviors, expanding expressivity beyond individual primitives. Across Ant, Franka-arm, and Unitree G1 environments, we show that GGSD produces human-playable skills that humans can compose to solve unseen tasks, such as Maze and CubePush, without additional training. An interactive demo is available at https://ggsd-demo.github.io.', 'score': 3, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'a83c456dbf43ff55', 'authors': ['Seungeun Rho', 'Jeonghwan Kim', 'Xue Bin Peng', 'Sehoon Ha'], 'affiliations': ['Georgia Institute of Technology', 'NVIDIA', 'Simon Fraser University'], 'pdf_title_img': 'assets/pdf/title_img/2609.40137.jpg', 'data': {'categories': ['#robotics', '#games', '#training', '#interpretability', '#rl'], 'emoji': '🎮', 'ru': {'title': 'Игровая самоигра как путь к управляемым и интерпретируемым навыкам робота', 'desc': 'Авторы представляют GGSD — фреймворк для обнаружения двигательных навыков через самоигру агентов в конкурентных играх. Иерархический агент использует высокоуровневую политику для выбора из небольшого набора дискретных навыков и низкоуровневую политику для обучения соответствующим поведениям. Открытые навыки семантически различны, интерпретируемы и достаточно выразительны, чтобы человек мог управлять агентом напрямую и комбинировать навыки для решения новых задач. На примере роботов Ant, Franka-arm и Unitree G1 показано, что люди могут использовать обученные навыки для решения незнакомых задач без дополнительной тренировки.'}, 'en': {'title': 'Discovering Playable Skills Through Competitive Self-Play', 'desc': 'Game-Guided Skill Discovery (GGSD) is a framework that leverages self-play in gaming to identify motor skills that humans can directly use. It focuses on creating a compact set of learned behaviors that allow for effective control of embodied agents, rather than relying on low-level actions. GGSD ensures that the discovered skills are distinct, interpretable, and expressive by grounding the skill discovery process in competitive gameplay. The framework allows a human to control the agent using a small set of high-level skills, which can combine to create complex behaviors for solving new tasks without needing further training.'}, 'zh': {'title': '游戏引导技能发现：让机器学习更具可玩性', 'desc': '我们提出了一种名为游戏引导技能发现（GGSD）的框架，通过自我对弈的方式来发现可供人类直接使用的运动技能。这些可玩技能为控制具身代理提供了一种紧凑的抽象，允许通过一小组学习到的行为来替代低级动作。为了有效，这些技能需要在语义上具有明显的区别、可解释性和表现力，而现有的无监督技能发现方法往往无法同时满足这些要求。GGSD通过在竞争游戏中进行技能发现来实现这些目标，使得人类可以直接通过相同的离散技能控制代理，解决未见过的任务。'}}}, {'id': 'https://huggingface.co/papers/2609.38121', 'title': 'WUSH-KV: KV Cache Quantization with Data-Adaptive Transforms', 'url': 'https://huggingface.co/papers/2609.38121', 'abstract': 'Abstract  KV cache memory and bandwidth costs grow with context length and batch size, which limits efficient long-context inference. To address this bottleneck, we introduce WUSH-KV for low-bit KV-cache quantization. It adapts WUSH, which constructs a data-aware transform from the second-order statistics of both factors in a matrix product to reduce quantization error. WUSH-KV uses calibration data to construct separate key and value transforms, with the value transform folded into the model weights and the key transform applied after RoPE. The transforms can be paired with clipped quantizers. For one such quantizer, QuEST INT, we show that, under mild assumptions, the WUSH transform is near-optimal. With this quantizer, WUSH-KV reduces layerwise reconstruction error and achieves the lowest end-to-end perplexity among other tested transforms. For end-to-end evaluation, we integrate WUSH-KV into SGLang using OSCAR-style percentile-clipped affine quantization. At 2-bit, WUSH-KV performs comparably to or outperforms the OSCAR transform across all evaluated models and downstream tasks.', 'score': 3, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'f3e97e3a24511761', 'authors': ['Jiale Chen', 'Vage Egiazarian', 'Eldar Kurtić', 'Torsten Hoefler', 'Dan Alistarh'], 'affiliations': ['ETH Zürich', 'Institute of Science and Technology Austria (ISTA)', 'Red Hat AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.38121.jpg', 'data': {'categories': ['#optimization', '#long_context'], 'emoji': '⚡', 'ru': {'title': 'Оптимальная квантизация KV-кэша для эффективного длинного контекста', 'desc': 'В статье предлагается метод WUSH-KV для квантизации KV-кэша с низкой битностью, который решает проблему растущих затрат памяти и пропускной способности при увеличении длины контекста. Метод адаптирует подход WUSH, конструируя преобразование, учитывающее статистику второго порядка факторов матричного произведения, чтобы минимизировать ошибку квантизации. Отдельные преобразования применяются к ключам и значениям: преобразование значений встраивается в веса модели, а преобразование ключей применяется после RoPE. При 2-битной квантизации WUSH-KV достигает лучшей перплексии и сравнимой или превосходящей производительности по сравнению с существующими методами на всех протестированных моделях.'}, 'en': {'title': 'Optimizing KV Cache for Efficient Long-Context Inference', 'desc': 'This paper presents WUSH-KV, a method designed to optimize key-value (KV) cache memory usage in machine learning models, particularly for long-context inference. It introduces a low-bit quantization technique that minimizes quantization error by using data-aware transforms based on second-order statistics. The method involves separate transforms for keys and values, with the value transform integrated into model weights, enhancing efficiency. Experimental results show that WUSH-KV significantly reduces reconstruction error and achieves superior performance in perplexity compared to existing methods, especially when integrated with specific quantization techniques.'}, 'zh': {'title': 'WUSH-KV：高效的低比特KV缓存量化', 'desc': '本文提出了一种名为WUSH-KV的低比特KV缓存量化方法，以解决上下文长度和批量大小增加时的内存和带宽成本问题。WUSH-KV通过构建基于矩阵乘积的二阶统计量的数据感知变换，来减少量化误差。该方法使用校准数据构建独立的键和值变换，并将值变换折叠到模型权重中。实验结果表明，WUSH-KV在2比特量化下的性能与现有方法相当或更优，显著降低了重构误差。'}}}, {'id': 'https://huggingface.co/papers/2609.32600', 'title': 'CUA-SWE: When Computer-Use Agents Meet Visual Software Engineering', 'url': 'https://huggingface.co/papers/2609.32600', 'abstract': "Abstract  Software development requires more than editing code: developers repeatedly run software, interact with its interfaces, visually inspect its behavior, and use these observations to decide what to change next and whether a change works. Existing coding agents and computer-use agents are largely studied in isolation, leaving this integrated development process underexplored. Diagnosing a runtime interaction failure requires agents to connect visual observations with the responsible code, then use the application again to verify the repair. We introduce CUA-SWE, a benchmark, environment, and evaluation pipeline for software engineering with computer use. Beyond studying how GUI feedback supports diagnosis and repair, we ask whether agents can complete software engineering tasks when required specification or operational information is available only through the running application's visual interface. CUA-SWE spans four software engineering domains and requires agents to modify code and configuration, execute commands, interact with running software, and inspect visual feedback within the same task. Each task includes deterministic, task-specific tests that verify whether the resulting software satisfies the requirements and preserves specified behavior. Our evaluation characterizes how frontier agents combine source-level execution with application screenshots and graphical interaction to produce verified software changes. We examine performance across domains and task information requirements, alongside the development behaviors associated with successful repairs. CUA-SWE provides a unified testbed for studying how agents use visual feedback and interaction to guide software engineering, with executable correctness criteria for the resulting software.", 'score': 2, 'issue_id': 3359, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'b3b8a28b1a9ebb64', 'authors': ['Prince Zizhuang Wang', 'Chenhao Liang', 'Zelong Xu', 'Aojie Yuan', 'Xiaolin Zhou', 'Haiyue Zhang', 'Yue Zhao', 'Xiyang Hu', 'Shuli Jiang'], 'affiliations': ['AWS', 'Arizona State University', 'Carnegie Mellon University', 'University of Southern California', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.32600.jpg', 'data': {'categories': ['#benchmark', '#plp', '#cv', '#agents'], 'emoji': '🔧', 'ru': {'title': 'Агенты, которые видят: разработка ПО через визуальную обратную связь', 'desc': 'Статья представляет CUA-SWE — бенчмарк и окружение для изучения агентов, которые разрабатывают программное обеспечение, используя графический интерфейс и визуальную обратную связь. Авторы исследуют, как AI-агенты могут диагностировать ошибки во время выполнения, анализируя скриншоты приложения и исходный код, а затем проверять исправления через повторное взаимодействие с программой. Бенчмарк охватывает различные домены разработки и требует от агентов выполнения комплексных задач: изменение кода, выполнение команд, взаимодействие с запущенным приложением и анализ визуального вывода. Работа показывает, как современные LLM-модели интегрируют анализ исходного кода с обработкой визуальной информации для создания проверяемых изменений программного обеспечения.'}, 'en': {'title': 'Integrating Visual Feedback for Smarter Software Engineering Agents', 'desc': 'This paper introduces CUA-SWE, a new benchmark and evaluation framework designed to study how agents can assist in software engineering tasks by integrating visual feedback from graphical user interfaces (GUIs) with code modification. It emphasizes the importance of diagnosing runtime failures by connecting visual observations to the underlying code and verifying repairs through interaction with the application. The framework spans multiple software engineering domains, requiring agents to perform tasks that involve modifying code, executing commands, and inspecting visual feedback. The evaluation focuses on how well agents can leverage GUI information to produce verified software changes, providing insights into their performance and development behaviors during repairs.'}, 'zh': {'title': '集成开发过程中的智能代理研究', 'desc': '软件开发不仅仅是编辑代码，开发者需要反复运行软件，交互其界面，视觉检查其行为，并根据这些观察决定下一步的修改。现有的编码代理和计算机使用代理大多是孤立研究，未能深入探讨这一综合开发过程。我们提出了CUA-SWE，一个用于软件工程的基准、环境和评估管道，旨在研究GUI反馈如何支持故障诊断和修复。CUA-SWE涵盖四个软件工程领域，要求代理在同一任务中修改代码、执行命令、与运行中的软件交互，并检查视觉反馈。'}}}, {'id': 'https://huggingface.co/papers/2609.38142', 'title': 'AdviSD: Learning to Advise Frontier LLMs via Targeted Multi-Turn Self-Distillation', 'url': 'https://huggingface.co/papers/2609.38142', 'abstract': "Abstract  A small trainable advisor can steer a frozen language-model executor using natural-language advice. In addition to learning from task rewards, the advisor can use feedback from completed interactions to improve its advice. However, a plausible correction need not change execution, yet learning from such corrections can still affect the advisor's future decisions in other contexts. In a shared-parameter model, we prove that such corrections can limit learning if their targets favor useful advice less strongly than those of other corrections. Keeping them less often than the rest improves the model's eventual performance compared to learning from every correction. Motivated by this, our method, Advisor Self-Distillation (AdviSD), pairs outcome-based reinforcement learning with self-distillation from a feedback-conditioned copy of the advisor selectively. Reflection proposes corrections, and the advisor scores the same recorded executor response with and without its issued advice, using the magnitude of the difference to select decisions for supervision. This approach does not require executor likelihoods or additional executor rollouts. Experiments with Qwen3-8B advisors for Gemini and Claude show that AdviSD outperforms advisor-GRPO by 4.2-6.4 percentage points on BFCL-v3 and by 3.9-5.1 score points on EnvScaler. The trained advisors generalize to out-of-domain tasks and transfer across different executor versions and model families. AdviSD also beats matched-count random selection, supporting the value of its selection rule.", 'score': 2, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'd9d1492678438301', 'authors': ['Rishabh Agrawal', 'Hejie Cui', 'Shasha Li', 'Shanchan Wu', 'Sercan Ö. Arık'], 'affiliations': ['Google', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2609.38142.jpg', 'data': {'categories': ['#training', '#small_models', '#rlhf'], 'emoji': '🎯', 'ru': {'title': 'Советник учится выбирать, когда его слушать: дистилляция через отражение', 'desc': 'В работе предлагается метод обучения компактного советника, который управляет замороженной языковой моделью через естественноязычные рекомендации. Советник обучается как на основе награды за задачу, так и на основе обратной связи от выполненных взаимодействий, однако не все корректировки одинаково полезны для обучения. Авторы теоретически показывают, что селективное использование корректировок может улучшить производительность модели, и предлагают метод Advisor Self-Distillation (AdviSD), который комбинирует обучение с подкреплением с дистилляцией от условной копии советника. Экспериментальные результаты демонстрируют превосходство AdviSD над базовыми подходами на нескольких бенчмарках с обобщением на задачи вне области обучения.'}, 'en': {'title': 'Enhancing Language Models with Selective Advisor Learning', 'desc': "This paper introduces a method called Advisor Self-Distillation (AdviSD) that enhances the performance of language models by using a small trainable advisor. The advisor provides natural-language advice to a frozen language-model executor and learns from both task rewards and feedback from past interactions. The study shows that selectively learning from corrections can improve the advisor's decision-making, as not all corrections are equally beneficial. Experiments demonstrate that AdviSD significantly outperforms existing methods and allows for better generalization across different tasks and model versions."}, 'zh': {'title': '智能顾问：提升语言模型的决策能力', 'desc': '这篇论文介绍了一种小型可训练的顾问模型，它可以通过自然语言建议来指导一个固定的语言模型执行器。顾问不仅可以从任务奖励中学习，还可以利用完成交互后的反馈来改进建议。研究表明，某些修正虽然不改变执行结果，但学习这些修正仍然会影响顾问在其他上下文中的决策。提出的Advisor Self-Distillation（AdviSD）方法结合了基于结果的强化学习和自我蒸馏，显著提高了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.40048', 'title': 'CoEvoWhen: Policy-Tool Coevolution for Ultra-Long Video Temporal Grounding', 'url': 'https://huggingface.co/papers/2609.40048', 'abstract': 'Abstract  Ultra-long video temporal grounding requires balancing long-range evidence search with fine-grained event understanding under a limited visual budget, yet existing agentic methods still rely largely on predefined policies and tool capabilities. Motivated by this, we propose a novel policy-tool coevolution framework that jointly evolves high-level policies and executable media tools from the agentic reasoning trajectories of a VLM, forming a reusable skill without updating model parameters. During evolution, an external skill updater distills transferable task experience in long-video temporal grounding, accordingly refining the orchestration of long-range image-based and fine-grained video-based observations. Alongside these policy updates, the updater employs its coding capabilities to upgrade existing tools or create new ones, adapting the tools to long-video evidence acquisition. Equipped with the evolved skill, the VLM autonomously orchestrates tools under the guidance of the evolved policy, coordinating image and video observations for agentic inference without relying on a separate, stronger planning model. Extensive experiments spanning five benchmarks and three VLMs show that policy-tool coevolution consistently improves temporal grounding accuracy in ultra-long videos while reducing visual token cost at inference, and that the evolved skill yields substantial performance gains on general long-video QA without additional task-specific evolution, demonstrating the effectiveness and generalizability of our framework for long-video understanding.', 'score': 2, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '15765d053b4b08ca', 'authors': ['Yiduo Jia', 'Muzhi Zhu', 'Jinchuan Shi', 'Hao Zhong', 'Yuling Xi', 'Ke Liu', 'Hao Chen'], 'affiliations': ['Zhejiang University, State Key Lab of CAD & CG'], 'pdf_title_img': 'assets/pdf/title_img/2609.40048.jpg', 'data': {'categories': ['#transfer_learning', '#multimodal', '#video', '#benchmark', '#agents', '#long_context', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Совместная эволюция политик и инструментов для понимания ультрадлинных видео', 'desc': 'Статья предлагает новый подход к пониманию очень длинных видео, где нужно найти конкретный момент (temporal grounding) при ограниченном бюджете обработки визуальной информации. Авторы разработали фреймворк совместной эволюции политик и инструментов (policy-tool coevolution), который автоматически улучшает стратегии рассуждения и возможности обработки видео на основе опыта работы vision-language модели. Во время эволюции система учится балансировать между поиском длинного контекста с помощью изображений и детальным анализом видеофрагментов, при этом кодируя новые инструменты для обработки видео. Экспериментальные результаты на пяти бенчмарках показывают, что полученные навыки повышают точность локализации событий в ультрадлинных видео и одновременно снижают вычислительные затраты.'}, 'en': {'title': 'Evolving Skills for Better Long-Video Understanding', 'desc': "This paper introduces a new framework for improving the understanding of ultra-long videos by evolving both high-level policies and media tools simultaneously. The approach allows a Vision-Language Model (VLM) to autonomously manage tools for gathering evidence from long videos while maintaining a focus on detailed event comprehension. By refining the coordination between image and video observations, the framework enhances the model's ability to perform temporal grounding tasks without needing a separate planning model. The results show significant improvements in accuracy and efficiency across multiple benchmarks, highlighting the framework's effectiveness in long-video understanding."}, 'zh': {'title': '策略与工具的共同进化提升超长视频理解', 'desc': '本论文提出了一种新颖的策略-工具共同进化框架，旨在解决超长视频的时间定位问题。该框架通过从视觉语言模型（VLM）的推理轨迹中共同进化高层策略和可执行的媒体工具，形成可重用的技能，而无需更新模型参数。在进化过程中，外部技能更新器提炼可转移的任务经验，优化长视频时间定位中的图像和视频观察的协调。实验结果表明，该框架在多个基准测试中显著提高了超长视频的时间定位准确性，同时降低了推理时的视觉代价。'}}}, {'id': 'https://huggingface.co/papers/2609.29142', 'title': 'Not Every Token Is Worth Distilling: Selective Supervision for Direct-OPD', 'url': 'https://huggingface.co/papers/2609.29142', 'abstract': "Abstract  Direct On-Policy Distillation (Direct-OPD) transfers reinforcement-learning-induced policy improvements from a small model to a larger student by using the token-level log-ratio between post-RL and pre-RL checkpoints as dense supervision on the student's own rollouts. This transfer rewards the policy shift at every state, yet the log-ratio measures only relative change: it can stay fixed even as the probability mass that both checkpoints assign to the student's candidate tokens vanishes. Through an exact construction, we show that the Direct-OPD reward and its update can remain unchanged while the Jensen-Shannon divergence (JSD) and both KL directions between the checkpoints vanish with this mass, and we note that a small JSD bounds how much the teacher's behavior changed. Motivated by this analysis, we propose Selective Supervision for Direct-OPD (S^2D-OPD), which ranks student-sampled states by their teacher-reference JSD and masks Direct-OPD supervision at low-divergence states, retaining only the top 10% of states per response. Across two teacher pairs and four student models ranging from 1.7B to 8B parameters, S^2D-OPD improves held-out accuracy over dense Direct-OPD on AIME and HMMT benchmarks in seven of eight settings and matches it in the eighth, without extra forward passes.", 'score': 2, 'issue_id': 3359, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'db9e00eb84a389fa', 'authors': ['Yibo Zhao', 'Zixuan Yang', 'Yunshi Lan', 'Xiang Li'], 'affiliations': ['Hugging Face', 'School of Data Science and Engineering, East China Normal University'], 'pdf_title_img': 'assets/pdf/title_img/2609.29142.jpg', 'data': {'categories': ['#optimization', '#transfer_learning', '#small_models', '#training', '#alignment', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Избирательный контроль для более эффективной дистилляции политик', 'desc': 'В работе предлагается метод Direct-OPD для передачи улучшений политики от маленькой модели к большой студент-модели, используя логарифм отношения вероятностей между версиями модели до и после обучения с подкреплением как плотную функцию вознаграждения. Авторы выявили проблему: логарифм отношения может оставаться неизменным, даже когда вероятность токенов обеих моделей стремится к нулю, что делает сигнал недостаточно информативным. Они показали, что в таких случаях дивергенция Йенсена-Шеннона между контрольными точками модели может обнулиться, хотя супервизионный сигнал остаётся. Для решения этой проблемы предложен метод S²D-OPD, который селективно выбирает только состояния с высокой дивергенцией (топ-10%) для супервизии, что улучшает качество на бенчмарках AIME и HMMT без дополнительных вычислений.'}, 'en': {'title': 'Enhancing Policy Learning with Selective Supervision', 'desc': 'This paper introduces Direct On-Policy Distillation (Direct-OPD), a method that enhances the learning of a larger model by transferring knowledge from a smaller model using log-ratios of policy probabilities. The authors identify a limitation in Direct-OPD where the log-ratio can remain constant even when the underlying probabilities change significantly. To address this, they propose Selective Supervision for Direct-OPD (S^2D-OPD), which selectively focuses on states with higher divergence to improve learning efficiency. Experimental results show that S^2D-OPD outperforms traditional Direct-OPD in accuracy across various model sizes and benchmarks without requiring additional computational resources.'}, 'zh': {'title': '选择性监督提升策略蒸馏效果', 'desc': '直接在线策略蒸馏（Direct-OPD）通过使用强化学习后和前检查点之间的标记级对数比，向较大的学生模型转移策略改进。这种转移在每个状态上奖励策略的变化，但对数比仅测量相对变化，可能在概率质量消失时保持不变。我们提出选择性监督的直接在线策略蒸馏（S^2D-OPD），通过教师参考的Jensen-Shannon散度（JSD）对学生采样的状态进行排名，并在低散度状态下屏蔽Direct-OPD监督，仅保留每个响应的前10%状态。实验结果表明，S^2D-OPD在多个基准测试中优于密集的Direct-OPD，且无需额外的前向传递。'}}}, {'id': 'https://huggingface.co/papers/2609.38854', 'title': 'Mitigating the Length-Scaling Tax with Online Distillation', 'url': 'https://huggingface.co/papers/2609.38854', 'abstract': 'Abstract  Length scaling during reinforcement-learning (RL) post-training is often viewed as a sign of improved reasoning ability, especially on difficult problems, but may also make responses to already-solved problems unnecessarily verbose. We quantify this side effect as the length-scaling tax (LST): excess response length on already-solved queries without a commensurate accuracy gain. To mitigate LST, we propose Length Self-Distillation (LSD), which routes solved prompts to on-policy distillation and retains the original RL objective for unsolved prompts. LSD uses an exponential moving average of the online policy as its teacher, requiring no external model. We find that LSD achieves comparable or better performance than RL across multiple variants, while substantially curbing response-length growth on easy queries. LSD reduces LST from 19.0% to -3.7% on single-turn reasoning and from 31.4% to 13.7% on multi-turn agentic tasks, demonstrating that LSD effectively preserves concise response patterns on easy queries while supporting efficient exploration on difficult queries during RL post-training.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'e5995b1e498c89c0', 'authors': ['Xu Wan', 'Wenyue Xu', 'Shengjie Zhao', 'Mingyang Sun'], 'affiliations': ['ByteDance', 'Peking University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38854.jpg', 'data': {'categories': ['#training', '#optimization', '#rl', '#reasoning'], 'emoji': '📏', 'ru': {'title': 'Краткость без потерь: самодистилляция для контроля длины ответов при обучении с подкреплением', 'desc': 'В статье исследуется проблема увеличения длины ответов моделей при обучении с подкреплением, особенно на уже решённых задачах, что авторы называют налогом на масштабирование длины. Предложен метод Length Self-Distillation, который перенаправляет решённые запросы на дистилляцию с использованием текущей политики, а для нерешённых задач сохраняет исходную цель обучения с подкреплением. Метод использует экспоненциальное скользящее среднее онлайн-политики как учителя, не требуя внешней модели. Экспериментальные результаты показывают, что LSD снижает избыточную длину ответов на простых задачах с 19.0% до -3.7% в однооборотных тестах и с 31.4% до 13.7% в многооборотных агентных задачах.'}, 'en': {'title': 'Streamlining Responses in Reinforcement Learning with Length Self-Distillation', 'desc': 'This paper addresses the issue of length scaling in reinforcement learning (RL) post-training, which can lead to unnecessarily long responses for problems that have already been solved. The authors introduce a concept called Length Self-Distillation (LSD) to reduce this effect, termed the length-scaling tax (LST). LSD utilizes on-policy distillation for solved prompts while maintaining the original RL objective for unsolved ones, using an exponential moving average of the online policy as a teacher. The results show that LSD not only improves performance but also significantly reduces response length growth on easier queries, effectively balancing concise responses with exploration of more challenging tasks.'}, 'zh': {'title': '长度自蒸馏：提升推理能力的有效方法', 'desc': '在强化学习（RL）后期训练中，长度缩放常被视为推理能力提高的标志，但也可能导致对已解决问题的回答过于冗长。我们将这种副作用量化为长度缩放税（LST），即在已解决查询上响应长度的过度增长，而没有相应的准确性提升。为了解决LST问题，我们提出了长度自蒸馏（LSD）方法，该方法将已解决的提示路由到在线蒸馏，同时对未解决的提示保留原始的RL目标。实验结果表明，LSD在多个变体中表现出与RL相当或更好的性能，同时显著抑制了对简单查询的响应长度增长。'}}}, {'id': 'https://huggingface.co/papers/2609.40295', 'title': 'How Much Is an AI Token Worth? Scaling Laws for Wild AI-Generated Web Text', 'url': 'https://huggingface.co/papers/2609.40295', 'abstract': 'Abstract  Web text makes up the majority of pretraining data and is increasingly AI-generated. After applying FineWeb quality filtering, we find that 27.5% of tokens from June 2026 web data are labeled as AI-generated by Pangram, rising to 31.1% by August. Unlike synthetic data or model-collapse setups, this *wild* AI text comes from many models, is written for human readers, and arrives unlabeled in pretraining corpora. How does AI text in the wild affect language model pretraining? To answer this question, we pretrain 800 language models, varying the ratio of added AI tokens to human tokens, and fit scaling laws to held-out losses on both human and AI-generated text. For data-starved models, adding AI tokens to pretraining data initially lowers loss on human text, but the benefit saturates as more are added and quickly *reverses* into harm. For models trained on high budgets of human text, AI tokens raise loss almost immediately, while the same number of fresh human tokens keeps lowering it. Scaling laws such as Hoffman et al. (2022) fail to predict this behavior. We propose a new scaling law with separate benefit and harm terms that allows the value of an AI token to change sign while also reducing to Chinchilla in the absence of AI text. When fit on smaller models, our scaling law predicts the effect of AI text on held-out human-text loss for models up to 3.6x larger with 41% lower error than the best existing law over all AI ratios. We recommend filtering AI text when the target is human text, repeating human text before expanding the training dataset with AI-generated web text, and reporting validation loss on human and AI text separately AI text remains valuable when the target is AI text. We release WildAI, an 83B-token corpus with AI, topic, and format labels, all 800 models and code at https://github.com/pangramlabs/WildAI.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '1e8d102d2b1d2adc', 'authors': ['Jenna Russell', 'Ben Glickenhaus', 'Katherine Thai', 'John Wieting', 'Mohit Iyyer', 'Max Spero', 'Bradley Emi'], 'affiliations': ['Pangram Labs', 'University of Maryland'], 'pdf_title_img': 'assets/pdf/title_img/2609.40295.jpg', 'data': {'categories': ['#optimization', '#open_source', '#synthetic', '#dataset', '#training', '#benchmark', '#data'], 'emoji': '⚠️', 'ru': {'title': 'AI-текст в веб-данных разрушает обучение языковых моделей', 'desc': 'Исследование показывает, что около 27-31% токенов в веб-данных 2026 года являются AI-генерированными текстами. Авторы предварительно обучили 800 языковых моделей с разными соотношениями AI и человеческих токенов, чтобы понять влияние такого текста на качество LLM. Они обнаружили, что добавление AI-текста изначально помогает при ограниченных данных, но затем вред перевешивает пользу, особенно для моделей с большим объёмом человеческих текстов. Авторы предложили новый закон масштабирования с отдельными компонентами пользы и вреда, который лучше предсказывает воздействие AI-текста на качество модели.'}, 'en': {'title': 'Navigating the Wild: Balancing AI and Human Text in Language Model Training', 'desc': 'This paper investigates the impact of AI-generated text on the pretraining of language models. It finds that while adding AI tokens can initially improve performance on human text for data-starved models, excessive AI tokens can lead to worse outcomes. For models with ample human text, AI tokens consistently increase loss, indicating that human text is more beneficial. The authors propose a new scaling law that accounts for the varying effects of AI text, and they provide a new dataset called WildAI to support further research.'}, 'zh': {'title': 'AI文本对语言模型预训练的双刃剑效应', 'desc': '这篇论文探讨了网络文本在语言模型预训练中的影响，尤其是AI生成的文本。研究发现，随着时间的推移，AI生成的标记在预训练数据中占比逐渐增加。通过对800个语言模型的预训练，作者发现添加AI标记对人类文本的损失有初步降低的效果，但随着AI标记的增加，这种好处会饱和并最终转为负面影响。论文提出了一种新的缩放法则，能够更好地预测AI文本对人类文本损失的影响，并建议在以人类文本为目标时过滤AI文本。'}}}, {'id': 'https://huggingface.co/papers/2609.39938', 'title': 'LEAP: Learned Block-wise Evidence Retrieval for Long Audio-Video Perception', 'url': 'https://huggingface.co/papers/2609.39938', 'abstract': 'Abstract  Hour-scale audio-visual question answering is constrained by a context dilemma: dense whole-recording encoding rapidly exhausts context limits, whereas uniform temporal compression severely dilutes fine-grained acoustic and visual evidence. We introduce LEAP, a framework where the model retrieves its own evidence without placing the whole recording in one context. LEAP divides a recording into fixed-duration blocks, applying a lightweight localization pass to each block to score short candidate windows. The highest-ranked windows are pooled and re-encoded in a single bounded answer pass. Consequently, the answer input and peak context remain independent of the recording duration. By decoupling evidence localization from reasoning, our framework can localize candidate temporal windows over pre-computed transcripts without decoding media frames, while preserving fine-grained visual and non-speech evidence by routing the final answering pass over raw audio-visual streams. LEAP trains both stages: a localization LoRA improves the selected windows, and an answer LoRA improves the answers read from the same windows. The block grid natively supports causal queries, enabling LEAP to support streaming inference without streaming-specific training. Across several AVQA benchmarks, LEAP improves over the Qwen3-Omni-30B-A3B baseline by 4.5-16.8%, and transfers to a second omni-modal backbone, MiniCPM-o 4.5, surpassing its published results by 3.1-13.0%.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'a38c47520b6fa679', 'authors': ['Juyi Lin', 'Zhiqiang Lao', 'Jiali Cui', 'Lin Zhao', 'Pu Zhao', 'Dichang Zhang', 'Arman Akbari', 'Yu Qi', 'Xinru Jiang', 'Yanzhi Wang', 'Heather Yu', 'Liang Peng'], 'affiliations': ['Futurewei Technologies', 'Northeastern University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39938.jpg', 'data': {'categories': ['#multimodal', '#audio', '#video', '#benchmark', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Эффективный поиск доказательств в аудиовизуальном понимании через избирательное кодирование', 'desc': 'В статье представлен LEAP — фреймворк для ответов на вопросы о часовых аудиовизуальных записях, который решает проблему контекстного окна путём двухэтапного подхода. На первом этапе модель локализует релевантные временные окна в записи через лёгкую передачу по блокам, а на втором этапе переэнкодирует выбранные фрагменты для получения ответа. Такое разделение позволяет избежать перегрузки контекста и сохранить мелкозернистые акустические и визуальные детали, включая невербальную информацию. Метод обучается с использованием локализационных и ответных LoRA адаптеров и демонстрирует значительные улучшения на бенчмарках, а также поддерживает потоковый режим без специальной подготовки.'}, 'en': {'title': 'LEAP: Efficient Evidence Retrieval for Audio-Visual Question Answering', 'desc': 'The paper presents LEAP, a novel framework for audio-visual question answering that addresses the challenge of context limitations in processing long recordings. By dividing recordings into fixed-duration blocks, LEAP allows the model to efficiently retrieve relevant evidence without overwhelming the context window. It employs a two-stage training process, where a localization model identifies candidate windows and an answer model refines the responses based on these windows. This approach not only enhances performance on various benchmarks but also enables streaming inference without the need for specialized training.'}, 'zh': {'title': 'LEAP：音频-视觉问答的新框架', 'desc': '本文提出了一种名为LEAP的框架，用于解决音频-视觉问答中的上下文困境。LEAP通过将录音分成固定时长的块，轻量化地对每个块进行定位评分，从而避免了将整个录音放入一个上下文中。该框架能够独立于录音时长进行答案输入和上下文处理，同时保留细粒度的视觉和非语音证据。通过训练定位和回答两个阶段，LEAP在多个音频-视觉问答基准测试中显著提高了性能。'}}}, {'id': 'https://huggingface.co/papers/2609.40359', 'title': 'Removing Timing Shortcuts Improves Non-Invasive Brain-to-Text', 'url': 'https://huggingface.co/papers/2609.40359', 'abstract': 'Abstract  We find that major reported improvements in decoding words from non-invasive brain recordings are largely reproducible without any brain data. In the influential work of d\'Ascoli et al. (2025), time series of brain activity from subjects perceiving continuous speech are segmented into fixed-length windows starting at each word. A neural network then generates predictions for all of the words in a sentence together. Neighbouring windows partially overlap, implicitly revealing the interval between words. Since these intervals indicate the duration of the words spoken, and different words tend to have different durations - for example, "the" is much shorter than "supercalifragilisticexpialidocious" - the neural network can improve its predictions of words without relying on the underlying brain activity. Consistent with this, the method reaches 22.0% balanced accuracy on synthetic signals containing no brain information, compared with 22.3% on real brain recordings. To prevent the network from learning this shortcut, we make a single, simple change. Instead of jointly encoding all windows in a sentence, we process each independently. As a result, the neural network achieves better performance by learning underlying word-specific information from brain recordings. This makes two existing strategies become much more effective than before. Both aggregating predictions from distinct neural responses to the same word and using a pretrained LLM as a linguistic prior now substantially improve results. On our perceived speech benchmark, this simple recipe (SimpleB2T) achieves a word error rate of 36.6% with five observations per word, approaching past invasive speech decoding performance, albeit under different conditions. The results in this work expose an important shortcut in brain-to-text decoding and show that removing it leads to a simple and considerably more effective strategy.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'f5402a85dcb8a35e', 'authors': ['Dulhan Jayalath', 'Oiwi Parker Jones'], 'affiliations': ['Neural Processing Lab (PNPL), Department of Engineering Science, University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2609.40359.jpg', 'data': {'categories': ['#benchmark', '#training', '#multilingual'], 'emoji': '🧠', 'ru': {'title': 'Обход при декодировании речи из мозга: простое решение сложной проблемы', 'desc': 'Исследование показывает, что улучшения в декодировании слов из записей активности мозга во многом достигаются благодаря анализу длительности слов, а не самих сигналов мозга. Авторы выявили, что нейронная сеть обучается предсказывать слова, используя интервалы между окнами временных рядов, которые косвенно раскрывают длительность произносимых слов. Для устранения этой «лазейки» они предложили обрабатывать каждое окно независимо вместо совместного кодирования всех окон в предложении. Полученный метод SimpleB2T достигает существенно лучших результатов, позволяя модели извлекать истинную информацию из сигналов мозга и эффективнее использовать предобученные языковые модели.'}, 'en': {'title': 'Unlocking Brain-to-Text: A Simple Yet Powerful Approach', 'desc': 'This paper investigates the effectiveness of decoding words from brain recordings and finds that significant improvements can be achieved without using actual brain data. The authors demonstrate that a neural network can predict words based on the timing of speech intervals, which are consistent across different words. By processing each time window independently rather than jointly, the network learns more meaningful word-specific information from the brain data. This approach, termed SimpleB2T, enhances existing strategies and achieves a competitive word error rate, highlighting the importance of avoiding shortcuts in brain-to-text decoding.'}, 'zh': {'title': '去除捷径，提升脑-文本解码效果', 'desc': '这篇论文发现，从非侵入性脑记录中解码单词的显著改进在没有脑数据的情况下也能大部分重现。研究表明，神经网络可以通过分析单词之间的时间间隔来提高对单词的预测，而不依赖于实际的脑活动。通过独立处理每个窗口，研究者们避免了网络学习到的捷径，从而使得网络能够更好地学习与单词相关的信息。最终，提出的SimpleB2T方法在感知语音基准测试中取得了36.6%的单词错误率，接近以往侵入性解码的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.37539', 'title': 'SkillGym: Training Skill-Use Agents with Automatic Verifiable Environment Generation', 'url': 'https://huggingface.co/papers/2609.37539', 'abstract': 'Abstract  Skills equip LLM agents with professional knowledge and guidance to complete long-horizon and complex tasks. Although skills have been widely adopted in recent agent paradigms and harnesses, how to synthesize reliable training data and how to train agents for skill use remain underexplored. In this work, we propose SkillGym, an automatic pipeline to build verifiable environments, collect trajectories, and train skill-use agents. SkillGym first crawls a large volume of skills from the internet, then keeps those whose workflows can run reproducibly offline. A builder-reviewer pipeline is used to construct difficulty-controlled tasks, spanning four task types, each with a reference solution and an executable verifier. With this pipeline, we build 6.8k environments and collect 19k verified successful trajectories for supervised finetuning. Finetuning on these trajectories improves LLMs of different families and sizes, from 2B to 122B parameters across four skill-use benchmarks; Our Qwen3.5-9B SFT model outperforms the 397B untrained model on two of them. Further analysis shows that training teaches agents to invoke skills, raising the rate of reading the relevant skill from 28% to 96%, and that the gains hold across reasoning structures, extending to task types that form a minority of the training data and to skills held out from training', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'c952a6925b524a4b', 'authors': ['Renxi Wang', 'Mingshan Hee', 'Fajri Koto', 'Timothy Baldwin', 'Haonan Li'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2609.37539.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents', '#dataset'], 'emoji': '🛠️', 'ru': {'title': 'Систематическое обучение агентов использованию профессиональных навыков через верифицированные данные', 'desc': 'В работе предложена система SkillGym для автоматического создания окружений и сбора данных для обучения агентов на основе больших языковых моделей работе с профессиональными навыками. Система собирает навыки из интернета, отбирает воспроизводимые рабочие процессы и использует конвейер построения и проверки для создания задач с контролируемой сложностью и верификацией решений. На собранных 19 тысячах верифицированных траекториях проводится обучение с контролем через supervised finetuning, что значительно улучшает способность моделей различных размеров вызывать и применять нужные навыки. Результаты показывают, что обученные агенты повышают частоту успешного обращения к релевантным навыкам с 28% до 96% и демонстрируют хорошую обобщаемость на новые типы задач и неизвестные навыки.'}, 'en': {'title': 'Empowering LLMs with SkillGym for Enhanced Task Performance', 'desc': 'This paper introduces SkillGym, a novel framework designed to enhance the training of large language model (LLM) agents by integrating professional skills for complex tasks. SkillGym automates the process of creating verifiable environments and collecting training data, ensuring that the skills used are reliable and reproducible. The framework includes a builder-reviewer system that generates controlled difficulty tasks and collects verified successful trajectories for supervised fine-tuning. Results show that fine-tuning LLMs on this data significantly improves their ability to utilize skills effectively, achieving higher performance on various benchmarks compared to untrained models.'}, 'zh': {'title': 'SkillGym：提升智能体技能使用的自动化管道', 'desc': '本论文提出了一种名为SkillGym的自动化管道，用于构建可验证的环境、收集轨迹并训练技能使用的智能体。SkillGym从互联网上抓取大量技能，并筛选出可以在离线环境中可重复运行的工作流程。通过构建难度控制的任务，SkillGym生成了6800个环境和19000个经过验证的成功轨迹，用于监督微调。微调后，模型在不同规模的LLM上表现出显著提升，证明了训练可以有效提高智能体调用技能的能力。'}}}, {'id': 'https://huggingface.co/papers/2609.18587', 'title': 'Label-free steering: Compressing test-time reinforcement learning into bias-only subspaces', 'url': 'https://huggingface.co/papers/2609.18587', 'abstract': 'Abstract  Test-time reinforcement learning (TTRL) enables models to improve their reasoning without relying on labeled training data, but existing approaches typically optimize a large fraction of the model parameters. This raises a natural question: can effective test-time adaptation emerge when both the reward signal and the optimization space are severely restricted? We answer this question with label-free bias-only TTRL, which uses majority-vote pseudolabels as rewards and optimizes only ~100K bias parameters while keeping the pretrained backbone frozen. On MATH-500, our approach reaches 76.67% accuracy with Qwen2.5-7B, slightly exceeding our own labeled bias-steering reproduction while optimizing 76,000x fewer parameters than full-parameter TTRL. The same training procedure improves performance across vision-language and audio reasoning tasks, including MathVista, AI2D, LogicVista, and MMAU. We further show that the learned steering vectors transfer to 4,500 held-out MATH problems, indicating that the adaptation is not limited to the problems used during test-time optimization. Finally, we analyze why this highly restricted adaptation can work, showing that majority-vote reliability improves with rollout consensus and that bias subspaces with greater accessible gradient energy exhibit stronger downstream trainability. These results demonstrate that substantial test-time adaptation can emerge from optimizing a tiny bias-only subspace using entirely label-free rewards.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '13792d71db06f0ae', 'authors': ['Naveen Vakada', 'Mingyuan Li', 'Shaoxiong Ji'], 'affiliations': ['ELLIS Institute Finland', 'University of Turku, Finland'], 'pdf_title_img': 'assets/pdf/title_img/2609.18587.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#training', '#rl', '#reasoning'], 'emoji': '⚙️', 'ru': {'title': 'Минимальная адаптация на тесте через оптимизацию только параметров смещения без разметки', 'desc': 'В работе предложен метод тестового усиления обучения (TTRL), который позволяет моделям улучшать свои рассуждения без размеченных данных. Ключевая идея заключается в оптимизации только параметров смещения (~100K) при замороженной предварительно обученной части сети, используя большинство голосов псевдометок как награды. На датасете MATH-500 подход достигает 76.67% точности с моделью Qwen2.5-7B, оптимизируя в 76,000 раз меньше параметров, чем полнопараметрический TTRL. Метод успешно применяется к задачам мультимодального рассуждения и демонстрирует переносимость на новые примеры, что показывает эффективность весьма ограниченной адаптации через обучение векторов смещения.'}, 'en': {'title': 'Efficient Adaptation with Minimal Parameters in Test-Time Learning', 'desc': 'This paper introduces a novel approach called label-free bias-only test-time reinforcement learning (TTRL), which allows models to adapt and improve their performance without needing labeled data. Instead of optimizing all model parameters, it focuses on a small set of approximately 100,000 bias parameters while keeping the main model unchanged. The method uses majority-vote pseudolabels as rewards, achieving impressive accuracy on various reasoning tasks, including MATH-500, with significantly fewer parameters than traditional TTRL methods. The findings suggest that effective adaptation can occur even with limited resources, highlighting the potential of optimizing a small bias subspace for improved model performance.'}, 'zh': {'title': '无标签偏差优化的测试时适应性', 'desc': '本文提出了一种测试时强化学习（TTRL）的方法，允许模型在没有标记训练数据的情况下改进推理能力。我们的方法使用无标签的多数投票伪标签作为奖励，仅优化约10万个偏差参数，同时保持预训练的主干网络不变。实验结果表明，在MATH-500数据集上，我们的方法达到了76.67%的准确率，且优化的参数数量比全参数TTRL少了76,000倍。我们还发现，学习到的引导向量可以迁移到其他未见过的数学问题上，表明这种适应性不仅限于测试时优化使用的问题。'}}}, {'id': 'https://huggingface.co/papers/2609.24555', 'title': "The Endless Exam: Mathematical Constructions from Today's Models toward Superintelligence", 'url': 'https://huggingface.co/papers/2609.24555', 'abstract': 'Abstract  We introduce the Endless Exam, a benchmark spanning fourteen parameterised families of mathematical construction problems, with verifiable scores that distinguish progress before and beyond published mathematical frontiers. Each submitted object is checked automatically for validity and assigned a relative quality score against a published frontier or construction baseline, without capping improvements at 1. The benchmark draws long-term challenges from open mathematical problems and generates larger instances by varying their parameters. Compact certificates allow large constructions to be verified without listing every element. Across nine models evaluated on 69 distinct instances, continuous quality scores distinguish performance even though none of the 30 published-frontier references is surpassed. Size-quality curves show how construction quality changes as problem size increases. We release the generators, verifiers, references, model responses and analysis to support continued measurement before and beyond human frontiers.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': 'ca09fa23f14311fd', 'pdf_title_img': 'assets/pdf/title_img/2609.24555.jpg', 'data': {'categories': [], 'emoji': '📐', 'ru': {'title': 'Бесконечный экзамен: измерение прогресса AI за границами математических фронтиров', 'desc': 'Представлена новая бенчмарк-система «Endless Exam», которая включает четырнадцать параметризованных семейств задач математического конструирования с автоматической проверкой корректности и оценкой качества без ограничения на единицу. Система позволяет генерировать экземпляры задач разного размера и сравнивать решения различных моделей с опубликованными границами человеческого знания. Компактные сертификаты обеспечивают верификацию больших конструкций без необходимости перечисления каждого элемента. Работа демонстрирует, что непрерывные метрики качества способны различать производительность моделей даже на задачах, которые еще не превзойдены, предоставляя инструмент для долгосрочного измерения прогресса AI-систем.'}, 'en': {'title': 'Pushing the Boundaries of Mathematical Construction with Endless Exam', 'desc': 'The Endless Exam is a new benchmark designed to evaluate mathematical construction problems using fourteen different parameterized families. It automatically checks the validity of submitted solutions and assigns quality scores based on their performance relative to established mathematical frontiers. This benchmark allows for the exploration of open mathematical problems by generating larger instances through parameter variation. Additionally, it provides compact certificates for verifying large constructions efficiently, enabling ongoing assessment of model performance in relation to human achievements.'}, 'zh': {'title': '无尽考试：超越数学前沿的基准测试', 'desc': '我们介绍了无尽考试，这是一个涵盖十四个参数化数学构造问题的基准测试，能够验证分数以区分在已发布数学前沿之前和之后的进展。每个提交的对象都会自动检查其有效性，并根据已发布的前沿或构造基线分配相对质量分数，而不限制改进在1以内。该基准测试从开放的数学问题中提取长期挑战，并通过改变参数生成更大的实例。我们发布了生成器、验证器、参考资料、模型响应和分析，以支持在超越人类前沿之前和之后的持续测量。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.39788', 'title': 'Safety of Latent Communication in Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2609.39788', 'abstract': "Abstract  Latent communication enables multi-agent systems to exchange information directly in internal representation space, reducing the token, computation, and latency overhead of text-based communication. To this end, lightweight trainable links are introduced to map the sender's representations into the receiver's input space. In this work, we show that even benign link training can increase harmful compliance relative to text-based communication while the underlying safety-aligned agents remain unchanged. An attacker can amplify this effect by optimizing the links on harmful query--response pairs or poisoning otherwise benign training data. We further develop a reinforcement-learning attack that rewards harmful compliance alongside benign task performance without requiring harmful target responses. Across three communication topologies and four safety benchmarks, this attack raises the mean harmful-compliance score from 27.9 with benignly trained links to 76.9. Compared with direct supervised optimization, it also achieves higher average accuracy on two benign utility benchmarks. Adapting the rewards toward safer behavior also enables repair of compromised links, substantially reducing harmful compliance across all evaluated attacks without updating the agents. Overall, our results show that safety alignment requires considering the multi-agent system as a whole.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'c4b49b0dc8b5993e', 'authors': ['Muhammad Huzaifa', 'Sina Mavali', 'Thorsten Eisenhofer'], 'affiliations': ['CISPA Helmholtz Center for Information Security, Saarbrucken, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2609.39788.jpg', 'data': {'categories': ['#benchmark', '#agents', '#alignment', '#security', '#rl'], 'emoji': '🔗', 'ru': {'title': 'Скрытая опасность: как обученные связи в многоагентных системах обходят защиту безопасности', 'desc': 'В работе исследуется уязвимость многоагентных систем, которые используют латентную коммуникацию через обучаемые связи для обмена информацией во внутреннем пространстве представлений. Авторы показывают, что даже безопасное обучение этих связей может увеличить готовность системы выполнять вредоносные запросы, несмотря на то что базовые модели остаются защищенными. Предложен метод reinforcement learning атаки, который одновременно оптимизирует связи для вредоносного поведения и сохранения полезности системы, достигая 76.9% уровня вредоносного соответствия вместо исходных 27.9%. Результаты демонстрируют, что защита безопасности в многоагентных системах требует рассмотрения всей системы как единого целого, а не отдельных компонентов.'}, 'en': {'title': 'Enhancing Safety in Multi-Agent Communication', 'desc': 'This paper discusses how multi-agent systems can communicate using internal representations instead of text, which can save time and resources. It introduces trainable links that help senders and receivers share information more efficiently. However, the study reveals that these links can be exploited to increase harmful behavior, even when the agents are designed to be safe. The authors propose a reinforcement-learning attack that enhances harmful compliance while maintaining performance on benign tasks, highlighting the need for a holistic approach to safety in multi-agent systems.'}, 'zh': {'title': '安全对齐需整体考虑多智能体系统', 'desc': '潜在通信使多智能体系统能够在内部表示空间中直接交换信息，从而减少基于文本的通信所需的令牌、计算和延迟开销。本文引入轻量级可训练链接，将发送者的表示映射到接收者的输入空间。研究表明，即使是良性的链接训练也会相对增加有害的合规性，而基础的安全对齐智能体保持不变。我们还开发了一种强化学习攻击，能够在不需要有害目标响应的情况下，奖励有害合规性和良性任务表现。'}}}, {'id': 'https://huggingface.co/papers/2609.36333', 'title': 'ATLAS: Aligned Transport of Latent Structure for Reliable World Model Planning', 'url': 'https://huggingface.co/papers/2609.36333', 'abstract': 'Abstract  Latent world models rely on representation geometry for planning, yet regularizing the latent marginal alone does not determine the state-to-state relationships used for action selection. We show that this can cause planning-relevant novelty structure to be weakened as representations are transformed into the final latent used by the planner. We introduce Aligned Transport of Latent Structure (ATLAS), a training objective that explicitly preserves relational geometry while calibrating the global latent distribution. ATLAS transfers normalized pairwise structure from an informative encoder representation to the planning latent and uses Wasserstein embedding matching (WEMReg) to calibrate its marginal through one-dimensional Wasserstein-2 transport. Our analysis shows that relational preservation and marginal calibration impose non-redundant constraints, and connects finite-candidate planning stability to relational distortion, latent-scale mismatch, and prediction error. Instantiated in LeWM, ATLAS improves mean goal-reaching success across PushT, TwoRoom, and OGBench-Cube on both lower- and higher-novelty evaluation subsets, with the largest gain on higher-novelty TwoRoom episodes. Representation and rollout diagnostics further show stronger novelty-related structure in the planning latent, improved marginal calibration, and lower multi-step prediction error. Together, these results highlight preservation of planning-relevant latent geometry as an important ingredient for reliable world-model planning. Code is available at https://anonymous.4open.science/r/atlas-world-model-72C4/.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '0d0777ed72a21589', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#rl', '#architecture'], 'emoji': '🗺️', 'ru': {'title': 'Сохранение структуры представлений для надежного планирования в латентных моделях мира', 'desc': 'Статья решает проблему сохранения геометрии представлений в латентных моделях мира, которые используются для планирования. Авторы показывают, что регуляризация только маргинального распределения недостаточна для сохранения отношений между состояниями, необходимых для
