usal reasoning. The findings indicate that existing models struggle with grounding tool use in visual evidence, highlighting the need for improved training resources like EgoTools.'}, 'zh': {'title': 'EgoTools：理解自我中心工具使用的关键资源', 'desc': '这篇论文介绍了EgoTools，这是一个用于理解自我中心工具使用的综合工具包。它包含两个部分：EgoTools-Data，提供了100小时的工具使用录音和丰富的注释；EgoTools-Bench，提供了1,000个问题的基准测试，涵盖了工具使用的感知、几何、程序和因果推理。实验结果表明，现有模型在视觉证据中定位工具使用仍然存在困难，EgoTools为训练和评估提供了重要资源。'}}}, {'id': 'https://huggingface.co/papers/2610.00812', 'title': 'Video Generation Models: A Survey of Post-Training and Alignment', 'url': 'https://huggingface.co/papers/2610.00812', 'abstract': 'Abstract  Video generation has rapidly progressed from short, low-quality clips to high-resolution, long-duration sequences with complex spatiotemporal dynamics. Despite strong generative priors learned through large-scale pretraining, pretrained video models often fail to reliably follow human intent, maintain temporal coherence, or satisfy physical and safety constraints. Compared with image and text generation, alignment in video generation presents unique challenges, including error accumulation over time, motion-appearance coupling, multi-objective trade-offs, and limited supervision for temporal properties. These challenges motivate systematic post-training strategies that adapt pretrained models without retraining them from scratch. In this survey, we present the first comprehensive review of post-training and alignment in video generation models. We frame post-training as a unifying framework and distinguish between implicit alignment and explicit alignment based on how alignment signals are enforced. From this perspective, we organize existing approaches into four broad categories: supervised fine-tuning methods, self-training and distillation methods, preference- and reward-based methods, and inference-time methods. This taxonomy provides a coherent view of how alignment signals shape model behavior across both training and deployment. Beyond methodological advances, we review commonly used datasets, benchmarks, and evaluation practices, and discuss open challenges such as scalable reward design, long-horizon temporal consistency, stability-expressiveness trade-offs, and safety-aware generation. This survey aims to provide a structured conceptual foundation and practical guidance for advancing controllable and reliable video generation models.', 'score': 44, 'issue_id': 3365, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b340079efb8d2810', 'authors': ['Chaoyu Li', 'Xiaoyi Gu', 'Yogesh Kulkarni', 'Eun Woo Im', 'Mohammadmahdi Honarmand', 'Zeyu Wang', 'Juntong Song', 'Fei Du', 'Xilin Jiang', 'Kexin Zheng', 'Tianzhi Li', 'Fei Tao', 'Pooyan Fazli'], 'affiliations': ['Arizona State University', 'Carnegie Mellon University', 'Columbia University', 'Microsoft', 'NewsBreak', 'Stanford University', 'Twitch', 'University of Southern California', 'eBay'], 'pdf_title_img': 'assets/pdf/title_img/2610.00812.jpg', 'data': {'categories': ['#rlhf', '#alignment', '#training', '#video', '#benchmark', '#survey'], 'emoji': '🎬', 'ru': {'title': 'Выравнивание видеомоделей: от постобучения к контролируемой генерации', 'desc': 'В этой статье рассматривается проблема выравнивания (alignment) предварительно обученных моделей генерации видео с намерениями пользователя без полного переобучения. Авторы предложили унифицированную структуру постобучения видеомоделей, разделив подходы на четыре категории: supervised fine-tuning, самообучение с дистилляцией, методы на основе предпочтений и награждения, а также методы на этапе инференса. Работа анализирует уникальные вызовы в выравнивании видеогенерации, такие как накопление ошибок во времени, связанность движения и внешнего вида, а также необходимость обеспечения безопасности и физической корректности. В обзоре рассмотрены датасеты, бенчмарки, практики оценки и открытые проблемы, включая масштабируемый дизайн наград и обеспечение долгосрочной временной согласованности.'}, 'en': {'title': 'Advancing Reliable Video Generation through Post-Training Strategies', 'desc': 'This paper reviews the advancements in video generation, highlighting the transition from low-quality clips to high-resolution sequences. It identifies challenges in aligning video models with human intent, maintaining coherence over time, and adhering to physical constraints. The authors propose a framework for post-training strategies that adapt pretrained models, categorizing methods into supervised fine-tuning, self-training, preference-based, and inference-time approaches. The survey also discusses datasets, benchmarks, and ongoing challenges in the field, aiming to enhance the reliability and control of video generation models.'}, 'zh': {'title': '视频生成模型的对齐与后训练策略', 'desc': '视频生成技术已经从短小、低质量的片段发展到高分辨率、长时长的复杂序列。尽管通过大规模预训练获得了强大的生成先验，预训练的视频模型在遵循人类意图、保持时间一致性和满足物理及安全约束方面仍然存在问题。视频生成中的对齐问题具有独特的挑战，包括时间上的误差累积、运动与外观的耦合、多目标权衡以及时间属性的监督有限。本文综述了视频生成模型中的后训练和对齐策略，提供了一个系统的框架，并将现有方法分为四大类，以帮助理解对齐信号如何影响模型行为。'}}}, {'id': 'https://huggingface.co/papers/2610.02196', 'title': 'InterEvolve: Test-Time Evolution of Reward Programs for Humanoid Loco-Manipulation', 'url': 'https://huggingface.co/papers/2610.02196', 'abstract': "Abstract  We study test-time evolution for humanoid loco-manipulation: solving tasks that a controller was never trained for by repurposing its existing skills, improving from its own attempts, and retaining what it learns, without retraining. Our key insight is that a broad controller already holds much of the competence a new task needs, and that this competence becomes accessible through an interface between planning and control that is expressive enough to specify contact-rich, multi-stage interactions, yet executable and measurable enough that execution feedback can guide planning from experience. InterEvolve realizes this interface with two components. First, we develop an object-aware forward-backward (FB) behavioral foundation model, whose object residuals on a frozen body prior turn a new reward about the body or objects into loco-manipulation behavior at test time. Second, we specify tasks as reward programs: staged rewards with completion conditions and tunable constants. A large language model (LLM) agent revises the program structure in context, drawing on execution feedback and a skill library of verified programs, while a numerical optimizer tunes its constants. With every candidate verified across parallel simulation scenarios, the program explores new ways to induce, repurpose, and compose the controller's existing motor competence for the task at hand, and thus improves over iterations. Experiments show that human-designed rewards leave much of the FB model's loco-manipulation competence untapped, whereas the programs InterEvolve evolves release it, sometimes through novel strategies. It further produces behaviors for diverse tasks, complex scenes, and long-horizon compositions in simulation, and evolved skills run autonomously on a physical Unitree G1 from egocentric onboard perception.", 'score': 43, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '31b7f46cdd9a7305', 'authors': ['Zhuo Lin', 'Sirui Xu', 'Liuyu Bian', 'Yu-Xiong Wang', 'Liang-Yan Gui'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02196.jpg', 'data': {'categories': ['#robotics', '#agents', '#training'], 'emoji': '🤖', 'ru': {'title': 'Раскрытие скрытых навыков робота через эволюцию программ вознаграждения без переобучения', 'desc': 'В работе изучается эволюция контроллера во время тестирования для задач манипуляции гуманоидным роботом без переобучения. Основная идея заключается в том, что предварительно обученный контроллер уже обладает компетенциями, необходимыми для новых задач, и эти компетенции можно раскрыть через интерфейс между планированием и управлением. Система InterEvolve использует фундаментальную модель поведения на основе трансформатора с замороженным приором и специальный интерфейс вознаграждения, а также LLM-агента для эволюции программ вознаграждения и численную оптимизацию их параметров. Экспериментальные результаты показывают, что эволюционированные программы вознаграждения раскрывают скрытые компетенции модели и позволяют роботу выполнять разнообразные задачи, включая сложные сцены и долгие последовательности операций как в симуляции, так и на физическом роботе.'}, 'en': {'title': 'Unlocking Robot Skills: Evolving Competence at Test Time', 'desc': "This paper explores how humanoid robots can adapt their existing skills to perform new tasks without needing retraining. The authors introduce a method called InterEvolve, which uses a combination of a behavioral foundation model and reward programs to enhance the robot's performance. By leveraging execution feedback and a library of verified skills, the robot can refine its approach to tasks over time. The results demonstrate that this method allows for more effective use of the robot's capabilities, enabling it to tackle complex scenarios and operate autonomously in real-world environments."}, 'zh': {'title': '智能控制器的自我进化与任务适应', 'desc': '本论文研究了人形机器人在测试时的演变能力，旨在通过重新利用现有技能来解决未曾训练过的任务。我们发现，广泛的控制器已经具备新任务所需的许多能力，这些能力可以通过规划与控制之间的接口来访问。InterEvolve实现了这一接口，结合了对象感知的前后行为基础模型和奖励程序的任务定义。实验表明，InterEvolve能够有效释放控制器的运动能力，并在多样化的任务和复杂场景中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.32993', 'title': 'X-Tree: Tokenizing Reusable Experience for Efficient Agent Generalization', 'url': 'https://huggingface.co/papers/2609.32993', 'abstract': "Abstract  Multi-step agents are trained on flat action streams: SFT and RLVR weight every token uniformly and ignore the sub-procedures that recur across tasks, the hierarchy that lets humans plan top-down from reusable routines. This structure sits unused, and flat training uses each scarce trajectory less fully than its content allows. Recent agents do use that structure, but only as LLM-written skills in context, never in the weights, so their gains do not generalize beyond retrieval. We instead recover this hierarchy from the data itself and train on it, with no LLM calls. Following text tokenizers, which build a vocabulary by counting alone, we score action spans by reusability and merge canonicalized actions into a reusable eXperience tree (X-Tree). Each X-Tree node captures how a frequent and success-bearing skill is composed from sub-skills, guiding efficient generalization. We integrate X-Tree into three training settings: offline RL, with each node as a training instance; online RLVR, with an adaptive skill bonus; and on-policy self-distillation, with X-Tree as the self-teacher's privileged context. Across WebArena, ScienceWorld, and WebShop at three model scales, X-Tree improves over standard recipes at matched data and budget by up to 4.5% SR on WebArena, 5.8% SR on ScienceWorld and 4.1% success on WebShop. Matched analyses attribute the gains to the X-Tree structure and the three integrations.", 'score': 42, 'issue_id': 3364, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '3dcef44b05de28c4', 'authors': ['Sitao Cheng', 'Xunjian Yin', 'Zhiyuan Sun', 'Yuxuan Li', 'Ruiwen Zhou', 'Xiangru Jian', 'Victor Zhong'], 'affiliations': ['Duke University', 'National University of Singapore', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2609.32993.jpg', 'data': {'categories': ['#agents', '#training', '#rl'], 'emoji': '🌳', 'ru': {'title': 'Иерархия умений из данных: обучение агентов через переиспользуемые подпроцедуры', 'desc': 'В статье предлагается метод восстановления иерархической структуры в данных траекторий для обучения многошаговых агентов. Авторы разрабатывают алгоритм X-Tree, который автоматически выделяет часто повторяющиеся подпроцедуры в действиях агента и объединяет их в переиспользуемые умения, подобно тому как работают текстовые токенизаторы. Полученная иерархия интегрируется в три режима обучения: offline reinforcement learning, online RLVR с адаптивным бонусом за умения и on-policy self-distillation. Эксперименты на трёх бенчмарках (WebArena, ScienceWorld, WebShop) демонстрируют улучшение производительности на 4-6% за счёт более эффективного использования траекторий и лучшей обобщающей способности моделей.'}, 'en': {'title': 'Unlocking Hierarchical Learning with eXperience Trees', 'desc': 'This paper introduces a novel approach to training multi-step agents by utilizing a hierarchical structure called the eXperience tree (X-Tree). Unlike traditional methods that treat actions uniformly, the X-Tree captures reusable sub-skills, allowing agents to generalize better across tasks. The authors demonstrate that integrating the X-Tree into various training settings, such as offline and online reinforcement learning, leads to significant improvements in success rates. The results show that this hierarchical method enhances the efficiency of learning by leveraging the compositional nature of skills, outperforming standard training techniques.'}, 'zh': {'title': '利用经验树提升多步骤智能体的学习效率', 'desc': '这篇论文提出了一种新的多步骤智能体训练方法，利用可重用的技能层次结构来提高学习效率。通过从数据中恢复这种层次结构，作者创建了一个可重用的经验树（X-Tree），以指导智能体的高效泛化。X-Tree的每个节点表示一个成功的技能是如何由子技能组合而成的，从而优化了训练过程。实验结果表明，在多个任务上，X-Tree显著提高了成功率，证明了其在强化学习中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.32019', 'title': 'Decentralized Master-Mind: Joint Action Refinement through Iterative Intent Denoising in Multi-Agent Pathfinding', 'url': 'https://huggingface.co/papers/2609.32019', 'abstract': 'Abstract  Decentralized multi-agent path finding (MAPF) with communication requires agents to reach individual goals without collisions under partial observability. Learnable policies trained on expert data provide an effective approach to this problem. However, when several coordinated joint actions are valid in the same context, independently sampling from per-agent distributions can recombine locally valid choices into incompatible joint actions. This failure can arise from the final sampling mechanism even when the per-agent action distributions are learned correctly. DMM (Decentralized Master-Mind) addresses this by replacing one-shot action sampling with discrete, iterative refinement of action intents across communication rounds, inspired by denoising in diffusion models. Agents initialize random action intents and refine them through local communication, coupling their choices before commitment. DMM is pretrained with imitation learning on expert MAPF solutions and further optimized with MICPO, a critic-free group-relative reinforcement-learning method designed for multi-agent, multi-round action refinement. DMM generally achieves higher success rates and lower solution costs than the evaluated learnable baselines. On 1,600 MovingAI tasks, DMM fine-tuned with MICPO solves 1,598, the highest coverage among the evaluated methods, while achieving solution costs close to those of the strongest baselines. DMM also scales to over one million simultaneously acting agents in obstacle-rich environments. These results show that round-level intent refinement can improve joint-action coordination while preserving decentralized execution.', 'score': 41, 'issue_id': 3363, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'a17a4e8e7f75bd17', 'authors': ['Valeriy Vyaltsev', 'Anton Andreychuk', 'Taisia Zlotnikova', 'Konstantin Yakovlev', 'Aleksandr Panov', 'Alexey Skrynnik'], 'affiliations': ['CogAI Lab, Moscow, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2609.32019.jpg', 'data': {'categories': ['#agents', '#rl', '#training', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'Итеративное уточнение действий для согласованной работы децентрализованных агентов', 'desc': 'В этой работе предложен метод децентрализованного поиска пути для множества агентов (MAPF) с коммуникацией, где агенты должны достичь своих целей без столкновений при неполной информации. Вместо однократного семплирования действий из распределений каждого агента, авторы используют итеративное уточнение намерений действий через раунды коммуникации, вдохновленное идеями из diffusion моделей. Метод DMM предварительно обучается на экспертных данных с помощью обучения подражанием, а затем оптимизируется методом MICPO — критик-свободным методом группового относительного обучения с подкреплением. На тестовом наборе из 1600 задач DMM достигает рекордных результатов, решая 1598 задач с низкой стоимостью решений и масштабируясь до миллионов одновременно действующих агентов.'}, 'en': {'title': 'Enhancing Coordination in Multi-Agent Path Finding with DMM', 'desc': 'This paper presents DMM (Decentralized Master-Mind), a novel approach to decentralized multi-agent path finding (MAPF) that enhances coordination among agents through iterative refinement of action intents. Instead of sampling actions independently, DMM allows agents to communicate and refine their choices over multiple rounds, which helps avoid incompatible joint actions. The method is pretrained using imitation learning on expert solutions and further optimized with a unique reinforcement learning technique called MICPO. DMM demonstrates superior performance in terms of success rates and solution costs, effectively managing coordination among a large number of agents in complex environments.'}, 'zh': {'title': '去中心化智能体的高效路径规划', 'desc': '这篇论文讨论了去中心化的多智能体路径规划（MAPF）问题，要求智能体在部分可观测的情况下达到各自的目标而不发生碰撞。研究提出了一种名为DMM（去中心化大师思维）的新方法，通过在通信回合中对行动意图进行离散的迭代优化，来解决独立采样可能导致的不兼容联合行动问题。DMM首先通过模仿学习在专家MAPF解决方案上进行预训练，然后使用一种无评论的群体相对强化学习方法MICPO进行进一步优化。实验结果表明，DMM在成功率和解决成本上优于其他学习基线，并且能够扩展到超过一百万个同时行动的智能体。'}}}, {'id': 'https://huggingface.co/papers/2610.01016', 'title': 'Scaling and Distilling Text Embeddings for Better Diffusibility', 'url': 'https://huggingface.co/papers/2610.01016', 'abstract': "Abstract  Diffusion language models (DLMs) offer a promising alternative to autoregressive (AR) language generation. Recent advances in continuous DLMs, which apply latent diffusion to continuous text embeddings, raise a practical question: which embedding makes the best latent space, i.e., the most diffusible? To answer this, we search through different embeddings and find that scaling the embedding model to stronger ones within the same family (T5 to T5Gemma-1 to T5Gemma-2) greatly improves generative performance. But the raw T5Gemma-2 embeddings are still not optimal. They are so discriminative that even the embeddings of plausible alternative words are separated, which makes the generation vulnerable to imperfect sampling. Consequently, continuous diffusion often fails to reach any of them and ends up at an invalid embedding instead. To address this, we distill T5Gemma-2 into a student encoder that learns the teacher's decoded probabilities as soft labels. Learning from such soft labels makes the student pull the alternative embeddings closer while maintaining the encoding-decoding mechanism. The distilled embeddings form a more connected and diffusible latent space, improving over the vanilla T5Gemma-2 embeddings. As a result, our medium-sized DLM achieves Gen. PPL 17.8 (against real-text PPL 15.4) at real-text entropy on OpenWebText, outperforming GPT-2-M on Gen. PPL.", 'score': 41, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '809c8d1fb4fee768', 'authors': ['Zekai Zhang', 'Yunjie Tian', 'Yanjin He', 'Xiaoyan Zhang', 'Dongdi Zhao', 'Qing Qu', 'Di Fu'], 'affiliations': ['University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2610.01016.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#optimization', '#training'], 'emoji': '🌊', 'ru': {'title': 'Дистилляция эмбеддингов для улучшения диффузионной генерации текста', 'desc': 'В работе исследуются диффузионные языковые модели как альтернатива авторегрессивной генерации текста. Авторы показывают, что качество генерации сильно зависит от выбора пространства эмбеддингов, и обнаруживают, что сырые эмбеддинги T5Gemma-2 слишком дискриминативны, разделяя даже правдоподобные альтернативные слова. Для решения этой проблемы они применяют дистилляцию: обучают студент-энкодер воспроизводить вероятности учителя как мягкие метки, что приближает альтернативные эмбеддинги друг к другу. Полученное дистиллированное пространство становится более связным и диффузируемым, позволяя модели среднего размера достичь лучшей перплексии на OpenWebText, чем GPT-2-M.'}, 'en': {'title': 'Enhancing Language Generation with Diffusion Models', 'desc': 'This paper explores diffusion language models (DLMs) as a new approach to language generation, contrasting them with traditional autoregressive models. The authors investigate various text embeddings to determine which provides the best latent space for diffusion, finding that stronger embeddings significantly enhance generative performance. However, they discover that the most powerful embeddings, like T5Gemma-2, are too discriminative, leading to issues in generating plausible alternatives. To resolve this, they propose a student encoder that learns from soft labels of the teacher model, resulting in a more connected latent space that improves generation quality and outperforms existing models like GPT-2-M.'}, 'zh': {'title': '提升生成性能的扩散语言模型', 'desc': '扩散语言模型（DLMs）为自回归语言生成提供了一个有前景的替代方案。研究发现，通过对不同的嵌入进行搜索，增强嵌入模型的能力可以显著提高生成性能。尽管T5Gemma-2的原始嵌入仍然不够理想，但通过将其蒸馏为学生编码器，能够学习教师的解码概率，从而使替代嵌入更加紧密。最终，蒸馏后的嵌入形成了一个更连通和可扩散的潜在空间，提升了生成效果。'}}}, {'id': 'https://huggingface.co/papers/2609.36388', 'title': 'Persona Dosing: Calibrated Activation Steering for Graded Trait Control', 'url': 'https://huggingface.co/papers/2609.36388', 'abstract': 'Abstract  An activation-steering coefficient sets intervention strength, but requesting a particular degree of persona expression requires a behavioral scale. We study persona dosing: controlling a language model through a trait description and a requested mean intensity. PersonaDose specializes a shared, description-conditioned FLAS controller on persona responses, then calibrates its flow time against measured trait expression. Training responses are not paired with requested target intensities. Across Llama-3.1-8B, Qwen3-8B, and Gemma-3-4B, PersonaDose raises core-trait expression at the Persona Vectors coherence floor of 75 by 33.2, 18.3, and 17.8 points over contrastive activation addition. Calibration-selected settings retain an expression advantage on held-out questions, although the coherence floor does not hold for every trait there. Across seven trained traits, calibrated requests yield mean targeting errors of 4.7-6.2 points over 14-22 calibration-reachable targets out of 28 per model. These results separate the behavioral range learned by a controller from the accuracy of requests within that range.', 'score': 40, 'issue_id': 3364, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': 'd0f52be99fdc9c6d', 'authors': ['Zehao Jin', 'Junran Wang', 'Ruixuan Deng', 'Jiahao Chen', 'Jingyuan Zhang', 'Yuxuan Zhang', 'Xinjie Shen'], 'affiliations': ['Georgia Institute of Technology', 'University of British Columbia', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.36388.jpg', 'data': {'categories': ['#architecture', '#interpretability', '#training'], 'emoji': '🎚️', 'ru': {'title': 'Дозированное управление персональностью языковых моделей через калибровку интенсивности', 'desc': 'В работе предложен метод PersonaDose для управления поведением языковых моделей путём задания описания персоны и желаемой интенсивности её проявления. Авторы обучают специализированный контроллер FLAS, который условируется на описание черт характера, а затем калибруют силу вмешательства в зависимости от измеренного уровня выражения этих черт. Результаты показывают значительный прирост выражения основных черт персоны по сравнению с методом контрастивного добавления активаций на нескольких моделях. Исследование демонстрирует, что точность управления поведением модели зависит как от диапазона поведений, которые способен обучить контроллер, так и от точности самих запросов на задание интенсивности.'}, 'en': {'title': 'Enhancing Language Model Persona Control with PersonaDose', 'desc': 'This paper introduces PersonaDose, a method for controlling language models by adjusting their persona expression based on trait descriptions and desired intensity levels. It utilizes a specialized controller that is trained to respond to these persona requests without needing direct pairing of training responses with target intensities. The results show that PersonaDose significantly improves the expression of core traits in various language models, achieving higher coherence in persona responses. Additionally, the method demonstrates that while calibration can enhance performance, it does not guarantee consistency across all traits.'}, 'zh': {'title': '个性表达的精准控制', 'desc': '本文研究了如何通过特征描述和请求的平均强度来控制语言模型的个性表达。我们提出了PersonaDose方法，它专注于在个性响应上调整共享的FLAS控制器，并根据测量的特征表达来校准其流动时间。实验结果表明，PersonaDose在多个模型上显著提高了核心特征表达的准确性。通过校准请求，我们能够在不同的特征上实现更精确的个性表达。'}}}, {'id': 'https://huggingface.co/papers/2609.39375', 'title': 'Beyond the Current Scene: Event-Referential Grasping with Active View Selection', 'url': 'https://huggingface.co/papers/2609.39375', 'abstract': "Abstract  A robot that observes people interacting with objects should be able to carry out later requests that refer back to those interactions. Such requests may specify a grasp target by the role it played in a past event rather than by its name or appearance. Moreover, the target may no longer be visible when the robot is asked to act. We present BeyondSCe, a zero-shot robotic grasping system for this event-referential setting. Given the event history and the current scene, the system identifies the requested object or part and localizes it for grasping. If the target is occluded, it combines an event prior recovered from the history with current scene geometry to select camera viewpoints likely to reveal the target. The system uses pretrained models without additional task-specific training. In real-robot experiments with a single wrist-mounted RGB-D camera, it achieves grasp success rates of 76% and 77% for initially visible and occluded targets, respectively, compared with 40% and 55% for the strongest baseline in each condition. On four additional scenes with heavy occlusion, it increases grasp success rates from 75% to 95% while reducing the mean number of views from 3.35 to 2.20, compared with an active-perception baseline given the target's ground-truth 3D bounding box.", 'score': 35, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b14202e698a2cfb1', 'authors': ['Hyunjoon Lee', 'Haebeom Jung', 'Eunsung Cha', 'Daeun Lee', 'Yu-Chiang Frank Wang', 'Jaesung Choe', 'Jaesik Park'], 'affiliations': ['NVIDIA', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39375.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Робот, помнящий события: захват предметов через историю взаимодействий', 'desc': 'BeyondSCe — это система для роботизированного захвата предметов, которая понимает прошлые события с участием человека и объектов. Система может идентифицировать целевой объект или его часть на основе роли, которую они играли в предыдущих взаимодействиях, даже если объект больше не виден. При окклюзии система комбинирует информацию из истории событий с геометрией текущей сцены для выбора оптимальных точек обзора. Система использует предварительно обученные модели без дополнительного обучения на конкретную задачу и достигает высокой точности захвата как для видимых, так и для скрытых целей.'}, 'en': {'title': 'Grasping Beyond Sight: A Zero-Shot Approach to Object Interaction', 'desc': 'The paper introduces BeyondSCe, a robotic grasping system designed to understand and act on requests based on past interactions with objects. It allows the robot to identify and localize objects even when they are not visible, using event history and current scene information. The system employs zero-shot learning, utilizing pretrained models without needing additional training for specific tasks. In experiments, BeyondSCe demonstrated significantly higher grasp success rates compared to existing methods, especially in scenarios with occluded targets.'}, 'zh': {'title': '超越事件的智能抓取系统', 'desc': '本文介绍了一种名为BeyondSCe的机器人抓取系统，能够在观察人类与物体互动后，根据事件历史进行抓取请求。该系统可以在目标物体不可见的情况下，通过结合事件先验和当前场景几何信息来选择合适的摄像机视角。BeyondSCe使用预训练模型，无需额外的特定任务训练，展现出较高的抓取成功率。实验结果表明，该系统在可见和遮挡目标的抓取成功率上均显著优于传统基线。'}}}, {'id': 'https://huggingface.co/papers/2610.01939', 'title': 'Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success Rate but 65% Fewer Tokens', 'url': 'https://huggingface.co/papers/2610.01939', 'abstract': 'Abstract  Vision language model (VLM) agents can control robots through visual feedback and action primitives, but repeated model invocations and redundant observations incur substantial token overhead. We introduce PyRUA-Lean, an interactive code-execution framework that couples feedback-driven primitive composition with selective observation: the agent composes classical robot primitives and learned vision-language-action (VLA) policies into Python cells that perform conditional checks and local retries, returning only explicitly requested images and state feedback for replanning. Across 700 simulated task instances from LIBERO-PRO, RoboTwin 2.0, and RoboCasa365, we compare PyRUA-Lean with a tool-calling baseline using the same GPT-6 Astra planner and underlying robot primitives. Under equal LLM-call budgets, PyRUA-Lean increases overall success from 63.1% to 71.7%. On instances solved by both agents, it uses 49% fewer LLM calls and 65% fewer input tokens.', 'score': 34, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '187ff064c7e79ce4', 'authors': ['Ruiyang Si', 'Jianxin Bi', 'Shunyu Yang', 'Rui Ni', 'Wenbo Huang', 'Qiang Wang', 'Shulong Jiang', 'Duomin Wang', 'Xiuyu Li', 'Haiwen Feng', 'Zhen Dong', 'Daquan Zhou'], 'affiliations': ['Impossible Research', 'NVIDIA', 'National University of Singapore', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.01939.jpg', 'data': {'categories': ['#agents', '#inference', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Эффективное управление роботами через избирательное наблюдение и композицию примитивов', 'desc': 'В статье предлагается PyRUA-Lean — интерактивная платформа выполнения кода для управления роботами с использованием зрительно-языковых моделей. Агент комбинирует классические примитивы управления роботом с обученными политиками VLA, оформляя их в виде Python-ячеек с условными проверками и локальными повторами. Система сокращает накладные расходы на токены, возвращая только явно запрошенные изображения и информацию о состоянии для переплана. Экспериментально показано, что PyRUA-Lean достигает успешности 71.7% при том же бюджете вызовов LLM, используя на 49% меньше вызовов и на 65% меньше входных токенов по сравнению с baseline-методом на основе инструментов.'}, 'en': {'title': 'Efficient Robot Control with PyRUA-Lean: Less is More!', 'desc': 'This paper presents PyRUA-Lean, a new framework designed to enhance the efficiency of vision language model (VLM) agents in controlling robots. It combines feedback-driven primitive composition with selective observation, allowing the agent to execute robot actions more effectively by minimizing unnecessary data processing. By using Python cells for conditional checks and local retries, PyRUA-Lean reduces the number of large language model (LLM) calls and input tokens needed for task execution. The results show that PyRUA-Lean significantly improves task success rates while using fewer resources compared to traditional methods.'}, 'zh': {'title': '提升机器人控制效率的智能框架', 'desc': '本文介绍了一种名为PyRUA-Lean的交互式代码执行框架，旨在通过视觉反馈和动作原语控制机器人。该框架结合了反馈驱动的原语组合和选择性观察，能够有效减少模型调用和冗余观察带来的开销。通过在700个模拟任务实例上进行比较，PyRUA-Lean在相同的LLM调用预算下，成功率从63.1%提高到71.7%。此外，在两个代理都能解决的实例中，PyRUA-Lean减少了49%的LLM调用和65%的输入令牌。'}}}, {'id': 'https://huggingface.co/papers/2610.02201', 'title': 'SILSA: Sliding-Window Slice Latents for Topology-Preserving High-Resolution 3D Generation', 'url': 'https://huggingface.co/papers/2610.02201', 'abstract': 'Abstract  High-resolution 3D generation increasingly relies on voxel latents and multi-stage pipelines that first predict active structure and then synthesize local geometry. While effective, this design fragments continuous surfaces into many local tokens, inflates generation cost, and often weakens topological consistency for thin or highly connected shapes. We introduce SILSA, a topology-aware 3D generation framework that represents shapes with compact sliding-window slice latents. Instead of generating expensive voxel tokens, SILSA uses a fixed set of overlapping slices along the three canonical axes, where each token summarizes a local depth window to preserve cross-sectional continuity and support single-stage rectified-flow generation. A Slice VAE encodes oriented surface samples into multi-axis slice latents and reconstructs them with a sparse volumetric decoder, while a Volumetric Anchor Lattice coordinates directional slice streams through a shared 3D workspace. To preserve structural correctness, we introduce slice-level topology supervision that matches persistence diagrams and aligns Betti transitions across neighboring slices. Experiments show that SILSA improves structural fidelity while substantially reducing generation cost. SILSA improves PSNR by 8.7%, coverage by 5.96 absolute points, and Betti error by 9.2% over the strongest baseline, while using 70.0% fewer tokens than the next-most compact baseline and over 98% fewer tokens than sparse or hierarchical tokenizers, effectively reducing training memory by 40.4% and inference time by 58.5%. Qualitative results further show improved preservation of thin structures, repeated components, and long-range connectivity.', 'score': 27, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'c490c13d9b18333f', 'authors': ['Tianjiao Yu', 'Xinzhuo Li', 'Yifan Shen', 'Ying Shen', 'Kiet A. Nguyen', 'Adheesh Sunil Juvekar', 'Ismini Lourentzou'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02201.jpg', 'data': {'categories': ['#architecture', '#3d', '#inference', '#training'], 'emoji': '🧊', 'ru': {'title': 'Топологически осознанная 3D-генерация через срезовые латентные представления', 'desc': 'Авторы представляют SILSA — новый фреймворк для трёхмерной генерации, который использует компактные срезовые латентные переменные вместо дорогостоящих воксельных токенов. Метод представляет 3D-формы набором перекрывающихся срезов вдоль трёх канонических осей, каждый из которых кодирует локальное окно глубины для сохранения топологической согласованности. Система включает специальный Slice VAE и якорную решётку для координации потоков срезов в общем 3D-пространстве, а также использует топологический супервизор для согласования диаграмм персистентности между соседними слоями. Эксперименты показывают значительное улучшение качества генерации при одновременном снижении вычислительных затрат на 40-98% по сравнению с существующими методами.'}, 'en': {'title': 'SILSA: Efficient and Topology-Aware 3D Shape Generation', 'desc': 'The paper presents SILSA, a new framework for generating high-resolution 3D shapes that focuses on maintaining topological consistency. Unlike traditional methods that use voxel latents and multi-stage processes, SILSA employs compact sliding-window slice latents to represent shapes, which helps in preserving continuous surfaces. This approach reduces the number of tokens needed for generation, leading to lower computational costs and faster inference times. Additionally, SILSA incorporates slice-level topology supervision to ensure structural correctness, resulting in improved fidelity and coverage in the generated 3D models.'}, 'zh': {'title': 'SILSA：高效的拓扑感知3D生成框架', 'desc': '本论文介绍了一种名为SILSA的3D生成框架，旨在提高高分辨率3D形状生成的拓扑一致性。SILSA通过使用重叠的切片潜变量来表示形状，避免了传统方法中生成昂贵的体素标记，从而降低了生成成本。该框架采用切片变分自编码器（Slice VAE）和稀疏体积解码器，能够有效地编码和重建表面样本。实验结果表明，SILSA在结构保真度上有显著提升，同时减少了生成所需的标记数量，降低了训练内存和推理时间。'}}}, {'id': 'https://huggingface.co/papers/2610.02160', 'title': '4Director: Controlling Video World Models with Rigid 3D Geometry', 'url': 'https://huggingface.co/papers/2610.02160', 'abstract': 'Abstract  Precise control over camera and object motion is essential for professional video production. Existing methods control objects only coarsely, through image-plane cues that are ambiguous in depth and rotation or through 3D tracks and blobs that lack complete geometry and lose consistency across viewpoint changes. We introduce 4Director, a video world model conditioned on an explicit 4D scene representation: each object is reconstructed once from the input image as a canonical mesh and moved by one prescribed rigid transformation per frame. This representation provides an intuitive 3D control interface and prevents unobserved geometry from being regenerated independently in every frame. We render the controlled scene as a depth video and introduce a Motion Adapter that transforms this geometric scaffold into video while synthesizing view-consistent appearance, illumination, and non-rigid dynamics. For training, we construct RealCOD-Rigid, a new dataset of 20,774 clips annotated with rigid 3D scenes by our automatic pipeline. We further introduce Identity-Gated IoU (IG-IoU), which jointly evaluates adherence to prescribed object motion and preservation of object identity. Experiments demonstrate that 4Director consistently outperforms prior methods in visual quality and in camera and object control.', 'score': 27, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '164d578e4ca40a0c', 'authors': ['Wei Cao', 'Hao Zhang', 'Vikram Voleti', 'Yuqun Wu', 'Mallikarjun B R', 'Shimon Vainer', 'Mark Boss', 'Yaoyao Liu'], 'affiliations': ['Stability AI', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02160.jpg', 'data': {'categories': ['#video', '#3d', '#benchmark', '#dataset'], 'emoji': '🎬', 'ru': {'title': '4D сцены для прецизионного контроля видеопроизводства', 'desc': 'Авторы представляют 4Director — видео-модель мира, которая использует явное 4D представление сцены для точного контроля движения объектов и камеры. Каждый объект реконструируется один раз как каноническая мешь и трансформируется жёсткой трансформацией на каждом кадре, что обеспечивает интуитивный 3D интерфейс управления. Система использует Motion Adapter для преобразования геометрического каркаса в видео с синтезом согласованного внешнего вида, освещения и нежёстких деформаций. Для обучения создан новый датасет RealCOD-Rigid с 20,774 видеоклипами, аннотированными автоматическим способом, и предложена метрика IG-IoU для оценки точности контроля движения и сохранения идентичности объектов.'}, 'en': {'title': 'Revolutionizing Video Control with 4D Scene Representation', 'desc': 'The paper presents 4Director, a novel video world model that enhances control over camera and object motion in video production. It utilizes a 4D scene representation where each object is reconstructed into a canonical mesh, allowing for precise rigid transformations per frame. This approach addresses limitations of existing methods by providing a consistent geometric framework that avoids independent regeneration of unobserved geometry. The authors also introduce a new dataset and a unique evaluation metric, demonstrating that 4Director significantly improves visual quality and control compared to previous techniques.'}, 'zh': {'title': '4Director：精确控制视频中的相机与物体运动', 'desc': '本文介绍了一种名为4Director的视频世界模型，它基于明确的4D场景表示来实现对相机和物体运动的精确控制。通过将每个物体从输入图像重建为标准网格，并在每帧中施加一个刚性变换，4Director提供了直观的3D控制界面。该模型通过深度视频渲染受控场景，并引入运动适配器，将几何框架转化为视频，同时合成一致的外观、照明和非刚性动态。实验结果表明，4Director在视觉质量以及相机和物体控制方面均优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2610.02185', 'title': 'Decoding Looped Transformers Better for (Almost) Free', 'url': 'https://huggingface.co/papers/2610.02185', 'abstract': "Abstract  Looped Transformers achieve parameter efficiency by repeatedly executing a shared block across recurrent loops. Each loop yields an intermediate representation decodable for the same next token, yet standard decoding discards earlier states. Because earlier loops embody less computation, recurrence inherently supplies aligned weak-and-strong prediction pairs without auxiliary models or external training. We introduce LoopCD, a training-free contrastive decoding framework that guides token selection by contrasting the final prediction with an earlier recurrent pass, operating either in logit space with one extra output pass (LoopCD-Logits) or in hidden-state space with zero output overhead (LoopCD-Hidden). Across four looped Transformer families, LoopCD delivers substantial, consistent gains at full recurrent depth: LoopCD-Logits raises Ouro-2.6B-Thinking's AIME 2024 pass@1 from 61.88% to 73.33%, while LoopCD-Hidden lifts Huginn's HumanEval pass@1 from 22.56% to 31.71%. Crucially, these performance gains enable halving the number of recurrent loops while still matching or exceeding full-depth unguided baselines, reducing forward FLOPs by 22.5% to 48.2%. By transforming intermediate recurrent states into effective guidance signals, LoopCD achieves superior decoding quality while substantially reducing inference compute.", 'score': 25, 'issue_id': 3364, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd2e072cc693c3e48', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#reasoning', '#small_models', '#training', '#architecture', '#inference'], 'emoji': '🔄', 'ru': {'title': 'Эффективное декодирование циклических Трансформеров через контрастивное руководство промежуточными состояниями', 'desc': 'В работе представлен LoopCD — метод контрастивного декодирования без обучения для циклических Трансформеров, которые повышают эффективность параметров, многократно выполняя общий блок. Авторы используют предсказания из промежуточных циклов как слабые сигналы для направления выбора токенов путём контраста с финальным предсказанием в пространстве логитов или скрытых состояний. Метод продемонстрировал значительное улучшение качества: например, повышение AIME 2024 pass@1 с 61.88% до 73.33% и HumanEval pass@1 с 22.56% до 31.71%. Благодаря этому удалось сократить количество циклов вдвое, достигнув экономии в 22.5-48.2% операций умножения-добавления при сохранении или превышении исходного качества.'}, 'en': {'title': 'Efficient Decoding with LoopCD: Boosting Performance While Cutting Compute', 'desc': 'Looped Transformers improve efficiency by reusing a shared block in multiple loops to generate predictions. The paper introduces LoopCD, a method that enhances token selection by comparing the final prediction with earlier outputs without needing extra training. This approach can operate in two ways: one that adds a small output pass and another that uses existing hidden states without additional output. The results show significant improvements in performance while reducing the computational load during inference, allowing for fewer loops without sacrificing accuracy.'}, 'zh': {'title': 'LoopCD：提升解码质量的高效对比解码框架', 'desc': 'Looped Transformers通过在循环中重复执行共享模块来提高参数效率。每个循环生成一个中间表示，可以解码为下一个标记，但标准解码会丢弃早期状态。LoopCD是一种无训练的对比解码框架，通过对比最终预测与早期循环结果来指导标记选择，从而提高解码质量。该方法在多个循环Transformer模型中表现出显著的性能提升，同时减少了推理计算量。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2606.10953', 'title': 'Architect-Ant: Editable Automatic Furnishing of Architectural Floor Plans', 'url': 'https://huggingface.co/papers/2606.10953', 'abstract': 'Abstract An automated furniture arrangement system using a specialized dataset and vision-language model with procedural reasoning and preference optimization to generate valid and plausible room layouts.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Furnished floor plans support real-estate visualization, interior design, and architectural workflows, yet automatic furnishing remains challenged by limited real-world data and the need to satisfy interacting geometric and functional constraints. We ask whether professional furnishing knowledge can be learned from real floor plans using a pretrained model, enabling direct constraint-aware layout generation without relying on costly iterative agentic inference. We introduce AntPlan, a curated dataset of 505 real professional architectural floor plans with dense furniture annotations spanning 92 object classes and ten residential room categories, and Architect-Ant, a framework for generating furniture layouts. Architect-Ant represents layouts with an editable coordinate-based DSL and first learns professional furnishing patterns through supervised fine-tuning. It is then optimized with GRPO using a Layout Rule Score (LRS) that aggregates geometric and functional constraints derived from professional plans, providing outcome-level supervision without prescribed reasoning traces. Experiments against diverse state-of-the-art baselines show that Architect-Ant combines low geometric violation rates with high functional completeness, while qualitative results more closely reflect real-world residential furnishing patterns. The resulting layouts remain object-level editable and can be converted into 3D scenes.', 'score': 25, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'edc823bf82e46f68', 'authors': ['Fedor Rodionov', 'Aleksandar Cvejic', 'Michael Birsak', 'John Femiani', 'Peter Wonka'], 'affiliations': ['King Abdullah University of Science and Technology (KAUST), Saudi Arabia', 'Miami University, United States of America'], 'pdf_title_img': 'assets/pdf/title_img/2606.10953.jpg', 'data': {'categories': ['#cv', '#multimodal', '#dataset', '#training', '#3d'], 'emoji': '🛋️', 'ru': {'title': 'Обучение профессиональному дизайну интерьера через оптимизацию с учетом ограничений', 'desc': 'В статье представлена система автоматического расставления мебели AntPlan, которая использует специально собранный датасет из 505 профессиональных архитектурных планов с аннотациями 92 классов мебели. Авторы разработали фреймворк Architect-Ant, который представляет расстановку мебели в виде редактируемого языка специального назначения и обучается профессиональным принципам расставления через supervised fine-tuning. Модель затем оптимизируется с помощью GRPO алгоритма, используя метрику Layout Rule Score, которая агрегирует геометрические и функциональные ограничения без необходимости в дорогостоящих итеративных вычислениях. Экспериментальные результаты показывают, что система генерирует реалистичные расстановки мебели с низким уровнем геометрических нарушений и высокой функциональной полнотой.'}, 'en': {'title': 'Automating Furniture Layouts with Smart Learning', 'desc': 'This paper presents an automated system called Architect-Ant for generating furniture layouts using a specialized dataset and a vision-language model. The system learns from a curated dataset of 505 professional architectural floor plans, allowing it to understand and apply geometric and functional constraints in room arrangements. By employing supervised fine-tuning and optimization techniques, Architect-Ant generates layouts that are both valid and practical, reflecting real-world furnishing patterns. The results demonstrate a balance between low geometric violations and high functional completeness, making the generated layouts suitable for various applications in real estate and interior design.'}, 'zh': {'title': '智能家具布置，优化空间利用！', 'desc': '本文介绍了一种自动化家具布置系统，利用专门的数据集和视觉-语言模型，通过程序化推理和偏好优化生成有效且合理的房间布局。该系统名为AntPlan，包含505个真实的专业建筑平面图，并对92个物体类别和十种住宅房间类型进行了密集家具标注。Architect-Ant框架通过监督微调学习专业家具布置模式，并使用布局规则评分（LRS）进行优化，以满足几何和功能约束。实验结果表明，Architect-Ant在几何违规率低和功能完整性高方面表现优异，生成的布局能够进行对象级编辑，并可转换为3D场景。'}}}, {'id': 'https://huggingface.co/papers/2609.40097', 'title': 'AutoDataBench: A Data-centric Testbed for Accelerating Auto Research', 'url': 'https://huggingface.co/papers/2609.40097', 'abstract': "Abstract  Existing auto-research benchmarks often entangle multiple sources of improvement, including training frameworks, hyperparameters, compute budgets, and data, making it difficult to attribute why one frontier agent outperforms another to specific research capabilities. In this work, we isolate and systematically evaluate Data Intelligence: an agent's ability to understand, manipulate, and improve the data that shapes model capabilities. We introduce AutoDataBench, a controlled testbed built on a conceptual framework of data intelligence spanning data diagnosis, data organization, and data construction, instantiated through three highly curated optimization tasks while holding non-data factors fixed. Across tool use, retrieval, and knowledge injection, we evaluate frontier LLMs' ability to improve training data through iterative experimentation under task-specific resource budgets. Beyond optimization performance, we ask: do LLMs understand what their data interventions do? We compare predictions made before training with observed outcomes to seek evidence of data-effect reasoning beyond trial and error, and explore whether iterative feedback helps LLMs better understand how changes to training data affect model performance. Finally, we show that reusing AutoDataBench trajectories for mid-training improves downstream coding performance, highlighting its value in both evaluating data intelligence and generating high-quality training data. Code and resources are available at https://github.com/AutoDataBench/AutoDataBench.", 'score': 24, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '7f2b6b0d82728161', 'authors': ['Ruifeng Yuan', 'Yizhi Li', 'Yaxin Du', 'Fengyu Cai', 'Yiqi Liu', 'Hou Pong Chan', 'Chenghua Lin', 'Yun Chen', 'Jian Yang', 'Bryan Dai', 'Pinyan Lu', 'Chenghao Xiao'], 'affiliations': ['Beihang University', 'IQuest Research', 'Shanghai Jiaotong University', 'Shanghai University of Finance and Economics', 'TU Darmstadt', 'The Hong Kong Polytechnic University', 'The University of Manchester', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2609.40097.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#training', '#data', '#dataset', '#agents', '#synthetic', '#optimization'], 'emoji': '📊', 'ru': {'title': 'Понимание и оптимизация обучающих данных: измерение интеллекта данных в больших языковых моделях', 'desc': 'В работе представлен AutoDataBench — контролируемый стенд для оценки способности языковых моделей улучшать обучающие данные, охватывающий диагностику данных, их организацию и конструирование. Авторы систематически исследуют, могут ли LLM не только оптимизировать качество данных через итеративное экспериментирование, но и понимать причинно-следственные связи между изменениями в данных и производительностью модели. Бенчмарк позволяет изолировать способности, связанные с «интеллектом данных», от других факторов, влияющих на производительность агентов автоматического исследования. Показано, что траектории оптимизации из AutoDataBench можно переиспользовать для улучшения качества обучающих данных и повышения производительности на задачах кодирования.'}, 'en': {'title': 'Unlocking Model Potential Through Data Intelligence', 'desc': "This paper focuses on the concept of Data Intelligence, which refers to an agent's ability to understand and manipulate data to enhance model performance. The authors introduce AutoDataBench, a testbed designed to evaluate this capability by isolating data-related factors from other variables like training frameworks and hyperparameters. They conduct experiments with large language models (LLMs) to see how well these models can improve training data and whether they can reason about the effects of their data interventions. The findings suggest that LLMs can learn from iterative feedback, leading to better understanding and improved performance in downstream tasks."}, 'zh': {'title': '提升数据智能，优化模型性能', 'desc': '本研究聚焦于数据智能，即代理理解、操作和改善数据的能力。我们提出了AutoDataBench，这是一个控制测试平台，旨在系统评估数据智能的不同方面，包括数据诊断、数据组织和数据构建。通过在固定非数据因素的情况下进行优化任务，我们评估了前沿大型语言模型（LLMs）在特定资源预算下改善训练数据的能力。研究还探讨了LLMs是否理解其数据干预的效果，以及迭代反馈是否能帮助它们更好地理解数据变化对模型性能的影响。'}}}, {'id': 'https://huggingface.co/papers/2609.36820', 'title': 'CorrGRPO: Correlation-Normalized GRPO for Multi-Reward Learning', 'url': 'https://huggingface.co/papers/2609.36820', 'abstract': 'Abstract  Group Relative Policy Optimization (GRPO) is widely used to train reasoning language models, where it computes advantages by centering and normalizing rewards across rollouts of the same prompt. For multiple rewards, GRPO sums the reward components and normalizes the total reward by its within-group standard deviation. The corresponding variance equals the sum of all pairwise reward covariances. For a fixed centered reward, larger aggregate covariance produces smaller advantages, and vice versa, allowing update magnitudes to adapt to reward dependence. However, correlated rewards with large scales can dominate this normalization and suppress signals from smaller-scale rewards. We propose Correlation-Normalized GRPO (CorrGRPO), which normalizes pairwise covariances into Pearson correlation coefficients. CorrGRPO keeps the centered total reward unchanged while balancing the influence of differently scaled rewards on the correlation-based normalization. This allows advantage magnitudes to adapt to reward correlations without the normalization being dominated by large-scale reward components. We compare CorrGRPO with GRPO and other variants on code generation, tool calling, and agent security, using models ranging from 0.5B to 8B parameters. These tasks all involve multiple rewards that can improve together or present tradeoffs. Results show improvements across three domains, including code generation, tool calling, and agent security. Our code is available at https://github.com/HKUST-KnowComp/CorrGRPO.', 'score': 23, 'issue_id': 3363, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '2f8015ccfaccd274', 'authors': ['Wenbin Hu', 'Huihao Jing', 'Haochen Shi', 'Yuxuan Liu', 'Haoran Li', 'Yangqiu Song'], 'affiliations': ['Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.36820.jpg', 'data': {'categories': ['#agents', '#plp', '#rlhf', '#small_models'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка множественных целей: корреляционная нормализация в оптимизации политик', 'desc': 'В статье предложен улучшенный метод Group Relative Policy Optimization (GRPO) для обучения языковых моделей рассуждению с использованием нескольких целевых функций вознаграждения. Авторы выявили проблему стандартного GRPO: при нормализации суммарного вознаграждения по стандартному отклонению в группе, вознаграждения с большой амплитудой могут подавлять сигналы от меньших по масштабу компонентов. Предложенный метод CorrGRPO решает эту проблему путём нормализации попарных ковариаций в коэффициенты корреляции Пирсона, что уравнивает влияние вознаграждений разных масштабов на процесс оптимизации. Экспериментальные результаты на задачах генерации кода, работы с инструментами и безопасности агентов показывают улучшение производительности моделей от 0.5B до 8B параметров.'}, 'en': {'title': 'Balancing Reward Influence with CorrGRPO', 'desc': 'Group Relative Policy Optimization (GRPO) is a method used to train language models by adjusting rewards based on their average performance across similar tasks. However, when rewards are correlated and vary in scale, larger rewards can overshadow smaller ones, leading to ineffective learning signals. To address this, the paper introduces Correlation-Normalized GRPO (CorrGRPO), which uses Pearson correlation coefficients to normalize reward covariances, ensuring that all rewards contribute fairly to the learning process. The results demonstrate that CorrGRPO outperforms GRPO in tasks like code generation and agent security by effectively managing the influence of differently scaled rewards.'}, 'zh': {'title': '提升奖励相关性的策略优化方法', 'desc': '本文提出了一种新的策略优化方法，称为相关性归一化的群体相对策略优化（CorrGRPO）。该方法通过将奖励的成对协方差归一化为皮尔逊相关系数，来平衡不同规模奖励对归一化的影响。CorrGRPO保持中心化的总奖励不变，同时允许优势大小适应奖励之间的相关性。实验结果表明，CorrGRPO在代码生成、工具调用和代理安全等多个任务上均表现出显著的改进。'}}}, {'id': 'https://huggingface.co/papers/2609.40362', 'title': 'Multimodal Flow: Unified Flow Modeling of Language and Vision in Embedding Spaces', 'url': 'https://huggingface.co/papers/2609.40362', 'abstract': 'Abstract  We present Multimodal Flow, a fully continuous generative model of language and vision. Most unified multimodal models either model both language and quantized images as discrete tokens or combine discrete language prediction with continuous image generation. The former introduces a visual quantization bottleneck. The latter requires modality-dependent objectives and sampling procedures. Fully continuous modeling avoids these trade-offs and enables a shared generative process, but remains underexplored for multimodal pretraining. Multimodal Flow introduces a unified continuous architecture that integrates multimodal continuous representations with a shared chunk-causal flow backbone. It organizes text blocks and images as ordered continuous hyperchunks, preserving textual token order and visual spatial structure. The backbone learns a single vector field over these hyperchunks through Flow Matching. Joint attention enables cross-modal interaction, while modality-specific feed-forward networks process each modality. The model predicts multiple target chunks in parallel during training and generates hyperchunks sequentially at inference. We instantiate MF-1 and pretrain it on multimodal data. Across 0.6B, 1.2B, and 1.6B scales, continued pretraining consistently improves multimodal modeling. With only 150B pretraining tokens, MF-1 achieves an average score of 82.8 across GenEval and DPG-Bench and 75.3 across VQAv2, MMBench, and POPE, remaining competitive with unified models trained on substantially more data. Under matched data, optimization, and parameter budgets, Multimodal Flow further outperforms representative hybrid and discrete models. These results establish continuous chunk-based embedding flow modeling as a new fully continuous paradigm for unified multimodal modeling. The related code and model are publicly released at https://github.com/hustvl/Multimodal-Flow.', 'score': 23, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '584e0dce504656c3', 'authors': ['Hongyuan Tao', 'Xinggang Wang', 'Lianghui Zhu', 'Yongkang Li', 'Yunchao Wei', 'Bin Feng', 'Shaoyu Chen', 'Qian Zhang', 'Chang Huang', 'Kai Yu'], 'affiliations': ['Beijing Jiaotong University', 'Horizon Robotics', 'Huazhong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.40362.jpg', 'data': {'categories': ['#multimodal', '#training', '#diffusion', '#architecture', '#open_source'], 'emoji': '🌊', 'ru': {'title': 'Непрерывный поток: единая модель для текста и зрения без квантизации', 'desc': 'В статье представлена Multimodal Flow — полностью непрерывная генеративная модель для совместной обработки текста и изображений. Модель преодолевает ограничения существующих подходов, избегая квантизации визуальной информации и использования отдельных целевых функций для разных модальностей благодаря единому архитектурному решению. Основой служит Flow Matching — метод обучения векторного поля над структурированными блоками текста и изображений (hyperchunks), которые организованы с сохранением порядка токенов и пространственной структуры. Модель демонстрирует конкурентные результаты на бенчмарках VQAv2, MMBench и других при меньшем объёме предварительного обучения по сравнению с аналогичными системами.'}, 'en': {'title': 'Revolutionizing Multimodal Modeling with Continuous Flow', 'desc': 'The paper introduces Multimodal Flow, a novel generative model that seamlessly integrates language and vision in a continuous manner. Unlike traditional models that rely on discrete tokens or separate objectives for each modality, this approach utilizes a unified architecture that maintains the order of text and the spatial structure of images. By employing a shared chunk-causal flow backbone, the model learns to represent multimodal data as continuous hyperchunks, allowing for efficient cross-modal interactions. The results demonstrate that Multimodal Flow achieves competitive performance with fewer pretraining tokens compared to existing models, highlighting its potential as a new paradigm in multimodal modeling.'}, 'zh': {'title': '全连续多模态建模的新范式', 'desc': '本文提出了一种名为Multimodal Flow的全连续生成模型，旨在同时处理语言和视觉信息。与传统的多模态模型不同，该模型避免了视觉量化瓶颈，并通过共享的生成过程实现了语言和图像的连续建模。Multimodal Flow使用了一种统一的连续架构，将文本块和图像组织为有序的连续超块，并通过流匹配学习单一的向量场。实验结果表明，该模型在多模态建模上表现优异，超越了许多混合和离散模型。'}}}, {'id': 'https://huggingface.co/papers/2610.01092', 'title': 'Ego2Act: Evaluating Goal-Directed Manipulation in Egocentric Video Generation', 'url': 'https://huggingface.co/papers/2610.01092', 'abstract': "Abstract  Video generation models are increasingly being explored as world simulators for embodied planning and learning. To do so effectively, these models must not only generate visually appealing frames, but also predict how environments dynamically evolve when executing goal-directed actions. While evaluating these capabilities is crucial, existing benchmarks focus mainly on single short actions or step-by-step instructions. This leaves multi-step physical reasoning underexplored, especially in egocentric video generation that requires planning to simulate proper execution to accomplish high-level goals by carrying out multiple real-world manipulations. We introduce Ego2Act, a goal-directed benchmark featuring 2,640 videos from 110 real-world tasks across day-to-day settings, varying object clutter and multi-step complexity. Given an initial scene image and a high-level goal, Ego2Act evaluates whether video generation models can produce realistic egocentric videos of a hand manipulating objects to carry out the task. To support scalable evaluation, we also introduce Ego2ActJudge, a reference-free evaluation pipeline that achieves better task completion and physics plausibility evaluation alignment with human consensus compared to relevant baselines. Our findings reveal that models' generated simulations often skip or partially execute steps, leaving later steps missing dependent states, which leads to unfulfilled goal. Furthermore, models consistently fail at fine-grained physical dynamics, particularly during complex object manipulation and persistent world modeling. We hope Ego2Act provides a rigorous testbed for advancing video models toward physically plausible, goal-directed simulation.", 'score': 21, 'issue_id': 3366, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '01a0eeed2524b17f', 'authors': ['Patrick Amadeus Irawan', 'Iskandar Muda Rizky Parlambang', 'Rava Maulana', 'Qinrong Cui', 'Erland Hilman Fuadi', 'Zayd M. K. Zuhri', 'Nanda Ryaas Absar', 'Ahmed Elshabrawy', 'Wilfried Ariel Mulyawan', 'Shoubin Yu', 'Yue Zhang', 'Mohit Bansal', 'Alham Fikri Aji'], 'affiliations': ['Independent Researcher', 'Mohamed bin Zayed University of Artificial Intelligence', 'Nanyang Technological University', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2610.01092.jpg', 'data': {'categories': ['#robotics', '#video', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Видеомодели как симуляторы реального мира для целенаправленного робототехнического планирования', 'desc': 'В статье представлен новый бенчмарк Ego2Act для оценки видеогенеративных моделей, которые используются как симуляторы окружающего мира для планирования и обучения робота. Бенчмарк содержит 2640 видео из 110 реальных задач и требует генерировать реалистичные видео от первого лица, где рука манипулирует объектами для выполнения многошаговых целей. Авторы также предложили Ego2ActJudge — автоматический метод оценки без эталонных видео, который лучше согласуется с оценками людей при проверке корректности выполнения задач и физической правдоподобности. Исследование выявило, что современные видеомодели часто пропускают или неполностью выполняют промежуточные шаги, что приводит к невыполнению конечной цели и ошибкам в моделировании сложной физики взаимодействия с объектами.'}, 'en': {'title': 'Ego2Act: Advancing Video Generation for Goal-Directed Tasks', 'desc': 'This paper presents Ego2Act, a benchmark designed to evaluate video generation models in the context of goal-directed tasks. It focuses on the ability of these models to create realistic egocentric videos that depict a hand manipulating objects to achieve specific goals. The benchmark includes a diverse set of 2,640 videos from 110 real-world tasks, emphasizing multi-step physical reasoning and dynamic environment evolution. Additionally, the paper introduces Ego2ActJudge, a novel evaluation pipeline that aligns better with human judgment on task completion and physical plausibility, highlighting the current limitations of existing models in simulating complex actions.'}, 'zh': {'title': 'Ego2Act：推动视频生成模型向目标导向的物理模拟发展', 'desc': '本论文探讨了视频生成模型在执行目标导向任务时的应用，特别是在动态环境中进行物理推理的能力。我们提出了Ego2Act基准，包含2640个视频，涵盖110个日常任务，旨在评估模型生成真实的自我中心视频的能力。研究发现，现有模型在执行多步骤操作时常常跳过或部分执行步骤，导致目标未能实现。此外，模型在复杂物体操作和持久世界建模方面的物理动态表现也存在不足。'}}}, {'id': 'https://huggingface.co/papers/2610.02122', 'title': 'Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows', 'url': 'https://huggingface.co/papers/2610.02122', 'abstract': "Abstract  Real-world enterprise data science and analytics workflows require reasoning across dozens of tables, performing statistical analyses, and acting on the results. Established text-to-SQL benchmarks evaluate query generation alone, and audits have found their answer keys frequently wrong. Because real enterprise warehouses are too sensitive to release, these benchmarks are built on public datasets where a business event fits in a single table. We introduce Argo-Bench, an evaluation framework comprising 210 data science and analytics tasks. Drawing on public data, peer-reviewed industry literature, and regulatory filings, we simulate a food delivery platform in New York City at true scale, with 81 million orders in 2024, grounded economics, fraud patterns, and marketplace incentives. We export this world to an ERP warehouse of 235 tables and 7.5 billion rows, modeled on the Oracle E-Business Suite schema. The simulator's ground-truth state is withheld from the warehouse the agent sees, so tasks require reconstructing facts by navigating the warehouse before acting on them. Argo-Bench goes beyond text-to-SQL: the agent files actions such as banning fraudulent accounts, allocating courier incentive budgets, or issuing back pay, and the grader scores each by its consequences in the simulator. Every task has an executable reference solution that demonstrates solvability using only the warehouse. The strongest of 14 frontier and open-weight models scores 95 or higher on only 34.8% of tasks and averages 59.5 points. We hope Argo-Bench drives progress toward agents that understand, navigate, and act within real data environments.", 'score': 21, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'bcd85c09549e6008', 'authors': ['Gabriel Tomitsuka', 'Arman Raayatsanati', 'Emma Xing', 'Duke Gand', 'Joseph J Ma'], 'affiliations': ['TextQL'], 'pdf_title_img': 'assets/pdf/title_img/2610.02122.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#dataset', '#agents', '#survey'], 'emoji': '🏢', 'ru': {'title': 'От запросов к действиям: агенты, понимающие реальные хранилища данных', 'desc': 'Авторы представляют Argo-Bench, новый бенчмарк для оценки способности LLM-агентов работать с реальными корпоративными данными в хранилищах информации. В отличие от существующих text-to-SQL датасетов, которые оценивают только генерацию запросов и часто содержат ошибки в ответах, этот бенчмарк включает 210 задач по анализу данных, где агенты должны исследовать сложную схему из 235 таблиц и 7,5 миллиардов строк. Платформа базируется на реалистичной симуляции сервиса доставки еды в Нью-Йорке и требует от агентов не только составления запросов, но и выполнения действий, которые оцениваются по их последствиям в симуляторе. Результаты показывают, что даже самые продвинутые модели справляются с менее чем 35% задач на оценку 95+, что подчёркивает необходимость развития навыков работы с реальными корпоративными данными.'}, 'en': {'title': 'Argo-Bench: Advancing Data Science Agents in Complex Environments', 'desc': "This paper introduces Argo-Bench, a new evaluation framework designed for real-world data science and analytics tasks that involve complex reasoning across multiple tables. Unlike existing benchmarks that focus solely on query generation, Argo-Bench simulates a comprehensive food delivery platform with a vast dataset, allowing for the assessment of agents' abilities to navigate and act on data. The framework includes 210 tasks that require agents to reconstruct facts and make decisions based on the data warehouse, with performance evaluated based on the consequences of their actions. The results indicate that current models struggle with these tasks, highlighting the need for further advancements in agents that can effectively operate in complex data environments."}, 'zh': {'title': '推动智能体在真实数据环境中的进步', 'desc': '本文介绍了Argo-Bench，一个评估框架，旨在解决企业数据科学和分析工作流中的复杂任务。该框架包含210个任务，模拟了一个真实规模的食品配送平台，涉及81百万个订单和235个表格。与传统的文本到SQL基准不同，Argo-Bench要求智能体在执行操作之前，先在数据仓库中重建事实。通过这种方式，研究希望推动智能体在真实数据环境中理解、导航和行动的能力。'}}}, {'id': 'https://huggingface.co/papers/2610.00964', 'title': 'RPTune: Learned Context Curation for LLM Catalog Search', 'url': 'https://huggingface.co/papers/2610.00964', 'abstract': 'Abstract  For small merchant businesses (SMBs) whose catalogs fit within a long-context LLM, full-catalog prompting offers a compelling alternative to multi-stage retrieval designed primarily for large marketplaces with millions of items. However, fitting the full catalog into the context window does not ensure that the model can use it effectively, since LLMs do not exploit long contexts uniformly. We therefore study in-context catalog search through two complementary questions: (1) how to curate and present catalogs to the LLM, and (2) how to adapt the LLM for product selection on curated contexts.   We propose RPTune, an end-to-end framework that couples learned catalog curation with LLM post-training using automatically generated, catalog-grounded supervision. An encoder-reorganizer curator orders and prunes products guided by downstream LLM feedback, while the resulting curated catalogs in turn improve the effectiveness of LLM post-training with a context-relative reward. We evaluate RPTune on 7 real merchants spanning distinct retail verticals, using 100 complex conversational queries per merchant. RPTune consistently improves search accuracy across both proprietary and open-weight LLMs, with context curation yielding gains of up to 31.4 percentage points and post-training adding a further 10.3 points on average.', 'score': 20, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '9a2414c9ae500b44', 'authors': ['Chuxuan Hu', 'Hejie Cui', 'Norman Huang', 'Shubham Kumar Bharti', 'Wang-Chiew Tan', 'Sercan Ö. Arık'], 'affiliations': ['Google', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.00964.jpg', 'data': {'categories': ['#long_context', '#optimization'], 'emoji': '🛍️', 'ru': {'title': 'Умная организация каталогов для поиска товаров в LLM', 'desc': 'В статье предлагается RPTune — фреймворк для улучшения поиска товаров в каталогах малых бизнесов, когда весь каталог помещается в контекстное окно LLM. Авторы решают две взаимосвязанные задачи: оптимальное представление каталога моделе и адаптация LLM для эффективной работы с подготовленными данными. Система включает куратора-реорганизатора, который переупорядочивает и сокращает товары на основе обратной связи от LLM, а также дообучение модели с использованием автоматически сгенерированного надзора. Экспериментальные результаты на 7 реальных магазинах показывают значительное улучшение точности поиска, достигая прироста до 31.4 процентных пункта при кураторстве каталога и дополнительные 10.3 пункта после дообучения.'}, 'en': {'title': 'Enhancing SMB Product Search with RPTune: Smart Catalog Curation and LLM Adaptation', 'desc': "This paper introduces RPTune, a framework designed to enhance product search for small merchant businesses using long-context large language models (LLMs). It addresses the challenge of effectively utilizing full catalogs within the LLM's context window by focusing on how to curate and present these catalogs. The framework combines catalog curation with post-training of the LLM, utilizing feedback to optimize product selection. Evaluation shows that RPTune significantly improves search accuracy, demonstrating the benefits of context-aware catalog management and LLM adaptation."}, 'zh': {'title': '优化小型商家的产品搜索', 'desc': '这篇论文探讨了如何为小型商家（SMB）优化长上下文的语言模型（LLM）以进行产品搜索。研究提出了一种名为RPTune的框架，通过学习的目录策划和LLM后训练来提高搜索准确性。该框架使用编码器-重组器来整理和修剪产品，并根据LLM的反馈进行调整。实验结果表明，RPTune在多个零售领域的真实商家中显著提高了搜索准确率，最大提升可达31.4个百分点。'}}}, {'id': 'https://huggingface.co/papers/2610.02148', 'title': 'Omni-Embed-Mini: Binding Modalities Without Forgetting via Dense Distillation', 'url': 'https://huggingface.co/papers/2610.02148', 'abstract': "Abstract  Extending a text embedding model to new modalities typically degrades text retrieval quality, and existing omni-modal embedders compensate with multi-billion parameters. We present Omni-Embed-Mini, a 0.9B-parameter model that maps text, speech, audio, images, video, and visually-rich documents into a single shared cosine space without updating any text-side parameter. Our key insight is that the teacher signal requires no separate embedding model: each media sample is paired with a dense cascaded caption, and the teacher target is simply the frozen backbone's own embedding of that caption. Because teacher and student share the same backbone weights, they inhabit byte-identical geometry, and lightweight projectors plus phased LoRA adapters on the modality encoders suffice for alignment. Training combines a Matryoshka SigLIP contrastive loss with an online hybrid hard-negative miner whose negatives sharpen as the encoder improves. The recipe carries over to a 2.3B variant by swapping in a native vision-language backbone. Omni-Embed-Mini-0.9B keeps its text weights bit-identical to the backbone, so training cannot regress text retrieval (49.57 nDCG@10 on MTEB-v2 BEIR-8), while extending it to five additional modalities, and is ~2.7x to 9.5x smaller than every open omni embedder we compare against. The 2.3B variant is competitive with the closed gemini-embedding-2, edging ahead of it on the overall-modality average. Models, code, data and evaluation harness are on our project page: https://omniembed.cvmbzuai.com", 'score': 19, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '894541f69c65c6e5', 'pdf_title_img': 'assets/pdf/title_img/2610.02148.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#small_models', '#benchmark'], 'emoji': '🎭', 'ru': {'title': 'Сохранение качества текста при расширении на пять модальностей в компактной модели', 'desc': 'В статье представлена Omni-Embed-Mini — компактная модель с 0.9 млрд параметров для создания единого векторного пространства текста, речи, аудио, изображений, видео и документов. Ключевой инновацией является использование замороженного текстового кодировщика в качестве учителя, при этом каждый мультимодальный образец парируется с подробным каскадным описанием. Модель использует контрастное обучение с потерей Matryoshka SigLIP и гибридный жёсткий отрицательный майнер для улучшения качества выравнивания. Omni-Embed-Mini-0.9B сохраняет исходное качество текстового поиска (49.57 nDCG@10 на BEIR-8) при расширении поддержки на пять дополнительных модальностей и в 2.7-9.5 раза меньше аналогичных открытых моделей.'}, 'en': {'title': 'Efficient Multi-Modal Embedding with Omni-Embed-Mini', 'desc': "The paper introduces Omni-Embed-Mini, a compact 0.9 billion parameter model designed to integrate multiple modalities such as text, speech, audio, images, and video into a unified embedding space. It achieves this without altering the text parameters by using a unique teacher-student training approach, where the teacher signal is derived from the model's own embeddings of dense captions. The model employs a contrastive loss function and a hard-negative mining strategy to enhance the quality of the embeddings as training progresses. Notably, Omni-Embed-Mini maintains high text retrieval performance while being significantly smaller than existing omni-modal models, demonstrating its efficiency and effectiveness in multi-modal learning."}, 'zh': {'title': 'Omni-Embed-Mini：小巧而强大的全模态嵌入模型', 'desc': '本文提出了一种名为Omni-Embed-Mini的模型，它能够将文本、语音、音频、图像、视频和视觉丰富的文档映射到一个共享的余弦空间中，而无需更新文本部分的参数。该模型使用了0.9亿个参数，通过将每个媒体样本与密集的级联标题配对，利用冻结的主干网络的嵌入作为教师信号。训练过程中结合了Matryoshka SigLIP对比损失和在线混合硬负样本挖掘，确保了不同模态之间的对齐。Omni-Embed-Mini在保持文本检索质量的同时，扩展到五种额外的模态，并且比现有的开放式全模态嵌入器小约2.7到9.5倍。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.00559', 'title': 'PhysVista: Benchmarking Physical Intelligence in VLMs via a Perception-Reasoning-Assessment Loop', 'url': 'https://huggingface.co/papers/2610.00559', 'abstract': 'Abstract  Vision-Language Models (VLMs) have shown strong multimodal reasoning capabilities, yet whether they truly capture the physical consistency underlying real-world dynamics remains unclear. Existing benchmark paradigms often suffer from fragmented evaluation, focusing on isolated cognitive stages while overlooking the inherent synergy between perception, reasoning, and physical judgment. The lack of a holistic perspective limits the ability to diagnose whether VLMs can reliably evaluate the physical authenticity of emerging generative models. To address these issues, we introduce PhysVista, a benchmark designed to evaluate physical intelligence in VLMs through a closed cognitive loop framework inspired by the human seeing-reasoning-assessment process. PhysVista restores this loop by jointly evaluating physical state perception, physical dynamics reasoning, and physical plausibility assessment. It further distinguishes event-level reasoning and scale-level reasoning to enable fine-grained analysis of physical understanding. In addition, PhysVista incorporates both real-world and AI-generated videos, allowing evaluation across diverse domains and emerging generative scenarios. Extensive experiments across a diverse set of VLMs reveal substantial limitations in physical reasoning and plausibility assessment, highlighting a persistent gap between visual recognition and genuine physical understanding, and pointing toward more principled designs for physically grounded multi
