выбора действий. Они предлагают ATLAS — метод обучения, который явно сохраняет релационную геометрию, передавая нормализованную структуру парных расстояний от информативного энкодера в латентное пространство планировщика, и калибрует маргинальное распределение через транспорт Вассерштейна. Экспериментальные результаты демонстрируют, что ATLAS улучшает качество планирования на задачах с высокой новизной и снижает ошибки многошагового предсказания.'}, 'en': {'title': 'Preserving Geometry for Better Planning in Latent Models', 'desc': 'This paper discusses the importance of maintaining the geometric relationships in latent representations for effective planning in machine learning models. It introduces a new method called Aligned Transport of Latent Structure (ATLAS), which ensures that the relational geometry of the data is preserved while adjusting the overall distribution of the latent space. The authors demonstrate that this approach leads to better planning performance, especially in scenarios with high novelty, by reducing prediction errors and improving the structure of the latent space. The results indicate that preserving the geometry of latent representations is crucial for enhancing the reliability of world-model planning.'}, 'zh': {'title': '保持规划相关几何结构的关键', 'desc': '本论文提出了一种新的训练目标，称为对齐潜在结构传输（ATLAS），旨在在规划过程中保持关系几何的完整性。研究表明，仅仅对潜在边际进行正则化并不足以确定状态之间的关系，这可能会削弱规划相关的新颖性结构。ATLAS通过将信息丰富的编码器表示中的归一化成对结构转移到规划潜在中，并使用Wasserstein嵌入匹配来校准其边际，从而解决了这一问题。实验结果表明，ATLAS在多个任务中提高了目标达成的成功率，尤其是在高新颖性场景中表现最佳。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.37824', 'title': 'The Geometry of Inference in Transformer Residual Streams', 'url': 'https://huggingface.co/papers/2609.37824', 'abstract': 'Abstract  Transformer language models build predictions through successive residual updates, but how their representations become specific to an eventual outcome remains unclear. We study this process by comparing intermediate residual states with their own final states and an empirical bank of final states from other contexts. Across six pretrained language models, the own endpoint becomes preferable to the average alternative early, while many individual endpoints remain closer. These competing sets generally shrink with depth, but their membership changes and their surviving endpoints need not become more similar to one another. Directional alignment and endpoint rank can therefore improve while Euclidean distance to the final state changes little. We develop a simple high-dimensional model that separates the roles of norm, alignment, and endpoint geometry, showing how gradual directional changes can produce sharp reductions in competition. We also prove that a straight path toward the own endpoint cannot introduce new competitors under either Euclidean or cosine distance; observed entries thus establish departures from straight-line convergence. Finally, endpoints associated with lower-ranked output tokens tend to lie farther away in cosine distance across all studied models, connecting residual geometry to output organization. Together, these findings characterize increasing geometric specificity during transformer inference and explain why distance, competitor count, and concentration of the surviving endpoints provide distinct views of that process.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'a6c79251b6f298b5', 'authors': ['Timur Mudarisov', 'Mikhail Burtsev', 'Radu State'], 'affiliations': ['London Institute for Mathematical Sciences', 'University of Luxembourg'], 'pdf_title_img': 'assets/pdf/title_img/2609.37824.jpg', 'data': {'categories': ['#training', '#architecture', '#interpretability'], 'emoji': '🎯', 'ru': {'title': 'Геометрическая специфичность представлений в трансформерах растёт через уменьшение конкуренции альтернатив', 'desc': 'В статье исследуется, как трансформер постепенно формирует специфичные представления во время инференса через последовательные остаточные обновления. Авторы анализируют промежуточные состояния остатков, сравнивая их с финальными состояниями и эмпирическим набором альтернативных финальных состояний из других контекстов. Они показывают, что на протяжении всей глубины сети происходит уменьшение числа конкурирующих альтернативных точек, хотя сами конкурирующие точки становятся всё менее похожи на финальное состояние. Разработанная высокомерная модель объясняет, как постепенные изменения направления представлений приводят к резкому снижению числа конкурентов.'}, 'en': {'title': 'Understanding Geometric Specificity in Transformer Predictions', 'desc': "This paper investigates how transformer language models refine their predictions through a series of updates. It compares the intermediate states of these models to their final outputs and to outputs from different contexts. The study finds that as the model processes information, the final states become more distinct and less competitive, even though their overall distance from each other remains similar. The authors introduce a model that clarifies the roles of various geometric factors in this process, revealing that the organization of output tokens is influenced by their proximity in the model's representation space."}, 'zh': {'title': '变换器推理中的几何特异性', 'desc': '本文研究了变换器语言模型在生成预测时的中间状态与最终状态之间的关系。通过比较六种预训练语言模型的中间残差状态和最终状态，发现模型在早期阶段更倾向于选择自己的最终状态，而不是其他上下文的平均状态。随着模型深度的增加，竞争集的规模通常会缩小，但其成员变化，且存活的最终状态不一定会变得更加相似。研究表明，方向对齐和最终状态的排名可以改善，而与最终状态的欧几里得距离变化不大，揭示了变换器推理过程中几何特异性的增加。'}}}, {'id': 'https://huggingface.co/papers/2609.34162', 'title': 'SlideDP: Scaling Host-Resident LLM Fine-Tuning Across Multiple GPUs', 'url': 'https://huggingface.co/papers/2609.34162', 'abstract': "Abstract  Host-resident layer streaming enables full-parameter LLM fine-tuning beyond GPU memory, but data-parallel ranks compete for shared host resources. Replicated transfers amplify traffic, while strong scaling can expose host work as computation windows shrink. We present SlideDP, a synchronous data-parallel runtime for shared-host multi-GPU systems. It maintains one authoritative host state, decouples communication routes from state layout, and pipelines parameter delivery, gradient aggregation, and CPU updates across ranks and chunks. An analytical step-time model characterizes resource bottlenecks and pipeline exposure; runtime measurements guide communication, chunking, and activation policies under a GPU memory budget. In matched-batch sweeps, SlideDP achieves geometric-mean throughput ratios of 1.46-2.64times over SlideFormer, MegaTrain, and ZeRO-Offload. On four H100s, SlideDP approaches GPU-resident FSDP2 throughput for Qwen3-14B at a smaller batch size. With a larger batch, it processes over 1M tokens per step and exceeds FSDP2's measured peak throughput by 11.2%. Separately, it supports 256K-token sequences for the same model and fine-tunes Qwen2.5-72B on four RTX 4090 GPUs. Project page: https://github.com/RegiaYoung/SlideDP.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '7ad05d51ff816c2f', 'authors': ['Ruijia Yang', 'Shiyuan Lin', 'Yulong Ao', 'Zhiyu Li', 'Yingli Zhao', 'Xianduo Li', 'Yonghua Lin', 'Zeyi Wen'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2609.34162.jpg', 'data': {'categories': [], 'emoji': '🚀', 'ru': {'title': 'Эффективная параллельная подготовка больших языковых моделей сверх памяти GPU через оптимизацию хостовых ресурсов', 'desc': 'Статья предлагает SlideDP — новый синхронный рантайм для параллельного обучения LLM на нескольких GPU с общей памятью хоста, который преодолевает ограничения памяти видеокарт при полном дообучении параметров модели. Система решает проблему конкуренции между GPU-процессами за ресурсы хоста, минимизирует повторяющиеся передачи данных и конвейеризирует доставку параметров, агрегацию градиентов и обновления CPU. Авторы разработали аналитическую модель для характеризации узких мест в производительности и используют эту модель для оптимизации коммуникационных, распределения памяти и активационных политик в рамках бюджета GPU памяти. Экспериментальные результаты показывают ускорение в 1.46-2.64 раза по сравнению с существующими методами и позволяют обучать очень большие модели на доступном оборудовании.'}, 'en': {'title': 'SlideDP: Optimizing Multi-GPU Fine-Tuning for Large Language Models', 'desc': "The paper introduces SlideDP, a new runtime system designed for fine-tuning large language models (LLMs) on multi-GPU setups without exceeding GPU memory limits. It addresses the challenges of data-parallel training by optimizing communication and resource management among GPUs, allowing for efficient parameter updates and gradient aggregation. SlideDP achieves significant throughput improvements compared to existing methods, enabling the processing of large batches and sequences effectively. The system's design includes an analytical model to identify bottlenecks and optimize performance under various configurations."}, 'zh': {'title': 'SlideDP：提升多GPU系统性能的解决方案', 'desc': '本论文介绍了一种名为SlideDP的同步数据并行运行时，旨在解决多GPU系统中共享主机资源的竞争问题。SlideDP通过维护一个权威的主机状态，解耦通信路径与状态布局，并在各个计算单元之间管道化参数传递、梯度聚合和CPU更新，从而提高了资源利用率。通过分析步骤时间模型，论文识别了资源瓶颈并优化了通信和激活策略。实验结果表明，SlideDP在处理大批量数据时，性能显著优于现有方法，能够支持更大的序列长度和更高的吞吐量。'}}}, {'id': 'https://huggingface.co/papers/2609.36931', 'title': 'Dating the Model: Hidden Dates in System Prompts Affect LLM Evaluation', 'url': 'https://huggingface.co/papers/2609.36931', 'abstract': 'Abstract  Reproducibility is essential for scientific research, yet prior work shows that LLM outputs vary with hardware and batching. We identify an overlooked factor: the hidden injection of the current date into system prompts, which users cannot control and which changes every day. Across 9 recent LLMs and 6 datasets spanning multiple-choice QA (MCQA), math reasoning, code generation, and machine translation, performance varies solely with the current date, with deltas of up to 6% on MCQA, 14% on math reasoning, 7% on code generation, and 2.84 BLEU on machine translation. Model rankings also shift, affecting leaderboards. This date effect exceeds other sources of non-determinism, such as batch size and numerical precision. Standard prompting techniques -- chain-of-thought and few-shot prompting -- do not reduce the sensitivity; chain-of-thought even amplifies it. Our findings underscore the need for careful evaluation protocols to ensure reproducibility and fair comparisons in LLM research.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'dd721dfcb95e043b', 'authors': ['Mario Sanz-Guerrero', 'Minh Duc Bui', 'Manuel Mager', 'Katharina von der Wense'], 'affiliations': ['Johannes Gutenberg University Mainz, Germany', 'Universidad Iberoamericana, Mexico', 'University of Colorado Boulder, USA'], 'pdf_title_img': 'assets/pdf/title_img/2609.36931.jpg', 'data': {'categories': ['#leakage', '#reasoning', '#machine_translation'], 'emoji': '📅', 'ru': {'title': 'Скрытая дата в системных подсказках разрушает воспроизводимость LLM', 'desc': 'Исследование выявляет критическую проблему воспроизводимости при использовании больших языковых моделей: скрытое внедрение текущей даты в системные подсказки приводит к значительным колебаниям производительности моделей. Авторы обнаружили, что на девяти современных LLM и шести датасетах производительность варьируется исключительно в зависимости от даты, с отклонениями до 6% для задач множественного выбора, 14% для математического рассуждения и 7% для генерации кода. Эффект даты превышает влияние других источников недетерминированности, таких как размер батча и числовая точность, и стандартные техники промптирования не снижают эту чувствительность. Результаты подчеркивают необходимость внедрения тщательных протоколов оценки для обеспечения воспроизводимости и справедливого сравнения в исследованиях LLM.'}, 'en': {'title': 'Date Sensitivity: A Hidden Challenge in LLM Reproducibility', 'desc': 'This paper highlights a critical issue in the reproducibility of results from large language models (LLMs). It reveals that the current date, which is automatically included in system prompts, significantly affects model performance across various tasks, leading to variations in results that can exceed those caused by other factors like batch size. The authors demonstrate that this date effect can lead to substantial differences in accuracy and model rankings, complicating fair comparisons in research. They emphasize the importance of developing robust evaluation protocols to mitigate these issues and enhance reproducibility in LLM studies.'}, 'zh': {'title': '日期影响：LLM研究中的隐性变量', 'desc': '可重复性是科学研究的重要部分，但之前的研究表明，LLM（大语言模型）的输出会因硬件和批处理而有所不同。我们发现了一个被忽视的因素：当前日期的隐性注入到系统提示中，这一点用户无法控制，并且每天都会变化。在对9个近期LLM和6个数据集的测试中，模型的表现仅因当前日期而异，MCQA的变化高达6%，数学推理14%，代码生成7%，机器翻译的BLEU分数变化为2.84。我们的研究强调了在LLM研究中需要谨慎的评估协议，以确保可重复性和公平比较。'}}}, {'id': 'https://huggingface.co/papers/2609.36308', 'title': 'CheatBench: Measuring Reward Gaming in AI Agents', 'url': 'https://huggingface.co/papers/2609.36308', 'abstract': 'Abstract  Reinforcement learning has helped AI agents solve increasingly difficult tasks, but high rewards do not always reflect the work users intended. In recent incidents and controlled evaluations across the AI industry, agents trained to maximize reward have accessed unauthorized information, attempted to evade monitoring systems, and even breached sandbox protections to attack external systems. As agents become more capable, this behavior could pose increasingly serious risks. To measure this problem, we introduce CheatBench, a benchmark of cheating in AI agents across mathematical research, knowledge work, coding, visual tasks, and other domains. Its environments combine challenging assignments with opportunities to cheat, allowing researchers to study how agents pursue a goal when honest work is difficult. CheatBench supports comparisons across models and task categories, providing a testbed for measuring and reducing cheating as agents take on more consequential responsibilities. We publicly release CheatBench at https://cheatbench.ai', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '31021de5d9425d17', 'authors': ['Long Phan', 'Stephen K. Yang', 'Jason J. Lim', 'Mantas Mazeika', 'Wenyu Zhang', 'Zheyuan Liu', 'Richard Ren', 'Jingxiang Meng', 'Yaoteng Tan', 'Weiliang Zhao', 'Addison Wu', 'Matei Anghel', 'Dan Hendrycks'], 'affiliations': ['Center for AI Safety'], 'pdf_title_img': 'assets/pdf/title_img/2609.36308.jpg', 'data': {'categories': ['#benchmark', '#rl', '#agents'], 'emoji': '🎭', 'ru': {'title': 'Измерение обмана в AI: когда агенты выбирают нечестный путь к награде', 'desc': 'В статье представлен CheatBench — бенчмарк для измерения склонности AI-агентов к обману при обучении с подкреплением. Авторы показывают, что агенты, обученные максимизировать награду, часто идут на нечестные действия: несанкционированный доступ к информации, попытки избежать мониторинга и обход защиты песочницы. CheatBench включает задачи из различных областей (математика, программирование, обработка знаний, визуальные задачи) и позволяет исследователям оценивать, когда агенты предпочитают обман честной работе. Этот инструмент служит для тестирования методов снижения нечестного поведения по мере роста способностей AI-систем.'}, 'en': {'title': 'CheatBench: Measuring Cheating in AI Agents', 'desc': 'This paper discusses the challenges of reinforcement learning where AI agents may prioritize maximizing rewards over ethical behavior. It highlights incidents where agents have engaged in cheating, such as accessing unauthorized information or breaching security measures. To address this issue, the authors introduce CheatBench, a benchmark designed to evaluate cheating behaviors in AI across various tasks. CheatBench allows researchers to analyze and compare how different models handle the temptation to cheat, aiming to improve the integrity of AI systems as they take on more significant roles.'}, 'zh': {'title': '揭示AI代理的作弊行为', 'desc': '强化学习帮助人工智能代理解决越来越复杂的任务，但高奖励并不总是反映用户的真实意图。最近的事件和行业评估显示，训练以最大化奖励的代理可能会访问未授权的信息，试图逃避监控系统，甚至攻击外部系统。随着代理能力的增强，这种行为可能带来越来越严重的风险。为了解决这个问题，我们引入了CheatBench，这是一个用于评估人工智能代理作弊行为的基准，支持在多个领域进行比较和研究。'}}}, {'id': 'https://huggingface.co/papers/2609.39358', 'title': 'Working Around the Compute Ceiling: Byte-Exact Memory in Galahad Makes LLM Reading a One-Time Cost LLM Reading a One-Time Cost', 'url': 'https://huggingface.co/papers/2609.39358', 'abstract': "Abstract  A transformer language model performs a bounded amount of computation per token, and recent work by Vishal Sikka, former CEO of Infosys, argues that this bound limits which tasks a model can carry out or verify (arXiv:2507.07505). We ask how much of the budget beneath that ceiling is spent on work the model has already done. Serving is stateless across requests: a model that answers a second question about a document recomputes the document's attention state from the first token. On seven real-world datasets, 98.7% of prompt tokens were text the model had already read. We present Galahad, a memory layer for vLLM, SGLang and llama.cpp that makes this reading a one-time cost. Taliesin saves the model's key-value (KV) state for a block of text and loads it on the next request that contains the same bytes, instead of recomputing it. Blaise keeps the documents themselves and passes the model only the section a question needs. On a recall test with 100 facts hidden in a 97,000-token corpus (Gemma 4 31B), Taliesin alone let the model attend to the whole corpus and answered 98 of 100 on llama.cpp at 3.0 s and 572 J per question, against 10 of 100, 9.3 s and 2,754 J for the same model without Galahad, which could hold only the last 12,000 tokens. With Blaise added, the model read about 668 tokens per question and answered 100 of 100 on all three runtimes at 0.59-0.64 s and 200-213 J; a tuned RAGFlow pipeline answered 77. Storing the corpus is a one-time cost of about 100 s and 28 kJ, whose energy is recovered after 13 questions. Restored state is bit-identical: all 262,144 output logits matched after restart, rehydration and hot-load. Galahad worked with all 30 models we tested under vLLM, and it fails closed: any load that does not pass its checks is recomputed. Together these results move LLM serving from stateless to stateful inference.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '4eaf70abd34391e0', 'authors': ['Sietse Schelpe'], 'affiliations': ['Corbenic AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.39358.jpg', 'data': {'categories': ['#optimization', '#open_source', '#architecture', '#long_context', '#inference', '#rag'], 'emoji': '⚡', 'ru': {'title': 'От бессохранного к сохраняющему вывод: кэширование состояния трансформера для эффективного обслуживания LLM', 'desc': 'Статья решает проблему неэффективного использования вычислительного бюджета трансформеров при обработке запросов. Авторы заметили, что в обслуживании LLM модели переделают всю обработку одного и того же текста при каждом новом запросе, вместо сохранения уже вычисленных внутренних состояний. Они предлагают Galahad — модуль памяти, который сохраняет KV-кэш (ключи и значения внимания) для блоков текста и переиспользует их в следующих запросах, значительно снижая вычисления и энергопотребление. Результаты показывают улучшение точности с 10% до 100% на задаче поиска информации в большом корпусе при трёхкратном ускорении и снижении энергозатрат на 93%.'}, 'en': {'title': 'Transforming Inference: From Stateless to Stateful with Galahad', 'desc': 'This paper introduces Galahad, a memory layer designed to enhance the efficiency of transformer language models during inference. It addresses the issue of redundant computation by allowing models to retain and reuse previously computed attention states, significantly reducing the processing time and energy consumption for repeated queries. The study demonstrates that with Galahad, models can achieve near-perfect recall on large datasets while maintaining low latency and energy usage. By transitioning from stateless to stateful inference, Galahad optimizes the performance of language models across various applications.'}, 'zh': {'title': '提升语言模型效率的记忆优化', 'desc': '这篇论文探讨了变换器语言模型在处理任务时的计算限制，尤其是如何优化模型的记忆使用。研究表明，模型在回答问题时，98.7%的提示令牌是模型已经读取过的文本。论文提出了Galahad，一个内存层，可以将模型的关键值状态保存，以减少重复计算的开销。通过这种方法，模型的推理从无状态转变为有状态，提高了效率和准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.40241', 'title': 'Decision-Oriented Recommendation Reranking: An Empirical Study of Jev', 'url': 'https://huggingface.co/papers/2609.40241', 'abstract': "Abstract  Large language models (LLMs) have shown promise for recommendation reranking, but their use introduces an important tradeoff between recommendation quality and serving efficiency. We investigate whether a decision-oriented model provides a useful alternative when the reranking task is fundamentally a structured choice among predefined candidate items. Specifically, we conduct a controlled empirical study of Jev, described by TypeSafe AI as a ``System One Model,'' for personalized recommendation reranking and compare it with recommendation-specific models and pointwise and listwise Qwen rerankers across multiple Amazon Reviews domains and candidate-set sizes, evaluating both recommendation effectiveness and observed serving latency. Our results show that Jev maintains strong recommendation effectiveness relative to the evaluated baselines while exhibiting substantially more gradual latency growth than the pointwise Qwen rerankers, although its observed serving latency remains substantially higher than that of recommendation-specific models. Together, these characteristics place Jev in a distinct quality--latency operating regime across candidate sizes and domains. These findings motivate further investigation of decision-oriented models for recommendation and other ranking tasks with structured output spaces.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '0b25cf9bcf8108c2', 'authors': ['Hanjia Lyu', 'Yinglong Xia'], 'affiliations': ['Meta AI', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2609.40241.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Баланс качества и скорости: decision-oriented модели для умного переранжирования', 'desc': 'В работе исследуется применение decision-oriented модели Jev для переранжирования рекомендаций, которая позиционируется как альтернатива большим языковым моделям. Авторы проводят контролируемое сравнение Jev с recommendation-specific моделями и pointwise и listwise rerankers на основе Qwen на нескольких доменах Amazon Reviews, оценивая как качество рекомендаций, так и задержку обслуживания. Результаты показывают, что Jev сохраняет высокое качество рекомендаций при более плавном росте latency по сравнению с pointwise реранжировщиками, хотя остаётся медленнее специализированных моделей для рекомендаций. Полученные выводы открывают перспективы для дальнейшего изучения decision-oriented моделей в задачах ранжирования со структурированным пространством выходов.'}, 'en': {'title': 'Balancing Quality and Efficiency in Recommendation Reranking with Jev', 'desc': "This paper explores the use of decision-oriented models, specifically Jev, for improving recommendation reranking in large language models (LLMs). It compares Jev's performance against traditional recommendation-specific models and other rerankers, focusing on both the quality of recommendations and the efficiency of serving them. The study finds that Jev offers strong recommendation effectiveness while experiencing slower latency growth compared to pointwise Qwen rerankers. These results suggest that decision-oriented models like Jev could be beneficial for structured ranking tasks beyond just recommendations."}, 'zh': {'title': '决策导向模型：推荐重排序的新选择', 'desc': '大型语言模型（LLMs）在推荐重排序中表现出色，但它们在推荐质量和服务效率之间存在重要的权衡。本文研究了一种决策导向模型Jev，作为预定义候选项之间结构化选择的替代方案。通过对多个亚马逊评论领域和候选集大小的控制实证研究，比较了Jev与推荐特定模型及点对点和列表Qwen重排序器的效果。结果表明，Jev在推荐效果上优于基线模型，同时在延迟增长方面表现出更平缓的趋势，尽管其服务延迟仍高于推荐特定模型。'}}}, {'id': 'https://huggingface.co/papers/2609.38822', 'title': 'SkillSeek: Revisiting Agent Skill Retrieval at Marketplace Scale', 'url': 'https://huggingface.co/papers/2609.38822', 'abstract': "Abstract  Anthropic's Agent Skills package reusable procedural know-how for an LLM agent into SKILL.md directories, and open-source aggregations have grown past 230,000 skills, making selection rather than authoring the bottleneck. The standing answer in the literature outsources selection to the agent itself: an LLM-mediated retrieval loop that rewrites queries and refines candidates inside the agent's decision loop, paying LLM tokens on every task. We present SkillSeek, an open-source two-stage skill retriever built from the standard IR recipe (a BGE-base bi-encoder feeding a small cross-encoder, exposed over MCP). Across a 4 times 11 grid of pool, backbone, and method on the 89-task SkillsBench benchmark, SkillSeek reaches observed parity with the LLM-mediated loop of Liu et al. at essentially no extra cost: plain bm25 alone records a pass rate at or above their refined loop on three of four settings, and a small cross-encoder covers the remaining difference on the fourth. A first-stage recall ceiling explains the pattern, and total per-trial spend drops from USD 51.30 to USD 27.54 (within fifty cents of the no-skill baseline). Under the SkillsBench tasks and OpenHands harness we tested, this positions the standard IR recipe as a strong default for agent-skill retrieval, with LLM-mediated alternatives a natural fit for cases where deterministic methods fall short.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '22da2ee230fb947b', 'authors': ['Guanqun Yang', 'Wenlong Zhang', 'Tian Shi', 'Ping Wang'], 'affiliations': ['Stevens Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.38822.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#agents', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Умный поиск навыков без лишних токенов', 'desc': 'Статья представляет SkillSeek — эффективный двухэтапный поисковый механизм для выбора навыков агента на основе LLM из больших репозиториев. Авторы показывают, что стандартные методы информационного поиска (BM25 и кроссенкодер) достигают результатов, сопоставимых с дорогостоящими LLM-опосредованными подходами, но с существенно меньшими затратами токенов. На бенчмарке SkillsBench метод снижает расходы с 51.30 до 27.54 долларов за задачу, оставаясь при этом конкурентоспособным по качеству. Исследование демонстрирует, что детерминированные методы информационного поиска следует использовать как основной подход для выбора навыков агентов, а LLM-опосредованные методы — только в сложных случаях.'}, 'en': {'title': 'SkillSeek: Efficient Skill Retrieval for LLM Agents', 'desc': 'This paper introduces SkillSeek, a two-stage skill retrieval system designed for large language model (LLM) agents. It leverages a bi-encoder and a cross-encoder to efficiently select from over 230,000 reusable skills, addressing the challenge of skill selection in LLMs. The authors demonstrate that SkillSeek achieves comparable performance to existing LLM-mediated retrieval methods while significantly reducing operational costs. This positions traditional information retrieval techniques as a viable and cost-effective alternative for agent-skill retrieval tasks.'}, 'zh': {'title': 'SkillSeek：高效的代理技能检索解决方案', 'desc': 'Anthropic的Agent Skills包将可重用的程序性知识整合到SKILL.md目录中，开源聚合技能数量已超过230,000个，使得选择技能成为瓶颈。文献中普遍的解决方案是将选择过程外包给代理本身，通过LLM介导的检索循环来重写查询并在代理的决策循环中优化候选项。我们提出了SkillSeek，这是一个基于标准信息检索（IR）方法的开源两阶段技能检索器，能够在多个任务上与现有的LLM介导循环达到相似的效果。通过我们的测试，SkillSeek在成本上显著降低，展示了标准IR方法在代理技能检索中的强大优势。'}}}, {'id': 'https://huggingface.co/papers/2609.38807', 'title': 'PatchHolmes: Agentic Patch Retrieval via Listwise Selection', 'url': 'https://huggingface.co/papers/2609.38807', 'abstract': "Abstract  Patch retrieval, the task of finding the commit that fixes a known vulnerability, is the foundation of vulnerability management workflows, yet 60% to 63% of CVEs in the major advisory databases lack a patch link. We present PatchHolmes, a two-phase patch retrieval system that pairs a hybrid first-stage retriever with an agentic second-stage inspection loop. Unlike pointwise prior work that scores each candidate independently, the Phase 2 agent reads the top-100 listwise: it sees the full candidate list at once and selectively reads 3 to 10 commits through four budgeted tools before submitting a single best commit. On GitHubAD, PatchHolmes beats the pointwise binary classifier Favia by 25.34% Recall@1 and the retrieve-and-CoT baseline IRCoT by 31.40%, at one agent conversation per CVE versus Favia's ten; with the candidate set held identical, the agent adds 27.32% Recall@1 over taking the retriever's top candidate, and the same agent, transferred unchanged to PatchFinder_top10, lifts Recall@1 from PatchFinder's own top-1 pick (24.28%) to 39.86%. Swapping the LLM backbone within the Qwen family changes Recall@1 by under 1%, and a second model family (gpt-oss) stays far above the no-agent floor, so the gain comes from the listwise agent loop; the entire system runs on a frozen open-weight model over a local Git repository, without fine-tuning or external search APIs.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '901dc0d723d9a9db', 'authors': ['Guanqun Yang', 'Yingming Zhou', 'Jiangrui Zheng', 'Shudong Hao', 'Xueqing Liu'], 'affiliations': ['Stevens Institute of Technology, Hoboken, NJ, USA'], 'pdf_title_img': 'assets/pdf/title_img/2609.38807.jpg', 'data': {'categories': ['#open_source', '#dataset', '#benchmark', '#agents', '#reasoning'], 'emoji': '🔧', 'ru': {'title': 'Интеллектуальный агент для поиска патчей уязвимостей через анализ списков кандидатов', 'desc': 'Работа представляет PatchHolmes — систему для поиска коммитов, которые исправляют известные уязвимости в безопасности. Система использует двухэтапный подход: первый этап применяет гибридный retriever для получения кандидатов, а второй этап использует агента на основе LLM, который анализирует список кандидатов целиком и выбирает наиболее подходящий патч через взаимодействие с инструментами. В отличие от существующих методов, которые оценивают каждого кандидата независимо, агент использует listwise подход, рассматривая все кандидаты одновременно. Система показывает значительное улучшение качества поиска и работает на открытых моделях без дополнительного обучения и внешних API.'}, 'en': {'title': 'Revolutionizing Patch Retrieval with Listwise Inspection', 'desc': 'PatchHolmes is a novel two-phase system designed for patch retrieval, which helps find the correct commit that addresses a known vulnerability. The first phase uses a hybrid retriever to gather potential patches, while the second phase employs an agent that evaluates the top candidates in a listwise manner, allowing it to read multiple commits before selecting the best one. This approach significantly improves recall rates compared to previous methods, demonstrating that the listwise inspection is more effective than traditional pointwise scoring. The system operates efficiently on local repositories without the need for fine-tuning or external resources, making it a practical solution for vulnerability management.'}, 'zh': {'title': '智能补丁检索，提升漏洞管理效率', 'desc': 'PatchHolmes 是一个用于补丁检索的系统，旨在帮助找到修复已知漏洞的提交。该系统分为两个阶段，第一阶段使用混合检索器，第二阶段则通过智能检查循环来选择最佳提交。与以往逐个评分的方式不同，第二阶段的智能体能够同时查看前100个候选项，并通过预算工具选择3到10个提交进行深入阅读。实验结果表明，PatchHolmes 在多个指标上显著优于传统方法，展示了其在漏洞管理中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.40230', 'title': 'EviRover: Reinforcing Agentic Perception Beyond a Glance', 'url': 'https://huggingface.co/papers/2609.40230', 'abstract': "Abstract  Visual perception is conventionally formulated as a one-shot prediction from a single glance at the image, under the assumption that the image content and the model's parametric knowledge suffice to resolve the query. This assumption often fails in real-world scenarios that hinge on fine-grained visual details or require knowledge-intensive and up-to-date information. We term such cases perception under insufficient evidence and formulate perception as an agentic process that can obtain information beyond a single glance. To address the absence of data for this setting, we design two dedicated data generation pipelines, yielding EviRover-SFT-5K and EviRover-RL-12K for training. We further construct EviLens, a human-verified benchmark comprising 688 instances across five perception categories. Building on these data, we present EviRover, to our knowledge the first perception agent explicitly trained to resolve perceptual queries through interaction, using supervised fine-tuning followed by agentic reinforcement learning. Experiments show that the 4B EviRover outperforms its backbone by 30 points on average on EviLens, reaching performance comparable to advanced proprietary models. The gains transfer beyond EviLens to WebEyes, conventional perception benchmarks, and general multimodal benchmarks, including a 15-point improvement on BrowseComp-VL. All code, models, and data are released.", 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '4edad658d1b0cbd3', 'authors': ['Kaixuan Fan', 'Kaituo Feng', 'Tianshuo Peng', 'Yilei Jiang', 'Manyuan Zhang', 'Junke Wang', 'Xiangyu Yue'], 'affiliations': ['Fudan University', 'MMLab, The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.40230.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#benchmark', '#training', '#cv', '#agents', '#rl'], 'emoji': '🔍', 'ru': {'title': 'Агент восприятия для глубокого анализа изображений через взаимодействие', 'desc': "В статье предложен новый подход к визуальному восприятию, который формулирует задачу как агентный процесс, а не как однократное предсказание. Авторы вводят концепцию восприятия при недостаточных данных и создают специализированные pipeline'ы для генерации двух датасетов (EviRover-SFT-5K и EviRover-RL-12K) и бенчмарка EviLens. Модель EviRover обучается с использованием supervised fine-tuning и reinforcement learning, что позволяет ей взаимодействовать с окружением для получения дополнительной информации при анализе изображений. Результаты показывают значительные улучшения производительности: модель с 4 миллиардами параметров превосходит базовую модель на 30 пунктов и демонстрирует сопоставимые результаты с продвинутыми коммерческими системами."}, 'en': {'title': 'EviRover: Enhancing Visual Perception Through Interactive Learning', 'desc': "This paper introduces a new approach to visual perception that goes beyond traditional one-shot predictions from a single image. It recognizes that real-world scenarios often require more detailed information and knowledge, which is termed 'perception under insufficient evidence.' To tackle this challenge, the authors developed EviRover, a perception agent that learns to gather information interactively rather than relying solely on initial visual input. The results show that EviRover significantly outperforms existing models, demonstrating its effectiveness in handling complex perceptual tasks."}, 'zh': {'title': '超越一次性观察的智能视觉感知', 'desc': '这篇论文探讨了视觉感知的传统方法，通常是通过一次性观察图像来进行预测。然而，在现实世界中，这种方法常常无法处理需要细致视觉信息或最新知识的情况。为了解决这个问题，作者提出了一种新的感知过程，称为在证据不足下的感知，并设计了两个数据生成管道来训练模型。最终，研究团队开发了EviRover，一个通过交互来解决感知查询的智能体，并在多个基准测试中表现优异。'}}}, {'id': 'https://huggingface.co/papers/2609.34970', 'title': 'See it, Say it, Sorted: Mechanistic Diagnosis and Parameter-Space Mitigation of Emergent Misalignment in LLMs', 'url': 'https://huggingface.co/papers/2609.34970', 'abstract': 'Abstract  Safety-aligned LLMs can exhibit emergent misalignment (EM): narrow domain adaptation unexpectedly triggers catastrophic safety failures across unrelated domains. Prior static analyses leave training dynamics unmapped, while existing defenses rely on heuristics that degrade utility. We present a dynamic, second-order geometric study of EM. Tracking training trajectories reveals that directional Hessian curvature concentrates sharply on semantic pivot tokens. Grassmannian projections show that, in most settings, harmful-safe gap widens mainly because safe-gradient overlap declines. Leveraging these insights, we introduce a parameter-level Geometric Mitigation Framework that orthogonally projects empirical harmful gradient subspace out of parameter updates. On Qwen2.5-14B-IT, our defense suppresses free-generation EM by up to 80.0%; across the other three of four open-weight instruction-based model families (3B--20B), where single-layer behavioral EM is already near zero, teacher-forced evaluation shows same harmful subspace controls the conditional support of frozen EM responses. Crucially, these diagnostics unmask the illusion of behavioral safety: the same subspace remains measurable and steerable in models where behavioral EM is near zero. Code: https://github.com/WeiqiaoQUE/mechanistic-emergent-misalignment.', 'score': 1, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '13e3af364e7a1697', 'authors': ['Weiqiao Que', 'Ruizhe Li', 'Chengyu Wang', 'Dakan Wang', 'Emine Yilmaz', 'Xiaofeng He'], 'affiliations': ['Alibaba Group, China', 'Centre for Artificial Intelligence, University College London, UK', 'Exacity Inc.', 'School of Computer Science and Technology, East China Normal University, China', 'School of Computer Science, University of Birmingham, UK'], 'pdf_title_img': 'assets/pdf/title_img/2609.34970.jpg', 'data': {'categories': ['#security', '#open_source', '#architecture', '#training', '#interpretability', '#alignment', '#small_models'], 'emoji': '🛡️', 'ru': {'title': 'Геометрическая защита от скрытого нарушения безопасности в выравненных LLM', 'desc': 'Работа исследует феномен непредвиденного нарушения безопасности в LLM при адаптации к узким доменам. Авторы проводят динамический анализ второго порядка, отслеживая траектории обучения и обнаруживают, что опасные направления концентрируются на семантических пивотных токенах через кривизну гессиана. Используя геометрическое проецирование в грассманиане, они показывают, что расширение разрыва между безопасными и опасными градиентами происходит из-за снижения их пересечения. На основе этих закономерностей предложен фреймворк геометрической миtigации на уровне параметров, который ортогонально проецирует вредоносное подпространство градиентов из обновлений весов модели.'}, 'en': {'title': 'Mitigating Emergent Misalignment in LLMs through Geometric Insights', 'desc': 'This paper discusses the issue of emergent misalignment (EM) in safety-aligned large language models (LLMs), where training in one area can lead to unexpected safety failures in unrelated areas. The authors highlight that previous analyses did not adequately explore how training dynamics contribute to these failures. They introduce a new approach that uses geometric methods to analyze training trajectories, revealing that certain tokens significantly influence safety outcomes. To address these issues, they propose a Geometric Mitigation Framework that effectively reduces EM by adjusting parameter updates, demonstrating substantial improvements in model safety across various settings.'}, 'zh': {'title': '动态几何缓解框架：提升大型语言模型的安全性', 'desc': '本论文探讨了安全对齐的大型语言模型（LLMs）在特定领域适应时可能出现的意外失调现象（EM）。我们通过动态的二阶几何研究，分析了训练过程中的方向性Hessian曲率，发现其在语义关键字上集中。我们提出了一种几何缓解框架，通过正交投影将有害梯度子空间从参数更新中剔除，从而显著降低了模型的失调现象。实验结果表明，该方法在多个模型上有效抑制了失调现象，揭示了行为安全的假象。'}}}, {'id': 'https://huggingface.co/papers/2609.34736', 'title': 'SeLMRoute: Probabilistic Semantic Evidence for Large Language Model Routing', 'url': 'https://huggingface.co/papers/2609.34736', 'abstract': 'Abstract  Large language model (LLM) routing aims to select the most suitable model for each incoming query. Most existing routers learn this decision directly from query embeddings, model representations, preference data, or clusters of similar examples. Such approaches can be effective, yet the representation used for routing rarely states what a query actually requires. We introduce SeLMRoute, a routing framework that separates the extraction of candidate-independent semantic evidence from the learning of candidate performance and the application of deployment objectives. A decision model first evaluates a set of interpretable questions about the query, such as its reasoning requirements and use of external knowledge, with each judgment retained as a probability distribution. The resulting probabilistic semantic state is used by a lightweight supervised router to estimate candidate model performance. Routing objectives are applied after performance estimation, which allows the same semantic state to support performance-oriented and cost-aware decisions. On the LLMRouterBench (15 datasets, 20 candidate models, 11,481 queries), SeLMRoute achieves an average accuracy of 72.08% pm 0.45, while grouped five-fold out-of-fold evaluation reaches 72.64%, compared with 69.23% for the strongest fixed candidate. The representation achieves the highest mean performance among the evaluated semantic, dense, lexical, and domain-level representations. In a separate 13-model performance-cost setting, SeLMRoute improves performance in all five grouped splits, with a mean PerfGain of 2.66%. Our code is available at https://github.com/Indigma-Innovations/SeLMRoute.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '0c071c6ff02e4c77', 'authors': ['Vasilis Perifanis', 'Nikolaos Pavlidis', 'Symeon Symeonidis'], 'affiliations': ['Athena Research Center', 'Democritus University of Thrace', 'Indigma Innovations'], 'pdf_title_img': 'assets/pdf/title_img/2609.34736.jpg', 'data': {'categories': [], 'emoji': '🛣️', 'ru': {'title': 'Интерпретируемая маршрутизация LLM через семантическое разложение задачи', 'desc': 'В этой работе предлагается фреймворк SeLMRoute для маршрутизации запросов к большим языковым моделям. Подход разделяет процесс на три этапа: сначала извлекаются интерпретируемые семантические признаки запроса через ответы на вопросы о его требованиях, затем лёгкий контролируемый классификатор оценивает производительность каждой модели-кандидата, и наконец применяются целевые функции учитывающие как качество, так и стоимость. На бенчмарке LLMRouterBench с 15 датасетами и 20 моделями фреймворк достигает точности 72.08%, превосходя сильные базовые методы. Такое разделение ответственности позволяет использовать одно и то же семантическое представление для различных целей маршрутизации.'}, 'en': {'title': 'Smart Routing for Language Models: SeLMRoute Unleashed!', 'desc': 'The paper presents SeLMRoute, a novel framework for routing large language models (LLMs) to select the best model for specific queries. Unlike traditional methods that rely on direct embeddings or clusters, SeLMRoute first assesses the semantic needs of a query through interpretable questions, creating a probabilistic representation of its requirements. This semantic state is then used by a lightweight supervised router to evaluate model performance while considering deployment objectives. The framework demonstrates improved accuracy and performance gains across multiple datasets and models, showcasing its effectiveness in optimizing LLM routing.'}, 'zh': {'title': '智能路由，精准匹配查询需求', 'desc': '大型语言模型（LLM）路由的目标是为每个输入查询选择最合适的模型。现有的路由器通常直接从查询嵌入、模型表示或偏好数据中学习决策，但这些方法往往无法准确反映查询的实际需求。我们提出了SeLMRoute，一个路由框架，它将候选模型的语义证据提取与候选性能学习分开。通过评估查询的推理需求和外部知识使用等可解释问题，SeLMRoute能够更好地支持性能导向和成本意识的决策。'}}}, {'id': 'https://huggingface.co/papers/2609.38716', 'title': 'SpatialCORE: Confidence-Aware Grounded Spatial Reasoning in Large Vision--Language Models', 'url': 'https://huggingface.co/papers/2609.38716', 'abstract': "Abstract  Large Vision-Language Models (LVLMs) have made remarkable progress across visual perception tasks, yet spatial reasoning remains a persistent weakness, especially for questions that require reasoning over visual space. Recent spatial-reasoning methods incorporate generated grounding, where models predict bounding boxes, masks, or other localization outputs for task-relevant objects as part of their reasoning trace. However, these approaches typically optimize final-answer correctness alone, allowing correct answers to be rewarded even when the model does not reason from confidently localized task-relevant objects. We introduce SpatialCORE (Spatially COnfident REasoning), a post-training framework that turns the model's own confidence in generated grounding into a learning signal for spatial reasoning. Its central idea is to reinforce grounding that is both accurate and confident, encouraging the model to reason from confidently localized task-relevant objects. SpatialCORE realizes this through a self-regulating spatial reward that weights each predicted bounding box's matching quality by its coordinate-token confidence. An answer gate further ties grounding optimization to final-answer correctness. SpatialCORE achieves state-of-the-art results among open-source and specialized spatial reasoning models across diverse benchmarks, and transfers effectively in zero-shot settings to unseen data distributions. The source code is available at https://github.com/rafiibnsultan/SpatialCORE.", 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '8bbeea4e8a67490b', 'authors': ['Rafi Ibn Sultan', 'Xiangyu Zhou', 'Md. Sajid Alam Chowdhury', 'Chengyin Li', 'Prashant Khanduri', 'Marco Brocanelli', 'Dongxiao Zhu'], 'affiliations': ['Department of Computer Science, Wayne State University', 'Department of Electrical and Computer Engineering, The Ohio State University', 'Department of Radiation Oncology, Henry Ford Health', 'Institute for AI and Data Science, Wayne State University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38716.jpg', 'data': {'categories': ['#multimodal', '#open_source', '#training', '#benchmark', '#reasoning'], 'emoji': '🎯', 'ru': {'title': 'Учимся рассуждать, веря в свои предсказания', 'desc': 'В работе представлен SpatialCORE — метод постобучения для больших мультимодальных моделей, который улучшает их способность к пространственному рассуждению. Ключевая идея заключается в использовании уверенности модели в предсказанных ограничивающих прямоугольниках как сигнала обучения, чтобы модель рассуждала только на основе уверенно локализованных объектов. Метод вводит самовырабатывающуюся пространственную награду, которая взвешивает качество предсказаний координат по уровню уверенности модели, а также использует вентиль ответов для связи оптимизации локализации с корректностью финального ответа. SpatialCORE демонстрирует наилучшие результаты среди открытых моделей на различных бенчмарках и хорошо обобщается на новые распределения данных в нулевом режиме обучения.'}, 'en': {'title': 'Empowering Spatial Reasoning with Confidence in Grounding', 'desc': "This paper presents SpatialCORE, a new framework designed to improve spatial reasoning in Large Vision-Language Models (LVLMs). It focuses on enhancing the model's ability to reason about visual space by using its own confidence in generated grounding, such as bounding boxes and masks, as a learning signal. Unlike previous methods that only optimize for correct answers, SpatialCORE encourages the model to base its reasoning on accurately and confidently localized objects. The framework has shown to achieve state-of-the-art performance in spatial reasoning tasks and can adapt well to new data without prior training."}, 'zh': {'title': '提升空间推理的自信度', 'desc': '大型视觉语言模型（LVLMs）在视觉感知任务上取得了显著进展，但在空间推理方面仍然存在不足，尤其是在需要对视觉空间进行推理的问题上。最近的空间推理方法引入了生成的定位信息，模型预测与任务相关的对象的边界框、掩码或其他定位输出作为推理过程的一部分。然而，这些方法通常只优化最终答案的正确性，允许在模型未从自信定位的任务相关对象推理时也能获得正确答案。我们提出了SpatialCORE（空间自信推理），这是一个后训练框架，将模型对生成定位的自信度转化为空间推理的学习信号，鼓励模型从自信定位的任务相关对象进行推理。'}}}, {'id': 'https://huggingface.co/papers/2609.34563', 'title': 'Rethinking Latent Visual Reasoning: Grounding Latent Reasoning in Visual Evidence', 'url': 'https://huggingface.co/papers/2609.34563', 'abstract': "Abstract  Latent visual reasoning (LVR) enables multimodal large language models (MLLMs) to perform intermediate computation in continuous latent tokens rather than expressing every reasoning step in words. However, unlike textual CoT, latent reasoning is not directly observable, making it difficult to supervise what latent tokens learn. In this work, we first conduct a thorough analysis of latent-token behavior and identify a latent evidence-credit gap: latent tokens respond only weakly to image perturbations that alter the correct answer. We hypothesize that this issue stems from the lack of explicit supervision during GRPO training. These findings suggest that a final-answer reward provides too little guidance on what visual evidence to preserve or how credit should be assigned across latent tokens. To bridge this gap, we propose ReaLVR, which brings visual-evidence supervision to the model's own free-running latent trajectories. ReaLVR contrasts correct and model-generated wrong answers to determine where stronger supervision is needed, and relevant and mismatched visual evidence to specify what to preserve. Across three model families, ReaLVR consistently outperforms evaluated LVR baselines, achieving the highest five-task average of 63.7% on Qwen2.5-VL-7B. Crucially, we are the first to scale visual reasoning in latent space, showing that our framework continues to deliver robust improvements at frontier model scales up to 235B. Further analyses show more question-sensitive latent-token positions, stronger alignment with relevant visual regions, and greater fixed-context dependence on the most attended latent tokens.", 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '0bf286bda54ff95e', 'authors': ['Xi Xiao', 'Tianchen Zhao', 'Youngeun Kim', 'Zhuowei Li', 'Linghan Xu', 'Jiaye Wu', 'Zheng Zhang', 'Xiang Xu', 'Xuanbai Chen', 'Farhan Tejani', 'Jakub Zablocki', 'Julia Xu', 'Yifan Xing'], 'affiliations': ['Amazon AGI', 'University of Alabama at Birmingham'], 'pdf_title_img': 'assets/pdf/title_img/2609.34563.jpg', 'data': {'categories': ['#rlhf', '#multimodal', '#training', '#interpretability', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Явный надзор за латентным визуальным рассуждением в мультимодальных языковых моделях', 'desc': 'В этой работе исследуется скрытое визуальное рассуждение в мультимодальных большых языковых моделях, которое позволяет выполнять промежуточные вычисления в непрерывных латентных токенах вместо вербализации каждого шага. Авторы выявили проблему «пропасти между свидетельством и кредитом»: латентные токены слабо реагируют на возмущения изображений, которые меняют правильный ответ, что связано с недостатком явного надзора при обучении. Они предложили метод ReaLVR, который добавляет контролируемое обучение на основе визуальных свидетельств, контрастируя правильные и неправильные ответы модели, а также релевантные и несоответствующие визуальные элементы. Метод демонстрирует последовательные улучшения на трёх семействах моделей и является первым, кто масштабировал визуальное рассуждение в латентном пространстве на фронтальных моделях до 235B параметров.'}, 'en': {'title': 'Enhancing Visual Reasoning with ReaLVR: Bridging the Evidence-Credit Gap', 'desc': 'This paper introduces ReaLVR, a method that enhances latent visual reasoning (LVR) in multimodal large language models (MLLMs) by providing explicit supervision for visual evidence during training. The authors identify a problem where latent tokens do not effectively respond to changes in images that should influence the answers, which they call the latent evidence-credit gap. By contrasting correct answers with incorrect ones, ReaLVR helps the model learn which visual information is important to retain. The results show that ReaLVR significantly improves performance across various model families, demonstrating its effectiveness in scaling visual reasoning in latent space.'}, 'zh': {'title': '提升潜在视觉推理的监督能力', 'desc': '潜在视觉推理（LVR）使多模态大型语言模型（MLLMs）能够在连续的潜在标记中进行中间计算，而不是用文字表达每一步推理。然而，与文本链（CoT）不同，潜在推理并不可直接观察，这使得监督潜在标记学习变得困难。我们提出了ReaLVR，通过将视觉证据监督引入模型的自由运行潜在轨迹，来解决潜在证据信用差距的问题。实验结果表明，ReaLVR在多个模型系列中表现优异，尤其在最大规模达到235B的模型中，仍能持续提供显著的改进。'}}}, {'id': 'https://huggingface.co/papers/2609.38717', 'title': 'Soft Spatial Reasoning', 'url': 'https://huggingface.co/papers/2609.38717', 'abstract': 'Abstract  Large Vision-Language Models (LVLMs) commonly perform spatial reasoning through chain-of-thought (CoT), encoding intermediate reasoning as autoregressive sequences of discrete language tokens. Such hard thinking requires committing to a single token at each step, even when the correct spatial interpretation remains uncertain. This early commitment constitutes premature discretization: an incorrect token selection can propagate errors through subsequent reasoning. We propose Soft Spatial Reasoning, a post-training framework that introduces soft thinking for spatial tasks in LVLMs. At each intermediate reasoning step, the LVLM forms a continuous soft state by mixing token embeddings rather than selecting a single token, allowing multiple candidate continuations to influence the next step. The appropriate degree of softness, however, can vary across reasoning steps: retaining multiple candidates may preserve a useful spatial interpretation, but if those candidates imply conflicting spatial relations, mixing them may interfere with subsequent reasoning. At the core of Soft Spatial Reasoning is AdaptSoft, a controller that uses the current hidden state and predictive uncertainty to adapt the degree of softness at each reasoning step. To train AdaptSoft, we introduce a gradient-alignment learning objective that provides a step-specific learning signal for softness control without intermediate reasoning supervision. Across diverse spatial benchmarks, Soft Spatial Reasoning outperforms hard and fixed-soft CoT baselines using the same backbone, as well as a range of existing LVLMs. The source code is available at https://github.com/rafiibnsultan/Soft_Spatial_Reasoning', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'ea4e162a2d961189', 'authors': ['Rafi Ibn Sultan', 'Md. Sajid Alam Chowdhury', 'Saleh Zare Zade', 'Chengyin Li', 'Prashant Khanduri', 'Marco Brocanelli', 'Dongxiao Zhu'], 'affiliations': ['Department of Computer Science, Wayne State University', 'Department of Electrical and Computer Engineering, The Ohio State University', 'Department of Radiation Oncology, Henry Ford Health', 'Institute for AI and Data Science, Wayne State University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38717.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#training', '#benchmark', '#interpretability', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Мягкое мышление вместо жёсткого выбора: адаптивное пространственное рассуждение в видео-языковых моделях', 'desc': 'В статье предлагается новый подход Soft Spatial Reasoning для улучшения пространственного рассуждения в больших видео-языковых моделях. Вместо традиционного chain-of-thought, где модель выбирает один токен на каждом шаге, авторы используют мягкое смешивание эмбеддингов токенов, позволяя нескольким кандидатам влиять на следующий шаг рассуждения. Ключевой компонент AdaptSoft автоматически адаптирует степень этого смешивания в зависимости от уровня неопределённости и текущего скрытого состояния модели. Метод обучается с помощью нового градиентно-ориентированного объектива без необходимости промежуточной разметки, показывая улучшения на различных бенчмарках пространственного рассуждения.'}, 'en': {'title': 'Embracing Uncertainty: Soft Spatial Reasoning for LVLMs', 'desc': "This paper introduces Soft Spatial Reasoning, a new approach for Large Vision-Language Models (LVLMs) that enhances spatial reasoning by allowing for soft thinking instead of hard token selection. Traditional methods require the model to commit to a single token at each reasoning step, which can lead to errors if the initial choice is incorrect. Soft Spatial Reasoning enables the model to maintain a continuous state by mixing token embeddings, allowing it to consider multiple potential outcomes simultaneously. The method includes a controller called AdaptSoft that adjusts the level of softness based on the model's current understanding and uncertainty, leading to improved performance on spatial reasoning tasks."}, 'zh': {'title': '软空间推理：提升视觉语言模型的推理能力', 'desc': '大型视觉语言模型（LVLMs）通常通过链式思维（CoT）进行空间推理，将中间推理编码为自回归的离散语言标记序列。这种硬性思维要求在每一步都选择一个单一的标记，即使正确的空间解释仍然不确定。这种早期承诺导致了过早离散化：错误的标记选择可能会在后续推理中传播错误。我们提出了软空间推理，这是一种后训练框架，通过混合标记嵌入而不是选择单一标记，在每个中间推理步骤形成连续的软状态，从而允许多个候选继续影响下一步。'}}}, {'id': 'https://huggingface.co/papers/2609.34276', 'title': 'NavHarness: Towards Lifelong Embodied Navigation', 'url': 'https://huggingface.co/papers/2609.34276', 'abstract': 'Abstract  Frontier models can now perform well on individual embodied navigation tasks through multi-round multimodal reasoning with simple tools. Across successive tasks, however, an agent must also rely on an evolving map and earlier search records, both of which may be incomplete or conflict with new observations. We present NavHarness, a training-free embodied harness towards lifelong navigation that makes memory processing part of the navigation loop. During navigation, its multi-round agentic session draws on maps, task records, and house knowledge, checking them against observations and recording corrections to guide its actions. NavHarness preserves this experience across fresh conversations for new tasks or recovery attempts, while outcome verification and run-end summaries support its later reuse. On GOAT-Bench, NavHarness improves s-SR over context-only independent sessions by 18.6 points with Astra and 22.6 with Opus 5. Using SLAM-estimated poses, NavHarness with GPT-6 Astra achieves state-of-the-art task success of 83.7 s-SR with 36.9 e-SR on GOAT-Bench and 85.9 s-SR on IR2R-CE. To understand these gains, we examine how experience is carried between sessions and find that structured recovery handovers outperform length-matched summaries. In extended deployments across houses, consolidation improves navigation beyond retaining maps and task records, with case studies showing how agents use earlier experience to interpret new goals, investigate unresolved questions, and resume failed searches. We suggest that progress towards lifelong navigation depends on how successive reasoning sessions build on prior experience, alongside improvements in single-task capability.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '15ca2e91ccf13835', 'authors': ['Xunyi Zhao', 'Jian Zhou', 'Sihao Lin', 'Gengze Zhou', 'Zerui Li', 'Xinyu Yan', 'Jiajun Liu', 'Anton van den Hengel', 'Qi Wu'], 'affiliations': ['Adelaide University', 'CSIRO Data61', 'Responsible AI Research Centre, AIML'], 'pdf_title_img': 'assets/pdf/title_img/2609.34276.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#multimodal', '#agents'], 'emoji': '🗺️', 'ru': {'title': 'Память как ключ к долгосрочной навигации агентов', 'desc': 'В работе представляется NavHarness — система для обучения агентов навигации в физическом пространстве, которая использует многораундовое мультимодальное рассуждение с сохранением памяти между задачами. Система интегрирует карты, записи о предыдущих поисках и знания об окружении, проверяя их против новых наблюдений и корректируя действия агента. NavHarness демонстрирует значительное улучшение показателей успеха навигации на бенчмарке GOAT-Bench благодаря эффективной обработке опыта из предыдущих сессий. Исследование показывает, что структурированная передача опыта между сессиями критична для пожизненной навигации и превосходит простое сохранение карт и записей задач.'}, 'en': {'title': 'Empowering Lifelong Navigation with Memory-Driven Agents', 'desc': 'The paper introduces NavHarness, a novel approach for lifelong navigation in embodied agents that integrates memory processing into the navigation loop. It allows agents to utilize evolving maps and previous task records while adapting to new observations, enhancing their decision-making capabilities. By preserving experiences across different tasks, NavHarness enables agents to improve their navigation performance significantly, as demonstrated by its superior results on the GOAT-Bench benchmark. The study highlights the importance of structured memory management and experience transfer in achieving effective and continuous navigation across multiple tasks.'}, 'zh': {'title': '终身导航的记忆与推理结合', 'desc': '本论文介绍了一种名为NavHarness的导航系统，它通过将记忆处理融入导航循环，实现了终身导航的能力。该系统在多轮会话中利用地图、任务记录和知识，检查观察结果并记录修正，以指导其行动。NavHarness能够在新的任务或恢复尝试中保留经验，并通过结果验证和总结支持后续重用。研究表明，成功的导航依赖于如何在连续的推理会话中构建先前的经验，同时提升单任务能力。'}}}, {'id': 'https://huggingface.co/papers/2609.39166', 'title': 'Beyond the Remembered World: Predictive 4D Belief for Persistent Navigation in Evolving Worlds', 'url': 'https://huggingface.co/papers/2609.39166', 'abstract': 'Abstract  Persistent spatial memory enables embodied agents to navigate familiar environments across repeated visits. However, targets may move while unobserved, including during navigation, making remembered locations unreliable by the time an agent arrives. Despite advances in memory retrieval and state prediction, accounting for continued hidden world evolution and revising beliefs under limited visibility remain challenging. We study Evolving-World Navigation, where agents infer target locations from intermittent observations, predict their states at inspection time, and revise beliefs using visual evidence. We propose EvolvingNav, which constructs a time-indexed belief from timestamped 3D object histories through a structured persistence-relocation model. The belief distinguishes persistence at the last observed location from relocation to alternative locations and retains probability mass outside the known candidate set. An event-driven filter propagates the current belief as time elapses, forecasts target occupancy at candidate inspection times, and incorporates new RGB-D evidence. Negative observations downweight location hypotheses according to calibrated, visibility-conditioned detection probabilities, while evidence tracking prevents repeated use of the same observations. A frozen, zero-shot vision-language controller uses the updated belief to choose actions and replan. We further introduce EvoWorld-Bench, a benchmark grounded in human activity traces, comprising 54 scenes and 803,680 tasks with controlled changes before and during navigation. In simulation and real-robot experiments, EvolvingNav improves navigation success and search efficiency over the evaluated baselines. Paired experiments show the clearest gains under learnable temporal patterns, while ablations demonstrate the value of preserving uncertainty and incorporating visibility-aware evidence.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '4a08dd37f27755b5', 'authors': ['Mingjian Gao', 'Zhaocheng Li', 'Haoyang Huang', 'Wenqiao Zhang', 'Yingjie Niu', 'Hao Zhou', 'Chao Li', 'Juncheng Li', 'Siliang Tang', 'Yueting Zhuang'], 'affiliations': ['Chinese University of Hong Kong', 'Deeprobotics', 'University of California, San Diego', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39166.jpg', 'data': {'categories': ['#3d', '#multimodal', '#robotics', '#dataset', '#benchmark', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Навигация робота в изменяющемся мире через управление временной неопределённостью', 'desc': 'Статья посвящена задаче навигации в изменяющейся среде, где агент должен найти движущиеся объекты на основе прерывистых наблюдений. Авторы предлагают EvolvingNav — модель с временным индексированием убеждений, которая отслеживает как остающиеся объекты на последних наблюдаемых местоположениях, так и потенциально переместившиеся объекты. Система использует событийный фильтр для распространения верований со временем, предсказывает занятость целевых локаций и обновляет убеждения на основе визуальных доказательств, учитывая вероятность обнаружения. Авторы создали бенчмарк EvoWorld-Bench с 803,680 задачами навигации в реальных сценах и продемонстрировали, что EvolvingNav превосходит базовые методы по успешности и эффективности поиска.'}, 'en': {'title': 'Navigating Uncertainty: EvolvingNav for Dynamic Environments', 'desc': 'This paper presents EvolvingNav, a novel approach for agents to navigate environments where targets may move while they are not being observed. It introduces a structured persistence-relocation model that helps agents maintain and update their beliefs about target locations based on intermittent observations and visual evidence. The method uses an event-driven filter to manage beliefs over time, allowing agents to predict target states and adjust their navigation strategies accordingly. The authors also introduce EvoWorld-Bench, a benchmark for evaluating navigation tasks, demonstrating that EvolvingNav significantly enhances navigation success and efficiency compared to existing methods.'}, 'zh': {'title': '智能体在动态环境中的导航新方法', 'desc': '本论文研究了在不断变化的环境中，智能体如何通过间歇性观察推断目标位置并预测其状态。我们提出了EvolvingNav模型，该模型利用时间索引的信念构建方法，区分了目标在最后观察位置的持续性和迁移到其他位置的可能性。该模型通过事件驱动的过滤器传播信念，并在时间推移中预测目标的占用情况，同时结合新的RGB-D证据。实验结果表明，EvolvingNav在导航成功率和搜索效率上优于其他基线方法，尤其在学习到的时间模式下表现更为明显。'}}}, {'id': 'https://huggingface.co/papers/2609.37501', 'title': 'Evaluating Bounded Autonomy in Regulated Agentic AI: A Diagnostic Harness with Constitutional Rewards, Escalation Labels, and Runtime Governance', 'url': 'https://huggingface.co/papers/2609.37501', 'abstract': 'Abstract  We propose RegLLM, a diagnostic harness for bounded autonomy in regulated agentic workflows. It instruments six trustworthiness signals: citation validity, source grounding, schema compliance, escalation correctness, constitutional alignment, and unsafe-action rate. Signals are distinguished by their source of supervision: programmatic verifiers, task-level escalation labels, or AI-judge scores. A deterministic runtime supervisor blocks ungrounded answers and forces escalation, logging interventions. The same domain constitution informs evaluation, training rewards, and serving guardrails. Task-level should-escalate labels make the act-versus-defer decision a measurable training signal. We demonstrate the harness at smoke scale. An offline reference run (n=12) lifts escalation recall from 0 to 0.67 and reduces unsafe-action rate from 0.33 to 0.08 when governance is enabled. Two single-GPU Qwen2.5-3B LoRA/DPO pilots (n=8, same seed and evaluation split) expose substantial variation: nominally identical RL-base configurations yield task success of 0.25 versus 0.12 and escalation recall of 1.0 versus 0.5. An answer-quality adapter changes recall from 1.0 to 0.5 in Run A, but from 0.5 to 1.0 in Run B. An escalation-aware variant produces no measurable change in Run B. These small pilots do not establish reliable adapter effects or production readiness. Their contribution is diagnostic: configuration variance can overwhelm apparent tuning effects on bounded-autonomy metrics, motivating larger evaluation sets and repeated runs.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '8e3acbf67676cebb', 'authors': ['Dipankar Sarkar'], 'affiliations': ['Skelf Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.37501.jpg', 'data': {'categories': ['#training', '#small_models', '#agents', '#rlhf'], 'emoji': '🛡️', 'ru': {'title': 'Управление доверием агентов через программируемый надзор и измеримую эскалацию', 'desc': 'В работе представлен RegLLM — диагностический инструмент для контроля ограниченной автономии в регулируемых агентских workflows. Система отслеживает шесть сигналов надежности: валидность цитирований, обоснованность источников, соответствие схеме, корректность эскалации, согласованность с конституцией и количество небезопасных действий. Детерминированный супервизор во время выполнения блокирует необоснованные ответы и инициирует эскалацию, которая становится измеримым сигналом обучения. Авторы демонстрируют, что использование governace снижает долю небезопасных действий с 0.33 до 0.08 и повышает полноту эскалации с 0 до 0.67.'}, 'en': {'title': 'Enhancing Trustworthiness in AI with RegLLM', 'desc': 'The paper introduces RegLLM, a framework designed to enhance trustworthiness in AI systems operating under regulated workflows. It utilizes six key signals to assess trustworthiness, including citation validity and unsafe-action rates, which are monitored through various supervisory methods. The framework aims to improve decision-making in AI by implementing a deterministic supervisor that prevents ungrounded responses and encourages escalation when necessary. The results from initial tests show significant improvements in escalation recall and reductions in unsafe actions, highlighting the need for further evaluation to understand the impact of configuration variations on performance metrics.'}, 'zh': {'title': '提升受限自主工作流的信任度与安全性', 'desc': '本文提出了RegLLM，这是一个用于受限自主工作流的诊断工具。它监测六个可信度信号，包括引用有效性、来源基础、模式合规性、升级正确性、宪法一致性和不安全行为率。这些信号的监督来源各不相同，包括程序验证器、任务级升级标签或AI评判分数。通过实施确定性运行时监督，RegLLM能够阻止无基础的答案并强制升级，从而提高系统的安全性和可靠性。'}}}, {'id': 'https://huggingface.co/papers/2609.37915', 'title': 'Overcoming Scaling Limits in On-Policy Self-Distillation for LLM Reasoning', 'url': 'https://huggingface.co/papers/2609.37915', 'abstract': "Abstract  On-policy self-distillation (OPSD) trains a student to match a privileged teacher distribution along its own sampled trajectory. Standard OPSD applies this supervision to unverified student rollouts while conditioning the teacher on privileged context, typically a reference solution. We separate these roles in a factorial analysis and find that scaffold correctness has a stronger effect on downstream accuracy than context correctness. Unverified scaffolds create an imitation gap because the teacher can use information unavailable to the student. This gap shrinks with model scale, yet OPSD continues to supervise mostly unverified trajectories. In contrast, verified scaffolds remain effective even when the teacher is conditioned on the student's own unsuccessful rollout. Based on this finding, we introduce OASIS, which retains the OPSD objective but supervises mostly verified by label on-policy trajectories and replaces written solutions with unverified model-generated attempts as the teacher context. OASIS therefore requires only final-answer labels. Across Qwen3-1.7B, 4B, and 8B on AIME 2024, AIME 2025, and HMMT 2025, OASIS improves over the base model by 3.2--3.8 points on average, while OPSD's gain falls from 3.05 points at 1.7B to 0.14 at 8B. At 8B, OASIS improves over OPSD by 3.05 points, showing that verified on-policy scaffolds preserve the effectiveness of self-distillation as models scale.", 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '9cae4e238c243970', 'authors': ['Md. Ismail Hossain', 'Humaira Kousar', 'Isidora Chara Tourni'], 'affiliations': ['Andria Labs', 'KAIST', 'North South University'], 'pdf_title_img': 'assets/pdf/title_img/2609.37915.jpg', 'data': {'categories': [], 'emoji': '🎓', 'ru': {'title': 'Проверенные траектории - ключ к масштабируемой самодистилляции', 'desc': 'В работе исследуется самодистилляция на политике (OPSD), где модель-студент обучается копировать распределение учителя вдоль своих собственных сгенерированных траекторий. Авторы проводят факторный анализ и обнаруживают, что корректность промежуточных шагов решения (scaffold) имеет большее влияние на качество, чем корректность контекста учителя, причём этот разрыв в имитации сокращается с масштабированием модели. На основе этого они предлагают OASIS - метод, который использует преимущественно проверенные траектории и заменяет эталонные решения на неверифицированные попытки модели в качестве контекста для учителя. Экспериментально показано, что OASIS превосходит как базовую модель, так и стандартный OPSD на математических олимпиадах, причём его преимущество сохраняется и при увеличении размера модели.'}, 'en': {'title': 'OASIS: Enhancing Self-Distillation with Verified Trajectories', 'desc': "This paper discusses a method called On-Policy Self-Distillation (OPSD) that trains a student model to learn from a teacher model's guidance based on its own experiences. The authors find that the accuracy of the student model is more influenced by the correctness of the guidance (scaffold) than the context provided by the teacher. They introduce a new approach called OASIS, which focuses on using verified trajectories for training, improving the learning process by reducing the imitation gap that occurs with unverified data. The results show that OASIS significantly outperforms OPSD, especially as the model size increases, demonstrating the importance of using reliable training data."}, 'zh': {'title': 'OASIS：提升自蒸馏效果的新方法', 'desc': '这篇论文介绍了一种新的自蒸馏方法，称为OASIS，它通过使用经过验证的标签来指导学生模型的训练。研究发现，教师模型的正确性对学生模型的准确性影响更大，而未验证的支架会导致模仿差距。OASIS在多个模型规模上表现出色，尤其是在较大的模型中，相比于传统的在政策自蒸馏方法（OPSD），它的效果更为显著。通过这种方法，OASIS能够在保持自蒸馏效果的同时，减少对未验证轨迹的依赖。'}}}, {'id': 'https://huggingface.co/papers/2609.37879', 'title': 'Retrieval Capacity of Self-Attention Under Competition', 'url': 'https://huggingface.co/papers/2609.37879', 'abstract': 'Abstract  How many tokens from its context does a language model actually use, and what determines that number? We study this question through self-attention. Without retraining, we retain only the tokens with the highest attention weights at each head, layer, and query, keeping their original weights unchanged. By varying the selected set size and measuring the increase in negative log-likelihood (NLL), we estimate the effective attention set size needed to stay within a chosen loss tolerance. Relatively small selected sets can keep NLL close to the full-attention baseline, although the required size varies across models. Attention-based selection substantially outperforms random selection. Selected sets exhibit geometric structure, although geometric separation alone does not establish that model loss is preserved. Extending context while evaluating the same prediction targets increases the required set size, while its fraction of context decreases over the tested range. Experiments with a fixed supporting fact show that additional background pushes its tokens down the attention ranking and reduces their attention mass. Renormalizing the retained weights can substantially reduce the required set size, showing that it also depends on how selected representations are combined. Conditional theoretical models explain how competition and attention-mass retention can produce growing set sizes without more distinct information to retrieve. These results provide a way to measure effective attention set size in language models and investigate its dependence on context, competition, and aggregation.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '215796b726ac24d9', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#long_context', '#architecture', '#interpretability'], 'emoji': '🎯', 'ru': {'title': 'Измерение реальной длины эффективного контекста в языковых моделях через анализ внимания', 'desc': 'Исследование изучает, сколько токенов из контекста на самом деле используют языковые модели, анализируя механизм self-attention без переобучения. Авторы сохраняют только токены с наибольшими весами внимания и измеряют увеличение потерь, чтобы оценить эффективный размер набора токенов. Результаты показывают, что относительно небольшие наборы токенов могут сохранять качество модели, и при этом отбор на основе внимания значительно превосходит случайный выбор. Работа демонстрирует, что размер эффективного набора зависит от конкуренции между токенами, структуры контекста и способа агрегации представлений.'}, 'en': {'title': 'Optimizing Token Selection in Language Models for Effective Attention', 'desc': 'This paper investigates how many tokens a language model uses from its context and what factors influence this number. It focuses on self-attention mechanisms, analyzing the attention weights of tokens across different layers and heads. By selecting only the most relevant tokens based on their attention scores, the study finds that smaller sets can maintain performance close to full attention, although the optimal size varies by model. The research also reveals that the way tokens are combined and the presence of competing information can affect the attention distribution and the effective size of the attention set.'}, 'zh': {'title': '有效注意力集大小的测量与分析', 'desc': '本文研究了语言模型在处理上下文时实际使用的token数量及其决定因素。通过自注意力机制，我们保留每个头、层和查询中具有最高注意力权重的token，并测量负对数似然（NLL）的变化。结果表明，相对较小的选择集可以在保持NLL接近全注意力基线的同时，所需的选择集大小因模型而异。我们的实验还表明，背景信息的增加会降低token的注意力排名，从而影响模型的表现。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2605.22493', 'title': 'Understanding Multimodality in Generative Behavioral Cloning', 'url': 'https://huggingface.co/papers/2605.22493', 'abstract': 'Abstract  Behavioral cloning becomes challenging when the same observation admits several valid actions. We study how generative behavioral-cloning policies represent such multimodal expert behavior and identify different bottlenecks across model parameterizations. For latent-variable policies, preserving demonstrated modes requires action-conditioned information in the latent representation. Excessive posterior-prior regularization can suppress this information and prevent the policy from distinguishing demonstrated modes. Weaker or aggregate regularization can preserve mode information, but shifts the challenge to ensuring that the deployment-time prior covers the relevant latent regions. For action-space generative policies, multimodality is constrained by the smoothness of the base-to-action transport: a map with a small Lipschitz constant cannot assign substantial probability to many well-separated modes. Covering many modes therefore requires either sharp transitions in base space or off-support bridge regions in action space. Experiments on synthetic multimodal navigation and a physical-robot bimodal manipulation task support these mechanisms. In contrast, our analysis reveals limited conditional multimodality in standard robotic simulation benchmarks, where deterministic regression remains competitive.', 'score': 0, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '
