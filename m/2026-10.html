    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.01762', 'title': 'OneStreamer: Unifying Perception, Memory, and Proactive Response in Streaming Video Interaction', 'url': 'https://huggingface.co/papers/2610.01762', 'abstract': 'Abstract  Streaming video LLMs must retain evidence before its relevance to future tasks is known and respond when sufficient evidence becomes available. The challenge is to form reusable factual memory without compromising real-time perception. We introduce OneStreamer, which jointly learns query-independent evidence recording and task response through a shared proactive generation process. Its Proactive Hierarchical Caption Memory (PHCM) produces time-grounded local-detail captions and summaries of completed events. Streaming caption targets supervise the interpretation of observed video prefixes during training. At inference, model-generated records complement a recent visual window, providing reusable factual context without revisiting historical visual features. Proactive State Transition Learning (PSTL) reduces the dominance of repeated waiting states by preserving supervision at all output anchors and selecting representative state-change and state-persistence tokens. We further develop a streaming data synthesis pipeline that aligns output content and timing with available evidence. Combining the resulting streaming captions and QA with cleaned open-source data yields OneStreamer-1M, a broad-coverage streaming video interaction dataset with over one million records spanning diverse tasks. Our 4B model achieves the best results among the compared methods across all eight evaluated streaming video understanding benchmarks. Ablations show that retaining generated captions improves historical QA without degrading real-time perception. PSTL also outperforms dense state supervision while supervising only 27.5% of annotated state tokens. Together, these results support proactive generation as a shared learning interface connecting perception, memory formation, and timely response in streaming video interaction.', 'score': 163, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '2d03f140e099ce15', 'authors': ['Xiangyu Zeng', 'Yuandong Yang', 'Zhiqiu Zhang', 'Yuhan Zhu', 'Xinhao Li', 'Qingyi Si', 'Dingyu Yao', 'Changlian Ma', 'Haoran Chen', 'Xinyu Chen', 'Yansong Shi', 'Junhao Zhou', 'Yifei Li', 'Jun Zhang', 'Chuanyu Qin', 'Chenxu Yang', 'Xinlei Yu', 'Kun Ouyang', 'Yuchen Shao', 'Qianshan Wei', 'Changhai Zhou', 'Jun Gao', 'Jiaqi Wang', 'Limin Wang'], 'affiliations': ['CAS', 'CUHK', 'FDU', 'JD', 'NJU', 'PJLAB', 'PKU', 'SJTU', 'THU', 'USTC', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2610.01762.jpg', 'data': {'categories': ['#video', '#multimodal', '#dataset', '#training', '#synthetic', '#open_source', '#benchmark', '#long_context'], 'emoji': '🎬', 'ru': {'title': 'Проактивная генерация для понимания потокового видео в реальном времени', 'desc': 'В статье представлена модель OneStreamer для обработки потокового видео с использованием больших языковых моделей. Система одновременно записывает релевантную информацию и генерирует ответы на запросы через единый процесс проактивной генерации. Ключевым компонентом является Иерархическая Память Проактивных Подписей (PHCM), которая создает подписи с временными метками и резюме завершенных событий, служащие переиспользуемым контекстом без пересмотра исторических признаков. Метод Проактивного Обучения Переходам Состояний (PSTL) оптимизирует обучение, сосредоточиваясь на значимых изменениях состояния, достигая качества с использованием только 27.5% аннотированных токенов.'}, 'en': {'title': 'OneStreamer: Proactive Learning for Real-Time Video Interaction', 'desc': "This paper presents OneStreamer, a machine learning model designed for streaming video interactions that efficiently retains and utilizes evidence for future tasks. It introduces a Proactive Hierarchical Caption Memory (PHCM) that generates detailed captions and summaries of events, allowing the model to maintain relevant context without needing to revisit past visual data. The Proactive State Transition Learning (PSTL) technique enhances the model's ability to manage state changes and maintain supervision, improving performance in real-time scenarios. The results demonstrate that OneStreamer outperforms existing methods in streaming video understanding, showcasing the effectiveness of proactive generation in linking perception, memory, and response."}, 'zh': {'title': '主动生成：连接感知与记忆的桥梁', 'desc': '本论文介绍了一种名为OneStreamer的流媒体视频大语言模型（LLM），它能够在未来任务的相关性尚不明确时保留证据，并在证据充分时做出响应。OneStreamer通过共享的主动生成过程，联合学习与查询无关的证据记录和任务响应。其主动层次标题记忆（PHCM）生成时间基础的局部细节标题和已完成事件的摘要，从而在推理时提供可重用的事实上下文。通过主动状态转移学习（PSTL），该模型在所有输出锚点保持监督，选择代表性的状态变化和持久性标记，从而提高了流媒体视频交互的理解能力。'}}}, {'id': 'https://huggingface.co/papers/2609.35259', 'title': 'On-Policy or Off-Policy Learning? A Systematic Study of Distillation Dynamics', 'url': 'https://huggingface.co/papers/2609.35259', 'abstract': 'Abstract  On-policy learning has been argued to reduce catastrophic forgetting, produce sparser parameter updates, and improve generalisation. However, existing comparisons between supervised fine-tuning and reinforcement learning vary many factors simultaneously, making the contribution of rollout policy difficult to isolate. We study the effect of rollout policy in a controlled strong-to-weak distillation setting, by independently varying rollout policy, token-level KL direction, and learning rate across the Llama3 and Qwen2.5 model families and reasoning tasks spanning scientific, medical, and arithmetic domains. Our analysis reveals a nuanced picture of distillation dynamics in which rollout policy does not necessarily play a central role. Instead, token-level KL direction more clearly shapes task performance and output coverage, while learning rate governs forgetting and update sparsity. Analysis of KL gradients and experiments along a continuous student-teacher rollout-policy spectrum explain this pattern: forward KL is remarkably robust to rollout policy, with its performance stable and strong despite changes to the rollout policy, whereas reverse KL is substantially more sensitive and favours student-generated rollouts. On-policy data nevertheless improves generalisation to harder variants of the Countdown arithmetic task under both KL directions, although this advantage does not reliably persist after subsequent RLVR. Our broader conclusions remain robust to removing gradient clipping, using sampled KL estimators, and training on tasks requiring longer reasoning chains. Overall, our results challenge the view that on-policy rollouts are inherently preferable and show that their value depends critically on the objective, evaluation setting, and optimisation hyperparameters.', 'score': 154, 'issue_id': 3364, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '232943dc09805b80', 'authors': ['Julianna Piskorz', 'Antonin Berthon', 'Mihaela van der Schaar'], 'affiliations': ['University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2609.35259.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#alignment', '#training', '#rlhf'], 'emoji': '🔄', 'ru': {'title': 'On-policy данные не всегда лучше: роль KL-дивергенции и оптимизации в дистилляции', 'desc': 'В работе исследуется влияние политики сбора данных (on-policy vs off-policy) при дистилляции языковых моделей путём контролируемого варьирования политики rollout, направления KL-дивергенции и темпа обучения на моделях Llama3 и Qwen2.5. Авторы обнаруживают, что направление KL-дивергенции между моделями и темп обучения играют более значительную роль, чем сама политика rollout, в определении производительности и забывания параметров. Forward KL показывает устойчивость к выбору политики, тогда как reverse KL чувствительнее и предпочитает данные, генерируемые студентом. Результаты демонстрируют, что on-policy данные не являются универсально предпочтительными и их ценность зависит от типа потерь, метрик оценки и гиперпараметров оптимизации.'}, 'en': {'title': "Rethinking On-Policy Learning: It's Not Always Better!", 'desc': 'This paper investigates the impact of rollout policy in on-policy learning, particularly in the context of model distillation. The authors find that while on-policy learning is often thought to reduce forgetting and enhance generalization, its effectiveness is highly dependent on specific factors like token-level KL direction and learning rate. Their experiments reveal that token-level KL direction significantly influences task performance, while learning rate affects how models forget information and update parameters. Ultimately, the study suggests that the benefits of on-policy rollouts are not universal and vary based on the learning objectives and settings used.'}, 'zh': {'title': '执行策略的价值取决于目标与设置', 'desc': '本文研究了在强化学习中，执行策略对模型蒸馏的影响。通过在Llama3和Qwen2.5模型上独立调整执行策略、KL方向和学习率，我们发现执行策略并不是影响任务表现的主要因素。相反，token级别的KL方向对任务表现和输出覆盖有更明显的影响，而学习率则影响遗忘和更新的稀疏性。我们的研究结果表明，执行策略的价值取决于具体的目标、评估设置和优化超参数。'}}}, {'id': 'https://huggingface.co/papers/2609.38923', 'title': 'GraphForge: Training Working Agents with Graph-Anchored Workspace Synthesis', 'url': 'https://huggingface.co/papers/2609.38923', 'abstract': "Abstract  Working agents need to read diverse files, coordinate tools, and produce deliverables. Training such agents requires tasks built on many real files with verifiable results, but few pipelines exist to synthesize this kind of data. Existing pipelines either generate files with models, which lack realism and diversity, or build tasks on real files without task-specific verifiers, leaving result quality unchecked. We introduce GraphForge, an evidence-graph based framework that grounds both the task and its verification in real files. Starting from occupation-grounded seeds for controlled diversity, GraphForge assembles a workspace of real files for each seed and builds an evidence graph over their relations. Since the task statement and rubrics are both derived from this graph, task requirements are backed by the workspace files and each criterion is anchored to the files needed to verify it. An initial rollout further tests executability, and a revision agent repairs the task and rubrics against the original files before trajectories are collected. Fine-tuning Qwen3.6-27B on 2,169 GraphForge trajectories brings GDPVal to 1445.7 (+65.7) under OpenHands, and Workspace-Bench-Lite and SpreadsheetBench II to 63.7 (+7.7) and 24.0 (+13.7) under Claude Code. Rejection fine-tuning on the SFT model's own rollouts, with candidates selected by the evidence-anchored rubrics, yields further improvements on all three benchmarks, suggesting that the rubrics provide a useful selection signal. The data and models are available.", 'score': 144, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5723a4c3d45affcd', 'authors': ['Qisheng Su', 'Hanchen Wang', 'Guanru Zhu', 'Huicheng Jiang', 'Qiuyinzhe Zhang', 'Kou Shi', 'Zhen Fang', 'Ziao Zhang', 'Qingnan Ren', 'Zehui Chen', 'Tao Gui', 'Feng Zhao'], 'affiliations': ['Fudan University', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.38923.jpg', 'data': {'categories': ['#dataset', '#agents', '#training'], 'emoji': '🏗️', 'ru': {'title': 'Синтез данных для обучения агентов через графы связей реальных файлов', 'desc': 'Авторы предлагают GraphForge — фреймворк для синтеза высококачественных данных для обучения агентов, которые работают с файлами и инструментами. Вместо генерации синтетических файлов или использования реальных файлов без проверки качества, фреймворк строит граф связей между реальными файлами и привязывает к ним как описание задачи, так и критерии её оценки. Система включает начальный проход для проверки выполнимости и агента-ревизора, который улучшает задачи и рубрики перед сбором траекторий. Fine-tuning моделей на 2169 траекториях GraphForge и последующее rejection fine-tuning с использованием привязанных к графу рубрик значительно улучшают производительность на нескольких бенчмарках.'}, 'en': {'title': 'GraphForge: Real Data for Real Tasks in Agent Training', 'desc': 'This paper presents GraphForge, a framework designed to enhance the training of working agents by utilizing real files for task generation and verification. Unlike existing methods that either lack realism or do not verify results, GraphForge creates a workspace of real files and builds an evidence graph to connect tasks with their verification criteria. The framework ensures that task requirements are directly linked to the files used for verification, improving the quality of the generated tasks. The results show significant performance improvements on various benchmarks after fine-tuning a model using the trajectories generated by GraphForge.'}, 'zh': {'title': 'GraphForge：基于证据图的智能体训练框架', 'desc': '本论文介绍了一种名为GraphForge的框架，用于训练能够处理多样文件的智能体。该框架通过构建基于证据的图，确保任务和验证都基于真实文件，从而提高了结果的真实性和多样性。GraphForge从职业相关的种子开始，组装真实文件的工作空间，并在其关系上构建证据图，以确保任务要求与文件相匹配。通过对Qwen3.6-27B模型进行微调，GraphForge在多个基准测试中显著提高了性能，表明该框架在智能体训练中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.37200', 'title': 'Adaptive Reward Routing: Dynamic Multi-Reward Optimization for Joint Audio-Video Diffusion via Forward-Process RL', 'url': 'https://huggingface.co/papers/2609.37200', 'abstract': 'Abstract  Multi-reward guided reinforcement learning (i.e., RL) offers a promising way to improve joint audio-video diffusion models along several complementary objectives, including modality-specific quality, cross-modal semantic alignment, and temporal synchronization. Its effectiveness, however, depends on two quantities that change during training: where reward-driven updates should act, and how competing rewards should be combined. Existing methods tend to rely on fixed routing and reward weights, failing to track evolving model functions. To address these limitations, we propose Adaptive Reward Routing to jointly adapt update locations and reward coordination during forward-process RL (i.e., DiffusionNFT) of joint audio-video diffusion models. Our method consists of two components. (i) Cross-Modal Influence-Guided Routing (Localizing Updates): We use bidirectional cross-attention responses as an efficient proxy for evolving cross-modal influence, dynamically reweighting token-aware losses and scaling gradients across cross-modal layers without additional model interventions. (ii) Preference-Preserving Modality-Aware Reweighting (Coordinating Rewards): We preserve predefined weights as preference priors and use branch-specific reward-gradient interactions as residual corrections after warm-up. This resolves evolving conflicts without letting dominant rewards suppress weak but essential objectives. Extensive experiments demonstrate consistent improvements in modality quality, semantic consistency, and audio-video synchronization over strong RL baselines. Ablations and mechanism analyses further validate the complementary benefits of adaptive update routing and reward coordination.', 'score': 123, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'fe5a155878eb0a0c', 'authors': ['Songlin Yang', 'Xiaotong Zhao', 'Jiacheng Zhang', 'Zhe Wang', 'Toyota Li', 'Eric Liu', 'Alan Zhao', 'Anyi Rao'], 'affiliations': ['MMLab@HKUST, The Hong Kong University of Science and Technology', 'Tencent Video', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.37200.jpg', 'data': {'categories': ['#multimodal', '#training', '#video', '#rlhf', '#rl', '#audio'], 'emoji': '🎬', 'ru': {'title': 'Адаптивная маршрутизация вознаграждений для совместного синтеза аудио-видео', 'desc': 'В работе предложен метод адаптивной маршрутизации вознаграждений для обучения с подкреплением мультимодальных диффузионных моделей, генерирующих аудио и видео одновременно. Авторы решают проблему фиксированных весов и маршрутов обновления, предложив динамически адаптировать места применения градиентов и комбинацию нескольких вознаграждений во время обучения. Метод использует кросс-внимание между модальностями для определения наиболее влиятельных слоёв и применяет остаточные коррекции вознаграждений для разрешения конфликтов между конкурирующими целями. Эксперименты показывают улучшение качества обеих модальностей, семантической согласованности и синхронизации аудио-видео по сравнению с базовыми подходами.'}, 'en': {'title': 'Adaptive Reward Routing: Enhancing Audio-Video Models with Dynamic Learning', 'desc': 'This paper introduces a method called Adaptive Reward Routing for improving joint audio-video diffusion models using multi-reward guided reinforcement learning. The approach addresses the challenges of determining where to apply updates and how to effectively combine competing rewards during training. It features two main components: Cross-Modal Influence-Guided Routing, which dynamically adjusts updates based on evolving cross-modal influences, and Preference-Preserving Modality-Aware Reweighting, which maintains important reward preferences while correcting for conflicts. The results show significant enhancements in quality, consistency, and synchronization of audio and video outputs compared to existing reinforcement learning methods.'}, 'zh': {'title': '自适应奖励路由：提升音视频模型的强化学习', 'desc': '多奖励引导的强化学习（RL）为改进联合音频-视频扩散模型提供了一种有前景的方法，旨在实现多种互补目标，包括特定模态的质量、跨模态的语义对齐和时间同步。然而，其有效性依赖于训练过程中两个变化的量：奖励驱动更新的作用位置和竞争奖励的组合方式。现有方法通常依赖于固定的路由和奖励权重，无法跟踪模型功能的演变。为了解决这些限制，我们提出了自适应奖励路由，能够在联合音频-视频扩散模型的前向过程强化学习中共同适应更新位置和奖励协调。'}}}, {'id': 'https://huggingface.co/papers/2610.02193', 'title': 'Hierarchical Continuous Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.02193', 'abstract': 'Abstract  Discrete diffusion language models offer a compelling alternative to autoregressive generation for tasks demanding bidirectional reasoning and global constraint satisfaction. Yet they share a structural bottleneck: when decoding in parallel, each token is sampled independently from its marginal, severing the statistical dependencies among the tokens decoded together. Continuous diffusion language models avoid this by denoising a shared continuous state, but their denoiser sees only that state, so nothing ties it to a valid token configuration until it is finally decoded. To address this, we propose Hierarchical Continuous Diffusion Language Models (HC-DLM), which couple discrete token generation with a continuous latent trajectory in a single, principled denoising process, whose training objective is derived from a variational bound on the token likelihood. In contrast to recent methods that attach continuous context to a self-contained discrete chain, HC-DLM makes the latent the only persistent generative state: tokens are read out from it at every step and feed back as a scaffold for the next latent update. On structured reasoning (Sudoku), mathematical planning (Countdown) and language modeling (LM1B), HC-DLM improves over discrete and continuous diffusion baselines at matched model size, in puzzle accuracy on Sudoku and Countdown and in generative perplexity on LM1B. Project page: https://hc-dlm.github.io/.', 'score': 79, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd95a1df458e06db2', 'authors': ['Hui Ren', 'Zihan Li', 'Chang Liu', 'Huidong Liu', 'Alexander Schwing'], 'affiliations': ['Amazon.com, Inc.', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02193.jpg', 'data': {'categories': ['#reasoning', '#diffusion'], 'emoji': '🌊', 'ru': {'title': 'Слияние дискретного и непрерывного: иерархические диффузионные модели для языка', 'desc': 'Статья предлагает новый подход к диффузионным языковым моделям под названием Hierarchical Continuous Diffusion Language Models (HC-DLM), который объединяет дискретное генерирование токенов с непрерывной латентной траекторией в единый процесс денойзирования. В отличие от существующих методов, HC-DLM использует латентное состояние как единственное постоянное состояние генерации, где токены считываются на каждом шаге и подаются обратно как опора для следующего обновления латента. Обучение модели происходит на основе вариационной нижней границы функции правдоподобия токенов. Экспериментальные результаты показывают, что HC-DLM превосходит дискретные и непрерывные диффузионные базовые модели на задачах структурного рассуждения (Судоку), математического планирования (Countdown) и моделирования языка (LM1B).'}, 'en': {'title': 'Revolutionizing Language Generation with Hierarchical Continuous Diffusion', 'desc': 'The paper introduces Hierarchical Continuous Diffusion Language Models (HC-DLM), which enhance the generation of language by combining discrete token generation with a continuous latent state. This approach addresses the limitations of traditional discrete diffusion models, which sample tokens independently, losing important statistical relationships. HC-DLM employs a unified denoising process that maintains a persistent generative state, allowing for better integration of token dependencies during generation. The model demonstrates improved performance in structured reasoning tasks and language modeling compared to existing methods.'}, 'zh': {'title': '层次连续扩散语言模型的创新之路', 'desc': '离散扩散语言模型为需要双向推理和全局约束满足的任务提供了一种有吸引力的替代方案。然而，它们在并行解码时存在结构瓶颈：每个标记独立采样，切断了标记之间的统计依赖关系。连续扩散语言模型通过去噪共享的连续状态来避免这一问题，但其去噪器仅能看到该状态，直到最终解码时才与有效的标记配置关联。为了解决这个问题，我们提出了层次连续扩散语言模型（HC-DLM），将离散标记生成与连续潜在轨迹结合在一个统一的去噪过程中，从而在结构推理和语言建模任务中超越了离散和连续扩散基线。'}}}, {'id': 'https://huggingface.co/papers/2610.01509', 'title': 'Sharpening Tax in Post-Training', 'url': 'https://huggingface.co/papers/2610.01509', 'abstract': 'Abstract  An emerging hypothesis about reinforcement learning (RL) post-training of large language models (LLMs) is that it merely sharpens existing behaviors of a base model, improving single-shot accuracy at the cost of solution coverage. Although this trade-off has been observed in math and coding tasks, it need not extend to agentic tasks, where multi-turn tool use and interaction may require capabilities newly acquired during post-training. Our surprising finding is that pre-trained LLMs, equipped with a light inference harness, can serve as capable agents. Despite far lower accuracy (pass@1), they often surpass their post-trained counterparts in solution coverage (pass@K) given a sufficient test-time budget. We further analyze the underlying mechanism and show that post-training pushes tasks toward two extremes, always solved or never solved, and thereby improves sampling efficiency and consistency at the cost of solution coverage. To measure this cost, we propose Sharpening Tax, a diagnostic metric that quantifies the loss in test-time scalability after post-training. Across 14 base/post-trained model pairs from four families and three agentic benchmarks (42 cases in total), the tax is prevalent in most settings, can be estimated from a few rollouts, and correlates well with other metrics. Finally, we present posterior-tempered group sampling (PTGS), a simple plug-and-play Bayesian sampler that adapts the sampling temperature per prompt to its estimated difficulty. Applied during RL training in two agentic environments, PTGS pays a smaller tax than the fixed-temperature baseline, solving more tasks under repeated sampling while also improving single-shot accuracy.', 'score': 78, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '855b186032d55afe', 'authors': ['Changdae Oh', 'Qi Zeng', 'Qi Qi', 'Andrey Zhmoginov', 'Deren Lei', 'Yun He', 'Hoang Phan', 'Hangoo Kang', 'Azalia Mirhoseini', 'Sharon Li'], 'affiliations': ['Meta Superintelligence Labs', 'NYU', 'Stanford University', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.01509.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#training', '#agents', '#alignment', '#rl', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Налог заточки: когда RL-обучение жертвует разнообразием ради точности', 'desc': 'В этой работе исследуется парадоксальный эффект обучения с подкреплением (RL) для больших языковых моделей: хотя post-training улучшает точность на одной попытке (pass@1), он часто снижает способность модели находить разнообразные решения при многократной генерации (pass@K). Авторы показывают, что базовые предобученные модели с простой системой управления выводом могут работать как эффективные агенты, демонстрируя лучшую покрытие решений при достаточном бюджете тестирования. Введена метрика Sharpening Tax, которая количественно измеряет потерю масштабируемости при тестировании после обучения, и показано, что эта потеря распространена в большинстве случаев. Предложен метод posterior-tempered group sampling (PTGS) — адаптивный байесовский сэмплер, который автоматически подбирает температуру генерации для каждого запроса в зависимости от его сложности, снижая потери и улучшая одновременно как разнообразие, так и точность решений.'}, 'en': {'title': 'Balancing Accuracy and Coverage in Reinforcement Learning for LLMs', 'desc': 'This paper investigates the effects of post-training reinforcement learning (RL) on large language models (LLMs), suggesting that it primarily enhances existing behaviors rather than expanding solution coverage. The authors find that pre-trained LLMs can outperform post-trained models in terms of solution coverage, despite lower single-shot accuracy, when given enough time to test. They introduce a new metric called Sharpening Tax to measure the trade-off between improved sampling efficiency and reduced solution coverage after post-training. Additionally, they propose a novel Bayesian sampling method, posterior-tempered group sampling (PTGS), which adjusts the sampling temperature based on task difficulty, leading to better performance in agentic tasks.'}, 'zh': {'title': '后期训练的锐化税与智能体能力的平衡', 'desc': '这篇论文探讨了强化学习（RL）在大型语言模型（LLMs）后期训练中的作用，提出后期训练主要是增强基础模型的现有行为，虽然提高了单次准确率，但牺牲了解决方案的覆盖率。研究发现，经过预训练的LLMs在轻量推理框架下可以作为有效的智能体，尽管准确率较低，但在解决方案覆盖率上往往超过后期训练的模型。论文还分析了后期训练如何将任务推向两种极端，导致解决方案的效率和一致性提高，但覆盖率下降。为此，提出了“锐化税”这一诊断指标，用于量化后期训练带来的测试时间可扩展性损失，并展示了在多种环境下的普遍性和相关性。'}}}, {'id': 'https://huggingface.co/papers/2610.01415', 'title': 'Beyond Memory: Harnessing Long-Horizon Agents with Explicit Belief States', 'url': 'https://huggingface.co/papers/2610.01415', 'abstract': "Abstract  Large language model (LLM) agents can now undertake increasingly complex tasks, but the way they organize interaction history into memory does not ensure a coherent understanding of the current world. We introduce PoS, an inference-time framework that constructs and continually maintains explicit belief states as the agent's decision context. Each belief combines an estimate of the current world state with unresolved task requirements, making explicit what the agent still needs to learn and accomplish. To keep this belief reliable and actionable, PoS validates its consistency and monitors task progress to detect Belief Trapping, where the agent continues to act without making meaningful progress toward the goal. Recovery is then tailored to both the trapping pattern and the type of unresolved task requirement. Experiments on four benchmarks spanning execution and diagnosis show that PoS achieves the highest overall performance on every benchmark with all three LLM backbones. Ablations demonstrate the importance of consistency validation and recovery, while context-scaling experiments show resilience to context growth. Together, these results support belief construction and continual maintenance as a foundation for long-horizon context management beyond history retention and compression.", 'score': 78, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'a09c60be2cfa2f94', 'authors': ['Yu Luo', 'Jiamin Jiang', 'Yimin Zuo', 'Xidao Wen', 'Rongchen Gao', 'Yongqian Sun', 'Shenglin Zhang', 'Guiyang Liu', 'Cheng Zhang', 'Fang Situ', 'Qi Zhou', 'Dan Pei'], 'affiliations': ['Alibaba Group', 'Nankai University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.01415.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Явные модели убеждений для надёжного управления контекстом агентов', 'desc': 'В статье предлагается PoS — это фреймворк, работающий во время инференции, который помогает LLM-агентам создавать и поддерживать явные модели убеждений о состоянии мира. Каждое убеждение объединяет оценку текущего состояния окружения с невыполненными требованиями задачи, делая явным то, что агенту ещё нужно узнать. Система валидирует согласованность убеждений и отслеживает прогресс в решении задачи, обнаруживая ситуации, когда агент действует без реального прогресса. Экспериментальные результаты на четырёх бенчмарках демонстрируют, что PoS превосходит базовые методы со всеми тестируемыми LLM, подтверждая эффективность конструирования и поддержания моделей убеждений для управления контекстом на длинных горизонтах.'}, 'en': {'title': 'Empowering LLMs with Dynamic Belief Management for Effective Task Execution', 'desc': 'This paper presents PoS, a framework designed to enhance the decision-making capabilities of large language model (LLM) agents by maintaining explicit belief states. These belief states integrate the current understanding of the world with outstanding task requirements, allowing the agent to identify what it still needs to learn and achieve. The framework also addresses the issue of Belief Trapping, where agents may act without making real progress, by validating the consistency of beliefs and monitoring task advancement. Experimental results demonstrate that PoS significantly improves performance across various benchmarks, highlighting the importance of belief management for effective long-term task execution.'}, 'zh': {'title': '信念构建与持续维护：超越历史保留的长远管理', 'desc': '大型语言模型（LLM）代理可以执行越来越复杂的任务，但它们的记忆组织方式并不能确保对当前世界的连贯理解。我们提出了PoS框架，在推理时构建并持续维护明确的信念状态，作为代理的决策背景。每个信念结合了对当前世界状态的估计和未解决的任务需求，明确了代理仍需学习和完成的内容。实验表明，PoS在四个基准测试中表现最佳，验证了一致性和恢复的重要性，并展示了在上下文增长方面的韧性。'}}}, {'id': 'https://huggingface.co/papers/2609.35690', 'title': 'Agent Priors-guided Policy Learning', 'url': 'https://huggingface.co/papers/2609.35690', 'abstract': "Abstract  Robots that learn from a few demonstrations often require two forms of generalization. Compositional generalization recombines skills to solve new tasks, and skill generalization lets the learned policy behind each skill work in new situations. The two depend on each other, yet information is lost between composition and the skills it calls. Where a skill works is determined by the structure its policy is trained with, while composition sees the skill only through a separate description, such as a name, an instruction, or a symbolic operator, that omits this structure. Our key idea is to use each policy's structural prior as part of the interface between composition and the skill. A structural prior states what a behavior depends on, for example that a grasp depends only on the gripper's pose relative to the object. Built into training, it shapes where the policy generalizes; stated in language, it tells composition where the policy applies. We instantiate this idea in Agent Priors-guided Policy Learning (APPL). A construction agent segments complete demonstrations into reusable skills, proposes several structural priors for each skill, and trains and verifies one policy per prior. A runtime agent then selects among these prior-specific policies and composes them toward new task goals using their interfaces. Across MetaWorld and long-horizon ManiSkill tasks, APPL improves out-of-distribution skill generalization and enables previously unseen skill compositions; ablating the interface information substantially reduces performance. These results support the use of training-time structural assumptions as a bridge between skill learning and skill composition.", 'score': 73, 'issue_id': 3362, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '3d9c26b81800ba15', 'authors': ['Puming Jiang', 'Tianrun Hu', 'Haozhe Du', 'Yibo Li', 'Zhiwei Xue', 'Xinhu Li', 'Harold Soh'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.35690.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Структурные приоры как мост между обучением и композицией навыков робота', 'desc': 'В работе предложен метод APPL для обучения роботов на основе нескольких демонстраций, который решает проблему одновременной композиционной генерализации (комбинирование навыков для новых задач) и генерализации навыков (применение политик в новых ситуациях). Ключевая идея заключается в использовании структурных приоров политик как интерфейса между композицией и отдельными навыками — они определяют, от каких факторов зависит поведение. Система состоит из двух агентов: конструктивный агент сегментирует демонстрации на переиспользуемые навыки и обучает политики с разными приорами, а исполнительный агент во время работы выбирает подходящие политики и компонует их для достижения новых целей. Экспериментальные результаты на задачах MetaWorld и ManiSkill показывают, что структурные приоры значительно улучшают генерализацию навыков и позволяют выполнять ранее невиданные комбинации навыков.'}, 'en': {'title': 'Bridging Skills and Composition with Structural Priors', 'desc': 'This paper discusses a method for robots to learn from a few demonstrations by improving two types of generalization: compositional and skill generalization. Compositional generalization allows robots to combine learned skills to tackle new tasks, while skill generalization enables these skills to adapt to different situations. The authors propose using structural priors, which define the dependencies of behaviors, to enhance the connection between skill composition and the underlying policies. Their approach, called Agent Priors-guided Policy Learning (APPL), shows significant improvements in generalization and composition capabilities in various robotic tasks.'}, 'zh': {'title': '通过结构先验提升机器人技能学习与组合', 'desc': '这篇论文探讨了机器人如何通过少量示范学习并实现两种形式的泛化：组合泛化和技能泛化。组合泛化是将技能重新组合以解决新任务，而技能泛化则使得每个技能背后的学习策略能够在新情境中工作。论文提出了一种名为APPL的方法，通过使用每个策略的结构先验作为组合与技能之间的接口，来解决信息丢失的问题。实验结果表明，APPL在不同任务中提高了技能的泛化能力，并支持了新的技能组合。'}}}, {'id': 'https://huggingface.co/papers/2610.02162', 'title': 'World Observer: Joint Actor-Observer Generation for Persistent World Modeling', 'url': 'https://huggingface.co/papers/2610.02162', 'abstract': "Abstract  How can a world model continuously observe regions beyond the actor's current view? Video world models simulate how an environment evolves from an agent's actions, yet remain actor-centric. Once an object leaves the actor's view, they lose direct evidence of its evolution, often failing to preserve its state and dynamics upon re-entry. To address this, we introduce World Observer, which decouples observing from acting by jointly generating a perspective actor for the agent-centric view with one or more panoramic observers that watch selected world regions. This allows objects that leave the actor's view to remain visually evolving in an observer, so their updated states are reflected when they re-enter. We ground the actor and observers by warping from a shared panoramic source for explicit geometric correspondence, and introduce an Observer Sink of high-resolution perspective references to restore fine appearance upon re-entry. Since the observers are decoupled from the actor, they can be placed freely across the scene, extended to multiple locations for broader coverage, and driven by control signals to steer out-of-view evolution. To evaluate out-of-view evolution, we further introduce world-space metrics and a benchmark spanning real and synthetic scenes. World Observer substantially improves out-of-view dynamics while remaining competitive in visual fidelity, camera control, and 3D adherence.", 'score': 71, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'b260be5c6f3586db', 'authors': ['Hyunwook Choi', 'Dahyun Chung', 'Hyunsung Kim', 'Siyoon Jin', 'Jinhyeok Choi', 'Junyoung Seo', 'Seungryong Kim'], 'affiliations': ['KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.02162.jpg', 'data': {'categories': ['#video', '#3d', '#benchmark'], 'emoji': '👁️', 'ru': {'title': 'Наблюдатели за пределами экрана: мировая модель с множественной перспективой', 'desc': 'Статья представляет World Observer — видео модель мира, которая решает проблему отслеживания объектов, выходящих из поля зрения агента. Система использует несвязанную архитектуру, одновременно генерируя перспективное представление для основного актора и панорамные наблюдатели для мониторинга выбранных регионов сцены. Метод использует геометрическое преобразование из общего панорамного источника и специальный механизм восстановления деталей при повторном появлении объектов в поле зрения. Авторы вводят новые метрики для оценки эволюции объектов вне видимой области и демонстрируют значительное улучшение качества предсказания динамики.'}, 'en': {'title': 'Enhancing Out-of-View Dynamics with World Observer', 'desc': "This paper presents a new approach called World Observer, which enhances video world models by allowing agents to observe areas beyond their immediate view. Traditional models lose track of objects once they leave the actor's perspective, but World Observer uses panoramic observers to continuously monitor these objects, ensuring their states are updated and accurately reflected when they re-enter the actor's view. The method employs a shared panoramic source for geometric consistency and introduces an Observer Sink for high-resolution details upon re-entry. Overall, World Observer improves the tracking of out-of-view dynamics while maintaining high visual quality and effective camera control."}, 'zh': {'title': '超越视野的观察：World Observer模型', 'desc': '本文提出了一种名为World Observer的模型，旨在解决在机器学习中，智能体在视野之外观察环境的挑战。传统的视频世界模型通常以智能体为中心，一旦物体离开视野，智能体就无法继续跟踪其状态和动态。World Observer通过引入全景观察者，允许智能体在不直接观察的情况下，仍然能够获取物体的演变信息。该模型通过共享全景源进行几何对应，并引入高分辨率的参考点，以确保物体重新进入视野时能够恢复其细致外观。'}}}, {'id': 'https://huggingface.co/papers/2609.39027', 'title': 'A Missing Piece for Trustworthy AI Reviewers: From Benchmarking Rhetorical Robustness to SciCore Review', 'url': 'https://huggingface.co/papers/2609.39027', 'abstract': 'Abstract  AI reviewers can assign different judgments to manuscripts that report the same science in different wording, potentially rewarding rhetorical optimization over scientific improvement. We formulate Rhetorical Robustness as the joint requirement of stability across content-preserving rewrites and discrimination across papers. We introduce RobustReview, a controlled full-manuscript benchmark with 1,260 manuscript versions, and evaluate 30 reviewer configurations. The benchmark reveals false robustness, where low rewrite sensitivity coincides with score collapse across papers, and shows that human alignment and rhetorical robustness rank reviewers differently. Moreover, the evaluated content-focused prompting protocol does not consistently improve robustness across backbones. Motivated by these findings, we introduce SciCore, a dual-branch reviewer that averages a full-manuscript judgment with a judgment based on an extracted, structured science core. This design combines manuscript-level assessment with a content-normalized view intended to reduce rhetorical sensitivity. In our primary GPT-5.5 comparison, SciCore achieves a leading joint stability-discrimination profile among the benchmarked reviewers while maintaining competitive human alignment. These results identify rhetorical robustness as a distinct evaluation target and demonstrate the potential of science-core review to improve it.', 'score': 70, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'fa4dd83acf598cd4', 'authors': ['Chenguang Wang', 'Ming Li', 'Chengrui Fan', 'Jianpeng Chen', 'Han Chen', 'Tianyi Zhou', 'Dawei Zhou'], 'affiliations': ['MBZUAI', 'University of Maryland', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.39027.jpg', 'data': {'categories': ['#science', '#benchmark', '#interpretability', '#dataset', '#alignment'], 'emoji': '📋', 'ru': {'title': 'Риторическая робастность AI-рецензентов: от слов к науке', 'desc': 'Исследование показывает, что AI-рецензенты могут давать разные оценки одинаковым научным работам, переписанным другими словами, что награждает риторическую оптимизацию вместо научного прогресса. Авторы предлагают концепцию риторической робастности как требования стабильности при переформулировке содержания и дискриминативности между работами. Они создают бенчмарк RobustReview с 1260 версиями рукописей и обнаруживают ложную робастность, где низкая чувствительность к переписыванию совпадает с коллапсом различения между статьями. Решение SciCore использует двухветвевую архитектуру, объединяя оценку полного текста с анализом структурного научного ядра, чтобы снизить риторическую чувствительность и улучшить робастность.'}, 'en': {'title': 'Enhancing AI Reviewers with Rhetorical Robustness', 'desc': 'This paper addresses the issue of AI reviewers giving different scores to similar scientific manuscripts based on their wording rather than their actual content. It introduces the concept of Rhetorical Robustness, which requires that reviews remain stable when the text is rewritten while still being able to differentiate between different papers. The authors present RobustReview, a benchmark with numerous manuscript versions to evaluate various reviewer configurations, revealing that some reviewers may appear robust but fail to discriminate effectively. To improve this, they propose SciCore, a dual-branch reviewer that combines overall manuscript evaluation with a focus on the core scientific content, achieving better stability and discrimination in reviews.'}, 'zh': {'title': '提升评审的修辞稳健性', 'desc': '本文探讨了AI评审在评估手稿时可能受到措辞影响的问题，提出了修辞稳健性这一概念，强调在内容保持不变的情况下，评审结果应保持稳定。我们引入了RobustReview基准，包含1260个手稿版本，评估了30种评审配置，发现低重写敏感性可能导致评分不一致。为了解决这一问题，本文提出了SciCore，一个双分支评审系统，结合了完整手稿评估和基于提取的科学核心的评估，以减少对修辞的敏感性。实验结果表明，SciCore在评审的稳定性和区分性方面表现优异，同时保持了与人类评审的一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.36585', 'title': 'Transformers Stop Thinking Too Early, and a Tiny LoRA Fixes It', 'url': 'https://huggingface.co/papers/2609.36585', 'abstract': 'Abstract  Pretrained transformers use little of their depth to follow references in context. Thirteen base models reliably follow only 1.4-3.6 lines, and extra pretrained loops add little. A task-trained rank-8 LoRA at one early layer extends this computation with all model weights frozen. Qwen3-8B improves from 15.5% to 99% exact accuracy on 24-line chains; a longer-trained LoRA reaches 50 lines. Ouro-1.4B reaches 60 lines after four loops and at least 160 after eight. The LoRA starts a relay: program lines pass on their chain identity through a short range of middle layers. Frozen heads read progressively further up the chain, and removing parent-line attention stops the relay. A frozen-model measurement locates the last useful intervention layer within tolerance in three of four held-out models. Task-specific LoRAs also improve MuSiQue. Default answers therefore understate the computation accessible through a tiny edit. Code and an interactive demo are available at https://lunamos.github.io/stop-thinking-too-early/', 'score': 62, 'issue_id': 3364, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'a90781fd1554bf9a', 'authors': ['Zehao Jin', 'Ruixuan Deng', 'Junran Wang'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.36585.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🔗', 'ru': {'title': 'Малые изменения раскрывают глубокие способности: LoRA для отслеживания длинных цепочек контекста', 'desc': 'Исследование показывает, что предтренированные трансформеры используют лишь малую часть своей глубины для отслеживания контекстных ссылок, следуя только 1.4-3.6 строкам кода. Авторы предлагают использовать низкоранговую адаптацию (LoRA) в одном раннем слое с заморозкой остальных весов модели, что значительно расширяет её способность к обработке длинных цепочек. Применение этого метода повысило точность модели Qwen3-8B с 15.5% до 99% на 24-строчных цепях, а специально обученная LoRA достигла 50 строк. Результаты демонстрируют, что даже минимальное редактирование предтренированной модели раскрывает скрытые вычислительные возможности, превосходящие стандартные показатели.'}, 'en': {'title': 'Unlocking Long-Range Context in Transformers with LoRA', 'desc': "This paper discusses how pretrained transformer models struggle to maintain context over long sequences. It introduces a method using Low-Rank Adaptation (LoRA) to enhance the model's ability to follow references in longer text chains. By freezing model weights and adding task-specific LoRAs, the authors demonstrate significant improvements in accuracy for tasks involving longer sequences. The findings suggest that small modifications can greatly increase the computational capabilities of these models, allowing them to handle more complex tasks effectively."}, 'zh': {'title': '微小编辑，巨大的提升！', 'desc': '这篇论文探讨了预训练变换器在上下文中跟踪引用的能力。研究发现，基础模型通常只能有效跟踪1.4到3.6行文本，而通过额外的预训练循环，效果提升有限。使用任务训练的LoRA方法可以在冻结模型权重的情况下，显著提高模型在长文本链上的准确性。结果表明，微小的编辑可以显著提升模型的计算能力，尤其是在特定任务上。'}}}, {'id': 'https://huggingface.co/papers/2610.02205', 'title': 'ROWBench: Do Video Models Render What the Program Specifies?', 'url': 'https://huggingface.co/papers/2610.02205', 'abstract': "Abstract  Programmable world models separate executable dynamics from visual generation, offering a promising foundation for next-generation game engines. However, their visual adherence to explicit rules and interactions remains insufficiently evaluated. Existing benchmarks assess visual quality, controllability, and instruction or physical adherence, but rarely test fidelity to fine-grained, program-specified world events. We introduce PROWBench, comprising 170 programmatically constructed episodes and 600 proxy videos covering diverse scenes and interactions. PROWBench logs entity states and timestamped events, including those outside the camera's field of view, as replayable world records, from which it renders synchronized views and proxy representations. This enables generated videos to be checked against the observable consequences of program execution. An extensible framework constructs scenes, controls behaviors, and can render each camera view in different representations, such as coarse 3D, and bounding boxes. The benchmark covers first- and third-person perspectives, with synchronized multi-view observations available for a subset of episodes. Grounded in these records, PROWBench evaluates entity control, long-horizon memory, and, with two VLM-based metrics, Logic-Render Alignment and Interaction Success Rate, adherence to the prescribed timeline and the visual realization of timestamped engine-recorded events.", 'score': 58, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'cf01165b11bb989c', 'authors': ['Zheng-Hui Huang', 'Guixu Lin', 'Yu-Ju Tsai', 'Jian-Kai Zhu', 'Fengbo Lan', 'Yu-Lun Liu', 'Yung-Yu Chuang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.02205.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#games', '#long_context', '#video', '#3d'], 'emoji': '🎮', 'ru': {'title': 'Проверка точности визуальной реализации программных правил в world models', 'desc': 'В статье предложен PROWBench — новый бенчмарк для оценки программируемых world models, которые отделяют исполняемую динамику от визуальной генерации. Бенчмарк содержит 170 программно сконструированных эпизодов и 600 прокси-видео с логированием состояний сущностей и timestamped событий, включая события вне поля зрения камеры. Фреймворк позволяет проверять соответствие генерируемых видео предписанной логике программы через две новые метрики на основе VLM: Logic-Render Alignment и Interaction Success Rate. Такой подход обеспечивает комплексную оценку контроля над сущностями, долгосрочной памяти и точной визуализации запрограммированных взаимодействий в world models.'}, 'en': {'title': 'Evaluating Visual Fidelity in Programmable World Models with PROWBench', 'desc': 'This paper presents PROWBench, a new benchmark designed to evaluate the visual fidelity of programmable world models in game engines. It focuses on assessing how well these models adhere to specific program-defined events and interactions, which is often overlooked in existing evaluations. PROWBench includes a comprehensive set of 170 episodes and 600 videos that capture various scenes and interactions, allowing for detailed analysis of entity states and events. The framework supports multiple perspectives and representations, enabling researchers to measure the accuracy of visual outputs against the expected outcomes of program execution.'}, 'zh': {'title': 'PROWBench：提升可编程世界模型的视觉一致性', 'desc': '可编程世界模型将可执行的动态与视觉生成分开，为下一代游戏引擎提供了有希望的基础。然而，它们在视觉上对明确规则和交互的遵循仍然评估不足。我们引入了PROWBench，它包含170个程序构建的剧集和600个代理视频，涵盖多样的场景和交互。该基准测试评估实体控制、长期记忆以及与时间戳引擎记录事件的视觉实现的一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.37533', 'title': 'E-MoE: Enhanced Mixture-of-Experts for Non-Factorized Diffusion Language Models', 'url': 'https://huggingface.co/papers/2609.37533', 'abstract': "Abstract  Masked diffusion models (MDMs) generate sequences by progressively unmasking several tokens per denoising step, but their reverse process is typically factorized over positions, limiting sample quality in the few-step regime where diffusion's speed advantage over autoregressive decoding matters most. A recent line of work introduces a continuous Gaussian latent, trained as a variational autoencoder, to capture correlations across positions, but such approaches are prone to posterior collapse, where the latent is silently ignored. We propose Enhanced Mixture-of-Experts (E-MoE), which builds the reverse process as a mixture of factorized distributions over a discrete shared latent given by the expert-routing decisions of a Mixture-of-Experts (MoE) backbone, without increasing active parameters over the factorized baseline. Across synthetic multi-modal benchmarks, binarized MNIST, and LM1B, E-MoE improves few-step generation over factorized baselines.", 'score': 57, 'issue_id': 3363, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '070cb78c996a1197', 'authors': ['Arseny Ivanov', 'Alexander Kolesov', 'Alexander Korotin', 'Ivan Oseledets', 'Mikhail Goncharov'], 'affiliations': ['AXXX, Moscow, Russia', 'Applied AI Institute, Moscow, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2609.37533.jpg', 'data': {'categories': [], 'emoji': '🎭', 'ru': {'title': 'Смесь экспертов для быстрой генерации в диффузионных моделях', 'desc': 'В статье предлагается подход Enhanced Mixture-of-Experts (E-MoE) для улучшения маскированных диффузионных моделей, которые генерируют последовательности путём прогрессивного демаскирования токенов. Основная проблема существующих методов заключается в том, что обратный процесс часто факторизуется по позициям, что снижает качество генерации при малом числе шагов денойзинга. Предложенный метод строит обратный процесс как смесь факторизованных распределений над дискретным скрытым состоянием, определяемым роутингом экспертов в архитектуре Mixture-of-Experts, без увеличения активных параметров. Экспериментальные результаты на синтетических бенчмарках, бинаризованном MNIST и LM1B демонстрируют улучшение качества генерации с малым числом шагов.'}, 'en': {'title': 'Enhancing Few-Step Generation with E-MoE', 'desc': 'Masked diffusion models (MDMs) are used to generate sequences by unmasking multiple tokens at each step. However, their reverse process often limits the quality of samples when generating in fewer steps. To address this, the paper introduces Enhanced Mixture-of-Experts (E-MoE), which utilizes a mixture of distributions to better capture correlations across positions without increasing the number of parameters. The results show that E-MoE significantly enhances the quality of few-step generation compared to traditional factorized methods across various benchmarks.'}, 'zh': {'title': '增强型专家混合模型提升生成质量', 'desc': '本文提出了一种增强型专家混合模型（E-MoE），用于改进掩蔽扩散模型（MDMs）的生成过程。传统的MDMs在去噪步骤中通常按位置分解，限制了在少步生成时的样本质量。E-MoE通过专家路由决策构建一个离散共享潜变量的混合分布，从而捕捉位置之间的相关性，而不增加活跃参数。实验结果表明，E-MoE在合成多模态基准、二值化MNIST和LM1B数据集上，相比于传统的分解基线，显著提高了少步生成的效果。'}}}, {'id': 'https://huggingface.co/papers/2610.00906', 'title': 'ActiveSaddler: Automated Curriculum Learning for Agent Harness Optimization', 'url': 'https://huggingface.co/papers/2610.00906', 'abstract': 'Abstract  Automated harness optimization can substantially improve LLM agents by iteratively updating their prompts, tool interfaces, and control logic from execution feedback. However, existing methods primarily optimize how the harness is updated while largely fixing which training scenarios generate the feedback that drives those updates. As the harness evolves, the scenarios most useful for further optimization can change, suggesting that the training curriculum itself should adapt alongside the harness. We formulate this missing dimension of harness optimization as an automated curriculum learning problem and introduce ActiveSaddler. ActiveSaddler models the evolving curriculum as a non-stationary bandit with dynamically instantiated optimization targets. It abstracts recurring failures into reusable failure-pattern arms, estimates the potential learning progress from further targeting each pattern, and adaptively balances revisiting known weaknesses with exploring unseen scenarios for new ones. Optimization outcomes continually update both the set of discovered failure patterns and their priorities, allowing the curriculum to co-evolve with the harness. Experiments on GAIA2 and Terminal-Bench 2.0 show that ActiveSaddler consistently discovers stronger harnesses, improving test Pass@1 by 4.4 and 7.5 percentage points over the same harness optimizer using a scenario order fixed before optimization, respectively. Ablations further show that these gains depend on dynamically constructing optimization targets, estimating their evolving utility, and balancing continued optimization with new failure discovery. Together, these results establish automated curriculum learning as a new crucial optimization dimension for harness optimization.', 'score': 56, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'bbcc243ce096ebfa', 'authors': ['Sungho Park', 'Wonjoong Kim', 'Jue Zhang', 'Wook-Shin Han', 'Pengfei Gao', 'Chanyoung Park', 'Yongqiang Yao', 'Rao Fu', 'Elsie Nallipogu', 'Qingwei Lin', 'Victor Rühle'], 'affiliations': ['KAIST', 'Microsoft', 'POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2610.00906.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🎯', 'ru': {'title': 'Адаптивная программа обучения для эволюции LLM агентов', 'desc': 'В этой работе предложен метод ActiveSaddler для автоматической оптимизации агентов на основе LLM путём адаптивного выбора обучающих сценариев. Система моделирует процесс обучения как нестационарный многорукий бандит, который группирует повторяющиеся ошибки в переиспользуемые шаблоны отказов и оценивает потенциал обучения от каждого из них. Алгоритм балансирует между углублением работы с известными слабостями и исследованием новых сценариев, позволяя учебной программе развиваться вместе с оптимизируемой системой. Экспериментальные результаты показывают улучшение метрик Pass@1 на 4.4-7.5 процентных пункта по сравнению с методами фиксированного порядка сценариев.'}, 'en': {'title': "Evolving Training for Smarter AI: ActiveSaddler's Dynamic Curriculum Learning", 'desc': 'This paper presents ActiveSaddler, a novel approach to optimize the training harness of large language model (LLM) agents by integrating automated curriculum learning. It addresses the limitation of existing methods that fix training scenarios while optimizing harness updates, proposing that the training curriculum should evolve alongside the harness. ActiveSaddler treats the curriculum as a non-stationary bandit problem, dynamically adjusting optimization targets based on recurring failure patterns and their learning potential. Experimental results demonstrate that this adaptive approach significantly enhances harness performance, highlighting the importance of curriculum evolution in the optimization process.'}, 'zh': {'title': '自动化课程学习：优化的关键维度', 'desc': '这篇论文介绍了一种名为ActiveSaddler的自动化课程学习方法，用于优化大型语言模型（LLM）代理的执行反馈。现有方法主要关注如何更新优化工具，而忽视了生成反馈的训练场景的变化。ActiveSaddler将课程视为一个非平稳的赌博问题，动态调整优化目标，并通过重用失败模式来提高学习效率。实验结果表明，ActiveSaddler能够显著提升优化效果，使得测试通过率提高了4.4到7.5个百分点。'}}}, {'id': 'https://huggingface.co/papers/2610.00574', 'title': 'Make Sparse Rewards Count: Density-Aware Reward Aggregation for Multi-Reward RL', 'url': 'https://huggingface.co/papers/2610.00574', 'abstract': "Abstract  Multi-reward reinforcement learning trains large language models to satisfy multiple behavioral objectives simultaneously. Reward-wise normalization, as used in GDPO, preserves reward-specific relative information within rollout groups, but different objectives can still exhibit uneven learning progress. We study this behavior through advantage energy, the sum of a reward's squared advantages over a batch. Under idealized GDPO normalization, we show that this energy is proportional to active-group density: the fraction of rollout groups in which the reward provides nonzero relative advantages. This reveals a residual batch-level signal imbalance and provides a basis for calibrating reward contributions. Based on this relation, we propose Density-Aware Reward Aggregation (DARA). We derive an inverse-square-root density correction that gives greater weight to signals from less frequently active rewards. DARA computes its weights from each rollout batch, adapting to changes in reward activity throughout training without modifying the underlying policy optimization objective. Experiments on tool calling and mathematical reasoning show that DARA learns the targeted behaviors faster than GDPO, reaching high format compliance in up to 26% fewer training steps on tool calling and near-saturated length compliance in up to 65% fewer steps on mathematical reasoning, while remaining competitive in final performance. Our code is available at https://github.com/zhaihaotian/DARA.", 'score': 50, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '44413c735feb9e91', 'authors': ['Tong Zheng', 'Skylar Zhai', 'Zhan Cheng', 'TianMing Sha', 'Youling Huang', 'Shuo Zhou', 'Shaotong Qi', 'Jingcheng Liang', 'Xuwei Ding', 'Pengcheng Xu'], 'affiliations': ['Beijing Foreign Studies University', 'Dalian University of Technology', 'Kuaishou Technology', 'Southeast University', 'Stony Brook University', 'University of Chinese Academy of Sciences', 'University of Minnesota Twin Cities', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2610.00574.jpg', 'data': {'categories': ['#reasoning', '#training', '#rlhf', '#math', '#alignment', '#open_source', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка множественных целей через адаптивное взвешивание сигналов обратной связи', 'desc': 'Статья посвящена улучшению обучения больших языковых моделей с использованием множественных целевых функций (мульти-ревард обучение с подкреплением). Авторы выявили проблему неравномерного прогресса обучения разных целевых функций и проанализировали это явление через концепцию «advantage energy» — сумму квадратов преимуществ по пакету данных. На основе математического анализа они предложили метод DARA (Density-Aware Reward Aggregation), который адаптивно взвешивает вклады разных целевых функций, уделяя больше внимания редко активирующимся сигналам. Экспериментально показано, что DARA ускоряет сходимость на 26-65% быстрее по сравнению с существующим методом GDPO, сохраняя при этом конкурентоспособность по финальной производительности.'}, 'en': {'title': 'Boosting Learning Efficiency with Density-Aware Reward Aggregation', 'desc': 'This paper introduces a method called Density-Aware Reward Aggregation (DARA) for multi-reward reinforcement learning, which helps large language models learn multiple objectives more effectively. The authors analyze the uneven learning progress of different rewards using a concept called advantage energy, which measures the effectiveness of rewards in training. DARA adjusts the importance of rewards based on their activity levels, giving more weight to less frequently active rewards to balance the learning process. Experiments demonstrate that DARA accelerates the learning of targeted behaviors, achieving better results in fewer training steps compared to existing methods like GDPO.'}, 'zh': {'title': '密度感知奖励聚合：提升多目标学习效率', 'desc': '多奖励强化学习旨在同时满足多个行为目标。我们提出了一种新的方法，称为密度感知奖励聚合（DARA），它通过调整奖励信号的权重来提高学习效率。DARA根据每个回合批次的奖励活动情况动态计算权重，从而更好地利用不常激活的奖励信号。实验结果表明，DARA在工具调用和数学推理任务中比传统方法GDPO更快地学习目标行为，减少了训练步骤。'}}}, {'id': 'https://huggingface.co/papers/2610.01215', 'title': 'AutoGUIWorld: Image Generators as Visual World Models for GUI Agent', 'url': 'https://huggingface.co/papers/2610.01215', 'abstract': 'Abstract  GUI agents require high-quality interaction trajectories to learn how software environments respond to actions, maintain state, and support multi-step workflows. However, the diversity of available trajectories is constrained by the applications, interface states, and workflows accessible in the underlying environments. Expanding this coverage requires deploying increasingly diverse and complex software, with specialized applications imposing additional installation, configuration, and runtime costs. We introduce AutoGUIWorld, a data generation framework that combines the visual priors of image generators with the task knowledge of a planner to synthesize GUI interaction trajectories without deploying or running the corresponding software environments. AutoGUIWorld samples initial GUI scenes from structured specifications of operating-system context, visual appearance, and interface state, and generates tasks conditioned on those scenes. A planner then specifies atomic actions and their intended visual consequences, while an image generator iteratively edits the current screenshot to produce subsequent observations. Action grounding and transition-level quality filtering yield 79,266 spatially annotated step-level training samples across Ubuntu, Windows, macOS, and Chrome. Fine-tuning Qwen3.5-35B-A3B on AutoGUIWorld trajectories improves the mean task score on OSWorld from 33.0% to 40.8% and the task success rate on ScienceBoard from 14.0% to 32.2%. These results show that generated trajectories improve GUI-agent performance on real desktop and scientific tasks.', 'score': 49, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e0072d0523271137', 'pdf_title_img': 'assets/pdf/title_img/2610.01215.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#data'], 'emoji': '🖥️', 'ru': {'title': 'Синтез данных для обучения GUI-агентов через генеративные модели', 'desc': 'Авторы представляют AutoGUIWorld — фреймворк для синтетической генерации данных взаимодействия с графическим интерфейсом без необходимости развёртывания реальных приложений. Система комбинирует визуальные модели для генерации изображений с плланировщиком задач, чтобы создавать траектории действий агента на основе структурированных спецификаций интерфейса. Фреймворк генерирует начальные сцены GUI, формирует задачи, планирует атомарные действия и итеративно редактирует скриншоты для создания последовательности наблюдений. Обучение LLM на синтетических данных значительно улучшило производительность агентов на реальных задачах операционных систем и научных приложениях.'}, 'en': {'title': 'Enhancing GUI Agents with AutoGUIWorld: Generate, Train, Succeed!', 'desc': 'This paper presents AutoGUIWorld, a framework designed to generate high-quality interaction trajectories for GUI agents without needing to run actual software environments. It combines visual image generation with task planning to create diverse and complex GUI scenarios, which helps in training agents more effectively. By sampling GUI scenes and generating tasks based on structured specifications, the framework produces a large dataset of annotated training samples. The results demonstrate that fine-tuning a model on these generated trajectories significantly enhances the performance of GUI agents in real-world tasks.'}, 'zh': {'title': 'AutoGUIWorld：无需运行软件的GUI交互轨迹生成', 'desc': '本论文介绍了AutoGUIWorld，这是一个数据生成框架，用于合成高质量的GUI交互轨迹，而无需实际运行软件环境。该框架结合了图像生成器的视觉先验和规划器的任务知识，能够从操作系统上下文、视觉外观和界面状态的结构化规范中采样初始GUI场景。通过规划器指定原子动作及其预期的视觉后果，图像生成器则迭代编辑当前屏幕截图以生成后续观察。实验结果表明，使用AutoGUIWorld生成的轨迹显著提高了GUI代理在实际桌面和科学任务中的表现。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.38024', 'title': 'Retrieval-Augmented Skill Optimization via Cross-Harness Adaptation', 'url': 'https://huggingface.co/papers/2609.38024', 'abstract': 'Abstract  An agent skill is a reusable, actionable natural-language artifact that guides an agent to perform a task effectively under a given harness. Recent studies have explored the optimization of agent skills, contributing to a growing collection of publicly available skills spanning diverse tasks, domains, and harnesses. Despite millions of publicly shared skills, existing skill optimization methods largely overlook this accumulated knowledge, instead relying solely on expensive agent rollouts to iteratively refine skills for a target task. To address this, we propose Retrieval-Augmented Skill Optimization (RASO), a framework that leverages an external skill corpus as prior knowledge throughout skill optimization. RASO retrieves relevant knowledge from existing skills and adapts it to the target task and harness via Cross-Harness Adaptation, accounting for mismatches in both domain and harness. RASO comprises two complementary stages: Retrieval-Augmented Skill Initialization (RASI) constructs a knowledge-grounded initial skill without requiring agent rollouts, while Retrieval-Augmented Skill Update (RASU) iteratively refines the skill by retrieving external knowledge guided by execution feedback. Across four agent benchmarks and two models, extensive experiments show that RASO consistently outperforms baselines without retrieval-augmented skill initialization and updating.', 'score': 46, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '11f5a85f5f7f8192', 'authors': ['Jaewon Chu', 'Ji Soo Lee', 'Jihwan Park', 'Dohwan Ko', 'Jeehye Na', 'Seunghun Lee', 'Taehoon Lee', 'Minseo Yoon', 'Minseok Joo', 'Yunyang Xiong', 'Hyunwoo J. Kim'], 'affiliations': ['KAIST', 'Korea University', 'Meta AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.38024.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rag'], 'emoji': '🔄', 'ru': {'title': 'Переиспользование накопленного опыта для эффективной оптимизации навыков агентов', 'desc': 'В статье предлагается фреймворк RASO для оптимизации навыков агентов, который использует внешний корпус существующих навыков в качестве предварительного знания. Метод включает два этапа: инициализацию навыка на основе извлечённого знания без дорогостоящих взаимодействий агента и итеративное уточнение навыка с использованием обратной связи от выполнения. Ключевая идея — адаптация знаний из разных источников к целевой задаче через механизм Cross-Harness Adaptation, который учитывает различия в доменах и окружениях. Экспериментальные результаты на четырёх бенчмарках показывают, что RASO значительно превосходит методы без retrieval-augmented компонентов.'}, 'en': {'title': 'Enhancing Agent Skills with Knowledge Retrieval', 'desc': 'This paper introduces Retrieval-Augmented Skill Optimization (RASO), a new framework designed to enhance the performance of agent skills by utilizing existing knowledge from a skill corpus. RASO addresses the inefficiencies of traditional skill optimization methods that depend heavily on costly agent rollouts by incorporating relevant skills from a database. The framework consists of two main components: RASI, which creates an initial skill based on prior knowledge, and RASU, which refines the skill using feedback from its execution. Experimental results demonstrate that RASO significantly improves skill performance across various benchmarks compared to methods that do not use retrieval-augmented techniques.'}, 'zh': {'title': '提升智能体技能优化的全新方法', 'desc': '本文提出了一种名为检索增强技能优化（RASO）的框架，旨在提高智能体技能的优化效率。RASO利用外部技能库作为先验知识，通过跨环境适应将相关知识应用于特定任务。该框架包括两个阶段：检索增强技能初始化（RASI）和检索增强技能更新（RASU），前者在不依赖智能体回合的情况下构建初始技能，后者则通过执行反馈迭代优化技能。实验结果表明，RASO在多个基准测试中表现优于传统方法。'}}}, {'id': 'https://huggingface.co/papers/2609.39378', 'title': 'EgoTools: Towards Tool-Centric Reasoning in Real-World Egocentric Videos', 'url': 'https://huggingface.co/papers/2609.39378', 'abstract': 'Abstract  Real-world embodied tasks, from everyday activities to professional procedures, require agents to act under physical constraints while tracking evolving object and task states. Tool use sits at the heart of such tasks, as many everyday and professional activities are tool-mediated. Understanding them requires reasoning about affordances, hand-tool-object geometry, procedural progress, and causal effects on target objects. Yet despite strong performance on perception-oriented video tasks such as captioning and general video QA, current multimodal video models remain limited in this form of tool-centric embodied reasoning. Progress in this direction has been limited by the lack of real-world egocentric data and diagnostic benchmarks. To address this gap, we introduce EgoTools, the first comprehensive suite for egocentric tool-use understanding. It consists of two complementary components: EgoTools-Data, a large-scale corpus of 100 hours of tool-centric egocentric recordings with synchronized audio, dense captions, reasoning-heavy narrations, and supplementary 3D information; and EgoTools-Bench, a diagnostic benchmark of 1,000 QA pairs across four tracks that cover tool-use understanding from perception and geometry to procedure and causal reasoning. Experimental results show that current models still struggle to ground tool use in visual evidence: Gemini-3.1-Pro achieves 66.9% overall accuracy but only 51.7% on Perception & Grounding. Beyond evaluation, we validate EgoTools-Data as a training resource. On the full 1,000-question benchmark, full supervised fine-tuning improves Qwen3-VL-8B-Instruct from 50.0% to 60.9%, under strict source-video separation. Together, these results establish EgoTools as a unified resource for both training and diagnostic evaluation of real-world egocentric tool-use understanding.', 'score': 45, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '2b4e46584ffe38e6', 'authors': ['Shulin Tian', 'Junsu Kim', 'Shuai Liu', 'Hao Li', 'Yujiao Shen', 'Sihan Li', 'Zhe Yang', 'Yeongon Kim', 'Feiyu Li', 'Jialin Wu', 'Yichi Zhang', 'Wenhui Wang', 'Runmao Yao', 'Yuhao Dong', 'Zhaoxi Chen', 'Fangzhou Hong', 'Antonino Furnari', 'Jingkang Yang', 'Hongyuan Zhu', 'Ziwei Liu'], 'affiliations': ['A*STAR', 'FDU', 'KAIST', 'PKU', 'S-Lab, Nanyang Technological University', 'School of Biological Sciences, Nanyang Technological University', 'University of Catania'], 'pdf_title_img': 'assets/pdf/title_img/2609.39378.jpg', 'data': {'categories': ['#video', '#multimodal', '#dataset', '#benchmark', '#robotics'], 'emoji': '🔨', 'ru': {'title': 'Понимание использования инструментов через эгоцентрическое видение', 'desc': 'В работе представлен EgoTools — первый комплексный набор ресурсов для понимания использования инструментов в эгоцентрических видео. Датасет включает 100 часов видеозаписей от первого лица с плотными аннотациями, описаниями рассуждений и 3D-информацией, а также диагностический бенчмарк из 1000 вопросов по восприятию, геометрии, процедурам и причинно-следственным связям. Экспериментальные результаты показывают, что современные мультимодальные модели, такие как Gemini-3.1-Pro и Qwen3-VL, испытывают затруднения при привязке использования инструментов к визуальным доказательствам, достигая только 51,7% точности на задачах восприятия. EgoTools служит унифицированным ресурсом для обучения и оценки моделей в задаче понимания реальных эгоцентрических действий с инструментами.'}, 'en': {'title': 'EgoTools: Advancing Tool Use Understanding in AI', 'desc': 'This paper introduces EgoTools, a new resource designed to enhance understanding of tool use in real-world tasks through egocentric data. It includes a large dataset of 100 hours of recordings that capture tool interactions along with detailed annotations and 3D information. Additionally, it provides a benchmark with 1,000 questions to evaluate models on various aspects of tool use, such as perception and ca
