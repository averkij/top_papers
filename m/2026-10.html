it chose, and the environment's responses. Reusing this experience for learning requires identifying a decision to revise and testing a concrete alternative. We introduce the Agent Error Dataset (AED), comprising 50,228 error-diagnosis pairs from 9,961 source tasks across 33 environments, 19 harness families, and 23 policy models in text-based agent systems. We retain source traces and execution metadata to support cross-setting failure analysis and re-diagnosis without repeating the original rollout. Our five-stage Agentic Error-to-Training (AET) pipeline collects natural failures, generates diagnoses and proposed corrections, and checks them against recorded evidence. Where replay is supported, we compare corrections with original-action retries from the same checkpoint under matched execution settings. We then construct separate training views for diagnosis and actor recovery. Across 3,062 matched replay pairs, first-proposal corrections raise verifier pass rates from 18.4% to 51.1%, a gain of 32.7 percentage points. Using a separately frozen diagnosis release, full-diagnosis fine-tuning on 1,656 source tasks raises Qwen3-8B's exact-step agreement with internal teacher labels from 47.2% to 63.6%, averaged over three seeds on a 943-case holdout. The strongest prompted reference in this comparison scores 54.7%, and mean agreement improves at each of four increasing training-set sizes. In a single-seed comparison of actor-training recipes, action-only repair training scores 6.67 percentage points higher on WebShop-lite than success-only training.", 'score': 22, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '662dccb1e706c6ae', 'authors': ['Kunlun Zhu', 'Xuyan Ye', 'Yibo Li', 'Cheng Qian', 'Beibin Li', 'Heng Ji'], 'affiliations': ['Apodex'], 'pdf_title_img': 'assets/pdf/title_img/2609.40111.jpg', 'data': {'categories': ['#training', '#dataset', '#agents', '#rlhf'], 'emoji': '🔧', 'ru': {'title': 'Учимся на ошибках агентов: как превратить неудачи в знание', 'desc': 'В статье предлагается набор данных Agent Error Dataset (AED) для обучения языковых моделей на ошибках агентов, содержащий более 50 тысяч пар ошибок и их диагнозов из различных сценариев и сред. Авторы разработали пятиэтапный конвейер Agentic Error-to-Training (AET), который собирает неудачные попытки агентов, генерирует диагнозы проблем и предлагает исправления, проверяя их против сохранённых данных выполнения. Эксперименты показывают, что предложенные исправления повышают точность верификации с 18.4% до 51.1%, а fine-tuning на диагнозах улучшает согласованность модели Qwen3-8B с эталонными метками с 47.2% до 63.6%. Подход демонстрирует, что детальный анализ ошибок без повторного выполнения сценариев позволяет значительно улучшить качество обучения агентов.'}, 'en': {'title': 'Learning from Mistakes: Enhancing Agent Performance through Error Analysis', 'desc': 'This paper presents the Agent Error Dataset (AED), which captures valuable information from unsuccessful agent rollouts in machine learning. The dataset includes over 50,000 error-diagnosis pairs from various tasks and environments, allowing for detailed analysis of agent failures. The authors propose a five-stage pipeline called Agentic Error-to-Training (AET) to utilize this data for improving agent performance through diagnosis and corrective actions. Results show that using first-proposal corrections significantly enhances the success rates of agents, demonstrating the potential of leveraging past failures for better training outcomes.'}, 'zh': {'title': '利用错误数据提升智能体学习效果', 'desc': '本文介绍了一种新的数据集，称为代理错误数据集（AED），它包含来自多个环境和任务的错误诊断对。通过分析这些错误，研究者可以识别需要修正的决策，并测试具体的替代方案。我们提出的五阶段代理错误到训练（AET）流程能够收集自然失败，生成诊断和建议的修正，并与记录的证据进行对比。实验结果表明，使用这些修正可以显著提高模型的性能，尤其是在行动修复训练中。'}}}, {'id': 'https://huggingface.co/papers/2609.32264', 'title': 'LANTERN: Illuminating Hidden Mathematical Knowledge in Language Models', 'url': 'https://huggingface.co/papers/2609.32264', 'abstract': "Abstract  Language models can now prove theorems, but people still decide which problems to pursue. We ask whether a model's internal representations can help identify promising mathematical connections. We develop LANTERN, a fast, cost-efficient pipeline that uses a classifier over pretrained-model activations to rank candidate relations, followed by staged filtering, hypothesis generation, executable verification, and analytical checking. Applied to the On-Line Encyclopedia of Integer Sequences (OEIS), LANTERN ranked 50 million pairs among 10,000 frequently referenced sequences and produced 62 verified relations between pairs without an existing OEIS cross-reference. A content screen retained 13 relations worth presenting; nine of these are informative or insightful, including four which are entirely novel to the best of our knowledge: none appears in the OEIS or in our targeted literature search. The entire end-to-end process including classifier training, candidate ranking, filtering and verification took under 8 hours.", 'score': 19, 'issue_id': 3359, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '5a8b35093161964d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Автоматическое открытие математических закономерностей через активации языковых моделей', 'desc': 'В работе предложен LANTERN — эффективный конвейер для обнаружения скрытых математических связей между последовательностями с использованием внутренних представлений языковых моделей. Система применяет классификатор на активациях предварительно обученной модели для ранжирования кандидатов, а затем использует многоэтапную фильтрацию, генерацию гипотез и верификацию. На базе энциклопедии целочисленных последовательностей OEIS алгоритм обработал 50 миллионов пар и открыл 62 новые математические отношения, из которых 9 являются информативными, включая 4 полностью новых закономерности. Весь процесс, от обучения классификатора до проверки результатов, занял менее 8 часов.'}, 'en': {'title': 'LANTERN: Illuminating New Mathematical Connections with AI', 'desc': 'This paper introduces LANTERN, a machine learning pipeline designed to identify promising mathematical connections using language models. It employs a classifier that analyzes the internal activations of pretrained models to rank potential relationships between mathematical sequences. The system efficiently filters and verifies these relationships, resulting in the discovery of novel connections that were not previously documented. Overall, LANTERN demonstrates a rapid and effective approach to theorem proving in mathematics by leveraging advanced machine learning techniques.'}, 'zh': {'title': '利用LANTERN发现数学新关系', 'desc': '本文介绍了一种名为LANTERN的快速高效管道，用于利用预训练模型的内部表示来识别有前景的数学关系。该方法通过分类器对候选关系进行排名，并进行分阶段过滤、假设生成、可执行验证和分析检查。LANTERN在整数序列在线百科全书（OEIS）上应用，成功从10000个常引用序列中排名出5000万对，并验证了62个新关系。整个过程，包括分类器训练、候选排名、过滤和验证，耗时不到8小时。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.37863', 'title': "It's Not What the Image Shows: Irrelevant Context Destabilises VLM Judges Without Informing Them", 'url': 'https://huggingface.co/papers/2609.37863', 'abstract': "Abstract  Vision-language models (VLMs) are increasingly used in place of human annotators, making it important that substitutability tests reflect the model rather than incidental evaluation conditions. We introduce MIST, the Misleading-Image Stress Test: 200 English sentences, each built around a phrase readable either figuratively or literally and shown with an aligned image depicting its reading, a misleading image depicting the opposite, or no image at all. The guidelines require the label to be decided from the sentence alone, so no image should change any answer. We expected each image to pull a judge's labels toward the sense it depicts, and neither kind did. Across thirteen VLM judges, an aligned image changed 20.5% of labels and a misleading one 19.4%, close for every judge and both above the 11.6% produced by deleting the ignore-the-image instruction with the image left in place. Yet only 37% of the labels that differ between the two images moved toward the sense shown, and agreement with our human annotators is unchanged whether the image is absent, aligned or misleading. The effect is smaller in the seven judges that pass the alt-test than in the six that never do, but present in all of them: what moves a judge is that an image is there, not which of the two it is, so a substitutability verdict describes a configuration as much as a model.", 'score': 14, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'e1c3925ac94b3f0f', 'authors': ['Nagham Omar', 'Mahmoud Jabarin', 'Kinan Ibraheem', 'Lotem Peled-Cohen'], 'affiliations': ['Faculty of Data and Decision Sciences, Technion'], 'pdf_title_img': 'assets/pdf/title_img/2609.37863.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Наличие изображения важнее его содержания: о надёжности оценки VLM моделей', 'desc': 'В работе представлен тест MIST для оценки того, насколько хорошо модели зрения и языка (VLM) могут заменить человеческих аннотаторов. Исследователи создали набор из 200 английских предложений с фразами, которые можно понимать буквально или фигурально, и показывали их с тремя вариантами изображений: соответствующим смыслу фразы, противоположным смыслом или без изображения. Неожиданно обнаружилось, что для всех 13 протестированных VLM-моделей наличие изображения влияет на результаты одинаково (около 20%), независимо от того, совпадает ли оно с текстом или противоречит ему. Авторы заключают, что эффект зависит не от содержания изображения, а просто от его присутствия, что говорит о важности учёта условий оценки при проверке подменяемости моделей на место людей.'}, 'en': {'title': 'MIST: Testing the True Impact of Images on VLMs', 'desc': 'This paper introduces MIST, a test designed to evaluate how vision-language models (VLMs) respond to images that are either aligned with or misleading to the text they accompany. The study reveals that both aligned and misleading images significantly influence the labels assigned by judges, indicating that the mere presence of an image affects decision-making more than its content. Despite this influence, the agreement between VLM outputs and human annotators remains consistent regardless of the image type, suggesting that VLMs may not fully understand the context of the images. The findings highlight the need for careful evaluation of VLMs, as their performance can be affected by the testing conditions rather than their inherent capabilities.'}, 'zh': {'title': '图像影响判断，模型评估需更全面', 'desc': '本文介绍了一种新的测试方法，称为MIST（误导图像压力测试），用于评估视觉语言模型（VLMs）的替代性。该测试使用200个英语句子，每个句子配有一个相关图像、一个误导图像或没有图像，旨在检验图像对判断的影响。结果显示，相关图像和误导图像都对判断结果产生了显著影响，但影响的方向并不一致。研究表明，判断者的选择更多是受到图像存在的影响，而不是图像的具体内容，因此替代性评估不仅反映模型本身，也反映了测试的配置。'}}}, {'id': 'https://huggingface.co/papers/2609.39841', 'title': 'DyRAD: Radar Novel View Synthesis for Dynamic Driving Scenes', 'url': 'https://huggingface.co/papers/2609.39841', 'abstract': "Abstract  Reconstructing dynamic driving scenes from recorded sensor data supports closed-loop evaluation of autonomous driving systems by synthesizing observations beyond the original trajectory. Unlike cameras and LiDAR, radar measures radial velocity directly through Doppler. Yet existing radar novel-view synthesis fails to exploit this capability: methods addressing dynamic scenes reconstruct only range-azimuth tensors, while methods that render Doppler assume static scenes. Moreover, because radar processing spreads each reflection across multiple bins, existing representations absorb this spread into scene geometry, causing it to render incorrectly when the viewpoint moves. We present DyRAD, which models dynamic driving scenes using static background reflectors and motion-tracked dynamic point reflectors to render complete range-azimuth-Doppler (RAD) tensors. Reflector velocities are derived from object tracks and projected onto the line of sight, making Doppler both a rendered output and supervision for those tracks. Crucially, we render reflectors through a fixed analytic point-spread function (PSF) derived from the radar's signal-processing chain, preventing sensor-induced spread from being baked into the scene representation. Beyond improving scene reconstruction, this separation also enables zero-shot sensor-configuration transfer, allowing the same reconstructed scene to be rendered under different radar specifications without refitting. We evaluate DyRAD on RADIal, Boreas, and a synthetic benchmark across both on-path poses and displaced viewpoints untested by prior work. On RADIal, DyRAD recovers radar detections in 90.7% of reference-detected objects, compared with 26.9% for the strongest baseline.", 'score': 14, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '5fa6e9976c23ce06', 'authors': ['Merav Keidar', 'Tomer Borreda', 'Rajalakshmi Nandakumar', 'Or Litany'], 'affiliations': ['Cornell Tech', 'NVIDIA', 'Technion'], 'pdf_title_img': 'assets/pdf/title_img/2609.39841.jpg', 'data': {'categories': ['#3d', '#synthetic', '#dataset', '#benchmark', '#cv'], 'emoji': '📡', 'ru': {'title': 'Доплеровский радар встречает синтез новых видов динамических сцен', 'desc': 'Статья описывает DyRAD — метод для синтеза новых представлений динамических сцен дорожного движения из данных радара. Ключевое отличие работы заключается в том, что авторы используют радиальную скорость (эффект Доплера) как напрямую измеряемую характеристику, а не только как побочный продукт, что позволяет более точно моделировать движение объектов. Модель разделяет сцену на статичные отражатели фона и динамические точечные отражатели объектов, отслеживая их движение для синтеза полных тензоров range-azimuth-Doppler. Критически важным является использование аналитической функции рассеяния точки (PSF), которая исключает артефакты сенсора из геометрии сцены и позволяет переносить обученную сцену на радары с разными характеристиками без переобучения.'}, 'en': {'title': 'Revolutionizing Radar Scene Reconstruction with DyRAD', 'desc': 'This paper introduces DyRAD, a novel approach for reconstructing dynamic driving scenes using radar data. Unlike previous methods that either ignore Doppler effects or misrepresent dynamic objects, DyRAD effectively combines static and dynamic reflectors to create accurate range-azimuth-Doppler (RAD) tensors. By utilizing a fixed point-spread function, DyRAD prevents sensor-induced distortions from affecting the scene representation, allowing for better scene reconstruction and adaptability to different radar configurations. The results show significant improvements in object detection accuracy compared to existing methods, demonstrating the effectiveness of this new approach.'}, 'zh': {'title': 'DyRAD：动态场景重建的新方法', 'desc': '本论文提出了一种名为DyRAD的方法，用于从传感器数据重建动态驾驶场景，以支持自动驾驶系统的闭环评估。与传统的相机和激光雷达不同，雷达通过多普勒效应直接测量径向速度，但现有的雷达新视角合成方法未能充分利用这一能力。DyRAD通过静态背景反射器和动态点反射器的运动跟踪来建模动态场景，从而生成完整的范围-方位-多普勒（RAD）张量。该方法不仅提高了场景重建的准确性，还实现了零-shot传感器配置转移，使得在不同雷达规格下重建的场景无需重新调整。'}}}, {'id': 'https://huggingface.co/papers/2609.33355', 'title': 'Unmask the State: When Does State Adaptation Matter for Masked Diffusion Language Models', 'url': 'https://huggingface.co/papers/2609.33355', 'abstract': 'Abstract  Masked diffusion language models (MDMs) admit flexible generation orders, making the unmasking strategy an inference decision. Existing methods vary in how they prioritize positions, control parallelism, restrict selection regions, revise predictions, or plan future denoising, yet it remains unclear when these choices should change during generation. We study this question through strategy reversals, where an alternative action becomes preferable to a fixed choice. We organize MDM inference into five axes--score, cardinality, region, commitment, and planning--and define adaptation opportunity as the one-step utility advantage of the best candidate action over a validation-selected fixed action. This view shows that adaptation value depends on both the frequency and magnitude of such reversals. Across three MDMs and ten tasks, adaptation opportunities are highly heterogeneous, with some regimes exhibiting concentrated and predictable one-step gains. This motivates selective adaptation: lightweight detectors calibrated on validation prompts identify high-opportunity states, capturing, for example, 56.9 percent of the candidate-set oracle opportunity by adapting only the top 10 percent of states on LLaDA-8B constrained JSON filling. Our transition-level results suggest that state adaptation is most useful when applied selectively rather than uniformly.', 'score': 14, 'issue_id': 3358, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': '384cddb1cdaf81e9', 'authors': ['Injin Kong', 'Sunghwan Choi', 'Yohan Jo'], 'affiliations': ['Graduate School of Data Science, Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2609.33355.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Адаптивные стратегии развёртывания масок: когда менять решение во время генерации', 'desc': 'В работе исследуются маскированные диффузионные языковые модели, которые позволяют генерировать текст в произвольном порядке, что делает стратегию раскрытия масок критической для качества. Авторы предлагают систематический анализ инференции через пять ключевых параметров: оценку качества предсказаний, количество параллельных операций, выбор регионов, фиксацию выборов и планирование дальнейшего процесса. Они вводят концепцию адаптивных возможностей, которая измеряет, когда имеет смысл изменить стратегию во время генерации, и показывают, что эффективная адаптация должна быть избирательной. Экспериментальные результаты демонстрируют, что применение лёгких детекторов для выявления состояний с высоким потенциалом адаптации позволяет достичь значительного улучшения при модификации только 10% процентов шагов генерации.'}, 'en': {'title': 'Selective Adaptation in Masked Diffusion Models for Enhanced Performance', 'desc': 'This paper explores how masked diffusion language models (MDMs) can adapt their generation strategies during inference to improve performance. It introduces the concept of adaptation opportunities, which are situations where changing the generation strategy can lead to better outcomes. The authors analyze five axes of MDM inference and demonstrate that selective adaptation, where only certain high-opportunity states are adjusted, can significantly enhance model efficiency. Their findings indicate that not all states require adaptation, and focusing on the most promising ones yields substantial benefits.'}, 'zh': {'title': '选择性适应：提升掩蔽扩散语言模型的生成效率', 'desc': '本文研究了掩蔽扩散语言模型（MDMs）在生成过程中的灵活性，特别是如何选择解码策略。我们提出了五个维度来组织MDM推理，包括得分、基数、区域、承诺和规划，并定义了适应机会为最佳候选动作相对于固定动作的一步效用优势。研究表明，适应价值依赖于策略反转的频率和幅度，且在不同任务中适应机会表现出高度异质性。通过选择性适应，我们可以有效识别高机会状态，从而提高生成效率。'}}}, {'id': 'https://huggingface.co/papers/2609.38660', 'title': 'Breaking Babel: A Self-Evolving Multi-Agent System for Long-Form Subtitle Translation', 'url': 'https://huggingface.co/papers/2609.38660', 'abstract': 'Abstract  Long-form subtitle translation requires reasoning over discourse and cultural context spanning episodes or entire series, while maintaining consistent terminology and style. Existing single-LLM methods are largely sentence-level, and multi-agent systems often use static workflows that do not adapt to scene complexity or production context. We propose SMART, a Self-evolving Multi-Agent system for long-foRm subtitle Translation. During test-time training, SMART builds persistent series-level memory and translates a subset of sentences through a dynamic router and Mixture-of-Agents layer with tools for terminology verification, subtitle constraint validation, and contextual retrieval. A judge-refiner loop scores candidates and uses textual critiques to update agent prompts and routing policies without retraining the underlying LLMs. During test-time inference, the evolved configuration translates the remaining series. We also introduce Subtitle Arena, covering 14 genres, 2--198 episodes per series, production years 1959--2023, and 15 target locales, together with SubMQM, a subtitle-adapted MQM framework with seven dimensions and 19 error categories. SMART achieves the best overall MQM score in all 15 Subtitle Arena directions, reducing average penalty by 6.9% over the strongest competing agent system. On the public MuSC benchmark, SMART obtains the best model result across all four language pairs and also achieves the best human-evaluation result, with an overall score of 4.50/5.', 'score': 14, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'db1b548ea851bca9', 'authors': ['Haibo Jin', 'Xinjie Li', 'Najmeh Sadoughi', 'Yang Liu', 'Yibo Wang', 'Zhu Liu', 'Yuzong Liu'], 'affiliations': ['Amazon', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.38660.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#benchmark', '#dataset', '#machine_translation', '#agents', '#multilingual'], 'emoji': '🎬', 'ru': {'title': 'Умная система многоагентного перевода с самообучением во время работы', 'desc': 'Статья описывает SMART — систему на основе нескольких агентов для перевода длинных субтитров сериалов. Система учитывает контекст всего сериала, ведёт память о терминологии и стиле, и использует динамическую маршрутизацию для выбора оптимального агента. Во время тестирования система обучается сама себя, обновляя подсказки агентов на основе критики судьи без переобучения базовых LLM моделей. Авторы также создали большой датасет Subtitle Arena с субтитрами из 14 жанров и новую метрику оценки качества SubMQM, специально адаптированную для субтитров.'}, 'en': {'title': 'SMART: Evolving Subtitle Translation for Contextual Accuracy', 'desc': 'The paper presents SMART, a Self-evolving Multi-Agent system designed for translating long-form subtitles while considering discourse and cultural context. Unlike traditional methods that operate at the sentence level, SMART utilizes a dynamic routing mechanism and a Mixture-of-Agents layer to adapt to the complexity of scenes and production contexts. It incorporates a judge-refiner loop that allows for real-time updates to agent prompts and routing policies based on performance feedback, enhancing translation quality without retraining the underlying models. The system demonstrates superior performance on the Subtitle Arena and MuSC benchmarks, achieving the best scores in multiple translation directions and language pairs.'}, 'zh': {'title': '智能字幕翻译的自我进化系统', 'desc': '这篇论文提出了一种名为SMART的自我进化多智能体系统，用于长篇字幕翻译。SMART在测试时训练中构建了持久的系列级记忆，通过动态路由和混合智能体层翻译句子，并提供术语验证和字幕约束验证的工具。该系统通过评审-改进循环对候选翻译进行评分，并利用文本批评更新智能体提示和路由策略，而无需重新训练基础的语言模型。SMART在多个字幕领域中表现优异，显著降低了翻译错误率，并在公共基准测试中获得了最佳结果。'}}}, {'id': 'https://huggingface.co/papers/2609.38537', 'title': 'Systematically Exploring the Capabilities of GPT-6 Astra as Embodied Policies', 'url': 'https://huggingface.co/papers/2609.38537', 'abstract': "Abstract  GPT-6 Astra exhibits a remarkable ability to generate numerical robot actions, extending its role beyond high-level planning. To assess Astra's capabilities as general-purpose embodied policies, we conduct comprehensive evaluations across six domains, examining direct control, cooperation with learned policies, and feedback-driven adaptation. In gripper manipulation, Astra can correct task targets and prepare contact conditions for subsequent policy execution; hybrid control with π0.5 achieves 48% success on the evaluated RoboDojo subset. In dexterous manipulation, hybrid control achieves 50% success in ten experience-guided DexJoCo trials, while direct in-hand control struggles to coordinate finger contacts. In mobile manipulation, hybrid control reaches 38.7% success on the evaluated RoboCasa365. In navigation, Astra leads our local comparisons, reaching 92% success on RxR instruction following and 82% on HM3D object search, although search incurs substantial detours. In locomotion, dense motion-reference generation remains unreliable: none of five sequential attempts on a single obstacle course reaches the goal, despite improvements in stability and forward progress. In humanoid loco-manipulation, Astra exceeds baseline methods on 13 of 30 HumanoidBench tasks with pretrained whole-body controllers. These findings reveal a gap between useful task decisions and reliable physical control. Inference latency further constrains practical control: across 50 RoboDojo instances per condition, policy-assisted and direct control consume 624.8 million and 1.132 billion tokens. A 30-second locomotion run requires 250 model calls averaging 39.86 seconds each, with physics paused during inference.", 'score': 14, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '14d31c79d8c77446', 'pdf_title_img': 'assets/pdf/title_img/2609.38537.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#inference'], 'emoji': '🤖', 'ru': {'title': 'От планирования к действию: языковые модели как универсальные политики управления роботами', 'desc': 'Исследование демонстрирует, что большая языковая модель GPT-6 Astra может генерировать низкоуровневые управляющие команды для роботов, функционируя как обобщённая политика обучения с подкреплением. Авторы провели комплексную оценку на шести типах задач, включая манипуляцию объектами, мобильную манипуляцию, навигацию и локомоцию, используя гибридный подход сочетания модели с обученными политиками. Результаты показали частичный успех: модель достигала 48-50% точности в манипуляции, 92% в навигации с инструкциями, но боролась с генерацией надёжных плотных движений для локомоции. Основное ограничение заключается в разрыве между принятием высокоуровневых решений и надёжным физическим управлением, а также в высокой вычислительной стоимости инференса, требующей миллиардов токенов и десятков секунд для коротких выполнений задач.'}, 'en': {'title': 'Bridging the Gap: From Planning to Action in Robotics with GPT-6 Astra', 'desc': "The paper presents GPT-6 Astra, a machine learning model designed to generate numerical actions for robots, enhancing its functionality beyond just planning. It evaluates Astra's performance in various tasks, including gripper manipulation, dexterous manipulation, mobile manipulation, navigation, and locomotion, highlighting its ability to adapt and cooperate with learned policies. The results show that while Astra excels in navigation and humanoid tasks, it struggles with direct control in dexterous manipulation and locomotion, indicating a gap between decision-making and physical execution. Additionally, the paper discusses the challenges of inference latency, which affects the model's practical control capabilities in real-time scenarios."}, 'zh': {'title': 'Astra：机器人控制的新突破', 'desc': 'GPT-6 Astra展示了生成数值机器人动作的卓越能力，不仅限于高层次规划。我们在六个领域对Astra的通用嵌入式策略进行了全面评估，包括直接控制、与学习策略的合作以及基于反馈的适应。在抓取操作中，Astra能够纠正任务目标并为后续策略执行准备接触条件；混合控制在评估的RoboDojo子集上取得了48%的成功率。在移动操作中，混合控制在RoboCasa365的评估中达到了38.7%的成功率，尽管在导航和人形运动操作中，Astra在多个任务中超越了基线方法。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.38445', 'title': 'AIM: Agentic Idea Management for Automated Research', 'url': 'https://huggingface.co/papers/2609.38445', 'abstract': 'Abstract  Frontier LLMs are increasingly used to automate scientific research through iterative search. We distinguish idea-driven search from solution-driven search and identify three core challenges: organizing evolving research ideas, selecting promising directions, and maintaining alignment between ideas and their implementations. To address these challenges, we introduce the Agentic Idea Manager (AIM), a fully autonomous framework for managing and exploring research directions in idea-driven automated research. Inspired by Bayesian optimization, AIM uses an Agentic Surrogate and an Agentic Acquisition mechanism to organize discovered ideas and guide their selection. A Solution Auditor maintains idea-solution integrity, while a Resource Planner adaptively allocates the remaining experimental budget across parallel search branches. Experiments on 10 AutoLab benchmark tasks show that AIM surpasses the strongest baseline by 1.6 percentage points on System Optimization tasks and 4.9 percentage points on long-horizon Model Development & CUDA tasks. Notably, AIM reaches the best baseline performance up to 3.1x faster in wall-clock time. We further provide a theoretical analysis of when searching over ideas becomes beneficial. Our analysis shows that explicit idea-level allocation makes semantic coverage directly controllable, and that broader coverage becomes increasingly valuable when competitive research directions are sparse among many plausible alternatives. Project Page: https://imhgchoi.github.io/agentic-idea-manager/', 'score': 13, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '2ce8eb62e6a6b0bb', 'authors': ['Hyeong Kyu Choi', 'Bhavana Dalvi Mishra', 'Jiefeng Chen', 'Mihir Parmar', 'Rui Meng', 'Chun-Liang Li', 'Xiangru Tang', 'Sharon Li', 'Jinsung Yoon', 'Tomas Pfister'], 'affiliations': ['Google Cloud AI Research', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.38445.jpg', 'data': {'categories': ['#benchmark', '#training', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Интеллектуальное управление идеями для автоматизированного научного поиска', 'desc': 'В статье представляется Agentic Idea Manager (AIM) — полностью автономная система для управления направлениями научных исследований, которая использует LLM для итеративного поиска. Система основана на принципах байесовской оптимизации и состоит из агентов-суррогатов, механизма выбора и аудитора решений, которые организуют идеи, выбирают перспективные направления и поддерживают согласованность между идеями и их реализацией. AIM демонстрирует превосходство над базовыми методами на задачах оптимизации систем и разработки моделей, достигая лучших результатов в 3.1 раза быстрее. Теоретический анализ показывает, что явное распределение ресурсов на уровне идей улучшает семантическое покрытие поискового пространства, что особенно ценно при наличии множества конкурирующих направлений.'}, 'en': {'title': 'Revolutionizing Research with the Agentic Idea Manager', 'desc': 'This paper presents the Agentic Idea Manager (AIM), a framework designed to enhance automated scientific research by managing and exploring research ideas. It differentiates between idea-driven and solution-driven searches, addressing challenges like organizing evolving ideas and ensuring alignment with implementations. AIM employs Bayesian optimization techniques, utilizing an Agentic Surrogate and Acquisition mechanism to effectively select and organize research directions. Experimental results demonstrate that AIM significantly outperforms existing methods in both speed and accuracy on various benchmark tasks.'}, 'zh': {'title': '自动化研究的新思路：Agentic Idea Manager', 'desc': '本论文介绍了一种名为Agentic Idea Manager (AIM) 的框架，用于自动化科学研究中的想法驱动搜索。AIM通过贝叶斯优化的灵感，利用代理替代物和代理获取机制来组织和选择研究方向。该框架解决了组织不断演变的研究想法、选择有前景的方向以及保持想法与实现之间一致性等核心挑战。实验结果表明，AIM在系统优化和长时间模型开发任务中显著超越了最强基线，且在时间效率上也表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.39222', 'title': 'DC-SAE: Deep Compression Semantic Autoencoder for Faster Diffusion Convergence', 'url': 'https://huggingface.co/papers/2609.39222', 'abstract': "Abstract  High-compression tokenizers are essential for scaling latent image generative models. However, aggressive compression creates a fundamental tradeoff between reconstruction fidelity and generation efficiency: high compression image encoder always increases the learning difficulty of diffusion training, resulting in slow model convergence. Recent representation autoencoders speed up the diffusion training by improving the latent feature's expressive capability by replacing VAE encoders with pretrained semantic encoders, yet they are typically limited to moderate compression and lose pixel-level details necessary for faithful reconstruction. To achieve both high compression and fast diffusion training, we propose DC-SAE, a Decoupled Compact Semantic Autoencoder designed for high-compression image generation with accelerated diffusion model convergence. DC-SAE consists of two key components: (1) a macro-level architecture design that leverages semantic encoders to enable higher compression ratios, and (2) a pixel-level encoder that preserves low-level details, ensuring high-fidelity image reconstruction. We empirically demonstrate that DC-SAE performs strongly on image generation tasks, achieving both compact latent representations and efficient training dynamics. Specifically, on the ImageNet dataset with 512 times 512 resolution, DC-SAE achieves 32times spatial compression, with 29.79 PSNR and 3.37 gFID, substantially outperforming the previous state-of-the-art high-compression tokenizer baselines DC-AE by 13.5% and 54.9% on PSNR and gFID, respectively, maintaining comparable throughput and faster diffusion model training convergence. Beyond class-conditional generation, a 1.6B-parameter DiT using DC-SAE achieves 0.84 on GenEval and 86.007 on DPG-Bench for text-to-image generation at 1024times1024 resolution.", 'score': 13, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b1e73e28992fb547', 'authors': ['Xu Huang', 'Ye Huang', 'Zijun Liao', 'Yuwei Niu', 'Xiaojie Li', 'Menghan Zhou', 'De Wen Soh', 'Xiaotong Li', 'Daquan Zhou'], 'affiliations': ['Peking University', 'Singapore University of Technology and Design'], 'pdf_title_img': 'assets/pdf/title_img/2609.39222.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#open_source', '#architecture', '#training', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Сбалансированное сжатие: высокая компрессия без потери качества в генеративных моделях', 'desc': 'Статья посвящена DC-SAE, новому методу сжатия изображений для генеративных диффузионных моделей. Авторы решают проблему компромисса между высокой степенью сжатия и качеством восстановления изображений, предложив архитектуру с двумя компонентами: семантическим энкодером для макроуровневого сжатия и пиксельным энкодером для сохранения деталей. DC-SAE достигает 32-кратного пространственного сжатия на ImageNet при разрешении 512×512 с PSNR 29.79 и gFID 3.37, превосходя предыдущие методы на 13.5% и 54.9% соответственно. Модель обеспечивает как более быструю сходимость обучения diffusion моделей, так и высокое качество при генерации изображений и текст-в-изображение задачах.'}, 'en': {'title': 'DC-SAE: High Compression Meets Fast Diffusion Training', 'desc': 'This paper introduces DC-SAE, a Decoupled Compact Semantic Autoencoder, which addresses the challenges of high-compression tokenization in latent image generative models. The model enhances diffusion training efficiency by utilizing semantic encoders for macro-level architecture while incorporating a pixel-level encoder to maintain essential low-level details for image fidelity. DC-SAE achieves significant spatial compression and outperforms previous models in both image quality metrics and training speed. The results demonstrate its effectiveness in generating high-quality images, particularly in text-to-image tasks at high resolutions.'}, 'zh': {'title': '高压缩与快速收敛的完美结合', 'desc': '高压缩的标记器对于扩展潜在图像生成模型至关重要。然而，过度压缩会导致重建保真度和生成效率之间的基本权衡。为了解决这个问题，本文提出了DC-SAE，一种解耦紧凑语义自编码器，旨在实现高压缩图像生成并加速扩散模型的收敛。DC-SAE通过宏观架构设计和像素级编码器的结合，既提高了压缩比，又保留了低级细节，从而确保了高保真度的图像重建。'}}}, {'id': 'https://huggingface.co/papers/2609.38653', 'title': 'TERRA: Terrain-Aware Reconstruction, Retargeting and Control for Musculoskeletal Locomotion', 'url': 'https://huggingface.co/papers/2609.38653', 'abstract': 'Abstract  Recent advances in musculoskeletal modeling and reinforcement learning have enabled muscle-actuated agents to reproduce increasingly complex human motions. Yet these capabilities remain largely confined to flat ground, in part because motion datasets rarely include aligned terrain geometry and because retargeting terrain interactions to complex musculoskeletal bodies is challenging. We present TERRA, an end-to-end pipeline for terrain-aware retargeting and control of musculoskeletal locomotion. From kinematic trajectories alone, TERRA combines terrain priors, estimated contacts, and negative free-space evidence to recover task-relevant support geometry. TERRA further considers anatomical, tendon-continuity, and contact constraints during retargeting. Using the resulting motion-terrain pairs from five datasets, we successfully train a single muscle-actuated control policy on 9.4 hours of diverse locomotion. Across reconstruction, retargeting, and held-out tracking benchmarks, TERRA improves terrain accuracy, sharply reduces anatomical and interaction violations, and achieves the highest observed completion rate over supported terrain families. Overall, TERRA provides a practical route from scene-less motion data to muscle-actuated locomotion over diverse non-flat terrain. Project website: https://cnai.epfl.ch/terra/', 'score': 8, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'f16c33a86a37b010', 'authors': ['Merkourios Simos', 'Chengkun Li', 'Bianca Ziliotto', 'Alexander Mathis'], 'affiliations': ['EPFL'], 'pdf_title_img': 'assets/pdf/title_img/2609.38653.jpg', 'data': {'categories': ['#robotics', '#rl', '#dataset'], 'emoji': '🚶', 'ru': {'title': 'От данных о движениях к мышечному управлению на неровной местности', 'desc': 'В статье представлена TERRA — система для автоматического преобразования кинематических данных движений человека на мышечно-управляемых агентов, которые могут двигаться по сложному рельефу. Система восстанавливает геометрию опорных поверхностей, используя априорные знания о рельефе и оценки контактных точек, без необходимости в исходных данных о местности. При переносе движений на мышечные модели учитываются анатомические ограничения, непрерывность сухожилий и физические взаимодействия с поверхностью. Авторы обучили единую нейросетевую политику управления на девяти часах разнообразных локомоторных движений из пяти датасетов и достигли лучших результатов в точности взаимодействия с рельефом и завершении траекторий.'}, 'en': {'title': 'TERRA: Bridging Motion Data and Complex Terrain Navigation', 'desc': 'This paper introduces TERRA, a novel pipeline designed for terrain-aware retargeting and control of musculoskeletal locomotion. It effectively combines kinematic trajectories with terrain priors and contact estimations to accurately model how agents interact with various terrains. TERRA also incorporates anatomical and contact constraints to ensure realistic motion, leading to improved performance in locomotion tasks. The results demonstrate that TERRA significantly enhances terrain accuracy and reduces violations in anatomical and interaction constraints, enabling muscle-actuated agents to navigate complex environments more effectively.'}, 'zh': {'title': 'TERRA：实现复杂地形下的肌肉驱动运动控制', 'desc': '本文介绍了一种名为TERRA的端到端管道，用于肌肉驱动的运动控制和地形感知重定向。TERRA通过结合运动轨迹、地形先验、接触估计和负自由空间证据，恢复与任务相关的支撑几何形状。它在重定向过程中考虑了解剖学、肌腱连续性和接触约束。通过使用来自五个数据集的运动-地形配对，TERRA成功训练出了一种单一的肌肉驱动控制策略，显著提高了地形准确性并减少了解剖和交互违规。'}}}, {'id': 'https://huggingface.co/papers/2609.38541', 'title': 'ThinkV2V: Unleashing the Reasoning Capability of MLLMs for Instruction-Guided Video Editing', 'url': 'https://huggingface.co/papers/2609.38541', 'abstract': 'Abstract  Instruction-guided video editing has made significant progress, yet existing methods use multimodal large language models (MLLMs) primarily as semantic encoders, so they often fall short in working with implicit edits that require causal or semantic reasoning. To bridge this fundamental gap in video editing, we propose ThinkV2V, a reasoning-driven framework for complex instruction-guided video editing, explicitly activating MLLM thinking before visual generation. At its core, ThinkV2V builds on a practical MLLM-to-DiT architecture to turn explicit thinking over the source video and instruction into refined conditioning signals for video editing. Further, we equip it with a dedicated training and inference recipe, combining Progressive Curriculum Training, which gradually cultivates the model from basic editing to reasoning-intensive cases, with Inference-Time Thinking Scaling, which iteratively refines candidate prompts and selects the most reliable one, to better elicit reasoning in challenging editing scenarios. We also curate the ThinkV2V-150K dataset and introduce ThinkV2V-Bench to support training and evaluation of video editing with implicit intent and causal reasoning. Experimental results demonstrate the state-of-the-art performance of ThinkV2V on both complex and standard editing scenarios, in which our 5B-scale DiT model substantially outperforms larger 10B-scale baselines.', 'score': 8, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '5589d5ded16be51c', 'pdf_title_img': 'assets/pdf/title_img/2609.38541.jpg', 'data': {'categories': ['#multimodal', '#diffusion', '#video', '#open_source', '#architecture', '#dataset', '#benchmark', '#training', '#reasoning'], 'emoji': '🎬', 'ru': {'title': 'Мышление перед действием: рассуждение для интеллектуального редактирования видео', 'desc': 'В работе предлагается ThinkV2V — фреймворк для редактирования видео по текстовым инструкциям, который использует многомодальные большие языковые модели (MLLM) не просто как кодировщики признаков, а как инструменты для логического рассуждения. Ключевая идея заключается в том, что модель сначала размышляет над исходным видео и инструкцией, а затем генерирует уточненные сигналы управления для диффузионной модели трансформера (DiT). Метод обучается с использованием прогрессивного обучения по куррикулуму, постепенно переходя от простых редактирований к сложным случаям, требующим причинно-следственного анализа. Авторы создали новый датасет ThinkV2V-150K и бенчмарк для оценки редактирования видео с неявными намерениями, достигнув выдающихся результатов с компактной 5-миллиардной моделью.'}, 'en': {'title': 'Empowering Video Editing with Reasoning-Driven Frameworks', 'desc': "The paper introduces ThinkV2V, a new framework for video editing that enhances the use of multimodal large language models (MLLMs) by incorporating reasoning capabilities. Unlike traditional methods that treat MLLMs merely as semantic encoders, ThinkV2V activates MLLM thinking to improve the editing process, especially for complex instructions. It employs a unique MLLM-to-DiT architecture to generate better conditioning signals for video editing, and utilizes Progressive Curriculum Training to develop the model's reasoning skills over time. The framework is validated with the ThinkV2V-150K dataset and shows superior performance in both standard and complex editing tasks compared to existing models."}, 'zh': {'title': '推理驱动的视频编辑新框架', 'desc': '本论文提出了一种名为ThinkV2V的框架，旨在改善指令引导的视频编辑。现有方法主要将多模态大语言模型（MLLM）用作语义编码器，难以处理需要因果或语义推理的隐式编辑。ThinkV2V通过在视觉生成之前激活MLLM的思维，提供了更精细的条件信号，从而提升视频编辑的效果。此外，论文还介绍了专门的训练和推理方法，以逐步培养模型的推理能力，并通过ThinkV2V-150K数据集和ThinkV2V-Bench支持训练和评估。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.38426', 'title': 'LoopVL: Recurrent Visual Intelligence', 'url': 'https://huggingface.co/papers/2609.38426', 'abstract': 'Abstract  We introduce LoopVL to study whether Loop Transformers can be effectively extended to vision- language models. LoopVL combines Module-Loop and Model-Loop computation to iteratively update a unified vision-language state through shared modules. We train LoopVL from scratch through language pre-training, multimodal training, and post-training. LoopVL outperforms a range of similarly sized and larger non-recurrent models on multimodal understanding and visual reasoning benchmarks. We also observe Visual Aha Moments in LoopVL, characterized by pronounced shifts in visual attention across loops. LoopVL provides practical evidence for recurrent vision-language modeling and offers an intuitive perspective on how shared parameters can support deeper multimodal computation over continuously evolving visual-language states.', 'score': 7, 'issue_id': 3359, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '0715828ebed51428', 'authors': ['Zhe Qian', 'Ziyang Gong', 'Zhongxing Xu', 'Hehan Li', 'Zhonghua Wang', 'Fei Luo', 'Mingxuan Wang', 'Xue Yang', 'Shiwei liu', 'Yanbiao Ma', 'Junchi Yan', 'Jungong Han'], 'affiliations': ['ELLIS Institute Tübingen', 'Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.38426.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Циклические трансформеры для глубокого понимания образов и текста', 'desc': 'В статье представляется LoopVL — модель трансформера с циклической архитектурой для задач компьютерного зрения и обработки естественного языка. Система объединяет Module-Loop и Model-Loop вычисления для итеративного обновления единого визуально-языкового представления через общие параметры. Модель обучается поэтапно: предварительное обучение на текстах, мультимодальное обучение и постобработка. LoopVL демонстрирует превосходящие результаты на бенчмарках понимания мультимодальных данных и визуального рассуждения, при этом раскрывая механизм «визуальных озарений» — резкие сдвиги в распределении внимания между итерациями.'}, 'en': {'title': 'Revolutionizing Vision-Language Interaction with LoopVL', 'desc': 'LoopVL is a new model that combines two types of computation, Module-Loop and Model-Loop, to enhance how vision and language interact. It updates a shared vision-language state in a way that allows for iterative improvements, making it more effective in understanding and reasoning about multimodal data. The model is trained in three stages: starting from language, then combining vision and language, and finally refining its performance. LoopVL shows significant improvements over other models, especially in visual reasoning tasks, and reveals interesting patterns in how it shifts visual attention during processing.'}, 'zh': {'title': 'LoopVL：视觉-语言模型的新突破', 'desc': '本文介绍了LoopVL，旨在研究Loop Transformers是否可以有效扩展到视觉-语言模型。LoopVL结合了模块循环和模型循环计算，通过共享模块迭代更新统一的视觉-语言状态。我们从头开始训练LoopVL，包括语言预训练、多模态训练和后期训练。LoopVL在多模态理解和视觉推理基准测试中超越了多种相似规模和更大规模的非递归模型。'}}}, {'id': 'https://huggingface.co/papers/2609.39685', 'title': 'RoboCoach: World Models as Active Coaches for Compositional Robot Skills', 'url': 'https://huggingface.co/papers/2609.39685', 'abstract': 'Abstract  Long-horizon robot manipulation reuses skills across many task compositions, but improving these compositions with additional end-to-end demonstrations is costly. A practical self-improving system must decide both what to teach next and where to apply that supervision. We present ROBOCOACH, a world-model-guided coaching framework that uses imagined failures to guide demonstration requests and expert updates. Its Route-Imagine-Diagnose-Improve (RIDI) loop executes reusable skill experts inside COACHWORLD, our shared action-conditioned world model, and uses a progress judge to record the first subtask that fails to complete. Aggregated records select which subtask demonstrations to acquire and which expert adapters to update. Across two simulation suites and two real-robot platforms, imagined and deployed success correlate over 22 task-policy pairs (rho = 0.840). Controlled comparisons show that our coaching method outperforms matched baselines under matched data budgets and update schedules. With only 150 additional subtask demonstrations, success rises from 13.3% to 75.0% on Franka and from 40.0% to 83.8% on AgileX. The coached experts also transfer to four held-out compositions, achieving an average success of 35.0%, compared with 0% for a shared-policy baseline updated with uniformly acquired demonstrations. Together, these results show that world models can serve as active coaches, turning imagined failures into targeted supervision for modular policy improvement. Project Page: https://robocoach-ai.github.io/', 'score': 7, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '69f9127eb0ad60d6', 'authors': ['Jiajun Liu', 'Yifan Chen', 'Yichao Liu', 'Jiayi Zhang', 'Ruoqu Chen', 'Shaoxuan Xie', 'Guocai Yao', 'Mengdi Xu', 'Sen Cui', 'Changshui Zhang'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'Renmin University of China', 'Shanghai Qizhi Institute', 'Tsinghua University', 'University of Nottingham'], 'pdf_title_img': 'assets/pdf/title_img/2609.39685.jpg', 'data': {'categories': ['#training', '#robotics', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Воображаемые ошибки как руководство для целевого обучения робота', 'desc': 'В статье предлагается ROBOCOACH — система для самообучения робота, которая использует мировую модель для выбора наиболее эффективных демонстраций и адаптации модульных навыков. Система работает по циклу RIDI: выполняет навыки внутри общей мировой модели, воображает потенциальные ошибки и определяет, какие подзадачи требуют дополнительного обучения. На основе записей воображаемых ошибок система решает, какие демонстрации собирать и какие адаптеры экспертов обновлять. Экспериментальные результаты показывают, что этот подход значительно повышает успешность выполнения сложных манипуляционных задач с минимальными затратами на сбор данных.'}, 'en': {'title': 'ROBOCOACH: Enhancing Robot Skills Through Active Learning from Failures', 'desc': 'The paper introduces ROBOCOACH, a framework designed to enhance robot manipulation skills by leveraging a world model to guide learning. It employs a method called Route-Imagine-Diagnose-Improve (RIDI) to identify and address failures in task execution, allowing robots to request demonstrations for specific subtasks. By analyzing imagined failures, ROBOCOACH effectively selects which skills to improve and which expert adapters to update, leading to significant performance gains. The results demonstrate that this approach not only improves success rates in various tasks but also enables better transfer of learned skills to new task compositions.'}, 'zh': {'title': '利用世界模型提升机器人操控能力', 'desc': '本文介绍了一种名为ROBOCOACH的机器人操控框架，它通过想象失败来指导示范请求和专家更新，从而提高长时间任务的操控能力。ROBOCOACH使用一个共享的世界模型COACHWORLD，执行可重用的技能专家，并通过进度评估记录第一个未完成的子任务。通过聚合记录，系统选择需要获取的子任务示范和更新的专家适配器。在两个仿真套件和两个真实机器人平台上，想象的成功与实际成功之间存在较高的相关性，证明了世界模型可以作为主动教练，利用想象的失败为模块化策略改进提供有针对性的监督。'}}}, {'id': 'https://huggingface.co/papers/2609.40333', 'title': 'I Have a Stream: Making Self-Supervised Learning Work on Continuous Video', 'url': 'https://huggingface.co/papers/2609.40333', 'abstract': 'Abstract  Self-supervised learning draws inspiration from infant visual development, yet standard training pipelines bear little resemblance to it: images are independently sampled and globally shuffled across epochs. We study self-supervised learning from continuous video streams, where frames are consumed in temporal order using strict sliding-window batches, without global reshuffling or multi-epoch replay. To this end, we construct WT++, a 95-hour urban walking-tour video dataset for streaming pretraining. Combined with a comprehensive evaluation suite we find that contrastive and distillation-based methods struggle in this setting, while MAE is more robust but still falls short of standard i.i.d. pretraining. We find that high inter-batch similarity, caused by sliding-window consumption across consecutive batches, does not explain this gap. The main challenge is high intra-batch similarity, where frames within each batch are near-duplicates. To mitigate this, we propose StreamMAE, which preserves the core MAE reconstruction objective while adapting the input pipeline with stream-aware regularization and motion-biased crop selection. StreamMAE outperforms streaming baselines, matches i.i.d. MAE trained on the same video data, remains competitive with ImageNet-pretrained MAE, and scales positively as the pretraining stream grows from 12 to 95 hours.', 'score': 6, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '44c5ce9f5afd941d', 'authors': ['Ivan Martinović', 'Lukas Knobel', 'Yuki M. Asano'], 'affiliations': ['Faculty of Electrical Engineering and Computing, University of Zagreb', 'Fundamental AI Lab, University of Technology Nuremberg'], 'pdf_title_img': 'assets/pdf/title_img/2609.40333.jpg', 'data': {'categories': ['#training', '#optimization', '#cv', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Самообучение на видеопотоках: адаптация MAE для потокового предобучения', 'desc': 'В этой работе исследуется самообучение на непрерывных видеопотоках, где кадры обрабатываются в временном порядке без глобального перемешивания, что более близко к развитию визуального восприятия у детей. Авторы создали датасет WT++ из 95 часов городских прогулок и обнаружили, что контрастивные методы и дистилляция плохо работают в таком сценарии, в то время как MAE более устойчив. Основная проблема состоит в высокой внутрибатч схожести, когда кадры в одном батче являются почти дубликатами друг друга. Для решения этой проблемы предложен StreamMAE, который адаптирует MAE с потоковой регуляризацией и выбором кропов на основе движения, достигая качества, сопоставимого с обучением на независимых выборках.'}, 'en': {'title': 'StreamMAE: Advancing Self-Supervised Learning with Continuous Video Streams', 'desc': 'This paper explores self-supervised learning using continuous video streams, contrasting it with traditional methods that shuffle images randomly. The authors introduce a new dataset, WT++, consisting of 95 hours of urban walking-tour videos, to facilitate this research. They identify that existing contrastive and distillation methods struggle in this streaming context due to high intra-batch similarity, where frames in a batch are very similar. To address this, they propose StreamMAE, which enhances the MAE reconstruction objective with stream-aware techniques, leading to improved performance over previous methods.'}, 'zh': {'title': '流式自监督学习的新突破', 'desc': '自监督学习受到婴儿视觉发展的启发，但标准训练流程与之相去甚远：图像在训练过程中是独立采样并在多个周期中全局打乱。我们研究了从连续视频流中进行自监督学习的方法，采用严格的滑动窗口批次按时间顺序处理帧，而不进行全局重排或多周期重放。我们构建了WT++，一个包含95小时城市步行视频的数据集，用于流式预训练。我们提出的StreamMAE在保持MAE重建目标的同时，适应输入管道，采用流感知正则化和运动偏向裁剪选择，显著提升了性能。'}}}, {'id': 'https://huggingface.co/papers/2609.39903', 'title': 'OSWorld-Science: A Benchmark of Computer Use Agents for Learning and Using Scientific Software', 'url': 'https://huggingface.co/papers/2609.39903', 'abstract': 'Abstract  Scientific software presents a demanding test for computer-using agents based on visual language models (VLMs): completing a research workflow requires interpreting specialized interfaces, manipulating scientific objects, and producing verifiable results. We thus introduce OSWorld-Science, a benchmark and evaluation environment that combines scientifically meaningful tasks, artifact-based evaluation, and an efficient agent harness for studying computer use in the scientific domain. The benchmark contains 12 VLMs and 146 high-quality tasks across several scientific domains and software configurations, covering workflows such as molecular drawing and retrosynthesis, pathology image analysis, statistical computing, and physical simulation. Tasks are developed through expert proposals and iterative human--AI co-design, with selection guided by scientific value and difficulty. Task-specific execution-based evaluators inspect application states and generated artifacts, including molecular structures, segmentation masks, plots, and numerical results, and award partial credit for incomplete outcomes. Our special harness integrates model adapters, interaction-loop control, and trajectory logging to support comparisons of models and interaction strategies. Our results show that current state-of-the-art VLMs with a strong harness still face challenges in addressing key questions in the scientific domains. We also analyze the benchmarking results across multi-linguistics, reasoning efforts, context length and other factors and derive several important conclusions and directions to assist future development. Overall, we provide an integrated framework connecting expert-defined scientific goals to verifiable software outcomes, enabling systematic evaluation of both agent capabilities and harness design in scientific workflows.', 'score': 6, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'eb5125300131b850', 'authors': ['Dingyuan Dai', 'Heli Qi', 'Lei Liu', 'Yinxi Li', 'Baiding Chen', 'Zijun Dou', 'Qingcheng Zeng', 'Qi Kang', 'Oliver Sun', 'Eric Wang', 'Bo Zhou', 'Haixin Wang', 'Yufan Du', 'Shi Bo', 'Ruihan Lin', 'Mengqi Yuan', 'Dunjie Lu', 'Steven Dillmann', 'Yiming Shi', 'Tina Su', 'Amy Xin', 'Minghao Liu', 'Xi Wang', 'Xu Huang', 'Ge Zhang', 'Pengyu Nie', 'Zhen Yang', 'Jie Tang', 'Juanzi Li', 'Weihao Xuan', 'Tianyu Liu'], 'affiliations': ['Boston University', 'Carnegie Mellon University', 'New York University', 'Northwestern University', 'RIKEN AIP', 'Stanford University', 'The University of Hong Kong', 'The University of Tokyo', 'TokenWave.AI', 'Tsinghua University', 'University of California, Berkeley', 'University of California, Los Angeles', 'University of Illinois Chicago', 'University of Waterloo', 'Yale University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39903.jpg', 'data': {'categories': ['#multilingual', '#multimodal', '#dataset', '#benchmark', '#agents', '#survey', '#science', '#long_context', '#reasoning'], 'emoji': '🧬', 'ru': {'title': 'Бенчмарк для оценки способности AI-агентов решать реальные научные задачи', 'desc': 'В работе представлен OSWorld-Science — бенчмарк для оценки способности визуально-языковых моделей выполнять научные задачи с использованием компьютера. Бенчмарк содержит 146 высококачественных задач из различных научных областей, включая молекулярное моделирование, анализ изображений и статистические вычисления. Оценка результатов основана на анализе артефактов — молекулярных структур, масок сегментации, графиков и численных результатов, что позволяет давать частичный кредит за неполные решения. Исследование показывает, что современные state-of-the-art VLMs испытывают существенные трудности при решении ключевых научных задач, и авторы предлагают направления для развития агентов научного взаимодействия.'}, 'en': {'title': 'Benchmarking AI in Scientific Workflows', 'desc': 'This paper introduces OSWorld-Science, a benchmark designed to evaluate visual language models (VLMs) in scientific software environments. It features 12 VLMs and 146 tasks that span various scientific domains, focusing on workflows like molecular drawing and image analysis. The tasks are created through collaboration between experts and AI, ensuring they are scientifically relevant and appropriately challenging. The framework allows for detailed evaluation of VLM performance, highlighting areas for improvement and guiding future research in the intersection of AI and scientific computing.'}, 'zh': {'title': '科学软件评估的新基准', 'desc': '本文介绍了OSWorld-Science，这是一个针对科学软件的基准测试和评估环境，旨在评估基于视觉语言模型（VLMs）的计算机代理在科学领域的应用能力。该基准包含12个VLM和146个高质量任务，涵盖分子绘图、病理图像分析、统计计算和物理模拟等多个科学领域。任务的开发通过专家提案和人机协作设计，确保任务具有科学价值和适当的难度。我们的研究结果表明，尽管当前的VLM在强大的支持下仍面临科学领域中的关键问题，但该框架为系统评估代理能力和设计提供了重要的支持。'}}}, {'id': 'https://huggingface.co/papers/2609.40316', 'title': 'Scaling Laws for Looped Mixture of Experts', 'url': 'https://huggingface.co/papers/2609.40316', 'abstract': 'Abstract  Looped transformers and Mixture-of-Experts (MoE) offer complementary routes to efficient scaling: recurrence increases computational depth at fixed parameters, while MoE sparsity expands total capacity at fixed active compute. Yet existing scaling laws model recurrence or sparsity in isolation. In this work, we introduce Loop Scaling Laws, the first scaling law to jointly model recurrence and sparsity alongside model size and data. At its core is a bounded, sparsity-conditional recurrence mapping that characterizes the effective-parameter gain from looping and how sparsity raises this gain. The laws predict the held-out loss of looped models more accurately than prior alternatives, and recover the standard dense and MoE scaling laws as special cases. Beyond prediction, the fitted laws provide a principled foundation for designing looped MoE models under compute and memory constraints. Downstream evaluations further demonstrate the complementary benefits of the two axes: sparsity delivers ~3x active-parameter efficiency, recurrence yields ~2x total-parameter efficiency on reasoning, and joint scaling further advances the performance frontier. As a practical extension, we show these gains hold at trillion-token scale: at matched training compute, a looped MoE with law-derived recurrence matches a ~2x larger non-looped MoE on the reasoning benchmarks, while enabling test-time scaling through recurrence.', 'score': 6, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '6364aa0d3570c644', 'authors': ['Yanbei Chen', 'Anirudh Goyal', 'Raghuraman Krishnamoorthi'], 'affiliations': ['Meta AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.40316.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training', '#benchmark', '#reasoning'], 'emoji': '⚙️', 'ru': {'title': 'Единые законы масштабирования для рекуррентных сетей и смеси экспертов', 'desc': 'В работе предложены первые законы масштабирования Loop Scaling Laws, которые одновременно моделируют рекуррентность и разреженность (sparsity) наряду с размером модели и объёмом данных. Основу составляет условная по разреженности рекуррентная функция, которая характеризует эффективное увеличение параметров при использовании циклов и показывает, как разреженность усиливает этот прирост. Предложенные законы более точно предсказывают потери на контрольном наборе данных рекуррентных моделей, чем альтернативные подходы, и обобщают стандартные законы масштабирования для плотных и MoE архитектур. Экспериментально показано, что совместное масштабирование по обеим осям достигает ~3x эффективности активных параметров и ~2x эффективности общих параметров на задачах логического вывода, с возможностью масштабирования на триллион токенов.'}, 'en': {'title': 'Unlocking Efficiency: Combining Recurrence and Sparsity in ML Models', 'desc': 'This paper introduces Loop Scaling Laws, which are new guidelines for efficiently scaling machine learning models by combining recurrence and sparsity. Recurrence allows models to process information over time, while sparsity enables models to use fewer active parameters, enhancing capacity without increasing computational load. The proposed laws predict model performance more accurately than previous methods and provide a framework for designing models that balance compute and memory constraints. The findings show that using both techniques together can significantly improve efficiency and performance, especially in large-scale applications.'}, 'zh': {'title': '循环与稀疏性：高效扩展的新法则', 'desc': '本文提出了循环变换器和专家混合模型（MoE）在高效扩展方面的互补路径。我们引入了循环扩展法则，这是第一个同时建模循环和稀疏性以及模型大小和数据的扩展法则。该法则通过一个有界的、条件稀疏的循环映射，描述了循环带来的有效参数增益以及稀疏性如何提升这一增益。实验结果表明，循环模型的预测损失比之前的方法更准确，并且在推理任务中，稀疏性和循环性共同提升了模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.39578', 'title': 'Thinking Outside the Box: Can Language Models Rely on External Guidance Selectively?', 'url': 'https://huggingface.co/papers/2609.39578', 'abstract': 'Abstract  Agent harnesses often improve language models with human-designed workflows, but as models grow more capable, unreliable guidance can increasingly constrain their execution. We call the ability to benefit from useful guidance while overriding unreliable guidance thinking outside the box. We introduce Box^2-Bench, which holds the model and task fixed while varying workflow reliability to isolate how models regulate their reliance on guidance. On Box^2-Bench, frontier models often benefit from reliable guidance but remain vulnerable when it is misleading or becomes unreliable. To test whether this capability can be learned, we train two open-weight models using bad workflows, reserving good workflows for evaluation. We explore two complementary training strategies: counterfactual supervised fine-tuning improves robustness, while outcome-based reinforcement learning can shift the balance toward greater use of helpful workflows. We further find that this behavior extends beyond workflows to other forms of external information, improving peer correction and robustness to corrupted memory. Together, our results identify selective reliance on fallible external information as a dimension of agent reliability not captured by task performance alone.', 'score': 6, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '11131be3aeb2ee8d', 'authors': ['Minghan Wang', 'Boyuan Wang', 'Jinhang Zuo', 'Yuxin Tao', 'Fang kong'], 'affiliations': ['City University of Hong Kong', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2609.39578.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#training', '#agents', '#rlhf', '#alignment'], 'emoji': '🧠', 'ru': {'title': 'Учимся не слепо верить советам: селективная полоза на надежность внешних инструкций', 'desc': 'В статье исследуется проблема того, как языковые модели могут эффективно использовать внешние инструкции и рекомендации, при этом игнорируя ненадежные или ошибочные указания. Авторы создали бенчмарк Box^2-Bench, который позволяет оценивать способность моделей критически относиться к полученному руководству, сохраняя саму модель и задачу неизменными. Они экспериментировали с двумя подходами обучения: fine-tuning с контрфактическими примерами повышает устойчивость к плохим инструкциям, а reinforcement learning на основе результатов помогает моделям лучше использовать полезные рекомендации. Результаты показывают, что способность избирательно полагаться на внешнюю информацию — это важный аспект надежности агентов, который не отражается обычными метриками производительности на задачах.'}, 'en': {'title': 'Thinking Outside the Box: Enhancing Model Reliability with Selective Guidance', 'desc': "This paper discusses how advanced language models can improve their performance by using guidance from workflows designed by humans. However, as these models become more capable, they may also be misled by unreliable guidance. The authors introduce a framework called Box^2-Bench to study how models can learn to rely on helpful guidance while ignoring misleading information. They demonstrate that training strategies like counterfactual supervised fine-tuning and reinforcement learning can enhance the models' ability to selectively use reliable workflows, which also helps in other areas like peer correction and memory reliability."}, 'zh': {'title': '提升模型对可靠指导的依赖性', 'desc': '本文探讨了如何提高语言模型在面对不可靠指导时的表现。我们引入了Box^2-Bench，这是一个固定模型和任务的基准，旨在评估模型对不同可靠性工作流程的依赖程度。研究发现，前沿模型在可靠指导下表现良好，但在误导性或不可靠的指导下仍然脆弱。通过对模型进行反事实监督微调和基于结果的强化学习，我们发现模型能够更好地利用有用的工作流程，从而提高其鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2609.39827', 'title': 'Synthetic Pre-pretraining Survives Scale, but Not as a Grammatical Prior', 'url': 'https://huggingface.co/papers/2609.39827', 'abstract': 'Abstract  Pre-pretraining (PPT) on synthetic non-natural language data improves token efficiency during language model pre-training (PT). Prior work attributes this gain to a grammatical prior, i.e., a structural inductive bias learned during PPT that transfers to natural language grammar. However, PPT has only been tested on models of at most 1B parameters and PT budgets below 2B tokens on predominantly web text. It is unknown whether PPT is effective at larger scales and under more realistic PT data mixtures that combine diverse sources (e.g., code and math). We therefore present a comprehensive study on PPT spanning five PPT tasks, four PT data mixtures, four parameter scales (500M to 7B), and PT budgets of up to 100B tokens. Our results demonstrate that the downstream performance and token efficiency gains of PPT persist at scale, e.g., saving at least 21B PT tokens at the 3B scale. However, in contrast to prior work, we find no consistent evidence that these gains stem from a grammatical prior. Downstream performance does not consistently align with grammatical acceptability across model sizes. Instead, we find that downstream gains arise from PPT tasks that improve long-range retrieval. Finally, PPT performance gains are robust to how PT data mixtures are composed and diminish only when web text is absent. Overall, PPT is a low-cost addition to PT, and future PPT task design should target long-range retrieval rather than natural language grammar.', 'score': 5, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'fcb0082d94a3c80d', 'authors': ['Atsuki Yamaguchi', 'Tatsuro Inaba', 'Joel Niklaus', 'Michal Štefánik', 'Aline Villavicencio', 'Nikolaos Aletras'], 'affiliations': ['Federal University of Rio Grande do Norte', 'Hugging Face', 'Mohamed bin Zayed University of Artificial Intelligence', 'National Institute of Informatics', 'University of Exeter', 'University of Sheffield'], 'pdf_title_img': 'assets/pdf/title_img/2609.39827.jpg', 'data': {'categories': ['#optimization', '#transfer_learning', '#synthetic'], 'emoji': '🚀', 'ru': {'title': 'Масштабное предварительное предварительное обучение: эффективность через долгодистанционный поиск, а не грамматику', 'desc': 'В этой работе исследуется предварительное предварительное обучение (PPT) на синтетических данных, которое повышает эффективность использования токенов при обучении языковых моделей. Авторы провели масштабное исследование с моделями от 500M до 7B параметров и бюджетом обучения до 100B токенов на различных смешениях данных. Вопреки предыдущим предположениям, они выяснили, что улучшение производительности возникает не из-за грамматического смещения, а из-за улучшения долгодистанционного поиска информации. Результаты показывают, что PPT является экономичным дополнением к предварительному обучению и экономит как минимум 21B токенов на масштабе 3B параметров.'}, 'en': {'title': 'Unlocking Token Efficiency: The Power of Pre-Pretraining', 'desc': 'This paper investigates the effects of pre-pretraining (PPT) on language models using synthetic data to enhance token efficiency during pre-training (PT). The study expands on previous research by testing PPT across various model sizes and diverse data mixtures, revealing that the benefits of PPT persist even at larger scales. Contrary to earlier beliefs, the performance improvements are not linked to a grammatical prior but rather to enhanced long-range retrieval capabilities. The findings suggest that PPT is a valuable, cost-effective strategy for improving language model training, emphasizing the importance of task design focused on retrieval rather than grammar.'}, 'zh': {'title': '预训练的低成本提升：聚焦长距离检索', 'desc': '预训练（PPT）在合成非自然语言数据上进行，可以提高语言模型预训练（PT）时的令牌效率。以往的研究认为，这种提升源于语法先验，即在PPT过程中学习到的结构性归纳偏差，能够转移到自然语言语法上。然而，我们的研究发现，PPT在更大规模和更复杂的数据混合下仍然有效，且其性能提升主要来自于改善长距离检索的任务，而非语法的可接受性。总体而言，PPT是对PT的低成本补充，未来的PPT任务设计应更关注长距离检索，而非自然语言语法。'}}}, {'id': 'https://huggingface.co/papers/2609.34599', 'title': 'The Low-Rank Structure of VLA Reinforcement Learning', 'url': 'https://huggingface.co/papers/2609.34599', 'abstract': "Abstract  Reinforcement learning (RL) is increasingly used to post-train vision-language-action (VLA) models, yet how RL reshapes these policies remains poorly understood. We find that RL across widely used flow-based VLA models, including π_{0.5} and GR00T~N1.5/N1.6, on LIBERO, ManiSkill, MetaWorld, and CALVIN induces substantially lower-rank parameter updates that are highly concentrated in the action expert's Timestep Modules, a small and previously overlooked component. Through systematic module-replacement experiments, we further show that these modules capture a disproportionate share of the performance gains from RL. We then characterize what is encoded in these Timestep Modules. First, we show that RL specializes them to the discrete denoising timesteps used during rollouts, and that this discrete-timestep training underlies the low-rank updates. Second, we find that among their outputs, the shift vector changes most distinctly under RL, and through probing, we show that shift update directions strongly predict task success (ROC-AUC up to 99.6%). Third, we find that the geometry of shift updates reflects task relationships, as their pairwise similarity correlates with cross-task transfer patterns. Building on these findings, we show that steering along shift update directions further improves RL-trained policies without additional RL training. Overall, we provide a systematic understanding of how RL reshapes VLA policies by studying how learned signals are encoded in parameter space, offering insights into more efficient and interpretable VLA post-training.", 'score': 5, 'issue_id': 3359, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '21ac1d358704ffbd', 'authors': ['Minjae Oh', 'Yoonah Park', 'Jongwon Lim', 'Yohan Jo'], 'affiliations': ['Graduate School of Data Science, Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34599.jpg', 'data': {'categories': ['#robotics', '#training', '#interpretability', '#rl', '#reasoning'], 'emoji': '🎯', 'ru': {'title': 'Декодирование механизмов переучивания VLA: как RL преобразует параметры через Timestep Modules', 'desc': 'Исследование показывает, что обучение с подкреплением (RL) переучивает модели зрение-язык-действие (VLA) через низкоранговые обновления параметров, которые сосредоточены в небольшом компоненте под названием Timestep Modules в экспертной части генерации действий. Авторы установили, что эти модули специализируются на дискретных шагах денойзирования и кодируют критическую информацию о сдвигах векторов, которые сильно предсказывают успех задачи. Геометрия обновлений сдвигов отражает взаимосвязи между задачами и коррелирует с паттернами трансфера знаний между ними. На основе этих открытий авторы демонстрируют, что целенаправленное управление направлениями обновлений сдвигов улучшает политики без дополнительного RL-обучения.'}, 'en': {'title': 'Unlocking the Power of Timestep Modules in RL for VLA Models', 'desc': 'This paper explores how reinforcement learning (RL) affects vision-language-action (VLA) models, revealing that RL leads to lower-rank updates concentrated in specific components called Timestep Modules. These modules, which were previously overlooked, significantly contribute to performance improvements during RL training. The study shows that RL specializes these modules to discrete denoising timesteps, resulting in low-rank updates that enhance task success. Additionally, the research indicates that the geometry of updates in these modules reflects relationships between tasks, suggesting that steering along these update directions can further enhance policy performance without extra RL training.'}, 'zh': {'title': '强化学习重塑视觉-语言-动作模型的秘密', 'desc': '强化学习（RL）在视觉-语言-动作（VLA）模型的后训练中越来越常用，但其如何重塑这些策略仍不太清楚。我们发现，在LIBERO、ManiSkill、MetaWorld和CALVIN等广泛使用的基于流的VLA模型中，RL导致的参数更新具有显著的低秩特征，主要集中在动作专家的时间步模块中。通过系统的模块替换实验，我们进一步表明这些模块在RL中捕获了不成比例的性能提升。我们的研究揭示了时间步模块中编码的内容，强调了RL在提高VLA模型效率和可解释性方面的重要性。'}}}, {'id': 'https://huggingface.co/papers/2609.40358', 'title': 'Physis-Lang: Self-Evolving Language as a Physical Representation for Video World Model', 'url': 'https://huggingface.co/papers/2609.40358', 'abstract': 'Abstract  Video world models are expected to predict how the physical world evolves, yet they often produce visually plausible videos that violate basic physical principles. Existing approaches commonly assume that natural language is insufficient to represent the physical knowledge required for reliable generation, and therefore introduce additional visual, latent, numerical, or planning-based signals. We revisit this assumption and introduce Physis-Lang, a self-evolving framework that treats physical language as a shared and optimizable representation across data curation, model training, and video generation. Physis-Lang represents physical processes through language that describes their relevant entities, causes, interactions, governing principles, temporal evolution, and effects. To improve this representation, we construct PhysCapBench, which decomposes physical processes into atomic assertions and evaluates captions using recall and precision. An agentic loop iteratively analyzes assertion-level errors and refines the instruction used to produce physical captions. Physis-Lang further converts model deficiencies into textual descriptions and uses language-guided retrieval to identify visually diverse videos that cover missing physical processes. Experiments on four widely used physical video benchmarks with Wan and Cosmos backbones demonstrate consistent improvements in physical plausibility. Notably, starting from open-source Cosmos3-Nano backbones, our Physis-Lang-enhanced models surpass the leading proprietary Veo 3.1 model.', 'score': 5, 'issue_id': 3359, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '4bcd384669a066de', 'authors': ['Liming Lu', 'Xianzheng Ma', 'Wenkun He', 'Guanqi Zhan', 'Yilin Zhao', 'Junyu Chen', 'Mengyao Xu', 'Jiaojiao Fan', 'Wenhang Ge', 'Yuchao Gu', 'Yunze Liu', 'Boyi Li', 'Zhen Dong', 'Victor Prisacariu', 'Ming-Yu Liu', 'Song Han', 'Han Cai'], 'affiliations': ['MIT', 'NVIDIA', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2609.40358.jpg', 'data': {'categories': ['#multimodal', '#video', '#dataset', '#benchmark', '#data', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Язык как основа физически правдоподобной генерации видео', 'desc': 'В статье предложена новая методология Physis-Lang для создания видеомоделей, которые соблюдают законы физики. Вместо привлечения дополнительных визуальных или числовых сигналов, авторы используют язык как главный способ представления физических знаний и совершенствуют его через специально построенный датасет PhysCapBench с атомарными утверждениями о физических процессах. Система работает итеративно: агентный цикл анализирует ошибки на уровне отдельных утверждений и улучшает инструкции для генерации физически точных описаний видео. Экспериментальная проверка показала, что Physis-Lang значительно повышает физическую корректность генерируемых видео и позволяет открытым моделям соперничать с закрытыми коммерческими решениями.'}, 'en': {'title': 'Harnessing Language for Physically Plausible Video Generation', 'desc': 'This paper introduces Physis-Lang, a novel framework that uses physical language to enhance video world models, which often fail to adhere to basic physical laws. By treating physical knowledge as a shared representation, Physis-Lang integrates language into d
