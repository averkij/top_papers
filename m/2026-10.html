ry, a low-rank representation for efficient scene feature storage. Unlike traditional methods that require increasing memory as video generation progresses, Honeycomb maintains a fixed-size memory with six spatial and spatiotemporal planes. The model employs a feed-forward writer to map new video chunks into these planes while using confidence-weighted pooling to integrate past and present features. Experiments show that Honeycomb achieves high-quality video generation and consistent scene revisits without the need for extensive memory expansion.'}, 'zh': {'title': 'Honeycomb：高效的视频世界模型', 'desc': '本论文介绍了一种名为Honeycomb的视频世界模型，它使用HexMemory来存储场景特征，从而在固定大小的内存中保持一致性。与传统方法不同，Honeycomb通过低秩表示减少了存储需求，避免了随着生成过程的进行而增加的存储负担。该模型通过一个前馈写入器将生成的片段映射到新的特征平面，并通过信心加权池化和学习的残差校正来融合新特征。实验结果表明，Honeycomb在视频生成质量和重访一致性方面表现出色，同时保持了HexMemory特征存储的恒定。'}}}, {'id': 'https://huggingface.co/papers/2610.02142', 'title': 'Keyword Harnesses Fail Open: A Cheap Diagnostic Ladder for Tool-Use Claims in Small Language Models', 'url': 'https://huggingface.co/papers/2610.02142', 'abstract': "Abstract  Keyword-matching benchmarks can credit small models for tool use they never perform. We document such a false positive in a matched-architecture pair of Spanish security language models and propose a ladder of strict, cheap diagnostics. A 661.6M parameter model (approx. 65% code/technical text; no dedicated SFT) and a 1,109M model (web-heavy multi-phase curriculum; 6B-token tool-SFT) share decoder, tokenizer, and special tokens, scoring almost identically on lenient tool-use metrics (B4: 0.660 vs. 0.650).   Verbatim-reproduction checks on training examples separate them completely: the 600M emits valid tool calls with generalized arguments on 6/6 examples; the 1B does so on 0/6 across checkpoints. A first-token probe localizes the 1B's failure to a missing prior (prob. 10^{-4}--10^{-5} on <|tool_call|>), which was erased by its web-heavy training phase. A targeted SFT recipe (diverse corpus, 5x higher learning rate, 2,202 steps, ~3.3 GPU-hours) repairs the 1B using three orders of magnitude fewer tokens than the failed phase. On all 269 corpus rows, valid emission rises from 0.100 to 0.959 (600M: 0.926). On 238 unseen prompts, the repaired 1B passes 0.536 vs. the 600M's 0.428 (p = 0.004). Embedding-drift checks show the repair did not move the trigger token's tied embedding (97.7% of the bf16 table remains bit-identical), meaning changes live in the surrounding network.   Both models over-trigger, rarely answering negative prompts without a call (0.09 for 600M, 0.17 for repaired 1B). Factorial analyses confirm all repair configurations install the format, though suppression benefits from a diverse corpus remain a hypothesis due to seed sensitivity. This cheap diagnostic ladder costs minutes of CPU time and should gate tool-use claims on small models.", 'score': 5, 'issue_id': 3364, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '1812fe0b7d9e2109', 'pdf_title_img': 'assets/pdf/title_img/2610.02142.jpg', 'data': {'categories': ['#benchmark', '#low_resource', '#small_models', '#training', '#multilingual', '#interpretability', '#security'], 'emoji': '🔧', 'ru': {'title': 'Как поймать подделку: простая диагностика для реального использования инструментов в малых моделях', 'desc': 'В статье показано, что стандартные бенчмарки для оценки использования инструментов в языковых моделях могут давать ложноположительные результаты. Авторы сравнили две испанские модели безопасности с одинаковой архитектурой, но разным обучением: меньшая модель (662M параметров) лучше генерирует вызовы инструментов, чем большая (1,1B параметров), хотя стандартные метрики показывают их одинаковыми. Проблема большой модели оказалась в недостающем приоре для токена инструмента, который был стёрт во время обучения на веб-данных. Авторы предложили дешёвый способ исправления через целевую дообучение с адаптированным корпусом и повышенной скоростью обучения, что восстановило функциональность за считанные часы GPU.'}, 'en': {'title': 'Unmasking Tool Use: Diagnosing and Repairing Language Models', 'desc': "This paper discusses the issue of small language models being inaccurately credited for tool use based on keyword-matching benchmarks. The authors compare two models, one with 661.6M parameters and another with 1,109M parameters, which perform similarly on lenient metrics but differ significantly in their ability to generate valid tool calls. They introduce a series of diagnostics to identify and repair the shortcomings of the larger model, which failed to produce valid tool calls due to its training phase. The proposed targeted fine-tuning method significantly improves the larger model's performance while maintaining the integrity of its embeddings, suggesting a more reliable approach to evaluating tool-use capabilities in language models."}, 'zh': {'title': '小模型工具使用的误导与修复', 'desc': '这篇论文探讨了关键词匹配基准如何错误地给小模型记功，尽管它们并未真正执行工具使用。研究中比较了两个西班牙安全语言模型，发现661.6M参数的模型在工具使用指标上与1,109M参数的模型几乎相同，但在训练示例的逐字重现检查中却表现截然不同。通过针对性的微调（SFT），研究者成功修复了1B模型，使其在有效工具调用的能力上显著提升。最后，论文提出了一种廉价的诊断方法，建议在小模型的工具使用声明中应用，以避免误导。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.36602', 'title': 'OTRetarget: Joint Robot and Object Motion Retargeting via Optimal Transport', 'url': 'https://huggingface.co/papers/2609.36602', 'abstract': 'Abstract  Transferring human motion to humanoid robots requires adapting the demonstrated motion to the robot morphology while preserving interactions with the environment. This is particularly challenging for loco-manipulation tasks, where contacts with the ground and manipulated objects must remain consistent despite differences in body proportions. Yet, skeletal motion alone does not fully describe these interactions, and fixing object trajectories limits the adaptation to a new embodiment. In this paper, we introduce OTR ETARGET, a unified approach to jointly retarget robot and multi-object motion from human demonstrations. Our approach represents surface interactions through signed distances, closest surface points, and relative directions, and uses entropic optimal transport to transfer these quantities across human, robot, and object geometries. We incorporate the resulting interaction targets into a constrained inverse kinematics formulation that balances contact preservation with motion style and jointly optimizes robot and object poses at each frame. This formulation accommodates robot-object and object-object interactions without rescaling the scene or the demonstration. We validate the proposed approach on OMOMO, where it achieves a robot- object interaction Jaccard score of 87% and a depth error of 8.7 mm, compared with 28% and 29.3 mm for OmniRetarget. Finally, we demonstrate transfer to a physical G1 humanoid using whole-body policies trained with reinforcement learning on the retargeted references, across motions including two-handed box pick-and-place onto a table.', 'score': 5, 'issue_id': 3363, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '5681a64482d827ab', 'authors': ['Guillaume Besset', 'Erwann Carn', 'Timothée Carecchio', 'Valentin Tordjman-Levavasseur', 'Fabian Schramm', 'Yann de Mont-Marin', 'Justin Carpentier', 'Ajay Suresha Sathya'], 'affiliations': ['Inria'], 'pdf_title_img': 'assets/pdf/title_img/2609.36602.jpg', 'data': {'categories': ['#rl', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Сохранение контактов при адаптации человеческих движений на роботов через оптимальный транспорт', 'desc': 'В работе предлагается метод OTR ETARGET для адаптации человеческих движений на гуманоидные роботы с сохранением взаимодействия с окружением. Авторы используют оптимальный транспорт для трансфера информации о контактах между человеком, роботом и объектами через геометрические характеристики, такие как знаковые расстояния и ближайшие точки поверхностей. Предложенный подход интегрирует целевые взаимодействия в формулировку обратной кинематики с ограничениями, которая балансирует сохранение контактов и стиль движения. Метод демонстрирует высокую точность на бенчмарке OMOMO (87% Jaccard score) и успешно применён к физическому роботу G1 для задач манипуляции двумя руками.'}, 'en': {'title': 'Unified Motion Retargeting for Humanoid Robots', 'desc': 'This paper presents OTR ETARGET, a method for transferring human motion to humanoid robots while maintaining environmental interactions. It addresses the challenges of loco-manipulation tasks by using signed distances and optimal transport to adapt motion for different robot geometries. The approach incorporates interaction targets into a constrained inverse kinematics framework, ensuring that both robot and object movements are optimized together. The method is validated through experiments, achieving high accuracy in robot-object interactions and demonstrating effective motion transfer to a physical humanoid robot.'}, 'zh': {'title': '人类运动转移到机器人：OTR ETARGET方法', 'desc': '本论文提出了一种名为OTR ETARGET的方法，用于将人类示范的运动转移到类人机器人上，同时保持与环境的交互。该方法通过有符号距离、最近表面点和相对方向来表示表面交互，并利用熵最优传输技术在人体、机器人和物体几何之间传递这些信息。我们将这些交互目标纳入约束逆向运动学的框架中，平衡接触保持与运动风格，并在每一帧中共同优化机器人和物体的姿态。实验结果表明，该方法在OMOMO平台上取得了87%的机器人-物体交互Jaccard得分，验证了其有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.01942', 'title': 'Latent-Foresight: End-to-End Learning Predictable Representations for Latent World Models', 'url': 'https://huggingface.co/papers/2610.01942', 'abstract': 'Abstract  Predicting the future evolution of a scene is a fundamental capability for world modeling. Recent work has shown that operating in the feature space of Vision Foundation Models (VFMs) yields semantically rich representations that support diverse future scene understanding tasks. However, existing approaches rely on two-stage pipelines, where VFM features are first compressed using fixed dimensionality reduction (e.g., PCA) or independently trained autoencoders, and a separate predictor is trained on top of the resulting frozen latent space. This decoupling between representation learning and temporal prediction, as well as approaches that apply predictors directly on raw VFM features, provides no guarantee that the latent space is structured for predictable dynamics. In this work, we propose Latent-Foresight, an end-to-end framework that jointly learns a latent tokenizer and a flow-based generative dynamics model, explicitly shaping the representation to support temporal predictability. To enable stable joint optimization, we introduce several key design choices that prevent latent collapse and align reconstruction with generative objectives. Extensive experiments show that our approach learns more temporally coherent latent representations and consistently outperforms two-stage baselines across multiple future scene understanding tasks and prediction horizons, while eliminating separate training stages, including during high-resolution adaptation. We provide the implementation code and model weights at https://github.com/Sta8is/Latent-Foresight', 'score': 5, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'ceda2c2e096ba6fb', 'authors': ['Efstathios Karypidis', 'Spyros Gidaris', 'Nikos Komodakis'], 'affiliations': ['Archimedes, Athena Research Center, Greece', 'IACM-Forth', 'National Technical University of Athens', 'University of Crete', 'valeo.ai'], 'pdf_title_img': 'assets/pdf/title_img/2610.01942.jpg', 'data': {'categories': ['#video', '#diffusion', '#training', '#open_source', '#architecture'], 'emoji': '🔮', 'ru': {'title': 'Совместное обучение представлений для предсказания динамики сцен', 'desc': 'Статья предлагает Latent-Foresight — сквозной фреймворк для предсказания будущей эволюции сцен, который совместно обучает токенизатор скрытого пространства и генеративную модель динамики на основе потоков. В отличие от существующих двухэтапных подходов, которые используют фиксированное снижение размерности или отдельно обученные автокодировщики, этот метод явно формирует представление для поддержки временной предсказуемости. Авторы вводят ключевые технические решения, которые предотвращают коллапс скрытого пространства и согласовывают цели реконструкции и генерации. Эксперименты демонстрируют, что подход обучает более темпорально согласованные представления и превосходит двухэтапные базовые методы на различных задачах понимания будущих сцен.'}, 'en': {'title': 'Latent-Foresight: Predicting the Future with Structured Representations', 'desc': 'This paper introduces Latent-Foresight, a novel framework for predicting future scenes by learning a structured latent space that enhances temporal predictability. Unlike traditional methods that use separate stages for feature extraction and prediction, Latent-Foresight integrates these processes into a single end-to-end model. It employs a latent tokenizer and a flow-based generative dynamics model to ensure that the learned representations are coherent over time. The results demonstrate that this approach outperforms existing two-stage methods in various future scene understanding tasks, providing a more effective solution for dynamic world modeling.'}, 'zh': {'title': '联合学习，提升场景预测能力', 'desc': '本文提出了一种名为Latent-Foresight的框架，用于预测场景的未来演变。该框架通过联合学习潜在标记器和基于流的生成动态模型，旨在明确塑造表示以支持时间可预测性。与传统的两阶段方法不同，Latent-Foresight消除了独立训练阶段，能够在高分辨率适应过程中保持稳定的联合优化。实验结果表明，该方法在多个未来场景理解任务中表现优于现有基线，学习到的潜在表示更加时间一致。'}}}, {'id': 'https://huggingface.co/papers/2610.01595', 'title': 'Before It Fades: Reinforcing Temporal Representations at Inference Time in VideoLLMs', 'url': 'https://huggingface.co/papers/2610.01595', 'abstract': 'Abstract  Video Large Language Models (VideoLLMs) receive frames in sequential order and interpret how visual content evolves along the temporal axis, yet temporal reasoning remains a persistent weakness across architectures. Reversing the frame order of a video, a transformation that should invert temporal answers, often leaves the final prediction unchanged. We investigate where this failure originates by defining the temporal divergence vector τ_l, the layer-wise representational difference induced by reversing temporal order. Tracking its magnitude across layers reveals a consistent temporal divergence profile where the divergence peaks at intermediate layers and progressively diminishes toward the output. We confirm this peak is specific to temporal reasoning and functionally critical for predictions, establishing that VideoLLMs acquire temporal information at intermediate layers but fail to maintain it to the output. This progressive fading motivates our method, Temporal Activation Injection (TAI), which extracts τ_l at the peak of the profile for each input and reinjects it into subsequent layers following the measured decay. TAI requires no training and consistently improves temporal reasoning across three VideoLLMs and four benchmarks with negligible impact on non-temporal tasks. Code is available at https://github.com/Youngwoo-git/Before-It-Fades.', 'score': 5, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd596929ede2e23a1', 'authors': ['Youngwoo Shin', 'Yusung Ro', 'Minseo Kim', 'Junmo Kim'], 'affiliations': ['Korea Advanced Institute of Science and Technology (KAIST)'], 'pdf_title_img': 'assets/pdf/title_img/2610.01595.jpg', 'data': {'categories': ['#architecture', '#video', '#multimodal'], 'emoji': '⏪', 'ru': {'title': 'Спасение временной информации перед её исчезновением', 'desc': 'В статье исследуется проблема слабого временного рассуждения в VideoLLM — больших языковых моделях, обрабатывающих видеофреймы последовательно. Авторы обнаружили, что когда видео воспроизводится в обратном порядке, модели часто дают одинаковые предсказания, несмотря на инвертированную временную информацию. Через анализ слоёв нейронной сети они выявили, что временные представления максимальны на промежуточных слоях, но постепенно исчезают к выходу модели. На основе этого открытия предложена метода Temporal Activation Injection (TAI), которая сохраняет временную информацию путём её переинъекции в последующие слои без необходимости переобучения.'}, 'en': {'title': 'Enhancing Temporal Reasoning in VideoLLMs with TAI', 'desc': "This paper addresses the limitations of Video Large Language Models (VideoLLMs) in understanding temporal information in videos. It identifies a specific issue where reversing the order of video frames does not change the model's predictions, indicating a weakness in temporal reasoning. The authors introduce the concept of the temporal divergence vector, which measures how well the model retains temporal information across its layers. To improve this retention, they propose a method called Temporal Activation Injection (TAI), which enhances the model's ability to reason about time without requiring additional training."}, 'zh': {'title': '提升视频模型时间推理的创新方法', 'desc': '视频大型语言模型（VideoLLMs）在处理视频帧时，能够理解视觉内容如何随时间变化，但在时间推理方面仍然存在不足。研究发现，当视频帧顺序反转时，模型的最终预测往往不变，这表明模型在时间推理上存在缺陷。通过定义时间发散向量τ_l，研究发现这种发散在中间层达到峰值，并在输出层逐渐减弱。为了解决这个问题，提出了一种新的方法——时间激活注入（TAI），该方法能够在不需要训练的情况下，显著提高视频模型的时间推理能力。'}}}, {'id': 'https://huggingface.co/papers/2610.01017', 'title': 'Pay for the Fault, Not the Flow: Label-Free In-Flow Multi-Agent Workflow Optimization', 'url': 'https://huggingface.co/papers/2610.01017', 'abstract': "Abstract  Large language models (LLMs) increasingly construct multi-agent workflows that decompose a complex task and assign specialist agents from a pool. However, building such a workflow well remains challenging: how finely to divide the task, which agent to trust with each subtask, and when to create a new specialist are all critical decisions a workflow constructor needs to settle up front. Thus, whether each subtask succeeds remains unknown until the workflow runs. Yet, improving a workflow is costly. Locating a fault usually requires a reference answer, a graded outcome, or a trained assessor, and the fix is applied to the whole workflow through re-execution, re-search, or retraining. We propose InFlowOp, which prices every decision in one label-free cost that weighs how well an agent's competence meets what a subtask demands against how much that agent takes to run. Before execution, InFlowOp bidirectionally determines the granularity of task decomposition and agent assignment following from the cost rather than from a fixed template. During execution, InFlowOp corrects a fault with the cheapest move via the same cost that serves the workflow both as it is built and as it runs. Facing the workflow-level evaluation challenge, we introduce Braid, a benchmark whose tasks require multi-agent coordination beyond single-agent capability. Across various domains and backbones, InFlowOp outperforms single agent baselines by up to +11.97%, achieving +9.64% with in-flow optimization. Our project page: https://xhguo7.github.io/InFlowOp/.", 'score': 5, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'b362d708da341223', 'authors': ['Xuehang Guo', 'Haoyu Wang', 'Shengyu Chen', 'Zach Chen', 'Wei Cheng', 'Qingyun Wang', 'Haifeng Chen'], 'affiliations': ['NEC Corporation of America', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2610.01017.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '⚙️', 'ru': {'title': 'Самооптимизирующиеся многоагентные рабочие процессы без разметки данных', 'desc': 'В статье предлагается метод InFlowOp для автоматической оптимизации многоагентных рабочих процессов, построенных на основе больших языковых моделей. Ключевая инновация заключается в введении единой метрики стоимости без использования размеченных данных, которая оценивает компетентность агента относительно требований подзадачи и вычислительных затрат. Метод работает как на этапе проектирования рабочего процесса (определяя гранулярность декомпозиции задачи и распределение агентов), так и во время выполнения (исправляя ошибки наиболее экономичным способом). Авторы представляют бенчмарк Braid для оценки многоагентной координации, на котором InFlowOp показывает улучшение до 11.97% по сравнению с одноагентными подходами.'}, 'en': {'title': 'Optimizing Multi-Agent Workflows with InFlowOp', 'desc': 'This paper introduces InFlowOp, a method for optimizing multi-agent workflows in large language models (LLMs). It addresses the challenges of task decomposition and agent assignment by evaluating the cost-effectiveness of each decision before execution. InFlowOp dynamically adjusts the granularity of tasks and agent roles based on their competence and operational costs. The authors also present Braid, a benchmark for testing multi-agent coordination, demonstrating that InFlowOp significantly improves performance over traditional single-agent approaches.'}, 'zh': {'title': '优化多代理工作流的智能决策', 'desc': '本文提出了一种名为InFlowOp的方法，用于优化多代理工作流的构建和执行。该方法通过一种无标签的成本评估机制，帮助决策任务的细分和代理的分配，从而提高工作流的效率。InFlowOp在执行过程中能够根据成本动态修正错误，确保工作流的顺利进行。实验结果表明，InFlowOp在多个领域的表现优于单一代理基线，显示出其在多代理协调任务中的优势。'}}}, {'id': 'https://huggingface.co/papers/2610.00360', 'title': 'DexPolicy: Scheduled Exploration for Trajectory-Guided Dexterous Manipulation', 'url': 'https://huggingface.co/papers/2610.00360', 'abstract': 'Abstract  Reinforcement learning (RL) for dexterous manipulation must discover finger-object contacts and then control the object precisely; the action noise that serves the first goal can interfere with the second. In trajectory-guided settings such as ViViDex, where RL refine hand-object trajectories from human video, our baseline PPO runs end near their initial action noise after 5M steps, motivating explicit control of exploration scale. DexPolicy makes that scale an explicit function of training steps, annealing from broad to narrow exploration while holding loss, architecture, reward, and optimizer settings fixed. We study three policy-optimization settings: PPO, critic-free GRPO continuation, and a flow-parameterized PPO variant (FPO). Across five YCB objects and three training seeds, mean deterministic Target success rises from 49.4% to 68.1% (FPO), 14.1% to 45.4% (GRPO), and 32.0% to 35.7% (PPO). On a RealMan RM75 arm with an Inspire/RH56 hand, 360 trials over three objects raise mean Target success from 25.0% to 85.0% (FPO), 10.0% to 63.3% (GRPO), and 8.3% to 43.3% (PPO), with one trained model per object-method condition. PPO component screening favors noise control over the tested optimizer contraction; the selected PPO schedule yields higher mean Target success than linear decay with the same endpoints on three tested objects. Training return, deterministic Target success, and tolerance to execution noise dissociate; schedules should therefore be judged by terminal task success under the intended execution conditions, per task and policy-optimization setting. Code: https://github.com/AIGeeksGroup/DexPolicy. Website: https://aigeeksgroup.github.io/DexPolicy.', 'score': 5, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '9248936e38e941ec', 'authors': ['Haoyu Wang', 'Siyuan Qian', 'Yanjun Li', 'Zeyu Zhang', 'Yandong Guo', 'Boxin Shi', 'Hao Tang'], 'affiliations': ['AI2 Robotics', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00360.jpg', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Управление исследованием через контроль шума в ловком манипулировании', 'desc': 'В статье предлагается DexPolicy — метод для улучшения обучения с подкреплением в задачах ловкого манипулирования объектами. Авторы решают проблему конфликта между исследованием пространства действий (exploration) и точным управлением объектом, делая масштаб шума явной функцией шагов обучения. Они тестируют три алгоритма оптимизации политики (PPO, GRPO и FPO) и показывают значительное улучшение успешности выполнения задач как в симуляции, так и на реальном робототехническом манипуляторе. Ключевой вывод заключается в том, что расписание контроля шума более важно для финального успеха задачи, чем другие гиперпараметры.'}, 'en': {'title': 'DexPolicy: Optimizing Exploration for Better Dexterous Manipulation', 'desc': 'This paper discusses a method called DexPolicy for improving reinforcement learning in dexterous manipulation tasks. It addresses the challenge of balancing exploration and exploitation by adjusting the scale of exploration as training progresses. The authors compare different policy optimization techniques, including PPO and GRPO, and demonstrate that their approach significantly increases the success rate of manipulating objects. The results show that careful control of exploration noise leads to better performance in achieving task goals.'}, 'zh': {'title': '优化探索规模，提高灵巧操作成功率', 'desc': '本论文探讨了强化学习在灵巧操作中的应用，特别是如何在控制物体时处理手指与物体的接触。研究提出了一种名为DexPolicy的方法，通过调整探索规模来提高学习效果，从而在训练过程中实现更精确的控制。实验结果显示，使用不同的策略优化方法（如PPO和GRPO）可以显著提高目标成功率。最终，研究强调了在特定执行条件下评估训练效果的重要性。'}}}, {'id': 'https://huggingface.co/papers/2610.00314', 'title': 'Predictive Credit: Measuring What Scientific Explanations Add to Experimental Forecasts', 'url': 'https://huggingface.co/papers/2610.00314', 'abstract': "Abstract  Research agents explain planned experiments. We measure predictive credit with paired forecasts sharing an intervention, forecaster, and outcome while varying description, matched explanation, and donor context. Five checks track commitment, delivery, predictive gain, alignment, and known-signal uptake. Across 336 prospective states in controlled learning, 12 Tox21 endpoints, and 24 OpenML tasks, v5's frozen credit decision was inconclusive. Tox21's preregistered ROC AUC interval-score harm test was unmet (D-M=-.0026, 95 percent interval [-.0174, .0104]); OpenML's joint formation, point-equivalence, and repeatability rule was unmet. Matched point-accuracy gains over description remained unconfirmed, and Tox21/OpenML seed-donor intervals spanned zero. Under requested DeepSeek V4 Pro, matched and donor cards reduced secondary Tox21 drift by 64.5 and 59.1 percent. A DeepSeek V4 Flash replay raised matched point MAE from .01823 to .02020 and missed matched-donor interval-score equivalence. OpenML full-card assignment widened nominal 80 percent intervals by 21 percent, with 49.3 percent coverage versus 51.4 percent for description and content in 66/144 cards. Direct-text Flash delivered all 144 notes without detectable matched point-accuracy gain. A researcher-authored mechanism positive control lowered point MAE by 2.60 percentage points versus description. The protocol measures predictive credit for research-agent benchmarks and scientific forecasting; natural-explanation credit remained unconfirmed at the tested donor resolutions.", 'score': 5, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'b197de94d756f202', 'authors': ['Jingjie Ning', 'Xueqi Li', 'Yibo Kong', 'Dongting Li'], 'affiliations': ['Carnegie Mellon University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00314.jpg', 'data': {'categories': ['#science', '#benchmark', '#agents'], 'emoji': '🔬', 'ru': {'title': 'Объяснения агентов не гарантируют улучшение предсказаний моделей', 'desc': 'В этой работе исследователи оценивают, насколько объяснения экспериментов, предоставленные исследовательскими агентами, улучшают предсказательную способность моделей. Авторы проводят систематическое тестирование на трёх наборах данных (336 проспективных состояний, 12 эндпоинтов Tox21 и 24 задач OpenML), измеряя влияние различных типов описаний и контекста на точность предсказаний. Результаты показывают смешанные результаты: хотя некоторые методы снижали дрейф модели на Tox21 (на 64.5% и 59.1%), основные гипотезы о преимуществах объяснений не подтвердились статистически значимо. Авторы разработали протокол оценки предсказательного выигрыша от естественных объяснений для научного прогнозирования и бенчмарков с участием исследовательских агентов.'}, 'en': {'title': "Exploring Predictive Credit in Research Agents' Experiments", 'desc': 'This paper investigates how research agents can explain their planned experiments and measure the effectiveness of their predictions. It uses paired forecasts to analyze various factors like description and context while tracking metrics such as predictive gain and alignment. The results from multiple tasks showed inconclusive outcomes regarding the predictive credit of the agents, with some tests failing to meet established benchmarks. Overall, the study highlights the challenges in confirming predictive accuracy and the need for better mechanisms in scientific forecasting.'}, 'zh': {'title': '研究代理的预测信用与实验解释', 'desc': '本研究探讨了研究代理如何解释计划的实验。我们通过配对预测来衡量预测信用，这些预测共享干预、预测者和结果，同时变化描述、匹配解释和捐赠者背景。研究结果显示，在336个前瞻性状态和多个任务中，预测信用的决策并不明确，且未能满足预注册的ROC AUC区间分数测试。尽管在某些情况下，匹配和捐赠卡减少了Tox21的漂移，但整体的预测准确性提升仍未得到确认。'}}}, {'id': 'https://huggingface.co/papers/2609.36484', 'title': 'The Teacher Is a Direction, Not a Destination: Extrapolating RL-Induced Representation Residuals in On-Policy Distillation', 'url': 'https://huggingface.co/papers/2609.36484', 'abstract': "Abstract  On-policy distillation (OPD) trains a student to match the teacher's next-token distributions on the student's own trajectories and has yielded substantial empirical gains. Generalized variants allow the student to surpass the teacher by extrapolating an implicit reward in output space. The language-model head, however, attenuates this change anisotropically: much of the change encoded in the teacher's hidden states reaches the logits at a small fraction of its weight, and the sampled-token log-probability ratios on which output-space extrapolation relies inject noise that the extrapolation amplifies, making training unstable. We observe that reinforcement learning (RL) shifts a model's internal representations relative to its base checkpoint, and that the direction of this shift can be measured at every layer. Motivated by this observation, we propose RIDE (RL-Induced Direction Extrapolation), which extrapolates the RL-induced change directly in representation space: at every layer and token position, RIDE computes the residual between the teacher and its pre-RL checkpoint and regresses the student's hidden states toward targets displaced beyond the teacher along this residual. Conditioned on a sampled trajectory, this regression is equivalent to maximizing a linear directional reward defined by the residual under a quadratic penalty centered at the teacher, which makes explicit how the objective moves the student along the RL-induced direction while limiting its deviation from the teacher. Across four base/RL-teacher pairs spanning different scales, architectures, and pre-training lineages, RIDE approaches or exceeds the RL-trained teacher on every pair and is the only method whose mean does so, and it consistently outperforms output-space extrapolation, which degrades the student whenever the teacher is close to its base. Project page: https://github.com/xixixixixxxx/RIDE.", 'score': 214, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '1c22c44fff72eb4b', 'authors': ['Hao Li', 'MeiJia Chen', 'Weijie Ren', 'Donghan Li', 'Zijun Tian', 'Jingchun Huang', 'Naibo Wang'], 'affiliations': ['Independent Researcher', 'Rutgers University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.36484.jpg', 'data': {'categories': ['#training', '#open_source', '#rl', '#architecture', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Экстраполяция RL-индуцированных изменений в пространстве представлений', 'desc': 'В работе предлагается метод RIDE для обучения студент-модели путём дистилляции знаний от учителя, обученного с помощью reinforcement learning. Авторы показывают, что прямая экстраполяция изменений в пространстве скрытых представлений более эффективна, чем традиционный подход экстраполяции в пространстве выходов. Метод работает на каждом слое нейронной сети, вычисляя остаток между весами учителя и его исходной версией, и регрессирует скрытые состояния студента по направлению этих изменений с квадратичной регуляризацией. Экспериментально RIDE показывает стабильное улучшение и способен превзойти или сравняться с производительностью RL-обученного учителя на различных архитектурах и масштабах моделей.'}, 'en': {'title': 'RIDE: Enhancing Student Models with RL-Induced Representation Changes', 'desc': "This paper introduces RIDE (RL-Induced Direction Extrapolation), a method that enhances on-policy distillation by directly leveraging the changes in a model's internal representations induced by reinforcement learning (RL). RIDE computes the difference between a teacher model's hidden states before and after RL training, allowing the student model to adjust its representations towards these changes. This approach stabilizes training by applying a regression that maximizes a linear reward while keeping the student close to the teacher's outputs. The results show that RIDE consistently outperforms traditional output-space extrapolation methods across various model architectures and training scenarios."}, 'zh': {'title': '通过RIDE提升学生模型的训练效果', 'desc': '本文提出了一种新的方法RIDE（RL诱导方向外推），旨在通过强化学习（RL）来改进学生模型的训练。RIDE直接在表示空间中外推RL诱导的变化，通过计算教师模型与其基准检查点之间的残差，来调整学生的隐藏状态。该方法在多个不同规模和架构的模型对比中表现出色，能够接近或超过RL训练的教师模型。与传统的输出空间外推方法相比，RIDE在训练过程中更稳定，能够有效减少噪声的影响。'}}}, {'id': 'https://huggingface.co/papers/2609.38721', 'title': 'UniEvo-VL: An On-policy Self-Distillation Training Recipe for Multimodal Model Self-improvement', 'url': 'https://huggingface.co/papers/2609.38721', 'abstract': "Abstract  Modern multimodal models bring generation and understanding into a single unified system, which enables them to provide and learn from their own feedback. Motivated by this unified capacity, we introduce UniEvo-VL, a self-evolving framework for multimodal models to learn from this constructive self-correction feedback during test-time compute. Instead of relying on a separate, often larger, teacher, we leverage their self-critiques as privileged information and ask a single multimodal model to act as both teacher and student with different contexts. The student only sees the vanilla question, while the teacher conditions on the privileged critique. Then training minimizes the per-state divergence between their denoising diffusion distributions over the student's own sampling trajectories. Experiments demonstrate that UniEvo-VL improves the image generation capabilities of multimodal models, while maintaining their sensitivity to additional reflection information. Specifically, we build on top of the open-source Qwen-image-2512 and observe a significant performance gain from 0.747 to 0.808 on GenEval and from 32.97 to 35.53 on GenEval2 Soft-TIFA. Moreover, attempts with more powerful external critics (e.g., GPT5.6-Luna) show that multimodal models with strong judge capabilities can anticipate a higher self-evolving ceiling. Last but not least, mixed text-rendering outcomes show that our self-improvements may not be uniform across different tasks. Our study aims to shed light on the current hot recursive self-improvement research line to enhance the user experience when using multimodal models without external supervision or guidance.", 'score': 166, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '51640f03502e212f', 'authors': ['Fang Wu', 'Da Xing', 'Yanjie Huang', 'Junxi Wang', 'Ji Wang', 'Hejia Geng', 'Guancheng Wan', 'Bowen Zuo', 'Xiaomin Li', 'Shixiang Tang', 'Xinyu Xiang', 'Zehong Wang', 'Shiyi Du', 'Peng Xia', 'Shuangjia Zheng', 'Yining Hong', 'Li Erran Li', 'Jure Leskovec', 'Yejin Choi'], 'affiliations': ['Carnegie Mellon University', 'Independent Researcher', 'Johns Hopkins University', 'MatrAIx', 'Stanford University', 'UC Riverside', 'UNC Chapel Hill', 'University of Notre Dame', 'University of Oxford', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2609.38721.jpg', 'data': {'categories': ['#training', '#open_source', '#multimodal', '#diffusion'], 'emoji': '🔄', 'ru': {'title': 'Мультимодальные модели учатся совершенствовать себя сами', 'desc': 'В статье представлена UniEvo-VL — фреймворк для самоусовершенствования мультимодальных моделей, который позволяет им учиться на собственной конструктивной критике во время инференса. Вместо привлечения отдельного учителя, модель выступает одновременно в роли учителя и ученика с разными контекстами: ученик видит только вопрос, а учитель дополнительно обрабатывает критику. Обучение минимизирует расхождение между распределениями диффузионных моделей на траекториях собственной выборки. Эксперименты показали значительное улучшение качества генерации изображений в Qwen-image-2512 с 0.747 до 0.808 на метрике GenEval.'}, 'en': {'title': 'Self-Improvement in Multimodal Models with UniEvo-VL', 'desc': "The paper introduces UniEvo-VL, a novel framework for multimodal models that allows them to learn and improve from their own feedback during testing. This self-evolving approach eliminates the need for a separate teacher model by enabling the multimodal model to act as both teacher and student, using its own critiques to enhance learning. The training process focuses on minimizing the differences between the model's generated outputs and its self-critiques, leading to improved image generation capabilities. Experiments show significant performance gains on evaluation metrics, highlighting the potential for self-improvement in multimodal systems without external guidance."}, 'zh': {'title': '自我进化的多模态学习新框架', 'desc': '现代多模态模型将生成和理解整合为一个统一的系统，使其能够提供和学习自我反馈。我们提出了UniEvo-VL，这是一个自我进化的框架，允许多模态模型在测试时通过自我纠正反馈进行学习。该模型利用自我批评作为特权信息，使同一个多模态模型在不同上下文中充当教师和学生。实验表明，UniEvo-VL显著提高了多模态模型的图像生成能力，同时保持了对额外反思信息的敏感性。'}}}, {'id': 'https://huggingface.co/papers/2609.39102', 'title': 'False Frontiers: Diagnosing and Mitigating Co-Cheating in Self-Evolving Search Agents', 'url': 'https://huggingface.co/papers/2609.39102', 'abstract': "Abstract  Self-evolving search agents build their own training curricula by jointly optimizing a proposer that generates questions and a solver that answers them. This closed loop introduces a failure mode we call co-cheating: the proposer and solver increasingly agree on shared errors, so internal reward improves without a matching gain in external correctness. A post-hoc audit against source evidence shows co-cheating growing more severe over successive rounds of self-evolution, with pseudo-label correctness stagnating or declining even as the in-loop training signal improves. The most direct mitigation is to verify proposals before training: we introduce multi-sample verification (MSV), which queries the same model three times with the source and three times without it to decide task admission and replace unreliable pseudo-labels. MSV partially reduces false agreement but leaves substantial residual co-cheating and costs six extra labeler generations per candidate. These limitations motivate CrossFit, our main method: it partitions the proposer's source documents into groups A and B; questions generated from A are scored by an auxiliary solver trained only on B, and vice versa. The cross-fitted agreement determines proposer reward, so a same-source pseudo-label cannot be reproduced through the feedback solver, while the original solver's update rule is unchanged. Rerunning the loop with Qwen3.5-4B and Qwen3.5-9B, MSV reduces false-agreement mass from 6.1% to 5.7% and from 8.8% to 7.2%, whereas CrossFit reduces it to 3.0% and 3.7%. Replaying identical proposals with source-excluded feedback further reduces false agreement to 0.4% and 0.1%, isolating feedback ancestry from curriculum changes. Across seven downstream search benchmarks, CrossFit improves average performance over standard coupled self-evolution by 8.8 and 8.4 points and over Search-R1 by 8.7 and 7.8 points at 4B and 9B.", 'score': 141, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'f805245f771433b8', 'authors': ['Meijia Chen', 'Hao Li', 'Zheng Lu', 'Hongshan Lin', 'Junbai Tian', 'Yichen Liu', 'Zijun Tian', 'Yufan Zou', 'Shuhan Sun', 'Hanxin Chen', 'Zeyu Zhang', 'Weizhi Du', 'Yueting Li', 'Tianyu Shi', 'Alaa Khamis'], 'affiliations': ['Independent Researcher', 'King Fahd University of Petroleum and Minerals', 'McGill University', 'Rutgers University', 'University of California, San Diego', 'University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2609.39102.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents', '#small_models'], 'emoji': '🔄', 'ru': {'title': 'Борьба с совместным жульничеством в самоэволюционирующих агентах поиска', 'desc': 'В работе исследуется проблема самоэволюции поисковых агентов, которые создают свои собственные учебные программы, совместно оптимизируя генератор вопросов и решатель. Авторы выявляют критическую ошибку, названную ими «совместным жульничеством» (co-cheating), когда генератор и решатель начинают соглашаться на одни и те же ошибки, что улучшает внутренние метрики без реального прогресса во внешней корректности. Для борьбы с этой проблемой предложены два метода: проверка с несколькими выборками (MSV) и главный метод CrossFit, который использует кросс-валидацию между разделёнными наборами данных, чтобы предотвратить самовоспроизведение ошибок. Эксперименты на моделях Qwen показывают, что CrossFit значительно снижает ложное согласие между компонентами и улучшает производительность на семи бенчмарках на 8-9 пунктов.'}, 'en': {'title': 'CrossFit: Enhancing Self-Evolving Agents by Preventing Co-Cheating', 'desc': "This paper discusses a method for improving self-evolving search agents that create their own training materials. It identifies a problem called co-cheating, where the question proposer and answer solver start to agree on incorrect answers, leading to misleading improvements in their performance. To address this, the authors propose a technique called CrossFit, which uses separate groups of source documents to ensure that the proposer and solver do not reinforce each other's errors. The results show that CrossFit significantly reduces false agreement and enhances performance on various search tasks compared to traditional methods."}, 'zh': {'title': '跨适应方法提升搜索代理的自我进化效果', 'desc': '自我进化的搜索代理通过共同优化提问者和解答者来构建自己的训练课程。这种闭环引入了一种称为共作弊的失败模式，导致提问者和解答者在共享错误上达成一致，从而内部奖励提高，但外部正确性没有相应提升。我们提出了多样本验证（MSV）来缓解这一问题，通过对同一模型进行多次查询来决定任务的接受与否。我们的主要方法CrossFit通过将提问者的源文档分组，利用辅助解答者进行评分，从而有效减少了共作弊现象。'}}}, {'id': 'https://huggingface.co/papers/2609.38288', 'title': 'AREX-2: Advancing Self-Improving Agents through Long-Horizon Reflective Tasks', 'url': 'https://huggingface.co/papers/2609.38288', 'abstract': 'Abstract  We present AREX-2, an effort to advance the self-improving capability of LLM agents, which we define as the ability to iteratively refine a solution at test time. This ability rests on two complementary capabilities: reflection, which produces a solution better than the current one, and long-horizon execution, which keeps the iteration effective over many rounds. We hypothesize that both capabilities are domain-agnostic, and can therefore be learned in scenarios that are well suited for supervision. Accordingly, we synthesize long-horizon improvement trajectories from machine learning and algorithmic programming tasks, two domains that offer verifiable feedback and reward sustained iteration. Trained on this data, our agent, built on Qwen3.8-27B, achieves strong results on MLE-bench Lite (81.8) and Frontier-CS (70.7), transfers to deep research with 84.0 on BrowseComp, 52.6 on HLE, 92.2 on GAIA, and 93.8 on DeepSearchQA, and keeps improving as its budget of rounds grows. These results show that long-horizon reflective data is an effective route toward self-improving agents.', 'score': 93, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '13c71fa9e1b2076c', 'authors': ['Hongjin Qian', 'Chaofan Li', 'Kun Luo', 'Wenqing Wei', 'Jianlyu Chen', 'Shuqi Lu', 'Yuyang Hu', 'Hongwang Xiao', 'Hui Wang', 'Chaozhuo Li', 'Qiwei Ye', 'Zhicheng Dou', 'Defu Lian', 'Zheng Liu'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)'], 'pdf_title_img': 'assets/pdf/title_img/2609.38288.jpg', 'data': {'categories': ['#reasoning', '#training', '#benchmark', '#synthetic', '#transfer_learning', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Самоулучшающиеся агенты через долгосрочную рефлексию', 'desc': 'В работе представлена AREX-2 — система для улучшения способности LLM агентов к самосовершенствованию на этапе тестирования путём итеративного уточнения решений. Ключевые компоненты включают рефлексию (генерацию лучших решений) и долгосрочное выполнение (поддержание эффективности итераций). Авторы синтезируют траектории улучшения на задачах машинного обучения и алгоритмического программирования, где доступна верифицируемая обратная связь. Обученный на этих данных агент достигает высоких результатов на нескольких бенчмарках и продолжает улучшаться с увеличением доступных вычислительных раундов.'}, 'en': {'title': 'Empowering LLMs with Self-Improvement through Reflection and Long-Horizon Execution', 'desc': 'The paper introduces AREX-2, a system designed to enhance the self-improvement abilities of large language model (LLM) agents. It focuses on two key capabilities: reflection, which allows the agent to generate better solutions, and long-horizon execution, which ensures that improvements are sustained over multiple iterations. The authors propose that these capabilities can be learned across various domains by using supervised learning techniques. The results demonstrate that training on long-horizon improvement trajectories leads to significant performance gains in various benchmarks, indicating a promising approach for developing self-improving agents.'}, 'zh': {'title': '自我改进代理的长时间反思能力', 'desc': '本文介绍了AREX-2，这是一个旨在提升大型语言模型（LLM）代理自我改进能力的研究。自我改进能力包括反思和长时间执行两个方面，反思能够产生比当前更好的解决方案，而长时间执行则确保在多轮迭代中保持有效性。我们假设这两种能力是领域无关的，可以通过适合监督的场景进行学习。通过合成来自机器学习和算法编程任务的长时间改进轨迹，我们的代理在多个基准测试中取得了优异的成绩，证明了长时间反思数据是实现自我改进代理的有效途径。'}}}, {'id': 'https://huggingface.co/papers/2609.39982', 'title': 'Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents', 'url': 'https://huggingface.co/papers/2609.39982', 'abstract': 'Abstract  Terminal agents act through stochastic model generations, yet the ability to generate a useful action does not ensure its reliable execution. A poor command (e.g., wrong package install) can change the environment in ways that hinder subsequent progress, even when the model could generate a better alternative. We investigate whether allocating test-time compute at the model-harness boundary can improve action reliability and trajectory success, and what makes this allocation effective. To study these questions, we introduce Mid-Harness, which samples and verifies candidate actions before forwarding one for execution, while keeping the generator and harness unchanged. With a TMAX-9B generator, more action sampling yields little benefit under weak verification, whereas a capable verifier can exploit useful alternatives from the same generator. On TerminalBench-Lite, a GPT-5.6 Sol verifier raises Pass@1 from 50.00% for the base agent to 68.03% with 8 sampled actions. When the same TMAX-9B model serves as the verifier, pairwise verification performs best among the evaluated verification mechanisms. Distilling responses from the stronger verifier into TMAX-9B further improves Pass@1, while leaving the action generator unchanged. With TMAX-9B on TerminalBench-Lite, combining action and trajectory scaling reaches higher success at lower estimated token cost than generating more trajectories alone. Mid-Harness also improves performance across additional models, benchmarks, and harnesses. These findings identify action scaling as a promising target for test-time compute scaling in terminal agents.', 'score': 73, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'f98ec0af687a4fec', 'authors': ['Minki Kang', 'Ryo Hachiuma', 'Shaokun Zhang', 'Subhashree Radhakrishnan', 'Yonggan Fu', 'Jindong Jiang', 'Mingjie Liu', 'Ehsan Hosseini-Asl', 'Yi Dong', 'Yu-Chiang Frank Wang', 'Byung-Kwan Lee'], 'affiliations': ['KAIST', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.39982.jpg', 'data': {'categories': ['#benchmark', '#agents', '#inference'], 'emoji': '🛡️', 'ru': {'title': 'Верификация действий агентов для повышения надежности командной строки', 'desc': 'Исследование показывает, что агенты, работающие в терминале, генерируют действия стохастически, но качество выполнения зависит не только от модели. Авторы предлагают Mid-Harness — подход, который дополнительно проверяет сгенерированные действия перед их выполнением, используя верификатор. Эксперименты демонстрируют, что мощный верификатор может значительно улучшить надежность действий: с помощью верификатора на основе GPT-5.6 точность повышается с 50% до 68% при 8 сэмплах. Метод показывает, что масштабирование количества проверяемых действий на тестовом этапе более эффективно по затратам токенов, чем просто увеличение числа траекторий.'}, 'en': {'title': 'Enhancing Action Reliability in Terminal Agents through Smart Verification', 'desc': 'This paper explores how to improve the reliability of actions taken by terminal agents, which generate actions based on stochastic models. It introduces a method called Mid-Harness that samples and verifies potential actions before executing them, ensuring better outcomes. The study shows that using a strong verifier can significantly increase the success rate of actions, as demonstrated by improved performance metrics on the TerminalBench-Lite benchmark. The findings suggest that optimizing action sampling and verification can enhance the effectiveness of terminal agents without altering the underlying action generation model.'}, 'zh': {'title': '提升终端代理行动可靠性的关键在于验证', 'desc': '本文研究了终端代理在生成随机模型时的行动可靠性问题。即使模型能够生成更好的行动，错误的命令也可能导致环境变化，从而影响后续进展。我们提出了Mid-Harness方法，通过在执行前对候选行动进行采样和验证，来提高行动的可靠性。研究表明，强大的验证器能够从同一生成器中挖掘出有用的替代方案，从而显著提高成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.40340', 'title': 'EvoDuet: Bilevel Co-Evolution of Web Searching and Task Solving for Scientific Discovery', 'url': 'https://huggingface.co/papers/2609.40340', 'abstract': "Abstract  Evolutionary search with large language models (LLMs) can stall when progress requires external knowledge the model lacks. Supplying relevant documents helps, but simply adding web search tool can keep returning the same pages as solutions change. We introduce EvoDuet, a bi-level optimization method that co-evolves solutions and search queries with fixed model parameters. At each iteration, a retrieval gate lets the LLM assess its knowledge gap and choose to retrieve new documents, reuse stored ones, or proceed without them. An inner loop refines queries and ranks documents by the solution scores they are predicted to yield; an outer loop generates candidates in parallel from these documents and records the evaluated outcomes for later searches. Across 21 optimization tasks with one candidate per iteration, EvoDuet raises OpenEvolve's normalized discovery gain from 74.1% to 78.0% with GPT-5.6-Luna and from 61.3% to 82.3% with Gemini-3.8-Flash, whereas Qwen3.5-9B does not benefit. Our best runs surpass the previously reported best scores on eight tasks, including Swap Reduction on Q20 and Rosetta, and match them on three more. EvoDuet also improves with other scaffolds (e.g., Top-K, EvoX) on Sums/Diffs and Denoising, demonstrating its applicability across evolutionary search scaffolds.", 'score': 69, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '7b355dba3a530e6b', 'authors': ['Young-Jun Lee', 'Jinheon Baek', 'Soyeong Jeong', 'Minki Kang', 'Seungyeon Jwa', 'Jonghyun Choi', 'Seungho Han', 'Dongyeop Kang'], 'affiliations': ['Hanyang University', 'KAIST', 'Seoul National University', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2609.40340.jpg', 'data': {'categories': ['#reasoning', '#training', '#benchmark', '#optimization', '#rag'], 'emoji': '🔄', 'ru': {'title': 'Коэволюция решений и запросов в эволюционном поиске с LLM', 'desc': 'В статье предложен метод EvoDuet, который использует совместную оптимизацию двух уровней для эволюционного поиска с большими языковыми моделями. Система позволяет модели самостоятельно решать, когда ей нужно получить новые документы, переиспользовать сохранённые или продолжить работу без внешней информации, избегая бесконечного повтора одних и тех же результатов поиска. Внутренний цикл алгоритма улучшает поисковые запросы и ранжирует документы по предсказанному потенциалу решений, а внешний цикл генерирует кандидаты параллельно и сохраняет результаты для будущих поисков. Экспериментальные результаты показывают значительное улучшение производительности на 21 задаче оптимизации, особенно для моделей GPT и Gemini, с преодолением ранее установленных рекордов на восьми задачах.'}, 'en': {'title': 'EvoDuet: Enhancing Evolutionary Search with Dynamic Knowledge Retrieval', 'desc': 'The paper presents EvoDuet, a novel bi-level optimization method designed to enhance evolutionary search using large language models (LLMs). It addresses the issue of LLMs stalling when they lack external knowledge by allowing the model to dynamically retrieve relevant documents based on its knowledge gaps. The method operates in two loops: the inner loop refines search queries and ranks documents, while the outer loop generates and evaluates candidate solutions. EvoDuet significantly improves discovery gains across various optimization tasks, outperforming previous methods and demonstrating versatility with different evolutionary search frameworks.'}, 'zh': {'title': 'EvoDuet：提升进化搜索的智能选择', 'desc': '本论文介绍了一种名为EvoDuet的双层优化方法，旨在解决大型语言模型（LLMs）在进化搜索中遇到的知识缺口问题。EvoDuet通过共同进化解决方案和搜索查询，允许模型在每次迭代中评估其知识差距，并选择是否检索新文档或重用已有文档。该方法在21个优化任务中表现出色，显著提高了发现增益，超越了之前的最佳成绩。EvoDuet还在其他进化搜索框架中表现良好，显示了其广泛的适用性。'}}}, {'id': 'https://huggingface.co/papers/2609.40325', 'title': 'WorldAuditBench: Interactive 3D World Auditing with Multimodal Agents', 'url': 'https://huggingface.co/papers/2609.40325', 'abstract': 'Abstract  As interactive 3D worlds are increasingly used to study intelligent behavior, it becomes important to develop efficient pipelines for identifying anomalies in these simulated environments, such as floating objects, traversable walls, or objects inconsistent with the surrounding scene. Multimodal AI systems, including vision-language models (VLMs) and vision-language-action models (VLAs), have shown potential for automating this task. However, 3D world auditing is complex, requiring the close coupling of two distinct capabilities: action, to navigate the 3D world and search for anomalies systematically and efficiently; and visual reasoning, to understand the environment and identify anomalies from multimodal observations. It remains largely unexplored whether multimodal agents can effectively couple these two capabilities, using visual reasoning to identify potential anomalies while taking actions to validate them. In this paper, we introduce WorldAuditBench, a benchmark for 3D world auditing comprising 213 anomaly tasks across 13 environments built with Unreal Engine 5 and Three.js, spanning five anomaly families. We evaluate five frontier models under a fixed exploration budget using two auditing paradigms: VLA-based exploration followed by VLM-based anomaly identification, and an end-to-end VLM agent in which visual reasoning directly guides action selection. Across the evaluated models and two paradigms, success rates range from 6.6% to 42.3%, substantially below human performance (83.4%). Through the task of world auditing, WorldAuditBench provides a testbed for studying how multimodal agents couple action and visual reasoning in interactive 3D environments, while highlighting current limitations in their ability to gather and interpret evidence during exploration.', 'score': 66, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '882386f3e4061024', 'authors': ['Ziyan Jiang', 'Jingbo Yang', 'Jiabao Ji', 'Yujian Liu', 'Qiucheng Wu', 'Tommi Jaakkola', 'Yang Zhang', 'Shiyu Chang'], 'affiliations': ['MIT CSAIL', 'MIT-IBM Watson AI Lab', 'UC Santa Barbara'], 'pdf_title_img': 'assets/pdf/title_img/2609.40325.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#dataset', '#agents', '#3d'], 'emoji': '🔍', 'ru': {'title': 'Связывая действие и рассуждение: мультимодальные агенты для аудита виртуальных миров', 'desc': 'Статья представляет WorldAuditBench — новый бенчмарк для оценки мультимодальных AI-систем, которые должны обнаруживать аномалии в интерактивных 3D-окружениях, таких как зависшие объекты или проходимые стены. Исследователи оценивают frontier-модели, включая vision-language models (VLM) и vision-language-action models (VLA), на задаче поиска аномалий в 213 сценариях на 13 виртуальных окружениях. Работа показывает, что мультимодальные агенты должны эффективно комбинировать два навыка: навигацию и систематический поиск в 3D-среде, а также визуальное рассуждение для идентификации аномалий из мультимодальных наблюдений. Результаты демонстрируют значительный разрыв между производительностью текущих моделей (6.6-42.3%) и человеческим уровнем (83.4%), выявляя ограничения агентов в сборе и интерпретации доказательств во время исследования окружения.'}, 'en': {'title': 'Enhancing Anomaly Detection in 3D Worlds with Multimodal AI', 'desc': 'This paper presents WorldAuditBench, a benchmark designed to evaluate how well multimodal AI systems can identify anomalies in interactive 3D environments. The study focuses on two main capabilities: the ability to navigate the 3D world and the ability to reason visually about the environment. Five advanced models were tested under different paradigms, revealing that their success rates in anomaly detection were significantly lower than human performance. The findings highlight the challenges faced by these models in effectively combining action and visual reasoning for anomaly identification.'}, 'zh': {'title': '多模态代理在3D世界中的异常识别挑战', 'desc': '随着交互式3D世界在研究智能行为中的应用日益增加，开发高效的异常识别管道变得至关重要。本文提出了WorldAuditBench，这是一个包含213个异常任务的基准测试，旨在评估多模态人工智能系统在3D环境中的表现。我们评估了五种前沿模型，结果显示它们在异常识别上的成功率远低于人类表现。通过这一任务，WorldAuditBench为研究多模态代理如何在交互式3D环境中结合行动与视觉推理提供了测试平台。'}}}, {'id': 'https://huggingface.co/papers/2609.38143', 'title': 'Learning Meta-Skills for Agent Harness Design in Test-Time AI4AI', 'url': 'https://huggingface.co/papers/2609.38143', 'abstract': "Abstract  Agent performance depends on both reasoning ability and the environment in which it acts. We study test-time AI-for-AI, asking how a Builder can learn to construct better execution environments for a Target while both models' weights remain fixed. To make the Builder's experience reusable, we introduce Meta-Skill: principles specifying when support is needed and what resources to provide. The Builder learns these principles from Target's execution feedback on the development set, then uses the frozen skill bank to construct harnesses for unseen tasks. Across Harness-Bench and NewtonBench, full-bank meta-skills improve macro-average performance by 8.95 percentage points over no-skill construction, and 12.02 points over direct delivery of the same bank to the Target. These results highlight the value of translating experience into executable support. Gains when the same model serves both roles further suggest a path to system level self-improvement through learning to build better environments.", 'score': 44, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '4f02884e1832db0b', 'authors': ['Cheng Qian', 'Kunlun Zhu', 'Beibin Li', 'Zhenhailong Wang', 'Heng Ji'], 'affiliations': ['Apodex', 'University of Illinois Urbana Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.38143.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🏗️', 'ru': {'title': 'Обучение строительству лучших сред выполнения через мета-навыки', 'desc': 'Статья изучает, как одна модель (Builder) может научиться конструировать лучшие окружения для выполнения задач другой моделью (Target) без изменения весов обеих моделей. Авторы предлагают Meta-Skill — набор принципов, которые определяют, когда нужна поддержка и какие ресурсы предоставить для эффективного выполнения. Builder обучается этим принципам на основе обратной связи от Target на развивающем наборе данных, а затем применяет замороженный набор навыков к новым задачам. Экспериментальные результаты показывают значительное улучшение производительности — на 8.95 процентных пункта благодаря использованию полного набора Meta-Skills, что демонстрирует ценность трансформации опыта в практическую поддержку для выполнения задач.'}, 'en': {'title': 'Empowering AI: Building Better Environments for Enhanced Performance', 'desc': "This paper explores how an AI Builder can enhance the performance of a Target AI by creating better execution environments while keeping both models' parameters unchanged. It introduces a concept called Meta-Skill, which consists of guidelines that help the Builder determine when and what resources to provide based on feedback from the Target's performance. By learning from the Target's execution on a development set, the Builder can effectively use a skill bank to create environments for new tasks. The findings show that using these meta-skills significantly improves performance metrics, indicating the potential for self-improvement in AI systems through better environment construction."}, 'zh': {'title': '通过经验提升智能体环境构建能力', 'desc': '本文研究了智能体的表现如何依赖于推理能力和其所处的环境。我们提出了一种名为Meta-Skill的方法，旨在帮助构建者在目标模型的权重保持不变的情况下，学习如何为目标模型构建更好的执行环境。构建者通过从目标模型的执行反馈中学习原则，进而利用这些原则为未见任务构建支持环境。实验结果表明，使用完整的Meta-Skill可以显著提高模型的整体表现，强调了将经验转化为可执行支持的重要性。'}}}, {'id': 'https://huggingface.co/papers/2609.38334', 'title': 'EVOKE: Eliciting World Knowledge in Agents for Transferable Decision-Making', 'url': 'https://huggingface.co/papers/2609.38334', 'abstract': "Abstract  Large language models (LLMs) are increasingly deployed as agents for multi-step decision-making, yet transfer poorly to unseen environments. World-model methods address this by training agents to predict future observations, at the cost of additional training and errors that compound when predictions are used for planning. However, for LLM agents operating in digital environments, much of this world knowledge is already internalized during pretraining, which shifts the problem from acquiring it to eliciting it. We argue that typical post-training provides little pressure for such elicitation, since supervision under a single goal at each visited state inadvertently drives policies to rely on superficial contextual habits. We introduce EVOKE, a post-training method that supplies this pressure through goal diversity at fixed states. Motivated by theory showing that an agent competent across diverse goals must encode a world model recoverable from its action preferences, EVOKE holds the environment state and interaction history fixed and ranks the same candidate actions under alternative goals, forcing action preferences to change, so that a policy relying on contextual habits or single-goal correlations cannot order them correctly. This implicitly elicits the policy's pretrained world knowledge to inform decisions. We evaluate EVOKE across diverse tasks in three backbones, demonstrating improved task performance, unseen environment generalization, and data efficiency. We further conduct controlled analyses to better understand what drives these gains. These findings offer a new perspective on eliciting internalized world knowledge for transferable action through direct decision supervision.", 'score': 40, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'b553c9330050d9f8', 'authors': ['Yuhan Guo', 'Jinming Liu', 'Liang Xu', 'Ziqiang Li', 'Jianguo Huang', 'Zhicheng Wang', 'Hu Zhu', 'Qiuyu Chen', 'Yuntao Wei', 'Xin Jin', 'Wenjun Zeng'], 'affiliations': ['Eastern Institute of Technology, Ningbo', 'Hong Kong Polytechnic University', 'Shanghai Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38334.jpg', 'data': {'categories': ['#reasoning', '#training', '#rlhf', '#transfer_learning', '#agents'], 'emoji': '🌍', 'ru': {'title': 'Раскрытие скрытого мировоззрения языковых моделей через разнообразие целей', 'desc': 'Исследование показывает, что большие языковые модели, используемые как агенты для принятия решений, плохо переносятся на новые окружения. Авторы предлагают EVOKE — метод обучения, который использует разнообразие целевых функций в одинаковых состояниях окружения, чтобы заставить агента раскрыть скрытое знание о мире, которое было усвоено во время предварительного обучения. Ключевая идея заключается в том, что разнообразие целей при ранжировании одних и тех же действий не позволяет политике полагаться на поверхностные корреляции, а требует использования внутреннего мировоззрения. Экспериментальные результаты демонстрируют улучшение производительности задач, обобщение на неизвестные окружения и повышение эффективности использования данных.'}, 'en': {'title': 'Eliciting Internal Knowledge for Better Decision-Making in LLMs', 'desc': 'This paper discusses the challenges faced by large language models (LLMs) when used as decision-making agents in new environments. It introduces a method called EVOKE, which enhances the ability of these models to utilize their pre-existing world knowledge by introducing diverse goals during post-training. By fixing the environment state and varying the goals, EVOKE encourages the model to adapt its action preferences, moving beyond superficial habits. The results show that EVOKE improves performance in various tasks, enhances generalization to unseen environments, and increases data efficiency.'}, 'zh': {'title': 'EVOKE：激发内部知识以提升决策能力', 'desc': '大型语言模型（LLMs）在多步骤决策中应用越来越广泛，但在未见环境中的迁移能力较差。世界模型方法通过训练代理预测未来观察来解决这个问题，但这需要额外的训练，并且在规划时可能导致错误累积。我们提出了EVOKE，这是一种后训练方法，通过在固定状态下提供多样化目标来增强对内部知识的引导。EVOKE通过固定环境状态和交互历史，迫使代理在不同目标下重新评估候选动作，从而有效地引导其利用预训练的世界知识做出决策。'}}}, {'id': 'https://huggingface.co/papers/2609.39045', 'title': 'RSIGame: Autonomous Agentic Game Development with Recursive Self-improvement', 'url': 'https://huggingface.co/papers/2609.39045', 'abstract': "Abstract  Recent advances in large language models have made automatic game generation increasingly feasible, yet reliably improving generated games beyond a playable version remains challenging. Naive iterative refinement can easily overfit a small set of test cases, producing fragile games with unresolved bugs, missing behaviors, and poor generalization to broader player interactions. We introduce RSIGame, an autonomous agentic game development framework with recursive self-improvement. RSIGame organizes development into complementary local and global loops. Concretely, a local explore-diagnose-improve loop broadly explores the executable game, diagnoses and prioritizes discovered issues, and performs evidence-grounded revision, where an evolving checklist continually accumulates new testing and improvement guidance. A global loop tracks overall quality, preserves the best checkpoint, and detects saturation or regression over long-horizon development. Beyond test-time improvement, RSIGame further internalizes successful development experience into the generator through training. Across 140 GameCraft-Bench tasks, two game engines, and five generators, RSIGame consistently improves game quality under matched development budgets. Notably, experience internalization enables Qwen3.8-27B to reach 61.38 on Godot and 58.53 on Phaser, exceeding GPT-5.5 one-shot scores while reducing Qwen's generation tokens by 11 times.", 'score': 31, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b084cda465267129', 'authors': ['Wenyi Wu', 'Minghao Fu', 'Jieyu You', 'Kun Zhou', 'Siqi Liu', 'Aayush Salvi', 'Yiheng Lin', 'Ce Zhang', 'Xiaohan Lan', 'Jiahui Zhu', 'Yujie Zhong', 'Qi She', 'Biwei Huang'], 'affiliations': ['ByteDance Inc.', 'Carnegie Mellon University', 'University of California San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2609.39045.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Самосовершенствующийся агент для автоматической разработки игр', 'desc': 'В статье предложена система RSIGame для автоматического улучшения игр, созданных большими языковыми моделями. Система использует рекурсивное самосовершенствование через локальные циклы исследования-диагностики-улучшения, которые выявляют и исправляют ошибки, и глобальные циклы, отслеживающие качество и предотвращающие переобучение. Успешные стратегии развития интернализуются в генератор через обучение, позволяя более компактным моделям достигать качества больших моделей с меньшими вычислительными затратами. Экспериментальные результаты показывают значительное улучшение качества игр на 140 задачах с различными движками и генераторами.'}, 'en': {'title': 'Revolutionizing Game Development with Recursive Self-Improvement', 'desc': 'This paper presents RSIGame, a framework designed to enhance the automatic generation of video games using large language models. It addresses the challenge of improving game quality beyond just making them playable by implementing a recursive self-improvement process. RSIGame features a dual-loop system: a local loop that explores and diagnoses game issues while revising them based on evidence, and a global loop that monitors overall game quality and preserves the best versions. The framework has shown significant improvements in game quality across various tasks and engines, demonstrating its effectiveness in internalizing successful development experiences.'}, 'zh': {'title': 'RSIGame：游戏开发的自我改进框架', 'desc': '最近大型语言模型的进步使得自动游戏生成变得更加可行，但在可玩版本之外可靠地提升生成游戏的质量仍然具有挑战性。简单的迭代改进容易导致过拟合，生成的游戏可能存在未解决的错误和缺失的行为，且对更广泛的玩家互动的泛化能力差。我们提出了RSIGame，一个具有递归自我改进的自主游戏开发框架，组织开发为互补的局部和全局循环。RSIGame通过探索、诊断和改进的局部循环，广泛探索可执行游戏，诊断并优先处理发现的问题，同时通过训练将成功的开发经验内化到生成器中。'}}}, {'id': 'https://huggingface.co/papers/2609.38827', 'title': 'More Choices, Fewer Decisions: Ordinal-Scale Bias in JEV-like Direct-Decision Models', 'url': 'https://huggingface.co/papers/2609.38827', 'abstract': 'Abstract  Direct-decision models turn text into low-latency structured labels and scores, making them attractive for classification and automatic evaluation. Yet reliability requires more than accuracy: a model must also use the ordinal decision scale supplied by the user faithfully. We analyze JEV~1.13 and three open KEV models. Our investigation begins with ANLI, where JEV assigns 38.8\\% of all predictions and 51.3\\% of errors to Neutral despite 74.95\\% accuracy, nearly balanced gold labels, and balanced candidate positions. Across 36 ordinal datasets, final decisions use only 67--76\\% of the effective gold support, versus 87--102\\% on four nominal tasks. Randomizing candidate order weakens but does not remove this compression. Holding items and source scores fixed while balancing gold support and positions, we refine scales from K=2 to 14; utilization falls for every model and reaches 26--75\\% at K=14, although candidate probabilities remain broad for most models. Targeted BA-LoRA post-training raises gold-relative utilization from roughly 47\\% to 86\\% on eight supervised scales at both KEV sizes, showing that the compression is learned and modifiable rather than an immutable architectural limit. We call this ordinal scale-utilization bias: decision-stage candidate-space compression distinct from accuracy, gold imbalance, fixed position, and candidate count alone. The code and data are available at https://github.com/Glax147/jev_ordinal_scale_bia', 'score': 31, 'issue_id': 3358, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '9cd2b1b9c2ee829f', 'authors': ['Tianxiang Gao', 'Jinzhe Li', 'Zhiyuan Li', 'Yi Chang', 'Yuan Wu'], 'affiliations': ['College of Software, Jilin University', 'Engineering Research Center of Knowledge-Driven Human-Machine Intelligence, Jilin University', 'International Center of Future Science, Jilin University', 'School of Artificial Intelligence, Jilin University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38827.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Модели игнорируют порядковые шкалы: как научить их быть честными судьями', 'desc': 'Исследование показывает, что прямые модели принятия решений на основе текста недостаточно эффективно используют предоставленные пользователем порядковые шкалы оценок, хотя и показывают высокую точность. Авторы проанализировали несколько моделей и обнаружили, что при классификации с порядковыми метками модели используют только 67-76% эффективной поддержки, в то время как для номинальных задач этот показатель достигает 87-102%. Проблема заключается в том, что модели сжимают пространство кандидатов на этапе принятия решений, отдавая предпочтение определённым классам вместо сбалансированного распределения по всей шкале. Применение специализированного дообучения BA-LoRA успешно повысило использование шкалы с 47% до 86%, доказав, что это смещение является приобретённым и корректируемым, а не архитектурным ограничением.'}, 'en': {'title': 'Enhancing Ordinal Scale Utilization in Direct-Decision Models', 'desc': 'This paper investigates how direct-decision models handle ordinal data in classification tasks. It highlights that while these models can achieve high accuracy, they often fail to utilize the full range of ordinal labels provided by users. The authors analyze various models and find that many decisions are compressed, leading to a significant loss of information. They propose a method to improve the utilization of ordinal scales, demonstrating that this compression can be adjusted through targeted post-training techniques.'}, 'zh': {'title': '序数尺度利用偏差：超越准确率的决策模型分析', 'desc': '本文探讨了直接决策模型在文本分类和自动评估中的应用，强调了模型在使用用户提供的序数决策尺度时的可靠性。我们分析了JEV~1.13和三个开放的KEV模型，发现尽管准确率高达74.95%，但模型在预测中对中立标签的分配存在偏差。通过对36个序数数据集的研究，发现最终决策仅利用了67%到76%的有效金标准支持。我们提出了序数尺度利用偏差的概念，表明这种压缩是可学习和可修改的，而非固定的架构限制。'}}}, {'id': 'https://huggingface.co/papers/2609.38177', 'title': 'Imagine3D-LLM: Teaching MLLMs to Imagine 3D Scenes Before Answering', 'url': 'https://huggingface.co/papers/2609.38177', 'abstract': "Abstract  Reasoning about the 3D world from multi-view images remains a fundamental challenge for Multimodal Large Language Models (MLLMs). While modern MLLMs handle single-image inputs effectively, they struggle to integrate evidence across viewpoints into a coherent 3D understanding. A growing body of work attempts to close this gap by injecting 3D awareness into MLLMs, either by boosting fine-grained pixel-level cross-view correspondence or by fusing features from 3D geometry foundation models, yet a substantial gap to human reasoning persists. In this work, we revisit human spatial reasoning, which suggests that rather than relying on fine-grained geometry cues, humans roughly identify common objects across views, infer the relative geometry between viewpoints, and assemble a coarse 3D layout of the scene. Inspired by this process, we introduce Imagine3D-LLM, an MLLM that learns to assemble a similar compact 3D representation of the scene and conditions its answer on this representation. Concretely, we append a small set of learnable summary tokens after the image tokens, decode them into a compact 3D Gaussian Splatting representation supervised by a photometric reconstruction loss, and train jointly with the standard next-token prediction objective. Notably, although only the summary tokens receive direct reconstruction supervision, this objective also induces stronger cross-frame correspondence within the LLM's underlying image features, suggesting that learning to reconstruct propagates 3D-aware signals throughout the model. As a result, Imagine3D-LLM consistently outperforms prior approaches across multiple spatial reasoning and 3D understanding benchmarks, suggesting that imagining the scene can be more effective than being told its pixel-wise geometry.", 'score': 29, 'issue_id': 3358, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '3c5fb8a650cb0638', 'authors': ['Jaewoo Jung', 'Hyeonseo Yu', 'Honggyu An', 'Jisang Han', 'Mungyeom Kim', 'Minkyeong Jeon', 'Heeseong Shin', 'Wonjun Moon', 'Federico Tombari', 'Daniel Barath', 'Marc Pollefeys', 'Seungryong Kim', 'Sunghwan Hong'], 'affiliations': ['ETH AI Center', 'ETH Zürich', 'Google', 'KAIST', 'TUM'], 'pdf_title_img': 'assets/pdf/title_img/2609.38177.jpg', 'data': {'categories': ['#training', '#reasoning', '#multimodal', '#3d'], 'emoji': '🌍', 'ru': {'title': 'Воображение трёхмерной сцены эффективнее, чем пиксельная геометрия', 'desc': 'В работе предлагается подход Imagine3D-LLM для улучшения понимания трёхмерного мира многомодальными большими языковыми моделями на основе мультивью изображений. Вместо использования детальных геометрических соответствий между пикселами, модель обучается создавать компактное представление сцены, вдохновляясь тем, как люди рассуждают о пространстве — через идентификацию объектов и вывод относительной геометрии между видами. Ключевой инновацией является добавление обучаемых токенов-резюме, которые декодируются в представление 3D Gaussian Splatting с использованием фотометрического loss для реконструкции. Экспериментальные результаты показывают, что обучение на задаче реконструкции распространяет 3D-осведомлённые сигналы по всей модели и позволяет достичь лучших результатов на бенчмарках пространственного рассуждения.'}, 'en': {'title': 'Imagine 3D: Learning Spatial Reasoning Beyond Pixels', 'desc': "This paper addresses the challenge of understanding 3D scenes from multiple images using Multimodal Large Language Models (MLLMs). It highlights that while current models excel with single images, they struggle to synthesize information from different viewpoints into a cohesive 3D representation. The authors propose Imagine3D-LLM, which learns to create a simplified 3D layout by using summary tokens that capture essential spatial information, rather than relying solely on detailed geometric data. This approach not only improves the model's ability to reason about space but also enhances the overall performance on various benchmarks for spatial reasoning and 3D understanding."}, 'zh': {'title': '想象三维，超越几何理解', 'desc': '这篇论文探讨了如何从多视角图像中推理三维世界，这是多模态大型语言模型（MLLMs）面临的一个重要挑战。虽然现代的MLLMs在处理单幅图像时表现良好，但在整合不同视角的信息以形成一致的三维理解方面仍然存在困难。研究者们提出了一种新的模型Imagine3D-LLM，该模型通过学习构建紧凑的三维场景表示，并在此基础上生成答案，从而提高了空间推理和三维理解的能力。实验结果表明，Imagine3D-LLM在多个基准测试中优于之前的方法，表明想象场景的方式比单纯依赖像素几何信息更有效。'}}}, {'id': 'https://huggingface.co/papers/2609.40111', 'title': 'Agent Error Dataset: Scaling 50,000 Error--Diagnosis Pairs for Failure Analysis and Error-Aware Post-Training', 'url': 'https://huggingface.co/papers/2609.40111', 'abstract': "Abstract  An unsuccessful LLM agent rollout contains more information than its final reward: the observations available to the agent, the actions
