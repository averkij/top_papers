成的世界中适配Unreal Engine 5，并通过执行引导的重建过程解决适配过程中出现的不一致问题。我们还引入了GameCode4D基准测试，以系统评估生成的游戏世界在视觉质量、互动真实性等方面的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.02191', 'title': 'The Missing Primitive: Diagnosing and Repairing Mathematical Reasoning in Large Language Models', 'url': 'https://huggingface.co/papers/2610.02191', 'abstract': 'Abstract  While Large Language Models (LLMs) have demonstrated striking capabilities on frontier mathematical problems, it remains unclear whether they possess the structural mathematical understanding underlying their solutions. In this paper, we take a first step toward systematically studying mathematical understanding in LLMs, from diagnosing its distinct capabilities to leveraging these findings to improve post-training. First, we introduce the notion of Mathematical Primitive to probe structural mathematical understanding and propose , a novel benchmark that evaluates mathematical reasoning along four distinct dimensions: Discovery, Generation, Digestion, and Execution. Second, our systematic diagnosis shows that solution accuracy masks distinct capability profiles, primitives unlock substantial latent execution capacity, and Discovery is the dominant bottleneck in mathematical reasoning. Our post-training analysis further shows that discovery-limited failures are particularly amenable to repair. Finally, building on these findings, we introduce , a primitive-privileged self-distillation framework that selectively transfers primitive-guided reasoning into the student model. Extensive experiments demonstrate that  consistently improves mathematical reasoning over baselines across model scales and challenging benchmarks.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'e67b3411e36129c5', 'authors': ['Shuo Xing', 'Zilin Dai', 'Chengyuan Qian', 'Fangzhou Lin', 'Wenjing Chen', 'Ping He', 'Pan Lu', 'Alvaro Velasquez', 'Mohit Bansal', 'Zhengzhong Tu'], 'affiliations': ['DARPA', 'Harvard University', 'Stanford University', 'Texas A&M University', 'University of North Carolina at Chapel Hill', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02191.jpg', 'data': {'categories': ['#training', '#math', '#benchmark', '#interpretability', '#reasoning'], 'emoji': '🧮', 'ru': {'title': 'Примитивы математического понимания: диагностика и улучшение рассуждений LLM', 'desc': 'В работе исследуется глубина математического понимания в больших языковых моделях, которые часто дают правильные ответы, но не обязательно обладают структурным пониманием. Авторы вводят концепцию «Математического Примитива» для диагностики способностей моделей и создают бенчмарк, оценивающий математическое рассуждение по четырём измерениям: открытие, генерация, усвоение и исполнение. Анализ показал, что точность решений скрывает различные профили способностей, а главным узким местом в математическом рассуждении является этап открытия новых подходов. На основе этих выводов предложен метод самодистилляции, который целенаправленно передаёт примитивное рассуждение в студент-модель, улучшая математические способности моделей разных масштабов.'}, 'en': {'title': 'Unlocking Mathematical Reasoning in LLMs with Primitives', 'desc': "This paper investigates the mathematical understanding of Large Language Models (LLMs) by introducing the concept of Mathematical Primitives, which help assess their reasoning capabilities. It presents a benchmark that evaluates LLMs on four dimensions: Discovery, Generation, Digestion, and Execution. The study reveals that while LLMs can produce accurate solutions, their underlying capabilities vary, with Discovery being the main limitation in their reasoning process. To address this, the authors propose a self-distillation framework that enhances LLMs' reasoning by focusing on primitive-guided learning, leading to improved performance across various benchmarks."}, 'zh': {'title': '提升大型语言模型的数学推理能力', 'desc': '本文探讨了大型语言模型（LLMs）在数学理解方面的能力。我们引入了数学原语的概念，以评估模型的结构性数学理解，并提出了一个新的基准，评估数学推理的四个维度：发现、生成、消化和执行。研究表明，解决方案的准确性掩盖了不同的能力特征，而发现是数学推理中的主要瓶颈。基于这些发现，我们提出了一种自蒸馏框架，能够有效地将原语引导的推理转移到学生模型中，从而显著提升数学推理能力。'}}}, {'id': 'https://huggingface.co/papers/2609.32423', 'title': 'PluginRSI: Recursive Improvement of Agent Harnesses with Reusable Plugins', 'url': 'https://huggingface.co/papers/2609.32423', 'abstract': 'Abstract  The harness surrounding a language model is a central determinant of agent performance. Recent methods optimize harnesses by searching over complete programs, where individual mechanisms are difficult to isolate and reuse. We introduce PluginRSI, which represents a harness as a composition of atomized plugins and organizes harness evolution around these plugins. Individual plugins are improved independently and accumulated in a shared library, then recombined into new harnesses at each iteration. PluginRSI improves over existing harness optimization methods across software engineering, command-line interaction, and question-answering tasks. The resulting harnesses retain their advantage when transferred to other solver models without further optimization. The evolved plugin library accelerates subsequent optimization from the initial harness, which helps faster and higher convergence on unseen tasks. These results show that accumulating reusable mechanisms provides an effective basis for continued harness improvement.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '3edf8cce719459fe', 'authors': ['Yaorui Shi', 'Yuchun Miao', 'Yuxin Chen', 'Jiayuan Zhang', 'Yueqing Sun', 'Xierui Song', 'Xiang Wang', 'An Zhang'], 'affiliations': ['Meituan', 'National University of Singapore', 'University of Science and Technology of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2609.32423.jpg', 'data': {'categories': [], 'emoji': '🧩', 'ru': {'title': 'Модульная эволюция агентов через переиспользуемые плагины', 'desc': 'В статье предложен новый метод PluginRSI для оптимизации архитектуры агентов, работающих с языковыми моделями. Вместо поиска по целым программам, метод разбивает архитектуру на атомарные плагины, которые улучшаются независимо друг от друга и накапливаются в общей библиотеке. На каждой итерации эти плагины переиспользуются и комбинируются по-новому для создания более эффективных агентов. Результаты показывают, что эволюционизированные плагины не только улучшают производительность на исходных задачах, но и хорошо переносятся на другие модели без дополнительной оптимизации.'}, 'en': {'title': 'Modular Plugin Optimization for Language Models', 'desc': 'This paper presents PluginRSI, a new method for optimizing the harness of language models by using a modular approach with plugins. Instead of optimizing entire programs, PluginRSI allows for the independent improvement of small, reusable components called plugins, which can be combined in various ways. This method not only enhances performance across different tasks like software engineering and question-answering but also allows for easy transfer of improvements to other models. The study demonstrates that building a library of these plugins leads to faster optimization and better performance on new tasks.'}, 'zh': {'title': '插件化优化：提升语言模型性能的新方法', 'desc': '本文介绍了一种新的方法PluginRSI，用于优化语言模型的使用环境（harness）。该方法将使用环境表示为一组可重用的插件，并围绕这些插件进行演化。每个插件可以独立改进，并存储在共享库中，随后在每次迭代中重新组合成新的使用环境。PluginRSI在多个任务上表现优越，且其优化结果可以无缝迁移到其他模型，显著加快了后续优化的速度。'}}}, {'id': 'https://huggingface.co/papers/2610.04047', 'title': 'Periscope: Extending Frozen Language Models Beyond Their Context Window', 'url': 'https://huggingface.co/papers/2610.04047', 'abstract': "Abstract  A language model reads long text in one quadratic forward pass, stops at the context window, and loses accuracy with length before reaching it. We ask whether the read can be factorized when deciding over a finite set: which document is relevant, which option is supported, which passage is the evidence. Periscope, a training-free inference method, arranges the N chunks of a text on a K{times}K grid with K{=}lceilNrceil and asks a frozen model the same question about K local spans of consecutive chunks and K strided spans that sample the whole text, reading the log-odds of every answer at one token. Each answer takes its best local and strided score, and scoring every chunk by its two spans gives an evidence map at no further cost, whose peak is the chunk behind the answer. Every probe is about sc tokens for a text of s tokens and chunk size c, so a window of W tokens reaches W^{2}/c tokens at s^{1.5} cost. The map replaces the long read. On LongBench v2, reading only the K chunks the map ranks highest, 9k tokens, matches the same model's best window read across windows from 32k to 1M tokens, and on InfiniteBench, where the median context is 150k tokens, it leads the best window read by 5 points. The same map ranks BRIGHT's long-document corpora with the best NDCG@10 of six methods. Each call caches only one probe, so a 27B model reads 4.5M-token contexts on one 80GB GPU, where a single pass would need 296GB of cache. A long read then needs a GPU that holds the model, not one that holds the text.", 'score': 1, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '502f4661c829d442', 'authors': ['Mohamed Eltahir', 'Anas Obayd', 'Raed Rashid', 'Abdulrahman Alghamdi', 'Abdulrahman Mousa', 'Abdallah Ahmed', 'Tanveer Hussain', 'Naeemullah Khan'], 'affiliations': ['Department of Computer Science, Edge Hill University, Ormskirk, England', 'King Abdullah University of Science and Technology (KAUST), Thuwal, Saudi Arabia'], 'pdf_title_img': 'assets/pdf/title_img/2610.04047.jpg', 'data': {'categories': ['#long_context'], 'emoji': '🔍', 'ru': {'title': 'Факторизация длинного чтения через локальную и глобальную сетку для эффективной работы с контекстом', 'desc': 'В статье предложен метод Periscope для эффективного чтения длинных текстов без переобучения модели. Вместо квадратичного прохода через весь контекст, текст разбивается на чанки и расставляется на K×K сетку, где модель проверяет одинаковый вопрос на локальных и глобальных отрезках текста. Каждый ответ получает оценку от локального и глобального диапазонов, что создает карту доказательств для поиска релевантного чанка без дополнительных затрат. Метод позволяет обрабатывать миллионы токенов на одном GPU, требуя памяти только для модели, а не для всего текста.'}, 'en': {'title': 'Efficient Long-Text Reading with Periscope', 'desc': 'This paper introduces Periscope, a novel inference method for language models that allows them to efficiently read long texts by organizing them into a grid of chunks. Instead of processing the entire text in one go, Periscope evaluates local and strided spans of these chunks to determine relevance and support for answers, creating an evidence map. This approach significantly reduces the computational cost and memory requirements, enabling models to handle much larger contexts without needing extensive caching. The results show that Periscope can match or exceed the performance of traditional long-read methods on benchmark datasets while using far less GPU memory.'}, 'zh': {'title': 'Periscope：高效处理长文本的新方法', 'desc': '这篇论文探讨了一种新的语言模型推理方法，称为Periscope。该方法通过将文本分成多个块，并在一个K×K的网格上排列这些块，来提高长文本的处理效率。Periscope在不需要额外训练的情况下，利用局部和跨步的评分来生成证据图，从而找到与问题相关的文本块。实验结果表明，这种方法在处理长文档时，能够显著减少内存需求，同时保持高准确性。'}}}, {'id': 'https://huggingface.co/papers/2610.06184', 'title': 'Arm-wise Compositional Generalization in Dual-Arm Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.06184', 'abstract': 'Abstract  Generalization in multi-arm collaboration can be studied as composing familiar atomic skills in new ways across arms. However, existing evaluations offer limited insight into which training and architectural choices support this ability under different coordination requirements. We introduce ACG-Bench, a benchmark for Arm-wise Compositional Generalization that provides a common testbed for studying skill recomposition in dual-arm policies. It contains 23 task--condition pairs across 8 task families, with 6 in-domain conditions and 17 unseen compositions covering reordering, synchronization, their combination, and cross-task composition. All methods receive the same per-arm atomic prompts, and success requires achieving the task goal while satisfying physical milestones and specified order or timing constraints. Using π_{0.5} as a common vision-language-action backbone, we compare representative data-augmentation and architectural strategies with shared source data and a common evaluation protocol. Our architectural study examines arm-token grouping, skill-specific LoRA adapters (SkillLoRA), and arm-wise attention (AWA), highlighting the complementarity of skill-conditioned parameters and attention structure. Combining these choices yields AE-VLA, which achieves 21.53\\% generalization success in simulation, compared with 2.94\\% for Single π_{0.5}, 3.06\\% for MA-VLA, and 5.53\\% for two independently controlled π_{0.5} policies. On physical SO101 robots, AE-VLA reaches 39.00\\% mean success across five unseen conditions, compared with 10.00\\% for the strongest baseline. These findings provide empirical guidance for designing dual-arm policies that generalize beyond fixed training routines.', 'score': 1, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '2dfca8befca95fe8', 'authors': ['Zaibin Zhang', 'Binghao Ran', 'Yuhan Wu', 'Zhongbo Zhang', 'Yifan Wang', 'Junwei Jiang', 'Junlan Xiao', 'Wangcheng Shi', 'Li Kang', 'Yiran Qin', 'Zhenfei Yin', 'Lijun Wang', 'Huchuan Lu'], 'affiliations': ['Dalian University of Technology', 'Evolving Machines Lab', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.06184.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training', '#robotics', '#benchmark', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Композиционное обобщение в двурукой робототехнике через структурированные навыки', 'desc': 'В работе представлен бенчмарк ACG-Bench для оценки способности двурукой робототехнической системы обобщать базовые навыки и пере組ывать их в новых комбинациях. Исследование сравнивает различные архитектурные решения для vision-language-action моделей, включая методы группировки токенов рук, адаптеры LoRA для отдельных навыков и механизм внимания, ориентированный на конкретную руку. Авторы демонстрируют, что комбинация этих компонентов (модель AE-VLA) значительно улучшает обобщение на невидимые композиции задач, включая переорdering и синхронизацию. Полученные результаты показывают, что правильный выбор архитектуры критичен для обучения политик, которые могут справляться с новыми комбинациями известных навыков.'}, 'en': {'title': 'Enhancing Dual-Arm Robotics: ACG-Bench for Skill Recomposition', 'desc': 'This paper introduces ACG-Bench, a benchmark designed to evaluate how well multi-arm robotic systems can generalize skills in new ways. It focuses on the ability to recombine atomic skills across different tasks and conditions, providing a structured way to test these capabilities. The study compares various training strategies and architectural choices, such as arm-token grouping and skill-specific adapters, to enhance performance in dual-arm policies. Results show that the proposed AE-VLA model significantly outperforms existing methods in both simulation and real-world robot tasks, demonstrating effective generalization beyond the training data.'}, 'zh': {'title': '提升多臂协作的泛化能力', 'desc': '本论文研究了多臂协作中的泛化能力，重点在于如何将熟悉的基本技能以新方式组合应用于不同的任务。我们提出了ACG-Bench，这是一个用于臂级组合泛化的基准测试平台，包含23个任务-条件对，涵盖了多种任务类型和未见组合。通过比较不同的数据增强和架构策略，我们发现技能条件参数和注意力结构的互补性对提高泛化能力至关重要。最终，AE-VLA模型在模拟环境中实现了21.53%的泛化成功率，显著优于其他基线模型，提供了设计双臂策略的实证指导。'}}}, {'id': 'https://huggingface.co/papers/2610.02999', 'title': 'OmniConfess: Eliciting Token Confessions to Mitigate Omni-Modal Hallucination', 'url': 'https://huggingface.co/papers/2610.02999', 'abstract': "Abstract  Omni-modal large language models (OmniLLMs) unify text, images, audio, and video, yet hallucinate when generation relies on the wrong evidence. Existing inference-time methods can reduce hallucinations, but rarely reveal which evidence sustains a generated commitment. We introduce OmniConfess, a training-free method for mitigating omni-modal hallucinations. It fixes a candidate response and re-scores it at token resolution under controlled channel-wise evidence interventions, producing a structured token-by-channel confession that reveals the response's evidential dependence. OmniConfess uses this confession to preserve grounded content and correct commitments driven by irrelevant or contradictory evidence. To evaluate OmniConfess, we construct OmniHalluBench, a 3,540-example benchmark built from six datasets spanning text, image, audio, and video settings and both judgment and free-form generation. Experiments show that OmniConfess mitigates hallucinations across heterogeneous modality and task settings. Our code and benchmark are publicly available at https://github.com/RongHuiQiang/OmniConfess.", 'score': 0, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3f03a60dd329dd97', 'authors': ['Huiqiang Rong', 'Haoran Luo', 'Hui Feng', 'Zhonghong Ou', 'Kaiwen Xue', 'Guoxin Zhang', 'Yifan Zhu'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02999.jpg', 'data': {'categories': ['#inference', '#benchmark', '#multimodal'], 'emoji': '🎭', 'ru': {'title': 'Раскрытие источников ошибок в мультимодальных моделях', 'desc': 'В работе предложен метод OmniConfess для снижения галлюцинаций в мультимодальных больших языковых моделях (OmniLLM), которые обрабатывают текст, изображения, аудио и видео одновременно. Метод является обучаемо-независимым и переоценивает кандидат-ответы на уровне токенов при целевых вмешательствах в отдельные модальности, создавая структурированное свидетельство о том, какие источники информации влияют на генерируемый ответ. Авторы предложили OmniHalluBench — бенчмарк из 3540 примеров для оценки галлюцинаций в мультимодальных задачах. Экспериментальные результаты демонстрируют эффективность OmniConfess в снижении галлюцинаций при работе с разнородными модальностями.'}, 'en': {'title': 'Mitigating Hallucinations in Omni-Modal Models with OmniConfess', 'desc': "This paper presents OmniConfess, a novel method designed to reduce hallucinations in omni-modal large language models (OmniLLMs) that process text, images, audio, and video. Unlike existing methods, OmniConfess does not require training and instead focuses on analyzing the evidence that supports generated responses. It achieves this by fixing a candidate response and re-evaluating it at a granular level, revealing which pieces of evidence influence the model's output. The effectiveness of OmniConfess is demonstrated through a comprehensive benchmark, OmniHalluBench, which shows significant improvements in reducing hallucinations across various modalities and tasks."}, 'zh': {'title': 'OmniConfess：减轻多模态幻觉的创新方法', 'desc': 'Omni-modal大型语言模型（OmniLLMs）能够统一处理文本、图像、音频和视频，但在生成时可能会出现幻觉，尤其是当依赖错误证据时。现有的推理方法可以减少幻觉，但很少揭示生成内容所依赖的证据。我们提出了一种名为OmniConfess的方法，它不需要训练，可以减轻多模态幻觉。OmniConfess通过在受控的证据干预下重新评分候选响应，揭示响应的证据依赖性，从而保留基于证据的内容并纠正由无关或矛盾证据驱动的承诺。'}}}, {'id': 'https://huggingface.co/papers/2610.06850', 'title': 'InterMimicGen: Scaling Humanoid Loco-Manipulation through Self-Evolving Motion Imitation', 'url': 'https://huggingface.co/papers/2610.06850', 'abstract': 'Abstract  Captured human-object interactions provide rich supervision for humanoid loco-manipulation, but they are sparse, heterogeneous, and not directly executable by robots. We introduce InterMimicGen, a self-evolving motion-imitation framework in which robot motion data and a tracking policy improve each other. First, we consolidate motion-captured human-object interaction datasets and retarget them into humanoid robot references while preserving whole-body coordination and dexterous hand-object relationships. This produces a large and diverse humanoid robot reference collection for dexterous whole-body loco-manipulation. Second, we train a physics-based generalist tracker that executes these references in simulation on a humanoid with dexterous hands, covering a scale and diversity beyond prior humanoid tracking systems for loco-manipulation. Third, we close a data flywheel: each round makes small, task-preserving changes to where an interaction takes place and how the body performs it, fine-tunes the tracker on them, and keeps only the variants whose simulated execution completes the task, which seed the next round. With more iterations, these small edits compound into broader coverage around the sparse original demonstrations while preserving task semantics and motion quality. Experiments show contact-preserving retargeting across robot configurations, broad tracking with a single generalist policy, executable motions that keep growing over augmentation rounds, and transfer to real robots. InterMimicGen provides a unified path from heterogeneous human demonstrations to a continually expanding motion resource for humanoid robot learning.', 'score': 0, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'e046b4d05b79748b', 'authors': ['Yucheng Zhang', 'Sirui Xu', 'Jinhong Li', 'Liuyu Bian', 'Anatulya Nandi', 'Derek Zhang', 'Xiangchen Liu', 'Xueting Li', 'Umar Iqbal', 'Yu-Xiong Wang', 'Liang-Yan Gui'], 'affiliations': ['NVIDIA', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.06850.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Самоэволюционирующее обучение роботов через взаимное совершенствование данных и политики', 'desc': 'В работе представляется InterMimicGen — фреймворк для обучения гуманоидных роботов манипуляции объектами на основе захватов движений человека. Авторы разработали метод переноса (retargeting) человеческих взаимодействий с объектами на робота, сохраняя при этом координацию всего тела и ловкость манипулирования рукой. Система использует цикл обратной связи: физически обоснованная политика отслеживания (tracking policy) выполняет эталонные движения в симуляции, а затем автоматически генерирует вариации этих движений с целью расширить разнообразие обучающих данных. Благодаря итеративному процессу аугментации данных система постоянно расширяет репертуар выполняемых движений, сохраняя качество и семантику исходных демонстраций, и успешно переносит навыки на реальных роботов.'}, 'en': {'title': 'Evolving Robot Motion through Human Interaction Mimicry', 'desc': "The paper presents InterMimicGen, a framework designed to enhance humanoid robot loco-manipulation by leveraging human-object interaction data. It consolidates motion-captured datasets and retargets them for humanoid robots, ensuring that the coordination and hand-object interactions are maintained. A physics-based tracker is trained to execute these motions in simulation, allowing for a diverse range of humanoid movements. The framework employs a data flywheel approach, iteratively refining the motion data and expanding the robot's capabilities while preserving the quality and semantics of the tasks."}, 'zh': {'title': '自我进化的运动模仿：人形机器人学习的新路径', 'desc': '本论文介绍了一种名为InterMimicGen的自我进化运动模仿框架，旨在改善人形机器人在复杂环境中的运动能力。通过整合人类与物体交互的数据集，并将其转化为机器人可执行的参考动作，保持全身协调性和灵巧的手部操作关系。该框架还训练了一种基于物理的通用跟踪器，能够在模拟环境中执行这些参考动作，并通过不断迭代优化跟踪器的性能。实验结果表明，该方法能够有效地扩展机器人运动资源，并实现从人类示范到机器人学习的统一路径。'}}}];

            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (11)', '#agents (59)', '#agi', '#alignment (13)', '#architecture (34)', '#audio (10)', '#benchmark (85)', '#cv (14)', '#data (5)', '#dataset (36)', '#diffusion (14)', '#ethics (1)', '#games (4)', '#graphs', '#hallucinations (1)', '#healthcare (2)', '#inference (18)', '#interpretability (14)', '#leakage (2)', '#long_context (15)', '#low_resource (1)', '#machine_translation (2)', '#math (5)', '#multilingual (6)', '#multimodal (49)', '#open_source (25)', '#optimization (41)', '#plp (7)', '#rag (6)', '#reasoning (37)', '#rl (23)', '#rlhf (20)', '#robotics (22)', '#science (7)', '#security (9)', '#small_models (12)', '#story_generation', '#survey (5)', '#synthetic (9)', '#training (92)', '#transfer_learning (11)', '#video (30)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-06 15:46',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-06 15:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-06 15:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
