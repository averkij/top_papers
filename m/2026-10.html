modal intelligence.', 'score': 17, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '61acab164ea469e5', 'authors': ['Xinge Peng', 'Yiting Lu', 'Tianwu Zhi', 'Wen Wen', 'Jianzhao Liu', 'Xin Li', 'Zhibo Chen'], 'affiliations': ['ByteDance', 'City University of Hong Kong', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.00559.jpg', 'data': {'categories': ['#cv', '#video', '#benchmark', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Физический интеллект в мультимодальных моделях: от восприятия к подлинному пониманию', 'desc': 'Статья представляет PhysVista — бенчмарк для оценки физического интеллекта в мультимодальных моделях зрения и языка. Авторы предлагают комплексный подход, который оценивает три ключевые способности: восприятие физического состояния, рассуждение о физической динамике и оценку физической правдоподобности в едином когнитивном цикле. Бенчмарк различает рассуждение на уровне событий и уровне масштаба, позволяя проводить детальный анализ понимания физики. Исследование показало значительные ограничения в физическом рассуждении современных моделей, выявив разрыв между способностью распознавания визуальных признаков и истинным пониманием физики.'}, 'en': {'title': 'PhysVista: Bridging the Gap in Physical Intelligence for VLMs', 'desc': "This paper introduces PhysVista, a new benchmark for evaluating the physical intelligence of Vision-Language Models (VLMs). It addresses the limitations of existing evaluation methods that often isolate cognitive processes, failing to capture the synergy between perception, reasoning, and physical judgment. PhysVista employs a closed cognitive loop framework that mimics human cognitive processes, allowing for a comprehensive assessment of physical state perception, dynamics reasoning, and plausibility evaluation. The benchmark includes both real-world and AI-generated videos, revealing significant gaps in VLMs' physical reasoning capabilities and suggesting the need for improved designs in multimodal intelligence."}, 'zh': {'title': '评估视觉-语言模型的物理智能新基准', 'desc': '本文介绍了一种新的基准测试工具PhysVista，用于评估视觉-语言模型（VLMs）的物理智能。现有的评估方法往往片面，忽视了感知、推理和物理判断之间的内在联系。PhysVista通过一个闭环认知框架，综合评估物理状态感知、物理动态推理和物理合理性评估。实验结果显示，当前的VLMs在物理推理和合理性评估方面存在显著不足，表明视觉识别与真实物理理解之间仍有差距。'}}}, {'id': 'https://huggingface.co/papers/2610.00483', 'title': 'PixelDense: Dense Prediction as Representation Alignment for Pixel Diffusion', 'url': 'https://huggingface.co/papers/2610.00483', 'abstract': "Abstract  Representation alignment (REPA) accelerates diffusion transformer training, but its alignment targets are almost exclusively semantic encoders such as DINOv2 and CLIP. Recent analysis points to spatial structure, not global semantics, as the carrier of the alignment effect, yet dense-prediction foundation models trained to predict that structure remain overlooked as REPA targets. In pixel-space diffusion, SAM2, Depth Anything v2, and Metric3D v2 each outperform the DINOv2-only GenEval baseline, with the two geometric teachers leading the segmentation teacher. A flat sum of all four teachers, however, lands below the best single geometric teacher, as semantic and geometric gradients compete for one denoiser projection. We introduce PixelDense, which routes DINOv2 and SAM2 through a semantic projection stream, routes Depth Anything v2 and Metric3D v2 through a geometric projection stream, and adds a weight-space orthogonality penalty that keeps the two streams in disjoint subspaces. All four teachers are frozen during training and dropped at inference. Applied to PixelGen and DeCo with a single recipe, PixelDense improves GenEval, DPG-Bench, and HPS v2.1, raises PixelGen-XXL's GenEval Overall from 0.7927 to 0.8093, and beats every single-teacher and unfactored multi-teacher variant. In partial-noise reconstruction, independent panoptic, depth, and surface-normal probes show up to 53.1% PQ gain and 36.0% depth AbsRel reduction at τ=0.5 across COCO and Flickr30K. From random initialization, PixelDense also reaches the baseline's peak GenEval 1.23x faster. In SDEdit editing on PIE-Bench, PixelDense keeps more of the source background and layout at every edit strength, raising background PSNR by up to 2.2 dB.", 'score': 17, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '2fe5486a76d22615', 'authors': ['Lehan Yang', 'Daiqing Qi', 'Wenhao Zhang', 'Avery Li', 'Yiqing Yang', 'Yifan Li', 'Yu Kong', 'Haitian Zheng', 'Zhifei Zhang', 'Zhe Lin', 'Varun Jampani', 'Sheng Li'], 'affiliations': ['Adobe', 'Arcade AI', 'Michigan State University', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2610.00483.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training', '#cv', '#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Разделение семантико-геометрических потоков для лучшего выравнивания в диффузионных моделях', 'desc': 'Работа предлагает PixelDense — метод выравнивания представлений для ускорения обучения диффузионных трансформеров, который использует несколько учителей-моделей для предсказания плотных признаков вместо традиционных семантических кодировщиков. Ключевая идея заключается в разделении семантических и геометрических градиентов на отдельные потоки проекций с применением штрафа на ортогональность в пространстве весов, что предотвращает их конкуренцию при обновлении денойзера. Метод демонстрирует значительные улучшения во всех метриках оценки качества генерации изображений, включая восстановление при частичном шуме и редактирование изображений. Благодаря использованию замороженных учителей, которые удаляются на этапе инференса, PixelDense достигает лучших результатов при более быстром обучении по сравнению с однопоточными и нефакторизованными многопоточными альтернативами.'}, 'en': {'title': 'PixelDense: Bridging Semantic and Geometric Learning for Enhanced Diffusion Training', 'desc': 'This paper introduces PixelDense, a novel approach to enhance the training of diffusion transformers by utilizing both semantic and geometric information. It highlights the importance of spatial structure in representation alignment, moving beyond traditional reliance on semantic encoders like DINOv2. By routing different models through separate projection streams and applying an orthogonality penalty, PixelDense effectively prevents competition between semantic and geometric gradients. The results demonstrate significant improvements in various benchmarks, showcasing faster convergence and better performance in tasks like image reconstruction and editing.'}, 'zh': {'title': 'PixelDense：提升扩散变换器训练效率的创新方法', 'desc': '本文提出了一种新的方法PixelDense，用于加速扩散变换器的训练。该方法通过将不同的教师模型（如DINOv2和SAM2）分配到语义和几何投影流中，来优化对齐效果。研究表明，几何教师在像素空间扩散中表现优于传统的语义编码器。实验结果显示，PixelDense在多个基准测试中显著提高了性能，尤其是在图像重建和编辑任务中。'}}}, {'id': 'https://huggingface.co/papers/2609.39687', 'title': 'Better Supervision Is Nearby: Neighborhood On-Policy Self-Distillation', 'url': 'https://huggingface.co/papers/2609.39687', 'abstract': "Abstract  On-policy self-distillation (OPSD) trains mathematical reasoning models using a privileged teacher that sees a reference solution and supervises student-sampled prefixes. Standard OPSD uses one fixed parameter setting at every state, but nearby settings may offer additional supervision. We find that local parameter perturbations reveal complementary reference-aligned corrections under the same reference context. Different experts supply these corrections at different reference positions. Their pool covers more such positions than the unperturbed privileged teacher. We introduce Neighborhood OPSD (N-OPSD) to turn these corrections into supervision at student-visited states. Offline, greedy selection builds a compact pool of frozen experts by rewarding filtered reference-token gains beyond the pool's current best at each position. The highest-peak expert need not provide the best training target. Online routing therefore separates the anchor direction from its level of support. MaxPeak selects the anchor token, and quantile selection chooses among experts whose top token matches it. The student learns from the chosen expert's full next-token distribution through the clipped forward-KL objective inherited from OPSD. We evaluate on AIME 2024, AIME 2025, and HMMT February 2025. Across three independent runs per method, Neighborhood OPSD improves the three-benchmark Average@12 over OPSD by 2.75, 1.67, and 1.94 points on Qwen3-1.7B, 4B, and 8B, respectively. Student-prefix continuations support using the pool beyond the reference trajectories used for selection. Matched ablations support filtered reference-token gains as a selection criterion. Accounting for overlap within the pool and routing by state further improve student accuracy. Inference uses only the distilled student.", 'score': 15, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '6ffc1b5f139eaad6', 'authors': ['Xincheng Wei', 'Yifan Ding', 'Yoshua Li', 'Yuquan Lu', 'Ziheng Li', 'Yi Lu', 'Dongsheng Ma', 'Rongxiang Weng', 'Xunliang Cai'], 'affiliations': ['Meituan, LongCat Team', 'Peking University', 'The Chinese University of Hong Kong, Shenzhen', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2609.39687.jpg', 'data': {'categories': ['#training', '#small_models', '#reasoning', '#math', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Соседство экспертов для дистилляции математического рассуждения', 'desc': 'В этой работе предлагается метод Neighborhood OPSD для улучшения обучения математических моделей через самодистилляцию. Основная идея заключается в использовании множества экспертов-учителей, полученных путём локальных возмущений параметров исходной модели, которые предоставляют дополнительное разнообразное обучающее сигнала. Для каждой позиции в решении выбирается наиболее подходящий эксперт с помощью двухэтапной схемы маршрутизации MaxPeak и квантильной селекции, которые разделяют выбор якорного токена и уровень его поддержки. Метод достигает значительных улучшений на задачах олимпиадной математики (AIME и HMMT), обучая компактную student-модель, которая используется на этапе инференса.'}, 'en': {'title': 'Enhancing Learning with Neighborhood Self-Distillation', 'desc': "This paper introduces Neighborhood On-Policy Self-Distillation (N-OPSD), a method that enhances the training of mathematical reasoning models by utilizing a diverse set of expert corrections based on local parameter perturbations. Unlike standard OPSD, which relies on a single fixed teacher, N-OPSD leverages multiple experts to provide complementary supervision at various reference positions, improving the model's learning process. The approach employs a greedy selection mechanism to create a compact pool of experts, optimizing the training targets based on their performance at specific positions. Experimental results demonstrate that N-OPSD significantly outperforms traditional OPSD across multiple benchmarks, indicating its effectiveness in refining model accuracy through enriched supervision."}, 'zh': {'title': '邻域自蒸馏：提升数学推理模型的训练效果', 'desc': '本文提出了一种新的训练方法，称为邻域自蒸馏（N-OPSD），用于数学推理模型的训练。与传统的在线自蒸馏方法不同，N-OPSD利用局部参数扰动来提供额外的监督信息，从而提高模型的性能。通过选择不同的专家，N-OPSD能够在多个参考位置提供更丰富的纠正信息。实验结果表明，N-OPSD在多个基准测试中显著提高了模型的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.38987', 'title': 'Smaller Models, Better Rejects: Preference Distillation Scaling', 'url': 'https://huggingface.co/papers/2609.38987', 'abstract': "Abstract  Preference distillation typically treats a teacher response as preferred and the student's own response as rejected. This assumes that self-generated failures are the most informative negatives and that rejects must come from a model at least as large as the student, making generation costly at scale. We find neither assumption holds: across students from 7B to 72B, smaller frozen models generate rejects with less inference compute yet train stronger students than self-generated rejects, before and after sequence-level knowledge distillation, on code generation and mathematical reasoning. To explain this result, we derive a finite-horizon utility bound for Direct Preference Optimization in a linearized feature model. The bound characterizes favorable reject distributions and motivates three interventions. First, mixing rejects from smaller and student-scale models improves performance as the smaller model's share increases. Second, reassigning rejects to other prompts and shuffling their code tokens still outperform length-matched gibberish, showing that task structure contributes to reject utility. Third, selecting candidates with lower likelihood under the reference policy improves net transfer when higher-likelihood candidates provide less useful contrast. Lower-likelihood selections outperform higher-likelihood ones for every source. These results suggest that effective rejects preserve task structure while limiting coupling to the reference policy, and that smaller frozen models can provide them at low cost.", 'score': 15, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '62865ec1db9aeaac', 'authors': ['Rui Cai', 'Wenhui Zhu', 'Xiwen Chen', 'Jincheng Cao', 'Han Yu', 'Shayan Mohajer Hamidi', 'Zelin He', 'Qiyao Ma', 'Daiwei Chen', 'Xuanzhao Dong', 'Yuanda Xu', 'Jelena Markovic-Voronov', 'Kayhan Behdin', 'Zhengze Zhou', 'Ran He', 'Alborz Geramifard', 'Rohit Jain', 'Zhe Zhao'], 'affiliations': ['Arizona State University', 'Clemson University', 'LinkedIn', 'Pennsylvania State University', 'University of California, Davis', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.38987.jpg', 'data': {'categories': ['#reasoning', '#training', '#plp', '#rlhf', '#transfer_learning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Дешёвые отказы от маленьких моделей обучают больших студентов лучше', 'desc': 'В этой работе авторы переосмысляют процесс дистилляции предпочтений, показывая, что отрицательные примеры (rejected responses) не обязательно должны генерироваться самой студент-моделью или быть от модели больших размеров. Они демонстрируют, что меньшие замороженные модели генерируют более информативные отрицательные примеры с меньшими вычислительными затратами, чем самогенерируемые отказы, улучшая качество обучения студент-моделей на задачах генерации кода и математических рассуждений. Авторы выводят теоретическую границу полезности для Direct Preference Optimization и предлагают три практических метода: смешивание отрицательных примеров от моделей разных размеров, перераспределение примеров между подсказками и выбор кандидатов с низкой вероятностью по эталонной политике. Результаты показывают, что эффективные отрицательные примеры сохраняют структуру задачи, не связывая обучение с эталонной политикой, позволяя масштабировать дистилляцию предпочтений экономнее.'}, 'en': {'title': 'Unlocking the Power of Smaller Models in Preference Distillation', 'desc': "This paper challenges the traditional approach of preference distillation in machine learning, which typically views the teacher's responses as preferred and the student's responses as failures. The authors demonstrate that smaller, frozen models can generate more informative rejects than self-generated ones, leading to stronger student models in tasks like code generation and mathematical reasoning. They introduce a utility bound for Direct Preference Optimization, which helps explain why mixing rejects from smaller models enhances performance. Additionally, they propose that selecting lower-likelihood candidates can improve the transfer of knowledge, suggesting that effective rejects should maintain task structure while minimizing reliance on the reference policy."}, 'zh': {'title': '小模型的拒绝样本更有效！', 'desc': '偏好蒸馏通常将教师模型的响应视为优选，而学生模型的响应视为被拒绝。这种假设认为自生成的失败是最有信息量的负样本，并且拒绝样本必须来自至少与学生模型同等大小的模型，这使得生成过程在大规模时成本高昂。我们的研究发现，这些假设并不成立：在不同规模的学生模型中，较小的冻结模型生成的拒绝样本在推理计算上更少，但能训练出更强的学生模型。我们提出了三种干预措施，以提高拒绝样本的有效性，表明较小的冻结模型可以以低成本提供有用的拒绝样本。'}}}, {'id': 'https://huggingface.co/papers/2610.02117', 'title': 'Where-OPD: Spatially Guided On-Policy Self-Distillation of MLLMs with Synthetic Scenes', 'url': 'https://huggingface.co/papers/2610.02117', 'abstract': 'Abstract  On-policy self-distillation has recently emerged as an effective approach for improving language-model reasoning by supervising students with a frozen or EMA version of themselves that receives privileged information. Its application to multimodal large language models (MLLMs), however, remains largely unexplored. Recent approaches use privileged visual information, such as image crops corresponding to a question, to improve fine-grained perception, but their gains are confined to tasks that benefit from such visual zooming and require either human-annotated grounding data or external teacher models. We introduce a different form of on-policy self-distillation for MLLMs that provides the teacher with textual, spatially grounded guidance identifying the visual elements relevant to a query. We use procedurally generated scenes with automatically available object identities and spatial coordinates, enabling scalable and annotation-free post-training. The teacher uses this spatial guidance to locate and integrate evidence from multiple relevant image regions, while the student learns to reproduce the resulting behavior from the image and question alone. Our approach consistently improves performance on counting, document and chart understanding benchmarks across multiple models. Importantly, although post-training uses only synthetic scenes, the resulting improvements transfer to real-world perception benchmarks, yielding a 3.23-point gain in average performance across CVBench, V*, ZoomBench, BLINK, HR-Bench, and MME-RealWorld. These results show that spatially grounded privileged information can induce broader perceptual capabilities through on-policy self-distillation, enabling substantial synthetic-to-real transfer beyond the task and data distribution used for post-training. Project page: https://github.com/sirkosophia/Where-OPD', 'score': 14, 'issue_id': 3364, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'faf3522bc53e6bd2', 'authors': ['Sophia Sirko-Galouchenko', 'Monika Wysoczanska', 'Andrei Bursuc', 'Nicolas Thome', 'Spyros Gidaris'], 'affiliations': ['CNRS', 'ILLS', 'ISIR', 'Institut universitaire de France (IUF)', 'Sorbonne Universite', 'Valeo.ai'], 'pdf_title_img': 'assets/pdf/title_img/2610.02117.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#reasoning', '#benchmark', '#synthetic', '#transfer_learning', '#training'], 'emoji': '🎯', 'ru': {'title': 'Пространственная самодистилляция: учим модели видеть лучше через координаты объектов', 'desc': 'В работе предложен метод самодистилляции мультимодальных больших языковых моделей, при котором учитель-сеть получает привилегированную информацию о пространственном расположении объектов в изображении. Метод использует процедурно генерируемые синтетические сцены с известными координатами объектов, что позволяет масштабировать обучение без ручной разметки данных. Учитель локализует релевантные области изображения на основе пространственного руководства и интегрирует информацию из них, а ученик учится воспроизводить это поведение, используя только исходное изображение и вопрос. Подход показывает улучшение производительности на задачах подсчёта объектов и понимания документов, причём достигнутые на синтетических данных результаты хорошо переносятся на реальные изображения.'}, 'en': {'title': 'Enhancing MLLMs with Spatially Grounded Self-Distillation', 'desc': 'This paper presents a novel method of on-policy self-distillation for multimodal large language models (MLLMs) that enhances their reasoning capabilities by using spatially grounded textual guidance. Unlike previous methods that rely on visual information tied to specific tasks, this approach allows the model to learn from automatically generated scenes without the need for human annotations. The teacher model utilizes spatial information to identify and integrate relevant visual elements, while the student model learns to replicate this behavior based solely on the image and question. The results demonstrate significant performance improvements on various benchmarks, indicating that this method effectively transfers learned skills from synthetic to real-world scenarios.'}, 'zh': {'title': '通过在线自蒸馏提升多模态模型的推理能力', 'desc': '本文提出了一种新的在线自蒸馏方法，旨在提升多模态大语言模型（MLLMs）的推理能力。该方法通过提供文本和空间定位的指导，帮助教师模型识别与查询相关的视觉元素。我们使用程序生成的场景，避免了人工标注的需求，实现了可扩展的后训练。实验结果表明，该方法在多个基准测试中显著提高了模型的性能，并且在真实世界的感知基准上也取得了良好的迁移效果。'}}}, {'id': 'https://huggingface.co/papers/2609.32520', 'title': 'When Users Change Their Minds: Measuring and Repairing Intent Drift in LLM Agents', 'url': 'https://huggingface.co/papers/2609.32520', 'abstract': "Abstract  LLM agents often operate over multi-turn interactions in which user intent changes before execution. We study intent drift: the failure mode in which superseded parts of the user's intent continue to influence the final answer or tool action. We introduce IntentFlux, an executable benchmark that converts verifiable tasks into dialogues with controlled intent changes while preserving their original graders. In a 627-case calibration, mean task score falls from 0.476 to 0.384 as dialogues contain more superseded and withdrawn information. Across eight models, the rate of fully correct solutions is significantly lower when the same final task must be recovered from an evolving dialogue rather than given directly in a single turn. We further introduce StateForge, which explicitly maintains the active requirements before generation. On General-Test, it improves mean task score from 0.367 to 0.467. Providing the ground-truth final state improves performance further but still does not recover single-turn performance, indicating that state-estimation errors explain only part of the gap. These results establish intent drift as a measurable multi-turn failure mode and explicit state maintenance as a partial mitigation.", 'score': 14, 'issue_id': 3362, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'f7961b28cd7beb16', 'authors': ['Yanjie Zhang', 'Bowen Cao', 'Zixin Chen', 'Yushi Sun'], 'affiliations': ['CUHK', 'HKUST', 'LIGHTSPEED'], 'pdf_title_img': 'assets/pdf/title_img/2609.32520.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Контроль дрейфа намерения в многошаговых диалогах с языковыми моделями', 'desc': 'В этой работе исследуется проблема дрейфа намерения в мультитурновых диалогах с языковыми агентами, когда устаревшие части пользовательского запроса продолжают влиять на финальный результат. Авторы представляют IntentFlux — тестовый набор, который преобразует проверяемые задачи в диалоги с контролируемыми изменениями намерения, сохраняя исходные метрики оценки. Экспериментально показано, что качество решений падает с 0.476 до 0.384 по мере накопления устаревшей информации, и восемь протестированных моделей значительно хуже справляются с эволюционирующими диалогами по сравнению с прямыми запросами. Предложенный метод StateForge явно отслеживает активные требования и улучшает качество с 0.367 до 0.467, хотя полностью устранить проблему удаётся только при предоставлении истинного финального состояния.'}, 'en': {'title': 'Mitigating Intent Drift in Multi-Turn Dialogues', 'desc': "This paper investigates a problem called intent drift, which occurs when a user's changing intentions during a conversation affect the final outcome of a task performed by language models. The authors introduce IntentFlux, a benchmark that creates dialogues with intentional changes while keeping the original task intact, revealing that task performance declines as more outdated information is included. They also present StateForge, a method that helps maintain the current requirements during task execution, leading to improved performance in multi-turn interactions. The findings highlight intent drift as a significant challenge in multi-turn dialogues and suggest that while state maintenance can help, it does not completely resolve the issue."}, 'zh': {'title': '意图漂移：多轮交互中的挑战与解决方案', 'desc': '本论文研究了在多轮交互中，用户意图变化对大型语言模型（LLM）代理的影响，称为意图漂移。意图漂移是指用户的某些意图被替代后，仍然对最终答案或工具操作产生影响。我们提出了IntentFlux，这是一个可执行的基准，能够将可验证的任务转化为对话，并在保持原始评分者的同时控制意图变化。通过实验，我们发现当对话中包含更多被替代的信息时，任务得分显著下降，并且引入StateForge可以在生成前明确维护活跃需求，从而部分缓解这一问题。'}}}, {'id': 'https://huggingface.co/papers/2610.02181', 'title': 'OmniSeek: Native Tool Integration for Multi-turn Audio-Visual Reasoning', 'url': 'https://huggingface.co/papers/2610.02181', 'abstract': 'Abstract  We present OmniSeek, an agentic framework that transforms an Omni Large Language Model (Omni-LLM) into an active, multi-turn reasoning agent with native tool use. Rather than passively processing an entire audio-visual sequence in a single forward pass, OmniSeek makes evidence acquisition part of the reasoning process: it dynamically decides whether to look or listen, and over which temporal window, to retrieve sparse but critical evidence across different modalities within long contexts. Through an iterative multi-turn protocol, the retrieved raw audio or visual segments are appended back into the context to support subsequent reasoning. To cold-start this capability, we build a data engine that synthesizes OmniTraj-170K, a corpus of multi-hop Chain-of-Thought trajectories with interleaved audio and visual evidence. We first supervise the model on these trajectories to instill multi-turn tool-use behavior, and then further optimize the policy via a two-stage reinforcement learning with verifiable rewards. Moreover, we introduce an Audio-Visual Necessity objective that explicitly rewards successful trajectories whose reasoning depends on both modalities, discouraging single-modality shortcuts. Extensive experiments across a wide range of benchmarks demonstrate that OmniSeek learns adaptive cross-modal evidence seeking and consistently improves audio-visual reasoning performance.', 'score': 14, 'issue_id': 3362, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '7d49f9e9610ef6f7', 'authors': ['Haibo Wang', 'Jiteng Mu', 'Jialu Li', 'Jingru Yi', 'Yuanjun Xiong', 'Jianming Zhang', 'Lifu Huang', 'Mingze Xu'], 'affiliations': ['Adobe Research', 'University of California, Davis'], 'pdf_title_img': 'assets/pdf/title_img/2610.02181.jpg', 'data': {'categories': ['#reasoning', '#multimodal', '#training', '#long_context', '#dataset', '#video', '#agents', '#rl', '#audio', '#synthetic'], 'emoji': '🔍', 'ru': {'title': 'Активный агент с мультимодальным поиском доказательств для глубокого понимания', 'desc': 'OmniSeek — это агентный фреймворк, который превращает Omni-LLM в активного мультимодального агента, способного самостоятельно использовать инструменты для поиска доказательств. Вместо одноразовой обработки всей аудиовизуальной последовательности, модель итеративно решает, когда смотреть или слушать и из какого временного окна извлекать разреженные, но критически важные мультимодальные данные. Для обучения такому поведению авторы создали синтетический датасет OmniTraj-170K с траекториями рассуждений, содержащими чередующиеся аудио и видео доказательства, и применили supervised learning с последующей reinforcement learning оптимизацией. Введённая Audio-Visual Necessity loss функция явно поощряет решения, зависящие от обеих модальностей, препятствуя опоре только на одну модальность.'}, 'en': {'title': 'Empowering Active Reasoning with OmniSeek', 'desc': "OmniSeek is a framework that enhances a large language model (Omni-LLM) by enabling it to actively seek and use information from audio and visual sources during reasoning tasks. Instead of processing all information at once, it intelligently decides when and what to look for, allowing it to gather important evidence over time. The model is trained using a specially created dataset, OmniTraj-170K, which includes complex reasoning tasks that require both audio and visual inputs. By employing reinforcement learning and a unique objective that encourages the use of both modalities, OmniSeek significantly improves the model's ability to reason across different types of information."}, 'zh': {'title': 'OmniSeek：主动推理与跨模态证据获取的结合', 'desc': '本文介绍了OmniSeek，这是一个将Omni大型语言模型（Omni-LLM）转变为主动的多轮推理代理框架。OmniSeek通过动态决定何时查看或倾听，以及在何种时间窗口内获取证据，使得证据获取成为推理过程的一部分。通过迭代的多轮协议，获取的原始音频或视觉片段被重新加入上下文，以支持后续推理。实验表明，OmniSeek能够学习适应性跨模态证据寻求，并持续提高音频-视觉推理性能。'}}}, {'id': 'https://huggingface.co/papers/2609.37362', 'title': 'Pretrain Once, Route Anywhere: Towards a Foundation Model for LLM Routing', 'url': 'https://huggingface.co/papers/2609.37362', 'abstract': 'Abstract  Large language model (LLM) routing aims to assign each query to the most suitable model from a heterogeneous candidate pool, improving the quality--efficiency trade-off of LLM inference. Existing routers are typically learned through local fitting: a router is optimized for a particular query workload and candidate pool, and often requires additional supervision or retraining as the routing environment changes. We ask whether LLM routing can instead be approached from a foundation-model perspective, learning a reusable routing capability that generalizes across tasks, candidate models, and deployment conditions. To this end, we introduce RouteFM, which learns to characterize anonymous candidate models from behavioral context and infer their target-specific capabilities, rather than binding routing decisions to fixed model identities or a single environment. Through episodic pretraining across heterogeneous routing environments, this capability can be reused by a frozen router and adapted to new environments through context alone. Experiments demonstrate transfer across changes in domains, modalities, candidate pools, and context budgets, with the largest gains when behavioral evidence is limited. On MMR-Bench, which is excluded from pretraining, RouteFM outperforms the strongest baseline by 2.23 quality points with only eight observations per candidate. These results support moving LLM routing from repeated local fitting toward a pretrain once, route anywhere paradigm. Our code is publicly available at https://github.com/LAMDA-Model-Reuse/RouteFM.', 'score': 13, 'issue_id': 3362, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'e453d57b810c9428', 'authors': ['Guannan Lai', 'Han-Jia Ye'], 'affiliations': ['National Key Laboratory for Novel Software Technology, Nanjing University', 'School of Artificial Intelligence, Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2609.37362.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#inference', '#training'], 'emoji': '🚦', 'ru': {'title': 'Универсальная маршрутизация LLM через pretrain once, route anywhere', 'desc': 'В работе представлена RouteFM — система маршрутизации запросов между большими языковыми моделями, которая обучается как foundation model для переноса знаний между различными задачами и окружениями. Вместо привязки к конкретным моделям и рабочим нагрузкам, система учится понимать возможности неизвестных кандидатов через их поведение в контексте, позволяя переиспользовать обученную модель без переобучения. Эпизодическое предобучение на разнообразных сценариях маршрутизации обеспечивает хорошую обобщаемость: система демонстрирует успешный трансфер при изменении доменов, модальностей и пула моделей. Экспериментальные результаты показывают улучшение на 2.23 пункта качества на тестовом наборе MMR-Bench при использовании минимального количества наблюдений.'}, 'en': {'title': 'RouteFM: Generalizing LLM Routing for Enhanced Efficiency', 'desc': 'This paper introduces RouteFM, a novel approach to large language model (LLM) routing that enhances the efficiency of model selection for various queries. Instead of optimizing routers for specific tasks or environments, RouteFM learns a generalizable routing capability that can adapt to different models and conditions. By using episodic pretraining, it characterizes candidate models based on their behavior, allowing for effective routing without needing constant retraining. The results show significant improvements in routing performance across diverse scenarios, demonstrating the potential of a reusable routing strategy in LLM applications.'}, 'zh': {'title': '从局部拟合到一次预训练，随处路由的转变', 'desc': '大型语言模型（LLM）路由旨在将每个查询分配给最合适的模型，以提高LLM推理的质量和效率。现有的路由器通常通过局部拟合进行学习，针对特定的查询工作负载和候选池进行优化，且在路由环境变化时常需额外监督或重新训练。我们提出RouteFM，从基础模型的角度出发，学习可重用的路由能力，能够跨任务、候选模型和部署条件进行泛化。通过在异构路由环境中的情节预训练，RouteFM能够在新环境中仅通过上下文进行适应，实验结果显示其在多个领域和条件下的转移能力显著。'}}}, {'id': 'https://huggingface.co/papers/2609.32810', 'title': 'OpenTumorBoard: A Real-World Benchmark of Multidisciplinary Tumor Board Discussion Trajectories', 'url': 'https://huggingface.co/papers/2609.32810', 'abstract': 'Abstract  Multidisciplinary tumor boards integrate multimodal clinical observations and longitudinal patient histories through specialist discussions, yet benchmarks rarely capture these real-world trajectories. We introduce OpenTumorBoard, a benchmark with 611 patient cases and 19,157 discussion turns across ten specialist roles, transcribed from 12,534 minutes of publicly available tumor board recordings on YouTube. The benchmark evaluates two settings: SPECIALIST TURN, in which an LLM responds to a clinically significant question posed during a real discussion, and BOARD SIMULATION, in which it generates an entire back-and-forth discussion and reaches a consensus on therapy recommendations, surgical plans, next actions and clinical trial matching. Evaluation of 14 general-purpose frontier and medical LLMs reveals substantial limitations: the best models score 3.43 out of 5 in clinical equivalence to specialist answers and 2.78 out of 5 in alignment with recorded board conclusions. Supervised finetuning and reinforcement learning improve performance on a held-out test set, suggesting that real-world discussion trajectories can support model adaptation. Three M.D. experts review a subset of the benchmark, finding high information coverage and factuality of patient cases and strong fidelity of extracted consensus conclusions. We will release OpenTumorBoard and its automated curation pipeline to support the development and evaluation of LLMs for multidisciplinary, personalized cancer decision-making.', 'score': 11, 'issue_id': 3364, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': 'e28c685298b880c6', 'authors': ['Anqi Li', 'Zhixuan Ge', 'Yixuan Duan', 'Jiarong Qian', 'Chi-Yu Chen', 'MingYu Lu', 'Huan-Yu Hsu', 'Yu Gu', 'Yue Guo', 'Sheng Wang', 'Wei Qiu', 'Hanwen Xu'], 'affiliations': ['Microsoft', 'National Yang Ming Chiao Tung University', 'Rice University', 'University of Illinois at Urbana-Champaign', 'University of Pennsylvania', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2609.32810.jpg', 'data': {'categories': ['#open_source', '#dataset', '#benchmark', '#science', '#healthcare', '#training', '#rlhf'], 'emoji': '🏥', 'ru': {'title': 'Коллективный разум LLM в онкологии: от отдельных ответов к консенсусу врачебного совета', 'desc': 'Авторы представляют OpenTumorBoard — бенчмарк для оценки больших языковых моделей в контексте многопрофильного обсуждения онкологических случаев. Датасет содержит 611 реальных клинических случаев с 19,157 репликами обсуждения от специалистов десяти направлений, извлеченными из видеозаписей онкологических советов на YouTube. Бенчмарк включает две задачи: ответ модели на клинически значимый вопрос в контексте обсуждения и полная симуляция совещания с достижением консенсуса по лечению и клиническим испытаниям. Исследование показало значительные ограничения современных LLM — лучшие модели достигают оценки 3.43 из 5 по клинической эквивалентности и 2.78 из 5 по соответствию выводам реального совета, однако применение supervised finetuning и обучения с подкреплением демонстрирует потенциал адаптации моделей к реальным клиническим диалогам.'}, 'en': {'title': 'Enhancing Cancer Care with AI: OpenTumorBoard Benchmark', 'desc': 'The paper presents OpenTumorBoard, a new benchmark designed to evaluate large language models (LLMs) in the context of multidisciplinary tumor board discussions. It includes a dataset of 611 patient cases and over 19,000 discussion turns, derived from real tumor board recordings. The benchmark assesses LLMs in two scenarios: responding to specific clinical questions and simulating entire discussions to reach consensus on treatment plans. Results show that while current models have limitations in matching specialist responses, fine-tuning and reinforcement learning can enhance their performance, indicating the potential for LLMs to improve cancer decision-making processes.'}, 'zh': {'title': 'OpenTumorBoard：推动个性化癌症决策的基准', 'desc': '本论文介绍了OpenTumorBoard，这是一个包含611个患者案例和19157次讨论的基准数据集，旨在评估多学科肿瘤委员会的讨论过程。该基准通过分析来自YouTube的肿瘤委员会录音，提供了真实的临床讨论轨迹。研究表明，现有的通用和医学大型语言模型在临床等效性和与委员会结论的一致性方面存在显著局限性。通过监督微调和强化学习可以提高模型的性能，表明真实讨论轨迹可以支持模型的适应性。'}}}, {'id': 'https://huggingface.co/papers/2610.01108', 'title': 'AgSpec: Pushing the Limits of Retrieval-Based Speculative Decoding in Coding Agent Pipelines', 'url': 'https://huggingface.co/papers/2610.01108', 'abstract': "Abstract  Retrieval-based speculative decoding (SD) drafts tokens by copying continuations from existing text, which suits coding agents that repeatedly reproduce code, logs, and earlier attempts. Yet existing methods fall short in agent pipelines: much of the reusable text is missing from their corpora or stored in a form that differs from what the agent emits, and their draft lengths ignore that accept length varies across agents and drifts over turns. We present AgSpec, a framework that supplies the corpus and draft-length policies that existing retrieval engines lack in coding-agent pipelines. AgSpec retrieves from session, workspace, and global corpora, retaining the ongoing session trajectory and indexing opened files in the agent's emission format. It bounds each agent's draft length with an offline-profiled cap and adapts the length online from verification feedback. On two repository-level multi-agent coding benchmarks, AgSpec outperforms five retrieval-based drafters and EAGLE-3 in most evaluated settings, raising generation throughput over autoregressive decoding up to 4.37times at batch size 1 and 4.76times at batch size 16. AgSpec also remains effective on benchmarks without a repository or a multi-agent pipeline, showing that its gains generalize to coding agents broadly.", 'score': 11, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '24f3b435f0a7183a', 'authors': ['Sumin Lee', 'Sukmin Cho', 'Suengjae Lim', 'Youngjin Kwon'], 'affiliations': ['School of Computing, KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.01108.jpg', 'data': {'categories': ['#agents', '#inference', '#plp'], 'emoji': '⚡', 'ru': {'title': 'Умное извлечение для быстрой генерации кода в мультиагентных системах', 'desc': 'В работе представлена AgSpec — фреймворк для спекулятивного декодирования, основанный на извлечении токенов из существующего текста. Метод специально разработан для агентов, которые пишут код и часто переиспользуют существующие фрагменты из сессии, рабочей директории и глобального корпуса текстов. AgSpec адаптивно управляет длиной сгенерированных черновиков, используя офлайн-профилирование и онлайн-адаптацию на основе обратной связи от верификации. На бенчмарках с мультиагентным кодированием AgSpec достигает ускорения генерации в 4-5 раз по сравнению с авторегрессивным декодированием и превосходит существующие методы спекулятивного декодирования.'}, 'en': {'title': 'AgSpec: Boosting Coding Agents with Smart Retrieval and Adaptable Drafting', 'desc': 'The paper introduces AgSpec, a new framework designed to enhance retrieval-based speculative decoding for coding agents. It addresses limitations in existing methods by providing a comprehensive corpus and adaptable draft-length policies tailored for coding tasks. AgSpec effectively retrieves relevant text from various sources while maintaining the context of ongoing sessions and adapting to feedback. The results demonstrate significant improvements in generation throughput compared to traditional methods, making AgSpec a versatile solution for coding agents.'}, 'zh': {'title': 'AgSpec：提升编码代理的生成效率', 'desc': '本文提出了一种名为AgSpec的框架，用于改进基于检索的推测解码（SD）在编码代理中的应用。AgSpec通过从会话、工作区和全局语料库中检索文本，解决了现有方法在代理管道中缺乏可重用文本的问题。它为每个代理设置了草稿长度的限制，并根据验证反馈在线调整草稿长度。实验结果表明，AgSpec在多个多代理编码基准测试中表现优异，生成效率显著提高。'}}}, {'id': 'https://huggingface.co/papers/2609.38886', 'title': 'Benchmarking and Enhancing Skill-Level Memory for Partially Observable Robotic Manipulation', 'url': 'https://huggingface.co/papers/2609.38886', 'abstract': 'Abstract  Recent advances in robot learning have enabled manipulation policies to perform increasingly diverse tasks and generalize across environments. However, reliable execution often depends on hidden task states that cannot be determined from current observations alone, making interaction history essential. We introduce HIDE, a benchmark for evaluating manipulation memory under partial observability. HIDE comprises 15 tasks covering repetition counting, historical-state recall, and execution-progress tracking, with randomized initial configurations and decision points where similar observations require different actions depending on prior events. We further propose SEEK, a framework combining three complementary memory mechanisms to retain historical evidence and track execution state. Evaluations reveal substantial limitations in existing policies on HIDE, while memory augmentation improves task success in both simulation and real-world experiments. Individual mechanisms benefit some tasks but can degrade others; their combination achieves the highest average success rate on HIDE among the evaluated configurations. These findings highlight the importance of maintaining internal representations of hidden task states and matching memory design to task-specific information requirements.', 'score': 11, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'ec21dee306b3665a', 'authors': ['Yansong Shi', 'Jiange Yang', 'Xijie Yang', 'Shaowei Zhang', 'Yuhan Zhu', 'Tao Lu', 'Limin Wang'], 'affiliations': ['Computer Science and Technology, Shanghai Jiaotong University', 'Computer Science and Technology, Zhejiang University', 'School of Information Science And Technology, University of Science and Technology of China', 'Shanghai Artificial Intelligence Laboratory', 'State Key Lab of Novel Software Technology, Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38886.jpg', 'data': {'categories': ['#dataset', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Память робота: как научить манипуляторов запоминать скрытые состояния', 'desc': 'В статье представлен бенчмарк HIDE для оценки способности робототехнических систем работать с частичной наблюдаемостью, когда скрытые состояния задачи нельзя определить только из текущих наблюдений. Авторы предлагают фреймворк SEEK, который комбинирует три дополняющие друг друга механизма памяти для сохранения исторической информации и отслеживания прогресса выполнения задачи. Эксперименты показывают, что существующие политики манипуляции имеют значительные ограничения при работе с HIDE, но добавление механизмов памяти существенно улучшает успешность выполнения как в симуляции, так и в реальных условиях. Исследование демонстрирует важность построения внутренних представлений скрытых состояний и подбора архитектуры памяти в соответствии с требованиями конкретной задачи.'}, 'en': {'title': 'Enhancing Robot Memory for Better Task Performance', 'desc': "This paper presents HIDE, a benchmark designed to assess how well robots can remember and utilize past interactions when performing manipulation tasks under partial observability. The benchmark includes 15 diverse tasks that require robots to count repetitions, recall historical states, and track their progress, all while facing randomized scenarios. The authors introduce SEEK, a framework that integrates three memory mechanisms to enhance a robot's ability to retain crucial historical information and manage its execution state. Results show that while existing policies struggle with HIDE, augmenting memory significantly boosts task success, emphasizing the need for tailored memory strategies based on specific task requirements."}, 'zh': {'title': '提升机器人操控的记忆能力', 'desc': '最近机器人学习的进展使得操控策略能够执行越来越多样化的任务并在不同环境中进行泛化。然而，可靠的执行往往依赖于隐藏的任务状态，这些状态无法仅通过当前观察来确定，因此交互历史变得至关重要。我们提出了HIDE，这是一个用于评估在部分可观察情况下操控记忆的基准，涵盖了15个任务，包括重复计数、历史状态回忆和执行进度跟踪。我们还提出了SEEK框架，结合三种互补的记忆机制，以保留历史证据并跟踪执行状态，评估结果显示现有策略在HIDE上的局限性，而记忆增强在模拟和现实实验中提高了任务成功率。'}}}, {'id': 'https://huggingface.co/papers/2609.32536', 'title': 'Do Audio LLMs Listen Before They Act? Diagnosing Acoustic-Context Gating in Voice Agents', 'url': 'https://huggingface.co/papers/2609.32536', 'abstract': 'Abstract  Audio language models can recognize spoken commands and invoke tools, but an agent must first decide whether the acoustic and conversational context warrants action. We introduce VGBench, a 1,018-item diagnostic benchmark for action-level addressedness across side-talk, self-talk, and speaker-switch scenarios. Each item uses a shared action space comprising silence, a tool call, and a natural-language answer. Speaker-switch pairs hold the specified words fixed while source, distance rendering, and a temporal boundary define a controlled wearer-to-bystander shift. Six raw Audio LLMs and three training-free adaptations often identify the target tool yet rarely withhold action under this shift; the highest raw switch mute rate is 14%. We then use VoxGate as a post-training case study. Supervised training mutes 91.3% of switched commands while choosing the correct tool for all nearby wearer commands and text-only controls. An exploratory GRPO stage has similar switch performance; side-talk accuracy rises from 68.4% to 70.9%, and self-talk muting from 52.0% to 60.0%. Factorized controls identify an independent source-change effect, while sensitivity to the far-field manipulation varies across acoustic renderings. The benchmark therefore measures multi-cue acoustic-context gating rather than isolated speaker identity.', 'score': 11, 'issue_id': 3362, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '0c466114bc8668c2', 'authors': ['Yanjie Zhang', 'Nanchen Hu', 'Yushi Sun'], 'affiliations': ['HKUST', 'LIGHTSPEED'], 'pdf_title_img': 'assets/pdf/title_img/2609.32536.jpg', 'data': {'categories': ['#audio', '#benchmark', '#agents', '#training'], 'emoji': '🎤', 'ru': {'title': 'Научить модель различать, когда её слушают: контекстное понимание в аудио-ассистентах', 'desc': 'В работе представлена VGBench — диагностический бенчмарк из 1018 примеров для оценки способности аудио языковых моделей определять, нужно ли выполнять команду в различных акустических контекстах (посторонние разговоры, разговоры с собой, смена говорящего). Авторы показали, что современные Audio LLM хорошо распознают целевые инструменты, но плохо подавляют действия при смене говорящего — лучший результат составляет всего 14% корректного отказа. Используя VoxGate как методологический пример, исследователи продемонстрировали, что контролируемое обучение может подавлять 91.3% команд от посторонних людей, сохраняя корректность выполнения команд владельца устройства. Бенчмарк измеряет комплексное понимание акустического контекста через множество сигналов, а не только идентификацию говорящего.'}, 'en': {'title': 'Enhancing Context Awareness in Audio Language Models', 'desc': "This paper presents VGBench, a benchmark designed to evaluate how well audio language models (LLMs) can determine when to act on spoken commands in various conversational contexts. It includes 1,018 items that test the models' ability to recognize when to mute actions based on speaker changes and background conversations. The study shows that while some models can identify the correct tool to use, they often fail to withhold action when the speaker changes, indicating a need for better context awareness. The results highlight the importance of multi-cue acoustic-context gating in improving the performance of audio LLMs in real-world scenarios."}, 'zh': {'title': '多线索音频上下文的智能门控', 'desc': '本文介绍了VGBench，这是一个包含1018个项目的诊断基准，用于评估音频语言模型在不同对话场景中的行动适当性。研究表明，尽管六种原始音频语言模型能够识别目标工具，但在说话者切换的情况下，它们很少能够抑制不必要的行动。通过监督训练，模型在切换命令时的抑制率达到了91.3%，并且能够正确选择所有附近佩戴者的命令。该基准测试强调了多线索音频上下文的门控能力，而不仅仅是孤立的说话者身份。'}}}, {'id': 'https://huggingface.co/papers/2610.00825', 'title': 'Align Then Reason: A Multimodal Lip-Sync Judge for Dubbing', 'url': 'https://huggingface.co/papers/2610.00825', 'abstract': "Abstract  Dubbing quality control requires a reference-free judge that can determine whether a candidate text line matches a speaker's visible articulation in both content and timing, using only silent video and text because dubbed audio may not yet exist. Existing visual speech recognizers and video-language models are poorly suited to this setting: even when fine-tuned to recover spoken content from lip motion, they remain largely insensitive to temporal errors. We introduce Align Then Reason (ATR), a multilingual lip-sync judge that first establishes a monotonic alignment between frame-level lip representations and the phonetic units of the candidate line, then reasons over this alignment to make the final judgment. An alignment scorer provides the LLM with both local evidence for each phonetic unit and a calibrated global alignment score, enabling it to reason jointly about content and timing. On a seven-language benchmark, our method improves mean AUC over the corresponding Qwen3.5 SFT baselines by 59.4%, 50.2%, and 50.8% with 2B, 4B, and 9B reasoners, respectively. The gains generalize across LLM families, reaching mean AUC improvements of 45.9% and 46.6% over the best baseline for LLaMA-3.1-8B and Mistral-7B, respectively. They also transfer across datasets to three unseen MuAViC languages. Furthermore, we evaluate on two downstream tasks built from real dubbing lines. On dub-line reranking, ATR-9B outperforms the best lip-reading baseline by 52.0%, while on script-to-clip assignment, ATR-9B improves over the best lip-reading baseline by 17.7%.", 'score': 11, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '357995f6004c63bd', 'authors': ['Rui Liu', 'Bhavin Jawade', 'Haoqi Li', 'Shivam Mehta', 'Karan Saxena', 'Yinghong Lan', 'Cameron R. Wolfe'], 'affiliations': ['Netflix', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2610.00825.jpg', 'data': {'categories': ['#video', '#multimodal', '#benchmark', '#multilingual'], 'emoji': '🎬', 'ru': {'title': 'Синхронизация губ через выравнивание и рассуждение для контроля качества дубляжа', 'desc': 'Авторы предложили метод ATR для оценки качества дубляжа, который проверяет соответствие текста движениям губ актера в видео без звука. Система использует монотонное выравнивание между представлениями губ на уровне кадров и фонетическими единицами текста, затем передает эту информацию в LLM для анализа. Подход значительно превосходит существующие модели распознавания речи по губам и видео-языковые модели, улучшая метрику AUC в среднем на 50-59% на семиязычном бенчмарке. Метод успешно переносится на новые языки и реальные задачи дубляжа, такие как переранжирование вариантов дубля и привязка сценария к видеоклипам.'}, 'en': {'title': 'Aligning Lip Movements for Better Dubbing Quality', 'desc': 'This paper presents a new method called Align Then Reason (ATR) for evaluating dubbing quality by analyzing silent video and text. ATR creates a precise alignment between lip movements and phonetic units of the spoken text, allowing it to assess both content accuracy and timing. The method significantly outperforms existing visual speech recognizers and language models, achieving substantial improvements in mean AUC across multiple languages and datasets. Additionally, ATR demonstrates strong performance in practical applications like reranking dubbing lines and matching scripts to video clips.'}, 'zh': {'title': '口型同步评估的新方法：Align Then Reason', 'desc': '本论文提出了一种新的多语言口型同步评估方法，称为Align Then Reason (ATR)。该方法通过建立帧级口型表示与候选文本的音素单元之间的单调对齐，来判断口型与文本内容和时序的匹配。ATR利用对齐评分器为大型语言模型提供局部证据和全局对齐分数，从而共同推理内容和时序。实验结果表明，ATR在多种语言基准测试中显著提高了评估性能，尤其在真实配音任务中表现优异。'}}}, {'id': 'https://huggingface.co/papers/2609.34210', 'title': 'RLE-Bench: A Qualifying Exam for Coding Agents as Robot Learning Engineers', 'url': 'https://huggingface.co/papers/2609.34210', 'abstract': "Abstract  Coding agents are beginning to move beyond purely digital tasks to tackle physical-world challenges, particularly in robotics. Existing robotics benchmarks, however, primarily focus on the performance of individual artifacts, such as policies or controllers, offering limited coverage of coding agents' broader engineering capabilities. Real-world robotics extends beyond control: agents must build, integrate, diagnose, and improve heterogeneous artifacts under resource constraints and reason from multimodal feedback. To evaluate these broader capabilities, we introduce RLE-Bench, a benchmark of robot-learning tasks spanning four representative robotics development workflows: interactive control, policy learning, perception and estimation, and mechanical design. We use diverse task-specific metrics to evaluate the artifacts submitted by the coding agents, from the success rate the agents achieved to the policy agents trained, the harness agent built, and the mechanical structures the agent designed. We aggregate these metrics into an overall RLE Index and report workflow-specific capability profiles, enabling systematic comparison of coding agents' capabilities across multiple capability dimensions. Beyond performance ranks, we also conduct in-depth case studies examining agent behavior on representative tasks, highlighting both current capabilities and limitations, and pointing to the opportunities robotics tasks have to offer for future agent training.", 'score': 10, 'issue_id': 3364, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'f29a59ccbfc202b1', 'authors': ['Haitong Ma', 'Chenxiao Gao', 'Rushi Qiang', 'Bo Dai', 'Na Li'], 'affiliations': ['Georgia Institute of Technology', 'Harvard University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34210.jpg', 'data': {'categories': ['#multimodal', '#agents', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Комплексная оценка инженерных способностей кодирующих агентов в робототехнике', 'desc': 'В работе представлен RLE-Bench — новый бенчмарк для оценки способностей кодирующих агентов в робототехнике, выходящих за рамки простого управления. Бенчмарк охватывает четыре основных рабочих процесса: интерактивное управление, обучение политик, восприятие и оценка, а также механическое проектирование. Авторы используют разнообразные метрики для оценки артефактов, созданных агентами, и вводят RLE Index для комплексного анализа способностей агентов по нескольким параметрам. Исследование включает детальные анализы поведения агентов, раскрывающие их текущие сильные стороны и ограничения в решении реальных робототехнических задач.'}, 'en': {'title': 'RLE-Bench: Expanding Robotics Evaluation Beyond Control', 'desc': "This paper introduces RLE-Bench, a new benchmark designed to evaluate the broader engineering capabilities of coding agents in robotics. Unlike traditional benchmarks that focus solely on individual performance metrics, RLE-Bench assesses agents across four key workflows: interactive control, policy learning, perception and estimation, and mechanical design. The benchmark uses a variety of task-specific metrics to provide a comprehensive evaluation of agents' abilities, including their success rates and the quality of the artifacts they produce. Additionally, the paper includes case studies that analyze agent behavior, revealing both strengths and weaknesses, and suggesting areas for future development in robotic training."}, 'zh': {'title': 'RLE-Bench：全面评估机器人编码代理的能力', 'desc': '本文介绍了RLE-Bench，这是一个新的机器人学习基准，旨在评估编码代理在物理世界中的多种能力。现有的机器人基准主要关注单一的控制策略，而RLE-Bench则涵盖了互动控制、策略学习、感知与估计以及机械设计等多个开发工作流程。通过多样化的任务特定指标，我们可以全面评估编码代理的表现，包括成功率、训练的策略和设计的机械结构等。该基准不仅提供了性能排名，还通过案例研究深入分析了代理在代表性任务中的行为，揭示了当前能力和局限性，并指出了未来训练的机会。'}}}, {'id': 'https://huggingface.co/papers/2610.00686', 'title': 'SemanTok: Predictable Semantic Tokens for Efficient Autoregressive Video Generation', 'url': 'https://huggingface.co/papers/2610.00686', 'abstract': "Abstract  Recent video-based world models pair the scalability of autoregressive (AR) prediction with the visual quality of diffusion models. The choice of scene tokenizer is paramount for the optimal performance of each of these, both in terms of fidelity and semantics. Flexible-length, coarse-to-fine tokenizers yield exactly that: the first coarse tokens carry the clip's global semantics while later tokens further specify details. Existing flexible tokenizers only apply a representation-alignment (REPA) loss on early decoder hidden states, a target the decoder can partly meet from its noised input instead. We introduce SemanTok, a flexible video tokenizer that feeds frozen DINO features into its encoder and adds lightweight heads that reconstruct them from each retained token prefix alone. SemanTok achieves high semantic alignment and video fidelity at every AR model size: a 201M SemanTok AR model matches or beats a VideoFlexTok AR model 3.4times its size, and larger SemanTok AR models further improve fidelity. It keeps semantic alignment on out-of-distribution classes and gives the decoder higher semantic alignment at every noise level, including pure noise. It performs well in both reconstruction and generation, and its short token prefixes are cheaper to predict and give better generation fidelity, with pixel detail deferred to later tokens.", 'score': 10, 'issue_id': 3364, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '0f2c5bdac2f2dcef', 'authors': ['Mikhail Dereviannykh', 'Vikram Voleti', 'Simon Donne', 'Mallikarjun Byrasandra Ramalinga Reddy', 'Shimon Vainer', 'Mark Boss'], 'affiliations': ['Karlsruhe Institut fur Technologie', 'Stability AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.00686.jpg', 'data': {'categories': ['#video', '#optimization', '#diffusion', '#training', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Семантическое выравнивание в видео-токенизации через замороженные признаки', 'desc': 'В статье представляется SemanTok — гибкий видео-токенизатор для мировых моделей, основанный на видеопредсказании. Ключевая идея заключается в использовании замороженных DINO-признаков и лёгких головок для реконструкции семантической информации из каждого префикса сохранённых токенов. Это позволяет достичь высокого семантического выравнивания и верности видео на всех размерах авторегрессионной модели, при этом компактная модель из 201M параметров превосходит существенно более крупные конкурентов. Метод демонстрирует улучшенное выравнивание семантики на распределениях данных и обеспечивает более эффективное предсказание благодаря коротким префиксам токенов.'}, 'en': {'title': 'SemanTok: Elevating Video Tokenization for Better Fidelity and Semantics', 'desc': 'This paper presents SemanTok, a new flexible video tokenizer that enhances video-based world models by improving semantic alignment and visual fidelity. It utilizes frozen DINO features and lightweight heads to reconstruct video representations from token prefixes, allowing for better performance across various autoregressive (AR) model sizes. SemanTok outperforms existing tokenizers, achieving high fidelity even with smaller models and maintaining semantic accuracy on unseen classes. The approach also optimizes the prediction process by deferring pixel detail to later tokens, resulting in more efficient and higher-quality video generation.'}, 'zh': {'title': '灵活视频标记器SemanTok：提升语义对齐与视频保真度', 'desc': '最近的视频基础世界模型结合了自回归预测的可扩展性和扩散模型的视觉质量。场景标记器的选择对这些模型的性能至关重要，影响其保真度和语义。我们提出了SemanTok，这是一种灵活的视频标记器，通过其编码器输入冻结的DINO特征，并添加轻量级头部，仅从每个保留的标记前缀重建它们。SemanTok在每个自回归模型大小上都实现了高语义对齐和视频保真度，且在重建和生成任务中表现良好。'}}}, {'id': 'https://huggingface.co/papers/2609.40222', 'title': 'LOCI: Spatial Linear Memory for Streaming World Models', 'url': 'https://huggingface.co/papers/2609.40222', 'abstract': 'Abstract  When a camera revisits a previously observed region, a video world model should reproduce what was there before. This requires both remembering past observations and retrieving the right one for the current viewpoint. Key-value caches preserve visual detail but grow with video length; recurrent memory is compact but compresses history into a fixed-size state, so individual past observations are no longer directly accessible. We introduce LOCI, a hybrid spatial-memory architecture that keeps both representations. In half of the transformer blocks, main attention keeps a key-value cache of past observations; in the other half, it is restricted to the current chunk and complemented by a recurrent linear-attention memory whose reads and writes are conditioned on projective camera geometry, so viewpoint enters both memory addressing and stored content. Recurrent readouts flow into subsequent cache-backed blocks and supply their queries with accumulated scene context. On the public MIND memory benchmark and on held-out recorded trajectories, LOCI reproduces revisited content more faithfully than representative world models and a same-recipe full-softmax model; with full history, it lowers peak memory at equal length by about 30% relative to full softmax. With a bounded bank of retained observations, it streams long videos at constant memory and remains more faithful than full softmax under the same budget.', 'score': 10, 'issue_id': 3363, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '4b6f59931703c9c0', 'authors': ['Ji Xia', 'Tingting Liao', 'Xuezhi Liang', 'Hao Li', 'Guangyi Liu'], 'affiliations': ['Institute of Foundation Models, Mohamed bin Zayed University of Artificial Intelligence', 'Mohamed bin Zayed University of Artificial Intelligence', 'Pinscreen'], 'pdf_title_img': 'assets/pdf/title_img/2609.40222.jpg', 'data': {'categories': ['#video', '#benchmark', '#architecture'], 'emoji': '🎥', 'ru': {'title': 'Гибридная память для верного воспроизведения сцен в видеомоделях мира', 'desc': 'Работа представляет LOCI, гибридную архитектуру пространственной памяти для видеомоделей мира, которая сочетает кэш ключ-значение для сохранения визуальных деталей с компактной рекуррентной памятью на основе линейного внимания. Система решает проблему баланса между полнотой истории наблюдений и эффективностью использования памяти, применяя геометрию камеры для адресации и содержимого памяти. На бенчмарке MIND и записанных траекториях LOCI достигает лучшего воспроизведения переданных сцен, сокращая пиковое потребление памяти на 30% по сравнению с полносвязным трансформером. Архитектура позволяет обрабатывать длинные видео при ограниченном объёме памяти, сохраняя точность воспроизведения сцен при повторных визитах камеры.'}, 'en': {'title': 'LOCI: Smart Memory for Video World Models', 'desc': 'This paper presents LOCI, a novel hybrid spatial-memory architecture designed for video world modeling. LOCI combines key-value caches and recurrent memory to effectively remember and retrieve past observations when a camera revisits a scene. By utilizing projective camera geometry, LOCI enhances memory addressing and content storage, allowing for better scene context accumulation. The results show that LOCI outperforms existing models in faithfully reproducing revisited content while maintaining lower memory usage.'}, 'zh': {'title': 'LOCI：高效的视频世界记忆模型', 'desc': '本文提出了一种名为 LOCI 的混合空间记忆架构，旨在提高视频世界模型在相机重访先前观察区域时的表现。该模型结合了关键值缓存和递归记忆，能够同时保留视觉细节和历史信息。通过在变换器块中使用不同的注意力机制，LOCI 能够根据相机视角有效地检索和存储过去的观察数据。实验结果表明，LOCI 在公共 MIND 记忆基准测试中表现优于其他代表性世界模型，且在相同内存预算下能够更忠实地重现重访内容。'}}}, {'id': 'https://huggingface.co/papers/2610.00348', 'title': 'Removing the NEEDLE in the Haystack: Backdoor Removal in LLMs via Weight Orthogonalisation', 'url': 'https://huggingface.co/papers/2610.00348', 'abstract': "Abstract  Backdoor attacks can be implanted in Large Language Models (LLMs) during training, causing unwanted behaviour when a trigger appears in the input. Existing backdoor defences for LLMs attempt to remove the backdoor but inadvertently shift the model's output distribution to benign prompts, which can result in degraded model performance and safety. We propose NEEDLE, a training-free method for targeted backdoor removal. Once a trigger has been identified, our method estimates a backdoor direction and a refusal subspace through activation vectors, then applies sequential weight orthogonalisation to suppress the backdoor while preventing changes in refusal-related representations. NEEDLE requires neither a clean reference model nor the original poisoned training data. Evaluation is conducted across multiple model families and attack types. NEEDLE achieves the lowest mean Attack Success Rate (ASR) among the evaluated defences, including 0% on challenging code injection attacks, while resulting in the lowest KL divergence and minimal changes in capability and safety.", 'score': 10, 'issue_id': 3363, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'f4a8a2892d9ae55f', 'authors': ['Minoo Kim', 'Vasileios Lampos', 'George Drayson'], 'affiliations': ['Centre for AI, Computer Science, UCL', 'Locai Labs'], 'pdf_title_img': 'assets/pdf/title_img/2610.00348.jpg', 'data': {'categories': ['#security'], 'emoji': '🧵', 'ru': {'title': 'Хирургическое удаление скрытых атак из языковых моделей без переобучения', 'desc': 'В статье рассматривается проблема скрытых атак (backdoor attacks) на большие языковые модели, которые внедряются во время обучения и активируются триггерными фразами. Авторы предлагают NEEDLE — метод удаления backdoor без дополнительного обучения, который использует анализ активационных векторов для определения направления атаки и подпространства отказа. Метод применяет последовательную ортогонализацию весов модели, чтобы подавить вредоносное поведение, сохраняя при этом безопасность и производительность модели. Результаты показывают, что NEEDLE достигает нулевого процента успешных атак на сложные примеры инъекции кода, минимизируя при этом расхождение распределений выхода.'}, 'en': {'title': 'NEEDLE: Precision Backdoor Removal for LLMs Without Training', 'desc': "This paper addresses the issue of backdoor attacks in Large Language Models (LLMs), where malicious triggers can cause the model to behave undesirably. Existing defenses often compromise the model's performance by altering its output distribution even for benign inputs. The authors introduce NEEDLE, a novel method that removes backdoors without requiring a clean model or original training data. NEEDLE effectively suppresses backdoor influences while maintaining the integrity of the model's performance and safety, achieving impressive results in various evaluations."}, 'zh': {'title': 'NEEDLE：无训练的后门去除方法', 'desc': '本论文讨论了大语言模型（LLMs）中的后门攻击问题，这种攻击在训练过程中植入，导致在输入中出现触发器时产生不良行为。现有的后门防御方法试图去除后门，但往往会无意中改变模型对正常提示的输出分布，从而降低模型的性能和安全性。我们提出了一种名为NEEDLE的方法，这是一种无训练的针对性后门去除方法，能够在识别触发器后，通过激活向量估计后门方向和拒绝子空间，并应用顺序权重正交化来抑制后门。NEEDLE不需要干净的参考模型或原始的污染训练数据，在多种模型和攻击类型的评估中表现出最低的攻击成功率（ASR），并在能力和安全性方面保持最小的变化。'}}}, {'id': 'https://huggingface.co/papers/2610.01499', 'title': 'VTR-Bench: A Systematic Benchmark for Evaluating Visual Text Rendering in Video Generation', 'url': 'https://huggingface.co/papers/2610.01499', 'abstract': 'Abstract  Recent video generation models can produce highly realistic videos from natural language instructions, with visual quality approaching cinematic standards. Existing evaluation benchmarks, however, predominantly assess visual quality, aesthetic appeal and physical plausibility, while paying limited attention to text, an essential medium for conveying information in everyday scenes. A generated video may appear visually compelling and feature lifelike subjects, yet still render the text within the scene incorrectly. To address this overlooked dimension, we introduce VTR-Bench, a systematic benchmark for evaluating the Visual Text Rendering capabilities of video generation models. VTR-Bench situates text within concrete application scenarios, such as advertisements and scientific videos, with 300 carefully constructed prompts spanning five scenario categories. We develop an automated evaluation pipeline with human alignments that separately assesses text fidelity through carrier-specific transcription and scene and motion requirements through a prompt-specific chain of query. Beyond evaluation, we introduce a Keyframe-Guided Agentic Framework in which a Director agent coordinates image and video generation with visual evaluation, guiding iterative refinement and candidate selection through visual feedback. Experiments on 11 state-of-the-art models reveal widespread difficulties in accurately rendering scene text, with the best-performing model recording an overall word error rate (WER) of 0.250. We further analyze text rendering failures to characterize the challenges faced by current video generation models. These findings highlight visual text rendering as a key challenge for video generation and demonstrate a practical path toward improvement. Code is available at https://github.com/hardenyu21/VTR-Bench.', 'score': 10, 'issue_id': 3363, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'dd860b197540d4d0', 'authors': ['Yu Huang', 'Jungang Li', 'Zhiyuan Wang', 'Yonghua Hei', 'Song Dai', 'Jiayu Yang', 'Deyuan Liu', 'Xiang Zheng', 'Xiaoshuang Shi', 'Hao Cheng', 'Kaidi Xu'], 'affiliations': ['Department of Data Science, City University of Hong Kong', 'The Hong Kong Institute of AI for Science, City University of Hong Kong', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Electronic Science and Technology of China', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2610.01499.jpg', 'data': {'categories': ['#agents', '#video', '#survey', '#open_source', '#benchmark'], 'emoji': '📝', 'ru': {'title': 'Правильный текст в видео: новый критерий качества генерации', 'desc': 'В статье представлен VTR-Bench — новый бенчмарк для оценки способности моделей генерации видео правильно отображать текст в сценах. Авторы показывают, что современные видеомодели хорошо справляются с визуальным качеством, но часто ошибаются при рендеринге текста, что критично для рекламных и научных видео. Для решения этой проблемы они разработали автоматизированный конвейер оценки с участием человека и фреймворк на основе агентов, который итеративно улучшает качество генерации через визуальную обратную связь. Экспериментальные результаты на 11 современных моделях выявили систематические проблемы с распознаванием и рендерингом текста, указывая на этот аспект как на ключевой вызов для разработчиков видеомоделей.'}, 'en': {'title': 'Enhancing Video Generation: Focus on Text Rendering', 'desc': 'This paper introduces VTR-Bench, a new benchmark designed to evaluate how well video generation models render text within videos. While existing models excel in visual quality, they often struggle with accurately displaying text, which is crucial for conveying information. VTR-Bench includes 300 prompts across various scenarios to systematically assess text fidelity and scene requirements. The study reveals significant challenges in text rendering, with the best model achieving a word error rate of 0.250, emphasizing the need for improvement in this area.'}, 'zh': {'title': '提升视频生成中的文本渲染能力', 'desc': '最近的视频生成模型能够根据自然语言指令生成高度逼真的视频，视觉质量接近电影标准。然而，现有的评估基准主要关注视觉质量和美学吸引力，忽视了文本这一重要信息传递媒介。为了解决这个问题，我们提出了VTR-Bench，这是一个系统的基准，用于评估视频生成模型的视觉文本渲染能力。通过对11个最先进模型的实验，我们发现当前模型在准确渲染场景文本方面存在广泛困难，强调了视觉文本渲染是视频生成中的一个关键挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.33403', 'title': 'DataMagic: Authoring Data Videos through Declarative Multi-Agent Orchestration', 'url': 'https://huggingface.co/papers/2609.33403', 'abstract': 'Abstract  Data videos communicate data insights through dynamic charts, voice narration, and synchronized animations, and have become a widely adopted form of data storytelling. However, producing them requires expertise in data analysis, narrative design, and video editing. Static visualization tools lack narrative and animation capabilities; authoring tools rely on pre-prepared charts rather than raw data; and pixel-level models generate videos end-to-end but cannot guarantee data accuracy or provenance. End-to-end automatic generation faces two core challenges: how to uniformly represent charts, narration, and animations together with their temporal relationships, and how to efficiently search a vast design space for narrative-coherent compositions. We present DataMagic, which authors data videos from raw tabular data through declarative multi-agent orchestration. First, the declarative specification DVSpec unifies charts, narration, and animations with data-bound references and declarative synchronization, ensuring data provenance and automatic audio-visual alignment. Second, a "Generate-then-Orchestrate" multi-agent strategy generates candidate scenes in parallel and then optimizes narrative coherence through global orchestration. DVSpec provides a shared state for three complementary interaction modes, bridging full automation with fine-grained human control. Evaluations on 109 real-world samples show that even the most advanced LLM (e.g., GPT-5) achieves only 2.13/5 with execution success rates between 48.62% and 86.24%; DataMagic improves quality to 3.89 (+83%) with success rates above 95%, with the most significant gains in animation and narrative dimensions. A user study shows that, compared to a conversational LLM workflow, DataMagic improves creation efficiency (79.7% reduction in task time) and reduces perceived cognitive load. Project page: https://github.com/HKUSTDial/DataMagic.', 'score': 10, 'issue_id': 3363, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': '12ce3d280afa2889', 'pdf_title_img': 'assets/pdf/title_img/2609.33403.jpg', 'data': {'categories': ['#agents', '#video', '#multimodal', '#open_source', '#data'], 'emoji': '🎬', 'ru': {'title': 'Автоматическое создание видео-историй из данных через многоагентную оркестрацию', 'desc': 'DataMagic — это система автоматического создания видео визуализации данных из табличных данных с помощью многоагентной оркестрации. Система использует декларативную спецификацию DVSpec для унификации графиков, голосовых комментариев и анимаций с привязкой к данным и синхронизацией. Авторы применяют стратегию "Generate-then-Orchestrate", которая параллельно генерирует кандидатные сцены, а затем оптимизирует нарративную согласованность через глобальную оркестрацию. Экспериментальные результаты демонстрируют значительное улучшение качества на 83% и успешность выполнения свыше 95% по сравнению с прямым использованием продвинутых LLM моделей.'}, 'en': {'title': 'Transforming Data into Engaging Videos with DataMagic', 'desc': "This paper introduces DataMagic, a system designed to create data videos from raw tabular data using a novel approach called declarative multi-agent orchestration. It addresses the challenges of integrating charts, narration, and animations while ensuring data accuracy and coherence in storytelling. The system employs a 'Generate-then-Orchestrate' strategy to produce candidate scenes in parallel and optimize them for narrative flow. Evaluations demonstrate that DataMagic significantly outperforms existing methods in both quality and efficiency, making data video creation more accessible and less cognitively demanding for users."}, 'zh': {'title': 'DataMagic：自动生成高质量数据视频的利器', 'desc': '本文介绍了一种名为DataMagic的数据视频生成工具，它能够从原始表格数据中自动创建数据视频。该工具通过声明式多代理编排，将图表、叙述和动画统一表示，并确保数据的来源和音视频的自动对齐。DataMagic采用“生成-再编排”的策略，能够并行生成候选场景，并通过全局编排优化叙述的一致性。评估结果显示，DataMagic在动画和叙述维度上显著提高了视频质量和生成效率。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.00544', 'title': 'Memorizon: Training World Models Beyond Their Context Window', 'url': 'https://huggingface.co/papers/2610.00544', 'abstract': 'Abstract  Streaming world models should render a place consistently across repeated visits. Directly supervising such revisits requires training samples that capture both visits, often spanning minutes. Yet dense attention over the full span incurs quadratic costs, making long-span supervision expensive. Memorizon breaks this coupling: long spans are needed for supervision, but not for attention, since the two visits can share a forward pass without including every intervening frame. A training sample covers a span of any length but is scored only on its last k chunks. Instead of tokenizing the history before them, each scored chunk retrieves its own top-K latents by camera co-visibility, and the union of these requests forms a shared bank. The bank is bounded by kK, so the sequence stays bounded however long the span; at the shortest span the recipe is exactly conventional training. Adding the bank raises the cost of a step once; beyond that, a longer span costs little, and going from 100 to 400 s adds 12% to the step time. Against a sliding-window baseline, retrieval raises revisit consistency on every split, and a span long enough to reach the first visit of each return adds a further 24% to 30%, at some cost in image quality; beyond that span, more length no longer helps. Filling the bank from another episode lowers revisit correlation by 83%, so the model uses what it retrieves. Project page: https://tingtingliao.github.io/memorizon', 'score': 10, 'issue_id': 3362, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '776855dfa2975153', 'authors': ['Tingting Liao', 'Xuezhi Liang', 'Hao Li', 'Guangyi Liu'], 'affiliations': ['IFM, MBZUAI', 'MBZUAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.00544.jpg', 'data': {'categories': ['#video', '#architecture', '#training'], 'emoji': '🎬', 'ru': {'title': 'Эффективная долгосрочная консистентность в потоковых моделях мира через избирательное внимание', 'desc': 'В статье предлагается Memorizon — метод обучения потоковых моделей мира, который эффективно обрабатывает долгие последовательности кадров для обеспечения консистентности визуализации при повторных посещениях одной локации. Ключевая идея состоит в разделении длительного окна обучения (необходимого для контроля качества) и окна внимания (необходимого для вычислений), чтобы избежать квадратичных затрат памяти. Модель использует механизм извлечения top-K скрытых представлений на основе видимости камеры, формируя ограниченный общий банк памяти размером kK независимо от длины последовательности. Экспериментальные результаты показывают значительное ул
