码器对不同区域进行评分，从而选择不同粒度的区域。该方法避免了对大型语言模型的调用，能够有效地进行节点级修剪。实验结果表明，CANOPY在多个问答基准上表现出更高的答案准确率，并且在压缩过程中显著减少了输入证据的令牌数量。'}}}, {'id': 'https://huggingface.co/papers/2610.05894', 'title': 'Noise Out, Bias In: Targeted Bias Injection in Diffusion Language Models via Closed-Loop Activation Steering', 'url': 'https://huggingface.co/papers/2610.05894', 'abstract': "Abstract  Masked diffusion language models (dLLMs) generate text by iteratively denoising masked positions, re-predicting each token multiple times before it is committed. An autoregressive decoder exposes an answer's distribution once, at the step that commits it; a dLLM exposes it at every denoising step before commitment, and we show that an adversary can exploit this. Since an answer remains open to revision over many denoising steps, an adversary with access to internal activations can watch how likely the model is to produce a chosen answer and adjust the intervention accordingly. Building on this observation, we study targeted bias injection, an attack that steers a frozen dLLM toward a demographic answer selected by the adversary. The attack uses a simple proportional-integral (PI) controller that tracks the target-answer probability during denoising and adapts the strength of a steering vector on the fly. On ambiguous BBQ questions where the correct answer is abstention, our attack raises LLaDA-8B-Instruct's preference for the targeted group from 1.8 to 16.7 percentage points, more than three times the strongest fixed-strength steering baseline, and on SocialStigmaQA it raises the selection of stigmatizing answers from 17.6% to 58.1%. Fitted to other demographic targets, the same attack shifts answers by up to 37 percentage points, and each attack takes about 40 minutes on one GPU. On the primary target, feedback is what makes the attack work: constant steering at the same average strength over the token-committing steps produces a far smaller shift while corrupting nearly three times as many outputs, and a constant strength set separately for each example still falls well short. Our findings identify the denoising trajectory as a new control channel in dLLMs and call for bias audits that examine the serving stack rather than the frozen model alone.", 'score': 7, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '3830d5ead4da9246', 'authors': ['Sarim Hashmi', 'Mukul Ranjan', 'Abdelrahman Elsayed', 'Muhammad Umer Sheikh', 'Fahad Shamshad', 'Nils Lukas'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2610.05894.jpg', 'data': {'categories': ['#architecture', '#training', '#diffusion', '#ethics', '#security'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное управление смещением в диффузионных моделях через траекторию денойзинга', 'desc': 'В работе исследуется уязвимость маскированных диффузионных языковых моделей, которые генерируют текст путём итеративного удаления шума с повторным предсказанием токенов. Авторы показывают, что противник может эксплуатировать тот факт, что распределение вероятностей ответа открыто на каждом шаге денойзинга, а не только один раз как в авторегрессивных моделях. Предложена атака целевого внедрения смещения, использующая пропорционально-интегральный регулятор для адаптивного управления силой вектора направления во время генерации, который эффективно смещает модель в сторону выбранного ответа противника. Эксперименты демонстрируют значительное увеличение предпочтения целевой демографической группы (с 1.8% до 16.7% на BBQ) и подчеркивают необходимость аудитов смещения, учитывающих траекторию денойзинга.'}, 'en': {'title': 'Exploiting Denoising: A New Frontier in Bias Injection in Language Models', 'desc': "This paper discusses a new type of language model called masked diffusion language models (dLLMs) that generate text by gradually refining predictions for masked words. Unlike traditional autoregressive models that commit to a prediction at once, dLLMs allow for multiple revisions, which can be exploited by adversaries to inject bias into the generated text. The authors demonstrate a targeted bias injection attack that manipulates the model's output towards a specific demographic answer by adjusting the model's response during the denoising process. Their findings highlight the need for bias audits that consider the entire model operation, not just the static model itself."}, 'zh': {'title': '揭示去噪过程中的偏见注入攻击', 'desc': '本文介绍了一种新的攻击方法，针对掩蔽扩散语言模型（dLLMs）进行偏见注入。通过观察模型在去噪步骤中对特定答案的生成概率，攻击者可以动态调整干预策略，从而引导模型产生特定的答案。实验表明，这种方法在处理模糊问题时，能够显著提高模型对目标群体答案的偏好。研究结果强调了去噪过程作为dLLMs中的新控制通道，并呼吁对模型进行偏见审计。'}}}, {'id': 'https://huggingface.co/papers/2610.06833', 'title': 'Towards Looped Models Done Right, Part II: Rethinking at Fixed Points', 'url': 'https://huggingface.co/papers/2610.06833', 'abstract': "Abstract  Every recurrence of a looped language model adds cost in training, decoding, prefill, and reinforcement learning (RL). The closer recurrent states get to fixed points, the less the path to them matters. This enables truncated backpropagation in training; terminal key-value (KV) sharing for decoding with almost no loss in accuracy; a distilled student that prefills up to 1.79x faster; and RL updates that compute gradients from saved rollout states, 2x faster than backpropagating through the replayed trajectory. We therefore improve the two components of training that shape these fixed points: the depth prior and input injection. Fixed-depth training breaks KV sharing, and Huginn's broad depth prior supports sharing but dilutes supervision at the target depth more than sharing requires; we learn the prior from prediction feedback, with an entropy term that keeps it broad. Existing injection schemes let the state's component along the input amplify or cancel the injection; we remove this component with orthogonal injection. From 100M to 1.6B parameters, the learned prior and orthogonal injection lower perplexity at every scale relative to Huginn's prior and existing injection schemes, respectively. At 1.6B, the learned prior with a 3x smaller KV cache matches the downstream average of fixed-depth training with the full cache.", 'score': 7, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'df69c72d495993dd', 'authors': ['Benhao Huang', 'Chufan Shi', 'Junlin Chen', 'Shicheng Wen', 'Zhengzhong Liu', 'Eric Xing', 'Xuezhe Ma'], 'affiliations': ['Institute of Foundation Models, USC, CMU'], 'pdf_title_img': 'assets/pdf/title_img/2610.06833.jpg', 'data': {'categories': ['#architecture', '#small_models', '#optimization', '#rl', '#training', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Оптимизация рекуррентных моделей через неподвижные точки', 'desc': 'Статья описывает методы оптимизации рекуррентных языковых моделей, которые снижают вычислительные затраты на обучение, декодирование и усиленное обучение. Авторы показывают, что когда рекуррентные состояния приближаются к неподвижным точкам, можно применять усечённую обратную пропаганду и совместное использование кэша ключей-значений с минимальной потерей точности. Предложены два ключевых улучшения: обучаемый приор глубины, который адаптируется через обратную связь предсказания, и ортогональное впрыскивание входных данных для избежания их амплификации в состояниях. Экспериментальные результаты на моделях от 100M до 1.6B параметров демонстрируют снижение перплексии и ускорение обучения в 2-3 раза без значительного ухудшения качества.'}, 'en': {'title': 'Optimizing Language Models for Speed and Efficiency', 'desc': 'This paper discusses improvements in training looped language models by optimizing recurrent states and their fixed points. It introduces techniques like truncated backpropagation and terminal key-value sharing, which enhance training efficiency and decoding speed without sacrificing accuracy. The authors propose a learned depth prior and orthogonal injection methods to reduce perplexity across various model sizes. These innovations allow for faster reinforcement learning updates and better performance with fewer resources, demonstrating significant advancements in language model training.'}, 'zh': {'title': '优化循环语言模型的训练与解码效率', 'desc': '这篇论文探讨了循环语言模型在训练、解码和强化学习中的成本问题。通过优化固定点的接近程度，研究者们实现了更高效的训练和解码过程，包括截断反向传播和终端键值共享。论文提出了一种新的深度先验学习方法和正交注入技术，显著降低了困惑度，并提高了模型的训练效率。最终，研究表明在不同参数规模下，新的方法相较于现有技术都有明显的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2609.24890', 'title': 'OSWorld-Pro: Process-based Evaluation for Computer Use Agents', 'url': 'https://huggingface.co/papers/2609.24890', 'abstract': 'Abstract  Evaluation of Computer-Use Agents (CUAs) is often limited to the final deliverables they create (at the end of hundreds of steps) and assessed with functional verifiers, as seen in OSWorld. However, such evaluation of end-state performance lacks transparency into how and why agents fail in various tasks, obfuscating critical insight for subsequent improvement. For instance, agents that err during keyboard inputs would require a different mitigation strategy from those that fail to precisely provide click-based inputs on the graphical UI. We introduce OSWorld-Pro: a set of over 300 tasks containing over 2800 subgoals to enable the procedural evaluation of CUAs grounded in over 67,000 human annotations. We use robust human-aligned LLM-Judges to evaluate the fulfillment of OSWorld-Pro subgoals and thereby reveal the progress that models make throughout a series of sequentially dependent subgoals. Our findings reveal that OSWorld-Pro is challenging even for state-of-the-art LLMs, with top performers like Claude Opus 5 achieving only 75.7% vs. 83.4% on OSWorld. Furthermore, we identify critical process-focused failure modes of various models (e.g. subgoal-irrelevant actions and click-based mistakes) to provide insights to improve performance and efficiency of CUAs.', 'score': 7, 'issue_id': 3377, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '1e3d7574ba6902ae', 'authors': ['Zhilin Wang', 'Shaokun Zhang', 'Yifan Zhang', 'Hao Zhang', 'Jin Xu', 'Binfeng Xu', 'Jian Hu', 'Yunheng Zou', 'Karan Sapra', 'Andrew Tao', 'Jan Kautz', 'Yi Dong'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2609.24890.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Прозрачная оценка агентов: от итогов к процессу', 'desc': 'В работе представлен набор данных OSWorld-Pro, содержащий более 300 задач с 2800 подцелями и 67000 человеческих аннотаций для детальной оценки агентов компьютерного взаимодействия. Авторы вводят методологию пошаговой оценки вместо традиционного подхода, сосредоточенного только на итоговом результате, что позволяет лучше понять причины ошибок моделей. Используя LLM-Judges, выровненные с человеческими оценками, исследователи демонстрируют, что даже лучшие модели как Claude Opus 3.5 достигают только 75.7% успеха на OSWorld-Pro. Анализ выявляет специфические типы ошибок моделей, такие как неправильный ввод с клавиатуры и неточные клики, что открывает путь к целенаправленному улучшению агентов.'}, 'en': {'title': 'Unveiling Agent Performance: Beyond Final Outputs', 'desc': "This paper introduces OSWorld-Pro, a comprehensive evaluation framework for Computer-Use Agents (CUAs) that focuses on the procedural assessment of their performance across a wide range of tasks. Unlike traditional methods that only evaluate final outputs, OSWorld-Pro breaks down tasks into over 2800 subgoals, allowing for a detailed analysis of how agents perform at each step. The evaluation utilizes human-aligned LLM-Judges to assess the agents' progress and identify specific failure modes, such as irrelevant actions or input errors. The findings highlight that even advanced language models struggle with these tasks, emphasizing the need for targeted improvements in agent design and functionality."}, 'zh': {'title': '揭示计算机代理的评估新视角', 'desc': '本论文介绍了OSWorld-Pro，这是一个包含超过300个任务和2800个子目标的评估框架，用于计算机使用代理（CUAs）的程序性评估。通过使用67,000多个人工注释，OSWorld-Pro能够揭示模型在一系列依赖子目标中的进展。研究发现，即使是最先进的语言模型（如Claude Opus 5）在OSWorld-Pro上的表现也不如在OSWorld上，显示出其挑战性。我们还识别了不同模型的关键失败模式，以便为CUAs的性能和效率改进提供见解。'}}}, {'id': 'https://huggingface.co/papers/2610.04318', 'title': 'Rethinking Long-Video Efficiency: A Joint Allocation Perspective on Frames, Pixels, and Front-End Latency', 'url': 'https://huggingface.co/papers/2610.04318', 'abstract': "Abstract  Efficient long-video understanding with vision-language models (VLMs) is often framed as selecting informative frames or visual tokens at a fixed native resolution. We show that per-frame resolution can instead be traded for denser temporal coverage, while front-end decoding latency depends on the size of the candidate pool rather than the final token budget. An empirical study across multiple VLMs and long-video benchmarks yields three findings: dense low-resolution sampling outperforms sparse native-resolution sampling at matched token budgets; resolution-sensitive tasks benefit from selected high-resolution frames; and front-end decoding dominates wall time for hour-long videos. Motivated by these findings, we introduce LoHi, a training-free, single-pass framework that combines a dense low-resolution video stream with sparse high-resolution image frames through the VLM's native video and image pathways. LoHi-Anchor selects high-resolution frames using codec I-frame metadata, while LoHi-SemDiv uses query relevance and visual diversity over CLIP features. Across three long-video benchmarks, LoHi improves average accuracy by 10.6 percentage points over the native-resolution baseline at a matched token budget and by 5.2 percentage points over the strongest prior efficiency method. It also reduces front-end decoding latency by up to 7x on hour-long videos. Project page: https://sixundong.com/projects/lohi", 'score': 7, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '9c4ed78282dacde3', 'authors': ['Sixun Dong', 'Wei Li', 'Andong Deng', 'Qi Qian', 'Victor Zhu', 'Zhengping Ji', 'Chen Chen'], 'affiliations': ['Axon', 'Meta Reality Labs', 'University of Central Florida'], 'pdf_title_img': 'assets/pdf/title_img/2610.04318.jpg', 'data': {'categories': ['#video', '#inference', '#long_context', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Плотность временных кадров вместо высокого разрешения для анализа длинных видео', 'desc': 'Исследование показывает, что для эффективного анализа длинных видео с моделями vision-language можно использовать комбинацию плотной выборки кадров низкого разрешения с редкой выборкой высокого разрешения. Авторы предлагают LoHi — метод без переобучения, который объединяет низкорезольционный видеопоток с избранными высокорезольционными кадрами через встроенные пути обработки видео и изображений модели. LoHi-Anchor выбирает важные кадры по метаданным кодека, а LoHi-SemDiv использует релевантность запроса и визуальное разнообразие на основе CLIP-признаков. Метод достигает улучшения на 10.6 процентных пункта в точности при одинаковом бюджете токенов и сокращает время предварительной обработки видео в 7 раз.'}, 'en': {'title': 'LoHi: Efficient Long-Video Understanding with Smart Frame Selection', 'desc': 'This paper presents a new approach called LoHi for efficiently understanding long videos using vision-language models (VLMs). It demonstrates that using a combination of low-resolution video frames and selectively chosen high-resolution frames can enhance performance while reducing processing time. The study reveals that dense low-resolution sampling is more effective than sparse high-resolution sampling when the number of tokens is kept constant. LoHi achieves significant improvements in accuracy and reduces decoding latency, making it a promising solution for long-video analysis.'}, 'zh': {'title': '高效长视频理解的新方法：LoHi', 'desc': '这篇论文探讨了如何使用视觉语言模型（VLMs）高效理解长视频。研究表明，低分辨率的密集采样在匹配的标记预算下，优于稀疏的原生分辨率采样。论文提出了LoHi框架，它结合了低分辨率视频流和稀疏的高分辨率图像帧，从而提高了视频理解的准确性和效率。实验结果显示，LoHi在多个长视频基准测试中，平均准确率提高了10.6个百分点，同时前端解码延迟减少了多达7倍。'}}}, {'id': 'https://huggingface.co/papers/2610.05162', 'title': 'Memadapter: Counterfactual Adaptation Against Memory-induced Sycophancy', 'url': 'https://huggingface.co/papers/2610.05162', 'abstract': "Abstract  Long-term memory enables LLM-based agents to retain and reuse information across tasks and sessions, supporting personalization and long-horizon interactions. However, persistent memories can also induce sycophancy, causing agents to over-align with users' historical beliefs even when they are inaccurate, outdated, or inconsistent with objective evidence. Existing mitigation methods assume that memory-induced sycophancy originates from biased or incorrect memories and attempt to reduce this risk by filtering such memories at different stages of the memory pipeline. However, in the real world, objective and correct memories can still induce sycophancy, and the same memory can warrant different influence across different contexts. To this end, we propose MemAdapter, a novel framework that adaptively integrates retrieved memories to support objective and reliable reasoning. Specifically, MemAdapter consists of three components: (i) Counterfactual Induction, which leverages counterfactual reasoning to uncover the potential risk of retrieved memories; (ii) Context-Aware Reflection, which calibrates the inferential influence of each retrieved memory in light of the current task via self-reflection; and (iii) Evidence-Based Reasoning, which grounds the final response in appropriate evidence while preserving the legitimate influence of memory. Extensive experiments on three benchmarks demonstrate that MemAdapter consistently improves memory reliability across diverse scenarios. Our code is available at https://github.com/DEEP-JLU/MemAdapter.", 'score': 6, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'bd96946980ba61b8', 'authors': ['Ruqing Ning', 'Haibo Meng', 'Zhishang Xiang', 'Zerui Chen', 'Jinsong Su', 'Xin Wang', 'Qinggang Zhang'], 'affiliations': ['Jilin University', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05162.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Адаптивная память против предвзятости: MemAdapter для объективного рассуждения', 'desc': 'Статья посвящена проблеме сикофантии в LLM-агентах с долгосрочной памятью, когда модели чрезмерно согласовываются с историческими убеждениями пользователей, даже если те неточны или противоречат фактам. Авторы предлагают MemAdapter — фреймворк, который адаптивно интегрирует извлеченные воспоминания для объективного и надежного рассуждения. Решение включает три компонента: контрфактическую индукцию для выявления рисков памяти, контекстно-зависимую рефлексию для калибровки влияния каждого воспоминания, и доказательное рассуждение для обоснованного ответа. Экспериментальные результаты на трех бенчмарках показывают, что предложенный метод последовательно улучшает надежность памяти в различных сценариях.'}, 'en': {'title': 'Enhancing Memory Reliability in LLMs with MemAdapter', 'desc': "This paper introduces MemAdapter, a framework designed to enhance the reliability of long-term memory in large language model (LLM) agents. It addresses the issue of sycophancy, where agents overly conform to users' past beliefs, even if they are incorrect or outdated. MemAdapter employs three key components: Counterfactual Induction to assess the risks of memories, Context-Aware Reflection to adjust memory influence based on the current context, and Evidence-Based Reasoning to ensure responses are grounded in factual evidence. The framework has been tested across various benchmarks, showing significant improvements in memory reliability and reasoning accuracy."}, 'zh': {'title': '提升记忆可靠性的创新框架', 'desc': '本论文提出了一种名为MemAdapter的新框架，旨在解决大规模语言模型（LLM）在长期记忆中可能出现的谄媚现象。该框架通过三个主要组件来实现：反事实推理用于识别检索记忆的潜在风险；上下文感知反思用于根据当前任务调整记忆的推理影响；基于证据的推理则确保最终响应基于适当的证据，同时保留记忆的合理影响。实验结果表明，MemAdapter在多种场景下显著提高了记忆的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2610.05870', 'title': 'Certification of Real Images through Calibrated Content Authentication', 'url': 'https://huggingface.co/papers/2610.05870', 'abstract': "Abstract  Generative models can synthesize high-quality inauthentic multimedia content that is already being misused at scale. We evaluate twenty deepfake detectors against ten generators released in the last four years and find accuracy decreasing over time, from near-perfect 99.5% to 76%. Adversarial perturbations further reduce every baseline detector to below 2% accuracy, effectively inverting the detector's assigned label. We argue that this unreliability reflects a fundamental ambiguity: generators can reproduce authentic content exactly (e.g., through memorization), so content alone cannot reveal the true provenance label.For this reason, content produced by a generator must admit a faithful reconstruction by that same generator, and finding such a reconstruction makes synthetic provenance plausible and authenticity plausibly deniable.We therefore propose and evaluate a detection paradigm that outputs a calibrated prediction of whether authenticity is plausibly deniable: a faithful reconstruction by any known generator establishes plausible deniability, while calibration bounds how often content from known generators fails to be reproduced. Our evaluation shows that (i) our detector can be calibrated so that at most 1% of generated content is wrongly certified, an operating point at which most baseline detectors reach near-zero recall, including the strongest with 93% accuracy; (ii) calibrating a stricter security threshold on attacked samples preserves this bound against adaptive adversaries within the evaluated bounded-perturbation attack space, whose perturbations break every baseline, but does not cover arbitrary adversarial transformations; and (iii) post-hoc verifiability is eroding, as 1,116 of 3,000 Reddit images resist reproduction by a 2022 generator, but only 55 to 79 resist reproduction by 2024 generators.", 'score': 6, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '4eb3bc66f5573388', 'authors': ['Sarim Hashmi', 'Abdelrahman Elsayed', 'Mohammed Talha Alam', 'Samuele Poppi', 'Nils Lukas'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence Abu Dhabi, UAE'], 'pdf_title_img': 'assets/pdf/title_img/2610.05870.jpg', 'data': {'categories': ['#cv', '#security', '#benchmark', '#synthetic'], 'emoji': '🎭', 'ru': {'title': 'Когда подлинность перестаёт быть очевидной: новый подход к детекции синтетических медиа', 'desc': 'Работа изучает проблему обнаружения дипфейков и находит, что точность детекторов снижается со временем с 99.5% до 76% по мере развития генераторов. Авторы показывают, что состояния самого контента недостаточно для определения его подлинности, так как генеративные модели могут точно воспроизвести оригинальные данные. Они предлагают новую парадигму детекции, основанную на концепции «правдоподобного отрицания подлинности»: если синтетический контент можно верно восстановить известным генератором, то его подлинность становится оспоримой. Экспериментальные результаты демонстрируют, что предложенный подход достигает калибровки с менее чем 1% ошибочной сертификации сгенерированного контента даже при наличии адаптивных противников.'}, 'en': {'title': 'Detecting Deepfakes: A New Paradigm for Plausible Deniability', 'desc': 'This paper investigates the effectiveness of deepfake detectors against advanced generative models that create realistic fake multimedia content. The study reveals a significant decline in detection accuracy over time, dropping from 99.5% to 76%, highlighting the challenges posed by adversarial attacks that can mislead detectors. The authors propose a new detection paradigm that assesses whether the authenticity of content can be plausibly denied, based on the ability of generators to reproduce their own outputs. Their findings indicate that while their method can maintain low false certification rates, the overall reliability of post-hoc verification is diminishing as newer generators become more adept at creating content that resists detection.'}, 'zh': {'title': '生成内容的真实性与可否认性', 'desc': '生成模型可以合成高质量的虚假多媒体内容，这些内容已经被大规模滥用。我们评估了二十种深度伪造检测器对比过去四年发布的十种生成器，发现检测准确率随着时间的推移而下降，从接近完美的99.5%降至76%。对抗性扰动进一步降低了每个基线检测器的准确率至2%以下，实际上颠覆了检测器的标签。我们提出了一种检测范式，能够输出关于真实性是否可以否认的校准预测，确保生成内容的可重建性与真实性的可否认性。'}}}, {'id': 'https://huggingface.co/papers/2610.05719', 'title': 'When to Switch: Reliable Action-Chunk Extension for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.05719', 'abstract': 'Abstract  Vision-Language-Action (VLA) models serve as unified policies for robotic manipulation, yet their expensive inference forces robots to pause between policy calls, resulting in stop-and-go execution that interrupts smooth motion and prolongs task completion. Extending the action chunk reduces policy calls and hence these pauses, but predicting farther into the future makes long-chunk execution unreliable. To understand where this unreliability arises, we analyze action errors within long chunks and find that they concentrate around transitions between manipulation subskills, growing sharply with chunk length. This suggests the importance of transition timing, i.e., when to switch subskills within a chunk. Motivated by this observation, we introduce RACE (Reliable Action-Chunk Extension), a framework that predicts the transition timing from an auxiliary one-step denoising pass and conditions action generation on it. By learning and conditioning on transition timing, RACE reduces errors at subskill transitions and enables reliable execution of longer action chunks. Across simulation benchmarks, RACE outperforms fine-tuning at the same chunk length; with 2x longer chunks, it surpasses recent state-of-the-art and efficient VLAs in success rate, and with 4x longer chunks, it remains competitive. On a real robot, RACE uses 4x longer chunks, which reduces the idle time caused by stop-and-go execution by about 5x, while achieving a higher success rate than fine-tuning with the same chunk length. Code and a real-robot demo are available at https://github.com/Seonghoon-Yu/RACE-VLA', 'score': 6, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '8a07ab3ae601eb97', 'authors': ['Seonghoon Yu', 'Dongwon Kim', 'HyungRok Jung', 'Yoonjae Baek', 'Byung-kwan Lee', 'Suha Kwak', 'Jeany Son'], 'affiliations': ['GIST', 'KAIST', 'NVIDIA', 'POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2610.05719.jpg', 'data': {'categories': ['#robotics', '#inference', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Надёжное расширение действий через предсказание переходов между навыками', 'desc': 'Статья посвящена улучшению Vision-Language-Action моделей для робототехники, которые страдают от дорогостоящей инференции и вынужденных пауз между вызовами политики. Авторы выявили, что ошибки в длинных последовательностях действий концентрируются в переходах между подзадачами манипуляции. Предложенный фреймворк RACE предсказывает моменты переключения подзадач через дополнительный процесс денойзинга и обусловливает генерацию действий этой информацией. Метод позволяет увеличить длину предсказываемых действий в 4 раза, значительно сокращая простои робота и повышая надёжность выполнения задач.'}, 'en': {'title': 'Enhancing Robotic Manipulation with Reliable Action Timing', 'desc': 'This paper introduces RACE, a framework designed to improve the performance of Vision-Language-Action (VLA) models in robotic manipulation. The main issue addressed is the inefficiency caused by frequent pauses during policy calls, which disrupts smooth motion. RACE focuses on predicting the optimal timing for transitions between different manipulation subskills, thereby reducing errors that occur during these transitions. By enabling longer action chunks with reliable execution, RACE significantly enhances the success rate of robotic tasks while minimizing idle time.'}, 'zh': {'title': '提升机器人操作效率的RACE框架', 'desc': '本文介绍了一种名为RACE（可靠动作块扩展）的框架，旨在提高机器人操作中的视觉-语言-动作（VLA）模型的执行效率。通过分析长动作块中的错误，发现错误主要集中在操作子技能之间的过渡时刻。RACE通过预测过渡时机并在此基础上生成动作，从而减少了子技能过渡时的错误，提高了长动作块的可靠性。实验结果表明，RACE在多个模拟基准测试中表现优于同长度的微调方法，并在实际机器人上显著减少了因停顿而造成的空闲时间。'}}}, {'id': 'https://huggingface.co/papers/2610.04929', 'title': 'RobotUse: Allocating Computation, Context, and Decisions', 'url': 'https://huggingface.co/papers/2610.04929', 'abstract': 'Abstract  Robot agents must connect their intended actions to observed outcomes while retaining the context needed to revise their choices over repeated attempts. Existing interfaces often leave these choices inside predefined tools or require agents to manage detailed execution code and its growing history. We introduce RobotUse, a robot agent harness that organizes computation, context, and decisions around specifying and revising physical actions. Agents visually select targets and poses, while the backend handles geometry, motion planning, and control. Subagents retain detailed interactions within each subgoal and return the information needed for subsequent decisions. Continual harnessing lets agents learn from execution by updating a persistent playbook. On RoboLab, RobotUse achieves 45% task success, outperforming CaP-X by 6.7 percentage points while maintaining compact decision contexts and reducing reliance on predefined action abstractions. Furthermore, we show that RobotUse learns from real-world execution despite imperfect feedback and transfers what it learns to subsequent tasks. Project page is available at https://robotuse-team.github.io/.', 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'ecea5d763aed1c73', 'authors': ['Junhoo Lee', 'Injun Baek', 'Seungyeon Kim', 'Suhyun Jeon', 'Minkyu Kim', 'Baekseung Kim', 'Nojun Kwak'], 'affiliations': ['KAIST', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04929.jpg', 'data': {'categories': ['#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Визуальное управление робот-агентом через итеративное уточнение физических действий', 'desc': 'Статья представляет RobotUse — фреймворк для управления робот-агентами, который организует вычисления вокруг задачи выполнения физических действий. Система позволяет агентам визуально выбирать целевые позиции и ориентацию, пока бэкенд обрабатывает геометрию, планирование траекторий и управление. Подагенты сохраняют детальную информацию о взаимодействиях в пределах каждой подцели и возвращают необходимые данные для последующих решений. RobotUse достигает 45% успеха на тестовом наборе RoboLab, превосходя CaP-X на 6.7 процентных пункта, при этом сохраняя компактный контекст решений и обучаясь на реальном опыте выполнения задач.'}, 'en': {'title': 'Empowering Robots to Learn and Adapt Through Contextual Decision-Making', 'desc': 'The paper presents RobotUse, a framework designed for robot agents to improve their decision-making processes by connecting actions to outcomes while maintaining context. It allows agents to visually select targets and poses, simplifying the execution of complex tasks by managing geometry, motion planning, and control in the background. RobotUse enables agents to learn from their experiences by updating a persistent playbook, which helps them refine their actions over time. The results show that RobotUse outperforms existing methods in task success rates while minimizing the need for predefined action templates.'}, 'zh': {'title': '智能机器人决策的新方式', 'desc': '本论文介绍了一种名为RobotUse的机器人代理系统，旨在帮助机器人将预期动作与观察结果连接起来，同时保留必要的上下文以便在多次尝试中修正选择。RobotUse通过可视化选择目标和姿态，简化了计算、上下文和决策的组织，后端则负责几何、运动规划和控制。该系统的子代理能够在每个子目标内保留详细的交互信息，并为后续决策提供所需的信息。实验结果表明，RobotUse在RoboLab上实现了45%的任务成功率，超越了CaP-X，并且能够在真实世界执行中学习，尽管反馈不完美，仍能将所学知识转移到后续任务中。'}}}, {'id': 'https://huggingface.co/papers/2610.06617', 'title': 'RealtimeWAM: One-Step Asynchronous World Action Models', 'url': 'https://huggingface.co/papers/2610.06617', 'abstract': "Abstract  World Action Models (WAMs) incorporate visual representations from video generation backbones to guide action prediction. Recent efficient WAMs adopt Mixture-of-Transformers (MoT) architectures and compute video representations once for reuse by the action expert. However, intra-expert iteration (\\ie, multi-step action denoising) and inter-expert waiting (\\ie, sequential execution of the video and action experts) still limit inference efficiency. To this end, we present RealtimeWAM, an extremely efficient WAM variant with one-step action generation and asynchronous inference, addressing these two bottlenecks. To reduce intra-expert iteration, we propose Teacher-Anchored Consistency Distillation (TACD) to address a local-global error gap: low local consistency error alone does not guarantee accurate final actions. TACD supplements local consistency with explicit supervision from the frozen teacher's multi-step rollout endpoint, enabling accurate one-step action generation. Additionally, we propose Cross-Expert Wavefront Pipelining (CEWP) to eliminate unnecessary expert-level waiting. It overlaps the two experts through block-wise sharing of the video KV cache, synchronizing only immediately before the corresponding action attention consumes it. Extensive experiments across diverse benchmarks (\\eg, LIBERO, LIBERO-Plus and RoboTwin) and model variants (\\eg, Fast-WAM and Faster-WAM) demonstrate the superiority of RealtimeWAM. Notably, RealtimeWAM maintains near-lossless performance (\\ie, <1% drop) across these benchmarks while delivering significant end-to-end speedup (\\eg, sim25times on H100). Our code and checkpoints are available via this https://github.com/ModelTC/LightX2V/tree/main/examples/realtimewam{link}.", 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '6d204bc3805c7d0e', 'authors': ['Chengtao Lv', 'Jinyang Du', 'Shuyi Feng', 'Yang Yong', 'Shiqiao Gu', 'Shunzi Yang', 'Ruihao Gong', 'Shen Ren', 'Tianwei Zhang', 'Wenya Wang'], 'affiliations': ['Beihang University', 'Continental Automotive Singapore', 'Nanyang Technological University', 'Sensetime'], 'pdf_title_img': 'assets/pdf/title_img/2610.06617.jpg', 'data': {'categories': ['#architecture', '#video', '#training', '#robotics', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Молниеносное предсказание действий через параллельный конвейер экспертов', 'desc': 'В статье представлена RealtimeWAM — эффективная модель мировых действий, которая предсказывает действия робота на основе видеопотока. Основное улучшение достигается за счёт одношагового генерирования действий вместо многошагового уточнения, а также асинхронной работы видео- и действийных экспертов. Авторы предложили Teacher-Anchored Consistency Distillation для дистилляции знаний от учительской модели и Cross-Expert Wavefront Pipelining для параллельного выполнения компонентов. Экспериментальные результаты показывают ускорение в 25 раз на GPU H100 с минимальной потерей качества предсказания действий.'}, 'en': {'title': 'RealtimeWAM: Fast and Accurate Action Prediction', 'desc': "The paper introduces RealtimeWAM, a highly efficient variant of World Action Models (WAMs) that enhances action prediction by utilizing visual representations from video generation. It addresses inefficiencies in traditional WAMs by implementing one-step action generation and asynchronous inference, which reduces the time taken for predictions. The method employs Teacher-Anchored Consistency Distillation (TACD) to improve action accuracy by aligning local consistency with a teacher model's guidance. Additionally, Cross-Expert Wavefront Pipelining (CEWP) is introduced to minimize waiting times between action and video experts, resulting in significant speed improvements while maintaining high performance across various benchmarks."}, 'zh': {'title': '高效实时动作生成模型', 'desc': '本文介绍了一种新的世界动作模型（WAM）变体，称为RealtimeWAM，旨在提高动作生成的效率。通过引入教师锚定一致性蒸馏（TACD），该方法解决了局部一致性与全局准确性之间的误差差距，从而实现了一步动作生成。为了消除专家级等待，RealtimeWAM采用了跨专家波前流水线（CEWP），通过块级共享视频KV缓存来重叠两个专家的执行。实验结果表明，RealtimeWAM在多个基准测试中表现优越，同时实现了显著的端到端加速。'}}}, {'id': 'https://huggingface.co/papers/2610.06851', 'title': 'Base Models Can Reason By Taking a Cue From Training Data', 'url': 'https://huggingface.co/papers/2610.06851', 'abstract': 'Abstract  In this paper, we study how training data creates associations between the tokens at the start of a base model\'s response and the reasoning behavior that follows. First, we demonstrate that fixing particular starting token cues makes a base model\'s performance competitive with that of its reinforcement learning (RL)-trained counterparts on math and coding. For instance, the cue ".\\n\\nOkay" raises Olmo-3-7B\'s MATH-500 pass@1 accuracy from 42% to 78%, while "Alright," raises Qwen3-14B\'s from 72% to 87%. Second, RL makes these cues more likely, while fixing them recovers much of its performance gain over the base model. Third, we trace the reasoning effects of token cues to the training data. We perform causal data interventions to turn an arbitrary word, such as "chicken", into an effective reasoning cue, or remove an existing cue\'s effect. A similar edit makes the prompt instruction "Think duck duck goose" as effective as "Think step by step" at eliciting reasoning. We also find that the hidden state representations induced by different cues correlate with different document types from the training set. Finally, we extend our study of token cues with a case study in language model safety, finding that different cues elicit distinct refusal and compliance behaviors that correspond to different types of training data.', 'score': 5, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '8015dd8e4a3e5a36', 'authors': ['Sophie L. Wang', 'Amil Dravid', 'Rulin Shao', 'Kevin Farhat', 'Sewon Min', 'Alexei A. Efros'], 'affiliations': ['Allen Institute for AI', 'MIT', 'UC Berkeley', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2610.06851.jpg', 'data': {'categories': ['#training', '#alignment', '#math', '#interpretability', '#reasoning', '#rlhf'], 'emoji': '🔮', 'ru': {'title': 'Начальные токены как ключ к рассуждениям языковых моделей', 'desc': 'В этой работе исследуется, как данные обучения создают ассоциации между начальными токенами в ответах базовой модели и последующим поведением рассуждений. Авторы показывают, что фиксация определённых стартовых токенов делает производительность базовой модели конкурентной с моделями, обученными через обучение с подкреплением, на задачах математики и кодирования. Через интервенции в обучающих данных они демонстрируют, что можно превратить произвольное слово в эффективный сигнал для рассуждения или удалить эффект существующего сигнала. Исследование также выявляет, что скрытые представления, индуцированные разными токенами, коррелируют с различными типами документов из набора обучения и влияют на поведение моделей в контексте безопасности.'}, 'en': {'title': 'Unlocking Model Performance with Strategic Token Cues', 'desc': "This paper explores how the initial tokens in a model's response influence its reasoning abilities. By fixing specific starting cues, the authors show that a base model can achieve performance levels similar to those trained with reinforcement learning (RL) on tasks like math and coding. They demonstrate that certain cues significantly improve accuracy and that these cues are shaped by the training data. Additionally, the study reveals that different cues can lead to varying behaviors in language model safety, highlighting the importance of token selection in model performance and behavior."}, 'zh': {'title': '训练数据与推理行为的关联', 'desc': '本文研究了训练数据如何在基础模型响应的起始标记与后续推理行为之间建立关联。我们发现，通过固定特定的起始标记提示，可以使基础模型在数学和编码任务上的表现与强化学习（RL）训练的模型相当。例如，提示".\n\nOkay"将Olmo-3-7B的MATH-500通过率从42%提高到78%。此外，强化学习使这些提示更可能出现，而固定这些提示则恢复了基础模型的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2610.05416', 'title': 'Prism: Dynamic Sparse Attention for Native 2K Joint Video-Audio Generation Model Training', 'url': 'https://huggingface.co/papers/2610.05416', 'abstract': 'Abstract  Natively training joint video-audio generation models at higher resolutions empowers them to learn richer visual details and sharper motion dynamics. However, full attention incurs quadratic cost and, as resolution increases, spreads attention over increasingly redundant tokens, diluting learning signals for informative content and disrupting pretrained priors. Existing sparse attention methods either target training-free acceleration or overlook the unique structure of joint video-audio data, where cross-modal interactions are inherently concentrated around sound-producing regions. To address this, we propose Prism, a dynamic sparse attention framework for natively training joint video-audio generation models at 2K. In particular, Prism organizes the token sequence into spatiotemporal macro-zones, enabling the attention structure to adapt to local content. For each zone, it estimates local information structure via video feature variance along the channel and feature norms from the audio-to-video cross-attention, jointly capturing how visual content varies directionally and how strongly audio influences each visual region. Based on these signals, Prism dynamically assigns a tailored block shape to each zone, applying finer partitioning along axes of rapid visual content variation and strong audio-visual coupling. This encourages tokens within each block to remain semantically coherent, allowing block-level features to capture both visual content and joint video-audio interaction patterns. Prism further adopts a hybrid block selection strategy to dynamically determine per-query sparsity. Experiments show that Prism achieves 2.5times training speedup compared to full attention, while surpassing it in generation quality.', 'score': 4, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'bc2ee33644b809a4', 'authors': ['Shuyuan Tu', 'Qi Tian', 'Yinming Huang', 'Yue Wu', 'Xintong Han', 'Kaihang Pan', 'Weijie Kong', 'Jiangfeng Xiong', 'Jian-Wei Zhang', 'Zuxuan Wu', 'Yu-Gang Jiang'], 'affiliations': ['Fudan University', 'Tencent Hunyuan Foundation Model Team', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05416.jpg', 'data': {'categories': ['#architecture', '#optimization', '#video', '#training', '#audio', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Динамическое разреженное внимание для эффективного обучения видео-аудио генераторов', 'desc': 'В статье предложен Prism — фреймворк динамической разреженной внимания для обучения совместных моделей видео-аудио генерации в высоком разрешении (2K). Авторы заметили, что полное внимание требует квадратичных вычислений и становится неэффективным при растущем разрешении, так как распределяет внимание на избыточные токены. Прием основан на организации последовательности токенов в пространственно-временные макро-зоны и адаптивном назначении структуры блоков внимания на основе анализа локальной информационной структуры видео и кросс-модальных взаимодействий аудио-видео. Экспериментально показано, что метод достигает 2,5-кратного ускорения обучения при улучшении качества генерации.'}, 'en': {'title': 'Prism: Efficient Attention for Rich Video-Audio Generation', 'desc': 'This paper introduces Prism, a dynamic sparse attention framework designed for training joint video-audio generation models at high resolutions. It addresses the inefficiencies of full attention mechanisms, which become costly and less effective as resolution increases. By organizing the token sequence into spatiotemporal macro-zones, Prism adapts the attention structure to focus on relevant content, enhancing the learning of visual and audio interactions. The framework achieves a significant training speedup while improving the quality of generated outputs compared to traditional methods.'}, 'zh': {'title': 'Prism：高效的视频-音频生成模型训练', 'desc': '本论文提出了一种名为Prism的动态稀疏注意力框架，旨在以更高的分辨率训练视频-音频生成模型。Prism通过将令牌序列组织成时空宏区域，使注意力结构能够适应局部内容，从而提高学习效率。该方法利用视频特征方差和音频-视频交叉注意力的特征范数，动态分配每个区域的块形状，确保语义一致性。实验表明，Prism在训练速度上比全注意力快2.5倍，同时在生成质量上也有所提升。'}}}, {'id': 'https://huggingface.co/papers/2610.04616', 'title': 'PerturBot: Breaking Shortcut Priors in Vision-Language-Action Models with Perturbative Training', 'url': 'https://huggingface.co/papers/2610.04616', 'abstract': 'Abstract  A vision--language--action (VLA) policy can complete complex tasks while ignoring the evidence that should determine its actions. An object held near the wrist camera can displace the instructed target. Language and action show the same pattern: a familiar noun can trigger the operation it was paired with in training even after the verb changes, and a gripper that closed on nothing may lift anyway. We call these dependencies modality shortcuts: regularities in successful demonstrations make visual, lexical, or motor cues sufficient to predict expert actions without the task evidence needed for the underlying decision. More demonstrations of the same kind can raise task success while leaving these shortcuts intact. We propose Perturbot which makes task-relevant evidence easier to use and shortcuts insufficient on their own: it applies task-preserving wrist-view perturbations, enriches instructions with decision-relevant captions, and adds random and failed trajectory segments relabeled with the behavior they contain. It complements scaling by changing what is scaled, and leaves inference unchanged. Moreover, we propose GroundingFscore, an offline score that diagnoses how severely a policy relies on modality shortcuts. Task success rate shows whether a policy improves, while GroundingFscore reveals whether the policy scales healthily, relying on task evidence rather than shortcuts. Together, Perturbot and GroundingFscore provide a training-and-evaluation framework for disentangling VLA decisions from shortcut priors while preserving responsiveness to task-relevant evidence.', 'score': 3, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '321736009eab9e99', 'authors': ['Mingyu Liu', 'Chonghao Sima', 'Tianjian Feng', 'Hanqing Wang', 'Cong Chen', 'Hao Chen', 'Chunhua Shen'], 'affiliations': ['HKUST(GZ)', 'Shanghai Innovation Institute', 'University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04616.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Борьба с модальными ярлыками в робот-политиках: обучение по настоящим задачам, а не по случайным признакам', 'desc': 'В статье исследуется проблема модальных ярлыков (modality shortcuts) в политиках vision-language-action, когда модель предсказывает действия на основе случайных визуальных или языковых признаков, а не задачи. Авторы предлагают Perturbot — метод обучения, который использует возмущения изображений камеры запястья, расширенные описания инструкций и добавление отказавшихся траекторий для повышения надёжности обучения. Они также вводят GroundingFscore — метрику, которая измеряет степень зависимости политики от модальных ярлыков в отличие от метрики успеха задачи. Предложенный фреймворк позволяет обучать робот-политики, которые полагаются на релевантные задаче доказательства, а не на случайные корреляции в данных.'}, 'en': {'title': 'Enhancing VLA Policies: From Shortcuts to Evidence', 'desc': 'This paper introduces a new approach called Perturbot to improve vision-language-action (VLA) policies in machine learning. It identifies a problem where these policies rely on modality shortcuts, which are cues that can lead to successful actions without considering the actual task evidence. Perturbot enhances the training process by introducing perturbations and enriched instructions, making it harder for the model to depend solely on these shortcuts. Additionally, the authors propose GroundingFscore, a metric to evaluate how much a policy relies on these shortcuts versus actual task evidence, ensuring that improvements in task success are meaningful and robust.'}, 'zh': {'title': '提升视觉-语言-动作策略的有效性', 'desc': '本文提出了一种视觉-语言-动作（VLA）策略，能够在忽略任务证据的情况下完成复杂任务。我们发现，某些模式依赖性（如模态快捷方式）使得视觉、语言或动作线索能够在没有必要的任务证据的情况下预测专家行为。为了解决这个问题，我们提出了Perturbot，它通过引入任务相关的扰动和丰富的指令来增强策略的有效性。我们还提出了GroundingFscore，用于评估策略对模态快捷方式的依赖程度，从而确保策略在依赖任务证据的同时保持响应性。'}}}, {'id': 'https://huggingface.co/papers/2609.39420', 'title': 'QuantCode Model: Specializing Language Models for Executable Algorithmic Trading Code', 'url': 'https://huggingface.co/papers/2609.39420', 'abstract': "Abstract  Large language models are strong general-purpose code generators, but executable algorithmic trading remains a demanding specialization target: a model must translate a natural-language strategy specification into correct program logic for a specialized trading framework, execute on historical data, produce trades, and remain semantically faithful to the request. We study two complementary mechanisms for specializing language models for this setting: continued pretraining on algorithmic-trading framework code and supervised fine-tuning (SFT) on agent-validated request-to-code pairs. Evaluation is centered on QuantCode-Bench, our 400-task benchmark for Backtrader strategy generation, together with a repository-level SWE-bench-like track. Continued pretraining improves single-turn Judge Pass from 41.5% to 47.5% for Qwen3.5-397B-A17B and from 27.8% to 33.0% for Qwen3.6-35B-A3B. SFT applied after continued pretraining yields a larger gain for Qwen3.6-35B-A3B, reaching 58.2% Judge Pass and 83.5% successful backtests; in agentic evaluation it raises first-turn success from 22.3% to 58.3% and final success after up to 10 turns from 47.5% to 79.5%. Continued pretraining alone improves first-turn agentic success but lowers final success after repair from 47.5% to 32.5%, consistent with degraded instruction following, whereas SFT improves both. We also identify a capability-retention failure: domain specialization degrades parser-conformant structured tool calling, and targeted recovery SFT restores tool-call formatting but not the base checkpoint's repository-level agent performance. The results show that framework-oriented pretraining, validated SFT, and explicit capability-retention evaluation address distinct failure modes in domain-specific executable code generation.", 'score': 3, 'issue_id': 3377, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'e14740739029f275', 'pdf_title_img': 'assets/pdf/title_img/2609.39420.jpg', 'data': {'categories': ['#agents', '#optimization', '#open_source', '#training', '#benchmark', '#plp'], 'emoji': '📈', 'ru': {'title': 'Специализация языковых моделей для генерации исполняемого кода алготрейдинга', 'desc': "В работе исследуется адаптация больших языковых моделей для специализированной задачи генерации торговых алгоритмов на платформе Backtrader. Авторы применяют два дополнительных механизма обучения: continued pretraining на коде фреймворка алготрейдинга и supervised fine-tuning на валидированных примерах пар 'запрос-код'. Результаты показывают, что continued pretraining улучшает качество с 41.5% до 47.5% для Qwen3.5-397B, а применение SFT после pretraining достигает 58.2% успешных трансляций и 83.5% корректных backtests. Исследование выявило критическую проблему: специализация домена деградирует способность модели к структурированному форматированию вызовов инструментов, что требует дополнительного целевого обучения для восстановления этой функции."}, 'en': {'title': 'Specializing Language Models for Algorithmic Trading Success', 'desc': "This paper explores how to enhance large language models for generating executable code in algorithmic trading. It introduces two methods: continued pretraining on trading framework code and supervised fine-tuning (SFT) using validated request-to-code pairs. The study uses a benchmark called QuantCode-Bench to evaluate the models' performance, showing significant improvements in generating correct trading strategies. The findings highlight the importance of specialized training and evaluation to address specific challenges in code generation for trading applications."}, 'zh': {'title': '专注于算法交易的语言模型优化', 'desc': '这篇论文研究了如何将大型语言模型专门化为算法交易的代码生成器。作者提出了两种方法：在算法交易框架代码上进行持续预训练，以及在经过验证的请求到代码对上进行监督微调（SFT）。研究表明，持续预训练和SFT都能显著提高模型在交易策略生成任务中的表现。结果显示，框架导向的预训练和经过验证的SFT能够有效解决特定领域可执行代码生成中的不同失败模式。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.03872', 'title': 'Training Numerical Intelligence via Auto-Diagnosis and Skill Discovery', 'url': 'https://huggingface.co/papers/2610.03872', 'abstract': 'Abstract  AI agents are becoming increasingly capable of generating scientific code, but generating code is not the same as improving the algorithms behind it. For numerical solvers, execution feedback can expose poor performance, but rarely reveals its underlying cause and how to address it. We introduce Auto-Diagnosis and Skill Discovery (ADSD), a framework that links numerical diagnosis to reusable solver self-improvement. ADSD follows a diagnosis-first paradigm that first explains why a solver performs poorly, then uses this diagnosis to guide the discovery of appropriate numerical methods. The resulting knowledge is packaged into reusable solver skills, turning solver improvement from trial-and-error editing into a structured process of diagnosis, discovery, and implementation. Across four challenging numerical domains--power flow equation, AC optimal power flow control, stiff ordinary differential equations, and heterogeneous diffusion PDEs--ADSD consistently improves solver accuracy, robustness, and efficiency. On GOC-500 power flow, for example, ADSD reduces mean solver error by nearly 71times, with improvements further transferring to unseen grid topologies and operating regimes.', 'score': 3, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'e07d3703a9b67a10', 'authors': ['Peter Chen', 'Wotao Yin'], 'affiliations': ['BAIR & EECS University of California, Berkeley', 'Decision Intelligence Lab DAMO Academy, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.03872.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'От диагностики к структурному совершенствованию численных решателей', 'desc': 'Статья описывает фреймворк ADSD, который помогает AI агентам улучшать численные решатели через диагностику и переиспользуемые навыки. Вместо простого экспериментирования с кодом система сначала анализирует, почему решатель работает плохо, а затем целенаправленно ищет подходящие численные методы для решения выявленных проблем. Полученные улучшения упаковываются в переиспользуемые компоненты, которые можно применять к разным задачам. На примере четырёх сложных доменов (включая уравнения потоков энергии и жёсткие дифференциальные уравнения) фреймворк достиг значительного улучшения точности и эффективности решателей.'}, 'en': {'title': 'Transforming Solver Improvement through Diagnosis and Skill Discovery', 'desc': "The paper presents Auto-Diagnosis and Skill Discovery (ADSD), a framework designed to enhance numerical solvers by linking performance diagnosis to solver self-improvement. It emphasizes a diagnosis-first approach, where the framework first identifies the reasons behind a solver's poor performance. This diagnosis then informs the discovery of suitable numerical methods, which are packaged as reusable skills for future use. The results show significant improvements in solver accuracy and efficiency across various numerical challenges, demonstrating the effectiveness of structured diagnosis and skill implementation."}, 'zh': {'title': '智能求解器的自我改进新方法', 'desc': '本文介绍了一种名为自动诊断与技能发现（ADSD）的框架，旨在将数值诊断与可重用的求解器自我改进相结合。ADSD采用先诊断后发现的方法，首先解释求解器性能不佳的原因，然后利用这一诊断指导合适数值方法的发现。最终，所获得的知识被打包成可重用的求解器技能，使求解器的改进过程从试错编辑转变为结构化的诊断、发现和实施过程。在多个复杂的数值领域中，ADSD显著提高了求解器的准确性、鲁棒性和效率。'}}}, {'id': 'https://huggingface.co/papers/2610.04137', 'title': 'Dynamic Harness Search: Building Multi-Agent Systems Per-Query via Prediction', 'url': 'https://huggingface.co/papers/2610.04137', 'abstract': 'Abstract  Agent harnesses specify the roles, instructions, tools, and communication structure used to solve a task, and the right harness depends on the query. Because the value of each design choice is observable only through execution, tailoring a harness to each query has required either executing alternatives at inference time or costly manual design. We introduce SHIFT, which moves execution out of the per-query search loop. A local LLM architect learns a policy over harness-building actions from search, and a value function that predicts, from measured executions, a utility balancing accuracy against execution cost. For each query, Monte Carlo tree search uses these predictions to construct a harness. Across 9,193 tasks in six benchmarks, from math to document and general-assistant tasks, with a Gemini 3.5 Flash executor, SHIFT attains the highest mean accuracy, about 80%, outperforming 17 baselines that span prompting, prompt optimization, and workflow search, and exceeding the strongest baseline by 7.2 percentage points. A cheaper mode of SHIFT also attains a higher mean accuracy than every baseline while using 32% fewer execution tokens than the strongest baseline. We further show that choosing structure, instructions, and tools jointly beats choosing only instructions or only tools by up to 9.1 percentage points, and that learned value selection identifies more accurate harnesses with lower execution cost from candidate pools.', 'score': 3, 'issue_id': 3377, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'c8470b13b242ffc7', 'authors': ['Som Sagar', 'Shasha Li', 'Hejie Cui', 'Ransalu Senanayake', 'Sercan Ö. Arık'], 'affiliations': ['Arizona State University', 'Google'], 'pdf_title_img': 'assets/pdf/title_img/2610.04137.jpg', 'data': {'categories': ['#agents', '#rl', '#training', '#benchmark'], 'emoji': '🏗️', 'ru': {'title': 'Умная архитектура агентов: учимся выбирать конфигурацию вместо её перебора', 'desc': 'Авторы предлагают SHIFT — метод для автоматического подбора оптимальной конфигурации агента (включая роли, инструкции, инструменты и структуру коммуникации) для каждого запроса без необходимости выполнения всех вариантов во время инференса. Локальная LLM обучается на основе поиска предсказывать оптимальные действия по построению конфигурации и оценивать полезность, балансируя точность и вычислительные затраты. Для каждого запроса используется поиск методом Монте-Карло для конструирования оптимальной конфигурации агента. На наборе из 9193 задач метод достигает 80% точности, превосходя 17 базовых подходов и демонстрируя возможность совместного выбора структуры, инструкций и инструментов для улучшения производительности.'}, 'en': {'title': 'SHIFT: Optimizing Agent Harnesses for Better Performance and Efficiency', 'desc': 'The paper introduces SHIFT, a method for optimizing agent harnesses used in machine learning tasks. It leverages a local large language model (LLM) to learn a policy for building harnesses based on previous executions, thus avoiding the need for costly manual design or real-time execution during query processing. By employing Monte Carlo tree search, SHIFT effectively balances accuracy and execution cost, achieving superior performance across various benchmarks. The results demonstrate that SHIFT not only outperforms existing methods but also reduces execution costs while improving accuracy by selecting the best combination of structure, instructions, and tools.'}, 'zh': {'title': 'SHIFT：优化任务执行的智能代理工具选择', 'desc': '本文介绍了一种名为SHIFT的框架，用于优化任务执行中的代理工具选择。SHIFT通过将执行过程移出每个查询的搜索循环，利用局部大语言模型（LLM）学习构建代理工具的策略和价值函数。通过蒙特卡洛树搜索，SHIFT能够为每个查询构建最优的代理工具组合，从而在多个基准测试中实现了最高的平均准确率，超过了17个基线方法。研究表明，联合选择结构、指令和工具的方式比单独选择指令或工具的方式更具优势，能够显著提高准确性并降低执行成本。'}}}, {'id': 'https://huggingface.co/papers/2610.04226', 'title': 'PaLoRA: Paced Low-Rank Adaptation for Continual Learning', 'url': 'https://huggingface.co/papers/2610.04226', 'abstract': 'Abstract  LoRA-based continual learning methods mitigate catastrophic forgetting through various mechanisms, yet nearly all complement these with small learning rates as a heuristic to restrict gradient scaling magnitude. Such fixed heuristics lack theoretical guidance on how the strength of this restriction should evolve as tasks accumulate. We reveal that even under directional constraints such as nullspace projection, finite-precision updates inevitably leak into the subspace of accumulated prior knowledge along multiple directions. While small learning rates attenuate such leakage, they cannot prevent the accumulated forgetting from intensifying as the effective rank of historical knowledge grows. We show that the optimal magnitude restriction should adaptively increase with this effective rank to balance stability and plasticity, i.e., preservation of previous knowledge and acquisition of new task information. Under an anisotropic leakage model, we derive a pacing law s^*=R/c that characterizes the optimal scaling of gradient steps, i.e., the magnitude restriction itself, where R is the effective rank of past updates. Based on this insight, we propose PaLoRA, which compresses historical knowledge via adaptive SVD truncation, projects gradients onto the nullspace of prior tasks, and applies rank-aware adaptive pacing. Experiments demonstrate consistent improvements over prior methods, with particularly strong performance in long-horizon settings, achieving substantial gains of 4% accuracy on challenging 50-task ImageNet-A and ImageNet-R benchmarks.', 'score': 3, 'issue_id': 3377, 'pub_date': '2026-10-03', 'pub_date_card': {'ru': '3 октября', 'en': 'October 3', 'zh': '10月3日'}, 'hash': '0fb603af9fad51cd', 'authors': ['Yuxuan Li', 'Fanhu Zeng', 'Hao Tang'], 'affiliations': ['Institute of Automation Chinese Academy of Sciences', 'School of Computer Science Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04226.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🧠', 'ru': {'title': 'Адаптивное управление темпом обучения для непрерывного обучения без забывания', 'desc': 'В статье изучается проблема катастрофического забывания в методах непрерывного обучения на основе LoRA. Авторы показывают, что даже при использовании ограничений направления (проекция на нулевое подпространство), обновления с конечной точностью неизбежно просачиваются в подпространство накопленного знания. Они выводят закон темпа обучения s*=R/c, который определяет оптимальное масштабирование градиентов в зависимости от эффективного ранга исторических обновлений. Предложенный метод PaLoRA использует адаптивное SVD-сжатие и динамическое управление темпом обучения для достижения баланса между стабильностью и пластичностью нейронной сети.'}, 'en': {'title': 'Adaptive Learning Rates for Continual Knowledge Retention', 'desc': 'This paper addresses the problem of catastrophic forgetting in continual learning using LoRA-based methods. It critiques the common practice of using small learning rates as a heuristic to control gradient scaling, arguing that this approach lacks theoretical backing. The authors propose that the optimal learning rate should adapt based on the effective rank of accumulated knowledge, which helps balance the retention of old information and the integration of new tasks. They introduce PaLoRA, a method that employs adaptive SVD truncation and rank-aware pacing to improve performance on challenging benchmarks, showing significant accuracy gains.'}, 'zh': {'title': '自适应学习率，平衡知识保留与新任务学习', 'desc': '本文探讨了基于LoRA的持续学习方法如何通过不同机制减轻灾难性遗忘。研究发现，固定的小学习率虽然可以减缓遗忘，但无法阻止随着任务增加而加剧的遗忘现象。我们提出了一种自适应的学习率调整方法，能够根据历史知识的有效秩动态调整梯度步长的大小，以平衡稳定性和可塑性。基于这一理论，我们开发了PaLoRA方法，通过自适应SVD截断和梯度投影，显著提高了在长时间任务中的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.06648', 'title': 'Representation-Space MMD for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.06648', 'abstract': 'Abstract  We introduce a post-training method for diffusion language models (DLMs) that minimizes Maximum Mean Discrepancy (MMD) between generated and reference distributions in the feature space of a frozen pretrained DLM. To estimate MMD, we retain contextual features at individual token positions, obtaining multiple observations per sequence from a single extractor pass. We optimize this objective using policy gradients for discrete models and direct differentiation through generated latents for continuous models. In both cases, computing the loss directly from these features enables efficient post-training without full sampling trajectories or jointly trained auxiliary models. Experiments show lower generative perplexity at comparable entropy on OpenWebText and better accuracy-computation trade-offs on GSM8K. On 16B DMax-LLaDA2.0 models with hybrid masked-uniform diffusion, we increase decoding parallelism with similar or higher accuracy on math and code benchmarks.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '2931ac24532f8121', 'authors': ['Ilya Drobyshevskiy', 'Ilia Sudakov', 'Maksim Semenov', 'Denis Kuznedelev', 'Maksim Ignatov', 'Pavel Temirchev', 'Nikita Balagansky', 'Viacheslav Meshchaninov', 'Nikita Gushchin', 'Dmitry Baranchuk'], 'affiliations': ['AXXX', 'Applied AI Institute', 'Constructor University', 'HSE University', 'T-Tech', 'Yandex Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.06648.jpg', 'data': {'categories': ['#diffusion', '#training', '#math', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Эффективное пост-обучение диффузионных моделей через минимизацию расхождения распределений', 'desc': 'В работе предложен метод пост-обучения для диффузионных языковых моделей, который минимизирует максимальное среднее расхождение между распределениями сгенерированных и эталонных текстов в пространстве признаков замороженной модели. Авторы сохраняют контекстные признаки для каждой позиции токена, позволяя извлекать несколько наблюдений из одного прохода через экстрактор. Оптимизация проводится с помощью градиентной политики для дискретных моделей и прямой дифференциации для непрерывных моделей. Экспериментальные результаты показывают снижение перплексии при сохранении энтропии и улучшение соотношения точность-вычисления на задачах математического рассуждения и генерации кода.'}, 'en': {'title': 'Enhancing Diffusion Language Models with Efficient Post-Training Techniques', 'desc': 'This paper presents a new method for improving diffusion language models (DLMs) after they have been trained. The approach focuses on minimizing the Maximum Mean Discrepancy (MMD) between the distributions of generated text and reference text in a specific feature space. By capturing contextual features at each token position, the method allows for efficient optimization using policy gradients for discrete models and direct differentiation for continuous models. The results demonstrate that this technique leads to lower generative perplexity and better performance on various benchmarks without the need for extensive sampling or additional models.'}, 'zh': {'title': '优化扩散语言模型的后训练方法', 'desc': '我们提出了一种后训练方法，用于扩散语言模型（DLM），该方法通过最小化生成分布和参考分布在特征空间中的最大均值差异（MMD）来优化模型。为了估计MMD，我们保留了每个标记位置的上下文特征，从单个提取器的传递中获得多个观察值。我们使用策略梯度优化离散模型的目标，并通过生成的潜在变量对连续模型进行直接微分。实验结果表明，在OpenWebText上生成的困惑度更低，同时在GSM8K上实现了更好的准确性与计算效率的权衡。'}}}, {'id': 'https://huggingface.co/papers/2605.21318', 'title': 'TextReg: Mitigating Prompt Distributional Overfitting via Regularized Text-Space Optimization', 'url': 'https://huggingface.co/papers/2605.21318', 'abstract': 'Abstract  Large language models (LLMs) are highly sensitive to the prompts used to specify task objectives and behavioral constraints. Many recent prompt optimization methods iteratively rewrite prompts using LLM-generated feedback, but the resulting prompts often become longer, accumulate narrow sample-specific rules, and generalize poorly beyond the training distribution. We study this failure mode as prompt distributional overfitting and argue that it reflects a lack of representation control in discrete text-space optimization. We formalize this view through representational inefficiency, a dual-factor measure that decomposes prompt inefficiency into capacity cost and scope narrowness, attributing distributional prompt overfitting to their coupled growth during optimization. We propose TextReg, a regularization framework that realizes a soft-penalty objective through regularized textual gradients, combining Dual-Evidence Gradient Purification, Semantic Edit Regularization, and Regularization-Guided Prompt Update. Across multiple reasoning benchmarks, TextReg substantially improves out-of-distribution (OOD) generalization, with accuracy gains of up to +11.8% over TextGrad and +16.5% over REVOLVE.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '732a2395f948f19a', 'authors': ['Lucheng Fu', 'Ye Yu', 'Yiyang Wang', 'Yiqiao Jin', 'Haibo Jin', 'B. Aditya Prakash', 'Haohan Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2605.21318.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Регуляризация текстовых градиентов для устойчивой оптимизации подсказок LLM', 'desc': 'В статье изучается проблема переобучения подсказок при оптимизации LLM, когда итеративная переписка приводит к длинным, специфичным для выборки инструкциям с плохой обобщаемостью. Авторы формализуют этот эффект через концепцию репрезентативной неэффективности, которая разлагает неэффективность подсказки на стоимость емкости и узкость охвата. Предложен метод TextReg, использующий регуляризованные текстовые градиенты с тройной техникой: очисткой градиентов, семантической регуляризацией и регуляризованным обновлением подсказок. Экспериментальные результаты показывают существенное улучшение обобщения за пределами распределения данных тренировки, с прибылью до +11.8% сравнительно с TextGrad.'}, 'en': {'title': 'Enhancing Prompt Generalization with TextReg', 'desc': 'This paper addresses the issue of prompt distributional overfitting in large language models (LLMs), where prompts become overly tailored to specific examples and fail to generalize well. The authors introduce a concept called representational inefficiency, which breaks down prompt inefficiency into two factors: capacity cost and scope narrowness. They propose a new regularization framework called TextReg, which uses a soft-penalty objective to improve the optimization of prompts. The results show that TextReg significantly enhances out-of-distribution generalization, achieving notable accuracy improvements on various reasoning tasks.'}, 'zh': {'title': '优化提示，提升泛化能力！', 'desc': '大型语言模型（LLMs）对任务目标和行为约束的提示非常敏感。许多最近的提示优化方法通过使用LLM生成的反馈迭代重写提示，但结果往往导致提示变长，积累特定样本的狭窄规则，并且在训练分布之外的泛化能力较差。我们将这种失败模式称为提示分布过拟合，并认为这反映了离散文本空间优化中缺乏表示控制。我们提出了TextReg，一个正则化框架，通过正则化文本梯度实现软惩罚目标，显著提高了在多个推理基准上的分布外泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2610.02150', 'title': 'From Knowledge Access to Source Learning: Developing Source-Specific Competence', 'url': 'https://huggingface.co/papers/2610.02150', 'abstract': 'Abstract  Large language model (LLM) agents increasingly rely on persistent external sources to solve sequences of knowledge-intensive tasks. Existing methods improve how source content is accessed and organized, while agent-memory systems preserve reusable knowledge from prior interactions, but repeated use of the same source is still largely treated as repeated access rather than an opportunity to progressively improve understanding of that source. We study source learning: developing reusable source-specific competence over a persistent authoritative source. We represent this competence with a persistent source model that captures reusable understanding of the source, including how its knowledge is structured, interpreted, and applied. To construct and progressively refine such models, we propose SourceLearn, which combines two complementary learning mechanisms. Self-Directed Source Learning identifies what remains incompletely understood and adaptively revisits the source, while Task-Guided Source Learning uses downstream experience to reveal local representational gaps and recurring needs in how source knowledge should be organized. In both cases, learning signals determine what should be reconsidered, while persistent updates are reconstructed from the authoritative source. Across five benchmarks and three LLM backends, SourceLearn achieves the best performance in 13 of 15 settings, with gains of up to 22.6 points over Hybrid RAG and substantial overall improvements over static source representations and experience-based memory baselines.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'd09206b5ab2f2201', 'authors': ['Lucheng Fu', 'Kejing Xia', 'Yiyang Wang', 'Yiqiao Jin', 'Jinjin He', 'Xiyuan Yang', 'Haoxin Liu', 'Ye Yu', 'Haibo Jin', 'Yijia Xiao', 'Wenke Lee', 'B. Aditya Prakash', 'Haohan Wang'], 'affiliations': ['Georgia Institute of Technology', 'University of California, Los Angeles', 'University of Illinois at Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.02150.jpg', 'data': {'categories': ['#agents', '#benchmark', '#rag'], 'emoji': '📚', 'ru': {'title': 'Обучение источникам: прогрессивное улучшение понимания внешних знаний', 'desc': 'В работе предлагается новый подход к использованию внешних источников информации LLM-агентами через построение персистентных моделей источников. Авторы вводят концепцию source learning — разработка переиспользуемой компетенции для работы с конкретным источником знаний, которая улучшается со временем. Предложенный метод SourceLearn комбинирует два механизма обучения: самостоятельное изучение источника, определяющее пробелы в понимании, и обучение, управляемое задачами, которое выявляет потребности в организации знаний на основе опыта. Экспериментальные результаты показывают существенные улучшения производительности на пяти бенчмарках, превосходя базовые методы RAG на 22.6 пункта.'}, 'en': {'title': 'Empowering LLMs with Source Learning for Deeper Understanding', 'desc': "This paper introduces a new approach called SourceLearn, which enhances how large language model (LLM) agents learn from external sources. It focuses on 'source learning', where agents develop a deeper understanding of a specific source over time, rather than just accessing it repeatedly. SourceLearn employs two learning mechanisms: Self-Directed Source Learning, which identifies gaps in understanding and revisits the source, and Task-Guided Source Learning, which uses task experiences to improve knowledge organization. The results show that SourceLearn significantly outperforms existing methods, achieving better performance across multiple benchmarks."}, 'zh': {'title': '源学习：提升知识理解的关键', 'desc': '本文研究了源学习的概念，旨在提高大型语言模型（LLM）在知识密集型任务中的表现。我们提出了一种持久的源模型，能够捕捉对特定源的可重用理解，包括知识的结构、解释和应用。通过SourceLearn，我们结合了自我导向源学习和任务引导源学习两种机制，以逐步改进对源的理解。实验结果表明，SourceLearn在多个基准测试中表现优异，显著超越了现有的静态源表示和基于经验的记忆方法。'}}}, {'id': 'https://huggingface.co/papers/2610.05033', 'title': 'Code2Games: Enabling Coding Agents for Gaming World Generation', 'url': 'https://huggingface.co/papers/2610.05033', 'abstract': 'Abstract  Generating a high-quality gaming world from a natural-language game intent requires joint reasoning about scene structure, spatial layout, gameplay objectives, interactive entities, and executable gameplay logic. Existing coding agents can generate individual assets, scenes, or scripts, but often struggle to maintain consistency across these components. We propose Code2Games, an agentic framework that builds a structured gaming world upon a base Blender world generated from the same game intent. Code2Games coordinates scene analysis, gameplay planning, constrained gaming-world generation, and gaming-engine customization through a shared scene-gameplay representation with persistent element correspondence. After world generation, Code2Games adapts the generated world to Unreal Engine 5 and employs an execution-guided reconstruction process that uses compilation diagnostics, runtime feedback, and gameplay test results to resolve inconsistencies arising during engine adaptation. To systematically evaluate gaming-world generation, we introduce the GameCode4D benchmark, which comprises ten fixed game prompts spanning different levels of scene and gameplay complexity. We evaluate the generated results across four dimensions: visual quality, interactive fidelity, multimodal artifact quality, and playable-game quality. Experiments demonstrate that, compared with direct gaming-world generation by coding agents and existing baseline methods, Code2Games consistently improves the visual quality and interactive fidelity of generated gaming worlds, as well as the quality of the resulting games after engine adaptation.', 'score': 2, 'issue_id': 3377, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': 'aac30226f66931dd', 'authors': ['Wei Wu', 'Ziyang Xu', 'Zeyu Zhang', 'Yang Zhao', 'Hao Tang'], 'affiliations': ['La Trobe University', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.05033.jpg', 'data': {'categories': ['#agents', '#benchmark', '#games', '#reasoning', '#multimodal'], 'emoji': '🎮', 'ru': {'title': 'Генерация полносценарных игровых миров из текста с помощью агентной системы и обратной связи от исполнения', 'desc': 'В работе представляется Code2Games — агентная система для генерации полнофункциональных игровых миров на основе естественного языка описания. Система координирует анализ сцены, планирование игровой механики и генерацию игрового мира с помощью единого представления сцены и игровых объектов, обеспечивая согласованность всех компонентов. После создания мира система адаптирует результат к Unreal Engine 5 и применяет процесс реконструкции, управляемый обратной связью от компиляции, выполнения и тестирования геймплея. Авторы вводят бенчмарк GameCode4D и демонстрируют, что их подход превосходит существующие методы по качеству визуализации, интерактивности и общей качеству сгенерированной игры.'}, 'en': {'title': 'Code2Games: Consistent Game World Generation from Intent', 'desc': 'This paper presents Code2Games, a framework designed to generate high-quality gaming worlds from natural language game intents. It addresses the challenge of maintaining consistency across various components like scene structure and gameplay logic, which existing coding agents often struggle with. Code2Games utilizes a shared representation to coordinate scene analysis and gameplay planning, ensuring that all elements correspond correctly throughout the generation process. The framework is evaluated using the GameCode4D benchmark, showing significant improvements in visual quality and interactive fidelity compared to traditional methods.'}, 'zh': {'title': 'Code2Games：高质量游戏世界生成的新方法', 'desc': '本论文提出了一种名为Code2Games的框架，用于从自然语言游戏意图生成高质量的游戏世界。该框架通过共享的场景-游戏表示，协调场景分析、游戏规划和游戏世界生成，确保各个组件之间的一致性。Code2Games在生
