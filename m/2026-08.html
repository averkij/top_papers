одели зрения-языка. На основе этого подхода создан датасет Poplar-9K из 9,401 высококачественной пары изображение-текст с 79,9% acceptance rate. Разработчики открывают датасет вместе с полным конвейером, конфигурациями и аудит-логами для создания кастомизированных человеко-центричных коллекций.'}, 'en': {'title': 'Poplar: Crafting Quality Human-Centric Image Datasets', 'desc': 'This paper introduces Poplar, a new pipeline designed for creating high-quality human-centric image datasets. The pipeline consists of three main steps: Specify, Render, and Inspect, which work together to ensure that the generated images meet specific criteria. It emphasizes the importance of structured attributes and commonsense constraints to avoid unrealistic combinations in the images. The authors also present the Poplar-9K dataset, which includes over 9,000 curated image-text pairs, providing a valuable resource for future machine learning applications.'}, 'zh': {'title': '构建高质量人类中心图像数据集的创新管道', 'desc': '最近的图像生成器可以合成逼真的人类图像，但制作一个有用的图像集合与生成单个成功图像是不同的。我们提出了Poplar，这是一个可重复的指定-渲染-检查管道，用于人类中心图像数据集的合成。该管道通过常识约束来指定结构化属性，并将其转化为摄影导向的提示。使用Poplar，我们构建了Poplar-9K：从11,765个候选图像中保留的9,401个经过审查的人类中心图像-文本对。'}}}, {'id': 'https://huggingface.co/papers/2608.02358', 'title': 'ScrambleToolBench: Agents Search Exhaustively Even When Their Own Map Points to the Next Step', 'url': 'https://huggingface.co/papers/2608.02358', 'abstract': 'Abstract  To operate robustly in open-world environments, autonomous agents should be able to infer the behavior of unfamiliar systems through interaction alone, even in the absence of documentation. However, existing tool-use benchmarks expose semantic tool schemas in static environments, allowing agents to rely on prior knowledge rather than autonomous discovery. To address this limitation, we introduce ScrambleToolBench, an interactive terminal benchmark designed to isolate behavioral reasoning. By removing semantic cues and enforcing a continuous task curriculum, the benchmark requires agents to uncover hidden tool behaviors entirely through trial-and-error interaction. The benchmark further introduces dynamic challenges, including mapping drift, stochastic action failures, and temporal execution windows, to evaluate whether agents can revise and adapt their hypotheses as the environment changes. Our evaluation of state-of-the-art language models reveals that successful initial discovery does not translate into robust adaptation. When faced with structural changes such as mapping drift, agents fail to use deductive strategies such as cycle tracing, and instead exhibit belief inertia or fall back to exhaustive search. Increasing test-time reasoning only amplifies this expensive brute-force search rather than enabling deductive recovery. While equipping agents with persistent memory reduces compounding errors, they remain unable to efficiently infer structural changes, highlighting a gap in current agent reasoning.', 'score': 9, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e17650db15adbe80', 'authors': ['Vernon Toh', 'Navonil Majumder', 'Zhengyuan Liu', 'Nancy F. Chen', 'Soujanya Poria'], 'affiliations': ['Agency for Science, Technology, and Research (A*STAR), Singapore', 'DeCLaRe Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.02358.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔧', 'ru': {'title': 'Агенты LLM не умеют приспосабливаться: разрыв между открытием и адаптацией', 'desc': 'В работе представлена система ScrambleToolBench для оценки способности автономных агентов на основе больших языковых моделей (LLM) открывать и адаптировать поведение незнакомых инструментов исключительно через взаимодействие, без доступа к семантической информации. Бенчмарк удаляет семантические подсказки и использует прогрессивный curriculum обучения, заставляя агентов методом проб и ошибок выяснять скрытую функциональность инструментов. Исследование выявило критический разрыв: современные LLM успешно открывают начальное поведение инструментов, но не способны эффективно адаптироваться при изменении окружения, таких как сдвиг отображения или стохастические сбои. Агенты полагаются на перебор вариантов вместо дедуктивных стратегий вроде трассировки циклов, что указывает на недостаток в способности агентов к гипотетическому рассуждению и адаптивному обучению.'}, 'en': {'title': 'Discovering Tools Through Interaction: A New Benchmark for Autonomous Agents', 'desc': "This paper presents ScrambleToolBench, a new benchmark for testing how autonomous agents can learn about unfamiliar tools through interaction without prior knowledge. Unlike existing benchmarks that provide semantic cues, ScrambleToolBench focuses on behavioral reasoning by requiring agents to discover tool functions via trial-and-error. The benchmark introduces dynamic challenges like mapping drift and stochastic failures to assess agents' adaptability in changing environments. The findings show that while agents can initially discover tool behaviors, they struggle to adapt to structural changes, indicating a need for improved reasoning strategies in machine learning models."}, 'zh': {'title': '自主代理的行为推理新挑战', 'desc': '为了在开放世界环境中稳健地操作，自主代理需要通过交互推断不熟悉系统的行为，而不依赖文档。现有的工具使用基准测试在静态环境中暴露了语义工具模式，使代理依赖于先前知识，而不是自主发现。为了解决这个问题，我们引入了ScrambleToolBench，这是一个交互式基准测试，旨在隔离行为推理。该基准通过消除语义线索和强制连续任务课程，要求代理完全通过试错交互来发现隐藏的工具行为。'}}}, {'id': 'https://huggingface.co/papers/2607.28802', 'title': 'Model or Harness? An Interaction-Centric Taxonomy for Localizing Agent Failures', 'url': 'https://huggingface.co/papers/2607.28802', 'abstract': "Abstract  Existing evaluations often reduce agent failures to system-level outcomes, obscuring where the fault originated and which intervention would improve the agent system. This creates a repair-assignment problem: the same visible failure may call for model post-training, harness engineering, environment redesign, or benchmark repair depending on its source. Because agent behavior emerges from interactions among models, harnesses, users, tools, memory, and environments, outcome-level labels are often insufficient for improvement. Most failure taxonomies do little to resolve this problem because they are benchmark-specific and lack a shared structure. We introduce an interaction-centric taxonomy that localizes failures to the interactions in which they originate and identifies the responsible component. It organizes 41 failure modes by assigning each to an edge between two components and a fault side indicating where the repair belongs. This makes the taxonomy actionable: model-side failures identify targets for post-training, harness-side failures point to scaffolding and tool-integration fixes, and environment or grader failures reveal evaluation conditions requiring redesign. The schema applies across agent architectures, from coding assistants to long-horizon personal assistants and multi-agent systems. We ground the taxonomy in worked examples from public benchmarks, model system cards, published reports, and logged agent trajectories, and evaluate its reproducibility using independent reasoning agents as judges. Across four frontier models, the strongest judge reaches Cohen's κ=0.76 against human category labels, suggesting that the categories capture shared structure rather than annotator-specific preferences.", 'score': 8, 'issue_id': 2842, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'b53cfd0acb6edce3', 'authors': ['Harsh Raj', 'Vipul Gupta', 'Anas Mahmoud', 'Razvan-Gabriel Dumitru', 'Darvin Yi', 'Aakash Sabharwal', 'Yunzhong He'], 'affiliations': ['Scale AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.28802.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Диагностика агентов: определение источника сбоев через анализ взаимодействий компонентов', 'desc': 'В статье предлагается интерактивная классификация ошибок агентов, которая определяет не только сам факт отказа системы, но и точный источник проблемы - какой компонент (модель, инструмент, окружение или оценочная функция) отвечает за сбой. Авторы разработали таксономию, включающую 41 режим отказа, которые распределены по взаимодействиям между компонентами системы, что позволяет точно назначить необходимое улучшение. Таксономия применима к различным архитектурам агентов - от помощников по кодированию до многоагентных систем - и позволяет эффективнее направлять ресурсы на исправление проблем. Воспроизводимость подхода подтверждена независимыми судьями-агентами с коэффициентом согласия Коэна κ=0.76, что указывает на объективность и универсальность предложенной классификации.'}, 'en': {'title': 'Pinpointing Agent Failures for Effective Repairs', 'desc': 'This paper addresses the issue of identifying the root causes of agent failures in machine learning systems. It proposes an interaction-centric taxonomy that categorizes failures based on the interactions between different components of the system, such as models, harnesses, and environments. By organizing 41 failure modes, the taxonomy helps pinpoint where repairs should be made, whether in model training, tool integration, or environment redesign. The authors validate their taxonomy using examples from various benchmarks and demonstrate its effectiveness in improving the understanding and resolution of agent failures.'}, 'zh': {'title': '智能体故障的交互分类法', 'desc': '本文提出了一种以交互为中心的失败分类法，旨在识别智能体系统中的故障来源。传统的评估方法往往将故障简化为系统级结果，无法明确故障的具体原因和改进措施。新分类法将41种失败模式按组件间的交互关系进行组织，明确指出每种故障的责任组件。通过实例和独立评估，验证了该分类法的可重复性，显示出其在不同智能体架构中的广泛适用性。'}}}, {'id': 'https://huggingface.co/papers/2607.29241', 'title': 'RecHarness: A Bandit-Routed Agentic Harness for Self-Evolving Recommender Systems', 'url': 'https://huggingface.co/papers/2607.29241', 'abstract': 'Abstract  Optimizing modern recommender models still depends heavily on engineers manually iterating over architectural, objective, and training-strategy changes. While LLM-based agents can automate this trial-and-error process, allowing the LLM to both select modification directions and generate concrete hypotheses often leads to unstable search under limited experiment budgets. Inspired by the above challenge, we propose RecHarness, a Bandit-Routed Agentic Harness for automated recommender model optimization. RecHarness separates the optimization process into two steps: a bandit router selects the next modification direction according to historical validation feedback, while the LLM generates a concrete optimization hypothesis and executable code edit within the selected direction. To sustain long-horizon exploration, RecHarness uses a jump-basin mechanism to activate a structural-jump arm when local edits stagnate. Across multiple recommendation tasks, datasets, and model backbones, RecHarness achieves more stable performance improvements and uses limited trial budgets more effectively than LLM-reasoning search. During a 7-day online A/B test on a large-scale short-video advertising platform, the selected candidate improves ADVV by 2.084%, Revenue by 0.534%, and Exposure by 0.559%. Code is available at https://github.com/6lyc/RecHarness.', 'score': 7, 'issue_id': 2841, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '586c402d9d294748', 'authors': ['Haoran Ling', 'Yuecheng Li', 'Zeyu Song', 'Jing Yao', 'Shuwen Kang', 'Chi Lu', 'Wenjin Wu', 'Peng Jiang'], 'affiliations': ['Georgia Institute of Technology', 'Kuaishou Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.29241.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Автоматическая оптимизация рекомендательных моделей через гибрид бандита и LLM-агента', 'desc': 'В статье представлена RecHarness — система автоматической оптимизации рекомендательных моделей на основе агентов с использованием LLM. Авторы предложили двухэтапный подход: многорукий бандит выбирает направление модификации модели на основе исторических результатов валидации, а LLM генерирует конкретную гипотезу и код оптимизации в выбранном направлении. Система использует механизм jump-basin для активации структурных изменений, когда локальные улучшения стагнируют, обеспечивая долгосрочную исследовательскую стратегию. Экспериментальная оценка на рекомендательных системах показала стабильные улучшения, а онлайн-тестирование на платформе видео-рекламы продемонстрировало рост ключевых метрик на 2-3%.'}, 'en': {'title': 'Automating Recommender Model Optimization with RecHarness', 'desc': 'This paper introduces RecHarness, a novel framework designed to optimize recommender models more efficiently. It employs a two-step process where a bandit router determines the best modification direction based on past performance, while a large language model (LLM) generates specific hypotheses and code edits for implementation. The framework also incorporates a jump-basin mechanism to encourage exploration when local improvements plateau. Overall, RecHarness demonstrates superior stability and effectiveness in enhancing recommendation systems compared to traditional LLM-based search methods.'}, 'zh': {'title': '自动化推荐模型优化的新方法', 'desc': '本论文提出了一种名为RecHarness的自动化推荐模型优化方法。该方法将优化过程分为两个步骤：首先，使用带子路由器根据历史验证反馈选择下一个修改方向；其次，利用大语言模型生成具体的优化假设和可执行的代码编辑。RecHarness通过跳跃机制来激活结构跳跃臂，以应对局部编辑停滞的问题，从而实现长期探索。实验结果表明，RecHarness在多个推荐任务中表现出更稳定的性能提升，并有效利用有限的实验预算。'}}}, {'id': 'https://huggingface.co/papers/2608.00574', 'title': 'Relax Within, Balance Across: Geometry-Guided Load Balancing for Vision-Language Mixture-of-Experts', 'url': 'https://huggingface.co/papers/2608.00574', 'abstract': 'Abstract  Vision-language MoE batches contain different numbers of image and text tokens. Image resolution, image count, tiling, and prompt length all change this token mix. We call the standard token-level Switch auxiliary loss Std-Aux. Std-Aux balances only the mixed load, so large image and text load errors can cancel at one mix. On our main model, the same trained router shows more than a fivefold change in load imbalance across image resolutions. We hold the image and text load profiles fixed and derive the exact load curve as the token mix varies. The image-text load gap controls sensitivity to the token mix. Physical preprocessing can also change the conditional profiles. The fixed-profile law excludes such changes. To design a remedy, we examine the router input structure. Image and text occupy distinct regions, while visual tokens group strongly by source image. The modality boundary motivates separate image and text terms. The image boundary motivates one equal-weight routing instance per image. ReBA, or Relax Within, Balance Across, implements both choices. Across four split backbones, ReBA lowers load on every reported benchmark input while keeping mean task accuracy comparable to Std-Aux. ReBA also lowers average load over the tested range and worst physical load under resolution and tiling shifts. Code is available at https://github.com/ZiangWu-77/ReBA.', 'score': 6, 'issue_id': 2840, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '8c73c646b6d406f6', 'authors': ['Ziang Wu', 'Peng Jin', 'Qishen Yin', 'Munan Ning', 'Hao Li', 'Peizhen Zhang', 'Li Yuan'], 'affiliations': ['Peng Cheng Laboratory', 'Qwen Team', 'School of Software and Microelectronics, Peking University', 'Shenzhen Graduate School, Peking University', 'Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00574.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#architecture', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка нагрузки между модальностями в vision-language MoE', 'desc': 'Статья посвящена оптимизации маршрутизации в Mixture of Experts (MoE) моделях для vision-language задач. Авторы выявили, что стандартный вспомогательный loss (Std-Aux) неэффективно балансирует нагрузку между модальностями изображений и текста, особенно при изменении разрешения и количества токенов. Они предложили новый метод ReBA (Relax Within, Balance Across), который использует отдельные термины маршрутизации для изображений и текста, а также применяет равномерную маршрутизацию для каждого исходного изображения. Экспериментально показано, что ReBA снижает дисбаланс нагрузки на всех тестовых наборах данных, сохраняя при этом качество решения основной задачи.'}, 'en': {'title': 'Balancing Loads for Efficient Vision-Language Processing', 'desc': 'This paper introduces a method called ReBA (Relax Within, Balance Across) to improve the efficiency of vision-language models by addressing load imbalance in token processing. The authors highlight that traditional methods, like the standard token-level Switch auxiliary loss (Std-Aux), do not effectively manage the varying loads of image and text tokens, leading to inaccuracies. By analyzing the input structure of images and text, they propose a new routing strategy that separates the processing of these modalities, which helps to maintain accuracy while reducing computational load. The results show that ReBA consistently lowers the load across different benchmarks without sacrificing performance, making it a significant advancement in optimizing vision-language tasks.'}, 'zh': {'title': '优化视觉-语言模型的负载分配', 'desc': '这篇论文探讨了视觉-语言模型中的混合负载问题，特别是在图像和文本标记数量不同的情况下。作者提出了一种新的方法ReBA（Relax Within, Balance Across），旨在优化图像和文本的负载分配。通过固定图像和文本的负载配置，ReBA能够在不同的输入条件下降低负载，同时保持任务准确性。实验结果表明，ReBA在多个基准测试中表现优于传统的标准辅助损失方法。'}}}, {'id': 'https://huggingface.co/papers/2607.29377', 'title': 'Zero-Mem: Zero-Token Memory Operations for LLM Agents', 'url': 'https://huggingface.co/papers/2607.29377', 'abstract': "Abstract  LLM agents need memory to act consistently over long interactions, yet many systems use additional LLM calls to operate that memory. Generating intermediate records and mediating their retrieval adds recurring token and time costs, while omitted or merged details can obscure the original evidence. We ask whether structured memory access requires generation at all. Zero-Mem introduces zero-token memory operations: no step outside final question answering invokes an LLM or consumes LLM input or output tokens; encoder computation is accounted for separately. Zero-Mem preserves original interaction traces as its source of record. It organizes the traces in two complementary ways. An entity--context graph exposes connections across interactions, while a temporal hierarchy preserves conversational locality and session state. For each query, Zero-Mem weighs the two views, retrieves from both, and follows their structure to recover supporting relations or surrounding context. Deterministic calibration first discards conflicting evidence and then keeps the reader's answer grounded in the retrieved traces. Only the final-QA reader invokes an LLM. Across long-memory and long-context question-answering benchmarks, Zero-Mem achieves competitive performance while eliminating LLM calls and LLM-token consumption from memory operations. With the same final-QA reader and context budget, it reduces memory-operation time cost by 57.6\\% relative to the fastest compared baseline. Ablations support the contribution of the two views and their query-dependent coordination. Overall, the results show that structured agent memory need not generate an intermediate representation of the past. After peer review, the code and implementation details will be available at blue{https://github.com/TheMoon0815/Zero-mem}.", 'score': 5, 'issue_id': 2843, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '04f31b07b718b95c', 'authors': ['Yilin Xiao', 'Zhehan Zhu', 'Yujing Zhang', 'Jin Chen', 'Zijin Hong', 'Luyao Zhuang', 'Qinggang Zhang', 'Shengyuan Chen', 'Xiaocao Ouyang', 'Lingfei Ren', 'Xiao Huang'], 'affiliations': ['Jilin University', 'Southwestern University of Finance and Economics', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29377.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Структурированная память без генерации: нулевые затраты на обращение к памяти', 'desc': 'Zero-Mem — это система структурированной памяти для LLM агентов, которая работает без дополнительных вызовов языковой модели. Система сохраняет исходные трассировки взаимодействий и организует их двумя дополняющими способами: графом сущность-контекст для выявления связей между взаимодействиями и временной иерархией для сохранения контекста беседы. При обработке каждого запроса Zero-Mem взвешивает обе структуры, извлекает релевантную информацию и использует детерминированную калибровку для фильтрации противоречивых данных. По сравнению с базовыми методами система достигает конкурентной производительности на бенчмарках долгой памяти, полностью исключая LLM вызовы из операций памяти и сокращая время вычислений на 57.6%.'}, 'en': {'title': 'Efficient Memory Management for LLMs Without Intermediate Generation', 'desc': 'The paper introduces Zero-Mem, a novel approach for managing memory in large language model (LLM) agents without generating intermediate records. Instead of relying on additional LLM calls, Zero-Mem utilizes structured memory access through an entity-context graph and a temporal hierarchy to organize interaction traces. This method allows for efficient retrieval of relevant information while maintaining the integrity of the original conversation. The results demonstrate that Zero-Mem significantly reduces time costs and token consumption associated with memory operations, achieving competitive performance in long-memory question-answering tasks.'}, 'zh': {'title': '零令牌记忆操作，提升LLM效率！', 'desc': '这篇论文探讨了大型语言模型（LLM）在长时间交互中需要记忆以保持一致性的问题。传统系统通过额外的LLM调用来操作记忆，这会增加代价和时间成本。Zero-Mem提出了一种零令牌记忆操作的方法，避免了在最终问答之外调用LLM，从而节省了资源。该方法通过实体-上下文图和时间层次结构组织交互记录，显著提高了长记忆和长上下文问答的性能，同时减少了内存操作的时间成本。'}}}, {'id': 'https://huggingface.co/papers/2607.26848', 'title': 'ICDAR 2026 Competition on Information Extraction from Atomic Layer Deposition/Etching (ALD/E) Scientific Figures', 'url': 'https://huggingface.co/papers/2607.26848', 'abstract': 'Abstract  Scientific figure comprehension and reasoning using multimodal AI requires integrating visual perception with domain-specific reasoning to extract meaningful knowledge, often not presented in the text of a research publication. The Sci-ImageMiner benchmark dataset, accompanied by a community-driven competition, raises the bar over prior scientific competitions by curating a comprehensive, expert-annotated dataset across four end-to-end complementary tasks. The competition attracted 68 active participants and 1,263 public/private submissions from 9th January 2026 to 8th April 2026. Our results show that state-of-the-art multimodal models perform well on classification and summarization tasks but struggle with data extraction and scientific reasoning, particularly in visual question-answering. These findings reveal key limitations and highlight challenges and opportunities for improving domain-aware multimodal AI systems. Overall, the Sci-ImageMiner benchmark and competition establish a rigorous platform for advancing research in scientific figure comprehension and reasoning and demonstrate the potential of state-of-the-art approaches for a challenging and complex research area.', 'score': 4, 'issue_id': 2842, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '26ebf50f6e03daa3', 'authors': ['Fahad Ahmed', 'Sören Auer', "Jennifer D'Souza"], 'affiliations': ['L3S Research Center, Leibniz University, Hannover, Germany', 'TIB - Leibniz Information Centre for Science and Technology, Hannover, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2607.26848.jpg', 'data': {'categories': ['#science', '#reasoning'], 'emoji': '🔬', 'ru': {'title': 'Научное видение: от восприятия к рассуждению в мультимодальных системах', 'desc': 'Статья представляет Sci-ImageMiner — набор данных и конкурс для оценки способности мультимодальных моделей понимать научные изображения и рассуждать на их основе. Датасет включает четыре дополнительные задачи с экспертной разметкой, включая классификацию, суммаризацию, извлечение данных и визуальный вопрос-ответ. Современные мультимодальные модели хорошо справляются с классификацией и суммаризацией, но испытывают трудности с извлечением информации и научным рассуждением. Исследование показывает необходимость развития более продвинутых систем, специализированных на обработке научного контента.'}, 'en': {'title': 'Advancing Scientific Figure Comprehension with Multimodal AI', 'desc': 'This paper discusses the integration of visual perception and domain-specific reasoning in multimodal AI to enhance scientific figure comprehension. It introduces the Sci-ImageMiner benchmark dataset, which is designed to improve performance in tasks like classification, summarization, data extraction, and visual question-answering. The competition attracted numerous participants and submissions, highlighting the interest in advancing this field. Results indicate that while current models excel in some areas, they still face significant challenges in scientific reasoning and data extraction, pointing to opportunities for future improvements.'}, 'zh': {'title': '提升科学图像理解的多模态AI挑战', 'desc': '本论文探讨了多模态人工智能在科学图像理解和推理中的应用，强调了视觉感知与领域特定推理的结合。研究提出了Sci-ImageMiner基准数据集，并通过社区驱动的竞赛提升了科学竞赛的标准。尽管最先进的多模态模型在分类和摘要任务上表现良好，但在数据提取和科学推理，尤其是视觉问答方面仍面临挑战。该研究为改进领域感知的多模态AI系统提供了重要的见解和机会。'}}}, {'id': 'https://huggingface.co/papers/2608.01862', 'title': 'Wnuan: Staged Post-Training for Question Answering over Proprietary Enterprise Knowledge', 'url': 'https://huggingface.co/papers/2608.01862', 'abstract': 'Abstract  Enterprise question answering requires models to acquire proprietary knowledge without discarding general capabilities. We present Wnuan, a three-stage pipeline that constructs task-oriented supervision from documents, performs supervised fine-tuning with general-data replay, and applies reinforcement learning to residual errors. On the 707-question WnuanBench, the primary 32B route raises acceptable-answer rate (AAR) from 52.76% before adaptation to 80.06% after SFT and 91.51% after RL. Under a matched 100-update protocol, residual-error sampling outperforms full-pool and size-matched random sampling by 3.11 and 2.97 points, respectively. Source-cluster bootstrap intervals remain above zero for both contrasts, and a same-domain validation set preserves the ordering. The general-benchmark average decreases by 5.17 points across the route, concentrated in instruction following. The automatic evaluation ensemble agrees with an authoritative domain expert on 90.5% of a stratified Wnuan-Inst response sample. These results characterize both the gains and the general-capability cost of staged enterprise adaptation.', 'score': 3, 'issue_id': 2844, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '5604dc94ee70228d', 'authors': ['Xiaofeng Shi', 'Xiaosong Qiu', 'Wenxin Ma', 'Qian Kou', 'Yiming Pan', 'Longbin Yu', 'Ying Liu', 'Haiping Wang', 'Hua Zhou'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)', 'Beijing District Heating Group Co., Ltd. (BDHG)', 'Beijing University of Posts and Telecommunications (BUPT)'], 'pdf_title_img': 'assets/pdf/title_img/2608.01862.jpg', 'data': {'categories': [], 'emoji': '🏢', 'ru': {'title': 'Адаптация больших моделей для корпоративных знаний без потери общих способностей', 'desc': 'Статья описывает Wnuan — трёхэтапный метод адаптации больших языковых моделей для корпоративных задач вопросно-ответного взаимодействия. Первый этап включает конструирование размеченных данных из корпоративных документов, второй этап выполняет supervised fine-tuning с переиспользованием общих данных для сохранения базовых способностей, а третий этап применяет reinforcement learning для исправления оставшихся ошибок. Авторы демонстрируют значительное повышение точности ответов (с 52.76% до 91.51%) при использовании метода residual-error sampling, хотя адаптация приводит к небольшому снижению производительности на общих бенчмарках.'}, 'en': {'title': 'Wnuan: Balancing Specialized Knowledge and General Capabilities in QA', 'desc': 'The paper introduces Wnuan, a three-stage pipeline designed for enterprise question answering that balances proprietary knowledge acquisition with general capabilities. It involves constructing task-oriented supervision from documents, followed by supervised fine-tuning (SFT) using general data, and finally applying reinforcement learning (RL) to address remaining errors. The results show a significant improvement in the acceptable-answer rate (AAR) from 52.76% to 91.51% after applying SFT and RL on the WnuanBench dataset. However, there is a noted decrease in general-benchmark performance, indicating a trade-off between specialized adaptation and maintaining general capabilities.'}, 'zh': {'title': 'Wnuan：提升企业问答系统的适应性与能力', 'desc': '本论文介绍了一种名为Wnuan的三阶段问答模型，旨在在保留通用能力的同时获取专有知识。该模型通过从文档中构建任务导向的监督，进行监督微调，并应用强化学习来处理剩余错误。实验结果显示，Wnuan在707个问题的基准测试中，经过微调和强化学习后，接受答案率显著提高。尽管在通用基准测试中表现有所下降，但模型在特定领域的适应性得到了增强。'}}}, {'id': 'https://huggingface.co/papers/2608.01462', 'title': 'Loud or Silent? A Reusable Framework for Per-Modality Failure Analysis in Multimodal Clinical AI', 'url': 'https://huggingface.co/papers/2608.01462', 'abstract': 'Abstract  Multimodal clinical models are usually judged on accuracy with every modality present, but deployment removes modalities; an echocardiogram is often unavailable where an ECG is routine. Two questions then matter beyond the size of the accuracy loss: which modality was responsible, and whether the model fails loudly or silently once that modality is dropped. The distinction is per-example and modality-level, and is separate from post-hoc feature attribution (e.g. SHAP). Models are replaced often; the evaluation that answers these questions is reused. We present a model-agnostic modality-failure framework: given N modality embeddings, any mask-aware probe, and labels, it returns a per-example failure taxonomy, a per-modality complementarity matrix that attributes error to modalities, and a loud-vs-silent dropout profile separating monitorable failures from those that pass unflagged far from the decision boundary, using only deployment-observable signals. We release it as a small, unit-tested harness and validate it against planted ground truth. Across seeds it recovers that planted modality dominance and complementary subset, reports per-modality loud-vs-silent rates, and scales to a three-modality complementarity matrix; because the planted structure is known by construction, this validates recovery of per-example attribution rather than clinical performance. We then instantiate the framework on frozen EchoJEPA and HuBERT-ECG embeddings for LVEF and the EF <= 40% HFrEF gate over a paired MIMIC-IV cohort, where on the held-out test split (n = 245) dropping echo nearly doubles error. The narrow echo-to-ECG overlap that bounds cohort size is itself a deployment finding for cardiac foundation models. All of our work can be found at https://github.com/criticaldata/PRIMED-AI.', 'score': 3, 'issue_id': 2843, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '26177fef5860d358', 'authors': ['Quang Bui', 'Shlok Jaiswal', 'Samuel Paik-Heintz', 'Kevin Zhou', 'Kaushik Madapati', 'Krittaphas Chaisutyakorn', 'Noah Dane Hebdon', 'Dimitrios Proios', 'Sebastián Andrés Cajas Ordóñez', 'Kacper Dobek', 'Boya Zhang', 'Aly Dhedhi', 'Ahram Han', 'Kushul Reddy Palakala', 'Rahul Gorijavolu', 'Jacques Kpodonu', 'Leo Anthony Celi'], 'affiliations': ['American International School Vienna', 'Department of Biomedical Engineering, Johns Hopkins University', 'Department of Electrical Engineering and Computer Sciences, University of California, Berkeley', 'Department of Radiology and Medical Informatics, University of Geneva', 'Department of Surgery, Seoul National University Hospital', 'Harvard T.H. Chan School of Public Health, Harvard University', 'Hopewell Valley Central High School', 'Institute for Medical Engineering and Science, Massachusetts Institute of Technology', 'MIT Critical Data, Massachusetts Institute of Technology', 'Neuqua Valley High School', 'North Hollywood High School', 'Quantum Innovation Centre (Q.InC), Agency for Science, Technology and Research', 'School of Advanced International Studies, Johns Hopkins University', 'School of Medicine, Johns Hopkins University', 'Siriraj Informatics and Data Innovation Center, Faculty of Medicine, Siriraj Hospital', 'University of North Florida'], 'pdf_title_img': 'assets/pdf/title_img/2608.01462.jpg', 'data': {'categories': ['#healthcare', '#multimodal', '#benchmark'], 'emoji': '🫀', 'ru': {'title': 'Выявление скрытых отказов модальностей в клинических моделях машинного обучения', 'desc': 'В работе предложена модель-агностическая система для анализа отказов мультимодальных клинических моделей при отсутствии отдельных модальностей данных. Фреймворк определяет, какая модальность отвечает за ошибки предсказания, и различает явные отказы (которые легко обнаружить) от скрытых ошибок, которые модель совершает вдалеке от границы решения без явных сигналов тревоги. На основе матрицы дополняемости модальностей система выполняет атрибуцию ошибок и создаёт таксономию отказов для каждого примера, используя только сигналы, наблюдаемые при развёртывании. Валидация на синтетических данных и клинических эхокардиограммах показала, что фреймворк точно восстанавливает доминирующие модальности и определяет критические пары данных для диагностики сердечной недостаточности.'}, 'en': {'title': 'Understanding Modality Impact in Clinical AI Models', 'desc': 'This paper introduces a framework for evaluating multimodal clinical models, focusing on how the absence of certain modalities affects model performance. It emphasizes the importance of understanding which modality contributes to errors and whether these errors are noticeable or not when a modality is removed. The framework provides a systematic way to categorize failures and assess the complementarity of different modalities using deployment-observable signals. The authors validate their approach using existing embeddings and demonstrate its effectiveness in a clinical setting, revealing significant insights about modality interactions in cardiac assessments.'}, 'zh': {'title': '多模态模型的失败分析与评估', 'desc': '这篇论文提出了一种多模态临床模型的评估框架，旨在分析在缺失某些模态时模型的表现。研究重点在于识别哪些模态导致了模型的失败，以及模型在模态缺失时是显著失败还是默默失败。该框架能够提供每个示例的失败分类和模态互补性矩阵，帮助理解错误归因。通过在真实数据集上的验证，研究表明缺失超声心动图时，模型的错误率几乎翻倍，强调了模态之间的互补性。'}}}, {'id': 'https://huggingface.co/papers/2607.23693', 'title': 'Compute Globally, Materialize Locally: The Memory Contract of Sparse Event-KV', 'url': 'https://huggingface.co/papers/2607.23693', 'abstract': "Abstract  Long-horizon agents increasingly reuse their KV cache as memory: a serving system keeps a subset of cached entries and drops the rest. Eviction and episodic-memory schemes therefore rest on a premise rarely tested directly, that a retained event is still informative once the observations that produced it are gone. We test it by omitting one earlier observation from what is served, across otherwise identical agent histories. Among items sensitive to that observation, the answer overwhelmingly follows the omitted value, though no served span says which value is correct. We call this semantic materialization: a downstream event's cached rows act as an independently servable view of computation whose inputs are gone. It can also be written on purpose. A deliberately phrased, answer-free event raises donor-aligned recovery from 6% to 51% on Qwen3-8B without ever naming the value, whereas passively harvesting natural mentions from long-term dialog yields no detected advantage. What such a row carries is specific and bounded. Compact state survives, larger payloads decay toward chance, and whether a construction writes at all turns on phrasing rather than on meaning alone, so two phrasings the model comprehends equally well can diverge sharply. The result is a memory contract for sparse event-KV serving: what to write, where it lands, and what survives once the source is gone. For anyone who evicts the corollary is that dropping a source event and observing no accuracy loss does not show the source was unnecessary.", 'score': 3, 'issue_id': 2843, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '72e8154cafdc9a18', 'authors': ['Zefeng Cai', 'Zerui Cai'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.23693.jpg', 'data': {'categories': ['#inference', '#agents', '#interpretability', '#training', '#long_context'], 'emoji': '💾', 'ru': {'title': 'Скрытая память в кэше: когда информация остаётся без источника', 'desc': "Исследование показывает, что большие языковые модели могут извлекать информацию из закэшированных ключ-значение пар даже когда исходные наблюдения удалены из контекста. Авторы демонстрируют явление 'семантической материализации', когда вычисления модели оставляют независимо используемые следы в кэше, доступные для восстановления информации. Результаты показывают, что целенаправленно сформулированные события могут значительно улучшить восстановление информации, вплоть до 51% точности без явного упоминания значений. Исследование устанавливает границы того, какая информация выживает в разреженном кэше и как формулировка события влияет на сохранение данных в памяти агента."}, 'en': {'title': 'Memory Matters: The Power of Phrasing in Long-Horizon Agents', 'desc': "This paper explores how long-horizon agents use their key-value (KV) cache as a form of memory, specifically focusing on the impact of omitting past observations. The authors investigate whether retaining certain cached entries remains informative when the original observations are no longer available. They introduce the concept of 'semantic materialization', where cached data can serve as a standalone view of computation, even without its original context. The findings suggest that the way information is phrased significantly affects the effectiveness of memory retrieval, highlighting the importance of careful construction in memory systems."}, 'zh': {'title': '记忆契约：缓存的力量与表述的影响', 'desc': '这篇论文探讨了长时间跨度的智能体如何重用其KV缓存作为记忆。研究表明，当一个观察被省略时，保留的事件仍然可以提供信息，尽管相关的输入已经消失。我们称之为语义物化，即缓存的行可以作为独立可服务的计算视图。论文还指出，特定的表述方式会影响记忆的有效性，强调了在稀疏事件KV服务中的记忆契约。'}}}, {'id': 'https://huggingface.co/papers/2607.26326', 'title': 'Seeing or Knowing? Visual Context Sensitivity in Multimodal Large Language Models', 'url': 'https://huggingface.co/papers/2607.26326', 'abstract': 'Abstract  Multimodal Large Language Models (MLLMs) achieve strong performance by integrating visual inputs with the rich priors of pretrained language models. However, they often fail on vision-centric tasks, especially when visual evidence conflicts with pretrained knowledge. We explore these failures separately using two diagnostic paradigms: (1) probing whether visual information is available, via image reconstruction, and (2) measuring multimodal context sensitivity, the extent to which the model follows visual context versus the language prior. To support the second, we introduce the WhatIfVis, a benchmark spanning five coarse-grained dimensions (spatial-temporal, color, count, size, and weight) whose questions admit answers from either the image or the prior. Our analysis yields three findings: (i) Coarse-grained visual evidence is preserved, as these attributes can be reconstructed from the final-layer image tokens of frozen MLLMs. Failures on questions about these attributes therefore point to post-perceptual utilization, rather than to degraded visual encoding during perception. (ii) Even when explicitly instructed to use or ignore visual evidence, vanilla models (without supervised fine-tuning on the WhatIfVis) show unstable visual context sensitivity. Supervised fine-tuning (SFT) improves this controllability and generalizes across domains, and activation patching further localizes the vision-versus-prior trade-off at architecture-specific depths across all six models. (iii) The vision-versus-prior trade-off is controllable along a learned vector. Applying this steering vector, even without any intent instruction, improves controllability over the vanilla model. Together, these results relocate the bottleneck, indicating that for the coarse attributes we study, MLLMs encode the visual evidence but cannot reliably control their reliance on it.', 'score': 2, 'issue_id': 2843, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '304a642c99afdb39', 'authors': ['Jiaang Li', 'Chengzu Li', 'Zhaochong An', 'Yifei Yuan', 'Xi Liu', 'Serge Belongie', 'Vésteinn Snæbjarnarson'], 'affiliations': ['Clemson University', 'ETH Zürich', 'University of Cambridge', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2607.26326.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Визуальная информация кодируется, но не контролируется: переосмысление узких мест мультимодальных моделей', 'desc': 'В работе исследуются причины ошибок мультимодальных больших языковых моделей на задачах, ориентированных на зрение, особенно когда визуальная информация противоречит встроенным знаниям модели. Авторы предложили два метода диагностики: реконструкция изображений для проверки доступности визуальной информации и измерение чувствительности к мультимодальному контексту через бенчмарк WhatIfVis с пятью категориями визуальных атрибутов. Анализ показал, что модели сохраняют грубозернистую визуальную информацию на уровне кодирования, но испытывают трудности с её надёжным использованием на этапах постпроцессинга. Исследование также продемонстрировало, что можно улучшить управляемость баланса между визуальными и языковыми знаниями через fine-tuning и векторное управление активациями.'}, 'en': {'title': 'Enhancing Visual Context Control in Multimodal Language Models', 'desc': 'This paper investigates the limitations of Multimodal Large Language Models (MLLMs) when handling tasks that require visual understanding. It identifies that while MLLMs can encode visual information, they struggle to effectively utilize this information when it conflicts with their pretrained language knowledge. The authors introduce a benchmark called WhatIfVis to assess how well these models can balance visual context and language priors. Their findings suggest that with supervised fine-tuning, MLLMs can improve their ability to control the influence of visual evidence, highlighting a need for better mechanisms to manage this trade-off.'}, 'zh': {'title': '多模态模型的视觉与语言平衡挑战', 'desc': '多模态大型语言模型（MLLMs）通过将视觉输入与预训练语言模型的丰富先验知识结合，取得了强大的性能。然而，当视觉证据与预训练知识冲突时，它们在以视觉为中心的任务上往往表现不佳。我们通过两种诊断方法探讨这些失败：一是通过图像重建来探测视觉信息的可用性，二是测量多模态上下文敏感性，即模型在多大程度上遵循视觉上下文而非语言先验。我们的分析表明，MLLMs能够编码视觉证据，但在控制对其依赖性方面存在瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2608.02315', 'title': 'GEOID-Flood: A Large-Scale Multi-Modal Benchmark Dataset for Flood Segmentation', 'url': 'https://huggingface.co/papers/2608.02315', 'abstract': 'Abstract  Geospatial foundation models aim to learn representations that transfer across regions and sensors, yet evaluating them on specific tasks requires large, high-quality, multi-modal benchmarks that measure how well such models extract value from data. Concerning flood mapping, existing datasets rarely combine bi-temporal SAR and co-registered optical imagery at scale, leaving the value of foundation models for this downstream task largely untested. We introduce GEOID-Flood, a large-scale multi-modal flood segmentation benchmark, derived from Copernicus Emergency Management Service activations, spanning 219 events across 65 countries over ten years. The dataset provides more than 14,000 tiles with co-registered pre- and post-event Sentinel-1, in GRD and RTC format, pre-event Sentinel-2 composite, and DEM, including manually validated labels that separate background from permanent water and flooded water. Using this benchmark, we evaluate foundation models against conventional encoders across single-image, multi-temporal, and multi-modal protocols. We report three main findings: foundation models offer a consistent but modest advantage; optical-SAR fusion with finetuning best resolves transient flooding; and models trained on GEOID-Flood transfer to unseen events better than those trained on existing datasets. Dataset and code available at https://github.com/links-ads/geoid-flood.', 'score': 1, 'issue_id': 2842, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4cc977e1a0cf66fb', 'authors': ['Gaetano Chiriaco', 'Luca Barco', 'Andrea Bragagnolo', 'Claudio Rossi', 'Edoardo Arnaudo'], 'affiliations': ['Fondazione LINKS', 'Politecnico di Torino'], 'pdf_title_img': 'assets/pdf/title_img/2608.02315.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#open_source', '#dataset', '#synthetic', '#transfer_learning', '#science', '#cv'], 'emoji': '🌊', 'ru': {'title': 'Мультимодальные foundation models для точного картирования наводнений через слияние спутниковых данных', 'desc': 'В статье представлен GEOID-Flood — крупный многомодальный бенчмарк для segmentation наводнений, содержащий более 14,000 снимков со спутников Sentinel-1 и Sentinel-2, собранных с помощью сервиса экстренного реагирования Copernicus. Авторы оценили foundation models и традиционные энкодеры на задаче детектирования наводнений, используя протоколы одиночного снимка, мультивременного анализа и мультимодального слияния данных. Основные результаты показывают, что foundation models дают скромное, но стабильное преимущество, а fusion оптических и SAR данных с fine-tuning лучше всего определяет временные наводнения. Модели, обученные на GEOID-Flood, лучше переносятся на новые события, чем те, которые обучались на существующих датасетах.'}, 'en': {'title': 'Unlocking Flood Insights with GEOID-Flood Benchmark', 'desc': 'This paper introduces GEOID-Flood, a new benchmark for evaluating geospatial foundation models specifically for flood segmentation tasks. It combines bi-temporal Synthetic Aperture Radar (SAR) and optical imagery, providing a comprehensive dataset that includes over 14,000 labeled tiles from various flood events. The study finds that while foundation models show a slight performance improvement, the best results come from fine-tuning models with optical-SAR data. Additionally, models trained on GEOID-Flood demonstrate better transferability to new flood events compared to those trained on existing datasets.'}, 'zh': {'title': 'GEOID-Flood：洪水映射的新基准', 'desc': '本论文介绍了GEOID-Flood，这是一个大规模的多模态洪水分割基准数据集，旨在评估地理基础模型在洪水映射任务中的表现。该数据集结合了来自Copernicus应急管理服务的多时相合成孔径雷达(SAR)和光学影像，涵盖了65个国家的219个事件，提供了超过14,000个图块。研究表明，基础模型在洪水检测中具有一定的优势，尤其是光学与SAR数据的融合能够更好地解决瞬时洪水问题。此外，使用GEOID-Flood训练的模型在未见事件上的迁移能力优于现有数据集训练的模型。'}}}, {'id': 'https://huggingface.co/papers/2608.01397', 'title': 'SG-WAM: Self-Guided World Modeling in Geometry-Aware Policy Space', 'url': 'https://huggingface.co/papers/2608.01397', 'abstract': 'Abstract  World Action Models (WAMs) couple action generation with prediction of future states. Their effectiveness depends on whether future dynamics are modeled in a space that is both aligned with action generation and sufficiently geometry-aware to capture where and how actions change the scene. Existing WAMs typically satisfy only part of this requirement, relying on either perceptually heavy observation-space targets or auxiliary latent spaces that are not jointly structured for action relevance and geometry. We propose SG-WAM, a self-guided framework that learns geometry-aware action-conditioned dynamics directly in the policy-derived representation space. SG-WAM introduces learnable dynamics tokens and a Self-Guided World Predictor that forecasts their future latent states conditioned on intervening robot actions. Prediction targets are generated by an exponential moving average copy of the same policy backbone, providing stable supervision within the representation family used by the action expert. Geometric supervision further structures the policy image-token representations, providing spatially grounded context for the dynamics tokens and yielding a future-alignment space that is both action-relevant and geometry-aware. Latent future prediction, geometric grounding, and flow-matching action generation are jointly optimized end-to-end in a unified framework. Built on a 0.9B model without large-scale embodied pretraining, SG-WAM achieves 98.5% average success on LIBERO and 73% on LIBERO-Plus, while outperforming strong baselines in both in-distribution and out-of-distribution real-world evaluations.', 'score': 1, 'issue_id': 2844, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '014beff3f79da3dc', 'authors': ['Ruiteng Zhao', 'Zhengshen Zhang', 'Yue Su', 'Wenshuo Wang', 'Jiahui Li', 'Zhiyuan Yang', 'Francis E. H. Tay', 'Marcelo H. Ang', 'Haiyue Zhu'], 'affiliations': ['Advanced Robotics Centre, National University of Singapore', 'MMLab, The University of Hongkong', 'Nanyang Technological University', 'Singapore Institute of Manufacturing Technology, Agency for Science, Technology and Research (A*STAR)'], 'pdf_title_img': 'assets/pdf/title_img/2608.01397.jpg', 'data': {'categories': ['#small_models', '#robotics', '#architecture', '#training'], 'emoji': '🤖', 'ru': {'title': 'Геометрически осведомленные модели мира для робототехники', 'desc': 'В работе предложена модель SG-WAM, которая объединяет генерацию действий робота с предсказанием будущих состояний окружающей среды. Ключевая идея заключается в обучении геометрически информативной динамики прямо в пространстве представлений, согласованном с политикой действий. Модель использует специальные токены динамики и самонаправленный предсказатель, которые получают стабильный сигнал ошибки от экспоненциального скользящего среднего той же сетевой архитектуры. Геометрическая дополнительная информация структурирует представления токенов, обеспечивая пространственный контекст и достигая состояния, одновременно релевантного для действий и геометрически осведомленного.'}, 'en': {'title': 'Geometry-Aware Action Dynamics for Future State Prediction', 'desc': 'The paper introduces SG-WAM, a novel framework that enhances World Action Models (WAMs) by integrating action generation with future state prediction in a geometry-aware manner. SG-WAM learns dynamics directly in the representation space derived from the policy, ensuring that the model captures how actions influence the environment effectively. It employs learnable dynamics tokens and a Self-Guided World Predictor to forecast future states based on robot actions, providing stable supervision through an exponential moving average of the policy. The framework optimizes latent future prediction, geometric grounding, and action generation together, achieving high success rates in various evaluations without extensive pretraining.'}, 'zh': {'title': '自我引导的几何感知动作模型', 'desc': '世界动作模型（WAMs）将动作生成与未来状态预测结合在一起。它们的有效性取决于未来动态是否在一个与动作生成对齐且足够关注几何特征的空间中建模。现有的WAMs通常只满足部分要求，依赖于感知负担重的观察空间目标或不具备联合结构的辅助潜在空间。我们提出了SG-WAM，一个自我引导的框架，直接在策略导出的表示空间中学习几何感知的动作条件动态。'}}}, {'id': 'https://huggingface.co/papers/2607.29122', 'title': 'A Frozen Pixel-Space Diffusion Model Can Guide Itself with Its Own Samples', 'url': 'https://huggingface.co/papers/2607.29122', 'abstract': 'Abstract  Pixel-space diffusion models aim to learn an end-to-end generator directly over raw pixels. This is challenging because a single model must capture both global structure and local texture in the same high-dimensional space. While recent work improves pixel diffusion through alternative prediction targets, training objectives, and architectures, these advances typically require training a new model from scratch. We show there is a cheaper, complementary strategy: a frozen, pretrained pixel diffusion model can guide itself. Our key observation is that intermediate layers of a pretrained pixel diffusion transformer can be decoded into coarse predictions that capture the main low-frequency structure, while the final layers progressively refine local, high-frequency details. We therefore attach a lightweight prediction head to an intermediate layer, keep the backbone frozen, and use the discrepancy between the intermediate and final predictions as a self-guidance direction during sampling. To train this head, we further find that real images are not necessary. Instead, model-generated samples suffice and even outperform real images for training the head, especially in enhancing the high-frequency components that pixel diffusion tends to underfit. Across multiple pixel diffusion models on ImageNet, our Synthetic Self-Guidance (SSG) consistently improves generation while adapter training requires less than 1% of full-model training compute: it reduces FID by over 50% across the evaluated JiT variants without classifier-free guidance (CFG) and further improves strong baselines with CFG, e.g., JiT-H/16 from 1.86 to 1.67 and PixelREPA-H/16 from 1.81 to 1.59. Our code is available at https://github.com/zfu006/SSG.', 'score': 1, 'issue_id': 2842, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '40e0f8fb60ef6046', 'authors': ['Zixuan Fu', 'Chong Wang', 'Lanqing Guo', 'Kailai Zhou', 'Jiahao Nie', 'Bihan Wen'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.29122.jpg', 'data': {'categories': ['#training', '#optimization', '#open_source', '#diffusion', '#synthetic', '#architecture', '#cv'], 'emoji': '✨', 'ru': {'title': 'Самонаведение замороженной диффузии через синтетические примеры', 'desc': 'Работа предлагает метод Synthetic Self-Guidance для улучшения генеративных моделей диффузии в пиксельном пространстве без переобучения. Ключевая идея заключается в использовании промежуточных слоёв замороженной предобученной модели для захвата глобальной структуры, а финальных слоёв — для детализации локальных особенностей. К промежуточному слою подключается лёгкий предсказывающий модуль, и разница между предсказаниями используется как сигнал самонаведения при генерации. Авторы показывают, что для обучения этого модуля достаточно синтетических изображений, созданных самой моделью, которые даже превосходят реальные данные и значительно снижают затраты вычислений.'}, 'en': {'title': 'Self-Guidance: Enhancing Pixel Diffusion with Pretrained Models', 'desc': "This paper introduces a method called Synthetic Self-Guidance (SSG) for improving pixel-space diffusion models, which generate images directly from raw pixels. The authors propose using a frozen, pretrained model to guide itself by leveraging intermediate layer outputs to capture low-frequency structures and refining them with final layer outputs for high-frequency details. Instead of requiring real images for training, the method shows that generated samples can effectively train a lightweight prediction head, enhancing the model's performance. The results demonstrate significant improvements in image generation quality while requiring minimal additional computational resources."}, 'zh': {'title': '自我引导提升像素扩散模型生成效果', 'desc': '本文提出了一种新的像素空间扩散模型训练方法，旨在通过自我引导来提高生成效果。我们发现，预训练的像素扩散模型的中间层可以生成粗略的低频结构预测，而最终层则逐步细化高频细节。通过在中间层附加轻量级预测头，并保持主干网络不变，我们利用中间预测与最终预测之间的差异作为自我引导方向进行采样。实验表明，使用模型生成的样本进行训练可以有效提升高频成分的生成质量，且计算资源消耗极低。'}}}, {'id': 'https://huggingface.co/papers/2608.05987', 'title': 'AgentOPSD: Recursive Self-Distillation for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.05987', 'abstract': 'Abstract  Reinforcement learning (RL) with verifiable rewards constructs trajectory-level advantage estimates, yet it often fails to credit the few pivotal decisions that determine outcomes in long-horizon, multi-turn agentic tasks. Recent work introduces privileged self-distillation for credit assignment, providing denser supervision, but it remains unclear how such local signals should represent sequential credit. We propose AgentOPSD, a critic-free, recursive method for turn-level credit assignment in agentic reinforcement learning. AgentOPSD aggregates token-level teacher-student log-probability gaps into turn-level evidence and recursively updates a Bayesian belief state in log-odds space. This yields a principled reweighting scheme that converts sparse outcome supervision into turn-level credit signals and identifies pivotal turns through the marginal belief revision between consecutive states. The method is fully compatible with standard policy optimization and requires neither an additional critic nor extra rollouts. We evaluate AgentOPSD on ALFWorld, WebShop, and Search-QA using Qwen2.5 models at two scales (3B and 7B). AgentOPSD outperforms GRPO and strong self-distillation baselines, achieving 89.1% success on ALFWorld with Qwen2.5-7B. Ablation studies attribute the gains to turn-level aggregation and history-dependent recursive belief updates.', 'score': 66, 'issue_id': 2868, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'b2799d5eeaa0e34f', 'authors': ['Zi-Han Wang', 'Zhengxi Lu', 'Zhiyuan Yao', 'Jinyang Wu', 'Jie Wu', 'Zhengzhou Cai', 'Yueqing Sun', 'Ziang Ye', 'Linji Hao', 'Qi Gu', 'Xunliang Cai', 'Yongliang Shen', 'Yujiu Yang'], 'affiliations': ['Meituan', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05987.jpg', 'data': {'categories': ['#training', '#small_models', '#agents', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Рекурсивное приписание кредита через байесовское обновление убеждений', 'desc': 'Статья представляет AgentOPSD — метод для решения проблемы приписания кредита (credit assignment) в обучении с подкреплением для многошаговых задач с агентами. Вместо использования критика модель рекурсивно обновляет байесовское распределение вероятностей в логарифмическом пространстве, агрегируя различия в логарифмах вероятностей между учителем и учеником на уровне ходов. Метод преобразует разреженный сигнал награды в финальном состоянии в плотные кредиты для каждого критического хода задачи и совместим со стандартными алгоритмами оптимизации политики. Экспериментальные результаты показывают превосходство AgentOPSD над базовыми методами на бенчмарках ALFWorld, WebShop и Search-QA с моделями Qwen2.5 разных размеров.'}, 'en': {'title': 'AgentOPSD: Enhancing Credit Assignment in Reinforcement Learning', 'desc': 'This paper presents AgentOPSD, a novel method for improving credit assignment in reinforcement learning (RL) tasks that involve multiple decision points. Traditional RL struggles to identify which specific actions lead to successful outcomes over long sequences, but AgentOPSD uses a recursive approach to assign credit at the turn level. By aggregating log-probability gaps from teacher-student models, it creates a more informative signal for learning, allowing the agent to focus on pivotal decisions. The method has been tested on various benchmarks and shows significant performance improvements over existing techniques, demonstrating its effectiveness in enhancing RL training.'}, 'zh': {'title': '提升强化学习的关键决策信用分配', 'desc': '这篇论文提出了一种新的强化学习方法，称为AgentOPSD，旨在改善在多轮任务中对关键决策的信用分配。该方法通过递归更新贝叶斯信念状态，将稀疏的结果监督转化为每轮的信用信号。AgentOPSD不需要额外的评论者或额外的回合，完全兼容标准的策略优化。实验结果表明，AgentOPSD在多个基准测试中表现优异，成功率达到了89.1%。'}}}, {'id': 'https://huggingface.co/papers/2607.28609', 'title': 'OSReward: Instituting Standardized Evaluation for Cross-Platform Computer-Use Reward Models', 'url': 'https://huggingface.co/papers/2607.28609', 'abstract': "Abstract  Computer-using agents (CUAs) are advancing rapidly across the digital world. A CUA trajectory records the agent's actions, states, and reasoning. Verifying whether it fulfilled the task instruction is central to CUA evaluation, data curation, and reinforcement learning. Neither human-written verifiers nor human annotators can provide such verification at scale, so the field increasingly turns to vision-language models (VLMs) as judges of CUA trajectories. But a fundamental question has long gone unexamined: are these VLM judges reliable enough? To study it systematically, we introduce OSReward, a realistic, high-quality benchmark that evaluates VLM judges on CUA trajectories. The trajectories come from diverse agent backbones executing human-verified instructions across platforms, then rigorously labeled with ground-truth verdicts through multi-stage human annotation. Building on it, we derive OSReward-Hard, a challenge set concentrating genuinely hard cases, and OSReward-Multi for fine-grained efficiency and alignment scoring. The most comprehensive evaluation of VLM judges to date finds even state-of-the-art models fall short of an ideal judge, sharing a systematic leniency bias that mislabels failed runs as successes. The few reliable enough to trust are too expensive to run at scale, while affordable open models trail far behind. To close this gap, we construct and release OS-Shepherd-100K, an open corpus of reasoning-annotated trajectory judgments for the CUA community. On it, we train OS-Shepherd (9B and 35B), open reward models that supply low-cost, stable, and reliable reward signals, matching commercial judges at 30-60% lower cost than the frontier. Extensive analyses further inform the design of reliable CUA reward at scale. Our code, benchmark, dataset, and model checkpoints are available at https://os-copilot.github.io/OSReward-Home/.", 'score': 51, 'issue_id': 2869, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '328b04b2d9711fbe', 'authors': ['Qiushi Sun', 'Kanzhi Cheng', 'Yian Wang', 'Bowen Yang', 'Hang Yan', 'Liheng Chen', 'Fangzhi Xu', 'Zichen Ding', 'Nuo Chen', 'Jialin Cao', 'Xingdong Gong', 'Zehao Li', 'Kaiming Jin', 'Xinfeng Yuan', 'Zhoumianze Liu', 'Jingyang Gong', 'Zhangyue Yin', 'Jiahui Gao', 'Zhiyong Wu', 'Tianbao Xie', 'Jianbing Zhang', 'Ben Kao', 'Lingpeng Kong'], 'affiliations': ['Fudan University', 'Nanjing University', 'National University of Singapore', 'The University of Hong Kong', 'University of Oxford', 'University of Science and Technology of China', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28609.jpg', 'data': {'categories': ['#interpretability', '#alignment', '#rlhf', '#agents', '#open_source', '#dataset', '#reasoning', '#benchmark', '#multimodal'], 'emoji': '⚖️', 'ru': {'title': 'Открытые модели вознаграждения для надёжной оценки компьютерных агентов', 'desc': 'В работе исследуется надёжность видеоязыковых моделей (VLM) в качестве судей для оценки траекторий агентов, использующих компьютер. Авторы создали OSReward — высокачественный бенчмарк с разнообразными траекториями и тщательной разметкой для оценки способности VLM корректно судить о выполнении задач. Анализ показал, что даже передовые VLM-модели имеют систематическую ошибку — они склонны ошибочно классифицировать неудачные попытки как успешные, а надёжные модели слишком дороги для масштабного применения. Для решения этой проблемы авторы обучили открытые награждающие модели OS-Shepherd на специально подготовленном датасете из 100K аннотированных траекторий, которые обеспечивают надёжные сигналы обратной связи при значительно меньших вычислительных затратах.'}, 'en': {'title': 'Enhancing CUA Evaluation with Reliable and Cost-Effective Reward Models', 'desc': 'This paper discusses the evaluation of computer-using agents (CUAs) through their action trajectories, which include their decisions and reasoning processes. The authors introduce OSReward, a benchmark designed to assess the reliability of vision-language models (VLMs) as judges of these trajectories. They find that while some VLMs can perform adequately, many exhibit a leniency bias, misclassifying failures as successes. To improve the situation, they present OS-Shepherd, a set of open reward models that provide cost-effective and reliable feedback for CUAs, outperforming existing models in terms of efficiency and reliability.'}, 'zh': {'title': '提升CUA评估的可靠性与效率', 'desc': '计算机使用代理（CUA）在数字世界中迅速发展。CUA轨迹记录了代理的行动、状态和推理，验证其是否完成任务指令是CUA评估的核心。由于人类编写的验证者无法大规模提供这种验证，研究者们越来越依赖视觉-语言模型（VLM）来评判CUA轨迹。本文提出了OSReward基准，系统评估VLM在CUA轨迹上的可靠性，并构建了OS-Shepherd模型，以提供低成本、稳定和可靠的奖励信号。'}}}, {'id': 'https://huggingface.co/papers/2608.05248', 'title': 'WorldClaw: Agentic 3D Open-World Generation at Scale', 'url': 'https://huggingface.co/papers/2608.05248', 'abstract': 'Abstract  Generating large-scale, freely explorable 3D worlds from open-ended text remains challenging because a system must jointly maintain global spatial coherence, rich local content, and explicit assets suitable for downstream editing and reuse. We present WorldClaw, a fully agentic, coarse-to-fine framework for open-world 3D scene generation. Planning agents translate a text prompt into a structured specification of regions, terrain, assets, materials, and spatial relations. WorldClaw then builds a globally coherent terrain foundation from semantic layouts, reusable assets, generative or procedural materials, and a region-aware height field. For detail-demanding regions, it generates terrain-conditioned compositions, reconstructs editable textured meshes, and recovers their placement on the terrain; render-based agents further refine terrain, objects, appearance, and contacts. Across diverse open-world prompts, WorldClaw produces large-scale scenes with coherent spatial organization, visually compelling local content, and editable instance-level assets while preserving a consistent global terrain structure.', 'score': 46, 'issue_id': 2867, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '9a406cd7ebda73dc', 'authors': ['Chunchao Guo', 'Jinpeng Li', 'Yang Li', 'Zilong Huang'], 'affiliations': ['Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2608.05248.jpg', 'data': {'categories': ['#agents', '#multimodal', '#3d'], 'emoji': '🌍', 'ru': {'title': 'Агентная генерация больших 3D миров из текста с сохранением пространственной согласованности', 'desc': 'WorldClaw — это агентная система для генерации больших 3D миров на основе текстового описания. Система использует многоагентный подход: планирующие агенты преобразуют текстовый запрос в структурированную спецификацию с регионами, террейном и пространственными отношениями. Фреймворк построен по принципу «от общего к частному», сначала создавая глобально согласованный рельеф и материалы, затем генерируя детальное локальное содержимое с редактируемыми мешами. Рендер-агенты уточняют финальные детали, обеспечивая визуальную привлекательность при сохранении глобальной пространственной согласованности и возможности последующего редактирования.'}, 'en': {'title': 'Crafting 3D Worlds from Text: WorldClaw Unleashed!', 'desc': 'WorldClaw is a novel framework designed for generating expansive 3D environments from text descriptions. It utilizes planning agents to convert text prompts into detailed specifications that include terrain, assets, and spatial relationships. The system ensures global spatial coherence while allowing for rich local details and editable components. By employing a coarse-to-fine approach, WorldClaw effectively creates visually appealing and structured 3D scenes that can be easily modified for various applications.'}, 'zh': {'title': 'WorldClaw：生成开放世界3D场景的新方法', 'desc': '本文介绍了一种名为WorldClaw的框架，用于生成开放世界的3D场景。该系统通过规划代理将文本提示转化为结构化的区域、地形、资产和材料规范。WorldClaw能够构建全球一致的地形基础，并生成细节丰富的区域内容。最终，它能够生成可编辑的实例级资产，同时保持一致的全球地形结构。'}}}, {'id': 'https://huggingface.co/papers/2608.01481', 'title': 'Interpretable MEG Decoding of Perceived Speech: Cortical Sources and the Stimulus Features That Drive Retrieval', 'url': 'https://huggingface.co/papers/2608.01481', 'abstract': 'Abstract  Short segments of perceived speech can be retrieved from non-invasive magnetoencephalographic (MEG) recordings by deep networks trained with a CLIP-style objective against wav2vec 2.0 audio embeddings. Yet their weights do not map onto electrophysiological quantities, and it remains unclear which speech properties drive retrieval.   We build on a high-performing MEG-to-audio retrieval architecture but redesign both its front end and decoder. Its spatial attention operates on a flattened sensor layout; we replace it with spherical harmonics defined on the three-dimensional MEG helmet geometry. We reduce the subject-specific representation from 270 to 25 branches, add a temporal filter to each branch to match it to a neuronal source in space and time, and make the convolutional decoder shallower. Ocular and cardiac components are removed before training to reduce the risk of stimulus-locked shortcuts.   On MEG-MASC, the model reaches 39.75 +/- 0.34% Top-1 accuracy among 1005 candidates across six trained solutions, with about 20 times fewer decoder parameters. Its weights map to source space, recovering generators consistent with the speech-perception network, while left-lateralized branches carry higher-frequency rhythmic components not evident on the right. Paired MEG occlusion shows that 15 of 19 stimulus features contribute, with the largest effects for silence, sound intensity, vowels, and acoustic onsets. Random word lists behave oppositely: substituting narrative MEG into them improves retrieval, indicating that activity without narrative structure carries less recoverable information than activity during coherent speech. The wav2vec target can be reduced to about twelve learned feature dimensions without loss of accuracy, whereas strong temporal compression causes a clear loss.   Together, source mapping and input interventions reveal what drives retrieval.', 'score': 46, 'issue_id': 2874, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '629b97e3ebb9d7aa', 'authors': ['Ilia Semenkov', 'Daria Kleeva', 'Ivan Dakhtin', 'Zarina Maksudova', 'Alex Ossadtchi'], 'affiliations': ['AXXX, Moscow, Russia', 'HSE University, Moscow, Russia', 'ITMO University, St. Petersburg, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2608.01481.jpg', 'data': {'categories': ['#multimodal', '#science', '#interpretability', '#audio', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Расшифровка восприятия речи: от весов нейросети к картам мозга', 'desc': 'Исследователи разработали нейросетевую модель для извлечения фрагментов воспринимаемой речи из МЭГ-записей, используя контрастивное обучение в стиле CLIP. Архитектуру модели переработали, заменив плоское пространственное внимание на сферические гармоники, адаптированные к трёхмерной геометрии МЭГ-шлема, и значительно сократили количество параметров декодера. Веса обученной модели успешно отображаются на источники мозговой активности, согласующиеся с сетью обработки речи, причём левополушарные компоненты кодируют высокочастотные колебания. Через окклюзионный анализ выявлено, что основной вклад в восстановление речи вносят молчание, интенсивность звука, гласные и акустические переходы, а связная речь содержит больше информации, чем случайные последовательности слов.'}, 'en': {'title': 'Enhancing Speech Retrieval from MEG with Deep Learning Innovations', 'desc': 'This paper explores how to improve the retrieval of speech segments from magnetoencephalographic (MEG) recordings using deep learning techniques. The authors redesign a retrieval architecture by implementing spherical harmonics for spatial attention and reducing the complexity of the model while maintaining accuracy. They find that specific speech features, such as silence and sound intensity, significantly influence retrieval performance. Additionally, the study shows that coherent speech provides more recoverable information than random word lists, highlighting the importance of narrative structure in speech perception.'}, 'zh': {'title': '优化MEG语音检索，揭示语音特征的驱动因素', 'desc': '本研究利用深度网络从非侵入性脑磁图（MEG）记录中提取语音片段。我们重新设计了MEG到音频检索的架构，采用了三维MEG头盔几何形状的球谐函数来替代原有的空间注意力机制。通过减少特定个体的表示分支数量，并在每个分支中添加时间滤波器，我们提高了模型的性能。研究结果表明，语音感知网络的一些特征对检索有显著贡献，尤其是静音、声音强度和元音等特征。'}}}, {'id': 'https://huggingface.co/papers/2608.05747', 'title': 'GST-Bench: Can VLMs Develop Global Spatial Awareness from Video?', 'url': 'https://huggingface.co/papers/2608.05747', 'abstract': 'Abstract  Spatial intelligence is fundamental to embodied agents, yet existing benchmarks focus on local spatial perception from single or few viewpoints, overlooking global spatial awareness over continuous, long-horizon visual streams. To address this limitation, we introduce the Global-Spatial-Temporal Benchmark (GST-Bench), a VQA benchmark for global spatial intelligence in video understanding, comprising human-verified questions derived from 6,790 minutes of synthetically generated video. It requires models to perform accurate spatial inference from novel viewpoints unseen in the input video and to map egocentric observations onto global top-down images. A comprehensive evaluation of 22 state-of-the-art VLMs exposes a striking gap between models and humans: the strongest zero-shot model attains only 42.68, far below the human score of 79.08. To probe the cause of this gap, we construct GST-Bench-Local and find that models, despite strong local spatial understanding under the same task formulation, still fail to consolidate long-horizon observations into a globally consistent scene representation. We further provide GST-Train, a dataset for global spatial reasoning, as a complementary resource to facilitate future research on this challenge.', 'score': 30, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'e82b058806995c62', 'authors': ['Qifeng Zhang', 'Kaixiang Huang', 'Heng Dong', 'Huang Fang', 'Junting Chen', 'Junjie Zhu', 'Yonghang Chen', 'Zhiyu Zhang', 'Wei Li'], 'affiliations': ['ByteDance Seed', 'National University of Singapore', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05747.jpg', 'data': {'categories': ['#multimodal', '#video', '#robotics', '#benchmark', '#dataset', '#synthetic', '#long_context'], 'emoji': '🌍', 'ru': {'title': 'Глобальное пространственное понимание: от локальных наблюдений к единому представлению мира', 'desc': 'В работе представлен новый бенчмарк GST-Bench для оценки глобального пространственного понимания видеоагентами через задачу VQA на синтетических видео длительностью 6790 минут. Авторы выявили значительный разрыв между современными моделями на основе видео-языковых трансформеров и человеческими способностями: лучшая модель достигает только 42.68% точности против 79.08% у людей. Исследование показало, что модели хорошо понимают локальные пространственные отношения, но не могут интегрировать долгосрочные наблюдения в согласованное глобальное представление сцены. Авторы предоставляют дополнительный датасет GST-Train для обучения моделей пространственному рассуждению в видео.'}, 'en': {'title': 'Bridging the Gap in Global Spatial Intelligence', 'desc': 'This paper introduces the Global-Spatial-Temporal Benchmark (GST-Bench), which evaluates global spatial intelligence in video understanding. Unlike existing benchmarks that focus on local spatial perception, GST-Bench requires models to infer spatial relationships from unseen viewpoints and to integrate egocentric observations into a global context. The evaluation of 22 state-of-the-art vision-language models (VLMs) reveals a significant performance gap between these models and human capabilities, with the best model scoring only 42.68 compared to a human score of 79.08. To address this issue, the authors also present GST-Train, a dataset designed to enhance global spatial reasoning in future research.'}, 'zh': {'title': '全球空间智能的新基准挑战', 'desc': '空间智能对具身智能体至关重要，但现有基准主要关注局部空间感知，忽视了对连续长时间视觉流的全球空间意识。为了解决这个问题，我们提出了全球空间时间基准（GST-Bench），这是一个用于视频理解的视觉问答基准，包含来自6790分钟合成视频的人类验证问题。该基准要求模型从输入视频中未见的新视角进行准确的空间推理，并将自我中心的观察映射到全球俯视图像上。通过对22个最先进的视觉语言模型的全面评估，我们发现模型与人类之间存在显著差距，最强的零样本模型得分仅为42.68，远低于人类的79.08分。'}}}, {'id': 'https://huggingface.co/papers/2608.06197', 'title': 'EnvACE: Internalizing Environment Dynamics via World Rehearsal for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.06197', 'abstract': 'Abstract  Training large language model agents for long-horizon tool use typically relies on interactions with real or synthesized executable environments, whose construction and verification are costly, or on external simulators that are difficult to ground. We introduce EnvACE, an agentic reinforcement learning method that replaces external environment interaction during training with world rehearsal. The policy alternates between acting and rehearsal: it first generates a tool call, then plays the role of the environment to produce the response induced by that action, and conditions subsequent decisions on the rehearsed response. Both roles are jointly optimized end-to-end using task-success rewards. Through world rehearsal, the policy internalizes the relationship between actions and their environment responses in its parameters, yielding an agent world model that directly supports decision making. Across BFCL-v4, tau^2-Bench, VitaBench, and FinMCP-Bench, EnvACE achieves strong and transferable performance, outperforming environment-scaling baselines in the overall evaluation. Controlled studies further show that world rehearsal consistently improves policy learning across model scales. At test time, the internalized world model enables private rehearsal before committed execution, yielding further gains under a moderate rehearsal budget without additional external interaction. Our findings establish world rehearsal as a new path toward scaling LLM agent training beyond the constraints of external environments. Our code is publicly available at https://github.com/Within-yao/EnvACE.', 'score': 28, 'issue_id': 2868, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'f2d3c1b4b1cbdf06', 'authors': ['Zishan Xu', 'Zhiyuan Yao', 'Yuxin Chen', 'Yifu Guo', 'Zhengxi Lu', 'Yuquan Lu', 'Jinyang Huang', 'Yan Xu', 'Yasheng Wang', 'Weinan Zhang', 'Xingshan Zeng', 'Weiwen Liu'], 'affiliations': ['Central South University', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Sun Yat-sen University', 'Tencent Inc.', 'The Chinese University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.06197.jpg', 'data': {'categories': ['#training', '#agents', '#rl', '#benchmark'], 'emoji': '🎭', 'ru': {'title': 'Репетиция мира вместо реального окружения: путь к масштабированию обучения агентов', 'desc': 'В работе предлагается EnvACE — метод обучения с подкреплением для агентов на основе больших языковых моделей, который заменяет взаимодействие с внешней средой на репетицию мира. Агент чередует фазы действия и репетиции: генерирует вызов инструмента, затем имитирует роль окружения для воспроизведения ответа и основывает дальнейшие решения на этом ответе. Обе роли оптимизируются совместно с помощью вознаграждений за успешное выполнение задач, что позволяет политике интернализировать связь между действиями и ответами окружения. Метод достигает сильных и универсальных результатов на нескольких бенчмарках и превосходит базовые методы масштабирования, при этом репетиция мира последовательно улучшает обучение политики.'}, 'en': {'title': 'Revolutionizing Agent Training with World Rehearsal', 'desc': 'This paper presents EnvACE, a novel reinforcement learning method that enhances the training of large language model agents by using a technique called world rehearsal. Instead of relying on
