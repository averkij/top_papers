ixel-Space Diffusion Model Can Guide Itself with Its Own Samples', 'url': 'https://huggingface.co/papers/2607.29122', 'abstract': 'Abstract  Pixel-space diffusion models aim to learn an end-to-end generator directly over raw pixels. This is challenging because a single model must capture both global structure and local texture in the same high-dimensional space. While recent work improves pixel diffusion through alternative prediction targets, training objectives, and architectures, these advances typically require training a new model from scratch. We show there is a cheaper, complementary strategy: a frozen, pretrained pixel diffusion model can guide itself. Our key observation is that intermediate layers of a pretrained pixel diffusion transformer can be decoded into coarse predictions that capture the main low-frequency structure, while the final layers progressively refine local, high-frequency details. We therefore attach a lightweight prediction head to an intermediate layer, keep the backbone frozen, and use the discrepancy between the intermediate and final predictions as a self-guidance direction during sampling. To train this head, we further find that real images are not necessary. Instead, model-generated samples suffice and even outperform real images for training the head, especially in enhancing the high-frequency components that pixel diffusion tends to underfit. Across multiple pixel diffusion models on ImageNet, our Synthetic Self-Guidance (SSG) consistently improves generation while adapter training requires less than 1% of full-model training compute: it reduces FID by over 50% across the evaluated JiT variants without classifier-free guidance (CFG) and further improves strong baselines with CFG, e.g., JiT-H/16 from 1.86 to 1.67 and PixelREPA-H/16 from 1.81 to 1.59. Our code is available at https://github.com/zfu006/SSG.', 'score': 1, 'issue_id': 2842, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '40e0f8fb60ef6046', 'authors': ['Zixuan Fu', 'Chong Wang', 'Lanqing Guo', 'Kailai Zhou', 'Jiahao Nie', 'Bihan Wen'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.29122.jpg', 'data': {'categories': ['#training', '#optimization', '#open_source', '#diffusion', '#synthetic', '#architecture', '#cv'], 'emoji': '✨', 'ru': {'title': 'Самонаведение замороженной диффузии через синтетические примеры', 'desc': 'Работа предлагает метод Synthetic Self-Guidance для улучшения генеративных моделей диффузии в пиксельном пространстве без переобучения. Ключевая идея заключается в использовании промежуточных слоёв замороженной предобученной модели для захвата глобальной структуры, а финальных слоёв — для детализации локальных особенностей. К промежуточному слою подключается лёгкий предсказывающий модуль, и разница между предсказаниями используется как сигнал самонаведения при генерации. Авторы показывают, что для обучения этого модуля достаточно синтетических изображений, созданных самой моделью, которые даже превосходят реальные данные и значительно снижают затраты вычислений.'}, 'en': {'title': 'Self-Guidance: Enhancing Pixel Diffusion with Pretrained Models', 'desc': "This paper introduces a method called Synthetic Self-Guidance (SSG) for improving pixel-space diffusion models, which generate images directly from raw pixels. The authors propose using a frozen, pretrained model to guide itself by leveraging intermediate layer outputs to capture low-frequency structures and refining them with final layer outputs for high-frequency details. Instead of requiring real images for training, the method shows that generated samples can effectively train a lightweight prediction head, enhancing the model's performance. The results demonstrate significant improvements in image generation quality while requiring minimal additional computational resources."}, 'zh': {'title': '自我引导提升像素扩散模型生成效果', 'desc': '本文提出了一种新的像素空间扩散模型训练方法，旨在通过自我引导来提高生成效果。我们发现，预训练的像素扩散模型的中间层可以生成粗略的低频结构预测，而最终层则逐步细化高频细节。通过在中间层附加轻量级预测头，并保持主干网络不变，我们利用中间预测与最终预测之间的差异作为自我引导方向进行采样。实验表明，使用模型生成的样本进行训练可以有效提升高频成分的生成质量，且计算资源消耗极低。'}}}, {'id': 'https://huggingface.co/papers/2607.29377', 'title': 'Zero-Mem: Zero-Token Memory Operations for LLM Agents', 'url': 'https://huggingface.co/papers/2607.29377', 'abstract': "Abstract  LLM agents need memory to act consistently over long interactions, yet many systems use additional LLM calls to operate that memory. Generating intermediate records and mediating their retrieval adds recurring token and time costs, while omitted or merged details can obscure the original evidence. We ask whether structured memory access requires generation at all. Zero-Mem introduces zero-token memory operations: no step outside final question answering invokes an LLM or consumes LLM input or output tokens; encoder computation is accounted for separately. Zero-Mem preserves original interaction traces as its source of record. It organizes the traces in two complementary ways. An entity--context graph exposes connections across interactions, while a temporal hierarchy preserves conversational locality and session state. For each query, Zero-Mem weighs the two views, retrieves from both, and follows their structure to recover supporting relations or surrounding context. Deterministic calibration first discards conflicting evidence and then keeps the reader's answer grounded in the retrieved traces. Only the final-QA reader invokes an LLM. Across long-memory and long-context question-answering benchmarks, Zero-Mem achieves competitive performance while eliminating LLM calls and LLM-token consumption from memory operations. With the same final-QA reader and context budget, it reduces memory-operation time cost by 57.6\\% relative to the fastest compared baseline. Ablations support the contribution of the two views and their query-dependent coordination. Overall, the results show that structured agent memory need not generate an intermediate representation of the past. After peer review, the code and implementation details will be available at blue{https://github.com/TheMoon0815/Zero-mem}.", 'score': 1, 'issue_id': 2843, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '04f31b07b718b95c', 'authors': ['Yilin Xiao', 'Zhehan Zhu', 'Yujing Zhang', 'Jin Chen', 'Zijin Hong', 'Luyao Zhuang', 'Qinggang Zhang', 'Shengyuan Chen', 'Xiaocao Ouyang', 'Lingfei Ren', 'Xiao Huang'], 'affiliations': ['Jilin University', 'Southwestern University of Finance and Economics', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29377.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Структурированная память без генерации: нулевые затраты на обращение к памяти', 'desc': 'Zero-Mem — это система структурированной памяти для LLM агентов, которая работает без дополнительных вызовов языковой модели. Система сохраняет исходные трассировки взаимодействий и организует их двумя дополняющими способами: графом сущность-контекст для выявления связей между взаимодействиями и временной иерархией для сохранения контекста беседы. При обработке каждого запроса Zero-Mem взвешивает обе структуры, извлекает релевантную информацию и использует детерминированную калибровку для фильтрации противоречивых данных. По сравнению с базовыми методами система достигает конкурентной производительности на бенчмарках долгой памяти, полностью исключая LLM вызовы из операций памяти и сокращая время вычислений на 57.6%.'}, 'en': {'title': 'Efficient Memory Management for LLMs Without Intermediate Generation', 'desc': 'The paper introduces Zero-Mem, a novel approach for managing memory in large language model (LLM) agents without generating intermediate records. Instead of relying on additional LLM calls, Zero-Mem utilizes structured memory access through an entity-context graph and a temporal hierarchy to organize interaction traces. This method allows for efficient retrieval of relevant information while maintaining the integrity of the original conversation. The results demonstrate that Zero-Mem significantly reduces time costs and token consumption associated with memory operations, achieving competitive performance in long-memory question-answering tasks.'}, 'zh': {'title': '零令牌记忆操作，提升LLM效率！', 'desc': '这篇论文探讨了大型语言模型（LLM）在长时间交互中需要记忆以保持一致性的问题。传统系统通过额外的LLM调用来操作记忆，这会增加代价和时间成本。Zero-Mem提出了一种零令牌记忆操作的方法，避免了在最终问答之外调用LLM，从而节省了资源。该方法通过实体-上下文图和时间层次结构组织交互记录，显著提高了长记忆和长上下文问答的性能，同时减少了内存操作的时间成本。'}}}, {'id': 'https://huggingface.co/papers/2607.26326', 'title': 'Seeing or Knowing? Visual Context Sensitivity in Multimodal Large Language Models', 'url': 'https://huggingface.co/papers/2607.26326', 'abstract': 'Abstract  Multimodal Large Language Models (MLLMs) achieve strong performance by integrating visual inputs with the rich priors of pretrained language models. However, they often fail on vision-centric tasks, especially when visual evidence conflicts with pretrained knowledge. We explore these failures separately using two diagnostic paradigms: (1) probing whether visual information is available, via image reconstruction, and (2) measuring multimodal context sensitivity, the extent to which the model follows visual context versus the language prior. To support the second, we introduce the WhatIfVis, a benchmark spanning five coarse-grained dimensions (spatial-temporal, color, count, size, and weight) whose questions admit answers from either the image or the prior. Our analysis yields three findings: (i) Coarse-grained visual evidence is preserved, as these attributes can be reconstructed from the final-layer image tokens of frozen MLLMs. Failures on questions about these attributes therefore point to post-perceptual utilization, rather than to degraded visual encoding during perception. (ii) Even when explicitly instructed to use or ignore visual evidence, vanilla models (without supervised fine-tuning on the WhatIfVis) show unstable visual context sensitivity. Supervised fine-tuning (SFT) improves this controllability and generalizes across domains, and activation patching further localizes the vision-versus-prior trade-off at architecture-specific depths across all six models. (iii) The vision-versus-prior trade-off is controllable along a learned vector. Applying this steering vector, even without any intent instruction, improves controllability over the vanilla model. Together, these results relocate the bottleneck, indicating that for the coarse attributes we study, MLLMs encode the visual evidence but cannot reliably control their reliance on it.', 'score': 0, 'issue_id': 2843, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '304a642c99afdb39', 'authors': ['Jiaang Li', 'Chengzu Li', 'Zhaochong An', 'Yifei Yuan', 'Xi Liu', 'Serge Belongie', 'Vésteinn Snæbjarnarson'], 'affiliations': ['Clemson University', 'ETH Zürich', 'University of Cambridge', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2607.26326.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Визуальная информация кодируется, но не контролируется: переосмысление узких мест мультимодальных моделей', 'desc': 'В работе исследуются причины ошибок мультимодальных больших языковых моделей на задачах, ориентированных на зрение, особенно когда визуальная информация противоречит встроенным знаниям модели. Авторы предложили два метода диагностики: реконструкция изображений для проверки доступности визуальной информации и измерение чувствительности к мультимодальному контексту через бенчмарк WhatIfVis с пятью категориями визуальных атрибутов. Анализ показал, что модели сохраняют грубозернистую визуальную информацию на уровне кодирования, но испытывают трудности с её надёжным использованием на этапах постпроцессинга. Исследование также продемонстрировало, что можно улучшить управляемость баланса между визуальными и языковыми знаниями через fine-tuning и векторное управление активациями.'}, 'en': {'title': 'Enhancing Visual Context Control in Multimodal Language Models', 'desc': 'This paper investigates the limitations of Multimodal Large Language Models (MLLMs) when handling tasks that require visual understanding. It identifies that while MLLMs can encode visual information, they struggle to effectively utilize this information when it conflicts with their pretrained language knowledge. The authors introduce a benchmark called WhatIfVis to assess how well these models can balance visual context and language priors. Their findings suggest that with supervised fine-tuning, MLLMs can improve their ability to control the influence of visual evidence, highlighting a need for better mechanisms to manage this trade-off.'}, 'zh': {'title': '多模态模型的视觉与语言平衡挑战', 'desc': '多模态大型语言模型（MLLMs）通过将视觉输入与预训练语言模型的丰富先验知识结合，取得了强大的性能。然而，当视觉证据与预训练知识冲突时，它们在以视觉为中心的任务上往往表现不佳。我们通过两种诊断方法探讨这些失败：一是通过图像重建来探测视觉信息的可用性，二是测量多模态上下文敏感性，即模型在多大程度上遵循视觉上下文而非语言先验。我们的分析表明，MLLMs能够编码视觉证据，但在控制对其依赖性方面存在瓶颈。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (4)', '#agents (16)', '#agi', '#alignment (5)', '#architecture (9)', '#audio (2)', '#benchmark (27)', '#cv (8)', '#data (1)', '#dataset (18)', '#diffusion (4)', '#ethics (1)', '#games (3)', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (5)', '#interpretability (3)', '#leakage', '#long_context (3)', '#low_resource', '#machine_translation', '#math (2)', '#multilingual', '#multimodal (25)', '#open_source (13)', '#optimization (9)', '#plp (3)', '#rag (2)', '#reasoning (12)', '#rl (10)', '#rlhf (5)', '#robotics (8)', '#science (3)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic (6)', '#training (24)', '#transfer_learning (1)', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-04 17:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-04 17:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-04 17:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
