tle_img/2608.06216.jpg', 'data': {'categories': ['#survey', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'От адаптации параметров к системному обучению: новая парадигма непрерывного обучения', 'desc': 'В статье анализируется эволюция непрерывного обучения (continual learning), которое традиционно фокусировалось на адаптации параметров моделей через изменение весов и архитектуры. Авторы предлагают расширенный взгляд, включающий обучение на основе on-policy подходов, адаптацию во время инференции и использование внешних компонентов, таких как память и библиотеки навыков. Для систематизации этого многообразного ландшафта авторы вводят трёхмерный фреймворк, описывающий когда (When), как (How) и где (Where) происходит обучение в системе. Работа предлагает полный обзор методов в рамках этого фреймворка и обсуждает вызовы и будущие направления развития непрерывного обучения за пределами традиционной адаптации параметров.'}, 'en': {'title': 'Evolving Continual Learning: Beyond Parameters to System-Level Adaptation', 'desc': 'This paper discusses the evolution of continual learning (CL) from a focus on parameter-centric methods to a broader system-level adaptation approach. It introduces new paradigms such as on-policy learning and test-time training, which expand how models can learn and adapt beyond traditional training phases. The authors propose a tri-axial framework to analyze CL, considering the dimensions of When, How, and Where learning occurs. This framework helps to identify key challenges and future directions in the field of continual learning.'}, 'zh': {'title': '持续学习的系统级适应新视角', 'desc': '传统的持续学习主要关注通过参数中心机制来更新和保留知识，例如训练策略、架构设计和权重调整。然而，新的学习范式正在重新定义持续学习的范围，超越了传统的模型适应视角。例如，策略学习扩展了更新机制的空间，而测试时训练则将持续学习从训练阶段延伸到推理阶段。此外，外部组件如记忆、技能库和交互协议进一步拓展了模型能力的演变边界。这些发展表明，持续学习正在从以参数为中心的学习转向系统级适应。'}}}, {'id': 'https://huggingface.co/papers/2608.05785', 'title': 'Task-Conditional Flow Matching for Balanced Multilingual Text Embedding Adaptation', 'url': 'https://huggingface.co/papers/2608.05785', 'abstract': 'Abstract  Multilingual text embedding models are commonly adapted using a single training objective across diverse tasks, despite different tasks requiring fundamentally different optimization strategies. We introduce Task-Conditional Flow Matching (TCFM), a multilingual embedding adaptation framework that selectively applies Flow Matching to translation tasks while optimizing retrieval, classification, and pair-classification tasks with objectives better aligned to their learning dynamics. TCFM further combines teacher-guided representation preservation with a three-stage curriculum to enable stable adaptation. Evaluated on the Indic Massive Text Embedding Benchmark, TCFM establishes a new state-of-the-art, consistently improving embedding quality across a diverse set of multilingual tasks and generalizing across embedding model families. We will publicly release the codebase and datasets upon acceptance of the paper.', 'score': 0, 'issue_id': 2871, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '1043ef2e18a31de8', 'authors': ['Tirth Bhatt', 'Naren Kumar S', 'Mayank Singh'], 'affiliations': ['LINGO Research Group, Indian Institute of Technology Gandhinagar, India'], 'pdf_title_img': 'assets/pdf/title_img/2608.05785.jpg', 'data': {'categories': ['#open_source', '#optimization', '#training', '#benchmark', '#multilingual', '#low_resource', '#machine_translation', '#transfer_learning', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Задача-ориентированное обучение для универсальных многоязычных эмбеддингов', 'desc': 'В работе предложен новый подход Task-Conditional Flow Matching для адаптации многоязычных моделей встраивания текста, который применяет разные стратегии оптимизации для разных задач. Авторы используют Flow Matching для задач перевода, а для задач поиска, классификации и парной классификации применяют специализированные функции потерь, лучше соответствующие их динамике обучения. Метод комбинирует сохранение представлений с помощью учителя и трёхэтапный curriculum для стабильной адаптации модели. На бенчмарке Indic Massive Text Embedding Benchmark подход достигает новых лучших результатов, значительно улучшая качество встраивания на разнообразных многоязычных задачах.'}, 'en': {'title': 'Tailored Adaptation for Multilingual Embeddings', 'desc': 'This paper presents Task-Conditional Flow Matching (TCFM), a new framework for adapting multilingual text embeddings. Unlike traditional methods that use a single training objective, TCFM tailors its approach based on the specific requirements of different tasks, such as translation, retrieval, and classification. It incorporates teacher-guided representation preservation and a structured three-stage curriculum to ensure stable and effective adaptation. The results show that TCFM achieves state-of-the-art performance on the Indic Massive Text Embedding Benchmark, enhancing the quality of embeddings across various multilingual tasks.'}, 'zh': {'title': '任务条件流匹配：多语言嵌入的新突破', 'desc': '多语言文本嵌入模型通常使用单一的训练目标来适应不同的任务，但不同任务需要不同的优化策略。我们提出了任务条件流匹配（TCFM），这是一个多语言嵌入适应框架，它在翻译任务中选择性地应用流匹配，同时对检索、分类和对类分类任务使用更符合其学习动态的目标。TCFM还结合了教师指导的表示保留和三阶段课程，以实现稳定的适应性。在印度大规模文本嵌入基准测试中，TCFM建立了新的最先进水平，在多种多语言任务中持续提高嵌入质量，并在嵌入模型家族中实现了良好的泛化。'}}}, {'id': 'https://huggingface.co/papers/2608.01851', 'title': 'Weights or Skills? A Survey of Robot-Learning Techniques: from Action-Predicting Weights to Robots that Write their Own Skills', 'url': 'https://huggingface.co/papers/2608.01851', 'abstract': 'Abstract  Robot learning is splitting into two bets: policies that bake competence into frozen weights (vision-language-action, or VLA, models), and agents that write and refine their own executable skills as code. This survey organises the field around that axis of weights versus skills. Its central analytical contribution is a deep-dive that arranges code-as-policy methods by their degree of self-improvement, from zero-shot program synthesis, through closed-loop self-repair and persistent skill memory, to the sparsely populated cell in which execution feedback, skill memory, and evolutionary search combine into one open-ended loop; only a few very recent systems (for example ASPIRE, ENPIRE, and RoboClaw) occupy that cell. We map the complementary "skills" pole, from unsupervised reinforcement-learning skill discovery to large-language-model skill libraries, and show that the word "skill" is used in at least five distinct senses, of which only the code sense self-improves without gradient updates. We then connect the taxonomy to the emerging skill economy: commercial robot-skill marketplaces now distribute one-tap skills across robots but ship only static playback, which surfaces open problems of adaptation, cross-embodiment portability, provenance, safety verification, composition, and standardisation. This is a deliberately focused survey. Rather than cataloguing the field exhaustively, it examines 77 representative systems across six technique families through one taxonomy and a set of contrast tables, and it supplies operational definitions of the self-improvement mechanisms together with a statement of what each family cannot do.', 'score': 0, 'issue_id': 2883, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '168880ed4983afdf', 'authors': ['Gaytri Jena', 'Kapil Wanaskar', 'Vinija Jain', 'Aman Chadha', 'Vasu Sharma', 'Amitava Das'], 'affiliations': ['Apple', 'Meta', 'PocketFM', 'Pragya Lab, BITS Pilani Goa', 'San Jose State University', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2608.01851.jpg', 'data': {'categories': ['#robotics', '#rl', '#agents', '#reasoning', '#training', '#survey'], 'emoji': '🤖', 'ru': {'title': 'От замороженных весов к самосовершенствующемуся коду: таксономия робототехнического обучения', 'desc': "В статье проводится обзор методов робототехнического обучения, которые разделяются на два подхода: модели VLA, которые закрепляют компетенции в замороженных весах нейросети, и агенты, которые создают и совершенствуют свои навыки в виде исполняемого кода. Авторы классифицируют методы программирования политик по степени саморазвития — от синтеза программ без примеров до замкнутых систем с самовосстановлением, памятью навыков и эволюционным поиском. Одновременно анализируется альтернативный подход с использованием больших языковых моделей для автоматического открытия и библиотек навыков, выявляя пять различных интерпретаций понятия 'навык' в литературе. Исследование связывает предложенную таксономию с развивающимся коммерческим рынком робот-навыков, выделяя актуальные проблемы адаптации, переносимости между разными робототехническими платформами и безопасности."}, 'en': {'title': 'Navigating the Future of Robot Skills: Weights vs. Self-Improvement', 'desc': "This paper surveys the field of robot learning, focusing on two main approaches: fixed policies with pre-trained models and dynamic agents that create and improve their own skills. It categorizes various methods based on their ability to self-improve, ranging from simple program synthesis to complex systems that integrate feedback and evolutionary search. The authors highlight the different meanings of 'skill' in the context of machine learning and discuss the implications for a growing marketplace of robot skills. By analyzing 77 representative systems, the paper provides a structured overview of the current state of robot learning and identifies key challenges in skill adaptation and standardization."}, 'zh': {'title': '机器人学习的双重探索：能力与技能的对比', 'desc': '这篇论文探讨了机器人学习的两个主要方向：一种是将能力固化为固定权重的模型（如视觉-语言-行动模型），另一种是能够编写和改进自身技能的智能体。论文通过自我改进的程度将代码作为策略的方法进行分类，从零-shot程序合成到闭环自我修复，再到结合执行反馈、技能记忆和进化搜索的开放循环。作者还分析了“技能”这一概念的多重含义，并指出当前商业机器人技能市场面临的适应性、跨实体可移植性等问题。最后，论文通过对77个代表性系统的分析，提供了自我改进机制的操作性定义。'}}}, {'id': 'https://huggingface.co/papers/2608.01049', 'title': 'FactorJEPA: Factorizing Monolithic Futures into Layout-Agent-Interaction Channels for Crowded and Chaotic Global South Urban Worlds', 'url': 'https://huggingface.co/papers/2608.01049', 'abstract': 'Abstract  World models have attracted significant attention for their ability to capture and predict the structure and dynamics of the physical world. In this emerging landscape, Joint Embedding Predictive Architectures (JEPA) offer a particularly compelling direction.   We study a largely unexplored regime: populous, crowded, and chaotic Global South urban environments, which we call DENSEWORLD. Unlike the lower-density, lane-structured settings that dominate existing evaluations, these scenes exhibit soft spatial boundaries, extreme agent heterogeneity, persistent occlusion, and rapid social negotiation under mixed traffic. We introduce the first large-scale dataset for this regime: 1,000 hours of drive-through, walk-through, and aerial video across 22 cities. Existing JEPA formulations struggle to preserve dense interaction dynamics under heterogeneity and partial observability.   We introduce FactorJEPA, which makes world structure a first-class predictive primitive. Rather than encoding the future in a monolithic latent, it composes layout, entities, and interactions, using a visibility gate and separated subspaces to preserve partially observed agents and discourage cross-factor shortcuts. FactorJEPA improves (i) future-latent accuracy (Future-frame L1), (ii) intervention-sensitive prediction (Causal L1), and (iii) robustness to reduced visual evidence (Mask-ratio slope), while exposing (iv) a reproducible motion-information trade-off (Motion cosine). Method rankings replicate across 2B and 1B V-JEPA 2.1 backbones, with rho = 0.895 to 0.978.   We publicly release the DENSEWORLD-115k dataset (https://huggingface.co/datasets/anonymousML123/denseworld-115k) and the surgery-trained FactorJEPA checkpoints (https://huggingface.co/datasets/anonymousML123/factorjepa-outputs/tree/main/outputs/full/vjepa_2_1_vitg_1B/train/m09c_surgery_3stage_DI_diheavy_encoder).', 'score': 0, 'issue_id': 2882, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '833ce4e396220c3f', 'authors': ['Kapil Wanaskar', 'Gaytri Jena', 'Aman Chadha', 'Vinija Jain', 'Vasu Sharma', 'Amitava Das'], 'affiliations': ['Apple, USA', 'Meta, USA', 'PocketFM, USA', 'Pragya Lab, BITS Pilani Goa, India', 'San Jose State University, USA', 'UC Berkeley, USA'], 'pdf_title_img': 'assets/pdf/title_img/2608.01049.jpg', 'data': {'categories': ['#video', '#architecture', '#dataset', '#benchmark', '#synthetic', '#open_source'], 'emoji': '🌆', 'ru': {'title': 'Структурированное предсказание хаотичных городских сцен через факторизованные мировые модели', 'desc': 'Исследование посвящено миру моделям (world models) для предсказания динамики в плотных городских средах Global South, где царит хаос и высокая плотность агентов. Авторы представили FactorJEPA — архитектуру, которая разлагает структуру мира на отдельные факторы (расположение, сущности, взаимодействия), что позволяет лучше справляться с частичной наблюдаемостью и разнородностью агентов. Для оценки предложена первая крупномасштабная база данных DENSEWORLD с 1000 часами видео из 22 городов, содержащая сложные сцены с мягкими границами, перекрытиями и смешанным трафиком. Метод показывает улучшение в точности предсказания будущих состояний, чувствительности к вмешательствам и устойчивости к неполной визуальной информации.'}, 'en': {'title': 'FactorJEPA: Predicting Complex Urban Dynamics in DENSEWORLD', 'desc': 'This paper introduces FactorJEPA, a novel approach to Joint Embedding Predictive Architectures (JEPA) designed to better model complex urban environments in the Global South, referred to as DENSEWORLD. The authors highlight the challenges of predicting interactions in densely populated and chaotic settings, where traditional methods struggle due to agent diversity and occlusion. FactorJEPA enhances predictive accuracy by decomposing the world structure into distinct components, allowing for improved handling of partially observed agents. The study also presents a large-scale dataset, DENSEWORLD-115k, which includes extensive video data to support research in this area.'}, 'zh': {'title': '探索复杂城市环境中的预测模型', 'desc': '本论文研究了世界模型在捕捉和预测物理世界结构与动态方面的能力，特别关注于拥挤和混乱的城市环境。我们提出了一个新的模型FactorJEPA，它通过将世界结构作为主要预测元素，改进了现有的联合嵌入预测架构（JEPA）。该模型能够更好地处理复杂的交互动态，并在部分可观察性下保持准确性。我们还发布了DENSEWORLD-115k数据集，以支持这一研究方向。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');

        const categoryFiltersLogicOptions = document.getElementById('category-options');

        }

                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);

            filterLogicIsAnd = true;

            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (11)', '#agents (43)', '#agi', '#alignment (10)', '#architecture (22)', '#audio (6)', '#benchmark (69)', '#cv (18)', '#data (2)', '#dataset (41)', '#diffusion (13)', '#ethics (2)', '#games (3)', '#graphs', '#hallucinations (1)', '#healthcare (3)', '#inference (11)', '#interpretability (10)', '#leakage (1)', '#long_context (9)', '#low_resource (4)', '#machine_translation (1)', '#math (5)', '#multilingual (7)', '#multimodal (61)', '#open_source (33)', '#optimization (25)', '#plp (6)', '#rag (4)', '#reasoning (24)', '#rl (22)', '#rlhf (12)', '#robotics (16)', '#science (7)', '#security (4)', '#small_models (6)', '#story_generation', '#survey (3)', '#synthetic (11)', '#training (67)', '#transfer_learning (6)', '#video (22)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);

        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-07 23:27',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-07 23:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-07 23:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
