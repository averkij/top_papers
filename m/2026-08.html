ждаемыми наградами на открытые задачи через трансформацию этих задач в проверяемые прокси-окружения. Авторы вдохновляются принципом самоконтролируемого обучения и создают SpyRL — многоагентное окружение самопроцесса, где агенты с асимметричной информацией выполняют целевую задачу и голосуют за выявление шпиона, что автоматически генерирует сигналы награды. Экспериментальные результаты на задачах суммаризации текста, творческого письма и математических рассуждений показывают, что SpyRL превосходит существующие методы самоулучшения для неверифицируемых задач и дает улучшения на верифицируемых задачах рассуждения. Таким образом, трансформация задач позволяет масштабировать методы обучения с подтвержденными наградами за пределы изначально верифицируемых доменов.'}, 'en': {'title': 'Transforming Tasks for Self-Verifiable Learning', 'desc': 'The paper introduces Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a new approach that enhances traditional Reinforcement Learning with Verifiable Rewards (RLVR) for open-ended tasks. RLSVR transforms these tasks into verifiable proxy environments, allowing for automatic generation of reward signals based on the internal rules of the task. The method is exemplified through SpyRL, a multi-agent environment where agents identify a spy based on asymmetric information, providing verifiable rewards through voting outcomes. Experiments demonstrate that RLSVR improves performance on both non-verifiable and verifiable tasks, showcasing its potential to extend scalable self-improvement in reinforcement learning.'}, 'zh': {'title': '自我可验证奖励，拓展强化学习的边界', 'desc': '强化学习与可验证奖励（RLVR）在推理导向的大型语言模型（LLMs）中取得了进展，但其应用主要限于数学和编程等领域。本文提出了一种新的训练范式，称为自我可验证奖励的强化学习（RLSVR），旨在将RLVR扩展到开放式任务。RLSVR通过将开放式任务转化为可验证的代理环境，自动生成奖励信号，从而克服了评估偏差和判断能力瓶颈的问题。实验结果表明，RLSVR在文本摘要、创意写作和数学推理等任务上表现优于现有方法，展示了任务转化的潜力。'}}}, {'id': 'https://huggingface.co/papers/2607.27201', 'title': 'Mental World Modeling', 'url': 'https://huggingface.co/papers/2607.27201', 'abstract': 'Abstract  World models enable a predictive substrate for planning and action, yet existing formulations merely answer a physical question: what/where it is, and how will it evolve. Human behavior, however, is driven by hidden mental state (what a person believes, wants, intends, feels, and considers socially permissible), so a model that tracks the physical scene but not what each agent knows and believes about it predicts the wrong action for the right-looking scene. We formulate Mental World Modeling (MWM), a generic theoretical framework that makes mental variables core components of a world model rather than posthoc rationales: MWM aintains a coupled physical-mental world state, renders a target-specific partial observation, and simulates how candidate actions jointly update both components. We instantiate the framework in MENTIS, a training-free and fully inspectable baseline that decomposes the process into state parsing, target-observation generation, action decomposition, coupled physical and mental transition, and branch-level value evaluation. On a manually constructed, quality-controlled dataset of situated decision scenarios spanning text, image, and sounding-video stories, experiments with 8 modern LLM-based world models demonstrate that explicitly modeling the mental state is essential for predicting human decisions. Deeper analyses further expose the bottlenecks of current mental world modeling. We expect MWM as a next stage of world modeling, from simulating physical scenes to simulating the minds that act in them.', 'score': 52, 'issue_id': 2830, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'c420962c13c93a34', 'authors': ['Hao Fei', 'Yiran Zhao'], 'affiliations': ['National University of Singapore', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2607.27201.jpg', 'data': {'categories': ['#agents', '#multimodal', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'От моделирования физического мира к моделированию умов агентов', 'desc': 'В статье предлагается концепция Mental World Modeling (MWM) — расширение традиционных моделей мира, которые предсказывают только физические процессы. Авторы утверждают, что для точного предсказания человеческих действий необходимо моделировать не только физическое состояние сцены, но и ментальное состояние агентов: их убеждения, желания, намерения и социальные ограничения. Они разработали MENTIS — инспектируемый базовый метод, который одновременно обновляет физическое и ментальное состояние мира при выборе действий. Экспериментальные результаты на наборе данных с текстовыми, визуальными и видеоисторями показывают, что явное моделирование ментального состояния критически важно для предсказания решений людей.'}, 'en': {'title': 'Integrating Minds into Models: The Future of Decision-Making', 'desc': 'This paper introduces Mental World Modeling (MWM), a new framework that integrates mental states into world models for better decision-making predictions. Traditional models focus on physical aspects but fail to account for what agents believe and intend, leading to incorrect actions in seemingly correct scenarios. MWM couples physical and mental states, allowing for a more comprehensive understanding of agent behavior by simulating how actions affect both components. The framework is implemented in MENTIS, which demonstrates that incorporating mental variables significantly improves the accuracy of predicting human decisions in various contexts.'}, 'zh': {'title': '心理世界建模：从物理场景到心理模拟的进化', 'desc': '世界模型为规划和行动提供了预测基础，但现有模型仅回答物理问题：它是什么/在哪里，以及如何演变。人类行为受隐藏心理状态驱动，因此仅跟踪物理场景而不考虑每个代理的知识和信念的模型，可能会预测出错误的行动。我们提出了心理世界建模（MWM），这是一个通用的理论框架，将心理变量作为世界模型的核心组成部分。通过在MENTIS中实例化该框架，我们展示了显式建模心理状态对于预测人类决策的重要性。'}}}, {'id': 'https://huggingface.co/papers/2607.23782', 'title': 'N_0-VTLA: Scaling Vision-Tactile-Language-Action Model with Latent Tactile Tokens', 'url': 'https://huggingface.co/papers/2607.23782', 'abstract': 'Abstract  We present N_0-VTLA, a vision-tactile-language-action (VTLA) foundation model capable of (1) fine-grained contact-rich manipulation with tactile perception and tactile-feedback control, and (2) offline policy improvement from stored deployment data. Building on current vision-based backbones, we propose a training recipe for tactile integration consisting of visuo-tactile pre-training, staged tactile-pathway integration, and advantage-conditioned offline policy improvement. During pre-training, the policy learns broad contact priors from NeoData, our large-scale visuo-tactile robot dataset; to our knowledge, N_0-VTLA is the first VTLA model pretrained on tactile data at scale. During post-training, we augment the policy with a predictive tactile pathway that distills the contact patterns learned at scale into the fine motion adjustments required by downstream tactile-centric manipulation. For offline policy improvement, we introduce ALTER, an advantage-conditioned offline reinforcement learning method that converts relative progress and trajectory-event comparisons into binary advantage labels for policy training on a fixed deployment corpus, further improving task-specific learning on contact-rich skills such as deformable object manipulation. Across contact-rich benchmarks, N_0-VTLA outperforms strong baselines by wide margins: it wins all nine real-robot NeoReal tasks and reaches 63.8% mean success on a twenty-task simulation suite, against 44.0% for the strongest baseline. N_0-VTLA policies trained with ALTER reach 75-95% success on three long-horizon real-robot tasks. These results lay a foundation for versatile tactile-driven manipulation policies.', 'score': 49, 'issue_id': 2828, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'db7423a28f77d870', 'authors': ['NeoteAI Team', 'Fudan TEAI Team'], 'affiliations': ['Fudan TEAI Team', 'NeoteAI Team'], 'pdf_title_img': 'assets/pdf/title_img/2607.23782.jpg', 'data': {'categories': ['#rl', '#dataset', '#robotics', '#multimodal', '#training'], 'emoji': '🤖', 'ru': {'title': 'Тактильное восприятие в фундаментальных моделях для манипуляции', 'desc': 'Представлена N_0-VTLA — модель-фундамент, интегрирующая зрение, тактильное восприятие и язык для обучения с подкреплением манипуляционных навыков. Ключевая инновация — предварительное обучение на большом масштабе тактильных данных из датасета NeoData с последующей интеграцией тактильного пути в политику агента. Для улучшения политики без взаимодействия со средой авторы предложили метод ALTER, который преобразует относительный прогресс в бинарные метки преимущества для обучения на фиксированном корпусе данных. Модель значительно превосходит базовые решения на задачах с контактным взаимодействием, включая манипуляцию деформируемыми объектами и долгосрочные манипуляции на реальных роботах.'}, 'en': {'title': 'Revolutionizing Robotic Manipulation with Tactile Intelligence', 'desc': 'The N_0-VTLA model is a foundation model that integrates vision, tactile perception, and language to enhance robotic manipulation skills. It utilizes a unique training approach that includes visuo-tactile pre-training and a predictive tactile pathway to improve fine motor control during contact-rich tasks. The model employs ALTER, an offline reinforcement learning method, to refine its policy using stored data, allowing it to learn from past experiences effectively. As a result, N_0-VTLA demonstrates superior performance in various manipulation tasks, significantly outperforming existing models.'}, 'zh': {'title': '触觉驱动的灵活操作新基础', 'desc': '本文介绍了一种名为N_0-VTLA的视觉-触觉-语言-动作基础模型，能够实现精细的接触丰富操作，结合触觉感知和反馈控制。该模型通过视觉-触觉预训练、分阶段触觉通路整合和基于优势的离线策略改进来进行训练。N_0-VTLA是首个在大规模触觉数据上进行预训练的VTLA模型，能够从NeoData数据集中学习广泛的接触先验。通过引入ALTER方法，模型在固定的部署数据上进行策略训练，显著提升了在接触丰富技能上的任务特定学习。'}}}, {'id': 'https://huggingface.co/papers/2607.28675', 'title': 'Meshy T2: Fast Native Mesh Generation with Flow Matching', 'url': 'https://huggingface.co/papers/2607.28675', 'abstract': 'Abstract  Polygonal meshes are the standard surface representation of modern 3D pipelines, and generating high-quality meshes with artist-style topology is essential for film, gaming, and interactive 3D applications. Mainstream approaches serialize a mesh into a token sequence and decode it autoregressively, which is slow at inference and sensitive to error accumulation, making them impractical for interactive asset creation. We present Meshy T2, a fast native mesh generation framework built on flow matching. At its core is a vertex-set mesh VAE that encodes a mesh into one continuous latent token per vertex and decodes vertices, edge connectivity, and face winding order in a single pass, preserving high-precision geometry and artist-authored topology without vertex quantization or welding. Generation proceeds as a coarse-to-fine cascade of two flow-matching models: an image-conditioned voxel flow first sketches the overall shape as a coarse occupancy scaffold, and a mesh flow then populates the scaffold with per-vertex latent tokens, conditioned on the image, the scaffold, and a requested vertex budget. This design delivers three practical capabilities: interactive generation speed through parallel flow-based synthesis; effective face-count control through the requested vertex budget; and native support for multi-part assets, whose components emerge directly from the generated connectivity. In our experiments, Meshy T2 achieves state-of-the-art geometric fidelity and completes end-to-end image-to-mesh generation within a median of 6 seconds, over an order of magnitude faster than autoregressive baselines. Code and weights will be available at https://github.com/meshy-dev/meshy-t2.', 'score': 41, 'issue_id': 2829, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'a160a3be8f7cd682', 'authors': ['Jiale Xu', 'Rendong Liang', 'Yuhao Long', 'Siyuan Shen', 'Zangyueyang Xian', 'Zeyi Xu', 'Yuanming Hu'], 'affiliations': ['Meshy AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.28675.jpg', 'data': {'categories': ['#3d', '#open_source', '#inference', '#multimodal', '#architecture', '#games'], 'emoji': '🎨', 'ru': {'title': 'Быстрая генерация 3D-сеток из изображений через flow matching с каскадным уточнением', 'desc': 'В работе представлена Meshy T2 — быстрая система генерации трёхмерных полигональных сеток на основе flow matching, которая кодирует мешь в непрерывное латентное представление с одним токеном на вершину. Система использует каскадный подход из двух моделей: первая модель flow matching с кондиционированием по изображению генерирует грубый voxel scaffold занятости пространства, а вторая заполняет этот каркас латентными токенами вершин с контролем количества граней. Благодаря параллельной обработке на основе flow matching вместо автрегрессивного декодирования, система достигает интерактивной скорости генерации (6 секунд на полный цикл image-to-mesh) при сохранении высокой геометрической точности и авторской топологии мешей. Предложенный подход позволяет эффективно контролировать сложность мешей, поддерживает многокомпонентные активы и работает на порядок быстрее существующих автрегрессивных базовых моделей.'}, 'en': {'title': 'Fast and Precise Mesh Generation with Meshy T2', 'desc': 'The paper introduces Meshy T2, a novel framework for generating high-quality polygonal meshes efficiently. It utilizes a vertex-set mesh Variational Autoencoder (VAE) to encode meshes into continuous latent tokens, allowing for a single-pass decoding of mesh components. The framework employs a two-stage flow-matching approach, starting with a voxel flow for coarse shape generation and followed by a mesh flow for detailed vertex placement. Meshy T2 significantly improves generation speed and geometric fidelity, making it suitable for interactive 3D applications.'}, 'zh': {'title': '快速高质量网格生成的未来', 'desc': 'Polygonal meshes 是现代3D管道的标准表面表示，生成高质量的网格对于电影、游戏和互动3D应用至关重要。传统方法将网格序列化为令牌序列并自回归解码，这在推理时速度较慢且对错误积累敏感，导致不适合互动资产创建。我们提出了 Meshy T2，这是一个基于流匹配的快速原生网格生成框架，能够在单次传递中编码和解码网格的顶点、边连接和面缠绕顺序。Meshy T2 在生成速度、面数控制和多部件资产支持方面表现出色，能够在6秒内完成图像到网格的生成。'}}}, {'id': 'https://huggingface.co/papers/2607.28617', 'title': 'AISPA: User-Centric System Prompt Auditing for Large Language Model Applications', 'url': 'https://huggingface.co/papers/2607.28617', 'abstract': 'Abstract  System prompts are instructions configured by developers to govern the behaviors of foundation models in AI applications. They are used throughout commercial AI products, but are rarely disclosed to the public or regulators, creating a serious trust and accountability gap in the wide deployment of AI systems. In this paper, we introduce Artificial Intelligence System Prompt Assurance (AISPA), a user-centric framework for systematically auditing system prompts in AI systems. AISPA examines specific parts of a system prompt and evaluates them along eight dimensions that matter to users. We then use this framework to review 3,249 instructions from system prompts in 88 commercial AI products, classifying each instruction as either protective (of users) or problematic. Our audit surfaces four core findings. First, system prompt design varies substantially across products and developers, with some organizations averaging over 60 protective instructions per product while others average fewer than 5. Second, protective instructions are widely adopted but shallow in scope: 98.9% of products contain at least one, yet only 24% cover all eight dimensions of the AISPA taxonomy. Third, system prompts have grown steadily longer and more protective of users, suggesting that user protection is becoming a more visible concern in commercial prompt design. Fourth, despite this progress, problematic instructions remain pervasive: roughly 40% of products contain at least one instruction that works against user interests, and protective and problematic instructions frequently coexist within the same prompt. Our findings highlight the need for greater transparency, standardization, and independent oversight for system prompts in commercial AI products.', 'score': 29, 'issue_id': 2828, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'fd2e4d2b5dda0213', 'authors': ['Xiangning Lin', 'Shenzhe Zhu', 'Shu Yang', 'Zhenyu Zhang', 'Haoqian Zhang', 'Yipeng Zhao', 'Chengxuan Qian', 'Tianwei Wang', 'Ziheng Zhang', 'Zhenlong Yuan', 'Dingcheng Wang', 'Juncheng Wu', 'Yuan Si', 'Jiaxin Liu', 'Baolong Bi', 'Robert Mahari', 'Tobin South', 'Dazza Greenwood', 'Zexue He', 'Rishi Bommasani', 'Sophia Kazinnik', 'Andreas Haupt', 'Samuele Marro', 'Erik Brynjolfsson', 'Alex Pentland', 'Jiaxin Pei'], 'affiliations': ['Carnegie Mellon University', 'Institute for Decentralized AI', 'King Abdullah University of Science and Technology', 'Massachusetts Institute of Technology', 'Northwestern University', 'Ohio State University', 'Stanford University', 'University of California, Santa Barbara', 'University of California, Santa Cruz', 'University of Illinois Urbana-Champaign', 'University of Oxford', 'University of Texas at Austin', 'University of Toronto', 'Washington University in St. Louis'], 'pdf_title_img': 'assets/pdf/title_img/2607.28617.jpg', 'data': {'categories': ['#alignment', '#security', '#ethics'], 'emoji': '🔍', 'ru': {'title': 'Прозрачность и ответственность: аудит скрытых инструкций в коммерческих AI-системах', 'desc': 'В статье представлена структурированная методология AISPA для аудита системных инструкций, которые разработчики используют для управления поведением больших языковых моделей в коммерческих AI-приложениях. Исследователи провели анализ 3249 инструкций из системных промптов 88 коммерческих AI-продуктов, классифицируя их по восьми измерениям с точки зрения защиты интересов пользователей. Ключевые находки показывают существенную вариативность в подходах к проектированию система промптов, широкое распространение защитных инструкций при их поверхностном охвате, и одновременное присутствие как защитных, так и проблемных инструкций в одном промпте. Исследование подчеркивает критическую необходимость в повышении прозрачности, стандартизации и независимом надзоре за системными промптами в коммерческих AI-продуктах.'}, 'en': {'title': 'Ensuring Trust in AI: Auditing System Prompts for User Protection', 'desc': 'This paper discusses the importance of system prompts, which are instructions that guide the behavior of AI models in applications. It introduces a framework called Artificial Intelligence System Prompt Assurance (AISPA) to audit these prompts, focusing on user-centric dimensions. The study analyzed over 3,000 instructions from various AI products, revealing significant variability in protective measures across different developers. Despite improvements in user protection, many products still contain problematic instructions, indicating a need for better transparency and oversight in AI prompt design.'}, 'zh': {'title': '提升AI系统提示的透明度与标准化', 'desc': '本论文介绍了人工智能系统提示保障（AISPA），这是一个以用户为中心的框架，用于系统地审计人工智能系统中的系统提示。我们分析了882个商业AI产品中的3249条系统提示指令，评估其对用户的保护性和潜在问题。研究发现，系统提示的设计在不同产品和开发者之间差异显著，且尽管保护性指令普遍存在，但其覆盖范围较窄。尽管系统提示在保护用户方面有所进展，但仍有约40%的产品包含与用户利益相悖的指令，显示出对系统提示透明度和标准化的迫切需求。'}}}, {'id': 'https://huggingface.co/papers/2607.23783', 'title': 'N_0-TWAM: Scaling Tactile-Native World-Action Model for Contact-Rich Manipulation', 'url': 'https://huggingface.co/papers/2607.23783', 'abstract': 'Abstract  We present N_0-TWAM, a tactile-native world-action model for contact-rich manipulation that predicts both future vision and future contact. To our knowledge, it is the first tactile world-action model trained at large scale, and it shows strong capability on contact-rich tasks. We pre-train N_0-TWAM at large scale with visuo-tactile joint training over tactile-rich demonstrations spanning six embodiments and 450 tasks. We use NeoForce, a unified force-based tactile representation, to form a physically grounded contact signal that conditions action generation. To improve long-horizon and multi-stage manipulation, we introduce tactile contact events for task staging and advance through them during execution. For real-time efficiency, we adopt an asymmetric Mixture-of-Transformers architecture that pairs a full-width expert for video prediction with slim experts for downstream action and tactile prediction. Evaluations on both real and simulated benchmarks justify the capabilities of N_0-TWAM across a range of contact-rich tasks, and demonstrate the benefit of data scaling for precise tactile and action prediction. In summary, N_0-TWAM endows a world-action model with predictive capabilities to foresee vision, touch and action, building a solid foundation for fine-grained manipulation on open contact-rich tasks. The codebase and model checkpoints will be made publicly available to foster further research and development in tactile-enabled robotic manipulation.', 'score': 27, 'issue_id': 2830, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '8d7e15aed5d762f0', 'authors': ['NeoteAI Team', 'Fudan TEAI Team'], 'affiliations': ['Fudan TEAI Team', 'NeoteAI Team'], 'pdf_title_img': 'assets/pdf/title_img/2607.23783.jpg', 'data': {'categories': ['#training', '#robotics', '#architecture', '#multimodal', '#video'], 'emoji': '🤖', 'ru': {'title': 'Мировая модель с тактильным зрением для ловкой робототехнической манипуляции', 'desc': 'Авторы представляют N_0-TWAM, первую крупномасштабную мировую модель действия, обученную на тактильных данных для манипуляции с контактом. Модель предсказывает как будущее видео, так и будущие сенсорные контакты, используя унифицированное силовое представление NeoForce для физически обоснованного кондиционирования. Архитектура асимметричной смеси трансформеров обеспечивает эффективное предсказание видео и тактильных сигналов в реальном времени. Оценки на реальных и симулированных задачах манипуляции подтверждают, что масштабирование данных значительно улучшает точность предсказания касаний и действий робота.'}, 'en': {'title': 'N_0-TWAM: Revolutionizing Tactile Manipulation with Predictive Power', 'desc': 'The paper introduces N_0-TWAM, a novel tactile-native world-action model designed for tasks that involve contact-rich manipulation. It is the first of its kind to be trained on a large scale, utilizing visuo-tactile joint training across numerous demonstrations and tasks. The model employs a unique force-based tactile representation called NeoForce to enhance action generation based on physical contact signals. Additionally, it incorporates tactile contact events to improve the execution of long-horizon and multi-stage manipulations, demonstrating significant capabilities in both real and simulated environments.'}, 'zh': {'title': '触觉驱动的未来预测模型', 'desc': '本文介绍了一种名为N_0-TWAM的触觉原生世界动作模型，旨在预测未来的视觉和接触信息。该模型是首个在大规模数据上训练的触觉世界动作模型，展现了在接触丰富任务上的强大能力。通过在六种不同的实现和450个任务上进行视觉-触觉联合训练，N_0-TWAM能够生成基于物理的接触信号，从而指导动作生成。我们还引入了触觉接触事件来改善长时间和多阶段的操作，使得模型在实时执行中更加高效。'}}}, {'id': 'https://huggingface.co/papers/2607.29679', 'title': 'Scaling Properties of Text Conditioning in Visual Generation', 'url': 'https://huggingface.co/papers/2607.29679', 'abstract': 'Abstract  We study empirical scaling properties for text conditioning in visual generation. Such properties have rarely been measured because diffusion loss does not scale with the number of tokens in natural-language prompts. Surprisingly, we find that the converged diffusion loss scales with the amount of structured language in the prompt. To quantify structured language, we adapt two complementary measures: a white-box likelihood metric (GPG) and a black-box attribute metric (ED). Across controlled training runs, the converged diffusion loss decreases approximately linearly with GPG and follows a power law with ED. Guided by these scaling properties, we improve diffusability by constructing structured prompts with semantic and geometric annotations derived from images, and improve promptability by training a prompter through supervised fine-tuning, cold-start, and verifier-gated on-policy distillation. The resulting system outperforms all evaluated open-weight models on nearly every compositional, reasoning, and world-knowledge benchmark, while matching or surpassing the strongest closed-weight models on most evaluations.', 'score': 23, 'issue_id': 2828, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '61202b92b5171793', 'authors': ['Zilong Chen', 'Chaorui Deng', 'Kunchang Li', 'Hongyi Yuan', 'Haoqi Fan'], 'affiliations': ['ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2607.29679.jpg', 'data': {'categories': ['#cv', '#benchmark', '#diffusion', '#reasoning', '#optimization', '#multimodal', '#training'], 'emoji': '🖼️', 'ru': {'title': 'Структурированный язык — ключ к совершенной генерации изображений', 'desc': 'Исследование изучает, как качество текстовых описаний влияет на результаты генерации изображений с помощью диффузионных моделей. Авторы обнаружили, что потери диффузии уменьшаются линейно и по степенному закону в зависимости от структурированности естественного языка в промптах, которую они измеряют двумя метриками. На основе этих закономерностей они улучшили качество генерации путём создания более структурированных промптов с семантическими и геометрическими аннотациями, а также обучили специальную модель для автоматического создания оптимальных описаний. Полученная система превосходит открытые модели-конкуренты на бенчмарках композиции, логических рассуждений и знания об окружающем мире.'}, 'en': {'title': 'Enhancing Visual Generation with Structured Language Prompts', 'desc': 'This paper investigates how the structure of language in prompts affects the performance of visual generation models. It reveals that the diffusion loss, which is a measure of how well the model generates images from text, improves when prompts contain more structured language. The authors introduce two metrics to measure this structure: a likelihood metric and an attribute metric. By enhancing the prompts with semantic and geometric information and fine-tuning the model, they achieve superior results compared to existing models on various benchmarks.'}, 'zh': {'title': '提升视觉生成的文本条件能力', 'desc': '本文研究了文本条件在视觉生成中的经验缩放特性。我们发现，收敛的扩散损失与提示中的结构化语言量成正比。为此，我们采用了两种互补的度量方法：白盒似然度量（GPG）和黑盒属性度量（ED）。通过构建带有语义和几何注释的结构化提示，并通过监督微调等方法训练提示器，我们的系统在多个基准测试中超越了所有评估的开放权重模型。'}}}, {'id': 'https://huggingface.co/papers/2607.29209', 'title': 'SAF-OPD: Stable Advantage Fusion for On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.29209', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) broadcasts a single response-level reward to every token, while on-policy distillation (OPD) scores each token against a stronger teacher for a dense advantage but caps performance at teacher quality and discourages exploration beyond it. Their complementarity makes combining RLVR and OPD promising, but we find that fusing the two advantages with a fixed coefficient triggers entropy collapse from two miscalibrations: a magnitude mismatch, where token-level OPD advantages can spike far beyond the bounded RLVR advantage and erase its signal, and a temporal mismatch, where sustained full-strength OPD keeps pulling the student toward the teacher and limits exploration needed to surpass it. We propose SAF, a Stable Advantage Fusion framework that resolves both issues via a lightweight, four-stage pipeline applied only to the OPD advantage: a sparsify-then-compress mechanism for magnitude control paired with a warm-up-then-anneal mechanism for temporal control, with each stage independently switchable and adding negligible overhead. Instantiating RLVR with GRPO, we evaluate SAF across seven mathematical reasoning and code generation benchmarks with Qwen3-1.7B/4B/8B: SAF avoids entropy collapse and consistently outperforms fixed-coefficient GRPO+OPD fusion, improving the aggregate score by 0.51-2.70% across all six model-domain settings while achieving more stable training.', 'score': 23, 'issue_id': 2831, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'f3687dc8a5e50179', 'authors': ['Yifan Ding', 'Xincheng Wei', 'Yoshua Y. Li', 'Ziheng Li', 'Yuquan Lu', 'Siyu Zhang', 'Dongsheng Ma', 'Rongxiang Weng', 'Xunliang Cai', 'Yun Chen'], 'affiliations': ['Meituan, LongCat Team', 'Peking University', 'Shanghai University of Finance and Economics', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2607.29209.jpg', 'data': {'categories': ['#small_models', '#plp', '#math', '#reasoning', '#rl', '#training', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Стабильное слияние преимуществ для безопасной комбинации методов обучения с подкреплением', 'desc': 'В статье предложен метод Stable Advantage Fusion (SAF) для комбинирования двух подходов обучения с подкреплением: RLVR, который дает единую награду на уровне ответа, и OPD, который обеспечивает плотные преимущества на уровне токенов через сравнение с более сильной моделью-учителем. Авторы выявили две проблемы при наивном объединении этих методов: несоответствие масштабов, когда преимущества OPD затмевают сигнал RLVR, и временное рассинхронизирование, когда постоянное воздействие OPD препятствует исследованию за пределами качества учителя. Предложенный SAF-фреймворк решает обе проблемы через четырёхэтапный конвейер контроля преимуществ OPD: механизм разреживания-сжатия для управления масштабом и механизм разогрева-затухания для временного контроля. Экспериментальная оценка на семи бенчмарках математического рассуждения и генерации кода показала, что SAF избегает коллапса энтропии и улучшает совокупный результат на 0.51-2.70% по сравнению с базовым методом GRPO+OPD.'}, 'en': {'title': 'Enhancing Reinforcement Learning with Stable Advantage Fusion', 'desc': "This paper introduces a new method called Stable Advantage Fusion (SAF) that combines two reinforcement learning techniques: Reinforcement Learning with Verifiable Rewards (RLVR) and On-Policy Distillation (OPD). The authors identify issues with directly merging these methods, such as entropy collapse caused by mismatches in advantage magnitudes and exploration limits. SAF addresses these problems through a four-stage process that controls the advantages' magnitude and timing, allowing for better exploration and performance. The results show that SAF significantly improves training stability and performance on various benchmarks compared to traditional methods."}, 'zh': {'title': '稳定优势融合：提升强化学习的探索与性能', 'desc': '这篇论文提出了一种新的强化学习框架，称为稳定优势融合（SAF），旨在结合可验证奖励的强化学习（RLVR）和在线策略蒸馏（OPD）的优点。研究发现，简单地将这两种方法结合会导致熵崩溃，主要是由于优势的幅度和时间不匹配。SAF通过四个阶段的轻量级管道解决了这些问题，确保了优势的稳定性和探索能力。实验结果表明，SAF在多个基准测试中表现优于传统的固定系数融合方法，提升了模型的整体性能和训练稳定性。'}}}, {'id': 'https://huggingface.co/papers/2607.28415', 'title': 'QQWorld: Quantile-Quantile Matching for World Model Regularization', 'url': 'https://huggingface.co/papers/2607.28415', 'abstract': 'Abstract  Latent world models enable efficient planning by predicting future states in a compact representation space, but their performance depends critically on the quality of the learned latent distribution. LeWorldModel (LeWM) regularizes its latents toward an isotropic Gaussian using the Epps-Pulley (EP) objective. We show that the corrective gradients of EP rapidly vanish for isolated tail samples, leaving heavy-tailed deviations insufficiently controlled. To address this limitation, we propose QQWorld, which replaces EP with a quantile-quantile matching objective that directly aligns projected latent samples with rank-matched Gaussian quantiles, thereby maintaining effective corrective gradients in the tails. We further develop cross-batch QQ, which enlarges the effective ranking pool using detached samples from previous batches, and characterize its bias-variance trade-off. Across four control environments, QQWorld effectively improves the average planning success rate of LeWM, while consistently yielding better Gaussian alignment and thinner latent tails.', 'score': 23, 'issue_id': 2828, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'd2f3e924607b731d', 'authors': ['Zhoushun Yu', 'Xiaoyu Hu', 'Xiangyu Xu'], 'affiliations': ['Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28415.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Квантиль-квантильное выравнивание латентных моделей мира для лучшего контроля хвостов распределения', 'desc': 'В статье рассматривается проблема обучения латентных моделей мира, которые используются для эффективного планирования путём предсказания будущих состояний в пространстве низкой размерности. Авторы показывают, что существующий метод регуляризации (Epps-Pulley) неэффективно контролирует выбросы в хвостах распределения, так как корректирующие градиенты исчезают на изолированных образцах. Они предлагают QQWorld — новый подход, основанный на квантиль-квантильном выравнивании, который поддерживает эффективные градиенты в хвостах распределения и улучшает его гауссовость. Дополнительно разработан метод cross-batch QQ, расширяющий пул для ранжирования с помощью выборок из предыдущих батчей, что улучшает качество планирования в задачах управления.'}, 'en': {'title': 'Enhancing Latent Models with QQWorld for Better Planning', 'desc': 'This paper discusses the importance of latent world models in machine learning, which help in planning by predicting future states in a simplified way. The authors introduce QQWorld, a new method that improves the learning of latent distributions by using a quantile-quantile matching objective instead of the traditional Epps-Pulley objective. This new approach ensures that the model effectively manages the tails of the distribution, which are often problematic in standard methods. The results show that QQWorld enhances planning success rates and achieves better alignment with Gaussian distributions across various environments.'}, 'zh': {'title': '提升潜在模型规划效率的QQWorld', 'desc': '潜在世界模型通过在紧凑的表示空间中预测未来状态来实现高效规划，但其性能依赖于学习到的潜在分布的质量。LeWorldModel (LeWM) 使用 Epps-Pulley (EP) 目标对潜在变量进行正则化，目标是使其接近各向同性高斯分布。我们发现，EP 的修正梯度对于孤立的尾部样本迅速消失，导致重尾偏差控制不足。为了解决这个问题，我们提出了 QQWorld，它用分位数-分位数匹配目标替代 EP，直接将投影的潜在样本与排名匹配的高斯分位数对齐，从而在尾部保持有效的修正梯度。'}}}, {'id': 'https://huggingface.co/papers/2607.26611', 'title': 'Fewer Clarifications, Better Code: Benchmarking Cross-Session Personalized Ambiguity Adaptation in Coding Assistants', 'url': 'https://huggingface.co/papers/2607.26611', 'abstract': "Abstract  AI-assisted coding increasingly translates informal user intent into executable software, yet coding requests often contain ambiguities that recur in user-specific ways across tasks and sessions. Existing disambiguation methods typically address each ambiguous request in isolation within the current coding session, often through eliciting additional clarification. However, whether resolved session history from the same user can serve as memory for resolving recurring personalized ambiguity in a newly opened session remains underexplored. We formulate personalized ambiguity adaptation as a new task: given a user's previously resolved coding sessions and a new ambiguous request, an assistant should identify the recurring ambiguity pattern, produce the intended executable solution, and minimize clarification. To benchmark this task, we introduce CAPA, which characterizes personalized coding ambiguity through six mechanisms and injects these mechanisms into unambiguous executable tasks using a controlled three-stage generation pipeline. CAPA contains 600 coding sessions across 60 balanced user--ambiguity cells, including 300 held-out evaluation sessions. We evaluate 12 recent LLMs under no-history and same-user-history conditions using executable success, first-turn success, and turns-to-completion. Our analyses examine task difficulty, user identity, and memory-based history use, and we further propose same-user history gating as a lightweight inference-time method. CAPA provides a foundation for developing long-term coding assistants that better align generated code with user intent while reducing repeated clarification.", 'score': 19, 'issue_id': 2830, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '524ca390e66f03a4', 'authors': ['Zijian Xu', 'Wenshuo Zhang', 'Zisen Qin', 'Rui Sheng', 'Yushi Sun', 'Huamin Qu', 'Chuhan Shi'], 'affiliations': ['Southeast University', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2607.26611.jpg', 'data': {'categories': ['#training', '#plp', '#benchmark', '#dataset'], 'emoji': '💾', 'ru': {'title': 'Память пользователя как ключ к персонализированной генерации кода', 'desc': 'В статье исследуется проблема персонализированной адаптации к неоднозначности в задачах AI-ассистированного программирования. Авторы предлагают новый подход, при котором система анализирует историю разрешённых сеансов пользователя для определения повторяющихся паттернов неоднозначности и генерации правильного кода без дополнительных уточнений. Для оценки метода разработан датасет CAPA с 600 сеансами кодирования, содержащими различные типы неоднозначности, протестированный на 12 современных LLM моделях. Исследование показывает, что использование истории того же пользователя с методом gating может значительно улучшить качество автодополнения кода и снизить количество уточняющих вопросов.'}, 'en': {'title': 'Enhancing AI Coding Assistants with User Memory for Clarity', 'desc': "This paper introduces a new approach to handling ambiguous coding requests in AI-assisted coding by leveraging a user's past coding sessions. It proposes a task called personalized ambiguity adaptation, which aims to recognize recurring patterns of ambiguity specific to individual users. The authors present a benchmark called CAPA, which includes a dataset of coding sessions designed to evaluate how well AI can resolve ambiguities using historical context. The study evaluates various large language models (LLMs) to determine their effectiveness in generating executable code while minimizing the need for user clarification."}, 'zh': {'title': '个性化模糊适应：提升AI编码助手的智能', 'desc': '这篇论文探讨了AI辅助编码如何将用户的非正式意图转化为可执行的软件。研究指出，用户的编码请求常常存在模糊性，而现有的消歧义方法通常只在当前会话中处理这些模糊请求。作者提出了一种新的任务，即个性化模糊适应，旨在利用用户之前解决的编码会话来识别重复的模糊模式，并生成预期的可执行解决方案。为此，论文引入了CAPA基准，评估了不同条件下的12个大型语言模型在处理编码模糊性方面的表现。'}}}, {'id': 'https://huggingface.co/papers/2607.18082', 'title': 'Enhancing Rubric-based RL via Self-Distillation', 'url': 'https://huggingface.co/papers/2607.18082', 'abstract': 'Abstract  Rubric-based RL has recently shown promise in improving LLMs on open-ended tasks. A widely recognized limitation of rubric-based RL is limited exploration: criteria that no rollout manages to satisfy (Unexplored Criteria, UC) receive no optimization signal. Recent methods address this by incorporating rubric information as external guidance during rollout, yet they introduce a train-inference mismatch: the policy is optimized on rollouts produced under external guidance while this guidance is absent at inference time, causing error accumulation through autoregressive decoding. Moreover, these exploration-focused approaches overlook a fundamentally different failure mode that we term Suppressed Criteria (SC) -- criteria that are satisfied by some rollouts yet whose learning signals are lost during optimization because scalar reward aggregation assigns them non-positive aggregate advantages. Our analysis reveals that SC are remarkably prevalent: over 57% of samples exhibit this failure mode throughout training, with an average of 1.8 SC per sample. To simultaneously address both UC and SC without introducing training-inference mismatch, we propose Criterion-Distilled Policy Optimization (CriPO), which enhances rubric-based RL via on-policy self-distillation. For UC, CriPO constructs a criterion-injection self-teacher and computes a localized forward-KL loss to inject missing behaviors into the policy. For SC, CriPO employs a counterfactual self-teacher to locate criterion-relevant tokens in negative-advantage rollouts and flips their token-level advantages to positive values, preserving useful patterns that would otherwise be suppressed. Experiments on medicine and science benchmarks demonstrate that CriPO consistently outperforms rubric-based RL, achieving stronger final performance with approximately 2times fewer optimization steps.', 'score': 15, 'issue_id': 2829, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '9487b27d0e0a19d0', 'authors': ['Mingxuan Xia', 'Yuhang Yang', 'Chao Ye', 'Shuai Zhu', 'Shenzhi Yang', 'Guangcheng Zhu', 'Yuhang Zhang', 'Cheng Peng', 'Haobo Wang', 'Siqing Wang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.18082.jpg', 'data': {'categories': ['#optimization', '#training', '#rlhf', '#rl', '#reasoning', '#alignment'], 'emoji': '🎯', 'ru': {'title': 'Самодистилляция для восстановления потерянных критериев в обучении с подкреплением', 'desc': 'В этой работе предложен метод Criterion-Distilled Policy Optimization (CriPO) для улучшения обучения с подкреплением на основе рубрик при настройке больших языковых моделей. Авторы выявили две основные проблемы: неисследованные критерии (UC), которые не получают сигнал оптимизации, и подавленные критерии (SC), полезные паттерны которых теряются при агрегации скалярной награды. CriPO использует самодистилляцию в процессе обучения, внедряя недостающие поведения через локализованную KL-дивергенцию и восстанавливая полезные закономерности с помощью контрфактической учительской модели. Эксперименты показывают, что метод достигает лучшей производительности при меньшем количестве шагов оптимизации по сравнению с базовыми подходами.'}, 'en': {'title': 'Enhancing RL with Criterion-Distilled Policy Optimization', 'desc': 'This paper discusses a new method called Criterion-Distilled Policy Optimization (CriPO) to improve reinforcement learning (RL) for large language models (LLMs) on open-ended tasks. It identifies two main issues: Unexplored Criteria (UC), which are criteria that the model fails to explore, and Suppressed Criteria (SC), which are criteria that are ignored during optimization despite being satisfied. CriPO addresses these issues by using on-policy self-distillation to enhance the learning process, allowing the model to better incorporate missing behaviors and preserve useful patterns. The results show that CriPO significantly outperforms traditional rubric-based RL methods, achieving better performance with fewer optimization steps.'}, 'zh': {'title': '提升基于标准的强化学习效率的新方法', 'desc': '本论文提出了一种新的方法，称为标准蒸馏策略优化（CriPO），旨在改善基于标准的强化学习（RL）在开放任务中的表现。传统的基于标准的RL存在探索不足的问题，导致一些标准未被优化。CriPO通过在策略优化中引入自我蒸馏技术，解决了未探索标准和被抑制标准的问题，从而提高了学习效率。实验结果表明，CriPO在医学和科学基准测试中表现优于传统方法，优化步骤减少了约两倍。'}}}, {'id': 'https://huggingface.co/papers/2607.29677', 'title': 'ExtractBench: A Benchmark for Schema-Guided Enterprise Document Extraction', 'url': 'https://huggingface.co/papers/2607.29677', 'abstract': 'Abstract  Enterprise workflows increasingly rely on agents for schema-guided extraction: given a document and a user-defined schema, the agent faithfully follows the schema to produce the correct output with source evidence as grounding metadata. We present ExtractBench, a benchmark for schema-guided extraction and, to our knowledge, the first to score value accuracy, record completeness at scale, grounding, and measured cost together. The evaluation system contains 4,869 pages across 370 enterprise documents, 8 business domains, and 67 document types, with clear tags differentiating their challenge scenarios. The scalable schema and ground-truth curation pipeline combines independent-system agreement for real documents, known values for synthetic lists, and human verification for forms. We report order-insensitive value F1 for value accuracy, plus two grounding metrics for source traceability: word- and page-level F1. Commercial VLMs perform well on short documents but often truncate record lists on long ones, while coding agents retain higher accuracy at much higher cost. LlamaExtract Agentic Plus ranks first on all three metrics, with accuracy comparable to coding agents at a fraction of the cost. Dataset and evaluation code are available on https://huggingface.co/datasets/llamaindex/ExtractBench{HuggingFace} and https://github.com/run-llama/ExtractBench{GitHub}.', 'score': 13, 'issue_id': 2829, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'ce1c94ff6556a58a', 'authors': ['Boyang Zhang', 'Adrian Lyjak', 'Eli Stewart', 'Zhaoqi Li', 'Simon Suo'], 'affiliations': ['RunLlama'], 'pdf_title_img': 'assets/pdf/title_img/2607.29677.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark', '#multimodal'], 'emoji': '📄', 'ru': {'title': 'Эффективное извлечение данных: точность агентов при минимальной стоимости', 'desc': 'В статье представлен ExtractBench — новый бенчмарк для оценки агентов, которые извлекают данные из документов по заданной схеме. Набор данных включает почти 5000 страниц корпоративных документов из разных отраслей и содержит метрики для оценки точности значений, полноты записей, качества привязки к источнику и стоимости обработки. Авторы сравнили несколько подходов: коммерческие визуально-языковые модели хорошо работают на коротких документах но теряют точность на длинных, в то время как кодирующие агенты сохраняют высокую точность за счёт больших затрат. LlamaExtract Agentic Plus достигает лучших результатов по всем метрикам с оптимальным соотношением точности и стоимости.'}, 'en': {'title': 'ExtractBench: Benchmarking Schema-Guided Extraction for Efficiency and Accuracy', 'desc': 'This paper introduces ExtractBench, a benchmark designed for evaluating schema-guided extraction in enterprise workflows. It measures various aspects such as value accuracy, record completeness, grounding, and cost efficiency across a diverse set of documents. The evaluation includes a large dataset of 4,869 pages from 370 documents, covering multiple business domains and document types. The results show that while commercial VLMs excel with short documents, LlamaExtract Agentic Plus outperforms others in accuracy and cost-effectiveness, especially on longer documents.'}, 'zh': {'title': '模式引导提取的基准测试新标准', 'desc': '本论文介绍了ExtractBench，这是一个用于模式引导提取的基准测试。它评估了价值准确性、记录完整性、基础数据和成本等多个指标。该基准包含来自370个企业文档的4,869页数据，涵盖8个业务领域和67种文档类型。研究表明，LlamaExtract Agentic Plus在所有指标上表现最佳，其准确性与编码代理相当，但成本却低得多。'}}}, {'id': 'https://huggingface.co/papers/2607.29025', 'title': 'Evaluation-Verification Reward for Consistent Multi-Reference Image Editing', 'url': 'https://huggingface.co/papers/2607.29025', 'abstract': 'Abstract  While recent image editing models have made rapid progress, multi-reference editing remains challenging, particularly in maintaining visual consistency across references and ensuring overall visual harmony. Reinforcement learning has proven highly effective for text-to-image generation and single-image editing, but its extension to multi-reference editing is hindered by the absence of suitable reward models that capture multi-image relational constraints. Moreover, naively using multimodal large language models(MLLMs) as zero-shot evaluators faces a key tension between hallucination-prone long-form reasoning and the limited deductive power of short-form judgments. We address these issues with a Multi-dimensional Evaluation-Verification Reward(EVR). EVR decomposes evaluation into distinct visual criteria; for each criterion, an MLLM Evaluator generates multiple candidate hypotheses, and a Verifier grounds each claim in concrete visual evidence to accept or reject it, producing reliable and fine-grained reward signals. Together with a scalable data pipeline, our method enables RL fine-tuning of off-the-shelf editors without architectural changes. Extensive experiments show substantial gains over the base Qwen-Image-Edit, improving consistency and harmony to match or surpass NanoBanana.', 'score': 11, 'issue_id': 2829, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '0277c10fc6485485', 'authors': ['Yingmao Miao', 'Pengfei Zhang', 'Xiaochen Lv', 'Meng Yu', 'Lei Sun', 'Xiangxiang Chu', 'Chao Shen', 'Chenhao Lin'], 'affiliations': ['Amap, Alibaba', 'Shanghai Jiao Tong University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29025.jpg', 'data': {'categories': ['#multimodal', '#rl', '#training', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Надёжные награды для редактирования множественных изображений через проверку визуальных доказательств', 'desc': 'В статье предложен новый метод для редактирования изображений с использованием нескольких референсов одновременно. Основная проблема заключалась в отсутствии подходящих функций награды (reward models), которые могут оценивать согласованность между несколькими изображениями. Авторы разработали Multi-dimensional Evaluation-Verification Reward (EVR), который разбивает оценку на отдельные визуальные критерии и использует мультимодальные языковые модели для проверки каждого утверждения на основе конкретных визуальных доказательств. Метод позволяет обучать существующие модели редактирования с помощью обучения с подкреплением без изменения их архитектуры, достигая значительного улучшения в согласованности и гармонии изображений.'}, 'en': {'title': 'Enhancing Multi-Reference Image Editing with EVR', 'desc': 'This paper addresses the challenges of multi-reference image editing, focusing on maintaining visual consistency and harmony across multiple images. It introduces a novel Multi-dimensional Evaluation-Verification Reward (EVR) system that breaks down evaluation into specific visual criteria, allowing for more accurate assessments. By utilizing a multimodal large language model (MLLM) as an evaluator and a verifier to ground claims in visual evidence, the method produces reliable reward signals for reinforcement learning. The proposed approach significantly enhances the performance of existing image editing models, achieving better consistency and visual quality compared to previous methods.'}, 'zh': {'title': '提升多参考图像编辑的一致性与和谐性', 'desc': '本文探讨了多参考图像编辑中的挑战，尤其是在保持视觉一致性和整体视觉和谐方面。尽管强化学习在文本到图像生成和单图像编辑中表现出色，但在多参考编辑中，由于缺乏合适的奖励模型，导致其扩展受到限制。我们提出了一种多维评估-验证奖励（EVR）方法，将评估分解为不同的视觉标准，并通过多模态大语言模型生成候选假设。实验结果表明，我们的方法在一致性和和谐性方面显著优于基线模型，能够有效提升图像编辑的质量。'}}}, {'id': 'https://huggingface.co/papers/2607.27924', 'title': 'ODEWorld: A Continuous Predictive Architecture via Physical-Time Flow', 'url': 'https://huggingface.co/papers/2607.27924', 'abstract': 'Abstract  In the physical world we inhabit, space and time are fundamentally continuous. However, existing machine learning paradigms for world modeling are largely confined to discrete-time prediction, thereby exhibiting significant inefficiency in capturing the dynamics of physical world. We introduce Physical-Time Flow (PT-Flow), a novel approach that learns a continuous latent velocity field operating in physical time. Crucially, the underlying dynamics of sequential data are parameterized by an ordinary differential equation (ODE) embedded in a well-structured representation space. Under this paradigm, the prediction of future can be recast as temporal integration via an ODE solver in the compressed latent space. Building upon PT-Flow, we construct ODEWorld, a continuous-time latent world model that is both efficient and versatile. By extracting time-variant features and enforcing ODE properties on both the dynamical representation space and the latent velocity field, ODEWorld effectively addresses the long-standing representation collapse issue in latent world model literature. This also enables high-quality image reconstruction even after long-horizon prediction. Moreover, its continuous nature allows for arbitrary temporal resolution and even backward prediction, which is impossible for most discrete-time models. Lastly, ODEWorld can provide rich planning-oriented information to facilitate downstream policy learning. Comprehensive experiments demonstrate that ODEWorld successfully reconciles planning-conducive dynamics abstraction with visual realism, excelling in both video generation and robotic control. https://dstate.github.io/odeworld_website/{Project Website}.', 'score': 7, 'issue_id': 2830, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6c41d763a55c3d17', 'authors': ['Dongxiu Liu', 'Haoyi Niu', 'Peng Cheng', 'Yuan Gao', 'Xirui Kang', 'Sangli Teng', 'Koushil Sreenath', 'Xianyuan Zhan'], 'affiliations': ['Berkeley Artificial Intelligence Research (BAIR), University of California, Berkeley, CA, USA', 'Institute for AI Industry Research (AIR), Tsinghua University, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27924.jpg', 'data': {'categories': ['#robotics', '#video', '#architecture'], 'emoji': '⏰', 'ru': {'title': 'Непрерывное моделирование мира через дифференциальные уравнения', 'desc': 'Авторы предлагают Physical-Time Flow (PT-Flow) — подход для моделирования мира, который использует непрерывное поле скоростей в физическом времени вместо дискретных временных шагов. Основная идея заключается в параметризации динамики последовательных данных с помощью обыкновенного дифференциального уравнения (ODE), встроенного в хорошо структурированное пространство представлений. На основе PT-Flow разработана ODEWorld — модель мира непрерывного времени, которая решает проблему коллапса представления и позволяет выполнять предсказание на длительные горизонты с высокой визуальной четкостью. Модель поддерживает произвольное временное разрешение, предсказание в обратном направлении времени и демонстрирует превосходные результаты как в генерации видео, так и в управлении робототехническими системами.'}, 'en': {'title': 'Revolutionizing World Modeling with Continuous Time Dynamics', 'desc': "This paper presents Physical-Time Flow (PT-Flow), a new method for modeling the dynamics of the physical world using continuous time instead of discrete time. It utilizes an ordinary differential equation (ODE) to parameterize the underlying dynamics of sequential data, allowing for more efficient predictions through temporal integration in a compressed latent space. The authors introduce ODEWorld, a continuous-time latent world model that overcomes representation collapse and enables high-quality image reconstruction over long time horizons. ODEWorld's continuous nature allows for flexible temporal resolution and supports backward predictions, making it suitable for planning and policy learning in various applications."}, 'zh': {'title': '连续时间建模，提升物理世界理解', 'desc': '在我们所处的物理世界中，空间和时间是连续的。然而，现有的机器学习模型主要依赖于离散时间预测，无法有效捕捉物理世界的动态特性。我们提出了一种新方法，称为物理时间流（PT-Flow），它学习在物理时间中操作的连续潜在速度场。基于PT-Flow，我们构建了ODEWorld，一个高效且多功能的连续时间潜在世界模型，能够解决潜在世界模型文献中长期存在的表示崩溃问题，并支持高质量的图像重建和灵活的时间预测。'}}}, {'id': 'https://huggingface.co/papers/2607.28229', 'title': 'EMBL AI Librarian: Life-Sciences Knowledge Layer for AI Agents', 'url': 'https://huggingface.co/papers/2607.28229', 'abstract': 'Abstract  The web is increasingly accessed by AI agents rather than humans. Every agent needs knowledge, especially in the life-sciences, where agentic pipelines are growing fast. Access to the literature is a crucial part of that need, and resources such as Europe PMC, with over 40M indexed records, are widely used to meet it. Yet these resources were not built for AI agents: they take keywords and complex syntax and return whole papers, so every agent must learn the syntax, issue several searches, and read full papers to find the evidence it needs. We introduce EMBL AI Librarian, a knowledge layer that upgrades the Europe PMC interface for AI agents: an agent asks in natural language and receives evidence that answers it. A single LLM orchestrates the whole knowledge retrieval process: it plans complementary subqueries executed by the live Europe PMC search engine, then reads the selected papers and locates the relevant evidence. We evaluate Librarian across four benchmarks: literature synthesis, claim verification, open-domain question answering, and downstream biology tasks such as protocol questions and sequence manipulation. On ScholarQABench, Librarian improves Citation F1 by more than 16 points over strong recently published baselines. Used as the retrieval layer of an existing claim-verification pipeline, it increases agreement with expert consensus; and on the open-form LitQA2 benchmark, a GPT-5.4 agent scores about 8 points higher when grounded in Librarian than with web search. Overall, our results show that equipping life-science agents with the Librarian knowledge layer improves performance across a range of tasks. We release our code publicly at https://github.com/petroni-lab/librarian', 'score': 4, 'issue_id': 2832, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '46f5fa54e5e415ff', 'authors': ['Luigi Sigillo', 'Matteo Silvestri', 'Francesco Tabaro', 'Rajat Bhatnagar', 'Syed Irtaza Mubashar', 'Matt Jeffryes', 'Daljit Nijjer', 'Vittorio Perera', 'Ola Spjuth', 'Julio Saez-Rodriguez', 'Melissa Harrison', 'Fabio Petroni'], 'affiliations': ['Department of Pharmaceutical Biosciences, Uppsala University, Uppsala, Sweden', 'EMBL Rome, European Molecular Biology Laboratory, Monterotondo, Italy', 'European Bioinformatics Institute (EMBL-EBI), European Molecular Biology Laboratory, Hinxton, UK', 'Institute for Computational Biomedicine, Heidelberg University, Germany', 'Sapienza University of Rome, Italy', 'Science for Life Laboratory (SciLifeLab), Uppsala University, Uppsala, Sweden'], 'pdf_title_img': 'assets/pdf/title_img/2607.28229.jpg', 'data': {'categories': ['#science', '#agents', '#rag', '#benchmark', '#open_source'], 'emoji': '📚', 'ru': {'title': 'Естественный язык вместо синтаксиса: LLM-оркестратор для интеллектуального поиска научной литературы', 'desc': 'Статья представляет EMBL AI Librarian — систему знаний, которая адаптирует интерфейс базы данных Europe PMC для работы с AI агентами. Вместо требования изучать сложный синтаксис поиска и читать полные статьи, агенты теперь могут задавать вопросы на естественном языке и получать релевантные научные доказательства. Единая большая языковая модель (LLM) управляет всем процессом поиска: она планирует подзапросы, выполняемые поисковым движком Europe PMC, а затем читает отобранные статьи и извлекает нужные доказательства. Экспериментальная оценка на четырех задачах показала значительное улучшение производительности, особенно в синтезе литературы и проверке фактов, что подтверждает эффективность такого подхода для научных агентов в области биологии.'}, 'en': {'title': 'Empowering AI Agents with Natural Language Literature Access', 'desc': 'The paper presents the EMBL AI Librarian, a new interface designed to enhance how AI agents access life-science literature. Traditional resources like Europe PMC require complex keyword searches and full paper readings, which are inefficient for AI. The Librarian allows agents to ask questions in natural language and retrieves relevant evidence through a single large language model (LLM) that orchestrates subqueries and reads selected papers. Evaluation shows that this system significantly improves performance in tasks like literature synthesis and claim verification, demonstrating its effectiveness in supporting AI-driven research.'}, 'zh': {'title': '为AI代理提供知识支持，提升生命科学研究效率', 'desc': '随着人工智能代理越来越多地访问网络，特别是在生命科学领域，代理需要获取知识以支持其工作。EMBL AI Librarian是一个知识层，它为AI代理升级了Europe PMC接口，使其能够用自然语言提问并获得相关证据。通过一个大型语言模型（LLM），Librarian能够规划子查询并从Europe PMC搜索引擎中提取信息，从而提高了文献综合、声明验证和开放领域问答等任务的性能。我们的评估结果表明，使用Librarian的代理在多个基准测试中表现优于传统方法，显著提升了任务的准确性和效率。'}}}, {'id': 'https://huggingface.co/papers/2607.26991', 'title': 'RL^2-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2607.26991', 'abstract': 'Abstract  Despite the impressive visuomotor capabilities enabled by Vision-Language-Action (VLA) models, their performance often degrades on challenging and out-of-domain tasks. Recent test-time steering and scaling methods improve performance without extensive data collection and retraining, but action samples often remain concentrated around similar behaviors and therefore inherit correlated failure modes. Moreover, existing methods apply the same intervention strategy at every timestep, regardless of whether the base policy is already likely to succeed. To address these limitations, we introduce RL^2, an adaptive inference-time steering framework that leverages Reinforcement Learning on VLA Latents. First, we train a lightweight offline RL policy conditioned on expressive latents extracted from the VLA action expert and compose its flow velocity with that of the frozen VLA during inference. This compositional steering strategy combines the behavioral priors of large-scale imitation learning with the action diversity induced by offline RL beyond dominant demonstration modes. We further discover that inference-time steering follows fundamentally different scaling laws under success and failure states, revealing that action diversity is most beneficial when the base VLA is likely to fail, but can unnecessarily perturb already-accurate actions when success is likely. Building on this insight, RL^2 activates compositional steering only when failure is predicted. Across the SIMPLER and PolaRiS benchmarks, RL^2 improves success rates by up to +17.3% in out-of-domain settings, while ablations and scaling studies demonstrate the importance of latent representations and RL training. Finally, real-world experiments demonstrate that these gains transfer beyond simulation, establishing RL^2 as a practical and modular steering framework for VLA deployment.', 'score': 4, 'issue_id': 2831, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'badca197086b1de2', 'authors': ['Derek Ming Siang Tan', 'Shailesh Shailesh', 'Srikrishna Iyer', 'William Wei Jie Teo', 'Yuanliang Ju', 'Qiao Gu', 'Guillaume Sartoretti'], 'affiliations': ['National University of Singapore', 'Singapore Technologies Engineering', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2607.26991.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#inference', '#rl', '#robotics'], 'emoji': '🎯', 'ru': {'title': 'Умное управление действиями: усиление VLA через выборочное руководство на основе обучения с подкреплением', 'desc': 'В работе предлагается RL², адаптивный фреймворк для управления моделями Vision-Language-Action во время инференции, который использует обучение с подкреплением в латентном пространстве. Легковесная политика обучается офлайн и комбинируется с основной VLA моделью, объединяя предыдущее знание из имитационного обучения с разнообразием действий из RL. Авторы обнаружили, что воздействие на латенты следует применять выборочно: только когда модель склонна к ошибкам, чтобы избежать возмущения уже точных предсказаний. Метод улучшает точность на +17.3% на бенчмарках SIMPLER и PolaRiS в условиях распределения, а также подтверждается эффективность в реальных экспериментах.'}, 'en': {'title': 'Adaptive Steering for Enhanced VLA Performance', 'desc': "This paper presents RL^2, a new framework that enhances the performance of Vision-Language-Action (VLA) models during inference by using Reinforcement Learning (RL) on latent representations. Unlike previous methods that apply the same intervention strategy at all times, RL^2 adapts its steering based on the likelihood of success or failure of the base policy. By combining the strengths of imitation learning and offline RL, RL^2 increases action diversity, particularly when the model is likely to fail. The results show significant improvements in success rates on challenging tasks, demonstrating the framework's effectiveness in both simulated and real-world environments."}, 'zh': {'title': 'RL^2：提升VLA模型的自适应引导框架', 'desc': '本文提出了一种名为RL^2的自适应推理时间引导框架，旨在提高视觉-语言-动作（VLA）模型在复杂任务中的表现。RL^2利用强化学习在VLA潜在空间中进行训练，结合了大规模模仿学习的行为先验和离线强化学习带来的动作多样性。研究发现，在成功和失败状态下，推理时间引导遵循不同的缩放规律，因此在预测失败时激活组合引导可以显著提高成功率。通过在SIMPLER和PolaRiS基准测试中的实验，RL^2在域外设置中成功率提高了17.3%。'}}}, {'id': 'https://huggingface.co/papers/2607.28443', 'title': 'One Future, Every Robot: Label-Efficient Collective-State Prediction with Decentralized JEPA', 'url': 'https://huggingface.co/papers/2607.28443', 'abstract': 'Abstract  Can every robot in a swarm predict the same future collective state from only local observations and bandwidth-limited messages? We formulate this as decentralized shared-state prediction and introduce Collective-State JEPA (CS-JEPA), a recurrent joint-embedding predictive architecture whose output at every robot represents one common future token field. At deployment, each robot uses a 16-frame local history and one 64-float recurrent message per directed edge; there is no global pooling, target encoder, episode clock, or recorded future action. After pretraining without downstream collective labels, frozen representations are evaluated with ridge probes fitted on 6, 12, or 24 globally labeled episodes. Against raw-future reconstruction with the same receiver anchor and deployment capacity but 9,607 additional training-only parameters, a prospectively registered five-seed follow-up improves prediction-error and inter-robot-agreement label-budget AUC on in-distribution, ring, mutual-kNN, and unseen-size families up to 108 robots. Every effect favors CS-JEPA in 5/5 outer seeds. In a separate sealed eight-seed follow-up, matched action-conditioned predictors receive each candidate four-step plan before producing receiver-local predictive representations. CS-JEPA reduces branch-value MSE by 45.5% and improves within-context candidate-score Pearson correlation by 0.1291, with both effects favorable in 8/8 seeds, including at unseen N=32. These results support common-future JEPA targets as a label-efficient primitive for decentralized swarm prediction under topology and size shift, with additional evidence of planning-relevant value estimation.', 'score': 3, 'issue_id': 2830, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '0ba2bd4bca48c3ac', 'authors': ['Alan-Barsag Gazzaev', 'Alexey Gavrilov', 'Sergey Muravyov'], 'affiliations': ['ITMO University, Saint Petersburg, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2607.28443.jpg', 'data': {'categories': ['#training', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Децентрализованное предсказание коллективного будущего в рое роботов через локальные сообщения', 'desc': 'В работе предложен метод Collective-State JEPA для децентрализованного предсказания коллективного состояния в роботизированных системах. Каждый робот использует локальные наблюдения и ограниченный по пропускной способности обмен сообщениями для предсказания общего будущего состояния без глобальной агрегации данных. Модель обучается без меток целевого действия и использует joint-embedding predictive архитектуру с рекуррентной структурой. Результаты показывают, что CS-JEPA превосходит методы прямой реконструкции будущего по точности предсказания и согласованности между агентами, сохраняя эффективность при изменении топологии и размера роя до 108 роботов.'}, 'en': {'title': 'Decentralized Prediction for Swarm Robots with CS-JEPA', 'desc': 'This paper introduces a new method called Collective-State JEPA (CS-JEPA) for decentralized prediction in robot swarms. It allows each robot to predict a common future state based on local observations and limited communication. The architecture uses a recurrent joint-embedding approach, enabling robots to share and process information without needing global coordination. The results show that CS-JEPA significantly improves prediction accuracy and agreement among robots, making it effective for collective decision-making in varying swarm sizes and configurations.'}, 'zh': {'title': '集体状态预测的高效方法', 'desc': '本文探讨了在一个机器人群体中，如何通过局部观察和有限带宽的信息进行集体状态预测。我们提出了一种名为集体状态JEPA（CS-JEPA）的递归联合嵌入预测架构，使每个机器人能够预测一个共同的未来状态。通过预训练和无下游标签的评估，CS-JEPA在多个实验中表现出色，显著降低了预测误差并提高了机器人间的一致性。研究结果表明，CS-JEPA在去中心化的群体预测中是一种高效的标签利用方法，适应不同的拓扑和规模变化。'}}}, {'id': 'https://huggingface.co/papers/2607.26654', 'title': 'Constitutional Midtraining: Content Presence Drives Alignment Gains', 'url': 'https://huggingface.co/papers/2607.26654', 'abstract': "Abstract  Post-training alignment is often shallow, eroding under fine-tuning. Whether midtraining interventions, cleanly isolated from post-training, can produce durable alignment remains untested. We test this via constitutional midtraining: inserting principled, values-based content into midtraining against a replay-only control at 120B scale. Our 394M-token constitutional corpus, built from Anthropic's Constitution, uses a 2x2 factorial design (curriculum ordering x deliberative reasoning) to produce four constitutionally midtrained conditions plus a control, evaluated on self-generated and established benchmarks including alignment under pressure, value conflict resolution, blackmail, and emergent misalignment across three stages: post-midtraining, post-SFT, and post-benign fine-tuning. Constitutionally midtrained models outperform the control on alignment generalization and durability, notably on blackmail: SFT instills a blackmail propensity in all models, but constitutional midtraining blunts it, with the advantage surviving benign fine-tuning (-17.5pp). This durability does not extend to settings requiring active resistance to in-context pressure or conflict, where the advantage attenuates after SFT. The presence of constitutional content at midtraining also matters more than its structure, and constitutional midtraining incurs no cost, on average, on the capabilities we test (MMLU, ARC-Easy, piqa, GSM8K) at any stage. A modest amount of constitutional content at midtraining could therefore yield broad, persistent alignment gains, offering a cheap, complementary addition to SFT-centered pipelines. Code, data, and models are available.", 'score': 3, 'issue_id': 2835, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '1dca908e71995868', 'authors': ['Desiree Cho', 'Cameron Tice', 'Bernie Hogan', 'Hunar Batra', 'Puria Radmard', 'Jun Zhao', 'Nigel Shadbolt'], 'affiliations': ['Department of Computer Science, University of Oxford', 'Geodesic Research', 'Institute for Ethics in AI, University of Oxford', 'Oxford Internet Institute, University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2607.26654.jpg', 'data': {'categories': ['#training', '#open_source', '#benchmark', '#alignment', '#rlhf'], 'emoji': '🛡️', 'ru': {'title': 'Конституционное предтренирование для долговечного выравнивания больших языковых моделей', 'desc': 'Исследователи проверили, можно ли достичь устойчивого выравнивания языковых моделей путём внедрения принципиальных инструкций на этапе предтренировки, а не только на этапе послетренировочного выравнивания. Они провели конституционное предтренирование на 120 млрд параметров, используя корпус из 394M токенов на основе Конституции Anthropic и факториальный дизайн с разными порядками обучения и методами рассуждения. Модели, прошедшие конституционное предтренирование, показали лучшее обобщение выравнивания и его устойчивость при последующих этапах обучения, особенно в сценариях с шантажом. Важный результат: конституционное содержимое на этапе предтренировки не снижает производительность модели на стандартных бенчмарках и может стать дешёвым дополнением к существующим методам выравнивания.'}, 'en': {'title': 'Enhancing Model Alignment with Constitutional Midtraining', 'desc': 'This paper explores the concept of constitutional midtraining, which involves integrating values-based content into the training of machine learning models to enhance their alignment with human values. The authors conducted experiments using a large dataset to compare the effectiveness of this midtraining approach against a control group that only used replay methods. Results showed that models trained with constitutional content demonstrated better alignment and resilience against issues like blackmail, even after further fine-tuning. The findings suggest that adding a small amount of principled content during midtraining can significantly improve the durability of alignment without compromising model performance.'}, 'zh': {'title': '宪法中训练：提升模型对齐的有效方法', 'desc': '这篇论文探讨了后训练对齐的局限性，尤其是在微调后可能会减弱。研究者们提出了一种新的方法，称为宪法中训练，旨在通过在中训练阶段插入基于价值观的内容来增强模型的对齐能力。实验结果表明，宪法中训练的模型在对齐的泛化和持久性方面优于对照组，尤其是在应对勒索情境时表现更佳。该方法在不影响模型能力的前提下，提供了一种廉价且有效的补充方案，能够在微调中心的训练流程中实现持久的对齐提升。'}}}, {'id': 'https://huggingface.co/papers/2607.29684', 'title': 'Toward Robust and 3D-Aware RGB-NIR Imaging in the Dark', 'url': 'https://huggingface.co/papers/2607.29684', 'abstract': 'Abstract  Robust low-light imaging remains challenging for the community. Recent studies have explored fusing Near-Infrared (NIR) with noisy RGB to achieve improved enhancement, yet most methods depend on carefully curated training data pairs, with limited robustness under different scenarios. This paper offers a new perspective for RGB-NIR low-light imaging by incorporating 3D-aware neural modeling. Without using clean RGB supervision, a powerful model can be optimized to implicitly fuse extremely noisy RGB observations with NIR cues in 3D space, effectively recovering clean RGB images. The proposed model obviates the requirement for clean RGB data collection, generalizes across different noise levels. Extensive evaluations on synthetic and real data demonstrate its superiority. Codes available: https://github.com/MyNiuuu/3DarkFusion', 'score': 2, 'issue_id': 2830, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '96fe3f7bc63a4738', 'authors': ['Muyao Niu', 'Mingze Ma', 'Yifan Zhan', 'Qingtian Zhu', 'Zhihang Zhong', 'Wei Guo', 'Chang Wen Chen', 'Yinqiang Zheng'], 'affiliations': ['Adelaide University', 'Hong Kong Polytechnic University', 'School of Artificial Intelligence (SAI) Shanghai Jiao Tong University', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2607.29684.jpg', 'data': {'categories': [], 'emoji': '🌙', 'ru': {'title': 'Восстановление светлых изображений в темноте через трёхмерное слияние RGB и инфракрасных данных', 'desc': 'Статья предлагает новый подход к улучшению изображений в условиях слабого освещения путём объединения RGB и ближнего инфракрасного (NIR) спектра с использованием 3D-aware нейронного моделирования. Основное преимущество метода заключается в том, что он не требует чистых RGB изображений для обучения, что избавляет от необходимости дорогостоящей подготовки данных. Модель неявно фузирует очень шумные RGB наблюдения с NIR сигналами в трёхмерном пространстве, эффективно восстанавливая качественные RGB изображения. Метод демонстрирует хорошую обобщаемость на разные уровни шума и показывает превосходные результаты на синтетических и реальных данных.'}, 'en': {'title': 'Enhancing Low-Light Imaging with 3D Neural Fusion', 'desc': 'This paper addresses the challenge of improving low-light imaging by combining Near-Infrared (NIR) and noisy RGB images. It introduces a novel approach that utilizes 3D-aware neural modeling to enhance image quality without needing clean RGB supervision. The model effectively merges noisy RGB data with NIR information in a 3D context, allowing for the recovery of clearer RGB images. The results show that this method outperforms existing techniques across various noise conditions, making it more robust and versatile.'}, 'zh': {'title': '无监督低光照成像的新方法', 'desc': '本论文探讨了低光照成像的挑战，提出了一种新的方法来融合近红外（NIR）和噪声较大的RGB图像。通过引入3D感知神经建模，该方法无需干净的RGB监督，能够在3D空间中有效地将极其嘈杂的RGB观测与NIR线索融合，从而恢复干净的RGB图像。该模型不依赖于干净的RGB数据收集，能够在不同噪声水平下进行泛化。大量的合成和真实数据评估表明，该方法在性能上优于现有技术。'}}}, {'id': 'https://huggingface.co/papers/2607.28996', 'title': 'SULAND v2: A Refined RGB Dataset and Deep Learning Object Detection Benchmark for UAV/UGV-Based SUrface LANDmine Detection Under Domain Shift', 'url': 'https://huggingface.co/papers/2607.28996', 'abstract': 'Abstract  RGB imagery offers a practical, low-cost option for Unmanned Aerial/Ground Vehicle (UAV/UGV) survey support in surface-landmine detection, but object detectors remain underexplored in this safety-critical domain. Limited cross-architecture benchmarking and insufficient out-of-distribution (OOD) analysis obscure whether detectors generalize across deployment conditions. This challenge is amplified by the scarcity of public RGB landmine datasets, making SULAND a key benchmark for PFM-1 and PMA-2 detection. However, inspection reveals missing/false annotations, localization errors, inconsistent visibility criteria, visual artifacts, temporal labeling inconsistencies, and an inverted OOD class-ID convention in SULAND. We present SULAND_v2, a refined RGB surface-landmine dataset and benchmark. Preserving original images and splits, we manually revise annotations to ensure completeness, precise localization, label validity, and class consistency. SULAND_v2 contains 33,771 images and 12,433 bounding boxes. We benchmark 35 detector configurations across nine families. Annotation refinement improves YOLOv8 in-distribution (IID) test mAP@50 by 14.6-19.6 percentage points, while fixing the OOD class-ID convention increases mean YOLOv8 OOD mAP@50 by ~25 percentage points. On SULAND_v2, YOLOv12-Small achieves the highest IID mAP@50 (0.908), while RF-DETR-Large yields the strongest OOD performance (0.799 mAP@50, 0.675 recall). Our results demonstrate that high IID accuracy does not guarantee operational readiness. SULAND_v2 provides a reliable benchmark for evaluating domain-shift robustness in RGB-based mine-action survey support.', 'score': 2, 'issue_id': 2830, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'b91df6208db92f27', 'authors': ['Sagar Lekhak', 'Prasanna Reddy Pulakurthi', 'Lalit Joshi', 'Ramesh Bhatta', 'Emmett J. Ientilucci'], 'affiliations': ['Rochester Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.28996.jpg', 'data': {'categories': ['#benchmark', '#cv', '#dataset'], 'emoji': '💣', 'ru': {'title': 'Точная разметка и робастное тестирование детекторов мин на RGB-снимках', 'desc': 'В статье представлен улучшенный датасет SULAND_v2 для обнаружения противопехотных мин на RGB-изображениях с беспилотных летательных аппаратов. Авторы выявили и исправили множество ошибок в исходном датасете, включая неполные аннотации, ошибки локализации и проблемы с консистентностью разметки. Они провели комплексное бенчмаркирование 35 конфигураций детекторов из девяти семейств архитектур, оценивая как качество на распределении обучения (IID), так и устойчивость к распределению вне выборки (OOD). Исследование показало, что высокая точность на IID не гарантирует готовность к реальному развертыванию, подчеркивая важность тестирования на смещение домена для критичных по безопасности приложений.'}, 'en': {'title': 'Enhancing Landmine Detection with SULAND_v2: A Step Towards Reliable UAV/UGV Support', 'desc': 'This paper addresses the challenges of using RGB imagery for detecting landmines with unmanned vehicles, highlighting the limitations of existing object detectors in this critical area. It introduces SULAND_v2, a refined dataset that improves upon the original SULAND by correcting annotation errors and ensuring consistent labeling. The authors benchmark various detector
