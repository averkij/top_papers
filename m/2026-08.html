vailable, via image reconstruction, and (2) measuring multimodal context sensitivity, the extent to which the model follows visual context versus the language prior. To support the second, we introduce the WhatIfVis, a benchmark spanning five coarse-grained dimensions (spatial-temporal, color, count, size, and weight) whose questions admit answers from either the image or the prior. Our analysis yields three findings: (i) Coarse-grained visual evidence is preserved, as these attributes can be reconstructed from the final-layer image tokens of frozen MLLMs. Failures on questions about these attributes therefore point to post-perceptual utilization, rather than to degraded visual encoding during perception. (ii) Even when explicitly instructed to use or ignore visual evidence, vanilla models (without supervised fine-tuning on the WhatIfVis) show unstable visual context sensitivity. Supervised fine-tuning (SFT) improves this controllability and generalizes across domains, and activation patching further localizes the vision-versus-prior trade-off at architecture-specific depths across all six models. (iii) The vision-versus-prior trade-off is controllable along a learned vector. Applying this steering vector, even without any intent instruction, improves controllability over the vanilla model. Together, these results relocate the bottleneck, indicating that for the coarse attributes we study, MLLMs encode the visual evidence but cannot reliably control their reliance on it.', 'score': 2, 'issue_id': 2843, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '304a642c99afdb39', 'authors': ['Jiaang Li', 'Chengzu Li', 'Zhaochong An', 'Yifei Yuan', 'Xi Liu', 'Serge Belongie', 'Vésteinn Snæbjarnarson'], 'affiliations': ['Clemson University', 'ETH Zürich', 'University of Cambridge', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2607.26326.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Визуальная информация кодируется, но не контролируется: переосмысление узких мест мультимодальных моделей', 'desc': 'В работе исследуются причины ошибок мультимодальных больших языковых моделей на задачах, ориентированных на зрение, особенно когда визуальная информация противоречит встроенным знаниям модели. Авторы предложили два метода диагностики: реконструкция изображений для проверки доступности визуальной информации и измерение чувствительности к мультимодальному контексту через бенчмарк WhatIfVis с пятью категориями визуальных атрибутов. Анализ показал, что модели сохраняют грубозернистую визуальную информацию на уровне кодирования, но испытывают трудности с её надёжным использованием на этапах постпроцессинга. Исследование также продемонстрировало, что можно улучшить управляемость баланса между визуальными и языковыми знаниями через fine-tuning и векторное управление активациями.'}, 'en': {'title': 'Enhancing Visual Context Control in Multimodal Language Models', 'desc': 'This paper investigates the limitations of Multimodal Large Language Models (MLLMs) when handling tasks that require visual understanding. It identifies that while MLLMs can encode visual information, they struggle to effectively utilize this information when it conflicts with their pretrained language knowledge. The authors introduce a benchmark called WhatIfVis to assess how well these models can balance visual context and language priors. Their findings suggest that with supervised fine-tuning, MLLMs can improve their ability to control the influence of visual evidence, highlighting a need for better mechanisms to manage this trade-off.'}, 'zh': {'title': '多模态模型的视觉与语言平衡挑战', 'desc': '多模态大型语言模型（MLLMs）通过将视觉输入与预训练语言模型的丰富先验知识结合，取得了强大的性能。然而，当视觉证据与预训练知识冲突时，它们在以视觉为中心的任务上往往表现不佳。我们通过两种诊断方法探讨这些失败：一是通过图像重建来探测视觉信息的可用性，二是测量多模态上下文敏感性，即模型在多大程度上遵循视觉上下文而非语言先验。我们的分析表明，MLLMs能够编码视觉证据，但在控制对其依赖性方面存在瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2608.02315', 'title': 'GEOID-Flood: A Large-Scale Multi-Modal Benchmark Dataset for Flood Segmentation', 'url': 'https://huggingface.co/papers/2608.02315', 'abstract': 'Abstract  Geospatial foundation models aim to learn representations that transfer across regions and sensors, yet evaluating them on specific tasks requires large, high-quality, multi-modal benchmarks that measure how well such models extract value from data. Concerning flood mapping, existing datasets rarely combine bi-temporal SAR and co-registered optical imagery at scale, leaving the value of foundation models for this downstream task largely untested. We introduce GEOID-Flood, a large-scale multi-modal flood segmentation benchmark, derived from Copernicus Emergency Management Service activations, spanning 219 events across 65 countries over ten years. The dataset provides more than 14,000 tiles with co-registered pre- and post-event Sentinel-1, in GRD and RTC format, pre-event Sentinel-2 composite, and DEM, including manually validated labels that separate background from permanent water and flooded water. Using this benchmark, we evaluate foundation models against conventional encoders across single-image, multi-temporal, and multi-modal protocols. We report three main findings: foundation models offer a consistent but modest advantage; optical-SAR fusion with finetuning best resolves transient flooding; and models trained on GEOID-Flood transfer to unseen events better than those trained on existing datasets. Dataset and code available at https://github.com/links-ads/geoid-flood.', 'score': 1, 'issue_id': 2842, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4cc977e1a0cf66fb', 'authors': ['Gaetano Chiriaco', 'Luca Barco', 'Andrea Bragagnolo', 'Claudio Rossi', 'Edoardo Arnaudo'], 'affiliations': ['Fondazione LINKS', 'Politecnico di Torino'], 'pdf_title_img': 'assets/pdf/title_img/2608.02315.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#open_source', '#dataset', '#synthetic', '#transfer_learning', '#science', '#cv'], 'emoji': '🌊', 'ru': {'title': 'Мультимодальные foundation models для точного картирования наводнений через слияние спутниковых данных', 'desc': 'В статье представлен GEOID-Flood — крупный многомодальный бенчмарк для segmentation наводнений, содержащий более 14,000 снимков со спутников Sentinel-1 и Sentinel-2, собранных с помощью сервиса экстренного реагирования Copernicus. Авторы оценили foundation models и традиционные энкодеры на задаче детектирования наводнений, используя протоколы одиночного снимка, мультивременного анализа и мультимодального слияния данных. Основные результаты показывают, что foundation models дают скромное, но стабильное преимущество, а fusion оптических и SAR данных с fine-tuning лучше всего определяет временные наводнения. Модели, обученные на GEOID-Flood, лучше переносятся на новые события, чем те, которые обучались на существующих датасетах.'}, 'en': {'title': 'Unlocking Flood Insights with GEOID-Flood Benchmark', 'desc': 'This paper introduces GEOID-Flood, a new benchmark for evaluating geospatial foundation models specifically for flood segmentation tasks. It combines bi-temporal Synthetic Aperture Radar (SAR) and optical imagery, providing a comprehensive dataset that includes over 14,000 labeled tiles from various flood events. The study finds that while foundation models show a slight performance improvement, the best results come from fine-tuning models with optical-SAR data. Additionally, models trained on GEOID-Flood demonstrate better transferability to new flood events compared to those trained on existing datasets.'}, 'zh': {'title': 'GEOID-Flood：洪水映射的新基准', 'desc': '本论文介绍了GEOID-Flood，这是一个大规模的多模态洪水分割基准数据集，旨在评估地理基础模型在洪水映射任务中的表现。该数据集结合了来自Copernicus应急管理服务的多时相合成孔径雷达(SAR)和光学影像，涵盖了65个国家的219个事件，提供了超过14,000个图块。研究表明，基础模型在洪水检测中具有一定的优势，尤其是光学与SAR数据的融合能够更好地解决瞬时洪水问题。此外，使用GEOID-Flood训练的模型在未见事件上的迁移能力优于现有数据集训练的模型。'}}}, {'id': 'https://huggingface.co/papers/2608.01397', 'title': 'SG-WAM: Self-Guided World Modeling in Geometry-Aware Policy Space', 'url': 'https://huggingface.co/papers/2608.01397', 'abstract': 'Abstract  World Action Models (WAMs) couple action generation with prediction of future states. Their effectiveness depends on whether future dynamics are modeled in a space that is both aligned with action generation and sufficiently geometry-aware to capture where and how actions change the scene. Existing WAMs typically satisfy only part of this requirement, relying on either perceptually heavy observation-space targets or auxiliary latent spaces that are not jointly structured for action relevance and geometry. We propose SG-WAM, a self-guided framework that learns geometry-aware action-conditioned dynamics directly in the policy-derived representation space. SG-WAM introduces learnable dynamics tokens and a Self-Guided World Predictor that forecasts their future latent states conditioned on intervening robot actions. Prediction targets are generated by an exponential moving average copy of the same policy backbone, providing stable supervision within the representation family used by the action expert. Geometric supervision further structures the policy image-token representations, providing spatially grounded context for the dynamics tokens and yielding a future-alignment space that is both action-relevant and geometry-aware. Latent future prediction, geometric grounding, and flow-matching action generation are jointly optimized end-to-end in a unified framework. Built on a 0.9B model without large-scale embodied pretraining, SG-WAM achieves 98.5% average success on LIBERO and 73% on LIBERO-Plus, while outperforming strong baselines in both in-distribution and out-of-distribution real-world evaluations.', 'score': 1, 'issue_id': 2844, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '014beff3f79da3dc', 'authors': ['Ruiteng Zhao', 'Zhengshen Zhang', 'Yue Su', 'Wenshuo Wang', 'Jiahui Li', 'Zhiyuan Yang', 'Francis E. H. Tay', 'Marcelo H. Ang', 'Haiyue Zhu'], 'affiliations': ['Advanced Robotics Centre, National University of Singapore', 'MMLab, The University of Hongkong', 'Nanyang Technological University', 'Singapore Institute of Manufacturing Technology, Agency for Science, Technology and Research (A*STAR)'], 'pdf_title_img': 'assets/pdf/title_img/2608.01397.jpg', 'data': {'categories': ['#small_models', '#robotics', '#architecture', '#training'], 'emoji': '🤖', 'ru': {'title': 'Геометрически осведомленные модели мира для робототехники', 'desc': 'В работе предложена модель SG-WAM, которая объединяет генерацию действий робота с предсказанием будущих состояний окружающей среды. Ключевая идея заключается в обучении геометрически информативной динамики прямо в пространстве представлений, согласованном с политикой действий. Модель использует специальные токены динамики и самонаправленный предсказатель, которые получают стабильный сигнал ошибки от экспоненциального скользящего среднего той же сетевой архитектуры. Геометрическая дополнительная информация структурирует представления токенов, обеспечивая пространственный контекст и достигая состояния, одновременно релевантного для действий и геометрически осведомленного.'}, 'en': {'title': 'Geometry-Aware Action Dynamics for Future State Prediction', 'desc': 'The paper introduces SG-WAM, a novel framework that enhances World Action Models (WAMs) by integrating action generation with future state prediction in a geometry-aware manner. SG-WAM learns dynamics directly in the representation space derived from the policy, ensuring that the model captures how actions influence the environment effectively. It employs learnable dynamics tokens and a Self-Guided World Predictor to forecast future states based on robot actions, providing stable supervision through an exponential moving average of the policy. The framework optimizes latent future prediction, geometric grounding, and action generation together, achieving high success rates in various evaluations without extensive pretraining.'}, 'zh': {'title': '自我引导的几何感知动作模型', 'desc': '世界动作模型（WAMs）将动作生成与未来状态预测结合在一起。它们的有效性取决于未来动态是否在一个与动作生成对齐且足够关注几何特征的空间中建模。现有的WAMs通常只满足部分要求，依赖于感知负担重的观察空间目标或不具备联合结构的辅助潜在空间。我们提出了SG-WAM，一个自我引导的框架，直接在策略导出的表示空间中学习几何感知的动作条件动态。'}}}, {'id': 'https://huggingface.co/papers/2607.29122', 'title': 'A Frozen Pixel-Space Diffusion Model Can Guide Itself with Its Own Samples', 'url': 'https://huggingface.co/papers/2607.29122', 'abstract': 'Abstract  Pixel-space diffusion models aim to learn an end-to-end generator directly over raw pixels. This is challenging because a single model must capture both global structure and local texture in the same high-dimensional space. While recent work improves pixel diffusion through alternative prediction targets, training objectives, and architectures, these advances typically require training a new model from scratch. We show there is a cheaper, complementary strategy: a frozen, pretrained pixel diffusion model can guide itself. Our key observation is that intermediate layers of a pretrained pixel diffusion transformer can be decoded into coarse predictions that capture the main low-frequency structure, while the final layers progressively refine local, high-frequency details. We therefore attach a lightweight prediction head to an intermediate layer, keep the backbone frozen, and use the discrepancy between the intermediate and final predictions as a self-guidance direction during sampling. To train this head, we further find that real images are not necessary. Instead, model-generated samples suffice and even outperform real images for training the head, especially in enhancing the high-frequency components that pixel diffusion tends to underfit. Across multiple pixel diffusion models on ImageNet, our Synthetic Self-Guidance (SSG) consistently improves generation while adapter training requires less than 1% of full-model training compute: it reduces FID by over 50% across the evaluated JiT variants without classifier-free guidance (CFG) and further improves strong baselines with CFG, e.g., JiT-H/16 from 1.86 to 1.67 and PixelREPA-H/16 from 1.81 to 1.59. Our code is available at https://github.com/zfu006/SSG.', 'score': 1, 'issue_id': 2842, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '40e0f8fb60ef6046', 'authors': ['Zixuan Fu', 'Chong Wang', 'Lanqing Guo', 'Kailai Zhou', 'Jiahao Nie', 'Bihan Wen'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.29122.jpg', 'data': {'categories': ['#training', '#optimization', '#open_source', '#diffusion', '#synthetic', '#architecture', '#cv'], 'emoji': '✨', 'ru': {'title': 'Самонаведение замороженной диффузии через синтетические примеры', 'desc': 'Работа предлагает метод Synthetic Self-Guidance для улучшения генеративных моделей диффузии в пиксельном пространстве без переобучения. Ключевая идея заключается в использовании промежуточных слоёв замороженной предобученной модели для захвата глобальной структуры, а финальных слоёв — для детализации локальных особенностей. К промежуточному слою подключается лёгкий предсказывающий модуль, и разница между предсказаниями используется как сигнал самонаведения при генерации. Авторы показывают, что для обучения этого модуля достаточно синтетических изображений, созданных самой моделью, которые даже превосходят реальные данные и значительно снижают затраты вычислений.'}, 'en': {'title': 'Self-Guidance: Enhancing Pixel Diffusion with Pretrained Models', 'desc': "This paper introduces a method called Synthetic Self-Guidance (SSG) for improving pixel-space diffusion models, which generate images directly from raw pixels. The authors propose using a frozen, pretrained model to guide itself by leveraging intermediate layer outputs to capture low-frequency structures and refining them with final layer outputs for high-frequency details. Instead of requiring real images for training, the method shows that generated samples can effectively train a lightweight prediction head, enhancing the model's performance. The results demonstrate significant improvements in image generation quality while requiring minimal additional computational resources."}, 'zh': {'title': '自我引导提升像素扩散模型生成效果', 'desc': '本文提出了一种新的像素空间扩散模型训练方法，旨在通过自我引导来提高生成效果。我们发现，预训练的像素扩散模型的中间层可以生成粗略的低频结构预测，而最终层则逐步细化高频细节。通过在中间层附加轻量级预测头，并保持主干网络不变，我们利用中间预测与最终预测之间的差异作为自我引导方向进行采样。实验表明，使用模型生成的样本进行训练可以有效提升高频成分的生成质量，且计算资源消耗极低。'}}}];

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (5)', '#agents (24)', '#agi', '#alignment (5)', '#architecture (14)', '#audio (3)', '#benchmark (40)', '#cv (12)', '#data (1)', '#dataset (25)', '#diffusion (11)', '#ethics (2)', '#games (3)', '#graphs', '#hallucinations', '#healthcare (2)', '#inference (8)', '#interpretability (6)', '#leakage (1)', '#long_context (6)', '#low_resource', '#machine_translation', '#math (4)', '#multilingual', '#multimodal (35)', '#open_source (21)', '#optimization (18)', '#plp (5)', '#rag (2)', '#reasoning (16)', '#rl (13)', '#rlhf (8)', '#robotics (10)', '#science (4)', '#security (3)', '#small_models (3)', '#story_generation', '#survey', '#synthetic (6)', '#training (40)', '#transfer_learning (1)', '#video (11)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-05 23:52',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-05 23:52')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-05 23:52')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
