тличается от успешности самих исправлений ошибок. Для решения проблемы авторы разработали агент аудита, который валидирует и улучшает объяснения, повышая их достоверность.'}, 'en': {'title': 'Enhancing Trust in LLM Agent Explanations with ExplainBench', 'desc': 'This paper discusses the growing use of Large Language Model (LLM) agents in software engineering, particularly in generating substantial code changes. As these agents produce more complex modifications, it becomes challenging for developers to manually review their outputs, prompting a need for reliable explanations of the changes made. The authors introduce ExplainBench, a benchmark designed to assess the quality of explanations provided by coding agents, focusing on their ability to clarify both the intended behavior of code and the impact of the changes. The study reveals that explanation quality is a crucial factor in evaluating agents, leading to the development of an explanation audit agent that enhances the trustworthiness of these explanations.'}, 'zh': {'title': '提升代码生成代理解释的可信度', 'desc': '大型语言模型（LLM）代理在软件工程中得到了快速应用。随着代理在代码生成中的作用越来越大，它们所做的更改也变得更加复杂，涉及数十到数百行代码。这使得手动审查代理结果变得越来越困难，因此开发者开始依赖解释来理解所做的更改。为了解决这一问题，我们提出了ExplainBench，一个用于自动评估编码代理生成的解释的基准，旨在提高解释的可信度。'}}}, {'id': 'https://huggingface.co/papers/2608.03874', 'title': 'ContinualSkillBench: Can LLM Agents Truly Evolve Their Capabilities?', 'url': 'https://huggingface.co/papers/2608.03874', 'abstract': 'Abstract  Modern agent frameworks equip large language models with external skill libraries to solve complex tasks. However, it remains unclear whether these systems can effectively evolve their skills and whether the resulting skills improve task-solving capabilities. To bridge this gap, we introduce ContinualSkillBench, a dynamic evaluation framework for in-context continual skill learning. It covers five representative domains, each containing 100 interconnected subtasks ordered by increasing difficulty and opportunities for cross-task skill reuse. Our experiments show that sequential execution generally improves performance, but the gains vary substantially across models and domains. Moreover, in-context learning performs comparably to explicit skill maintenance on average, suggesting that much of the improvement arises from adaptation to prior context and feedback rather than reusable skill abstraction alone. Explicit skills nevertheless provide selective benefits for tasks requiring reusable procedures or precise outputs. We further find that less capable models tend to accumulate larger, more fragmented collections of task-specific skills. These findings show that current in-context skill evolution mechanisms can support continual adaptation, but still struggle to consistently consolidate experience into robust and transferable skills.', 'score': 11, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'f80e382d2525e916', 'authors': ['Tianyi Guan', 'Yiding Wang', 'Haotong Yang', 'Siyuan Cao', 'Shirui Liu', 'Yi Hu', 'Jiaqi Li', 'Muhan Zhang'], 'affiliations': ['Beijing Institute for General Artificial Intelligence', 'Institute for Artificial Intelligence, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03874.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Эволюция навыков LLM: между адаптацией в контексте и обобщением знаний', 'desc': 'В этой работе авторы предложили ContinualSkillBench -框架для оценки способности большим языковым моделям эволюционировать свои навыки при решении последовательных задач. Эксперименты показали, что последовательное выполнение задач улучшает производительность, но прирост сильно варьируется в зависимости от модели и домена. Интересно, что обучение в контексте работает сравнимо с явным сохранением навыков, что указывает на важность адаптации к предыдущему контексту и обратной связи. Исследование выявило, что менее мощные модели накапливают больше фрагментированных, специфичных для конкретных задач навыков, а не обобщённые переиспользуемые процедуры.'}, 'en': {'title': 'Evolving Skills for Better Task Performance in Language Models', 'desc': 'This paper presents ContinualSkillBench, a framework designed to evaluate how well large language models can learn and adapt their skills over time. It examines five different domains with interconnected subtasks that increase in difficulty, allowing for the reuse of skills across tasks. The results indicate that while sequential task execution generally enhances performance, the effectiveness varies by model and domain. Additionally, the study reveals that in-context learning can be as effective as traditional skill maintenance, highlighting the importance of adapting to previous experiences and feedback.'}, 'zh': {'title': '持续技能学习的动态评估框架', 'desc': '现代智能体框架为大型语言模型提供外部技能库，以解决复杂任务。然而，这些系统是否能够有效地发展其技能，以及这些技能是否能提高任务解决能力，仍不清楚。为了解决这个问题，我们引入了ContinualSkillBench，这是一个动态评估框架，用于上下文中的持续技能学习。我们的实验表明，顺序执行通常能提高性能，但不同模型和领域的增益差异很大。'}}}, {'id': 'https://huggingface.co/papers/2608.01127', 'title': 'MiniWorld: Democratizing the Training of Video World Models from Scratch', 'url': 'https://huggingface.co/papers/2608.01127', 'abstract': 'Abstract  Video world models predict future observations conditioned on historical observations and control signals, enabling long-horizon generation through autoregressive state transitions. Unlike conventional video generation models that primarily capture visual appearance and motion, video world models learn the underlying dynamics governing environment evolution under agent actions, providing a foundation for embodied AI and interactive simulation. Recent progress has largely relied on adapting pretrained video generation models through post-training or distillation. Although effective, these approaches often require complex training pipelines, substantial computational resources, and suffer from the mismatch between bidirectional pretraining and causal streaming inference. Recent studies have shown that training autoregressive video world models from scratch is feasible and scalable. However, the community still lacks a lightweight, transparent, and fully reproducible baseline trainable end-to-end with modest computational resources. We present MiniWorld, a reproducible framework for training streaming video world models from scratch. MiniWorld employs a block-causal Video Diffusion Transformer trained with Flow Matching in the latent space of a pretrained Video VAE. Building on Diffusion Forcing, it adopts a chunk-wise non-decreasing noise schedule and two-stage continued training to improve temporal modeling and stability. During inference, MiniWorld combines a rolling KV cache with pipelined asynchronous denoising for efficient streaming generation under bounded computation. The entire model can be trained within several days on a single 8-GPU server. By releasing the training and inference codebase and pretrained checkpoints, we hope MiniWorld will facilitate future research on video world modeling.', 'score': 9, 'issue_id': 2852, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '032a32327f140658', 'authors': ['Yian Zhao', 'Ruochong Zheng', 'Hongcan Guo', 'Yu Yan', 'Jian Zhang', 'Jie Chen'], 'affiliations': ['Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01127.jpg', 'data': {'categories': ['#small_models', '#video', '#open_source', '#architecture', '#training', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Лёгкий базовый фреймворк для обучения потоковых видео моделей мира с нуля', 'desc': 'В статье представлена MiniWorld — фреймворк для обучения видео моделей мира с нуля, которые предсказывают будущие кадры на основе истории наблюдений и управляющих сигналов. Модель использует блочно-причинный Video Diffusion Transformer, обученный методом Flow Matching в скрытом пространстве предварительно обученного Video VAE. Авторы применяют Diffusion Forcing с кусочно-неубывающим графиком шума и двухэтапное обучение для улучшения моделирования временных зависимостей. Система оптимизирована для эффективного потокового генерирования с использованием rolling KV cache и асинхронного денойзинга, позволяя полностью обучить модель за несколько дней на одном сервере с 8 GPU.'}, 'en': {'title': 'MiniWorld: Simplifying Video World Model Training', 'desc': 'This paper introduces MiniWorld, a framework designed for training video world models from scratch, which predict future video frames based on past observations and control signals. Unlike traditional models that focus on visual aspects, MiniWorld emphasizes understanding the dynamics of environments influenced by agent actions, making it suitable for applications in embodied AI. The framework utilizes a block-causal Video Diffusion Transformer and incorporates techniques like Flow Matching and a unique noise schedule to enhance temporal modeling and stability. By providing a reproducible and efficient training process, MiniWorld aims to lower the barriers for researchers in the field of video world modeling.'}, 'zh': {'title': 'MiniWorld：轻量级视频世界模型训练框架', 'desc': '视频世界模型通过历史观察和控制信号预测未来观察，支持长时间生成。与传统视频生成模型不同，视频世界模型学习环境在代理行为下的动态演变，为具身人工智能和交互式模拟提供基础。尽管现有方法有效，但通常需要复杂的训练流程和大量计算资源。我们提出了MiniWorld，一个轻量级、透明且可完全复现的框架，能够从零开始训练流媒体视频世界模型。'}}}, {'id': 'https://huggingface.co/papers/2608.00371', 'title': "Decoding Children's Gait Behavior", 'url': 'https://huggingface.co/papers/2608.00371', 'abstract': 'Abstract  We introduce a new problem domain for human action recognition: the fine-grained analysis of children\'s gait behaviors from standard RGB video. We specifically target the ambulatory patterns of children aged 3-17 years. Such behaviors arise naturally in the diagnosis and treatment of several critical developmental and neuromuscular disorders, such as cerebral palsy and hemiplegia. Despite their clinical value, current 3D sensor-based gait analysis systems are expensive, intrusive, and often impractical for young subjects. To address this, we introduce a new dataset comprising over 1,100 high-frame-rate (60 FPS) video sequences from 110 subjects, accompanied by synchronized, anonymized pose sequences. In each session, the child performs a 5-second "walk-around" task, capturing the gait cycle from multiple viewpoints. Crucially, we demonstrate that current state-of-the-art approaches, including gait foundation models and Multimodal Large Language Models (MLLMs), fail to effectively resolve these clinical nuances. We identify the key technical challenges in analyzing these erratic and subtle motor patterns and describe a unified end-to-end framework for decoding fundamental components of pediatric gait. Through comprehensive experimental results, we demonstrate the potential of this dataset to drive novel research questions and establish a rigorous baseline for automated child gait assessment.', 'score': 9, 'issue_id': 2852, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '2dfa2c0c88c1ff92', 'authors': ['Yifan Shen', 'Boyi Li', 'Meihuan Huang', 'Yuanzhe Liu', 'Xu Cao', 'Jinyang Jin', 'Zhengyuan Li', 'Anglin Liu', 'Junho Kim', 'Jingyuan Zhu', 'Lan Fangzhou', 'Jianguo Cao', 'Jintai Chen', 'Ismini Lourentzou', 'James Matthew Rehg'], 'affiliations': ['Hong Kong Polytechnic University', 'PediaMed AI', 'Shenzhen Childrens Hospital', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.00371.jpg', 'data': {'categories': ['#video', '#multimodal', '#cv', '#healthcare', '#dataset'], 'emoji': '👧', 'ru': {'title': 'Автоматическая диагностика нарушений походки у детей из видео', 'desc': 'В работе представлена новая задача распознавания действий человека — анализ особенностей походки детей в возрасте 3-17 лет из видео RGB высокого разрешения. Авторы создали датасет более чем из 1100 видеопоследовательностей с частотой 60 кадров в секунду, синхронизированный с данными о позах, что позволяет диагностировать нейромышечные расстройства вроде ДЦП и гемиплегии без дорогостоящих 3D-сенсоров. Показано, что современные модели, включая специализированные модели походки и Multimodal LLM, неэффективны для анализа тонких особенностей детской моторики. Авторы предложили единый end-to-end фреймворк для декодирования компонентов детской походки и установили базовые метрики для автоматизированной оценки.'}, 'en': {'title': 'Revolutionizing Child Gait Analysis with Standard Video', 'desc': "This paper presents a new approach to recognizing children's walking patterns using regular video instead of expensive 3D sensors. It focuses on children aged 3-17 and aims to help diagnose developmental disorders like cerebral palsy. The authors introduce a dataset with over 1,100 videos of children walking, which includes detailed pose information. They highlight the limitations of existing models in analyzing these subtle movements and propose a new framework to improve automated gait assessment for children."}, 'zh': {'title': '儿童步态行为的细致分析', 'desc': '本文介绍了一个新的研究领域：从标准RGB视频中细致分析儿童的步态行为。我们专注于3至17岁儿童的行走模式，这对于诊断和治疗一些关键的发育和神经肌肉疾病具有重要意义。尽管现有的3D传感器步态分析系统具有临床价值，但其成本高、侵入性强且不适合年轻受试者。为此，我们提出了一个新的数据集，包含110名受试者的1100多个高帧率视频序列，并展示了当前最先进的方法在分析这些细微运动模式时的局限性。'}}}, {'id': 'https://huggingface.co/papers/2607.28661', 'title': 'Are the Financial Reasoning from LLMs Credible? A Real World Test over Long-Horizon Statements', 'url': 'https://huggingface.co/papers/2607.28661', 'abstract': 'Abstract  Do Large Language Models (LLMs) possess genuine structural reasoning, or merely rely on surface-level pattern matching? The financial domain, demanding numerical precision and multi-step logic over long contexts, is an ideal testbed. Existing benchmarks fail to capture real-world industrial complexity, predominantly relying on multiple-choice questions or single-hop QA over cropped tables while ignoring intricate cross-statement dynamics and temporal de-cumulation.   To bridge this gap, we introduce FinIndices, a large-scale benchmark evaluating data-processing fidelity over uncropped financial statements (up to 32K tokens). Utilizing an automated synthesis pipeline with adversarial traps, FinIndices encompasses Single-Index computation and Table-Index tabulation to test complex domain, temporal, and caliber reasoning.   Our evaluation reveals two severe LLM vulnerabilities. First, a "Knowledge Bottleneck": despite memorizing formulas during pre-training, models demonstrate fragile pattern matching. Removing explicit formula hints causes performance to collapse (e.g., Gemini-3.1-Pro drops from 70.70% to 38.22% on table tasks), exposing fatal flaws in temporal de-cumulation and stock-flow caliber mismatch. Second, a "Structural Bottleneck": the intense cognitive load of generating multi-metric, multi-period tables actively drains reasoning capacity. Under structural pressure, LLMs that flawlessly execute isolated derivations regress to shallow heuristics, such as fetching incorrect adjacent columns or substituting deep accounting adjustments with lazy literal arithmetic. Finally, Supervised Fine-Tuning (SFT) yields substantial zero-hint gains (+8.54% Single, +3.82% Table), validating that structured logic can be partially restored via data-centric alignment.', 'score': 9, 'issue_id': 2853, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '6579bd8ee8ad482f', 'authors': ['Xinke Tong', 'Xuanming Zhang', 'Tianyi Tang', 'An Yang', 'Jiatu Hu', 'Guojie Lin', 'Zhenzhen Shi', 'Lingfeng Zeng', 'Boyu Yang', 'Bing Zhao', 'Hu Wei', 'Lin Qu', 'Dayiheng Liu'], 'affiliations': ['Alibaba Group', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28661.jpg', 'data': {'categories': ['#long_context', '#dataset', '#reasoning', '#interpretability', '#benchmark', '#training'], 'emoji': '📊', 'ru': {'title': 'Языковые модели не умеют считать: структурные пределы LLM в финансовом анализе', 'desc': 'Работа исследует, способны ли большие языковые модели (LLM) к настоящему структурному рассуждению или они полагаются только на поверхностное распознавание паттернов в финансовой области. Авторы создали FinIndices — крупномасштабный бенчмарк для оценки способности моделей обрабатывать данные из полных финансовых отчётов (до 32K токенов) с учётом сложной логики и временных зависимостей. Исследование выявило два критических недостатка: "Knowledge Bottleneck" — модели забывают формулы без явных подсказок, и "Structural Bottleneck" — когда требуется одновременно генерировать несколько метрик за несколько периодов, LLM переходят на поверхностные эвристики вместо глубокого логического анализа. Однако обучение с учителем (SFT) на структурированных данных позволяет частично восстановить способность моделей к корректному финансовому рассуждению.'}, 'en': {'title': 'Unveiling LLMs: Beyond Pattern Matching in Financial Reasoning', 'desc': "This paper investigates whether large language models (LLMs) can perform genuine structural reasoning in the financial domain, which requires precise numerical and logical processing. The authors introduce FinIndices, a new benchmark that tests LLMs on complex financial statements, addressing the limitations of existing benchmarks that focus on simpler tasks. The study identifies two main vulnerabilities in LLMs: a 'Knowledge Bottleneck' where models struggle without explicit formula hints, and a 'Structural Bottleneck' where the cognitive load of complex tasks leads to shallow reasoning. The results suggest that while LLMs can improve with supervised fine-tuning, they still face significant challenges in handling intricate financial reasoning."}, 'zh': {'title': '揭示大型语言模型的推理瓶颈', 'desc': '这篇论文探讨了大型语言模型（LLMs）在金融领域的结构推理能力。研究发现，现有的基准测试无法有效捕捉真实的工业复杂性，主要依赖于选择题和简单的问答。为此，作者提出了FinIndices，一个大规模基准，评估未裁剪的财务报表上的数据处理能力。结果显示，LLMs在多指标和多周期表格生成方面存在严重的知识和结构瓶颈，但通过监督微调可以部分恢复其结构逻辑。'}}}, {'id': 'https://huggingface.co/papers/2608.03700', 'title': 'When Agents Learn to Be You: Benchmarking Privacy Leakage, Impersonation Risk, and Defenses in Persona Skills', 'url': 'https://huggingface.co/papers/2608.03700', 'abstract': 'Abstract  Persona skills distill personal interaction histories into portable and executable artifacts for downstream agents. While enabling flexible personalization, this process concentrates fragmented personal signals, amplifies their impact through reuse, and challenges defenses designed for individual records or retrieval-based memory. To systematically investigate the safety of the persona-skill pipeline, we introduce AntiSkillBench, an end-to-end benchmark for evaluating risks and defenses across the persona-skill pipeline. It comprises: (i) a dataset of 7,500 persona-grounded dialogue traces, constructed from 50 behaviorally rich profiles spanning diverse task scenarios; (ii) an evaluation suite that measures skill-level privacy leakage and agent-level attribute disclosure and behavioral impersonation across three skill-distillation strategies; and (iii) a defense evaluation covering four configurations across online and post-hoc interventions, including active risk suppression and passive provenance protection. Experiments across three frontier agents show that persona-skill risks persist across agent backbones and distillation protocols, extending from explicit attributes to communication styles and personality traits. Existing defenses exhibit limited and distillation-dependent effectiveness, failing to generalize across risk and distillation strategies. These results highlight AntiSkillBench as a challenging benchmark for developing privacy-preserving and authenticity-aware persona skills.', 'score': 8, 'issue_id': 2851, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'a4c6cb1c6a2abd4f', 'authors': ['Yongli Xiang', 'Zhifang Zhang', 'Bojun Yang', 'Ziming Hong', 'Lei Feng', 'Miao Xu', 'Tongliang Liu'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence', 'Southeast University', 'Sydney AI Centre, The University of Sydney', 'University of Queensland'], 'pdf_title_img': 'assets/pdf/title_img/2608.03700.jpg', 'data': {'categories': ['#leakage', '#training', '#ethics', '#benchmark', '#dataset', '#agents', '#security'], 'emoji': '🔒', 'ru': {'title': 'Безопасность персональных навыков: от оценки рисков к защите приватности', 'desc': 'В статье предлагается AntiSkillBench — комплексный бенчмарк для оценки безопасности при создании персональных навыков (persona skills), которые дистиллируют историю взаимодействия пользователя в переносимые артефакты для агентов. Бенчмарк включает датасет из 7500 диалогов, набор метрик для измерения утечек приватной информации и раскрытия атрибутов пользователя, а также оценку четырёх защитных механизмов. Экспериментальное исследование показывает, что риски персонализации распространяются на стиль коммуникации и черты характера, а существующие защиты имеют ограниченную эффективность. Работа подчёркивает необходимость разработки новых методов для создания приватных и аутентичных персональных навыков в системах с LLM.'}, 'en': {'title': 'Enhancing Privacy in Personalized AI Interactions', 'desc': 'This paper introduces AntiSkillBench, a benchmark designed to evaluate the safety of persona skills, which are tools that personalize interactions based on user history. It includes a dataset of 7,500 dialogue traces from diverse profiles to assess privacy risks and behavioral impersonation. The study reveals that risks persist across different agents and distillation methods, affecting both explicit attributes and communication styles. Additionally, existing defenses are shown to be limited in their effectiveness, emphasizing the need for improved privacy-preserving techniques in persona skill development.'}, 'zh': {'title': '构建安全的个性化技能评估基准', 'desc': '本文介绍了Persona技能如何将个人互动历史提炼成可移植的可执行工件，以便下游代理使用。这一过程虽然实现了灵活的个性化，但也集中化了分散的个人信号，并通过重用放大其影响，挑战了针对单个记录或检索记忆的防御机制。为系统性地研究Persona技能管道的安全性，本文提出了AntiSkillBench，这是一个用于评估Persona技能管道风险和防御的端到端基准。实验结果表明，现有的防御措施在不同的风险和提炼策略下效果有限，强调了开发保护隐私和真实性的Persona技能的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.00730', 'title': 'Push-Wiper: Toward General-Purpose Robotic Cleaning across Varied Stains and Surfaces with Segmented Pushing Trajectories', 'url': 'https://huggingface.co/papers/2608.00730', 'abstract': 'Abstract  Viscous stains, characterized by high viscosity and complex rheological properties, remain a major challenge for robotic surface cleaning. Conventional wiping often spreads the stain, while scrubbing provides stronger friction but risks damaging the surface. In this paper, we propose Push-Wiper, a framework that reformulates viscous stain cleaning as an aggregation problem. Push-Wiper employs a sponge to progressively gather stains through segmented pushing trajectories, followed by a post-processing phase that detaches the aggregated material and enables sponge self-cleaning. We adopt a stepwise strategy for stain gathering and leverage Diffusion Policy to generate adaptive pushing action sequences. These sequences are executed through our Arbitrary Surface Pose Interpolator (ASPI) and a hybrid force-position controller, allowing the method to generalize to stains with diverse spatial distributions. Push-Wiper achieves a cleaning score (CS), defined as the percentage of stain area removed, up to 130% higher than baseline methods. Without additional training, Push-Wiper also transfers in a zero-shot manner to solid residues, liquid spills, unseen viscous stains, and curved surfaces with varying geometries. Our experiments demonstrate the cleaning effectiveness of Push-Wiper and its strong generalization ability. The project website is available at https://push-wiper.github.io/.', 'score': 6, 'issue_id': 2850, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '1a35fb8696037e25', 'authors': ['Renhao Lu', 'Mingxin Wang', 'Chenyang Cao', 'Yang Yang', 'Guoping Pan', 'Kangkang Dong', 'Yi Cheng', 'Houde Liu'], 'affiliations': ['Tsinghua Shenzhen International Graduate School, Tsinghua University, Shenzhen 518055, China', 'University of Toronto, Toronto M5S 1A1, Canada', 'Z-Lab, Zerith Robotics, Shenzhen 518055, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.00730.jpg', 'data': {'categories': ['#diffusion'], 'emoji': '🤖', 'ru': {'title': 'Агрегирующий подход к робототехнической чистке вязких загрязнений', 'desc': 'В работе предложена система Push-Wiper для решения задачи удаления вязких загрязнений с помощью робота. Авторы переформулируют проблему чистки как задачу агрегации, где губка постепенно собирает загрязнения через серию толчков по заданным траекториям. Для генерации адаптивных последовательностей действий толчков используется Diffusion Policy, а для управления роботом применяется гибридный контроллер сил и позиций. Система демонстрирует высокую эффективность и хорошую способность к обобщению, включая нулевую трансферную обучаемость на новые типы загрязнений и поверхности.'}, 'en': {'title': 'Revolutionizing Robotic Cleaning with Push-Wiper', 'desc': 'This paper introduces Push-Wiper, a novel framework designed to tackle the challenge of cleaning viscous stains using a robotic approach. It reformulates the cleaning process as an aggregation problem, where a sponge is used to gather stains through carefully planned pushing movements. The method incorporates a Diffusion Policy to adaptively generate action sequences for effective stain removal, and it utilizes an Arbitrary Surface Pose Interpolator (ASPI) for versatile application on various surfaces. Push-Wiper demonstrates significant improvements in cleaning efficiency, achieving up to 130% higher cleaning scores compared to traditional methods, while also showing strong adaptability to different types of stains and surfaces without requiring additional training.'}, 'zh': {'title': 'Push-Wiper：高效清洁粘性污渍的新方法', 'desc': '本论文提出了一种名为Push-Wiper的框架，用于清洁高粘度污渍。该方法将污渍清洁重新定义为聚合问题，通过分段推送轨迹逐步收集污渍，并在后处理阶段实现污渍的分离和海绵自清洁。Push-Wiper采用逐步策略和扩散策略生成自适应的推送动作序列，能够适应不同空间分布的污渍。实验结果表明，Push-Wiper的清洁效果显著优于传统方法，且具备良好的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2607.28993', 'title': 'ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts', 'url': 'https://huggingface.co/papers/2607.28993', 'abstract': 'Abstract  World Action Models (WAMs) have emerged as a promising paradigm by jointly modeling robot actions and future visual dynamics. However, their reliance on pixel-generative future supervision can entangle action-relevant state transitions with task-irrelevant visual content, limiting robustness under visual distribution shifts. We identify Training-Distribution Hallucination, a recurring phenomenon in which futures conditioned on visually shifted observations hallucinate training-domain content rather than remain faithful to the current scene. A controlled frame-triplet diagnosis further shows that DINOv3 features remain more stable across visual shifts while better preserving task-state distinctions than Wan-VAE latents. Rather than correcting the predicted futures, we propose Semantic-Temporal WAM (ST-WAM) to improve action robustness by using DINOv3 as a shared semantic representation for future prediction and history retrieval while retaining fine-grained VAE dynamics. Its Dual-Space Future Experts (DSFE) jointly predict future VAE latents and DINO features, while Current-Anchored Intent Retrieval (CAIR) retrieves task-relevant evidence from recent DINO history under the current visual-language context. ST-WAM is trained end-to-end without additional embodied pretraining or task-specific annotations, and requires no explicit future generation at inference. It achieves 98.7% on LIBERO and 92.8% on RoboTwin 2.0; more importantly, compared with Fast-WAM, it improves zero-shot LIBERO-Plus performance by 21.3 percentage points and more than doubles real-world success under visual shifts from 25.8% to 61.5%. These results demonstrate that semantic-temporal modeling effectively complements pixel-generative dynamics for robust manipulation.', 'score': 6, 'issue_id': 2850, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '8caceee5a317c598', 'authors': ['Mingxin Wang', 'Bin Hu', 'Bin Qian', 'Kaitao Jiang', 'Haoning Wu', 'Feng Yan', 'Bowen Jing', 'Ruiyang Hao', 'Enyi Wang', 'Kangning Niu', 'Yandan Yang', 'Mu Xu', 'Yan Wang', 'Houde Liu', 'Tianlun Li'], 'affiliations': ['AMAP-CV-LAB, Alibaba Group', 'Kings College London', 'Shanghai Jiao Tong University', 'The University of Manchester', 'Tsinghua University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28993.jpg', 'data': {'categories': ['#training', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Семантико-временные модели для устойчивого управления роботом', 'desc': 'В статье исследуются World Action Models (WAMs) — модели, которые совместно предсказывают действия робота и будущую визуальную динамику. Авторы выявили проблему Training-Distribution Hallucination, когда модель генерирует визуальное содержимое из обучающего распределения вместо адаптации к текущей сцене при визуальных сдвигах. Предложено решение ST-WAM, которое использует семантические признаки DINOv3 для стабильного представления задачи и VAE латенты для захвата динамики, комбинируя их через архитектуру Dual-Space Future Experts и механизм Current-Anchored Intent Retrieval. Метод достигает значительного улучшения робастности без дополнительного предобучения: на реальном роботе производительность возросла с 25.8% до 61.5% при визуальных сдвигах.'}, 'en': {'title': 'Enhancing Robot Action Predictions with Semantic-Temporal Modeling', 'desc': 'The paper introduces Semantic-Temporal World Action Models (ST-WAM), which enhance the robustness of robot action predictions by addressing the limitations of traditional pixel-generative future supervision. It identifies a problem called Training-Distribution Hallucination, where predictions based on altered visual inputs fail to accurately reflect the current scene. ST-WAM utilizes DINOv3 features for better semantic representation, allowing for improved future predictions and retrieval of relevant task information. The model is trained end-to-end without needing extra pretraining or specific annotations, achieving significant performance improvements in various benchmarks, especially under visual distribution shifts.'}, 'zh': {'title': '语义时间模型提升动作鲁棒性', 'desc': '世界动作模型（WAMs）通过联合建模机器人动作和未来视觉动态，展现出良好的前景。然而，它们依赖于像素生成的未来监督，这可能导致与任务无关的视觉内容干扰动作相关的状态转变，从而限制了在视觉分布变化下的鲁棒性。本文提出了语义时间WAM（ST-WAM），通过使用DINOv3作为共享语义表示来提高动作的鲁棒性，同时保留细粒度的变分自编码器（VAE）动态。ST-WAM在不需要额外的预训练或任务特定注释的情况下进行端到端训练，并在视觉变化下显著提高了实际成功率。'}}}, {'id': 'https://huggingface.co/papers/2608.02218', 'title': 'PosterMELD: Multi-Agent Paper-to-Poster Generation for Controllable Design Diversity with Editable Print-Ready Outputs', 'url': 'https://huggingface.co/papers/2608.02218', 'abstract': "Abstract  Scientific poster construction compresses a long multimodal paper into a readable, editable canvas. Existing systems hide request-level failures by scoring only completed outputs; direct image generation is not element-editable, while coding-agent workflows are costly. PosterMELD is a template-conditioned multi-agent pipeline: capacity-aware slots guide writing before rendering, and deterministic gates plus vision-language model (VLM) review route failures to bounded repair. Each accepted request exports editable PowerPoint (PPTX) and Portable Network Graphics (PNG) artifacts; explicit design controls yield same-paper variants. Across 621 papers, Print-Ready Rate (PRR) counts requests passing geometric, readability, asset-integrity, and obvious-factual-error checks, with native editability reported separately. A frozen VLM assigns conditional Craftsmanship-Harmony-Expressiveness (CHE) scores to print-ready outputs. PosterMELD attains 81.3% PRR, 3.4 times P2P's rate and 5.2 times PosterGen's, and the highest conditional CHE among generated methods with multiple print-ready outputs. Native editability and explicit design controls are retained at a mean cost of USD 0.38 per request, 3.5% of Codex+Skill's. Code and resources are available at https://github.com/Shannon4Science/PosterMELD.", 'score': 5, 'issue_id': 2851, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e6151be63a22f410', 'authors': ['Haojie Hu', 'Chenhao Dang', 'Yaojia Liu', 'Hengrui Kang', 'Conghui He', 'Weijia Li'], 'affiliations': ['Renmin University of China', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'Tongji University', 'Tsinghua Shenzhen International Graduate School, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02218.jpg', 'data': {'categories': ['#open_source', '#science'], 'emoji': '🎨', 'ru': {'title': 'Автоматические научные постеры с гарантированной редактируемостью и высоким качеством', 'desc': 'PosterMELD — это мультиагентный конвейер для автоматического создания научных постеров из статей, использующий шаблоны и модели зрения-языка для направления потока работы. Система использует capacity-aware слоты и детерминированные проверки для маршрутизации ошибок на ограниченное восстановление, что позволяет избежать необратимых отказов, свойственных прямому генерированию изображений. Каждый успешный результат экспортируется в редактируемые форматы PowerPoint и PNG с явными элементами управления дизайном, позволяя создавать варианты одной статьи. Система достигла 81.3% процента готовых к печати постеров со стоимостью всего 0.38 доллара на запрос, превосходя существующие методы по качеству и редактируемости.'}, 'en': {'title': 'Transforming Papers into Editable Posters Efficiently!', 'desc': 'The paper introduces PosterMELD, a multi-agent system designed to create scientific posters from lengthy papers in a more efficient and editable manner. It utilizes a template-conditioned approach with capacity-aware slots to guide the writing process, ensuring that the final output is both readable and visually appealing. The system incorporates a vision-language model (VLM) to assess and improve the quality of generated outputs, achieving a high Print-Ready Rate (PRR) of 81.3%. Additionally, PosterMELD maintains native editability and design controls at a low cost, significantly outperforming existing methods in terms of efficiency and quality.'}, 'zh': {'title': '海报生成的智能化新方法', 'desc': 'PosterMELD 是一个基于模板的多智能体管道，用于将长篇多模态论文压缩成可读的海报。该系统通过容量感知的插槽引导写作，并使用确定性门和视觉语言模型（VLM）来处理失败请求。它能够导出可编辑的 PowerPoint 和 PNG 文件，并保持设计控制，生成不同版本的论文。PosterMELD 在 621 篇论文中实现了 81.3% 的打印准备率，显著高于其他方法，且每个请求的平均成本仅为 0.38 美元。'}}}, {'id': 'https://huggingface.co/papers/2608.01247', 'title': 'RestoreKV: Recovering Full-Cache Behavior Under Aggressive Query-Agnostic KV Cache Eviction', 'url': 'https://huggingface.co/papers/2608.01247', 'abstract': 'Abstract  Query-agnostic KV cache eviction compresses a context once and reuses the resulting cache for arbitrary future queries, but performance can collapse under tight budgets. Existing methods primarily improve which original KV pairs are retained. We introduce RestoreKV, which complements this selection-based formulation with learned restoration under the same total KV budget. Our key insight is that, although the information lost through eviction is context-specific, the mechanism for generating its compact complement can be shared across contexts. After context prefill, a few restore tokens attend to the full KV cache in a single LoRA-adapted pass, generating a compact, context-conditioned restore cache. The base importance scorer and eviction rule remain unchanged, and the adapters are disabled for all subsequent queries and decoding. RestoreKV is trained through parameter-efficient self-distillation from the frozen full-cache model, optimizing only 0.4% of the parameters and requiring no task-specific tuning. Across four backbones and four long-context benchmarks, RestoreKV substantially reduces compression-induced degradation. On Qwen3-4B, it improves 59 of 60 paired, budget-matched settings across five base eviction methods; at a 5% budget, it raises KVzip from 38.2 to 73.2 on RULER-4K. Applied to KVzip+, RestoreKV reaches 86.4 RULER accuracy at 16times compression on the KVPress Benchmark, while adding less than 0.5% one-time cache-construction overhead in a 32K-context evaluation. Our project page is available at https://paper.pnu-cvsp.com/RestoreKV/', 'score': 5, 'issue_id': 2854, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '46dcaefb5a8c760b', 'authors': ['Changwoo Baek', 'Seungjun Shin', 'Kyeongbo Kong'], 'affiliations': ['Pusan National University', 'Sookmyung Womens University'], 'pdf_title_img': 'assets/pdf/title_img/2608.01247.jpg', 'data': {'categories': ['#long_context', '#optimization'], 'emoji': '💾', 'ru': {'title': 'Восстановление потерянной информации вместо просто её удаления из KV кэша', 'desc': 'RestoreKV — это метод сжатия KV кэша для больших языковых моделей, который улучшает качество работы при очень ограниченных бюджетах памяти. Вместо того чтобы только выбирать, какие пары ключ-значение сохранить, метод дополнительно обучает нейронную сеть восстанавливать потерянную информацию из контекста через специальные токены восстановления с использованием LoRA. Механизм восстановления универсален и обобщается на разные контексты, обучается через самодистилляцию с замораживанием исходной модели, требуя оптимизацию только 0,4% параметров. На практике RestoreKV значительно снижает деградацию производительности при сжатии, достигая 86,4% точности на бенчмарке RULER при 16-кратном сжатии кэша.'}, 'en': {'title': 'Enhancing KV Cache Efficiency with Learned Restoration', 'desc': 'The paper introduces RestoreKV, a novel approach to improve the efficiency of key-value (KV) cache eviction in machine learning models. Unlike traditional methods that focus solely on which KV pairs to keep, RestoreKV employs a learned restoration technique to recover lost information while maintaining a fixed budget. This method leverages shared mechanisms across different contexts to generate a compact restore cache after initial context prefill. The results show significant performance improvements across various benchmarks, demonstrating that RestoreKV can effectively reduce the degradation caused by compression in KV caches.'}, 'zh': {'title': 'RestoreKV：优化键值缓存的恢复机制', 'desc': '本文介绍了一种名为RestoreKV的新方法，用于在有限的键值（KV）缓存预算下优化信息恢复。与传统方法主要关注保留哪些原始KV对不同，RestoreKV通过学习恢复机制来补充选择过程，从而在相同的KV预算下提高性能。该方法利用上下文预填充后生成的恢复令牌，能够在一次LoRA适应的传递中生成紧凑的上下文条件恢复缓存。实验结果表明，RestoreKV在多个基准测试中显著减少了压缩引起的性能下降，提升了KVzip的准确性。'}}}, {'id': 'https://huggingface.co/papers/2607.00482', 'title': 'Know When to Stop: Segment-Level Credit Assignment for Reducing Overthinking', 'url': 'https://huggingface.co/papers/2607.00482', 'abstract': 'Abstract  Reasoning language models frequently overthink: generating extended chains of behaviors such as hedging, approach abandonment, and self contradiction that consume tokens without improving answers. We show that these behaviors are not merely a consequence of length; even when controlling for response length, incorrect traces exhibit higher rates of unproductive self-reflection than correct ones. Addressing this requires identifying where self-reflection helps vs hurts, but obtaining these step-level annotations is costly. We observe that intermediate answer commitments within reasoning traces can provide a cheap proxy: by comparing each final answer candidate in the trace to the ground truth, we can determine whether subsequent reflection is productive without any additional supervision. Building on this insight, we propose DASH (Drift Aware advantage SHaping), which assigns segment-level credit based on whether each reasoning segment leads toward or away from correctness. On competition-level math benchmarks, DASH achieves the highest accuracy where overthinking is prevalent (Average Accuracy: 59.45% vs. 58.1% Dr.GRPO vs. 56.95% GRPO) while reducing overthinking behaviors and achieving more productive self-correction than baselines.', 'score': 4, 'issue_id': 2856, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '2abb1aba42a2cb2e', 'authors': ['Chia-Hsuan Lee', 'Sihui Dai', 'Mingyang Zhou', 'Isha Slavin', 'Hsuan Su', 'Shi-Xiong Zhang', 'Sambit Sahu', 'William Campbell'], 'affiliations': ['Capital One'], 'pdf_title_img': 'assets/pdf/title_img/2607.00482.jpg', 'data': {'categories': ['#training', '#reasoning', '#math', '#optimization', '#rlhf'], 'emoji': '🧠', 'ru': {'title': 'От излишних размышлений к продуктивной саморефлексии', 'desc': 'В этой работе исследуется проблема излишнего размышления в языковых моделях, которые генерируют длинные цепочки рассуждений с бесполезными размышлениями, противоречиями и отказом от подходов. Авторы показывают, что неправильные рассуждения содержат больше непродуктивной саморефлексии даже при контроле длины ответа. Они предлагают использовать промежуточные ответы как дешёвый способ определить, помогает или мешает самокоррекция, без дополнительной разметки данных. Метод DASH присваивает кредит каждому сегменту рассуждения на основе того, приближает ли он модель к правильному ответу, достигая лучшей точности на математических бенчмарках и снижая излишние размышления.'}, 'en': {'title': 'DASH: Enhancing Reasoning Efficiency in Language Models', 'desc': 'This paper addresses the issue of reasoning language models that tend to overthink, leading to unproductive behaviors like hedging and self-contradiction. The authors find that these behaviors are not just due to longer responses; incorrect answers show more unproductive self-reflection even when length is controlled. To tackle this, they introduce DASH, a method that evaluates reasoning segments based on their contribution to correctness, using intermediate answer commitments as a low-cost proxy for supervision. The results demonstrate that DASH improves accuracy on math benchmarks while reducing overthinking and enhancing self-correction compared to existing methods.'}, 'zh': {'title': '减少过度思考，提升推理准确性', 'desc': '这篇论文探讨了推理语言模型在生成答案时过度思考的问题，导致产生无效的自我反思行为。研究发现，即使在控制回答长度的情况下，错误的推理链也会表现出更高的无效自我反思率。为了解决这个问题，作者提出了一种名为DASH的方法，通过比较推理过程中的每个最终答案与真实答案，来判断后续反思是否有助于提高正确性。DASH在数学基准测试中表现出色，能够减少过度思考行为，并实现更有效的自我修正。'}}}, {'id': 'https://huggingface.co/papers/2608.03994', 'title': 'When Attention Goes Blind: Numerical Failure in ALiBi Positional Encodings', 'url': 'https://huggingface.co/papers/2608.03994', 'abstract': "Abstract  We identify a previously overlooked failure mode of ALiBi positional encoding: its linear bias scaling underflows floating-point precision, which zeroes out a large fraction of attention weights and renders the affected attention heads partially blind. We analyze this failure mode, characterize its impact, and examine four mitigation strategies. We further demonstrate its occurrence in state-of-the-art pretrained models based on ALiBi. Comprehensive pretraining experiments with 148M-parameter decoder models help us to disentangle its effects from out-of-context degradation. We find that ALiBi's failure mode can substantially impair token retrieval while having only a minor effect on standard decoder benchmarks. We propose four training-time mitigation strategies and evaluate them individually and in combinations, finding that log-scaled distances yield the most consistent improvements in passkey retrieval. Despite this problem, default ALiBi slopes remain a surprisingly strong baseline, particularly for needle-in-a-haystack retrieval. Based on these findings we provide concrete recommendations on how to train models with ALiBi.", 'score': 4, 'issue_id': 2853, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '6cf99406cce40fb6', 'authors': ['Christopher Schröder', 'Lukas Gienapp', 'Ferdinand Schlatt', 'Martin Potthast', 'Gerhard Heyer'], 'affiliations': ['Institute for Applied Informatics at Leipzig University (InfAI)', 'ScaDS.AI Dresden/Leipzig', 'Seltz', 'University of Kassel', 'hessian.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.03994.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training', '#long_context'], 'emoji': '🔍', 'ru': {'title': 'Потеря точности в ALiBi: как спасти внимание модели от численного подтопления', 'desc': 'В статье выявлен ранее неизвестный недостаток позиционного кодирования ALiBi: линейное масштабирование смещения приводит к потере точности в вычислениях с плавающей точкой, что обнуляет значительную часть весов внимания и делает некоторые головки внимания частично неработающими. Авторы анализируют этот дефект, оценивают его влияние на модели и предлагают четыре стратегии его устранения. Проведены обширные эксперименты предобучения с моделями-декодерами размером 148M параметров, которые помогли разделить эффекты этого дефекта от других проблем. В результате исследования предложены конкретные рекомендации по обучению моделей с ALiBi и выявлено, что логарифмическое масштабирование расстояний дает наиболее стабильные улучшения в задачах поиска токенов.'}, 'en': {'title': "Mitigating ALiBi's Blindness: Enhancing Attention in Models", 'desc': "This paper discusses a problem with ALiBi positional encoding in machine learning models, where its linear bias scaling can lead to floating-point precision issues. This results in many attention weights being set to zero, causing some attention heads to become less effective, or 'blind'. The authors analyze this issue, explore its effects on model performance, and suggest four strategies to mitigate the problem. Their experiments show that while ALiBi can hinder token retrieval, it still performs well in certain tasks, leading to recommendations for better training practices."}, 'zh': {'title': '解决ALiBi编码的失败模式，提升模型性能', 'desc': '本文识别了ALiBi位置编码的一种被忽视的失败模式：其线性偏差缩放导致浮点精度下溢，从而使大量注意力权重归零，导致受影响的注意力头部分失明。我们分析了这种失败模式，描述了其影响，并研究了四种缓解策略。通过对148M参数解码器模型的全面预训练实验，我们发现ALiBi的失败模式会显著影响令牌检索，但对标准解码器基准测试的影响较小。我们提出了四种训练时的缓解策略，并评估了它们的单独和组合效果，发现对数缩放距离在检索性能上提供了最一致的改善。'}}}, {'id': 'https://huggingface.co/papers/2608.02703', 'title': 'ARCHead: Activation-Metric Residual Correction for Large Language Model Output Heads', 'url': 'https://huggingface.co/papers/2608.02703', 'abstract': 'Abstract  Weight-only quantization substantially reduces the storage of large language model (LLM) transformer blocks, but practical backends often retain the final language-modeling head (LM-head) in BF16 or FP16. Quantizing this projection naively can strongly perturb the vocabulary-logit distribution. We present ARCHead, a packed LM-head compressor that combines a quantized low-rank core, group-wise INT4 residuals, and a low-rank correction fitted in an activation-derived metric. ARCHead stores no dense BF16 head and reduces persistent LM-head storage by 3.7-3.9x. On Qwen3-8B-Base, it uses 25.6% of BF16 head storage while attaining 1.007 relative perplexity; storage-matched naive INT4 yields 1.14-1.16. Replacing the BF16 head left by AWQ or bitsandbytes adds only 0.006-0.007 cross-entropy, with less than 2% throughput change in our measurements. ARCHead therefore complements block quantizers by compressing the large output projection they can leave untouched. Code is available at https://github.com/suayptalha/archead.', 'score': 4, 'issue_id': 2855, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '62dae80e8892ea94', 'authors': ['Şuayp Talha Kocabay', 'Talha Rüzgar Akkuş', 'Kamer Ali Yuksel'], 'affiliations': ['Independent Researcher', 'aiXplain, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2608.02703.jpg', 'data': {'categories': ['#optimization', '#open_source'], 'emoji': '📦', 'ru': {'title': 'Эффективная компрессия выходного слоя через умную квантизацию и низкоранговую аппроксимацию', 'desc': 'В статье предлагается метод ARCHead для квантизации финального слоя языковых моделей (LM-head), который обычно остаётся в высокой точности при квантизации трансформеров. Метод сочетает низкорангову компрессию, групповую квантизацию INT4 и коррекцию, оптимизированную в пространстве активаций. ARCHead достигает сжатия в 3.7-3.9 раза при сохранении качества модели, используя только 25.6% памяти исходного слоя с относительной перплексией 1.007. Метод хорошо интегрируется с существующими квантизаторами блоков и обеспечивает значительное снижение размера модели с минимальными потерями в точности.'}, 'en': {'title': 'Efficient Compression of Language-Modeling Heads with ARCHead', 'desc': 'This paper introduces ARCHead, a novel method for compressing the language-modeling head (LM-head) of large language models (LLMs) while maintaining performance. ARCHead utilizes a combination of quantized low-rank cores and group-wise INT4 residuals to significantly reduce storage requirements without the need for a dense BF16 head. The method achieves a storage reduction of 3.7-3.9 times compared to traditional approaches, while only slightly increasing cross-entropy and maintaining throughput. This approach effectively complements existing block quantization techniques by optimizing the output projection layer of LLMs.'}, 'zh': {'title': 'ARCHead：高效压缩语言模型输出层', 'desc': '本文提出了一种名为ARCHead的压缩方法，用于优化大型语言模型的输出层存储。ARCHead结合了量化的低秩核心、分组INT4残差和基于激活的低秩修正，从而显著减少了语言模型头的存储需求。通过这种方法，ARCHead在保持相对困惑度的同时，将存储需求减少了3.7到3.9倍。实验结果表明，ARCHead在存储效率和计算性能上均表现优异，适用于大型语言模型的实际应用。'}}}, {'id': 'https://huggingface.co/papers/2608.03756', 'title': 'LegalPincite: Multi-level Legal Information Retrieval Dataset', 'url': 'https://huggingface.co/papers/2608.03756', 'abstract': 'Abstract  A common task in legal Information Retrieval (IR) is to find relevant legal sources from case-law collections. While legal practice often requires pinpoint citations (pincites) to specific case paragraphs, most existing public legal IR datasets lack paragraph-level citation annotations. Yet, publicly available datasets with such information contain data leakage in the query text and exclude paragraphs that are neither citing nor cited from the corpora, creating an unrealistic and oversimplified retrieval setting, potentially leading to inflated performance. To address these limitations, we contribute a large-scale legal IR dataset constructed from Court of Justice of the European Union (CJEU) judgments. The dataset contains: (i) masked case/paragraph queries, with removed citation information; (ii) a corpus that includes all paragraphs; and (iii) case- and paragraph-level ground-truth citations, with partial human expert validation. Our dataset supports both the development and rigorous evaluation of legal IR methods, at multiple query-document levels (case-to-case, paragraph-to-case, and paragraph-to-paragraph retrieval). Link to dataset: https://huggingface.co/datasets/theresiavr/legalpincite', 'score': 3, 'issue_id': 2855, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '2a09a868a230de0e', 'authors': ['Theresia Veronika Rampisela', 'Henrik Palmer Olsen', 'Giovanni Colavizza'], 'affiliations': ['Faculty of Law, University of Copenhagen', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2608.03756.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Точное цитирование в правовом поиске через многоуровневую аннотацию', 'desc': 'В статье представлен новый датасет для поиска релевантных правовых источников в коллекциях судебных решений Европейского суда. Авторы решили проблему нехватки аннотаций на уровне абзацев, которые необходимы для точного цитирования конкретных фрагментов судебных постановлений. Датасет включает маскированные запросы без информации о цитированиях, корпус со всеми абзацами и экспертную валидацию цитирований на уровне как дел, так и отдельных абзацев. Это позволяет разрабатывать и оценивать методы поиска на нескольких уровнях детализации: от дела к делу, от абзаца к делу и от абзаца к абзацу.'}, 'en': {'title': 'Enhancing Legal IR with Comprehensive Citation Data', 'desc': 'This paper addresses the challenges in legal Information Retrieval (IR) by introducing a new dataset that includes detailed paragraph-level citation information. Existing datasets often suffer from data leakage and do not represent the complexity of legal citations, which can lead to misleading performance metrics. The proposed dataset is derived from judgments of the Court of Justice of the European Union and includes masked queries and comprehensive paragraph coverage. It enables the development and evaluation of legal IR methods across various retrieval levels, enhancing the accuracy and reliability of legal information searches.'}, 'zh': {'title': '构建真实的法律信息检索数据集', 'desc': '本论文讨论了法律信息检索中的一个常见任务，即从案例法集合中找到相关的法律来源。现有的公共法律信息检索数据集通常缺乏段落级的引用注释，这使得法律实践中需要的精确引用变得困难。为了解决这些问题，作者构建了一个大规模的法律信息检索数据集，包含了来自欧洲法院的判决。该数据集支持多种查询-文档级别的检索方法开发和评估，提供了更真实的检索环境。'}}}, {'id': 'https://huggingface.co/papers/2608.03419', 'title': 'Multi-Task Multi-Frame Visual Piano Transcription', 'url': 'https://huggingface.co/papers/2608.03419', 'abstract': 'Abstract  Audio-based piano transcription performs well on onset, pitch, and velocity, but the sustain pedal lets sound persist long after key release, so audio systems predict pedal-extended offsets rather than physical key release. Yet existing Visual Piano Transcription (VPT) systems focus on onset detection from short video windows, offset accuracy lags onset by a wide margin, and note-level velocity has not been reported. To address these gaps, we present V2N (Video to Notes), the first complete VPT system: a shared temporal backbone feeds task-specific heads for onset, offset, key hold, and velocity, jointly trained with per-frame supervision rather than only at the window center. Ablations show that multi-task supervision enables offset and velocity prediction while improving onset accuracy; longer temporal context yields further improvements. V2N sets new state-of-the-art results on PianoVAM and R3.', 'score': 3, 'issue_id': 2853, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '981ff7ad9bd09a20', 'authors': ['Yonghyun Kim', 'Hoyeol Sohn', 'Juhan Nam', 'Alexander Lerch'], 'affiliations': ['Graduate School of Culture Technology, KAIST, South Korea', 'Music Informatics Group, Georgia Institute of Technology, USA'], 'pdf_title_img': 'assets/pdf/title_img/2608.03419.jpg', 'data': {'categories': [], 'emoji': '🎹', 'ru': {'title': 'От видео к музыке: полная визуальная транскрипция фортепиано', 'desc': 'В статье представлена V2N — первая полная система визуальной транскрипции фортепиано, которая предсказывает не только начало нот, но и их завершение, удержание педали и динамику. Система использует общий временной backbone с несколькими специализированными головками для каждой задачи, обученными с супервизией на каждом кадре. Авторы показали, что многозадачное обучение значительно улучшает точность предсказания окончания нот и силы звука, а увеличение временного контекста дает дополнительные улучшения. V2N достигает новых результатов на бенчмарках PianoVAM и R3.'}, 'en': {'title': 'V2N: Revolutionizing Piano Transcription with Video!', 'desc': 'This paper introduces V2N, a novel Visual Piano Transcription (VPT) system that improves the accuracy of detecting musical notes from video. Unlike previous systems that only focused on the onset of notes, V2N also predicts the offset, key hold duration, and velocity of each note. The system uses a shared temporal backbone with task-specific heads, allowing it to learn from the entire video frame sequence rather than just the center. The results show that V2N achieves state-of-the-art performance on benchmark datasets by leveraging multi-task learning and longer temporal context.'}, 'zh': {'title': 'V2N：视觉钢琴转录的新突破', 'desc': '这篇论文介绍了一种新的视觉钢琴转录系统V2N（Video to Notes），旨在解决现有系统在音符偏移和力度预测方面的不足。V2N通过共享时间骨干网络，结合任务特定的头部，能够同时预测音符的开始、结束、按键保持和力度。与传统方法不同，V2N采用逐帧监督的方式进行联合训练，从而提高了音符的准确性。实验结果表明，V2N在PianoVAM和R3数据集上达到了新的最先进水平。'}}}, {'id': 'https://huggingface.co/papers/2608.02791', 'title': 'Better, Stronger, Faster, and Broader: Structured All-Mask Prediction for MLLM-Based Segmentation', 'url': 'https://huggingface.co/papers/2608.02791', 'abstract': "Abstract  MLLM-based segmentation faces a core segmentation trilemma: high segmentation performance, preserved dialogue ability, and fast inference. Embedding-prediction methods may disrupt language modeling through pixel-level objectives, whereas next-token generation is inefficient for dense masks. We propose All-Mask Prediction, decoupling autoregressive dialogue from non-autoregressive mask prediction. Its binary instantiation, STAMP (Simultaneous Textual All-Mask Prediction), emits an in-vocabulary <SEG> trigger, fuses image-aligned mask tokens with corresponding patch features, and uses hybrid attention to classify all tokens as foreground or background in one pass. It thereby combines strong referring and reasoning segmentation with preserved multimodal ability and efficient inference. However, binary masks cannot retain multiple semantic or instance identities without repeated target-specific predictions. We therefore propose Structured All-Mask Prediction and develop STAMPlus. It generates a target list with explicit IDs and optional boxes, binds these IDs to a shared multi-class mask space, and jointly predicts all targets in one non-autoregressive pass. A single unified checkpoint retains STAMP's referring and reasoning capabilities while extending to open-vocabulary semantic, instance-aware, and remote-sensing small-target segmentation, where high-resolution mask-token scaling preserves finer spatial evidence. Across these settings, STAMPlus achieves state-of-the-art segmentation performance, preserves general multimodal instruction following, and reduces 12-category latency from 13.50s for repeated STAMP inference to 5.16s. Further analyses show that accurate target cues improve segmentation and learned spatial grounding benefits look-twice reasoning. Overall, STAMPlus resolves the trilemma beyond single-target prediction.", 'score': 3, 'issue_id': 2853, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'ba82e8799bc6185a', 'authors': ['Jiazhen Liu', 'Mingkuan Feng', 'Long Chen'], 'affiliations': ['The Hong Kong University of Science and Technology (HKUST)'], 'pdf_title_img': 'assets/pdf/title_img/2608.02791.jpg', 'data': {'categories': ['#multimodal', '#cv', '#inference'], 'emoji': '🎭', 'ru': {'title': 'Единая маска для всех: преодоление триллеммы в сегментации мультимодальных моделей', 'desc': 'Статья предлагает решение для многомодальных больших языковых моделей (MLLM), которые одновременно должны выполнять сегментацию изображений, поддерживать диалоговые способности и работать быстро. Авторы разделяют аутогрессивное предсказание текста от неаутогрессивного предсказания масок, предложив метод All-Mask Prediction с двумя реализациями: STAMP для двоичной маски и STAMPlus для многокласовой структурированной сегментации. STAMPlus генерирует список целевых объектов с ID и опциональными ограничивающими прямоугольниками, затем предсказывает все маски в один проход через совместный гибридный механизм внимания. Модель достигает лучших результатов в различных задачах сегментации (семантической, инстансной и для отслеживания малых объектов на спутниковых снимках) при сохранении способности следовать инструкциям и ускорении вычислений в 2.6 раза.'}, 'en': {'title': 'Revolutionizing Segmentation: Fast, Accurate, and Multimodal!', 'desc': 'This paper addresses the challenges in machine learning-based segmentation, specifically the balance between high performance, dialogue capability, and fast inference. The authors introduce All-Mask Prediction, which separates the tasks of dialogue generation and mask prediction to improve efficiency. They present STAMP, a method that uses a special trigger to classify image segments in one go, enhancing both segmentation quality and speed. The advanced STAMPlus further refines this by allowing for multiple target identities in a single prediction pass, achieving state-of-the-art results while maintaining multimodal functionality and significantly reducing processing time.'}, 'zh': {'title': '解决分割三难问题的全新方法', 'desc': '本文提出了一种新的分割方法，称为结构化全掩码预测（Structured All-Mask Prediction），旨在解决高分割性能、对话能力保持和快速推理之间的矛盾。通过引入目标列表和共享多类掩码空间，STAMPlus能够在一次非自回归的推理中同时预测多个目标。该方法在保持多模态能力的同时，显著提高了分割性能，并将推理时间从13.50秒减少到5.16秒。最终，STAMPlus超越了单目标预测的限制，实现了更高效的语义和实例分割。'}}}, {'id': 'https://huggingface.co/papers/2608.03506', 'title': 'When Many Answers Are Valid, Voting Fails: Symbolic Verification for Best-of-K Causal Reasoning in LLMs', 'url': 'https://huggingface.co/papers/2608.03506', 'abstract': "Abstract  Self-consistency assumes the most frequent answer among sampled reasoning traces is the most reliable, but this can fail in causal reasoning: samples often repeat the same confounding error, and votes fragment across multiple valid answers, letting an invalid answer win despite a valid minority trace. We introduce CALVER (Causal Axiom-Level VERification), a training-free symbolic verifier that scores structured traces against Pearl's causal criteria, including -separation, backdoor adjustment, and intervention, and selects the highest-scoring candidate without consulting a reference answer. On CLEAR find-one-valid queries that admit multiple graph-valid answers, CALVER reaches 42.1% where plurality, a reward model, an LLM judge, and model confidence remain near 30% on identical frozen pools. Scaling the judge to 72B does not close the gap. In an audited clean-core subset, 11 of 21 graph-valid CALVER selections differ from the benchmark's listed answer while still satisfying the requested predicate. The advantage widens with the sampling budget and reproduces across ten published Bayesian networks, a second model family, and settings where the model must build the graph from text. CALVER also improves thresholded average-treatment-effect decisions against exact ground truth, generalizes to logic under a truth-table checker, and scores each candidate in milliseconds on CPU. CALVER needs only a causal structure, supplied outright or built from the text; wherever that holds, selection can aggregate via causal validity.", 'score': 2, 'issue_id': 2856, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '792a9107d5d8321f', 'authors': ['Omatharv Bharat Vaidya', 'Connor Thomas Jerzak', 'Zayne Rea Sprague', 'Fangcong Yin', 'Nhat Ho'], 'affiliations': ['New York University', 'The University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2608.03506.jpg', 'data': {'categories': ['#benchmark', '#math', '#interpretability', '#reasoning'], 'emoji': '🔀', 'ru': {'title': 'Проверка причинных рассуждений по аксиомам вместо голосования', 'desc': 'В статье рассматривается проблема выбора правильного ответа в задачах причинно-следственного рассуждения, где частотный метод (выбор наиболее частого ответа) часто дает сбой из-за повторяющихся систематических ошибок в сэмплах. Авторы предлагают CALVER — символический верификатор без обучения, который оценивает структурированные цепочки рассуждений на соответствие причинным критериям Перла (d-разделение, бэкдор-регулировка, интервенция) и выбирает наиболее подходящий ответ без обращения к эталонному решению. На бенчмарке CLEAR CALVER достигает 42.1% точности против 30% у стандартных методов, включая голосование большинством и моделей-судей, причем преимущество сохраняется при масштабировании и воспроизводится на множестве байесовских сетей. Метод обобщается на логические задачи и работает за миллисекунды на CPU, требуя лишь причинную структуру как вход.'}, 'en': {'title': 'CALVER: Elevating Causal Reasoning with Symbolic Verification', 'desc': 'This paper presents CALVER, a new method for verifying causal reasoning in machine learning. Unlike traditional self-consistency approaches that may be misled by repeated errors, CALVER uses causal criteria to evaluate reasoning traces. It scores these traces based on their adherence to established causal principles, allowing it to select the most valid answer without needing a reference. The results show that CALVER significantly outperforms existing methods in identifying valid answers in complex causal scenarios.'}, 'zh': {'title': 'CALVER：提升因果推理的选择准确性', 'desc': '自一致性假设认为在采样推理轨迹中最频繁的答案是最可靠的，但在因果推理中，这种假设可能会失败。因为样本常常重复相同的混淆错误，导致有效答案的投票分散，从而让无效答案获胜。我们提出了CALVER（因果公理级别验证），这是一种无训练的符号验证器，可以根据Pearl的因果标准对结构化轨迹进行评分，并选择得分最高的候选答案。CALVER在处理多个图有效答案的查询时表现优异，显著提高了选择的准确性。'}}}, {'id': 'https://huggingface.co/papers/2608.03972', 'title': 'ReflectRL: Learning from Golden Negative Trajectories via Reflective-to-Direct Reasoning', 'url': 'https://huggingface.co/papers/2608.03972', 'abstract': 'Abstract  On-policy training has emerged as a powerful post-training paradigm for improving the reasoning capabilities of large language models, and is often enhanced by golden trajectories from stronger expert models. However, when the expert fails on harder problems, existing trajectory-guided methods lose their main source of supervision, and these failed trajectories are typically discarded as negative samples. We argue that such failures, which we call Golden Negative Trajectories, can still provide valuable reasoning signals when treated not as demonstrations to imitate, but as flawed trajectories to reflect upon. We identify a Reflection Advantage: for hard problems, reflecting on a flawed trajectory can be easier and more effective than solving the problem directly from scratch. Motivated by this, we propose ReflectRL, a lightweight plug-and-play framework that learns from Golden Negative Trajectories during on-policy training. ReflectRL first uses these trajectories to elicit Reflective Reasoning, then applies Reflective-to-Direct Policy Transition to transfer the acquired reasoning behavior back to Direct Reasoning. Experiments across 9 benchmarks, 4 LLM backbones, and 4 on-policy training methods show that ReflectRL consistently improves reasoning performance with minimal overhead.', 'score': 2, 'issue_id': 2855, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '9f161a50e1b70bc5', 'authors': ['Jinhe Bi', 'Chennan Zhou', 'Zengjie Jin', 'Aniri', 'Shuo Lu', 'Wenke Huang', 'Hu Cao', 'Xun Xiao', 'Zhihong Zhu', 'Volker Tresp', 'Fei Shen', 'Yunpu Ma', 'Tat-Seng Chua'], 'affiliations': ['Huawei Heisenberg Research Center', 'Institute of Automation, Chinese Academy of Sciences', 'Ludwig Maximilian University of Munich', 'Munich Center for Machine Learning', 'Nanyang Technological University', 'National University of Singapore', 'Peking University', 'Southeast University', 'Technical University of Munich'], 'pdf_title_img': 'assets/pdf/title_img/2608.03972.jpg', 'data': {'categories': ['#rl', '#training', '#rlhf'], 'emoji': '🪞', 'ru': {'title': 'Учимся на ошибках: размышление над неудачными траекториями для усиления рассуждений LLM', 'desc': 'В статье предлагается метод ReflectRL для улучшения способностей больших языковых моделей к рассуждению на этапе постобучения. Авторы утверждают, что неудачные траектории экспертных моделей содержат ценную информацию и могут использоваться как материал для размышлений вместо того, чтобы быть отброшенными. Они вводят концепцию «Reflection Advantage» — идею о том, что размышление над ошибочной траекторией часто проще и эффективнее, чем решение задачи с нуля. ReflectRL применяет рефлективное рассуждение к неудачным траекториям и затем передаёт полученные знания обратно в прямое рассуждение через механизм перехода.'}, 'en': {'title': 'Learning from Mistakes: Harnessing Golden Negative Trajectories for Better Reasoning', 'desc': "This paper introduces ReflectRL, a new framework that enhances on-policy training for large language models by utilizing Golden Negative Trajectories, which are flawed paths from expert models. Instead of discarding these failed attempts, ReflectRL treats them as opportunities for Reflective Reasoning, allowing models to learn from their mistakes. The framework facilitates a transition from Reflective Reasoning to Direct Reasoning, improving the model's ability to tackle difficult problems. Experiments demonstrate that ReflectRL significantly boosts reasoning performance across various benchmarks with little additional computational cost."}, 'zh': {'title': '利用失败轨迹提升推理能力的创新方法', 'desc': '本论文提出了一种新的训练方法，称为ReflectRL，旨在利用专家模型的失败轨迹（即黄金负轨迹）来提升大型语言模型的推理能力。我们认为，这些失败的轨迹可以作为反思的基础，而不仅仅是负样本被丢弃。通过反思这些有缺陷的轨迹，模型可以更有效地学习解决困难问题。实验结果表明，ReflectRL在多个基准测试中表现出色，能够在保持低开销的情况下显著提高推理性能。'}}}, {'id': 'https://huggingface.co/papers/2608.03507', 'title': 'ChronoLens: Measuring Language Change Across Time, Languages, and Linguistic Levels', 'url': 'https://huggingface.co/papers/2608.03507', 'abstract': 'Abstract  Historical language change affects morphology, syntax, semantics, and pragmatics, yet computational studies typically examine these levels with incompatible representations and therefore cannot determine whether they evolve together across languages. We address this problem by asking how the magnitude and direction of change vary across linguistic levels, languages, and historical periods within a single analytical space. We introduce ChronoLens, a framework that combines frozen multilingual language models, feature-aligned crosscoders, and post-hoc linguistic interventions, and apply it to 44.98 million documents and approximately 17.2 billion tokens from five parliamentary traditions spanning 1803--2026. The resulting sparse representations agree substantially more strongly with linguistic statistics than dense embeddings or a pooled sparse autoencoder (ρ=0.72 versus 0.29 and 0.28), and reveal that morphology, syntax, semantics, and pragmatics generally change by comparable amounts within a language, while languages differ markedly in when, how far, and in which direction they change. These findings show that historical language change is a structured, multidimensional process: similar magnitudes can conceal different trajectories, and meaningful cross-linguistic comparison requires measuring both distance and direction.', 'score': 1, 'issue_id': 2854, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'b8d62183d29d2723', 'authors': ['Gagan Bhatia', 'Julian Schlenker', 'Simone Paolo Ponzetto', 'Steffen Eger'], 'affiliations': ['University of Mannheim', 'University of Technology Nuremberg'], 'pdf_title_img': 'assets/pdf/title_img/2608.03507.jpg', 'data': {'categories': [], 'emoji': '⏳', 'ru': {'title': 'Многомерный анализ исторической эволюции языка через замороженные модели', 'desc': 'В работе предложена система ChronoLens для изучения исторических изменений языка на разных уровнях анализа: морфологии, синтаксисе, семантике и прагматике. Авторы использовали замороженные многоязычные языковые модели и специальные методы кодирования для анализа 44.98 миллионов документов из пяти парламентских традиций с 1803 по 2026 год. Полученные разреженные представления показали гораздо более сильную корреляцию с лингвистическими статистиками, чем плотные эмбеддинги. Исследование доказывает, что языковые изменения – это структурированный многомерный процесс, где разные языки развиваются по-разному во времени, и для корректного сравнения необходимо измерять как величину, так и направление изменений.'}, 'en': {'title': 'ChronoLens: Unraveling the Dimensions of Language Change', 'desc': 'This paper introduces ChronoLens, a novel framework designed to analyze historical language change across multiple linguistic levels such as morphology, syntax, semantics, and pragmatics. By utilizing frozen multilingual language models and feature-aligned crosscoders, the framework allows for a comprehensive examination of language evolution over time and across different languages. The study analyzes a vast dataset of nearly 45 million documents, revealing that while different languages change in distinct ways, the magnitude of change is often comparable across linguistic levels. The findings emphasize the importance of considering both the distance and direction of change for meaningful comparisons in historical linguistics.'}, 'zh': {'title': '揭示历史语言变化的多维结构', 'desc': '这篇论文探讨了历史语言变化对形态学、句法学、语义学和语用学的影响。研究提出了ChronoLens框架，结合了多语言模型和特征对齐的跨编码器，分析了来自五个议会传统的文档数据。结果表明，语言的不同层面在变化幅度上通常是相似的，但不同语言在变化的时间、程度和方向上存在显著差异。研究表明，历史语言变化是一个结构化的多维过程，跨语言比较需要同时考虑变化的距离和方向。'}}}, {'id': 'https://huggingface.co/papers/2608.02833', 'title': 'CURV: Enhancing Chart Understanding Through Curriculum Visual Grounded Reasoning', 'url': 'https://huggingface.co/papers/2608.02833', 'abstract': 'Abstract  Chart question answering (CQA) requires multimodal large language models (MLLMs) to integrate visual comprehension with logical reasoning, yet current models struggle with accurate visual grounding and coherent reasoning chains. While extrinsic chain-of-thought prompting and visual cues significantly improve performance, current MLLMs lack intrinsic visual grounded reasoning capabilities, leading to inaccurate perception and reasoning disconnected from visual evidence. To address these limitations, we propose CURV, a curriculum learning framework that develops intrinsic visual reasoning capabilities by reformulating CQA as multi-step visual grounded reasoning, where each step coordinates logical reasoning with dynamic visual grounding through spatial attention concentration. To assist model learning, we further introduce CCQA, a three-level curriculum dataset with scalable synthetic generation across diverse chart types and reasoning patterns. Our curriculum systematically progresses from basic single-operation reasoning to complex multi-chart compositional tasks. Experiments demonstrate that CURV achieves up to uparrow20.50% improvements over baselines and is generalizable to real-world benchmarks (up to uparrow12.30%) and out-of-domain multimodal reasoning tasks (up to uparrow10.20%), validating the effectiveness of internalizing visual reasoning with dynamic grounding for enhanced chart understanding capabilities. Code is available at: https://xhguo7.github.io/CURV/.', 'score': 0, 'issue_id': 2855, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'ffc94a3a05ff4bb6', 'authors': ['Xuehang Guo', 'Pingyue Zhang', 'Ruiyi Zhang', 'Zhenhailong Wang', 'Hanrui Lyu', 'Heng Ji', 'Tong Sun', 'Qingyun Wang', 'Manling Li'], 'affiliations': ['Adobe', 'Northwestern University', 'UIUC', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2608.02833.jpg', 'data': {'categories': [], 'emoji': '📊', 'ru': {'title': 'Встроенное визуальное рассуждение для понимания диаграмм через динамическую фокусировку внимания', 'desc': 'В статье представлена CURV — фреймворк на основе curriculum learning, который обучает многомодальные большие языковые модели (MLLM) внутренним способностям визуального рассуждения для ответов на вопросы о диаграммах. Ключевая идея заключается в переформулировке задачи как многошаговой визуально обоснованной логической цепочки, где каждый шаг координирует рассуждение с динамической фокусировкой внимания на релевантных элементах диаграммы. Авторы также создали CCQA — трёхуровневый синтетический датасет, который прогрессирует от простых операций к сложным многодиаграммным задачам. Экспериментальные результаты показывают значительное улучшение производительности: до 20.5% на тестовых наборах и до 12.3% на реальных бенчмарках, что подтверждает эффективность встроенного визуального рассуждения с динамической привязкой к деталям изображения.'}, 'en': {'title': 'Enhancing Chart Understanding through Intrinsic Visual Reasoning', 'desc': 'This paper introduces CURV, a new framework designed to improve chart question answering (CQA) by enhancing the intrinsic visual reasoning abilities of multimodal large language models (MLLMs). The authors reformulate CQA into a multi-step process that combines logical reasoning with visual grounding, using spatial attention to focus on relevant visual elements. They also present CCQA, a curriculum dataset that helps train models progressively from simple to complex reasoning tasks involving various chart types. Experimental results show that CURV significantly outperforms existing models, demonstrating its effectiveness in integrating visual and logical reasoning for better understanding of charts.'}, 'zh': {'title': '提升图表问答的内在视觉推理能力', 'desc': '这篇论文讨论了图表问答（CQA）中多模态大语言模型（MLLMs）在视觉理解和逻辑推理方面的挑战。当前模型在视觉基础和推理链的连贯性上存在不足，导致推理与视觉证据脱节。为了解决这些问题，作者提出了CURV，一个通过多步骤视觉基础推理来提升内在视觉推理能力的课程学习框架。实验结果表明，CURV在基准测试中显著提高了性能，验证了动态视觉基础对图表理解能力的增强效果。'}}}, {'id': 'https://huggingface.co/papers/2607.23802', 'title': 'From RLVR to RLSVR: Task Transformation Induces Self-Verifiable Rewards for Open-Ended LLM Self-Improvement', 'url': 'https://huggingface.co/papers/2607.23802', 'abstract': 'Abstract  Reinforcement Learning with Verifiable Rewards (RLVR) has driven recent progress in reasoning-oriented large language models (LLMs) by enabling large-scale optimization. However, its applicability remains largely limited to domains such as mathematics and coding, where correctness can be deterministically verified. Open-ended tasks instead often rely on human preferences, reward models, or LLM-based judges, introducing evaluation bias, judge capability bottlenecks, and additional inference costs.Drawing on the principle of self-supervised learning, which constructs pretext tasks to derive supervision from the data itself, we propose Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a task-transformation-based training paradigm for extending RLVR to open-ended tasks. RLSVR transforms open-ended tasks into verifiable proxy environments whose internal rules and interaction outcomes automatically generate reward signals. We instantiate RLSVR with SpyRL, a multi-agent self-play environment inspired by Who Is the Spy?. Agents receive asymmetric information, complete the same target task, and vote to identify a designated spy. Because the spy identity is predetermined, voting outcomes provide fully verifiable rewards, while successful identification remains closely related to output quality. Experiments on text summarization, creative writing, and mathematical reasoning show that SpyRL outperforms existing self-improvement methods on non-verifiable tasks and yields consistent gains on verifiable reasoning tasks. These results demonstrate that task transformation can extend scalable RLVR-based self-improvement beyond inherently verifiable domains. Models and code have been released at https://github.com/wangqinsi1/SpyRL.', 'score': 71, 'issue_id': 2828, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'aee77672c906db77', 'authors': ['Qinsi Wang', 'Jing Shi', 'Huazheng Wang', 'Kun Wan', 'Yiran Wu', 'Bo Liu', 'Qingyun Wu', 'Hai Helen Li', 'Yiran Chen', 'Handong Zhao', 'Wentian Zhao'], 'affiliations': ['Adobe Inc.', 'Amazon', 'Duke University', 'National University of Singapore', 'Oregon State University', 'Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.23802.jpg', 'data': {'categories': ['#rl', '#open_source', '#reasoning', '#agents', '#rlhf', '#alignment', '#training'], 'emoji': '🕵️', 'ru': {'title': 'Трансформация задач для масштабируемого обучения с самопроверяемыми наградами', 'desc': 'В статье предлагается метод Reinforcement Learning с Self-Verifiable Rewards (RLSVR), который расширяет применение обучения с подтвер
