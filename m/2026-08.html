ategories': ['#training', '#open_source', '#benchmark', '#alignment', '#rlhf'], 'emoji': '🛡️', 'ru': {'title': 'Конституционное предтренирование для долговечного выравнивания больших языковых моделей', 'desc': 'Исследователи проверили, можно ли достичь устойчивого выравнивания языковых моделей путём внедрения принципиальных инструкций на этапе предтренировки, а не только на этапе послетренировочного выравнивания. Они провели конституционное предтренирование на 120 млрд параметров, используя корпус из 394M токенов на основе Конституции Anthropic и факториальный дизайн с разными порядками обучения и методами рассуждения. Модели, прошедшие конституционное предтренирование, показали лучшее обобщение выравнивания и его устойчивость при последующих этапах обучения, особенно в сценариях с шантажом. Важный результат: конституционное содержимое на этапе предтренировки не снижает производительность модели на стандартных бенчмарках и может стать дешёвым дополнением к существующим методам выравнивания.'}, 'en': {'title': 'Enhancing Model Alignment with Constitutional Midtraining', 'desc': 'This paper explores the concept of constitutional midtraining, which involves integrating values-based content into the training of machine learning models to enhance their alignment with human values. The authors conducted experiments using a large dataset to compare the effectiveness of this midtraining approach against a control group that only used replay methods. Results showed that models trained with constitutional content demonstrated better alignment and resilience against issues like blackmail, even after further fine-tuning. The findings suggest that adding a small amount of principled content during midtraining can significantly improve the durability of alignment without compromising model performance.'}, 'zh': {'title': '宪法中训练：提升模型对齐的有效方法', 'desc': '这篇论文探讨了后训练对齐的局限性，尤其是在微调后可能会减弱。研究者们提出了一种新的方法，称为宪法中训练，旨在通过在中训练阶段插入基于价值观的内容来增强模型的对齐能力。实验结果表明，宪法中训练的模型在对齐的泛化和持久性方面优于对照组，尤其是在应对勒索情境时表现更佳。该方法在不影响模型能力的前提下，提供了一种廉价且有效的补充方案，能够在微调中心的训练流程中实现持久的对齐提升。'}}}, {'id': 'https://huggingface.co/papers/2607.29684', 'title': 'Toward Robust and 3D-Aware RGB-NIR Imaging in the Dark', 'url': 'https://huggingface.co/papers/2607.29684', 'abstract': 'Abstract  Robust low-light imaging remains challenging for the community. Recent studies have explored fusing Near-Infrared (NIR) with noisy RGB to achieve improved enhancement, yet most methods depend on carefully curated training data pairs, with limited robustness under different scenarios. This paper offers a new perspective for RGB-NIR low-light imaging by incorporating 3D-aware neural modeling. Without using clean RGB supervision, a powerful model can be optimized to implicitly fuse extremely noisy RGB observations with NIR cues in 3D space, effectively recovering clean RGB images. The proposed model obviates the requirement for clean RGB data collection, generalizes across different noise levels. Extensive evaluations on synthetic and real data demonstrate its superiority. Codes available: https://github.com/MyNiuuu/3DarkFusion', 'score': 2, 'issue_id': 2830, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '96fe3f7bc63a4738', 'authors': ['Muyao Niu', 'Mingze Ma', 'Yifan Zhan', 'Qingtian Zhu', 'Zhihang Zhong', 'Wei Guo', 'Chang Wen Chen', 'Yinqiang Zheng'], 'affiliations': ['Adelaide University', 'Hong Kong Polytechnic University', 'School of Artificial Intelligence (SAI) Shanghai Jiao Tong University', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2607.29684.jpg', 'data': {'categories': [], 'emoji': '🌙', 'ru': {'title': 'Восстановление светлых изображений в темноте через трёхмерное слияние RGB и инфракрасных данных', 'desc': 'Статья предлагает новый подход к улучшению изображений в условиях слабого освещения путём объединения RGB и ближнего инфракрасного (NIR) спектра с использованием 3D-aware нейронного моделирования. Основное преимущество метода заключается в том, что он не требует чистых RGB изображений для обучения, что избавляет от необходимости дорогостоящей подготовки данных. Модель неявно фузирует очень шумные RGB наблюдения с NIR сигналами в трёхмерном пространстве, эффективно восстанавливая качественные RGB изображения. Метод демонстрирует хорошую обобщаемость на разные уровни шума и показывает превосходные результаты на синтетических и реальных данных.'}, 'en': {'title': 'Enhancing Low-Light Imaging with 3D Neural Fusion', 'desc': 'This paper addresses the challenge of improving low-light imaging by combining Near-Infrared (NIR) and noisy RGB images. It introduces a novel approach that utilizes 3D-aware neural modeling to enhance image quality without needing clean RGB supervision. The model effectively merges noisy RGB data with NIR information in a 3D context, allowing for the recovery of clearer RGB images. The results show that this method outperforms existing techniques across various noise conditions, making it more robust and versatile.'}, 'zh': {'title': '无监督低光照成像的新方法', 'desc': '本论文探讨了低光照成像的挑战，提出了一种新的方法来融合近红外（NIR）和噪声较大的RGB图像。通过引入3D感知神经建模，该方法无需干净的RGB监督，能够在3D空间中有效地将极其嘈杂的RGB观测与NIR线索融合，从而恢复干净的RGB图像。该模型不依赖于干净的RGB数据收集，能够在不同噪声水平下进行泛化。大量的合成和真实数据评估表明，该方法在性能上优于现有技术。'}}}, {'id': 'https://huggingface.co/papers/2607.28996', 'title': 'SULAND v2: A Refined RGB Dataset and Deep Learning Object Detection Benchmark for UAV/UGV-Based SUrface LANDmine Detection Under Domain Shift', 'url': 'https://huggingface.co/papers/2607.28996', 'abstract': 'Abstract  RGB imagery offers a practical, low-cost option for Unmanned Aerial/Ground Vehicle (UAV/UGV) survey support in surface-landmine detection, but object detectors remain underexplored in this safety-critical domain. Limited cross-architecture benchmarking and insufficient out-of-distribution (OOD) analysis obscure whether detectors generalize across deployment conditions. This challenge is amplified by the scarcity of public RGB landmine datasets, making SULAND a key benchmark for PFM-1 and PMA-2 detection. However, inspection reveals missing/false annotations, localization errors, inconsistent visibility criteria, visual artifacts, temporal labeling inconsistencies, and an inverted OOD class-ID convention in SULAND. We present SULAND_v2, a refined RGB surface-landmine dataset and benchmark. Preserving original images and splits, we manually revise annotations to ensure completeness, precise localization, label validity, and class consistency. SULAND_v2 contains 33,771 images and 12,433 bounding boxes. We benchmark 35 detector configurations across nine families. Annotation refinement improves YOLOv8 in-distribution (IID) test mAP@50 by 14.6-19.6 percentage points, while fixing the OOD class-ID convention increases mean YOLOv8 OOD mAP@50 by ~25 percentage points. On SULAND_v2, YOLOv12-Small achieves the highest IID mAP@50 (0.908), while RF-DETR-Large yields the strongest OOD performance (0.799 mAP@50, 0.675 recall). Our results demonstrate that high IID accuracy does not guarantee operational readiness. SULAND_v2 provides a reliable benchmark for evaluating domain-shift robustness in RGB-based mine-action survey support.', 'score': 2, 'issue_id': 2830, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'b91df6208db92f27', 'authors': ['Sagar Lekhak', 'Prasanna Reddy Pulakurthi', 'Lalit Joshi', 'Ramesh Bhatta', 'Emmett J. Ientilucci'], 'affiliations': ['Rochester Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.28996.jpg', 'data': {'categories': ['#benchmark', '#cv', '#dataset'], 'emoji': '💣', 'ru': {'title': 'Точная разметка и робастное тестирование детекторов мин на RGB-снимках', 'desc': 'В статье представлен улучшенный датасет SULAND_v2 для обнаружения противопехотных мин на RGB-изображениях с беспилотных летательных аппаратов. Авторы выявили и исправили множество ошибок в исходном датасете, включая неполные аннотации, ошибки локализации и проблемы с консистентностью разметки. Они провели комплексное бенчмаркирование 35 конфигураций детекторов из девяти семейств архитектур, оценивая как качество на распределении обучения (IID), так и устойчивость к распределению вне выборки (OOD). Исследование показало, что высокая точность на IID не гарантирует готовность к реальному развертыванию, подчеркивая важность тестирования на смещение домена для критичных по безопасности приложений.'}, 'en': {'title': 'Enhancing Landmine Detection with SULAND_v2: A Step Towards Reliable UAV/UGV Support', 'desc': 'This paper addresses the challenges of using RGB imagery for detecting landmines with unmanned vehicles, highlighting the limitations of existing object detectors in this critical area. It introduces SULAND_v2, a refined dataset that improves upon the original SULAND by correcting annotation errors and ensuring consistent labeling. The authors benchmark various detector configurations, revealing that improved annotations significantly enhance the performance of models like YOLOv8. The findings emphasize that high accuracy in controlled conditions does not necessarily translate to effective performance in real-world scenarios, underscoring the importance of robust evaluation methods for deployment.'}, 'zh': {'title': 'SULAND_v2：提升地雷检测的可靠基准', 'desc': '本论文介绍了SULAND_v2，一个改进的RGB地面雷达数据集和基准，用于无人机和地面车辆的地雷检测。研究发现，原有数据集存在标注错误和可视化不一致等问题，影响了检测器的性能。通过手动修正标注，SULAND_v2显著提高了YOLOv8在分布内和分布外的检测精度。该数据集为评估基于RGB的地雷行动调查支持的领域转移鲁棒性提供了可靠的基准。'}}}, {'id': 'https://huggingface.co/papers/2607.27851', 'title': 'Beyond Feeling Better: Capability-Sustaining Emotional Dialogue as a Longitudinal Research Paradigm', 'url': 'https://huggingface.co/papers/2607.27851', 'abstract': "Abstract  Emotional dialogue research includes two influential strategy traditions. Empathetic dialogue prioritizes understanding a speaker's emotional experience. Emotional support conversation selects and sequences support for the seeker's current needs. Sustained use introduces a further goal. Effective support should sustain users' capacities for emotion regulation, coping, self-endorsed decisions, and social connection across the interaction lifecycle. We propose capability-sustaining emotional dialogue (CSED) as a longitudinal research paradigm that aligns supportive strategy with this goal and organizes data, models, system design, evaluation, and governance around repeated use, non-use, transition, and termination. A targeted literature-and-corpus audit motivates this position. In a PRISMA-ScR-guided sample, 95% of 60 system-building papers pursue relief-oriented goals. None evaluates capability or longitudinal outcomes, and only 1 considers dependency, autonomy, or termination risk. In 300 ESConv supporter turns, capability-relevant functions appear in 43.0%, while generic suggestions account for 22.0%, compared with 4.0% reappraisal, 6.7% self-efficacy support, and 0.3% boundary behavior. We release a protocol for extending the audit to model behavior. An illustrative process model connects latent user capability to six design commitments, four evaluation timescales, and lifecycle constraints. The resulting agenda makes CSED testable across data, policy design, training, evaluation, and governance.", 'score': 2, 'issue_id': 2832, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'a7b6bdf989b3128f', 'authors': ['Ming Wang', 'Jiaqi Wu Young', 'Wenfang Wu', 'Daling Wang', 'Shi Feng'], 'affiliations': ['Amiya Research', 'Georg-August-Universität Göttingen', 'Northeastern University', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27851.jpg', 'data': {'categories': ['#training', '#benchmark', '#dataset'], 'emoji': '🌱', 'ru': {'title': 'От облегчения к укреплению: долгосрочная поддержка эмоционального благополучия в диалоговых системах', 'desc': 'Статья предлагает новую парадигму для исследования эмоциональных диалогов - CSED (capability-sustaining emotional dialogue), которая фокусируется на поддержании способностей пользователей к саморегуляции и автономии на протяжении всего взаимодействия. Авторы проводят систематический анализ существующих работ и обнаруживают, что 95% исследуемых систем ориентированы на немедленное облегчение эмоционального состояния, игнорируя долгосрочные эффекты и риски зависимости пользователя. Они анализируют корпус диалогов поддержки и показывают, что функции, относящиеся к укреплению способностей, встречаются редко, в то время как преобладают общие рекомендации. Исследование предлагает комплексный подход, включающий переработку данных, дизайн моделей, метрики оценки и управление на основе жизненного цикла взаимодействия.'}, 'en': {'title': 'Empowering Emotions: Sustaining Support in Dialogue', 'desc': "This paper introduces the concept of capability-sustaining emotional dialogue (CSED), which aims to enhance users' emotional regulation and social connections over time. It critiques existing emotional support systems for focusing primarily on immediate relief rather than long-term user capabilities. The authors conducted a literature review revealing that most studies do not assess the long-term effects of emotional support strategies. They propose a structured approach to evaluate and design systems that support users' emotional needs throughout their interaction lifecycle."}, 'zh': {'title': '能力维持情感对话：支持与成长的结合', 'desc': '情感对话研究包括两种重要的策略传统：同理心对话和情感支持对话。同理心对话重视理解说话者的情感体验，而情感支持对话则关注为寻求者的当前需求提供支持。我们提出了能力维持情感对话（CSED）作为一种长期研究范式，旨在将支持策略与用户情感调节和社会联系的能力维持目标相结合。通过对文献和语料库的审计，我们发现大多数系统构建的研究关注于缓解目标，而缺乏对能力或长期结果的评估。'}}}, {'id': 'https://huggingface.co/papers/2607.27888', 'title': 'Not All Tokens Deserve Equal Credit: Counterfactual Sensitivity Credit Reallocation for Long-CoT Reasoning', 'url': 'https://huggingface.co/papers/2607.27888', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) is central to improving long-CoT reasoning in large language models. Critic-free methods such as GRPO convert response-level rewards into advantages and uniformly broadcast them across tokens, overlooking their unequal contributions to the final outcome. On-policy self-distillation (OPSD) instead provides dense distributional supervision by minimizing the forward KL divergence between an unprivileged policy and a privileged self-teacher, implicitly assuming that the resulting likelihood shifts encode reliable answer-aligned information. We test this premise by fixing each sampled trajectory and re-scoring it under two opposing outcome conditions, one asserting correctness and the other incorrectness. Most affected tokens shift in the same direction under both conditions, with few sign reversals and substantial overlap in the induced optimization signals. Large shifts also concentrate on highly substitutable surface-form tokens, whereas tokens carrying problem-specific reasoning content are less sensitive. These findings show that privileged shifts fail to provide reliable answer-aligned directions, while their magnitudes primarily reflect counterfactual sensitivity rather than token-level learning value. Based on these observations, we propose Counterfactual Sensitivity Credit Reallocation (CSCR), a simple extension of GRPO that reduces credit for highly sensitive tokens and renormalizes token-level advantages to preserve both the original credit budget and verifier-determined direction. On long-CoT mathematical reasoning benchmarks, CSCR consistently outperforms GRPO baseline with the same number of policy updates. Targeted ablations further corroborate our diagnosis: privilege-induced directions are unreliable, moderate downweighting is most effective, and stronger modulation destabilizes optimization.', 'score': 2, 'issue_id': 2831, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '8d2d88dca8fba94f', 'authors': ['Qiangqiang He', 'Zhongheng Wu', 'ZiJian Wang'], 'affiliations': ['Institute of Wireless Communications Technology, Shanghai Jiao Tong University, Shanghai, China', 'State Key Laboratory for Novel Software Technology, Nanjing University, Nanjing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27888.jpg', 'data': {'categories': ['#rlhf', '#alignment', '#math', '#reasoning', '#rl', '#training'], 'emoji': '🧮', 'ru': {'title': 'Пересчёт кредитов обучения через контрфактическую чувствительность для улучшения рассуждений', 'desc': 'В статье предлагается новый подход к обучению с подкреплением на основе верифицируемых вознаграждений для улучшения длинных цепочек рассуждений в большых языковых моделях. Авторы выявляют, что методы самодистилляции, такие как OPSD, неправильно распределяют кредиты обучения между токенами, так как их чувствительность к контрфактическим условиям не коррелирует с релевантностью для финального ответа. На основе этого анализа предлагается метод CSCR, который переаллоцирует кредиты обучения, снижая вес для высокочувствительных поверхностных токенов и сохраняя исходный бюджет вознаграждений. Экспериментально показано, что CSCR последовательно превосходит базовый метод GRPO на задачах математического рассуждения.'}, 'en': {'title': 'Revolutionizing Token Credit in Reinforcement Learning', 'desc': 'This paper introduces a new approach called Counterfactual Sensitivity Credit Reallocation (CSCR) to improve reinforcement learning in large language models, particularly for long-chain of thought (CoT) reasoning. The authors critique existing methods like GRPO for treating all tokens equally, which can lead to misleading optimization signals. By analyzing how tokens respond to different outcome conditions, they find that some tokens are more sensitive and less reliable for guiding learning. CSCR addresses these issues by adjusting the credit given to sensitive tokens, leading to better performance on reasoning tasks compared to traditional methods.'}, 'zh': {'title': '反事实敏感性提升长链推理', 'desc': '强化学习与可验证奖励（RLVR）在提升大型语言模型的长链推理能力中起着重要作用。现有的无评论方法如GRPO将响应级奖励转化为优势，并在所有标记中均匀传播，忽视了它们对最终结果的不同贡献。我们提出的在政策自蒸馏（OPSD）方法通过最小化未特权政策与特权自教师之间的前向KL散度，提供了密集的分布式监督。基于我们的研究结果，我们提出了反事实敏感性信用重新分配（CSCR），该方法在长链数学推理基准测试中表现优于GRPO基线。'}}}, {'id': 'https://huggingface.co/papers/2607.27951', 'title': 'Safeguards Based on Copyable Context Cannot Provide Reliable Safety for LLMs', 'url': 'https://huggingface.co/papers/2607.27951', 'abstract': 'Abstract  Large language model safeguards decide whether to answer before seeing how an answer will be used. This creates a basic problem for dual-use tasks: the same answer can help an authorized professional or an attacker, while an attacker can imitate a benign request and interaction history. We separate the capability released by the model from the evidence available about downstream use. When that evidence is copyable, we derive the exact worst-case floor on attacker assistance while preserving useful answers. The result yields a safety trilemma: Useful Capability, Reliable Safety, and Open Access cannot coexist. We then show how a trusted credential can complement existing safeguards by adding hard-to-copy information that predicts actual downstream use, and identify the stronger condition needed to eliminate the floor. Evidence from dual-use evaluations, adaptive attacks, and deployed trusted-access programs supports the practical relevance of these conditions.', 'score': 1, 'issue_id': 2829, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '093f0fd124e2ee50', 'authors': ['Pingyu Wu', 'Lingyao Zhu', 'Weiming Zhang', 'Nenghai Yu'], 'affiliations': ['Hefei AiDA Lab', 'University of Science and Technology of China', 'Zhejiang Wanli University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27951.jpg', 'data': {'categories': [], 'emoji': '🔐', 'ru': {'title': 'Невозможная триада: утилита, безопасность и открытость в защите языковых моделей', 'desc': 'В этой работе исследуется фундаментальная проблема защиты больших языковых моделей при выполнении задач двойного назначения, когда один и тот же ответ может быть использован как легально, так и во вредоносных целях. Авторы разделяют возможности модели от информации о том, как будет использован ответ, и доказывают математически точный минимальный уровень помощи злоумышленнику при сохранении полезности системы. Они выявляют триллемму безопасности: полезность, надежная защита и открытый доступ не могут существовать одновременно. Предложено решение в виде доверенной идентификации пользователя, которая добавляет сложно подделываемую информацию для прогнозирования реального использования ответа.'}, 'en': {'title': 'Balancing Safety and Utility in Language Models', 'desc': 'This paper discusses the challenges of using large language models in situations where their answers can be misused. It highlights a safety trilemma where useful capabilities, reliable safety, and open access cannot all be achieved simultaneously. The authors propose a solution involving trusted credentials that provide hard-to-copy information to better predict how answers will be used. They support their findings with evidence from evaluations and real-world programs that address dual-use concerns.'}, 'zh': {'title': '安全三难：能力、安全与开放的冲突', 'desc': '这篇论文讨论了大型语言模型在回答问题前如何决定是否回答，这在双重用途任务中引发了问题。相同的答案可能对授权专业人士有帮助，但也可能被攻击者利用。作者提出了一种方法，将模型的能力与下游使用的证据分开，从而在保持有用答案的同时，推导出攻击者协助的最坏情况底线。最后，论文提出了一个安全三难困境，表明有用能力、可靠安全和开放访问无法共存，并建议使用可信凭证来增强现有的安全措施。'}}}, {'id': 'https://huggingface.co/papers/2607.15820', 'title': "In the Driver's Seat: A Multi-Company Study on the Reality of Autonomous Driving System Testing", 'url': 'https://huggingface.co/papers/2607.15820', 'abstract': 'Abstract  Autonomous driving systems (ADS) are rapidly advancing and increasingly deployed in real-world applications. This creates growing demands for effective testing to ensure system functionality and safety. However, ADS testing remains complex and lacks well-established standards for scenario selection, performance evaluation, and acceptance criteria. To better understand current ADS testing practices and challenges, we conducted an interview study with experts working on ADS development and testing in nine companies from six different countries. Through thematic analysis, we synthesized industrial testing practices, challenges, potential solutions, future trends, and proposed an evidence-centered closed-loop testing framework for ADS testing. Our findings show that current practices primarily focus on scenario-based and X-in-the-loop testing approaches, supported by diverse tools, metrics, benchmarks, and testing strategies. The participants highlighted major challenges related to scenario realism, scenario coverage, simulation fidelity, and acceptance criteria, while also discussing potential solutions such as the use of AI, world models, and end-to-end approaches. Furthermore, participants envisioned future ADS testing to become more automated, data-driven, and transparent across the industry. Overall, this study provides a comprehensive industry-grounded overview of ADS testing, proposes an evidence-centered closed-loop testing framework to provide actionable guidance for ADS testing, and outlines important directions for future research and practice.', 'score': 1, 'issue_id': 2830, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'ca0b14a17c0a7534', 'authors': ['Qunying Song', 'Yuan Gao', 'Johannes Betz', 'Dietmar Pfahl', 'Mohammad Reza Mousavi', 'Federica Sarro'], 'affiliations': ['Kings College London', 'Technical University of Munich', 'University College London', 'University of Tartu'], 'pdf_title_img': 'assets/pdf/title_img/2607.15820.jpg', 'data': {'categories': [], 'emoji': '🚗', 'ru': {'title': 'Стандартизация и автоматизация тестирования автономных транспортных систем', 'desc': 'В работе проведено исследование практик тестирования автономных систем вождения через интервью с экспертами из девяти компаний. Авторы выявили, что индустрия преимущественно использует сценарное тестирование и X-in-the-loop подходы с различными метриками и бенчмарками для оценки. Основные проблемы включают реалистичность сценариев, полноту их покрытия, точность симуляции и отсутствие стандартизированных критериев приемки систем. Исследователи предложили замкнутую циклическую схему тестирования на основе доказательств, которая поможет ориентировать будущие направления разработки и тестирования автономных систем.'}, 'en': {'title': 'Enhancing Safety in Autonomous Driving: A New Testing Framework', 'desc': 'This paper discusses the challenges and practices in testing autonomous driving systems (ADS), which are becoming more common in real-world applications. The authors conducted interviews with experts from various companies to gather insights on current testing methods, focusing on scenario-based and X-in-the-loop approaches. They identified key challenges such as ensuring scenario realism and coverage, and proposed an evidence-centered closed-loop testing framework to improve testing effectiveness. The study emphasizes the need for more automated and data-driven testing solutions in the future.'}, 'zh': {'title': '推动自动驾驶测试的标准化与智能化', 'desc': '自动驾驶系统（ADS）正在快速发展并逐渐应用于现实世界中，这对有效的测试提出了更高的要求，以确保系统的功能和安全性。然而，ADS的测试仍然复杂，缺乏成熟的标准来选择场景、评估性能和设定接受标准。通过对来自六个国家九家公司的ADS开发和测试专家进行访谈，我们总结了当前的测试实践、面临的挑战和潜在解决方案，并提出了一个以证据为中心的闭环测试框架。研究发现，当前的测试主要集中在基于场景和X-in-the-loop的测试方法上，并强调了场景真实性、覆盖率、仿真保真度和接受标准等主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.28478', 'title': 'Would You Walk to the Car Wash? Revealing the Salience Bias of Large Language Models in Commonsense Reasoning', 'url': 'https://huggingface.co/papers/2607.28478', 'abstract': 'Abstract  As large language models (LLMs) continue to advance in complex reasoning tasks, they have learned to heavily prioritize explicit conditions provided in the input. However, in everyday commonsense reasoning, this mechanism exposes a critical vulnerability which we term Salience Bias: models become easily hijacked by useless explicit distractors (e.g., numerical values), leading them to ignore the implicit physical or commonsense prerequisites of a task. A critical open question is whether this failure reflects a genuine gap in commonsense knowledge or merely its suppression under misleading task framing. To investigate this, we construct the SaliTrap Benchmark, a high-quality dataset across four trap dimensions. Evaluating 12 state-of-the-art LLMs, we find that all mainstream models suffer significantly from salience bias, with severity scaling with distractor density and detecting the trap often decoupled from actually avoiding it. Crucially, by re-eliciting the same models with the task framing stripped away, we show that this is overwhelmingly a failure of knowledge suppression rather than knowledge absence: a context-free knowledge probe alone recovers over 90\\% of sycophantic-compliance failures, revealing that the requisite commonsense is intrinsically present but actively crowded out by salient distractors that lure the model into over-compliant, unnecessary computation. Building on this diagnosis, we further show that lightweight, inference-time prompting alone substantially closes the gap without any retraining. Our findings relocate the bottleneck of commonsense reasoning failures from model competence to elicitation, and we release SaliTrap as a testbed for this blind spot. The codes are available at https://github.com/Wuzheng02/SaliTrap.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6158cf6a073d8d77', 'authors': ['Zheng Wu', 'Chenhao Xue', 'Shijie Zheng', 'Yijie Lu', 'Cheng Yang', 'Zhuosheng Zhang'], 'affiliations': ['ByteDance Inc', 'School of Computer Science, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28478.jpg', 'data': {'categories': ['#interpretability', '#open_source', '#benchmark', '#reasoning', '#dataset'], 'emoji': '🪤', 'ru': {'title': 'Когда модель знает, но молчит: как отвлекающие факторы подавляют здравый смысл LLM', 'desc': 'В работе исследуется уязвимость больших языковых моделей, названная Salience Bias, когда модели игнорируют неявные знания здравого смысла, отвлекаясь на явные, но бесполезные признаки в входных данных. Авторы создали бенчмарк SaliTrap для оценки этого явления и обнаружили, что все современные LLM страдают от этой проблемы в различной степени. Ключевой находкой является то, что это не дефицит знаний, а их подавление: модели обладают необходимыми знаниями здравого смысла, но активно их игнорируют из-за отвлекающих факторов. Авторы показали, что простые техники переформулирования задачи во время инференции значительно улучшают производительность без переобучения модели.'}, 'en': {'title': 'Unmasking Salience Bias in Language Models', 'desc': 'This paper discusses a problem called Salience Bias in large language models (LLMs), where these models focus too much on explicit information in their inputs, like numbers, and ignore important commonsense knowledge. The authors created a new dataset called the SaliTrap Benchmark to test this bias across different scenarios. They found that all tested LLMs struggle with this issue, often failing to avoid distractions even when they have the necessary knowledge. By adjusting how tasks are presented to the models, they demonstrated that the knowledge is there, but the way tasks are framed can suppress it, suggesting that improving task presentation can enhance model performance without needing retraining.'}, 'zh': {'title': '揭示显著性偏差：常识推理的新挑战', 'desc': '随着大型语言模型（LLMs）在复杂推理任务中的进步，它们开始过度依赖输入中的显性条件。这种机制导致了一个关键的脆弱性，称为显著性偏差：模型容易受到无用的显性干扰因素（如数字值）的影响，从而忽视任务的隐性物理或常识前提。通过构建SaliTrap基准数据集，我们发现主流模型在显著性偏差上普遍存在显著问题，且这种偏差与干扰因素的密度成正比。我们的研究表明，这主要是知识抑制的失败，而非知识的缺失，提供了一个新的视角来理解常识推理的瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2607.25388', 'title': 'SGTP: Sampling-based Game-Theoretic Planning for Real-Time Multi-Vehicle Autonomous Racing', 'url': 'https://huggingface.co/papers/2607.25388', 'abstract': 'Abstract  Autonomous multi-vehicle racing requires real-time planning of diverse competitive behaviors in intense interactions. Existing planners often struggle to balance strategic diversity and computational efficiency. To address this challenge, we propose Sampling-based Game-Theoretic Planning (SGTP), a real-time framework that combines game-theoretic reasoning with GPU-accelerated sampling of control sequences and dynamics rollouts. Sampled trajectories are ranked using a game-aware cost to capture competitive interactions and generate diverse racing behaviors. Our planner then performs feasibility selection by explicitly enforcing track-boundary and dynamic collision-avoidance constraints, ensuring safe and reliable transitions between racing strategies. Extensive simulations on challenging tracks show that SGTP achieves a 95.24% win rate and a 99.35% task-completion ratio in highly interactive races, with a mean computational time of 0.095 s over multiple iterative solving steps. We also demonstrate the successful application of SGTP in large-scale scenarios with up to 10 agents. We release our code and provide an open-source benchmark of multi-agent autonomous racing algorithms to facilitate future research. Project page: https://sgtp-racing.github.io/.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f3729abb79ae6080', 'authors': ['Zhouheng Li', 'Fangguo Zhao', 'Mattia Piccinini', 'Baha Zarrouki', 'Yuan Gao', 'Zitong Shan', 'Johannes Betz', 'Chen Lv', 'Lei Xie'], 'affiliations': ['Baha Zarrouki', 'Chen Lv', 'Fangguo Zhao', 'Johannes Betz', 'Lei Xie', 'Mattia Piccinini', 'Yuan Gao', 'Zhouheng Li', 'Zitong Shan'], 'pdf_title_img': 'assets/pdf/title_img/2607.25388.jpg', 'data': {'categories': ['#games', '#agents', '#open_source', '#optimization', '#benchmark', '#robotics', '#reasoning'], 'emoji': '🏎️', 'ru': {'title': 'Теоретико-игровое планирование для многоагентных автономных гонок', 'desc': 'В статье предлагается Sampling-based Game-Theoretic Planning (SGTP) — фреймворк для планирования траекторий автономных гоночных автомобилей в режиме реального времени. Метод комбинирует теоретико-игровой подход с GPU-ускоренной генерацией и развёртыванием последовательностей управления для моделирования динамики. Сгенерированные траектории ранжируются с помощью специальной cost-функции, учитывающей конкурентные взаимодействия между агентами и обеспечивающей разнообразие поведения. Алгоритм гарантирует безопасность через явное соблюдение ограничений трека и динамического избежания столкновений, демонстрируя высокую производительность на сложных сценариях с множественными агентами.'}, 'en': {'title': 'Revolutionizing Autonomous Racing with Game-Theoretic Planning', 'desc': "This paper introduces Sampling-based Game-Theoretic Planning (SGTP), a new framework for real-time decision-making in autonomous multi-vehicle racing. SGTP combines game-theoretic principles with GPU-accelerated sampling to efficiently generate and evaluate diverse racing strategies. The planner ranks sampled trajectories based on a game-aware cost function, ensuring that competitive interactions are effectively captured. The results demonstrate SGTP's high performance in terms of win rate and task completion, while maintaining safety through collision-avoidance constraints."}, 'zh': {'title': '实时博弈论规划，提升赛车策略的多样性与安全性', 'desc': '这篇论文提出了一种名为基于采样的博弈论规划（SGTP）的实时框架，旨在解决自主多车赛车中的复杂行为规划问题。SGTP结合了博弈论推理和GPU加速的控制序列采样，以实现高效的竞争行为生成。通过使用博弈感知成本对采样轨迹进行排名，SGTP能够捕捉竞争互动并生成多样化的赛车行为。此外，该规划器通过强制执行赛道边界和动态避碰约束，确保赛车策略之间的安全可靠过渡。'}}}, {'id': 'https://huggingface.co/papers/2608.02023', 'title': 'SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks', 'url': 'https://huggingface.co/papers/2608.02023', 'abstract': 'Abstract  Speech and audio generation is often needed in animation dubbing, audio drama, movies, advertising, games, podcasts, and short-video production. In these scenarios, creators may need to design voices without reference recordings, control speaker styles with natural language, support acoustic scenes with environments and audio effects, and later reuse the designed voices. Therefore, it is important to support multi-speaker speech and audio generation for both instruct and zero-shot tasks. The instruct task requires a caption of the environment, speaker styles, and fine-grained content, while the zero-shot task uses reference audio together with the same fine-grained content. We address these tasks from both the data and model sides. First, we propose SwanData-Caption, which cleans raw speech and audio data, adds targeted synthetic coverage, and annotates diverse and accurate multi-level captions. Then, we propose SwanTale, a multi-speaker expressive speech and audio generation model that supports both zero-shot and instruct tasks. We introduce SwanVAE to support high-quality multi-audio-modality generation. Then, we adopt reward-conditioned quality control and Engram conditioning, along with Unified MoE for multi-task and multi-audio-modality modeling. In addition, we use curriculum learning and GRPO post-training to let the model progressively learn and strengthen its capabilities. Experimental results show that SwanTale leads on multiple key zero-shot and instruct metrics, achieves the best expressiveness scores in both tasks, and supports complex instruct generation involving multi-speaker speech and audio. Demos can be found at https://swanaigc.github.io/\\#swantale.', 'score': 28, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4b04115678abc0cc', 'authors': ['Yu Zhang', 'Ruiqi Li', 'Changhao Pan', 'Ke Lei', 'Xiang Yin', 'Cheng Yang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02023.jpg', 'data': {'categories': ['#games', '#training', '#audio', '#data', '#open_source', '#synthetic', '#dataset'], 'emoji': '🎙️', 'ru': {'title': 'Выразительная генерация речи и аудио с контролем по инструкциям и примерам', 'desc': 'В статье представлена система SwanTale для генерации многоголосой экспрессивной речи и аудио, которая поддерживает как инструктивные задачи с текстовым описанием сцены, так и нулевые примеры с референсным аудио. Авторы разработали датасет SwanData-Caption с чисткой данных, синтетическим расширением и многоуровневой аннотацией для обучения модели. Модель использует SwanVAE для высококачественной генерации мультимодального аудио, награду-обусловленный контроль качества, расширенное кодирование и унифицированную MoE архитектуру для обработки различных задач и модальностей. Система демонстрирует превосходные результаты по метрикам экспрессивности и качества в обеих постановках задач, включая сложные сценарии с несколькими говорящими.'}, 'en': {'title': 'Empowering Creative Voices with Advanced Audio Generation', 'desc': 'This paper presents advancements in speech and audio generation for various creative applications, such as animation and gaming. It introduces SwanData-Caption, a method for enhancing and annotating audio data to improve multi-speaker generation tasks. The authors also propose SwanTale, a model that excels in both instruct and zero-shot tasks, allowing for expressive audio generation without prior recordings. The model incorporates techniques like reward-conditioned quality control and curriculum learning to enhance its performance and adaptability.'}, 'zh': {'title': '多说话人语音生成的创新解决方案', 'desc': '本论文探讨了多说话人语音和音频生成在动画配音、音频剧、电影等场景中的应用。我们提出了SwanData-Caption，用于清理原始语音数据并添加多样化的注释，以支持指令和零样本任务。接着，我们介绍了SwanTale模型，能够生成高质量的多音频模态，并通过奖励条件质量控制和课程学习来提升模型能力。实验结果表明，SwanTale在多个关键指标上表现优异，支持复杂的多说话人语音生成。'}}}, {'id': 'https://huggingface.co/papers/2607.28590', 'title': 'VAD: Attributing Visual Evidence for Target Reconstruction in Multimodal On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.28590', 'abstract': 'Abstract  Multimodal on-policy distillation (OPD) transfers fine-grained visual knowledge by supervising student-generated trajectories with a privileged-view teacher. Yet its next-token corrections are source-mixed, combining visual signals with linguistic priors and teacher-specific effects. The key challenge is to estimate which corrections are supported by visual evidence, not merely where or how strongly to distill. We introduce Visual Attribution Distillation (VAD), a counterfactual target-reconstruction algorithm that estimates the visually attributable part of a teacher correction. At each student-generated prefix, VAD evaluates the same fixed teacher with the relevant evidence present and removed. The corresponding change in centered log-probabilities defines ut, a signed proxy for the visual evidence direction that estimates how revealing the evidence supports or refutes candidate tokens. VAD projects the original correction onto this proxy to obtain an intervention-aligned component and a proxy-unexplained residual, then reconstructs a student-anchored target from the former. During training, this reconstructed target supplies the primary supervision signal, while the privileged teacher contributes a weak regularizer. Across six fine-grained visual benchmarks at 4B and 9B scales, VAD outperforms direct privileged-view distillation and visual-advantage weighting. Token- level and controlled-target analyses show that the proxy-aligned component is enriched in task-relevant visual corrections and yields stronger target shifts, especially when evidence refutes a mistaken answer. These results support counterfactual target reconstruction as an effective alternative to source-mixed supervision.', 'score': 23, 'issue_id': 2839, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'f3f1d830b7497087', 'authors': ['Kangning Zhang', 'Yixing Li', 'Shuai Shao', 'Qingyao Li', 'Zhengxi Lu', 'Zhiyuan Yao', 'Jianghao Lin', 'Wenxiang Jiao', 'Yuan Lu', 'Weiwen Liu', 'Weinan Zhang', 'Yong Yu'], 'affiliations': ['Shanghai Jiao Tong University', 'Southeast University', 'The Chinese University of Hong Kong', 'Xiaohongshu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28590.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#training'], 'emoji': '👁️', 'ru': {'title': 'Выделение визуальной атрибуции при дистилляции мультимодальных моделей', 'desc': 'В работе предлагается метод Visual Attribution Distillation (VAD) для улучшения дистилляции мультимодальных моделей. Основная идея заключается в том, чтобы выделить из корректив учителя только ту часть, которая действительно обусловлена визуальной информацией, отделив её от лингвистических приоритетов. Метод использует контрфактический подход: оценивает предсказания учителя при наличии и отсутствии визуальных доказательств, определяя таким образом влияние зрительных сигналов. Экспериментальные результаты на шести бенчмарках показывают, что VAD превосходит стандартную дистилляцию с привилегированным视представлением и более эффективно передаёт визуальные знания студенческой модели.'}, 'en': {'title': 'Enhancing Visual Knowledge Transfer with VAD', 'desc': "This paper presents Visual Attribution Distillation (VAD), a method that improves the transfer of visual knowledge in machine learning by focusing on the visual evidence behind teacher corrections. VAD uses a counterfactual approach to determine which parts of a teacher's guidance are supported by visual data, rather than just combining visual and linguistic signals. By evaluating the impact of visual evidence on the teacher's corrections, VAD creates a more accurate supervision signal for training student models. The results show that VAD significantly enhances performance on visual tasks compared to traditional methods, especially when the evidence contradicts incorrect predictions."}, 'zh': {'title': '视觉归因蒸馏：提升知识转移的有效方法', 'desc': '多模态的在线策略蒸馏（OPD）通过使用特权视角教师来监督学生生成的轨迹，从而转移细粒度的视觉知识。本文提出了视觉归因蒸馏（VAD），这是一种反事实目标重建算法，用于估计教师修正中由视觉证据支持的部分。VAD在每个学生生成的前缀上评估固定教师的相关证据，并通过比较有无证据的变化来定义视觉证据的方向。实验结果表明，VAD在多个细粒度视觉基准测试中表现优于直接的特权视角蒸馏，证明了反事实目标重建作为一种有效的监督替代方案。'}}}, {'id': 'https://huggingface.co/papers/2608.02499', 'title': 'SWE-Touch: Benchmarking Coding Agents When Users Touch the Code', 'url': 'https://huggingface.co/papers/2608.02499', 'abstract': 'Abstract  Real-world software development requires coding agents to operate in shared workspaces where users may inspect and modify code during an ongoing task, yet existing repository-level benchmarks typically evaluate agents working alone or restrict user participation to messages. This leads us to ask: how do coding agents understand and respond to code changes in a shared workspace? We introduce SWE-Touch, a framework that stress-tests this setting through validated Counter-Edits: plausible edits to task-relevant code that conflict with task completion. SWE-Touch mines task-critical regions from multiple repair trajectories, uses a separate User Patch Generator to construct the edits, and injects them with contextual user messages when agents reach the relevant code. We evaluate nine coding models on SWE-bench Verified, with additional experiments on longer-horizon tasks from SWE-Bench Pro and DeepSWE. Counter-Edit lowers average resolve rate by 7.7 percentage points on SWE-bench Verified, with degradation also persisting on both longer-horizon benchmarks. Trajectory analysis links these failures to limited awareness of the evolving workspace: agents may retain conflicting code or replace it without sufficiently re-inspecting the repository and validating the revised code with targeted tests. These findings show that strong autonomous performance does not yet ensure the state awareness and adaptive behavior needed for shared-workspace collaboration, and point to detecting workspace changes, reconciling conflicting edits with the task, and verifying the affected behavior as key capabilities for future optimization.', 'score': 13, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e7489fa536aa40aa', 'authors': ['Yuqiao Tan', 'Jinxiang Meng', 'Fangyu Lei', 'Minzheng Wang', 'Shizhu He', 'Jun Zhao', 'Kang Liu'], 'affiliations': ['Institute of Automation, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.02499.jpg', 'data': {'categories': ['#benchmark', '#plp', '#dataset', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Когда агентам не хватает внимания: совместная разработка кода требует осознания изменений', 'desc': 'В статье представлена система SWE-Touch для оценки способности coding agents работать в общих рабочих пространствах, где пользователи могут изменять код во время выполнения задачи. Система использует Counter-Edits — правдоподобные конфликтующие изменения кода — для стресс-тестирования девяти моделей на бенчмарках SWE-bench. Результаты показали, что средний процент успешного разрешения задач снизился на 7,7 пункта из-за ограниченной осведомленности агентов о динамических изменениях в репозитории. Исследование выявило критические недостатки в отслеживании состояния рабочего пространства и рекомендует разработать механизмы для обнаружения изменений, разрешения конфликтов и верификации затронутого кода.'}, 'en': {'title': 'Enhancing Coding Agents for Collaborative Workspaces', 'desc': "This paper introduces SWE-Touch, a framework designed to evaluate how coding agents handle code changes in collaborative environments. It focuses on the concept of Counter-Edits, which are plausible modifications that conflict with the agents' tasks. The study reveals that existing coding models struggle with awareness of changes in shared workspaces, leading to a decrease in their performance. The findings suggest that improving agents' ability to detect changes, reconcile conflicts, and validate code is essential for enhancing their collaborative capabilities."}, 'zh': {'title': '共享工作空间中的编码代理挑战', 'desc': '这篇论文探讨了在共享工作空间中，编码代理如何理解和响应代码的变化。研究提出了SWE-Touch框架，通过验证的反向编辑来测试这一环境，反向编辑是与任务完成相冲突的合理代码修改。实验表明，编码模型在处理这些反向编辑时的平均解决率下降了7.7个百分点，且这种下降在更长时间的任务中也存在。研究结果表明，强大的自主性能并不意味着编码代理具备在共享工作空间中所需的状态意识和适应行为，未来的优化应关注检测工作空间变化、调和冲突编辑与任务的关系，以及验证受影响行为的能力。'}}}, {'id': 'https://huggingface.co/papers/2608.02583', 'title': 'UEmbed: Unified Sparse and Dense Multimodal Embeddings', 'url': 'https://huggingface.co/papers/2608.02583', 'abstract': "Abstract  Sparse retrieval underpins modern search systems, from web search to retrieval-augmented generation. Existing work has introduced Learned Sparse Retrieval (LSR) to push beyond exact lexical matching toward richer semantics. Yet LSR has so far remained tied to encoder-style bidirectional architectures, and its extension to multimodal settings still relies heavily on auxiliary cross-modal modules. To address these limitations, we introduce UEmbed (Unified Embedding), a decoder-only multimodal embedding model that produces both sparse lexical and dense representations in one causal forward pass. UEmbed appends N learnable special tokens to the input and partitions the vocabulary into N disjoint subsets. Each token's causal hidden state predicts sparse weights over its assigned subset, and the N subsets are concatenated into the full sparse vector. Trained on public data, we release UEmbed at 2B, 4B, and 9B scales. UEmbed-9B reaches 71.8 (dense) and 71.0 (sparse) on MMEB-v2, outperforming multimodal embedding models trained on publicly available data (e.g., RzenEmbed). On BEIR, UEmbed also remains competitive with strong dense and sparse baselines. Furthermore, we demonstrate the practical utility of UEmbed across three dimensions: effectiveness, efficiency, and agentic applications. Overall, UEmbed offers a new paradigm: it unifies dense and sparse embeddings in one model, while further extending sparse retrieval to unify text and multimodal inputs.", 'score': 13, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '8b7e72d84edb3411', 'authors': ['Tingyu Song', 'Mingxin Li', 'Yanzhao Zhang', 'Dingkun Long', 'Pengjun Xie', 'Zhijie Nie', 'Yilun Zhao', 'Shu Wu'], 'affiliations': ['Alibaba Group', 'CASIA', 'University of Chinese Academy of Sciences', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02583.jpg', 'data': {'categories': ['#multimodal', '#rag', '#benchmark', '#agents', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Единая модель для разреженного и плотного поиска в мультимодальных данных', 'desc': 'В работе представлена UEmbed — единая модель для создания как разреженных лексических, так и плотных представлений текста и изображений в одном проходе декодера. Модель использует специальные обучаемые токены, которые предсказывают разреженные веса над разными подмножествами словаря, что позволяет избежать использования вспомогательных кросс-модальных модулей. UEmbed достигает конкурентных результатов на бенчмарках MMEB-v2 и BEIR, превосходя существующие многомодальные модели embeddings, обученные на открытых данных. Модель демонстрирует практическую полезность через эффективность поиска, вычислительную экономичность и применимость в агентных системах.'}, 'en': {'title': 'Unifying Dense and Sparse Retrieval with UEmbed', 'desc': 'This paper presents UEmbed, a novel decoder-only multimodal embedding model designed for sparse retrieval in search systems. UEmbed combines both sparse lexical and dense representations in a single forward pass, enhancing the retrieval process beyond traditional methods. By introducing learnable special tokens and partitioning the vocabulary, UEmbed efficiently predicts sparse weights, achieving high performance on multimodal benchmarks. The model demonstrates significant improvements in effectiveness and efficiency, making it a versatile tool for integrating text and multimodal inputs in retrieval tasks.'}, 'zh': {'title': '统一稀疏与稠密嵌入的新范式', 'desc': '这篇论文介绍了一种新的模型UEmbed（统一嵌入），它在稀疏检索中结合了稠密和稀疏表示。UEmbed使用解码器结构，通过一次前向传播生成稀疏和稠密的嵌入，克服了以往模型的局限性。该模型通过添加可学习的特殊标记，将词汇分成多个不相交的子集，从而提高了检索的语义丰富性。UEmbed在多个基准测试中表现优异，展示了其在有效性、效率和应用方面的实用性。'}}}, {'id': 'https://huggingface.co/papers/2607.29613', 'title': 'WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.29613', 'abstract': "Abstract  Reinforcement learning (RL) post-training of Vision-Language-Action (VLA) models has shown strong promise for robotic manipulation. Among RL methods, critic-based approaches rely on a value estimator that predominantly operates on single-frame observations or single-frame VLM backbone latents, which is a fundamental mismatch with the partially observable nature of robot control. A naive approach to incorporate observation history into the critic incurs exponential complexity with high-dimensional visual space, and still fails because pure scalar-return regression provides insufficient supervision for learning cross-temporal dynamics. We identify the root cause as a state approximation problem: without an explicit world modeling objective, the critic's representation cannot capture the temporal structure needed for accurate value estimation. To address this, we propose the World Critic Model (WCM), built on a lightweight LeJEPA architecture; WCM jointly predicts future latent state and estimates values, such that the critic's representation is explicitly trained to capture temporal dynamics rather than merely regress scalar returns. WCM integrates seamlessly into both on-policy and off-policy training pipelines and is compatible with state-of-the-art VLA backbones including Pi0, Pi0.5, and OpenVLA-OFT. Extensive experiments on 149 tasks across four benchmarks demonstrate that WCM consistently achieves state-of-the-art performance in both in-distribution and out-of-distribution settings, with particularly strong generalization gains. We further validate WCM on seven real-world manipulation tasks using OpenVLA-OFT and Pi0.5 with off-policy RL, confirming stable deployment across diverse settings.", 'score': 13, 'issue_id': 2839, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'c7f7e6f3142b7614', 'authors': ['Senyu Fei', 'Xiaopeng Yu', 'Siyin Wang', 'Xianzhong Zhao', 'Jingjing Gong', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29613.jpg', 'data': {'categories': ['#rl', '#multimodal', '#training', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Критик с моделированием мира для временной динамики в робототехнике', 'desc': 'В статье предложен метод улучшения обучения с подкреплением для робототехнических манипуляторов, использующих модели Vision-Language-Action. Авторы выявили проблему: критики в методах на основе оценки стоимости работают с отдельными кадрами, что не соответствует частичной наблюдаемости в управлении роботами. Решением является World Critic Model, построенная на архитектуре LeJEPA, которая одновременно предсказывает будущие скрытые состояния и оценивает значения, явно обучаясь захватывать временную динамику. Модель успешно интегрируется в on-policy и off-policy обучение и демонстрирует улучшение производительности на 149 задачах и семи реальных манипуляционных задачах.'}, 'en': {'title': 'Enhancing Robotic Learning with Temporal Awareness', 'desc': 'This paper introduces the World Critic Model (WCM) to improve reinforcement learning for robotic manipulation by addressing the limitations of traditional critic-based approaches. The WCM enhances value estimation by jointly predicting future states and capturing temporal dynamics, rather than just regressing scalar returns. This model is designed to work with various Vision-Language-Action (VLA) architectures and can be integrated into both on-policy and off-policy training methods. Experimental results show that WCM outperforms existing methods across multiple tasks, demonstrating its effectiveness in both familiar and novel environments.'}, 'zh': {'title': '提升机器人操作的世界评论者模型', 'desc': '强化学习（RL）在视觉-语言-动作（VLA）模型的后期训练中显示出强大的潜力，尤其是在机器人操作方面。现有的基于评论者的方法主要依赖于单帧观察或单帧VLM骨干的价值估计，这与机器人控制的部分可观察性特性不匹配。我们提出了世界评论者模型（WCM），它通过轻量级的LeJEPA架构共同预测未来的潜在状态并估计价值，从而显著改善了时间动态的捕捉。实验结果表明，WCM在多个基准测试中表现出色，尤其在真实世界的操作任务中也展现了稳定的部署能力。'}}}, {'id': 'https://huggingface.co/papers/2608.02603', 'title': 'WorldExam: Benchmarking World Models from Apparent Appearance to Inherent Reactivity', 'url': 'https://huggingface.co/papers/2608.02603', 'abstract': 'Abstract  Controllable video generation models are increasingly being developed as world models. Accordingly, evaluating them in this role extends beyond the apparent appearance of generated videos to the inherent reactivity of the worlds they depict: the ability to infer from the scene state how the world should react and to generate plausible consequences not explicitly described in the input. Yet existing benchmarks mainly assess visual quality or explicit instruction fulfillment by checking whether requested actions and interaction outcomes are realized, leaving inherent reactivity underexamined. We introduce WorldExam, a hierarchical diagnostic benchmark spanning four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. It comprises 1,474 cases across eight dedicated tasks and supports unified evaluation of camera-, action-, and language-driven model paradigms. The World Reactivity level evaluates scene-conditioned reactions and goal-directed behaviors beyond what is explicitly specified in the input. Evaluation of 20 representative models reveals a clear capability split. Camera-driven models excel at camera control, but their interfaces do not support dynamic interaction; action-driven models control subjects more precisely but often leave the world unresponsive; and language-driven models perform better on interaction but follow complex controls less faithfully. No model combines broad task coverage with consistently strong performance, showing that high visual quality and explicit instruction fulfillment do not guarantee inherent reactivity.', 'score': 11, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '02882d4253b0287f', 'authors': ['Yuxue Yang', 'Shuyao Shang', 'Jiahe Wang', 'Zitong Zhou', 'Liang Tan', 'Junhan Zeng', 'Ruizhi Li', 'Junyan Li', 'Yu Liu', 'Xiao Yang', 'Yong Li', 'Jun Zhu', 'Hongsheng Li', 'Tieniu Tan', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['Chinese Academy of Sciences', 'Tsinghua University', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.02603.jpg', 'data': {'categories': ['#benchmark', '#video', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'Оценка реактивности виртуальных миров в моделях генерации видео', 'desc': 'В статье представлен WorldExam — иерархический бенчмарк для оценки моделей генерации видео, которые используются в качестве мировых моделей. Бенчмарк включает четыре уровня оценки: качество визуализации, соответствие управлению, пространственная согласованность и реактивность мира, охватывая 1474 случая в восьми различных задачах. Особое внимание уделяется оценке реактивности мира — способности модели предсказывать и генерировать правдоподобные последствия происходящего в сцене, которые не были явно указаны во входных данных. Анализ 20 моделей показал, что камеро-ориентированные модели хорошо управляют камерой, но не поддерживают динамическое взаимодействие, действие-ориентированные модели точнее контролируют объекты, но часто оставляют мир нереактивным, а языковые модели лучше справляются с взаимодействием, но менее точно следуют сложным командам.'}, 'en': {'title': 'Evaluating Video Models: Beyond Visuals to World Reactivity', 'desc': "This paper discusses the development of controllable video generation models that act as world models, focusing on their ability to react to scene states. It highlights the limitations of current evaluation benchmarks, which primarily assess visual quality and adherence to explicit instructions, neglecting the models' inherent reactivity. The authors introduce WorldExam, a comprehensive benchmark that evaluates models across four levels: Visual Quality, Control Adherence, Spatial Consistency, and World Reactivity. Their findings reveal that while different model types excel in specific areas, none achieve a balance of high performance across all tasks, indicating that visual appeal and instruction compliance do not ensure effective world interaction."}, 'zh': {'title': '评估视频生成模型的内在反应性', 'desc': '可控视频生成模型正在被开发为世界模型。评估这些模型不仅要看生成视频的外观，还要考虑它们所描绘世界的内在反应能力。现有的基准主要关注视觉质量和明确指令的实现，而对内在反应性关注不足。我们提出了WorldExam，这是一个分层诊断基准，涵盖视觉质量、控制遵循、空间一致性和世界反应性四个层面。'}}}, {'id': 'https://huggingface.co/papers/2608.02287', 'title': 'SKT: Skill-Use Training at Scale via Verified Synthetic Data Generation', 'url': 'https://huggingface.co/papers/2608.02287', 'abstract': 'Abstract  Agent skills have become an important mechanism for equipping language-model agents with reusable procedural knowledge. However, providing skills alone does not guarantee that current models can effectively identify, apply, and coordinate them. To improve skill-use capabilities, we introduce SKT, a verified data synthesis pipeline that constructs skill-grounded tasks and executable trajectories from large collections of agent skills. SKT selects suitable single-skill and multi-skill configurations, synthesizes tasks through rule-based and agent-based verification with feedback-guided repair, and retains only successful trajectories that substantially use every required skill. Using 2,000 public skills, SKT produces 4,000 task packages and 27,164 verified trajectories. Based on the same pipeline and a disjoint test pool, we further construct SkillEval, a held-out executable benchmark for evaluating skill use. Experiments across diverse models, benchmarks, and agent harnesses show that supervised fine-tuning on SKT-generated trajectories consistently improves skill-use performance. Verification ablations, cross-harness evaluation, and scaling experiments further demonstrate that these gains depend on high-quality supervision, extend beyond a single agent interface, and increase with broader skill coverage. Together, these results establish verified data synthesis as an effective and scalable approach for skill-use training.', 'score': 10, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '3306ffc2ed710b66', 'authors': ['Zelin Tan', 'Yiqun Zhang', 'Hao Li', 'Zhiyao Cui', 'Hejia Geng', 'Shao Zhang', 'Hangfan Zhang', 'Yang Chen', 'Xiaosong Wang', 'Lilong Wang', 'Zhenfei Yin', 'Shuyue Hu', 'Chen Zhang', 'Lei Bai'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.02287.jpg', 'data': {'categories': ['#training', '#reasoning', '#agents', '#benchmark', '#synthetic', '#dataset'], 'emoji': '🛠️', 'ru': {'title': 'Верифицированный синтез данных для обучения агентов использованию навыков', 'desc': 'В статье предлагается SKT — конвейер синтеза верифицированных данных для обучения агентов на основе больших языковых моделей эффективно использовать навыки. Система автоматически создаёт задачи и траектории выполнения, проверяя качество синтезированных данных с помощью обратной связи. Из 2000 публичных навыков генерируется 4000 пакетов задач и более 27000 верифицированных траекторий. Эксперименты показывают, что обучение с учителем на синтезированных данных стабильно улучшает способность моделей к координации и применению навыков.'}, 'en': {'title': 'Enhancing Agent Skills with Verified Data Synthesis', 'desc': 'This paper presents SKT, a data synthesis pipeline designed to enhance the skill-use capabilities of language-model agents. SKT constructs skill-grounded tasks and executable trajectories by selecting appropriate single and multi-skill configurations from a large pool of agent skills. The pipeline employs rule-based and agent-based verification methods to ensure that only successful trajectories that effectively utilize the required skills are retained. The results show that training on SKT-generated data significantly improves the performance of various models in skill application, highlighting the importance of high-quality supervision and broad skill coverage.'}, 'zh': {'title': '验证数据合成：提升技能使用的有效方法', 'desc': '本论文介绍了一种名为SKT的数据合成管道，用于构建基于技能的任务和可执行轨迹，以提高语言模型代理的技能使用能力。SKT通过选择合适的单技能和多技能配置，结合基于规则和基于代理的验证，合成任务并进行反馈修复，最终保留成功的轨迹。使用2000个公共技能，SKT生成了4000个任务包和27164个经过验证的轨迹。实验结果表明，在SKT生成的轨迹上进行监督微调可以显著提高技能使用性能，验证数据合成被确立为一种有效且可扩展的技能训练方法。'}}}, {'id': 'https://huggingface.co/papers/2608.01973', 'title': 'Roomer: Reflective Object-Grounded Model Editing and Repair for 3D Indoor Layout Synthesis', 'url': 'https://huggingface.co/papers/2608.01973', 'abstract': "Abstract  Existing indoor layout generators produce globally plausible layouts yet may retain local violations such as collisions, out-of-bounds placements, obstructed openings, and blocked circulation. Most prior work focuses on full-scene synthesis or scene-level optimization, with limited support for identifying responsible objects and locally repairing affected regions. We present Roomer, a reflective repair framework that casts these violations as sparse, object-grounded repair problems. Roomer encodes layouts as ``RoState'' and uses ``RoReview'' to bind measured violations to implicated objects. A geometry-conditioned vision-language model planner proposes a structured local edit, while a deterministic solver validates it and generates a finite set of candidate edits when needed. Each candidate is committed only if full-scene verification confirms that it resolves the target violation without new hard violations or broken protected constraints. We train the planner on Roomer-CC, a controlled-corruption dataset that pairs faulty layouts with object-grounded violation evidence and known-feasible inverse StatePatches. Since existing benchmarks rarely assess whether physically valid layouts are usable, we introduce Roomer-Eval to assess distributional quality, physical validity, and practical usability. Experiments show that Roomer repairs residual violations while preserving valid regions, improves physical validity and usability, and transfers across external generators.", 'score': 6, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '1bfea2972109a104', 'authors': ['Lingwei Dang', 'Ziyan Qiu', 'Jiajia Cheng', 'Shishuo Shang', 'Zhenhao Zhang', 'Yufei Zhu', 'Qingxin Xiao', 'Pan Liu', 'Shenghui Huang', 'Yun Hao', 'Juntong Li', 'Qingyao Wu'], 'affiliations': ['School of Information Science and Technology, ShanghaiTech University', 'School of Software Engineering, South China University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.01973.jpg', 'data': {'categories': ['#benchmark', '#cv', '#multimodal', '#dataset'], 'emoji': '🏠', 'ru': {'title': 'Локальное восстановление планировок помещений через обоснованное редактирование', 'desc': 'В статье представлена система Roomer для исправления локальных нарушений в сгенерированных планировках помещений, таких как коллизии объектов и перекрытие проходов. Система использует vision-language модель для предложения структурированных локальных редактирований и детерминированный решатель для проверки их корректности. Авторы создали специальный датасет Roomer-CC для обучения модели на парах ошибочных планировок с аннотациями нарушений. Предложен также новый бенчмарк Roomer-Eval для оценки не только физической валидности, но и практической удобства использования сгенерированных сцен.'}, 'en': {'title': 'Roomer: Smart Fixes for Indoor Layouts', 'desc': 'The paper introduces Roomer, a framework designed to fix local layout violations in indoor spaces, such as collisions and blocked openings. It treats these issues as specific problems linked to individual objects, allowing for targeted repairs. Roomer uses a combination of a geometry-conditioned vision-language model and a deterministic solver to propose and validate local edits to the layout. The framework is trained on a dataset that includes faulty layouts and their corresponding violation evidence, and it also introduces a new evaluation method to ensure the usability and physical validity of the generated layouts.'}, 'zh': {'title': 'Roomer：智能室内布局修复框架', 'desc': '本文介绍了一种名为Roomer的室内布局修复框架，旨在解决现有布局生成器在局部区域存在的违规问题，如碰撞和阻塞。Roomer将这些违规视为稀疏的、与对象相关的修复问题，通过编码布局为“RoState”并使用“RoReview”将违规与相关对象绑定。该框架利用几何条件的视觉-语言模型规划器提出结构化的局部编辑，并通过确定性求解器验证这些编辑。实验表明，Roomer能够修复剩余的违规，同时保持有效区域，提高物理有效性和可用性。'}}}, {'id': 'https://huggingface.co/papers/2608.01954', 'title': 'StyleForge: Indoor Furniture Styling by Counterfactual Reasoning in a Hypergraph Field', 'url': 'https://huggingface.co/papers/2608.01954', 'abstract': 'Abstract  Fixed-layout indoor furniture styling requires selecting assets that form a coherent room without changing the prescribed furniture categories, positions, orientations, or scales. Existing approaches typically retrieve each asset independently or rely on static local relations, making them prone to shape, material, and color conflicts after scene composition. We introduce StyleForge, a scene-level structured selection framework built on a dynamic hypergraph style field. A frozen multimodal large language model extracts structured style priors from an open-ended style request and the fixed layout, while StyleForge maintains a learnable candidate distribution for each furniture slot. Conditioned on the target style, the dynamic hypergraph style field adaptively activates and weights layout-induced hyperedges to capture higher-order dependencies among furniture. Counterfactual style preference learning then treats each candidate as a local substitution in the current style field and evaluates its contextual compatibility using Mahalanobis energies. Training alternates between optimizing the style field and the candidate logits. At inference, the model remains frozen and test-time training updates only room-specific candidate logits, progressively correcting cross-slot style conflicts as the global scene context evolves. Experiments on 3D-FRONT demonstrate state-of-the-art furniture retrieval and scene-level style coherence, producing more coherent fixed-layout furniture arrangements than object- and scene-level retrieval baselines.', 'score': 5, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e63a4aa860176486', 'authors': ['Lingwei Dang', 'Shishuo Shang', 'Pan Liu', 'Jiajia Cheng', 'Ziyan Qiu', 'Zhenhao Zhang', 'Yufei Zhu', 'Shenghui Huang', 'Qingxin Xiao', 'Yun Hao', 'Juntong Li', 'Qingyao Wu'], 'affiliations': ['School of Information Science and Technology, ShanghaiTech University', 'School of Software Engineering, South China University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.01954.jpg', 'data': {'categories': ['#3d', '#multimodal', '#training'], 'emoji': '🛋️', 'ru': {'title': 'Согласованный выбор мебели через динамическое гиперграфовое поле стиля', 'desc': 'StyleForge представляет собой фреймворк для выбора мебели в интерьере, который поддерживает фиксированные позиции и ориентации предметов. Система использует замороженную многомодальную LLM для извлечения стилевых приоритетов из пользовательского запроса и макета помещения. Динамическое гиперграфовое поле стиля адаптивно активирует связи между предметами мебели, учитывая их взаимные влияния при оценке совместимости. Обучение использует контрфактический анализ предпочтений стиля с энергией Махаланобиса для проверки согласованности стиля на уровне всей сцены.'}, 'en': {'title': 'StyleForge: Coherent Furniture Selection for Fixed Layouts', 'desc': 'The paper presents StyleForge, a novel framework for selecting indoor furniture that maintains a coherent style while adhering to fixed layout constraints. It utilizes a dynamic hypergraph style field to capture complex relationships between furniture pieces, allowing for better integration of style preferences. By employing a frozen multimodal large language model, StyleForge extracts structured style information from user requests and optimizes the selection process through counterfactual learning. The results show that StyleForge outperforms existing methods in achieving coherent furniture arrangements, demonstrating its effectiveness in scene-level style coherence.'}, 'zh': {'title': '智能家具风格选择，提升室内设计一致性', 'desc': '本文介绍了一种名为StyleForge的室内家具风格选择框架，旨在在固定布局下选择和组合家具。该框架利用动态超图样式场，能够提取结构化的样式先验，并在每个家具位置维护可学习的候选分布。通过对目标风格的条件化，StyleForge能够捕捉家具之间的高阶依赖关系，从而减少样式冲突。实验结果表明，StyleForge在家具检索和场景风格一致性方面表现优越，能够生成更为协调的固定布局家具安排。'}}}, {'id': 'https://huggingface.co/papers/2608.02358', 'title': 'ScrambleToolBench: Agents Search Exhaustively Even When Their Own Map Points to the Next Step', 'url': 'https://huggingface.co/papers/2608.02358', 'abstract': 'Abstract  To operate robustly in open-world environments, autonomous agents should be able to infer the behavior of unfamiliar systems through interaction alone, even in the absence of documentation. However, existing tool-use benchmarks expose semantic tool schemas in static environments, allowing agents to rely on prior knowledge rather than autonomous discovery. To address this limitation, we introduce ScrambleToolBench, an interactive terminal benchmark designed to isolate behavioral reasoning. By removing semantic cues and enforcing a continuous task curriculum, the benchmark requires agents to uncover hidden tool behaviors entirely through trial-and-error interaction. The benchmark further introduces dynamic challenges, including mapping drift, stochastic action failures, and temporal execution windows, to evaluate whether agents can revise and adapt their hypotheses as the environment changes. Our evaluation of state-of-the-art language models reveals that successful initial discovery does not translate into robust adaptation. When faced with structural changes such as mapping drift, agents fail to use deductive strategies such as cycle tracing, and instead exhibit belief inertia or fall back to exhaustive search. Increasing test-time reasoning only amplifies this expensive brute-force search rather than enabling deductive recovery. While equipping agents with persistent memory reduces compounding errors, they remain unable to efficiently infer structural changes, highlighting a gap in current agent reasoning.', 'score': 4, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'e17650db15adbe80', 'authors': ['Vernon Toh', 'Navonil Majumder', 'Zhengyuan Liu', 'Nancy F. Chen', 'Soujanya Poria'], 'affiliations': ['Agency for Science, Technology, and Research (A*STAR), Singapore', 'DeCLaRe Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.02358.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔧', 'ru': {'title': 'Агенты LLM не умеют приспосабливаться: разрыв между открытием и адаптацией', 'desc': 'В работе представлена система ScrambleToolBench для оценки способности автономных агентов на основе больших языковых моделей (LLM) открывать и адаптировать поведение незнакомых инструментов исключительно через взаимодействие, без доступа к семантической информации. Бенчмарк удаляет семантические подсказки и использует прогрессивный curriculum обучения, заставляя агентов методом проб и ошибок выяснять скрытую функциональность инструментов. Исследование выявило критический разрыв: современные LLM успешно открывают начальное поведение инструментов, но не способны эффективно адаптироваться при изменении окружения, таких как сдвиг отображения или стохастические сбои. Агенты полагаются на перебор вариантов вместо дедуктивных стратегий вроде трассировки циклов, что указывает на недостаток в способности агентов к гипотетическому рассуждению и адаптивному обучению.'}, 'en': {'title': 'Discovering Tools Through Interaction: A New Benchmark for Autonomous Agents', 'desc': "This paper presents ScrambleToolBench, a new benchmark for testing how autonomous agents can learn about unfamiliar tools through interaction without prior knowledge. Unlike existing benchmarks that provide semantic cues, ScrambleToolBench focuses on behavioral reasoning by requiring agents to discover tool functions via trial-and-error. The benchmark introduces dynamic challenges like mapping drift and stochastic failures to assess agents' adaptability in changing environments. The findings show that while agents can initially discover tool behaviors, they struggle to adapt to structural changes, indicating a need for improved reasoning strategies in machine learning models."}, 'zh': {'title': '自主代理的行为推理新挑战', 'desc': '为了在开放世界环境中稳健地操作，自主代理需要通过交互推断不熟悉系统的行为，而不依赖文档。现有的工具使用基准测试在静态环境中暴露了语义工具模式，使代理依赖于先前知识，而不是自主发现。为了解决这个问题，我们引入了ScrambleToolBench，这是一个交互式基准测试，旨在隔离行为推理。该基准通过消除语义线索和强制连续任务课程，要求代理完全通过试错交互来发现隐藏的工具行为。'}}}, {'id': 'https://huggingface.co/papers/2608.00440', 'title': 'Poplar: A Scalable Pipeline for Human-Centric Image Dataset Synthesis', 'url': 'https://huggingface.co/papers/2608.00440', 'abstract': 'Abstract  Recent image generators can synthesize convincing human-centric images, yet producing a useful collection remains different from producing a single successful image. A human-centric dataset must cover varied people and contexts, avoid implausible attribute combinations, preserve an everyday photographic character, and expose quality-control decisions at scale. We present Poplar, a reproducible Specify--Render--Inspect pipeline for human-centric image dataset synthesis. Specify samples structured attributes under commonsense constraints and verbalizes them as photography-oriented prompts. Render uses a realism-adapted image generator across composition-aware aspect ratios and retries obvious technical failures. Inspect applies a single structured vision--language review to each candidate, preserving the original prompt while rejecting intrinsic image defects or material prompt mismatches. Using Poplar, we construct Poplar-9K: 9,401 curated human-centric image--text pairs retained from 11,765 reviewed candidates (79.9\\% acceptance). We release the dataset together with the pipeline, configurations, immutable generation prompts, and auditable inspection records as a compact resource for building customizable human-centric collections.', 'score': 2, 'issue_id': 2839, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '9b73548a6fe0055c', 'authors': ['Zhishan Zou'], 'affiliations': ['Beijing University of Posts and Telecommunications'], 'pdf_title_img': 'assets/pdf/title_img/2608.00440.jpg', 'data': {'categories': ['#multimodal', '#cv', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Автоматизированный конвейер для синтеза качественных датасетов людей', 'desc': 'Авторы представляют Poplar — воспроизводимый конвейер для синтеза человеко-центричных датасетов с использованием генераторов изображений. Система работает в три этапа: спецификация структурированных атрибутов под логические ограничения, рендеринг изображений с адаптацией к реалистичности, и инспекция с помощью мультимодальной модели зрения-языка. На основе этого подхода создан датасет Poplar-9K из 9,401 высококачественной пары изображение-текст с 79,9% acceptance rate. Разработчики открывают датасет вместе с полным конвейером, конфигурациями и аудит-логами для создания кастомизированных человеко-центричных коллекций.'}, 'en': {'title': 'Poplar: Crafting Quality Human-Centric Image Datasets', 'desc': 'This paper introduces Poplar, a new pipeline designed for creating high-quality human-centric image datasets. The pipeline consists of three main steps: Specify, Render, and Inspect, which work together to ensure that the generated images meet specific criteria. It emphasizes the importance of structured attributes and commonsense constraints to avoid unrealistic combinations in the images. The authors also present the Poplar-9K dataset, which includes over 9,000 curated image-text pairs, providing a valuable resource for future machine learning applications.'}, 'zh': {'title': '构建高质量人类中心图像数据集的创新管道', 'desc': '最近的图像生成器可以合成逼真的人类图像，但制作一个有用的图像集合与生成单个成功图像是不同的。我们提出了Poplar，这是一个可重复的指定-渲染-检查管道，用于人类中心图像数据集的合成。该管道通过常识约束来指定结构化属性，并将其转化为摄影导向的提示。使用Poplar，我们构建了Poplar-9K：从11,765个候选图像中保留的9,401个经过审查的人类中心图像-文本对。'}}}, {'id': 'https://huggingface.co/papers/2608.01755', 'title': 'Deferred Exposure of Future Trajectories for Verifiable Reasoning in Autonomous Driving VLMs', 'url': 'https://huggingface.co/papers/2608.01755', 'abstract': 'Abstract  Recent Vision-Language-Action (VLA) models for autonomous driving (AD) increasingly utilize chain-of-thought (CoT) supervision to enhance the reasoning capabilities of their Vision-Language Model (VLM) components, yet existing annotation pipelines commonly expose the teacher model to the logged ground-truth (GT) future trajectory. We empirically show that this induces trajectory anchoring bias: teacher models rationalize the revealed outcome rather than infer a decision from scene evidence, producing less causally faithful CoTs and substantially more severe hallucinations, especially in causally challenging scenes. Removing the GT trajectory eliminates this shortcut, but open-ended trajectory generation entangles high-level decision-making with precise geometric synthesis and low-level dynamics. To make trajectory-level driving decisions verifiable without requiring open-ended trajectory synthesis, we introduce Autonomous-Driving Multiple-Choice Question (AD-MCQ), which casts planning as selection among explicit trajectory
