    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.23802', 'title': 'From RLVR to RLSVR: Task Transformation Induces Self-Verifiable Rewards for Open-Ended LLM Self-Improvement', 'url': 'https://huggingface.co/papers/2607.23802', 'abstract': 'Abstract  Reinforcement Learning with Verifiable Rewards (RLVR) has driven recent progress in reasoning-oriented large language models (LLMs) by enabling large-scale optimization. However, its applicability remains largely limited to domains such as mathematics and coding, where correctness can be deterministically verified. Open-ended tasks instead often rely on human preferences, reward models, or LLM-based judges, introducing evaluation bias, judge capability bottlenecks, and additional inference costs.Drawing on the principle of self-supervised learning, which constructs pretext tasks to derive supervision from the data itself, we propose Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a task-transformation-based training paradigm for extending RLVR to open-ended tasks. RLSVR transforms open-ended tasks into verifiable proxy environments whose internal rules and interaction outcomes automatically generate reward signals. We instantiate RLSVR with SpyRL, a multi-agent self-play environment inspired by Who Is the Spy?. Agents receive asymmetric information, complete the same target task, and vote to identify a designated spy. Because the spy identity is predetermined, voting outcomes provide fully verifiable rewards, while successful identification remains closely related to output quality. Experiments on text summarization, creative writing, and mathematical reasoning show that SpyRL outperforms existing self-improvement methods on non-verifiable tasks and yields consistent gains on verifiable reasoning tasks. These results demonstrate that task transformation can extend scalable RLVR-based self-improvement beyond inherently verifiable domains. Models and code have been released at https://github.com/wangqinsi1/SpyRL.', 'score': 35, 'issue_id': 2828, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'aee77672c906db77', 'authors': ['Qinsi Wang', 'Jing Shi', 'Huazheng Wang', 'Kun Wan', 'Yiran Wu', 'Bo Liu', 'Qingyun Wu', 'Hai Helen Li', 'Yiran Chen', 'Handong Zhao', 'Wentian Zhao'], 'affiliations': ['Adobe Inc.', 'Amazon', 'Duke University', 'National University of Singapore', 'Oregon State University', 'Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.23802.jpg', 'data': {'categories': ['#rl', '#open_source', '#reasoning', '#agents', '#rlhf', '#alignment', '#training'], 'emoji': '🕵️', 'ru': {'title': 'Трансформация задач для масштабируемого обучения с самопроверяемыми наградами', 'desc': 'В статье предлагается метод Reinforcement Learning с Self-Verifiable Rewards (RLSVR), который расширяет применение обучения с подтверждаемыми наградами на открытые задачи через трансформацию этих задач в проверяемые прокси-окружения. Авторы вдохновляются принципом самоконтролируемого обучения и создают SpyRL — многоагентное окружение самопроцесса, где агенты с асимметричной информацией выполняют целевую задачу и голосуют за выявление шпиона, что автоматически генерирует сигналы награды. Экспериментальные результаты на задачах суммаризации текста, творческого письма и математических рассуждений показывают, что SpyRL превосходит существующие методы самоулучшения для неверифицируемых задач и дает улучшения на верифицируемых задачах рассуждения. Таким образом, трансформация задач позволяет масштабировать методы обучения с подтвержденными наградами за пределы изначально верифицируемых доменов.'}, 'en': {'title': 'Transforming Tasks for Self-Verifiable Learning', 'desc': 'The paper introduces Reinforcement Learning with Self-Verifiable Rewards (RLSVR), a new approach that enhances traditional Reinforcement Learning with Verifiable Rewards (RLVR) for open-ended tasks. RLSVR transforms these tasks into verifiable proxy environments, allowing for automatic generation of reward signals based on the internal rules of the task. The method is exemplified through SpyRL, a multi-agent environment where agents identify a spy based on asymmetric information, providing verifiable rewards through voting outcomes. Experiments demonstrate that RLSVR improves performance on both non-verifiable and verifiable tasks, showcasing its potential to extend scalable self-improvement in reinforcement learning.'}, 'zh': {'title': '自我可验证奖励，拓展强化学习的边界', 'desc': '强化学习与可验证奖励（RLVR）在推理导向的大型语言模型（LLMs）中取得了进展，但其应用主要限于数学和编程等领域。本文提出了一种新的训练范式，称为自我可验证奖励的强化学习（RLSVR），旨在将RLVR扩展到开放式任务。RLSVR通过将开放式任务转化为可验证的代理环境，自动生成奖励信号，从而克服了评估偏差和判断能力瓶颈的问题。实验结果表明，RLSVR在文本摘要、创意写作和数学推理等任务上表现优于现有方法，展示了任务转化的潜力。'}}}, {'id': 'https://huggingface.co/papers/2607.28617', 'title': 'AISPA: User-Centric System Prompt Auditing for Large Language Model Applications', 'url': 'https://huggingface.co/papers/2607.28617', 'abstract': 'Abstract  System prompts are instructions configured by developers to govern the behaviors of foundation models in AI applications. They are used throughout commercial AI products, but are rarely disclosed to the public or regulators, creating a serious trust and accountability gap in the wide deployment of AI systems. In this paper, we introduce Artificial Intelligence System Prompt Assurance (AISPA), a user-centric framework for systematically auditing system prompts in AI systems. AISPA examines specific parts of a system prompt and evaluates them along eight dimensions that matter to users. We then use this framework to review 3,249 instructions from system prompts in 88 commercial AI products, classifying each instruction as either protective (of users) or problematic. Our audit surfaces four core findings. First, system prompt design varies substantially across products and developers, with some organizations averaging over 60 protective instructions per product while others average fewer than 5. Second, protective instructions are widely adopted but shallow in scope: 98.9% of products contain at least one, yet only 24% cover all eight dimensions of the AISPA taxonomy. Third, system prompts have grown steadily longer and more protective of users, suggesting that user protection is becoming a more visible concern in commercial prompt design. Fourth, despite this progress, problematic instructions remain pervasive: roughly 40% of products contain at least one instruction that works against user interests, and protective and problematic instructions frequently coexist within the same prompt. Our findings highlight the need for greater transparency, standardization, and independent oversight for system prompts in commercial AI products.', 'score': 28, 'issue_id': 2828, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'fd2e4d2b5dda0213', 'authors': ['Xiangning Lin', 'Shenzhe Zhu', 'Shu Yang', 'Zhenyu Zhang', 'Haoqian Zhang', 'Yipeng Zhao', 'Chengxuan Qian', 'Tianwei Wang', 'Ziheng Zhang', 'Zhenlong Yuan', 'Dingcheng Wang', 'Juncheng Wu', 'Yuan Si', 'Jiaxin Liu', 'Baolong Bi', 'Robert Mahari', 'Tobin South', 'Dazza Greenwood', 'Zexue He', 'Rishi Bommasani', 'Sophia Kazinnik', 'Andreas Haupt', 'Samuele Marro', 'Erik Brynjolfsson', 'Alex Pentland', 'Jiaxin Pei'], 'affiliations': ['Carnegie Mellon University', 'Institute for Decentralized AI', 'King Abdullah University of Science and Technology', 'Massachusetts Institute of Technology', 'Northwestern University', 'Ohio State University', 'Stanford University', 'University of California, Santa Barbara', 'University of California, Santa Cruz', 'University of Illinois Urbana-Champaign', 'University of Oxford', 'University of Texas at Austin', 'University of Toronto', 'Washington University in St. Louis'], 'pdf_title_img': 'assets/pdf/title_img/2607.28617.jpg', 'data': {'categories': ['#alignment', '#security', '#ethics'], 'emoji': '🔍', 'ru': {'title': 'Прозрачность и ответственность: аудит скрытых инструкций в коммерческих AI-системах', 'desc': 'В статье представлена структурированная методология AISPA для аудита системных инструкций, которые разработчики используют для управления поведением больших языковых моделей в коммерческих AI-приложениях. Исследователи провели анализ 3249 инструкций из системных промптов 88 коммерческих AI-продуктов, классифицируя их по восьми измерениям с точки зрения защиты интересов пользователей. Ключевые находки показывают существенную вариативность в подходах к проектированию система промптов, широкое распространение защитных инструкций при их поверхностном охвате, и одновременное присутствие как защитных, так и проблемных инструкций в одном промпте. Исследование подчеркивает критическую необходимость в повышении прозрачности, стандартизации и независимом надзоре за системными промптами в коммерческих AI-продуктах.'}, 'en': {'title': 'Ensuring Trust in AI: Auditing System Prompts for User Protection', 'desc': 'This paper discusses the importance of system prompts, which are instructions that guide the behavior of AI models in applications. It introduces a framework called Artificial Intelligence System Prompt Assurance (AISPA) to audit these prompts, focusing on user-centric dimensions. The study analyzed over 3,000 instructions from various AI products, revealing significant variability in protective measures across different developers. Despite improvements in user protection, many products still contain problematic instructions, indicating a need for better transparency and oversight in AI prompt design.'}, 'zh': {'title': '提升AI系统提示的透明度与标准化', 'desc': '本论文介绍了人工智能系统提示保障（AISPA），这是一个以用户为中心的框架，用于系统地审计人工智能系统中的系统提示。我们分析了882个商业AI产品中的3249条系统提示指令，评估其对用户的保护性和潜在问题。研究发现，系统提示的设计在不同产品和开发者之间差异显著，且尽管保护性指令普遍存在，但其覆盖范围较窄。尽管系统提示在保护用户方面有所进展，但仍有约40%的产品包含与用户利益相悖的指令，显示出对系统提示透明度和标准化的迫切需求。'}}}, {'id': 'https://huggingface.co/papers/2607.28415', 'title': 'QQWorld: Quantile-Quantile Matching for World Model Regularization', 'url': 'https://huggingface.co/papers/2607.28415', 'abstract': 'Abstract  Latent world models enable efficient planning by predicting future states in a compact representation space, but their performance depends critically on the quality of the learned latent distribution. LeWorldModel (LeWM) regularizes its latents toward an isotropic Gaussian using the Epps-Pulley (EP) objective. We show that the corrective gradients of EP rapidly vanish for isolated tail samples, leaving heavy-tailed deviations insufficiently controlled. To address this limitation, we propose QQWorld, which replaces EP with a quantile-quantile matching objective that directly aligns projected latent samples with rank-matched Gaussian quantiles, thereby maintaining effective corrective gradients in the tails. We further develop cross-batch QQ, which enlarges the effective ranking pool using detached samples from previous batches, and characterize its bias-variance trade-off. Across four control environments, QQWorld effectively improves the average planning success rate of LeWM, while consistently yielding better Gaussian alignment and thinner latent tails.', 'score': 22, 'issue_id': 2828, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'd2f3e924607b731d', 'authors': ['Zhoushun Yu', 'Xiaoyu Hu', 'Xiangyu Xu'], 'affiliations': ['Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28415.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Квантиль-квантильное выравнивание латентных моделей мира для лучшего контроля хвостов распределения', 'desc': 'В статье рассматривается проблема обучения латентных моделей мира, которые используются для эффективного планирования путём предсказания будущих состояний в пространстве низкой размерности. Авторы показывают, что существующий метод регуляризации (Epps-Pulley) неэффективно контролирует выбросы в хвостах распределения, так как корректирующие градиенты исчезают на изолированных образцах. Они предлагают QQWorld — новый подход, основанный на квантиль-квантильном выравнивании, который поддерживает эффективные градиенты в хвостах распределения и улучшает его гауссовость. Дополнительно разработан метод cross-batch QQ, расширяющий пул для ранжирования с помощью выборок из предыдущих батчей, что улучшает качество планирования в задачах управления.'}, 'en': {'title': 'Enhancing Latent Models with QQWorld for Better Planning', 'desc': 'This paper discusses the importance of latent world models in machine learning, which help in planning by predicting future states in a simplified way. The authors introduce QQWorld, a new method that improves the learning of latent distributions by using a quantile-quantile matching objective instead of the traditional Epps-Pulley objective. This new approach ensures that the model effectively manages the tails of the distribution, which are often problematic in standard methods. The results show that QQWorld enhances planning success rates and achieves better alignment with Gaussian distributions across various environments.'}, 'zh': {'title': '提升潜在模型规划效率的QQWorld', 'desc': '潜在世界模型通过在紧凑的表示空间中预测未来状态来实现高效规划，但其性能依赖于学习到的潜在分布的质量。LeWorldModel (LeWM) 使用 Epps-Pulley (EP) 目标对潜在变量进行正则化，目标是使其接近各向同性高斯分布。我们发现，EP 的修正梯度对于孤立的尾部样本迅速消失，导致重尾偏差控制不足。为了解决这个问题，我们提出了 QQWorld，它用分位数-分位数匹配目标替代 EP，直接将投影的潜在样本与排名匹配的高斯分位数对齐，从而在尾部保持有效的修正梯度。'}}}, {'id': 'https://huggingface.co/papers/2607.23782', 'title': 'N_0-VTLA: Scaling Vision-Tactile-Language-Action Model with Latent Tactile Tokens', 'url': 'https://huggingface.co/papers/2607.23782', 'abstract': 'Abstract  We present N_0-VTLA, a vision-tactile-language-action (VTLA) foundation model capable of (1) fine-grained contact-rich manipulation with tactile perception and tactile-feedback control, and (2) offline policy improvement from stored deployment data. Building on current vision-based backbones, we propose a training recipe for tactile integration consisting of visuo-tactile pre-training, staged tactile-pathway integration, and advantage-conditioned offline policy improvement. During pre-training, the policy learns broad contact priors from NeoData, our large-scale visuo-tactile robot dataset; to our knowledge, N_0-VTLA is the first VTLA model pretrained on tactile data at scale. During post-training, we augment the policy with a predictive tactile pathway that distills the contact patterns learned at scale into the fine motion adjustments required by downstream tactile-centric manipulation. For offline policy improvement, we introduce ALTER, an advantage-conditioned offline reinforcement learning method that converts relative progress and trajectory-event comparisons into binary advantage labels for policy training on a fixed deployment corpus, further improving task-specific learning on contact-rich skills such as deformable object manipulation. Across contact-rich benchmarks, N_0-VTLA outperforms strong baselines by wide margins: it wins all nine real-robot NeoReal tasks and reaches 63.8% mean success on a twenty-task simulation suite, against 44.0% for the strongest baseline. N_0-VTLA policies trained with ALTER reach 75-95% success on three long-horizon real-robot tasks. These results lay a foundation for versatile tactile-driven manipulation policies.', 'score': 22, 'issue_id': 2828, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'db7423a28f77d870', 'authors': ['NeoteAI Team', 'Fudan TEAI Team'], 'affiliations': ['Fudan TEAI Team', 'NeoteAI Team'], 'pdf_title_img': 'assets/pdf/title_img/2607.23782.jpg', 'data': {'categories': ['#rl', '#dataset', '#robotics', '#multimodal', '#training'], 'emoji': '🤖', 'ru': {'title': 'Тактильное восприятие в фундаментальных моделях для манипуляции', 'desc': 'Представлена N_0-VTLA — модель-фундамент, интегрирующая зрение, тактильное восприятие и язык для обучения с подкреплением манипуляционных навыков. Ключевая инновация — предварительное обучение на большом масштабе тактильных данных из датасета NeoData с последующей интеграцией тактильного пути в политику агента. Для улучшения политики без взаимодействия со средой авторы предложили метод ALTER, который преобразует относительный прогресс в бинарные метки преимущества для обучения на фиксированном корпусе данных. Модель значительно превосходит базовые решения на задачах с контактным взаимодействием, включая манипуляцию деформируемыми объектами и долгосрочные манипуляции на реальных роботах.'}, 'en': {'title': 'Revolutionizing Robotic Manipulation with Tactile Intelligence', 'desc': 'The N_0-VTLA model is a foundation model that integrates vision, tactile perception, and language to enhance robotic manipulation skills. It utilizes a unique training approach that includes visuo-tactile pre-training and a predictive tactile pathway to improve fine motor control during contact-rich tasks. The model employs ALTER, an offline reinforcement learning method, to refine its policy using stored data, allowing it to learn from past experiences effectively. As a result, N_0-VTLA demonstrates superior performance in various manipulation tasks, significantly outperforming existing models.'}, 'zh': {'title': '触觉驱动的灵活操作新基础', 'desc': '本文介绍了一种名为N_0-VTLA的视觉-触觉-语言-动作基础模型，能够实现精细的接触丰富操作，结合触觉感知和反馈控制。该模型通过视觉-触觉预训练、分阶段触觉通路整合和基于优势的离线策略改进来进行训练。N_0-VTLA是首个在大规模触觉数据上进行预训练的VTLA模型，能够从NeoData数据集中学习广泛的接触先验。通过引入ALTER方法，模型在固定的部署数据上进行策略训练，显著提升了在接触丰富技能上的任务特定学习。'}}}, {'id': 'https://huggingface.co/papers/2607.29679', 'title': 'Scaling Properties of Text Conditioning in Visual Generation', 'url': 'https://huggingface.co/papers/2607.29679', 'abstract': 'Abstract  We study empirical scaling properties for text conditioning in visual generation. Such properties have rarely been measured because diffusion loss does not scale with the number of tokens in natural-language prompts. Surprisingly, we find that the converged diffusion loss scales with the amount of structured language in the prompt. To quantify structured language, we adapt two complementary measures: a white-box likelihood metric (GPG) and a black-box attribute metric (ED). Across controlled training runs, the converged diffusion loss decreases approximately linearly with GPG and follows a power law with ED. Guided by these scaling properties, we improve diffusability by constructing structured prompts with semantic and geometric annotations derived from images, and improve promptability by training a prompter through supervised fine-tuning, cold-start, and verifier-gated on-policy distillation. The resulting system outperforms all evaluated open-weight models on nearly every compositional, reasoning, and world-knowledge benchmark, while matching or surpassing the strongest closed-weight models on most evaluations.', 'score': 18, 'issue_id': 2828, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '61202b92b5171793', 'authors': ['Zilong Chen', 'Chaorui Deng', 'Kunchang Li', 'Hongyi Yuan', 'Haoqi Fan'], 'affiliations': ['ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2607.29679.jpg', 'data': {'categories': ['#cv', '#benchmark', '#diffusion', '#reasoning', '#optimization', '#multimodal', '#training'], 'emoji': '🖼️', 'ru': {'title': 'Структурированный язык — ключ к совершенной генерации изображений', 'desc': 'Исследование изучает, как качество текстовых описаний влияет на результаты генерации изображений с помощью диффузионных моделей. Авторы обнаружили, что потери диффузии уменьшаются линейно и по степенному закону в зависимости от структурированности естественного языка в промптах, которую они измеряют двумя метриками. На основе этих закономерностей они улучшили качество генерации путём создания более структурированных промптов с семантическими и геометрическими аннотациями, а также обучили специальную модель для автоматического создания оптимальных описаний. Полученная система превосходит открытые модели-конкуренты на бенчмарках композиции, логических рассуждений и знания об окружающем мире.'}, 'en': {'title': 'Enhancing Visual Generation with Structured Language Prompts', 'desc': 'This paper investigates how the structure of language in prompts affects the performance of visual generation models. It reveals that the diffusion loss, which is a measure of how well the model generates images from text, improves when prompts contain more structured language. The authors introduce two metrics to measure this structure: a likelihood metric and an attribute metric. By enhancing the prompts with semantic and geometric information and fine-tuning the model, they achieve superior results compared to existing models on various benchmarks.'}, 'zh': {'title': '提升视觉生成的文本条件能力', 'desc': '本文研究了文本条件在视觉生成中的经验缩放特性。我们发现，收敛的扩散损失与提示中的结构化语言量成正比。为此，我们采用了两种互补的度量方法：白盒似然度量（GPG）和黑盒属性度量（ED）。通过构建带有语义和几何注释的结构化提示，并通过监督微调等方法训练提示器，我们的系统在多个基准测试中超越了所有评估的开放权重模型。'}}}, {'id': 'https://huggingface.co/papers/2607.28675', 'title': 'Meshy T2: Fast Native Mesh Generation with Flow Matching', 'url': 'https://huggingface.co/papers/2607.28675', 'abstract': 'Abstract  Polygonal meshes are the standard surface representation of modern 3D pipelines, and generating high-quality meshes with artist-style topology is essential for film, gaming, and interactive 3D applications. Mainstream approaches serialize a mesh into a token sequence and decode it autoregressively, which is slow at inference and sensitive to error accumulation, making them impractical for interactive asset creation. We present Meshy T2, a fast native mesh generation framework built on flow matching. At its core is a vertex-set mesh VAE that encodes a mesh into one continuous latent token per vertex and decodes vertices, edge connectivity, and face winding order in a single pass, preserving high-precision geometry and artist-authored topology without vertex quantization or welding. Generation proceeds as a coarse-to-fine cascade of two flow-matching models: an image-conditioned voxel flow first sketches the overall shape as a coarse occupancy scaffold, and a mesh flow then populates the scaffold with per-vertex latent tokens, conditioned on the image, the scaffold, and a requested vertex budget. This design delivers three practical capabilities: interactive generation speed through parallel flow-based synthesis; effective face-count control through the requested vertex budget; and native support for multi-part assets, whose components emerge directly from the generated connectivity. In our experiments, Meshy T2 achieves state-of-the-art geometric fidelity and completes end-to-end image-to-mesh generation within a median of 6 seconds, over an order of magnitude faster than autoregressive baselines. Code and weights will be available at https://github.com/meshy-dev/meshy-t2.', 'score': 18, 'issue_id': 2829, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'a160a3be8f7cd682', 'authors': ['Jiale Xu', 'Rendong Liang', 'Yuhao Long', 'Siyuan Shen', 'Zangyueyang Xian', 'Zeyi Xu', 'Yuanming Hu'], 'affiliations': ['Meshy AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.28675.jpg', 'data': {'categories': ['#3d', '#open_source', '#inference', '#multimodal', '#architecture', '#games'], 'emoji': '🎨', 'ru': {'title': 'Быстрая генерация 3D-сеток из изображений через flow matching с каскадным уточнением', 'desc': 'В работе представлена Meshy T2 — быстрая система генерации трёхмерных полигональных сеток на основе flow matching, которая кодирует мешь в непрерывное латентное представление с одним токеном на вершину. Система использует каскадный подход из двух моделей: первая модель flow matching с кондиционированием по изображению генерирует грубый voxel scaffold занятости пространства, а вторая заполняет этот каркас латентными токенами вершин с контролем количества граней. Благодаря параллельной обработке на основе flow matching вместо автрегрессивного декодирования, система достигает интерактивной скорости генерации (6 секунд на полный цикл image-to-mesh) при сохранении высокой геометрической точности и авторской топологии мешей. Предложенный подход позволяет эффективно контролировать сложность мешей, поддерживает многокомпонентные активы и работает на порядок быстрее существующих автрегрессивных базовых моделей.'}, 'en': {'title': 'Fast and Precise Mesh Generation with Meshy T2', 'desc': 'The paper introduces Meshy T2, a novel framework for generating high-quality polygonal meshes efficiently. It utilizes a vertex-set mesh Variational Autoencoder (VAE) to encode meshes into continuous latent tokens, allowing for a single-pass decoding of mesh components. The framework employs a two-stage flow-matching approach, starting with a voxel flow for coarse shape generation and followed by a mesh flow for detailed vertex placement. Meshy T2 significantly improves generation speed and geometric fidelity, making it suitable for interactive 3D applications.'}, 'zh': {'title': '快速高质量网格生成的未来', 'desc': 'Polygonal meshes 是现代3D管道的标准表面表示，生成高质量的网格对于电影、游戏和互动3D应用至关重要。传统方法将网格序列化为令牌序列并自回归解码，这在推理时速度较慢且对错误积累敏感，导致不适合互动资产创建。我们提出了 Meshy T2，这是一个基于流匹配的快速原生网格生成框架，能够在单次传递中编码和解码网格的顶点、边连接和面缠绕顺序。Meshy T2 在生成速度、面数控制和多部件资产支持方面表现出色，能够在6秒内完成图像到网格的生成。'}}}, {'id': 'https://huggingface.co/papers/2607.29677', 'title': 'ExtractBench: A Benchmark for Schema-Guided Enterprise Document Extraction', 'url': 'https://huggingface.co/papers/2607.29677', 'abstract': 'Abstract  Enterprise workflows increasingly rely on agents for schema-guided extraction: given a document and a user-defined schema, the agent faithfully follows the schema to produce the correct output with source evidence as grounding metadata. We present ExtractBench, a benchmark for schema-guided extraction and, to our knowledge, the first to score value accuracy, record completeness at scale, grounding, and measured cost together. The evaluation system contains 4,869 pages across 370 enterprise documents, 8 business domains, and 67 document types, with clear tags differentiating their challenge scenarios. The scalable schema and ground-truth curation pipeline combines independent-system agreement for real documents, known values for synthetic lists, and human verification for forms. We report order-insensitive value F1 for value accuracy, plus two grounding metrics for source traceability: word- and page-level F1. Commercial VLMs perform well on short documents but often truncate record lists on long ones, while coding agents retain higher accuracy at much higher cost. LlamaExtract Agentic Plus ranks first on all three metrics, with accuracy comparable to coding agents at a fraction of the cost. Dataset and evaluation code are available on https://huggingface.co/datasets/llamaindex/ExtractBench{HuggingFace} and https://github.com/run-llama/ExtractBench{GitHub}.', 'score': 13, 'issue_id': 2829, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': 'ce1c94ff6556a58a', 'authors': ['Boyang Zhang', 'Adrian Lyjak', 'Eli Stewart', 'Zhaoqi Li', 'Simon Suo'], 'affiliations': ['RunLlama'], 'pdf_title_img': 'assets/pdf/title_img/2607.29677.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark', '#multimodal'], 'emoji': '📄', 'ru': {'title': 'Эффективное извлечение данных: точность агентов при минимальной стоимости', 'desc': 'В статье представлен ExtractBench — новый бенчмарк для оценки агентов, которые извлекают данные из документов по заданной схеме. Набор данных включает почти 5000 страниц корпоративных документов из разных отраслей и содержит метрики для оценки точности значений, полноты записей, качества привязки к источнику и стоимости обработки. Авторы сравнили несколько подходов: коммерческие визуально-языковые модели хорошо работают на коротких документах но теряют точность на длинных, в то время как кодирующие агенты сохраняют высокую точность за счёт больших затрат. LlamaExtract Agentic Plus достигает лучших результатов по всем метрикам с оптимальным соотношением точности и стоимости.'}, 'en': {'title': 'ExtractBench: Benchmarking Schema-Guided Extraction for Efficiency and Accuracy', 'desc': 'This paper introduces ExtractBench, a benchmark designed for evaluating schema-guided extraction in enterprise workflows. It measures various aspects such as value accuracy, record completeness, grounding, and cost efficiency across a diverse set of documents. The evaluation includes a large dataset of 4,869 pages from 370 documents, covering multiple business domains and document types. The results show that while commercial VLMs excel with short documents, LlamaExtract Agentic Plus outperforms others in accuracy and cost-effectiveness, especially on longer documents.'}, 'zh': {'title': '模式引导提取的基准测试新标准', 'desc': '本论文介绍了ExtractBench，这是一个用于模式引导提取的基准测试。它评估了价值准确性、记录完整性、基础数据和成本等多个指标。该基准包含来自370个企业文档的4,869页数据，涵盖8个业务领域和67种文档类型。研究表明，LlamaExtract Agentic Plus在所有指标上表现最佳，其准确性与编码代理相当，但成本却低得多。'}}}, {'id': 'https://huggingface.co/papers/2607.18082', 'title': 'Enhancing Rubric-based RL via Self-Distillation', 'url': 'https://huggingface.co/papers/2607.18082', 'abstract': 'Abstract  Rubric-based RL has recently shown promise in improving LLMs on open-ended tasks. A widely recognized limitation of rubric-based RL is limited exploration: criteria that no rollout manages to satisfy (Unexplored Criteria, UC) receive no optimization signal. Recent methods address this by incorporating rubric information as external guidance during rollout, yet they introduce a train-inference mismatch: the policy is optimized on rollouts produced under external guidance while this guidance is absent at inference time, causing error accumulation through autoregressive decoding. Moreover, these exploration-focused approaches overlook a fundamentally different failure mode that we term Suppressed Criteria (SC) -- criteria that are satisfied by some rollouts yet whose learning signals are lost during optimization because scalar reward aggregation assigns them non-positive aggregate advantages. Our analysis reveals that SC are remarkably prevalent: over 57% of samples exhibit this failure mode throughout training, with an average of 1.8 SC per sample. To simultaneously address both UC and SC without introducing training-inference mismatch, we propose Criterion-Distilled Policy Optimization (CriPO), which enhances rubric-based RL via on-policy self-distillation. For UC, CriPO constructs a criterion-injection self-teacher and computes a localized forward-KL loss to inject missing behaviors into the policy. For SC, CriPO employs a counterfactual self-teacher to locate criterion-relevant tokens in negative-advantage rollouts and flips their token-level advantages to positive values, preserving useful patterns that would otherwise be suppressed. Experiments on medicine and science benchmarks demonstrate that CriPO consistently outperforms rubric-based RL, achieving stronger final performance with approximately 2times fewer optimization steps.', 'score': 13, 'issue_id': 2829, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '9487b27d0e0a19d0', 'authors': ['Mingxuan Xia', 'Yuhang Yang', 'Chao Ye', 'Shuai Zhu', 'Shenzhi Yang', 'Guangcheng Zhu', 'Yuhang Zhang', 'Cheng Peng', 'Haobo Wang', 'Siqing Wang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.18082.jpg', 'data': {'categories': ['#optimization', '#training', '#rlhf', '#rl', '#reasoning', '#alignment'], 'emoji': '🎯', 'ru': {'title': 'Самодистилляция для восстановления потерянных критериев в обучении с подкреплением', 'desc': 'В этой работе предложен метод Criterion-Distilled Policy Optimization (CriPO) для улучшения обучения с подкреплением на основе рубрик при настройке больших языковых моделей. Авторы выявили две основные проблемы: неисследованные критерии (UC), которые не получают сигнал оптимизации, и подавленные критерии (SC), полезные паттерны которых теряются при агрегации скалярной награды. CriPO использует самодистилляцию в процессе обучения, внедряя недостающие поведения через локализованную KL-дивергенцию и восстанавливая полезные закономерности с помощью контрфактической учительской модели. Эксперименты показывают, что метод достигает лучшей производительности при меньшем количестве шагов оптимизации по сравнению с базовыми подходами.'}, 'en': {'title': 'Enhancing RL with Criterion-Distilled Policy Optimization', 'desc': 'This paper discusses a new method called Criterion-Distilled Policy Optimization (CriPO) to improve reinforcement learning (RL) for large language models (LLMs) on open-ended tasks. It identifies two main issues: Unexplored Criteria (UC), which are criteria that the model fails to explore, and Suppressed Criteria (SC), which are criteria that are ignored during optimization despite being satisfied. CriPO addresses these issues by using on-policy self-distillation to enhance the learning process, allowing the model to better incorporate missing behaviors and preserve useful patterns. The results show that CriPO significantly outperforms traditional rubric-based RL methods, achieving better performance with fewer optimization steps.'}, 'zh': {'title': '提升基于标准的强化学习效率的新方法', 'desc': '本论文提出了一种新的方法，称为标准蒸馏策略优化（CriPO），旨在改善基于标准的强化学习（RL）在开放任务中的表现。传统的基于标准的RL存在探索不足的问题，导致一些标准未被优化。CriPO通过在策略优化中引入自我蒸馏技术，解决了未探索标准和被抑制标准的问题，从而提高了学习效率。实验结果表明，CriPO在医学和科学基准测试中表现优于传统方法，优化步骤减少了约两倍。'}}}, {'id': 'https://huggingface.co/papers/2607.29025', 'title': 'Evaluation-Verification Reward for Consistent Multi-Reference Image Editing', 'url': 'https://huggingface.co/papers/2607.29025', 'abstract': 'Abstract  While recent image editing models have made rapid progress, multi-reference editing remains challenging, particularly in maintaining visual consistency across references and ensuring overall visual harmony. Reinforcement learning has proven highly effective for text-to-image generation and single-image editing, but its extension to multi-reference editing is hindered by the absence of suitable reward models that capture multi-image relational constraints. Moreover, naively using multimodal large language models(MLLMs) as zero-shot evaluators faces a key tension between hallucination-prone long-form reasoning and the limited deductive power of short-form judgments. We address these issues with a Multi-dimensional Evaluation-Verification Reward(EVR). EVR decomposes evaluation into distinct visual criteria; for each criterion, an MLLM Evaluator generates multiple candidate hypotheses, and a Verifier grounds each claim in concrete visual evidence to accept or reject it, producing reliable and fine-grained reward signals. Together with a scalable data pipeline, our method enables RL fine-tuning of off-the-shelf editors without architectural changes. Extensive experiments show substantial gains over the base Qwen-Image-Edit, improving consistency and harmony to match or surpass NanoBanana.', 'score': 11, 'issue_id': 2829, 'pub_date': '2026-07-31', 'pub_date_card': {'ru': '31 июля', 'en': 'July 31', 'zh': '7月31日'}, 'hash': '0277c10fc6485485', 'authors': ['Yingmao Miao', 'Pengfei Zhang', 'Xiaochen Lv', 'Meng Yu', 'Lei Sun', 'Xiangxiang Chu', 'Chao Shen', 'Chenhao Lin'], 'affiliations': ['Amap, Alibaba', 'Shanghai Jiao Tong University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.29025.jpg', 'data': {'categories': ['#multimodal', '#rl', '#training', '#cv'], 'emoji': '🎨', 'ru': {'title': 'Надёжные награды для редактирования множественных изображений через проверку визуальных доказательств', 'desc': 'В статье предложен новый метод для редактирования изображений с использованием нескольких референсов одновременно. Основная проблема заключалась в отсутствии подходящих функций награды (reward models), которые могут оценивать согласованность между несколькими изображениями. Авторы разработали Multi-dimensional Evaluation-Verification Reward (EVR), который разбивает оценку на отдельные визуальные критерии и использует мультимодальные языковые модели для проверки каждого утверждения на основе конкретных визуальных доказательств. Метод позволяет обучать существующие модели редактирования с помощью обучения с подкреплением без изменения их архитектуры, достигая значительного улучшения в согласованности и гармонии изображений.'}, 'en': {'title': 'Enhancing Multi-Reference Image Editing with EVR', 'desc': 'This paper addresses the challenges of multi-reference image editing, focusing on maintaining visual consistency and harmony across multiple images. It introduces a novel Multi-dimensional Evaluation-Verification Reward (EVR) system that breaks down evaluation into specific visual criteria, allowing for more accurate assessments. By utilizing a multimodal large language model (MLLM) as an evaluator and a verifier to ground claims in visual evidence, the method produces reliable reward signals for reinforcement learning. The proposed approach significantly enhances the performance of existing image editing models, achieving better consistency and visual quality compared to previous methods.'}, 'zh': {'title': '提升多参考图像编辑的一致性与和谐性', 'desc': '本文探讨了多参考图像编辑中的挑战，尤其是在保持视觉一致性和整体视觉和谐方面。尽管强化学习在文本到图像生成和单图像编辑中表现出色，但在多参考编辑中，由于缺乏合适的奖励模型，导致其扩展受到限制。我们提出了一种多维评估-验证奖励（EVR）方法，将评估分解为不同的视觉标准，并通过多模态大语言模型生成候选假设。实验结果表明，我们的方法在一致性和和谐性方面显著优于基线模型，能够有效提升图像编辑的质量。'}}}, {'id': 'https://huggingface.co/papers/2607.27951', 'title': 'Safeguards Based on Copyable Context Cannot Provide Reliable Safety for LLMs', 'url': 'https://huggingface.co/papers/2607.27951', 'abstract': 'Abstract  Large language model safeguards decide whether to answer before seeing how an answer will be used. This creates a basic problem for dual-use tasks: the same answer can help an authorized professional or an attacker, while an attacker can imitate a benign request and interaction history. We separate the capability released by the model from the evidence available about downstream use. When that evidence is copyable, we derive the exact worst-case floor on attacker assistance while preserving useful answers. The result yields a safety trilemma: Useful Capability, Reliable Safety, and Open Access cannot coexist. We then show how a trusted credential can complement existing safeguards by adding hard-to-copy information that predicts actual downstream use, and identify the stronger condition needed to eliminate the floor. Evidence from dual-use evaluations, adaptive attacks, and deployed trusted-access programs supports the practical relevance of these conditions.', 'score': 0, 'issue_id': 2829, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '093f0fd124e2ee50', 'authors': ['Pingyu Wu', 'Lingyao Zhu', 'Weiming Zhang', 'Nenghai Yu'], 'affiliations': ['Hefei AiDA Lab', 'University of Science and Technology of China', 'Zhejiang Wanli University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27951.jpg', 'data': {'categories': [], 'emoji': '🔐', 'ru': {'title': 'Невозможная триада: утилита, безопасность и открытость в защите языковых моделей', 'desc': 'В этой работе исследуется фундаментальная проблема защиты больших языковых моделей при выполнении задач двойного назначения, когда один и тот же ответ может быть использован как легально, так и во вредоносных целях. Авторы разделяют возможности модели от информации о том, как будет использован ответ, и доказывают математически точный минимальный уровень помощи злоумышленнику при сохранении полезности системы. Они выявляют триллемму безопасности: полезность, надежная защита и открытый доступ не могут существовать одновременно. Предложено решение в виде доверенной идентификации пользователя, которая добавляет сложно подделываемую информацию для прогнозирования реального использования ответа.'}, 'en': {'title': 'Balancing Safety and Utility in Language Models', 'desc': 'This paper discusses the challenges of using large language models in situations where their answers can be misused. It highlights a safety trilemma where useful capabilities, reliable safety, and open access cannot all be achieved simultaneously. The authors propose a solution involving trusted credentials that provide hard-to-copy information to better predict how answers will be used. They support their findings with evidence from evaluations and real-world programs that address dual-use concerns.'}, 'zh': {'title': '安全三难：能力、安全与开放的冲突', 'desc': '这篇论文讨论了大型语言模型在回答问题前如何决定是否回答，这在双重用途任务中引发了问题。相同的答案可能对授权专业人士有帮助，但也可能被攻击者利用。作者提出了一种方法，将模型的能力与下游使用的证据分开，从而在保持有用答案的同时，推导出攻击者协助的最坏情况底线。最后，论文提出了一个安全三难困境，表明有用能力、可靠安全和开放访问无法共存，并建议使用可信凭证来增强现有的安全措施。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (2)', '#agi', '#alignment (3)', '#architecture (1)', '#audio', '#benchmark (2)', '#cv (2)', '#data', '#dataset (2)', '#diffusion (1)', '#ethics (1)', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (5)', '#open_source (2)', '#optimization (2)', '#plp', '#rag', '#reasoning (3)', '#rl (4)', '#rlhf (2)', '#robotics (1)', '#science', '#security (1)', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (5)', '#transfer_learning', '#video'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-03 09:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-03 09:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-03 09:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
