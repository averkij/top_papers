n Liu', 'Hongyan Hao', 'Yueqing Sun', 'Yu Yang', 'Qi GU', 'Xunliang Cai', 'Deyi Xiong'], 'affiliations': ['Meituan Longcat Team', 'TJUNLP Lab, School of Computer Science and Technology, Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00782.jpg', 'data': {'categories': ['#training', '#rlhf'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное руководство учителя для восстановления сигналов обучения в RL', 'desc': 'В статье предложен метод RSTG для улучшения обучения больших языковых моделей с подтверждаемыми наградами, который решает проблему разреженных сигналов обратной связи в методе GRPO. Авторы комбинируют дистилляцию знаний от учительской модели с усиленным обучением, применяя её селективно только к тем образцам и токенам, где она действительно полезна. Метод использует взвешивание по уверенности учителя и фокусируется на токенах с высокой энтропией студента или большой расхождением между предсказаниями студента и учителя. Экспериментальные результаты показывают значительное улучшение производительности на задачах математики и программирования по сравнению с наивной комбинацией GRPO и дистилляции.'}, 'en': {'title': 'Enhancing Learning Signals with RSTG for Better RL Performance', 'desc': 'This paper introduces RSTG, a method that enhances reinforcement learning with verifiable rewards for large language models. It addresses the limitations of Group Relative Policy Optimization (GRPO) and on-policy distillation (OPD) by selectively applying distillation to improve learning signals. RSTG focuses on using teacher model guidance effectively, targeting only the most informative samples and tokens to maintain exploration in reinforcement learning. The proposed method shows significant performance improvements in tasks like math and code generation compared to traditional approaches.'}, 'zh': {'title': '自适应教师指导，提升强化学习效果', 'desc': '强化学习与可验证奖励（RLVR）已成为后训练大型语言模型（LLMs）的标准范式。尽管群体相对策略优化（GRPO）被广泛采用，但它在稀疏奖励信号下表现不佳，并且当组内所有响应获得相同奖励时完全失去梯度。在线策略蒸馏（OPD）通过提供来自教师模型的密集、逐标记的监督，提供了一种自然的解决方案。然而，简单地将GRPO与OPD结合会导致性能下降，因此我们提出了RSTG（通过自适应教师指导恢复学习信号），以选择性和精确的方式应用蒸馏。'}}}, {'id': 'https://huggingface.co/papers/2608.04530', 'title': 'FocusMem: Factorizing Content, Readout, and Trust in Latent GUI Memory', 'url': 'https://huggingface.co/papers/2608.04530', 'abstract': 'Abstract  GUI agents must remember both useful experience from earlier tasks and unfinished progress in the current interaction. Latent memory offers a compact solution by compressing multimodal trajectories into a few continuous tokens. Existing methods, however, usually map each trajectory to one fixed memory block and train it mainly through next-action supervision. This creates three practical problems: important details may be lost during compression, the same memory block must serve different decision stages, and irrelevant retrieved trajectories may still mislead the agent. We introduce FocusMem, which separates these responsibilities within a compact latent-memory interface. A role-aware content basis encourages episodic memory to retain reusable experience and working memory to retain task progress. A state-conditioned readout generates a decision-specific view of the same stored evidence, while a lightweight trust gate can suppress memory blocks that appear irrelevant to the current step. All components are trained while the GUI policy remains frozen. Across five GUI-agent benchmarks, FocusMem consistently outperforms a fully matched action-only fixed-memory baseline and prior latent memory adaptations. Further analysis shows that semantic and functional supervision preserve complementary information, state-conditioned readout is more robust as surrounding trajectory context grows, and the trust gate reduces the harm caused by injected irrelevant episodic evidence. These results show that effective latent memory depends not only on compressing past interaction, but also on what is retained, what is exposed, and what is allowed.', 'score': 9, 'issue_id': 2863, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'c663ef96e8cbf396', 'authors': ['Zhuoran Zhang', 'Bowen Li', 'Jingcheng Ju', 'Yang Shi', 'Qixun Wang', 'Haotian Wang', 'Wei Chen', 'Tengjiao Wang'], 'affiliations': ['Department of Computer Science and Technology, Tsinghua University', 'Institute of Information Engineering, Chinese Academy of Sciences', 'Key Lab of High Confidence Software Technologies, Peking University', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04530.jpg', 'data': {'categories': ['#benchmark', '#agents', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Умная память для интерфейсов: разделение опыта и прогресса', 'desc': 'Статья предлагает FocusMem — новый подход к управлению латентной памятью для агентов, взаимодействующих с графическими интерфейсами. В отличие от существующих методов, которые сжимают всю историю действий в один блок памяти, FocusMem разделяет ответственность между памятью эпизодов (для сохранения переиспользуемого опыта) и рабочей памятью (для отслеживания текущего прогресса). Система использует специальные механизмы: состояние-зависимый считыватель для извлечения релевантной информации и доверительный вентиль для фильтрации нерелевантных блоков памяти. Все компоненты обучаются при неизменной основной политике, показывая устойчивое улучшение на пяти бенчмарках для GUI-агентов.'}, 'en': {'title': 'FocusMem: Smart Memory for Better GUI Agent Performance', 'desc': 'This paper presents FocusMem, a novel approach to latent memory for GUI agents that enhances their ability to remember useful experiences and ongoing tasks. Unlike traditional methods that use a single memory block for all tasks, FocusMem separates memory into different roles, allowing for better retention of relevant information and task progress. It employs a state-conditioned readout to tailor memory retrieval to specific decisions and a trust gate to filter out irrelevant memories. The results demonstrate that FocusMem significantly improves performance on various benchmarks by optimizing how memories are stored, accessed, and utilized.'}, 'zh': {'title': 'FocusMem：提升GUI代理的潜在记忆能力', 'desc': '本论文提出了一种名为FocusMem的潜在记忆方法，旨在帮助图形用户界面（GUI）代理记住有用的经验和当前任务的进展。FocusMem通过将多模态轨迹压缩为少量连续的记忆块，解决了现有方法中存在的压缩信息丢失、记忆块多重使用和无关轨迹干扰的问题。该方法引入了角色感知的内容基础，鼓励情节记忆保留可重用的经验，同时工作记忆保留任务进展。通过状态条件的读取和轻量级的信任门，FocusMem能够有效地管理记忆的使用，确保代理在决策时使用相关的信息。'}}}, {'id': 'https://huggingface.co/papers/2608.04505', 'title': 'K-EXAONE 2.0 Technical Report', 'url': 'https://huggingface.co/papers/2608.04505', 'abstract': 'Abstract  This technical report presents K-EXAONE 2.0, an open-weight multilingual foundation model developed by LG AI Research as a step in our effort toward global frontier-scale foundation models. Rather than training from scratch, we upcycle K-EXAONE and expand its architecture, yielding a Mixture-of-Experts (MoE) model with 750B total parameters and approximately 37B activated per token---more than three times the capacity of its predecessor. K-EXAONE 2.0 supports context lengths of up to 256K tokens and expands multilingual coverage from six to ten languages. Its training pipeline combines continual pre-training, difficulty-focused mid-training, and post-training to strengthen reasoning, agentic coding, multilingual capability, and safety grounded in Korean sociocultural contexts. Across nine evaluation categories selected to reflect the conditions of practical use, K-EXAONE 2.0 improves over K-EXAONE and remains competitive with open-weight models, showing its largest gains in agentic coding and long-context understanding and its clearest strengths in long-context retrieval and safety. Released under the Apache 2.0 license, K-EXAONE 2.0 enables the wider AI ecosystem to evaluate, deploy, adapt, and build upon it, while marking the beginning---rather than the endpoint---of our challenge toward the global frontier.', 'score': 9, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '312ecd6603ea07fe', 'authors': ['Eunbi Choi', 'Kibong Choi', 'Sehyun Chun', 'Seokhee Hong', 'Junwon Hwang', 'Hyojin Jeon', 'Ahra Jo', 'Hyunjik Jo', 'Yeonsik Jo', 'Minhyeok Jung', 'Doyoung Kim', 'Heegyu Kim', 'Joonkee Kim', 'Seonghwan Kim', 'Soyeon Kim', 'Sunkyoung Kim', 'Yireun Kim', 'Yongil Kim', 'Byungoh Ko', 'Changhun Lee', 'Dohaeng Lee', 'Haeju Lee', 'Jinsik Lee', 'Kyungmin Lee', 'Minwoo Lee', 'Wonkee Lee', 'Sangha Park', 'Sungjune Park', 'Kwangrok Ryoo', 'Kijung Seo', 'Minju Seo', 'Yongwoo Song', 'Sejong Yang', 'Heuiyeen Yeen', 'Stanley Jungkyu Choi', 'Yemuk Choi', 'Yongchan Chun', 'Jiwon Ham', 'Dasol Hong', 'Sujeong Im', 'Kijeong Jeon', 'Gerrard Jeongwon Jo', 'Hyeongjun Jo', 'Yujin Jo', 'Jiyeon Jung', 'Naeun Kang', 'Daeseong Kim', 'Euisoon Kim', 'Hayeon Kim', 'Hyosang Kim', 'Myoungshin Kim', 'Unsol Kim', 'Youchul Kim', 'Chaeeun Lee', 'ChaeYoon Lee', 'Edward Hwayoung Lee', 'Honglak Lee', 'Hwansoo Lee', 'Minkyung Lee', 'Sangeun Lee', 'Solji Lim', 'Woohyung Lim', 'Chanwoo Moon', 'Jueun Mun', 'Jimin Park', 'Seojeong Park', 'Yongmin Park', 'Hyerin Seo', 'Donghyeon Shin', 'Donghyun Son', 'Eunyong Son', 'Kaehyun Um', 'Sihoon Yang', 'Chang En Yea', 'Sihyuk Yi', 'Kyungjae Yoo', 'Chansik Yoon'], 'affiliations': ['LG AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.04505.jpg', 'data': {'categories': ['#training', '#reasoning', '#open_source', '#plp', '#long_context', '#low_resource', '#agents', '#alignment', '#multilingual', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Масштабный апгрейд: MoE модель K-EXAONE 2.0 для глобального фронтира', 'desc': 'K-EXAONE 2.0 — это многоязычная foundational модель с архитектурой Mixture-of-Experts, содержащая 750 млрд параметров, из которых активируется примерно 37 млрд на каждый токен. Модель была получена путём апгрейда предыдущей версии K-EXAONE с расширением архитектуры и поддержкой контекста длиной до 256K токенов. Обучение включало continual pre-training, середину обучения с фокусом на сложность и post-training этапы для улучшения рассуждений, кодирования, многоязычных способностей и безопасности в корейском культурном контексте. Модель показывает значительные улучшения в задачах длинного контекста, агентного кодирования и остаётся конкурентоспособной среди открытых моделей.'}, 'en': {'title': 'Empowering Multilingual AI with K-EXAONE 2.0', 'desc': 'K-EXAONE 2.0 is a multilingual foundation model developed by LG AI Research, designed to enhance global AI capabilities. It utilizes a Mixture-of-Experts (MoE) architecture with 750 billion parameters, significantly increasing its processing power compared to its predecessor. The model supports longer context lengths and has expanded its language coverage, improving its performance in reasoning and coding tasks. By employing a comprehensive training pipeline, K-EXAONE 2.0 demonstrates notable advancements in safety and long-context understanding, making it a valuable resource for the AI community.'}, 'zh': {'title': 'K-EXAONE 2.0：全球前沿的多语言基础模型', 'desc': 'K-EXAONE 2.0是LG AI研究所开发的多语言基础模型，旨在推动全球前沿基础模型的发展。该模型采用Mixture-of-Experts（MoE）架构，拥有7500亿个参数，并且每个token激活约370亿个参数，性能大幅提升。K-EXAONE 2.0支持最长256K的上下文长度，并将多语言覆盖范围从六种扩展到十种。通过持续预训练、针对难度的中期训练和后期训练，该模型在推理、编码能力、多语言能力和安全性方面表现出色，特别是在长上下文检索和安全性方面具有明显优势。'}}}, {'id': 'https://huggingface.co/papers/2608.04964', 'title': 'WorldCycle: Self-Verifiable Reinforcement Learning for Long-Horizon Video World Models', 'url': 'https://huggingface.co/papers/2608.04964', 'abstract': 'Abstract  Interactive video world models are essential for long-horizon planning and exploration, yet they suffer from compounding errors. Post-training methods such as reinforcement learning (RL) can improve these models, but they hit a verification bottleneck: for arbitrary action sequences, no ground-truth future state exists to measure long-term drift. Our key insight is that reversible action cycles make this verification possible: a sequence composed with its inverse must analytically return to the initial state, yielding annotation-free supervision on long-horizon correctness. Building on this, we introduce WorldCycle, a self-verifiable RL framework that constructs closed action cycles and their repeated executions from ordinary action sequences, and optimizes two complementary rewards: a spatial closure reward enforcing symmetry between mirrored forward and reverse segments, and a temporal consistency reward aligning states across repeated cycle executions. These rewards force the model to learn actions as consistent state operators rather than memorized temporal patterns, and extend naturally to out-of-distribution composite action cycles that the base model handles poorly. We further release CycleBench, a diagnostic benchmark for state-returning ability under complex action structures. WorldCycle reduces state returning drift by up to 44% and lifts composite-action accuracy nearly 4x over the base model, providing a vital foundation for physically grounded world models.', 'score': 8, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '753acbda2ccb9f57', 'authors': ['Bohai Gu', 'Yueyang Yuan', 'Taiyi Wu', 'Dazhao Du', 'Jian Liu', 'Xiaoyi Pang', 'Jie Zhang', 'Xiaocheng Lu', 'Haobin Zhong', 'Xiaotong Zhao', 'Alan Zhao', 'Song Guo'], 'affiliations': ['AI Technology Center, Tencent Video, Tencent', 'The Hong Kong University of Science and Technology', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04964.jpg', 'data': {'categories': ['#benchmark', '#rl', '#dataset', '#video'], 'emoji': '🔄', 'ru': {'title': 'Циклические действия как метод самопроверки для мировых моделей', 'desc': 'В статье представляется WorldCycle — фреймворк для улучшения интерактивных видео-моделей мира через самопроверку, решающий проблему накопления ошибок при долгосрочном планировании. Ключевая идея заключается в использовании обратимых циклов действий: если выполнить действие, а затем обратное ему действие, модель должна аналитически вернуться в исходное состояние, что обеспечивает автоматическую аннотацию для обучения с подкреплением. Фреймворк оптимизирует два дополнительных сигнала вознаграждения: пространственное замыкание, обеспечивающее симметрию между прямыми и обратными сегментами, и временную консистентность, выравнивающую состояния при повторных циклах. Экспериментальные результаты показывают снижение дрейфа состояний на 44% и повышение точности на составных действиях в 4 раза, предоставляя надежный фундамент для физически обоснованных моделей мира.'}, 'en': {'title': 'Revolutionizing Long-Term Planning with Self-Verifiable Action Cycles', 'desc': 'This paper presents WorldCycle, a novel reinforcement learning framework designed to enhance interactive video world models for long-term planning. The key innovation is the use of reversible action cycles, which allow the model to verify its predictions by ensuring that executing an action and its inverse returns to the original state. By optimizing for spatial closure and temporal consistency, WorldCycle encourages the model to treat actions as reliable state operators rather than just memorized sequences. The framework significantly reduces state drift and improves accuracy in complex action scenarios, making it a crucial advancement for developing robust world models.'}, 'zh': {'title': '自验证的强化学习：提升长时间规划的准确性', 'desc': '本论文提出了一种名为WorldCycle的自验证强化学习框架，旨在解决交互视频世界模型在长时间规划和探索中出现的累积误差问题。通过利用可逆动作循环，WorldCycle能够在没有真实未来状态的情况下进行验证，从而提高模型的长期准确性。该框架优化了两个互补的奖励：空间闭合奖励和时间一致性奖励，促使模型学习一致的状态操作而非简单的时间模式。实验结果表明，WorldCycle显著减少了状态返回漂移，并在复合动作的准确性上大幅提升，为物理基础的世界模型奠定了重要基础。'}}}, {'id': 'https://huggingface.co/papers/2608.05131', 'title': 'OPD-V: Visual On-Policy Self-Distillation with Modality Balance', 'url': 'https://huggingface.co/papers/2608.05131', 'abstract': 'Abstract  On-Policy Self-Distillation (OPSD) has become a standard post-training approach for improving visual reasoning in multimodal large language models (MLLMs). Existing methods draw privileged information from diverse input sources to guide self-distillation. Yet these designs overlook Modality Imbalance, a challenge inherent to MLLM reasoning. When textual information dominates generation, the model cannot fully integrate its multimodal input. Consequently, carefully designed privileged information remains underused, limiting the effectiveness of OPSD. To examine this limitation, we construct a Positive Teacher with the Zoom-In Image and a Negative Teacher with the Mask Image, which exhibit different degrees of Modality Imbalance. Changes in their reasoning correctness and token logits reveal that Modality Balance can itself serve as privileged information. Motivated by this finding, we introduce OPD-V, a visual OPSD paradigm that instantiates such information through the Positive Teacher and Negative Teacher. Positive Modality-Balance Logits Margins define a Modality-Balance Trust Region that selects the on-policy tokens used for self-distillation. Experiments across 6 benchmarks, 4 MLLM backbones, and 5 post-training methods show that OPD-V consistently improves reasoning performance while reducing training cost.', 'score': 8, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'c5f55d7979270e3e', 'authors': ['Aniri', 'Jinhe Bi', 'Peng Liao', 'Zengjie Jin', 'Volker Tresp', 'Fei Shen', 'Yunpu Ma', 'Tat-Seng Chua'], 'affiliations': ['Ludwig Maximilian University of Munich', 'Munich Center for Machine Learning', 'National University of Singapore', 'Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05131.jpg', 'data': {'categories': ['#training', '#multimodal', '#reasoning', '#optimization', '#rlhf'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка модальностей как привилегированная информация для самодистилляции', 'desc': 'В статье рассматривается проблема дисбаланса модальностей при самодистилляции мультимодальных больших языковых моделей. Авторы показывают, что когда текстовая информация доминирует при генерации, модель не может полностью использовать визуальные входные данные, что снижает эффективность обучения. Они предлагают метод OPD-V, который использует позитивного и негативного учителя с различными визуальными модификациями для балансирования модальностей. Экспериментальные результаты на шести бенчмарках подтверждают, что предложенный подход улучшает качество логического рассуждения при одновременном снижении вычислительных затрат.'}, 'en': {'title': 'Balancing Modalities for Better Reasoning in MLLMs', 'desc': 'This paper introduces On-Policy Self-Distillation (OPSD) as a method to enhance visual reasoning in multimodal large language models (MLLMs). It identifies the issue of Modality Imbalance, where the model struggles to integrate information from different sources when one type dominates. The authors propose a new approach, OPD-V, which uses Positive and Negative Teachers to balance modalities and improve reasoning accuracy. Their experiments demonstrate that this method not only boosts performance across various benchmarks but also reduces training costs.'}, 'zh': {'title': '提升多模态推理的自我蒸馏新方法', 'desc': '本文提出了一种新的视觉自我蒸馏方法，称为OPD-V，旨在改善多模态大语言模型（MLLMs）的视觉推理能力。现有的方法在自我蒸馏过程中利用了来自不同输入源的特权信息，但忽视了模态不平衡的问题，这导致模型无法充分整合多模态输入。通过构建正负教师模型，研究发现模态平衡本身可以作为特权信息，从而提高推理的准确性。实验结果表明，OPD-V在多个基准测试中表现出色，同时降低了训练成本。'}}}, {'id': 'https://huggingface.co/papers/2608.05042', 'title': 'BridgeVLA++: A Data-Efficient, Generalizable, and Memory-Augmented Vision-Language-Action Framework for 3D Manipulation', 'url': 'https://huggingface.co/papers/2608.05042', 'abstract': "Abstract  Leveraging pre-trained vision-language models (VLMs) to construct vision-language-action (VLA) models has emerged as a promising paradigm for 3D robot manipulation. However, existing 3D VLA methods remain data-hungry, exhibit limited generalization under distribution shifts, and lack explicit memory of past observations. These limitations hinder their application to data-scarce, open-world, and memory-dependent manipulation scenarios. Our previous work, BridgeVLA, improves data efficiency and generalization by preserving the input--output alignment of a pre-trained VLM during 3D action learning: raw point clouds are projected into multi-view images, and intermediate heatmaps are predicted before generating robot actions. In this work, we develop BridgeVLA++ by equipping BridgeVLA with a unified spatio-temporal memory architecture that models persistent spatial context and temporal interaction history. The resulting memory-augmented framework can reason over observation histories while preserving BridgeVLA's data efficiency and generalization capabilities. Extensive experiments show that our framework achieves strong performance on spatial manipulation tasks while exhibiting robust generalization. BridgeVLA++ further achieves state-of-the-art performance on two challenging memory-dependent manipulation benchmarks without sacrificing the data efficiency and generalization of the original BridgeVLA. In addition, BridgeVLA++ performs effectively in bimanual manipulation settings and is validated on an additional real-world robotic platform, demonstrating its scalability across tasks, environments, and robotic platforms. These results establish BridgeVLA++ as a unified 3D vision-language-action framework that simultaneously supports data-efficient learning, robust generalization, and effective memory-aware robot manipulation. Project website: https://bridgevla-plus.github.io/.", 'score': 7, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '8159bacb10bcdc20', 'authors': ['Peiyan Li', 'Yuze Zhu', 'Yixiang Chen', 'Qisen Ma', 'Yuan Xu', 'Jiabing Yang', 'He Guan', 'Yan Huang', 'Hongtao Wu', 'Xiao Ma', 'Tao Kong', 'Liang Wang', 'Tieniu Tan'], 'affiliations': ['ByteDance Seed', 'FiveAges', 'New Laboratory of Pattern Recognition (NLPR), Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.05042.jpg', 'data': {'categories': ['#3d', '#robotics', '#training', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Память робота: от снимков к действиям с полным пониманием контекста', 'desc': 'В работе представлена система BridgeVLA++, которая объединяет предобученные визуально-языковые модели с пространственно-временной архитектурой памяти для управления роботом при манипуляции объектами в 3D-сценах. Ключевое улучшение заключается в добавлении единой памяти, которая позволяет модели анализировать историю наблюдений и взаимодействий во времени, сохраняя при этом эффективность обучения с ограниченными данными. Система демонстрирует отличную обобщаемость при распределительных сдвигах и достигает государственного уровня результатов на задачах, требующих памяти о предыдущих действиях. BridgeVLA++ успешно применяется к двурукой манипуляции и различным робототехническим платформам, что подтверждает её универсальность и масштабируемость.'}, 'en': {'title': 'Enhancing Robot Manipulation with Memory-Driven Vision-Language Models', 'desc': "This paper presents BridgeVLA++, an advanced framework for 3D robot manipulation that builds on the previous BridgeVLA model. It addresses key challenges in existing vision-language-action (VLA) methods, such as data inefficiency and poor generalization in changing environments. By incorporating a unified spatio-temporal memory architecture, BridgeVLA++ enhances the model's ability to remember past observations and reason about spatial and temporal contexts. The framework demonstrates strong performance in various manipulation tasks, achieving state-of-the-art results while maintaining data efficiency and generalization capabilities."}, 'zh': {'title': 'BridgeVLA++：高效记忆驱动的3D机器人操作框架', 'desc': '本论文提出了一种新的3D视觉-语言-动作（VLA）模型BridgeVLA++，旨在解决现有模型在数据稀缺和记忆依赖场景中的局限性。通过引入统一的时空记忆架构，BridgeVLA++能够有效地建模空间上下文和时间交互历史，从而增强模型的推理能力。实验结果表明，该框架在空间操作任务中表现出色，并在两个具有挑战性的记忆依赖操作基准上达到了最先进的性能。BridgeVLA++不仅在双手操作设置中表现良好，还在真实世界的机器人平台上得到了验证，展示了其在不同任务和环境中的可扩展性。'}}}, {'id': 'https://huggingface.co/papers/2608.04349', 'title': 'Poly-OPD: Heterogeneous Multi-Teacher On-Policy Distillation for Capability-Selectable Flow Models', 'url': 'https://huggingface.co/papers/2608.04349', 'abstract': "Abstract  Leading open text-to-image models often carry complementary strengths: one may lead on preference-aligned aesthetics while another follows compositional instructions more faithfully. However, differences in their autoencoders and noise schedules make it difficult to transfer these strengths across models. In this paper, we present Poly-OPD, a framework that can consolidate complementary strengths of heterogeneous teachers into a single compact flow-matching student. To bridge the incompatible latent spaces of different teachers, Poly-OPD performs on-policy distillation through a pixel bridge. Each student-generated image is re-encoded by a selected teacher's encoder and refined from a noise level matched by magnitude under the teacher's noise schedule. The resulting target is further matched to the student in frozen DINOv2 space, enabling supervision across incompatible latent spaces. To retain complementary capabilities without cross-teacher interference, Poly-OPD uses a gradient compatibility diagnostic to organize its adapters: attention LoRA modules are shared across teachers, whereas feed-forward adapters remain teacher-specific. During distillation, a gap-aware curriculum devotes more training to compositional categories where the student still falls short of the teacher. As each gap narrows, training shifts toward categories with larger remaining gaps. By distilling FLUX.1-dev and Z-Image into a 2.5B SD3.5-Medium student, Poly-OPD improves GenEval from 67.3 to 73.3, surpassing both larger teachers, and raises DrawBench HPSv3 from 9.34 to 11.35, consolidating both strengths within a switchable model.", 'score': 7, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '5be5d1770831b866', 'authors': ['Siming Fu', 'Haojun Xu', 'Ruizhe He', 'Zheming Fu', 'Hualiang Wang', 'Jie Huang', 'Xiaoxiao Ma', 'Mingchen Zhong', 'Weihu Huang', 'Xiaoxuan He', 'Linjiang Huang', 'Si Liu'], 'affiliations': ['Beihang University', 'Joy Future Academy', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04349.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#transfer_learning', '#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Объединение сильных сторон разных моделей генерации в одну компактную нейросеть', 'desc': 'В статье представлена Poly-OPD — фреймворк для дистилляции дополняющих сильных сторон нескольких моделей генерации текста в изображение в один компактный студент. Чтобы преодолеть несовместимость автокодировщиков и расписаний шума разных учителей, метод использует on-policy дистилляцию через пиксельный мост, переносящий сгенерированные образы в латентные пространства разных учителей. Модель применяет диагностику совместимости градиентов для организации адаптеров, разделяя attention LoRA модули между учителями и сохраняя feed-forward адаптеры специфичными для каждого. Во время обучения используется curriculum learning, ориентированный на зазоры в производительности, постепенно сбалансировав все компетенции студента.'}, 'en': {'title': 'Unifying Strengths of Diverse Models with Poly-OPD', 'desc': 'This paper introduces Poly-OPD, a novel framework designed to merge the strengths of different text-to-image models, which often excel in different areas such as aesthetics and compositional accuracy. It addresses the challenge of transferring knowledge between models with incompatible latent spaces by using on-policy distillation and a pixel bridge to align outputs. The framework employs a gradient compatibility diagnostic to manage adapters, allowing shared attention modules while keeping feed-forward adapters specific to each teacher model. By implementing a gap-aware curriculum, Poly-OPD effectively narrows performance gaps during training, resulting in a single student model that outperforms its larger teacher models in various evaluation metrics.'}, 'zh': {'title': '整合互补优势的文本到图像模型', 'desc': '本文提出了一种名为Poly-OPD的框架，旨在将不同文本到图像模型的互补优势整合到一个紧凑的流匹配学生模型中。通过像素桥，Poly-OPD在不同教师的潜在空间之间进行在线蒸馏，确保生成的图像能够与选定教师的编码器相匹配。该框架使用梯度兼容性诊断来组织适配器，以避免教师之间的干扰，同时在蒸馏过程中关注学生与教师之间的差距。最终，Poly-OPD在性能评估中超越了更大的教师模型，成功整合了两者的优势。'}}}, {'id': 'https://huggingface.co/papers/2607.28048', 'title': 'SKILL-KD: Contrastive Skill Distillation for LLM Agents', 'url': 'https://huggingface.co/papers/2607.28048', 'abstract': 'Abstract  Skill-based prompting has become a practical mechanism for improving large language model (LLM) agents, yet existing skill acquisition methods often treat skills as experience summaries, memory entries, or direct summaries of successful demonstrations. This creates a mismatch for weaker student agents: when a student fails because it lacks task knowledge or operational strategy, its failed trajectory may not contain enough evidence to infer the missing behavior, while the teacher trajectory may be too implicit to be internalized as reusable guidance. We propose SKILL-KD, a contrastive skill distillation framework that treats skills as an explicit distillation medium between agents of different capabilities. Given a student failure and the teacher trajectory on the same task, SKILL-KD distills their actionable discrepancy into a textual skill patch, evaluates the patch by re-running the student, and iteratively refines the patch when the student still fails. To prevent repeated local updates from causing skill drift, SKILL-KD further maintains trace-linked edit histories and performs Drift-Aware Skill Consolidation, deciding whether each patch should add a new rule, delete or modify an existing rule, or be skipped. Across five agent benchmarks and two student settings, SKILL-KD consistently improves frozen student agents over fixed-model adaptation baselines.', 'score': 7, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '92bbf72d7e9f6568', 'authors': ['Qiming Shi', 'Yibo Dou', 'Jiawen Zhu', 'Yulong Tao', 'Linbo Jin', 'Zhaolu Kang', 'Yunfan Zhou', 'Di Weng'], 'affiliations': ['Alibaba Group', 'School of Software Technology, Zhejiang University', 'School of Software and Microelectronics, Peking University', 'State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28048.jpg', 'data': {'categories': ['#training', '#benchmark', '#agents'], 'emoji': '🎓', 'ru': {'title': 'Передача навыков между LLM-агентами через контрастную дистилляцию ошибок', 'desc': 'В статье предлагается SKILL-KD — фреймворк контрастной дистилляции навыков для обучения слабых агентов на основе траекторий опытных учителей. Авторы рассматривают навыки как явный механизм передачи знаний между агентами с разными способностями, извлекая из ошибок ученика и успехов учителя текстовые патчи навыков. Система итеративно улучшает патчи через повторное выполнение и использует историю отредактированных правил для предотвращения дрейфа навыков. Экспериментальные результаты на пяти бенчмарках показывают, что SKILL-KD последовательно превосходит методы адаптации моделей при обучении замороженных агентов.'}, 'en': {'title': 'Enhancing Learning with Contrastive Skill Distillation', 'desc': "The paper introduces SKILL-KD, a novel framework for skill distillation in large language model (LLM) agents. Unlike traditional methods that summarize skills, SKILL-KD focuses on the actionable discrepancies between a teacher agent and a student agent when the student fails. It generates textual skill patches that guide the student by refining its operational strategies based on the teacher's successful trajectory. Additionally, SKILL-KD incorporates Drift-Aware Skill Consolidation to manage updates and prevent skill drift, ensuring that the learning process remains effective across various benchmarks."}, 'zh': {'title': '技能蒸馏：提升代理学习的有效方法', 'desc': '本论文提出了一种名为SKILL-KD的对比技能蒸馏框架，旨在改善大型语言模型（LLM）代理的技能获取。该方法将技能视为不同能力代理之间的明确蒸馏媒介，通过分析学生代理的失败轨迹和教师代理的成功轨迹，提取出可操作的技能补丁。SKILL-KD通过反复评估和优化这些补丁，帮助学生代理逐步掌握缺失的任务知识和操作策略。此外，为了防止技能漂移，SKILL-KD维护了编辑历史，并进行漂移感知的技能整合。'}}}, {'id': 'https://huggingface.co/papers/2608.02162', 'title': 'Lossless Tensor Compression as Program Synthesis', 'url': 'https://huggingface.co/papers/2608.02162', 'abstract': 'Abstract  Model checkpoints are growing in both number and size, which makes archival, transfer, and deployment increasingly costly. General-purpose compressors can reduce storage requirements but ignore tensor structure, whereas existing tensor-specific compressors rely on fixed and format-specific pipelines. We present Brevis, which formulates lossless tensor compression as program synthesis. We design a typed domain-specific language (DSL) that captures recurring tensor structures, such as repeated regions and floating-point fields, through a set of reversible operators. Given a tensor, Brevis synthesizes a self-contained DSL program that reconstructs it bit-exactly. A checkpoint-specific production prior, learned from a small representative sample of tensors, guides a bounded A* search to synthesize compact programs, which can later be executed directly for bit-exact decompression. On 10 public checkpoints spanning language, audio, and image generation models, Brevis reduces 2.13 TB of checkpoint data to 1.41 TB, a 33.93% storage reduction. It produces archives up to 30.87% smaller than those of four general-purpose compressors, including zstd and gzip, and smaller archives than the tensor-specific compressors ZipNN and DFloat11. Under a practical concurrency configuration, Brevis achieves 3.60 GB/s compression and 6.61 GB/s decompression while preserving every source byte.', 'score': 7, 'issue_id': 2865, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '7e8f592a3d2f6320', 'authors': ['Jieke Shi', 'Junda He', 'Wenjia Jiang', 'Weifeng Sun', 'Shidong Pan', 'Zhensu Sun', 'Chengran Yang', 'Peixin Zhang', 'Yifan Jia', 'Zhou Yang', 'Thong Hoang', 'Xiwei Xu', 'Zhenchang Xing', 'David Lo'], 'affiliations': ['AIDX TECH PTE LTD', 'CSIRO', 'Singapore Management University', 'University of Alberta & Alberta Machine Intelligence Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.02162.jpg', 'data': {'categories': ['#inference', '#training'], 'emoji': '📦', 'ru': {'title': 'Синтез программ для побитового сжатия нейросетевых моделей', 'desc': 'В работе представлен Brevis — система для сжатия тензоров, которая формулирует задачу как синтез программ на специализированном языке программирования (DSL). Система разработана типизированный язык, который описывает повторяющиеся структуры в тензорах и особенности представления чисел с плавающей точкой через обратимые операторы. Для каждого тензора Brevis синтезирует компактную DSL-программу, которая позволяет восстановить его побитово точно, используя поиск A* с приоритетом, обученным на репрезентативной выборке. На практике система достигает 33.93% сокращения размера данных контрольных точек моделей и превосходит по эффективности как универсальные компрессоры (zstd, gzip), так и специализированные методы сжатия тензоров.'}, 'en': {'title': 'Brevis: Smart Compression for Tensors', 'desc': 'The paper introduces Brevis, a novel approach to lossless tensor compression that utilizes program synthesis. Unlike traditional compressors that overlook tensor structures or rely on fixed pipelines, Brevis employs a domain-specific language (DSL) to represent tensor patterns through reversible operations. By synthesizing a compact program tailored to specific tensor data, Brevis achieves significant storage savings while ensuring exact reconstruction. The method demonstrates impressive performance, reducing checkpoint sizes by over 33% compared to existing compressors, while maintaining high speeds for both compression and decompression.'}, 'zh': {'title': 'Brevis：高效的无损张量压缩方案', 'desc': '本文提出了一种名为Brevis的无损张量压缩方法，通过程序合成来实现。我们设计了一种类型化的领域特定语言（DSL），能够捕捉重复区域和浮点字段等常见张量结构。Brevis根据小样本张量学习的特定生产先验，指导有界A*搜索以合成紧凑的程序，从而实现高效的压缩和解压缩。实验结果表明，Brevis在多个模型的检查点上实现了33.93%的存储减少，并且在压缩和解压缩速度上表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.04701', 'title': 'UniWorld-View: Large-Baseline View Synthesis via Video Diffusion Models', 'url': 'https://huggingface.co/papers/2608.04701', 'abstract': 'Abstract  The abundance of casually captured monocular videos and images on social media provides a valuable source for immersive content creation, where generating novel views from such sparse observations can greatly enhance user experiences. However, producing photorealistic and geometrically consistent views with precise camera control remains challenging when input coverage is extremely limited. Reconstruction-based approaches such as NeRF and 3D Gaussian Splatting (3DGS) deteriorate severely under sparse inputs and fail to explicitly handle occlusions. Generative methods ease data requirements but still struggle with large-baseline view synthesis due to inaccurate or implicit geometric guidance. To overcome these limitations, we introduce UniWorld-View, a unified framework for controllable large-baseline novel view synthesis from monocular inputs. UniWorld-View integrates explicit 3D guidance with generative diffusion modeling to enable precise camera control and geometrically consistent view generation. The geometric guidance is obtained through an occlusion-aware point cloud rendering strategy that resolves visibility ambiguities and provides accurate priors for diffusion-based synthesis. By coupling this rendering strategy with powerful video diffusion backbones, UniWorld-View achieves high-fidelity novel view generation even under extreme camera motions and wide-baseline changes, and can further provide multi-view videos for downstream dynamic 3DGS reconstruction. Experiments on the WorldScore benchmark and zero-shot NVS benchmarks demonstrate the effectiveness of UniWorld-View in controllability, geometric consistency, and visual fidelity.', 'score': 6, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '6c87feeaa389fc1d', 'authors': ['Haiyang Zhou', 'Wangbo Yu', 'Chaoran Feng', 'Xunyu Zhou', 'Yonghong Tian', 'Li Yuan'], 'affiliations': ['Peking University', 'Rabbitpre AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.04701.jpg', 'data': {'categories': ['#3d', '#multimodal', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Управляемый синтез новых видов из одного кадра через геометрию и диффузию', 'desc': 'В статье представлена UniWorld-View — объединённая система для синтеза новых видов (novel view synthesis) из монокулярного видео с точным управлением камерой. Авторы комбинируют явную трёхмерную геометрическую информацию с генеративными диффузионными моделями, используя стратегию окклюзионно-осведомлённого рендеринга облака точек для разрешения видимостей и получения точных приоров. Метод эффективно работает даже при экстремальных движениях камеры и больших базовых расстояниях между видами, превосходя как реконструкционные подходы (NeRF, 3DGS), так и чисто генеративные методы. Система может генерировать многовидовые видеопоследовательности для последующей реконструкции динамических сцен через 3D Gaussian Splatting.'}, 'en': {'title': 'UniWorld-View: Mastering Novel View Synthesis with Monocular Inputs', 'desc': 'This paper presents UniWorld-View, a novel framework designed for generating new views from limited monocular video inputs. It combines explicit 3D geometric guidance with generative diffusion models to improve camera control and ensure consistent visual quality. The framework addresses challenges like occlusions and visibility issues through an innovative point cloud rendering strategy. Experiments show that UniWorld-View excels in producing high-fidelity images even with significant camera movement, making it a valuable tool for immersive content creation.'}, 'zh': {'title': 'UniWorld-View：从单目输入生成新视图的统一框架', 'desc': '本论文介绍了一种名为UniWorld-View的统一框架，用于从单目输入生成可控的大基线新视图。该方法结合了显式的三维指导和生成扩散建模，能够实现精确的相机控制和几何一致的视图生成。通过一种考虑遮挡的点云渲染策略，UniWorld-View解决了可见性模糊的问题，并为基于扩散的合成提供了准确的先验信息。实验结果表明，UniWorld-View在可控性、几何一致性和视觉保真度方面表现出色，能够在极端相机运动和宽基线变化下生成高保真的新视图。'}}}, {'id': 'https://huggingface.co/papers/2608.05108', 'title': 'Agent Against Agent: An Agentic System for Automatic Prompt Injection Red Teaming', 'url': 'https://huggingface.co/papers/2608.05108', 'abstract': 'Abstract  Prompt injection poses significant security risks to LLM agents. Efficient and effective red-teaming is therefore critical, both for evaluating these risks and for collecting training data to improve defenses. Existing state-of-the-art prompt injection red-teaming methods primarily rely on reinforcement learning (RL), producing attacker models that often generalize poorly to new target LLMs. In this work, we develop PIMiner, an agentic system for prompt injection red-teaming. During training, PIMiner is trained on a sequence of (dataset, target model) pairs and builds a strategy library from scratch. At test time, the learned strategy library can be directly transferred to a previously unseen target LLM without additional training. PIMiner requires only a small number of queries to a target agent (e.g., 10) per test sample. Experimental results demonstrate that PIMiner achieves strong performance. On IPIArena, it attains a 76.2% ASR against Gemini-2.5-Pro, 61.9% ASR against GPT-5.1, and 42.9% ASR against Claude-Sonnet-4.5. On AgentDojo, it achieves an 86.7% ASR against Gemini-2.5-Pro, 53.3% ASR against GPT-5.1, and 40.0% ASR against Claude-Sonnet-4.5.', 'score': 5, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'b1e69abc710dea2f', 'authors': ['Yanting Wang', 'Chenlong Yin', 'Runpeng Geng', 'Jinyuan Jia'], 'affiliations': ['The Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05108.jpg', 'data': {'categories': ['#benchmark', '#rl', '#agents'], 'emoji': '🎯', 'ru': {'title': 'Универсальные стратегии атак на LLM через передачу знаний без переобучения', 'desc': 'Исследование посвящено проблеме инъекций подсказок в LLM агентов, которые представляют серьёзную угрозу безопасности. Авторы разработали PIMiner — агентную систему для красного тестирования, которая строит библиотеку стратегий атак во время обучения на последовательности пар (датасет, целевая модель). Ключевое преимущество подхода заключается в том, что обученная библиотека стратегий может быть напрямую перенесена на новые, ранее не встречавшиеся LLM без переобучения. Экспериментальные результаты показывают высокую эффективность метода с процентом успешных атак от 40% до 86.7% против различных моделей на двух бенчмарках.'}, 'en': {'title': 'PIMiner: Enhancing LLM Security Against Prompt Injection', 'desc': 'This paper addresses the security vulnerabilities of large language models (LLMs) to prompt injection attacks. It introduces PIMiner, a novel system designed for red-teaming these models by efficiently generating attack strategies. Unlike traditional methods that rely on reinforcement learning, PIMiner builds a strategy library from various dataset and model pairs, allowing it to adapt to new LLMs without retraining. Experimental results show that PIMiner achieves high attack success rates across multiple target models, demonstrating its effectiveness in enhancing LLM security.'}, 'zh': {'title': 'PIMiner：高效的提示注入红队系统', 'desc': '本文讨论了提示注入对大型语言模型（LLM）代理的安全风险，并提出了一种新的红队方法PIMiner。PIMiner通过训练一系列（数据集，目标模型）对，构建了一个策略库，可以在没有额外训练的情况下直接应用于未见过的目标LLM。实验结果表明，PIMiner在多个测试中表现出色，能够有效识别和利用提示注入的漏洞。该方法仅需少量查询即可实现高效的攻击成功率，展示了其在安全评估中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.04926', 'title': 'Consistency-Driven Co-Evolution for Self-Supervised Cross-Representation Learning', 'url': 'https://huggingface.co/papers/2608.04926', 'abstract': 'Abstract  As chart images, tabular data, and visualization code play increasingly important roles across diverse domains, cross-representation understanding across these modalities poses fundamental challenges for AI systems: the relationships across representations are inherently one-to-many, supervision is ambiguous and costly, and model optimization lacks a principled signal that is both direction-adaptive and representation-generalizable beyond task-specific objectives. We introduce CoCoEvolve to improve consistency across chart, table, and code representations. Instead of treating cross-representation mapping as a one-to-many problem, we define explicit one-to-one correspondences and optimize models using agreement between representations, without additional annotations. During training, CoCoEvolve@Train performs co-evolution across the chart-table-code cycle, while CoCoEvolve@Test applies the same consistency objective at inference time for test-time co-optimization. We also present CoCoEvolve@Eval, an evaluation suite covering all six cross-representation tasks. Across four benchmarks, CoCoEvolve improves performance in both training-time and test-time settings. Our project page: https://xhguo7.github.io/CoCoEvolve/.', 'score': 5, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '1e8e2933d897aa4f', 'authors': ['Xuehang Guo', 'Pengyuan Li', 'Tom Hope', 'Tirthankar Ghosal', 'Manling Li', 'Qingyun Wang'], 'affiliations': ['Allen Institute for AI', 'IBM', 'Northwestern University', 'Oak Ridge National Laboratory', 'William & Mary'], 'pdf_title_img': 'assets/pdf/title_img/2608.04926.jpg', 'data': {'categories': ['#training', '#multimodal', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Синхронизация визуализаций через согласованное развитие представлений', 'desc': 'Статья представляет CoCoEvolve — метод для улучшения согласованности между тремя модальностями: графиками, табличными данными и кодом визуализации. Авторы решают проблему одно-ко-многим соответствия между представлениями путём определения явных взаимно-однозначных соответствий и оптимизации моделей на основе согласованности между модальностями без дополнительных аннотаций. Подход включает co-evolution представлений как во время обучения, так и на этапе инференса для уточнения предсказаний. Экспериментальные результаты демонстрируют улучшение производительности модели на четырёх бенчмарках при использовании как обучающих, так и тестовых стратегий оптимизации.'}, 'en': {'title': 'Enhancing Cross-Representation Consistency with CoCoEvolve', 'desc': 'This paper presents CoCoEvolve, a method designed to enhance the understanding of relationships between chart images, tabular data, and visualization code in machine learning. It addresses the challenges of one-to-many mappings and ambiguous supervision by establishing explicit one-to-one correspondences between these representations. The model is optimized through agreement across representations, eliminating the need for additional annotations. CoCoEvolve demonstrates improved performance in both training and testing phases across various benchmarks, showcasing its effectiveness in cross-representation tasks.'}, 'zh': {'title': '提升图表、表格与代码的一致性', 'desc': '本论文介绍了一种名为CoCoEvolve的方法，旨在提高图表、表格和代码表示之间的一致性。我们通过定义明确的一对一对应关系，优化模型以实现表示之间的协议，而无需额外的注释。CoCoEvolve在训练过程中通过图表-表格-代码循环进行共同进化，而在测试时则应用相同的一致性目标进行共同优化。实验结果表明，CoCoEvolve在训练和测试阶段的表现均有所提升。'}}}, {'id': 'https://huggingface.co/papers/2607.22143', 'title': 'TriGlue: a Biology-Inspired Generative Model for Generating Molecular Glue-Induced Ternary Complex', 'url': 'https://huggingface.co/papers/2607.22143', 'abstract': 'Abstract  Molecular glue degraders have emerged as a promising strategy for targeted protein degradation by inducing ternary complex formation between an E3 ubiquitin ligase and a target protein. Despite their therapeutic potential, computational design of molecular glues remains largely unexplored. Unlike conventional structure-based drug design, molecular glue design is governed by the unknown protein-protein interface and requires the simultaneous modeling of ligand generation, protein-protein docking, and ternary complex assembly. In this work, we formulate molecular glue design as a ternary complex generation problem and propose a biology-inspired generative framework, TriGlue. Motivated by the mechanism of molecular glue action, we decompose ternary complex generation into two coupled stages: interface estimation and interface-conditioned complex generation. First, we develop an SE(3)-equivariant interface estimation module that predicts a geometrically constrained protein-protein interface from unbound monomer structures. Second, we introduce an interface-conditioned ternary flow matching network that jointly generates the molecular glue and predicts the rigid-body transformation required to assemble the ternary complex. Extensive experiments demonstrate that TriGlue generates chemically valid molecules and produces plausible ternary complexes, which highlight the potential of biology-inspired generative modeling for accelerating molecular glue discovery. Our code is available at https://github.com/yuliangyan0807/molecular-glue-design.', 'score': 5, 'issue_id': 2860, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '908c37c7b1f79c4f', 'authors': ['Yuliang Yan', 'Shuo Yan', 'Haochun Tang', 'Yiqin Sun', 'Enyan Dai'], 'affiliations': ['Jilin University', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2607.22143.jpg', 'data': {'categories': ['#architecture', '#open_source', '#3d', '#science', '#healthcare'], 'emoji': '🧬', 'ru': {'title': 'Генеративная модель для дизайна молекулярных деградаторов белков', 'desc': 'В работе предложен TriGlue — генеративный фреймворк для computational design молекулярных клеевых деградаторов белков. Авторы формулируют задачу дизайна как проблему генерации тройного комплекса между E3 убиквитин лигазой, целевым белком и малой молекулой-лигандом. Подход разложен на два этапа: оценка интерфейса белок-белок с использованием SE(3)-эквивариантной нейросети и условная генерация тройного комплекса через flow matching сеть. Экспериментальные результаты показывают, что модель генерирует химически валидные молекулы и правдоподобные структуры комплексов, демонстрируя эффективность biology-inspired генеративного моделирования.'}, 'en': {'title': 'TriGlue: Accelerating Molecular Glue Discovery through Generative Modeling', 'desc': 'This paper introduces TriGlue, a novel framework for designing molecular glue degraders that facilitate targeted protein degradation. The approach formulates the design process as a problem of generating ternary complexes, which involves predicting protein-protein interfaces and generating suitable ligands. TriGlue employs an SE(3)-equivariant module for interface estimation and a flow matching network for complex assembly, effectively modeling the interactions between proteins and ligands. The results show that TriGlue can create chemically valid molecules and plausible ternary complexes, showcasing its potential in accelerating the discovery of molecular glues.'}, 'zh': {'title': '生物启发的分子胶设计新方法', 'desc': '分子胶降解剂是一种有前景的靶向蛋白降解策略，通过诱导E3泛素连接酶与目标蛋白形成三元复合物。尽管其治疗潜力巨大，但分子胶的计算设计仍然未被充分探索。与传统的基于结构的药物设计不同，分子胶设计需要同时建模配体生成、蛋白质-蛋白质对接和三元复合物组装。本文提出了一种生物启发的生成框架TriGlue，将分子胶设计视为三元复合物生成问题，展示了其在加速分子胶发现方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.03392', 'title': 'Self-Evolving Coding Agents', 'url': 'https://huggingface.co/papers/2608.03392', 'abstract': 'Abstract  Large language models are increasingly embedded in software engineering workflows as coding agents that can inspect repositories, invoke tools, execute tests, debug failures, and generate patches. Yet most existing agents remain largely static after deployment, even though software development is a dynamic, feedback-rich process in which repositories evolve, dependencies change, tests fail, and repair attempts leave reusable experience. This tension has motivated a growing body of work on self-evolving coding agents, where the agent improves its future behavior by updating its framework, memory, skills, tools, models, or collaboration structures from prior coding interactions. In this survey, we provide a systematic synthesis of this emerging area. We first define self-evolving coding agents and distinguish them from conventional coding agents and general self-evolving agents. We then develop an object-centered taxonomy that characterizes what evolves in these systems, and complement it with two orthogonal perspectives: when evolution occurs and what software-specific evidence drives it. Across the literature, we find that executable feedback, repository-level context, and coding trajectories give software engineering a distinctive role as a natural domain for agent self-evolution, but also introduce new challenges in feedback reliability, benchmark overfitting, safety, maintainability, cost, and generalization. By organizing existing work around these dimensions, this survey aims to clarify the conceptual boundaries of self-evolving coding agents and provide a foundation for designing more adaptive, reliable, and software-aware agentic systems. The papers we collect can be found at https://github.com/zhouhao1024/Awesome-Self-Evolving-Coding-Agents.', 'score': 2, 'issue_id': 2863, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '2d089ea931fc2208', 'authors': ['Hao Zhou', 'Haichuan Hu', 'Ye Shang', 'Quanjun Zhang'], 'affiliations': ['Nanjing University', 'Nanjing University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.03392.jpg', 'data': {'categories': ['#survey'], 'emoji': '🤖', 'ru': {'title': 'Кодирующие агенты, которые учатся и адаптируются сами', 'desc': 'Этот обзор посвящен самоэволюционирующим кодирующим агентам на основе больших языковых моделей, которые не остаются статичными после развертывания, а улучшают свое поведение через обновление памяти, навыков, инструментов и стратегий на основе опыта разработки. Авторы предлагают систематическую классификацию таких систем, выделяя три ключевых аспекта: что эволюционирует в агенте, когда происходит эволюция и какие доказательства из процесса разработки ее движут. Исследование показывает, что исполняемая обратная связь, контекст репозитория и траектории кодирования создают уникальные возможности для самоэволюции агентов в инженерии ПО. Однако подход также привносит новые вызовы, включая надежность обратной связи, переобучение на бенчмарках, безопасность и обобщаемость систем.'}, 'en': {'title': 'Empowering Coding Agents to Evolve with Experience', 'desc': 'This paper discusses the concept of self-evolving coding agents, which are advanced AI systems that can adapt and improve their coding abilities over time. Unlike traditional coding agents that remain static after deployment, these agents learn from past interactions and update their frameworks, skills, and tools based on feedback from software development processes. The authors present a taxonomy to categorize the evolution of these agents and highlight the unique challenges they face, such as ensuring feedback reliability and maintaining safety. The survey aims to provide a clearer understanding of self-evolving coding agents and to lay the groundwork for creating more adaptive and effective coding systems.'}, 'zh': {'title': '自我进化编码代理：软件工程的未来', 'desc': '大型语言模型在软件工程工作流程中越来越多地被用作编码代理，能够检查代码库、调用工具、执行测试、调试错误和生成补丁。然而，大多数现有的代理在部署后仍然相对静态，无法适应软件开发中动态变化的环境。为了解决这个问题，研究者们开始关注自我进化的编码代理，这种代理能够通过更新其框架、记忆、技能和工具等来改善未来的行为。本文系统性地综述了这一新兴领域，定义了自我进化编码代理，并提出了一个对象中心的分类法，以帮助理解这些系统的演变特征。'}}}, {'id': 'https://huggingface.co/papers/2608.03207', 'title': 'DRIFT: Derailing Denoising Trajectories of Flow-Matching VLAs with Adversarial Patch Attack', 'url': 'https://huggingface.co/papers/2608.03207', 'abstract': "Abstract  Flow-matching vision-language-action (VLA) models such as pi0 generate robot actions by integrating a learned denoising velocity field, and have been reported to resist adversarial perturbations that readily fool autoregressive VLAs. We show that this robustness is largely illusory: it stems from prior attacks ignoring the multi-step denoising ODE. We introduce DRIFT (Denoising Redirection via Input perturbation of the Flow-matching Trajectory), a test-time universal adversarial patch placed on the robot's gripper that attacks the denoising velocity field of an off-the-shelf policy. Our central finding is counterintuitive: attacking only the first denoising step is both stronger and cheaper than attacking a wider window of steps, which we explain through a gradient conflict unique to input-space optimization and which is exactly opposite to the training-time backdoor regime. On pi0 and pi0.5 across four LIBERO suites, DRIFT breaks essentially all originally-solvable tasks with a small single patch, far exceeding action- and embedding-space attack baselines.", 'score': 1, 'issue_id': 2864, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '1069ae17c5a4063c', 'authors': ['Hoseong Tae', 'Jong-Seok Lee'], 'affiliations': ['School of Integrated Technology, Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03207.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Первый шаг — решающая уязвимость потоковых моделей робототехники', 'desc': 'В статье исследуется уязвимость flow-matching моделей видения-языка-действия (VLA), таких как pi0, которые генерируют действия робота через процесс деноизации. Авторы показывают, что кажущаяся робастность этих моделей к adversarial возмущениям является иллюзией, так как предыдущие атаки игнорировали многошаговый процесс решения дифференциального уравнения. Они предлагают DRIFT — универсальный adversarial patch на захвате робота, который атакует поле скорости деноизации за счёт возмущения входных данных на траектории flow-matching. Ключевой находкой является то, что атака только на первый шаг деноизации более эффективна и экономична, чем атака на несколько шагов, что объясняется уникальным конфликтом градиентов в оптимизации входного пространства.'}, 'en': {'title': 'Unmasking Vulnerabilities in VLA Models with Targeted Attacks', 'desc': "This paper discusses the vulnerabilities of flow-matching vision-language-action (VLA) models, specifically pi0, which are designed to generate robot actions. The authors reveal that the perceived robustness of these models against adversarial attacks is misleading, as it is based on ignoring the complexities of the multi-step denoising process. They introduce a novel attack method called DRIFT, which uses a universal adversarial patch to disrupt the denoising velocity field during the robot's operation. Their findings indicate that targeting the first step of the denoising process is more effective and efficient than broader attacks, highlighting a unique gradient conflict in input-space optimization."}, 'zh': {'title': '揭示VLA模型的虚假鲁棒性', 'desc': '本文探讨了流匹配视觉-语言-动作（VLA）模型的鲁棒性，特别是pi0模型如何通过学习的去噪速度场生成机器人动作。研究表明，这种鲁棒性在很大程度上是虚幻的，因为之前的攻击忽略了多步去噪常微分方程（ODE）。我们提出了DRIFT（通过输入扰动重定向去噪），这是一种在机器人抓手上放置的测试时通用对抗补丁，能够攻击现成策略的去噪速度场。我们的主要发现是，攻击第一个去噪步骤比攻击更广泛的步骤窗口更有效且成本更低，这一现象与训练时的后门机制正好相反。'}}}, {'id': 'https://huggingface.co/papers/2608.03836', 'title': 'Resume Means Resume: A Machine-Checked Conformance Contract for Checkpoint, Interrupt, and Resume Semantics in Workflow Persistence Layers', 'url': 'https://huggingface.co/papers/2608.03836', 'abstract': 'Abstract  A framework that persists execution state so a run can be interrupted, survive a crash, and continue must decide what a resume means for effects that already fired. Five widely deployed agent workflow frameworks answer differently, none exposes a machine-checkable contract, and behavior violates even the fragments they state. The RESUME CONTRACT states six properties over the persistence API (prefix continuation, effect exactly-once, fork determinism, checkpoint validity, consume-once, recovery determinism), plus fork-intent and liveness obligations. A TLA+ model checks a reference semantics exhaustively, unchanged at scaled bounds (7.4 million states); a 39-cell fault matrix yields the separating models independence requires, and consume-once splits, its consumption clause independent of all six others. A deterministic, LLM-free harness measures them at pinned releases. LangGraph 1.2.9 durably records a second resume value and never consults it, persists schema-invalid state silently, and re-executes durably recorded work after a real SIGKILL: exactly-once across interrupts, at-least-once across crashes, on one API. CrewAI 1.15.2 re-executes completed effect-bearing methods against its written claim; pydantic-graph 1.x cannot resume after a mid-node crash; no two probed frameworks share a conformance profile. Consume-once holds sequentially and fails under concurrent delivery: k processes resuming one parked interrupt fire the gated effect k times, saturation 1.0 in 36 of 40 cells, and the failure crosses hosts. REMIT, a reference sequencer whose Verus-verified recovery core is line-identical to the shipped executable, repairs the fork and validity cells. The cross-process cell is repaired at the read path, and that repair ships: an opt-in gate claims consumption in the shared store, serving one racer and refusing the rest before any node executes.', 'score': 0, 'issue_id': 2865, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '06e0a0eb35936633', 'authors': ['Sajjad Khan'], 'affiliations': ['independent researcher, London, UK'], 'pdf_title_img': 'assets/pdf/title_img/2608.03836.jpg', 'data': {'categories': [], 'emoji': '⚙️', 'ru': {'title': 'Формальная верификация надежности персистентности в агентских рабочих процессах', 'desc': 'В статье предложена формальная система контрактов для фреймворков автоматизации агентских рабочих процессов, которые должны сохранять состояние выполнения и восстанавливаться после сбоев. Исследователи определили шесть ключевых свойств надежной персистентности: продолжение префикса, ровно одно выполнение эффектов, детерминизм ветвления и другие, а затем проверили пять популярных фреймворков на соответствие этим требованиям. С помощью моделирования на TLA+ выявлено, что существующие решения имеют серьезные уязвимости, включая повторное выполнение завершенных операций и утечки состояния при отказах системы. Авторы предложили REMIT — эталонную реализацию с формально верифицированным ядром восстановления, которая устраняет выявленные проблемы и гарантирует корректное поведение при одновременном возобновлении.'}, 'en': {'title': 'Ensuring Reliable Resumption in Machine Learning Workflows', 'desc': 'This paper presents a framework for managing execution states in machine learning workflows, allowing processes to be interrupted and resumed after crashes. It introduces the RESUME CONTRACT, which defines six essential properties for persistence APIs to ensure reliable execution. The authors analyze various existing frameworks, highlighting their inconsistencies and failures in adhering to the defined properties. A model checking approach using TLA+ is employed to validate the semantics of the proposed framework, demonstrating its robustness across numerous states and scenarios.'}, 'zh': {'title': '持久化执行状态的框架与恢复契约', 'desc': '本文提出了一个框架，用于持久化执行状态，以便在中断、崩溃后能够继续运行。研究了五个广泛使用的代理工作流框架，它们对恢复的定义各不相同，且行为不符合其声明的部分。RESUME CONTRACT定义了六个关于持久化API的属性，并通过TLA+模型对参考语义进行了全面检查。实验结果表明，现有框架在恢复和并发交付方面存在问题，且没有两个框架共享一致的合规性特征。'}}}, {'id': 'https://huggingface.co/papers/2608.02023', 'title': 'SwanTale: Unified Multi-Speaker Speech and Audio Generation for Instruct and Zero-Shot Tasks', 'url': 'https://huggingface.co/papers/2608.02023', 'abstract': 'Abstract  Speech and audio generation is often needed in animation dubbing, audio drama, movies, advertising, games, podcasts, and short-video production. In these scenarios, creators may need to design voices without reference recordings, control speaker styles with natural language, support acoustic scenes with environments and audio effects, and later reuse the designed voices. Therefore, it is important to support multi-speaker speech and audio generation for both instruct and zero-shot tasks. The instruct task requires a caption of the environment, speaker styles, and fine-grained content, while the zero-shot task uses reference audio together with the same fine-grained content. We address these tasks from both the data and model sides. First, we propose SwanData-Caption, which cleans raw speech and audio data, adds targeted synthetic coverage, and annotates diverse and accurate multi-level captions. Then, we propose SwanTale, a multi-speaker expressive speech and audio generation model that supports both zero-shot and instruct tasks. We introduce SwanVAE to support high-quality multi-audio-modality generation. Then, we adopt reward-conditioned quality control and Engram conditioning, along with Unified MoE for multi-task and multi-audio-modality modeling. In addition, we use curriculum learning and GRPO post-training to let the model progressively learn and strengthen its capabilities. Experimental results show that SwanTale leads on multiple key zero-shot and instruct metrics, achieves the best expressiveness scores in both tasks, and supports complex instruct generation involving multi-speaker speech and audio. Demos can be found at https://swanaigc.github.io/\\#swantale.', 'score': 140, 'issue_id': 2839, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '4b04115678abc0cc', 'authors': ['Yu Zhang', 'Ruiqi Li', 'Changhao Pan', 'Ke Lei', 'Xiang Yin', 'Cheng Yang'], 'affiliations': ['ByteDance', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02023.jpg', 'data': {'categories': ['#games', '#training', '#audio', '#data', '#open_source', '#synthetic', '#dataset'], 'emoji': '🎙️', 'ru': {'title': 'Выразительная генерация речи и аудио с контролем по инструкциям и примерам', 'desc': 'В статье представлена система SwanTale для генерации многоголосой экспрессивной речи и аудио, которая поддерживает как инструктивные задачи с текстовым описанием сцены, так и нулевые примеры с референсным аудио. Авторы разработали датасет SwanData-Caption с чисткой данных, синтетическим расширением и многоуровневой аннотацией для обучения модели. Модель использует SwanVAE для высококачественной генерации мультимодального аудио, награду-обусловленный контроль качества, расширенное кодирование и унифицированную MoE архитектуру для обработки различных задач и модальностей. Система демонстрирует превосходные результаты по метрикам экспрессивности и качества в обеих постановках задач, включая сложные сценарии с несколькими говорящими.'}, 'en': {'title': 'Empowering Creative Voices with Advanced Audio Generation', 'desc': 'This paper presents advancements in speech and audio generation for various creative applications, such as animation and gaming. It introduces SwanData-Caption, a method for enhancing and annotating audio data to improve multi-speaker generation tasks. The authors also propose SwanTale, a model that excels in both instruct and zero-shot tasks, allowing for expressive audio generation without prior recordings. The model incorporates techniques like reward-conditioned quality control and curriculum learning to enhance its performance and adaptability.'}, 'zh': {'title': '多说话人语音生成的创新解决方案', 'desc': '本论文探讨了多说话人语音和音频生成在动画配音、音频剧、电影等场景中的应用。我们提出了SwanData-Caption，用于清理原始语音数据并添加多样化的注释，以支持指令和零样本任务。接着，我们介绍了SwanTale模型，能够生成高质量的多音频模态，并通过奖励条件质量控制和课程学习来提升模型能力。实验结果表明，SwanTale在多个关键指标上表现优异，支持复杂的多说话人语音生成。'}}}, {'id': 'https://huggingface.co/papers/2608.01964', 'title': 'LongHorizon-Harness: Advancing Long-Horizon Agents for Real-World Tasks', 'url': 'https://huggingface.co/papers/2608.01964', 'abstract': 'Abstract  Large language model (LLM) agents increasingly undertake long-horizon tasks that require sustained reasoning, tool use, and revision across many interdependent steps. However, existing agent harnesses maintain task execution, task state, and completion assessment within a growing context, making the state difficult to track and allowing incorrect self-assessments to propagate into later decisions. We reformulate long-horizon execution as a task-state management problem and propose LongHorizon-Harness, which maintains the task state explicitly outside execution and updates it only with facts independently verified from the environment. Its Manage-Execute-Audit(MEA) loop uses a manager to maintain the task state and determine the next subtask, a fresh-context executor to perform it, and a read-only auditor to verify the resulting environment state before the next round. A lightweight AgentAdapter supports interchangeable model and harness backends without modifying their native agent loops. LongHorizon-Harness improves Qwen~3.7-Plus from 51.8% to 80.7% on WeaveBench, from 69.7% to 77.2% on Terminal-Bench~2.1, and from 2.8% to 8.3% on OSWorld~2.0. It also raises Claude Opus~4.7 from 20.0% to 34.3% on an OSWorld2.0 subset, demonstrating consistent gains across models, harnesses, and interaction domains.', 'score': 126, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '2633e8f341470f4e', 'authors': ['Ziyu Ma', 'Hailang Huang', 'Shun Zou', 'Yong Wang', 'Shidong Yang', 'Yiming Hu', 'Fei Wei', 'XiangXiang Chu'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.01964.jpg', 'data': {'categories': ['#long_context', '#benchmark', '#agents', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Явное управление состоянием для надёжного выполнения сложных многошаговых задач агентами LLM', 'desc': 'Статья предлагает LongHorizon-Harness — новый фреймворк для управления долгоизмеряющимися задачами агентов на базе больших языковых моделей. Вместо того чтобы хранить состояние задачи внутри растущего контекста, система явно отделяет управление состоянием от выполнения и проверяет каждый результат независимо через взаимодействие с окружением. Архитектура использует цикл Manage-Execute-Audit: менеджер поддерживает состояние и определяет подзадачи, исполнитель выполняет их в свежем контексте, а аудитор верифицирует результаты перед следующей итерацией. Эксперименты показали значительные улучшения на нескольких бенчмарках: производительность моделей Qwen и Claude увеличилась на 20-30 процентных пункта.'}, 'en': {'title': 'Enhancing Long-Term Task Execution in LLMs with LongHorizon-Harness', 'desc': 'This paper introduces LongHorizon-Harness, a new framework designed to improve the performance of large language model (LLM) agents in executing long-term tasks. It addresses the challenge of tracking task state and preventing errors from propagating by managing task state externally and verifying facts from the environment. The framework employs a Manage-Execute-Audit (MEA) loop, which includes a manager for task state, an executor for performing subtasks, and an auditor for verifying outcomes. The results show significant performance improvements across various benchmarks, indicating the effectiveness of this approach in enhancing LLM capabilities.'}, 'zh': {'title': '提升长期任务执行的智能管理', 'desc': '本文提出了一种新的方法LongHorizon-Harness，用于管理大型语言模型（LLM）在执行长期任务时的状态。通过将任务执行重新定义为任务状态管理问题，该方法能够在执行过程中明确维护任务状态，并仅通过环境中独立验证的事实来更新状态。LongHorizon-Harness采用管理-执行-审计（MEA）循环，确保每个子任务的执行和结果都经过验证，从而减少错误传播。实验结果表明，该方法显著提高了多个模型在不同基准测试上的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.01735', 'title': 'DAPD: Dual-Anchored Policy Distillation', 'url': 'https://huggingface.co/papers/2608.01735', 'abstract': 'Abstract  On-policy (self) distillation (OPSD) is increasingly adopted for language-model post-training. It strengthens the teacher with privileged information but can induce a privilege illusion: the student learns privilege-dependent behavior it cannot reproduce from its inference-time context, yet behaves as if the training-time privileged information remained available, ultimately degrading performance. In this paper, we identify information asymmetry between the privileged teacher and the student at inference as the root cause of this failure in OPSD. To resolve this asymmetry, we propose Dual-Anchored Policy Distillation (DAPD), a unified framework with two levels of anchoring. Dual-Path Anchoring (DPA) introduces a self-conditioned bridge and aligns reference and rollout behavior along two matched-information paths, preventing privilege-dependent behavior from being transferred to the inference-time student. Dual-Source Anchoring (DSA) applies these paths in both reference-to-rollout and rollout-to-reference directions, reducing reliance on privileged reference guidance while preserving correctness supervision. Extensive experiments show that DAPD significantly alleviates privilege illusion, outperforming OPSD on Qwen3-4B by +2.00 points on average across tasks. Notably, its gains persist across scales, reaching +2.69 at 4B and +2.78 at 32B.', 'score': 54, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': 'c037e8e8eff733cd', 'authors': ['Jianyu Wu', 'Yizhou Wang', 'Encheng Su', 'Chen Tang', 'Shixiang Tang'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'The University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.01735.jpg', 'data': {'categories': [], 'emoji': '🎓', 'ru': {'title': 'Преодоление иллюзии привилегий в дистилляции языковых моделей', 'desc': 'В статье исследуется проблема привилегированной иллюзии в методе дистилляции политики на своих данных (OPSD), когда студент-модель учится поведению, зависящему от информации, недоступной во время инференса. Авторы предлагают метод Dual-Anchored Policy Distillation (DAPD), который устраняет информационную асимметрию между учителем и студентом через двухуровневое якорирование. Фреймворк использует Dual-Path Anchoring для выравнивания поведения по двум согласованным информационным путям и Dual-Source Anchoring для двусторонней передачи знаний. Экспериментальные результаты показывают, что DAPD значительно повышает качество дистилляции, улучшая производительность на +2.00 пункта в среднем и сохраняя преимущества при масштабировании до 32B параметров.'}, 'en': {'title': 'Bridging the Gap: Enhancing Language Models with Dual-Anchored Policy Distillation', 'desc': 'This paper discusses a method called Dual-Anchored Policy Distillation (DAPD) to improve on-policy self distillation in language models. The authors identify a problem where the student model learns behaviors based on privileged information that it cannot access during inference, leading to poor performance. DAPD introduces two anchoring techniques to align the learning process and reduce reliance on this privileged information. Experimental results show that DAPD significantly enhances model performance compared to traditional on-policy self distillation methods.'}, 'zh': {'title': '双锚策略蒸馏：消除特权幻觉的有效方法', 'desc': '本文提出了一种新的框架，称为双锚策略蒸馏（DAPD），旨在解决在语言模型后训练中出现的特权幻觉问题。特权幻觉是指学生模型在推理时无法重现训练时获得的特权信息，从而导致性能下降。通过双路径锚定和双源锚定，DAPD能够在两个信息路径上对齐参考和执行行为，减少对特权信息的依赖。实验结果表明，DAPD在多个任务上显著优于传统的自我蒸馏方法，提升了模型的整体性能。'}}}, {'id': 'https://huggingface.co/papers/2608.01678', 'title': 'Progressive Agent Skill Generation via Reinforcement Learning', 'url': 'https://huggingface.co/papers/2608.01678', 'abstract': 'Abstract  Existing skill generation methods largely rely on heuristics or pipeline-style consolidation, which must be specially designed for different evidence sources. In contrast, learning-based approaches offer a more unified way to model skill generation across heterogeneous sources. However, learning-based skill generation remains challenging because skills lack a natural supervision signal based on relevance or correctness; their value can largely be determined only by whether they improve the behavior of the agent on downstream tasks. To address this challenge, we propose Skill-α, a reinforcement learning method for progressively generating high-quality agent skills. Specifically, we formulate skill generation as a sequential editing process that decomposes skill construction into individually evaluable edits, and introduce a novel rollback reward that evaluates each edit by comparing downstream execution under the original and edited skills on an anchored query. Extensive experiments show that Skill-α generates more effective skills than methods based on heuristics or pipelines in both document-to-skill and experience-to-skill settings. Under the main GPT-4o worker, Skill-α improves average downstream success rates over the strongest skill-generation baseline by 3.3 points on CL-Bench and 6.7 points on tau2-bench. Further ablations validate the importance of rollback reward and progressive generation.', 'score': 49, 'issue_id': 2840, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '46889e670263b454', 'authors': ['Junhao Shen', 'Zhanqiu Zhang', 'Yiwen Guo', 'Hong Cheng'], 'affiliations': ['Independent Researcher', 'LIGHTSPEED', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.01678.jpg', 'data': {'categories': ['#agents', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Прогрессивная генерация навыков агента через последовательное редактирование с наградой отката', 'desc': 'В статье предлагается Skill-α — метод на основе обучения с подкреплением для генерации высокачественных навыков агента. Авторы формулируют создание навыков как последовательный процесс редактирования, где каждое изменение можно оценить отдельно с помощью новой награды отката, которая сравнивает выполнение задач с исходными и отредактированными навыками. В отличие от эвристических подходов, предложенный метод предоставляет унифицированный способ моделирования генерации навыков из разнородных источников данных. Экспериментальные результаты показывают значительное улучшение эффективности агента по сравнению с базовыми методами генерации навыков на нескольких бенчмарках.'}, 'en': {'title': 'Revolutionizing Skill Generation with Reinforcement Learning', 'desc': "This paper introduces Skill-α, a novel reinforcement learning approach for generating agent skills. Unlike traditional methods that rely on heuristics or fixed pipelines, Skill-α treats skill generation as a sequential editing process, allowing for more flexible and effective skill construction. The method employs a unique rollback reward mechanism to evaluate the impact of each edit on the agent's performance in downstream tasks. Experimental results demonstrate that Skill-α outperforms existing skill generation techniques, achieving significant improvements in success rates across various benchmarks."}, 'zh': {'title': 'Skill-α：通过强化学习生成高质量技能', 'desc': '现有的技能生成方法主要依赖启发式或管道式整合，这些方法需要针对不同的证据来源进行特别设计。与此不同，基于学习的方法提供了一种更统一的方式来建模跨异构来源的技能生成。然而，基于学习的技能生成仍然面临挑战，因为技能缺乏基于相关性或正确性的自然监督信号；它们的价值主要取决于是否能改善代理在下游任务中的表现。为了解决这个问题，我们提出了Skill-α，这是一种通过强化学习逐步生成高质量代理技能的方法。'}}}, {'id': 'https://huggingface.co/papers/2607.28590', 'title': 'VAD: Attributing Visual Evidence for Target Reconstruction in Multimodal On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.28590', 'abstract': 'Abstract  Multimodal on-policy distillation (OPD) transfers fine-grained visual knowledge by supervising student-generated trajectories with a privil
