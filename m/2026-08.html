configurations, revealing that improved annotations significantly enhance the performance of models like YOLOv8. The findings emphasize that high accuracy in controlled conditions does not necessarily translate to effective performance in real-world scenarios, underscoring the importance of robust evaluation methods for deployment.'}, 'zh': {'title': 'SULAND_v2：提升地雷检测的可靠基准', 'desc': '本论文介绍了SULAND_v2，一个改进的RGB地面雷达数据集和基准，用于无人机和地面车辆的地雷检测。研究发现，原有数据集存在标注错误和可视化不一致等问题，影响了检测器的性能。通过手动修正标注，SULAND_v2显著提高了YOLOv8在分布内和分布外的检测精度。该数据集为评估基于RGB的地雷行动调查支持的领域转移鲁棒性提供了可靠的基准。'}}}, {'id': 'https://huggingface.co/papers/2607.27851', 'title': 'Beyond Feeling Better: Capability-Sustaining Emotional Dialogue as a Longitudinal Research Paradigm', 'url': 'https://huggingface.co/papers/2607.27851', 'abstract': "Abstract  Emotional dialogue research includes two influential strategy traditions. Empathetic dialogue prioritizes understanding a speaker's emotional experience. Emotional support conversation selects and sequences support for the seeker's current needs. Sustained use introduces a further goal. Effective support should sustain users' capacities for emotion regulation, coping, self-endorsed decisions, and social connection across the interaction lifecycle. We propose capability-sustaining emotional dialogue (CSED) as a longitudinal research paradigm that aligns supportive strategy with this goal and organizes data, models, system design, evaluation, and governance around repeated use, non-use, transition, and termination. A targeted literature-and-corpus audit motivates this position. In a PRISMA-ScR-guided sample, 95% of 60 system-building papers pursue relief-oriented goals. None evaluates capability or longitudinal outcomes, and only 1 considers dependency, autonomy, or termination risk. In 300 ESConv supporter turns, capability-relevant functions appear in 43.0%, while generic suggestions account for 22.0%, compared with 4.0% reappraisal, 6.7% self-efficacy support, and 0.3% boundary behavior. We release a protocol for extending the audit to model behavior. An illustrative process model connects latent user capability to six design commitments, four evaluation timescales, and lifecycle constraints. The resulting agenda makes CSED testable across data, policy design, training, evaluation, and governance.", 'score': 2, 'issue_id': 2832, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': 'a7b6bdf989b3128f', 'authors': ['Ming Wang', 'Jiaqi Wu Young', 'Wenfang Wu', 'Daling Wang', 'Shi Feng'], 'affiliations': ['Amiya Research', 'Georg-August-Universität Göttingen', 'Northeastern University', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27851.jpg', 'data': {'categories': ['#training', '#benchmark', '#dataset'], 'emoji': '🌱', 'ru': {'title': 'От облегчения к укреплению: долгосрочная поддержка эмоционального благополучия в диалоговых системах', 'desc': 'Статья предлагает новую парадигму для исследования эмоциональных диалогов - CSED (capability-sustaining emotional dialogue), которая фокусируется на поддержании способностей пользователей к саморегуляции и автономии на протяжении всего взаимодействия. Авторы проводят систематический анализ существующих работ и обнаруживают, что 95% исследуемых систем ориентированы на немедленное облегчение эмоционального состояния, игнорируя долгосрочные эффекты и риски зависимости пользователя. Они анализируют корпус диалогов поддержки и показывают, что функции, относящиеся к укреплению способностей, встречаются редко, в то время как преобладают общие рекомендации. Исследование предлагает комплексный подход, включающий переработку данных, дизайн моделей, метрики оценки и управление на основе жизненного цикла взаимодействия.'}, 'en': {'title': 'Empowering Emotions: Sustaining Support in Dialogue', 'desc': "This paper introduces the concept of capability-sustaining emotional dialogue (CSED), which aims to enhance users' emotional regulation and social connections over time. It critiques existing emotional support systems for focusing primarily on immediate relief rather than long-term user capabilities. The authors conducted a literature review revealing that most studies do not assess the long-term effects of emotional support strategies. They propose a structured approach to evaluate and design systems that support users' emotional needs throughout their interaction lifecycle."}, 'zh': {'title': '能力维持情感对话：支持与成长的结合', 'desc': '情感对话研究包括两种重要的策略传统：同理心对话和情感支持对话。同理心对话重视理解说话者的情感体验，而情感支持对话则关注为寻求者的当前需求提供支持。我们提出了能力维持情感对话（CSED）作为一种长期研究范式，旨在将支持策略与用户情感调节和社会联系的能力维持目标相结合。通过对文献和语料库的审计，我们发现大多数系统构建的研究关注于缓解目标，而缺乏对能力或长期结果的评估。'}}}, {'id': 'https://huggingface.co/papers/2607.27888', 'title': 'Not All Tokens Deserve Equal Credit: Counterfactual Sensitivity Credit Reallocation for Long-CoT Reasoning', 'url': 'https://huggingface.co/papers/2607.27888', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) is central to improving long-CoT reasoning in large language models. Critic-free methods such as GRPO convert response-level rewards into advantages and uniformly broadcast them across tokens, overlooking their unequal contributions to the final outcome. On-policy self-distillation (OPSD) instead provides dense distributional supervision by minimizing the forward KL divergence between an unprivileged policy and a privileged self-teacher, implicitly assuming that the resulting likelihood shifts encode reliable answer-aligned information. We test this premise by fixing each sampled trajectory and re-scoring it under two opposing outcome conditions, one asserting correctness and the other incorrectness. Most affected tokens shift in the same direction under both conditions, with few sign reversals and substantial overlap in the induced optimization signals. Large shifts also concentrate on highly substitutable surface-form tokens, whereas tokens carrying problem-specific reasoning content are less sensitive. These findings show that privileged shifts fail to provide reliable answer-aligned directions, while their magnitudes primarily reflect counterfactual sensitivity rather than token-level learning value. Based on these observations, we propose Counterfactual Sensitivity Credit Reallocation (CSCR), a simple extension of GRPO that reduces credit for highly sensitive tokens and renormalizes token-level advantages to preserve both the original credit budget and verifier-determined direction. On long-CoT mathematical reasoning benchmarks, CSCR consistently outperforms GRPO baseline with the same number of policy updates. Targeted ablations further corroborate our diagnosis: privilege-induced directions are unreliable, moderate downweighting is most effective, and stronger modulation destabilizes optimization.', 'score': 2, 'issue_id': 2831, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '8d2d88dca8fba94f', 'authors': ['Qiangqiang He', 'Zhongheng Wu', 'ZiJian Wang'], 'affiliations': ['Institute of Wireless Communications Technology, Shanghai Jiao Tong University, Shanghai, China', 'State Key Laboratory for Novel Software Technology, Nanjing University, Nanjing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27888.jpg', 'data': {'categories': ['#rlhf', '#alignment', '#math', '#reasoning', '#rl', '#training'], 'emoji': '🧮', 'ru': {'title': 'Пересчёт кредитов обучения через контрфактическую чувствительность для улучшения рассуждений', 'desc': 'В статье предлагается новый подход к обучению с подкреплением на основе верифицируемых вознаграждений для улучшения длинных цепочек рассуждений в большых языковых моделях. Авторы выявляют, что методы самодистилляции, такие как OPSD, неправильно распределяют кредиты обучения между токенами, так как их чувствительность к контрфактическим условиям не коррелирует с релевантностью для финального ответа. На основе этого анализа предлагается метод CSCR, который переаллоцирует кредиты обучения, снижая вес для высокочувствительных поверхностных токенов и сохраняя исходный бюджет вознаграждений. Экспериментально показано, что CSCR последовательно превосходит базовый метод GRPO на задачах математического рассуждения.'}, 'en': {'title': 'Revolutionizing Token Credit in Reinforcement Learning', 'desc': 'This paper introduces a new approach called Counterfactual Sensitivity Credit Reallocation (CSCR) to improve reinforcement learning in large language models, particularly for long-chain of thought (CoT) reasoning. The authors critique existing methods like GRPO for treating all tokens equally, which can lead to misleading optimization signals. By analyzing how tokens respond to different outcome conditions, they find that some tokens are more sensitive and less reliable for guiding learning. CSCR addresses these issues by adjusting the credit given to sensitive tokens, leading to better performance on reasoning tasks compared to traditional methods.'}, 'zh': {'title': '反事实敏感性提升长链推理', 'desc': '强化学习与可验证奖励（RLVR）在提升大型语言模型的长链推理能力中起着重要作用。现有的无评论方法如GRPO将响应级奖励转化为优势，并在所有标记中均匀传播，忽视了它们对最终结果的不同贡献。我们提出的在政策自蒸馏（OPSD）方法通过最小化未特权政策与特权自教师之间的前向KL散度，提供了密集的分布式监督。基于我们的研究结果，我们提出了反事实敏感性信用重新分配（CSCR），该方法在长链数学推理基准测试中表现优于GRPO基线。'}}}, {'id': 'https://huggingface.co/papers/2607.27951', 'title': 'Safeguards Based on Copyable Context Cannot Provide Reliable Safety for LLMs', 'url': 'https://huggingface.co/papers/2607.27951', 'abstract': 'Abstract  Large language model safeguards decide whether to answer before seeing how an answer will be used. This creates a basic problem for dual-use tasks: the same answer can help an authorized professional or an attacker, while an attacker can imitate a benign request and interaction history. We separate the capability released by the model from the evidence available about downstream use. When that evidence is copyable, we derive the exact worst-case floor on attacker assistance while preserving useful answers. The result yields a safety trilemma: Useful Capability, Reliable Safety, and Open Access cannot coexist. We then show how a trusted credential can complement existing safeguards by adding hard-to-copy information that predicts actual downstream use, and identify the stronger condition needed to eliminate the floor. Evidence from dual-use evaluations, adaptive attacks, and deployed trusted-access programs supports the practical relevance of these conditions.', 'score': 1, 'issue_id': 2829, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '093f0fd124e2ee50', 'authors': ['Pingyu Wu', 'Lingyao Zhu', 'Weiming Zhang', 'Nenghai Yu'], 'affiliations': ['Hefei AiDA Lab', 'University of Science and Technology of China', 'Zhejiang Wanli University'], 'pdf_title_img': 'assets/pdf/title_img/2607.27951.jpg', 'data': {'categories': [], 'emoji': '🔐', 'ru': {'title': 'Невозможная триада: утилита, безопасность и открытость в защите языковых моделей', 'desc': 'В этой работе исследуется фундаментальная проблема защиты больших языковых моделей при выполнении задач двойного назначения, когда один и тот же ответ может быть использован как легально, так и во вредоносных целях. Авторы разделяют возможности модели от информации о том, как будет использован ответ, и доказывают математически точный минимальный уровень помощи злоумышленнику при сохранении полезности системы. Они выявляют триллемму безопасности: полезность, надежная защита и открытый доступ не могут существовать одновременно. Предложено решение в виде доверенной идентификации пользователя, которая добавляет сложно подделываемую информацию для прогнозирования реального использования ответа.'}, 'en': {'title': 'Balancing Safety and Utility in Language Models', 'desc': 'This paper discusses the challenges of using large language models in situations where their answers can be misused. It highlights a safety trilemma where useful capabilities, reliable safety, and open access cannot all be achieved simultaneously. The authors propose a solution involving trusted credentials that provide hard-to-copy information to better predict how answers will be used. They support their findings with evidence from evaluations and real-world programs that address dual-use concerns.'}, 'zh': {'title': '安全三难：能力、安全与开放的冲突', 'desc': '这篇论文讨论了大型语言模型在回答问题前如何决定是否回答，这在双重用途任务中引发了问题。相同的答案可能对授权专业人士有帮助，但也可能被攻击者利用。作者提出了一种方法，将模型的能力与下游使用的证据分开，从而在保持有用答案的同时，推导出攻击者协助的最坏情况底线。最后，论文提出了一个安全三难困境，表明有用能力、可靠安全和开放访问无法共存，并建议使用可信凭证来增强现有的安全措施。'}}}, {'id': 'https://huggingface.co/papers/2607.15820', 'title': "In the Driver's Seat: A Multi-Company Study on the Reality of Autonomous Driving System Testing", 'url': 'https://huggingface.co/papers/2607.15820', 'abstract': 'Abstract  Autonomous driving systems (ADS) are rapidly advancing and increasingly deployed in real-world applications. This creates growing demands for effective testing to ensure system functionality and safety. However, ADS testing remains complex and lacks well-established standards for scenario selection, performance evaluation, and acceptance criteria. To better understand current ADS testing practices and challenges, we conducted an interview study with experts working on ADS development and testing in nine companies from six different countries. Through thematic analysis, we synthesized industrial testing practices, challenges, potential solutions, future trends, and proposed an evidence-centered closed-loop testing framework for ADS testing. Our findings show that current practices primarily focus on scenario-based and X-in-the-loop testing approaches, supported by diverse tools, metrics, benchmarks, and testing strategies. The participants highlighted major challenges related to scenario realism, scenario coverage, simulation fidelity, and acceptance criteria, while also discussing potential solutions such as the use of AI, world models, and end-to-end approaches. Furthermore, participants envisioned future ADS testing to become more automated, data-driven, and transparent across the industry. Overall, this study provides a comprehensive industry-grounded overview of ADS testing, proposes an evidence-centered closed-loop testing framework to provide actionable guidance for ADS testing, and outlines important directions for future research and practice.', 'score': 1, 'issue_id': 2830, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'ca0b14a17c0a7534', 'authors': ['Qunying Song', 'Yuan Gao', 'Johannes Betz', 'Dietmar Pfahl', 'Mohammad Reza Mousavi', 'Federica Sarro'], 'affiliations': ['Kings College London', 'Technical University of Munich', 'University College London', 'University of Tartu'], 'pdf_title_img': 'assets/pdf/title_img/2607.15820.jpg', 'data': {'categories': [], 'emoji': '🚗', 'ru': {'title': 'Стандартизация и автоматизация тестирования автономных транспортных систем', 'desc': 'В работе проведено исследование практик тестирования автономных систем вождения через интервью с экспертами из девяти компаний. Авторы выявили, что индустрия преимущественно использует сценарное тестирование и X-in-the-loop подходы с различными метриками и бенчмарками для оценки. Основные проблемы включают реалистичность сценариев, полноту их покрытия, точность симуляции и отсутствие стандартизированных критериев приемки систем. Исследователи предложили замкнутую циклическую схему тестирования на основе доказательств, которая поможет ориентировать будущие направления разработки и тестирования автономных систем.'}, 'en': {'title': 'Enhancing Safety in Autonomous Driving: A New Testing Framework', 'desc': 'This paper discusses the challenges and practices in testing autonomous driving systems (ADS), which are becoming more common in real-world applications. The authors conducted interviews with experts from various companies to gather insights on current testing methods, focusing on scenario-based and X-in-the-loop approaches. They identified key challenges such as ensuring scenario realism and coverage, and proposed an evidence-centered closed-loop testing framework to improve testing effectiveness. The study emphasizes the need for more automated and data-driven testing solutions in the future.'}, 'zh': {'title': '推动自动驾驶测试的标准化与智能化', 'desc': '自动驾驶系统（ADS）正在快速发展并逐渐应用于现实世界中，这对有效的测试提出了更高的要求，以确保系统的功能和安全性。然而，ADS的测试仍然复杂，缺乏成熟的标准来选择场景、评估性能和设定接受标准。通过对来自六个国家九家公司的ADS开发和测试专家进行访谈，我们总结了当前的测试实践、面临的挑战和潜在解决方案，并提出了一个以证据为中心的闭环测试框架。研究发现，当前的测试主要集中在基于场景和X-in-the-loop的测试方法上，并强调了场景真实性、覆盖率、仿真保真度和接受标准等主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2607.28478', 'title': 'Would You Walk to the Car Wash? Revealing the Salience Bias of Large Language Models in Commonsense Reasoning', 'url': 'https://huggingface.co/papers/2607.28478', 'abstract': 'Abstract  As large language models (LLMs) continue to advance in complex reasoning tasks, they have learned to heavily prioritize explicit conditions provided in the input. However, in everyday commonsense reasoning, this mechanism exposes a critical vulnerability which we term Salience Bias: models become easily hijacked by useless explicit distractors (e.g., numerical values), leading them to ignore the implicit physical or commonsense prerequisites of a task. A critical open question is whether this failure reflects a genuine gap in commonsense knowledge or merely its suppression under misleading task framing. To investigate this, we construct the SaliTrap Benchmark, a high-quality dataset across four trap dimensions. Evaluating 12 state-of-the-art LLMs, we find that all mainstream models suffer significantly from salience bias, with severity scaling with distractor density and detecting the trap often decoupled from actually avoiding it. Crucially, by re-eliciting the same models with the task framing stripped away, we show that this is overwhelmingly a failure of knowledge suppression rather than knowledge absence: a context-free knowledge probe alone recovers over 90\\% of sycophantic-compliance failures, revealing that the requisite commonsense is intrinsically present but actively crowded out by salient distractors that lure the model into over-compliant, unnecessary computation. Building on this diagnosis, we further show that lightweight, inference-time prompting alone substantially closes the gap without any retraining. Our findings relocate the bottleneck of commonsense reasoning failures from model competence to elicitation, and we release SaliTrap as a testbed for this blind spot. The codes are available at https://github.com/Wuzheng02/SaliTrap.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-30', 'pub_date_card': {'ru': '30 июля', 'en': 'July 30', 'zh': '7月30日'}, 'hash': '6158cf6a073d8d77', 'authors': ['Zheng Wu', 'Chenhao Xue', 'Shijie Zheng', 'Yijie Lu', 'Cheng Yang', 'Zhuosheng Zhang'], 'affiliations': ['ByteDance Inc', 'School of Computer Science, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.28478.jpg', 'data': {'categories': ['#interpretability', '#open_source', '#benchmark', '#reasoning', '#dataset'], 'emoji': '🪤', 'ru': {'title': 'Когда модель знает, но молчит: как отвлекающие факторы подавляют здравый смысл LLM', 'desc': 'В работе исследуется уязвимость больших языковых моделей, названная Salience Bias, когда модели игнорируют неявные знания здравого смысла, отвлекаясь на явные, но бесполезные признаки в входных данных. Авторы создали бенчмарк SaliTrap для оценки этого явления и обнаружили, что все современные LLM страдают от этой проблемы в различной степени. Ключевой находкой является то, что это не дефицит знаний, а их подавление: модели обладают необходимыми знаниями здравого смысла, но активно их игнорируют из-за отвлекающих факторов. Авторы показали, что простые техники переформулирования задачи во время инференции значительно улучшают производительность без переобучения модели.'}, 'en': {'title': 'Unmasking Salience Bias in Language Models', 'desc': 'This paper discusses a problem called Salience Bias in large language models (LLMs), where these models focus too much on explicit information in their inputs, like numbers, and ignore important commonsense knowledge. The authors created a new dataset called the SaliTrap Benchmark to test this bias across different scenarios. They found that all tested LLMs struggle with this issue, often failing to avoid distractions even when they have the necessary knowledge. By adjusting how tasks are presented to the models, they demonstrated that the knowledge is there, but the way tasks are framed can suppress it, suggesting that improving task presentation can enhance model performance without needing retraining.'}, 'zh': {'title': '揭示显著性偏差：常识推理的新挑战', 'desc': '随着大型语言模型（LLMs）在复杂推理任务中的进步，它们开始过度依赖输入中的显性条件。这种机制导致了一个关键的脆弱性，称为显著性偏差：模型容易受到无用的显性干扰因素（如数字值）的影响，从而忽视任务的隐性物理或常识前提。通过构建SaliTrap基准数据集，我们发现主流模型在显著性偏差上普遍存在显著问题，且这种偏差与干扰因素的密度成正比。我们的研究表明，这主要是知识抑制的失败，而非知识的缺失，提供了一个新的视角来理解常识推理的瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2607.25388', 'title': 'SGTP: Sampling-based Game-Theoretic Planning for Real-Time Multi-Vehicle Autonomous Racing', 'url': 'https://huggingface.co/papers/2607.25388', 'abstract': 'Abstract  Autonomous multi-vehicle racing requires real-time planning of diverse competitive behaviors in intense interactions. Existing planners often struggle to balance strategic diversity and computational efficiency. To address this challenge, we propose Sampling-based Game-Theoretic Planning (SGTP), a real-time framework that combines game-theoretic reasoning with GPU-accelerated sampling of control sequences and dynamics rollouts. Sampled trajectories are ranked using a game-aware cost to capture competitive interactions and generate diverse racing behaviors. Our planner then performs feasibility selection by explicitly enforcing track-boundary and dynamic collision-avoidance constraints, ensuring safe and reliable transitions between racing strategies. Extensive simulations on challenging tracks show that SGTP achieves a 95.24% win rate and a 99.35% task-completion ratio in highly interactive races, with a mean computational time of 0.095 s over multiple iterative solving steps. We also demonstrate the successful application of SGTP in large-scale scenarios with up to 10 agents. We release our code and provide an open-source benchmark of multi-agent autonomous racing algorithms to facilitate future research. Project page: https://sgtp-racing.github.io/.', 'score': 0, 'issue_id': 2830, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f3729abb79ae6080', 'authors': ['Zhouheng Li', 'Fangguo Zhao', 'Mattia Piccinini', 'Baha Zarrouki', 'Yuan Gao', 'Zitong Shan', 'Johannes Betz', 'Chen Lv', 'Lei Xie'], 'affiliations': ['Baha Zarrouki', 'Chen Lv', 'Fangguo Zhao', 'Johannes Betz', 'Lei Xie', 'Mattia Piccinini', 'Yuan Gao', 'Zhouheng Li', 'Zitong Shan'], 'pdf_title_img': 'assets/pdf/title_img/2607.25388.jpg', 'data': {'categories': ['#games', '#agents', '#open_source', '#optimization', '#benchmark', '#robotics', '#reasoning'], 'emoji': '🏎️', 'ru': {'title': 'Теоретико-игровое планирование для многоагентных автономных гонок', 'desc': 'В статье предлагается Sampling-based Game-Theoretic Planning (SGTP) — фреймворк для планирования траекторий автономных гоночных автомобилей в режиме реального времени. Метод комбинирует теоретико-игровой подход с GPU-ускоренной генерацией и развёртыванием последовательностей управления для моделирования динамики. Сгенерированные траектории ранжируются с помощью специальной cost-функции, учитывающей конкурентные взаимодействия между агентами и обеспечивающей разнообразие поведения. Алгоритм гарантирует безопасность через явное соблюдение ограничений трека и динамического избежания столкновений, демонстрируя высокую производительность на сложных сценариях с множественными агентами.'}, 'en': {'title': 'Revolutionizing Autonomous Racing with Game-Theoretic Planning', 'desc': "This paper introduces Sampling-based Game-Theoretic Planning (SGTP), a new framework for real-time decision-making in autonomous multi-vehicle racing. SGTP combines game-theoretic principles with GPU-accelerated sampling to efficiently generate and evaluate diverse racing strategies. The planner ranks sampled trajectories based on a game-aware cost function, ensuring that competitive interactions are effectively captured. The results demonstrate SGTP's high performance in terms of win rate and task completion, while maintaining safety through collision-avoidance constraints."}, 'zh': {'title': '实时博弈论规划，提升赛车策略的多样性与安全性', 'desc': '这篇论文提出了一种名为基于采样的博弈论规划（SGTP）的实时框架，旨在解决自主多车赛车中的复杂行为规划问题。SGTP结合了博弈论推理和GPU加速的控制序列采样，以实现高效的竞争行为生成。通过使用博弈感知成本对采样轨迹进行排名，SGTP能够捕捉竞争互动并生成多样化的赛车行为。此外，该规划器通过强制执行赛道边界和动态避碰约束，确保赛车策略之间的安全可靠过渡。'}}}, {'id': 'https://huggingface.co/papers/2608.05102', 'title': 'ABSeeker: Training Long-Horizon Search Agents via Answer-Backtracked Credit Assignment', 'url': 'https://huggingface.co/papers/2608.05102', 'abstract': 'Abstract  Long-horizon search agents must make multiple sequential actions (steps) to search, retrieve, verify, and integrate evidence to reach a final answer. However, existing methods for training these agents typically treat all steps within a trajectory uniformly during both supervised fine-tuning (SFT) and reinforcement learning (RL), failing to distinguish useful actions from erroneous or redundant ones. In this paper, we propose Answer-Backtracked Credit Assignment (ABC), a fine-grained credit assignment framework for training long-horizon search agents by converting sparse trajectory-level outcomes into dense step-level supervision that rewards useful actions (even in failed trajectories) while suppressing erroneous or redundant actions. Specifically, given a potentially obscure query and its corresponding ground-truth answer, ABC first performs Answer-Backtracked Clue Recovery, which traces back from the answer to recover intermediate clues required to solve the question. It then applies Clue-Anchored Step Scoring to evaluate each search step against these clues, converting sparse binary outcome supervision into dense step-level rewards. Based on these rewards, we develop ABC-SFT, which reweights the loss of each turn, and ABC-GRPO, which uses the step-level scores as rewards in GRPO. Building on this framework, we train ABSeeker based on Qwen3.5-4B with only 8.5k examples. ABSeeker achieves 37.3% on BrowseComp and 39.1% on BrowseComp-ZH. With context management, the scores further improve to 55.3% and 52.9%, respectively, significantly outperforming same-scale (4B) agents and even matching the performance of larger ones (approximately 30B). These results demonstrate the effectiveness of answer-backtracked step-level credit assignment for training long-horizon search agents.', 'score': 51, 'issue_id': 2863, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '340dabc727497dfa', 'authors': ['Yijun Lu', 'Rui Ye', 'Jiajun Wang', 'Yuwen Du', 'Tian Jin', 'Songhua Liu', 'Siheng Chen'], 'affiliations': ['Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05102.jpg', 'data': {'categories': ['#small_models', '#rl', '#long_context', '#reasoning', '#multilingual', '#agents', '#optimization', '#training'], 'emoji': '🔍', 'ru': {'title': 'Отслеживание ответа для точного распределения кредита в многошаговом поиске', 'desc': 'В работе предложен метод Answer-Backtracked Credit Assignment (ABC) для улучшения обучения агентов, которые выполняют многошаговый поиск и верификацию информации. Вместо одинакового подхода ко всем шагам траектории, метод преобразует разреженный результат на уровне траектории в плотное обучающее сигнал на уровне отдельных действий, поощряя полезные шаги и подавляя ошибочные. ABC использует механизм обратного восстановления подсказок из правильного ответа и оценивает каждый поисковый шаг относительно этих подсказок, применяя как взвешенное SFT, так и GRPO с пошаговыми вознаграждениями. Обученный на этой основе агент ABSeeker показал значительное улучшение производительности на бенчмарках BrowseComp, превосходя агентов аналогичного размера и конкурируя с моделями в несколько раз больше.'}, 'en': {'title': 'Enhancing Long-Horizon Search Agents with Fine-Grained Credit Assignment', 'desc': 'This paper introduces a new method called Answer-Backtracked Credit Assignment (ABC) to improve the training of long-horizon search agents. Traditional training methods treat all actions equally, which can lead to ineffective learning from mistakes. ABC enhances this by providing detailed feedback on each action taken during the search process, rewarding useful steps and penalizing redundant ones. The results show that agents trained with ABC can achieve high performance with fewer training examples, outperforming larger models in specific tasks.'}, 'zh': {'title': '答案回溯，提升搜索代理训练效果', 'desc': '本文提出了一种名为答案回溯信用分配（ABC）的框架，用于训练长时间搜索代理。该方法通过将稀疏的轨迹级结果转化为密集的步骤级监督，来奖励有用的动作并抑制错误或冗余的动作。具体来说，ABC首先从答案回溯，恢复解决问题所需的中间线索，然后对每个搜索步骤进行评分。通过这种方式，ABC显著提高了长时间搜索代理的训练效果，尤其是在处理复杂查询时。'}}}, {'id': 'https://huggingface.co/papers/2608.04436', 'title': 'ToolArtist: Tool-Using Unified Multimodal Models for Agentic Image Generation', 'url': 'https://huggingface.co/papers/2608.04436', 'abstract': 'Abstract  Text-to-image (T2I) models can produce visually compelling images, yet they remain limited on open-world tasks that require complex semantic understanding, multi-step reasoning, and the integration of external world knowledge. Existing efforts introduce agent capabilities into image generation, but they either prescribe a fixed workflow or place only a subset of the open-world image generation process under agent control. Consequently, reasoning, tool invocation, and image generation are not coordinated by a single policy. We propose ToolArtist, a fully agentic image generation model obtained by post-training a Unified Multimodal Model (UMM). ToolArtist dynamically orchestrates reasoning, external tool use, and native image generation within one unified policy. During Supervised Fine-Tuning (SFT), we equip a teacher agent with search tools alongside an image-generation tool. We then convert the collected trajectories into a UMM compatible format, where the image-generation tool is concealed while the resulting generated images are retained. During Reinforcement Learning (RL), we develop an agentic RL infrastructure for UMMs and introduce Reason-Act-Draw GRPO (RAD-GRPO), which uses complementary intent and quality rewards to jointly optimize the model. Experiments show that placing the entire open-world image-generation process under an agent policy consistently outperforms approaches with fixed pipelines or only partially agent-controlled components. We release the training data and the complete post-training infrastructure.', 'score': 45, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'fb41881aa5b570f4', 'authors': ['Jiahao Zhao', 'Xiaomin Yu', 'Zhongxiang Sun', 'Fengwei Teng', 'Chengwei Qin', 'Xiaobin Hu', 'Jun Xu', 'Shuicheng Yan'], 'affiliations': ['HKUST(GZ)', 'NUS', 'RUC', 'UCD'], 'pdf_title_img': 'assets/pdf/title_img/2608.04436.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#reasoning', '#open_source', '#agents', '#rl'], 'emoji': '🎨', 'ru': {'title': 'Единая политика для интеллектуальной генерации изображений', 'desc': 'Статья представляет ToolArtist — модель генерации изображений из текста, которая использует агентный подход для координации рассуждений, вызова внешних инструментов и создания изображений под единой политикой. Модель обучается на основе Unified Multimodal Model (UMM) с применением Supervised Fine-Tuning, где агент использует поисковые инструменты вместе с инструментом генерации изображений. Для оптимизации предложен метод Reason-Act-Draw GRPO, который комбинирует награды за намерение и качество для улучшения производительности. Результаты показывают, что полная агентная система превосходит подходы с фиксированными конвейерами или частичным управлением агентом.'}, 'en': {'title': 'Empowering Image Generation with Unified Agent Control', 'desc': 'This paper introduces ToolArtist, a novel text-to-image (T2I) model that enhances image generation by integrating reasoning, tool usage, and image creation into a single agentic framework. Unlike previous models that relied on fixed workflows or limited agent control, ToolArtist employs a Unified Multimodal Model (UMM) that dynamically coordinates all aspects of the image generation process. The model is trained using Supervised Fine-Tuning (SFT) and Reinforcement Learning (RL), optimizing performance through a new method called Reason-Act-Draw GRPO (RAD-GRPO). Experimental results demonstrate that ToolArtist significantly outperforms traditional methods by fully leveraging agent capabilities in open-world tasks.'}, 'zh': {'title': 'ToolArtist：统一的智能图像生成模型', 'desc': '本文提出了一种名为ToolArtist的图像生成模型，旨在解决现有文本到图像模型在开放世界任务中的局限性。ToolArtist通过后训练统一多模态模型（UMM），实现了推理、外部工具使用和图像生成的动态协调。该模型在监督微调阶段引入了教师代理和搜索工具，并在强化学习阶段采用了Reason-Act-Draw GRPO方法，以优化模型的意图和质量奖励。实验结果表明，将整个开放世界图像生成过程置于代理策略下，显著优于固定流程或部分代理控制的方案。'}}}, {'id': 'https://huggingface.co/papers/2608.05000', 'title': 'Towards Physics of Multimodal Pretraining: Knowledge Flow, Modality Synergy, Early Unification, and Recipes', 'url': 'https://huggingface.co/papers/2608.05000', 'abstract': 'Abstract  Vision offers a critical axis for advancing foundation models, driving a shift towards natively unified multimodal pretraining. Despite this momentum, the design space and the fundamental mechanisms of how modalities interact during unified training remain underexplored. We provide empirical clarity through a systematic exploration of multimodal pretraining. Our controlled experiments on both synthetic and large-scale real-world datasets yield four key insights into the physics of multimodal pretraining: (i) Knowledge Flow: We disentangle how language, visual understanding, and visual generation transfer knowledge across modalities, revealing distinct patterns of influence and asymmetry; (ii) Synergy vs. Competition: We show that data "complexity" largely determines whether modalities are synergistic, identify architectural choices that promote synergy: such as shared attention and normalization with modality-specific feed-forward layers, and find that these behaviors generalize across different visual tokenizer designs; (iii) Early Unification: Unifying modalities from the very early stages and training them jointly is shown to be more effective than late alignment or sequential training. This process uncovers a vision laziness phenomenon, where delayed integration leads models to rely on language priors; (iv) Recipes: We derive efficient pretraining recipes that achieve strong generative performance using only 5% of the compute budget. These core findings are subsequently validated at scale by training multiple 13.5B MoE models on 2T tokens. We hope this study provides a principled foundation for understanding and scaling multimodal pretraining.', 'score': 37, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'f70cccf2f1c0f435', 'authors': ['Junlin Han', 'Shengbang Tong', 'David Fan', 'Minghao Chen', 'Philip Torr', 'Filippos Kokkinos', 'Mike Lewis'], 'affiliations': ['FAIR, Meta', 'Reality Labs, Meta', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.05000.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#transfer_learning', '#open_source', '#synthetic', '#architecture'], 'emoji': '🔗', 'ru': {'title': 'Физика мультимодального предобучения: от конкуренции к синергии модальностей', 'desc': 'В этой работе авторы систематически исследуют взаимодействие модальностей при едином мультимодальном предобучении, используя контролируемые эксперименты на синтетических и больших реальных датасетах. Они выявили четыре ключевых закономерности: поток знаний между языком и зрением асимметричен, синергия модальностей определяется сложностью данных и архитектурными решениями, раннее объединение модальностей эффективнее последовательного обучения, а также разработали оптимальные рецепты предобучения, требующие только 5% вычислительных ресурсов. Полученные выводы подтверждены на масштабных экспериментах с мультиэкспертными моделями объёмом 13.5B параметров, обученными на 2 триллионах токенов.'}, 'en': {'title': 'Unlocking the Power of Multimodal Pretraining', 'desc': 'This paper explores how different types of data, like images and text, can be combined effectively in machine learning models. It identifies how knowledge flows between these modalities and how their interaction can either help or hinder performance based on data complexity. The authors emphasize the importance of training these modalities together from the start, rather than separately, to improve model efficiency and effectiveness. They also propose new strategies for pretraining that require less computational power while still achieving strong results.'}, 'zh': {'title': '多模态预训练的关键发现与高效方案', 'desc': '本论文探讨了多模态预训练的基础模型，强调视觉在这一过程中的重要性。我们通过系统的实验，揭示了语言、视觉理解和生成之间的知识流动及其相互影响的模式。研究发现，数据的复杂性决定了模态之间的协同或竞争关系，并提出了早期统一训练的优势。最后，我们提供了高效的预训练方案，能够在较低的计算预算下实现强大的生成性能。'}}}, {'id': 'https://huggingface.co/papers/2608.04570', 'title': 'The Personalization Mirage: How LLMs Fabricate User Profiles, and Why Self-Monitoring Misleads', 'url': 'https://huggingface.co/papers/2608.04570', 'abstract': "Abstract  Personalized LLMs with persistent memory are increasingly deployed, yet the faithfulness of their user models remains unexamined. We study over-inference (OI): the phenomenon where LLMs fabricate user attributes beyond what evidence supports. We introduce MirageBench, comprising 150 personas balanced across stereotypical, counter-stereotypical, and neutral profiles, 6 personalization tasks spanning an ``imagination gradient'', a four-way faithfulness taxonomy operationalized by an independent judge (validated against a blind human annotator on 400 claims: Cohen's kappa = 0.863 four-class, kappa = 0.900 binary), and a leaderboard of 12 models across 7 families on 143616 judged claims. We find that over-inference is pervasive: every one of the 12 models over-infers 35%--49% of its claims (cross-model mean 41.6%; claim-weighted 41.8%), with no model in this evaluation escaping it. Most strikingly, we surface a Self-Monitoring Inversion: at the model-selection level, models' self-assessed OI is negatively rank-correlated with their judge-measured OI (rho = -0.60, p = 0.044; exploratory, wide bootstrap CI [-0.90, +0.06], n = 12). The models that report the least over-inference tend to be flagged as fabricating the most, so self-reported confidence is a misleading signal for comparing models, even though within a single model self-audit still ranks that model's own claims moderately well (AUROC 0.58--0.83). We further show that OI is task-dependent (27%--59%) and that, in a multi-turn pilot, inferred attributes accumulate approximately linearly with little revision. MirageBench positions external verification, rather than model self-report, as a more reliable foundation for trustworthy personalization.", 'score': 36, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '7117bc9459e997be', 'authors': ['Yushi Sun', 'Yanjie Zhang', 'Rui Sheng'], 'affiliations': ['LIGHTSPEED', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.04570.jpg', 'data': {'categories': ['#hallucinations', '#interpretability', '#alignment'], 'emoji': '🪞', 'ru': {'title': 'Когда модели видят в пользователях то, чего там нет', 'desc': 'В работе изучается проблема сверх-выведения (over-inference), когда языковые модели с персонализацией придумывают атрибуты пользователей, не опираясь на реальные доказательства. Авторы создали MirageBench — бенчмарк с 150 персонажами и 6 задачами персонализации для оценки верности моделей пользователя, протестировав 12 моделей на 143616 утверждениях. Исследование показало, что все модели в среднем неправильно выводят 41.6% утверждений о пользователях, и обнаружен парадоксальный эффект: модели, которые сами считают себя менее склонными к сверх-выведению, на самом деле это делают больше всего. Вывод: внешняя верификация надежнее самооценки моделей для обеспечения честной персонализации.'}, 'en': {'title': 'Unmasking Over-Inference in Personalized LLMs', 'desc': 'This paper investigates the issue of over-inference (OI) in personalized large language models (LLMs), where models create user attributes that are not supported by evidence. The authors introduce MirageBench, a benchmark that includes diverse personas and various tasks to evaluate the faithfulness of model outputs. Their findings reveal that all tested models exhibit significant over-inference, with a mean rate of 41.6%, and highlight a concerning trend where models that claim to have less OI actually fabricate more attributes. The study emphasizes the need for external verification methods over self-reported metrics to ensure trustworthy personalization in LLMs.'}, 'zh': {'title': '个性化模型的可信度：超越自我报告', 'desc': '本文研究了个性化大型语言模型（LLMs）在用户模型的可信度方面存在的问题，特别是过度推断现象（OI）。我们提出了MirageBench，这是一个包含150个不同角色的基准测试，涵盖了多种个性化任务和一个四类可信度分类法。研究发现，所有评估的12个模型都存在35%到49%的过度推断，且模型自我评估的过度推断与实际测量结果呈负相关。我们建议使用外部验证而非模型自我报告作为建立可信个性化的基础。'}}}, {'id': 'https://huggingface.co/papers/2608.05013', 'title': 'OneDayAgent: Towards a Long-Horizon Harness for Autonomous Agents', 'url': 'https://huggingface.co/papers/2608.05013', 'abstract': 'Abstract  LLM agents are increasingly applied to open-ended everyday requests that span work, study, and life. These tasks are long-horizon, cross-environment, and multimodal, forcing the agent to preserve goals and constraints across many steps while navigating heterogeneous tools and attachments. While prior work has addressed individual failure modes such as goals drift, states loss, and context overflow, whether a single harness can manage them jointly and remain effective across backends has received less study. We present OneDayAgent, a long-horizon harness for autonomous agents. OneDayAgent turns an open-ended request into a managed execution process that decomposes tasks into bounded subtasks, maintains execution memory under context pressure, and verifies and repairs the final deliverable. We evaluate OneDayAgent on AgentIF-OneDay across 104 tasks. With the GLM-5.2 backend, OneDayAgent sets a new state of the art with an overall score of 0.821. The same harness runs across five backend LLMs from three model families, indicating the harness generalizes across backends without tuning, even as different models induce distinct execution styles under the same workflow.', 'score': 25, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '6c81e90b0b0468b3', 'authors': ['Jingsheng Zheng', 'Xinyuan Fang', 'Jintian Zhang', 'Zhengke Gui', 'Huajun Chen', 'Ningyu Zhang'], 'affiliations': ['Ant Group', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05013.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Универсальная архитектура для долгосрочного выполнения сложных многошаговых задач агентами', 'desc': 'В статье представлен OneDayAgent — универсальная система управления для автономных агентов на основе больших языковых моделей, которая решает проблемы долгосрочного выполнения задач, включая дрейф целей, потерю состояния и переполнение контекста. Система декомпозирует открытые запросы пользователя на ограниченные подзадачи, поддерживает память о выполнении под давлением ограничений контекста и проверяет корректность конечного результата с возможностью автоматического исправления. OneDayAgent достигает новых результатов на бенчмарке AgentIF-OneDay с 104 задачами, получив оценку 0.821 при использовании модели GLM-5.2. Система демонстрирует высокую универсальность, работая на пяти различных LLM-бэкэндах без дополнительной настройки параметров.'}, 'en': {'title': 'OneDayAgent: Mastering Long-Horizon Tasks with LLMs', 'desc': 'This paper introduces OneDayAgent, a framework designed to enhance the performance of large language model (LLM) agents in handling complex, long-term tasks. It addresses common challenges such as goal drift and context overflow by breaking down open-ended requests into manageable subtasks while maintaining execution memory. OneDayAgent is evaluated on a diverse set of tasks and demonstrates superior performance, achieving a new state of the art score with the GLM-5.2 backend. Importantly, this harness is versatile, functioning effectively across multiple LLM backends without requiring specific adjustments for each model.'}, 'zh': {'title': 'OneDayAgent：跨环境的自主代理管理框架', 'desc': '本论文介绍了OneDayAgent，这是一种用于自主代理的长时间执行框架。它能够将开放式请求转化为管理的执行过程，将任务分解为有限的子任务，并在上下文压力下保持执行记忆。OneDayAgent在104个任务上进行了评估，使用GLM-5.2后端时，达到了0.821的整体得分，创造了新的技术标准。该框架可以在五个不同的后端LLM上运行，表明它在不同模型之间具有良好的通用性。'}}}, {'id': 'https://huggingface.co/papers/2608.03764', 'title': 'GDPevo: Evaluating Agent Self-Evolution on Real Business Tasks', 'url': 'https://huggingface.co/papers/2608.03764', 'abstract': "Abstract  Agent self-evolution updates an agent's persistent state from prior experience and reuses it to solve related tasks more effectively. Evaluating self-evolution is difficult: existing benchmarks provide limited coverage of economically valuable task domains, do not always design training and test tasks such that test-time gains can be attributed to training experience, and remain vulnerable to data contamination. We present GDPevo, an evolution-native benchmark grounded in GDP-related enterprise workflows, together with the fully automated data pipeline that generates it. Its core mechanism, rule hybridization, decomposes each enterprise workflow into atomic business rules, distributes subsets of these rules across training tasks, and recombines them in held-out test tasks so that test-time gains are attributable. GDPevo spans CRM, ERP, finance, healthcare, legal, and data-centric workflows. Its V1 release contains 120 tasks in 12 groups, with five training and five held-out test tasks per group. Full automation enables the pipeline to expand the suite to 240 tasks in 24 groups (V2) within two days, providing a practical response to contamination. Using GDPevo, we evaluate four agents, each comprising a harness and a model, under four supervision types. Self-evolution consistently improves held-out accuracy by up to 16.44 percentage points. But the best evolved agents remain far below the fully informed oracle ceiling of 91.6%, indicating that the self-evolution ability of current agents remains far from fully realized. We publicly release the pipeline, benchmark, and full evaluation results at https://github.com/Prism-Shadow/GDPevo.", 'score': 21, 'issue_id': 2862, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'af56961fe91d85ca', 'authors': ['Leijun Zhou', 'Zhihao Liu', 'Xiang Qu', 'Chenxu Liu', 'Yifei Liu', 'Yanke Yu', 'Jingzhe Xu', 'Xuejun Wu', 'Buyue Qian', 'Xi Chen', 'Yaowei Zheng', 'Junhao Hu'], 'affiliations': ['New York University', 'PrismShadow'], 'pdf_title_img': 'assets/pdf/title_img/2608.03764.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Измерение и развитие способности агентов к самоэволюции на корпоративных задачах', 'desc': 'В работе предложен GDPevo — бенчмарк для оценки способности агентов к самоэволюции, то есть обновлению своего состояния на основе опыта из предыдущих задач для более эффективного решения связанных задач. Основной механизм бенчмарка — гибридизация правил, которая разбивает корпоративные рабочие процессы на атомарные бизнес-правила и перекомбинирует их в тестовых задачах так, чтобы прогресс можно было полностью приписать обучению. Бенчмарк охватывает 120 задач из различных областей (CRM, ERP, финансы, здравоохранение) с автоматизированной генерацией данных, защищающей от контаминации. Эксперименты показывают, что самоэволюция улучшает точность на тестовых задачах до 16.44 процентных пункта, однако текущие агенты остаются значительно ниже оракула, указывая на большой потенциал для развития этой способности.'}, 'en': {'title': 'Unlocking Agent Potential with GDPevo Benchmark', 'desc': 'This paper introduces GDPevo, a benchmark designed to evaluate agent self-evolution in various enterprise workflows. It addresses the challenges of existing benchmarks by ensuring that training and test tasks are structured to allow for clear attribution of performance gains to prior experience. The benchmark utilizes a method called rule hybridization, which breaks down workflows into basic business rules and recombines them for testing. Results show that self-evolution can significantly enhance accuracy, but current agents still fall short of optimal performance levels.'}, 'zh': {'title': '自我进化：智能体的未来之路', 'desc': '本文介绍了一种名为GDPevo的自我进化基准，旨在评估智能体在经济任务中的自我进化能力。GDPevo通过将企业工作流程分解为基本业务规则，并在训练任务和测试任务中重新组合这些规则，从而确保测试时的性能提升可以归因于训练经验。该基准涵盖了客户关系管理、企业资源计划、金融、医疗、法律和数据驱动的工作流程，提供了120个任务，未来可扩展到240个任务。实验结果表明，自我进化能够显著提高智能体的准确性，但当前智能体的自我进化能力仍有待提升。'}}}, {'id': 'https://huggingface.co/papers/2608.05139', 'title': 'Toward Skill-Native LLMs: Skill Entropy for Benchmarking and Training Long-Horizon Reasoning', 'url': 'https://huggingface.co/papers/2608.05139', 'abstract': 'Abstract  Long-horizon reasoning in recent LLMs demands that the model switch between distinct skills inside a reasoning chain, such as first doing a math derivation, then using the result to plan a schedule. We call such problems cross-skill long-horizon tasks: multi-step tasks whose steps require different reasoning skills and depend on earlier outputs. Existing benchmarks often evaluate individual skills, lacking a principled way to measure how well a model switches between skills. We address this gap from both the evaluation and training sides. We introduce Skill Entropy, a measure of the difficulty of switching from one skill to another. We then propose Skill^2-Bench, a benchmark of cross-skill long-horizon tasks built over 558 skills across 9 verifiable and open-ended domains. Each task is assigned a task-level skill-entropy score and grouped into three difficulty levels. Evaluating 8 frontier and 4 open-source models on Skill^2-Bench reveals a skill-switching gap: accuracy decreases on higher-entropy tasks. We then turn skill entropy from a benchmark scale into a training signal. We propose Skill-Entropy RL, an RL framework where the model predicts not only the answer at each step but also the skill used to produce it. The reward combines step-level correctness with a skill-entropy reward that measures the alignment between the model-predicted skill sequence and the gold skill sequence. On Qwen3-4B-Instruct and Qwen3-1.7B, Skill-Entropy RL improves the Skill^2-Bench score from 34.4% to 68.4% and from 14.6% to 40.1%, respectively, outperforming competitive baselines. The same pipeline can be applied to off-the-shelf training data such as OpenR1-Math, indicating that skill entropy is a reusable training signal. Code available at: https://github.com/Gen-Verse/Skill-Entropy-RL', 'score': 19, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'bf27cad3fe91d2cf', 'authors': ['Yinghui He', 'Ling Yang', 'Jiarui Liu', 'Yongjin Yang', 'Lechen Zhang', 'Yingcheng Wu', 'Zhenfei Yin', 'Mengdi Wang', 'Sanjeev Arora'], 'affiliations': ['Carnegie Mellon University', 'Princeton University', 'Stanford University', 'University of Illinois Urbana-Champaign', 'University of Oxford', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2608.05139.jpg', 'data': {'categories': ['#training', '#benchmark', '#reasoning', '#open_source', '#small_models', '#optimization', '#rl'], 'emoji': '🔄', 'ru': {'title': 'Овладение искусством переключения между навыками в долгосрочных рассуждениях', 'desc': 'Статья посвящена проблеме переключения между различными навыками рассуждения в больших языковых моделях при решении многошаговых задач. Авторы предлагают метрику Skill Entropy для оценки сложности переключения между навыками и создают бенчмарк Skill²-Bench с 558 навыками и задачами различной сложности. Они показывают, что существующие модели хуже справляются с задачами высокой энтропии навыков. Для улучшения результатов авторы предлагают Skill-Entropy RL — метод обучения с подкреплением, который использует энтропию навыков как сигнал обучения, достигая значительного прироста производительности на различных моделях.'}, 'en': {'title': 'Mastering Skill Switching for Long-Horizon Reasoning', 'desc': 'This paper addresses the challenge of long-horizon reasoning in large language models (LLMs) that require switching between different reasoning skills. It introduces the concept of Skill Entropy, which quantifies the difficulty of transitioning from one skill to another in multi-step tasks. The authors present Skill^2-Bench, a benchmark that evaluates models on cross-skill long-horizon tasks across various domains, highlighting a performance gap in skill-switching. They propose a reinforcement learning framework, Skill-Entropy RL, that enhances model training by incorporating skill predictions alongside task answers, significantly improving performance on the benchmark.'}, 'zh': {'title': '提升模型技能切换能力的创新方法', 'desc': '本文探讨了长时间推理任务中模型在不同技能之间切换的能力。这类任务被称为跨技能长时间任务，涉及多个步骤，每个步骤需要不同的推理技能，并依赖于之前的输出。我们提出了技能熵这一概念，用于衡量从一种技能切换到另一种技能的难度，并建立了Skill^2-Bench基准，涵盖558种技能和9个领域。通过在Skill^2-Bench上评估模型，我们发现技能切换的准确性在高熵任务中下降，并提出了Skill-Entropy RL框架来改善这一问题。'}}}, {'id': 'https://huggingface.co/papers/2608.03632', 'title': 'When Teachers Mislead: Spurious-Signal-Aware On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.03632', 'abstract': 'Abstract  On-Policy distillation (OPD) transfers teacher capabilities by supervising student-sampled trajectories with dense token-level teacher signals. Recent selective OPD methods improve this process by prioritizing signals that are confident, informative, or learnable. However, the assumptions overlook a fundamental failure mode of language models: their token-level judgments can be driven by input-agnostic language priors, formatting conventions, or stereotyped reasoning templates rather than task-specific evidence. We refer to such optimization-relevant but weakly input-grounded supervision as spurious signals in OPD, which may produce large gradients while contributing little task-improving direction. To mitigate this issue, we propose SA-OPD, a Spurious-Signal-Aware On-Policy Distillation framework that identifies and filters misleading token-level supervision based on input-groundedness and optimization impact. SA-OPD introduces a lightweight input-groundedness proxy estimating whether a token-level distillation signal truly depends on the input. It then filters only tokens that simultaneously exhibit low input-groundedness and extreme distillation divergence, thereby removing high-impact spurious updates and achieving fine-grained OPD optimization. Extensive experiments on both large language model (LLM) and vision-language model (VLM) settings demonstrate that SA-OPD consistently outperforms Vanilla OPD and competitive selective methods. These results establish input-groundedness as a key dimension for OPD supervision selection and offer a simple, effective strategy for mitigating spurious updates.', 'score': 18, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'b8aab3a8b6421974', 'authors': ['Yinuo Jiang', 'Yongjie Ye', 'Zhou Tao', 'Xiang Zhuang', 'Qiang Zhang', 'Huajun Chen', 'Tiankai Li'], 'affiliations': ['ByteDance', 'Shanghai Artificial Intelligence Laboratory', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03632.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Фильтрация ложных сигналов при дистилляции языковых моделей через анализ зависимости от входных данных', 'desc': 'В статье предложен метод SA-OPD для улучшения дистилляции больших языковых моделей, который решает проблему ложных сигналов обучения. Авторы показывают, что токен-уровневые сигналы от учителя часто основаны на языковых приорах и стереотипах, а не на информации из входных данных, что приводит к неправильным градиентам. Предложенный метод использует лёгкий прокси для оценки того, насколько сильно сигнал зависит от входных данных, и фильтрует токены с низкой привязкой к входу и экстремальной дивергенцией. Эксперименты на LLM и видео-языковых моделях показывают, что SA-OPD последовательно превосходит базовые методы дистилляции.'}, 'en': {'title': 'Enhancing Knowledge Transfer by Filtering Spurious Signals in Distillation', 'desc': 'This paper introduces a new method called SA-OPD, which stands for Spurious-Signal-Aware On-Policy Distillation. The method aims to improve the process of transferring knowledge from a teacher model to a student model by filtering out misleading signals that do not depend on the input data. These misleading signals, referred to as spurious signals, can lead to ineffective learning and large gradients that do not help the model improve. By focusing on input-groundedness, SA-OPD enhances the quality of the distillation process, leading to better performance in both language and vision-language tasks.'}, 'zh': {'title': '优化政策蒸馏，过滤无关信号', 'desc': '本文提出了一种新的方法，称为SA-OPD（Spurious-Signal-Aware On-Policy Distillation），旨在改进在政策蒸馏中使用的信号选择。传统的选择性政策蒸馏方法可能会受到无关信号的影响，这些信号并不基于具体任务的证据。SA-OPD通过识别和过滤这些误导性的标记级监督信号，来提高蒸馏的效果。实验结果表明，SA-OPD在大型语言模型和视觉语言模型的设置中，表现优于传统的政策蒸馏方法。'}}}, {'id': 'https://huggingface.co/papers/2608.02580', 'title': 'Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data', 'url': 'https://huggingface.co/papers/2608.02580', 'abstract': 'Abstract  Learning generalizable robot manipulation policies requires large-scale and diverse demonstration data. Egocentric human manipulation videos offer rich scene and task diversity, and prior work has shown that retargeting and rendering such videos into robot-format data can yield effective per-task policies at small scale. However, whether this approach can provide pretraining benefits for vision-language-action models at scale remains unexplored. We present Ego2Robot, a scalable pipeline that converts egocentric human manipulation videos into robot training data through action retargeting, robot-arm visual synthesis, and multi-level quality curation. Ego2Robot supports both curated datasets and in-the-wild videos, producing 18,561 hours of robot training data spanning 15 robot morphologies, making it the largest ego-to-robot dataset to date. To evaluate generalization, we extend RoboTwin2.0 with disentangled perturbation axes covering visual appearance, scene layout, embodiment morphology, and task semantics. Experiments show that joint pretraining on Ego2Robot-synthesized and robot data consistently improves out-of-distribution generalization across multiple perturbation types, with benefits validated on real-robot deployment. Project page: https://www-ye.github.io/ego2robot_blog/', 'score': 16, 'issue_id': 2861, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '8a653ef5e0706a09', 'authors': ['Ye Wang', 'Pei Lin', 'Xiong-Hui Chen', 'Haoqi Yuan', 'Zhixuan Liang', 'Yiyang Huang', 'Anzhe Chen', 'Zixing Lei', 'Jie Zhang', 'Tao Zhang', 'Haoyang Li', 'Tong Zhang', 'Chenxi Xiao', 'Ziyuan Jiao', 'Qin Jin'], 'affiliations': ['AIM3 Lab, Renmin University of China', 'Beijing Institute for General Artificial Intelligence (BIGAI)', 'Beijing University of Aeronautics and Astronautics', 'Qwen Team, Alibaba Inc.', 'ShanghaiTech University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02580.jpg', 'data': {'categories': ['#training', '#multimodal', '#dataset', '#data', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'От человеческого взгляда к роботизированному действию: масштабируемое обучение манипуляций', 'desc': 'В статье представлена система Ego2Robot для преобразования видео манипуляций от первого лица в обучающие данные для робототехники через переназначение действий и синтез визуальных данных. Авторы создали самый большой датасет на сегодняшний день, содержащий 18,561 часов видео для 15 различных морфологий роботов, поддерживающий как отобранные датасеты, так и видео из Интернета. Для оценки обобщаемости была расширена модель RoboTwin2.0 с помощью дезинтегрированных осей возмущений, охватывающих визуальное отображение, расположение объектов, морфологию робота и семантику задач. Эксперименты показывают, что совместное предварительное обучение на синтезированных данных Ego2Robot и реальных робототехнических данных последовательно улучшает внеобучающую обобщаемость модели, что подтверждается при развёртывании на реальных роботах.'}, 'en': {'title': 'Transforming Human Actions into Robot Learning Data', 'desc': 'This paper introduces Ego2Robot, a method for transforming egocentric human manipulation videos into training data for robots. The approach involves action retargeting and visual synthesis to create a large dataset that includes diverse robot morphologies and manipulation tasks. By using this extensive dataset, the authors demonstrate improved generalization capabilities for vision-language-action models when tested on various perturbations. The results indicate that pretraining with Ego2Robot data enhances the performance of robots in real-world scenarios, making it a significant advancement in robot learning.'}, 'zh': {'title': '将人类操作视频转化为机器人训练数据的创新方法', 'desc': '本论文提出了一种名为Ego2Robot的可扩展管道，旨在将第一人称人类操作视频转换为机器人训练数据。该方法通过动作重定向、机器人臂视觉合成和多层次质量筛选，生成了18561小时的机器人训练数据，涵盖15种机器人形态。研究表明，联合预训练Ego2Robot合成数据和机器人数据可以显著提高模型在不同扰动类型下的泛化能力。该数据集是迄今为止最大的第一人称到机器人数据集，支持多种数据来源。'}}}, {'id': 'https://huggingface.co/papers/2608.04397', 'title': 'NOLLI: A Difficulty-Calibrated Puzzle Benchmark for Diagnosing the English-Korean Performance Gap', 'url': 'https://huggingface.co/papers/2608.04397', 'abstract': 'Abstract  We introduce NOLLI, a procedurally generated English-Korean puzzle benchmark designed to diagnose where Korean performance gaps arise. It comprises 15 puzzle types (25 tasks; 7,500 items), with every instance seed-regenerable, verified to have a unique solution, and scored deterministically. Rather than equating harder with bigger, we calibrate difficulty behaviorally, tuning each generator until a fixed reference model lands in target accuracy bands. Its three-level design combines matched direct translations, script adaptations over Hangul jamo (sub-syllabic letters), and Korean-only tasks grounded in Korean culture or orthography. We evaluate 15 frontier, open-weight, and Korean-developed models; among the 12 above a 3% overall-accuracy floor, matched English-Korean accuracy is statistically equivalent within a +/- 10 pp margin (TOST), suggesting little cost from presentation language alone. Writing-system-intensive tasks show sharper gaps: Korean Cipher falls behind English by up to 68.7 pp, whereas Cryptarithmetic over the same jamo shows no systematic penalty, and Jamo Composition accuracy predicts Korean Cipher accuracy. These contrasts are diagnostic rather than causal, consistent with difficulty in multi-step sub-syllabic execution. Korean-only tasks separate rule-application deficits, which vary in sign, from a Kinship deficit positive in all 12. Finally, a salient size measure fails to grow from Easy to Hard in 7 of 15 types, making structural size an unreliable proxy for empirical difficulty.', 'score': 15, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '3614e87bb11be9b0', 'authors': ['Dasol Choi', 'Joonyong Park', 'Daegon Yu', 'Soo Yong Kim', 'Youngsook Song', 'Seunghyeok Hong'], 'affiliations': ['AIM Intelligence', 'HAERAE LAB', 'Hankuk University of Foreign Studies', 'KT Corp.', 'Lablup Inc.', 'Sionic AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.04397.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#multilingual'], 'emoji': '🧩', 'ru': {'title': 'Диагностика языковых способностей AI через головоломки с учётом особенностей письменности', 'desc': 'Авторы представляют NOLLI — процедурно генерируемый бенчмарк с головоломками на английском и корейском языках для диагностики причин различий в производительности моделей. Бенчмарк содержит 15 типов задач с 7500 элементами, где сложность калибруется поведенчески — генераторы настраиваются так, чтобы эталонная модель достигала целевых уровней точности. Трёхуровневый дизайн включает прямые переводы, адаптации для корейского письма (графемы Хангыля) и задачи, специфичные для корейской культуры и орфографии. Исследование показывает, что при контролируемом сравнении языков презентации большие LLM-модели показывают примерно одинаковую точность на английском и корейском, но задачи, интенсивные по системе письма, выявляют существенные дефициты — до 68,7 процентных пункта в корейском шифре.'}, 'en': {'title': 'NOLLI: Bridging English-Korean Language Gaps Through Puzzle Benchmarking', 'desc': 'The paper presents NOLLI, a benchmark for evaluating English-Korean language processing through a series of procedurally generated puzzles. It includes 15 types of puzzles with 7,500 unique tasks designed to assess performance gaps in Korean language models. The difficulty of the tasks is calibrated behaviorally rather than by size, ensuring that models are tested against a consistent accuracy standard. The findings reveal that while overall accuracy is similar between English and Korean tasks, specific writing-system-intensive tasks show significant performance disparities, highlighting the complexities of multi-step language processing.'}, 'zh': {'title': 'NOLLI：揭示韩语学习中的难点', 'desc': '本文介绍了NOLLI，这是一个程序生成的英韩拼图基准，旨在诊断韩语表现差距的来源。它包含15种拼图类型（25个任务；7500个项目），每个实例都可以重新生成种子，确保有唯一解并且得分是确定的。我们通过行为校准来调整难度，而不是简单地将更大等同于更难，确保每个生成器的输出在目标准确度范围内。研究表明，韩语特有的任务在多步骤执行中存在明显的表现差距，尤其是在书写系统密集的任务中。'}}}, {'id': 'https://huggingface.co/papers/2607.24821', 'title': 'AVE-Compass: Towards Holistic Evaluation for Audio-Video Editing Abilities', 'url': 'https://huggingface.co/papers/2607.24821', 'abstract': 'Abstract  While instruction-based video editing has advanced rapidly, real-world videos contain tightly coupled audio and visual signals, and editing one modality often requires coordinated changes in the other. Existing benchmarks primarily evaluate visual transformations on silent clips or isolated audio editing, leaving complex audio-visual editing and cross-modal consistency underexplored. We introduce AVE-Compass, a comprehensive benchmark with 145 curated source videos, 196 audio-visually coupled editing instructions, and 2,688 fine-grained checklist items. It evaluates Instruction Following, Fidelity Preserving, Realism, and Editing Intent through checklist-based MLLM judging and a dedicated realism rubric, complemented by automated cross-modal, video, and audio metrics. Extensive evaluation shows that state-of-the-art models still struggle to execute cross-modal instructions while preserving non-target content. We further propose AVE-Agent, a modular agent framework that decomposes complex instructions into dependent subtasks and iteratively improves editing results through self-reflection and evaluator feedback. AVE-Agent improves instruction execution, Fidelity Preserving, and audio-visual alignment in joint editing while maintaining competitive perceptual quality.', 'score': 15, 'issue_id': 2862, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'b8a6dfc35fc6f6a0', 'authors': ['Yuqing Wen', 'Yukai Huang', 'Qianqian Xie', 'Jiangtao Wu', 'Yibin Lin', 'Yikai Gu', 'Jialu Chen', 'Yuanxing Zhang', 'Jiaheng Liu'], 'affiliations': ['Nanjing University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.24821.jpg', 'data': {'categories': ['#video', '#agents', '#dataset', '#audio', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Кросс-модальное редактирование видео через декомпозицию задач и саморефлексию', 'desc': 'В статье представлен бенчмарк AVE-Compass для оценки редактирования видео с учетом согласованности аудио и визуального контента, содержащий 145 исходных видео и 196 инструкций по редактированию. Предложенный бенчмарк использует мультимодальные метрики оценки, включая проверку следования инструкциям, сохранение верности, реалистичность и выравнивание модальностей через MLLM-судейство. Авторы показывают, что современные модели плохо справляются с кросс-модальными задачами редактирования при сохранении неизменяемого контента. Для решения этой проблемы предложена система AVE-Agent, которая разлагает сложные инструкции на подзадачи и итеративно улучшает результаты через самоанализ и обратную связь от оценивателя.'}, 'en': {'title': 'Enhancing Audio-Visual Editing with AVE-Compass and AVE-Agent', 'desc': 'This paper addresses the challenges of editing videos that involve both audio and visual elements, which are often tightly linked. The authors introduce AVE-Compass, a new benchmark designed to evaluate how well models can follow editing instructions while maintaining consistency between audio and visual components. They also present AVE-Agent, a framework that breaks down complex editing tasks into smaller subtasks, allowing for iterative improvements based on feedback. The results show that current models struggle with cross-modal editing, but AVE-Agent enhances performance in executing instructions and preserving the integrity of the original content.'}, 'zh': {'title': '音视频编辑的新标准与智能代理', 'desc': '本论文介绍了AVE-Compass，这是一个全面的基准测试，旨在评估音视频编辑中的跨模态一致性。现有的基准主要关注静音视频的视觉变换，未能充分探讨复杂的音视频编辑。我们提出的AVE-Agent是一个模块化的代理框架，可以将复杂的编辑指令分解为依赖的子任务，并通过自我反思和评估反馈来逐步改善编辑结果。实验结果表明，AVE-Agent在执行指令、保持内容一致性和音视频对齐方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.04574', 'title': 'When Memory Lies: An Empirical Study of Spatial Memory Staleness in VLM Agents', 'url': 'https://huggingface.co/papers/2608.04574', 'abstract': 'Abstract  Memory-augmented VLM agents act on persistent spatial knowledge, yet that knowledge silently goes stale as the environment changes. We ask what happens when an agent must reconcile a confident memory claim with a contradicting observation, and whether current models can catch the conflict before it becomes a safety-relevant mistake. Using a dynamic FrozenLake testbed, we pair a staleness-detection task with a downstream navigation task across three closed-source models and three open-weight VLMs under both text and image inputs (1,800 detection runs, and 12,000 text-mode navigation episodes over four LLM navigators at a shared 50-seed scale). Three findings emerge. First, text solvability does not imply visual grounding: models that flag stale entries reliably from text nonetheless span vision F1 from 0.887 down to 0.067 on the identical grids, and the weakest keeps making fluent, confident decisions that ignore the image. Second, consuming stale memory without an audit is a safety liability: in our primary GPT-4o setting, an agent that trusts raw memory dies more than twice as often as the same agent given no memory at all. Third, auditing helps but does not close the gap: a transparent read-time filter removes much of the safety cost in text mode, yet even oracle stale labels bring no further significant gain on the current grid size, and when visual auditing is unreliable, filtering yields no consistent benefit. Together these results frame spatial-memory staleness as a safety failure mode and isolate reliable visual grounding and action selection under memory--observation conflict as the central open challenges for memory-augmented agents.', 'score': 12, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '2613c8950181f3f2', 'authors': ['Yushi Sun', 'Yanjie Zhang'], 'affiliations': ['LIGHTSPEED, Shenzhen, China', 'The Hong Kong University of Science and Technology, Hong Kong, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.04574.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#security', '#interpretability', '#agents', '#alignment'], 'emoji': '⚠️', 'ru': {'title': 'Опасность устаревшей памяти: когда агенты не видят изменения в мире', 'desc': 'В этой работе исследуется проблема устаревания пространственной памяти в агентах на основе мультимодальных больших языковых моделей. Авторы создали тестовую среду, где агент должен обнаружить конфликт между уверенным утверждением из памяти и противоречащим наблюдением из окружающей среды. Результаты показывают, что модели, успешно решающие эту задачу на текстовых входах, часто не справляются с визуальной интерпретацией, доверяя устаревшей памяти даже при наличии противоречивых изображений. Исследование демонстрирует, что аудит памяти улучшает безопасность, но полностью не решает проблему конфликта между памятью и визуальными наблюдениями.'}, 'en': {'title': 'Navigating Memory Conflicts: Ensuring Safety in VLMs', 'desc': 'This paper investigates how memory-augmented visual language models (VLMs) handle outdated spatial knowledge when navigating environments. It reveals that models can confidently recall stale information, leading to unsafe decisions, especially when visual inputs are involved. The study shows that while auditing memory can improve safety, it does not completely eliminate risks, particularly when visual grounding is unreliable. The findings highlight the need for better mechanisms to reconcile memory and real-time observations to enhance the safety of memory-augmented agents.'}, 'zh': {'title': '空间记忆过时是安全隐患', 'desc': '这篇论文探讨了增强记忆的视觉语言模型（VLM）代理在环境变化时如何处理过时的空间知识。当代理必须调和自信的记忆声明与相矛盾的观察时，当前模型能否在错误发生前识别出这种冲突是一个关键问题。研究发现，文本可解性并不意味着视觉基础的可靠性，且在没有审计的情况下使用过时的记忆会带来安全隐患。最后，虽然审计可以改善情况，但在视觉审计不可靠时，过滤并未带来一致的好处。'}}}, {'id': 'https://huggingface.co/papers/2608.05070', 'title': 'HelloWorld: Enabling Socially Interactive Characters in Video World Models', 'url': 'https://huggingface.co/papers/2608.05070', 'abstract': "Abstract  Despite the remarkable recent progress of video world models, social interaction between users and the characters within these worlds remains unsupported. To fill this gap, we present HelloWorld, a video world model that enables social interaction with in-world characters. With a single button press, users can prompt the on-screen character to respond toward the camera, e.g., turning to the viewer, waving, nodding, or speaking a short greeting. To make these interactions natural, we propose a self-distillation pipeline that finetunes the video generation model on data synthesized by itself. Each synthesized clip contains both social interactions and camera motion, allowing the model to learn camera-pose conditioning without degrading interaction quality. At inference, we further introduce a training-free module that determines when the interaction occurs. Upon a button press, it modulates the cross-attention masks of the DiT so that the interaction-related text prompt attends only to the frames within the press window, temporally localizing the character's response. We further build HelloWorldBench, a 400-sample benchmark with three social interaction metrics alongside three conventional metrics, for evaluation. Experiments demonstrate that HelloWorld surpasses a variety of baselines in interaction quality, while maintaining state-of-the-art picture aesthetics and camera-pose following. Project page: https://github.com/AlayaLab/HelloWorld", 'score': 10, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '051503899f9884c3', 'authors': ['Liangyang Ouyang', 'Ruicong Liu', 'Xuangeng Chu', 'Kaipeng Zhang', 'Yoichi Sato'], 'affiliations': ['Alaya Lab', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.05070.jpg', 'data': {'categories': ['#training', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Социальное взаимодействие в видео-моделях мира через самодистилляцию', 'desc': 'Авторы представляют HelloWorld — видео-модель мира, которая позволяет пользователям взаимодействовать с персонажами в синтетических сценах. Система использует конвейер самодистилляции, где модель генерации видео дообучается на данных, синтезированных ею самой, что позволяет одновременно обучиться социальному взаимодействию и управлению движением камеры. На этапе инференса применяется тренируемый модуль, который контролирует кросс-внимание DiT трансформера, локализуя ответ персонажа во времени в соответствии с нажатием кнопки. Для оценки качества разработана специализированная бенчмарк с метриками социального взаимодействия и традиционными метриками генерации видео.'}, 'en': {'title': 'HelloWorld: Enabling Social Interactions in Video Worlds', 'desc': "This paper introduces HelloWorld, a video world model designed to facilitate social interactions between users and characters in video environments. It allows users to prompt characters to perform actions like waving or speaking with a simple button press. The model employs a self-distillation technique to improve its video generation capabilities by training on its own synthesized data, which includes both character interactions and camera movements. Additionally, a training-free module is implemented to accurately time the character's responses, enhancing the overall interaction experience while maintaining high visual quality."}, 'zh': {'title': 'HelloWorld：让虚拟角色与用户互动的未来', 'desc': '本论文介绍了HelloWorld，一个视频世界模型，旨在支持用户与虚拟角色之间的社交互动。用户只需按下一个按钮，角色就会做出回应，例如转向镜头、挥手或打招呼。为了使互动更加自然，研究者提出了一种自我蒸馏的流程，通过自我生成的数据对视频生成模型进行微调。实验结果表明，HelloWorld在互动质量上超越了多种基线，同时保持了卓越的图像美学和镜头姿态跟随能力。'}}}, {'id': 'https://huggingface.co/papers/2608.00782', 'title': 'Distill Where You Fail: Recovering Learning Signals of Negative RL-Groups from Adaptive Teacher Guidance', 'url': 'https://huggingface.co/papers/2608.00782', 'abstract': "Abstract  Reinforcement learning with verifiable rewards (RLVR) has become a standard paradigm for post-training large language models (LLMs). While Group Relative Policy Optimization (GRPO) is widely adopted, it suffers from sparse reward signals and loses gradients entirely when all responses within a group receive identical rewards. On-policy distillation (OPD) offers a natural remedy by providing dense, token-level supervision from a teacher model. However, naively combining GRPO with OPD leads to degraded performance, due to three underlying causes: not all samples benefit from distillation; fitting too quickly to the teacher undermines the exploratory capacity of RL; and OPD's advantages are asymmetric, suppressing most tokens. To address these challenges, we propose RSTG (Recovering Learning Signals via Adaptive Teacher Guidance), which applies distillation selectively and precisely where it matters most. At the sample level, OPD is restricted to negative zero-variance prompts with each sample weighted by the teacher's confidence score. At the token level, distillation targets only tokens with high student entropy or large teacher-student divergence. We further augment training with SFT on correct trajectories generated by the teacher model, injecting positive gradient signals where RL yields none. Experiments demonstrate that RSTG substantially outperforms naive GRPO+OPD by +4.02% on math and +3.05% on code.", 'score': 10, 'issue_id': 2861, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '7e4ed3ea81de81ea', 'authors': ['Zhuowen Han', 'Jinwei Xiao', 'Zhengxi Lu', 'Renren Jin', 'Zhiyuan Yao', 'Yuxi
