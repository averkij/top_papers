 costly external environments or simulators, EnvACE allows the agent to simulate its own environment responses based on its actions, creating a more efficient training process. The agent learns to internalize the relationship between its actions and the resulting responses, which improves its decision-making capabilities. The results show that EnvACE outperforms traditional methods and scales effectively across various benchmarks, demonstrating the potential of world rehearsal in agent training.'}, 'zh': {'title': '通过世界排练提升大型语言模型代理的训练效率', 'desc': '本文介绍了一种名为EnvACE的强化学习方法，用于训练大型语言模型代理进行长期工具使用。该方法通过世界排练替代了与外部环境的交互，代理在训练中交替进行行动和排练。代理首先生成工具调用，然后模拟环境以产生该行动的响应，并根据排练的响应调整后续决策。通过这种方式，代理能够内化行动与环境响应之间的关系，从而在决策中直接利用内部化的世界模型，显著提升了在多个基准测试中的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.06060', 'title': 'Learning from Failures: Retrieval-Centric CoT via Hard Negatives for Unified Multimodal Retrieval', 'url': 'https://huggingface.co/papers/2608.06060', 'abstract': 'Abstract  Unified multimodal retrieval aims to identify candidates that satisfy complex user intent expressed through heterogeneous inputs. Although Large Vision-Language Model (LVLM)-based retrievers are efficient and scalable, directly encoding raw multimodal inputs often misses fine-grained discriminative cues, leading to confusion among semantically similar candidates. Recent methods mitigate this limitation by generating Chain-of-Thought (CoT) rationales to enrich the query representation. However, such reasoning is typically derived from the query alone: it explains what the query describes, but not what the retriever misunderstands. We argue that effective retrieval reasoning should instead be conditioned on retrieval feedback. Based on this insight, we introduce UniME-R1, an embedder-adviser framework that learns to reason over initially retrieved candidates and generate Retrieval-Centric Chain-of-Thought (RC-CoT). The adviser analyzes candidates individually to identify the discriminative cues confused by the embedder. If the target appears in the initial top-k set, UniME-R1 directly reranks the candidates; otherwise, it generates RC-CoT to refine the retrieval direction and performs full-corpus re-retrieval with a dual-mode embedder. To train the framework, we mine hard negatives to simulate realistic retrieval failures, jointly optimize direct retrieval and RC-CoT-augmented retrieval, and align the adviser with retrieval outcomes through supervised learning and retrieval-oriented reinforcement learning. Extensive experiments on MMEB-V2 and a diverse set of general multimodal retrieval benchmarks demonstrate that UniME-R1 consistently improves retrieval performance over strong baselines.', 'score': 26, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'dae611bf98b93e5c', 'authors': ['Zelong Sun', 'Jun Wang', 'Kaicheng Yang', 'Tiancheng Gu', 'Ziyong Feng', 'Zhiwu Lu'], 'affiliations': ['Glint Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.06060.jpg', 'data': {'categories': ['#multimodal', '#rl', '#benchmark', '#rag', '#training'], 'emoji': '🔍', 'ru': {'title': 'Рассуждение, ориентированное на ошибки поиска, для улучшения мультимодального retrieval', 'desc': 'В работе предложен новый подход к мультимодальному поиску, использующий большие видео-языковые модели с механизмом рассуждения, обусловленным результатами поиска. Система состоит из двух компонентов: embedder извлекает начальные кандидаты, а adviser анализирует их и генерирует цепочку рассуждений, сфокусированную на ошибках поиска (RC-CoT). Если целевой объект найден в топ-k результатов, модель переранжирует кандидатов; иначе она уточняет направление поиска и проводит повторный поиск по полному корпусу. Модель обучается на сложных отрицательных примерах с использованием supervised learning и reinforcement learning, ориентированного на метрики поиска.'}, 'en': {'title': 'Enhancing Multimodal Retrieval with Feedback-Driven Reasoning', 'desc': 'This paper presents UniME-R1, a novel framework for unified multimodal retrieval that enhances the retrieval process by incorporating feedback from initially retrieved candidates. Unlike traditional methods that rely solely on the query for reasoning, UniME-R1 generates Retrieval-Centric Chain-of-Thought (RC-CoT) to address misunderstandings in candidate selection. The framework employs an adviser that analyzes candidates to identify and clarify discriminative cues, improving the accuracy of retrieval. Through extensive experiments, the authors demonstrate that UniME-R1 significantly outperforms existing retrieval methods, showcasing its effectiveness in handling complex user intents across multimodal inputs.'}, 'zh': {'title': '提升多模态检索的智能化思维', 'desc': '统一多模态检索旨在识别满足复杂用户意图的候选项，这些意图通过不同类型的输入表达。虽然基于大型视觉语言模型的检索器高效且可扩展，但直接编码原始多模态输入常常会遗漏细微的区分线索，导致语义相似的候选项之间产生混淆。为了解决这个问题，本文提出了UniME-R1框架，通过分析初步检索到的候选项，生成以检索为中心的思维链（RC-CoT），从而改善检索方向。实验结果表明，UniME-R1在多个多模态检索基准上显著提高了检索性能。'}}}, {'id': 'https://huggingface.co/papers/2608.05631', 'title': 'ChronoVision: Temporal Reasoning via Latent State Reconstruction', 'url': 'https://huggingface.co/papers/2608.05631', 'abstract': 'Abstract  Multimodal large language models excel at passive perception but struggle with complex visual cognitive tasks requiring multi-step temporal reasoning. This degradation largely stems from the inherent ambiguity of language-based reasoning, which often fails to accurately articulate continuous visual transformations. To address this, we propose ChronoVision, a multimodal framework designed to align visual logic with latent imagery. During supervised fine-tuning, a Reconstructive Visual Head predicts the latent representation of the final transformed state, while an ROI Attention Locating module focuses the model on key visual evidence via semantic span queries. In post-training, we apply reinforcement learning with an implicit process grounding mechanism, guided by a composite reward function that evaluates outcome correctness, latent process alignment, and unsupervised visual focus. Furthermore, we introduce Vbvr-VQA, a novel dataset that evaluates temporal tracking by reformulating video reasoning into a strict image-ordering task. Experiments demonstrate that ChronoVision achieves state-of-the-art performance on Vbvr-VQA with 74.8% in-domain and 71.6% out-of-domain accuracy, alongside a strong 55.0% accuracy on IntPhys2, a highly challenging cross-domain benchmark.', 'score': 24, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '4629d381d1088675', 'authors': ['Yifan Shen', 'Jian Xu', 'Boyi Li', 'Yuner Zhang', 'Tianjiao Yu', 'Bingxuan Li', 'Houze Yang', 'Rushi Wang', 'Xu Cao'], 'affiliations': ['PediaMed AI', 'University of Illinois Urbana-Champaign', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2608.05631.jpg', 'data': {'categories': ['#multimodal', '#video', '#alignment', '#benchmark', '#dataset', '#reasoning', '#rlhf'], 'emoji': '🎬', 'ru': {'title': 'Понимание временных преобразований в визуальном мышлении мультимодальных моделей', 'desc': 'В статье предложена ChronoVision — мультимодальная архитектура для улучшения способности больших языковых моделей решать сложные задачи визуального мышления с многошаговым временным рассуждением. Модель использует Reconstructive Visual Head для предсказания скрытых представлений трансформированных состояний и ROI Attention Locating для фокусировки на ключевых визуальных деталях через семантические span queries. Обучение дополняется reinforcement learning с неявным механизмом grounding процесса и композитной функцией награды, оценивающей корректность результата и согласованность скрытого процесса. Авторы представили новый датасет Vbvr-VQA для оценки временного отслеживания путём преобразования видео-рассуждений в задачу упорядочивания изображений.'}, 'en': {'title': 'ChronoVision: Bridging Visual Logic and Language for Enhanced Reasoning', 'desc': 'This paper introduces ChronoVision, a multimodal framework that enhances the ability of large language models to perform complex visual reasoning tasks. It addresses the limitations of language-based reasoning by aligning visual logic with latent imagery through a Reconstructive Visual Head and an ROI Attention Locating module. The model is fine-tuned using supervised learning and further improved with reinforcement learning, which incorporates a composite reward function to evaluate performance. The authors also present the Vbvr-VQA dataset, which tests temporal tracking by converting video reasoning into an image-ordering challenge, showing that ChronoVision achieves impressive accuracy on various benchmarks.'}, 'zh': {'title': 'ChronoVision：提升视觉推理的多模态框架', 'desc': '这篇论文提出了一种名为ChronoVision的多模态框架，旨在解决大型语言模型在复杂视觉认知任务中的不足。该框架通过重建视觉头和ROI注意力定位模块来对齐视觉逻辑与潜在图像，从而提高模型的推理能力。通过强化学习和复合奖励函数，ChronoVision能够更好地评估结果的正确性和潜在过程的对齐。实验结果表明，ChronoVision在新提出的Vbvr-VQA数据集上表现优异，达到了74.8%的领域内准确率。'}}}, {'id': 'https://huggingface.co/papers/2608.06020', 'title': 'From Economic Agents to Agentic Economies: A Systems Blueprint for Economic World Models', 'url': 'https://huggingface.co/papers/2608.06020', 'abstract': 'Abstract  Economic World Models (EWMs) are generative economic models that simulate how economies evolve from within by modeling heterogeneous agents, their beliefs and actions, and the market and institutional mechanisms through which their interactions produce aggregate outcomes. This paper develops an implementation roadmap for building economic world models as generative engines in which heterogeneous agents act, interact, adapt, and co-evolve with markets and institutions, thereby producing economic dynamics from the inside. We organize EWM systems into a six-level capability ladder, from fixed rule-based agent worlds to adaptive and LLM-based agent worlds, self-evolving agents, evolving institutional worlds, and sim-to-real economic twins aligned with real observations. A systematic literature survey across these levels reveals that existing work remains concentrated in lower-level agent and simulation environments, while systems with self-evolving agents, endogenous institutions, persistent empirical alignment, and validated economic mechanisms remain rare. By translating the EWM agenda into an implementation blueprint, this paper aims to accelerate the development of the next generation of economic simulation environments that can serve as high-fidelity sandboxes for human decision-makers and as training, planning, evaluation, and safety substrates for AI agents. We release a curated paper list and related resources to support future research.', 'score': 24, 'issue_id': 2870, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'c306ee69461f0add', 'authors': ['Jiale Han', 'Xiang Li', 'Jing Qian', 'Wenyuan Gu', 'Pin Gao', 'Ye Luo', 'Hongyuan Zha', 'Dacheng Tao', 'Benyou Wang', 'Lin William Cong'], 'affiliations': ['Nanyang Technological University', 'School of Data Science, The Chinese University of Hong Kong, Shenzhen', 'Shenzhen Loop Area Institute', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.06020.jpg', 'data': {'categories': [], 'emoji': '🌍', 'ru': {'title': 'От простых правил к живой экономике: архитектура эволюционирующих экономических миров', 'desc': 'В работе представлена дорожная карта для создания экономических мировых моделей — генеративных систем, которые моделируют экономики через взаимодействие гетерогенных агентов с их убеждениями, действиями и институциональными механизмами. Авторы предлагают иерархию из шести уровней возможностей: от агентов с фиксированными правилами до адаптивных агентов на базе LLM, саморазвивающихся агентов и эволюционирующих институтов. Исследование показывает, что текущие работы сосредоточены на нижних уровнях, тогда как системы с самоэволюционирующими агентами и стабильной эмпирической валидацией остаются редкими. Предложенный подход нацелен на создание высокоточных симуляционных сред для обучения и оценки AI-агентов, а также для поддержки принятия решений человеком.'}, 'en': {'title': 'Building the Future of Economic Simulations', 'desc': 'This paper introduces Economic World Models (EWMs), which are advanced simulations that mimic how economies function by focusing on diverse agents and their interactions. It outlines a structured approach to develop these models, categorized into six levels, ranging from simple rule-based systems to complex adaptive environments that evolve over time. The authors highlight that most current research is limited to basic simulation frameworks, with more sophisticated models being scarce. By providing a clear roadmap and resources, the paper aims to foster the creation of more realistic economic simulations for both human and AI decision-making.'}, 'zh': {'title': '构建经济世界模型的实施蓝图', 'desc': '经济世界模型（EWM）是一种生成性经济模型，通过模拟异质代理的信念和行为，以及市场和制度机制，来研究经济如何从内部演变。本文提出了构建经济世界模型的实施路线图，强调异质代理如何在市场和制度中行动、互动、适应和共同演化，从而产生经济动态。我们将EWM系统组织成六个层级，从固定规则的代理世界到自我演化的代理和与现实观察对齐的经济双胞胎。通过对现有文献的系统调查，发现大多数研究仍集中在较低层级的代理和模拟环境，而自我演化代理和内生制度的系统仍然稀缺。'}}}, {'id': 'https://huggingface.co/papers/2608.05802', 'title': 'On-Policy Delta Distillation for Multilingual Math Reasoning', 'url': 'https://huggingface.co/papers/2608.05802', 'abstract': 'Abstract  On-Policy Distillation (OPD) is emerging as a promising alternative to reinforcement learning for LLM post-training, yet its effectiveness in multilingual settings remains underexplored. We study OPD and its advanced variant, On-Policy Delta Distillation (OPD^2), for mathematical reasoning in English, Korean, and Japanese. OPD^2 improves OPD by using the probability gap between a post-trained teacher and its base model as the learning signal. Experiments with Qwen3 show that OPD^2 consistently outperforms the original OPD, with particularly strong improvements in Korean and Japanese, and generally narrows the English-Korean performance gap. We further find that English-only OPD can also increase performance for Korean and Japanese, but often shifts the responses toward English, highlighting the importance of multilingual data to preserving target-language responses.', 'score': 20, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'f2f88893497ccd7b', 'authors': ['Byeongho Heo', 'Jaehui Hwang', 'Sangdoo Yun', 'Dongyoon Han'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.05802.jpg', 'data': {'categories': ['#training', '#multilingual', '#math'], 'emoji': '🌍', 'ru': {'title': 'Дистилляция знаний для многоязычного математического рассуждения в LLM', 'desc': 'В статье исследуется метод On-Policy Distillation (OPD) и его улучшенный вариант OPD^2 для обучения больших языковых моделей на задачах математического рассуждения на английском, корейском и японском языках. OPD^2 превосходит стандартный OPD благодаря использованию вероятностного зазора между обученной учительской моделью и её базовой версией в качестве сигнала обучения. Экспериментальные результаты на Qwen3 показывают, что OPD^2 последовательно демонстрирует лучшую производительность, особенно на неанглийских языках. Авторы обнаруживают, что обучение только на английских данных может привести к смещению ответов в сторону английского языка, что подчёркивает важность многоязычных данных для сохранения целевого языка.'}, 'en': {'title': 'Enhancing Multilingual Learning with On-Policy Distillation', 'desc': 'On-Policy Distillation (OPD) is a new method that offers a different approach to training large language models (LLMs) after their initial training, especially in multilingual contexts. The paper introduces an enhanced version called On-Policy Delta Distillation (OPD^2), which uses the difference in probabilities between a teacher model and its base model to improve learning. Experiments show that OPD^2 significantly enhances performance in Korean and Japanese, while also reducing the performance gap between English and Korean. Additionally, using English-only OPD can help improve results for Korean and Japanese, but may lead to responses that are more English-like, emphasizing the need for diverse language data.'}, 'zh': {'title': '多语言环境下的强化学习新方法', 'desc': '本文探讨了在多语言环境中，On-Policy Distillation（OPD）及其改进版本On-Policy Delta Distillation（OPD^2）在数学推理中的应用。OPD^2通过利用后训练教师模型与基础模型之间的概率差距作为学习信号，从而提升了OPD的效果。实验结果表明，OPD^2在处理韩语和日语时表现显著优于原始的OPD，并且缩小了英语与韩语之间的性能差距。研究还发现，仅使用英语的OPD也能提高韩语和日语的表现，但往往会使回答偏向英语，这突显了多语言数据在保持目标语言响应中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.06301', 'title': 'HarnessOpt-Bench: Evaluating LLMs at Harness Optimization', 'url': 'https://huggingface.co/papers/2608.06301', 'abstract': "Abstract  As LLMs are increasingly deployed within agentic systems, their capabilities depend not only on the model weights but also on the harness: the prompts, tools, control flow, memory, and orchestration code surrounding them. This makes automated harness optimization -- the iterative and evaluation-guided improvement of a harness by an AI system -- both an important route to improving AI systems and a demanding capability for AI systems themselves. Yet the community lacks a common protocol for measuring how well frontier LLMs perform at this task. We introduce HarnessOpt-Bench, a benchmark for end-to-end harness optimization under expensive and stochastic evaluation. An optimizer, an LLM paired with a coding harness, receives a target agent's seed harness, graded evaluation feedback, and a fixed target-evaluation budget. It edits the harness and nominates a final candidate, which is scored by its normalized gain over the seed on a held-out test partition that remains inaccessible throughout search. A trusted execution environment enforces the evaluation boundary, meters target-agent resource use, and preserves candidate versions for audit. We evaluate 5 frontier LLMs as optimizers both under a shared coding harness and under their native harnesses across 4 downstream tasks, over 111 scored runs. Experiment results show that optimizer models separate more than the coding harnesses they act through, native harnesses are not consistently superior, and gains vary substantially across tasks and seed regimes. These results establish harness optimization as a measurable and discriminative capability with large space for improvement.", 'score': 20, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'e87eea6e71a8e5ee', 'authors': ['Varun Ursekar', 'Apaar Shanker', 'Yash Maurya', 'Shehab Yasser', 'Vijay S. Kalmath', 'Veronica Chatrath', 'Yuan Xue'], 'affiliations': ['Scale AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.06301.jpg', 'data': {'categories': ['#optimization', '#benchmark', '#agents'], 'emoji': '🛠️', 'ru': {'title': 'Автоматическая оптимизация конфигурации агентов через самосовершенствующиеся языковые модели', 'desc': 'В статье предлагается HarnessOpt-Bench — первый бенчмарк для оценки способности большых языковых моделей оптимизировать «обвязку» агентских систем, включающую промпты, инструменты и управление памятью. Авторы разработали методику тестирования, где модель-оптимизатор получает начальную конфигурацию, обратную связь от оценивающей функции и фиксированный бюджет вычислений, затем итеративно улучшает систему. Проведено сравнение пяти передовых LLM-моделей как оптимизаторов на четырёх задачах с более чем 110 запусками, с использованием защищённого окружения для валидации результатов. Результаты показывают значительные различия между моделями и задачами, подтверждая, что оптимизация обвязки — это измеримый и важный навык для автоматического улучшения AI-систем.'}, 'en': {'title': 'Harness Optimization: Unlocking LLM Potential', 'desc': "This paper discusses the importance of optimizing the 'harness' around large language models (LLMs) to enhance their performance in agentic systems. The authors introduce HarnessOpt-Bench, a benchmark designed to evaluate how well LLMs can improve their harnesses through automated optimization. The study evaluates five advanced LLMs as optimizers, revealing that their performance can vary significantly depending on the tasks and the initial harnesses used. The findings highlight the need for a standardized approach to measure harness optimization capabilities in AI systems."}, 'zh': {'title': '优化环境，提升AI能力！', 'desc': '随着大型语言模型（LLMs）在智能系统中的应用越来越广泛，它们的能力不仅依赖于模型权重，还依赖于周围的环境，包括提示、工具、控制流程、记忆和协调代码。因此，自动化的环境优化，即通过AI系统对环境进行迭代和评估指导的改进，成为提升AI系统的重要途径。我们提出了HarnessOpt-Bench，这是一个用于在高成本和随机评估下进行端到端环境优化的基准测试。实验结果表明，优化模型的表现与其所使用的编码环境有显著区别，原生环境并不总是优于共享环境，且不同任务和种子条件下的提升幅度差异很大。'}}}, {'id': 'https://huggingface.co/papers/2608.03451', 'title': 'DataSpace: Benchmarking Data Agents for Verifiable Analytics over Heterogeneous Workspaces', 'url': 'https://huggingface.co/papers/2608.03451', 'abstract': 'Abstract  Data agents enable natural-language analytics over organizational workspaces, where relevant evidence may be scattered across databases, structured files, long documents, and multimedia. Existing benchmarks largely isolate structured querying, retrieval, or open-ended analysis, leaving heterogeneous evidence discovery, complete tabular outputs, and deterministic evaluation insufficiently unified. We introduce DataSpace, a benchmark in which data agents produce verifiable tabular results from task-local heterogeneous workspaces. It contains 410 cross-language tasks and 7,439 artifacts totaling 15.01 GB across CSV, JSON, SQLite, Markdown, PDF, and video. DataSpace also served as the official evaluation benchmark for the KDD Cup 2026 Data Agents for Complex Data Analysis competition. Each agent receives only a question and workspace and returns the complete requested tabular result. We construct DataSpace with DataSpace-Builder, an execution-grounded framework comprising cross-language transformation, constraint-aware relational sampling, modality routing and artifact rendering, and human review and task repair by 11 domain experts. A deterministic evaluator performs header-invariant column alignment, type- and precision-aware normalization, and order-aware row comparison. Across six recently released frontier multimodal models and five widely used agent harnesses, the best accuracy reaches 66.34%, while harness choice creates a 15.36-point spread with the backbone fixed. Multimodal evidence integration and joins consistently reduce accuracy across all six backbones. These results show that DataSpace remains unsaturated and identify key challenges for improving data-agent reliability.', 'score': 19, 'issue_id': 2874, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '5573f30b326c76e7', 'authors': ['Boyan Li', 'Zhuowen Liang', 'Yupeng Xie', 'Xiaotian Lin', 'Tianqi Luo', 'Xinyu Liu', 'Yizhang Zhu', 'Zhangyang Peng', 'Yuan Li', 'Zhengxuan Zhang', 'Jiayi Zhang', 'Nan Tang', 'Guoliang Li', 'Yuyu Luo'], 'affiliations': ['HKUST(GZ)', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03451.jpg', 'data': {'categories': ['#open_source', '#dataset', '#multimodal', '#science', '#synthetic', '#agents', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Универсальный бенчмарк для агентов анализа данных с гетерогенными источниками', 'desc': 'Авторы представляют DataSpace — бенчмарк для оценки data agents, которые анализируют данные из разнородных источников (базы данных, файлы, документы, видео) на естественном языке. Бенчмарк содержит 410 задач на разных языках с 7,439 артефактами общим объёмом 15 ГБ в различных форматах (CSV, JSON, SQLite, Markdown, PDF, видео). Для создания DataSpace разработана специальная методология, включающая трансформацию данных между языками, маршрутизацию по модальностям и детерминированное сравнение табулярных результатов. Эксперименты показали, что лучшие мультимодальные модели достигают точности только 66,34%, а задачи с интеграцией гетерогенных данных остаются критическим вызовом для надёжности data agents.'}, 'en': {'title': 'DataSpace: Unifying Data Agents for Complex Analytics', 'desc': 'This paper presents DataSpace, a new benchmark designed for data agents to perform natural-language analytics across diverse organizational data sources. It addresses the limitations of existing benchmarks by providing a unified framework for heterogeneous evidence discovery and deterministic evaluation. DataSpace includes a wide variety of tasks and data formats, allowing agents to generate verifiable tabular results from complex workspaces. The findings highlight the challenges in multimodal evidence integration and suggest areas for enhancing the reliability of data agents.'}, 'zh': {'title': 'DataSpace：提升数据代理的可靠性与准确性', 'desc': '本文介绍了DataSpace，这是一个用于评估数据代理在复杂数据分析中的表现的基准。DataSpace允许数据代理从不同类型的工作空间中生成可验证的表格结果，涵盖了多种数据格式，如CSV、JSON和PDF等。该基准包含410个跨语言任务和7439个数据工件，旨在统一异构证据发现和完整表格输出的评估。研究结果表明，尽管在多模态模型中取得了一定的准确率，但数据代理的可靠性仍面临重大挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.05138', 'title': 'Teaching Nemotron Greek: Mining a Corpus, Adapting Retrieval, and Grounding Generation for Modern Greek across Specialist Domains', 'url': 'https://huggingface.co/papers/2608.05138', 'abstract': "Abstract  Modern Greek is absent from NVIDIA's Nemotron retrieval models and from major multilingual retrieval benchmarks, despite being important for retrieval-augmented generation (RAG) in legal, energy, financial, and medical applications. We present an end-to-end adaptation of the Nemotron retrieval stack for Modern Greek, including corpus mining, synthetic supervision, retrieval model training, reranker adaptation, reader fine-tuning, and a new benchmark called HERA. Our study shows that a parameter-free BM25 baseline outperforms several off-the-shelf multilingual dense retrieval models on specialist Greek corpora. After fine-tuning on 65,773 Greek retrieval pairs, a Nemotron 1B embedder improves nDCG@10 from 0.362 to 0.835 and substantially outperforms its unadapted counterpart. The learned language competence transfers to general-domain Greek, although the advantage over BM25 remains domain-dependent. We further adapt a cross-encoder reranker and demonstrate consistent improvements across specialist domains. Finally, we LoRA-tune a Nemotron 30B-A3B mixture-of-experts reader for grounded generation, increasing judged answer correctness from 29.4% to 66.9% while significantly improving faithfulness and citation quality. We also introduce HERA, the first large-scale Greek benchmark for retrieval-augmented generation, and release our adapted models and benchmark to support future research on Greek-language RAG systems.", 'score': 17, 'issue_id': 2871, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '0821e716446b10b9', 'authors': ['Ayoub Kirouane', 'Christos Petrocheilos'], 'affiliations': ['KIEFER SA', 'Sophea AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.05138.jpg', 'data': {'categories': ['#open_source', '#training', '#benchmark', '#multilingual', '#synthetic', '#low_resource', '#transfer_learning', '#rag', '#dataset'], 'emoji': '🇬🇷', 'ru': {'title': 'Адаптация retrieval-моделей для греческого языка и создание специализированного RAG бенчмарка', 'desc': 'В работе представлена адаптация модели поиска Nemotron для современного греческого языка, включая создание корпуса, синтетическую разметку и обучение retrieval моделей. Авторы показали, что после fine-tuning на 65,773 парах для поиска информации, embedding-модель размером 1B улучшила метрику nDCG@10 с 0.362 до 0.835, значительно превзойдя неадаптированные multilingual модели. Дополнительно они адаптировали cross-encoder reranker и улучшили качество поиска во всех специализированных доменах, а также fine-tunned reader модель для RAG-задач с помощью LoRA. В качестве вклада авторы создали HERA — первый крупномасштабный бенчмарк для грецкого языка в контексте retrieval-augmented generation систем.'}, 'en': {'title': 'Empowering Modern Greek Retrieval with Nemotron Adaptation', 'desc': "This paper addresses the lack of Modern Greek support in NVIDIA's Nemotron retrieval models and multilingual benchmarks, which is crucial for various applications. The authors present a comprehensive adaptation of the Nemotron retrieval stack for Modern Greek, involving steps like corpus mining and model training. They demonstrate that a simple BM25 baseline can outperform advanced multilingual models on Greek data, and after fine-tuning, their adapted models significantly improve retrieval performance. Additionally, they introduce HERA, a new benchmark for retrieval-augmented generation in Greek, and provide their models to aid future research in this area."}, 'zh': {'title': '为现代希腊语打造高效检索模型', 'desc': '本研究针对现代希腊语，提出了一种端到端的Nemotron检索模型适配方案，涵盖了语料挖掘、合成监督、检索模型训练等多个步骤。我们发现，基于无参数的BM25基线在专业希腊语语料上表现优于多种现成的多语言密集检索模型。经过对65,773个希腊检索对的微调，Nemotron 1B嵌入模型的nDCG@10从0.362提升至0.835，显示出显著的性能提升。我们还引入了HERA，这是第一个大规模的希腊语检索增强生成基准，旨在支持未来的希腊语RAG系统研究。'}}}, {'id': 'https://huggingface.co/papers/2608.06374', 'title': 'DyPES-VLA: Learning Shared Dynamics Priors and Embodiment-Specific Control for Cross-Embodiment Manipulation', 'url': 'https://huggingface.co/papers/2608.06374', 'abstract': "Abstract  Vision-Language-Action (VLA) models have become a powerful paradigm for robot manipulation, but training a single generalist policy for heterogeneous robot embodiments remains an open problem. Existing methods have two main limitations. First, they underuse dynamics priors shared across diverse visual and interaction data, limiting cross-embodiment transfer. Second, they require extensive manual preprocessing to convert embodiment-specific actions into a common format. To overcome these limitations, we propose DyPES-VLA, a cross-embodiment VLA that learns shared Dynamics Priors and Embodiment-Specific control. First, we learn shared dynamics priors by training the vision-language model (VLM) with a future-prediction objective on cross-embodiment data, driving the shared query representation to capture object motion, contact, and interaction-induced scene changes. Second, an embodiment-specific Mixture-of-Experts (MoE) action head translates these shared dynamics priors into executable controls directly in each embodiment's native action space, without manually pre-aligning heterogeneous actions into a common format. This head shares attention layers to capture common temporal action structures, while its embodiment-specific feed-forward experts resolve the unique kinematic constraints and control semantics of distinct embodiments. As a generalist policy, our \\ourmethod achieves state-of-the-art performance across simulation and real-world evaluations, reaching 98.0% success on LIBERO, 59.25% on RoboCasa-GR1, and 89.02% on RoboTwin~2.0.", 'score': 15, 'issue_id': 2867, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '886fba2835e43b01', 'authors': ['Junfeng Li', 'Junjie He', 'Zhide Zhong', 'Yangyang Zheng', 'Pingyue Sheng', 'Jiayu Dong', 'Ruixin Li', 'Haodong Yan', 'Jiaguan Zhu', 'Tianran Zhang', 'Runze Yu', 'Wen Chen', 'Liuqing Yang', 'Yuxiang Gao', 'Haoang Li'], 'affiliations': ['COCO Matrix', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2608.06374.jpg', 'data': {'categories': ['#training', '#robotics', '#architecture', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единая политика управления для разных роботов через общие приоритеты динамики', 'desc': 'Работа представляет DyPES-VLA — модель Vision-Language-Action для управления роботами-манипуляторами, которая способна работать с несколькими различными типами роботических систем. Основная идея заключается в обучении общих приоритетов динамики на основе данных с разных роботов, используя задачу предсказания будущих состояний сцены через vision-language модель. Авторы предлагают специализированный Mixture-of-Experts головной модуль действий, который переводит эти общие приоритеты динамики в команды управления для каждого типа робота напрямую, без необходимости ручного приведения действий к единому формату. Подход достигает лучших результатов на нескольких бенчмарках, включая симуляции и реальные робототехнические системы.'}, 'en': {'title': 'Empowering Robots with Shared Dynamics for Versatile Manipulation', 'desc': 'The paper introduces DyPES-VLA, a new model designed to improve robot manipulation by addressing the challenges of training a single policy for different robot types. It leverages shared Dynamics Priors to enhance the transfer of knowledge across various embodiments, allowing for better performance in diverse scenarios. The model uses a Mixture-of-Experts (MoE) action head to convert these shared dynamics into specific actions for each robot, eliminating the need for extensive manual preprocessing. As a result, DyPES-VLA achieves impressive success rates in both simulated and real-world tasks, demonstrating its effectiveness as a generalist policy.'}, 'zh': {'title': '跨体现的智能机器人控制新方法', 'desc': '本文提出了一种新的跨体现视觉-语言-动作（VLA）模型，称为DyPES-VLA，旨在解决机器人操作中的一些关键问题。现有方法在利用共享动态先验方面存在不足，限制了不同机器人之间的迁移能力，同时需要大量手动预处理以将特定于体现的动作转换为通用格式。DyPES-VLA通过在跨体现数据上训练视觉-语言模型来学习共享动态先验，并使用特定于体现的专家混合（MoE）动作头将这些先验直接转换为可执行的控制。该模型在模拟和现实世界评估中表现出色，达到了多个基准测试的最佳性能。'}}}, {'id': 'https://huggingface.co/papers/2608.05369', 'title': 'World-to-Wrist: Task-Conditioned Future Wrist Modeling for Fine-Grained Robot Manipulation', 'url': 'https://huggingface.co/papers/2608.05369', 'abstract': 'Abstract  Vision-language-action (VLA) models often treat main-view and wrist-view observations as parallel visual inputs, overlooking their distinct roles in robot manipulation. Fine-grained manipulation, however, benefits from anticipating how wrist-local interactions may evolve under the global task context. To address this limitation, we present World-to-Wrist VLA (W2-VLA), a VLA model for fine-grained robot manipulation with task-conditioned future wrist modeling. Given current multi-view observations and a task instruction, W2-VLA contextualizes a set of latent modeling tokens as a compact interface between the vision-language model and the wrist predictor. Conditioned on this interface and the observed wrist history, the predictor forecasts future wrist latents, which are transformed into future-aware context for action prediction. In addition, we introduce W2-CoT, a synthesis pipeline that produces structured annotations describing manipulation progress, physical transition cues, and wrist-local evidence. These annotations provide auxiliary supervision that shapes the task-conditioned latent interface. Experiments on LIBERO, RoboTwin 2.0, and real-world manipulation tasks demonstrate improved fine-grained and contact-sensitive manipulation across both single-arm and bimanual settings, while maintaining action-generation rates above 80 Hz.', 'score': 14, 'issue_id': 2868, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '74359d047e4b6f50', 'authors': ['Yuhao Pan', 'Haosong Peng', 'Zhengshen Zhang', 'Zhengyang Yan', 'Yalun Dai', 'Fushuo Huo', 'Chujie Wang', 'Tianyu Qi', 'Xiucheng Wang', 'Nan Cheng', 'Wenchao Xu'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'Southeast University', 'Sun Yat-sen University', 'The Hong Kong University of Science and Technology', 'Wuhan University', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05369.jpg', 'data': {'categories': ['#architecture', '#training', '#robotics', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'От общей картины к точности кисти: предсказание будущего для ловкой манипуляции', 'desc': 'Авторы представляют World-to-Wrist VLA — модель для обучения роботов манипуляции, которая правильно использует информацию с разных камер. Модель предсказывает будущее состояние кисти робота, учитывая глобальный контекст задачи и локальные взаимодействия, через компактный интерфейс латентных токенов. Для улучшения обучения авторы разработали синтез структурированных аннотаций (W2-CoT), описывающих прогресс манипуляции и признаки физических переходов. Экспериментальная валидация показала улучшение точности манипуляции при высокой частоте генерации действий (более 80 Гц) на симуляциях и реальных роботах.'}, 'en': {'title': 'Enhancing Robot Manipulation with Contextual Wrist Modeling', 'desc': "The paper introduces the World-to-Wrist VLA (W2-VLA) model, which enhances robot manipulation by integrating task context with wrist-level interactions. Unlike traditional models that treat different views equally, W2-VLA focuses on how wrist actions evolve based on the overall task. It uses a set of latent modeling tokens to connect visual inputs with wrist predictions, allowing for better anticipation of future actions. Additionally, the W2-CoT pipeline generates structured annotations that improve the model's understanding of manipulation progress and physical cues, leading to more precise and responsive robotic actions."}, 'zh': {'title': '提升机器人精细操作的视觉-语言-动作模型', 'desc': '本文提出了一种新的视觉-语言-动作（VLA）模型，称为World-to-Wrist VLA（W2-VLA），旨在改善机器人精细操作的能力。该模型通过任务条件下的未来手腕建模，考虑了主视图和手腕视图在机器人操作中的不同作用。W2-VLA利用多视图观察和任务指令，创建一个紧凑的潜在建模接口，以预测未来的手腕状态，从而提高动作预测的准确性。此外，W2-CoT合成管道生成结构化注释，描述操作进展和手腕局部证据，为任务条件的潜在接口提供辅助监督。'}}}, {'id': 'https://huggingface.co/papers/2608.05565', 'title': 'EffectLearner: World-Aware Object-Effect Reasoning for Real-World Video Object Removal', 'url': 'https://huggingface.co/papers/2608.05565', 'abstract': 'Abstract  Video object removal must eliminate not only the target object but also its induced effects while maintaining high-fidelity and spatiotemporally coherent restoration. Existing methods mainly learn object-effect correspondences implicitly from predefined effect categories and fixed data distributions, limiting their generalization to complex real-world scenes involving compositional effects, spatially detached or weakly correlated effects, long-tail physical phenomena, and dynamically evolving interactions. We propose EffectLearner, a semantic-reasoning-enhanced framework that combines a VLM-based Object-Effect Reasoner with a DiT-based Video Eraser. Guided by a structured effect-analysis prompt, the Reasoner performs cross-modal reasoning over a target-highlighted video and extracts compact effect-aware context, which guides the Video Eraser toward comprehensive object-effect removal. Motion-aware mask guidance and motion-consistency supervision further improve removal coverage and spatiotemporal stability under object motion and evolving scene dynamics. To fully exploit the framework in challenging real-world scenarios, we further construct EffectWorld, a paired video dataset specifically designed for complex object-induced effects, and introduce a progressive training curriculum that combines common supervision with complex-effect data. On the standard ROSE-Bench, EffectLearner outperforms existing baselines on most metrics and achieves clear advantages on both EffectWorld-Eval and the challenging EffectWorld-Wild, demonstrating its ability to deliver high-quality video object removal in complex real-world scenes.', 'score': 12, 'issue_id': 2870, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'd302199b9f41ea58', 'authors': ['Feier Wu', 'Wanke Xia', 'Xu He', 'Zilang Zhou', 'Si Chen', 'Dongxia Liu', 'Liyang Chen', 'Qimeng Wu', 'Zhengbo Zhang', 'Wenming Yang', 'Zhiyong Wu'], 'affiliations': ['China Agricultural University', 'Institute of Automation, Chinese Academy of Science', 'Jiangnan University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05565.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#video'], 'emoji': '🎬', 'ru': {'title': 'Умное удаление объектов из видео с анализом побочных эффектов', 'desc': 'Предложена система EffectLearner для удаления объектов из видео, которая не только удаляет сам объект, но и его эффекты воздействия на сцену. Система комбинирует Vision Language Model для семантического анализа эффектов с диффузионной моделью на основе трансформера для непосредственного удаления. Авторы создали новый датасет EffectWorld с парными видео, содержащими сложные эффекты, и применили прогрессивное обучение с учётом движения объектов для повышения пространственно-временной согласованности. Эксперименты показывают, что EffectLearner превосходит существующие методы на стандартных бенчмарках и хорошо обобщается на реальные сложные сценарии.'}, 'en': {'title': 'Revolutionizing Video Object Removal with EffectLearner', 'desc': 'This paper introduces EffectLearner, a novel framework for video object removal that effectively addresses the challenges of eliminating not just the target object but also its associated effects. It combines a Video-Language Model (VLM) based Object-Effect Reasoner with a Diffusion-based Video Eraser to enhance the understanding of complex object interactions. The framework utilizes structured prompts for effect analysis and incorporates motion-aware guidance to ensure stability and coherence in dynamic scenes. By creating a specialized dataset, EffectWorld, and employing a progressive training approach, EffectLearner demonstrates superior performance in real-world scenarios compared to existing methods.'}, 'zh': {'title': '高效视频物体移除的新方法', 'desc': '视频物体移除不仅需要去除目标物体，还要消除其引起的效果，同时保持高保真度和时空一致性。现有方法主要通过预定义的效果类别和固定的数据分布来隐式学习物体与效果之间的对应关系，这限制了它们在复杂真实场景中的泛化能力。我们提出了EffectLearner，一个增强语义推理的框架，结合了基于视觉语言模型的物体-效果推理器和基于Diffusion的动态视频擦除器。通过结构化的效果分析提示，推理器在目标高亮视频上进行跨模态推理，提取紧凑的效果感知上下文，从而指导视频擦除器实现全面的物体-效果移除。'}}}, {'id': 'https://huggingface.co/papers/2608.06352', 'title': 'CalibForge: Adversarial Solver Calibration for Scaling Learnable Terminal Tasks', 'url': 'https://huggingface.co/papers/2608.06352', 'abstract': 'Abstract  Training terminal agents requires executable and verifiable tasks that are not merely solvable, but appropriately challenging for learning. Executable validation establishes feasibility, yet does not reveal how a task behaves relative to a given solver setting. In this paper, we present CalibForge, an autonomous terminal-task synthesis system that uses verified solver behavior to revise candidate tasks through adversarial solver calibration. Multi-solver calibration targets disagreement within a heterogeneous solver pool, whereas contrastive solver calibration targets a designated strong-pass/weak-fail relation; both operationalize a solver-relative learnable zone anchored in demonstrated solvability. Using CalibForge, we construct 5,431 calibrated terminal tasks. Our ablations show that both strategies yield more effective supervision than authoring and validation alone or ordinary single-solver feedback. Models trained on the full collection achieve 32.58% and 47.57% on Terminal-Bench 2.0. The largest improvements over the corresponding base model reach 24.71 percentage points on Terminal-Bench 2.0, 27.68 points on SWE-bench Pro, and 30.04 points on Doc2Repo. Together, these results support solver-relative learnability as a practical target for constructing effective and transferable agent training data.', 'score': 11, 'issue_id': 2868, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '4740b01b7eb9334d', 'authors': ['Fanzhe Meng', 'Guoxin Chen', 'Jiale Zhao', 'Shuang Sun', 'Zhiyu Lin', 'Wayne Xin Zhao', 'Ruihua Song', 'Ji-Rong Wen', 'Kai Jia'], 'affiliations': ['AweAI Team', 'Gaoling School of Artificial Intelligence, Renmin University of China', 'Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2608.06352.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'Калибровка сложности задач через конфликты решателей для обучения агентов', 'desc': 'В этой статье представляется CalibForge — система для автоматического создания задач терминала, которая использует поведение различных решателей для улучшения качества обучающих данных. Авторы применяют два подхода калибровки: многорешательную, нацеленную на разногласия между разными моделями, и контрастивную, ориентированную на четкое разделение между легкими и сложными примерами. Система строит обучающие наборы на основе концепции «зоны обучаемости, привязанной к решателю», что означает, что задачи подбираются в соответствии с возможностями конкретного агента. Модели, обученные на полученных наборах данных, показывают значительные улучшения на нескольких бенчмарках, что подтверждает эффективность подхода для создания передаваемых обучающих данных.'}, 'en': {'title': 'CalibForge: Crafting Challenging Tasks for Smarter Agents', 'desc': 'This paper introduces CalibForge, a system designed to create challenging tasks for training terminal agents in machine learning. It focuses on synthesizing tasks that are not only solvable but also tailored to the capabilities of different solvers through a process called adversarial solver calibration. The system employs two calibration strategies: multi-solver calibration, which addresses disagreements among various solvers, and contrastive solver calibration, which emphasizes the relationship between strong and weak performance. The results demonstrate that using CalibForge leads to significant improvements in model performance on benchmark tasks, highlighting the importance of solver-relative learnability in developing effective training data.'}, 'zh': {'title': '求解器相对可学习性：构建有效代理训练数据的关键', 'desc': '本论文介绍了CalibForge，一个自主的终端任务合成系统，旨在通过对抗性求解器校准来修正候选任务。该系统利用经过验证的求解器行为，确保生成的任务既可执行又具有适当的挑战性。我们构建了5431个经过校准的终端任务，并通过实验表明，这种方法比单纯的任务编写和验证更有效。最终，使用这些任务训练的模型在多个基准测试中取得了显著的性能提升，证明了求解器相对可学习性在构建有效的代理训练数据中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.05137', 'title': 'SmartMage: Dynamic Modality Orchestration for 3D Scene Understanding', 'url': 'https://huggingface.co/papers/2608.05137', 'abstract': "Abstract  Understanding 3D scenes is fundamental to embodied intelligence, requiring joint reasoning over heterogeneous information from multiple modalities, including visual and geometric cues. However, the relevance of these modalities often varies across queries. Existing Multimodal Large Language Models (MLLMs) typically rely on fixed modality combinations, overlooking query-dependent modality needs. Such a rigid design can introduce semantic noise from irrelevant modalities while underutilizing more informative ones, leading to wasted computation and diluted reasoning. To address these challenges, this paper proposes SmartMage, a unified MLLM that dynamically orchestrates heterogeneous modalities for semantic-aware 3D scene understanding. Specifically, SmartMage incorporates: (1) a Semantic-guided Modality Adaptive RouTng (SMART) module that selects task-relevant modalities using semantic priors, text-modality alignment, and modality quality; and (2) a Modality-Aware Gating Expert (MAGE) module that leverages modality priors to guide expert activation, fostering adaptive specialization in multimodal reasoning. Empirically, SmartMage achieves state-of-the-art performance across five 3D scene understanding benchmarks, and attains competitive results on RGB-only video understanding benchmarks. In our diagnostic benchmark ScanFacet, tasks are divided into fine-grained semantic categories, enabling analysis of modality combinations preferred by each semantic type. The observed modality-semantic patterns provide further evidence of SmartMage's effectiveness. Project page: https://yuecheong.github.io/SmartMage/.", 'score': 11, 'issue_id': 2868, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '3997ecae606c3e99', 'authors': ['Yue Zhang', 'Yingzhao Jian', 'Yunqiu Xu', 'Xiaoxiao Sun', 'Hehe Fan'], 'affiliations': ['Stanford University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05137.jpg', 'data': {'categories': ['#architecture', '#3d', '#benchmark', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Умная маршрутизация модальностей для понимания 3D сцен', 'desc': 'В работе предлагается SmartMage — многомодальная большая языковая модель, которая динамически выбирает наиболее релевантные модальности (визуальные и геометрические данные) в зависимости от характера задачи для понимания 3D сцен. Модель включает модуль SMART для семантически-осведомленного выбора модальностей и модуль MAGE для адаптивной специализации экспертов на основе приоритетов модальностей. Подход позволяет избежать семантического шума от нерелевантных модальностей и более эффективно использовать информативные данные, снижая вычислительные затраты. SmartMage демонстрирует лучшие результаты на пяти бенчмарках для понимания 3D сцен и конкурентоспособные результаты на задачах видеопонимания в RGB-модальности.'}, 'en': {'title': 'SmartMage: Dynamic Modality Selection for 3D Scene Understanding', 'desc': 'This paper introduces SmartMage, a Multimodal Large Language Model (MLLM) designed for enhanced understanding of 3D scenes by dynamically selecting relevant modalities based on the specific query. It addresses the limitations of existing MLLMs that use fixed modality combinations, which can lead to irrelevant information and inefficient reasoning. SmartMage features a Semantic-guided Modality Adaptive Routing (SMART) module that intelligently chooses the most pertinent modalities, and a Modality-Aware Gating Expert (MAGE) module that optimizes the activation of these modalities for better performance. The model demonstrates superior results on multiple 3D scene understanding benchmarks, showcasing its ability to adaptively utilize information for improved semantic reasoning.'}, 'zh': {'title': '动态模态协调，提升三维场景理解', 'desc': '理解三维场景对具身智能至关重要，需要对来自多种模态的信息进行联合推理，包括视觉和几何线索。然而，现有的多模态大语言模型（MLLMs）通常依赖固定的模态组合，忽视了查询依赖的模态需求。为了解决这些问题，本文提出了SmartMage，一个统一的MLLM，能够动态协调异构模态以实现语义感知的三维场景理解。SmartMage通过语义引导的模态自适应路由模块和模态感知的专家激活模块，优化了模态选择和推理过程，显著提升了三维场景理解的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.05850', 'title': 'MameLoshnLM: Yiddish Language Model and Evaluation Benchmark', 'url': 'https://huggingface.co/papers/2608.05850', 'abstract': "Abstract  We present MameLoshnLM, the first open-source 8B-parameter language model built specifically for Yiddish. Despite Yiddish's rich textual tradition, its limited digital presence and the scarcity of reliable evaluation resources have constrained progress in Yiddish language modeling. Existing multilingual corpora and benchmarks are often poor proxies for the language, containing substantial amounts of noisy, machine-translated, and misclassified text. We address these gaps by introducing Oytser, a high-quality Yiddish pretraining corpus that combines contemporary web-native sources with literary materials, and Kashes, a multi-task benchmark spanning translation, linguistic analysis, information extraction, and language understanding. Using these resources, we continue pretraining Llama 3.1 8B to obtain MameLoshnLM. Across the tasks in the benchmark, MameLoshnLM outperforms open baselines of similar scale. Our analyses show that these gains are not only quantitative: relative to general-purpose multilingual models, MameLoshnLM better captures language-defining lexical and morphological patterns, pointing to a broader failure mode of noisy web-scale multilingual data for low-resource languages. Our results provide both a foundation for Yiddish NLP and a practical template for language model development in historically rich but digitally underrepresented languages.", 'score': 10, 'issue_id': 2872, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '1b2c92037d4eca62', 'authors': ['Uri Katz', 'Omer Goldman', 'Tomasz Limisiewicz', 'Reut Tsarfaty', 'Noah A. Smith'], 'affiliations': ['Allen Institute for AI', 'Bar-Ilan University', 'University of Cambridge', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.05850.jpg', 'data': {'categories': ['#benchmark', '#multilingual', '#transfer_learning', '#training', '#dataset', '#open_source', '#low_resource'], 'emoji': '🕯️', 'ru': {'title': 'Возрождение идиша: языковая модель для исторически богатого языка', 'desc': 'Представлена MameLoshnLM — первая открытая языковая модель объёмом 8 миллиардов параметров, разработанная специально для идиша. Авторы создали высококачественный корпус Oytser для предварительного обучения, объединив современные интернет-источники с литературными текстами, а также разработали многозадачный бенчмарк Kashes для оценки качества. Модель получена путём дополнительного обучения Llama 3.1 8B и превосходит открытые базовые модели аналогичного размера на всех задачах. Исследование показывает, что MameLoshnLM лучше захватывает лексические и морфологические особенности идиша, выявляя проблемы многоязычных моделей при работе с малорепрезентированными языками.'}, 'en': {'title': 'Empowering Yiddish with Advanced Language Modeling', 'desc': 'MameLoshnLM is an innovative 8B-parameter language model specifically designed for the Yiddish language, addressing the challenges posed by its limited digital resources. The model is built using Oytser, a high-quality pretraining corpus that merges modern web content with literary texts, and Kashes, a comprehensive benchmark for various language tasks. MameLoshnLM demonstrates superior performance compared to existing multilingual models, particularly in capturing unique linguistic features of Yiddish. This work not only advances Yiddish natural language processing (NLP) but also serves as a model for developing language technologies for other underrepresented languages.'}, 'zh': {'title': '为意第绪语开创语言模型的新纪元', 'desc': '我们介绍了MameLoshnLM，这是第一个专门为意第绪语构建的开源8B参数语言模型。尽管意第绪语有着丰富的文本传统，但其数字化存在有限，可靠的评估资源稀缺，限制了意第绪语语言建模的进展。我们通过引入Oytser，一个高质量的意第绪语预训练语料库，结合现代网络来源和文学材料，来解决这些问题。MameLoshnLM在多任务基准测试中表现优于类似规模的开放基线，显示出其在捕捉语言特征方面的优势。'}}}, {'id': 'https://huggingface.co/papers/2608.06146', 'title': 'PaDoc: Layout-Grounded Parallel Decoding for Document Parsing', 'url': 'https://huggingface.co/papers/2608.06146', 'abstract': 'Abstract  End-to-end document parsers provide a unified interface, but serialize page layouts and regional contents into one autoregressive sequence. This formulation forces independent regions onto a decoding path whose length grows with the total content, whereas crop-based two-stage parsers expose region-level parallelism at the cost of repeated visual prefills and fragmented page context. To retain full-page context while removing dependencies, we propose PaDoc, a layout-grounded parser that treats the predicted layout as a branching structure over a shared page representation. Under a region-sufficiency assumption, we derive a prefix-conditioned factorization in which the layout stream and regional content branches advance concurrently, reducing the decoding depth to the longest layout-content path. We realize this factorization within a single MLLM: packed variable-length ancestor attention preserves the visibility under standard next-token training, while masked parallel decoding creates branches that the evaluated vLLM backend serves as concurrent requests with cache-resident shared-prefix reuse. On OmniDocBench Full, PaDoc attains an Overall layout F1 of 91.1 and, among end-to-end parsers, a top-tier Overall score of 94.24 together with the best Text Edit (0.038) and Formula CDM (95.59). On a 384-page subset and one A800 GPU, it is the fastest end-to-end parser at five concurrency levels, improving valid-page throughput by 67.4-118% and reducing P95 latency by 39.2-54.9% relative to a same-backbone Sequential SFT baseline. Code is available at https://github.com/Longin-Yu/Padoc', 'score': 10, 'issue_id': 2869, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'e27b4a6f21506d72', 'authors': ['Hao Yu', 'Jiabo Zhan', 'Kang Liu', 'Linnan Zhao', 'Dongxu Yue', 'Rui Chen', 'Jinglin Wang', 'Chong Sun', 'Chen Li', 'Jing Lyu', 'Chun Yuan'], 'affiliations': ['Tsinghua University', 'Wechat Vision, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.06146.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#inference', '#cv'], 'emoji': '📄', 'ru': {'title': 'Параллельный парсинг документов через древовидную факторизацию', 'desc': 'Статья представляет PaDoc — парсер документов, который обрабатывает макет страницы и содержимое регионов параллельно, сохраняя контекст всей страницы. В отличие от традиционных end-to-end подходов, которые кодируют информацию последовательно, PaDoc использует древовидную структуру с общим представлением страницы, позволяя различным ветвям обрабатываться одновременно. Авторы применили packed variable-length ancestor attention и masked parallel decoding для реализации факторизации предсказаний внутри единственной MLLM. Метод достигает высокого качества (F1=91.1 для макета) и значительного ускорения — улучшение пропускной способности на 67.4-118% и снижение latency на 39.2-54.9% по сравнению с baseline.'}, 'en': {'title': 'PaDoc: Revolutionizing Document Parsing with Layout-Grounded Efficiency', 'desc': 'The paper introduces PaDoc, a novel end-to-end document parser that improves upon traditional methods by utilizing a layout-grounded approach. Unlike previous models that serialize page layouts and content into a single sequence, PaDoc allows for concurrent processing of layout and regional content, enhancing efficiency. This is achieved through a prefix-conditioned factorization that reduces decoding depth and leverages variable-length ancestor attention for better context preservation. The results show that PaDoc outperforms existing parsers in terms of accuracy and speed, making it a significant advancement in document parsing technology.'}, 'zh': {'title': 'PaDoc：高效的布局基础文档解析器', 'desc': '本文提出了一种名为PaDoc的布局基础解析器，旨在提高文档解析的效率。与传统的端到端解析器不同，PaDoc通过将预测的布局视为共享页面表示上的分支结构，来保留完整的页面上下文。该方法在解码过程中实现了区域级的并行处理，减少了解码深度，从而加快了解析速度。实验结果表明，PaDoc在多个指标上表现优异，尤其是在有效页面的吞吐量和延迟方面有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.05798', 'title': 'KVAE: Family of Tokenizers for Multimodal Generative Models', 'url': 'https://huggingface.co/papers/2608.05798', 'abstract': 'Abstract  Latent diffusion modeling (LDM), a prominent paradigm, utilizes tokenizers to map input signal to compressed representation. This dependency positions tokenizer as an integral part of generation process itself, since it affects learning speed, quality of synthesized samples and lay foundation for later applications. This report presents series of KVAE tokenizers for audio, image and video, all designed for subsequent text-conditioned generation: KVAE-Audio, a continuous full-band 48 kHz tokenizer with a 50 Hz latent of 64 channels; KVAE-3D -- two causal video tokenizers for 4x16x16 and 4x8x8 compression; KVAE-2D, an image model, compressing input by factor of 8 with 32 channels. We demonstrate that reconstruction (PSNR, LPIPS, PESQ, etc.) and generation results on objective (Frechet Distance, CLIP score, CLAP score, etc.) and subjective (side-by-side evaluation) metrics matches or surpasses frontier opensource tokenizers, such as VAEs from Wan-2.2, HunyuanVideo-1.5, FLUX.2, MovieGen, StableAudio and MMAudio. Considering difficulty of development, we share with community training details, model selection method and ablation on design choices. The code is publicly available at https://github.com/kandinskylab/kvae and https://github.com/kandinskylab/kvae-audio.', 'score': 10, 'issue_id': 2879, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '25004da864bf8b7b', 'authors': ['Andrey Shutkin', 'Denis Parkhomenko', 'Ivan Kirillov', 'Kirill Chernyshev', 'Kirill Malakhov', 'Ilia Vasiliev', 'Ilia Trushkin', 'Valeriya Kobenko', 'David Chikovani', 'Alexander Ivanov', 'Azat Saginbaev', 'Egor Silvestrov', 'Ivan Mikheev', 'Konstantin Zakharov'], 'affiliations': ['Kandinsky Lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.05798.jpg', 'data': {'categories': ['#diffusion', '#open_source', '#audio', '#dataset', '#multimodal', '#cv', '#video', '#3d'], 'emoji': '🎁', 'ru': {'title': 'Универсальные токенизаторы для эффективной текстовой генерации мультимодальных данных', 'desc': 'В статье представлены KVAE tokenizers — семейство автоэнкодеров для сжатия аудио, видео и изображений с целью последующей текстовой генерации. Авторы разработали специализированные модели для каждого модальности: KVAE-Audio для полнополосного аудио на 48 кHz, KVAE-3D для причинного сжатия видео и KVAE-2D для изображений. Токенизаторы показывают результаты, сравнимые или превосходящие известные открытые реализации, на метриках реконструкции (PSNR, LPIPS, PESQ) и генерации (Frechet Distance, CLIP score, CLAP score). Авторы делятся деталями обучения, методами отбора моделей и абляционным анализом, предоставляя код в открытый доступ.'}, 'en': {'title': 'Revolutionizing Media Generation with KVAE Tokenizers', 'desc': 'This paper introduces Latent Diffusion Modeling (LDM) with a focus on KVAE tokenizers for various media types including audio, images, and video. These tokenizers are crucial as they influence the efficiency and quality of the generated outputs by compressing input signals into manageable representations. The authors present several models, such as KVAE-Audio and KVAE-3D, which achieve impressive reconstruction and generation metrics, outperforming existing open-source tokenizers. Additionally, the paper provides insights into the training processes and design choices, making the code accessible for further research.'}, 'zh': {'title': '提升生成质量的KVAE分词器', 'desc': '潜在扩散建模（LDM）是一种重要的机器学习方法，它使用分词器将输入信号映射到压缩表示。分词器在生成过程中起着关键作用，因为它影响学习速度和合成样本的质量，并为后续应用奠定基础。本文介绍了一系列KVAE分词器，适用于音频、图像和视频，旨在进行文本条件生成。我们展示了这些分词器在重建和生成结果上与现有的开源分词器相比，达到了或超过了前沿水平，并分享了训练细节和模型选择方法。'}}}, {'id': 'https://huggingface.co/papers/2608.05784', 'title': 'Activity Frames: Deterministic Screen-Activity Compilation for Agent Memory and Replay', 'url': 'https://huggingface.co/papers/2608.05784', 'abstract': "Abstract  Computer-use agents pay full frontier inference to re-derive routines their user has already performed, because an agent's memory today records what the user said, not what the user did. We compile passively captured screen activity into agent memory with a deterministic, zero-model pipeline: it segments a local capture stream into typed activity frames, bounded episodes carrying application, site, timing, input volume, and evidence pointers back to the raw rows, with no model in the loop, so the output is byte-identical, cacheable, and mechanically auditable. On one professional's single-user corpus of 128,756 frames over 51 active days, the compiler reduces a day of raw capture to a prompt-ready context block 86x smaller in 68 ms, and an agent reading that block answers questions about the day at 98.4% accuracy (Wilson 95% CI 91.7-99.7%) against an independent oracle, versus 66-80% for an LLM summary of the same capture, a mid-tier model reading the block matching a frontier one.   The same compiler doubles as a demand-side cost instrument. Read off passive, pre-delegation human activity rather than agent rollouts, it supplies two parameters that agent-cost models assume but, to our knowledge, have not measured: the Routine Overhead Ratio R and the routine recurrence h. We report first values of R, a modeled upper bound, at 60-343x, and a delegable recurrence of 9.0% in-sample and 7.7% out-of-sample, for a realistic all-fleet token ceiling near 8%; a compiled routine replays deterministically with the model out of the loop, demonstrated live at zero model tokens on a guard-matched hit. Schema, compiler, and evaluation harness are open.", 'score': 8, 'issue_id': 2878, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': '79837be439691f9e', 'authors': ['Nossa Iyamu'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2608.05784.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Превращение экранной активности в эффективную память для компьютерных агентов', 'desc': 'В статье предлагается детерминированный конвейер обработки записанной активности экрана для создания памяти компьютерных агентов. Вместо сохранения только текстовых инструкций пользователя, система захватывает и структурирует реальные действия в виде типизированных фреймов активности без использования моделей машинного обучения. Агент, получая доступ к такому структурированному контексту, достигает точности 98.4% при ответах на вопросы о деятельности пользователя, значительно превосходя результаты LLM-обобщений. Дополнительно авторы измеряют ключевые параметры экономики использования агентов, включая коэффициент накладных расходов рутинных операций и частоту их повторения, что позволяет оптимизировать использование токенов.'}, 'en': {'title': 'Enhancing Agent Memory with Structured User Activity Capture', 'desc': 'This paper presents a method for improving computer-use agents by capturing user activity on their screens and storing it in a structured way. The approach uses a deterministic pipeline to segment screen captures into manageable frames that include important details like application usage and timing, without relying on complex models. The results show that this method significantly reduces the amount of data needed for the agent to understand user routines, while also achieving high accuracy in answering questions about user activity. Additionally, the paper introduces new metrics for measuring the efficiency of agent routines, providing valuable insights into the cost of agent operations.'}, 'zh': {'title': '智能代理的记忆重构与成本优化', 'desc': '这篇论文介绍了一种新的方法，通过被动捕获用户的屏幕活动，将这些活动编译成代理的记忆。该方法使用确定性、零模型的管道，将捕获的活动流分割成类型化的活动帧，包含应用程序、时间、输入量等信息。研究表明，这种编译器能够在极短的时间内将原始数据压缩为更小的上下文块，并且在回答问题时准确率高达98.4%。此外，该编译器还可以作为成本工具，提供代理成本模型所需的参数。'}}}, {'id': 'https://huggingface.co/papers/2608.04956', 'title': 'ContextMaster: Interactive Multi-Shot Video Creation via Fixed-Budget Sparse Context Routing', 'url': 'https://huggingface.co/papers/2608.04956', 'abstract': 'Abstract  Recent video models increasingly support generation, reference conditioning, and editing within a single model, yet typically expose them as separate operations over fixed inputs. Practical creation unfolds across multiple shots, requiring one model to generate from text, follow a reference, or edit source footage while maintaining shared history. We formalize this setting as interactive multi-shot video creation (IMVC) and introduce ContextMaster, a unified model with a role-aware context representation for these operations. An interactive model must retain access to an expanding history without allowing the context read cost at each denoising step to grow. ContextMaster combines reusable clean context states with fixed budget sparse context routing and uses ConstraintSink to keep task constraints visible. To address the dual challenges of sparse context access and inference with few denoising steps, we propose a two-stage privileged context distillation framework, which transfers full context behavior from a dense teacher through consistency distillation and then refines deployment rollouts with distribution matching. Experiments on the three primitive tasks demonstrate improved task fulfillment and consistency across shots over specialized baselines. User studies further validate flexibly composed workflows, while the model reaches 16 FPS on a single GPU.', 'score': 5, 'issue_id': 2870, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'fdfe850917f8bbb3', 'authors': ['Xu Guo', 'Zhengxuan Wei', 'Xinghui Li', 'Hanzhuo Huang', 'Xinyu Liu', 'Xiangyang Luo', 'Min Wei', 'Yiran Zhu', 'Qiulin Wang', 'Yulong Xu', 'Xintao Wang', 'Pengfei Wan', 'Qi Fan', 'Xiangwang Hou'], 'affiliations': ['Kling Team, Kuaishou Technology', 'Nanjing University', 'ShanghaiTech University', 'The Hong Kong University of Science and Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04956.jpg', 'data': {'categories': ['#inference', '#training', '#video'], 'emoji': '🎬', 'ru': {'title': 'Единая модель для многокадрового видеотворчества с эффективным управлением контекстом', 'desc': 'В статье предлагается ContextMaster — единая модель для интерактивного многокадрового видеосоздания, которая объединяет генерацию, условное преобразование и редактирование видео в одной системе. Модель использует роль-зависимое представление контекста с разреженной маршрутизацией для эффективного управления растущей историей без увеличения вычислительных затрат при каждом шаге денойзинга. Авторы предлагают двухэтапную схему дистилляции привилегированного контекста, которая передаёт поведение полного контекста от учителя через консистентную дистилляцию и затем уточняет инференс через сопоставление распределений. Экспериментальные результаты показывают улучшенное выполнение задач и консистентность между кадрами по сравнению со специализированными базовыми моделями, достигая скорости 16 FPS на одном GPU.'}, 'en': {'title': 'Revolutionizing Video Creation with ContextMaster', 'desc': "This paper presents ContextMaster, a novel model designed for interactive multi-shot video creation (IMVC), which allows users to generate, reference, and edit video content seamlessly. Unlike traditional models that treat these tasks as separate operations, ContextMaster maintains a shared context that evolves as the video progresses. It employs a role-aware context representation to efficiently manage the expanding history of video content while minimizing computational costs. The model's innovative two-stage privileged context distillation framework enhances performance by transferring knowledge from a dense teacher model, resulting in improved task fulfillment and consistency across multiple video shots."}, 'zh': {'title': '交互式多镜头视频创作的统一解决方案', 'desc': '最近的视频模型越来越支持在单一模型中进行生成、参考条件和编辑，但通常将它们作为固定输入上的独立操作。实际创作需要跨多个镜头进行，因此一个模型需要能够从文本生成、遵循参考或编辑源视频，同时保持共享历史。我们将这种设置正式化为交互式多镜头视频创作（IMVC），并引入了ContextMaster，一个具有角色感知上下文表示的统一模型。ContextMaster结合了可重用的干净上下文状态和固定预算的稀疏上下文路由，提出了一个两阶段的特权上下文蒸馏框架，以解决稀疏上下文访问和少量去噪步骤推理的双重挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.05424', 'title': 'Invisible Shortcuts: Why Vision Encoders Know Your Camera', 'url': 'https://huggingface.co/papers/2608.05424', 'abstract': 'Abstract  Deep vision models exploit shortcuts, relying on cues that correlate with supervision signals. Prior work has focused on visible biases, such as object-background or texture correlations. We identify a different source of shortcut learning: invisible metadata traces embedded at the pixel level, for metadata such as image processing and photo acquisition. We hypothesize that large-scale semantic supervision, whether through categorical labels (ImageNet) or billion-scale captions (LAION), naturally induces metadata-semantics correlations during pretraining, leading models to convert low-level signals into predictive features. By introducing controlled metadata-semantics correlations, we show that stronger ones produce systematically higher sensitivity to metadata traces and larger performance degradation under metadata distribution shifts. We further explore mitigation strategies applied during and after pretraining that reduce sensitivity not only to targeted metadata but also to unseen ones, without sacrificing performance on downstream tasks. Metadata sensitivity also has a positive side: it partly explains the strong generated-image detection ability of some encoders, while its mitigation can improve out-of-distribution generalization. Code: https://github.com/ryan-caesar-ramos/visual-encoder-traces', 'score': 4, 'issue_id': 2869, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '9cdd6618896d561a', 'authors': ['Vladan Stojnić', 'Ryan Ramos', 'Giorgos Kordopatis-Zilos', 'Noa Garcia', 'Giorgos Tolias'], 'affiliations': ['1', '2'], 'pdf_title_img': 'assets/pdf/title_img/2608.05424.jpg', 'data': {'categories': ['#training', '#benchmark', '#cv'], 'emoji': '🔍', 'ru': {'title': 'Скрытые метаданные как источник ошибочного обучения в моделях зрения', 'desc': 'Исследование показывает, что глубокие модели компьютерного зрения используют скрытые корреляции между метаданными изображений (информация об обработке и съёмке) и семантическими ярлыками, что приводит к обучению на артефактах вместо истинных признаков. Авторы демонстрируют, что чем сильнее корреляция между метаданными и семантикой, тем выше чувствительность модели к изменениям этих скрытых сигналов и ниже качество при сдвиге распределения данных. В работе предложены методы смягчения этой проблемы на этапах предварительного обучения и после него, которые снижают зависимость модели от метаданных без потери качества на целевых задачах. Неожиданный побочный эффект: чувствительность к метаданным помогает моделям обнаруживать сгенерированные изображения и улучшает обобщение на данные с распределением вне тренировочного множества.'}, 'en': {'title': 'Uncovering Hidden Metadata: The Key to Robust Vision Models', 'desc': 'This paper discusses how deep vision models can unintentionally learn from hidden metadata in images, which can lead to shortcut learning. The authors identify that these metadata traces, such as those from image processing and acquisition, can influence model predictions by creating correlations with the training data. They demonstrate that stronger metadata correlations can make models more sensitive to changes in metadata, resulting in decreased performance when faced with new data distributions. The paper also explores methods to reduce this sensitivity, which can enhance generalization to unseen data while maintaining performance on standard tasks.'}, 'zh': {'title': '揭示深度学习中的隐性元数据影响', 'desc': '深度视觉模型利用捷径，依赖与监督信号相关的线索。以往的研究主要关注可见的偏差，如物体与背景或纹理的相关性。我们发现了一种不同的捷径学习来源：嵌入在像素级别的不可见元数据痕迹，例如图像处理和拍摄信息。通过引入受控的元数据-语义相关性，我们展示了更强的相关性会导致模型对元数据痕迹的敏感性增加，并在元数据分布变化时性能显著下降。'}}}, {'id': 'https://huggingface.co/papers/2608.06257', 'title': 'MASS: Multiplayer World Models with Authoritative Shared State', 'url': 'https://huggingface.co/papers/2608.06257', 'abstract': 'Abstract  Current video world models struggle in multiplayer environments because they entangle world state with view-dependent visual latents, leading to redundant compute, view inconsistencies, and poor scalability. We propose MAS (Multiplayer world models with Authoritative Shared State) to resolve this limitation. Inspired by multiplayer game architectures, MAS disentangles world dynamics and view rendering. A learned Logic Engine advances a global, authoritative typed state from joint actions without any hand-written transition function, acting as the sole recurrent memory and synchronization reference. From this shared state, a learned Rendering Engine generates independent and consistent views for any requested camera on demand. This explicit disentangling allows MAS to achieve superior state accuracy and lower cross-view inconsistency compared to state-of-the-art multi-view baselines on a matched multiplayer Snake benchmark. It advances predicted worlds with 1,024 concurrent players for 10,000 recurrent steps. Our results show that explicit, authoritative state modeling provides a practical foundation for scalable and consistent multi-agent world simulation.', 'score': 3, 'issue_id': 2870, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'dc7e2d7fd3b8f700', 'authors': ['Ziqi Cai', 'Siqi Yang', 'Yimu Wang', 'Zixian Gao', 'Yunheng Liu', 'Shuchen Weng', 'Erwin Wu', 'Kaipeng Zhang', 'Boxin Shi'], 'affiliations': ['Alaya Lab', 'Institute of Science Tokyo', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.06257.jpg', 'data': {'categories': ['#multimodal', '#architecture', '#agents', '#video'], 'emoji': '👥', 'ru': {'title': 'Авторитетное общее состояние для масштабируемой мультиагентной симуляции', 'desc': 'Авторы предлагают MAS — архитектуру видео-модели мира для мультиплеерных сценариев, которая разделяет обучение динамики мира и рендеринга изображений. Логический движок обучается продвигать глобальное авторитетное состояние на основе совместных действий агентов, служа единственной рекуррентной памятью системы. Движок рендеринга независимо генерирует согласованные представления мира для произвольных камер на основе этого общего состояния. Подход достигает высокой точности предсказания состояния и низкой несогласованности между представлениями, масштабируясь до 1024 одновременных игроков на 10000 шагов.'}, 'en': {'title': 'Disentangling Dynamics for Scalable Multiplayer Simulations', 'desc': 'This paper introduces MAS, a new approach to video world models designed for multiplayer environments. MAS separates the world dynamics from the visual rendering, which helps to reduce redundant computations and improve scalability. It uses a Logic Engine to manage a global state based on the actions of all players, eliminating the need for complex transition functions. Additionally, a Rendering Engine creates consistent views for any camera angle, leading to better accuracy and less inconsistency in multiplayer simulations.'}, 'zh': {'title': '解耦视图与状态，实现多人游戏的高效模拟', 'desc': '当前的视频世界模型在多人环境中存在问题，因为它们将世界状态与视角依赖的视觉潜变量混合在一起，导致计算冗余、视角不一致和扩展性差。我们提出了MAS（多玩家世界模型与权威共享状态）来解决这一限制。MAS通过解耦世界动态和视图渲染，借鉴了多人游戏架构。通过学习的逻辑引擎和渲染引擎，MAS能够生成一致的视图，并在多人游戏基准测试中实现更高的状态准确性和更低的视角不一致性。'}}}, {'id': 'https://huggingface.co/papers/2608.06216', 'title': 'Continual Learning in Transition', 'url': 'https://huggingface.co/papers/2608.06216', 'abstract': 'Abstract  Classical continual learning (CL) has primarily focused on enabling models to update and retain knowledge through parameter-centric mechanisms, e.g., training strategies, architectural designs, and weight adaptation. However, emerging paradigms are reshaping the scope of CL beyond this traditional model adaptation view. For instance, on-policy learning broadens the space of update mechanisms; test-time training extends CL from the training phase to inference; and external harness components such as memory, skill libraries, and interaction protocols extend the evolutionary boundaries of model capabilities far beyond the static parameter space. Collectively, these developments indicate a transition from parameter-centric learning toward system-level adaptation. To characterize this transition, we examine the evolution of continual learning through three dimensions: When, How, and Where learning occurs. The How dimension encompasses off-policy, on-policy, and beyond-gradient optimization mechanics. The When dimension captures evolution across pre-training, post-training, and inference-time stages. The Where dimension delineates updates occurring within internal parameters versus external structural constraints. Anchored by this tri-axial framework, we systematically survey representative methods, trace the ongoing transition of continual learning, and discuss the key challenges, broader implications, and future directions arising from this paradigm shift.', 'score': 2, 'issue_id': 2871, 'pub_date': '2026-08-06', 'pub_date_card': {'ru': '6 августа', 'en': 'August 6', 'zh': '8月6日'}, 'hash': 'd87da3ba37ae5593', 'authors': ['Zhiyan Hou', 'Dan Zhang', 'Tao Feng', 'Liyuan Wang', 'Wei Li', 'Xiangzhao Hao', 'Hongyan An', 'Junfeng Fang', 'Haokai Ma', 'Zhaohui Xu', 'Haiyun Guo', 'Jinqiao Wang', 'Tat-Seng Chua'], 'affiliations': ['Alibaba Group', 'Institute of Automation, Chinese Academy of Sciences', 'National University of Singapore', 'School of Artificial Intelligence, University of Chinese Academy of Sciences', 'Shanghai Jiao Tong University', 'Tsinghua University', 'Wuhan Artificial Intelligence Research Institute'], 'pdf_title_img': 'assets/pdf/ti
