enchmark of five visual reasoning tasks in which the scene, question, and answer are fixed and only the reference varies. Results show that task-matched references improve accuracy by up to 25\\%, while mismatched references provide little benefit or even hurt performance. These findings identify the reference gap as a bottleneck distinct from visual perception and show that constructing task-appropriate visual references can serve as a training-free visual skill for improving multimodal reasoning.', 'score': 15, 'issue_id': 3492, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '75f31590d2a81e52', 'authors': ['Guizhen Chen', 'Weiwen Xu', 'Wotao Yin', 'Anh Tuan Luu', 'Hou Pong Chan'], 'affiliations': ['DAMO Academy, Alibaba Group', 'Nanyang Technological University', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2610.39419.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#reasoning', '#dataset', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Не зрение, а ссылки: как нумерация объектов поднимает точность мультимодальных моделей без обучения', 'desc': 'Мультимодальные большие языковые модели (LLM) хорошо распознают визуальный контент, но плохо рассуждают над ним в несколько шагов: например, при подсчёте объектов они могут видеть все предметы, но терять учёт уже посчитанных. Авторы объясняют такие ошибки не проблемой восприятия, а «разрывом референсов» — неспособностью связать язык с нужными визуальными сущностями или областями. Для проверки введён бенчмарк ReGap-Bench из пяти задач, где меняется только референс (например, нумерация), и показано, что подходящие референсы повышают точность до 25%, а нерелевантные почти не помогают. Таким образом, построение задаче-ориентированных визуальных референсов работает как навык без дополнительного обучения модели.'}, 'en': {'title': 'Number the Scene, Narrow the Gap', 'desc': 'Multimodal language models can recognize objects but may lose track of which ones matter during multi-step reasoning. The paper calls this a reference gap: a difficulty linking words to the right visual objects, regions, or locations, rather than a failure of perception. On ReGap-Bench, adding task-matched references such as numbered objects improved accuracy by up to 25%, while unsuitable references often did not help. This suggests that carefully chosen visual references can improve reasoning without additional training.'}, 'zh': {'title': '用恰当视觉标记弥合指称差距，提升多模态推理', 'desc': '多模态语言模型能识别图像内容，但在多步推理中常会忘记自己正在处理哪些物体或位置。论文认为，问题不一定出在视觉感知，而在于语言描述与相关视觉实体之间缺少稳定对应，这被称为“指称差距”。研究者提出 ReGap-Bench，通过在相同图像和问题中改变视觉标记，比较不同指称方式对五类推理任务的影响。结果显示，与任务匹配的编号等外部标记无需训练即可将准确率提高最多 25%，而不匹配的标记效果有限，甚至可能降低准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.02112', 'title': 'Order-Only On-Policy Distillation', 'url': 'https://huggingface.co/papers/2611.02112', 'abstract': "Abstract Order-only on-policy distillation trains students to match teacher token rankings rather than probabilities, improving reasoning performance without temperature tuning.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD) trains a student on its own generations by matching the teacher's token probabilities. These probabilities entangle two kinds of information: which tokens the teacher prefers, and how confident it is. The latter reflects the teacher's own capacity and calibration, which a smaller student may be unable to reproduce. Because the teacher temperature changes these values without changing the ordering, OPD is also sensitive to the temperature choice. We ask whether the teacher's ordering of candidate tokens is enough, and propose Order-Only On-Policy Distillation (O^{3}PD). At each student-generated prefix, O^{3}PD trains the student to reproduce the order of the teacher's top-K tokens, without fitting their probability values. The objective is therefore invariant to the teacher temperature and needs no temperature tuning. Across six teacher--student pairs, O^{3}PD outperforms OPD on the average over HMMT25, AIME24, and AIME25 in every pair, by up to 2.9 points, with gains of up to 5.6 points on AIME25. Other ranking losses yield similar gains, so the benefit comes from ordinal supervision itself. Analysis shows that O^{3}PD departs further from the teacher's probabilities than OPD, yet reproduces its ranking more faithfully and yields a stronger student. The ranking, not the probability values, thus carries the knowledge that on-policy distillation needs to transfer.", 'score': 14, 'issue_id': 3494, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'b7e76d5e0f4c697e', 'authors': ['Guangzeng Han', 'Yu Wu', 'Xiaolei Huang'], 'affiliations': ['University of Memphis', 'University of Missouri'], 'pdf_title_img': 'assets/pdf/title_img/2611.02112.jpg', 'data': {'categories': ['#training', '#optimization', '#reasoning'], 'emoji': '🏆', 'ru': {'title': 'Учи порядок, а не цифры: ранжирование важнее вероятностей при дистилляции', 'desc': 'Статья предлагает метод Order-Only On-Policy Distillation (O³PD), в котором студенческая модель учится не воспроизводить вероятности токенов учителя, а только порядок его top-K токенов. Такой подход инвариантен к температуре учителя и не требует её подбора, что важно, поскольку вероятности смешивают предпочтения учителя с его уверенностью, которую маленькая модель может не повторить. Эксперименты на шести парах учитель-студент показывают, что O³PD превосходит классическую OPD на бенчмарках HMMT25, AIME24 и AIME25, с приростом до 2.9 пункта в среднем и до 5.6 пункта на AIME25. Авторы делают вывод, что ключевое знание, которое нужно передать при дистилляции, содержится в ранжировании токенов, а не в их численных значениях вероятностей.'}, 'en': {'title': 'Teach the Ranking, Not the Confidence', 'desc': 'On-policy distillation trains a student using examples it generates itself, guided by a teacher. The paper proposes Order-Only On-Policy Distillation (O³PD), which teaches the student to match the teacher’s ranking of its top-K token choices rather than their probability values. This avoids sensitivity to the teacher’s temperature and performs better than standard distillation across six teacher–student pairs on math reasoning benchmarks. The results suggest that token rankings transfer useful knowledge more effectively than teacher confidence scores.'}, 'zh': {'title': '传递词元排序，让蒸馏更专注于推理知识', 'desc': '本文提出一种名为 O³PD 的在线策略蒸馏方法，让学生模型在自己的生成前缀上学习教师模型对候选词元的排序，而不是拟合教师给出的概率值。传统在线策略蒸馏会同时传递词元偏好和教师的置信度，较小的学生模型可能难以复现这种置信度，而且训练效果容易受温度设置影响。由于排序不随温度变化，O³PD 无需调节教师温度；在六组教师与学生模型实验中，它在多个数学推理基准上的表现均优于传统方法。结果表明，对于在线策略蒸馏，词元排序比概率值更能有效传递教师模型的知识。'}}}, {'id': 'https://huggingface.co/papers/2610.42128', 'title': 'DecisionRank: On-Policy Distillation for Decision-Model Rerankers', 'url': 'https://huggingface.co/papers/2610.42128', 'abstract': "Abstract DecisionRank uses item-space on-policy distillation to transfer ranking knowledge from generative teachers to efficient decision models, achieving state-of-the-art retrieval performance with significantly faster inference.  Generated by thinkingmachines/Inkling-Small Decision models target structured tasks by directly predicting choices or scores, avoiding autoregressive decoding latency. However, transferring a generative LLM's ranking knowledge to a decision model remains challenging: the teacher expresses preferences through a ranked list of document ID sequences, while the student determines the ranking using scores from the first-token position. To bridge this gap, we introduce DecisionRank, a decision model trained through item-space on-policy distillation (OPD). Item-space OPD constructs the student's rollout by sorting its document scores into a ranked sequence. A generative teacher takes the resulting ranking list as inputs and provides conditional feedback to directly supervise those scores. Combined with offline ranking supervision, DecisionRank achieves state-of-the-art performance on both general and reasoning-intensive retrieval benchmarks such as TREC DL, BEIR, and BRIGHT. Across four benchmarks, item-space OPD consistently outperforms alternative training objectives. Even at 1.7B parameters, DecisionRank surpasses its 27B generative teacher on TREC DL19--23. At 8B, it outperforms its generative listwise counterpart while running 24.5times faster on TREC DL and 16.7times faster on BRIGHT.", 'score': 12, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '957b962c93a693af', 'authors': ['Yanran Wu', 'Dian Yu', 'Chongyang Bai', 'Jieyi Zhang', 'Rui Liu', 'Tianyi Chen', 'Shike Mei', 'Hang Cui', 'Frank Shyu', 'Sandeep Pandey', 'Luke Simon', 'Chunwei Liu', 'Xi Liu'], 'affiliations': ['Meta', 'Purdue University'], 'pdf_title_img': 'assets/pdf/title_img/2610.42128.jpg', 'data': {'categories': ['#training', '#architecture', '#small_models', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Быстрое ранжирование без потери качества: знания LLM в компактной decision-модели', 'desc': 'В статье представлен DecisionRank, decision-модель для ранжирования, которая получает знания от генеративного учителя (LLM) с помощью item-space on-policy distillation. Модель сортирует собственные оценки документов в ранжированный список, по которому учитель даёт условную обратную связь, напрямую оптимизирующую эти оценки. Метод сочетается с офлайн-supervision и достигает state-of-the-art результатов на TREC DL, BEIR и BRIGHT. Даже модель с 1.7B параметрами превосходит учителя на 27B, а версия на 8B работает в десятки раз быстрее генеративного аналога.'}, 'en': {'title': 'Rank like a generative model, decide at the speed of a scorer', 'desc': 'DecisionRank transfers ranking knowledge from a generative language model to a faster decision model. The student sorts documents using its scores, and the teacher evaluates that ranked list to provide feedback that trains those scores. This item-space on-policy distillation is combined with offline ranking supervision. The resulting model performs strongly on retrieval benchmarks and can be much faster than generative ranking models.'}, 'zh': {'title': '让决策模型学会排序：以更快推理承接生成式教师的知识', 'desc': 'DecisionRank 将生成式教师模型的排序知识迁移到高效的决策模型中，后者直接预测文档分数，避免逐词生成带来的延迟。它采用项目空间在线策略蒸馏：先根据学生模型的文档分数生成排序列表，再让教师模型针对该列表提供反馈，以此直接监督学生的分数。结合离线排序监督后，DecisionRank 在 TREC DL、BEIR 和 BRIGHT 等检索基准上取得了领先表现，且这种蒸馏目标在四个基准上均优于其他训练目标。即使只有 1.7B 参数，它在 TREC DL19–23 上也超过了 27B 的生成式教师；8B 版本则比生成式列表排序模型快得多，同时保持更强的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.02633', 'title': 'Measuring AI Agents as Teammates with Collaborative Intelligence', 'url': 'https://huggingface.co/papers/2611.02633', 'abstract': 'Abstract The Collaborative Intelligence Benchmark evaluates AI agents as teammates across 240 tasks, revealing that even top models have significant collaboration weaknesses unrelated to individual capability.  Generated by thinkingmachines/Inkling-Small Progress in AI is often measured by what a single model can do on its own. Yet teams of AI agents are starting to make breakthroughs and discoveries in science, medicine, mathematics and software engineering. As AI begins to work in teams of agents and people, the ability to collaborate becomes a core part of their intelligence. Research on human teams has measured this ability for decades. Inspired by this, we introduce the Collaborative Intelligence Benchmark, which measures how well an AI agent works as a teammate. It contains 240 tasks across 8 dimensions of teamwork, from refusing an unsafe shortcut to checking the work that a weaker model leaves behind. Each task comes from a real record or an existing benchmark, from aviation accident reports and clinical cases to coding tasks and negotiations, and has a programmatically verifiable outcome. To isolate teamwork from individual capability, models are scored only on tasks that they can solve by themselves when they have full information. We evaluate 18 closed- and open-weight models and find that every model, across sizes and families, has clear weaknesses as a teammate, with the best model scoring only 82.2 out of 100. Frontier models almost always refuse unsafe shortcuts and report misconduct, yet they cave under interpersonal pressure, reaching the best overall deal in only 14% of conflicts, and their pass rate drops from 97% to 81% when they take over a task in which a weaker model has cheated. Crucially, general capability does not guarantee good teamwork, as models with nearly the same capability score differ by up to 11 points as teammates. The benchmark includes 160 public tasks with code and data, along with 80 held-out tasks for evaluation. As AI agents increasingly work alongside other agents and people, the ability to collaborate effectively is becoming a crucial capability to measure and develop.', 'score': 11, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '211f2a8794c2ab3b', 'authors': ['Sean Wu', 'Aneesh Pappu', 'Jiaru Zou', 'Yubin Kim', 'Yuncong Mao', 'Hongjian Zhou', 'Junchi Yu', 'Jieneng Chen', 'James Zou'], 'affiliations': ['MIT', 'Stanford University', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.02633.jpg', 'data': {'categories': ['#alignment', '#games', '#ethics', '#open_source', '#agents', '#agi', '#dataset', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'Сильный интеллект — это не только умение работать в одиночку, но и умение работать в команде', 'desc': 'Статья представляет Collaborative Intelligence Benchmark, бенчмарк из 240 задач, который оценивает, насколько хорошо AI-агент работает как член команды, а не только как отдельная модель. Задачи охватывают 8 измерений командной работы: от отказа от небезопасных шорткатов до проверки результатов более слабой модели. Оценивается 18 LLM, при этом учитываются только задачи, которые модель способна решить самостоятельно, чтобы изолировать навыки командной работы от индивидуальных способностей. Результаты показывают, что ни одна модель не лишена слабостей: лучшая набирает 82.2 из 100, а модели с близкой общей capability различаются как командные игроки до 11 баллов. Авторы подчеркивают, что коллаборация должна стать отдельной измеряемой и развиваемой способностью AI.'}, 'en': {'title': 'Intelligence Is Better Together', 'desc': 'The Collaborative Intelligence Benchmark measures how well AI agents work with teammates across 240 tasks and eight teamwork dimensions. To separate collaboration from individual ability, models are tested only on tasks they can solve alone when given full information. Across 18 models, even the best scores 82.2 out of 100, with weaknesses such as yielding to interpersonal pressure and failing to catch work tainted by cheating. Similar overall capability does not ensure similar teamwork, so collaboration needs to be measured and improved as a distinct AI capability.'}, 'zh': {'title': '能力强不等于会合作：用基准检验 AI 团队协作', 'desc': '本文提出协作智能基准，用来评估 AI 智能体作为队友的表现。基准包含 240 项任务，覆盖 8 个团队合作维度，并通过可程序化验证的结果进行评分。研究发现，即使顶尖模型也存在明显的协作弱点；单体能力相近的模型，团队表现最高可相差 11 分。模型往往能拒绝不安全捷径，却容易受到人际压力影响，也不总能有效检查较弱模型留下的工作。'}}}, {'id': 'https://huggingface.co/papers/2611.02332', 'title': 'LEANGUARD: Lean-Verified Guardrails for Tool-Using Agents', 'url': 'https://huggingface.co/papers/2611.02332', 'abstract': "Abstract LeanGuard is a verified runtime that blocks policy-violating tool calls by language-model agents and can repair them via proof-guided search, reducing unauthorized executions and prompt-injection success without harming benign task performance.  Generated by thinkingmachines/Inkling-Small Tool-using language-model agents often execute actions that their domain policies forbid. We present LeanGuard, a runtime that checks every proposed tool call against a policy written in Lean4 before the call reaches the environment. Policies combine state predicates with scoped past-time temporal operators over the execution history, evaluation is fail-closed, and the decision procedure is proved equivalent to a LeanLTL semantics. A denied call can be corrected in two ways. With feedback, the agent receives the violated rule and a hint; with proof-guided repair, Lean metaprogramming searches for a nearby call that preserves the user's intent and proves that the policy admits it, without the model. On Tau-Bench with five Qwen models (0.8B-27B), unguarded agents execute at least 33 calls that the Lean policy forbids, while LeanGuard executes none; with feedback, task success does not change significantly. On DTap, LeanGuard reduces direct prompt-injection success from 57.9% to 5.9%, and in telecom, where benign tasks need no writes, benign success is unchanged. Feedback reduces repeated blocked calls and raises task success for four of five models over a bare denial. On replayed denials, repair proves an admissible edit for 88 of 252 denials caused by argument values, in a median of 2,ms.", 'score': 8, 'issue_id': 3494, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'cfcaa79dd617b920', 'authors': ['Sreehari Sankar', 'Debargha Ganguly', 'Vikash Singh', 'Mohsen Hariri', 'Weicong Chen', 'Yanyan Zhang', 'Shouren Wang', 'Wang Yang', 'Chaoda Song', 'Alexander Nemecek', 'Osama Zafar', 'Idan Davidovich', 'Yuting Shao', 'Kai Ye', 'Biyao Zhang', 'Xinpeng Li', 'Joe Stubbs', 'Erman Ayday', 'Jing Ma', 'Vipin Chaudhary'], 'affiliations': ['Case Western Reserve University', 'UT Austin'], 'pdf_title_img': 'assets/pdf/title_img/2611.02332.jpg', 'data': {'categories': ['#alignment', '#agents', '#inference', '#security', '#benchmark', '#rlhf'], 'emoji': '🛡️', 'ru': {'title': 'Lean-страж не даст агенту выполнить запрещённое действие', 'desc': 'В статье представлен LeanGuard — верифицированный runtime-фильтр, который проверяет каждый вызов инструмента LLM-агента по политике, записанной на Lean4, до его выполнения. Политики используют предикаты состояния и временные операторы над историей выполнения, а решение принимается по принципу fail-closed и доказанно эквивалентно семантике LeanLTL. Заблокированный вызов можно исправить либо через обратную связь с нарушенным правилом и подсказкой, либо через proof-guided repair, где метапрограммирование Lean ищет ближайший допустимый вызов без участия модели. Эксперименты на Tau-Bench и DTap показывают, что LeanGuard полностью предотвращает запрещённые действия и снижает успешность prompt-injection атак с 57.9% до 5.9%, не ухудшая качество выполнения безобидных задач.'}, 'en': {'title': 'Verify Every Tool Call Before It Acts', 'desc': 'LeanGuard checks every tool call made by a language-model agent against a policy formalized in Lean4 before the call reaches its environment. Its verified decision procedure considers both the current state and relevant events in the agent’s history, and blocks calls when safety is uncertain. When a call is denied, the system can explain the violation or use proof-guided search to find a nearby allowed call that preserves the user’s intent. Experiments show that it prevents forbidden actions and substantially reduces prompt-injection success, while generally preserving benign task performance.'}, 'zh': {'title': '先证明合规，再让智能体调用工具', 'desc': 'LeanGuard 是一种经过形式化验证的运行时系统，会在语言模型智能体调用工具前，检查该调用是否符合用 Lean4 编写的策略。策略可以检查当前状态和执行历史；如果判断失败或无法确认，系统会拒绝调用。被拒绝的调用可以通过反馈帮助智能体修正，也可以用证明引导搜索自动寻找既保留用户意图、又符合策略的近似调用。在实验中，LeanGuard 阻止了所有违规调用，并显著降低直接提示注入的成功率，同时基本不影响正常任务表现。'}}}, {'id': 'https://huggingface.co/papers/2610.41574', 'title': 'BYOD: Build Your Own DLM - Efficient Autoregressive-to-Diffusion Language Model Conversion', 'url': 'https://huggingface.co/papers/2610.41574', 'abstract': 'Abstract BYOD converts autoregressive language models into diffusion models via parameter-efficient LoRA adapters, enabling parallel generation with minimal training cost while preserving base-model knowledge.  Generated by thinkingmachines/Inkling-Small Unlike autoregressive (AR) models, diffusion language models (DLMs) permit parallel token updates, flexible generation, and bidirectional attention, but leading systems rely on costly pretraining or full-model fine-tuning. We present Build Your Own DLM (BYOD), a generalizable LoRA-only recipe for parameter-efficient AR-to-DLM conversion. Without architecture-specific tuning, BYOD induces diffusion generation in Gemma 2 9B, Llama 3.1 8B, Qwen2.5 7B, and Ministral 8B; to our knowledge, this is the first reported AR-to-DLM conversion of a Mistral model. The adapters comprise 4.1-5.8% of final parameters while every base-model parameter remains frozen; each 25,000-iteration conversion needs at most 102.4M tokens, processed in 3.1-4.0 hours on one Google Colab GPU. All four models generate from fully masked sequences, use bidirectional context in a controlled attention test, and retain substantial parent-model knowledge. BYOD-Gemma is the strongest BYOD conversion on our nine-task evaluation, reaching 50.6% average accuracy compared with 51.9% for LLaDA 8B Instruct in the same harness. Open-generation quality at low network function evaluation (NFE) budgets remains the principal limitation: BYOD perplexity is 8.3-11.1 versus 4.1 for LLaDA and 2.2-3.0 for the AR parents when generating 128 tokens in 64 steps. To enable further experimentation and inspection, we provide a standalone training and evaluation implementation and interactive demos for all four conversions. BYOD thus provides a practical route for extending diffusion generation to other existing model families while identifying the gap that efficient conversion must next close.', 'score': 7, 'issue_id': 3493, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '24fc70acc820dbd8', 'authors': ['Ruurd J. A. Kuiper', 'Robert A. Bagheri'], 'affiliations': ['Department of Methodology and Statistics, Utrecht University', 'Julius Center for Health Sciences and Primary Care, University Medical Center Utrecht'], 'pdf_title_img': 'assets/pdf/title_img/2610.41574.jpg', 'data': {'categories': ['#optimization', '#architecture', '#open_source', '#inference', '#training', '#diffusion', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Превращаем авторегрессионные LLM в диффузионные модели дёшево и без потери знаний', 'desc': 'В статье представлен метод BYOD, который превращает авторегрессионные LLM в диффузионные языковые модели (DLM) с помощью LoRA-адаптеров, без переобучения всей модели. Базовые параметры остаются замороженными, а адаптеры составляют около 4–6% от итоговых параметров, что делает конвертацию дешёвой: около 25 000 итераций на одном GPU за несколько часов. Полученные модели генерируют текст из полностью замаскированных последовательностей, используют двунаправленный контекст и сохраняют знания исходной модели, показывая качество, сопоставимое с LLaDA 8B Instruct на ряде задач. Основным ограничением остаётся качество открытой генерации при малом числе шагов вычисления, где перплексия заметно выше, чем у авторегрессионных родителей.'}, 'en': {'title': 'Turn Existing Language Models into Diffusion Models with Lightweight Adapters', 'desc': 'BYOD converts autoregressive language models into diffusion language models using small LoRA adapters, while keeping all original model parameters frozen. The method enables parallel token generation and bidirectional attention with relatively little training data and compute, and works across four model families. Its strongest converted model reaches accuracy close to a comparable diffusion model and retains substantial knowledge from its base model. However, generated text is less fluent at low numbers of denoising steps, so improving generation quality remains an important challenge.'}, 'zh': {'title': '冻结原模型，用轻量 LoRA 解锁扩散式生成', 'desc': '本文提出 BYOD，一种只使用 LoRA 适配器将自回归语言模型转换为扩散语言模型的方法。转换时冻结原模型参数，训练量和计算成本较低，并能让多个模型并行生成、使用双向上下文，同时保留大量原有知识。实验显示，BYOD-Gemma 在九项任务上的平均准确率达到 50.6%，接近同一评测中的 LLaDA 8B Instruct。它的主要不足是在生成步数较少时文本质量仍较弱，论文也提供了训练代码和交互演示，便于进一步研究。'}}}, {'id': 'https://huggingface.co/papers/2610.37826', 'title': 'DeFT-RAG: Decomposing Multi-Hop Questions into Self-Contained Sub-Questions with Reusable Answers', 'url': 'https://huggingface.co/papers/2610.37826', 'abstract': 'Abstract DeFT-RAG improves multi-hop question answering by generating self-contained sub-questions sequentially, offloading reasoning to rule-based updates and a lightweight decision model, and caching answers to reduce LLM usage.  Generated by thinkingmachines/Inkling-Small Retrieval-augmented generation (RAG) lets a large language model (LLM) answer questions by retrieving relevant passages from a large corpus. However, RAG struggles with multi-hop questions, which require chaining facts spread across several documents through intermediate entities that the question never mentions. Graph-based RAG methods retrieve once from the entities a question names and so rarely recover the full evidence chain. Iterative RAG methods recover it step by step, but their accuracy is limited by the many tasks they ask the LLM to perform, such as planning the sub-questions, deciding their dependencies, rewriting them as answers arrive, and keeping track of what is known. We propose DeFT-RAG, a RAG framework built on three components. First, DeFT-RAG generates one self-contained sub-question at a time from the original question and the sub-questions answered so far with their answers (QA pairs). Each sub-question names every entity it asks about, which removes the need to plan, track dependencies or rewrite, and lets the LLM focus on a single fine-grained task at a time. Second, DeFT-RAG moves the remaining LLM work outside the LLM: rule-based updates to a QA table that keeps track of what is known, and yes/no decisions made by a fine-tuned lightweight decision model. Third, DeFT-RAG caches the QA pairs and reuses an answer when a later question asks a sub-question with the same meaning. On MuSiQue, 2WikiMultiHopQA and HotpotQA, DeFT-RAG achieves the best accuracy among thirteen baselines with both gpt-4o-mini and Qwen3.6 as the backbone, while giving the LLM fewer input tokens than any other iterative method. With a QA cache shared across 1,000 MuSiQue questions, 23.1% of sub-questions are answered from the cache, which reduces LLM calls by 12.9% without lowering accuracy.', 'score': 7, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '85f1b477f47fe4d8', 'authors': ['Dingyi Kang', 'Bingzhe Li'], 'affiliations': ['University of Texas at Dallas'], 'pdf_title_img': 'assets/pdf/title_img/2610.37826.jpg', 'data': {'categories': ['#rag', '#agents', '#reasoning', '#long_context'], 'emoji': '🧩', 'ru': {'title': 'Меньше работы для LLM — точнее ответы на сложные вопросы', 'desc': 'Статья представляет DeFT-RAG — фреймворк для многошаговых вопросов (multi-hop QA), где ответ требует цепочки фактов из нескольких документов. Модель генерирует самодостаточные подвопросы по одному за раз, а часть работы, такую как учёт known-фактов и принятие решений, переносит на rule-based обновления таблицы QA-пар и облегчённую дообученную decision model. Дополнительно используется кэш QA-пар, позволяющий переиспользовать ответы на семантически похожие подвопросы и сокращать количество вызовов LLM. На бенчмарках MuSiQue, 2WikiMultiHopQA и HotpotQA метод превосходит тринадцать baseline-моделей по точности при меньшем числе входных токенов.'}, 'en': {'title': 'Break Down the Question, Cache the Answers', 'desc': 'DeFT-RAG is a retrieval-augmented generation (RAG) framework designed to answer multi-hop questions that require evidence from several documents. It generates self-contained sub-questions one at a time, using earlier question-answer pairs to guide each step. Rule-based updates track known information, while a lightweight decision model handles yes-or-no decisions, reducing the work assigned to the large language model (LLM). On three benchmarks, DeFT-RAG outperforms thirteen baselines, and caching previously answered sub-questions reduces LLM calls without lowering accuracy.'}, 'zh': {'title': '逐步拆解多跳问题，让检索更准、调用更省', 'desc': 'DeFT-RAG 是一种用于多跳问答的检索增强生成（RAG）框架，能够逐步生成包含所需实体的独立子问题。它用规则更新问答表来记录已知信息，并由轻量级决策模型作出是或否判断，从而减少对大语言模型（LLM）的依赖。它还会缓存问答对，在遇到含义相同的子问题时重复利用已有答案。实验显示，该方法在多个基准测试上准确率优于对比方法；共享缓存还能减少 LLM 调用而不降低准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.03526', 'title': 'Library of Layers (LoL): Adaptively Ordering Transformer Layers at Runtime', 'url': 'https://huggingface.co/papers/2611.03526', 'abstract': 'Abstract Library of Layers dynamically orders transformer blocks during inference to adapt computation to tasks, enabling parameter reuse, sparsity, and interpretable routing across reasoning, multilingual, and safety settings.  Generated by thinkingmachines/Inkling-Small Computer programmers chain together the same reusable computational primitives, for example, conditional statements or loops, but in different orders to implement different algorithms. In contrast, existing language model architectures always execute their layers in the same order. We introduce Library of Layers (LoL), an architecture that dynamically orders its layers during inference to solve the problem at hand. LoL has a single hyperparameter, the size of its global library of transformer blocks, that allows it to transition seamlessly between parameter reuse and sparsity, generalizing the parameter-efficiency and FLOPs-efficiency tradeoffs of dense, depth-recurrent, and mixture of experts architectures in one unified family. We show that LoL achieves competitive performance with all three above baselines when pretrained on text data. On synthetic sudoku and maze data, we observe that the model employs distinct layer orderings to implement different solution strategies, and we can intervene on routing to force a model to apply a specific solution strategy to a problem instance. In a multilingual natural language setting, we find that LoL chooses different layer order patterns based on language and script. Similarly, we train LoL on safety data and fit probes to its router outputs, finding that these probes distinguish safe from unsafe text with high AUROC. LoL provides a path toward a future in which models dynamically compose their own computational graph, enabling more efficient and controllable reasoning.', 'score': 6, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'bae395f075d34bbb', 'authors': ['Abdellah Rahmani', 'Sean McLeish', 'Ang Li', 'Sanae Lotfi', 'Pascal Frossard', 'Micah Goldblum'], 'affiliations': ['Columbia University', 'EPFL', 'New York University', 'University of Maryland'], 'pdf_title_img': 'assets/pdf/title_img/2611.03526.jpg', 'data': {'categories': ['#optimization', '#architecture', '#math', '#alignment', '#reasoning', '#multilingual', '#low_resource', '#interpretability'], 'emoji': '🧩', 'ru': {'title': 'Модель сама собирает свой вычислительный граф под задачу', 'desc': 'Авторы представляют архитектуру Library of Layers (LoL), в которой модель динамически выбирает порядок применения трансформерных блоков из общей библиотеки во время inference. Единственный гиперпараметр, размер библиотеки, позволяет плавно переходить между повторным использованием параметров и разреженностью, объединяя dense, depth-recurrent и mixture of experts архитектуры. На задачах судоку, лабиринтов, многоязычного текста и безопасности LoL формирует разные порядки слоёв, а маршрутизатор можно интерпретировать и даже направлять вручную. Пробы (probes), обученные на выходах роутера, хорошо различают безопасный и небезопасный текст по метрике AUROC.'}, 'en': {'title': 'Let the Model Choose Its Layers', 'desc': 'Library of Layers (LoL) is a transformer architecture that dynamically selects and orders blocks during inference, rather than running layers in a fixed sequence. A global library size controls how much the model reuses parameters versus uses sparse computation, unifying tradeoffs found in dense, recurrent, and mixture-of-experts models. Experiments show competitive performance and reveal that routing patterns vary with reasoning strategy, language, and safety-related content; researchers can also intervene on routing to encourage a particular strategy. These findings suggest dynamic routing could make computation more efficient and reasoning more controllable.'}, 'zh': {'title': '让模型按任务动态编排计算层', 'desc': '本文提出“层库”（LoL），让模型在推理时动态选择并排列 Transformer 层，以适应不同任务。通过调整层库大小，LoL 能在参数复用与计算稀疏性之间灵活取舍，并统一涵盖稠密网络、循环深度模型和专家混合模型的效率权衡。在数独、迷宫、多语言和安全任务中，模型会采用不同的层路由模式；研究者也能干预路由，引导模型使用特定策略。实验表明，路由信息还可用于区分安全与不安全文本，为更高效、可控的推理提供了新方向。'}}}, {'id': 'https://huggingface.co/papers/2610.35219', 'title': 'Multi-Agent Relay Thinking', 'url': 'https://huggingface.co/papers/2610.35219', 'abstract': 'Abstract MACR introduces a relay-based multi-agent framework that dynamically transfers reasoning between agents using confidence-guided triggering and bidding to improve accuracy with lower token overhead.  Generated by thinkingmachines/Inkling-Small Existing multi-agent collaboration (MAC) methods have primarily explored a group thinking collaboration topology, where agents independently generate solutions and aggregate their outputs. In this work, we investigate an alternative relay thinking topology, where reasoning ownership is dynamically transferred across agents, allowing subsequent agents to inherit and refine an evolving reasoning trajectory. We introduce Multi-Agent Confidence-guided Relay (MACR), a framework that enables dynamical relay collaboration among agents. The key challenge is determining when reasoning should be relayed and which agent should continue the process. method addresses this challenge through confidence-guided relay triggering and a bidding mechanism that selects the next agent based on its confidence. Experiments on four benchmarks show that method outperforms the strongest single-model strategies in accuracy, e.g., +3.3% on MathVista and +3.9% on MMStar, and remains on par with multi-agent strategies while consuming 6.0x less token overhead on HallusionBench and MMStar. Further analysis demonstrates that relay collaboration enables heterogeneous agents to progressively integrate complementary insights, combining heterogeneous capabilities across reasoning stages. Our source code is available at https://github.com/67L1/MACR.', 'score': 5, 'issue_id': 3494, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'b815c0c3cb5108a8', 'authors': ['Xu Liu', 'Jungang Qiao', 'Guikun Chen', 'Xiaojuan Qi', 'Wenguan Wang'], 'affiliations': ['Nanyang Technological University', 'The University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.35219.jpg', 'data': {'categories': ['#agents', '#reasoning', '#multimodal', '#optimization', '#benchmark'], 'emoji': '🏃', 'ru': {'title': 'Эстафета рассуждений: агенты передают мысль дальше, а не голосуют', 'desc': 'Авторы предлагают MACR — фреймворк на основе эстафеты, где несколько LLM-агентов последовательно передают друг другу процесс рассуждения, а не независимо генерируют ответы и агрегируют их, как в классических multi-agent подходах. Передача управления запускается по уровню уверенности (confidence-guided triggering), а следующий агент выбирается через механизм ставок (bidding), основанный на его уверенности. Эксперименты на четырёх бенчмарках показывают рост точности (например, +3.3% на MathVista) при сопоставимом качестве с multi-agent методами и расходе токенов в 6 раз меньше. Метод позволяет разнородным агентам поэтапно дополнять друг друга, объединяя сильные стороны на разных стадиях рассуждения.'}, 'en': {'title': 'Pass the reasoning, not just the answer', 'desc': 'MACR is a multi-agent method where agents pass an evolving reasoning process from one agent to another, rather than each solving the problem independently. It uses agents’ confidence scores to decide when to pass the reasoning and a bidding mechanism to select the next agent. Experiments on four benchmarks show improved accuracy over the strongest single-model methods, while using much fewer tokens than other multi-agent approaches on some benchmarks. The relay process lets agents with different strengths add useful insights at different stages.'}, 'zh': {'title': '让智能体接力推理，以更少令牌汇聚多元能力', 'desc': '论文提出多智能体置信度引导接力框架（MACR），让智能体依次接手并完善不断演进的推理过程，而不是各自独立作答后再汇总。框架根据置信度判断何时交接，并通过竞价机制选择最适合继续推理的智能体。在四个基准测试中，MACR 的准确率超过最强单模型方法，并在部分测试中以显著更低的令牌开销达到与多智能体方法相当的表现。分析表明，不同能力的智能体可以在推理的不同阶段接力，逐步整合互补信息。'}}}, {'id': 'https://huggingface.co/papers/2610.39278', 'title': 'WorldFlow: Joint Video and 3D Motion Prediction via Large-Scale Pretraining', 'url': 'https://huggingface.co/papers/2610.39278', 'abstract': 'Abstract WorldFlow is a generative world model that jointly predicts future video and 3D trajectories using continuous displacement tokens and a Mixture-of-Transformers backbone, improving physical dynamics prediction across diverse benchmarks.  Generated by thinkingmachines/Inkling-Small Predicting future physical states stands as a central challenge in embodied intelligence. Existing video world models leave 3D dynamics implicit, action-based formulations remain tied to specific robot configurations, and 3D motion prediction models use flow-only supervision, providing a limited learning signal for physical dynamics. To circumvent these limitations, we introduce , a generative world model that jointly predicts future video and query-based 3D trajectories. By parameterizing 3D motion as continuous displacement tokens aligned with the video grid, a unified Mixture-of-Transformers (MoT) backbone jointly denoises both modalities under a rectified-flow objective. This formulation couples explicit geometric dynamics with visual evolution, effectively unlocking the physical commonsense embedded within pretrained video models. To empirically scale and validate this unified architecture, we train  on a heterogeneous mixture of 1.44 million object-level samples spanning simulated and real-world domains. We further introduce WorldFlowBench, comprising 1,678 evaluation samples from 11 data sources across simulated and real-world interactions, including spatial reasoning tasks. Across all three evaluation sets, WorldFlow achieves the lowest average displacement error (ADE) and final displacement error (FDE) among the evaluated learning-based methods. Notably, on the challenging SpatialCog set, WorldFlow achieves an ADE of 0.060 m, a 54.2\\% reduction compared with the strongest external baseline. It also reduces ADE and FDE by 55.9\\% and 68.5\\%, respectively, compared with its flow-only variant. Project page: https://worldflow-rbs.github.io/.', 'score': 5, 'issue_id': 3493, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '756022f97d4acbdc', 'authors': ['Yuhao Lu', 'Jiongxu Chen', 'Hexiang Wei', 'Jiajin Wu', 'Juelin Li', 'Mingjian Liang', 'Fan Yang', 'Zhuowei Liang', 'Zihao Liu', 'Zhennan Wang', 'Sheng Wang', 'Lin Shao'], 'affiliations': ['National University of Singapore', 'RoboScience'], 'pdf_title_img': 'assets/pdf/title_img/2610.39278.jpg', 'data': {'categories': ['#optimization', '#architecture', '#video', '#multimodal', '#robotics', '#diffusion', '#3d', '#dataset', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Видео и 3D-движение предсказываются вместе, физика становится точнее', 'desc': 'Статья представляет WorldFlow — генеративную модель мира, которая совместно предсказывает будущее видео и 3D-траектории объектов. 3D-движение параметризуется непрерывными токенами смещения, выровненными по видеосетке, а единый backbone на основе Mixture-of-Transformers совместно денойзит оба модальных потока по целевой функции rectified flow. Модель обучена на 1,44 млн разнородных образцов из симуляций и реального мира и оценена на новом бенчмарке WorldFlowBench. WorldFlow достигает наименьших ADE и FDE среди learning-based методов, снижая ADE на 54,2% на SpatialCog по сравнению с лучшим внешним baseline.'}, 'en': {'title': 'See the future, track the motion', 'desc': 'WorldFlow predicts future video and 3D object trajectories together, so it models both how a scene looks and how objects move. It represents motion as continuous displacement tokens and uses a Mixture-of-Transformers backbone to predict both kinds of information with a rectified-flow objective. Training on 1.44 million samples from simulated and real-world settings helps it learn physical dynamics across different environments. On several benchmarks, it predicts trajectories more accurately than the evaluated learning-based methods, including a substantial improvement on spatial reasoning tasks.'}, 'zh': {'title': '让视频与三维轨迹协同预测，学会理解真实物理世界', 'desc': 'WorldFlow 是一种生成式世界模型，能够同时预测未来视频和基于查询的三维轨迹。它将三维运动表示为与视频网格对齐的连续位移标记，并使用混合 Transformer（MoT）骨干网络，在整流流目标下联合去噪两种模态。研究团队在涵盖仿真与真实场景的 144 万个物体级样本上训练模型，并构建了包含 11 个数据来源的 WorldFlowBench。实验显示，WorldFlow 在多个基准上的平均位移误差（ADE）和最终位移误差（FDE）最低，尤其在空间推理任务中显著优于基线方法和仅使用流监督的变体。'}}}, {'id': 'https://huggingface.co/papers/2610.40293', 'title': 'MAServeBench: Benchmarking Multi-Agent LLM Serving Systems with Hierarchical Collaboration Workloads', 'url': 'https://huggingface.co/papers/2610.40293', 'abstract': 'Abstract MAServeBench evaluates LLM serving and hardware by modeling multi-agent collaboration as a configurable workload dimension with reproducible dependency traces.  Generated by thinkingmachines/Inkling-Small Large language model (LLM)-based multi-agent systems (MAS) coordinate specialized agents to solve complex tasks, turning each user request into interdependent model and tool operations. Unlike independent requests, these operations become ready at different times and consume evolving context as agents coordinate and exchange results. This creates changing patterns of concurrency, computation, and memory demand that can expose different bottlenecks in LLM serving hardware. Yet benchmarking these effects requires capturing the collaboration rules that generate serving workloads, beyond the requests observed during execution. We present MAServeBench, a benchmark that treats multi-agent collaboration as a configurable dimension of serving workloads for LLM serving and hardware evaluation. Its composable stages capture how agents coordinate and exchange context in documented MAS workflows, enabling native executions to generate different workloads even when task inputs and tools remain unchanged. Hierarchical Semantic Traces preserve realized operations and dependencies for reproducible comparisons of legal release constraints at fixed work. Task-linked measurements connect these workloads to serving execution and GPU/NPU hardware behavior, revealing why serving efficiency does not always translate into timely task completion. The benchmark code is available at https://github.com/ShengxuanQiu/MAServeBench.', 'score': 5, 'issue_id': 3492, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '215a2d0afeb73405', 'authors': ['Shengxuan Qiu', 'Haochen Huang', 'Shuzhang Zhong', 'Zizhuo Fu', 'Zebin Yang', 'Meng Li'], 'affiliations': ['1'], 'pdf_title_img': 'assets/pdf/title_img/2610.40293.jpg', 'data': {'categories': ['#agents', '#benchmark', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Эффективность инференса не равна скорости решения задач мультиагентных LLM', 'desc': 'В статье представлен MAServeBench, новый бенчмарк для оценки систем инференса LLM и аппаратного обеспечения в сценариях мультиагентного взаимодействия. Авторы моделируют коллаборацию агентов как настраиваемое измерение нагрузки, которое порождает зависимые операции и меняющуюся конкурентность, память и вычисления. Для воспроизводимого сравнения используются Hierarchical Semantic Traces, сохраняющие реальные операции и зависимости между ними. Результаты показывают, что высокая эффективность serving не всегда означает своевременное выполнение задачи, что важно для оптимизации GPU/NPU.'}, 'en': {'title': 'Benchmark the collaboration behind multi-agent workloads', 'desc': 'MAServeBench benchmarks how multi-agent collaboration changes the workloads handled by large language model (LLM) serving systems. It represents agent coordination and context exchange as configurable stages, so the same tasks and tools can produce different patterns of operations and concurrency. Hierarchical Semantic Traces record operations and their dependencies to support reproducible comparisons at fixed amounts of work. By linking task completion to serving and GPU/NPU measurements, the benchmark helps explain why higher serving efficiency may not lead to faster completion of a task.'}, 'zh': {'title': '让多智能体协作负载可配置、可复现、可衡量', 'desc': '这篇论文提出 MAServeBench，用来评估大语言模型服务系统和硬件处理多智能体协作任务的表现。它把智能体之间的协作方式设计成可配置的工作负载维度，并通过可组合阶段描述智能体如何协调、交换上下文。层次化语义轨迹记录实际执行的操作及其依赖关系，从而支持在固定工作量下进行可复现的比较。将任务完成情况与服务执行及 GPU、NPU 硬件测量关联后，基准还能揭示为什么更高的服务效率不一定意味着任务能更快完成。'}}}, {'id': 'https://huggingface.co/papers/2611.03097', 'title': 'DR Pixel: Page-Native Deep Research with Vision-Language Models', 'url': 'https://huggingface.co/papers/2611.03097', 'abstract': 'Abstract DR Pixel is an open-source multimodal agent that performs deep research directly on rendered document page images, improving retrieval and reasoning over scientific papers through counterfactual credit reweighting.  Generated by thinkingmachines/Inkling-Small Complex documents such as scientific papers contain rich information in tables, figures, and equations; however, existing deep research (DR) agents typically reduce papers to OCR-extracted text. We instead ask whether vision-language models (VLMs) can enable page-native deep research: directly retrieving and reasoning over rendered document page images. We introduce DR Pixel, the first open-source end-to-end multimodal DR agent that uses rendered page images as its sole retrieval and reasoning unit, operating over a corpus of 1.06M pages. To evaluate this setting, we construct DRPixelBench, a benchmark on scientific papers requiring reasoning over text, figures, tables, and equations. Surprisingly, page-native DR already works well without training, outperforming OCR-based baselines across state-of-the-art models like GPT-5.4, Gemini-3.5-Flash, and Qwen3.6-27B, while requiring fewer tool calls. We next turn to DR training. A key challenge is that teacher trajectories for agentic supervised finetuning are noisy, mixing critical reasoning and action steps with redundant or failed attempts. To address this, we introduce counterfactual credit reweighting, a fine-grained credit assignment method that weights individual reasoning and action steps by their counterfactual contribution to the final answer. Our training improves retrieval recall by about 15 points and final accuracy by over 10 points on DRPixelBench, and likewise outperforms the untrained baseline on four existing benchmarks. On out-of-distribution ViDoRe-V3, DR Pixel comes within 1.8 points of an oracle that is given the gold pages directly. Our results suggest that the conventional OCR-then-retrieve pipeline is not only unnecessary but suboptimal: directly retrieving and reasoning over visual document pages makes complex DR both more effective and more efficient.', 'score': 4, 'issue_id': 3494, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'f4dc1705f3b0259d', 'authors': ['Tiansheng Hu', 'Yichuan Wang', 'James V. Talwar', 'Nicholas Tomlin', 'Chen Zhao', 'Sewon Min'], 'affiliations': ['New York University', 'Rational Dynamics', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.03097.jpg', 'data': {'categories': ['#rag', '#agents', '#dataset', '#multimodal', '#data', '#synthetic', '#open_source', '#training', '#benchmark', '#science', '#cv'], 'emoji': '📄', 'ru': {'title': 'Читать научные статьи глазами, а не через OCR', 'desc': 'Авторы представляют DR Pixel — открытый мультимодальный агент для глубокого исследования научных статей, который работает напрямую с изображениями страниц, а не с текстом, извлечённым через OCR. Агент использует vision-language models (VLM) для поиска и рассуждений по корпусу из 1,06 млн страниц, что позволяет учитывать таблицы, рисунки и формулы. Для обучения предложен метод counterfactual credit reweighting, который взвешивает отдельные шаги рассуждений и действий по их вкладу в итоговый ответ, что повышает recall поиска примерно на 15 пунктов и точность более чем на 10 пунктов. Результаты показывают, что классический пайплайн OCR-then-retrieve не только избыточен, но и уступает подходу с прямой работой над визуальными страницами документов.'}, 'en': {'title': 'Research the page as it appears', 'desc': 'DR Pixel is an open-source multimodal research agent that searches and reasons directly over images of document pages, rather than relying on OCR text. It is evaluated on a new benchmark covering questions that require understanding text, figures, tables, and equations, and performs better than OCR-based methods while using fewer tool calls. The paper also introduces counterfactual credit reweighting, which assigns training weight to reasoning and actions according to how much they help produce the final answer. Training with this method improves retrieval recall and answer accuracy, showing that page-image research can be both more effective and more efficient than the usual OCR-first approach.'}, 'zh': {'title': '跳过 OCR，让 AI 直接读懂论文页面', 'desc': '本文提出开源多模态深度研究智能体 DR Pixel，直接把论文页面图像作为检索和推理的基本单元，而不先用 OCR 将页面转换为文本。研究者还构建了 DRPixelBench，用来评估模型对论文文字、图表、表格和公式的综合理解能力；实验发现，直接处理页面图像的效果优于 OCR 基线，且需要更少的工具调用。为提升智能体训练效果，论文提出反事实信用重加权，根据每个推理或行动步骤对最终答案的实际贡献分配权重，从而减少冗余或失败步骤的影响。训练后的模型在基准测试中显著提高了检索召回率和答案准确率，并在多个现有基准及分布外测试中表现出较强能力。'}}}, {'id': 'https://huggingface.co/papers/2610.38623', 'title': 'Cross-Primitive Consistency in Jev', 'url': 'https://huggingface.co/papers/2610.38623', 'abstract': "Abstract Jev's cross-primitive consistency is benchmarked and improved via a residual calibrator that reduces inconsistency and boosts decision accuracy.  Generated by thinkingmachines/Inkling-Small Jev enables efficient decision-making with large language models (LLMs) through typed querying primitives, allowing the same semantic state to be expressed in different formats, such as binary and multiple-choice queries. However, the consistency of decisions across primitives has not been systematically evaluated. This work introduces PrimaCons, a four-axis benchmark for assessing cross-primitive consistency while preserving the semantics of the query. Evaluations across three Jev sizes reveal consistency violations across all four axes. Our analysis shows that these violations follow systematic patterns and that cross-primitive discrepancies predict decision failure with a ROC-AUC of 0.91. To mitigate these inconsistencies, we propose the Cross-Primitive Residual Calibrator (CPRC), which attaches a lightweight residual network to a frozen backbone and jointly optimizes predictive accuracy and cross-primitive consistency. Under a leave-one-domain-out protocol, CPRC reduces cross-primitive inconsistency by 58.57% and improves accuracy by +2.97%., demonstrating its effectiveness in both in-domain and out-of-domain settings. Our findings establish cross-primitive consistency as a key dimension for evaluating Jev and provide a practical approach to improving the reliability of its decisions. Code and benchmark is available at https://github.com/67L1/PrimaCons-CRPR.", 'score': 4, 'issue_id': 3494, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '6914a5e02ae4859c', 'authors': ['Xu Liu', 'Guikun Chen', 'Kanzhi Wu', 'Wenguan Wang'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.38623.jpg', 'data': {'categories': ['#dataset', '#interpretability', '#optimization', '#open_source', '#training', '#benchmark'], 'emoji': '🧭', 'ru': {'title': 'Согласованные решения LLM независимо от формы вопроса', 'desc': 'Статья посвящена согласованности решений больших языковых моделей (LLM) при разных типах запросов, например бинарных и с выбором из нескольких вариантов, при сохранении одного и того же смысла. Авторы представляют бенчмарк PrimaCons с четырьмя осями оценки, который выявляет систематические нарушения согласованности у моделей разного размера, а расхождения между примитивами предсказывают ошибки решений с ROC-AUC 0.91. Для устранения этих несоответствий предложен калибратор CPRC: легковесная остаточная сеть подключается к замороженной базовой модели и совместно оптимизирует точность и согласованность. Метод снижает межпримитивную несогласованность на 58.57% и повышает точность на 2.97% даже на доменах, не входивших в обучение.'}, 'en': {'title': 'One Meaning, Consistent Decisions', 'desc': 'The paper introduces PrimaCons, a benchmark for testing whether Jev gives consistent decisions when the same meaning is asked through different query formats. Tests across three model sizes find inconsistencies in all four benchmark dimensions, and these mismatches predict decision errors with a ROC-AUC of 0.91. The authors propose CPRC, a lightweight residual network attached to a frozen model and trained to improve both accuracy and cross-format consistency. In leave-one-domain-out tests, CPRC reduces inconsistency by 58.57% and increases accuracy by 2.97%, including on unseen domains.'}, 'zh': {'title': '让不同查询方式得出一致判断，让 Jev 决策更可靠', 'desc': '本文提出 PrimaCons 基准，用四个维度评估 Jev 在不同查询方式（如二元选择和多项选择）下是否保持一致决策。对三种规模的 Jev 进行测试后，研究发现各维度都存在一致性问题，而且这些差异能够预测决策失败，ROC-AUC 达到 0.91。为改善这一问题，作者提出跨查询原语残差校准器（CPRC），在冻结的主干模型上添加轻量级残差网络，并联合优化预测准确率与跨方式一致性。在留一领域外评估中，CPRC 将不一致性降低了 58.57%，并使准确率提高了 2.97%。'}}}, {'id': 'https://huggingface.co/papers/2611.01460', 'title': 'Can Large Language Model Agents Learn by Watching Tutorial Videos?', 'url': 'https://huggingface.co/papers/2611.01460', 'abstract': "Abstract Tutorial Agentic Learning enables LLM agents to continuously learn from instructional videos without parameter updates by building a structured tutorialbook memory and retrieving via reasoning-linked table-of-contents trees.  Generated by thinkingmachines/Inkling-Small Humans continuously acquire knowledge from carefully crafted materials such as books and tutorial videos, carrying that understanding into future tasks. Millions of such instructional videos are uploaded online every day, yet LLM agents remain unable to exploit this ever-expanding wealth of human teaching. Their capabilities are frozen after training, while parameter updates at scale remain prohibitively expensive. This raises the central question: can LLM agents learn from this vast instructional resource without parameter updates? We introduce Tutorial Agentic Learning (TAL), a nonparametric continual-learning paradigm that consolidates tutorial videos into a persistent, structured tutorialbook memory through a two-stage adversarial process that harvests hard, video-grounded questions and uses them to refine the memory. At inference time, TAL retrieves through a Table-of-Contents (TOC) tree, tying retrieval directly to the model's reasoning rather than to embedding similarity. To study this setting, we introduce VidLearn, a multimodal QA benchmark built from 72 chess tutorial videos spanning 12 openings. On VidLearn, TAL outperforms all evaluated baselines and improves monotonically as more videos are consumed, achieving up to 113% and 91% relative gains over the corresponding vanilla MLLMs on the training and test splits, respectively. In actual gameplay, TAL reaches a stronger opening-phase position than its vanilla counterpart in 69% of head-to-head games. Evaluation in a second domain further demonstrates the generality of TAL. Together, these results highlight instructional videos as a scalable resource for parameter-update-free agent continual learning.", 'score': 4, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'd995d979f68fd657', 'authors': ['Haoyu Zhao', 'Zafeirios Fountas', 'Jun Wang'], 'affiliations': ['University College London'], 'pdf_title_img': 'assets/pdf/title_img/2611.01460.jpg', 'data': {'categories': ['#video', '#games', '#rag', '#long_context', '#multimodal', '#transfer_learning', '#agents', '#dataset', '#benchmark'], 'emoji': '🎓', 'ru': {'title': 'Агенты учатся на видеоуроках без переобучения модели', 'desc': 'Статья представляет Tutorial Agentic Learning (TAL) — непараметрический подход к continual learning, при котором LLM-агенты учатся на обучающих видео без обновления весов модели. Видео консолидируются в структурированную память tutorialbook через двухэтапный адверсариальный процесс, который генерирует сложные вопросы и уточняет память. На этапе инференса поиск выполняется по дереву Table-of-Contents, связанному с логикой рассуждений модели, а не с embedding similarity. На новом бенчмарке VidLearn по шахматным видео TAL превосходит базовые MLLM до 113% и показывает стабильный рост качества по мере изучения новых видео.'}, 'en': {'title': 'Learn from Every Tutorial—Without Updating the Model', 'desc': 'Tutorial Agentic Learning (TAL) lets large language model agents learn from tutorial videos without updating their model parameters. It builds a persistent memory called a tutorialbook, refined by generating challenging questions grounded in the videos. At inference time, the agent uses a table-of-contents tree to retrieve information in a way linked to its reasoning, rather than relying on embedding similarity. On chess and another domain, TAL outperforms evaluated baselines, and its performance improves as it processes more videos.'}, 'zh': {'title': '不更新参数，也能从教程视频中持续学习', 'desc': '本文提出教程智能体学习（TAL），让大语言模型智能体无需更新模型参数，也能从教学视频中持续学习。TAL 将视频内容整理成持久、结构化的教程记忆，并通过生成难题、再用这些问题改进记忆的两阶段过程来提升内容质量。回答问题时，TAL 沿着目录树检索信息，并将检索过程与模型推理相结合，而不是只依赖向量相似度。在包含国际象棋教学视频的基准测试中，TAL 优于对比方法，而且随着学习的视频增多表现持续提升，也在实际对弈和另一领域的测试中展现出效果。'}}}, {'id': 'https://huggingface.co/papers/2610.41296', 'title': 'Self-Improvement with Auxiliary Rewards: Learning from Verified Traces and Evaluating Transfer', 'url': 'https://huggingface.co/papers/2610.41296', 'abstract': 'Abstract Auxiliary trajectory preferences based on entropy and confidence metrics improve small language model self-improvement and transfer by distinguishing learning value among equally correct reasoning traces.  Generated by thinkingmachines/Inkling-Small Answer-level rewards cannot distinguish reasoning traces with equally correct outcomes. We study whether auxiliary trajectory preferences improve small-language-model self-improvement and transfer under limited supervision. We compare confidence-based (SC) and entropy-based metrics (UID-Conj.), which combines global entropy variation and local smoothness, through online reward augmentation and offline training on correct responses. Online experiments adapt Qwen3-1.7B on 30 AIME problems without reference answers; offline experiments use historical AIME problems. UID-Conj. improves the online macro-average across the adaptation benchmark and three transfer benchmarks by 2.08 percentage points over unmodified TTRL. The strongest evidence comes from offline weighted SFT: UID-Conj. exceeds uniform weighting on the same response pool by 1.93 points, with a paired prompt-bootstrap 95\\% CI of [0.44, 3.44]. Benefits are task-dependent: SC rewards judged trace quality and instruction following, while UID-Conj. rewards yield stronger training outcomes in several settings. We find that auxiliary preferences can expose learning value among equally correct traces not captured during inference time, motivating their evaluation through downstream gains.', 'score': 4, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '0cb34cadd2c80a85', 'authors': ['Minju Gwak', 'Alan Ritter'], 'affiliations': ['Georgia Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.41296.jpg', 'data': {'categories': ['#training', '#optimization', '#benchmark', '#reasoning', '#small_models', '#transfer_learning'], 'emoji': '🧠', 'ru': {'title': 'Не все правильные решения одинаково полезны для обучения модели', 'desc': 'В статье исследуется, может ли дополнительная оценка траекторий рассуждений улучшить самообучение небольших языковых моделей (LLM) при ограниченном объёме разметки. Авторы сравнивают метрики на основе уверенности (SC) и энтропии (UID-Conj.), которые используются как дополнительные награды в онлайн-режиме (TTRL) и как веса в offline-обучении через weighted SFT. Эксперименты с Qwen3-1.7B на задачах AIME показывают, что UID-Conj. даёт прирост около 2 процентных пунктов по сравнению с базовым TTRL и превосходит равномерное взвешивание. Результаты говорят о том, что предпочтения по траекториям позволяют выявлять ценность обучения у одинаково правильных решений, которую не видит оценка только по ответу.'}, 'en': {'title': 'Look Beyond Correctness to Find Better Reasoning Traces', 'desc': 'Answer-level rewards treat all correct reasoning traces alike, even though some may be more useful for learning. This paper tests whether confidence-based and entropy-based preferences can help small language models improve and transfer with limited supervision. On AIME tasks, entropy-based UID-Conj. improved results over standard training, including a 1.93 percentage-point gain over uniform weighting in offline supervised fine-tuning. The findings suggest that auxiliary trajectory preferences can identify learning value that correctness alone misses, though the best preference depends on the task.'}, 'zh': {'title': '不止看答案对错，更要看推理轨迹的学习价值', 'desc': '答案级奖励无法区分最终答案同样正确、但学习价值不同的推理轨迹。研究比较了基于置信度的指标 SC 与基于熵的指标 UID-Conj.，后者结合整体熵变化和局部平滑度，用于改进小语言模型的自我提升与迁移。在线实验中，UID-Conj. 相比未修改的 TTRL，在适配任务和三个迁移基准上的宏平均成绩提高了 2.08 个百分点；离线加权监督微调中，它比均匀加权高 1.93 个百分点。不同指标的效果会随任务变化，但按下游表现评估辅助偏好，有助于发现正确推理轨迹中未被答案奖励捕捉的学习价值。'}}}, {'id': 'https://huggingface.co/papers/2610.32878', 'title': 'Advancing SVD-based LLM Compression via Layer-Wise Error Model Search', 'url': 'https://huggingface.co/papers/2610.32878', 'abstract': 'Abstract Layer-wise error modeling and token-wise Fisher statistics improve low-rank SVD compression of large language models by refining rank allocation and decomposition quality.  Generated by thinkingmachines/Inkling-Small Low-rank SVD-based compression offers a powerful strategy to reduce the computational costs of LLMs. However, existing methods face two key limitations: (i) global rank allocation, where uncalibrated error proxies fail to capture complex error propagation, and (ii) decomposition quality, where Fisher-based estimators suffer from severe rank collapse. In this work, we address these limitations by introducing Layer-wise Error Modeling Search (LEMS) and KFAC-SVD. LEMS advances rank allocation by introducing a layer-wise error surrogate that integrates local and global layer importance alongside a propagation bias, enabling effective global rank allocation via an ILP formulation. KFAC-SVD improves decomposition quality by utilizing token-wise statistics, mitigating the rank deficiency observed in prior Fisher-based SVD approaches. Across Mistral, Qwen3, and Llama 3 model families, we show that LEMS consistently outperforms existing search strategies, delivering significant zero-shot accuracy gains of up to 4.8 p.p. that generalize to model sizes of 70B parameters, while KFAC-SVD achieves an average perplexity improvement of 15%. Project page and code: https://lems-svd.github.io', 'score': 3, 'issue_id': 3494, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'bc311a657f0f1588', 'authors': ['Moritz Thoma', 'Maximilian Groezinger', 'Maximilian Forstenhäusler', 'Emad Aghajanzadeh', 'Manoj Rohit Vemparala', 'Christos Anagnostopoulos', 'Pierpaolo Mori', 'Nael Fasfous', 'Alexander Frickenstein', 'Daniel Mueller-Gritschneder', 'Ulf Schlichtmann'], 'affiliations': ['BMW Group', 'Technical University of Munich'], 'pdf_title_img': 'assets/pdf/title_img/2610.32878.jpg', 'data': {'categories': ['#math', '#optimization', '#inference', '#architecture'], 'emoji': '🗜️', 'ru': {'title': 'Сжимаем LLM без потери мозгов: умное распределение рангов и точная декомпозиция', 'desc': 'Статья предлагает улучшения для low-rank SVD сжатия больших языковых моделей (LLM), которое снижает вычислительные затраты. Авторы представляют метод LEMS, который с помощью послойной модели ошибок и ILP-формулировки оптимально распределяет ранги по всей модели. Также вводится KFAC-SVD, использующий токенные статистики Фишера, что устраняет проблему коллапса рангов в предыдущих подходах. Эксперименты на Mistral, Qwen3 и Llama 3 показывают прирост zero-shot точности до 4.8 п.п. и снижение перплексии в среднем на 15%.'}, 'en': {'title': 'Smarter Rank Allocation, Better LLM Compression', 'desc': 'The paper improves low-rank SVD compression, which reduces the size and computational cost of large language models. Layer-wise Error Modeling Search (LEMS) estimates how compression errors in each layer affect both local and overall model performance, then uses integer linear programming to allocate ranks. KFAC-SVD uses token-wise statistics to make the matrix decomposition more effective and avoid rank collapse seen in earlier Fisher-based methods. Tests on Mistral, Qwen3, and Llama 3 show better zero-shot accuracy with LEMS and 15% average perplexity improvement with KFAC-SVD.'}, 'zh': {'title': '更聪明地分配秩，让大模型压缩更精准', 'desc': '本文研究如何用低秩奇异值分解（SVD）压缩大型语言模型，同时减少计算成本。作者提出 LEMS，通过建模每一层的误差、重要性和误差传播，并用整数线性规划分配各层的秩。作者还提出 KFAC-SVD，利用逐 token 统计改进分解质量，缓解既有 Fisher 方法中的秩退化问题。在 Mistral、Qwen3 和 Llama 3 等模型上，LEMS 的零样本准确率最高提升 4.8 个百分点，KFAC-SVD 的困惑度平均改善 15%。'}}}, {'id': 'https://huggingface.co/papers/2611.00053', 'title': 'SIMIT: Self-Improving Vision-Language Models via Imagination at Test-Time', 'url': 'https://huggingface.co/papers/2611.00053', 'abstract': "Abstract SIMIT is a test-time framework that lets vision-language models generate their own practice data to improve answers on unlabeled queries without external annotations.  Generated by thinkingmachines/Inkling-Small We introduce SIMIT, a test-time self-improvement framework in which a vision-language model creates its own query-specific training data before answering an unlabeled test query. Our goal is to improve performance on a given target test set without annotations or external models. To pursue this goal, some test-time methods improve answers through longer reasoning or repeated sampling but leave the model unchanged. Others update the model using rewards based on majority agreement among multiple candidate answers or the model's own judgments of correctness, but such rewards can reinforce existing mistakes. SIMIT instead imagines similar problems whose solutions it controls: a model need not correctly solve the target query to construct useful practice examples. It synthesizes diverse (question, answer, image) triplets by specifying each answer before realizing its image. To support diverse multimodal tasks, SIMIT combines native image generation with an extensible skill library for structured visuals, including documents, charts, and diagrams. Within this pipeline, multi-stage verification checks that images support their assigned answers, while difficulty filtering retains informative examples. Adaptive budgeting further targets this practice by allocating more samples to queries the model is less confident in answering. The resulting data can improve the model in-context (SIMIT-ICL) or in-weight (SIMIT-FT). Across 17 diverse benchmarks, SIMIT outperforms existing self-improvement methods. Its best configuration achieves a +7.20% mean relative gain over BAGEL-7B, while training-free SIMIT-ICL achieves +6.98%.", 'score': 3, 'issue_id': 3493, 'pub_date': '2026-10-11', 'pub_date_card': {'ru': '11 октября', 'en': 'October 11', 'zh': '10月11日'}, 'hash': '1bebf1b585259f34', 'authors': ['Mehmet Onurcan Kaya', 'Desmond Elliott', 'Dim P. Papadopoulos'], 'affiliations': ['Pioneer Center for AI', 'Technical University of Denmark', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2611.00053.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#synthetic', '#data', '#training', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Модель учится на примерах, которые создаёт сама, прямо во время теста', 'desc': 'SIMIT — это фреймворк для self-improvement на этапе тестирования, в котором vision-language model сама генерирует обучающие примеры под конкретный запрос без разметки и внешних моделей. Вместо того чтобы полагаться на majority voting или собственные оценки, которые могут закреплять ошибки, модель задаёт ответ заранее и затем синтезирует соответствующее изображение и вопрос как тройку (question, answer, image). Для разнообразия используются native image generation и библиотека навыков для структурированных визуалов, а multi-stage verification и difficulty filtering отбирают корректные и информативные примеры. Адаптивное распределение бюджета направляет больше сэмплов на запросы, в которых модель менее уверена, а полученные данные используются либо in-context (SIMIT-ICL), либо для fine-tuning весов (SIMIT-FT), давая в среднем +7.20% относительного прироста над BAGEL-7B на 17 бенчмарках.'}, 'en': {'title': 'Make Your Own Practice to Answer Better', 'desc': 'SIMIT helps a vision-language model improve its answers to unlabeled test questions by creating its own practice examples. It first chooses an answer, then generates a matching image and question, and checks that the image supports the answer. It filters for useful examples and gives more practice to questions the model is less confident about; the examples can be used in-context or to fine-tune the model. Across 17 benchmarks, SIMIT outperforms other self-improvement methods, with its training-free version achieving a 6.98% mean relative gain over BAGEL-7B.'}, 'zh': {'title': '先为答案造练习，再让模型答得更好', 'desc': 'SIMIT 是一种测试时自我改进框架，让视觉语言模型针对未标注的测试问题，先自行生成练习数据再作答。它先设定问题的答案，再生成相匹配的图像，并通过多阶段验证和难度筛选，确保练习样本有用。框架还会根据模型的信心分配生成预算，并可通过上下文学习或微调来利用这些数据。实验显示，SIMIT 在 17 个基准测试上优于现有自我改进方法，最佳配置相对 BAGEL-7B 的平均提升为 7.20%。'}}}, {'id': 'https://huggingface.co/papers/2611.02928', 'title': 'Lab2Sim: Turning Real-World Experiment Videos into Interactive Virtual Experiments', 'url': 'https://huggingface.co/papers/2611.02928', 'abstract': 'Abstract Lab2Sim introduces a benchmark for converting science videos into interactive virtual experiments, and EduVideo2Code improves apparatus fidelity by encoding procedures as state machines for verified code generation.  Generated by thinkingmachines/Inkling-Small Science experiment videos demonstrate how experiments are performed, but offer no direct interaction for learners. Turning them into virtual experiments requires not only reproducing the observed apparatus and state changes, but also enforcing the preconditions governing each operation. We introduce Lab2Sim, a benchmark of 218 science experiment videos with evidence-grounded specifications and 11,881 rubric items. To address this task, we propose EduVideo2Code, which extracts experimental procedures hierarchically, encodes them as explicit state machines to guide code generation, and refines the resulting pages through execution-based verification. Experiments show that existing multimodal models readily generate runnable pages but struggle to faithfully reconstruct experimental apparatus. EduVideo2Code consistently improves all four evaluation dimensions across two backbone models, with apparatus fidelity gains of 24.15 points.', 'score': 3, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'b957f10cb68440d6', 'authors': ['Xusen Hei', 'Jiali Chen', 'Jinyu Yang', 'Yi Cai'], 'affiliations': ['South China University of Technology', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02928.jpg', 'data': {'categories': ['#video', '#science', '#plp', '#multimodal', '#synthetic', '#dataset', '#benchmark'], 'emoji': '🔬', 'ru': {'title': 'От видео науки к интерактивной виртуальной лаборатории', 'desc': 'Авторы представляют Lab2Sim — бенчмарк из 218 видео научных экспериментов с 11 881 пунктами оценки, предназначенный для превращения видео в интерактивные виртуальные лабораторные работы. Метод EduVideo2Code иерархически извлекает процедуры эксперимента и кодирует их в виде явных state machines, которые направляют генерацию кода. Затем сгенерированные страницы уточняются через execution-based verification, что повышает корректность выполнения. Эксперименты показывают, что существующие multimodal LLM легко генерируют рабочий код, но плохо воспроизводят установку, а EduVideo2Code улучшает точность воспроизведения оборудования на 24.15 пункта.'}, 'en': {'title': 'From Science Videos to Verified Virtual Experiments', 'desc': 'Lab2Sim is a benchmark for turning science experiment videos into interactive virtual experiments, with 218 videos and detailed evaluation rubrics. EduVideo2Code extracts the steps of each experiment and represents them as state machines, which specify how the apparatus changes and what conditions must be met before each operation. It uses these representations to generate code, then checks and improves the pages by running them. Tests show that EduVideo2Code improves four evaluation dimensions across two multimodal models, including apparatus fidelity by 24.15 points.'}, 'zh': {'title': '用状态机把实验视频变成可信的互动虚拟实验', 'desc': '本文提出 Lab2Sim 基准，用于评估模型能否把科学实验视频转化为可交互的虚拟实验，其中包含 218 段视频和 11,881 条评分标准。作者还提出 EduVideo2Code，它先分层提取实验步骤，再将步骤表示为显式状态机，以指导代码生成。随后，系统通过实际运行生成页面来验证并改进结果，确保操作符合相应的前置条件。实验表明，现有多模态模型虽然容易生成可运行页面，却难以忠实还原实验器材；EduVideo2Code 在两种骨干模型的四项评估指标上均有提升，器材还原度提高了 24.15 分。'}}}, {'id': 'https://huggingface.co/papers/2610.41216', 'title': 'TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents', 'url': 'https://huggingface.co/papers/2610.41216', 'abstract': "Abstract TinyAstral improves robot agent harnesses via recursive self-improvement and distills compact students that retain performance gains with lower compute.  Generated by thinkingmachines/Inkling-Small Robot agents built on vision-language models depend on both the planner and its harness: the tools, feedback, memory, and recovery logic around it. Can improvements to a large teacher's harness be carried into a compact agent with lower inference compute cost? We present TinyAstral, a two-stage approach. We first freeze an open-weight teacher and improve its harness through recursive self-improvement (RSI): frontier LLM agents read the teacher's trajectories and propose harness edits, and each edit is accepted only if it passes a paired statistical test. We then freeze the final harness, collect teacher trajectories with reasoning and failure recovery, and distill a small student that replaces the teacher in the same harness. On RoboTwin, harness evolution raises the teacher's success from 33.4% to 63.6%; the final 4B student reaches 62.8%. Across four harness versions, distilled 4B students score close to their corresponding teachers, and later versions yield stronger students, showing that harness evolution gains carry into compact models. The harness gains also transfer to other frozen planners without retraining. On identical episodes, the final 4B student outperforms open 4B agents, the open 27B harness-RSI model SenseNova-RoboRSI, and our own teacher model placed in three competitors' harnesses. It stays close to its teacher on all three training benchmarks, and on three benchmarks never used for RSI or training it scores close to a 552B planner running the same harness. On the measured deployment episodes, it uses about one fifth of its teacher's accelerator time.", 'score': 3, 'issue_id': 3493, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '34ea753bb8df2840', 'authors': ['Kehong Gong', 'Xiaoxu Zheng', 'Guanli Hou', 'Seunghun Lee', 'Mengqi Guo', 'Runjia Tan', 'Zhengyu Wen', 'Qi Wang', 'Xiaoyu He', 'Mingyuan Zhang', 'Michael Bi Mi'], 'affiliations': ['Huawei Noah Research Institute', 'Huawei Technologies Co., Ltd'], 'pdf_title_img': 'assets/pdf/title_img/2610.41216.jpg', 'data': {'categories': ['#optimization', '#games', '#small_models', '#robotics', '#multimodal', '#agents', '#inference', '#agi', '#synthetic', '#training', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Умный каркас в маленьком роботе: та же эффективность, в пять раз меньше вычислений', 'desc': 'Статья показывает, что улучшения «обвязки» (harness) большого агента-учителя — инструментов, обратной связи, памяти и логики восстановления — можно перенести в компактную модель. Сначала авторы применяют рекурсивное самоулучшение (RSI), где LLM-агенты предлагают правки harness, а каждая правка принимается только после парного статистического теста. Затем финальный harness используется для сбора траекторий учителя и дистилляции маленького студента (4B), который почти не теряет в успешности, но использует примерно пятую часть вычислительных ресурсов. Результаты подтверждены на RoboTwin и других бенчмарках, включая тесты, не использовавшиеся при обучении.'}, 'en': {'title': 'Improve the harness, distill the gains', 'desc': 'TinyAstral improves a robot agent’s harness—the tools, feedback, memory, and recovery logic surrounding its planner—using recursive self-improvement. Frontier language-model agents suggest harness changes, which are kept only when paired statistical tests show they help a frozen teacher. The improved harness then guides trajectory collection and distillation into a compact 4B student, which reaches 62.8% success compared with the teacher’s improved 63.6%. The student retains strong performance across benchmarks while using about one fifth of the teacher’s accelerator time on measured episodes.'}, 'zh': {'title': '进化智能体框架，让小模型以更低算力接近大教师', 'desc': '这篇论文提出 TinyAstral，通过改进机器人智能体的执行框架，再把改进效果迁移到小模型中。研究者冻结视觉语言模型教师，用递归自我改进（RSI）让大语言模型分析执行轨迹并提出框架修改，只有通过配对统计检验的修改才会被采用。随后，他们固定改进后的框架，收集教师的推理与失败恢复轨迹，用知识蒸馏训练 4B 学生模型；在 RoboTwin 上，教师成功率从 33.4% 提升到 63.6%，学生达到 62.8%。实验还显示，框架改进能迁移到其他规划器，学生在多个基准上接近教师表现，而部署时的加速器耗时约为教师的五分之一。'}}}, {'id': 'https://huggingface.co/papers/2610.38637', 'title': 'On-Policy Self-Distillation with Teacher Evolution', 'url': 'https://huggingface.co/papers/2610.38637', 'abstract': "Abstract Teacher-Evolution Self-Distillation improves on-policy self-distillation by continuously enhancing self-teaching reliability through reward-guided teacher optimization and adaptive down-weighting of unreliable samples.  Generated by thinkingmachines/Inkling-Small On-Policy Self-Distillation (OPSD), which aligns a student model's token-level distribution with that of its self-teacher prompted by privileged context, has emerged as a promising direction to mitigate reward sparsity in sequence-level post-training paradigms. However, OPSD often fails to achieve continuous performance gains during training. In this paper, we find that the model's limited self-teaching capability underlies this phenomenon by generating unreliable guidance on certain samples. To address this problem, we propose Teacher-Evolution Self-Distillation (TESD), which enables the self-teacher to generate rollouts and receive environmental feedback based on task correctness and context independence. First, using these rewards as training objectives, we perform teacher-oriented optimization to continuously enhance the model's self-teaching capability during distillation. Second, by estimating teacher guidance reliability from these rewards, we apply adaptive student-oriented optimization to down-weight samples with unreliable guidance. Extensive experiments
