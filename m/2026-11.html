across multiple datasets and model scales show that TESD consistently outperforms representative token-level and sequence-level methods, highlighting the necessity of improving supervision quality in OPSD.", 'score': 3, 'issue_id': 3492, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '6a8995ffaf8241ae', 'authors': ['Shufan Shen', 'Zhongni Hou', 'Chao Bi', 'Yufei Zhang', 'Guojun Yin', 'Shuhui Wang'], 'affiliations': ['Institute of Computing Technology, Chinese Academy of Sciences', 'Meituan', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.38637.jpg', 'data': {'categories': ['#training', '#alignment', '#optimization', '#rlhf'], 'emoji': '🎓', 'ru': {'title': 'Учитель, который учится сам: надежная супервизия для самодистилляции', 'desc': 'Статья посвящена улучшению On-Policy Self-Distillation (OPSD), где студенческая LLM выравнивает токенные распределения с собственным учителем, использующим привилегированный контекст. Авторы обнаружили, что ограниченная способность модели к самообучению порождает ненадежные сигналы супервизии на части примеров, из-за чего качество не растет стабильно. Предложенный метод TESD оптимизирует самого учителя с помощью наград за корректность и независимость от контекста, повышая надежность его подсказок. Затем адаптивно понижает веса примеров с ненадежной супервизией при оптимизации студента, что ведет к стабильно лучшим результатам на разных датасетах и масштабах моделей.'}, 'en': {'title': 'Improve the Teacher, Trust the Guidance', 'desc': 'On-policy self-distillation trains a model to match guidance from a self-teacher, but that guidance can be unreliable and limit progress. Teacher-Evolution Self-Distillation (TESD) lets the teacher generate answers and receive rewards for correctness and independence from privileged context. It uses these rewards to improve the teacher and to reduce the influence of examples where its guidance is unreliable. Experiments across datasets and model sizes show TESD outperforms several token-level and sequence-level training methods.'}, 'zh': {'title': '让教师不断进化，让可靠指导驱动学生学习', 'desc': '本文提出教师进化自蒸馏（TESD），旨在解决在线自蒸馏中教师有时会提供不可靠指导、训练效果难以持续提升的问题。方法让自教师生成回答，并根据任务正确性和对上下文的依赖程度获取环境反馈。研究利用这些奖励优化教师，逐步提升其自我教学能力。与此同时，方法会估计指导的可靠性，并降低不可靠样本对学生训练的影响；实验显示，TESD在多个数据集和模型规模上优于多种代表性方法。'}}}, {'id': 'https://huggingface.co/papers/2610.41994', 'title': 'DAMI: Dual-Axis Memory Initialization for Enhanced Long-Context Retrieval in Gated Linear Attention', 'url': 'https://huggingface.co/papers/2610.41994', 'abstract': 'Abstract Dual-Axis Memory Initialization improves long-context retrieval in gated linear recurrent models by jointly configuring decay and sensitivity parameters before training.  Generated by thinkingmachines/Inkling-Small Linear attention scales linearly with sequence length, but its finite-state memory can limit long-context retrieval. In gated linear recurrences, memory retention depends on state decay, which is shaped jointly by gate parameters A_log and dt_bias and by input activations. In controlled Gated DeltaNet (GDN) experiments, both parameters remain highly correlated with their initial values after training, highlighting the importance of initialization. Therefore, we introduce Dual-Axis Memory Initialization (DAMI), which jointly configures these parameters before training. DAMI assigns geometric timescales across heads for varied retrieval distances and a low-high-low input-sensitivity profile across layers. A small activation sample calibrates the GDN-family implementation to match both behavioral targets without adding trainable parameters. Across GDN, KDA, GDN2, Mamba-2, and RWKV-7, DAMI improves average RULER-style retrieval accuracy by 5.29 to 16.71 percentage points over the corresponding random-initialization baselines. Performance on language modeling, commonsense reasoning, and 2K real-world retrieval remains broadly comparable to those baselines. Our code is available at https://speedai.com/research/dami.', 'score': 2, 'issue_id': 3494, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '1b3e34bbd51d3989', 'authors': ['Zhangchi Feng', 'Harry Jiang', 'Yangyifei Luo', 'Ray Zhang', 'Richong Zhang'], 'affiliations': ['Beihang University', 'SpeedAI'], 'pdf_title_img': 'assets/pdf/title_img/2610.41994.jpg', 'data': {'categories': ['#training', '#optimization', '#long_context', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Правильная инициализация памяти открывает длинный контекст для линейных моделей', 'desc': 'В статье предлагается метод Dual-Axis Memory Initialization (DAMI) для gated linear recurrent моделей, таких как GDN, Mamba-2 и RWKV-7. Авторы показывают, что параметры затухания памяти (A_log и dt_bias) после обучения сильно коррелируют с начальными значениями, поэтому инициализация критически важна. DAMI задаёт геометрические временные масштабы для разных heads и профиль чувствительности low-high-low по слоям, калибруя модель на небольшой выборке активаций без добавления trainable параметров. Метод повышает точность retrieval на длинном контексте в среднем на 5.29–16.71 процентных пункта относительно случайной инициализации, при этом качество language modeling и commonsense reasoning остаётся на прежнем уровне.'}, 'en': {'title': 'Set Memory Before Training for Better Long-Context Retrieval', 'desc': 'Gated linear recurrent models process sequences efficiently, but their limited memory can make it hard to retrieve information from far back. The paper introduces Dual-Axis Memory Initialization (DAMI), which sets decay and input-sensitivity parameters before training to support a range of retrieval distances. It uses geometric memory timescales across attention heads and a low-high-low sensitivity pattern across model layers, calibrated with a small sample of activations. Across five model families, DAMI improves long-context retrieval accuracy while keeping language modeling and reasoning performance broadly similar to random initialization.'}, 'zh': {'title': '训练前双轴校准，让线性循环模型记得更远', 'desc': '线性注意力的计算量随序列长度线性增长，但门控线性循环模型的有限状态记忆可能限制长文本检索。论文发现，控制记忆衰减的参数在训练后仍与初始值高度相关，因此提出双轴记忆初始化（DAMI），在训练前共同设置衰减与输入敏感性参数。DAMI为不同注意力头分配几何级数的记忆时间尺度，并让不同层的输入敏感性呈低—高—低分布，再用少量激活样本进行校准，且不增加可训练参数。在多种模型上，DAMI使RULER风格检索准确率较随机初始化提高5.29至16.71个百分点，同时语言建模、常识推理和真实场景检索表现总体相近。'}}}, {'id': 'https://huggingface.co/papers/2610.39639', 'title': 'Where Do Vision Language Models Fail at 3D Reasoning?', 'url': 'https://huggingface.co/papers/2610.39639', 'abstract': "Abstract Vision-language models often judge 3D object properties correctly but fail to recover and consistently apply exact per-color counts, motivating evaluation by exact correctness, consistency, and visual dependence.  Generated by thinkingmachines/Inkling-Small Vision-language models can get individual judgments right while struggling to recover and consistently use the exact properties of a 3D object. To characterize this gap, we introduce BedBench, a controlled benchmark of thirteen procedurally generated tasks spanning individual judgments and composite answers. Across twelve open-weight and four frontier models, per-color counting exposes a pronounced weakness: humans achieve 93.3% accuracy, compared with 7.2% for the best model. Targeted fine-tuning raises one model's accuracy from 3.0% to 68.6%, but reveals a further difficulty: its answers about the most common colors remain inconsistent with its own per-color counts. Supplying those counts as text improves its judgments, showing that recovering a property does not mean using it consistently. Reasoning, scaling, and added visual cues each improve individual judgments, but none makes exact answers reliable. To locate the difficulty, we probe Qwen3.5-27B: exact per-color counts remain recoverable at the language model's input, yet the model's answers rarely recover them (65.0% for the probe vs. 3.0% for the model). Image-removal controls further show that some apparent successes require no visual evidence. These findings motivate evaluating 3D reasoning by exact correctness, consistent use, and image dependence, rather than accuracy alone. Code and dataset are publicly available: https://github.com/leduckhai/BedBench", 'score': 2, 'issue_id': 3494, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '572d46669d392234', 'authors': ['Khai Le-Duc', 'Nguyen Kim Hai Bui', 'An Ngo', 'Nam D. Hoang', 'Yueqi Song', 'Jiarui Liu', 'Thai Quoc Hoang', 'Fang Wu', 'Chris Ngo', 'Terry Jingchen Zhang', 'Mona T. Diab', 'Ran Xu', 'Silvio Savarese', 'Xiao-Ming Wu'], 'affiliations': ['Columbia University', 'Independent Researcher', 'Meta AI', 'Salesforce AI Research', 'Stanford University', 'The Hong Kong Polytechnic University', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2610.39639.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#hallucinations', '#multimodal', '#interpretability', '#3d', '#open_source', '#dataset'], 'emoji': '🧩', 'ru': {'title': 'Знать не значит применять: точность VLM в 3D требует проверки согласованности', 'desc': 'Статья представляет BedBench — контролируемый бенчмарк из тринадцати процедурно сгенерированных задач для проверки 3D-рассуждений vision-language моделей (VLM). Авторы показывают, что модели могут давать верные отдельные суждения, но плохо восстанавливают и последовательно применяют точные свойства 3D-объекта, особенно при подсчёте объектов по цветам: люди достигают 93.3%, лучшая модель — 7.2%. Тонкая настройка повышает точность, однако ответы модели остаются несогласованными с её же внутренними подсчётами, а пробинг LLM-части показывает, что точные данные есть во входе, но не используются в ответах. Поэтому авторы предлагают оценивать модели по точной корректности, согласованности использования свойств и зависимости от изображения, а не только по accuracy.'}, 'en': {'title': 'Count It, Use It, See It: Testing Reliable 3D Reasoning', 'desc': 'The paper introduces BedBench, a benchmark for testing whether vision-language models can identify and combine exact properties of 3D objects. Models struggle especially with counting objects by color: the best model reaches only 7.2% accuracy, compared with 93.3% for humans. Fine-tuning improves counting, but models may still give answers that conflict with their own counts, and some correct-looking answers do not rely on the image. The authors argue that 3D reasoning should be evaluated not only for accuracy, but also for consistency and dependence on visual evidence.'}, 'zh': {'title': '不只答对，还要数得准、用得一致、看得有据', 'desc': '本文提出 BedBench，这是一个包含 13 项程序生成任务的基准，用于评估视觉语言模型对 3D 物体属性的判断与组合推理。实验发现，模型在逐色计数上表现尤其差：最佳模型准确率仅为 7.2%，远低于人类的 93.3%。针对性微调能提升计数准确率，但模型仍难以让基于计数的结论与自身计数保持一致；提供文字计数后，判断会改善。研究还发现，模型输出未必依赖图像证据，因此评估 3D 推理不应只看准确率，也应检查答案的一致性、精确性及其对视觉信息的依赖。'}}}, {'id': 'https://huggingface.co/papers/2611.03393', 'title': 'TaoMate-FVSR:Audio-Guided Facial Video Restoration', 'url': 'https://huggingface.co/papers/2611.03393', 'abstract': 'Abstract An audio-guided framework restores facial details in AI-generated videos by combining reference-guided flow modeling with audio synchronization to resolve lip and dental ambiguity.  Generated by thinkingmachines/Inkling-Small AI-generated videos often depict people within detailed scenes while leaving their small facial regions poorly resolved. Visual super-resolution can sharpen these regions without resolving whether the recovered lips and teeth agree with the spoken audio. We present an audio-guided facial video restoration framework that addresses this ambiguity within a reference-guided video flow model. Source--noise mixing initializes reconstruction from a partially preserved observation, and structured reference injection separates appearance anchors from continuous motion context. Training combines restoration of degraded images and videos with correction of degraded dubbed sources under target audio. Appearance and synchronization supervision allow the model to recover facial detail and support visual dubbing when the audio is replaced. On talking-head restoration benchmarks, our method achieves the best paired perceptual similarity and synchronization scores among the compared restoration methods. Component comparisons examine audio conditioning, the reconstruction formulation, and reference injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage. injection. Native AIGC examples further illustrate the recovery of lip contours, dental structure, and surrounding facial texture in scene-level footage.', 'score': 2, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'e53e4fbc6fc881bb', 'authors': ['Xinyang Li', 'Zeran Xu', 'Qijun Gan', 'Chenwei Zhang', 'Meiguang Jin', 'Junfeng Ma'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2611.03393.jpg', 'data': {'categories': ['#video', '#multimodal', '#cv', '#synthetic', '#training', '#diffusion'], 'emoji': '🎙️', 'ru': {'title': 'Точные губы и зубы: восстановление лиц в AI-видео под звук', 'desc': 'Статья представляет аудио-управляемую систему восстановления лиц в видео, сгенерированных ИИ, где мелкие детали лица (губы, зубы) часто искажены. Метод основан на reference-guided video flow model, который использует смешивание источника и шума для инициализации реконструкции и структурированную инъекцию референсных изображений для разделения якорей внешнего вида и непрерывного контекста движения. Обучение сочетает восстановление деградированных изображений и видео с коррекцией дубляжа под целевое аудио, а supervision по внешнему виду и синхронизации позволяет согласовывать движения губ с речью. Метод показывает лучшие результаты по метрикам perceptual similarity и синхронизации среди сравниваемых подходов на бенчмарках восстановления говорящих голов.'}, 'en': {'title': 'Sharper Faces, Synchronized Speech', 'desc': 'This paper presents a method for restoring facial details in AI-generated videos while keeping lip movements and teeth consistent with the audio. It uses a reference-guided video flow model, combining appearance references with motion information and starting reconstruction from a partly preserved image. The model is trained on degraded images and videos, including dubbed videos that must be matched to target audio. Tests show improved visual similarity and audio-video synchronization compared with the restoration methods evaluated.'}, 'zh': {'title': '让人脸细节清晰，让嘴型与声音同步', 'desc': '这篇论文提出一种音频引导的人脸视频修复框架，用于改善 AI 生成视频中嘴唇、牙齿等细节模糊的问题。它在参考引导的视频流模型中结合音频同步信息，让修复后的人脸细节既清晰，也与语音内容相符。模型通过源图像与噪声混合来初始化重建，并分别利用外观参考和连续运动信息来引导生成。实验显示，该方法在说话人视频修复基准上取得了较好的感知相似度和音画同步效果，也能支持替换音频后的视觉配音。'}}}, {'id': 'https://huggingface.co/papers/2611.03219', 'title': 'Can Coding Agents Sustain Continual Evolution without Forgetting?', 'url': 'https://huggingface.co/papers/2611.03219', 'abstract': "Abstract Empirical study shows continual harness self-evolution across software engineering tasks causes severe catastrophic forgetting, with performance on earlier datasets dropping sharply after later evolution.  Generated by thinkingmachines/Inkling-Small Recently, harness self-evolution has emerged as an important paradigm for improving agent performance. Prior studies show that evolving the agent harness can effectively enhance agent capabilities without modifying the foundation model's parameters. We find that existing approaches largely study agent evolution on a single task. In practice, coding agents may need to handle multiple task types over time. Whether an agent harness can continuously evolve across multiple tasks without suffering from catastrophic forgetting remains an important open question.   In this paper, we investigate this open question through a comprehensive empirical study of continual harness self-evolution. We organize three software engineering task datasets into six different evolution directions and apply two representative harness evolution methods to perform continual evolution along these directions. Our experimental results show that evolution on a subsequent dataset can substantially undermine the performance on previously seen datasets. For example, with DeepSeek-V4-Flash-0731, Meta-Harness improves its performance on SWE-Bench to 94.0% after evolution. However, after further evolution on FeatureBench, its performance on SWE-Bench drops to 32.0% by the fifth round, corresponding to a 66% relative decrease. Finally, based on our experimental findings, we identify several insights, providing directions for the continual self-evolution of agent harnesses. Code is available at https://github.com/THU-Agent/continual-harness-evolution.", 'score': 2, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'd15f0e2016fbc0f6', 'authors': ['Shangziqi Zhao', 'Yitong Zhang', 'Jia Li'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.03219.jpg', 'data': {'categories': ['#transfer_learning', '#agents', '#survey', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Агент, который учится новому, забывает старое', 'desc': 'В статье исследуется непрерывная самоэволюция agent harness, то есть обвязки LLM-агента, без изменения параметров foundation model. Авторы показывают, что при последовательной адаптации к разным задачам разработки ПО (SWE-Bench, FeatureBench и др.) возникает серьёзный catastrophic forgetting: качество на ранее освоенных датасетах резко падает. Например, результат Meta-Harness на SWE-Bench снижается с 94.0% до 32.0% после пяти раундов эволюции на FeatureBench. На основе эмпирических экспериментов авторы формулируют выводы, которые задают направления для будущих исследований непрерывного самообучения агентов.'}, 'en': {'title': 'Improving on New Tasks Shouldn’t Mean Forgetting Old Ones', 'desc': 'This paper studies whether an agent harness can keep improving across different software engineering tasks without forgetting earlier ones. The researchers test two harness-evolution methods on three datasets using six task-evolution sequences. They find that evolving the harness on a new dataset can sharply reduce its performance on previously learned datasets, a problem known as catastrophic forgetting. For example, after improving SWE-Bench performance to 94%, further evolution on FeatureBench lowers it to 32%.'}, 'zh': {'title': '智能体框架持续进化，别让新技能抹去旧本领', 'desc': '本文通过实证研究探讨智能体框架在多个软件工程任务上持续自我演化时，是否会发生灾难性遗忘。研究使用三个任务数据集，设计六种演化顺序，并测试两种代表性的框架演化方法。结果显示，在新数据集上继续演化可能显著损害智能体在先前任务上的表现；例如，SWE-Bench 成绩从 94.0% 降至 32.0%。研究还总结了持续演化实验中的关键发现，为减少遗忘、改进智能体框架提供方向。'}}}, {'id': 'https://huggingface.co/papers/2610.27815', 'title': 'ProVe: Proposer-Verifier Decoding', 'url': 'https://huggingface.co/papers/2610.27815', 'abstract': "Abstract ProVe reverses speculative decoding roles by fine-tuning a large model to propose token blocks and verifying them with a smaller or identical model, achieving faster autoregressive generation with adjustable speed-accuracy tradeoffs.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates autoregressive (AR) language models by letting a small model draft tokens serially and a large model verify them in parallel. We reverse these roles. Starting from a standard AR checkpoint, we fine-tune the large model into a proposer that predicts a block of future tokens in a single forward pass, then use one additional forward pass to verify the proposed block. This gives ProVe, Proposer-Verifier decoding. The verifier can be a smaller AR model or the proposer itself; the latter gives ProVe-lossless, which reproduces the proposer's greedy AR decoding. Block proposals already provide substantial room for acceleration: with a block size of 16, the proposed block has an average AR-matching prefix of 6.6 tokens on GSM8K. Across six benchmarks with a 32B proposer, ProVe-lossless reaches 2.5x average AR throughput without training a separate draft head. With a small 3B verifier, ProVe reaches 2.7x average throughput at 2.6 accuracy points below AR on the six-task average, providing a controllable tradeoff between speed and accuracy.", 'score': 2, 'issue_id': 3492, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '13213a9cb37de189', 'authors': ['Ziqi Jin', 'Weiwen Xu', 'Jiaxi Li', 'Yujie Zhong', 'Qi She', 'Aixin Sun'], 'affiliations': ['University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.27815.jpg', 'data': {'categories': ['#training', '#optimization', '#small_models', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Большая модель предлагает блоки токенов, а маленькая их проверяет: быстрее без потери качества', 'desc': 'Статья предлагает ProVe, метод ускорения авторегрессионной генерации, в котором роли спекулятивного декодирования меняются местами: большая модель донастраивается так, чтобы предсказывать целый блок будущих токенов за один проход. Затем дополнительный проход проверяет предложенный блок, при этом в роли верификатора может выступать меньшая LLM или сама большая модель. Вариант ProVe-lossless воспроизводит жадное AR-декодирование без потери качества и даёт ускорение около 2.5x на 32B-модели без обучения отдельной draft-головы. Использование компактного верификатора 3B даёт ускорение около 2.7x с небольшой потерей точности, что позволяет гибко регулировать баланс между скоростью и качеством.'}, 'en': {'title': 'Propose in Blocks, Verify for Speed', 'desc': 'ProVe speeds up autoregressive language model generation by reversing the usual roles in speculative decoding. A fine-tuned large model proposes a block of future tokens in one forward pass, and a verifier checks that block in another pass. When the proposer verifies itself, ProVe-lossless matches its greedy autoregressive output; using a smaller verifier can increase speed while slightly reducing accuracy. In reported tests, ProVe achieved up to 2.5× throughput without a separate draft head, while the smaller-verifier version reached 2.7× throughput with a modest accuracy tradeoff.'}, 'zh': {'title': '让大模型一次提议一组词元，加速生成并灵活权衡准确率', 'desc': 'ProVe 改变了传统推测解码的分工：微调大型语言模型，让它一次预测一组未来词元，再用验证模型检查这组预测。验证模型可以是较小的自回归模型，也可以是提议模型本身；后者能保持与提议模型贪心解码相同的结果。实验中，32B 提议模型配合自身验证时，平均生成速度达到普通自回归解码的 2.5 倍；配合 3B 验证模型时，速度达到 2.7 倍，但平均准确率低 2.6 个百分点。该方法因此能在生成速度与准确率之间提供可调节的取舍，而且不需要额外训练一个草稿头。'}}}, {'id': 'https://huggingface.co/papers/2611.00074', 'title': 'When Morphs Look Better: Face Image Quality as a Training-Free Signal for Morphing Attack Detection', 'url': 'https://huggingface.co/papers/2611.00074', 'abstract': 'Abstract Face image quality assessment methods vary widely in detecting diffusion-based and other morphing attacks, with performance depending heavily on attack type and dataset, and high quality scores for morphs often indicate poor detection.  Generated by thinkingmachines/Inkling-Small Face image quality assessment (FIQA) estimates the utility of a face image for automated face recognition and has been proposed as a morphing attack detection (MAD) signal that requires no morph-specific training. We evaluate 17 FIQA methods from all current FIQA categories on 20 morphing attack sets from two datasets, FRLL and FEI, including five diffusion-based attack sets. Each quality score is used directly as a MAD decision score. Unlike prior work, which inverted a quality measure when this lowered its error, we fix the score direction of each method in advance from its definition, so that cases in which morphs receive higher quality than bona fide samples remain visible. On FRLL, DifFIQA(R) achieves a mean D-EER of 11.42%, and together with CLIB-FIQA and eDifFIQA(L) clearly outperforms all other FIQA methods. A strong separation of bona fide and morph scores does not imply good detection performance: on the diffusion-based attacks, up to 11 of 17 methods assign higher quality to morphs than to bona fide samples, and the largest reversed separation in the study coincides with the worst detection result of the study. Performance also depends strongly on the attack: GraFIQs(L), the best detector of DCMorph and Arc2Morph on FRLL, performs poorly on the landmark-based and GAN-based attacks. On FEI, the lowest mean D-EER is 39.75%, and a threshold set on the bona fide data of one dataset does not transfer to the other.', 'score': 0, 'issue_id': 3493, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '58f6095975714f57', 'authors': ['Hao Peng', 'Fu Bo', 'Mahmoud Elshirbeny', 'Guray Ozgur'], 'affiliations': ['Fraunhofer Institute for Computer Graphics Research IGD, Darmstadt, Germany', 'TU Darmstadt, Darmstadt, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2611.00074.jpg', 'data': {'categories': ['#security', '#cv', '#benchmark'], 'emoji': '🎭', 'ru': {'title': 'Высокое качество лица не всегда означает подлинность: FIQA ненадёжен для детекции морфинг-атак', 'desc': 'В статье исследуется, можно ли использовать оценку качества лица (FIQA) как сигнал для обнаружения морфинг-атак без обучения на морфах. Авторы тестируют 17 методов FIQA на 20 наборах атак из датасетов FRLL и FEI, включая пять диффузионных атак, и используют оценки качества напрямую как решающий скор. Направление оценки каждого метода фиксируется заранее по его определению, поэтому случаи, когда морфы получают более высокое качество, чем подлинные образцы, остаются видимыми. Результаты показывают, что сильное разделение подлинных образцов и морфов не гарантирует хорошего качества детекции, а эффективность сильно зависит от типа атаки и датасета.'}, 'en': {'title': 'Face quality scores can reveal morphs—but not reliably', 'desc': 'The paper tests whether face image quality assessment (FIQA) methods can detect face morphing attacks without training specifically on morphs. It evaluates 17 methods across 20 attack sets from the FRLL and FEI datasets, using each quality score directly as a morph attack detection (MAD) score and fixing its direction in advance. Detection performance varies greatly by method, dataset, and attack type; several methods even score diffusion-generated morphs as higher quality than genuine faces. The results show that strong score separation alone does not guarantee good detection, and thresholds do not reliably transfer between datasets.'}, 'zh': {'title': '质量分数不等于检测能力：人脸变形攻击检测须经多攻击、多数据集验证', 'desc': '人脸图像质量评估（FIQA）用于衡量人脸图像对自动人脸识别的适用性，也可作为无需针对变形攻击训练的检测信号。研究在 FRLL 和 FEI 两个数据集的 20 种攻击集上评估了 17 种 FIQA 方法，并按照各方法的定义预先固定质量分数的方向。FRLL 上表现最好的 DifFIQA(R) 平均 D-EER 为 11.42%，但扩散攻击常使多种方法给变形人脸打出高于真实人脸的质量分数，且质量分数区分度高并不代表检测效果好。检测性能会随攻击类型和数据集显著变化：FEI 上最低平均 D-EER 为 39.75%，在一个数据集真实样本上设定的阈值也无法直接迁移到另一个数据集。'}}}, {'id': 'https://huggingface.co/papers/2610.22740', 'title': 'R^2Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization Loop', 'url': 'https://huggingface.co/papers/2610.22740', 'abstract': "Abstract R²Orch uses recursive self-play with learnable task selection and skill withdrawal to train orchestrators without hand-designed curricula, improving performance across reasoning and interactive tasks.  Generated by thinkingmachines/Inkling-Small In recent years, agentic orchestration has been widely applied to solve complex human tasks. However, existing orchestration learning still faces key challenges, including hand-designed curricula, advantage collapse when a task's rollouts all reach the same outcome, and unreliable evaluation signals that judge each skill by one noisy score. To address these challenges, we propose R^2Orch, a new paradigm of Recursive Self-Play Orchestration: an inner loop of self-play that improves the orchestrator on self-chosen tasks, and an outer loop that improves how the inner loop improves. To support this paradigm, we introduce Recursive Learnability, a training objective that rewards a Proposer for choosing tasks whose rollouts keep reaching different outcomes as skills are withdrawn. Built on this objective, we further propose Skill Withdrawal, in which the outer loop withdraws each skill once a controlled evaluation within self-play shows that the orchestrator performs as well without it. Moreover, the two loops form one cycle: failures are distilled into skills, skills into parameters, and withdrawals lead the Proposer to new failures, so the orchestrator moves toward zero-skill deployment. Experimental results on twelve datasets show that R^2Orch consistently outperforms baselines across question answering, math, code, and interactive tasks. Our code is available at https://github.com/beita6969/R2Orch.", 'score': 63, 'issue_id': 3489, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '50127ad3cde9823d', 'authors': ['Mingda Zhang', 'Yun Huang', 'Qiang Huang', 'Yanjin Li', 'Rui Qian', 'Qichao Zhao', 'Tiesunlong Shen', 'Na Zhao', 'Jian Wang', 'Xiaoying Tang'], 'affiliations': ['Fudan University, China', 'National University of Singapore, Singapore', 'The Chinese University of Hong Kong, Shenzhen, China', 'Tsinghua University, China', 'University of Illinois Urbana-Champaign, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.22740.jpg', 'data': {'categories': ['#rl', '#games', '#reasoning', '#training', '#agents', '#agi', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Оркестратор учится сам и постепенно отказывается от подсказок', 'desc': 'Статья предлагает R²Orch — парадигму рекурсивного самообучения (Recursive Self-Play) для обучения оркестратора агентных LLM без вручную заданных учебных программ. Внутренний цикл self-play улучшает оркестратор на задачах, которые сам Proposer выбирает, а внешний цикл улучшает сам процесс обучения. Для этого вводится цель Recursive Learnability, поощряющая выбор задач, на которых траектории (rollouts) дают разные исходы даже после удаления навыков, а также механизм Skill Withdrawal, убирающий навыки, которые больше не нужны оркестратору. Эксперименты на двенадцати датасетах показывают, что метод стабильно превосходит базовые подходы в вопросах-ответах, математике, коде и интерактивных задачах.'}, 'en': {'title': 'Learn from failures, then orchestrate with fewer skills', 'desc': 'R²Orch trains task orchestrators through recursive self-play, rather than relying on hand-designed curricula. A Proposer selects tasks that remain challenging, using differences in outcomes as skills are withdrawn to measure whether the tasks are still learnable. The system turns failures into skills and then into model parameters, while removing skills when controlled evaluations show they are no longer needed. Across twelve datasets, R²Orch outperforms baseline methods on question answering, math, code, and interactive tasks.'}, 'zh': {'title': '让智能体在自选任务与技能递减中学会独立编排', 'desc': 'R²Orch 提出一种递归自我博弈方法，让智能体编排器自行选择任务并持续改进，而不必依赖人工设计的训练课程。它用“递归可学习性”目标奖励任务提议者选择合适的任务，使撤去技能后，任务结果仍能呈现差异，避免训练信号失效。外层循环通过受控评估逐步撤去不再必要的技能；训练中的失败会被提炼为技能，再融入模型参数，推动编排器迈向无需外部技能的部署。实验表明，该方法在十二个数据集的问答、数学、编程和交互任务上均优于基线。'}}}, {'id': 'https://huggingface.co/papers/2610.39497', 'title': 'Does Scaling Toward AGI Depend on What System-1 Lets System-2 Execute?', 'url': 'https://huggingface.co/papers/2610.39497', 'abstract': "Abstract Co-designing a resource-heavy reasoning system with a lightweight predictive evaluator can reduce execution costs by filtering interactions, with efficiency governed by the density of useful interactions.  Generated by thinkingmachines/Inkling-Small Progress toward artificial general intelligence (AGI) has largely relied on scaling a resource-intensive executive, System-2, through larger models, more data and compute, longer reasoning, and more agents. We ask whether the next stage may come instead from co-designing it with System-1, a lightweight, semantically aware predictor that evaluates candidate interactions before execution, so that System-2 acts only on those worth their cost. Our answer is a qualified yes. We study conditional interaction, a predict--gate--execute--update loop: System-1 estimates each candidate's utility, System-2 executes those admitted by an adaptive threshold, and the outcomes update System-1. The loop spans training, test-time reasoning, adaptive decision-making, and agentic tool use, with utility and cost defined by the application. Under ideal screening and equal execution costs, execution compute falls by a factor approaching 1/ρ_u, where ρ_u is the density of utility-relevant interactions (cost-weighted when costs differ); prediction errors, exploration, and distribution shift reduce the saving. We bound selection regret by predictor error and the utility margin. These results motivate our central hypothesis: ρ_u is a measurable coordinate of scaling efficiency and makes informative compute a better description of scaling than total compute.", 'score': 50, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '7f670121b86eb8a7', 'authors': ['Qi Wang', 'Yun Qu', 'Lizhou Cai', 'Heming Zou', 'Haoang Chi', 'Yiqin Lv', 'Xiang Li', 'Haiyan Feng', 'Mengyu Ge', 'Yize Geng', 'Yuhang Jiang', 'Yixiu Mao', 'Xiangyang Ji'], 'affiliations': ['Department of Automation, Tsinghua University, Beijing, China', 'Department of Computer Science, Tsinghua University, Beijing, China', 'THU-IDM'], 'pdf_title_img': 'assets/pdf/title_img/2610.39497.jpg', 'data': {'categories': ['#reasoning', '#training', '#agents', '#agi', '#optimization', '#math', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Считать не всё подряд: умный отбор вместо грубой мощности', 'desc': 'Статья предлагает совместно проектировать тяжёлую систему рассуждений System-2 и лёгкий предсказатель System-1, который оценивает кандидатов на взаимодействие до их выполнения. Петля predict–gate–execute–update пропускает к System-2 только те взаимодействия, полезность которых превышает адаптивный порог, а результаты обновляют предсказатель. Теоретически показано, что вычислительные затраты падают примерно в 1/ρ_u раз, где ρ_u — плотность полезных взаимодействий, а ошибки предсказания и исследование снижают эффект, при этом регрет ограничен ошибкой предсказателя и полезным запасом. Авторы утверждают, что ρ_u можно измерять и использовать как показатель эффективности масштабирования, полезного для AGI, вместо простого роста общего объёма вычислений.'}, 'en': {'title': 'Spend Compute Only on Useful Interactions', 'desc': 'The paper proposes pairing a powerful but expensive System-2 with a lightweight System-1 predictor. System-1 estimates the utility of candidate actions, and an adaptive threshold decides which ones System-2 should execute. This predict–gate–execute–update loop can reduce compute, especially when useful interactions are rare, though prediction errors and changing data can lessen the savings. The authors argue that the density of useful interactions helps measure scaling efficiency and that informative compute may be more meaningful than total compute.'}, 'zh': {'title': '先预测再执行，让每一份计算都更有用', 'desc': '论文提出将轻量级的 System-1 预测器与资源密集型的 System-2 推理器协同设计，先评估候选交互的价值，再决定是否执行。该方法采用“预测—门控—执行—更新”循环：System-1 估计效用，System-2 按自适应阈值处理获准的交互，并利用执行结果更新预测器。理想筛选下，计算开销可随有用交互密度降低而显著减少；但预测误差、探索需求和分布偏移会削弱节省效果，选择遗憾则受预测误差和效用差距约束。作者据此提出，有用交互密度是衡量扩展效率的重要指标，相比总计算量，“信息性计算”更能描述系统的扩展能力。'}}}, {'id': 'https://huggingface.co/papers/2610.36545', 'title': 'FrameForge: Harnessing Priors of Video Foundation Models for Unified Image Generation', 'url': 'https://huggingface.co/papers/2610.36545', 'abstract': 'Abstract FrameForge enables adaptive conditional image generation by modeling variable condition-target relationships through dynamic temporal experts and intermediate reasoning pathways in pretrained video models.  Generated by thinkingmachines/Inkling-Small Unified conditional image generation requires a single model to preserve different aspects of a visual input while producing a target image that follows textual guidance. Pretrained video models provide a promising foundation by encoding visual transformations across time, yet existing approaches typically assign the condition and target to fixed temporal positions. We observe that condition-target relationships vary substantially across generation tasks, while video models naturally encode visual transformations at different temporal scales. This motivates us to model conditional generation through input-adaptive virtual temporal relations. We propose FrameForge, which captures two complementary aspects of such relations. Mixture of Temporal Experts (MoTE) models how far the target lies from the condition by dynamically selecting temporal RoPE experts with different virtual intervals. Chain of Temporal Reasoning (CoTR) models how the condition is transformed into the target through a latent intermediate state, with a reasoning-bottleneck attention mask encouraging information propagation through this pathway. Experiments on DreamBench, COCO2017, and GEdit-Bench show that FrameForge achieves superior performance in subject-driven generation, canny-to-image generation, and image editing among the compared methods.', 'score': 24, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'cb57a0a2ad3c54c2', 'pdf_title_img': 'assets/pdf/title_img/2610.36545.jpg', 'data': {'categories': ['#diffusion', '#benchmark', '#video', '#cv', '#architecture'], 'emoji': '🎞️', 'ru': {'title': 'Адаптивное временное мышление делает генерацию изображений точнее', 'desc': 'В статье представлен FrameForge — метод условной генерации изображений, который использует предобученные видеомодели. Вместо фиксированного временного положения условия и цели, модель адаптивно выбирает виртуальные временные отношения в зависимости от входных данных. Mixture of Temporal Experts (MoTE) динамически выбирает RoPE-экспертов с разными виртуальными интервалами, а Chain of Temporal Reasoning (CoTR) моделирует преобразование условия в цель через промежуточное латентное состояние с attention-маской типа reasoning-bottleneck. Эксперименты на DreamBench, COCO2017 и GEdit-Bench показывают превосходство метода в генерации по субъекту, генерации из canny-карт и редактировании изображений.'}, 'en': {'title': 'Adapt the temporal path to transform each image', 'desc': 'FrameForge adapts pretrained video models for conditional image generation, where a model uses an input image and text to create a target image. Its Mixture of Temporal Experts selects among different virtual time intervals to match how much the target should differ from the input. Its Chain of Temporal Reasoning guides information through a latent intermediate state, modeling how the input is transformed into the target. Experiments show strong results on subject-driven generation, canny-to-image generation, and image editing benchmarks.'}, 'zh': {'title': '让时间关系随任务而变，驱动更灵活的图像生成', 'desc': '本文提出 FrameForge，用预训练视频模型进行统一的条件图像生成，让模型根据输入图像和文本指引生成目标图像。它指出，不同任务中条件图像与目标图像之间的关系各不相同，因此不应把它们固定在视频序列的特定位置。时间专家混合（MoTE）会动态选择具有不同虚拟时间间隔的 RoPE 专家，以表示目标与条件之间的变化幅度；时间推理链（CoTR）则通过潜在中间状态和推理瓶颈注意力掩码，引导信息逐步传递并完成图像变换。在 DreamBench、COCO2017 和 GEdit-Bench 上的实验表明，FrameForge 在主体驱动生成、边缘图转图像和图像编辑任务中优于对比方法。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.40339', 'title': 'Wizard: Manipulate Any World in Real Time via Agentic Control', 'url': 'https://huggingface.co/papers/2610.40339', 'abstract': 'Abstract Wizard is an agentic game world model that uses structured motion proxies and adaptive masking to enable real-time, generalizable video generation with precise character control across diverse scenes.  Generated by thinkingmachines/Inkling-Small Recent advances in video world models have enabled the generation of increasingly realistic and interactive virtual environments, opening new possibilities for player-customizable gameplay. Agentic frameworks further advance this direction by decoupling explicit game logic and controllable world representations from visual generation. However, existing approaches support only simple game settings and predefined motion patterns, generalize poorly to unseen environments and characters, and offer limited real-time interactivity. In this paper, we introduce Wizard, an agentic game world model that enables real-time, precise control over character motions while generalizing zero-shot across novel scenes, characters, and actions. To achieve this, we construct a diverse dataset spanning 750 scenes and 178 characters, incorporating skeleton and geometry information as structured representations. We leverage these representations as intermediate proxies to condition a video generation model, together with an adaptive masking mechanism that improves alignment between the conditioning signals and generated video rollouts. Furthermore, we introduce an agentic framework that explicitly maintains and updates game states, allowing players to freely configure their virtual worlds and exercise fine-grained control over character motions while preserving visual quality and gameplay consistency. By combining agentic control with structured proxy-based generation, our framework unlocks new possibilities for player-driven game creation with real-time, generalizable, and mechanically consistent world simulation.', 'score': 24, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'fefd677b1d977c4e', 'authors': ['Yuzhe Wu', 'Zijun Lin', 'Yeying Jin'], 'affiliations': ['NTU', 'NUS', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.40339.jpg', 'data': {'categories': ['#games', '#dataset', '#diffusion', '#agents', '#multimodal', '#video', '#cv', '#architecture', '#3d'], 'emoji': '🧙', 'ru': {'title': 'Волшебник создаёт игровые миры в реальном времени: управляемая генерация видео без ограничений', 'desc': 'Статья представляет Wizard — агентную world model для игр, которая генерирует видео в реальном времени и позволяет точно управлять движениями персонажей. Модель использует структурированные прокси-представления (скелеты и геометрию), полученные из датасета из 750 сцен и 178 персонажей, для условной генерации видео. Адаптивный маскинг улучшает согласованность между управляющими сигналами и сгенерированными видеороликами, а агентный фреймворк поддерживает и обновляет игровое состояние. Подход обеспечивает zero-shot обобщение на новые сцены, персонажей и действия при сохранении визуального качества и игровой логики.'}, 'en': {'title': 'Control the character, create the world', 'desc': 'Wizard is an agentic game world model that generates interactive video in real time and lets players control character motions precisely. It uses skeleton and geometry information as structured proxies to guide a video generation model, with adaptive masking to better align those signals with generated frames. Its dataset covers 750 scenes and 178 characters, supporting zero-shot generalization to new scenes, characters, and actions. An explicit game-state framework lets players configure worlds and control motion while helping keep gameplay visually coherent and mechanically consistent.'}, 'zh': {'title': '让玩家实时掌控角色，在陌生世界中生成连贯游戏', 'desc': '本文提出 Wizard，一种用于游戏世界模拟的智能体视频生成模型，可实时、精确地控制角色动作，并零样本泛化到新的场景、角色和动作。研究构建了包含 750 个场景和 178 个角色的数据集，并将骨骼与几何信息作为结构化中间代理来条件化视频生成模型。模型还采用自适应掩码机制，提升控制信号与生成视频序列之间的对齐效果。其智能体框架会显式维护和更新游戏状态，使玩家能够自由配置虚拟世界、细致控制角色，同时保持视觉质量与游戏机制的一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.42149', 'title': 'Latent Reasoning in Continuous Space for Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2610.42149', 'abstract': 'Abstract LARC enables continuous latent reasoning for unified multimodal models, improving image generation quality and enabling test-time scaling without discrete token bottlenecks.  Generated by thinkingmachines/Inkling-Small Unified Multimodal Models (UMMs) achieve remarkable success on diverse multimodal understanding and generation tasks, yet they still struggle to effectively leverage language-based chain-of-thought reasoning for image generation. As a result, existing reasoning-augmented UMMs often fail to inherit the test-time scaling and fine-grained controllability observed in large language models. We attribute this failure to a fundamental modality mismatch: reasoning is performed in a discrete token space, whereas image generation operates in a continuous space. To bridge this gap, we introduce a Latent Reasoning framework in Continuous space (LARC), which alleviates the token-level bottleneck by reasoning over continuous hidden states. Specifically, the training framework consists of two stages: (i) curriculum supervised fine-tuning (SFT), and (ii) information-gain reinforcement learning (RL). First, the curriculum SFT stage gradually converts token-level reasoning into latent reasoning. Subsequently, the information-gain RL stage self-evolves latent reasoning without ground truth supervision. Experiments across diverse text-to-image generation benchmarks show that LARC consistently improves generation quality, prompt following, and compositional fidelity. Notably, LARC achieves state-of-the-art performance on GenEval with a 7%p gain over BAGEL and demonstrates clear test-time scaling behavior, outperforming token-based generation under both parallel and sequential test-time scaling strategies.', 'score': 22, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '947b6d315a15ddf4', 'authors': ['Byungwoo Jeon', 'Yoonwoo Jeong', 'Hyunseok Lee', 'Minsu Cho', 'Jinwoo Shin'], 'affiliations': ['KAIST', 'POSTECH', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2610.42149.jpg', 'data': {'categories': ['#rl', '#reasoning', '#training', '#diffusion', '#multimodal', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Рассуждать в непрерывном латентном пространстве — ключ к качественной генерации изображений', 'desc': 'Статья представляет LARC — фреймворк латентного рассуждения в непрерывном пространстве для унифицированных мультимодальных моделей (UMM), который устраняет разрыв между дискретным текстовым рассуждением и непрерывной генерацией изображений. Обучение состоит из двух этапов: куррикулум-SFT, постепенно переводящий токенное рассуждение в латентное, и обучение с подкреплением на основе information-gain (RL), которое развивает латентное рассуждение без ground truth разметки. Эксперименты на бенчмарках text-to-image показывают улучшение качества генерации, соблюдения промпта и композиционной точности, а также результат SOTA на GenEval (+7 п.п. над BAGEL). Модель демонстрирует масштабирование на этапе инференса (test-time scaling) и превосходит токенную генерацию при параллельных и последовательных стратегиях.'}, 'en': {'title': 'Reason in Latents, Generate Better Images', 'desc': 'LARC helps unified multimodal models reason about images using continuous hidden states instead of discrete text tokens. This approach bridges the mismatch between language-based reasoning and continuous image generation. Training first uses curriculum supervised fine-tuning, then information-gain reinforcement learning to improve latent reasoning without ground-truth labels. Across text-to-image benchmarks, LARC improves image quality, prompt following, and compositional fidelity, while also scaling better at test time.'}, 'zh': {'title': '在连续隐空间中推理，让多模态图像生成越想越好', 'desc': '统一多模态模型通常用离散文本 token 进行推理，但图像生成依赖连续表示，这种差异会限制推理效果和测试时扩展能力。LARC 提出在连续隐状态空间中进行潜在推理，以缩小语言推理与图像生成之间的差距。它先通过课程式监督微调逐步将 token 级推理转为潜在推理，再用信息增益强化学习在没有标准答案监督的情况下改进推理。实验显示，LARC 提升了图像生成质量、提示词遵循度和组合保真度，并在 GenEval 上取得领先表现，且测试时扩展效果优于基于 token 的方法。'}}}, {'id': 'https://huggingface.co/papers/2610.40373', 'title': 'HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model', 'url': 'https://huggingface.co/papers/2610.40373', 'abstract': 'Abstract HiFOR improves robotic manipulation by hierarchically predicting future states and retrieving relevant future information to guide action generation.  Generated by thinkingmachines/Inkling-Small Vision-Language-Action (VLA) models have demonstrated promising capabilities in robotic manipulation by integrating visual perception, language understanding, and action generation. Recent advances have further incorporated future prediction to enhance the understanding of environmental dynamics and task progression. However, existing methods often model short-term dynamics and long-term task objectives separately, while directly incorporating predicted futures into action policies without sufficiently considering their relevance to current action requirements. To address these limitations, we propose HiFOR, a hierarchical foresight framework with action-guided world retrieval. Specifically, Hierarchical Foresight Prediction jointly predicts short-term state evolution, semantic milestones, and final goal states through a Hierarchical Dependency Mask (HDM), establishing dependencies across temporal horizons. Building upon these predictions, Structure-Aware Latent World Modeling organizes future latent representations along the horizon, view, and spatial dimensions to facilitate fine-grained retrieval. Furthermore, Action-Guided Factorized World Retrieval adaptively retrieves relevant future information from the structured latent world based on evolving action representations during denoising, providing targeted guidance for action generation. Extensive experiments on two simulation benchmarks and six real-world robotic manipulation tasks demonstrate the effectiveness of our approach.', 'score': 21, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '880c1b1ad70ea34a', 'authors': ['Rongxing Ding', 'Hongyu Qu', 'Kehong Wu', 'Xudong Wang', 'Fan Zhang', 'Xinguang Xiang', 'Xiangbo Shu'], 'affiliations': ['Nanjing University of Science and Technology', 'National University of Singapore', 'Shenyang Institute of Automation, Chinese Academy of Sciences', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.40373.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Заглядывая вперёд, робот точнее действует', 'desc': 'В статье представлен фреймворк HiFOR для Vision-Language-Action (VLA) моделей в робототехнике, который иерархически предсказывает будущие состояния: краткосрочную динамику среды, семантические вехи и конечное целевое состояние. Для связи этих горизонтов используется Hierarchical Dependency Mask (HDM). Структурированное латентное мировое моделирование (Structure-Aware Latent World Modeling) организует будущие латентные представления по временным, видовым и пространственным измерениям, а механизм Action-Guided Factorized World Retrieval адаптивно извлекает релевантную информацию в процессе denoising для генерации действий. Эксперименты на двух симуляционных бенчмарках и шести реальных задачах манипуляции подтверждают эффективность подхода.'}, 'en': {'title': 'Look Ahead, Retrieve What Matters, Act with Purpose', 'desc': 'HiFOR is a framework for vision-language-action models that uses predictions about the future to improve robotic manipulation. It jointly predicts near-term changes, meaningful task milestones, and final goal states, linking them with a Hierarchical Dependency Mask. It organizes predicted future information by time horizon, camera view, and spatial location so the model can retrieve useful details. During action generation, it selects future information that fits the actions being considered, and experiments show gains in simulation and real-world tasks.'}, 'zh': {'title': '分层预见未来，按需检索信息，助力机器人精准行动', 'desc': '本文提出 HiFOR，一种用于机器人操作的分层前瞻框架，帮助视觉-语言-动作（VLA）模型利用未来状态生成动作。它通过分层依赖掩码联合预测短期状态变化、语义里程碑和最终目标状态，建立不同时间尺度之间的联系。框架还将未来的潜在表示按预测时域、视角和空间结构组织起来，并根据动作表示的变化检索与当前动作相关的信息。仿真基准和真实机器人操作任务上的实验表明，HiFOR 能有效提升操作表现。'}}}, {'id': 'https://huggingface.co/papers/2610.34722', 'title': 'CEPO: A General Framework for Improving Prompt Optimization in Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2610.34722', 'abstract': 'Abstract CEPO improves multi-agent prompt optimization by separating shared coordination from agent-specific execution, boosting performance across benchmarks and scaling efficiently with more agents.  Generated by thinkingmachines/Inkling-Small Multi-agent systems (MAS) require both effective coordination and specialized task execution. Existing prompt optimization approaches typically couple these functions within agent-specific prompts. We introduce Coordinator-Executor Prompt Optimization (CEPO), a general framework for improving prompt optimization in MAS. CEPO separates system-level coordination from agent-level execution through a shared coordinator prompt and agent-specific executor prompts, and guides their updates according to their respective roles. This structure allows shared coordination rules to be refined consistently across agents while keeping execution instructions separately adjustable. CEPO provides the prompt structure and optimization guidance, while existing prompt optimizers perform the underlying search. Extensive experiments spanning 11 benchmarks across four domains demonstrate that applying CEPO to four existing prompt optimizers consistently improves their performance. Ablations and qualitative analyses support the proposed design, while controlled studies on a document-understanding MAS further demonstrate improved optimization budget efficiency and performance scaling with the number of agents.', 'score': 17, 'issue_id': 3489, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': 'fbb469e1736ab0d0', 'authors': ['Jongha Kim', 'Seohyun Lee', 'Jonathan Minho Chung', 'Jinsung Yoon', 'Hyunwoo J. Kim'], 'affiliations': ['Google Cloud AI Research', 'KAIST', 'Korea University'], 'pdf_title_img': 'assets/pdf/title_img/2610.34722.jpg', 'data': {'categories': ['#agents', '#training', '#benchmark', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Координатор и исполнители: разделяй правила и задачи, чтобы улучшать промпты агентов', 'desc': 'В статье предлагается CEPO — фреймворк для оптимизации промптов в мультиагентных системах (MAS), где разделяются общий координатор и исполнители для каждого агента. Координатор задаёт единые правила взаимодействия, а промпты-исполнители настраивают специфические инструкции под роль каждого агента. CEPO задаёт структуру промптов и направления их обновления, а поиск оптимальных значений выполняют существующие оптимизаторы промптов. Эксперименты на 11 бенчмарках в четырёх доменах показывают стабильный прирост качества, а также лучшую эффективность бюджета оптимизации при росте числа агентов.'}, 'en': {'title': 'Coordinate Together, Execute by Role', 'desc': 'CEPO is a framework for optimizing prompts in multi-agent systems. It separates shared coordination instructions into a coordinator prompt and task-specific instructions into executor prompts for individual agents. Existing prompt optimizers search for improvements while CEPO guides updates to each prompt according to its role. Experiments across 11 benchmarks show consistent gains, more efficient use of optimization budgets, and improved scaling as the number of agents increases.'}, 'zh': {'title': '共享协调、分工执行，让多智能体提示优化更高效', 'desc': '本文提出协调者—执行者提示优化（CEPO）框架，用于改进多智能体系统中的提示优化。它将系统层面的协调规则放在所有智能体共享的协调者提示中，并将具体任务指令放在各智能体独立的执行者提示中。优化时，协调者提示和执行者提示会根据各自职责分别调整，而底层搜索仍由现有的提示优化器完成。在涵盖四个领域、11项基准测试的实验中，CEPO提升了四种现有优化器的表现；进一步研究也显示，它能更有效地利用优化预算，并随着智能体数量增加而扩展性能。'}}}, {'id': 'https://huggingface.co/papers/2610.40799', 'title': 'CaPtain: A Pipeline for Post-Training Code-as-Policy Robot Agents', 'url': 'https://huggingface.co/papers/2610.40799', 'abstract': 'Abstract CaPtain trains small open vision-language models via supervised fine-tuning and multi-turn reinforcement learning with a physical critic to perform robot manipulation through code, achieving strong results without frontier models or vision-language-action backbones.  Generated by thinkingmachines/Inkling-Small Across coding, web, and tool-use tasks, language-model agents are now routinely trained with the same recipe: supervised fine-tuning (SFT) to learn the interface, then multi-turn reinforcement learning (RL) to master it. Code-as-policy (CaP) casts robot manipulation in the same form, as the policy writes code against robot APIs and reads back the results, so the same recipe should apply. Yet existing CaP agents sidestep training: they either prompt closed frontier models or delegate manipulation to pre-trained vision-language-action models (VLAs) and high-level skills, while small open vision-language models (VLMs) fail outright. We present CaPtain, an open post-training pipeline that turns a small open VLM into a capable CaP agent, with no VLA, frontier model, or privileged state at test time. CaPtain trains and deploys the policy inside CaPtain-Harness, which exposes low-level perception, geometry, and guarded-motion primitives across simulation and real hardware. We first align the base model via SFT on synthetic trajectories generated with GPT-6 Astra, then apply multi-turn RL. Multi-turn RL must credit tens of agent requests, whose physical effects often surface turns later, from a single end-of-episode outcome. We therefore introduce a physical critic that reads privileged simulator state, never seen by the policy, and credits each request by how much it changes the predicted chance of success. Starting from Qwen3.5-4B (0% zero-shot), CaPtain-4B reaches 55.4% held-out LIBERO success after SFT and 73.8% after RL. On LIBERO-PRO, it reaches 78.5%, surpassing several frontier-model agents, and its RL gains persist across three perturbation suites (+17.6 to +21.2 points). Without target-domain training, it attains 83.3% on SimplerEnv WidowX, exceeds frontier models on CaP-Bench, and runs on a real robot after simulation-only adaptation. We release all code, data, and model weights.', 'score': 16, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '0d3af096480f548e', 'authors': ['Yijia Fan', 'Xilin He', 'Yilei Jiang', 'Dongming Wu', 'Jiaxu Wang', 'Xiangyu Yue'], 'affiliations': ['MMLab, The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.40799.jpg', 'data': {'categories': ['#rl', '#games', '#plp', '#dataset', '#training', '#small_models', '#open_source', '#synthetic', '#agents', '#multimodal', '#robotics', '#benchmark', '#agi', '#optimization', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Маленькая открытая VLM учится управлять роботом через код и сама превосходит гигантов', 'desc': 'Авторы представляют CaPtain — открытый пайплайн пост-обучения, который превращает небольшую открытую vision-language модель (VLM) в агента Code-as-Policy для манипуляций роботом. Модель сначала обучается через supervised fine-tuning на синтетических траекториях, а затем проходит multi-turn reinforcement learning. Ключевая новинка — physical critic, который использует приватное состояние симулятора, недоступное политике, и оценивает вклад каждого запроса в изменение предсказанной вероятности успеха. Итог: модель Qwen3.5-4B после обучения достигает 73.8% успеха на LIBERO и 83.3% на SimplerEnv без обучения на целевом домене, превосходя ряд агентов на frontier-моделях, и работает на реальном роботе.'}, 'en': {'title': 'Teach Small Open Models to Control Robots Through Code', 'desc': 'CaPtain trains a small open vision-language model to control robots by writing code that uses robot APIs. It first uses supervised fine-tuning on synthetic examples, then multi-turn reinforcement learning to improve performance. A physical critic uses hidden simulator state to estimate how each request affects the chance of task success, helping assign credit when effects appear several turns later. The resulting 4B-parameter agent achieves strong results in simulation and transfers to new settings and a real robot without relying on a vision-language-action model at test time.'}, 'zh': {'title': '让小型开源视觉语言模型学会用代码操控机器人', 'desc': '这篇论文提出 CaPtain，用监督微调（SFT）和多轮强化学习（RL）训练小型开源视觉语言模型，使其通过编写代码控制机器人完成操作任务。系统提供感知、几何计算和安全运动等机器人接口，并使用物理评论器评估每次代码请求对任务成功概率的影响，从而解决结果延迟出现时的奖励分配问题。训练时评论器可以读取特权模拟器状态，但执行任务的策略无需这些信息，也不依赖视觉语言动作模型或闭源前沿模型。实验显示，CaPtain 在多个模拟基准上取得较强成绩，并能迁移到真实机器人。'}}}, {'id': 'https://huggingface.co/papers/2610.42136', 'title': 'ReLift: Dense 3D Tracking as Lifted Trajectory Repair', 'url': 'https://huggingface.co/papers/2610.42136', 'abstract': 'Abstract ReLift improves dense 3D tracking by repairing and completing lifted trajectories using geometric trajectory refinement without requiring image-based training.  Generated by thinkingmachines/Inkling-Small Dense 3D tracking from monocular video requires establishing point correspondences over time, estimating their depth, and inferring their trajectories during occlusion. Existing methods typically learn these tasks jointly, a demanding objective given the scarcity of 4D supervision. We show that strong pretrained 2D trackers and 3D geometry models provide an effective foundation: lifted trajectories, with occluded segments simply interpolated, already rival dedicated 3D trackers using the same geometry. However, lifted trajectories inherit correspondence and depth errors, and under occlusion, their depth comes from the occluder rather than the tracked point. We introduce ReLift, an efficient feed-forward framework that recasts dense 3D tracking as geometric trajectory repair and completion. At its core, a trajectory corrector alternates attention along and across trajectories to preserve reliable observations, repair corrupted positions, and complete missing motion. Using only geometric inputs allows us to train directly on 3D trajectories with simulated lifting errors, decoupling training from images and from any specific tracker or geometry model. Concentrating 4D supervision on trajectory refinement yields a reusable model that consistently improves lifted trajectories across trackers and geometry providers without retraining, so it benefits directly from future advances in either component. On WorldTrack, ReLift achieves state-of-the-art mean accuracy, improving on the strongest baselines by 2.1 APD on all points and 3.0 on dynamic points, with faster configurations remaining competitive with leading 3D trackers while running faster than 4RC. Visit our supplementry page for more examples and code.', 'score': 14, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'a199152925207ade', 'authors': ['Assaf Singer', 'Maroun Khriesh', 'Noam Rotstein', 'Yoni Kasten', 'Or Litany'], 'affiliations': ['NVIDIA', 'Technion Israel Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.42136.jpg', 'data': {'categories': ['#training', '#benchmark', '#video', '#architecture', '#3d'], 'emoji': '🎯', 'ru': {'title': 'Чинить и достраивать траектории вместо того, чтобы учить всё заново', 'desc': 'Статья представляет ReLift — быстрый feed-forward фреймворк для плотного 3D-трекинга по монокулярному видео, который рассматривает задачу как восстановление и дополнение лифтированных траекторий. Из 2D-трекеров и 3D geometry models берутся траектории, а окклюзии заполняются интерполяцией, однако ошибки соответствий и глубины остаются. Ядро метода — trajectory corrector, который чередует attention вдоль и поперёк траекторий, исправляя искажённые позиции и восстанавливая пропущенное движение. Модель обучается только на геометрических данных с симулированными ошибками лифтинга, без изображений и привязки к конкретному трекеру, и на WorldTrack достигает state-of-the-art точности, опережая сильнейшие baselines.'}, 'en': {'title': 'Repair lifted trajectories for better 3D tracking', 'desc': 'ReLift improves dense 3D tracking by refining trajectories lifted from monocular video. It uses a trajectory corrector that applies attention along and across trajectories to fix errors and fill in missing motion. The model trains on 3D trajectories with simulated lifting errors, so it does not need image-based training or depend on a particular tracker or geometry model. ReLift improves accuracy across different components and achieves state-of-the-art results on WorldTrack while offering faster configurations.'}, 'zh': {'title': '修复并补全三维轨迹，让稠密跟踪更准确、更高效', 'desc': 'ReLift 将单目视频的稠密三维跟踪转化为三维轨迹的几何修复与补全，不需要基于图像进行训练。它以预训练的二维跟踪器和三维几何模型生成的轨迹为基础，利用轨迹中的可靠观测来修正错误位置，并补全遮挡时缺失的运动。核心模块通过沿轨迹和跨轨迹交替进行注意力计算，且只使用几何输入，因此可在模拟误差的三维轨迹上训练，不依赖特定的跟踪器或几何模型。在 WorldTrack 上，ReLift 达到领先的平均精度，并能跨不同基础模型提升轨迹质量，同时保持较快的运行速度。'}}}, {'id': 'https://huggingface.co/papers/2610.40738', 'title': 'Apriel Voice 27B Preview: An Open Model for Speech, Reasoning, and Tool Use', 'url': 'https://huggingface.co/papers/2610.40738', 'abstract': 'Abstract Apriel Voice 27B Preview is an open speech-language model that integrates speech understanding, reasoning, and tool use within a shared backbone, achieving strong results on audio benchmarks through a two-stage training procedure with online distillation.  Generated by thinkingmachines/Inkling-Small A capable voice assistant must do more than recognize words; it must understand requests, reason over context, sustain conversations, and act through tools. We present Apriel Voice 27B Preview, an open speech-language model that unifies these capabilities within a shared reasoning backbone while retaining text and image input modalities. Built on the post-trained Gemma 4 26B-A4B checkpoint, Apriel Voice directly processes speech and generates both responses and tool calls without requiring a separate dialogue model. We introduce a two-stage training procedure to adapt the model to speech. The first stage establishes the speech interface, while the second jointly adapts the projector and backbone through supervised fine-tuning, text replay, and source-dependent cross-entropy and forward Kullback--Leibler divergence supervision. Automatically constructed speech-conditioned dialogues provide conversational training data, while local teacher serving, overlapping teacher and student computation, and fused full-vocabulary losses enable efficient online distillation. In thinking mode, Apriel Voice achieves a score of 98.90 on Big Bench Audio, 81.13 on Speech-BFCL, and a task success rate of 65.51% on τ-Voice, with a mean latency of 1.91 seconds. It also achieves 51.27% English EVA accuracy and 74.13% experience pass@1. Finally, we deploy Apriel Voice 27B Preview on a custom serving platform to support interactive voice interactions.', 'score': 14, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'b2497c41b14dfe94', 'authors': ['Aman Tiwari', 'Akshay Kalkunte', 'Akintunde Oladipo', 'Jash Shah', 'Tara Bogavelli', 'Hoang Nguyen', 'Nishanth Madhusudhan', 'Vishal Juneja', 'Sridhar Nemala', 'Srinivas Sunkara', 'Sathwik Tejaswi Madhusudhan', 'Shruthan Radhakrishna', 'Masoud Hashemi', 'Kelechi Ogueji', 'Khalil Slimi', 'Saloni Mittal', 'Pulkit Pattnaik', 'Shashank Maiya', 'Dhruv Jhamb', 'Esakkivel Esakkiraja', 'Katrina Stankiewicz', 'Gabrielle Gauthier Melançon', 'Fanny Riols', 'Amit Saha', 'Lakshmi Sirisha Chodisetty', 'Nitin Aggarwal', 'Anil Madamala', 'Sagar Davasam', 'Segan Subramanian', 'Vikas Yadav', 'Sai Rajeswar Mudumba'], 'affiliations': ['ServiceNow'], 'pdf_title_img': 'assets/pdf/title_img/2610.40738.jpg', 'data': {'categories': ['#reasoning', '#audio', '#training', '#open_source', '#agents', '#multimodal', '#benchmark', '#optimization'], 'emoji': '🎙️', 'ru': {'title': 'Голосовой ассистент, который слышит, думает и действует', 'desc': 'Статья представляет Apriel Voice 27B Preview — открытую speech-language модель, которая объединяет распознавание речи, рассуждение и использование инструментов (tool use) в одном общем backbone. Модель построена на основе Gemma 4 26B-A4B и напрямую обрабатывает речевой вход, генерируя ответы и вызовы инструментов без отдельной диалоговой LLM. Обучение проходит в два этапа: сначала настраивается речевой интерфейс, затем совместно адаптируются projector и backbone с помощью supervised fine-tuning, text replay и online distillation с комбинацией cross-entropy и forward KL-дивергенции. Модель показывает высокие результаты на бенчмарках Big Bench Audio, Speech-BFCL и τ-Voice при средней задержке около 1,91 секунды.'}, 'en': {'title': 'One Voice Model to Listen, Reason, and Act', 'desc': 'Apriel Voice 27B Preview is an open speech-language model that understands audio, reasons about requests, and produces spoken responses or tool calls using one shared backbone. It also accepts text and images, without needing a separate dialogue model. The model is adapted to speech in two training stages, using supervised fine-tuning and online distillation, where it learns from a teacher model’s outputs. It achieves strong results on several audio and voice-assistant benchmarks, while supporting interactive conversations with low latency.'}, 'zh': {'title': '让语音模型听懂、会推理，也能调用工具', 'desc': 'Apriel Voice 27B Preview 是一种开放式语音语言模型，使用同一个推理骨干处理语音理解、推理和工具调用，也支持文本与图像输入。模型采用两阶段训练：先建立语音输入输出能力，再通过监督微调、文本回放和在线蒸馏共同适配投影层与骨干网络。训练数据包括自动构造的语音对话，并结合交叉熵损失与前向 KL 散度，让学生模型学习教师模型的输出。模型在多项音频基准上取得较强成绩，并已部署到定制平台，用于交互式语音对话。'}}}, {'id': 'https://huggingface.co/papers/2610.40636', 'title': 'Probing Spatial State Representations in Visual Foundation Models', 'url': 'https://huggingface.co/papers/2610.40636', 'abstract': 'Abstract Visual foundation models vary in supporting persistent spatial states across structure, persistence, prediction, and action, with readout accuracy not guaranteeing history-based updates or reliable goal-directed progress.  Generated by thinkingmachines/Inkling-Small An observer sees only part of the surrounding world, yet must keep track of what lies beyond the current view. Spatial perception therefore involves more than recognizing individual images: it calls for a persistent spatial state that is updated under self-motion and used to guide action. Do visual foundation models provide representations that support such a state? We study this question through four levels of spatial capability---spatial structure, object persistence, predictive spatial update, and actionability---using frozen-feature probes on ten representations under streaming egocentric observations of static indoor environments. The resulting capability profiles vary across tasks, network layers, and prefix lengths: strong readout of the visible scene does not ensure accurate object persistence or future-feature retrieval. Matched controls separate readout accuracy from reliance on visual history and motion. Native future prediction retains recoverable spatial structure, but a spatial reader trained on real features does not transfer to predicted features unchanged. Finally, goal-dependent candidate selection does not establish reliable continuous action utility: predicted actions respond to goal changes, yet supplying the correct goal does not reliably improve progress. Across the four levels, object persistence and actionability build on camera-pose readout, whereas feature prediction builds on visible-scene readout. Together, these findings motivate evaluating spatial representations not only by what can be decoded from them, but by whether that information is maintained beyond observation, updated predictively, and used for goal-directed action.', 'score': 13, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '33c0e8cf12056a06', 'authors': ['Baiqiao Yin', 'Zhongang Cai', 'Ruisi Wang', 'Qiwei Liang', 'Lei Yang', 'Ziwei Liu'], 'affiliations': ['Nanyang Technological University', 'New York University', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.40636.jpg', 'data': {'categories': ['#interpretability', '#cv', '#benchmark', '#architecture'], 'emoji': '🧭', 'ru': {'title': 'Видеть сцену недостаточно: модели должны помнить пространство и действовать в нём', 'desc': 'Статья исследует, способны ли визуальные foundation-модели формировать устойчивое пространственное состояние, необходимое для навигации и действий. Авторы проверяют четыре уровня пространственных способностей: структуру пространства, сохранение объектов, предсказание будущих признаков и пригодность для действий, используя frozen-feature probes на десяти представлениях. Результаты показывают, что хорошее считывание видимой сцены не гарантирует точного сохранения объектов и предсказания признаков, а goal-dependent выбор действий не всегда ведёт к реальному прогрессу. Авторы призывают оценивать пространственные представления не только по декодируемой информации, но и по тому, поддерживается ли она за пределами наблюдения, обновляется ли предиктивно и используется ли для целенаправленных действий.'}, 'en': {'title': 'Seeing Space Is Not Enough: Models Must Track, Predict, and Act', 'desc': 'This paper tests whether visual foundation models maintain useful spatial representations as an observer moves through indoor scenes. Using frozen-feature probes, it evaluates spatial structure, object persistence, predictive updates, and actionability across ten representations. Strong decoding of the visible scene does not guarantee that models track objects over time, predict future features reliably, or make actions that improve progress toward a goal. The results show that spatial representations should be evaluated by how well they preserve and update information over time and support goal-directed action, not just by what can be read from a single view.'}, 'zh': {'title': '空间理解不止于看见，更要记住、预测并行动', 'desc': '这篇论文研究视觉基础模型能否在连续的第一人称观察中维持并使用空间状态。研究者用冻结特征探针，评估十种模型表征的空间结构、物体持续追踪、预测性空间更新和行动能力。结果显示，模型能识别当前画面中的场景，并不代表它能可靠地追踪视野外的物体、预测未来特征或借助目标稳定地推动行动。论文因此强调，评估空间表征不能只看信息是否可解码，还要检验模型能否跨时间保存信息、根据运动更新状态并据此行动。'}}}, {'id': 'https://huggingface.co/papers/2610.40748', 'title': 'WorldBridge: Bridging Video and Action for Task Generalization in World Action Models', 'url': 'https://huggingface.co/papers/2610.40748', 'abstract': 'Abstract WorldBridge improves robot task generalization by combining video prediction with sparse action supervision via separate video and action experts, achieving state-of-the-art results across manipulation benchmarks.  Generated by thinkingmachines/Inkling-Small Achieving the broad task generalization of embodied models in physical environments remains a central challenge in robot learning. We study this challenge in World Action Models (WAMs) through two complementary capabilities: video generalization, which predicts the visual evolution of new tasks, and action generalization, which translates these predictions into executable behavior through a video-to-action bridge. By varying video and action supervision for tasks outside an initial training set, we examine their respective contributions to task transfer. On RoboTwin 2.0, using only in-distribution video-action supervision yields a 25.07% success rate on out-of-distribution tasks. Introducing videos of these tasks without their action labels raises success to 55.90%, while adding just one action-labeled demonstration per task further improves it to 70.70%. These findings suggest that broader video coverage enables task transfer by leveraging existing inverse-dynamics capabilities, while even sparse action supervision further strengthens those capabilities. Guided by this perspective, we introduce WorldBridge, a WAM with separate video and action experts connected through structured attention and trained with joint flow matching. WorldBridge incorporates visual memory at two temporal scales and action forcing, alongside a unified data processing pipeline that standardizes and filters heterogeneous robot trajectories and egocentric hand-derived supervision. Across multiple manipulation benchmarks, WorldBridge achieves state-of-the-art performance among the compared methods, including 96.23% on RoboTwin 2.0 full data setting and 80.9% on clean to random setting, 82.8% on RoboCasa GR1 TableTop, and 57.6% on DOMINO Level-1. Our study highlights the complementary roles of video prediction and action grounding in developing robots that generalize across tasks.', 'score': 12, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '13be8a6a5c25557e', 'authors': ['Jun Cen', 'Yubo Guo', 'Hao Li', 'Liangkai Li', 'Yaoxu Lyu', 'Meng Wei', 'Zeqi Xiao', 'Sizhe Yang', 'Yuqiang Yang', 'Yifan Ye', 'Shanghang Zhang', 'Duo Zheng'], 'affiliations': ['Joy Future Academy'], 'pdf_title_img': 'assets/pdf/title_img/2610.40748.jpg', 'data': {'categories': ['#games', '#training', '#benchmark', '#robotics', '#video', '#optimization', '#data', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Видео учит предсказывать, а несколько действий — выполнять: мост к обобщению роботов', 'desc': 'Статья посвящена обобщению роботов на новые задачи с помощью World Action Models (WAM), которые объединяют предсказание видео и генерацию действий. Авторы показывают, что видео без разметки действий и даже одна размеченная демонстрация на задачу заметно повышают успешность переноса на out-of-distribution задачи. На основе этого предложен WorldBridge: WAM с отдельными видео- и action-экспертами, связанными structured attention и обученными совместным flow matching, с визуальной памятью на двух масштабах времени и унифицированным пайплайном обработки данных. Модель достигает state-of-the-art результатов на нескольких бенчмарках манипуляций, включая RoboTwin 2.0 и RoboCasa.'}, 'en': {'title': 'Teach Robots New Tasks with Videos—and Just a Few Actions', 'desc': 'The paper studies how robots can generalize to tasks they have not seen before by predicting videos and turning those predictions into actions. On RoboTwin 2.0, adding videos of new tasks without action labels raises success from 25.07% to 55.90%, and one action-labeled example per task raises it to 70.70%. The authors introduce WorldBridge, a World Action Model with separate video and action experts, connected by structured attention and trained jointly with flow matching. It also uses visual memory at two time scales and action forcing, and achieves strong results across several manipulation benchmarks.'}, 'zh': {'title': '让机器人从看懂视频到学会行动', 'desc': '这篇论文研究机器人如何把学过的技能迁移到新任务，重点考察视频预测和动作生成两种能力。实验发现，加入新任务的视频但不提供动作标签，成功率从25.07%升至55.90%；每个任务再提供一个带动作标签的示范，成功率进一步升至70.70%。作者据此提出WorldBridge：它使用独立的视频专家和动作专家，通过结构化注意力连接，并以联合流匹配进行训练。WorldBridge还结合双时间尺度视觉记忆与动作强制机制，在多个操作基准上取得了所比较方法中的最佳表现。'}}}, {'id': 'https://huggingface.co/papers/2610.37918', 'title': 'Venus-DefakerOne2: A Vision-Forensics Foundation Model with Broader Coverage', 'url': 'https://huggingface.co/papers/2610.37918', 'abstract': 'Abstract Venus-DefakerOne2 is a unified anti-forgery foundation model that extends detection to diverse forgery forms and media types through alternating LoRA and full-parameter tuning and entropy-based test adaptation.  Generated by thinkingmachines/Inkling-Small Real-world forgery is inherently heterogeneous: it manifests not only as digital manipulation but also as physical spoofing, and is carried not only by images but also by videos. Despite substantial progress, a unified anti-forgery foundation model covering such a broad threat spectrum remains absent. In this paper, we present Venus-DefakerOne2, which substantially extends the forensic capability boundary along both the forgery-form and media-type dimensions. Trained on tens of millions of open-source and in-house samples, it
