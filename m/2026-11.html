er fine-tuning to balance efficiency, generalization, and adaptation to difficult examples while reducing catastrophic forgetting. At test time, entropy-based adaptation selects the prediction modality based on the model’s prediction entropy. The model achieves state-of-the-art results across benchmarks for deepfakes, AI-generated media, document tampering, image manipulation, and physical spoofs.'}, 'zh': {'title': '跨越图像与视频，统一识别多种伪造', 'desc': 'Venus-DefakerOne2 是一个统一的反伪造基础模型，可检测图像和视频中的多种数字篡改与实体伪造。它使用交替进行 LoRA 微调和全参数微调的方法，在控制计算成本的同时提升泛化能力、拟合难例，并缓解灾难性遗忘。模型还通过分析预测熵进行测试时自适应，以选择合适的预测方式。在多个基准测试中，它取得了先进表现，覆盖深度伪造人脸、AI 生成内容、篡改文档和实体伪造等任务。'}}}, {'id': 'https://huggingface.co/papers/2610.40945', 'title': 'On the Origin and Evolution of Training-Inference Mismatch in LLM Reinforcement Learning', 'url': 'https://huggingface.co/papers/2610.40945', 'abstract': "Abstract On-policy reinforcement learning for large language models suffers from training-inference mismatch due to numerical discrepancies and policy lag, and a derived discrepancy-lag correction stabilizes training by centering errors, clipping importance ratios, and resynchronizing sampling.  Generated by thinkingmachines/Inkling-Small On-policy reinforcement learning for large language models assumes that training responses are sampled from the current policy. In practice, an inference engine samples the responses and a separate trainer computes the gradients, and the training-inference mismatch between the two makes the training data off-policy. The mismatch has two sources, the numerics of the engine and the stale weights of asynchronous sampling, and a correction that stabilizes training under one source can fail under the other. We ask which property of a mismatch source decides the correction it needs. Evaluating the trainer at the sampler's weights splits each sampled-token error exactly into a numerical discrepancy of the engine and a policy lag of the trainer, and we follow both through training. The numerical discrepancy stays approximately constant, so it biases the updates by a nearly fixed amount, and centering the score at each prefix removes its leading bias. The policy lag is produced by the trainer's own updates: the bias it leaves enters the next update, which enlarges the next lag and closes a feedback loop. Importance weighting cuts this loop only while the lag ratio stays concentrated, and on Qwen3-1.7B it fails at the step where the effective sample size of the ratio falls below one half. From this account we derive the discrepancy-lag correction (DLC), which centers the numerical discrepancy, clips the lag ratio against the sampler's weights and resynchronizes the sampler when this effective sample size falls below one half. Under a stale sampler, DLC keeps the KL divergence from on-policy training within twice the KL between two independent on-policy trainings on Qwen3-0.6B and Qwen3-1.7B, and its resynchronization prevents collapses that the per-token corrections leave and that a KL measured on the sampler's prefixes does not detect.", 'score': 4, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'b22f7e6935a818ad', 'pdf_title_img': 'assets/pdf/title_img/2610.40945.jpg', 'data': {'categories': ['#rl', '#alignment', '#training', '#small_models', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Синхронизируй сэмплер — и обучение LLM снова станет стабильным', 'desc': 'Статья рассматривает проблему рассогласования между сэмплером (inference engine) и тренером в on-policy обучении с подкреплением для LLM: численные расхождения движка и устаревание весов при асинхронной генерации (policy lag) делают данные off-policy. Авторы показывают, что численная ошибка почти постоянна и смещает обновления, и её можно убрать центрированием score на каждом префиксе, тогда как policy lag образует обратную связь, которую importance weighting сдерживает лишь пока отношение весов остаётся сконцентрированным. На основе этого предложен метод DLC (discrepancy-lag correction): центрирование численной ошибки, клиппинг отношения importance weights и ресинхронизация сэмплера, когда effective sample size падает ниже одной второй. Эксперименты на Qwen3-0.6B и Qwen3-1.7B показывают, что DLC удерживает KL-дивергенцию в пределах удвоенного KL между двумя независимыми on-policy запусками и предотвращает коллапс обучения.'}, 'en': {'title': 'Correct steady errors, control policy lag, and keep training on track', 'desc': 'The paper studies why on-policy reinforcement learning for large language models becomes off-policy when an inference engine generates responses and a separate trainer updates the model. It separates the mismatch into numerical discrepancy, which causes a relatively steady bias, and policy lag, which grows through feedback between updates. The proposed discrepancy-lag correction (DLC) centers numerical errors, clips importance ratios to limit policy lag, and resynchronizes sampling when the effective sample size becomes too low. Experiments on Qwen3 models show that DLC keeps training closer to on-policy behavior and prevents collapses missed by some other corrections.'}, 'zh': {'title': '拆解误差与滞后，让大模型强化学习更稳定', 'desc': '这篇论文研究大语言模型进行在策略强化学习时，推理引擎与训练器之间的差异如何导致训练数据变成离策略数据。作者将这种差异分为推理引擎数值误差和训练器权重滞后，并发现前者造成近似固定的偏差，后者则会形成不断加剧的反馈循环。为此，论文提出差异—滞后校正（DLC）：按前缀中心化数值误差、裁剪滞后策略的重要性比率，并在有效样本量低于阈值时重新同步采样器。在 Qwen3 实验中，DLC 能更稳定地贴近在策略训练，并避免其他逐 token 校正可能遗漏的训练崩溃。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.39276', 'title': 'MemSteer: Turning User Histories into Supervision for Agent Memory Optimization', 'url': 'https://huggingface.co/papers/2610.39276', 'abstract': "Abstract MemSteer generates evidence-grounded QA supervision from unlabeled user histories to optimize agent memory design without model updates, improving benchmark scores significantly.  Generated by thinkingmachines/Inkling-Small An effective agent memory system should adapt to a user's history and task requirements. Human-annotated supervision can guide this adaptation by providing feedback for evaluating and improving memory designs. Yet suitable labels are rarely available for new user histories, and manually constructing QA pairs and supporting evidence is costly. We introduce MemSteer, which turns unlabeled user histories into question-answer (QA) supervision with supporting evidence for memory-design optimization. MemSteer constructs an evidence-grounded answer plan that specifies how facts across related records jointly support a reference answer. The plan guides question generation, while source-grounded auditing and blind answer recovery check the resulting annotations. To study the utility of this supervision, we develop MemSteer-Opt, which combines QA-based design evaluation with evidence-guided failure diagnosis to revise memory store, retrieval, and context construction without updating model parameters. Experiments on ATM-Bench and RHELM show that this supervision is competitive with official-QA-guided optimization. Relative to Base-BM25, MemSteer-Opt improves ATM-Bench Question Score by 13.4 points and RHELM accuracy by 4.1 and 6.6 points without and with external data, respectively. The supervision also benefits two existing optimizers on ATM-Bench, while new-user experiments demonstrate continued design optimization using supervision generated from the target histories.", 'score': 2, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '6427a1b96e3abcce', 'authors': ['Jie Huang', 'Cuiling Lan', 'Qize Yu', 'Xiulian Peng', 'Yan Lu'], 'affiliations': ['Microsoft Research Asia', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.39276.jpg', 'data': {'categories': ['#reasoning', '#training', '#synthetic', '#agents', '#rag', '#benchmark', '#data'], 'emoji': '🧠', 'ru': {'title': 'Память агента учится на собственной истории без разметки', 'desc': 'В статье представлен MemSteer, метод, который генерирует вопросно-ответные (QA) данные с опорой на доказательства из неразмеченных истории пользователей. Система строит план ответа, связывающий факты из разных записей, а затем проверяет аннотации через аудит по источникам и слепое восстановление ответа. Далее MemSteer-Opt использует эти QA-данные и диагностику ошибок для улучшения хранилища памяти, механизма поиска и построения контекста агента без обновления параметров LLM. Эксперименты на ATM-Bench и RHELM показывают значительный прирост качества относительно базового BM25.'}, 'en': {'title': 'Turn user histories into evidence that steers better agent memory', 'desc': 'MemSteer creates question-and-answer training examples from unlabeled user histories, along with evidence showing which records support each answer. It uses an evidence-based answer plan to guide question writing, then checks the examples through source audits and attempts to recover answers without seeing the questions. MemSteer-Opt uses this supervision to evaluate and improve how an agent stores, retrieves, and assembles memories, without changing the model’s parameters. Experiments on ATM-Bench and RHELM show improved performance over a BM25 baseline, and the generated supervision can also help other memory optimizers.'}, 'zh': {'title': '从用户历史生成证据监督，让智能体记忆无需更新模型也能持续优化', 'desc': 'MemSteer 从未标注的用户历史中生成带有证据支持的问答监督数据，用来优化智能体的记忆设计。它先制定证据答案计划，说明多条相关记录如何共同支持答案，再据此生成问题，并通过来源核查和盲答恢复检查标注质量。MemSteer-Opt 利用这些问答评估记忆设计、诊断失败原因，并调整记忆存储、检索和上下文构建，而无需更新模型参数。在 ATM-Bench 和 RHELM 上，该方法取得了有竞争力的结果，并显著优于 Base-BM25；新用户实验也表明，它能利用目标用户历史持续优化记忆设计。'}}}, {'id': 'https://huggingface.co/papers/2610.42096', 'title': 'CausalWAM: Learning the Causes of Actions in World Action Models', 'url': 'https://huggingface.co/papers/2610.42096', 'abstract': 'Abstract Causal World Action Models enforce sparse routing to isolate action-relevant latent variables, ensuring identifiable causal structure without requiring temporal independence assumptions.  Generated by thinkingmachines/Inkling-Small World action models (WAMs) learn latent variables from observations and use these to both predict the evolution of the scene and to generate actions. The prediction has to be of the whole scene, whereas only a portion of the scene causes actions. WAMs fitted to demonstrations do not, in general, guarantee that they will generate actions solely from the latent causes of the demonstrated actions (the action-relevant latent variables), as the model could just as well learn to imitate in this way whilst entangling the action-relevant latent variables with the nuisance variables. We therefore separate out what causes action from what prediction depends on. We prove that under a sparsity constraint the latent variables used to generate actions are an invertible function of the action-relevant latent variables alone and the true structure is identified up to a permutation of the latent variables. This requires neither sufficient temporal dependence nor any assumptions on how the unobserved regimes evolve and holds even when the action-relevant latent variables are statistically dependent on the rest. We therefore propose CWAM (Causal WAM), which incorporates the constraint into a pretrained WAM by adding a sparse routing path to its action head, with the world modeling objective remaining unchanged. Experiments on both synthetic data and real-world robots validate the theory as well as showcase the improved efficiency in closed-loop success.', 'score': 2, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'b97cfd7954c231d0', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#interpretability', '#training', '#robotics', '#optimization', '#math', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Действия только из истинных причин: causal-структура для роботов', 'desc': 'В статье предлагается Causal WAM (CWAM) — модель мира для действий, которая разделяет латентные переменные, влияющие на действия, и те, от которых зависит предсказание сцены. Авторы вводят ограничение разреженности (sparsity), которое направляет генерацию действий только через action-relevant латентные переменные. Доказано, что при таком ограничении истинная causal структура идентифицируема с точностью до перестановки переменных, без требований о временной зависимости. Эксперименты на синтетических данных и реальных роботах подтверждают теорию и показывают повышение эффективности closed-loop успешности.'}, 'en': {'title': 'Route Actions Through Their True Causes', 'desc': 'World action models learn latent variables to predict how a scene changes and to choose actions. However, a model trained from demonstrations may mix variables that cause actions with irrelevant details, making its actions depend on nuisance variables. Causal WAM adds sparse routing to the action-generation path, so the action inputs identify the action-relevant latent variables up to a permutation, without requiring temporal independence. Tests on synthetic data and real robots support the theory and show improved efficiency in closed-loop task success.'}, 'zh': {'title': '让动作只听从真正相关的潜在因素', 'desc': '世界动作模型（WAM）从观测中学习潜在变量，用来预测场景变化并生成动作，但普通模型可能把动作相关因素与无关因素混在一起。论文提出因果世界动作模型（CWAM），在动作生成部分加入稀疏路由，使模型只使用与动作有关的潜在变量。理论证明，在稀疏约束下，动作所用的潜在变量可唯一确定到变量排列，且不需要假设潜在变量在时间上相互独立。合成数据和真实机器人实验表明，CWAM符合理论预期，并能提高闭环任务的成功效率。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.37919', 'title': 'SciGame: Let Agents Play the Scientific Discovery Games in the Real and Counterfactual World', 'url': 'https://huggingface.co/papers/2610.37919', 'abstract': 'Abstract SciGame evaluates scientific discovery agents using structured cards with counterfactual environments to separate prior knowledge from empirical evidence, revealing that exact symbolic law recovery remains a key challenge.  Generated by thinkingmachines/Inkling-Small Large language model agents are increasingly used for scientific discovery. However, existing benchmarks mix law inference with programming, score data fitting instead of prediction on unseen inputs, and do not separate empirical evidence from pretrained priors. We introduce SciGame, a controlled benchmark that converts scientific literature into structured scientific cards. Each card yields a pair of Original and dimensionally consistent Counterfactual environments with the same task interface. SciGame contains a Historical collection of canonical laws and a live Temporal collection curated from papers published after model knowledge cutoffs. It evaluates agents in candidate-guided Identification and open-ended Discovery settings. Each setting runs under Prior-only, Fixed, and Adaptive protocols. Experiments on five frontier models yield three findings. First, familiar priors hurt performance once the governing relation is altered. Second, adaptive experimentation helps the strongest models but harms weaker ones under limited budgets. Third, good explanations can hide quantitative failures. Recovering the exact symbolic form remains the main bottleneck, even when agents interpret evidence correctly. Current agents can investigate systems actively, but inducing exact laws in unfamiliar settings remains an open challenge.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'db5962c212437254', 'authors': ['Yusheng Zhao', 'Bowei He', 'Xue Liu', 'Mingxiao Li'], 'affiliations': ['MBZUAI', 'McGill University', 'Shanghai AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.37919.jpg', 'data': {'categories': ['#science', '#dataset', '#reasoning', '#agents', '#benchmark', '#leakage'], 'emoji': '🔬', 'ru': {'title': 'Агенты умеют исследовать, но точный закон в незнакомых условиях вывести пока не могут', 'desc': 'В статье представлен SciGame — контролируемый бенчмарк для оценки LLM-агентов в задачах научного открытия. Литературные источники преобразуются в структурированные научные карточки, из которых строятся оригинальная и контрфактическая среды с одинаковым интерфейсом, что позволяет отделить априорные знания модели от эмпирических данных. Эксперименты с пятью передовыми моделями показали, что привычные априорные знания мешают при изменении управляющих зависимостей, а адаптивное экспериментирование помогает сильнейшим моделям, но вредит слабым. Главным узким местом остаётся точное восстановление символьной формы закона, даже когда агенты правильно интерпретируют данные.'}, 'en': {'title': 'Test the evidence, not just the prior: exact scientific laws remain hard to discover', 'desc': 'SciGame is a benchmark for testing whether AI agents can discover scientific laws from evidence rather than rely on what they learned during training. It uses structured scientific cards to create original environments and dimensionally consistent counterfactuals, and tests both familiar laws and findings published after models’ training cutoffs. Agents are evaluated through candidate-guided identification and open-ended discovery, using protocols that vary how much prior knowledge and experimentation they can use. Results show that familiar knowledge can mislead agents, adaptive experiments help only the strongest models, and recovering an exact symbolic law remains difficult even when explanations sound convincing.'}, 'zh': {'title': '能探索，更要发现：让智能体从证据中还原精确科学定律', 'desc': '本文提出 SciGame，一个用于评估科学发现智能体的可控基准测试。它把科学文献整理成结构化卡片，并为每个任务构建原始环境和量纲一致的反事实环境，以区分模型的先验知识与实验所得证据。基准测试包含候选引导的识别和开放式发现任务，并通过不同实验协议评估智能体。结果表明，主动实验对强模型有帮助，却可能损害弱模型的表现；即使解释合理，模型仍常无法准确恢复规律的符号形式。'}}}, {'id': 'https://huggingface.co/papers/2610.31222', 'title': 'GLOW-FM: Efficient Generative Low-Light Image Enhancement with One-Step Latent Flow Matching', 'url': 'https://huggingface.co/papers/2610.31222', 'abstract': 'Abstract GLOW-FM is a one-step latent flow-matching framework that enables efficient generative low-light image enhancement via single-function evaluation in a compact latent space.  Generated by thinkingmachines/Inkling-Small Low-light image enhancement (LLIE) aims to recover well-exposed and perceptually faithful images from severely degraded observations. Recent diffusion-based generative methods achieve strong perceptual quality by leveraging powerful image priors, but their iterative sampling incurs substantial computational cost, limiting practical deployment. Despite recent efficiency gains in generative LLIE, high-quality enhancement with a single function evaluation and low overall computation remains challenging, particularly under diverse real-world low-light conditions. We introduce GLOW-FM, a one-step latent flow-matching framework for efficient generative LLIE. GLOW-FM performs conditional transport in the latent space of a frozen Tiny-VAE and leverages Terminal Velocity Matching (TVM) to enable enhancement with a single function evaluation. Matched comparisons with alternative one-step objectives support TVM as an effective design choice, and, to the best of our knowledge, this is its first adaptation to image restoration and specifically to LLIE. Extensive experiments on challenging real-world benchmarks demonstrate that GLOW-FM achieves competitive image quality and state-of-the-art cross-dataset generalization while requiring only a single function evaluation and 34 GFLOPs for the small variant. These findings highlight the potential of GLOW-FM to bring generative LLIE closer to practical deployment through single-step inference and compact latent modeling. Code will be made publicly available upon publication.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '039325a4024fb4b1', 'authors': ['Ariel Lapid', 'Yuval Haitman', 'Reuven Peretz', 'Arnon Netzer', 'Idit Diamant'], 'affiliations': ['Arm Ltd'], 'pdf_title_img': 'assets/pdf/title_img/2610.31222.jpg', 'data': {'categories': ['#inference', '#training', '#diffusion', '#optimization', '#cv', '#architecture'], 'emoji': '💡', 'ru': {'title': 'Один шаг вместо сотен: быстрое улучшение изображений при слабом свете', 'desc': 'GLOW-FM — это фреймворк на основе latent flow matching, который улучшает изображения при слабом освещении за один шаг. Модель выполняет условный перенос (conditional transport) в латентном пространстве замороженного Tiny-VAE, что делает обработку компактной. Для обучения используется Terminal Velocity Matching (TVM), который позволяет получать результат за одну function evaluation; это первая адаптация TVM для задач image restoration и LLIE. На сложных реальных бенчмарках метод показывает конкурентное качество, лучшую кросс-датасетную генерализацию и требует всего 34 GFLOPs для малого варианта, что приближает генеративный LLIE к практическому применению.'}, 'en': {'title': 'Brighten Low-Light Images in One Step', 'desc': 'GLOW-FM enhances low-light images using flow matching in the compact latent space of a frozen Tiny-VAE. It uses Terminal Velocity Matching to generate an enhanced image with a single function evaluation, avoiding the costly iterative sampling used by diffusion models. Experiments show competitive image quality and state-of-the-art generalization across datasets, with the small model requiring 34 GFLOPs. The results suggest that one-step latent generation can make generative low-light enhancement more practical.'}, 'zh': {'title': '一步推理，让暗光图像焕发清晰真实', 'desc': 'GLOW-FM 是一种用于低照度图像增强的一步式潜空间流匹配框架，目标是从严重退化的暗光图像中恢复自然、曝光良好的图像。它在冻结的 Tiny-VAE 潜空间中进行条件传输，并用终端速度匹配（TVM）实现单次函数评估即可完成增强。实验表明，TVM 是有效的一步式训练目标；在真实场景基准上，该方法取得有竞争力的图像质量和先进的跨数据集泛化能力。小型版本仅需一次函数评估和 34 GFLOPs，展现了生成式低照度增强走向实际部署的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.29617', 'title': 'TernScope: Model-Hardware Co-Design for Efficient Ternary Endoscopic Segmentation', 'url': 'https://huggingface.co/papers/2610.29617', 'abstract': 'Abstract TernScope co-designs a compact ternary-weight segmentation network with simplified hardware to achieve high accuracy and fast inference for edge medical imaging.  Generated by thinkingmachines/Inkling-Small Edge medical segmentation must reconcile small model size, high accuracy, and fast inference. TernScope addresses this tradeoff through model--hardware co-design, learning a compact segmentation network whose low-bit operators also simplify hardware execution. Split-channel large-kernel blocks preserve spatial context with limited computation, while branch fusion removes redundant inference paths. Ternary Progressive Quantization-aware Training (TPQ) then adapts the fused network from deep to shallow layers, through the decoder, and finally to the input and prediction layers. All 25 convolutions use ternary weights and 8-bit activations, enabling packed storage and multiplier-free computation. The resulting model uses 0.2483 M parameters and 0.0949 GMACs while retaining competitive segmentation accuracy on in-domain and external datasets. Under the same 45 nm technology, TernScope reduces compute-array area by 88.46% compared with the original Gemmini, a systolic-array accelerator with 8-bit times 8-bit multipliers. These results demonstrate a path from accurate lightweight medical segmentation to compact low-bit hardware.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '66e0128e3ed7b5c9', 'authors': ['Zhuoyu Wu', 'Wenhui Ou', 'Qiawei Zheng', 'Xuhong Qiu', 'Wenqi Fang', 'Raphaël C. -W. Phan'], 'affiliations': ['CyPhi AI Research Lab, School of Information Technology, Monash University Malaysia, Malaysia', 'Department of Electronic and Computer Engineering, The Hong Kong University of Science and Technology, Hong Kong', 'School of Computer Science and Engineering, Southeast University, Nanjing, China', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2610.29617.jpg', 'data': {'categories': ['#inference', '#small_models', '#training', '#healthcare', '#optimization', '#cv', '#architecture'], 'emoji': '\U0001fa7b', 'ru': {'title': 'Точная медицинская сегментация в компактном тернарном формате', 'desc': 'TernScope — это компактная сегментационная нейросеть для медицинских изображений, которая разрабатывается совместно с аппаратной частью, чтобы работать на edge-устройствах. Сеть использует тернарные веса (ternary weights) и 8-битные активации, что позволяет хранить модель в упакованном виде и вычислять без умножителей. Метод Ternary Progressive Quantization-aware Training (TPQ) постепенно адаптирует сеть к квантованию: от глубоких слоёв к поверхностным, затем к декодеру и входным и выходным слоям. Модель содержит всего 0.2483 M параметров и 0.0949 GMACs, сохраняя конкурентную точность, а вычислительный блок по сравнению с Gemmini сокращён по площади на 88.46%.'}, 'en': {'title': 'Accurate Medical Segmentation, Built for Ternary Hardware', 'desc': 'TernScope jointly designs a compact medical image segmentation network and its hardware to achieve efficient inference on edge devices. Split-channel large-kernel blocks preserve spatial context with low computation, and branch fusion removes redundant inference paths. Ternary Progressive Quantization-aware Training adapts the network to use ternary weights and 8-bit activations across all convolutions, reducing storage and enabling multiplier-free computation. The model retains competitive segmentation accuracy with 0.2483 million parameters and reduces compute-array area by 88.46% compared with the Gemmini accelerator.'}, 'zh': {'title': '协同设计，让精准医疗分割更小、更快', 'desc': 'TernScope通过模型与硬件协同设计，构建适用于边缘医疗影像的轻量级图像分割网络。它采用分通道大卷积核模块保留空间上下文，并通过分支融合去除冗余计算路径。随后，渐进式三值量化感知训练从深层到浅层逐步适配网络；全部25个卷积层使用三值权重和8位激活，从而支持紧凑存储与无需乘法器的计算。该模型仅有0.2483 M个参数和0.0949 GMACs，在保持有竞争力的分割精度的同时，相比Gemmini将计算阵列面积减少88.46%。'}}}, {'id': 'https://huggingface.co/papers/2610.41260', 'title': 'SketchDirector: Complex Scene Sketching via Agentic Layout Reasoning and Detail Refinement', 'url': 'https://huggingface.co/papers/2610.41260', 'abstract': 'Abstract SketchDirector is an agentic framework that decomposes text prompts into draft vector assets, arranges them via iterative reasoning with self-evolving memory, and refines details using diffusion priors for complex scene sketching.  Generated by thinkingmachines/Inkling-Small Existing sketch generation methods often rely on image guidance and are largely limited to individual objects or simplified scenes, leaving text-guided complex scene sketching underexplored. We present SketchDirector, an agentic framework that mimics the human sketching workflow for automatic multi-concept scene sketching. Given a scene-level text prompt, SketchDirector first employs a large language model~(LLM) to decompose the scene into multiple draft assets, where each is represented by a set of Bézier curves. Then, an agentic reasoning loop iteratively plans and executes their spatial arrangement, guided by self-evolving memory. Finally, a detail refinement module leverages diffusion priors to enhance sketch quality while preserving geometric structure. To support future research and applications in multi-concept scene sketch generation, we further introduce the MCSketch8K dataset, comprising editable vector assets, compositional layouts, and object-level manipulation annotations. Extensive experiments show that SketchDirector outperforms state-of-the-art baselines in semantic and compositional quality while effectively preserving overall contour organization during refinement. The project page is: https://yiki77.github.io/SketchDirector/{https://yiki77.github.io/SketchDirector/}.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'eeedc93e6b4a7ba7', 'authors': ['Yiqi Liang', 'Xiaodong Cun'], 'affiliations': ['Great Bay University'], 'pdf_title_img': 'assets/pdf/title_img/2610.41260.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#cv'], 'emoji': '✏️', 'ru': {'title': 'От текстового описания к целой сцене — эскиз, который строит AI-режиссёр', 'desc': 'SketchDirector — это агентный фреймворк, который разбивает текстовый промпт сцены на несколько черновых векторных ассетов, представленных кривыми Безье. Большая языковая модель (LLM) планирует их пространственное расположение в итеративном цикле рассуждений с самообучающейся памятью (self-evolving memory). Затем модуль уточнения деталей использует диффузионные априорные знания (diffusion priors), чтобы улучшить качество эскиза и сохранить геометрическую структуру. Авторы также представляют датасет MCSketch8K с редактируемыми векторными ассетами и аннотациями для манипуляций на уровне объектов, а эксперименты показывают превосходство над современными baseline-методами по семантическому и композиционному качеству.'}, 'en': {'title': 'From Text to Thoughtfully Composed Scene Sketches', 'desc': 'SketchDirector turns a text description of a complex scene into a sketch containing multiple objects. A large language model breaks the scene into draft assets made from Bézier curves, and an agent iteratively arranges them using a memory that updates as it works. A refinement module uses diffusion priors to improve visual details while preserving the sketch’s overall geometry. The authors also introduce the MCSketch8K dataset, and experiments show that SketchDirector produces more semantically accurate, well-composed sketches than existing methods.'}, 'zh': {'title': '让智能体像人一样构思、布局并细化复杂场景草图', 'desc': '本文提出 SketchDirector，用于根据场景级文本提示生成包含多个概念的草图。它先用大语言模型把提示拆解成多个由贝塞尔曲线表示的草稿素材，再通过带有自进化记忆的智能体推理循环规划并调整素材布局。之后，系统利用扩散模型先验细化草图，同时尽量保持原有的几何结构。作者还构建了 MCSketch8K 数据集；实验表明，该方法在语义与构图质量上优于现有基线，并能保留整体轮廓布局。'}}}, {'id': 'https://huggingface.co/papers/2610.40727', 'title': 'VoxLock: Target-Speaker Extraction for Voice Agents Without an Enrollment Step', 'url': 'https://huggingface.co/papers/2610.40727', 'abstract': "Abstract A fine-tuned causal target-speaker extraction model achieves near-commercial speech recognition accuracy on real recordings with low CPU usage and latency.  Generated by thinkingmachines/Inkling-Small A voice agent's speech recognizer transcribes everyone near the microphone, including people other than the caller. I fine-tuned a public causal target-speaker extraction model (REAL-TSE, 27M parameters) on one GPU to work from a voice sample cut from the call itself, and released it as VoxLock. I score it by what a recognizer writes on real recordings. On Krisp's 265-recording benchmark it reaches 4.95% WER against 23.21% unprocessed and lets 9 background words into the transcript over 85 minutes of background-only speech. Its WER is not significantly different from Krisp's best filters and is significantly lower than the other commercial and open systems I tested. On 400 AMI meeting windows built and frozen before scoring, it cuts WER from 42.95% to 10.63%. The 8-bit model runs a live call on 77% of one CPU thread with 24 ms of algorithmic latency. Model, code and per-file scores are open.", 'score': 0, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '898f315e5f5f7323', 'authors': ['Arbaz Siddiqui'], 'affiliations': ['Independent researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.40727.jpg', 'data': {'categories': ['#audio', '#small_models', '#training', '#benchmark', '#optimization', '#open_source', '#inference'], 'emoji': '🎙️', 'ru': {'title': 'Слышим только звонящего: голос в шумной комнате без лишних слов', 'desc': 'Авторы дообучили каузальную модель выделения целевого диктора REAL-TSE (27 млн параметров) на одном GPU, используя голосовой образец, взятый из самого звонка. Модель, названная VoxLock, подавляет речь посторонних людей, которую распознаватель иначе транскрибирует. На бенчмарке Krisp WER снижается с 23.21% до 4.95%, что сопоставимо с лучшими коммерческими фильтрами. Квантованная 8-битная версия работает в реальном времени на одном CPU-потоке с задержкой 24 мс.'}, 'en': {'title': 'Lock on to the caller, leave background voices behind', 'desc': 'The paper fine-tunes REAL-TSE, a causal target-speaker extraction model, to isolate a caller’s voice using a voice sample taken from the call. The resulting 27-million-parameter model, VoxLock, is evaluated by the word error rate (WER) of a speech recognizer on real recordings. It achieves 4.95% WER on Krisp’s benchmark and reduces WER from 42.95% to 10.63% on AMI meeting audio, while strongly suppressing background speech. Its 8-bit version runs in real time using 77% of one CPU thread with 24 ms of algorithmic latency.'}, 'zh': {'title': '锁定目标说话人，让实时语音识别更准确', 'desc': '这篇论文将一个公开的因果式目标说话人提取模型 REAL-TSE 微调为 VoxLock，使其能够根据通话中的一段语音样本，只提取目标说话人的声音。作者通过语音识别系统在真实录音上的词错误率（WER）评估效果：在 Krisp 的 265 段录音上，WER 从未处理时的 23.21% 降至 4.95%，在 AMI 会议片段上则从 42.95% 降至 10.63%。测试还显示，它能有效压制背景说话人的语音，效果与 Krisp 的最佳滤波器相当，并优于作者测试的其他商用和开源系统。经过 8 位量化后，该模型仅使用单个 CPU 线程约 77% 的算力，算法延迟为 24 毫秒，适合实时通话。'}}}, {'id': 'https://huggingface.co/papers/2610.40914', 'title': 'No Channels Left Behind: Understanding Diffusion Acceleration through Residual Gates', 'url': 'https://huggingface.co/papers/2610.40914', 'abstract': 'Abstract Training acceleration in diffusion transformers is driven by reorganization of AdaLN-Zero residual gates, and a simple radial objective promoting broader gate participation improves generation quality without auxiliary teachers.  Generated by thinkingmachines/Inkling-Small Training acceleration methods for diffusion transformers, such as REPA and dispersive regularization, are commonly explained by additional supervision, spatial-structure priors, or improved feature geometry. We revisit this view and uncover a striking internal change: the AdaLN-Zero residual gate α, which directly controls how conditioned updates enter the residual stream, is substantially reorganized by these methods. This observation motivates our hypothesis that acceleration arises, at least in part, from reshaping the residual gating pathway rather than solely from the feature structures explicitly imposed by auxiliary objectives. Supporting this view, accelerated models are markedly more sensitive to perturbations of α, and their gate geometry reflects semantic relationships among classes. We further introduce the normalized participation ratio (nPR) to characterize the channel-wise organization of the gates and find that, across REPA teachers, projector architectures, and radial-objective targets, broader gate participation accompanies better generation quality. Guided by this insight, we propose a simple teacher-free radial objective that promotes broader gate participation through feature-norm regularization, without pairwise feature comparisons. On ImageNet 256times256 with SiT-B/2, our method improves FID over dispersive loss while increasing mean gate participation over timesteps and classes, further supporting the link between gate organization and training acceleration. Our results identify residual-gate reorganization as a measurable axis of diffusion training acceleration and suggest a simple direction for further acceleration.', 'score': 0, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '811a2d2363d04f72', 'authors': ['Junha Park', 'Jaemyung Yu', 'Jaehui Hwang', 'Jong-Seok Lee', 'Dongyoon Han'], 'affiliations': ['NAVER AI Lab', 'Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2610.40914.jpg', 'data': {'categories': ['#interpretability', '#training', '#diffusion', '#optimization', '#architecture'], 'emoji': '⚙️', 'ru': {'title': 'Ускорение диффузии начинается с перестройки residual gates', 'desc': 'Авторы показывают, что методы ускорения обучения диффузионных трансформеров (REPA, dispersive loss) заметно перестраивают AdaLN-Zero residual gate α, который управляет тем, как условные обновления попадают в residual stream. Для описания организации каналов гейтов вводится нормализованный participation ratio (nPR), и оказывается, что более широкое участие гейтов связано с лучшим качеством генерации. На основе этого предлагается простой teacher-free радиальный регуляризатор, который через норму признаков расширяет участие гейтов без попарных сравнений признаков. На ImageNet 256×256 с SiT-B/2 метод улучшает FID по сравнению с dispersive loss.'}, 'en': {'title': 'Broader Residual-Gate Participation for Better Diffusion Models', 'desc': 'The paper studies how training acceleration methods affect diffusion transformers. It finds that these methods reorganize AdaLN-Zero residual gates, which control how conditioned updates enter the residual stream, and that broader participation across gate channels is linked to better image generation quality. The authors measure this organization with normalized participation ratio (nPR) and introduce a teacher-free radial objective that encourages broader gate participation through feature-norm regularization. On ImageNet, the method improves FID over dispersive loss, suggesting that residual-gate organization is an important part of training acceleration.'}, 'zh': {'title': '拓宽残差门控参与，让扩散模型训练更快、生成更好', 'desc': '这篇论文研究扩散 Transformer 的训练加速机制，发现 AdaLN-Zero 中控制条件信息进入残差流的门控参数 α 会发生明显重组。加速模型对 α 的扰动更敏感，而且门控结构能反映类别之间的语义关系。作者提出归一化参与率（nPR）来衡量门控在不同通道上的分布，并发现门控参与范围越广，生成质量往往越好。基于此，作者设计了无需教师模型的径向目标，通过特征范数正则化扩大门控参与范围，并在 ImageNet 实验中取得优于 dispersive loss 的 FID。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (12)', '#agi (5)', '#alignment (3)', '#architecture (10)', '#audio (2)', '#benchmark (15)', '#cv (8)', '#data (3)', '#dataset (5)', '#diffusion (5)', '#ethics', '#games (5)', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (4)', '#interpretability (4)', '#leakage (1)', '#long_context', '#low_resource', '#machine_translation', '#math (2)', '#multilingual', '#multimodal (6)', '#open_source (3)', '#optimization (13)', '#plp (1)', '#rag (1)', '#reasoning (6)', '#rl (5)', '#rlhf (1)', '#robotics (6)', '#science (1)', '#security (1)', '#small_models (5)', '#story_generation', '#survey (1)', '#synthetic (2)', '#training (18)', '#transfer_learning', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-02 12:00',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-02 12:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-02 12:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
