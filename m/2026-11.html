incorporates two key designs. Tide-Style-Tuning alternates LoRA and full-parameter fine-tuning to balance computational efficiency, generalization, and hard-sample fitting while mitigating catastrophic forgetting. Entropy-based Test Adaptation determines the optimal prediction modality by analyzing prediction entropy. Venus-DefakerOne2 achieves new state-of-the-art performance across a comprehensive suite of benchmarks, including DeepFake faces (96.7%), AI-generated images (93.3%), tampered documents (87.6%), manipulated natural images (89.6%), physical spoofs (93.1%), and AI-generated videos (96.0%). It significantly outperforms both specialized expert models and its predecessor, DefakerOne, establishing itself as a powerful and versatile foundation model for binary-decision forensic tasks.', 'score': 11, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'd9c26cdf88ea5276', 'authors': ['Chenfan Qu', 'Yachao Liang', 'Mingqi Fang', 'Jiangwei Xie', 'Zhenming Wang', 'Baoyue Zhang', 'Changjiang Jiang', 'Zheng Chang', 'Fanli Jin', 'Xuekang Zhu', 'Kaiwen Feng', 'Junchi Li', 'Weihong Zhang', 'Haoyue Wang', 'Chenfeng Zhang', 'Yinan Xia', 'Fangming Cui', 'Dong Fan', 'Jingjing Liu', 'Tianyi Zhang', 'Luobin Chen', 'Ji-Zhe Zhou', 'Sheng Li', 'Wei Wang', 'Bin Li', 'Ran He', 'Xinpeng Zhang', 'Linna Zhou', 'Jian Liu', 'Weiqiang Wang'], 'affiliations': ['Ant Group', 'Technical Committee on Digital Media Forensics and Security, CSIG'], 'pdf_title_img': 'assets/pdf/title_img/2610.37918.jpg', 'data': {'categories': ['#security', '#training', '#benchmark', '#video', '#cv'], 'emoji': '🛡️', 'ru': {'title': 'Одна модель, чтобы распознать любую подделку', 'desc': 'Статья представляет Venus-DefakerOne2 — унифицированную foundation model для обнаружения подделок, которая охватывает DeepFake-лица, сгенерированные AI изображения и видео, подделанные документы, физические спуфинги и манипуляции с изображениями. Модель обучена на десятках миллионов образцов и использует чередование LoRA и full-parameter fine-tuning (Tide-Style-Tuning), что balances вычислительную эффективность, обобщающую способность и сохранение знаний при catastrophic forgetting. Дополнительно применяется Entropy-based Test Adaptation, которая выбирает оптимальную модальность предсказания по энтропии выходов модели. Venus-DefakerOne2 достигает state-of-the-art результатов на широком наборе бенчмарков и превосходит как специализированные expert-модели, так и предшественника DefakerOne.'}, 'en': {'title': 'One Forensic Model to Detect Forgery Across Media', 'desc': 'Venus-DefakerOne2 is a unified anti-forgery foundation model that detects digital and physical forgeries across images and videos. It is trained on tens of millions of samples and uses Tide-Style-Tuning, which alternates LoRA with full-parameter fine-tuning to balance efficiency, generalization, and adaptation to difficult examples while reducing catastrophic forgetting. At test time, entropy-based adaptation selects the prediction modality based on the model’s prediction entropy. The model achieves state-of-the-art results across benchmarks for deepfakes, AI-generated media, document tampering, image manipulation, and physical spoofs.'}, 'zh': {'title': '跨越图像与视频，统一识别多种伪造', 'desc': 'Venus-DefakerOne2 是一个统一的反伪造基础模型，可检测图像和视频中的多种数字篡改与实体伪造。它使用交替进行 LoRA 微调和全参数微调的方法，在控制计算成本的同时提升泛化能力、拟合难例，并缓解灾难性遗忘。模型还通过分析预测熵进行测试时自适应，以选择合适的预测方式。在多个基准测试中，它取得了先进表现，覆盖深度伪造人脸、AI 生成内容、篡改文档和实体伪造等任务。'}}}, {'id': 'https://huggingface.co/papers/2610.42053', 'title': 'REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control', 'url': 'https://huggingface.co/papers/2610.42053', 'abstract': "Abstract REA unifies deliberative and reactive policies in a single runtime with asynchronous coordination, achieving high success rates with reduced control overhead across simulated and real robot tasks.  Generated by thinkingmachines/Inkling-Small Foundation models are becoming remarkably reliable at high-level reasoning, yet they remain too slow and costly to serve as fine-grained controllers. Conversely, fast policies like VLAs and whole-body controllers offer more efficient reflexes, but struggle to generalize. While pairing a deliberative brain (foundation models) with a reactive cerebellum (fast policies) seems natural for embodied systems, two obstacles remain: methods are built and scored on incompatible stacks, and their asynchronous coordination is difficult. For example, an agent that calls the VLA in the agentic loop can stall the fast execution, while a VLA that calls the agent on errors tends to re-trigger fallbacks repeatedly or completely miss silent failures. To address this, we propose REA (Routed Embodied Agent), a unified runtime where a deliberative System 2, an embodied router System 1 and reactive System 0 policies cooperate under a single golden rule - no running policy waits on the brain. Instead of querying the brain at each failure, REA employs a route memory that stores each policy's measured success ahead of time, a boundary-triggered judge gate that consults the brain on policy execution, and a shared-budget escalation ladder for bounded recovery. Evaluated on 3,000 test episodes across 60 LIBERO-Pro tasks, REA reaches 95.9% success and beats the best single-agent baseline in its own policy pool (94.7%) while reducing control steps by 25% and control time by 17%. In a separate 100-episode RoboTwin 2.0 study, REA achieves 84% success with VLA policies and 86% with VLA+code, compared with 80% for the strongest single VLA baseline MEDex. These results demonstrate learned and programmatic policies operating within the same runtime. REA also transfers to BEHAVIOR-1K and a real Unitree G1 humanoid, achieving the highest observed success among the compared methods.", 'score': 11, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '6d31a3d15945b163', 'authors': ['Pengfei Zhou', 'Yixing Ma', 'Zhengfeiyang Zhang', 'Haoyuan Chen', 'Zhenglin Wan', 'Hexin Wang', 'Wangbo Zhao', 'Yang You'], 'affiliations': ['Hong Kong University of Science and Technology', 'National University of Singapore', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences', 'The University of Tokyo', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.42053.jpg', 'data': {'categories': ['#rl', '#games', '#agents', '#benchmark', '#robotics', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Быстрые рефлексы и медленный разум работают вместе, не мешая друг другу', 'desc': 'В статье представлен REA (Routed Embodied Agent) — единая среда выполнения, где медленная LLM-модель System 2 отвечает за высокоуровневое рассуждение, router System 1 выбирает подходящую политику, а быстрые reactive-политики System 0 (VLA и контроллеры всего тела) выполняют действия. Ключевое правило: ни одна работающая политика не ждёт ответа «мозга», а координация выполняется асинхронно через route memory и judge gate с общим бюджетом эскалации. Метод протестирован на LIBERO-Pro, RoboTwin 2.0, BEHAVIOR-1K и humanoid-роботе Unitree G1, где он повышает успешность и сокращает число шагов управления на 25%. Результаты показывают, что обучаемые и программные политики могут работать в одном runtime.'}, 'en': {'title': 'Let the robot think deeply without slowing its reflexes', 'desc': 'REA combines slow foundation-model reasoning with fast reactive policies in one robot-control runtime. Its router uses stored policy success rates, checks for problems at execution boundaries, and escalates recovery within a shared budget, so running policies do not have to wait for the reasoning model. Across simulated tasks, REA achieved high success while reducing control steps and time compared with a strong single-agent baseline, and it also performed well on a real humanoid robot. The results show that learned and programmatic policies can work together in a unified system.'}, 'zh': {'title': '让深度推理与快速反应协同，机器人成功更高、控制更省', 'desc': 'REA提出一种统一的机器人运行框架，让擅长推理的基础模型、负责选择策略的路由器和快速反应策略协同工作。它采用策略成功率记忆、边界触发的判断门，以及共享预算的逐级恢复机制，并确保正在运行的策略不会等待基础模型。实验显示，REA在LIBERO-Pro和RoboTwin 2.0等任务中取得较高成功率，同时减少控制步骤和控制时间，也能迁移到其他模拟环境及真实人形机器人。结果表明，学习得到的策略与程序化策略可以在同一运行框架中有效配合。'}}}, {'id': 'https://huggingface.co/papers/2610.39086', 'title': 'HALO: Human-Grounded Granular Evaluation of Proactive Agents', 'url': 'https://huggingface.co/papers/2610.39086', 'abstract': 'Abstract HALO introduces a human-annotated benchmark and dataset to evaluate proactive agents, revealing that over-proactivity is the dominant failure mode.  Generated by thinkingmachines/Inkling-Small Proactive agents must decide whether, when, and how far to assist without an explicit request. Existing evaluations often rely on automated scores or binary verdicts, offering limited human diagnosis of evidence use and intervention quality. To address these gaps, we introduce HALO, Human-Grounded GrAnular EvaLuation of PrOactive Agents. HALO-Arena covers 4 proactive need types, Dependency, Blockage, Risk, and Opportunity, across 10 everyday domains and 50 personal environments. Scenarios require agents to retrieve evidence from structured databases or unstructured documents before judging whether assistance is warranted and choosing its scope. On HALO-Arena, we construct HALO-8K, a dataset of 8,000 responses from 10 models across 400 scenarios, annotated by 20 experts for action level, acceptability verdicts, and human diagnosis. For rejected responses, human diagnosis covers timing, intensity, and other issues. Recorded reasoning tokens and retrieval rounds measure the effort behind these responses. The best proprietary and open-source models achieve 72.88% and 56.63% acceptability, respectively. Our central finding is that over-proactivity is the dominant observed failure mode, with Premature timing or Excessive intensity accounting for 61.20% of rejected responses. Further analyses yield complementary findings on the balance between intervention and restraint, evidence acquisition, and the calibration of timing and intensity.', 'score': 6, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '9874569afd3bc482', 'authors': ['Wenqi Pei', 'Xinyu Wang', 'Jinrui Liu', 'Cynthia Zhuge', 'Jie Sheng', 'Zihan Wang', 'Tenghao Huang', 'Muhao Chen'], 'affiliations': ['22077AI', 'University of California, Davis', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2610.39086.jpg', 'data': {'categories': ['#interpretability', '#survey', '#alignment', '#dataset', '#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Агенты чаще мешают, чем помогают: главная беда — чрезмерная проактивность', 'desc': 'Статья представляет HALO — бенчмарк и датасет для оценки проактивных AI-агентов, которые решают, помогать ли пользователю без явного запроса. Авторы собрали HALO-Arena с 400 сценариями в 4 типах потребностей и 10 доменах и разметили 8 000 ответов 10 LLM экспертами по уровню действия, приемлемости и диагнозу ошибок. Лучшие модели показывают 72.88% приемлемости у проприетарных и 56.63% у открытых моделей. Главный вывод: доминирующая ошибка — чрезмерная проактивность (преждевременное вмешательство или избыточная интенсивность), которая составляет 61.20% отклонённых ответов.'}, 'en': {'title': 'Proactive agents must know when to step in—and when to hold back', 'desc': 'HALO introduces a human-annotated benchmark for evaluating proactive agents, which decide whether and how to help without an explicit request. Its HALO-Arena benchmark tests agents on four types of needs across everyday scenarios that require retrieving evidence from databases or documents. HALO-8K contains 8,000 model responses, labeled by experts for action level, acceptability, and issues such as timing and intensity. The results show that over-proactivity is the most common failure: premature or overly intense interventions account for 61.20% of rejected responses.'}, 'zh': {'title': '主动帮助要有度：该出手时出手，也要懂得克制', 'desc': 'HALO提出了一个由人工标注的基准和数据集，用来评估主动型智能体在没有明确请求时是否能适时提供帮助。HALO-Arena涵盖4类需求、10个日常领域和50种个人环境，要求智能体先从数据库或文档中检索证据，再决定是否介入以及介入到什么程度。研究人员构建了包含8,000条模型回答的HALO-8K，并由专家标注行动等级、可接受性和错误原因，以更细致地分析智能体的表现。结果显示，过度主动是最常见的失败模式；被拒绝的回答中，61.20%存在介入过早或干预过度的问题。'}}}, {'id': 'https://huggingface.co/papers/2610.40945', 'title': 'On the Origin and Evolution of Training-Inference Mismatch in LLM Reinforcement Learning', 'url': 'https://huggingface.co/papers/2610.40945', 'abstract': "Abstract On-policy reinforcement learning for large language models suffers from training-inference mismatch due to numerical discrepancies and policy lag, and a derived discrepancy-lag correction stabilizes training by centering errors, clipping importance ratios, and resynchronizing sampling.  Generated by thinkingmachines/Inkling-Small On-policy reinforcement learning for large language models assumes that training responses are sampled from the current policy. In practice, an inference engine samples the responses and a separate trainer computes the gradients, and the training-inference mismatch between the two makes the training data off-policy. The mismatch has two sources, the numerics of the engine and the stale weights of asynchronous sampling, and a correction that stabilizes training under one source can fail under the other. We ask which property of a mismatch source decides the correction it needs. Evaluating the trainer at the sampler's weights splits each sampled-token error exactly into a numerical discrepancy of the engine and a policy lag of the trainer, and we follow both through training. The numerical discrepancy stays approximately constant, so it biases the updates by a nearly fixed amount, and centering the score at each prefix removes its leading bias. The policy lag is produced by the trainer's own updates: the bias it leaves enters the next update, which enlarges the next lag and closes a feedback loop. Importance weighting cuts this loop only while the lag ratio stays concentrated, and on Qwen3-1.7B it fails at the step where the effective sample size of the ratio falls below one half. From this account we derive the discrepancy-lag correction (DLC), which centers the numerical discrepancy, clips the lag ratio against the sampler's weights and resynchronizes the sampler when this effective sample size falls below one half. Under a stale sampler, DLC keeps the KL divergence from on-policy training within twice the KL between two independent on-policy trainings on Qwen3-0.6B and Qwen3-1.7B, and its resynchronization prevents collapses that the per-token corrections leave and that a KL measured on the sampler's prefixes does not detect.", 'score': 5, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'b22f7e6935a818ad', 'pdf_title_img': 'assets/pdf/title_img/2610.40945.jpg', 'data': {'categories': ['#rl', '#alignment', '#training', '#small_models', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Синхронизируй сэмплер — и обучение LLM снова станет стабильным', 'desc': 'Статья рассматривает проблему рассогласования между сэмплером (inference engine) и тренером в on-policy обучении с подкреплением для LLM: численные расхождения движка и устаревание весов при асинхронной генерации (policy lag) делают данные off-policy. Авторы показывают, что численная ошибка почти постоянна и смещает обновления, и её можно убрать центрированием score на каждом префиксе, тогда как policy lag образует обратную связь, которую importance weighting сдерживает лишь пока отношение весов остаётся сконцентрированным. На основе этого предложен метод DLC (discrepancy-lag correction): центрирование численной ошибки, клиппинг отношения importance weights и ресинхронизация сэмплера, когда effective sample size падает ниже одной второй. Эксперименты на Qwen3-0.6B и Qwen3-1.7B показывают, что DLC удерживает KL-дивергенцию в пределах удвоенного KL между двумя независимыми on-policy запусками и предотвращает коллапс обучения.'}, 'en': {'title': 'Correct steady errors, control policy lag, and keep training on track', 'desc': 'The paper studies why on-policy reinforcement learning for large language models becomes off-policy when an inference engine generates responses and a separate trainer updates the model. It separates the mismatch into numerical discrepancy, which causes a relatively steady bias, and policy lag, which grows through feedback between updates. The proposed discrepancy-lag correction (DLC) centers numerical errors, clips importance ratios to limit policy lag, and resynchronizes sampling when the effective sample size becomes too low. Experiments on Qwen3 models show that DLC keeps training closer to on-policy behavior and prevents collapses missed by some other corrections.'}, 'zh': {'title': '拆解误差与滞后，让大模型强化学习更稳定', 'desc': '这篇论文研究大语言模型进行在策略强化学习时，推理引擎与训练器之间的差异如何导致训练数据变成离策略数据。作者将这种差异分为推理引擎数值误差和训练器权重滞后，并发现前者造成近似固定的偏差，后者则会形成不断加剧的反馈循环。为此，论文提出差异—滞后校正（DLC）：按前缀中心化数值误差、裁剪滞后策略的重要性比率，并在有效样本量低于阈值时重新同步采样器。在 Qwen3 实验中，DLC 能更稳定地贴近在策略训练，并避免其他逐 token 校正可能遗漏的训练崩溃。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.42141', 'title': 'RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory', 'url': 'https://huggingface.co/papers/2610.42141', 'abstract': "Abstract RoboArchitect automates robot harness design by iteratively revising control code around a frozen policy, substantially improving success on unseen scenes and tasks without model updates.  Generated by thinkingmachines/Inkling-Small Recent work shows that a frozen robot policy performs far better inside an agent harness, where control code decides when to query the policy, consult vision tools, or command the arm directly. Yet today these harnesses are built by hand and redesigned for each new robot or benchmark. We show that harness design can be automated, offering a strong alternative to finetuning on a novel setup. In RoboArchitect, a coding model observes a robot's rollouts, diagnoses failures, and iteratively revises the harness around the frozen policy. The harness evolves on a set of episodes for its optimization and is evaluated on held-out scenes and tasks. Without updating any model weights, RoboArchitect raises average success from 9.7% to 43.3% on unseen scenes (4.5x) and from 12.7% to 40.2% on unseen tasks (3.2x), across multiple benchmarks and policies. The gains are largest where the benchmark is far from the policy's training data: wrapping a general-purpose policy, the evolved harness yields a specialist that often outperforms even the finetuned version. Intuitive control strategies are automatically designed, such as lifting a jammed arm clear or reaching in horizontally when an obstacle blocks the way from above. The harness also evolves its own persistent memory, carrying learned experience, such as effective grasp depths, into later decisions. These results suggest that substantial headroom in robotic manipulation lies in the agent harness, and its design can be effectively automated and optimized without weight updates.", 'score': 5, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '0d6c75180f722c58', 'authors': ['Shengguang Wu', 'Suning Huang', 'Cherie Ho', 'Ria Doshi', 'Hao Zhu', 'Serena Yeung-Levy'], 'affiliations': ['Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.42141.jpg', 'data': {'categories': ['#training', '#agents', '#robotics', '#agi', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Умная обвязка важнее дообучения: робот учится без смены весов', 'desc': 'В статье представлен RoboArchitect — метод автоматического проектирования агентной обвязки (harness) вокруг замороженной робото-политики. LLM-модель анализирует траектории робота, диагностирует ошибки и итеративно переписывает управляющий код, который решает, когда опрашивать политику, использовать компьютерное зрение или напрямую управлять манипулятором. Без обновления весов модели успешность выполнения задач выросла с 9,7% до 43,3% на новых сценах и с 12,7% до 40,2% на новых задачах, причём harness дополнительно формирует собственную persistent memory. Результаты показывают, что значительный потенциал улучшения робототехники лежит в дизайне harness, а не только в дообучении (finetuning).'}, 'en': {'title': 'Better Robot Skills Without Updating the Model', 'desc': 'RoboArchitect improves a frozen robot policy by automatically revising the control code, or harness, that decides how the robot acts. A coding model examines robot rollouts, identifies failures, and updates the harness without changing the policy’s model weights. Across benchmarks, this approach raises success on unseen scenes from 9.7% to 43.3% and on unseen tasks from 12.7% to 40.2%. The harness can also develop useful control strategies and preserve experience in memory, suggesting that harness optimization is a strong alternative to finetuning.'}, 'zh': {'title': '不改模型权重，也能让机器人越做越好', 'desc': 'RoboArchitect 自动优化机器人智能体的控制框架（harness），而不是更新冻结策略的模型权重。一个编程模型观察机器人执行任务的过程，诊断失败，并反复修改控制代码，包括何时调用策略、使用视觉工具或直接控制机械臂。实验显示，这种方法显著提升了机器人在未见场景和任务中的成功率，有时甚至超过微调后的策略。框架还会形成持久记忆，保存有效的抓取深度等经验，供后续决策使用。'}}}, {'id': 'https://huggingface.co/papers/2610.16927', 'title': 'WeFair: Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in Short-Video Search', 'url': 'https://huggingface.co/papers/2610.16927', 'abstract': "Abstract WeFair improves personalized query rewriting via fidelity-aware human feedback stages—demonstration, preference, and verification—to reduce intent drift and boost search effectiveness in short-video platforms.  Generated by thinkingmachines/Inkling-Small Short-video search needs compact query rewriters that recover users' personalized intent from ambiguous queries under strict latency constraints. Existing LLM-based methods have improved rewriting by using synthetic reasoning and subsequent consumption-behavioral feedback. However, overemphasizing subsequent consumption can favor engaging content over the user's immediate need, causing intent drift even when rewritten queries are grounded in behavioral history. We propose WeFair, Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in WeChat short-video search. WeFair uses human feedback according to how directly it reflects personalized intent, assigning feedback fidelity to a progression from demonstration to preference to verification. We first mine actual queries and user reformulations from search sessions, and then screen them for contextual support. In the demonstration stage, a supervised fine-tuning curriculum progresses from large-scale context-to-query learning to reasoning and direct prediction on human reformulation and preservation. In the preference stage, direct preference optimization learns relative preferences from subsequent consumption feedback. In the verification stage, group relative policy optimization rewards exact agreement with reformulation or preservation targets to constrain intent drift. Further analysis shows that broad supervision benefits the full curriculum supervised training, while strict verification achieves better performance than auxiliary rewards. In offline experiments, WeFair-2B outperforms strong rewriting baselines in overall accuracy and intent preservation. An online A/B test shows relative increases of 2.593% in effective video-view rate and a 2.350% relative reduction in query reformulation rate. WeFair-2B has been deployed in the WeChat short-video search system, which serves over 100 million queries per day.", 'score': 5, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '60a8216a51996b23', 'authors': ['Yingtao Ren', 'Aolin Li', 'Cheng Cheng', 'Huiyun Hu', 'Huasheng Liang', 'Baoxing Xie', 'Jun Yuan', 'Haijun Wu', 'Yiwei Fu', 'Chenxing Wang'], 'affiliations': ['East China Normal University', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.16927.jpg', 'data': {'categories': ['#alignment', '#training', '#small_models', '#rlhf', '#data'], 'emoji': '🎯', 'ru': {'title': 'Ищем то, что нужно пользователю, а не то, что он будет смотреть', 'desc': 'В статье предлагается WeFair, метод персонализированного переписывания поисковых запросов для коротких видео в WeChat, который использует human feedback с учётом степени точности его отражения намерения пользователя. Обучение проходит в три этапа: supervised fine-tuning на демонстрациях человеческих переформулировок, direct preference optimization по предпочтениям на основе последующего потребления контента и group relative policy optimization с наградой за точное совпадение с целевой переформулировкой. Такой подход снижает intent drift, когда модель выбирает вовлекающий контент вместо реальной потребности пользователя. Офлайн-эксперименты показывают превосходство компактной модели WeFair-2B над сильными базовыми LLM-методами, а онлайн A/B-тест даёт рост effective video-view rate на 2.593% и снижение query reformulation rate на 2.350%.'}, 'en': {'title': 'Rewrite for the User’s Intent, Not Just Their Next Click', 'desc': 'WeFair is a personalized query rewriting system for short-video search that aims to capture what a user means without changing their intent. It aligns models through three stages of human feedback: demonstrations teach query rewriting, preferences reflect feedback from users’ later behavior, and verification checks that rewrites match human reformulations or preserve the original intent. The approach combines supervised fine-tuning, direct preference optimization, and group relative policy optimization, with strict verification helping to limit intent drift. In experiments, WeFair-2B improved accuracy and intent preservation, and an online test increased effective video views by 2.593% while reducing query reformulations by 2.350%.'}, 'zh': {'title': '以意图忠实度为核心，让查询改写更懂用户', 'desc': '这篇论文提出 WeFair，用于短视频搜索中的个性化查询改写，目标是在低延迟条件下准确理解含糊查询，同时避免改写偏离用户当下意图。它按反馈与个性化意图的贴合程度，依次采用示范、偏好和验证三个阶段：先用人工改写数据进行监督微调，再通过直接偏好优化学习用户反馈中的相对偏好，最后用组相对策略优化强化对目标改写的精确匹配。实验表明，严格验证有助于减少意图漂移，WeFair-2B 在离线准确率和意图保留方面优于强基线。线上测试中，有效视频观看率相对提升 2.593%，查询改写率相对降低 2.350%，该系统已部署于微信短视频搜索。'}}}, {'id': 'https://huggingface.co/papers/2610.34926', 'title': 'Supervising the Visible State: Separating Representation from View Selection in Streaming Video', 'url': 'https://huggingface.co/papers/2610.34926', 'abstract': 'Abstract Visible-State Supervision and Test-Time Causal View Search improve streaming action recognition by separating representation learning from evidence selection, boosting accuracy with fewer frames.  Generated by thinkingmachines/Inkling-Small An action seen once and the same action seen three times receive the same action-recognition label, so that supervision does not require a model to count. Answers shared across histories that differ in event order, accumulation, or relations leave those distinctions unconstrained; we call this state under-specification. Visible-State Supervision (ViSS) addresses it by training on source-grounded probes of event identity, order, accumulation, relation change, and answer sufficiency; under the same recent-frame interface it improves OVO-Bench over a strict-matched generic temporal supervision baseline while remaining comparable on StreamingBench, with the largest gain in hallucination detection. Test-Time Causal View Search (TVS) then adapts evidence access while keeping the learned model fixed, expanding from recent frames to sparse event and compact history views on demand. The two interventions separate representation from view selection: supervision particularly benefits hallucination detection and causal reasoning, access particularly benefits event recall and forward reasoning. Together they reach the best reported accuracy among the published systems compared here on StreamingBench and OVO-Bench at a fraction of the processed frames of exhaustive selection, and strict replay shows that most of the remaining gap to a three-view oracle is a correct answer that was later replaced. Streaming accuracy depends on what supervision asks the model to keep, what evidence inference exposes, and whether the model keeps a correct answer once it has one.', 'score': 4, 'issue_id': 3490, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': '3b50436d38d34378', 'authors': ['Yihao Hu', 'Pan Wang', 'Yitong Lin', 'Zhihao Wen', 'Deyuan Liu', 'Hang Wang', 'Mingda Wan', 'Yiwen Zhao', 'Yutong Li', 'Yuchen Mao', 'Tao Lin'], 'affiliations': ['ECNU', 'FDU', 'SJTU', 'SMU', 'USTC', 'Westlake University', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2610.34926.jpg', 'data': {'categories': ['#training', '#reasoning', '#benchmark', '#video', '#hallucinations', '#long_context'], 'emoji': '🎬', 'ru': {'title': 'Учить модель помнить важное и смотреть на нужные кадры', 'desc': 'Статья показывает, что в стриминговом распознавании действий модели часто не различают порядок событий, их количество и связи между ними, что названо under-specification. Авторы предлагают Visible-State Supervision (ViSS): обучение на probe-вопросах о событиях, порядке, накоплении и достаточности ответа, что особенно помогает в детекции галлюцинаций. Затем Test-Time Causal View Search (TVS) при фиксированной модели адаптивно расширяет доступ к данным от последних кадров к разреженным событийным и сжатым историческим представлениям, что улучшает recall событий и forward reasoning. Вместе эти методы разделяют обучение представлений и выбор видов, достигая лучших результатов на StreamingBench и OVO-Bench при значительно меньшем числе обработанных кадров.'}, 'en': {'title': 'Teach the model what matters, then show it the right frames', 'desc': 'The paper studies streaming action recognition, where a model must identify actions from video as it arrives. Visible-State Supervision (ViSS) trains the model to track event identity, order, accumulation, and relations, reducing cases where different histories look equivalent to the model. Test-Time Causal View Search (TVS) keeps the trained model fixed but selects additional evidence views, such as sparse events or a compact history, when needed. Together, ViSS and TVS improve benchmark accuracy while processing fewer frames than exhaustive view selection, and the study finds that models also need to avoid replacing a correct answer with a wrong one.'}, 'zh': {'title': '教模型看懂状态，按需寻找证据', 'desc': '这篇论文研究流式动作识别：模型逐步接收视频帧，需要边看边回答问题。可见状态监督（ViSS）通过训练模型识别事件、顺序、累积和关系变化，减少只给出相同答案却忽略不同事件历史造成的状态欠指定。测试时因果视图搜索（TVS）保持模型不变，按需从近期帧扩展到稀疏事件和精简历史视图，从而选择更合适的证据。两种方法互相补充，在基准测试中提升准确率并减少处理帧数；论文还发现，模型有时会用错误答案替换先前已经给出的正确答案。'}}}, {'id': 'https://huggingface.co/papers/2610.31222', 'title': 'GLOW-FM: Efficient Generative Low-Light Image Enhancement with One-Step Latent Flow Matching', 'url': 'https://huggingface.co/papers/2610.31222', 'abstract': 'Abstract GLOW-FM is a one-step latent flow-matching framework that enables efficient generative low-light image enhancement via single-function evaluation in a compact latent space.  Generated by thinkingmachines/Inkling-Small Low-light image enhancement (LLIE) aims to recover well-exposed and perceptually faithful images from severely degraded observations. Recent diffusion-based generative methods achieve strong perceptual quality by leveraging powerful image priors, but their iterative sampling incurs substantial computational cost, limiting practical deployment. Despite recent efficiency gains in generative LLIE, high-quality enhancement with a single function evaluation and low overall computation remains challenging, particularly under diverse real-world low-light conditions. We introduce GLOW-FM, a one-step latent flow-matching framework for efficient generative LLIE. GLOW-FM performs conditional transport in the latent space of a frozen Tiny-VAE and leverages Terminal Velocity Matching (TVM) to enable enhancement with a single function evaluation. Matched comparisons with alternative one-step objectives support TVM as an effective design choice, and, to the best of our knowledge, this is its first adaptation to image restoration and specifically to LLIE. Extensive experiments on challenging real-world benchmarks demonstrate that GLOW-FM achieves competitive image quality and state-of-the-art cross-dataset generalization while requiring only a single function evaluation and 34 GFLOPs for the small variant. These findings highlight the potential of GLOW-FM to bring generative LLIE closer to practical deployment through single-step inference and compact latent modeling. Code will be made publicly available upon publication.', 'score': 4, 'issue_id': 3489, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '039325a4024fb4b1', 'authors': ['Ariel Lapid', 'Yuval Haitman', 'Reuven Peretz', 'Arnon Netzer', 'Idit Diamant'], 'affiliations': ['Arm Ltd'], 'pdf_title_img': 'assets/pdf/title_img/2610.31222.jpg', 'data': {'categories': ['#inference', '#training', '#diffusion', '#optimization', '#cv', '#architecture'], 'emoji': '💡', 'ru': {'title': 'Один шаг вместо сотен: быстрое улучшение изображений при слабом свете', 'desc': 'GLOW-FM — это фреймворк на основе latent flow matching, который улучшает изображения при слабом освещении за один шаг. Модель выполняет условный перенос (conditional transport) в латентном пространстве замороженного Tiny-VAE, что делает обработку компактной. Для обучения используется Terminal Velocity Matching (TVM), который позволяет получать результат за одну function evaluation; это первая адаптация TVM для задач image restoration и LLIE. На сложных реальных бенчмарках метод показывает конкурентное качество, лучшую кросс-датасетную генерализацию и требует всего 34 GFLOPs для малого варианта, что приближает генеративный LLIE к практическому применению.'}, 'en': {'title': 'Brighten Low-Light Images in One Step', 'desc': 'GLOW-FM enhances low-light images using flow matching in the compact latent space of a frozen Tiny-VAE. It uses Terminal Velocity Matching to generate an enhanced image with a single function evaluation, avoiding the costly iterative sampling used by diffusion models. Experiments show competitive image quality and state-of-the-art generalization across datasets, with the small model requiring 34 GFLOPs. The results suggest that one-step latent generation can make generative low-light enhancement more practical.'}, 'zh': {'title': '一步推理，让暗光图像焕发清晰真实', 'desc': 'GLOW-FM 是一种用于低照度图像增强的一步式潜空间流匹配框架，目标是从严重退化的暗光图像中恢复自然、曝光良好的图像。它在冻结的 Tiny-VAE 潜空间中进行条件传输，并用终端速度匹配（TVM）实现单次函数评估即可完成增强。实验表明，TVM 是有效的一步式训练目标；在真实场景基准上，该方法取得有竞争力的图像质量和先进的跨数据集泛化能力。小型版本仅需一次函数评估和 34 GFLOPs，展现了生成式低照度增强走向实际部署的潜力。'}}}, {'id': 'https://huggingface.co/papers/2610.39276', 'title': 'MemSteer: Turning User Histories into Supervision for Agent Memory Optimization', 'url': 'https://huggingface.co/papers/2610.39276', 'abstract': "Abstract MemSteer generates evidence-grounded QA supervision from unlabeled user histories to optimize agent memory design without model updates, improving benchmark scores significantly.  Generated by thinkingmachines/Inkling-Small An effective agent memory system should adapt to a user's history and task requirements. Human-annotated supervision can guide this adaptation by providing feedback for evaluating and improving memory designs. Yet suitable labels are rarely available for new user histories, and manually constructing QA pairs and supporting evidence is costly. We introduce MemSteer, which turns unlabeled user histories into question-answer (QA) supervision with supporting evidence for memory-design optimization. MemSteer constructs an evidence-grounded answer plan that specifies how facts across related records jointly support a reference answer. The plan guides question generation, while source-grounded auditing and blind answer recovery check the resulting annotations. To study the utility of this supervision, we develop MemSteer-Opt, which combines QA-based design evaluation with evidence-guided failure diagnosis to revise memory store, retrieval, and context construction without updating model parameters. Experiments on ATM-Bench and RHELM show that this supervision is competitive with official-QA-guided optimization. Relative to Base-BM25, MemSteer-Opt improves ATM-Bench Question Score by 13.4 points and RHELM accuracy by 4.1 and 6.6 points without and with external data, respectively. The supervision also benefits two existing optimizers on ATM-Bench, while new-user experiments demonstrate continued design optimization using supervision generated from the target histories.", 'score': 3, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '6427a1b96e3abcce', 'authors': ['Jie Huang', 'Cuiling Lan', 'Qize Yu', 'Xiulian Peng', 'Yan Lu'], 'affiliations': ['Microsoft Research Asia', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.39276.jpg', 'data': {'categories': ['#reasoning', '#training', '#synthetic', '#agents', '#rag', '#benchmark', '#data'], 'emoji': '🧠', 'ru': {'title': 'Память агента учится на собственной истории без разметки', 'desc': 'В статье представлен MemSteer, метод, который генерирует вопросно-ответные (QA) данные с опорой на доказательства из неразмеченных истории пользователей. Система строит план ответа, связывающий факты из разных записей, а затем проверяет аннотации через аудит по источникам и слепое восстановление ответа. Далее MemSteer-Opt использует эти QA-данные и диагностику ошибок для улучшения хранилища памяти, механизма поиска и построения контекста агента без обновления параметров LLM. Эксперименты на ATM-Bench и RHELM показывают значительный прирост качества относительно базового BM25.'}, 'en': {'title': 'Turn user histories into evidence that steers better agent memory', 'desc': 'MemSteer creates question-and-answer training examples from unlabeled user histories, along with evidence showing which records support each answer. It uses an evidence-based answer plan to guide question writing, then checks the examples through source audits and attempts to recover answers without seeing the questions. MemSteer-Opt uses this supervision to evaluate and improve how an agent stores, retrieves, and assembles memories, without changing the model’s parameters. Experiments on ATM-Bench and RHELM show improved performance over a BM25 baseline, and the generated supervision can also help other memory optimizers.'}, 'zh': {'title': '从用户历史生成证据监督，让智能体记忆无需更新模型也能持续优化', 'desc': 'MemSteer 从未标注的用户历史中生成带有证据支持的问答监督数据，用来优化智能体的记忆设计。它先制定证据答案计划，说明多条相关记录如何共同支持答案，再据此生成问题，并通过来源核查和盲答恢复检查标注质量。MemSteer-Opt 利用这些问答评估记忆设计、诊断失败原因，并调整记忆存储、检索和上下文构建，而无需更新模型参数。在 ATM-Bench 和 RHELM 上，该方法取得了有竞争力的结果，并显著优于 Base-BM25；新用户实验也表明，它能利用目标用户历史持续优化记忆设计。'}}}, {'id': 'https://huggingface.co/papers/2610.42096', 'title': 'CausalWAM: Learning the Causes of Actions in World Action Models', 'url': 'https://huggingface.co/papers/2610.42096', 'abstract': 'Abstract Causal World Action Models enforce sparse routing to isolate action-relevant latent variables, ensuring identifiable causal structure without requiring temporal independence assumptions.  Generated by thinkingmachines/Inkling-Small World action models (WAMs) learn latent variables from observations and use these to both predict the evolution of the scene and to generate actions. The prediction has to be of the whole scene, whereas only a portion of the scene causes actions. WAMs fitted to demonstrations do not, in general, guarantee that they will generate actions solely from the latent causes of the demonstrated actions (the action-relevant latent variables), as the model could just as well learn to imitate in this way whilst entangling the action-relevant latent variables with the nuisance variables. We therefore separate out what causes action from what prediction depends on. We prove that under a sparsity constraint the latent variables used to generate actions are an invertible function of the action-relevant latent variables alone and the true structure is identified up to a permutation of the latent variables. This requires neither sufficient temporal dependence nor any assumptions on how the unobserved regimes evolve and holds even when the action-relevant latent variables are statistically dependent on the rest. We therefore propose CWAM (Causal WAM), which incorporates the constraint into a pretrained WAM by adding a sparse routing path to its action head, with the world modeling objective remaining unchanged. Experiments on both synthetic data and real-world robots validate the theory as well as showcase the improved efficiency in closed-loop success.', 'score': 3, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'b97cfd7954c231d0', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#interpretability', '#training', '#robotics', '#optimization', '#math', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Действия только из истинных причин: causal-структура для роботов', 'desc': 'В статье предлагается Causal WAM (CWAM) — модель мира для действий, которая разделяет латентные переменные, влияющие на действия, и те, от которых зависит предсказание сцены. Авторы вводят ограничение разреженности (sparsity), которое направляет генерацию действий только через action-relevant латентные переменные. Доказано, что при таком ограничении истинная causal структура идентифицируема с точностью до перестановки переменных, без требований о временной зависимости. Эксперименты на синтетических данных и реальных роботах подтверждают теорию и показывают повышение эффективности closed-loop успешности.'}, 'en': {'title': 'Route Actions Through Their True Causes', 'desc': 'World action models learn latent variables to predict how a scene changes and to choose actions. However, a model trained from demonstrations may mix variables that cause actions with irrelevant details, making its actions depend on nuisance variables. Causal WAM adds sparse routing to the action-generation path, so the action inputs identify the action-relevant latent variables up to a permutation, without requiring temporal independence. Tests on synthetic data and real robots support the theory and show improved efficiency in closed-loop task success.'}, 'zh': {'title': '让动作只听从真正相关的潜在因素', 'desc': '世界动作模型（WAM）从观测中学习潜在变量，用来预测场景变化并生成动作，但普通模型可能把动作相关因素与无关因素混在一起。论文提出因果世界动作模型（CWAM），在动作生成部分加入稀疏路由，使模型只使用与动作有关的潜在变量。理论证明，在稀疏约束下，动作所用的潜在变量可唯一确定到变量排列，且不需要假设潜在变量在时间上相互独立。合成数据和真实机器人实验表明，CWAM符合理论预期，并能提高闭环任务的成功效率。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.40256', 'title': 'When Requirements Interact: Scaling Long-Horizon Coding via Interdependent Specifications', 'url': 'https://huggingface.co/papers/2610.40256', 'abstract': 'Abstract CodeSpecWeave synthesizes complex, interdependent software development tasks with verified tests to train coding agents, improving performance on long-horizon benchmarks.  Generated by thinkingmachines/Inkling-Small To succeed in real-world long-horizon software development, coding agents must satisfy multi-dimensional task specifications, such as interface compatibility and error handling, and do so without breaking existing dependencies. However, current works lack specification in both quantity and diversity, often emphasizing primary goals while ignoring complex constraints. Synthesizing tasks to bridge this gap presents two challenges: naively adding specifications risks reducing tasks to trivial checklists rather than compelling joint reasoning, and verifying these subtle interactions risks overlooking hidden flaws or rejecting valid alternatives. To address these challenges, we introduce CodeSpecWeave, a framework for synthesizing tasks with rich, interdependent specifications. Grounded in real developer seeds, a synthesis agent iteratively develops both coupled task requirements and executable tests, while a review agent audits solution trajectories from multiple models to guarantee test reliability. Using this pipeline, we construct 4,670 training tasks across 2,865 repositories. Applying Reinforcement learning on these tasks significantly improves performance over the base model on DeepSWE-v1.1, largely outperforming existing baselines. Furthermore, we curate CodeSpecWeave-Bench, a rigorous benchmark comprising 100 tasks and 1,044 specifications, which clearly separates frontier models and reveals significant headroom in handling interdependent engineering constraints.', 'score': 1, 'issue_id': 3490, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '2dfadc1ada47ba97', 'authors': ['Yishuo Cai', 'Minzheng Wang', 'Liang Zhao', 'Linghao Zhang', 'Lei Li', 'Shicheng Li', 'Xu Sun', 'Fuli Luo'], 'affiliations': ['LLM Core, Xiaomi', 'Peking University', 'University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.40256.jpg', 'data': {'categories': ['#rl', '#plp', '#data', '#training', '#reasoning', '#optimization', '#benchmark', '#dataset', '#synthetic', '#agents'], 'emoji': '🧩', 'ru': {'title': 'Учим AI-агентов писать код, который не ломает всё вокруг', 'desc': 'Статья представляет CodeSpecWeave — фреймворк для автоматического синтеза задач разработки ПО с взаимозависимыми спецификациями и исполняемыми тестами, основанными на реальных seed-задачах разработчиков. Synthesis agent итеративно создаёт связанные требования и тесты, а review agent проверяет траектории решений нескольких моделей, гарантируя надёжность тестов. На основе этого пайплайна собрано 4 670 обучающих задач из 2 865 репозиториев, и обучение с помощью Reinforcement Learning заметно улучшает базовую LLM на DeepSWE-v1.1. Также авторы выпускают бенчмарк CodeSpecWeave-Bench из 100 задач и 1 044 спецификаций, который выявляет слабые места современных моделей в работе со сложными инженерными ограничениями.'}, 'en': {'title': 'Weave Real-World Constraints Into Better Coding Agents', 'desc': 'CodeSpecWeave creates software engineering tasks with many connected requirements, such as preserving interfaces and handling errors without breaking dependencies. A synthesis agent builds tasks and executable tests from real developer examples, while a review agent checks solution attempts to ensure the tests are reliable. The framework produces 4,670 training tasks, and reinforcement learning on them improves a model’s results on the DeepSWE-v1.1 benchmark. Its 100-task benchmark also shows that models still struggle with complex, interdependent engineering constraints.'}, 'zh': {'title': '编织相互依赖的规格，训练更可靠的编程智能体', 'desc': 'CodeSpecWeave 是一个用于合成复杂软件开发任务的框架，帮助训练编程智能体处理长期、多约束的工程工作。它从真实开发任务出发，由生成智能体逐步编写相互关联的需求和可执行测试，再由审查智能体检查多个模型的解决过程，以提高测试的可靠性。研究者用该方法构建了包含 4,670 个任务的数据集，并通过强化学习训练模型，使其在 DeepSWE-v1.1 基准上的表现优于基础模型和现有方法。论文还发布了包含 100 个任务和 1,044 项规格的 CodeSpecWeave-Bench，用于评估模型满足相互依赖工程约束的能力。'}}}, {'id': 'https://huggingface.co/papers/2610.37393', 'title': 'Learning Quality-Controllable Robot Policies with Iterative Hindsight Relabeling', 'url': 'https://huggingface.co/papers/2610.37393', 'abstract': 'Abstract Quality-Controllable Policy enables real-time adjustment of robot execution quality and improves performance through iterative hindsight relabeling of online rollouts.  Generated by thinkingmachines/Inkling-Small Robot policy evaluation often relies on a binary success signal for task completion. In real-world deployment, however, desired execution behaviors are also defined by quality attributes such as execution speed and motion smoothness, which need to be dynamically controlled according to task requirements. To address this, we introduce Quality-Controllable Policy (QCP), a robot policy that enables inference-time control over both individual quality attributes and their combinations. To extend the controllable quality range beyond initial demonstrations, we further propose an iterative hindsight relabeling loop: QCP collects online rollouts under target quality labels, adds successful trajectories to the dataset, relabels the accumulated trajectories in hindsight according to their measured quality, and fine-tunes the policy. Experiments on Robomimic and RoboEval demonstrate that QCP consistently improves both task execution quality and success rates across iterations, producing successful rollouts that exceed the quality of the initial demonstrations. Finally, we validate QCP on real-world manipulation tasks, where controlling speed increases throughput in conveyor operations and controlling transport stability improves success when carrying wine glasses, demonstrating that quality-controllable policies yield practical gains in physical deployment.', 'score': 1, 'issue_id': 3490, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'acda579b8aa9f2ef', 'authors': ['Sinjae Kang', 'Dong Kyu Shin', 'Jaehong Kim', 'Kamin Lee', 'Hyoeun Kim', 'Kaixin Wang', 'Li Zhao', 'Seonghyeon Ye', 'Kimin Lee'], 'affiliations': ['KAIST', 'LGE', 'Microsoft Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.37393.jpg', 'data': {'categories': ['#rl', '#data', '#training', '#optimization', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Роботы, которые выполняют задачи не просто успешно, а с нужным качеством', 'desc': 'В статье предлагается Quality-Controllable Policy (QCP) — политика робота, которая позволяет во время инференса управлять отдельными атрибутами качества выполнения, такими как скорость и плавность движения, а также их комбинациями. Для расширения диапазона управляемого качества за пределы исходных демонстраций авторы вводят итеративный цикл hindsight relabeling: онлайн-роллауты собираются под целевыми метками качества, успешные траектории добавляются в датасет, затем переразмечаются по измеренному качеству и используются для дообучения policy. Эксперименты на Robomimic и RoboEval показывают, что QCP улучшает как качество выполнения, так и success rate на каждой итерации, порождая роллауты качественнее исходных демонстраций. Валидация на реальных манипуляциях подтверждает практическую пользу: контроль скорости повышает пропускную способность конвейера, а контроль стабильности транспортировки повышает успешность при переносе бокалов для вина.'}, 'en': {'title': 'Control not only whether robots succeed, but how well they do it', 'desc': 'The paper introduces Quality-Controllable Policy (QCP), a robot policy that can adjust execution qualities such as speed and motion smoothness at inference time. It also proposes iterative hindsight relabeling, which measures the quality of online robot rollouts, adds successful trajectories to the training data, and fine-tunes the policy. Experiments show that this process improves both task success rates and execution quality, sometimes exceeding the quality of the original demonstrations. Real-world tests show practical benefits, including faster conveyor work and more stable transport of wine glasses.'}, 'zh': {'title': '让机器人按需掌控执行质量，越练越好', 'desc': '这篇论文提出质量可控策略（QCP），让机器人在执行任务时能按需调整速度、动作平滑度等质量属性，并控制这些属性的组合。为了让策略学会超出初始示范范围的表现，研究者设计了迭代式事后重标注方法：机器人按目标质量标签在线执行任务，将成功轨迹加入数据集，再根据轨迹测得的质量重新标注并微调策略。在 Robomimic 和 RoboEval 实验中，QCP 随迭代提升了任务成功率和执行质量，生成的成功轨迹甚至优于初始示范。真实机器人实验还表明，调节速度可提高传送带作业效率，控制搬运稳定性则有助于安全运送酒杯。'}}}, {'id': 'https://huggingface.co/papers/2610.40727', 'title': 'VoxLock: Target-Speaker Extraction for Voice Agents Without an Enrollment Step', 'url': 'https://huggingface.co/papers/2610.40727', 'abstract': "Abstract A fine-tuned causal target-speaker extraction model achieves near-commercial speech recognition accuracy on real recordings with low CPU usage and latency.  Generated by thinkingmachines/Inkling-Small A voice agent's speech recognizer transcribes everyone near the microphone, including people other than the caller. I fine-tuned a public causal target-speaker extraction model (REAL-TSE, 27M parameters) on one GPU to work from a voice sample cut from the call itself, and released it as VoxLock. I score it by what a recognizer writes on real recordings. On Krisp's 265-recording benchmark it reaches 4.95% WER against 23.21% unprocessed and lets 9 background words into the transcript over 85 minutes of background-only speech. Its WER is not significantly different from Krisp's best filters and is significantly lower than the other commercial and open systems I tested. On 400 AMI meeting windows built and frozen before scoring, it cuts WER from 42.95% to 10.63%. The 8-bit model runs a live call on 77% of one CPU thread with 24 ms of algorithmic latency. Model, code and per-file scores are open.", 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '898f315e5f5f7323', 'authors': ['Arbaz Siddiqui'], 'affiliations': ['Independent researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.40727.jpg', 'data': {'categories': ['#audio', '#small_models', '#training', '#benchmark', '#optimization', '#open_source', '#inference'], 'emoji': '🎙️', 'ru': {'title': 'Слышим только звонящего: голос в шумной комнате без лишних слов', 'desc': 'Авторы дообучили каузальную модель выделения целевого диктора REAL-TSE (27 млн параметров) на одном GPU, используя голосовой образец, взятый из самого звонка. Модель, названная VoxLock, подавляет речь посторонних людей, которую распознаватель иначе транскрибирует. На бенчмарке Krisp WER снижается с 23.21% до 4.95%, что сопоставимо с лучшими коммерческими фильтрами. Квантованная 8-битная версия работает в реальном времени на одном CPU-потоке с задержкой 24 мс.'}, 'en': {'title': 'Lock on to the caller, leave background voices behind', 'desc': 'The paper fine-tunes REAL-TSE, a causal target-speaker extraction model, to isolate a caller’s voice using a voice sample taken from the call. The resulting 27-million-parameter model, VoxLock, is evaluated by the word error rate (WER) of a speech recognizer on real recordings. It achieves 4.95% WER on Krisp’s benchmark and reduces WER from 42.95% to 10.63% on AMI meeting audio, while strongly suppressing background speech. Its 8-bit version runs in real time using 77% of one CPU thread with 24 ms of algorithmic latency.'}, 'zh': {'title': '锁定目标说话人，让实时语音识别更准确', 'desc': '这篇论文将一个公开的因果式目标说话人提取模型 REAL-TSE 微调为 VoxLock，使其能够根据通话中的一段语音样本，只提取目标说话人的声音。作者通过语音识别系统在真实录音上的词错误率（WER）评估效果：在 Krisp 的 265 段录音上，WER 从未处理时的 23.21% 降至 4.95%，在 AMI 会议片段上则从 42.95% 降至 10.63%。测试还显示，它能有效压制背景说话人的语音，效果与 Krisp 的最佳滤波器相当，并优于作者测试的其他商用和开源系统。经过 8 位量化后，该模型仅使用单个 CPU 线程约 77% 的算力，算法延迟为 24 毫秒，适合实时通话。'}}}, {'id': 'https://huggingface.co/papers/2610.37919', 'title': 'SciGame: Let Agents Play the Scientific Discovery Games in the Real and Counterfactual World', 'url': 'https://huggingface.co/papers/2610.37919', 'abstract': 'Abstract SciGame evaluates scientific discovery agents using structured cards with counterfactual environments to separate prior knowledge from empirical evidence, revealing that exact symbolic law recovery remains a key challenge.  Generated by thinkingmachines/Inkling-Small Large language model agents are increasingly used for scientific discovery. However, existing benchmarks mix law inference with programming, score data fitting instead of prediction on unseen inputs, and do not separate empirical evidence from pretrained priors. We introduce SciGame, a controlled benchmark that converts scientific literature into structured scientific cards. Each card yields a pair of Original and dimensionally consistent Counterfactual environments with the same task interface. SciGame contains a Historical collection of canonical laws and a live Temporal collection curated from papers published after model knowledge cutoffs. It evaluates agents in candidate-guided Identification and open-ended Discovery settings. Each setting runs under Prior-only, Fixed, and Adaptive protocols. Experiments on five frontier models yield three findings. First, familiar priors hurt performance once the governing relation is altered. Second, adaptive experimentation helps the strongest models but harms weaker ones under limited budgets. Third, good explanations can hide quantitative failures. Recovering the exact symbolic form remains the main bottleneck, even when agents interpret evidence correctly. Current agents can investigate systems actively, but inducing exact laws in unfamiliar settings remains an open challenge.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'db5962c212437254', 'authors': ['Yusheng Zhao', 'Bowei He', 'Xue Liu', 'Mingxiao Li'], 'affiliations': ['MBZUAI', 'McGill University', 'Shanghai AI Lab'], 'pdf_title_img': 'assets/pdf/title_img/2610.37919.jpg', 'data': {'categories': ['#science', '#dataset', '#reasoning', '#agents', '#benchmark', '#leakage'], 'emoji': '🔬', 'ru': {'title': 'Агенты умеют исследовать, но точный закон в незнакомых условиях вывести пока не могут', 'desc': 'В статье представлен SciGame — контролируемый бенчмарк для оценки LLM-агентов в задачах научного открытия. Литературные источники преобразуются в структурированные научные карточки, из которых строятся оригинальная и контрфактическая среды с одинаковым интерфейсом, что позволяет отделить априорные знания модели от эмпирических данных. Эксперименты с пятью передовыми моделями показали, что привычные априорные знания мешают при изменении управляющих зависимостей, а адаптивное экспериментирование помогает сильнейшим моделям, но вредит слабым. Главным узким местом остаётся точное восстановление символьной формы закона, даже когда агенты правильно интерпретируют данные.'}, 'en': {'title': 'Test the evidence, not just the prior: exact scientific laws remain hard to discover', 'desc': 'SciGame is a benchmark for testing whether AI agents can discover scientific laws from evidence rather than rely on what they learned during training. It uses structured scientific cards to create original environments and dimensionally consistent counterfactuals, and tests both familiar laws and findings published after models’ training cutoffs. Agents are evaluated through candidate-guided identification and open-ended discovery, using protocols that vary how much prior knowledge and experimentation they can use. Results show that familiar knowledge can mislead agents, adaptive experiments help only the strongest models, and recovering an exact symbolic law remains difficult even when explanations sound convincing.'}, 'zh': {'title': '能探索，更要发现：让智能体从证据中还原精确科学定律', 'desc': '本文提出 SciGame，一个用于评估科学发现智能体的可控基准测试。它把科学文献整理成结构化卡片，并为每个任务构建原始环境和量纲一致的反事实环境，以区分模型的先验知识与实验所得证据。基准测试包含候选引导的识别和开放式发现任务，并通过不同实验协议评估智能体。结果表明，主动实验对强模型有帮助，却可能损害弱模型的表现；即使解释合理，模型仍常无法准确恢复规律的符号形式。'}}}, {'id': 'https://huggingface.co/papers/2610.29617', 'title': 'TernScope: Model-Hardware Co-Design for Efficient Ternary Endoscopic Segmentation', 'url': 'https://huggingface.co/papers/2610.29617', 'abstract': 'Abstract TernScope co-designs a compact ternary-weight segmentation network with simplified hardware to achieve high accuracy and fast inference for edge medical imaging.  Generated by thinkingmachines/Inkling-Small Edge medical segmentation must reconcile small model size, high accuracy, and fast inference. TernScope addresses this tradeoff through model--hardware co-design, learning a compact segmentation network whose low-bit operators also simplify hardware execution. Split-channel large-kernel blocks preserve spatial context with limited computation, while branch fusion removes redundant inference paths. Ternary Progressive Quantization-aware Training (TPQ) then adapts the fused network from deep to shallow layers, through the decoder, and finally to the input and prediction layers. All 25 convolutions use ternary weights and 8-bit activations, enabling packed storage and multiplier-free computation. The resulting model uses 0.2483 M parameters and 0.0949 GMACs while retaining competitive segmentation accuracy on in-domain and external datasets. Under the same 45 nm technology, TernScope reduces compute-array area by 88.46% compared with the original Gemmini, a systolic-array accelerator with 8-bit times 8-bit multipliers. These results demonstrate a path from accurate lightweight medical segmentation to compact low-bit hardware.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '66e0128e3ed7b5c9', 'authors': ['Zhuoyu Wu', 'Wenhui Ou', 'Qiawei Zheng', 'Xuhong Qiu', 'Wenqi Fang', 'Raphaël C. -W. Phan'], 'affiliations': ['CyPhi AI Research Lab, School of Information Technology, Monash University Malaysia, Malaysia', 'Department of Electronic and Computer Engineering, The Hong Kong University of Science and Technology, Hong Kong', 'School of Computer Science and Engineering, Southeast University, Nanjing, China', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences, Shenzhen, China'], 'pdf_title_img': 'assets/pdf/title_img/2610.29617.jpg', 'data': {'categories': ['#inference', '#small_models', '#training', '#healthcare', '#optimization', '#cv', '#architecture'], 'emoji': '\U0001fa7b', 'ru': {'title': 'Точная медицинская сегментация в компактном тернарном формате', 'desc': 'TernScope — это компактная сегментационная нейросеть для медицинских изображений, которая разрабатывается совместно с аппаратной частью, чтобы работать на edge-устройствах. Сеть использует тернарные веса (ternary weights) и 8-битные активации, что позволяет хранить модель в упакованном виде и вычислять без умножителей. Метод Ternary Progressive Quantization-aware Training (TPQ) постепенно адаптирует сеть к квантованию: от глубоких слоёв к поверхностным, затем к декодеру и входным и выходным слоям. Модель содержит всего 0.2483 M параметров и 0.0949 GMACs, сохраняя конкурентную точность, а вычислительный блок по сравнению с Gemmini сокращён по площади на 88.46%.'}, 'en': {'title': 'Accurate Medical Segmentation, Built for Ternary Hardware', 'desc': 'TernScope jointly designs a compact medical image segmentation network and its hardware to achieve efficient inference on edge devices. Split-channel large-kernel blocks preserve spatial context with low computation, and branch fusion removes redundant inference paths. Ternary Progressive Quantization-aware Training adapts the network to use ternary weights and 8-bit activations across all convolutions, reducing storage and enabling multiplier-free computation. The model retains competitive segmentation accuracy with 0.2483 million parameters and reduces compute-array area by 88.46% compared with the Gemmini accelerator.'}, 'zh': {'title': '协同设计，让精准医疗分割更小、更快', 'desc': 'TernScope通过模型与硬件协同设计，构建适用于边缘医疗影像的轻量级图像分割网络。它采用分通道大卷积核模块保留空间上下文，并通过分支融合去除冗余计算路径。随后，渐进式三值量化感知训练从深层到浅层逐步适配网络；全部25个卷积层使用三值权重和8位激活，从而支持紧凑存储与无需乘法器的计算。该模型仅有0.2483 M个参数和0.0949 GMACs，在保持有竞争力的分割精度的同时，相比Gemmini将计算阵列面积减少88.46%。'}}}, {'id': 'https://huggingface.co/papers/2610.41260', 'title': 'SketchDirector: Complex Scene Sketching via Agentic Layout Reasoning and Detail Refinement', 'url': 'https://huggingface.co/papers/2610.41260', 'abstract': 'Abstract SketchDirector is an agentic framework that decomposes text prompts into draft vector assets, arranges them via iterative reasoning with self-evolving memory, and refines details using diffusion priors for complex scene sketching.  Generated by thinkingmachines/Inkling-Small Existing sketch generation methods often rely on image guidance and are largely limited to individual objects or simplified scenes, leaving text-guided complex scene sketching underexplored. We present SketchDirector, an agentic framework that mimics the human sketching workflow for automatic multi-concept scene sketching. Given a scene-level text prompt, SketchDirector first employs a large language model~(LLM) to decompose the scene into multiple draft assets, where each is represented by a set of Bézier curves. Then, an agentic reasoning loop iteratively plans and executes their spatial arrangement, guided by self-evolving memory. Finally, a detail refinement module leverages diffusion priors to enhance sketch quality while preserving geometric structure. To support future research and applications in multi-concept scene sketch generation, we further introduce the MCSketch8K dataset, comprising editable vector assets, compositional layouts, and object-level manipulation annotations. Extensive experiments show that SketchDirector outperforms state-of-the-art baselines in semantic and compositional quality while effectively preserving overall contour organization during refinement. The project page is: https://yiki77.github.io/SketchDirector/{https://yiki77.github.io/SketchDirector/}.', 'score': 1, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'eeedc93e6b4a7ba7', 'authors': ['Yiqi Liang', 'Xiaodong Cun'], 'affiliations': ['Great Bay University'], 'pdf_title_img': 'assets/pdf/title_img/2610.41260.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#cv'], 'emoji': '✏️', 'ru': {'title': 'От текстового описания к целой сцене — эскиз, который строит AI-режиссёр', 'desc': 'SketchDirector — это агентный фреймворк, который разбивает текстовый промпт сцены на несколько черновых векторных ассетов, представленных кривыми Безье. Большая языковая модель (LLM) планирует их пространственное расположение в итеративном цикле рассуждений с самообучающейся памятью (self-evolving memory). Затем модуль уточнения деталей использует диффузионные априорные знания (diffusion priors), чтобы улучшить качество эскиза и сохранить геометрическую структуру. Авторы также представляют датасет MCSketch8K с редактируемыми векторными ассетами и аннотациями для манипуляций на уровне объектов, а эксперименты показывают превосходство над современными baseline-методами по семантическому и композиционному качеству.'}, 'en': {'title': 'From Text to Thoughtfully Composed Scene Sketches', 'desc': 'SketchDirector turns a text description of a complex scene into a sketch containing multiple objects. A large language model breaks the scene into draft assets made from Bézier curves, and an agent iteratively arranges them using a memory that updates as it works. A refinement module uses diffusion priors to improve visual details while preserving the sketch’s overall geometry. The authors also introduce the MCSketch8K dataset, and experiments show that SketchDirector produces more semantically accurate, well-composed sketches than existing methods.'}, 'zh': {'title': '让智能体像人一样构思、布局并细化复杂场景草图', 'desc': '本文提出 SketchDirector，用于根据场景级文本提示生成包含多个概念的草图。它先用大语言模型把提示拆解成多个由贝塞尔曲线表示的草稿素材，再通过带有自进化记忆的智能体推理循环规划并调整素材布局。之后，系统利用扩散模型先验细化草图，同时尽量保持原有的几何结构。作者还构建了 MCSketch8K 数据集；实验表明，该方法在语义与构图质量上优于现有基线，并能保留整体轮廓布局。'}}}, {'id': 'https://huggingface.co/papers/2610.40914', 'title': 'No Channels Left Behind: Understanding Diffusion Acceleration through Residual Gates', 'url': 'https://huggingface.co/papers/2610.40914', 'abstract': 'Abstract Training acceleration in diffusion transformers is driven by reorganization of AdaLN-Zero residual gates, and a simple radial objective promoting broader gate participation improves generation quality without auxiliary teachers.  Generated by thinkingmachines/Inkling-Small Training acceleration methods for diffusion transformers, such as REPA and dispersive regularization, are commonly explained by additional supervision, spatial-structure priors, or improved feature geometry. We revisit this view and uncover a striking internal change: the AdaLN-Zero residual gate α, which directly controls how conditioned updates enter the residual stream, is substantially reorganized by these methods. This observation motivates our hypothesis that acceleration arises, at least in part, from reshaping the residual gating pathway rather than solely from the feature structures explicitly imposed by auxiliary objectives. Supporting this view, accelerated models are markedly more sensitive to perturbations of α, and their gate geometry reflects semantic relationships among classes. We further introduce the normalized participation ratio (nPR) to characterize the channel-wise organization of the gates and find that, across REPA teachers, projector architectures, and radial-objective targets, broader gate participation accompanies better generation quality. Guided by this insight, we propose a simple teacher-free radial objective that promotes broader gate participation through feature-norm regularization, without pairwise feature comparisons. On ImageNet 256times256 with SiT-B/2, our method improves FID over dispersive loss while increasing mean gate participation over timesteps and classes, further supporting the link between gate organization and training acceleration. Our results identify residual-gate reorganization as a measurable axis of diffusion training acceleration and suggest a simple direction for further acceleration.', 'score': 0, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '811a2d2363d04f72', 'authors': ['Junha Park', 'Jaemyung Yu', 'Jaehui Hwang', 'Jong-Seok Lee', 'Dongyoon Han'], 'affiliations': ['NAVER AI Lab', 'Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2610.40914.jpg', 'data': {'categories': ['#interpretability', '#training', '#diffusion', '#optimization', '#architecture'], 'emoji': '⚙️', 'ru': {'title': 'Ускорение диффузии начинается с перестройки residual gates', 'desc': 'Авторы показывают, что методы ускорения обучения диффузионных трансформеров (REPA, dispersive loss) заметно перестраивают AdaLN-Zero residual gate α, который управляет тем, как условные обновления попадают в residual stream. Для описания организации каналов гейтов вводится нормализованный participation ratio (nPR), и оказывается, что более широкое участие гейтов связано с лучшим качеством генерации. На основе этого предлагается простой teacher-free радиальный регуляризатор, который через норму признаков расширяет участие гейтов без попарных сравнений признаков. На ImageNet 256×256 с SiT-B/2 метод улучшает FID по сравнению с dispersive loss.'}, 'en': {'title': 'Broader Residual-Gate Participation for Better Diffusion Models', 'desc': 'The paper studies how training acceleration methods affect diffusion transformers. It finds that these methods reorganize AdaLN-Zero residual gates, which control how conditioned updates enter the residual stream, and that broader participation across gate channels is linked to better image generation quality. The authors measure this organization with normalized participation ratio (nPR) and introduce a teacher-free radial objective that encourages broader gate participation through feature-norm regularization. On ImageNet, the method improves FID over dispersive loss, suggesting that residual-gate organization is an important part of training acceleration.'}, 'zh': {'title': '拓宽残差门控参与，让扩散模型训练更快、生成更好', 'desc': '这篇论文研究扩散 Transformer 的训练加速机制，发现 AdaLN-Zero 中控制条件信息进入残差流的门控参数 α 会发生明显重组。加速模型对 α 的扰动更敏感，而且门控结构能反映类别之间的语义关系。作者提出归一化参与率（nPR）来衡量门控在不同通道上的分布，并发现门控参与范围越广，生成质量往往越好。基于此，作者设计了无需教师模型的径向目标，通过特征范数正则化扩大门控参与范围，并在 ImageNet 实验中取得优于 dispersive loss 的 FID。'}}}];
        const articlesContainer = document.getElementById('articles-container');

        }

            if (isDarkMode) {
                document.body.classList.remove('light-theme');

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";

                titleSign.classList.add('rotate');

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);

            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();

            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));

                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;

                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }

            updateCategoryButtonStates();

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);

            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);

                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-03 23:51')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-03 23:51')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
