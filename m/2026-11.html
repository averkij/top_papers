    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.00859', 'title': 'Wave Forcing: Towards Speed-of-Light Streaming Video Generation', 'url': 'https://huggingface.co/papers/2611.00859', 'abstract': 'Abstract Wave Forcing enables efficient continuous long-video generation with consistent appearance and natural motion through co-designed generation, training, and execution, achieving high throughput and quality.  Generated by thinkingmachines/Inkling-Small Real-time long-video generation requires continuous output with consistent appearance and natural motion. Existing chunk-wise autoregressive methods face challenges in both generation efficiency and long-video quality: serialized denoising and history-cache refresh require two forward passes even with one-step denoising, and longer rollouts can degrade quality and cause camera drift. We propose Wave Forcing (WF), which co-designs generation, training, and execution for continuous video output with multi-step denoising. WF uses chunk-wise causal attention to access earlier, cleaner chunks before their denoising is complete, and distributes staggered denoising and cache-refresh stages across full-model replicas to achieve 1F1C: one output chunk per concurrent forward round after pipeline fill. To adapt the model to this continuous generation process, we develop a three-stage training procedure that successively introduces mixed-noise denoising, motion supervision, and causal adaptation using self-generated history. To execute this process efficiently, Wave Runtime (WaveRT) uses Wave Parallelism (WP) for early K/V delivery and communication-computation overlap, together with optimized kernels and pipelined VAE decoding. Experiments on Wan2.1-T2V-1.3B show that 5-step WF maintains overall quality comparable to Rolling Forcing while achieving higher Dynamic Degree on both short and long videos. Our system efficiency experiments show that 4-step WF achieves 147.6 DiT FPS and 134.8 end-to-end FPS on eight H200 GPUs, yielding 7.07x the single-GPU end-to-end throughput. In DiT-only tests with matched SageAttention+W8A8 backends, denoising steps, and GPU counts, WP delivers up to 2.53x the throughput of the faster of the Ulysses and Ring context-parallel baselines across six model scales (1.3B-14B).', 'score': 100, 'issue_id': 3493, 'pub_date': '2026-10-31', 'pub_date_card': {'ru': '31 октября', 'en': 'October 31', 'zh': '10月31日'}, 'hash': 'bfc7beed3e1e295d', 'authors': ['Yijie Jin', 'Yuxuan Liu', 'Jiajun Xu', 'Ye Huang', 'Chuzhi Wang', 'Jiayang Li', 'Ruiyang Chen', 'Chenling Hong', 'Xu Wang', 'Zhijie Deng'], 'affiliations': ['East China Normal University', 'National Tsing Hua University', 'Peking University', 'Shanghai Jiao Tong University', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2611.00859.jpg', 'data': {'categories': ['#optimization', '#video', '#inference', '#training', '#diffusion'], 'emoji': '🌊', 'ru': {'title': 'Непрерывные длинные видео в реальном времени благодаря волновому конвейеру', 'desc': 'Статья предлагает метод Wave Forcing для непрерывной генерации длинных видео с постоянным внешним видом и естественным движением. Подход использует чанковое каузальное внимание (chunk-wise causal attention), которое позволяет обращаться к более ранним и чистым фрагментам до завершения их денойзинга, и распределяет стадии денойзинга и обновления кэша между копиями модели, достигая режима 1F1C. Обучение проходит в три этапа: смешанный шумовой денойзинг, supervision по движению и каузальная адаптация на собственной истории генерации. Система WaveRT с Wave Parallelism и оптимизированными ядрами показывает до 7.07x пропускной способности на восьми GPU по сравнению с одним GPU и до 2.53x по сравнению с Ulysses и Ring.'}, 'en': {'title': 'Wave Forcing: Faster, Smoother Continuous Video', 'desc': 'Wave Forcing (WF) is a method for generating long videos continuously while keeping their appearance consistent and motion natural. It uses chunk-wise causal attention and staggered multi-step denoising, so earlier video chunks can help generate later ones before they are fully denoised. A three-stage training process adapts the model to this approach, while Wave Runtime uses parallel execution and optimized decoding to improve speed. On Wan2.1-T2V-1.3B, WF achieved quality comparable to Rolling Forcing with higher motion levels, and its runtime delivered high throughput across multiple GPUs.'}, 'zh': {'title': '让长视频连续生成：画面稳定、动作自然、速度更快', 'desc': '这篇论文提出 Wave Forcing（WF），让模型能够连续生成长视频，同时保持画面外观一致、动作自然。WF 采用分块因果注意力，使模型在当前片段尚未完成去噪时，就能利用较早且较干净的片段；它还把去噪和缓存刷新分配到多个模型副本上，从而在流水线填满后，每轮并行计算都能输出一个视频片段。为适应这种生成方式，作者设计了三阶段训练流程，并开发 Wave Runtime，利用并行计算、通信与计算重叠及优化解码来提升效率。实验显示，WF 的视频质量与 Rolling Forcing 相当且动态程度更高；在八张 H200 GPU 上，端到端吞吐量达到单卡的 7.07 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.03126', 'title': 'CUA-Master: Scaling Computer-use Agents through Open-World Recursive Improvements', 'url': 'https://huggingface.co/papers/2611.03126', 'abstract': "Abstract CUA-Master uses nested recursive loops with open-world data and feedback-driven retries to continuously improve computer-use agents across diverse benchmarks.  Generated by thinkingmachines/Inkling-Small Despite recent advances in CUAs, their development remains constrained by the limited diversity, controllability, and reliability of interaction data. Moreover, conventional optimization pipelines lack iterative feedback, while existing recursive improvement approaches often rely on self-generated experiences, limiting ability expansion and yielding diminishing returns. To address these challenges, we introduce CUA-Master, a nested double-loop recursive improvement framework. At the system level, an outer world-data-model flywheel continuously incorporates open-world corpus and leverages evolving model weaknesses to guide subsequent data construction and optimization iterations. At the data level, an inner flywheel couples open-world seeding and autocatalytic propagation. The former mines authentic workflows as seed tasks from instructional videos, and employs visual-semantic dual-path trajectory reconstruction; The latter transforms these seeds into reusable primitives for controllable synthesis of diverse, complex, and verifiable tasks. To enable efficient and reliable trajectory collection, we further introduce a feedback-guided snapshot-rollback retry mechanism in various real environments. Extensive experiments demonstrate that CUA-Master-27B achieves competitive performance across GUI-only and GUI-CLI hybrid benchmarks, scoring 80.2 on OSWorld Verified, 36.9 on OSWorld 2.0, 43.9 on WeaveBench, and 25.0 on Agents' Last Exam. Our framework also substantially improves the quality and efficiency of data synthesis, and exhibits continuous gains across recursive iterations.", 'score': 90, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '1c2667a52a6e66f3', 'authors': ['Xinlei Yu', 'Gen Li', 'Ji Zhao', 'Zhangquan Chen', 'Congcong Wang', 'Shuai Dong', 'Zelin Peng', 'Yuqi Xu', 'Hongrui Wu', 'Kaiwen Tuo', 'Cheng Yang', 'Kaituo Feng', 'Yifan Wu', 'Jiayi Zhang', 'Dongming Wu', 'Wenqi Shao', 'Jiaqi Wang', 'Xiangyu Yue'], 'affiliations': ['Explore Academy, JD', 'HKUST(GZ)', 'MMLab, CUHK', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2611.03126.jpg', 'data': {'categories': ['#optimization', '#agents', '#agi', '#data', '#synthetic', '#training', '#dataset', '#benchmark'], 'emoji': '🖥️', 'ru': {'title': 'Агент, который учится на собственных ошибках и данных из открытого мира', 'desc': 'В статье представлен CUA-Master — фреймворк с вложенными рекурсивными циклами для улучшения computer-use agents, то есть LLM-агентов, которые управляют компьютером. Внешний цикл постоянно подмешивает данные из открытого мира и опирается на выявленные слабости модели, чтобы направлять построение датасетов и итерации оптимизации. Внутренний цикл извлекает реальные рабочие процессы из обучающих видео, реконструирует траектории визуально и семантически и превращает их в переиспользуемые примитивы для генерации разнообразных, проверяемых задач. Для надёжного сбора траекторий применяется механизм повторных попыток со snapshot-rollback, управляемый обратной связью; модель CUA-Master-27B показывает конкурентные результаты на GUI и гибридных бенчмарках и стабильный прирост качества при рекурсивных итерациях.'}, 'en': {'title': 'Learn from the Open World, Improve with Every Loop', 'desc': 'CUA-Master is a framework for improving computer-use agents through two nested feedback loops. An outer loop uses open-world data and model weaknesses to guide new data creation and optimization, while an inner loop turns real workflows from instructional videos into reusable building blocks for generating varied, testable tasks. A feedback-guided snapshot-and-rollback method helps collect reliable interaction trajectories in real environments. Experiments show strong benchmark results and continued improvements over repeated iterations.'}, 'zh': {'title': '让开放世界数据与反馈循环驱动智能体持续进化', 'desc': 'CUA-Master 提出一种嵌套双循环框架，用于持续改进计算机使用智能体。外层循环利用开放世界数据和模型的弱点，反复指导数据构建与优化；内层循环从教学视频中提取真实任务，并将其组合成多样、复杂且可验证的任务。框架还采用反馈引导的快照回滚重试机制，提高真实环境中轨迹收集的效率和可靠性。实验显示，CUA-Master-27B 在多个图形界面及图形界面与命令行混合基准上表现具有竞争力，并且多轮迭代能持续提升效果。'}}}, {'id': 'https://huggingface.co/papers/2611.03178', 'title': 'CoworkOS:Scaling Agent Coworkers for Real-world Automation', 'url': 'https://huggingface.co/papers/2611.03178', 'abstract': "Abstract CoworkOS is a long-horizon agent harness that separates strategy from execution, supports human-in-the-loop collaboration via shared artifacts, and improves model performance through sustained automated post-training.  Generated by thinkingmachines/Inkling-Small Rapid advances in cowork agents are shifting human-AI collaboration toward real-world automation, delivering software, designs, and other artifacts. However, such productivity work demands both high-quality delivery on complex productivity tasks and continued monitoring and decision-making over long horizons, a combination that remains an open challenge. We introduce CoworkOS, a general-purpose harness for long-horizon work that separates task strategy from execution management: the model decides actions, delegation, and acceptance, while the runtime maintains state and feedback. Its three-layer architecture enables direct execution or delegation to Subagents, synchronously or asynchronously, under stable responsibilities. Through a shared application layer, humans and agents inspect and revise the same evolving documents, presentations, CAD models, and Blender scenes, so human-in-the-loop participation can enter both through conversation and through direct modification of the work itself. To sustain continuity across agents and sessions, CoworkOS further introduces hierarchical workspaces and persistent semantic memory, so working files, key decisions, and long-running Job logs remain shareable, reusable, and resumable after interruption. Across 12 benchmarks and 6 categories of real-world applications, CoworkOS proves highly competitive with frontier agent applications such as Codex and DeepSeek Harness. As a sustained-work case study, CoworkOS uses GLM-5.3 as its backbone to conduct RSI-driven automated post-training on Qwen3.6-35B-A3B. Over five rounds, the model's average score across eight benchmarks rose from 33.19 to 42.95 (+9.76). Looking ahead, we believe CoworkOS opens a meaningful path toward general cowork-agent intelligence.", 'score': 86, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '906a2da26add9299', 'pdf_title_img': 'assets/pdf/title_img/2611.03178.jpg', 'data': {'categories': ['#optimization', '#agents', '#agi', '#training', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'CoworkOS: долгосрочная совместная работа человека и AI-агентов, где стратегию задают модели, а исполнение держит runtime', 'desc': 'Статья представляет CoworkOS — универсальный harness для долгосрочных агентных задач, который разделяет стратегию задачи (принимает модель) и управление исполнением (поддерживает runtime). Система использует трёхслойную архитектуру с Subagents, работающими синхронно или асинхронно, и общий слой приложений, где люди и LLM совместно редактируют документы, презентации, CAD-модели и сцены Blender. Для непрерывности работы введены иерархические workspaces и персистентная семантическая память, позволяющие возобновлять прерванные задачи. В кейсе с RSI-driven automated post-training средний балл модели Qwen3.6-35B-A3B на восьми бенчмарках вырос с 33.19 до 42.95 за пять раундов.'}, 'en': {'title': 'Plan separately, work together, and keep improving', 'desc': 'CoworkOS is a framework for AI agents that handle complex tasks over long periods. It separates planning from execution: the model chooses what to do, while the system tracks progress, feedback, and delegated work. People can collaborate by discussing tasks or directly editing shared documents and other artifacts, while persistent memory helps work resume across agents and sessions. On 12 benchmarks, it performed competitively with leading agent systems; in a post-training study, scores increased by 9.76 points over five rounds.'}, 'zh': {'title': '让智能体与人类协作，把长期任务持续推进', 'desc': '论文提出 CoworkOS，这是一个面向长期任务的智能体框架，将任务策略与执行管理分离：模型负责决策、委派和验收，运行时则维护状态与反馈。它支持智能体直接执行任务或委派给子智能体，并让人与智能体通过共享文档、演示文稿和三维模型协作修改成果。分层工作空间与持久语义记忆能保存文件、决策和任务记录，使工作在不同智能体和会话之间延续，并可在中断后恢复。在 12 个基准测试中，CoworkOS 表现具有竞争力；它还通过迭代式自动后训练，将 Qwen3.6-35B-A3B 在八项基准上的平均分从 33.19 提升到 42.95。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2611.01860', 'title': 'Advances in Agentic Computer Graphics', 'url': 'https://huggingface.co/papers/2611.01860', 'abstract': 'Abstract This report proposes a unified taxonomy and literature system for agentic computer graphics driven by large language models, analyzing trends and open challenges in human-agent collaboration and long-horizon planning.  Generated by thinkingmachines/Inkling-Small Computer graphics is built on code. Large language model (LLM) agents can now generate graphics code and iteratively refine it through various feedback. This capability opens the door to a potentially new paradigm of computer graphics, with graphics algorithms increasingly built around agentic systems to automate progressively complex tasks. Over the past years, research on agentic graphics has expanded rapidly across a diverse range of tasks. This rapid growth makes it increasingly difficult for manual literature reviews to keep pace with new developments. At the same time, similar ideas are often described using different terminology across these tasks, further complicating efforts to develop a systematic understanding of the field. In this report, we address these challenges through two contributions. First, we introduce a unified taxonomy for characterizing agentic systems across diverse computer graphics tasks. Second, we develop an agentic literature system that can assist human researchers in analyzing existing and newly published papers at scale. Building on these contributions, we analyze emerging research trends and discuss open challenges in coordinating agents and tools across graphics tasks, designing interfaces and representations for human-agent collaboration, sustaining long-horizon planning and refinement, and reliably evaluating interactive graphics systems.', 'score': 82, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'b4f9a4e9c7843467', 'authors': ['Hengyu Liu', 'Jihyeon Je', 'Ruiqi Wang', 'Mingxuan Wu', 'Haven Feng', 'Qixing Huang', 'Georgios Pavlakos', 'Hao Zhang', 'Jiajun Wu', 'Maneesh Agrawala', 'Leonidas Guibas', 'R. Kenny Jones', 'Shangzhe Wu', 'Guandao Yang'], 'affiliations': ['Simon Fraser University', 'Stanford University', 'University of California, Berkeley', 'University of Cambridge', 'University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2611.01860.jpg', 'data': {'categories': ['#multimodal', '#cv', '#agents', '#data', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Агенты LLM превращают компьютерную графику в код, который сам себя улучшает', 'desc': 'Статья предлагает единую таксономию для описания агентных систем в компьютерной графике, где большие языковые модели (LLM) генерируют код и итеративно его улучшают. Авторы отмечают, что быстрый рост таких работ затрудняет ручной обзор литературы, а одни и те же идеи называются по-разному. Поэтому они разработали агентную систему для анализа статей (literature system), которая помогает исследователям обрабатывать научные публикации в больших объёмах. На основе этих инструментов выявлены тренды и открытые проблемы: координация агентов и инструментов, взаимодействие человека и агента, долгосрочное планирование и оценка интерактивных графических систем.'}, 'en': {'title': 'A Shared Map for Agentic Computer Graphics', 'desc': 'This report studies how large language model (LLM) agents can write and improve code for computer graphics tasks. It proposes a unified taxonomy to describe these agentic systems across different graphics applications. It also builds an automated literature-analysis system to help researchers review existing and new papers at scale. The report identifies research trends and challenges in coordinating agents and tools, supporting human-agent collaboration, planning over long tasks, and evaluating interactive graphics systems.'}, 'zh': {'title': '以统一分类与智能文献系统，梳理智能体图形学', 'desc': '本文研究由大型语言模型（LLM）驱动的智能体计算机图形学，这类智能体能够生成图形代码，并根据反馈反复改进。作者提出统一分类体系，用来梳理不同图形任务中的智能体系统，并开发辅助研究人员大规模分析论文的文献系统。借助这些工具，报告总结了该领域的新兴研究趋势与主要挑战。挑战包括协调多个智能体和工具、改进人机协作接口与表示、支持长期规划和迭代优化，以及可靠评估交互式图形系统。'}}}, {'id': 'https://huggingface.co/papers/2610.40191', 'title': 'Video Generation Meets Agent Harness: Agentic Video Generation, Agentic World Modeling and Recursive Self-Improvement', 'url': 'https://huggingface.co/papers/2610.40191', 'abstract': 'Abstract Agent harnesses integrate video generation and world models to enable planning, tool use, and recursive self-improvement for autonomous multi-shot video production.  Generated by thinkingmachines/Inkling-Small Video generation is shifting from end-to-end synthesis toward agentic generation, where planning, tool use, and feedback enable coherent, controllable multi-shot videos. In parallel, video world models provide action-conditioned observations and predicted futures, serving as interactive environments for agents. We study their intersection through the agent harness: an executable runtime that constructs context, exposes tools, maintains state, routes feedback, and manages budgets around video models. This report examines three directions. First, agentic video generation, where harnesses coordinate scripting, shot planning, asset management, production, and editing, alongside the evaluation challenges of these systems. Second, agentic world modeling, where harnesses mediate observation, control, execution, and state. We discuss hybrid designs in which game engines or agent-written programs maintain world state while video models render observations, and how agents and world models can mutually evaluate and improve one another. Third, recursive self-improvement (RSI) in video model development, distinguishing output revisions, updates to harness state, generator parameters, and evaluators, and changes to the improvement procedure itself. We identify how these improvements feed back into subsequent development. Across these directions, we analyze essential agent capabilities, including audiovisual perception, long-horizon planning, memory, code-based interaction, feedback-guided control, skill reuse, and multi-agent coordination. We conclude with challenges in autonomous video production, lifelong memory, programmable hybrid control, autonomous model development, provenance, cost accounting, and evaluation linking video quality and task performance to sustained improvements in models and harnesses.', 'score': 67, 'issue_id': 3493, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '0b1f591dc5c718ee', 'authors': ['Liaoyuan Fan', 'Yuhao Zheng', 'Dongxing Mao', 'Hangyu Ran', 'Siyuan Hu', 'Weijia Mao', 'Rui Zhao', 'Weijia Wu', 'Guian Fang', 'Yanzhe Chen', 'Zeyu Zhu', 'Yuxin Jiang', 'Yiren Song', 'Yuchao Gu', 'Junchao Yi', 'Qi Hu', 'Dan Kong', 'Alex Jinpeng Wang', 'Kevin Qinghong Lin', 'Mike Zheng Shou', 'Wei Liu'], 'affiliations': ['Central South University', 'Hong Kong University of Science and Technology', 'Nanyang Technological University', 'National University of Singapore', 'University of Electronic Science and Technology of China', 'University of Science and Technology of China', 'Video Rebirth'], 'pdf_title_img': 'assets/pdf/title_img/2610.40191.jpg', 'data': {'categories': ['#video', '#survey', '#multimodal', '#agents', '#agi'], 'emoji': '🎬', 'ru': {'title': 'Агенты, которые снимают и понимают видео: от генерации к автономному производству', 'desc': 'Статья описывает агентные системы (agent harnesses), которые объединяют генерацию видео и world models для планирования, использования инструментов и рекурсивного самоулучшения при автономном производстве многокадрового видео. Авторы рассматривают три направления: агентную генерацию видео, агентное моделирование мира, где игровые движки или программы поддерживают состояние, а видеомодели рендерят наблюдения, и RSI в разработке видеомоделей. Анализируются ключевые способности агентов, включая восприятие аудио и видео, долгосрочное планирование, память, управление на основе обратной связи и координацию нескольких агентов. В заключение обсуждаются открытые проблемы: автономное производство видео, долговременная память, гибридное программируемое управление, автономная разработка моделей, происхождение контента и оценка качества.'}, 'en': {'title': 'Build video agents that plan, create, and improve', 'desc': 'The paper studies agent harnesses: software runtimes that give video models tools, context, memory, and feedback to plan and create multi-shot videos. It describes how agents can use video world models to predict outcomes and control interactive environments, sometimes combining video generation with game engines or programs that track the world state. It also examines recursive self-improvement, where systems revise video outputs, update their tools or model parameters, and improve the process used to make those changes. Key challenges include long-term planning and memory, reliable evaluation, tracking costs and provenance, and coordinating agents to improve both video quality and task performance.'}, 'zh': {'title': '让智能体规划、生成并持续改进视频', 'desc': '本文研究视频模型与智能体运行框架的结合，运行框架负责组织上下文、调用工具、维护状态并根据反馈调整流程。文章讨论三个方向：用智能体规划和制作多镜头视频、借助视频世界模型进行交互与控制，以及通过递归自我改进持续优化视频模型。混合方案可由游戏引擎或智能体编写的程序维护世界状态，再由视频模型生成观察画面，并让智能体与世界模型互相评估。要实现可靠的自主视频制作，系统还需提升视听感知、长期规划、记忆、反馈控制与多智能体协作能力，并解决评测、成本核算和改进过程追踪等问题。'}}}, {'id': 'https://huggingface.co/papers/2611.01560', 'title': 'Democratizing Robot-Use Agents: A Unified Harness with Open Models', 'url': 'https://huggingface.co/papers/2611.01560', 'abstract': 'Abstract Uni-robot-agent enables open-weight robot-use agents to surpass proprietary models in zero-shot manipulation and suggests joint development of four core capabilities for future training.  Generated by thinkingmachines/Inkling-Small Robot-use Agents (RUAs) have shown promising zero-shot manipulation capabilities, but reliance on frontier, proprietary models limits research into further training. To democratize RUA research, we introduce uni-robot-agent, a unified harness for competitive open-weight robot use that supports further training. Without privileged inputs, an out-of-the-box Qwen3.8-Flash-Next achieves a RoboDojo Score of 31.39, surpassing the published GPT-6 Astra-RoboProbe result of 28.97 and many VLA/WAM baselines, and performs competitively on 19 real-world tasks. Our analysis across model generations, families, and sizes links effective robot use to four general capabilities, suggesting that future RUA training should develop them jointly.', 'score': 38, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '12745de48bb0577d', 'authors': ['Jiarui Yuan', 'Yuxin Zuo', 'Xiaoyu Huang', 'Wenbo Zhang', 'Kwanyoung Park', 'Junlin Yang', 'Tianxiang Zhang', 'Ruoqu Chen', 'Yutao Ouyang', 'Bingxiang He', 'Xingtai Lv', 'Hongjin Wu', 'Jiajun Liu', 'Jiahao Zhao', 'Tianwei Luo', 'Haozhan Li', 'Cheng Qian', 'Jiaxin Ge', 'Huan-ang Gao', 'Kaisen Yang', 'Jiaqi Deng', 'Qixin Xu', 'Siqiao Huang', 'Bowen Zhou', 'Mengdi Xu', 'Zhiyuan Liu', 'Pieter Abbeel', 'Ning Ding'], 'affiliations': ['Tsinghua University', 'UC, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.01560.jpg', 'data': {'categories': ['#open_source', '#robotics', '#agents', '#agi', '#training', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Открытые модели учатся управлять роботами не хуже закрытых', 'desc': 'Статья представляет uni-robot-agent — унифицированную платформу для агентов управления роботами (RUA) на открытых весах, которая позволяет дообучать модели без доступа к закрытым LLM. В режиме zero-shot без привилегированных входных данных модель Qwen3.8-Flash-Next набирает 31,39 балла в RoboDojo, превосходя опубликованный результат GPT-6 Astra-RoboProbe и многие VLA/WAM-базлайны. Система также показывает конкурентные результаты на 19 реальных задачах. Анализ разных поколений, семейств и размеров моделей связывает эффективность работы с роботами с четырьмя общими способностями, которые, по мнению авторов, следует развивать совместно при обучении.'}, 'en': {'title': 'Open robot agents can match—and surpass—proprietary models', 'desc': 'The paper introduces uni-robot-agent, a framework for training and evaluating open-weight robot-use agents. It reports that Qwen3.8-Flash-Next achieves a RoboDojo Score of 31.39 without privileged inputs, exceeding a published proprietary-model result and performing competitively across 19 real-world tasks. The framework aims to make research on robot-use agents more accessible and support further training. Analysis across models suggests that strong robot use depends on four general capabilities that future training should develop together.'}, 'zh': {'title': '开放权重机器人智能体：以协同能力迈向更强操作', 'desc': '本文提出 uni-robot-agent，这是一个统一的机器人操作智能体框架，支持使用开放权重模型进行评测和进一步训练。无需额外特权输入，现成的 Qwen3.8-Flash-Next 在 RoboDojo 上获得 31.39 分，超过已发布的 GPT-6 Astra-RoboProbe 成绩及许多视觉-语言-动作（VLA）和世界动作模型（WAM）基线。该模型在 19 项真实世界任务上也展现出有竞争力的表现。作者分析不同模型代际、系列和规模后发现，机器人操作依赖四种通用能力，并建议在未来训练中协同发展这些能力。'}}}, {'id': 'https://huggingface.co/papers/2611.02074', 'title': 'SWE-Trail: History-Guided Trajectory Collection for Coding Agent Training', 'url': 'https://huggingface.co/papers/2611.02074', 'abstract': "Abstract SWE-Trail improves trajectory collection for coding agents by using past rollouts to guide exploration without exposing history to the agent, yielding better-trained student models.  Generated by thinkingmachines/Inkling-Small Coding agents solve repository issues through long sequences of exploration, editing, and validation. These trajectories are increasingly used as post-training data, so how they are collected shapes what the trained model learns. A common approach is to sample multiple trajectories independently for each issue and then select or curate them. However, as more trajectories are sampled independently, later trajectories become increasingly redundant, even though earlier trajectories could guide where subsequent collection effort should be spent. A natural way to use this history is to expose it to the coding agent as advice. But training on such trajectories can make the model rely on advice that is unavailable at test time, creating a train-test mismatch. Instead, we argue that history should guide where collection effort is spent, while the coding agent decides what to generate. We introduce SWE-Trail, a trajectory collector that uses earlier trajectories to guide subsequent collection while keeping that history outside the coding agent's context. During a new rollout, SWE-Trail uses history to identify a state where additional collection effort may be useful. There, the coding agent proposes candidate next actions from its ordinary context, and SWE-Trail briefly executes them from the same checkpoint to decide which route continues. We evaluate collection approaches by training student models on the trajectories they produce. For a 124B student initialized from Ling-3.0-flash-base, SWE-Trail improves mean resolution over independent sampling by 2.33 and 1.60 percentage points on SWE-bench Multilingual and SWE-bench Pro, respectively. Without history, the same pipeline produces more resolved trajectories than independent sampling, but improves by only 0.11 points on Multilingual. These results show the value of using history to guide collection without exposing it to the coding agent.", 'score': 33, 'issue_id': 3494, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '776ce2f78b8f3139', 'authors': ['Ziming Li', 'Lu Yu', 'Jiatan Huang', 'Qing Cui', 'Jun Zhou', 'Chuxu Zhang'], 'affiliations': ['Ant Group', 'University of Connecticut'], 'pdf_title_img': 'assets/pdf/title_img/2611.02074.jpg', 'data': {'categories': ['#agents', '#plp', '#data', '#training', '#benchmark'], 'emoji': '🧭', 'ru': {'title': 'История направляет поиск, а агент решает, что генерировать', 'desc': 'В статье представлен SWE-Trail — метод сбора траекторий для coding agents, которые решают задачи в репозиториях. Вместо независимой генерации траекторий история прошлых rollouts используется, чтобы выбирать места, где стоит потратить больше усилий на исследование. При этом сама история скрыта от агента, что устраняет train-test mismatch. На student-модели размером 124B, обученной на таких траекториях, метод дает прирост resolution на SWE-bench Multilingual и SWE-bench Pro по сравнению с независимым сэмплированием.'}, 'en': {'title': 'Let History Guide the Search, Not the Agent', 'desc': 'SWE-Trail improves how training trajectories are collected for coding agents by using earlier rollouts to guide where new exploration should focus. The history stays outside the agent’s context, so the agent proposes actions using only information it would have at test time, avoiding train-test mismatch. SWE-Trail briefly tests candidate actions from the same checkpoint and continues along a promising route. Models trained on its trajectories achieve higher resolution rates on SWE-bench Multilingual and SWE-bench Pro than models trained with independent sampling.'}, 'zh': {'title': '让历史指引采集方向，不让智能体依赖历史建议', 'desc': 'SWE-Trail 是一种用于收集编程智能体执行轨迹的方法，目标是让后续采集少重复、更多样。它利用先前轨迹判断哪些状态值得继续探索，但不会把这些历史信息放进智能体的上下文中，从而避免训练时依赖测试阶段不可用建议所造成的训练—测试不匹配。在有价值的状态，智能体根据普通上下文提出候选动作，SWE-Trail 从同一检查点短暂执行这些动作，再选择后续探索路线。用采集到的轨迹训练模型后，SWE-Trail 相比独立采样，在 SWE-bench Multilingual 和 SWE-bench Pro 上分别提升了 2.33 和 1.60 个百分点的平均问题解决率。'}}}, {'id': 'https://huggingface.co/papers/2611.02102', 'title': 'NorthCUA Technical Report: Turbocharging Computer-Use Agents through Experience at Scale', 'url': 'https://huggingface.co/papers/2611.02102', 'abstract': 'Abstract NorthCUA scales computer-use agents via an experience flywheel, recursive self-improvement, staged learning, and reinforcement learning to achieve state-of-the-art open-source GUI and web interaction results.  Generated by thinkingmachines/Inkling-Small Scaling computer-use agents from individual actions to complex software work requires experience that connects decisions to complete outcomes. We present NorthCUA, an integrated system for turbocharging computer-use agents through experience at scale. Its Experience Flywheel supplies diverse executable tasks to the NorthCUA Harness, which sustains long interactions, records decisions, and checks task outcomes. The Flywheel uses these records to curate verified trajectories. For unsolved tasks, recursive self-improvement evolves reusable skills and preserves verified milestones so later attempts build on earlier progress. Staged Learning combines this experience with grounding data from the Flywheel to develop GUI competence through mid-training and long-horizon supervised fine-tuning. The policy then learns from fresh attempts in the same Harness through joint desktop-web reinforcement learning, closing the loop between experience production and policy improvement. The resulting Nano, Mini, and Pro family achieves state-of-the-art results among open-source models across GUI grounding, desktop execution, and Web interaction under the reported evaluation settings. For more responsive Web workflows, NorthCUA-Ultrafast pairs direct action selection with open-ended generation on pre-RL Nano, offering a measured quality-latency tradeoff. Together, these advances establish NorthCUA as a high-performing model family and a reusable foundation for agents that carry complex software work from intent to completion.', 'score': 30, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'c3e28fb88a899996', 'authors': ['Chaoyun Zhang', 'Bingxuan Li', 'Pinxue Guo', 'Yangfan Gao', 'Zikun Cai', 'Tianci Xie', 'Hui Li', 'Yuqi Huang', 'Yifei Cao', 'Bo Mao', 'Tian Tang', 'Qichang Zheng', 'Tongtong Liu', 'Xiaoxing Wang', 'Jinxiu Liu', 'Lizhi Lin', 'Zhou Shao', 'Maosen Zhou', 'Miao Zheng', 'Shuo Zhang', 'Yangji He', 'Kepeng Lei', 'Ning Zhao', 'Wei Shen', 'Zhenjiang Jin', 'Xinyue Zhang', 'Peng Sun', 'Zhenhua Han', 'Rui Zheng', 'Hang Yan'], 'affiliations': ['NorthCUA'], 'pdf_title_img': 'assets/pdf/title_img/2611.02102.jpg', 'data': {'categories': ['#optimization', '#small_models', '#agents', '#agi', '#data', '#synthetic', '#training', '#rl', '#benchmark'], 'emoji': '🖥️', 'ru': {'title': 'Опыт, который доводит задачи до конца: от действия к результату', 'desc': 'В статье представлена система NorthCUA для масштабирования агентов, которые управляют компьютером через GUI и веб-интерфейсы. Ключевой механизм — Experience Flywheel, который собирает разнообразные исполняемые задачи, фиксирует траектории и отбирает верифицированные примеры для обучения. Для нерешённых задач используется рекурсивное самоулучшение с накоплением переиспользуемых навыков, а обучение проходит в несколько этапов: mid-training, supervised fine-tuning и совместное desktop-web обучение с подкреплением (reinforcement learning). Модели семейства Nano, Mini и Pro показывают лучшие результаты среди открытых LLM и AI-агентов на задачах grounding, выполнения на десктопе и веб-взаимодействия.'}, 'en': {'title': 'Learn from every attempt, then turn complex software tasks into completed work', 'desc': 'NorthCUA improves computer-use agents with a system that gathers experience from tasks, checks whether they succeed, and uses the results to train better agents. For difficult tasks, it reuses verified steps and develops skills so later attempts can build on earlier progress. The agent learns in stages, first from recorded examples and then through reinforcement learning on desktop and web tasks. Its Nano, Mini, and Pro models achieve strong results among open-source agents, while NorthCUA-Ultrafast offers a faster option with a tradeoff in quality.'}, 'zh': {'title': '让每次操作都成为经验，让智能体持续进步', 'desc': '本文提出 NorthCUA，一套通过大规模经验提升电脑操作智能体能力的系统。它利用经验飞轮生成任务、记录操作并验证结果，再将成功轨迹整理为训练数据；对尚未解决的任务，则通过递归式自我改进积累可复用技能和已验证的进展。模型经过分阶段训练后，再通过桌面与网页环境中的强化学习从新尝试中持续学习，形成经验与策略相互促进的循环。NorthCUA 的 Nano、Mini 和 Pro 模型在论文所报告的评测中取得开源模型领先成绩，而 Ultrafast 版本则在响应速度与任务表现之间提供权衡。'}}}, {'id': 'https://huggingface.co/papers/2610.27954', 'title': 'Lost in Recovery: Demystifying Recovery Behavior of Computer-Use Agents via Goal-Oriented Action Replay', 'url': 'https://huggingface.co/papers/2610.27954', 'abstract': "Abstract ReTrace is a framework that evaluates recovery behavior in computer-use agents by formalizing transition-consistent recovery and demonstrating that autonomous model-based recovery improves long-horizon reliability.  Generated by thinkingmachines/Inkling-Small Recent advances in large (vision) language models have enabled computer-use agents that automate digital workflows via fine-grained keyboard and mouse operations. However, such agents remain fragile in long-horizon settings, where errors accumulate and executed actions leave unintended side effects, making the ability to recover from failures critical. Yet, existing remedies remain inadequate: environment resets are infeasible in proprietary settings, action replay is prohibitively expensive over long horizons, and API-based rollback is limited to web environments, leaving model-based recovery largely unexplored. To address this gap, we present ReTrace, a scalable evaluation framework for systematically studying recovery behavior in computer-use agents. We formalize Transition-Consistent Recovery: identical downstream actions from the recovered and target states must yield identical outcomes. We operationalize this criterion through goal-oriented action replay following controlled error injection. Using ReTrace, we present the first systematic study of autonomous, model-based recovery, revealing that (i) ideal recovery can unlock model's latent task completion capabilities, (ii) current computer-use agents fail to exploit their latent recovery capabilities, and (iii) accurate model-based recovery yields measurable end-to-end gains. Together, these findings establish recovery as a fundamental capability for building reliable computer-use agents. Our code and dataset is available at https://github.com/BangProx/ReTRACE.", 'score': 28, 'issue_id': 3493, 'pub_date': '2026-10-20', 'pub_date_card': {'ru': '20 октября', 'en': 'October 20', 'zh': '10月20日'}, 'hash': '0a99e257a0a494b7', 'authors': ['Byeonghun Bang', 'Sangwoo Park', 'Jinheon Baek', 'Kangsan Kim', 'Youngwan Lee', 'Sung Ju Hwang'], 'affiliations': ['ETRI', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.27954.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark'], 'emoji': '🔄', 'ru': {'title': 'Умение восстанавливаться после ошибок — ключ к надёжным AI-агентам', 'desc': 'В статье представлен фреймворк ReTrace для оценки способности computer-use agents, то есть LLM-агентов, управляющих компьютером через клавиатуру и мышь, восстанавливаться после ошибок. Авторы формализуют критерий Transition-Consistent Recovery: одинаковые последующие действия из восстановленного и целевого состояний должны давать одинаковый результат. Оценка проводится через goal-oriented action replay после контролируемого внесения ошибок, что делает возможным систематическое изучение восстановления без сброса среды. Исследование показывает, что идеальное восстановление раскрывает скрытые возможности модели, текущие агенты плохо используют эти способности, а точное model-based восстановление даёт измеримый прирост в длинных задачах.'}, 'en': {'title': 'Recover from mistakes to make computer-use agents reliable', 'desc': 'ReTrace is a framework for testing how well computer-use agents recover after making mistakes. It defines successful recovery as reaching a state where the same next actions produce the same results as they would from the intended state. The framework tests this by injecting errors and replaying actions toward a goal. Experiments show that accurate, model-based recovery improves task completion and long-term reliability, though current agents do not fully use their recovery abilities.'}, 'zh': {'title': '让智能体从错误中恢复，可靠完成长流程任务', 'desc': '本文提出 ReTrace，这是一个用于评估电脑操作智能体如何从错误中恢复的框架。它将“转移一致的恢复”定义为：从恢复后的状态继续执行相同操作，应与从目标状态执行时得到相同结果。研究通过人为注入错误并重放面向任务的操作，系统评估智能体的恢复能力。实验发现，准确的模型驱动恢复能发挥模型原有的任务能力，并提升长流程任务的整体可靠性。'}}}, {'id': 'https://huggingface.co/papers/2611.02897', 'title': 'PhotoGuider: Composition-Aware Cropping and 360^{circ} View Framing with Explainable Photographic Assessments', 'url': 'https://huggingface.co/papers/2611.02897', 'abstract': 'Abstract PhotoGuider selects viewing directions and frames 360° panoramas using shared composition-aware tokens and produces camera-parameter outputs with explanation-conditioned scoring.  Generated by thinkingmachines/Inkling-Small Traditional image cropping assumes the photograph already contains the composition worth keeping, and asks only where to crop. A full 360^{circ} scene offers no such guarantee: the viewing direction in a scene has to be discovered before anything can be framed. We present PhotoGuider, a measure-then-frame method that answers both questions with compact learned scorers over one shared set of composition-aware features. The designed features are extracted using foundation and task-specific vision models and structured into four photographic tokens: Subject, Composition, Aesthetics, and Integrity. Our MLLM explainer is fine-tuned to generate composition-related explanations conditioned on images and measured token assessments. To our knowledge, PhotoGuider is the first method to combine explicit composition-based direction selection in 360^{circ} panoramas with refined framing, camera-parameter output for native re-rendering, and measurement-conditioned explanations. On two standard 2D cropping benchmarks, PhotoGuider achieves the highest average mIoU performance against ground-truth crops. In a blind ranking study, 120 participants ranked three cropping methods over 100 panoramic scenes from the public Poly Haven HDRI library, placing our framings first in 53.2% of cases, against 27.3% and 19.5% for two strong alternatives. Project page: https://ntuneillee.github.io/research/photoguider/', 'score': 26, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '5689eaf2d4ba6eaf', 'authors': ['Yuan-Kang Lee', 'Kuan-Lin Chen', 'Chia-Che Chang', 'Yu-Lun Liu'], 'affiliations': ['MediaTek Inc.', 'National Taiwan University', 'National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02897.jpg', 'data': {'categories': ['#architecture', '#alignment', '#multimodal', '#cv', '#interpretability', '#benchmark'], 'emoji': '📸', 'ru': {'title': 'Сначала найди взгляд, потом кадрируй: композиция в 360°', 'desc': 'PhotoGuider — это метод автоматического кадрирования 360°-панорам, который сначала находит наиболее удачное направление взгляда, а затем подбирает кадр. Он использует компактные обученные модули оценки над общим набором признаков, учитывающих композицию, которые разбиты на четыре токена: Subject, Composition, Aesthetics и Integrity. Для генерации объяснений применяется дообученная MLLM, которая опирается на изображения и измеренные оценки токенов. По результатам на двух стандартных бенчмарках и слепом исследовании с участием пользователей метод показывает лучшие результаты по mIoU и предпочтения людей.'}, 'en': {'title': 'Measure the Scene, Then Frame the View', 'desc': 'PhotoGuider finds a good viewing direction in a 360° panorama and then frames the scene, rather than merely cropping an existing image. It measures each view using four learned composition-aware tokens: Subject, Composition, Aesthetics, and Integrity. Compact scorers use these shared features to select directions and predict camera parameters, while a fine-tuned multimodal language model explains its assessments. The method achieves strong results on standard cropping benchmarks, and people in a study preferred its framings over two alternatives in most cases.'}, 'zh': {'title': '先寻得好视角，再构成好画面', 'desc': 'PhotoGuider 能从 360 度全景图中选择合适的观看方向，并进一步确定画面取景范围。它使用一组共享的构图特征，并将这些特征归纳为主体、构图、美感和画面完整性四类指标，再通过学习得到的评分器选择方向和取景。系统还能输出相机参数，用于重新渲染画面，并根据图像和指标生成构图解释。在两个二维裁剪基准测试中，它的平均 mIoU 最高；在全景图用户评测中，参与者也最常选中它生成的画面。'}}}, {'id': 'https://huggingface.co/papers/2611.03602', 'title': 'Reviso: Not All Visual Evidence Deserves Equal Attention in Video Captioning', 'url': 'https://huggingface.co/papers/2611.03602', 'abstract': 'Abstract Reviso is an agentic video captioning framework that learns to prioritize key visual evidence through hierarchical planning and active perception, improving caption quality and downstream video understanding.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) can generate detailed video captions, yet they may overemphasize minor details while overlooking essential context and key events. We argue that not all visual evidence deserves equal attention, as the importance of visual information depends on the content of each video. Motivated by this observation, we propose Reviso, an agentic video captioning framework that learns what to observe and how to gather relevant visual evidence. From a low-frame-rate global preview, Reviso constructs a hierarchical Context--Focus--Points (CFP) observation plan that identifies the video context, prioritizes key aspects, and defines concrete observation targets and corresponding tools. Guided by this plan, Reviso performs goal-directed active perception by selectively revisiting temporal segments and combining tools for fine-grained inspection. It interprets the acquired evidence, updates its plan as needed, and integrates global and local information to generate the final caption. To learn this observation strategy, we develop a verification-guided pipeline that constructs high-quality training trajectories through factual verification and teacher-guided refinement. We further train Reviso using Group Relative Policy Optimization (GRPO), incorporating a key-fact reward for caption quality, a Plan Alignment Reward (PAR) for identifying important observation targets, and an Unproductive Tool-Call Penalty (UTCP) that adjusts observation-cost penalties based on caption quality. Experiments across four video captioning benchmarks show that Reviso outperforms the evaluated open-source baselines, while its generated captions better support downstream video question answering. These findings highlight the effectiveness and potential of priority-guided active observation for video captioning.', 'score': 25, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'fce8d19559a69794', 'authors': ['Tengfei Liu', 'Yang Shi', 'Yuran Wang', 'Yuqi Tang', 'Yizhuo Jia', 'Zhuoran Zhang', 'Qixun Wang', 'Shujie Li', 'Xuanyu Zhu', 'Xinyu Liu', 'Minghui Guo', 'Shixuan Liu', 'Haotian Wang', 'Yuanxing Zhang', 'Pengfei Wan'], 'affiliations': ['FDU', 'HKU', 'HKUST', 'HKUST(GZ)', 'KlingAI Research', 'NUS', 'PKU', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2611.03602.jpg', 'data': {'categories': ['#optimization', '#video', '#multimodal', '#agents', '#training', '#interpretability', '#rl', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Смотри не всё подряд, а то, что важно: приоритетное активное наблюдение для описания видео', 'desc': 'В статье представлен Reviso — агентный фреймворк для описания видео, который учится определять, какие визуальные доказательства важнее всего. Сначала по низкочастотному глобальному обзору строится иерархический план Context–Focus–Points, после чего модель целенаправленно переосматривает нужные временные сегменты с помощью инструментов. Обучение выполняется на верифицированных траекториях с использованием GRPO и наград за качество описания, соответствие плану (PAR) и штрафа за непродуктивные вызовы инструментов (UTCP). Эксперименты на четырёх бенчмарках показывают превосходство над открытыми baseline-моделями и лучшую поддержку downstream-задачи video QA.'}, 'en': {'title': 'Look Where It Matters: Plan and Inspect for Better Video Captions', 'desc': 'Reviso is an agentic video captioning framework that learns to focus on the most important visual evidence. It first creates a hierarchical Context–Focus–Points plan from a low-frame-rate preview, then uses active perception to inspect selected video segments with relevant tools. The system is trained with verified examples and Group Relative Policy Optimization (GRPO), using rewards for key facts and good observation plans, plus penalties for unproductive tool calls. Across four benchmarks, Reviso outperforms the tested open-source baselines and produces captions that better support video question answering.'}, 'zh': {'title': '先看全局、再抓重点：让视频描述更准确', 'desc': 'Reviso 是一种智能体式视频描述框架，旨在让模型优先关注重要视觉证据，而不是被次要细节分散注意力。它先用低帧率预览了解视频整体内容，再制定“上下文—焦点—观察点”（CFP）分层计划，并通过主动感知选择性检查关键片段和细节。研究者使用事实核验与教师指导构造训练轨迹，并以组相对策略优化（GRPO）训练模型，同时奖励关键事实和有效规划、惩罚无效工具调用。实验表明，Reviso 在四个视频描述基准上优于所评估的开源基线，其描述也更有助于下游视频问答。'}}}, {'id': 'https://huggingface.co/papers/2611.00172', 'title': 'From Fragmentation to Fusion: A Survey and Roadmap for Omnimodal Embeddings', 'url': 'https://huggingface.co/papers/2611.00172', 'abstract': 'Abstract Embedding research across modalities is converging toward shared principles via contrastive learning and Transformers, and a framework of coverage, comparability, and compositionality is proposed to unify it through transformation, alignment, and joint embedding.  Generated by thinkingmachines/Inkling-Small Embedding models underpin virtually every modern AI system, from search engines to recommendation systems. Despite shared mathematical foundations, research on embedding models remains fragmented by modality: the communities develop largely in isolation, seldom exchanging insights. We argue that this fragmentation obscures a deeper convergence. Driven by contrastive learning, Transformer architectures, and a granularity shift, embedding research across modalities is converging toward a common set of principles, even as modality-specific challenges remain underexplored. To reason across this convergence without conflating it, we propose a framework of three progressively harder capabilities: coverage, comparability, and compositionality. Three paths toward unification satisfy these in turn: transformation broadens coverage, alignment enables comparability, and joint embedding, the terminus we advocate, aims at compositionality. This position paper traces the resulting evolution, providing the first unified, cross-cutting treatment of omnimodal embedding research.', 'score': 21, 'issue_id': 3492, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'f7264f5c0dd3dcca', 'authors': ['Ziyin Zhang', 'Yuyu Guo', 'Ying Zhang', 'Siqiao Xue', 'Zihan Liao', 'Jin Qin', 'Wenjie Yang', 'Siyuan Yang', 'Shijie Li', 'Cheng Chen', 'Hao Wu', 'Zhaoyang Zhu', 'Ruipeng Li', 'Zhaokun Jiang', 'Lei Lei', 'Rui Wang', 'Hang Yu', 'Rui Wang'], 'affiliations': ['Ant Group', 'Australian National University', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.00172.jpg', 'data': {'categories': ['#multimodal', '#survey'], 'emoji': '🧩', 'ru': {'title': 'Единые эмбеддинги для всех модальностей: от разрозненности к общему пространству смыслов', 'desc': 'Статья утверждает, что исследования эмбеддингов для разных модальностей (текст, изображения, аудио и др.) разрозненны, но на самом деле сходятся к общим принципам благодаря contrastive learning, архитектурам Transformer и сдвигу к более тонкой гранулярности. Авторы предлагают три последовательных возможности: coverage, comparability и compositionality. Пути к объединению: transformation расширяет покрытие, alignment обеспечивает сравнимость, а joint embedding нацелен на compositionality. Работа представляет первый единый обзор omnimodal embedding исследований.'}, 'en': {'title': 'From Separate Modalities to Composable Shared Embeddings', 'desc': 'The paper argues that embedding research for different modalities, such as text, images, and audio, is converging around contrastive learning and Transformer architectures. It proposes three capabilities for comparing progress: coverage, which represents more kinds of data; comparability, which aligns representations across modalities; and compositionality, which combines them meaningfully. The authors describe transformation and alignment as steps toward these capabilities, with joint embedding as the goal. This framework offers a unified way to study multimodal embedding while recognizing that each modality still has distinct challenges.'}, 'zh': {'title': '从变换到联合嵌入，让不同模态的表示真正组合起来', 'desc': '嵌入模型是搜索、推荐等现代人工智能系统的基础，但不同模态的研究长期较为分散。论文指出，对比学习、Transformer 架构和粒度变化正推动各模态的嵌入研究走向共同原则。作者提出覆盖性、可比较性和组合性三个逐步提升的能力，并分别对应变换、对齐和联合嵌入三条统一路径。论文主张以联合嵌入为目标，让不同模态的表示不仅能够相互比较，还能组合起来表达信息。'}}}, {'id': 'https://huggingface.co/papers/2611.01815', 'title': 'When Does Latent Prediction Error Support Physical Surprise Claims in Video World Models?', 'url': 'https://huggingface.co/papers/2611.01815', 'abstract': "Abstract The study evaluates frozen video representations to show that prediction errors reflect appearance and motion rather than reliably measuring physical surprise.  Generated by thinkingmachines/Inkling-Small Prediction errors from video world models are often treated as physical surprise, but they can also reflect appearance, static content, motion, or ordinary prediction difficulty. We present an evaluation framework that separates what frozen representations contain, how they organize appearance and physical differences, and what changes a model's own prediction error. On IntPhys2, a benchmark of physically possible and impossible events, we compare representations from latent prediction, masked pixel reconstruction, and simple visual statistics. Appearance remains easy to decode, while V-JEPA2 exposes modest information about whether events are possible or impossible. Looking at the latent geometry, appearance changes become smaller compared with differences between videos, their directions line up more consistently across scenes, and their overlap with physical changes decreases in deeper layers. Across action-conditioned models, incorrect actions raise prediction error, while appearance changes also produce substantial responses. In Physion++ video clips, repeating a single frame can produce higher error than the original clip, while changing color throughout the clip can lower it. Using Kubric, a simulation and rendering framework, we find that impossible events can produce lower error than possible events. A fixed error threshold also incorrectly flags many possible events as impossible. A model can therefore represent physical information and respond to incorrect actions without its native prediction error reliably measuring physical surprise.", 'score': 19, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '11b1462d24d2a2bd', 'authors': ['Anton Hristov', 'Aleksandar Slavov', 'Vasil Vasilev'], 'affiliations': ['Baba Tonka High School of Mathematics', 'Technology School Electronic Systems (TUES)'], 'pdf_title_img': 'assets/pdf/title_img/2611.01815.jpg', 'data': {'categories': ['#data', '#video', '#interpretability', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Ошибка предсказания видео-модели — не всегда признак физической невозможности', 'desc': 'Статья оценивает замороженные (frozen) представления видео-моделей мира, чтобы проверить, отражают ли ошибки предсказания физическую неожиданность. Авторы сравнивают латентные предсказательные модели (например, V-JEPA2), реконструкцию замаскированных пикселей и простые визуальные статистики на бенчмарке IntPhys2 и других датасетах. Результаты показывают, что ошибка предсказания в основном чувствительна к внешнему виду, движению и сложности самого предсказания, а не к физической невозможности события. Поэтому использовать ошибку предсказания как надёжный индикатор физического сюрприза без дополнительной проверки нельзя.'}, 'en': {'title': 'Prediction Error Is Not the Same as Physical Surprise', 'desc': 'This study tests whether video world models’ prediction errors reliably indicate physical surprise, using benchmarks and simulated videos. Frozen representations encode appearance strongly, while V-JEPA2 contains some information about whether events are physically possible or impossible. In deeper layers, appearance differences become less prominent relative to video differences, but changes in appearance still affect prediction errors substantially. Because errors can be higher for possible events than impossible ones, prediction error alone is not a dependable measure of physical surprise.'}, 'zh': {'title': '预测误差不等于物理意外', 'desc': '本文评估冻结的视频表征，检验模型预测误差能否可靠表示物理意外。研究发现，表征容易编码外观信息，而 V-JEPA2 也包含一些关于事件物理可能性的信息，但物理差异与外观差异在不同层中的组织方式并不相同。对动作条件模型而言，错误动作会提高预测误差，但改变外观也可能显著影响误差；有时重复单帧或改变视频颜色还会造成与直觉相反的结果。模拟实验进一步表明，不可能事件的误差可能低于可能事件，因此模型虽能表征物理信息，原生预测误差却不能可靠地衡量物理意外。'}}}, {'id': 'https://huggingface.co/papers/2611.01484', 'title': 'CrossSWE: Benchmarking Cross-Repository Joint Development for Coding Agents', 'url': 'https://huggingface.co/papers/2611.01484', 'abstract': 'Abstract CrossSWE introduces a multi-repository benchmark showing that current LLMs struggle with cross-repository consistency during joint software development.  Generated by thinkingmachines/Inkling-Small As coding agents achieve increasingly high success rates on software engineering benchmarks, recent efforts have sought to increase task complexity through longer horizons and more extensive code modifications. However, real-world software development often spans multiple interdependent repositories, introducing additional challenges in dependency reasoning, change propagation, and interface consistency. Rather than further increasing complexity within individual repositories, we introduce CrossSWE, a benchmark for cross-repository joint development comprising 171 real-world instances spanning 165 repositories, 20 technical domains, and 13 programming languages. CrossSWE verifies the necessity of coordinated changes by testing whether partial repository modifications are insufficient to achieve the intended behavior. Our evaluation of five LLMs reveals substantial challenges, with the strongest model, GPT-6.1 Sol, achieving only 58.48% Pass@1. Furthermore, cross-repository inconsistencies emerge as the most prevalent failure mode (44.2%), highlighting the difficulty of maintaining consistency across interdependent repositories.', 'score': 19, 'issue_id': 3493, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'f5b0c082a633bcbd', 'authors': ['Silin Chen', 'Yuling Shi', 'Heng Lian', 'Zihan Zhang', 'Xiaodong Gu', 'Haotian Lin', 'Zhensu Sun'], 'affiliations': ['Shanghai Jiao Tong University', 'Singapore Management University', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2611.01484.jpg', 'data': {'categories': ['#agents', '#graphs', '#plp', '#benchmark'], 'emoji': '🧩', 'ru': {'title': 'Модели LLM пока не умеют согласовывать изменения между репозиториями', 'desc': 'Статья представляет CrossSWE — новый бенчмарк для оценки LLM в задачах совместной разработки сразу нескольких взаимосвязанных репозиториев. Он включает 171 реальный пример из 165 репозиториев, охватывает 20 технических доменов и 13 языков программирования. Проверка корректности основана на том, что частичные изменения в одном репозитории не позволяют достичь нужного поведения системы. Результаты показывают, что даже лучшая модель решает лишь около 58% задач (Pass@1), а самой частой ошибкой оказывается несогласованность между репозиториями (44,2%).'}, 'en': {'title': 'Cross-Repository Coding: Keeping Every Change in Sync', 'desc': 'CrossSWE is a benchmark for testing whether large language models can make coordinated software changes across multiple related repositories. It contains 171 real-world tasks covering 165 repositories, 20 technical domains, and 13 programming languages. The benchmark checks that changes across repositories work together, since modifying only part of a task is not enough to produce the intended behavior. Five models struggled, and the strongest achieved 58.48% Pass@1, with inconsistent changes across repositories the most common failure.'}, 'zh': {'title': '跨仓库协作开发，难在保持一致', 'desc': '这篇论文提出了 CrossSWE，一个用于评测大型语言模型跨多个代码仓库协同开发能力的基准。它包含 171 个真实任务，涉及 165 个仓库、20 个技术领域和 13 种编程语言，并检验是否需要协调修改多个仓库才能实现目标功能。对五种大语言模型的评测显示，表现最好的模型 Pass@1 也只有 58.48%。最常见的失败是不同仓库之间出现不一致，说明模型在依赖关系推理、变更传播和接口一致性方面仍有困难。'}}}, {'id': 'https://huggingface.co/papers/2611.03424', 'title': 'IdeaTaste: Do LLMs Share the Research Taste of Human Researchers?', 'url': 'https://huggingface.co/papers/2611.03424', 'abstract': 'Abstract IdeaTaste benchmarks LLM research proposals against future publications, revealing that AI agents match human communities in broad directions but fall far behind in concrete approaches and expected success.  Generated by thinkingmachines/Inkling-Small Research taste, the judgment of what to read, which problems to pursue, and which methods to try, increasingly shapes the work of AI scientists, yet it remains far less understood than their ability to execute research. We introduce IdeaTaste, a benchmark that scores an LLM by how closely the research proposals it writes from a literature snapshot frozen at 2025 match the work the same communities published in 2026. Our experiments span six contemporary language models and four research areas from established to emerging fields, covering more than 90{,}000 proposals in total. LLM agents fall well short of human communities in both the literature they cite and the ideas they state, reaching about 26\\% of the human level on citation matching and only 18\\% on idea matching. Their populations can cite as diversely as a community and take up its tasks and methods, yet rarely arrive at the concrete approaches and research plans it pursues. Neither richer field context nor larger populations substantially close this gap. In blinded expert review, AI proposals trail the 2026 papers least in presentation and most in expected success, echoing their gap in concrete approaches, and those whose ideas no human paper shares fare worst, suggesting weaker directions rather than overlooked opportunities. These results indicate that the main bottleneck in AI research taste lies less in finding the directions a community works on than in turning them into the concrete approaches it goes on to pursue. We release IdeaTaste as an open, continuously updated leaderboard (https://cxcscmu.github.io/IdeaTaste) that benchmarks contemporary AI proposals against future publication cycles.', 'score': 16, 'issue_id': 3494, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '29673698643d3195', 'authors': ['Shanshan Zhong', 'Chen Xu', 'Jingjie Ning', 'Zhengzhong Liu', 'Aviral Kumar', 'Chenyan Xiong'], 'affiliations': ['Carnegie Mellon University', 'Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2611.03424.jpg', 'data': {'categories': ['#science', '#survey', '#benchmark', '#open_source'], 'emoji': '🧭', 'ru': {'title': 'ИИ видит направления, но не умеет выбрать конкретный путь', 'desc': 'Авторы представляют IdeaTaste — бенчмарк, который оценивает, насколько исследовательские предложения, написанные LLM-агентами на основе литературы до 2025 года, совпадают с реальными работами сообществ в 2026 году. Эксперименты охватывают шесть современных языковых моделей, четыре области исследований и более 90 тысяч предложений. Агенты заметно уступают людям: по совпадению цитирований они достигают около 26% human-уровня, а по совпадению идей — лишь 18%, хотя широта тематик у них сопоставима с сообществами. Экспертная оценка показала, что главный барьер — не в поиске направлений, а в переходе от них к конкретным подходам и планам исследований, а бенчмарк опубликован как открытый лидерборд.'}, 'en': {'title': 'AI Finds the Research Direction, but Misses the Concrete Plan', 'desc': 'IdeaTaste evaluates how well large language models (LLMs) propose research that matches what human communities publish later. It compares proposals made from literature available in 2025 with papers published in 2026 across four fields, using citation and idea matching. Models can identify broad research directions and methods, but perform much worse at proposing the specific approaches humans pursue and at predicting which ideas will succeed. The results suggest that AI research taste is limited not mainly by choosing topics, but by turning them into concrete, promising research plans.'}, 'zh': {'title': 'AI 能找到研究方向，却难提出真正可行的具体方案', 'desc': '论文提出 IdeaTaste 基准，用来评估大语言模型能否根据截至 2025 年的文献提出与研究社区在 2026 年实际发表的工作相近的研究方案。实验涵盖六种语言模型、四个研究领域和超过 9 万份方案，发现模型在引用匹配方面约达到人类社区水平的 26%，在研究想法匹配方面仅为 18%。模型生成的方案虽然能跟上社区关注的研究方向和方法，但往往缺少人类后来采用的具体方法与研究计划；增加领域背景或模型数量也未能明显缩小差距。专家盲评还显示，AI 方案在预期成功率上的差距最大，说明当前瓶颈不是识别研究方向，而是把方向转化为可行且有前景的具体方案。'}}}, {'id': 'https://huggingface.co/papers/2611.03344', 'title': 'FLAMIA: FLAsh MIcroscaling Attention for Fast and Causally Safe Training on Blackwell', 'url': 'https://huggingface.co/papers/2611.03344', 'abstract': 'Abstract FLAMIA accelerates Transformer attention on NVIDIA Blackwell GPUs via MXFP8 and mixed-precision kernels that reduce quantization overhead, prevent causal leakage, and support variable-length packed documents.  Generated by thinkingmachines/Inkling-Small Attention remains a substantial computational cost in Transformer training, particularly at long context lengths. NVIDIA Blackwell GPUs provide high-throughput low-precision matrix multiplication, but exploiting it in attention requires addressing quantization overhead, causal information leakage through shared scales, and numerical inconsistencies between the forward and backward passes. We present FLAMIA, a family of attention kernels for Blackwell with MXFP8 and mixed NVFP4/FP8 training paths. Our design combines token-block scaling that reuses quantized operands across matrix orientations, targeted safeguards against scale-induced leakage, and consistent forward and backward computations. Fused quantization and architecture-specific kernel optimizations reduce overhead, while document-local scaling and workload-aware scheduling support variable-length documents directly in packed layouts without repacking. Across various causal packed-document workloads, the MXFP8 path accelerates the combined forward and backward attention call, including quantization, by factors of 1.10--1.40times on B200 and 1.06--1.42times on B300 relative to the fastest evaluated baseline for each workload. We validate training stability and quality preservation on pretraining Llama-style models. These results show how jointly designing quantization, training numerics, and document scheduling translates low-bit hardware throughput into practical attention acceleration.', 'score': 15, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'dcee6e9fcf72789b', 'pdf_title_img': 'assets/pdf/title_img/2611.03344.jpg', 'data': {'categories': ['#optimization', '#training', '#inference', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Низкоточная квантизация внимания ускоряет Transformer на Blackwell без потери качества', 'desc': 'В статье представлен FLAMIA — набор ядер внимания (attention kernels) для NVIDIA Blackwell GPU, которые ускоряют обучение Transformer-моделей за счёт низкоточных форматов MXFP8 и смешанной точности NVFP4/FP8. Авторы решают три проблемы: накладные расходы на квантизацию, утечку каузальной информации через общие scale-коэффициенты и численные расхождения между forward и backward проходами. Для этого используются блочное масштабирование по токенам, fused-квантизация и поддержка документов переменной длины в packed-формате без перепаковки. Эксперименты на causal packed-документах показывают ускорение attention на 1.06–1.42 раза на B200 и B300, а обучение Llama-подобных моделей остаётся стабильным и качественным.'}, 'en': {'title': 'Low-Precision Attention, Faster and Leakage-Safe', 'desc': 'FLAMIA is a family of attention kernels designed to speed up Transformer training on NVIDIA Blackwell GPUs. It uses MXFP8 and mixed NVFP4/FP8 precision, with fused quantization and kernel optimizations to reduce overhead while keeping forward and backward computations consistent. Its scaling safeguards prevent causal information leakage, and document-local scaling supports variable-length packed documents without repacking. In tests, FLAMIA’s MXFP8 path made forward and backward attention 1.10–1.40× faster on B200 and 1.06–1.42× faster on B300, while preserving training stability and model quality.'}, 'zh': {'title': '让低精度硬件真正加速注意力：更快训练，稳定不泄漏', 'desc': 'FLAMIA 是一组面向 NVIDIA Blackwell GPU 的注意力计算内核，使用 MXFP8 及混合 NVFP4/FP8 精度来加速 Transformer 训练。它通过复用量化后的数据、融合量化操作并优化内核，降低低精度计算的额外开销，同时防止因共享缩放因子导致的因果信息泄漏，并确保前向与反向计算保持一致。该方法还能在不重新打包数据的情况下处理长度不同的文档，并针对文档分别缩放和安排计算。在多种因果打包文档任务中，MXFP8 路径比测试中的最快基线快 1.10 至 1.40 倍（B200）或 1.06 至 1.42 倍（B300），且 Llama 类模型实验显示训练稳定、质量得以保留。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2611.03092', 'title': 'Avatar Intelligence: Amplifying Human Agency Through Persistent Personal Agents', 'url': 'https://huggingface.co/papers/2611.03092', 'abstract': "Abstract  Personal AI agents are increasingly capable of handling long-horizon tasks across applications, yet users often need to invest substantial effort in specifying goals, resolving ambiguity, and verifying outcomes. We argue that progress should be measured by how effectively agents amplify human agency: enabling people to pursue their goals with less routine supervision while retaining control over consequential decisions. We advocate Avatar Intelligence, a paradigm of persistent personal agents that represent users' goals, values, and constraints through sustained decision delegation across contexts and time. We describe a maturity roadmap from human-directed execution to autonomous operation within delegated domains, and introduce the Agentic Oversight Index (AOI) as a framework for evaluating delivered value against agent-side operational cost and human oversight burden. We identify three core research challenges: identity-continuous personalization that carries user preferences across tasks, user-situated evolution through Rehearsal Engineering, and safety mechanisms that combine technical control with accountability and recourse. These directions define a research agenda for reliable decision delegation to personal agents across tasks and over time.", 'score': 15, 'issue_id': 3493, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '5938e42f59a40526', 'authors': ['Zheng Wu', 'Xinbei Ma', 'Yao Yao', 'Zhaoyuan Huang', 'Haowen Hu', 'Yijie Lu', 'Taolei Wang', 'Yifei Yang', 'Wuyue Xiong', 'Pengzhou Cheng', 'Zhuosheng Zhang'], 'affiliations': ['National University of Singapore', 'Shanghai Jiao Tong University', 'Shanghai University'], 'pdf_title_img': 'assets/pdf/title_img/2611.03092.jpg', 'data': {'categories': ['#ethics', '#alignment', '#agents', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Агент, усиливающий человека, а не заменяющий его', 'desc': 'Статья описывает парадигму Avatar Intelligence, в которой персональные AI-агенты, в том числе на базе LLM, долговременно представляют цели, ценности и ограничения пользователя через делегирование решений. Авторы предлагают дорожную карту зрелости агентов: от исполнения под управлением человека до автономной работы в делегированных доменах. Для оценки ценности вводится Agentic Oversight Index (AOI), который сопоставляет полученную пользу с операционными затратами агента и нагрузкой на человеческий надзор. Выделены три ключевых исследовательских задачи: персонализация с сохранением идентичности, эволюция под пользователя через Rehearsal Engineering и механизмы безопасности, сочетающие технический контроль с подотчетностью и возможностью исправления.'}, 'en': {'title': 'Personal Agents That Act on Your Behalf—Without Taking Away Your Control', 'desc': 'The paper proposes Avatar Intelligence: persistent personal AI agents that learn and act in line with a user’s goals, values, and constraints across tasks and over time. It outlines a path from agents that follow direct instructions to agents that operate independently within domains the user has delegated. The Agentic Oversight Index (AOI) evaluates the value agents deliver in relation to their operating costs and the effort people spend supervising them. The authors highlight three research needs: personalization that preserves user preferences, user-centered agent improvement through Rehearsal Engineering, and safety systems that provide both technical control and accountability.'}, 'zh': {'title': '让个人智能体可靠代办，让人少操心、仍掌握关键决策', 'desc': '本文提出“化身智能”范式：持久化的个人智能体能够跨任务、跨情境代表用户的目标、价值观与约束。作者认为，评估智能体进步应关注它能否减少日常监督、增强人的自主能力，同时让用户保留对重大决策的控制权。文章提出从人类指挥执行到在授权范围内自主运行的成熟路线，并引入智能体监督指数（AOI），衡量智能体带来的价值、运行成本与人的监督负担。研究重点包括跨任务保持偏好的连续个性化、通过“排练工程”贴合用户情境地演进，以及结合技术控制、问责与补救机制的安全保障。'}}}, {'id': 'https://huggingface.co/papers/2610.39419', 'title': 'Diagnosing the Reference Gap: What Visual Scaffolds Can and Cannot Fix in Multimodal Reasoning', 'url': 'https://huggingface.co/papers/2610.39419', 'abstract': 'Abstract Multimodal language models fail at multi-step visual reasoning due to a reference gap rather than perception, and task-matched external references like numbering significantly improve accuracy without training.  Generated by thinkingmachines/Inkling-Small Multimodal large language models can recognize visual content yet struggle to reason reliably over it across multiple steps. In counting, a model may see all objects but lose track of which ones it has counted. We argue that such failures, commonly attributed to perception, reveal a reference gap: the failure to bind language to the relevant visual entities, regions, or locations. Motivated by the theory of visual routines, we test whether external references such as numbering can narrow this gap. We introduce ReGap-Bench, a paired b
