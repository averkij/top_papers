    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.39497', 'title': 'Does Scaling Toward AGI Depend on What System-1 Lets System-2 Execute?', 'url': 'https://huggingface.co/papers/2610.39497', 'abstract': "Abstract Co-designing a resource-heavy reasoning system with a lightweight predictive evaluator can reduce execution costs by filtering interactions, with efficiency governed by the density of useful interactions.  Generated by thinkingmachines/Inkling-Small Progress toward artificial general intelligence (AGI) has largely relied on scaling a resource-intensive executive, System-2, through larger models, more data and compute, longer reasoning, and more agents. We ask whether the next stage may come instead from co-designing it with System-1, a lightweight, semantically aware predictor that evaluates candidate interactions before execution, so that System-2 acts only on those worth their cost. Our answer is a qualified yes. We study conditional interaction, a predict--gate--execute--update loop: System-1 estimates each candidate's utility, System-2 executes those admitted by an adaptive threshold, and the outcomes update System-1. The loop spans training, test-time reasoning, adaptive decision-making, and agentic tool use, with utility and cost defined by the application. Under ideal screening and equal execution costs, execution compute falls by a factor approaching 1/ρ_u, where ρ_u is the density of utility-relevant interactions (cost-weighted when costs differ); prediction errors, exploration, and distribution shift reduce the saving. We bound selection regret by predictor error and the utility margin. These results motivate our central hypothesis: ρ_u is a measurable coordinate of scaling efficiency and makes informative compute a better description of scaling than total compute.", 'score': 46, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '7f670121b86eb8a7', 'authors': ['Qi Wang', 'Yun Qu', 'Lizhou Cai', 'Heming Zou', 'Haoang Chi', 'Yiqin Lv', 'Xiang Li', 'Haiyan Feng', 'Mengyu Ge', 'Yize Geng', 'Yuhang Jiang', 'Yixiu Mao', 'Xiangyang Ji'], 'affiliations': ['Department of Automation, Tsinghua University, Beijing, China', 'Department of Computer Science, Tsinghua University, Beijing, China', 'THU-IDM'], 'pdf_title_img': 'assets/pdf/title_img/2610.39497.jpg', 'data': {'categories': ['#reasoning', '#training', '#agents', '#agi', '#optimization', '#math', '#inference'], 'emoji': '🧠', 'ru': {'title': 'Считать не всё подряд: умный отбор вместо грубой мощности', 'desc': 'Статья предлагает совместно проектировать тяжёлую систему рассуждений System-2 и лёгкий предсказатель System-1, который оценивает кандидатов на взаимодействие до их выполнения. Петля predict–gate–execute–update пропускает к System-2 только те взаимодействия, полезность которых превышает адаптивный порог, а результаты обновляют предсказатель. Теоретически показано, что вычислительные затраты падают примерно в 1/ρ_u раз, где ρ_u — плотность полезных взаимодействий, а ошибки предсказания и исследование снижают эффект, при этом регрет ограничен ошибкой предсказателя и полезным запасом. Авторы утверждают, что ρ_u можно измерять и использовать как показатель эффективности масштабирования, полезного для AGI, вместо простого роста общего объёма вычислений.'}, 'en': {'title': 'Spend Compute Only on Useful Interactions', 'desc': 'The paper proposes pairing a powerful but expensive System-2 with a lightweight System-1 predictor. System-1 estimates the utility of candidate actions, and an adaptive threshold decides which ones System-2 should execute. This predict–gate–execute–update loop can reduce compute, especially when useful interactions are rare, though prediction errors and changing data can lessen the savings. The authors argue that the density of useful interactions helps measure scaling efficiency and that informative compute may be more meaningful than total compute.'}, 'zh': {'title': '先预测再执行，让每一份计算都更有用', 'desc': '论文提出将轻量级的 System-1 预测器与资源密集型的 System-2 推理器协同设计，先评估候选交互的价值，再决定是否执行。该方法采用“预测—门控—执行—更新”循环：System-1 估计效用，System-2 按自适应阈值处理获准的交互，并利用执行结果更新预测器。理想筛选下，计算开销可随有用交互密度降低而显著减少；但预测误差、探索需求和分布偏移会削弱节省效果，选择遗憾则受预测误差和效用差距约束。作者据此提出，有用交互密度是衡量扩展效率的重要指标，相比总计算量，“信息性计算”更能描述系统的扩展能力。'}}}, {'id': 'https://huggingface.co/papers/2610.22740', 'title': 'R^2Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization Loop', 'url': 'https://huggingface.co/papers/2610.22740', 'abstract': "Abstract R²Orch uses recursive self-play with learnable task selection and skill withdrawal to train orchestrators without hand-designed curricula, improving performance across reasoning and interactive tasks.  Generated by thinkingmachines/Inkling-Small In recent years, agentic orchestration has been widely applied to solve complex human tasks. However, existing orchestration learning still faces key challenges, including hand-designed curricula, advantage collapse when a task's rollouts all reach the same outcome, and unreliable evaluation signals that judge each skill by one noisy score. To address these challenges, we propose R^2Orch, a new paradigm of Recursive Self-Play Orchestration: an inner loop of self-play that improves the orchestrator on self-chosen tasks, and an outer loop that improves how the inner loop improves. To support this paradigm, we introduce Recursive Learnability, a training objective that rewards a Proposer for choosing tasks whose rollouts keep reaching different outcomes as skills are withdrawn. Built on this objective, we further propose Skill Withdrawal, in which the outer loop withdraws each skill once a controlled evaluation within self-play shows that the orchestrator performs as well without it. Moreover, the two loops form one cycle: failures are distilled into skills, skills into parameters, and withdrawals lead the Proposer to new failures, so the orchestrator moves toward zero-skill deployment. Experimental results on twelve datasets show that R^2Orch consistently outperforms baselines across question answering, math, code, and interactive tasks. Our code is available at https://github.com/beita6969/R2Orch.", 'score': 40, 'issue_id': 3489, 'pub_date': '2026-10-22', 'pub_date_card': {'ru': '22 октября', 'en': 'October 22', 'zh': '10月22日'}, 'hash': '50127ad3cde9823d', 'authors': ['Mingda Zhang', 'Yun Huang', 'Qiang Huang', 'Yanjin Li', 'Rui Qian', 'Qichao Zhao', 'Tiesunlong Shen', 'Na Zhao', 'Jian Wang', 'Xiaoying Tang'], 'affiliations': ['Fudan University, China', 'National University of Singapore, Singapore', 'The Chinese University of Hong Kong, Shenzhen, China', 'Tsinghua University, China', 'University of Illinois Urbana-Champaign, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.22740.jpg', 'data': {'categories': ['#rl', '#games', '#reasoning', '#training', '#agents', '#agi', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Оркестратор учится сам и постепенно отказывается от подсказок', 'desc': 'Статья предлагает R²Orch — парадигму рекурсивного самообучения (Recursive Self-Play) для обучения оркестратора агентных LLM без вручную заданных учебных программ. Внутренний цикл self-play улучшает оркестратор на задачах, которые сам Proposer выбирает, а внешний цикл улучшает сам процесс обучения. Для этого вводится цель Recursive Learnability, поощряющая выбор задач, на которых траектории (rollouts) дают разные исходы даже после удаления навыков, а также механизм Skill Withdrawal, убирающий навыки, которые больше не нужны оркестратору. Эксперименты на двенадцати датасетах показывают, что метод стабильно превосходит базовые подходы в вопросах-ответах, математике, коде и интерактивных задачах.'}, 'en': {'title': 'Learn from failures, then orchestrate with fewer skills', 'desc': 'R²Orch trains task orchestrators through recursive self-play, rather than relying on hand-designed curricula. A Proposer selects tasks that remain challenging, using differences in outcomes as skills are withdrawn to measure whether the tasks are still learnable. The system turns failures into skills and then into model parameters, while removing skills when controlled evaluations show they are no longer needed. Across twelve datasets, R²Orch outperforms baseline methods on question answering, math, code, and interactive tasks.'}, 'zh': {'title': '让智能体在自选任务与技能递减中学会独立编排', 'desc': 'R²Orch 提出一种递归自我博弈方法，让智能体编排器自行选择任务并持续改进，而不必依赖人工设计的训练课程。它用“递归可学习性”目标奖励任务提议者选择合适的任务，使撤去技能后，任务结果仍能呈现差异，避免训练信号失效。外层循环通过受控评估逐步撤去不再必要的技能；训练中的失败会被提炼为技能，再融入模型参数，推动编排器迈向无需外部技能的部署。实验表明，该方法在十二个数据集的问答、数学、编程和交互任务上均优于基线。'}}}, {'id': 'https://huggingface.co/papers/2610.36545', 'title': 'FrameForge: Harnessing Priors of Video Foundation Models for Unified Image Generation', 'url': 'https://huggingface.co/papers/2610.36545', 'abstract': 'Abstract FrameForge enables adaptive conditional image generation by modeling variable condition-target relationships through dynamic temporal experts and intermediate reasoning pathways in pretrained video models.  Generated by thinkingmachines/Inkling-Small Unified conditional image generation requires a single model to preserve different aspects of a visual input while producing a target image that follows textual guidance. Pretrained video models provide a promising foundation by encoding visual transformations across time, yet existing approaches typically assign the condition and target to fixed temporal positions. We observe that condition-target relationships vary substantially across generation tasks, while video models naturally encode visual transformations at different temporal scales. This motivates us to model conditional generation through input-adaptive virtual temporal relations. We propose FrameForge, which captures two complementary aspects of such relations. Mixture of Temporal Experts (MoTE) models how far the target lies from the condition by dynamically selecting temporal RoPE experts with different virtual intervals. Chain of Temporal Reasoning (CoTR) models how the condition is transformed into the target through a latent intermediate state, with a reasoning-bottleneck attention mask encouraging information propagation through this pathway. Experiments on DreamBench, COCO2017, and GEdit-Bench show that FrameForge achieves superior performance in subject-driven generation, canny-to-image generation, and image editing among the compared methods.', 'score': 23, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'cb57a0a2ad3c54c2', 'pdf_title_img': 'assets/pdf/title_img/2610.36545.jpg', 'data': {'categories': ['#diffusion', '#benchmark', '#video', '#cv', '#architecture'], 'emoji': '🎞️', 'ru': {'title': 'Адаптивное временное мышление делает генерацию изображений точнее', 'desc': 'В статье представлен FrameForge — метод условной генерации изображений, который использует предобученные видеомодели. Вместо фиксированного временного положения условия и цели, модель адаптивно выбирает виртуальные временные отношения в зависимости от входных данных. Mixture of Temporal Experts (MoTE) динамически выбирает RoPE-экспертов с разными виртуальными интервалами, а Chain of Temporal Reasoning (CoTR) моделирует преобразование условия в цель через промежуточное латентное состояние с attention-маской типа reasoning-bottleneck. Эксперименты на DreamBench, COCO2017 и GEdit-Bench показывают превосходство метода в генерации по субъекту, генерации из canny-карт и редактировании изображений.'}, 'en': {'title': 'Adapt the temporal path to transform each image', 'desc': 'FrameForge adapts pretrained video models for conditional image generation, where a model uses an input image and text to create a target image. Its Mixture of Temporal Experts selects among different virtual time intervals to match how much the target should differ from the input. Its Chain of Temporal Reasoning guides information through a latent intermediate state, modeling how the input is transformed into the target. Experiments show strong results on subject-driven generation, canny-to-image generation, and image editing benchmarks.'}, 'zh': {'title': '让时间关系随任务而变，驱动更灵活的图像生成', 'desc': '本文提出 FrameForge，用预训练视频模型进行统一的条件图像生成，让模型根据输入图像和文本指引生成目标图像。它指出，不同任务中条件图像与目标图像之间的关系各不相同，因此不应把它们固定在视频序列的特定位置。时间专家混合（MoTE）会动态选择具有不同虚拟时间间隔的 RoPE 专家，以表示目标与条件之间的变化幅度；时间推理链（CoTR）则通过潜在中间状态和推理瓶颈注意力掩码，引导信息逐步传递并完成图像变换。在 DreamBench、COCO2017 和 GEdit-Bench 上的实验表明，FrameForge 在主体驱动生成、边缘图转图像和图像编辑任务中优于对比方法。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2610.40339', 'title': 'Wizard: Manipulate Any World in Real Time via Agentic Control', 'url': 'https://huggingface.co/papers/2610.40339', 'abstract': 'Abstract Wizard is an agentic game world model that uses structured motion proxies and adaptive masking to enable real-time, generalizable video generation with precise character control across diverse scenes.  Generated by thinkingmachines/Inkling-Small Recent advances in video world models have enabled the generation of increasingly realistic and interactive virtual environments, opening new possibilities for player-customizable gameplay. Agentic frameworks further advance this direction by decoupling explicit game logic and controllable world representations from visual generation. However, existing approaches support only simple game settings and predefined motion patterns, generalize poorly to unseen environments and characters, and offer limited real-time interactivity. In this paper, we introduce Wizard, an agentic game world model that enables real-time, precise control over character motions while generalizing zero-shot across novel scenes, characters, and actions. To achieve this, we construct a diverse dataset spanning 750 scenes and 178 characters, incorporating skeleton and geometry information as structured representations. We leverage these representations as intermediate proxies to condition a video generation model, together with an adaptive masking mechanism that improves alignment between the conditioning signals and generated video rollouts. Furthermore, we introduce an agentic framework that explicitly maintains and updates game states, allowing players to freely configure their virtual worlds and exercise fine-grained control over character motions while preserving visual quality and gameplay consistency. By combining agentic control with structured proxy-based generation, our framework unlocks new possibilities for player-driven game creation with real-time, generalizable, and mechanically consistent world simulation.', 'score': 22, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'fefd677b1d977c4e', 'authors': ['Yuzhe Wu', 'Zijun Lin', 'Yeying Jin'], 'affiliations': ['NTU', 'NUS', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.40339.jpg', 'data': {'categories': ['#games', '#dataset', '#diffusion', '#agents', '#multimodal', '#video', '#cv', '#architecture', '#3d'], 'emoji': '🧙', 'ru': {'title': 'Волшебник создаёт игровые миры в реальном времени: управляемая генерация видео без ограничений', 'desc': 'Статья представляет Wizard — агентную world model для игр, которая генерирует видео в реальном времени и позволяет точно управлять движениями персонажей. Модель использует структурированные прокси-представления (скелеты и геометрию), полученные из датасета из 750 сцен и 178 персонажей, для условной генерации видео. Адаптивный маскинг улучшает согласованность между управляющими сигналами и сгенерированными видеороликами, а агентный фреймворк поддерживает и обновляет игровое состояние. Подход обеспечивает zero-shot обобщение на новые сцены, персонажей и действия при сохранении визуального качества и игровой логики.'}, 'en': {'title': 'Control the character, create the world', 'desc': 'Wizard is an agentic game world model that generates interactive video in real time and lets players control character motions precisely. It uses skeleton and geometry information as structured proxies to guide a video generation model, with adaptive masking to better align those signals with generated frames. Its dataset covers 750 scenes and 178 characters, supporting zero-shot generalization to new scenes, characters, and actions. An explicit game-state framework lets players configure worlds and control motion while helping keep gameplay visually coherent and mechanically consistent.'}, 'zh': {'title': '让玩家实时掌控角色，在陌生世界中生成连贯游戏', 'desc': '本文提出 Wizard，一种用于游戏世界模拟的智能体视频生成模型，可实时、精确地控制角色动作，并零样本泛化到新的场景、角色和动作。研究构建了包含 750 个场景和 178 个角色的数据集，并将骨骼与几何信息作为结构化中间代理来条件化视频生成模型。模型还采用自适应掩码机制，提升控制信号与生成视频序列之间的对齐效果。其智能体框架会显式维护和更新游戏状态，使玩家能够自由配置虚拟世界、细致控制角色，同时保持视觉质量与游戏机制的一致性。'}}}, {'id': 'https://huggingface.co/papers/2610.40373', 'title': 'HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model', 'url': 'https://huggingface.co/papers/2610.40373', 'abstract': 'Abstract HiFOR improves robotic manipulation by hierarchically predicting future states and retrieving relevant future information to guide action generation.  Generated by thinkingmachines/Inkling-Small Vision-Language-Action (VLA) models have demonstrated promising capabilities in robotic manipulation by integrating visual perception, language understanding, and action generation. Recent advances have further incorporated future prediction to enhance the understanding of environmental dynamics and task progression. However, existing methods often model short-term dynamics and long-term task objectives separately, while directly incorporating predicted futures into action policies without sufficiently considering their relevance to current action requirements. To address these limitations, we propose HiFOR, a hierarchical foresight framework with action-guided world retrieval. Specifically, Hierarchical Foresight Prediction jointly predicts short-term state evolution, semantic milestones, and final goal states through a Hierarchical Dependency Mask (HDM), establishing dependencies across temporal horizons. Building upon these predictions, Structure-Aware Latent World Modeling organizes future latent representations along the horizon, view, and spatial dimensions to facilitate fine-grained retrieval. Furthermore, Action-Guided Factorized World Retrieval adaptively retrieves relevant future information from the structured latent world based on evolving action representations during denoising, providing targeted guidance for action generation. Extensive experiments on two simulation benchmarks and six real-world robotic manipulation tasks demonstrate the effectiveness of our approach.', 'score': 19, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '880c1b1ad70ea34a', 'authors': ['Rongxing Ding', 'Hongyu Qu', 'Kehong Wu', 'Xudong Wang', 'Fan Zhang', 'Xinguang Xiang', 'Xiangbo Shu'], 'affiliations': ['Nanjing University of Science and Technology', 'National University of Singapore', 'Shenyang Institute of Automation, Chinese Academy of Sciences', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.40373.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Заглядывая вперёд, робот точнее действует', 'desc': 'В статье представлен фреймворк HiFOR для Vision-Language-Action (VLA) моделей в робототехнике, который иерархически предсказывает будущие состояния: краткосрочную динамику среды, семантические вехи и конечное целевое состояние. Для связи этих горизонтов используется Hierarchical Dependency Mask (HDM). Структурированное латентное мировое моделирование (Structure-Aware Latent World Modeling) организует будущие латентные представления по временным, видовым и пространственным измерениям, а механизм Action-Guided Factorized World Retrieval адаптивно извлекает релевантную информацию в процессе denoising для генерации действий. Эксперименты на двух симуляционных бенчмарках и шести реальных задачах манипуляции подтверждают эффективность подхода.'}, 'en': {'title': 'Look Ahead, Retrieve What Matters, Act with Purpose', 'desc': 'HiFOR is a framework for vision-language-action models that uses predictions about the future to improve robotic manipulation. It jointly predicts near-term changes, meaningful task milestones, and final goal states, linking them with a Hierarchical Dependency Mask. It organizes predicted future information by time horizon, camera view, and spatial location so the model can retrieve useful details. During action generation, it selects future information that fits the actions being considered, and experiments show gains in simulation and real-world tasks.'}, 'zh': {'title': '分层预见未来，按需检索信息，助力机器人精准行动', 'desc': '本文提出 HiFOR，一种用于机器人操作的分层前瞻框架，帮助视觉-语言-动作（VLA）模型利用未来状态生成动作。它通过分层依赖掩码联合预测短期状态变化、语义里程碑和最终目标状态，建立不同时间尺度之间的联系。框架还将未来的潜在表示按预测时域、视角和空间结构组织起来，并根据动作表示的变化检索与当前动作相关的信息。仿真基准和真实机器人操作任务上的实验表明，HiFOR 能有效提升操作表现。'}}}, {'id': 'https://huggingface.co/papers/2610.34722', 'title': 'CEPO: A General Framework for Improving Prompt Optimization in Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2610.34722', 'abstract': 'Abstract CEPO improves multi-agent prompt optimization by separating shared coordination from agent-specific execution, boosting performance across benchmarks and scaling efficiently with more agents.  Generated by thinkingmachines/Inkling-Small Multi-agent systems (MAS) require both effective coordination and specialized task execution. Existing prompt optimization approaches typically couple these functions within agent-specific prompts. We introduce Coordinator-Executor Prompt Optimization (CEPO), a general framework for improving prompt optimization in MAS. CEPO separates system-level coordination from agent-level execution through a shared coordinator prompt and agent-specific executor prompts, and guides their updates according to their respective roles. This structure allows shared coordination rules to be refined consistently across agents while keeping execution instructions separately adjustable. CEPO provides the prompt structure and optimization guidance, while existing prompt optimizers perform the underlying search. Extensive experiments spanning 11 benchmarks across four domains demonstrate that applying CEPO to four existing prompt optimizers consistently improves their performance. Ablations and qualitative analyses support the proposed design, while controlled studies on a document-understanding MAS further demonstrate improved optimization budget efficiency and performance scaling with the number of agents.', 'score': 17, 'issue_id': 3489, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': 'fbb469e1736ab0d0', 'authors': ['Jongha Kim', 'Seohyun Lee', 'Jonathan Minho Chung', 'Jinsung Yoon', 'Hyunwoo J. Kim'], 'affiliations': ['Google Cloud AI Research', 'KAIST', 'Korea University'], 'pdf_title_img': 'assets/pdf/title_img/2610.34722.jpg', 'data': {'categories': ['#agents', '#training', '#benchmark', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Координатор и исполнители: разделяй правила и задачи, чтобы улучшать промпты агентов', 'desc': 'В статье предлагается CEPO — фреймворк для оптимизации промптов в мультиагентных системах (MAS), где разделяются общий координатор и исполнители для каждого агента. Координатор задаёт единые правила взаимодействия, а промпты-исполнители настраивают специфические инструкции под роль каждого агента. CEPO задаёт структуру промптов и направления их обновления, а поиск оптимальных значений выполняют существующие оптимизаторы промптов. Эксперименты на 11 бенчмарках в четырёх доменах показывают стабильный прирост качества, а также лучшую эффективность бюджета оптимизации при росте числа агентов.'}, 'en': {'title': 'Coordinate Together, Execute by Role', 'desc': 'CEPO is a framework for optimizing prompts in multi-agent systems. It separates shared coordination instructions into a coordinator prompt and task-specific instructions into executor prompts for individual agents. Existing prompt optimizers search for improvements while CEPO guides updates to each prompt according to its role. Experiments across 11 benchmarks show consistent gains, more efficient use of optimization budgets, and improved scaling as the number of agents increases.'}, 'zh': {'title': '共享协调、分工执行，让多智能体提示优化更高效', 'desc': '本文提出协调者—执行者提示优化（CEPO）框架，用于改进多智能体系统中的提示优化。它将系统层面的协调规则放在所有智能体共享的协调者提示中，并将具体任务指令放在各智能体独立的执行者提示中。优化时，协调者提示和执行者提示会根据各自职责分别调整，而底层搜索仍由现有的提示优化器完成。在涵盖四个领域、11项基准测试的实验中，CEPO提升了四种现有优化器的表现；进一步研究也显示，它能更有效地利用优化预算，并随着智能体数量增加而扩展性能。'}}}, {'id': 'https://huggingface.co/papers/2610.42149', 'title': 'Latent Reasoning in Continuous Space for Unified Multimodal Models', 'url': 'https://huggingface.co/papers/2610.42149', 'abstract': 'Abstract LARC enables continuous latent reasoning for unified multimodal models, improving image generation quality and enabling test-time scaling without discrete token bottlenecks.  Generated by thinkingmachines/Inkling-Small Unified Multimodal Models (UMMs) achieve remarkable success on diverse multimodal understanding and generation tasks, yet they still struggle to effectively leverage language-based chain-of-thought reasoning for image generation. As a result, existing reasoning-augmented UMMs often fail to inherit the test-time scaling and fine-grained controllability observed in large language models. We attribute this failure to a fundamental modality mismatch: reasoning is performed in a discrete token space, whereas image generation operates in a continuous space. To bridge this gap, we introduce a Latent Reasoning framework in Continuous space (LARC), which alleviates the token-level bottleneck by reasoning over continuous hidden states. Specifically, the training framework consists of two stages: (i) curriculum supervised fine-tuning (SFT), and (ii) information-gain reinforcement learning (RL). First, the curriculum SFT stage gradually converts token-level reasoning into latent reasoning. Subsequently, the information-gain RL stage self-evolves latent reasoning without ground truth supervision. Experiments across diverse text-to-image generation benchmarks show that LARC consistently improves generation quality, prompt following, and compositional fidelity. Notably, LARC achieves state-of-the-art performance on GenEval with a 7%p gain over BAGEL and demonstrates clear test-time scaling behavior, outperforming token-based generation under both parallel and sequential test-time scaling strategies.', 'score': 16, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '947b6d315a15ddf4', 'authors': ['Byungwoo Jeon', 'Yoonwoo Jeong', 'Hyunseok Lee', 'Minsu Cho', 'Jinwoo Shin'], 'affiliations': ['KAIST', 'POSTECH', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2610.42149.jpg', 'data': {'categories': ['#rl', '#reasoning', '#training', '#diffusion', '#multimodal', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Рассуждать в непрерывном латентном пространстве — ключ к качественной генерации изображений', 'desc': 'Статья представляет LARC — фреймворк латентного рассуждения в непрерывном пространстве для унифицированных мультимодальных моделей (UMM), который устраняет разрыв между дискретным текстовым рассуждением и непрерывной генерацией изображений. Обучение состоит из двух этапов: куррикулум-SFT, постепенно переводящий токенное рассуждение в латентное, и обучение с подкреплением на основе information-gain (RL), которое развивает латентное рассуждение без ground truth разметки. Эксперименты на бенчмарках text-to-image показывают улучшение качества генерации, соблюдения промпта и композиционной точности, а также результат SOTA на GenEval (+7 п.п. над BAGEL). Модель демонстрирует масштабирование на этапе инференса (test-time scaling) и превосходит токенную генерацию при параллельных и последовательных стратегиях.'}, 'en': {'title': 'Reason in Latents, Generate Better Images', 'desc': 'LARC helps unified multimodal models reason about images using continuous hidden states instead of discrete text tokens. This approach bridges the mismatch between language-based reasoning and continuous image generation. Training first uses curriculum supervised fine-tuning, then information-gain reinforcement learning to improve latent reasoning without ground-truth labels. Across text-to-image benchmarks, LARC improves image quality, prompt following, and compositional fidelity, while also scaling better at test time.'}, 'zh': {'title': '在连续隐空间中推理，让多模态图像生成越想越好', 'desc': '统一多模态模型通常用离散文本 token 进行推理，但图像生成依赖连续表示，这种差异会限制推理效果和测试时扩展能力。LARC 提出在连续隐状态空间中进行潜在推理，以缩小语言推理与图像生成之间的差距。它先通过课程式监督微调逐步将 token 级推理转为潜在推理，再用信息增益强化学习在没有标准答案监督的情况下改进推理。实验显示，LARC 提升了图像生成质量、提示词遵循度和组合保真度，并在 GenEval 上取得领先表现，且测试时扩展效果优于基于 token 的方法。'}}}, {'id': 'https://huggingface.co/papers/2610.40799', 'title': 'CaPtain: A Pipeline for Post-Training Code-as-Policy Robot Agents', 'url': 'https://huggingface.co/papers/2610.40799', 'abstract': 'Abstract CaPtain trains small open vision-language models via supervised fine-tuning and multi-turn reinforcement learning with a physical critic to perform robot manipulation through code, achieving strong results without frontier models or vision-language-action backbones.  Generated by thinkingmachines/Inkling-Small Across coding, web, and tool-use tasks, language-model agents are now routinely trained with the same recipe: supervised fine-tuning (SFT) to learn the interface, then multi-turn reinforcement learning (RL) to master it. Code-as-policy (CaP) casts robot manipulation in the same form, as the policy writes code against robot APIs and reads back the results, so the same recipe should apply. Yet existing CaP agents sidestep training: they either prompt closed frontier models or delegate manipulation to pre-trained vision-language-action models (VLAs) and high-level skills, while small open vision-language models (VLMs) fail outright. We present CaPtain, an open post-training pipeline that turns a small open VLM into a capable CaP agent, with no VLA, frontier model, or privileged state at test time. CaPtain trains and deploys the policy inside CaPtain-Harness, which exposes low-level perception, geometry, and guarded-motion primitives across simulation and real hardware. We first align the base model via SFT on synthetic trajectories generated with GPT-6 Astra, then apply multi-turn RL. Multi-turn RL must credit tens of agent requests, whose physical effects often surface turns later, from a single end-of-episode outcome. We therefore introduce a physical critic that reads privileged simulator state, never seen by the policy, and credits each request by how much it changes the predicted chance of success. Starting from Qwen3.5-4B (0% zero-shot), CaPtain-4B reaches 55.4% held-out LIBERO success after SFT and 73.8% after RL. On LIBERO-PRO, it reaches 78.5%, surpassing several frontier-model agents, and its RL gains persist across three perturbation suites (+17.6 to +21.2 points). Without target-domain training, it attains 83.3% on SimplerEnv WidowX, exceeds frontier models on CaP-Bench, and runs on a real robot after simulation-only adaptation. We release all code, data, and model weights.', 'score': 15, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '0d3af096480f548e', 'authors': ['Yijia Fan', 'Xilin He', 'Yilei Jiang', 'Dongming Wu', 'Jiaxu Wang', 'Xiangyu Yue'], 'affiliations': ['MMLab, The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.40799.jpg', 'data': {'categories': ['#rl', '#games', '#plp', '#dataset', '#training', '#small_models', '#open_source', '#synthetic', '#agents', '#multimodal', '#robotics', '#benchmark', '#agi', '#optimization', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Маленькая открытая VLM учится управлять роботом через код и сама превосходит гигантов', 'desc': 'Авторы представляют CaPtain — открытый пайплайн пост-обучения, который превращает небольшую открытую vision-language модель (VLM) в агента Code-as-Policy для манипуляций роботом. Модель сначала обучается через supervised fine-tuning на синтетических траекториях, а затем проходит multi-turn reinforcement learning. Ключевая новинка — physical critic, который использует приватное состояние симулятора, недоступное политике, и оценивает вклад каждого запроса в изменение предсказанной вероятности успеха. Итог: модель Qwen3.5-4B после обучения достигает 73.8% успеха на LIBERO и 83.3% на SimplerEnv без обучения на целевом домене, превосходя ряд агентов на frontier-моделях, и работает на реальном роботе.'}, 'en': {'title': 'Teach Small Open Models to Control Robots Through Code', 'desc': 'CaPtain trains a small open vision-language model to control robots by writing code that uses robot APIs. It first uses supervised fine-tuning on synthetic examples, then multi-turn reinforcement learning to improve performance. A physical critic uses hidden simulator state to estimate how each request affects the chance of task success, helping assign credit when effects appear several turns later. The resulting 4B-parameter agent achieves strong results in simulation and transfers to new settings and a real robot without relying on a vision-language-action model at test time.'}, 'zh': {'title': '让小型开源视觉语言模型学会用代码操控机器人', 'desc': '这篇论文提出 CaPtain，用监督微调（SFT）和多轮强化学习（RL）训练小型开源视觉语言模型，使其通过编写代码控制机器人完成操作任务。系统提供感知、几何计算和安全运动等机器人接口，并使用物理评论器评估每次代码请求对任务成功概率的影响，从而解决结果延迟出现时的奖励分配问题。训练时评论器可以读取特权模拟器状态，但执行任务的策略无需这些信息，也不依赖视觉语言动作模型或闭源前沿模型。实验显示，CaPtain 在多个模拟基准上取得较强成绩，并能迁移到真实机器人。'}}}, {'id': 'https://huggingface.co/papers/2610.40738', 'title': 'Apriel Voice 27B Preview: An Open Model for Speech, Reasoning, and Tool Use', 'url': 'https://huggingface.co/papers/2610.40738', 'abstract': 'Abstract Apriel Voice 27B Preview is an open speech-language model that integrates speech understanding, reasoning, and tool use within a shared backbone, achieving strong results on audio benchmarks through a two-stage training procedure with online distillation.  Generated by thinkingmachines/Inkling-Small A capable voice assistant must do more than recognize words; it must understand requests, reason over context, sustain conversations, and act through tools. We present Apriel Voice 27B Preview, an open speech-language model that unifies these capabilities within a shared reasoning backbone while retaining text and image input modalities. Built on the post-trained Gemma 4 26B-A4B checkpoint, Apriel Voice directly processes speech and generates both responses and tool calls without requiring a separate dialogue model. We introduce a two-stage training procedure to adapt the model to speech. The first stage establishes the speech interface, while the second jointly adapts the projector and backbone through supervised fine-tuning, text replay, and source-dependent cross-entropy and forward Kullback--Leibler divergence supervision. Automatically constructed speech-conditioned dialogues provide conversational training data, while local teacher serving, overlapping teacher and student computation, and fused full-vocabulary losses enable efficient online distillation. In thinking mode, Apriel Voice achieves a score of 98.90 on Big Bench Audio, 81.13 on Speech-BFCL, and a task success rate of 65.51% on τ-Voice, with a mean latency of 1.91 seconds. It also achieves 51.27% English EVA accuracy and 74.13% experience pass@1. Finally, we deploy Apriel Voice 27B Preview on a custom serving platform to support interactive voice interactions.', 'score': 13, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'b2497c41b14dfe94', 'authors': ['Aman Tiwari', 'Akshay Kalkunte', 'Akintunde Oladipo', 'Jash Shah', 'Tara Bogavelli', 'Hoang Nguyen', 'Nishanth Madhusudhan', 'Vishal Juneja', 'Sridhar Nemala', 'Srinivas Sunkara', 'Sathwik Tejaswi Madhusudhan', 'Shruthan Radhakrishna', 'Masoud Hashemi', 'Kelechi Ogueji', 'Khalil Slimi', 'Saloni Mittal', 'Pulkit Pattnaik', 'Shashank Maiya', 'Dhruv Jhamb', 'Esakkivel Esakkiraja', 'Katrina Stankiewicz', 'Gabrielle Gauthier Melançon', 'Fanny Riols', 'Amit Saha', 'Lakshmi Sirisha Chodisetty', 'Nitin Aggarwal', 'Anil Madamala', 'Sagar Davasam', 'Segan Subramanian', 'Vikas Yadav', 'Sai Rajeswar Mudumba'], 'affiliations': ['ServiceNow'], 'pdf_title_img': 'assets/pdf/title_img/2610.40738.jpg', 'data': {'categories': ['#reasoning', '#audio', '#training', '#open_source', '#agents', '#multimodal', '#benchmark', '#optimization'], 'emoji': '🎙️', 'ru': {'title': 'Голосовой ассистент, который слышит, думает и действует', 'desc': 'Статья представляет Apriel Voice 27B Preview — открытую speech-language модель, которая объединяет распознавание речи, рассуждение и использование инструментов (tool use) в одном общем backbone. Модель построена на основе Gemma 4 26B-A4B и напрямую обрабатывает речевой вход, генерируя ответы и вызовы инструментов без отдельной диалоговой LLM. Обучение проходит в два этапа: сначала настраивается речевой интерфейс, затем совместно адаптируются projector и backbone с помощью supervised fine-tuning, text replay и online distillation с комбинацией cross-entropy и forward KL-дивергенции. Модель показывает высокие результаты на бенчмарках Big Bench Audio, Speech-BFCL и τ-Voice при средней задержке около 1,91 секунды.'}, 'en': {'title': 'One Voice Model to Listen, Reason, and Act', 'desc': 'Apriel Voice 27B Preview is an open speech-language model that understands audio, reasons about requests, and produces spoken responses or tool calls using one shared backbone. It also accepts text and images, without needing a separate dialogue model. The model is adapted to speech in two training stages, using supervised fine-tuning and online distillation, where it learns from a teacher model’s outputs. It achieves strong results on several audio and voice-assistant benchmarks, while supporting interactive conversations with low latency.'}, 'zh': {'title': '让语音模型听懂、会推理，也能调用工具', 'desc': 'Apriel Voice 27B Preview 是一种开放式语音语言模型，使用同一个推理骨干处理语音理解、推理和工具调用，也支持文本与图像输入。模型采用两阶段训练：先建立语音输入输出能力，再通过监督微调、文本回放和在线蒸馏共同适配投影层与骨干网络。训练数据包括自动构造的语音对话，并结合交叉熵损失与前向 KL 散度，让学生模型学习教师模型的输出。模型在多项音频基准上取得较强成绩，并已部署到定制平台，用于交互式语音对话。'}}}, {'id': 'https://huggingface.co/papers/2610.40748', 'title': 'WorldBridge: Bridging Video and Action for Task Generalization in World Action Models', 'url': 'https://huggingface.co/papers/2610.40748', 'abstract': 'Abstract WorldBridge improves robot task generalization by combining video prediction with sparse action supervision via separate video and action experts, achieving state-of-the-art results across manipulation benchmarks.  Generated by thinkingmachines/Inkling-Small Achieving the broad task generalization of embodied models in physical environments remains a central challenge in robot learning. We study this challenge in World Action Models (WAMs) through two complementary capabilities: video generalization, which predicts the visual evolution of new tasks, and action generalization, which translates these predictions into executable behavior through a video-to-action bridge. By varying video and action supervision for tasks outside an initial training set, we examine their respective contributions to task transfer. On RoboTwin 2.0, using only in-distribution video-action supervision yields a 25.07% success rate on out-of-distribution tasks. Introducing videos of these tasks without their action labels raises success to 55.90%, while adding just one action-labeled demonstration per task further improves it to 70.70%. These findings suggest that broader video coverage enables task transfer by leveraging existing inverse-dynamics capabilities, while even sparse action supervision further strengthens those capabilities. Guided by this perspective, we introduce WorldBridge, a WAM with separate video and action experts connected through structured attention and trained with joint flow matching. WorldBridge incorporates visual memory at two temporal scales and action forcing, alongside a unified data processing pipeline that standardizes and filters heterogeneous robot trajectories and egocentric hand-derived supervision. Across multiple manipulation benchmarks, WorldBridge achieves state-of-the-art performance among the compared methods, including 96.23% on RoboTwin 2.0 full data setting and 80.9% on clean to random setting, 82.8% on RoboCasa GR1 TableTop, and 57.6% on DOMINO Level-1. Our study highlights the complementary roles of video prediction and action grounding in developing robots that generalize across tasks.', 'score': 11, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '13be8a6a5c25557e', 'authors': ['Jun Cen', 'Yubo Guo', 'Hao Li', 'Liangkai Li', 'Yaoxu Lyu', 'Meng Wei', 'Zeqi Xiao', 'Sizhe Yang', 'Yuqiang Yang', 'Yifan Ye', 'Shanghang Zhang', 'Duo Zheng'], 'affiliations': ['Joy Future Academy'], 'pdf_title_img': 'assets/pdf/title_img/2610.40748.jpg', 'data': {'categories': ['#games', '#training', '#benchmark', '#robotics', '#video', '#optimization', '#data', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Видео учит предсказывать, а несколько действий — выполнять: мост к обобщению роботов', 'desc': 'Статья посвящена обобщению роботов на новые задачи с помощью World Action Models (WAM), которые объединяют предсказание видео и генерацию действий. Авторы показывают, что видео без разметки действий и даже одна размеченная демонстрация на задачу заметно повышают успешность переноса на out-of-distribution задачи. На основе этого предложен WorldBridge: WAM с отдельными видео- и action-экспертами, связанными structured attention и обученными совместным flow matching, с визуальной памятью на двух масштабах времени и унифицированным пайплайном обработки данных. Модель достигает state-of-the-art результатов на нескольких бенчмарках манипуляций, включая RoboTwin 2.0 и RoboCasa.'}, 'en': {'title': 'Teach Robots New Tasks with Videos—and Just a Few Actions', 'desc': 'The paper studies how robots can generalize to tasks they have not seen before by predicting videos and turning those predictions into actions. On RoboTwin 2.0, adding videos of new tasks without action labels raises success from 25.07% to 55.90%, and one action-labeled example per task raises it to 70.70%. The authors introduce WorldBridge, a World Action Model with separate video and action experts, connected by structured attention and trained jointly with flow matching. It also uses visual memory at two time scales and action forcing, and achieves strong results across several manipulation benchmarks.'}, 'zh': {'title': '让机器人从看懂视频到学会行动', 'desc': '这篇论文研究机器人如何把学过的技能迁移到新任务，重点考察视频预测和动作生成两种能力。实验发现，加入新任务的视频但不提供动作标签，成功率从25.07%升至55.90%；每个任务再提供一个带动作标签的示范，成功率进一步升至70.70%。作者据此提出WorldBridge：它使用独立的视频专家和动作专家，通过结构化注意力连接，并以联合流匹配进行训练。WorldBridge还结合双时间尺度视觉记忆与动作强制机制，在多个操作基准上取得了所比较方法中的最佳表现。'}}}, {'id': 'https://huggingface.co/papers/2610.42053', 'title': 'REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control', 'url': 'https://huggingface.co/papers/2610.42053', 'abstract': "Abstract REA unifies deliberative and reactive policies in a single runtime with asynchronous coordination, achieving high success rates with reduced control overhead across simulated and real robot tasks.  Generated by thinkingmachines/Inkling-Small Foundation models are becoming remarkably reliable at high-level reasoning, yet they remain too slow and costly to serve as fine-grained controllers. Conversely, fast policies like VLAs and whole-body controllers offer more efficient reflexes, but struggle to generalize. While pairing a deliberative brain (foundation models) with a reactive cerebellum (fast policies) seems natural for embodied systems, two obstacles remain: methods are built and scored on incompatible stacks, and their asynchronous coordination is difficult. For example, an agent that calls the VLA in the agentic loop can stall the fast execution, while a VLA that calls the agent on errors tends to re-trigger fallbacks repeatedly or completely miss silent failures. To address this, we propose REA (Routed Embodied Agent), a unified runtime where a deliberative System 2, an embodied router System 1 and reactive System 0 policies cooperate under a single golden rule - no running policy waits on the brain. Instead of querying the brain at each failure, REA employs a route memory that stores each policy's measured success ahead of time, a boundary-triggered judge gate that consults the brain on policy execution, and a shared-budget escalation ladder for bounded recovery. Evaluated on 3,000 test episodes across 60 LIBERO-Pro tasks, REA reaches 95.9% success and beats the best single-agent baseline in its own policy pool (94.7%) while reducing control steps by 25% and control time by 17%. In a separate 100-episode RoboTwin 2.0 study, REA achieves 84% success with VLA policies and 86% with VLA+code, compared with 80% for the strongest single VLA baseline MEDex. These results demonstrate learned and programmatic policies operating within the same runtime. REA also transfers to BEHAVIOR-1K and a real Unitree G1 humanoid, achieving the highest observed success among the compared methods.", 'score': 9, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '6d31a3d15945b163', 'authors': ['Pengfei Zhou', 'Yixing Ma', 'Zhengfeiyang Zhang', 'Haoyuan Chen', 'Zhenglin Wan', 'Hexin Wang', 'Wangbo Zhao', 'Yang You'], 'affiliations': ['Hong Kong University of Science and Technology', 'National University of Singapore', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences', 'The University of Tokyo', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.42053.jpg', 'data': {'categories': ['#rl', '#games', '#agents', '#benchmark', '#robotics', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Быстрые рефлексы и медленный разум работают вместе, не мешая друг другу', 'desc': 'В статье представлен REA (Routed Embodied Agent) — единая среда выполнения, где медленная LLM-модель System 2 отвечает за высокоуровневое рассуждение, router System 1 выбирает подходящую политику, а быстрые reactive-политики System 0 (VLA и контроллеры всего тела) выполняют действия. Ключевое правило: ни одна работающая политика не ждёт ответа «мозга», а координация выполняется асинхронно через route memory и judge gate с общим бюджетом эскалации. Метод протестирован на LIBERO-Pro, RoboTwin 2.0, BEHAVIOR-1K и humanoid-роботе Unitree G1, где он повышает успешность и сокращает число шагов управления на 25%. Результаты показывают, что обучаемые и программные политики могут работать в одном runtime.'}, 'en': {'title': 'Let the robot think deeply without slowing its reflexes', 'desc': 'REA combines slow foundation-model reasoning with fast reactive policies in one robot-control runtime. Its router uses stored policy success rates, checks for problems at execution boundaries, and escalates recovery within a shared budget, so running policies do not have to wait for the reasoning model. Across simulated tasks, REA achieved high success while reducing control steps and time compared with a strong single-agent baseline, and it also performed well on a real humanoid robot. The results show that learned and programmatic policies can work together in a unified system.'}, 'zh': {'title': '让深度推理与快速反应协同，机器人成功更高、控制更省', 'desc': 'REA提出一种统一的机器人运行框架，让擅长推理的基础模型、负责选择策略的路由器和快速反应策略协同工作。它采用策略成功率记忆、边界触发的判断门，以及共享预算的逐级恢复机制，并确保正在运行的策略不会等待基础模型。实验显示，REA在LIBERO-Pro和RoboTwin 2.0等任务中取得较高成功率，同时减少控制步骤和控制时间，也能迁移到其他模拟环境及真实人形机器人。结果表明，学习得到的策略与程序化策略可以在同一运行框架中有效配合。'}}}, {'id': 'https://huggingface.co/papers/2610.42136', 'title': 'ReLift: Dense 3D Tracking as Lifted Trajectory Repair', 'url': 'https://huggingface.co/papers/2610.42136', 'abstract': 'Abstract ReLift improves dense 3D tracking by repairing and completing lifted trajectories using geometric trajectory refinement without requiring image-based training.  Generated by thinkingmachines/Inkling-Small Dense 3D tracking from monocular video requires establishing point correspondences over time, estimating their depth, and inferring their trajectories during occlusion. Existing methods typically learn these tasks jointly, a demanding objective given the scarcity of 4D supervision. We show that strong pretrained 2D trackers and 3D geometry models provide an effective foundation: lifted trajectories, with occluded segments simply interpolated, already rival dedicated 3D trackers using the same geometry. However, lifted trajectories inherit correspondence and depth errors, and under occlusion, their depth comes from the occluder rather than the tracked point. We introduce ReLift, an efficient feed-forward framework that recasts dense 3D tracking as geometric trajectory repair and completion. At its core, a trajectory corrector alternates attention along and across trajectories to preserve reliable observations, repair corrupted positions, and complete missing motion. Using only geometric inputs allows us to train directly on 3D trajectories with simulated lifting errors, decoupling training from images and from any specific tracker or geometry model. Concentrating 4D supervision on trajectory refinement yields a reusable model that consistently improves lifted trajectories across trackers and geometry providers without retraining, so it benefits directly from future advances in either component. On WorldTrack, ReLift achieves state-of-the-art mean accuracy, improving on the strongest baselines by 2.1 APD on all points and 3.0 on dynamic points, with faster configurations remaining competitive with leading 3D trackers while running faster than 4RC. Visit our supplementry page for more examples and code.', 'score': 9, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'a199152925207ade', 'authors': ['Assaf Singer', 'Maroun Khriesh', 'Noam Rotstein', 'Yoni Kasten', 'Or Litany'], 'affiliations': ['NVIDIA', 'Technion Israel Institute of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.42136.jpg', 'data': {'categories': ['#training', '#benchmark', '#video', '#architecture', '#3d'], 'emoji': '🎯', 'ru': {'title': 'Чинить и достраивать траектории вместо того, чтобы учить всё заново', 'desc': 'Статья представляет ReLift — быстрый feed-forward фреймворк для плотного 3D-трекинга по монокулярному видео, который рассматривает задачу как восстановление и дополнение лифтированных траекторий. Из 2D-трекеров и 3D geometry models берутся траектории, а окклюзии заполняются интерполяцией, однако ошибки соответствий и глубины остаются. Ядро метода — trajectory corrector, который чередует attention вдоль и поперёк траекторий, исправляя искажённые позиции и восстанавливая пропущенное движение. Модель обучается только на геометрических данных с симулированными ошибками лифтинга, без изображений и привязки к конкретному трекеру, и на WorldTrack достигает state-of-the-art точности, опережая сильнейшие baselines.'}, 'en': {'title': 'Repair lifted trajectories for better 3D tracking', 'desc': 'ReLift improves dense 3D tracking by refining trajectories lifted from monocular video. It uses a trajectory corrector that applies attention along and across trajectories to fix errors and fill in missing motion. The model trains on 3D trajectories with simulated lifting errors, so it does not need image-based training or depend on a particular tracker or geometry model. ReLift improves accuracy across different components and achieves state-of-the-art results on WorldTrack while offering faster configurations.'}, 'zh': {'title': '修复并补全三维轨迹，让稠密跟踪更准确、更高效', 'desc': 'ReLift 将单目视频的稠密三维跟踪转化为三维轨迹的几何修复与补全，不需要基于图像进行训练。它以预训练的二维跟踪器和三维几何模型生成的轨迹为基础，利用轨迹中的可靠观测来修正错误位置，并补全遮挡时缺失的运动。核心模块通过沿轨迹和跨轨迹交替进行注意力计算，且只使用几何输入，因此可在模拟误差的三维轨迹上训练，不依赖特定的跟踪器或几何模型。在 WorldTrack 上，ReLift 达到领先的平均精度，并能跨不同基础模型提升轨迹质量，同时保持较快的运行速度。'}}}, {'id': 'https://huggingface.co/papers/2610.40636', 'title': 'Probing Spatial State Representations in Visual Foundation Models', 'url': 'https://huggingface.co/papers/2610.40636', 'abstract': 'Abstract Visual foundation models vary in supporting persistent spatial states across structure, persistence, prediction, and action, with readout accuracy not guaranteeing history-based updates or reliable goal-directed progress.  Generated by thinkingmachines/Inkling-Small An observer sees only part of the surrounding world, yet must keep track of what lies beyond the current view. Spatial perception therefore involves more than recognizing individual images: it calls for a persistent spatial state that is updated under self-motion and used to guide action. Do visual foundation models provide representations that support such a state? We study this question through four levels of spatial capability---spatial structure, object persistence, predictive spatial update, and actionability---using frozen-feature probes on ten representations under streaming egocentric observations of static indoor environments. The resulting capability profiles vary across tasks, network layers, and prefix lengths: strong readout of the visible scene does not ensure accurate object persistence or future-feature retrieval. Matched controls separate readout accuracy from reliance on visual history and motion. Native future prediction retains recoverable spatial structure, but a spatial reader trained on real features does not transfer to predicted features unchanged. Finally, goal-dependent candidate selection does not establish reliable continuous action utility: predicted actions respond to goal changes, yet supplying the correct goal does not reliably improve progress. Across the four levels, object persistence and actionability build on camera-pose readout, whereas feature prediction builds on visible-scene readout. Together, these findings motivate evaluating spatial representations not only by what can be decoded from them, but by whether that information is maintained beyond observation, updated predictively, and used for goal-directed action.', 'score': 8, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '33c0e8cf12056a06', 'authors': ['Baiqiao Yin', 'Zhongang Cai', 'Ruisi Wang', 'Qiwei Liang', 'Lei Yang', 'Ziwei Liu'], 'affiliations': ['Nanyang Technological University', 'New York University', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2610.40636.jpg', 'data': {'categories': ['#interpretability', '#cv', '#benchmark', '#architecture'], 'emoji': '🧭', 'ru': {'title': 'Видеть сцену недостаточно: модели должны помнить пространство и действовать в нём', 'desc': 'Статья исследует, способны ли визуальные foundation-модели формировать устойчивое пространственное состояние, необходимое для навигации и действий. Авторы проверяют четыре уровня пространственных способностей: структуру пространства, сохранение объектов, предсказание будущих признаков и пригодность для действий, используя frozen-feature probes на десяти представлениях. Результаты показывают, что хорошее считывание видимой сцены не гарантирует точного сохранения объектов и предсказания признаков, а goal-dependent выбор действий не всегда ведёт к реальному прогрессу. Авторы призывают оценивать пространственные представления не только по декодируемой информации, но и по тому, поддерживается ли она за пределами наблюдения, обновляется ли предиктивно и используется ли для целенаправленных действий.'}, 'en': {'title': 'Seeing Space Is Not Enough: Models Must Track, Predict, and Act', 'desc': 'This paper tests whether visual foundation models maintain useful spatial representations as an observer moves through indoor scenes. Using frozen-feature probes, it evaluates spatial structure, object persistence, predictive updates, and actionability across ten representations. Strong decoding of the visible scene does not guarantee that models track objects over time, predict future features reliably, or make actions that improve progress toward a goal. The results show that spatial representations should be evaluated by how well they preserve and update information over time and support goal-directed action, not just by what can be read from a single view.'}, 'zh': {'title': '空间理解不止于看见，更要记住、预测并行动', 'desc': '这篇论文研究视觉基础模型能否在连续的第一人称观察中维持并使用空间状态。研究者用冻结特征探针，评估十种模型表征的空间结构、物体持续追踪、预测性空间更新和行动能力。结果显示，模型能识别当前画面中的场景，并不代表它能可靠地追踪视野外的物体、预测未来特征或借助目标稳定地推动行动。论文因此强调，评估空间表征不能只看信息是否可解码，还要检验模型能否跨时间保存信息、根据运动更新状态并据此行动。'}}}, {'id': 'https://huggingface.co/papers/2610.39086', 'title': 'HALO: Human-Grounded Granular Evaluation of Proactive Agents', 'url': 'https://huggingface.co/papers/2610.39086', 'abstract': 'Abstract HALO introduces a human-annotated benchmark and dataset to evaluate proactive agents, revealing that over-proactivity is the dominant failure mode.  Generated by thinkingmachines/Inkling-Small Proactive agents must decide whether, when, and how far to assist without an explicit request. Existing evaluations often rely on automated scores or binary verdicts, offering limited human diagnosis of evidence use and intervention quality. To address these gaps, we introduce HALO, Human-Grounded GrAnular EvaLuation of PrOactive Agents. HALO-Arena covers 4 proactive need types, Dependency, Blockage, Risk, and Opportunity, across 10 everyday domains and 50 personal environments. Scenarios require agents to retrieve evidence from structured databases or unstructured documents before judging whether assistance is warranted and choosing its scope. On HALO-Arena, we construct HALO-8K, a dataset of 8,000 responses from 10 models across 400 scenarios, annotated by 20 experts for action level, acceptability verdicts, and human diagnosis. For rejected responses, human diagnosis covers timing, intensity, and other issues. Recorded reasoning tokens and retrieval rounds measure the effort behind these responses. The best proprietary and open-source models achieve 72.88% and 56.63% acceptability, respectively. Our central finding is that over-proactivity is the dominant observed failure mode, with Premature timing or Excessive intensity accounting for 61.20% of rejected responses. Further analyses yield complementary findings on the balance between intervention and restraint, evidence acquisition, and the calibration of timing and intensity.', 'score': 6, 'issue_id': 3489, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '9874569afd3bc482', 'authors': ['Wenqi Pei', 'Xinyu Wang', 'Jinrui Liu', 'Cynthia Zhuge', 'Jie Sheng', 'Zihan Wang', 'Tenghao Huang', 'Muhao Chen'], 'affiliations': ['22077AI', 'University of California, Davis', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2610.39086.jpg', 'data': {'categories': ['#interpretability', '#survey', '#alignment', '#dataset', '#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Агенты чаще мешают, чем помогают: главная беда — чрезмерная проактивность', 'desc': 'Статья представляет HALO — бенчмарк и датасет для оценки проактивных AI-агентов, которые решают, помогать ли пользователю без явного запроса. Авторы собрали HALO-Arena с 400 сценариями в 4 типах потребностей и 10 доменах и разметили 8 000 ответов 10 LLM экспертами по уровню действия, приемлемости и диагнозу ошибок. Лучшие модели показывают 72.88% приемлемости у проприетарных и 56.63% у открытых моделей. Главный вывод: доминирующая ошибка — чрезмерная проактивность (преждевременное вмешательство или избыточная интенсивность), которая составляет 61.20% отклонённых ответов.'}, 'en': {'title': 'Proactive agents must know when to step in—and when to hold back', 'desc': 'HALO introduces a human-annotated benchmark for evaluating proactive agents, which decide whether and how to help without an explicit request. Its HALO-Arena benchmark tests agents on four types of needs across everyday scenarios that require retrieving evidence from databases or documents. HALO-8K contains 8,000 model responses, labeled by experts for action level, acceptability, and issues such as timing and intensity. The results show that over-proactivity is the most common failure: premature or overly intense interventions account for 61.20% of rejected responses.'}, 'zh': {'title': '主动帮助要有度：该出手时出手，也要懂得克制', 'desc': 'HALO提出了一个由人工标注的基准和数据集，用来评估主动型智能体在没有明确请求时是否能适时提供帮助。HALO-Arena涵盖4类需求、10个日常领域和50种个人环境，要求智能体先从数据库或文档中检索证据，再决定是否介入以及介入到什么程度。研究人员构建了包含8,000条模型回答的HALO-8K，并由专家标注行动等级、可接受性和错误原因，以更细致地分析智能体的表现。结果显示，过度主动是最常见的失败模式；被拒绝的回答中，61.20%存在介入过早或干预过度的问题。'}}}, {'id': 'https://huggingface.co/papers/2610.42141', 'title': 'RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory', 'url': 'https://huggingface.co/papers/2610.42141', 'abstract': "Abstract RoboArchitect automates robot harness design by iteratively revising control code around a frozen policy, substantially improving success on unseen scenes and tasks without model updates.  Generated by thinkingmachines/Inkling-Small Recent work shows that a frozen robot policy performs far better inside an agent harness, where control code decides when to query the policy, consult vision tools, or command the arm directly. Yet today these harnesses are built by hand and redesigned for each new robot or benchmark. We show that harness design can be automated, offering a strong alternative to finetuning on a novel setup. In RoboArchitect, a coding model observes a robot's rollouts, diagnoses failures, and iteratively revises the harness around the frozen policy. The harness evolves on a set of episodes for its optimization and is evaluated on held-out scenes and tasks. Without updating any model weights, RoboArchitect raises average success from 9.7% to 43.3% on unseen scenes (4.5x) and from 12.7% to 40.2% on unseen tasks (3.2x), across multiple benchmarks and policies. The gains are largest where the benchmark is far from the policy's training data: wrapping a general-purpose policy, the evolved harness yields a specialist that often outperforms even the finetuned version. Intuitive control strategies are automatically designed, such as lifting a jammed arm clear or reaching in horizontally when an obstacle blocks the way from above. The harness also evolves its own persistent memory, carrying learned experience, such as effective grasp depths, into later decisions. These results suggest that substantial headroom in robotic manipulation lies in the agent harness, and its design can be effectively automated and optimized without weight updates.", 'score': 5, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '0d6c75180f722c58', 'authors': ['Shengguang Wu', 'Suning Huang', 'Cherie Ho', 'Ria Doshi', 'Hao Zhu', 'Serena Yeung-Levy'], 'affiliations': ['Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.42141.jpg', 'data': {'categories': ['#training', '#agents', '#robotics', '#agi', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Умная обвязка важнее дообучения: робот учится без смены весов', 'desc': 'В статье представлен RoboArchitect — метод автоматического проектирования агентной обвязки (harness) вокруг замороженной робото-политики. LLM-модель анализирует траектории робота, диагностирует ошибки и итеративно переписывает управляющий код, который решает, когда опрашивать политику, использовать компьютерное зрение или напрямую управлять манипулятором. Без обновления весов модели успешность выполнения задач выросла с 9,7% до 43,3% на новых сценах и с 12,7% до 40,2% на новых задачах, причём harness дополнительно формирует собственную persistent memory. Результаты показывают, что значительный потенциал улучшения робототехники лежит в дизайне harness, а не только в дообучении (finetuning).'}, 'en': {'title': 'Better Robot Skills Without Updating the Model', 'desc': 'RoboArchitect improves a frozen robot policy by automatically revising the control code, or harness, that decides how the robot acts. A coding model examines robot rollouts, identifies failures, and updates the harness without changing the policy’s model weights. Across benchmarks, this approach raises success on unseen scenes from 9.7% to 43.3% and on unseen tasks from 12.7% to 40.2%. The harness can also develop useful control strategies and preserve experience in memory, suggesting that harness optimization is a strong alternative to finetuning.'}, 'zh': {'title': '不改模型权重，也能让机器人越做越好', 'desc': 'RoboArchitect 自动优化机器人智能体的控制框架（harness），而不是更新冻结策略的模型权重。一个编程模型观察机器人执行任务的过程，诊断失败，并反复修改控制代码，包括何时调用策略、使用视觉工具或直接控制机械臂。实验显示，这种方法显著提升了机器人在未见场景和任务中的成功率，有时甚至超过微调后的策略。框架还会形成持久记忆，保存有效的抓取深度等经验，供后续决策使用。'}}}, {'id': 'https://huggingface.co/papers/2610.16927', 'title': 'WeFair: Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in Short-Video Search', 'url': 'https://huggingface.co/papers/2610.16927', 'abstract': "Abstract WeFair improves personalized query rewriting via fidelity-aware human feedback stages—demonstration, preference, and verification—to reduce intent drift and boost search effectiveness in short-video platforms.  Generated by thinkingmachines/Inkling-Small Short-video search needs compact query rewriters that recover users' personalized intent from ambiguous queries under strict latency constraints. Existing LLM-based methods have improved rewriting by using synthetic reasoning and subsequent consumption-behavioral feedback. However, overemphasizing subsequent consumption can favor engaging content over the user's immediate need, causing intent drift even when rewritten queries are grounded in behavioral history. We propose WeFair, Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in WeChat short-video search. WeFair uses human feedback according to how directly it reflects personalized intent, assigning feedback fidelity to a progression from demonstration to preference to verification. We first mine actual queries and user reformulations from search sessions, and then screen them for contextual support. In the demonstration stage, a supervised fine-tuning curriculum progresses from large-scale context-to-query learning to reasoning and direct prediction on human reformulation and preservation. In the preference stage, direct preference optimization learns relative preferences from subsequent consumption feedback. In the verification stage, group relative policy optimization rewards exact agreement with reformulation or preservation targets to constrain intent drift. Further analysis shows that broad supervision benefits the full curriculum supervised training, while strict verification achieves better performance than auxiliary rewards. In offline experiments, WeFair-2B outperforms strong rewriting baselines in overall accuracy and intent preservation. An online A/B test shows relative increases of 2.593% in effective video-view rate and a 2.350% relative reduction in query reformulation rate. WeFair-2B has been deployed in the WeChat short-video search system, which serves over 100 million queries per day.", 'score': 5, 'issue_id': 3489, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '60a8216a51996b23', 'authors': ['Yingtao Ren', 'Aolin Li', 'Cheng Cheng', 'Huiyun Hu', 'Huasheng Liang', 'Baoxing Xie', 'Jun Yuan', 'Haijun Wu', 'Yiwei Fu', 'Chenxing Wang'], 'affiliations': ['East China Normal University', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.16927.jpg', 'data': {'categories': ['#alignment', '#training', '#small_models', '#rlhf', '#data'], 'emoji': '🎯', 'ru': {'title': 'Ищем то, что нужно пользователю, а не то, что он будет смотреть', 'desc': 'В статье предлагается WeFair, метод персонализированного переписывания поисковых запросов для коротких видео в WeChat, который использует human feedback с учётом степени точности его отражения намерения пользователя. Обучение проходит в три этапа: supervised fine-tuning на демонстрациях человеческих переформулировок, direct preference optimization по предпочтениям на основе последующего потребления контента и group relative policy optimization с наградой за точное совпадение с целевой переформулировкой. Такой подход снижает intent drift, когда модель выбирает вовлекающий контент вместо реальной потребности пользователя. Офлайн-эксперименты показывают превосходство компактной модели WeFair-2B над сильными базовыми LLM-методами, а онлайн A/B-тест даёт рост effective video-view rate на 2.593% и снижение query reformulation rate на 2.350%.'}, 'en': {'title': 'Rewrite for the User’s Intent, Not Just Their Next Click', 'desc': 'WeFair is a personalized query rewriting system for short-video search that aims to capture what a user means without changing their intent. It aligns models through three stages of human feedback: demonstrations teach query rewriting, preferences reflect feedback from users’ later behavior, and verification checks that rewrites match human reformulations or preserve the original intent. The approach combines supervised fine-tuning, direct preference optimization, and group relative policy optimization, with strict verification helping to limit intent drift. In experiments, WeFair-2B improved accuracy and intent preservation, and an online test increased effective video views by 2.593% while reducing query reformulations by 2.350%.'}, 'zh': {'title': '以意图忠实度为核心，让查询改写更懂用户', 'desc': '这篇论文提出 WeFair，用于短视频搜索中的个性化查询改写，目标是在低延迟条件下准确理解含糊查询，同时避免改写偏离用户当下意图。它按反馈与个性化意图的贴合程度，依次采用示范、偏好和验证三个阶段：先用人工改写数据进行监督微调，再通过直接偏好优化学习用户反馈中的相对偏好，最后用组相对策略优化强化对目标改写的精确匹配。实验表明，严格验证有助于减少意图漂移，WeFair-2B 在离线准确率和意图保留方面优于强基线。线上测试中，有效视频观看率相对提升 2.593%，查询改写率相对降低 2.350%，该系统已部署于微信短视频搜索。'}}}, {'id': 'https://huggingface.co/papers/2610.37918', 'title': 'Venus-DefakerOne2: A Vision-Forensics Foundation Model with Broader Coverage', 'url': 'https://huggingface.co/papers/2610.37918', 'abstract': 'Abstract Venus-DefakerOne2 is a unified anti-forgery foundation model that extends detection to diverse forgery forms and media types through alternating LoRA and full-parameter tuning and entropy-based test adaptation.  Generated by thinkingmachines/Inkling-Small Real-world forgery is inherently heterogeneous: it manifests not only as digital manipulation but also as physical spoofing, and is carried not only by images but also by videos. Despite substantial progress, a unified anti-forgery foundation model covering such a broad threat spectrum remains absent. In this paper, we present Venus-DefakerOne2, which substantially extends the forensic capability boundary along both the forgery-form and media-type dimensions. Trained on tens of millions of open-source and in-house samples, it incorporates two key designs. Tide-Style-Tuning alternates LoRA and full-parameter fine-tuning to balance computational efficiency, generalization, and hard-sample fitting while mitigating catastrophic forgetting. Entropy-based Test Adaptation determines the optimal prediction modality by analyzing prediction entropy. Venus-DefakerOne2 achieves new state-of-the-art performance across a comprehensive suite of benchmarks, including DeepFake faces (96.7%), AI-generated images (93.3%), tampered documents (87.6%), manipulated natural images (89.6%), physical spoofs (93.1%), and AI-generated videos (96.0%). It significantly outperforms both specialized expert models and its predecessor, DefakerOne, establishing itself as a powerful and versatile foundation model for binary-decision forensic tasks.', 'score': 4, 'issue_id': 3489, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': 'd9c26cdf88ea5276', 'authors': ['Chenfan Qu', 'Yachao Liang', 'Mingqi Fang', 'Jiangwei Xie', 'Zhenming Wang', 'Baoyue Zhang', 'Changjiang Jiang', 'Zheng Chang', 'Fanli Jin', 'Xuekang Zhu', 'Kaiwen Feng', 'Junchi Li', 'Weihong Zhang', 'Haoyue Wang', 'Chenfeng Zhang', 'Yinan Xia', 'Fangming Cui', 'Dong Fan', 'Jingjing Liu', 'Tianyi Zhang', 'Luobin Chen', 'Ji-Zhe Zhou', 'Sheng Li', 'Wei Wang', 'Bin Li', 'Ran He', 'Xinpeng Zhang', 'Linna Zhou', 'Jian Liu', 'Weiqiang Wang'], 'affiliations': ['Ant Group', 'Technical Committee on Digital Media Forensics and Security, CSIG'], 'pdf_title_img': 'assets/pdf/title_img/2610.37918.jpg', 'data': {'categories': ['#security', '#training', '#benchmark', '#video', '#cv'], 'emoji': '🛡️', 'ru': {'title': 'Одна модель, чтобы распознать любую подделку', 'desc': 'Статья представляет Venus-DefakerOne2 — унифицированную foundation model для обнаружения подделок, которая охватывает DeepFake-лица, сгенерированные AI изображения и видео, подделанные документы, физические спуфинги и манипуляции с изображениями. Модель обучена на десятках миллионов образцов и использует чередование LoRA и full-parameter fine-tuning (Tide-Style-Tuning), что balances вычислительную эффективность, обобщающую способность и сохранение знаний при catastrophic forgetting. Дополнительно применяется Entropy-based Test Adaptation, которая выбирает оптимальную модальность предсказания по энтропии выходов модели. Venus-DefakerOne2 достигает state-of-the-art результатов на широком наборе бенчмарков и превосходит как специализированные expert-модели, так и предшественника DefakerOne.'}, 'en': {'title': 'One Forensic Model to Detect Forgery Across Media', 'desc': 'Venus-DefakerOne2 is a unified anti-forgery foundation model that detects digital and physical forgeries across images and videos. It is trained on tens of millions of samples and uses Tide-Style-Tuning, which alternates LoRA with full-paramet
