 multiple online stores, researching the market, negotiating with suppliers to source inventory, optimizing sales strategies, fulfilling orders, handling returns, and managing cash flow to maximize its end-of-year total assets. To construct a realistic merchant-side operating environment, the product and supplier data are derived from a real e-commerce platform, while a year-long calendar of promotions, natural disasters, and supply-chain shocks continually reshapes demand. For reproducibility, both sides of the market are deterministic: customer purchases and returns follow a fixed demand model, while a negotiation kernel determines supplier pricing, concessions, and decisions, with an LLM used only to verbalize them. We evaluate 18 frontier models across seven dimensions, including year-end assets, and find that no single model dominates. GPT-5.6 Sol earns the most, growing the 100,000 opening stake into 1,431,425, yet it ranks 16th of 18 on fraud avoidance and trails Fable5 in operational efficiency. Among open-weight models, Qwen3.8-Max-Preview leads with 416,252, 38% above GLM 5.2 (high), and achieves the strongest learning over the horizon, progressively bargaining down prices across repeated orders. Our code is available at https://github.com/QwenLM/E-CommerceBench.', 'score': 4, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '0f59309e02c7d93d', 'authors': ['Wei Fan', 'Xinjie Shen', 'Xudong Guo', 'Jianhong Tu', 'Yang Su', 'Yinger Zhang', 'Lianghao Deng', 'Fengyu Wang', 'Baohua Dong', 'Yangqiu Song', 'Dayiheng Liu'], 'affiliations': ['Department of Computer Science and Engineering, HKUST', 'Qwen Team, Alibaba Group', 'Taobao & Tmall Group, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.30730.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#dataset', '#agents', '#benchmark', '#long_context'], 'emoji': '🏪', 'ru': {'title': 'Долгосрочная адаптация LLM-агентов в симуляции многолетнего управления электронным магазином', 'desc': 'В работе представлен E-Commerce Bench — первый открытый бенчмарк для оценки способности LLM-агентов выполнять долгосрочные задачи в условиях динамичной среды. Агент управляет несколькими интернет-магазинами в течение года, проводя переговоры с поставщиками, оптимизируя стратегии продаж, обрабатывая заказы и управляя денежными потоками при возникновении различных рыночных событий. Исследование оценивает 18 современных моделей по семи метрикам, включая итоговые активы, и показывает, что не существует универсальной модели, превосходящей остальные по всем параметрам. Результаты демонстрируют разнообразие сильных и слабых сторон: лучшие модели достигают высокого финансового результата, но проигрывают в других аспектах, таких как предотвращение мошенничества и операционная эффективность.'}, 'en': {'title': 'Navigating E-Commerce Complexity with LLMs', 'desc': 'This paper presents E-Commerce Bench, a novel benchmark for evaluating Large Language Models (LLMs) in complex, long-term e-commerce scenarios. It focuses on multi-store negotiation and dynamic market events, requiring LLMs to adapt their strategies over a year-long simulation. The benchmark assesses 18 advanced models on their ability to manage various business operations, including inventory sourcing and sales optimization, while responding to real-world challenges like promotions and supply chain disruptions. Results show that while some models excel in asset growth, others perform better in fraud avoidance and operational efficiency, highlighting the diverse strengths of different LLMs in e-commerce tasks.'}, 'zh': {'title': '评估LLM在电子商务中的表现', 'desc': '这篇论文介绍了一个名为E-Commerce Bench的开源基准测试，旨在评估大型语言模型（LLM）在电子商务中的表现。测试涵盖了多轮谈判、动态市场事件和长期策略适应，模拟了一个为期一年的商业运营环境。研究发现，尽管GPT-5.6 Sol在年终资产增长方面表现最佳，但在防止欺诈和运营效率方面却排名较低。通过对18个前沿模型的评估，论文展示了不同模型在复杂商业环境中的学习和适应能力。'}}}, {'id': 'https://huggingface.co/papers/2608.27509', 'title': 'The Mechanics of Democratic Dominance: A System Dynamics Paradigm for Dynamic Consent Engineering', 'url': 'https://huggingface.co/papers/2608.27509', 'abstract': "Abstract  Traditional frameworks of political communication operate under linear, event-driven assumptions that treat voter persuasion as a static, transactional function. This paper introduces Dynamic Consent Engineering (DCE), a novel interdisciplinary paradigm that synthesizes Edward Bernays' foundational principles of public relations with the S-E-E-D (Snowball, Equilibrium, Elasticity, Dominance) framework of system dynamics. By expanding Bernaysian operational constraints into a four-dimensional resource matrix (incorporating algorithmic media infrastructure alongside manpower, mindpower, and capital), we mathematically formalize how democratic institutions construct, optimize, and sustain political dominance. We map Bernays' classic eight-step engineering workflow directly onto non-linear feedback loops, information time lags, and demographic carrying capacities. Through rigorous modeling of systemic feedback structures, we isolate the dynamic root causes of political elasticity, policy resistance plateaus, and threshold-triggered trust collapses. Finally, we establish a four-step diagnostic pipeline and validate the framework via historical reference mode verification, demonstrating that long-term political stability depends not on ephemeral rhetoric, but on the structural synchronization of policy execution and dynamic feedback calibration.", 'score': 3, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '79ad1241f46c3c79', 'authors': ['Muhammad Sukri Bin Ramli'], 'affiliations': ['Asia School of Business, Kuala Lumpur, Malaysia'], 'pdf_title_img': 'assets/pdf/title_img/2608.27509.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Инженерия политического консенсуса через системную динамику', 'desc': 'В работе предлагается новая парадигма Dynamic Consent Engineering, которая объединяет принципы публичных отношений Эдварда Бернейса с фреймворком системной динамики S-E-E-D. Авторы разрабатывают математическую модель, описывающую, как политические институты конструируют и поддерживают влияние через четырехмерную матрицу ресурсов, включающую медиа-инфраструктуру, кадровые и финансовые возможности. Исследование отображает классический восьмиэтапный процесс инженерии Бернейса на нелинейные циклы обратной связи и демографические ограничения. Через анализ системной динамики авторы показывают, что политическая стабильность зависит не от риторики, а от структурной синхронизации между реализацией политики и калибровкой динамических обратных связей.'}, 'en': {'title': 'Dynamic Consent Engineering: Redefining Political Stability through Feedback Loops', 'desc': 'This paper presents Dynamic Consent Engineering (DCE), a new approach that combines traditional public relations principles with modern system dynamics. It introduces a four-dimensional resource matrix that includes algorithmic media, manpower, mindpower, and capital to analyze how political institutions maintain power. The authors use mathematical modeling to explore complex feedback loops and their impact on political stability and voter trust. Ultimately, the study emphasizes that lasting political success relies on aligning policy actions with dynamic feedback mechanisms rather than just persuasive messaging.'}, 'zh': {'title': '动态同意工程：政治沟通的新视角', 'desc': '这篇论文提出了一种新的动态同意工程（DCE）框架，结合了爱德华·伯内斯的公共关系原则和系统动态的S-E-E-D框架。通过将伯内斯的操作约束扩展到一个四维资源矩阵，论文数学化地描述了民主机构如何构建、优化和维持政治主导地位。研究还将伯内斯的经典八步工程工作流程映射到非线性反馈循环和信息时间滞后上，揭示了政治弹性和政策抵抗的动态根源。最后，论文建立了一个四步诊断流程，验证了长期政治稳定依赖于政策执行与动态反馈校准的结构同步。'}}}, {'id': 'https://huggingface.co/papers/2609.00968', 'title': 'ReFlowSET: Representation-Aligned Latent Flow Matching for SAR-to-EO Image Translation', 'url': 'https://huggingface.co/papers/2609.00968', 'abstract': 'Abstract ReFlowSET selects a latent codec via joint SAR-EO reconstruction and trains a small conditional DiT with dual-stream conditioning and frozen vision-model alignment for high-fidelity SAR-to-EO translation.  Generated by thinkingmachines/Inkling-Small SAR-to-EO image translation aims to generate electro-optical (EO) imagery from synthetic aperture radar (SAR) observations. Existing latent diffusion approaches typically inherit a predetermined autoencoder, although reconstruction fidelity can vary substantially across codecs and modalities. Because the latent codec affects the round-trip preservation of both SAR conditions and EO targets, codec selection constitutes a fundamental design choice; nevertheless, existing methods largely rely on codecs pretrained on natural images. To remedy this, we introduce ReFlowSET, a conditional latent flow-matching framework that selects its codec through a joint SAR--EO reconstruction audit. Rather than inheriting a heavyweight pretrained generator, ReFlowSET trains a substantially smaller conditional DiT from scratch in the selected latent space, using dual-stream SAR conditioning followed by joint feature refinement. To provide semantic guidance for this from-scratch training, intermediate noisy-EO features are aligned with clean target-EO representations extracted by a frozen vision foundation model. This alignment is used only during training and introduces no additional inference cost. Experiments on QXS-SAROPT and SAR2Opt demonstrate state-of-the-art performance across diverse perceptual fidelity and distributional metrics. Code and pretrained weights are publicly available at https://github.com/KAIST-VICLab/ReFlowSET.', 'score': 2, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '894376183c914db6', 'authors': ['Jeonghyeok Do', 'Seungchul Lee', 'Munchurl Kim'], 'affiliations': ['KAIST', 'Stellarvision Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.00968.jpg', 'data': {'categories': ['#multimodal', '#cv', '#small_models', '#open_source', '#training', '#diffusion', '#architecture'], 'emoji': '🛰️', 'ru': {'title': 'Умный выбор кодека для трансляции радиолокационных снимков в оптические изображения', 'desc': 'ReFlowSET — это метод условного трансляции изображений из радиолокационных снимков (SAR) в электрооптические (EO) изображения. Ключевая особенность подхода заключается в автоматическом выборе оптимального латентного кодека через совместную реконструкцию SAR и EO, что обеспечивает лучшее сохранение информации обеих модальностей. Модель использует компактную условную Diffusion Transformer с двухпотоковым кондиционированием и выравниванием признаков с помощью замороженной предобученной модели зрения для семантического руководства. Метод демонстрирует состояние искусства на бенчмарках QXS-SAROPT и SAR2Opt по различным метрикам качества и распределения сгенерированных изображений.'}, 'en': {'title': 'ReFlowSET: Optimizing SAR-to-EO Translation with Smart Codec Selection', 'desc': 'The paper introduces ReFlowSET, a novel framework for translating synthetic aperture radar (SAR) images into electro-optical (EO) imagery. It emphasizes the importance of selecting an appropriate latent codec for effective SAR-to-EO reconstruction, as existing methods often rely on codecs pretrained on natural images, which may not perform well. ReFlowSET trains a smaller conditional diffusion model from scratch, utilizing dual-stream conditioning and aligning features with a frozen vision model to enhance training efficiency. The results show that ReFlowSET achieves superior performance in generating high-fidelity EO images compared to traditional methods, demonstrating its effectiveness in the field of image translation.'}, 'zh': {'title': 'ReFlowSET：高保真SAR到EO图像翻译的新方法', 'desc': 'ReFlowSET是一种条件潜在流匹配框架，旨在通过联合SAR-EO重建选择潜在编码器，以实现高保真度的SAR到EO图像翻译。该方法训练了一个小型的条件DiT模型，利用双流条件和冻结的视觉模型对齐，来提高重建的准确性。与传统方法不同，ReFlowSET不依赖于预训练的重型生成器，而是在选定的潜在空间中从头开始训练模型。实验结果表明，ReFlowSET在多种感知保真度和分布指标上表现出色，达到了最先进的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.00137', 'title': 'Recursive Criticality of AI Self-Improvement', 'url': 'https://huggingface.co/papers/2609.00137', 'abstract': 'Abstract A recursive reproduction number determines whether AI R&D feedback loops become self-amplifying based on research productivity, feedback strength, and rising difficulty.  Generated by thinkingmachines/Inkling-Small AI is increasingly used in the R\\&D process that produces future AI systems. We study the conditions under which this feedback becomes self-amplifying. Our model describes how the rate of AI capability growth depends on baseline research productivity, recursive feedback, and the increasing difficulty of research progress. We derive a recursive reproduction number, R_{AI}, that determines whether improvements are amplified or damped across development cycles. This quantity compares the strength of feedback with the rate at which further progress becomes more difficult. When R_{AI}>1, the effects of improvements compound across development cycles, placing the system in a self-amplifying regime. When R_{AI}<1, their effects weaken across cycles. The transition depends on the structure of the AI R\\&D feedback loop and need not occur at any particular level of model capability. A system can therefore enter a self-amplifying regime before acceleration becomes visible, while rapid progress can also occur without self-amplification. Higher baseline research productivity can accelerate progress without changing whether the system is self-amplifying, but the duration of the development cycle becomes a limiting timescale for amplification. Increasing research difficulty can end a period of self-amplification. Extending the model to multiple research actors shows that improvements shared across organizations can make the overall research ecosystem self-amplifying even when no individual actor is. The framework identifies measurable properties of AI R\\&D systems that can help distinguish recursive amplification from rapid progress driven by other sources, including the strength of recursive feedback, how effectively improvements propagate into successor systems, cycle duration, and the increasing difficulty of further progress.', 'score': 1, 'issue_id': 3203, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '4a554eb5b82f2741', 'authors': ['Mikhail Burtsev'], 'affiliations': ['London Institute for Mathematical Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2609.00137.jpg', 'data': {'categories': ['#math'], 'emoji': '🔄', 'ru': {'title': 'Спираль инноваций: когда развитие AI начинает ускорять само себя', 'desc': 'Статья исследует условия, при которых обратная связь в разработке AI становится самоусиливающейся. Авторы вводят концепцию коэффициента репродукции R_AI, который определяет, усиливаются или ослабляются улучшения системы между циклами развития. Когда R_AI больше 1, эффекты улучшений накапливаются и система входит в режим самоусиления; когда меньше 1, эффекты затухают. Модель показывает, что переход в режим самоусиления зависит от структуры feedback loop и может произойти до того, как ускорение станет видимым, а также что обмен улучшениями между организациями может сделать всю экосистему исследований самоусиливающейся.'}, 'en': {'title': 'Understanding Self-Amplifying Feedback in AI R&D', 'desc': 'This paper introduces a model to analyze how AI research and development (R&D) can lead to self-amplifying feedback loops. It defines a recursive reproduction number, R_{AI}, which indicates whether improvements in AI capabilities will compound over time or diminish. The study highlights that when R_{AI} is greater than one, the system experiences self-amplification, while values less than one indicate weakening effects. Additionally, the model considers factors like research productivity and increasing difficulty, showing that even without visible acceleration, a system can still enter a self-amplifying state.'}, 'zh': {'title': '探索人工智能研发的自我增强机制', 'desc': '本文研究了人工智能研发中的反馈循环如何影响技术的自我增强。我们提出了一个递归再生产数R_{AI}，用于判断改进是否在开发周期中得到放大。当R_{AI}大于1时，改进的效果会在周期中累积，形成自我增强的状态；而当R_{AI}小于1时，效果会减弱。通过分析不同的研究参与者，我们发现即使个体不具备自我增强能力，整体研发生态系统仍然可以实现自我增强。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (6)', '#agents (19)', '#agi', '#alignment (2)', '#architecture (11)', '#audio (1)', '#benchmark (26)', '#cv (6)', '#data (2)', '#dataset (14)', '#diffusion (4)', '#ethics (2)', '#games (3)', '#graphs', '#hallucinations (2)', '#healthcare', '#inference (4)', '#interpretability (4)', '#leakage', '#long_context (3)', '#low_resource (2)', '#machine_translation', '#math (4)', '#multilingual (2)', '#multimodal (24)', '#open_source (14)', '#optimization (12)', '#plp (2)', '#rag (1)', '#reasoning (7)', '#rl (7)', '#rlhf (6)', '#robotics (7)', '#science (5)', '#security (1)', '#small_models (11)', '#story_generation', '#survey', '#synthetic (1)', '#training (28)', '#transfer_learning (2)', '#video (7)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-02 14:53',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-02 14:53')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-02 14:53')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
