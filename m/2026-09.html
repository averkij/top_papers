d action models from large-scale egocentric video via a three-stage curriculum and a slow-fast architecture, substantially improving zero-shot robotic manipulation.  Generated by thinkingmachines/Inkling-Small Robotic manipulation faces a fundamental scaling challenge: robust generalization demands broad physical experience, yet action-labeled robot trajectories are expensive to collect and inherently limited in diversity. Egocentric videos offer a far more scalable source of embodied experience, capturing object interactions, contact dynamics, tool use, and long-horizon behaviors across diverse environments. The central challenge is how to convert this abundant but action-free experience into effective robot control. We introduce ZimaBlue, a scalable framework for learning generalizable World Action Models (WAMs) from large-scale video. ZimaBlue follows a three-stage training curriculum: it first performs causal embodied video pre-training on large-scale human and robot egocentric videos, then grounds the learned visual dynamics in heterogeneous robot trajectories through video-action mid-training with a unified action representation, and finally specializes the model to a target robot for deployment. To make generative WAMs practical for real-time control, ZimaBluefurther adopts an asynchronous Slow-Fast dual-system architecture, where a high-capacity Slow world model provides generalizable spatiotemporal representations and a lightweight Fast branch enables 30 Hz action prediction on NVIDIA RTX 4090. On real-robot zero-shot evaluations, scaling from target-robot data alone to over 120,000 hours of embodied video improves success from 36.1% to 77.8%. ZimaBlue further delivers strong performance across multiple benchmarks, with particularly pronounced gains on unseen tasks.', 'score': 39, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b3a9d08afb107c29', 'authors': ['Xionghao Wu', 'Yijun Yang', 'Shiyang Zhou', 'Haoze Sun', 'Jianhui Liu', 'Songsong Yu', 'Jiyao Zhang', 'Wenbo Li', 'Bo Wang', 'Guoqing Ma', 'Lin Song', 'Renjie Liao', 'Shenghe Zheng', 'Wei Tang', 'Xiaojuan Qi', 'Yanwei Li', 'Yuan Zhang', 'Zhuotao Tian', 'Haoyang Huang', 'Nan Duan'], 'affiliations': ['Joy Future Academy'], 'pdf_title_img': 'assets/pdf/title_img/2609.00188.jpg', 'data': {'categories': ['#robotics', '#architecture', '#training', '#video'], 'emoji': '🤖', 'ru': {'title': 'От видео людей к действиям роботов через обобщаемые модели мира', 'desc': 'ZimaBlue — это фреймворк для обучения обобщаемых моделей действий в мире (World Action Models) из больших объёмов эгоцентрического видео. Система использует трёхэтапный учебный план: сначала предварительное обучение на видео с причинно-следственными связями, затем привязка к траекториям робота с единой репрезентацией действий, и наконец специализация для целевого робота. Для эффективного реального управления применяется асинхронная архитектура Slow-Fast с мощной медленной моделью для пространственно-временных представлений и лёгкой быстрой ветвью для предсказания действий на 30 Hz. Эксперименты показывают, что масштабирование с 120,000 часов эгоцентрического видео улучшает успех манипуляций робота с 36.1% до 77.8% в нулевых условиях обучения.'}, 'en': {'title': 'Learning to Manipulate: Robots that Understand from Video', 'desc': 'ZimaBlue is a machine learning framework designed to improve robotic manipulation by learning from large amounts of egocentric video data. It uses a three-stage curriculum to train models that can generalize actions without needing extensive labeled data. The framework incorporates a Slow-Fast architecture, allowing it to balance detailed world modeling with fast action predictions. As a result, ZimaBlue significantly enhances the ability of robots to perform tasks they have not been explicitly trained on, achieving impressive success rates in zero-shot evaluations.'}, 'zh': {'title': 'ZimaBlue：从视频中学习通用机器人控制', 'desc': 'ZimaBlue 是一个从大规模自我中心视频中学习通用世界动作模型的框架，旨在提高零-shot 机器人操作的能力。它采用三阶段的训练课程，首先在大规模人类和机器人视频上进行因果预训练，然后通过视频-动作中期训练将学习到的视觉动态与异构机器人轨迹结合，最后将模型专门化以适应目标机器人。ZimaBlue 还采用了异步的慢-快双系统架构，使得高容量的慢世界模型提供通用的时空表示，而轻量级的快分支则实现了实时的动作预测。通过使用超过 120,000 小时的自我中心视频，ZimaBlue 在真实机器人零-shot 评估中显著提高了成功率，从 36.1% 提升至 77.8%。'}}}, {'id': 'https://huggingface.co/papers/2609.01572', 'title': 'From Production Traffic to Post-Training: Building a Self-Hosted LLM That Covers the Corporate Request Mix', 'url': 'https://huggingface.co/papers/2609.01572', 'abstract': "Abstract A smaller self-hosted LLM trained with separate GRPO experts merged via SLERP outperforms a much larger baseline on instruction following, function-calling, and internal tasks while serving half of platform traffic at lower cost.  Generated by thinkingmachines/Inkling-Small Data-residency constraints force enterprises to self-host LLMs, but continuous adoption of newer models without decommissioning their predecessors expands the serving fleet, fragmenting a finite GPU pool. We consolidate traffic from over 200 internal applications onto a single model by closing quality gaps identified through production error analysis along three axes: instruction following, function-calling, and internal task distribution. Quality is tracked by offline benchmarks stratified to production traffic and scored by deterministic verifiers or calibrated LLM judges. Rather than optimising all objectives jointly, which introduces cross-domain reward interference, we train a separate GRPO expert per axis and merge them via two-stage SLERP. Each expert's reward exposes a distinct failure mode, namely semantic collapse, over-calling, and verbosity hacking, each requiring a domain-specific fix. In non-reasoning mode the recipe surpasses a {sim}7times larger by total parameters baseline on the in-house Arena with 69.6 to 65.8, instruction following with 0.85 to 0.83, and function-calling with 0.79 to 0.77, while lifting general dialogue benchmarks. The model absorbs 50% of platform traffic, 116M requests per month, at a fraction of the serving cost.", 'score': 31, 'issue_id': 3203, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '32c8c09e8cd79591', 'authors': ['Olga Tsymboi', 'Dmitrii Stoianov', 'Ramil Latypov', 'Danil Taranets', 'Daniil Dryabin', 'Mikhail Gashkov', 'Viktor Zelenkovskiy', 'Aleksandr Fida', 'Gleb Alektorov', 'Nikita Gulyakov', 'Arthur Babkin', 'Aleksandr Medvedev', 'Pavel Gein', 'Anatolii Potapov'], 'affiliations': ['T-Tech'], 'pdf_title_img': 'assets/pdf/title_img/2609.01572.jpg', 'data': {'categories': ['#small_models', '#benchmark', '#training', '#rlhf'], 'emoji': '⚡', 'ru': {'title': 'Слияние экспертов вместо размера: как компактная LLM заменила гигант', 'desc': 'Исследователи разработали компактную самостоятельно размещённую LLM, которая обучается несколькими специализированными экспертами GRPO, оптимизированными для разных задач: следования инструкциям, вызова функций и внутренних приложений. Вместо совместной оптимизации всех целей, что вызывает конфликты между областями обучения, авторы тренируют отдельного эксперта для каждой оси и объединяют их через двухэтапную SLERP интерполяцию. Каждый эксперт выявляет уникальный тип ошибок — коллапс семантики, чрезмерный вызов функций и манипуляция многословностью — требующих специфичных для области решений. Полученная модель превосходит базовый вариант в семь раз больший по параметрам и обслуживает половину трафика платформы (116 млн запросов в месяц) при значительно меньших затратах на вычисления.'}, 'en': {'title': 'Smaller Model, Bigger Impact: Efficient LLM Performance', 'desc': "This paper presents a smaller self-hosted language model (LLM) that outperforms a significantly larger baseline model in various tasks such as instruction following and function-calling. The authors address the challenge of managing GPU resources by consolidating traffic from over 200 applications onto a single model, which is trained using separate Generalized Reward Policy Optimization (GRPO) experts for different tasks. By merging these experts through a two-stage Spherical Linear Interpolation (SLERP), the model effectively mitigates issues like semantic collapse and verbosity. The resulting model not only handles half of the platform's traffic but also does so at a lower operational cost while maintaining high performance across benchmarks."}, 'zh': {'title': '小模型，大智慧：自托管LLM的成功之道', 'desc': '这篇论文介绍了一种较小的自托管大型语言模型（LLM），通过将不同的GRPO专家合并，使用SLERP方法，能够在指令跟随、函数调用和内部任务上超越一个更大的基线模型。由于数据驻留的限制，企业需要自托管LLM，但不断采用新模型会导致GPU资源的分散。我们通过分析生产错误，识别质量差距，并在三个方面进行改进，成功将200多个内部应用的流量整合到一个模型上。最终，这个模型以更低的成本处理了50%的平台流量，显示出优越的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.30468', 'title': 'Hi-Q: Hierarchical Evidence-guided Query Refinement for Multi-Hop Question Answering', 'url': 'https://huggingface.co/papers/2608.30468', 'abstract': 'Abstract Hi-Q is an evidence-conditioned framework that dynamically refines multi-hop queries into hierarchical trees guided by corpus support signals, improving retrieval and answer accuracy without fixed graphs.  Generated by thinkingmachines/Inkling-Small A central bottleneck in multi-hop Question Answering (QA) is that the granularity at which a question is expressed often differs from the granularity at which corpus evidence is retrievable. Existing methods address this mismatch by imposing fixed graph structures over the corpus, by iteratively reformulating the query, or by executing a generated program over it, but these strategies do not explicitly decide when a query unit is already supported by evidence and when it should be refined. We formulate this bottleneck as retrievable granularity discovery and introduce Hi-Q, an evidence-conditioned framework for hierarchical query refinement. At each query node, a resolution operator tests whether retrieved evidence supports the current query unit; resolved nodes terminate, while unresolved nodes are expanded by a dependency-preserving binary operator and checked by a semantic coverage verifier. Hi-Q therefore grows a query tree whose topology is determined by corpus support signals rather than by a fixed decomposition template or a pre-built graph. We evaluate Hi-Q on three multi-hop QA benchmarks, primarily under full-corpus retrieval, where dependent evidence must be located among open-domain distractors rather than within a small annotated pool. In this setting Hi-Q reaches 52.3 EM and 64.0 F1 averaged over the three benchmarks, ahead of the iterative retrieval baseline IRCoT by 15.1 EM / 18.2 F1 on that same average, and ahead of the graph-based RAG baseline PropRAG by 11.5 EM / 12.0 F1 on MuSiQue-full, without corpus-wide graph construction. In the restricted supporting/distractor setting used by prior work, Hi-Q likewise attains the best accuracy, with 57.9 EM and 69.3 F1 on average, ahead of PropRAG by 5.6 EM / 3.9 F1 and IRCoT by 13.7 EM / 15.8 F1. The project page is available at https://hi-q-project.github.io/.', 'score': 25, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '122a18935dd76d6e', 'authors': ['Jueun Kim', 'Sungho Park', 'Wook-Shin Han'], 'affiliations': ['Department of Computer Science and Engineering, POSTECH', 'Graduate School of Artificial Intelligence, POSTECH'], 'pdf_title_img': 'assets/pdf/title_img/2608.30468.jpg', 'data': {'categories': ['#rag', '#benchmark'], 'emoji': '🌳', 'ru': {'title': 'Динамическое разбиение вопросов на иерархические деревья с поддержкой корпуса', 'desc': 'Hi-Q представляет фреймворк для многошагового поиска ответов, который динамически разбивает сложные вопросы на иерархические деревья запросов, руководствуясь сигналами поддержки из корпуса документов. Основная идея решает проблему несоответствия между уровнем детализации вопроса и уровнем, на котором информация доступна в корпусе. Система использует оператор разрешения для проверки, поддерживается ли текущий элемент запроса найденными доказательствами, а нерешённые узлы расширяются бинарным оператором с проверкой семантического покрытия. Hi-Q достигает лучших результатов на нескольких бенчмарках многошагового QA, превосходя методы на основе итеративного поиска и графовые подходы без необходимости предварительного построения графа всего корпуса.'}, 'en': {'title': 'Dynamic Query Refinement for Enhanced Multi-Hop QA', 'desc': 'Hi-Q is a novel framework designed to enhance multi-hop Question Answering (QA) by refining queries into hierarchical trees based on evidence from the corpus. It addresses the challenge of mismatched granularity between questions and retrievable evidence by dynamically determining when a query unit is supported by existing data. Instead of relying on fixed graph structures or iterative reformulations, Hi-Q uses an evidence-conditioned approach to grow a query tree guided by corpus support signals. This method significantly improves retrieval and answer accuracy, outperforming existing benchmarks in multi-hop QA tasks.'}, 'zh': {'title': 'Hi-Q：动态层次查询细化的创新框架', 'desc': 'Hi-Q是一个基于证据的框架，能够动态地将多跳查询细化为由语料库支持信号引导的层次树，从而提高检索和答案的准确性，而不依赖于固定的图结构。该方法解决了多跳问答中，问题表达的粒度与可检索证据的粒度不匹配的问题。Hi-Q通过在每个查询节点上测试检索到的证据是否支持当前查询单元，来决定何时终止或扩展查询节点。通过这种方式，Hi-Q构建的查询树的拓扑结构由语料库的支持信号决定，而不是由固定的分解模板或预构建的图决定。'}}}, {'id': 'https://huggingface.co/papers/2609.01404', 'title': 'Evaluating Multimodal LLMs as Generalist Vision-Language-Action Agents for Drone Control: Commanding, Approaching, Tracking and Searching', 'url': 'https://huggingface.co/papers/2609.01404', 'abstract': "Abstract DroneCATS evaluates multimodal language models as drone controllers and finds that small open models navigate well but fail at protocol adherence and termination, highlighting a gap between spatial perception and disciplined action.  Generated by thinkingmachines/Inkling-Small Multimodal Large Language Models (MLLMs) are strong perceivers of images and video. We ask how far that reach extends into acting: dropping an MLLM directly into a drone's control loop, with its entire action space declared solely in the prompt. Recent systems approach this setting but increasingly narrow the model's decision-making. We widen it back. We introduce DroneCATS-Agent, an architecture where the MLLM is a swappable component, and DroneCATS, a benchmark treating the model as the independent variable. Beyond merely flying toward a pixel, our agent entrusts the model to yaw and search, deliberate when unsure, and self-declare arrival---all without fine-tuning or function-calling schemas. Evaluating frontier and open models across four core capabilities---approaching a visible target, tracking a moving one, searching outside the initial view, and commanding a multi-drone fleet---reveals that even the simplest embodied settings are far from solved. Crucially, to identify what breaks first at the edge, our roster scales down to 2B parameters. The findings expose a stark paradox: it is not the flying that fails. Small open models often navigate into the success radius more reliably than frontier models, yet lose the episode by declaring arrival prematurely or not at all. Multi-drone commanding amplifies this divide, with small models failing by blindly copying a single coordinate across distinct views. Viewed as vision-language-action agents, the models' spatial perception holds up, but their action protocol does not. What separates a deployable edge model from a frontier model is not navigation, but the discipline to sustain a declared protocol and emit the correct terminating action. The open problem is closing this gap at onboard compute costs---yielding a fast model that plans persistently and knows exactly when it is done---and DroneCATS is built to measure that distance.", 'score': 20, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '42b5cbb2f72bf82b', 'authors': ['Jaewoo Park', 'Minyoung Lee', 'Sukmin Seo', 'Moonbin Yim', 'Hyunwook Yoon', 'Dohoon Ryu', 'Daehee Kim', 'Myungseo Song', 'Jihyuk Byun', 'Seunggyu Chang', 'Taeho Kil', 'Jiseob Kim', 'Bado Lee', 'Geewook Kim'], 'affiliations': ['NAVER Cloud'], 'pdf_title_img': 'assets/pdf/title_img/2609.01404.jpg', 'data': {'categories': ['#multimodal', '#robotics', '#interpretability', '#open_source', '#small_models', '#agents', '#games', '#benchmark'], 'emoji': '🚁', 'ru': {'title': 'Восприятие против дисциплины: парадокс маленьких моделей в управлении дронами', 'desc': 'В работе представлена система DroneCATS для оценки мультимодальных языковых моделей (MLLM) в качестве контроллеров беспилотников. Исследование показывает, что маленькие открытые модели хорошо справляются с навигацией и восприятием визуальной информации, но часто нарушают установленные протоколы действий и неправильно определяют момент завершения задачи. Бенчмарк включает четыре ключевых способности: приближение к видимой цели, отслеживание движущихся объектов, поиск вне начального поля зрения и управление несколькими беспилотниками. Полученные результаты демонстрируют парадокс: пространственное восприятие моделей работает надёжно, но им не хватает дисциплины для соблюдения протоколов действий и правильной генерации сигнала завершения.'}, 'en': {'title': 'Bridging the Gap: From Navigation to Disciplined Drone Control', 'desc': 'The paper introduces DroneCATS, a framework for evaluating multimodal language models (MLLMs) as drone controllers. It finds that while smaller open models can navigate effectively, they struggle with adhering to action protocols and properly terminating tasks. The study highlights the importance of disciplined action over mere navigation capabilities, revealing that even simple tasks are not fully solved. The authors propose DroneCATS-Agent, which allows for flexible integration of MLLMs in drone control, aiming to bridge the gap between spatial perception and disciplined execution.'}, 'zh': {'title': '缩小空间感知与行动协议的差距', 'desc': 'DroneCATS评估了多模态语言模型作为无人机控制器的能力，发现小型开放模型在导航方面表现良好，但在遵循协议和终止操作方面存在不足。这表明空间感知与有序行动之间存在差距。我们引入了DroneCATS-Agent架构，使多模态大语言模型（MLLM）可以作为可替换组件，并创建了DroneCATS基准，专注于模型的独立变量。研究结果显示，尽管小型模型在导航上表现更可靠，但在执行操作协议时却常常提前或未能正确声明到达，揭示了可部署边缘模型与前沿模型之间的关键区别。'}}}, {'id': 'https://huggingface.co/papers/2609.01607', 'title': 'Uncovering Understanding-Generation Synergy in Native Unified Multimodal Models: From Representation, Task to System', 'url': 'https://huggingface.co/papers/2609.01607', 'abstract': 'Abstract Unified multimodal models achieve synergy between visual understanding and generation through specialized architectures, shared knowledge, and end-to-end optimization rather than simple functional unification.  Generated by thinkingmachines/Inkling-Small While unified multimodal models (UMMs) jointly perform visual understanding and generation within a single model, functional unification does not guarantee learning synergy: the two objectives may reinforce each other, compete for capacity, or merely coexist. We investigate their relationship at the representation, task, and system levels in a controlled, structurally native setting without pretrained vision priors. At the representation level, we find that each objective provides useful signal to the other: generation enriches the visual features learned for understanding, while understanding strengthens vision--language alignment for generation. However, when both objectives are forced through the same computation path, one tends to dominate. A task-decoupled architecture that specializes conflicting visual computation while preserving semantic interaction avoids this asymmetric degradation. At the task level, through three case studies, we find positive bidirectional transfer when understanding and generation tasks rely on shared knowledge. At the system level, we show that an end-to-end UMM outperforms a matched planner--executor pipeline on complex tasks that explicitly require both image understanding and generation. Together, these results show that the value of UMMs extends beyond a unified interface: appropriate specialization, shared task knowledge, and end-to-end optimization can turn coexistence into synergy.', 'score': 20, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'c4908ca47d939662', 'authors': ['Penghao Wu', 'Haiwen Diao', 'Weichen Fan', 'Lewei Lu', 'Dahua Lin', 'Ziwei Liu'], 'affiliations': ['S-Lab, Nanyang Technological University', 'SenseTime Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.01607.jpg', 'data': {'categories': ['#multimodal', '#cv', '#transfer_learning', '#architecture'], 'emoji': '🎨', 'ru': {'title': 'От сосуществования к синергии: специализация в объединённых мультимодальных моделях', 'desc': 'В работе исследуется, как объединённые мультимодальные модели, одновременно выполняющие задачи понимания и генерации изображений, могут достичь синергии между этими целями. Авторы показывают, что просто объединить две задачи недостаточно — они могут конкурировать за ресурсы модели или друг друга подавлять, поэтому требуется специализированная архитектура с разделением конфликтующих вычислений. На уровне представлений обнаружено, что генерация обогащает визуальные признаки для понимания, а понимание улучшает выравнивание визуальных и языковых пространств. Результаты демонстрируют, что правильная архитектура со специализацией, общим знанием задач и сквозной оптимизацией превращает сосуществование целей в истинную синергию.'}, 'en': {'title': 'Unlocking Synergy in Unified Multimodal Models', 'desc': 'This paper explores how unified multimodal models (UMMs) can effectively combine visual understanding and generation. It highlights that simply merging these functions does not ensure they work well together; instead, they can compete for resources or coexist without enhancing each other. The authors demonstrate that when tasks are decoupled and specialized, both understanding and generation can benefit from shared knowledge, leading to improved performance. Ultimately, they show that a well-structured UMM can outperform traditional systems by leveraging synergy through specialized architectures and end-to-end optimization.'}, 'zh': {'title': '统一多模态模型的协同效应', 'desc': '统一的多模态模型（UMMs）通过专门的架构、共享知识和端到端优化，实现视觉理解与生成之间的协同，而不仅仅是简单的功能统一。研究表明，生成任务可以丰富视觉特征，而理解任务则增强视觉与语言的对齐，但当两个目标强制通过同一路径计算时，往往会出现一个目标主导的情况。为了解决这一问题，采用任务解耦的架构可以专门处理冲突的视觉计算，同时保持语义交互。最终，研究结果表明，适当的专业化、共享任务知识和端到端优化能够将共存转化为协同效应。'}}}, {'id': 'https://huggingface.co/papers/2609.00092', 'title': 'Safin-1: Safety from Within through Memory-Native State Evolution', 'url': 'https://huggingface.co/papers/2609.00092', 'abstract': "Abstract Safin-1 introduces a memory-routing architecture that embeds safety as an internal, evolving model state rather than an external constraint.  Generated by thinkingmachines/Inkling-Small Long-horizon complex tasks require foundation models to accumulate information, maintain internal states, and adapt over extended interactions. Safety should be an intrinsic property of the model itself, rather than a behavioral constraint relying solely on external safeguards or post-hoc alignment such as supervised fine-tuning. This motivates Safety from Within, where safety-relevant capabilities are represented and invoked through the model's native computation. We present Safin-1, a family of foundation models realizing this principle through memory routing and state evolution. Safin-1 is built on Memory-Anchor Routing across Context History (MARCH), a network architecture that maintains structured memory states and selectively retrieves relevant historical information through content-conditioned routing. It supports test-time adaptation of persistent capability states without repeatedly modifying the backbone, enabling controlled specialization over a shared foundation. We investigate this interface on downstream safety tasks through a Safety State, demonstrating effective state-based adaptation with substantial safety improvements. More broadly, the routed-state interface unifies contextual memory and persistent capability adaptation within the model's native computation, reframing memory from a passive record of prior context into an active substrate for maintaining and evolving model behavior. Evaluations across general capabilities, long-context understanding, retrieval, and efficiency further validate Safin-1. These findings provide a path toward safety as a state-native and adaptively maintainable capability. This work is only an initial architectural exploration of Safety from Within, and substantial further work is needed to realize this broader vision.", 'score': 19, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '08153fd142d51659', 'authors': ['Ming Zhang', 'Kaisen Yang', 'Shu Yu', 'Ermo Hua', 'Zhekai Chen', 'Cheng Jin', 'Jingnan Zheng', 'Yi Zhang', 'Zhongtian Ma', 'Jiawei Zhou', 'Sirui Chen', 'Qiaosheng Zhang', 'Xiang Wang', 'Ning Ding', 'Xia Hu', 'Bowen Zhou', 'Youbang Sun', 'Chaochao Lu'], 'affiliations': ['Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2609.00092.jpg', 'data': {'categories': ['#interpretability', '#alignment', '#long_context'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность из глубины: встроенное состояние вместо внешних ограничений', 'desc': 'В работе предложена архитектура Safin-1, которая встраивает безопасность как внутреннее, эволюционирующее состояние модели, а не как внешнее ограничение. Основу составляет алгоритм MARCH (Memory-Anchor Routing across Context History), который поддерживает структурированную память и селективно извлекает релевантную историческую информацию через content-conditioned routing. Модель поддерживает адаптацию во время инференса через специальное состояние безопасности, что позволяет контролируемую специализацию без модификации основной архитектуры. Работа демонстрирует, что безопасность может быть встроена как нативная способность модели, развивающаяся через её собственные вычисления и управление памятью.'}, 'en': {'title': 'Safety from Within: Evolving Model States for Intrinsic Safety', 'desc': "The paper introduces Safin-1, a novel memory-routing architecture that integrates safety directly into the model's internal state rather than relying on external constraints. This approach, termed 'Safety from Within', allows the model to adapt and maintain safety-relevant capabilities through its own computations. Safin-1 utilizes a technique called Memory-Anchor Routing across Context History (MARCH) to manage and retrieve structured memory states, enabling the model to specialize its capabilities without altering its core structure. The research demonstrates that this architecture significantly enhances safety in long-horizon tasks by allowing the model to evolve its behavior based on past experiences."}, 'zh': {'title': '安全性内生化：Safin-1的创新之路', 'desc': 'Safin-1提出了一种内存路由架构，将安全性作为模型内部不断演变的状态，而不是外部约束。该模型能够在长时间复杂任务中积累信息，保持内部状态，并在延续的交互中进行适应。安全性应当是模型自身的内在属性，而不是仅依赖外部保护措施或后期调整。通过内存锚定路由（MARCH），Safin-1实现了结构化的记忆状态和选择性检索相关历史信息，从而在模型的原生计算中有效地维护和演变安全能力。'}}}, {'id': 'https://huggingface.co/papers/2608.26623', 'title': 'AgentJudgeBench: A Multi-Difficulty Benchmark for Evaluating LLM Judges on Agentic Tool-Calling', 'url': 'https://huggingface.co/papers/2608.26623', 'abstract': 'Abstract AgentJudgeBench reveals that LLM judges face structural reliability limits on dependency-driven agentic tool-calling workflows, with alignment degrading by difficulty and ground-truth exposure yielding mixed effects.  Generated by thinkingmachines/Inkling-Small LLM judges are widely used to evaluate agentic tool-calling systems, yet their reliability on structured, dependency-driven workflows remains largely unexamined. We present AgentJudgeBench, the first benchmark to systematically study LLM-as-a-judge reliability for agentic tool-calling over workflow DAGs, as distinct from the broader LLM-as-a-judge task of open-ended text or preference evaluation. The benchmark comprises 3,808 instances spanning six DAG topologies and three difficulty tiers, evaluated with five generators (3B-70B open-weight models and GPT-5.4) and six judges (20B to frontier scale) under paired with- and without-ground-truth conditions. Judge alignment degrades monotonically with task difficulty, 1.5x faster without ground truth, and on hard queries without ground truth all six judges converge to a narrow 77-82% band regardless of scale, revealing a structural ceiling driven primarily by task difficulty, though its height is partly prompt-dependent for weaker generators, that model capacity alone cannot overcome. Ground-truth exposure is not uniformly beneficial: it reduces alignment for GPT-5.4 (1.5 pp) and Gemini-2.5-Pro (3.9 pp), consistent with over-anchoring. Among mitigation strategies, chain-of-thought reasoning and judge temperature both have negligible effect, while structured evaluation rubrics improve alignment by up to 6.5 pp but do not generalize uniformly across judge-generator pairs. With ground truth, QwQ-32B best matches the programmatic reference, while a human validation study identifies GPT-OSS-120B as the most human-aligned judge; without it, frontier judges lead only marginally within the shared ceiling. These results expose fundamental limitations of current LLM judges and yield practical guidelines for reliable evaluation in agentic systems.', 'score': 16, 'issue_id': 3206, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '74259f3eb3e8d047', 'authors': ['Abhigya Verma', 'Amit Kumar Saha', 'Seganrasan Subramanian', 'Sai Harshitha Aluru'], 'affiliations': ['ServiceNow AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.26623.jpg', 'data': {'categories': ['#small_models', '#agents', '#alignment', '#benchmark', '#interpretability', '#open_source'], 'emoji': '⚖️', 'ru': {'title': 'Скрытые границы LLM-судей: когда масштаб модели не спасает от неудачи', 'desc': 'В работе представлена первая бенчмарк-система AgentJudgeBench для изучения надёжности LLM-судей при оценке многошаговых агентских систем с вызовом инструментов, организованных в виде ориентированных ациклических графов. Исследование показало, что качество оценок LLM-судей монотонно деградирует с усложнением задачи и падает в 1,5 раза быстрее без доступа к правильным ответам, создавая структурный потолок производительности, который не преодолевается увеличением размера модели. Предоставление эталонных ответов имеет неоднозначный эффект: улучшает результаты для одних генераторов, но ухудшает для других, включая GPT-4.5 и Gemini-2.5-Pro, из-за эффекта анкорирования. Структурированные рубрики оценки показали наибольший потенциал для улучшения, повышая согласованность на 6,5 процентных пункта, однако эффект не переносится универсально между парами судьи-генератора.'}, 'en': {'title': 'Unveiling the Limits of LLM Judges in Agentic Workflows', 'desc': 'The paper introduces AgentJudgeBench, a benchmark designed to evaluate the reliability of large language model (LLM) judges in assessing agentic tool-calling workflows. It reveals that the performance of these judges declines as task difficulty increases, particularly when ground truth is not provided. The study includes a comprehensive analysis of 3,808 instances across various difficulty levels and DAG topologies, highlighting that alignment issues are exacerbated without ground truth. Additionally, the findings suggest that while structured evaluation rubrics can enhance alignment, the overall limitations of LLM judges remain significant, indicating a need for improved evaluation strategies in agentic systems.'}, 'zh': {'title': '揭示LLM评判者的结构性局限性', 'desc': 'AgentJudgeBench揭示了大型语言模型（LLM）在依赖驱动的工具调用工作流中存在结构性可靠性限制。随着任务难度的增加，模型的对齐性逐渐下降，且在没有真实数据的情况下，模型的表现更差。该基准测试系统地研究了LLM作为评判者在工作流有向无环图（DAG）中的可靠性，涵盖了多种拓扑和难度层级。研究结果显示，当前的LLM评判者存在根本性局限性，并为在代理系统中进行可靠评估提供了实用指导。'}}}, {'id': 'https://huggingface.co/papers/2609.00768', 'title': 'DiagEvo: Diagnosis-Guided Self-Evolution via Hierarchical Error Memory', 'url': 'https://huggingface.co/papers/2609.00768', 'abstract': "Abstract DiagEvo improves language-model self-evolution by deriving training direction from internal failure history via hierarchical error-cause memory and double-confidence filtering, outperforming external-resource baselines.  Generated by thinkingmachines/Inkling-Small Self-play is an effective paradigm for language-model self-evolution, but without guidance, solver performance can plateau or decline across rounds. Unguided methods steer question generation with signals such as difficulty, learnability, or diversity. These signals keep questions challenging and varied but do not specify which unresolved reasoning weaknesses later rounds should target. Guided methods obtain direction from external task resources, including human examples, document corpora, or specified difficulty targets, and therefore rely on task information supplied outside the self-play loop. We show that the needed direction can instead be derived from the solver's own failure history. We introduce DiagEvo, whose diagnostician extracts recurring error causes from this history and stores them in a hierarchical error-cause memory. The memory groups related causes under skill nodes and tracks each as Active or Mastered according to self-consistency on targeted questions. The challenger uses these states and recurrence counts to balance cause-targeted generation with free exploration. Double-confidence filtering retains intermediate-difficulty questions only when the most common solver answer has a clear vote lead. DiagEvo derives its curriculum from information produced during self-play, without external task resources. With the default 4B diagnostician, DiagEvo outperforms every baseline in mean accuracy across all nine benchmarks for each of the three solvers: Qwen3-4B, Qwen3-8B, and OctoThinker-8B. On Qwen3-8B, it reaches 72.3% mean accuracy across five mathematical reasoning benchmarks, 4.5 percentage points above R-Zero. Its mean accuracy across all nine benchmarks is 57.4%, 1.1 percentage points above DARC. Ablations show that the hierarchical error-cause memory and double-confidence filtering both contribute to these gains.", 'score': 14, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'e57196526d792bbb', 'authors': ['Xincheng Wei', 'Yifan Ding', 'Yoshua Li', 'Dongsheng Ma', 'Rongxiang Weng', 'Xunliang Cai', 'Wenjian Ding', 'Yao Zhang'], 'affiliations': ['Faculty of Health Data Science, Juntendo University, Chiba, Japan', 'Meituan, LongCat Team', 'Peking University', 'School of Statistics and Data Science, LPMC, KLMDASR & AAIS, Nankai University, China', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2609.00768.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#training', '#math', '#rl'], 'emoji': '🔄', 'ru': {'title': 'Самообучение языковых моделей через анализ собственных ошибок', 'desc': 'DiagEvo — это метод самосовершенствования языковых моделей, который использует историю ошибок самой модели для определения направления обучения, вместо полагания на внешние ресурсы. Система включает иерархическую память причин ошибок, которая группирует ошибки по навыкам и отслеживает их статус (активные или освоенные), позволяя целенаправленно генерировать обучающие примеры. Двойной фильтр уверенности отбирает только вопросы среднего уровня сложности, где ответы моделей согласованы. Эксперименты показывают, что DiagEvo превосходит все базовые методы на девяти тестовых наборах, достигая 72.3% точности на математических задачах с Qwen3-8B.'}, 'en': {'title': 'Self-Improvement Through Self-Reflection in Language Models', 'desc': 'DiagEvo is a method that enhances the self-evolution of language models by using their own past mistakes to guide future training. It creates a hierarchical memory of error causes, allowing the model to focus on specific weaknesses while still exploring new challenges. This approach eliminates the need for external resources, making the training process more efficient and self-sufficient. By implementing double-confidence filtering, DiagEvo ensures that only the most relevant and appropriately challenging questions are used for training, leading to improved accuracy across various benchmarks.'}, 'zh': {'title': '自我进化的新方向：DiagEvo', 'desc': 'DiagEvo是一种改进语言模型自我进化的方法，它通过分析内部失败历史来确定训练方向。该方法使用层次错误原因记忆和双重置信过滤，能够超越依赖外部资源的基线模型。DiagEvo的诊断器提取重复的错误原因，并将其存储在层次结构中，以便更好地指导问题生成。实验结果表明，DiagEvo在多个基准测试中表现优异，平均准确率显著高于其他方法。'}}}, {'id': 'https://huggingface.co/papers/2609.01481', 'title': 'Harness-of-Harness: Multi-Day Autonomous Software Development with Continual Improvement', 'url': 'https://huggingface.co/papers/2609.01481', 'abstract': 'Abstract Harness-of-Harness enables autonomous coding agents to iteratively improve software through structured planning-coding-testing loops, yielding substantial performance gains and fully developed applications.  Generated by thinkingmachines/Inkling-Small This paper studies autonomous software development, in which LLM-based coding agents transform high-level requirements into complete, functional, and usable software systems without human intervention. We introduce Harness-of-Harness (HoH), a framework that enables coding agents to continually improve software during autonomous development. HoH operates on existing coding-agent harnesses, and organizes their executions into iterative planning-coding-testing loops. To sustain improvement across loops, HoH balances repair with capability growth, scopes development into small and verifiable increments, separates implementation-time testing from independent evaluation, and constrains verifiable outputs rather than prescribing agent workflows. It progressively exposes deliverables, role-specific tools, and skills, encourages reuse rather than recreation, and maintains versioned project histories. On GameCraft-Bench, FrontierSWE, and ProgramBench, three harness-model pairs (Codex with GPT-5.5, OpenCode with DeepSeek-V4-Pro, and Pi with MiniMax-M3), HoH consistently outperforms the corresponding standalone harnesses, achieving an average relative gain of 52.25 percent and a maximum gain of 82.86 percent after three iterations. In a multi-day deployment with more than 70 iterations, HoH autonomously develops a first-person-shooter game, featuring a coherent storyline, fully implemented core mechanics, human-playable experience, polished visuals and integrated audio. Github: https://github.com/Flesymeb/HarnessOfHarness Project Page: https://flesymeb.github.io/HarnessOfHarness/', 'score': 9, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '48b655b3f59e09af', 'pdf_title_img': 'assets/pdf/title_img/2609.01481.jpg', 'data': {'categories': ['#benchmark', '#agents', '#plp'], 'emoji': '🔄', 'ru': {'title': 'Итеративное совершенствование автономной разработки через циклы планирования-кодирования-тестирования', 'desc': 'В этой работе предлагается фреймворк Harness-of-Harness (HoH) для автономной разработки программного обеспечения с использованием LLM-агентов. Система организует работу кодирующих агентов в итеративные циклы планирования-кодирования-тестирования, что позволяет последовательно улучшать качество генерируемого кода. HoH балансирует между исправлением ошибок и расширением функциональности, разбивая разработку на верифицируемые инкременты и поддерживая историю версий проекта. На трёх бенчмарках (GameCraft-Bench, FrontierSWE, ProgramBench) фреймворк показал улучшение на 52% в среднем, а в долгосрочном эксперименте успешно разработал полнофункциональную видеоигру.'}, 'en': {'title': 'Empowering Autonomous Software Development with Harness-of-Harness', 'desc': 'The paper presents Harness-of-Harness (HoH), a framework designed for autonomous software development using coding agents powered by large language models (LLMs). HoH facilitates iterative improvement of software through structured planning, coding, and testing loops, allowing agents to transform high-level requirements into complete applications without human input. It emphasizes balancing repair and capability growth, scoping development into manageable increments, and maintaining versioned project histories to ensure continuous enhancement. The results show that HoH significantly outperforms standalone coding harnesses, achieving impressive performance gains in developing complex software systems like a first-person shooter game.'}, 'zh': {'title': 'Harness-of-Harness：自主软件开发的新框架', 'desc': '这篇论文研究了自主软件开发，提出了一种名为Harness-of-Harness（HoH）的框架，旨在通过结构化的规划-编码-测试循环，使编码代理能够不断改进软件。HoH利用现有的编码代理工具，组织其执行过程，以实现迭代的开发和持续的性能提升。该框架通过平衡修复与能力增长，确保开发过程中的小步验证，促进了软件的高效生成。实验结果表明，HoH在多个基准测试中显著优于独立的编码工具，展示了其在自主开发中的强大能力。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.00551', 'title': 'EM^2Mem: Event-Centric Multimodal Memory for Large Language Models', 'url': 'https://huggingface.co/papers/2609.00551', 'abstract': 'Abstract EM²Mem binds multimodal evidence to event anchors for compact, generation-ready memory in long-video question answering.  Generated by thinkingmachines/Inkling-Small Multimodal memory offers a scalable interface for long-video question answering, but existing methods often retrieve captions, frames, transcripts, summaries, or graph facts as isolated fragments. Although searchable, such fragments are not generation-ready: language models must reconstruct cross-modal and temporal alignments at inference time, when context is limited and attribution is difficult. We propose EM^2Mem, an event-centric multimodal memory framework that binds heterogeneous evidence to event anchors during memory construction. Each event-indexed memory cell aligns multimodal records, temporal context, graph-linked relations, semantic facts, and provenance, enabling compact evidence readout over grounded multimodal events rather than modality-specific fragments. Across three long-video QA benchmarks, EM^2Mem improves average accuracy over the strongest memory baseline by 2.0, 2.4, and 3.7 points, improves strict event-level Top-5 evidence recall by 7.0 points, and reduces per-query latency by 4.67 times and total inference tokens by 63.66% (The code will be integrated into https://github.com/zjunlp/LightMem).', 'score': 9, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'f05f53266a864ac9', 'authors': ['Yijun Chen', 'Yaqi Zheng', 'Yanya Li', 'Boyi Xiao', 'Buqiang Xu', 'Shuofei Qiao', 'Jizhan Fang', 'Xinle Deng', 'Yunzhi Yao', 'Xuehai Wang', 'Liuxin Zhang', 'Hui Li', 'Huajun Chen', 'Shumin Deng'], 'affiliations': ['Lenovo Group Limited', 'South China University of Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.00551.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#inference', '#video'], 'emoji': '🎬', 'ru': {'title': 'События как якоря мультимодальной памяти для вопросов о видео', 'desc': 'В работе предлагается EM²Mem — фреймворк мультимодальной памяти, центрированный на событиях для ответов на вопросы о длинных видео. Система связывает разнородные доказательства (текст, кадры, транскрипты, графы) с якорями событий во время построения памяти, создавая компактное представление, готовое для генерации. Благодаря выравниванию мультимодальных записей, временного контекста и семантических отношений, модель уменьшает необходимость реконструкции кросс-модальных связей на этапе инференса. Экспериментально показано улучшение точности на бенчмарках, снижение задержки и значительное сокращение числа токенов при генерации ответов.'}, 'en': {'title': 'Event-Centric Memory for Enhanced Long-Video QA', 'desc': 'The paper introduces EM²Mem, a framework designed to enhance long-video question answering by creating a multimodal memory system that organizes information around specific events. Unlike traditional methods that treat different types of data (like captions and frames) as separate pieces, EM²Mem binds these pieces together with event anchors, making it easier for language models to access relevant information. This approach allows for better alignment of multimodal data and temporal context, leading to more accurate and efficient responses. The results show significant improvements in accuracy and speed compared to existing memory systems, demonstrating the effectiveness of this event-centric memory construction.'}, 'zh': {'title': '事件中心的多模态记忆框架', 'desc': 'EM²Mem是一种事件中心的多模态记忆框架，旨在为长视频问答提供紧凑且适合生成的记忆。它通过将异构证据绑定到事件锚点，解决了现有方法中孤立片段的问题。这种方法能够在记忆构建过程中对多模态记录、时间上下文和语义事实进行对齐，从而实现更高效的证据读取。实验结果表明，EM²Mem在多个长视频问答基准上显著提高了准确率和检索效率。'}}}, {'id': 'https://huggingface.co/papers/2608.30478', 'title': 'Agents in the Large: Perception-Centered Architecture for Persistent Agents', 'url': 'https://huggingface.co/papers/2608.30478', 'abstract': "Abstract The paper proposes a perception-centered architecture for persistent language agents that continuously adapt service procedures by perceiving signals from tasks, context, and environmental changes.  Generated by thinkingmachines/Inkling-Small Cognitive language agents have achieved substantial progress by equipping language models with memory, tools, and decision-making procedures, enabling agents to reason and act in interactive environments. Existing frameworks largely cast these agents as systems for solving user-specified, bounded tasks. An increasingly important goal is for language agents to provide persistent assistance in long-lived settings where user needs, context, and service procedures persist and change, and to remain useful across the broad range of tasks that arise over time. Yet we still lack a framework to characterize persistent AI agents, organize existing work, and guide future development. To this end, we propose a Perception-Centered Architecture for Persistent Agents (Pera). Pera describes a persistent agent organized around perception and control components that continually perceive service-relevant signals from episodic task executions, internal context, and changes in the surrounding environment, and use these signals to construct lifecycle tasks. These tasks drive the ongoing operation and adaptation of the agent's service procedures. We use Pera to retrospectively organize recent work, examine a detailed case study, and offer forward-looking insights for building more capable persistent agents. Just as software engineering moved from programming in the small to programming in the large, Pera frames the evolution of language agents as an analogous architectural transition toward long-lived, adaptive intelligence systems.", 'score': 7, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '28da51590b9f610b', 'authors': ['Shihan Dou', 'Haoxiang Jia', 'Shichun Liu', 'Feng Chen', 'Chenhao Huang', 'Yujiong Shen', 'Shaofan Liu', 'Jiayi Chen', 'Jiahang Lin', 'Honglin Guo', 'Qianyu He', 'Minghao Guo', 'Ziyi Ye', 'Pluto Zhou', 'Tao Gui', 'Qi Zhang', 'Xuanjing Huang'], 'affiliations': ['CCDS, Nanyang Technological University', 'Hunyuan Team, Tencent', 'NLP Lab, Fudan University', 'PL Lab, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30478.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'От статичных помощников к живым адаптивным агентам', 'desc': 'В статье предложена архитектура для персистентных языковых агентов, которые непрерывно адаптируют свои процедуры обслуживания на основе сигналов от задач, контекста и изменений окружающей среды. Авторы вводят концепцию Perception-Centered Architecture for Persistent Agents (Pera), организованную вокруг компонентов восприятия и управления, которые постоянно анализируют релевантные сигналы из выполнения задач, внутреннего контекста и экологических изменений. Эта архитектура преобразует собранные сигналы в задачи жизненного цикла, которые направляют адаптацию служебных процедур агента. Работа предлагает переход в разработке языковых агентов от решения отдельных ограниченных задач к созданию долгоживущих адаптивных интеллектуальных систем, способных оставаться полезными в долгосрочных взаимодействиях.'}, 'en': {'title': 'Building Adaptive Language Agents for Persistent Assistance', 'desc': 'This paper introduces a new framework called Perception-Centered Architecture for Persistent Agents (Pera), designed for language agents that need to adapt continuously to changing tasks and environments. Pera focuses on how these agents can perceive relevant signals from their surroundings and internal states to improve their service procedures over time. The goal is to create agents that can provide ongoing assistance in various contexts, rather than just solving specific tasks. By organizing existing research and providing a case study, the paper aims to guide the development of more capable and adaptive language agents.'}, 'zh': {'title': '以感知为中心的持久语言代理架构', 'desc': '本文提出了一种以感知为中心的架构，用于持久语言代理，这些代理能够通过感知任务、上下文和环境变化的信号来持续适应服务程序。通过结合记忆、工具和决策程序，语言代理在互动环境中实现了显著进展。现有框架主要将这些代理视为解决用户指定的有限任务的系统，而本文的目标是使语言代理在长期环境中提供持续的帮助，适应不断变化的用户需求和服务程序。我们提出的Pera架构为持久AI代理的特征化、现有工作的组织和未来发展的指导提供了框架。'}}}, {'id': 'https://huggingface.co/papers/2609.00621', 'title': 'Control-Data Flow Separation: Stable Prompt Optimization in Multi-Agent LLMs', 'url': 'https://huggingface.co/papers/2609.00621', 'abstract': 'Abstract The framework separates structured execution protocols from optimizable language content to prevent prompt optimization from corrupting multi-agent pipelines.  Generated by thinkingmachines/Inkling-Small Prompt optimization can improve multi-agent LLM systems, but the prompts being optimized often serve two entangled roles: generating task-relevant content and specifying execution-critical protocols, such as message routing, output formatting, and termination signals, on which the underlying code relies. As a result, a prompt edit intended to improve content generation can inadvertently corrupt the protocol and cause the entire agent pipeline to fail. Our key observation is that these two roles have different representations: execution protocols are typically structured, while task-relevant content is usually expressed in unstructured language. Based on this, we propose control-data flow separation, where execution-critical control is represented as typed, validated program objects, while task-relevant language remains the optimizable data flow for agent communication. This design allows optimizers to improve multi-agent behavior without exposing the routing or formatting interface to prompt drift. Across synthetic reasoning, collaborative review generation, and insurance rating workflows, our framework empirically achieves 100% eventual protocol validity while consistently improving task performance.', 'score': 6, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'cef7a36cf1e4a9ee', 'authors': ['Wentao Zhang', 'Syed Shariyar Murtaza', 'Junaid Ahmad Bhatti', 'Utkarsh Soni', 'Yifan Nie', 'Eugene Wen', 'Yuntian Deng'], 'affiliations': ['Manulife', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2609.00621.jpg', 'data': {'categories': [], 'emoji': '🔀', 'ru': {'title': 'Разделение управления и данных в мультиагентных системах для безопасной оптимизации', 'desc': 'Статья предлагает новый подход к оптимизации мультиагентных систем на основе LLM, разделяя выполнение программы на две части: структурированные протоколы управления и оптимизируемое языковое содержание. Авторы показывают, что при совместной оптимизации промптов протоколы маршрутизации и форматирования могут быть скомпрометированы, что приводит к отказам пайплайна. Предложенное решение использует типизированные объекты программы для управления потоком данных, оставляя только содержимое сообщений между агентами доступным для оптимизации. Экспериментальные результаты демонстрируют 100% корректность протоколов при одновременном улучшении производительности в задачах рассуждения, рецензирования и оценивания.'}, 'en': {'title': 'Optimizing Multi-Agent Systems Without Compromising Protocols', 'desc': 'This paper presents a framework that separates the structured execution protocols from the optimizable language content in multi-agent systems. The authors highlight that prompt optimization can enhance performance but risks corrupting critical execution protocols if not handled properly. By distinguishing between structured execution protocols and unstructured task-relevant content, the framework allows for safer optimization without compromising the integrity of the agent pipeline. The proposed method demonstrates significant improvements in task performance while maintaining protocol validity across various applications.'}, 'zh': {'title': '分离控制与内容，提升多智能体性能', 'desc': '本文提出了一种框架，将结构化执行协议与可优化的语言内容分开，以防止提示优化破坏多智能体管道。提示优化可以提升多智能体大语言模型系统的性能，但优化的提示往往同时承担生成任务相关内容和指定执行关键协议的双重角色。我们观察到这两种角色具有不同的表示方式：执行协议通常是结构化的，而任务相关内容通常以非结构化语言表达。基于此，我们提出了控制数据流分离的概念，使得执行关键控制以类型化、验证的程序对象表示，而任务相关语言则保持为可优化的数据流，从而在不影响路由或格式接口的情况下提升多智能体的行为。'}}}, {'id': 'https://huggingface.co/papers/2608.28612', 'title': 'InternReviewer & InternAdvocate: Objective Reward and Evaluation for Agentic Reinforcement Learning in Peer Review and Rebuttal', 'url': 'https://huggingface.co/papers/2608.28612', 'abstract': 'Abstract Specialized scholarly agents use reinforcement learning and real-time citation verification to improve reasoning and factual accuracy in peer review and rebuttal generation.  Generated by thinkingmachines/Inkling-Small Generating professional scholarly content, such as peer reviews and rebuttals, requires an intricate synergy between domain reasoning and factual grounding. This work presents a comprehensive framework for the development and evaluation of specialized scholarly agents, InternReviewer and InternAdvocate. We first establish a large-scale, high-quality scholarly dataset and integrate a high-efficiency arXiv retrieval tool to enable active evidence gathering. To optimize these agents, we implement an agentic Reinforcement Learning (RL) paradigm driven by a unified objective metric and reward system. This system avoids the biases of subjective model-based judging by employing multi-dimensional criteria, including reference-anchored semantic alignment, structural compliance, and a strict verification mechanism that cross-checks citations against real-time interaction logs to eliminate hallucinations. Experimental results demonstrate that agents trained within this closed-loop framework exhibit significant improvements in reasoning depth and citation accuracy.', 'score': 6, 'issue_id': 3202, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'eb9b60a8da54da8c', 'authors': ['Xuerui Su', 'Liya Guo', 'Qizhi Pei', 'Qipeng Guo', 'Zhongbo Tian', 'Lijun Wu', 'Kai Chen', 'Zun Wang'], 'affiliations': ['Beijing Jiaotong University', 'Renmin University of China', 'Shanghai AI Laboratory', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28612.jpg', 'data': {'categories': ['#reasoning', '#agents', '#dataset', '#science', '#optimization', '#hallucinations', '#benchmark', '#rl'], 'emoji': '📚', 'ru': {'title': 'Умные научные агенты с проверкой фактов через обучение с подкреплением', 'desc': 'В работе представлена система специализированных агентов для автоматического написания рецензий и возражений на научные статьи, использующая обучение с подкреплением и проверку цитат в реальном времени. Авторы разработали большой датасет высокого качества и интегрировали инструмент для поиска статей на arXiv, что позволяет агентам активно собирать доказательства. Для оптимизации агентов применяется система вознаграждений с многомерными критериями оценки, включая семантическое выравнивание, соответствие структуре и верификацию цитат. Экспериментальные результаты показывают, что агенты, обученные в этой замкнутой системе, демонстрируют значительное улучшение в глубине рассуждений и точности цитирования.'}, 'en': {'title': 'Enhancing Scholarly Review with Reinforcement Learning', 'desc': 'This paper introduces specialized scholarly agents that utilize reinforcement learning to enhance the quality of peer reviews and rebuttals. The agents, named InternReviewer and InternAdvocate, are developed using a large-scale scholarly dataset and a tool for efficient citation retrieval. A unique reinforcement learning framework is employed, which focuses on a unified objective metric and a reward system to minimize biases in evaluation. The results show that these agents significantly improve their reasoning capabilities and citation accuracy through a rigorous verification process.'}, 'zh': {'title': '提升学术代理的推理与准确性', 'desc': '本研究提出了一种专门的学术代理框架，旨在通过强化学习和实时引用验证来提高同行评审和反驳生成的推理能力和事实准确性。我们建立了一个大规模的高质量学术数据集，并集成了高效的arXiv检索工具，以支持主动证据收集。通过实施基于统一目标指标和奖励系统的代理强化学习范式，优化这些代理的表现，避免了主观模型判断的偏见。实验结果表明，在这一闭环框架内训练的代理在推理深度和引用准确性方面显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.30730', 'title': 'E-Commerce Bench: Evaluating LLM Agents on Long-Horizon Autonomous Business Operation', 'url': 'https://huggingface.co/papers/2608.30730', 'abstract': 'Abstract A year-long e-commerce benchmark evaluates LLM agents on multi-store negotiation, dynamic market events, and long-horizon policy adaptation across 18 frontier models.  Generated by thinkingmachines/Inkling-Small Long-horizon agentic tasks go beyond chaining short tasks over more interaction turns. Their evolving dynamic environments and long-range dependencies require Large Language Models (LLMs) to continually explore, learn from experience, and adapt their policies over thousands of steps. We introduce E-Commerce Bench, the first open-source benchmark that integrates multi-round counterpart negotiation and dynamic events into a year-long business operation. Over a 365-day year, an LLM agent concurrently runs multiple online stores, researching the market, negotiating with suppliers to source inventory, optimizing sales strategies, fulfilling orders, handling returns, and managing cash flow to maximize its end-of-year total assets. To construct a realistic merchant-side operating environment, the product and supplier data are derived from a real e-commerce platform, while a year-long calendar of promotions, natural disasters, and supply-chain shocks continually reshapes demand. For reproducibility, both sides of the market are deterministic: customer purchases and returns follow a fixed demand model, while a negotiation kernel determines supplier pricing, concessions, and decisions, with an LLM used only to verbalize them. We evaluate 18 frontier models across seven dimensions, including year-end assets, and find that no single model dominates. GPT-5.6 Sol earns the most, growing the 100,000 opening stake into 1,431,425, yet it ranks 16th of 18 on fraud avoidance and trails Fable5 in operational efficiency. Among open-weight models, Qwen3.8-Max-Preview leads with 416,252, 38% above GLM 5.2 (high), and achieves the strongest learning over the horizon, progressively bargaining down prices across repeated orders. Our code is available at https://github.com/QwenLM/E-CommerceBench.', 'score': 5, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '0f59309e02c7d93d', 'authors': ['Wei Fan', 'Xinjie Shen', 'Xudong Guo', 'Jianhong Tu', 'Yang Su', 'Yinger Zhang', 'Lianghao Deng', 'Fengyu Wang', 'Baohua Dong', 'Yangqiu Song', 'Dayiheng Liu'], 'affiliations': ['Department of Computer Science and Engineering, HKUST', 'Qwen Team, Alibaba Group', 'Taobao & Tmall Group, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.30730.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#dataset', '#agents', '#benchmark', '#long_context'], 'emoji': '🏪', 'ru': {'title': 'Долгосрочная адаптация LLM-агентов в симуляции многолетнего управления электронным магазином', 'desc': 'В работе представлен E-Commerce Bench — первый открытый бенчмарк для оценки способности LLM-агентов выполнять долгосрочные задачи в условиях динамичной среды. Агент управляет несколькими интернет-магазинами в течение года, проводя переговоры с поставщиками, оптимизируя стратегии продаж, обрабатывая заказы и управляя денежными потоками при возникновении различных рыночных событий. Исследование оценивает 18 современных моделей по семи метрикам, включая итоговые активы, и показывает, что не существует универсальной модели, превосходящей остальные по всем параметрам. Результаты демонстрируют разнообразие сильных и слабых сторон: лучшие модели достигают высокого финансового результата, но проигрывают в других аспектах, таких как предотвращение мошенничества и операционная эффективность.'}, 'en': {'title': 'Navigating E-Commerce Complexity with LLMs', 'desc': 'This paper presents E-Commerce Bench, a novel benchmark for evaluating Large Language Models (LLMs) in complex, long-term e-commerce scenarios. It focuses on multi-store negotiation and dynamic market events, requiring LLMs to adapt their strategies over a year-long simulation. The benchmark assesses 18 advanced models on their ability to manage various business operations, including inventory sourcing and sales optimization, while responding to real-world challenges like promotions and supply chain disruptions. Results show that while some models excel in asset growth, others perform better in fraud avoidance and operational efficiency, highlighting the diverse strengths of different LLMs in e-commerce tasks.'}, 'zh': {'title': '评估LLM在电子商务中的表现', 'desc': '这篇论文介绍了一个名为E-Commerce Bench的开源基准测试，旨在评估大型语言模型（LLM）在电子商务中的表现。测试涵盖了多轮谈判、动态市场事件和长期策略适应，模拟了一个为期一年的商业运营环境。研究发现，尽管GPT-5.6 Sol在年终资产增长方面表现最佳，但在防止欺诈和运营效率方面却排名较低。通过对18个前沿模型的评估，论文展示了不同模型在复杂商业环境中的学习和适应能力。'}}}, {'id': 'https://huggingface.co/papers/2609.00374', 'title': 'Adapting Without Gradients: Affine Statistics Transport and What Its Certificate Can Tell You', 'url': 'https://huggingface.co/papers/2609.00374', 'abstract': "Abstract CASTER enables gradient-free test-time adaptation for frozen models by transporting source class distributions via affine transformations in a discriminative subspace, with a transportability certificate to gate unreliable updates.  Generated by thinkingmachines/Inkling-Small Test-time adaptation (TTA) typically assumes that model parameters can be updated at inference time. This assumption is restrictive for inference-only accelerators, frozen or third-party models, and memory-constrained deployments, and standard BatchNorm-based TTA configurations may also become inactive on architectures without BatchNorm. We study adaptation when the learned model must remain frozen. We introduce CASTER, a gradient-free method that stores source class statistics in a discriminative subspace, estimates a class-shared affine transformation from target-batch moments, and analytically transports the source class distributions before classification. CASTER requires no backward pass, optimizer state, or stored source feature bank. Across four backbones and seven datasets, it outperforms k-NN on identical frozen features in 27 of 28 backbone-dataset settings while retaining a median of 18x less state. Affine transport is not always reliable. On ImageNet-C, where batches contain only 64 samples for 1000 classes, unconditional transport loses 21.2 top-1 points. We therefore introduce an empirical residual-to-margin transportability certificate. Across 307 evaluation cells, every transport losing more than 10 points has certificate value above 3.9, although benign and destructive regimes are not perfectly separated. Gating converts an average -3.35-point effect of unconditional transport into a +1.69-point gain, and performance remains within 0.3 points of the best threshold over a broad threshold range. Finally, we show that this certificate is mechanism-specific: when applied to Tent, it accepts only 4.3% of updates and preserves 0.6% of Tent's available gain. These results position CASTER as a lightweight adaptation mechanism for frozen-model deployment, together with an explicit account of when its safety signal is informative and when it is not.", 'score': 4, 'issue_id': 3205, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '588e1f4e47895761', 'authors': ['Salim Khazem', 'Ibrahim Mohamed Serouis'], 'affiliations': ['Talan Research Center Paris, France', 'Talan Research Center Toulouse, France'], 'pdf_title_img': 'assets/pdf/title_img/2609.00374.jpg', 'data': {'categories': ['#inference', '#training', '#transfer_learning', '#optimization'], 'emoji': '❄️', 'ru': {'title': 'Адаптация замороженных моделей без градиентов через сертифицированный перенос распределений', 'desc': 'CASTER — это метод адаптации моделей без обновления параметров, который использует аффинные преобразования для трансформации распределений классов в дискриминативном подпространстве. Метод хранит статистику исходных классов и применяет общее преобразование на основе моментов целевого батча, не требуя обратного прохода и оптимизатора. Авторы предложили сертификат переносимости на основе остатков, который определяет надёжность адаптации и предотвращает деградацию качества при неустойчивых преобразованиях. Метод показывает превосходство над k-NN на замороженных признаках при значительно меньшем расходе памяти и остаётся практичным решением для развёртывания на ограниченных вычислительных ресурсах.'}, 'en': {'title': 'CASTER: Smart Adaptation for Frozen Models', 'desc': 'CASTER is a novel method for adapting frozen machine learning models at test time without needing to update model parameters. It uses affine transformations to adjust source class distributions based on target data statistics, allowing for effective classification without a backward pass or optimizer. The method includes a transportability certificate to ensure that only reliable updates are applied, improving performance while minimizing resource usage. CASTER demonstrates significant advantages over traditional k-NN methods across various datasets, making it suitable for memory-constrained environments.'}, 'zh': {'title': 'CASTER：冻结模型的轻量级适应机制', 'desc': 'CASTER是一种无梯度的测试时适应方法，旨在对冻结模型进行适应。它通过在判别子空间中传输源类分布，使用仿射变换来实现，并提供运输证书以过滤不可靠的更新。该方法不需要反向传播、优化器状态或存储源特征库，适用于内存受限的部署。实验表明，CASTER在多个数据集上优于传统的k-NN方法，同时保持较低的状态需求。'}}}, {'id': 'https://huggingface.co/papers/2609.00137', 'title': 'Recursive Criticality of AI Self-Improvement', 'url': 'https://huggingface.co/papers/2609.00137', 'abstract': 'Abstract A recursive reproduction number determines whether AI R&D feedback loops become self-amplifying based on research productivity, feedback strength, and rising difficulty.  Generated by thinkingmachines/Inkling-Small AI is increasingly used in the R\\&D process that produces future AI systems. We study the conditions under which this feedback becomes self-amplifying. Our model describes how the rate of AI capability growth depends on baseline research productivity, recursive feedback, and the increasing difficulty of research progress. We derive a recursive reproduction number, R_{AI}, that determines whether improvements are amplified or damped across development cycles. This quantity compares the strength of feedback with the rate at which further progress becomes more difficult. When R_{AI}>1, the effects of improvements compound across development cycles, placing the system in a self-amplifying regime. When R_{AI}<1, their effects weaken across cycles. The transition depends on the structure of the AI R\\&D feedback loop and need not occur at any particular level of model capability. A system can therefore enter a self-amplifying regime before acceleration becomes visible, while rapid progress can also occur without self-amplification. Higher baseline research productivity can accelerate progress without changing whether the system is self-amplifying, but the duration of the development cycle becomes a limiting timescale for amplification. Increasing research difficulty can end a period of self-amplification. Extending the model to multiple research actors shows that improvements shared across organizations can make the overall research ecosystem self-amplifying even when no individual actor is. The framework identifies measurable properties of AI R\\&D systems that can help distinguish recursive amplification from rapid progress driven by other sources, including the strength of recursive feedback, how effectively improvements propagate into successor systems, cycle duration, and the increasing difficulty of further progress.', 'score': 4, 'issue_id': 3203, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '4a554eb5b82f2741', 'authors': ['Mikhail Burtsev'], 'affiliations': ['London Institute for Mathematical Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2609.00137.jpg', 'data': {'categories': ['#math'], 'emoji': '🔄', 'ru': {'title': 'Спираль инноваций: когда развитие AI начинает ускорять само себя', 'desc': 'Статья исследует условия, при которых обратная связь в разработке AI становится самоусиливающейся. Авторы вводят концепцию коэффициента репродукции R_AI, который определяет, усиливаются или ослабляются улучшения системы между циклами развития. Когда R_AI больше 1, эффекты улучшений накапливаются и система входит в режим самоусиления; когда меньше 1, эффекты затухают. Модель показывает, что переход в режим самоусиления зависит от структуры feedback loop и может произойти до того, как ускорение станет видимым, а также что обмен улучшениями между организациями может сделать всю экосистему исследований самоусиливающейся.'}, 'en': {'title': 'Understanding Self-Amplifying Feedback in AI R&D', 'desc': 'This paper introduces a model to analyze how AI research and development (R&D) can lead to self-amplifying feedback loops. It defines a recursive reproduction number, R_{AI}, which indicates whether improvements in AI capabilities will compound over time or diminish. The study highlights that when R_{AI} is greater than one, the system experiences self-amplification, while values less than one indicate weakening effects. Additionally, the model considers factors like research productivity and increasing difficulty, showing that even without visible acceleration, a system can still enter a self-amplifying state.'}, 'zh': {'title': '探索人工智能研发的自我增强机制', 'desc': '本文研究了人工智能研发中的反馈循环如何影响技术的自我增强。我们提出了一个递归再生产数R_{AI}，用于判断改进是否在开发周期中得到放大。当R_{AI}大于1时，改进的效果会在周期中累积，形成自我增强的状态；而当R_{AI}小于1时，效果会减弱。通过分析不同的研究参与者，我们发现即使个体不具备自我增强能力，整体研发生态系统仍然可以实现自我增强。'}}}, {'id': 'https://huggingface.co/papers/2609.00968', 'title': 'ReFlowSET: Representation-Aligned Latent Flow Matching for SAR-to-EO Image Translation', 'url': 'https://huggingface.co/papers/2609.00968', 'abstract': 'Abstract ReFlowSET selects a latent codec via joint SAR-EO reconstruction and trains a small conditional DiT with dual-stream conditioning and frozen vision-model alignment for high-fidelity SAR-to-EO translation.  Generated by thinkingmachines/Inkling-Small SAR-to-EO image translation aims to generate electro-optical (EO) imagery from synthetic aperture radar (SAR) observations. Existing latent diffusion approaches typically inherit a predetermined autoencoder, although reconstruction fidelity can vary substantially across codecs and modalities. Because the latent codec affects the round-trip preservation of both SAR conditions and EO targets, codec selection constitutes a fundamental design choice; nevertheless, existing methods largely rely on codecs pretrained on natural images. To remedy this, we introduce ReFlowSET, a conditional latent flow-matching framework that selects its codec through a joint SAR--EO reconstruction audit. Rather than inheriting a heavyweight pretrained generator, ReFlowSET trains a substantially smaller conditional DiT from scratch in the selected latent space, using dual-stream SAR conditioning followed by joint feature refinement. To provide semantic guidance for this from-scratch training, intermediate noisy-EO features are aligned with clean target-EO representations extracted by a frozen vision foundation model. This alignment is used only during training and introduces no additional inference cost. Experiments on QXS-SAROPT and SAR2Opt demonstrate state-of-the-art performance across diverse perceptual fidelity and distributional metrics. Code and pretrained weights are publicly available at https://github.com/KAIST-VICLab/ReFlowSET.', 'score': 3, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '894376183c914db6', 'authors': ['Jeonghyeok Do', 'Seungchul Lee', 'Munchurl Kim'], 'affiliations': ['KAIST', 'Stellarvision Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.00968.jpg', 'data': {'categories': ['#multimodal', '#cv', '#small_models', '#open_source', '#training', '#diffusion', '#architecture'], 'emoji': '🛰️', 'ru': {'title': 'Умный выбор кодека для трансляции радиолокационных снимков в оптические изображения', 'desc': 'ReFlowSET — это метод условного трансляции изображений из радиолокационных снимков (SAR) в электрооптические (EO) изображения. Ключевая особенность подхода заключается в автоматическом выборе оптимального латентного кодека через совместную реконструкцию SAR и EO, что обеспечивает лучшее сохранение информации обеих модальностей. Модель использует компактную условную Diffusion Transformer с двухпотоковым кондиционированием и выравниванием признаков с помощью замороженной предобученной модели зрения для семантического руководства. Метод демонстрирует состояние искусства на бенчмарках QXS-SAROPT и SAR2Opt по различным метрикам качества и распределения сгенерированных изображений.'}, 'en': {'title': 'ReFlowSET: Optimizing SAR-to-EO Translation with Smart Codec Selection', 'desc': 'The paper introduces ReFlowSET, a novel framework for translating synthetic aperture radar (SAR) images into electro-optical (EO) imagery. It emphasizes the importance of selecting an appropriate latent codec for effective SAR-to-EO reconstruction, as existing methods often rely on codecs pretrained on natural images, which may not perform well. ReFlowSET trains a smaller conditional diffusion model from scratch, utilizing dual-stream conditioning and aligning features with a frozen vision model to enhance training efficiency. The results show that ReFlowSET achieves superior performance in generating high-fidelity EO images compared to traditional methods, demonstrating its effectiveness in the field of image translation.'}, 'zh': {'title': 'ReFlowSET：高保真SAR到EO图像翻译的新方法', 'desc': 'ReFlowSET是一种条件潜在流匹配框架，旨在通过联合SAR-EO重建选择潜在编码器，以实现高保真度的SAR到EO图像翻译。该方法训练了一个小型的条件DiT模型，利用双流条件和冻结的视觉模型对齐，来提高重建的准确性。与传统方法不同，ReFlowSET不依赖于预训练的重型生成器，而是在选定的潜在空间中从头开始训练模型。实验结果表明，ReFlowSET在多种感知保真度和分布指标上表现出色，达到了最先进的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.30457', 'title': 'Learning Where Outcomes Change:Credit-Addressable Reasoning for Multimodal Geometry', 'url': 'https://huggingface.co/papers/2608.30457', 'abstract': 'Abstract Credit-addressable reasoning via executable code traces and localized reinforcement learning improves multimodal geometry reasoning by aligning credit assignment with structured reasoning events.  Generated by thinkingmachines/Inkling-Small Multimodal geometry reasoning requires VLMs to extract precise visual relations and preserve them through multi-step deduction. Existing free-form traces obscure the decisions that determine the answer, and trajectory-level reinforcement learning distributes a single terminal signal across the entire response. We introduce credit-addressable reasoning, in which the semantic units exposed during inference also define where learning compares alternatives and assigns credit. We instantiate this principle with Code-CoT, which retains the diagram, represents visual relations as line-addressable executable code, and organizes reasoning into typed events, and CE-GRPO, which selects event boundaries using structural priors and type-normalized entropy, samples complete continuations from shared prefixes, and converts outcome differences into localized advantages. Across nine geometry benchmarks, CE-GRPO achieves an average accuracy of 76.04, outperforming Qwen3-VL-8B and trajectory-level GRPO by 8.09 and 3.43 points, respectively. Its relative advantage increases with the number of intermediate events, demonstrating the value of representation--optimization co-design for long, dependency-heavy multimodal reasoning.', 'score': 3, 'issue_id': 3204, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '1b00e89cf0613114', 'authors': ['Jiani Guo', 'Junjie Wang', 'Jie Wu', 'Pengxiang Zhao', 'Dongdong Zhang', 'Shaohan Huang', 'Yujiu Yang', 'Furu Wei'], 'affiliations': ['Microsoft Research', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30457.jpg', 'data': {'categories': ['#reasoning', '#rl', '#optimization', '#multimodal', '#benchmark', '#cv', '#training'], 'emoji': '📐', 'ru': {'title': 'Адресное назначение кредитов через исполняемый код для точного геометрического рассуждения', 'desc': 'В статье предлагается подход Credit-addressable reasoning для улучшения мультимодального геометрического рассуждения при помощи больших языковых моделей с зрением. Авторы вводят Code-CoT, который представляет визуальные отношения в виде исполняемого кода и структурирует рассуждение на типизированные события. Для обучения используется алгоритм CE-GRPO, который применяет локализованное обучение с подкреплением на уровне отдельных событий вместо всей траектории ответа. На девяти бенчмарках метод достигает 76.04% точности, превосходя существующие подходы благодаря лучшему выравниванию назначения кредитов с структурой рассуждения.'}, 'en': {'title': 'Enhancing Geometry Reasoning with Credit-Addressable Learning', 'desc': 'This paper presents a novel approach called credit-addressable reasoning, which enhances multimodal geometry reasoning by aligning credit assignment with structured reasoning events. It addresses the limitations of existing methods that use free-form traces, which can obscure decision-making processes. The authors introduce Code-CoT and CE-GRPO, which utilize executable code to represent visual relations and organize reasoning into distinct events. Their method shows significant improvements in accuracy on geometry benchmarks, particularly as the complexity of reasoning increases, highlighting the importance of co-designing representation and optimization strategies.'}, 'zh': {'title': '信用可寻址推理：提升多模态几何推理的关键', 'desc': '本文提出了一种信用可寻址推理的方法，通过可执行代码跟踪和局部强化学习来改善多模态几何推理。该方法通过结构化推理事件对信用分配进行对齐，使得视觉关系的提取和多步推理得以保留。我们引入的Code-CoT和CE-GRPO方法，能够将视觉关系表示为可执行代码，并将推理组织为类型化事件。实验结果表明，CE-GRPO在九个几何基准测试中平均准确率达到76.04，优于其他方法，显示了表示与优化共同设计在复杂推理中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.27509', 'title': 'The Mechanics of Democratic Dominance: A System Dynamics Paradigm for Dynamic Consent Engineering', 'url': 'https://huggingface.co/papers/2608.27509', 'abstract': "Abstract  Traditional frameworks of political communication operate under linear, event-driven assumptions that treat voter persuasion as a static, transactional function. This paper introduces Dynamic Consent Engineering (DCE), a novel interdisciplinary paradigm that synthesizes Edward Bernays' foundational principles of public relations with the S-E-E-D (Snowball, Equilibrium, Elasticity, Dominance) framework of system dynamics. By expanding Bernaysian operational constraints into a four-dimensional resource matrix (incorporating algorithmic media infrastructure
