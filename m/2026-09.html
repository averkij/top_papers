img/2608.30795.jpg', 'data': {'categories': ['#training', '#science', '#benchmark', '#architecture', '#optimization'], 'emoji': '🌦️', 'ru': {'title': 'Probabilistic weather forecasting через decomposition неопределённости в neural network ансамблях', 'desc': 'В работе представлена вероятностная версия модели прогнозирования погоды Aardvark, которая использует обученный шум наблюдений и Monte Carlo dropout для кодировщика и процессора. Модель разделяет алеаторическую неопределённость (вызванную шумом инструментов) и эпистемическую неопределённость (обусловленную недостатками модели), формируя откалиброванный вложенный ансамбль. Вероятностная доработка улучшает среднее качество прогнозов на 4.2% и обеспечивает хорошую калибровку в среднесрочном диапазоне. Разложение неопределённости по источникам делает end-to-end прогнозы более интерпретируемыми и прозрачными, приближая нас к созданию цифровых двойников атмосферы.'}, 'en': {'title': 'Transforming Weather Forecasting with Probabilistic Insights', 'desc': "The Aardvark Weather model enhances traditional weather forecasting by incorporating probabilistic elements, specifically learned observation noise and Monte Carlo dropout. This approach allows the model to distinguish between aleatoric uncertainty, which comes from the data itself, and epistemic uncertainty, which arises from the model's limitations. By using a nested ensemble method, the model improves mean forecasts and provides a clearer understanding of uncertainty in predictions. The results show significant improvements in forecast accuracy while maintaining a low error rate compared to deterministic models."}, 'zh': {'title': 'Aardvark天气模型：将不确定性纳入天气预测', 'desc': 'Aardvark天气模型通过在编码器和处理器中添加学习到的观测噪声和蒙特卡洛丢弃，使其变得概率化，从而提高了平均预测的准确性，并区分了随机不确定性和知识不确定性。该模型能够直接从原始地球观测数据生成全球网格和站点预测，取代了传统的数值天气预报流程，成本大幅降低。通过对每个组件附加随机机制，模型能够捕捉到观测系统固有的随机不确定性和学习动态中的知识不确定性。最终的嵌套集成模型显著提高了预测的透明度，使得基于观测的数字双胞胎的构建成为可能。'}}}, {'id': 'https://huggingface.co/papers/2608.29681', 'title': 'MMMMM: A Unified Taxonomy for Investigating the Mechanisms of Multilingual MultiModal Misinformation', 'url': 'https://huggingface.co/papers/2608.29681', 'abstract': 'Abstract  Multimodal misinformation on social media is highly prevalent, potent, and harmful, yet difficult to detect and counter, and still poorly understood compared to its text-only counterpart. Research on the properties and deceptive strategies of multimodal misinformation is hindered by a lack of taxonomies grounded in real-world contexts and by the limitations of current multimodal machine learning models, which prevent the automation of annotation and analysis at scale. We address these shortcomings in three steps. First, we collect a large-scale, high-quality dataset of real-world misinformation instances from Twitter/X in seven languages. Second, we develop a novel, comprehensive taxonomy of multimodal misinformation grounded in an in-depth qualitative analysis of the data and prior theoretical work. Finally, we operationalise the taxonomy through an automated multi-step annotation pipeline using a Vision-Language Model (VLM), and perform human-validation. Our novel approach leads to previously undocumented insights about how social media users combine images with text to spread misinformation in the wild, e.g., that AI-generated content is particularly prevalent in technology and science, while vaccination misinformation disproportionately utilises images from news outlets to assert credibility. Our method and findings provide guidance for targeted approaches for detecting multimodal misinformation, and suggest that mitigation efforts should be developed and applied strategically rather than uniformly.', 'score': 1, 'issue_id': 3198, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '76bc4c51206352dd', 'authors': ['Nadav Borenstein', 'Greta Warren', 'Desmond Elliott', 'Isabelle Augenstein'], 'affiliations': ['University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2608.29681.jpg', 'data': {'categories': ['#science', '#multimodal', '#low_resource', '#multilingual', '#ethics', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Таксономия и автоматизированное обнаружение многомодальной дезинформации в социальных сетях', 'desc': 'В работе исследуется проблема многомодальной дезинформации в социальных сетях, которая намного опаснее и сложнее для детекции, чем текстовая. Авторы создали большой датасет реальных примеров дезинформации из Twitter/X на семи языках и разработали комплексную таксономию, основанную на качественном анализе данных и теоретических основах. Они использовали Vision-Language модель для автоматизированной аннотации и анализа данных в масштабе с последующей валидацией человеком. Исследование выявило специфические закономерности распространения дезинформации, например, что AI-генерируемый контент преобладает в технологии и науке, а дезинформация о вакцинах часто использует изображения из СМИ для повышения кредибилитета.'}, 'en': {'title': 'Unraveling Multimodal Misinformation: A Tailored Approach to Detection', 'desc': 'This paper addresses the challenge of detecting and understanding multimodal misinformation on social media, which combines text and images. The authors create a large dataset of misinformation from Twitter/X in multiple languages and develop a new taxonomy to categorize these instances based on real-world contexts. They also introduce an automated annotation pipeline using a Vision-Language Model (VLM) to analyze the data effectively. The findings reveal unique strategies used in misinformation, highlighting the need for tailored detection methods rather than one-size-fits-all solutions.'}, 'zh': {'title': '揭示多模态虚假信息的传播策略', 'desc': '本研究聚焦于社交媒体上的多模态虚假信息，指出其普遍性和危害性。我们首先收集了来自Twitter/X的多语言虚假信息数据集，随后建立了一个全面的多模态虚假信息分类法。通过使用视觉语言模型（VLM）进行自动化标注，我们验证了该分类法的有效性。研究发现，社交媒体用户常常将图像与文本结合，以传播虚假信息，特别是在科技和科学领域，AI生成的内容尤为常见。'}}}, {'id': 'https://huggingface.co/papers/2609.02749', 'title': 'Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills', 'url': 'https://huggingface.co/papers/2609.02749', 'abstract': "Abstract DisCo is a research agent that distills operational knowledge into reusable skills, significantly improving autonomous ML research performance across benchmarks.  Generated by thinkingmachines/Inkling-Small Autonomous agents are beginning to carry out machine-learning (ML) research end to end. These agents combine a model backbone with a harness for planning, execution, memory, and verification, but this architecture still leaves domain-specific know-how outside the agent. We call this missing layer operational knowledge, the know-how that separates knowing a method from making it work. That knowledge is not absent from the field. It appears in repositories and papers, but in forms written for human readers and too large to load during a task. Once distilled into compact, verified skills, this knowledge can be reused across tasks rather than rediscovered during each run.   We present DisCo, a skill-powered research agent that creates skills and uses them during research. Its distillation runs in two complementary forms: task-agnostic, condensing the field's widely used repositories into reusable skills, and task-oriented, producing the skills a concrete task calls for. The former, applied across the open ecosystem, yields the AREX-Skill Library, with 5,000+ verified skills distilled from 1,000 widely used ML repositories and organized into 20 areas and 178 capability families. With the GPT-5.5 backbone, research harness, and downstream execution budget held fixed, the skill-equipped research agent scores 134.3% higher on MLE-bench, 34.4% higher on PaperBench, 9.2% higher on FrontierCS, and 14.0% higher on PassNet than the same agent without skills. These gains come from adding distilled operating context under that fixed setup.", 'score': 402, 'issue_id': 3209, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '18a01d893e3c78f7', 'authors': ['Jianlyu Chen', 'Yuyang Hu', 'Hongjin Qian', 'Jiawei Liu', 'Wenqing Wei', 'Xiaolong Chen', 'Defu Lian', 'Zhicheng Dou', 'Chaozhuo Li', 'Qiwei Ye', 'Zheng Liu'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'Hong Kong Polytechnic University', 'Renmin University of China', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.02749.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Дистилляция знаний в навыки для автономных исследовательских агентов', 'desc': 'DisCo — это исследовательский агент, который извлекает операционные знания из публикаций и репозиториев и преобразует их в переиспользуемые навыки. Агент использует два подхода к дистилляции знаний: задачено-агностический, обобщающий широко используемые ML-библиотеки, и задачно-ориентированный, создающий специфические навыки для конкретной задачи. В результате была создана библиотека AREX-Skill с более чем 5000 верифицированными навыками, организованными в 20 областей и 178 семейств возможностей. Оснащённый этими навыками агент показывает значительное улучшение производительности на различных бенчмарках ML-исследований, превосходя базовые системы на 9-134%.'}, 'en': {'title': 'Unlocking ML Potential with Distilled Skills', 'desc': 'DisCo is an innovative research agent designed to enhance machine learning (ML) research by distilling operational knowledge into reusable skills. This agent integrates a model backbone with a planning and execution framework, allowing it to perform end-to-end ML research more effectively. By converting extensive domain-specific knowledge from repositories and papers into compact, verified skills, DisCo enables the agent to reuse this knowledge across various tasks. The result is a significant performance boost on multiple benchmarks, demonstrating the value of operational knowledge in improving autonomous ML research capabilities.'}, 'zh': {'title': '知识提炼，提升机器学习研究效率', 'desc': 'DisCo是一个研究代理，能够将操作知识提炼成可重用的技能，从而显著提高自主机器学习研究的性能。它结合了模型骨干和规划、执行、记忆及验证的框架，填补了代理在特定领域知识上的空白。通过将领域内的知识浓缩为紧凑且经过验证的技能，DisCo使得这些知识可以在不同任务中重复使用，而不是每次都重新发现。研究表明，使用DisCo的代理在多个基准测试中表现出显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2609.01437', 'title': 'HarnessDev: Can LLMs Create and Evolve Their Own Agent Harness?', 'url': 'https://huggingface.co/papers/2609.01437', 'abstract': "Abstract HarnessDev evaluates agents by measuring their ability to build and iteratively improve execution infrastructure rather than final task outputs, revealing that self-built harnesses vary widely in capability and efficiency and transfer poorly across models.  Generated by thinkingmachines/Inkling-Small As agents move from research prototypes to deployed tools, their capability increasingly depends on model-external execution infrastructure, commonly termed the agent harness. Changing this harness while holding model weights fixed can substantially alter task performance. Current agent evaluations typically report downstream performance under a chosen harness, leaving a model's ability to develop the harness itself comparatively underexplored. We introduce HarnessDev, a benchmark that shifts the unit of evaluation from task outputs to runnable infrastructure. HarnessDev covers two stages. In Creation, the agent starts from a minimal seed and a small number of cases, then builds a complete execution system. In Evolution, it starts from its own created harness and iteratively revises it using downstream execution feedback, with the goal of improving benchmark performance. We then evaluate each constructed harness on capability (task success on held-out benchmarks) and efficiency (execution-token cost). The reported Creation results cover six creator LLMs, four domains, and five downstream benchmarks totaling 2,207 unique downstream instances, with hidden evaluation tasks withheld from development. We find that generated harnesses remain substantially behind mature human-engineered references on code and on search and research, while matching or exceeding the selected references on writing and machine-learning experimentation, with large variation in execution cost. Evolution produces some performance gains, but they are unstable and transfer only partially to held-out tasks. Experiments with a fixed runtime model further show that the gains depend strongly on the model executing the harness, indicating limited transfer across models.", 'score': 164, 'issue_id': 3209, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'fcc475300b5b09a7', 'authors': ['Yuhao Wu', 'Jingyuan Zhang', 'Jiajun Shi', 'Xinping Lei', 'Qingshui Gu', 'Yuxuan Zhang', 'Zexuan Wang', 'Chen He', 'Chen Huang', 'Maojia Song', 'Zhiyuan Zeng', 'Shaowen Wang', 'Jinkai Liu', 'Yunfeng Shi', 'Jiaheng Liu', 'Shen Yan', 'Wenhao Huang', 'Ge Zhang', 'Wenxuan Zhang'], 'affiliations': ['ByteDance', 'Georgia Institute of Technology', 'M-A-P', 'Singapore University of Technology and Design', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.01437.jpg', 'data': {'categories': ['#dataset', '#agents', '#benchmark'], 'emoji': '🛠️', 'ru': {'title': 'От задач к инфраструктуре: как агенты строят собственные системы выполнения', 'desc': 'В работе представлен бенчмарк HarnessDev, который оценивает способность AI агентов создавать и улучшать инфраструктуру выполнения задач, а не только качество финальных результатов. Исследование показывает, что агенты на основе различных LLM могут строить системы выполнения с нуля из минимального набора примеров, а затем итеративно совершенствовать их, используя обратную связь. Однако созданные агентами системы значительно отстают от ручной инженерии на сложных задачах (кодирование, поиск), хотя сравнимы с ней на письме и машинном обучении, при этом показывая высокую вариативность в затратах вычислительных ресурсов. Ключевой вывод состоит в том, что улучшения при эволюции системы плохо переносятся между моделями и задачами, указывая на сильную привязку инфраструктуры к конкретной модели.'}, 'en': {'title': 'HarnessDev: Evaluating Agents by Their Infrastructure Building Skills', 'desc': 'HarnessDev is a new benchmark that evaluates how well agents can create and improve their own execution infrastructure, rather than just focusing on the final results of tasks. It consists of two main stages: Creation, where agents build a complete system from a minimal starting point, and Evolution, where they refine their system based on feedback to enhance performance. The study reveals that while agents can generate harnesses, these often lack the efficiency and capability of those created by humans, especially in certain tasks. Additionally, improvements made during the Evolution stage are inconsistent and do not easily transfer across different models, highlighting the challenges in developing robust agent harnesses.'}, 'zh': {'title': 'HarnessDev：智能体执行基础设施的新评估标准', 'desc': 'HarnessDev 是一个评估智能体能力的新基准，重点在于构建和改进执行基础设施，而不是最终任务输出。研究发现，自建的执行基础设施在能力和效率上差异很大，并且在不同模型之间的迁移能力较差。该基准分为两个阶段：创建和演化，智能体需要从最小的种子和少量案例开始构建完整的执行系统，并根据反馈不断修正。实验结果显示，生成的基础设施在某些任务上表现良好，但在代码和搜索等领域仍落后于成熟的人类工程参考。'}}}, {'id': 'https://huggingface.co/papers/2608.31111', 'title': 'Aspire: Can Models Self-Evolve from Vague Goals?', 'url': 'https://huggingface.co/papers/2608.31111', 'abstract': 'Abstract ASPIRE introduces a benchmark for self-evolving LLM agents from vague natural-language goals, revealing challenges in goal interpretation, data selection, and stable weight-level improvement.  Generated by thinkingmachines/Inkling-Small Many important forms of human learning begin with a vague goal, such as "become a better physicist" or "improve at research." Learners must interpret the goal, identify capability gaps, decide how to learn, and determine whether they have actually improved. In contrast, existing work on LLM self-evolution typically begins with tasks and evaluation metrics specified by humans, reducing self-evolution to optimizing an explicit objective rather than deciding what and how to learn. We introduce ASPIRE, a benchmark for vague-goal-driven self-evolution. ASPIRE provides only a natural-language capability goal while downstream evaluation tasks remain hidden. The agent must operationalize the goal by choosing data and update methods, constructing training and validation signals, and deciding when to evaluate. ASPIRE supports both model-weight and agent-harness evolution in a unified interactive environment and evaluates the resulting systems on a hidden, expert-authored set of 520 items spanning six goals. Our experiments show that vague goals redirect search effort toward goal interpretation. Current agents routinely complete training and harness-editing loops, but weight-level gains remain sparse and unstable, and the strongest evolved harness remains below the engineered Qwen-Agent reference. Agents often train on mismatched data and trust narrow self-evaluations, so local gains fail to transfer to hidden evaluation and continued search and training can erase earlier improvements.', 'score': 135, 'issue_id': 3209, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '77e6f234b491dac3', 'authors': ['Yuhao Wu', 'Jingyuan Zhang', 'Jiajun Shi', 'Yuxuan Zhang', 'Xinping Lei', 'Junting Zhou', 'Zexuan Wang', 'Yuchen Wu', 'Huan Zhou', 'Duo Wang', 'Yinzhu Piao', 'Yongchang Peng', 'Yunfeng Shi', 'Jin Chen', 'Zuo Wang', 'Jinkai Liu', 'Jiaheng Liu', 'Wenxuan Zhang', 'Shen Yan', 'Wenhao Huang', 'Ge Zhang'], 'affiliations': ['ByteDance', 'M-A-P', 'Singapore University of Technology and Design', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.31111.jpg', 'data': {'categories': ['#reasoning', '#training', '#alignment', '#agents', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Агенты, которые учатся сами: от расплывчатых целей к реальному развитию', 'desc': 'ASPIRE — это бенчмарк для оценки способности LLM агентов к самосовершенствованию на основе расплывчатых целей на естественном языке, без предварительно заданных метрик. Агент должен самостоятельно интерпретировать цель, выбирать данные для обучения, определять методы улучшения и решать, когда провести оценку — подобно тому, как люди учатся, начиная с неточной цели. Исследование показывает, что современные агенты часто выбирают неподходящие данные и полагаются на узкие самооценки, что приводит к нестабильным результатам и отсутствию переноса улучшений на скрытый тестовый набор. Эксперименты демонстрируют, что расплывчатые цели направляют поиск в сторону интерпретации самой цели, а прямые улучшения весов модели остаются редкими и неустойчивыми.'}, 'en': {'title': 'Empowering LLMs to Evolve from Vague Goals', 'desc': 'The ASPIRE benchmark introduces a new way for large language model (LLM) agents to evolve based on vague natural-language goals instead of predefined tasks. This approach highlights the challenges of interpreting goals, selecting appropriate data, and achieving stable improvements in model weights. Unlike traditional methods that focus on optimizing explicit objectives, ASPIRE requires agents to autonomously determine how to learn and assess their progress. The findings reveal that while agents can complete training loops, their improvements are often inconsistent and do not effectively transfer to hidden evaluations, indicating a need for better goal interpretation and data alignment.'}, 'zh': {'title': '模糊目标驱动的自我进化新基准', 'desc': 'ASPIRE是一个针对模糊自然语言目标的自我进化大型语言模型（LLM）代理的基准测试。它揭示了在目标解释、数据选择和稳定权重提升方面的挑战。与现有的自我进化工作不同，ASPIRE只提供自然语言能力目标，而下游评估任务则保持隐藏。实验表明，模糊目标能够引导搜索努力向目标解释转移，但当前代理在权重水平的提升上仍然稀疏且不稳定。'}}}, {'id': 'https://huggingface.co/papers/2609.02886', 'title': 'SolarWM: Open Data and Scalable Training for Long-Horizon Video World Models', 'url': 'https://huggingface.co/papers/2609.02886', 'abstract': 'Abstract SolarWM provides an open framework and unified training recipe for building interactive video world models across diverse data sources and generator backbones, enabling long-horizon real-time rollouts.  Generated by thinkingmachines/Inkling-Small We introduce SolarWM, a fully open foundation for building interactive video world models from data preparation through long-horizon inference. Training across heterogeneous data sources and video backbones is challenging: datasets differ in temporal scale, camera geometry, visual quality, motion, and captioning styles, while video generators use distinct representations and architectures. Naive data mixing and model-specific implementations therefore produce inconsistent supervision and make results difficult to reproduce and compare. SolarWM addresses this coupling with a reconfigurable multi-source data engine and a backbone-native adaptation framework. The engine converts 1.43 million canonical clips from 10 datasets into a unified, frame-aligned contract covering visual observations, metric camera geometry, captions, quality metadata, selection decisions, and provenance, while decoupling source processing from mixture construction. Under shared camera-conditioning, training, and inference interfaces, we instantiate four 5B--33B models based on Wan2.2, LTX-2.5, and MiniMax-H3 while preserving their native representations and objectives. A unified three-stage recipe combines bidirectional adaptation, teacher-forced autoregressive initialization, and distribution matching distillation. The resulting causal models enable real-time interaction over rollouts ranging from minutes to hours after being trained on only 5s sequences. By releasing the resulting data, pipeline, recipes, weights, and framework, SolarWM provides a reproducible and extensible foundation for interactive world-model research.', 'score': 133, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '0610487d27e8e478', 'authors': ['Junchao Huang', 'Guian Fang', 'Shengju Qian', 'Xianghao Kong', 'Zhuoran Zhao', 'Wei Huang', 'Yihua Du', 'Zixin Zhang', 'Justin Cui', 'Yuchao Gu', 'Yukang Chen', 'Xinting Hu', 'Tianyu He', 'Shaoshuai Shi', 'Zhuotao Tian', 'Xin Wang', 'Mike Zheng Shou', 'Li Jiang'], 'affiliations': ['CUHK', 'CUHK-SZ', 'HKUST', 'HKUST-GZ', 'MSRA', 'NUS', 'NVIDIA', 'SLAI', 'UCLA'], 'pdf_title_img': 'assets/pdf/title_img/2609.02886.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#video', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Единая платформа для обучения интерактивных видео-моделей мира на разнородных данных', 'desc': 'SolarWM представляет открытую платформу для создания интерактивных видео-моделей мира, которые могут обучаться на разнородных источниках данных и различных архитектурах видео-генераторов. Авторы решили проблему несовместимости данных, разработав унифицированный движок обработки данных, который преобразует 1.43 миллиона видеоклипов из 10 датасетов в единый формат с согласованной геометрией камеры и метаданными. Они обучили четыре модели размером от 5 до 33 миллиардов параметров, используя трёхэтапный рецепт включающий адаптацию, инициализацию с учителем и дистилляцию, что позволило моделям генерировать видео в реальном времени на протяжении часов. Открытый выход проекта с данными, кодом, весами моделей и фреймворком создаёт воспроизводимую основу для исследований интерактивных моделей мира.'}, 'en': {'title': 'Building Unified Interactive Video World Models with SolarWM', 'desc': 'SolarWM is an innovative framework designed for creating interactive video world models that can learn from various data sources and generator architectures. It tackles the challenges of inconsistent data by providing a unified system that aligns different datasets in terms of visual quality, camera geometry, and motion. The framework includes a multi-source data engine that processes a large number of video clips into a standardized format, facilitating easier training and inference. By offering a comprehensive training recipe and releasing all components, SolarWM aims to enhance reproducibility and extensibility in the field of interactive world-model research.'}, 'zh': {'title': 'SolarWM：构建互动视频世界模型的开放框架', 'desc': 'SolarWM是一个开放的框架，旨在构建互动视频世界模型，支持多种数据源和生成器的统一训练。它解决了不同数据集在时间尺度、相机几何、视觉质量等方面的差异，提供了一个可重配置的多源数据引擎。通过将1.43百万个标准片段转换为统一的格式，SolarWM使得模型训练和推理过程更加一致和可重复。最终，SolarWM为互动世界模型研究提供了一个可扩展的基础，支持实时交互和长时间的推理。'}}}, {'id': 'https://huggingface.co/papers/2609.02783', 'title': 'EarlyEval: Cheaper Agent Evaluation via Early Outcome Prediction', 'url': 'https://huggingface.co/papers/2609.02783', 'abstract': "Abstract EarlyEval predicts agent outcomes from intermediate behavior to reduce evaluation cost by halting runs early with minimal accuracy loss.  Generated by thinkingmachines/Inkling-Small Evaluating LLM agents is essential for guiding their development, yet it has grown prohibitively expensive: a single pass of a frontier model over an agentic benchmark can cost hundreds to thousands of dollars, a price paid repeatedly across iterative development cycles. Prior efforts, centered on benchmark distillation, reduce the number of evaluation tasks but leave the cost of executing each retained task untouched. In this work, we introduce early outcome prediction, a complementary axis of efficiency that instead cuts cost within each task. Our key insight is that an agent's final outcome is often evident from its intermediate behavior well before execution completes. We instantiate this idea in EarlyEval, a lightweight framework that trains a pair of LightGBM success and failure classifiers over behavioral, textual, and reference-solution features, and halts an agent run the moment either classifier crosses a calibrated confidence threshold, adding negligible per-step overhead. Across three benchmarks, SWE-bench Verified, TerminalBench, and Toolathlon, EarlyEval can eliminate 13%-26% of agent steps and up to 44.1% input tokens and 29.4% output tokens at 89%-97% prediction accuracy, while perturbing per-agent resolve rates by only one to two percentage points on average.", 'score': 110, 'issue_id': 3209, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'afeddfac0ec39807', 'authors': ['Yuling Shi', 'Zhensu Sun', 'Junsen Dong', 'Chengcheng Wan', 'David Lo', 'Xiaodong Gu'], 'affiliations': ['East China Normal University, Shanghai, China', 'Shanghai Innovation Institute, Shanghai, China', 'Shanghai Jiao Tong University, Shanghai, China', 'Singapore Management University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.02783.jpg', 'data': {'categories': ['#agents', '#benchmark', '#inference'], 'emoji': '⏹️', 'ru': {'title': 'Ранний выход из оценки: предсказание успеха агентов по промежуточному поведению', 'desc': 'В статье представлен метод EarlyEval для предсказания результатов работы агентов на основе промежуточного поведения, что позволяет значительно снизить стоимость эвалюации. Авторы обучают пару классификаторов LightGBM на признаках поведения агента, текстовых и эталонных решениях, которые определяют момент для остановки выполнения задачи. Экспериментальные результаты на трёх бенчмарках показывают, что метод может исключить 13-26% шагов агента и до 44.1% входных токенов при сохранении точности предсказаний 89-97%. Такой подход дополняет существующие методы оптимизации и обеспечивает значительную экономию вычислительных ресурсов при разработке LLM агентов.'}, 'en': {'title': 'EarlyEval: Cost-Effective Evaluation of LLM Agents Through Early Outcome Prediction', 'desc': 'EarlyEval is a framework designed to predict the outcomes of agent behaviors early in the evaluation process, which helps to lower the costs associated with evaluating large language model (LLM) agents. By identifying the final outcome from intermediate behaviors, it allows for early termination of runs without significantly impacting accuracy. The framework utilizes LightGBM classifiers to assess success and failure based on various features, enabling it to halt evaluations when confidence thresholds are met. This approach can significantly reduce the number of steps and tokens processed during evaluations, maintaining high prediction accuracy while minimizing resource expenditure.'}, 'zh': {'title': 'EarlyEval：高效评估代理的新方法', 'desc': 'EarlyEval 是一种通过预测代理的结果来减少评估成本的方法。它可以在执行过程中根据中间行为提前停止运行，从而降低评估的时间和金钱开销。该方法使用 LightGBM 分类器来判断代理的成功与失败，并在达到一定的置信度阈值时停止运行。实验表明，EarlyEval 能够在保持高预测准确率的同时，显著减少代理的步骤和输入输出的令牌数量。'}}}, {'id': 'https://huggingface.co/papers/2609.00638', 'title': 'It Takes Two to Match: Co-Evolving Generative Retriever with Reinforcement Learning', 'url': 'https://huggingface.co/papers/2609.00638', 'abstract': "Abstract CoGR trains LLMs to generate compact keywords for both queries and items, enabling direct inverted-index retrieval optimized via co-evolving reinforcement learning.  Generated by thinkingmachines/Inkling-Small Retrieval is the first stage of modern search and advertising systems, selecting a candidate set from a large item universe for downstream ranking and auction. Recent work increasingly leverages LLMs to improve retrieval through query expansion, data synthesis, and retrieval-feedback training. However, the generative component is typically used for query-side augmentation, while final matching is still delegated to a downstream retriever. We introduce CoGR, a retrieval framework that instead trains LLMs to directly construct retrieval representations on both query and item sides. Each generator produces a compact set of keywords, which are matched directly through an inverted index, preserving compatibility with existing keyword-based retrieval infrastructure. CoGR uses a two-stage training pipeline. Supervised fine-tuning first establishes an aligned keyword space, after which co-evolving reinforcement learning alternately optimizes the query- and item-side generators with GRPO against the opposite side's frozen index. Both sides optimize the same query-to-item retrieval F_1 objective: the query side receives retrieval F_1 directly, while the item side receives a counterfactual marginal reward measuring the change in query-side F_1 caused by its generated keywords. Across 10 representative sparse, dense, and generative baselines, CoGR achieves the best performance on both an internal APP Marketplace dataset and the public WANDS benchmark, improving F_1 over the strongest baseline by 10.9% and 36.1%, respectively. Further analysis shows stable co-evolution and increasingly aligned query--item keyword spaces over training.", 'score': 62, 'issue_id': 3208, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '8875bbda877bcd18', 'authors': ['Runpeng Dai', 'Kaili Huang', 'Changsung Kang', 'Ciya Liao'], 'affiliations': ['Apple', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2609.00638.jpg', 'data': {'categories': ['#benchmark', '#rl', '#rag', '#training'], 'emoji': '🔍', 'ru': {'title': 'Двусторонняя генерация ключевых слов для прямого поиска через совместное обучение с подкреплением', 'desc': 'CoGR — это новая система поиска, которая использует LLM для генерации компактных ключевых слов как для запросов пользователей, так и для товаров, позволяя выполнять прямое сопоставление через инвертированный индекс. Система использует двухэтапный процесс обучения: сначала супервизированная доработка устанавливает согласованное пространство ключевых слов, а затем совместная эволюция с использованием reinforcement learning оптимизирует генераторы с обеих сторон. Генераторы запросов и товаров оптимизируются попеременно против замороженного индекса противоположной стороны, используя единую метрику F₁. CoGR превосходит существующие методы на 10,9-36,1% по точности поиска, сохраняя совместимость с традиционной инфраструктурой поиска на основе ключевых слов.'}, 'en': {'title': 'Revolutionizing Retrieval with CoGR: Direct Keyword Generation for Enhanced Search', 'desc': 'The paper introduces CoGR, a novel framework that trains large language models (LLMs) to generate compact keywords for both queries and items, enhancing retrieval processes in search and advertising systems. Unlike traditional methods that focus on query-side augmentation, CoGR directly constructs retrieval representations for both sides, allowing for more efficient matching through an inverted index. The training involves a two-stage pipeline, starting with supervised fine-tuning to create an aligned keyword space, followed by co-evolving reinforcement learning to optimize both query and item generators. Results show that CoGR significantly outperforms existing baselines, achieving notable improvements in retrieval performance across various datasets.'}, 'zh': {'title': 'CoGR：优化检索的关键词生成框架', 'desc': 'CoGR是一种检索框架，旨在训练大型语言模型（LLMs）直接生成查询和项目的紧凑关键词，从而优化反向索引检索。该方法通过两阶段训练管道，首先进行监督微调以建立对齐的关键词空间，然后使用共同进化的强化学习优化查询和项目生成器。CoGR的创新之处在于，它不仅在查询侧进行关键词扩展，还在项目侧生成关键词，直接通过反向索引进行匹配。实验结果表明，CoGR在多个基准测试中表现优异，显著提高了检索性能。'}}}, {'id': 'https://huggingface.co/papers/2609.02737', 'title': 'Language Models Can Control Their Own Attention', 'url': 'https://huggingface.co/papers/2609.02737', 'abstract': "Abstract Declarative Attention lets language models declare relevant context regions during reasoning to skip most KV cache reads, reducing attended tokens with small accuracy trade-offs.  Generated by thinkingmachines/Inkling-Small Language models spend most of their attention on a small fraction of context, yet they read the entire KV cache to find the few tokens that matter. If the user asks about a previous detail in a 1M-token conversation, global attention layers must scan the full context to generate each token of the reply. A prominent approach mitigates this cost by pre-selecting relevant tokens via lightweight proxy scores, but this extrinsic scoring still incurs O(N) per step. We take an intrinsic approach motivated by the simple question: wouldn't the model already know which parts of the context are relevant? To this end, we introduce Declarative Attention (DA), a protocol that elicits the model to declare where it needs to attend within its chain-of-thought, partitioning generation into three modes: <global> (full context), <focus> (a specific region), and <local> (recent output only). The inference engine parses these declarations like tool calls and skips most of the KV cache read. Under zero-shot evaluation across 15 long-context tasks, DA on off-the-shelf models (Gemma-4-31B, Qwen-3.6-27B) significantly reduces total attended tokens during decoding (52.0%, 31.1%) with modest accuracy drops (1.27pp, 2.75pp) that shrink with model scale. DA unlocks a new axis of sparse attention, with further potential under training-based methods that future work can explore.", 'score': 50, 'issue_id': 3209, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'e404eec501efa42a', 'authors': ['Namgyu Ho', 'Huzama Ahmad', 'Woosung Koh', 'Se-Young Yun', 'Tal Schuster', 'Cicero Nogueira dos Santos'], 'affiliations': ['Google DeepMind', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.02737.jpg', 'data': {'categories': ['#reasoning', '#architecture', '#inference', '#long_context', '#training', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Модель сама знает, на что ей смотреть: декларативное внимание для эффективного вывода', 'desc': 'В этой работе предложен метод Declarative Attention, который позволяет языковым моделям декларировать релевантные области контекста во время рассуждения, чтобы избежать чтения большей части KV кеша. Вместо экзогенного поиска релевантных токенов через прокси-оценки, модель сама указывает, на какие части контекста ей нужно обратить внимание, используя три режима: глобальное внимание, сфокусированное внимание на конкретном регионе и локальное внимание на последние выходы. Инженная система парсит эти объявления как вызовы инструментов и пропускает большую часть операций чтения из KV кеша. Экспериментальные результаты показывают значительное снижение количества обрабатываемых токенов (31-52%) при скромном падении точности (1-3 процентных пункта) на моделях Gemma и Qwen.'}, 'en': {'title': 'Focus on What Matters: Declarative Attention in Language Models', 'desc': 'Declarative Attention (DA) is a new method that allows language models to identify and focus on relevant parts of the context during reasoning, which helps to reduce the number of tokens they need to attend to. Instead of reading the entire key-value (KV) cache, DA enables models to declare specific regions of interest, thus optimizing the attention mechanism. This approach partitions the generation process into three modes: global, focus, and local, allowing for more efficient processing. In tests, DA has shown to significantly decrease the number of attended tokens while maintaining acceptable accuracy levels, especially as model size increases.'}, 'zh': {'title': '声明性注意力：提升语言模型推理效率的新方法', 'desc': '本文介绍了一种名为声明性注意力（Declarative Attention, DA）的方法，旨在提高语言模型在推理时的效率。传统的语言模型在处理长文本时，通常需要读取整个键值缓存（KV cache），而DA允许模型声明其关注的上下文区域，从而跳过大部分不必要的读取。通过将生成过程分为全局（<global>）、聚焦（<focus>）和局部（<local>）三种模式，DA显著减少了解码过程中的关注令牌数量，同时保持了相对较小的准确性损失。实验结果表明，DA在多个长上下文任务中表现出色，展示了稀疏注意力的新潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.01147', 'title': 'On the Design Fundamentals of Pixel Text Representation Learning', 'url': 'https://huggingface.co/papers/2609.01147', 'abstract': 'Abstract Pixel Linguist II improves visual text encoding through variable resolution training, natural image-text grounding, layout-aware rendering, and multilingual curricula, achieving state-of-the-art results and strong compression robustness.  Generated by thinkingmachines/Inkling-Small Text-rich visual inputs require models that can read, retrieve, and compress language directly in pixel space, yet existing pixel-text encoders struggle with fixed resolution pretraining, visual shortcut learning, weak visual grounding, and multilingual visual text understanding. In this work, we investigate the fundamental design principles required for robust visual text representation learning. Through systematic controlled ablations, we identify four critical components: variable image resolutions and rendered font sizes provide spatial proxies for high-resolution document generalization; natural image-text pairs are indispensable for grounding and prevent text-only collapse; layout-aware rendering helps prevent pixel-level shortcuts; and a two-stage multilingual curriculum enables effective cross-lingual alignment. By integrating these principles into a scalable training recipe, we train Pixel Linguist II, a native-resolution vision encoder trained with on-the-fly rendering, unified contrastive grounding, and a multilingual curriculum over 280M training examples. Pixel Linguist II sets new state-of-the-art results on English, cross-lingual, and multilingual Visual STS and ViDoRe, while also enabling better MLLM downstream evaluation. Notably, Pixel Linguist II remains robust under 80\\% visual token compression, showing great promise for optical context compression. Our code and resources are available at https://github.com/Pixel-Linguist/Pixel-Linguist-II.', 'score': 26, 'issue_id': 3209, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'afd11584e87a33a1', 'authors': ['Chaohao Yuan', 'Ruifeng Yuan', 'Zhuoxu Huang', 'Yu Rong', 'Hong Cheng', 'Hou Pong Chan', 'Chenghao Xiao'], 'affiliations': ['Aberystwyth University', 'DAMO Academy, Alibaba Group', 'Fudan University', 'Hupan Lab', 'Shanghai University of Finance and Economics', 'The Chinese University of Hong Kong', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2609.01147.jpg', 'data': {'categories': ['#multilingual', '#open_source', '#low_resource', '#training', '#cv', '#multimodal', '#benchmark'], 'emoji': '📖', 'ru': {'title': 'Универсальный кодировщик текста в пиксельном пространстве с многоязычной адаптацией', 'desc': 'Pixel Linguist II — это улучшенная модель для кодирования визуального текста, которая обрабатывает текст прямо в пиксельном пространстве изображений. Авторы выявили четыре критических компонента для робастного представления: переменное разрешение изображений, естественные пары изображение-текст для якорения, учёт макета при рендеринге и двухэтапный многоязычный curriculum learning. Модель обучена на 280 млн примеров с помощью контрастивного обучения и демонстрирует лучшие результаты на задачах визуальной семантической схожести и визуального поиска на английском и других языках. Особенность системы — её устойчивость к компрессии визуальных токенов на 80%, что важно для оптимизации вычислительных затрат.'}, 'en': {'title': 'Revolutionizing Visual Text Encoding with Pixel Linguist II', 'desc': 'Pixel Linguist II enhances the way models understand and encode visual text by using advanced training techniques. It addresses common issues in existing pixel-text encoders, such as fixed resolution limitations and weak visual grounding. The model incorporates variable image resolutions, natural image-text pairings, layout-aware rendering, and a multilingual curriculum to improve performance. As a result, it achieves state-of-the-art results in various visual text tasks while maintaining robustness against significant visual token compression.'}, 'zh': {'title': '视觉文本编码的新突破', 'desc': 'Pixel Linguist II 通过可变分辨率训练、自然图像-文本对接、布局感知渲染和多语言课程，提升了视觉文本编码的效果。该模型解决了现有像素文本编码器在固定分辨率预训练、视觉快捷学习和多语言理解方面的不足。研究表明，四个关键组件对于稳健的视觉文本表示学习至关重要，包括可变图像分辨率、自然图像-文本对、布局感知渲染和多语言课程。Pixel Linguist II 在多个任务上取得了最先进的结果，并在高达80%的视觉标记压缩下保持了良好的鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2608.21450', 'title': 'Beyond Visual Similarity: Entity-Aligned Retrieval for Knowledge-Based Visual Question Answering', 'url': 'https://huggingface.co/papers/2608.21450', 'abstract': 'Abstract KBMR uses a multimodal language model to embed images by semantic identity rather than surface appearance, improving retrieval and visual question answering via continuous distillation and hard negative sampling.  Generated by thinkingmachines/Inkling-Small Knowledge-Based Visual Question Answering (KB-VQA) relies on retrieving external information to answer queries involving long-tail entities. However, existing retrieval pipelines predominantly employ CLIP-style dual encoders, which prioritize surface-level visual similarity over entity-level semantic alignment. This paradigm often fails when semantically identical concepts exhibit large visual variations or when distinct entities appear visually similar. To address this, we propose KBMR, the first MLLM-based embedding retriever tailored for KB-VQA. Leveraging the robust autoregressive capabilities of MLLMs, KBMR maps images into a semantic space that better preserves concept identity. To tackle the challenge of noisy supervision in Wikipedia-scale retrieval, we introduce an MLLM-based semantic discriminator that generates continuous entity-consistency weights. These weights guide a novel continuous semantic distillation objective, enabling effective hard negative sampling and soft supervision beyond rigid binary labels. Extensive experiments demonstrate that KBMR significantly outperforms CLIP baselines, yielding up to a 14.7% improvement in retrieval Recall@1 and a 9.4% gain in end-to-end VQA accuracy. Code is available at https://github.com/realHarryX/KBMR.', 'score': 26, 'issue_id': 3210, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': 'a575a64de0d2f3a2', 'authors': ['Hangrui Xu', 'Zhengxian Wu', 'Yunyao Yu', 'Zhuohong Chen', 'Rui Cong', 'Xiangwen Deng', 'Zhifang Liu', 'Peng Jiao', 'Haoqian Wang'], 'affiliations': ['Shenzhen International Graduate School, Tsinghua University', 'University of Arizona'], 'pdf_title_img': 'assets/pdf/title_img/2608.21450.jpg', 'data': {'categories': ['#multimodal', '#rag', '#cv'], 'emoji': '🔍', 'ru': {'title': 'Семантические встраивания вместо визуального сходства в поиске знаний', 'desc': 'В работе предложен KBMR — первый retriever на основе многомодального языковой модели для улучшения визуального поиска и ответов на вопросы о изображениях. Вместо поверхностного сравнения внешнего вида, как в CLIP, модель встраивает изображения в семантическое пространство, которое лучше сохраняет идентичность сущностей и концепций. Авторы вводят семантический дискриминатор на основе MLLM, который генерирует веса согласованности сущностей для мягкой разметки и эффективного отбора сложных отрицательных примеров. Экспериментальные результаты показывают улучшение на 14.7% в метрике Recall@1 и на 9.4% в точности задачи VQA по сравнению с CLIP baseline.'}, 'en': {'title': 'Enhancing Image Retrieval with Semantic Identity', 'desc': 'The paper introduces KBMR, a multimodal language model designed to improve image embedding by focusing on semantic identity rather than just visual appearance. This approach enhances retrieval and visual question answering (VQA) by using continuous distillation and hard negative sampling techniques. Unlike traditional methods that rely on surface-level visual similarities, KBMR effectively maps images into a semantic space that maintains concept identity, even when visual variations exist. The model also incorporates a semantic discriminator to manage noisy supervision, leading to significant performance improvements over existing CLIP-based systems in both retrieval and VQA tasks.'}, 'zh': {'title': '通过语义嵌入提升视觉问答的准确性', 'desc': 'KBMR是一种多模态语言模型，旨在通过语义身份而非表面外观来嵌入图像，从而改善检索和视觉问答。该方法利用MLLM的自回归能力，将图像映射到更好地保留概念身份的语义空间。为了解决维基百科规模检索中的噪声监督问题，KBMR引入了一种基于MLLM的语义鉴别器，生成连续的实体一致性权重。这些权重指导一种新的连续语义蒸馏目标，使得有效的困难负样本采样和软监督成为可能。'}}}, {'id': 'https://huggingface.co/papers/2608.31100', 'title': 'S3Gym: Can LLMs Turn Self-Testing and Self-Judging into Self-Improvement?', 'url': 'https://huggingface.co/papers/2608.31100', 'abstract': 'Abstract S³Gym evaluates whether large language model agents can self-test, self-judge, and self-improve through interaction experience across text-based games, revealing that effective self-improvement depends on task structure and experience representation.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) increasingly interact with external environments and accumulate substantial behavioral experience, yet existing agent benchmarks largely evaluate them as fixed policies. It therefore remains unclear whether an agent can actively test its behavior, judge the resulting experience, and use that experience to improve future decisions. We introduce S\\textsuperscript{3Gym}, an interactive benchmark for evaluating LLM self-improvement through three coupled capabilities: Self-Testing, Self-Judging, and Self-Improvement. S^3Gym separates permissive exploration from strict held-out evaluation and instantiates this protocol in seven text-based games with executable environment verifiers. We evaluate three pathways for incorporating interaction experience: direct History ICL, score-conditioned Summary Memory, and parameter Training.   Our experiments reveal that self-improvement is neither automatic nor uniform. Context-level experience improves performance for several model--game pairs, but the most effective pathway depends strongly on the task structure: summaries are beneficial when experience can be compressed into reusable strategic rules, yet often underperform raw history when success depends on precise, state-contingent information. Parameter training produces substantial gains on some tasks, but also exhibits unstable improvement and severe negative transfer on others. These findings show that recognizing successful actions is insufficient; agents must also transform feedback into executable and transferable policies. S^3Gym provides a unified framework for diagnosing this process and identifying the bottlenecks that prevent agents from translating interaction experience into reliable self-improvement.', 'score': 25, 'issue_id': 3209, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b508a6e3632c0fb5', 'authors': ['Jiajun Shi', 'Siyuan Tao', 'Yuhao Wu', 'Zexuan Wang', 'Jingyuan Zhang', 'Jiaheng Liu', 'Xinping Lei', 'Xinrong Zhang', 'Siyuan Fang', 'Zhewen Tan', 'Tianle Cai', 'Junhao Fang', 'Jiameng Huang', 'Yueyang Wang', 'Jinkai Liu', 'Yuxuan Zhang', 'Jian Yang', 'Zhoujun Li', 'Shen Yan', 'Wenhao Huang', 'Ge Zhang'], 'affiliations': ['ByteDance', 'M-A-P', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.31100.jpg', 'data': {'categories': ['#reasoning', '#games', '#transfer_learning', '#training', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Самосовершенствующиеся агенты: когда опыт становится знанием', 'desc': 'В работе представлена S³Gym — интерактивный бенчмарк для оценки способности LLM-агентов к самосовершенствованию через три взаимосвязанные возможности: самотестирование, самооценка и самоулучшение на основе опыта взаимодействия с текстовыми играми. Исследователи изучили три подхода интеграции опыта: прямое вложение истории в контекст (ICL), условное суммирование памяти по скорам и обучение параметров модели. Результаты показывают, что эффективность самоулучшения зависит от структуры задачи: сжатые резюме помогают, когда можно вывести переиспользуемые стратегии, но проигрывают сырой истории, когда успех требует точной информации о состояниях. Работа выявила, что распознавание успешных действий недостаточно — агентам необходимо трансформировать обратную связь в исполняемые и передаваемые политики поведения.'}, 'en': {'title': 'Empowering Agents: Self-Improvement through Interaction', 'desc': 'The paper introduces S³Gym, a benchmark designed to evaluate the self-improvement capabilities of large language model agents through their interactions in text-based games. It focuses on three key abilities: Self-Testing, Self-Judging, and Self-Improvement, highlighting that effective self-improvement is influenced by the structure of tasks and how experiences are represented. The study finds that while context-level experience can enhance performance, the best method for incorporating this experience varies depending on the task, with some tasks benefiting from summaries and others from raw history. Overall, the research emphasizes that agents must not only recognize successful actions but also convert feedback into actionable strategies for consistent improvement.'}, 'zh': {'title': '自我改进：大型语言模型的新挑战', 'desc': 'S³Gym是一个评估大型语言模型（LLM）自我测试、自我判断和自我改进能力的互动基准。研究表明，有效的自我改进依赖于任务结构和经验表示。通过在七个文本游戏中进行实验，发现自我改进并非自动发生，且不同的经验整合方式对任务的影响各异。S³Gym为理解和诊断这一过程提供了统一框架，帮助识别阻碍代理将互动经验转化为可靠自我改进的瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2609.01657', 'title': 'NeoMME: A Single-Tower Multimodal-Native Multilingual Foundation Encoder for Efficient Fine-Tuning and Inference', 'url': 'https://huggingface.co/papers/2609.01657', 'abstract': 'Abstract NeoMME introduces small bidirectional multimodal encoders pretrained with masked discrete diffusion that achieve strong visual document retrieval and high compression of late-interaction embeddings.  Generated by thinkingmachines/Inkling-Small Multimodal models often build on architectures designed for generative vision-language modeling, typically combining separately pretrained vision encoders with causal language models. Visual document retrievers such as ColPali repurpose these models as encoders, carrying over the parameter and compute overhead of a VLM for a non-generative task.   We introduce NeoMME, a family of 260M and 800M-parameter Multimodal and Multilingual bidirectional Encoders that process multilingual text and raw image patches in a single bidirectional Transformer encoder. Both models are pretrained from scratch with a masked discrete-diffusion text objective, conditioned on visible image patches for multimodal examples. Both support a 16,384-token context, enough to encode up to two standard 4K UHD images.   To demonstrate its downstream capabilities, we fine-tune NeoMME with jointly trained dense and late-interaction heads. On the ViDoRe v3 benchmark, the resulting NeoMME-Retriever 260M outperforms all evaluated models strictly below 800M parameters with 0.523 nDCG@10, while NeoMME-Retriever 800M reaches 0.556. At a matched 2048x2048 image input size on an NVIDIA L40S, NeoMME-260M encodes pages with about 2x the throughput of ColModernVBERT. Hierarchical token pooling and asymmetric quantization compress late-interaction multimodal document embeddings by 255x while preserving over 95% of baseline nDCG@10. We contribute NeoMME to Hugging Face Transformers and release the pretrained backbone and retrieval-compatible checkpoints under Apache 2.0 at https://hf.co/collections/Hcompany/neomme.', 'score': 21, 'issue_id': 3210, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '437e4d09c1f3c3df', 'authors': ['Aurélien Lac', 'Tony Wu'], 'affiliations': ['Company', 'Hugging Face'], 'pdf_title_img': 'assets/pdf/title_img/2609.01657.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#architecture', '#multimodal', '#multilingual', '#optimization', '#open_source', '#inference', '#diffusion', '#small_models'], 'emoji': '📄', 'ru': {'title': 'Компактные мультимодальные энкодеры для эффективного поиска визуальных документов', 'desc': 'NeoMME представляет собой семейство компактных двунаправленных мультимодальных энкодеров размером 260M и 800M параметров, которые обрабатывают текст и визуальные данные одновременно в едином Трансформере. Модели предварительно обучены с использованием маскированной дискретной диффузии, что позволяет им эффективно кодировать документы и изображения высокого разрешения (до 4K UHD). На бенчмарке ViDoRe v3 NeoMME-Retriever достигает конкурентоспособных результатов поиска, превосходя модели меньшего размера и работая значительно быстрее аналогов. Благодаря иерархической группировке токенов и асимметричной квантизации embeddings сжимаются в 255 раз при сохранении 95% качества поиска.'}, 'en': {'title': 'Revolutionizing Multimodal Document Retrieval with NeoMME', 'desc': 'NeoMME is a new type of multimodal encoder that combines text and image processing in a single model, using a bidirectional Transformer architecture. It is pretrained with a unique method called masked discrete diffusion, which helps it understand both languages and images effectively. The model is designed to improve visual document retrieval tasks while also compressing the size of the embeddings it generates. With impressive performance on benchmarks, NeoMME shows that it can outperform other models in its class while maintaining high efficiency and low computational costs.'}, 'zh': {'title': 'NeoMME：高效的多模态文档检索新方法', 'desc': 'NeoMME是一种小型双向多模态编码器，采用掩蔽离散扩散进行预训练，能够实现强大的视觉文档检索和高效的晚期交互嵌入压缩。该模型结合了多语言文本和原始图像块，使用单个双向Transformer编码器进行处理。通过在ViDoRe v3基准测试中微调，NeoMME-Retriever在参数少于800M的模型中表现优异，显示出其在文档检索任务中的强大能力。此外，NeoMME还通过分层令牌池化和非对称量化技术，显著压缩了多模态文档嵌入的大小，同时保持了高达95%的检索性能。'}}}, {'id': 'https://huggingface.co/papers/2609.01740', 'title': 'ZipTok3D: High-Fidelity 3D Tokenization with Compact Token Prefixes', 'url': 'https://huggingface.co/papers/2609.01740', 'abstract': 'Abstract ZipTok3D organizes 3D geometry into compact global-token prefixes with iterative decoding to achieve high-fidelity reconstruction from extremely short token sequences.  Generated by thinkingmachines/Inkling-Small Compact token sequences are essential for efficient 3D generation. However, existing 3D tokenizers typically organize latent representations either over spatial regions or as fixed-size sets of global tokens, both suffering sharp reconstruction degradation when compressed to extremely low token budgets. In this paper, we present ZipTok3D, a 3D tokenizer designed for high-fidelity reconstruction from extremely short token sequences. Its key idea is to organize object geometry into progressively informative global-token prefixes and unfold these compact representations through iterative decoding. Specifically, nested dropout randomly truncates the latent sequence after encoding during training and requires each retained prefix to reconstruct the complete object, thereby prioritizing essential geometric information in the leading tokens. The decoder then repeatedly applies a parameter-shared Transformer block to recover fine-grained geometry from each prefix without a separate generative sampling stage. With the same token dimension, ZipTok3D achieves reconstruction quality comparable to the 32-token COD-VAE baseline using only one token on ShapeNet and four on TRELLIS, yielding 32times and 8times shorter token sequences, respectively.', 'score': 19, 'issue_id': 3210, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'f8f4c0223d452e33', 'authors': ['Mingda Lin', 'Weijie Wang', 'Zeyu Zhang', 'Bowen Cui', 'Yefei He', 'Haoyu Zhao', 'Yuanyu He', 'Donny Y. Chen', 'Feng Chen', 'Bohan Zhuang'], 'affiliations': ['Monash University', 'University of Adelaide', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01740.jpg', 'data': {'categories': ['#architecture', '#3d', '#training'], 'emoji': '📦', 'ru': {'title': 'Экстремальное сжатие 3D геометрии в глобальные префиксы токенов', 'desc': 'ZipTok3D представляет новый 3D токенизатор, который организует геометрию объектов в компактные глобальные префиксы токенов для эффективной реконструкции из очень коротких последовательностей. Ключевой инновацией является использование вложенного dropout во время обучения, который случайным образом усекает скрытую последовательность и заставляет каждый оставшийся префикс реконструировать полный объект, приоритизируя важную геометрическую информацию в начальных токенах. Декодер применяет повторно параметр-общую Transformer архитектуру для восстановления детальной геометрии из каждого префикса без отдельного этапа генеративной выборки. Метод достигает качества реконструкции, сравнимого с базовым методом из 32 токенов, используя всего один токен на ShapeNet и четыре на TRELLIS, обеспечивая сжатие в 32 и 8 раз соответственно.'}, 'en': {'title': 'Revolutionizing 3D Reconstruction with Compact Token Sequences', 'desc': 'ZipTok3D is a novel 3D tokenizer that enhances the reconstruction of 3D objects using very short token sequences. It organizes 3D geometry into compact global-token prefixes, allowing for high-fidelity reconstruction even with limited data. The method employs iterative decoding and nested dropout to ensure that essential geometric information is prioritized in the retained tokens. As a result, ZipTok3D achieves impressive reconstruction quality with significantly fewer tokens compared to existing methods.'}, 'zh': {'title': '高效3D重建的紧凑标记序列', 'desc': 'ZipTok3D是一种3D标记器，旨在通过极短的标记序列实现高保真重建。它的核心思想是将物体几何形状组织成逐步信息丰富的全局标记前缀，并通过迭代解码展开这些紧凑的表示。通过嵌套丢弃，训练过程中随机截断潜在序列，确保每个保留的前缀能够重建完整的物体，从而优先考虑重要的几何信息。ZipTok3D在ShapeNet上仅使用一个标记，在TRELLIS上使用四个标记，分别实现了32倍和8倍更短的标记序列，同时重建质量与32标记的COD-VAE基线相当。'}}}, {'id': 'https://huggingface.co/papers/2609.00591', 'title': 'A Glance Is All You Need: Single-Pass Fine-Grained Image Captioning with SimLoss', 'url': 'https://huggingface.co/papers/2609.00591', 'abstract': 'Abstract SimLoss uses embedding-space contrastive supervision to enable single-pass fine-grained image captioning that matches multi-stage quality at much lower latency.  Generated by thinkingmachines/Inkling-Small An image may be worth a thousand words, but most captioning models describe it in only a few. Modern vision-language models produce fluent high-level captions, yet routinely miss the attributes, counts, textures, materials, and spatial relations that make an image visually specific. Recent multi-stage systems recover some of these details through generation, decomposition, verification, and rewriting, but they do so at the expense of substantially higher inference latency.   We propose SimLoss, a reference-free embedding-space objective for single-pass fine-grained image captioning. SimLoss trains a vision-language model to align its projected hidden-state representation with a frozen image embedding through an InfoNCE contrastive loss, supplying a dense visual supervision signal before any text is decoded, and requiring neither human-written fine-grained captions nor pseudo-captions from a multi-stage pipeline. We instantiate it as SimLoss FFT, which backpropagates through a locally available embedding model, and SimLoss GRPO, which treats that model as a black-box reward.   Compared with single-pass, multi-stage verification, reward-optimized, and perception-aware baselines, the fully differentiable fine-tuning variant, SimLoss FFT, achieves the highest precision while nearly matching the F1 score of the multi-stage method, all while retaining single-pass inference and running roughly 20 times faster than the multi-stage pipeline.   The reward-based variant SimLoss GRPO attains the strongest recall. Together, these results show that embedding-space supervision can recover the quality of multi-stage verification at the latency of a single-pass captioner.', 'score': 16, 'issue_id': 3209, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '76bdcfb78ebdc340', 'authors': ['Suryaansh Jain', 'Rahasya Barkur', 'Vishal G', 'Ryan Rossi', 'Franck Dernoncourt', 'Jack Wang', 'Koustava Goswami', 'Nedim Lipka', 'Puneet Mathur', 'Samyadeep Basu', 'Seunghyun Yoon'], 'affiliations': ['Adobe Research', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2609.00591.jpg', 'data': {'categories': ['#training', '#cv', '#multimodal', '#inference'], 'emoji': '🖼️', 'ru': {'title': 'Детальные подписи за один проход: контрастное обучение вместо многоэтапной обработки', 'desc': 'SimLoss — это метод обучения моделей vision-language для детальной подписи к изображениям, использующий контрастное обучение в пространстве эмбеддингов. Вместо традиционных многоэтапных систем, требующих генерации, декомпозиции и переписания, SimLoss достигает сопоставимого качества за один проход через сеть. Метод предоставляет плотный визуальный сигнал обратной связи перед декодированием текста, не требуя человеческих аннотаций или псевдо-подписей. Две реализации — SimLoss FFT (полностью дифференцируемая) и SimLoss GRPO (с чёрным ящиком) — демонстрируют качество многоэтапных систем при скорости однопроходных моделей, работая примерно в 20 раз быстрее.'}, 'en': {'title': 'Fast and Detailed Image Captioning with SimLoss', 'desc': "SimLoss introduces a new method for fine-grained image captioning that uses embedding-space contrastive supervision. This approach allows the model to generate detailed captions in a single pass, achieving high quality similar to multi-stage systems but with much lower latency. By aligning the model's hidden-state representation with a fixed image embedding using InfoNCE contrastive loss, SimLoss provides effective visual supervision without needing human-written captions. The results demonstrate that SimLoss can match the precision and recall of more complex systems while being significantly faster in processing time."}, 'zh': {'title': '单次推理，细粒度描述的新时代', 'desc': 'SimLoss是一种基于嵌入空间对比监督的单次细粒度图像描述方法，能够在较低延迟下实现与多阶段质量相匹配的效果。该方法通过InfoNCE对比损失训练视觉-语言模型，使其投影的隐藏状态表示与冻结的图像嵌入对齐，从而在解码文本之前提供密集的视觉监督信号。与传统的多阶段系统相比，SimLoss在保持单次推理的同时，显著提高了精度，并且运行速度快约20倍。结果表明，嵌入空间监督能够在单次描述的延迟下恢复多阶段验证的质量。'}}}, {'id': 'https://huggingface.co/papers/2609.02817', 'title': 'Cliff: Learning Process Rewards from the First Mistake', 'url': 'https://huggingface.co/papers/2609.02817', 'abstract': "Abstract Cliff improves reinforcement learning with verifiable rewards by using an off-the-shelf language model to detect the first reasoning error and shaping token-level advantages accordingly.  Generated by thinkingmachines/Inkling-Small Reinforcement learning with verifiable rewards (RLVR) has emerged as a powerful paradigm for large language model (LLM) post-training, but its reliance on coarse outcome rewards leads to limited guidance on intermediate reasoning processes. Existing approaches such as process reward modeling and on-policy distillation introduce additional constraints, such as reliance on a specialized reward model or assuming identical reasoning patterns between teacher and student. Nevertheless, we observe that once a reasoning process first goes wrong, evaluating the subsequent reasoning provides limited additional information, as it is already conditioned on an invalid prefix. Therefore, we propose Cliff, a reward shaping strategy that utilizes an off-the-shelf LLM as a teacher to identify the first mistake in each rollout. As a result, the rollout is naturally decomposed into two parts: a correct prefix and an incorrect suffix. Cliff then converts this signal into token-level advantages, assigning positive advantages for the correct prefix and negative feedback afterward. Experiments across 12 different scenarios demonstrate that Cliff consistently improves reasoning performance, outperforming on-policy distillation by 15% and standard GRPO by 7%, even with teachers of modest capability. Furthermore, we analyse the role of ``ground truth'' in Cliff and investigate its training dynamics. These results establish Cliff as a simple, general and effective approach for improving RLVR with richer, fine-grained supervision.", 'score': 15, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '53c9bec3e7b8a24f', 'authors': ['Peixuan Han', 'Runhui Wang', 'Ketan Ramaneti', 'Jie Hao', 'Gerald Friedland', 'Chris Kong'], 'affiliations': ['Amazon Web Services', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.02817.jpg', 'data': {'categories': ['#reasoning', '#rl', '#training', '#optimization'], 'emoji': '🧗', 'ru': {'title': 'Останови рассуждение в момент первой ошибки', 'desc': 'Cliff — это метод формирования вознаграждения (reward shaping), который улучшает обучение с подкреплением при наличии верифицируемых наград для больших языковых моделей. Подход использует вспомогательную языковую модель для обнаружения первой ошибки рассуждения в каждом образце и разделяет траекторию на корректный префикс и некорректный суффикс. На основе этого разделения метод назначает положительные преимущества токенам в правильной части и отрицательные в ошибочной части, создавая более детальный сигнал обучения. Экспериментальные результаты на 12 сценариях показывают, что Cliff превосходит существующие подходы на 15% по сравнению с on-policy дистилляцией и на 7% по сравнению со стандартным GRPO.'}, 'en': {'title': 'Cliff: Enhancing Reinforcement Learning with Fine-Grained Feedback', 'desc': 'The paper introduces Cliff, a novel approach to enhance reinforcement learning with verifiable rewards (RLVR) by leveraging a language model to identify the first reasoning error during the learning process. Instead of relying solely on coarse outcome rewards, Cliff shapes the learning signal by providing token-level advantages based on the correctness of reasoning segments. This method decomposes the reasoning into a correct prefix and an incorrect suffix, allowing for more precise feedback during training. Experimental results show that Cliff significantly improves reasoning performance across various scenarios, demonstrating its effectiveness over existing methods.'}, 'zh': {'title': 'Cliff：提升增强学习的有效策略', 'desc': 'Cliff是一种增强学习方法，通过使用现成的语言模型来检测推理过程中的第一个错误，从而改善可验证奖励的效果。该方法将推理过程分为正确的前缀和错误的后缀，并为正确的前缀分配正向优势，而对错误部分给予负向反馈。实验表明，Cliff在12种不同场景中均能显著提高推理性能，超越了传统的策略蒸馏方法。通过对“真实情况”的分析，Cliff被确立为一种简单、通用且有效的增强学习改进方法。'}}}, {'id': 'https://huggingface.co/papers/2608.29846', 'title': 'Influence-Directed Distillation: Solving the Diversity Bottleneck in Sampled-Token On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.29846', 'abstract': "Abstract Influence-Directed Adaptive On-Policy Distillation improves diversity transfer in reasoning model distillation by selectively preserving entropy-expanding updates and replacing entropy-contracting ones with adaptive advantage shrinkage.  Generated by thinkingmachines/Inkling-Small Sampled-token on-policy distillation (OPD) efficiently transfers capabilities from teacher to student using student-generated tokens, requiring teacher probabilities only for sampled tokens. Yet it frequently suffers from diversity distillation failure: the student's pass@1 improves while its pass@k plateaus, failing to inherit the teacher's diversity. To explain this, we introduce First-Order Local Entropy Influence, a signed first-order proxy that decouples each update's entropy effect into the teacher--student log-probability gap and the student's local probability structure, and empirically links entropy contraction to negative-influence positions. Motivated by this, we propose Influence-Directed Adaptive On-Policy Distillation (IDA-OPD): rather than relying on costly full-vocabulary Forward-KL objectives, it preserves entropy-expanding updates while replacing entropy-contracting ones with divergence-adaptive advantage shrinkage, using only the teacher's sampled-token log-probability. Experiments on reasoning-oriented distillation show IDA-OPD consistently improves pass@k, inheriting the teacher's diversity through distillation, matches the strongest teacher-informed methods at strictly lower cost, and broadly maintains vanilla OPD's pass@1, all without full-vocabulary teacher information.", 'score': 14, 'issue_id': 3208, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': 'e91adfba7a387d0a', 'authors': ['Run Yang', 'Runpeng Dai', 'Jie Sun', 'Jielei Zhang', 'Fan Zhou', 'Hongtu Zhu', 'Peiyi Li', 'Longwen Gao'], 'affiliations': ['BiliBili.Inc', 'Shanghai University of Finance and Economics', 'University of North Carolina at Chapel Hill', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.29846.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Сохранение разнообразия при дистилляции через влияние на энтропию', 'desc': 'В работе предлагается метод Influence-Directed Adaptive On-Policy Distillation (IDA-OPD) для улучшения передачи разнообразия при дистилляции моделей рассуждения. Авторы выявили проблему отказа в дистилляции разнообразия, когда метрика pass@1 студента улучшается, но pass@k не растёт, и предложили использовать First-Order Local Entropy Influence для анализа влияния каждого обновления на энтропию. Новый метод сохраняет обновления, которые увеличивают энтропию, а обновления, сокращающие энтропию, заменяет адаптивным сжатием преимущества без использования полного словаря. Экспериментальные результаты показывают, что IDA-OPD эффективнее наследует разнообразие учителя, достигает лучших результатов с меньшими вычислительными затратами и сохраняет качество базового метода OPD.'}, 'en': {'title': 'Enhancing Diversity in Model Distillation with IDA-OPD', 'desc': "This paper presents Influence-Directed Adaptive On-Policy Distillation (IDA-OPD), a method that enhances the transfer of diverse reasoning capabilities from a teacher model to a student model in machine learning. It addresses the issue of diversity distillation failure, where the student's performance improves in some areas but plateaus in others, by selectively preserving updates that increase entropy and replacing those that decrease it. The authors introduce a new metric, First-Order Local Entropy Influence, to analyze the impact of each update on the model's diversity. Through experiments, IDA-OPD demonstrates improved performance in maintaining diversity while being more efficient than traditional methods that require full vocabulary teacher information."}, 'zh': {'title': '提升推理模型多样性的自适应蒸馏方法', 'desc': '本文提出了一种名为影响导向自适应在线蒸馏（IDA-OPD）的方法，旨在改善推理模型蒸馏中的多样性转移。该方法通过选择性保留扩展熵的更新，并用自适应优势收缩替换收缩熵的更新，从而提高了学生模型的多样性。研究引入了一阶局部熵影响的概念，帮助理解更新对熵的影响，并将其与教师和学生之间的概率结构联系起来。实验结果表明，IDA-OPD在推理导向的蒸馏任务中，能够有效提高学生模型的多样性，同时降低了计算成本。'}}}, {'id': 'https://huggingface.co/papers/2609.02812', 'title': 'VibeVoice-ASR-Streaming Technical Report', 'url': 'https://huggingface.co/papers/2609.02812', 'abstract': "Abstract A streaming, LLM-based end-to-end model unifies speaker-attributed speech recognition and diarization for low-latency real-time applications.  Generated by thinkingmachines/Inkling-Small Traditional speaker-attributed ASR systems treated ASR and speaker diarization as two separate tasks. Recently, end-to-end models such as VibeVoice-ASR have unified the two tasks within a single model. However, existing unified models still mainly support offline recognition, making it difficult to meet the low-latency requirements of real-time voice assistants and agents. To tackle this issue, we present VibeVoice-ASR-Streaming, one of the first LLM-based end-to-end approaches to streaming speaker-attributed ASR. It interleaves fixed-size audio chunks, a small amount of lookahead audio and previous text. This allows the model to produce ''who said what'' as speech arrives, without a separate diarization stage. For transcription accuracy, our 7B model achieves the lowest average WER/CER across five evaluation sets. For speaker attribution, it achieves the best or tied-best on 12 of 13 evaluation settings. We release the 1.5B and 7B model weights together with inference code.", 'score': 10, 'issue_id': 3209, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'ae90cc25ddd4eef2', 'authors': ['Yujie Tu', 'Zhiliang Peng', 'Jianwei Yu', 'Li Dong', 'Songchen Xu', 'Yaoyao Chang', 'Wenhui Wang', 'Zilong Wang', 'Zehua Wang', 'Yan Xia', 'Jiajun Zhang', 'Xie Chen', 'Furu Wei'], 'affiliations': ['Microsoft Research', 'Shanghai Jiao Tong University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2609.02812.jpg', 'data': {'categories': ['#audio', '#multilingual', '#inference', '#open_source', '#agents'], 'emoji': '🎤', 'ru': {'title': 'Потоковое распознавание речи с идентификацией дикторов в реальном времени', 'desc': 'В статье представлен потоковый LLM-based end-to-end подход VibeVoice-ASR-Streaming, который объединяет распознавание речи и диаризацию дикторов в единой модели для работы в режиме реального времени. Традиционные системы обрабатывали эти задачи отдельно, а существующие unified модели поддерживали только офлайн-распознавание, что не подходило для приложений с низкой задержкой. Предложенный подход использует фиксированные блоки аудио с небольшим lookahead буфером и предыдущим текстом, позволяя модели выдавать результаты «кто что сказал» по мере поступления речи без отдельного этапа диаризации. Модель достигает лучших результатов по метрике WER/CER и обеспечивает высокую точность атрибуции дикторов на множестве тестовых наборов.'}, 'en': {'title': 'Real-Time Speaker Recognition Made Simple!', 'desc': 'This paper introduces VibeVoice-ASR-Streaming, a novel model that combines speaker-attributed automatic speech recognition (ASR) and speaker diarization into a single, efficient system for real-time applications. Unlike traditional systems that handle these tasks separately, this end-to-end model processes audio in small chunks while utilizing lookahead audio and previous text to provide immediate speaker identification. The model demonstrates superior performance, achieving the lowest word error rate (WER) and character error rate (CER) across multiple evaluation sets, while also excelling in speaker attribution tasks. The authors have made the model weights and inference code publicly available to encourage further research and development.'}, 'zh': {'title': '实时语音识别与说话人分离的统一解决方案', 'desc': '这篇论文介绍了一种基于大语言模型的流式端到端语音识别和说话人分离模型，旨在满足低延迟实时应用的需求。传统的说话人归属语音识别系统将语音识别和说话人分离视为两个独立的任务，而新模型VibeVoice-ASR-Streaming将这两个任务统一在一个模型中。该模型通过交错固定大小的音频片段、少量前瞻音频和之前的文本，实时生成“谁说了什么”的信息。实验结果表明，该模型在转录准确性和说话人归属方面均表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.18972', 'title': 'Institutional Newspapers Pipeline: Deriving billions of high quality tokens from historical newspapers', 'url': 'https://huggingface.co/papers/2608.18972', 'abstract': "Abstract A modular pipeline extracts structured text and metadata from historical newspaper scans using small interpretable models, yielding a large open dataset.  Generated by thinkingmachines/Inkling-Small Historical newspapers are an abundant record of public life, but their dense, irregular and sometimes noisy layouts make computational access to these materials both challenging and limited. We present the Institutional Newspapers Pipeline, a modular system we jointly designed with Boston Public Library to extract high-quality, structured datasets from historical newspaper scans. It was architected so that each step remains interpretable and customizable, and so that the pipeline as a whole remains computationally frugal enough to run on workstation-level hardware. The pipeline runs each scan through a multi-step process: it segments scans into individual type-agnostic crops and performs OCR on each resulting segment before then performing text analysis, type classification, reading order detection, named entities recognition, subject classification, language detection, and pre-computed embeddings generation on every crop. We ran this pipeline against a portion of Boston Public Library's holdings and released the results as an open dataset. The optical character recognition (OCR) output represents 16.3 billion o200k_base tokens across 83.1 million individual crops, extracted from 1,473,635 public domain newspaper scans published between 1795 and 1930. This report describes our methods for each processing step, the small models we trained, as well as the evaluation results and dataset-scale measurements we collected in the process. It accompanies the release of the pipeline, models, and dataset. We position this work as a substantial step towards unlocking high-quality data from tens of millions of newspaper scans.", 'score': 9, 'issue_id': 3209, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '165938df104793a2', 'authors': ['Matteo Cargnelutti', 'Catherine Brobston', 'Eben English', 'Jake Sadow', 'Kacie Bailey', 'Greg Leppert', 'Amanda Watson', 'Jessica Chapel', 'Jonathan Zittrain'], 'affiliations': ['Boston Public Library', 'Harvard Kennedy School', 'Harvard Law School', 'Harvard Law School Library', 'Harvard School of Engineering and Applied Sciences', 'Institutional Data Initiative, Harvard Law School Library'], 'pdf_title_img': 'assets/pdf/title_img/2608.18972.jpg', 'data': {'categories': ['#science', '#multilingual', '#interpretability', '#open_source', '#data', '#dataset', '#small_models'], 'emoji': '📰', 'ru': {'title': 'Интерпретируемый конвейер для превращения исторических газет в структурированные данные', 'desc': 'Авторы представляют модульный конвейер обработки исторических газетных сканов, который использует малые интерпретируемые модели машинного обучения для извлечения структурированного текста и метаданных. Система последовательно выполняет сегментацию изображений, оптическое распознавание символов, классификацию типов текста, определение порядка чтения, распознавание именованных сущностей, классификацию тематик, определение языка и генерацию эмбеддингов. Конвейер разработан таким образом, чтобы каждый этап оставался интерпретируемым и настраиваемым, при этом работая эффективно на обычном компьютерном оборудовании. Результатом стал открытый датасет с 16,3 миллиардами токенов, извлеченными из 1,4 млн газетных сканов, изданных между 1795 и 1930 годами.'}, 'en': {'title': 'Unlocking Historical Data from Newspapers', 'desc': 'This paper presents the Institutional Newspapers Pipeline, a modular system designed to extract structured text and metadata from historical newspap
