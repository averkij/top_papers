    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.31046', 'title': 'Does On-Policy Distillation Really Distill? From Noisy Teacher to Self-Improvement', 'url': 'https://huggingface.co/papers/2608.31046', 'abstract': "Abstract On-policy distillation relies mainly on suppressing low-probability tokens rather than teacher guidance, motivating a supervision-free entropy-adaptive method that substantially improves reasoning performance.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD) offers dense token-level supervision as an alternative to the sparse outcome-level advantages of reinforcement learning with verifiable rewards (RLVR). However, the teacher scores student-generated trajectories that are inherently off-policy for it, so the reliability of its supervision, and hence the source of the student's improvement, remains unclear. We quantitatively analyze teacher supervision during OPD training and find substantial noise whose prevalence increases with teacher scale. Surprisingly, the student policy is insensitive to such noise, converging to comparable performance regardless of whether noisy supervision is retained or removed. Does OPD distill at all? By analyzing what drives its gains, we find that learning concentrates on low log-probability tokens, and using a single fixed negative advantage matches the performance of teacher-provided ones. This suggests that OPD works largely by suppressing low log-probability tokens, which requires no teacher. These findings motivate On-Policy Self-Adaptation (OPSA), a supervision-free method using entropy-adaptive negative advantages. It assigns stronger learning signals to high-entropy positions, suppressing tail tokens, and evenly redistributing probability mass among head tokens. Compared with the base Qwen3-1.7B, OPSA improves Avg@32 by 35.41 points on AIME24, corresponding to a 263\\% relative gain, and more than doubles Pass@32 across all three benchmarks. It also outperforms OPD by 16.77 points in Avg@32 on AIME24. Extensive experiments and analyses across model families and tasks further demonstrate its effectiveness and generalizability.", 'score': 90, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'de0bc2e540d1330e', 'authors': ['Yi Ding', 'Ruqi Zhang'], 'affiliations': ['Department of Computer Science, Purdue University, USA'], 'pdf_title_img': 'assets/pdf/title_img/2608.31046.jpg', 'data': {'categories': ['#math', '#optimization', '#reasoning', '#training', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Самообучение вместо учителя: адаптивная энтропия в дистилляции моделей', 'desc': 'В работе анализируется дистилляция on-policy (OPD), метод обучения студент-моделей на основе учительских оценок сгенерированных траекторий. Авторы обнаружили, что большая часть шума в учительских оценках не влияет на обучение студента, и что основной источник улучшения - это подавление токенов с низкой вероятностью, а не руководство учителя. На основе этого открытия предложен метод On-Policy Self-Adaptation (OPSA), который не требует учителя и использует адаптивные отрицательные преимущества, сосредоточивая обучение на позициях с высокой энтропией. Экспериментально показано, что OPSA значительно превосходит традиционную дистилляцию, достигая улучшения на 35.41 балла на бенчмарке AIME24 и удваивая показатели Pass@32 на всех трёх тестовых наборах.'}, 'en': {'title': 'Empowering Learning Without Teachers: The OPSA Revolution', 'desc': 'This paper introduces On-Policy Self-Adaptation (OPSA), a new method that enhances reasoning performance without relying on teacher supervision. It highlights the limitations of On-policy distillation (OPD), which primarily focuses on suppressing low-probability tokens rather than effective guidance from a teacher. The authors find that the student model can achieve similar performance even when noisy teacher supervision is removed, indicating that the key to improvement lies in managing token probabilities. OPSA improves learning by adapting the learning signals based on entropy, leading to significant performance gains over existing methods.'}, 'zh': {'title': '无监督学习的新突破：OPSA方法', 'desc': '这篇论文探讨了一种新的无监督学习方法，称为On-Policy Self-Adaptation（OPSA），它通过自适应的熵调整来提高推理性能。研究发现，传统的On-policy distillation（OPD）方法主要依赖于抑制低概率标记，而不是教师的指导。通过对教师监督的定量分析，发现教师的评分存在显著噪声，但学生策略对这些噪声不敏感，仍能达到相似的性能。最终，OPSA通过增强高熵位置的学习信号，抑制尾部标记，从而在多个基准测试中显著提升了模型的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.31106', 'title': 'DreamX-Creator: Democratizing Native Audio-Video Generation at 2K Resolution', 'url': 'https://huggingface.co/papers/2608.31106', 'abstract': 'Abstract A compact 7B native joint audio-video generator uses cross-modal attention, progressive joint training, reinforcement learning with multimodal feedback, and an autoregressive 2K refinement pipeline to produce synchronized high-resolution outputs.  Generated by thinkingmachines/Inkling-Small Recent video generators often omit audio or synthesize it in a separate stage, limiting reciprocal modeling of visual dynamics and acoustic events. We present DreamX-Creator 1.0, a compact native joint audio-video generation system centered on a 7B generator. Conditioned on a first frame and a text prompt, the generator jointly denoises modality-specialized audio and video streams. The streams are processed independently in the first half of the network and coupled in the latter half through Gated Cross-Modal Attention, whose token- and head-wise output gates modulate each active cross-modal attention-head output. A unified Audio-Video Data System constructs and filters temporally coherent clips, produces structured multimodal annotations, and organizes clips into capability-oriented data pools. Progressive Joint Training comprises two audio-video pre-training stages followed by High-Quality Finetuning. Audio-Video Reinforcement Learning further post-trains the generator with Modality-Aware Multimodal Feedback that routes video-, audio-, and cross-modal feedback to the corresponding streams. For high-resolution output, our Autoregressive 1-Step 2K Refinement pipeline adapts a bidirectional multi-step teacher into an autoregressive multi-step refiner and distills it into a student requiring one denoising evaluation per temporal chunk. Overall, DreamX-Creator 1.0 achieves native, synchronized audio-video generation with performance competitive with state-of-the-art open-source systems. By releasing our compact 7B generator and 2K Refiner, we seek to democratize native audio-video generation and provide an accessible foundation for future research in unified audio-video generative modeling.', 'score': 86, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'c84781b748b60faa', 'authors': ['Jiashu Zhu', 'Yanhao Zheng', 'Ruitian Tian', 'Rujing Dang', 'Shen Zhang', 'Bingze Song', 'Jiachen Lei', 'Ruimin Lin', 'Jiahong Wu', 'Xiangxiang Chu'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.31106.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#rlhf', '#audio', '#video', '#small_models', '#training', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Синхронная генерация аудио-видео через кросс-модальное внимание', 'desc': 'Представлен DreamX-Creator 1.0 — компактный генератор аудио-видео контента на основе 7-миллиардной нейронной сети, который одновременно создаёт синхронизированные видео и аудиопотоки из текстового описания и первого кадра. Ключевой инновацией является Gated Cross-Modal Attention — механизм внимания, который связывает обработку аудио и видео на заключительных слоях сети, позволяя моделировать взаимосвязь между визуальной динамикой и акустическими событиями. Модель обучается через прогрессивное обучение с предварительной подготовкой на специально подобранных мультимодальных наборах данных, а затем дополнительно оптимизируется с помощью reinforcement learning с мультимодальной обратной связью. Для получения высокого разрешения используется авторегрессивный 2K конвейер уточнения, который дистиллирует многошаговый учитель в одношаговый рефайнер для эффективного улучшения качества.'}, 'en': {'title': 'Revolutionizing Synchronized Audio-Video Generation with DreamX-Creator 1.0', 'desc': 'The paper introduces DreamX-Creator 1.0, a compact 7B generator designed for joint audio-video generation using advanced techniques like cross-modal attention and reinforcement learning. It processes audio and video streams separately at first, then combines them to ensure synchronization and coherence in the output. The system employs a unique training approach that includes progressive joint training and multimodal feedback to enhance the quality of generated content. By making this technology accessible, the authors aim to foster further research in unified audio-video generative modeling.'}, 'zh': {'title': '音视频生成的未来：DreamX-Creator 1.0', 'desc': '本文介绍了一种紧凑型的7B音视频联合生成器DreamX-Creator 1.0，利用跨模态注意力和渐进式联合训练来生成同步的高分辨率音视频输出。该系统通过对第一帧和文本提示进行条件处理，联合去噪音频和视频流。网络的前半部分独立处理音频和视频流，后半部分通过门控跨模态注意力将两者结合。最终，DreamX-Creator 1.0在音视频生成方面的性能与最先进的开源系统相当，旨在推动音视频生成技术的普及和未来研究。'}}}, {'id': 'https://huggingface.co/papers/2608.30821', 'title': 'Lucida: Parse, Generate, and Place for Composable Real-to-Sim Scene Modeling', 'url': 'https://huggingface.co/papers/2608.30821', 'abstract': "Abstract Lucida improves composable indoor scene reconstruction by distributing pipeline requirements across parsing, asset generation, and VLM-guided placement to achieve high-fidelity editable replicas from cluttered captures.  Generated by thinkingmachines/Inkling-Small Composable scene modeling aims to recover a real indoor scene as complete, editable object assets arranged as observed, giving robot simulation and embodied AI a simulation-ready replica of the real environment whose objects can be manipulated individually. Existing pipelines decompose the task into three steps---parse the observations into instances, generate an asset for each, and place each asset back---but every step presumes an input that a cluttered capture rarely provides: accurate instance geometry, unoccluded views, and assets that accurately match the observations. We propose Lucida, which keeps this order but redistributes the requirements, so each step consumes only what a real capture reliably provides and precision is reached at the end of the pipeline rather than demanded at its start. Lucida parses the video into a scene graph whose nodes carry per-instance multi-view evidence, generates a complete asset for each instance from its evidence, and places assets with GizmoAct, a VLM policy that casts placement as multi-turn GUI interaction, manipulating the object's gizmo in a closed loop and deciding itself when alignment is reached. Across scene-level 3D object detection, object pose estimation, and scene reconstruction, Lucida improves mAP over Boxer by 69% on R2S-Scene, raises ADD-SB@0.05 from 57.8% to 83.4% on CA-1M, and increases scene F-Score from 0.794 for SAM3D to 0.924.", 'score': 66, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '7f159515228c0c09', 'authors': ['Minghan Qin', 'Yuang Wang', 'Xiuyu Yang', 'Yushi Long', 'Yujian Zhang', 'Ruihuan Wang', 'Kai Ye', 'Yangang Zhang', 'Hang Li'], 'affiliations': ['ByteDance Seed', 'Peking University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30821.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#3d', '#robotics'], 'emoji': '🏠', 'ru': {'title': 'Точность в конце конвейера: пошаговое улучшение реконструкции помещений', 'desc': 'Lucida — это система для реконструкции внутренних сцен, которая восстанавливает трёхмерные модели комнат с отдельными редактируемыми объектами из видеозаписей. Метод разделяет задачу на три этапа: парсинг видео в граф сцены, генерация полных 3D-моделей объектов и их позиционирование с помощью языковой модели. Ключевая идея заключается в том, что вместо требования высокой точности на каждом шаге, система накапливает доказательства из многовиртуальных представлений и достигает точности в конце конвейера. Lucida значительно превосходит существующие методы в задачах обнаружения объектов, оценки позы и реконструкции сцен, что важно для робототехники и воплощённого искусственного интеллекта.'}, 'en': {'title': 'Revolutionizing Indoor Scene Reconstruction with Lucida', 'desc': 'Lucida is a novel approach to indoor scene reconstruction that enhances the process by redistributing the requirements across different stages of the pipeline. Instead of relying on perfect input data, it allows each step to work with the information that is typically available from cluttered captures. The method involves creating a scene graph from video data, generating assets based on multi-view evidence, and using a VLM-guided policy for precise object placement. This results in significant improvements in metrics like mean Average Precision (mAP) and scene F-Score, demonstrating its effectiveness in creating editable and accurate 3D replicas of real environments.'}, 'zh': {'title': 'Lucida：智能室内场景重建的新方法', 'desc': 'Lucida是一种改进的室内场景重建方法，通过在解析、资产生成和VLM引导放置之间分配管道要求，实现高保真度的可编辑复制品。该方法旨在从杂乱的捕获中恢复真实的室内场景，生成可单独操作的对象资产，以便于机器人模拟和具身人工智能的使用。与现有的三步流程不同，Lucida重新分配了每一步的要求，使每一步仅依赖于真实捕获中可靠提供的信息，最终在管道末尾达到精度。通过解析视频生成场景图，生成完整的资产，并利用GizmoAct进行资产放置，Lucida在多个场景重建任务中显著提高了性能。'}}}, {'id': 'https://huggingface.co/papers/2608.29335', 'title': 'GenFirst: Generation Before Reconstruction for Stable End-to-End Latent Generative Modeling', 'url': 'https://huggingface.co/papers/2608.29335', 'abstract': 'Abstract Direct end-to-end training of latent generative models avoids collapse via entropy preservation and asymmetric dynamics, using a generation-first strategy to achieve state-of-the-art image synthesis and unified multimodal generation.  Generated by thinkingmachines/Inkling-Small Latent generative models typically follow a two-stage pipeline, training a variational autoencoder for reconstruction and then a generative model on the frozen latent space. Since reconstruction-optimized latents are not necessarily generation-friendly, jointly training both models is an appealing alternative. However, direct end-to-end training remains challenging, as it is prone to latent collapse and faces a generation-reconstruction conflict. We revisit this problem by analyzing how different objectives shape the latent space and identify two key insights. First, the entropy term in the Kullback-Leibler divergence objective is essential for preventing collapse: reconstruction and prior fitting tend to shrink the posterior, while entropy preserves non-degenerate latent uncertainty. Second, reconstruction and generation exhibit asymmetric learning dynamics: reconstruction is fast and strongly supervised, whereas generation is slower and harder to optimize. Based on these insights, we achieve the first direct end-to-end training without latent collapse and propose GenFirst, a simple generation-before-reconstruction strategy. The generative objective first shapes the latent space under weak reconstruction pressure, after which reconstruction is progressively strengthened to recover visual details. We validate GenFirst with continuous autoregressive priors with exact likelihoods and SiT priors with implicit likelihoods. With our end-to-end objective and GenFirst, SiT achieves a gFID of 0.97 with CFG and 1.45 without CFG on ImageNet-256, while MMDiT reaches a GenEval score of 0.90 on text-to-image generation. Beyond image generation, we extend the framework to shared visual latents for generation and representation learning, and to continuous unified text-image generation. These results demonstrate the generality of stable end-to-end latent learning across generative priors and modalities.', 'score': 57, 'issue_id': 3196, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'b5deaf53cf4f38e8', 'authors': ['Guangting Zheng', 'Yiyuan Zhang', 'Tao Yang', 'Yunpeng Chen', 'Rui Zhu', 'Jiajun Deng', 'Yanyong Zhang'], 'affiliations': ['ByteDance', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.29335.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#optimization', '#diffusion', '#training'], 'emoji': '🎨', 'ru': {'title': 'От противоречия к гармонии: сквозное обучение генеративных моделей без коллапса', 'desc': 'В работе предлагается метод прямого обучения скрытых генеративных моделей без коллапса латентного пространства через сохранение энтропии и асимметричную динамику обучения. Авторы выявили, что энтропийный член в дивергенции Кульбака-Лейблера критичен для предотвращения деградации представлений, а реконструкция и генерация имеют разные скорости обучения. На основе этих наблюдений предложена стратегия GenFirst, которая сначала оптимизирует генеративную цель с минимальным давлением реконструкции, а затем постепенно усиливает восстановление визуальных деталей. Метод валидирован на различных архитектурах с явными и неявными правдоподобиями, достигнув сильных результатов в синтезе изображений и мультимодальной генерации.'}, 'en': {'title': 'GenFirst: Prioritizing Generation for Stable Latent Learning', 'desc': 'This paper presents a novel approach to training latent generative models directly in an end-to-end manner, which helps prevent issues like latent collapse. The authors introduce a method called GenFirst, where the generation process is prioritized before reconstruction, allowing for better shaping of the latent space. They highlight the importance of entropy in the Kullback-Leibler divergence to maintain latent uncertainty and avoid collapse. The results show that this approach achieves state-of-the-art performance in image synthesis and multimodal generation tasks.'}, 'zh': {'title': '生成优先，稳定潜在学习！', 'desc': '本文提出了一种直接端到端训练潜在生成模型的方法，旨在避免潜在崩溃并保持熵的稳定性。通过生成优先的策略，本文实现了先进的图像合成和统一的多模态生成。研究表明，Kullback-Leibler散度中的熵项对于防止潜在崩溃至关重要，同时重建和生成之间存在不对称的学习动态。最终，提出的GenFirst策略在图像生成和表示学习中展现了良好的效果，证明了稳定的端到端潜在学习的广泛适用性。'}}}, {'id': 'https://huggingface.co/papers/2608.31036', 'title': 'Normalized Low-Rank Adaptation', 'url': 'https://huggingface.co/papers/2608.31036', 'abstract': 'Abstract Normalized Low-Rank Adaptation stabilizes LoRA training by normalizing down-projection matrices, accelerating convergence and improving performance without extra parameters or inference cost.  Generated by thinkingmachines/Inkling-Small While low-rank adaptation (LoRA) is widely used for parameter-efficient model adaptation, how to regularize its training dynamics for stable and effective optimization remains underexplored. Because LoRA initializes the up-projection to zero, its early optimization dynamics are largely governed by the down-projection. Building on this observation, we introduce Normalized Low-Rank Adaptation (NoRA), a simple yet effective method that normalizes the down-projection matrices during training. We further show that the same normalization can be applied only at initialization, improving standard LoRA without requiring repeated normalization throughout training. Across pretraining, supervised finetuning, and reinforcement learning, NoRA consistently accelerates convergence, improves performance and training stability, and mitigates catastrophic forgetting. These benefits require neither additional trainable parameters nor inference-time computation, making NoRA a simple and broadly applicable enhancement to LoRA.', 'score': 38, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'ce974e487fc6b71a', 'authors': ['Jiale Kang', 'Ziyin Yue', 'Zheng Zhan', 'Yangyi Huang', 'Weiyang Liu'], 'affiliations': ['Microsoft Research', 'Shenzhen Loop Area Institute', 'The Chinese University of Hong Kong', 'Yuanshi Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2608.31036.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Стабильная адаптация через нормализацию: эффективное улучшение LoRA без дополнительных затрат', 'desc': 'В статье представлен метод Normalized Low-Rank Adaptation (NoRA), который улучшает стабильность обучения LoRA путём нормализации матриц down-projection. Авторы показывают, что поскольку up-projection инициализируется нулями, ранняя динамика оптимизации в основном контролируется down-projection, что позволяет стабилизировать обучение простой нормализацией. Метод демонстрирует ускорение сходимости, улучшение производительности и устойчивости обучения при использовании предварительного обучения, supervised fine-tuning и обучении с подкреплением. NoRA не требует дополнительных обучаемых параметров и вычислительных затрат при инференсе, что делает его простым и универсально применимым улучшением к LoRA.'}, 'en': {'title': 'Stabilizing LoRA Training with Normalization for Better Performance', 'desc': 'This paper introduces Normalized Low-Rank Adaptation (NoRA), a method that enhances the training of low-rank adaptation (LoRA) models. By normalizing the down-projection matrices, NoRA stabilizes the training process, leading to faster convergence and better overall performance. The authors demonstrate that this normalization can also be applied at initialization, which improves standard LoRA without the need for ongoing normalization during training. Importantly, NoRA achieves these benefits without adding extra parameters or increasing inference costs, making it a practical improvement for various machine learning tasks.'}, 'zh': {'title': '归一化低秩适应：提升LoRA训练的稳定性与效率', 'desc': '本文提出了一种新的方法，称为归一化低秩适应（NoRA），旨在提高低秩适应（LoRA）训练的稳定性和效率。NoRA通过在训练过程中对下投影矩阵进行归一化，来加速收敛并改善模型性能。研究表明，这种归一化方法可以在初始化时应用，从而提升标准LoRA的效果，而无需在整个训练过程中重复归一化。NoRA的优势在于不需要额外的可训练参数或推理时的计算，适用于多种机器学习任务。'}}}, {'id': 'https://huggingface.co/papers/2608.31119', 'title': 'PaperGym: Rubric-Centered Evolution for Research-Plan Generation', 'url': 'https://huggingface.co/papers/2608.31119', 'abstract': "Abstract PaperGym converts scientific papers into training environments by separating research questions from evaluation rubrics, enabling reinforcement learning that improves research planning across multiple model sizes.  Generated by thinkingmachines/Inkling-Small Research planning is the decisive capability of AI scientists. Yet a research plan admits no verifiable answer, so reinforcement learning lacks the environment it requires: tasks paired with a critic. Rubrics extracted from scientific papers can supply the critic. Existing pipelines, however, draw the question and the criteria from the same content, so the reward can be earned by paraphrase. The rubric is further compressed into a single scalar per rollout. We introduce PaperGym, a unified framework that turns each research paper into a complete training environment. PaperGym exploits the structure of a paper: the question is synthesized from the research goal and background, while the criteria are derived from the method and experiments. The criteria span methodological innovation and experimental design, and criterion leakage falls to 3.7%, versus 11.90% to 34.10% in existing datasets. Training uses the rubric twice: first as privileged context for OPSD's self-teacher, then as the reward for GRPO. Across Qwen3-1.7B/4B/8B, this schedule outperforms supervised fine-tuning, either stage alone, and the reverse ordering, improving five-benchmark averages by +5.6, +5.0, and +4.8 points. With the recipe held fixed, models trained on PaperGym-20k win 58.1% of three-way comparisons, against 28.2% for RubricHub Science. The trained Qwen3-8B reaches 73.48 on ResearchQA, above the far larger Kimi K2.6. We release the pipeline, the 20,000-instance corpus PaperGym-20k, and the benchmarks PaperGym-Innov and PaperGym-Design.", 'score': 35, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '3df1c8aeda97ed85', 'authors': ['Yuhan Wang', 'Zhengxi Lu', 'Yuchen Yan', 'Kaitao Song', 'Wenqi Zhang', 'Weiming Lu', 'Jun Xiao', 'Yueting Zhuang', 'Yongliang Shen'], 'affiliations': ['Apple', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.31119.jpg', 'data': {'categories': ['#science', '#open_source', '#optimization', '#training', '#rl', '#benchmark', '#dataset', '#small_models'], 'emoji': '🧪', 'ru': {'title': 'Научные статьи как тренажеры для агентов планирования исследований', 'desc': 'PaperGym — это платформа, которая преобразует научные статьи в среды обучения с подкреплением, разделяя исследовательские вопросы и критерии оценки. Авторы решили проблему утечки информации в существующих датасетах, где модель может получить награду просто перефразируя текст, так как вопрос и критерии берутся из одного источника. В новом подходе вопрос синтезируется из целей и предпосылок исследования, а критерии извлекаются из методологии и экспериментов, что снижает утечку до 3,7%. Метод использует рубрику дважды: сначала как привилегированный контекст для самоучителя, затем как награду для обучения с подкреплением, что улучшает результаты на 4,8-5,6 баллов по сравнению с обычной дообучением.'}, 'en': {'title': 'Transforming Research Papers into AI Training Environments', 'desc': 'PaperGym is a novel framework that transforms scientific papers into training environments for reinforcement learning by separating research questions from evaluation criteria. This approach allows AI systems to improve their research planning capabilities by using rubrics derived from the papers as a critic for evaluating performance. By synthesizing research goals and methods, PaperGym minimizes criterion leakage and enhances the training process, leading to better model performance across various sizes. The results show that models trained with PaperGym outperform traditional supervised fine-tuning methods, demonstrating significant improvements in benchmark evaluations.'}, 'zh': {'title': 'PaperGym：将科学论文转化为强化学习训练环境', 'desc': 'PaperGym 是一个将科学论文转化为训练环境的框架，通过将研究问题与评估标准分离，促进强化学习在多个模型规模上的研究规划。它利用论文的结构，合成研究目标和背景中的问题，并从方法和实验中提取标准。与现有数据集相比，PaperGym 的标准泄漏率显著降低，训练效果优于传统的监督微调方法。通过在 PaperGym-20k 上训练，模型在多个基准测试中表现出色，显示出其在研究规划中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.30320', 'title': 'On the Design of Qwen3.8-Next Architecture: Evaluation, Efficiency, and Training Stability', 'url': 'https://huggingface.co/papers/2608.30320', 'abstract': 'Abstract Qwen3.8-Flash-Next is a sparse mixture-of-experts architecture combining hybrid gated delta-net and sparse attention layers, gated residual branches, and off-accelerator n-gram embeddings to improve efficiency, capability, and training stability.  Generated by thinkingmachines/Inkling-Small We describe the architecture and ablations of Qwen3.8-Flash-Next, a sparse mixture-of-experts model with 125B parameters, 6B activated per token, and additional 51B parameters of n-gram embedding tables held off the accelerator. On fourteen pre-training benchmarks the model leads the 397B-A17B predecessor on eight and trails it on the rest by at most 2.6 points, at 1/3 the activated parameters, 1/3 the training tokens, and roughly 1/9 the training FLOPs. Token mixing uses a layer-wise hybrid of Gated DeltaNet (GDN) and global attention, with one full-attention layer in every four; at continued-pretraining time those full-attention layers are replaced by Qwen Sparse Attention (QSA), which scores context at micro-block granularity with a compressed lightweight indexer. The residual stream is widened to four branches and read through an elementwise gate, a design we call the Gated Residual (GR). Capacity is added outside the backbone by a single n-gram embedding layer whose tables are prefetched from host memory. We evaluate every candidate change along three axes: loss together with downstream benchmarks; the cost of the change in training, prefill and decode; and its effect on the optimal hyperparameters and training stability. Loss and downstream accuracy do not always move together: enlarging the n-gram vocabulary lowers loss monotonically while downstream accuracy saturates. The architecture and the Muon optimizer together shift the optimal learning rate and batch size upwards, render batch-size warmup unnecessary, and substantially improve stability under stress tests. Loss, benchmarks, efficiency and stability form one design problem. Solved jointly, they yield a recipe that is simultaneously more efficient, more capable and more stable.', 'score': 32, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'c99928620fe3fa30', 'pdf_title_img': 'assets/pdf/title_img/2608.30320.jpg', 'data': {'categories': ['#architecture', '#inference', '#open_source', '#optimization', '#training'], 'emoji': '⚡', 'ru': {'title': 'Масштабная эффективность через разреженность и гибридное внимание', 'desc': 'В статье представляется Qwen3.8-Flash-Next — разреженная модель смеси экспертов (MoE) с 125 миллиардами параметров, которая активирует только 6 миллиардов на каждый токен. Архитектура комбинирует гибридный подход, чередуя слои Gated DeltaNet с глобальным вниманием, и использует разреженное внимание (QSA) при продолжении предобучения для улучшения эффективности. Модель достигает сравнимой производительности с 397-миллиардным предшественником, используя в три раза меньше активируемых параметров, треть обучающих токенов и примерно одну девятую вычислительных операций. Исследование показывает, что потеря и характеристики на downstream задачах не всегда коррелируют, но совместная оптимизация потери, эффективности и стабильности достигается через архитектурные инновации и использование оптимизатора Muon.'}, 'en': {'title': 'Efficient and Stable: The Future of Sparse Mixture-of-Experts Models', 'desc': "The Qwen3.8-Flash-Next model is a sparse mixture-of-experts architecture designed to enhance efficiency and training stability in machine learning. It utilizes a combination of hybrid gated delta-net and sparse attention layers, along with gated residual branches and off-accelerator n-gram embeddings. This model, with 125 billion parameters, achieves competitive performance on pre-training benchmarks while using significantly fewer activated parameters and training resources compared to its predecessor. The architecture's design allows for improved loss and accuracy management, making it a robust solution for complex machine learning tasks."}, 'zh': {'title': '高效、强大且稳定的稀疏专家模型', 'desc': 'Qwen3.8-Flash-Next是一种稀疏专家混合架构，结合了混合门控Delta-Net和稀疏注意力层，以提高模型的效率和训练稳定性。该模型拥有1250亿个参数，每个token激活6亿个参数，并且有510亿个n-gram嵌入表存储在加速器外。通过层级混合的Gated DeltaNet和全局注意力，模型在预训练基准测试中表现优异，能够在参数激活量和训练效率上显著降低。整体架构与Muon优化器的结合，提升了学习率和批量大小的最优值，增强了模型在压力测试下的稳定性。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2608.30968', 'title': 'CogEvol: Towards Efficient and Reliable Learning Environment Generation', 'url': 'https://huggingface.co/papers/2608.30968', 'abstract': 'Abstract CogEvol is a family of models that generate structured learning artifacts in a single pass using supervised fine-tuning and reinforcement learning with vision-language rewards, achieving high quality with far fewer parameters and lower cost.  Generated by thinkingmachines/Inkling-Small We present CogEvol, a family of models trained specifically for Learning Environment Generation: turning a course brief into a finished learning artifact (structured-JSON slides or self-contained interactive HTML pages) in a single pass. Across 220k production requests, CogEvol completes a slide in a median of 17 seconds and an interactive page in 59, replacing minutes-long multi-turn agent scaffolding. Reliability is enforced rather than hoped for: a production-grounded data pipeline turns real failures into 53,687 verified SFT samples, and a hybrid rule-plus-VLM reward drives GRPO-based RL, hardened after we caught and fixed a reward-hacking episode that produced visually convincing but unplayable games. CogEvol-27B scores 83.7 on slide quality and 63.7 on a 500-case interactive-HTML benchmark with 26.9x fewer parameters than flagship coding models, and, in collaboration with the OpenMAIC team, serves their live production traffic. CogEvol-4B is released openly under the Apache 2.0 license at https://github.com/CogEvol/CogEvol-4B; external flagships are measured on the same suites under the identical harness. Scaffold editing cuts interactive-page generation cost by a further ~76%, and the full stack runs on domestic Ascend accelerators at application-level parity with A800 GPUs, lowering the unit cost of AI-native education at scale.', 'score': 25, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'fd9f0cb519dd6cfd', 'authors': ['Shangqing Tu', 'Daniel Zhang-Li', 'Yucheng Wang', 'Shiyu Gan', 'Yanpeng Wang', 'Huiqiang Rong', 'Mofei Chen', 'Shen Yang', 'Yini Chen', 'Yinuo Duan', 'Haoxuan Li', 'Binglin Liu', 'Ye He', 'Danqi Zheng', 'Zhanxin Hao', 'Yuxuan Wu', 'Mengting Tao', 'Yuqiu Liu', 'Jifan Yu', 'Juanzi Li', 'Bin Xu', 'Lei Hou', 'Huiqin Liu', 'Yu Zhang'], 'affiliations': ['CogEvol Inc.', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30968.jpg', 'data': {'categories': ['#multimodal', '#rlhf', '#training', '#small_models', '#benchmark', '#dataset'], 'emoji': '🎓', 'ru': {'title': 'Эффективная генерация структурированных учебных материалов в один проход', 'desc': 'CogEvol — это семейство моделей, специализирующихся на генерации учебных материалов в один проход, превращая краткое описание курса в структурированные слайды или интерактивные HTML-страницы. Модели обучаются с использованием supervised fine-tuning и reinforcement learning на основе vision-language наград, что позволяет выявлять и исправлять ошибки на уровне production-данных. Гибридный подход, сочетающий правила и VLM-награды, предотвращает reward hacking и обеспечивает надежность генерируемого контента. CogEvol достигает высокого качества с 26.9 раза меньшим количеством параметров, чем базовые модели кодирования, при этом значительно снижая стоимость и время генерации учебных материалов.'}, 'en': {'title': 'Revolutionizing Learning Material Generation with CogEvol', 'desc': 'CogEvol is a new family of machine learning models designed to create structured learning materials quickly and efficiently. It uses supervised fine-tuning and reinforcement learning with vision-language rewards to generate high-quality outputs with fewer parameters. The models can produce slides and interactive HTML pages in a fraction of the time compared to traditional methods, significantly reducing the cost of content generation. With a robust data pipeline and effective reward mechanisms, CogEvol ensures reliability and quality in educational content creation.'}, 'zh': {'title': 'CogEvol：高效生成学习材料的智能模型', 'desc': 'CogEvol是一种模型家族，能够通过监督微调和强化学习生成结构化学习材料，且只需一次处理即可完成。它将课程简报转化为最终的学习成果，如结构化的JSON幻灯片或自包含的互动HTML页面，速度快且成本低。CogEvol在220,000个生产请求中，幻灯片的生成中位时间为17秒，互动页面为59秒，显著提高了效率。该模型通过可靠的数据管道和混合奖励机制，确保生成的内容质量高且可用性强。'}}}, {'id': 'https://huggingface.co/papers/2608.30935', 'title': 'LightNav-0: Eliciting VLM Spatial Intelligence for Generalist Embodied Navigation', 'url': 'https://huggingface.co/papers/2608.30935', 'abstract': 'Abstract LightNav-0 is a compact generalist navigation model that leverages a pretrained vision-language model’s spatial reasoning via unified pointing tokens and action tokenization to achieve state-of-the-art embodied navigation across diverse tasks and robots.  Generated by thinkingmachines/Inkling-Small Embodied navigation requires agents to translate heterogeneous goals and visual observations into actions across tasks, environments, and robot embodiments. Modern vision-language models (VLMs) already encode spatial priors for visual grounding, spatial reasoning, and pointing, but these capabilities are rarely elicited directly for robot control. Existing navigation systems instead rely on task- or embodiment-specific components, fragmenting perception, reasoning, and action while offering limited generalization. Here we present LightNav-0, a compact generalist embodied navigation model that elicits the spatial intelligence of a pretrained VLM and aligns it with navigation, without task-specific prediction heads. LightNav-0 represents diverse navigation tasks through a unified token interface: dual-channel pointing expresses task-, scene-, and embodiment-agnostic spatial intent, while a residual vector-quantized action tokenizer maps this intent to precise, embodiment-specific trajectories. Together with temporally aware visual history compression, ER mid-training, supervised fine-tuning, and reinforcement learning, this formulation supports instruction following, open-vocabulary object navigation, and visual tracking within a single model. The navigation training corpus spans 2K+ scenes and 4K+ hours of embodied navigation data. LightNav-ER, the embodied-reasoning checkpoint used to initialize LightNav-0, attains the highest complete-set average across 8 embodied-reasoning benchmarks, while LightNav-0 achieves state-of-the-art monocular success rates across all 10 public navigation simulation settings. Real-world evaluations further demonstrate zero-shot generalization across robot embodiments, diverse scenes, and static and dynamic targets. These results establish compact VLMs as a unified and transferable backbone for generalist embodied navigation.', 'score': 24, 'issue_id': 3197, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'cbbcaaee1cd3d0c5', 'pdf_title_img': 'assets/pdf/title_img/2608.30935.jpg', 'data': {'categories': ['#training', '#small_models', '#benchmark', '#robotics', '#rl', '#agents', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единая vision-language модель для универсальной навигации роботов', 'desc': 'LightNav-0 — компактная универсальная модель навигации, которая использует пространственное понимание предварительно обученной vision-language модели через унифицированные токены указания и токенизацию действий. Модель решает задачу воплощенной навигации, переводя разнородные цели и визуальные наблюдения в действия робота без использования задачеспецифичных компонентов. Система применяет двухканальный указатель для выражения пространственного намерения и вектор-квантизированный токенизатор действий для преобразования этого намерения в точные траектории, специфичные для конкретного робота. LightNav-0 достигает state-of-the-art результатов на множестве симуляционных тестов навигации и демонстрирует нулевое-шотовое обобщение на реальных роботах различных конструкций в разнообразных сценах.'}, 'en': {'title': 'Unified Navigation for All Robots with LightNav-0', 'desc': 'LightNav-0 is a new navigation model that uses a pretrained vision-language model to improve how robots understand and navigate their environments. It combines spatial reasoning and action tokenization to perform well across various tasks without needing specific components for each task. By using a unified token interface, it can express navigation intents that are not tied to any specific robot or scene. This model has shown impressive results in both simulated and real-world scenarios, demonstrating its ability to generalize across different robots and environments.'}, 'zh': {'title': 'LightNav-0：通用具身导航的新突破', 'desc': 'LightNav-0 是一种紧凑型通用导航模型，利用预训练的视觉-语言模型的空间推理能力，通过统一的指向标记和动作标记化，实现了在多种任务和机器人中的最先进的具身导航。该模型能够将异构目标和视觉观察转化为动作，克服了现有导航系统中任务或具身特定组件的局限性。LightNav-0 通过统一的标记接口表示多样的导航任务，支持指令跟随、开放词汇物体导航和视觉跟踪。实验证明，LightNav-0 在各种场景和目标下具有零样本泛化能力，展示了紧凑型视觉-语言模型作为通用具身导航的可转移基础。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2608.28600', 'title': 'SHAPE of Chain-of-Thought in Math Reasoning', 'url': 'https://huggingface.co/papers/2608.28600', 'abstract': "Abstract SHAPE analyzes chain-of-thought reasoning via semantic spaces and heuristics to diagnose LLM mathematical reasoning and improve post-training.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) achieve strong performance on mathematical reasoning benchmarks, yet the mathematically meaningful skills underlying their reasoning remain underexplored. We introduce SHAPE, a framework that analyzes Chain-of-Thought (CoT) trajectories through two lenses developed in mathematics education: (1) semantic spaces: the model's evolving mathematical interpretations of a problem (e.g., algebraic, geometric), and (2) heuristics: the specific mathematical actions taken within those spaces (e.g., simplifying the problem, working backward). We first use SHAPE to analyze the reasoning patterns of various models. Our findings reveal that the mathematical heuristics employed by a model better explain final answer correctness than traditional CoT features. Furthermore, models are likely to reach correct solutions by concentrating their reasoning effort within a few semantic spaces rather than exploring many disparate ones -- a pattern consistent with human behavior. Next, we utilize the SHAPE lens to evaluate whether post-training truly enhances mathematical proficiency. We find that reinforcement learning induces mode-seeking in heuristic usage. Lastly, we post-train LLMs by promoting diverse heuristics and demonstrate its effectiveness in improving accuracy. Overall, SHAPE provides a theoretically-grounded diagnostic framework for decoding LLM reasoning and offers a new path toward post-training LLMs for math reasoning. The code for our model is available at https://github.com/holi-lab/SHAPE-of-CoT", 'score': 24, 'issue_id': 3196, 'pub_date': '2026-06-28', 'pub_date_card': {'ru': '28 июня', 'en': 'June 28', 'zh': '6月28日'}, 'hash': '9af35de0f440d753', 'pdf_title_img': 'assets/pdf/title_img/2608.28600.jpg', 'data': {'categories': ['#interpretability', '#math', '#rlhf', '#open_source', '#reasoning', '#training'], 'emoji': '🧮', 'ru': {'title': 'Диагностика и улучшение математических рассуждений LLM через анализ семантических пространств и эвристик', 'desc': 'SHAPE — это фреймворк для анализа цепочек рассуждений (Chain-of-Thought) в больших языковых моделях через призму математического образования. Фреймворк исследует два ключевых аспекта: семантические пространства (различные математические интерпретации задачи, такие как алгебраическая или геометрическая) и эвристики (конкретные математические действия, например упрощение или решение с конца). Исследование показывает, что математические эвристики лучше объясняют корректность ответа, чем традиционные признаки, а успешные модели сосредоточивают усилия рассуждения в нескольких семантических пространствах, подобно человеческому поведению. Авторы используют SHAPE для улучшения математических способностей моделей через обучение с подкреплением, отдавая предпочтение разнообразным эвристикам.'}, 'en': {'title': 'Unlocking Mathematical Reasoning in LLMs with SHAPE', 'desc': "The paper introduces SHAPE, a framework designed to analyze how large language models (LLMs) reason through mathematical problems using Chain-of-Thought (CoT) techniques. It focuses on two key aspects: semantic spaces, which represent the model's understanding of a problem, and heuristics, which are the strategies the model employs to solve it. The study finds that the specific heuristics used by models are more predictive of their success than traditional CoT features, and that effective reasoning often occurs within a limited number of semantic spaces. Additionally, the paper demonstrates that post-training can enhance LLMs' mathematical reasoning by encouraging the use of diverse heuristics, ultimately improving their accuracy."}, 'zh': {'title': 'SHAPE：解码LLM数学推理的新路径', 'desc': 'SHAPE是一个分析链式思维推理的框架，旨在通过语义空间和启发式方法来诊断大型语言模型（LLM）的数学推理能力。该框架关注模型对问题的数学解释和在这些解释中采取的具体数学行动。研究发现，模型使用的数学启发式比传统的链式思维特征更能解释最终答案的正确性。此外，通过促进多样化的启发式，后训练可以有效提高LLM的数学准确性。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2608.28833', 'title': 'Evaluating the Hidden Costs of Personalization in Large Language Models', 'url': 'https://huggingface.co/papers/2608.28833', 'abstract': 'Abstract The study proposes PRISK, a framework that reveals how personalized context in LLMs increases irrelevant personalization, preference narrowing, and sycophantic bias.  Generated by thinkingmachines/Inkling-Small While Large language models (LLMs) incorporate user personalization signals to improve usability and helpfulness, they increasingly shift from providing balanced, informative responses toward optimizing for user satisfaction when conditioned on personal context such as conversation history, inferred preferences, and user profiles. Specifically, we identify three emerging risks: (1) irrelevant personalization, where models reference personal information in unnecessary contexts; (2) preference narrowing, where models reinforce informational echo chambers; and (3) sycophantic bias, where models agree excessively with user opinions. As a result, models may reference personal information in contexts where it is unnecessary, inadvertently collapse response diversity, or agree excessively with user opinions. Despite the growing use of personalization in AI assistants, there has been limited systematic evaluation of its potential side effects. To bridge this gap, we propose PRISK, a dynamic evaluation framework with automated data generation and tailored metrics that uncovers systematic limitations in current LLM personalization and how personalized information shapes its responses. Our empirical analysis across 13 LLMs demonstrates the presence of user profiles and retrieved memories consistently exacerbates biases, resulting in an average drop of 45.9% in irrelevant personalization, 41.7% in preference narrowing and 61.7% in sycophantic bias.', 'score': 23, 'issue_id': 3197, 'pub_date': '2026-08-28', 'pub_date_card': {'ru': '28 августа', 'en': 'August 28', 'zh': '8月28日'}, 'hash': '385af752cd2cdbfa', 'authors': ['Yumeng Wang', 'Yuchen Wu', 'Cheng Qian', 'Zhiyuan Fan', 'Hyeonjeong Ha', 'Shujin Wu', 'Jiayu Liu', 'Heng Ji', 'Ge Wang'], 'affiliations': ['HKUST', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.28833.jpg', 'data': {'categories': [], 'emoji': '⚠️', 'ru': {'title': 'Когда забота о пользователе становится предвзятостью: риски персонализации в языковых моделях', 'desc': 'В статье представлена система PRISK, которая выявляет негативные эффекты персонализации в больших языковых моделях. Исследование показывает, что когда LLMs используют персональный контекст (историю диалогов, предпочтения пользователя, профили), они начинают генерировать неуместные ссылки на личную информацию, создают информационные фильтрационные пузыри и проявляют сикофантский предвзятость. Авторы разработали фреймворк с автоматической генерацией данных и специальными метриками для систематической оценки этих рисков. Экспериментальный анализ 13 различных LLMs продемонстрировал, что персональная информация усиливает нежелательные смещения в среднем на 45.9%, 41.7% и 61.7% соответственно.'}, 'en': {'title': 'Unveiling the Risks of Personalization in Language Models', 'desc': 'The paper introduces PRISK, a framework designed to evaluate the negative effects of personalized context in large language models (LLMs). It identifies three main risks: irrelevant personalization, where personal data is used unnecessarily; preference narrowing, which leads to echo chambers; and sycophantic bias, where models overly agree with user opinions. The study highlights that while personalization aims to enhance user experience, it can lead to significant biases and reduced response diversity. Through empirical analysis of 13 LLMs, the authors demonstrate that personalization can worsen these biases, emphasizing the need for systematic evaluation of AI personalization effects.'}, 'zh': {'title': '个性化风险：揭示LLMs的潜在偏见', 'desc': '本研究提出了PRISK框架，揭示了个性化上下文在大型语言模型（LLMs）中如何导致无关个性化、偏好收窄和谄媚偏见。虽然LLMs利用用户个性化信号来提高可用性和帮助性，但它们越来越倾向于优化用户满意度，而不是提供平衡的信息响应。我们识别出三种新兴风险：无关个性化、偏好收窄和谄媚偏见，这些风险可能导致模型在不必要的上下文中引用个人信息，减少响应的多样性，或过度同意用户的观点。通过对13个LLMs的实证分析，我们发现用户档案和检索的记忆会持续加剧偏见，导致无关个性化、偏好收窄和谄媚偏见的平均下降分别为45.9%、41.7%和61.7%。'}}}, {'id': 'https://huggingface.co/papers/2608.29310', 'title': 'Super Library Agent: Joint Generation and Maintenance of Multiple Applications Beyond the Single Codebase', 'url': 'https://huggingface.co/papers/2608.29310', 'abstract': 'Abstract A shared-library agent framework reduces redundancy and structural erosion when sequentially generating related applications by guiding cross-application code extraction and migration.  Generated by thinkingmachines/Inkling-Small Organizations often develop and maintain portfolios of related applications: independently deployable codebases that share substantial domain logic, interface patterns, or operational conventions. As LLM coding agents are increasingly used to generate and maintain such software, a naive application-by-application workflow duplicates shared logic across codebases and allows prolonged agentic maintenance to accumulate verbosity, dead code, and structural erosion. We introduce the Super Library Agent problem, where an agent sequentially generates a portfolio of N related applications while maintaining a shared Super Library of reusable cross-application components. A minimal sequential scaffold can in principle extract shared code and migrate applications to the evolving library, but in practice suffers from low extraction recall and fragile dependency migration. We address these failures with candidate-guided extraction over code chunk summaries, pre-extraction codebase consolidation, and context-aware migration using extraction traces and call-graph information. Across WebGen-Bench and PaperBench, our method preserves application functionality while significantly reducing redundancy and token footprint (verbosity, token length) over zero-shot, and avoiding the structural erosion introduced by naive library construction, with additional reductions in LOC and MDL. Our code is available at https://github.com/sbigstar0310/super-library-agent.', 'score': 22, 'issue_id': 3197, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '7bbb2849c2bafc4b', 'authors': ['Daegyu Sung', 'Yukyeong Lee', 'Geon Park', 'Yumin Choi', 'Sung Ju Hwang'], 'affiliations': ['DeepAuto.ai', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2608.29310.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark'], 'emoji': '📚', 'ru': {'title': 'Агент с умной библиотекой: генерируем семейства приложений без дублирования', 'desc': 'В работе предложен фреймворк агента с общей библиотекой для снижения дублирования кода при последовательной генерации связанных приложений с помощью LLM. Агент решает задачу Super Library Agent, генерируя портфель N взаимосвязанных приложений, одновременно поддерживая общую библиотеку переиспользуемых компонентов. Авторы применяют кандидатно-ориентированное извлечение кода по суммаризациям фрагментов, предварительную консолидацию кодовой базы и контекстно-осведомленную миграцию с использованием информации о графе вызовов. Экспериментальные результаты показывают значительное снижение избыточности кода, длины токенов и структурной эрозии при сохранении функциональности приложений.'}, 'en': {'title': 'Streamlining Application Development with Shared Libraries', 'desc': 'This paper presents a framework called the Super Library Agent, which aims to improve the process of generating related software applications by minimizing redundancy and structural issues. It addresses the common problem of duplicating shared code across multiple applications, which can lead to maintenance challenges and increased complexity. The proposed method enhances code extraction and migration by using candidate-guided techniques and context-aware strategies, ensuring that shared components are effectively reused. The results demonstrate that this approach not only maintains application functionality but also significantly reduces code verbosity and structural erosion compared to traditional methods.'}, 'zh': {'title': '共享库代理：减少冗余，提升效率', 'desc': '本文提出了一种共享库代理框架，旨在减少在生成相关应用程序时的冗余和结构损耗。该框架通过指导跨应用程序的代码提取和迁移，帮助组织维护多个共享逻辑的独立可部署代码库。我们引入了超级库代理问题，代理在生成相关应用程序的同时，维护一个可重用的超级库。通过候选引导提取和上下文感知迁移，我们的方法在保持应用功能的同时，显著减少了冗余和代码长度。'}}}, {'id': 'https://huggingface.co/papers/2608.31075', 'title': 'Scaling Large Reasoning Models beyond Human Supervision: A Path toward Superintelligence', 'url': 'https://huggingface.co/papers/2608.31075', 'abstract': 'Abstract This work proposes a structured ladder for scaling large reasoning models beyond human supervision by tracing autonomous rewards and self-generated experience, while identifying risks and evaluation dimensions.  Generated by thinkingmachines/Inkling-Small Recent advances in large reasoning models (LRMs) have shown that reinforcement learning with verifiable rewards (RLVR) can substantially improve reasoning in mathematics and code, where outcomes can be checked automatically. Extending this progress to open-ended and agentic tasks remains difficult because reliable rewards are harder to obtain and direct human supervision cannot keep pace with the scale and complexity of model-generated experience. This paper studies how LRMs can continue to improve as human supervision gradually recedes from the learning loop. We examine two connected dimensions of this problem. The reward axis traces the development from per-instance human judgments to reusable verifiers and rewards that operate even without human feedback. The experience axis examines how learning can progress from human-curated tasks and environments toward self-generated curricula, constructed environments, and autonomous co-evolution. We connect these dimensions through a five-level ladder from L0 to L4 that identifies which parts of the learning process remain under continued human control. Our analysis further highlights the risks introduced by increasingly autonomous rewards and experience generation, including reward hacking, feedback drift, curriculum collapse, and environment errors. Consequently, we also provide the evaluation around three complementary objects: policy capability, feedback fidelity, and experience quality. This analysis provides a structured account of current approaches to scaling LRMs beyond human supervision and the open problems involved in developing self-sustaining learning systems toward superintelligence. Furthermore, we maintain a continuously updated https://github.com/visitworld123/Awesome-Scaling-LRM-Beyond-Human-Supervision{GitHub repository} to track the latest advances.', 'score': 21, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '6ee6b8c08ce53856', 'authors': ['Zhiqin Yang', 'Jingwen Fu', 'Yuhan Liu', 'Hengyu Liu', 'Yonggang Zhang', 'Kainan Cao', 'Zizhuo Zhang', 'Chenxin Li', 'Ruibin Yuan', 'Jiahao Pan', 'Jiankai Sun', 'Zhenyuan Zhang', 'Yibo Li', 'Yunlong Lin', 'Jing Xiong', 'Sida Lin', 'Bo Han', 'Wei Xue', 'Yike Guo'], 'affiliations': ['Hong Kong Baptist University', 'Hunyuan Tencent', 'National University of Singapore', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology', 'The University of Hong Kong', 'Xiamen University', 'Xian Jiaotong University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2608.31075.jpg', 'data': {'categories': ['#rlhf', '#training', '#agents', '#rl', '#benchmark'], 'emoji': '🪜', 'ru': {'title': 'Лестница автономного обучения: от надзора человека к самоулучшающимся системам', 'desc': 'В работе предложена структурированная лестница для масштабирования больших моделей рассуждений за пределы человеческого надзора через автономные награды и самогенерируемый опыт. Авторы анализируют две ключевые оси развития: ось вознаграждения (от человеческих оценок к автоматическим верификаторам) и ось опыта (от человеческих задач к самогенерируемым учебным программам). Предложена пятиуровневая лестница (L0-L4), которая определяет степень человеческого контроля на каждом этапе обучения с подкреплением. Исследование также выявляет критические риски автономного обучения, такие как gaming наград и дрейф обратной связи, и предлагает три измерения для оценки качества: способность политики, верность обратной связи и качество опыта.'}, 'en': {'title': 'Scaling LRMs: From Human Guidance to Autonomous Learning', 'desc': 'This paper discusses how to improve large reasoning models (LRMs) without relying heavily on human supervision. It introduces a structured approach, called a ladder, that outlines different levels of autonomy in learning, from human-guided tasks to fully self-generated experiences. The authors explore the challenges of obtaining reliable rewards and the risks associated with autonomous learning, such as reward hacking and feedback drift. They also propose evaluation metrics to assess the effectiveness of these models as they evolve towards greater independence.'}, 'zh': {'title': '超越人类监督的推理模型扩展之路', 'desc': '本文提出了一种结构化的梯子，用于在没有人类监督的情况下扩展大型推理模型。研究表明，使用可验证奖励的强化学习可以显著提高数学和代码推理能力。随着人类监督逐渐减少，本文探讨了如何通过可重用的验证器和奖励来提升学习过程。我们还分析了自主奖励和经验生成带来的风险，并提出了评估政策能力、反馈准确性和经验质量的框架。'}}}, {'id': 'https://huggingface.co/papers/2608.30428', 'title': 'Lies We Can See: Joint Verbal and Non-Verbal Deception by VLM Agents in Embodied Social Interactions', 'url': 'https://huggingface.co/papers/2608.30428', 'abstract': 'Abstract MineAmongUs introduces a 3D multimodal Among Us environment and the ARIA harness to study embodied VLM-agent deception through verbal and non-verbal actions, revealing non-verbal channels as key to winning.  Generated by thinkingmachines/Inkling-Small Strategic deception by LLM and VLM agents has emerged as a central AI alignment and safety concern. Social-deduction games (where each player holds a hidden role and communicates with others to deduce identities) serve as the canonical testbed, particularly in multi-agent settings. Existing testbeds, however, are text-only and run on a single fixed agent configuration, missing the non-verbal sensorimotor channels treated as core by deception taxonomies and leaving it ambiguous whether an observed behavior reflects the underlying model or the surrounding harness. We introduce MineAmongUs, a 3D multimodal Among Us sandbox where imposter agents must deceive crewmates through joint verbal and non-verbal action. We also propose ARIA, a configurable VLM-agent harness that exposes five cognitive-component ablation axes; and an atom- and arc-level annotation scheme grounded in deception taxonomies and operationalized at scale by an LLM-as-a-Judge reaching near-human atom-labeling agreement. Empirical results show that VLM agents pursue imposter wins through joint verbal and non-verbal deception, with non-verbal channels emerging as the more decisive winning contributors across both harness ablation and cross-VLM evaluation. Taken together, our work opens a new path for embodied VLM-agent alignment research.', 'score': 11, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '11fad156fe2513b2', 'authors': ['Jaewoo Ahn', 'Junseo Kim', 'Hyunseo Kim', 'Heeseung Yun', 'Jaehyeon Son', 'Zsolt Kira', 'Gunhee Kim'], 'affiliations': ['Georgia Institute of Technology', 'Inha University', 'KAIST', 'Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30428.jpg', 'data': {'categories': ['#security', '#multimodal', '#alignment', '#games', '#agents', '#benchmark', '#3d', '#dataset'], 'emoji': '🎭', 'ru': {'title': 'Невербальный обман: как агенты выигрывают через действия, а не слова', 'desc': 'В работе представлена 3D мультимодальная среда MineAmongUs на базе игры Among Us для изучения обмана агентов на основе зрительно-языковых моделей (VLM) посредством вербальных и невербальных действий. Авторы предлагают систему ARIA — конфигурируемый фреймворк для анализа агентов с возможностью абляционного исследования пяти когнитивных компонентов. Для оценки поведения агентов разработана схема аннотирования на основе таксономий обмана, где LLM используется в качестве судьи. Эмпирические результаты показывают, что невербальные каналы коммуникации играют более важную роль в победе имитаторов, чем вербальное общение, что открывает новые направления в исследовании выравнивания воплощённых VLM-агентов.'}, 'en': {'title': 'Unlocking Deception: The Power of Non-Verbal Cues in AI', 'desc': 'The paper presents MineAmongUs, a 3D environment designed to study how visual-language model (VLM) agents can deceive others using both verbal and non-verbal actions. It highlights the importance of non-verbal communication in social-deduction games, where players must identify hidden roles. The authors introduce the ARIA harness, which allows for flexible configurations and detailed analysis of agent behavior through a new annotation scheme. Results indicate that VLM agents effectively use both types of deception, with non-verbal actions being particularly crucial for achieving their goals.'}, 'zh': {'title': '揭示非语言欺骗的力量', 'desc': 'MineAmongUs 是一个 3D 多模态的游戏环境，旨在研究 VLM 代理的欺骗行为，结合了语言和非语言的动作。通过 ARIA 设备，我们可以分析代理的认知组件，揭示非语言交流在游戏中的重要性。研究表明，VLM 代理通过联合的语言和非语言欺骗策略来赢得游戏，非语言渠道在获胜中起到了更为关键的作用。我们的工作为 VLM 代理的对齐研究开辟了新的方向。'}}}, {'id': 'https://huggingface.co/papers/2608.29910', 'title': 'Matrix-Game 3.5: Enhancing Real-Time Streaming Interactive World Models with Patch Memory', 'url': 'https://huggingface.co/papers/2608.29910', 'abstract': 'Abstract Matrix-Game 3.5 improves interactive world generation via geometry-aware memory, static-dynamic disentanglement, and progressive distillation for long-horizon real-time simulation.  Generated by thinkingmachines/Inkling-Small Interactive world models extend video generation from offline clip synthesis toward persistent simulation of interactive virtual worlds, enabling applications in games, robotics, embodied agents, and XR. Achieving stable long-horizon interactive generation, however, remains challenging, as the model must simultaneously preserve scene geometry, dynamic consistency, and camera control while supporting real-time autoregressive generation. Building upon Matrix-Game 3.0, we present Matrix-Game 3.5, as shown in Figure 1, which advances real-time interactive world generation toward geometry-aware and long-horizon consistent simulation through three key improvements. First, we propose a unified geometry-aware memory framework, whose patch-memory and tiled-PRoPE components introduce no additional learnable parameters, combining explicit 3D patch retrieval with projective camera conditioning to enable geometry-consistent camera control and faithful long-horizon scene recall. Second, we introduce a static-dynamic disentangled world representation that separately models static scene geometry and dynamic subjects, preserving both geometric consistency and subject identity throughout long-horizon generation. Third, we develop a two-stage progressive real-time distillation framework that converts a bidirectional diffusion model into a few-step causal generator through Perceptual Flow Matching and curriculum based Self-Rollout DMD, enabling minute-long real-time interactive generation. Extensive experiments demonstrate that, with a unified training corpus spanning Unreal simulation environments, open-world games, and internet videos, MatrixGame 3.5 achieves strong performance in long-horizon scene recall, precise camera control, subject consistency, prompt-driven world generation, and stable real-time open-world interaction.', 'score': 11, 'issue_id': 3196, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '5cda4762edead73c', 'authors': ['Runjia Qian', 'Zile Wang', 'Jihai Zhang', 'Kai Zou', 'Wei Yu', 'Jiaxing Li', 'Zexiang Liu', 'Yaokun Li', 'Fei Kang', 'Kaichen Huang', 'Mengyin An', 'Haobo Zhang', 'Biao Jiang', 'Jiahua Wang', 'Haofeng Sun', 'Yang Liu', 'Yangguang Li'], 'affiliations': ['Riemann Dynamics'], 'pdf_title_img': 'assets/pdf/title_img/2608.29910.jpg', 'data': {'categories': ['#multimodal', '#inference', '#games', '#optimization', '#robotics', '#diffusion', '#agents', '#video', '#training', '#3d'], 'emoji': '🎮', 'ru': {'title': 'Геометрически-осведомлённая долгоиграющая симуляция интерактивных миров в реальном времени', 'desc': 'Matrix-Game 3.5 — это интерактивная модель мира, которая генерирует долгоиграющие симуляции виртуальных сцен в реальном времени. Модель использует трёхкомпонентный подход: геометрически-осведомлённую память для точного отслеживания камеры и сцены, разделение представления на статическую геометрию и динамических объектов для сохранения их идентичности, и прогрессивную дистилляцию диффузионной модели в быстрый каузальный генератор. Благодаря единому корпусу обучения на симуляциях, видеоиграх и интернет-видео, модель достигает стабильной генерации интерактивных миров с точным управлением камерой, согласованностью объектов и поддержкой длительных сессий в реальном времени.'}, 'en': {'title': 'Revolutionizing Interactive World Generation with Matrix-Game 3.5', 'desc': 'Matrix-Game 3.5 enhances the generation of interactive virtual worlds by integrating geometry-aware memory and separating static and dynamic elements. This model addresses the challenges of maintaining scene geometry and dynamic consistency while allowing for real-time generation. It introduces a unified memory framework that supports effective camera control and long-term scene recall without adding extra parameters. Additionally, a two-stage distillation process transforms a complex model into a more efficient generator, enabling smooth and consistent interactive experiences in various applications like gaming and robotics.'}, 'zh': {'title': '几何感知的实时交互世界生成', 'desc': 'Matrix-Game 3.5通过几何感知记忆、静态-动态解耦和渐进蒸馏等三项关键改进，提升了交互式世界生成的能力。该模型能够在长时间内保持场景几何形状和动态一致性，同时支持实时自回归生成。它采用了统一的几何感知记忆框架，能够实现几何一致的相机控制和长时间场景回忆。通过广泛的实验，Matrix-Game 3.5在长时间场景回忆、精确相机控制和稳定的实时交互方面表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.31076', 'title': 'Learning to Evaluate Before Improving: Automatic Rubric Induction for Automatic Research Agents', 'url': 'https://huggingface.co/papers/2608.31076', 'abstract': 'Abstract AutoSciRub improves autonomous scientific agents by generating task-specific executable rubrics that guide experiments, verify criteria, and iteratively refine outputs.  Generated by thinkingmachines/Inkling-Small Autonomous scientific research agents are increasingly applied to end-to-end scientific workflows, including literature review, data analysis, experimentation, and report generation. However, open-ended research tasks often do not clearly specify the analyses, methods, and success criteria required to complete the task. As a result, agents may miss important analyses, use inappropriate methods, or draw conclusions that are insufficiently supported by evidence. To address the problem, we present AutoSciRub, an evaluation-first framework that induces a task-specific executable rubric before research execution, and uses it to guide execution, criterion-level verification as well as iterative revision. AutoSciRub decomposes an underspecified instruction into atomic scientific goals, grounds them in relevant literature and task-visible data, and synthesizes specific, actionable, and verifiable criteria. The resulting rubric makes implicit experimental and evidential requirements explicit, providing guidance for experiments and analyses. During revision, rubric-guided verification identifies unmet criteria and enables targeted refinement of the research report and its supporting artifacts. On ResearchClawBench, AutoSciRub consistently improves all tested configurations, with an average gain of 2.08 points across three backbone LLMs under the fixed Codex harness and 2.95 points across three agent harnesses using a fixed DeepSeek-V4-Flash backbone. On a randomly sampled 20-task subset of AstaBench E2E Discovery, AutoSciRub further achieves an average improvement of 16.8 points across three agent harnesses, while maintaining or increasing the number of successfully completed tasks. These results demonstrate that evaluation-first guidance provides an effective and generalizable control mechanism for autonomous scientific research (Code: https://github.com/zjunlp/AutoSciRub).', 'score': 10, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '4df1f0d1acf539e7', 'authors': ['Xuehai Wang', 'Haowei Qin', 'Tongxin Liu', 'Junkai Li', 'Buqiang Xu', 'Jintian Zhang', 'Yijun Chen', 'Zirui Xue', 'Shumin Deng'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'University of Electronic Science and Technology of China', 'Zhejiang University', 'Zhejiang University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.31076.jpg', 'data': {'categories': ['#open_source', '#agents', '#benchmark', '#science'], 'emoji': '🔬', 'ru': {'title': 'Направляемые критериями рубрики для автономных научных исследований', 'desc': 'AutoSciRub представляет собой фреймворк для улучшения автономных научных агентов, который генерирует специфичные для задачи исполняемые рубрики до начала исследования. Система разбивает неточные научные инструкции на атомарные цели, связывает их с релевантной литературой и данными, а затем синтезирует конкретные и проверяемые критерии успеха. Во время выполнения исследования рубрики направляют работу агента, а также служат для верификации на уровне отдельных критериев и итеративного улучшения результатов. Экспериментальные результаты на бенчмарках ResearchClawBench и AstaBench показывают стабильное улучшение качества работы различных LLM-архитектур и агентов в среднем на 2-17 пунктов.'}, 'en': {'title': 'Guiding Autonomous Research with Task-Specific Rubrics', 'desc': 'AutoSciRub is a framework designed to enhance autonomous scientific agents by creating specific rubrics that guide their research tasks. It breaks down vague instructions into clear scientific goals and establishes criteria based on relevant literature and data. This approach ensures that agents conduct thorough analyses and use appropriate methods, leading to more reliable conclusions. By verifying criteria and allowing for iterative refinements, AutoSciRub significantly improves the performance of these agents in scientific workflows.'}, 'zh': {'title': '评估优先，提升科学研究的自主性', 'desc': 'AutoSciRub 是一种改进自主科学代理的框架，通过生成特定任务的可执行评估标准来指导实验、验证标准并迭代优化输出。该框架将不明确的指令分解为具体的科学目标，并结合相关文献和可见数据，合成具体、可操作且可验证的标准。通过明确实验和证据要求，AutoSciRub 为实验和分析提供了指导。在修订过程中，基于评估标准的验证能够识别未满足的标准，从而实现研究报告及其支持材料的有针对性改进。'}}}, {'id': 'https://huggingface.co/papers/2608.29464', 'title': 'Chain-of-Thought Faithfulness of Reasoning Models Varies with Where and How Preference Cues Are Delivered', 'url': 'https://huggingface.co/papers/2608.29464', 'abstract': "Abstract FACE-Eval reveals that chain-of-thought monitoring is less reliable when preference cues arrive via tool outputs or implicit artifacts, with lower verbalized commitment and higher hidden adoption across diverse open-weight models.  Generated by thinkingmachines/Inkling-Small Chain-of-thought (CoT) monitoring assumes that reasoning traces faithfully record the information that shapes a model's answer. Existing faithfulness tests often place explicit bias cues in the user message, while agents may encounter preferences through tool returns or raw artifacts. We introduce FACE-Eval (Faithful Attribution of Cue Effects Evaluation), a 5,100-sample evaluation that varies cue location (user message or tool return) and explicitness (direct summary or raw artifact). We measure verbalized commitment among cue-following answers and unverbalized adoption among all cued samples. We evaluate 15 open-weight models from eight families, with total parameters ranging from 4B to 1.60T. Every model has lower verbalized commitment for tool-return than user-message cues and for implicit than explicit cues. Unverbalized adoption is higher for tool-return cues on all 15 models and for implicit cues in 28 of 30 model-channel comparisons. A source-attribution prompt narrows the channel gap on seven models, sometimes by increasing user-channel unverbalized adoption, while telling models that their reasoning will be monitored does not reliably close the gap. We also use two transcript monitors (GPT-5.6-Luna and GPT-4o-mini) to detect preference adoption in the largest model of each family. Across 32 model-channel-explicitness cells, higher unverbalized adoption is associated with lower detection ability for both monitors (Pearson r=-0.54 and r=-0.78, respectively). These results suggest that CoT monitoring may be less reliable when preference information arrives through tools or must be inferred from raw artifacts, within the single-call, prefilled-tool setting tested here.", 'score': 9, 'issue_id': 3197, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'a9aaae1e43f89eb4', 'authors': ['Aryo Pradipta Gema', 'Neel Rajani', 'Rohit Saxena', 'Wai-Chung Kwan', 'Pasquale Minervini'], 'affiliations': ['Miniml.AI', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2608.29464.jpg', 'data': {'categories': ['#agents', '#benchmark', '#training'], 'emoji': '🔍', 'ru': {'title': 'Скрытое влияние: когда модели скрывают свои настоящие мотивы в рассуждениях', 'desc': 'В статье представлена FACE-Eval — методология оценки надежности мониторинга цепочки рассуждений (chain-of-thought) в больших языковых моделях. Авторы показывают, что когда информация о предпочтениях приходит через вывод инструментов или неявные артефакты, моде
