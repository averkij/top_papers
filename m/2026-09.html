er scans. The pipeline utilizes small, interpretable machine learning models to process scans, performing tasks such as optical character recognition (OCR), text analysis, and named entity recognition. By segmenting scans into manageable crops, the system ensures that each processing step is customizable and efficient, allowing it to run on standard hardware. The result is a large open dataset containing over 16 billion tokens from millions of newspaper crops, significantly enhancing access to historical data.'}, 'zh': {'title': '解锁历史报纸数据的关键步骤', 'desc': '本论文介绍了一种模块化的管道系统，旨在从历史报纸扫描中提取结构化文本和元数据。该系统与波士顿公共图书馆合作设计，能够生成高质量的开放数据集。管道的每个步骤都保持可解释性和可定制性，同时在计算资源上也足够节省，适合在工作站级别的硬件上运行。通过对1795年至1930年间的报纸扫描进行处理，我们提取了超过163亿个标记，形成了一个重要的数据集，推动了历史文献的数字化和可访问性。'}}}, {'id': 'https://huggingface.co/papers/2609.02849', 'title': 'Post-Training Language Models for Gold-Medal Performance in Coding Competitions', 'url': 'https://huggingface.co/papers/2609.02849', 'abstract': 'Abstract A specialization pipeline combining curated problems, synthetic reasoning, supervised fine-tuning, and reinforcement learning trains competitive programming models that exceed top human scores on IOI benchmarks using iterative test-time refinement.  Generated by thinkingmachines/Inkling-Small Competitive programming has become a key test of large language model reasoning, with international competitions such as IOI and ICPC representing its most challenging settings. We present an end-to-end specialization pipeline combining large-scale problem curation, synthetic reasoning traces, supervised fine-tuning (SFT), and reinforcement learning (RL). Using 22,000 curated problems, we train Nemotron-3-Nano-CC (30B-A3B) with SFT and RL and Nemotron-3-Ultra-CC (550B-A55B) with SFT alone. We further introduce GenCorrect, a feedback-driven test-time compute strategy that iteratively generates, evaluates, and refines diverse solutions. On IOI 2025, Nano-CC improves from 130 points to 291 after post-training and to 468 with GenCorrect, exceeding the gold threshold of 438.3 while Ultra-CC reaches 502. Guided by these results, we develop a competition-specific Ultra-CC system and evaluate it prospectively during IOI 2026. Under the same time, internet-access, and submission constraints as human contestants, it scores 535.4 out of 600, exceeding both the gold threshold of 361.12 and the top human score of 498.27. To our knowledge, this is the first AI system to outscore the highest-scoring human contestant on an IOI problem set.', 'score': 8, 'issue_id': 3209, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '9a5eaebd942f5024', 'pdf_title_img': 'assets/pdf/title_img/2609.02849.jpg', 'data': {'categories': ['#rl', '#reasoning', '#plp', '#training', '#dataset', '#synthetic', '#optimization', '#benchmark'], 'emoji': '🏆', 'ru': {'title': 'Машина, которая программирует лучше чемпионов', 'desc': 'В статье представлен специализированный конвейер обучения для решения задач по конкурсивному программированию, объединяющий подготовку большого датасета задач, генерацию синтетических цепочек рассуждений, supervised fine-tuning и reinforcement learning. Авторы обучили две модели: Nemotron-3-Nano-CC и Nemotron-3-Ultra-CC на 22 тысячах отобранных задач, достигнув превосходных результатов на бенчмарке IOI. Ключевым инновационным вкладом является метод GenCorrect — стратегия test-time compute, которая итеративно генерирует, оценивает и уточняет различные решения для повышения качества ответов. Система впервые превзошла лучший результат человека на международной олимпиаде по информатике IOI 2026, набрав 535.4 из 600 баллов против 498.27 у топ-участника.'}, 'en': {'title': 'AI Surpasses Human Champions in Competitive Programming!', 'desc': 'This paper presents a novel pipeline for training competitive programming models that outperform top human scores in international competitions like the IOI. The approach combines curated problem sets, synthetic reasoning, supervised fine-tuning, and reinforcement learning to enhance model performance. A key innovation is the GenCorrect strategy, which refines solutions through iterative evaluation during test time. The results show that the models not only exceed gold thresholds but also achieve scores higher than the best human competitors, marking a significant advancement in AI capabilities in competitive programming.'}, 'zh': {'title': '超越人类的编程模型训练', 'desc': '本文介绍了一种结合了问题策划、合成推理、监督微调和强化学习的专业化管道，用于训练竞争编程模型。这些模型在国际奥林匹克信息学竞赛（IOI）基准测试中超越了顶尖人类选手的得分。我们使用22,000个策划问题训练了不同规模的模型，并引入了一种名为GenCorrect的反馈驱动测试时间计算策略，以迭代生成和优化多样化的解决方案。最终，模型在IOI 2026中表现优异，首次超越了人类选手的最高得分。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.01925', 'title': 'CRISP: Cliff-awaRe Input-adaptive Sparse Prefilling with Structural-Mass-Motivated Routing', 'url': 'https://huggingface.co/papers/2609.01925', 'abstract': "Abstract CRISP improves long-context sparse attention by replacing indirect routing proxies with a direct structural metric and using a sink-aware threshold to eliminate background noise, achieving large speedups and better retrieval accuracy.  Generated by thinkingmachines/Inkling-Small The attention prefilling phase of long-context LLM inference scales quadratically, making self-attention a severe computational bottleneck. Traditional sparse attention methods mitigate this through fixed patterns or offline profiling, but lack the flexibility to adapt to input-dependent attention structure. Recent dynamic methods address this by routing heads to sparse patterns in real-time, but rely on indirect routing proxies with overhead and budget allocation mechanisms that overlook the post-softmax mass hierarchy. We present CRISP (Cliff-awaRe Input-adaptive Sparse Prefilling), which identifies and addresses two structural challenges in this dynamic routing paradigm. First, we show that the routing decision can be read directly off the structure of the proxy attention map. We replace the Jensen-Shannon Divergence (JSD) routing with C_struct, a structural proxy that measures mass at Vertical-Slash compatible positions and reproduces JSD's routing decisions while eliminating both the pooled matmul and subsequent KL divergence overhead. Second, we formalize the post-softmax mass cliff and demonstrate theoretically that strictly cumulative coverage thresholds accumulate O(n) background noise at long contexts. CRISP navigates this via a sink-aware threshold grounded in the noise floor. Empirically, across InfiniteBench, RULER and LongBench on two model families, CRISP is the strongest sparse method overall and matches or exceeds exact dense attention on retrieval-heavy benchmarks, recovering up to +28.0 pp on retrieval tasks over baselines and achieving up to a 5.30x attention speedup at 512k tokens, driven primarily by our O(n) noise elimination during selection while preserving structural integrity.", 'score': 8, 'issue_id': 3209, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '154a6db285d8037f', 'authors': ['Huu Huy Nguyen', 'Chien Van Nguyen', 'Franck Dernoncourt', 'Ryan A. Rossi', 'Linh Ngo Van', 'Jieyang Chen', 'Thien Huu Nguyen'], 'affiliations': ['Adobe Research', 'Hanoi University of Science and Technology', 'University of Oregon'], 'pdf_title_img': 'assets/pdf/title_img/2609.01925.jpg', 'data': {'categories': ['#architecture', '#inference', '#long_context', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Прямая маршрутизация для эффективного внимания на длинных контекстах', 'desc': 'CRISP решает проблему квадратичной сложности self-attention при обработке длинных контекстов в LLM, используя динамическую разреженную внимание. Вместо косвенных прокси-метрик для маршрутизации, метод применяет прямую структурную метрику C_struct, которая анализирует распределение масс в attention-матрице без дополнительных вычислительных затрат. Ключевое улучшение заключается в использовании порога, учитывающего "шум" (background noise) в post-softmax распределении, что позволяет эффективнее отбирать релевантные токены. Метод достигает ускорения в 5.30x на контекстах из 512k токенов и улучшает точность retrieval-задач на 28 процентных пункта по сравнению с базовыми подходами.'}, 'en': {'title': 'CRISP: Revolutionizing Sparse Attention for Long Contexts', 'desc': 'The paper introduces CRISP, a new method for improving long-context sparse attention in machine learning models. It replaces indirect routing proxies with a direct structural metric, which enhances retrieval accuracy and speeds up processing. By addressing the challenges of background noise and routing decisions, CRISP achieves significant performance gains over traditional methods. Empirical results show that CRISP outperforms both sparse and dense attention techniques, especially in retrieval tasks, while maintaining efficiency at large token sizes.'}, 'zh': {'title': 'CRISP：高效的长上下文稀疏注意力方法', 'desc': 'CRISP是一种改进长上下文稀疏注意力的方法，通过直接结构度量替代间接路由代理，并使用考虑噪声的阈值来消除背景噪声，从而实现更快的速度和更好的检索准确性。传统的稀疏注意力方法由于固定模式或离线分析而缺乏灵活性，无法适应输入依赖的注意力结构。CRISP通过直接从代理注意力图的结构中读取路由决策，优化了动态路由过程，并通过引入噪声底线的阈值来解决背景噪声问题。实验结果表明，CRISP在多个基准测试中表现优异，显著提高了检索任务的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.30949', 'title': 'MULTI3IR: A Benchmark for Multi-perspective Multi-domain Multi-modal Information Retrieval', 'url': 'https://huggingface.co/papers/2608.30949', 'abstract': "Abstract A new benchmark and steering method improve retrieval coverage of diverse perspectives across domains and modalities for open-ended queries.  Generated by thinkingmachines/Inkling-Small Information retrieval (IR) increasingly targets open-ended queries that admit diverse perspectives. Existing IR benchmarks, however, focus primarily on closed-ended queries, while even open-ended benchmarks largely consist of queries whose supporting documents span a single subject domain and modality. We introduce Multi^3IR, a benchmark that evaluates how well retrievers cover the multifaceted perspectives of open-ended queries across diverse domains and modalities. It comprises 104.9K Stack Exchange queries, each annotated with perspective descriptions that capture the query's implicit viewpoints. We further propose SPIN, a parameter- and label-efficient method that learns noise vectors to steer embeddings toward diverse yet meaningful semantic directions. Experiments show that existing multimodal retrievers suffer from single-perspective bias, while SPIN substantially improves perspective coverage on Multi^3IR and generalizes well to unseen open-ended IR benchmarks. The dataset and experimental code are available at https://github.com/seokwon99/Multi3IR.", 'score': 7, 'issue_id': 3208, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b262dab5b9bd98a8', 'authors': ['Seokwon Song', 'Sohyeon Kim', 'Gunhee Kim'], 'affiliations': ['Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30949.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#rag', '#dataset'], 'emoji': '🔍', 'ru': {'title': 'Преодоление однобокости: многомерный поиск информации с разнообразием перспектив', 'desc': 'В статье представлен новый бенчмарк Multi³IR для оценки способности систем поиска информации покрывать разнообразные точки зрения по открытым запросам пользователей, охватывающим различные домены и модальности. Авторы предлагают метод SPIN, который использует шумовые векторы для направления эмбеддингов в семантическое пространство, обеспечивая разнообразие релевантных результатов при минимальных вычислительных затратах. Эксперименты показывают, что существующие мультимодальные retriever-ы страдают от однобокости в выдаче результатов, тогда как SPIN значительно улучшает покрытие различных перспектив. Метод хорошо обобщается на новые бенчмарки открытых информационных запросов.'}, 'en': {'title': 'Enhancing Diverse Perspectives in Open-Ended Information Retrieval', 'desc': 'This paper presents Multi^3IR, a new benchmark designed to enhance information retrieval (IR) for open-ended queries by ensuring diverse perspectives across various domains and modalities. Traditional IR benchmarks often focus on closed-ended queries or single-domain documents, limiting the exploration of multifaceted viewpoints. The authors introduce SPIN, a novel method that efficiently adjusts embeddings to capture a wider range of semantic directions, addressing the issue of single-perspective bias in existing multimodal retrievers. Experimental results demonstrate that SPIN significantly improves the retrieval of diverse perspectives, showcasing its effectiveness on the Multi^3IR benchmark and its applicability to other open-ended IR tasks.'}, 'zh': {'title': '提升开放式查询的多样化视角检索', 'desc': '这篇论文介绍了一种新的基准和引导方法，旨在提高开放式查询在不同领域和模态下的多样化视角的检索覆盖率。现有的信息检索基准主要集中在封闭式查询，而开放式基准往往只涉及单一主题领域和模态的查询。我们提出了Multi^3IR基准，评估检索器在多领域和多模态下对开放式查询的多面向视角的覆盖能力。我们还提出了SPIN方法，通过学习噪声向量，引导嵌入向多样且有意义的语义方向发展，从而显著改善了视角覆盖。'}}}, {'id': 'https://huggingface.co/papers/2609.02272', 'title': 'PaperCompiler: Faithful Paper-to-Code Generation via Repository-Level Specification Compilation', 'url': 'https://huggingface.co/papers/2609.02272', 'abstract': 'Abstract PaperCompiler converts research papers into structured repository specifications that preserve method logic and cross-file consistency, improving code fidelity and reducing critical errors.  Generated by thinkingmachines/Inkling-Small Faithfully translating research papers into repository-level implementations remains challenging because papers often describe methods at a high level, leave implementation assumptions implicit, and require generated repositories to preserve method logic, evaluation protocols, and cross-file consistency. Despite recent advances in paper-to-code agents, their intermediate outputs are often presented as free-form plans or summaries that downstream coding agents may ignore, reinterpret, or compress, leading to algorithmic simplification and inconsistent repository structure. To address these challenges, we introduce PaperCompiler, a paper-to-code generation framework that compiles paper-grounded evidence into explicit repository-level implementation specifications. PaperCompiler grounds implementation-relevant evidence while preserving source provenance and distinguishing paper-supported, inferred, externally delegated, and unresolved information. The resulting specifications encode non-degradation requirements, ownership assignments, cross-file dependencies, and file-level constraints. Repository generation proceeds under these compiled specifications while retaining flexibility over local engineering choices not fixed by the paper. PaperCompiler outperforms strong baselines on Paper2CodeBench, achieving a 13.8% relative improvement in reference-based fidelity (from 3.64 to 4.15) and reducing high-severity evaluator critiques (from 13.2% to 6.1%).', 'score': 6, 'issue_id': 3208, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'cfc74fbf7ea8977c', 'authors': ['Yunhao Liu', 'Hong Phuc Pham', 'Jaehong Yoon'], 'affiliations': ['NTU Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.02272.jpg', 'data': {'categories': [], 'emoji': '📋', 'ru': {'title': 'От научной статьи к идеальному коду через явные спецификации', 'desc': 'PaperCompiler — это система для автоматического преобразования научных статей в структурированные спецификации хранилищ кода, которые сохраняют логику методов и согласованность между файлами. В отличие от существующих агентов для генерации кода из бумаги, которые создают неструктурированные планы, PaperCompiler компилирует доказательства из статей в явные требования уровня репозитория с трассировкой источников и различением подтвержденной, выведенной и неопределенной информации. Система кодирует требования непротиворечивости, распределение ответственности между файлами, зависимости и ограничения, позволяя генератору кода работать под этими спецификациями. PaperCompiler достигает 13.8% относительного улучшения в точности воспроизведения метода и снижает критические ошибки в коде на 53%.'}, 'en': {'title': 'Transforming Research into Reliable Code', 'desc': 'PaperCompiler is a framework designed to convert research papers into structured code repositories while maintaining the integrity of the methods described. It addresses the challenge of translating high-level descriptions and implicit assumptions from papers into explicit implementation specifications. By grounding the generated code in evidence from the original paper, it ensures that the logic and evaluation protocols are preserved, reducing errors and inconsistencies. The framework has shown significant improvements in code fidelity and reduced critical issues compared to existing methods.'}, 'zh': {'title': 'PaperCompiler：将论文转化为高保真代码的利器', 'desc': 'PaperCompiler 是一个将研究论文转换为结构化代码库规范的框架，旨在保持方法逻辑和跨文件一致性，从而提高代码的准确性并减少关键错误。该框架解决了将论文高层次描述的研究方法转化为具体实现时的挑战，确保生成的代码库能够保留评估协议和方法逻辑。PaperCompiler 通过明确的规范编码实现相关证据，同时区分论文支持的信息和推断、外部委托及未解决的信息。最终，PaperCompiler 在 Paper2CodeBench 上的表现优于强基线，显著提高了代码的参考准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.01865', 'title': 'ExecRetrieval: Measuring the Functional-Correctness Gap in Code-Embedding Retrieval', 'url': 'https://huggingface.co/papers/2609.01865', 'abstract': "Abstract ExecRetrieval evaluates whether code embeddings can distinguish correct implementations from near-identical buggy variants, revealing that leading retrievers frequently rank incorrect near-clones above canonical solutions.  Generated by thinkingmachines/Inkling-Small Embedding-based code retrieval is a core component of coding agents and retrieval-augmented code generation, where retrieving correct code matters more than retrieving lexically similar code. Existing code-retrieval benchmarks do not plant controlled, execution-verified single-edit variants of each query's canonical implementation in the search pool, leaving the question of whether embeddings can functionally discriminate correct from near-clone-but-incorrect code unanswered in a retrieval setting. Resolving this requires a benchmark whose search pool itself contains the relevant counterfactuals -- execution-verified buggy variants near-identical to each canonical -- so that a retriever's rank ordering can be directly tested for functional discrimination rather than topical or identity overlap. We introduce ExecRetrieval, 939 Python tasks each paired with one execution-verified canonical implementation and up to four execution-verified buggy distractors, each generated by a mechanical mutation making a single targeted edit, and evaluate 23 dense embedding configurations plus BM25 under provider-native invocation with paired McNemar tests and query-level bootstrap intervals. With near-clone counterfactuals in the pool, the top hosted system reaches exec@10 = 1.00 but only exec@1 = 0.331; rank-1 misses are paired buggy variants 91.5-99.4% of the time across the four leading systems, and the canonical scores below at least one of its four paired distractors in 67-78% of queries on the leading systems. The full dataset, execution oracle, embedding matrices, environment snapshot, and pairwise statistical tests are released at the URL in Appendix D.", 'score': 6, 'issue_id': 3208, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'aa0a1fa6f2b3e541', 'authors': ['Aaryan Kapoor', 'Md Abdullah Al Hafiz Khan'], 'affiliations': ['Kennesaw State University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01865.jpg', 'data': {'categories': ['#rag', '#dataset', '#benchmark', '#plp', '#agents'], 'emoji': '🐛', 'ru': {'title': 'Когда почти идентичный код скрывает критическую ошибку', 'desc': 'В работе представлен новый бенчмарк ExecRetrieval для оценки способности векторных представлений кода различать корректные реализации от почти идентичных багов. Исследование показывает, что современные системы поиска кода часто ранжируют ошибочные варианты выше правильных решений, несмотря на высокую лексическую схожесть. Бенчмарк содержит 939 Python задач с канонической реализацией и проверенными на выполнение мутантами-ошибками, полученными путём целевого редактирования. Результаты демонстрируют критический разрыв между recall@10 и recall@1 для лидирующих систем, подчёркивая необходимость семантического анализа при поиске кода.'}, 'en': {'title': 'Distinguishing Code: Correct vs. Buggy with ExecRetrieval', 'desc': 'The paper introduces ExecRetrieval, a benchmark designed to evaluate the effectiveness of code embeddings in distinguishing correct code implementations from similar but buggy variants. It highlights that existing benchmarks do not adequately test this capability, as they lack controlled, execution-verified buggy versions of code. By including these near-clone distractors, the study assesses how well different retrieval systems can rank correct solutions over incorrect ones. The results show that while some systems perform well overall, they often misidentify buggy variants as correct, indicating a need for improved retrieval methods in code generation tasks.'}, 'zh': {'title': 'ExecRetrieval：区分正确与错误代码的基准测试', 'desc': '本文介绍了ExecRetrieval，一个评估代码嵌入是否能够区分正确实现与近似错误变体的基准。研究发现，现有的代码检索系统常常将错误的近似克隆排在正确解决方案之前。为了验证嵌入的功能性区分能力，ExecRetrieval创建了一个包含执行验证的错误变体的搜索池，使得检索系统的排名可以直接测试。通过对939个Python任务的评估，结果显示，尽管顶级系统在前10名中表现良好，但在第一名的准确率却相对较低，表明现有系统在处理近似错误变体时存在显著挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.00474', 'title': 'Exploring Collaboration between a language and a non-language agent', 'url': 'https://huggingface.co/papers/2609.00474', 'abstract': "Abstract A benchmark of collaborative chess tasks shows that integrating continuous subagent representations directly into language models via learned state tokens outperforms text-based verbalization and scales effectively.  Generated by thinkingmachines/Inkling-Small LLMs are increasingly deployed as orchestrators that coordinate specialized subagents to solve complex tasks through natural language. However, in many important domains like game playing and robotics, the strongest available agents are not language models. Integrating non-language agents with LLMs would require verbalization: compressing their rich continuous representations into sparse textual summaries at each interaction step. To study whether verbalization constitutes a bottleneck, we introduce LLAMIA-Bench, a suite of six diverse collaborative chess tasks spanning three facets: behavioral imitation, state assessment, and natural-language explanation. Each task instantiates a well-established chess problem that neither the LLM nor the chess engine can solve alone. To solve LLM collaboration with non-language agents, we introduce latent state internalization, which projects the subagent's continuous representations directly into the LLM's token stream as learned state tokens, with dynamic re-encoding as actions advance the environment state. Comparing internalization to verbalized integration, our experiments reveal a consistent verbalization debt: the performance gap widens throughout training and persists as the LLM scales from 4B to 14B parameters. A single 14B model, LLAMIA, trained with latent state internalization, matches or exceeds task specialists and frontier models including GPT-5.1 with tool access across all benchmark tasks, and generalizes out-of-distribution where task-specific finetunes collapse", 'score': 5, 'issue_id': 3210, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '16b8b73da53e4906', 'authors': ['Harini S', 'Somesh Singh', 'Yaman K Singla', 'Rajiv Ratn Shah', 'David Doermann', 'Balaji Krishnamurthy'], 'affiliations': ['Adobe Media and Data Science Research (MDSR)', 'IIIT-Delhi', 'IIT Kanpur', 'SUNY at Buffalo'], 'pdf_title_img': 'assets/pdf/title_img/2609.00474.jpg', 'data': {'categories': ['#agents', '#benchmark', '#architecture', '#games', '#training', '#reasoning'], 'emoji': '♟️', 'ru': {'title': 'Прямая интеграция непрерывных представлений агентов в LLM без текстовой вербализации', 'desc': 'В статье представлен бенчмарк LLAMIA-Bench для оценки совместной работы большых языковых моделей с специализированными агентами на примере задач в шахматах. Авторы вводят метод латентной интернализации состояния, который проецирует непрерывные представления агента напрямую в поток токенов LLM в виде обучаемых токенов состояния, избегая необходимости вербализации. Эксперименты показывают, что интернализация последовательно превосходит текстовый подход, и этот разрыв производительности растёт по мере масштабирования модели от 4B до 14B параметров. Модель LLAMIA, обученная с латентной интернализацией, достигает результатов сопоставимых с граничными моделями вроде GPT-5.1 и демонстрирует улучшенную обобщаемость на внедомённых данных.'}, 'en': {'title': 'Revolutionizing LLM Collaboration with Direct State Integration', 'desc': "This paper presents a new approach to enhance the performance of language models (LLMs) in collaborative tasks, specifically in chess, by integrating continuous representations from specialized subagents directly into the LLM's processing. The authors introduce LLAMIA-Bench, a benchmark that evaluates how well LLMs can collaborate with non-language agents without relying on verbalization, which often compresses rich information into less informative text. They propose a method called latent state internalization, which allows the LLM to utilize the continuous state of subagents as learned tokens, improving task performance. The results show that this method significantly outperforms traditional verbalization techniques, especially as the model scales in size, demonstrating that direct integration leads to better collaboration and task-solving capabilities."}, 'zh': {'title': '潜在状态内化：提升协作智能的关键', 'desc': '这篇论文介绍了一种新的方法，称为潜在状态内化，旨在将非语言代理的连续表示直接集成到大型语言模型（LLM）中。通过这种方法，研究人员发现与传统的文本化方法相比，性能显著提升，尤其是在复杂的协作象棋任务中。实验表明，文本化会造成性能瓶颈，而潜在状态内化能够有效缩小这一差距。最终，训练的14B参数模型LLAMIA在多个基准任务中表现优异，超越了许多专门的任务模型。'}}}, {'id': 'https://huggingface.co/papers/2608.29607', 'title': 'SnapBench: Benchmarking Snap-and-Ask Multimodal Retrieval for Mobile Interactions', 'url': 'https://huggingface.co/papers/2608.29607', 'abstract': 'Abstract SnapBench introduces paired corruption benchmarks for mobile snap-and-ask retrieval, revealing that image noise severely degrades multimodal retrieval and proposing an adaptive fusion method to calibrate modality reliability.  Generated by thinkingmachines/Inkling-Small Mobile AI acts as a visual oracle, empowering users to snap a picture of something and ask for information. Snap-and-ask retrieval is now one of the most common entry points for mobile AI, yet photos are often blurry, while text questions may be short or mistyped. Existing benchmarks only test on clean inputs or do not isolate paired robustness in snap-and-ask retrieval. Therefore, we introduce SnapBench, the first paired benchmark for robust snap-and-ask multimodal retrieval, spanning 1,145 queries, 9,085 gallery items under 53 controlled corruption conditions with human annotations. We evaluate 16 multimodal retrievers, covering dual-tower encoders and embedding-based VLMs. Results show that image corruptions substantially degrade retrieval, while text corruptions mainly affect text-only retrieval and have limited impact on joint retrieval. Clean image-only retrieval often outperforms joint retrieval, indicating the coarse-text drag and the lack of cross-modal fallback under noisy inputs. SnapBench provides a controlled testbed for evaluating robust retrieval in snap-and-ask scenarios. We further propose MOOR (Modality-anchored, Outlier-aware, Optimal Reweighting), a simple adaptive fusion approach, highlighting the need for reliability-aware modality calibration in snap-and-ask retrieval.', 'score': 5, 'issue_id': 3209, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '7cc30b16f86bd24e', 'authors': ['Zirong Chen', 'Fuda Ye', 'Kuan Zhang', 'Enjun Du', 'Junfu Pu', 'Xinlei Wang', 'Xinyu Zuo', 'Lisheng Duan', 'Jin Ma', 'Yongqi Zhang'], 'affiliations': ['ARC Lab, Tencent', 'Tencent Yuanbao', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.29607.jpg', 'data': {'categories': ['#rag', '#dataset', '#benchmark', '#multimodal'], 'emoji': '📸', 'ru': {'title': 'Адаптивное взвешивание модальностей для устойчивого мультимодального поиска в мобильных приложениях', 'desc': 'В статье представлена SnapBench — первый парный бенчмарк для оценки мультимодального поиска в сценариях мобильного snap-and-ask (фотография + вопрос) при различных типах шума. Исследователи оценили 16 моделей multimodal retrieval на 1,145 запросах и 9,085 элементах галереи под 53 различными условиями корруптации данных с разметкой человека. Результаты показали, что шумы в изображениях существенно снижают качество поиска, тогда как шумы в тексте влияют слабо, и чистые изображения часто работают лучше совместного использования модальностей. Авторы предложили MOOR — адаптивный метод слияния модальностей с калибровкой надежности каждого модального потока для устойчивого поиска при наличии шума.'}, 'en': {'title': 'Enhancing Mobile AI Retrieval with SnapBench', 'desc': 'The paper introduces SnapBench, a new benchmark designed to evaluate the robustness of multimodal retrieval systems in mobile snap-and-ask scenarios. It highlights how image noise can significantly impair the performance of these systems, while text errors have a lesser impact on joint retrieval. The study evaluates various multimodal retrievers and finds that clean image retrieval often surpasses joint retrieval due to the challenges posed by noisy inputs. To address these issues, the authors propose an adaptive fusion method called MOOR, which aims to improve modality reliability in retrieval tasks.'}, 'zh': {'title': 'SnapBench：提升快照问答检索的鲁棒性', 'desc': 'SnapBench 是一个针对移动快照问答检索的配对腐蚀基准，揭示了图像噪声对多模态检索的严重影响。该研究提出了一种自适应融合方法，以校准模态的可靠性。通过评估 16 种多模态检索器，结果显示图像腐蚀显著降低了检索效果，而文本腐蚀主要影响文本检索。SnapBench 为评估快照问答场景中的鲁棒检索提供了一个受控的测试平台。'}}}, {'id': 'https://huggingface.co/papers/2608.30751', 'title': 'Autoregressive Mosaics: Probing 2D Spatial Reasoning in Text-Only Language Models', 'url': 'https://huggingface.co/papers/2608.30751', 'abstract': 'Abstract Text-only large language models vary in open-ended 2D layout ability despite reliable geometry-to-code translation, with performance shaped by output medium and internal tracking of evolving geometric state rather than fixed plans.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) trained only on text and code can sometimes generate programs that draw recognizable images. However, it is unclear whether this reflects an internal representation of 2D spatial layout or simply the ability to translate spatial descriptions into code. We introduce Autoregressive Mosaics (AM-Bench), a benchmark that separates these factors: First, a translation task gives a model a fully specified geometry of a picture in words as a prompt and asks for the code that produces it. Second, a layout task requires the model to compose an image from an underspecified prompt. Across eight open-weight text-and-code-only models, all models reliably translate specified geometry into code, but their open-ended layout performance differs substantially, indicating that these differences are not explained by code-generation ability alone. An output-medium ablation further shows that the interface or medium of expression that the model uses matters: replacing procedural code with raw SVG improves layout scores across all models. Finally, probing model activations shows that a coarse layout plan is present before generation, but reflects only the layout implied by the prompt. During generation, models track the evolving geometric state instead of executing an initially fixed plan. Overall, these results show that 2D spatial performance in text-only LLMs depends on both the model and the output medium, and is not explained by code-generation ability alone.', 'score': 3, 'issue_id': 3210, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'f8f3d7fc873727fe', 'authors': ['Ashwin Nedungadi', 'Stefan Oehmcke', 'Stefan Lüdtke'], 'affiliations': ['Institute for Visual & Analytic Computing (VAC), University of Rostock'], 'pdf_title_img': 'assets/pdf/title_img/2608.30751.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Пространственное мышление в языковых моделях: отслеживание состояния важнее, чем кодогенерация', 'desc': 'В работе исследуется способность текстовых больших языковых моделей генерировать двумерные макеты и код для рисования изображений. Авторы предлагают AM-Bench — бенчмарк, который разделяет задачу трансляции геометрии в код от задачи свободного компоирования изображения из неполного описания. Результаты показывают, что все модели надёжно переводят заданную геометрию в код, но качество открытого компоирования макетов сильно варьируется между моделями, что указывает на важность внутреннего представления пространственных отношений. Дополнительный анализ активаций моделей выявляет, что они отслеживают эволюционирующее геометрическое состояние во время генерации, а не следуют заранее составленному плану.'}, 'en': {'title': 'Unlocking 2D Layouts: Beyond Code Generation in LLMs', 'desc': 'This paper investigates how text-only large language models (LLMs) perform in generating 2D layouts, distinguishing between their ability to translate geometric descriptions into code and their capacity for open-ended layout creation. The authors introduce a benchmark called Autoregressive Mosaics (AM-Bench) to evaluate these capabilities through translation and layout tasks. Results show that while all models can translate specified geometry into code, their performance in creating layouts varies significantly, indicating that code-generation ability is not the sole factor. Additionally, the choice of output medium affects performance, with raw SVG yielding better results, and models demonstrate a dynamic tracking of geometric states during generation rather than following a fixed plan.'}, 'zh': {'title': '大型语言模型的2D布局能力与输出媒介相关', 'desc': '这篇论文探讨了大型语言模型（LLMs）在生成2D布局时的表现差异，尽管它们在几何到代码的转换上表现可靠。研究表明，模型的输出媒介和内部几何状态的跟踪对生成结果有重要影响，而不仅仅是固定的计划。通过引入自回归马赛克（AM-Bench）基准，作者区分了翻译任务和布局任务，发现模型在这两种任务中的表现差异显著。最终结果表明，文本仅的LLMs在2D空间表现上依赖于模型本身和输出媒介，而不仅仅是代码生成能力。'}}}, {'id': 'https://huggingface.co/papers/2609.01823', 'title': 'Kirin: Animal Motion Generation from In-the-Wild Video', 'url': 'https://huggingface.co/papers/2609.01823', 'abstract': 'Abstract Kirin reconstructs 3D animal motion from video to build a large-scale dataset and generate text- and image-conditioned motion for animating 3D meshes.  Generated by thinkingmachines/Inkling-Small Understanding animal motion is fundamental to modeling animal behavior and biomechanics, yet progress in this area lags far behind human motion research due to the scarcity of high-quality motion data. While human motion can be captured in controlled environments, it is impractical for most animal species, resulting in small, domain-limited datasets that restrict downstream applications such as animation. To address this challenge, we introduce Kirin, a framework that reconstructs motion from video, learns motion priors at scale, and generates realistic motion that can be directly applied to animated assets. Using large collections of in-the-wild animal videos, we reconstruct 3D motion sequences and pair them with captions to create AiM3D, the first large-scale dataset offering aligned video-text-motion tuples for quadruped animals. Building on this dataset, we develop a visual-guided motion generation model that conditions on both text and image to guide the generation of realistic motion across diverse animal species. Finally, by leveraging an off-the-shelf image-to-3D model, we automatically rig and animate 3D meshes using generated motion, producing ready-to-render animated animals. Together, our dataset and framework establish a new foundation for large-scale, text and image conditioned animal motion generation and animation. Project page: https://kirin-ani.github.io/.', 'score': 3, 'issue_id': 3209, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '1d5b7298ff64c7ee', 'authors': ['Brian Nlong Zhao', 'Zhuoyang Pan', 'James M. Rehg', 'Jiajun Wu', 'Shangzhe Wu'], 'affiliations': ['Stanford University', 'University of Cambridge', 'University of Illinois Urbana-Champaign', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2609.01823.jpg', 'data': {'categories': ['#dataset', '#3d', '#multimodal', '#video'], 'emoji': '🦁', 'ru': {'title': 'От видео к движению: генерация реалистичной анимации животных через мультимодальное кондиционирование', 'desc': 'Kirin — это фреймворк для реконструкции 3D-движения животных из видео с целью создания крупномасштабного датасета. Авторы разработали AiM3D, первый большой датасет с выровненными кортежами видео-текст-движение для четвероногих животных, извлекая движения из натуральных видео в дикой природе. На основе этого датасета создана модель генерации движения, которая кондиционируется одновременно на текст и изображение для синтеза реалистичных движений разнообразных видов животных. Фреймворк позволяет автоматически анимировать 3D-модели с помощью сгенерированных движений, обходя необходимость дорогостоящей съёмки в контролируемых условиях.'}, 'en': {'title': 'Revolutionizing Animal Motion Animation with Kirin', 'desc': 'Kirin is a framework designed to reconstruct 3D animal motion from video footage, addressing the lack of high-quality motion data for animals. It creates a large-scale dataset called AiM3D, which pairs video, text, and motion data for quadruped animals, enabling better understanding of animal behavior and biomechanics. The framework also includes a visual-guided motion generation model that uses both text and images to produce realistic animations for various animal species. By integrating an image-to-3D model, Kirin automates the rigging and animation of 3D animal meshes, facilitating the creation of ready-to-render animated assets.'}, 'zh': {'title': 'Kirin：为动物动画开辟新天地', 'desc': 'Kirin是一个从视频中重建3D动物运动的框架，旨在建立一个大规模的数据集，并生成基于文本和图像的运动，以便为3D模型动画提供支持。由于高质量动物运动数据的稀缺，动物运动的研究进展远远落后于人类运动研究。Kirin通过分析大量野外动物视频，重建3D运动序列，并与文本描述配对，创建了AiM3D，这是第一个提供四足动物视频-文本-运动元组的大规模数据集。该框架还开发了一种视觉引导的运动生成模型，能够根据文本和图像生成真实的动物运动，推动了动物动画的研究和应用。'}}}, {'id': 'https://huggingface.co/papers/2609.00377', 'title': 'FoldingAgent: Inferring Parametric Origami Procedures from Demonstration Videos', 'url': 'https://huggingface.co/papers/2609.00377', 'abstract': "Abstract FoldingAgent uses a vision-language model with specialized tools to convert origami videos into executable parametric folding programs via sequential reasoning and physical verification.  Generated by thinkingmachines/Inkling-Small We present FoldingAgent, an agentic framework for inferring explicit parametric folding programs directly from origami demonstration videos. Our framework leverages the reasoning power of a pre-trained Vision-Language Model (VLM) equipped with a suite of specialized tools that enable the agent to simulate geometric transitions, verify physical plausibility, retrieve and compare visual content, and evaluate its own predictions. To translate visual content into folding programs, we define a parametric space that consists of the paper's geometry and a set of parametric folding actions. Unlike models that predict static crease patterns, our agent operates sequentially and possesses the ability to re-plan its actions, effectively mitigating the compounding errors inherent in multi-step folding. Our approach takes a step toward closing the gap between human origami knowledge, which is primarily shared through unstructured visual demonstrations, and computational methods, which typically rely on structured, parametric representations such as a crease pattern or an executable parametric plan. We evaluate our approach on PurelandFold, a newly curated benchmark of diverse Pureland origami videos with ground-truth geometry and action labels. Our results demonstrate that by combining VLM reasoning with a set of specialized tools and physical simulation, we can successfully transform unstructured visual demonstrations into executable, physically plausible folding procedures.", 'score': 3, 'issue_id': 3210, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b09e4ccc48b6d812', 'authors': ['Maya Moriya', 'Sigal Raab', 'Yael Vinker', 'Tali Dekel'], 'affiliations': ['MIT, USA', 'Weizmann Institute of Science, Israel'], 'pdf_title_img': 'assets/pdf/title_img/2609.00377.jpg', 'data': {'categories': ['#video', '#dataset', '#agents', '#benchmark', '#multimodal', '#open_source', '#science', '#reasoning'], 'emoji': '📄', 'ru': {'title': 'От видео оригами к исполняемым программам складывания', 'desc': 'FoldingAgent — это агентская система, которая использует визуально-языковую модель для преобразования видео оригами в параметрические программы складывания. Система оснащена специализированными инструментами для симуляции геометрических переходов, проверки физической правдоподобности и сравнения визуального содержимого. В отличие от моделей, предсказывающих статические паттерны складок, агент работает последовательно и может перепланировать свои действия, что снижает ошибки в многошаговых процессах. Подход демонстрирует способность преобразовывать неструктурированные визуальные демонстрации в исполняемые и физически правдоподобные процедуры складывания.'}, 'en': {'title': 'Transforming Origami Videos into Executable Folding Programs', 'desc': 'FoldingAgent is a framework that uses a Vision-Language Model (VLM) to create folding programs from origami videos. It employs sequential reasoning and physical verification to ensure that the generated programs are executable and realistic. Unlike traditional models that only predict static crease patterns, FoldingAgent can adapt its actions in real-time, reducing errors during the folding process. This approach bridges the gap between human origami techniques and computational methods, allowing for a more intuitive translation of visual demonstrations into structured folding instructions.'}, 'zh': {'title': '将折纸视频转化为可执行程序的智能框架', 'desc': 'FoldingAgent 是一个利用视觉-语言模型的框架，能够将折纸视频转换为可执行的参数折叠程序。它通过顺序推理和物理验证，直接从折纸演示视频中推断出明确的参数折叠程序。该框架结合了预训练的视觉-语言模型和一系列专用工具，能够模拟几何变化、验证物理可行性，并评估自身的预测。与传统模型不同，FoldingAgent 具备重新规划动作的能力，有效减少了多步骤折叠中固有的累积误差。'}}}, {'id': 'https://huggingface.co/papers/2609.02496', 'title': 'Debias-SparseGPT: Bias-Aware Pruning for Large Language Models', 'url': 'https://huggingface.co/papers/2609.02496', 'abstract': 'Abstract Debias-SparseGPT reduces pruning-induced demographic bias in compressed large language models by incorporating representational debiasing during post-training sparsification.  Generated by thinkingmachines/Inkling-Small Model compression techniques such as pruning and quantization facilitate the efficient deployment and acceleration of Large Language Models (LLMs). However, recent studies show that weight sparsification methods, such as SparseGPT, can amplify existing biases in models, with outputs varying significantly depending on persona cues in the prompt. In this paper, we introduce Debias-SparseGPT, a post-training pruning method incorporating representational debiasing using a second-order term defined over demographically contrasting inputs. We perform empirical validation of our method over a wide range of generative LLMs. Across models and sparsity regimes (25%, 50%, and structured 2:4 sparsity), Debias-SparseGPT consistently reduces pruning-induced bias compared to SparseGPT while preserving model perplexity and zero-shot accuracy. Under the most restrictive 2:4 structured sparsity pattern, which most aggressively degrades model quality, augmenting the calibration set with long-context, content-rich examples further improves both downstream performance and fairness. Overall, Debias-SparseGPT advances the bias-performance trade-off while preserving the computational efficiency of sparse models.', 'score': 2, 'issue_id': 3210, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '66e2cce37e98c21c', 'authors': ['Irina Proskurina', 'Guillaume Metzler', 'Antoine Gourru', 'Julien Velcin'], 'affiliations': ['ERIC', 'LIRIS, CNRS UMR 5205', 'Laboratoire Hubert Curien, UMR CNRS 5516, Saint-Étienne, France', 'Université Claude Bernard Lyon 1', 'Université Lumière Lyon 2', 'École Centrale de Lyon'], 'pdf_title_img': 'assets/pdf/title_img/2609.02496.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Беспристрастное сжатие: баланс между эффективностью и справедливостью LLM', 'desc': 'Debias-SparseGPT - это метод сжатия больших языковых моделей, который уменьшает демографическую предвзятость, возникающую при прунинге весов. Авторы показывают, что стандартные методы спарсификации, такие как SparseGPT, усиливают существующие смещения в моделях, что приводит к различным выходам в зависимости от подсказок с персоналиями. Предложенный подход использует дополнительный регуляризационный член второго порядка, определённый на демографически контрастных входных данных, чтобы одновременно снизить предвзятость и сохранить качество модели. Экспериментальная валидация демонстрирует, что метод эффективно уменьшает смещения при различных уровнях спарсности (25%, 50% и структурированная 2:4), не теряя вычислительную эффективность.'}, 'en': {'title': 'Reducing Bias in Compressed Language Models', 'desc': "Debias-SparseGPT is a method designed to reduce demographic bias in large language models (LLMs) that have been compressed through pruning. It addresses the issue that traditional weight sparsification techniques can worsen biases in model outputs based on demographic cues. By incorporating representational debiasing during the post-training phase, Debias-SparseGPT effectively mitigates these biases while maintaining the model's performance metrics like perplexity and accuracy. The method has been empirically validated across various models and sparsity levels, demonstrating a significant improvement in fairness without sacrificing computational efficiency."}, 'zh': {'title': '减少偏见，提升公平性！', 'desc': 'Debias-SparseGPT是一种后训练剪枝方法，旨在减少压缩大型语言模型中因剪枝引起的人口统计偏见。该方法通过在剪枝过程中引入表征去偏见，使用基于不同人口特征输入的二阶项来实现。研究表明，Debias-SparseGPT在多种生成型大型语言模型上表现出色，能够在保持模型困惑度和零样本准确率的同时，显著降低剪枝引起的偏见。总体而言，Debias-SparseGPT在提高模型公平性的同时，保持了稀疏模型的计算效率。'}}}, {'id': 'https://huggingface.co/papers/2608.30322', 'title': 'Ignorance or Incompetence? Constructing Knowledge-Gated, Verifiable Tasks for LLM Agents', 'url': 'https://huggingface.co/papers/2608.30322', 'abstract': 'Abstract A protocol separates task instructions from private convention artefacts to explicitly test agent dependence on hidden knowledge, validated by calibration tasks showing near-zero performance without access.  Generated by thinkingmachines/Inkling-Small Professional agent tasks often depend on conventions that are absent from public corpora, yet benchmarks rarely control whether an agent has access to those conventions. We introduce a knowledge-gated task-construction protocol that separates a task instruction from a compact artefact containing private conventions, reference tables, and utility operators. Construction-time provenance, byte-identical task instructions across the provided- and withheld-artefact conditions, leak audits, and executable witnesses make dependence on the artefact explicit and testable. Across fifteen calibration tasks, one frontier agent configuration achieves a 68.0% pass rate with the artefact and 0% without it; on one task, a plausible but incorrect artefact also yields 0% across five trials. Deterministic solvers and rule corpora provide exact ground truth for structured tasks, while named criterion-level rubrics support outputs that cannot be checked by a single executable oracle. A configuration-relative calibration screen retains seven tasks satisfying our five-trial empirical knowledge-gating screen. These experiments validate the behavior of the construction protocol; they do not establish that the retained tasks improve post-training. We publicly release part of the task suite and supporting tooling at https://github.com/DatagridsAI/Knowledge-Gated-Task-Construction.', 'score': 2, 'issue_id': 3210, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'fe20f460683e3b48', 'authors': ['Hanlin Tian', 'Minhao Li', 'Yu Mi', 'Sihan Zhu', 'Zhao Yang', 'Yuxiang Wang', 'Hongquan Zhu', 'Qiufei Hu'], 'affiliations': ['DataGrids', 'East China Normal University', 'Nanyang Technological University', 'Northwestern Polytechnical University', 'Peking University', 'Shanghai University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30322.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#agents'], 'emoji': '🔐', 'ru': {'title': 'Отделение явного знания от скрытых конвенций в тестировании агентов', 'desc': 'В статье предложен протокол для создания задач, который отделяет инструкции от скрытых артефактов, содержащих конвенции и справочные таблицы, чтобы явно тестировать зависимость агента от этих знаний. Авторы показали, что передовые модели достигают 68% точности с доступом к артефактам и 0% без них, что подтверждает правильность разделения. Протокол включает проверку утечек информации, детерминированные решатели и рубрики для оценки, позволяя точно контролировать, какое скрытое знание использует агент. Исследование демонстрирует, что существующие бенчмарки часто не контролируют доступ агентов к приватным конвенциям, скрытым в тренировочных данных.'}, 'en': {'title': 'Unlocking Agent Performance: The Role of Hidden Knowledge', 'desc': "This paper presents a new protocol for constructing tasks that distinguishes between task instructions and private conventions, which are often hidden from agents. The authors demonstrate that agents can perform poorly when they lack access to these hidden conventions, as shown by calibration tasks where performance dropped to near-zero without the artefact. The proposed knowledge-gated task-construction protocol allows for explicit testing of an agent's dependence on these conventions through controlled experiments. The results indicate that while some agents can succeed with the artefact, they fail completely without it, highlighting the importance of hidden knowledge in agent performance."}, 'zh': {'title': '揭示智能体对隐藏知识的依赖性', 'desc': '这篇论文提出了一种知识门控任务构建协议，旨在测试智能体对隐藏知识的依赖性。通过将任务指令与包含私有约定的紧凑工件分离，研究人员能够明确验证智能体在没有访问这些约定时的表现。实验结果显示，在十五个校准任务中，某个智能体配置在有工件的情况下通过率为68.0%，而在没有工件的情况下则为0%。这表明，私有约定对智能体的任务执行能力有显著影响。'}}}, {'id': 'https://huggingface.co/papers/2608.29692', 'title': 'Portfolio Risk Bounds without Cross-Asset Return Covariances: Distributional Fields from Language-Model Representations', 'url': 'https://huggingface.co/papers/2608.29692', 'abstract': 'Abstract A framework using distribution-valued firm characteristics and embedding-based representations provides computable upper bounds on portfolio variance and yields low-variance allocations without cross-asset covariance estimates.  Generated by thinkingmachines/Inkling-Small Portfolio risk assessment ordinarily relies on reliable estimates of cross-asset return covariances, which are difficult to obtain in short, high-dimensional panels. We show that firm-level distribution-valued characteristics can instead provide one-sided certificates of portfolio risk. Under maintained links from characteristics to systematic exposures and from exposures to returns, multi-firm Wasserstein-2 dispersion yields a sharp upper bound on systematic portfolio variance and a corresponding bound for standardized returns. A weighted pairwise relaxation produces an objective that is convex under a checkable condition and requires marginal volatility scales but no cross-asset return covariances. With zero firm-specific slack, the common-map scale changes the certified variance reduction but not the normalized allocation, which depends only on observed information geometry. In a 52-firm panel from 2018-2022, an allocation constructed from Qwen3-Embedding-8B news representations lies between the 0.69th and 1.33rd in-sample variance percentiles across four prespecified capped portfolio populations; equal risk weighting lies between the 21.1st and 28.6th percentiles. The lower in-sample variance ranking relative to equal risk also appears across the reported frozen language-model representations. The framework therefore distribution-valued firm information into a coherent risk bound and an implementable allocation rule constructed without cross-asset return covariances.', 'score': 0, 'issue_id': 3210, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '62d060ee26cafbf8', 'authors': ['Marcus Gawronsky', 'Chun-Sung Huang'], 'affiliations': ['University of Cape Town'], 'pdf_title_img': 'assets/pdf/title_img/2608.29692.jpg', 'data': {'categories': [], 'emoji': '📊', 'ru': {'title': 'Оценка риска портфеля через характеристики компаний без кросс-ковариаций', 'desc': 'В работе предложена методика оценки риска портфеля, которая использует распределяющие характеристики фирм и эмбеддинги на основе встраиваемых представлений. Авторы показывают, что вместо сложных в получении оценок ковариации между активами можно использовать расстояния Вассерштейна между распределениями характеристик компаний для вычисления верхних оценок дисперсии портфеля. Оптимизационная задача сформулирована как выпуклая программа, которая требует только маргинальные волатильности активов, но не требует кросс-корреляции доходностей. На реальных данных портфель, построенный на основе эмбеддингов новостей, показывает значительно более низкую дисперсию, чем равновзвешенный портфель.'}, 'en': {'title': 'Revolutionizing Portfolio Risk with Distribution-Valued Firm Characteristics', 'desc': 'This paper presents a new framework for portfolio risk assessment that uses distribution-valued characteristics of firms instead of traditional cross-asset covariance estimates. By leveraging embedding-based representations, the authors derive computable upper bounds on portfolio variance, allowing for low-variance allocations. The approach utilizes multi-firm Wasserstein-2 dispersion to establish a sharp upper bound on systematic portfolio variance, which is crucial for effective risk management. The results demonstrate that this method can yield better variance rankings compared to equal risk weighting, showcasing its practical applicability in high-dimensional financial settings.'}, 'zh': {'title': '利用分布值特征优化投资组合风险', 'desc': '本文提出了一种利用分布值公司特征和嵌入式表示的框架，能够在没有跨资产协方差估计的情况下，提供可计算的投资组合方差上限，并实现低方差配置。传统的投资组合风险评估依赖于可靠的跨资产收益协方差估计，但在短期高维数据中，这些估计往往难以获得。我们展示了公司级的分布值特征可以提供投资组合风险的一侧证书，并通过多公司Wasserstein-2散布来获得系统投资组合方差的严格上限。该框架将分布值公司信息转化为一致的风险界限和可实施的配置规则，避免了对跨资产收益协方差的依赖。'}}}, {'id': 'https://huggingface.co/papers/2608.29669', 'title': 'Wasserstein-Barycentric Interaction Fields for Spatial Factor Models: Evidence from Language-Model Representations', 'url': 'https://huggingface.co/papers/2608.29669', 'abstract': "Abstract A language-model embedding field reconstructed via Wasserstein barycenters predicts peer-misalignment penalties more accurately than conventional weighting schemes.  Generated by thinkingmachines/Inkling-Small Spatial return models take the interaction matrix as given and leave feedback uninterpreted. We construct a bandwidth-free field from firms' language-model article embedding distributions using target-anchored Wasserstein barycentric reconstruction. A quadratic exposure-adjustment problem maps feedback into a peer-misalignment penalty ratio. For 52 firms, the field, frozen from 2018-2022 news, yields a 2023-2026 penalty ratio of 3.46 (95% interval [2.89, 4.17]) and higher conditional quasi-likelihood than equal-weighted peer support or RBF weighting of the same distances. Joint penalty ratios for the barycentric and news co-mention fields are 2.33 and 0.86 with boundary calibrated tests which reject both exclusions.", 'score': 0, 'issue_id': 3210, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '55c16cf7c9091193', 'authors': ['Marcus Gawronsky', 'Chun-Sung Huang'], 'affiliations': ['University of Cape Town'], 'pdf_title_img': 'assets/pdf/title_img/2608.29669.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Барицентры Вассерштейна для точного прогнозирования рыночных несогласованностей', 'desc': 'Исследование предлагает новый метод реконструкции поля встраиваний языковой модели с помощью барицентров Вассерштейна для предсказания штрафов за несогласованность с коллегами. Авторы используют распределения встраиваний статей языковой модели от компаний и применяют методику целевого якорирования для создания непараметрического поля. Квадратичная задача оптимизации преобразует обратную связь в коэффициент штрафа за несогласованность. Предложенный подход демонстрирует превосходную предсказательную способность по сравнению с классическими схемами взвешивания и показывает статистически значимые результаты при перекрёстной валидации на данных 2023-2026 годов.'}, 'en': {'title': 'Revolutionizing Peer-Misalignment Prediction with Wasserstein Barycenters', 'desc': "This paper introduces a novel approach to predicting peer-misalignment penalties using a language-model embedding field reconstructed through Wasserstein barycenters. Unlike traditional weighting methods, this approach constructs a bandwidth-free field from firms' language-model article embeddings, allowing for more accurate predictions. The study demonstrates that the new model yields a significantly higher penalty ratio compared to equal-weighted peer support and radial basis function (RBF) weighting. The results indicate that the proposed method not only improves accuracy but also provides a robust framework for analyzing feedback in financial contexts."}, 'zh': {'title': '通过Wasserstein重心提升同行不对齐惩罚预测精度', 'desc': '本文提出了一种通过Wasserstein重心重构的语言模型嵌入场，能够比传统加权方案更准确地预测同行不对齐惩罚。我们利用目标锚定的Wasserstein重心重构，从公司的语言模型文章嵌入分布中构建了一个无带宽场。通过二次曝光调整问题，将反馈映射到同行不对齐惩罚比率。研究结果显示，在2018-2022年的新闻数据基础上，该模型在2023-2026年期间的惩罚比率为3.46，且具有更高的条件准似然性。'}}}, {'id': 'https://huggingface.co/papers/2609.01591', 'title': 'StudentSim: Training LLM-based Student Simulators', 'url': 'https://huggingface.co/papers/2609.01591', 'abstract': "Abstract StudentSim trains personalized student simulators from sparse data to mirror learner responses and adapt to tutor guidance, outperforming existing models across chess, writing, and math.  Generated by thinkingmachines/Inkling-Small AI tutors are most useful when they adapt to each student's strengths, weaknesses, and preferred guidance, but evidence about which guidance works for which student is sparse, slow, and costly to collect from real learners. Student simulators can provide this signal as a proxy, yet existing approaches are limited: state-tracking models fit student behavior but struggle to process explanations or corrections, while LLM role-play follows guidance fluently but does not reliably match the competence of the student being imitated. We present StudentSim, a training framework that turns sparse per-student data into individualized simulators through pooled training followed by per-student specialization. The resulting simulators both mirror a student's own responses and update them under tutor guidance. We also introduce StudentSimEval, a standardized protocol covering 60 students across chess, second-language English writing, and mathematics, using public learner datasets with de-identified records shared for research. StudentSimEval measures behavioral fidelity (F), or how well a simulator matches a student's responses, and guidance responsiveness (R), or how readily it updates under tutor guidance, with all methods fit and evaluated on the same records. Across all three domains, StudentSim outperforms GPT-5.4 on both metrics. In chess, StudentSim reaches F=0.51 and R=0.91, compared with 0.23 and 0.72 for GPT-5.4 and 0.45 and 0.27 for Maia2. As a proof of concept, using StudentSim as a reward model for tutor reinforcement learning produces a chess tutor that expert humans rate as more accurate, better-guided, and more personalized than a no-RL baseline and a tutor trained against a GPT-5.4 simulator reward. Code is available at https://github.com/microsoft/StudentSim.", 'score': 422, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': 'c861844d7bb953c1', 'authors': ['Ke Yang', 'Chenglong Wang', 'Michel Galley', 'Chandan Singh', 'Jeevana Priya Inala', 'ChengXiang Zhai', 'Jianfeng Gao'], 'affiliations': ['Microsoft Research', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.01591.jpg', 'data': {'categories': [], 'emoji': '👨\u200d🎓', 'ru': {'title': 'Персонализированный симулятор студента для адаптивного обучения', 'desc': 'StudentSim — это фреймворк для обучения персонализированных симуляторов студентов на основе ограниченных данных, которые воспроизводят реакции учащихся и адаптируются к рекомендациям репетитора. Исследователи использовали трансфер-лёрнинг с предварительной подготовкой на объединённых данных, а затем тонкую настройку для каждого студента. Авторы представили стандартизированный набор для оценки StudentSimEval, охватывающий три домена (шахматы, английский язык и математика), измеряющий верность поведения и готовность к обновлению под влиянием инструкций. Эксперименты показали, что StudentSim превосходит большие языковые модели как по точности воспроизведения компетенций студента, так и по способности реагировать на коррекции репетитора.'}, 'en': {'title': 'Personalized Learning with StudentSim: Adapting to Every Learner', 'desc': 'StudentSim is a novel framework that creates personalized student simulators using limited data to accurately reflect learner responses and adapt to tutor guidance. It addresses the challenges of existing models by combining pooled training with individual specialization, allowing for better imitation of student behavior and responsiveness to guidance. The framework is evaluated through StudentSimEval, which assesses how well the simulators match actual student responses and how effectively they adapt to tutoring. Results show that StudentSim significantly outperforms previous models, demonstrating its effectiveness in educational applications across various subjects.'}, 'zh': {'title': '个性化学生模拟器的创新训练框架', 'desc': 'StudentSim 是一种个性化学生模拟器的训练框架，能够从稀疏数据中学习并模拟学生的反应，适应导师的指导。它通过汇总训练和个性化专门化，将每个学生的数据转化为个体化的模拟器。与现有模型相比，StudentSim 在国际象棋、写作和数学等领域的表现更为出色。该框架还引入了 StudentSimEval，一个标准化的评估协议，用于测量模拟器的行为忠实度和响应性。'}}}, {'id': 'https://huggingface.co/papers/2609.00111', 'title': 'Qwen-Drive-1.0: An Initial Step towards a Vision-Language Foundation Model for Autonomous Driving', 'url': 'https://huggingface.co/papers/2609.00111', 'abstract': "Abstract Qwen-Drive-1.0 is a vision-language foundation model for autonomous driving that unifies 3D perception, visual question answering, and motion planning via shared representations and staged training.  Generated by thinkingmachines/Inkling-Small We present Qwen-Drive-1.0, an initial step towards a vision-language foundation model for autonomous driving. Qwen-Drive-1.0 retains the architecture of the pretrained vision-language model (VLM) and integrates 3D perception, visual question answering, and motion planning within a unified framework. An external bird's-eye-view (BEV) perception head jointly performs 3D object detection, semantic occupancy prediction, and BEV map segmentation. It serves as a probe of the 3D information accessible from the shared representations and provides an explicit, inspectable interface to 3D scene structure. A Planning Expert conditions on shared VLM representations to generate future ego trajectories. A staged training recipe combines driving supervision with general-purpose vision-language data to acquire driving-specific competence while helping preserve broad visual understanding and instruction-following capabilities. Experiments demonstrate strong 3D perception and driving scene understanding while largely preserving general vision-language capability. Comprehensive evaluations across open-loop, pseudo-closed-loop, and closed-loop settings further show highly competitive motion-planning performance.", 'score': 336, 'issue_id': 3202, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '43763d4b3151ee4c', 'authors': ['Xin Zhou', 'Zongchuang Zhao', 'Zhibo Yang', 'Mingsheng Li', 'Humen Zhong', 'Shuai Bai', 'Du Chu', 'Ruizhe Chen', 'Zhaohai Li', 'Jun Tang', 'Qiuyue Wang', 'Mingkun Yang', 'Jiazhao Zhang', 'Dayiheng Liu', 'Dingkang Liang', 'Xiang Bai'], 'affiliations': ['Qwen Team'], 'pdf_title_img': 'assets/pdf/title_img/2609.00111.jpg', 'data': {'categories': ['#multimodal', '#3d', '#robotics', '#cv', '#open_source', '#training', '#architecture'], 'emoji': '🚗', 'ru': {'title': 'Единая модель для автономного вождения через унифицированные представления', 'desc': 'Qwen-Drive-1.0 — это унифицированная модель зрения и языка для автономного вождения, которая интегрирует 3D восприятие, ответы на визуальные вопросы и планирование движения через общие представления. Модель использует предварительно обученную архитектуру VLM и добавляет специальный модуль восприятия с представлением в системе координат птичьего полёта, который выполняет детекцию объектов, предсказание семантической занятости и сегментацию карты. Планировщик движения на основе общих представлений модели генерирует траектории движения автомобиля в будущем. Стратегия поэтапного обучения комбинирует данные с разметкой дорожного поведения с универсальными данными о видении и языке, сохраняя способность модели к общему пониманию визуального контента и следованию инструкциям.'}, 'en': {'title': 'Unified Vision-Language Model for Autonomous Driving', 'desc': "Qwen-Drive-1.0 is a vision-language foundation model designed for autonomous driving, integrating 3D perception, visual question answering, and motion planning into a single framework. It utilizes a bird's-eye-view (BEV) perception head for tasks like 3D object detection and semantic segmentation, allowing for a clear understanding of the 3D environment. The model employs a staged training approach that combines driving-specific supervision with general vision-language data, enhancing its ability to understand driving scenarios while maintaining broad visual capabilities. Experimental results indicate that Qwen-Drive-1.0 excels in 3D perception and motion planning, demonstrating strong performance across various evaluation settings."}, 'zh': {'title': '统一3D感知与运动规划的自动驾驶模型', 'desc': 'Qwen-Drive-1.0 是一个用于自动驾驶的视觉-语言基础模型，它通过共享表示和分阶段训练，统一了3D感知、视觉问答和运动规划。该模型保留了预训练视觉-语言模型的架构，并在一个统一的框架内整合了多种功能。它的外部鸟瞰视图（BEV）感知头可以同时进行3D物体检测、语义占用预测和BEV地图分割。实验结果表明，该模型在3D感知和驾驶场景理解方面表现出色，同时保持了广泛的视觉-语言能力。'}}}, {'id': 'https://huggingface.co/papers/2609.01343', 'title': 'SMELT: Scaling Laws for Compute-Matched MoE Looped Transformers', 'url': 'https://huggingface.co/papers/2609.01343', 'abstract': "Abstract Looping middle layers in sparse Mixture-of-Experts Transformers improves training efficiency and downstream performance while matching per-token FLOPs, parameters, and cache budgets.  Generated by thinkingmachines/Inkling-Small Looped Transformers increase effective depth by iterating a shared block of layers, but most evaluations compare at fixed model size, conflating architectural advantage with extra FLOPs. We study looping on Mixture-of-Experts Transformers while closely matching per-token FLOPs, total non-embedding parameters, and KV cache. Through a series of ablations, we arrive at a recipe we call SMELT (Sparse MoE Transformer, middle layers Loop Twice), which loops the middle half of layers twice while matching the unlooped Baseline on all three budgets. We scale SMELT across four sizes up to 54B non-embedding parameters and fit a separate Chinchilla-style scaling law for each architecture. SMELT's loss drops faster with compute, saving 6.8--18.0\\% of training FLOPs on the compute-optimal frontier. The advantage transfers to downstream benchmarks beyond what validation loss predicts, is largest on Code, and grows with sample length and the number of in-context examples. Mechanistic analysis shows that the second visit reduces the attention sink and redirects mass toward content-relevant tokens, an inductive bias that may underlie the observed performance gains. These results show that looping can improve Transformers even under budget matching, offering a practical recipe that turns depth reuse into measurable gains.", 'score': 69, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '88f07ef2fd3bac2d', 'authors': ['Shaowen Wang', 'Ge Zhang', 'Kairong Luo', 'Yuhao Wu', 'Shaofan Liu', 'Jiaheng Liu', 'Wenhao Huang', 'Shen Yan', 'Jian Li'], 'affiliations': ['ByteDance Seed', 'M-A-P', 'TokenWave.AI', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01343.jpg', 'data': {'categories': ['#optimization'], 'emoji': '🔄', 'ru': {'title': 'Повторное использование глубины слоёв для эффективной масштабируемости Трансформеров', 'desc': 'В статье исследуется техника повторного использования слоёв (looping) в разреженных Трансформерах с Mixture-of-Experts архитектурой для улучшения эффективности обучения. Авторы предлагают SMELT — метод, который дважды проходит через средние слои модели, при этом сохраняя одинаковое количество вычислений (FLOPs), параметров и объём кеша ключей-значений с базовой моделью. Экспериментальные результаты показывают, что SMELT позволяет экономить 6.8–18.0% вычислений на оптимальной граничной кривой и демонстрирует значительный прирост производительности на задачах с кодом и длинными последовательностями. Анализ механизмов работы выявляет, что второе прохождение через слои уменьшает эффект внимания к началу последовательности и перенаправляет внимание на содержательно релевантные токены.'}, 'en': {'title': 'Looping Layers for Enhanced Transformer Performance', 'desc': "This paper introduces a method called SMELT (Sparse MoE Transformer, middle layers Loop Twice) that enhances the training efficiency and performance of Mixture-of-Experts Transformers by looping the middle layers. By iterating a shared block of layers, SMELT maintains the same computational budget while effectively increasing the model's depth. The authors demonstrate that this approach leads to faster loss reduction during training and improved performance on various downstream tasks, particularly in code-related benchmarks. Mechanistic analysis reveals that the looping process helps focus attention on relevant tokens, contributing to the observed performance improvements."}, 'zh': {'title': '循环中间层，提升Transformer性能！', 'desc': '这篇论文探讨了在稀疏混合专家Transformer中循环中间层的效果，能够提高训练效率和下游性能，同时保持每个token的计算量、参数和缓存预算一致。研究提出了一种名为SMELT的方案，通过将中间一半的层循环两次，来匹配未循环基线的预算。实验结果表明，SMELT在计算资源最优的情况下，训练所需的计算量减少了6.8%到18.0%。此外，循环的机制分析显示，第二次访问可以减少注意力的集中，重新引导注意力到与内容相关的token上，从而提升模型性能。'}}}, {'id': 'https://huggingface.co/papers/2609.00028', 'title': 'UI-Venus-2 Technical Report', 'url': 'https://huggingface.co/papers/2609.00028', 'abstract': 'Abstract UI-Venus-2 is a general-purpose multimodal GUI agent that uses unified reasoning-action loops, expanded environment coverage, and robust verification to enable reliable real-world digital automation.  Generated by thinkingmachines/Inkling-Small Multimodal GUI agents have emerged as a promising paradigm for digital task automation, yet transitioning from benchmark-oriented models to dependable real-world applications remains challenging due to limited environment coverage, brittle task construction, and unreliable reward verification. In this work, we present UI-Venus-2, a general-purpose foundation GUI agent designed to operate across mobile, web, and desktop environments through a unified closed-loop reasoning-action framework. To bridge the gap toward practical deployment, we jointly scale three critical dimensions: (1) Environments, expanding coverage to more than 170 multilingual mobile apps and native desktop operating systems; (2) Tasks, employing a deep-research pipeline for function-grounded instruction generation; and (3) Verification, adopting trace-level and sample-level evaluators with visual keypoints and multi-model voting to ensure reliable RL signals for training. Furthermore, we integrate safety-aware mechanisms to ensure controlled execution of consequential actions. By offering a capable, efficient, and open-source foundation, UI-Venus-2 advances the field toward more generalizable, verifiable, and self-reflective agents for real-world applications.', 'score': 54, 'issue_id': 3202, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '5c28802c4e3de181', 'authors': ['Venus Team', 'Zhuohan Cai', 'Haoxing Chen', 'Jiaxuan Chen', 'Weizhi Chen', 'Changlong Gao', 'Zhangxuan Gu', 'Yuan Guo', 'Yusong Hu', 'Jianrong Jiang', 'Jianguo Li', 'Runze Li', 'Jinzhen Lin', 'Zhenyu Ma', 'Changhua Meng', 'Han Peng', 'Xinyu Qiu', 'Shuheng Shen', 'Zhongyi Shui', 'Weiqiang Wang', 'Ming Wen', 'Zhuoer Xu', 'Hang Yan', 'Kaiwen Yang', 'Ruilin Yao', 'Nanjun Yu', 'Zhengwen Zeng', 'Lianrui Zhang', 'Yunzhu Zhang', 'Zhe Zhao', 'Beitong Zhou'], 'affiliations': ['Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.00028.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#agents', '#benchmark', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Универсальный UI-агент для надёжной автоматизации цифровых процессов', 'desc': 'UI-Venus-2 представляет собой многомодальный AI агент, который автоматизирует задачи на цифровых интерфейсах через единую систему рассуждения и действий. Система охватывает более 170 приложений и операционных систем, работая с мобильными, веб и десктопными платформами одновременно. Авторы решили критические проблемы надёжности, масштабируя три направления: разнообразие окружений, качество генерации задач и точность верификации результатов с использованием визуальных ориентиров и ансамблевого голосования моделей. Встроенные механизмы безопасности обеспечивают контролируемое выполнение чувствительных операций для практического применения.'}, 'en': {'title': 'Empowering Reliable Digital Automation with UI-Venus-2', 'desc': 'UI-Venus-2 is a versatile multimodal GUI agent designed for automating digital tasks across various platforms like mobile, web, and desktop. It utilizes a unified reasoning-action loop to enhance its operational reliability in real-world scenarios. The agent expands its capabilities by covering over 170 multilingual applications and employing advanced methods for generating task instructions. Additionally, it incorporates robust verification techniques to ensure the accuracy of its actions, making it a significant step towards dependable automation solutions.'}, 'zh': {'title': 'UI-Venus-2：通用的多模态自动化代理', 'desc': 'UI-Venus-2 是一种通用的多模态图形用户界面（GUI）代理，旨在通过统一的推理-行动循环、扩展的环境覆盖和稳健的验证来实现可靠的数字自动化。该代理能够在移动、网络和桌面环境中操作，解决了从基准模型到实际应用的转变难题。它通过扩展覆盖超过170种多语言移动应用和本地桌面操作系统，采用深度研究管道生成功能基础的指令，并使用视觉关键点和多模型投票的验证机制，确保训练的可靠性。UI-Venus-2 提供了一个高效、开源的基础，推动了更具通用性、可验证性和自我反思能力的代理的发展。'}}}, {'id': 'https://huggingface.co/papers/2609.01560', 'title': 'H3-World: Turning Language Understanding into World Control', 'url': 'https://huggingface.co/papers/2609.01560', 'abstract': 'Abstract  We present H3-World, an efficient framework that turns the 33B MiniMax-H3 video generator into an interactive world model. Our key finding is that, as large video generators become more capable, language is emerging as a natural interface for control. MiniMax-H3, for example, already supports zero-shot control of character behavior and camera motion through natural-language instructions. Building on this, H3-World turns this coarse language interface into precise, temporally grounded world control, without introducing dedicated action modules. Specifically, we represent each action as a structured combination of character and camera instructions, and align them with the corresponding temporal video latents. To make the control temporally precise, we further introduce temporal attention routing, which restricts each instruction to its intended time interval and reduces control leakage across actions. Importantly, H3-World directly reuses the semantic representations learned during large-scale video pretraining and requires only lightweight adaptation. With only 8,000 gameplay samples, 10,000 LoRA optimization steps, and 0.199% trainable parameters, H3-World achieves effective character and camera control while preserving strong generation quality. It also generalizes to unseen scenarios. These results show that the control capabilities emerging in large video generators can be efficiently transformed into interactive world control.', 'score': 41, 'issue_id': 3202, 'pub_date': '2026-09-01', 'pub_date_card': {'ru': '1 сентября', 'en': 'September 1', 'zh': '9月1日'}, 'hash': '9f1db4a5061b2081', 'authors': ['Danze Chen', 'Zeqing Wang', 'Ziyue Lin', 'Xingyi Yang', 'Yeying Jin'], 'affiliations': ['National University of Singapore', 'Tencent', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2609.01560.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Язык как естественный интерфейс управления в видеогенераторах', 'desc': 'Авторы представляют H3-World — эффективную систему, которая преобразует видеогенератор MiniMax-H3 в интерактивную модель мира. Ключевое открытие заключается в том, что естественный язык становится удобным интерфейсом управления видеогенератором, позволяя контролировать поведение персонажей и движение камеры через текстовые инструкции. Система представляет каждое действие как структурированную комбинацию команд для персонажей и камеры, выравнивая их с временными представлениями видео и используя механизм temporal attention routing для точного управления во времени. Благодаря переносу обучения и LoRA, H3-World достигает эффективного управления с использованием только 0.199% обучаемых параметров и обобщается на новые сценарии.'}, 'en': {'title': 'Transforming Video Generation into Interactive Control with H3-World', 'desc': 'H3-World is a new framework that enhances the MiniMax-H3 video generator, allowing it to function as an interactive world model. The study reveals that as video generators improve, using natural language for control becomes more effective. H3-World enables precise control of character actions and camera movements by structuring these commands and aligning them with specific video moments. This approach requires minimal additional training and demonstrates strong performance even in new scenarios, showcasing the potential of large video models for interactive applications.'}, 'zh': {'title': '将语言转化为互动世界控制的高效框架', 'desc': 'H3-World是一个高效的框架，将33B MiniMax-H3视频生成器转变为一个互动世界模型。研究发现，随着大型视频生成器能力的提升，语言逐渐成为控制的自然接口。H3-World通过将粗略的语言接口转化为精确的时间基础世界控制，避免了引入专用的动作模块。该框架利用大规模视频预训练中学习到的语义表示，仅需轻量级的适应，就能实现有效的角色和相机控制，同时保持强大的生成质量。'}}}, {'id': 'https://huggingface.co/papers/2609.00188', 'title': 'ZimaBlue: Evolving Generalizable World Action Models through Scalable Video Pre-training', 'url': 'https://huggingface.co/papers/2609.00188', 'abstract': 'Abstract ZimaBlue learns generalizable worl
