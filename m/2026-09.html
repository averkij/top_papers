: 'RealSWE: A Compositional Evaluation of Coding Agents under Realistic User Requests', 'url': 'https://huggingface.co/papers/2608.27831', 'abstract': "Abstract Real-world coding requests are shorter and more casual than benchmark tasks, and explicitly stating desired behavior and motivation improves LLM software engineering performance.  Generated by thinkingmachines/Inkling-Small Coding agents are now commonly evaluated on the SWE-bench family of benchmarks, whose tasks are built from curated GitHub issues: long, structured, and information-rich. Real user requests, however, are typically far shorter and less structured. To characterize this gap, we define a six-category information taxonomy and four dimensions of linguistic style, and apply them to real user prompts from SWE-chat and problem statements from SWE-bench Verified and Pro. We find that requests carrying only a problem statement, alone or with limited additional context, account for 88% of real prompts but just 7% of benchmark problems. Furthermore, 87% of real prompts are casually written whereas 94% of benchmark problems are formal. Guided by these observations, we introduce RealSWE, 381 multi-variant task families derived from SWE-bench Verified and Pro. Variants within each family share the same underlying task and gold patch while differing only in information composition and linguistic style. Evaluating seven contemporary LLMs with RealSWE, we find that i) realistic inputs reduce resolution rates by 6.4 pp on average and can change model rankings. Controlled analysis further shows that ii) including Desired Behavior and Motivation significantly affects performance, whereas Environment Information and Reproduction Steps merely add tokens without measurable benefit; iii) linguistic style has only small, model-dependent effects. These findings provide actionable guidance for users and agents: explicitly stating the desired behavior and motivation, which most real prompts omit, substantially improves the LLM's software engineering performance.", 'score': 16, 'issue_id': 3215, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '837cb6a54d2646b1', 'authors': ['Gyuhyeong Kim', 'Hyojung Gwon', 'Jeonghyeon Kim', 'Kyuhong Shim', 'Sunjae Lee'], 'affiliations': ['Sungkyunkwan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.27831.jpg', 'data': {'categories': ['#plp', '#dataset', '#benchmark'], 'emoji': '🔧', 'ru': {'title': 'Разговорный тон и явные цели улучшают понимание LLM в разработке кода', 'desc': 'В статье исследуется разрыв между реальными запросами пользователей и эталонными задачами в оценке LLM для разработки программного обеспечения. Авторы провели анализ текстов реальных запросов из SWE-chat и обнаружили, что они значительно короче и менее структурированы, чем задачи из SWE-bench: 88% реальных запросов содержат только описание проблемы, а 87% написаны в casual стиле. Для изучения влияния структуры и стиля текста на производительность, исследователи создали RealSWE — набор из 381 семейства задач с контролируемыми вариациями информационного содержания и лингвистического стиля. Эксперименты показали, что включение явного описания желаемого поведения и мотивации значительно улучшает производительность LLM, в то время как другие элементы информации имеют незначительный эффект.'}, 'en': {'title': 'Bridging the Gap: Real Requests vs. Benchmark Tasks in LLM Performance', 'desc': 'This paper highlights the difference between real-world coding requests and traditional benchmark tasks used to evaluate coding agents. It identifies that real user requests are often shorter, less structured, and more casual compared to the long and formal tasks found in benchmarks like SWE-bench. The authors introduce RealSWE, a new set of tasks that mimic real user prompts, showing that including explicit desired behavior and motivation can significantly enhance the performance of large language models (LLMs) in software engineering tasks. The study reveals that most real prompts lack detailed context, which impacts the effectiveness of LLMs, suggesting that clearer communication can lead to better outcomes.'}, 'zh': {'title': '明确期望，提升编码表现', 'desc': '这篇论文探讨了现实世界中的编码请求与基准任务之间的差异。研究发现，真实用户的请求通常更短、更随意，而基准任务则较长且结构化。通过定义信息分类和语言风格的维度，作者分析了真实请求与基准问题的不同。结果表明，明确表达期望行为和动机可以显著提高大型语言模型在软件工程中的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.03952', 'title': 'WorldReward: Reward Modeling for Camera-Conditioned World Models', 'url': 'https://huggingface.co/papers/2609.03952', 'abstract': 'Abstract WorldReward is a vision-language reward model that evaluates camera-conditioned world models by aligning video chunks with actions and aggregating preferences for both execution consistency and visual quality.  Generated by thinkingmachines/Inkling-Small Camera-conditioned world models generate interactive videos in which commanded actions should induce the expected scene changes while appearance, geometry, and temporal dynamics remain coherent. Existing rewards assess these requirements separately: geometry-based rewards estimate trajectory execution but cannot judge the visual quality of the executed motion, whereas image-based rewards measure frame quality without capturing action execution or temporal dynamics. We posit that a vision-language model (VLM) offers a shared reasoning space for relating actions to their visual outcomes. However, judging a complete long video against its full action sequence creates a lengthy, noisy context in which short-lived local action evidence can be missed or diluted. We present WorldReward, a VLM-based pairwise preference reward model that unifies action-consistency and visual-quality evaluation for camera-conditioned world models. WorldReward decomposes paired videos into action-aligned chunks, organizes each chunk into structured visual evidence, and aggregates chunk-level decisions by voting into separate video-level action and visual-quality preferences. To train it, we construct a large-scale reasoning-augmented preference dataset using structured judgments generated by a frontier VLM and refined through tool-based agent auditing and targeted human review. We further introduce WorldReward-Bench, a human-annotated benchmark measuring reward-model agreement with human preferences across action consistency, appearance quality, and motion quality. WorldReward achieves the highest agreement on all three dimensions, exceeding GPT-5.5 by 3.42, 1.45, and 3.56 percentage points, respectively. When used for RL post-training of HY-WorldPlay 1.5, it consistently improves both action execution and visual quality across short- to long-term horizons.', 'score': 15, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'c0f0fa6561995052', 'authors': ['Yibin Wang', 'Zehan Wang', 'Junshu Tang', 'Zhimin Li', 'Yujie Zhou', 'Jiazi Bu', 'Pengyang Ling', 'Feng Han', 'Zhixiong Zhang', 'Long Xing', 'Shengyuan Ding', 'Ziang Li', 'Cheng Jin', 'Yuhang Zang', 'Jiaqi Wang', 'Tianyu Pang'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2609.03952.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#rl', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Единая система оценки действий и визуального качества в генеративных видеомоделях', 'desc': 'WorldReward — это модель вознаграждения на основе vision-language model, которая оценивает мировые модели, обусловленные камерой, путём выравнивания видеофрагментов с действиями. Модель разбивает видео на короткие сегменты, выровненные по действиям, и структурирует визуальные признаки для каждого фрагмента. Система использует голосование на уровне фрагментов для агрегирования предпочтений относительно согласованности действий и визуального качества в целом видео. Исследователи создали большой датасет предпочтений с аннотациями VLM и человеческой проверкой, достигнув лучшего согласия с человеческими предпочтениями по всем трём метрикам качества.'}, 'en': {'title': 'Unifying Action and Visual Quality in Video Evaluation', 'desc': 'WorldReward is a novel vision-language reward model designed to evaluate camera-conditioned world models by aligning video segments with corresponding actions. It addresses the limitations of existing reward systems that separately assess geometric execution and visual quality, by integrating both aspects into a unified framework. The model decomposes videos into action-aligned chunks, allowing for structured evaluation of visual evidence and preferences. By leveraging a large-scale preference dataset and a benchmark for human agreement, WorldReward demonstrates superior performance in enhancing action execution and visual quality in reinforcement learning scenarios.'}, 'zh': {'title': '统一动作一致性与视觉质量的奖励模型', 'desc': 'WorldReward是一种视觉-语言奖励模型，用于评估基于相机的世界模型，通过将视频片段与动作对齐，并聚合执行一致性和视觉质量的偏好来实现。现有的奖励机制通常分别评估几何和图像质量，而WorldReward则通过将视频分解为与动作对齐的片段，统一了这两种评估。该模型利用视觉-语言模型（VLM）提供的共享推理空间，能够更好地关联动作与其视觉结果。通过构建大规模的偏好数据集和引入WorldReward-Bench基准，WorldReward在动作一致性、外观质量和运动质量方面都达到了最高的与人类偏好的一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.04173', 'title': 'Last Translation Benchmark', 'url': 'https://huggingface.co/papers/2609.04173', 'abstract': 'Abstract The Last Translation Benchmark introduces peer-reviewed, multimodal examples that break leading translation models alongside handcrafted verification rules for reliable, actionable evaluation.  Generated by thinkingmachines/Inkling-Small For scientific progress, we need benchmarks that test the limits of state-of-the-art models, and evaluation methods that inform us about failure cases. As models get stronger, standard benchmarks for machine translation are approaching saturation. Further, automatic translation metrics are unreliable, vulnerable to reward-hacking, and provide unactionable assessments. Even gold human evaluation is not problem-free, because it often lacks reproducibility, objectivity, and scalability. Overall, this prevents us from tracking objective progress in the field and identifying pathways for improvement. We introduce the Last Translation Benchmark, a collection of human-authored and peer-reviewed examples (texts, images, audio, videos) that break leading machine translation models. We also present a new evaluation approach: each example comes with handcrafted verification rules describing concrete failure cases on that example, therefore allowing reliable and actionable future evaluation. The Last Translation Benchmark is a live dataset that accepts ongoing contributions. The latest version is LTBv1, containing accepted contributions prior to September 1st 2026, with future releases planned as new data is continuously collected.', 'score': 14, 'issue_id': 3218, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '63691d2b9fd30281', 'authors': ['Vilém Zouhar', 'Niyati Bafna', 'Mukund Choudhary', 'Maike Züfle', 'Sara Rajaee', 'Pinzhen Chen', 'Jannis Vamvas', 'Sara Papi', 'Ona de Gibert', 'Bhavitvya Malik', 'Eliya Habba', 'Orfeas Menis Mastromichalakis', 'Patrícia Schmidtová', 'Michelle Wastl', 'Sheriff Issaka', 'Leshem Choshen', 'Stella Biderman', 'Antonis Anastasopoulos', 'Jan Niehues', 'Rico Sennrich', 'Mrinmaya Sachan', 'Ondřej Bojar', 'Kenton Murray', 'Jörg Tiedemann', 'Alham Fikri Aji', 'Philipp Koehn', 'Christof Monz', 'Alexandra Birch', 'Sowmya Vajjala', 'Chalamalasetti Kranti', 'Cristina España-Bonet', 'Nobin Sarwar', 'David Kaczér', 'Shunta Asano', 'Malik Marmonier', 'Daban Q. Jaff', 'Vaisakhi Mishra', 'Hend Al- Khalifa', 'Gabriele Sarti', 'Sourajit Saha', 'Nils Rehlinger', 'Juan Daniel Cuervo Villa', 'Jonathan Tonglet', 'Saugata Purkayastha', 'Dominik Macháček', 'Jagannathan Ramanujam', 'Heejin Do', 'Zuzana Nadova', 'Fred Philippy', 'Fabian Retkowski', 'Maria Lymperaiou', 'Silvia Casola', 'Hanna Yukhymenko', 'Shubhashis Roy Dipta', 'Sangwon Ryu', 'Andrés Jerez', 'Ron Keinan', 'Shuaib Shuaib Yusuf', 'Avantica Vempati', 'Maria Carmen Staiano', 'Sukannya Purkayastha', 'Adrian Cosma', 'Vitalii Babenko', 'Erivan Inan', 'Aviral Nigam', 'Wafa Aissa', 'Fatima Haouari', 'Venkata Prasanth Kumar Gummadi', 'Mehdi Jafarzadeh', 'Valentin Scourneau', 'Lukas Edman', 'Kaiser Sun', 'Shaomu Tan', 'Mohammad Sadegh Gholizadeh', 'Johannes-Rudolf David', 'Dipankar Srirag', 'Javier García Gilabert', 'Ruta Binkyte', 'Manar Ali', 'Ana-Maria Bucur', 'Sabry E. Farrag', 'Youssef Saber', 'Yihong Liu', 'Jean Maillard', 'Cojocaru Nicoleta', 'Xiaochuang Yuan', 'Sina Ahmadi', 'Philipp Mondorf', 'Kaustubh Dhole', 'Roman Wixinger', 'Shenbin Qian', 'Manuel Tuor', 'Sergey Troshin', 'Jonathan Yahav', 'Fida Mohammad Thoker', 'Amir Arsalan Rezapour', 'Lance Calvin Lim Gamboa', 'Manon Reusens', 'Kätriin Kukk', 'Koel Dutta Chowdhury', 'Giuseppe Gallipoli', 'Christian Hoang', 'Shaswati Saha', 'Seth Aycock', 'Jan Kocoń', 'Bo Chen', 'Linh Vu', 'Vatsal Venkatkrishna', 'Arafat Ahsan', 'Luan Thanh Nguyen', 'Hassan Soliman', 'Daryna Dementieva', 'Theresia Veronika Rampisela', 'Ngoc Quynh Tram Do', 'Marius Huber', 'Kazuki Egashira', 'Azmine Toushik Wasi', 'Vladislav Poritski', 'Mike Zhang', 'Deep Shah', 'Paul Gavrikov', 'Luis Frentzen Salim', 'David Africa', 'R. Damanhuri', 'Bello Umar Bello', 'Anumit Garg', 'Gengyu Rao', 'Pawan Sasanka Ammanamanchi', 'Kamile Dementaviciute', 'Andrianos Michail', 'L D M S Sai Teja', 'Dawei Zhu', 'Yi Fan', 'Wei Liu', 'Farhan Farsi', 'Elias Herranen', 'Sankalan Pal Chowdhury', 'Karen Sanchez', 'Farzad Shami', 'Ashok Urlana', 'Zimu Wang', 'Tomasz Limisiewicz', 'Priyaranjan Pattnayak', 'Marii Ojastu', 'Hongbin Na', 'Emilian Radoi', 'Chenyi Zhao', 'Carlos Hinojosa', 'Andrea Gregor de Varda', 'Zaid Alyafeai', 'Reem Alzahrani', 'Nehal Kathrotia', 'Alex Flückiger', 'Ulysses Sekai Tully Carr', 'Jimson Paulo Layacan', 'Guy Kaplan', 'Ritwik Tiwari', 'Rishit Dagli', 'Oksana Volchek', 'Isaac R Caswell', 'Bowen Yi', 'Blanka Kövér', 'Amir Hossein Yari', 'Aicha Chorana', 'Zhengxiang Wang', 'Selja Keränen', 'Samuel Simko', 'Joy Olusanya', 'Jenny Chim', 'Enzo Doyen', 'Vivek Harsha Lakkamaneni', 'Sophia Conrad', 'Pouya Sadeghi', 'Panayiotis Panayiotou', 'Luis Lara', 'Jannatul Nayem', 'Eran Yahav', 'Debanshu Das', 'Antonia Karamolegkou', 'Anmol Goel', 'Aishik Mandal', 'Tommaso Cerruti', 'Raoyuan Zhao', 'Mykola Haltiuk', 'Thura Aung', 'Naser Almousa', 'Amir Hossein Kargaran', 'Rachel Bawden', 'Qiaoyuan Zheng', 'Mateusz Lango', 'Beni Egressy', 'Fidel Rodríguez Velásquez', 'Natchapon Jongwiriyanurak', 'Minh Ngoc Do', 'Marco Gaido', 'Lena Libon', 'Dzmitry Kuzmin', 'Badal Nyalang', 'Antoine Taroni', 'Andrei Niculae', 'Abdulaziz Nura Kani', 'Rushikesh Zawar', 'Marek Šuppa', 'Beatrice Savoldi', 'Andreas Simons', 'Rayyan Merchant', 'Ilai Yaron Levy', 'Francesco Pinto', 'Ziyi Yang', 'Yolanda Xavier', 'Samuel Frontull', 'Muhammad Ravi Shulthan Habibi', 'Kenneth Enevoldsen', 'Harris Abdul Majid', 'Francesca Padovani', 'Tim Graf', 'Tatiana Bielakova', 'Sharifa Djurabaeva', 'Shaoxiong Ji', 'Raia Abu Ahmad', 'Pavel Stepachev', 'Jirui Qi', 'Ayush Sunil Munot', 'Alireza Pakniat', 'Ayla Rigouts Terryn', 'Yuxing Lu', 'Yurii Paniv', 'Xiyan Fu', 'Tosin Adewumi', 'Sunisth Kumar', 'Stéphane J. P. S. Thunus', 'Shree Harsha Bokkahalli Satish', 'Shayan Bali', 'Prakhar Gupta', 'Papa Abdou Karim Karou Diallo', 'Matija Akrap', 'Marko Culjak', 'Kristýna Onderková', 'Joseph Attieh', 'Esrael Teferi Tensay', 'Elisabeth Fittschen', 'Benoît Sagot', 'Jingwei Ni', 'Yu Fan'], 'affiliations': ['ETH', 'JHU', 'KIT', 'MBZUAI', 'QUB', 'UvA'], 'pdf_title_img': 'assets/pdf/title_img/2609.04173.jpg', 'data': {'categories': ['#machine_translation', '#multimodal', '#multilingual', '#benchmark', '#dataset'], 'emoji': '🎯', 'ru': {'title': 'Бенчмарк для поиска истинных пределов моделей машинного перевода', 'desc': 'Авторы представляют новый бенчмарк для оценки машинного перевода, который включает мультимодальные примеры, специально подобранные для выявления ошибок современных моделей перевода. К каждому примеру прилагаются вручную составленные правила верификации, которые описывают конкретные сценарии отказа, обеспечивая надёжную и практически полезную оценку. Работа решает проблему насыщения стандартных бенчмарков и ненадёжности автоматических метрик перевода, которые подвержены переоптимизации и не дают информативной обратной связи. Предложенный бенчмарк является открытым и живым датасетом с возможностью постоянного пополнения новыми примерами от исследователей.'}, 'en': {'title': 'Revolutionizing Translation Evaluation with Actionable Benchmarks', 'desc': 'The Last Translation Benchmark is a new resource designed to evaluate machine translation models more effectively. It includes peer-reviewed, multimodal examples that expose weaknesses in current translation systems. The benchmark also features handcrafted verification rules that help identify specific failure cases, making evaluations more reliable and actionable. This ongoing dataset aims to improve the assessment of translation models and guide future advancements in the field.'}, 'zh': {'title': '突破翻译模型的最后基准', 'desc': '《最后翻译基准》引入了经过同行评审的多模态示例，这些示例能够突破领先的翻译模型，并配有手工制作的验证规则，以便进行可靠且可操作的评估。随着模型的不断增强，机器翻译的标准基准逐渐接近饱和，因此需要新的基准来测试最先进模型的极限。自动翻译指标不可靠，容易受到奖励操控的影响，且提供的评估结果难以操作。我们提出的《最后翻译基准》是一个包含人类创作和同行评审示例的集合，旨在识别翻译模型的具体失败案例，从而推动该领域的客观进步。'}}}, {'id': 'https://huggingface.co/papers/2609.03563', 'title': 'FlashRender: Few-Step Generative Rendering via Camera-Controlled Video MeanFlow', 'url': 'https://huggingface.co/papers/2609.03563', 'abstract': 'Abstract FlashRender accelerates generative video rendering via representation alignment, a mean-flow objective, and on-policy distillation to achieve high-quality few-step camera-controlled synthesis.  Generated by thinkingmachines/Inkling-Small We present FlashRender, a few-step generative rendering framework that retakes a source video along a target camera trajectory in seconds. We identify sampling-step-dependent camera control as a prominent manifestation of discretization error in existing multi-step generative rendering models and show that resolving this inconsistency substantially lowers denoising trajectory curvature, facilitating subsequent step distillation. To this end, we introduce Representation Transformation and Alignment (RETA), which aligns hidden source-video representations with target-video features from a frozen visual geometry model. This directly encodes the geometric transformation within the source-video stream, enabling sampling-step-consistent camera control. We then fine-tune the model with the MeanFlow objective on the lower-curvature denoising trajectory induced by RETA, allowing the model to more effectively address discretization error. Finally, we apply on-policy flow map distillation to correct self-rollout errors under fixed few-step sampling. Extensive experiments show that RETA, MeanFlow, and on-policy flow map distillation play complementary roles in few-step generative rendering. Together, they enable our approach to match multi-step baselines in video quality and geometric consistency at 25x lower sampling cost while achieving superior camera controllability, even under out-of-distribution target camera trajectories.', 'score': 12, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'e8b73307693bbcef', 'authors': ['Byeongjun Park', 'Byung-Hoon Kim', 'Hyungjin Chung'], 'affiliations': ['EverEx', 'Korea University', 'Yonsei University'], 'pdf_title_img': 'assets/pdf/title_img/2609.03563.jpg', 'data': {'categories': ['#video', '#training', '#inference'], 'emoji': '🎬', 'ru': {'title': 'Молниеносная генерация видео с точным управлением камерой', 'desc': 'FlashRender — это система для быстрого синтеза видео с контролем камеры, которая генерирует высококачественное видео за несколько шагов вместо традиционного многошагового подхода. Авторы решили проблему несогласованности управления камерой на разных этапах шумоудаления, введя метод выравнивания представлений RETA, который согласует скрытые представления исходного видео с геометрическими признаками целевого видео. Они применили objective функцию MeanFlow для оптимизации траектории денойзирования и on-policy дистилляцию потоков для исправления ошибок самораскрутки при малом числе шагов. Эксперименты показывают, что FlashRender достигает качества многошагового синтеза при 25 раз меньших вычислительных затратах и обеспечивает превосходный контроль камеры.'}, 'en': {'title': 'Accelerating Video Rendering with Smart Alignment and Distillation', 'desc': 'FlashRender is a generative video rendering framework that enhances the speed and quality of video synthesis by aligning representations and minimizing errors in camera control. It addresses the issue of discretization error in multi-step rendering by introducing Representation Transformation and Alignment (RETA), which ensures consistent camera control across sampling steps. The framework also employs a MeanFlow objective to fine-tune the model, reducing trajectory curvature and improving denoising performance. Additionally, on-policy flow map distillation is used to correct errors during the rendering process, resulting in high-quality video outputs with significantly lower computational costs.'}, 'zh': {'title': 'FlashRender：高效的生成视频渲染新方法', 'desc': 'FlashRender 是一种加速生成视频渲染的框架，通过表示对齐、均值流目标和在线蒸馏来实现高质量的少步摄像机控制合成。该方法解决了现有多步生成渲染模型中的离散化误差，显著降低了去噪轨迹的曲率，从而促进了后续的步骤蒸馏。我们引入了表示转换和对齐（RETA），将源视频的隐藏表示与目标视频特征对齐，直接编码几何变换。通过均值流目标的微调和在线流图蒸馏，我们的模型在视频质量和几何一致性上与多步基线相匹配，同时在采样成本上降低了25倍。'}}}, {'id': 'https://huggingface.co/papers/2608.30391', 'title': 'Using Grounded Theory for Agent Behavior Analysis at Scale', 'url': 'https://huggingface.co/papers/2608.30391', 'abstract': 'Abstract AutoTraceGT automates grounded theory coding on agent trajectories to build task-specific behavioral taxonomies that recover and extend human failure-mode annotations for downstream prediction.  Generated by thinkingmachines/Inkling-Small Understanding agent behavior requires methods that scale to thousands of trajectories and surface new patterns in long, often unfamiliar tasks where pre-built classifiers fall short. We propose to bring grounded theory into agent trajectory analysis: a six-decade-old qualitative method from the social sciences, with a principled saturation criterion and an auditable trail from data to theory. We propose AutoTraceGT (Automated Trace analysis through Grounded Theory), the first multi-agent pipeline that automates grounded theory on agent trajectories. It iteratively performs open, axial, and theoretical coding until saturation, producing a behavioral taxonomy tailored to each task. Across six trajectory corpora, AutoTraceGT produces codebooks that recover 73-91 percent of the failure modes in human-annotated taxonomies and surface additional patterns that those taxonomies miss. The emergent theoretical narrative aligns with prior expert accounts. Used as a deductive feature space, the codebook outperforms zero-shot and few-shot LLM baselines on downstream failure prediction. These results suggest Grounded Theory offers a scalable analytic tool for ML researchers and agent developers studying what agents actually do.', 'score': 12, 'issue_id': 3216, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'b32775c9571c6e36', 'authors': ['Zhuoran Lu', 'Yangyang Yu', 'Zhuoyan Li', 'Yibo Meng', 'Nan Jiang', 'Chengxi Zang', 'Jie Gao', 'Ziang Xiao'], 'affiliations': ['Cornell University', 'Johns Hopkins University', 'Purdue University', 'Stevens Institute of Technology', 'University of Texas at El Paso'], 'pdf_title_img': 'assets/pdf/title_img/2608.30391.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Автоматическое открытие поведенческих паттернов агентов через обоснованную теорию', 'desc': 'AutoTraceGT автоматизирует методологию обоснованной теории для анализа траекторий агентов, создавая задачеспецифичные классификации поведения. Система итеративно выполняет открытое, осевое и теоретическое кодирование до достижения насыщения, извлекая из данных структурированную таксономию. Полученные кодовки восстанавливают 73-91% ошибок, аннотированных людьми, и одновременно выявляют новые поведенческие паттерны. При использовании в качестве признаков для предсказания отказов система превосходит нулевое обучение и few-shot подходы с LLM.'}, 'en': {'title': 'Automating Behavioral Insights from Agent Trajectories', 'desc': 'AutoTraceGT is a novel approach that automates the process of grounded theory coding for analyzing agent trajectories, which helps in creating specific behavioral taxonomies. This method is particularly useful for understanding complex agent behaviors in tasks where traditional classifiers struggle. By applying grounded theory, AutoTraceGT systematically identifies and categorizes behaviors until a saturation point is reached, ensuring comprehensive coverage of failure modes. The resulting codebooks not only align with human annotations but also reveal additional insights, enhancing predictive performance in downstream tasks.'}, 'zh': {'title': '自动化代理轨迹分析的新方法', 'desc': 'AutoTraceGT 是一种自动化的 grounded theory 编码方法，专注于代理轨迹分析，以构建特定任务的行为分类法。该方法能够处理成千上万的轨迹，并在复杂任务中发现新的模式，克服传统分类器的局限。通过迭代进行开放、轴心和理论编码，AutoTraceGT 生成的行为分类法能够恢复人类注释的失败模式，并发现额外的模式。研究结果表明，Grounded Theory 为机器学习研究者和代理开发者提供了一种可扩展的分析工具，帮助理解代理的实际行为。'}}}, {'id': 'https://huggingface.co/papers/2609.04128', 'title': 'Environment Evolution for Terminal Agents', 'url': 'https://huggingface.co/papers/2609.04128', 'abstract': "Abstract Environment evolution incrementally raises task difficulty off-policy to sustain continuous learning signals for terminal agents, improving benchmark performance through multi-agent harnesses.  Generated by thinkingmachines/Inkling-Small Scaling interactive and verifiable environments is critical for training terminal agents. As frontier models become more capable, environments synthesized from scratch become less challenging and thus provide limited learning signals. Recent co-evolution methods iteratively synthesize environments near the model's learnable frontier based on weaknesses exposed during rollouts. However, their dependence on on-policy rollouts limits generalization and the continuous provision of learning signals as the model becomes stronger. In this paper, we propose environment evolution, which incrementally increases environment difficulty off-policy and schedules the evolved environments generation by generation during training to provide continuous learning signals. We derive three evolution directions that influence environment difficulty from the multi-turn learning objective and then implement evolution along these directions through a loop-engineered multi-agent harness. Quantitative rollout experiments with Hy4 preview, Claude Opus 5, and GPT-5.6 Sol show that environment evolution consistently produces more difficult environments. We validate its effectiveness on Qwen3.6-27B and Qwen3.6-35B-A3B through simple long-horizon RL training, improving their performance by 14.4 and 18.0 percentage points on Terminal-Bench 2.1, respectively.", 'score': 10, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'a5b17e5ffee0db54', 'authors': ['Zhiyuan Fan', 'Tinghao Yu', 'Yuanjun Cai', 'Jiang Zhou', 'Jiangtao Guan', 'Jincheng Liu', 'Yun Yang', 'Dingxin Hu', 'Zhuo Han', 'Xing Wu', 'Feng Zhang', 'Lilin Wang'], 'affiliations': ['Tencent', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2609.04128.jpg', 'data': {'categories': ['#rl', '#agents', '#training', '#benchmark'], 'emoji': '🌱', 'ru': {'title': 'Эволюция окружения: непрерывное усложнение задач для обучения агентов', 'desc': 'В этой работе предлагается метод эволюции окружения, который постепенно повышает сложность задач во время обучения агентов. Ключевое отличие от существующих подходов заключается в использовании off-policy обучения, что позволяет продолжать генерировать сложные задачи даже когда модель становится сильнее. Авторы выводят три направления эволюции окружения на основе многошагового обучения с подкреплением и реализуют их через специальную архитектуру с несколькими агентами. Экспериментальные результаты показывают, что предложенный метод значительно улучшает производительность моделей на бенчмарке Terminal-Bench 2.1 на 14-18 процентных пункта.'}, 'en': {'title': 'Evolving Environments for Continuous Learning in RL', 'desc': "This paper introduces a method called environment evolution, which aims to enhance the training of terminal agents by incrementally increasing the difficulty of the environments they operate in. By generating these challenging environments off-policy, the approach allows for continuous learning signals that adapt as the agents improve. The authors identify three key directions for evolving environment difficulty based on the agents' learning objectives and implement this through a multi-agent system. Experimental results demonstrate that this method significantly boosts the performance of various models in long-horizon reinforcement learning tasks."}, 'zh': {'title': '环境进化：提升智能体学习的关键', 'desc': '本文提出了一种环境进化的方法，通过逐步增加环境的难度来支持终端智能体的持续学习。我们设计了三种影响环境难度的进化方向，并通过多智能体系统实现了这些方向的进化。实验结果表明，环境进化能够生成更具挑战性的环境，从而提高智能体的学习效果。最终，我们在多个模型上验证了该方法的有效性，显著提升了它们在基准测试中的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.04200', 'title': 'Principia: Relational Physics Tests for Video Models', 'url': 'https://huggingface.co/papers/2609.04200', 'abstract': 'Abstract Principia evaluates video generators on Newtonian physics via calibration-independent relational consistency across paired objects, revealing major physical reasoning gaps.  Generated by thinkingmachines/Inkling-Small Evaluating physical reasoning in video models is difficult because absolute motion measurements depend on frame rate, object scale, and camera calibration, all of which are often ambiguous or unavailable in generated video. We propose a different approach. When two objects in the same scene obey the same physical law, their motions must satisfy predictable relationships, and these relationships hold independent of calibration. We introduce Principia, a benchmark that evaluates Newtonian physics through relational consistency between paired objects. Principia spans eight phenomena - gravity, restitution, friction, rotational inertia, projectile motion, momentum, pendulum, and mass-spring oscillation - across translational, rotational, collisional, and oscillatory dynamics, using real-world scenes recorded under controlled protocols. We also introduce a calibration-independent consistency score that quantifies physical violation directly in image space. Across thousands of generations from six state-of-the-art video generators, no model exceeds 0.42 on Principia despite all scoring around 0.8 on VBench. Vision-language models are evaluated on their ability to detect relational physics violations, with the best model achieving only 67% accuracy and most performing near chance level.', 'score': 10, 'issue_id': 3215, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': 'a5f5b6c937c1efbb', 'authors': ['Varun Varma Thozhiyoor', 'Shivam Tripathi', 'Venkatesh Babu Radhakrishnan', 'Anand Bhattad'], 'affiliations': ['Indian Institute of Science', 'Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2609.04200.jpg', 'data': {'categories': ['#science', '#video', '#reasoning', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Физика в фокусе: проверка понимания механики через парные объекты', 'desc': 'В статье представлен бенчмарк Principia для оценки понимания классической механики видеогенераторами на основе проверки релационной согласованности движения парных объектов. Авторы предлагают калибровочно-независимый подход, который использует тот факт, что объекты, подчиняющиеся одним физическим законам, должны иметь предсказуемые отношения движений независимо от калибровки камеры. Бенчмарк охватывает восемь физических явлений: гравитацию, упругость, трение, моментальную инерцию, движение снаряда, импульс, маятник и колебания массы на пружине. Результаты показывают серьезные пробелы в физическом рассуждении современных моделей - лучшие генераторы набирают только 0.42 балла, а видео-языковые модели достигают всего 67% точности в обнаружении физических нарушений.'}, 'en': {'title': 'Evaluating Video Generators with Newtonian Physics', 'desc': 'The paper introduces Principia, a benchmark designed to evaluate video generators based on their understanding of Newtonian physics through relational consistency between paired objects. It addresses the challenge of measuring physical reasoning in generated videos, which is complicated by factors like frame rate and camera calibration. By focusing on predictable relationships between objects that obey the same physical laws, Principia provides a calibration-independent consistency score to assess physical accuracy. The results show that current state-of-the-art video generators struggle with physical reasoning, achieving low scores on the benchmark despite performing well on other evaluation metrics.'}, 'zh': {'title': '评估视频生成模型的物理推理能力', 'desc': '本文介绍了一个名为Principia的基准，用于评估视频生成模型在牛顿物理学方面的表现。通过比较同一场景中成对物体的运动关系，Principia能够独立于校准评估物理一致性。研究涵盖了八种物理现象，包括重力、恢复力、摩擦力等，使用真实场景进行测试。结果显示，尽管视频生成模型在其他基准上表现良好，但在Principia上没有模型的得分超过0.42，表明它们在物理推理方面存在显著缺陷。'}}}, {'id': 'https://huggingface.co/papers/2609.03820', 'title': 'Select, Compress, Reinvest: A Controlled Study of Visual-Token Allocation in Long-Video MLLMs', 'url': 'https://huggingface.co/papers/2609.03820', 'abstract': "Abstract Frame selection dominates accuracy in long-video language models, while spatial compression is nearly free if savings are reinvested into more frames, and a unified harness is needed to compare selectors fairly.  Generated by thinkingmachines/Inkling-Small Long-video language models cannot look at every frame: an hour sampled once per second is 3,600 images, and a system keeps only a small fixed slice of that pool. Which frames survive that slice is usually treated as a preprocessing detail; we test whether it should be. Published selectors make the comparison hard because they change the frame scorer, the prompt boundary, the resolution policy, and the answering model all at once. We hold each fixed and vary one decision at a time: selection, spatial compression, and reinvestment of the savings, across six training-free selection rules, three long-video benchmarks, and two answering models. Selection is the largest single lever: on LongVideoBench's hour-long bin, eight query-selected frames beat sixteen uniformly spaced ones by 6.9 points, and Orthogonal Matching Pursuit, an unmodified decades-old sparse-approximation algorithm, matches or comes within a point of every purpose-built selector we compare it against, across all three benchmarks. Compression is close to free: halving each frame's spatial budget at fixed timestamps costs at most 0.44 points. Reinvestment is where that budget turns back into accuracy: spending the freed tokens on twice as many compressed frames, at a measured cost no higher than the original eight, returns a further two to three points; compression only pays off once its savings are spent this way. Along the way, an implementation bug in our own AKS baseline and a 0.07 to 3.74 point gap between two harnesses running the same published rules at the same budget show why these comparisons need to happen inside one controlled harness rather than across papers.", 'score': 9, 'issue_id': 3217, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '55bcf25c49915925', 'authors': ['Prakhar Khatri'], 'affiliations': ['Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2609.03820.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#long_context', '#video'], 'emoji': '🎬', 'ru': {'title': 'Выбор кадров — главный рычаг для понимания длинных видео', 'desc': 'В работе исследуется проблема выбора кадров для длинных видео в языковых моделях зрения. Авторы проводят контролируемое сравнение различных стратегий отбора кадров, пространственной компрессии и переинвестирования сэкономленных токенов, варьируя каждый фактор независимо. Результаты показывают, что выбор кадров — это наиболее влиятельный фактор, и простой алгоритм Orthogonal Matching Pursuit, разработанный десятки лет назад, конкурирует с современными специализированными селекторами. Исследование демонстрирует, что пространственная компрессия почти не влияет на качество, если сэкономленные вычислительные ресурсы переинвестировать в большее количество кадров.'}, 'en': {'title': 'Maximizing Accuracy in Long-Video Language Models through Smart Frame Selection', 'desc': 'This paper investigates how frame selection impacts the accuracy of long-video language models. It highlights that while spatial compression of frames is inexpensive, the real gains in accuracy come from effectively reinvesting the savings into selecting more frames. The authors conduct a systematic comparison of various frame selection methods, showing that selection is the most significant factor influencing performance. They also emphasize the need for a unified framework to ensure fair comparisons among different selectors and methods.'}, 'zh': {'title': '帧选择是长视频模型准确性的关键', 'desc': '本论文探讨了长视频语言模型中的帧选择对准确性的影响。研究表明，选择合适的帧是提高模型性能的关键，而空间压缩几乎是免费的，只要将节省的资源重新投资于更多的帧。我们通过固定其他变量，逐一测试帧选择、空间压缩和节省的再投资，发现帧选择是影响准确性的最大因素。最后，论文强调了在统一的框架下进行比较的重要性，以确保结果的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2609.01072', 'title': 'Let Confidence Change, Not the Prediction: Prediction-Preserving Repair for Post-hoc Calibration', 'url': 'https://huggingface.co/papers/2609.01072', 'abstract': "Abstract CORD is a post-fit adapter that repairs calibrated probability vectors to exactly preserve original top-1 predictions while maintaining calibration quality.  Generated by thinkingmachines/Inkling-Small Post-hoc calibration corrects reported confidence, yet a multiclass calibrator can also change the associated top-1 prediction. Accuracy captures only the net effect of these changes on correctness, not how often predictions change; the Top-1 Prediction Change Rate (TPCR) instead measures this frequency. We propose Calibrator-Output Repair for Top-1 Decision Preservation (CORD), the first post-fit adapter to impose exact prediction preservation by repairing the full calibrated probability vector. From the original and calibrated outputs alone, CORD determines the mass assigned to the original top-1. The calibrated conditional distribution allocates the remaining mass over the other classes, yielding a repaired vector whose own argmax recovers the original prediction. On the calibration split, CORD coordinates the repaired masses to retain the calibrated outputs' mean mass on original predictions whenever attainable. The adapter alters neither the fitted calibrator nor its direct output, fits no additional supervised map, and requires no user- or validation-tuned hyperparameter. Across CIFAR-10/100 and ImageNet-1K, CORD attains zero TPCR by construction and lowers mean ECE, NLL, and Brier relative to the corresponding direct outputs in every dataset; paired gains persist under distribution shift and across calibration-set sizes. CORD thus removes the preservation constraint from calibrator fitting and assigns exact recovery of the original decision to subsequent output repair. Our code is available at https://github.com/labhai/CORD.", 'score': 8, 'issue_id': 3216, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'c35dcb626723965e', 'authors': ['Daehwan Kim', 'Haejun Chung', 'Ikbeom Jang'], 'affiliations': ['Hankuk University of Foreign Studies, Yongin, Republic of Korea', 'Hanyang University, Seoul, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2609.01072.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Сохраняем старые предсказания, улучшаем откалиброванность', 'desc': 'CORD — это post-hoc адаптер, который восстанавливает откалиброванные вероятностные векторы, сохраняя исходные топ-1 предсказания модели при одновременном улучшении калибровки. Авторы показывают, что стандартная калибровка может случайно изменять основное предсказание классификатора, что не отражается метрикой accuracy. Они предлагают новую метрику TPCR (Top-1 Prediction Change Rate) для измерения частоты изменения предсказаний при калибровке. CORD работает как лёгкий постобработчик, который переделает вероятности так, чтобы argmax остался на исходном классе, одновременно улучшая калибровку по метрикам ECE и NLL.'}, 'en': {'title': 'Preserving Predictions with CORD: Calibration Without Compromise', 'desc': 'CORD is a novel post-fit adapter designed to enhance the calibration of probability vectors while ensuring that the original top-1 predictions remain unchanged. It achieves this by repairing the calibrated outputs without altering the underlying calibrator or requiring additional training. The method introduces the Top-1 Prediction Change Rate (TPCR) to measure how often predictions change, and CORD guarantees a TPCR of zero, meaning predictions are preserved. By maintaining high calibration quality and improving metrics like Expected Calibration Error (ECE) and Negative Log-Likelihood (NLL), CORD effectively balances prediction accuracy with reliability across various datasets.'}, 'zh': {'title': 'CORD：精准保留Top-1预测的校准适配器', 'desc': 'CORD是一种后处理适配器，旨在修复经过校准的概率向量，以精确保留原始的Top-1预测，同时保持校准质量。它通过修复完整的校准概率向量，确保在不改变拟合校准器或其直接输出的情况下，保留原始预测。CORD能够在不同数据集上实现零的Top-1预测变化率，并降低均值预期校准误差、负对数似然和Brier分数。该方法在分布变化和校准集大小变化下仍能保持效果，展示了其在机器学习模型校准中的重要性。'}}}, {'id': 'https://huggingface.co/papers/2609.02373', 'title': 'Percolation Dynamics in Optimization : Variance Cascades and Discrete Scale Invariance', 'url': 'https://huggingface.co/papers/2609.02373', 'abstract': 'Abstract Stochastic gradient descent dynamics are modeled as a percolation process where architectural symmetries cause subnetworks to merge in discrete blocks, producing variance spikes resembling phase transitions, with similar trapping behavior extending to Adam and AdamW under heavy-tailed noise.  Generated by thinkingmachines/Inkling-Small We study the dynamics of Stochastic Gradient Descent (SGD), which is known to steer deep neural networks toward invariant sets that correspond to simpler subnetworks. How this steering unfolds over time remains poorly understood. We answer this by modeling the stochastic gradient flow (SGF) as a percolation process, in which architectural symmetries force subnetworks to merge in discrete simultaneous blocks rather than one at a time. These structural transitions register as variance spikes in a macroscopic order parameter, echoing physical phase transitions. We further show this trapping mechanism and its associated scaling cascade extend to Adam and AdamW under an explicit heavy-tailed noise model.', 'score': 7, 'issue_id': 3216, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '1a65933a60480f29', 'pdf_title_img': 'assets/pdf/title_img/2609.02373.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '🌊', 'ru': {'title': 'Фазовые переходы в динамике градиентного спуска: перколяция и слияние подсетей', 'desc': 'В работе исследуется динамика стохастического градиентного спуска (SGD) через призму теории перколяции, где архитектурные симметрии нейросети вызывают слияние подсетей блоками, что проявляется скачками дисперсии наподобие фазовых переходов. Авторы моделируют стохастический градиентный поток как процесс перколяции и демонстрируют, что подсети объединяются одновременно блоками, а не постепенно, создавая эффекты, аналогичные физическим фазовым переходам. Показано, что механизм трapping (застревания) и связанный с ним каскад масштабирования распространяются также на оптимизаторы Adam и AdamW в условиях тяжелохвостого распределения шума. Исследование проливает свет на ранее неясные аспекты того, как градиентные методы направляют сети к упрощённым конфигурациям на протяжении обучения.'}, 'en': {'title': 'Understanding SGD Dynamics Through Percolation Processes', 'desc': 'This paper explores how Stochastic Gradient Descent (SGD) influences the training of deep neural networks by modeling its dynamics as a percolation process. It reveals that architectural symmetries in the networks lead to the merging of subnetworks in discrete blocks, rather than sequentially. This merging creates variance spikes that are similar to phase transitions observed in physics. Additionally, the study extends these findings to optimization algorithms like Adam and AdamW, demonstrating that they exhibit similar trapping behaviors under heavy-tailed noise conditions.'}, 'zh': {'title': '随机梯度下降的渗流过程与相变现象', 'desc': '本文研究了随机梯度下降（SGD）的动态过程，提出将其建模为渗流过程。网络的结构对称性导致子网络以离散块的形式合并，从而产生类似于相变的方差峰值。我们发现，这种结构转变在宏观参数中表现为方差的剧烈波动，类似于物理中的相变现象。此外，我们还展示了这种捕获机制及其相关的尺度级联在Adam和AdamW算法中也适用，尤其是在重尾噪声模型下。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2608.29253', 'title': 'QCell: Recombining and Aligning Cell Queries for Overlapping Instance Segmentation', 'url': 'https://huggingface.co/papers/2608.29253', 'abstract': 'Abstract QCell is a query-based model that improves instance segmentation of overlapping microscopy cells through latent-space recombination and contrastive query alignment.  Generated by thinkingmachines/Inkling-Small Instance segmentation of overlapping cells in microscopy remains challenging due to semi-transparent structures that produce weak boundaries and mixed visual evidence in overlap regions. Existing methods address this through local regions of interest or shape priors but lack global reasoning across overlapping objects. We present QCell, a novel query-based model that de-overlaps cell instances in microscopy scenes. Our approach combines (i) an instance recombination module that decomposes and recombines query representations in latent space, enabling the model to reason about complete object structure under overlap, and (ii) a contrastive query alignment objective that combines distinctive instance feature learning and separation of overlapping cell queries. We additionally introduce a new Organoid dataset benchmark for overlapping cell segmentation. We show that QCell outperforms state-of-the-art methods across multiple benchmarks, achieving +2.2 AP and +2.7 AJI on ISBI2014. Code is available at https://github.com/SlavkoPrytula/QCell', 'score': 7, 'issue_id': 3217, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '3b5b4d7b6cf946c6', 'pdf_title_img': 'assets/pdf/title_img/2608.29253.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#healthcare', '#cv', '#architecture'], 'emoji': '🔬', 'ru': {'title': 'Разделение перекрывающихся клеток через контрастивное выравнивание запросов', 'desc': 'QCell — это модель на основе запросов (query-based), которая улучшает сегментацию перекрывающихся клеток в микроскопических изображениях. Модель использует рекомбинацию представлений в латентном пространстве и контрастивное выравнивание запросов для разделения перекрывающихся экземпляров клеток. Ключевой компонент — модуль рекомбинации экземпляров, который разлагает и перекомбинирует представления запросов, позволяя модели рассуждать о полной структуре объектов под перекрытием. Авторы также представили новый датасет Organoid и продемонстрировали превосходство QCell над существующими методами на нескольких бенчмарках.'}, 'en': {'title': 'QCell: Revolutionizing Overlapping Cell Segmentation in Microscopy', 'desc': 'QCell is a novel model designed to enhance instance segmentation of overlapping cells in microscopy images. It utilizes a unique approach that involves recombining query representations in latent space, allowing the model to better understand the structure of overlapping objects. Additionally, it employs a contrastive query alignment objective to improve the learning of distinct features and effectively separate overlapping cell instances. The model has been tested on a new Organoid dataset and has shown significant improvements over existing methods, achieving higher average precision and adjusted Jaccard index scores.'}, 'zh': {'title': 'QCell：重叠细胞实例分割的新突破', 'desc': 'QCell是一种基于查询的模型，旨在改善显微镜细胞的实例分割，特别是重叠细胞的处理。该模型通过潜在空间重组和对比查询对齐来解决细胞重叠带来的挑战。QCell结合了实例重组模块和对比查询对齐目标，使模型能够在重叠区域内推理完整的物体结构。实验结果表明，QCell在多个基准测试中优于现有的最先进方法，显著提高了分割精度。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2609.03153', 'title': 'VeriPhy: Agentic Physical Reasoning for World Model Evaluation and Refinement', 'url': 'https://huggingface.co/papers/2609.03153', 'abstract': 'Abstract VeriPhy verifies generated video by compiling prompts into typed physical obligations, executing frozen expert analyses with provenance tracking, and mapping evidence to auditable three-valued verdicts.  Generated by thinkingmachines/Inkling-Small Visual fluency in generated video does not imply physical reliability, and a scalar quality score alone is incapable of indicating the obligation a clip violates or the moment it fails. We present VeriPhy, an auditable physical-verification system in which a text-only planner compiles the prompt into typed physical obligations and a statically validated execution plan before any frame is observed. During execution, observations gate and scope only declared calls to frozen low-level experts (e.g., segmentation and tracking, counting, eleven typed physical measurements over the resulting tracks, depth, OCR, and audio-event detection). Each action returns a provenance-carrying evidence record whose payload, when usable, is either a typed measurement or an explicitly tagged learned state. Typed resolvers and fixed composition map usable records to a three-valued state (supported, contradicted, or unknown, surfaced as plausible, implausible, or abstain) with full provenance, so that every verdict is traceable to the evidence that produced it. We anchor evaluation in a 1,500-clip corpus of human-annotated flaw records that localize real generation failures in prompt reference, space, and time. On a 149-clip core carrying 304 such records, VeriPhy accounts for 228, against 164 for a published question-decomposition evaluator given the same clips and the same claims. Recall alone does not separate it from prompting the same backbone monolithically, which reaches 222; what separates them is that each decision retains its evidence record and provenance, making the traces auditable one verdict at a time and usable as the interface through which a critic verdict could be written back into generation.', 'score': 2, 'issue_id': 3220, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': 'f579ab214d892dfa', 'authors': ['Wenzhuo Xu', 'Yuchen Zhu', 'Chongjian Ge', 'Xuan Shen', 'Jing Shi', 'Jason Kuen', 'Yongxin Chen', 'Molei Tao', 'Christopher McComb', 'Noelia Grande Gutiérrez', 'Jiuxiang Gu'], 'affiliations': ['Adobe Research', 'Carnegie Mellon University', 'Georgia Institute of Technology', 'Northeastern University'], 'pdf_title_img': 'assets/pdf/title_img/2609.03153.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#video'], 'emoji': '🎬', 'ru': {'title': 'Проверяемость видео через отслеживаемые физические ограничения', 'desc': 'VeriPhy — это система для проверки сгенерированных видео, которая компилирует текстовые описания в типизированные физические ограничения и создает план выполнения перед анализом кадров. Система использует замороженные экспертные модели (сегментация, отслеживание, подсчет, измерения и другие анализаторы) с полным отслеживанием провенанса для каждого решения. Каждый результат анализа преобразуется в трёхзначный вердикт (поддерживается, противоречит или неизвестно) с сохранением полной цепочки доказательств. Система оценивается на корпусе из 1500 видеоклипов с аннотированными ошибками, достигая лучших результатов в обнаружении нарушений физических законов по сравнению с существующими методами.'}, 'en': {'title': 'VeriPhy: Auditing Video Generation with Provenance Tracking', 'desc': 'VeriPhy is a system designed to verify the accuracy of generated videos by translating prompts into specific physical obligations and executing a validated plan before viewing any frames. It uses expert analyses to assess various aspects of the video, such as segmentation and audio detection, while keeping track of the evidence produced during these evaluations. Each action taken by the system results in a record that indicates whether the evidence supports, contradicts, or is uncertain about the claims made in the video. This approach allows for a detailed audit trail of decisions, making it possible to trace back each verdict to the evidence that led to it, thus enhancing the reliability of video generation assessments.'}, 'zh': {'title': 'VeriPhy：可审计的视频生成验证系统', 'desc': 'VeriPhy 是一个可审计的物理验证系统，旨在验证生成的视频内容。它通过将提示编译成类型化的物理义务，并在观察任何帧之前执行静态验证的执行计划。系统在执行过程中，仅对声明的低级专家调用进行观察，并返回带有来源记录的证据。每个决策都保留其证据记录和来源，使得每个判决都可以追溯到产生它的证据，从而实现可审计性。'}}}, {'id': 'https://huggingface.co/papers/2608.29188', 'title': 'Locked at the Entrance, Open Inside: Where RLVR Narrows the Solution Space', 'url': 'https://huggingface.co/papers/2608.29188', 'abstract': "Abstract Reinforcement learning with verifiable rewards narrows reasoning diversity primarily at the initial solution step rather than during execution, and targeted interventions can restore coverage without sacrificing accuracy.  Generated by thinkingmachines/Inkling-Small Reinforcement learning with verifiable rewards (RLVR) substantially improves single-sample accuracy (pass@1) but causes the policy's solution space to contract, diminishing the returns of test-time scaling. In this work, we investigate where inside a reasoning trajectory this breadth is lost: does the policy fail to access a valid solution family, or does it fail to execute computation once initiated? To disentangle access from execution, we analyze the Countdown task, whose solution space can be exhaustively enumerated into discrete entrance families defined by the first operand and operator, across PPO on Qwen2.5-3B and GRPO on Qwen2.5-3B-Instruct. Across both training setups, solution coverage falls by up to 67%, halving even on problems solved across all checkpoints. We show that this contraction is heavily concentrated at the entrance: per-token likelihood shifts are 11x--16x larger prior to the first arithmetic operation than during downstream reasoning. Supplying only an unselected entrance prefix restores completion rates in low-access families by over an order of magnitude (0.018 -> 0.212 under PPO), demonstrating that alternative solutions remain executable but are no longer initiated. Guided by this localization, we find that while surface prompting fails to recover diversity, entrance-targeted interventions succeed: late-layer parameter interpolation with early checkpoints increases solution coverage by 37% at no loss in pass@1. Finally, we show that early-step entropy collapse recurs across six math benchmarks with 7B and 14B models, but is not an inevitable byproduct of reasoning optimization: an SFT baseline preserves more than double the coverage, and staged SFT--DPO--RLVR pipelines retain early-step entropy. In summary, reasoning breadth is lost at the door, not inside the room. Code: https://github.com/ershiyidian/early-branch-locking.", 'score': 2, 'issue_id': 3219, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'd03f47abbdb054f2', 'authors': ['Qiancheng Zhou', 'Ruizhe Li'], 'affiliations': ['School of Computer Science, University of Birmingham', 'School of Future Technology, Shanghai University'], 'pdf_title_img': 'assets/pdf/title_img/2608.29188.jpg', 'data': {'categories': ['#interpretability', '#rl', '#reasoning', '#math', '#training', '#small_models', '#rlhf'], 'emoji': '🚪', 'ru': {'title': 'Разнообразие теряется у входа, а не внутри комнаты', 'desc': 'В статье исследуется проблема сужения разнообразия решений при обучении с подкрепленьем и верифицируемыми вознаграждениями (RLVR). Авторы показывают, что модели теряют способность генерировать различные траектории рассуждений в основном на начальном шаге решения, а не во время выполнения вычислений. Через анализ задачи Countdown на моделях Qwen2.5 они демонстрируют, что целевые вмешательства, такие как интерполяция параметров поздних слоёв, могут восстановить разнообразие решений без потери точности. Исследование показывает, что проблема не в неспособности выполнить вычисления, а в недостатке инициирования альтернативных входных точек решения.'}, 'en': {'title': 'Restoring Reasoning Diversity in Reinforcement Learning', 'desc': 'This paper explores how reinforcement learning with verifiable rewards (RLVR) affects the diversity of reasoning in AI models, particularly at the initial stages of problem-solving. It finds that while RLVR improves accuracy in single-sample tasks, it significantly reduces the range of potential solutions available to the model. The authors analyze the Countdown task to identify where this loss occurs, revealing that the contraction happens primarily before the first operation is executed. They propose targeted interventions that can restore solution diversity without compromising accuracy, demonstrating that the issue lies in the initiation of solutions rather than their execution.'}, 'zh': {'title': '推理多样性在入口处丧失', 'desc': '这篇论文探讨了可验证奖励的强化学习如何在初始解决步骤时缩小推理的多样性，而不是在执行过程中。研究发现，政策的解决空间收缩导致测试时的效果下降，但通过有针对性的干预可以恢复覆盖率而不影响准确性。分析表明，解决方案的覆盖率在进入阶段显著下降，且在首次算术操作之前的可能性变化更大。最后，论文提出了通过早期检查点的参数插值来提高解决方案覆盖率的方法，表明推理的多样性在进入阶段丧失，而不是在执行阶段。'}}}, {'id': 'https://huggingface.co/papers/2609.02887', 'title': 'A Common Measure of Communication for Speech Brain-Computer Interfaces', 'url': 'https://huggingface.co/papers/2609.02887', 'abstract': "Abstract Open-vocabulary mutual information provides a unified metric to compare speech brain-computer interfaces across different vocabularies and conditions, revealing trade-offs between vocabulary coverage and decoding accuracy.  Generated by thinkingmachines/Inkling-Small Speech brain-computer interfaces (speech BCIs) translate neural activity into language, offering a path towards restoring speech for people with paralysis and, more broadly, enabling new forms of natural human-computer interaction. Despite this promise, the field lacks a common measure of progress because systems use different datasets, recording methods, types of speech, and vocabularies, so their reported scores are rarely comparable. Underlying this measurement problem are two unresolved questions: (i) what distribution of words should a speech BCI enable a user to communicate, and (ii) how much information from this distribution can a system convey. We address both by deriving open-vocabulary mutual information (OVMI), an information-theoretic quantity that measures the information conveyed by a decoder relative to a reference distribution over the words a user may wish to communicate. This allows capabilities measured under different conditions, such as distinct vocabularies, to be evaluated on a common communication scale. We show that ordinarily reported accuracy, word error rate (WER), and other metrics computed only over the words a system supports can overstate how much of a user's intended speech the system can communicate. We then use OVMI to compare existing systems, expose trade-offs between how much of the user's language a system supports and how accurately it decodes those words, show that these comparisons depend on what the user is expected to communicate, and demonstrate that selecting a vocabulary to maximise OVMI yields up to 16.3% relative improvement in accuracy across three speech domains. OVMI therefore provides the speech BCI community with a principled way to compare heterogeneous systems, improve vocabulary design, and measure progress in the field.", 'score': 1, 'issue_id': 3221, 'pub_date': '2026-09-02', 'pub_date_card': {'ru': '2 сентября', 'en': 'September 2', 'zh': '9月2日'}, 'hash': '12d2e93892878926', 'authors': ['Dulhan Jayalath', 'Benjamin Ballyk', 'Oiwi Parker Jones'], 'affiliations': ['University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2609.02887.jpg', 'data': {'categories': ['#healthcare', '#science', '#benchmark', '#audio'], 'emoji': '🧠', 'ru': {'title': 'Единая метрика для сравнения речевых интерфейсов мозга', 'desc': 'В статье предложена новая метрика Open-vocabulary mutual information (OVMI) для оценки систем речевых brain-computer interfaces, которая позволяет сравнивать декодеры, работающие с разными словарями и условиями. OVMI измеряет информацию, которую декодер способен передать, относительно эталонного распределения слов, которые пользователь может захотеть произнести. Авторы показывают, что традиционные метрики, такие как точность и WER, могут переоценивать производительность систем, поскольку они учитывают только слова из поддерживаемого словаря. Используя предложенную метрику, авторы выявляют компромисс между полнотой словаря и точностью декодирования, и демонстрируют, что оптимизация словаря по OVMI дает улучшение точности на 16,3% относительно базовых подходов.'}, 'en': {'title': 'Unlocking Speech BCIs with Open-Vocabulary Mutual Information', 'desc': 'This paper introduces open-vocabulary mutual information (OVMI) as a new metric for evaluating speech brain-computer interfaces (BCIs). It addresses the challenge of comparing different systems that use various vocabularies and datasets by providing a common scale for measurement. OVMI quantifies the information a decoder can convey based on a reference distribution of words, highlighting the trade-offs between vocabulary coverage and decoding accuracy. The authors demonstrate that using OVMI can lead to significant improvements in system performance and offers a standardized approach for the speech BCI community to assess progress and optimize vocabulary design.'}, 'zh': {'title': '开放词汇互信息：提升语音脑机接口的比较与设计', 'desc': '开放词汇互信息（OVMI）提供了一种统一的度量标准，用于比较不同词汇和条件下的语音脑机接口（BCI）。该研究解决了如何选择用户可以交流的词汇分布以及系统能够传达多少信息这两个问题。通过OVMI，我们可以在一个共同的交流尺度上评估不同条件下的能力，并揭示用户语言支持与解码准确性之间的权衡。研究表明，优化词汇以最大化OVMI可以在三个语音领域中提高准确性，最多可达16.3%。'}}}];

                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-05 03:55',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-05 03:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-05 03:55')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
