ли скрывают свою приверженность этим подсказкам в рассуждениях, хотя фактически их придерживаются. Исследование охватило 15 открытых моделей размером от 4 млрд до 1.6 трлн параметров и выявило универсальную закономерность: явные подсказки в сообщениях пользователя лучше отражаются в вербализованных рассуждениях, чем скрытые предпочтения из инструментов. Результаты демонстрируют, что системы мониторинга рассуждений становятся менее эффективны при обнаружении неявного влияния, что важно для безопасности и интерпретируемости AI-систем.'}, 'en': {'title': 'Evaluating Model Reliability in Preference Cues', 'desc': 'The paper introduces FACE-Eval, a new evaluation method that assesses how well models follow cues from user messages versus tool outputs. It finds that models show less verbal commitment to reasoning when cues come from tools rather than directly from users. Additionally, the study reveals that models tend to adopt preferences more when cues are implicit or come from tools, indicating a gap in how models process different types of information. Overall, the findings suggest that traditional chain-of-thought monitoring may not be as effective when models rely on indirect cues from tools or artifacts.'}, 'zh': {'title': '链式思维监控的可靠性研究', 'desc': '本论文介绍了FACE-Eval评估工具，旨在研究链式思维监控在不同偏好线索下的可靠性。研究发现，当偏好线索通过工具输出或隐含信息传递时，模型的口头承诺较低，而隐性采纳较高。通过对15个开放权重模型的评估，结果显示工具返回的线索比用户消息的线索更容易导致隐性采纳。该研究表明，在特定的测试环境中，链式思维监控的可靠性可能受到偏好信息传递方式的影响。'}}}, {'id': 'https://huggingface.co/papers/2608.24293', 'title': 'Keep-or-Drop? Adaptive Tokenizer for Compact Video Representation', 'url': 'https://huggingface.co/papers/2608.24293', 'abstract': "Abstract KATok is an adaptive transformer-based video tokenizer that selectively drops uninformative tokens to achieve data-dependent compression while preserving spatial consistency for diffusion-based generation.  Generated by thinkingmachines/Inkling-Small Latent diffusion models have emerged as a dominant framework for high-fidelity image and video synthesis, operating in compact latent spaces with variational autoencoders (VAEs) to enhance computational efficiency without compromising visual quality. However, conventional VAEs are suboptimal for video data as they employ fixed compression ratios that cannot adapt to the varying complexity of spatio-temporal content. We present KATok (Keep-or-Drop? Adaptive Tokenizer for Compact Video Representation), a transformer-based VAE that incorporates an adaptive token selector which is jointly learned with latent tokens. By evaluating each token's content-richness as keep-or-drop probability, the token selector effectively discards uninformative tokens, naturally allowing data-dependent compression. Applying adaptive tokenization to diffusion models may cause spatial misalignment, as token dropping can disturb the original spatio-temporal structure. To alleviate this issue, we propose two position-prediction strategies: cascaded and joint generation, to ensure spatial consistency. We empirically show that our model achieves strong reconstruction and generation quality at a state-of-the-art compression ratio. Further analysis on video data reveals that this improvement is primarily achieved by reducing spatio-temporal redundancy and removing uninformative tokens, as supported by both quantitative and qualitative results.", 'score': 9, 'issue_id': 3197, 'pub_date': '2026-08-25', 'pub_date_card': {'ru': '25 августа', 'en': 'August 25', 'zh': '8月25日'}, 'hash': 'eddde15c96e13f79', 'authors': ['Yeonkyeong Lee', 'Hyunsung Go', 'Jongmin Kim', 'Sewoong Lim', 'Donghoon Lee'], 'affiliations': ['Kakao Corp., Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2608.24293.jpg', 'data': {'categories': ['#training', '#diffusion', '#architecture', '#video', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Адаптивное сжатие видео через умное удаление лишних токенов', 'desc': 'KATok — это адаптивный трансформер-основанный видео-токенизатор, который избирательно удаляет неинформативные токены для достижения зависящего от данных сжатия видеоинформации. В работе предлагается улучшение традиционных VAE (вариационных автокодировщиков), которые используют фиксированные коэффициенты сжатия и плохо адаптируются к изменяющейся сложности видеоконтента. Модель включает адаптивный селектор токенов, который совместно обучается с латентными представлениями и оценивает информативность каждого токена через вероятность сохранения или удаления. Для предотвращения пространственной рассинхронизации при генерации предложены стратегии каскадного и совместного предсказания позиций токенов, что обеспечивает пространственную согласованность в диффузионных моделях.'}, 'en': {'title': 'Adaptive Video Tokenization for Efficient Synthesis', 'desc': 'KATok is a novel video tokenizer that uses a transformer-based architecture to adaptively compress video data by selectively dropping less informative tokens. This approach allows for data-dependent compression, which means it adjusts the amount of data it keeps based on the complexity of the video content. By integrating an adaptive token selector with variational autoencoders (VAEs), KATok maintains high visual quality while improving computational efficiency. Additionally, it employs strategies to ensure that the spatial structure of the video remains intact, even when some tokens are removed, leading to better performance in video synthesis tasks.'}, 'zh': {'title': '自适应视频标记，提升压缩与生成质量', 'desc': 'KATok是一种自适应的基于变压器的视频标记器，它通过选择性丢弃无信息的标记来实现数据依赖的压缩，同时保持扩散生成的空间一致性。传统的变分自编码器（VAE）在处理视频数据时效果不佳，因为它们使用固定的压缩比，无法适应时空内容的复杂性变化。KATok通过联合学习自适应标记选择器，评估每个标记的内容丰富度，从而有效丢弃无信息的标记，实现自然的数据依赖压缩。我们的模型在压缩比方面达到了最先进的水平，同时在重建和生成质量上表现出色，主要通过减少时空冗余和去除无信息标记来实现。'}}}, {'id': 'https://huggingface.co/papers/2608.31022', 'title': 'MNIST-PRO: MNIST is Back as a Partially Observable World for AI Agents', 'url': 'https://huggingface.co/papers/2608.31022', 'abstract': 'Abstract The MNIST-PRO benchmark isolates perceptual-state construction in partially observable settings, revealing that multimodal agents struggle to integrate fragmented glimpses, continue exploring, and revise incorrect beliefs.  Generated by thinkingmachines/Inkling-Small AI agents in partially observable environments need to coordinate active sensing with working memory to maintain an evolving perceptual state. However, existing benchmarks struggle to isolate this perceptual-state construction and interpretation capability because they introduce physical and control complexities. We address this with MNIST-PRO, a benchmark that isolates agentic perception by converting MNIST digit recognition into a sequential, glimpse-based search task with lookback constraints. We evaluate ten multimodal models across four memory representations, including raw visual history, textual states, structured metric grid maps, and a consolidated visual canvas. While models excel under full observability, partial observability exposes a clear performance gap. We identify three distinct bottlenecks. First, perceptual-state construction and interpretation present a challenge, as agents struggle to integrate fragmented glimpses. Second, agents often stop exploring before they see the full sequence. Third, models often fail to revise early, incorrect beliefs even when faced with subsequent contradictory evidence. These results show that simply acquiring visual evidence is not enough. Agents must also be able to build and update a reliable perceptual state.', 'score': 7, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '0789071e6ce85cd4', 'authors': ['Vernon Toh', 'Navonil Majumder', 'Zhengyuan Liu', 'Nancy F. Chen', 'Soujanya Poria'], 'affiliations': ['Agency for Science, Technology, and Research (A*STAR), Singapore', 'DeCLaRe Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.31022.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#dataset'], 'emoji': '🧩', 'ru': {'title': 'Головоломка восприятия: как агенты учатся видеть фрагменты реальности', 'desc': 'Статья представляет бенчмарк MNIST-PRO, который изучает способность многомодальных агентов строить перцептивное состояние в частично наблюдаемых средах. Исследователи преобразовали задачу распознавания цифр MNIST в последовательный поиск на основе фрагментарных взглядов, чтобы изолировать именно эту способность от других сложностей. Оценка десяти моделей выявила три основных проблемы: агенты плохо интегрируют фрагментированные визуальные данные, преждевременно прекращают исследование и не переосмысливают неправильные убеждения при наличии противоречивых доказательств. Результаты демонстрируют, что просто собирать визуальные данные недостаточно — агентам необходимо активно строить и обновлять надежное представление об окружающей среде.'}, 'en': {'title': 'Building Better Perception in AI: The MNIST-PRO Challenge', 'desc': 'The MNIST-PRO benchmark focuses on how agents perceive and understand their environment when they cannot see everything at once. It shows that multimodal agents have difficulty combining incomplete information, continuing to explore, and correcting wrong assumptions. The study evaluates various models on their ability to maintain a perceptual state while dealing with partial visibility. The findings highlight that effective perception requires not just gathering data, but also the ability to construct and update beliefs based on that data.'}, 'zh': {'title': '构建可靠感知状态的挑战', 'desc': 'MNIST-PRO基准测试专注于在部分可观察环境中构建感知状态，揭示了多模态智能体在整合碎片化信息、继续探索和修正错误信念方面的困难。该基准通过将MNIST数字识别转化为一个基于序列和回顾约束的搜索任务，来隔离智能体的感知能力。我们评估了十种多模态模型在四种记忆表示下的表现，发现模型在完全可观察的情况下表现良好，但在部分可观察的情况下存在明显的性能差距。结果表明，智能体不仅需要获取视觉证据，还必须能够构建和更新可靠的感知状态。'}}}, {'id': 'https://huggingface.co/papers/2608.30241', 'title': 'PaperBanana-Interact: Scientific Diagram Refinement with Multi-Turn Human Feedback', 'url': 'https://huggingface.co/papers/2608.30241', 'abstract': "Abstract A multi-turn benchmark and multi-agent system improve scientific diagram generation by reducing quality drift and feature forgetting across revision turns.  Generated by thinkingmachines/Inkling-Small Recent efforts have aimed to automate scientific diagram generation from paper content (Lin et al., 2026; Zhu et al., 2026a). However, fully satisfying an author's visual and communicative preferences in a single turn is challenging: in our formative user study (N = 14), all participants requested further revisions after viewing an initial draft, and 86% of them rated the refined diagrams as more satisfactory. Despite the clear demand, the multi-turn workflow remains largely underexplored. To bridge this gap, we present MTPaperBananaBench, a benchmark for multi-turn diagram generation containing 292 images annotated with 3,518 user requirements. To reduce expensive human studies and enable scalable benchmarking, we construct a user simulator that, at each turn, identifies unsatisfied requirements and converts k of them into natural language feedback. Evaluating both requirement satisfaction and overall diagram quality reveals two key failure modes shared across baseline multiturn systems: (1) quality drift, where diagram quality progressively declines over turns, and (2) forgetting, where previously implemented features are lost in subsequent turns. To address these issues, we introduce PaperBanana-Interact, a multi-agent system that refines diagrams via an internal critique-and-refine loop. PaperBanana-Interact consistently improves rather than degrades diagram quality across turns, outperforming baselines by 11.9-18.6 points in quality score and reducing forgetting by 3.7-6.2 points.", 'score': 6, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '3eccadc9d2b8d0bb', 'authors': ['Xueqing Wu', 'Ashwin Balasubramanian', 'Bingxuan Li', 'Dawei Zhu', 'Kai-Wei Chang', 'Yale Song', 'Yiwen Song', 'Rui Meng', 'Tomas Pfister', 'Nanyun Peng'], 'affiliations': ['Google', 'Peking University', 'University of California, Los Angeles', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2608.30241.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Мультиагентная система для итеративной генерации научных диаграмм без деградации качества', 'desc': 'В статье представлен новый бенчмарк MTPaperBananaBench для оценки многошаговой генерации научных диаграмм, содержащий 292 изображения с 3518 требованиями пользователей. Авторы выявили два ключевых проблемы при использовании существующих систем: деградацию качества на каждом шаге пересмотра и забывание ранее реализованных особенностей. Для решения этих проблем предложена мультиагентная система PaperBanana-Interact, которая использует внутренний цикл критики и переработки для улучшения диаграмм. Система демонстрирует стабильное улучшение качества диаграмм на каждом шаге, превосходя базовые модели на 11.9-18.6 пункта по метрике качества и снижая забывание на 3.7-6.2 пункта.'}, 'en': {'title': 'Enhancing Scientific Diagrams with Multi-Turn Refinement', 'desc': 'This paper presents a new approach to generating scientific diagrams through a multi-turn process, addressing the challenges of quality drift and feature forgetting. The authors introduce MTPaperBananaBench, a benchmark that includes a dataset of diagrams and user requirements to facilitate the evaluation of multi-turn diagram generation. They also develop a user simulator that provides feedback on unsatisfied requirements, enhancing the iterative refinement process. The proposed multi-agent system, PaperBanana-Interact, effectively improves diagram quality over multiple revisions, demonstrating significant advancements in user satisfaction and retention of features.'}, 'zh': {'title': '多轮生成，持续提升科学图表质量', 'desc': '这篇论文提出了一种多轮基准和多智能体系统，以改善科学图表生成，减少质量漂移和特征遗忘。研究表明，单次生成的图表难以满足作者的视觉和沟通需求，因此需要多次修订。为此，作者构建了MTPaperBananaBench基准，包含292幅图像和3518条用户需求，并设计了用户模拟器来生成自然语言反馈。通过引入PaperBanana-Interact系统，论文展示了如何在多轮生成中持续提高图表质量，显著减少遗忘现象。'}}}, {'id': 'https://huggingface.co/papers/2608.30396', 'title': 'Scaffolding Foundation Models into Physical-World Agents Pushes the Frontier of Long-Horizon Navigation', 'url': 'https://huggingface.co/papers/2608.30396', 'abstract': "Abstract NavMCP integrates vision-language reasoning with navigation execution via structured collaboration channels to enable persistent long-horizon embodied exploration without retraining.  Generated by thinkingmachines/Inkling-Small Long-horizon physical-world agents must reason over distant goals while grounding decisions in reliable closed-loop behavior. Today's foundation models split these capabilities: vision-language models (VLMs) infer missing information and adapt high-level plans but remain brittle and inefficient at repeated navigation grounding, while navigation foundation models (NFMs) robustly execute semantic goals but operate as bounded episodes without persistent task-level reasoning. We introduce NavMCP, an agentic scaffolding framework that couples a VLM reasoning agent with an NFM executor for long-horizon exploration. The VLM decides what evidence to seek, where to search, and when to stop, while the NFM grounds each semantic sub-goal into closed-loop navigation. Three channels structure their collaboration: intent translates evidence needs into navigation calls, observation converts rollouts into source-grounded trajectory evidence, and memory accumulates findings, negative evidence, and unresolved goals across calls. This design turns isolated navigation rollouts into persistent embodied interaction without retraining either model. On Embodied Question Answering, NavMCP achieves state-of-the-art results on HM-EQA, MT-HM3D, and EXPRESS-Bench. Under matched agent and executor backbones, it outperforms an episodic interface by 14.9 percentage points on HM-EQA. On a Unitree Go2, NavMCP reaches 78.3% success, with its margin over the strongest baseline growing from 10 to 45 points as the task horizon increases. These results demonstrate the potential of scaffolding complementary foundation models into long-horizon physical-world agents.", 'score': 6, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '6ce8d7fa16b39dfb', 'authors': ['Zixing Lei', 'Gengze Zhou', 'Xiong-Hui Chen', 'Jiazhao Zhang', 'Yiyang Huang', 'Hang Yin', 'Haoqi Yuan', 'Qi Wu', 'Weixin Li', 'Siheng Chen'], 'affiliations': ['AIML, Adelaide University', 'Peking University', 'Qwen Team, Alibaba Inc', 'Shanghai Jiao Tong University', 'Tsinghua University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2608.30396.jpg', 'data': {'categories': ['#multimodal', '#long_context', '#reasoning', '#robotics', '#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Постоянное взаимодействие: связь рассуждений и навигации для долгосрочной роботической разведки', 'desc': 'NavMCP — это фреймворк для долгосрочной навигации воплощённых агентов, который объединяет возможности моделей зрения и языка с моделями навигации через структурированные каналы коммуникации. Видео-языковая модель принимает высокоуровневые решения о том, какую информацию искать и когда остановиться, а модель навигации превращает семантические подцели в точное управление движением робота. Три канала обеспечивают их взаимодействие: намерение преобразует потребности в доказательства в навигационные вызовы, наблюдение конвертирует траектории в свидетельства, а память накапливает результаты и нерешённые задачи. Система достигает лучших результатов на тестах для ответов на вопросы в физическом мире и на реальном роботе без переобучения исходных моделей.'}, 'en': {'title': 'Empowering Long-Horizon Exploration with NavMCP', 'desc': 'NavMCP is a framework that combines vision-language reasoning with navigation execution to allow agents to explore their environment over long periods without needing retraining. It addresses the limitations of current models by integrating a vision-language model (VLM) that plans and reasons with a navigation foundation model (NFM) that executes tasks. The collaboration is structured through three channels: intent, observation, and memory, which help the VLM decide what to look for and the NFM to navigate effectively. This innovative approach leads to improved performance in tasks like Embodied Question Answering, showcasing the effectiveness of combining these models for persistent exploration.'}, 'zh': {'title': 'NavMCP：持久探索的新方法', 'desc': 'NavMCP是一种将视觉-语言推理与导航执行相结合的框架，旨在实现持久的长时间探索而无需重新训练。该框架通过结构化的协作通道，使得视觉-语言模型（VLM）和导航基础模型（NFM）能够有效合作。VLM负责决定需要寻找的证据和搜索的地点，而NFM则将每个语义子目标转化为闭环导航。NavMCP在多个基准测试中表现出色，显示了将互补基础模型整合为长时间物理世界代理的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.30147', 'title': 'CAST: Critique-Aware Supervision for Training Reliable Long-Horizon Tool-Calling Agents', 'url': 'https://huggingface.co/papers/2608.30147', 'abstract': 'Abstract CAST improves LLM agent reliability by generating structured action-level rationales from sparse outcomes to train critique and policy models.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents are increasingly deployed in long-horizon, interactive, and stateful environments. In these settings, a single wrong action, such as refunding the wrong purchase, can cause irreversible task failure and must be intercepted before execution. Such failures may not appear in every single run, but can emerge across repeated trials, making reliability across steps and trials critical. However, ensuring agentic reliability is challenging: even frontier LLMs struggle to explain why an action may be wrong, especially in long, intertwined trajectories governed by domain-specific policies. Much recent work relies on prompt-based critique agents, while optimization-based methods lack a systematic way to produce rich verification rationales for training. We address this gap with CAST, a critique-aware training framework that converts sparse task outcomes into action-level supervision for critique learning and policy optimization. CAST analyzes agent trajectories to synthesize structured rationales explaining action validity under partial observability. The resulting critique model is used to construct critique-aware training data for optimizing the policy model. Fine-tuning Qwen3-family models on dynamic tool-calling benchmarks, CAST improves reliability across domains, outperforming GPT-OSS-120B by over 10% pass^4 on Retail tasks and yielding an additional 9% improvement on Telehealth in an out-of-domain setting. These results demonstrate that critique-aware training improves the robustness of LLM agents in realistic dynamic environments.', 'score': 6, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'de90ebe731cd92f8', 'authors': ['Amir Saeidi', 'Zehua Zhang', 'Rishitosh Singh', 'Naman Ahuja', 'Vivek Gupta', 'Ali Payani', 'Gaowen Liu', 'Jayanth Srinivasa', 'Chitta Baral'], 'affiliations': ['Arizona State University', 'Cisco Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.30147.jpg', 'data': {'categories': ['#agents', '#rlhf', '#training'], 'emoji': '🔍', 'ru': {'title': 'Критический взгляд на надежность: обучение агентов через обоснования действий', 'desc': 'CAST — это фреймворк для обучения агентов на основе больших языковых моделей, который преобразует разреженные результаты задач в подробные объяснения на уровне действий. Метод анализирует траектории агента и генерирует структурированные обоснования, объясняющие корректность каждого действия в условиях частичной наблюдаемости. Сгенерированные обоснования используются для обучения модели-критика, которая впоследствии помогает оптимизировать саму политику агента. Экспериментальные результаты показывают значительное улучшение надежности LLM-агентов на практических задачах в розницы и здравоохранении, превосходя базовые модели на 10-9%.'}, 'en': {'title': 'Enhancing LLM Reliability with Structured Action Rationales', 'desc': 'The paper presents CAST, a framework designed to enhance the reliability of large language model (LLM) agents in complex, interactive environments. It generates structured rationales for actions taken by the agents, which helps in training both critique and policy models. By analyzing agent trajectories, CAST provides explanations for action validity, addressing the challenge of ensuring agent reliability in long-term tasks. The results show that CAST significantly improves the performance of LLMs in various domains, demonstrating the effectiveness of critique-aware training.'}, 'zh': {'title': 'CAST：提升LLM代理可靠性的批评感知训练框架', 'desc': 'CAST是一种改进大型语言模型（LLM）代理可靠性的训练框架，通过从稀疏的任务结果中生成结构化的行动级推理来训练批评和策略模型。在长时间交互和状态保持的环境中，单个错误的行动可能导致不可逆的任务失败，因此必须在执行前进行拦截。CAST通过分析代理轨迹，合成解释行动有效性的结构化推理，从而为批评学习和策略优化提供稀疏任务结果的行动级监督。实验结果表明，CAST在多个领域中提高了LLM代理的可靠性，显著优于现有模型。'}}}, {'id': 'https://huggingface.co/papers/2608.28695', 'title': 'Weaving Visual Narratives: Agentic Image Bundle Composition Beyond Atomic Visual Matching', 'url': 'https://huggingface.co/papers/2608.28695', 'abstract': 'Abstract Image Bundle Composition reframes retrieval as dynamic assembly of relationally coherent image groups, with a benchmark and agentic framework addressing combinatorial joint relevance.  Generated by thinkingmachines/Inkling-Small Image retrieval has traditionally been formulated as a point-wise matching problem, where each candidate image is scored in isolation. However, this atomic paradigm fails to capture the complexity of human search intent within personal photo collections, where users often seek compact visual stories bound by structural relations rather than isolated snapshots. To address this limitation, we introduce **Image Bundle Composition (IBC)**, a novel paradigm that shifts the objective from ranking individual images to dynamically composing cohesive image bundles from a massive, unstructured photo pool. Since target bundles are not predefined, IBC presents a severe combinatorial explosion challenge and demands modeling non-decomposable joint relevance. To establish this paradigm, we construct **IBCBench**, the first IBC benchmark dataset containing 109,467 images and 667 verified queries, built via a semi-automated verification pipeline. Furthermore, we propose **BundleWeaver**, an agentic framework that reformulates IBC as query-conditioned incremental hyperedge discovery. By employing a Large Language Model to adaptively search for missing relational roles and utilizing a Vision-Language Model for whole-bundle verification, BundleWeaver effectively navigates the combinatorial space. Extensive experiments demonstrate that while state-of-the-art embedding models and static decompose-and-rerank paradigms suffer from relational blindness, BundleWeaver achieves substantial performance gains, highlighting the necessity of shifting from atomic scoring to dynamic relational composition. Our dataset and code are available.', 'score': 6, 'issue_id': 3196, 'pub_date': '2026-08-27', 'pub_date_card': {'ru': '27 августа', 'en': 'August 27', 'zh': '8月27日'}, 'hash': '85dc492dedf88f99', 'authors': ['Rong Shan', 'Tianyi Xu', 'Congmin Zheng', 'Wenteng Chen', 'Jiachen Zhu', 'Junjie Wu', 'Teng Wang', 'Weiwen Liu', 'Changwang Zhang', 'Weinan Zhang', 'Jun Wang', 'Jianghao Lin'], 'affiliations': ['OPPO', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.28695.jpg', 'data': {'categories': ['#multimodal', '#cv', '#agents', '#benchmark', '#dataset'], 'emoji': '📸', 'ru': {'title': 'От поиска отдельных фото к составлению визуальных историй через релационную композицию', 'desc': 'Работа представляет новую парадигму для поиска изображений, которая переходит от оценки отдельных снимков к динамическому составлению связных групп изображений. Авторы вводят понятие Image Bundle Composition (IBC), которое учитывает структурные отношения между фотографиями при поиске в больших неструктурированных коллекциях. Для решения этой задачи создана база IBCBench с более чем 100 тысячами изображений и предложена система BundleWeaver, которая использует LLM и Vision-Language модели для поиска и верификации релевантных связей между изображениями. Экспериментальные результаты показывают, что агентный подход значительно превосходит традиционные методы ранжирования, демонстрируя важность перехода от изолированной оценки к композиции на основе отношений.'}, 'en': {'title': 'Dynamic Image Retrieval through Cohesive Bundles', 'desc': 'This paper introduces a new approach called Image Bundle Composition (IBC) for retrieving images that are contextually related, rather than evaluating them individually. Traditional image retrieval methods score images one at a time, which does not reflect how people search for groups of images that tell a story. IBC focuses on creating cohesive bundles of images from a large collection, addressing the challenge of combinatorial relevance where images must be related in a meaningful way. The authors present a benchmark dataset, IBCBench, and a framework called BundleWeaver that uses advanced models to dynamically discover and verify these image bundles, showing improved performance over existing methods.'}, 'zh': {'title': '动态组合图像，提升检索效果', 'desc': '本文提出了一种新的图像检索方法，称为图像组合（IBC），旨在通过动态组合相关的图像组来提高检索效果。传统的图像检索方法通常是逐个评分，但这种方法无法满足用户在个人照片库中寻找视觉故事的需求。IBC通过从大量无结构的照片池中动态组合图像束，解决了组合相关性建模的挑战。我们还构建了IBCBench数据集，并提出了BundleWeaver框架，以适应性地发现缺失的关系角色，从而显著提升了检索性能。'}}}, {'id': 'https://huggingface.co/papers/2608.30530', 'title': 'WebWorld: The Browser as a World Model for Self-Improving Web Code', 'url': 'https://huggingface.co/papers/2608.30530', 'abstract': 'Abstract WebWorld uses a browser as an executable world model to certify web code repairs via interaction contracts, enabling autonomous VLM self-improvement with verified supervision.  Generated by thinkingmachines/Inkling-Small VLM-driven self-improvement of web code has a structural flaw: the model that proposes the repair is the model that judges it, and visual plausibility under that judge is a poor proxy for whether the page actually works. What the loop is missing is a counterparty the VLM cannot fool, and the browser already is that counterparty: a deterministic, executable simulator of how an HTML artifact behaves under user actions, and in everything but name a world model for web code. We present WebWorld, the interface that lets a VLM prior interact with this browser-as-world-model autonomously and decides which interactions become supervision. Each round, the VLM emits a critique that the planner compiles into a typed interaction contract; the browser re-executes the candidate and issues an acceptance certificate only when both target progress and preservation of every previously verified capability hold; certified transitions accumulate as a quality ratchet that is the only thing the SFT export ever sees. Under matched training, WebWorld-27B improves Raw-27B by 5.3 points on HTMLBench-400 and 14.9 points on MiniAppBench-Val, and reaches the level of strong frontier systems such as Kimi-K2.6 and GPT-5.4 on interactive HTML generation. Equal-size ablations show that browser-backed admission carries the gain: without the certificate, the matched 9B lift nearly disappears.', 'score': 5, 'issue_id': 3197, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '63c3f1cf186894c3', 'authors': ['Jiajun Wu', 'Jian Yang', 'Yaxin Du', 'Wei Zhang', 'Haowen Wang', 'Junhang Cheng', 'Yuxuan Zhang', 'Tuney Zheng', 'Xianglong Liu', 'Ming Zhou'], 'affiliations': ['Beihang University', 'IQuest Research', 'Langboat', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.30530.jpg', 'data': {'categories': ['#agents', '#multimodal', '#training', '#small_models'], 'emoji': '🌐', 'ru': {'title': 'Браузер как верификатор: самосовершенствование VLM через契約взаимодействия', 'desc': 'Статья представляет WebWorld — систему, которая использует браузер как исполняемую модель мира для проверки исправлений веб-кода через контракты взаимодействия. Основная проблема, которую решает работа, заключается в том, что в текущих подходах VLM одновременно предлагает исправления и оценивает их, что приводит к переподгонке к визуальной правдоподобности вместо функциональной корректности. WebWorld вводит внешний арбитр — браузер как детерминированный симулятор поведения HTML под пользовательскими действиями, который выдает сертификаты приемки только когда исправления сохраняют все ранее проверенные возможности. Экспериментальные результаты показывают значительное улучшение: модель WebWorld-27B превосходит базовую версию на 5.3 пункта по HTMLBench-400 и на 14.9 пункта по MiniAppBench-Val, достигая уровня сильных систем как Kimi-K2.6 и GPT-5.4.'}, 'en': {'title': 'WebWorld: Enhancing Web Code with Browser-Backed Verification', 'desc': 'WebWorld is a system that uses a web browser as a model to improve web code by verifying repairs through interaction contracts. It addresses a flaw in traditional self-improvement methods where the model proposing a fix also judges it, which can lead to unreliable results. By using the browser as an independent evaluator, WebWorld ensures that only verified improvements are accepted, creating a reliable feedback loop. The system has shown significant performance improvements in generating interactive HTML, demonstrating the effectiveness of this approach in machine learning applications.'}, 'zh': {'title': 'WebWorld：利用浏览器提升网页代码修复的智能系统', 'desc': 'WebWorld 是一个利用浏览器作为可执行世界模型的系统，用于通过交互合同认证网页代码的修复。这种方法解决了自我改进模型的结构缺陷，因为原本提出修复的模型也在判断修复的有效性。WebWorld 通过与浏览器的交互，使得 VLM 能够自主决定哪些交互成为监督，从而提高了网页代码的质量。实验结果表明，WebWorld 在多个基准测试中显著提升了性能，达到了与先进系统相当的水平。'}}}, {'id': 'https://huggingface.co/papers/2608.30135', 'title': 'Verification-Aware Training for Speculative Decoding', 'url': 'https://huggingface.co/papers/2608.30135', 'abstract': "Abstract Verification-Aware Training improves draft models for speculative decoding by simulating sequential verification during training and adapting loss weights to acceptance patterns.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates large language model inference by using a draft model to generate candidate tokens, which are verified by the target model in a single forward pass. Verification proceeds sequentially and discards every position from the first rejection onward, yet existing draft training relies on token-level imitation of the target with a fixed per-position weighting that reflects neither property. We introduce Verification-Aware Training (VAT), a plug-in framework that simulates verification at every training step and turns the resulting accept and reject patterns into supervision. VAT consists of two components: (i) a verification head, a lightweight jointly trained binary classifier that supervises the draft model on whether each position survives sequential verification; (ii) verification-adaptive weighting, which replaces the fixed weighting schedule by keeping full weight up to each sample's first rejection point and re-anchoring the decay to start there. VAT modifies only the training objective, so it can be layered on top of existing methods without changing the draft architecture, the target model, or the inference procedure. Applied to EAGLE-3 and DFlash on Qwen3-4B, Qwen3-8B, and LLaMA-3.1-8B, VAT improves average acceptance length by up to 11.4% and wall-clock speedup by up to 8.7%, with consistent gains across math, code, and chat benchmarks. Code will be available at https://github.com/naver-ai/vat", 'score': 4, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'df9f99d1070d4e3f', 'authors': ['Geonmo Gu', 'Byeongho Heo', 'HeeJae Jun', 'Yoohoon Kang', 'Sangmin Lee', 'Sangdoo Yun', 'Dongyoon Han'], 'affiliations': ['Korea University', 'NAVER AI Lab', 'NAVER AI Search Platform'], 'pdf_title_img': 'assets/pdf/title_img/2608.30135.jpg', 'data': {'categories': ['#training', '#inference', '#small_models'], 'emoji': '⚡', 'ru': {'title': 'Обучение, осознающее процесс верификации в спекулятивном декодировании', 'desc': 'Статья представляет Verification-Aware Training (VAT) — метод улучшения черновиковых моделей для спекулятивного декодирования путём симуляции процесса верификации во время обучения. VAT использует два компонента: классификатор верификации, который предсказывает выживаемость каждой позиции токена при проверке целевой моделью, и адаптивное взвешивание потерь, которое присваивает больший вес токенам до первого отклонения. Метод интегрируется только в процесс обучения, не требуя изменений архитектуры модели или процедуры инференса. Экспериментальные результаты показывают улучшение длины принятой последовательности до 11.4% и ускорение инференса до 8.7% на различных задачах.'}, 'en': {'title': 'Enhancing Speculative Decoding with Verification-Aware Training', 'desc': 'The paper introduces Verification-Aware Training (VAT), a method that enhances draft models used in speculative decoding for large language models. VAT simulates the verification process during training, allowing the model to learn from acceptance and rejection patterns of generated tokens. It features a verification head that acts as a binary classifier to guide the draft model on which tokens are likely to be accepted. By adapting the loss weights based on the first rejection point, VAT improves both the efficiency and effectiveness of the model, leading to significant performance gains in various benchmarks.'}, 'zh': {'title': '验证感知训练提升推理效率', 'desc': '验证感知训练（VAT）通过在训练过程中模拟顺序验证，改进了草稿模型以加速推理。它引入了一个轻量级的验证头，作为二分类器来判断每个位置是否通过验证，并根据接受模式调整损失权重。VAT的训练目标仅进行修改，因此可以在不改变草稿架构和目标模型的情况下，叠加在现有方法上。应用于多个大型语言模型后，VAT在接受长度和推理速度上均有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.29847', 'title': 'ContextBias: Controlled Evaluation of Bias Persistence Under Context Shift in Text-to-Image Models', 'url': 'https://huggingface.co/papers/2608.29847', 'abstract': "Abstract Text-to-image models exhibit persistent role-linked visual stereotypes across varied contexts, with cross-role attribute concentration increasing rather than diminishing under unrelated prompts.  Generated by thinkingmachines/Inkling-Small Text-to-image models learn associations between concepts - in the case of this paper, people's professions, which we refer to as roles - and visual attributes. These associations can underpin many observed forms of stereotypical bias. A key open question in this area is whether these associations are stable or change when visual representations of people in professional roles are placed in different prompted contexts. We introduce ContextBias, a controlled evaluation framework, and ContextBench, a benchmark spanning 92 roles and 1,656 semantically controlled prompts, designed to isolate the effect of contextual variation on role-linked visual representations. Evaluating four state-of-the-art models on 66,240 generated images, we find that placing a role in a semantically unrelated context does not suppress role-linked attributes; instead, cross-role attribute concentration increases (pooled BI +0.047). Demographic cues, characteristic garments, and role-specific tools remain highly prevalent across context-free, related, and unrelated conditions, and are robust to semantic prompt reformulation. Scene composition and camera framing show the greatest context-sensitivity. These findings reveal a form of stereotypical persistence that remains largely invisible to context-free evaluations, highlighting the need for controlled contextual variation in bias benchmarking. Code and dataset: https://huggingface.co/datasets/shaghayegh/ContextBias , https://github.com/Sina-Emami/ContextBias", 'score': 4, 'issue_id': 3198, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': 'aee3900f3d324bc8', 'authors': ['Shaghayegh Kolli', 'Sina Emami', "Moreno D'Incà", 'Pouyan Nejadi', 'Nicu Sebe', 'Massimiliano Mancini', 'Jana Diesner'], 'affiliations': ['Munich Center for Machine Learning (MCML)', 'Munich Data Science Institute (MDSI)', 'Orreco', 'Technical University of Munich', 'University of Trento'], 'pdf_title_img': 'assets/pdf/title_img/2608.29847.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#dataset', '#cv'], 'emoji': '👔', 'ru': {'title': 'Стереотипы в картинках: почему контекст не спасает от предубеждений', 'desc': 'В этой работе исследуется, как текст-изображение модели воспроизводят стереотипы, связанные с профессиональными ролями, в различных контекстах. Авторы предложили ContextBias — фреймворк для контролируемого тестирования и ContextBench — бенчмарк с 92 профессиональными ролями и 1656 семантически контролируемыми промптами. Оценив четыре современные генеративные модели на 66240 сгенерированных изображениях, исследователи обнаружили, что помещение роли в семантически не связанный контекст не подавляет связанные с ролью визуальные атрибуты, а наоборот усиливает их концентрацию. Демографические признаки, одежда и инструменты остаются стабильными и устойчивыми к переформулировкам промптов, что указывает на глубокие стереотипные смещения в современных моделях.'}, 'en': {'title': 'Unmasking Stereotypes: Context Matters in AI Image Generation', 'desc': "This paper investigates how text-to-image models maintain visual stereotypes related to people's professions, even when placed in different contexts. The authors introduce a framework called ContextBias and a benchmark called ContextBench to evaluate the impact of context on these role-linked visual representations. Their findings show that rather than reducing stereotypical attributes, unrelated contexts can actually increase the concentration of these attributes in generated images. This highlights the persistence of bias in AI models and the importance of considering contextual variations in bias assessments."}, 'zh': {'title': '揭示视觉刻板印象的持久性', 'desc': '这篇论文探讨了文本到图像模型在不同上下文中表现出的角色相关视觉刻板印象。研究发现，当将职业角色放置在语义无关的上下文中时，角色相关属性的集中度反而增加，而不是减少。通过引入ContextBias评估框架和ContextBench基准，研究者评估了四个最先进的模型在66,240张生成图像上的表现。结果显示，尽管上下文变化，角色的特征仍然显著存在，强调了在偏见基准测试中需要控制上下文变化的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.29098', 'title': 'SafeAtlas-VL: Beyond Binary Multimodal Safety with Large-Scale Data and Guard Models', 'url': 'https://huggingface.co/papers/2608.29098', 'abstract': 'Abstract SafeAtlas-VL introduces a large-scale multimodal safety dataset with graded risk labels and trains guard models that predict continuous safety scores, achieving state-of-the-art generalization.  Generated by thinkingmachines/Inkling-Small Multimodal safety moderation requires distinguishing risks arising from visual content, user intent, and assistant behavior. Existing safeguards, however, are typically trained for a single judgment target and reduce safety assessment to a binary decision. Consequently, risk becomes difficult to compare across a multimodal interaction, and ambiguous cases are obscured. We introduce SafeAtlas-VL, a dataset of 1.5M training instances that places image-, request-, and response-level judgments on a five-level ordered scale. We curate a broad collection of safety-relevant data from both real-world and synthetic sources and apply a disagreement-aware annotation procedure. The resulting dataset spans 15 harm categories and 55 fine-grained subcategories, covering a broad range of multimodal safety scenarios. We also construct SafeAtlas-Bench, a held-out set of 5,000 instances for evaluating five-level predictions and continuous risk scores. Upon this dataset, we train the SafeAtlas Guard series of models via target-conditioned tuning for multimodal safety detection. Our models not only perform five-way classification of safety levels but also map safety to continuous scores through a soft cumulative ordinal head. Experimental results demonstrate that guard models trained on our dataset exhibit strong generalization: even without using the training sets of other benchmarks, they achieve competitive performance on the corresponding test sets. Notably, our 8B model attains the overall best performance, outperforming the previous SOTA by approximately 4% in F1 score. Code, data, and models are released to support further research. Warning: this paper contains example data that may be offensive, harmful, graphic, or disturbing.', 'score': 4, 'issue_id': 3197, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'ae0eb65fbcd08293', 'authors': ['Zongrui Wang', 'Xiangyang Zhu', 'Sicheng Wang', 'Han Wang', 'Dingyi Rong', 'Zeyu Zhang', 'Chunyi Li', 'Yue Shi', 'Kaiwei Zhang', 'Zicheng Zhang', 'Yuan Tian', 'Qi Jia', 'Yan Teng', 'Wei Sun', 'Ning Liu', 'Guangtao Zhai'], 'affiliations': ['East China Normal University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.29098.jpg', 'data': {'categories': ['#training', '#synthetic', '#benchmark', '#dataset', '#multimodal', '#open_source', '#ethics'], 'emoji': '🛡️', 'ru': {'title': 'Непрерывная оценка мультимодальной безопасности вместо бинарных решений', 'desc': 'SafeAtlas-VL представляет большой мультимодальный датасет для оценки безопасности контента с градуированными метками риска, содержащий 1.5 млн примеров обучающих данных. Авторы развивают подход к модерации безопасности, который оценивает риски на пятиуровневой порядковой шкале вместо бинарной классификации, учитывая изображения, запросы пользователей и ответы ассистента. Они обучают модели SafeAtlas Guard с использованием целевого условного fine-tuning для предсказания уровней безопасности и непрерывных оценок риска через soft cumulative ordinal head. Экспериментальные результаты показывают, что предложенные модели достигают лучшей генерализации и превосходят предыдущие SOTA результаты на 4% по F1 метрике.'}, 'en': {'title': 'Revolutionizing Multimodal Safety Assessment with Graded Risk Labels', 'desc': 'SafeAtlas-VL presents a new dataset designed for multimodal safety assessment, featuring 1.5 million instances with graded risk labels across various categories. It addresses the limitations of existing models that typically classify safety into binary outcomes, allowing for a more nuanced understanding of risk through a five-level scale. The dataset includes diverse data sources and employs a unique annotation process to ensure comprehensive coverage of safety scenarios. The trained SafeAtlas Guard models demonstrate strong generalization capabilities, achieving state-of-the-art performance in predicting both categorical safety levels and continuous risk scores.'}, 'zh': {'title': '多模态安全检测的新标准', 'desc': 'SafeAtlas-VL 是一个大规模的多模态安全数据集，具有分级风险标签，并训练了能够预测连续安全分数的守护模型，达到了最先进的泛化能力。该数据集包含150万条训练实例，涵盖了图像、请求和响应级别的判断，并采用五级有序评分。我们从真实和合成来源中收集了广泛的安全相关数据，并应用了考虑分歧的标注程序，涵盖了15个伤害类别和55个细分类别。实验结果表明，基于该数据集训练的守护模型在多模态安全检测中表现出强大的泛化能力，尤其是我们的8B模型在F1分数上超越了之前的最先进模型约4%。'}}}, {'id': 'https://huggingface.co/papers/2608.31113', 'title': 'BLARM: Animating 3D Objects from Video via Blending Latent Rigid Motion Primitives', 'url': 'https://huggingface.co/papers/2608.31113', 'abstract': 'Abstract BLARM predicts temporally coherent 3D mesh animations from monocular video using learned rigid motion components and skinning weights without explicit rigs.  Generated by thinkingmachines/Inkling-Small We introduce BLARM, a feed-forward method for video-driven 3D mesh animation. Given a monocular video and a static object mesh, BLARM predicts a temporally coherent animated mesh whose motion follows the video. Rather than relying on explicit rigs or directly regressing high-dimensional vertex motion, we represent animation using a compact set of learned, time-varying rigid motion components and time-invariant vertex-to-component skinning weights. This yields a low-dimensional deformation space without requiring skeletons, cages, skinning weights, or rig annotations. Our architecture conditions geometry-derived deformation latents on video features through factorized spatial-temporal attention, then decodes rigid transformations blended by predicted skinning weights. Trained with trajectory reconstruction, entropy regularization, and motion-aware contrastive learning, BLARM produces accurate and temporally stable animations while recovering compact, interpretable motion structure from monocular video.', 'score': 2, 'issue_id': 3196, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': 'cecba0c9908a0e77', 'authors': ['Pradyumn Goyal', 'Yizhak Ben-Shabat', 'Hsueh-Ti Derek Liu', 'Haomiao Jiang', 'Snehasish Mukherjee', 'Kyle Spence', 'Mark Stauber', 'Evangelos Kalogerakis', 'Yunze Zeng'], 'affiliations': ['Roblox', 'TU Crete', 'UMass Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2608.31113.jpg', 'data': {'categories': ['#training', '#architecture', '#video', '#3d'], 'emoji': '🎬', 'ru': {'title': 'Оживление 3D моделей из видео без явного скелета', 'desc': 'BLARM — это нейросетевой метод для создания анимированных 3D моделей из видео, снятого одной камерой. Вместо использования явных скелетов или регрессии движения каждой вершины, система представляет движение через набор выученных жёстких компонент и веса наложения вершин на эти компоненты. Архитектура использует пространственно-временное внимание для связи признаков видео с деформациями геометрии и декодирует трансформации, смешиваемые предсказанными весами. Модель обучается с использованием реконструкции траектории, регуляризации энтропии и контрастивного обучения для получения точной и временно-стабильной анимации.'}, 'en': {'title': 'Animating 3D Meshes from Video without Rigs!', 'desc': 'BLARM is a novel method that generates 3D mesh animations from a single video input without the need for traditional rigging techniques. It utilizes learned rigid motion components and skinning weights to create smooth and coherent animations that align with the video content. By employing a compact representation of motion and a unique architecture that combines spatial-temporal attention, BLARM efficiently captures the dynamics of the scene. The model is trained using advanced techniques like trajectory reconstruction and motion-aware contrastive learning to ensure high-quality and stable animations.'}, 'zh': {'title': '从单目视频生成稳定的3D动画', 'desc': 'BLARM是一种前馈方法，可以从单目视频中预测时间一致的3D网格动画。它使用学习到的刚性运动组件和皮肤权重，而不需要显式的骨架。该方法通过因子化的时空注意力，将几何派生的变形潜变量与视频特征相结合，从而生成低维的变形空间。BLARM在训练过程中采用轨迹重建、熵正则化和运动感知对比学习，能够生成准确且时间稳定的动画。'}}}, {'id': 'https://huggingface.co/papers/2608.30209', 'title': 'DICS: Exploring Data Intrinsic Consistency for Visual Instruction Selection', 'url': 'https://huggingface.co/papers/2608.30209', 'abstract': 'Abstract DICS selects high-quality visual instruction data by measuring internal sample consistency, improving model performance with far less training data.  Generated by thinkingmachines/Inkling-Small Visual instruction tuning is crucial for advancing the vision-language alignment and instruction-following capabilities of Vision-Language Models (VLMs). However, identifying optimal subsets under a fixed ratio constraint from rapidly expanding datasets remains a significant bottleneck. While existing methods largely depend on distribution diversity or heuristic filtering, they often overlook the internal coherence within individual samples. To bridge this gap, we propose Data Intrinsic Consistency (DIC), a self-scoring metric designed to quantify the sample-level inter-component consistency. DIC consists of two modules: Visual Information Consistency (VIC), evaluating the alignment between visual content and instructions, and Response Information Consistency (RIC), assessing response coherence relative to the instruction. Building upon DIC, we introduce Data Intrinsic Consistency Selection (DICS), an adaptive data selection method that optimizes the trade-off between high intra-sample consistency and global distributional diversity under varying data budgets. Extensive experiments demonstrate that DICS consistently outperforms state-of-the-art methods across diverse dataset scales and model architectures, surpassing full-dataset fine-tuning while using only 25% of the LLaVA-1.5-665K data. We further curate DICS-6M, a 6M-sample multi-modal instruction corpus that enables the largest-scale visual instruction selection study to date; remarkably, DICS reaches 94.52\\% of the official InternVL3-8B-Instruct performance using less than 25\\% of its reported training data. Code can be seen at https://github.com/cqu-student/DICS', 'score': 2, 'issue_id': 3197, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '376c5e1cbadbfaaa', 'authors': ['Yuyang Hong', 'Jinhui Guo', 'Jiaqi Gu', 'Lubin Fan', 'Ruixiang Wang', 'Kun Ding', 'Yue Wu', 'Shiming Xiang', 'Jieping Ye'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'MAIS, Institute of Automation, Chinese Academy of Sciences', 'School of Artificial Intelligence, University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.30209.jpg', 'data': {'categories': ['#multimodal', '#data', '#dataset', '#training'], 'emoji': '✨', 'ru': {'title': 'Отбор данных через внутреннюю согласованность образцов', 'desc': 'В работе предложен метод DICS для отбора высококачественных данных визуальных инструкций путём измерения внутренней согласованности образцов. Метод состоит из двух компонентов: оценки соответствия между визуальным содержимым и инструкциями, а также оценки логичности ответов относительно задания. DICS балансирует между качеством отдельных образцов и разнообразием данных, адаптируясь к различным объёмам доступных данных для обучения. Эксперименты показывают, что предложенный подход превосходит существующие методы выбора данных, достигая производительности полного датасета при использовании всего 25% обучающих примеров.'}, 'en': {'title': 'Optimizing Visual Instruction Data Selection with DICS', 'desc': 'This paper introduces Data Intrinsic Consistency (DIC), a new metric for evaluating the quality of visual instruction data by measuring the internal consistency of samples. DIC includes two components: Visual Information Consistency (VIC), which checks how well visual content matches instructions, and Response Information Consistency (RIC), which assesses how coherent responses are to those instructions. The authors propose Data Intrinsic Consistency Selection (DICS), a method that selects high-quality data while balancing sample consistency and overall dataset diversity, allowing for effective training with less data. Experiments show that DICS outperforms existing methods, achieving high performance with only a fraction of the training data needed by traditional approaches.'}, 'zh': {'title': '高效选择视觉指令数据，提升模型性能', 'desc': '本文提出了一种名为数据内在一致性选择（DICS）的方法，通过测量样本内部一致性来选择高质量的视觉指令数据，从而在使用更少的训练数据的情况下提高模型性能。DICS结合了视觉信息一致性（VIC）和响应信息一致性（RIC）两个模块，分别评估视觉内容与指令之间的对齐程度和响应与指令之间的一致性。该方法在不同的数据预算下优化了样本内部一致性与全局分布多样性之间的权衡。实验结果表明，DICS在多种数据集规模和模型架构上均优于现有的最先进方法，且仅使用LLaVA-1.5-665K数据的25%就达到了接近完整数据集微调的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.29974', 'title': 'SpanCalib-VLM: Calibrated Hallucination Span Detection in Vision-Language Models', 'url': 'https://huggingface.co/papers/2608.29974', 'abstract': 'Abstract A hybrid system combining a multimodal sequence tagger and a generative vision-language model improves hallucination span detection and calibration through union-calibrated fusion.  Generated by thinkingmachines/Inkling-Small Detecting hallucinations in Large Vision-Language Models (LVLMs) requires both accurate span localization and well-calibrated confidence scores. Fine-tuned generative VLMs excel at identifying hallucinated text spans but suffer from overconfidence and high inference latency. Discriminative sequence taggers offer deterministic speed and superior calibration but exhibit conservative span recall. We present SpanCalib-VLM, a hybrid dual-system for the SHROOM-Visions Shared Task that combines a multimodal sequence tagger, consisting of XLM-RoBERTa-Large fused with a SigLIP vision encoder via cross-attention, with our fine-tuned generative VLM (Qwen3.5-4B-SHROOM-SFT). Through a Union-Calibrated Fusion strategy, candidate spans from the generative model are re-scored with calibrated probabilities from the sequence tagger. On the SHROOM-Visions English evaluation split, our ensemble achieves a Pearson calibration correlation of 0.41 and an overall IoU of 0.39, with a clean-response IoU of 0.91} and overall detection accuracy of 70.7%. We make our model weights and code publicly available.', 'score': 2, 'issue_id': 3198, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': '3b538f95ac8d1084', 'authors': ['Amanuel Gizachew Abebe', 'Yasmin Moslem'], 'affiliations': ['Shaggar Institute of Technology', 'Trinity College Dublin'], 'pdf_title_img': 'assets/pdf/title_img/2608.29974.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#open_source', '#training', '#cv', '#hallucinations', '#small_models'], 'emoji': '🎭', 'ru': {'title': 'Гибридная система для обнаружения галлюцинаций в видео-языковых моделях через калиброванное слияние', 'desc': 'В работе предлагается гибридная система для обнаружения галлюцинаций в больших видео-языковых моделях, которая объединяет дискриминативный многомодальный последовательный тэггер на основе XLM-RoBERTa и SigLIP с генеративной моделью Qwen. Последовательный тэггер обеспечивает быструю и хорошо калиброванную работу, а генеративная модель точнее локализирует ошибочные фрагменты текста. Ключевой вклад - стратегия Union-Calibrated Fusion, которая пересчитывает вероятности кандидатов из генеративной модели, используя калиброванные оценки уверенности от тэггера. Система достигла высоких результатов на тестовом наборе SHROOM-Visions с коррелляцией калибровки 0.41 и точностью обнаружения 70.7%.'}, 'en': {'title': 'Enhancing Hallucination Detection with Hybrid Models', 'desc': "This paper introduces SpanCalib-VLM, a hybrid system designed to enhance the detection of hallucination spans in Large Vision-Language Models (LVLMs). It combines a multimodal sequence tagger with a generative vision-language model to improve both the accuracy of span localization and the calibration of confidence scores. The system utilizes a Union-Calibrated Fusion strategy, which allows the generative model's candidate spans to be re-evaluated with calibrated probabilities from the sequence tagger. The results show significant improvements in calibration and detection accuracy, demonstrating the effectiveness of this dual-system approach."}, 'zh': {'title': '混合系统提升幻觉检测与校准', 'desc': '本文提出了一种混合系统SpanCalib-VLM，结合了多模态序列标注器和生成式视觉语言模型，以提高幻觉跨度检测和校准的效果。该系统通过联合校准融合策略，将生成模型的候选跨度与序列标注器的校准概率重新评分。生成式视觉语言模型在识别幻觉文本跨度方面表现出色，但存在过度自信和推理延迟的问题，而序列标注器则提供了更快的速度和更好的校准。通过这种混合方法，我们在SHROOM-Visions共享任务中取得了显著的检测准确率和校准效果。'}}}, {'id': 'https://huggingface.co/papers/2608.29613', 'title': 'Cross-lingual Functional Vectors for Emotion Detection in Large Language Models', 'url': 'https://huggingface.co/papers/2608.29613', 'abstract': 'Abstract Function vectors extracted from one language improve multilingual emotion recognition by capturing language-independent task signals and reducing inference overhead.  Generated by thinkingmachines/Inkling-Small Function vectors (FVs) have recently emerged as a promising mechanism for steering the behavior of large language models (LLMs) by injecting task-specific latent direction representations derived from in-context demonstrations. While prior studies have shown that FVs can recover task behavior in structured in-context learning settings, their effectiveness on semantically complex tasks and their ability to generalize across languages remain underexplored. We investigate the cross-lingual transferability of FVs using multilingual multi-label emotion recognition as a challenging semantic classification benchmark. Specifically, we examine whether FVs extracted from a source language can steer task behavior in another language under both standard clean and perturbed zero-shot settings without providing demonstrations during inference. Across diverse cross-lingual settings, applying FVs substantially improves performance, suggesting that FVs capture language-agnostic, task-relevant signals rather than purely language-specific lexical patterns, and highlighting their potential as a lightweight and transferable mechanism for multilingual task adaptation. We observe that each LLM exhibits a relatively stable optimal range of attention heads for constructing effective FVs, and the pattern remains consistent across languages. In addition, FVs can partially replicate the task-steering effects of standard few-shot in-context learning while avoiding the computational overhead of processing multiple demonstrations, making them effective for large-scale practical applications. Our code is available at https://github.com/yingjie7/cross_lingual_fvs.', 'score': 2, 'issue_id': 3196, 'pub_date': '2026-08-30', 'pub_date_card': {'ru': '30 августа', 'en': 'August 30', 'zh': '8月30日'}, 'hash': 'e9e80340a2a57297', 'authors': ['Jieying Xue', 'Phuong Minh Nguyen', 'Minh Le Nguyen', 'Shogo Okada'], 'affiliations': ['Japan Advanced Institute of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.29613.jpg', 'data': {'categories': ['#interpretability', '#low_resource', '#transfer_learning', '#open_source', '#benchmark', '#multilingual'], 'emoji': '🌍', 'ru': {'title': 'Языкозависимые векторы функций для многоязычного распознавания эмоций', 'desc': 'В статье исследуется способность векторов функций (FVs) — специальных представлений, извлекаемых из примеров в контексте — передаваться между языками при решении задачи многоязычного распознавания эмоций. Авторы показывают, что векторы функций, полученные из одного языка, эффективно управляют поведением больших языковых моделей в других языках, захватывая языкозависимые сигналы задачи. Исследование демонстрирует, что векторы функций работают как лёгкий механизм адаптации, избегая вычислительных затрат полноценного few-shot обучения в контексте. Результаты указывают на то, что каждая модель имеет оптимальный диапазон слоёв внимания для конструирования эффективных векторов функций, и этот паттерн остаётся консистентным между языками.'}, 'en': {'title': 'Function Vectors: Bridging Language Gaps in Emotion Recognition', 'desc': 'This paper explores how function vectors (FVs) can enhance emotion recognition across multiple languages by capturing essential task signals that are not tied to any specific language. The authors demonstrate that FVs, derived from one language, can effectively guide large language models (LLMs) to perform tasks in another language without needing additional examples during inference. Their findings indicate that FVs are capable of generalizing across languages and outperforming traditional methods, even in challenging scenarios. This research highlights the potential of FVs as a lightweight solution for multilingual task adaptation, reducing the computational burden typically associated with in-context learning.'}, 'zh': {'title': '功能向量：多语言情感识别的新机制', 'desc': '本文探讨了功能向量（FVs）在多语言情感识别中的应用，表明它们能够捕捉与任务相关的信号，而非仅仅依赖于特定语言的词汇模式。研究发现，从一种语言提取的功能向量可以有效地在另一种语言中引导任务行为，尤其是在没有示例的情况下。通过在多种跨语言设置中应用功能向量，性能显著提升，显示出其作为轻量级和可转移机制的潜力。此研究为多语言任务适应提供了新的思路，尤其是在处理复杂语义任务时。'}}}, {'id': 'https://huggingface.co/papers/2608.28958', 'title': 'CoVA-SFT: A Large-Scale Dataset for Chain of Visual Abstractions', 'url': 'https://huggingface.co/papers/2608.28958', 'abstract': 'Abstract CoVA-SFT is a multimodal reasoning dataset that teaches language models to interleave text and visual abstractions via structured reasoning steps, improving performance on visual reasoning benchmarks.  Generated by thinkingmachines/Inkling-Small Chain-of-thought (CoT) reasoning has dramatically improved large language models (LLMs) by allowing them to decompose problems into intermediate steps. While CoT is widely effective for linguistic tasks, text-only CoT forces models to serialize visual problems into awkward prose. Although architectural solutions exist to process visual inputs, the community lacks a massive, multi-step, self-corrected dataset to teach models how to build and maintain internal visual workspaces when solving purely textual reasoning problems. To address this limitation, we introduce CoVA-SFT, a highly structured corpus of 51.9K samples containing over 222K multimodal reasoning steps across 5 distinct layout families and 17 complex tasks, and CoVA-Bench, a companion benchmark of 1,700 held-out test samples spanning the same tasks for reproducible evaluation. By providing explicit rationale formulations, agentic renderings, and verification loops, CoVA-SFT teaches multimodal language models to interleave text and visual abstractions. We validate the dataset by demonstrating that models fine-tuned on CoVA-SFT outperform all interleaved CoT baselines by more than 2x on average on CoVA-Bench, though they still fall short of strong text-only CoT baselines, highlighting open challenges for future work.', 'score': 2, 'issue_id': 3199, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '3630df20403a8989', 'authors': ['Tsung-Han Wu', 'Heekyung Lee', 'Anya Ji', 'Haoming Chen', 'Trevor Darrell', 'Joseph E. Gonzalez', 'David M. Chan'], 'affiliations': ['University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2608.28958.jpg', 'data': {'categories': ['#benchmark', '#training', '#multimodal', '#dataset'], 'emoji': '🧩', 'ru': {'title': 'Объединяя слова и образы: датасет для мультимодального рассуждения языковых моделей', 'desc': 'Статья представляет CoVA-SFT — датасет для обучения мультимодальных языковых моделей переплетать текстовые и визуальные представления при решении сложных задач рассуждения. Авторы создали корпус из 51,9K примеров с более чем 222K шагов многошагового рассуждения, охватывающих 17 различных задач, и сопутствующий бенчмарк CoVA-Bench для оценки. Датасет учит модели использовать явные формулировки рассуждений, визуальные представления и циклы верификации для улучшения производительности на задачах визуального рассуждения. Модели, обученные на CoVA-SFT, показывают в 2 раза лучшие результаты по сравнению с базовыми методами, хотя по-прежнему отстают от чисто текстовых подходов цепочки мысли.'}, 'en': {'title': 'Enhancing Visual Reasoning in Language Models with CoVA-SFT', 'desc': 'CoVA-SFT is a new dataset designed to help language models learn how to combine text and visual information through structured reasoning. It includes 51.9K samples with over 222K reasoning steps across various tasks, allowing models to develop internal visual workspaces. The dataset aims to improve performance on visual reasoning tasks by teaching models to interleave text and visual abstractions effectively. Results show that models trained on CoVA-SFT significantly outperform previous methods, although they still have room for improvement compared to text-only reasoning approaches.'}, 'zh': {'title': '多模态推理的新突破', 'desc': 'CoVA-SFT是一个多模态推理数据集，旨在通过结构化推理步骤教会语言模型交替处理文本和视觉抽象，从而提高视觉推理的性能。该数据集包含51.9K个样本，涵盖222K个多模态推理步骤，涉及5种不同的布局和17个复杂任务。通过提供明确的推理公式、代理呈现和验证循环，CoVA-SFT帮助多模态语言模型更好地结合文本和视觉信息。实验结果表明，经过CoVA-SFT微调的模型在CoVA-Bench上表现优于所有交错的CoT基线，尽管仍未达到强大的文本专用CoT基线，显示出未来研究的挑战。'}}}, {'id': 'https://huggingface.co/papers/2608.29387', 'title': 'EvoGenUI-Bench: Evaluating LLMs as Multi-Turn Generative UI Assistants', 'url': 'https://huggingface.co/papers/2608.29387', 'abstract': 'Abstract  Large language models can generate interactive web interfaces, but reliable generative UI requires maintaining an executable artifact as user requests evolve. We introduce EvoGenUI-Bench, a benchmark for multi-turn interface maintenance comprising 150 five-turn tasks and 750 turns across three scenarios: information presentation, executable interaction, and tool-grounded external state. We execute generated artifacts in a browser and evaluate them using screenshots, source and DOM evidence, actor traces, and runtime logs. Beyond turn-level and episode-level success, we measure cross-turn retention with Adjacent Pass Retention. Across eight models, even the strongest achieves 74.9% Turn Pass while completing only 37.3% of five-turn episodes; APR further falls to 52.4% on tool-grounded tasks. Diagnostic analysis shows that presentation failures center on information architecture, interaction failures on derived-state propagation and affordance binding, and tool-grounded failures additionally involve external-state grounding and requirement decomposition. These results reframe generative UI evaluation from judging isolated outputs to testing whether interface behavior, derived state, external state, and assistant claims remain synchronized as the artifact evolves.', 'score': 2, 'issue_id': 3197, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'f40eff2034f3896b', 'authors': ['Yue Peng', 'Lanke Xia', 'Zihan Wang', 'Jiahao Ye', 'Ke Ning', 'Hongyi Wen'], 'affiliations': ['New York University Shanghai'], 'pdf_title_img': 'assets/pdf/title_img/2608.29387.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'От изолированного генерирования к синхронной эволюции интерфейсов', 'desc': 'В статье представлен бенчмарк EvoGenUI-Bench для оценки способности больших языковых моделей генерировать и поддерживать интерактивные веб-интерфейсы через несколько диалоговых ходов. Авторы разработали 150 задач по пять ходов каждая, охватывающих три сценария: презентацию информации, исполняемое взаимодействие и работу с внешними инструментами. Оценка проводится на основе скриншотов, исходного кода, DOM-структуры и логов исполнения, введена метрика Adjacent Pass Retention для измерения согласованности между ходами. Результаты показывают, что даже лучшие модели успешно завершают только 37,3% пятиходовых эпизодов и сталкиваются с проблемами в архитектуре информации, распространении состояния и привязке элементов интерфейса.'}, 'en': {'title': 'EvoGenUI-Bench: Benchmarking Interactive UI Maintenance in Language Models', 'desc': 'This paper presents EvoGenUI-Bench, a benchmark designed to evaluate the maintenance of interactive web interfaces generated by large language models over multiple user interactions. It includes 150 tasks that require the models to handle five turns of dialogue in various scenarios, such as presenting information and interacting with tools. The evaluation process involves executing the generated interfaces in a browser and analyzing their performance through various metrics, including Turn Pass and Adjacent Pass Retention. The findings highlight common failure points in generative UI, emphasizing the need for consistent synchronization of interface behavior and state as user requests change.'}, 'zh': {'title': '生成用户界面的新评估标准', 'desc': '本文介绍了EvoGenUI-Bench，这是一个用于多轮界面维护的基准测试，包含150个五轮任务和750个轮次，涵盖信息展示、可执行交互和工具基础外部状态三种场景。我们在浏览器中执行生成的界面，并通过截图、源代码和DOM证据、行为者轨迹以及运行时日志进行评估。研究发现，尽管最强模型的轮次通过率为74.9%，但五轮任务的完成率仅为37.3%，而在工具基础任务中，跨轮保持率进一步下降到52.4%。这些结果表明，生成的用户界面评估应从孤立输出的判断转向测试界面行为、派生状态、外部状态和助手声明在工件演变过程中的同步性。'}}}, {'id': 'https://huggingface.co/papers/2608.29137', 'title': 'Chat-Edit-3D++: Interactive 3D and 4D Scene Editing via Large Language Models', 'url': 'https://huggingface.co/papers/2608.29137', 'abstract': 'Abstract CE3D++ enables flexible dialogue-driven 3D and 4D scene editing by decoupling 2D editing from 3D reconstruction via a Hash-Atlas network and using a large language model to autonomously invoke visual tools.  Generated by thinkingmachines/Inkling-Small Recent work on image content manipulation based on vision-language pre-training models has been effectively extended to text-driven 3D scene editing. However, existing schemes for 3D scene editing still have certain shortcomings, hindering their further development as interactive design tools. Such schemes typically adhere to fixed input patterns, limiting flexibility in text input. Furthermore, their editing capabilities are constrained by a single or a few 2D visual models and require intricate pipeline design to integrate these models into 3D reconstruction processes. To address the aforementioned issues, we propose the Hash-Atlas network, which reformulates 3D scene editing as operations on 2D atlas images, thereby achieving a workflow decoupling of the 2D editing and 3D reconstruction processes. Building on this foundation, we introduce a dialogue-based 3D scene editing approach, termed CE3D++, which is centered on a large language model (LLM) that allows arbitrary textual input from users and interprets their intentions, subsequently facilitating the autonomous invocation of the corresponding visual models. Additionally, we extend CE3D++ to monocular 4D scenes by imposing motion constraints on moving objects and further fine-tuning the LLM by creating a trajectory dataset related to editing tasks, which enables the smaller LLM to schedule up to 30 different visual tools accurately. Experimental results demonstrate that CE3D++ effectively integrates multiple visual models to achieve diverse visual editing effects, possessing strong scene comprehension and multi-round dialog capabilities. The source codes and trained models are available at https://github.com/Fangkang515/CE3D.', 'score': 2, 'issue_id': 3197, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '102183b906c9d474', 'pdf_title_img': 'assets/pdf/title_img/2608.29137.jpg', 'data': {'categories': ['#3d', '#agents', '#multimodal', '#video', '#open_source'], 'emoji': '🎨', 'ru': {'title': 'Диалоговое редактирование 3D сцен через языковую модель и распределённую обработку', 'desc': 'CE3D++ — это система для редактирования 3D и 4D сцен через диалоговый интерфейс, которая использует большую языковую модель для интерпретации команд пользователя и автоматического вызова нужных визуальных инструментов. Основная инновация заключается в использовании сети Hash-Atlas, которая разделяет процесс редактирования на два этапа: сначала применяются 2D трансформации к атласным изображениям, а затем результаты переносятся в 3D пространство. Такая архитектура позволяет гибко комбинировать множество различных визуальных моделей без необходимости сложной интеграции в конвейер обработки. Система успешно расширена для работы с монокулярными 4D сценами путём добавления ограничений на движение объектов и дополнительной настройки языковой модели на специализированном датасете траекторий.'}, 'en': {'title': 'Revolutionizing 3D Scene Editing with Dialogue and Flexibility', 'desc': 'CE3D++ is a novel approach for editing 3D and 4D scenes using a dialogue-driven interface. It utilizes a Hash-Atlas network to separate 2D editing from 3D reconstruction, allowing for more flexible and intuitive user interactions. By leveraging a large language model (LLM), CE3D++ can interpret arbitrary text inputs and autonomously activate the necessary visual tools for scene manipulation. This method not only enhances the editing process but also extends capabilities to dynamic 4D scenes by incorporating motion constraints and fine-tuning the LLM with relevant trajectory data.'}, 'zh': {'title': '灵活的对话驱动 3D 场景编辑工具', 'desc': 'CE3D++ 是一种灵活的对话驱动的 3D 和 4D 场景编辑工具。它通过 Hash-Atlas 网络将 2D 编辑与 3D 重建解耦，并利用大型语言模型自主调用视觉工具。该方法允许用户输入任意文本，理解其意图，从而实现更灵活的编辑。实验结果表明，CE3D++ 能有效整合多种视觉模型，具备强大的场景理解和多轮对话能力。'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2608.29252', 'title': 'Dynamic Important Example Mining for Reinforcement Finetuning', 'url': 'https://huggingface.co/papers/2608.29252', 'abstract': "Abstract DIEM adaptively selects and reweights training examples during reinforcement fine-tuning by estimating each sample's marginal contribution to policy improvement and constraining batch updates to stabilize optimization.  Generated by thinkingmachines/Inkling-Small Reinforcement fine-tuning (RFT) is increasingly used to strengthen the reasoning abilities of large models, yet its effectiveness is bound by how training data are selected and used. Most data-centric RFT methods rely on static or heuristic sample selection, implicitly assuming a sample's value is fixed over training. This overlooks the non-stationary dynamics of policy learning and can lead to suboptimal updates. We propose Dynamic Important Example Mining (DIEM), a principled and fully automated framework that makes data utilization adaptive throughout RFT. DIEM integrates two components into each optimization step: (i) a gradient-alignment importance estimator that efficiently approximates each sample's marginal contribution to policy improvement; and (ii) a constrained batch reweighting scheme that maximizes aggregate utility while preserving the update's gradient magnitude to stabilize optimization. Across several reasoning benchmarks, DIEM consistently outperforms strong static and dynamic baselines. The code will be released via https://github.com/hrtan/DIEM.", 'score': 2, 'issue_id': 3196, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': 'b98542d56a2b1eb4', 'authors': ['Haoru Tan', 'Sitong Wu', 'Yanfeng Chen', 'Shizhen Zhao', 'Yang-Tian Sun', 'Tianjia Liu', 'Chirui Chang', 'Shaofeng Zhang', 'Samm Sun', 'Xiuzhe Wu', 'Ruobing Xie', 'Xiaojuan Qi'], 'affiliations': ['CUHK', 'HKU', 'Hunyuan Team, Tencent', 'Stanford'], 'pdf_title_img': 'assets/pdf/title_img/2608.29252.jpg', 'data': {'categories': ['#data', '#open_source', '#optimization', '#reasoning', '#rl', '#training'], 'emoji': '⛏️', 'ru': {'title': 'Динамический поиск важных примеров для умного отбора данных при обучении моделей', 'desc': 'В работе предложен метод DIEM для адаптивного выбора и перевзвешивания примеров обучения во время reinforcement fine-tuning больших языковых моделей. Метод оценивает предельный вклад каждого образца в улучшение policy, используя градиентное выравнивание, и применяет ограниченное перевзвешивание батча для стабилизации оптимизации. Авторы учитывают нестационарную динамику обучения policy, что позволяет избежать субоптимальных обновлений весов модели. Экспериментальные результаты на различных бенчмарках рассуждения показывают, что DIEM превосходит как статические, так и динамические базовые методы.'}, 'en': {'title': 'Adaptive Data Utilization for Enhanced Reinforcement Learning', 'desc': "The paper introduces Dynamic Important Example Mining (DIEM), a method that improves reinforcement fine-tuning (RFT) by adaptively selecting and reweighting training examples. It estimates the contribution of each sample to policy improvement, allowing for more effective use of data during training. Unlike traditional methods that assume a sample's value remains constant, DIEM accounts for the changing dynamics of policy learning. This approach leads to more stable optimization and better performance on reasoning tasks compared to existing methods."}, 'zh': {'title': '动态重要样本挖掘：优化强化学习的关键', 'desc': 'DIEM是一种动态重要样本挖掘方法，旨在通过自适应选择和重新加权训练样本来优化强化微调过程。它通过估计每个样本对策略改进的边际贡献，来提高训练数据的利用效率。DIEM结合了梯度对齐重要性估计器和约束批量重新加权方案，以稳定优化过程并最大化整体效用。实验结果表明，DIEM在多个推理基准测试中表现优于传统的静态和动态方法。'}}}, {'id': 'https://huggingface.co/papers/2608.30795', 'title': 'Uncertainty-Aware End-to-End AI Weather Forecasting: Disentangling Observation and Model Contributions', 'url': 'https://huggingface.co/papers/2608.30795', 'abstract': 'Abstract The Aardvark Weather model is made probabilistic by adding learned observation noise and Monte Carlo dropout to its encoder and processor, yielding a calibrated nested ensemble that improves mean forecasts and separates aleatoric and epistemic uncertainty.  Generated by thinkingmachines/Inkling-Small End-to-end weather forecasting systems produce skillful global gridded and station forecasts directly from raw Earth observations, replacing the numerical weather prediction pipeline, including data assimilation, at a fraction of its cost. These systems are deterministic and issue no uncertainty. Here we render the Aardvark Weather model probabilistic by attaching one stochastic mechanism to each component: learned, input-dependent noise at the observation encoder, capturing aleatoric uncertainty inherited from the observing system, and Monte Carlo dropout in the processor, capturing epistemic uncertainty in the learned dynamics. The resulting nested ensemble attributes forecast spread to the two sources through a law-of-total-variance decomposition, cross-checked by withholding observation streams. Probabilistic finetuning significantly improves the mean forecast, by 4.2% on average across variables and lead times. The ensemble is calibrated against ERA5 through the medium range (spread-skill ratio 0.98), keeps station RMSE within 2.4% of the deterministic model while beating it in CRPS at every lead time, and trails the operational ECMWF ensemble. The encoder branch behaves as observation-driven uncertainty. Component-attributed uncertainty makes end-to-end forecasts more transparent, a step toward observation-driven digital twins of the atmosphere.', 'score': 1, 'issue_id': 3197, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '538f20da68ace41a', 'authors': ['Rodrigo Almeida', 'Noelia Otero', 'Jost Arndt', 'Simon Baur', 'Wojciech Samek', 'Jackie Ma'], 'affiliations': ['Applied Machine Learning Group, Fraunhofer Heinrich-Hertz Institute', 'BIFOLD - Berlin Institute for the Foundations of Learning and Data', 'Department of Electrical Engineering and Computer Science, Technische Universität Berlin'], 'pdf_title_img': 'assets/pdf/title_
