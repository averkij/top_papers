Controlled comparisons further demonstrate that sharing visual representations between understanding and generation substantially improves generative learning compared with using a separate visual representation space, despite comparable reconstruction fidelity. These results suggest that representations learned by pretrained vision-language models already provide an effective foundation for visual generation.', 'score': 11, 'issue_id': 3567, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '2151ca6440f993ce', 'authors': ['JB Kim', 'Byungwoo Jeon', 'Kyungmin Lee', 'Hyeonmo Kang', 'Cheonbok Park', 'Shinyoung Joo', 'Jinwoo Shin', 'Jeonghoon Kim'], 'affiliations': ['Korea Advanced Institute of Science and Technology', 'NAVER Cloud'], 'pdf_title_img': 'assets/pdf/title_img/2611.31237.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#cv', '#optimization', '#diffusion'], 'emoji': '🧩', 'ru': {'title': 'Одно визуальное пространство для понимания и генерации изображений', 'desc': 'В статье предлагается метод Integral, который превращает предобученную vision-language model в унифицированную multimodal model, способную и понимать, и генерировать изображения. Ключевая идея — построить общее пространство визуальных представлений (shared visual tokens) через Abstraction Fusion, которое агрегирует иерархические признаки замороженного vision encoder. Дополнительно Block-wise MoT добавляет лёгкий генеративный поток, взаимодействующий с основной моделью только на границах блоков, что сохраняет понимание и улучшает генерацию. Эксперименты показывают, что общее визуальное представление заметно улучшает обучение генерации по сравнению с раздельными представлениями при сопоставимом качестве реконструкции.'}, 'en': {'title': 'One visual space for understanding and generation', 'desc': 'Integral turns a pretrained vision-language model into one model that can both understand images and generate them. It builds a shared visual representation space, helping generation use knowledge learned for image understanding. Abstraction Fusion combines hierarchical features from a frozen vision encoder into shared visual tokens, while Block-wise MoT adds a lightweight generative stream that interacts with the model at block boundaries. Experiments show that this approach preserves understanding and improves visual generation compared with using separate representations.'}, 'zh': {'title': '共享视觉表示，让理解与生成融为一体', 'desc': '本文提出 Integral，将预训练视觉语言模型改造成兼顾图像理解与生成的统一多模态模型。它通过 Abstraction Fusion 汇总冻结视觉编码器的多层特征，构造两种任务共用的视觉标记。它还使用 Block-wise MoT 引入轻量生成分支，让该分支仅在模型区块边界与视觉语言模型交互。实验表明，共享视觉表示能在保留原有理解能力的同时提升图像生成学习效果，说明预训练视觉语言表示可作为视觉生成的有效基础。'}}}, {'id': 'https://huggingface.co/papers/2611.30965', 'title': 'Beyond Self-Consistency: Recursive Self-Improvement at Test Time', 'url': 'https://huggingface.co/papers/2611.30965', 'abstract': "Abstract A label-free test-time framework, TT-RSI, improves large language models by repeatedly re-solving questions with prior solutions and distilling refinements into model weights, outperforming self-consistency methods under the same test-time scaling budget.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) that continue improving after deployment (e.g., recursive self-improvement) offer a promising path toward general intelligence. Current test-time methods pursue this goal on unlabeled questions, primarily relying on self-consistency: they generate independent solutions and use majority voting to select an answer or construct training targets. This leaves earlier reasoning unused at inference and can reinforce an incorrect majority during training. Humans instead build on earlier attempts to preserve useful reasoning, correct mistakes and improve their problem-solving strategies. Following this principle, we propose Test-Time Recursive Self-Improvement (TT-RSI), a label-free framework for improving LLMs at test time through two mutually reinforcing components: (1) In-Context RSI repeatedly re-solves each question using the full previous solution as a reference, letting the model decide whether and how to use it so that inference compute builds on earlier reasoning. (2) In-Weight RSI distills successive refinements into the model's weights, enabling progress beyond an initially wrong majority and theoretically bringing the first attempt toward the model's infinite-step refinement limit. The updated model answers better and refines more effectively, generating stronger references for subsequent training. Extensive experiments show that TT-RSI improves average accuracy by +13.89% over the base model and outperforms the strongest self-consistency-based method by +4.79% under the same test-time scaling budget.", 'score': 11, 'issue_id': 3567, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '8f0a9d3eccd34850', 'authors': ['Jianyu Wu', 'Yizhou Wang', 'Encheng Su', 'Jinouwen Zhang', 'Pengze Li', 'Lintao Wang', 'Chen Tang', 'Aoran Wang', 'Wanli Ouyang', 'Shixiang Tang'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'The University of Science and Technology of China', 'The University of Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2611.30965.jpg', 'data': {'categories': ['#reasoning', '#optimization'], 'emoji': '🔁', 'ru': {'title': 'Модель учится на своих ошибках прямо во время тестирования', 'desc': 'Статья представляет TT-RSI — фреймворк без разметки (label-free), который улучшает большие языковые модели (LLM) прямо во время тестирования. Модель многократно перерешает задачу, используя предыдущее решение как эталон (In-Context RSI), а накопленные уточнения дистиллируются в веса модели (In-Weight RSI). Такой подход учитывает прежние рассуждения и позволяет выходить за пределы ошибочного большинства, в отличие от методов на основе self-consistency. По результатам экспериментов TT-RSI повышает среднюю точность на 13.89% относительно базовой модели и на 4.79% превосходит лучший метод self-consistency при том же бюджете масштабирования на этапе инференса.'}, 'en': {'title': 'Build on Each Attempt to Improve the Next', 'desc': 'The paper introduces Test-Time Recursive Self-Improvement (TT-RSI), a label-free method that helps large language models improve while answering questions. In In-Context RSI, the model repeatedly solves each question and can use its previous solution to refine its reasoning. In In-Weight RSI, the model learns from these successive refinements by distilling them into its weights, which may help it move beyond an initially incorrect majority answer. Experiments show that TT-RSI improves average accuracy by 13.89% over the base model and by 4.79% over the strongest self-consistency method at the same test-time compute budget.'}, 'zh': {'title': '让模型接续旧思路，在反复修正中越答越好', 'desc': '这篇论文提出了测试时递归自我改进框架 TT-RSI，让大语言模型在没有标准答案的情况下持续改进。模型会参考先前的完整解答重新解题，并自行判断哪些推理值得保留、哪些错误需要修正，这称为上下文内递归改进。随后，框架将逐步改进的解答蒸馏到模型权重中，使模型学会更好的解题方式，并为后续改进提供更强的参考。实验显示，在相同的测试时计算预算下，TT-RSI 的平均准确率比基础模型高 13.89%，比表现最好的自洽性方法高 4.79%。'}}}, {'id': 'https://huggingface.co/papers/2611.33143', 'title': 'ROAM-Bench: Evaluating Embodied Active Spatial Intelligence through Evidence Verification', 'url': 'https://huggingface.co/papers/2611.33143', 'abstract': 'Abstract  Embodied spatial intelligence requires agents to gather information through exploration and interaction, then use it to reason and act. Existing benchmarks insufficiently distinguish correct outcomes from completion of these task requirements. We introduce ROAM-Bench to evaluate these abilities under robot motion and collision constraints. Independent checks use simulation state and episode records to assess outcomes and task requirements, with stronger checks of geometry, coverage, or placement. It comprises 250 manually validated tasks across 11 types in five groups and 27 indoor environments, covering object and room search, counting, geometric judgments, direction reasoning, and relocation. Human evaluators achieve 84% strict task success on 100 sampled tasks, with every correct outcome satisfying the required checks. Across seven frontier vision-language models, we identify two complementary failure modes: correct outcomes with unmet task requirements, and incorrect outcomes despite passing stronger checks. Oracle-input diagnostics show that more complete target observations and calibrated feedback improve final spatial judgments.', 'score': 11, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '18460b1e2e50bc56', 'authors': ['Xingjian Ran', 'Xiaoye Mo', 'Sihao Liu', 'Li Luo', 'Taiqiang Wu', 'Ji Zhao', 'Wenqi Shao', 'Hongyang Li', 'Jiaqi Wang', 'Bo Dai'], 'affiliations': ['JD.com', 'Shanghai Innovation Institute', 'The University of Hong Kong', 'University of Electronic Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.33143.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agi', '#cv', '#robotics', '#interpretability', '#reasoning', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Правильный ответ — не всегда выполненная задача: честная оценка пространственного интеллекта роботов', 'desc': 'Статья представляет ROAM-Bench — новый бенчмарк для оценки embodied spatial intelligence у агентов, которые исследуют среду и взаимодействуют с ней через робота с учетом ограничений движения и столкновений. Он включает 250 вручную проверенных задач 11 типов в 27 внутренних средах, охватывая поиск объектов и комнат, подсчет, геометрические суждения, рассуждение о направлениях и перемещение. Оценка выполняется независимыми проверками по состоянию симуляции и записям эпизодов, а люди достигают 84% строгой успешности. Анализ семи frontier VLM (LLM с визуальным входом) выявил два типа ошибок: правильный результат без выполнения требований задачи и неверный результат при прохождении более строгих проверок, а oracle-диагностика показала, что полные наблюдения и калиброванная обратная связь улучшают итоговые пространственные суждения.'}, 'en': {'title': 'Test Both the Answer and the Journey', 'desc': 'ROAM-Bench is a benchmark for evaluating embodied spatial intelligence: how agents explore environments, gather information, and use it to reason and act. It contains 250 validated tasks across 11 task types, five groups, and 27 indoor environments, with checks that assess both the answer and whether the agent followed the task requirements. Tests of seven frontier vision-language models reveal two failure modes: reaching the right answer without meeting the requirements, and giving a wrong answer despite passing stronger checks. Oracle-input diagnostics suggest that more complete observations of target objects and calibrated feedback can improve spatial judgments.'}, 'zh': {'title': '不只看答案正确，更要检验探索与行动是否到位', 'desc': '论文提出 ROAM-Bench，用于评估智能体在机器人移动和碰撞约束下，通过探索与交互获取信息并进行空间推理的能力。基准包含 250 个经过人工验证的任务，覆盖 11 种任务类型、5 个类别和 27 个室内环境。评测通过仿真状态和任务记录分别检查答案是否正确、是否满足任务要求，并更严格地核验几何关系、覆盖范围和物体摆放。对 7 个视觉语言模型的测试发现两类常见失败：答案正确但未完成必要要求，以及答案错误但通过了较强的检查；更完整的目标观测和经过校准的反馈有助于改善空间判断。'}}}, {'id': 'https://huggingface.co/papers/2611.33925', 'title': 'Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures', 'url': 'https://huggingface.co/papers/2611.33925', 'abstract': "Abstract Training world models on simulated manipulation failures with interaction alignment and surface correspondence reduces object trajectory and action-outcome prediction errors, including on unseen objects and real data.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robot world models are increasingly used to evaluate and plan policies, yet robot training data are dominated by successful demonstrations. Off the happy path, when a grasp is misaligned or mistimed and the object is pushed, tilted, or slips, their predictions break down. Across five pretrained action-conditioned models, object-motion error is at most 10.4% lower than that of a static baseline that copies the first frame, and two models are worse than this baseline. We present WorldReforge, which teaches world models what happens when manipulation goes wrong. We construct the Reforge dataset of 62k simulated trajectories by perturbing reference grasps in position, orientation, and closure timing, recording each resulting push, slip, or failed pickup with ground-truth object pose, contact, and surface points. WorldReforge turns this ground truth into two training signals without additional inference cost. Interaction Alignment focuses reconstruction on the small object and contact regions that a global loss underweights, and Surface Correspondence trains backbone features to follow the same physical surface points across frames. On Cosmos3 Nano, WorldReforge reduces object trajectory error by 28.2% overall and by 35.0% on unseen objects, and it lowers the error in predicting how two actions' outcomes diverge by 43.3%. Although trained only in simulation, it also improves reconstruction on DROID and on real failure videos. Controlled data studies show that failed contact and successful holding teach complementary physics: failed contact teaches how objects respond, and holding teaches how a grasped state persists. Our code, data, and models are available at aim-uofa.github.io/WorldReforge/.", 'score': 10, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '4fcdd05434f99b3a', 'authors': ['Zhiyue Zhao', 'Mingyu Liu', 'Bolin Zhang', 'Liyang Li', 'Guangyu Huang', 'Canyu Zhao', 'Jinchuan Shi', 'Haokai Zhang', 'Hao Chen', 'Chunhua Shen'], 'affiliations': ['Shanghai Innovation Institute', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.33925.jpg', 'data': {'categories': ['#benchmark', '#data', '#training', '#robotics', '#synthetic', '#dataset', '#video'], 'emoji': '🤖', 'ru': {'title': 'Учим робота предсказывать, что пойдет не так', 'desc': 'Авторы показывают, что world models для робототехники плохо предсказывают исходы неудачных манипуляций, таких как промахи захвата, сдвиг или проскальзывание объекта, поскольку обучаются в основном на успешных демонстрациях. Для решения проблемы создан датасет Reforge из 62 тысяч симулированных траекторий, где опорные захваты намеренно возмущаются по позиции, ориентации и времени закрытия, а ground-truth поза объекта, контакт и точки поверхности записываются. Метод WorldReforge добавляет две функции потерь без дополнительных затрат на inference: Interaction Alignment, фокусирующий реконструкцию на малых областях объекта и контакта, и Surface Correspondence, учащий признаки бэкбона следить за одними и теми же физическими точками поверхности между кадрами. Модель, обученная только в симуляции, снижает ошибку траекторий объектов на 28.2%, а на DROID и реальных видео неудач также улучшает качество реконструкции.'}, 'en': {'title': 'Teach robots what happens when a grasp goes wrong', 'desc': 'WorldReforge improves robot world models by training them on simulated manipulation failures, such as pushes, slips, and missed grasps. Its Reforge dataset contains 62,000 trajectories with information about object poses, contacts, and surface points. Two training signals help models focus on object interactions and track the same physical points across frames. On the tested model, this reduced object-motion prediction error, including for unseen objects, and also improved results on real-world data.'}, 'zh': {'title': '让世界模型从操作失败中学会物理规律', 'desc': '这篇论文提出了 WorldReforge，通过在模拟环境中扰动抓取的位置、角度和时机，生成包含推挤、滑落和抓取失败的训练数据。研究者利用物体姿态、接触信息和表面点，为世界模型加入两种训练信号：交互对齐重点关注物体与接触区域，表面对应则让模型追踪物体表面点在不同帧中的变化。实验显示，该方法降低了物体轨迹预测误差，也提升了模型对未见物体、不同动作结果差异以及真实失败视频的预测能力。研究还发现，失败接触能教会模型物体如何响应外力，而成功抓取能教会模型被抓住的物体如何保持稳定。'}}}, {'id': 'https://huggingface.co/papers/2611.33915', 'title': 'SEEK: Self-Evolution through Execution Knowledge for Agentic Robot Manipulation', 'url': 'https://huggingface.co/papers/2611.33915', 'abstract': "Abstract SEEK retains executable manipulation procedures and measured action effects across attempts, enabling fixed foundation-model robots to improve without retraining.  Generated by deepseek-ai/DeepSeek-V4.1-Flash General-purpose multimodal foundation models enable robots to adapt during deployment from observations and execution feedback, without task-specific demonstrations or training. However, the robot retains what it learns only in the model's working context. Once the task ends, it loses this execution knowledge, such as how to carry a bowl between two grippers. On the next attempt at the task, the robot may take just as long and repeat the same mistakes. To avoid this repetition, robots must retain execution knowledge across attempts. Yet replaying past actions is insufficient, because their effects depend on the current conditions. Procedures that determine actions from the current scene address this, but when they meet conditions that earlier attempts did not cover, revising them requires the measured effects of earlier actions. We therefore propose SEEK, an agentic framework that retains both, enabling robots to improve across attempts while keeping the underlying model fixed. To adapt retained knowledge to the current scene, SEEK adopts a Self-Evolving Programmatic Policy (SEPP) that encodes manipulation as executable procedures and determines each action from current observations. As the robot executes these procedures, SEEK records the measured effects of its actions, including those from failed attempts, in a Persistent Action-Effect Bank (PAEB). Where a retained procedure applies, it acts without a model request; where it meets a condition it does not cover, this evidence guides its revision. On RoboDojo, knowledge retained over ten attempts raises SEEK's average task score from 27.0 to 54.4 and its success rate from 19.7% to 48.0% across all 42 tasks. On 34 of these tasks with GPT-6.2 Astra, SEEK reaches 80.1 after five attempts, against 49.6 for the same model acting directly, and uses 77.6% fewer model requests. https://zeyangguan.github.io/SEEK-Agentic-Robot-Manipulation/", 'score': 10, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '06184c6ad7cb864c', 'authors': ['Zeyang Guan', 'Qihao Zhao', 'Rui Gong', 'Zhang Haitian', 'Yalun Dai', 'Yangyu Huang', 'Lingao Xiao', 'Haozhe Du', 'Xuehui Yu', 'Ye Lu', 'Jianjun Gao', 'Ruoyu Wang', 'Haowen Bai', 'Hao Li', 'Scarlett Li', 'Kim-Hui Yap'], 'affiliations': ['Microsoft Research', 'Nanyang Technological University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.33915.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agi', '#training', '#optimization', '#robotics', '#games', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Роботы учатся на собственном опыте без переобучения модели', 'desc': 'В статье предлагается SEEK — агентный фреймворк, который позволяет роботу сохранять исполняемые процедуры манипуляций и измеренные эффекты действий между попытками без переобучения базовой модели. Для этого используется Self-Evolving Programmatic Policy (SEPP), кодирующая манипуляции как исполняемые программы, и Persistent Action-Effect Bank (PAEB), хранящий результаты действий, включая неудачные попытки. Там, где сохранённая процедура применима, действие выполняется без запроса к LLM, а при встрече с непокрытым условием данные PAEB помогают её переработать. На бенчмарке RoboDojo средний балл вырос с 27.0 до 54.4, а успешность — с 19.7% до 48.0%, при этом число запросов к модели сократилось на 77.6%.'}, 'en': {'title': 'Learn from Every Attempt, Without Retraining', 'desc': 'SEEK helps robots learn from past attempts without retraining their foundation model. It stores manipulation procedures that choose actions based on current observations, along with measured action effects, including effects from failures. When a procedure encounters a situation it does not cover, this stored evidence can guide the procedure’s revision. In RoboDojo experiments, SEEK improved task performance over repeated attempts while also reducing requests to the foundation model.'}, 'zh': {'title': '让机器人记住经验，在实践中越做越好', 'desc': '论文提出 SEEK，让机器人在不重新训练基础模型的情况下，积累多次尝试中的操作经验。它用自演化程序化策略（SEPP）把操作表示为可执行步骤，并根据当前观察决定动作。它还通过持久化动作—效果库（PAEB）记录动作实际造成的结果，包括失败尝试的结果，以便在遇到新情况时修订策略。在 RoboDojo 测试中，SEEK 随尝试次数增加显著提升任务得分和成功率，并减少对模型的调用。'}}}, {'id': 'https://huggingface.co/papers/2611.33922', 'title': 'iMFPO: Improving Mean Flow Policy Optimization with Drift-Aware Velocity Alignment for Embodied Control', 'url': 'https://huggingface.co/papers/2611.33922', 'abstract': 'Abstract iMFPO enables efficient one-step action generation for embodied control by decoupling velocity learning and aligning drift-aware velocities during reward-driven policy optimization.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Flow-based generative policies offer expressive action modeling for embodied control, yet achieving efficient one-step generation under reward-driven policy optimization remains challenging. In particular, evolving action distributions during online reinforcement learning may introduce inconsistencies between instantaneous-velocity learning and interval-averaged action generation. To address this challenge, we propose iMFPO, a one-step generative policy optimization framework with decoupled velocity learning and drift-aware velocity alignment. A shared interval-conditioned actor supports instantaneous-velocity supervision and interval-averaged action generation. JVP-corrected velocity regression is jointly optimized with reward-driven policy objectives, with action-level guidance from a frozen PPO teacher during training. At inference, iMFPO directly generates actions through interval-averaged velocity prediction, achieving one-step control without iterative flow integration. Across Go2, G1, H1, and Spot, zero-latent evaluation yields mean returns of 35.69, 34.44, 416.23, and 29.86. On Go2, action-generation latency drops from 15.57 ms to 0.41 ms relative to 64-step RFPO. Code: https://github.com/AIGeeksGroup/iMFPO. Website: https://aigeeksgroup.github.io/iMFPO.', 'score': 9, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'e721620d94e9f375', 'authors': ['Lisiyu Pan', 'Ting Huang', 'Zeyu Zhang', 'Hao Tang'], 'affiliations': ['School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.33922.jpg', 'data': {'categories': ['#optimization', '#robotics', '#rl', '#interpretability', '#inference', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Одношаговое управление роботом: быстрые действия без потери качества', 'desc': "Статья предлагает iMFPO — фреймворк оптимизации генеративной политики на основе потоков (flow-based policy), который генерирует действия за один шаг. Ключевая идея — разделение обучения мгновенной скорости (instantaneous velocity) и генерации усреднённой по интервалу скорости с помощью общего интервально-условного actor'а. Регрессия скорости с JVP-коррекцией оптимизируется совместно с reward-driven целями, а на этапе обучения используется action-level guidance от замороженного PPO-учителя (teacher). Результаты на роботах Go2, G1, H1 и Spot показывают сопоставимую доходность при задержке генерации действия, сокращённой с 15.57 мс до 0.41 мс по сравнению с 64-шаговым RFPO."}, 'en': {'title': 'One-Step Flow Policies for Faster Robot Control', 'desc': 'iMFPO is a framework for generating control actions in one step using flow-based generative policies. It separates instantaneous-velocity learning from interval-averaged action generation and aligns the two to handle changes in the action distribution during reinforcement learning. Training combines velocity regression with reward-based policy optimization, using a frozen PPO teacher to guide actions. Tests on four robot platforms show effective control, and on Go2, action generation is much faster than a 64-step baseline.'}, 'zh': {'title': '把多步生成压缩为一步，让机器人动作更快更稳', 'desc': '本文提出 iMFPO，一种用于具身控制的一步式生成策略优化框架，目标是在奖励驱动的策略优化中高效生成动作。它将瞬时速度学习与区间平均动作生成分开处理，并通过区间条件化的共享策略网络连接两者。训练时，方法结合 JVP 校正的速度回归、奖励驱动的策略目标，以及冻结 PPO 教师提供的动作级指导，以缓解在线学习中动作分布变化带来的不一致。推理时，iMFPO 直接预测区间平均速度来生成动作，无需多步流积分；在多种机器人上表现良好，且 Go2 的动作生成延迟从 64 步方法的 15.57 毫秒降至 0.41 毫秒。'}}}, {'id': 'https://huggingface.co/papers/2611.34675', 'title': 'RoboEvo^2: Recursive Robot Self-Improvement via Harness-Policy Co-Evolution', 'url': 'https://huggingface.co/papers/2611.34675', 'abstract': 'Abstract RoboEvo$^2$ recursively co-evolves a coding-agent harness and a vision-language-action policy, using policy failures to discover reusable skills and preference distillation to improve motor control, yielding large success gains without extra human demonstrations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robots should adapt to unfamiliar environments and acquire new skills through interaction, then execute those skills efficiently with practice. Vision-language-action policies provide efficient control, but often need additional human demonstrations to handle unfamiliar settings; reasoning agents can discover solutions using broad prior knowledge and robot-control APIs, but repeated deliberation and repair are costly. Inspired by human learning through reasoning and practice, we propose RoboEvo^2, a framework for recursive harness-policy co-evolution. In Policy-to-Harness (P2H) evolution, policy failures guide a coding agent to search complementary Code, Code+ICL, and Code+Policy routes, consolidating verified solutions into reusable skills, routing strategies, and experience memory. In Harness-to-Policy (H2P) evolution, verified trajectories provide supervised training, while Counterfactual Preference Distillation (CPD) teaches the policy to favor successful corrections over failures from the same starting state. The improved policy provides stronger motor skills for subsequent search, while its remaining failures redirect harness evolution, closing the reciprocal loop. Through recursive co-evolution without additional human demonstrations, RoboEvo^2 improves standalone success from 11.0% to 84.1% and hybrid success from 30.4% to 90.5% on LIBERO-PRO, with similar gains and reduced agentic costs on RoboTwin C2R. Further experiments demonstrate autonomous task acquisition, cross-embodiment harness transfer, and 95.0% hybrid success on the Unitree G1-D. Our models and code will be publicly released.', 'score': 8, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'f3233b35e0634da5', 'pdf_title_img': 'assets/pdf/title_img/2611.34675.jpg', 'data': {'categories': ['#training', '#optimization', '#robotics', '#rl', '#reasoning', '#rlhf', '#open_source', '#transfer_learning', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Робот учится сам: агент и политика растут вместе, без новых демонстраций человека', 'desc': 'Статья представляет RoboEvo², фреймворк, в котором кодирующий LLM-агент (harness) и политика vision-language-action (VLA) последовательно и рекурсивно улучшают друг друга. Failures политики направляют агента на поиск переиспользуемых навыков и стратегий, которые затем превращаются в supervised training данные. Метод Counterfactual Preference Distillation (CPD) учит политику предпочитать успешные исправления неудачным действиям из той же начальной точки. Благодаря такому циклу без дополнительных демонстраций человека успешность выполнения задач на LIBERO-PRO резко возрастает, с 11.0% до 84.1%.'}, 'en': {'title': 'Reason, practice, and evolve: robots learn skills without extra demonstrations', 'desc': 'RoboEvo² is a framework that improves a robot’s vision-language-action policy alongside a coding-agent harness, which helps the robot reason through tasks. When the policy fails, the harness searches for solutions and saves verified ones as reusable skills and strategies. Successful trajectories train the policy, while counterfactual preference distillation teaches it to favor successful corrections over failures from the same starting state. This reciprocal learning loop boosts task success without additional human demonstrations and reduces the need for costly agent reasoning.'}, 'zh': {'title': '让失败引导搜索，让实践反哺策略', 'desc': '本文提出 RoboEvo²，让代码智能体与视觉-语言-动作（VLA）策略通过反复协同进化来提升机器人能力。策略失败时，代码智能体会探索不同解决路径，并把验证有效的方法整理成可复用技能、策略和经验记忆。与此同时，系统用成功轨迹进行监督训练，并通过反事实偏好蒸馏，让策略学会偏好成功修正而非失败动作。该方法无需额外人工示范，在 LIBERO-PRO 等基准上显著提升任务成功率，并降低智能体执行成本。'}}}, {'id': 'https://huggingface.co/papers/2611.31895', 'title': 'Loupe: Reinforcing Knowledge-Intensive Video Generation Agents', 'url': 'https://huggingface.co/papers/2611.31895', 'abstract': 'Abstract  Knowledge-intensive video generation remains challenging because prompts often omit the facts, appearances, and temporal relationships required for accurate generation. While search-based workflows can retrieve missing evidence, manually designed strategies limit adaptive planning, and conventional training suffers from costly video-level feedback and coarse trajectory-level credit assignment. In this paper, we present Loupe, a video generation agent that retrieves and verifies textual and visual evidence to construct evidence-grounded temporal video prompts with reference images. We further introduce Rubric-Based Credit (RBC), which leverages prompt-specific factual, visual, and temporal requirements to evaluate intermediate search and planning decisions before video rendering. Building on RBC, RBC-SFT reweights assistant-token learning by step quality, while RBC-GRPO incorporates step-level credits alongside a final planning reward, without rendering videos during RL. To address the lack of dedicated search-oriented evaluation, we construct Search-VBench, which contains 150 held-out prompts across seven categories. Experiments show that Loupe improves all four evaluation dimensions across three video generators, raising the overall score of MiniMax-H3 from 32.80 to 70.67 and outperforming an untrained search workflow. Ablation experiments show that full RBC training outperforms standard SFT followed by trajectory-level GRPO by 5.27 points. Human evaluations and results on Sci-VBench and KIVI-Bench further demonstrate improved generation quality, scientific grounding, factual precision, and helpfulness. Our project page is available at https://zengkaiya.github.io/Loupe/.', 'score': 8, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '118b3b93d9419a47', 'authors': ['Kai Zeng', 'Ruichuan An', 'Zhen Fang', 'Xi Fang', 'Han Lyu', 'Moran Li', 'Yingchen Yu', 'Yifan Dai', 'Bohan Zeng', 'Quanqing Xu', 'Zhengzhou Zhu', 'Wentao Zhang'], 'affiliations': ['Ant Group', 'DP Technology', 'HUST', 'NTU', 'PKU', 'SJTU', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2611.31895.jpg', 'data': {'categories': ['#science', '#benchmark', '#training', '#rl', '#rag', '#alignment', '#video', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Видео, опирающееся на проверенные факты: агент, который сначала ищет, а потом снимает', 'desc': 'Авторы представляют Loupe — агента для генерации видео, который ищет и проверяет текстовые и визуальные доказательства, чтобы строить временные промпты с опорными изображениями. Для оценки промежуточных шагов поиска и планирования предложен метод Rubric-Based Credit (RBC), опирающийся на фактические, визуальные и временные требования к каждому промпту. На его основе обучаются RBC-SFT, перевзвешивающий обучение по качеству шагов, и RBC-GRPO, сочетающий пошаговые оценки с финальной наградой без рендеринга видео во время RL. Эксперименты на новом бенчмарке Search-VBench показывают заметный рост общих оценок и превосходство над стандартным SFT с последующим GRPO.'}, 'en': {'title': 'Ground video generation in evidence, one step at a time', 'desc': 'Loupe is an agent that searches for and verifies textual and visual evidence before creating prompts for video generation. Its Rubric-Based Credit method scores intermediate search and planning steps against each prompt’s factual, visual, and temporal requirements. These step-level scores guide supervised fine-tuning and reinforcement learning, reducing reliance on expensive video rendering and coarse feedback on entire plans. Experiments show that Loupe improves video-generation quality and factual grounding across several generators and benchmarks.'}, 'zh': {'title': '让视频生成先检索核实，再按证据规划', 'desc': 'Loupe 是一种视频生成智能体，会检索并核实文字与图像证据，再据此构建包含参考图像、符合事实和时间顺序的视频提示词。为改进搜索与规划过程，作者提出基于评分标准的信用分配（RBC），根据具体任务的事实、视觉和时间要求，为生成视频前的中间决策打分。RBC-SFT 按步骤质量调整监督微调中的学习权重，RBC-GRPO 则在强化学习中结合步骤级信用与最终规划奖励，无需实际渲染视频。实验表明，Loupe 能提升多个视频生成器的表现；在 MiniMax-H3 上，总分从 32.80 提升至 70.67，且在事实准确性、科学依据和生成质量等方面均有改善。'}}}, {'id': 'https://huggingface.co/papers/2611.28010', 'title': 'Beyond Code and Pixels: Co-Generating Editable and Visually Rich Presentations', 'url': 'https://huggingface.co/papers/2611.28010', 'abstract': 'Abstract SlidesWeaver combines language and vision agents with diffusion-based planning and shared state to generate editable, high-quality PPTX presentations while preserving native text and layout.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Generating PPTX presentations is a structured task that requires semantic planning, visual composition, precise layout, and editability, motivating collaboration among specialized agents. However, programmatic methods offer editability but often produce rigid designs, while image-based methods provide visual richness but flatten content into difficult-to-edit pixels. A hybrid system can combine these strengths, but must coordinate interdependent decisions across content, layout, and appearance. To address this challenge, we propose SlidesWeaver, a hybrid multi-agent system that coordinates language and vision agents through shared deck- and slide-level states. Specifically, it uses staged multimodal commitment, diffusion-based composition planning, and two generation schedules for different priorities between composition freedom and accurate text preservation, while preserving native text and geometry. Across 1,728 generations spanning 24 system-model configurations, SlidesWeaver achieves consistently superior overall quality across all evaluated dimensions while maintaining structural control, editability, and practical generation efficiency.', 'score': 7, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'a7fc51bc100913d9', 'authors': ['Wenrui Zhou', 'Jiashun Liu', 'Sujie Hu', 'Bang Liu', 'Ling Pan'], 'affiliations': ['HKUST', 'Mila-Quebec Artificial Intelligence Institute', 'Tsinghua University', 'Université de Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2611.28010.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#cv', '#diffusion', '#agents'], 'emoji': '🎞️', 'ru': {'title': 'Презентации, которые можно редактировать: гибрид агентов и диффузии', 'desc': 'В статье представлена SlidesWeaver — гибридная мультиагентная система для автоматической генерации презентаций в формате PPTX. Она объединяет языковых и визуальных агентов, которые координируются через общие состояния на уровне колоды и отдельных слайдов. Ключевые компоненты: поэтапная мультимодальная фиксация решений и планирование композиции на основе диффузионных моделей, а также два режима генерации с разным приоритетом между свободой композиции и точностью сохранения текста. По результатам 1728 генераций для 24 конфигураций система показывает лучшее общее качество, сохраняя редактируемость, нативные текст и геометрию слайдов.'}, 'en': {'title': 'Beautiful slides, planned together and editable by design', 'desc': 'SlidesWeaver uses language and vision agents to create PowerPoint presentations that are both visually appealing and editable. The agents coordinate through shared deck- and slide-level states, using staged multimodal decisions and diffusion-based planning to arrange content. Two generation schedules let the system balance flexible composition with accurate text preservation. Across 1,728 generations, it achieved higher overall quality while retaining native text, layout structure, and practical generation speed.'}, 'zh': {'title': '让智能体协作，把构图自由与可编辑演示文稿兼得', 'desc': 'SlidesWeaver 是一种混合多智能体系统，协同语言智能体和视觉智能体来生成可编辑的 PPTX 演示文稿。它通过共享的演示文稿级和幻灯片级状态，协调内容、布局与视觉风格等相互关联的决策。系统采用分阶段的多模态决策、基于扩散模型的构图规划，并提供两种生成流程，以适应构图自由度和文本保真度之间的不同需求，同时保留原生文本与几何布局。在涵盖 24 种系统与模型配置的 1,728 次生成中，SlidesWeaver 在多项评估维度上表现出更高的整体质量，并兼顾结构控制、可编辑性和生成效率。'}}}, {'id': 'https://huggingface.co/papers/2611.34147', 'title': 'Letting Models Manage Their Own Context: Where We Stand', 'url': 'https://huggingface.co/papers/2611.34147', 'abstract': "Abstract Model-driven context management through a context API improves accuracy and token efficiency over harness-triggered compaction, while reusing KV caches after edits reduces prefill compute.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Agent harnesses today manage context on the model's behalf: when the window fills, the harness triggers a compaction that summarizes the history. We study the alternative, model-driven context management, in which the model itself decides when and what to compact through a context API. We gave models control over their own context in \\nooa, NVIDIA's open source agent harness, and compared the two strategies on document research and machine learning engineering across context budgets from 8K to 512K tokens. Models that use the context API effectively reach higher accuracy, often with fewer input tokens, especially at tight budgets: GPT 6.1 nearly triples its score at a 32K budget on OfficeQA Pro v2 (21\\%~rightarrow~56\\%), and Kimi gains with up to 41\\% fewer input tokens. Models differ widely, however, in how often they use the API, how aggressively they compact, and when they start compacting, and prompt changes shift that timing. Finally, we show that inference engines can make model-driven edits cheaper: by reusing the KV cache of the unchanged suffix after an edit, we cut prefill compute by up to 15\\% per request with no measurable change in accuracy. Together, these results point to a new co-design frontier: models trained to manage their own context, served by inference engines that support KV cache editing.", 'score': 3, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '45be9b993b75c9f7', 'authors': ['Alessio Devoto', 'Avinash Vem', 'Tara Safavi', 'Sanjay Kariyappa', 'Yu-Hsuan Tseng', 'Paul Furgale', 'Ricardo Silveira Cabral'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.34147.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#interpretability', '#inference', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Пусть модель сама решает, что помнить', 'desc': 'Статья сравнивает два подхода к управлению контекстом LLM-агентов: традиционную компрессию, которую запускает сам агент-обвязка (harness), и модельно-управляемое управление, где сама модель решает, когда и что сжимать через context API. Эксперименты в открытом фреймворке NVIDIA на задачах анализа документов и ML-инженерии при бюджетах контекста от 8K до 512K токенов показывают, что такой подход повышает точность и экономит входные токены, особенно при жёстких ограничениях. Авторы также показывают, что повторное использование KV cache неизменённого суффикса после правок снижает вычисления на этапе prefill до 15% без потери точности. Вывод: модели и инференс-движки стоит проектировать вместе.'}, 'en': {'title': 'Let Models Manage Context, and Make Edits Cache-Efficient', 'desc': 'The paper compares harness-triggered compaction, where the system summarizes context when the token window fills, with model-driven context management, where the model chooses what and when to compact through a context API. Across document research and machine-learning engineering tasks, effective use of the API often improves accuracy while reducing input-token usage, especially with tight context budgets. Models vary in how they use the API, and prompt changes can affect when they compact. Reusing the KV cache for unchanged text after an edit can reduce prefill computation by up to 15% per request without measurable accuracy loss.'}, 'zh': {'title': '让模型管理上下文，让 KV 缓存加速推理', 'desc': '这篇论文研究模型驱动的上下文管理：模型通过上下文 API 自主决定何时压缩对话历史，以及压缩哪些内容，而不是由代理框架自动触发摘要。研究在文档研究和机器学习工程任务中比较了两种方法，发现模型有效使用 API 时，尤其在上下文预算较紧时，通常能提高准确率并减少输入 token。不同模型使用 API 的频率、压缩幅度和开始压缩的时机差异很大，提示词也会影响这些决策。推理引擎若在编辑上下文后复用未改变部分的 KV 缓存，可将每次请求的预填充计算最多降低 15%，且准确率没有可测量的变化。'}}}, {'id': 'https://huggingface.co/papers/2611.33579', 'title': 'DexEngine: Scaling Human Demonstrations into Physically Executable Whole-Robot Data', 'url': 'https://huggingface.co/papers/2611.33579', 'abstract': "Abstract  A growing body of recent work addresses the retargeting of human hand-object demonstrations to robotic hands. To train whole-robot policies, however, the retargeted motions must be kinematically feasible and physically executable, and be produced efficiently at scale. We present DexEngine, a simulation pipeline that turns human manipulation data into train-ready, physically executable arm-hand trajectories. DexEngine first places each clip's hand-object motion where the arms can reach it, finds an arm motion that follows the human hands, and then corrects the motion in physics simulation with residual reinforcement learning. From nine human hand-object datasets, we generate about 5,200 clips for each of four dexterous hands, augmented into 65,000 trajectories (116 h) and 325,000 episodes (578 h) in total. Even with arms attached, DexEngine tracks objects more accurately than prior floating-hand methods and runs over 10x faster than RL-based ones. Policies trained on our data far outperform those trained on the same clips without physics correction or with the arms attached after a floating-hand correction, showing that fine-tuning data need physics correction. Mid-training on our data further improves them at equal fine-tuning budget, in simulation and on a real robot.", 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '7f173f90a5eb4d80', 'authors': ['Wongyun Yu', 'Honggeun Kim', 'Donguk Lee', 'Minchan Kim', 'Kyoung Whan Choe', 'Minsu Cho'], 'affiliations': ['POSTECH', 'RLWRLD'], 'pdf_title_img': 'assets/pdf/title_img/2611.33579.jpg', 'data': {'categories': ['#data', '#training', '#optimization', '#robotics', '#rl', '#synthetic', '#games', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'От человеческой руки к роботу: физически корректные демонстрации в масштабе', 'desc': 'Статья представляет DexEngine — симуляционный конвейер, который преобразует демонстрации манипуляций человеческой рукой с объектами в физически исполнимые траектории для роботизированных рук с манипуляторами. Сначала движение размещается так, чтобы руки робота могли до него дотянуться, затем подбирается движение руки, повторяющее движения человеческой кисти, а после этого траектория корректируется в физическом симуляторе с помощью residual reinforcement learning. Из девяти датасетов сгенерировано около 325 000 эпизодов (578 часов) для четырёх типов ловких кистей, и DexEngine точнее отслеживает объекты, чем предыдущие методы, и работает более чем в 10 раз быстрее RL-подходов. Политики, обученные на этих данных, заметно превосходят обученные на данных без физической коррекции, а mid-training на них улучшает результат как в симуляции, так и на реальном роботе.'}, 'en': {'title': 'Turn Human Demonstrations into Robot-Ready Motion', 'desc': 'DexEngine converts human hand-object demonstrations into arm-and-hand trajectories that robots can physically execute. It places each motion within the robot arm’s reach, plans an arm movement to follow the human hands, and uses residual reinforcement learning in simulation to correct the motion. The pipeline generates a large training dataset and tracks objects more accurately than prior floating-hand methods, while running over ten times faster than RL-based alternatives. Policies trained or mid-training on its physics-corrected data perform better in simulation and on a real robot than policies trained on uncorrected data.'}, 'zh': {'title': '让人类操作示范变成机器人可执行的训练数据', 'desc': '本文提出 DexEngine，一套把人类手部与物体操作数据转换为可用于机器人策略训练的仿真流程。它先调整动作位置以适应机械臂的可达范围，再规划跟随人手的机械臂运动，并通过残差强化学习在物理仿真中修正轨迹。研究团队基于九个数据集，为四种灵巧手生成约 65,000 条可执行轨迹，并扩增为 325,000 个训练片段。实验表明，这些经过物理修正的数据能让策略更准确地追踪物体，并提升仿真和真实机器人上的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.34671', 'title': 'DemoFoundry: Toward Scalable Photorealistic Robot Data with Coding Agents and Generative Rendering', 'url': 'https://huggingface.co/papers/2611.34671', 'abstract': 'Abstract  Scaling robot learning requires demonstrations that combine realistic visual observations with reliable action supervision. Simulation-based synthesis faces a substantial visual gap relative to real environments, while video-only generation struggles to maintain physically consistent interactions and provide aligned action labels. We present DemoFoundry, an automated framework that couples coding agents with generative rendering to synthesize photorealistic and physically grounded robot demonstrations. Coding agents both construct aligned real--proxy video pairs from existing robot episodes to train a video renderer and write executable interaction programs to generate new demonstrations. Given a scene reference and task instruction, an agent reconstructs task-relevant geometry and writes a control program without requiring target-task human demonstrations. Program execution in a physics simulator produces proxy videos with aligned robot states and actions. The video renderer translates these proxy videos into scene-consistent, photorealistic observations, reducing the need for detailed appearance modeling in each scene. Automated task-execution checks select successful trajectories for rendering and policy learning. Experiments show improved visual quality and action--video consistency. Policies trained on the generated demonstrations outperform raw-simulation training and approach the performance of training on an equal number of real demonstrations.', 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '665b61e010cacac8', 'authors': ['Ruixiang Wang', 'Xinyue Yao', 'Xuanning Zhou', 'Yueci Deng', 'Yongyi Su', 'Kui Jia'], 'affiliations': ['DexForce Technology Co., Ltd.', 'Foshan University', 'The Chinese University of Hong Kong, Shenzhen'], 'pdf_title_img': 'assets/pdf/title_img/2611.34671.jpg', 'data': {'categories': ['#data', '#training', '#robotics', '#synthetic', '#games', '#video', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Роботы учатся на синтетических демонстрациях, почти не уступая реальным', 'desc': 'Статья представляет DemoFoundry — автоматизированный фреймворк, в котором coding agents пишут программы взаимодействия с роботом и реконструируют геометрию сцены для генерации proxy-видео в физическом симуляторе. Затем video renderer, обученный на парах real–proxy, переводит эти видео в фотореалистичные наблюдения, согласованные со сценой. Автоматические проверки выполнения задачи отбирают успешные траектории для рендеринга и обучения policy. Эксперименты показывают улучшение визуального качества и согласованности действий и видео, а policy, обученные на сгенерированных демонстрациях, превосходят обучение на сырой симуляции и приближаются к обучению на равном количестве реальных демонстраций.'}, 'en': {'title': 'Photorealistic Robot Demos, Grounded in Physics', 'desc': 'DemoFoundry creates robot demonstrations by combining coding agents, a physics simulator, and a video renderer. Agents build task scenes and write programs that generate robot actions, while the simulator provides physically grounded states and actions. A renderer turns the simulator videos into photorealistic observations, and automated checks keep successful trajectories for training. Policies trained on these demonstrations perform better than those trained on raw simulation and nearly match policies trained on the same number of real demonstrations.'}, 'zh': {'title': '让机器人示范既像真实世界，也符合物理规律', 'desc': '这篇论文提出了 DemoFoundry，一个自动生成机器人示范数据的框架，目标是让画面逼真，同时让动作标签可靠。编码智能体会根据场景和任务编写可执行程序，在物理模拟器中生成带有机器人状态与动作记录的示范。视频渲染器再把模拟画面转换成贴近真实场景的图像，从而减少逐个场景手工制作外观的工作。实验表明，该方法生成的视频更逼真、动作与画面更一致；用这些数据训练的策略优于直接用模拟数据训练，并接近使用同等数量真实示范训练的效果。'}}}, {'id': 'https://huggingface.co/papers/2611.32002', 'title': 'Change the Base, Change the Game: Rethinking Pan-sharpening', 'url': 'https://huggingface.co/papers/2611.32002', 'abstract': "Abstract  Many pan-sharpening (PS) networks reconstruct high-resolution multispectral (HRMS) images by adding learned residuals to 4times-interpolated low-resolution multispectral (LRMS) inputs, incorporating panchromatic (PAN) detail only through these residual corrections. This raises a simple question: Why start with a blurry base when sharp spatial detail is already available? We propose PanBase, a sharper multispectral starting point designed for more effective residual learning. Guided by physical sensor characteristics, PanBase combines PAN spatial detail with LRMS spectral information while enforcing consistency with the LRMS observations under sensor-specific blur. We construct this base without neural network training, estimating only nine coefficients per spectral band through closed-form calibration. Our PanBase can be easily integrated into existing backbones with a global residual skip through two simple changes: (i) replacing the skip base with PanBase and (ii) concatenating it as an additional input. Using each backbone's original training recipe and matched training budgets, PanBase improves most reduced- and full-resolution metrics on WorldView-3, QuickBird, and GaoFen-2, while achieving 4.4times faster training convergence on average. In zero-shot evaluation on WorldView-2, standalone PanBase achieves competitive reconstruction without target-sensor fitting or neural refinement.", 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'abcb4da30c6f2b2a', 'authors': ['Jeonghyeok Do', 'Geunhyuk Youk', 'Munchurl Kim'], 'affiliations': ['KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2611.32002.jpg', 'data': {'categories': ['#architecture', '#training', '#cv'], 'emoji': '🛰️', 'ru': {'title': 'Начинаем с чёткой основы — и остаточное обучение становится эффективнее', 'desc': 'Многие сети для pan-sharpening восстанавливают высокоразрешённые мультиспектральные изображения, добавляя к интерполированному LRMS-входу обученные остаточные поправки, а PAN-детали используют только внутри этих поправок. Авторы предлагают PanBase — более чёткую мультиспектральную базу, которая объединяет пространственные детали PAN со спектральной информацией LRMS с учётом физических характеристик сенсора и размытия. База строится без обучения нейросети: достаточно девяти коэффициентов на каждый спектральный канал, найденных аналитической калибровкой. PanBase легко встраивается в существующие архитектуры через глобальный skip-connection и даёт лучшие метрики на WorldView-3, QuickBird и GaoFen-2, ускоряя сходимость обучения в среднем в 4.4 раза.'}, 'en': {'title': 'Start Sharper: PanBase Brings PAN Detail into the Multispectral Foundation', 'desc': 'PanBase is a sharper starting image for pan-sharpening, combining spatial detail from the panchromatic (PAN) image with spectral information from the low-resolution multispectral (LRMS) image. It uses a sensor-aware model to preserve consistency with LRMS observations and is calibrated with just nine coefficients per spectral band, without neural network training. Existing networks can use PanBase as their residual skip base and as an additional input, improving most image-quality metrics and speeding up training convergence. In zero-shot tests on a different sensor, PanBase alone also produces competitive reconstructions without sensor-specific fitting or neural refinement.'}, 'zh': {'title': '让残差学习从更清晰的起点出发', 'desc': '这篇论文研究全色锐化（pan-sharpening），目标是把低分辨率多光谱图像与全色图像结合，重建高分辨率多光谱图像。作者提出 PanBase：利用全色图像的空间细节和多光谱图像的光谱信息，构造更清晰的重建起点，同时根据传感器特性保证其经过模糊后与原始观测一致。PanBase 不需要训练神经网络，只需通过闭式校准为每个光谱波段估计九个系数，并可作为残差连接的基底和额外输入，接入现有网络。实验显示，它在多个数据集和评估指标上提升了大多数结果，平均加快训练收敛 4.4 倍；即使不针对新传感器微调，单独使用 PanBase 也能取得有竞争力的效果。'}}}, {'id': 'https://huggingface.co/papers/2611.32473', 'title': 'OmniPersist: Persistent Dynamic World Modeling via Coupled Panoramic Evolution', 'url': 'https://huggingface.co/papers/2611.32473', 'abstract': 'Abstract  Action-conditioned world models play a vital role in robotics and autonomous driving, yet existing video diffusion models struggle to maintain dynamic object persistence. When the camera turns away and returns, out-of-view moving entities fail to evolve plausibly in latent space, often mutating or vanishing entirely due to bounded perspective views. To resolve this issue, we propose OmniPersist, a unified framework that couples perspective video generation with panoramic evolution within a single-stage diffusion model, without relying on auxiliary models or initial panoramic inputs. To maintain efficiency, we model the panoramic stream at a lower frame rate, bridging both views across space and time via Geometric Anchoring (GeoAnch) for spatial correspondence and Temporal Compensation (TemComp) for temporal aggregation. OmniPersist is agnostic to camera-control architectures, supporting both latent-level and attention-level conditioning. Extensive experiments on a newly constructed dynamic benchmark across image-to-video and video continuation tasks demonstrate consistent gains in visual quality, camera controllability, revisit consistency, and dynamic persistence.', 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'c413b88ec5af2b94', 'authors': ['Zhilu Zhang', 'Xiaoyu Liu', 'Wenxi Liu', 'Shengfeng He'], 'affiliations': ['Fuzhou University', 'Harbin Institute of Technology', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32473.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#robotics', '#3d', '#diffusion', '#video', '#agents'], 'emoji': '🎥', 'ru': {'title': 'Движущиеся объекты не исчезают, даже когда камера отвернулась', 'desc': 'Статья представляет OmniPersist — единую диффузионную модель, которая генерирует перспективное видео и одновременно моделирует панорамную динамику в одной стадии обучения. Панорамный поток работает с меньшей частотой кадров, что повышает эффективность, а связь между видами обеспечивается механизмами Geometric Anchoring (GeoAnch) для пространственного соответствия и Temporal Compensation (TemComp) для временной агрегации. Метод не зависит от архитектуры управления камерой и поддерживает условие как на уровне латентного пространства, так и на уровне attention. Эксперименты на новом динамическом бенчмарке показывают улучшение качества, управляемости камерой и сохранения движущихся объектов вне поля зрения.'}, 'en': {'title': 'Keep the world moving—even when it’s out of view', 'desc': 'OmniPersist is a diffusion framework for generating action-conditioned videos that keeps moving objects consistent when the camera looks away and later returns. It combines perspective video generation with a lower-frame-rate panoramic stream, so objects can continue evolving outside the camera’s view. Geometric Anchoring aligns the two views in space, while Temporal Compensation connects them over time. Experiments show improved visual quality, camera control, revisit consistency, and persistence of dynamic objects across video generation and continuation tasks.'}, 'zh': {'title': '镜头转去又回来，动态世界依然连贯', 'desc': '这篇论文提出了 OmniPersist，一个用于机器人和自动驾驶的动作条件世界模型框架。它在单阶段扩散模型中结合透视视频生成与全景演化，让暂时离开镜头的移动物体在镜头转回时仍能合理变化，而不易消失或变形。框架通过几何锚定建立不同视角间的空间对应，并用时间补偿整合较低帧率的全景信息，同时支持潜变量级和注意力级的相机控制。实验表明，它在画面质量、相机可控性、视角重访一致性和动态物体持久性方面均有提升。'}}}, {'id': 'https://huggingface.co/papers/2611.34331', 'title': 'Puzzling-Bench: Evaluating Language Models on 23,777 Human-Written Puzzles with Community-Verified Answers', 'url': 'https://huggingface.co/papers/2611.34331', 'abstract': "Abstract  We introduce Puzzling-Bench, a benchmark of 23,777 puzzles with community-verified answers drawn from the Puzzling Stack Exchange archive (2014-2026): riddles, ciphers, logic grids, lateral-thinking problems, wordplay and recreational mathematics, a third of them with images. Every puzzle carries the answer accepted by its author, a short reference answer taken from it (LLM-extracted for the evaluation sets and checked on a 50-puzzle human review), the author's own hints, community tags and a creation date, so that the benchmark supports hint ablations, category analysis and a rolling post-cutoff slice (254 puzzles posted after the training cutoff of six of the nine models we evaluate, including the best one) as a contamination check. We evaluate nine frontier and open models with a two-tier scorer (normalized exact match, then an LLM judge) and validate the judge with three judges from two model families: they agree on 95-97% of verdicts (kappa 0.82-0.96), move no model by more than 1.6 points, and show no own-family preference. The best model, GPT-6.1, reaches 74.8% on a shared 255-puzzle set; a hard core of 17 puzzles defeats all nine models; model failures are strongly correlated, and the second-best model contributes a single puzzle to a greedy ensemble, yet an oracle over all nine reaches 91%. On a 100-puzzle multimodal pilot, withholding the question's image costs the two best models 24 and 35 points. We release the dataset, the scoring pipeline and all per-row provenance.", 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '622d4f98566fcc41', 'authors': ['Abhinav Sharma', 'Li Li', 'Chien Van Nguyen', 'Sai Karthik Navuluru', 'Bo Ni', 'Xiangbo Gao', 'Xiaolei Huang', 'Yue Zhao', 'Nesreen K. Ahmed', 'Tyler Derr', 'Yu Wang', 'Hongjie Chen', 'Zhengzhong Tu', 'Thien Huu Nguyen', 'Ryan A. Rossi', 'Franck Dernoncourt'], 'affiliations': ['Adobe Research', 'Cisco', 'Dolby Laboratories', 'Texas A&M University', 'University of Georgia', 'University of Massachusetts Amherst', 'University of Missouri', 'University of Oregon', 'University of Southern California', 'University of Texas at Dallas', 'Vanderbilt University', 'Zillow'], 'pdf_title_img': 'assets/pdf/title_img/2611.34331.jpg', 'data': {'categories': ['#leakage', '#benchmark', '#multimodal', '#survey', '#data', '#dataset'], 'emoji': '🧩', 'ru': {'title': 'Головоломки, которые проверяют пределы LLM: сильнейшая модель решает три четверти, но вместе модели решают почти всё', 'desc': 'Авторы представляют Puzzling-Bench — бенчмарк из 23 777 головоломок с ответами, проверенными сообществом и взятыми из архива Puzzling Stack Exchange. Оценка девяти моделей проводится двухуровневым скорером: сначала нормализованным точным совпадением, затем LLM-судьёй, валидированным тремя судьями из двух семейств моделей с высокой согласованностью (kappa 0.82–0.96). Лучшая модель GPT-6.1 решает 74.8% задач, но жёсткое ядро из 17 головоломок не решается ни одной моделью, а ошибки моделей сильно коррелируют, при этом оракул по всем девяти достигает 91%. Пилотный мультимодальный тест показывает, что без изображения точность лучших моделей падает на 24 и 35 пунктов.'}, 'en': {'title': 'A benchmark to test where language models get puzzled', 'desc': 'Puzzling-Bench is a benchmark of 23,777 community-answered puzzles, covering topics such as riddles, ciphers, logic, wordplay, and recreational mathematics. It evaluates nine language models using normalized exact match followed by an LLM judge, with checks to validate the judge’s reliability. The best model scores 74.8% on a shared test set, while 17 puzzles stump every model; hiding images also substantially reduces performance on a multimodal pilot. The benchmark includes hints, categories, dates, and provenance to support detailed analysis and checks for training-data contamination.'}, 'zh': {'title': '用真实谜题检验模型推理：有图无图，表现差距显著', 'desc': '论文提出 Puzzling-Bench，这是一个包含 23,777 道谜题的基准数据集，涵盖谜语、密码、逻辑题、文字游戏和趣味数学等类型，其中约三分之一带有图片。每道题都附有经社区确认的答案、参考答案、作者提供的提示、类别标签和创建日期，支持按类别分析、提示消融实验及训练截止时间之后的题目评测，以检查数据污染。研究用两阶段评分方法评估了九个模型，并通过多个评判模型验证评分可靠性；最佳模型在 255 道共享题目上取得 74.8%，但仍有 17 道题能难倒所有模型。模型错误高度相关，组合模型的收益有限；在多模态测试中，移除题目图片会使表现最好的两个模型分别下降 24 和 35 个百分点，研究同时发布数据集、评分流程和题目来源记录。'}}}, {'id': 'https://huggingface.co/papers/2611.33835', 'title': '3D CoCa v3: Contrastive Learners with Scene Graphs for Urban Scene Understanding', 'url': 'https://huggingface.co/papers/2611.33835', 'abstract': 'Abstract  Understanding large-scale 3D urban scenes requires representations that capture both multi-scale geometric structures and complex spatial relationships. However, existing 3D vision-language methods primarily emphasize global semantic alignment or object-level representations, leaving structured relational modeling underexplored within unified contrastive and generative frameworks. In this paper, we present 3D CoCa v3, a scene-graph-enhanced contrastive and generative framework for urban 3D scene understanding. Our framework features a Pyramid Vision Encoder for multi-scale geometric representation learning and a language-model-based decoder with question-guided caption retrieval and visual cross-attention. We further introduce MSG-based relational descriptions to enrich contrastive 3D-language alignment with structured spatial relationships. To support semantic and relational supervision, we construct City3D-9.6K, a multi-view urban vision-language dataset with aligned visual-geometric observations, scene captions, and scene graphs. Extensive experiments on City-3DQA demonstrate that 3D CoCa v3 achieves 88.35% and 64.79% overall top-1 accuracy on the sentence-wise and city-wise splits, surpassing 3D CoCa v2 by 20.88 and 3.57 percentage points, respectively. Furthermore, 3D CoCa v3 achieves the best performance on GeoEval3D, demonstrating its effectiveness in urban spatial reasoning and geometric understanding. Code is available at https://github.com/AIGeeksGroup/3DCoCav3.', 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '1b4e831dee5321cd', 'authors': ['Nannan Zhang', 'Ting Huang', 'Zeyu Zhang', 'Haoyu Chen', 'Yanjie Zhu', 'Hao Tang'], 'affiliations': ['SIAT, CAS', 'School of Computer Science, Peking University', 'University of Oulu'], 'pdf_title_img': 'assets/pdf/title_img/2611.33835.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#multimodal', '#cv', '#graphs', '#reasoning', '#dataset', '#3d'], 'emoji': '🏙️', 'ru': {'title': 'Граф сцены учит 3D-модель понимать город целиком', 'desc': 'Статья представляет 3D CoCa v3 — фреймворк, объединяющий контрастивное и генеративное обучение для понимания городских 3D-сцен. Модель использует Pyramid Vision Encoder для многомасштабного геометрического представления и декодер на основе LLM с извлечением подписей по вопросу и visual cross-attention. Для обогащения 3D-языкового выравнивания вводятся relational-описания на основе scene graph (MSG), а для обучения создан датасет City3D-9.6K. Фреймворк показывает лучшие результаты на City-3DQA и GeoEval3D, демонстрируя эффективность в пространственном рассуждении.'}, 'en': {'title': 'Connecting 3D Geometry and Spatial Relationships for Smarter Urban Scene Understanding', 'desc': 'This paper introduces 3D CoCa v3, a framework for understanding urban 3D scenes using both contrastive learning and generative modeling. Its Pyramid Vision Encoder captures geometry at multiple scales, while a language-model decoder uses question-guided caption retrieval and visual cross-attention. The method also uses scene-graph-based relational descriptions to teach the model spatial relationships, supported by the new City3D-9.6K dataset. It improves question-answering accuracy over 3D CoCa v2 and achieves the best reported performance on GeoEval3D.'}, 'zh': {'title': '让三维城市场景理解几何，也理解关系', 'desc': '本文提出3D CoCa v3，用于理解大型城市三维场景，并将对比学习与生成式建模结合起来。它通过金字塔视觉编码器学习多尺度几何特征，再利用语言模型解码器进行问题引导的描述检索和视觉交叉注意力。研究还引入基于MSG的关系描述和City3D-9.6K数据集，以加强三维场景与语言之间的对齐，并提供场景图监督。实验表明，该方法在City-3DQA和GeoEval3D上表现出色，提升了城市空间推理与几何理解能力。'}}}, {'id': 'https://huggingface.co/papers/2611.30460', 'title': 'CONCOR: Benchmarking Contrastive Decoding for Visual Hallucination Mitigation Beyond Final-Output Performance', 'url': 'https://huggingface.co/papers/2611.30460', 'abstract': 'Abstract A controlled benchmark directly evaluates contrastive corrections in multimodal large language models to better understand and mitigate object hallucination beyond final task scores.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Contrastive decoding (CD) mitigates object hallucination in multimodal large language models (MLLMs) by contrasting token distributions under different conditions to adjust token scores. However, existing generative and discriminative benchmarks primarily measure final task scores, which can be confounded by candidate filtering, changes in generation trajectories, and response biases, making it difficult to isolate the effects of the underlying contrastive adjustments. To address these limitations while complementing existing evaluations, we introduce CONCOR (Contrastive Correction Evaluation), a controlled benchmark that directly evaluates the competition between ground-truth and different types of hallucinated candidates using the Contrastive Grounding Margin (CGM). CGM also enables analysis of directional consistency, composition, and reliability of contrastive corrections. Our evaluation reveals that existing CD methods exhibit distinct correction behaviors: some consistently favor ground-truth candidates, whereas others produce strong corrections but also introduce more errors. Crucially, these differences help explain their contrasting responses to increased contrast strength, which improves some methods while degrading others. These findings highlight the importance of evaluating the contrastive correction itself, rather than relying solely on final-output performance, and CONCOR provides a controlled and interpretable framework for understanding and improving CD methods for hallucination mitigation.', 'score': 2, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '3255b6c2e9ae5b43', 'authors': ['Ting Chen', 'Geng Li', 'Guohao Chen', 'Hanjia Lyu'], 'affiliations': ['Nanyang Technological University', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2611.30460.jpg', 'data': {'categories': ['#interpretability', '#benchmark', '#multimodal', '#hallucinations'], 'emoji': '🔍', 'ru': {'title': 'Оценивайте не только ответ, но и саму коррекцию: CONCOR выявляет скрытые ошибки в борьбе с галлюцинациями MLLM', 'desc': 'В статье представлен CONCOR — контролируемый бенчмарк для прямой оценки contrastive decoding (CD) в мультимодальных LLM, которые склонны к object hallucination. Авторы вводят метрику Contrastive Grounding Margin (CGM), которая измеряет конкуренцию между правильным ответом и разными типами галлюцинированных кандидатов. Оказалось, что методы CD ведут себя по-разному: одни стабильно выбирают ground-truth, другие дают сильные поправки, но вносят больше ошибок. Поэтому для улучшения CD важно оценивать саму contrastive correction, а не только итоговые метрики качества.'}, 'en': {'title': 'Measure the Correction, Not Just the Answer', 'desc': 'The paper introduces CONCOR, a controlled benchmark for evaluating contrastive decoding (CD) in multimodal large language models (MLLMs). It uses the Contrastive Grounding Margin (CGM) to compare how strongly a model favors correct objects over different types of hallucinated candidates. The benchmark reveals that CD methods differ in how reliably they correct hallucinations, and that stronger contrast can help some methods while hurting others. CONCOR offers a more interpretable way to study these corrections than relying only on final task scores.'}, 'zh': {'title': '不只看最终答案：直接衡量对比解码如何纠正幻觉', 'desc': '多模态大语言模型可能会生成图像中不存在物体的内容，这种现象称为物体幻觉。对比解码通过比较不同条件下的词元概率分布来调整分数，以减少这类错误，但仅看最终回答的表现，难以判断调整本身是否有效。论文提出受控基准 CONCOR，并用对比接地边际（CGM）直接衡量真实候选与不同类型幻觉候选之间的竞争。评测发现，各种对比解码方法在纠正幻觉的稳定性和引入错误的倾向上有所不同，因此需要直接评估对比纠正过程。'}}}, {'id': 'https://huggingface.co/papers/2611.30895', 'title': 'Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock', 'url': 'https://huggingface.co/papers/2611.30895', 'abstract': "Abstract  Proactive assistants that guide people through physical tasks must decide, every few seconds, whether a step is complete and whether a mistake has occurred. We find that two benchmarks for this task largely reward knowing when rather than seeing what: a timer that never looks at the video, raising an alarm at 25 s and confirming each step at 30 s, reaches a mistake F1 of 0.373 on Ego-MC-Bench, above every published result (at most 0.27). We formalize this as the video-blind frontier, the best trade-off between completion accuracy and mistake F1 that policies reach from the elapsed time, the instruction and training statistics alone: every published per-step result on Ego-MC-Bench lies inside it, and so do all twelve zero-shot models we run on QICD. To move beyond it, we introduce Evidence-Contrastive Training (ECT): fine-tune on the benchmark's own questions, and pair its positives with negatives from the same recording at the same elapsed time, so that elapsed time cannot separate the two sides of a pair. Trained on 209 QICD videos in about 15 GPU-hours, a 2B model with ECT crosses the frontier on both benchmarks in all four seeds; transferred to Ego-MC-Bench without adaptation, it confirms 59% of mistake-free steps in time, against 30% for a published model with the same backbone trained on about 25k synthetic counterfactuals and real recordings. Its decisions follow the video beyond what timing explains: at equal elapsed time it tells a finished step from an unfinished one in 90-92% of test pairs, where the instruction's typical duration reaches 65%, rescaling the time stamps between the frames leaves it essentially unchanged, and swapping in another recording, of the same recipe where one exists, cuts its completion accuracy by two thirds. The code and model weights will be publicly released.", 'score': 1, 'issue_id': 3567, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'bdbc3dcddbc24a82', 'authors': ['Bohe Chen'], 'affiliations': ['Beijing University of Posts and Telecommunications, Beijing, China', 'Queen Mary University of London, London, UK'], 'pdf_title_img': 'assets/pdf/title_img/2611.30895.jpg', 'data': {'categories': ['#benchmark', '#training', '#dataset', '#video', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Видеть, а не угадывать: ассистент должен смотреть на видео, а не на часы', 'desc': 'Статья показывает, что популярные бенчмарки для проактивных ассистентов по физическим задачам (Ego-MC-Bench и QICD) во многом вознаграждают угадывание по времени, а не анализ видео: даже «слепой» таймер превосходит опубликованные результаты. Авторы вводят понятие «video-blind frontier» — границу качества, которой могут достичь модели, опирающиеся только на прошедшее время, инструкцию и статистику обучения. Для выхода за эту границу предложен метод Evidence-Contrastive Training (ECT), который дообучает LLM на парах позитивных и негативных примеров из одной записи при одинаковом времени, чтобы время не могло их разделить. Модель на 2B параметров с ECT превосходит границу на обоих бенчмарках и явно опирается на визуальные данные, а не на тайминг.'}, 'en': {'title': 'Teach assistants to see the step, not just watch the clock', 'desc': 'The paper finds that existing benchmarks for video-based task assistants can often be solved using elapsed time and training statistics, without looking at the video. It defines a video-blind frontier to measure this limitation and shows that published systems and zero-shot models do not surpass it. The authors introduce Evidence-Contrastive Training (ECT), which pairs correct and incorrect examples from the same recording at the same elapsed time, helping a model learn visual evidence rather than timing cues. A 2B model trained with ECT exceeds the frontier on both benchmarks and transfers to a second benchmark, with tests indicating its decisions rely on the video.'}, 'zh': {'title': '让模型看懂视频，而不只是看时间', 'desc': '这篇论文研究能否通过视频判断人们执行的步骤是否完成，以及是否出现错误。作者发现，现有基准很大程度上奖励对步骤耗时的掌握，而不是对视频内容的识别；仅凭计时就能超过已有方法的成绩。为此，作者提出证据对比训练（ECT），将同一段视频、相同时间点的正例与负例配对训练，使模型不能只靠时间判断。经过训练的 20 亿参数模型在两个基准上都超越了仅凭时间的表现，并能在同一时长下区分已完成与未完成的步骤。'}}}, {'id': 'https://huggingface.co/papers/2611.34912', 'title': 'LiveVAE: Causal Window Attention Makes Efficient Streaming Video VAE', 'url': 'https://huggingface.co/papers/2611.34912', 'abstract': 'Abstract  While video diffusion models have grown faster and increasingly streamable, the video VAE remains a primary latency bottleneck across interactive generation and editing pipelines. Existing VAEs and their acceleration methods rely mainly on heavy convolutions or full frame attention, and most focus only on decoding, leaving encoding costly for streaming conditional generation and editing. This raises a natural question: Do video VAE encoding and decoding actually require such global spatiotemporal modeling? By analyzing the effective receptive fields of pretrained video VAEs, we find that both encoding and decoding a patch rely almost entirely on its spatial and temporal neighbors. To exploit this strong locality, we introduce LiveVAE, a streaming encoder and decoder built on causal window attention, which cuts per frame compute while keeping the temporal KV cache bounded for streaming. Decoupled encoder/decoder distillation followed by joint finetuning preserves the pretrained latent space, making LiveVAE a drop-in replacement for the original VAE. On MiniMax-H3, LiveVAE achieves 5.2-6.2x faster encoding and 3.0-3.3x faster decoding than the official VAE with higher PSNR. Paired with our dedicated inference infrastructure, LiveVAE pushes the speedup to 13.4x with almost no quality loss. Code and models will be released.', 'score': 1, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'b8ed20f1719ff20b', 'authors': ['Jiachen An', 'Sijie Zhao', 'Le Li', 'Hongyu Liu', 'Zhiyuan Li', 'Tianyu Yang', 'Xiaoyu Kong', 'Xunliang Cai', 'Yong Zhang', 'Chi-Man Pun', 'Xiaoming Wei', 'Xiaodong Cun'], 'affiliations': ['Great Bay University', 'Meituan', 'The Hong Kong University of Science and Technology', 'University of Macau'], 'pdf_title_img': 'assets/pdf/title_img/2611.34912.jpg', 'data': {'categories': ['#architecture', '#video', '#inference', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Локальность вместо глобального внимания: быстрая потоковая видео-VAE без потери качества', 'desc': 'Авторы исследуют, нужна ли видео-VAE глобальная пространственно-временная модель для кодирования и декодирования, и показывают, что патч опирается почти только на соседние по пространству и времени фрагменты. На основе этой локальности предложен LiveVAE: потоковый энкодер и декодер на основе causal window attention, который сокращает вычисления на кадр и ограничивает размер временного KV-кэша. Дистилляция энкодера и декодера с последующим совместным дообучением сохраняет латентное пространство предобученной VAE, поэтому LiveVAE может заменить оригинал без переобучения диффузионной модели. По результатам на MiniMax-H3 ускорение кодирования составляет 5.2-6.2x, декодирования 3.0-3.3x при более высоком PSNR, а с выделенной инфраструктурой инференса до 13.4x почти без потери качества.'}, 'en': {'title': 'Local Attention for Faster, Streamable Video VAEs', 'desc': 'This paper introduces LiveVAE, a faster video variational autoencoder (VAE) for streaming generation and editing. The authors find that encoding and decoding each patch mostly depend on nearby spatial and temporal information, rather than the whole video. LiveVAE uses causal window attention and a bounded temporal key-value cache to reduce computation, while distillation and fine-tuning help preserve the original latent space and video quality. On MiniMax-H3, it encodes videos 5.2–6.2 times faster and decodes them 3.0–3.3 times faster than the official VAE, with higher PSNR; specialized infrastructure increases the speedup to 13.4 times with little quality loss.'}, 'zh': {'title': '抓住时空局部性，让视频 VAE 流式加速', 'desc': '这篇论文指出，视频变分自编码器（VAE）的编码和解码主要依赖局部时空邻域，而不需要大范围的全局建模。基于这一发现，作者提出 LiveVAE，利用因果窗口注意力构建可流式处理的编码器和解码器，并限制流式推理中的键值缓存大小。通过分别蒸馏编码器和解码器，再进行联合微调，LiveVAE 保留了原有潜在空间，可直接替换原 VAE。在 MiniMax-H3 上，它的编码速度提升 5.2 至 6.2 倍、解码速度提升 3.0 至 3.3 倍，同时获得更高 PSNR；结合专用推理基础设施后，速度提升可达 13.4 倍，且几乎不损失质量。'}}}, {'id': 'https://huggingface.co/papers/2611.33894', 'title': 'SIA: Selective Image Analogy', 'url': 'https://huggingface.co/papers/2611.33894', 'abstract': "Abstract A new selective image analogy setting and model let users choose which of multiple demonstrated edits to transfer to a query image by suppressing unwanted edit tokens during denoising.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Image analogy transfers a demonstrated transformation from a before/after pair (A, A') to a new query image B. Existing methods assume all changes in (A, A') should be fully transferred, limiting flexibility when users want only a subset of the demonstrated edits. We introduce Selective Image Analogy (SIA), a new setting where a single demonstration pair encodes multiple edits, and the user selects at inference time which edits to apply to B. To support this, we curate a multi-edit analogy dataset with full-edit and partial-edit targets. We then train a model that first learns to transfer the complete demonstrated transformation, and then gains selective control through a mask-aligned suppression mechanism: a token-gated LoRA that restricts adapter updates to suppressed edit tokens during denoising, paired with a concept suppression vector that weakens the selected tokens in the text embeddings before denoising. Together, these components allow SIA to suppress unwanted edits that remain visible in A', while preserving the user-selected ones, all without requiring a new demonstration pair for each edit combination. We perform extensive quantitative and qualitative evaluations along with user studies to demonstrate the efficacy of our approach.", 'score': 1, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'a51c5f2a2de61973', 'authors': ['Amirhossein Alimohammadi', 'Kian Izadpanah', 'Bardiya Kariminia', 'Yiorgos Chrysanthou', 'Ali Mahdavi-Amiri'], 'affiliations': ['CYENS Centre of Excellence', 'Shahid Beheshti University', 'Simon Fraser University', 'University of Cyprus'], 'pdf_title_img': 'assets/pdf/title_img/2611.33894.jpg', 'data': {'categories': ['#architecture', '#cv', '#training', '#dataset', '#diffusion'], 'emoji': '🎨', 'ru': {'title': 'Переносите только нужные правки: выборочная аналогия изображений', 'desc': 'В статье представлен Selective Image Analogy (SIA) — новая постановка задачи, где одна пара «до/после» содержит несколько правок, а пользователь выбирает, какие из них перенести на новое изображение. Авторы создали датасет с полными и частичными целевыми изображениями для мультиправочных аналогий. Модель сначала учится переносить всю демонстрируемую трансформаци
