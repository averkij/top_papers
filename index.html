    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.25403', 'title': 'Antom 3-in-1 Transformer: A Payment Foundation Model', 'url': 'https://huggingface.co/papers/2611.25403', 'abstract': "Abstract  We report the development of Antom 3-in-1 Transformer, a payment foundation model that integrates sequence, tabular, and graph representations for payment risk detection. The model contains approximately 7B parameters, with approximately 1.7B activated per task route. Antom 3-in-1 Transformer is pretrained to learn reusable behavioral and relational representations, primarily on Ant International's internal payment data. In a cross-business transfer experiment, pretraining improves the target business metric by 34.5% over the same architecture trained from scratch. With only 25% of the training labels, the pretrained model outperforms the full-label scratch baseline in Average Precision (AP) and Recall@0.5% on different merchant domains. In a four-month online experiment on Ant International's billion-scale payment platform, the model reduced the overall loss rate by 37.88% relative to XGB-Online.", 'score': 99, 'issue_id': 3564, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'ba138207b65fb820', 'authors': ['Weiyu Han', 'Haoyu Jiang', 'Jie Sheng', 'Youxi Pan', 'Xianglong Liu', 'Zeqi Ren', 'Dongquan Yi', 'Yinhao Liu', 'Ruobing Zuo', 'Ze Zhao', 'Huilin He', 'Nairong Zhang', 'Xinyi He', 'Xiao Tan', 'Jun Wang', 'Pan Fang', 'Wei Zeng', 'Jianan Su', 'Kaixin Shen', 'Jingtong Wu', 'Hao Li', 'Shuai Chen', 'Jiangming Yang', 'Tianyi Zhang'], 'affiliations': ['Ant International', 'East China Normal University', 'Shanghai Jiao Tong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.25403.jpg', 'data': {'categories': ['#graphs', '#architecture', '#training', '#transfer_learning'], 'emoji': '💳', 'ru': {'title': 'Одна предобученная модель защищает платежи лучше, чем обучение с нуля', 'desc': 'Авторы представляют Antom 3-in-1 Transformer — foundation model для платежей примерно на 7B параметров, которая объединяет sequence, tabular и graph representations для детекции платежных рисков. Модель предобучается на внутренних платежных данных Ant International, чтобы выучить переиспользуемые поведенческие и relational embeddings. При переносе между бизнесами pretraining даёт прирост целевой метрики на 34.5% по сравнению с обучением той же архитектуры с нуля, а при использовании лишь 25% разметки модель превосходит baseline на полной выборке по AP и Recall@0.5%. В четырехмесячном онлайн-эксперименте на платформе масштаба миллиардов платежей общий уровень потерь снизился на 37.88% относительно XGB-Online.'}, 'en': {'title': 'One foundation model for payment risk across data types', 'desc': 'Antom 3-in-1 Transformer is a payment foundation model that combines sequence, tabular, and graph representations to detect payment risks. With about 7 billion parameters, it is pretrained mainly on Ant International’s payment data to learn reusable behavioral and relational patterns. In experiments, pretraining improved performance on a new business by 34.5%, and with only 25% of the labels, the model exceeded a scratch-trained baseline on Average Precision and Recall@0.5%. A four-month online trial on a billion-scale platform reduced the overall loss rate by 37.88% compared with XGB-Online.'}, 'zh': {'title': '融合序列、表格与图，让支付风险识别更精准', 'desc': '这篇论文提出 Antom 3-in-1 Transformer，一种用于支付风险检测的基础模型，可联合处理序列、表格和图结构数据。模型约有 70 亿个参数，并通过不同任务路由激活约 17 亿个参数；它主要利用蚂蚁国际的内部支付数据进行预训练，以学习可复用的行为与关系表示。在跨业务迁移实验中，预训练使目标业务指标比从头训练提升 34.5%；仅使用四分之一的训练标签时，模型在不同商户领域的平均精确率（AP）和 Recall@0.5% 上也优于使用完整标签从头训练的基线。为期四个月的线上实验显示，在十亿规模的支付平台上，该模型相较于 XGB-Online 将整体损失率降低了 37.88%。'}}}, {'id': 'https://huggingface.co/papers/2611.32884', 'title': 'Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe', 'url': 'https://huggingface.co/papers/2611.32884', 'abstract': 'Abstract A reinforcement learning method rewards agents for delaying commitment until their inferred posterior over answers is sufficiently narrow, improving evidence-based answering across vision-language benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash AI agents working on long tasks often commit to an answer before they have enough evidence, a behavior called laziness. In our evaluations, they frequently commit even while their stated belief still names several possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During training, however, the simulator can compute the exact posterior over the answer at every step and tell whether the evidence is already enough. We propose Reinforcement Learning with Verifiable Beliefs (RLVB), which rewards the agent for taking further steps while this posterior still allows several answers and for committing once the evidence is sufficient. The reward needs no judge, critic or reward model, and it never reads the belief line the agent writes before each action. We also introduce Pro Worlds, a benchmark of visual puzzles where the agent views a large world through a small window. We evaluate three vision-language models on three benchmarks, two of which are never seen in training. RLVB improves the base model in all nine settings, by 17.1% on average. Under the outcome reward, GRPO and PPO fall below the base model on average. RLVB also outperforms PPO with a process reward from an LLM judge by 9.3% on average while using 1.6 times fewer GPU-hours. The trained agent answers with sufficient evidence in 51%, 12% and 74% of the episodes on the three benchmarks, against 8%, 0.4% and 36% for the base model. Its accuracy gain therefore comes from answering more often at high levels of evidence. The belief line shows how the agent reaches this evidence: it acts on its own belief. It commits at only 0.1 to 2.2% of the turns at which the evidence is insufficient and its line still names several answers, against 3 to 68% for the base model.', 'score': 93, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '6cdeb2b566cdbee4', 'authors': ['Richmond Sin Jing Xuan', 'Peilin Feng', 'Wenbin Wang', 'Soujanya Poria'], 'affiliations': ['Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32884.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#training', '#cv', '#reasoning', '#agents', '#optimization', '#rl'], 'emoji': '🧭', 'ru': {'title': 'Сначала доказательства, потом ответ: награда за терпение агента', 'desc': 'Статья описывает метод Reinforcement Learning with Verifiable Beliefs (RLVB), который учит AI-агента не давать ответ раньше времени. В отличие от стандартной награды только за финальный ответ, здесь агент получает награду за дополнительные шаги, пока апостериорное распределение по ответам допускает несколько вариантов, и за фиксацию ответа, когда доказательств достаточно. Посчитать такую награду можно прямо в симуляторе, без судьи, критика или reward model. Эксперименты на vision-language моделях и новом бенчмарке Pro Worlds показывают рост точности в среднем на 17.1% и превосходство над PPO с LLM-судьей при меньших затратах GPU.'}, 'en': {'title': 'Gather evidence first; commit when the belief is clear', 'desc': 'The paper introduces Reinforcement Learning with Verifiable Beliefs (RLVB), a method that trains agents to wait until their evidence supports a clear answer. During training, it uses the simulator’s exact posterior over possible answers to reward continued information gathering when uncertainty is high and commitment when uncertainty is low. This reward does not rely on an AI judge, critic, reward model, or the agent’s written belief statements. Across nine vision-language benchmark settings, RLVB improves the base model’s performance by 17.1% on average and leads to more answers made with sufficient evidence.'}, 'zh': {'title': '证据不足先别答，信念收敛再承诺', 'desc': '这篇论文提出了“可验证信念强化学习”（RLVB），用于减少智能体证据不足时过早作答的情况。训练时，模拟器会计算每一步答案的精确后验分布：若仍有多个答案可能，智能体继续收集信息；若证据已足够，再作答并获得奖励。该方法不需要奖励模型、评论器或人工评审，也不读取智能体自行写下的信念说明。在三个视觉语言基准的九种设置中，RLVB 都提升了基础模型表现，平均提高17.1%，并使智能体更常在证据充分时作答。'}}}, {'id': 'https://huggingface.co/papers/2611.28947', 'title': "Don't Sleep, Keep Watch: Proactive Perception for Computer-Use Agents", 'url': 'https://huggingface.co/papers/2611.28947', 'abstract': "Abstract NightWatch adds a lightweight streaming watcher to vision-language computer-use agents to keep perception synchronized with dynamic interfaces, reducing latency and wasted time while maintaining or improving task success.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Computer-use agents (CUAs) built on vision-language models are increasingly entrusted with long-horizon tasks in live desktop, web, and mobile environments, where the screen keeps changing on its own. However, current CUAs lack real-time situational awareness: they perceive the environment through discrete snapshots, and the substantial inference latency of VLMs, compounded by highly dynamic interfaces, opens a perception-action gap in which the observed state frequently becomes stale before the corresponding action is executed. To bridge this gap, we present NightWatch, a plug-and-play framework that endows any CUA with continuous, temporally grounded perception without changing the agent's model, prompt, or action space. NightWatch couples the VLM agent with NightWatch-0.8B, a lightweight System-1 model that performs streaming monitoring of the interface state and keeps the agent synchronized with the evolving environment at low computational cost and latency, thereby grounding each decision in the current state rather than an outdated snapshot and reducing both stale actions and idle waiting while preserving task success. Experiments on desktop and dynamic web environments (OSWorld-Verified and DynaCU-Bench) show that NightWatch, driven by a watcher of only 0.8B parameters, reduces non-reasoning wall-clock time by 33% and wasted time by 53% on OSWorld while keeping task success on par, raises success on DynaCU-Bench from 39.5% to 44.2% with the large VLM agent, and is more efficient than passive-watching baselines such as AOI and PUSV under the same screenshot-only input, as well as a System-1 decision model more than 30times its size. Overall, NightWatch demonstrates that the timing of perception is as critical as its content, marking a step toward agents that maintain continuous awareness of their environment rather than perceiving it turn by turn.", 'score': 93, 'issue_id': 3564, 'pub_date': '2026-11-21', 'pub_date_card': {'ru': '21 ноября', 'en': 'November 21', 'zh': '11月21日'}, 'hash': '724fe0eae7bcbc8a', 'authors': ['Jiaqi Su', 'Jie-Jing Shao', 'Yichen Liu', 'Long-Kai Huang', 'Haiyan Yin'], 'affiliations': ['A*STAR Centre for Frontier AI Research (A*STAR CFAR)', 'Hong Kong Baptist University', 'National University of Singapore', 'SenseTime'], 'pdf_title_img': 'assets/pdf/title_img/2611.28947.jpg', 'data': {'categories': ['#cv', '#benchmark', '#agents', '#small_models', '#inference'], 'emoji': '👁️', 'ru': {'title': 'Важно не только что видеть, но и когда: агент, который не отстаёт от экрана', 'desc': 'Статья представляет NightWatch — лёгкий плагин для vision-language агентов, которые управляют компьютером (computer-use agents), и который обеспечивает им непрерывное восприятие интерфейса. Основная проблема в том, что VLM работают с дискретными снимками экрана, и из-за высокой latency инференса действие часто выполняется над уже устаревшим состоянием. Модель NightWatch-0.8B, работающая как System-1 компонент, выполняет streaming-мониторинг интерфейса и синхронизирует агента с изменяющейся средой без изменения самой модели, промпта или пространства действий. В экспериментах на OSWorld-Verified и DynaCU-Bench фреймворк сокращает время простоя и стейл-действия, сохраняя или повышая success rate.'}, 'en': {'title': 'Keep agents in sync with every changing screen', 'desc': 'NightWatch helps vision-language computer-use agents stay aware of changing screens instead of relying only on occasional screenshots. A small 0.8-billion-parameter System-1 model continuously monitors the interface and updates the agent’s view, without changing its main model, prompt, or actions. Tests show it reduces wasted time and improves efficiency while keeping task success steady or increasing it on dynamic web tasks. The results suggest that timely perception is important for agents working in environments that change while they act.'}, 'zh': {'title': '持续感知，让智能体始终跟上界面变化', 'desc': '这篇论文提出 NightWatch，一个可插入视觉语言计算机使用智能体的轻量级框架，无需修改智能体的模型、提示词或动作空间。它使用只有 8 亿参数的 System-1 监测模型，持续追踪界面变化，让智能体依据最新状态而非过时的屏幕截图行动。实验显示，NightWatch 在 OSWorld 上将非推理耗时降低 33%、浪费时间降低 53%，同时保持任务成功率；在 DynaCU-Bench 上也提升了任务成功率。结果表明，及时持续的感知能减少过时操作与空等，感知的时机和内容同样重要。'}}}, {'id': 'https://huggingface.co/papers/2611.30634', 'title': 'Rewirable Circuits in Transformers with Loom Attention', 'url': 'https://huggingface.co/papers/2611.30634', 'abstract': "Abstract  We propose loom attention, which allows a Transformer to dynamically rewire its circuits at every token by interweaving a head's vertical attention over the outputs of earlier heads (to obtain its query, key and value) with its horizontal attention over tokens. We instantiate vertical attention efficiently with normalized and gated linear attention over a per-token matrix memory, which stores the compressed head outputs and serves as a second residual stream. This yields LoomFormer, a dual-stream architecture that splits control and content between the vector and matrix streams. Across model sizes and training token budgets in language modeling and downstream tasks, LoomFormer matches Transformers trained with over 3x compute and recent residual-stream baselines (HC/mHC, MUDDFormer, AttnRes) trained with ~1.7-2.8x. For example, trained on the same 300B tokens with only 2% extra FLOPs, LoomPythia-2.8B achieves ~1.6x the average downstream gain of mHC-Pythia-2.8B over Pythia-2.8B, and matches (0-shot) or surpasses (5-shot) Pythia-12B. Code is available at https://github.com/Caiyun-AI/LoomFormer", 'score': 85, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'b1808bacc068a141', 'authors': ['Da Xiao', 'Qingye Meng', 'Shengping Li', 'Xingyuan Yuan'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'ColorfulClouds Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.30634.jpg', 'data': {'categories': ['#architecture', '#optimization', '#training'], 'emoji': '🧶', 'ru': {'title': 'Динамическая перекройка внимания: контроль и содержимое в двух потоках', 'desc': 'Авторы предлагают механизм loom attention, который позволяет Transformer динамически перестраивать свои внутренние связи на каждом токене. Вертикальное внимание над выходами предыдущих голов сочетается с горизонтальным вниманием по токенам, а вертикальная часть реализуется через нормализованный gated linear attention над матричной памятью для каждого токена. Так получается архитектура LoomFormer с двумя потоками: векторным, отвечающим за контроль, и матричным, хранящим содержимое. По результатам экспериментов в языковом моделировании и downstream-задачах LoomFormer сопоставим с Transformer, обученными на существенно большем объёме вычислений, и превосходит residual-stream baselines, например LoomPythia-2.8B почти в 1.6 раза опережает mHC-Pythia-2.8B по среднему приросту.'}, 'en': {'title': 'Weaving a second stream into Transformer attention', 'desc': 'The paper introduces loom attention, which lets each Transformer head dynamically use outputs from earlier heads while also attending across tokens. It implements this with gated linear attention and a per-token matrix memory, creating a second stream alongside the usual vector residual stream. The resulting LoomFormer separates control and content across these two streams and performs strongly on language modeling and downstream tasks. In experiments, it matches or exceeds several larger or more compute-intensive models, including outperforming a baseline trained on the same token budget with only a small increase in FLOPs.'}, 'zh': {'title': '让注意力头动态编织信息，以更少计算获得更强表现', 'desc': '这篇论文提出 Loom Attention，让 Transformer 在处理每个词元时，都能动态调整不同注意力头之间的信息连接。它通过垂直注意力读取先前注意力头的输出，并结合通常在词元之间进行的水平注意力；垂直注意力使用带归一化和门控的线性注意力，以及保存压缩头输出的矩阵记忆来高效实现。基于此，LoomFormer 将信息分为向量流和矩阵流，分别承担控制与内容表示。在语言建模和下游任务实验中，它以较少计算量取得了有竞争力的效果，例如 LoomPythia-2.8B 在相同训练词元数量下显著提升下游表现，并在部分评测中达到或超过 Pythia-12B。'}}}, {'id': 'https://huggingface.co/papers/2611.31205', 'title': 'ACAP: Asynchronous Coding Agents for Efficient Robot Control', 'url': 'https://huggingface.co/papers/2611.31205', 'abstract': 'Abstract  Coding agents can construct and revise robot behavior during execution, but using one agent for the whole robot can delay otherwise independent work. We introduce Asynchronous Coding Agents as Policy (ACAP), an asynchronous framework that organizes one robot as a team of persistent agents. Each member reasons and acts for a configurable control group, such as an arm with its gripper or the torso and chassis, enabling asynchronous reasoning and execution. However, different robot components often have physical dependencies that require coordination. To address this challenge, ACAP introduces a hyper-agent that assigns tasks, coordinates dependencies, and dynamically allocates control between the lead and member agents. This allows independent work to progress concurrently while supporting tightly coupled manipulation when necessary. Across 72 real-world rollouts covering 25 task/platform settings, ACAP reduces task-balanced time cost by 28.2% compared with a single-agent Direct Policy, with improvements across Fully Parallel, Parallel-Sequential, and Collaborative tasks. Across all eight Collaborative settings, ACAP also achieves lower mean time cost than Fixed Delegation, where only member agents can control their assigned groups. An additional 90-rollout study shows lower mean 30-minute-capped time cost than Direct on all six tasks. We further demonstrate mobile manipulation using the same member interface for chassis and torso control. We present the framework and a real-world rollout dataset containing observations, generated programs, actions, and feedback to support research on how coding agents reason and act in the physical world.', 'score': 62, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '2ac1d76409e0092a', 'authors': ['Zexin He', 'Rui Li', 'Yushi Lan', 'Chengkai Jin', 'Zhi Hou', 'Xingang Pan'], 'affiliations': ['ACE Robotics', 'Nanyang Technological University', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.31205.jpg', 'data': {'categories': ['#robotics', '#dataset', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Команда агентов быстрее одного робота: асинхронное кодирование движений', 'desc': 'Статья представляет ACAP — асинхронный фреймворк, в котором управление роботом строится как команда постоянных LLM-агентов, каждый из которых отвечает за свою группу звеньев, например манипулятор с захватом или торс и шасси. Для учёта физических зависимостей между компонентами вводится hyper-agent, который распределяет задачи, координирует взаимосвязи и динамически передаёт контроль между ведущим и вспомогательными агентами. По результатам 72 реальных запусков время выполнения задач сократилось на 28,2% по сравнению с одноагентной Direct Policy, а также подход показал преимущества над Fixed Delegation. Авторы также публикуют датасет реальных запусков с наблюдениями, сгенерированными программами, действиями и обратной связью.'}, 'en': {'title': 'Many Agents, One Robot: Work in Parallel, Coordinate When It Counts', 'desc': 'ACAP is an asynchronous framework that uses persistent coding agents to control different groups of a robot, such as its arm or chassis. A hyper-agent assigns tasks, manages physical dependencies, and shifts control between the lead agent and member agents when coordination is needed. This lets independent robot actions happen concurrently while supporting coordinated manipulation. In real-world trials, ACAP reduced task time compared with single-agent control and fixed delegation, and the authors provide a dataset of robot observations, programs, actions, and feedback.'}, 'zh': {'title': '多智能体异步协作，让机器人并行行动又能默契配合', 'desc': '本文提出异步编码智能体策略（ACAP），让多个长期运行的智能体分别负责机器人的不同控制组，并行推理与执行。由于机器人部件之间可能存在物理依赖，ACAP 使用一个超智能体分配任务、协调依赖关系，并动态调整主智能体与成员智能体的控制权。真实机器人实验表明，与单智能体直接策略相比，ACAP 的任务平衡时间成本降低了 28.2%，在协作任务中也优于固定分工方法。研究还展示了移动操作能力，并发布包含观测、生成程序、动作和反馈的数据集，以支持对实体环境中智能体行为的研究。'}}}, {'id': 'https://huggingface.co/papers/2611.30962', 'title': 'Self-Evolving Evaluation Environments for Computer-Use Agents', 'url': 'https://huggingface.co/papers/2611.30962', 'abstract': 'Abstract CUA-SEE is a closed-loop evaluation environment that co-evolves tasks and executable verifiers to adaptively measure computer-use agents’ capabilities, boundaries, and progress reliability.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Computer-use agents (CUAs) are rapidly improving, yet their evaluation remains largely static. Existing benchmarks provide a strong foundation, but fixed difficulty ceilings, limited feature coverage, and coarse aggregate scores progressively weaken their discriminative and diagnostic value. We introduce CUA-SEE, a closed-loop evaluation environment that co-evolves tasks and executable verifiers from rollout evidence. It disentangles three objectives: benchmark evolution expands evaluation scope through cohort-calibrated difficulty and coverage growth; diagnostic evolution increases resolution through agent-conditional capability-boundary probes; and verifier evolution improves precision by translating changing requirements into state-grounded checkpoints with adversarial validation. Across multiple agents, applications, and rounds, CUA-SEE generates challenging, measurable tasks while preserving process-level evidence. Our results position adaptive evaluation as a scalable counterpart to self-evolving agents, continuously tracking what agents can do, where their boundaries lie, and how reliably progress is measured.', 'score': 46, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'b62c534a9c54f71a', 'authors': ['Wenhao Wang', 'Panrong Tong', 'Quyu Kong', 'Pengxiang Li', 'Haowen Yang', 'chenglin Cai', 'Siheng Chen', 'Yue Wang'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Shanghai Jiao Tong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.30962.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Оценивать агентов так же адаптивно, как они сами учатся', 'desc': 'CUA-SEE — это закрытая (closed-loop) среда оценки, которая динамически развивает задачи и исполняемые верификаторы на основе данных прогонов агентов. Статическим бенчмаркам свойственны фиксированный потолок сложности, ограниченное покрытие функций и грубые агрегированные метрики, что снижает их диагностическую ценность. Авторы разделяют три процесса: эволюцию бенчмарка (расширение охвата за счёт калибровки сложности), диагностическую эволюцию (зондирование границ возможностей конкретного агента) и эволюцию верификаторов (повышение точности через проверку состояний с адверсариальной валидацией). Результаты показывают, что адаптивная оценка может стать масштабируемым аналогом самоэволюционирующих агентов, непрерывно отслеживая возможности и надёжность computer-use агентов.'}, 'en': {'title': 'Evolving Benchmarks for Evolving Computer-Use Agents', 'desc': 'CUA-SEE is a closed-loop evaluation system that updates tasks and executable verifiers using evidence from agent runs. Its benchmark evolution expands task coverage and adjusts difficulty, while diagnostic evolution creates probes to identify each agent’s capability boundaries. Verifier evolution turns changing task requirements into state-grounded checkpoints and tests them against adversarial cases to improve measurement precision. Across agents, applications, and evaluation rounds, the system produces challenging tasks and tracks capabilities, limitations, and progress with process-level evidence.'}, 'zh': {'title': '让评测与智能体共同进化，持续看清能力边界', 'desc': 'CUA-SEE 是一种闭环评测环境，会根据智能体执行任务时产生的证据，持续更新任务和可执行验证器。它从三个方面改进评测：扩展基准的任务范围与难度，针对不同智能体设计能力边界探测，并用基于实际状态的检查点提升验证准确度。该方法还通过对抗性验证检查评测标准是否可靠，并保留任务执行过程中的证据。实验表明，CUA-SEE 能持续追踪计算机使用智能体的能力、局限及其进步是否被可靠测量。'}}}, {'id': 'https://huggingface.co/papers/2611.28649', 'title': 'S-Mind: Internalizing Multi-View Geometry for Spatial Intelligence', 'url': 'https://huggingface.co/papers/2611.28649', 'abstract': 'Abstract  Spatial intelligence, the ability to reason about 3D space from visual observations, becomes essential as multimodal large language models (MLLMs) move into the physical world. Beyond perceiving each view, it rests on two cornerstones of human cognition: fusing multiple views into one coherent 3D scene and mentally transforming that scene to new viewpoints as reasoning unfolds. Yet our spatial probes reveal that MLLMs largely lack both capabilities, even after spatial fine-tuning. We therefore present S-Mind, which internalizes multi-view geometry within the MLLM through a compact set of spatial tokens. It supervises these tokens to hold the fused 3D scene and re-emits them to re-express this scene from every viewpoint the reasoning adopts. Across four spatial benchmarks, S-Mind improves its Qwen3.5 backbones by up to 22.26 points and surpasses frontier general models such as GPT-6-Astra (+0.45), Kimi-K3.1-Pro (+1.97), and GLM-5.3-Flash (+7.80) in average accuracy. Moreover, the same probes confirm that it acquires both capabilities, reaching fusion and transformation accuracies of 65.11% and 82.17%, against at most 16.02% and 37.28% for the baselines. At inference, S-Mind also runs about 100x faster than a tool-based agent on the same backbone. Instilled through these spatial tokens during training, spatial capability becomes intrinsic to the backbone and persists even when the tokens are withheld, offering a promising path toward spatial intelligence in MLLMs.', 'score': 41, 'issue_id': 3564, 'pub_date': '2026-11-21', 'pub_date_card': {'ru': '21 ноября', 'en': 'November 21', 'zh': '11月21日'}, 'hash': 'f1c354a67d89fd49', 'authors': ['Muxin Fu', 'Peike Yu', 'Guibin Zhang', 'Wenrui Zhou', 'Runze Liu', 'Lang Feng', 'Fuchao Yang', 'Feng Chen', 'Yixuan Li', 'Mengao Zhang', 'Shiying Zhang', 'Wen Shen', 'Ling Pan', 'Shuicheng Yan', 'Bo An'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'The Hong Kong University of Science and Technology', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2611.28649.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#multimodal', '#training', '#3d', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Пространственный разум внутри модели: видеть сцену целиком и смотреть на неё с любой стороны', 'desc': 'Статья представляет S-Mind — подход, который встраивает геометрию нескольких ракурсов непосредственно в мультимодальную LLM с помощью компактного набора пространственных токенов. Эти токены обучаются хранить объединённую 3D-сцену и заново выражать её с любой точки зрения, которую выбирает рассуждение модели. Эксперименты на четырёх пространственных бенчмарках показывают рост точности до 22,26 пункта для backbone Qwen3.5 и превосходство над несколькими передовыми general-моделями, при этом инференс примерно в 100 раз быстрее tool-based агента. Пространственные способности закрепляются в весах модели и сохраняются даже без использования токенов.'}, 'en': {'title': 'Teach models to build and rethink a 3D world', 'desc': 'The paper introduces S-Mind, a method that helps multimodal large language models reason about 3D space. It uses compact spatial tokens to combine multiple visual views into a coherent 3D scene and represent that scene from new viewpoints during reasoning. On four benchmarks, S-Mind improves its underlying models and outperforms several general-purpose models, while running much faster than a tool-based agent. The results suggest that training with spatial tokens can make multi-view fusion and viewpoint transformation intrinsic capabilities that remain even when the tokens are not used at inference time.'}, 'zh': {'title': '用空间 token 让模型看懂三维世界', 'desc': '论文提出了 S-Mind，旨在让多模态大语言模型具备更强的三维空间推理能力。它通过一组紧凑的空间 token 来融合多视角信息，形成连贯的三维场景表示，并能根据推理需要从新的视角重新表达场景。实验显示，S-Mind 在四项空间基准测试中提升了模型表现，也显著增强了多视角融合与视角变换能力。训练得到的空间能力即使在推理时不提供这些 token 也能保留，而且运行速度比基于工具的智能体快约 100 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.32554', 'title': 'PartAgent: Agentic 3D Part Segmentation via Expert Integration and Closed-Loop Refinement', 'url': 'https://huggingface.co/papers/2611.32554', 'abstract': 'Abstract A training-free agentic framework integrates pretrained 3D and 2D experts with closed-loop refinement to achieve state-of-the-art 3D part segmentation across multiple benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Segmenting a 3D object into semantically meaningful parts requires joint reasoning about geometric structure and semantic context. Pretrained 3D experts provide spatially grounded region proposals, while 2D experts provide semantic cues for identifying object parts. The challenge is to integrate these complementary capabilities into a framework that can both produce meaningful part segmentations and progressively refine them. We present PartAgent, a training-free agentic framework for 3D part segmentation built upon two complementary modules: (i) Structural-Semantic Expert Integration combines regions predicted by the 3D expert with multiview semantic evidence from the 2D expert through image-to-surface correspondences, constructing compositional part partitions at multiple granularities. (ii) Observation-Driven Closed-Loop Partition Refinement observes the current partition and its supporting evidence to select targeted inspection, evidence repair, composition, or reselection actions. It verifies proposed changes and uses the updated state and action outcomes to guide subsequent decisions. On PartObjaverse-Tiny-WT, PartAgent achieves 68.41 mIoU, outperforming the strongest competing method by 8.53 points. Across 3DCoMPaT200, PartNeXt, PartNetE, and PartObjaverse-Tiny, PartAgent achieves the highest mIoU on each dataset, averaging 69.36 across the four datasets, 7.28 points above the highest mean among competing methods.', 'score': 33, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '3e7ff604da9e3365', 'authors': ['Yang Cao', 'Zhe Zhu', 'Yiheng Zhang', 'Zhengqiang Zhang', 'Haoyuan Li', 'Le Wan', 'Dan Xu'], 'affiliations': ['Hong Kong Polytechnic University', 'Hong Kong University of Science and Technology', 'Sun Yat-sen University', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2611.32554.jpg', 'data': {'categories': ['#cv', '#benchmark', '#agents', '#multimodal', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Агент, который собирает и уточняет части 3D-объекта без обучения', 'desc': 'Статья представляет PartAgent — агентную систему для сегментации 3D-объектов на части без дополнительного обучения (training-free). Она объединяет предобученного 3D-эксперта, который выдаёт пространственно привязанные регионы, и 2D-эксперта (vision-language модель), дающего семантические признаки по нескольким ракурсам, с помощью соответствий между изображением и поверхностью. Модуль замкнутого цикла уточнения анализирует текущее разбиение и выбирает действия: проверку, исправление доказательств, композицию или переотбор, после чего проверяет изменения и учитывает их результаты. На нескольких бенчмарках, включая PartObjaverse-Tiny-WT, PartAgent показывает наилучший mIoU, в среднем на 7.28 пункта выше лучших конкурирующих методов.'}, 'en': {'title': 'Combine 2D Meaning with 3D Structure—Then Refine in a Loop', 'desc': 'PartAgent segments 3D objects into meaningful parts by combining pretrained 3D region proposals with semantic cues from pretrained 2D models. It connects multiview image predictions to 3D surfaces to build part partitions at different levels of detail. In a closed loop, the agent inspects its current segmentation, chooses actions such as repairing evidence or recomposing parts, and checks whether each change improves the result. It achieves the highest reported mean intersection over union (mIoU) among the compared methods across several benchmarks, without additional training.'}, 'zh': {'title': '融合 2D 语义与 3D 结构，让部件分割持续精进', 'desc': '这篇论文提出了 PartAgent，一个无需额外训练的 3D 部件分割框架。它结合 3D 专家的空间区域建议与 2D 专家的多视角语义信息，并通过图像到 3D 表面的对应关系生成不同粒度的部件划分。框架还会观察当前分割结果，按需检查或修复证据、组合区域或重新选择，并验证修改效果以逐步改进结果。在多个基准数据集上，PartAgent 的平均 mIoU 达到 69.36，优于现有对比方法。'}}}, {'id': 'https://huggingface.co/papers/2611.25509', 'title': 'LingSante MedGuard Technical Report', 'url': 'https://huggingface.co/papers/2611.25509', 'abstract': 'Abstract  As medical AI is increasingly used for patient consultation and clinical decision support, identifying harmful, non-compliant, or ethically problematic responses is essential for responsible deployment. Assessing these risks requires checking clinical claims against relevant evidence, verifying calculations, and applying medical requirements under their intended conditions. We introduce LingSante MedGuard, a capability-enhanced guardrail that integrates supervision from a medical guardrail teacher model and six specialized medical capability experts into a unified model. The guardrail teacher supervises risk decisions and explanations across medical safety, compliance, and ethics, while the capability experts support medical rule understanding, numerical reasoning, multimodal hallucination detection, agentic safety verification, risk localization, and multimodal entity understanding. We consolidate these sources of supervision through offline supervised fine-tuning on teacher-generated demonstrations, followed by multi-teacher on-policy distillation using feedback on student-generated responses. We further introduce LingSante MedGuardBench, a benchmark comprising 11 risk-detection subsets spanning medical safety, compliance, and ethics. At 4B, 9B, and 27B scales, LingSante MedGuard achieves mean benchmark F1 scores of 82.3%, 82.4%, and 87.4%, respectively. The 4B model also achieves 73.9% mean accuracy across MedHallu and MedHALT-NOTA under retrieval-enabled evaluation. Additional evaluations of the verification components show improvements in evidence-supported consistency, source traceability, and rule-guided rationale quality across model scales. These results support the integration of specialized medical capabilities into a unified guardrail for medical risk assessment and evidence-based medical safety verification.', 'score': 30, 'issue_id': 3565, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '63de55d1a75d12d8', 'pdf_title_img': 'assets/pdf/title_img/2611.25509.jpg', 'data': {'categories': ['#ethics', '#security', '#training', '#benchmark', '#multimodal', '#rag', '#dataset', '#healthcare', '#science', '#hallucinations', '#alignment'], 'emoji': '🩺', 'ru': {'title': 'Единый страж медицинского ИИ: безопасность, проверенная доказательствами', 'desc': 'Статья представляет LingSante MedGuard — защитный модуль (guardrail) для медицинского ИИ, который выявляет вредные, неэтичные и не соответствующие нормам ответы в консультациях и системах поддержки клинических решений. Модель объединяет супервизию от учительской модели-guardrail и шести специализированных экспертов по медицинским правилам, численным рассуждениям, обнаружению мультимодальных галлюцинаций, верификации безопасности агентов и локализации рисков. Обучение проводится в два этапа: сначала offline supervised fine-tuning на демонстрациях учителя, затем multi-teacher on-policy distillation с использованием обратной связи на ответы студента. Авторы также представили бенчмарк LingSante MedGuardBench из 11 подзадач и показали средние F1 до 87,4% на модели масштаба 27B.'}, 'en': {'title': 'Specialist Medical Skills, Unified for Safer AI', 'desc': 'The paper presents LingSante MedGuard, a medical guardrail model designed to detect unsafe, non-compliant, or unethical AI responses. It combines supervision from a medical guardrail teacher with six specialized experts covering skills such as clinical rule understanding, numerical reasoning, hallucination detection, and risk localization. The model is trained using supervised fine-tuning on teacher-generated examples, followed by multi-teacher on-policy distillation. Across three model sizes, it achieves strong F1 scores on the new MedGuardBench and improves evidence-based medical safety verification.'}, 'zh': {'title': '融合专业能力，让医疗 AI 风险评估更可靠', 'desc': '这篇论文提出 LingSante MedGuard，一个用于评估医疗 AI 回复风险的统一防护模型，可识别安全、合规和伦理问题。它结合医疗防护教师模型与六种专业能力专家的监督，覆盖医疗规则理解、数值推理、多模态幻觉检测、智能体安全验证、风险定位和多模态实体理解。训练过程先使用教师生成的示范进行监督微调，再通过多教师在线策略蒸馏，根据模型自身生成的回复继续改进。论文还构建了包含 11 个风险检测子集的 MedGuardBench；实验显示，该模型在不同参数规模下取得较高的 F1 分数，并提升了证据一致性、来源可追溯性和规则推理质量。'}}}, {'id': 'https://huggingface.co/papers/2611.33010', 'title': 'Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies', 'url': 'https://huggingface.co/papers/2611.33010', 'abstract': "Abstract A new benchmark shows that many robot manipulation policies perform worse when mirrors are present, often because they confuse reflections with real objects rather than simply colliding with the mirror.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Can a simple mirror expose the limitations of today's robotic manipulation policies? Inspired by the mirror self-recognition test in animal cognition, we investigate whether robot policies can reliably manipulate physical objects in scenes containing their reflections. We introduce RoboDojo-Mirror, a benchmark built on RoboDojo that preserves task objectives, success criteria, and policy checkpoints while comparing a mirror-free baseline with single-mirror, dual-mirror, and mirrored-tabletop conditions. Across five policies spanning Vision-Language-Action models, World Action Models, and agentic policies, every mirror condition reduces aggregate success rates: averaged over the three conditions, the drop ranges from 10.8 to 56.7 percentage points across policies, and it reaches 62.5 points on the mirrored tabletop. Because a mirror is also a physical obstacle, we compare it against geometrically matched non-reflective panels; 50--88\\% of mirror-specific failures occur without recorded robot--panel contact, so direct collisions alone do not explain the degradation. Trajectory and contact analyses instead reveal recurring behaviors consistent with phantom targeting of reflected objects and spatial mislocalization of real ones. Targeted diagnostics further characterize grasping near reflections, policy-dependent pushing progress, and physical-target interaction under main-camera occlusion. Real-robot experiments with π_{0.5} and FastWAM also show lower overall success rates under the upright-mirror and mirrored-tabletop conditions. These findings reveal a shared vulnerability to reflective environments across diverse robot policies and motivate reflection-aware evaluation of embodied intelligence. Code is available at https://github.com/iPPLab/robodojo-mirror.", 'score': 27, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'd5b44792c849d758', 'authors': ['Xuanchen Liu', 'Hejun Zhang', 'Boxuan Dong', 'Ying Wu', 'Heshuai Li', 'Wen Gao', 'Yonghong Tian', 'Weihao Yu'], 'affiliations': ['Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.33010.jpg', 'data': {'categories': ['#cv', '#robotics', '#benchmark', '#optimization', '#agents', '#interpretability'], 'emoji': '🪞', 'ru': {'title': 'Зеркало ломает роботов: отражение сбивает с толку даже лучшие policy-модели', 'desc': 'Авторы предлагают бенчмарк RoboDojo-Mirror, который проверяет, могут ли робототехнические policy-модели (VLA, World Action Models и агентные политики) надёжно манипулировать объектами при наличии зеркал в сцене. Во всех зеркальных условиях успешность снижается, иногда на десятки процентных пунктов, причём большинство ошибок происходит без контакта робота с зеркалом, то есть дело не только в физическом препятствии. Анализ траекторий показывает, что модели пытаются хватать отражения (phantom targeting) и неверно определяют положение реальных объектов. Это указывает на общую уязвимость embodied AI к отражающим поверхностям и мотивирует оценку с учётом отражений.'}, 'en': {'title': 'Mirrors Reveal a Blind Spot in Robot Manipulation', 'desc': 'The paper introduces RoboDojo-Mirror, a benchmark for testing robot manipulation policies in scenes with mirrors. Across five kinds of policies, mirrors reduce task success, with especially large drops when the tabletop is reflective. Comparisons with non-reflective panels suggest that collisions alone do not explain the failures; robots often appear to target reflected objects or misjudge where real objects are. Real-robot tests show similar weaknesses, highlighting the need to evaluate policies in reflective environments.'}, 'zh': {'title': '镜中虚像，照出机器人操作策略的盲点', 'desc': '本文提出 RoboDojo-Mirror 基准，用来评估机器人操作策略在镜面环境中的表现，并与无镜面场景进行比较。实验覆盖视觉-语言-动作模型、世界动作模型和智能体策略，发现所有策略在镜面条件下的成功率都有下降，镜面桌面造成的影响尤其明显。与非反光障碍物的对照实验显示，许多镜面相关失败并非由机器人撞上镜子导致，而是与追踪镜中虚像或误判真实物体位置有关。真实机器人实验也观察到类似问题，说明不同类型的操作策略普遍缺乏对反射环境的适应能力。'}}}, {'id': 'https://huggingface.co/papers/2611.32183', 'title': 'ThinkMorph-SSL: Scaling Interleaved Multimodal Reasoning with Pretext Tasks', 'url': 'https://huggingface.co/papers/2611.32183', 'abstract': 'Abstract A two-stage training approach uses visual pretext tasks to generate interleaved image-text reasoning traces and automatically built demonstrations, improving multimodal reasoning over instruction tuning alone.  Generated by deepseek-ai/DeepSeek-V4.1-Flash People reason with pictures as well as words. Interleaved multimodal reasoning gives models a similar way to solve problems by creating intermediate images and using them to guide further reasoning. Training models with this ability usually relies on task-specific demonstrations, which are difficult to collect. We introduce ThinkMorph-SSL, a two-stage training recipe that uses images themselves as a source of supervision. The first stage, pretext reasoning, converts visual pretext tasks, such as image colorization and denoising, into instruction-free interleaved traces. Models describe a corrupted or transformed image, generate a restored or canonical image, and interpret the result. The second stage uses automatically constructed demonstrations for question-driven instruction tuning. At the same instruction-tuning budget, models trained with pretext reasoning outperform those trained with instruction tuning alone. The full recipe improves over the base model by an average of 11.33 accuracy points across twelve benchmarks. These results show that supervision derived from images can build the visual skills needed for interleaved reasoning and improve learning from task-specific demonstrations.', 'score': 21, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '8a508f6dd994fd61', 'authors': ['Jiawei Gu', 'Linjie Li', 'Yiming Liu', 'Yunzhuo Hao', 'Huichen Wang', 'Guanzheng Chen', 'Zhichao Peng', 'Luxin Xu', 'Xinyu Zhang', 'Li Luo', 'Disen Lan', 'Zican Hu', 'Mingyang Song', 'David Valente', 'Alex Jinpeng Wang', 'Yafu Li', 'Ganqu Cui', 'Zhengyuan Yang', 'Qizhe Xie', 'Yejin Choi', 'Ranjay Krishna', 'Yu Cheng'], 'affiliations': ['Central South University', 'Fudan University', 'Nanjing University', 'National University of Singapore', 'Stanford University', 'The Chinese University of Hong Kong', 'The University of Hong Kong', 'Tsinghua University', 'University of Rochester', 'University of Washington', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32183.jpg', 'data': {'categories': ['#cv', '#reasoning', '#optimization', '#multimodal', '#training', '#synthetic'], 'emoji': '🖼️', 'ru': {'title': 'Картинки сами учат модель думать глазами', 'desc': 'В статье предлагается двухэтапный метод обучения мультимодальных LLM, в котором модель учится рассуждать, чередуя текст и изображения. На первом этапе используются визуальные претекст-задачи, например колоризация и шумоподавление, где модель описывает искажённое изображение, генерирует восстановленное и интерпретирует результат. На втором этапе применяется instruction tuning на автоматически созданных демонстрациях. Метод при том же бюджете обучения превосходит обычный instruction tuning и даёт в среднем +11.33 пункта точности на двенадцати бенчмарках.'}, 'en': {'title': 'Teach models to reason with images—using images themselves as supervision', 'desc': 'ThinkMorph-SSL trains multimodal models in two stages to improve visual reasoning. First, visual pretext tasks such as colorization and denoising teach models to describe images, generate restored images, and interpret the results as interleaved reasoning traces. Next, automatically created demonstrations are used for question-driven instruction tuning. This approach outperforms instruction tuning alone and raises average accuracy by 11.33 points across twelve benchmarks.'}, 'zh': {'title': '让图像成为监督信号，教模型图文交错推理', 'desc': '这篇论文提出 ThinkMorph-SSL，一种让多模态模型学会交替使用文字和图像进行推理的两阶段训练方法。第一阶段把图像着色、去噪等视觉预训练任务转化为推理过程：模型先描述图像，再生成修复后的图像，最后解释结果。第二阶段利用自动构建的示范数据进行指令微调，减少对人工任务示范的依赖。在相同的指令微调训练预算下，该方法优于单独进行指令微调；完整方案在十二个基准测试上的平均准确率比基础模型提高了 11.33 个百分点。'}}}, {'id': 'https://huggingface.co/papers/2611.32736', 'title': 'Qwen-Image-HD: Autoregressive Diffusion for High Definition Image Generation', 'url': 'https://huggingface.co/papers/2611.32736', 'abstract': 'Abstract  Fine-tuning a generator on a complete high-resolution canvas requires long image sequences and substantial computation, yet local regions can still exhibit unnatural repetitive stripes when training resources are limited. We introduce Qwen-Image-HD, which adapts Qwen-Image 2.0 to high-resolution synthesis through local training and blockwise autoregressive generation. Each prediction covers a target tile at 1K scale, conditioned on high-resolution upper and left neighbors and a compressed historical thumbnail. These conditions provide adjacent fine-scale structures and an overview of the scene generated so far. To integrate these complementary cues, we map both forms of history and the target to a shared canvas coordinate system to express their spatial relationships and scale differences. On Qwen-Image-Bench at 4K, Qwen-Image-HD achieves stronger overall evaluation performance than direct 4K generation with FLUX-3-Image-Klein. Compared with full-image 4K supervised fine-tuning of the same backbone, it achieves better generation quality with lower training compute and higher inference efficiency, while exhibiting fewer unnatural repetitive stripes in original-resolution comparisons. We further introduce a Wavefront-AutoRegressive inference schedule that generates tiles on the same anti-diagonal concurrently across GPUs to reduce single-image latency.', 'score': 19, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '1bea09d3c4b02585', 'pdf_title_img': 'assets/pdf/title_img/2611.32736.jpg', 'data': {'categories': ['#cv', '#benchmark', '#optimization', '#architecture', '#training', '#inference', '#diffusion'], 'emoji': '🖼️', 'ru': {'title': 'Высокое разрешение по кусочкам: быстрее, чище и без полос', 'desc': 'Авторы представляют Qwen-Image-HD, метод адаптации генеративной модели Qwen-Image 2.0 для синтеза изображений в высоком разрешении. Изображение создаётся блоками (тайлами) размером 1K в режиме блочной авторегрессии, что позволяет обучать модель локально и избегать длинных последовательностей. Каждый тайл условно генерируется на основе соседних фрагментов высокого разрешения и сжатой миниатюры уже созданной части сцены, а все эти данные сводятся к общей системе координат холста. На бенчмарке Qwen-Image-Bench при 4K метод превосходит прямую генерацию и полное SFT-дообучение по качеству, вычислительным затратам и эффективности инференса, а также предлагает схему Wavefront-AutoRegressive для параллельной генерации тайлов на нескольких GPU.'}, 'en': {'title': 'Build high-resolution images tile by tile, with the whole scene in view.', 'desc': 'Qwen-Image-HD adapts Qwen-Image 2.0 for high-resolution image generation using local training and blockwise autoregressive generation. It predicts each 1K tile from high-resolution tiles above and to the left, along with a compressed thumbnail summarizing the image so far. Mapping these inputs and the target into a shared canvas coordinate system helps the model combine fine-scale details with the overall scene layout. On 4K benchmarks, it delivers stronger image quality with less training compute and fewer repetitive stripes, while a wavefront schedule generates independent tiles concurrently to reduce latency.'}, 'zh': {'title': '分块生成高分辨率图像：更清晰、更高效、更少条纹', 'desc': '本文提出 Qwen-Image-HD，通过局部训练和分块自回归生成，让模型以较低计算成本合成高分辨率图像。模型每次预测一个 1K 尺寸的图块，并参考高分辨率的上方与左侧邻块，以及压缩后的历史缩略图。它将这些信息和目标图块映射到统一画布坐标系，以便融合邻近细节与整体场景布局。实验显示，该方法在 4K 图像生成质量、训练计算量和推理效率方面表现更好，并减少了不自然的重复条纹；波前自回归调度还可并行生成图块，降低单张图像的延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.28719', 'title': 'KMed-31B Technical Report', 'url': 'https://huggingface.co/papers/2611.28719', 'abstract': 'Abstract  We present KMed-31B, a medical large language model post-trained from an open-weight model for on-premises deployment with limited hardware. Post-training a model for diverse medical tasks remains difficult, because improving one kind of task can lower performance on another. We attribute this to differences between tasks in expected output and available feedback. Medical question answering and diagnosis prediction have reference answers, whereas clinical inquiry has no single correct response and is judged with rubrics. We therefore divide medical training tasks into four categories by these two properties, train one specialist per category with a reward that its feedback supports, and integrate the specialists into a single student with Multi-teacher On-policy Delta Distillation (MOPD^2). For clinical inquiry, we build Synthetic Health Dialogue, a simulated corpus of consultations with lay users and clinicians whose patient cases span common clinical presentations in primary care. Relative to its base model, KMed-31B raises HealthBench Hard from 22.95 to 41.87 and HealthBench Professional from 37.92 to 50.20 in non-thinking mode, and from 23.80 to 51.48 and from 41.97 to 59.18 in thinking mode, while its scores on four multiple-choice medical benchmarks are maintained or slightly improved. KMed-31B has the highest unadjusted HealthBench Hard score among the compared models, including proprietary ones, and scores higher on HealthBench Professional than every open-weight model we compare, including models with more than ten times as many total parameters. Applied to another base model, Qwen3.8-27B, the same training recipe also raises both HealthBench scores. We describe the training recipe, data construction, and settings in detail so that institutions requiring on-premises deployment can develop medical models from open-weight foundations.', 'score': 19, 'issue_id': 3564, 'pub_date': '2026-11-21', 'pub_date_card': {'ru': '21 ноября', 'en': 'November 21', 'zh': '11月21日'}, 'hash': '9863b3032f744cb7', 'pdf_title_img': 'assets/pdf/title_img/2611.28719.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#dataset', '#data', '#alignment', '#healthcare', '#training', '#rlhf', '#synthetic'], 'emoji': '🩺', 'ru': {'title': 'Медицинская LLM, которая учится без потери качества и работает у вас дома', 'desc': 'Авторы представляют KMed-31B — медицинскую LLM, дообученную на открытой модели для работы on-premises на ограниченном железе. Медицинские задачи делятся на четыре категории по типу ожидаемого ответа и обратной связи, и для каждой обучается отдельный specialist-модель с подходящим reward. Знания специалистов объединяются в единого student через метод MOPD^2 (Multi-teacher On-policy Delta Distillation), а для задач клинического опроса создан синтетический корпус Synthetic Health Dialogue. Модель заметно улучшает результаты на HealthBench Hard и HealthBench Professional, сохраняя качество на тестах с вариантами ответов, и превосходит многие открытые модели, включая те, что крупнее в десятки раз.'}, 'en': {'title': 'Four medical specialists, one stronger model', 'desc': 'KMed-31B is an open-weight medical language model designed to run on local hardware. To handle different kinds of medical tasks, the researchers trained four specialists with rewards suited to each task category, then combined them into one model using Multi-teacher On-policy Delta Distillation. They also created simulated health dialogues to train the model for clinical conversations, where answers are judged by rubrics rather than a single reference answer. KMed-31B improved scores on two clinical benchmarks while maintaining or slightly improving performance on four multiple-choice medical benchmarks.'}, 'zh': {'title': '专才协同蒸馏，让医疗模型在有限硬件上更强更可靠', 'desc': '本文介绍了 KMed-31B，这是一个从开放权重模型后训练而成、适合在硬件资源有限的机构内部部署的医疗大语言模型。为减少不同医疗任务之间的性能冲突，研究者根据任务的输出形式和反馈方式，将任务分为四类，分别训练专长模型，再用多教师在线策略增量蒸馏（MOPD²）整合成一个学生模型。对于没有标准答案的临床问诊任务，他们还构建了模拟患者与临床医生对话的合成数据集 Synthetic Health Dialogue。实验显示，KMed-31B 显著提升了 HealthBench 评分，同时保持或略微改善了四项医疗选择题基准的表现；相同训练方案用于另一基础模型时也有效。'}}}, {'id': 'https://huggingface.co/papers/2611.32649', 'title': 'ICLWorld: Benchmarking In-Context Learning of Agents from Digital to Physical Worlds', 'url': 'https://huggingface.co/papers/2611.32649', 'abstract': 'Abstract An online benchmark evaluates in-context learning across computer-use and robot-use agent tasks, revealing large gaps between digital and physical performance and between recognizing rules and acting on them.  Generated by deepseek-ai/DeepSeek-V4.1-Flash In-context learning (ICL) lets agents acquire new rules from context and adapt to user-specific requirements at inference time. The same frontier agents now operate both computers and robots, yet their ICL remains insufficiently assessed: existing benchmarks are largely offline, rely on text or static images, and risk training-data contamination, while robot evaluations are limited to method-level ablations. We present ICLWorld, an online benchmark that evaluates the ICL of agents from digital to physical worlds, covering computer use and robot use, together with UIverse, a unified harness that turns every environment into a user interface. We build 30 environments, record 630 demonstration videos (10+ hours), and design 160 tasks with customized, often counter-intuitive rules that cannot be satisfied without learning from the context. Each task comes with three rule versions, given as text or video, and we test generalization at three levels, from replaying the demonstration to new instances and unseen environments. Across six frontier models, the strongest agents, Claude Opus 5.5 and GPT-6 Astra, succeed on 82% and 76% of computer-use runs but only 27% and 26% of robot-use runs, and a no-rule control reduces success to at most 8%. GPT-6 Astra succeeds under all three rule versions on only 38% of computer-use tasks, half its rate under a single rule, and answers 98% of robot rule questions correctly yet completes only 20% of these tasks. Frontier agents learn rules comparably well from video and from text and transfer them across environments, whereas weaker agents rely on text and lose most of their video-based success once the demonstrated situation is resampled. These findings reveal substantial gaps between the digital and the physical world and between identifying a rule and acting on it.', 'score': 18, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '901acff262eb458e', 'pdf_title_img': 'assets/pdf/title_img/2611.32649.jpg', 'data': {'categories': ['#interpretability', '#benchmark', '#multimodal', '#agi', '#agents', '#dataset', '#robotics', '#video'], 'emoji': '🤖', 'ru': {'title': 'Понять правило не значит действовать: агенты в цифре и в реальном мире', 'desc': 'В статье представлен ICLWorld — онлайн-бенчмарк для оценки in-context learning (ICL) агентов в цифровых и физических средах: работа с компьютером и управление роботом. Авторы создали 30 сред, 630 видеодемонстраций и 160 задач с нестандартными правилами, которые нельзя выполнить без обучения по контексту, и проверили обобщение на трех уровнях. Лучшие LLM-агенты решают до 82% задач на компьютере, но лишь около 27% задач с роботом, а без правил успех падает до 8%. Результаты показывают большой разрыв между цифровым и физическим миром и между пониманием правила и умением по нему действовать.'}, 'en': {'title': 'Knowing the Rule Is Not the Same as Doing It', 'desc': 'The paper introduces ICLWorld, an online benchmark for testing in-context learning (ICL) in computer-use and robot-use agents, and UIverse, a shared interface for evaluating agents across environments. It includes 30 environments, 160 tasks with custom rules, and demonstrations provided as text or video, testing whether agents can apply rules to familiar and unfamiliar situations. Frontier models perform much better on computer tasks than robot tasks, and correctly answering questions about a rule does not guarantee that an agent can carry it out. The results also show that stronger agents learn from video about as well as from text, while weaker agents struggle to generalize beyond the demonstrated situation.'}, 'zh': {'title': '会认规则，更要会行动', 'desc': '论文提出 ICLWorld 在线基准，用于评估智能体在电脑操作和机器人操作中的上下文学习（ICL）能力，并通过 UIverse 统一不同环境的交互方式。基准包含 30 个环境、630 段演示视频和 160 项带有定制规则的任务，测试智能体能否从文字或视频中学会规则，并将其迁移到新情境和未见环境。实验显示，顶尖模型在电脑任务上的成功率明显高于机器人任务；即使能正确回答规则问题，也常常无法据此完成实际操作。研究还发现，强模型从视频和文字中学习规则的表现相近，而较弱模型更依赖文字，且在情境变化后表现容易下降。'}}}, {'id': 'https://huggingface.co/papers/2611.29184', 'title': 'PhyCoVE: Benchmarking Physical Counterfactual Video Editing across Diverse Material Dynamics', 'url': 'https://huggingface.co/papers/2611.29184', 'abstract': 'Abstract PhyCoVE, a 533-case benchmark, and counterfactual fidelity evaluate video editing models on physical counterfactual edits involving rigid, elastic, and fluid dynamics, showing that even the best model reproduces only about one seventh of the physical change.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Physical counterfactual video editing turns a source video and a language-specified physical edit at a given execution frame into a counterfactual video that shows how the scene would evolve after the edit. Existing evaluations with counterfactual target videos mainly cover object removal or specific rigid-body motions, although real scenes also involve elastic deformation, fluid flow, and interactions among rigid bodies, elastic solids, and fluids. We introduce PhyCoVE, a benchmark of 533 cases on 110 source videos that covers rigid, elastic, and fluid dynamics in five interaction patterns, with edits that remove an object, change a physical quantity, or insert a new object. For the simulated cases, a language model proposes scene designs, coding agents build them with solvers suited to each material and physically based rendering and then simulate each edit from the source scene state, and humans check every stage. For the real cases, we record continuously from one camera position before and after each edit. We also propose counterfactual fidelity, a metric that applies across materials and their interactions and measures how much of the physical change from the source video to the target video a generated video reproduces. We evaluate seven open-source and commercial video editing models and find that counterfactual fidelity ranks them nearly as human preference does, but even the best model reproduces only about one seventh of the physical change. The models change how a scene looks but rarely how it evolves, whereas a physical edit requires understanding the dynamics that it changes. Physical counterfactual video editing thus remains far from solved, and PhyCoVE provides a foundation for developing and evaluating methods for it.', 'score': 15, 'issue_id': 3564, 'pub_date': '2026-11-22', 'pub_date_card': {'ru': '22 ноября', 'en': 'November 22', 'zh': '11月22日'}, 'hash': '59d131e4984bdd2b', 'authors': ['Conghan Yue', 'Yuanjie Chen', 'Yunyan Xiao', 'Zeyu Peng', 'Xingsong Ye', 'Ya Gao', 'Yanglin Huang', 'WeiYao Zhang', 'Yue Han', 'Zhineng Chen', 'Yu-Gang Jiang'], 'affiliations': ['Institute of Trustworthy Embodied AI, Fudan University'], 'pdf_title_img': 'assets/pdf/title_img/2611.29184.jpg', 'data': {'categories': ['#benchmark', '#science', '#dataset', '#data', '#video', '#synthetic'], 'emoji': '🎬', 'ru': {'title': 'Видео-модели меняют внешний вид сцены, но не её физику', 'desc': 'Статья представляет PhyCoVE — бенчмарк из 533 кейсов на 110 исходных видео для оценки моделей физического контрфактического редактирования видео, охватывающих твёрдые тела, эластичные материалы и жидкости. Данные созданы комбинированным способом: симуляции, построенные LLM и кодирующими агентами с проверкой людьми, и реальные записи с одной камеры до и после правки. Авторы вводят метрику counterfactual fidelity, которая измеряет долю физического изменения, воспроизведённую сгенерированным видео. Оценка семи моделей показала, что даже лучшая воспроизводит лишь около одной седьмой физического изменения, так как модели меняют внешний вид сцены, но плохо передают её динамику.'}, 'en': {'title': 'Editing the Look Isn’t Enough: Video Models Must Change the Physics', 'desc': 'The paper introduces PhyCoVE, a benchmark of 533 cases for testing video editing models on physical changes involving rigid objects, elastic materials, and fluids. It also proposes counterfactual fidelity, a metric that measures how much of the physical change in a target video an edited video reproduces. Tests of seven video editing models show that this metric ranks models similarly to human preferences, but even the best model reproduces only about one seventh of the physical change. The results suggest that current models can alter a scene’s appearance but struggle to simulate how it evolves after a physical edit.'}, 'zh': {'title': '让视频真正改变物理演变，而不只是改变画面', 'desc': '本文提出 PhyCoVE，这是一个包含 533 个案例的视频编辑基准，覆盖刚体、弹性体和流体动力学，以及多种物体交互。任务是根据文字指令和指定执行时刻修改源视频中的物理条件，并生成编辑后场景的演变过程。研究还提出“反事实保真度”指标，用来衡量生成视频复现目标物理变化的程度；该指标对不同材料和交互都适用，其模型排名与人类偏好大致一致。对七种视频编辑模型的评测显示，最佳模型也只复现了约七分之一的物理变化，说明现有模型往往改变画面外观，却难以准确生成物理过程。'}}}, {'id': 'https://huggingface.co/papers/2611.33148', 'title': 'CoT-Proxy: Cross-Format Transfer for Distilling Long-Horizon Policies', 'url': 'https://huggingface.co/papers/2611.33148', 'abstract': "Abstract  Reasoning models become long-horizon agents through reinforcement learning or, more cheaply, through fine-tuning on a stronger teacher's trajectories, which contain the teacher's chain-of-thought as well as its actions. The standard fine-tuning approach imitates both, yet the strongest teachers are closed models whose chain-of-thought is hidden behind an API. We show that the chain-of-thought can be left out altogether and that the long-horizon policy can be distilled from the teacher's actions alone. The student is trained on these trajectories with its reasoning block left empty, while a KL loss on a replay buffer of its own generations limits drift from its initial model. Surprisingly, the policy learned from these trajectories with an empty reasoning block carries over to inference with thinking enabled, where the student reasons in its own style while acting like the teacher, an effect we call cross-format transfer. Distilling the actions of Qwen3.6-27B raises the task success of Qwen3-4B on AppWorld from 7% to 18% and that of Qwen3-32B from 12% to 25%. We further introduce CoT-proxies, short summaries of the teacher's reasoning placed after the empty reasoning block, which raise Qwen3-4B further, to 35%. Since neither actions nor CoT-proxies need the hidden chain-of-thought, the recipe applies unchanged to closed teachers. Distilling GPT-5.6 Luna from its visible outputs and the reasoning summaries its API returns raises Qwen3-4B from 7% to 48% on AppWorld and from 3% to 28% on SWE-bench Verified.", 'score': 14, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '18ca023d2eb8b6c1', 'authors': ['Dawid J. Kopiczko', 'Tijmen Blankevoort', 'Yuki M. Asano'], 'affiliations': ['NVIDIA', 'University of Technology Nuremberg'], 'pdf_title_img': 'assets/pdf/title_img/2611.33148.jpg', 'data': {'categories': ['#small_models', '#training', '#reasoning', '#agents', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Учимся действовать как учитель, не видя его мыслей', 'desc': 'Авторы показывают, что для дообучения reasoning-моделей, работающих как long-horizon агенты, можно использовать только действия сильного учителя, без его chain-of-thought, который часто скрыт за API. Ученик обучается на траекториях с пустым блоком рассуждений, а KL-loss на replay buffer ограничивает дрейф от исходной LLM. Выученная политика переносится на инференс с включённым thinking (эффект cross-format transfer), и добавление CoT-proxies, кратких саммари рассуждений учителя, дополнительно повышает качество. Метод работает и с закрытыми моделями: дистилляция GPT-5.6 Luna поднимает Qwen3-4B на AppWorld и SWE-bench Verified.'}, 'en': {'title': 'Teach the Actions, Not the Hidden Thoughts', 'desc': 'This paper shows that a smaller language model can learn a teacher’s long-horizon behavior by imitating its actions, without access to the teacher’s hidden chain-of-thought. The student is trained with an empty reasoning block, while a KL-divergence loss on its own generations helps preserve its original behavior. At inference, the student can use its own reasoning style and still follow the teacher’s policy, a result the authors call cross-format transfer. Short reasoning summaries, called CoT-proxies, can improve performance further, including when distilling from closed models.'}, 'zh': {'title': '不必窥见教师思维链，也能学会它的行动策略', 'desc': '这篇论文研究如何把强教师模型的长程决策能力迁移给较小的学生模型，而不依赖教师隐藏的思维链。训练时，学生只模仿教师的行动，并用自身生成内容的回放缓冲区施加 KL 散度约束，以减少模型偏离初始状态。即使训练时推理模块为空，学生在推理时开启思考仍能保持类似教师的行动策略，这种现象被称为跨格式迁移。研究还提出简短的思维链代理摘要来进一步提升表现，并在 AppWorld 和 SWE-bench Verified 等任务上取得显著提升。'}}}, {'id': 'https://huggingface.co/papers/2611.30986', 'title': 'Reinforcing Diffusion Models by Instantaneous Trajectory Distribution Matching', 'url': 'https://huggingface.co/papers/2611.30986', 'abstract': 'Abstract  Forward diffusion reinforcement learning (RL)---enabling deterministic ODE sampling without trajectory backpropagation---has grown increasingly popular for efficiently aligning diffusion models. However, we reveal that existing methods essentially rely on signed reward-weighted regression (RWR), regressing the trainable policy velocity onto rollouts from a behavior distribution. Unbiased baseline subtraction implicitly assumes that the policy velocity equals the behavior marginal velocity---an idealized assumption violated under classifier-free guidance (CFG) rollouts, offline/off-policy updates, and imperfect online self-consistency. This behavior--policy mismatch breaks baseline invariance and injects baseline-induced gradient drift, destabilizing training. To resolve this issue, we propose Instantaneous Trajectory Distribution Matching (iTDM), taking the infinitesimal limit of Trajectory Distribution Matching toward a time-local reward-guided target via the posterior-score identity to yield a sample-level gradient anchored at the behavior velocity without learning an additional reward-tilted target score. Tracking this velocity with an online auxiliary denoiser guarantees exact baseline invariance at the auxiliary optimum, effectively suppressing baseline drift across both online and offline RL. Extensive experiments across compositional generation, text rendering, and preference alignment show that iTDM achieves state-of-the-art in-domain and out-of-domain performance across group-wise online/offline RL and pairwise offline RL. Notably, on the challenging GenEval2 benchmark, iTDM converges nearly 3\\times faster than competing methods while scaling smoothly to 0.87 without collapse. Furthermore, iTDM scales effectively to the 5.6B FLUX.3 model, achieving better performance across both in-domain and unseen metrics. Code is available at https://github.com/Luo-Yihong/iTDM', 'score': 13, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '9e29f1682ee878d4', 'authors': ['Yihong Luo'], 'affiliations': ['Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2611.30986.jpg', 'data': {'categories': ['#optimization', '#alignment', '#rl', '#training', '#rlhf', '#diffusion'], 'emoji': '🧭', 'ru': {'title': 'Стабилизируем обучение диффузионных моделей, выравнивая скорость политики с поведением', 'desc': 'В статье рассматривается обучение с подкреплением (RL) для диффузионных моделей, где сэмплирование выполняется детерминированным ODE без обратного распространения по траектории. Авторы показывают, что существующие методы фактически опираются на signed reward-weighted regression, и что допущение о совпадении скорости политики со скоростью поведенческого распределения нарушается при CFG, офлайн-обновлениях и неидеальной онлайн-самосогласованности. Это приводит к смещению градиента, вызванному baseline, и к нестабильности обучения. Предложенный метод iTDM, основанный на бесконечно малом пределе Trajectory Distribution Matching, гарантирует точную инвариантность к baseline и показывает состояние-of-the-art результаты на задачах генерации, рендеринга текста и выравнивания предпочтений.'}, 'en': {'title': 'Anchor diffusion RL to behavior—and stop baseline drift', 'desc': 'The paper shows that existing forward diffusion reinforcement learning methods can become unstable when the behavior distribution differs from the policy, because baseline subtraction then introduces gradient drift. It proposes Instantaneous Trajectory Distribution Matching (iTDM), which uses a posterior-score identity to create a local, reward-guided training signal anchored to the behavior velocity. An online auxiliary denoiser tracks that velocity, making baseline subtraction invariant at the auxiliary model’s optimum and reducing drift in both online and offline training. Experiments report strong in-domain and out-of-domain results, faster convergence on GenEval2, and effective scaling to a 5.6B-parameter model.'}, 'zh': {'title': '以行为速度为锚点，让扩散强化学习训练更稳更快', 'desc': '本文指出，现有扩散强化学习方法本质上依赖带符号奖励加权回归，而行为分布与策略速度不匹配时，基线会引入梯度偏移并导致训练不稳定。作者提出瞬时轨迹分布匹配（iTDM），利用后验得分恒等式构造时间局部的奖励引导目标，并以行为速度为锚点计算样本级梯度，无需额外学习奖励倾斜的目标得分。iTDM通过在线辅助去噪器跟踪行为速度，在辅助模型达到最优时确保基线不变性，从而抑制在线与离线强化学习中的基线漂移。实验显示，iTDM在多种生成与偏好对齐任务上表现领先，在GenEval2上收敛速度接近其他方法的三倍，并能扩展至5.6B参数模型。'}}}, {'id': 'https://huggingface.co/papers/2611.32462', 'title': 'MAGPIE: Agentic Multi-Reference Image Generation via Executable Scene Construction', 'url': 'https://huggingface.co/papers/2611.32462', 'abstract': "Abstract  Multi-reference image generation requires a model to preserve the appearance of selected subjects while arranging them according to an instruction. Despite recent progress in reference-based generation and compositional control, reliably organizing selected subjects into the intended scene remains challenging. Although existing methods provide various forms of compositional guidance, the planned relationships are not always explicitly instantiated for inspection and refinement before image synthesis. To address this limitation, we introduce MAGPIE, which represents the intended composition as a simplified 3D scene defined by an executable Blender program. A coding agent links each scene instance to its reference, checks the geometry and rendered view against the instruction, and revises the program to correct discrepancies. The final proxy rendering serves as a visual plan for the image generator. Using MAGPIE-Instruct-3K, we train the generator to follow this plan while drawing each subject's appearance from its reference. MAGPIE improves both Qwen and FLUX on DreamOmni2 and SconeEval. With FLUX, it improves overall success on DreamOmni2 by 28.21 percentage points over the original backbone and achieves the highest overall score among the models evaluated on SconeEval.", 'score': 13, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'd1d82f5b66e30bda', 'authors': ['Yifan Dai', 'Daili Hua', 'Bohan Zeng', 'Yuran Wang', 'Jialing Liu', 'Bozhou Li', 'Chengzhuo Tong', 'Yang Shi', 'Kai Zeng', 'Liu Yang', 'Xinyu Liu', 'Shujie Li', 'Yiyan Ji', 'Bingyin Mei', 'Yushuo Guan', 'Yuanxing Zhang', 'Fangcheng Fu', 'Wentao Zhang'], 'affiliations': ['HKU', 'HKUST', 'KlingAI Research', 'NJU', 'Peking University', 'Renmin University of China', 'SJTU', 'Shanghai Jiao Tong University', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2611.32462.jpg', 'data': {'categories': ['#cv', '#benchmark', '#agents', '#multimodal', '#dataset', '#training', '#3d'], 'emoji': '🎬', 'ru': {'title': 'Сначала план в 3D, потом картинка', 'desc': 'Статья представляет MAGPIE, метод генерации изображени
