                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.40394', 'title': 'Scaling Mathematical Proof Supervision from Structured Textbooks', 'url': 'https://huggingface.co/papers/2610.40394', 'abstract': 'Abstract A large-scale corpus of structured proof-supervision records derived from university mathematics textbooks improves language model mathematical reasoning by 16.7 percentage points over a base model when used for fine-tuning.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Mathematical supervision for language models is typically flattened into isolated problem-solution pairs, discarding the curricular organization and evidential structure of the original sources. We introduce TOME-Math (Textbook-Oriented Mathematical Evidence), a large-scale corpus that converts 2,118 textbooks spanning the core areas of university-level mathematics subjects into approximately 380K structured proof-supervision records while preserving chapter order, proposition-proof links, dependency references, and source provenance. Leveraging these structural signals, we explore curriculum learning across multiple mathematical subjects and characterize scaling patterns with supervision volume and source breadth. At full scale, fine-tuning on TOME-Math raises the unweighted mean score across our held-out evaluations and established public benchmarks by 16.7 percentage points over the base model, while exceeding all three public instruction-data baselines evaluated in aggregate. Our findings highlight structured textbooks as both a scalable source of mathematical supervision and an empirical framework for studying the impact of data organization on mathematical reasoning. We will release the corpus to facilitate further research on structured mathematical supervision.', 'score': 37, 'issue_id': 3525, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '07c594cc3cb50ff9', 'authors': ['Youqing Fang', 'Zhouqi Hua', 'Yinhao Tang', 'Yuzhe Gu', 'Lingkai Kong', 'Bin Liu', 'Weiming Zhang', 'Kai Chen', 'Yanan Sun', 'Wenwei Zhang'], 'affiliations': ['Fudan University', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.40394.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#training', '#dataset', '#benchmark', '#data', '#math', '#synthetic'], 'emoji': '📚', 'ru': {'title': 'Учебники как структурированный источник математических рассуждений для LLM', 'desc': 'Авторы представляют TOME-Math — большой корпус из примерно 380 тысяч структурированных записей для supervision, полученных из 2 118 университетских учебников по математике. В отличие от обычных пар «задача–решение», корпус сохраняет порядок глав, связи между утверждениями и доказательствами, ссылки на зависимости и происхождение источника. Использование такого корпуса для fine-tuning LLM, включая curriculum learning, повышает среднюю оценку на held-out и публичных бенчмарках на 16,7 процентных пункта относительно базовой модели и превосходит три публичных instruction-датасета. Работа показывает, что структурированные учебники — масштабируемый источник математического supervision и удобная среда для изучения влияния организации данных на математические рассуждения.'}, 'en': {'title': 'Teach Math in the Structure of Textbooks', 'desc': 'TOME-Math is a large corpus of mathematical training examples made from 2,118 university textbooks. It contains about 380,000 records that preserve the order of chapters, links between propositions and proofs, dependencies, and source information. Fine-tuning a language model on the full corpus improved its average score across evaluations by 16.7 percentage points over the base model, and outperformed three public instruction-data baselines overall. The results suggest that structured textbook data can support mathematical reasoning and help researchers study how data organization affects learning.'}, 'zh': {'title': '让教材的结构成为数学推理的训练优势', 'desc': '论文提出了 TOME-Math 数据集，从 2,118 本大学数学教材中整理出约 38 万条结构化证明监督记录。与只保留题目和答案的数据不同，这些记录还保留章节顺序、命题与证明的对应关系、知识依赖和来源信息。研究者用该数据对语言模型进行微调，并探索不同数学学科的课程学习，以及训练效果随数据规模和来源广度变化的规律。完整规模训练使模型在多项评测上的平均成绩比基础模型提高 16.7 个百分点，并整体超过三种公开指令数据基线。'}}}, {'id': 'https://huggingface.co/papers/2611.13410', 'title': 'SteerDistill: Quantizing LLM Agents via Closed-Loop Teacher Steering', 'url': 'https://huggingface.co/papers/2611.13410', 'abstract': "Abstract Low-bit quantized LLM agents can recover much of their task success through closed-loop guidance from a full-precision teacher, followed by unassisted student training on corrected and reference turns.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Low-bit quantization reduces the inference cost of LLM agents but can compromise task success. Examining failed rollouts, we find that quantized agents overlook task requirements or environmental conditions, producing environment transitions that diverge from successful full-precision references. Correcting these behavioral divergences remains difficult: offline data may miss the student's failure contexts, while its own rollouts may provide few correct responses in those contexts. We introduce SteerDistill, a quantization-aware distillation method in which a full-precision teacher guides the student to revise failed responses and iteratively refines its guidance using feedback from student execution. This closed-loop teacher steering produces locally verified behavioral corrections. We internalize these corrections by training the student without guidance to match the steered student's predictions at corrected turns and the full-precision teacher's at other turns, enabling unassisted inference. Across five agentic benchmarks and three models, SteerDistill exceeds the strongest quantized baseline by 1.67--2.18 points in average score under W4A16 and stays within one point of BF16. On τ^2-Bench, it outperforms QeRL by 1.84 percentage points in success rate using 67% fewer training GPU hours and produces shorter successful trajectories than the quantized baselines.", 'score': 30, 'issue_id': 3525, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'f0f989e4c82bcff2', 'authors': ['Genming Cui', 'Xiangyu Li', 'Zixu Hao', 'Xin Ding', 'Yunxin Liu', 'Ting Cao'], 'affiliations': ['Institute for AI Industry Research (AIR), Tsinghua University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.13410.jpg', 'data': {'categories': ['#training', '#benchmark', '#inference', '#alignment', '#agents'], 'emoji': '🧭', 'ru': {'title': 'Учим квантованного агента исправлять свои ошибки с помощью умного наставника', 'desc': 'Квантованные LLM-агенты часто теряют точность, поскольку упускают требования задачи или условия среды, и их ошибки расходятся с успешными траекториями полноточной модели. Метод SteerDistill решает эту проблему через quantization-aware distillation: полноточный teacher направляет student на исправление неудачных ответов, а затем student обучается без подсказок воспроизводить эти исправления. В экспериментах на пяти agentic benchmarks и трёх моделях метод превосходит лучший квантованный baseline при W4A16 и почти совпадает с BF16. При этом он требует на 67% меньше GPU-часов обучения, чем QeRL, и даёт более короткие успешные траектории.'}, 'en': {'title': 'Guide the Student, Then Let It Succeed Alone', 'desc': 'Low-bit quantization makes large language model agents cheaper to run, but can cause them to miss task requirements or environmental conditions. SteerDistill uses a full-precision teacher to revise the quantized student’s failed responses, then refines this guidance using feedback from the student’s execution. The student is trained without guidance to imitate the teacher on ordinary turns and its corrected behavior on revised turns, enabling unassisted inference. Across five benchmarks and three models, this method improves on quantized baselines and comes close to BF16 performance while using less training time than QeRL on τ²-Bench.'}, 'zh': {'title': '闭环教师引导，让量化智能体学会独立纠错', 'desc': '低比特量化能降低大语言模型智能体的推理成本，但也可能让它们忽略任务要求或环境条件，导致任务成功率下降。论文提出 SteerDistill：由全精度教师模型引导量化学生模型修正失败响应，并根据学生实际执行的反馈不断调整指导。随后，学生在无需教师帮助的情况下训练，在修正过的轮次模仿引导后的行为，在其他轮次模仿教师，从而学会独立完成任务。在五个智能体基准和三个模型上的实验表明，该方法优于现有量化基线，且在 W4A16 设置下的平均得分与 BF16 相差不到 1 分。'}}}, {'id': 'https://huggingface.co/papers/2610.39671', 'title': 'Incentivizing Self-Learning in Large Language Models via Reinforcement Learning', 'url': 'https://huggingface.co/papers/2610.39671', 'abstract': "Abstract  Large language models (LLMs) draw on parametric knowledge and retrieval-augmented generation (RAG) to solve knowledge-intensive tasks. Yet problem solving in unfamiliar domains calls for tightly coupled knowledge acquisition and reasoning, beyond factual retrieval and aggregation or learning solely from a preassembled context. We study self-learning -- autonomously retrieving, studying, and applying knowledge from long-form reference materials on the fly. To investigate this capability, we formulate a textbook-based mathematical problem-solving task. LLMs must navigate textbook exposition, learn and apply relevant principles, and construct proofs for exercises, with reference solutions withheld. We introduce a BookNavigator interface to support this human-inspired study process and incentivize self-learning through reinforcement learning (RL) with fine-grained rewards. Experiments show that our method improves performance across in-domain and out-of-domain textbooks and subjects, raising Intern-S2-Preview-35B's overall proof accuracy from 51.5% to 79.5% and outperforming RL-trained textbook-free and fixed-retrieval baselines. These gains extend to complex long-context benchmarks involving different task types, with improvements over the base model of 1.7 and 2.3 percentage points on BrowseComp-Plus and CL-bench, respectively. Together, these findings suggest that RL can foster a domain-agnostic self-learning strategy, highlighting the potential of self-learning from long-form corpora to strengthen broader problem-solving capabilities on complex, long-context tasks.", 'score': 26, 'issue_id': 3525, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '43fe944ec2cfa63e', 'authors': ['Lingkai Kong', 'Yuzhe Gu', 'Haiteng Zhao', 'Zijian Wu', 'Youqing Fang', 'Zhouqi Hua', 'Yanan Sun', 'Kai Chen', 'Wenwei Zhang'], 'affiliations': ['Fudan University', 'MMLab, The Chinese University of Hong Kong', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.39671.jpg', 'data': {'categories': ['#reasoning', '#long_context', '#training', '#benchmark', '#rl', '#optimization', '#rag', '#math', '#agents', '#science'], 'emoji': '📚', 'ru': {'title': 'Языковая модель учится сама: от учебника к доказательству', 'desc': 'Авторы исследуют способность больших языковых моделей (LLM) к самообучению: модель самостоятельно находит, изучает и применяет знания из длинных учебников по математике, решая задачи, эталонные решения которых скрыты. Для этого предложен интерфейс BookNavigator, имитирующий процесс обучения человека, а само обучение стимулируется с помощью reinforcement learning (RL) с детализированными наградами. Метод повышает точность доказательств модели Intern-S2-Preview-35B с 51.5% до 79.5% и улучшает результаты на длинноконтекстных бенчмарках BrowseComp-Plus и CL-bench. Результаты показывают, что RL может сформировать универсальную стратегию самообучения, полезную для решения сложных задач.'}, 'en': {'title': 'Teach Models to Learn from Books as They Solve', 'desc': 'This paper studies how large language models can learn from long textbooks while solving unfamiliar problems. It introduces BookNavigator, an interface that lets models find, study, and apply relevant material before constructing proofs, and uses reinforcement learning with fine-grained rewards to train this process. The method improves proof accuracy across familiar and unfamiliar subjects, outperforming models trained without textbooks and models using fixed retrieval. It also boosts performance on other complex, long-context benchmarks, suggesting that self-learning can support broader problem-solving abilities.'}, 'zh': {'title': '让模型边读教材边学习，提升复杂问题求解能力', 'desc': '这篇论文研究大语言模型如何从长篇教材中自主查找、学习并运用知识，而不只是检索事实或依赖预先整理好的上下文。作者设计了基于教材的数学证明任务，并开发 BookNavigator 接口，让模型浏览教材、学习相关原理，再独立完成证明。研究通过强化学习和细粒度奖励训练模型，促使它形成这种自学习策略。实验显示，该方法提升了不同教材和学科上的证明准确率，也改善了模型在复杂长上下文任务中的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.22237', 'title': 'Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents', 'url': 'https://huggingface.co/papers/2608.22237', 'abstract': 'Abstract  Web-facing AI agents repeatedly access webpages, documents, repositories, and tool responses, yet reading interfaces often expose entire objects when only sparse evidence is needed. This over-reading increases token and latency costs and can dilute relevant evidence. We present SparseRead, a reusable reading control layer that governs content admission without modifying the agent model. Its Read Intent Protocol tracks evolving needs and source coverage; Adaptive Reader Backends select how evidence is located and exposed; and the Budgeted Read Gate bounds cumulative raw exposure per episode with faithful full-view fallback. A unified Reader interface supports interchangeable evidence acquisition across heterogeneous resources. Across six models, including Claude Opus 5, and five scenarios, SparseRead reduces total tokens by up to 92.9% and wall time by up to 89.0%, preserving or improving task quality in 97% settings. On Web deep-search tasks, it reduces tokens by 31.0--43.0% and task completion time by 23.0--37.0%. Ablations validate the three designs, while integration with three agent frameworks demonstrates portability.', 'score': 16, 'issue_id': 3525, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': 'e5b156d6cf2e3de5', 'authors': ['Zedong Liu', 'Jiaan Wu', 'Xinyang Ma', 'Le Xu', 'Kai Wang', 'Yuanchao Hu', 'Dingwen Tao', 'Guangming Tan'], 'affiliations': ['Institute of Computing Technology, Chinese Academy of Sciences, Beijing, China', 'Songshan Lake Materials Laboratory, Dongguan, China', 'University of Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.22237.jpg', 'data': {'categories': ['#inference', '#optimization', '#agents'], 'emoji': '📖', 'ru': {'title': 'Читай только нужное: экономия токенов и времени для AI-агентов', 'desc': 'Статья представляет SparseRead — слой управления чтением для AI-агентов, который отбирает только нужные фрагменты веб-страниц, документов и ответов инструментов вместо полного просмотра объектов. Система состоит из Read Intent Protocol для отслеживания эволюционирующих потребностей, Adaptive Reader Backends для выбора способа извлечения evidence и Budgeted Read Gate, ограничивающего суммарный объём сырых данных с возможностью полного просмотра как fallback. Эксперименты на шести LLM и пяти сценариях показали снижение числа токенов до 92.9% и времени выполнения до 89.0% при сохранении или улучшении качества в 97% случаев. Метод переносим между разными агентными фреймворками без изменения самой модели.'}, 'en': {'title': 'Read Less, Find the Evidence', 'desc': 'SparseRead is a reusable layer that controls how much content an AI agent reads, without changing the agent model. It tracks what the agent needs, chooses how to find and present useful evidence, and limits total raw content while allowing a complete view when needed. Across six models and five scenarios, it cut token use by up to 92.9% and task time by up to 89.0%, while maintaining or improving quality in 97% of settings. The system also improved web search efficiency and worked with three different agent frameworks.'}, 'zh': {'title': '少读无关内容，让智能体更快找到关键证据', 'desc': '这篇论文提出 SparseRead，一个可复用的阅读控制层，无需修改智能体模型，就能控制智能体读取哪些内容。它通过读取意图协议追踪不断变化的信息需求和来源覆盖情况，并由自适应读取后端选择证据的定位与呈现方式。预算读取门会限制每次任务中暴露的原始内容总量，同时在需要时提供忠实的完整视图。实验显示，SparseRead 最多可减少 92.9% 的总词元和 89.0% 的耗时，并在 97% 的测试设置中保持或提升任务质量。'}}}, {'id': 'https://huggingface.co/papers/2611.10193', 'title': 'Ensemble Routing for Prompt-Adaptive Cost-Aware LLM Inference', 'url': 'https://huggingface.co/papers/2611.10193', 'abstract': "Abstract PISA and PISA-E use prompt-adaptive capability estimation to route prompts or select cost-aware ensembles, improving cost-performance trade-offs across LLM routing benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) increasingly support Web-based services that must balance response quality and inference cost across heterogeneous requests. Conventional routing selects one model per prompt, while fixed ensembles cannot adapt their composition and cost to individual requests. We introduce PISA, a prompt-adaptive, cost-aware single-model router, and PISA-E, its extension to ensemble routing. At the core of both methods, PISA combines soft cluster memberships with model-specific predictors to estimate individual model capabilities. Building on these estimates, PISA-E jointly selects ensemble composition and cardinality under an explicit cost--quality preference that can be adjusted at inference time without retraining. A tractable ensemble-success surrogate and efficient candidate selection enable this extension without ensemble-specific training. Across four LLM routing benchmarks under in-distribution (ID) and out-of-distribution (OOD) conditions, PISA achieves the highest macro-average cost--performance hypervolume among the evaluated single-model routers in both settings. Meanwhile, PISA-E achieves the highest macro-average task performance among the evaluated ensemble approaches when prioritizing response quality, surpassing the strongest competitors by 2.09 and 2.87 percentage points under ID and OOD conditions, respectively. At selected lower-cost operating points, it also exceeds the strongest ensemble competitors' macro-average task performance while reducing average inference cost by approximately 36% and 25%, respectively. These results demonstrate the effectiveness of prompt-adaptive capability estimation for both single-model routing and selective ensembling.", 'score': 14, 'issue_id': 3525, 'pub_date': '2026-11-06', 'pub_date_card': {'ru': '6 ноября', 'en': 'November 6', 'zh': '11月6日'}, 'hash': '70b577c0140ce48b', 'authors': ['Saul Urso', 'Emanuele Carlini', 'Patrizio Dazzi', 'Matteo Mordacchini'], 'affiliations': ['Institute of Informatics and Telematics, CNR, Italy', 'Institute of Information Science and Technologies, CNR, Italy', 'University of Pisa, Department of Computer Science, Italy'], 'pdf_title_img': 'assets/pdf/title_img/2611.10193.jpg', 'data': {'categories': ['#benchmark', '#inference', '#optimization'], 'emoji': '🧭', 'ru': {'title': 'Умная маршрутизация LLM: качество по разумной цене', 'desc': 'Статья представляет PISA — адаптивный к промпту маршрутизатор для LLM, который выбирает одну модель с учётом стоимости, и его расширение PISA-E, которое подбирает состав и размер ансамбля моделей. Метод оценивает возможности каждой модели через комбинацию мягких принадлежностей к кластерам и предикторов, специфичных для модели. PISA-E позволяет регулировать баланс качества и стоимости на этапе inference без переобучения, используя суррогатную оценку успешности ансамбля. Эксперименты на четырёх бенчмарках показали лучший компромисс стоимости и качества для обоих подходов в in-distribution и out-of-distribution условиях.'}, 'en': {'title': 'Route each prompt—or ensemble—to balance quality and cost', 'desc': 'PISA estimates how well different language models will handle each prompt, then routes the prompt to a suitable model while considering inference cost. It uses soft cluster memberships and model-specific predictors to estimate each model’s capabilities. PISA-E extends this approach by choosing both which models to combine and how many to use, balancing quality and cost without retraining. Across four benchmarks, the methods achieved strong cost–performance results, and PISA-E improved task performance while reducing cost at selected operating points.'}, 'zh': {'title': '按提示词灵活选模型，让质量与成本更合拍', 'desc': '本文提出 PISA，一种能根据每个提示词选择模型、并兼顾回答质量与推理成本的路由方法。它结合软聚类成员度和针对不同模型的预测器，估计各模型处理当前提示词的能力。扩展方法 PISA-E 还能按可调整的质量与成本偏好，选择模型集成的组成和规模，无需专门训练集成模型。实验显示，PISA 在单模型路由基准上取得了最佳的成本—性能表现，而 PISA-E 在重视回答质量或降低成本时，也优于多种现有集成方法。'}}}, {'id': 'https://huggingface.co/papers/2611.13028', 'title': 'GTAGym: Real AAA Game Tasks Environment for Evaluation and Reinforcement Learning', 'url': 'https://huggingface.co/papers/2611.13028', 'abstract': 'Abstract  AAA games offer a rich testbed for evaluating agent perception, reasoning, and control. However, evaluating whether agents can complete tasks in AAA games is challenging and often human-annotated because task outcomes are often difficult to verify automatically, let alone applying it for Reinforcement Learning (RL). We introduce GTAGym, an environment and framework for evaluation and RL on GTA V tasks. Its evaluation benchmark, GTAVBench, derived from GTA V main-story missions, contains 103 online tasks reconstructed across nine task families, alongside 47 image-based shooting and sniping tasks using GTA V imagery. A web server provides access to the online environment and evaluation interface, supporting parallel testing through screenshots and keyboard-mouse actions with automatic engine-state outcome checks. We evaluate six frontier LLMs on GTAVBench with textual task instructions and on its GTAVBench-AGI branch, where instructions appear only in the first screenshot and a harness automatically compresses interaction history. The best configuration achieves 70.9% overall accuracy in GTAVBench-AGI, yet aerial navigation, evasion and interception remain difficult. GTAGym also provides a scalable generator that samples task parameters within user-specified ranges and option sets under fixed templates, creating batches of 3D and image-based shooting environments for RL with automatic reward and termination signals. LoRA RL of Qwen3.8-27B on generated on-foot navigation tasks improves the in-domain performance and transfers to out-of-domain task categories, and native GTA V tasks from 15% to 23%.', 'score': 12, 'issue_id': 3525, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '299776c2a4e6bbdc', 'authors': ['Jiajun Chen', 'Shicheng Fang', 'Jiahao Lu', 'Yuxin Wang', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2611.13028.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#training', '#cv', '#dataset', '#agi', '#benchmark', '#transfer_learning', '#rl', '#optimization', '#multimodal', '#games', '#3d', '#agents'], 'emoji': '🎮', 'ru': {'title': 'GTA V как полигон для обучения и оценки ИИ-агентов', 'desc': 'Авторы представляют GTAGym — среду и фреймворк для оценки и обучения с подкреплением (RL) агентов на задачах GTA V. Бенчмарк GTAVBench содержит 103 онлайн-задачи и 47 задач стрельбы по изображениям, а проверка результатов происходит автоматически через состояние движка игры. Лучшая из шести протестированных LLM достигает 70.9% точности в режиме GTAVBench-AGI, однако воздушная навигация, уклонение и перехват остаются сложными. Дополнительно генератор задач создаёт батчи сред с автоматическими наградами, а LoRA RL-дообучение Qwen3.8-27B повышает результат на нативных задачах GTA V с 15% до 23% и переносится на другие категории.'}, 'en': {'title': 'A Scalable Training Ground for GTA V Agents', 'desc': 'The paper introduces GTAGym, a framework for evaluating and training agents on tasks in GTA V. Its benchmark includes 103 online missions and 47 image-based shooting tasks, with automatic checks to determine whether each task is completed. Tests of six large language models show that the best setup reaches 70.9% accuracy, though aerial navigation, evasion, and interception remain challenging. Reinforcement learning on generated tasks improves a model’s performance on training tasks and transfers to new task categories, including a rise from 15% to 23% on native GTA V tasks.'}, 'zh': {'title': '让 GTA V 成为可自动评测与强化学习的开放试验场', 'desc': '这篇论文提出 GTAGym，一个用于评测智能体并开展强化学习的 GTA V 环境与框架。其基准 GTAVBench 包含从主线任务重建的103个在线任务，以及47个基于游戏画面的射击和狙击任务，并能通过游戏引擎状态自动判断任务结果。对六种前沿大语言模型的评测显示，最佳配置在要求智能体仅从首张截图获取指令的设置中达到70.9%的总体准确率，但空中导航、躲避和拦截仍具挑战。GTAGym还能自动生成带有奖励和终止信号的训练任务；在生成的步行导航任务上进行 LoRA 强化学习后，模型不仅提升了同类任务表现，也迁移到其他任务类别，并将原生 GTA V 任务准确率从15%提高到23%。'}}}, {'id': 'https://huggingface.co/papers/2611.12304', 'title': 'Evolving Infra: Agent-Adaptive LLM Serving at Scale', 'url': 'https://huggingface.co/papers/2611.12304', 'abstract': "Abstract  Agentic workloads are a major source of LLM inference demand. Existing prefill--decode (PD) disaggregated serving systems offer limited flexibility for runtime adaptation of compute allocation and KV cache management, and rely on coarse signals that only partly capture the diverse and dynamic agent workload. These limitations lead to load imbalance between prefill and decode nodes and eviction of KV caches that agents will reuse. We present Evolving Infra, an agent-adaptive serving framework that adapts compute allocation to agent workloads and KV cache management to agent context management at runtime. We decouple compute allocation from key--value (KV) cache management, allowing nodes to switch efficiently between prefill and decode. Building on this design, an online planner matches the PD split to workload composition, while an agent-aware distributed KV manager guides cache eviction and transfer with signals from agent context management. Across coding, math, and computer-use tasks with GLM-5.2 and Kimi K2.6 on up to 256 GB300 GPUs, Evolving Infra reduces mean end-to-end request latency and P95 TTFT by up to 4.1x and 14x over Dynamo, NVIDIA's production framework.", 'score': 10, 'issue_id': 3525, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': 'c2bbd2e304594cb9', 'authors': ['Hao Kang', 'Weili Xu', 'Ziyang Li', 'Zheng Du', 'Hanchen Li', 'Tian Xia', 'Song Bian', 'Tushar Krishna', 'Huizi Mao', 'Ion Stoica', 'Song Han'], 'affiliations': ['Georgia Institute of Technology', 'Massachusetts Institute of Technology', 'NVIDIA', 'OpenAI', 'University of California, Berkeley', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2611.12304.jpg', 'data': {'categories': ['#inference', '#optimization', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Адаптивный инференс LLM под поведение агентов: быстрее и без потерянного KV-кэша', 'desc': 'Статья посвящена обслуживанию LLM-инференса для агентных нагрузок, где существующие системы с разделением prefill и decode плохо адаптируются к динамике задач. Авторы предлагают Evolving Infra, которая отделяет распределение вычислений от управления KV-кэшем и позволяет узлам быстро переключаться между prefill и decode. Онлайн-планировщик подбирает соотношение PD под состав нагрузки, а распределённый KV-менеджер с учётом контекста агента решает, что вытеснять и передавать. На задачах кодинга, математики и работы с компьютером на моделях GLM-5.2 и Kimi K2.6 система снижает задержку end-to-end запросов и P95 TTFT в до 4.1x и 14x по сравнению с Dynamo.'}, 'en': {'title': 'Adapt serving and cache management to every agent workload', 'desc': 'Evolving Infra is a serving framework designed to handle the changing demands of AI agent workloads. It adjusts how computing resources are divided between prompt processing (prefill) and token generation (decode), and manages KV caches separately so nodes can switch roles efficiently. An online planner adapts the prefill–decode split to the workload, while an agent-aware cache manager uses information about agents’ contexts to guide cache transfers and evictions. In tests across coding, math, and computer-use tasks, it reduced average end-to-end latency by up to 4.1× and P95 time to first token by up to 14× compared with NVIDIA Dynamo.'}, 'zh': {'title': '让推理资源与 KV 缓存随智能体工作负载灵活演进', 'desc': '智能体工作负载是大语言模型推理需求的重要来源，但传统预填充与解码分离系统难以根据工作负载动态调整计算资源和 KV 缓存。论文提出 Evolving Infra，在运行时根据智能体工作负载分配计算资源，并依据智能体的上下文管理方式管理 KV 缓存。它将计算资源分配与 KV 缓存管理解耦，使节点能灵活切换预填充和解码，并通过在线规划器及智能体感知的分布式缓存管理器减少负载不均和缓存误淘汰。在多种任务和模型上的实验显示，相较于 Dynamo，其端到端请求平均延迟最高降低 4.1 倍，P95 首令牌时间最高降低 14 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.12869', 'title': 'Where Does Alignment Emerge and What Does It Mean? A Closer Look at the Platonic Representation Hypothesis', 'url': 'https://huggingface.co/papers/2611.12869', 'abstract': 'Abstract Cross-modal representational alignment between unimodal language and vision models increases with model capability when captions are clean and informative, but remains below same-modality alignment and can exceed explicitly aligned vision-language models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash The Platonic Representation Hypothesis (PRH) suggests that neural networks are converging toward similar representation spaces. As language models become more capable, their representations are aligning with those of vision models. However, recent work has questioned whether this trend continues to hold for newer language models. Moreover, it has been shown that representation similarity metrics can be confounded by model depth and width, requiring appropriate baselines for interpretation. In this work, we first investigate where alignment emerges between unimodal models across model layers and representation dimensions. Next, we find that the PRH capability-alignment trend persists for newer models as long as the captions are sufficiently clean and informative. Finally, we contextualize cross-modal alignment, introducing unimodal and multimodal baselines on various datasets. Our results show that the cross-modal representational alignment of unimodal models can surpass that of explicitly aligned vision-language models, but remains substantially behind the alignment observed for models of the same modality. Code is available at https://github.com/ExplainableML/prh-closer-look.', 'score': 5, 'issue_id': 3525, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': 'f3280075e1d83a20', 'authors': ['Julia Herbst', 'Simon Roschmann', 'Quentin Bouniot', 'Zeynep Akata'], 'affiliations': ['Helmholtz Munich', 'LTCI, Télécom Paris, Institut Polytechnique de Paris, Palaiseau, France', 'Munich Center for Machine Learning', 'Technical University of Munich'], 'pdf_title_img': 'assets/pdf/title_img/2611.12869.jpg', 'data': {'categories': ['#cv', '#multimodal', '#interpretability', '#architecture'], 'emoji': '🔗', 'ru': {'title': 'Языковые и визуальные модели сходятся к общему представлению мира, но пока не до конца', 'desc': 'Статья изучает, как представления унимодальных языковых и визуальных моделей сближаются друг с другом по мере роста их возможностей, что подтверждает гипотезу Платоновского представления (PRH). Авторы показывают, что тренд сохраняется для новых LLM, если подписи к изображениям (captions) чистые и информативные. Для корректной оценки выравнивания вводятся унимодальные и мультимодальные baseline-модели, поскольку метрики схожести могут искажаться глубиной и шириной сети. Результаты показывают, что унимодальные модели могут превосходить явно выровненные vision-language модели, но всё же заметно уступают выравниванию внутри одной модальности.'}, 'en': {'title': 'Clean Captions Reveal a Growing Bridge Between Language and Vision', 'desc': 'This paper studies whether stronger language models develop representations more similar to those of vision models, as proposed by the Platonic Representation Hypothesis. It examines where this cross-modal alignment appears across model layers and representation dimensions, while accounting for confounds such as model depth and width. The capability-related increase in alignment persists when image captions are clean and informative. Unimodal language–vision alignment can exceed that of explicitly aligned vision-language models, but remains below the alignment between models of the same modality.'}, 'zh': {'title': '模型能力越强，跨模态表征越趋同', 'desc': '本文研究纯语言模型与纯视觉模型之间的跨模态表征对齐。作者发现，当图像描述足够准确且信息丰富时，模型能力越强，两种模型的表征越相似，这支持柏拉图表征假说。研究还分析了对齐在不同网络层和表征维度中的出现情况，并使用合适的基线来区分模型规模等因素造成的影响。纯语言与纯视觉模型的跨模态对齐有时超过经过显式图文对齐的模型，但仍明显低于同一模态模型之间的对齐。'}}}, {'id': 'https://huggingface.co/papers/2611.14418', 'title': 'Precision on Demand: Escalating Weight Bits at Uncertain Decoding Steps in a Small Local Model', 'url': 'https://huggingface.co/papers/2611.14418', 'abstract': 'Abstract A dynamic weight precision allocation strategy is proposed, utilizing low-bit quantization and uncertainty-based gating to selectively upgrade weight precision during LLM generation, thereby optimizing computational cost.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Local decoding usually fixes one weight precision for the whole generation. We study a different allocation: store 8-bit weights, decode with their top 4 bits, and redo a step at 8 bits only when the low-precision output distribution looks uncertain (entropy above a threshold or a small top-two margin). Quantization is simulated, the model is Qwen3-0.6B, and the benchmark is GSM8K. Cost is counted in weight bytes read per token. On 36724 replayed steps the entropy of the low pass ranks argmax flips with AUC 0.93. At a 15% escalation budget it catches 78% of flips and the margin gate 94%, against the 15% expected for a random gate of equal rate (a computed expectation, not a run). In 150 live problems all-high scores 64.0% and all-low 55.3% (McNemar p=0.053). An entropy gate with a 16% escalation rate scores 62.7% at 0.87 of the all-high weight bytes. Its paired difference is -1.3 (-8.0 to +5.3) points to all-high and +7.3 (+0.0 to +14.7) points to all-low (p=0.080), so the live data do not separate the gate from either end. Verified speculation reaches zero KL at similar bytes in the same cost model. A live random control, a thinking-mode phase rule, a second model and live KL were not run.', 'score': 4, 'issue_id': 3525, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'f271835b7983fd8f', 'authors': ['Mohammed Nayeem Khan', 'Logesh L', 'Aliyas Ahmad Misri'], 'affiliations': ['Intel'], 'pdf_title_img': 'assets/pdf/title_img/2611.14418.jpg', 'data': {'categories': ['#inference', '#small_models'], 'emoji': '⚖️', 'ru': {'title': 'Пересчитывать в высокой точности только там, где модель сомневается', 'desc': 'Авторы предлагают динамическое распределение точности весов для LLM: хранятся 8-битные веса, декодирование выполняется по старшим 4 битам, а шаг пересчитывается в 8 битах только тогда, когда распределение вероятностей низкоточного прохода выглядит неуверенным (высокая энтропия или малый отрыв top-2). На Qwen3-0.6B и GSM8K гейт по энтропии ранжирует смены argmax с AUC 0.93, а при 15% эскалаций ловит 78% таких смен, а margin-гейт 94%. В живых экспериментах на 150 задачах гейт при 16% эскалаций даёт 62.7% точности при 0.87 от стоимости all-high, но различия с крайними вариантами статистически не значимы, поэтому надёжного выигрыша не доказано.'}, 'en': {'title': 'Use low precision by default; spend more bits when the model is unsure', 'desc': 'The paper tests a way to reduce the cost of language-model decoding by reading 4-bit approximations of 8-bit weights first, then using full precision when the output seems uncertain. Uncertainty is measured with output entropy or the gap between the two most likely next tokens. On replayed steps, these signals often identify when low precision changes the predicted token, but live tests on GSM8K do not show a clear score advantage over always using low or high precision. The results are preliminary: they use one small model, and further controls and tests are needed.'}, 'zh': {'title': '不确定时再升精度，让大模型解码省算力', 'desc': '论文研究一种动态权重精度分配策略：默认用权重的高 4 位进行低精度解码，仅在输出分布显示不确定时才升至 8 位重算。它用输出熵或前两名概率差距作为门控信号，并在 Qwen3-0.6B 的 GSM8K 实验中发现，这些信号能较好地识别低精度解码可能改变预测结果的步骤。150 道实际题目的测试中，熵门控在权重读取成本低于全程 8 位解码时取得了接近的准确率，但统计结果不足以证明它优于全高精度或全低精度方案。研究结果仍属初步，尚未测试实时随机对照、另一种模型及实时 KL 散度等情形。'}}}, {'id': 'https://huggingface.co/papers/2611.08286', 'title': 'Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds', 'url': 'https://huggingface.co/papers/2611.08286', 'abstract': 'Abstract Interactive Visual Gym enables closed-loop evaluation and training of visual interaction models by jointly simulating task environments and human users, exposing limitations in state-of-the-art VLMs and improving performance through closed-loop training.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Visual interaction models that support users during ongoing physical tasks require evaluation in closed loop, where assistant responses can change subsequent user behavior and task outcomes. Existing benchmarks largely rely on offline replay and therefore cannot capture these effects. We introduce Interactive Visual Gym, a framework for closed-loop evaluation and training of visual interaction models through joint simulation of executable task environments and human users. We contribute three simulators that recreate everyday tasks and human-aligned action spaces across cooking, household manipulation, and mobile-interface domains, together with a persona-conditioned user simulation harness that collaborates with the assistant while incorporating controlled execution errors and other out-of-plan behaviors. We instantiate the framework as IVG-Bench, a benchmark with 315 interaction scenarios. Evaluating state-of-the-art VLMs as visual interaction models reveals substantial limitations: the best-performing model, Gemini 4 Argon, completes only 53.4% of tasks within the time limit, exhibits significant weaknesses in factual grounding and actionable guidance, and is often too slow to prevent errors when response latency is considered. We verify our evaluation protocol with a human study which finds 78.5% agreement between our interaction-quality metric and participant preferences. We further show that the environments provide useful learning signals: in a proof-of-concept GRPO experiment, closed-loop training improves both task success and interaction quality for Qwen3.5-4B model in our cooking environment.', 'score': 4, 'issue_id': 3525, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'd4bd6095142e8ba3', 'authors': ['Chenhao Zheng', 'Zixian Ma', 'Kai Li', 'Kanchana Ranasinghe', 'Jieyu Zhang', 'Artemis Panagopoulou', 'Weikai Huang', 'Jianxu Shangguan', 'Yuanyuan Tan', 'Silvio Savarese', 'Juan Carlos Niebles', 'Ranjay Krishna', 'Ran Xu', 'Honglu Zhou'], 'affiliations': ['Salesforce AI Research', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.08286.jpg', 'data': {'categories': ['#training', '#cv', '#dataset', '#benchmark', '#rl', '#multimodal', '#games', '#survey', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Оценивай ассистента в действии, а не по записи', 'desc': 'Статья представляет Interactive Visual Gym — фреймворк для closed-loop оценки и обучения визуальных interaction-моделей, которые помогают пользователю в физических задачах. Вместо offline replay здесь совместно симулируются исполняемые среды задач и персонажи-пользователи с контролируемыми ошибками исполнения. На основе этого авторы создали бенчмарк IVG-Bench из 315 сценариев в кулинарии, бытовых манипуляциях и мобильных интерфейсах. Эксперименты показывают, что лучшая современная VLM решает лишь 53.4% задач в срок, а closed-loop обучение через GRPO улучшает успешность и качество взаимодействия модели Qwen3.5-4B.'}, 'en': {'title': 'Train visual assistants by letting their actions shape the task', 'desc': 'Interactive Visual Gym evaluates and trains visual interaction models in closed-loop settings, where an assistant’s responses can affect what users do and how tasks turn out. It combines executable task simulators for cooking, household tasks, and mobile interfaces with persona-based simulated users who can make mistakes or act unexpectedly. On its 315-scenario benchmark, even the best tested vision-language model completed only 53.4% of tasks within the time limit, with weaknesses in grounding, useful guidance, and response speed. A proof-of-concept using GRPO shows that closed-loop training can improve task success and interaction quality for a small model in the cooking environment.'}, 'zh': {'title': '让视觉助手在真实互动中受测，也在闭环反馈中变强', 'desc': '本文提出 Interactive Visual Gym，用于在闭环中评估和训练视觉交互模型，同时模拟任务环境与人类用户。框架包含烹饪、家务操作和手机界面三类模拟器，以及能按不同用户特征互动并模拟执行错误的用户系统，并据此构建了含315个场景的 IVG-Bench。评测发现，表现最好的模型也只在时限内完成53.4%的任务，且在事实依据、可执行指导和响应速度方面存在明显不足；人类研究显示，评测指标与参与者偏好的吻合率为78.5%。此外，研究通过 GRPO 闭环训练实验表明，模拟环境能够提供有效学习信号，并提升 Qwen3.5-4B 在烹饪任务中的成功率和交互质量。'}}}, {'id': 'https://huggingface.co/papers/2611.13766', 'title': 'FAME-QP: A GPU-Accelerated Quadratic-Programming Solver for Real-Time Model Predictive Control', 'url': 'https://huggingface.co/papers/2611.13766', 'abstract': 'Abstract  We present FAME-QP, a GPU-accelerated solver for dense quadratic programs arising in linear model predictive control. FAME-QP combines constraint-dependent operator representations with fused single- and two-kernel iterations replayed through CUDA graphs, automatically selecting the execution configuration through device calibration and problem-specific timing. It probes a cached operator bank to select the initial penalty and updates operators lazily when problem matrices change. Numerical benchmarks and simulated humanoid and quadrotor control experiments demonstrate reduced latency relative to competing GPU solvers while maintaining solution accuracy and control performance.', 'score': 3, 'issue_id': 3526, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'c23044560619ce08', 'authors': ['Santosh Mohan Rajkumar', 'Debdipta Goswami', 'Stephanie Stockar'], 'affiliations': ['Model Predictive Control', 'Robotics and Control Systems'], 'pdf_title_img': 'assets/pdf/title_img/2611.13766.jpg', 'data': {'categories': ['#inference', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Быстрый GPU-решатель QP для управления в реальном времени без потери точности', 'desc': 'В статье представлен FAME-QP — решатель для плотных квадратичных программ (QP), возникающих в линейном Model Predictive Control, ускоренный на GPU. Метод использует зависящие от ограничений представления операторов и объединённые итерации на одном или двух ядрах CUDA, которые воспроизводятся через CUDA graphs, что снижает накладные расходы на запуск. Конфигурация выполнения выбирается автоматически на основе калибровки устройства и замеров времени для конкретной задачи, а начальный штраф подбирается по кэшированному банку операторов, который обновляется лениво при изменении матриц. Численные тесты и симуляции управления гуманоидным роботом и квадрокоптером показывают меньшую задержку по сравнению с другими GPU-решателями при сохранении точности решения и качества управления.'}, 'en': {'title': 'Faster GPU Quadratic Programming for Real-Time Control', 'desc': 'FAME-QP is a GPU-accelerated solver for dense quadratic programs used in linear model predictive control. It combines constraint-aware operator representations with fused iterations replayed through CUDA graphs. The solver calibrates its execution strategy, chooses an initial penalty from cached operators, and updates operators only when problem matrices change. Benchmarks and simulated robot-control tasks show lower latency than competing GPU solvers while preserving solution accuracy and control performance.'}, 'zh': {'title': '让模型预测控制中的二次规划求解更快、更稳', 'desc': '本文提出了 FAME-QP，这是一种用于线性模型预测控制中稠密二次规划的 GPU 加速求解器。它根据约束构造算子表示，并通过 CUDA 图重放融合的单核或双核迭代，以减少计算开销。求解器会根据设备校准和具体问题的计时结果自动选择执行配置，还会从缓存的算子库中选择初始罚参数，并在问题矩阵变化时延迟更新算子。数值基准测试以及人形机器人和四旋翼飞行器的模拟控制实验表明，该方法能在保持解精度和控制性能的同时降低求解延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.13758', 'title': 'Mixed Signals: Weight-Space Programming for EEG and ECG', 'url': 'https://huggingface.co/papers/2611.13758', 'abstract': "Abstract  Weight-space programming allows language models to read a trained neural network's weights and edit them. This opens the door to ``training'' by reasoning rather than through gradient descent. Prior work has demonstrated its functionality and promise for game-playing networks and fixing specific failures in language models, even extending to diffusion models. In this work, we present its applicability to models trained on biosignal data, specifically EEG and ECG data. We show that frontier models are not only able to debug specific faults planted in biosignal-based models without being told what these faults are, but are even capable of writing all the weights of a network from scratch, given only the architecture, the task, and a minimal set of training subjects. In particular, in one set of experiments, a language model was able to match standard gradient-descent training using 6times fewer training subjects, through reasoning alone and without any gradient descent step. Networks written by Claude Opus 5.5 also scored higher than classic hand-crafted EEG pipelines (alpha band power, and common spatial patterns with linear discriminant analysis) when built from the same 5 subjects. We also highlight some of the limitations, which include the inability of language models to improve already well-trained classification models, and their incapacity to reliably recognize, from the weights alone, the task a network was trained on. Overall, our results indicate that weight-space programming can be useful for small networks, such as those deployed on edge devices and wearables, but the concept still requires further investigation before it can be used in practice.", 'score': 3, 'issue_id': 3525, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': 'a189a9f9218a7f74', 'authors': ['Dara Varam', 'Taraneh Aminosharieh Najafi', 'David Atienza'], 'affiliations': ['École Polytechnique Fédérale de Lausanne (EPFL)'], 'pdf_title_img': 'assets/pdf/title_img/2611.13758.jpg', 'data': {'categories': ['#architecture', '#healthcare', '#interpretability', '#training', '#small_models', '#optimization', '#science'], 'emoji': '🧠', 'ru': {'title': 'Языковая модель пишет веса нейросети вместо градиентного спуска', 'desc': 'В статье исследуется weight-space programming: языковые модели (LLM) читают веса обученной нейронной сети и редактируют их, что позволяет «обучать» модель через рассуждение, а не через градиентный спуск. Авторы показывают применимость этого подхода к моделям для биосигналов EEG и ECG, где LLM находят и исправляют заложенные ошибки, а также могут записать веса сети с нуля, используя лишь архитектуру, задачу и небольшой набор субъектов. В одном из экспериментов такой подход совпал с градиентным обучением при вдвое меньшем числе... точнее, в 6 раз меньшем числе обучающих субъектов и превзошёл классические пайплайны с alpha band power и CSP+LDA. Ограничения включают неспособность LLM улучшать уже хорошо обученные классификаторы и ненадёжное распознавание задачи по одним весам, поэтому метод пока перспективен для небольших сетей на edge-устройствах и носимых гаджетах.'}, 'en': {'title': 'Programming Neural Networks by Reasoning About Their Weights', 'desc': 'This paper studies weight-space programming, where a language model inspects and edits a neural network’s weights instead of using gradient descent. For EEG and ECG tasks, models could identify and repair hidden faults, and write network weights from scratch using only the architecture, task, and a few training subjects. In one experiment, a language model matched gradient-descent training using six times fewer subjects, and its EEG networks outperformed classic handcrafted pipelines trained on the same five subjects. However, language models struggled to improve already well-trained classifiers or infer a network’s task from its weights, so the approach remains experimental but may suit small edge-device models.'}, 'zh': {'title': '让语言模型用推理直接编写神经网络权重', 'desc': '本文研究语言模型能否直接读取和修改神经网络的权重，以推理代替梯度下降来训练模型。实验表明，前沿语言模型可以在不知道具体故障的情况下修复 EEG 和 ECG 信号模型中的人为缺陷，也能根据网络结构、任务和少量受试者数据从头写出网络权重。部分实验中，这种方法用的训练受试者数量仅为标准梯度下降的六分之一；用相同的 5 名受试者训练时，Claude Opus 5.5 编写的网络表现也超过了经典 EEG 手工特征方法。研究同时发现，这种方法难以提升已经训练良好的分类器，也不能可靠地仅凭权重判断训练任务，因此目前更适合探索小型边缘设备和可穿戴设备上的应用。'}}}, {'id': 'https://huggingface.co/papers/2611.08379', 'title': 'Module-Aware Optimization for Graph Neural Networks', 'url': 'https://huggingface.co/papers/2611.08379', 'abstract': "Abstract GraphMuon adapts Muon's matrix orthogonalization to the covariance of graph-propagated representations, reducing graph-induced update amplification and speeding validation-loss time-to-target on graph benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Different optimizers impose different geometries on parameter updates. Adaptive methods such as Adam and AdamW use coordinate-wise updates, while matrix-aware optimizers such as Muon utilize weight-matrix structure through orthogonalized updates. For Graph Neural Networks (GNNs), however, the effective geometry of its weight matrices is shaped not only by its learned channel-mixing weights, but also by the graph-propagated representations it acts on. Thus, even if an update is well normalized as a matrix, its effect on the layer output can be amplified when applied to graph-propagated features. To address this gap, we introduce GraphMuon, a graph-aware optimizer that adapts Muon's matrix updates to the covariance structure of graph-propagated layer inputs. GraphMuon performs orthogonalization in a metric defined by these propagated representations and normalizes step sizes according to the update's induced effect on the layer representation. We show that theoretically, vanilla Muon can suffer from graph-induced update amplification, while our GraphMuon can mitigate this effect. As such, our GraphMuon yields a graph-metric analogue of Muon's polar update step. Empirically, GraphMuon achieves 1.32times-2.42times validation-loss time-to-target speedups over AdamW on three large-scale OGB benchmarks. Across 15 dataset-architecture configurations spanning node classification, inductive graph classification, and graph regression, it achieves lower time-to-target in 13 cases, while maintaining competitive or superior predictive performance. Code is available at https://github.com/guy-hadad/GraphMuon.", 'score': 3, 'issue_id': 3525, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '302fb309bc828524', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#architecture', '#graphs', '#optimization', '#training'], 'emoji': '🕸️', 'ru': {'title': 'Оптимизатор, который учитывает структуру графа при обновлении весов', 'desc': 'Статья представляет GraphMuon — оптимизатор для графовых нейронных сетей (GNN), который адаптирует матричную ортогонализацию из Muon к ковариационной структуре признаков, полученных после распространения по графу. Авторы показывают, что обычный Muon может усиливать обновления весов из-за графового распространения, а GraphMuon выполняет ортогонализацию в метрике, заданной этими представлениями, и нормирует шаг обучения по эффекту обновления на выход слоя. Метод даёт аналог полярного шага Muon в графовой метрике. На трёх крупных бенчмарках OGB GraphMuon достигает ускорения по времени до целевого validation loss в 1.32–2.42 раза относительно AdamW.'}, 'en': {'title': 'Make weight updates fit the graph', 'desc': 'Graph neural networks process features propagated across a graph, which can amplify the effect of ordinary weight updates. GraphMuon adapts Muon by orthogonalizing updates using the covariance of these propagated features and scaling steps by their effect on layer representations. The authors show theoretically that this approach can reduce graph-induced update amplification. On several graph benchmarks, GraphMuon reaches a target validation loss faster than AdamW in most tested settings while maintaining competitive predictive performance.'}, 'zh': {'title': '让优化器看懂图结构，更新更稳、收敛更快', 'desc': '不同优化器会以不同方式调整模型参数，Muon利用权重矩阵结构来更新参数。对于图神经网络，权重作用于经过图传播的特征，因此仅对权重更新做归一化，仍可能导致层输出变化过大。论文提出GraphMuon，根据图传播特征的协方差结构进行矩阵正交化，并依据更新对层表示的影响调整步长，从而缓解这种放大效应。在三个大型OGB基准上，GraphMuon比AdamW更快达到目标验证损失；在15种数据集与模型组合中，有13种达到目标所需时间更短，同时预测性能具有竞争力或更优。'}}}, {'id': 'https://huggingface.co/papers/2607.24999', 'title': 'CogBattery: Human-Referenced Evaluation of Cognitive Task Behavior and Structure in Language Models', 'url': 'https://huggingface.co/papers/2607.24999', 'abstract': "Abstract CogBattery compares open-weight language models to humans across cognitive tasks, revealing that matching effect directions does not imply human-like error patterns or confidence calibration.  Generated by thinkingmachines/Inkling-Small Human cognitive tasks let us compare language models with humans under controlled conditions. Yet a model can reproduce the direction of a human effect while making different errors. CogBattery evaluates 54 open-weight language models on text adaptations of 13 cognitive paradigms, comparing each with human data from its source study. Like humans, models respond more to n-back lures than to controls, yet they make far more false alarms on ordinary non-targets. Most models' reported confidence separates correct from incorrect answers less well than humans' does, and most always choose the same wager, including models that classify accurately. These patterns span many model families. Across tasks, model scores share two dimensions. The first is closely tied to scale, yet larger models are not consistently closer to humans. Predefined cognitive groupings show no reliable predictive advantage over random groupings of the same size. These results show that matching human effect directions does not establish human-like behavior. CogBattery provides condition-level human references for testing errors and confidence reports in new models.", 'score': 3, 'issue_id': 3525, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'a6ed129027760552', 'authors': ['Dengzhe Hou', 'Lingyu Jiang', 'Fangzhou Lin', 'Kazunori D Yamada'], 'affiliations': ['Texas A&M University', 'Tohoku University', 'Worcester Polytechnic Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.24999.jpg', 'data': {'categories': ['#benchmark', '#alignment', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Совпадение эффектов не делает модель человеком', 'desc': 'В статье представлен CogBattery — набор тестов, сравнивающий 54 открытые LLM с людьми на текстовых адаптациях 13 когнитивных парадигм. Модели, как и люди, сильнее реагируют на n-back ловушки, но дают значительно больше ложных срабатываний на обычные нецелевые стимулы. Уверенность большинства моделей хуже отделяет верные ответы от ошибочных, чем у людей, а многие модели неизменно выбирают одну и ту же ставку, даже точно классифицируя. Авторы показывают, что совпадение направления эффектов с человеческим не означает человекоподобного поведения, и предлагают CogBattery как эталон для проверки ошибок и калибровки уверенности новых моделей.'}, 'en': {'title': 'Same Effects, Different Minds', 'desc': 'CogBattery tests 54 open-weight language models on text versions of 13 cognitive tasks and compares their results with human data. Models often show the same direction of an effect as humans, but make different errors, such as more false alarms on ordinary non-targets. Their confidence is usually less effective at distinguishing correct from incorrect answers, and many models use the same wager regardless of accuracy. Model performance varies along two broad dimensions, and larger size or cognitive task groupings do not reliably make models more human-like.'}, 'zh': {'title': '效应方向相同，不代表思维方式相同', 'desc': 'CogBattery 在 13 种认知任务上评测了 54 个开放权重语言模型，并将结果与对应的人类实验数据比较。模型有时能重现人类效应的方向，但仍会产生不同的错误模式，例如对普通非目标项目误报更多。多数模型的置信度区分答对与答错的能力弱于人类，下注选择也常常固定不变，即使模型的分类表现不错。研究还发现，模型表现与规模有关，但更大的模型不一定更像人类；因此，仅匹配人类效应方向不足以证明模型具有人类式行为。'}}}, {'id': 'https://huggingface.co/papers/2603.27343', 'title': 'WMIP: A Working-Memory-Inspired Programmable Probe of Cumulative State Tracking in Large Language Models', 'url': 'https://huggingface.co/papers/2603.27343', 'abstract': 'Abstract Large language models struggle with cumulative state tracking across multiple updates despite strong single-step arithmetic, and their measured accuracy depends heavily on output protocols.  Generated by thinkingmachines/Inkling-Small Human working memory lets people maintain and update information. Large language models (LLMs) face a related demand when tracking updates within a single prompt without writing out intermediate states, yet existing tests differ in their constraints on written steps. We introduce a working-memory-inspired probe of cumulative state tracking with program-computed answers, 3 to 100 updates, and final-state, intermediate-state, or multi-target queries. It compares protocols on identical items. Across 18 LLMs, accuracy is 84.9% on single-step arithmetic but 31.7% on core items requiring one number after three to seven updates. From 50 updates on, no model exceeds 10% accuracy. Core accuracy reaches 88.0% under a larger budget and instructions to write steps and place the answer on the last line, mainly due to the instruction changes rather than the budget. Core accuracy also correlates positively with public Berkeley Function Calling Leaderboard scores. These findings show that strong single-step arithmetic does not ensure reliable cumulative tracking and that output protocols substantially change measured accuracy. We release the generator, items, scoring code, and responses for reproducible comparisons across depths, query types, and protocols.', 'score': 3, 'issue_id': 3525, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'afe5fae7b34a68f8', 'authors': ['Dengzhe Hou', 'Lingyu Jiang', 'Deng Li', 'Zirui Li', 'Fangzhou Lin', 'Kazunori D Yamada'], 'affiliations': ['Lappeenranta-Lahti University of Technology LUT', 'Texas A&M University', 'Tohoku University', 'Worcester Polytechnic Institute'], 'pdf_title_img': 'assets/pdf/title_img/2603.27343.jpg', 'data': {'categories': ['#long_context', '#reasoning', '#open_source', '#dataset', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Сильная арифметика не гарантирует надёжного отслеживания состояния', 'desc': 'Авторы исследуют, насколько большие языковые модели (LLM) способны отслеживать накопительное состояние при последовательных обновлениях внутри одного промпта, без записи промежуточных шагов. Для этого предложен тест, вдохновлённый рабочей памятью человека, с задачами от 3 до 100 обновлений и разными типами запросов. Результаты 18 моделей показывают, что точность на одношаговой арифметике высока (84,9%), но падает до 31,7% при отслеживании состояния, а при 50 и более обновлениях не превышает 10%. Показано, что формат вывода и инструкции существенно влияют на измеряемую точность, что делает сравнение протоколов важным для честной оценки LLM.'}, 'en': {'title': 'Good at arithmetic, poor at keeping a running tally', 'desc': 'The paper tests how well large language models track a changing value across many updates. Although models score 84.9% on single-step arithmetic, they reach only 31.7% on short update sequences, and no model exceeds 10% accuracy at 50 or more updates. Accuracy rises to 88.0% when models are told to write out their steps and put the answer last, showing that instructions and output format strongly affect results. The authors provide reusable test items and code to help compare cumulative state tracking across models and settings.'}, 'zh': {'title': '会算一步，不等于能追踪多步状态', 'desc': '本文提出一种受人类工作记忆启发的测试，用来评估大语言模型在多次更新后追踪累积状态的能力。研究测试了18个模型，发现它们单步算术准确率为84.9%，但经过3至7次更新后，准确率降至31.7%；更新达到50次后，没有模型超过10%。要求模型写出步骤并把答案放在最后一行，可将核心任务准确率提高到88.0%，而提升主要来自指令改变，而非更多计算预算。结果表明，单步算术能力不代表可靠的累积状态追踪能力，输出格式也会显著影响测得的准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.05862', 'title': 'CARTBench: Rubric-Based Evaluation of Shopping Advice for Complex and Ambiguous Requests with Timelines', 'url': 'https://huggingface.co/papers/2611.05862', 'abstract': 'Abstract  Large language model (LLM) shopping assistants now recommend products in multi-turn conversations. However, reliable evaluation faces Data scarcity and Difficulty Standardizing Criteria. To address these obstacles, we introduce CARTBench for CART (Complex and Ambiguous Requests with Timelines). For Data scarcity, we curate cases from real commercial shopping needs across 17 retail domains, pairing timestamped dialogue with 1,603 product records. For Difficulty Standardizing Criteria, we develop case-specific rubrics guided by Ideal Response Principles, distilled from excellent replies manually selected from successfully completed orders. These principles also guide Principle-Guided CART Prompting, our structured recommendation strategy. The experimental benchmark contains 1,328 expert-annotated criteria across Core, Excellence, and Safety. To answer the CART question, we evaluate 7 flagship commercial API models, including GPT-6.1-Sol and Claude-Opus-5, and 35B+ parameters open-weight models. In the first full-suite evaluation under the frozen rubrics, 3 of 10 models exceed 90% on Core, while none exceeds 45% on Excellence. Therefore, we identify an understanding-to-execution gap between required behavior and high-quality purchase advice. To examine these limitations, we diagnose shared failures in product evidence and unresolved needs, linked to changing requirements and decisive unknowns. Code and data are available at https://github.com/Da1yuqin/CARTBench.', 'score': 2, 'issue_id': 3525, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'f2bf328052ff6b82', 'authors': ['Yuqin Dai', 'Zhanwei Zhang', 'Honghui Yang', 'Zhouheng Yao', 'Yueqi Zhang', 'Jingyu He', 'Chaoyang Shi', 'Fanding Wei', 'Boyuan Pan', 'Kai Xu', 'Yao Hu', 'Yongliang Shen'], 'affiliations': ['Shanghai Jiao Tong University', 'Tsinghua University', 'Xiaohongshu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.05862.jpg', 'data': {'categories': ['#rag', '#dataset', '#benchmark', '#data'], 'emoji': '🛒', 'ru': {'title': 'Понимать запрос мало: LLM-ассистенты пока не умеют давать хороший совет при покупке', 'desc': 'В статье представлен CARTBench, новый бенчмарк для оценки LLM-ассистентов, которые рекомендуют товары в многоходовых диалогах с пользователями. Авторы решают проблемы нехватки данных и трудности стандартизации критериев, собирая реальные кейсы из 17 розничных доменов с временными метками и 1603 карточками товаров. Оценка строится на экспертных рубриках, основанных на принципах идеального ответа, и применяется предложенная стратегия Principle-Guided CART Prompting. Результаты показывают, что модели хорошо справляются с базовыми требованиями, но почти не достигают высокого качества советов, что выявляет разрыв между пониманием задачи и её качественным выполнением.'}, 'en': {'title': 'From Understanding Shopping Needs to Delivering Better Advice', 'desc': 'The paper introduces CARTBench, a benchmark for evaluating shopping assistants handling complex, changing requests across multiple conversation turns. It combines timestamped shopping dialogues from 17 retail domains with product records, and uses expert-written rubrics based on principles distilled from successful recommendations. Evaluations of commercial and open-weight LLMs show that several models meet basic criteria, but none consistently provides excellent purchase advice. The results reveal an understanding-to-execution gap, with common failures in using product evidence and resolving shoppers’ changing needs and key unknowns.'}, 'zh': {'title': '从听懂需求到给出好建议：购物助手仍有执行鸿沟', 'desc': '本文提出 CARTBench，用于评测大型语言模型在多轮购物对话中处理复杂、含糊且会随时间变化的需求的能力。基准覆盖 17 个零售领域，包含带时间戳的对话、1,603 条商品记录，以及围绕核心表现、优秀表现和安全性制定的专家评测标准。作者还提出由理想回复原则引导的结构化推荐方法，并评测多种商业模型和开放权重模型。结果显示，模型在满足基本要求方面已有一定表现，但在提供高质量购买建议方面仍有明显差距，常见问题包括商品证据不足和未解决用户需求。'}}}, {'id': 'https://huggingface.co/papers/2611.14413', 'title': 'Bits or permutations? Spending a fixed inference budget on weight precision or on option-order averaging in small local language models', 'url': 'https://huggingface.co/papers/2611.14413', 'abstract': 'Abstract  Local language models can save memory by storing weights in fewer bits, and they can reduce sensitivity to the order of answer options by averaging a few reorderings. We ask whether the first makes the second worse, and which is the cheaper way to spend a fixed budget. On Qwen3-0.6B and Qwen3-1.7B with simulated round-to-nearest weight quantization (8, 6, 4 and 3 bits, fp16 reference), read from the logits of the letters A to D on ARC-Easy, ARC-Challenge, MMLU and HellaSwag (300 items each), 6 bits lose no accuracy against fp16 (they score +1.8 (+1.0 to +2.5) and +0.9 (+0.3 to +1.5) points higher, which we do not explain), and 8 bits change it by -0.7 (-1.1 to -0.3) and -0.4 (-0.7 to -0.2) points. At 4 bits the answer-slot skew rises from 0.15 to 0.53 (0.6B) and from 0.07 to 0.12 (1.7B); Gaussian noise at the same weight SNR gives 0.15 and 0.37 (two draws) and 0.19 (one draw), so the control is inconclusive on whether rounding adds slot skew beyond equal-power noise. Flip rates rise but stay below an accuracy-matched baseline of independent uniform errors. Averaging four cyclic orders recovers +12.6 points at 4 bits for 0.6B (+5.3 at fp16). We price bits and passes in one machine-independent unit, weight bytes read times passes. In cost-matched pairs, extra orders beat extra bits only when the weights have 6 or more bits, and the decision table reduces to: use 6-bit weights and spend the rest of the budget on up to four orders, one pass each. Everything is simulated on two small models with the simplest quantizer; a title-level search found no earlier study of quantization together with option order.', 'score': 2, 'issue_id': 3525, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '895666534dd1a5ab', 'authors': ['Mohammed Nayeem Khan', 'Logesh L', 'Aliyas Ahmad Misri'], 'affiliations': ['Intel'], 'pdf_title_img': 'assets/pdf/title_img/2611.14413.jpg', 'data': {'categories': ['#interpretability', '#small_models', '#benchmark', '#optimization', '#inference'], 'emoji': '🧠', 'ru': {'title': '6 бит и четыре перестановки: лучший бюджет для локальной LLM', 'desc': 'Статья исследует, как квантизация весов языковых моделей (LLM) до 8, 6, 4 и 3 бит влияет на точность и на чувствительность к порядку вариантов ответа (answer-slot skew). Эксперименты проведены на Qwen3-0.6B и 1.7B с round-to-nearest квантизацией на ARC, MMLU и HellaSwag. Авторы показывают, что 6 бит почти не теряют точность, а усреднение по нескольким циклическим перестановкам вариантов восстанавливает качество при 4 битах. Предложена единая метрика стоимости (байты весов × число проходов) и практическое правило: 6-битные веса плюс до четырёх перестановок.'}, 'en': {'title': 'Choose 6-bit weights, then average option orders', 'desc': 'The paper studies how weight quantization affects answer-option order bias in two small Qwen models on four multiple-choice benchmarks. Six-bit weights match or slightly outperform the fp16 reference, while four-bit weights increase answer-slot skew, though the noise control cannot establish whether rounding itself causes the increase. Averaging predictions across four cyclic option orders improves accuracy, especially with four-bit weights. Under a fixed compute-and-memory budget, the results favor using 6-bit weights and spending remaining resources on up to four option orders, but the findings are limited to these models and this simulated quantization setup.'}, 'zh': {'title': '先用 6 位量化，再把预算花在选项重排上', 'desc': '本文研究权重量化是否会加重多项选择题中答案选项顺序带来的偏差，并比较在固定计算预算下增加位数或重排选项的效果。实验在两种小型 Qwen3 模型上进行，发现 6 位量化的准确率不低于 fp16，而 4 位量化会加剧答案位置偏差；但目前的噪声对照实验无法确定这种偏差是否由舍入量化额外造成。对选项顺序进行四种循环排列并平均预测，可显著提升 4 位量化模型的表现，但按成本匹配比较，只有权重至少为 6 位时，增加选项顺序才比增加量化位数更划算。因此，在本文测试的预算设定下，建议采用 6 位权重，并将剩余预算用于最多四种选项顺序；结论仍受限于两种小模型和简单量化方法。'}}}, {'id': 'https://huggingface.co/papers/2611.13843', 'title': 'PolyRoute: A Twelve-Language and Code-Mixed Benchmark for Typed-Decision Routing, with Baselines and a Leaderboard', 'url': 'https://huggingface.co/papers/2611.13843', 'abstract': 'Abstract  Typed-decision encoders answer a question about a text in one forward pass, but their behaviour outside English is rarely measured on a fixed yardstick. We release PolyRoute: 322 native-language support messages in 12 languages and 9 writing systems, 156 code-mixed or romanised messages (Hinglish, Spanglish, Arabizi), 967 optional native training rows, and a protocol for a three-way department-routing decision. Labels come from Qwen3.8-27B with a blind second pass (91% of candidates kept); an independent model, gemma4-31b, agrees on 97.2% of test items, and the largest character 5-gram similarity between any test text and any training text is 0.33. A leaderboard of 13 systems gives 61.2% for the English-root checkpoint, 77.3% for the shipped multilingual one and 96.6% for the best fine-tune; TF-IDF with logistic regression reaches 91.9%. On four withheld languages the three multilingual systems score 77%, 90% and 93%. On code-mixed text the English root (85%) is nominally ahead of the shipped multilingual checkpoint (79%; p=0.134). The split resolves differences only above about 4 points. All texts and labels are LLM-generated.', 'score': 2, 'issue_id': 3525, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '39810074d014008e', 'authors': ['Mohammed Nayeem Khan', 'Sarun Kumar K S'], 'affiliations': ['Intel'], 'pdf_title_img': 'assets/pdf/title_img/2611.13843.jpg', 'data': {'categories': ['#open_source', '#training', '#low_resource', '#dataset', '#benchmark', '#machine_translation', '#multilingual', '#synthetic'], 'emoji': '🌍', 'ru': {'title': 'Многоязычная маршрутизация обращений: проверяем, понимает ли модель все языки одинаково хорошо', 'desc': 'В статье представлен датасет PolyRoute для многоязычной маршрутизации служебных обращений по трём отделам, включающий 322 сообщения на 12 языках и 156 смешанных или романизированных текстов. Разметка выполнена LLM Qwen3.8-27B с вторым слепым проходом, а независимая модель gemma4-31b совпала с ней в 97.2% случаев. Бенчмарк из 13 систем показывает, что лучший fine-tune достигает 96.6%, а классический TF-IDF с логистической регрессией - 91.9%, при этом кодо-смешанный текст остаётся слабым местом многоязычных энкодеров. Авторы отмечают, что все тексты сгенерированы LLM, а разбиение данных позволяет различать системы только при разнице более примерно 4 процентных пункта.'}, 'en': {'title': 'PolyRoute Tests Multilingual Message Routing', 'desc': 'The paper introduces PolyRoute, a benchmark for routing support messages to one of three departments across 12 languages, nine writing systems, and code-mixed or romanised text. Its labels and messages are generated by language models, and the authors check label agreement and text overlap to assess the dataset. In tests, the shipped multilingual model scores 77.3%, while the best fine-tuned system reaches 96.6%; a TF-IDF classifier with logistic regression scores 91.9%. Results vary across languages, and the benchmark is not precise enough to establish differences smaller than about four percentage points.'}, 'zh': {'title': '多语言路由基准：微调显著提升，传统分类器也表现强劲', 'desc': '论文发布了 PolyRoute 数据集，用于评估模型能否根据客服消息将问题分到三个部门，覆盖 12 种语言、9 种文字系统，以及混合语言和罗马字书写文本。数据集包含测试样本、可选训练数据，并采用独立模型复核标签；不过，所有文本和标签均由大语言模型生成。基准测试显示，微调后的最佳系统准确率为 96.6%，而 TF-IDF 配合逻辑回归也达到 91.9%；在保留语言上，多语言系统的表现优于英语基础模型。代码混合文本上的结果则不同，英语基础模型略高于已发布的多语言模型，但差异尚未达到统计显著性。'}}}, {'id': 'https://huggingface.co/papers/2611.11306', 'title': 'ScrapeBench: Evaluating Legal Compliance of AI Agents in Website Scraping', 'url': 'https://huggingface.co/papers/2611.11306', 'abstract': 'Abstract  AI agents deployed on the open web are becoming more capable of performing actions that may breach contractual provisions and violate computer security laws. In this paper, we introduce ScrapeBench, the first agentic benchmark for empirically evaluating the legal compliance of AI agents with website scraping policies, namely terms of service (ToS) and robots.txt directives. Across widely used closed-weight and open-weight AI agents, we find that most agents exhibit low compliance rates (< 5%) when instructed to scrape websites in our sample of 1,626 popular websites that explicitly prohibit scraping. In addition, we observe that even where AI agents actively check the applicable ToS and robots.txt, they continue to exhibit low compliance rates. Conversely, in our sample of 269 websites that do not prohibit scraping, we observe that agents sometimes refuse to scrape despite it being lawful, such as Claude Opus 4.6 exhibiting an over-refusal rate of 98.5%. Our human baseline experiments (n = 180 participants) suggest that humans exhibit compliance rates comparable to AI agents but over-refuse at much higher rates.', 'score': 1, 'issue_id': 3526, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '9a612576e8190f28', 'authors': ['Joseph Marvin Imperial', 'Daniel Slate', 'Noam Kolt'], 'affiliations': ['Hebrew University of Jerusalem', 'National University Philippines', 'Pivotal Research', 'University of Bath', 'University of Notre Dame'], 'pdf_title_img': 'assets/pdf/title_img/2611.11306.jpg', 'data': {'categories': ['#alignment', '#benchmark', '#ethics', '#agents'], 'emoji': '🕷️', 'ru': {'title': 'AI-агенты нарушают правила сайтов или зря отказываются работать: баланс пока не найден', 'desc': 'В статье представлен ScrapeBench — первый агентный бенчмарк для оценки того, насколько AI-агенты соблюдают правила веб-скрейпинга, включая пользовательское соглашение (ToS) и директивы robots.txt. Эксперименты с закрытыми и открытыми LLM показали, что на сайтах, запрещающих скрейпинг, большинство агентов соблюдают правила менее чем в 5% случаев, даже когда проверяют ToS и robots.txt. В то же время на разрешённых сайтах агенты часто отказываются работать без причины: например, Claude Opus 4.6 отказывал в 98,5% случаев. Базовые эксперименты с людьми показали сопоставимый уровень соблюдения правил, но люди отказываются гораздо реже, то есть значительно чаще ошибочно отказываются от законных задач.'}, 'en': {'title': 'ScrapeBench: Testing Whether AI Agents Follow the Rules—or Refuse Too Much', 'desc': 'The paper introduces ScrapeBench, a benchmark for testing whether AI agents follow website scraping rules in terms of service (ToS) and robots.txt files. In tests involving 1,626 websites that prohibit scraping, most agents complied less than 5% of the time, even when they checked the rules. On 269 websites that allow scraping, agents sometimes refused anyway; Claude Opus 4.6 had a 98.5% over-refusal rate. Human participants showed similar rule-following rates to the agents, but refused permitted scraping even more often.'}, 'zh': {'title': '让 AI 智能体既守规，也不误拒', 'desc': '本文提出 ScrapeBench，这是首个用于评估 AI 智能体是否遵守网站抓取政策的基准测试，考察网站服务条款（ToS）和 robots.txt 指令。研究在 1,626 个明确禁止抓取的网站上测试多种闭源和开源智能体，发现它们的合规率普遍低于 5%。即使智能体主动检查相关条款和指令，合规率仍然很低；而在 269 个允许抓取的网站上，智能体有时会错误拒绝任务，例如 Claude Opus 4.6 的过度拒绝率达到 98.5%。人类对照实验显示，人类的合规率与 AI 智能体相近，但过度拒绝的比例更高。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
