s claim for the three most recent collections of such judgments, Polaris, Nebula, and Spica, matching images at the pixel level. First, test samples reappear in training sets: the Spica training set contains about two-thirds of the Polaris test set, with identical human ratings. Second, controlled retraining shows that duplicates can inflate a metric: for Pearl, the gain is confined to the duplicated samples and grows with every epoch; for DENEB, it stays below one point. The gain depends on the learner and on how often a training set repeats a sample. Third, Kendall's τ over all samples is the sum of two terms, detecting captions with the lowest human score and ranking the others; the first supplies most of the reported correlation and is nearly saturated. The recent test sets cannot order Polos, DENEB and Pearl consistently, and a ridge regression on frozen features matches or exceeds all three. Fourth, we propose a protocol that ranks a learned metric only with a model trained without test samples, reports both terms, and compares metrics by paired tests. Under it, zero-shot vision--language judges rank first on the three recent test sets, and a fine-tuned judge ranks first on the three earlier benchmarks. The same analysis applies to any evaluator learned from human judgments; filter lists and code are released at https://github.com/morninghut/ic-dataset-audit .", 'score': 3, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '6d014bf7e9676b41', 'authors': ['Xiaochen Zhang', 'Jin Li', 'Chunlong Xia', 'Longjiang Guo'], 'affiliations': ['Baidu Inc.', 'School of Artificial Intelligence and Computer Science, Shaanxi Normal University'], 'pdf_title_img': 'assets/pdf/title_img/2611.30488.jpg', 'data': {'categories': ['#leakage', '#benchmark', '#multimodal', '#dataset', '#data', '#ethics', '#survey'], 'emoji': '🔍', 'ru': {'title': 'Дубликаты и насыщенные тесты завышают качество метрик описаний изображений', 'desc': 'Статья проводит аудит современных бенчмарков для оценки описаний изображений (image captioning), основанных на человеческих оценках, и показывает, что дубликаты между обучающей и тестовой выборками завышают результаты learned metrics. Авторы выделяют два компонента корреляции Кендалла τ: обнаружение наихудших описаний и ранжирование остальных, причём первый почти насыщен и даёт основной вклад в итоговую цифру. Простая ridge regression на замороженных признаках не уступает современным метрикам, а zero-shot vision-language judges оказываются лучшими на новых тестовых наборах. Предложенный протокол требует обучения без тестовых примеров, раздельного отчёта обоих компонентов и сравнения метрик через paired tests.'}, 'en': {'title': 'Clean Tests, Clearer Caption Metrics', 'desc': 'This paper audits image-captioning metrics trained on human judgments and finds that duplicate images across training and test sets can make reported generalization look better than it is. The effect varies by metric and training process, and much of Kendall’s τ correlation comes from identifying captions with the lowest human scores rather than ranking the rest. The authors also find that recent test sets do not consistently rank learned metrics, while a simple ridge-regression baseline can match or outperform them. They propose evaluating models without test-set overlap, reporting both parts of Kendall’s τ, and using paired statistical tests; under this protocol, zero-shot vision-language judges perform best on recent test sets.'}, 'zh': {'title': '清除重复样本，才能公平评估图像描述指标', 'desc': '本文审查图像描述评测基准中学习型指标的泛化能力，并逐像素匹配图像以发现训练集与测试集之间的重复样本。实验显示，重复数据可能抬高部分指标的相关性，但影响大小取决于学习方法和样本重复次数。作者还指出，Kendall τ 的总体分数很大程度来自识别人工评分最低的描述，而这一部分的表现已接近饱和，因此单一相关性分数可能掩盖指标差异。论文提出更严格的比较协议：排除测试样本参与训练，分别报告两类评分表现，并使用配对检验；按此协议，零样本视觉语言评判器在近期测试集上表现最佳。'}}}, {'id': 'https://huggingface.co/papers/2611.29547', 'title': 'Align the Pair, Not the Sample: Representation Alignment for Faster and Better One-Step Generato', 'url': 'https://huggingface.co/papers/2611.29547', 'abstract': "Abstract In one-step generator training, aligning the paired reconstruction path rather than the generative path improves recall and sample quality while accelerating both training stages and lowering FID.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Representation alignment markedly accelerates diffusion training, but one-step generators raise a question that diffusion does not: which training path should receive the loss? A one-step generator sees two kinds of inputs. Corrupted real images come with their clean counterpart, which provides an instance-paired target. Samples generated from pure noise have no corresponding real image, yet this is where the final model operates. We study this question on Priming, which trains one-step generators from scratch by reconstructing corrupted images and then matching feature distributions with optimal transport. Aligning the generative path, the natural choice, collapses recall (0.45!to!0.15--0.25) in all 17 configurations we test, including five target constructions and loss weights down to 0.05. Aligning the paired reconstruction path with a frozen DINOv2 encoder instead helps in every setting we test. A short analysis explains this asymmetry: when the target carries no instance information about the input, the optimal aligned feature is constant within each class, so the loss pulls samples toward class prototypes. A control confirms this: aligning the paired path to a random same-class image instead of the input's own image removes most of the gain. Inside the generator, paired-path alignment creates an interface block through which post-training routes noise, and the image semantics carried through it predict sample quality across 16 models. The resulting recipe, \\method, accelerates both training stages on ImageNet 256!times!256: it matches the 160-epoch baseline with 2times fewer priming epochs, surpasses its final quality with 4times fewer post-training updates, and lowers FID to 1.30 (B) and 1.155 (L) at the standard budget. A joint single-stage variant trains native one-step generators and reaches FID 1.22 with 115M parameters.", 'score': 3, 'issue_id': 3564, 'pub_date': '2026-11-22', 'pub_date_card': {'ru': '22 ноября', 'en': 'November 22', 'zh': '11月22日'}, 'hash': '583aef1beafc1562', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#optimization', '#architecture', '#training', '#diffusion'], 'emoji': '🎯', 'ru': {'title': 'Выравнивайте парный путь реконструкции, а не генеративный, и обучение одношагового генератора станет быстрее и качественнее', 'desc': 'В статье исследуется, какой путь обучения одношагового генератора стоит выравнивать с признаками внешнего энкодера. Авторы показывают, что выравнивание генеративного пути, то есть сгенерированных из шума образцов, резко снижает recall, тогда как выравнивание парного пути реконструкции с замороженным DINOv2 стабильно помогает. Причина в том, что без информации об экземпляре оптимальный признак становится константным внутри класса, и лосс стягивает образцы к прототипам классов. Предложенный рецепт ускоряет обе стадии обучения на ImageNet 256x256 и снижает FID до 1.30 и 1.155, а совместный одностадийный вариант достигает FID 1.22.'}, 'en': {'title': 'Align the Paired Path for Faster, Better One-Step Generation', 'desc': 'The paper studies where to apply representation-alignment loss when training one-step image generators. Aligning generated samples to feature targets without instance-specific information can pull them toward class prototypes, reducing recall and sample quality. Instead, aligning corrupted images with their own clean counterparts using a frozen DINOv2 encoder improves results across the tested settings. This approach speeds up both training stages and achieves lower FID, including 1.22 for a joint single-stage model.'}, 'zh': {'title': '对齐配对重建路径，让一步生成更快、更好', 'desc': '这篇论文研究一步生成器应该在哪条训练路径上进行特征对齐：从噪声生成的路径，还是带有真实图像配对目标的重建路径。实验发现，用冻结的 DINOv2 编码器对齐配对重建路径，能提升样本质量与召回率；对齐生成路径则会导致召回率明显下降。原因是生成路径的目标缺少输入图像对应的实例信息，特征对齐可能把样本推向类别原型；而配对路径保留了图像的语义信息。基于这一发现，论文提出的方法减少了训练所需的轮数和更新次数，并在 ImageNet 上取得更低的 FID。'}}}, {'id': 'https://huggingface.co/papers/2611.25848', 'title': 'Interpretable Prototype-Conditioned Adaptation for Weather Forecasting', 'url': 'https://huggingface.co/papers/2611.25848', 'abstract': "Abstract Group-specific prototype banks with cross-variable attention and sparse low-rank corrections improve the accuracy and interpretability of neural weather forecasting by explicitly linking local prototype contributions to prediction errors.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Data-driven weather forecasting requires distinguishing local states and their temporal evolution. However, learned patterns remain implicit in neural forecasters, making their influence difficult to interpret. Failing to distinguish local evolution can lead to similar forecasts for locations that develop differently, increasing prediction error. This motivates explicit references for distinguishing and interpreting local patterns. Prototypes provide explicit pattern references, but sample- or task-level conditioning leaves open how to adapt to distinct locations and variable groups. To deal with this problem, we design ProtoCast, which uses group-specific prototype banks to adapt local features while accounting for cross-variable dependencies. Specifically, (1) we combine each group's historical features and temporal change with forecast context from cross-variable attention for evolution-aware prototype matching. (2) Sparse mixtures of prototype-specific low-rank operators tailor corrections to each group and location. A gated attention block then exchanges the corrected features across groups before prediction. Each group's correction decomposes into explicit prototype contributions before this fusion. (3) We jointly train the forecasting network and operators from scratch and refit each group's prototypes before every training epoch. Slot tracking preserves prototype-operator associations, making each prototype's contribution to local corrections more interpretable. Experiments on GlobalForecast and TyphoonTracking show improved forecasting accuracy, while prototype deletion links local feature contributions to changes in prediction error. This work advances the development of more accurate and interpretable data-driven weather forecasting models. Project page: https://zhixuanli.github.io/projects/li2026protocast", 'score': 3, 'issue_id': 3564, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': '0d593f3633ad46e4', 'authors': ['Zhixuan Li', 'Hao Jiang', 'Chen Hui', 'Kai Geng', 'Weisi Lin'], 'affiliations': ['Nanjing University of Information Science and Technology, China', 'Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.25848.jpg', 'data': {'categories': ['#architecture', '#data', '#interpretability', '#training'], 'emoji': '🌦️', 'ru': {'title': 'Прототипы погоды: точнее прогноз и понятное объяснение каждого вклада', 'desc': 'В статье представлен ProtoCast — модель для прогнозирования погоды на основе данных, которая использует групповые банки прототипов (prototype banks), специфичные для каждой группы переменных. Прототипы сопоставляются с признаками, историей и временными изменениями с учётом контекста из cross-variable attention, что позволяет учитывать эволюцию локальных состояний. Для коррекций применяются разреженные смеси low-rank операторов, а затем gated attention объединяет скорректированные признаки между группами перед предсказанием. Благодаря slot tracking и удалению прототипов удаётся связать вклад каждого прототипа с изменением ошибки прогноза, что повышает и точность, и интерпретируемость модели.'}, 'en': {'title': 'Weather Forecasts Made Clearer with Local Prototypes', 'desc': 'ProtoCast improves neural weather forecasting with separate prototype banks for different variable groups. It matches local historical patterns and their temporal evolution to prototypes, using cross-variable attention to include forecast context. Sparse mixtures of low-rank operators then apply group- and location-specific corrections, whose prototype contributions can be inspected before features are combined for prediction. Experiments show better forecast accuracy, and deleting prototypes reveals how their contributions affect prediction error.'}, 'zh': {'title': '让天气预报有据可循：用专属原型提升准确度与可解释性', 'desc': '这篇论文提出 ProtoCast，一种用于数据驱动天气预报的神经网络模型，目标是提升预测准确度和可解释性。模型为不同变量组建立专属原型库，并结合历史特征、时间变化和跨变量注意力信息，匹配适合的局部天气模式。随后，模型用稀疏混合的低秩算子修正各组和各地点的特征，再通过门控注意力融合不同变量组的信息。实验显示，ProtoCast 在多个数据集上提高了预报表现；删除原型的测试也能揭示各原型对局部修正及预测误差的影响。'}}}, {'id': 'https://huggingface.co/papers/2611.29150', 'title': 'Can an Agent Trust Its Own Zoom? Cross-Magnification Provenance Verification for Whole-Slide Images', 'url': 'https://huggingface.co/papers/2611.29150', 'abstract': "Abstract  Visual agents navigate whole-slide images through magnified observations associated with claimed locations. However, a visually plausible observation does not necessarily originate from its claimed location, particularly across magnifications and in regions with similar tissue structures. We formulate cross-magnification provenance verification (CMPV) to evaluate whether visual evidence supports a claimed spatial association, recover the source when possible, and abstain when evidence is insufficient. We introduce PyraFault, a benchmark of 3.06 million coordinate-supervised examples from 2,200 cases across five TCGA cohorts, covering within-context substitutions, absent-source faults, and geometric perturbations. We further propose ZoomTrace, a claim-independent verifier that estimates the observation's source before evaluating its agreement with the claimed location. It combines physical-scale alignment, visual retrieval, geometric refinement, and reliability estimation using spatially disjoint competing matches. On 503,320 test examples, ZoomTrace achieves 0.969 AUPRC and 0.987 AUROC, compared with 0.789 and 0.903 for Efficient LoFTR. Further evaluations reveal trade-offs in reliability estimation and limitations in vision-language models, cross-dataset retrieval, and calibration. Integrating ZoomTrace into visual agent tool paths reduces exposure to corrupted observations and silent failures, while downstream accuracy improvements depend on the agent and verification threshold.", 'score': 3, 'issue_id': 3564, 'pub_date': '2026-11-22', 'pub_date_card': {'ru': '22 ноября', 'en': 'November 22', 'zh': '11月22日'}, 'hash': 'aa43d6f3f5c8c2d1', 'authors': ['Yan Wang', 'Yiran Song', 'Zizhuo Gong', 'Jianxiang Qi', 'Zhongxing Xu', 'Lingfei Qian', 'Minquan Lin'], 'affiliations': ['Monash University', 'University of Minnesota Twin Cities', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2611.29150.jpg', 'data': {'categories': ['#cv', '#benchmark', '#science', '#agents', '#dataset', '#security', '#architecture', '#healthcare', '#interpretability'], 'emoji': '🔬', 'ru': {'title': 'Проверяй, откуда кадр: надёжная верификация увеличения в гистологии', 'desc': 'Авторы рассматривают задачу проверки происхождения изображения при переходе между разными уровнями увеличения в гигапиксельных снимках гистологических препаратов (WSI). Для этого предложен бенчмарк PyraFault с более чем 3 млн примеров с координатной разметкой, включающий подмены внутри контекста, отсутствующие источники и геометрические искажения. Метод ZoomTrace сначала оценивает истинный источник наблюдения, используя выравнивание масштаба, визуальный поиск и геометрическое уточнение, и только затем сравнивает его с заявленным местом, а надёжность оценивается на основе пространственно непересекающихся конкурирующих совпадений. На тестовой выборке ZoomTrace показывает AUPRC 0.969 и AUROC 0.987, заметно превосходя Efficient LoFTR, а также выявляет ограничения vision-language моделей и калибровки.'}, 'en': {'title': 'Verify the source before trusting the view', 'desc': 'The paper studies whether a magnified view of a whole-slide image truly comes from the location it claims to show. It introduces PyraFault, a benchmark with millions of coordinate-labeled examples, including incorrect substitutions, missing sources, and geometric distortions. The proposed ZoomTrace first estimates where an image came from, then checks whether that source matches the claimed location, combining scale alignment, visual retrieval, geometric refinement, and reliability estimation. ZoomTrace outperforms the comparison method on the benchmark, and its use can help agents avoid corrupted observations, though benefits depend on the agent and verification threshold.'}, 'zh': {'title': '先追溯图像来源，再核验位置主张', 'desc': '这篇论文研究跨倍率来源验证（CMPV），判断全切片图像中的观察是否确实来自所声称的位置，并在证据不足时拒绝判断。作者构建了 PyraFault 基准数据集，包含来自五个 TCGA 队列、2200 个病例的 306 万个带坐标标注样本。作者提出 ZoomTrace：先估计观察的真实来源，再核验它是否与声称位置一致；方法结合物理尺度对齐、视觉检索、几何细化和可靠性估计。在测试集上，ZoomTrace 的 AUPRC 和 AUROC 均高于 Efficient LoFTR，但其可靠性评估、跨数据集检索和校准仍有局限，且能否提升下游准确率取决于智能体和验证阈值。'}}}, {'id': 'https://huggingface.co/papers/2611.32816', 'title': 'SpatialArena: Where Do Geometric Foundation Models Stand?', 'url': 'https://huggingface.co/papers/2611.32816', 'abstract': 'Abstract SpatialArena is an open benchmark that evaluates geometric models across five 3D perception tasks using uniform metrics and robust alignment, revealing that single-image depth is near saturation on public benchmarks but progress now depends on cross-frame and cross-view consistency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash 3D perception is shifting from task-specific pipelines to geometric foundation models: monocular depth networks, feed-forward 3D/4D reconstruction models, and vision--language models that predict geometry. However, their progress cannot be measured reliably. Published numbers are not comparable, because every paper samples frames, sets resolutions, and selects test splits differently. They are not robust because the alignment required for every up-to-scale prediction can outweigh the gap between models: fitting depth in the wrong space nearly triples its error, and standard trajectory alignment understates the error of failing methods by up to 2.6times. And they rarely cover long recordings, dynamic scenes, or aerial views. We present SpatialArena, an open arena that scores geometric models with the same metrics and rules, with robust and deterministic alignment. SpatialArena spans five tasks, from monocular depth to SLAM. It covers 23 public datasets with 418,929 images across indoor, outdoor, aerial, object-centric, and dynamic scenes, together with Spatial Arena, our own captures with accurate poses and depth. Evaluating 52 models, we find that single-image depth is close to saturation on public benchmarks but not on large, uncontrolled scenes, and that progress now comes from consistency across frames and views, where feed-forward 3D/4D models match or surpass monocular specialists and overtake video depth models. The benchmark, toolbox, and leaderboard will be publicly released.', 'score': 2, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '02b904e213f6b78e', 'authors': ['Yu Chen', 'Haosen Yang', 'Su Ee Tan', 'Zhensong Zhang', 'Jifei Song', 'Jiankang Deng'], 'affiliations': ['Imperial College London', 'MVP Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.32816.jpg', 'data': {'categories': ['#benchmark', '#cv', '#3d', '#dataset', '#open_source', '#survey', '#video'], 'emoji': '🧭', 'ru': {'title': 'Измеряем 3D-восприятие честно: прогресс теперь в согласованности кадров', 'desc': 'Авторы представляют SpatialArena — открытый бенчмарк для оценки геометрических моделей 3D-восприятия по пяти задачам, от монокулярной оценки глубины до SLAM. Для честного сравнения используются единые метрики, правила выборки кадров и детерминированное робастное выравнивание, которое устраняет искажения при сравнении моделей с неизвестным масштабом. Набор включает 23 публичных датасета (около 419 тысяч изображений) и собственные записи с точными позами и глубиной, охватывая помещения, улицу, аэросъёмку, динамические сцены. На 52 моделях показано, что глубина по одному кадру почти насыщена, а прогресс теперь определяется согласованностью между кадрами и видами, где feed-forward 3D/4D модели превосходят специализированные монокулярные решения и видео-модели глубины.'}, 'en': {'title': 'Beyond Single Images: Measuring Consistency in 3D Perception', 'desc': 'SpatialArena is an open benchmark for evaluating geometric models across five 3D perception tasks, from monocular depth estimation to SLAM. It uses consistent metrics and deterministic, robust alignment across 23 public datasets and newly captured scenes. Evaluation of 52 models suggests that single-image depth estimation is nearing saturation on public benchmarks, though it remains challenging on large, uncontrolled scenes. Further progress depends on consistency across frames and views, where feed-forward 3D and 4D models perform as well as or better than specialized depth models.'}, 'zh': {'title': '统一评测几何模型，让跨帧与跨视角一致性推动三维感知进步', 'desc': 'SpatialArena 是一个开放基准，用统一的指标和稳健、确定的对齐方法评估几何模型在五项三维感知任务上的表现。它涵盖 23 个公开数据集、近 42 万张图像，以及室内、室外、航拍、物体中心和动态场景，并评测了 52 个模型。结果显示，单目深度估计在公开基准上的性能已接近饱和，但在规模更大、条件更复杂的场景中仍有提升空间。未来进步更依赖跨帧与跨视角的一致性，而前馈式三维和四维重建模型已能匹敌或超越专门的单目模型及视频深度模型。'}}}, {'id': 'https://huggingface.co/papers/2611.32423', 'title': 'Factorized Context Attention: From Emulated to Native Grid Probing', 'url': 'https://huggingface.co/papers/2611.32423', 'abstract': 'Abstract Factorized Context Attention is a training-free block-sparse attention method that natively reproduces grid probing’s span-based attention pattern, encoding input once into a KV cache to match accuracy and extend context at lower cost across video, text, and image tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Models read a book, an hour of video, or an image in one forward pass. As the context grows, this pass slows down, loses accuracy, and stops at the context window. Sparse attention is efficient, but keeps the other two limitations. Grid probing, a recent training-free method, recovers the accuracy and extends the reach by asking a frozen model the same question about short local and strided spans of the input, but every question repeats the whole computation, since each span is encoded again. Our insight is that grid probing is emulated attention, an attention pattern reproduced from outside the model through prompts, since each probe only restricts which part of the input the question can see. We introduce Factorized Context Attention (FCA), a training-free block-sparse attention that runs the same pattern natively, as the attention of the model itself. FCA encodes the input once into a KV cache, reads all spans as masked sequences in one batched forward, and uses a stair position schedule to keep every span inside the trained position range. Across long video understanding, long-context text inference and image grounding, FCA matches the accuracy and the reach of grid probing at a fraction of its cost. It gains about 10 points over the single pass on long video and 9 to 14 points on long novels, finds needles in videos of over a thousand frames and in texts four times the length of the window, and answers a later question about the same input in as little as a tenth of the time of grid probing. Native attention thus keeps what emulated attention gains without its cost, all with existing frozen language and vision-language models.', 'score': 2, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '93183aedb78305d8', 'authors': ['Mohamed Eltahir', 'Manar Eyad', 'Yara Alzahrani', 'Fatimah Albesher', 'Duaa M. Tahir', 'Tanveer Hussain', 'Naeemullah Khan'], 'affiliations': ['Department of Computer Science, Edge Hill University, Ormskirk, England', 'King Abdullah University of Science and Technology (KAUST), Thuwal, Saudi Arabia'], 'pdf_title_img': 'assets/pdf/title_img/2611.32423.jpg', 'data': {'categories': ['#multimodal', '#video', '#architecture', '#inference', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Нативное внимание вместо имитации: точность grid probing без его цены', 'desc': 'Статья представляет Factorized Context Attention (FCA) — метод блочно-разреженного внимания без обучения, который встраивает паттерн grid probing непосредственно в механизм attention модели. Вход кодируется один раз в KV cache, а все локальные и страйд-спаны обрабатываются как замаскированные последовательности в одном батчевом forward-проходе с использованием stair position schedule. Такой подход сохраняет точность и дальность охвата контекста, сравнимые с grid probing, но работает существенно быстрее, в том числе при повторных вопросах к тому же входу. Метод применим к существующим замороженным LLM и VLM и показывает улучшения на длинных видео, длинных текстах и задачах grounding по изображениям.'}, 'en': {'title': 'Grid probing’s reach, with one encoding and native attention', 'desc': 'Factorized Context Attention (FCA) is a training-free, block-sparse attention method that reproduces grid probing directly inside a model. It encodes the input once into a key-value (KV) cache, then uses masked attention over local and strided spans in a batched forward pass. A stair position schedule keeps those spans within the model’s trained position range, helping FCA handle contexts beyond the usual window. Across video, text, and image tasks, it matches grid probing’s accuracy and reach at much lower computational cost.'}, 'zh': {'title': '让稀疏注意力原生实现网格探测，兼顾长上下文与低成本', 'desc': '这篇论文提出因子化上下文注意力（FCA），一种无需训练的块稀疏注意力方法。它把网格探测所用的局部与跨步跨度注意力模式直接实现为模型内部的注意力计算，并将输入编码一次存入键值（KV）缓存，再通过掩码序列批量读取各个跨度。阶梯式位置安排让每个跨度都处于模型训练过的位置范围内，有助于在扩展上下文时保持准确性。实验显示，FCA在长视频、长文本和图像任务上达到接近网格探测的效果，同时显著降低计算成本。'}}}, {'id': 'https://huggingface.co/papers/2611.29874', 'title': 'Escriba-OCR: A 1B Vision-Language Model for Error-Preserving Transcription of Handwritten Portuguese Essays', 'url': 'https://huggingface.co/papers/2611.29874', 'abstract': "Abstract  Feedback tools and research on learner writing need transcriptions of handwritten essays that keep exactly what the student wrote: misspellings, line breaks, struck-through words and insertions. Vision-language models (VLMs) read handwriting well, but they also tend to rewrite it into correct language. We measure this on BRESSAY, 1,000 handwritten Brazilian Portuguese essays, with a benchmark that adds error preservation, invented errors, edit-markup precision and recall and line structure to the character error rate (CER) and uses paired bootstrap confidence intervals. We restrict the study to open-weight models that schools can run on their own hardware. Of 22 open baselines, the best, Qwen3-VL 235B-A22B, reaches 5.6% CER on the 199 test pages; none reproduces the edit markup reliably, and every VLM replaces 39-78% of the words absent from a Portuguese dictionary with dictionary words. We fine-tune LightOnOCR-3-1B on the 647 training pages in 85 minutes on one GPU. The resulting Escriba-OCR-1B reaches 2.06% CER, 3.5 points below the best baseline (95% CI [-4.2, -2.9]); under the ICDAR 2024 competition metric it reaches 2.1% CER, below the best published page-level results (2.2-2.4%). It recovers 67% of insertions and 77% of illegible deletions, and reproduces the line structure of 97% of the pages, but still normalises 60% of likely misspellings. Three seeds agree within 0.04 CER points, and quantised to 4 bits the model runs on an ordinary CPU at about one minute per page. On 40 letters of another corpus it matches its base model (without that model's appended comments) but misreads unseen words more often; weight interpolation recovers half the gap. A teacher's review finds that 45% of the judgeable apparent corrections are errors in the BRESSAY ground truth, so dictionary-based scores likely understate preservation. We release the model, the benchmark code and the review data.", 'score': 2, 'issue_id': 3564, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '87b0b657a57eb0f5', 'authors': ['Tardelli Ronan Coelho Stekel'], 'affiliations': ['Federal Institute of São Paulo (IFSP), Brazil'], 'pdf_title_img': 'assets/pdf/title_img/2611.29874.jpg', 'data': {'categories': ['#cv', '#open_source', '#benchmark', '#science', '#dataset', '#data', '#small_models', '#multilingual', '#healthcare', '#training', '#low_resource', '#inference'], 'emoji': '✍️', 'ru': {'title': 'Распознавать рукопись точно, а не переписывать её заново', 'desc': 'Авторы исследуют, как vision-language модели (VLM) распознают рукописные эссе на бразильском португальском: большие модели склонны «исправлять» орфографию и переписывать текст, а не передавать его точно. Они создали бенчмарк BRESSAY из 1000 эссе с метриками сохранения ошибок, правок и структуры строк, и показали, что лучшая открытая модель Qwen3-VL даёт CER 5,6%. Дообучив компактную модель LightOnOCR-3-1B на 647 страницах за 85 минут на одном GPU, они получили Escriba-OCR-1B с CER 2,06%, которая работает даже на обычном CPU. Работа также показывает, что часть «ошибок» в эталонной разметке на самом деле является ошибками разметки, поэтому словарные метрики могут занижать качество сохранения текста.'}, 'en': {'title': 'Transcribe the Writing—Don’t Rewrite It', 'desc': 'This paper evaluates open-weight vision-language models (VLMs) for transcribing handwritten Brazilian Portuguese essays while preserving student errors, edits, and line breaks. The strongest baseline achieves 5.6% character error rate (CER), but all tested VLMs often normalize misspellings and fail to reproduce edit markup reliably. Fine-tuning a 1-billion-parameter OCR model produces Escriba-OCR-1B, which reaches 2.06% CER and preserves line structure on 97% of test pages, though it still corrects many likely misspellings. The model runs on ordinary CPUs when quantized, and the authors release it alongside benchmark code and review data.'}, 'zh': {'title': '转写手写原文，不替学生纠错', 'desc': '本文研究如何准确转写巴西葡萄牙语手写作文，并保留拼写错误、换行、删除线和插入内容，而不是自动改写成规范语言。作者在包含1,000篇作文的BRESSAY数据集上评测22个可本地运行的开源视觉语言模型，并设计指标衡量错误保留、误造错误、编辑标记和行结构。研究者用647页训练数据微调一个小型OCR模型Escriba-OCR-1B，使字符错误率达到2.06%，优于基线模型；量化到4位后，它还能在普通CPU上运行。模型能较好恢复插入内容和行结构，但仍会把许多疑似拼写错误改成词典中的正确词，而且人工复核发现部分基准答案本身也有错误。'}}}, {'id': 'https://huggingface.co/papers/2611.30017', 'title': 'OWE-Bench: A long-horizon benchmark for measuring real-world engineering', 'url': 'https://huggingface.co/papers/2611.30017', 'abstract': 'Abstract  We present OWE-Bench (OpenWorldEngineer-Bench), a benchmark of 26 long-horizon engineering tasks written by domain experts in software engineering, physical engineering, machine learning, and scientific computing. Tasks range from optimizing kernels and designing an aircraft, to identifying the faults responsible for an earthquake. Each task requires significant domain knowledge and engineering work, with models averaging hundreds of millions of tokens per task. Solutions are scored on practical measures such as speed, cost and accuracy, both on provided cases the agent could test against and on hidden cases that an engineer would expect from the task description. The best-performing frontier model so far, Claude Fable 5.2, scores 54.6% and averages 211 million tokens per task. We highlight two findings. First, when models are given more time, they use more test-time compute and achieve higher scores. Models also scale differently with test-time compute: GPT-6 Astra achieves higher scores at shorter time limits and at equal token use, while Claude Fable 5.2 uses more tokens at longer limits to achieve the highest overall score. Second, each model scores lower on hidden cases than on the provided cases, by an average of 18 points, which we call the deployment gap. Models also fail to predict the deployment gap, overestimating their performance on hidden test cases by an average of 21 points. We hope that OWE-Bench grounds progress toward agents whose engineering solutions perform as well in deployment as they do in testing.', 'score': 1, 'issue_id': 3565, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '43cb44e425da711b', 'authors': ['Jacob Cole', 'Martin Dimakis', 'Victor Barres', 'Bertie Vidgen', 'Edward Hu', 'Jason Wei'], 'affiliations': ['Mercor'], 'pdf_title_img': 'assets/pdf/title_img/2611.30017.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🛠️', 'ru': {'title': 'Агенты должны работать не только на тестах, но и в реальности', 'desc': 'Авторы представляют OWE-Bench — бенчмарк из 26 долгосрочных инженерных задач, подготовленных экспертами в программной инженерии, физическом проектировании, машинном обучении и научных вычислениях. Решения оцениваются по скорости, стоимости и точности как на открытых тестах, так и на скрытых кейсах, а лучшая модель Claude Fable 5.2 набирает 54,6% при расходе около 211 миллионов токенов на задачу. Исследование показывает, что при большем лимите времени модели тратят больше вычислений на этапе инференса и получают более высокие баллы, а модели по-разному масштабируются с test-time compute. Также выявлено «разрыв развертывания»: в среднем на скрытых кейсах результаты на 18 пунктов ниже, и модели переоценивают себя примерно на 21 пункт. Работа призвана сделать прогресс AI-агентов ближе к реальной эксплуатации их инженерных решений.'}, 'en': {'title': 'Engineering Agents Must Prove Their Solutions Beyond the Test Set', 'desc': 'OWE-Bench evaluates AI agents on 26 challenging, long-horizon engineering tasks across fields such as software, physical engineering, machine learning, and scientific computing. It scores solutions using practical measures, including speed, cost, and accuracy, on both provided tests and hidden cases. The results show that more test-time compute can improve performance, but models differ in how efficiently they use time and tokens. Models also perform substantially worse on hidden cases than on provided tests and tend to overestimate how well their solutions will work after deployment.'}, 'zh': {'title': '让工程智能体经得起真实部署考验', 'desc': '论文提出 OWE-Bench，这是一个包含 26 项长期工程任务的基准测试，涵盖软件工程、物理工程、机器学习和科学计算等领域。任务需要大量专业知识和计算资源，并根据速度、成本与准确率等实际指标评分，同时在已提供和隐藏测试案例上评估表现。实验发现，增加测试时计算通常能提升模型得分，但不同模型从额外计算中获益的方式不同。模型在隐藏案例上的平均得分比已提供案例低 18 分，而且还会高估隐藏案例表现 21 分；作者将这种差距称为“部署差距”。'}}}, {'id': 'https://huggingface.co/papers/2611.31129', 'title': 'FATCAT: Fault Injection Attacks Targeting Chip-level Alignment', 'url': 'https://huggingface.co/papers/2611.31129', 'abstract': 'Abstract  Model alignment is the primary safety and security mechanism for enforcing refusal of malicious prompts in modern foundation models; yet, existing adversarial evaluations implicitly assume underlying hardware integrity. In this paper, we present FATCAT, the first physical fault-injection attacks capable of eliminating refusal in modern large language and vision-language models. Specifically, we present a non-invasive electromagnetic (EM) fault injection attack targeting GPU-accelerated Systems-on-Chip with physical access, requiring neither software execution privileges nor model-layer access. By leveraging an autonomous Radio Frequency (RF) side-channel trigger to synchronize EM faults to the prompt prefill phase, the attack corrupts safety-critical memory transactions across off-chip LPDDR5 DRAM and on-chip LPDDR physical interfaces without crashing the system while preserving model coherence. Evaluated on an NVIDIA Jetson Orin Nano and AGX Thor running Llama 3.2 1B and Gemma 3 1B, localized physical faults reliably force models to fulfill restricted requests, demonstrating that model-level alignment provides no robust security guarantees without hardware-level fault tolerance. Finally, we demonstrate the physical-world consequences of this vulnerability on an active 6-DoF robotic manipulator controlled by a SmolVLA vision-language-action policy. Our attack silently corrupts the model forcing the arm into abrupt, hazardous lunges; in two instances the robotic arm attempted to pinch the paper author -- proving that hardware faults can directly translate into real physical harm.', 'score': 1, 'issue_id': 3565, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '966021fd5837fa1f', 'authors': ['Peter Horvath', 'Ilia Shumailov', 'Zhuoran Liu', 'Lukasz Chmielewski', 'Lejla Batina'], 'affiliations': ['Masaryk University', 'Radboud University', 'University of Amsterdam'], 'pdf_title_img': 'assets/pdf/title_img/2611.31129.jpg', 'data': {'categories': ['#small_models', '#security', '#multimodal', '#inference', '#robotics', '#alignment'], 'emoji': '⚡', 'ru': {'title': 'Аппаратный сбой обходит безопасность ИИ: alignment без железной защиты не работает', 'desc': 'В статье представлен FATCAT — первая атака физического внедрения сбоев (fault injection), которая отключает механизм отказа (refusal) в современных LLM и vision-language моделях. Атака использует неинвазивное электромагнитное воздействие на GPU-ускоренные SoC, синхронизированное через RF side-channel триггер с фазой prefill промпта, и повреждает критичные операции с памятью LPDDR5. Эксперименты на NVIDIA Jetson Orin Nano и AGX Thor с моделями Llama 3.2 1B и Gemma 3 1B показывают, что выравнивание модели (alignment) не даёт надёжной защиты без аппаратной отказоустойчивости. Авторы также демонстрируют физические последствия на роботе-манипуляторе, управляемом VLA-политикой SmolVLA, где сбой приводил к опасным движениям.'}, 'en': {'title': 'When Hardware Faults Bypass Model Safeguards', 'desc': 'The paper introduces FATCAT, a physical fault-injection attack that can make aligned language and vision-language models stop refusing restricted requests. It uses electromagnetic signals and an RF side-channel trigger to disrupt memory transactions during prompt processing, while keeping the system running and the model coherent. Tests on NVIDIA hardware with Llama and Gemma models show that physical faults can bypass safeguards, and a demonstration with a robotic arm shows how corrupted model behavior can create physical hazards. The findings suggest that model alignment alone cannot provide reliable security without hardware-level fault tolerance.'}, 'zh': {'title': '模型对齐之外，硬件容错也是安全防线', 'desc': '本文提出 FATCAT，一种针对现代大语言模型和视觉语言模型的物理故障注入攻击，旨在绕过模型的拒绝机制。攻击者需要接触设备，但无需软件执行权限或访问模型内部；攻击利用射频侧信道同步电磁干扰，在提示预填充阶段破坏关键内存传输。研究在 Jetson 平台上测试了多种模型，发现设备仍能正常运行，但模型会响应受限请求，说明仅靠模型对齐不足以保障安全。研究还展示了这种硬件故障可能影响机器人控制策略，使机械臂产生危险动作，因此需要加入硬件层面的容错保护。'}}}, {'id': 'https://huggingface.co/papers/2611.31258', 'title': 'RECAP: Training Long-horizon LLM Agents with Context Compaction', 'url': 'https://huggingface.co/papers/2611.31258', 'abstract': "Abstract A reinforcement learning framework, RECAP, optimizes context compaction by aligning compressed-context behavior with original-history behavior, improving long-horizon agent performance.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Context compaction enables large language model agents to tackle long-horizon tasks within limited context budgets by replacing interaction histories with compressed summaries. However, learning effective compaction jointly with the agent policy remains challenging, as summaries affect task success over many subsequent interactions. We introduce RECAP, a reinforcement learning (RL) framework based on the principle that a summary should preserve the behavior induced by the original interaction history. We formalize this principle with a behavior distortion objective that measures the divergence between the agent's subsequent behavior under compressed and original contexts. We show that the gradient of the distortion objective decomposes into two complementary learning signals: distortion-based reward for summary generation and self-distillation for subsequent actions. Experiments on Qwen3.5-4B show that RECAP consistently outperforms the task-reward-only RL baselines on both environments, leading to an absolute improvement of 4.6% and 4.3% on BrowseComp-plus and SWE-bench Verified, respectively. Ablations further highlight the value of jointly supervising summary generation and post-compaction behavior for RECAP.", 'score': 1, 'issue_id': 3565, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': 'e5f966823c7489a4', 'authors': ['Yulun Jiang', 'Maria Brbic', 'Michael Moor'], 'affiliations': ['EPFL', 'ETH Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2611.31258.jpg', 'data': {'categories': ['#long_context', '#small_models', '#training', '#agents', '#optimization', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Сжимай контекст так, чтобы агент думал как прежде', 'desc': 'Авторы предлагают RECAP — фреймворк обучения с подкреплением (reinforcement learning), который оптимизирует сжатие контекста для LLM-агентов. Главная идея: саммари должно сохранять поведение агента, которое он имел бы при полной истории взаимодействий, для чего вводится целевая функция искажения поведения (behavior distortion objective). Градиент этой функции раскладывается на два сигнала: награду за искажение для генерации саммари и self-distillation для последующих действий агента. Эксперименты на Qwen3.5-4B показали прирост в 4.6% на BrowseComp-plus и 4.3% на SWE-bench Verified по сравнению с RL-базовыми методами, использующими только task reward.'}, 'en': {'title': 'Compress the Context, Preserve the Behavior', 'desc': 'RECAP is a reinforcement learning framework that trains language-model agents to compress their interaction histories while preserving useful information. It measures behavior distortion by comparing the agent’s actions given a compressed summary with its actions given the original history. This objective provides two learning signals: a reward for generating better summaries and self-distillation to align later actions with the original-context behavior. On BrowseComp-plus and SWE-bench Verified, RECAP outperforms task-reward-only baselines, showing the value of training summaries and subsequent behavior together.'}, 'zh': {'title': '压缩上下文，也要保留原有行为', 'desc': '这篇论文提出了 RECAP，一种用强化学习训练智能体压缩上下文的方法，帮助智能体在有限的上下文预算内完成长期任务。它的核心目标是让压缩后的摘要尽可能保留原始交互历史所引发的智能体行为。作者设计了行为失真目标，用来衡量智能体在摘要和完整历史下后续行为的差异，并将其转化为摘要生成的奖励和后续动作的自蒸馏信号。在 Qwen3.5-4B 上的实验显示，RECAP 在 BrowseComp-plus 和 SWE-bench Verified 上分别比仅使用任务奖励的强化学习基线提升 4.6 和 4.3 个百分点。'}}}, {'id': 'https://huggingface.co/papers/2611.30963', 'title': 'Foresight Forcing: Learning Spatial Foresight for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2611.30963', 'abstract': 'Abstract Foresight Forcing distills geometry-aware spatial transition queries from a frozen 3D foundation model to improve robotic manipulation action prediction without requiring future observations at deployment.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robotic manipulation policies can improve action prediction by anticipating how objects move and how their spatial relationships change. World Action Models (WAMs) learn to predict future visual observations, but their training objectives typically leave the underlying 3D geometric transitions implicit. To alleviate this problem, we introduce Foresight Forcing (F^{2}), a WAM that learns a spatial transition representation from changes in a pretrained 3D feature space. During training, a frozen 3D foundation model extracts patch-wise feature differences from aligned current and future observations that provide dense supervision for geometry-aware feature transitions. We distill these targets into spatial transition queries, which are progressively refined from the current observation, language instruction, and proprioceptive state, and use them alongside current visual features to generate actions. At deployment, the policy predicts the queries without future observations or the 3D teacher. Experiments on LIBERO, LIBERO-Plus, and RoboTwin2.0 demonstrate strong manipulation performance and improved robustness, including 95.01% average success on RoboTwin2.0 Full. On six real-world manipulation tasks, F^{2} achieves a mean task score of 85.8%.', 'score': 1, 'issue_id': 3565, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '18659d6c0b1475c5', 'authors': ['Mishuo Han', 'Zhixuan Liang', 'Zhaoyuan Wan', 'Wendi Chen', 'Jiarui Chen', 'Xinkai Wang', 'Yue Ma', 'Yu Zhou', 'Junting Chen', 'Yao Mu', 'Jun Lv', 'Chuan Wen', 'Cewu Lu'], 'affiliations': ['Fudan University', 'National University of Singapore', 'Noematrix', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'The Hong Kong University of Science and Technology', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2611.30963.jpg', 'data': {'categories': ['#architecture', '#training', '#cv', '#3d', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Робот учится предвидеть пространственные изменения, не заглядывая в будущее', 'desc': 'В статье предлагается метод Foresight Forcing (F²) для роботизированной манипуляции, который улучшает предсказание действий робота. Модель использует замороженную 3D foundation model, чтобы извлекать различия признаков между текущим и будущим наблюдениями и тем самым получать плотную геометрическую supervision. Эти цели дистиллируются в spatial transition queries, которые уточняются по текущему изображению, языковой инструкции и proprioceptive state. На этапе деплоя будущие наблюдения и 3D-учитель не нужны, а политика достигает высокой успешности на LIBERO, LIBERO-Plus и RoboTwin2.0 и на реальных задачах.'}, 'en': {'title': 'Teach robots to anticipate spatial change without seeing the future', 'desc': 'Foresight Forcing (F²) helps robots predict actions by learning how objects and their spatial relationships are likely to change. During training, a frozen 3D foundation model provides geometry-aware supervision from current and future observations. The robot policy distills this information into spatial transition queries, using visual input, language instructions, and the robot’s state to predict them. At deployment, it predicts actions without needing future observations or the 3D model, and experiments show strong results in simulated and real-world tasks.'}, 'zh': {'title': '学会预见空间变化，让机器人更稳地行动', 'desc': '本文提出 Foresight Forcing（F²），一种帮助机器人预测操作动作的世界动作模型。训练时，模型利用冻结的 3D 基础模型，从当前与未来画面中提取空间特征变化，作为几何感知的监督信号。模型将这些信号蒸馏为空间转移查询，并结合当前视觉特征、语言指令和机器人自身状态来生成动作。部署时无需未来画面或 3D 教师模型；实验显示，该方法在多个模拟基准和真实机器人任务中表现良好。'}}}, {'id': 'https://huggingface.co/papers/2611.31442', 'title': 'Small Learned Projections for Semantic-Reversal-Aware Retrieval with Spectral Acceleration: A Four-Domain Empirical Study', 'url': 'https://huggingface.co/papers/2611.31442', 'abstract': 'Abstract  Dense-embedding retrievers can fail adversarially: when a query is answered by a document A and reversed by a near-copy B that differs from A by a small meaning-changing edit (a "trap"), raw cosine over E5-Large-v2 places B in the top-10 for 82-100% of queries at a pool of 5,000. We study two things. First, a small learned projection W: R^1024 -> R^d (d in {11, 32}), trained by a deterministic recipe on a declared set of cases, that suppresses the trap: for the declared cases, HN@10 = 0.0000 (no trap in the top-10) in all twelve (domain, pool-size) settings across four independent domains (legal, medical, patent, financial) and pools up to 100,000, while the correct paraphrase is retained for 93-99% of cases, under exact nearest-neighbour search. Second, a boundary-conditioned accelerator that serves the projection at that scale: an acceleration of spectral graph retrieval (SpectRAG) that replaces a dense eigendecomposition with a boundary-value solve, holding HN@10 = 0.0000 at n = 100,000 in every domain and retrieving the ~300-query suite in 0.6-1.1 s (~2-4 ms per query on average). Because the lens\'s output is the stored representation (a few floats per document), a hardened, specialised index per domain or tenant is ~90x smaller and dimension-proportionally faster than the full embedding, making many small declared indexes a practical alternative to one large vector store. The claim is scoped to the declared cases on the measured pools, with no probabilistic bound; the correct-answer rate drops for a reworded query against an unchanged corpus (about 0.79, trap suppression still holding). A projection transfers only partly to other domains, which we report in full. The recipe, lenses, trap sets and evaluation harness are released under AGPL-3.0; the accelerator\'s implementation is a reserved commercial component, and every HN number is reproducible under exact search.', 'score': 1, 'issue_id': 3565, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': 'e5d0aeec6232bc7e', 'authors': ['Sayed Amir Karim'], 'affiliations': ['Pelloran'], 'pdf_title_img': 'assets/pdf/title_img/2611.31442.jpg', 'data': {'categories': ['#security', '#training', '#benchmark', '#inference', '#rag', '#open_source', '#optimization', '#data'], 'emoji': '🛡️', 'ru': {'title': 'Небольшая проекция закрывает уязвимость поиска к подменённому смыслу', 'desc': 'Авторы показывают, что плотные эмбеддинги (E5-Large-v2) уязвимы к атакам: почти идентичный документ с изменённым смыслом часто попадает в топ-10 выдачи. Они обучают небольшую линейную проекцию W, которая подавляет такие «ловушки» (HN@10 = 0), сохраняя при этом корректные перефразировки в 93–99% случаев. Дополнительно предложен ускоритель SpectRAG, заменяющий спектральную eigendecomposition на граничную задачу и ускоряющий поиск на больших пулах до 100 000 документов. Полученные проекции дают компактные специализированные индексы, примерно в 90 раз меньше исходных эмбеддингов, но перенос на другие домены работает лишь частично.'}, 'en': {'title': 'Shrink the search space, shut out the traps', 'desc': 'The paper studies adversarial “trap” documents: near-copies that change a small detail and can mislead dense-embedding retrievers. A learned low-dimensional projection, called a lens, removes these traps from the top 10 results in the paper’s declared tests while usually retaining the correct paraphrase. The authors also introduce a boundary-conditioned accelerator that speeds up retrieval with the projected representations, while preserving the reported trap suppression. These results apply only to the tested cases and pools, and performance declines on reworded queries or when a projection is transferred to another domain.'}, 'zh': {'title': '低维投影压制检索陷阱，让正确答案更靠前', 'desc': '论文研究密集向量检索中的“陷阱”：只改动文档中的少量文字，就可能让含有错误答案的近似副本排到正确文档之前。作者训练了一个小型线性投影，把原始嵌入映射到更低维空间；在论文声明的测试案例和检索规模内，它能让陷阱副本不进入前十名，同时保留大多数正确释义。作者还提出一种基于边界值求解的 SpectRAG 加速方法，在十万篇文档的测试中维持了相同的陷阱抑制结果，并提升检索速度。研究结论仅适用于声明的案例和测量范围，投影跨领域迁移效果有限，而且面对改写后的查询时正确答案召回率会下降。'}}}, {'id': 'https://huggingface.co/papers/2611.32639', 'title': 'ReFocus: Progress-Guided Adaptive Practice for Long-Horizon Robotic Manipulation Reinforcement Learning', 'url': 'https://huggingface.co/papers/2611.32639', 'abstract': 'Abstract ReFocus alternates global and local reinforcement learning with DAG-based progress rewards and adaptive practice windows to target task bottlenecks, improving long-horizon manipulation success over a π0.5 baseline.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Online reinforcement learning (RL) enables vision-language-action policies to improve through environmental interaction. However, in long-horizon manipulation, sparse success/failure feedback provides little information about where policies encounter bottlenecks. Moreover, repeated full-task rollouts also leave these bottlenecks weakly analyzed and insufficiently practiced. To this end, we introduce ReFocus, a progress-guided multi-round RL framework that alternates between Global and Local RL to identify task-specific bottlenecks and allocate additional practice to them. Specifically, during Global RL, we decompose each task into a Directed Acyclic Graph (DAG) of subtasks. Then a DAG-based Progress Reward is leveraged for both policy training and bottleneck diagnosis. Based on the identified bottlenecks, ReFocus selects Adaptive Practice Windows, defining task segments from an entry stage to a target stage. It allocates additional interaction to these segments during Local RL while updating the entire policy. After that, it evaluates the policy to perform the full task for the next round of RL, forming an iteration between Global and Local RL. Experiments on LIBERO-Long and RoboCasa365 show that ReFocus achieves success rates of 97.8% and 51.3%, respectively, compared with 90.6% and 39.3% for the π_{0.5} baseline. Furthermore, we evaluate a real-world adaptation on three long-horizon tasks. On BreadBaker, ReFocus achieves 95% success, compared with 30% for the π_{0.5}. Project page: https://refocus-robotics.github.io.', 'score': 1, 'issue_id': 3565, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'e6e473ca707791aa', 'authors': ['Haoyuan Li', 'Wei Huang', 'Jiehong Lin', 'Shengrong Zhang', 'Chenzhi Liu', 'Shengchao Zhou', 'Hehe Fan', 'Xiaojuan Qi', 'Yi Yang'], 'affiliations': ['The University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.32639.jpg', 'data': {'categories': ['#training', '#multimodal', '#benchmark', '#reasoning', '#agents', '#optimization', '#robotics', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Тренируй не всё подряд, а то, что мешает: точечное RL-обучение роботов', 'desc': 'В статье представлен ReFocus — многораундовый фреймворк обучения с подкреплением (RL) для vision-language-action моделей, который чередует глобальное и локальное обучение. Задачи декомпозируются в направленный ациклический граф (DAG) подзадач, а DAG-based progress reward используется и для обучения политики, и для диагностики узких мест. На основе выявленных узких мест выбираются adaptive practice windows, на которых дополнительно выделяется взаимодействие со средой. Эксперименты на LIBERO-Long и RoboCasa365 показывают рост успешности по сравнению с базовой моделью π0.5, а также подтверждены результаты в реальном мире.'}, 'en': {'title': 'Find the bottleneck, then practice what matters', 'desc': 'ReFocus improves vision-language-action policies for long, multi-step robot tasks using reinforcement learning. It breaks tasks into subtasks arranged in a directed acyclic graph and uses progress rewards to reveal where the policy struggles. It then gives those difficult task segments extra practice through adaptive windows, while continuing to update the full policy. ReFocus alternates this focused practice with full-task training and achieves higher success rates than the π0.5 baseline in simulated benchmarks and a real-world baking task.'}, 'zh': {'title': '找准任务瓶颈，让机器人练得更有效', 'desc': '这篇论文提出了 ReFocus，一种通过与环境反复交互来训练视觉—语言—动作策略的强化学习框架。它把长任务拆成有向无环图中的多个子任务，并用进度奖励判断策略在哪些环节遇到瓶颈。随后，ReFocus 在全任务训练和局部练习之间交替进行，针对薄弱环节选择练习区间，同时继续更新整体策略。实验显示，它在 LIBERO-Long、RoboCasa365 和真实面包制作任务上的成功率都高于 π0.5 基线。'}}}, {'id': 'https://huggingface.co/papers/2611.31766', 'title': 'RoMo Hands: A Large Scale Richly Organized Text to Hand Motion Dataset', 'url': 'https://huggingface.co/papers/2611.31766', 'abstract': 'Abstract A large-scale text-paired dataset of bimanual hand motion, paired with a 393-D representation and benchmark, enables systematic evaluation of generative models for dexterous motion synthesis.  Generated by deepseek-ai/DeepSeek-V4.1-Flash While text-driven body motion generation has matured, pure-hand synthesis remains bottlenecked by data. Existing datasets often treat hands as rigid end-effectors, lack fine-grained captions, or are too limited in scale to support robust generalization. We introduce RoMo Hands, an in-the-wild, text-paired dataset of ~542K sequences (884 hours, 95.5M frames at 30 fps) which is an order of magnitude larger than prior work. To ensure high-quality supervision, a stringent dexterity filter discards low-articulation sequences, focusing the distribution on complex bimanual movement. Each clip is paired with five captions at increasing granularities from global semantic tags to atomic finger states, organized under a hierarchical taxonomy. To bridge the gap between body and hand architectures, we propose a novel 393-D bimanual representation that adapts redundant body-motion paradigms to the high-DoF kinematics of hands. Systematic benchmarking of diffusion, masked-token, and autoregressive generators reveals distinct trade-offs under these hand-specific adaptations, including a sharp divergence between semantic alignment and kinematic plausibility. Our dataset, representation, and benchmark establish a rigorous foundation for the next generation of dexterous motion synthesis. Project page: https://romodataset.github.io/romo-hands/.', 'score': 1, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '7eb520252a49f838', 'authors': ['Yizhak Ben-Shabat', 'Jiahao Zhang', 'Joseph Liu', 'Seonghyeon Moon', 'Young-Yoon Lee', 'Haomiao Jiang', 'Oren Jacob', 'Mubbasir Kapadia'], 'affiliations': ['Australian National University', 'Roblox', 'Rutgers University'], 'pdf_title_img': 'assets/pdf/title_img/2611.31766.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#open_source', '#multimodal', '#dataset', '#data', '#architecture', '#diffusion', '#synthetic'], 'emoji': '🖐️', 'ru': {'title': 'Большой датасет открывает путь к ловкой генерации движений кистей', 'desc': 'В статье представлен RoMo Hands — крупный датасет текст-движение для двуручных движений кистей, содержащий около 542 тысяч последовательностей (884 часа) с пятью иерархическими описаниями на каждый клип. Авторы вводят 393-мерное представление двуручного движения, адаптированное под высокую степень свободы кистей, и отфильтровывают малоподвижные последовательности с помощью строгого фильтра ловкости. Систематический бенчмарк диффузионных моделей, masked-token и autoregressive генераторов показывает различия в компромиссах между семантическим соответствием текста и кинематической правдоподобностью. Работа закладывает основу для генерации ловких движений кистей, которая до сих пор была ограничена нехваткой данных.'}, 'en': {'title': 'A richer foundation for dexterous hand motion from text', 'desc': 'RoMo Hands is a large dataset for generating hand movements from text, with about 542,000 motion sequences and 884 hours of video. Each sequence has five captions at different levels of detail, and a filtering step prioritizes complex two-hand movements. The paper also introduces a 393-dimensional representation of bimanual hand motion and benchmarks diffusion, masked-token, and autoregressive models. The results show that models can differ in how well their motions match the text and how physically plausible their hand movements are.'}, 'zh': {'title': '以大规模数据与精细表示，推动灵巧双手动作生成', 'desc': '论文提出 RoMo Hands，这是一个大规模的双手动作文本配对数据集，包含约 54.2 万段动作序列。每段动作配有五种不同细致程度的文字描述，并通过灵巧度筛选重点保留复杂的双手动作。研究还设计了 393 维双手动作表示，以刻画手部丰富的关节运动。基准测试比较了扩散模型、掩码令牌模型和自回归模型，发现文字语义匹配与动作在运动学上的合理性之间存在明显差异。'}}}, {'id': 'https://huggingface.co/papers/2611.32100', 'title': 'EEGJev: A System One Decision Model and Benchmark for Multi-Task EEG Question Answering', 'url': 'https://huggingface.co/papers/2611.32100', 'abstract': "Abstract  A single electroencephalographic (EEG) recording can support multiple decoding tasks. Fixed-label tests cannot show how EEG foundation models handle changing questions or options. We introduce EEGJev, a fast decision model that scores candidate answers in one pass. Our benchmark, EEGJev-Bench, covers six question types across 19 public EEG sources. We held the recording and options fixed while switching between questions about attributes paired during training, such as facial expression and the hand participants were asked to use. Across 13 test sources, EEGJev selected a label for the requested attribute with 99.70% accuracy (49.20% under uniform choice). Balanced accuracy for the specific answer was 62.04%. Its 95th-percentile response time was shorter than NeuroLM's on matched validation questions answered individually. EEGJev lets users switch decoding targets by changing the question. With EEGJev-Bench, researchers can test whether new decoders follow the question more reliably, identify the correct answer more often, or both.", 'score': 1, 'issue_id': 3564, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '3b39edfc6f47d96e', 'authors': ['Dengzhe Hou', 'Kazunori D. Yamada'], 'affiliations': ['Tohoku University, Sendai, Japan', 'Unprecedented-scale Data Analytics Center, Tohoku University, Sendai, Japan'], 'pdf_title_img': 'assets/pdf/title_img/2611.32100.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#healthcare', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Один сигнал мозга, много вопросов: декодируем ЭЭГ под любую задачу', 'desc': 'В статье представлена модель EEGJev, которая по одной ЭЭГ-записи отвечает на разные вопросы, выбирая ответ из набора вариантов за один проход. Для оценки создан бенчмарк EEGJev-Bench, охватывающий шесть типов вопросов и 19 публичных EEG-источников. Тестирование показало точность выбора нужного атрибута 99,70% при случайном уровне 49,20%, а сбалансированная точность конкретного ответа составила 62,04%. Модель работает быстрее NeuroLM по 95-му перцентилю времени ответа, а бенчмарк позволяет проверять, насколько точно декодер следует формулировке вопроса и верно ли определяет правильный ответ.'}, 'en': {'title': 'One EEG recording, many questions—decode the answer you ask for', 'desc': 'The paper introduces EEGJev, a fast decision model that scores candidate answers in one pass from an EEG recording. Unlike fixed-label tests, EEGJev-Bench evaluates whether a model can change its decoding target when the question changes, across six question types and 19 public EEG sources. EEGJev chose the requested attribute’s label with 99.70% accuracy, while its balanced accuracy for identifying the specific answer was 62.04%; its 95th-percentile response time was also shorter than NeuroLM’s on matched questions. The benchmark helps researchers assess whether EEG decoders follow questions reliably and select correct answers.'}, 'zh': {'title': '换个问题，解码不同脑电信息', 'desc': '这篇论文提出 EEGJev，一种快速决策模型，可在一次计算中为多个候选答案打分。研究者还构建了 EEGJev-Bench，涵盖 19 个公开 EEG 数据源和六类问题，用来评估模型能否根据问题切换解码目标。实验中，模型在 13 个测试数据源上选中问题所指属性的准确率为 99.70%，具体答案的平衡准确率为 62.04%，响应速度也优于对照方法 NeuroLM。研究表明，用户只需更换问题就能指定解码目标，而该基准有助于检验模型是否真正遵循问题并找出正确答案。'}}}, {'id': 'https://huggingface.co/papers/2611.30564', 'title': 'Seeing Is Locating: Spatial Awareness and Geographic Bias in Decision Language Models', 'url': 'https://huggingface.co/papers/2611.30564', 'abstract': 'Abstract A multimodal benchmark evaluates decision models on spatial awareness and geographic bias across image classification and location rating tasks, revealing reliance on vision and socioeconomic biases, and proposes a training-free location-prior method to improve spatial awareness.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decision models, which output probability distributions over candidate labels instead of generating text, are increasingly used as classifiers and evaluators for inputs associated with real-world locations. However, it remains unclear whether they can leverage spatial context and whether their predictions are geographically biased. We introduce GeoDecisions, a multimodal benchmark for evaluating the spatial awareness and geographic bias of decision models. GeoDecisions comprises two tasks: (1) geo-aware image classification, and (2) location rating on objective and subjective topics. Evaluating six decision models against supervised task-specific models, we find that spatial awareness requires vision: textual coordinates alone provide insufficient context for classifying everyday photos and satellite images. We also find substantial geographic bias. On everyday photos, despite achieving higher accuracy, open-weight decision models exhibit more spatially clustered errors than supervised models. Moreover, across all five subjective topics, every decision model gives lower ratings to locations with lower socioeconomic conditions. Finally, we propose a training-free method that combines decision models with a location prior to improve their spatial awareness without substantially increasing performance bias. Our code is available at https://github.com/cruiseresearchgroup/GeoDecisions.', 'score': 0, 'issue_id': 3566, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '3c0d5283d49203af', 'authors': ['Wilson Wongso', 'Hada Melino Muhammad', 'Xiachong Lin', 'Hao Xue', 'Flora D. Salim'], 'affiliations': ['Hong Kong University of Science and Technology (Guangzhou)', 'University of New South Wales'], 'pdf_title_img': 'assets/pdf/title_img/2611.30564.jpg', 'data': {'categories': ['#cv', '#ethics', '#interpretability', '#benchmark', '#multimodal'], 'emoji': '🌍', 'ru': {'title': 'Модели видят мир, но не всегда честно: учим LLM географии без лишнего обучения', 'desc': 'В статье представлен бенчмарк GeoDecisions для оценки пространственной осведомленности и географических смещений (geographic bias) decision-моделей, которые выдают распределения вероятностей по меткам, а не текст. Бенчмарк включает задачу geo-aware классификации изображений и задачу оценки локаций по объективным и субъективным темам. Результаты показывают, что для пространственного понимания необходимо визуальное восприятие: одних текстовых координат недостаточно, а открытые модели допускают более кластеризованные ошибки и занижают оценки для локаций с низким социально-экономическим уровнем. Авторы также предлагают training-free метод, сочетающий decision-модели с location prior, который улучшает пространственную осведомленность без существенного роста смещений.'}, 'en': {'title': 'Adding Location Context to Models—Without Deepening Geographic Bias', 'desc': 'This paper introduces GeoDecisions, a multimodal benchmark for testing decision models on image classification and location ratings. It finds that spatial awareness depends on visual information, since coordinates alone are not enough for reliable classification. The models also show geographic bias: their errors cluster by location, and they give lower ratings to places with lower socioeconomic conditions. A training-free method that adds a location prior improves spatial awareness without substantially increasing bias.'}, 'zh': {'title': '让决策模型看见地点，也正视地理偏差', 'desc': '本文提出 GeoDecisions，这是一个用于评估决策模型空间认知能力和地理偏差的多模态基准，包含地理信息图像分类和地点评分两项任务。实验发现，仅提供文本坐标不足以帮助模型判断日常照片或卫星图像，空间认知需要视觉信息。模型还表现出明显的地理偏差：开放权重模型的部分图像分类错误更集中于特定地区，而且所有受测模型在五类主观评分任务中，都会给社会经济条件较差的地点更低分。作者提出一种无需训练、结合地点先验的方法，可提升模型的空间认知能力，同时不会显著加剧偏差。'}}}, {'id': 'https://huggingface.co/papers/2611.32393', 'title': 'Fractal Neural Synthesis: Constant-Storage Procedural Weight Derivation via Complex Quadratic Boundary Dynamics', 'url': 'https://huggingface.co/papers/2611.32393', 'abstract': 'Abstract  Conventional neural networks store synaptic parameters as explicit tensors whose persistent Flash footprint scales linearly (O(W)) with parameter count, constraining resource-limited edge microcontrollers. We formulate and systematically evaluate Fractal Neural Synthesis (FNS), a procedural weight derivation architecture that replaces hidden-layer matrices with a constant 24-byte coordinate seed Theta = (c_x, c_y, ell) in F_64^3 anchored near the complex quadratic bifurcation boundary dM of f_c(z) = z^2 + c. We introduce a large-bailout (R = 256) smooth escape kernel, four zero-overhead geometric sampling apertures--Cartesian Grid, coprime 3x3 Rule-of-Thirds (Z/9Z), phi-Vogel spiral, and multi-scale Harmonic Tripod--and prove conditional Kolmogorov (K_Kolm <= 192 + c_0 bits) and Shannon entropy bounds. Across magnifications zeta in [10^0, 10^8], C^1 Fourier and lattice-noise bases collapse to post-standardization rank ~2.25 and SHA-256 PRNG exhibits avalanche discontinuity (rho ~ 0.019, 50.6% micro-step retention), whereas dM uniquely sustains both rank (~10.0) and local continuity (rho in [0.81, 0.97], 89.2% retention). Under leak-free 10-fold CV across four zero-scaler-byte non-linear benchmarks, FNS with an INT8 readout surpasses 0-hidden Linear-INT8 by +3.6 to +10.8 pp while delivering 10.7x-129x total Flash reduction (725x-2,773x hidden reduction) relative to converged Float32 MLPs (90.30% Ionosphere in 285 B; 97.22% Optical Digits in 2,598 B; 97.90% PenDigits in 2,598 B; 87.00% Satimage in 1,570 B).', 'score': 0, 'issue_id': 3566, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '41f540ec016ebf7d', 'authors': ['Volkan Dagli', 'Zerrin Dagli', 'Daghan Dagli'], 'affiliations': ['Anadolu University, Eskişehir, Türkiye', 'ITouch Systems, Cukurova University Technopark, Adana, Türkiye', 'Mersin University, Mersin, Türkiye', 'Toros Science High School, MEV (Toros University), Mersin, Türkiye', 'Yusuf Kalkavan Anatolian High School, Ministry of National Education, Mersin, Türkiye'], 'pdf_title_img': 'assets/pdf/title_img/2611.32393.jpg', 'data': {'categories': ['#inference', '#architecture', '#optimization'], 'emoji': '🌀', 'ru': {'title': 'Вся нейросеть помещается в 24 байта: веса рождаются из фрактала', 'desc': 'Статья предлагает Fractal Neural Synthesis (FNS) — архитектуру, которая не хранит веса скрытых слоев как явные тензоры, а вычисляет их процедурно из константного 24-байтового зерна (координаты в окрестности границы бифуркации множества Мандельброта). Авторы вводят гладкое ядро выхода за пределы с большим радиусом и четыре геометрических схемы выборки, а также выводят границы колмогоровской и шенноновской сложности. На нелинейных бенчмарках с 10-кратной кросс-валидацией без утечки данных FNS с INT8-выходом превосходит линейную INT8-модель без скрытых слоев на 3,6–10,8 п.п. при сокращении Flash-памяти в 10,7–129 раз относительно Float32 MLP, что делает его пригодным для микроконтроллеров с ограниченными ресурсами.'}, 'en': {'title': 'Generate neural weights from a tiny fractal seed', 'desc': 'The paper proposes Fractal Neural Synthesis (FNS), which generates hidden-layer weights from a tiny coordinate seed instead of storing large weight matrices. It samples the boundary of a complex fractal using several geometric patterns and finds that the resulting weights retain useful variation and change smoothly as the sampling coordinates shift. In four benchmark tasks, an INT8 output layer using FNS outperforms a linear model without hidden units by 3.6 to 10.8 percentage points. Compared with Float32 multilayer perceptrons, FNS reduces total Flash storage by 10.7 to 129 times while achieving strong accuracy on resource-limited devices.'}, 'zh': {'title': '以分形种子生成权重，让边缘神经网络更省存储', 'desc': '这篇论文提出分形神经合成（FNS），用一个仅含24字节坐标种子的程序化方法生成隐藏层权重，从而减少微控制器上的Flash存储需求。该方法在复二次映射的分岔边界附近采样，并比较了四种几何采样方式；实验发现，这种边界既能保留较丰富的特征秩，也能维持局部连续性。使用INT8读出层和无数据泄漏的十折交叉验证时，FNS在四个非线性基准任务上的准确率比无隐藏层的线性模型高3.6至10.8个百分点。与收敛的Float32多层感知机相比，FNS将总Flash占用降低约10.7至129倍，同时取得了具有竞争力的分类准确率。'}}}, {'id': 'https://huggingface.co/papers/2611.25946', 'title': 'Point Dynamics as Proxy for Robotic World Models', 'url': 'https://huggingface.co/papers/2611.25946', 'abstract': "Abstract Separating dynamics prediction from visual rendering using 3D point dynamics as an intermediate representation improves object motion accuracy in robotic video world models without sacrificing image quality.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Robotic world models predict future video frames from the current observation and a sequence of robot actions. While recent models follow the given actions closely, manipulated objects often collapse or move inconsistently with the action. We attribute this to the conditioning: an action, or a rendering of the robot, specifies where the robot goes but not how the scene responds, leaving a single video model to infer the interaction dynamics implicitly while also rendering appearance. We therefore separate dynamics prediction from visual rendering, with 3D point dynamics as the proxy between them. Specifically, we lift the first frame into 3D points, simulate how they respond to the robot's motion with a learned point dynamics model, and render the simulated points back into pixel-aligned videos that any video model can read. In controlled experiments on the DROID dataset with two video renderers of different architectures, this point dynamics proxy reduces object motion error by 8.6% and 6.2% without degrading image quality, and by 8.1% on a real bimanual robot. Moreover, the video follows the simulation: more accurate dynamics yield more accurate object motion, and editing the points steers the video. This suggests that advances in dynamics modeling can translate into more faithful robotic world models.", 'score': 0, 'issue_id': 3566, 'pub_date': '2026-11-19', 'pub_date_card': {'ru': '19 ноября', 'en': 'November 19', 'zh': '11月19日'}, 'hash': 'c0ecbd028a394c6a', 'authors': ['Dong An', 'Tianyu Liu', 'Haoran Ding', 'Wen Yang', 'Anqing Duan', 'Zhengzhong Liu', 'Eric P. Xing', 'Guangyi Liu'], 'affiliations': ['Institute of Foundation Models', 'Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2611.25946.jpg', 'data': {'categories': ['#3d', '#optimization', '#robotics', '#video', '#graphs', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Сначала физика движения, потом картинка: точное предсказание поведения роботов', 'desc': 'Авторы предлагают разделить задачи в роботизированных world model: предсказание динамики сцены и визуальный рендеринг кадров. В качестве промежуточного представления используются 3D point dynamics, то есть облако точек, которое поднимается из первого кадра и симулируется обученной моделью динамики под действия робота. Затем точки проецируются обратно в пиксельно-выровненное видео, которое читает любая video model, включая LLM-подобные и diffusion-архитектуры. Эксперименты на датасете DROID и на реальном бимануальном роботе показали снижение ошибки движения объектов на 6–8%, без ухудшения качества изображения.'}, 'en': {'title': 'Predict motion in 3D, then render the video', 'desc': 'The paper improves robotic world models, which predict future video from observations and robot actions. It separates object-motion prediction from image generation by lifting the first frame into 3D points and using a learned model to predict how those points move. A video renderer then turns the simulated points into frames, helping objects move more consistently with the robot’s actions. Experiments on the DROID dataset and a real robot show lower object-motion error without reducing image quality, and editing the points can steer the generated video.'}, 'zh': {'title': '先预测三维动力学，再生成更可信的机器人视频', 'desc': '机器人世界模型根据当前画面和机器人动作预测未来视频，但物体有时会出现运动不一致或形状崩坏的问题。本文将物体动力学预测与图像渲染分开，并用三维点的运动作为两者之间的中间表示。模型先把首帧转换为三维点，再预测这些点如何响应机器人的动作，最后将点渲染成视频。实验表明，这种方法降低了物体运动误差，且不损害画面质量；编辑三维点也能引导生成视频中的物体运动。'}}}, {'id': 'https://huggingface.co/papers/2611.27404', 'title': 'Degradation of Language Models under Controlled Load: Synchronization, Rule Execution and Misfires on the Background', 'url': 'https://huggingface.co/papers/2611.27404', 'abstract': "Abstract A method separates a language model's quality decline under controlled load into synchronization, rule execution, and misfires, then derives load-dependent laws that characterize each model.  Generated by deepseek-ai/DeepSeek-V4.1-Flash As the load grows, a language model makes more and more errors, but different processes stand behind this decline in quality. The model may lose the correspondence with the source text, it may keep its place in the text but execute a rule wrongly, or it may change a word that no rule concerns. In this work the degradation of a model under controlled load is separated into these three components: synchronization, rule execution and misfires. The load is set by rules that replace one word with another in a meaningless text, and each kind of load (the text length, the position of a word in the answer, the replacement density, the number of rules and the place of a rule in the list) is set separately. The alignment of the answer with the reference makes it possible to follow the outcome of every word, and a statistical model that takes into account that the spread of difficulty between requests itself depends on the load restores, for each component, the laws of its dependence on every kind of load. These laws make up the passport of a model. The paper presents the method of the separation, the principles of constructing the laws and the passports of seven models built by this method; the separation opens the way to studying the fine structure of the behavior of a neural network.", 'score': 0, 'issue_id': 3566, 'pub_date': '2026-11-20', 'pub_date_card': {'ru': '20 ноября', 'en': 'November 20', 'zh': '11月20日'}, 'hash': 'cc3143e9263628ec', 'authors': ['Hennadii Kutomanov'], 'affiliations': ['Independent researcher'], 'pdf_title_img': 'assets/pdf/title_img/2611.27404.jpg', 'data': {'categories': ['#benchmark', '#interpretability'], 'emoji': '🔬', 'ru': {'title': 'Разложи деградацию модели по полочкам: от синхронизации до случайных ошибок', 'desc': 'В статье предлагается метод, который разделяет деградацию языковой модели (LLM) под контролируемой нагрузкой на три компоненты: синхронизацию, выполнение правил и случайные ошибки (misfires). Нагрузка задаётся правилами замены слов в бессмысленном тексте, а каждый вид нагрузки (длина текста, позиция слова, плотность замен, число правил) варьируется отдельно. Выравнивание ответа с эталоном позволяет отслеживать судьбу каждого слова, а статистическая модель с учётом разброса сложности запросов восстанавливает зависимость каждой компоненты от нагрузки. Полученные законы формируют «паспорт» модели, и метод открывает путь к изучению тонкой структуры поведения нейронной сети.'}, 'en': {'title': 'A behavioral passport for every model', 'desc': 'The paper studies how language models become less accurate as task load increases. It separates errors into three types: synchronization errors, rule-execution errors, and misfires on words that should not change. Using controlled word-replacement tasks, it varies factors such as text length, rule count, and replacement density, then models how each error type changes with load. The resulting set of load-dependent patterns forms a behavioral “passport” for each model.'}, 'zh': {'title': '拆解负载下的错误，绘制语言模型行为画像', 'desc': '论文提出一种方法，用来分析语言模型在受控负载增加时性能下降的原因。它将错误分为三类：同步错误（输出与原文错位）、规则执行错误（位置对应但替换规则执行错误）和误改（修改了规则未涉及的词）。研究通过控制文本长度、词语位置、替换密度、规则数量及规则顺序等因素，并对齐模型输出与参考文本，追踪每个词的结果。随后，统计模型考虑不同请求难度的波动会随负载变化这一点，为各类错误建立负载依赖规律，并据此形成模型的行为“画像”。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
