r consistently, whereas those arising from model scale alone transfer weakly or not at all. Second, the expert and reference serve complementary roles: the expert provides the capability to be transferred, while the reference filters out shared behavior and isolates the relevant residual. Third, even a useful difference does not transfer to every target: success requires the induced update to move the target toward the expert and generalize beyond sampled rollouts. Raw policy distance does not predict transferability, whereas an appropriate reference can rescue otherwise unsuccessful transfer. These results characterize when relative policy differences provide effective supervision for OPD.", 'score': 10, 'issue_id': 3399, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '83266a6d9b775d7d', 'authors': ['Rong Wu', 'Daocheng Fu', 'Yu Yang', 'Xuemeng Yang', 'Siqi Li', 'Shu Zou', 'Yao Zhu', 'Botian Shi', 'Bo Zhang', 'Cong Zhang', 'Pinlong Cai', 'Jianbiao Mei'], 'affiliations': ['Fudan University', 'Renmin University of China', 'Shanghai Artificial Intelligence Laboratory', 'The Australian National University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.13205.jpg', 'data': {'categories': ['#optimization', '#rlhf', '#training', '#transfer_learning'], 'emoji': '🎓', 'ru': {'title': 'Относительные различия политик: когда они учат лучше, чем абсолютные способности', 'desc': 'В работе исследуется дистилляция политик на собственных траекториях (on-policy distillation), которая обучает целевую политику на основе разницы логарифмических вероятностей между экспертной и опорной политикой, определяя неявное вознаграждение для оптимизации с KL-регуляризацией. Авторы показывают, что более сильный эксперт не всегда обеспечивает лучший сигнал для обучения: разницы от задачно-специфичного обучения (включая reinforcement learning и supervised fine-tuning) передаются последовательно, а разницы от масштаба модели передаются слабо. Исследование демонстрирует, что эксперт и опорная политика играют дополняющие роли: первый предоставляет способность для передачи, второй фильтрует общее поведение и выделяет релевантную разницу. Успешная передача требует, чтобы вызванное обновление двигало целевую политику к эксперту и обобщалось за пределы собранных траекторий.'}, 'en': {'title': 'Harnessing Policy Differences for Effective On-Policy Distillation', 'desc': "This paper discusses On-policy Distillation (OPD), a method that trains a target policy using guidance from a more capable teacher policy. It introduces a new approach that focuses on the differences between an expert policy and a reference policy, rather than relying solely on the expert's performance. The authors find that not all differences are beneficial for training; task-specific differences are more effective than those based on model size. Their experiments reveal that the expert and reference policies play distinct roles in the training process, and the right reference can enhance the transfer of knowledge to the target policy."}, 'zh': {'title': '相对策略差异提供有效监督', 'desc': '本文提出了一种新的方法，称为在线策略蒸馏（OPD），用于在强化学习中训练目标策略。该方法通过从更强的教师策略中获取令牌级别的监督，来优化目标策略的表现。研究表明，专家策略和参考策略之间的相对差异可以提供有效的监督，而不仅仅依赖于专家的绝对分布。通过系统实验，发现任务特定的训练差异更有助于转移学习，而模型规模的差异则转移效果较弱。'}}}, {'id': 'https://huggingface.co/papers/2610.09633', 'title': "Coding-Agent Benchmarks Should Match Their Users' Task Flows", 'url': 'https://huggingface.co/papers/2610.09633', 'abstract': "Abstract  The evaluation of coding agents generally strives to be as realistic as possible. In our study, we collect 4,782 agent sessions of real software engineers in JetBrains IDEs, which we call Production Sessions. Since our subject is interactive agents, we study the sessions with at least three user messages (33% of the sample). These long sessions differ from issue-derived benchmark tasks in two ways: (i) user requests span a far wider mix of task types - questions about the project's code, planning, review, refactoring, execution - and (ii) users switch between types throughout a session. Long-session samples from three public interaction corpora exhibit markedly different Task Flows (the distributions of session lengths, task types, and type-to-type transitions), so no single interaction distribution is universally realistic: benchmarks should name a target use case and calibrate to measurements from it. We present SWE-TaskFlow, an approach for transforming any issue-derived benchmark: it preserves the verified tasks and tests while steering the interaction toward a target Task Flow through prompt splitting and verifiable repository QA, with a TaskFlow Alignment Score (TFAS) for selecting among generated trajectories. In a pilot on 700 SWE-Bench Pro tasks, solving the task sequentially in several steps approximately doubles agent cost without a stable change in resolve rate: the interaction protocol itself is an important dimension of evaluation.", 'score': 9, 'issue_id': 3401, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '295b1859ecf33f78', 'authors': ['Igor Slinko', 'Yaroslav Golubev', 'Sergey Titov'], 'affiliations': ['JetBrains Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.09633.jpg', 'data': {'categories': ['#plp', '#agents', '#benchmark', '#dataset'], 'emoji': '⚙️', 'ru': {'title': 'Протокол взаимодействия важнее самой задачи', 'desc': 'Исследование оценивает агентов программирования на реальных сессиях инженеров из IDE JetBrains, которые существенно отличаются от синтетических бенчмарков. Авторы показывают, что распределение типов задач и переходов между ними (Task Flow) сильно зависит от контекста использования, и универсального реалистичного распределения не существует. Предложен метод SWE-TaskFlow для трансформации традиционных бенчмарков с сохранением проверенных тестов, но с адаптацией взаимодействия к целевому Task Flow через разбиение промптов и верификацию. Результаты показывают, что протокол взаимодействия агента является критически важным фактором оценки, влияющим на стоимость и производительность решения задач.'}, 'en': {'title': 'Realistic Evaluation of Coding Agents with SWE-TaskFlow', 'desc': 'This paper discusses the evaluation of coding agents by analyzing real software engineering sessions, termed Production Sessions, collected from JetBrains IDEs. The study highlights that these sessions involve diverse task types and user interactions, which differ significantly from traditional benchmark tasks. The authors introduce SWE-TaskFlow, a method to adapt existing benchmarks to better reflect realistic user interactions by focusing on specific task flows. They also emphasize that the way tasks are structured and executed in these sessions can greatly impact the performance and evaluation of coding agents.'}, 'zh': {'title': '真实交互的任务流评估', 'desc': '本研究收集了4782个真实软件工程师在JetBrains IDE中的代理会话，称为生产会话。我们分析了至少包含三个用户消息的长会话，这些会话的任务类型多样，包括代码问题、规划、审查、重构和执行。长会话的任务流与传统基准任务显著不同，因此没有单一的交互分布可以被视为普遍真实。我们提出了SWE-TaskFlow方法，通过提示拆分和可验证的代码库质量保证，调整交互以符合目标任务流，并引入任务流对齐评分（TFAS）来选择生成的轨迹。'}}}, {'id': 'https://huggingface.co/papers/2610.13118', 'title': 'The value of information and the emergence of communication in evolved e-puck robots', 'url': 'https://huggingface.co/papers/2610.13118', 'abstract': 'Abstract  We study when communication emerges between autonomous agents and what role an innate action selection architecture plays. Two e-puck robots, reconstructed in PyBullet from their Webots model and validated against it, must find a feeding zone that can only be detected when a robot passes over it. Each robot can emit a one-bit signal whose direction is detected by the receiver. Control is provided by a GRU recurrent network with a residual path, either operating alone or as a channel within an Embedded Action Selection Architecture (EASA). Fitness measures only the time the robots spend over the food. When the robots receive a compass pointing to the food, use of the signal disappears completely. Without a compass, in a small arena, three independent runs achieved similar performance using different strategies: a referential signal, a permanent beacon, or no use of the signal. As the arena expands, the strategy based on a referential signal generalizes best. In contrast, evolving directly in the large arena does not increase the frequency of communication, but it does separate the strategies, and the referential signal clearly outperforms solitary searching. Within EASA, innate reflexes constrain the network and reduce performance. As its priorities evolve, evolution consistently weakens those reflexes. The results suggest that communication emerges in proportion to the value of the information it transmits, and that an innate scaffolding designed for isolated agents can be an impediment in a social task.', 'score': 9, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '7de7a8148fe2e88a', 'authors': ['Fernando Montes-Gonzalez'], 'affiliations': ['Instituto de Investigaciones en Inteligencia Artificial, Universidad Veracruzana, Mexico'], 'pdf_title_img': 'assets/pdf/title_img/2610.13118.jpg', 'data': {'categories': ['#robotics', '#rl', '#agents', '#games', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Коммуникация между агентами возникает только когда информация имеет реальную ценность', 'desc': 'В этой работе исследуется возникновение коммуникации между автономными робот-агентами и влияние врождённой архитектуры выбора действий. Два робота e-puck, моделируемые в PyBullet, должны найти зону питания, используя простые односторонние сигналы и управление через recurrent neural network (GRU) с residual connection. Авторы обнаруживают, что коммуникация возникает пропорционально информационной ценности сигналов, причём сигналы типа referential signal работают лучше всего в больших пространствах. Исследование показывает, что врождённые рефлексы в архитектуре EASA могут препятствовать решению коллективных задач, и эволюция систематически их ослабляет.'}, 'en': {'title': 'Communication Emerges from Valuable Information in Autonomous Agents', 'desc': 'This paper investigates how communication develops between autonomous robots and the impact of their built-in action selection systems. The study uses two e-puck robots that must locate a feeding zone, utilizing a one-bit signaling system to share information. A GRU recurrent network controls the robots, and the effectiveness of communication strategies is tested in varying arena sizes. The findings indicate that communication is more effective when the information is valuable, and that innate reflexes can hinder performance in collaborative tasks.'}, 'zh': {'title': '通信的价值与内在架构的影响', 'desc': '本研究探讨了自主代理之间何时会出现通信，以及内在动作选择架构的作用。我们使用两个e-puck机器人在PyBullet中重建并验证其Webots模型，机器人需要找到一个只能通过经过其上方时才能检测到的喂食区。每个机器人可以发出一个方向可被接收者检测到的一位信号。研究结果表明，通信的出现与所传递信息的价值成正比，而为孤立代理设计的内在支架在社交任务中可能会成为障碍。'}}}, {'id': 'https://huggingface.co/papers/2609.36760', 'title': 'QuantMLA: Function-Aligned Dual-Path Quantization for Low-Bit MLA KV Caching', 'url': 'https://huggingface.co/papers/2609.36760', 'abstract': "Abstract  Multi-Head Latent Attention (MLA) enables expressive multi-head attention with compact caches for its content and decoupled RoPE paths, yet cache memory still scales linearly with context length and batch size. In this work, we establish a systematic model of MLA's dual-path quantization errors, characterizing their distinct effects on attention-output distortion and explaining the pronounced amplification of RoPE-path errors. Guided by this analysis, we introduce QuantMLA, a function-aligned framework for low-bit dual-path quantization. We derive path-specific transformation spaces that preserve full-precision computation while remaining fully fusible into model parameters offline, eliminating online transformation overhead. Within these spaces, QuantMLA learns path-specific transformations with function-aligned objectives: attention-output reconstruction captures the content path's coupled matching and aggregation errors, while positional QK reconstruction preserves the RoPE-induced component of the attention logits and admits a theoretical bound on output distortion. Across four MLA model families, QuantMLA enables, to our knowledge, the first reported joint INT4 caching of the content and RoPE caches with minimal accuracy degradation. Further compressing the content cache to INT2 while retaining the RoPE key cache at INT4 maintains competitive performance on challenging reasoning and code benchmarks. We develop a native low-bit MLA attention kernel that integrates unpacking and dequantization directly into attention computation. The physical cache layout provides 3.59x compression at 128K context, while a cache-pressure serving workload achieves 5.168x higher whole-job output throughput than BF16. The code will be released upon acceptance.", 'score': 5, 'issue_id': 3401, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'c65638ed8589d34b', 'authors': ['Zunhai Su', 'Yuxuan Sun', 'Jianchao Tan', 'Tao Zhang', 'Ruihan Hu', 'Yuchen Xie', 'Xunliang Cai', 'Ngai Wong'], 'affiliations': ['Harbin Institute of Technology', 'Meituan LongCat Team', 'South China University of Technology', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2609.36760.jpg', 'data': {'categories': ['#long_context', '#open_source', '#optimization'], 'emoji': '⚙️', 'ru': {'title': 'Эффективная низкобитная квантизация внимания без потери качества', 'desc': 'В работе предложен метод QuantMLA для низкобитной квантизации Multi-Head Latent Attention, который позволяет сжать кэш память без значительной потери качества. Авторы разработали теоретическую модель ошибок квантизации для двух путей внимания (content path и RoPE path), объясняя их влияние на искажение выходов. На основе этого анализа введены пути трансформации с сохранением точности полноразрядных вычислений, которые полностью интегрируются в параметры модели. Метод демонстрирует впечатляющие результаты: совместная INT4 квантизация обоих кэшей с минимальной деградацией качества и сжатие памяти в 3.59x при контексте длины 128K.'}, 'en': {'title': 'Efficient Attention with QuantMLA: Compressing Memory, Preserving Performance', 'desc': 'This paper introduces QuantMLA, a new framework that improves the efficiency of Multi-Head Latent Attention (MLA) by addressing the quantization errors in its dual-path system. It focuses on reducing the memory requirements for attention caches while maintaining high performance in tasks like reasoning and code processing. The authors propose a method to learn transformations that align with the function of the attention mechanism, ensuring minimal loss in output quality. By achieving significant compression in cache sizes, QuantMLA allows for faster computations without sacrificing accuracy.'}, 'zh': {'title': '低比特量化的高效多头注意力', 'desc': '本文提出了一种多头潜在注意力（MLA）模型，旨在通过紧凑的缓存和解耦的RoPE路径来实现高效的多头注意力。我们分析了MLA的双路径量化误差，揭示了其对注意力输出失真产生的不同影响，并提出了QuantMLA框架以实现低比特双路径量化。QuantMLA通过学习路径特定的变换，能够在保持全精度计算的同时，消除在线变换的开销。实验结果表明，QuantMLA在多个MLA模型中实现了内容和RoPE缓存的联合INT4缓存，且在准确性上几乎没有下降。'}}}, {'id': 'https://huggingface.co/papers/2610.07207', 'title': 'Distributionally Robust Mixture-of-Experts Training', 'url': 'https://huggingface.co/papers/2610.07207', 'abstract': 'Abstract  Mixture-of-Experts (MoE) transformers scale capacity by activating only a few experts per token, but this sparsity creates a hidden reliability problem: when routing is imperfect, load-balanced models may send tokens to experts that are insufficiently trained for the assigned inputs. We propose Distributionally Robust MoE Training (DRMoET), a drop-in objective that treats layer-wise experts as endogenous robustness groups and optimizes high-loss routing outcomes rather than merely equalizing traffic. DRMoET updates a per-layer expert distribution by an entropy-regularized softmax rule on EMA-smoothed, activation-weighted expert losses, strengthening plausible non-top routing paths while preserving standard MoE computation. Under the FLAME-MoE recipe at 746M-total and 10.3B-total scales, DRMoET improves downstream averages over both standard FLAME-MoE and auxiliary-loss-free balancing. At 10.3B total parameters and 67B training tokens, DRMoET improves the seven-task average from 0.6625 to 0.6767, while the auxiliary-loss-free baseline achieves 0.6431. Mechanistic analyses show lower expert-loss variance with nearly unchanged mean loss, 4.3% lower excess loss under forced mid-k misrouting, and improved domain-expert specialization. These results position routing robustness-not only utilization balance-as a practical objective for reliable sparse MoE scaling. Project page and code are available at: https://drmoet.github.io/.', 'score': 4, 'issue_id': 3401, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'd5586125888a31e4', 'authors': ['Xin Teng', 'Muxiao Li', 'Hongyi Wen'], 'affiliations': ['NYU Shanghai', 'New York University Center for Data Science'], 'pdf_title_img': 'assets/pdf/title_img/2610.07207.jpg', 'data': {'categories': ['#training', '#architecture'], 'emoji': '🎯', 'ru': {'title': 'Надёжная маршрутизация важнее баланса: робастность разреженных MoE-моделей', 'desc': 'В работе предложен новый метод обучения для трансформеров с архитектурой Mixture-of-Experts (MoE), которые масштабируют производительность, активируя только несколько экспертов на каждый токен. Авторы выявили проблему надёжности: при несовершенной маршрутизации токены могут отправляться экспертам, которые недостаточно обучены для данных входов. Решение - Distributionally Robust MoE Training (DRMoET) - рассматривает экспертов как группы робастности и оптимизирует маршруты с высокими потерями вместо простой балансировки нагрузки. Механизм использует энтропийную регуляризацию и скользящее среднее потерь экспертов, что приводит к улучшению характеристик модели на 2% при сохранении стандартной вычислительной эффективности MoE.'}, 'en': {'title': 'Enhancing Reliability in Mixture-of-Experts with DRMoET', 'desc': 'This paper introduces Distributionally Robust MoE Training (DRMoET), a new method for improving the reliability of Mixture-of-Experts (MoE) transformers. The approach focuses on optimizing the routing of tokens to experts, ensuring that even when routing is imperfect, the selected experts are well-suited for the tasks. By using an entropy-regularized softmax rule, DRMoET enhances the performance of the model by reducing expert-loss variance and improving domain specialization. The results show significant improvements in task performance, highlighting the importance of routing robustness in sparse MoE architectures.'}, 'zh': {'title': '提升混合专家模型的路由鲁棒性', 'desc': '混合专家（MoE）变换器通过每个令牌激活少数专家来扩展容量，但这种稀疏性带来了隐含的可靠性问题：当路由不完美时，负载平衡模型可能会将令牌发送到对分配输入训练不足的专家。我们提出了分布鲁棒MoE训练（DRMoET），这是一种目标函数，视层级专家为内生的鲁棒性组，优化高损失路由结果，而不仅仅是平衡流量。DRMoET通过对EMA平滑的、激活加权的专家损失应用熵正则化的softmax规则，更新每层专家分布，从而增强合理的非顶级路由路径，同时保留标准的MoE计算。在746M和10.3B总规模下，DRMoET在下游任务的平均表现上优于标准FLAME-MoE和无辅助损失的平衡。'}}}, {'id': 'https://huggingface.co/papers/2610.10893', 'title': 'Less from More: Reinforcing Sparse Video Reasoning from Dense References', 'url': 'https://huggingface.co/papers/2610.10893', 'abstract': 'Abstract  Video-language models commonly assume that more temporal observations lead to more reliable reasoning. We question this assumption and argue that the key challenge is not merely processing more video frames efficiently, but learning to reason reliably under limited temporal evidence. We propose SAVER, a dense-to-sparse post-training framework that uses dense video views as training-time references for sparse-frame inference. During reinforcement post-training, paired dense and sparse views are optimized with grounding rewards and a reliability-gated reference reward, encouraging sparse view predictions to preserve task-relevant temporal evidence. Notably, SAVER is trained only on 1,250 randomly sampled temporal grounding examples, without using any video question answering annotations. Across three temporal grounding benchmarks and six video question-answering benchmarks, SAVER consistently improves performance across frame budgets. In particular, SAVER can match or surpass dense-frame Qwen3.5 baselines while using substantially fewer frames. These results show that temporal grounding can serve as an effective evidence-localization proxy for learning sparse video reasoning that transfers to broader video understanding tasks.', 'score': 4, 'issue_id': 3400, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '621f884afe73940c', 'authors': ['Wenfang Sun', 'Yingjun Du', 'Cees G. M. Snoek'], 'affiliations': ['University of Amsterdam'], 'pdf_title_img': 'assets/pdf/title_img/2610.10893.jpg', 'data': {'categories': ['#benchmark', '#rl', '#multimodal', '#video'], 'emoji': '🎬', 'ru': {'title': 'Обучение разреженному видеорассуждению через локализацию временных доказательств', 'desc': 'Авторы предлагают SAVER — фреймворк пост-обучения видеоязыковых моделей, который учит модели эффективно рассуждать на основе разреженных видеокадров вместо плотных наблюдений. Метод использует плотные видеопоследовательности как справочные материалы во время обучения с подкреплением, оптимизируя парные представления через награды за локализацию и надежность предсказаний. Ключевая инновация заключается в использовании временной локализации в качестве прокси для выявления релевантных кадров, что позволяет модели сосредоточиться на наиболее информативных частях видео. Экспериментальные результаты показывают, что SAVER достигает производительности плотных моделей, используя значительно меньше кадров, и без специальных аннотаций для обучения на задачах понимания видео.'}, 'en': {'title': 'SAVER: Efficient Sparse Video Reasoning with Dense References', 'desc': 'This paper challenges the common belief that more video frames lead to better reasoning in video-language models. It introduces SAVER, a framework that focuses on learning to make reliable predictions with fewer video frames by using dense video views as references during training. SAVER employs a reinforcement post-training approach that optimizes predictions based on rewards for maintaining relevant temporal information. The results demonstrate that SAVER can achieve or exceed the performance of models using more frames, highlighting the effectiveness of sparse video reasoning for broader understanding tasks.'}, 'zh': {'title': '稀疏推理，精准定位时间证据', 'desc': '本论文质疑了视频语言模型中关于更多时间观察能带来更可靠推理的假设。我们提出了SAVER框架，它通过稠密视频视图作为稀疏帧推理的训练参考，解决在有限时间证据下的可靠推理问题。SAVER在强化后训练过程中，优化稠密和稀疏视图，鼓励稀疏视图预测保留与任务相关的时间证据。实验结果表明，SAVER在多个基准测试中表现优异，能够在使用更少帧的情况下，匹配或超越稠密帧的基线表现。'}}}, {'id': 'https://huggingface.co/papers/2610.13316', 'title': 'ThinkDrag: Semantic Drag-Based Image Editing with Visual Reasoning', 'url': 'https://huggingface.co/papers/2610.13316', 'abstract': 'Abstract  Drag-based image editing provides an intuitive interface for spatially controlled image manipulation by allowing users to specify handle and target points. Existing methods have made substantial progress through optimization-based, one-step, and feed-forward formulations, but they often interpret drag instructions as geometric displacements. This limits their effectiveness when the desired edit depends on interpreting image content and inferring a plausible semantic transformation from sparse point constraints. We introduce ThinkDrag, a unified multimodal framework for drag-based image editing with visual reasoning. ThinkDrag is trained to associate point constraints with meaningful object- and scene-level transformations, and can optionally produce an explicit reasoning trace that interprets the intended edit before image generation. This reasoning trace improves interpretability, particularly for ambiguous drags. Drag Endpoint Markers, motivated by an analysis of cross-image attention, provide an explicit correspondence signal that grounds each drag in image space. To support this framework, we construct a supervised dataset of semantic drag transformations paired with reasoning traces and introduce DragBench++, a benchmark targeting challenging drag-based editing scenarios with reference edit solutions. Experiments show that ThinkDrag achieves state-of-the-art performance, improving generation quality and plausibility while maintaining competitive point-following precision.', 'score': 4, 'issue_id': 3400, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'e953b7a480240459', 'authors': ['Armando Fortes', 'Tianyi Wei', 'Chindanai Trakantannarong', 'Shangchen Zhou', 'Xingang Pan'], 'affiliations': ['S-Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.13316.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#cv', '#multimodal'], 'emoji': '✨', 'ru': {'title': 'Редактирование через понимание: добавляем рассуждения в перетаскивание', 'desc': 'ThinkDrag — это мультимодальная система для редактирования изображений путём перетаскивания, которая интерпретирует действия пользователя не просто как геометрические смещения, а как осмысленные семантические трансформации объектов и сцен. Модель обучается связывать точечные ограничения с высокоуровневыми преобразованиями и может генерировать явный рассуждающий след, объясняющий намерения пользователя перед генерацией результата. Авторы предлагают механизм Drag Endpoint Markers для явного установления соответствия между перетаскиваниями и позициями в изображении, а также создают новый размеченный датасет и бенчмарк DragBench++ для оценки сложных сценариев редактирования. Экспериментальные результаты демонстрируют, что ThinkDrag достигает лучших показателей качества и правдоподобности результатов при сохранении высокой точности следования указаниям.'}, 'en': {'title': 'ThinkDrag: Intuitive Image Editing with Visual Reasoning', 'desc': 'The paper presents ThinkDrag, a new framework for drag-based image editing that enhances user interaction by interpreting drag actions with visual reasoning. Unlike previous methods that treated drags as simple geometric movements, ThinkDrag understands the semantic meaning behind the edits, allowing for more complex and context-aware transformations. It includes a reasoning trace feature that clarifies the intended edits, improving the interpretability of the results, especially in ambiguous situations. The framework is supported by a new dataset and benchmark, DragBench++, which helps evaluate its performance in challenging editing tasks, demonstrating superior quality and plausibility in generated images.'}, 'zh': {'title': 'ThinkDrag：智能拖拽式图像编辑的新方法', 'desc': '本论文介绍了一种名为ThinkDrag的拖拽式图像编辑框架，旨在通过视觉推理来提升图像编辑的直观性和有效性。与传统方法不同，ThinkDrag能够将用户的拖拽指令与有意义的对象和场景级别的变换关联起来，从而实现更复杂的图像编辑。该框架还可以生成推理轨迹，帮助用户理解编辑意图，特别是在处理模糊拖拽时。通过构建一个监督数据集和DragBench++基准，实验结果表明ThinkDrag在生成质量和合理性方面达到了最先进的水平，同时保持了良好的点跟踪精度。'}}}, {'id': 'https://huggingface.co/papers/2610.11069', 'title': 'Clinician use of language models diverges from how the models are evaluated', 'url': 'https://huggingface.co/papers/2610.11069', 'abstract': 'Abstract  Large language model (LLM) assistants are being deployed to clinicians across health systems, and judgments about their readiness rest largely on benchmark scores, most of them derived from examination questions or curated cases. A benchmark predicts performance in deployment only to the extent that its items resemble real use, yet whether benchmarks reflect the work these systems receive has rarely been measured. Here we analyze 127,833 queries sent by 6,342 physicians, advanced practice providers and nurses in 35 specialties to an institutional assistant during an eight-month roll-out. We characterize each query with RCQ-Map, a clinician-validated framework grounded in taxonomies of clinical questions and of LLM evaluation, which records its task, intent, answerability, missing information and potential harm. Documentation and administration (36.2%) and knowledge retrieval (28.9%) made up nearly two-thirds of use, and diagnosis 3.7%; more than a third of queries could not be answered well as posed. Applying RCQ-Map to 58 public benchmarks drawn from major evaluation suites and frontier model reports, which we assemble into the Clinical AI Benchmark Atlas, showed that the median benchmark contained no documentation requests and shared 31% of the task mix of real use, less than an even spread across task categories would. Benchmarks in suites designed to resemble clinical practice were individually no closer to real use than those used in frontier model reports. Benchmark scores therefore say little about how clinical AI performs on most of the work it is actually given, and evaluation should be matched to real clinical use.', 'score': 3, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '40f46a2e482f4fba', 'authors': ['Krithik Vishwanath', 'Haitong Lin', 'Anton Alyakin', 'Jin Vivian Lee', 'D. Brock Hewitt', 'Jie J. Yao', 'William Robert Small', 'Hammad A. Khan', 'Cordelia Orillac', 'Aakaash Varma', 'Brandon Ye', 'Daniel Alexander Alber', 'Gustavo Stolovitzky', 'Batia Wiesenfeld', 'Oded Nov', 'Wei Wu', 'Kang Zhang', 'Yindalon Aphinyanaphongs', 'Tim Requarth', 'Eric Karl Oermann', 'The International Digital Twin Consortium in Healthcare', 'Medicine'], 'affiliations': ['Biomedical Data Science Hub', 'Global AI Frontier Lab', 'Johns Hopkins University School of Medicine', 'Macau University of Science and Technology', 'NYU Grossman School of Medicine', 'NYU Langone Health', 'NYU Stern School of Business', 'NYU Tandon School of Engineering', 'New York University', 'Peking University', 'Peking-Tsinghua Center for Life Sciences', 'Stanford University School of Medicine', 'Washington University School of Medicine'], 'pdf_title_img': 'assets/pdf/title_img/2610.11069.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#healthcare', '#science'], 'emoji': '🏥', 'ru': {'title': 'Бенчмарки не отражают реальное клиническое применение AI: пересмотр методов оценки необходим', 'desc': 'Исследование анализирует 127 833 запроса к ассистенту на основе LLM в клинических условиях, используя рамку RCQ-Map для классификации задач по типам (документирование, поиск знаний, диагностика и др.). Авторы обнаружили, что существующие бенчмарки для оценки клинических AI систем плохо отражают реальное использование: медианный бенчмарк совпадает только на 31% с фактическим распределением задач в клинике. Исследование показывает, что стандартные тесты основаны на экзаменационных вопросах и подобранных случаях, которые не представляют подавляющее большинство работы, выполняемой этими системами на практике. Авторы призывают переработать методику оценки клинических AI, чтобы она соответствовала реальным клиническим сценариям использования.'}, 'en': {'title': 'Bridging the Gap: Aligning AI Benchmarks with Real Clinical Needs', 'desc': 'This paper examines the effectiveness of benchmark scores for large language model (LLM) assistants used in clinical settings. It analyzes over 127,000 queries from healthcare professionals to understand the types of tasks these models are actually used for. The study introduces the RCQ-Map framework to categorize queries based on their task, intent, and answerability, revealing that many queries cannot be adequately answered. The findings suggest that existing benchmarks do not accurately reflect real-world clinical needs, indicating a need for evaluation methods that align more closely with actual clinical use.'}, 'zh': {'title': '基准测试与真实临床使用的差距', 'desc': '这篇论文分析了大型语言模型（LLM）在医疗系统中的应用，特别是它们在临床环境中的实际表现。研究通过分析来自6342名医务人员的127,833个查询，使用RCQ-Map框架来评估这些查询的任务、意图和可回答性等特征。结果显示，文档和知识检索占据了大部分使用情况，而诊断类查询的比例较低，且超过三分之一的查询无法得到良好的回答。通过将这些实际使用情况与现有的公共基准进行比较，发现基准测试与真实临床使用之间存在显著差距，因此评估方法应更贴近实际临床工作。'}}}, {'id': 'https://huggingface.co/papers/2610.00423', 'title': 'The Life Cycle of a Massive Activation: Stochastic Birth, Weight-Decay-Driven Growth, and Competitive Consolidation', 'url': 'https://huggingface.co/papers/2610.00423', 'abstract': "Abstract  Massive activations, residual-stream coordinates with magnitudes far larger than typical activations, are associated with attention sinks in transformers, but how their scale is regulated during training remains incompletely understood. Combining training-trajectory analyses and controlled interventions, we trace their emergence, growth, and consolidation. Sink-carrying channels vary across random seeds but stabilize early within each run. Over longer training, surrounding channels erode and the sink concentrates onto a few redundant carriers. Across ablations, gradient attenuation follows the sink token's collective root-mean-square magnitude rather than any single channel, making collective scale central to understanding their effects. Our central result is that weight decay causally controls the turnover of global activation scale. In controlled continuations, removing decay near the peak allows this scale to keep rising, whereas retaining it produces decline even at constant learning rate. We develop a balance model for the rise and peak of massive-activation magnitude, in which AdamW-preconditioned growth opposes weight decay. Sweeping the decay coefficient λ shifts peak timing approximately log-linearly and yields peak magnitudes scaling approximately as λ^{-1/2}, consistent with this balance. Optimizer measurements further show that preconditioning sustains the large-channel cohort against decay even when raw maintaining forces are too small to do so. Together, these findings connect the observed life cycle to scale-regulating training dynamics and establish weight decay as a training-time lever on activation magnitude.", 'score': 3, 'issue_id': 3401, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '091a464c45fcfc02', 'authors': ['S. Aaron McClendon', 'Jorge Gallego-Feliciano', 'Antonios Saravanos'], 'affiliations': ['Aimpoint Digital Labs, Atlanta, GA, USA', 'Mistral AI, Paris, FR', 'New York University, New York, NY, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.00423.jpg', 'data': {'categories': ['#architecture', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Weight decay как регулятор масштаба массивных активаций в трансформерах', 'desc': 'Исследование посвящено явлению массивных активаций в трансформерах, которые значительно превышают типичные значения и связаны с особыми каналами внимания. Авторы проанализировали, как эти активации появляются, растут и стабилизируются во время обучения, используя анализ траекторий и контролируемые вмешательства. Ключевое открытие состоит в том, что weight decay (регуляризация весов) является критическим фактором, контролирующим масштаб этих активаций: его удаление позволяет масштабу продолжать расти, а его наличие вызывает снижение. Авторы разработали математическую модель, описывающую баланс между ростом активаций под влиянием AdamW оптимизатора и их затуханием вследствие weight decay.'}, 'en': {'title': 'Weight Decay: The Key to Controlling Activation Magnitude in Transformers', 'desc': 'This paper investigates how massive activations in transformer models are regulated during training, particularly focusing on the role of weight decay. The authors analyze training trajectories and find that the scale of these activations is influenced by the collective behavior of multiple channels rather than individual ones. They demonstrate that weight decay plays a crucial role in controlling the magnitude of activations, with its absence allowing activations to grow unchecked. The study introduces a balance model that explains the dynamics of activation scale, highlighting the interplay between optimizer settings and weight decay effects.'}, 'zh': {'title': '权重衰减：激活规模的关键调节器', 'desc': '本文研究了在变换器模型中，巨大的激活值与注意力汇聚之间的关系，以及这些激活值在训练过程中的调节机制。通过分析训练轨迹和控制干预，作者追踪了激活值的出现、增长和巩固过程。研究发现，权重衰减在控制全局激活规模的变化中起着关键作用，去除衰减会导致激活规模持续上升，而保留衰减则会导致规模下降。最后，作者提出了一种平衡模型，解释了巨型激活值的增长与权重衰减之间的对抗关系。'}}}, {'id': 'https://huggingface.co/papers/2610.12602', 'title': 'Self-Preservation in Language Models', 'url': 'https://huggingface.co/papers/2610.12602', 'abstract': 'Abstract  Continual learning (CL) seeks to adapt pretrained models while preserving prior capabilities. Yet the tasks supplied for preservation cover only part of what a model knows, while forgetting can extend beyond them. Recent work shows that language models can supplement this limited evidence by generating useful replay without access to their original training data. This raises a question about self-preservation: can a model help choose preservation targets that protect its own capabilities more broadly? To study this question, we organize task descriptions and their examples into Task Banks, whose entries can be selected and combined to guide replay generation by a frozen model. Continual instruction tuning with Qwen models of varying sizes yields three findings. First, the new task and learning rate shape which prior capabilities degrade, while tracking previously correct answers reveals losses that average accuracy can conceal. Second, generated replay reduces forgetting on tasks outside the bank. Combining partial banks strengthens this protection, improving mean retention of previously correct answers over either bank alone across the tested sizes. Third, the model can also help choose replay targets: selection informed by the new task improves mean held-out retention over random selection at 4B, with similar new-task gains, although smaller models show no corresponding advantage. Under a fixed example budget, however, replacing new-task examples with replay improves preservation at the cost of smaller new-task gains. Together, these findings show that models can support broader self-preservation by generating replay data and, in some settings, choosing which tasks to replay.', 'score': 3, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '86a6523821e68df1', 'authors': ['Dongkyu Cho', 'Rumi Chunara', 'Ali Behrouz'], 'affiliations': ['Cornell University', 'Google Research', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12602.jpg', 'data': {'categories': ['#optimization', '#training', '#multilingual'], 'emoji': '🧠', 'ru': {'title': 'Самосохранение знаний: модели выбирают, что помнить', 'desc': 'Статья исследует континуальное обучение языковых моделей, когда модель адаптируется к новым задачам, сохраняя при этом свои предыдущие знания. Авторы предлагают использовать Task Banks — организованные наборы описаний задач и примеров, которые помогают генерировать синтетические данные для воспроизведения (replay) без доступа к исходным данным обучения. Экспериментальные результаты показывают, что сгенерированные данные эффективно снижают забывание на задачах вне банка, а модели могут самостоятельно выбирать наиболее полезные задачи для воспроизведения. Исследование демонстрирует, что размер модели влияет на качество самовыбора целей обучения, с лучшими результатами на более крупных моделях.'}, 'en': {'title': 'Empowering Models with Self-Preservation through Smart Replay', 'desc': "This paper discusses continual learning (CL), which aims to adapt models while keeping their previous knowledge intact. It highlights that traditional methods may not fully capture a model's capabilities, leading to forgetting beyond the tasks being preserved. The authors propose using language models to generate replay data that can help maintain performance on forgotten tasks. They introduce Task Banks to guide the selection of tasks for replay, demonstrating that this approach can enhance retention of knowledge and improve self-preservation in models."}, 'zh': {'title': '模型自我保护：生成重放数据的力量', 'desc': '持续学习（CL）旨在在保留先前能力的同时调整预训练模型。研究表明，语言模型可以通过生成有用的重放数据来补充有限的证据，从而帮助模型更好地保护其能力。本文提出了一种任务银行的组织方式，以指导冻结模型的重放生成，并发现新任务和学习率会影响先前能力的退化。通过持续的指令调优，模型能够选择重放目标，从而在某些情况下提高保留率，支持更广泛的自我保护。'}}}, {'id': 'https://huggingface.co/papers/2610.12582', 'title': 'One Model to Loop Them All: Elastic Latent Recurrence for Language Models', 'url': 'https://huggingface.co/papers/2610.12582', 'abstract': "Abstract  A latent recurrent language model applies a shared block of layers repeatedly, so one checkpoint can trade inference compute for accuracy by changing the loop count. At one loop, however, such models typically fall well short of a non-recurrent model of the same size, a one-loop tax that makes a separate non-recurrent model the better choice whenever latency matters. We present Elastic Latent Recurrence (ELR), a recipe for training looped language models without this tax. At one loop, an ELR model costs the same to serve as a non-recurrent model of the same size and, trained on the same data, reaches similar accuracy. Each additional loop then buys more accuracy for more inference compute. Three choices make this work: a gated state update with a learned step size, loop counts mixed within each optimizer update, and conditioning each pass on its loop index and budget. The first two preserve one-loop accuracy, and the third lowers loss at every additional loop. Mixed depths can be introduced late in pretraining to limit the added training cost, and with zero-initialized conditioning added at the switch, this late schedule reaches lower loss than mixed-depth training from scratch. In MoE models, reusing first-loop expert routes on later loops cuts mixed-depth update time by 11.7% with no measurable change in accuracy. At inference, keeping only the last loop's attention KV cache holds attention KV memory at its one-loop level while retaining most of the gain from additional loops. On 4B dense and 30B-A3B MoE hybrid models, ELR at one loop is 0.52 points below and 1.04 points above its matched baseline on a ten-task average, and four loops add 7.25 and 4.75 points. Carried through post-training, the recipe yields Koi-4B, a single checkpoint that scores an estimated 18 on the Artificial Analysis Intelligence Index at one loop, matching Qwen3.5-4B, and 29 at four loops.", 'score': 2, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '56233c50ac5d6f38', 'authors': ['Faisal Ladhak', 'Shantanu Acharya', 'Santiago Akle Serano', 'Simeng Sun', 'Boris Ginsburg', 'Krishna C Puvvada'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2610.12582.jpg', 'data': {'categories': ['#architecture', '#inference', '#small_models', '#optimization', '#training'], 'emoji': '🔄', 'ru': {'title': 'Эластичная рекуррентность: одна модель для разных скоростей инференса', 'desc': 'В статье предложен метод Elastic Latent Recurrence (ELR) для обучения рекуррентных языковых моделей, которые многократно применяют один блок слоёв, позволяя менять количество итераций для компромисса между скоростью инференса и точностью. Традиционно такие модели на одной итерации значительно уступают нерекуррентным моделям того же размера, но ELR избавляет от этого штрафа через управляемое обновление состояния, смешивание разных глубин во время обучения и кондиционирование прохода индексом цикла. Метод позволяет одной контрольной точке работать с одной итерацией как нерекуррентная модель, а каждая дополнительная итерация улучшает точность за счёт дополнительных вычислений при инференсе. На практике ELR достигает впечатляющих результатов: модель Koi-4B показывает производительность, сравнимую с Qwen3.5-4B при одной итерации и значительно превосходит её при четырёх итерациях.'}, 'en': {'title': 'Elastic Latent Recurrence: Balancing Efficiency and Accuracy in Language Models', 'desc': 'This paper introduces Elastic Latent Recurrence (ELR), a method for training recurrent language models that eliminates the performance gap typically seen at one loop compared to non-recurrent models. ELR allows models to maintain the same computational cost as non-recurrent models while achieving similar accuracy at one loop, and it improves accuracy with additional loops. Key innovations include a gated state update with a learned step size, mixed loop counts during optimization, and conditioning on loop indices, which together enhance model performance without increasing training costs significantly. The results demonstrate that ELR can effectively balance inference efficiency and accuracy, making it a valuable approach for language modeling tasks.'}, 'zh': {'title': '弹性潜在递归：提升语言模型准确性的创新方法', 'desc': '这篇论文介绍了一种名为弹性潜在递归（ELR）的语言模型训练方法。ELR允许在保持与非递归模型相同的计算成本的情况下，通过增加循环次数来提高模型的准确性。该方法通过门控状态更新、优化器更新中的循环计数混合以及根据循环索引和预算进行条件处理来实现。实验结果表明，ELR在多个任务上表现出色，能够在推理时有效利用内存。'}}}, {'id': 'https://huggingface.co/papers/2609.39635', 'title': 'SAGE: Salient Factor Discovery and Generation with Visual Foundation Representations', 'url': 'https://huggingface.co/papers/2609.39635', 'abstract': "Abstract  Given a target dataset, such as faces with eyeglasses, and a background dataset, such as faces without, contrastive analysis separates salient factors specific to the target from common content shared by both. We aim for salient representations that capture target-specific detail in each image, such as the shape, color, and position of the glasses, so that they reveal subtypes without subtype labels and guide the generation of new examples of a discovered subtype, even one with no name or text description. We introduce SAGE, which learns both factors directly in the high-dimensional spatial latent of a frozen representation autoencoder and conditions a diffusion transformer on the learned salient representation of a reference image. On Digits-ImageNet and FFHQ eyeglasses, SAGE combines high-fidelity reconstruction (rFID below 2) with unsupervised subtype discovery, recovering the digits better than baselines (probe accuracy 0.950 vs.\\ at most 0.281) and revealing eyewear types, finer sunglasses styles, and mislabeled images; salient-conditioned generation raises Digits-ImageNet subtype accuracy over the unfactorized latent (90.5% vs.\\ 27.7%) and diversity on both datasets. On retinal OCT, SAGE's salient space separates three diseases using only normal/disease labels.", 'score': 2, 'issue_id': 3401, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '1e774a0c00b46d25', 'authors': ['Shuang Liang', 'Lejun Liao', 'Shiyuan Zhang', 'Max C. Zhang', 'Xiaolong Luo', 'Han Wang', 'Stefano Anzellotti', 'Yuan Yuan'], 'affiliations': ['Boston College', 'HKU', 'Harvard University', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2609.39635.jpg', 'data': {'categories': ['#interpretability', '#multimodal', '#diffusion', '#cv', '#dataset'], 'emoji': '🕶️', 'ru': {'title': 'Раскрытие скрытых подтипов через контрастное факторизованное представление', 'desc': 'Статья представляет метод SAGE для контрастного анализа, который разделяет целевые признаки (например, очки на лицах) от общего содержимого, используя целевой и фоновый датасеты. Модель одновременно обучает представления обоих факторов в скрытом пространстве замороженного автоэнкодера и использует диффузионный трансформер для кондиционирования на выученном целевом представлении. Метод достигает высокой точности реконструкции и одновременно открывает неизвестные подтипы данных без разметки, например различные стили очков и солнцезащитных очков. На датасетах Digits-ImageNet, FFHQ и медицинских снимках сетчатки SAGE показывает превосходные результаты как в реконструкции, так и в обнаружении скрытых подтипов и аномалий.'}, 'en': {'title': 'SAGE: Uncovering Hidden Subtypes in Images Without Labels', 'desc': 'This paper presents SAGE, a machine learning model designed to identify and separate specific features in images, such as eyeglasses on faces, from common background elements. By using contrastive analysis, SAGE learns to capture unique details that define subtypes without needing explicit labels. The model operates within a high-dimensional latent space of a frozen autoencoder and utilizes a diffusion transformer to generate new examples based on learned representations. SAGE demonstrates superior performance in reconstructing images and discovering subtypes, achieving high accuracy and diversity in various datasets, including Digits-ImageNet and retinal OCT images.'}, 'zh': {'title': 'SAGE：无监督的显著特征学习与生成', 'desc': '本文介绍了一种名为SAGE的机器学习方法，旨在从目标数据集中提取特定于目标的显著特征，例如眼镜的形状、颜色和位置。通过对比分析，SAGE能够将目标特征与背景数据中的共同内容分离，从而实现无监督的亚型发现。该方法在高维空间中学习显著表示，并利用扩散变换器生成新样本，甚至在没有标签的情况下也能识别亚型。实验结果表明，SAGE在多个数据集上表现优异，能够更好地恢复图像并提高亚型准确性和多样性。'}}}, {'id': 'https://huggingface.co/papers/2610.10512', 'title': 'Video-Conditioned Generative Joint 2D-3D Hand Motion Recovery', 'url': 'https://huggingface.co/papers/2610.10512', 'abstract': "Abstract  Recovering faithful 3D hand motion from video remains challenging due to frequent occlusions and incomplete visual observations, which make frame-wise pose estimates unreliable and temporally inconsistent. To address this problem, we propose JoHan, a unified generative framework that recovers hand motion directly from video sequences without relying on intermediate per-frame pose predictions. Trained from scratch, our model jointly generates aligned 2D and 3D local hand pose sequences by learning their temporal dynamics and cross-representation correspondence. The generated 2D trajectories exploit direct spatial and temporal cues from the 2D images to guide the following generative 3D motion reconstruction, while the learned motion prior promotes temporal consistency. Their learned 2D-3D correspondence further enables recovery of the hand's global position and orientation relative to the camera. Extensive experiments on challenging benchmarks demonstrate significantly improved accuracy and speed in local hand-pose and camera-space reconstruction. Notably, our method captures much better hand-motion dynamics, producing significantly smoother motion than previous methods while maintaining high per-frame pose accuracy.", 'score': 1, 'issue_id': 3401, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'a1808501383e16a0', 'authors': ['Chen Xu', 'Yunqi Li', 'Binbin Huang', 'Brent Yi', 'Shenghua Gao', 'Yi Ma'], 'affiliations': ['The University of Hong Kong', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.10512.jpg', 'data': {'categories': ['#3d', '#video', '#architecture'], 'emoji': '🤚', 'ru': {'title': 'Плавное восстановление движения руки через совместную генерацию 2D-3D последовательностей', 'desc': 'В работе предложен JoHan — единый генеративный фреймворк для восстановления движения руки из видеопоследовательностей, который избегает промежуточных предсказаний позы для каждого кадра. Модель совместно генерирует согласованные 2D и 3D последовательности локальной позы руки, обучаясь временной динамике и соответствию между разными представлениями. Сгенерированные 2D траектории используют прямые пространственно-временные признаки из изображений для руководства 3D реконструкцией, а изученный prior движения обеспечивает временную согласованность. Метод позволяет восстановить глобальную позицию и ориентацию руки относительно камеры благодаря изученному 2D-3D соответствию.'}, 'en': {'title': 'Revolutionizing 3D Hand Motion Recovery with JoHan', 'desc': 'The paper presents JoHan, a novel generative framework designed to recover 3D hand motion from video sequences. Unlike traditional methods that rely on frame-by-frame pose predictions, JoHan generates hand motion directly, improving reliability and consistency. It learns the temporal dynamics and correspondence between 2D and 3D hand poses, utilizing spatial and temporal cues from images to enhance 3D reconstruction. The results show that JoHan achieves superior accuracy and smoother motion dynamics compared to existing techniques, making it a significant advancement in hand motion recovery.'}, 'zh': {'title': '从视频中恢复真实手部运动的创新方法', 'desc': '本论文提出了一种名为JoHan的统一生成框架，用于从视频序列中恢复真实的3D手部运动。该方法不依赖于逐帧的姿态预测，而是通过学习时间动态和跨表示对应关系，直接生成对齐的2D和3D手部姿态序列。生成的2D轨迹利用2D图像中的空间和时间线索，指导后续的3D运动重建，同时学习的运动先验促进了时间一致性。实验结果表明，该方法在局部手部姿态和相机空间重建方面显著提高了准确性和速度，捕捉到更好的手部运动动态。'}}}, {'id': 'https://huggingface.co/papers/2610.12102', 'title': 'Few-Step Generation via Data-Space Iteration', 'url': 'https://huggingface.co/papers/2610.12102', 'abstract': 'Abstract  Flow matching has emerged as a scalable paradigm for training high-quality generative models, but sampling from the learned probability flow requires many network evaluations. Distillation can reduce this cost to one or a few evaluations; however, one-step generation often sacrifices quality, making few-step generation the practical operating regime. Existing few-step methods perform their iterative computation along the probability flow and therefore require a fixed, manually chosen timestep discretization. This discretization is often chosen heuristically and is expensive to tune; it may also be restrictive when refinement difficulty differs across samples or spatial locations. We introduce data-space iteration, a few-step generation framework that removes flow discretization altogether. Starting from noise, a shared generator directly refines its prediction in data space, with every iteration trained to produce the best sample permitted by its capacity. Our formulation integrates with distribution matching distillation (DMD) with minimal changes, enabling a controlled comparison between iteration methods under matched training settings. On class-conditional ImageNet 256x256, data-space iteration outperforms standard discretization baselines and matches or improves upon variants selected through schedule search, without requiring schedule-specific training. These results show that data-space iteration provides a simple and effective alternative to discretized flow-space iteration for fast generation.', 'score': 1, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '3c63e1ce6d19fa38', 'authors': ['Shanchuan Lin', 'Yansong Peng', 'Fu-Yun Wang', 'Haoqi Fan'], 'affiliations': ['ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2610.12102.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Итерации в пространстве данных вместо дискретизации потока', 'desc': 'В статье предлагается новый подход к дистилляции flow matching моделей, который позволяет генерировать высококачественные изображения за несколько шагов. Вместо итераций вдоль вероятностного потока с фиксированной дискретизацией временных шагов, авторы вводят итерации в пространстве данных, где генератор напрямую уточняет предсказание на каждом шаге. Такой метод устраняет необходимость в ручной настройке расписания дискретизации и лучше адаптируется к различной сложности уточнения для разных образцов и пространственных областей. На датасете ImageNet 256x256 предложенный подход показывает улучшение качества по сравнению с базовыми методами и не требует переобучения для разных расписаний.'}, 'en': {'title': 'Revolutionizing Generative Models with Data-Space Iteration', 'desc': 'This paper presents a new method called data-space iteration for generating high-quality samples from generative models. Unlike traditional methods that rely on fixed time discretization, this approach allows the model to refine its predictions directly in the data space, improving efficiency and quality. The authors demonstrate that their method integrates well with existing techniques like distribution matching distillation, allowing for effective comparisons. Results show that data-space iteration not only outperforms standard methods but also simplifies the generation process by eliminating the need for complex tuning of discretization schedules.'}, 'zh': {'title': '数据空间迭代：快速生成的新选择', 'desc': '流匹配是一种可扩展的训练高质量生成模型的方法，但从学习到的概率流中采样需要多次网络评估。蒸馏可以减少这个成本，但一阶生成往往牺牲质量，因此少步生成成为实际操作的常规。现有的少步方法沿着概率流进行迭代计算，要求固定的时间步长离散化，这种离散化通常是手动选择的，调优成本高且限制性强。我们提出了数据空间迭代框架，完全去除了流的离散化，从噪声开始，生成器在数据空间中直接优化预测，提供了一种简单有效的快速生成替代方案。'}}}, {'id': 'https://huggingface.co/papers/2610.11215', 'title': 'GATOR: Generative and Agentic 3D Object Reconstruction From Casual Images', 'url': 'https://huggingface.co/papers/2610.11215', 'abstract': 'Abstract  Reconstructing complete, scene-aligned 3D objects from casual images requires integrating sparse, uncertain observations and inferring surfaces hidden by occlusions. We present GATOR, a generative and agentic framework that recovers textured object assets and their scene-relative pose from one or more images. Our local modality mixer couples patch-aligned RGB, target-mask, and pointmap features before cross-view reasoning, preserving scene context while distinguishing the target from its surroundings. Text-guided semantic conditioning complements these spatial cues with category names and object captions through stage-specific adapters for structure, geometry, and appearance generation. The generated asset initializes a multimodal agent, providing instance-specific geometry and pose for targeted structural and texture refinement through an observation-guided edit-render-review loop. Across synthetic objects, cluttered tabletops, and indoor scenes, GATOR achieves strong geometric and appearance fidelity while recovering scene-relative pose from sparse observations. Time-budget comparisons and scene-level simulation further demonstrate the reconstruction efficiency and simulation readiness. Project page: https://research.nvidia.com/labs/lpr/gator/', 'score': 1, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '615ced5a0ebeed3b', 'authors': ['Qirui Wu', 'Stan Birchfield', 'Hesam Rabeti', 'Angel X. Chang', 'Bowen Wen'], 'affiliations': ['NVIDIA', 'Simon Fraser University'], 'pdf_title_img': 'assets/pdf/title_img/2610.11215.jpg', 'data': {'categories': ['#3d', '#agents', '#cv', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Агентная 3D реконструкция объектов из изображений с мультимодальной генерацией', 'desc': 'В статье представлена GATOR — генеративная и агентная система для восстановления полных 3D объектов с текстурой из одного или нескольких изображений. Метод использует специальный микшер модальностей для комбинирования RGB-признаков, масок и карт точек с учётом контекста сцены, а также применяет текстовую семантическую условность через адаптеры для генерации структуры, геометрии и внешнего вида. Инициализированный мультимодальный агент выполняет итеративное уточнение геометрии и текстуры через цикл редактирования, рендеринга и проверки, руководствуясь наблюдениями. Система демонстрирует высокую точность восстановления и эффективность на синтетических объектах, загромождённых сценах и внутренних помещениях.'}, 'en': {'title': 'GATOR: Efficient 3D Object Reconstruction from Casual Images', 'desc': 'The paper introduces GATOR, a framework designed to reconstruct 3D objects from casual images by integrating sparse observations and inferring hidden surfaces. It utilizes a local modality mixer that combines RGB images, target masks, and point maps to maintain scene context while differentiating the object from its background. Additionally, it employs text-guided semantic conditioning to enhance the generation of structure, geometry, and appearance by incorporating category names and object captions. GATOR demonstrates high fidelity in geometric and appearance reconstruction, efficiently recovering scene-relative poses from limited data, making it suitable for various applications.'}, 'zh': {'title': 'GATOR：从图像重建高保真3D物体', 'desc': '本文介绍了一种名为GATOR的生成性框架，旨在从一张或多张图像中重建完整的3D物体。该框架通过结合稀疏的观察数据和推断被遮挡的表面，恢复物体的纹理和场景相对姿态。GATOR使用局部模态混合器，将RGB图像、目标掩码和点图特征结合在一起，保持场景上下文并区分目标与背景。通过文本引导的语义条件，GATOR进一步增强了生成的结构、几何和外观，使其在合成物体和复杂场景中实现了高保真度的重建。'}}}, {'id': 'https://huggingface.co/papers/2610.07018', 'title': 'When to Rethink: Learning Multi-Perspective Self-Verification for Vision-Language Models', 'url': 'https://huggingface.co/papers/2610.07018', 'abstract': 'Abstract  Vision-language models (VLMs) have achieved strong performance in multimodal reasoning, yet they remain prone to generating plausible but incorrect answers. Self-verification offers a practical way to improve answer reliability without relying on external judges, but existing methods typically depend on a single verification criterion or fixed prompt, resulting in incomplete and unstable reliability estimates. We first systematically analyze how verifier capability and prompt design affect verification performance. Our findings show that stronger verifiers provide more reliable judgments, while verification performance is highly sensitive to prompt choice, with no single prompt consistently dominating across tasks. Guided by these findings, we propose MOTIVE, a Multi-View Self-VerificatiOn wiTh RelIability-Guided SelectiVE Rethinking framework for reliable multimodal reasoning. MOTIVE evaluates each candidate answer from complementary verification perspectives and learns a correctness-aligned reliability score through correctness-grounded multi-view verification learning. During inference, this score governs an accept-or-rethink decision, allowing reliable answers to be returned directly while uncertain ones trigger history-guided rethinking. Extensive experiments across diverse multimodal benchmarks and VLM backbones demonstrate that MOTIVE consistently outperforms strong self-verification and self-correction baselines. Further results show that reliable verification improves accept-or-rethink decisions and reduces unnecessary reasoning turns, enabling more reliable and efficient self-verification without an external judge.', 'score': 1, 'issue_id': 3401, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '96370f98e01d30c7', 'authors': ['Ziquan Zhu', 'Hanruo Zhu', 'Si-Yuan Lu', 'Morris Yu-Chao Huang', 'Yicheng Lin', 'Wei Han', 'Tianlong Chen', 'Mingyuan Wu', 'Hanchao Yu', 'Gaojie Jin', 'Lu Liu', 'Bo Sun', 'Tianjin Huang'], 'affiliations': ['Amazon', 'Eindhoven University of Technology', 'Meta AI', 'Nanjing University of Posts and Telecommunications', 'University of Exeter', 'University of Illinois Urbana-Champaign', 'University of Leicester', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2610.07018.jpg', 'data': {'categories': ['#benchmark', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Многоракурсная самопроверка для надёжного мультимодального рассуждения', 'desc': 'Работа посвящена улучшению надёжности мультимодальных моделей зрения и языка через самопроверку, которая часто страдает от неполных оценок при использовании одного критерия. Авторы показали, что производительность верификации сильно зависит от выбора промпта и способности верификатора, поэтому предложили MOTIVE — фреймворк многоракурсной самопроверки с надёжностью-управляемым переосмыслением ответов. Метод оценивает каждый ответ с нескольких дополняющих друг друга перспектив и обучает оценку корректности ответа через верификацию, выровненную по истинным меткам. На этапе инференса система использует эту оценку для принятия решения о возврате надёжного ответа или запуске переосмысления, что повышает точность и эффективность без внешних судей.'}, 'en': {'title': 'MOTIVE: Enhancing Reliability in Multimodal Reasoning', 'desc': 'This paper discusses the challenges faced by vision-language models (VLMs) in generating accurate answers during multimodal reasoning. It highlights the limitations of existing self-verification methods that rely on a single criterion or fixed prompts, which can lead to unreliable results. The authors introduce MOTIVE, a framework that uses multiple verification perspectives to assess answer reliability and learns a reliability score aligned with correctness. Through extensive experiments, MOTIVE demonstrates improved performance in self-verification, allowing for more reliable and efficient decision-making in VLMs.'}, 'zh': {'title': 'MOTIVE：提升多模态推理可靠性的自我验证框架', 'desc': '本文介绍了一种新的多视角自我验证框架MOTIVE，旨在提高视觉语言模型在多模态推理中的答案可靠性。研究表明，验证者的能力和提示设计对验证性能有显著影响，强大的验证者能够提供更可靠的判断。MOTIVE通过从多个验证视角评估候选答案，并学习与正确性对齐的可靠性评分，来实现更可靠的推理。实验结果表明，MOTIVE在多种基准测试中表现优于现有的自我验证和自我修正方法。'}}}, {'id': 'https://huggingface.co/papers/2610.12416', 'title': 'MAMHOI: Factorizing Scene-Aware Human-Object Interaction through Affordances', 'url': 'https://huggingface.co/papers/2610.12416', 'abstract': 'Abstract  Generating realistic human-object interactions (HOI) in complex 3D scenes requires two complementary capabilities: reasoning about interaction feasibility in the environment and synthesizing realistic human-object motion. However, supervision for these capabilities is rarely available jointly at scale. Human-scene datasets provide rich information about environment-aware motion, while human-object datasets capture detailed interaction dynamics, yet paired human-object-scene data remain scarce. We present MAMHOI, an affordance-mediated factorization for scene-aware human-object interaction generation. MAMHOI factorizes scene-aware HOI generation through an explicit motion-affordance interface between scene understanding and motion synthesis: a scene-conditioned model first predicts where and how an interaction can be feasibly executed, and an affordance-conditioned HOI model then generates the corresponding human-object motion. This factorization allows scene understanding and interaction dynamics to be learned from complementary sources of supervision without requiring paired human-object-scene data. Experiments in complex indoor environments show that MAMHOI reduces object--scene penetration while better preserving human--object interaction quality, yielding more realistic and physically feasible scene-aware interactions. Project page: https://leimingyuan.github.io/MAMHOI-project-page/', 'score': 1, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '6dab65c779ff55e2', 'authors': ['Mingyuan Lei', 'Yoonchang Sung', 'Tat-Jen Cham'], 'affiliations': ['College of Computing and Data Science Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2610.12416.jpg', 'data': {'categories': ['#3d', '#multimodal'], 'emoji': '🤝', 'ru': {'title': 'Факторизация через affordance для сцено-ориентированной генерации взаимодействий человека и объектов', 'desc': 'Статья представляет MAMHOI — метод для генерации реалистичных взаимодействий человека и объектов в сложных 3D сценах. Авторы решают проблему отсутствия парных данных «человек-объект-сцена», факторизуя задачу через промежуточное представление affordance. Модель сначала предсказывает места и способы осуществления взаимодействия с учётом сцены, а затем синтезирует реалистичное движение человека и объекта. Подход позволяет обучаться на дополняющих друг друга источниках данных и генерирует физически корректные взаимодействия без проникновения объектов через поверхности.'}, 'en': {'title': 'MAMHOI: Realistic Human-Object Interactions through Scene-Aware Motion Generation', 'desc': 'The paper introduces MAMHOI, a method for generating realistic human-object interactions in 3D scenes by combining scene understanding and motion synthesis. It addresses the challenge of limited paired datasets by using an affordance-mediated factorization approach. This method allows the model to first assess where and how interactions can occur in a scene, and then generate the corresponding human-object motions. The results demonstrate improved interaction quality and reduced physical inconsistencies in complex indoor environments.'}, 'zh': {'title': 'MAMHOI：场景感知的人物-物体交互生成', 'desc': '本文提出了一种名为MAMHOI的方法，用于生成复杂3D场景中的人类与物体交互。该方法通过运动可用性接口，将场景理解与运动合成相结合，从而实现场景感知的人物-物体交互生成。MAMHOI能够在没有配对的人物-物体-场景数据的情况下，从不同的监督源中学习场景理解和交互动态。实验结果表明，MAMHOI在复杂室内环境中有效减少了物体与场景的穿透，同时更好地保留了人类与物体的交互质量。'}}}, {'id': 'https://huggingface.co/papers/2609.37359', 'title': 'Encore: Few-Shot Agentic Discovery of Manipulation Strategies', 'url': 'https://huggingface.co/papers/2609.37359', 'abstract': "Abstract  Coding agents can now write, run, and debug programs with little human help. Robot tasks, however, are usually specified by a sentence that leaves out how to grasp, in what order to make contact, and what the result should look like, and an agent given only the sentence must find these details by trial and error. We introduce ENCORE, which gives the agent a few demonstrations as evidence to read rather than as training data. A deterministic builder distills each demonstration into a pack of multi-view keyframes, gripper events, frame strips, and the full trajectory. A coding agent studies the pack, writes a policy program against a fixed perception and action API, refines it iteratively over a few development rollouts, and freezes it before a sealed evaluation that never reveals the success signal. On LIBERO-PRO, the agent's first program already succeeds in half of the perturbed tasks with demonstrations and in one task without them, and the frozen programs outperform the strongest prior agentic system run with the same language model (96.3% against 89.3%). On RoboDojo tasks whose instructions leave the goal unstated, no program succeeds without demonstrations. ENCORE also runs on a real bimanual robot, learning cube handover and cup inversion from five demonstrations each.", 'score': 1, 'issue_id': 3400, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'a0290da275d92a34', 'authors': ['Yifan Kang', 'Zihan Wang', 'Zhiwen Fan', 'Bangya Liu'], 'affiliations': ['2077AI Open Source Foundation', 'Massachusetts Institute of Technology', 'Texas A&M University', 'University of Wisconsin Madison'], 'pdf_title_img': 'assets/pdf/title_img/2609.37359.jpg', 'data': {'categories': ['#agents', '#dataset', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Обучение роботов через демонстрации с генерацией программного кода', 'desc': 'В статье представлена система ENCORE, которая позволяет кодирующим агентам изучать робототехнические задачи на основе демонстраций вместо традиционного обучения. Система преобразует каждую демонстрацию в структурированный набор мультивью-кадров, событий захвата и полной траектории, которые агент анализирует для написания программы политики. Агент генерирует код на основе фиксированного API восприятия и действия, затем итеративно улучшает его через несколько попыток разработки. На бенчмарке LIBERO-PRO замороженные программы превосходят предыдущие системы (96.3% против 89.3%), а система успешно работает и на реальном биманипуляторе.'}, 'en': {'title': 'Learning Robot Tasks with Minimal Demonstrations', 'desc': 'The paper introduces ENCORE, a system that enables coding agents to learn robot tasks from a few demonstrations instead of extensive training data. It utilizes a deterministic builder to convert demonstrations into structured information, including keyframes and trajectories. The coding agent then develops a policy program using this information, refining it through iterative rollouts before final evaluation. ENCORE shows significant performance improvements on various tasks, demonstrating its effectiveness in learning from limited examples and outperforming previous systems.'}, 'zh': {'title': 'ENCORE：通过示例提升机器人学习能力', 'desc': '本文介绍了一种名为ENCORE的系统，它使得编码代理能够通过少量示例来学习如何执行机器人任务，而不是依赖于传统的训练数据。ENCORE通过将示例提炼成多视角关键帧、抓取事件和完整轨迹，帮助代理理解任务细节。代理在固定的感知和动作API下编写策略程序，并通过迭代开发来优化它。实验结果表明，ENCORE在多个任务中表现优异，尤其是在没有示例的情况下，仍能成功完成部分任务。'}}}, {'id': 'https://huggingface.co/papers/2610.09607', 'title': 'Which Language Should a Skeleton Speak? Language Choices in Multilingual Reasoning', 'url': 'https://huggingface.co/papers/2610.09607', 'abstract': 'Abstract  Skeleton-based reasoning prompting is a promising training-free approach for structuring LLM reasoning, but prior work largely assumes an English-centric setting. We propose the Language-Aware Skeleton Exploration Framework (LASEF) to study skeleton-language choice in multilingual mathematical reasoning. Across math benchmarks, model scales, and languages, we show that English skeletons yield a small positive tendency on average, most visible for smaller models and low-resource languages. However, few language-level gains remain significant after correction, and English is not universally optimal. Combining greedy decoding, multi-rollout evaluation, translation ablation, and cross-benchmark validation, we further find three patterns of skeleton-language effects: directionally consistent, evaluation- and benchmark-dependent, and asymmetric negative. These effects cannot be fully explained by generation quality alone. Overall, skeleton language is a context-dependent design variable that requires multi-level exploration. All resources are released at https://github.com/lhsstn/LASEF.', 'score': 1, 'issue_id': 3400, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '5aa060b263f9a81b', 'authors': ['HyeonSeok Lim', 'SeungWoo Song', 'Inho Won', 'Hoyun Song', 'Jihyo Kim', 'KyungTae Lim'], 'affiliations': ['Department of Artificial Intelligence, Dankook University', 'ETRI', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.09607.jpg', 'data': {'categories': ['#open_source', '#math', '#machine_translation', '#multilingual', '#low_resource', '#reasoning', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Язык скелета в многоязычных рассуждениях LLM: контекстно-зависимая переменная дизайна', 'desc': 'В статье исследуется влияние языка скелета на качество рассуждений большие языковые модели в многоязычных математических задачах. Авторы предлагают LASEF — фреймворк для изучения взаимодействия между языком скелета и языком задачи без необходимости переобучения модели. Результаты показывают, что английский скелет дает небольшое преимущество в среднем, особенно для маленьких моделей и малоресурсных языков, но это преимущество часто исчезает после статистической коррекции. Исследование выявило три основных паттерна эффектов скелета и языка, которые не объясняются только качеством генерации текста.'}, 'en': {'title': 'Exploring Multilingual Skeletons for Better Reasoning', 'desc': 'This paper introduces the Language-Aware Skeleton Exploration Framework (LASEF) to analyze how different languages affect reasoning in multilingual mathematical tasks. It finds that while using English skeletons can slightly improve performance, especially in smaller models and low-resource languages, these improvements are not always significant. The study identifies three patterns of how skeleton-language choices impact model performance, indicating that the effects are influenced by the context and specific benchmarks used. Ultimately, the research emphasizes the need for a deeper exploration of skeleton language as a variable in machine learning models.'}, 'zh': {'title': '多语言推理中的骨架语言探索', 'desc': '本文提出了一种新的框架，称为语言感知骨架探索框架（LASEF），用于研究多语言数学推理中的骨架与语言选择。研究表明，使用英语骨架在小型模型和低资源语言中表现出轻微的积极趋势，但这种优势在经过修正后并不显著。我们发现骨架语言的效果存在三种模式：方向一致、依赖评估和基准、以及不对称负面影响。这些效果不能仅通过生成质量来解释，表明骨架语言是一个需要多层次探索的上下文相关设计变量。'}}}, {'id': 'https://huggingface.co/papers/2610.12453', 'title': 'Mental-Models for Multi-Agent Systems', 'url': 'https://huggingface.co/papers/2610.12453', 'abstract': 'Abstract  Large foundation models have accelerated progress toward general-purpose agents that interact with humans and other agents through language and multimodal signals. However, robust multi-agent decision-making requires reasoning about what other agents know, intend, and are likely to do under partial observability. Current agentic systems often operate through prompt design, memory, or end-to-end behavioral shaping, but typically do not learn an explicit partner-state representation that can be reused as a decision variable across tasks. We introduce mental-model-enabled agents, a framework that equips an agent with a latent mental model of its counterpart, allowing it to infer hidden beliefs, intentions, and likely reactions from the observed history and use these inferences to guide action selection. Our method learns an amortized recursive Theory-of-Mind representation, with first- and second-order mental-state structure, jointly with a belief-conditioned reward model that evaluates candidate actions relative to the inferred partner state. A policy is then learned under this belief-aware signal, yielding an agent that can act independently at inference time while retaining the benefits of explicit partner modeling. We evaluate the same framework on both language-only and multimodal benchmarks. Across these settings, explicit mental-state modeling consistently improves interaction quality and Theory-of-Mind performance over base agentic systems, showing that structured partner modeling is a useful inductive bias for general multi-agent systems. Our code is publicly available at https://github.com/hananshafi/Mental-Models', 'score': 0, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'e6335dc7e19459b3', 'authors': ['Hanan Gani', 'Lulu Shao', 'Manmohan Chandraker'], 'affiliations': ['University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.12453.jpg', 'data': {'categories': ['#agents', '#benchmark', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Агенты с моделью психики партнера для лучшего многоагентного взаимодействия', 'desc': 'В статье предложена система, которая позволяет агентам явно моделировать психическое состояние других агентов, чтобы лучше взаимодействовать в многоагентной среде. Модель использует амортизированное рекурсивное представление Theory-of-Mind для вывода скрытых убеждений, намерений и вероятных действий партнера из истории наблюдений. На основе инferred представления о состоянии партнера обучается функция вознаграждения, которая оценивает кандидаты на действие агента, а затем обучается политика под этим сигналом. Эксперименты показывают, что явное моделирование психического состояния партнера значительно улучшает качество взаимодействия и понимание Theory-of-Mind в сравнении с базовыми агентными системами.'}, 'en': {'title': 'Empowering Agents with Mental Models for Better Decision-Making', 'desc': 'This paper presents a new approach for multi-agent decision-making by introducing mental-model-enabled agents. These agents develop a latent mental model of their counterparts, allowing them to understand hidden beliefs and intentions based on observed interactions. The framework incorporates a recursive Theory-of-Mind representation and a belief-conditioned reward model to enhance action selection. The results show that this structured partner modeling significantly improves the quality of interactions and overall performance in both language-only and multimodal tasks.'}, 'zh': {'title': '心理模型提升智能体决策能力', 'desc': '本文介绍了一种新的智能体框架，称为心理模型增强智能体，旨在改善多智能体决策过程。该框架使智能体能够建立对其对手的潜在心理模型，从而推断出对手的信念、意图和可能的反应。通过学习递归的心理状态表示和基于信念的奖励模型，智能体能够在推理时独立行动，同时保持对手建模的优势。实验结果表明，明确的心理状态建模显著提高了交互质量和理论心智表现，证明了结构化的对手建模在多智能体系统中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.12307', 'title': 'BudgetPix: Compute-Adaptive Tokenization for Pixel-Space Image Diffusion', 'url': 'https://huggingface.co/papers/2610.12307', 'abstract': 'Abstract  Most image generation models rely on uniform tokenization, allocating the exact same computational budget to equally-sized image patches. This static paradigm cannot adapt to different resource constraints at inference time, and yields suboptimal quality-cost tradeoff by devoting the same effort to both plain backgrounds and intricate details. We propose BudgetPix, an ad
