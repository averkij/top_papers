зывается самым полезным дополнением. Итоговый метод JustRUA на бенчмарке RoboDojo поднимает показатель с 29.7 до 50.3 без обучаемой политики и дополнительной настройки.'}, 'en': {'title': 'A Simpler Harness, a Smarter Robot', 'desc': 'The paper tests which design choices help GPT-6 Astra control a robot arm on the RoboDojo benchmark. A simpler harness that preserves the full episode history and stops motions early substantially improves performance, raising the score from 29.7 to 50.3. Providing scene geometry gives the largest additional benefit, even when it is estimated from RGB images, while reusing past experience does not always help. The results show that a carefully designed evaluation harness can boost robot-use agents without a learned policy, self-improvement loop, or task-specific tuning.'}, 'zh': {'title': '精简执行框架，发挥机器人智能体更大潜力', 'desc': '本文系统比较了机器人使用智能体在 RoboDojo 上的不同设计选择，包括模型外围的执行框架、动作接口、经验复用和场景几何信息。实验发现，保留完整的任务历史并在动作完成前及时停止，是提升表现的关键做法。经验复用会改变模型行为，但不一定总能带来收益；向模型提供场景几何信息的帮助最大，即使深度信息仅由 RGB 图像预测也有效。基于这些发现，JustRUA 在无需学习策略、自我改进循环或针对任务调参的情况下，将 RoboDojo 得分从 29.7 提升到 50.3。'}}}, {'id': 'https://huggingface.co/papers/2607.13920', 'title': 'DeepStress: Stress-Testing Deep Search Agents', 'url': 'https://huggingface.co/papers/2607.13920', 'abstract': 'Abstract A dynamic stress-testing framework shows that search agents often answer confidently despite unreliable retrieved evidence and may rely on memorized knowledge when documents are factually wrong.  Generated by deepseek-ai/DeepSeek-V4.1-Flash While search agents demonstrate impressive capabilities in multi-step question answering, their robustness to poor-quality evidence remains under-explored. Such evidence is rare in benchmark corpora, and resulting failures are hard to reproduce. We propose DeepStress, a dynamic stress-testing framework that subjects agents to degraded evidence at controlled rates. It replaces the retrieval module with a synthetic environment where documents are generated dynamically for each query, under independent control of their trustworthiness, relevance, and factuality. To characterize behavior under stress, we go beyond binary accuracy with a five-way classification of final-answer outcomes and two new reliability-aware metrics, RAS and CoPRAS, which credit cautious behavior and account for computational cost. Evaluating 12 systems on questions from HotpotQA and BrowseComp-Plus, we find that several open-weight agents answer confidently when sources contain obvious credibility red flags, and that many HotpotQA questions are answered from parametric knowledge even when all returned documents are factually wrong.', 'score': 3, 'issue_id': 3529, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'd2b6222921aa7761', 'authors': ['Ismael Rousseau', 'Geraldine Damnati', 'Frederic Bechet'], 'affiliations': ['Aix Marseille Univ, CNRS, LIS', 'Orange Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.13920.jpg', 'data': {'categories': ['#benchmark', '#hallucinations', '#agents', '#security', '#data'], 'emoji': '🧪', 'ru': {'title': 'Агенты поиска уверенно отвечают даже на ложных источниках — проверим их на прочность', 'desc': 'Авторы предлагают DeepStress — фреймворк динамического стресс-тестирования LLM-агентов для поиска, который заменяет retrieval-модуль синтетической средой с документами, генерируемыми под каждый запрос. Степень достоверности, релевантности и фактической точности документов контролируется независимо. Для анализа вводятся пятиклассовая классификация ответов и новые метрики RAS и CoPRAS, которые поощряют осторожное поведение и учитывают вычислительные затраты. Эксперименты на HotpotQA и BrowseComp-Plus показывают, что многие агенты уверенно отвечают при явных признаках ненадежности источников и часто опираются на параметрическую память, даже когда все найденные документы фактически ошибочны.'}, 'en': {'title': 'Stress-test search agents before trusting their answers', 'desc': 'The paper introduces DeepStress, a framework for testing how search agents respond to unreliable evidence. It generates documents for each query and independently controls their trustworthiness, relevance, and factual accuracy. The authors evaluate 12 systems using richer outcome categories and two reliability-aware metrics, RAS and CoPRAS, which reward cautious answers while accounting for computational cost. Results show that agents often answer confidently despite credibility warnings, and may rely on memorized knowledge when all retrieved documents are wrong.'}, 'zh': {'title': '让搜索智能体在坏证据面前经受真正的压力测试', 'desc': '本文提出 DeepStress，一个动态压力测试框架，用来检验搜索智能体面对低质量证据时的表现。它会针对每个问题生成文档，并分别控制文档的可信度、相关性和事实准确性。研究还将回答结果细分为五类，并提出 RAS 和 CoPRAS 两种可靠性指标，以奖励谨慎作答并考虑计算成本。对 12 个系统的评测发现，一些智能体面对明显的可信度警示仍会自信作答，而许多智能体即使拿到的文档全是错误的，也会依赖模型记忆中的知识回答。'}}}, {'id': 'https://huggingface.co/papers/2611.12872', 'title': 'HiVe-Mem: Interleaving Horizontal Memory Expansion and Vertical Evidence Composition for Multimodal Agents', 'url': 'https://huggingface.co/papers/2611.12872', 'abstract': 'Abstract A novel multimodal memory framework enhances long-term interaction by combining relational graph expansion of semantic seeds with query-adaptive composition of heterogeneous evidence forms.  Generated by deepseek-ai/DeepSeek-V4.1-Flash As multimodal agents accumulate increasingly long interaction histories, effectively retrieving and utilizing past information becomes critical for long-term interaction. Existing memory systems typically rely on semantic retrieval over compressed memories and expose predefined representations, which may miss relevant memories and overlook heterogeneous evidence needs across queries. We introduce \\hivemem, a multimodal memory framework that interleaves \\textsc{H}or\\textsc{i}zontal Memory Expansion with \\textsc{Ve}rtical Evidence Composition. For horizontal memory expansion, \\hivemem organizes memory episodes into a relational graph using textual and visual anchors, expanding semantically retrieved seeds with related neighbors to recover complementary information. For vertical evidence composition, each retrieved memory retains multiple evidence forms, including compact summaries, captions, grounded visual views, raw images, and interaction history. A lightweight trainable selector independently composes an evidence subset for each retrieved memory, enabling query-adaptive utilization of heterogeneous multimodal information. This two-dimensional design jointly broadens memory coverage and adapts the evidence contributed by individual memories. Experiments across three multimodal memory benchmarks show that \\hivemem consistently improves task performance across base models while reducing token consumption by about 90\\% compared with the most efficient competing multimodal baselines.', 'score': 3, 'issue_id': 3529, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': 'cad2430d8d4add2e', 'authors': ['Haozhen Zhang', 'Bohan Liu', 'Jianzhu Bao', 'Qingyuan Liu', 'Haodong Yue', 'Xiao Li', 'Zi Pong Lim', 'Wenya Wang'], 'affiliations': ['Aumovio Singapore Pte. Ltd.', 'Nanyang Technological University', 'Sun Yat-sen University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.12872.jpg', 'data': {'categories': ['#benchmark', '#agents', '#long_context', '#graphs', '#multimodal', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Умная память мультимодальных агентов: больше контекста при меньших затратах', 'desc': 'В статье представлен HiVeMem — мультимодальная система памяти для LLM-агентов, которая помогает работать с долгой историей взаимодействий. Память организуется в виде реляционного графа с текстовыми и визуальными якорями, и найденные семантические узлы расширяются соседними эпизодами (горизонтальное расширение). Для каждого найденного воспоминания сохраняются несколько форм доказательств: саммари, подписи, визуальные фрагменты, исходные изображения и история взаимодействий, а обучаемый селектор подбирает нужный поднабор под конкретный запрос (вертикальная композиция). В экспериментах на трёх бенчмарках метод стабильно повышает качество, сокращая расход токенов примерно на 90% по сравнению с наиболее эффективными аналогами.'}, 'en': {'title': 'Expand memory, select the evidence that matters', 'desc': 'The paper introduces HiVeMem, a multimodal memory framework for helping AI agents retrieve useful information from long interaction histories. It expands semantically retrieved memories by following links in a relational graph built from textual and visual cues. For each memory, a trainable selector chooses which evidence to use, such as summaries, captions, images, or past conversation. Experiments on three benchmarks show improved performance across base models while using about 90% fewer tokens than efficient competing systems.'}, 'zh': {'title': '扩展记忆关联，按需组合多模态证据', 'desc': '这篇论文提出了名为 HiVeMem 的多模态记忆框架，帮助智能体从很长的交互历史中检索和使用信息。它将记忆片段组织成关系图，并根据语义检索结果扩展相关邻居，以补充可能遗漏的信息。每段记忆保留摘要、图像描述、视觉内容和交互历史等多种证据，再由轻量级可训练选择器针对当前查询挑选合适的证据。实验显示，该框架在三个多模态记忆基准上提升了任务表现，并比高效的竞争基线减少约 90% 的 token 消耗。'}}}, {'id': 'https://huggingface.co/papers/2611.08219', 'title': 'Agent-R^2: Scaling Agents for Realistic Productivity Work via Real-Source Data Synthesis', 'url': 'https://huggingface.co/papers/2611.08219', 'abstract': 'Abstract A real-source data synthesis framework trains a 4B agent on 4k task instances with supervised fine-tuning and rubric-based reinforcement learning, improving realistic productivity work and file-grounded reasoning over larger models.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models have made rapid progress in agentic reasoning and tool use, raising expectations for agents that can take over realistic productivity work from humans. However, current agents still struggle to finish such tasks, where success requires following long-horizon professional workflows, understanding heterogeneous file contexts, and producing usable deliverables under fine-grained requirements. A key bottleneck is the lack of scalable post-training data that reflects real work intent, authentic file environments, and deliverable-level evaluation. To close this gap, we introduce Agent-R^2, a real-source data synthesis framework that scales training data for realistic productivity work. Instead of relying on manually specified workflows or LLM-generated files, Agent-R^2 grounds synthesis throughout the pipeline in real occupational seeds, corpus-derived workflow evidence, and authentic web-sourced files. From 10k web-corpus candidates, Agent-R^2 distills 4k task instances that pair real multi-format attachments with fine-grained, deliverable-level rubrics. On this data, we train Agent-R^2-4B via supervised fine-tuning and rubric-based reinforcement learning, improving both end-to-end productivity performance and file-grounded reasoning. Trained on only 4k instances, Agent-R^2-4B surpasses Qwen3-235B-A22B-Thinking-2507 on both GDPval (51.0% vs. 48.0%) and OfficeQA (14.8% vs. 13.8%). Further analysis shows that Agent-R^2 mitigates shortcut behavior, where agents produce superficially plausible deliverables before sufficiently grounding, constructing, or verifying them, while promoting sustained exploration.', 'score': 3, 'issue_id': 3528, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'e91211f6df4b8455', 'authors': ['Teng Pan', 'Zixuan Wang', 'Yuchen Yan', 'Qifei Wu', 'Yao Chen', 'Yingqi Qu', 'Ruiqing Zhang', 'Yongliang Shen'], 'affiliations': ['Baidu Inc.', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2611.08219.jpg', 'data': {'categories': ['#small_models', '#agents', '#synthetic', '#optimization', '#training', '#reasoning', '#data', '#benchmark', '#rl', '#dataset'], 'emoji': '📊', 'ru': {'title': 'Реальные данные делают маленького агента сильнее гигантов в офисной работе', 'desc': 'Статья представляет Agent-R^2 — фреймворк синтеза данных, который создаёт обучающие примеры из реальных профессиональных сценариев и веб-файлов, а не из вручную заданных workflow или файлов, сгенерированных LLM. На основе 4 тысяч задач с детальными rubric-оценками по готовым результатам обучается агент на 4B параметров через supervised fine-tuning и reinforcement learning с rubric-based наградой. Несмотря на малый размер модели и объём данных, он превосходит Qwen3-235B-A22B-Thinking-2507 на бенчмарках GDPval и OfficeQA. Анализ показывает, что такой подход уменьшает shortcut-поведение, когда агент выдаёт правдоподобный, но необоснованный результат, и поощряет более глубокое исследование файлов.'}, 'en': {'title': 'Train Smaller Agents on Real Work for Better Results', 'desc': 'Agent-R^2 creates training tasks from real workplace examples, evidence about professional workflows, and authentic files found online. It turns 10,000 candidate examples into 4,000 tasks with realistic attachments and detailed rubrics for judging finished work. Using supervised fine-tuning and rubric-based reinforcement learning, the researchers train a 4-billion-parameter agent that performs better on productivity and file-based reasoning benchmarks than a much larger model. The agent is also less likely to give a plausible-looking answer without checking its files and work, and more likely to explore and verify its results.'}, 'zh': {'title': '用真实工作数据，让小模型更会办事', 'desc': '本文提出 Agent-R^2，一种为真实办公任务构造训练数据的框架。它从真实职业需求、工作流程证据和网络文件中整理出 4,000 个任务，并为每项任务配套多种格式的真实附件和细致的交付物评分标准。研究者用监督微调和基于评分标准的强化学习训练了一个 40 亿参数模型，使其更擅长完成完整办公任务，并依据文件内容进行推理。尽管训练数据规模较小，该模型在 GDPval 和 OfficeQA 上超过了更大的模型，也更少凭表面猜测作答，而会持续查找、构建和核验结果。'}}}, {'id': 'https://huggingface.co/papers/2610.41453', 'title': 'Evidence-Guided Recovery for AI Agents with Ambiguous Tool Outcomes and Partial Execution', 'url': 'https://huggingface.co/papers/2610.41453', 'abstract': 'Abstract  Tool timeouts can leave AI agents facing ambiguous tool outcomes and partial execution: an action may have failed, committed or remained in flight while other workflow steps have already completed. We formulate evidence-guided task recovery over approved obligations, provider capabilities and states compatible with public evidence. A shared admissibility check handles key expiry, authorization timing, dependencies and residual effects; a terminal certificate separates actual goal satisfaction from publicly supported safe completion. The known-model implementation combines standard observation-contingent planning with a separately implemented effect-history adjudicator. In a finite study of 37 assignments, planning and three active controls each certify 28 completions; four saved synthetic fee units incur additional computation. A preregistered assignment-held-out comparison then evaluates planning advice against evidence prompting with two local model bundles. Across 58 paired units in 19 previously developed task families, advice certifies 30 completions versus 9, a 36.2-percentage-point difference (exact family sign-flip p=0.0078), using 272 proposals versus 399. All 116 trajectories pass independent replay. Both models exhibit a positive completion difference. The comparison measures the evaluated advice interface under a common shield; search-versus-rule advice requires a separate matched comparison. Unknown and handoff outcomes remain explicit, with guarantees tied to the declared provider capabilities rather than arbitrary third-party exactly-once execution.', 'score': 3, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '9af71733457c383a', 'authors': ['Genliang Zhu', 'Xiaobo Chen', 'Ziyuan Wang', 'Chu Wang'], 'affiliations': ['Accentrust', 'Duke University', 'Georgia Institute of Technology', 'University of Illinois Urbana-Champaign', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2610.41453.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#agents', '#benchmark'], 'emoji': '🛠️', 'ru': {'title': 'Восстановление агента после сбоя: доказуемое завершение вместо догадок', 'desc': 'Статья посвящена тому, как AI-агенты должны восстанавливаться после таймаутов инструментов, когда результат действия неизвестен, а часть шагов уже выполнена. Авторы формализуют восстановление задач как планирование с учётом наблюдений и проверяют допустимость действий (срок действия ключей, авторизация, зависимости, остаточные эффекты). В эксперименте планирование с советами (advice) на 58 парных задачах сертифицирует 30 завершений против 9 у подсказок на основе доказательств, при этом использует меньше предложений (272 против 399). Все траектории проходят независимую проверку, а гарантии опираются на заявленные возможности провайдера, а не на произвольное exactly-once выполнение.'}, 'en': {'title': 'When Tools Time Out, Plan from Evidence', 'desc': 'The paper studies how AI agents can safely recover when a tool times out and it is unclear whether an action failed, succeeded, or is still running. It uses evidence-guided planning to choose actions that meet approved obligations while accounting for permissions, dependencies, and possible side effects. In tests, planning advice certified more task completions than evidence prompts, with every tested trajectory passing an independent replay check. Its guarantees depend on stated provider capabilities, and uncertain outcomes remain explicit rather than being treated as success or failure.'}, 'zh': {'title': '超时之后，依据证据安全恢复任务', 'desc': '论文研究工具超时后 AI 智能体如何安全恢复任务，因为操作可能已经失败、成功提交，或仍在执行。方法根据已批准的任务要求、工具能力和公开证据，判断哪些后续操作仍然允许，并区分目标确已完成与仅能安全确认的情况。在 58 组配对测试中，规划建议完成并认证了 30 项任务，证据提示完成了 9 项；所有执行轨迹都通过独立复核。研究也明确保留结果未知和需要交接处理的情况，且安全保证仅适用于预先声明的工具能力。'}}}, {'id': 'https://huggingface.co/papers/2611.00428', 'title': 'Do Multimodal Models Decide Consistently on Equivalent Optical Spectra?', 'url': 'https://huggingface.co/papers/2611.00428', 'abstract': 'Abstract  A spectrum can be given to a model as a table in nanometers or as a plot in photon energy, and the decision should not depend on which one it sees. When the data needed for an answer are missing, the model should say so. We test representation invariance and abstention on measured optical spectra of silicon metasurfaces (MOCLIP) and gold nanoparticles, with labels computed from the data. Each spectrum is shown as four tables (nm, μm, scientific notation, eV) and two plots (nm, eV), and partial spectra remove data inside or outside the queried range. We evaluate the decision models d3-nano and Jev 1.13, three GPT-6 Luna configurations and the Qwen3.5-2B base model. Changing only the representation moves accuracy by up to 41 percentage points within one model, mostly on photon-energy tables and plots. With the same evidence, asking in photon energy instead of wavelength helps some model-view pairs by 16-50 points and hurts others by up to 25. When the relevant extremum is removed, unadapted models rarely answer "undetermined". LoRA fine-tuning of d3-nano improves comparisons on the trained table formats, but much of its gain on unanswerable questions comes from a shortcut: it abstains whenever the input is truncated. Training with answerable truncations avoids the shortcut in all six seeds, with a 90-100 point gap between abstention after inside and outside cuts on held-out structures; with the same amount of extra original-task data, five of six seeds keep the shortcut. On gold spectra the two training sets perform similarly. Multimodal language models used for scientific decisions should be tested on equivalent representations and on missing evidence, not only on average accuracy. We release the tasks, per-response results and analysis code.', 'score': 3, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '6ddd74050d7120d1', 'authors': ['Ziyuan Wang', 'Genliang Zhu', 'Xiaobo Chen'], 'affiliations': ['Georgia Institute of Technology', 'Independent Researcher', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2611.00428.jpg', 'data': {'categories': ['#open_source', '#multimodal', '#interpretability', '#science', '#cv', '#training', '#hallucinations', '#benchmark', '#dataset', '#alignment'], 'emoji': '🔬', 'ru': {'title': 'Модель должна давать одинаковый ответ на одни и те же данные и честно говорить, когда данных не хватает', 'desc': 'Статья исследует, как языковые модели (LLM) принимают научные решения по оптическим спектрам, которые можно подавать в разных представлениях: таблицах и графиках в нанометрах или электронвольтах. Авторы показывают, что точность сильно зависит от формата данных, хотя смысл вопроса не меняется, а модели редко признают, что данных недостаточно. Дообучение с помощью LoRA помогает, но модель нередко учится «шорткату» и отказывается отвечать при любом обрезании спектра, поэтому нужны обучающие примеры с отвечаемыми обрезками. Вывод: мультимодальные LLM для научных задач нужно проверять на эквивалентных представлениях и на нехватке данных, а не только по средней точности.'}, 'en': {'title': 'Same Spectrum, Same Decision—And Abstain When Evidence Is Missing', 'desc': 'This paper tests whether machine-learning models make consistent decisions when the same optical spectrum is presented in different formats, such as wavelength tables, photon-energy tables, or plots. Across several models, changing only the representation can shift accuracy substantially, and the effect varies by model and format. When data needed to answer a question are missing, most unadapted models rarely abstain; LoRA fine-tuning can improve abstention, but training only on unanswerable truncated spectra encourages the shortcut of abstaining whenever input is truncated. The results show that scientific models should be evaluated for both representation invariance and reliable abstention when evidence is missing.'}, 'zh': {'title': '科学模型既要看得准，也要知道何时该弃答', 'desc': '这篇论文研究模型能否在光谱以不同形式呈现时，仍做出一致的判断，并在缺少关键数据时选择弃答。研究者使用硅超表面和金纳米颗粒的实测光谱，将数据表示为不同单位的表格或图，并测试多种模型。仅改变表示形式，就会使同一模型的准确率最多相差41个百分点；当决定答案所需的极值被删去时，未经适配的模型也很少回答“无法确定”。LoRA微调可以改善部分任务，但若训练数据设计不当，模型可能学会看到截断输入就一律弃答，因此科学决策模型应同时接受等价表示和证据缺失测试。'}}}, {'id': 'https://huggingface.co/papers/2611.17336', 'title': 'Back to Pixels: Lifting Latent Video Diffusion into Pixel Space', 'url': 'https://huggingface.co/papers/2611.17336', 'abstract': 'Abstract  Frontier video generation models work in a VAE latent space that compresses video in both space and time. This compression made training tractable, but now limits high-resolution, controllable, and interactive generation -- doubling resolution quadruples token count, conditions apply to groups of frames rather than individual ones, and each response must wait for the rest of its multi-frame block. We present PixVid, a simple yet effective method that lifts a pretrained latent video model to directly generate every frame in pixel space. PixVid keeps the diffusion transformer and replaces the VAE decoder with a convolutional head that renders its outputs into pixels. We find that predicting clean video rather than velocity, together with a larger noise shift, is key to quality. Finetuned from Wan2.1-14B, PixVid is competitive with the latent baseline within sim 1.3M training clips. Working framewise in pixels, it generates at 2times higher resolution with the same per-frame token count, keeps depth-conditioned video editing aligned under fast motion, and responds to each action at the next frame. Project page: https://chenshuo20.github.io/PixVid/', 'score': 2, 'issue_id': 3531, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '300a4fbe4f13e927', 'authors': ['Yanke Song', 'Shuo Chen', 'Chris Rockwell', 'Guande He', 'Nan Liu', 'Desai Xie', 'Tianpei Gu', 'Yong-Hyun Park', 'Aryan V S', 'Dennis Yuren Menn', 'Ming-Hsuan Yang', 'Xun Huang'], 'affiliations': ['Roblox', 'University of California, Merced', 'University of Pennsylvania', 'University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2611.17336.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#video', '#training', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Видео по кадрам, прямо в пикселях, без сжатия', 'desc': 'Статья представляет PixVid — метод, который адаптирует предобученную латентную video-модель на основе diffusion transformer, чтобы генерировать каждый кадр напрямую в пиксельном пространстве. Вместо VAE-декодера используется свёрточная голова, а обучение на чистом видео (а не на velocity) с увеличенным сдвигом шума повышает качество. Модель, дообученная из Wan2.1-14B на примерно 1.3M клипов, конкурирует с латентным baseline. Работа по кадрам в пикселях позволяет генерировать видео в 2 раза большего разрешения при том же числе токенов на кадр и реагировать на действия уже на следующем кадре.'}, 'en': {'title': 'Generate Every Frame Directly for Sharper, More Responsive Video', 'desc': 'PixVid adapts a pretrained latent video diffusion model to generate video directly in pixel space. It keeps the diffusion transformer but replaces the VAE decoder with a convolutional head, and improves quality by predicting clean frames rather than velocity while using a larger noise shift. After finetuning, PixVid performs comparably to the latent model with about 1.3 million training clips. Its framewise design supports twice the resolution at the same per-frame token count, preserves depth-guided edits during fast motion, and responds to actions on the next frame.'}, 'zh': {'title': '跳出潜在空间，让视频逐帧高清生成、即时响应', 'desc': '现有视频生成模型通常在经过 VAE 压缩的潜在空间中工作，这会限制高分辨率生成、逐帧控制和交互速度。PixVid 保留预训练模型的扩散 Transformer，并用卷积输出头替换 VAE 解码器，使模型直接在像素空间生成每一帧。研究发现，预测干净视频而非速度，并采用更大的噪声偏移，有助于提升生成质量；经过约 130 万个视频片段微调后，其表现可与潜在空间基线相当。逐帧像素生成还能在相同的每帧 token 数下实现两倍分辨率、在快速运动中保持深度条件编辑对齐，并在下一帧响应动作。'}}}, {'id': 'https://huggingface.co/papers/2611.16961', 'title': 'The Value of Thinking: Learning When to Reason in Hybrid Decision Models', 'url': 'https://huggingface.co/papers/2611.16961', 'abstract': "Abstract A hybrid decision model routes between implicit single-forward-pass answering and full autoregressive reasoning via a self-routing block trained with calibrated decision policy optimization, reducing token and latency costs while preserving accuracy.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Existing adaptive-reasoning methods shorten the explicit reasoning a model writes, or skip it by switching modes; either way the answer is still written out token by token. Rather than deciding how much to think, we explore a different paradigm, zero-or-T thinking: a single model either answers from the implicit thinking inside one forward pass, generating no token, or performs full autoregressive reasoning at a cost of T tokens when that is worth paying. We realise it in a hybrid decision model (HDM), where one frozen backbone serves both modes and a lightweight self-routing block chooses between them. The block estimates the value of thinking, the utility the slow mode is expected to add over the fast one, from what that implicit thinking has already produced, and the slow mode runs only where that value exceeds a price λ set per request. Where no per-decision label exists, as in episodic agentic tasks, we introduce Calibrated Decision Policy Optimisation (CDPO), a reinforcement-learning recipe that trains the block from episode-level returns. We evaluate HDM on MMLU-Pro, AGIEval, GPQA-Diamond, JevBench, BANKING77 and MiniWoB. Specifically, on JevBench HDM-4B scores 0.857 against Jev's 0.851 (+0.7%) at a median 0.179\\,s against 0.652 (-72.5%). On the agentic venue MiniWoB HDM-27B cuts token cost by 80.1%.", 'score': 2, 'issue_id': 3530, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '6d993b773a2f3485', 'pdf_title_img': 'assets/pdf/title_img/2611.16961.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#rl', '#inference', '#architecture', '#training', '#benchmark', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Думать только тогда, когда это действительно стоит времени', 'desc': 'Статья предлагает гибридную модель принятия решений (HDM), в которой одна замороженная LLM работает в двух режимах: быстрый ответ за один проход без генерации токенов и полное авторегрессивное рассуждение стоимостью T токенов. Лёгкий self-routing блок оценивает ценность размышления, то есть ожидаемый прирост полезности медленного режима, и запускает рассуждение только при превышении порога λ, задаваемого для каждого запроса. Для эпизодических агентных задач, где нет разметки на уровне решений, авторы применяют обучение с подкреплением CDPO, которое обучает блок по итоговым наградам эпизода. Эксперименты на MMLU-Pro, GPQA-Diamond, JevBench, MiniWoB и других бенчмарках показывают сохранение точности при существенном снижении задержки и стоимости токенов.'}, 'en': {'title': 'Think deeply only when the answer is worth the cost', 'desc': 'The paper presents a hybrid decision model that chooses between answering in one forward pass and generating a full chain of reasoning. A lightweight routing block estimates how much extra benefit reasoning may provide, then compares that value with a request-specific cost threshold. The authors introduce Calibrated Decision Policy Optimisation, which trains the router using whole-task rewards when decision-level labels are unavailable. Across several benchmarks, the approach maintains or improves accuracy while reducing latency and token use, including an 80.1% token-cost reduction on MiniWoB.'}, 'zh': {'title': '让推理只在值得时发生', 'desc': '论文提出混合决策模型（HDM），让模型在快速模式和完整自回归推理模式之间选择。快速模式利用单次前向传播中的隐式思考直接回答，不生成推理 token；完整模式则在值得投入时生成推理 token。一个轻量级自路由模块会估计完整推理相对快速回答的预期收益，并仅在收益超过设定成本时启动完整推理；对于缺少逐步决策标签的任务，论文还提出校准决策策略优化（CDPO），利用整集任务回报训练该模块。实验显示，HDM在保持甚至略微提升准确率的同时，降低了延迟和 token 成本，例如在 JevBench 上延迟降低72.5%，在 MiniWoB 上 token 成本降低80.1%。'}}}, {'id': 'https://huggingface.co/papers/2611.12750', 'title': 'The Narrative Gap: Can LLMs Help Us Navigate Diverse Narratives Across Languages?', 'url': 'https://huggingface.co/papers/2611.12750', 'abstract': "Abstract A benchmark of news articles and queries shows that current large language models cannot reliably help users navigate diverse multilingual narratives, leaving gaps in exposure to competing accounts and risking echo chambers and information disparities.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) increasingly mediate how people seek and consume information, including accounts that differ across languages and regions, especially on contested topics. Supporting diverse information seeking requires models to help users navigate competing narratives across languages and information streams. We define six capabilities necessary for diverse multilingual information seeking: three foundational capabilities for narrative inclusion, narrative exclusion, and missing narrative identification; and three higher-level capabilities for presenting diverse narratives, preserving narrative coverage under confirmatory queries, and maintaining information parity across languages. To guide the development of those information seeking capabilities, we introduce NarrativeBench, a benchmark comprising 1,333 news articles in 23 publication languages across 23 contested topics and 460 Reddit-grounded queries. Evaluating 14 LLMs across 24 query languages, we find that current models lack the capabilities needed to reliably navigate diverse narratives, limiting users' control over the perspectives they receive and leaving substantial gaps in exposure to competing accounts even when diversity is explicitly requested. Information access also differs across query framings and languages, risking echo chambers, linguistic filter bubbles, and information disparities that weaken the common ground needed for democratic discourse. NarrativeBench provides a foundation for developing information systems that give users across languages and regions agency to navigate diverse narratives.", 'score': 2, 'issue_id': 3530, 'pub_date': '2026-11-09', 'pub_date_card': {'ru': '9 ноября', 'en': 'November 9', 'zh': '11月9日'}, 'hash': '12b79dbfe94e0b9e', 'authors': ['Nikhil Sharma', 'Kelly Marchisio', 'Kenton Murray', 'Ziang Xiao'], 'affiliations': ['Cohere', 'George Mason University', 'Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2611.12750.jpg', 'data': {'categories': ['#dataset', '#ethics', '#benchmark', '#multilingual', '#low_resource', '#machine_translation', '#alignment'], 'emoji': '🌐', 'ru': {'title': 'LLM должны показывать пользователю все нарративы, а не один', 'desc': 'В статье представлен NarrativeBench — бенчмарк из 1 333 новостных статей на 23 языках и 460 запросов, основанных на Reddit, по 23 спорным темам. Авторы определяют шесть возможностей, необходимых для многоязычного поиска информации: включение, исключение и выявление недостающих нарративов, а также представление разнообразных точек зрения, сохранение покрытия при подтверждающих запросах и информационный паритет между языками. Оценка 14 LLM на 24 языках запросов показала, что современные модели не способны надёжно ориентироваться в разных нарративах, даже когда разнообразие прямо запрашивается. Это создаёт риски эхо-камер, языковых информационных пузырей и неравенства в доступе к информации, что подрывает общую основу для демократического диалога.'}, 'en': {'title': 'Put Every Language and Perspective in the Conversation', 'desc': 'The paper introduces NarrativeBench, a benchmark for testing whether large language models can help people find diverse news perspectives across languages. It includes 1,333 articles in 23 languages, covering 23 contested topics, along with 460 user queries. Evaluations of 14 models show weaknesses in finding, excluding, and identifying missing narratives, as well as in presenting diverse views and preserving coverage across query framings and languages. These gaps may limit users’ control over the information they see and contribute to echo chambers and unequal access to perspectives.'}, 'zh': {'title': '让多语言信息获取不困于单一叙事', 'desc': '本文指出，大语言模型在帮助用户跨语言了解有争议议题的不同叙事方面仍不可靠。作者提出六项评估能力，涵盖纳入、排除和发现缺失叙事，以及呈现多元观点、应对确认性提问和维持跨语言信息平等。为衡量这些能力，作者构建了 NarrativeBench，包含来自23种语言的1,333篇新闻文章、23个争议议题和460条基于 Reddit 的查询，并评测了14个模型。结果显示，现有模型即使被明确要求提供多元观点，也常遗漏竞争性叙事，而且不同提问方式和语言会造成信息获取差异。'}}}, {'id': 'https://huggingface.co/papers/2611.16409', 'title': 'Experience-Handoff Reinforcement Learning for Recursive Self-Improvement', 'url': 'https://huggingface.co/papers/2611.16409', 'abstract': 'Abstract Language-model agents trained with reinforcement learning can improve by learning to create and curate experience artifacts that help future rollouts, not just by optimizing actions from scalar rewards.  Generated by deepseek-ai/DeepSeek-V4.1-Flash It is common to train Large Language Models (LLMs) for agentic tasks with Reinforcement Learning (RL) from scalar rewards. However, this throws away the fine-grained information about the environment that the agent experienced during the trial (e.g., error logs). To utilize this rich information, recent works wrap the agent in a harness that refines its own inputs through reflection or compaction and hands past experience to future rollouts, but the construction of the handed-off artifacts (e.g., a playbook) is itself not learned. We want the best of both worlds: gradient updates from a scalar reward, while also utilizing environment information to hand off experience. As a concrete testbed, we fix the Agentic Context Engineering () harness and train one model to act, reflect, and curate task-local playbooks. Our method, , evaluates candidate experience-handoff artifacts by their downstream effect on future actor rollouts, and co-optimizes the role-specific behaviors (action generator, insight reflector, and playbook curator) under a fixed scaffold. Across agentic benchmarks,  achieves higher held-out performance than baseline methods. The results suggest that agent training should optimize not only the actions in the current rollout, but also the model-written experience that future rollouts inherit.', 'score': 2, 'issue_id': 3529, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '12dede84ed940520', 'authors': ['Doyoung Kim', 'Byeongguk Jeon', 'Kailin Zhang', 'Sherry Yang'], 'affiliations': ['KAIST AI', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2611.16409.jpg', 'data': {'categories': ['#agents', '#training', '#optimization', '#reasoning', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Учим агента не только действовать, но и писать опыт для будущих попыток', 'desc': 'Статья описывает метод обучения LLM-агентов с помощью обучения с подкреплением (RL), где агент учится не только действовать, но и создавать полезный опыт для будущих попыток. Вместо того чтобы использовать только скалярную награду, модель получает богатую информацию из среды, например логи ошибок, и на её основе формирует артефакты передачи опыта, такие как playbook. Авторы фиксируют harness Agentic Context Engineering и обучают одну модель выполнять три роли: действовать, рефлексировать и курировать playbook. Эксперименты на агентных бенчмарках показывают, что предложенный подход даёт лучшее качество на held-out выборках по сравнению с базовыми методами.'}, 'en': {'title': 'Learn from Every Rollout—and Pass the Best Lessons Forward', 'desc': 'The paper studies language-model agents trained with reinforcement learning, where scalar rewards improve actions but discard useful details such as error logs. It trains one model to act, reflect on past experience, and curate task-specific playbooks within a fixed agent scaffold. Candidate playbooks are evaluated by how much they improve the performance of future agent rollouts, and the model learns to optimize these different roles together. Across agent benchmarks, this approach outperforms baselines on held-out tasks, suggesting that agents should learn both their actions and the experience they pass on.'}, 'zh': {'title': '不只优化行动，也让经验成为智能体的优势', 'desc': '传统的强化学习通常只用标量奖励训练智能体，却忽略了错误日志等环境细节。本文在固定的智能体上下文工程框架中，训练同一个模型执行任务、反思经验并整理任务专属手册。该方法根据经验材料对后续行动表现的影响来评估材料，并共同优化行动生成、经验反思和手册整理。实验显示，它在多个智能体基准上的留出表现优于基线，说明训练不仅应优化当前行动，也应优化未来回合可继承的经验。'}}}, {'id': 'https://huggingface.co/papers/2611.14046', 'title': 'Structured Confidence Perturbation via Fisher Geometry for Adversarial Training', 'url': 'https://huggingface.co/papers/2611.14046', 'abstract': 'Abstract A hybrid adversarial training approach combining cross-entropy and KL divergence with geometry-aware perturbations on the confidence manifold improves robustness and transferability by targeting confidence structure deformation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Adversarial training is often plagued by "pseudo-attacks", perturbations that significantly increase the loss value but fail to truly alter the model\'s confidence structure. To address this, we propose two complementary approaches to directly attack and defend against confidence structure deformation. First, building upon the traditional loss maximization perspective, we introduce a hybrid objective that integrates cross-entropy and KL divergence, encouraging adversarial examples to simultaneously disrupt prediction accuracy and distribution consistency. Second, we geometrically reconstruct adversarial training by generating perturbations that maximize the distribution distance on the confidence manifold. Theoretical analysis shows that the optimal perturbation direction aligns with the principal eigenvectors of the Fisher information matrix. We also propose an efficient algorithm to avoid high-dimensional matrix computations. Experiments on multiple datasets and model architectures demonstrate that our method outperforms existing methods in adversarial robustness and robust transferability, particularly excelling in structural perturbations within high-confidence regions.', 'score': 2, 'issue_id': 3529, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '0f4053336790c2b8', 'authors': ['Chenlong Wei', 'Hanling Wang', 'Chong Zhang', 'Qinkai Yu', 'Fangyu Wu', 'Xiaobo Jin'], 'affiliations': ['University of California, San Diego', 'University of Exeter', 'Xian Jiaotong-Liverpool University'], 'pdf_title_img': 'assets/pdf/title_img/2611.14046.jpg', 'data': {'categories': ['#benchmark', '#security', '#optimization', '#training'], 'emoji': '🛡️', 'ru': {'title': 'Атакуем не только ошибку, но и саму структуру уверенности модели', 'desc': 'В статье предлагается гибридный подход к состязательному обучению (adversarial training), который объединяет функцию потерь cross-entropy и дивергенцию KL. Такой подход заставляет состязательные примеры одновременно ухудшать точность предсказаний и нарушать согласованность распределения вероятностей. Вторая часть работы строит возмущения геометрически, максимизируя расстояние между распределениями на многообразии уверенности, причём оптимальное направление связано с главными собственными векторами матрицы Фишера. Эффективный алгоритм позволяет обойтись без вычисления больших матриц, а эксперименты показывают улучшение устойчивости и переносимости атак, особенно в областях высокой уверенности модели.'}, 'en': {'title': 'Train Against Confidence Structure, Not Just Loss', 'desc': 'This paper proposes adversarial training that aims to change a model’s confidence structure, not merely increase its loss. It combines cross-entropy, which penalizes incorrect predictions, with KL divergence, which measures changes in predicted probability distributions. It also generates geometry-aware perturbations that maximize distributional distance on the confidence manifold; the theory links their direction to principal eigenvectors of the Fisher information matrix. Experiments show improved adversarial robustness and transferability across datasets and model architectures.'}, 'zh': {'title': '瞄准置信结构变形，提升对抗鲁棒性', 'desc': '本文提出一种结合交叉熵与 KL 散度的混合对抗训练方法，同时扰乱模型预测准确性和输出分布的一致性。为避免只增大损失、却未真正改变模型置信结构的“伪攻击”，作者还在置信流形上生成能最大化分布距离的几何感知扰动。理论分析表明，最优扰动方向与 Fisher 信息矩阵的主特征向量对齐，并设计了高效算法，避免直接进行高维矩阵计算。多个数据集和模型上的实验显示，该方法提升了对抗鲁棒性与鲁棒迁移能力，尤其擅长攻击高置信区域中的结构。'}}}, {'id': 'https://huggingface.co/papers/2611.00359', 'title': 'Humanized but Still True? Auditing Facts and Detection in AI-Text Humanizers', 'url': 'https://huggingface.co/papers/2611.00359', 'abstract': 'Abstract  AI "humanizers" rewrite machine-generated text so that detectors classify it as human-written. Public leaderboards score evasion and embedding similarity, but not whether checkable details survive. We check whether numbers, dates, person and organization names, and quoted spans survive each rewrite, using a rule-based checker validated by two AI annotators (precision 0.84-1.00, recall 0.93-0.95; no human annotation). In the October 2026 cycle of a public humanizer leaderboard, all 11 commercial tools changed or dropped at least one of these units in 35-65% of the documents that contained one. Most changes were to quoted spans; counting numbers and names alone, 10 of the 11 tools still altered at least one in 20% or more of the documents. The September 2026 cycle was similar (19-50%). An open 12B humanizer kept at least 97% of numbers and names in fact-dense U.S. federal agency text, but reworded 67-78% of the quoted spans, against its own prompt. Unit retention and detector evasion were not clearly related across tools (Spearman rho = -0.46, 95% CI -0.65 to 0.08), and the open model\'s four released files (two of them quantization-aware low-bit files) did not show the pre-registered monotone trade-off. On federal texts with matched human, AI-styled and humanized versions, a general-purpose decision model, Jev, asked a single zero-shot question, separated human originals from humanized rewrites with AUROC 0.864 (0.827-0.902), 0.18-0.22 higher than Binoculars, Fast-DetectGPT and the adversarially trained RADAR, while calling 24% of the human originals AI at a 0.5 threshold. On the AI-styled rewrites by 2026 models, both perplexity-based detectors scored below chance (AUROC 0.37 and 0.39), also with line breaks removed. Hypotheses, data rules and analyses were frozen before the main runs; two earlier data contacts are disclosed. We release the checker and the per-item results.', 'score': 2, 'issue_id': 3528, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'd5f64e0c0496ea71', 'authors': ['Ziyuan Wang', 'Genliang Zhu', 'Xiaobo Chen'], 'affiliations': ['Georgia Institute of Technology', 'Independent Researcher', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2611.00359.jpg', 'data': {'categories': ['#ethics', '#benchmark', '#security', '#data', '#hallucinations'], 'emoji': '🔍', 'ru': {'title': 'Гуманизаторы текста ломают факты быстрее, чем их ловят детекторы', 'desc': 'Статья исследует, сохраняют ли AI-«гуманизаторы» текста проверяемые детали — числа, даты, имена людей и организаций, цитаты — при переписывании машинно-сгенерированных текстов. Авторы используют rule-based checker, проверенный двумя LLM-аннотаторами, и показывают, что большинство коммерческих инструментов искажает хотя бы одну такую деталь в значительной доле документов. Отдельно сравниваются детекторы AI-текста: модель Jev с zero-shot вопросом лучше отличает человеческие тексты от переписанных, чем Binoculars, Fast-DetectGPT и RADAR, а перплексийные детекторы на текстах моделей 2026 года работают хуже случайного угадывания. Авторы также подчёркивают строгую предрегистрацию гипотез и публикуют чекер и результаты по каждому примеру.'}, 'en': {'title': 'Humanizing Text Shouldn’t Rewrite the Facts', 'desc': 'This study tests whether AI humanizers preserve verifiable details, including numbers, dates, names, and quotations, while rewriting text to evade AI detectors. Across leaderboard tools, many documents lost or changed at least one such detail, and keeping details intact did not clearly predict detector evasion. A general-purpose model identified humanized rewrites better than several specialized detectors, although it also mislabeled some human writing as AI-generated. Perplexity-based detectors performed worse than chance on AI-styled text, and the researchers release their checker and item-level results.'}, 'zh': {'title': '改写可以藏过检测，却未必保得住事实', 'desc': '本文评估 AI“人类化工具”改写文本时，是否会保留数字、日期、人名、机构名和引文等可核查内容。研究发现，所有 11 种商业工具都会在不少文本中改动或删除这些信息，尤其常改写引文；保留信息的能力与绕过 AI 检测器的效果没有明确关联。一个通用决策模型能较好地区分人类原文与人类化文本，但也会把一部分人类原文误判为 AI 所写；两种基于困惑度的检测器在新模型生成的 AI 风格文本上表现低于随机猜测。作者公开了检测工具和逐项结果，并说明研究方案与分析在主要实验前已预先确定。'}}}, {'id': 'https://huggingface.co/papers/2611.16321', 'title': 'From Large Language Models to Efficient System One Models via Adaptive Computation', 'url': 'https://huggingface.co/papers/2611.16321', 'abstract': 'Abstract  Transferring LLMs into System One decision models typically replaces the language modeling head with a decision head while retaining the full backbone, making every decision pay for all layers. Yet it remains unclear how much depth such decisions require. We find that decision information is concentrated in intermediate layers, with early layers building essential features and the final six layers removable without loss, while independently trained smaller models largely mimic the full model rather than developing specialized decision capabilities. These findings suggest that efficiency requires not simply smaller backbones, but shared computation across different depths. Building on this, we propose , which jointly trains a full model with prefix sub-models that share its final layers and decision head through self-distillation. A lightweight gate reads the hidden state at each exit to determine whether additional computation is needed, allowing one model to operate at multiple layers. Across seven decision benchmarks, our approach matches or outperforms independently trained models at every depth, while achieving better accuracy-efficiency trade-offs through adaptive computation.', 'score': 2, 'issue_id': 3528, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': 'd87beb912e737c3a', 'authors': ['Minh-Anh Nguyen'], 'affiliations': ['Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2611.16321.jpg', 'data': {'categories': ['#inference', '#architecture', '#optimization', '#training', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Один кусок модели — много глубин: быстрые решения без потери точности', 'desc': 'Авторы исследуют, как превратить LLM в модель принятия решений в духе System One, заменяя языковую головку decision head, но сохраняя весь backbone. Оказалось, что информация для решений сосредоточена в средних слоях, а последние шесть слоев можно удалить без потери качества, при этом небольшие независимые модели лишь копируют полную модель. Предложенный метод совместно обучает полную модель и префиксные подмодели, использующие общие последние слои и decision head, с помощью self-distillation. Лёгкий gate на каждом выходе решает, нужны ли дополнительные вычисления, и благодаря адаптивному вычислению один набор весов работает на нескольких глубинах, превосходя независимо обученные модели на семи бенчмарках.'}, 'en': {'title': 'One Model, Many Depths: Compute Only What Each Decision Needs', 'desc': 'The paper finds that decision-making information in large language models is concentrated in intermediate layers: early layers build useful features, while the final six layers can be removed without hurting performance. Smaller models trained separately mostly imitate the full model instead of learning specialized decision abilities. The proposed approach jointly trains a full model and shorter prefix models, sharing later layers and a decision head through self-distillation. A lightweight gate decides whether to use more layers, giving adaptive computation that matches or beats separately trained models across seven benchmarks with better accuracy-efficiency trade-offs.'}, 'zh': {'title': '共享计算、按需加深：让一个模型兼顾决策准确率与效率', 'desc': '将大语言模型用于快速决策时，通常会保留整个模型骨干网络，因此每次决策都要计算所有层。研究发现，决策信息主要集中在中间层：前面的层负责构建必要特征，而最后六层可以移除且不损失性能；单独训练的小模型则往往只是模仿完整模型。为提高效率，本文提出一种联合训练方法，让完整模型与多个共享末端层和决策头的前缀子模型，通过自蒸馏共同学习。模型还使用轻量门控器判断是否需要继续计算；在七个决策基准上，该方法在不同深度均达到或超过独立训练模型的表现，并通过自适应计算取得更好的准确率与效率平衡。'}}}, {'id': 'https://huggingface.co/papers/2611.16728', 'title': 'EgoX: Egocentric Cross-Embodiment Manipulation with Embodiment Dreaming', 'url': 'https://huggingface.co/papers/2611.16728', 'abstract': "Abstract EgoX is an egocentric cross-embodiment learning framework that pretrains a modular Transformer with embodiment dreaming on heterogeneous human, robot, and simulated demonstrations, then fine-tunes it to improve manipulation task progress, especially under out-of-distribution conditions.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Generalist manipulation policies can benefit from the complementary experience of humans, real robots, and simulated agents. However, differences in morphology, sensing, and control interfaces make it difficult to learn effectively from their combined demonstrations. We introduce EgoX, an egocentric cross-embodiment learning framework that organizes heterogeneous demonstrations through semantically corresponding observation and action modalities. EgoX pretrains a Modularized Cross-Embodiment Transformer with Embodiment Dreaming (MXT+) on this mixture and fine-tunes it on target-embodiment demonstrations. Within each embodiment, MXT+ assigns a dedicated tokenizer to each observation modality and a dedicated expert to each action modality, with a Transformer trunk shared across embodiments. A training-only embodiment-dreaming objective predicts latent representations of future visual and proprioceptive states, encouraging the shared trunk to model each embodiment's dynamics. Across 13 task-embodiment pairs spanning five tasks and six robot embodiments, including five physical robots and one simulated humanoid, cross-embodiment pretraining raises MXT+'s average normalized task progress from 0.63 to 0.80 over training from scratch. The gains are particularly pronounced under out-of-distribution conditions, where average task progress increases from 0.53 to 0.77. Ablations demonstrate the benefits of broader pretraining mixtures, modular interfaces, and embodiment dreaming, with dreaming producing more similar latent geometry across embodiments. Project page: egox-dream.github.io.", 'score': 1, 'issue_id': 3531, 'pub_date': '2026-11-12', 'pub_date_card': {'ru': '12 ноября', 'en': 'November 12', 'zh': '11月12日'}, 'hash': '4818ab9c2e54343a', 'authors': ['Yaru Niu', 'Binghong Chen', 'Changwei Yao', 'Shangtao Li', 'Zhenlong Fang', 'Revanth Krishna Senthilkumaran', 'Shuai Zhou', 'Yuemin Mao', 'Kalie Ching', 'Po-Ju Chao', 'Yudong Luo', 'Peiqi Yu', 'Heng Zhang', 'Hao Zhang', 'Bingqing Chen', 'Chen Qiu', 'H. Eric Tseng', 'Ye Yuan', 'Umar Iqbal', 'Changliu Liu', 'Jonathan Francis', 'Ding Zhao'], 'affiliations': ['Bosch Center for Artificial Intelligence', 'Carnegie Mellon University', 'NVIDIA', 'The University of Texas at Arlington', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.16728.jpg', 'data': {'categories': ['#synthetic', '#optimization', '#multimodal', '#training', '#robotics', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Учимся у людей и роботов сразу: один мозг для разных тел', 'desc': 'EgoX — это фреймворк для кросс-воплощённого обучения (cross-embodiment learning), который объединяет разнородные демонстрации от людей, реальных роботов и симулированных агентов. Модель MXT+ имеет модульную архитектуру: отдельные токенизаторы для каждой модальности наблюдений, отдельные эксперты для действий и общий Transformer-ствол для всех воплощений. Во время обучения используется вспомогательная цель embodiment dreaming, которая предсказывает латентные представления будущих визуальных и проприоцептивных состояний, заставляя общий ствол моделировать динамику каждого воплощения. Предобучение на смешанных данных повышает среднюю нормализованную эффективность выполнения задач с 0.63 до 0.80, а в условиях out-of-distribution рост идёт с 0.53 до 0.77.'}, 'en': {'title': 'Dream Across Embodiments, Manipulate Beyond Them', 'desc': 'EgoX learns manipulation policies from demonstrations by humans, robots, and simulations, despite differences in their bodies and interfaces. Its MXT+ model uses embodiment-specific modules for observations and actions, while sharing a Transformer trunk across embodiments. During pretraining, an embodiment-dreaming objective helps the shared trunk predict future visual and proprioceptive states. Across 13 task-embodiment pairs, cross-embodiment pretraining improves average task progress, especially in out-of-distribution conditions.'}, 'zh': {'title': '汇聚多种具身经验，让机器人操作更稳健', 'desc': 'EgoX 是一种跨具身学习框架，将人类、真实机器人和模拟智能体的示范数据结合起来，帮助机器人学习操作任务。它使用模块化跨具身 Transformer：不同具身的观察和动作模态分别由专用模块处理，同时共享 Transformer 主干网络。训练时，具身想象目标要求模型预测未来视觉与本体感觉状态的潜在表示，以学习不同具身的动态规律。实验显示，与从头训练相比，跨具身预训练能提升任务进展，尤其能增强模型在分布外条件下的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.15094', 'title': 'A frontier machine intelligence for human neuroimaging', 'url': 'https://huggingface.co/papers/2611.15094', 'abstract': 'Abstract A vision-language model trained on nearly one million clinical neuroimaging studies interprets complete examinations, discusses findings in natural language, and outperforms existing general and medical models in diagnosis, localization, reporting, and progression assessment.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Medical imaging is essential for diagnosing disease, guiding treatment and monitoring patients over time. Although artificial intelligence has advanced image interpretation, existing medical models often address restricted tasks, while general-purpose proprietary models lack access to private clinical imaging required to achieve medical expertise. Developing models that can interpret complex examinations and communicate their findings in the context of clinical decisions remains a major challenge. Here, we show that Neuro-VL, a vision-language model trained on nearly one million neuroimaging studies from routine clinical care, can interpret complete imaging examinations and engage in natural language conversations about their findings. Across internal and international datasets, Neuro-VL outperformed frontier general-purpose and specialized medical models in diagnosing, localizing, and describing abnormalities, as well as generating comprehensive radiology reports. The model also compared serial examinations to assess disease progression and more reliably resisted misleading clinical assumptions than leading frontier models from OpenAI and Google. These results extend health system learning beyond individual predictions to interactive image interpretation and longitudinal disease monitoring. They demonstrate how the collective clinical experience of health systems can be used to develop medical AI with specialized expertise and broad clinical capabilities.', 'score': 1, 'issue_id': 3530, 'pub_date': '2026-11-11', 'pub_date_card': {'ru': '11 ноября', 'en': 'November 11', 'zh': '11月11日'}, 'hash': 'b83444666c33ad30', 'authors': ['Chenhui Zhao', 'Akshay Rao', 'Akhil Kondepudi', 'Yiwei Lyu', 'Xinhai Hou', 'Rikhil Seshadri', 'Cheng Jiang', 'Soumyanil Banerjee', 'Rushikesh Joshi', 'Samir Harake', 'Ashok Srinivasan', 'Shruti Mishra', 'Francisco Rivas-Rodriguez', 'Seunghong Rhee', 'Nathaniel Roddenberry', 'Neeraj Chaudhary', 'Zach Wilseck', 'Paul Park', 'Honglak Lee', 'Vikas Gulani', 'Aditya Pandey', 'Todd Hollon'], 'affiliations': ['Semmes Murphey Clinic', 'University of Michigan', 'University of Tennessee Health Science Center'], 'pdf_title_img': 'assets/pdf/title_img/2611.15094.jpg', 'data': {'categories': ['#multimodal', '#cv', '#healthcare', '#benchmark', '#science'], 'emoji': '🧠', 'ru': {'title': 'Нейросеть, обученная на опыте клиник, читает МРТ и КТ лучше универсальных AI', 'desc': 'Авторы представляют Neuro-VL — vision-language модель (LLM с мультимодальным входом), обученную на почти миллионе нейровизуализационных исследований из рутинной клинической практики. Модель интерпретирует полные исследования, ведет диалог на естественном языке о находках и генерирует радиологические отчеты. По диагностике, локализации и описанию патологий, а также по формированию отчетов она превосходит ведущие универсальные и медицинские AI-модели. Кроме того, Neuro-VL сравнивает серийные снимки для оценки прогрессирования заболевания и устойчивее к ложным клиническим предположениям, чем модели OpenAI и Google.'}, 'en': {'title': 'From Neuroimages to Interactive, Longitudinal Insight', 'desc': 'Neuro-VL is a vision-language model trained on nearly one million routine clinical neuroimaging studies. It interprets full imaging examinations and discusses findings in natural language. Across internal and international datasets, it outperformed general-purpose and specialized medical models at diagnosing and locating abnormalities, writing reports, and assessing disease progression across scans. The results show that clinical imaging data can support interactive medical AI with broad expertise and longitudinal monitoring capabilities.'}, 'zh': {'title': '让神经影像 AI 从单次预测走向交互解读与长期监测', 'desc': '这篇论文介绍了 Neuro-VL，一个使用近百万例临床神经影像检查训练的视觉语言模型。它能够分析完整的影像检查，并用自然语言讨论异常表现、生成放射学报告。研究显示，在诊断、病灶定位、影像描述和疾病进展评估等任务中，Neuro-VL 在多个数据集上优于通用模型和专用医学模型。它也能比较不同时期的检查，并较少受误导性临床假设影响，展现了医学人工智能用于交互式影像解读和长期监测的潜力。'}}}, {'id': 'https://huggingface.co/papers/2611.14256', 'title': 'A Cross-Scenario Survey and Analysis of Self-Evolving Multimodal Agents', 'url': 'https://huggingface.co/papers/2611.14256', 'abstract': 'Abstract A survey analyzes why self-improvement mechanisms for multimodal agents transfer unevenly across reasoning, generation, navigation, and manipulation scenarios, framing them as trade-offs over scarce factors and task-structural resources.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent work shows that multimodal agents increasingly self-improve without recurring human annotation. However, each self-improvement mechanism is designed and evaluated within a single scenario, leaving its preconditions unverified under cross-scenario transfer. This survey investigates the structural source of asymmetric mechanism transfer across four scenarios: multimodal reasoning, multimodal generation, GUI and Web navigation, and embodied manipulation. We first formalize the self-evolving multimodal agent by four criteria and a differentia of self-reference, and adopt the three-stage self-evolving loop of experience generation, feedback acquisition, and update consolidation as our analytical framework to position the scenarios along ceilings on rollout count and feedback fidelity. Comparing self-evolving with fixed loops within each scenario separates the limitations that the scenario imposes from those inherent in the self-evolving design. We then recast each mechanism as a trade-off that raises a scarce factor by presupposing a task-structural resource, such as output equivalence or checkable outcomes, and judge it portable, conditional, blocked, or redundant across scenarios. We attribute the asymmetry to divergent combinations of scarce factors and resources across opposite transfer directions, and identify the matched-budget measurements that could overturn these still untested verdicts.', 'score': 1, 'issue_id': 3529, 'pub_date': '2026-11-10', 'pub_date_card': {'ru': '10 ноября', 'en': 'November 10', 'zh': '11月10日'}, 'hash': '749224dabcf44cea', 'authors': ['Jingjing Jiang'], 'affiliations': ['Homepage: https://jingjing12110.github.io/SE-MMAgents'], 'pdf_title_img': 'assets/pdf/title_img/2611.14256.jpg', 'data': {'categories': ['#benchmark', '#agents', '#survey', '#video', '#agi', '#multimodal', '#rl', '#cv', '#robotics'], 'emoji': '🧭', 'ru': {'title': 'Самообучение агентов переносится не везде одинаково: выигрывает тот, у кого есть нужные ресурсы задачи', 'desc': 'Статья анализирует, почему механизмы самосовершенствования мультимодальных агентов переносятся между сценариями неравномерно: рассуждение, генерация, навигация по GUI/Web и манипуляции в физической среде. Авторы формализуют самоэволюционирующего агента через цикл генерации опыта, получения обратной связи и консолидации обновлений, сравнивая его с фиксированными циклами внутри каждого сценария. Каждый механизм рассматривается как компромисс, который повышает дефицитный фактор и опирается на структурный ресурс задачи, например эквивалентность выходов или проверяемость результатов, и оценивается как переносимый, условный, заблокированный или избыточный. Асимметрия переноса объясняется различием комбинаций таких факторов и ресурсов, а также предлагаются эксперименты при равном бюджете, которые могут опровергнуть текущие непроверенные выводы.'}, 'en': {'title': 'Self-Improvement Transfers Only When Tasks Share the Right Resources', 'desc': 'This survey studies why self-improvement methods for multimodal agents do not transfer equally across reasoning, generation, navigation, and manipulation. It analyzes each method through a three-stage self-evolving loop: generating experience, acquiring feedback, and consolidating updates. The survey treats methods as trade-offs that improve a scarce factor but may require task-specific resources, such as outputs that can be compared or outcomes that can be checked. It classifies cross-scenario transfer as portable, conditional, blocked, or redundant, and proposes matched-budget experiments to test these judgments.'}, 'zh': {'title': '看清资源与任务结构，破解多模态自我改进的迁移难题', 'desc': '本文综述多模态智能体如何在推理、生成、界面与网页导航、具身操作等场景中自我改进，并分析改进机制为何难以跨场景迁移。作者用“生成经验、获取反馈、整合更新”三阶段框架比较各场景，并考察可生成的尝试次数和反馈可靠性等限制。研究将每种机制视为一种权衡：它提升某项稀缺因素，但依赖任务具备特定结构条件，例如输出可等价比较或结果可验证。作者据此判断机制在不同场景间是可迁移、有条件可迁移、受阻或多余，并提出需要进行预算匹配的实验来检验这些尚未验证的判断。'}}}];

            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (3)', '#agents (12)', '#agi (4)', '#alignment (2)', '#architecture (13)', '#audio (1)', '#benchmark (23)', '#cv (8)', '#data (9)', '#dataset (8)', '#diffusion (5)', '#ethics (2)', '#games (2)', '#graphs (1)', '#hallucinations (3)', '#healthcare (1)', '#inference (3)', '#interpretability (6)', '#leakage (1)', '#long_context (1)', '#low_resource (1)', '#machine_translation (1)', '#math', '#multilingual (1)', '#multimodal (13)', '#open_source (6)', '#optimization (16)', '#plp', '#rag', '#reasoning (6)', '#rl (5)', '#rlhf', '#robotics (5)', '#science (2)', '#security (3)', '#small_models (1)', '#story_generation', '#survey (3)', '#synthetic (6)', '#training (16)', '#transfer_learning', '#video (8)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-14 01:56',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-14 01:56')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-14 01:56')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
