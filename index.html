    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.08449', 'title': 'VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding', 'url': 'https://huggingface.co/papers/2611.08449', 'abstract': "Abstract  Models for physical AI tasks, such as robotics and autonomous driving, need not reason solely in language. They can use visual plans--points, bounding boxes, and trajectories--to represent spatial goals and anticipate motion. However, autoregressive vision-language models generate these plans one coordinate token at a time, making richer predictions increasingly costly. We introduce VFlash, a method for fast, accurate visual planning through Flash Primitive Decoding. VFlash exploits the known structure of visual primitives to predict their coordinates jointly, using a lightweight drafter that generates an entire primitive in one forward pass. The layout adapts to the primitive's type, dimensionality, and length, supporting compact boxes and long, variable-length trajectories. Crucially, spatial accuracy need not require reproducing an autoregressive model's exact token sequence. VFlash therefore trains on annotated primitives and directly accepts structurally valid predictions without target-token agreement. Across the evaluated 2D and 3D robot trajectory tasks, VFlash consistently reduces prediction errors relative to autoregressive decoding. Preliminary single-rollout measurements indicate approximately 25x faster generation for 3D point motion forecasting. A world action model conditioned on VFlash plans achieves 70.2% average success across four MolmoSpaces task suites, compared with 62.6% for the baseline.", 'score': 88, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '15b283ac94a42ae1', 'authors': ['Yu-Cheng Chou', 'Shihao Wang', 'Jin Huang', 'Chi-Pin Huang', 'Chiao-An Yang', 'Xianzhe Fan', 'Jing Wang', 'Zhiqi Li', 'Yuanguo Kuang', 'Ruijie Zheng', 'Johan Bjorck', 'Sifei Liu', 'Hang Su', 'Abhishek Badki', 'Lei Zhang', 'Alan Yuille', 'Linxi "Jim\'\' Fan', 'Jan Kautz', 'Zhiding Yu'], 'affiliations': ['Carnegie Mellon University', 'Google', 'Johns Hopkins University', 'NVIDIA', 'Stanford University', 'Tsinghua University', 'University of California, Los Angeles', 'University of Maryland', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.08449.jpg', 'data': {'categories': ['#video', '#robotics', '#cv', '#multimodal', '#optimization', '#inference', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Быстрое визуальное планирование: нарисовать путь целиком, а не по одной точке', 'desc': 'Статья предлагает VFlash, метод быстрого визуального планирования для физического ИИ, например робототехники и автономного вождения. Вместо поштучной генерации координат токен за токеном, как у авторегрессионных vision-language моделей, модель использует легковесный drafter, который предсказывает весь визуальный примитив (точку, бокс или траекторию) за один проход. Обучение происходит на размеченных примитивах, а структурно корректные предсказания принимаются без совпадения с целевыми токенами. В результате ошибки предсказания снижаются, а генерация для 3D-прогнозирования движения точек ускоряется примерно в 25 раз.'}, 'en': {'title': 'Plan spatially, predict coordinates together', 'desc': 'VFlash speeds up visual planning for physical AI tasks such as robotics by predicting visual primitives like points, boxes, and trajectories. Instead of generating one coordinate token at a time, its lightweight drafter predicts all coordinates in a primitive jointly in one forward pass. It trains on annotated primitives and accepts structurally valid predictions without requiring an exact match to an autoregressive model’s token sequence. In evaluated robot trajectory tasks, VFlash reduces prediction errors, generates 3D motion forecasts about 25 times faster in preliminary tests, and improves average task success from 62.6% to 70.2% when used to condition a world action model.'}, 'zh': {'title': '整段预测视觉计划，让机器人规划更快更准', 'desc': '机器人和自动驾驶等物理 AI 任务可以用点、边界框和轨迹等视觉计划表示空间目标与运动。现有自回归视觉语言模型逐个生成坐标 token，因此预测更复杂的计划时成本较高。VFlash 提出 Flash Primitive Decoding，利用视觉图元的结构，通过轻量级草稿模型一次前向传播联合预测一个完整图元，并适配不同类型、维度和长度。实验显示，VFlash 在 2D 和 3D 轨迹任务中降低了预测误差，3D 点运动预测约快 25 倍；使用其计划的世界动作模型在四组 MolmoSpaces 任务中的平均成功率达到 70.2%，高于基线的 62.6%。'}}}, {'id': 'https://huggingface.co/papers/2611.04277', 'title': 'Harness-S: Learning from Sibling Harnesses for Generalizable Agent Training', 'url': 'https://huggingface.co/papers/2611.04277', 'abstract': 'Abstract A selective harness-rescue training method uses specialized sibling harnesses to replace failed reinforcement learning rollouts and transfer their benefits into a single policy that performs better under the original base harness.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Harness evolution from a common base exhibits Locality, Complementarity, and Nonstationarity: variants repair different failures, and their utility changes as the policy learns. Rather than seeking a universally superior harness, we introduce Harness-S to selectively rescue failures of a base execution system through sibling harnesses and transfer the resulting capabilities into a single policy that remains effective under the original harness. Directional Harness Evolution develops specialized sibling harnesses along distinct repair directions, forming a reusable Sibling Harness Pool that remains fixed during policy training. Complementary Harness Rescue Training invokes this pool only when all initial attempts under the base harness fail. The same policy generates fresh rollouts under selected auxiliary harnesses, and these trajectories replace the failed group for reinforcement learning. An Adaptive Harness Router selects the Top-k variants using Harness Behavior Profiles and voting across multiple LLMs. Policy-aware profile re-anchoring refreshes this evidence as the policy learns. Across AppWorld, SWE-Gym, and DBBench, the trained policy substantially outperforms policy-only training when returned to the original base harness. Behavioral analyses and held-out cases support the transfer of harness-elicited behaviors into the policy itself. Reusing the router for Rank-1 inference provides additional gains at the same executor rollout count.', 'score': 54, 'issue_id': 3504, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'ac036a2db12ff7b0', 'authors': ['Kangning Zhang', 'Wenxiang Jiao', 'Bowen Fang', 'Shuai Shao', 'Jiachen Zhu', 'Rong Shan', 'Shijian Wang', 'Hao Wang', 'Yuan Lu', 'Weiwen Liu', 'Weinan Zhang'], 'affiliations': ['Carnegie Mellon University', 'Shanghai Jiao Tong University', 'Southeast University', 'Xiaohongshu Inc.', 'Zhongguancun Institute of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2611.04277.jpg', 'data': {'categories': ['#agents', '#reasoning', '#benchmark', '#training', '#optimization', '#rl'], 'emoji': '🛠️', 'ru': {'title': 'Учим одну политику на чужих исправлениях, а работать она будет в своём harness', 'desc': 'Статья предлагает метод Harness-S: во время обучения с подкреплением (RL) неудачные роллауты базового harness заменяются траекториями, сгенерированными специализированными sibling harness-ами, которые исправляют разные типы ошибок. Адаптивный роутер (Adaptive Harness Router) выбирает Top-k вариантов по Harness Behavior Profiles и голосованию нескольких LLM, а политика переобучается с учётом обновляемых профилей. В результате знания, полученные через альтернативные harness-ы, переносятся в одну политику, которая затем лучше работает и в исходном базовом harness. Эксперименты на AppWorld, SWE-Gym и DBBench подтверждают превосходство над обучением только политики.'}, 'en': {'title': 'Rescue failed rollouts, strengthen one policy', 'desc': 'This paper introduces Harness-S, a method that improves a policy by using specialized versions of its execution setup to rescue failed reinforcement learning rollouts. It builds a fixed pool of sibling harnesses, each designed to address different types of failures, and selects useful variants with an adaptive router. When all attempts with the original harness fail, the policy generates replacement rollouts under selected variants, and these rollouts are used for training. Experiments across three benchmarks show that the policy gains behaviors that transfer back to the original harness, outperforming training with the original harness alone.'}, 'zh': {'title': '借助专长互补的辅助框架，挽救失败轨迹并增强单一策略', 'desc': '这篇论文提出 Harness-S，通过专门设计的同源辅助执行框架，挽救基础框架下失败的强化学习采样，并把成功经验迁移到单一策略中。研究发现，不同框架能修复不同类型的失败，而且它们对策略的帮助会随训练进展而变化，因此论文构建了一个训练期间保持固定的辅助框架池。只有当基础框架下的所有初始尝试都失败时，系统才会用自适应路由器挑选辅助框架，让同一策略生成替代轨迹，并将这些轨迹用于强化学习更新。实验显示，在 AppWorld、SWE-Gym 和 DBBench 上，经过训练的策略回到原始基础框架后，表现优于仅用基础框架训练的策略，说明辅助框架激发的能力可以迁移到策略本身。'}}}, {'id': 'https://huggingface.co/papers/2611.00883', 'title': 'Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand', 'url': 'https://huggingface.co/papers/2611.00883', 'abstract': 'Abstract  Benchmark compression reduces the often prohibitive time and cost of model evaluation by evaluating models on a small benchmark subset that closely matches full-benchmark results. To quantify estimation error, we derive an accurate analytical approximation to the error distribution when estimating full-benchmark scores from a subset, showing that most subsets yield small errors, while a few produce much larger errors, resulting in a long-tailed distribution. This means random sampling alone can achieve surprisingly strong performance with high probability, but remains unstable due to rare large errors. We further show that this instability is inherent to modern foundation models and persists even as more models are evaluated. Based on these findings, we introduce BestRand, a stable and low-cost benchmark compression method that preserves the efficiency of random sampling while substantially reducing its high-error tail. We validate BestRand on 70+ text, multimodal, and agent benchmarks, and further extend it to VLA evaluation. Compared with competitive methods, BestRand reduces high-error risk by 50.2% and estimation error by 16.4% on average, while requiring only 51.3% of the construction cost. It further reduces OOD estimation error by 21.8% on average across score-range, model-family, and temporal shifts. Together, our theory provides practical guidance for understanding and predicting the accuracy and reliability of benchmark compression, while BestRand enables stable and accurate compression at low cost. The code and data are publicly available onhttps://github.com/George-Ling3/BestRand.', 'score': 50, 'issue_id': 3504, 'pub_date': '2026-10-31', 'pub_date_card': {'ru': '31 октября', 'en': 'October 31', 'zh': '10月31日'}, 'hash': '2e764387d2f921b7', 'authors': ['George Ling', 'Shanshan Zhong', 'Lijin Yang', 'Hao Yang', 'Nanxiang Li', 'Zhongzhan Huang'], 'affiliations': ['Bosch Research', 'Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2611.00883.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#data'], 'emoji': '📊', 'ru': {'title': 'Меньше примеров, стабильнее оценка: BestRand делает сжатие бенчмарков надёжным', 'desc': 'Статья посвящена сжатию бенчмарков: оценка большой языковой модели (LLM) или другой foundation-модели проводится на небольшом подмножестве тестовых примеров, а не на всём наборе. Авторы выводят аналитическое приближение распределения ошибки оценки и показывают, что это распределение имеет длинный хвост: большинство подвыборок дают малую ошибку, а редкие — очень большую. Поэтому обычная случайная выборка надёжна в среднем, но нестабильна из-за редких крупных ошибок, и эта нестабильность сохраняется при росте числа оцениваемых моделей. На основе этих выводов предложен метод BestRand, который сохраняет низкую стоимость случайной выборки и заметно снижает риск больших ошибок, показывая улучшения на более чем 70 бенчмарках, включая VLA-оценку.'}, 'en': {'title': 'Small Benchmarks, More Reliable Results', 'desc': 'This paper studies benchmark compression, which estimates full-benchmark model scores using a smaller set of examples. It shows that random subsets usually give small estimation errors, but a few cause very large errors, creating an unstable, long-tailed error distribution. The authors introduce BestRand, a low-cost method that keeps the efficiency of random sampling while reducing the risk of large errors. Across many text, multimodal, agent, and VLA benchmarks, BestRand improves estimation accuracy and reliability, including under out-of-distribution shifts.'}, 'zh': {'title': '低成本基准压缩，让模型评测更稳、更准', 'desc': '基准压缩通过挑选少量代表性样本来估计模型在完整基准上的表现，从而降低评测成本。本文推导了估计误差分布的近似形式，发现大多数子集误差较小，但少数子集会产生很大的误差，形成长尾；这种不稳定性是现代基础模型评测中的固有现象。为此，作者提出 BestRand，在保留随机抽样效率的同时减少高误差风险，并在文本、多模态、智能体和视觉—语言—动作基准上进行了验证。与有竞争力的方法相比，BestRand 平均降低高误差风险 50.2%、估计误差 16.4%，构建成本仅为其 51.3%，且在分布外评测中也能提升估计准确性。'}}}, {'id': 'https://huggingface.co/papers/2611.08373', 'title': 'SLA: Scaling Spatial-Language-Action Model via Continual Pre-training', 'url': 'https://huggingface.co/papers/2611.08373', 'abstract': 'Abstract SLA is a spatial-language-action model that continually pre-trains and post-trains a pretrained VLA policy with spatial alignment to a frozen 3D perception model, using feature-dependent gates and probabilistic state dropout to improve spatial understanding across diverse robot data while preserving inference architecture.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Reliable robotic manipulation requires both semantic understanding and precise control in three-dimensional space. However, vision-language-action (VLA) foundations largely inherit visual representations from 2D vision-language pre-training, while spatial supervision is often introduced only during task-specific adaptation. Developing spatial understanding as a transferable foundation-model capability therefore calls for learning from broader robot experience. We present SLA, a Spatial-Language-Action Model that scales implicit spatial alignment to continual pre-training and maintains it during downstream post-training. Initialized from a pretrained pi05 policy, SLA jointly optimizes action prediction and alignment between intermediate visual embeddings and spatial representations from a frozen 3D perception model. We curate and unify heterogeneous robot datasets to support spatial learning across diverse embodiments, tasks, and scenes. To accommodate this diversity, we introduce feature-dependent gates that adaptively aggregate visual embeddings from multiple VLA layers for spatial supervision. The teacher further exploits partially available depth and camera calibration alongside RGB observations, enabling effective use of heterogeneous geometric annotations. Probabilistic state dropout encourages reliance on visual cues and mitigates overfitting to demonstration trajectories. All auxiliary components are used only during training, allowing direct reuse of pretrained VLA weights and preserving the original inference architecture.', 'score': 48, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '85b1af125d69d2dd', 'authors': ['Fuhao Li', 'Wenxuan Song', 'Qizhou Huang', 'Ziyang Zhou', 'Jingbo Wang', 'Junwu E', 'Pengwei Wang', 'Yan Wang', 'Shunbo Zhou', 'Haoang Li'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'OLA Dimensions', 'The Hong Kong University of Science and Technology (Guangzhou)', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.08373.jpg', 'data': {'categories': ['#robotics', '#data', '#multimodal', '#training', '#optimization', '#3d'], 'emoji': '🤖', 'ru': {'title': 'Пространственное понимание как переносимая способность VLA-модели', 'desc': 'Статья представляет SLA — модель Spatial-Language-Action, которая расширяет предобученную VLA-политику (на базе pi05) за счёт неявного пространственного выравнивания промежуточных визуальных эмбеддингов с признаками замороженной 3D-модели восприятия. Авторы объединяют разнородные датасеты роботов и применяют feature-dependent gates для адаптивной агрегации признаков из нескольких слоёв, а также probabilistic state dropout, который снижает переобучение на демонстрационных траекториях. Учитель использует частично доступные данные о глубине и калибровке камер, что позволяет эффективно применять гетерогенные геометрические аннотации. Вспомогательные компоненты нужны только на этапе обучения, поэтому архитектура инференса и веса VLA-модели переиспользуются без изменений.'}, 'en': {'title': 'Teach robot policies 3D understanding without changing how they run', 'desc': 'SLA is a spatial-language-action model that builds 3D spatial understanding into a vision-language-action policy during both continual pre-training and later post-training. It learns to predict robot actions while aligning visual features with spatial representations from a frozen 3D perception model. Feature-dependent gates combine information from different model layers, while probabilistic state dropout encourages the policy to rely on visual input rather than memorized demonstration states. These training additions support diverse robot data without changing the policy’s inference architecture.'}, 'zh': {'title': '让机器人从多样经验中学会三维空间理解', 'desc': 'SLA 是一种空间—语言—动作模型，从预训练的 pi05 策略出发，在训练中同时学习动作预测和空间表征对齐。它将视觉特征与冻结的 3D 感知模型提供的空间表征对齐，并利用深度信息和相机标定等几何数据。模型通过特征依赖门控融合不同层的视觉特征，并用概率状态丢弃减少对示范轨迹的过拟合。所有辅助模块仅用于训练，因此推理时仍保留原有架构，并能从多样化的机器人数据中提升空间理解能力。'}}}, {'id': 'https://huggingface.co/papers/2611.07392', 'title': 'WeLM-Image: A Unified Image Generation Model towards Visual Intelligence', 'url': 'https://huggingface.co/papers/2611.07392', 'abstract': "Abstract  We present WeLM-Image, a unified image foundation model that integrates multimodal understanding into text-to-image generation, instruction-guided editing, and multi-reference synthesis. Designed for single-GPU deployment in WeChat's large-scale consumer applications, the model processes text, reference images, and target latents as one interleaved sequence. A Mixture-of-Transformers (MoT) backbone combines shared attention with independent understanding and generation parameters to limit optimization interference. Equipping each path with Mixture-of-Experts (MoE) modules provides sparse capacity, with 31.7B stored parameters and approximately 5.4B generation parameters activated per target latent token. A generation-oriented data engine combines a knowledge-grounded visual vocabulary with large-scale visual clustering to balance semantic coverage and editing tasks, while training-time evaluation guides iterative data refinement. Bilingual annotations and verified editing supervision support progressive training up to native 1.5K resolution. We optimize generation and editing separately with rubric- and checklist-based rewards, then consolidate the specialized policies through noise-aware on-policy distillation. In the reported overall comparisons, the 1536-resolution model ranks first among the evaluated open-source models on PRISM-Bench, Qwen-Image-Bench, and UnicBench. MeanFlow-based few-step distillation yields WeLM-Image-Turbo, which generates a 1024times1024 image in 4.98\\,s on a single NVIDIA H20 GPU using eight guidance-free steps.", 'score': 37, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '7b890294fb55f329', 'authors': ['Canmiao Fu', 'Chen Li', 'Guohui Zhang', 'Hao Lu', 'Hongyang Wei', 'Huadong Wu', 'Huaisong Zhang', 'Hubery Yin', 'Liyuan Cui', 'Qixin Yan', 'Tong Shao', 'Xiaoqiang Zhou', 'Xinhang Leng', 'Ying Zhang', 'Zhenhai Liu', 'Zhipeng Huang'], 'affiliations': ['WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2611.07392.jpg', 'data': {'categories': ['#open_source', '#data', '#cv', '#benchmark', '#multimodal', '#training', '#diffusion', '#optimization', '#inference', '#architecture', '#rlhf'], 'emoji': '🎨', 'ru': {'title': 'Одна модель для понимания, генерации и редактирования изображений', 'desc': 'В статье представлена WeLM-Image — единая базовая модель для работы с изображениями, которая объединяет понимание мультимодальных данных, генерацию по тексту, редактирование по инструкциям и синтез по нескольким референсам. Архитектура Mixture-of-Transformers с разделёнными параметрами для понимания и генерации и MoE-модулями даёт разреженную ёмкость: 31,7 млрд параметров хранится, а около 5,4 млрд активируется на каждый токен генерации. Обучение строится на двуязычных аннотациях, data engine с визуальным словарём и кластеризацией, а генерация и редактирование оптимизируются отдельными наградами с последующей дистилляцией политик. Версия WeLM-Image-Turbo, ускоренная MeanFlow-дистилляцией, создаёт изображение 1024×1024 за 4,98 с на одном GPU NVIDIA H20 за восемь шагов без guidance.'}, 'en': {'title': 'One model for understanding, creating, and editing images', 'desc': 'WeLM-Image is a unified image foundation model for understanding images, generating images from text, editing images with instructions, and combining multiple references. Its Mixture-of-Transformers backbone shares attention while keeping separate understanding and generation parameters, and Mixture-of-Experts modules provide sparse model capacity. The model is trained with curated visual data and verified editing examples, then improves generation and editing through separate reward-based optimization and on-policy distillation. It achieves top results among the evaluated open-source models on three benchmarks, while its Turbo version generates a 1024 × 1024 image in 4.98 seconds using eight guidance-free steps on one NVIDIA H20 GPU.'}, 'zh': {'title': '统一理解与生成，让高质量图像创作更快更灵活', 'desc': 'WeLM-Image 是一个统一的图像基础模型，能理解文字和图片，并用于文生图、按指令编辑图片和融合多张参考图。它把文字、参考图片和待生成图像的表示放进同一序列处理，并用混合 Transformer 与混合专家结构提高能力、减少任务间的干扰。模型通过专门的数据构建、分阶段训练和奖励优化来提升生成与编辑质量，再用蒸馏整合不同任务的能力。论文报告称，1536 分辨率版本在多个基准测试中领先所比较的开源模型，而 Turbo 版本可在单张 H20 GPU 上用 8 步于 4.98 秒生成 1024×1024 图像。'}}}, {'id': 'https://huggingface.co/papers/2611.06741', 'title': 'TailSteer: Trajectory-Tail Steering for Drift-Resistant Multi-turn Image Editing', 'url': 'https://huggingface.co/papers/2611.06741', 'abstract': "Abstract TailSteer, a final-stage training framework, reduces cumulative visual drift in multi-turn editing by keeping early denoising dynamics close to the base model and learning tail-focused preservation corrections from on-policy rollouts, preserving pretrained generative and editing abilities.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Strong single-turn editing performance does not guarantee reliable multi-turn interaction: as edited outputs are repeatedly reused, small unintended changes can accumulate into severe visual drift. This long-term drift is often mitigated through training on multi-turn data or cross-turn rollouts, potentially altering pretrained priors, or through specialized inference-time mechanisms that are difficult to scale to foundation models. We introduce TailSteer, a final-stage training framework that improves multi-turn robustness while retaining the generative and editing capabilities acquired through earlier training. TailSteer follows a simple principle: keep early denoising dynamics close to those of the base model and concentrate preservation corrections near the trajectory tail, where fine-grained deviations can be suppressed. These corrections are learned from the editor's own on-policy denoising rollouts, using unchanged source content as a preservation reference without requiring curated ground-truth editing pairs. Experiments across the FLUX, SenseNova, and Qwen families show that TailSteer substantially reduces cumulative drift over 15-20 editing turns while largely preserving base-model performance on extensive text-to-image and single-image editing benchmarks. These results demonstrate that long-horizon editing robustness can be unlocked in foundation models after TailSteer, rather than by relearning their existing capabilities.", 'score': 35, 'issue_id': 3504, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '411ffbe81982c681', 'authors': ['Ruikang Li', 'Zixuan Chen', 'Jiarui Wu', 'Mingde Yao', 'Yiyuan Zhang', 'Yujin Wang', 'Hanming Deng', 'Lewei Lu', 'Tianfan Xue'], 'affiliations': ['MMLab, CUHK', 'SenseTime Research', 'Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2611.06741.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#training', '#diffusion', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Удерживаем хвост траектории — сохраняем картинку на всех ходах редактирования', 'desc': 'Статья представляет TailSteer — фреймворк финального этапа обучения, который снижает накопление визуального дрейфа при многоходовом редактировании изображений. Ключевая идея: ранние шаги денойзинга оставляются близкими к базовой модели, а поправки на сохранение применяются к хвосту траектории диффузии. Эти поправки обучаются на on-policy rollouts самого редактора с неизменённым исходным контентом в роли эталона, без необходимости в размеченных парах для редактирования. Эксперименты на моделях FLUX, SenseNova и Qwen показывают заметное уменьшение дрейфа за 15–20 ходов при сохранении качества базовой модели на text-to-image и single-image editing бенчмарках.'}, 'en': {'title': 'Keep the edits; stop the drift', 'desc': 'TailSteer is a final-stage training method that helps image-editing models avoid visual changes that build up over repeated editing turns. It keeps the model’s early denoising steps close to the original model and learns preservation corrections for the final steps. The method learns from the model’s own on-policy denoising rollouts, using unchanged parts of the source image as a reference rather than curated editing pairs. Tests across several model families show less drift over 15–20 turns while largely retaining text-to-image and single-image editing performance.'}, 'zh': {'title': '稳住去噪轨迹后段，让多轮编辑不再越改越偏', 'desc': 'TailSteer 是一种训练框架，旨在减少多轮图像编辑中逐渐累积的视觉偏移。它让去噪过程的早期阶段尽量贴近基础模型，只在生成轨迹的后段加强对原有内容的保留。训练时，TailSteer 利用模型自身生成的去噪过程作为样本，并以未改变的源内容为参考，无需人工整理成对编辑数据。实验显示，它能在多轮编辑中显著减少内容漂移，同时基本保留模型原有的文本生成与单轮编辑能力。'}}}, {'id': 'https://huggingface.co/papers/2611.03743', 'title': 'EvoMemState: Evolving Memory State for Personal Agents', 'url': 'https://huggingface.co/papers/2611.03743', 'abstract': 'Abstract  Long-term memory enables large language model (LLM) agents to provide continuous personalized assistance by retaining user information across interactions. Existing systems support this process through fact extraction, organization, updating, and retrieval, but largely maintain memories as independent facts. This fact-centric paradigm may overlook how new facts update, constrain, or conflict with earlier ones, while leaving their applicability, role, and priority for the current request implicit. In this paper, we introduce EvoMemState, a state-centric framework that augments persistent facts with two complementary states: Relational States that capture how facts remain valid and relate to one another as memory evolves, and a Reasoning State that determines how these facts should be applied to the current request. Specifically, EvoMemState consists of three key components: (i) Ontology-Guided Memory State Induction extracts Persistent Facts and constructs Relational States that maintain their validity, scope, and evolving relations. (ii) RL-Based State Evolution internalizes memory-use experience into a policy through reinforcement learning to generate a request-specific Reasoning State. (iii) State-Aware Reasoning then combines the relevant facts with their Relational States and the generated Reasoning State to guide the personal agent. Extensive experiments on long-term dialogue and memory-use benchmarks demonstrate consistent improvements over existing memory systems in retrieval completeness and memory-grounded response accuracy. Our code and implementation details are available at https://github.com/XMUDeepLIT/EvoMemState.git.', 'score': 20, 'issue_id': 3504, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '25d9e6f33264c3ba', 'authors': ['Zhishang Xiang', 'Yunbo Tang', 'Zhongqiao Liu', 'Junkai Chen', 'Zerui Chen', 'Qingguo Hu', 'Yuxuan Zhang', 'William Grant', 'Qinggang Zhang', 'Jinsong Su'], 'affiliations': ['Jilin University', 'Nanyang Technological University', 'University of British Columbia', 'University of Waterloo', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2611.03743.jpg', 'data': {'categories': ['#agents', '#long_context', '#reasoning', '#benchmark', '#alignment', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Память, которая понимает не только факты, но и их связи и применение', 'desc': 'В статье представлен EvoMemState, фреймворк для долговременной памяти LLM-агентов, который выходит за рамки хранения независимых фактов. Помимо персистентных фактов, система строит Relational States, отражающие актуальность, область применимости и связи между фактами по мере эволюции памяти. Reasoning State, генерируемое с помощью обучения с подкреплением (RL), определяет, как именно применять факты к текущему запросу. Эксперименты на бенчмарках длинного диалога и использования памяти показали улучшение полноты поиска и точности ответов.'}, 'en': {'title': 'Remember the facts—and how to use them', 'desc': 'EvoMemState is a long-term memory framework for LLM agents that tracks more than isolated user facts. It adds Relational States to show how facts relate, change, and remain valid, including their scope. Reinforcement learning helps produce a request-specific Reasoning State that guides which memories to use. Experiments show improved memory retrieval and accuracy in responses grounded in user information.'}, 'zh': {'title': '让记忆不仅保存事实，更懂事实之间的关系与当下用途', 'desc': '这篇论文提出 EvoMemState，一种面向大语言模型智能体的长期记忆框架，不再只把记忆看作彼此独立的事实。它通过本体引导的记忆状态归纳提取持久事实，并构建关系状态，记录事实的有效性、适用范围及彼此关系如何随时间变化。框架还利用强化学习形成策略，为当前请求生成推理状态，指明应如何使用记忆中的事实。实验表明，将相关事实、关系状态和推理状态结合起来，能提升记忆检索的完整性以及回答对记忆的依据程度。'}}}, {'id': 'https://huggingface.co/papers/2611.07854', 'title': 'Towards Foundation Decision Models: Drex', 'url': 'https://huggingface.co/papers/2611.07854', 'abstract': 'Abstract Drex open decision models return probability distributions over user-supplied options without autoregressive decoding, using supervised fine-tuning, RLAF, and consistency losses to improve accuracy, robustness, and latency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Autoregressive approaches with large language models, such as long chain-of-thought reasoning, have become the default for new AI applications because they reach higher accuracy on a wide range of tasks. In production, however, they give inconsistent answers, require parsing of outputs, and add cost and latency. Decision models address this: given a question and a set of options supplied by the user, they return a probability distribution over the options without autoregressive decoding. We present Drex, a family of four open decision models with 8B (DLM), 9B (v1.5), 35B with 3B active (v2.0), and 27B (Max) parameters. Each request consists of a state (a document, record, or agent context, optionally with images) and questions about it, each asking for a choice among options, a yes/no judgment, or a score on an ordered scale. Training combines supervised fine-tuning with reinforcement learning from adjusted feedback (RLAF), plus vision tuning for Max. Ablations show that RLAF improves accuracy and that consistency losses improve robustness to option order. On Decision Index 0.4.1, Max sets a new state of the art among the decision models we compare (67.52 on the public suite vs. 60.70 for Jev 1.14.0). On Decision Bench v4, it is statistically tied with d3-turbo and GPT-6 Sol and trails Claude Opus 5.5 by 1.6 points, and it has the highest accuracy among decision models on DecideBench. Max answers a typical request in 183 ms, against about 2.0 s for GPT-6 Sol and 3.5 s for Claude Opus 5.5, and its outputs are stable under option reordering. All four models are open source: https://github.com/nace-ai/drex-decision-models', 'score': 18, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '5fb36bb46ad511b2', 'authors': ['Nischay Dhankhar', 'Alisher Amantay', 'Zhanibek Datbayev', 'Darkhan Akhmetov', 'Yash Shah', 'Nurmukhamed Ubaidullayev', 'Raman Saparkhan', 'Dos Baha', 'Abulhair Saparov'], 'affiliations': ['Department of Computer Science, University of Oxford', 'Department of Statistics, University of Bristol'], 'pdf_title_img': 'assets/pdf/title_img/2611.07854.jpg', 'data': {'categories': ['#small_models', '#open_source', '#benchmark', '#alignment', '#multimodal', '#training', '#optimization', '#inference', '#rlhf'], 'emoji': '⚡', 'ru': {'title': 'Решения за миллисекунды: быстрые и стабильные decision-модели вместо долгой генерации текста', 'desc': 'В статье представлено семейство открытых decision-моделей Drex (от 8B до 35B параметров), которые возвращают вероятностное распределение по вариантам, заданным пользователем, без авторегрессионной генерации. Обучение сочетает supervised fine-tuning, обучение с подкреплением на скорректированной обратной связи (RLAF) и consistency losses для устойчивости к порядку вариантов, а для версии Max добавлен vision tuning. Модель Max показывает state-of-the-art результаты среди сравниваемых decision-моделей и сопоставимую точность с крупными LLM, при этом отвечает примерно в 10–20 раз быстрее (183 мс). Все модели открыты и доступны на GitHub.'}, 'en': {'title': 'Choose Faster, Stay Consistent', 'desc': 'Drex is a family of decision models that predicts a probability distribution over user-provided answers, rather than generating a response token by token. The models are trained with supervised fine-tuning and reinforcement learning from adjusted feedback (RLAF), while consistency losses help them stay reliable when answer options are reordered. Drex Max achieves strong results on several decision benchmarks, including the best accuracy among decision models on DecideBench. It also responds much faster than the compared large language models, and the models are open source.'}, 'zh': {'title': '不必长篇生成，快速稳健地做出选择', 'desc': 'Drex 是一系列开放式决策模型：给定一段文本或图像等上下文，以及用户提供的问题和选项，直接输出各选项的概率分布，而不必逐字生成答案。模型通过监督微调和基于调整后反馈的强化学习（RLAF）训练，Max 版本还加入了视觉微调。实验表明，RLAF 能提高准确率，一致性损失则能增强模型对选项顺序变化的鲁棒性；Max 在多个决策基准上表现出色。Max 通常只需 183 毫秒就能完成回答，比文中比较的若干大型语言模型更快。'}}}, {'id': 'https://huggingface.co/papers/2611.04894', 'title': 'VisSearch-Bench: Evaluating Long Horizon Visual Search in Multimodal Agents', 'url': 'https://huggingface.co/papers/2611.04894', 'abstract': 'Abstract VisSearch-Bench evaluates multimodal agents on visually intensive search tasks that require integrating visual context with external information, showing that even the best system fully solves only 26.47% of tasks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Multimodal agents use web and image tools to answer questions beyond their internal knowledge. Some search tasks use images mainly to identify an initial entity, then rely on text retrieval. These tasks offer limited insight into how agents connect information across images, objects, and search steps. We therefore focus on visual context management. This involves organizing and using visual information and linking it to other findings during search. Visually intensive tasks require agents to combine object appearance, local details, or spatial relations with external information. We introduce VisSearch-Bench, with 204 human-written tasks across 7 main domains and 25 subdomains. It covers Set-wise Visual Search, Sequential Visual Search, Hybrid Wide-Deep Search, Competitive Visual Disambiguation, and Visual-Structure-Guided Search. Each task provides a reference answer, traceable evidence, and scoring rules. Accuracy measures complete task success, while Process Score measures the correctness and completeness of individual results and subquestion answers. Across 16 multimodal models, the best system fully solves only 26.47% of tasks, even with search tools. These results highlight the challenge of linking visual evidence with search results to produce complete answers.', 'score': 17, 'issue_id': 3504, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '8cba749707dc0d43', 'authors': ['ZhengXian Wu', 'Qianhao Nie', 'Zhuohong Chen', 'Junjie Gao', 'Yuyao Zhang', 'Yunyao Yu', 'Hangrui Xu', 'Cheng Cheng', 'Guiyu Ma', 'Jin Zhang', 'Xingzhong Xu', 'Kai Yang', 'Haoqian Wang'], 'affiliations': ['Ant Group', 'Renmin University of China', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.04894.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#cv'], 'emoji': '🔍', 'ru': {'title': 'Агенты видят, но пока плохо связывают увиденное с поиском', 'desc': 'Авторы представляют VisSearch-Bench, новый бенчмарк для оценки мультимодальных агентов (multimodal agents) на задачах визуального поиска, где нужно объединять визуальный контекст с внешней информацией. В наборе 204 задачи, написанные людьми, охватывающие 7 доменов и 25 поддоменов, с эталонными ответами, трассируемыми доказательствами и правилами оценки. Помимо метрики Accuracy, измеряющей полный успех задачи, вводится Process Score, оценивающий корректность и полноту промежуточных результатов и ответов на подвопросы. Эксперименты на 16 мультимодальных моделях показали, что лучшая система полностью решает лишь 26,47% задач даже с поисковыми инструментами, что подчёркивает сложность связывания визуальных доказательств с результатами поиска.'}, 'en': {'title': 'Seeing Is Not Enough: Agents Must Connect Visual Evidence to Search', 'desc': 'VisSearch-Bench tests whether multimodal agents can use visual details and web search together to answer complex questions. It includes 204 tasks across seven domains, covering different ways of searching for and comparing visual information. The benchmark scores both complete task accuracy and the correctness of steps along the way. Across 16 models, the best system fully solved only 26.47% of tasks, showing that connecting visual evidence with search results remains difficult.'}, 'zh': {'title': '看懂图像，更要串联证据', 'desc': 'VisSearch-Bench 用来评估多模态智能体处理复杂视觉搜索任务的能力，这类任务需要结合图像线索与外部搜索信息。基准包含 204 项人工编写的任务，覆盖 7 个领域和 25 个子领域，并提供可追溯证据与评分规则。研究分别用准确率衡量任务是否完整完成，并用过程分数评估各项结果和子问题回答的正确性与完整性。在测试的 16 个多模态模型中，表现最好的系统也只完整解决了 26.47% 的任务，说明将视觉证据与搜索结果连贯整合仍十分困难。'}}}, {'id': 'https://huggingface.co/papers/2611.06817', 'title': 'Open-HumanScale: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models', 'url': 'https://huggingface.co/papers/2611.06817', 'abstract': 'Abstract  Egocentric human video offers a scalable source of manipulation priors for robot learning, yet translating raw data scale into generalizable robot policies demands rigorous data curation and training recipes. We introduce Open-HumanScale, the first fully open recipe for scaling egocentric pretraining to 50,000 hours, anchored by Open-HumanScale-50K---a curated egocentric video corpus densely annotated with hand motion and natural language. Leveraging this corpus, we systematically investigate pure human pretraining via closed-loop simulation evaluations and uncover an empirical log-linear scaling law linking pretraining data hours to downstream robot success rates. Grounded in these findings, we develop HumanWAM-Vanilla, a world--action model pretrained exclusively on 50k hours of egocentric human video. Upon robot post-training, HumanWAM-Vanilla reaches 92.08% success on RoboTwin 2.0 Clean2Clean and 68.88% on Clean2Random, alongside a 14.17% mean success rate and a 19.00 mean progress score on RoboDojo. To push the capability frontier further, we explore joint human--robot pretraining with HumanWAM-Goal, a visual-goal-conditioned world--action model. Hybrid data scaling unlocks broad zero-shot generalization across both simulation and physical benchmarks, propelling post-trained RoboTwin 2.0 performance to new state-of-the-art levels: 92.70% on Clean2Clean and a substantial leap to 84.60% on Clean2Random. On physical robots, HumanWAM-Goal further exhibits emergent embodied in-context learning, dynamically adapting its manipulation behavior to unseen visual goals without parameter updates. To support reproducible scaling research in embodied AI, we open-source the Open-HumanScale-50K corpus, data curation and pretraining pipelines, alongside the pretrained and post-trained HumanWAM checkpoints, inference code, and simulation evaluation suites.', 'score': 14, 'issue_id': 3504, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': '3c78e4eb41b8f121', 'authors': ['Juncheng Ma', 'Jiaxin Li', 'Jiankai Tu', 'Bo Liang', 'Guodong Lv', 'Yufan Deng', 'Junzhe Tang', 'Liangzhu Yang', 'Chen Bian', 'Shukai Gong', 'Yintianrun Zhang', 'Zicong Cao', 'Baohao Zhu', 'Jianxin Bi', 'Tengfei Yan', 'Yinyuan Zhang', 'Kewei Zhang', 'Xinglong Chen', 'Kaiqi Chen', 'Duomin Wang', 'Xiaotian Tang', 'Liang Tan', 'Li Li', 'Yuan Xu', 'Haosen Yang', 'Yuqi Wang', 'Jingfei Xia', 'Songyan Huang', 'Zhiyang Dou', 'Zhen Dong', 'Enze Xie', 'Tat-Seng Chua', 'Daquan Zhou'], 'affiliations': ['MIT', 'NUS', 'NVIDIA', 'PKU', 'UCSB'], 'pdf_title_img': 'assets/pdf/title_img/2611.06817.jpg', 'data': {'categories': ['#video', '#robotics', '#open_source', '#dataset', '#agents', '#data', '#benchmark', '#synthetic', '#multimodal', '#training'], 'emoji': '🤖', 'ru': {'title': 'Человеческое видео — масштабируемый учитель для роботов', 'desc': 'Статья представляет Open-HumanScale — открытый рецепт масштабирования предобучения на egocentric видео от первого лица до 50 000 часов, включая датасет Open-HumanScale-50K с разметкой движений рук и естественно-языковыми описаниями. Авторы находят эмпирический log-linear scaling law, связывающий объём данных с успешностью роботов в симуляции, и обучают world-action модель HumanWAM-Vanilla только на человеческом видео. Гибридное предобучение на людях и роботах (HumanWAM-Goal, условная на визуальной цели) даёт state-of-the-art результаты на RoboTwin 2.0 и проявляет embodied in-context learning на физических роботах. Все данные, код, пайплайны и чекпоинты открыты для воспроизводимых исследований в embodied AI.'}, 'en': {'title': 'Scale Human Experience into More Capable Robots', 'desc': 'The paper introduces Open-HumanScale-50K, a curated collection of 50,000 hours of egocentric human video annotated with hand motion and language, plus an open recipe for training robot models on it. Experiments show a log-linear scaling law: more human-video pretraining data is associated with higher robot task success. A world-action model pretrained on human video performs well after robot post-training, while combining human and robot data in a visual-goal-conditioned model improves generalization further. The combined-data model reaches strong simulation results and adapts to unseen visual goals on physical robots without changing its parameters; the authors release the data, models, and evaluation tools.'}, 'zh': {'title': '让海量人类视频教会机器人泛化操作', 'desc': '本文提出 Open-HumanScale，提供将第一人称人类视频扩展到 5 万小时的开放训练方案，并构建带有手部运动和自然语言标注的数据集。研究发现，人类视频预训练时长与机器人下游任务成功率之间存在对数线性缩放规律。基于这些数据，作者训练了世界—动作模型，并通过机器人后训练，在模拟操作任务中取得较高成功率；结合人类与机器人数据的模型还能提升泛化能力。模型在实体机器人上无需更新参数，就能根据未见过的视觉目标调整操作行为，展现出具身上下文学习能力。'}}}, {'id': 'https://huggingface.co/papers/2611.06976', 'title': 'On the Opportunities and Challenges of Prefill-to-Autoregressive Cross-Model Transfer', 'url': 'https://huggingface.co/papers/2611.06976', 'abstract': "Abstract  Prefill-to-Autoregressive Cross-model Transfer (PACT), a form of latent communication between language models, combines a larger model's prompt representations with a smaller model's efficient generation, offering a promising way to balance capability and inference cost. However, existing systems provide limited support for independently evaluating large-small model collaboration, and improved task performance alone does not establish whether the receiver benefits from the sender's information. We introduce PLatour, an open-source PACT framework that connects frozen models through lightweight, zero-initialized linear bridges trained directly with task rewards and supports hybrid-attention architectures. PLatour significantly outperforms open-source baselines on generation tasks and surpasses Mostik's reported results on shared mathematics and coding benchmarks using a substantially smaller sender. However, controlled experiments show that the gains on some tasks can be reproduced by uninformative sender signals, self-communication, or receiver-only training. We find that trainable bridges can act as parameter-efficient adaptation mechanisms without exploiting useful sender information. We therefore propose PACT-Check to quantify how much of a trained PACT system's gain genuinely comes from communication. Finally, we discuss the opportunities and challenges of PACT systems. Code is available at https://github.com/zhenyi4/platour.", 'score': 12, 'issue_id': 3505, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'f62078385c2f3a81', 'authors': ['Zhenyi Shen', 'Junru Lu', 'Wei Liu', 'Jiangnan Ye', 'Jiazheng Li', 'Di Yin', 'Xing Sun', 'Tameem Adel', 'Yali Du', 'Lin Gui', 'Yulan He'], 'affiliations': ['Kings College London, UK', 'National Physical Laboratory, UK', 'Tencent Youtu Lab, China'], 'pdf_title_img': 'assets/pdf/title_img/2611.06976.jpg', 'data': {'categories': ['#transfer_learning', '#plp', '#interpretability', '#benchmark', '#training', '#optimization', '#open_source', '#architecture'], 'emoji': '🔗', 'ru': {'title': 'Польза общения моделей нужно доказывать, а не предполагать', 'desc': 'Статья представляет PLatour — открытый фреймворк для PACT, то есть латентной коммуникации между языковыми моделями, где большая модель-отправитель передаёт представления промпта маленькой модели-получателю, которая выполняет генерацию. Замороженные модели связываются лёгкими линейными мостами с нулевой инициализацией, которые обучаются напрямую по task rewards и поддерживают гибридное внимание. Метод превосходит open-source baselines на задачах генерации и обходит результаты Mostik на математических и кодовых бенчмарках, используя значительно меньшего отправителя. Однако контрольные эксперименты показали, что часть прироста воспроизводится бесполезными сигналами отправителя, self-communication или обучением только получателя, поэтому авторы предлагают PACT-Check для оценки вклада именно коммуникации.'}, 'en': {'title': 'Measure the Message, Not Just the Gain', 'desc': 'The paper introduces PLatour, an open-source framework for Prefill-to-Autoregressive Cross-model Transfer (PACT), where a large language model sends prompt representations to a smaller model through a trainable linear bridge. The framework supports frozen models, hybrid-attention architectures, and training the bridge directly with task rewards. Although PLatour improves on several benchmarks, controlled tests show that some gains can also come from receiver-only training or uninformative signals, rather than useful information from the sender. The authors propose PACT-Check to measure how much performance improvement genuinely depends on communication between the models.'}, 'zh': {'title': '不只看性能提升：检验跨模型通信是否真正传递了价值', 'desc': '论文提出 PLatour，一个用于研究预填充到自回归跨模型迁移（PACT）的开源框架，让冻结的大模型通过轻量、零初始化的线性桥向小模型传递表示，并依据任务奖励训练桥接层。它支持混合注意力架构，在多项生成、数学和代码任务上超过了已有开源基线，且部分结果使用了更小的发送模型。研究也发现，某些性能提升即使使用无信息的发送信号、自我通信或仅训练接收模型也能复现，说明可训练桥接层可能只是参数高效的适配机制，并未真正利用发送方信息。为此，作者提出 PACT-Check，用于衡量系统增益中有多少确实来自模型间通信，并讨论了 PACT 的机遇与挑战。'}}}, {'id': 'https://huggingface.co/papers/2611.07909', 'title': 'EDGAR: Efficient Diffusion-Driven Gaussian Avatar Refinement via Synthetic Failure', 'url': 'https://huggingface.co/papers/2611.07909', 'abstract': 'Abstract EDGAR is a conditional diffusion framework with a fusion block and Mixture-of-Experts that refines degraded Gaussian head avatars by injecting self-supervised identity features, using refined multi-view renderings as pseudo-targets to optimize a single avatar.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advances in Gaussian splatting have enabled efficient and photorealistic head avatar reconstruction, yet monocular video-based or image-based methods still suffer from under-constrained geometry and texture, leading to artifacts such as blurring, stretching, and temporal instability. We present EDGAR (Efficient Diffusion-Driven Gaussian Avatar Refinement), a conditional diffusion framework designed to enhance the quality of Gaussian avatars by correcting artifacts while preserving identity fidelity. To train EDGAR, we construct EDGAR-SET, a hybrid triplet dataset composed of real-captured and synthetic-rendered samples, which simulates realistic Gaussian avatar failure cases by pairing degraded renderings with ground-truth and reference images. EDGAR refines degraded frames through a fusion block that injects identity features extracted by the self-supervised Sapiens model into a one-step diffusion backbone, enabling effective artifact removal without sacrificing efficiency. Our EDGAR model incorporates a Mixture-of-Experts (MoE) architecture to address diverse degradation types and severity levels. The refined multi-view renderings are subsequently used as pseudo-targets to optimize a single underlying Gaussian avatar, so that the final avatar can be rendered without applying EDGAR to every output frame. Experiments on three different Gaussian avatar reconstruction methods, each evaluated under three different settings, show improvements in both perceptual and reconstruction measures over the raw outputs and an SDEdit-style refinement baseline. In addition, cross-view evaluation demonstrates improved calibrated consistency, while tests under large yaw and open-mouth expressions verify robustness under extreme settings. These results collectively indicate a useful operating regime for recoverable appearance artifacts. The code is available at https://kwanyun.github.io/edgar/', 'score': 10, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '044515833d30a857', 'authors': ['Kwan Yun', 'Minhyeok Bang', 'Colette Suhjung Koo', 'Junyong Noh'], 'affiliations': ['KAIST, Visual Media Lab, South Korea'], 'pdf_title_img': 'assets/pdf/title_img/2611.07909.jpg', 'data': {'categories': ['#video', '#dataset', '#cv', '#training', '#diffusion', '#optimization', '#3d', '#architecture'], 'emoji': '🧑\u200d🎨', 'ru': {'title': 'Один раз очистили — и аватар сияет в каждом кадре', 'desc': 'Статья представляет EDGAR — условную диффузионную модель, которая исправляет артефакты (размытие, растяжение, временную нестабильность) в Gaussian-аватарах головы, восстановленных по монокулярному видео или изображениям. Модель использует fusion block, внедряющий признаки идентичности от self-supervised модели Sapiens в одношаговый diffusion backbone, а Mixture-of-Experts (MoE) позволяет обрабатывать разные типы и степени деградации. Для обучения создан гибридный датасет EDGAR-SET из реальных и синтетических триплетов, а уточненные мультиракурсные рендеры используются как pseudo-targets для оптимизации одного аватара, так что диффузия не нужна на каждом кадре. Эксперименты показывают улучшение перцептивных и реконструкционных метрик и устойчивость при больших углах поворота и открытом рте.'}, 'en': {'title': 'Refine the Views, Improve the Avatar', 'desc': 'EDGAR improves Gaussian head avatars by using conditional diffusion to remove visual artifacts while preserving identity. It injects self-supervised identity features into a one-step diffusion model, with a Mixture-of-Experts that handles different kinds and levels of degradation. The refined views become pseudo-targets for optimizing one Gaussian avatar, so EDGAR need not process every frame at runtime. Tests across several reconstruction methods show better perceptual quality, reconstruction accuracy, and consistency across views, including challenging poses and expressions.'}, 'zh': {'title': '用身份感知扩散修复高斯头像，让多视角细节更清晰一致', 'desc': '这篇论文提出 EDGAR，一种基于条件扩散模型的高斯头像修复框架，旨在去除模糊、拉伸等瑕疵，同时保留人物身份特征。它通过融合模块将自监督 Sapiens 模型提取的身份特征注入单步扩散网络，并使用混合专家（MoE）架构处理不同类型和程度的退化。为训练模型，作者构建了包含真实采集和合成渲染样本的三元组数据集 EDGAR-SET。修复后的多视角图像被用作伪目标来优化单个高斯头像，因此最终渲染时无需逐帧运行 EDGAR；实验显示该方法在多种设置下提升了感知质量、重建效果和跨视角一致性。'}}}, {'id': 'https://huggingface.co/papers/2611.04527', 'title': 'Future Representation Distillation for Imagination-free World Action Models', 'url': 'https://huggingface.co/papers/2611.04527', 'abstract': "Abstract DreamFree repurposes a pretrained video diffusion model as a predictive visual encoder through representation distillation, enabling real-time robot action prediction without generating future videos and improving control and learning from video demonstrations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash World Action Models (WAMs) use the predictive knowledge of pretrained video diffusion models for robot control through future video prediction. However, iterative video denoising is costly, and inaccurate visual predictions can compromise action prediction. Our key idea is to make this predictive knowledge available through visual representations computed from the current observation, enabling action prediction without generating future videos. We introduce DreamFree, a WAM that repurposes a pretrained video diffusion model as a predictive visual encoder through representation distillation. The visual encoder learns to predict a frozen video diffusion model's representation using only the current observation. An action module is then trained to predict actions by extracting action-relevant information from the visual encoder. Across real-world and simulated tasks, DreamFree achieves higher success rates than state-of-the-art VLAs and WAMs, while performing real-time closed-loop control at 11Hz with a 14B video diffusion backbone. Experiments show that DreamFree can translate stronger video priors and additional video data into better robot control and enable learning new robot tasks from video demonstrations, including videos from a different embodiment, without action annotation for the new tasks.", 'score': 7, 'issue_id': 3504, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'c1a5374cd3a18d67', 'authors': ['Jaehyeong Jo', 'Sangwon Jang', 'Sihyun Yu', 'Seonghyeon Ye', 'Yekyung Nah', 'Hojung Jung', 'Kimin Lee', 'Sung Ju Hwang'], 'affiliations': ['KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2611.04527.jpg', 'data': {'categories': ['#video', '#robotics', '#synthetic', '#training', '#diffusion', '#optimization', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Предсказывать будущее без генерации видео: быстрое и точное управление роботом', 'desc': 'DreamFree — это модель для управления роботами, которая использует предобученную video diffusion модель как предиктивный визуальный энкодер. Вместо генерации будущих видео система через representation distillation учится предсказывать представление замороженной диффузионной модели, используя только текущее наблюдение. Далее action module извлекает из этих признаков информацию, необходимую для предсказания действий. Благодаря этому DreamFree работает в реальном времени (11 Гц) с 14B backbone и превосходит современные VLA и WAM, а также умеет обучаться новым задачам по видео демонстрациям без разметки действий.'}, 'en': {'title': 'Predict the Future, Act Without Generating It', 'desc': 'DreamFree uses a pretrained video diffusion model to help a robot choose actions, without generating future videos. It distills the model’s predictive knowledge into a visual encoder that predicts useful representations from the current observation. An action module uses these representations to predict robot actions, enabling real-time closed-loop control. Tests show improved task success and that the method can learn new tasks from unlabelled demonstration videos, even when they show a different robot body.'}, 'zh': {'title': '不生成未来视频，也能让机器人预见并行动', 'desc': '世界动作模型（WAM）利用视频扩散模型对未来的预测来控制机器人，但生成视频需要反复去噪，计算开销大，预测不准也会影响动作。DreamFree通过表征蒸馏，将预训练视频扩散模型改造成预测视觉编码器：编码器只根据当前观测，预测冻结扩散模型的视觉表征，无需生成未来视频。随后，动作模块从这些表征中提取与动作相关的信息并预测机器人动作，使系统能以每秒11帧进行实时闭环控制。实验显示，DreamFree在真实和模拟任务中优于先进的视觉语言动作模型与世界动作模型，并能利用额外视频数据及不同机器人形态的视频示范学习新任务，无需为这些示范标注动作。'}}}, {'id': 'https://huggingface.co/papers/2611.02660', 'title': 'HeLM: Hierarchical Explicit Language Memory for Non-Markovian Manipulation', 'url': 'https://huggingface.co/papers/2611.02660', 'abstract': "Abstract A hierarchical VLA framework is proposed to address the limitations of Markovian models by maintaining task history through explicit language memory and event-triggered updates.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent advances in Vision-Language-Action (VLA) models have enabled fine manipulation capabilities, yet performing tasks that require working memory remains a key challenge. Most existing VLA architectures operate under a Markovian assumption, mapping only the current observation to an action, which leads to failure in non-Markovian environments. Inspired by the human 'inner monologue', we propose Hierarchical Explicit Language Memory (HeLM), a hierarchical VLA framework that maintains task-relevant history in explicit language through factorized event detection and event-triggered memory updates. We evaluate HeLM across 10 non-Markovian real-world tasks with 56 variants, including five newly formulated inter-episode tasks that require persistent context across task boundaries. HeLM improves intra-episode success by 12.8 percentage points over the strongest baseline and achieves 78% subtask success on compositional generalization tasks, while using up to 4.5x less memory and running 2.5x faster than the keyframe baseline at long horizons.", 'score': 6, 'issue_id': 3504, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '79cbe34fa0a0d32b', 'authors': ['Gyeonghun Kim', 'Donghoon Kim', 'Minsoo Choi', 'Suyun Lee'], 'affiliations': ['Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02660.jpg', 'data': {'categories': ['#robotics', '#dataset', '#agents', '#reasoning', '#multimodal', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Робот помнит историю задачи, проговаривая её на языке', 'desc': 'Авторы предлагают HeLM — иерархическую VLA-модель, которая решает проблему марковских моделей, не способных учитывать историю задачи. Система хранит релевантную историю в явном виде на естественном языке (по аналогии с «внутренним монологом» человека) и обновляет эту языковую память по событиям, которые детектируются с помощью факторизованного механизма. Модель тестировалась на 10 немарковских задачах реального мира (56 вариантов), включая новые межэпизодные задачи, и показала рост успешности внутри эпизода на 12,8 п.п. По сравнению с keyframe-бейзлайном HeLM использует до 4,5 раза меньше памяти и работает в 2,5 раза быстрее на длинных горизонтах.'}, 'en': {'title': 'Give VLA Models a Language Memory for Tasks That Unfold Over Time', 'desc': 'HeLM is a hierarchical vision-language-action (VLA) framework designed for tasks that require remembering earlier events. Instead of choosing actions only from the current observation, it stores task-relevant history as explicit language and updates that memory when important events occur. Across 10 real-world non-Markovian tasks, it improved success by 12.8 percentage points over the strongest baseline and achieved 78% subtask success on compositional generalization tasks. At long horizons, it also used up to 4.5 times less memory and ran 2.5 times faster than a keyframe-based baseline.'}, 'zh': {'title': '让语言记忆连接任务历史，助力 VLA 应对长时复杂任务', 'desc': '论文提出分层显式语言记忆框架 HeLM，让视觉-语言-动作（VLA）模型用语言记录与任务相关的历史信息。它通过分解式事件检测判断何时需要更新记忆，并在关键事件发生时触发更新，从而突破只依据当前观察采取行动的马尔可夫假设。HeLM 在包含 56 种变体的 10 项真实非马尔可夫任务中进行评估，单轮任务成功率比最强基线高 12.8 个百分点，在组合泛化任务上达到 78% 的子任务成功率。长时任务中，它相比关键帧基线最多节省 4.5 倍记忆，并提升运行速度至 2.5 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.08237', 'title': 'Terminal-style Mathematical Modeling Bench: The First Agentic and Verifiable Benchmark for Mathematical Modeling', 'url': 'https://huggingface.co/papers/2611.08237', 'abstract': 'Abstract TB-MathModel is a terminal benchmark that makes complete contest-style mathematical modeling problems agentic and verifiable, scoring final numeric answers against multiple human references with feasibility checks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Mathematical modeling turns an open-ended real-world problem into assumptions, a model, a solution, and a defended recommendation, and its answers matter only if they are both close to a credible reference and physically feasible; existing benchmarks either score solver fragments or grade reports with an LLM judge, leaving those numbers unchecked. We introduce TB-MathModel (the Terminal-style Mathematical Modeling Bench), the first benchmark to make complete contest-style modeling problems agentic, verifiable, and terminal at once, over 18 real CUMCM and MCM problems (2023--2025). Each task ships the verbatim statement, official attachments, and figures in a containerized terminal; the agent returns one JSON artifact, scored on the numeric core of the final question against a reproduction of the Outstanding-award paper. Two design choices distinguish it: direction-aware, one-sided scoring, which never penalises beating the anchor, and two-layer feasibility verification---a programmatic gate over six decidable invariant forms plus 624 Lean~4 obligations---with a hard gate that zeroes infeasible answers. Each task is scored against a panel of human outstanding papers rather than one, so a model must be close to many accepted answers; across seven multimodal entries (three seeds each) the strongest reach a multi-reference O-Eval of 64.58\\%, while the \\2.54 open model holds 59.81% at 1/100$ the cost. TB-MathModel turns the numeric core of modeling into a reproducible, machine-checkable signal for measuring long-horizon modeling competence and for collecting agent trajectories. The source code is available at https://github.com/wxj630/terminal-bench-math-modeling.', 'score': 5, 'issue_id': 3505, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'ffd555b1a274c02f', 'authors': ['Xiaojun Wu', 'Cehao Yang', 'Xuhui Jiang', 'Chengjin Xu', 'Jia Li', 'Jian Guo'], 'affiliations': ['DataArcTech Ltd.', 'IDEA Research', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2611.08237.jpg', 'data': {'categories': ['#security', '#science', '#benchmark', '#reasoning', '#math', '#agents'], 'emoji': '📐', 'ru': {'title': 'Проверяемое математическое моделирование для AI-агентов', 'desc': 'В статье представлен TB-MathModel — бенчмарк для математического моделирования в формате терминала, основанный на 18 реальных задачах CUMCM и MCM за 2023–2025 годы. Агент возвращает JSON с итоговым численным ответом, который сравнивается с несколькими эталонными решениями людей с односторонней оценкой и проверяется на физическую допустимость через программный gate и 624 обязательства на Lean 4. Жёсткий фильтр обнуляет оценку недопустимых ответов, а O-Eval по нескольким эталонам измеряет близость к множеству принятых решений. Результаты показывают, что лучшие мультимодальные LLM достигают около 64,58%, а открытая модель — 59,81% при значительно меньшей стоимости.'}, 'en': {'title': 'Model the real world—and make every answer verifiable', 'desc': 'TB-MathModel is a benchmark for testing AI agents on complete mathematical modeling problems from real contests. Agents work in a terminal and submit a JSON answer, which is scored against answers from multiple human-written award papers. The benchmark checks both how close an answer is to the references and whether it satisfies physical and mathematical constraints; infeasible answers receive no credit. Results show that the strongest tested system scored 64.58% on the multi-reference evaluation, while an open model scored 59.81% at much lower cost.'}, 'zh': {'title': '让数学建模智能体的答案可验证、可比较', 'desc': '本文提出 TB-MathModel，这是一个评测智能体解决完整数学建模竞赛题的基准。它在容器化终端中提供题目、附件和图表，并依据最终数值答案与多篇优秀论文中的参考答案进行评分；若答案违反可行性约束，则会被直接判为零分。基准结合方向感知的单侧评分、程序化检查和 Lean 4 形式化验证，使评测结果更可复现、可机器核查。实验显示，表现最强的模型多参考评测分数为 64.58%，而一个开放模型以约百分之一的成本达到 59.81%。'}}}, {'id': 'https://huggingface.co/papers/2611.08089', 'title': 'SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization', 'url': 'https://huggingface.co/papers/2611.08089', 'abstract': 'Abstract A sparse autoencoder trained on mixture-of-experts layer outputs reveals that individual experts drive specific latent features, showing finer-grained and more concentrated specialization than routing or domain labels alone.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Mixture-of-Experts (MoE) models route each token to a few of many experts, yet what an individual expert is responsible for remains unsettled. Existing analyses count how often an expert is selected on domain-labeled corpora, an instrument that fixes the taxonomy in advance, stays coarse, and records selection rather than contribution. We instead study specialization in feature space by training a sparse autoencoder (SAE) on the output of an MoE layer. Since this output is a router-weighted sum of expert outputs and the SAE encoder is affine, the pre-activation of every latent decomposes exactly over the experts. Aggregated over a corpus, this gives each expert a dominant set of latents whose activation it principally drives. On layers 4, 30 and 46 of Qwen3-30B-A3B, contribution is far more concentrated than gating, most latents have only one or two dominators, and the overlap between dominant sets concentrates on a few expert pairs. Auto-interpreting these sets reveals a division of labor below coarse domains, with distinct experts for Java and front-end web code, or for geometry and for arithmetic and polynomials, while the coarse domains themselves take very unequal numbers of experts. Our SAEs and code are available at https://github.com/Bytedance-Seed/SAE-Interprets-MoE.', 'score': 5, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '69a3949de705c5b9', 'authors': ['Anyuan Zhuo', 'Shaohua Zhang', 'Yuan Lin', 'Pinyan Lu'], 'affiliations': ['ByteDance Seed', 'Shanghai University of Finance and Economics'], 'pdf_title_img': 'assets/pdf/title_img/2611.08089.jpg', 'data': {'categories': ['#open_source', '#architecture', '#interpretability'], 'emoji': '🧩', 'ru': {'title': 'Эксперты в MoE специализируются тоньше, чем показывает роутинг', 'desc': 'В статье рассматривается специализация экспертов в Mixture-of-Experts (MoE) моделях. Авторы обучают sparse autoencoder (SAE) на выходах MoE-слоя и раскладывают pre-activation каждого латентного признака по вкладам отдельных экспертов, так как выход слоя является взвешенной суммой выходов экспертов. Оказалось, что вклад экспертов сильно сконцентрирован и заметно точнее, чем статистика роутинга или доменные метки. Авто-интерпретация показывает более тонкое разделение труда внутри доменов, например, отдельные эксперты для Java и front-end кода.'}, 'en': {'title': 'Look Beyond Routing to See What Each Expert Really Does', 'desc': 'The paper studies what individual experts do inside mixture-of-experts (MoE) models. It trains a sparse autoencoder (SAE) on an MoE layer’s outputs and uses the SAE’s latent features to measure which experts drive each feature. In Qwen3-30B-A3B, expert contributions are more concentrated than routing patterns suggest: most features are mainly driven by one or two experts. Interpreting these features reveals fine-grained specialization, such as separate experts for Java and web code or for geometry and arithmetic.'}, 'zh': {'title': '穿透路由表象，揭示 MoE 专家的细粒度分工', 'desc': '这篇论文用稀疏自编码器（SAE）分析混合专家（MoE）模型中各个专家对潜在特征的实际贡献，而不只是统计专家被路由选中的频率。由于 SAE 的每个潜在特征可以分解为各专家输出带来的部分，研究者据此找出主要驱动各特征的专家。在 Qwen3-30B-A3B 的多个层中，特征贡献比路由选择更加集中，大多数特征主要由一两个专家驱动。进一步的分析发现，专家会在宽泛领域之下形成更细的分工，例如分别处理 Java、前端代码、几何或算术与多项式。'}}}, {'id': 'https://huggingface.co/papers/2611.05376', 'title': 'From Autonomous Agents to Cognitive Symbionts: Toward AI-Augmented Human Intelligence', 'url': 'https://huggingface.co/papers/2611.05376', 'abstract': "Abstract Physical AI should include AI-augmented human intelligence via lifelong cognitive symbionts that close cognitive gaps through sensing, context retention, and proactive assistance, requiring embedded governance.  Generated by thinkingmachines/Inkling-Small For a decade, progress in artificial intelligence has been measured by how much a machine can do on its own. Large foundation models now write code and run multistep tasks, and personal agents act on a person's behalf. Yet people still forget what they once knew, miss what they are not looking at, fail to find the right words, and face hard choices without the benefit of their own history, because the machine that could help stands outside the situation. As AI moves into the physical world, attention has settled on one kind of intelligent individual, the embodied robot; we argue that the era of Physical AI holds a second kind of equal importance, the person augmented by AI. Alongside artificial general intelligence, which asks how intelligent a machine can be, stands AI-augmented human intelligence (AHI), which asks how much intelligence a machine can enable in a particular person. Realizing it calls for a new kind of system, a cognitive symbiont: a lifelong, embedded, real-time, private, low-friction, and proactive companion that senses what the person senses through external devices, keeps their context across years, models their situation and their mind, takes part in their thinking at the right moment, carries out everyday tasks with their context, and keeps learning the person as both change. We give the paradigm a conceptual core, the cognitive gap between what a person could bring to a situation and what they can hold in working memory, and organize its design space as a symbiosis loop of sensing, keeping, understanding, living alongside, acting for and thinking with the person, and growing, enclosed by a personal runtime and by trust. Because a symbiont changes what a person can do in front of others, it also raises risks of a new kind, from covert assistance in examinations to pressure on everyone to adopt it, and we treat their governance as part of the paradigm.", 'score': 5, 'issue_id': 3504, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '851bc508e2103f02', 'authors': ['Hao Fei'], 'affiliations': ['Carnegie Mellon University', 'Massachusetts Institute of Technology', 'Stanford University', 'University of Cambridge', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2611.05376.jpg', 'data': {'categories': ['#ethics', '#agents', '#agi'], 'emoji': '🧠', 'ru': {'title': 'ИИ, который усиливает человека, а не заменяет его', 'desc': 'Статья предлагает рассматривать AI-augmented human intelligence (AHI) как второй важный вектор развития Physical AI, наряду с воплощёнными роботами и AGI. Авторы описывают cognitive symbiont — пожизненного, встроенного и проактивного ИИ-компаньона, который через внешние сенсоры воспринимает контекст человека, хранит его историю и помогает в мышлении и повседневных задачах. Центральное понятие работы — когнитивный разрыв между тем, что человек мог бы учесть, и тем, что он реально удерживает в рабочей памяти, а архитектура системы строится как цикл: сенсинг, хранение, понимание, совместная жизнь, действия и обучение. Отдельно обсуждаются риски таких систем, например скрытая помощь на экзаменах, и необходимость встраивать управление (governance) и доверие в саму парадигму.'}, 'en': {'title': 'Physical AI That Thinks Alongside You', 'desc': 'The paper argues that Physical AI should augment people, not only create autonomous robots. It proposes cognitive symbionts: private, lifelong AI companions that sense a person’s situation, retain context, and offer timely help. These systems aim to close cognitive gaps between what someone could usefully know and what they can keep in working memory, by supporting understanding, decisions, and everyday tasks. Their design must include trust and governance to address risks such as covert assistance and pressure to adopt them.'}, 'zh': {'title': '让 AI 成为人的长期认知伙伴', 'desc': '本文提出，Physical AI 不应只关注能自主行动的机器人，也应关注 AI 如何增强具体的人类智能。作者将这种增强称为 AI 增强的人类智能，并提出“认知共生体”：一种长期陪伴个人、实时感知情境、保留记忆并主动提供帮助的系统。它通过感知、记忆、理解、协同行动和持续学习，弥补人的认知差距，也就是人在特定情境中能运用的知识与工作记忆所能容纳内容之间的差距。由于这类系统会影响个人行为与社会互动，隐私、信任和治理必须成为设计的一部分。'}}}, {'id': 'https://huggingface.co/papers/2611.06982', 'title': 'Decode Before You Hear: Speculative Listening for Chunk-Interleaved Full-Duplex Speech Language Models', 'url': 'https://huggingface.co/papers/2611.06982', 'abstract': 'Abstract A training-free, lossless speculative decoding framework exploits idle compute in chunk-interleaved full-duplex speech language models to draft and verify upcoming audio chunks, substantially reducing response and tool-call delays.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Chunk-interleaved full-duplex speech language models listen and speak in fixed time chunks, and each chunk must be processed before the next one arrives. Their workload is asymmetric across chunks: listen chunks leave compute idle while awaiting audio, and speak and tool-call chunks require serial gene
