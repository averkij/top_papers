    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');

                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.16859', 'title': 'HarnessEval-W: Agentifying the Evaluation of Visual Worlds', 'url': 'https://huggingface.co/papers/2608.16859', 'abstract': 'Abstract HarnessEval-W uses hierarchical sub-agents to decompose world-model evaluations into verifiable reasoning chains that justify scores with transparent evidence.  Generated by thinkingmachines/Inkling-Small A benchmark should deliver more than a scalar score: what makes an evaluation trustworthy is the reasoning that justifies the score. This is especially critical for world models, where judging a rollout requires understanding whether physics, causality, and world state evolve correctly. Humans spot such violations naturally, yet no existing benchmark automates this capability: metrics are computed brute-force, leaving no reasoning chain that can be examined or verified. We introduce HarnessEval-W, an agentified evaluation pipeline that brings the harness paradigm from the LLM ecosystem to world model benchmarking. Rather than applying a fixed rubric, HarnessEval-W interprets the context of each evaluation case, decomposes the evaluation question into measurable subproblems, and spawns specialized sub-agents, each equipped with tailored context and diagnostic tools to reason over its own subproblem. The parent agent then validates the gathered evidence and summarizes it into the final verdict. This hierarchical workflow turns every evaluation into a transparent evidence tree whose complete reasoning chain justifies the result. We apply HarnessEval-W to 18 representative world models over 330 evaluation cases. Its judgments closely align with human preferences while providing verifiable, fine-grained diagnoses of every generated rollout. We open-source the full pipeline as a live benchmark and invite the broad community to contribute to grow new skills and evaluation cases as world models evolve.', 'score': 107, 'issue_id': 3019, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '070635890143737b', 'authors': ['Weiliang Chen', 'Haowen Sun', 'Jun Gao', 'Jiawei Chi', 'Hanyang Wang', 'Qiyu Dai', 'Yihao Li', 'Hao Li', 'Jingnan Gao', 'Yi-Hsin Hung', 'Xingzhuo Guo', 'Shangchen Miao', 'Zhiyuan Shi', 'Xiang Li', 'Fengrui Tian', 'Weihua Du', 'Ziqi Huang', 'Shenyuan Gao', 'Siqiao Huang', 'Mingyu Liu', 'Yifei Li', 'Shizun Wang', 'Xi Wang', 'Tianqi Zhang', 'Xue Luo', 'Xiyin Ren', 'Jinshan Ren', 'Xiaoyang Shen', 'Xiaobo Hu', 'Zhiyang Dou', 'Mingyu Ding', 'Yichao Yan', 'Xinchao Wang', 'Yizhou Wang', 'Shilong Liu', 'Wenzhao Zheng', 'Yueqi Duan', 'Yuan Gong', 'Ziwei Liu', 'Ming-Yu Liu', 'Jialong Wu', 'Jiangran Lyu', 'Fangfu Liu'], 'affiliations': ['mirros-lab'], 'pdf_title_img': 'assets/pdf/title_img/2608.16859.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Прозрачная оценка world models через многоуровневые агентские цепочки рассуждений', 'desc': 'В работе представлена HarnessEval-W — система оценки world models, которая использует иерархию специализированных агентов для разложения оценочных задач на проверяемые цепочки рассуждений. Вместо применения жёстких метрик, система интерпретирует контекст каждого случая, декомпозирует вопрос оценки и порождает под-агентов с особыми инструментами диагностики. Родительский агент затем валидирует собранные доказательства и формирует окончательный вердикт в виде прозрачного дерева рассуждений. Метод протестирован на 18 world models и 330 случаев оценки, показывая согласованность с человеческими предпочтениями при одновременном обеспечении детальной диагностики каждого сгенерированного сценария.'}, 'en': {'title': 'Transparent Evaluations with Hierarchical Reasoning', 'desc': 'HarnessEval-W is a novel evaluation framework that uses a hierarchical structure of sub-agents to analyze world models. It breaks down complex evaluation tasks into smaller, manageable subproblems, allowing each sub-agent to focus on specific aspects of the evaluation. This approach not only generates scores but also provides transparent reasoning chains that justify the scores with verifiable evidence. By aligning closely with human judgment, HarnessEval-W enhances the trustworthiness of evaluations in machine learning models, particularly in understanding dynamics like physics and causality.'}, 'zh': {'title': '透明推理链，可信评估', 'desc': 'HarnessEval-W 是一种使用层次子代理的评估方法，它将世界模型的评估分解为可验证的推理链，以透明的证据来证明评分的合理性。这种方法不仅提供了一个分数，还通过推理过程增强了评估的可信度，尤其是在判断物理、因果关系和世界状态演变时。HarnessEval-W 通过解析每个评估案例的上下文，将评估问题分解为可测量的子问题，并生成专门的子代理来处理这些子问题。最终，父代理验证收集到的证据，并将其总结为最终判决，从而形成一个透明的证据树，完整的推理链为结果提供了支持。'}}}, {'id': 'https://huggingface.co/papers/2608.15265', 'title': 'VibeWorlding: Can Multimodal Agents Construct 3D Open Worlds End-to-End?', 'url': 'https://huggingface.co/papers/2608.15265', 'abstract': 'Abstract A unified framework benchmarks and trains multimodal agents that infer intent, plan 3D scenes, invoke tools, and reflect on feedback, revealing that reinforcement learning improves open-source models beyond closed-source frontiers.  Generated by thinkingmachines/Inkling-Small Constructing an interactive 3D open world from a user query is important. However, existing methods are primarily evaluated on idealized, simple queries, making it difficult to systematically analyze and compare how multimodal agents understand user intent, use 3D tools, and reason over textual and visual 3D world information. To this end, we propose VibeWorlding, a unified framework for benchmarking and training vibe worlding agents: a multimodal agent that can autonomously infer user intent, plan scene layout, invoke 3D tools, and reflect on the multimodal feedback in a multi-turn agent-environment interaction process. To achieve this, we first build VWE-BENCH, a benchmark of 2,616 high-quality 3D assets, 323 human-annotated seed 3D worlds, and 6,828 reverse-synthesized multimodal user queries, split into verified queries with ground-truth and unverified queries with carefully designed rubrics. Moreover, we develop VibeWorlding-Gym, a joint multimodal RL post-training framework that integrates (1) a sandbox environment unifying asset retrieval, editing, and image rendering as MCP tools, and (2) a rubric-based verifier that combines physical feasibility and intent fulfillment verification, supporting both fair model evaluation and scalable multimodal RL reward service. Our experiments show that current frontier MLLMs are far from solving the vibe worlding agent task, with even GPT-5.5 and Qwen3.8-Max reaching below 60% success rate, and trace the bottleneck to precise 3D world editing. We further find that RL training can ease this weakness and enable open-source MLLMs to even surpass closed-source frontiers: our VibeWorlder-8B is comparable to frontier MLLMs, while our flagship VibeWorlder-30B-A3B attains the best overall Pass@1 among all evaluated models.', 'score': 50, 'issue_id': 3017, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '15880d456f6029a5', 'authors': ['Yansong Ning', 'Jingwen Ye', 'Zhongkai Wu', 'Yang Sun', 'Yiqin Zhu', 'Xingyi Li', 'Weidong Zhang', 'Hao Liu'], 'affiliations': ['HKUST(GZ)', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.15265.jpg', 'data': {'categories': ['#multimodal', '#rl', '#dataset', '#agents', '#open_source', '#optimization', '#3d', '#training', '#reasoning', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Агенты с усилением: как обучение с подкреплением превосходит закрытые модели в конструировании 3D-миров', 'desc': 'В статье представлена единая система VibeWorlding для оценки и обучения мультимодальных агентов, которые могут понимать намерения пользователя, планировать трёхмерные сцены, использовать различные инструменты и анализировать обратную связь. Авторы создали бенчмарк VWE-BENCH с высококачественными 3D-активами, аннотированными сценами и синтетическими запросами пользователей для систематического анализа способностей агентов. Разработана система VibeWorlding-Gym с использованием обучения с подкреплением (RL), которая объединяет песочницу для работы с 3D-моделями и верификатор на основе критериев качества. Экспериментальные результаты показывают, что обучение с подкреплением позволяет открытым моделям превзойти закрытые аналоги, причём VibeWorlder-30B-A3B достигает лучших показателей среди всех оцениваемых систем.'}, 'en': {'title': 'Empowering Multimodal Agents with Reinforcement Learning for 3D Scene Mastery', 'desc': 'This paper introduces VibeWorlding, a framework designed to benchmark and train multimodal agents capable of understanding user intent and manipulating 3D environments. It highlights the limitations of existing methods that only assess simple queries, making it hard to evaluate how well agents can interpret complex user requests. The authors present VWE-BENCH, a comprehensive dataset that includes 3D assets and user queries, which aids in training these agents. The findings suggest that reinforcement learning significantly enhances the performance of open-source models, allowing them to outperform some closed-source counterparts in 3D scene manipulation tasks.'}, 'zh': {'title': '强化学习助力多模态智能体超越边界', 'desc': '本文提出了一个统一框架VibeWorlding，用于基准测试和训练多模态智能体，能够推断用户意图、规划3D场景、调用工具并反思反馈。我们构建了VWE-BENCH基准，包含高质量的3D资产和多种用户查询，以便系统地分析多模态智能体的表现。研究表明，强化学习能够提升开源模型的性能，甚至超越封闭源模型的边界。实验结果显示，当前的前沿多模态语言模型在执行任务时仍存在瓶颈，而通过强化学习训练可以有效改善这一问题。'}}}, {'id': 'https://huggingface.co/papers/2608.15669', 'title': 'Large Discovery Models: Empirically-grounded Model-Based Open-Ended Search', 'url': 'https://huggingface.co/papers/2608.15669', 'abstract': 'Abstract A recurrent Large Discovery Model couples generative proposal with a Bayesian non-parametric reward surrogate to guide uncertainty-aware search across molecules, proteins, and programs.  Generated by thinkingmachines/Inkling-Small Scientific discovery often involves optimising expensive-to-evaluate objectives over vast, structured, and open-ended hypothesis spaces, such as molecules, protein sequences, and computer programs. Generative models such as large language models (LLMs) provide expressive priors over such spaces, but their likelihoods and self-assessments are unreliable proxies for the objectives and calibrated epistemic uncertainty, especially for novel candidates outside the observed data distribution. We introduce the Large Discovery Model (LDM), an empirically grounded recurrent architecture that couples a generative model with a Bayesian non-parametric reward surrogate model. The generative model proposes and refines candidate designs, while the surrogate predicts their performance and quantifies uncertainty, yielding an uncertainty-aware value that guides candidate generation, refinement, and selection. The discovery memory and the surrogate model are continually updated as each new experimental observation arrives. We evaluate LDM on three scenarios spanning different design modalities and objectives, including neural-network training, antibody design, and molecular optimisation. Compared to LLM-only reflection or traditional statistical search across these domains, LDM achieves a 2.4times greater reduction in validation BPB, an 18.2% relative decrease in binding energy, and more than 60% relative gains in molecular multi-objective performance. These results suggests that LDM could serve as a general-purpose discovery engine for effective search over open-ended hypothesis spaces.', 'score': 47, 'issue_id': 3023, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '15d42d617b6b8224', 'authors': ['Zhongwei Yu', 'Yan Song', 'Xue Yan', 'Anjie Liu', 'Xingyu Lu', 'Yihang Chen', 'Huichi Zhou', 'Siyuan Guo', 'Luoyang Sun', 'Sihan Chen', 'Xiangning Yu', 'Jun Wang'], 'affiliations': ['AI Lab, The Yangtze River Delta', 'Institute of Automation, CAS', 'Jilin University', 'The Hong Kong University of Science and Technology (GZ)', 'Tianjin University', 'University College London'], 'pdf_title_img': 'assets/pdf/title_img/2608.15669.jpg', 'data': {'categories': ['#science', '#optimization'], 'emoji': '🔬', 'ru': {'title': 'Байесовский поиск в открытых пространствах научных гипотез через генеративные и суррогатные модели', 'desc': 'В работе предлагается Large Discovery Model (LDM) — рекуррентная архитектура, которая объединяет генеративную модель с байесовским непараметрическим суррогатом для функции полезности. Генеративная модель предлагает и улучшает кандидатов, а суррогат предсказывает их производительность и количественно оценивает неопределённость. Система постоянно обновляется по мере получения новых экспериментальных данных, обеспечивая информированный поиск в открытых пространствах гипотез. LDM демонстрирует значительные улучшения на задачах молекулярной оптимизации, дизайна антител и обучения нейросетей по сравнению с методами, основанными только на LLM.'}, 'en': {'title': 'Unlocking Discovery: A New Era in Uncertainty-Aware Search', 'desc': "The Large Discovery Model (LDM) is a novel approach that combines generative models with Bayesian non-parametric reward surrogates to enhance the search for optimal solutions in complex domains like molecules and proteins. By leveraging generative models, LDM proposes and refines potential candidates while the surrogate model assesses their performance and quantifies uncertainty. This dual approach allows for a more informed and uncertainty-aware search process, continuously updating as new data is collected. The results demonstrate significant improvements in performance metrics across various design tasks, indicating LDM's potential as a versatile tool for scientific discovery."}, 'zh': {'title': '大型发现模型：探索未知的强大引擎', 'desc': '本文介绍了一种名为大型发现模型（LDM）的新型递归架构，它结合了生成模型和贝叶斯非参数奖励代理模型，以指导对分子、蛋白质和程序的基于不确定性的搜索。LDM通过生成候选设计并不断优化，同时利用代理模型预测其性能并量化不确定性，从而实现更有效的探索。与仅使用大型语言模型（LLM）或传统统计搜索相比，LDM在多个设计场景中表现出显著的性能提升。研究结果表明，LDM可以作为一种通用的发现引擎，有效地在开放的假设空间中进行搜索。'}}}, {'id': 'https://huggingface.co/papers/2608.16072', 'title': "Learn What's Left, Not What's Mastered: Saturation Aware Advantage Reweighting for Multi-Reward Policy Optimization", 'url': 'https://huggingface.co/papers/2608.16072', 'abstract': 'Abstract SA-MRPO independently standardizes multi-objective rewards and adaptively discounts saturated objectives to redirect optimization toward under-optimized goals.  Generated by thinkingmachines/Inkling-Small Reinforcement learning (RL) with group-relative advantages has become the de facto standard for post-training language model reasoners. However, when optimizing multiple reward objectives, existing methods typically scalarize the reward vector with a fixed weighted sum before group-wise standardization. We show that this design leads to two fundamental problems: rollouts with distinct reward profiles can receive identical advantages, and all objectives are optimized with fixed relative weights regardless of their current level of saturation. As a result, training continues to allocate gradient budget to already-solved objectives instead of focusing on those with greater remaining headroom. We introduce Saturation Aware Advantage Reweighting for Multi-Reward Policy Optimization (SA-MRPO), which standardizes each reward objective independently and adaptively discounts its contribution according to a batch-level estimate of objective saturation. This dynamically reallocates optimization effort toward under-optimized objectives while empirically maintaining performance on those that are already well satisfied. We further show that saturation-aware reweighting can reverse the sign of an update, rather than merely rescale its magnitude. Across mathematical reasoning with two- and three-objective reward combinations, SA-MRPO improves the harder correctness objective over GDPO in 12 of 15 benchmark comparisons, with gains of up to 5% on AIME24. On adaptive reasoning it improves accuracy on all five benchmarks, by 3.8% on average and up to 9.2 % on AMC23, and on coding benchmarks it improves pass rate by up to 2.3%, while in all settings maintaining the easier objectives near their already satisfied levels.', 'score': 43, 'issue_id': 3021, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': 'c913c3db0a118adf', 'authors': ['Yixuan Wang', 'Yifei Chen', 'Haichao Zhang', 'Haozheng Luo', 'Xander Wu', 'Jie Ni', 'Yun Fu', 'Nuno Vasconcelos', 'Yijiang Li'], 'affiliations': ['Northeastern University', 'Northwestern University', 'Stanford University', 'UC San Diego', 'University of Florida', 'Universität Innsbruck', 'Zillion Network'], 'pdf_title_img': 'assets/pdf/title_img/2608.16072.jpg', 'data': {'categories': ['#rlhf', '#optimization', '#math', '#training', '#rl', '#alignment', '#reasoning'], 'emoji': '⚖️', 'ru': {'title': 'Динамическая балансировка целей через осознание насыщения', 'desc': 'Авторы предлагают SA-MRPO — метод оптимизации политики для обучения с подкреплением, который независимо стандартизирует каждый из нескольких objective-функций вместо того, чтобы объединять их в одну взвешенную сумму. Ключевая идея состоит в адаптивном снижении вклада уже решённых целей (saturated objectives) на основе оценки их текущего уровня насыщения, что перенаправляет градиентный бюджет на недооптимизированные задачи. Метод показывает значительные улучшения при оптимизации языковых моделей на задачах математического и адаптивного мышления, повышая качество сложных целей до 5-9% на известных бенчмарках. Подход демонстрирует, что динамическая переаллокация усилий оптимизации позволяет одновременно улучшать недостаточно развитые способности модели и сохранять уже достигнутый уровень производительности на остальных целевых функциях.'}, 'en': {'title': 'Dynamic Focus on Under-Optimized Goals in Multi-Reward RL', 'desc': 'The paper introduces a new method called Saturation Aware Advantage Reweighting for Multi-Reward Policy Optimization (SA-MRPO) that improves how reinforcement learning models handle multiple reward objectives. Traditional methods use a fixed weighted sum to combine rewards, which can lead to inefficient training as they may focus on already solved objectives. SA-MRPO independently standardizes each reward and adaptively adjusts their importance based on how well they are being optimized, allowing the model to concentrate on underperforming goals. This approach has shown significant improvements in various benchmarks, enhancing performance on more challenging objectives while maintaining satisfactory levels on easier ones.'}, 'zh': {'title': '动态优化，聚焦未饱和目标', 'desc': 'SA-MRPO是一种新的多目标奖励优化方法，它独立标准化每个奖励目标，并根据目标饱和度动态调整其贡献。传统方法使用固定权重的加权和来处理多个奖励目标，导致优化过程中的一些问题，如不同奖励配置的回合可能获得相同的优势。SA-MRPO通过适应性折扣饱和目标，重新分配优化努力，专注于尚未优化的目标，从而提高整体性能。实验结果表明，SA-MRPO在多个基准测试中显著提升了模型的准确性和通过率。'}}}, {'id': 'https://huggingface.co/papers/2608.15045', 'title': 'MOSS-VL Technical Report', 'url': 'https://huggingface.co/papers/2608.15045', 'abstract': 'Abstract MOSS-VL is an open vision-language model family enabling real-time interaction by attending to vision via gated cross-attention during generation, using a synthesized interaction corpus and staged curriculum to achieve strong streaming performance with reduced time-to-first-token latency.  Generated by thinkingmachines/Inkling-Small We present MOSS-VL, an open vision-language model family that treats real-time interaction -- perceiving while it speaks -- as a first-class capability. It is co-designed across the stack: the language decoder attends to vision only through gated cross-attention, so the model can naturally see incoming frames while generating; a synthesized interaction corpus supervises when to speak, when to stay silent, and when to revise; and a staged curriculum concentrates all real-time-specific training in one light final stage over a strong offline foundation. Offline, MOSS-VL-Instruct is competitive at comparable scale and leads temporal-reasoning video sets. Across four streaming benchmarks, MOSS-VL-Realtime posts the best average on three (second on the fourth) among open-source streaming models, sweeping the three subsets that squarely test proactive behavior -- 66.0 vs. 37.5 for the best baseline on OmniMMI Proactive Alerting. With 11.3B parameters but visual tokens outside the decoded sequence, MOSS-VL widens its time-to-first-token advantage over same-backbone Qwen3-VL-8B from 2.8x to 5.1x as visual context grows. We release all five checkpoints, the training curriculum, and the real-time inference code at https://github.com/OpenMOSS/MOSS-VL.', 'score': 37, 'issue_id': 3024, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '5cf804498937775a', 'authors': ['Pengyu Wang', 'Chenkun Tan', 'Shaojun Zhou', 'Qirui Zhou', 'Yanxin Chen', 'Xingyang He', 'Huazheng Zeng', 'Jijun Cheng', 'Chenghao Wang', 'Xiaomeng Qian', 'Pengfei Wang', 'Zhan Huang', 'Shanqing Gao', 'Wei Huang', 'Longjun Cao', 'Wu Ran', 'Jie Liu', 'Changtai Zhu', 'Hongkai Wang', 'Yixian Tian', 'Chenghao Liu', 'Zhen Ye', 'Xinghao Wang', 'Botian Jiang', 'Guoguo Feng', 'Zhaoye Fei', 'Ruixiao Li', 'Mingshu Chen', 'Yang Gao', 'Qinyuan Cheng', 'Shimin Li', 'Xipeng Qiu'], 'affiliations': ['Fudan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.15045.jpg', 'data': {'categories': ['#inference', '#multimodal', '#video', '#benchmark', '#architecture', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Видение и речь одновременно: потоковая модель зрения-языка в реальном времени', 'desc': 'MOSS-VL — это открытое семейство мультимодальных моделей, которые сочетают зрение и язык для взаимодействия в реальном времени. Архитектура использует механизм управляемого кросс-внимания, позволяя модели воспринимать видеокадры одновременно с генерацией текста. Обучение проводится на синтезированном корпусе взаимодействий с использованием многоэтапного учебного плана, что обеспечивает быструю работу потоковой обработки и минимизирует задержку первого токена. Модель демонстрирует лучшие результаты на бенчмарках потокового видеоанализа и эффективнее конкурирующих решений по временным характеристикам.'}, 'en': {'title': 'Real-Time Vision-Language Interaction with MOSS-VL', 'desc': 'MOSS-VL is a new family of vision-language models designed for real-time interaction, allowing the model to perceive visual information while generating text. It uses a technique called gated cross-attention, which helps the language decoder focus on visual inputs during text generation. The model is trained on a specially created interaction dataset that teaches it when to speak, stay silent, or revise its output. MOSS-VL outperforms other open-source models in streaming tasks, demonstrating significant improvements in response time and proactive behavior.'}, 'zh': {'title': 'MOSS-VL：实时交互的视觉-语言模型', 'desc': 'MOSS-VL是一个开放的视觉-语言模型系列，能够实现实时交互。它通过门控交叉注意力机制，在生成过程中关注视觉信息，从而减少首次生成令牌的延迟。该模型使用合成的交互语料库和分阶段的课程设计，优化了实时性能。MOSS-VL在多个流媒体基准测试中表现优异，尤其在主动行为测试中领先于其他开源模型。'}}}, {'id': 'https://huggingface.co/papers/2608.16798', 'title': 'ClawGym II: Exploring Black-Box RL on Agent Harness', 'url': 'https://huggingface.co/papers/2608.16798', 'abstract': 'Abstract A unified black-box reinforcement learning framework enables stable, scalable optimization of general agents through complex harnesses via sandbox execution, trajectory reconstruction, and mix-harness training.  Generated by thinkingmachines/Inkling-Small Agent harnesses have substantially improved performance on long-horizon tasks by coordinating agent interactions with the environment. However, reinforcement learning through complex harnesses remains largely unexplored, as scaling such training to long-horizon agent tasks introduces fundamental challenges. In this work, we present a unified black-box RL framework for stable and scalable optimization of general agents through complex harnesses. Concretely, we first build a sandbox-based execution infrastructure that isolates task environments and harnesses within temporary sandboxes for large-scale concurrent rollouts. We then decouple policy optimization from opaque harness execution and place a serving proxy at the model boundary to capture model calls. To reconstruct multi-turn trajectories and improve training efficiency, we organize the captured calls into prefix trees and further adapt both critic-based PPO and critic-free GRPO to optimize over the recovered tree structure. Meanwhile, we maintain training-inference consistency throughout the optimization process. Finally, we introduce mix-harness training, allowing a single model to be jointly optimized by heterogeneous harnesses. With Qwen3-30A3B, black-box RL improves Pass@1 on ClawGym-Bench by 9.98 and 14.81 points through OpenClaw and Claude Code, respectively, while remaining stable over 200-400 optimization steps. Moreover, the framework yields consistent gains on more challenging tasks such as JobBench and OfficeQA. Overall, our framework enables effective, stable, and scalable optimization of general agents through black-box harnesses, supporting unified training across heterogeneous execution systems.', 'score': 33, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': 'c0314c5caf99a7a4', 'authors': ['Huatong Song', 'Fei Bai', 'Ming Yang', 'Renyuan Li', 'Jia Deng', 'Jujie He', 'Zhange Zhang', 'Daixuan Cheng', 'Yan Xing', 'Qi Yun', 'Xuxing Chen', 'Danyang Li', 'Feng Chang', 'Chuan Hao', 'Ran Tao', 'Jian Yang', 'Bryan Dai', 'Wayne Xin Zhao', 'Mingjie Tang', 'Ji-Rong Wen'], 'affiliations': ['Gaoling School of Artificial Intelligence, Renmin University of China', 'IQuest Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.16798.jpg', 'data': {'categories': ['#rl', '#benchmark', '#training', '#agents', '#rlhf'], 'emoji': '🤖', 'ru': {'title': 'Чёрный ящик усиливает силу: масштабируемое обучение с подкреплением для сложных сред', 'desc': 'В работе представлена унифицированная система обучения с подкреплением для оптимизации агентов через сложные внешние системы (harnesses). Авторы разработали инфраструктуру на основе изолированных sandbox-сред для масштабируемых параллельных траекторий и предложили метод реконструкции многошаговых траекторий через префиксные деревья. Они адаптировали алгоритмы PPO и GRPO для оптимизации по восстановленной структуре дерева, обеспечивая консистентность между обучением и инференсом. Фреймворк также поддерживает смешанное обучение (mix-harness training), позволяя одной модели оптимизироваться несколькими гетерогенными системами одновременно.'}, 'en': {'title': 'Stable and Scalable Optimization of Agents with Black-Box RL', 'desc': 'This paper presents a new framework for reinforcement learning (RL) that allows for stable and scalable optimization of agents using complex harnesses. It introduces a sandbox execution environment that isolates tasks, enabling large-scale concurrent training. The framework also decouples policy optimization from harness execution, improving efficiency by reconstructing trajectories into prefix trees. Additionally, it supports mix-harness training, allowing a single model to be optimized across different environments, leading to significant performance improvements on various long-horizon tasks.'}, 'zh': {'title': '统一黑箱强化学习框架，优化智能体训练', 'desc': '本文提出了一种统一的黑箱强化学习框架，旨在通过复杂的环境训练实现稳定和可扩展的智能体优化。该框架利用沙箱执行、轨迹重构和混合环境训练，显著提高了在长时间任务上的表现。我们通过构建沙箱基础设施来隔离任务环境，并将策略优化与环境执行解耦，以提高训练效率。最终，该框架支持在异构执行系统上进行统一训练，推动了强化学习在复杂环境中的应用。'}}}, {'id': 'https://huggingface.co/papers/2608.15930', 'title': 'UI-Mate: Advancing Open-Weight Foundation GUI Agents with In-Context Demonstrations', 'url': 'https://huggingface.co/papers/2608.15930', 'abstract': 'Abstract UI-Mate is a foundation GUI agent that uses environment-grounded training and in-context demonstration learning to improve reliability on long-horizon office tasks, achieving state-of-the-art results on computer-use benchmarks.  Generated by thinkingmachines/Inkling-Small Foundation GUI agents can automate complex digital tasks, but deployment is hindered by scarce and biased training data, ambiguous prompts, and unreliable execution. Routine workflows rely on user-specific tools and tacit conventions, so unstated instructions can produce arbitrary variations across runs. We present UI-Mate, a foundation GUI agent that integrates an environment-grounded training stack with in-context demonstration learning. UI-Mate makes three contributions: A Scalable Environment-Grounded Training Stack: A closed-loop data engine automates task generation, environment construction, rollout, filtering, capability balancing, SFT, and online RL across massively parallel environments via unified task-verifier bundles. In-Context Demonstration Learning: A mechanism that transforms multimodal demonstrations into flexible subtask-level workflows, follows relevant demonstrated steps, and re-plans from the live interface. OSWorkerBench Benchmark and Insights: A benchmark of 100 long-horizon office tasks across 41 applications that supports instruction-only and demonstration-guided evaluation. Its demonstration resources separate a 33-task self-demo setting, built from successful strong-agent rollouts of the same targets, from a 45-task variant-demo setting, built from human recordings of related but non-identical tasks. Experiments show that UI-Mate-27B sets a new open-weight state of the art on general computer-use benchmarks, scoring 77.0% on OSWorld-Verified and 66.2% on WindowsAgentArena. On OSWorkerBench, it reaches 41.0% strict success and 76.9% progress, outperforming its Qwen3.6-27B base by 17.7 and 24.5 points. On the 33-task self-demo subset, one demonstration raises strict success from 17.2% to 35.4% and progress from 67.9% to 81.1%, substantially improving long-horizon reliability. Project page: https://ui-mate.github.io.', 'score': 32, 'issue_id': 3018, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '7e5b68c4a3166337', 'authors': ['Zihan Ding', 'Longxu Dou', 'Qi Gao', 'Xiangwu Guo', 'Shengchao Hu', 'Zilong Huang', 'Zihang Jiang', 'Lei Ke', 'Mengcheng Lan', 'Weixian Lei', 'Hanxuan Li', 'Honglin Li', 'Xiyun Li', 'Zaitang Li', 'Leowei Liang', 'Xin Luo', 'Haozhe Ma', 'Jiayi Mao', 'Zhoujie Pan', 'Can Qin', 'Tianyuan Qu', 'Weiqi Wang', 'Wenkai Wang', 'Yonglin Wang', 'Yuxin Wang', 'Chenxu Wu', 'Yingchen Yu', 'Chenyu Zhang', 'Yuhao Zheng'], 'affiliations': ['Tencent Hy Frontier Team'], 'pdf_title_img': 'assets/pdf/title_img/2608.15930.jpg', 'data': {'categories': ['#rl', '#dataset', '#benchmark', '#training', '#optimization', '#agents', '#multimodal', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Обучение GUI агента через демонстрации в живом окружении', 'desc': 'UI-Mate — это foundation модель для автоматизации задач на графическом интерфейсе, которая использует environment-grounded обучение и learning from demonstrations для повышения надежности выполнения длительных офисных операций. Система интегрирует замкнутый цикл генерации данных с механизмом in-context обучения, позволяя трансформировать мультимодальные демонстрации в гибкие подзадачи на уровне абстракции. Авторы предложили OSWorkerBench — новый бенчмарк из 100 длительных задач в 41 приложении с поддержкой evaluation как по инструкциям, так и по демонстрациям. UI-Mate-27B достигает state-of-the-art результатов: 77.0% на OSWorld-Verified, 66.2% на WindowsAgentArena и существенно улучшает надежность при добавлении одной демонстрации.'}, 'en': {'title': 'Revolutionizing Office Automation with UI-Mate', 'desc': 'UI-Mate is a foundation GUI agent designed to enhance the performance of automated digital tasks by utilizing environment-grounded training and in-context demonstration learning. It addresses challenges such as limited and biased training data, ambiguous user prompts, and inconsistent execution by creating a scalable training framework. The agent can adapt to user-specific workflows and improve task reliability over long durations by learning from multimodal demonstrations. UI-Mate achieves state-of-the-art results on various benchmarks, significantly increasing success rates in complex office tasks.'}, 'zh': {'title': 'UI-Mate：提升办公任务可靠性的智能代理', 'desc': 'UI-Mate 是一个基础的图形用户界面（GUI）代理，采用环境基础训练和上下文示范学习来提高在长时间办公任务中的可靠性。它通过自动化任务生成和环境构建，解决了训练数据稀缺和偏见的问题。UI-Mate 的创新包括可扩展的环境基础训练堆栈和灵活的子任务级工作流机制，显著提升了执行效果。实验结果表明，UI-Mate 在计算机使用基准测试中达到了新的最佳水平，展示了其在复杂数字任务中的强大能力。'}}}, {'id': 'https://huggingface.co/papers/2608.16887', 'title': 'An Empirical Study of Training Pixel-Space Text-to-Image Diffusion Models', 'url': 'https://huggingface.co/papers/2608.16887', 'abstract': 'Abstract Researchers propose a latent-to-pixel training strategy that accelerates convergence and improves inference speed for large-scale pixel-space diffusion models.  Generated by thinkingmachines/Inkling-Small This paper investigates an increasingly important topic in generative modeling: pixel-space diffusion models. Although numerous studies have explored this topic, most focus on small-scale or class-conditional settings. Consequently, a practical recipe for training pixel-space models that rival or exceed well-established latent-space counterparts remains elusive. Through a comprehensive empirical study, we first observe that direct large-scale pre-training in pixel space converges substantially more slowly than in latent space. This observation motivates a latent-to-pixel strategy that acquires generative priors efficiently in latent space and transitions to pixel space during post-training. We then systematically investigate the key design choices governing this transition, including weight initialization, data composition, prediction target, decoder architecture, and noise schedule, and identify a practical recipe that makes the resulting pixel-space models match or outperform their latent-space counterparts while delivering 3.18 to 4.75 times end-to-end inference speedups. We hope that our findings provide useful empirical insights and practical guidelines for future research on pixel-space generation.', 'score': 23, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': 'f410b61d109e8ee3', 'authors': ['Dengyang Jiang', 'Ruoyi Du', 'Zhennan Chen', 'Dongyang Liu', 'Zanyi Wang', 'Mingzhe Zheng', 'Xiangpeng Yang', 'Huanqia Cai', 'Aiming Hao', 'Yuming Jiang', 'Peng Gao', 'Harry Yang', 'Steven Hoi'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'Nanjing University', 'The Hong Kong University of Science and Technology', 'University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2608.16887.jpg', 'data': {'categories': ['#optimization', '#diffusion', '#inference', '#training'], 'emoji': '🚀', 'ru': {'title': 'От латентного к пиксельному: ускорение диффузионных моделей через гибридное обучение', 'desc': 'В статье предлагается стратегия обучения diffusion моделей, которая начинается в скрытом пространстве признаков, а затем переходит в пиксельное пространство для ускорения конвергенции и улучшения скорости инференса. Авторы выявили, что прямое обучение больших моделей диффузии в пиксельном пространстве сходится значительно медленнее, чем в скрытом пространстве. Они систематически исследовали ключевые гиперпараметры переходного этапа: инициализацию весов, состав данных, предсказываемый целевой сигнал, архитектуру декодера и расписание шума. В результате достигнуто ускорение инференса в 3.18-4.75 раза при сохранении или превосходстве качества по сравнению с латентными моделями.'}, 'en': {'title': 'Accelerating Pixel-Space Diffusion with Latent-to-Pixel Training', 'desc': 'This paper introduces a novel training approach called latent-to-pixel strategy for pixel-space diffusion models, which enhances both convergence speed and inference efficiency. The authors highlight that traditional large-scale training in pixel space is slower compared to latent space, prompting the need for a more effective method. By leveraging latent space to establish generative priors and then transitioning to pixel space, they achieve significant improvements in model performance. Their systematic analysis of design choices leads to pixel-space models that not only match but can also exceed the capabilities of existing latent-space models, while offering substantial speed advantages during inference.'}, 'zh': {'title': '潜在到像素：加速生成模型的创新策略', 'desc': '本研究提出了一种潜在到像素的训练策略，旨在加速大规模像素空间扩散模型的收敛速度并提高推理速度。研究表明，直接在像素空间进行大规模预训练的收敛速度明显慢于在潜在空间中的收敛速度。通过系统地研究关键设计选择，作者确定了一种实用的训练方案，使得像素空间模型在性能上能够与潜在空间模型相媲美或超越，同时实现了3.18到4.75倍的推理速度提升。希望这些发现能为未来的像素空间生成研究提供有用的经验见解和实用指导。'}}}, {'id': 'https://huggingface.co/papers/2608.15089', 'title': 'StateM: Reaching 95.3% Raw Accuracy, or a \\$15 Frontier Run, on Terminal-Bench 2.1 via Harness Scaling', 'url': 'https://huggingface.co/papers/2608.15089', 'abstract': 'Abstract StateM is a runtime system that improves long-horizon agent execution through durable states, recoverable runbooks, and enforceable procedural controls without altering model weights.  Generated by thinkingmachines/Inkling-Small Long-horizon agents can fail even when their underlying models can solve the constituent steps. They may lose track of mutable state, fail to reactivate lessons from earlier executions, skip known procedures, or stop prematurely. We bet on harness scaling to improve the execution system around an agent without changing its model weights. We introduce StateM, an agent-native runtime that organizes execution around durable states, phase-local context, checked transitions, recoverable runbooks, and versioned procedural practices that agents and users can inspect together.   On Terminal-Bench 2.1, StateM raises GPT-5.5 xhigh to 92.1\\%, versus 83.1\\% reference and GPT-5.6 Sol Ultra at 91.9\\%. The runbook transfers unchanged to GPT-5.6. With GPT-5.6 Sol xhigh, StateM reaches 95.3\\% raw accuracy across 445 trials and succeeds on all 89 tasks at least once. The frozen profile raises GPT-5.6 Luna from 76.7 to 85.4\\%, above the 84.9\\% Sol xhigh reference.   Using the same runtime, runbook structure, and golden rules, less than \\38 of adaptation raises DeepSeek-V4 Flash from 82.7 to 88.1% under standard timeouts and to 89.1% on an 88-task common core. Extending only the remaining latency-sensitive task matches the reported 88.8% GPT-5.6 Sol max result. Final-score API usage is about 15 versus \\574.68 for the GPT reference; total DeepSeek expenditure is 52.22.   On BusinessBench, family-specific runbooks built on development sets yield held-out gains of 0.55 macro and 1.34 micro points; two mechanism-matched families improve by 10.04 points. Concrete rules generalize when tasks share execution structure, while the control methodology applies broadly. StateM turns selected postmortem findings into persistent, executable preconditions and practices, making learned controls explicit and enforceable through stateful controls. Code at github.com/henryqin1997/statem.', 'score': 21, 'issue_id': 3032, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '11f2f424cce7b4a0', 'authors': ['Ziheng Qin', 'Yaxin Lu', 'Zhangyang Atlas Wang', 'Kai Wang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2608.15089.jpg', 'data': {'categories': ['#agents', '#benchmark', '#optimization', '#open_source'], 'emoji': '🎯', 'ru': {'title': 'Управление состояниями агента вместо изменения весов модели', 'desc': 'StateM — это runtime система, которая улучшает выполнение долгосрочных задач агентами без изменения весов модели. Система организует исполнение вокруг устойчивых состояний, восстанавливаемых процедур и контролируемых переходов, позволяя агентам сохранять контекст и восстанавливаться после ошибок. Экспериментальные результаты демонстрируют значительный прирост точности: GPT-5.5 улучшается с 83.1% до 92.1%, а DeepSeek-V4 Flash достигает 88.1% с минимальной адаптацией. Подход эффективен для разных моделей и показывает, что структурированное управление выполнением может быть эффективнее масштабирования самих моделей.'}, 'en': {'title': 'Enhancing Agent Performance with StateM: Reliable Execution Without Model Changes', 'desc': 'StateM is a runtime system designed to enhance the performance of long-horizon agents by managing their execution environment without modifying their underlying model weights. It addresses common issues such as losing track of mutable states and failing to utilize learned lessons from previous tasks. By implementing durable states, recoverable runbooks, and procedural controls, StateM allows agents to execute tasks more reliably and efficiently. The system has demonstrated significant improvements in accuracy across various benchmarks, showcasing its effectiveness in organizing agent execution and ensuring adherence to procedural guidelines.'}, 'zh': {'title': 'StateM：提升智能体执行的持久性与准确性', 'desc': 'StateM 是一个运行时系统，旨在通过持久状态、可恢复的执行手册和可执行的程序控制来改善长时间运行的智能体执行，而不改变模型权重。长时间运行的智能体可能会在执行过程中失去对可变状态的跟踪，无法重新激活早期执行的经验，跳过已知程序或提前停止。StateM 通过组织持久状态、阶段本地上下文、检查过渡、可恢复的执行手册和版本化的程序实践，提升了智能体的执行系统。实验结果显示，StateM 在多个任务上显著提高了智能体的准确性和执行效率。'}}}, {'id': 'https://huggingface.co/papers/2608.13900', 'title': 'Agentic Transaction: Towards ACID-Compliant Agent Systems', 'url': 'https://huggingface.co/papers/2608.13900', 'abstract': 'Abstract An ACID-compliant framework for agentic transactions introduces semantic guarantees to ensure reliable, isolated, and durable execution of long-horizon LLM agent workflows.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents are evolving from conversational assistants into autonomous systems that execute long-horizon tasks through reasoning, tool use, code generation, and workspace manipulation. As agents increasingly operate over persistent environments and multi-step workflows, they face challenges analogous to those addressed by transactional database systems: reliable execution, consistent outcomes, safe concurrency, and durable state management. We introduce the concept of an agentic transaction and propose an ACID-compliant agent system framework that reinterprets the classical ACID properties for agent execution through four semantic guarantees: Semantic Atomicity, Semantic Consistency, Semantic Isolation, and Semantic Durability. Together, these properties provide a principled foundation for building reliable agent systems despite model uncertainty and dynamic execution environments. To instantiate this framework, we develop an ACID-compliant data agent that realizes these guarantees through transactional exploration-execution-validation cycles, transactional skill hubs, confidence divergence-based validation, semantic dependency-aware isolation, and transaction-aware semantic state management. Experimental results on widely used benchmarks show that our system achieves a 10.6% improvement over state-of-the-art agents, including Claude Code. This work opens a broader research agenda on extending transactional principles and system architectures toward building trustworthy, scalable, and self-evolving AI agent systems.', 'score': 21, 'issue_id': 3017, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '5b067266cfc326da', 'authors': ['Zhaoyan Sun', 'Xiaoxiao Wang', 'Guoliang Li'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13900.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'Транзакционная надёжность для автономных LLM-агентов', 'desc': 'В статье представлена ACID-совместимая архитектура для агентов, основанных на больших языковых моделях, которая обеспечивает надёжное выполнение многошаговых задач. Авторы переносят классические свойства транзакций из систем баз данных на выполнение агентов через четыре семантических гарантии: атомарность, консистентность, изоляция и долговечность. Система реализует эти гарантии через циклы исследования-выполнения-валидации и семантическое управление состоянием агента. Экспериментальные результаты демонстрируют улучшение на 10,6% по сравнению с современными агентами, включая Claude Code.'}, 'en': {'title': 'Building Reliable AI Agents with ACID Transactions', 'desc': "This paper presents a new framework for managing long-term tasks performed by large language model (LLM) agents, ensuring they operate reliably and consistently. It introduces the concept of 'agentic transactions' that apply ACID properties—Atomicity, Consistency, Isolation, and Durability—to the execution of these agents. By implementing these properties, the framework addresses challenges like reliable execution and safe concurrency in dynamic environments. The proposed system shows significant performance improvements over existing agents, paving the way for more trustworthy and scalable AI systems."}, 'zh': {'title': '构建可靠自主代理的ACID框架', 'desc': '本文提出了一种符合ACID原则的框架，用于确保长时间跨度的LLM代理工作流的可靠、隔离和持久执行。随着LLM代理从对话助手演变为自主系统，它们在执行复杂任务时面临与事务数据库系统类似的挑战。我们引入了代理事务的概念，并提出了四个语义保证：语义原子性、语义一致性、语义隔离和语义持久性，以支持可靠的代理系统构建。实验结果表明，我们的系统在多个基准测试中比现有最先进的代理提高了10.6%的性能。'}}}, {'id': 'https://huggingface.co/papers/2608.16319', 'title': 'Advancing Open and Reproducible Relational Learning: RelArena-α, TabPFN-Rel and RPI', 'url': 'https://huggingface.co/papers/2608.16319', 'abstract': 'Abstract Prior Labs released open-source tools including a unified relational benchmark framework, a TabPFN-based relational model, and a model-agnostic predictive interface to advance reproducible relational learning.  Generated by thinkingmachines/Inkling-Small This first release of Prior Labs in relational learning shows our continued commitment to open science. We open-source three pieces of software that we expect to accelerate research in the field towards meaningful real-world impact. We aim to steer further development based on feedback from, and in collaboration with, the community. Given the early stage of development, our α-release targets researchers and early-adopting practitioners. Over the past years, a variety of datasets and tasks for relational learning have emerged, but the community has not converged on a reliable, reproducible way to compare different methods on these tasks. Our α-release, RelArena-α, provides a unified framework for running and comparing baselines on RelBench v1 by standardizing data loading, evaluation protocols, tuning regimes, and support for systems with custom tuning, inspired by established tabular benchmarks such as TabArena. We plan to work with the research community to further develop RelArena-α into a catalyst for progress in the relational learning community. We release the initial version of TabPFN-Rel, a purpose-built relational harness for TabPFN-3. Currently ranked first among models on RelArena-α, TabPFN-Rel makes key improvements upon RDBLearn. Beyond its ranking, TabPFN-Rel serves as a strong baseline, adding to the growing evidence that flattening a relational database into a single table remains competitive with specialized relational architectures on real-world tasks.   To facilitate adoption of relational learning methods in research and industry, we release an initial α-version of our Relational Predictive Interface, RPI, an open-source, model-agnostic interface that enables early adopters to easily define problems on new databases and apply any model implemented in RelArena-α, including TabPFN-Rel, to these problems.', 'score': 20, 'issue_id': 3025, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '90b88e83dc607272', 'authors': ['Adrian Hayler', 'Klemens Flöge', 'Alan Arazi', 'Rishabh Ranjan', 'Jure Leskovec', 'Felix Birkel', 'Brendan Roof', 'Anurag Garg', 'Kristina Collins', 'Lydia Sidhoum', 'Jonas Kübler', 'Siyuan Guo', 'Oscar Key', 'Jan Hendrik Metzen', 'Rylee Grace', 'David Salinas', 'Arthur Cahu', 'Simon Bing', 'Benjamin Jäger', 'Tuana Çelik', 'Mihir Manium', 'Vitor Monteiro', 'Jake Robertson', 'Jerry Chen', 'Eliott Kalfon', 'Tomás Pereda', 'Lilly Wehrhahn', 'Dominik Safaric', 'Tobias Schroeder', 'Georg Grab', 'Diana Kriuchkova', 'Clara Cornu', 'Philipp Singer', 'Nick Erickson', 'Vahid Balazadeh', 'Marie Salmon', 'Simone Alessi', 'Kürşat Kaya', 'Philipp Jund', 'Léo Grinsztajn', 'Yann LeCun', 'Bernhard Schölkopf', 'Madelon Hulsebos', 'Lennart Purucker', 'Sauraj Gambhir', 'Frank Hutter', 'Noah Hollmann'], 'affiliations': ['ELLIS Institute Tubingen', 'NVIDIA', 'Prior Labs', 'Stanford University', 'University of Freiburg'], 'pdf_title_img': 'assets/pdf/title_img/2608.16319.jpg', 'data': {'categories': ['#dataset', '#architecture', '#open_source', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Открытые инструменты для масштабируемого реляционного обучения', 'desc': 'Prior Labs выпустил набор открытых инструментов для развития реляционного обучения, включая унифицированный фреймворк RelArena-α для воспроизводимого сравнения методов на стандартизированных данных. Авторы представили TabPFN-Rel — специализированную модель на основе TabPFN-3, которая показывает лучшие результаты в бенчмарке и подтверждает эффективность простого подхода с приведением реляционных данных к плоской таблице. Разработана модель-агностичная Relational Predictive Interface (RPI), позволяющая исследователям и практикам легко применять любые модели из RelArena-α к новым базам данных. Проект демонстрирует приверженность open science и ориентирован на ускорение воспроизводимых исследований в области реляционного обучения.'}, 'en': {'title': 'Advancing Reproducibility in Relational Learning with Open Tools', 'desc': 'This paper introduces open-source tools aimed at enhancing reproducibility in relational learning. It presents a unified benchmark framework called RelArena-α, which standardizes data handling and evaluation for various relational learning tasks. The release includes a new relational model, TabPFN-Rel, which outperforms previous models and demonstrates the effectiveness of flattening relational databases. Additionally, a model-agnostic interface, the Relational Predictive Interface (RPI), is provided to facilitate the application of different models to new databases.'}, 'zh': {'title': '推动关系学习的开源工具', 'desc': 'Prior Labs发布了开源工具，包括统一的关系基准框架、基于TabPFN的关系模型和模型无关的预测接口，以推动可重复的关系学习。此次发布展示了我们对开放科学的持续承诺，旨在加速该领域的研究并产生实际影响。RelArena-α提供了一个统一的框架，用于在RelBench v1上运行和比较基线，标准化数据加载、评估协议和调优机制。我们还发布了TabPFN-Rel模型，作为强基线，证明将关系数据库扁平化为单个表在实际任务中仍具竞争力。'}}}, {'id': 'https://huggingface.co/papers/2608.14905', 'title': 'How Do Agents Fail on AutoResearch: End-to-End Diagnostic Evaluation on 100 Real-World Frontier Research Tasks', 'url': 'https://huggingface.co/papers/2608.14905', 'abstract': 'Abstract Autonomous research agents evaluated across the full scientific lifecycle reveal a pervasive lack of metacognitive self-correction, motivating a new benchmark and failure taxonomy.  Generated by thinkingmachines/Inkling-Small AI has long assisted scientific research, but the rapid advance of LLMs and agentic scaffolds is reshaping the landscape; a single system can now carry whole-stage research from an initial hypothesis all the way to final published paper, which is a paradigm now referred to as AutoResearch. Existing evaluations reveal little about how these agents operate or where they break down. Tasks are narrowly-scoped, evaluation measures performance but not process, and failure diagnoses lack systematic coverage or artifact-level visibility. To address this gap, we introduce AutoResearchEval, featuring 100 tasks grounded in published frontier science across 7 scientific domains and the full research lifecycle, including ideation, retrieval, execution, analysis, writing, and review. Evaluating 8 harness-model combinations yields 800 autoresearch agent trajectories, with process-level annotation. We organize these insights into AutoResearch Failure Taxonomy or ARFT, a framework of 45 empirically-grounded failure patterns. To enable scalable fine-grained attribution, we leverage a human-calibrated agent-as-a-judge pipeline to inspect complete trajectories and intermediate artifacts. Failure patterns converge on a single overarching limitation, namely that current agents lack a metacognitive loop, which entails the ability to check what they produced against what they found, revise when it does not hold up, and question whether the path they took was sound. The same patterns recur across all 8 harness-model combinations, including the strongest models tested, locating the deficit at the model level rather than in any particular scaffold; whether orchestration-level interventions can close it is an open question this work does not test. We publicly release AutoResearchEval and ARFT to facilitate continued research and development in autonomous scientific discovery.', 'score': 20, 'issue_id': 3024, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '75f22e4b1bb4a369', 'authors': ['Yanlin Fei', 'Nazhou Liu', 'Xinmiao Yu', 'Shaolong Chen', 'Lei Li', 'Rahul Thapa', 'Madalina Ciobanu', 'Qingqing Mao', 'Ritankar Das'], 'affiliations': ['Prentis AI', 'Stanford University', 'Titan Holdings'], 'pdf_title_img': 'assets/pdf/title_img/2608.14905.jpg', 'data': {'categories': ['#science', '#reasoning', '#agents', '#benchmark', '#interpretability', '#dataset'], 'emoji': '🔬', 'ru': {'title': 'Метакогнитивное слепое пятно в исследовательских AI-агентах', 'desc': 'В статье представлена оценка автономных исследовательских агентов, которые способны выполнять полный цикл научной работы от гипотезы до публикации. Авторы создали новый бенчмарк AutoResearchEval с 100 задачами из 7 научных областей и разработали таксономию ARFT, классифицирующую 45 типов ошибок, обнаруженных при анализе 800 траекторий агентов. Ключевое открытие показывает, что все современные модели LLM страдают от отсутствия метакогнитивного цикла — способности проверять и пересматривать полученные результаты, критически оценивать правильность выбранного пути решения. Эта фундаментальная проблема наблюдается на уровне моделей независимо от конкретной архитектуры или оркестровки агента.'}, 'en': {'title': 'Enhancing Autonomous Research with Metacognitive Self-Correction', 'desc': "This paper discusses the limitations of autonomous research agents in scientific discovery, particularly their lack of metacognitive self-correction. It introduces a new evaluation benchmark called AutoResearchEval, which includes 100 tasks across various scientific domains to assess the entire research lifecycle. The authors also present the AutoResearch Failure Taxonomy (ARFT), identifying 45 failure patterns that highlight the agents' inability to critically evaluate their outputs. The findings suggest that improvements in metacognitive capabilities are necessary for these agents to enhance their research processes effectively."}, 'zh': {'title': '推动自主科学研究的元认知革命', 'desc': '这篇论文探讨了自主研究代理在科学研究生命周期中的表现，发现它们缺乏元认知自我修正能力。为了填补这一空白，作者提出了AutoResearchEval基准，包含100个任务，覆盖7个科学领域的完整研究过程。研究还建立了AutoResearch Failure Taxonomy（ARFT），识别出45种基于经验的失败模式，揭示了当前代理的主要限制在于缺乏元认知循环。通过这些研究，作者希望推动自主科学发现的进一步发展。'}}}, {'id': 'https://huggingface.co/papers/2608.16721', 'title': 'GenRouter: Unified Workflow Routing for Agentic Image Generation', 'url': 'https://huggingface.co/papers/2608.16721', 'abstract': 'Abstract GenRouter is a unified routing framework that adaptively directs prompts to optimal agentic image-generation workflows, cutting costs and latency while improving visual alignment and enabling continuous self-evolution.  Generated by thinkingmachines/Inkling-Small The rapid evolution of text-to-image (T2I) generation models has effectively solved the foundational challenge of raw pixel synthesis, shifting the community\'s focus toward fulfilling increasingly intricate user requests. While recent agentic image generation workflows enhance static inference with advanced capabilities like external knowledge retrieval and iterative reasoning, they mostly operate in isolated silos with fixed ``one-size-fits-all" topologies. This inevitably leads to severe compute-mismatch, where simple queries are forced through computationally heavy pipelines. To bridge this gap, we present GenRouter, the first unified workflow routing framework for agentic image generation. We first formulate GenCanvas, standardizing diverse agentic pipelines into a universal set of foundational primitives and executable templates. Operating over this unified space, GenRouter adaptively routes heterogeneous prompts to their optimal workflows via (i) demand profiling, (ii) experience matching, and (iii) Pareto filtering. Extensive experiments across diverse benchmarks demonstrate that GenRouter achieves superior visual alignment while reducing execution costs by over 95% and latency by 65% compared to heavyweight static pipelines. Furthermore, the system continuously self-evolves via accumulated experience, enabling robust zero-shot generalization that boosts performance and halves computational overhead.', 'score': 19, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '1cc808a6b153787b', 'authors': ['Harold Haodong Chen', 'Zhiyu Hou', 'Wen-Jie Shu', 'Weilin Ruan', 'Yingjie Xu', 'Litao Guo', 'Ying-Cong Chen'], 'affiliations': ['CUHK', 'HKUST', 'HKUST(GZ)', 'SUSTech', 'ZODA'], 'pdf_title_img': 'assets/pdf/title_img/2608.16721.jpg', 'data': {'categories': ['#cv', '#agents', '#multimodal', '#benchmark'], 'emoji': '🛣️', 'ru': {'title': 'Умная маршрутизация агентной генерации изображений', 'desc': "GenRouter — это единая система маршрутизации для агентных моделей генерации изображений, которая интеллектуально распределяет пользовательские запросы к оптимальным вычислительным конвейерам. Система использует три основных механизма: профилирование требований запроса, сопоставление с накопленным опытом и фильтрацию Парето для выбора наиболее эффективного пути обработки. В результате достигается значительное снижение затрат (на 95%) и задержек (на 65%) по сравнению со статическими pipeline'ами, при этом улучшается соответствие визуального результата запросу. Система обладает способностью к непрерывному самоулучшению благодаря накоплению опыта, что позволяет ей обобщаться на новые задачи без дополнительного обучения."}, 'en': {'title': 'Smart Routing for Efficient Image Generation', 'desc': 'GenRouter is a new framework designed to improve how prompts are directed to different image generation workflows. It helps reduce costs and speed up processing by ensuring that each prompt is handled by the most suitable method. By standardizing various workflows into a common set of tools, GenRouter can adaptively route requests based on their complexity and requirements. This leads to better visual results and significant savings in computational resources, while also allowing the system to learn and improve over time.'}, 'zh': {'title': '智能图像生成的最佳路由解决方案', 'desc': 'GenRouter 是一个统一的路由框架，能够自适应地将提示引导到最佳的图像生成工作流，从而降低成本和延迟，同时提高视觉一致性并实现持续自我进化。随着文本到图像生成模型的快速发展，社区的关注点已转向满足越来越复杂的用户请求。GenRouter 通过标准化多样的代理工作流，将其转化为一组通用的基础原语和可执行模板，解决了计算不匹配的问题。通过需求分析、经验匹配和帕累托过滤，GenRouter 能够有效地将异构提示路由到最优工作流，显著提高了性能并减少了计算开销。'}}}, {'id': 'https://huggingface.co/papers/2608.15304', 'title': 'Understanding Cognition-Induced Risks in Agentic AI Systems', 'url': 'https://huggingface.co/papers/2608.15304', 'abstract': 'Abstract Agentic systems built on large language models pose escalating risks to human agency and autonomy across physical, social, and self-referential cognitive levels, requiring targeted mitigation strategies.  Generated by thinkingmachines/Inkling-Small Frontier agentic systems powered by large language models (LLMs) exhibit human-like patterns of cognition. As these systems become deeply integrated across different domains, their cognitive engagement raises critical concerns for human society that remain insufficiently studied. To address this gap, we systematically analyze risks induced by expanding cognitive capabilities, following a three-level framework defined by their cognitive scope, from physical cognition to social cognition, and finally to self-referential cognition. We study their potential risks to human agency, autonomy, and control capability, corresponding to each cognitive level. We finally propose strategies to mitigate these risks and enhance the controllability of agentic AI systems, ensuring their long-term safe development.', 'score': 15, 'issue_id': 3017, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': 'bf5a9daf1e81ac25', 'authors': ['Guanchu Wang', 'Qinuo Li', 'Mengnan Du', 'Xia Hu', 'Bowen Zhou'], 'affiliations': ['Beijing Institute of Technology', 'FIT - Institute of Science and Technology', 'IRET - Institute of Cognitive Science and Technologies, National Research Council', 'Sapienza University of Rome'], 'pdf_title_img': 'assets/pdf/title_img/2608.15304.jpg', 'data': {'categories': ['#alignment', '#ethics', '#security'], 'emoji': '⚠️', 'ru': {'title': 'Контроль и безопасность: трёхуровневая защита человеческой автономии от агентных LLM-систем', 'desc': 'В работе анализируются риски, которые создают агентные системы на основе больших языковых моделей для человеческой автономии и свободы воли. Авторы предлагают трёхуровневую классификацию этих рисков: физическое познание, социальное познание и самореферентное познание. Для каждого уровня исследуются потенциальные угрозы контролю человека и его способности принимать независимые решения. В статье также предлагаются стратегии смягчения рисков и повышения управляемости агентных AI-систем для обеспечения их безопасного развития.'}, 'en': {'title': 'Mitigating Risks of Agentic AI for Human Autonomy', 'desc': 'This paper discusses the risks associated with agentic systems that use large language models (LLMs) and their impact on human agency and autonomy. It identifies three levels of cognitive engagement: physical, social, and self-referential, each posing unique challenges to human control. The authors analyze how these systems can mimic human-like cognition and the potential dangers that arise as they become more integrated into society. To address these concerns, the paper proposes targeted strategies to mitigate risks and improve the controllability of these advanced AI systems.'}, 'zh': {'title': '自主系统的风险与控制策略', 'desc': '这篇论文探讨了基于大型语言模型的自主系统对人类自主性和控制能力的潜在风险。研究表明，这些系统在物理、社会和自我认知层面上表现出类似人类的认知模式。随着这些系统在各个领域的深入应用，它们的认知能力引发了对人类社会的重大担忧。论文提出了一种三层框架来分析这些风险，并建议相应的缓解策略，以确保自主人工智能系统的安全发展。'}}}, {'id': 'https://huggingface.co/papers/2608.14783', 'title': 'MegaParts: Scaling Part-Aware 3D Object Generation to 300 Parts via Token-Efficient Autoregressive Modeling', 'url': 'https://huggingface.co/papers/2608.14783', 'abstract': 'Abstract MegaParts scales part-aware 3D generation via token-efficient vector-quantized part tokens and structured autoregressive sequence modeling with long-context training.  Generated by thinkingmachines/Inkling-Small Part-aware 3D object generation is essential for graphics applications such as controllable modeling, editing, and articulation, where objects are represented as coherent assemblies of semantic parts. However, existing part-aware generation methods, do not scale well to highly complex objects. As the number of parts increases, generating detailed geometry becomes prohibitively expensive in token length and memory. We introduce MegaParts, a scalable autoregressive 3D generation framework to address this challenge by combining structured sequence modeling with a token-efficient vector-quantized shape tokenizer. Our tokenizer learns discrete latent representations for part-level geometry by minimizing token usage subject to high-fidelity reconstruction, enabling adaptive-length tokenization based on geometric complexity. On top of this compact representation, we train a large language model to generate object bounding boxes, part bounding boxes, and part shape tokens within a unified structured sequence. Combined with efficient long-context training strategy, our token-efficient formulation scales to objects with up to 300 parts and sequence lengths up to 256k tokens. This substantially extends the scale of part-aware 3D generation while preserving compositional structure and enabling fine-grained part-level control. Our method achieves higher mesh quality than baseline autoregressive and diffusion models, showing that compressed discrete part tokens improve not only scalability but also the achievable fidelity of generated geometry. These results suggest that LLM native token-efficient autoregressive modeling is a compelling alternative to diffusion for large-scale part-aware 3D generation. The project page is available at https://expmaster.github.io/megaparts_webpage.', 'score': 15, 'issue_id': 3017, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '62897c6618797415', 'authors': ['Manwen Liao', 'Xinyu Lian', 'Jian Mao', 'Kaixu Chen', 'Li Luo', 'Jinghao Yan', 'Wanshui Gan', 'Qiao Yu', 'Weitian Zhang', 'Chunhua Shen', 'Guang Chen', 'Bo Dai', 'Xudong Xu', 'Zhaoyang Lyu'], 'affiliations': ['Fudan University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'The University of Hong Kong', 'Tongji University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14783.jpg', 'data': {'categories': ['#architecture', '#optimization', '#3d', '#long_context', '#training'], 'emoji': '🧩', 'ru': {'title': 'Экономные токены для генерации сложных многодетальных 3D объектов', 'desc': 'MegaParts представляет новый метод для генерации сложных 3D объектов, состоящих из множества семантических частей. Авторы разработали эффективный векторный квантизатор, который представляет геометрию отдельных частей в виде компактных дискретных токенов, адаптивно сокращая их количество в зависимости от сложности геометрии. На основе этого представления они обучили большую языковую модель генерировать структурированные последовательности, включающие ограничивающие рамки объектов и частей, а также токены форм, что позволяет обрабатывать объекты с сотнями деталей. Метод демонстрирует, что токен-эффективное авторегрессивное моделирование превосходит диффузионные модели по качеству геометрии и масштабируемости для генерации части-ориентированных 3D моделей.'}, 'en': {'title': 'Scalable 3D Generation with Part-Aware Precision', 'desc': 'MegaParts is a novel framework for generating 3D objects that are aware of their parts, which is crucial for applications like modeling and editing. It uses a token-efficient vector-quantized tokenizer to minimize the number of tokens needed while maintaining high-quality geometry. By employing structured autoregressive sequence modeling, it can handle complex objects with up to 300 parts and long sequences of up to 256k tokens. This approach not only improves scalability but also enhances the fidelity of the generated 3D models compared to traditional methods.'}, 'zh': {'title': 'MegaParts：高效的3D生成新方法', 'desc': 'MegaParts 是一种可扩展的自回归 3D 生成框架，旨在解决复杂物体生成中的挑战。它结合了结构化序列建模和高效的向量量化形状标记器，能够在保持高保真重建的同时，减少标记的使用。通过学习离散的潜在表示，MegaParts 可以适应几何复杂度进行动态长度的标记化。该方法在生成具有多达 300 个部分的物体时，显著提高了网格质量，并展示了其在大规模部分感知 3D 生成中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.16328', 'title': 'GRNEdit: Efficient General Video Editing from a New Binary-Evidence Perspective in Generative Refinement Networks', 'url': 'https://huggingface.co/papers/2608.16328', 'abstract': 'Abstract GRNEdit is a lightweight two-stage framework that models video editing intent via binary semantic decisions and source evidence, achieving strong results with minimal parameters.  Generated by thinkingmachines/Inkling-Small Instruction-based general video editing seeks to unify diverse editing operations within a single, intuitive interface. Existing approaches often rely on resource-intensive conditioning, using either heavyweight branches or costly source concatenation. Is there any efficient way to model editing intent? Thus, we introduce GRNEdit, a lightweight two-stage framework. GRN inspires our approach by encoding visual semantics through combinations of bits. Through task-specific fine-tuning, we take this representation further and recast editing semantics as local retain-or-flip decisions over individual bits. Source information is consequently modeled as coordinate-wise evidence supporting the observed binary states, while the GRN backbone remains responsible for resolving their global composition into coherent generative semantics. In Stage I, a compact encoder translates discrete source codes into continuous evidence signals, which GRN assimilates throughout binary refinement. Inspired by null-prompt training for classifier-free guidance, we further assign the null condition an editing-specific meaning: an empty instruction denotes no edit and is supervised through source reconstruction. This identity pathway not only implicitly strengthens evidence utilization and content preservation in Stage I, but also produces a source-preserving state in the same representation space as the edited state. Stage II can therefore directly compare each edited state with its source-preserving counterpart and use their discrepancy to revise unresolved target-bit decisions. Trained on only 0.6M pairs with less than 3\\% conditioning parameters, GRNEdit-2B and GRNEdit-8B achieve scores of 4.03 and 4.18 on OpenVE-Bench. The 2B model outperforms multiple 14B open-source editors, while the 8B model performs on par with leading open-source editors.', 'score': 13, 'issue_id': 3025, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '8a221fe7c3488065', 'authors': ['Feng Xie', 'Jiagao Hu', 'Fuhao Li', 'Zepeng Wang', 'Yuxuan Chen', 'Dahua Gao', 'Fei Wang', 'Daiguo Zhou'], 'affiliations': ['MiLM Plus, Xiaomi Inc.', 'Xidian University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16328.jpg', 'data': {'categories': ['#video', '#training', '#architecture', '#small_models'], 'emoji': '🎬', 'ru': {'title': 'Лёгкая двухэтапная модель видеоредактирования через бинарные семантические решения', 'desc': 'GRNEdit — это компактная двухэтапная архитектура для редактирования видео по текстовым инструкциям, которая моделирует намерение редактирования через бинарные семантические решения. Вместо громоздких методов кондиционирования, модель представляет редактирование как локальные решения сохранить или изменить отдельные биты в представлении видео. На первом этапе кодер преобразует исходный контент в сигналы свидетельства для поддержки бинарных состояний, а на втором этапе сравнивает отредактированное состояние с сохранённым исходным состоянием для уточнения решений. Модели GRNEdit-2B и GRNEdit-8B достигают высоких результатов при обучении на небольшом наборе данных (0.6M пар) с минимальным количеством параметров кондиционирования, превосходя значительно более крупные конкурирующие системы.'}, 'en': {'title': 'Efficient Video Editing with Minimal Parameters', 'desc': 'GRNEdit is a novel two-stage framework designed for efficient video editing by modeling editing intent through binary semantic decisions. It utilizes a compact encoder to convert discrete source codes into continuous evidence signals, allowing for effective editing with minimal parameters. The framework employs task-specific fine-tuning to enhance editing semantics, enabling local decisions on whether to retain or flip individual bits of video content. With impressive performance metrics, GRNEdit demonstrates that it can achieve high-quality video editing results while using significantly fewer resources compared to existing methods.'}, 'zh': {'title': '轻量级视频编辑意图建模的创新框架', 'desc': 'GRNEdit是一个轻量级的两阶段框架，旨在通过二元语义决策和源证据来建模视频编辑意图。该方法通过编码视觉语义，利用位的组合来实现高效的编辑意图建模。第一阶段将离散源代码转换为连续证据信号，第二阶段则通过比较编辑状态与源状态来优化决策。GRNEdit在仅使用60万对数据和不到3%的条件参数的情况下，取得了优异的性能，超越了多个大型开源编辑器。'}}}, {'id': 'https://huggingface.co/papers/2608.16391', 'title': 'Ventor-QTest: Threat-Model-Driven Verification of Vendor-Hosted LLM APIs', 'url': 'https://huggingface.co/papers/2608.16391', 'abstract': 'Abstract Ventor-QTest audits hosted open-weight model APIs via repeated and long-sequence black-box probes, measuring average and extreme fidelity loss to detect degradation in long-horizon agentic performance.  Generated by thinkingmachines/Inkling-Small As large language models become increasingly widespread, third-party providers that deploy open-weight models have become an important part of the ecosystem. Auditing the quality of their inference APIs is therefore an open problem. We formalize hosted model routing as a stochastic process and propose \\textbf{Ventor-QTest}, a composite black-box audit that requires no probability information from the target API. Its repeated-request component sends each frozen constrained context to the target multiple times, reconstructs a categorical output distribution from the returned text counts, and reports average fidelity loss (AFL) as a null-bias-corrected, within-window mean coarsened-KL statistic. Its long-sequence component uses independent runs to report extreme fidelity loss (EFL) through the empirical upper tail of a run-level reference-centered-surprisal statistic. Across three logprob-capable route conditions, AFL shows strong linear descriptive agreement with a logprob-derived coarsened-KL comparator. Across seven route snapshots, 20-run sequence probes reveal route-specific EFL variation. AFL and EFL have little detectable route-level association with GPQA-Diamond accuracy. In contrast, pronounced EFL coincides with a decline in Terminal-Bench pass rate as task exposure increases. This pattern may arise because correctness in long-horizon tasks i
