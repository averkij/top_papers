бых деталей к точным. Вместо фиксированной конечной точки в процессе интерполяции, метод использует движущуюся конечную точку, отфильтрованную фильтром теплопроводности, которая плавно эволюционирует от изображения с низкими частотами к чистому изображению. Высокочастотные компоненты раскрываются постепенно через адаптивное расписание, управляемое энергией самого изображения, что приводит к переориентированию скорости в flow matching. Метод достигает лучших результатов на задаче класс-условной генерации изображений в ImageNet, получив FID 1.45 при 600 эпохах обучения и FID 1.58 при разрешении 512×512.'}, 'en': {'title': 'Progressive Detail Unveiling in Generative Models', 'desc': 'Energy-Guided Flow Matching (EG-FM) enhances the quality of generative models by progressively revealing high-frequency details during the image generation process. It replaces the traditional fixed endpoint in flow matching with a dynamic endpoint that evolves from low-frequency to high-frequency images, allowing for better control over the generation trajectory. This method reduces training costs while achieving state-of-the-art Fréchet Inception Distance (FID) scores, indicating improved image quality. EG-FM is efficient, requiring no changes to the existing model architecture or training data, and it performs well in both image generation and text-to-image tasks.'}, 'zh': {'title': '能量引导流匹配：提升生成质量的新方法', 'desc': '本文提出了一种名为能量引导流匹配（EG-FM）的方法，旨在提高生成模型的质量。EG-FM通过移动端点和自适应调度，逐步揭示高频细节，从而降低训练成本并实现最先进的FID分数。与传统的流匹配方法不同，EG-FM显式建模了从粗到细的生成轨迹，使用热核滤波器平滑演变的端点。实验结果表明，EG-FM在图像生成任务中表现出色，能够在较少的训练周期内获得更低的FID分数。'}}}, {'id': 'https://huggingface.co/papers/2608.17597', 'title': 'HarnessRisk: A Lifecycle-Oriented Benchmark for Agent Harness Safety', 'url': 'https://huggingface.co/papers/2608.17597', 'abstract': 'Abstract HarnessRisk evaluates agent harness safety across six operational phases, revealing that configuration vulnerabilities and detection gaps allow high attack success despite preserved utility.  Generated by thinkingmachines/Inkling-Small Large language models are increasingly deployed through agent harnesses that manage tools, extensions, persistent state, permissions, and external actions. Existing safety benchmarks mainly target individual attack mechanisms or a limited subset of operational settings, making it difficult to compare how safety failures emerge across different harness responsibilities. We present HarnessRisk, a lifecycle oriented benchmark that organizes agent harness safety into six operational phases including Harness Configuration, Capability Extension, Runtime Operation, State Persistence, Action Control, and Incident Recovery. HarnessRisk contains 128 sandboxed cases, each pairing a benign user objective with an adversarial instruction embedded in an untrusted workflow artifact. We evaluate each trajectory using Utility, Attack Success Rate, Persistence, and Detection. Across three harnesses, six language models, and 14 model and harness configurations, attack success ranges from 12.6% to 80.9%, while Utility remains between 75.0% and 97.6%. Harness Configuration is the most vulnerable phase across all three harnesses, showing that attacks can succeed by altering security sensitive parameters within otherwise authorized workflows. We also find that explicit risk recognition does not reliably lead to safe action, as some configurations detect risks in more than 90% of runs while retaining substantial attack success. These results highlight the need to evaluate agent safety across multiple harness responsibilities and at the level of the deployed model and harness configuration.', 'score': 7, 'issue_id': 3042, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '7f8d1a741c96b093', 'authors': ['Yajing Bai', 'Jinhao Duan', 'Jie Peng', 'Xianfeng Wu', 'Sijia Liu', 'Song Wang', 'Tianlong Chen'], 'affiliations': ['Michigan State', 'University of Central Florida', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2608.17597.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔓', 'ru': {'title': 'Шесть фаз уязвимости: где агенты теряют контроль', 'desc': 'В работе представлен HarnessRisk — комплексный бенчмарк для оценки безопасности агентских фреймворков на протяжении полного жизненного цикла их работы, охватывающий шесть операционных фаз от конфигурации до восстановления после инцидентов. Исследователи создали 128 тестовых случаев, в которых комбинируют легитимные цели пользователя с враждебными инструкциями, скрытыми в ненадёжных артефактах рабочего процесса. Результаты показывают, что даже при сохранении полезности системы (75-97.6%) успешность атак достигает 80.9%, причём наиболее уязвимой оказывается фаза конфигурации фреймворка. Исследование демонстрирует критический разрыв между способностью системы распознавать риски и способностью безопасно на них реагировать, подчёркивая необходимость комплексной оценки безопасности на уровне развёрнутой модели и всей конфигурации.'}, 'en': {'title': 'HarnessRisk: Evaluating Safety Across Agent Harness Phases', 'desc': 'The paper introduces HarnessRisk, a benchmark designed to assess the safety of agent harnesses used in machine learning applications. It identifies six operational phases where vulnerabilities can occur, including Harness Configuration and Runtime Operation. The study reveals that despite high utility, attack success rates can be alarmingly high, indicating significant security gaps. The findings emphasize the importance of evaluating safety across various harness responsibilities and configurations to better understand and mitigate risks.'}, 'zh': {'title': '评估智能体安全性的全新视角', 'desc': 'HarnessRisk 是一个评估智能体安全性的基准，涵盖六个操作阶段，包括配置、能力扩展、运行操作、状态持久性、行动控制和事件恢复。研究发现，尽管保持了效用，配置漏洞和检测缺口使得攻击成功率很高，范围从 12.6% 到 80.9%。特别是，配置阶段是最脆弱的，攻击者可以通过修改安全敏感参数来成功攻击。该研究强调了在不同的智能体职责和部署模型配置下评估安全性的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.17286', 'title': 'Abra: Scaling Diffusion Image Training', 'url': 'https://huggingface.co/papers/2608.17286', 'abstract': 'Abstract Scaling laws for text-to-image diffusion models reveal predictable compute-optimal training requiring far more data per parameter than language models, with robust overtraining behavior and universal curve shapes.  Generated by thinkingmachines/Inkling-Small Compute-optimal scaling laws guide the training of frontier language models yet remain largely unexplored for visual generation. We present a systematic scaling law study for text-to-image diffusion models using Abra, a controlled family of flow-matching transformers trained across three orders of magnitude worth of compute (10^{19} to 10^{22} FLOPs), reaching significantly larger compute budgets than previous works. We demonstrate that diffusion models scale just as predictably as language models but require far more data to train optimally: compute optimality occurs at approximately 200 image tokens per parameter, ten times the Chinchilla compute-optimal prescription for LLMs. We show that unlike language models, diffusion models are robust to overtraining and that practitioners should err on the side of more data rather than a larger model. Finally, we show that this predictability extends beyond training loss to generative quality metrics, optimal CFG settings, representation quality, and even the shape of the training curves, which collapse onto a universal form.', 'score': 7, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '96c45ba5a52bddd2', 'authors': ['Kyle Chickering', 'Wei-An Lin', 'Swayam Bhanded', 'Dan Saunders', 'Akshat Tripathi', 'Jiaming Song', 'Shyamal Buch', 'Xinchen Yan'], 'affiliations': ['Luma AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17286.jpg', 'data': {'categories': ['#training', '#architecture', '#multimodal', '#diffusion', '#benchmark', '#optimization'], 'emoji': '🖼️', 'ru': {'title': 'Универсальные законы масштабирования для визуальной генерации', 'desc': 'В этой работе исследуются законы масштабирования для text-to-image диффузионных моделей, построенных на основе flow-matching трансформеров. Авторы обнаружили, что эти модели масштабируются предсказуемо, подобно языковым моделям, но требуют значительно больше данных на один параметр — примерно 200 токенов изображения на параметр, что в десять раз превышает оптимальное значение для LLM. Исследование показало, что диффузионные модели устойчивы к переобучению, поэтому лучше увеличивать объём данных, чем архитектуру модели. Предсказуемость этих законов распространяется не только на функцию потерь, но и на метрики качества генерации, параметры CFG и даже форму кривых обучения, которые следуют универсальному паттерну.'}, 'en': {'title': 'Unlocking Predictable Scaling for Text-to-Image Diffusion Models', 'desc': 'This paper investigates the scaling laws for text-to-image diffusion models, highlighting their need for significantly more data per parameter compared to language models. It presents a study using a family of flow-matching transformers trained with a wide range of computational resources, demonstrating that diffusion models exhibit predictable scaling behavior similar to language models. The findings indicate that optimal training for these models occurs at around 200 image tokens per parameter, which is substantially higher than the requirements for language models. Additionally, the research reveals that diffusion models are resilient to overtraining, suggesting that using more data is preferable to simply increasing model size.'}, 'zh': {'title': '扩散模型的计算最优性与数据需求', 'desc': '本文研究了文本到图像扩散模型的规模法则，揭示了计算最优训练需要比语言模型更多的数据。我们使用Abra进行系统的规模法则研究，展示了扩散模型的可预测性与语言模型相似，但训练时需要的数据量是后者的十倍。研究表明，扩散模型对过拟合具有较强的鲁棒性，因此在训练时应优先考虑更多的数据而非更大的模型。最后，我们发现这种可预测性不仅适用于训练损失，还延伸到生成质量指标、最优CFG设置和训练曲线的形状。'}}}, {'id': 'https://huggingface.co/papers/2608.16002', 'title': 'From Sequence to Structure: Relational Uncertainty Propagation for LLM Agents', 'url': 'https://huggingface.co/papers/2608.16002', 'abstract': 'Abstract RUPA models agent execution as a dependency graph to propagate uncertainty across long trajectories, improving failure detection and confidence estimation for LLM agents.  Generated by thinkingmachines/Inkling-Small Reliable uncertainty quantification (UQ) is essential for deploying large language model (LLM) agents in complex interactive environments. Existing UQ methods largely rely on local signals, such as token probabilities, predictive entropy, or per-step confidence, and therefore overlook the long-range dependencies through which errors accumulate across an execution trajectory. As a result, they may fail to identify agent failures whose causes originate several reasoning or interaction steps before the final answer. We propose RUPA (Relational Uncertainty Propagation for Agents), a trajectory-level UQ framework for LLM agents. RUPA represents an execution history as a directed trajectory graph in which reasoning states, tool interactions, and environment feedback are nodes connected by temporal and semantic dependency edges. It then propagates uncertainty over this graph to capture how execution risk accumulates and transfers across interaction steps. The propagated signal is combined with trajectory-level behavioral features and goal-alignment information to produce a confidence estimate for the full agent trajectory. We evaluate RUPA on representative agent benchmarks, including τ-2, Terminal-Bench-2, and GAIA, using 6 open-source LLMs spanning multiple model families. Experimental results show that RUPA consistently outperforms existing UQ methods by providing more accurate uncertainty estimates, enabling earlier failure detection, and improving uncertainty-guided agent execution across diverse agent tasks. These results demonstrate that explicitly modeling relational dependency is crucial to reliable UQ for long-horizon LLM agents, providing a practical foundation for trustworthy agent execution.', 'score': 6, 'issue_id': 3040, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '608b46206fbcb19d', 'authors': ['Zhengzhao Ma. Boxi Cao', 'Yaojie Lu', 'Hongyu Lin', 'Xianpei Han', 'Le Sun'], 'affiliations': ['Chinese Information Processing Laboratory, Institute of Software, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.16002.jpg', 'data': {'categories': ['#graphs', '#reasoning', '#long_context', '#benchmark', '#agents'], 'emoji': '🕸️', 'ru': {'title': 'Распространение неопределённости через граф зависимостей для надёжных LLM агентов', 'desc': 'Работа представляет RUPA — метод количественной оценки неопределённости для LLM агентов, который моделирует историю выполнения как граф зависимостей. Вместо анализа локальных сигналов (например, вероятностей токенов), RUPA распространяет неопределённость через весь граф, отслеживая, как ошибки накапливаются на протяжении длинных траекторий взаимодействия. Метод комбинирует информацию о распространённой неопределённости с поведенческими признаками и выравниванием целей для получения оценки уверенности для всей траектории агента. Экспериментальные результаты на различных бенчмарках показывают, что RUPA превосходит существующие методы по точности предсказания ошибок и обнаружению сбоев.'}, 'en': {'title': 'RUPA: Enhancing Uncertainty in LLM Agent Execution', 'desc': 'The paper introduces RUPA, a new framework for improving uncertainty quantification (UQ) in large language model (LLM) agents by modeling their execution as a dependency graph. This approach allows for the propagation of uncertainty across long trajectories, addressing the limitations of existing UQ methods that focus on local signals. By representing the execution history as a directed graph with nodes for reasoning states and interactions, RUPA captures how errors accumulate over time. The results show that RUPA enhances failure detection and confidence estimation, making LLM agents more reliable in complex environments.'}, 'zh': {'title': 'RUPA：提升LLM代理执行的可靠性与信心', 'desc': 'RUPA模型将代理执行视为一个依赖图，以传播不确定性，从而提高大型语言模型（LLM）代理的故障检测和信心估计。现有的不确定性量化方法主要依赖于局部信号，忽视了错误在执行轨迹中累积的长程依赖关系。RUPA通过将执行历史表示为一个有向轨迹图，捕捉推理状态、工具交互和环境反馈之间的关系，并在此图上传播不确定性。实验结果表明，RUPA在多个基准测试中优于现有方法，提供了更准确的不确定性估计，能够更早地检测故障，并改善代理执行的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2608.14221', 'title': 'MathForm: Scaling Mathematical Autoformalization with Knowledge Retrieval and Verification-Guided Refinement', 'url': 'https://huggingface.co/papers/2608.14221', 'abstract': "Abstract MathForm improves autoformalization by retrieving Mathlib knowledge and iteratively refining outputs with verification feedback, yielding a large verified dataset and a high-performing 8B model.  Generated by thinkingmachines/Inkling-Small Autoformalization is commonly framed as translating natural-language mathematical statements into machine-verifiable formal languages such as Lean 4. However, faithful formalization requires more than translation. Models must map mathematical concepts to the complex hierarchy of types and definitions in formal libraries such as Mathlib, while ensuring that generated statements preserve the meaning of the source propositions. Existing approaches struggle because they rely heavily on the model's parametric memory for library-specific knowledge, while common data construction pipelines often resort to filtering single-pass outputs and lack mechanisms for feedback-driven revision. To address these challenges, we introduce MathForm, an autoformalization framework for constructing verified training data through Mathlib knowledge retrieval and verification-guided iterative refinement. Before generation, a retrieval planner gathers relevant definitions and existing formalizations from Mathlib to guide the formalization generator. Generated statements are then revised using compiler diagnostics and semantic-consistency feedback. Using this framework, we construct FormalVerse, a Lean 4 dataset containing approximately 367K verified examples across diverse mathematical domains and sources. We then train MathForm-8B through supervised fine-tuning followed by reinforcement learning. Across six benchmarks, MathForm-8B achieves average Pass@8 rates of 88.06% under Syntax Check (SC) and 72.37% under Consistency Check (CC), outperforming multiple specialized 32B autoformalizers. On the challenging FATE-H and FATE-X subsets, it attains CC pass rates of 63% and 37%, exceeding the strongest specialized baselines in both cases.", 'score': 6, 'issue_id': 3043, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '9eba6b46c4a3da59', 'authors': ['Lushi Pu', 'Weiming Zhang', 'Xinheng Xie', 'Zixuan Fu', 'Bingxiang He', 'Hengyu Zhao', 'Hongya Lyu', 'Xin Li', 'Jie Zhou', 'Yudong Wang'], 'affiliations': ['ModelBest Inc.', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14221.jpg', 'data': {'categories': ['#synthetic', '#science', '#dataset', '#small_models', '#rlhf', '#plp', '#training', '#optimization', '#rag', '#benchmark'], 'emoji': '📐', 'ru': {'title': 'Автоматическая формализация через поиск знаний и верификацию', 'desc': 'MathForm — это фреймворк для автоматизации формализации математических утверждений на языке Lean 4. Система использует поиск релевантных определений из библиотеки Mathlib и итеративное уточнение с помощью обратной связи от верификатора кода для создания надежных обучающих данных. На основе этого подхода авторы построили датасет FormalVerse с 367K проверенными примерами и обучили компактную 8-битную модель MathForm-8B через supervised fine-tuning и reinforcement learning. Модель демонстрирует превосходные результаты: достигает 88% точности при синтаксической проверке и 72% при семантической консистентности, превосходя специализированные модели в 32 раза большего размера на сложных бенчмарках.'}, 'en': {'title': 'Revolutionizing Autoformalization with MathForm', 'desc': 'MathForm is a framework designed to enhance the process of autoformalization, which involves converting natural language mathematical statements into formal languages like Lean 4. It improves this process by retrieving relevant knowledge from the Mathlib library and refining the generated outputs through feedback from verification checks. This iterative approach not only helps in creating a large dataset of verified examples but also trains a high-performing model, MathForm-8B, that excels in maintaining semantic consistency and syntax correctness. The results show that MathForm-8B significantly outperforms existing models, demonstrating its effectiveness in the autoformalization task.'}, 'zh': {'title': 'MathForm：智能自动形式化的未来', 'desc': 'MathForm 是一个自动形式化框架，通过检索 Mathlib 知识并利用验证反馈进行迭代优化，从而构建经过验证的训练数据。该框架在生成数学语句时，不仅仅是简单的翻译，而是需要将数学概念映射到复杂的类型和定义层次中。通过使用检索规划器收集相关定义和现有形式化内容，MathForm 能够提高生成语句的准确性和一致性。最终，MathForm-8B 模型在多个基准测试中表现优异，超越了许多专门的自动形式化工具。'}}}, {'id': 'https://huggingface.co/papers/2608.16393', 'title': 'Security Assessment of DeepSeek Harness with A.I.G: Evaluating Resistance to Indirect Prompt Injection', 'url': 'https://huggingface.co/papers/2608.16393', 'abstract': "Abstract Researchers evaluate indirect prompt injection risks in DeepSeek Harness using controlled taint and dual judges, finding notable success rates across text and file channels and recommending controls between untrusted content and sensitive actions.  Generated by thinkingmachines/Inkling-Small We assess indirect prompt injection in DeepSeek Harness (DSH), using AI-Infra-Guard (A.I.G) to construct tests, deliver controlled taint, execute DSH, collect traces, and judge outcomes. The study covers 14,560 controlled executions over 16 indirect-content channels, text and file carrier modes, 35 payload objectives, one unmodified baseline, and 12 attack methods. The experiment preserves DSH's agent loop, tool registry, model adapter, and session-event path; source tools and sensitive sinks are local fixtures, so attempted actions are recorded without external side effects. We evaluate each trace with a deterministic rule-based judge,  (RuleJudge), and a semantic LLM-based judge,  (LLMJudge). The strongest observed attack success rates are 17.0% under  for fake-completion attack in text mode, 25.5% under  for hidden Unicode in file mode, and 16.0% under  for the skills channel in file mode.  also assigns partial compliance more often than  (7.3% versus 2.0%). We relate these results to DSH's treatment of tool results, additional contexts, and tool-call policy hooks, then identify controls that should sit between untrusted content and sensitive actions. Our code is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/Research/deepseek-harness-security-assessment .", 'score': 4, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'aced1c4232fe636c', 'authors': ['Zonghao Ying', 'Xiangfan Wu', 'Huiyu Wu', 'Xing Zheng', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.16393.jpg', 'data': {'categories': [], 'emoji': '🛡️', 'ru': {'title': 'Защита AI-агентов от косвенных инъекций через контролируемое тестирование', 'desc': 'Исследователи оценили риски косвенных prompt injection атак в системе DeepSeek Harness, используя контролируемое заражение данных и двойную систему оценки результатов. Эксперимент включал 14,560 контролируемых выполнений с различными каналами передачи информации, методами атак и целями. Были использованы два судьи для оценки: детерминированный RuleJudge на основе правил и LLMJudge на базе языковой модели. Исследование выявило уязвимости и рекомендует внедрить контроли безопасности между недоверенным контентом и чувствительными операциями.'}, 'en': {'title': 'Mitigating Indirect Prompt Injection Risks in AI Systems', 'desc': 'This paper investigates the risks of indirect prompt injection in the DeepSeek Harness (DSH) system, utilizing a method called controlled taint analysis. The researchers conducted extensive tests, executing over 14,000 trials across various content channels and attack methods to assess the effectiveness of different injection techniques. They employed two types of judges, a rule-based and a semantic LLM-based judge, to evaluate the outcomes of these attacks. The findings highlight significant success rates for certain attack types, leading to recommendations for implementing controls to protect sensitive actions from untrusted content.'}, 'zh': {'title': '评估DeepSeek Harness中的间接提示注入风险', 'desc': '本研究评估了DeepSeek Harness中的间接提示注入风险，使用了受控污点和双重评判的方法。研究涵盖了14,560次受控执行，涉及16个间接内容通道和35个有效载荷目标。实验结果显示，在文本模式下，假完成攻击的成功率为17.0%，而在文件模式下，隐藏Unicode的成功率为25.5%。研究建议在不可信内容和敏感操作之间设置控制措施，以降低潜在风险。'}}}, {'id': 'https://huggingface.co/papers/2608.17050', 'title': 'Cross-Model Memory Transfer via Target-Side Reader Adaptation', 'url': 'https://huggingface.co/papers/2608.17050', 'abstract': 'Abstract Cross-model reuse of frozen external memory tables depends primarily on aligning a lightweight target-side reader rather than the memory content alone, enabling reusable knowledge artifacts with optional adaptation.  Generated by thinkingmachines/Inkling-Small Methods for improving knowledge use in large language models typically fall into two regimes. Non-parametric retrieval offers flexible access to external knowledge, but adds retrieval latency, context overhead, and only shallow integration with the backbone. Parametric adaptation is efficient at inference time, but entangles knowledge with model weights and can be hard to update, audit, or transfer. Engram-style hashed memory occupies a middle regime: it stores learned information in an external, addressable table, yet consumes that table through a small learned reader. This raises a basic question: when such a memory is moved across backbones, what matters more, the frozen memory itself or the target-side reader? We study this question through cross-model frozen-memory extraction, in which a memory trained on a source model is frozen and attached to a different target model, with only a lightweight reader trained. Ablations show that learned memory content and correct addressing both matter, but the transferred table becomes useful only through a reader aligned to the target model. In downstream question answering tasks, a dual-layer, four-branch reader nearly closes the gap between same-model and cross-model reuse, achieving an average score of 38.8 under our controlled evaluation protocol. Moreover, when the provider reader is directly compatible with the target interface, the frozen artifact can provide substantial utility without target-side training, while optional reader adaptation yields further improvement. These results suggest that Engram can serve as a reusable external knowledge artifact, provided that the target has access to a compatible reader interface; target-side adaptation can further improve alignment when direct reader reuse is insufficient.', 'score': 4, 'issue_id': 3046, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '4e117f41a4a3c569', 'authors': ['Mingyuan Li', 'Guangsheng Yu', 'Xu Wang', 'Shaoxiong Ji'], 'affiliations': ['ELLIS Institute Finland', 'University of Technology Sydney', 'University of Turku'], 'pdf_title_img': 'assets/pdf/title_img/2608.17050.jpg', 'data': {'categories': ['#transfer_learning'], 'emoji': '🧠', 'ru': {'title': 'Reader важнее памяти: переиспользование знаний между моделями через адаптивный доступ', 'desc': 'В статье исследуется переиспользование замороженных внешних таблиц памяти между разными моделями. Авторы показывают, что при передаче памяти между моделями критичнее адаптировать целевой reader (легковесный механизм доступа), чем само содержимое памяти. Система Engram занимает промежуточное положение между параметрическими и непараметрическими подходами к интеграции знаний в LLM. Результаты демонстрируют, что замороженная таблица памяти может служить переиспользуемым артефактом знаний, если целевая модель имеет совместимый интерфейс reader, с возможностью дополнительной адаптации для улучшения выравнивания.'}, 'en': {'title': 'Unlocking Knowledge: The Power of Compatible Readers in Memory Reuse', 'desc': "This paper explores how to effectively reuse external memory tables in machine learning models, focusing on the importance of a compatible reader for accessing this memory. It compares two common methods of knowledge integration: non-parametric retrieval, which is flexible but slow, and parametric adaptation, which is fast but rigid. The authors introduce a middle-ground approach using Engram-style hashed memory, which allows for efficient knowledge transfer between models with a lightweight reader. Their findings indicate that both the memory content and the reader's alignment to the target model are crucial for successful knowledge reuse, with a well-designed reader significantly enhancing performance in tasks like question answering."}, 'zh': {'title': '跨模型重用：对齐读取器的重要性', 'desc': '这篇论文探讨了如何在不同模型之间重用冻结的外部记忆表。研究表明，轻量级的目标侧读取器比仅仅依赖记忆内容更为重要。通过交叉模型的冻结记忆提取，发现学习的记忆内容和正确的寻址都很重要，但只有与目标模型对齐的读取器才能使转移的表发挥作用。在问答任务中，使用双层四分支读取器可以显著缩小同模型和跨模型重用之间的差距。'}}}, {'id': 'https://huggingface.co/papers/2608.14881', 'title': 'Personalized Auto-Research: Towards a True AI Co-Scientist', 'url': 'https://huggingface.co/papers/2608.14881', 'abstract': 'Abstract The paper introduces personalized auto-research, a framework that conditions AI-driven hypothesis generation, experimentation, and writing on individual researcher representations to avoid generic outputs.  Generated by thinkingmachines/Inkling-Small AI co-scientists that generate hypotheses, retrieve related work, design experiments, execute code, and draft full papers are beginning to change how research is carried out. Despite this rapid progress, state-of-the-art systems remain researcher-agnostic: given a research goal, they optimize novelty, validity, or reviewer score while ignoring the individual scientist who will use the output. This overlooks a fundamental fact about research, namely, that what counts as novel, valuable, or feasible depends on the researcher, including their prior work, methodological repertoire, and the collaborators and communities in which they are embedded. In this work, we introduce the problem of personalized auto-research, which conditions every stage of the research process on a representation of the individual researcher. We argue that personalization is not a convenience layer, but rather the fundamental property that allows an AI system to serve as a genuine co-scientist rather than a generic instrument. To address this problem, we propose a general and flexible framework that threads a graph-grounded researcher context through retrieval, hypothesis search, experimentation, writing, and review. The framework consists of three fundamental components: (i) graph-grounded researcher representations, (ii) personalization across the full research pipeline, and (iii) evaluation grounded in the individual. Notably, we highlight a one-size-fits-all failure mode where distinct researchers issuing the same goal receive essentially the same research, erasing the tacit knowledge through which novel ideas arise. Finally, we discuss fundamental open problems and challenges.', 'score': 4, 'issue_id': 3042, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'f8431d7c21bcefac', 'authors': ['Bo Ni', 'Franck Dernoncourt', 'Hongjie Chen', 'Yu Wang', 'Nesreen K. Ahmed', 'Zhengzhong Tu', 'Tyler Derr', 'Ryan A. Rossi'], 'affiliations': ['Adobe Research', 'Cisco AI Research', 'Dolby Laboratories', 'Texas A&M University', 'University of Georgia', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14881.jpg', 'data': {'categories': [], 'emoji': '🔬', 'ru': {'title': 'AI-сокурсник, который знает вас лично', 'desc': 'В статье предлагается концепция персонализированного автоматического исследования, которая адаптирует работу AI-систем к характеристикам конкретного учёного. Авторы показывают, что современные системы-сокурсовники игнорируют индивидуальность исследователя, включая его прошлые работы, методологический инструментарий и научное окружение, что приводит к неоптимальным результатам. Предложенный фреймворк интегрирует представление исследователя на основе графов во все этапы научного процесса: поиск литературы, генерацию гипотез, проектирование экспериментов и написание статей. Авторы утверждают, что персонализация является не просто удобством, а фундаментальным свойством, которое превращает AI в истинного соавтора вместо универсального инструмента.'}, 'en': {'title': 'Personalized Auto-Research: Tailoring AI to Individual Scientists', 'desc': 'This paper presents a new approach called personalized auto-research, which tailors AI-driven research processes to individual researchers. It emphasizes that current AI systems often ignore the unique backgrounds and needs of researchers, leading to generic outputs. The proposed framework integrates personalized representations of researchers throughout the research pipeline, from hypothesis generation to writing. By doing so, it aims to enhance the relevance and novelty of research outputs, making AI a true co-scientist rather than just a tool.'}, 'zh': {'title': '个性化自动研究：让AI成为真正的共同科学家', 'desc': '本文介绍了个性化自动研究的框架，该框架根据个别研究者的特征来生成假设、进行实验和撰写论文，以避免产生通用的输出。通过思维机器/Inkling-Small AI共同科学家生成假设、检索相关工作、设计实验、执行代码和撰写完整论文，正在改变研究的方式。现有的系统往往忽视了研究者的个体差异，导致生成的研究成果无法满足特定研究者的需求。我们提出的个性化自动研究框架强调个性化是AI系统作为真正的共同科学家所必需的基本特性，而不是简单的便利层。'}}}, {'id': 'https://huggingface.co/papers/2608.17988', 'title': 'GS-Voxel: Fitting-Free Structured Latents for Large-Scale 3DGS Generation', 'url': 'https://huggingface.co/papers/2608.17988', 'abstract': 'Abstract GS-Voxel converts unstructured 3D Gaussian reconstructions into sparse structured latents to enable scalable aerial scene generation via flow models.  Generated by thinkingmachines/Inkling-Small Many scalable latent 3D generators operate on structured tensors, whereas pre-optimized 3D Gaussian Splatting (3DGS) reconstructions are unordered, spatially irregular, and vary widely in primitive count. We present GS-Voxel, a fitting-free structured latent framework, and evaluate it for large-scale aerial 3D Gaussian scene generation. GS-Voxel deterministically converts a compatible pre-optimized 3DGS reconstruction into sparse active voxels without additional per-scene optimization, retaining the sub-voxel positions and rendering attributes of the selected primitives. A GS-specific factorized VAE then separately encodes voxel geometry and local Gaussian attributes into sparse 3D latents whose size grows with the number of occupied voxels rather than being limited by a fixed scene-wide primitive count. We train image-conditioned flow models in the GS-Voxel latent space to generate aerial 3DGS scenes. A key application enabled by GS-Voxel is large-area scene generation: overlap-aware tiled inference extends synthesis beyond a single training crop conditioned on satellite-view images. Our results show that GS-Voxel provides structured latents for pre-optimized aerial 3DGS reconstructions, with latent capacity that grows with the number of occupied voxels.', 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '5867586237373792', 'authors': ['Ming Qian', 'Zijian Wang', 'Minchao Sun', 'Jincheng Xiong', 'Hang Zhang', 'Mu Xu', 'Chi Wang', 'Baoquan Chen'], 'affiliations': ['Amap, Alibaba', 'Peking University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17988.jpg', 'data': {'categories': ['#training', '#architecture', '#diffusion', '#3d', '#optimization'], 'emoji': '🛰️', 'ru': {'title': 'Структурированные вокселы для масштабируемой генерации гауссовых сцен', 'desc': 'GS-Voxel преобразует неструктурированные 3D Gaussian реконструкции в разреженные структурированные латентные представления для масштабируемой генерации аэрофотосцен с помощью диффузионных моделей потока. Метод детерминистически конвертирует предварительно оптимизированные 3DGS реконструкции в активные вокселы без дополнительной оптимизации, сохраняя позиции и атрибуты примитивов. Специализированный факторизованный VAE отдельно кодирует геометрию вокселей и локальные атрибуты гауссианов в разреженные 3D латенты, размер которых растет с количеством занятых вокселей. Модели потока, обучаемые в латентном пространстве GS-Voxel, генерируют большие аэрофотосцены на основе спутниковых изображений, достигая синтеза сцен, превышающих размер одного обучающего образца.'}, 'en': {'title': 'Transforming 3D Gaussian Data for Scalable Aerial Scene Generation', 'desc': 'GS-Voxel is a framework that transforms unstructured 3D Gaussian reconstructions into organized sparse latents, facilitating the generation of large-scale aerial scenes using flow models. Unlike traditional methods that rely on structured tensors, GS-Voxel handles unordered and irregular 3D Gaussian Splatting (3DGS) data without needing scene-specific optimization. It encodes voxel geometry and local Gaussian attributes into sparse 3D latents, allowing the size of the latents to increase with the number of active voxels. This approach enables efficient generation of expansive aerial scenes by leveraging image-conditioned flow models and overlap-aware tiled inference.'}, 'zh': {'title': 'GS-Voxel：可扩展的空中场景生成新方法', 'desc': 'GS-Voxel 是一种将无结构的 3D 高斯重建转换为稀疏结构潜在空间的框架，旨在通过流模型实现可扩展的空中场景生成。与传统的结构化张量生成器不同，GS-Voxel 可以在不需要额外优化的情况下，将预优化的 3D 高斯重建转换为稀疏活跃体素。该方法保留了所选原始体素的亚体素位置和渲染属性，并通过特定的 VAE 编码体素几何和局部高斯属性。GS-Voxel 使得大面积场景生成成为可能，能够基于卫星视图图像进行超出单一训练裁剪的合成。'}}}, {'id': 'https://huggingface.co/papers/2608.17393', 'title': 'LEGO-RL: Harness-Native Reinforcement Learning for Coding Agents', 'url': 'https://huggingface.co/papers/2608.17393', 'abstract': 'Abstract LEGO-RL connects native coding-agent harnesses to scalable policy-gradient training via in-process LLM proxying, sandbox orchestration, and integrated monitoring, improving sparse MoE model performance across multiple harnesses.  Generated by thinkingmachines/Inkling-Small Reinforcement learning for coding agents increasingly relies on long-running agent harnesses to manage tool integration, repository contexts, and execution feedback. However, the native execution environments of these harnesses are inherently misaligned with policy-gradient training: environmental crashes and reward hacking corrupt outcome signals, while train-inference discrepancies decouple rollout behavior from policy updates. To address this, we present LEGO-RL, a framework that bridges native coding-agent harnesses with scalable policy-gradient optimization without modifying their internal control flow. LEGO-RL is built upon three pillars: (1) faithful optimization via in-process LLM proxying that captures raw generation streams for token-level alignment and robust trainer-side log-probability recomputation, even under harness-side compaction or re-serialization; (2) reliable execution via scalable sandbox orchestration featuring image caching and stage-wise defenses to mitigate reward hacking; and (3) observable training through an integrated plugin that automates validation and monitoring, paired with a Live UI for granular trajectory diagnostics. We evaluate LEGO-RL by training the sparse MoE model Qwen3.5-35B-A3B with GSPO across three native coding-agent harnesses. LEGO-RL improves Qwen3.5-35B-A3B across OpenHands SDK (64.0% to 70.4%), Claude Code (62.4% to 68.2%), and OpenCode (57.2% to 66.6%) on SWE-bench Verified, while maintaining a rollout-training probability correlation above 0.99.', 'score': 2, 'issue_id': 3055, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '519359e81819e5b4', 'authors': ['Yiming Du', 'Yuxin Jiang', 'Tao Yuan', 'Jianbo Dai', 'Shaowei Wang', 'Jierun Chen', 'Chaofan Tao', 'Xianzhi Yu', 'Lifeng Shang', 'Kam-Fai Wong', 'Xiaohui Li', 'Haoli Bai'], 'affiliations': ['Huawei Technologies Co., Ltd', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.17393.jpg', 'data': {'categories': ['#agents', '#optimization', '#rl', '#plp', '#training', '#reasoning'], 'emoji': '🧩', 'ru': {'title': 'Соединяя нативные агенты с градиентным обучением без изменения их внутренней логики', 'desc': 'LEGO-RL — это фреймворк, который соединяет нативные окружения кодирующих агентов с масштабируемым обучением на основе градиентной политики через прокси LLM в процессе выполнения. Фреймворк решает критические проблемы рассогласованности между генерацией и обучением, используя три компонента: верную оптимизацию через захват потоков генерации токенов, надежное выполнение через оркестрацию изолированных окружений с защитой от манипуляций наградой, и наблюдаемость через встроенный мониторинг. Авторы демонстрируют улучшение производительности разреженной MoE-модели Qwen3.5-35B-A3B на нескольких архитектурах агентов в бенчмарке SWE-bench Verified с сохранением высокой корреляции между rollout и обучением.'}, 'en': {'title': 'LEGO-RL: Bridging Coding Agents and Scalable Training for Enhanced Performance', 'desc': 'LEGO-RL is a framework designed to enhance the performance of coding agents by connecting them to scalable policy-gradient training methods. It addresses issues like environmental crashes and reward hacking that can disrupt the training process. The framework utilizes in-process LLM proxying for accurate optimization, sandbox orchestration for reliable execution, and integrated monitoring for observable training. Evaluations show that LEGO-RL significantly improves the performance of the sparse MoE model across various coding-agent harnesses while ensuring consistent training behavior.'}, 'zh': {'title': 'LEGO-RL：连接编码代理与策略优化的桥梁', 'desc': 'LEGO-RL是一个框架，旨在将本地编码代理的执行环境与可扩展的策略梯度优化连接起来，而无需修改其内部控制流程。该框架通过三个支柱实现：首先，通过进程内的LLM代理进行忠实优化，以捕捉原始生成流并进行令牌级对齐；其次，通过可扩展的沙箱编排实现可靠执行，以减少奖励黑客行为的影响；最后，通过集成插件实现可观察的训练，自动化验证和监控。我们在三个本地编码代理的执行环境中评估了LEGO-RL，结果显示其在多个任务上显著提高了模型性能。'}}}, {'id': 'https://huggingface.co/papers/2608.17975', 'title': 'aDSL: Agentic 3D Creation via Joint Agent-Program Design', 'url': 'https://huggingface.co/papers/2608.17975', 'abstract': 'Abstract A co-designed domain-specific language and multi-agent system improve LLM-driven 3D program synthesis by using relational operators and iterative execution feedback.  Generated by thinkingmachines/Inkling-Small Programmatic representations provide a compelling paradigm for 3D content creation, enabling fine-grained edits, interpretability, and explicit structural control. Yet, agentic workflows that rely on large language models (LLMs) to author 3D programs remain brittle, often failing to translate high-level intent into consistent low-level geometry. We attribute this fragility to a mismatch between existing programmatic interfaces and the reasoning strengths of LLMs, which favor semantic structure and spatial relations over fragile numeric choices. In this paper, we jointly design an Agent-centric Domain-Specific Language (aDSL) and a role-specialized multi-agent system to close this gap. aDSL bridges semantic logic and geometric constraints by emphasizing composability and spatial reasoning; it enables agents to manipulate geometry through relational operators instead of brittle absolute coordinates. Building on aDSL, our training-free multi-agent system follows a Plan-Execute-Critic loop to decompose requests, synthesize code, and iteratively repair errors and constraint violations using execution feedback. Experiments show that this co-design improves robustness, controllability, and faithfulness to user intent. Our method outperforms prior LLM-based baselines on text-to-shape and image-to-shape tasks while preserving explicit structure, editability, and interpretability. It also enables downstream applications such as articulated object creation and structured scene composition. Our code is available at https://github.com/sig-pku/aDSL.', 'score': 2, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '6eaef21ac69c0b0f', 'authors': ['Rui-Huan Wang', 'Si-Tong Wei', 'Jia-Qi He', 'Heng-Yi Wei', 'Baoquan Chen', 'Peng-Shuai Wang'], 'affiliations': ['Peking University, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17975.jpg', 'data': {'categories': ['#3d', '#agents', '#architecture'], 'emoji': '🏗️', 'ru': {'title': 'Многоагентный синтез 3D-программ через реляционный язык и итеративное исправление', 'desc': 'В статье предложен подход к синтезу трёхмерных программ, где большие языковые модели работают с специально разработанным предметно-ориентированным языком (aDSL), который использует реляционные операторы вместо абсолютных координат. Авторы создали многоагентную систему с архитектурой Plan-Execute-Critic, которая разбивает задачу на этапы: планирование, генерация кода и итеративное исправление ошибок на основе обратной связи от выполнения программы. Совместное проектирование языка и системы агентов позволяет LLM лучше оперировать пространственными отношениями и семантической структурой, что значительно повышает устойчивость и точность синтеза трёхмерного контента. Экспериментально показано, что метод превосходит предыдущие подходы на задачах преобразования текста в форму и изображения в форму, сохраняя при этом интерпретируемость и возможность редактирования.'}, 'en': {'title': 'Bridging Intent and Geometry in 3D Program Synthesis', 'desc': 'This paper presents a new approach to creating 3D programs using a specially designed language and a multi-agent system that works with large language models (LLMs). The proposed Agent-centric Domain-Specific Language (aDSL) enhances the way agents handle geometry by focusing on relational operators, which improves the accuracy of translating user intentions into 3D shapes. The multi-agent system employs a Plan-Execute-Critic loop to refine the generated code, allowing for iterative corrections based on execution feedback. Overall, this method increases the reliability and control of 3D content creation while maintaining clarity and ease of editing.'}, 'zh': {'title': '提升3D程序合成的智能体系统与领域特定语言', 'desc': '本文提出了一种联合设计的面向特定领域的语言（aDSL）和多智能体系统，以改善基于大型语言模型（LLM）的3D程序合成。通过使用关系运算符和迭代执行反馈，aDSL能够更好地桥接语义逻辑与几何约束，使得智能体能够通过关系运算符操作几何体，而不是依赖脆弱的绝对坐标。我们的多智能体系统采用计划-执行-评估循环，能够分解请求、合成代码，并通过执行反馈迭代修复错误和约束违规。实验结果表明，这种联合设计提高了系统的鲁棒性、可控性和对用户意图的忠实度。'}}}, {'id': 'https://huggingface.co/papers/2608.16977', 'title': 'The Problem Is the Problem: Towards Scalable Mathematical Discovery', 'url': 'https://huggingface.co/papers/2608.16977', 'abstract': 'Abstract A literature-to-review pipeline automates problem discovery and triage to focus expert review on promising mathematical conjectures within a chosen research direction.  Generated by thinkingmachines/Inkling-Small AI systems are increasingly capable of contributing to mathematical research. In research practice, frontier-model reasoning is a limited resource, and expert mathematical review is even more sharply constrained. Allocating these scarce resources well is therefore central to making AI-assisted mathematical discovery efficient. In most current AI-for-math workflows, human effort is concentrated at the beginning and end, in selecting suitable research problems and later reviewing the resulting artifacts. These two stages are becoming bottlenecks for research-level mathematics. We address them by proposing a new human-AI discovery paradigm. The human input is no longer a single problem selected in advance, but a research direction in which the experts have interest and expertise. The system then searches a broad literature corpus for candidate problems in that direction. Inspired by search and recommender systems, we build Find, Attempt, and Recommend (FAR), a literature-to-review cascade that automates the search for suitable problems and focuses human attention on artifacts that have passed several stages of filtering. In a combinatorics pilot, the pipeline starts from 5,245 combinatorics papers, recovers 6,453 candidate conjectures or open problems, and filters them to 4,717 apparently well-posed and still-open conjectures. Subsequent reasoning and automated triage stages surface 598 potential resolutions and select 77 items for author-team review. Among them, we identify many interesting discoveries, including results on conjectures and questions of Davies--Jenssen--Perkins--Roberts, Erdős--Straus, Ikenmeyer--Pak--Panova, and Lund--Saraf--Wolf. These results demonstrate the effectiveness of this new mode of human-AI collaboration for mathematical discovery.', 'score': 2, 'issue_id': 3059, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '2f4676c18c4bff5a', 'authors': ['Zeyu Zheng', 'Shengtong Zhang', 'Jeremy Avigad', 'Prasad Tetali', 'Sean Welleck'], 'affiliations': ['Anysphere Co.', 'Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16977.jpg', 'data': {'categories': ['#science', '#reasoning'], 'emoji': '🔍', 'ru': {'title': 'Автоматизированный поиск и отбор математических проблем для экспертного анализа', 'desc': 'В статье предложена система FAR (Find, Attempt, and Recommend), которая автоматизирует поиск и тriage математических проблем из литературы на основе заданного направления исследований. Система использует методы поиска и рекомендации, чтобы отфильтровать кандидатов из большого корпуса научных работ и сосредоточить внимание экспертов на наиболее перспективных гипотезах и открытых проблемах. В пилотном проекте по комбинаторике конвейер обработал более 5000 статей и выбрал 77 конъектур для экспертного анализа, обнаружив интересные результаты по известным математическим проблемам. Данный подход демонстрирует эффективную парадигму сотрудничества человека и AI для автоматизации обнаружения математических открытий.'}, 'en': {'title': 'Automating Mathematical Discovery with AI: A New Paradigm', 'desc': "This paper presents a new approach to enhance mathematical research by automating the discovery and review of mathematical conjectures using AI. The proposed system, called Find, Attempt, and Recommend (FAR), allows experts to specify a research direction instead of a single problem, enabling the AI to search a vast literature for relevant conjectures. By filtering through thousands of papers, the system identifies well-posed open problems and suggests them for expert review, thereby alleviating bottlenecks in traditional research workflows. The results from a combinatorics pilot demonstrate the system's ability to surface significant mathematical discoveries efficiently."}, 'zh': {'title': '人机协作，提升数学发现效率', 'desc': '这篇论文提出了一种文献审查管道，旨在自动化问题发现和筛选，以便将专家的注意力集中在有前景的数学猜想上。通过人机协作，系统能够在专家感兴趣的研究方向中搜索相关文献，生成候选问题。该方法通过过滤和推荐机制，减少了人类在研究初期和末期的工作负担，提高了数学研究的效率。实验结果显示，这种新的人机合作模式在数学发现中取得了显著成效。'}}}, {'id': 'https://huggingface.co/papers/2608.16097', 'title': 'Unifying Graph Neural Networks Through a Common Layer Equation', 'url': 'https://huggingface.co/papers/2608.16097', 'abstract': "Abstract A unified layer equation decomposes graph neural networks into seven components to compare architectures, derive theoretical bounds, and expose design choices linked to oversmoothing and expressivity.  Generated by thinkingmachines/Inkling-Small Graph neural networks are commonly described through family-specific equations whose notation obscures shared computations and structural differences. We introduce a common layer equation that represents covered architectures through seven components: an update domain, channel set, propagation bank, per-channel message maps, channel-fusion operator, ego/residual map, and update map. The central factorization separates where information moves, encoded by the propagation bank, from what moves, encoded by the message maps. Function-valued fillings extend the same equation across local message passing, attention, spectral filtering, global communication, relation-specific channels, higher-order domains, and geometric messages.   We make this unification explicit and checkable through worked reductions of canonical layers and component assignments spanning seven nonexclusive architectural families. A fixed slot discipline assigns operations by computational role and defines the framework's coverage boundary. The decomposition also yields component-level theoretical insights: under endpoint-local messages and node-local updates, operator support bounds one-layer dependencies, and one-layer global mixing requires a full effective operator row under the stated hypotheses.   The resulting framework organizes more than 200 architectures in a common design space, enables component-wise comparison and generation of structurally consistent architectures, and connects propagation choices to oversmoothing, oversquashing, heterophily, and expressivity. It further exposes the empirical inverse problem of mapping measurable graph and task properties to validated component choices.", 'score': 2, 'issue_id': 3042, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '620dbfeb9b9a8d67', 'authors': ['Sai Karthik Navuluru', 'Siddhartha Shankar Das', 'Bo Ni', 'Hongjie Chen', 'Yu Wang', 'Baris Coskunuzer', 'Nesreen K. Ahmed', 'Franck Dernoncourt', 'Mahantesh Halappanavar', 'Tyler Derr', 'Ryan A. Rossi', 'Lakshman Tamil'], 'affiliations': ['Adobe Research', 'Cisco AI Research', 'Dolby Laboratories', 'Pacific Northwest National Laboratory', 'University of Georgia', 'University of Texas at Dallas', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16097.jpg', 'data': {'categories': ['#math', '#architecture', '#graphs'], 'emoji': '🧩', 'ru': {'title': 'Единая декомпозиция графических нейронных сетей в семь компонентов', 'desc': 'Работа предлагает единую математическую формулировку для графических нейронных сетей, разлагая их на семь компонентов: домен обновления, набор каналов, банк распространения, отображения сообщений, оператор слияния каналов, эго/остаточное отображение и отображение обновления. Такая унифицированная запись позволяет сравнивать различные архитектуры GNN, включая локальную передачу сообщений, внимание, спектральную фильтрацию и глобальную коммуникацию, в едином дизайн-пространстве. Авторы получили теоретические границы для глубины зависимостей и условия глобального перемешивания информации, а также установили связь между выбором компонентов и проблемами переглаживания и выразительности сети. Предложенный фреймворк организует более 200 архитектур GNN и дает инструмент для систематического анализа их свойств.'}, 'en': {'title': 'Unifying Graph Neural Networks for Better Design and Comparison', 'desc': 'This paper presents a unified layer equation that breaks down graph neural networks (GNNs) into seven key components, allowing for easier comparison of different architectures. By separating the movement of information from the content being moved, the authors provide a clearer understanding of how various GNN designs operate. The framework not only organizes over 200 existing architectures but also offers theoretical insights into issues like oversmoothing and expressivity. Ultimately, it aims to connect specific design choices with measurable properties in graph tasks, facilitating better architecture development.'}, 'zh': {'title': '统一图神经网络架构的七个组成部分', 'desc': '这篇论文提出了一种统一的层方程，将图神经网络分解为七个组成部分，以便比较不同的架构，推导理论界限，并揭示与过平滑和表达能力相关的设计选择。通过这种统一，研究者能够清晰地展示信息的流动和内容的移动，进而分析不同架构的特性。论文还提供了一个框架，组织了超过200种架构，使得组件之间的比较和结构一致的架构生成成为可能。最后，研究揭示了如何将可测量的图和任务属性映射到经过验证的组件选择上。'}}}, {'id': 'https://huggingface.co/papers/2608.17379', 'title': 'PTXBench: Benchmark and Adapt LLMs for GPU Kernel Optimization with Architecture-specific PTX', 'url': 'https://huggingface.co/papers/2608.17379', 'abstract': "Abstract PTXBench evaluates large language models on architecture-specific GPU kernel optimization, revealing uneven success and performance gaps that supervised fine-tuning only partially addresses.  Generated by thinkingmachines/Inkling-Small We introduce PTXBench, a benchmark for evaluating and adapting large language models (LLMs) to use architecture-specific PTX for GPU kernel optimization. PTXBench measures functional correctness, whether selected target instructions execute at runtime, and speedup over frontier libraries across GEMM and attention workloads on H100 and B200 GPUs. Our evaluation shows that architecture-specific PTX capability remains uneven: success rates fall substantially on complex attention backward workloads, and executing the target instructions does not necessarily translate into competitive performance. No evaluated model consistently matches frontier libraries across the suite. We further adapt Qwen3.6-27B using supervised fine-tuning. Repair-conditioned training improves several tasks, but generalization remains uneven; data coverage, balance, and the quality of the reasoning teacher matter in addition to dataset size. PTXBench provides an auditable testbed for measuring and improving LLMs' ability to exploit evolving GPU architectures.", 'score': 1, 'issue_id': 3054, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '06e60618a9248b39', 'authors': ['Genghan Zhang', 'Yixin Dong', 'Chengze Fan', 'Zhichen Zeng', 'Yueming Yuan', 'Shaowei Zhu', 'Kunle Olukotun'], 'affiliations': ['Carnegie Mellon University', 'Independent Researcher', 'RadixArk', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17379.jpg', 'data': {'categories': ['#open_source', '#plp', '#science', '#optimization', '#dataset', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'От понимания кода к оптимальной производительности GPU', 'desc': 'В работе представлен PTXBench — бенчмарк для оценки способности больших языковых моделей оптимизировать GPU-ядра с использованием архитектурно-специфичного PTX-кода. Исследование показывает, что современные LLM демонстрируют неравномерные результаты: успешность резко падает на сложных операциях backward attention, а корректное выполнение инструкций не гарантирует конкурентную производительность. Авторы применили supervised fine-tuning к модели Qwen3.6-27B, где repair-conditioned обучение улучшило результаты на отдельных задачах, однако обобщение остаётся неровным и зависит от баланса данных и качества учителя. PTXBench служит аудитируемым тестбедом для измерения и совершенствования способности LLM эффективно использовать эволюционирующие GPU-архитектуры.'}, 'en': {'title': 'Optimizing LLMs for GPU Performance with PTXBench', 'desc': "PTXBench is a benchmark designed to assess how well large language models (LLMs) can optimize GPU kernel performance using architecture-specific PTX instructions. The study reveals that while supervised fine-tuning can enhance some capabilities, it does not consistently lead to improved performance across all tasks, particularly in complex workloads. The evaluation highlights significant performance gaps, especially in attention backward tasks, where models struggle to execute target instructions effectively. PTXBench serves as a valuable tool for measuring and enhancing LLMs' adaptability to new GPU architectures, emphasizing the importance of data quality and coverage in training."}, 'zh': {'title': 'PTXBench：优化大型语言模型的GPU性能', 'desc': 'PTXBench是一个用于评估和调整大型语言模型（LLMs）以适应特定架构的PTX进行GPU内核优化的基准测试工具。它测量功能正确性和在H100和B200 GPU上GEMM和注意力工作负载的加速性能。评估结果显示，架构特定的PTX能力存在不均衡，尤其在复杂的注意力反向工作负载上成功率显著下降。尽管通过监督微调对Qwen3.6-27B进行了适应，但模型的泛化能力仍然不均衡，数据覆盖、平衡和推理教师的质量都对结果有影响。'}}}, {'id': 'https://huggingface.co/papers/2608.16793', 'title': 'PixRestore: Unified Image Restoration via Pixel Diffusion Transformer', 'url': 'https://huggingface.co/papers/2608.16793', 'abstract': 'Abstract PixRestore is a compact, VAE-free pixel-space diffusion transformer trained from scratch for unified image restoration, using flow matching on patchified pixels, DINO-based reliability-guided feature fusion, and adversarial fine-tuning to a one-step generator for efficient high-fidelity inference.  Generated by thinkingmachines/Inkling-Small Unified image restoration (UIR) aims to recover high-quality (HQ) content from low-quality (LQ) images with different degradations using a single model. Most recent methods adapt large pretrained text-to-image (T2I) latent diffusion models for their strong capacity and generative priors. However, the variational autoencoder (VAE) in latent T2I models may discard restoration-sensitive details, while the open-ended synthesis prior can introduce content-inconsistent artifacts. We present PixRestore, a VAE-free pixel-space Diffusion Transformer (DiT) for UIR, where the diffusion backbone is trained entirely from scratch, without relying on T2I pretraining. PixRestore performs flow matching directly on patchified pixels, preserving fine-grained details while keeping the token sequence tractable. To adapt to different degradations, PixRestore learns to predict the reliability of layer features using LQ--HQ DINO feature similarity. Features from more reliable layers are fused as dense conditioning, while less reliable layers receive stronger HQ-feature supervision to encourage degradation removal. We train PixRestore on a large-scale corpus of diverse scenes and degradations, and further finetune it into a one-step generator using DINO-based adversarial objectives for efficient inference. Experiments on public benchmarks and real-world test sets show that, with only about 50M parameters and single-step inference, PixRestore achieves the best overall fidelity, perceptual quality, and robustness to degradations among competing UIR models while being far more efficient. Larger PixRestore variants can further boost performance, demonstrating the scalability of our pixel-space design. Code and the curated benchmark can be found at https://github.com/csslc/PixRestore.', 'score': 1, 'issue_id': 3046, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '813dcd01200cfb2f', 'authors': ['Lingchen Sun', 'Rongyuan Wu', 'Xiangtao Kong', 'Jixin Zhao', 'Qiaosi Yi', 'Yujing Sun', 'Shuaizheng Liu', 'Zhengqiang Zhang', 'Lei Zhang'], 'affiliations': ['OPPO Research Institute', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16793.jpg', 'data': {'categories': ['#inference', '#small_models', '#benchmark', '#diffusion', '#cv', '#open_source', '#training', '#architecture'], 'emoji': '🖼️', 'ru': {'title': 'Восстановление деталей без компромиссов: диффузионный трансформер в пиксельном пространстве', 'desc': 'PixRestore — это компактная модель диффузионного трансформера в пиксельном пространстве для унифицированного восстановления изображений без использования VAE. Модель использует flow matching на патчифицированных пикселях и обучается полностью с нуля, избегая проблем с потерей деталей, присущих латентным моделям. Для адаптации к различным типам деградации используется DINO-based подход для оценки надежности признаков и их адаптивного слияния в зависимости от типа повреждения. Модель дополнительно оптимизируется в одношаговый генератор с использованием adversarial fine-tuning, достигая лучшего качества восстановления при эффективности вычислений.'}, 'en': {'title': 'PixRestore: Efficient Image Restoration Without VAEs', 'desc': 'PixRestore is a novel image restoration model that operates directly in pixel space without using a variational autoencoder (VAE). It employs a diffusion transformer architecture trained from scratch, focusing on flow matching of patchified pixels to maintain high-quality details. The model integrates DINO-based feature fusion to enhance reliability in feature extraction, allowing it to adapt to various image degradations effectively. With only 50 million parameters, PixRestore achieves superior image fidelity and perceptual quality in a single inference step, outperforming existing methods in efficiency and robustness.'}, 'zh': {'title': 'PixRestore：高效的无VAE图像修复变换器', 'desc': 'PixRestore是一种紧凑型的无变分自编码器（VAE）像素空间扩散变换器，旨在统一图像修复。它通过对分块像素进行流匹配、基于DINO的可靠性引导特征融合，以及对单步生成器的对抗微调，来实现高效的高保真推理。与传统的文本到图像（T2I）模型不同，PixRestore完全从零开始训练，避免了VAE可能丢失的细节。实验表明，PixRestore在图像修复任务中表现出色，具有更高的保真度和感知质量，同时在处理不同退化时也展现出更强的鲁棒性。'}}}, {'id': 'https://huggingface.co/papers/2608.12944', 'title': 'CardioState-JEPA: Delay-Aware Cross-Modal Learning of a Shared Cardiac Representation', 'url': 'https://huggingface.co/papers/2608.12944', 'abstract': 'Abstract CardioState-JEPA learns a unified cardiac representation across ECG, PPG, and PCG by predicting masked latent physiological states with cross-modal delay alignment, improving downstream classification across all three modalities.  Generated by thinkingmachines/Inkling-Small Electrocardiography (ECG), photoplethysmography (PPG), and phonocardiography (PCG) provide complementary views of the same cardiac cycle, yet existing cardiac foundation models are trained for a single sensing modality, leaving the shared physiology across sensors unexploited. We introduce CardioState-JEPA, a cardiac foundation model to learn a single shared representation jointly across ECG, PPG, and PCG, built on a physiology-aware joint-embedding predictive architecture. The model maps heterogeneous waveforms into a common token space, processes them with a single shared Transformer encoder, and learns by predicting masked latent cardiac states, placing the pretraining target on shared physiology rather than sensor-specific waveform appearance. To handle the temporal offsets between electrical, mechanical, and hemodynamic events, cross-modal prediction uses a learned delay aligner that matches signals at the corresponding cardiac time. Because synchronized multi-sensor recordings are scarce, CardioState-JEPA first learns within-modality structure from abundant unimodal data and then uses paired data to align modalities in latent cardiac time. Evaluated as a frozen encoder across 25 downstream tasks spanning ECG, PPG, and PCG, our encoder improves average PPG classification by 8.2 AUROC points, PCG murmur detection by 18.8 AUROC points, and ECG classification by 15.5 AUROC points over the best self-supervised signal baseline and matches or exceeds cardiac models trained with privileged clinical text or supervised labels on several ECG benchmarks. These results establish that heterogeneous cardiac signals can mutually supervise a single foundation model of cardiac physiology.', 'score': 1, 'issue_id': 3051, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '6c90d0990cdb7803', 'authors': ['Hamza Shafiq', 'Hung Manh Pham', 'Bin Zhu', 'Pan Zhou', 'Jun Hu', 'Aaqib Saeed'], 'affiliations': ['Eindhoven University of Technology, Netherlands', 'Singapore Management University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2608.12944.jpg', 'data': {'categories': ['#transfer_learning', '#training', '#architecture', '#multimodal', '#healthcare'], 'emoji': '❤️', 'ru': {'title': 'Единое сердечное представление из многомодальных сигналов', 'desc': 'CardioState-JEPA — это модель-фундамент для кардиологии, которая обучается на едином представлении сердечной активности сразу по трём типам сигналов: ЭКГ, ФПГ и ФКГ. Модель использует архитектуру совместного встраивания с предсказанием замаскированных состояний, где общее физиологическое содержание важнее внешнего вида конкретного сигнала. Для учёта временных сдвигов между электрическими, механическими и гемодинамическими событиями применяется обучаемый выравниватель задержек, который синхронизирует сигналы в кардиологическом времени. На 25 задачах классификации модель показала значительное улучшение: на 8,2 пункта для ФПГ, на 18,8 для обнаружения шумов, и на 15,5 для ЭКГ по сравнению с базовыми подходами самоконтролируемого обучения.'}, 'en': {'title': 'Unified Cardiac Insights from Multi-Modal Signals', 'desc': 'CardioState-JEPA is a machine learning model designed to create a unified representation of cardiac data from three different sources: ECG, PPG, and PCG. It does this by predicting masked latent states of the heart while aligning the timing of signals from these different modalities. The model uses a shared Transformer encoder to process the data, allowing it to learn from abundant unimodal data before aligning the modalities. This approach significantly improves classification performance across all three types of cardiac signals, demonstrating that they can effectively support each other in learning a comprehensive understanding of cardiac physiology.'}, 'zh': {'title': '跨模态心脏信号的统一学习', 'desc': 'CardioState-JEPA 是一种心脏基础模型，旨在通过跨模态延迟对齐来学习 ECG、PPG 和 PCG 的统一心脏表示。该模型通过预测被遮蔽的潜在生理状态，利用不同传感器的互补视角，提升了三种模态的下游分类性能。它将异构波形映射到一个共同的标记空间，并使用共享的 Transformer 编码器进行处理，从而专注于共享生理特征而非传感器特定的波形外观。通过在丰富的单模态数据上学习结构，CardioState-JEPA 能够在缺乏同步多传感器记录的情况下，利用配对数据对模态进行对齐。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (13)', '#agi (1)', '#alignment', '#architecture (10)', '#audio', '#benchmark (13)', '#cv (2)', '#data (1)', '#dataset (7)', '#diffusion (5)', '#ethics (1)', '#games', '#graphs (2)', '#hallucinations', '#healthcare (1)', '#inference (4)', '#interpretability (1)', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (7)', '#open_source (5)', '#optimization (8)', '#plp (4)', '#rag (1)', '#reasoning (5)', '#rl (4)', '#rlhf (1)', '#robotics (1)', '#science (4)', '#security (1)', '#small_models (2)', '#story_generation', '#survey', '#synthetic (2)', '#training (12)', '#transfer_learning (2)', '#video (4)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-19 22:16',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-19 22:16')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-19 22:16')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
