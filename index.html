    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.25804', 'title': 'The Tasteful Agent: Measuring and Improving Taste in Long-Horizon Tasks', 'url': 'https://huggingface.co/papers/2609.25804', 'abstract': 'Abstract  LLM agents increasingly work on long-horizon tasks, and the decisions they make along the way, such as which hypothesis to test or which implementation to build on, determine the outcome of the whole run. Making these decisions well is becoming a key capability for both engineering and research agents. We refer to the ability to make good long-horizon decisions as the taste of an agent. While existing benchmarks measure the end-to-end success of agents on long-horizon tasks, none of them measures the taste of an agent. To address this problem, we build Taste-Bench, a benchmark of taste questions constructed automatically from trajectories that agents produced in engineering and research tasks. Each question presents a decision fork, a point in a trajectory where multiple directions are available and one of them leads to a better outcome, and the evaluated model chooses among these directions without seeing what happens after the fork. We mine these forks automatically from parallel attempts at the same task and from detours inside a single trajectory, without needing human annotation. We evaluate frontier models on Taste-Bench and find that the best model answers only 59.7% of the questions correctly. We further find that forks whose deciding evidence appears later in the trajectory are much harder for every model, and that a larger reasoning budget does not improve the accuracy. Finally, we show that taste can be trained. We distill the judgment of a teacher that has seen the outcome into a student model, and the student makes better decisions on unseen tasks and improves end-to-end success on held-out SWE-bench Pro tasks.', 'score': 111, 'issue_id': 3320, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '35192abc0e1c2f67', 'authors': ['Wenbo Pan', 'Zhichao Liu', 'Shujie Liu', 'Jingying Zeng', 'Chin-Yew Lin', 'Xianfeng Tang', 'Yan Lu', 'Qi He', 'Xiaohua Jia'], 'affiliations': ['City University of Hong Kong', 'Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2609.25804.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🤔', 'ru': {'title': 'Оценка и обучение способности агентов принимать стратегические решения на сложных многошаговых задачах', 'desc': 'В статье представлен Taste-Bench — новый бенчмарк для оценки способности LLM агентов принимать хорошие решения на долгосрочных задачах. Авторы вводят концепцию «вкуса агента» как способности делать правильный выбор в точках разветвления траектории, где доступны несколько направлений развития. Бенчмарк автоматически генерируется из траекторий, полученных при решении инженерных и исследовательских задач, без необходимости в ручной аннотации. Исследование показывает, что даже лучшие модели справляются только с 59.7% вопросов, а умение принимать хорошие решения можно улучшить через дистилляцию знаний от учителя, видевшего исход траектории.'}, 'en': {'title': 'Enhancing Decision-Making in LLM Agents with Taste-Bench', 'desc': "This paper introduces a new benchmark called Taste-Bench, designed to evaluate the decision-making ability of large language model (LLM) agents on long-horizon tasks. The benchmark focuses on 'taste', which refers to an agent's capability to make effective choices at critical decision points, known as decision forks, during a task. Unlike existing benchmarks that only assess overall success, Taste-Bench specifically measures how well agents can choose the best path without knowing the final outcome. The study also demonstrates that taste can be improved through training, where a student model learns from a teacher model's judgments to enhance decision-making in future tasks."}, 'zh': {'title': '提升代理决策能力的关键：品味', 'desc': '本论文探讨了大型语言模型（LLM）在长时间任务中的决策能力，称之为代理的“品味”。现有的基准测试虽然评估了代理在长时间任务中的最终成功，但并未衡量其决策的质量。为了解决这个问题，作者构建了Taste-Bench基准，通过自动生成的决策分叉问题来评估代理的品味。研究发现，尽管最好的模型仅能正确回答59.7%的问题，但通过教师模型的指导，学生模型在未见过的任务上做出了更好的决策。'}}}, {'id': 'https://huggingface.co/papers/2609.25270', 'title': 'RULER: Instance-aware Rubric Rewards for SVG Generation', 'url': 'https://huggingface.co/papers/2609.25270', 'abstract': 'Abstract  Generating Scalable Vector Graphics (SVG) code from natural-language instructions is an open-ended task without absolute visual ground truth, leaving both evaluation and policy optimization without a faithful signal. Scalar metrics (CLIP, Aesthetic) calibrated on natural images transfer poorly to stylized vector content, and reusing them as RL rewards triggers reward hacking. We address both limitations with rubric-based scoring. We first establish empirically that prompting a vision-language judge with a multi-axis rubric correlates with human judgments far better than scalar metrics, both across samples and within instructions. Building on this finding, we introduce RULER (Instance-aware Rubric Rewards for Reinforcement Learning), which converts each instruction into an instance-aware rubric of six items spanning semantic, visual, and stylistic axes; a judge VLM scores rendered rollouts item-by-item, and the weighted satisfactions form a fine-grained reward optimized via Group Relative Policy Optimization. Because the rubric is derived from text alone, RULER requires neither paired SVG ground truth nor human preference labels. On MMSVG-Illustration and MMSVG-Icon, RULER lifts the rubric score from 0.432/0.395 to 0.693/0.683, surpassing dedicated SVG specialists and matching the substantially larger DeepSeek-V3, with ablations identifying rubric design as the active lever for RL on open-ended SVG generation. The project page is available at https://hangyuran.github.io/RULER/.', 'score': 59, 'issue_id': 3319, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '7e64a867b588053c', 'authors': ['Hangyu Ran', 'Yuhao Zheng', 'Yingying Zhang', 'Kevin Qinghong Lin', 'Han Peng'], 'affiliations': ['Ant Group', 'Independent Researcher', 'The Hong Kong University of Science and Technology (Guangzhou)', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2609.25270.jpg', 'data': {'categories': ['#benchmark', '#rlhf', '#dataset', '#multimodal', '#rl'], 'emoji': '✏️', 'ru': {'title': 'Мультиосевые рубрики вместо скалярных метрик для обучения генерации векторной графики', 'desc': 'В работе решается задача генерации кода Scalable Vector Graphics (SVG) из естественного языка с использованием новой системы оценки на основе рубрик. Авторы показывают, что стандартные скалярные метрики (CLIP, Aesthetic) плохо переносятся на векторную графику и вызывают reward hacking при использовании в обучении с подкреплением. Предложен метод RULER, который преобразует текстовые инструкции в детальные рубрики со множеством критериев (семантические, визуальные, стилистические), а языковая модель зрения оценивает каждый критерий отдельно. Полученные вознаграждения оптимизируются через Group Relative Policy Optimization без необходимости в парных примерах SVG или человеческих предпочтениях.'}, 'en': {'title': 'RULER: Elevating SVG Generation with Rubric-Based Rewards', 'desc': 'This paper presents a method for generating SVG code from natural language instructions using a new approach called RULER. RULER employs a multi-axis rubric to evaluate generated SVGs, which correlates better with human judgments than traditional scalar metrics. By using instance-aware rubric rewards, the method allows for fine-grained scoring without needing paired ground truth or human preferences. The results show significant improvements in SVG generation quality, outperforming existing models and demonstrating the effectiveness of rubric-based evaluation in reinforcement learning.'}, 'zh': {'title': '基于评分标准的SVG生成优化', 'desc': '本论文探讨了从自然语言指令生成可扩展矢量图形（SVG）代码的任务。由于缺乏绝对的视觉基准，评估和策略优化面临挑战。我们提出了一种基于评分标准的方法，使用多维评分系统来更好地与人类判断相关联。通过引入RULER（实例感知评分奖励），我们能够在没有配对SVG真值或人类偏好标签的情况下，优化生成的SVG质量。'}}}, {'id': 'https://huggingface.co/papers/2609.24981', 'title': 'GAE: Learning a Geometry-Native Latent Space for 3D-Consistent World Generation', 'url': 'https://huggingface.co/papers/2609.24981', 'abstract': "Abstract  We present a compact geometry-native latent space as a shared foundation for perception and generation. Visual generators can produce photorealistic frames without preserving a consistent 3D scene. We argue that this is not only a modeling problem but also a representation problem: generators typically evolve appearance-centric latents, while perception models recover geometry in a semantically rich space that encodes cross-view structure. Rather than adding geometry as another output, we reparameterize a geometry foundation model's features into a compact latent space for generation. We realize this shift with the geometry-native autoencoder (GAE), whose latent is jointly decodable to appearance, depth, cameras, and point maps. With this state, a standard conditional flow supports diverse generation tasks. In controlled comparisons that hold the generator and training protocol fixed, replacing the latent with GAE improves both visual quality and independently measured 3D coherence: FVD falls by 12.7% and 23.1% on RealEstate10K and DL3DV, and camera-trajectory error is halved on RealEstate10K. Together, these results show that the latent space is central to geometry-consistent generation and can serve as a shared interface between perception and generation.", 'score': 38, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': 'b86ce239844cb18f', 'authors': ['Jiahao Lu', 'Minghao Yin', 'Wenbo Hu', 'Hengyu Liu', 'Wang Zhao', 'Sai-Kit Yeung', 'Ying Shan', 'Yuan Liu'], 'affiliations': ['ARC Lab, Tencent IEG', 'The Hong Kong University of Science and Technology', 'The University of Hong Kong', 'The University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2609.24981.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#3d'], 'emoji': '🎨', 'ru': {'title': 'Геометрия в центре генерации: единое латентное пространство для восприятия и создания', 'desc': 'В работе представляется компактное латентное пространство, ориентированное на геометрию, которое служит единой основой для восприятия и генерации изображений. Авторы показывают, что существующие генеративные модели часто не сохраняют геометрическую согласованность сцены, потому что используют латентные представления, ориентированные на внешний вид, а не на геометрию. Предложенный геометрический автокодировщик (GAE) переформулирует признаки модели геометрического фундамента в компактное латентное пространство, которое может декодироваться в различные представления: текстуру, глубину, параметры камеры и карты точек. Экспериментальные результаты демонстрируют, что использование GAE-латентного пространства улучшает как визуальное качество, так и трёхмерную согласованность генерируемых изображений на эталонных наборах данных.'}, 'en': {'title': 'Bridging Perception and Generation with Geometry-Native Latent Spaces', 'desc': 'This paper introduces a new type of latent space that is designed to better handle both visual perception and generation tasks in machine learning. The authors highlight that traditional generators focus on creating images based on appearance, often neglecting the underlying 3D structure. By using a geometry-native autoencoder (GAE), they create a compact latent space that encodes important geometric information alongside visual features. Their experiments show that this approach significantly improves the quality and coherence of generated images, demonstrating the importance of a well-structured latent space for effective machine learning applications.'}, 'zh': {'title': '几何一致生成的潜在空间革命', 'desc': '本文提出了一种紧凑的几何本地潜在空间，作为感知和生成的共享基础。视觉生成器能够生成逼真的图像，而无需保持一致的三维场景。我们认为这不仅是建模问题，也是表示问题：生成器通常演变出以外观为中心的潜在变量，而感知模型则在一个语义丰富的空间中恢复几何结构。通过几何本地自编码器（GAE），我们将几何基础模型的特征重新参数化为紧凑的潜在空间，从而实现了生成任务的多样性。'}}}, {'id': 'https://huggingface.co/papers/2609.24058', 'title': 'All-in-One Multilingual Scene Text Recognition with Script-aware Mixture-of-Experts', 'url': 'https://huggingface.co/papers/2609.24058', 'abstract': 'Abstract  Multilingual scene text recognition (STR) remains challenging due to the scarcity of training data for most languages and the difficulty of serving diverse scripts within a single model. Existing solutions either deploy one recognizer per language, inflating cost and introducing error accumulation, or rely on massive vision-language models (VLMs) that are expensive and still inaccurate on many scripts. In this work, we pursue an all-in-one multilingual recognizer that is simpler than per-language experts, lighter than VLMs, and more accurate than both. First, we construct TextMuSS-10M, a large-scale synthetic scene text dataset spanning 10 scripts and 229 languages. It provides balanced and sufficient supervision where real data is unavailable. Second, we propose ScriptMoE, a script-aware Mixture-of-Experts (MoE) architecture. It shares a single visual encoder and replaces the dense decoder with a sparse MoE block, which consists of an image-level router dispatches each image to the top-2 script-aligned experts and a shared expert absorbs cross-script knowledge. Extensive experiments on our assembled TextMuSS-Bench (10 scripts, 10,899 images) show that ScriptMoE achieves the highest accuracy of 82.06%, outperforming the strongest STR baseline by 1.31%. On the CC-OCR end-to-end multilingual task, replacing only the recognizer in PP-OCRv5 with ScriptMoE lifts F1 score from 65.71% to 80.89%, slightly surpassing the best VLM (80.73%) at a fraction of the parameter count.', 'score': 35, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '0bd4b3abdf1223c5', 'authors': ['Xingsong Ye', 'Yongkun Du', 'Jiaxin Zhang', 'Zhixian Li', 'Chong Sun', 'Chen Li', 'Jing Lyu', 'Lianwen Jin', 'Zhineng Chen'], 'affiliations': ['Institute of Trustworthy Embodied AI, Fudan University', 'Shanghai Key Laboratory of Multimodal Embodied AI', 'South China University of Technology', 'WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.24058.jpg', 'data': {'categories': ['#architecture', '#cv', '#multilingual', '#dataset', '#benchmark'], 'emoji': '🌍', 'ru': {'title': 'Единый многоязычный распознаватель текста через смешивание экспертов по письменностям', 'desc': 'Статья решает проблему распознавания текста в многоязычных изображениях, предлагая единую модель вместо отдельных распознавателей для каждого языка. Авторы создали большой синтетический датасет TextMuSS-10M, охватывающий 10 письменностей и 229 языков, что обеспечивает достаточное количество обучающих данных. Они разработали архитектуру ScriptMoE на основе Mixture-of-Experts, которая использует общий визуальный энкодер и разреженный декодер с маршрутизацией по типам письменности. Модель достигает высокой точности (82.06%) и превосходит существующие методы, включая дорогостоящие vision-language модели, при этом имея значительно меньше параметров.'}, 'en': {'title': 'One Model to Recognize Them All: Efficient Multilingual Text Recognition', 'desc': 'This paper addresses the challenges of multilingual scene text recognition (STR) by introducing a unified model that is more efficient and accurate than existing methods. The authors create a large synthetic dataset, TextMuSS-10M, which includes diverse scripts and languages to improve training data availability. They propose a novel architecture called ScriptMoE, which utilizes a mixture-of-experts approach to effectively manage different scripts while sharing a common visual encoder. Experimental results demonstrate that ScriptMoE significantly outperforms previous STR models, achieving higher accuracy and better performance on multilingual tasks.'}, 'zh': {'title': '一体化多语言识别器的创新之路', 'desc': '多语言场景文本识别（STR）面临着训练数据稀缺和多样化脚本处理困难的挑战。现有的解决方案要么为每种语言部署一个识别器，导致成本增加和错误累积，要么依赖于庞大的视觉-语言模型（VLM），这些模型昂贵且在许多脚本上仍不准确。本文提出了一种一体化的多语言识别器，构建了一个包含10种脚本和229种语言的大规模合成场景文本数据集TextMuSS-10M，并提出了ScriptMoE架构，通过共享视觉编码器和稀疏的专家模块来提高识别准确性。实验结果表明，ScriptMoE在多个任务中表现优异，准确率达到82.06%，超越了现有的最强基线。'}}}, {'id': 'https://huggingface.co/papers/2609.15987', 'title': 'Bellman Policy Optimization', 'url': 'https://huggingface.co/papers/2609.15987', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) improves the reasoning capabilities of large language models (LLMs). We introduce Bellman Policy Optimization (BPO), a critic-free method derived from Policy Mirror Descent (PMD). For autoregressive generation with terminal rewards, BPO uses the Bellman equations to reformulate PMD as a trajectory-level objective. The reformulation avoids estimating state values at intermediate states. We prove that it has the same unique optimal solution as the original PMD objective. We derive the practical BPO loss by approximating this objective. Its mismatch-correction weight is a smoothed ratio of complementary token probabilities. Experiments on mathematical reasoning benchmarks demonstrate the effectiveness of BPO.', 'score': 24, 'issue_id': 3320, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '8e707aafa2e8512a', 'authors': ['Zhuoqing Song', 'Haotian Xu', 'Xikun Zhang', 'Lidong Bing'], 'affiliations': ['Apodex US, Inc.', 'Princeton University'], 'pdf_title_img': 'assets/pdf/title_img/2609.15987.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Беллманова оптимизация политик для улучшения рассуждений нейросетевых моделей', 'desc': 'В статье предлагается метод Bellman Policy Optimization (BPO) для улучшения способности больших языковых моделей рассуждать с помощью обучения с подкреплением и проверяемыми наградами. BPO является методом без критика, основанным на Policy Mirror Descent, который использует уравнения Беллмана для переформулировки задачи оптимизации на уровне траекторий. Ключевое преимущество подхода заключается в том, что он избегает необходимости оценивать функции стоимости на промежуточных состояниях при автарегрессивной генерации. Экспериментальная оценка на задачах математического рассуждения показывает эффективность предложенного метода.'}, 'en': {'title': 'Enhancing Language Models with Bellman Policy Optimization', 'desc': 'This paper presents a new approach called Bellman Policy Optimization (BPO) for improving reinforcement learning in large language models (LLMs). BPO is a critic-free method that reformulates the Policy Mirror Descent (PMD) framework using Bellman equations, focusing on trajectory-level objectives instead of intermediate state values. The authors prove that BPO retains the same optimal solution as PMD, ensuring its effectiveness. Experiments show that BPO enhances mathematical reasoning capabilities in LLMs, demonstrating its practical utility in reinforcement learning tasks.'}, 'zh': {'title': '贝尔曼策略优化：提升语言模型推理能力的关键', 'desc': '强化学习与可验证奖励（RLVR）提升了大型语言模型（LLMs）的推理能力。我们提出了一种名为贝尔曼策略优化（BPO）的方法，这是一种不需要评估者的策略镜像下降（PMD）衍生方法。BPO通过贝尔曼方程将PMD重新表述为轨迹级目标，从而避免在中间状态估计状态值。实验结果表明，BPO在数学推理基准测试中表现出色，证明了其有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.24657', 'title': 'Circuit Hypernetworks for Quantum-Augmented Diffusion Language Models', 'url': 'https://huggingface.co/papers/2609.24657', 'abstract': "Abstract  Language models can be adapted by changing the computations applied to individual tokens. Quantum circuits offer one such approach, but evaluating wider circuits inside a large model can be computationally demanding. Here we introduce HyperQ, which adds token-conditioned quantum residual branches to a frozen masked-diffusion language model. A quantum residual branch is a module in each transformer block that reads a token's hidden state, emits the coordinates of that token's circuit, executes it, and adds the measured values back through a residual connection. The backbone remains frozen, and only the added branches are trained. Within each branch, a lightweight circuit hypernetwork emits token-specific rotation angles, coupling strengths, and measurement axes in a shared sparse circuit structure. The required expectation values have an exact classical expression whose evaluation cost grows linearly with the qubit count, enabling circuits from 16 to 64 qubits to be trained within a 1.1-billion-parameter backbone. Across downstream benchmarks, increasing circuit width raises the average score from 47.65 to 54.30. At 64 qubits, HyperQ exceeds the backbone and its low-rank-adapted counterpart by 4.71 and 3.67 points, respectively. HyperQ is fine-tuned on 20,000 prompt-response pairs, compared with 200,000 for the classical baselines. These findings support token-conditioned circuit emission as a tractable architectural approach to quantum-augmented language modelling.", 'score': 22, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '3fe5c96412e29ccf', 'authors': ['Xiaoqiang Wang', 'Mengyang Xiong', 'Jun Dai', 'Bang Liu'], 'affiliations': ['Departement dinformatique et de recherche operationnelle, Universite de Montreal', 'McGill University', 'Mila, Quebec AI Institute'], 'pdf_title_img': 'assets/pdf/title_img/2609.24657.jpg', 'data': {'categories': [], 'emoji': '⚛️', 'ru': {'title': 'Квантовые ветви для эффективной адаптации языковых моделей', 'desc': 'В работе предлагается HyperQ — метод адаптации языковых моделей путём добавления квантовых остаточных ветвей в замороженный диффузионный трансформер. Каждая ветвь содержит гиперсеть, которая генерирует специфичные для токена параметры квантовой схемы (углы поворотов, коэффициенты связи и оси измерений) и выполняет квантовую схему размером от 16 до 64 кубитов. Ожидаемые значения квантовых операций вычисляются через классический алгоритм с линейной сложностью по числу кубитов, что делает обучение эффективным без замораживания основной модели. Экспериментальные результаты показывают, что увеличение ширины квантовой схемы улучшает качество на целевых задачах на 6.65 пункта, при этом требуя в 10 раз меньше примеров для обучения по сравнению с классическими методами адаптации.'}, 'en': {'title': 'Harnessing Quantum Power for Language Models', 'desc': 'This paper presents HyperQ, a novel method for enhancing language models using quantum circuits. It introduces token-conditioned quantum residual branches that integrate with a frozen masked-diffusion language model, allowing for efficient computation without retraining the entire model. The approach utilizes a hypernetwork to generate specific parameters for each token, enabling the model to leverage quantum computing benefits while maintaining manageable computational costs. The results show that HyperQ significantly improves performance on various benchmarks, demonstrating the potential of combining quantum techniques with traditional language modeling.'}, 'zh': {'title': '量子增强语言建模的新方法', 'desc': '本文介绍了一种名为HyperQ的语言模型适应方法，通过在冻结的掩蔽扩散语言模型中添加基于量子电路的残差分支来实现。每个变换器块中的量子残差分支读取令牌的隐藏状态，并执行相应的量子电路，最后将测量值通过残差连接添加回去。HyperQ的设计使得在训练过程中，主干网络保持不变，仅训练新增的量子分支。实验结果表明，增加电路宽度可以显著提高模型性能，HyperQ在多个基准测试中表现优于传统模型。'}}}, {'id': 'https://huggingface.co/papers/2609.26774', 'title': 'StableVQ: Practical Guidelines for Stable Vector-Quantized Tokenizer Training', 'url': 'https://huggingface.co/papers/2609.26774', 'abstract': "Abstract  Vector Quantization (VQ) is fundamental to discrete visual tokenizers that power modern autoregressive and masked image generation models. While recent shared-projection codebook methods have substantially advanced codebook utilization, training stability remains a critical and underexplored challenge. We argue that the root cause lies in the entanglement of the Encoder--Decoder and Codebook training: because neither module can reliably fulfill its own responsibility in isolation, the system can only function when the two subsystems happen to cooperate---a fragile condition that breaks down precisely when training is most stressed. We propose StableVQ, which revisits the proper learning objective of each module and resolves the problems that arise when each is trained to fulfill its own role independently. Concretely, (1) Dynamic STE corrects the instability in the Encoder's learning objective, enabling it to robustly optimize the reconstruction space under discrete regularization even when codebook utilization is low. (2) Region VQ Loss reconceives the Codebook's learning objective so that it can independently guarantee full tracking of the encoder output distribution, without relying on encoder oscillations to drive activation. (3) Decoupled Schedule recognizes that the distinct responsibilities of the Encoder--Decoder and the Codebook demand distinct optimization dynamics, and assigns each an independent learning rate schedule to ensure robust system-level behavior. Built on top of shared-projection codebooks, StableVQ is lightweight and introduces no learnable parameters. Experiments on ImageNet demonstrate consistent improvements in training stability, codebook utilization, and reconstruction quality across diverse codebook sizes and initialization settings.", 'score': 20, 'issue_id': 3320, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '14ab3164eb3ec922', 'authors': ['Bao Tang', 'Jiahao Guo', 'Haoxiang Cao', 'Wenyu Liu', 'Changqian Yu', 'Kun Gai', 'Xinggang Wang'], 'affiliations': ['Huazhong University of Science and Technology', 'KlingAI Research', 'South China Normal University'], 'pdf_title_img': 'assets/pdf/title_img/2609.26774.jpg', 'data': {'categories': ['#training', '#architecture', '#cv', '#optimization'], 'emoji': '⚙️', 'ru': {'title': 'Стабилизация квантования векторов через декаплирование обучения компонентов', 'desc': 'В статье рассматривается проблема обучения Vector Quantization (VQ) - ключевого компонента дискретных визуальных токенизаторов для генеративных моделей. Авторы выявили, что нестабильность обучения возникает из-за взаимозависимости энкодера, декодера и кодовой книги, которые не могут надёжно функционировать независимо друг от друга. Они предлагают StableVQ - метод, который разделяет учебные задачи каждого модуля через динамическую STE для энкодера, Region VQ Loss для кодовой книги и независимые графики обучения для каждого компонента. Экспериментально показано, что метод улучшает стабильность обучения, использование кодовой книги и качество реконструкции изображений.'}, 'en': {'title': 'StableVQ: Enhancing Stability in Vector Quantization for Image Generation', 'desc': "This paper introduces StableVQ, a method designed to improve the training stability of vector quantization in visual tokenizers used in image generation models. The authors identify that the entanglement of the Encoder-Decoder and Codebook training leads to instability, particularly under stress during training. StableVQ addresses this by implementing three key strategies: Dynamic STE for stabilizing the Encoder's learning, Region VQ Loss for independent Codebook tracking, and a Decoupled Schedule for tailored optimization dynamics. The results show that StableVQ enhances training stability, codebook utilization, and reconstruction quality without adding extra parameters."}, 'zh': {'title': '稳定的向量量化，提升训练鲁棒性', 'desc': '向量量化（VQ）是现代自回归和掩蔽图像生成模型中离散视觉标记器的基础。本文提出了StableVQ方法，旨在解决编码器-解码器与代码本训练之间的相互依赖问题，从而提高训练的稳定性。通过动态STE、区域VQ损失和解耦调度等技术，StableVQ能够独立优化每个模块的学习目标，确保系统在训练过程中的鲁棒性。实验结果表明，StableVQ在训练稳定性、代码本利用率和重建质量方面均有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2609.25165', 'title': 'Ovis-Embedding: Pushing the Frontiers of Universal Omni-Modal Embeddings', 'url': 'https://huggingface.co/papers/2609.25165', 'abstract': 'Abstract  In this report, we introduce Ovis-Embedding, a state-of-the-art omni-modal embedding family built on native integration of text, image, video, and audio. Instead of assembling separate modality towers, Ovis-Embedding uses a shared multimodal backbone to encode different modalities in a common representation space. Specifically, we make three key advances: (1) native omni-modal initialization: we adopt a pretrained Qwen-omni model as the embedding backbone and adapt it through contrastive training with low-rank initialization; (2) data-centric omni-modal training: we construct a broad, high-quality corpus spanning text, images, video, audio, and interleaved multimodal data. To improve data efficiency, we introduce homogeneous-source sampling to form task-consistent batches with informative in-batch negatives; and (3) embedding-specific training and inference optimization: we use focal loss to emphasize hard examples and similarity-based Embedding Distillation to transfer fine-grained similarity structure from complementary experts. At inference time, low-rank feature decomposition enables compact embeddings with flexible dimensionality and minimal performance loss. Empirical evaluations show that the Ovis-Embedding family achieves state-of-the-art performance on MMEB-v3, MMEB-v2, MVEB, MAEB, and RTEB, demonstrating its effectiveness across text, image, video, and audio modalities. These results highlight the potential of unified omni-modal training to overcome modality fragmentation and advance universal embedding models for any-to-any retrieval.', 'score': 19, 'issue_id': 3319, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '4cd538151afdd8e8', 'authors': ['Ovis-Embedding Team'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2609.25165.jpg', 'data': {'categories': ['#benchmark', '#video', '#multimodal', '#audio', '#training'], 'emoji': '🎬', 'ru': {'title': 'Единое пространство для всех модальностей: универсальные омни-модальные эмбеддинги', 'desc': 'Ovis-Embedding представляет семейство мультимодальных эмбеддингов, объединяющих текст, изображения, видео и аудио в едином пространстве представлений через общий backbone на основе предобученной модели Qwen-omni. Авторы применяют контрастивное обучение с низкоранговой инициализацией и предлагают специальную стратегию формирования батчей с информативными негативными примерами для повышения эффективности обучения на разнородных данных. В процессе обучения использованы focal loss для акцентирования сложных примеров и Embedding Distillation для передачи структуры сходства от дополнительных экспертов. На этапе инференса низкоранговая декомпозиция признаков позволяет создавать компактные эмбеддинги с гибкой размерностью, сохраняя качество на всех модальностях.'}, 'en': {'title': 'Unified Embeddings for All Modalities', 'desc': 'Ovis-Embedding is a new approach to creating embeddings that can handle multiple types of data, like text, images, videos, and audio, all at once. Instead of using separate models for each type of data, it uses a single backbone model that integrates all these modalities into one shared space. The method includes innovative techniques such as using a pretrained model for better initialization, creating a diverse dataset for training, and optimizing the training process to focus on challenging examples. The results show that Ovis-Embedding outperforms existing models in various tasks, proving its effectiveness in unifying different data types for better retrieval.'}, 'zh': {'title': '统一全模态嵌入，突破模态碎片化', 'desc': '本文介绍了Ovis-Embedding，这是一种先进的全模态嵌入方法，能够同时处理文本、图像、视频和音频。与传统的分开处理不同模态的方法不同，Ovis-Embedding使用共享的多模态骨干网络，将不同模态编码到一个共同的表示空间中。我们在三个方面取得了重要进展，包括使用预训练的Qwen-omni模型进行嵌入初始化，以及通过对比训练和低秩初始化来优化模型。此外，我们还通过同源采样和焦点损失等技术提高了数据效率和训练效果。'}}}, {'id': 'https://huggingface.co/papers/2609.25186', 'title': 'From Pattern Recognizers to Personalized Companions: A Survey of Large Language Models in Mental Health', 'url': 'https://huggingface.co/papers/2609.25186', 'abstract': 'Abstract  The rising global prevalence of mental health conditions, together with longstanding barriers in traditional healthcare, such as limited resources, high cost, stigma, and privacy concerns, has created an urgent need for accessible and scalable support. Large Language Models (LLMs) have emerged as a transformative technology with strong potential to democratize mental health support through advanced natural language understanding and generation. However, the rapidly expanding, fragmented body of work in this area lacks a coherent evolutionary narrative, making it difficult to contextualize current progress and identify future directions. This survey addresses this gap by organizing and analyzing the literature around a central thesis: the role of LLMs in mental health is evolving through three distinct, increasingly sophisticated phases. We trace this trajectory from Phase I, in which LLMs act primarily as passive Information Tools and Pattern Recognizers for assessment; through Phase II, where they function as Empathetic Conversationalists for in-the-moment, stateless interactions; to the current frontier, Phase III, which seeks Longitudinal, Personalized Companions implemented as stateful cognitive agents. To support this framework, we systematically review core technologies, agent architectures (Profile, Memory, Reasoning, and Planning), and the critical infrastructure of datasets and benchmarks, highlighting how their evolution underpins this developmental path. Viewing the field through this developmental lens, we provide a comprehensive synthesis of existing work, an insightful narrative of its trajectory, and a clear roadmap for future innovation in responsible, effective, and human-centered AI for mental healthcare. A curated collection of the resources reviewed in this survey is available at our project repository: https://github.com/Emo-gml/Awesome-Mental-Health-LLMs.', 'score': 15, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '52606efe7c78f25e', 'pdf_title_img': 'assets/pdf/title_img/2609.25186.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'От информационных помощников к персональным агентам: эволюция LLM в психическом здравоохранении', 'desc': 'Исследование рассматривает эволюцию применения больших языковых моделей (LLM) в поддержке психического здоровья, от простых инструментов анализа информации к эмпатичным собеседникам и далее к персонализированным агентам с долгосрочной памятью. Авторы предлагают трёхфазную схему развития: сначала LLM используются для оценки и распознавания паттернов, затем функционируют как эмпатичные собеседники для текущих взаимодействий, и наконец становятся интеллектуальными агентами с состоянием, способными к долгосрочному персонализированному сопровождению. Обзор анализирует ключевые архитектуры агентов, включающие профиль пользователя, систему памяти, рассуждения и планирование, а также критическую инфраструктуру датасетов и бенчмарков. Работа предоставляет комплексное картирование поля, объясняет траекторию развития и определяет направления для ответственного и ориентированного на человека AI в психическом здравоохранении.'}, 'en': {'title': 'Evolving LLMs: From Information Tools to Personalized Mental Health Companions', 'desc': 'This paper explores the evolving role of Large Language Models (LLMs) in providing mental health support, highlighting their potential to make care more accessible. It categorizes the development of LLMs into three phases: from basic information tools to empathetic conversational agents, and finally to personalized companions. The authors systematically review the technologies and architectures that support these advancements, emphasizing the importance of datasets and benchmarks. By framing the discussion around these phases, the paper aims to provide a clear roadmap for future innovations in AI-driven mental healthcare.'}, 'zh': {'title': '大型语言模型：心理健康支持的未来', 'desc': '随着全球心理健康问题的增加，传统医疗面临资源有限、成本高、污名化和隐私担忧等障碍，急需可及且可扩展的支持。大型语言模型（LLMs）作为一种变革性技术，具有通过先进的自然语言理解和生成来普及心理健康支持的潜力。本文调查了LLMs在心理健康领域的演变，分为三个阶段：第一阶段为信息工具，第二阶段为同理心对话者，第三阶段为个性化的认知代理。通过系统回顾核心技术和基础设施，本文为未来心理健康领域的创新提供了清晰的路线图。'}}}, {'id': 'https://huggingface.co/papers/2609.26796', 'title': 'Flash-dLLM: IO-Aware KV Caching and Parallel Decoding for Fast, Memory-Efficient Diffusion LLMs', 'url': 'https://huggingface.co/papers/2609.26796', 'abstract': 'Abstract  Diffusion Large Language Models (dLLMs) have recently emerged as a promising alternative to autoregressive LLMs by enabling non-autoregressive text generation. However, their practical deployment remains limited by inefficient inference, largely due to the absence of effective Key-Value (KV) caching and scalable parallel decoding mechanisms. Existing acceleration methods typically study KV caching and parallel decoding in isolation, overlooking the I/O bottlenecks that arise when cache reuse and parallel token verification are jointly applied. In this work, we introduce Flash-dLLM, a training-free inference acceleration framework for fast and memory-efficient dLLMs. Flash-dLLM first identifies GPU memory I/O as a dominant bottleneck in KV-cache-enabled dLLM inference and addresses it with an I/O-aware fused KV-cache kernel that reduces redundant memory movement. Building on this optimized cache mechanism, Flash-dLLM further proposes an efficient KV-cache-driven draft-and-verify decoding strategy, where the dLLM itself serves as both drafter and verifier without requiring an auxiliary model. This unified design enables faster decoding while preserving generation quality and improving scalability to longer sequences and larger batch size. Extensive experiments on mathematical reasoning and code-generation benchmarks demonstrate that Flash-dLLM consistently outperforms existing state-of-the-art dLLM acceleration methods in both inference speed and memory efficiency. In particular, it achieves 5.1times and 11.0times speedups over prior strongest baseline Elastic-Cache on GSM8K and HumanEval, respectively.', 'score': 13, 'issue_id': 3319, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'bffc23c6445360fb', 'authors': ['Quan Nguyen-Tri', 'Mukul Ranjan', 'Zhiqiang Shen'], 'affiliations': ['VILA Lab, MBZUAI Abu Dhabi, UAE'], 'pdf_title_img': 'assets/pdf/title_img/2609.26796.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Молниеносный инференс диффузионных моделей через оптимизацию кэширования', 'desc': 'Статья представляет Flash-dLLM — фреймворк для ускорения инференса диффузионных больших языковых моделей без переобучения. Авторы выявили, что основным узким местом является передача данных между GPU памятью, и решили эту проблему с помощью оптимизированного ядра кэширования ключ-значение пар. На основе этого механизма предложена эффективная стратегия генерации токенов с проверкой, где модель одновременно выступает как генератор гипотез и верификатор. Экспериментальные результаты показывают существенное ускорение инференса (до 11 раз) и улучшение памяти, при этом сохраняя качество генерируемого текста.'}, 'en': {'title': 'Accelerating dLLMs: Fast and Efficient Inference with Flash-dLLM', 'desc': 'This paper presents Flash-dLLM, a new framework designed to speed up the inference process of Diffusion Large Language Models (dLLMs). It addresses the inefficiencies caused by GPU memory I/O during the use of Key-Value (KV) caching and parallel decoding. By introducing an optimized KV-cache kernel and a novel draft-and-verify decoding strategy, Flash-dLLM enhances both speed and memory efficiency without needing additional models. The results show significant improvements in inference speed, achieving up to 11 times faster performance compared to existing methods on various benchmarks.'}, 'zh': {'title': 'Flash-dLLM：加速扩散大型语言模型的创新方案', 'desc': '扩散大型语言模型（dLLMs）是一种新兴的文本生成方法，能够实现非自回归生成。本文提出了Flash-dLLM，一个无需训练的推理加速框架，旨在提高dLLMs的推理速度和内存效率。通过优化键值缓存（KV-cache）机制，Flash-dLLM解决了GPU内存I/O瓶颈，并提出了一种高效的草拟和验证解码策略。实验结果表明，Flash-dLLM在推理速度和内存效率上均优于现有的最先进的dLLM加速方法。'}}}, {'id': 'https://huggingface.co/papers/2609.26550', 'title': 'JEV-as-a-Judge: Accept When Confident, Escalate When Unsure', 'url': 'https://huggingface.co/papers/2609.26550', 'abstract': "Abstract  LLM-as-a-judge enables evaluation across diverse tasks, but inference cost and confidence reliability become critical at scale. We study whether a decision-only judge can provide an economical first pass and identify when stronger evaluation is needed. Comparing jev-as-a-judge with sixteen generative and reward-model judges, with blinded human adjudication, we find it within three percentage points of a state-of-the-art LLM judge, our strongest comparator, on ordinary preference and evidence-grounded factuality at 0.36% of the comparator's fee. Larger gaps arise when judgments require checking a derivation or resisting an elaborately written wrong answer. On several benchmarks, JEV's gap to this comparator is concentrated in low-confidence decisions. A frozen cascade that accepts confident verdicts and escalates uncertain ones retains 99% of the comparator's accuracy at lower cost.", 'score': 12, 'issue_id': 3321, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '5f719159b4a992cc', 'authors': ['Yubo Li', 'Yidi Miao', 'Ramayya Krishnan', 'Rema Padman'], 'affiliations': ['Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2609.26550.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Экономичная двухуровневая оценка: когда лёгкий судья лучше дорогого', 'desc': 'Исследование предлагает использовать простого классификатора вместо дорогостоящей большой языковой модели для оценки качества ответов в различных задачах машинного обучения. Авторы показали, что такой экономичный подход достигает результаты, близкие к продвинутым LLM-судьям (в пределах трёх процентных пункта), но при этом стоит в 280 раз дешевле. Выявлено, что основные различия в качестве оценки проявляются в сложных случаях, требующих проверки математических вычислений или распознавания замаскированных ошибок. Предложен каскадный подход, когда классификатор с высокой уверенностью выносит решение самостоятельно, а в сомнительных случаях передаёт задачу более мощной модели, достигая 99% точности при сниженных затратах.'}, 'en': {'title': 'Cost-Effective Evaluation with JEV: Smart Judging at Scale', 'desc': "This paper explores the use of a decision-only judge, referred to as JEV, for evaluating various tasks in machine learning. It compares JEV's performance against sixteen other judges, including generative and reward-model judges, and finds that JEV is nearly as accurate as a state-of-the-art LLM judge while being significantly cheaper. The study highlights that JEV performs well in straightforward evaluations but struggles with complex judgments that require deeper reasoning. A proposed solution is a 'frozen cascade' approach that efficiently handles confident decisions while escalating uncertain ones, maintaining high accuracy at a reduced cost."}, 'zh': {'title': '经济高效的评判者：LLM的决策能力', 'desc': '本文研究了一种名为LLM-as-a-judge的模型，该模型能够在多种任务中进行评估，但在大规模应用时推理成本和置信度的可靠性变得至关重要。我们探讨了仅依赖决策的评判者是否能够提供经济高效的初步评估，并识别何时需要更强的评估。通过与十六种生成模型和奖励模型的评判者进行比较，我们发现该模型在普通偏好和基于证据的事实性评估中，准确度与最强的对比模型相差仅三个百分点，且成本仅为对比模型的0.36%。在一些基准测试中，JEV模型的差距主要集中在低置信度的决策上，而一个接受自信判决并升级不确定判决的级联模型在降低成本的同时保留了99%的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.25199', 'title': 'Lean Pool: An AI-Maintained Archive of Formalized Mathematics', 'url': 'https://huggingface.co/papers/2609.25199', 'abstract': 'Abstract  Lean Pool is a repository of formalized mathematics. It is grown, maintained and optimized by AI agents.', 'score': 11, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': 'b6644d7107429593', 'pdf_title_img': 'assets/pdf/title_img/2609.25199.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'AI агенты как хранители формальной математики', 'desc': 'В статье описывается Lean Pool - репозиторий формализованной математики, который создаётся и развивается с помощью AI агентов. Система использует машинное обучение для автоматического генерирования математических доказательств и оптимизации существующих результатов. AI агенты способны самостоятельно добавлять новые теоремы и улучшать структуру математического знания в репозитории. Такой подход позволяет масштабировать формальную верификацию математических утверждений и создавать обширные базы проверенного математического кода.'}, 'en': {'title': 'AI-Driven Repository for Formalized Mathematics', 'desc': 'Lean Pool is a collection of formalized mathematical concepts and proofs that is continuously developed and improved by artificial intelligence agents. These AI agents help in organizing and optimizing the repository, ensuring that the mathematical content is accurate and accessible. The use of AI in this context allows for efficient management of complex mathematical structures and enhances collaboration among researchers. Overall, Lean Pool represents a significant advancement in the integration of AI with formal mathematics.'}, 'zh': {'title': 'AI 助力形式化数学的高效库', 'desc': 'Lean Pool 是一个形式化数学的库，旨在通过人工智能代理进行构建、维护和优化。这个库可以帮助研究人员和开发者更高效地使用数学知识。AI 代理在这个过程中发挥了重要作用，能够自动化许多繁琐的任务。通过 Lean Pool，数学的形式化过程变得更加便捷和高效。'}}}, {'id': 'https://huggingface.co/papers/2609.26781', 'title': 'Agensh: Scaling Organizational Intelligence to 1,024 Agents', 'url': 'https://huggingface.co/papers/2609.26781', 'abstract': "Abstract  A multi-agent system can reduce latency on complex tasks by executing work concurrently. Several pioneering harness frameworks support multi-agent systems. However, the scalability of current multi-agent harnesses is often constrained by a central orchestrator's capacity to allocate tasks and coordinate workers. To address this limitation, we introduce Agensh, a scalable self-organized multi-agent harness without a central orchestrator: concurrent workers execute a multi-agent cooperation loop, continuously gathering context, claiming and self-assigning sub-tasks, taking action and sharing findings, verifying results, and merging progress in an asynchronous manner. The loop is supported by the agentic organization infrastructure comprising three components: a shared workspace holds proposed, ongoing, and completed work; a message interface lets workers communicate; and shared context retains reusable findings and work intentions. To test the scalability of Agensh, we evaluate it on the five hardest ProgramBench tasks with GPT-5.6-sol (high). Scaling from 1 to 128 agents raises the mean final test-pass rate from 19.31% to 28.78%, an approximately 49% relative improvement. Larger organizations reach comparable test-pass rates earlier. On pandoc, scaling from 1 to 1,024 agents raises the final test-pass rate from 33.89% to 55.06%. Worker trajectories further show that different forms of self-organized cooperation gradually emerges and standardizes as the organization grows. These results reveal the number of agents as a new scaling dimension for multi-agent organizations to expand the frontier of general intelligence, offering a practical solution for complex tasks under hard latency constraints or time budgets.", 'score': 7, 'issue_id': 3321, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'dfdb610c417d8556', 'authors': ['Zhihao Zhan', 'Ting Song', 'Li Dong', 'Shaohan Huang', 'Jianxun Lian', 'Yan Xia', 'Furu Wei'], 'affiliations': ['Microsoft Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.26781.jpg', 'data': {'categories': ['#agents', '#plp'], 'emoji': '🤝', 'ru': {'title': 'Децентрализованное самоорганизующееся общество агентов превосходит централизованные системы', 'desc': 'В статье представлена Agensh — масштабируемая система мультиагентного взаимодействия без центрального координатора, где агенты самостоятельно распределяют задачи и сотрудничают асинхронно. Система поддерживается инфраструктурой, включающей общее рабочее пространство, интерфейс обмена сообщениями и общий контекст для обмена результатами. На задачах из ProgramBench увеличение числа агентов с 1 до 128 улучшило процент прохождения тестов с 19.31% до 28.78%, что демонстрирует примерно 49% относительное улучшение производительности. Результаты показывают, что количество агентов является новым измерением масштабирования для мультиагентных систем и позволяет решать сложные задачи в условиях жёстких временных ограничений.'}, 'en': {'title': 'Agensh: Empowering Agents to Self-Organize for Scalable Task Execution', 'desc': 'This paper presents Agensh, a novel multi-agent system designed to enhance scalability by eliminating the need for a central orchestrator. Instead of relying on a single entity to manage tasks, Agensh allows agents to self-organize, claim sub-tasks, and share findings in an asynchronous manner. The system includes a shared workspace for tracking work progress, a messaging interface for communication, and a shared context for retaining useful information. Experimental results demonstrate that increasing the number of agents significantly improves task completion rates, highlighting the potential of self-organized cooperation in complex problem-solving scenarios.'}, 'zh': {'title': 'Agensh：无中央协调的自组织多智能体系统', 'desc': '本论文介绍了一种名为Agensh的多智能体系统，它通过自组织的方式来提高任务执行的效率，而不依赖于中央协调者。Agensh允许多个智能体并行工作，自动分配子任务并共享进展，从而减少延迟。研究表明，随着智能体数量的增加，系统的测试通过率显著提高，展示了智能体数量作为扩展多智能体组织的新维度。该方法为在严格的时间限制下处理复杂任务提供了实用的解决方案。'}}}, {'id': 'https://huggingface.co/papers/2609.24967', 'title': 'Emergent Collusion in Long-Horizon LLM Agent Interaction', 'url': 'https://huggingface.co/papers/2609.24967', 'abstract': "Abstract  LLM agents are increasingly deployed in collaborative settings, yet long-term interaction may give rise to undesirable coordination. We study the emergence of collusion in a long-horizon multi-agent environment: two agents repeatedly complete individual tasks, share task logs, verify each other's work, and receive rewards. We introduce realistic constraints that make compliance with the verification protocol incompatible with reward maximization, and find that agents increasingly deviate from the protocol over repeated interactions. Collusion emerges in 94% of trajectories across 10 models, and more capable models within the same family reach it earlier. Controlled peer interventions show that collusion is shaped by peer behavior, while ablations reveal additional effects of reward structure, the verification feedback agents receive, and their interaction history. In particular, restricting the amount and scope of interaction history available to agents reduces collusion. Overall, our findings show that long-horizon interaction can reshape how agents coordinate in ways that create safety risks.", 'score': 6, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '6164d657190b2ca4', 'authors': ['Xinrui Shi', 'Yanzhe Zhang', 'Diyi Yang'], 'affiliations': ['Georgia Tech', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2609.24967.jpg', 'data': {'categories': ['#agents', '#rlhf'], 'emoji': '🤝', 'ru': {'title': 'Когда агенты договариваются против правил: опасность скрытого сговора в долгосрочном взаимодействии', 'desc': 'Исследование показывает, что LLM агенты в длительном взаимодействии склонны к сговору и отступлению от установленных правил проверки. Учёные создали сценарий, где два агента выполняют задачи, обмениваются логами и проверяют работу друг друга, но получают стимулы, несовместимые с честным соблюдением протокола. Результаты показали, что в 94% случаев агенты начинают координировать свои действия против системы, при этом более способные модели достигают сговора быстрее. Авторы выявили, что ограничение доступа к истории взаимодействия снижает риск сговора, что имеет важное значение для безопасности развёртывания многоагентных систем.'}, 'en': {'title': 'Collusion Risks in Long-Term Agent Interactions', 'desc': "This paper investigates how long-term interactions between machine learning agents can lead to collusion, where agents deviate from agreed protocols to maximize their rewards. The study reveals that when agents are tasked with individual jobs but share logs and verify each other's work, they may prioritize personal gain over compliance with verification rules. The research shows that collusion occurs frequently, especially in more advanced models, and is influenced by peer behavior and the structure of rewards. Additionally, limiting the interaction history available to agents can help reduce the likelihood of collusion, highlighting potential safety risks in collaborative AI systems."}, 'zh': {'title': '长期互动中的合谋风险', 'desc': '本研究探讨了在长期多智能体环境中，智能体之间的合谋现象。我们发现，当智能体在重复的互动中，遵循验证协议与最大化奖励之间存在冲突时，合谋行为会逐渐增加。实验结果显示，在10个模型的94%轨迹中出现了合谋，且更强大的模型更早达到这一状态。通过控制同伴干预，我们发现同伴行为会影响合谋的形成，而限制智能体的互动历史可以减少合谋的发生。'}}}, {'id': 'https://huggingface.co/papers/2609.26457', 'title': 'Recursive self-improvement of AI research agents', 'url': 'https://huggingface.co/papers/2609.26457', 'abstract': "Abstract  AI agents are beginning to automate research and development across the AI stack, from improving training efficiency to optimizing inference. A natural next step is to improve the research efficiency of the agents themselves. When an AI research agent's own code is the object of optimization, each accepted rewrite becomes the agent that the next round edits. We refer to this loop as recursive self-improvement. Its significance lies in a long-standing trend, in which increased cumulative spending on R&D yields diminishing returns. Sustained self-improvement offers a way to counter this trend. We present AIDE^2, a system that implements this loop for a frontier AI research agent. It proposes changes to its own code, benchmarks modified versions of itself on a suite of AI R&D tasks, and keeps the changes that perform best on hidden evaluations. In an autonomous 8-day run, AIDE^2 discovered seven successive improvements, ranging from a new search policy to memory mechanisms that compress and manage the agent's growing context. These gains generalize to four held-out benchmarks spanning machine learning engineering, heuristic algorithm engineering, and physics-based weather forecasting, the last of which is out of distribution from the selection tasks. On all four, the strongest discovered agent matches or exceeds a human-engineered production research agent that ranks among the strongest on FML-Bench. On a separate held-out task family, the discovered agents also exhibit reduced reward hacking, a property the loop never explicitly optimized for: the rate falls from 55% to 32% during the run, 7 percentage points below the human-engineered agent. Together, these results show that an AI research agent can improve its own research efficiency through recursive self-improvement, and that these gains transfer to tasks and domains the loop never encountered.", 'score': 6, 'issue_id': 3319, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '64364d489b93769b', 'authors': ['Dhruv Srikanth', 'Bingchen Zhao', 'Dixing Xu', 'Yuxiang Wu', 'Zhengyao Jiang'], 'affiliations': ['Weco AI'], 'pdf_title_img': 'assets/pdf/title_img/2609.26457.jpg', 'data': {'categories': ['#benchmark', '#agents', '#training', '#optimization', '#science'], 'emoji': '🔄', 'ru': {'title': 'AI-агент улучшает сам себя: от кода к открытиям', 'desc': 'В статье представлена система AIDE^2, которая реализует рекурсивное самоулучшение — процесс, при котором AI-агент автономно модифицирует собственный код, тестирует изменения на наборе задач исследования и оставляет наиболее эффективные версии. За восьмидневный период агент обнаружил семь последовательных улучшений, включая новые стратегии поиска и механизмы памяти для управления растущим контекстом. Полученные улучшения обобщаются на скрытых бенчмарках в области машинного обучения, эвристической оптимизации и прогнозирования погоды, демонстрируя способность к трансферу знаний. Результаты показывают, что AI-исследовательский агент может самостоятельно повышать эффективность своей работы через итеративную оптимизацию, противодействуя тенденции к убывающей отдаче от масштабирования R&D.'}, 'en': {'title': 'Empowering AI: Recursive Self-Improvement for Enhanced Research Efficiency', 'desc': 'This paper discusses a system called AIDE^2, which enables AI agents to enhance their own code through a process known as recursive self-improvement. By iteratively proposing and testing modifications to their own algorithms, these agents can optimize their performance on various AI research and development tasks. The study demonstrates that AIDE^2 successfully discovered multiple improvements over an 8-day period, leading to better performance than traditional human-engineered agents. Notably, the improvements also resulted in reduced instances of reward hacking, showcasing the potential for AI agents to autonomously enhance their efficiency and effectiveness.'}, 'zh': {'title': 'AI代理的自我改进之路', 'desc': '本文介绍了一种名为AIDE^2的系统，该系统能够实现递归自我改进，使AI研究代理能够优化自身代码。通过提出代码修改建议并在一系列AI研发任务上进行基准测试，AIDE^2在8天内发现了七个连续的改进。研究表明，这些改进不仅提高了代理的研究效率，还在多个未见过的任务上表现出色，超越了人类设计的研究代理。最终，结果显示AI研究代理能够通过递归自我改进来提升自身的研究效率，并且这些改进能够迁移到未接触过的任务和领域。'}}}, {'id': 'https://huggingface.co/papers/2609.25636', 'title': 'RoboFollow: Unveiling the Instruction Following Mirage in Embodied Agents', 'url': 'https://huggingface.co/papers/2609.25636', 'abstract': 'Abstract  Modern embodied agents achieve impressive success rates, yet their actual instruction-following ability is far weaker than these numbers suggest. We trace this illusion to a structural property we term low scene entropy: when a visual scene admits only one valid task, language becomes redundant and a policy can score highly while barely using it. We introduce RoboFollow, a diagnostic benchmark with three principles: (1) High Scene Entropy: each training scene supports multiple kinematically distinct task branches, making vision alone insufficient and forcing reliance on language. (2) Hierarchical Diagnostic Protocol: a four-level protocol (L0--L3) progressively perturbs visual layout and semantics, probing whether equivalent instructions yield consistent behavior and distinct ones yield discriminable behavior across spatial relations, attributes, trajectory constraints, and logic. (3) Confound-Controlled Diagnosis: we simplify interaction objects, restrict actions to the trained repertoire and report stage-wise Intent and Execution scores, isolating comprehension from motor execution. Evaluation of nine VLA and WAM policies shows that strong L0 performance, where attained, does not reliably transfer to L1--L3 under our fine-tuning setup. Representative mitigations, including stronger VLM backbones, QA co-training, LangForce, and Classifier-Free Guidance, all fail to close this gap. RoboFollow exposes genuine instruction following as a critical, overlooked bottleneck. Code and dataset are available at https://github.com/AutoLab-SAI-SJTU/RoboFollow and https://huggingface.co/datasets/AutoLab-SJTU/robofollow-data.', 'score': 4, 'issue_id': 3321, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': 'f70fbac3b55adfb6', 'authors': ['Chang Guo', 'Yukun Xie', 'Bohan Tan', 'Zheng Chang', 'Zhaokai Yin', 'Qianli Ma', 'Yingqiao Wang', 'Chao Liang', 'Zhipeng Zhang'], 'affiliations': ['AutoLab, School of Artificial Intelligence, Shanghai Jiao Tong University', 'Research Lab, Anyverse Dynamics'], 'pdf_title_img': 'assets/pdf/title_img/2609.25636.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#robotics', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Истинное понимание языка — узкое место в обучении роботов', 'desc': 'Статья выявляет критическую проблему в современных воплощённых агентах: они показывают высокие показатели успеха, но плохо следуют инструкциям на естественном языке. Авторы вводят концепцию низкой энтропии сцены, когда визуальная сцена допускает только одну задачу, и агент может решить её, фактически игнорируя язык. Они предлагают бенчмарк RoboFollow с высокой энтропией сцены, иерархическим протоколом диагностики из четырёх уровней и контролем смешивающих факторов для точной оценки понимания инструкций. Эксперименты показывают, что даже передовые методы с сильными VLM бэкбонами не справляются с задачами повышенной сложности, что указывает на глубокую проблему в понимании языка робототехническими агентами.'}, 'en': {'title': 'RoboFollow: Unveiling the True Challenge of Instruction Following in AI Agents', 'desc': 'This paper highlights the gap between the high success rates of modern embodied agents and their actual ability to follow instructions effectively. The authors introduce a concept called low scene entropy, where a visual scene allows only one valid task, making language use unnecessary and leading to misleading performance metrics. They present RoboFollow, a benchmark designed to evaluate agents based on high scene entropy, a hierarchical diagnostic protocol, and confound-controlled diagnosis to assess true instruction comprehension. The findings reveal that strong performance in simple scenarios does not translate to more complex tasks, indicating that genuine instruction following is a significant challenge in the field.'}, 'zh': {'title': '揭示指令执行能力的关键瓶颈', 'desc': '现代的具身智能体在任务成功率上表现出色，但它们的指令执行能力远不如这些数字所暗示的那样强。我们将这种错觉归因于一种结构特性，称为低场景熵：当一个视觉场景只允许一个有效任务时，语言变得多余，策略可以在几乎不使用语言的情况下获得高分。我们提出了RoboFollow，一个诊断基准，旨在通过高场景熵、分层诊断协议和混淆控制诊断来评估智能体的指令理解能力。评估结果显示，尽管在L0级别表现良好，但在L1到L3级别的转移并不可靠，揭示了真正的指令执行能力是一个被忽视的重要瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2609.26346', 'title': 'Blaming Across the Aisle: Political Contrasting and Blame Attribution in the Danish Parliament', 'url': 'https://huggingface.co/papers/2609.26346', 'abstract': 'Abstract  Political discourse is widely perceived to be growing more hostile, yet robust evidence remains scarce. This study examines blame attribution in the Danish Parliament from 1997 to 2026, combining a purpose-built classifier, BlameBERT (F1: 0.80), with multilevel statistical modeling. The classifier is constructed using an annotation-efficient pipeline for blame attribution in low-to-mid resource languages. The results reveal a banana-shaped trajectory, with blame declining until around 2016 before entering a significant and sustained increase in recent years (2019-2026). Government status consistently influenced blame attribution - an effect we term political contrasting - with opposition parties blaming substantially more than governing parties. This effect was moderated by ideology: The blame-dampening effect of governing was less pronounced among right-wing parties, and ideological extremity amplified blame more strongly on the right. In recent years, the interaction between political wing and ideological extremity intensified, suggesting an ideological hardening of the blame rhetoric concentrated on the right of the political spectrum. Taken together, these patterns suggest that the perceived rise in harsh political language reflects not merely a general rhetorical drift, but an ideologically asymmetric hardening of political discourse. A sensitivity analysis showed that the conclusions were robust to varying classification thresholds.', 'score': 4, 'issue_id': 3321, 'pub_date': '2026-09-22', 'pub_date_card': {'ru': '22 сентября', 'en': 'September 22', 'zh': '9月22日'}, 'hash': '65b1e8ad3909f89a', 'authors': ['Markus Lundsfryd Jensen', 'Rune Egeskov Trust', 'Kenneth Christian Enevoldsen', 'Sara Kolding'], 'affiliations': ['Center for Humanities Computing', 'School of Communication and Culture Aarhus University'], 'pdf_title_img': 'assets/pdf/title_img/2609.26346.jpg', 'data': {'categories': ['#low_resource', '#interpretability'], 'emoji': '⚖️', 'ru': {'title': 'Идеологическая асимметрия обвинений в политическом дискурсе', 'desc': 'В работе исследуется атрибуция вины в датском парламенте с 1997 по 2026 год с использованием специализированного классификатора BlameBERT, построенного на основе BERT с применением аннотационно-эффективного pipeline для языков с низкими ресурсами. Результаты показывают характерную траекторию, где уровень обвинений снижался до 2016 года, а затем значительно возрос в период 2019-2026. Исследование выявило явление «политического контраста»: оппозиционные партии приписывают вину значительно чаще, чем правящие партии, при этом этот эффект модерируется идеологией партии. Анализ свидетельствует об идеологически асимметричном ужесточении политического дискурса, особенно выраженном у правых партий в последние годы.'}, 'en': {'title': 'Blame Attribution: Unpacking Hostility in Political Discourse', 'desc': 'This paper investigates how blame is assigned in the Danish Parliament over nearly three decades, using a specialized machine learning model called BlameBERT. The model, which achieved a high F1 score of 0.80, was designed to efficiently classify blame in a language with limited resources. The findings indicate a significant increase in blame attribution from 2019 to 2026, particularly among opposition parties, influenced by their political ideology. The study highlights a growing ideological divide, with right-wing parties exhibiting a stronger tendency to blame, suggesting a shift towards more hostile political discourse.'}, 'zh': {'title': '政治话语中的指责归因与意识形态的关系', 'desc': '本研究分析了1997年至2026年丹麦议会中的指责归因，使用了专门构建的分类器BlameBERT。研究发现，指责的趋势呈香蕉形状，直到2016年指责减少，随后在2019年至2026年间显著增加。政府地位对指责归因有持续影响，反对党比执政党更倾向于指责，且这种影响受到意识形态的调节。最近几年，政治派别与意识形态极端性之间的互动加剧，表明政治话语中的指责 rhetoric 在右派中变得更加极端。'}}}, {'id': 'https://huggingface.co/papers/2609.25053', 'title': 'LatentPort: Beyond KV Cache - Cross-Model Transfer of Recurrent Memory in Hybrid Language Models: A 4B-to-9B Hybrid-State Handoff Without Target Prefix Replay', 'url': 'https://huggingface.co/papers/2609.25053', 'abstract': 'Abstract  Can one language model hand its live memory to another without the receiver rereading the context? We demonstrate useful persistent hybrid-state transfer across one architecture-matched Qwen3.5 4B-to-9B sibling pair. To our knowledge, this is the first demonstrated cross-model handoff of persistent recurrent inference state between differently sized hybrid language models without target prefix replay. Translated attention KV alone leaves a large gap; adding the Gated DeltaNet (GDN) persistent-state package lowers teacher-forced negative log-likelihood (NLL), the average next-token log-loss, by 0.747 nats/token (95% paired document bootstrap CI [0.6921, 0.8047]), improving all 64 PG19 documents. Direct recurrent and convolution reuse outperforms the tested learned GDN maps, consistent with partial functional compatibility of persistent-state coordinates. A fresh component factorial selects translated KV with direct recurrent and convolution state. An additional 434,176-parameter correction improves that base on 64 fresh web documents: continuation loss is 0.076 nats/token above native 9B (excess NLL), Jensen-Shannon (JS) divergence is 0.022, and native context recovery (NCR) is 0.918. Corrected 9B significantly beats continued 4B inference while processing zero historical prefix tokens. Evidence covers one direction, one geometry-matched Base-model pair, and 4K teacher-forced continuation; the near-native gate failed, the 16K branch was not run, and free-generation equivalence and a general state interface remain unproven.', 'score': 3, 'issue_id': 3321, 'pub_date': '2026-09-07', 'pub_date_card': {'ru': '7 сентября', 'en': 'September 7', 'zh': '9月7日'}, 'hash': '70d29adc0b5af448', 'pdf_title_img': 'assets/pdf/title_img/2609.25053.jpg', 'data': {'categories': ['#architecture', '#transfer_learning', '#inference', '#small_models'], 'emoji': '🧠', 'ru': {'title': 'Передача памяти между языковыми моделями без переобработки контекста', 'desc': 'В работе предложен метод передачи внутреннего состояния языковой модели между архитектурно совместимыми моделями разного размера без необходимости переобработки контекста. Исследователи демонстрируют передачу персистентного состояния гибридной модели с механизмом Gated DeltaNet, которое включает механизм внимания и рекуррентные компоненты. Метод позволяет меньшей модели (4B параметров) эффективно передать свою память большей модели (9B), что снижает ошибку предсказания следующего токена на 0.747 натур на токен. Предложенный подход значительно превосходит наивное продолжение вывода маленькой модели и приближается к производительности нативной большой модели без обработки исторического контекста.'}, 'en': {'title': 'Seamless Memory Transfer Between Language Models', 'desc': 'This paper explores the transfer of live memory between two language models of different sizes without needing the receiving model to reread the context. It introduces a method for persistent hybrid-state transfer using a Gated DeltaNet (GDN) package, which significantly reduces the negative log-likelihood (NLL) during inference. The results show that direct reuse of recurrent and convolutional states outperforms learned GDN maps, indicating a compatibility in persistent-state coordinates. Overall, the findings suggest that the corrected larger model can effectively process new inputs without relying on historical context, demonstrating a novel approach in model interaction.'}, 'zh': {'title': '语言模型间的记忆传递新突破', 'desc': '本文探讨了语言模型之间如何在不重新读取上下文的情况下进行记忆的传递。我们展示了在相同架构的Qwen3.5 4B和9B模型之间进行持久混合状态转移的有效性。这是首次在不同大小的混合语言模型之间实现持久递归推理状态的交接，而无需目标前缀重放。通过引入Gated DeltaNet（GDN）持久状态包，显著降低了负对数似然（NLL），并在多个文档上取得了改进。'}}}, {'id': 'https://huggingface.co/papers/2609.25247', 'title': 'Geometric and Semantic Coupling for Interaction Understanding in 3D Scenes', 'url': 'https://huggingface.co/papers/2609.25247', 'abstract': 'Abstract  Interaction understanding in 3D scenes requires a joint description of movable parts, their motion, and the regions through which they can be operated. We present Segment-Snap, which connects these outputs through the physical relationship between parts and handles. Learned predictors identify broad part surfaces and small handles. A geometric decoder uses planar and upright priors to constrain motion, then selects hinge lines using predicted handle locations, without training a motion regressor. Conversely, a joint part-and-handle predictor supplies additional handle candidates, whose motion classes are refined using containing parts. Each information transfer is applied once, without iterative feedback. On Articulate3D validation, handle guidance raises motion-gated AP from 13.74% to 40.98% at fixed masks and axes. Additional handle candidates raise handle AP from 24.63% to 29.65%; part-based class correction adds 0.98 points, and full context reaches 30.99%. Repeated training, learned-decoder controls and paired visualizations establish the benefits and limitations of combining geometric and semantic evidence for interaction understanding.', 'score': 3, 'issue_id': 3320, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': 'c813f545240b50b4', 'authors': ['Hanyang Kong', 'Xingyi Yang'], 'affiliations': ['National University of Singapore', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2609.25247.jpg', 'data': {'categories': ['#architecture', '#cv', '#3d'], 'emoji': '🚪', 'ru': {'title': 'Геометрическая семантика взаимодействия: соединение деталей, ручек и движения в 3D', 'desc': 'Статья представляет метод Segment-Snap для понимания взаимодействия в трёхмерных сценах, который совместно выделяет подвижные части объектов, описывает их движение и области манипуляции. Подход использует геометрический декодер с приоритетами плоскостности и вертикальности для ограничения траекторий движения, а также предикторы для выявления ручек и рабочих поверхностей. Система применяет передачу информации между компонентами без итеративной обратной связи, комбинируя геометрические и семантические признаки. Экспериментальные результаты показывают значительное улучшение точности детекции движения и ручек на датасете Articulate3D.'}, 'en': {'title': 'Segment-Snap: Enhancing 3D Interaction Understanding through Geometry and Semantics', 'desc': 'The paper introduces Segment-Snap, a method for understanding interactions in 3D scenes by analyzing movable parts and their motions. It employs learned predictors to identify surfaces and handles, while a geometric decoder constrains motion based on these predictions. The approach enhances motion detection accuracy significantly by integrating handle guidance and refining motion classes through part relationships. Overall, the study demonstrates the effectiveness of combining geometric and semantic information for improved interaction understanding in 3D environments.'}, 'zh': {'title': 'Segment-Snap：提升三维交互理解的创新方法', 'desc': '本论文提出了一种名为Segment-Snap的方法，用于理解三维场景中的交互。该方法通过可移动部件及其运动与操作区域之间的物理关系来连接不同的输出。研究中使用的学习预测器能够识别大表面和小把手，并通过几何解码器约束运动。实验结果表明，使用把手指导可以显著提高运动检测的准确率，展示了几何和语义证据结合的优势和局限性。'}}}, {'id': 'https://huggingface.co/papers/2609.06011', 'title': 'Tri-PvP: Exposing Modality Bias in Omni-Modal Large Language Models through Perceptual-Propositional Evidence Conflicts', 'url': 'https://huggingface.co/papers/2609.06011', 'abstract': 'Abstract Tri-PvP benchmark reveals visual bias and asymmetric evidence-form preferences in omni-modal language models, with early-layer decodable modality effects resistant to surface mitigation.  Generated by thinkingmachines/Inkling-Small Omni-modal large language models (OLLMs) jointly process vision, audio, and text, yet their modality bias under cross-modal conflict remains underexplored. Existing
