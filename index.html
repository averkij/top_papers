pirically demonstrate consistent improvements across five KE editors, two LLM backbones, and three benchmarks.", 'score': 7, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'd2c3db06931ccbc1', 'authors': ['Ding Wu', 'Ye Zhang', 'Haoyu Wang', 'Tianci Liu'], 'affiliations': ['Georgia Institute of Technology', 'University at Albany', 'University of Pennsylvania', 'University of Tennessee'], 'pdf_title_img': 'assets/pdf/title_img/2610.02772.jpg', 'data': {'categories': ['#training', '#optimization'], 'emoji': '🎯', 'ru': {'title': 'Преодоление зависимости от контекста при редактировании знаний через фокусировку внимания', 'desc': 'Статья посвящена проблеме редактирования знаний в больших языковых моделях, когда отредактированные модели полагаются на исходный контекст и не могут вспомнить отдельные факты самостоятельно. Авторы выявили, что стандартные подходы к редактированию недооценивают сложность обучения фактам, расположенным позже в тексте, так как они получают более богатый контекст с меньшей начальной ошибкой. Решением является фреймворк FOVEATED, который создаёт сфокусированные представления каждого предложения путём случайного смещения позиционных кодировок в трансформаторе во время редактирования, а затем удаляет эти возмущения при инференсе. Экспериментальные результаты показывают стабильное улучшение производительности на пяти редакторах знаний, двух архитектурах LLM и трёх бенчмарках.'}, 'en': {'title': 'Enhancing Knowledge Editing in LLMs with FOVEATED Framework', 'desc': "This paper addresses the challenge of knowledge editing (KE) in large language models (LLMs), which struggle to retain individual facts after being edited with unstructured passages. The authors introduce a new framework called FOVEATED, which modifies the context during the editing process to help the model learn facts more effectively. By adjusting the Rotary Position Embedding (RoPE) positions, FOVEATED reduces the reliance on the original passage context, allowing for better recall of individual facts. The framework shows consistent improvements across various KE editors and benchmarks, enhancing the model's ability to retain edited knowledge without needing full retraining."}, 'zh': {'title': '知识编辑的新视角：FOVEATED框架', 'desc': '大型语言模型（LLMs）作为通用知识接口，但其参数在预训练后并不自动反映变化的信息。知识编辑（KE）提供了一种有针对性的替代方案，通过修改特定知识而保留无关知识和一般能力。传统的知识编辑使用结构化的事实三元组，而非结构化知识编辑（UKE）则使用包含多个事实的自由形式段落。我们提出了FOVEATED框架，通过随机调整前文上下文的旋转位置嵌入（RoPE）位置，来构建每个句子的聚焦视图，从而改善知识编辑的效果。'}}}, {'id': 'https://huggingface.co/papers/2610.02710', 'title': 'Self-Supervised Scaling of Terminal Environments for Scientific Domains', 'url': 'https://huggingface.co/papers/2610.02710', 'abstract': 'Abstract  Terminal agents are increasingly deployed beyond software engineering in science and other specialized domains. Constructing training environments requires executable reference behavior and a domain-specific verifier that distinguishes semantic correctness from superficially plausible artifacts. Authoring these components for each task requires repeated engineering and limits reuse. We introduce software-in-the-loop reconstruction, a self-supervised framework that obtains reference outputs and verification targets from existing software workflows, executable programs mapping structured inputs to outputs. For each workflow, we execute multiple input configurations and partition cases into public observations and hidden evaluations. Given the instruction, input schema, and public input--output observations, an agent constructs an editable program without access to the source workflow. The candidate is evaluated on hidden configurations against workflow outputs. A hierarchical verifier combines domain-specific semantic comparison, structural validity, and anti-shortcut checks, while public feedback supports iterative revision. The construction admits additional workflows and configurations without authoring a reference solution for each task. We instantiate SWR with 500 workflows and 46 software families across six domains. Across three attempts per task, Qwen3.8-Max solves 838 tasks and produces 1,422 verified trajectories, which we oversample to 3,000 reconstruction-only training examples. Supervised fine-tuning of Qwen3.8-27B improves mean Terminal-Bench 2 performance from 47.94% to 53.56% across three seeds and achieves the highest mean among four matched-token corpus controls on all four reported evaluations. These results indicate that existing scientific software can provide scalable, behaviorally verified supervision for terminal agents.', 'score': 7, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'd2409172cccdc9f5', 'authors': ['Zhongzhi Li', 'Yucheng Shi', 'Zongxia Li', 'Junyao Yang', 'Ruhan Wang', 'Yu Wang', 'Jingyuan Huang', 'Jichao Yu', 'Ninghao Liu', 'Haitao Mi', 'Leowei Liang'], 'affiliations': ['Hong Kong Polytechnic University', 'Indiana University', 'National University of Singapore', 'Tencent HY LLM Frontier', 'University of Georgia', 'University of Illinois at Chicago', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2610.02710.jpg', 'data': {'categories': ['#synthetic', '#science'], 'emoji': '🔄', 'ru': {'title': 'Автоматическое извлечение знаний из существующих программ для обучения терминальных агентов', 'desc': 'Статья описывает новый подход для обучения терминальных агентов, которые выполняют сложные задачи в науке и специализированных областях. Авторы предлагают метод software-in-the-loop reconstruction, который автоматически извлекает обучающие примеры и критерии верификации из существующих программ, минуя необходимость ручного написания эталонных решений для каждой задачи. Система использует иерархический верификатор, который проверяет не только функциональную корректность, но и структурную валидность сгенерированного кода, предотвращая обучение агента на артефактах. Экспериментальные результаты показывают значительное улучшение производительности fine-tuned моделей на бенчмарках благодаря использованию верифицированных траекторий, полученных из 500 реальных программ.'}, 'en': {'title': 'Empowering Terminal Agents with Software-in-the-Loop Reconstruction', 'desc': 'This paper presents a novel approach called software-in-the-loop reconstruction (SWR) that enhances the training of terminal agents in various domains by leveraging existing software workflows. The framework allows agents to generate reference outputs and verification targets without needing to manually create these components for each task, thus promoting reuse and efficiency. By executing multiple input configurations, the system distinguishes between public observations and hidden evaluations, enabling agents to construct editable programs based on structured inputs. The hierarchical verifier ensures the correctness of the outputs through semantic comparison and structural validity checks, leading to improved performance in task completion and verification.'}, 'zh': {'title': '软件循环重建：为终端代理提供可扩展的监督', 'desc': '本文介绍了一种名为软件循环重建（SWR）的自监督框架，旨在为终端代理构建训练环境。该框架通过现有软件工作流获取参考输出和验证目标，避免了为每个任务重复工程的需求。SWR能够在不访问源工作流的情况下，利用公共输入输出观察构建可编辑程序，并通过分层验证器进行评估。实验结果表明，SWR在多个领域的工作流中表现出色，能够为终端代理提供可扩展的、行为验证的监督。'}}}, {'id': 'https://huggingface.co/papers/2609.39394', 'title': 'Can Computation from Earlier Problems Help LLMs Solve New Ones?', 'url': 'https://huggingface.co/papers/2609.39394', 'abstract': 'Abstract  Large language models often solve independent problems in the same conversation. Can computation from earlier problems help them solve new ones? To answer this question, we first conduct preliminary experiments showing that retained history can raise or lower later-turn accuracy, even within the same domain. To understand these effects, we use controlled replay to isolate internal state changes specific to each problem-history pairing. Across different histories, these changes preserve similar relationships among current problems. To improve reasoning under retained history, we introduce STAIR (Stale-Token Attention for Inter-query Reuse). STAIR captures keys and values from earlier response generation in a fixed bank. It learns to redirect current queries when they read this bank during prompt processing. The base model remains frozen; only 12,288 parameters are trained. Across three Qwen models and four benchmarks, STAIR improves average later-turn accuracy by up to 11.67 percentage points over the unmodified model with history.', 'score': 7, 'issue_id': 3376, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '994cf5e2df8d1ed8', 'authors': ['Jipei He', 'Wenhui Tan', 'Xiaoyi Yu', 'Enver Sangineto', 'Fiorenzo Parascandolo', 'Rita Cucchiara', 'Ruihua Song'], 'affiliations': ['Gaoling School of Artificial Intelligence, Renmin University of China, Beijing, China', 'University of Modena and Reggio Emilia, Italy'], 'pdf_title_img': 'assets/pdf/title_img/2609.39394.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Переиспользование вычислений в контексте языковой модели через адаптивное внимание', 'desc': 'В статье исследуется вопрос о том, может ли языковая модель переиспользовать вычисления из предыдущих задач в одном диалоге для решения новых задач. Авторы показывают, что сохранённая история может как улучшить, так и ухудшить точность на последующих шагах, даже в одной предметной области. Для понимания этих эффектов они применяют контролируемую переигровку, чтобы выделить изменения внутреннего состояния модели для каждой пары задача-история. Авторы предлагают метод STAIR, который сохраняет ключи и значения из предыдущих ответов в фиксированное хранилище и переобучает только 12 288 параметров, достигая улучшения точности на 11.67 процентных пункта.'}, 'en': {'title': 'Enhancing Language Model Accuracy with Memory Retention', 'desc': 'This paper investigates how large language models can leverage information from previous problems in a conversation to improve their performance on new tasks. The authors conduct experiments that show that retaining history can either enhance or hinder accuracy in subsequent turns. They introduce a novel mechanism called STAIR (Stale-Token Attention for Inter-query Reuse), which allows the model to utilize past responses effectively by storing and referencing key information. By training only a small number of parameters, STAIR significantly boosts the accuracy of the model in later turns, demonstrating the potential benefits of memory in conversational AI.'}, 'zh': {'title': '利用历史信息提升语言模型推理能力', 'desc': '这篇论文探讨了大型语言模型在对话中如何利用之前问题的计算结果来解决新的问题。研究表明，保留的历史信息可以提高或降低后续问题的准确性。为了解这些影响，作者使用了控制重放的方法，分析了不同问题与历史之间的内部状态变化。论文还提出了一种新的方法STAIR，通过固定的键值库来改善推理能力，从而提高了模型在后续问题上的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.32182', 'title': 'KeyRec: Bounded Visual Memory for Streaming and Long-Video Understanding', 'url': 'https://huggingface.co/papers/2609.32182', 'abstract': 'Abstract  Vision-language models are increasingly used to understand long videos and continuous streams. However, dense visual tokens accumulate with video duration, making long-context inference prohibitively expensive. Existing training-free visual-token selection methods reduce this cost by retaining informative tokens, but may lose coherent event evidence and fail to distinguish detailed recent observations from long-range history. We propose KeyRec, a training-free framework for constructing bounded visual memory. During query-agnostic writing, KeyRec preserves fine-grained recent observations in a visual cache and organizes historical evidence into a structured event bank. Candidate events are proposed according to their novelty relative to previously stored events and maintained through an online add--merge--evict update. When a question arrives, a text-only router adaptively allocates a fixed readout budget between recent and event memory, without reprocessing historical frames. KeyRec operates on model-facing visual embeddings and supports both modular encoder--projector VLMs and the encoder- and projector-free NEO-ov architecture. Across four streaming and long-video benchmarks and three VLM backbones, KeyRec achieves the best compressed performance in 13 of 15 settings using only 10\\% of the dense decoder-facing visual-token budget. It outperforms the strongest compressed baseline by 2.21--18.37 points on real-time questions, achieves the best compressed result in five of six long-video settings, and performs best in every NEO-ov 2B setting.', 'score': 6, 'issue_id': 3376, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '5f98d85d0745f981', 'authors': ['Zihan Chen', 'Xuejian Rong', 'Xiaojuan Wang', 'Boqing Gong', 'Adi Zicher', 'Yael Pritch', 'Nikhil Karnad'], 'affiliations': ['Google', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2609.32182.jpg', 'data': {'categories': ['#multimodal', '#video', '#inference', '#long_context'], 'emoji': '🎬', 'ru': {'title': 'Умная память для эффективного понимания длинных видео', 'desc': 'В работе предлагается KeyRec — фреймворк для эффективной обработки длинных видео в vision-language моделях. Метод использует обучение-свободный подход к отбору визуальных токенов, создавая ограниченную визуальную память, которая сохраняет недавние детальные наблюдения и организует исторические события в структурированный банк событий. Текстовый маршрутизатор адаптивно распределяет бюджет чтения между памятью недавних кадров и памятью событий без переобработки исторических фреймов. KeyRec достигает высокой точности, используя только 10% визуальных токенов, и превосходит существующие методы сжатия на нескольких бенчмарках для потоковых и длинных видео.'}, 'en': {'title': 'KeyRec: Efficient Visual Memory for Long Video Understanding', 'desc': 'The paper introduces KeyRec, a novel framework designed to enhance the efficiency of vision-language models when processing long videos. It addresses the challenge of managing dense visual tokens by creating a bounded visual memory that retains important recent observations while organizing historical data into an event bank. KeyRec employs a query-agnostic writing mechanism and an adaptive routing system to optimize the retrieval of relevant information without the need for reprocessing past frames. The results demonstrate that KeyRec significantly improves performance on various benchmarks while using only a fraction of the visual-token budget, outperforming existing methods.'}, 'zh': {'title': 'KeyRec：高效的视觉记忆框架', 'desc': '本文提出了一种名为KeyRec的框架，用于构建有限的视觉记忆，以应对长视频和连续流的理解问题。KeyRec通过在视觉缓存中保留细粒度的近期观察，并将历史证据组织成结构化的事件库，从而减少了长时间上下文推理的成本。该方法在查询无关的写入过程中，能够根据新颖性提出候选事件，并通过在线的添加-合并-驱逐更新来维护这些事件。当问题到达时，KeyRec能够自适应地在近期记忆和事件记忆之间分配固定的读取预算，而无需重新处理历史帧。'}}}, {'id': 'https://huggingface.co/papers/2609.38325', 'title': 'Strike a Chord! Modal Kinetic Typography', 'url': 'https://huggingface.co/papers/2609.38325', 'abstract': "Abstract  We introduce modal kinetic typography, which animates a vector glyph to express a semantic concept while keeping it legible. Our key idea is to build motion from the glyph's natural vibration modes. Specifically, a finite-element eigenproblem assembled from the vector outline yields the glyph's softest modes, for the whole letter and for each of its parts, allowing it to bend. The problem's zero-energy solutions, i.e., rigid translations and rotations, are applied in closed form to each part, allowing parts to also move as blocks. To animate the glyph, a frozen video diffusion model supervises only the modes' amplitudes and phases. Our modal approach addresses two weaknesses of prior work. Free-form point optimization under video score distillation (SDS) moves each point and frame independently along noisy gradients, tearing the outline and causing jitter. In contrast, our modes are smooth along the outline and driven by a few whole-cycle harmonics, which restricts these gradients to smooth, seamlessly looping motion. On the other hand, structured alternatives rely on skeletons or keypoints from category-specific priors, whereas our modes come from the glyph itself; the only prior is a list naming each letter's moving parts, generated once for the whole alphabet by a language model. In modal kinetic typography, shape and motion are disentangled by construction: a single base outline is sculpted toward the concept, and the modal drive cannot alter it, so a letter can also be animated without being reshaped. Our method produces more articulated and smoother motion than Dynamic Typography and AniClipart at comparable or better concept alignment, with less glyph tearing than Dynamic Typography, and is preferred by human raters, including in a frozen-shape setting where motion alone must carry the concept. Our results were also preferred over Astra (GPT-6) by human raters.", 'score': 6, 'issue_id': 3376, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '14c5dec893822674', 'authors': ['Maham Tanveer', 'Jiyeon Han', 'Nanxuan Zhao', 'Hao Zhang'], 'affiliations': ['Adobe', 'Simon Fraser University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38325.jpg', 'data': {'categories': ['#multimodal', '#video', '#diffusion'], 'emoji': '✨', 'ru': {'title': 'Модальная анимация букв через естественные колебания формы', 'desc': 'Авторы предлагают метод модальной кинетической типографии, который анимирует векторные глифы (буквы) для выражения смысловых концепций, сохраняя их разборчивость. Ключевая идея заключается в использовании естественных колебательных мод символа, полученных путём решения задачи на собственные значения конечных элементов векторного контура. Для управления анимацией применяется замороженная видеомодель диффузии, которая контролирует амплитуды и фазы мод, что обеспечивает гладкие и непрерывные движения без разрывов контура. Метод превосходит существующие подходы благодаря разделению формы и движения, отсутствию необходимости в категорийных приорах и предпочтению человеческими оценщиками.'}, 'en': {'title': 'Animating Letters with Meaningful Motion', 'desc': "This paper presents a new technique called modal kinetic typography, which animates letters in a way that conveys meaning while maintaining readability. The method uses the natural vibration modes of a letter's shape to create smooth and coherent motion, avoiding the jitter and tearing seen in previous approaches. By solving a finite-element eigenproblem, the authors derive the softest modes of the glyph, allowing for fluid animations that are driven by harmonics rather than random movements. This approach not only enhances the visual quality of the animations but also ensures that the shape of the letters remains intact, leading to better concept alignment and preference among viewers."}, 'zh': {'title': '模态动效排版：流畅与可读性的完美结合', 'desc': '本文介绍了一种新的动态排版方法，称为模态动效排版，它通过动画化矢量字形来表达语义概念，同时保持可读性。我们的方法基于字形的自然振动模式，利用有限元特征问题来获取字形的柔软模式，使其能够弯曲。与以往的工作相比，我们的方法避免了噪声梯度导致的轮廓撕裂和抖动，确保了运动的平滑性和连贯性。最终，我们的方法在概念对齐方面表现优越，产生了更流畅的运动效果，且在静态形状设置中也能有效传达概念。'}}}, {'id': 'https://huggingface.co/papers/2609.32759', 'title': 'The Extender: A Log-Structured Transformer', 'url': 'https://huggingface.co/papers/2609.32759', 'abstract': "Abstract  We introduce the Extender, a log-structured variant of the standard Transformer architecture. In a standard Transformer, each layer communicates with subsequent layers exclusively via the residual h, a superposition channel. The Extender adds a concatenation channel x: each layer ell emits both a residual update δ_ell which is added to h, and a much smaller extension ε_ell which is appended to x. While both the FFN and q see h, the attention kv projections take only x as input. As a result, the fully extended x contains the complete input for the kv projections of all layers, reducing the persistent attention memory footprint from 2Ld_{model} to sum|ε_ell|. We find that with |ε_ell|=32, the Extender matches Transformer accuracy on short-context (CORE) tasks at 199M-924M parameters, and exceeds Transformer accuracy on long-context (RULER) workloads, again at 924M parameters. For our 1664-wide, 924M model, the Extender's persistent attention memory footprint is 104times smaller than MHA. The memory savings grow with model width.", 'score': 5, 'issue_id': 3376, 'pub_date': '2026-09-26', 'pub_date_card': {'ru': '26 сентября', 'en': 'September 26', 'zh': '9月26日'}, 'hash': '7ef360a3d4fa5db4', 'authors': ['Jakob Eriksson'], 'affiliations': ['University of Illinois Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2609.32759.jpg', 'data': {'categories': [], 'emoji': '⚙️', 'ru': {'title': 'Расширяемый Трансформер: память вместо суперпозиции', 'desc': 'В статье представляется Extender — модификация архитектуры Transformer, которая использует логарифмическую структуру для оптимизации памяти. Ключевая идея заключается в добавлении канала конкатенации к стандартному каналу residual: каждый слой выдает как остаточное обновление, так и небольшое расширение, которое добавляется к входным данным. Механизм внимания использует только расширенные входные данные для вычисления ключей и значений, что значительно снижает требования к памяти. На практике Extender достигает эквивалентной точности на коротких контекстах и превосходит стандартный Transformer на длинных контекстах, при этом сокращая потребление памяти в 104 раза для моделей с параметрами до 924M.'}, 'en': {'title': 'Extender: Transforming Memory Efficiency in Transformers', 'desc': 'The paper presents the Extender, a new version of the Transformer architecture that uses a log-structured approach. Unlike standard Transformers that rely solely on a residual connection for layer communication, the Extender introduces an additional concatenation channel. This allows each layer to send both a residual update and a smaller extension, which helps reduce the memory needed for attention mechanisms. The results show that the Extender achieves comparable accuracy to traditional Transformers on short-context tasks and outperforms them on long-context tasks while significantly lowering memory usage.'}, 'zh': {'title': 'Extender：高效的Transformer变体', 'desc': '本文介绍了一种名为Extender的变体，它是标准Transformer架构的日志结构版本。在标准Transformer中，每一层通过残差h进行通信，而Extender则增加了一个连接通道x，使得每一层不仅输出残差更新δ_ell，还输出一个较小的扩展ε_ell。通过这种方式，所有层的kv投影仅使用x作为输入，从而显著减少了持久注意力的内存占用。实验表明，Extender在短上下文任务中与标准Transformer的准确率相当，而在长上下文任务中则表现更佳，且内存占用显著降低。'}}}, {'id': 'https://huggingface.co/papers/2610.00722', 'title': 'JEPA-TTT: Persistent Test-Time Training of Latent World Models for Planning under Dynamics Shifts', 'url': 'https://huggingface.co/papers/2610.00722', 'abstract': 'Abstract  World models enable agents to plan by predicting future states of the environment, but their predictions can become unreliable when test-time dynamics differ from those seen during training. We present JEPA-TTT, which adapts the latent dynamics predictor of a pretrained action-conditioned Joint-Embedding Predictive Architecture world model throughout test time. Self-supervised updates accumulate across episodes, while the visual encoder and reward head remain fixed, preserving the pretrained representation and task objective. Planning requires neither a goal image nor online environment reward. JEPA-TTT uses dense replay, which forms prediction windows at every temporal offset, retains them in a growing buffer, and samples minibatches from that buffer for predictor updates. Across eight dynamics shifts in four continuous-control environments, JEPA-TTT improves planning on every shift. After 500 test-time episodes, it reduces autoregressive latent prediction error by 83% on average and improves planning performance by 153% over the frozen JEPA world model. These results show that persistent self-supervised test-time training can adapt a pretrained latent world model under changed dynamics.', 'score': 2, 'issue_id': 3376, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'b2f5218025f6e051', 'authors': ['Zheyuan Zhang', 'Suyu Ye', 'Nakul Agarwal', 'Hossein Nourkhiz Mahjoub', 'Ehsan Moradi Pari', 'Daniel Khashabi', 'Tianmin Shu', 'Vaishnav Tadiparthi'], 'affiliations': ['Honda Research Institute USA', 'Johns Hopkins University'], 'pdf_title_img': 'assets/pdf/title_img/2610.00722.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Адаптация модели мира к новой динамике через тестовое переобучение', 'desc': 'Статья описывает JEPA-TTT — метод адаптации предобученной модели мира на основе Joint-Embedding Predictive Architecture во время тестирования. Система использует самоконтролируемое обучение для обновления предсказателя латентной динамики на протяжении нескольких эпизодов, при этом визуальный энкодер и функция вознаграждения остаются неизменными. Для обновления модели применяется техника плотного воспроизведения, которая создает окна предсказаний с разными временными смещениями и сохраняет их в буфере. Экспериментальные результаты показывают, что постоянное самоконтролируемое обучение на тесте позволяет успешно адаптировать предобученную модель мира к изменённой динамике окружения.'}, 'en': {'title': 'Adapting World Models for Dynamic Environments with JEPA-TTT', 'desc': "This paper introduces JEPA-TTT, a method that enhances world models for agents by allowing them to adapt their predictions during test time. It focuses on improving the latent dynamics predictor of a pretrained model, enabling it to adjust to new environmental changes without altering the visual encoder or reward system. The approach employs self-supervised learning to continuously update the model's predictions across episodes, using a technique called dense replay to maintain a buffer of past experiences. The results demonstrate significant improvements in planning performance and prediction accuracy, showcasing the effectiveness of adapting pretrained models to dynamic environments."}, 'zh': {'title': '自监督训练提升动态适应能力', 'desc': '世界模型使得智能体能够通过预测环境的未来状态进行规划，但当测试时的动态与训练时不同，预测可能会变得不可靠。我们提出了JEPA-TTT，它在测试期间适应预训练的动作条件下的联合嵌入预测架构的潜在动态预测器。自监督更新在多个回合中累积，同时视觉编码器和奖励头保持固定，从而保留预训练的表示和任务目标。JEPA-TTT在四个连续控制环境中的八种动态变化中改善了规划性能，显示出持久的自监督测试时训练能够在变化的动态下适应预训练的潜在世界模型。'}}}, {'id': 'https://huggingface.co/papers/2610.04116', 'title': 'CUAWright: A Minimal Unified Interface for Digital Agents', 'url': 'https://huggingface.co/papers/2610.04116', 'abstract': "Abstract  The prevailing approach to computer-use agents couples a model with a domain-specific harness: a browser or desktop environment equipped with human engineered tools that are fixed before task execution. As models' coding capabilities improve, the GUI native and static harness prevents them from direct programmatic operation on system state, as well as flexible construction of tools. To this end, we introduce CUAWright, a minimal terminal harness of roughly 3K lines of code that uses bash commands as its sole action interface, and a file system as its evolvable space for dynamically creating tools and managing the context. We conduct comprehensive experiments across a wide range of digital tasks, and demonstrate that by giving the agent a minimal, programmable interface, it achieves substantially stronger results compared to their GUI or hybrid CLI interface across a wide range of tasks. On OSWorld 2.0, CUAWright delivers a 33.2% relative improvement in partial reward while reducing estimated cost by 37.5% compared with the published GPT-5.5 baseline. On Online-Mind2Web and the long horizon Odysseys benchmark, CUAWright substantially outperforms GUI native harness by 4.7% and 44.0% in success rate, respectively. Furthermore, we found the gains extend to CAD applications that require accurate visual understanding and CLI interaction: on CADGenBench and BenchCAD, our unified harness yields 8.1%-41.6% relative improvements over other CLI based harnesses with GPT-5.5. Together, these results suggest digital environments are far more programmable than their GUI interfaces imply, and a minimal terminal-focused harness is the key for better performance and efficiency.", 'score': 1, 'issue_id': 3376, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '9d45fd13543b0c2f', 'authors': ['Yadong Lu', 'Theodore Lee', 'Yifei Li', 'Lawrence Keunho Jang', 'Tianci Xue', 'Yu Su', 'Huan Sun', 'Ahmed Hassan Awadallah'], 'affiliations': ['Carnegie Mellon University', 'Microsoft Research', 'National University of Singapore', 'The Ohio State University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04116.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '⌨️', 'ru': {'title': 'Терминальная среда вместо графического интерфейса для агентов AI', 'desc': 'Статья представляет CUAWright — минималистичный интерфейс для агентов на основе LLM, использующий bash-команды вместо графического интерфейса. Авторы показывают, что программируемая терминальная среда позволяет моделям более эффективно работать с цифровыми задачами благодаря динамическому созданию инструментов и управлению контекстом через файловую систему. Экспериментальные результаты демонстрируют значительные улучшения: на бенчмарке OSWorld 2.0 достигнута 33,2% относительная улучшение награды при снижении затрат на 37,5%. Исследование подтверждает, что минималистичный терминальный интерфейс превосходит GUI-подходы по производительности и вычислительной эффективности для широкого спектра задач.'}, 'en': {'title': 'Unlocking Performance with a Minimal Terminal Harness', 'desc': 'This paper presents CUAWright, a minimal terminal harness designed for computer-use agents that allows them to interact with the system using bash commands. Unlike traditional GUI interfaces, CUAWright enables dynamic tool creation and better management of context, leading to improved performance in various digital tasks. The experiments show that CUAWright significantly outperforms existing GUI and hybrid interfaces, achieving higher success rates and lower costs in benchmarks. The findings suggest that a programmable, terminal-based approach can enhance the capabilities of machine learning models in complex environments.'}, 'zh': {'title': '最小终端工具，提升数字任务性能的关键', 'desc': '本论文介绍了一种名为CUAWright的最小终端工具，它使用bash命令作为唯一的操作接口，允许模型在系统状态上进行直接编程操作。与传统的图形用户界面（GUI）相比，CUAWright提供了一个可动态创建工具和管理上下文的灵活空间。实验结果表明，CUAWright在多种数字任务中表现优异，相较于现有的GUI或混合命令行接口，取得了显著的性能提升。研究表明，数字环境的可编程性远超图形界面所暗示的，最小化的终端工具是提高性能和效率的关键。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (3)', '#agents (11)', '#agi', '#alignment (1)', '#architecture (13)', '#audio (2)', '#benchmark (19)', '#cv (4)', '#data (1)', '#dataset (9)', '#diffusion (3)', '#ethics', '#games (1)', '#graphs', '#hallucinations (1)', '#healthcare (2)', '#inference (4)', '#interpretability (3)', '#leakage (1)', '#long_context (4)', '#low_resource (2)', '#machine_translation', '#math (3)', '#multilingual (2)', '#multimodal (16)', '#open_source (5)', '#optimization (12)', '#plp (1)', '#rag (3)', '#reasoning (7)', '#rl (2)', '#rlhf (3)', '#robotics (9)', '#science (6)', '#security (1)', '#small_models (4)', '#story_generation', '#survey (1)', '#synthetic (2)', '#training (24)', '#transfer_learning (4)', '#video (16)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-06 01:09',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-06 01:09')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-06 01:09')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
