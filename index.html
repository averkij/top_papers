ting interface that lets users place spatial marks and optional short notes directly on the image. Together, these annotations form a canvas instruction that specifies where to edit and what to change. Our editor, VibeEdit, follows these instructions to perform object addition, removal, replacement, attribute modification, and movement without a separate text prompt. We construct 1.55 million source-target edit pairs with object masks and structured edit descriptions, from which we render canvas instructions during training. We adapt Qwen-Image-Edit with layer-decoupled conditioning that separately encodes source images and canvas instructions for image editing. We train the model with region-weighted supervised fine-tuning, followed by rubric-guided reinforcement learning to improve edit completion, local edit quality, and preservation of unedited regions. We evaluate VibeEdit on an independently constructed, human-curated benchmark of 419 cases emphasizing target selection among similar objects. VibeEdit achieves a VLM rubric score of 79.9 and an outside-region PSNR of 32.8 dB, compared with 67.4 and 24.0 dB for FireRed, the highest-scoring text-instructed baseline in our evaluation.', 'score': 9, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'af77c4e85a4ff954', 'authors': ['Jinjing Zhao', 'Fangyun Wei', 'Yitong Wang', 'Xiuyu Wu', 'Yunuo Chen', 'Yang Yue', 'Sirui Zhang', 'Wenbo Wang', 'Hongyang Zhang', 'Dong Chen', 'Yan Lu', 'Chang Xu'], 'affiliations': ['Fudan University', 'Microsoft Research', 'Nankai University', 'Shanghai Jiao Tong University', 'Tsinghua University', 'University of Science and Technology of China', 'University of Sydney', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2610.12229.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#training', '#rlhf', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Пространственное редактирование изображений через визуальные аннотации вместо текстовых запросов', 'desc': 'В статье представлена новая система VibeEdit для редактирования изображений на основе текстовых инструкций, которая решает проблему выделения нужного объекта среди похожих альтернативных вариантов. Вместо использования только текстовых описаний, система позволяет пользователям размещать пространственные отметки и короткие заметки прямо на изображении, формируя инструкции холста для редактирования. Модель построена на базе Qwen-Image-Edit с использованием разделённого кондиционирования слоёв и обучается на наборе из 1,55 миллиона пар источник-цель с применением взвешенной задачи и обучением с подкреплением. Экспериментальные результаты показывают, что VibeEdit значительно превосходит текстовые методы редактирования по качеству локального редактирования и сохранению неизменённых областей.'}, 'en': {'title': 'Edit Images Easily with VibeEdit!', 'desc': 'This paper presents VibeEdit, a novel image editing tool that allows users to specify edits by placing spatial marks and writing short notes directly on images. This approach simplifies the editing process by eliminating the need for complex text prompts, making it easier to identify and modify similar objects. VibeEdit is trained on a large dataset of 1.55 million image pairs with detailed edit instructions, enabling it to perform various editing tasks like object addition and removal. The model uses advanced techniques like layer-decoupled conditioning and reinforcement learning to enhance the quality of edits while preserving unedited areas of the image.'}, 'zh': {'title': '直观图像编辑，轻松标记与修改', 'desc': '在文本引导的图像编辑中，描述所需的更改通常很简单，但识别目标对象或区域可能很麻烦，尤其是当多个对象相似时。我们提出了一种新的图像编辑界面，允许用户直接在图像上放置空间标记和可选的简短注释。这些注释共同形成一个画布指令，指定了编辑的位置和内容。我们的编辑器VibeEdit根据这些指令执行对象的添加、删除、替换、属性修改和移动，而无需单独的文本提示。'}}}, {'id': 'https://huggingface.co/papers/2610.12458', 'title': 'OmniCapBench: A Deep-Structured Evaluation Framework for Fine-Grained Audio-Visual Captioning', 'url': 'https://huggingface.co/papers/2610.12458', 'abstract': 'Abstract  Multimodal large language models (MLLMs) are rapidly evolving toward continuous audio--visual reasoning, creating an urgent need for evaluations that expose their capability limits. Audio--visual captioning is an ideal diagnostic task, yet current benchmarks face a coupled trade-off: whole-caption scores provide coverage without localization, local probes provide localization without coverage, and unconstrained LLM judges introduce instability. We introduce OmniCapBench (Omni-Video Caption Benchmark), a benchmark that reframes audio--visual caption evaluation as a deep-structured diagnostic framework. OmniCapBench shifts the prediction target from free-form text to sets of atomic, verifiable evaluation units across three tracks: entity references, visual shots, and audio events, enabling reliable scoring with deterministic constraint checks and localized LLM-based semantic comparisons. With 786 densely annotated videos, OmniCapBench effectively distinguishes MLLM perception errors, including temporal grounding failures, identity drift, cross-modal misalignment, and hallucinated descriptions. Evaluating frontier MLLMs reveals strong local perception but weak long-horizon audio--visual reasoning, particularly in identity drift and cross-modal misalignment, providing a fine-grained roadmap for omnimodal development.', 'score': 8, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8f4d9e1ea77b3c86', 'authors': ['Zhongyu Yang', 'Jiale Tao', 'Ruitao Chen', 'Zuhao Yang', 'Yingfang Yuan', 'Xueliang Zhao', 'Auden', 'Kai Wang', 'Shuai Shao', 'Biao Wang', 'Steve Yves', 'Qinglin Lu'], 'affiliations': ['Hunyuan, Tencent', 'Nanyang Technological University', 'Northumbria University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12458.jpg', 'data': {'categories': ['#reasoning', '#multimodal', '#video', '#audio', '#hallucinations', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Структурированная диагностика мультимодальных моделей через детальные атомарные единицы оценки', 'desc': 'Работа представляет OmniCapBench — новый бенчмарк для оценки мультимодальных больших языковых моделей, которые работают с аудио и видео одновременно. Вместо оценки полных текстовых описаний, подход переформулирует задачу в набор атомарных, проверяемых единиц оценки: ссылки на объекты, видеокадры и аудиособытия. Такая детальная структурированная диагностика позволяет надёжно выявить ошибки восприятия моделей, включая неудачи в определении временных границ, искажение идентичности объектов и рассогласование между модальностями. Оценка передовых мультимодальных моделей показала, что они хорошо воспринимают локальную информацию, но плохо справляются с долгосрочным аудиовизуальным рассуждением.'}, 'en': {'title': 'OmniCapBench: A New Standard for Evaluating Audio-Visual Reasoning in MLLMs', 'desc': 'This paper introduces OmniCapBench, a new benchmark designed to evaluate multimodal large language models (MLLMs) in audio-visual captioning tasks. It addresses the limitations of existing benchmarks by focusing on specific, verifiable evaluation units rather than free-form text, which allows for more reliable scoring. The framework includes three evaluation tracks: entity references, visual shots, and audio events, which help identify specific errors in MLLM performance. The findings indicate that while MLLMs perform well in local perception tasks, they struggle with long-term audio-visual reasoning, highlighting areas for improvement in model development.'}, 'zh': {'title': '全景视频字幕基准：提升多模态理解能力', 'desc': '多模态大型语言模型（MLLMs）正在快速发展，特别是在音频和视觉推理方面，因此需要评估其能力的极限。音频-视觉字幕生成是一个理想的诊断任务，但现有基准面临权衡：整体字幕评分提供覆盖但缺乏定位，局部探测提供定位但缺乏覆盖，而不受限制的LLM评估引入不稳定性。我们提出了OmniCapBench（全景视频字幕基准），将音频-视觉字幕评估重新构建为一个深度结构化的诊断框架，能够通过确定性约束检查和基于LLM的语义比较进行可靠评分。通过786个密集注释的视频，OmniCapBench有效区分了MLLM的感知错误，提供了多模态发展的细致路线图。'}}}, {'id': 'https://huggingface.co/papers/2610.12403', 'title': 'ViSkill: Reinforcing VLM Agents with Evolving Visual-Native Skills', 'url': 'https://huggingface.co/papers/2610.12403', 'abstract': 'Abstract  Skill-augmented agents improve sample efficiency by distilling successful trajectories into reusable strategies. Yet most existing approaches remain text-centric, linearizing spatial layouts and action-state correspondences into language that loses critical geometric structure. Recent efforts have begun incorporating visual evidence, but construct and update skills separately from policy optimization, leaving their mutual improvement underexplored. We propose ViSkill, a visual-native skill learning framework that encodes successful interactions as composite visual skill cards directly accessible to VLM agents. Retrieved skills guide both inference and reward shaping, while successful trajectories are distilled back into the library, forming a closed feedback loop in which skill accumulation and policy improvement reinforce each other. An optional cold-start mechanism further accelerates early-stage learning. Evaluated on Sokoban, FrozenLake, and PrimitiveSkill, ViSkill achieves an overall success rate of 0.89, rising to 0.91 with cold-start initialization, outperforming all evaluated proprietary and open-source baselines while converging faster than standard PPO. Our code is available at https://github.com/ZJU-REAL/ViSkill.', 'score': 8, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '429777eca9956a53', 'authors': ['Hongxing Li', 'Dingming Li', 'Yixin Li', 'Yong Du', 'Wenqi Zhang', 'Weiming Lu', 'Jun Xiao', 'Yueting Zhuang', 'Yongliang Shen'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12403.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': 'Визуальные навыки для быстрого обучения агентов', 'desc': 'Авторы предлагают ViSkill — фреймворк для обучения агентов, который кодирует успешные взаимодействия как визуальные карточки навыков, доступные для VLM агентов, вместо текстовых представлений, теряющих геометрическую информацию. Извлеченные навыки направляют как процесс вывода, так и формирование награды, а успешные траектории дистиллируются обратно в библиотеку навыков, создавая замкнутый цикл обратной связи. Этот подход позволяет аккумуляции навыков и улучшению политики взаимно усиливать друг друга, достигая более высокой выборочной эффективности. ViSkill достигает коэффициента успеха 0.91 с холодным стартом и превосходит базовые модели, сходясь быстрее, чем стандартный PPO.'}, 'en': {'title': 'Visual Skills for Smarter Learning in Agents', 'desc': "The paper introduces ViSkill, a framework designed to enhance the learning efficiency of agents by integrating visual skills directly into their decision-making processes. Unlike traditional methods that rely heavily on text and lose important spatial information, ViSkill uses visual representations to create skill cards that agents can access during their tasks. This approach allows for a feedback loop where the skills learned from successful actions improve both the agent's policy and the skills themselves. The framework has been tested on various environments, showing superior performance and faster convergence compared to existing methods."}, 'zh': {'title': 'ViSkill：视觉驱动的技能学习新框架', 'desc': '本论文提出了一种名为ViSkill的视觉原生技能学习框架，旨在提高样本效率。该框架通过将成功的交互编码为复合视觉技能卡，直接为视觉语言模型（VLM）代理提供可重用的策略。ViSkill通过检索技能来指导推理和奖励塑造，同时将成功的轨迹反馈到技能库中，形成一个技能积累与策略改进相互强化的闭环。经过在Sokoban、FrozenLake和PrimitiveSkill上的评估，ViSkill的整体成功率达到了0.89，冷启动初始化后提升至0.91，超越了所有评估的基线方法，并且收敛速度快于标准的PPO。'}}}, {'id': 'https://huggingface.co/papers/2609.35433', 'title': 'ReSPO: Reshaped Sequence Policy Optimization for Gradient Starvation in Off-Policy Learning', 'url': 'https://huggingface.co/papers/2609.35433', 'abstract': 'Abstract  Reinforcement learning from verifiable rewards (RLVR) frequently reuses rollouts across multiple policy updates, increasing the mismatch between the current policy and the data-generating policy. We identify a sign-dependent gradient starvation problem in clipped policy optimization: clipping suppresses under-generated positive responses at the low-importance-weight tail while permitting severely over-generated negative responses to dominate the high-weight tail. To address this, we propose ReSPO (Reshaped Sequence Policy Optimization), which replaces clipping with a smooth, two-branch sequence-level kernel derived from an α-divergence variational objective and an exponential variance-control tilt. The positive branch preserves a nonzero gradient weight for under-generated positive responses, while the negative branch suppresses heavily over-generated negative responses. We demonstrate that ReSPO effectively learns from long positive reasoning trajectories during early training, even when accumulated policy drift relegates them to the low-importance-weight tail. On dense and MoE Qwen3 models, ReSPO accelerates early optimization, improves final training scores, and achieves higher held-out benchmark performance under a rollout reuse, validating our approach on importance-weight tail control in off-policy learning.', 'score': 7, 'issue_id': 3389, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': '5fc46b16213c310c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#rl'], 'emoji': '⚖️', 'ru': {'title': 'Переиспользование траекторий без потери градиентов', 'desc': 'В статье рассматривается проблема переобучения с подтверждаемыми наградами, когда одни и те же траектории переиспользуются при обновлении политики, создавая несоответствие между текущей и генерирующей данные политиками. Авторы выявляют проблему асимметричного затухания градиентов в обрезанной оптимизации политики: обрезание подавляет позитивные отклики с низким весом важности, позволяя негативным откликам с высоким весом доминировать. Для решения этой проблемы предложен метод ReSPO, который заменяет обрезание гладким двухветвевым ядром последовательности, выведенным из вариационной целевой функции α-дивергенции и экспоненциального контроля дисперсии. Экспериментальные результаты на моделях Qwen3 показывают, что ReSPO улучшает обучение на длинных позитивных траекториях и повышает производительность на тестовых наборах при переиспользовании развёрток.'}, 'en': {'title': 'ReSPO: Optimizing Reinforcement Learning with Balanced Gradient Control', 'desc': 'This paper addresses a challenge in reinforcement learning where reusing data from previous policy updates can lead to a mismatch between the current and data-generating policies. The authors identify a problem called gradient starvation, which occurs when clipping in policy optimization suppresses important positive responses while allowing negative responses to dominate. To solve this, they introduce a new method called ReSPO, which uses a smooth two-branch kernel to better manage the gradients of positive and negative responses. Their experiments show that ReSPO enhances early training performance and overall model effectiveness in off-policy learning scenarios.'}, 'zh': {'title': '重塑策略优化：解决梯度饥饿问题', 'desc': '本文探讨了在可验证奖励的强化学习中，如何解决策略优化中的梯度饥饿问题。我们提出了一种新的方法，称为ReSPO（重塑序列策略优化），通过使用平滑的双分支序列级内核来替代传统的剪切方法。该方法能够有效地保留低重要性权重尾部的正响应梯度，同时抑制高权重尾部的负响应过生成现象。实验结果表明，ReSPO在早期训练中能够加速优化，提高最终训练得分，并在离线学习中实现更好的基准性能。'}}}, {'id': 'https://huggingface.co/papers/2609.39068', 'title': 'SparseEngine: Sparse-First Inference Engine', 'url': 'https://huggingface.co/papers/2609.39068', 'abstract': 'Abstract  Long-context LLM agents accumulate interaction histories that strain KV-cache memory and attention computation. Although sparse attention reduces these costs, heterogeneous cache representations and workflows hinder integration with existing inference engines, while prior sparse-serving abstractions support only specific layouts or workflows. We present SparseEngine, a ground-up, sparse-first inference engine whose shared lifecycle contract lets each method control its KV representation and computation while coordinating state transitions with common serving infrastructure. SparseEngine supports 15 methods across four categories and enables cross-request state management through Chain Cache, which resumes KV-eviction methods from retained history, and controllable Prefix-Cache Pruning, which removes KV from selected history regions while preserving logical-prefix matching. While maintaining method quality, SparseEngine delivers over 10x higher throughput with KV eviction, over 2.5x faster decoding at matched concurrency than vLLM, and over 2x end-to-end speedup on agent benchmarks. The code is available at https://github.com/CURRENTF/SparseEngine.', 'score': 7, 'issue_id': 3389, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'e6203596eb64b1ac', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#long_context', '#agents', '#optimization', '#open_source', '#inference', '#benchmark'], 'emoji': '⚡', 'ru': {'title': 'Разреженный вывод LLM агентов с адаптивным управлением кешем', 'desc': 'В статье представлен SparseEngine — инновационный движок вывода для больших языковых моделей, который решает проблему избыточного использования памяти KV-кеша при работе с длинными контекстами. Система поддерживает 15 различных методов разреженного внимания (sparse attention) и позволяет каждому методу контролировать собственное представление KV-пар и вычисления. Авторы вводят Chain Cache для управления состоянием вытеснения KV между запросами и Prefix-Cache Pruning для селективного удаления кеша из выбранных регионов истории. Решение обеспечивает десятикратное увеличение пропускной способности и двукратное ускорение на задачах с агентами по сравнению с существующими системами.'}, 'en': {'title': 'Boosting LLM Efficiency with SparseEngine', 'desc': 'This paper introduces SparseEngine, a new inference engine designed to improve the efficiency of long-context language model (LLM) agents. It addresses the challenges of memory and computation costs associated with interaction histories by implementing a sparse attention mechanism. SparseEngine allows for flexible management of key-value (KV) representations and state transitions, supporting multiple methods and enhancing performance. The results show significant improvements in throughput and decoding speed, making it a powerful tool for optimizing LLM interactions.'}, 'zh': {'title': 'SparseEngine：提升长上下文模型的推理效率', 'desc': '本文介绍了一种名为SparseEngine的稀疏优先推理引擎，旨在解决长上下文大语言模型（LLM）在交互历史累积时对KV缓存内存和注意力计算的压力。SparseEngine通过共享生命周期契约，使每种方法能够控制其KV表示和计算，同时与通用服务基础设施协调状态转换。该引擎支持15种方法，能够通过链缓存实现跨请求状态管理，并通过可控的前缀缓存修剪来优化KV的使用。SparseEngine在保持方法质量的同时，提供了超过10倍的KV驱逐吞吐量和超过2倍的端到端速度提升。'}}}, {'id': 'https://huggingface.co/papers/2610.11251', 'title': 'V-CoLA: Vision Token Compression with Linear Attention', 'url': 'https://huggingface.co/papers/2610.11251', 'abstract': 'Abstract  Vision-language models (VLMs) have demonstrated impressive capabilities but suffer from substantial computational overhead, as vision tokens dominate the input sequence. This motivates vision token compression as a key direction to alleviate the burden. However, with the emergence of hybrid architectures incorporating linear attention (\\eg, Qwen3.5), prior methods designed for softmax attention struggle to generalize. Our analysis reveals that both attention- and similarity-based approaches suffer notable performance degradation, underscoring the urgent need for compression methods tailored to this regime. To this end, we propose V-CoLA, an efficient training-free token compression framework specifically designed for linear attention. V-CoLA introduces a novel uniqueness-aware importance criterion for identifying critical vision tokens, coupled with an adaptive token merging strategy that performs compression. All components are optimized at the implementation level to remain compatible with the chunk-wise parallelism of linear attention, ensuring strong practical value. Extensive experiments across multiple benchmarks demonstrate the superiority of V-CoLA: it achieves 99.5\\% of the original performance with only 50.0\\% of vision tokens, and over 88.0\\% with as few as 12.5\\%, while delivering a 1.86times to 6.15times prefill speedup.', 'score': 7, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'd50cd80d66320338', 'authors': ['Hao Jiang', 'Yiru Mao', 'Tianpeng Bu', 'Hao Zhou', 'Hongtao Duan', 'Wang Jing', 'Bowen Xu', 'Xin Chen', 'Lulu Hu', 'Bin Yang', 'Yongliang Tao', 'Minying Zhang'], 'affiliations': ['Alibaba Cloud Computing, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.11251.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Умное сжатие визуальных токенов для линейного внимания без обучения', 'desc': 'Работа посвящена сжатию визуальных токенов в гибридных видео-языковых моделях с линейным вниманием. Авторы показывают, что существующие методы компрессии, разработанные для softmax-внимания, плохо работают с линейным вниманием, используемым в современных архитектурах. Они предлагают V-CoLA — метод компрессии токенов без обучения, основанный на критерии уникальности для выделения важных визуальных токенов и адаптивной стратегии их объединения. Метод достигает ускорения предполнения в 1.86-6.15 раз, сохраняя 99.5% производительности при использовании только 50% визуальных токенов.'}, 'en': {'title': 'Efficient Vision Token Compression for Linear Attention Models', 'desc': 'This paper introduces V-CoLA, a new framework for compressing vision tokens in vision-language models (VLMs) that use linear attention. Traditional methods for token compression struggle with these hybrid architectures, leading to performance drops. V-CoLA employs a uniqueness-aware importance criterion to select essential vision tokens and an adaptive merging strategy to reduce the number of tokens efficiently. The results show that V-CoLA can maintain high performance while significantly reducing the number of tokens, achieving faster processing speeds.'}, 'zh': {'title': '高效视觉标记压缩，提升模型性能！', 'desc': '本文介绍了一种新的视觉语言模型（VLM）压缩方法，旨在减少计算负担。由于视觉标记在输入序列中占主导地位，传统的压缩方法在混合架构中表现不佳。我们提出的V-CoLA框架专为线性注意力设计，能够有效识别关键视觉标记并进行自适应合并。实验结果表明，V-CoLA在保留高性能的同时，显著减少了视觉标记的数量，提升了处理速度。'}}}, {'id': 'https://huggingface.co/papers/2610.04977', 'title': 'Do LLMs Understand Sequential Structure? A Controlled Study of Inference and Generation', 'url': 'https://huggingface.co/papers/2610.04977', 'abstract': 'Abstract  Large language models (LLMs) are increasingly used as interactive agents and simulators, yet it remains unclear whether they can recover latent sequential structure beyond surface action frequencies. This distinction is critical for behavioral simulation, where actions are often shaped by prior context rather than marginal frequencies alone. We study this question using controlled two-player Rock--Paper--Scissors interactions and a one-player stochastic n-gram continuation task. Across these experiments, we test whether LLMs can identify latent strategies, follow simple Markov rules, and sustain higher-order conditional dependencies. Our framework separates distribution matching from conditional rule following. Results show that longer context does not improve identification, correct recognition does not ensure faithful simulation, and higher-order dependencies substantially degrade rule recovery. Apparent behavioral fidelity can therefore mask incorrect generative mechanisms.', 'score': 6, 'issue_id': 3389, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '21180e9f77a9e63f', 'authors': ['Jerry Wang', 'Zhengxiang Wang', 'Ting Yu Liu', 'Hsin-Ling Hsu', 'Yi-Cheng Lai', 'Tengfei Ma'], 'affiliations': ['National Chengchi University', 'Stony Brook University', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.04977.jpg', 'data': {'categories': [], 'emoji': '🎭', 'ru': {'title': 'Иллюзия поведения: почему LLM симулируют, но не понимают', 'desc': 'Исследование изучает способность большие языковые модели восстанавливать скрытую последовательную структуру в поведении, а не просто копировать поверхностные частоты действий. Авторы разработали контролируемые эксперименты с играми «Камень-ножницы-бумага» и задачами продолжения n-грамм, чтобы проверить, могут ли LLM выявлять скрытые стратегии и следовать марковским правилам. Результаты показывают парадоксальный феномен: более длинный контекст не улучшает идентификацию, корректное распознавание паттернов не гарантирует правильное моделирование поведения, а зависимости высшего порядка снижают качество восстановления правил. Исследование демонстрирует, что внешняя точность симуляции может скрывать фундаментальные ошибки в механизмах генерации.'}, 'en': {'title': 'Unveiling the Limits of Language Models in Behavioral Simulation', 'desc': "This paper investigates the ability of large language models (LLMs) to understand and simulate complex behaviors in interactive tasks, specifically focusing on the game of Rock-Paper-Scissors. The authors differentiate between matching distributions of actions and following conditional rules, which is crucial for accurately simulating behavior based on context. Through experiments, they find that simply having a longer context does not enhance the model's ability to identify strategies, and that correct recognition of actions does not guarantee accurate simulation of behavior. The study reveals that higher-order dependencies can complicate the recovery of rules, suggesting that models may appear to perform well while actually using flawed generative processes."}, 'zh': {'title': '揭示大型语言模型的潜在行为结构', 'desc': '这篇论文研究了大型语言模型（LLMs）在模拟行为时是否能够识别潜在的序列结构，而不仅仅是表面上的动作频率。作者通过控制的双人石头剪子布互动和单人随机n-gram延续任务来探讨这个问题。实验结果表明，较长的上下文并不能提高策略识别的准确性，正确的识别也不一定能保证真实的模拟效果。此外，高阶依赖关系会显著降低规则的恢复能力，因此表面上的行为一致性可能掩盖了不正确的生成机制。'}}}, {'id': 'https://huggingface.co/papers/2610.12402', 'title': 'SpaceCast-Bench: Evaluating Predictive Spatial Reasoning in Vision-Language Models', 'url': 'https://huggingface.co/papers/2610.12402', 'abstract': 'Abstract  Existing spatial reasoning benchmarks mainly test spatial perception: reading off relations already visible in the input. Yet real-world spatial intelligence demands predictive spatial reasoning: constructing a scene from observations, anticipating how an intervention changes it, and reasoning about the unseen outcome. We introduce SpaceCast-Bench, the first benchmark to directly and diagnostically evaluate this capability. Built around an observe-transform-infer framework, its 3,862 questions from 182 real-world scenes span 16 task types at three levels: static perception, local prediction, and global prediction, progressively requiring scene understanding, spatial state updating, and relational inference over unobserved outcomes. Evaluating 21 models exposes a stark gap: the strongest model reaches only 58.0% against 87.2% human performance, while spatially specialized models remain near random chance. Controlled analyses further reveal that bridge views are critical for integrating distributed observations, and that explicit 3D evidence benefits models more reliably than generated outcome images or videos. Fine-tuning on our programmatically generated data lifts Qwen3-VL-4B from 34.0% to 65.7% with macro-average gains across six out-of-domain benchmarks.', 'score': 6, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'bdd4181e94d9f4af', 'authors': ['Hongxing Li', 'Jinyue Su', 'Dingming Li', 'Wenqi Zhang', 'Weiming Lu', 'Jun Xiao', 'Yueting Zhuang', 'Yongliang Shen'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12402.jpg', 'data': {'categories': ['#reasoning', '#dataset', '#multimodal', '#3d', '#training', '#synthetic', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'От восприятия к предсказанию: учим модели рассуждать о невидимом пространстве', 'desc': 'Авторы представляют SpaceCast-Bench — первый бенчмарк для оценки предиктивного пространственного рассуждения, а не просто восприятия. Бенчмарк содержит 3,862 вопроса из 182 реальных сцен и охватывает три уровня сложности: статическое восприятие, локальное и глобальное предсказание. Оценка 21 модели выявила значительный разрыв между возможностями LLM и человеческими способностями — лучшая модель достигает лишь 58% точности против 87.2% у людей. Исследование показало, что явные 3D данные эффективнее помогают моделям, чем сгенерированные изображения или видео результатов.'}, 'en': {'title': 'Bridging the Gap in Predictive Spatial Reasoning', 'desc': 'This paper introduces SpaceCast-Bench, a new benchmark designed to evaluate predictive spatial reasoning in machine learning models. Unlike existing benchmarks that only assess spatial perception, SpaceCast-Bench focuses on the ability to construct scenes, predict changes, and infer unseen outcomes based on observations. The benchmark includes 3,862 questions across various task types, testing models on their understanding of spatial relationships and their ability to update spatial states. Results show a significant performance gap between models and human capabilities, highlighting the need for improved spatial reasoning in AI systems.'}, 'zh': {'title': '空间推理的新基准：从观察到预测的挑战', 'desc': '现有的空间推理基准主要测试空间感知，即从输入中读取已可见的关系。然而，现实世界的空间智能需要预测性空间推理：从观察中构建场景，预测干预如何改变场景，并推理未观察到的结果。我们引入了SpaceCast-Bench，这是第一个直接和诊断性评估这一能力的基准。它基于观察-转换-推理框架，包含来自182个真实场景的3862个问题，涵盖静态感知、局部预测和全局预测三个层次，逐步要求场景理解、空间状态更新和对未观察结果的关系推理。'}}}, {'id': 'https://huggingface.co/papers/2610.11366', 'title': 'SpatialOPSD: Self-Distilling Spatial Intelligence from Verified Coding Agent Traces', 'url': 'https://huggingface.co/papers/2610.11366', 'abstract': "Abstract  Spatial coding agents significantly improve spatial reasoning in Multimodal Large Language Models (MLLMs) by using external tools to generate verified execution traces. However, this paradigm inherently suffers from prohibitive inference-time overhead and external dependencies. In this paper, we explore whether an MLLM can internalize this agentic capability to operate entirely tool-free. We begin with a simple observation: prompting an MLLM with summarized execution traces of a spatial coding agent naturally unlocks the model's internal spatial Chain-of-Thought (CoT). Motivated by this, we introduce SpatialOPSD, an on-policy self-distillation framework that internalizes spatial reasoning into a standalone MLLM by formulating verified agent traces as privileged information. To mitigate privileged-information leakage during distillation, we introduce Repetition-Aware Distillation, which combines repetition masking with unlikelihood regularization. Experiments across multiple benchmarks demonstrate that self-distilling SpatialOPSD achieves higher average accuracy than SFT and GRPO on both spatial and OOD datasets, exhibiting superior performance and generalization.", 'score': 6, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'c28a7afe7f32655c', 'authors': ['Rongxue Li', 'Meng Yang', 'Yiru Mao', 'Yongliang Tao', 'Lulu Hu', 'Bin Yang', 'Zhao Xu', 'Weihua Luo', 'Bowen Xu'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2610.11366.jpg', 'data': {'categories': ['#agents', '#multimodal', '#benchmark', '#training'], 'emoji': '🧠', 'ru': {'title': 'Интернализация пространственного рассуждения: самодистилляция без внешних инструментов', 'desc': 'В этой работе исследуется, как мультимодальные большие языковые модели (MLLM) могут самостоятельно овладеть способностями пространственного рассуждения, которые обычно требуют внешних инструментов. Авторы предлагают метод SpatialOPSD, основанный на самодистилляции моделей в режиме on-policy, где проверенные трассы выполнения агентов используются как привилегированная информация для обучения. Для предотвращения утечки информации во время дистилляции предложен метод Repetition-Aware Distillation, сочетающий маскирование повторений с регуляризацией по функции правдоподобия. Эксперименты показывают, что предложенный подход достигает лучшей точности на различных бенчмарках и лучше обобщается на распределённые-вне-распределения данные.'}, 'en': {'title': 'Internalizing Spatial Reasoning in MLLMs Without External Tools', 'desc': 'This paper discusses how to enhance spatial reasoning in Multimodal Large Language Models (MLLMs) without relying on external tools. The authors propose a method called SpatialOPSD, which allows the model to learn from summarized execution traces of a spatial coding agent, effectively internalizing spatial reasoning capabilities. To prevent information leakage during the learning process, they introduce a technique called Repetition-Aware Distillation, which uses masking and regularization. The results show that SpatialOPSD outperforms traditional training methods in accuracy and generalization across various datasets.'}, 'zh': {'title': '内化空间推理，提升模型性能', 'desc': '本文探讨了如何在多模态大型语言模型（MLLM）中内化空间推理能力，而无需依赖外部工具。我们提出了一种名为SpatialOPSD的自蒸馏框架，通过将空间编码代理的执行轨迹作为特权信息，来增强模型的内部空间推理能力。为了防止在蒸馏过程中泄露特权信息，我们引入了重复感知蒸馏方法，结合了重复掩蔽和不可能性正则化。实验结果表明，SpatialOPSD在多个基准测试中表现优于传统方法，展现了更高的准确性和更好的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2610.12230', 'title': 'From Prompting to Composing: A Spatial Canvas Interface for Poster Generation', 'url': 'https://huggingface.co/papers/2610.12230', 'abstract': 'Abstract  Text prompting is an indirect interface for poster generation, requiring users to encode inherently two-dimensional composition intent into a one-dimensional sequence of words. We introduce a Spatial Canvas Interface that enables users to directly compose generation intent in space through four complementary binding types: semantic, identity, text, and pixel, together with Text Specifications for individual elements and global appearance. Based on this interface, we develop Compo, a poster generation model adapted from a pretrained image editing model to understand Spatial Canvas inputs and Text Specifications. Compo supports both direct inference, where users explicitly construct the canvas, and agentic mode, where a high-level request is automatically translated into a planned Spatial Canvas. To train Compo, we develop a scalable pipeline that automatically constructs supervision data for different binding types and their combinations, enabling efficient adaptation without training a specialized poster generator from scratch. We further introduce a benchmark that evaluates adherence to individual binding types and their joint composition. Experiments show that Compo achieves stronger compositional controllability than both general-purpose image generation models and dedicated poster generation systems while maintaining high visual quality. By decoupling intent specification from visual generation, our work shifts poster generation from prompting toward composing.', 'score': 6, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '0f185993e545fe7e', 'authors': ['Yitong Wang', 'Fangyun Wei', 'Jinjing Zhao', 'Sirui Zhang', 'Hongyang Zhang', 'Dong Chen', 'Bo Dai', 'Yan Lu'], 'affiliations': ['Fudan University', 'Microsoft Research', 'The University of Hong Kong', 'The University of Sydney', 'USTC', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2610.12230.jpg', 'data': {'categories': ['#dataset', '#multimodal', '#agents', '#optimization', '#training', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'От промптирования к композированию: пространственный интерфейс для генерации плакатов', 'desc': 'В статье предложен новый подход к генерации плакатов через пространственный интерфейс вместо текстового описания. Авторы разработали модель Compo, адаптированную из предобученной модели редактирования изображений, которая понимает пространственные композиции и текстовые спецификации элементов. Система поддерживает два режима работы: прямое построение композиции пользователем и автоматический режим, где высокоуровневый запрос преобразуется в структурированный план. Для обучения создана масштабируемая методология генерации размеченных данных, позволяющая эффективно адаптировать модель без обучения с нуля, при этом Compo показывает лучший контроль композиции по сравнению с общими моделями генерации и специализированными системами.'}, 'en': {'title': 'Revolutionizing Poster Creation: From Text Prompts to Spatial Composition', 'desc': 'This paper presents a new method for creating posters using a Spatial Canvas Interface, which allows users to express their design ideas in a more intuitive way. Instead of using text prompts, users can directly manipulate elements in a two-dimensional space through various binding types like semantic and identity. The authors introduce Compo, a model that can generate posters based on this interface and adapt to user inputs, either through direct interaction or automated suggestions. The study demonstrates that Compo outperforms existing models in terms of compositional control and visual quality, making poster creation more efficient and user-friendly.'}, 'zh': {'title': '从提示到创作：海报生成的新方式', 'desc': '本文介绍了一种新的海报生成方法，称为空间画布接口，允许用户通过四种绑定类型直接在空间中表达生成意图。这种方法结合了文本规格，使用户能够控制单个元素和整体外观。我们开发的Compo模型能够理解空间画布输入，并支持用户直接构建画布或通过高层请求自动生成计划画布。实验表明，Compo在组合可控性和视觉质量方面优于传统的图像生成模型和专用海报生成系统。'}}}, {'id': 'https://huggingface.co/papers/2610.07730', 'title': 'SanSi: A Looped Typed Decision Model for System 1.5 Thinking', 'url': 'https://huggingface.co/papers/2610.07730', 'abstract': "Abstract  Typed decision models answer a declared question without generating text: a decision head returns a probability for each of the declared options in a single forward pass. A single pass is fast, intuitive System 1 thinking. We study what lies between one pass and generated reasoning: looping, in which the same layers are recursively applied several times before one typed readout. Each loop lets the model revise its hidden state before it commits to an answer, without generating a token; we call this System 1.5 thinking. We propose SanSi, which turns a pre-trained looped language model into a typed decision model. The option probabilities are read after every loop, and every loop is trained with a proper scoring rule, so that one model serves every budget from one loop to eight in a single run. On 10,027 test decisions from 59 sources, SanSi reaches 72.0% accuracy: 13.5 points above a non-looped model of the same shape trained with the same recipe, 5.3 points above a newer non-looped model of its size, and 1.8 points below one with three times the parameters. On two depth-controlled tasks, loops extend the solvable depth beyond the depths seen in training, where the larger single-pass model fails. Used as the judge for policy optimization with reinforcement learning, without gold answers, SanSi raises the generator's F1 by 7.7 points.", 'score': 4, 'issue_id': 3389, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '3ba56a7c9c4a017b', 'authors': ['Shuyu Gan', 'Young-Jun Lee', 'Dongyeop Kang'], 'affiliations': ['University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2610.07730.jpg', 'data': {'categories': ['#reasoning', '#architecture', '#rl', '#optimization', '#training'], 'emoji': '🔄', 'ru': {'title': 'Циклическое переосмысление вместо прямого ответа: от System 1 к System 1.5', 'desc': 'В статье предлагается подход SanSi, который превращает предварительно обученную циклическую языковую модель в типизированную модель принятия решений. Вместо генерации текста модель возвращает вероятности для каждого из объявленных вариантов ответа, причём слои рекурсивно применяются несколько раз до финального ответа. Этот процесс, названный System 1.5 thinking, позволяет модели пересматривать внутреннее состояние перед принятием решения. SanSi достигает 72% точности на 10 тысячах тестовых примеров, превосходя однопроходные модели и демонстрируя способность решать задачи более глубокой сложности, чем видела модель во время обучения.'}, 'en': {'title': 'SanSi: Enhancing Decision-Making with Looping Mechanisms', 'desc': "This paper introduces SanSi, a typed decision model that enhances decision-making by incorporating looping mechanisms, allowing the model to revise its hidden state multiple times before finalizing an answer. This approach, termed System 1.5 thinking, bridges the gap between quick, instinctive responses and more complex reasoning processes. By training the model to read option probabilities after each loop, SanSi can adapt its decision-making based on the depth of reasoning required, achieving higher accuracy than traditional non-looped models. The results demonstrate that SanSi not only improves decision accuracy but also extends the model's capability to handle more complex tasks beyond its training depth."}, 'zh': {'title': '循环决策模型SanSi：提升决策准确性', 'desc': '本文研究了一种新的决策模型，称为SanSi，它通过循环机制提高了决策的准确性。SanSi在每次循环中修正模型的隐藏状态，从而在做出最终决策之前进行多次推理。该模型在多个测试决策中表现出色，准确率达到了72.0%，显著高于传统模型。通过将SanSi应用于强化学习中的策略优化，模型的F1分数也得到了提升。'}}}, {'id': 'https://huggingface.co/papers/2610.11816', 'title': 'Chaos in the Text: Revealing the Modality Preference in Mixed-Modality Retrievers', 'url': 'https://huggingface.co/papers/2610.11816', 'abstract': 'Abstract  Dense retrievers have made significant progress on text and image corpora, but whether these capabilities extend reliably to mixed corpora containing text, image, and fused text-image documents remains unclear. In this paper, we systematically examine retrievers across architectures and find that their performance is highly sensitive to modality composition. As image documents are progressively replaced with semantically corresponding text representations, retrieval performance follows a pronounced V-shaped curve, remaining strong on single-modality corpora but degrading substantially when modalities coexist. In particular, irrelevant text causes more severe degradation than an equal number of irrelevant images, a phenomenon we term Chaos in the Text. Further analysis reveals modality preference, whereby text representations receive systematically higher similarity scores, allowing irrelevant text to outrank relevant images. To mitigate this bias, we introduce Trident, which constructs text, image, and fused text-image views of each document as co-equal positives and jointly optimizes relevance discrimination and positive-view balance through Multi-Positive View InfoNCE. Experiments across visual document and natural image benchmarks show that trident improves mixed-modality retrieval on both CLIP-based and VLM-based architectures, reduces sensitivity to modality composition and text distractors, and increases average single-modality retrieval performance.', 'score': 4, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '9debbff690d0f478', 'authors': ['Yubo Sun', 'Chunyi Peng', 'Yukun Yan', 'Zhenghao Liu', 'Zhipeng Xu', 'Sen Mei', 'Linlin Xin', 'Zheni Zeng', 'Maosong Sun'], 'affiliations': ['Nanjing University', 'Northeastern University', 'Tsinghua University', 'University of the Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.11816.jpg', 'data': {'categories': ['#multimodal', '#rag', '#benchmark'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка модальностей в мультимодальном поиске текста и изображений', 'desc': 'В статье исследуется проблема плотных поисковых систем при работе со смешанными корпусами, содержащими текст, изображения и комбинированные документы. Авторы обнаружили, что производительность retriever-ов сильно зависит от состава модальностей и демонстрирует V-образную кривую, когда текстовые и визуальные документы сосуществуют. Выявлено явление "Chaos in the Text", когда нерелевантный текст получает более высокие оценки сходства, чем релевантные изображения, из-за систематического предпочтения текстовых представлений. Для решения этой проблемы предложен метод Trident, который использует Multi-Positive View InfoNCE для совместного обучения на текстовых, визуальных и комбинированных представлениях документов в качестве одинаково важных позитивных примеров.'}, 'en': {'title': 'Trident: Balancing Retrieval Across Text and Images', 'desc': 'This paper investigates how dense retrievers perform when dealing with mixed types of data, specifically text, images, and combined text-image documents. The authors find that the performance of these retrievers is highly affected by the types of data present, showing a significant drop in effectiveness when irrelevant text is included. They introduce a new method called Trident, which treats different document views as equally important and optimizes their retrieval performance. The results demonstrate that Trident enhances retrieval accuracy across various benchmarks, making it more robust against irrelevant text and improving overall performance in mixed-modality scenarios.'}, 'zh': {'title': '提升混合模态检索性能的Trident方法', 'desc': '本论文研究了密集检索器在混合语料库（包含文本、图像和融合文本-图像文档）上的表现。我们发现，检索器的性能对不同模态的组合非常敏感，尤其是当无关文本与相关图像共存时，检索效果显著下降。我们提出了Trident方法，通过构建文本、图像和融合视图的共同正样本，优化相关性区分和视图平衡，从而减轻模态偏见。实验结果表明，Trident在混合模态检索中表现优越，提升了检索性能并降低了对模态组合的敏感性。'}}}, {'id': 'https://huggingface.co/papers/2610.12343', 'title': 'Reasoning-Informed Visual Editing', 'url': 'https://huggingface.co/papers/2610.12343', 'abstract': 'Abstract  Large Multi-modality Models (LMMs) have made significant progress in visual understanding and generation, but still face challenges in visual editing, particularly in following complex instructions, preserving appearance consistency, and supporting flexible input formats. To study this gap, we introduce RISEBench, the first benchmark for evaluating Reasoning-Informed viSual Editing (RISE), and extend it to RISEBench++, a more comprehensive and fine-grained benchmark for this emerging task. RISEBench++ extends the taxonomy into a hierarchical scheme spanning six reasoning dimensions: Temporal, Causal, Spatial, Logical, and Counterfactual Reasoning, together with Hybrid Reasoning integrating multiple reasoning types across multi-turn edits. These dimensions are further decomposed into 12 subcategories and 65 fine-grained task types. We expand input formats to include multi-image conditioning and scale the benchmark to 1000 human-annotated test cases, released in English and Chinese. We also improve our evaluation framework, assessing Instruction Reasoning, Appearance Consistency, and Visual Plausibility with human judges and an LMM-as-a-judge approach for more reliable and calibrated judgements. Beyond benchmarking, we introduce RISE-Agent, a training-free agentic framework integrating reasoning-driven planning, tool-augmented execution, and verifier-guided refinement, outperforming most strong existing approaches across diverse RISE tasks. We evaluate 58 visual editing approaches, including 34 open-source models, 19 closed-source models, and 5 agentic methods. The results reveal substantial challenges in reasoning-based visual editing, with even the strongest evaluated approach, GPT-Image-2.5 Sunburst, achieving only 56.6% accuracy. RISEBench++ highlights the limitations of contemporary editing models, provides insights, and indicates future directions for reasoning-aware visual editing.', 'score': 3, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '4cc78d20a69d7969', 'authors': ['Xue Yang', 'Peiyuan Zhang', 'Yilun Zhu', 'Qihao Yang', 'Mingxin Liu', 'Xiangyu Zhao', 'Ziqian Fan', 'Zhaokai Wang', 'Yan Li', 'Yifan Yang', 'Xu Yang', 'Xiaosong Jia', 'Yue Zhou', 'Zhihang Zhong', 'Junchi Yan'], 'affiliations': ['East China Normal University', 'Fudan University', 'Microsoft Research Asia', 'Shanghai Jiao Tong University', 'South China University of Technology', 'Southeast University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12343.jpg', 'data': {'categories': ['#reasoning', '#dataset', '#cv', '#multimodal', '#agents', '#survey', '#open_source', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Рассуждения в визуальном редактировании: бенчмарк и агентский подход', 'desc': 'В работе представлен RISEBench++ — комплексный бенчмарк для оценки визуального редактирования на основе рассуждений (RISE) с многомерной классификацией задач по шести типам логического вывода: темпоральному, причинному, пространственному, логическому, контрфактическому и гибридному. Набор данных содержит 1000 размеченных вручную примеров на английском и китайском языках с поддержкой множественных входных форматов. Авторы предложили RISE-Agent — тренируемый без обучения агентский фреймворк, объединяющий планирование на основе рассуждений, выполнение с использованием инструментов и уточнение, управляемое верификатором. Оценка 58 подходов показала, что современные модели визуального редактирования испытывают значительные трудности с задачами рассуждения, даже лучший результат достигает только 56,6% точности.'}, 'en': {'title': 'Enhancing Visual Editing with Reasoning: Introducing RISEBench++', 'desc': 'This paper introduces RISEBench, a benchmark designed to evaluate Reasoning-Informed visual Editing (RISE) in Large Multi-modality Models (LMMs). It expands to RISEBench++, which categorizes reasoning into six dimensions and includes 1000 human-annotated test cases for comprehensive evaluation. The study assesses various visual editing approaches, revealing significant challenges in reasoning-based tasks, with the best model achieving only 56.6% accuracy. Additionally, the paper presents RISE-Agent, a framework that enhances visual editing by integrating reasoning-driven planning and execution.'}, 'zh': {'title': '推理驱动的视觉编辑新基准', 'desc': '大型多模态模型（LMMs）在视觉理解和生成方面取得了显著进展，但在视觉编辑中仍面临挑战，尤其是在遵循复杂指令、保持外观一致性和支持灵活输入格式方面。为了解决这些问题，我们引入了RISEBench，这是第一个用于评估推理驱动的视觉编辑（RISE）的基准，并扩展为RISEBench++，提供更全面和细致的评估。RISEBench++将推理维度扩展为六个层次，包括时间、因果、空间、逻辑和反事实推理，以及结合多种推理类型的混合推理。我们还扩展了输入格式，增加了多图像条件，并将基准规模扩大到1000个人工标注的测试案例，提供英文和中文版本。'}}}, {'id': 'https://huggingface.co/papers/2610.03858', 'title': 'Retrieval-Centric Deep Learning in Growing Nonparametric Neural Networks', 'url': 'https://huggingface.co/papers/2610.03858', 'abstract': 'Abstract  We investigate a general-purpose layer for deep learning that, instead of compressing arbitrary-size training data into fixed-size weight matrices, stores a new pair of key-value representations for every data point during training, and retrieves and recombines these representations through an attention mechanism at inference time - resulting in a growing neural net (NN). While Irie et al. (arXiv:2202.05798) have put forward this perspective from the classic duality expressing any linear layer in a deep NN trained by gradient descent as linear attention (LA) over the training data points, replacing LA by more powerful attention functions, as they suggest, turns out to be non-trivial: we show that naively applying learning rules from the LA case to advanced kernels does not lead to principled optimization. Here we fill this gap and develop functional gradient-based learning rules for kernelized attention layers, based on radial basis function (RBF) and softmax-like kernels - establishing the principled "retrieval-centric deep learning" (RCDL) paradigm. Empirically, we demonstrate the promising performance and learning-efficiency of RCDL on image classification and synthetic teacher-student learning tasks. Moreover, we show that replacing LA in the dual form of NNs by advanced LA variants, namely MesaNet/DeltaNet, yields a formal connection to recently proposed optimizers for conventional fixed-size NNs, offering a novel perspective on deep learning optimization.', 'score': 3, 'issue_id': 3389, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '8e8d61cf6db01a84', 'authors': ['Maximilian Schlegel', 'Rajai Nasser', 'Seijin Kobayashi', 'Yanick Schimpf', 'Oliver Sieberling', 'Robert Obryk', 'Kazuki Irie', 'João Sacramento', 'Johannes von Oswald'], 'affiliations': ['Department of Computer Science and Wu Tsai Institute Yale University, New Haven, CT, USA', 'Google, Paradigms of Intelligence Team, Zurich, Switzerland', 'MIT CSAIL, Cambridge, MA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.03858.jpg', 'data': {'categories': ['#optimization', '#architecture', '#cv', '#training'], 'emoji': '🧠', 'ru': {'title': 'Нейронные сети, растущие с данными: парадигма извлечения вместо сжатия', 'desc': 'В этой работе исследуется универсальный слой для глубокого обучения, который вместо сжатия обучающих данных в фиксированные матрицы весов сохраняет пары представлений ключ-значение для каждой точки данных и извлекает их через механизм внимания (attention) во время вывода. Авторы развивают принципиальный подход функционального градиента для обучения слоев с ядерными функциями внимания (RBF и softmax ядра), создавая парадигму "извлечение-центричного глубокого обучения". Теория показывает, что замена линейного внимания на продвинутые варианты (MesaNet/DeltaNet) связана с современными оптимизаторами для обычных нейронных сетей. Экспериментально подтверждается эффективность предложенного подхода на задачах классификации изображений и обучении учитель-ученик.'}, 'en': {'title': 'Revolutionizing Deep Learning with Retrieval-Centric Attention', 'desc': 'This paper introduces a new approach to deep learning that uses key-value pairs for each training data point instead of traditional fixed-size weight matrices. During inference, an attention mechanism retrieves and combines these representations, leading to a dynamic neural network structure. The authors develop new learning rules for advanced attention functions, addressing challenges in optimizing these kernelized layers. Their method, called retrieval-centric deep learning (RCDL), shows improved performance in tasks like image classification and offers insights into optimizing deep learning models.'}, 'zh': {'title': '以检索为中心的深度学习新范式', 'desc': '本文研究了一种通用的深度学习层，该层在训练过程中为每个数据点存储一对新的键值表示，而不是将任意大小的训练数据压缩为固定大小的权重矩阵。在推理时，通过注意力机制检索和重新组合这些表示，从而形成一个不断增长的神经网络。我们提出了基于径向基函数（RBF）和类似softmax的核的功能梯度学习规则，建立了以检索为中心的深度学习（RCDL）范式。实验证明，RCDL在图像分类和合成教师-学生学习任务中表现出良好的性能和学习效率。'}}}, {'id': 'https://huggingface.co/papers/2610.12360', 'title': 'Accurate but Not Humble: Evaluating Epistemic Humility in LLM Agents under Knowledge Conflict', 'url': 'https://huggingface.co/papers/2610.12360', 'abstract': "Abstract  When retrieved evidence contradicts an agent's prior beliefs, does it revise its answer, acknowledge uncertainty, or persist with an incorrect conclusion? Existing evaluations of agentic systems focus primarily on task success, offering limited insight into how agents handle such conflicts. We propose to evaluate agents on epistemic humility (EH): the agent's willingness to recognize, act on, and communicate uncertainty during task execution. We operationalize EH through three trajectory-level behavioral dimensions: Identify, Solve, and Escalate (ISE). Through knowledge conflict, situations where the backbone language model's parametric knowledge contradicts the evidence it encounters, or where two contextual sources disagree, we evaluate two conflict settings: (1) controlled conflict and (2) naturally occurring conflict during multi-step agentic execution, each paired with matched no-conflict controls. Evaluating four agents, we find that higher task accuracy does not necessarily correspond to greater epistemic humility: some high-accuracy configurations recognize conflicts during execution but do not communicate unresolved uncertainty in their incorrect final answers. Trajectory-level analysis further reveals that agents frequently detect conflicts in early steps of execution but fail to maintain or resolve them in later steps. Finally, we show that model-level interventions can improve EH, but often at the cost of task accuracy, suggesting that epistemic humility emerges from the interaction among the backbone model, agent harness, and evaluation environment.", 'score': 2, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '64d59d5f8b343d91', 'authors': ['Kaiser Sun', 'Bernal Jimenez Gutierrez', 'Hongjun Liu', 'Jingyu Zhang', 'Jie Gao', 'Mark Dredze', 'Daniel Khashabi'], 'affiliations': ['Johns Hopkins University', 'New York University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12360.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🤔', 'ru': {'title': 'Когда агент должен сказать «я не уверен»: измерение эпистемической скромности', 'desc': 'В статье предлагается новая метрика для оценки агентов, основанных на больших языковых моделях — эпистемическая скромность, которая измеряет способность агента признавать неуверенность и противоречия при выполнении задач. Авторы разработали методику оценки через три поведенческих измерения: определение конфликтов, их разрешение и эскалация к пользователю. Они проводили эксперименты в условиях конфликта знаний, когда параметрические знания модели противоречат полученным доказательствам или когда источники информации расходятся. Исследование показало, что высокая точность выполнения задач не гарантирует эпистемическую скромность, и агенты часто обнаруживают конфликты на ранних этапах, но не сохраняют эту информацию при формировании финального ответа.'}, 'en': {'title': 'Evaluating Agents on Epistemic Humility in Conflict Situations', 'desc': "This paper explores how intelligent agents respond when faced with evidence that contradicts their prior beliefs. It introduces the concept of epistemic humility (EH), which measures an agent's ability to recognize and communicate uncertainty during tasks. The authors evaluate agents based on three behavioral dimensions: Identify, Solve, and Escalate (ISE), particularly in scenarios of knowledge conflict. The findings indicate that higher task accuracy does not always mean greater epistemic humility, as some agents may detect conflicts but fail to express uncertainty in their conclusions."}, 'zh': {'title': '智能体的认知谦逊与任务准确性并不总成正比', 'desc': '本文探讨了智能体在面对与其先前信念相矛盾的证据时的反应。我们提出评估智能体的认知谦逊（EH），即在任务执行过程中识别、处理和传达不确定性的能力。通过三种行为维度：识别、解决和升级（ISE），我们分析了智能体在知识冲突中的表现。研究发现，任务准确性高并不一定意味着认知谦逊高，许多智能体在执行过程中能够识别冲突，但未能在最终答案中传达未解决的不确定性。'}}}, {'id': 'https://huggingface.co/papers/2610.11570', 'title': 'Scaling to Tens of Thousands of Test-Time Iterations with Loop-Native Attention Residuals', 'url': 'https://huggingface.co/papers/2610.11570', 'abstract': 'Abstract  In this paper, we argue that looped Transformers need their own residual connections to prevent performance degradation as the number of iterations grows. We observe that increasing loop iterations can reduce reasoning accuracy: noisy state updates overwrite correct intermediate deductions and even undo completed solutions. This leaves subsequent iterations to recover lost information from an already degraded representation: once an error arises in an earlier loop, often as a result of long-range propagation through the recurrence, later loops find it difficult to correct. In this paper, we introduce InfiLoop, a loop-native residual connection that learns which past computations to retain and how much to accept from each new update. InfiLoop combines content-based weighting with learned temporal decay to maintain a running summary of recurrent states. An exact streaming recurrence keeps its persistent aggregation memory constant as the loop count grows. The resulting adaptive update suppresses unreliable proposals and preserves useful intermediate states. Across extensive reasoning tasks, a 7M-parameter InfiLoop model outperforms existing recursive architectures, reaching 97.9% exact accuracy on Sudoku-Extreme, and 13.6% pass@2 on ARC-AGI-2. Notably, on Sudoku-Extreme, InfiLoop continues to improve with test-time looping beyond 20,000 effective steps, showing that added depth translates directly into stronger reasoning. Our code is available at https://github.com/pixeli99/InfiLoop.', 'score': 2, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '24ff07b6bd7f145b', 'authors': ['Pengxiang Li', 'Dilxat Muhtar', 'Di He', 'Guinan Su', 'Lu Yin', 'Shiwei Liu'], 'affiliations': ['ELLIS Institute Tubingen', 'Max Planck Institute for Intelligent Systems', 'Peng Cheng Laboratory', 'Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences', 'Shenzhen University of Advanced Technology', 'The Hong Kong Polytechnic University', 'Tubingen AI Center', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2610.11570.jpg', 'data': {'categories': ['#reasoning', '#open_source'], 'emoji': '🔄', 'ru': {'title': 'Остаточные связи для бесконечных циклических вычислений в Трансформерах', 'desc': 'В статье предложен новый механизм остаточных связей (residual connections) для циклических Трансформеров, которые предотвращают деградацию производительности при увеличении количества итераций. Авторы показывают, что шумные обновления состояния могут перезаписывать правильные промежуточные выводы, а ошибки, возникшие на ранних этапах, сложно исправить на последующих итерациях. Предложенный метод InfiLoop использует взвешивание на основе содержимого и временное затухание для сохранения полезной информации из предыдущих вычислений. Модель с 7М параметров демонстрирует превосходные результаты на задачах рассуждения, включая 97.9% точность на Sudoku-Extreme и продолжает улучшаться даже при более чем 20,000 шагов тестирования.'}, 'en': {'title': 'InfiLoop: Enhancing Looped Transformers with Adaptive Residual Connections', 'desc': 'This paper presents InfiLoop, a novel approach to enhance looped Transformers by introducing dedicated residual connections. The authors argue that as the number of iterations increases, the reasoning accuracy can decline due to noisy updates that overwrite correct information. InfiLoop addresses this issue by learning which past computations to retain and how to balance new updates, effectively maintaining a summary of recurrent states. The results demonstrate that InfiLoop significantly outperforms existing models on reasoning tasks, showcasing its ability to improve accuracy with extended iterations.'}, 'zh': {'title': '循环Transformer的新突破：InfiLoop', 'desc': '本文提出了循环Transformer需要独立的残差连接，以防止随着迭代次数增加而导致的性能下降。我们观察到，增加循环迭代次数会降低推理准确性，因为噪声状态更新会覆盖正确的中间推导，甚至撤销已完成的解决方案。为了解决这个问题，本文介绍了InfiLoop，这是一种循环原生的残差连接，能够学习保留哪些过去的计算以及从每个新更新中接受多少信息。通过结合基于内容的加权和学习的时间衰减，InfiLoop能够在循环状态中保持一个持续的汇总，从而在推理任务中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2501.09223', 'title': 'Foundations of Large Language Models', 'url': 'https://huggingface.co/papers/2501.09223', 'abstract': 'Abstract  This is a book about large language models. As indicated by the title, it primarily focuses on foundational concepts rather than comprehensive coverage of all cutting-edge technologies. The book is structured into six main chapters, each exploring a key area: pre-training, generative models, prompting, alignment, inference, and reasoning. It is intended for college students, professionals, and practitioners in natural language processing and related fields, and can serve as a reference for anyone interested in large language models.', 'score': 1, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'dd735da6a873b6d3', 'authors': ['Tong Xiao', 'Jingbo Zhu'], 'affiliations': ['NLP Lab, Northeastern University', 'NiuTrans Research'], 'pdf_title_img': 'assets/pdf/title_img/2501.09223.jpg', 'data': {'categories': [], 'emoji': '📚', 'ru': {'title': 'Основы больших языковых моделей: от предварительного обучения к интеллектуальному выводу', 'desc': 'Книга посвящена фундаментальным концепциям больших языковых моделей (LLM), охватывающим все основные аспекты их разработки и применения. Материал организован в шести главах, которые последовательно рассматривают этапы предварительного обучения, генеративные модели, методы промптинга, выравнивание моделей по человеческим предпочтениям, оптимизацию инференса и развитие способностей к рассуждению. Книга предназначена для студентов, специалистов и практиков в области обработки естественного языка, служит справочником для всех, кто желает глубже понять принципы работы современных LLM. Вместо погони за передовыми технологиями, авторы сосредоточивают внимание на базовых знаниях, необходимых для работы с языковыми моделями.'}, 'en': {'title': 'Understanding the Foundations of Large Language Models', 'desc': 'This paper discusses the foundational concepts of large language models (LLMs) rather than delving into every advanced technology. It is organized into six chapters that cover essential topics such as pre-training, generative models, and prompting techniques. The book aims to provide insights into alignment, inference, and reasoning within the context of LLMs. It serves as a valuable resource for students and professionals in natural language processing and related disciplines.'}, 'zh': {'title': '深入理解大型语言模型的基础概念', 'desc': '这本书主要讨论大型语言模型的基础概念，而不是所有前沿技术的全面覆盖。书中分为六个主要章节，分别探讨预训练、生成模型、提示、对齐、推理和推理等关键领域。它适合大学生、专业人士和自然语言处理相关领域的从业者，并可作为对大型语言模型感兴趣的人的参考。通过这本书，读者可以更好地理解大型语言模型的基本原理和应用。'}}}, {'id': 'https://huggingface.co/papers/2610.12355', 'title': 'Distilling Routed 3D Privilege for Spatial Reasoning in Vision-Language Models', 'url': 'https://huggingface.co/papers/2610.12355', 'abstract': "Abstract  Spatial reasoning remains a persistent weakness of vision-language models (VLMs), because RGB inputs do not directly provide geometric evidence. Existing remedies either inject 3D into the model at inference, paying architecture and latency costs, or train with outcome rewards that supervise only the final answer. Spatial errors originate in perception: a misjudged depth or direction can be corrected only by the scene's true geometry, which the 3D-scanned sources of spatial training corpora already provide. We propose GPD (Geometry-Privileged Distillation), which makes geometric evidence the privilege in on-policy self-distillation (OPSD). For each question, depth, semantic, and bird's-eye-view (BEV) cues are rendered as compact text and routed to the teacher alongside the reference answer; a privileged KL, applied only to incorrect trajectories, augments GRPO, and the deployed model remains RGB-only. On the 4B backbone, GPD achieves 57.1 on VSI-Bench and 37.6 average across MindCube, SPARBench, MMSI-Bench, and ViewSpatial, outperforming both GRPO and answer-privileged OPSD across spatial reasoning benchmarks. Ablations confirm the complementarity of 3D and answer privilege, the advantage of question-conditioned routing over full-context injection, and the benefit of restricting distillation to incorrect trajectories.", 'score': 1, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8fc9e84467a64cf1', 'authors': ['Hongxing Li', 'Yixin Li', 'Dingming Li', 'Zixuan Wang', 'Yuchen Yan', 'Wenqi Zhang', 'Weiming Lu', 'Yongliang Shen'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12355.jpg', 'data': {'categories': ['#cv', '#multimodal', '#3d', '#training', '#benchmark'], 'emoji': '🎲', 'ru': {'title': 'Геометрия как учитель: привилегированная дистилляция для пространственного понимания', 'desc': 'В статье предлагается метод GPD (Geometry-Privileged Distillation) для улучшения пространственного рассуждения в vision-language models. Авторы используют 3D геометрические данные (глубину, семантику и вид сверху) как привилегированную информацию только во время обучения, чтобы исправлять ошибки модели в восприятии пространства. Метод применяет дистилляцию знаний на основе RL с использованием привилегированных KL потерь только для неправильных траекторий, оставляя итоговую модель RGB-only. На бенчмарках пространственного рассуждения GPD превосходит существующие методы, достигая значительных улучшений без увеличения latency при инференсе.'}, 'en': {'title': 'Enhancing Spatial Reasoning in VLMs with Geometry-Privileged Distillation', 'desc': "This paper addresses the challenges of spatial reasoning in vision-language models (VLMs), which struggle with understanding geometry from RGB images alone. The authors introduce a novel approach called Geometry-Privileged Distillation (GPD), which incorporates geometric information during the training process without altering the model's RGB-only architecture. By using depth, semantic, and bird's-eye-view cues as additional context for training, GPD enhances the model's ability to correct spatial errors. The results show that GPD significantly improves performance on various spatial reasoning benchmarks compared to existing methods, demonstrating the importance of integrating geometric evidence in VLMs."}, 'zh': {'title': '几何特权蒸馏：提升空间推理能力的创新方法', 'desc': '这篇论文探讨了视觉语言模型（VLMs）在空间推理方面的不足，主要是因为RGB输入无法直接提供几何证据。作者提出了一种新的方法，称为几何特权蒸馏（GPD），通过在自蒸馏过程中引入几何信息来改善模型的空间推理能力。GPD利用深度、语义和鸟瞰视图（BEV）线索，将这些信息以紧凑的文本形式传递给教师模型，从而增强了模型的学习效果。实验结果表明，GPD在多个空间推理基准测试中表现优异，超越了现有的方法。'}}}, {'id': 'https://huggingface.co/papers/2609.34344', 'title': 'Learning to Steer, Steering to See: Unveiling the Geometry of RLVR in Large Language Models via Trainable Vectors', 'url': 'https://huggingface.co/papers/2609.34344', 'abstract': 'Abstract  Reinforcement learning (RL) has become a key paradigm for enhancing the reasoning of large language models, yet the high dimensionality of parameter updates makes its training dynamics hard to analyze. We study reinforcement learning with verifiable rewards (RLVR) and use vector steering to identify a low-dimensional effective manifold in activation space associated with RL-induced gains. We uncover two geometric properties. (1) Effective Manifold Capacity: the capacity needed to reproduce RL gains can be very small but is not infinitely compressible; at extremely low capacity, intervention dimensionality and input-dependent expressiveness become key constraints, and this requirement varies with injection depth. (2) Control Manifold Separation: effective control directions lie mainly in the low-variance complement of the activation principal subspace. Within a task and base model, the learned geometry stays largely consistent across training configurations, and across tasks geometric alignment correlates with capability transfer. Experiments on 5 LLMs and 6 verifiable-reward tasks support these findings. We then propose Alpha-Stabler, a plug-and-play framework with a Predictor that monitors principal-subspace intrusion for early collapse warnings, and a Controller that removes the principal-subspace component of activation gradients during backpropagation while preserving the orthogonal complement. Alpha-Stabler stabilizes training for 2,000 steps and consistently improves RL gains, offering practical insights for robust post-training. Code: https://github.com/caiyuchen-ustc/On_Policy_Vector_Training', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': 'c0bc27ff11590fda', 'authors': ['Yuchen Cai', 'Ding Cao', 'Qixiang Yin', 'Xin Xu', 'Kai Yang', 'Siye Wu', 'Pengyuan Wang', 'Jiaxuan Wang', 'Weijie Liu', 'Saiyong Yang', 'Guangzhong Sun', 'Guiquan Liu', 'Junfeng Fang'], 'affiliations': ['BUPT', 'Tencent Hunyuan', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2609.34344.jpg', 'data': {'categories': ['#reasoning', '#rl', '#optimization', '#training', '#transfer_learning', '#open_source', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Геометрия обучения с подкреплением: поиск низкоразмерного многообразия для устойчивой пост-обработки LLM', 'desc': 'В работе исследуется применение обучения с подкреплением к большим языковым моделям через анализ геометрии активаций нейронной сети. Авторы используют метод векторного управления для выявления низкоразмерного эффективного многообразия в пространстве активаций, которое отвечает за улучшения, достигнутые при обучении с подкреплением. Они обнаруживают две ключевые геометрические свойства: ёмкость эффективного многообразия имеет минимальный предел сжатия и зависит от глубины инъекции, а эффективные направления управления находятся в низковариационном дополнении к главному подпространству. На основе этих открытий предлагается метод Alpha-Stabler, который предотвращает коллапс обучения и стабилизирует тренировку LLM.'}, 'en': {'title': 'Stabilizing Reinforcement Learning Gains in Language Models', 'desc': 'This paper explores how reinforcement learning (RL) can improve large language models by analyzing the training dynamics of parameter updates. It introduces the concept of reinforcement learning with verifiable rewards (RLVR) and identifies a low-dimensional effective manifold in the activation space that is crucial for achieving RL gains. The study reveals two key geometric properties: the effective manifold capacity, which indicates that a small capacity can still reproduce RL gains, and the control manifold separation, which shows that effective control directions are found in low-variance areas of the activation space. The authors propose a framework called Alpha-Stabler that enhances training stability and improves RL performance by managing the influence of principal components during backpropagation.'}, 'zh': {'title': '稳定强化学习，提升模型推理能力', 'desc': '强化学习（RL）已成为提升大型语言模型推理能力的关键方法，但其参数更新的高维性使得训练动态难以分析。本文研究了可验证奖励的强化学习（RLVR），并利用向量引导识别与RL增益相关的低维有效流形。我们发现了两个几何特性：有效流形容量和控制流形分离。通过对5个大型语言模型和6个可验证奖励任务的实验，验证了这些发现，并提出了Alpha-Stabler框架，以稳定训练并提高RL增益。'}}}, {'id': 'https://huggingface.co/papers/2609.31507', 'title': 'SatNav: A Scalable Benchmark for Long-Horizon UAV Vision-Language Navigation from Satellite Imagery', 'url': 'https://huggingface.co/papers/2609.31507', 'abstract': 'Abstract  Urban uncrewed aerial vehicle (UAV) vision-language navigation (VLN) requires agents to follow instructions across extended urban spaces, inherently demanding long-term memory and geospatial grounding. However, scaling existing benchmarks remains difficult because of their reliance on costly reconstructed 3D assets, limiting geographic diversity and episode scale. To address this, we introduce SatNav, a scalable, long-horizon UAV VLN benchmark built from high-resolution satellite imagery. SatNav targets city-level navigation missions and uses satellite crops as approximations of UAV nadir views for visual observations. Through an automated cue-to-episode pipeline, SatNav constructs 118K episodes from 59 scenes across 18 cities, with an average trajectory length of 379 m. To stress-test long-horizon memory and geospatial reasoning, SatNav defines three task families: Boundary, Landmark, and Route, targeting loop progress tracking, landmark-based spatial grounding, and route following with counting cues. Benchmarking classical VLN agents and recent agents based on large vision-language models (LVLMs) on SatNav shows that city-scale navigation remains challenging. We further introduce SwiftVLN, a modular framework with switchable memory components, and conduct systematic memory-design ablations. Finally, satellite-to-UAV transfer experiments show that satellite-trained navigation models can operate on real-flight UAV observations, showing the practical relevance of SatNav. Our project page: https://eku127.github.io/SatNav/', 'score': 0, 'issue_id': 3389, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'b7400d17777bf599', 'authors': ['Jiajun Jiang', 'Chunliang Hua', 'Zichun Chen', 'Yanxing Wu', 'Zeyuan Yang', 'Jie Song', 'Xiao Hu'], 'affiliations': ['Low Altitude Space Economy Research Center, International Digital Economy Academy (IDEA)', 'The Hong Kong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2609.31507.jpg', 'data': {'categories': ['#reasoning', '#dataset', '#cv', '#long_context', '#agents', '#multimodal', '#transfer_learning', '#robotics', '#benchmark'], 'emoji': '🛰️', 'ru': {'title': 'От спутника к дрону: масштабируемая навигация через естественный язык', 'desc': 'В статье представлена новая масштабируемая база данных SatNav для обучения навигационных агентов беспилотных летательных аппаратов (БЛА) в городской среде на основе инструкций на естественном языке. База данных построена из спутниковых снимков высокого разрешения и содержит 118 тысяч эпизодов навигации длиной около 379 метров с трёмя типами задач: отслеживание маршрута, навигация по ориентирам и следование инструкциям. Для решения задач долгосрочной памяти и пространственного рассуждения авторы предлагают фреймворк SwiftVLN с модульной архитектурой и переключаемыми компонентами памяти. Результаты показывают, что модели, обученные на спутниковых изображениях, успешно переносятся на реальные наблюдения с БЛА, что демонстрирует практическую ценность разработанного подхода.'}, 'en': {'title': 'Navigating Cities with Satellite Insights', 'desc': 'This paper presents SatNav, a new benchmark for urban uncrewed aerial vehicle (UAV) vision-language navigation (VLN) that utilizes high-resolution satellite imagery to facilitate long-distance navigation tasks. The benchmark consists of 118,000 episodes derived from 59 scenes across 18 cities, designed to test the capabilities of agents in long-horizon memory and geospatial reasoning. It introduces three task families—Boundary, Landmark, and Route—to evaluate different aspects of navigation, such as tracking progress and spatial grounding. Additionally, the paper discusses SwiftVLN, a framework for enhancing memory design in navigation models, and demonstrates that models trained on satellite data can effectively operate with real UAV observations.'}, 'zh': {'title': '城市无人机导航的新基准：SatNav', 'desc': '本论文介绍了一种新的无人机视觉语言导航基准，称为SatNav，旨在解决城市环境中的导航任务。SatNav利用高分辨率卫星图像构建，能够生成118,000个导航任务，覆盖18个城市，平均轨迹长度为379米。该基准测试了长时记忆和地理推理能力，定义了边界、地标和路线三种任务类型。研究还提出了SwiftVLN框架，通过模块化设计来优化记忆组件，并展示了卫星训练的导航模型在实际无人机观察中的应用潜力。'}}}, {'id': 'https://huggingface.co/papers/2605.22949', 'title': 'MARGIN: Runtime Confidence Calibration for Multi-Agent Foundation Model Coordination', 'url': 'https://huggingface.co/papers/2605.22949', 'abstract': 'Abstract  When a coordinator compares answers from heterogeneous foundation models, self-reported confidence may have different meanings across responders and changing workloads. This paper presents MARGIN (Multi-Agent Runtime Grading via Incremental Normalisation), a runtime calibration method that learns model-specific confidence corrections from observed answer outcomes without retraining the models or requiring a held-out calibration set. MARGIN tracks recent accuracy and stated confidence within confidence bands, uses their ratio to correct reported confidence, and blends sparse-band corrections toward a model-level estimate. The corrected scores weight candidate answers in a collective decision. Evaluation covers code generation, question answering, and mathematics, using an 18-model pool and a nine-model subset for distribution-shift experiments. On BigCodeBench, model-mean confidence is negatively related to accuracy; among correct/incorrect response pairs, choosing the more confident responder performs below chance. Against five online calibration baselines receiving identical feedback and retaining their learned state across each transition, MARGIN achieves lower post-shift expected calibration error than all five in two code-generation transitions and than four in a question-answering transition; the remaining question-answering comp
