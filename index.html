    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.31620', 'title': 'FuseReg: Regularizing Layer Fusion Mitigates the Reconstruction-Generation Gap in Representation Autoencoders', 'url': 'https://huggingface.co/papers/2609.31620', 'abstract': 'Abstract  Representation autoencoders (RAEs) reuse features from a pretrained visual encoder as reconstruction and diffusion latents, integrating strong visual representations into image generation. However, RAEs still need to decide which encoder layers form the shared latent space for the generator and pixel decoder. This choice involves a trade-off. Shallower layers tend to preserve fine pixel details better, while deeper layers tend to yield better generation metrics. A fixed heuristic layer fusion therefore couples two stages that benefit from different information. We introduce FuseReg, which replaces heuristic feature selection with training over random subsets of encoder layers. We theoretically analyze the underlying mechanism: subset sampling explicitly penalizes sensitivity to cross-layer disagreement. On ImageNet-256 with DINOv3-L, a single FuseReg decoder reconstructs from full, sparse, and single-layer fusions without retraining, achieving higher PSNR than decoders specialized to fixed fusions. This flexibility also benefits generation: decoder replacement alone reduces unguided gFID by 27% with an unchanged RAEv2 DiT-XL generator. The same regularization principle extends to diffusion training, with joint regularization of both stages reducing unguided gFID by 29% on DiT-Base. These results show that training downstream models for layer-fusion robustness narrows the reconstruction-generation gap without modifying the pretrained encoder.', 'score': 15, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'a76bb06816e71823', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#cv', '#architecture', '#optimization', '#diffusion', '#training'], 'emoji': '🔀', 'ru': {'title': 'FuseReg: обучение робастности к выбору слоёв для моста между реконструкцией и генерацией', 'desc': 'В работе предложен метод FuseReg для автокодировщиков представлений (RAE), которые переиспользуют признаки из предобученного визуального энкодера для реконструкции и латентных переменных диффузии. Основная проблема заключается в выборе слоёв энкодера для формирования общего латентного пространства, так как поверхностные слои лучше сохраняют детали пикселей, а глубокие слои обеспечивают лучшие метрики генерации. Авторы предлагают заменить эвристический выбор слоёв на обучение по случайным подмножествам слоёв энкодера, что явно штрафует чувствительность к рассогласованию между слоями. На датасете ImageNet-256 метод достигает высоких показателей PSNR при реконструкции и снижает метрику gFID на 27-29% для генерации без переобучения энкодера.'}, 'en': {'title': 'Enhancing Image Generation with Flexible Layer Fusion', 'desc': 'This paper introduces Representation Autoencoders (RAEs) that enhance image generation by utilizing features from a pretrained visual encoder. The challenge lies in selecting which layers of the encoder to use for creating a shared latent space, balancing between preserving fine details and improving generation quality. The authors propose FuseReg, a method that trains on random subsets of encoder layers instead of relying on fixed heuristics, which helps mitigate issues from layer disagreements. Their experiments demonstrate that FuseReg improves reconstruction quality and generation metrics significantly, showing that robust layer fusion can effectively bridge the gap between reconstruction and generation tasks.'}, 'zh': {'title': '灵活的层融合，提升图像生成质量', 'desc': '本论文介绍了一种新的方法FuseReg，用于改进图像生成中的表示自编码器（RAEs）。该方法通过训练随机选择的编码器层来替代固定的启发式特征选择，从而提高了重建和生成的灵活性。研究表明，FuseReg能够在不重新训练的情况下，显著提高图像重建的质量和生成的效果。通过联合正则化，FuseReg在不同阶段的训练中减少了重建与生成之间的差距，展示了其在图像生成任务中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2609.31394', 'title': 'InternW0-Δ: A World Action Model Bridging Predictive Dynamics and Actions with 20K+ Hours of Open Data', 'url': 'https://huggingface.co/papers/2609.31394', 'abstract': 'Abstract  World Action Models (WAMs) jointly model visual dynamics and action generation for generalist robot manipulation. A central challenge is to integrate priors from large-scale pretrained models---including visual dynamics, scene semantics, geometry, and motion---into a unified framework for robot action generation. We introduce InternW0-Δ, a unified WAM pretrained on a heterogeneous corpus that outperforms prior methods across simulation benchmarks and real-robot platforms.   InternW0-Δ combines pretrained visual dynamics, scene-level semantics, 4D geometric and motion priors, and action generation within a Mixture-of-Transformers (MoT) framework. A pretrained video expert and an action expert interact under semantic guidance from a frozen VLM, while a pretrained 4D foundation model injects geometric and motion priors through training-only distillation. We further introduce Causal Imprint, which learns future-relevant scene changes from training-only future supervision and provides predictive representations directly to the action expert without future-video rollout at inference.   For large-scale joint training, we construct a heterogeneous corpus of robot demonstrations, UMI data, egocentric human demonstrations, and Ego2Robot data, curated and aligned under a common state-action representation. The resulting corpus contains over 20K hours of processed training data, to our knowledge the largest open-source corpus of its kind. We pretrain InternW0-Δ on this corpus and demonstrate strong performance across simulation benchmarks and real-robot platforms. We will open source the training code, model weights, infrastructure, data-processing pipeline, and processed data where licenses permit. Project page: https://internrobotics.github.io/InternW0-Delta/', 'score': 3, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': 'bda37519edbba0ad', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#multimodal', '#architecture', '#robotics', '#video', '#training'], 'emoji': '🤖', 'ru': {'title': 'Единая предварительно обученная модель для универсальной робототехнической манипуляции через интеграцию множественных приоров', 'desc': 'В работе представлен InternW0-Δ — объединённая World Action Model, которая совместно моделирует визуальную динамику и генерацию действий для манипуляции роботом. Модель интегрирует предварительно обученные компоненты (визуальную динамику, семантику сцены, геометрические и кинематические приоры) в единый архитектурный каркас на основе Mixture-of-Transformers. Авторы предложили метод Causal Imprint для обучения предсказательных представлений будущих изменений сцены, что позволяет избежать развёртывания видео во время инференса. Модель обучена на гетерогенном корпусе из 20K часов роботизированных и человеческих демонстраций и показывает превосходные результаты как в симуляционных бенчмарках, так и на реальных робото-платформах.'}, 'en': {'title': 'Unified Action Models for Enhanced Robot Manipulation', 'desc': 'The paper presents World Action Models (WAMs) that integrate visual dynamics and action generation for robots. It introduces InternW0-Δ, a unified model that leverages large-scale pretrained data to enhance robot manipulation capabilities. The model combines various priors, including visual dynamics and geometric information, within a Mixture-of-Transformers framework. Additionally, it employs a novel technique called Causal Imprint to improve predictive representations for action generation without needing future video rollouts during inference.'}, 'zh': {'title': '统一的世界动作模型，提升机器人操作能力', 'desc': '本文介绍了世界动作模型（WAMs），它们用于联合建模视觉动态和机器人操作的动作生成。研究的核心挑战是将大规模预训练模型的先验知识整合到一个统一的框架中，以便生成机器人动作。我们提出了InternW0-Δ，这是一种在异构语料库上预训练的统一WAM，能够在模拟基准和真实机器人平台上超越以往的方法。该模型结合了预训练的视觉动态、场景语义、4D几何和运动先验，并在Mixture-of-Transformers框架内进行动作生成。'}}}, {'id': 'https://huggingface.co/papers/2609.31473', 'title': 'Game Arena: Strategic LLM Evaluation in Competitive Environments', 'url': 'https://huggingface.co/papers/2609.31473', 'abstract': "Abstract  We introduce Kaggle Game Arena, an open and ever-expanding platform to evaluate large language models (LLMs) through competitive games. Different from static benchmarks, game arena enables models to play head-to-head matchups in structured environments where the gameplay strength naturally increases as models evolve, preventing performance saturation. This technical report details the infrastructure behind Game Arena and describes the three pilot game environments: Chess, Poker, and Werewolf. These environments span perfect information, imperfect information, and multiplayer game settings, enabling a systematic study of models' strategic planning, adaptation, and robustness under uncertainty. For each game, we provide a detailed description of the environment, evaluation metrics, and results from running full competitions across models. Through robust infrastructure and large-scale ground-truth based evaluation, Game Arena ensures reproducibility, transparency and generalizability to new games and variants over time.", 'score': 2, 'issue_id': 3344, 'pub_date': '2026-09-25', 'pub_date_card': {'ru': '25 сентября', 'en': 'September 25', 'zh': '9月25日'}, 'hash': '6fbf8a8214f7c1fe', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🎮', 'ru': {'title': 'Играем и учимся: оценка LLM через игры', 'desc': 'Kaggle Game Arena — это платформа для оценки LLM через соревновательные игры. В отличие от статических тестов, здесь модели играют друг против друга, что позволяет избежать насыщения производительности. В отчёте описываются три пилотные игры: шахматы, покер и мафия, которые помогают изучать стратегическое планирование и адаптацию моделей. Платформа обеспечивает воспроизводимость и прозрачность результатов, а также возможность добавления новых игр.'}, 'en': {'title': 'Kaggle Game Arena: Leveling Up Language Models Through Competition', 'desc': "The paper presents Kaggle Game Arena, a platform designed to assess large language models (LLMs) through competitive gameplay. Unlike traditional benchmarks, this arena allows models to compete against each other in dynamic environments, which helps to measure their performance as they improve. The report outlines the technical framework of the Game Arena and introduces three initial game environments: Chess, Poker, and Werewolf, each representing different types of information and player interactions. By providing structured evaluations and metrics, the platform aims to enhance the understanding of models' strategic capabilities and adaptability in uncertain scenarios."}, 'zh': {'title': 'Kaggle游戏竞技场：评估语言模型的新平台', 'desc': '我们介绍了Kaggle游戏竞技场，这是一个开放且不断扩展的平台，用于通过竞争游戏评估大型语言模型（LLMs）。与静态基准测试不同，游戏竞技场允许模型在结构化环境中进行面对面的对抗，随着模型的进化，游戏的强度自然增加，从而防止性能饱和。该技术报告详细介绍了游戏竞技场的基础设施，并描述了三个试点游戏环境：国际象棋、扑克和狼人游戏。这些环境涵盖了完美信息、不完美信息和多人游戏设置，使得对模型的战略规划、适应能力和在不确定性下的鲁棒性进行系统研究成为可能。'}}}, {'id': 'https://huggingface.co/papers/2609.29050', 'title': 'SLCA-GRPO: Resolving Cross-Segment Credit Misattribution in Tool-Calling RL', 'url': 'https://huggingface.co/papers/2609.29050', 'abstract': 'Abstract  Tool-calling agents produce heterogeneous outputs, interleaving structured tool invocations with user-facing natural language summaries. This output heterogeneity presents a structural failure mode in standard on-policy Reinforcement Learning (RL): algorithms like GRPO indiscriminately broadcast a homogeneous trajectory-level scalar advantage to all tokens. Consequently, gradient noise from summary generation leaks into tool-decision tokens, causing cross-segment credit misattribution and brittle optimization. In this work, we propose SLCA-GRPO, a framework incorporating Segment-Locked Credit Assignment (SLCA). To enable scalable exploration without costly real APIs and stable training, we first construct the Schema-Guided LLM Simulator (SGLS) as foundational training infrastructure. Building on this, SLCA decouples advantage estimation at the structural segment level within a single group of rollouts, without requiring additional rollouts from intermediate states. Supported by Hierarchical Rewards (HierR), SLCA routes execution advantages to tool tokens and preference advantages to summary tokens, eliminating advantage contamination (the dominant cross-segment credit misattribution channel) within each policy update. On a 7B backbone, SLCA-GRPO accelerates convergence and outperforms standard GRPO, ToolPO, and RLTR by +2.53 pp on in-domain evaluation, +1.36 pp on the Berkeley Function-Calling Leaderboard (BFCL), and +9.15 pp on τ^2-Bench under the same training budgets, achieving higher accuracy with reduced tool redundancy and costs.', 'score': 1, 'issue_id': 3344, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'bca2cd56a6980dd6', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#agents', '#training'], 'emoji': '🔧', 'ru': {'title': 'Правильное распределение градиентов в многозадачных языковых агентах', 'desc': 'В работе предложен метод SLCA-GRPO для обучения агентов, которые одновременно генерируют структурированные вызовы инструментов и естественноязычные ответы. Основная проблема заключается в том, что стандартные алгоритмы RL типа GRPO неправильно распределяют градиенты между разными типами токенов, что приводит к неправильной оценке вклада каждого токена в результат. Авторы вводят Segment-Locked Credit Assignment (SLCA), которая отдельно оценивает значение (advantage) для токенов инструментов и резюме, используя иерархические награды. Кроме того, они создают Schema-Guided LLM Simulator для стабильного обучения без использования дорогостоящих API, что позволяет достичь лучших результатов и ускорить сходимость алгоритма.'}, 'en': {'title': 'Enhancing Tool-Calling Agents with SLCA-GRPO for Better RL Performance', 'desc': 'This paper addresses the challenges faced by tool-calling agents in Reinforcement Learning (RL) due to the mixed outputs of structured tool calls and natural language summaries. The authors introduce SLCA-GRPO, a new framework that uses Segment-Locked Credit Assignment (SLCA) to improve the credit assignment process during training. By utilizing the Schema-Guided LLM Simulator (SGLS), SLCA allows for better advantage estimation at the segment level, which helps to prevent gradient noise from affecting tool decision-making. The results show that SLCA-GRPO significantly enhances performance and convergence speed compared to existing methods, leading to improved accuracy and reduced costs in tool usage.'}, 'zh': {'title': '提升工具调用代理的优化效率', 'desc': '本文提出了一种新的框架SLCA-GRPO，旨在解决工具调用代理在生成输出时的异质性问题。传统的强化学习算法在处理这些异质输出时，容易导致梯度噪声和信用错误归因，从而影响优化效果。SLCA通过在结构段级别解耦优势估计，避免了不同输出之间的优势污染，提高了训练的稳定性和效率。实验结果表明，SLCA-GRPO在多个评估指标上均优于传统方法，显示出更高的准确性和更低的工具冗余。'}}}, {'id': 'https://huggingface.co/papers/2609.28660', 'title': 'Morphometric Imitation: From Morphology and Contact Aware Hand Retargeting to Sim-to-Real Visuomotor Policy', 'url': 'https://huggingface.co/papers/2609.28660', 'abstract': 'Abstract  Human hand-object interactions (HOIs) provide a rich source of demonstrations for dexterous manipulation, but learning directly from them presents challenges in bridging morphology gaps, ensuring dynamical feasibility, and sim-to-real deployment. We present Morphometric Imitation, a three-stage framework that transforms reconstructed HOIs into zero-shot sim-to-real visuomotor policies. First, morphometric optimization (MMO) kinematically retargets human motion across hand morphologies while preserving demonstrated contacts. Second, residual reinforcement learning (RL) refines the kinematic reference using object pose and contact information from the human motion to produce dynamically feasible robot demonstrations. Third, these demonstrations are distilled into visuomotor policies. Across three robot hands and ten HOIs, MMO improves contact F1 over the strongest of five baselines by at least 8 points for every hand, while also improving the success rate of downstream dynamic retargeting by as much as 35 points. Ablations on the residual RL show complementary benefits from using object pose and contact information. Finally, the visuomotor policies achieve 89.3% zero-shot success in 300 real-world trials on 30 objects. Project page: https://morphometricimitation.github.io{this https URL}', 'score': 1, 'issue_id': 3344, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '72320598eee2467c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'От человеческих жестов к роботизированной ловкости через морфометрический перенос', 'desc': 'В работе предлагается фреймворк Morphometric Imitation для преобразования видеозаписей взаимодействия человека с объектами в политики управления роботизированными руками. Метод состоит из трёх этапов: морфометрическая оптимизация для кинематического переноса движений между разными морфологиями рук с сохранением контактов, обучение с подкреплением для обеспечения динамической реализуемости движений робота, и дистилляция полученных траекторий в визуомоторные политики. Подход обеспечивает значительное улучшение качества переноса контактов и успешности динамического переноса движений на всех протестированных роботизированных руках. Полученные визуомоторные политики достигают 89.3% успеха в реальных экспериментах без каких-либо адаптаций к конкретным объектам.'}, 'en': {'title': 'Transforming Human Motion for Robotic Dexterity', 'desc': 'This paper introduces Morphometric Imitation, a framework designed to learn from human hand-object interactions (HOIs) for robotic manipulation. It consists of three stages: first, morphometric optimization (MMO) adapts human motion to different hand shapes while keeping the same contact points. Next, residual reinforcement learning (RL) fine-tunes these motions to ensure they are dynamically feasible for robots. Finally, the refined demonstrations are converted into visuomotor policies, achieving high success rates in real-world applications.'}, 'zh': {'title': '形态模仿：从人手交互到机器人运动的桥梁', 'desc': '本文提出了一种名为形态模仿的三阶段框架，用于将重建的人手物体交互（HOIs）转化为零-shot的仿真到现实的视觉运动策略。首先，通过形态优化（MMO）在保持接触的同时，针对不同手部形态对人类运动进行运动学重定向。其次，利用残差强化学习（RL）结合物体姿态和接触信息，优化运动学参考，生成动态可行的机器人演示。最后，这些演示被提炼为视觉运动策略，在300个真实世界试验中实现了89.3%的零-shot成功率。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (1)', '#agi', '#alignment', '#architecture (2)', '#audio', '#benchmark', '#cv (1)', '#data', '#dataset (1)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (1)', '#open_source', '#optimization (1)', '#plp', '#rag', '#reasoning', '#rl (2)', '#rlhf', '#robotics (2)', '#science', '#security', '#small_models', '#story_generation', '#survey', '#synthetic', '#training (4)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-28 02:46',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-28 02:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-28 02:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
