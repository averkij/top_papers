    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.39601', 'title': 'GroundingPI: A Grounding Foundation Model towards Physical Intelligence with Visual Primitives', 'url': 'https://huggingface.co/papers/2609.39601', 'abstract': "Abstract  Precise grounding matters. It specifies which object is the target and where that object is, even in clutter and for tiny objects, and it has to be fast enough for closed-loop control. Yet vision-language-action (VLA) and world-action models (WAMs) take perception from general-purpose vision-language and video-generation backbones, which still fail in these settings. We introduce GroundingPI, a 4B grounding foundation model that generates points and boxes as quantized coordinates in a shared vocabulary. Training combines multimodal and spatial pretraining, supervised fine-tuning, and reinforcement learning with GRPO, using supervision from public datasets and dedicated data engines. Against 44 baselines across 34 grounding benchmarks spanning 11 perceptual capabilities, GroundingPI establishes a new state of the art, averaging 73.68%, above the larger GPT-6 Astra (71.54%). As a downstream visual backbone, GroundingPI improves performance on robotic manipulation and autonomous driving. On RoboTwin 2.0, it outperforms every mainstream backbone we evaluate in all four out-of-distribution settings, by up to 24.8% relative to the strongest backbone. On RoboCasa-GR1, GroundingPI trained with 50% of the demonstrations outperforms those baselines trained with 75%. On nuScenes, used as the visual backbone, GroundingPI attains an average open-loop L2 error of 0.296 m. We systematically analyze GroundingPI's pretraining in scale and data composition. Downstream autonomous driving and robotic manipulation improve as the pretraining is scaled. Analyzing the data recipe across these 11 perceptual capabilities shows dense grounding's substantial benefits for both, and OCR's potential as a catalyst for perceptual learning. These results support grounding as a perceptual foundation, and dedicated perceptual pretraining as a promising direction for foundation models of physical intelligence.", 'score': 246, 'issue_id': 3403, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '0764972508699f88', 'authors': ['Qize Yu', 'Lianrui Fan', 'Boyu Chen', 'Jiaqi Liang', 'Xini Ding', 'Yue Chen', 'Zetian Song', 'Yuran Wang', 'Yi Zou', 'Kaixuan Wang', 'Tianxing Chen', 'Wenxuan Song', 'Bohan Zhou', 'Mingleyang Li', 'Siqiao Huang', 'Yuqi Ye', 'Caigao Jiang', 'Wei Wei', 'Ruihai Wu', 'Hang Zhang', 'Yixiao Ge', 'Shuchang Zhou', 'Shilong Liu', 'Xianming Liu', 'Ping Luo', 'Shiyu Huang'], 'affiliations': ['HKUST (GZ)', 'National University of Singapore', 'Peking University', 'Princeton University', 'The University of Hong Kong', 'Tsinghua University', 'University of California, Berkeley', 'XPeng Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.39601.jpg', 'data': {'categories': ['#open_source', '#training', '#robotics', '#benchmark', '#dataset', '#multimodal', '#optimization', '#cv', '#rl'], 'emoji': '🎯', 'ru': {'title': 'Точная локализация как основа восприятия для физического интеллекта', 'desc': 'Авторы представляют GroundingPI — большую модель основания размером 4 млрд параметров, специализированную на точной локализации объектов в изображениях через генерацию точек и ограничивающих прямоугольников. Модель обучается комбинацией мультимодального предварительного обучения, супервизируемого дообучения и обучения с подкреплением по методу GRPO на данных из открытых датасетов и специализированных конвейеров разметки. GroundingPI достигает новых рекордов на 34 бенчмарках локализации, превосходя даже более крупную GPT-6 Astra в среднем на 73.68%. Как визуальный позвоночник для моделей роботических манипуляторов и автономного вождения, модель значительно улучшает их производительность, включая обучение с меньшим количеством демонстраций и лучшую обобщаемость в распределённо-сдвинутых сценариях.'}, 'en': {'title': 'GroundingPI: Precision in Object Localization for Intelligent Systems', 'desc': 'The paper introduces GroundingPI, a new grounding foundation model designed to improve the precision of object localization in complex environments. It utilizes a combination of multimodal and spatial pretraining, supervised fine-tuning, and reinforcement learning to generate accurate coordinates for objects. GroundingPI outperforms existing models in various benchmarks, achieving a new state of the art in grounding tasks and enhancing performance in robotic manipulation and autonomous driving. The findings suggest that dedicated perceptual pretraining significantly benefits physical intelligence applications.'}, 'zh': {'title': 'GroundingPI：精确定位的基础模型', 'desc': '本文介绍了一种新的基础模型GroundingPI，专注于精确定位目标物体，尤其是在复杂环境和小物体的情况下。该模型通过生成量化坐标的点和框，结合多模态和空间预训练、监督微调以及强化学习，显著提高了在多个基准测试中的表现。GroundingPI在机器人操作和自动驾驶等下游任务中表现优异，超越了现有的主流模型。研究结果表明，专门的感知预训练对物理智能基础模型的发展具有重要意义。'}}}, {'id': 'https://huggingface.co/papers/2610.11765', 'title': 'Thinking Inertia: LLMs Keep Thinking When Told Not To', 'url': 'https://huggingface.co/papers/2610.11765', 'abstract': 'Abstract  Large Language Models (LLMs) increasingly ship with explicit "thinking modes", yet their counterpart, "no-thinking", has received far less attention. We study LLMs\' no-thinking behavior along two axes. a. How to measure no-thinking? Prior work typically defines no-thinking through proxies such as a disabled thinking mode or the absence of long traces. These proxies are unreliable: disabled thinking modes may still emit reasoning, while long traces may contain filler rather than genuine inference. We instead normalize each response into a pre-answer trace and final answer, and evaluate it at three levels: (i) Empty-Thinking Rate for strict answer-only compliance; (ii) instruction-aware Question-Pre-answer Relevance for similarity between the question and pre-answer trace; and (iii) LLM-as-judge Explicit Inference Rate for visible explicit inference. Together, these metrics distinguish answer-only output, relevant but non-inferential text, and explicit inference. b. How does no-thinking vary across tasks and models? We evaluate six prompting interventions on six LLMs across Boolean, multiple-choice, and open-ended questions. We find that explicit no-think controls cannot reliably eliminate visible inference. Models instead exhibit "Thinking Inertia": explicit inference persists even under strict controls and becomes more prevalent as the answer space opens. Accuracy remains stable on Boolean and multiple-choice tasks, whereas open-ended tasks reveal a trade-off between answer-only compliance and task accuracy. Rewriting the same questions across answer spaces shows that supplying candidate answers makes answer-only responses easier to produce. These findings establish no-thinking as a non-trivial capability: stopping explicit reasoning cannot be assumed from model settings or instructions alone and deserves systematic evaluation alongside reasoning ability.', 'score': 215, 'issue_id': 3402, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '9131388e94a5366d', 'authors': ['Dianqiao Lei', 'Kevin Qinghong Lin', 'Pan Lu', 'Philip Torr', 'James Zou'], 'affiliations': ['STANFORD UNIVERSITY', 'TSINGHUA UNIVERSITY', 'UNIVERSITY OF OXFORD'], 'pdf_title_img': 'assets/pdf/title_img/2610.11765.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Инерция мышления: почему модели не могут остановить рассуждение по команде', 'desc': "В статье исследуется поведение больших языковых моделей в режиме без явного мышления, в противоположность режимам с активированным 'thinking'. Авторы предлагают новые метрики для измерения качества ответов без рассуждений: метрика пустого мышления для проверки ответов без предварительных рассуждений, релевантность вопроса и предварительного ответа, и оценка явных логических выводов через LLM-судью. Исследование показало, что модели демонстрируют 'инерцию мышления': явные рассуждения сохраняются даже при строгих ограничениях и усиливаются по мере расширения пространства ответов. Работа подчёркивает, что способность моделей давать ответы без видимых рассуждений является сложным навыком, требующим систематической оценки наряду с оценкой способности к логическому анализу."}, 'en': {'title': 'Understanding No-Thinking in Large Language Models', 'desc': "This paper investigates the 'no-thinking' behavior of Large Language Models (LLMs), which is less studied compared to their 'thinking modes'. It introduces new metrics to measure no-thinking, focusing on how strictly models can provide answers without engaging in reasoning. The study finds that even with controls in place, models often display 'Thinking Inertia', where inference continues to appear in responses. Additionally, the research highlights a trade-off between compliance with answer-only outputs and accuracy in open-ended tasks, suggesting that no-thinking is a complex capability that requires careful evaluation."}, 'zh': {'title': '无思考能力：超越模型设置的复杂性', 'desc': '本文研究了大型语言模型（LLMs）在"无思考"状态下的表现。我们提出了一种新的测量方法，通过规范化每个响应为预回答轨迹和最终回答，评估无思考行为的三个层面。研究发现，尽管有明确的无思考控制，模型仍然表现出"思维惯性"，即在严格控制下显式推理依然存在。我们的结果表明，无思考能力是一个复杂的特性，不能仅通过模型设置或指令来假设，值得与推理能力一起进行系统评估。'}}}, {'id': 'https://huggingface.co/papers/2610.13361', 'title': 'AgentSWE: Can Coding Agents Build the Agent You Actually Want?', 'url': 'https://huggingface.co/papers/2610.13361', 'abstract': "Abstract  As the production of software passes into the hands of software itself, coding agents are increasingly commissioned to build agents fitted to their users' own workflows. This delegation carries a quiet assumption, that the delivered agent will faithfully serve the requirement it was built for, rather than merely appear to. No existing benchmark tests that assumption. We introduce AgentSWE, a benchmark for agent software engineering spanning three stages of the agent development lifecycle: Creation of a complete agent from a natural-language requirement, Editing of production agent codebases, and Optimization toward a measurable target. Each of its 25 tasks is framed as a commission rather than an exam: the builder iterates against a handful of illustrative cases, while acceptance exercises the frozen submission on held-out cases designed to span the full requirement, grading behavior against requirement-derived rubrics under hard pass/fail gates or, for Optimization, against the source benchmark's own objective. Evaluating a range of coding agents across models and harnesses, we find that none comes close to delivering what a requirement asks for: the gap between what a builder demonstrates and what it delivers is the norm, not the corner case. An accompanying empirical analysis of the failure trajectories identifies recurring failure modes, among them overfitting to the visible cases, hollow runtimes behind code that looks complete, and unsupported claims of completion, each a signal by which coding agents can learn to build the agents they are asked for.", 'score': 201, 'issue_id': 3403, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'eb765c36d6e43d75', 'authors': ['Jiahao Wang', 'Hongjin Qian', 'Yuyang Hu', 'Jiajun Zhang', 'Zheng Liu'], 'affiliations': ['Beijing Academy of Artificial Intelligence', 'Institute of Automation, Chinese Academy of Sciences', 'Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.13361.jpg', 'data': {'categories': ['#benchmark', '#agents', '#plp'], 'emoji': '🤖', 'ru': {'title': 'Проверка верности: как убедиться, что AI-агенты делают то, что их просят', 'desc': 'В статье представлен AgentSWE — первый бенчмарк для оценки агентов, которые разрабатывают другие агенты на основе естественного языка. Бенчмарк охватывает три этапа разработки: создание агента с нуля из требований, редактирование существующего кода агента и оптимизацию под конкретные метрики. Исследование показало, что существующие coding-агенты часто не соответствуют исходным требованиям: между тем, что агент демонстрирует на примерах, и тем, что он реально выполняет, часто возникает значительный разрыв. Авторы выявили типичные ошибки агентов, включая переобучение на видимых примерах, неполную реализацию кода и ложные утверждения о завершении задачи.'}, 'en': {'title': 'Bridging the Gap: Evaluating Coding Agents with AgentSWE', 'desc': 'This paper introduces AgentSWE, a benchmark designed to evaluate coding agents in software engineering. It focuses on three key stages: creating agents from natural language requirements, editing existing codebases, and optimizing performance towards specific goals. The benchmark consists of 25 tasks that assess how well coding agents meet user requirements, highlighting the common discrepancies between expected and actual performance. The study reveals that current coding agents often fail to deliver on their promises, identifying specific failure modes that can inform future improvements in agent development.'}, 'zh': {'title': '代理软件工程的新基准测试', 'desc': '随着软件生产逐渐由软件自身掌控，编码代理被越来越多地委托来构建适合用户工作流程的代理。这种委托隐含着一个假设，即交付的代理将忠实地满足其构建的需求，而不仅仅是表面上看起来如此。为此，我们提出了AgentSWE，这是一个涵盖代理开发生命周期三个阶段的基准测试，包括从自然语言需求创建完整代理、编辑生产代理代码库以及朝向可测量目标的优化。我们的研究发现，现有的编码代理在满足需求方面普遍存在差距，表明构建者展示的与实际交付之间的差距是常态，而非特例。'}}}, {'id': 'https://huggingface.co/papers/2610.13166', 'title': 'Scaling Agentic Data for Long-Horizon Terminal Intelligence', 'url': 'https://huggingface.co/papers/2610.13166', 'abstract': "Abstract  Terminal agents are moving beyond local operations toward completing real-world professional tasks. Short trajectories can demonstrate commands and tool calls, but they do not fully show how agents accumulate evidence through exploration, use it to inform judgments, continually adjust strategies based on feedback, and turn intermediate results into final deliverables. High-quality long-horizon trajectories capture these agentic behavioral patterns and their connections within a single problem-solving process, providing richer experience for sustained autonomous work. However, environment synthesis may complete or simplify the key work underlying these patterns in advance and thus remove the need for exploration, implementation, and verification that the agent was meant to perform. To address this, we introduce TerminalHorizon, a fully automated data synthesis engine for long-horizon terminal agents. Starting from real-world professional work, it uses independent execution to identify key work omitted during construction and uses the resulting evidence to guide environment reconstruction. To extend these patterns across stages, it progressively expands tasks under the same goal, introducing new requirements that build on prior results and call for further exploration and improvement. Using this engine, we construct 1.5K task environments and perform supervised fine-tuning of Qwen3.5-27B on the resulting dataset to obtain TerminalHorizon-27B. We achieve substantial performance gains on all 12 benchmarks spanning coding-agent tasks, agentic tasks in real-world production settings, and general reasoning. Multiple RSI case studies, each with a 12-hour research budget, further demonstrate the model's ability to continue experimenting beyond an initial solution, improve its methods based on feedback, and retain effective improvements in its final deliverables.", 'score': 134, 'issue_id': 3403, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'c37267f76744859c', 'authors': ['Shun Zou', 'Ziyu Ma', 'Yi Zou', 'Yong Wang', 'Lin Chen', 'Zehui Chen', 'Guanhua Chen', 'Xiangxiang Chu', 'Feng Zhao'], 'affiliations': ['AMAP, Alibaba Group', 'Southern University of Science and Technology', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2610.13166.jpg', 'data': {'categories': ['#data', '#training', '#benchmark', '#dataset', '#agents', '#synthetic', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'От коротких команд к долгосрочной автономии: синтез данных для профессиональных агентов', 'desc': 'В статье представлена TerminalHorizon — автоматизированная система синтеза данных для обучения агентов, способных выполнять долгосрочные профессиональные задачи. Авторы предлагают метод создания качественных траекторий, которые отражают реальные процессы исследования, адаптации стратегий и верификации результатов, а не просто демонстрируют отдельные команды. Система использует независимое выполнение для выявления пропущенных этапов работы и прогрессивного расширения задач с новыми требованиями, что способствует более глубокому обучению. На полученном датасете из 1.5K задач произведена fine-tuning модели Qwen3.5-27B, показавшей значительные улучшения на всех 12 бенчмарках по кодированию, production-задачам и рассуждениям.'}, 'en': {'title': 'Empowering Agents with Long-Horizon Exploration and Adaptation', 'desc': "This paper presents TerminalHorizon, an automated data synthesis engine designed for long-horizon terminal agents that perform complex professional tasks. It emphasizes the importance of high-quality trajectories that reflect an agent's ability to explore, learn from feedback, and adapt strategies over time. By reconstructing environments based on real-world tasks, TerminalHorizon enables agents to engage in deeper exploration and iterative improvement rather than relying on pre-synthesized data. The results show significant performance enhancements across various benchmarks, demonstrating the model's capability to refine its approach and deliver superior outcomes in real-world applications."}, 'zh': {'title': '提升智能体任务表现的终端引擎', 'desc': '本文介绍了一种名为TerminalHorizon的自动化数据合成引擎，旨在提升终端智能体在复杂任务中的表现。该引擎通过独立执行识别在环境构建中遗漏的关键工作，并利用这些证据指导环境重建。它逐步扩展任务，增加新的要求，以促进智能体在探索和改进中的持续学习。通过对Qwen3.5-27B进行监督微调，TerminalHorizon-27B在多个基准测试中表现出显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2610.09326', 'title': 'VIS-Ground: Video Interactive Storytelling with Contextual Grounding', 'url': 'https://huggingface.co/papers/2610.09326', 'abstract': "Abstract  Video interactive storytelling enables viewers to actively steer how a video unfolds. However, once we allow viewers to intervene during generation, a new challenge arises: The viewer's request can have latent dependencies on both the grounding source and the current rendered video state. These dependencies may not be explicitly stated in any individual input, but emerge only when the source, rendered history, and new viewer intent are considered jointly. Existing interactive video generation systems primarily emphasize following viewer instructions, while source-grounded video generation methods focus on aligning generated content with an external narrative or knowledge source. This leaves a fundamental question underexplored: What context should a generation model ground on during interactive continuation, and how can heterogeneous, unstructured inputs be transformed into such grounding context? In this work, we formulate contextual grounding as the process of transforming heterogeneous input context into an executable constraint model for video generation. To address this challenge, we introduce VIS-Ground, which performs Structured Context Abstraction to recover grounded states and cross-context dependencies, Generation Constraints Induction to project relevant dependencies into candidate-specific constraints, and Constrained Video Generation to enforce these constraints through planning, verification, revision, and rendering. Across three video generation backbones, VIS-Ground consistently achieves the highest overall composite score, reaching an average absolute improvement of 10.3 points over the strongest per-backbone baselines. Detailed analysis further shows gains across both narrative and knowledge grounding, and reveals remaining challenges in dependency extraction, and faithful realization during video rendering.", 'score': 79, 'issue_id': 3403, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'c9c957df552e8578', 'authors': ['Bingxuan Li', 'Yiwen Song', 'Xueqing Wu', 'Yanzhou Pan', 'Yang Li', 'Kuang Su', 'Jingyun Liu', 'Sebastian Ko', 'Huan Zhang', 'Tong Zhang', 'Nanyun Peng', 'Tomas Pfister', 'Yale Song'], 'affiliations': ['Google', 'University of California, Los Angeles', 'University of Illinois at Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.09326.jpg', 'data': {'categories': ['#multimodal', '#video', '#story_generation'], 'emoji': '🎬', 'ru': {'title': 'Контекстная грундировка для интерактивной генерации видео с учётом скрытых зависимостей', 'desc': 'В работе предложен метод VIS-Ground для интерактивного создания видео, который решает проблему скрытых зависимостей между пожеланиями зрителя, исходным контентом и уже отрендеренным видео. Система использует трёхэтапный подход: сначала выполняется структурированная абстракция контекста для восстановления состояний и взаимозависимостей, затем индукция ограничений для проецирования зависимостей в специфические для каждого варианта ограничения, и наконец генерация видео с принудительным соблюдением этих ограничений через планирование и верификацию. Экспериментальные результаты показывают, что VIS-Ground превосходит существующие базовые модели в среднем на 10.3 пункта по композитной метрике и демонстрирует улучшения как в нарративной, так и в знаниевой грундировке видео.'}, 'en': {'title': 'Grounding Viewer Intent for Enhanced Interactive Video Generation', 'desc': 'This paper presents VIS-Ground, a novel approach to video interactive storytelling that addresses the challenge of grounding viewer requests in the context of both the source material and the current video state. It introduces a method for transforming diverse and unstructured inputs into a structured model that can guide video generation effectively. The approach includes techniques for recovering grounded states, inducing generation constraints, and enforcing these constraints during the video creation process. The results demonstrate significant improvements in video generation quality, highlighting the importance of context in interactive storytelling.'}, 'zh': {'title': '视频生成中的上下文转换与约束实现', 'desc': '视频互动叙事允许观众主动控制视频的发展。然而，当观众在生成过程中进行干预时，会出现新的挑战：观众的请求可能与基础来源和当前渲染视频状态之间存在潜在依赖关系。这些依赖关系在单个输入中可能并未明确表达，但只有在考虑来源、渲染历史和新的观众意图时才会显现出来。为了解决这个问题，我们提出了VIS-Ground，通过结构化上下文抽象、生成约束诱导和受约束视频生成来实现上下文的转换，从而提高视频生成的质量和一致性。'}}}, {'id': 'https://huggingface.co/papers/2609.39600', 'title': 'GroundAnything: Reconciling Parallel Decoding with Precise Visual Grounding at Flash Speed', 'url': 'https://huggingface.co/papers/2609.39600', 'abstract': 'Abstract  Autoregressive (AR) grounding models serialize spatial predictions, introducing sequential latency and imposing a causal order on output tokens. We view grounding as visual evidence extraction: objects, locations, and spatial relations are jointly constrained by the image and query, yet their dependencies do not imply an intrinsic left-to-right generation order. This distinction makes bidirectional diffusion a natural fit, allowing spatial hypotheses to emerge in parallel and be jointly refined through iterative denoising. We introduce GroundAnything, a 4B-parameter grounding foundation model that reconciles fast parallel decoding with precise localization through blockwise denoising. Training combines grounding pretraining from public datasets and dedicated data engines, direct AR-to-diffusion conversion with joint AR and diffusion objectives, supervised fine-tuning, and GRPO-based reinforcement post-training. Across 30 grounding benchmarks, our autoregressive variant, GroundAnything-VLM, establishes a new overall state of the art among similarly sized models at 72.42%, remaining competitive with GPT-6 Astra (71.35%). With entropy-guided decoding, GroundAnything also surpasses the prior state of the art at this scale, averaging 61.75% versus 53.32% for the fast MTP-based LocateAnything model. We further explore decoding strategies, showing that an optional self-speculative mode achieves a 4.51times speedup over the AR counterpart with a 0.74 percentage-point drop in COCO F1mIoU. Infrastructure experiments show that progressive inference optimizations translate parallel decoding into practical speedups. These support efficient visual grounding in latency-sensitive real-world systems.', 'score': 71, 'issue_id': 3403, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '3539b788838934e2', 'authors': ['Qize Yu', 'Lianrui Fan', 'Bowen Ping', 'Xini Ding', 'Zetian Song', 'Junbo Niu', 'Kaixuan Wang', 'Tianxing Chen', 'Yue Chen', 'Minghua He', 'Yuran Wang', 'Jie Huang', 'Haojun Zhang', 'Min Chen', 'Hao Li', 'Wenxuan Song', 'Ruihai Wu', 'Xianming Liu', 'Shilong Liu', 'Shuchang Zhou', 'Ping Luo', 'Shiyu Huang'], 'affiliations': ['HKUST (GZ)', 'National University of Singapore', 'Peking University', 'Princeton University', 'The University of Hong Kong', 'University of California, Berkeley', 'XPeng Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2609.39600.jpg', 'data': {'categories': ['#inference', '#open_source', '#architecture', '#diffusion', '#training', '#benchmark', '#multimodal', '#optimization', '#cv'], 'emoji': '🎯', 'ru': {'title': 'Параллельное пространственное обоснование через двунаправленную диффузию вместо последовательной генерации', 'desc': 'Статья представляет GroundAnything — фундаментальную модель визуального обоснования размером 4B параметров, которая использует двунаправленную диффузию вместо автарегрессивного декодирования для параллельного извлечения пространственных доказательств из изображений. Авторы показывают, что пространственные предсказания (объекты, локализация и их отношения) не требуют левосторонней последовательности генерации, что позволяет выполнять параллельное декодирование с итеративным уточнением через блочный денойзинг. Модель обучается комбинацией предварительного обучения на открытых данных, прямого преобразования из автарегрессивной архитектуры в диффузионную, supervised fine-tuning и GRPO-based усиленным обучением. На 30 бенчмарках GroundAnything достигает новых результатов: автарегрессивный вариант показывает 72.42% точности, а при энтропийном декодировании превосходит предыдущие методы, демонстрируя 4.5-кратное ускорение с минимальной потерей качества.'}, 'en': {'title': 'GroundAnything: Fast and Accurate Visual Grounding with Bidirectional Diffusion', 'desc': 'This paper presents GroundAnything, a new grounding foundation model that improves the process of visual evidence extraction by using bidirectional diffusion instead of traditional autoregressive methods. By allowing spatial predictions to be generated in parallel, the model reduces latency and enhances the accuracy of object localization and spatial relationships. GroundAnything employs a combination of pretraining, fine-tuning, and innovative decoding strategies to achieve state-of-the-art performance on various benchmarks. The model demonstrates significant speed improvements while maintaining high precision, making it suitable for real-time applications in visual grounding tasks.'}, 'zh': {'title': '高效视觉定位的新突破：GroundAnything', 'desc': '本文提出了一种新的视觉定位模型GroundAnything，该模型通过双向扩散方法实现了空间假设的并行生成和联合优化。与传统的自回归模型不同，GroundAnything能够在不依赖左到右的生成顺序下，快速而准确地进行物体和空间关系的定位。该模型在多个基准测试中表现出色，超越了同类模型的性能，并在解码策略上实现了显著的速度提升。通过优化推理过程，GroundAnything为延迟敏感的实际应用提供了高效的视觉定位解决方案。'}}}, {'id': 'https://huggingface.co/papers/2610.13630', 'title': 'Multi-Stream Attention Residuals', 'url': 'https://huggingface.co/papers/2610.13630', 'abstract': 'Abstract  Attention Residuals (AttnRes) enables content-dependent retrieval over network depth, which can be viewed as single-stream softmax attention along the depth axis. Inspired by the success of multi-head attention along the sequence axis, we introduce Multi-Stream Attention Residuals (MSAR), an extension of AttnRes that generalizes this mechanism to multi-head depth attention, yielding substantial performance gains with minimal additional overhead. MSAR draws stream diversity from sequence context through multi-scale causal convolutions, allowing different heads to retrieve historical representations through distinct contextual views while preserving the integrity of the hidden representation. The retrieved streams are combined through lightweight adaptive mixing to generate the single-stream layer input. By retaining single-stream sources and expanding them on demand, MSAR supports multi-stream computation without requiring persistent multi-stream storage or communication. Across all 12 downstream benchmarks at the 18B and 28B MoE scales, MSAR consistently outperforms prior residual variants, including standard residual connections, manifold-constrained Hyper-Connections (mHC), and AttnRes. Scaling-law experiments yield an iso-loss compute speedup of 1.58times over the standard residual baseline, compared with 1.35times for AttnRes and 1.30times for mHC. These results make MSAR a promising residual architecture for large-scale pre-training.', 'score': 34, 'issue_id': 3402, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'c9629e3fdde3bc14', 'authors': ['Xiaohan Qin', 'Xiangdong Zhang', 'Tuo Dai', 'Sunan Zou', 'Huaijin Wu', 'Yebin Yang', 'Zhuo Xia', 'Lin Yao', 'Yuliang Liu', 'Junchi Yan'], 'affiliations': ['Dots Studio, Xiaohongshu Inc.', 'School of AI, Shanghai Jiao Tong University', 'School of CS, Peking University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.13630.jpg', 'data': {'categories': [], 'emoji': '🔗', 'ru': {'title': 'Многоголовочное внимание вглубь сети для эффективных остаточных соединений', 'desc': 'В работе предлагается Multi-Stream Attention Residuals (MSAR) — метод, который расширяет механизм внимания на ось глубины нейронной сети, позволяя извлекать представления из предыдущих слоёв с различных контекстных перспектив. Основная идея заключается в использовании многоголовочного внимания вдоль оси глубины сети, аналогично успешному применению этого подхода вдоль оси последовательности. Разнообразие потоков в MSAR достигается благодаря многомасштабным причинным свёртками, которые позволяют разным головам внимания выбирать исторические представления через отличающиеся контекстные виды. Экспериментально показано, что MSAR обеспечивает ускорение вычислений в 1.58 раза на наборах данных масштаба 18B и 28B MoE параметров, превосходя стандартные остаточные соединения и предыдущие методы.'}, 'en': {'title': 'Enhancing Attention with Multi-Stream Residuals', 'desc': "The paper introduces Multi-Stream Attention Residuals (MSAR), an advanced mechanism for enhancing attention in neural networks. MSAR builds on the concept of Attention Residuals (AttnRes) by incorporating multi-head attention along the depth axis, which improves performance while keeping computational costs low. It utilizes multi-scale causal convolutions to allow different attention heads to access varied historical representations, thus enriching the model's contextual understanding. The results show that MSAR significantly outperforms existing residual architectures in various benchmarks, making it a strong candidate for large-scale pre-training tasks."}, 'zh': {'title': '多流注意力残差网络：提升性能的新方法', 'desc': '本文介绍了一种新的多流注意力残差网络（MSAR），它在网络深度上实现了内容依赖的检索。MSAR是对现有注意力残差（AttnRes）的扩展，能够通过多头深度注意力机制显著提高性能。该方法利用多尺度因果卷积，从序列上下文中提取流的多样性，使不同的头能够通过不同的上下文视角检索历史表示。实验结果表明，MSAR在多个基准测试中表现优于传统的残差连接，显示出其在大规模预训练中的潜力。'}}}, {'id': 'https://huggingface.co/papers/2609.33304', 'title': 'Relevance Does Not Imply Applicability: Experience Activation for Personal GUI Agents', 'url': 'https://huggingface.co/papers/2609.33304', 'abstract': "Abstract  Personal Graphical User Interface (GUI) agents rely on interaction history to infer what a user wants from ambiguous instructions and to anticipate recurring routines. Existing approaches retrieve task-relevant history and append it to the policy's context, implicitly assuming that experience relevant to a task remains useful for each decision within it. We find that this help is largely spent at the first decision: retrieved history strongly improves the opening step of an episode, yet provides little sustained benefit over the remaining 90\\% of steps, and offers weak guidance on whether a proactive suggestion is warranted. A relevant record may tell the agent where to begin, but not which past action applies to the current screen or whether a routine is due now. The underlying issue is that relevance does not imply applicability}: relevance is determined at the task level, whereas applicability depends on the situation at decision time. We therefore recast personalization as experience activation and introduce ExpActivator, a training-free framework that activates only the experience applicable to the current situation. During execution, ExpActivator matches each new screen to historical states in the frozen GUI backbone's latent space and supplies the corresponding action as a reference. Before execution, it activates a recurring intent only when the current time and scenario provide sufficient support, and otherwise abstains. Across four GUI backbones, ExpActivator improves within-trajectory step success by 28\\% on average, achieves the best personalized execution on every backbone while using about one-fifth as many history tokens, and reaches approximately 2.3times the Matthews correlation coefficient of the strongest proactive baseline. Experience pays where it is activated, not where it is appended.", 'score': 29, 'issue_id': 3402, 'pub_date': '2026-09-27', 'pub_date_card': {'ru': '27 сентября', 'en': 'September 27', 'zh': '9月27日'}, 'hash': 'e562bde63fb3355a', 'authors': ['Fuyao Zhang', 'Xuan Wang', 'Zherui Li', 'Jiaming Zhang', 'Longtao Huang', 'Wei Yang Bryan Lim'], 'affiliations': ['Alibaba', 'NTU'], 'pdf_title_img': 'assets/pdf/title_img/2609.33304.jpg', 'data': {'categories': ['#agents'], 'emoji': '⚙️', 'ru': {'title': 'Активация опыта вместо его добавления: персонализация GUI агентов через применимость, а не релевантность', 'desc': 'Статья предлагает новый подход к персонализации GUI агентов, которые взаимодействуют с графическим интерфейсом на основе истории действий пользователя. Авторы выявили, что традиционный метод добавления релевантной истории в контекст политики малоэффективен: история помогает только на первом шаге, но не влияет на остальные 90% решений. Они предложили ExpActivator — фреймворк, который активирует только применимый опыт, сопоставляя текущий экран с исторических состояний в латентном пространстве и определяя, действительно ли нужно применить проактивное предложение. Экспериментальные результаты демонстрируют 28% улучшение успешности шагов внутри траектории и достижение лучших результатов при использовании в пять раз меньше токенов истории.'}, 'en': {'title': 'Activating Relevant Experience for Better GUI Decisions', 'desc': 'This paper discusses a new approach for Personal Graphical User Interface (GUI) agents that improves how they use past interaction history to make decisions. The authors introduce a framework called ExpActivator, which focuses on activating only the relevant past experiences that apply to the current situation, rather than just appending all past experiences to the decision-making process. They found that traditional methods provide limited benefits after the initial decision, as relevance does not guarantee applicability in different contexts. By using ExpActivator, the agents showed a significant improvement in decision-making success, demonstrating that experience is most valuable when it is contextually activated.'}, 'zh': {'title': '激活经验，提升决策效率', 'desc': '个人图形用户界面（GUI）代理依赖于交互历史来推断用户的意图，并预测重复的操作。现有方法假设与任务相关的经验在每个决策中都是有用的，但研究发现这种帮助主要体现在决策的第一步，后续步骤的效果有限。我们提出了ExpActivator框架，它在执行过程中仅激活与当前情况相关的经验，从而提高了决策的准确性。通过在四个GUI基础上进行测试，ExpActivator平均提高了28%的成功率，并显著减少了历史记录的使用。'}}}, {'id': 'https://huggingface.co/papers/2609.36616', 'title': 'CrossTimeEdit: A Decade-Spanning Cross-View Dataset and Reward-Guided Editing for Historical Street-View Generation', 'url': 'https://huggingface.co/papers/2609.36616', 'abstract': 'Abstract  Historical street-view imagery records urban evolution, but uneven coverage leaves substantial gaps in historical records. Generating plausible past appearances requires restoring changed structures while preserving persistent scene content. We construct VIGOR-his, a decade-spanning cross-view dataset containing 43,653 location-level quadruplets across 11 cities on three continents. Its automated pipeline performs spatial pairing, consistency screening, change classification, and the generation and validation of satellite-based change descriptions and local editing instructions. Based on VIGOR-his, we propose CrossTimeEdit, a model that reformulates historical street-view generation as editing, using recent street views to constrain viewpoint and unchanged appearance and temporal satellite differences as change evidence. Starting from FLUX.2 [Klein] 4B, we train CrossTimeEdit through supervised fine-tuning (SFT) followed by online reinforcement learning (RL). We design three street-view editing criteria, namely Instruction Alignment (IA), Background Preservation (BP), and Quality and Physical Plausibility (QP), as both RL reward dimensions and evaluation metrics. We optimize this multi-reward objective using Within Group Relative Policy Optimization for flow-matching models (Flow-GRPO) with Group reward-Decoupled Normalization Policy Optimization (GDPO), which normalizes each reward dimension before aggregation. CrossTimeEdit improves overall performance across the three editing criteria by 17.12\\% over the pretrained baseline and outperforms cross-view generation models in scene consistency, visual realism, and perceptual quality. The implementation code, dataset, and model weights are available at https://luhanwen67.github.io/CrossTimeEdit-release/.', 'score': 20, 'issue_id': 3403, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'ac0d225d6d6b8793', 'authors': ['Hanwen Lu', 'Jun He', 'Mingjia Yang', 'Hao Wei', 'Jinhao Huang', 'Yi Lin', 'Xiang Zhang'], 'affiliations': ['Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2609.36616.jpg', 'data': {'categories': ['#video', '#training', '#dataset', '#multimodal', '#rl'], 'emoji': '🏙️', 'ru': {'title': 'Редактирование временем: восстановление исторического облика городов через многовознаграждаемое обучение', 'desc': 'Авторы создали VIGOR-his, масштабный датасет исторических уличных панорам, содержащий более 43 тысяч пространственно-временных квадруплетов для восстановления прошлого внешнего вида городов. Они предложили CrossTimeEdit — модель, которая переформулирует задачу генерации исторических изображений как задачу редактирования, используя недавние панорамы для сохранения перспективы и неизменных элементов, а спутниковые снимки разных периодов — как свидетельство изменений. Модель обучается на основе FLUX.2 через supervised fine-tuning и усиленное обучение с тремя метриками: согласованность инструкций, сохранение фона и физическая правдоподобность. Предложенный метод оптимизации Flow-GRPO с нормализацией вознаграждений улучшил производительность на 17.12% и показал лучшие результаты по консистентности, реалистичности и перцептивному качеству.'}, 'en': {'title': 'Reviving the Past: Editing Street Views with CrossTimeEdit', 'desc': 'This paper addresses the challenge of generating historical street-view images from existing urban data, which often has gaps due to uneven historical coverage. The authors introduce VIGOR-his, a comprehensive dataset that includes location-level image quadruplets to facilitate the restoration of urban scenes. They propose a novel model called CrossTimeEdit that utilizes recent street views and satellite imagery to edit and generate plausible historical views. The model is trained using a combination of supervised fine-tuning and reinforcement learning, optimizing for criteria such as instruction alignment and background preservation, resulting in significant improvements in visual quality and scene consistency.'}, 'zh': {'title': '历史街景生成的新方法', 'desc': '本论文研究了历史街景图像的生成，旨在填补城市演变记录中的空白。我们构建了一个名为VIGOR-his的数据集，包含来自11个城市的43,653个位置级四元组。提出的CrossTimeEdit模型将历史街景生成视为编辑过程，利用最新街景约束视角和不变外观，同时使用卫星图像差异作为变化证据。通过多重奖励目标优化，CrossTimeEdit在场景一致性、视觉真实感和感知质量方面显著提升了性能。'}}}, {'id': 'https://huggingface.co/papers/2610.13832', 'title': 'SpatialASM: Internalizing Active Mentalization for Spatial Reasoning', 'url': 'https://huggingface.co/papers/2610.13832', 'abstract': 'Abstract  When solving complex spatial reasoning tasks, ordinary humans naturally revisit the scenes from task-relevant viewpoints and mentally reconstruct the spatial layouts from those viewpoints. But can Large Vision-Language Models (LVLMs) proactively think in the same way? We term this ability Active Spatial Mentalization (ASM), an intrinsic component of visual intelligence that remains substantially underdeveloped in current LVLMs. To bridge this gap, we introduce SpatialASM, a scalable framework to internalize ASM into LVLMs through training-time spatial simulation. SpatialASM employs an allocentric novel-view generator to ground hypothetical viewpoints in visual evidence and produces two complementary forms of supervision: i) explicit ASM trajectories that teach LVLMs when and how to adaptively invoke view planning and imagination during spatial reasoning, and ii) automatically-constructed perspective-taking tasks that further strengthens viewpoint-conditioned scene imagination. On seven benchmarks spanning relatively perception-oriented spatial understanding to more challenging tasks requiring multi-image, cross-view and viewpoint-transformation reasoning, SpatialASM yields performance gain on LVLMs of four LVLM backbones in spatial reasoning while retaining their original general vision capabilities. The experimental results demonstrate that our approach improves average accuracy across the seven spatial benchmarks. And the synthesis of ASM trajectories provides a scalable pathway to alleviate the scarcity of spatial Chain-of-Thought (CoT) supervision for eliciting active viewpoint exploration and mental scene simulation.', 'score': 16, 'issue_id': 3402, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': '5305650530df4d8b', 'authors': ['Yuhong Liu', 'Shenxi Wu', 'Junyi Chi', 'Beichen Zhang', 'Xuanlang Dai', 'Jiaqi Wang', 'Yuhang Zang', 'Dahua Lin'], 'affiliations': ['CPII under InnoHK', 'Fudan University', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.13832.jpg', 'data': {'categories': ['#training', '#benchmark', '#multimodal', '#cv'], 'emoji': '🔄', 'ru': {'title': 'Обучение моделей видения активно переключать точки зрения для пространственного мышления', 'desc': 'Работа посвящена развитию способности больших видео-языковых моделей (LVLM) к активной пространственной ментализации — умению мысленно перестраивать сцены с разных точек зрения для решения пространственных задач. Авторы предлагают SpatialASM, фреймворк, который внедряет эту способность в LVLM через симуляцию пространственных сцен во время обучения, используя генератор альтернативных видов. Метод генерирует две формы обучающего сигнала: явные траектории ментализации, которые обучают модель планировать переключение точек зрения, и автоматические задачи смены перспективы. Эксперименты на семи бенчмарках показывают значительные улучшения в пространственных рассуждениях, сохраняя при этом общие способности моделей в обработке визуальной информации.'}, 'en': {'title': 'Enhancing Spatial Reasoning in LVLMs with Active Spatial Mentalization', 'desc': 'This paper introduces a new concept called Active Spatial Mentalization (ASM), which refers to the ability of models to think and visualize scenes from different viewpoints, similar to how humans do. The authors propose a framework named SpatialASM that enhances Large Vision-Language Models (LVLMs) by incorporating training-time spatial simulation to develop this ability. SpatialASM uses a novel-view generator to create hypothetical viewpoints based on visual evidence and provides two types of training: explicit trajectories for adaptive view planning and perspective-taking tasks to improve scene imagination. The results show that SpatialASM significantly boosts the spatial reasoning performance of LVLMs across various benchmarks while maintaining their general vision capabilities.'}, 'zh': {'title': '提升视觉语言模型的空间推理能力', 'desc': '在解决复杂的空间推理任务时，普通人会从与任务相关的视角重新审视场景，并在脑中重建空间布局。本文提出了一种名为主动空间心理化（ASM）的能力，认为这是视觉智能的重要组成部分，但目前的大的视觉语言模型（LVLMs）在这方面仍然不足。为了解决这个问题，我们引入了SpatialASM，这是一个可扩展的框架，通过训练时的空间模拟将ASM内化到LVLMs中。实验结果表明，SpatialASM在七个基准测试中提高了LVLMs的空间推理性能，同时保持了其原有的视觉能力。'}}}, {'id': 'https://huggingface.co/papers/2610.03308', 'title': 'T3lescope: Arbitrary-Resolution High-Fidelity Generative Surface Reconstruction from Images', 'url': 'https://huggingface.co/papers/2610.03308', 'abstract': 'Abstract  We reconstruct high-fidelity 3D scene meshes from posed multi-view images without per-scene optimization, across scales ranging from single objects to large outdoor scenes. Per-scene optimization methods lack the learned 3D prior needed when observations are sparse or surfaces are glossy or transparent. Existing generative methods leverage such priors to complete geometry in sparsely observed regions, but typically operate at a fixed resolution over a limited spatial extent, trading spatial coverage against detail. Reconstructing a large scene therefore often requires partitioning it into independently processed overlapping local regions, making it difficult to maintain global geometric consistency. To address these issues, we propose T3lescope, which applies a single fixed-resolution generator across scene scales in an inference-time coarse-to-fine cascade. A coarse level establishes the scene layout, and finer levels perturb and denoise geometry inherited from the coarser level within progressively finer spatial cells to recover surface detail. The model is trained on individual cells at multiple scales and shares its weights across all levels, so no hierarchy is fixed during training, and the number of levels, cell scales, and cell locations are determined at inference time. On indoor, outdoor, and city-scale scenes, T3lescope outperforms feed-forward and generative baselines, matches or surpasses per-scene optimization, and recovers fine structures as well as glossy and transparent surfaces. These results show that our method generalizes across diverse scenes, view counts, and image resolutions. Project page: https://pfnet-research.github.io/t3lescope/', 'score': 11, 'issue_id': 3403, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '842a7b62b9373b02', 'authors': ['Atsuhiro Noguchi', 'Tianhan Xu', 'Yiming Liang', 'Yuta Kikuchi', 'Masahiro Ishiyama', 'Shintaro Takagi', 'Hitoshi Murai', 'Eiichi Matsumoto'], 'affiliations': ['Preferred Networks, Inc.', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2610.03308.jpg', 'data': {'categories': ['#inference', '#cv', '#3d', '#architecture'], 'emoji': '🔭', 'ru': {'title': 'Многомасштабная реконструкция 3D-сцен через каскадную генерацию с общими весами', 'desc': 'Статья представляет T3lescope — метод для реконструкции высокодетальных 3D сеток сцен из набора изображений с известными позициями камер без оптимизации под конкретную сцену. В отличие от существующих подходов, которые либо требуют отдельной оптимизации для каждой сцены, либо работают с фиксированным разрешением и ограниченной областью, предложенный метод использует каскадный коарсе-то-файн процесс на этапе вывода. Генератор применяется многократно на разных уровнях детализации, где грубый уровень устанавливает общую структуру сцены, а более детальные уровни уточняют геометрию в прогрессивно более мелких пространственных ячейках. Модель обучается на отдельных ячейках различных масштабов с общими весами и может обрабатывать сцены от отдельных объектов до городских масштабов, успешно восстанавливая детали, блестящие и полупрозрачные поверхности.'}, 'en': {'title': 'T3lescope: High-Fidelity 3D Reconstruction Across Scales', 'desc': 'This paper presents T3lescope, a method for reconstructing high-quality 3D scene meshes from multiple images without needing to optimize each scene individually. Traditional methods struggle with sparse observations and complex surfaces, but T3lescope uses a fixed-resolution generator that operates in a coarse-to-fine manner to improve detail and maintain global consistency. By training on multiple scales and sharing weights across levels, the model adapts dynamically during inference, allowing it to handle various scene sizes and complexities. The results demonstrate that T3lescope outperforms existing techniques, effectively capturing fine details and handling challenging surface types.'}, 'zh': {'title': 'T3lescope：高效重建多视角3D场景', 'desc': '本文提出了一种名为T3lescope的方法，可以从多视角图像中重建高保真度的3D场景网格，而无需对每个场景进行单独优化。该方法通过在推理时采用粗到细的级联策略，使用固定分辨率的生成器来处理不同规模的场景。T3lescope在多个尺度上训练，并在推理时动态确定细胞的数量、尺度和位置，从而保持全局几何一致性。实验结果表明，该方法在室内、室外和城市规模的场景中表现优于现有的基线方法，能够有效恢复细微结构以及光滑和透明的表面。'}}}, {'id': 'https://huggingface.co/papers/2609.35965', 'title': 'Systematic Multi-Agent Vision-and-Language Navigation: Formulation, Benchmark, and Method', 'url': 'https://huggingface.co/papers/2609.35965', 'abstract': "Abstract  Vision-and-Language Navigation (VLN) has largely focused on a single agent following a single instruction, yet many real-world applications require teams of robots to tackle tasks beyond the capabilities of any individual agent. We present Systematic Multi-Agent Vision-and-Language Navigation, providing, to our knowledge, the first systematic formalization of multi-agent VLN as a constrained coordination problem: each mission consists of subtasks carrying dependency and resource constraints (presence locks and holding chains). A verified four-stage crafting pipeline instantiates the task as MAVLN, comprising 11,724 episodes across 145 scenes with teams of up to four agents under three instruction regimes, accompanied by tailored constraint-aware metrics. We further present TRISS, a coordination-ready navigation system coupling an LLM-based subtask scheduler, a shared topological memory that turns each agent's exploration into team knowledge, and a conflict-aware execution mechanism that realizes simultaneous intentions as collision-free routes. Extensive experiments establish TRISS as a comprehensive baseline and reveal substantial room for improvement across scheduling, planning, and execution, highlighting the challenges of coordinating under MAVLN task constraints. Project page: https://xyz9911.github.io/mavln.", 'score': 10, 'issue_id': 3402, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'aea255fc85da5d61', 'pdf_title_img': 'assets/pdf/title_img/2609.35965.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#cv', '#agents', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Командная координация роботов для сложных навигационных задач с языковыми инструкциями', 'desc': 'В статье представлена задача мультиагентной навигации с использованием зрения и языка (MAVLN), где команда роботов должна выполнить миссию с взаимозависимыми подзадачами и ограничениями ресурсов. Авторы создали датасет с 11,724 эпизодами в 145 сценах, включающих команды из до четырёх агентов с различными инструкциями. Они предложили систему TRISS, которая использует LLM для планирования подзадач, совместную топологическую память для накопления знаний команды и механизм разрешения конфликтов для координации движений. Эксперименты показывают значительный потенциал для улучшений в области распределения задач, планирования и выполнения координированных действий в мультиагентных сценах.'}, 'en': {'title': 'Collaborative Navigation: Teamwork in Vision-and-Language Tasks', 'desc': 'This paper introduces a new approach to Vision-and-Language Navigation (VLN) that involves multiple agents working together to complete tasks. It formalizes multi-agent VLN as a coordination problem, where tasks are divided into subtasks with specific dependencies and resource constraints. The authors present a system called TRISS, which includes a scheduler and a shared memory to help agents coordinate their actions and avoid conflicts. Through extensive testing, they demonstrate the effectiveness of TRISS and identify areas for further improvement in multi-agent task execution.'}, 'zh': {'title': '多智能体协作导航的新方法', 'desc': '本文提出了一种系统化的多智能体视觉与语言导航（VLN）方法，解决了多个机器人协同完成任务的问题。我们将多智能体VLN形式化为一个受约束的协调问题，任务由具有依赖关系和资源约束的子任务组成。研究中介绍了一个四阶段的任务构建流程，创建了MAVLN数据集，包含11724个场景和最多四个智能体的任务。我们还提出了TRISS系统，结合了基于大语言模型的子任务调度器和共享拓扑记忆，能够有效协调智能体的导航。'}}}, {'id': 'https://huggingface.co/papers/2610.09396', 'title': 'ARCS: Towards Precise Text-to-SQL via Structured Disambiguation', 'url': 'https://huggingface.co/papers/2610.09396', 'abstract': "Abstract  As text-to-SQL systems move beyond demonstrations toward real-world deployment, ambiguity in user questions becomes a primary source of errors. Such ambiguities are often subtle, domain- or data-specific, and can silently cause system outputs to deviate from the user's true intent. Ambiguity is traditionally addressed through conversational clarification, which is often inefficient, cognitively demanding, and poorly aligned with real-world user workflows. We propose structured disambiguation, a new paradigm in which ambiguity is resolved through explicit, constrained interactions rather than free-form dialogue. We construct ARCS (Ambiguity Resolution Corpus for SQL), the first text-to-SQL benchmark featuring naturally occurring, unconstrained ambiguities over real-world databases, with complete annotations of all valid ambiguity points, interpretations, and SQL queries. Experimental results show that text-to-SQL remains challenging in the presence of ambiguity: gpt-6-sol achieves only 51% end-to-end execution accuracy, and no open-source model exceeds 27%.", 'score': 8, 'issue_id': 3402, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '34060e69ba1ef335', 'authors': ['Yihao Hu', 'Yanlin Feng', 'Naoki Otani', 'Nikita Bhutani'], 'affiliations': ['Duke University', 'Megagon Labs'], 'pdf_title_img': 'assets/pdf/title_img/2610.09396.jpg', 'data': {'categories': [], 'emoji': '❓', 'ru': {'title': 'Структурированное разрешение неоднозначности в text-to-SQL системах', 'desc': 'В работе рассматривается проблема неоднозначности в системах text-to-SQL при переходе от тестовых примеров к реальному развертыванию. Авторы предлагают новую парадигму структурированной дизамбигуации, где неоднозначность разрешается через явные, ограниченные взаимодействия вместо свободного диалога. Они создали ARCS — первый бенчмарк для text-to-SQL с естественно возникающей неоднозначностью над реальными базами данных с полными аннотациями всех неоднозначных точек и интерпретаций. Эксперименты показывают, что даже GPT-4 достигает только 51% точности, что подчеркивает сложность задачи.'}, 'en': {'title': 'Resolving Ambiguity in Text-to-SQL with Structured Interactions', 'desc': "This paper addresses the challenges faced by text-to-SQL systems when users pose ambiguous questions. Ambiguities can lead to incorrect outputs that do not reflect the user's true intent, especially in real-world applications. The authors introduce a method called structured disambiguation, which focuses on resolving ambiguities through specific interactions instead of open-ended conversations. They also present ARCS, a new benchmark that highlights these ambiguities in SQL queries, revealing that current models struggle significantly with accuracy in ambiguous scenarios."}, 'zh': {'title': '结构化消歧：提升文本到SQL的准确性', 'desc': '随着文本到SQL系统从演示走向实际应用，用户问题中的模糊性成为主要错误来源。这种模糊性往往是微妙的、特定于领域或数据的，可能会导致系统输出偏离用户的真实意图。传统上通过对话澄清来解决模糊性，但这种方法效率低下，认知负担重，且与实际用户工作流程不匹配。我们提出了一种结构化消歧的新范式，通过明确的、受限的交互来解决模糊性，而不是自由形式的对话。'}}}, {'id': 'https://huggingface.co/papers/2610.12933', 'title': 'Learning More by Training Less: Uncertainty-Guided Progressive Contraction for Efficient Reasoning Post-Training', 'url': 'https://huggingface.co/papers/2610.12933', 'abstract': "Abstract  Large language models have achieved remarkable advances in complex reasoning. However, scaling reasoning post-training with ever-larger corpora can substantially increase training cost without proportional performance gains. In this study, we therefore ask: how far can reasoning supervision be compressed without sacrificing capability? To this end, we propose an uncertainty-guided progressive contraction framework that concentrates supervision and optimization on the reasoning trajectories most valuable for learning. Specifically, rather than treating a teacher-generated chain-of-thought (CoT) as a single realized path, we construct uncertainty-profiled reasoning supervision by building Monte Carlo reasoning trees around intermediate reasoning states to expose process-level uncertainty. This uncertainty first contracts the original corpus into a compact teacher-informed pool. A second, learner-aware contraction then performs online routing during SFT, concentrating optimization according to the student's evolving learning state. Together, the two stages progressively contract both supervision and optimization, substantially reducing the student training budget. Experiments across diverse reasoning benchmarks and LLM families show that our method uses as little as 0.22% of the optimization budget of full-data SFT, over 450x less training exposure, while maintaining or improving reasoning performance. Notably, our framework generalizes well across heterogeneous student families, black-box teachers, and weak-to-strong transfer. This indicates that it is not only a way to accelerate training but can also enhance reasoning capability.", 'score': 7, 'issue_id': 3403, 'pub_date': '2026-10-09', 'pub_date_card': {'ru': '9 октября', 'en': 'October 9', 'zh': '10月9日'}, 'hash': 'b430d24d7056789a', 'authors': ['Suorong Yang', 'Jiaxin Wang', 'Jiaming Su', 'Chentao Yue', 'Furao Shen', 'Peng Ye', 'Soujanya Poria'], 'affiliations': ['Fudan University', 'Nanjing University', 'Nanyang Technological University', 'National University of Singapore', 'The Chinese University of Hong Kong', 'The University of Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2610.12933.jpg', 'data': {'categories': ['#optimization', '#reasoning'], 'emoji': '🌳', 'ru': {'title': 'Сжатие данных для рассуждения через управление неопределённостью', 'desc': 'В этой работе предлагается метод сжатия данных для обучения больших языковых моделей на задачах рассуждения. Авторы используют неопределённость (uncertainty) в цепочках рассуждений, строя деревья Монте-Карло вокруг промежуточных состояний, чтобы выделить наиболее ценные примеры для обучения. Фреймворк выполняет двухэтапное сжатие: сначала компактизирует корпус на основе учительской модели, затем оптимизирует обучение студента в режиме онлайн. Результаты показывают, что метод сохраняет или улучшает способность к рассуждению, используя при этом менее 0,22% стандартного объёма вычислений для fine-tuning с полным датасетом.'}, 'en': {'title': 'Efficient Reasoning Supervision for Enhanced Learning', 'desc': "This paper presents a method to improve the efficiency of training large language models (LLMs) by compressing reasoning supervision. The authors introduce an uncertainty-guided progressive contraction framework that focuses on the most valuable reasoning paths for learning, reducing the amount of training data needed. By using Monte Carlo reasoning trees, they create a compact pool of teacher-generated reasoning supervision that adapts to the learner's state during training. Their approach significantly cuts down the training budget while maintaining or even enhancing reasoning performance across various benchmarks and model families."}, 'zh': {'title': '压缩推理监督，提升学习效率', 'desc': '大型语言模型在复杂推理方面取得了显著进展。然而，随着训练数据集规模的扩大，推理的后期训练成本大幅增加，而性能提升却不成比例。本文提出了一种不确定性引导的渐进收缩框架，旨在在不牺牲能力的情况下压缩推理监督。通过构建蒙特卡洛推理树，我们能够集中优化最有价值的推理轨迹，从而显著减少学生的训练预算，同时保持或提高推理性能。'}}}, {'id': 'https://huggingface.co/papers/2610.09116', 'title': 'SPLATIFY: Reproduce, Discover, Innovate! From Papers and Ideas to Trainable 3DGS Code', 'url': 'https://huggingface.co/papers/2610.09116', 'abstract': "Abstract  The rapid growth of 3D Gaussian Splatting (3DGS) research demands significant effort to reimplement papers before building on them. We introduce SPLATIFY, a multi-agent framework that converts 3DGS papers into trainable gsplat-based implementations, where generic paper-to-code methods and frontier models fail. SPLATIFY achieves this through five innovations: (1) A context-free grammar for gsplat over a modular method template with extension points for losses, densification, rendering, and optimization, constraining synthesis so generated code satisfies gsplat's architectural invariants by construction. (2) Architectural elements for faithful reproduction: fork-aware citation recovery retrieving component-level code at function-level granularity, Graph-of-Thought synthesis in topological dependency order, RAG-guided in-context example selection from over 20 verified implementations, and visual feedback combining PSNR-guided regeneration, Gaussian-level structural checks, and VLM-driven patching. (3) Knowledge-driven compositional improvement that autonomously finds weaknesses and composes complementary regularizers, losses, and densification strategies to improve upon original results. (4) Interdisciplinary method discovery where agents retrieve physical priors from outside the 3DGS literature and compose them with rendering knowledge to produce methods for previously unaddressed scene types. (5) SPLATIFY-Bench, an evaluation framework across 30 diverse 3DGS papers. On papers without public code, SPLATIFY matches expert implementations while reducing development time from weeks to minutes, and through compositional discovery further improves PSNR by up to 2.4 dB. We additionally demonstrate novel methods for volumetric nebula rendering and other scientific domains, synthesized entirely by SPLATIFY.", 'score': 1, 'issue_id': 3403, 'pub_date': '2026-10-06', 'pub_date_card': {'ru': '6 октября', 'en': 'October 6', 'zh': '10月6日'}, 'hash': '6d510dd95383642e', 'authors': ['Seemandhar Jain', 'Keshav Gupta', 'Manmohan Chandraker'], 'affiliations': ['University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.09116.jpg', 'data': {'categories': ['#rag', '#open_source', '#benchmark', '#dataset', '#3d', '#agents', '#science'], 'emoji': '🎨', 'ru': {'title': 'От статьи к коду: автоматический синтез 3D гауссовых алгоритмов с агентным улучшением', 'desc': 'Авторы представляют SPLATIFY — мультиагентный фреймворк, который автоматически преобразует научные статьи по трёхмерной гауссовой сплаттинизации (3DGS) в работающий код на основе библиотеки gsplat. Система использует контекстно-свободную грамматику и модульный шаблон метода для гарантии соответствия архитектурным инвариантам, а также применяет RAG, восстановление цитирования и синтез графов мыслей для высокоточного воспроизведения результатов. Фреймворк включает компоненты для композиционного улучшения исходных методов путём автономного поиска слабостей и комбинирования регуляризаторов, функций потерь и стратегий уплотнения. SPLATIFY демонстрирует на бенчмарке из 30 статей, что сокращает время разработки с недель до минут и улучшает метрики качества на 2,4 дБ по PSNR.'}, 'en': {'title': 'Transforming 3DGS Research into Efficient Implementations with SPLATIFY', 'desc': 'The paper presents SPLATIFY, a framework designed to streamline the implementation of 3D Gaussian Splatting (3DGS) research. It introduces a context-free grammar and modular templates to ensure that generated code adheres to the architectural standards of gsplat. SPLATIFY enhances the implementation process by autonomously identifying weaknesses and integrating complementary strategies to improve performance. Additionally, it facilitates interdisciplinary method discovery, allowing for the synthesis of novel rendering techniques for various scene types, significantly reducing development time and improving results.'}, 'zh': {'title': 'SPLATIFY：快速实现3D高斯点云研究的框架', 'desc': '本论文介绍了SPLATIFY，一个多代理框架，旨在将3D高斯点云（3DGS）论文转换为可训练的gsplat实现。SPLATIFY通过五项创新来实现这一目标，包括无上下文语法、架构元素的忠实再现、知识驱动的组合改进、跨学科方法发现以及SPLATIFY-Bench评估框架。该框架能够在没有公开代码的论文中匹配专家实现，并将开发时间从几周缩短到几分钟，同时通过组合发现进一步提高PSNR。SPLATIFY还展示了用于体积星云渲染和其他科学领域的新方法，完全由SPLATIFY合成。'}}}];
