    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.34849', 'title': 'Real2SimLab: A Unified Platform for Real-to-Simulation Transfer', 'url': 'https://huggingface.co/papers/2611.34849', 'abstract': 'Abstract  Real-to-simulation transfer, which builds simulations from real-world observations, has long been studied in research and industry. Recently, coding agents have become capable of generating simulation programs from video recordings, and several benchmarks have been proposed to evaluate them. However, each individual benchmark defines its own inputs, deliverables, and scoring pipeline. This leads to N times M integrations when evaluating N methods on M benchmarks. To this end, we present Real2SimLab, a unified platform for real-to-simulation transfer. It evaluates a method by running its written program and scoring the output simulation with the original scorer of each benchmark. Moreover, Real2SimLab provides a pipeline to create training data and reward annotations for real-to-simulation methods. Our pipeline carefully avoids data contamination by filtering out the video recordings that exist in benchmarks. For each video recording, a program is first produced, and then our pipeline computes its reward with the same code that Real2SimLab uses for evaluation. So far, it supports 47 coding agents and 5 non-agent methods on 6 benchmarks. Both the platform and Awesome-Real2Sim, our research map of nearly 300 real-to-simulation papers, are open source, and we invite the Real2SimHub community to build them together.', 'score': 60, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '559151a9c3eaf435', 'authors': ['Yongchang Zhang', 'Jie Huang', 'Yunhe Ni', 'Ningyu Zhou', 'Guangyu Zhao', 'Ruixun Liu', 'Rui Huang', 'Yidi Wu', 'TianZe Zhang', 'Zixiang Jiang', 'Xiang Li', 'Kevin Shen', 'Yiwu Zhong'], 'affiliations': ['Ngoro Robotics', 'School of Physics, PKU', 'State Key Laboratory of General AI, School of Intelligence Science and Technology, PKU', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2611.34849.jpg', 'data': {'categories': ['#benchmark', '#survey', '#data', '#robotics', '#synthetic', '#games', '#video', '#open_source', '#agents'], 'emoji': '🧪', 'ru': {'title': 'Единая платформа для честной оценки real-to-sim методов', 'desc': 'Статья представляет Real2SimLab — единую платформу для оценки методов real-to-simulation transfer, которые строят симуляции по видеозаписям реального мира. Платформа запускает программу, сгенерированную методом, и оценивает результирующую симуляцию оригинальным скорером каждого бенчмарка, что устраняет необходимость в N×M отдельных интеграциях. Также предложен пайплайн для создания обучающих данных и reward-аннотаций, который фильтрует видео, пересекающиеся с бенчмарками, чтобы избежать data contamination. Платформа уже поддерживает 47 coding agents и 5 non-agent методов на 6 бенчмарках.'}, 'en': {'title': 'One platform to build and evaluate real-to-simulation methods', 'desc': 'Real2SimLab is a unified platform for evaluating real-to-simulation methods that turn real-world videos into simulation programs. It runs each method’s program and uses the original scorer for each benchmark, avoiding the need for separate integrations. The platform also creates training data and reward annotations while filtering out benchmark videos to reduce data contamination. It supports 47 coding agents, 5 non-agent methods, and 6 benchmarks, and is released alongside a research map of nearly 300 papers.'}, 'zh': {'title': '统一评测真实到仿真迁移，让方法比较更简单', 'desc': '本文提出 Real2SimLab，一个用于评估真实到仿真迁移方法的统一平台。它运行方法生成的程序，并使用各基准原有的评分器评估生成的仿真，从而避免不同方法与基准之间重复开发接口。平台还提供训练数据和奖励标注生成流程，并通过排除基准中的视频来减少数据污染。Real2SimLab 已支持 6 个基准上的 47 种编码智能体和 5 种非智能体方法，同时开源了收录近 300 篇论文的研究地图 Awesome-Real2Sim。'}}}, {'id': 'https://huggingface.co/papers/2611.34237', 'title': 'VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation', 'url': 'https://huggingface.co/papers/2611.34237', 'abstract': 'Abstract  Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding session bloats its long-horizon context, while critiquing only the finished full-resolution render turns early design mistakes into costly rewrites. We introduce VibeVideoAgent, a training-free framework that lets coding agents inspect their drafts throughout production. Multimodal perception runs in short-lived contexts kept apart from the coder and returns compact, grounded Findings. Seven primitives operate on a unified multi-clock representation of assets and drafts: they explore media from coarse to fine, verify quoted requirements with evidence from every required modality, compare a draft with a reference or an earlier revision on separate clocks, and measure stream signals locally. A lightweight staged protocol has the agent test its riskiest decision on a minimal preview first. On all 239 VibeVideoBench tasks, with matched agent runtimes and a fixed perception model, VibeVideoAgent improves holistic audiovisual quality (L3) for Claude Opus 5.5 (4.03 -> 4.43, while L2 rubric compliance rises from 98.87% to 99.35%), GPT-6 Astra (4.03 -> 4.27), and Claude Sonnet 5.5 (3.97 -> 4.10), with the largest gains in audio-visual synchronization (up to +0.56). Controlled ablations show that each component contributes, and trajectory audits show that the granularity of code edits governs the trade-off between rubric adherence and perceptual quality.', 'score': 50, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '98fad6661901b998', 'authors': ['Xuanyu Zheng', 'Luoyuan Zhang', 'Yancheng Long', 'Haoyang Xu', 'Muxi Diao', 'Yuzhe Chen', 'Kaiyu Jiang', 'Bin Wen', 'Tingting Gao'], 'affiliations': ['KlingAI Research'], 'pdf_title_img': 'assets/pdf/title_img/2611.34237.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#plp', '#optimization', '#audio', '#video', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Агент, который смотрит и слушает свой код до финального рендера', 'desc': 'Статья представляет VibeVideoAgent — фреймворк без дообучения (training-free), который позволяет кодовому агенту создавать видео через написание и запуск программ рендеринга и проверять черновики на протяжении всего процесса. Мультимодальное восприятие (perception) выполняется в отдельных короткоживущих контекстах и возвращает компактные обоснованные выводы (Findings), а семь примитивов работают с единым мультичасовым представлением ассетов и черновиков. На бенчмарке VibeVideoBench из 239 задач фреймворк улучшает аудиовизуальное качество (L3) у нескольких LLM, особенно синхронизацию аудио и видео (до +0.56). Абляции подтверждают вклад каждого компонента, а аудит траекторий показывает, что гранулярность правок кода определяет баланс между соблюдением требований и перцептивным качеством.'}, 'en': {'title': 'Check Early, Sync Better: A Smarter Workflow for Code-Generated Video', 'desc': 'VibeVideoAgent helps coding agents improve generated videos by checking drafts during production, rather than only after the final render. It uses separate multimodal perception contexts to return concise findings about video, audio, and whether the result meets stated requirements. Seven tools inspect media at different levels of detail, compare versions, and measure signals across audio and video timelines; a staged workflow first tests risky choices with small previews. On 239 benchmark tasks, it improved holistic audiovisual quality for three coding agents, especially audio-visual synchronization, while ablations showed that its components each contributed to the gains.'}, 'zh': {'title': '让智能体边创作边检查，做出更协调的视听作品', 'desc': '本文提出 VibeVideoAgent，这是一种无需训练、能让编程智能体在制作过程中检查视频草稿的框架。它把多模态感知任务放进独立的短期上下文，并将结果整理成简洁、有依据的发现，减少视频和音频内容对编码上下文的占用。框架提供七种操作，用统一的多时钟表示来逐步查看素材、核对多模态要求、比较不同版本，并测量局部信号；分阶段流程还会先用最小预览测试高风险设计。实验显示，该方法在 239 项任务中提升了多个模型生成视频的整体视听质量，尤其改善了音画同步。'}}}, {'id': 'https://huggingface.co/papers/2611.34923', 'title': 'Mixture-of-Loops Transformer', 'url': 'https://huggingface.co/papers/2611.34923', 'abstract': 'Abstract A Mixture-of-Loops Transformer reuses key-value memory across loops and depths, and its U-shaped variant improves pretraining efficiency and inference latency.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and reads local KV across loops for expressivity. Under loop KV, MoLT-KV instead restarts from embeddings and reads current-loop local KV with preceding-loop memory KV at earlier positions for efficiency. MoLT-KV eliminates same-position cross-loop dependence and, paired with loop forcing for parallel training, unlocks single-traversal Mixture-of-Loops (MoL) decoding beyond the training loop horizon. To balance efficiency and quality, we introduce U-shaped MoLT (U-MoLT), which separates memory construction from prediction readout and skips unused decoder traversals without changing predictions. In 400B-token pretraining, U-MoLT outperforms OLMo3 across 700M/1.5B dense and 3B MoE models, achieving 1.7x validation cross-entropy (CE) token efficiency at 700M while improving 3B MoE 10-domain perplexity by 0.75 and 10-task accuracy by 2.1 percentage points. In 100B-token continued pretraining of Qwen3.5-0.8B-Base, our U-MoLT adaptation lowers CE on all 11 domains over the matched baseline with 1.4x mean token efficiency. At inference, U-MoLT with MoL-Hybrid-2 matches non-looped OLMo3 latency at 996.6 vs. 1,000.6 ms on S-size (~113M) models. Code is available at https://github.com/hustvl/MoLT', 'score': 46, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '1d01ab5fa98df304', 'authors': ['Lianghui Zhu', 'Shijie Wang', 'Xinggang Wang', 'Jinze Bai', 'Bo Wang', 'Xiang Bai'], 'affiliations': ['ByteDance Seed', 'Huazhong University of Science & Technology', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2611.34923.jpg', 'data': {'categories': ['#architecture', '#training', '#inference', '#small_models'], 'emoji': '🔁', 'ru': {'title': 'Петли с памятью: больше выразительности без потери скорости', 'desc': 'Авторы предлагают Mixture-of-Loops Transformer (MoLT), в котором механизм Mixture-of-Loops Attention повторно использует KV-кэш (ключи и значения) между петлями и слоями, что повышает выразительность модели. Вариант MoLT-KV перезапускается от эмбеддингов и устраняет межпетлевую зависимость, что ускоряет декодирование. U-образная архитектура U-MoLT разделяет построение памяти и предсказание и пропускает ненужные проходы декодера без изменения результата. На предобучении по 400B токенов U-MoLT превосходит OLMo3 по эффективности LLM и при этом сохраняет задержку инференса на уровне обычного трансформера.'}, 'en': {'title': 'Reuse KV memory, skip needless loops', 'desc': 'This paper introduces the Mixture-of-Loops Transformer (MoLT), which reuses key-value (KV) memory across layers and loops to make looped Transformers more efficient. Its U-shaped version separates memory construction from prediction and skips decoder computations that are not needed, without changing the predictions. In pretraining experiments, U-MoLT achieved better token efficiency and improved benchmark results across several model sizes, including a continued-pretraining test. With a hybrid decoding setup, it also reached inference latency close to that of a non-looped Transformer.'}, 'zh': {'title': '让循环Transformer复用KV记忆，以更少计算实现更高效推理', 'desc': '这篇论文提出混合循环 Transformer（MoLT），让模型在不同循环和深度之间选择性复用键值（KV）记忆，以提升循环 Transformer 的表达能力和效率。MoLT-KV通过读取前序循环的记忆，减少循环之间的依赖，并配合循环强制训练，使推理时可以使用超出训练循环数的单次遍历解码。作者进一步提出U形MoLT，将记忆构建与预测分开，并跳过不影响预测的解码遍历，从而提高预训练效率并降低推理延迟。实验显示，U形MoLT在多种模型和数据集上提升了词元效率与任务表现，并在小模型上达到接近非循环Transformer的推理延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.34575', 'title': 'Sage-Med: Scaling Medical Multimodal Intelligence', 'url': 'https://huggingface.co/papers/2611.34575', 'abstract': 'Abstract  Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in practice, we introduce Sage-Med-Preview, a 35B-parameter medical multimodal model with 3B activated parameters, built by combining stage-specific curation over 322.7 million candidate records with a progressive training curriculum spanning medical pretraining, staged supervised fine-tuning, and adaptive reinforcement learning. Across this curriculum, progressive supervised refinement and adaptive reinforcement learning yield consistent stage-wise gains, substantially advancing both specialized visual understanding and medical language capabilities. Evaluated against 77 competing models across 238 clinical tasks spanning 61 public and 13 private multi-center benchmarks in more than 40 modalities, Sage-Med-Preview achieves an average score of 58.26% on the 31 public multimodal benchmarks. It outperforms the state-of-the-art open-source medical model Hulu-Med-235B-A22B at 50.99% and the general scientific model Intern-S2-Preview at 52.24%, and approaches the advanced proprietary model GPT-6.2-Sol across multiple tasks such as comprehensive multimodal understanding, report generation, and visual grounding. Although substantial challenges remain in complex medical reasoning and multi-step clinical workflows, this report provides empirical evidence, actionable data and training recipes, and a rigorous benchmark toward scalable clinical multimodal intelligence.', 'score': 45, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'cae10ac45c4c3992', 'authors': ['Sage-Med Team', ':', 'Ming Hu', 'Cheng Tang', 'Wei Li', 'Rongbin Li', 'Feilong Tang', 'Junru Hu', 'Hongze Zhu', 'Qiujuan Yan', 'Huanze Tang', 'Shaocong Wei', 'Siyuan Yan', 'Min Cen', 'Zhongxing Xu', 'Zhonghua Wang', 'Lie Ju', 'Zhen Yu', 'Wenjie Li', 'Shiyan Su', 'Jing Hao', 'Jingyong Liang', 'Diping Song', 'Fang Yan', 'Chenglong Ma', 'Junzhi Ning', 'Haochen Xue', 'Zanting Ye', 'Chenrun Wang', 'Jinjie Wei', 'Yi Xin', 'Jianghan Shen', 'Siqi Luo', 'Jiyao Liu', 'Huidong Xie', 'Jun Zhao', 'Rulin Zhou', 'Longquan Jiang', 'Ziyan Huang', 'Ying Chen', 'Hanxiao Zhang', 'Junyang Wu', 'Mouxiao Bian', 'Jiashi Lin', 'Chenyu Wang', 'Qi Qin', 'Jie Huang', 'Yiling Zhou', 'Jiawei Chen', 'Kefan Wang', 'Jingjing Hua', 'Yaoyu Liu', 'Huihui Xu', 'Tianbin Li', 'Jin Ye', 'Ziyang Chen', 'Shujian Gao', 'Zilin Lu', 'Jiangtao Yan', 'Changkai Ji', 'Wenhao Tang', 'Xinyi Zeng', 'Yuxing Chen', 'Hongwei Yang', 'Rongzhao Zhang', 'Jinru Ding', 'Yingcheng Wu', 'Zhenfei Yin', 'Jinzhe Li', 'Lu Lu', 'Yun Zhong', 'Zhishan Lin', 'Bingli Wang', 'Xiaohan Ren', 'Jianmin Qian', 'Penghao Zhao', 'Zhongbo Tian', 'Zhenbang Zhou', 'Peiling Dai', 'Mengjing Zhao', 'Jingyu Zheng', 'Pinan Liu', 'Shiwei Li', 'Victoria Mar', 'Cristina Vico-Alonso', 'Qiang Wu', 'Xianming Liu', 'Lingtong Huang', 'Dili Song', 'Minghui Zhang', 'Wenlong Zhang', 'Qipeng Guo', 'Yuqiang Li', 'Nanqing Dong', 'Yun Gu', 'Qi Duan', 'Hongliang Ren', 'Hongming Shan', 'Yin Xie', 'Xiang An', 'Benyou Wang', 'Yueming Su', 'Yefeng Zheng', 'Zongyuan Ge', 'Chun-Mei Feng', 'Jie Xu', 'Yu Qiao', 'Junjun He', 'Yirong Chen'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2611.34575.jpg', 'data': {'categories': ['#science', '#benchmark', '#multimodal', '#survey', '#data', '#training', '#healthcare', '#rl', '#dataset', '#open_source'], 'emoji': '🩺', 'ru': {'title': 'Масштабирование медицинского ИИ: зрение пока отстает от языка', 'desc': 'Статья показывает, что существующие медицинские MLLM (multimodal large language models) уступают универсальным frontier-моделям, а масштабирование размера в основном улучшает текстовые способности, но не визуальное восприятие. Авторы представляют Sage-Med-Preview: модель на 35B параметров (3B активных, архитектура MoE) с поэтапным обучением, включающим medical pretraining, staged supervised fine-tuning и adaptive reinforcement learning. Модель набирает 58.26% на 31 публичном мультимодальном бенчмарке, опережая открытую Hulu-Med-235B-A22B и научную Intern-S2-Preview и приближаясь к проприетарной GPT-6.2-Sol. Работа дает эмпирические данные, рецепты обучения и бенчмарк для масштабируемого клинического мультимодального ИИ, но сложные медицинские рассуждения остаются проблемой.'}, 'en': {'title': 'A progressive training path toward stronger medical multimodal AI', 'desc': 'This paper studies how medical multimodal large language models (MLLMs) improve with more data, model capacity, and training. The authors introduce Sage-Med-Preview, a 35-billion-parameter model trained with carefully curated medical data, staged supervised fine-tuning, and adaptive reinforcement learning. Across 31 public multimodal benchmarks, it achieves a 58.26% average score, outperforming the compared open-source medical and general scientific models. The results show that progressive training can strengthen visual and language capabilities, though complex clinical reasoning and multi-step workflows remain challenging.'}, 'zh': {'title': '循序训练，推动医疗多模态智能扩展', 'desc': '本文研究医疗多模态大语言模型的扩展规律，发现单纯增大模型主要提升文本能力，难以弥补视觉理解上的差距。研究团队提出 Sage-Med-Preview，这是一个总参数量为 350 亿、每次激活 30 亿参数的医疗多模态模型，并采用分阶段数据筛选和渐进式训练流程。该流程结合医疗预训练、分阶段监督微调与自适应强化学习，持续提升模型的医学视觉理解和语言能力。在涵盖 238 项临床任务的评测中，模型取得了较强成绩，但复杂医学推理和多步骤临床工作流程仍有待改进。'}}}, {'id': 'https://huggingface.co/papers/2611.33144', 'title': 'PyRUA-Dex: Learning Programmatic Policies for Dexterous Bimanual Manipulation with Coding Agents', 'url': 'https://huggingface.co/papers/2611.33144', 'abstract': 'Abstract A framework enables coding agents to develop dexterous manipulation policies without demonstrations by exploring and distilling successful attempts into a program, then refining it for strong simulated and real-world results.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Learning for dexterous manipulation is limited by the scarcity of high-quality demonstrations: retargeting from human video is imprecise, teleoperation gives no force feedback to the operator, and exoskeleton-based collection is hard to scale up. We present PyRUA-Dex, a framework that enables coding agents to develop dexterous manipulation through programmatic policy, without the need of demonstrations. The programmatic policy is developed in two stages: during exploration, multiple agents explore in parallel for task skills and ways to compose them, and a distilling agent condenses the successful attempts into a task library and one program. During refinement, this program is improved through randomized layouts for enhanced robustness and execution efficiency. In simulated environments, PyRUA-Dex achieves SOTA on Bench2Dex with a score of 72.9 and reaches 81.0% success on DexJoCo under full randomization, ahead of every trained policy on both benchmarks. In real world experiments on a bimanual platform with two 22-DoF hands, PyRUA-Dex learns to play piano, write calligraphy, and other tasks efficiently: learning a new piece from sheet music takes as little as 30 minutes. These results suggest that PyRUA-Dex is an effective framework for developing dexterous manipulation policies with coding agents in the absence of high quality dexterous manipulation demonstrations.', 'score': 41, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': '6adcefdbfd70988a', 'authors': ['Feixiang Ruan', 'Guodong Lv', 'Kewei Zhang', 'Wenbo Huang', 'Yintianrun Zhang', 'Qiang Wang', 'Ruiyang Si', 'Shunyu Yang', 'Shulong Jiang', 'Weicheng Duan', 'Rui Ni', 'Jianxin Bi', 'Lekai Wang', 'Yuze Fan', 'Haobo Li', 'Zeliang Fu', 'Jiankun Zhang', 'Duomin Wang', 'Enze Xie', 'Daquan Zhou'], 'affiliations': ['NVIDIA', 'National University of Singapore', 'Peking University', 'Tongji University', 'University of Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2611.33144.jpg', 'data': {'categories': ['#benchmark', '#plp', '#robotics', '#optimization', '#games', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Роботы-руки учатся ловкости без демонстраций: программа вместо обучения с учителем', 'desc': 'Статья предлагает PyRUA-Dex — фреймворк, в котором кодирующие LLM-агенты создают политики ловкого манипулирования без демонстраций. На этапе исследования несколько агентов параллельно пробуют навыки и способы их комбинирования, после чего дистиллирующий агент сворачивает успешные попытки в библиотеку навыков и одну программу. На этапе доработки программа улучшается на рандомизированных сценах для повышения робастности и эффективности. В симуляции метод достигает SOTA на Bench2Dex (72.9) и 81.0% успеха на DexJoCo при полной рандомизации, опережая все обученные политики. На реальном двуруком стенде с двумя 22-DoF руками роботы учатся играть на пианино и писать каллиграфию, а освоение новой пьесы по нотам занимает около 30 минут.'}, 'en': {'title': 'Learn Dexterous Skills by Exploring, Distilling, and Refining', 'desc': 'PyRUA-Dex lets coding agents create dexterous manipulation policies without relying on human demonstrations. In an exploration stage, agents try skills and ways to combine them, then distill successful attempts into a task library and program. During refinement, the program is tested across randomized layouts and improved for greater robustness and execution efficiency. The framework achieves strong results in simulation and enables real-world tasks such as piano playing and calligraphy.'}, 'zh': {'title': '无需示范，让编码智能体学会灵巧操作', 'desc': '这篇论文提出了 PyRUA-Dex，让编码智能体在没有高质量示范数据的情况下，通过编写程序学习灵巧操作策略。探索阶段中，多个智能体并行尝试任务技能及其组合，再由蒸馏智能体把成功经验整理成技能库和程序。改进阶段通过随机化物体布局来提升程序的鲁棒性和执行效率。该方法在仿真基准测试中取得领先成绩，并能让真实的双手机器人学习弹钢琴、书法等任务。'}}}, {'id': 'https://huggingface.co/papers/2611.34941', 'title': 'Improving and Expanding Video Editing Capabilities Without Videos', 'url': 'https://huggingface.co/papers/2611.34941', 'abstract': "Abstract Image-to-Video Transfer improves pretrained video editors by training them as image editors on single images, enabling new video editing tasks and state-of-the-art results on OpenVE-Bench and OpenVE++.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Image editing models can follow a wide range of instructions, but video editing models still lag behind, limited in part by the difficulty of collecting paired source and edited videos. Is it possible to transfer advanced image editing capabilities to video editors without new paired videos? We introduce Image-to-Video Transfer (I2VT), which improves pretrained video editors and expands them to new editing tasks using an image editor. It enables efficient post-training with no architectural changes and no new videos, using only individual images. Our key idea is to let the video editor role-play as an image editor: it edits an image as a one-frame video, with the image editor guiding the video editor's predictions at each denoising step. Although the video editor sees only single images during training, at test time it applies the improved and expanded capabilities to whole video clips while preserving temporal consistency. To push the boundaries of video editing, we introduce OpenVE++, an extension of OpenVE-Bench that adds four new editing tasks useful for video production, including action changes, expression changes, body movements, and scene relighting. Our experiments across three different video editors show that I2VT improves existing editing capabilities and expands them to new tasks, and our models achieve state-of-the-art (SOTA) performance on both OpenVE-Bench and OpenVE++.", 'score': 33, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '3cdac88100d5215d', 'authors': ['Ji Xie', 'Yanhao Jia', 'Xiangpeng Yang', 'Martin Q. Ma', 'Sihan Xu', 'Erik Cambria', 'Louis-Philippe Morency'], 'affiliations': ['Carnegie Mellon University', 'Nanyang Technological University', 'University of Michigan', 'University of Technology Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2611.34941.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#training', '#dataset', '#diffusion', '#video'], 'emoji': '🎬', 'ru': {'title': 'Учим видеоредактор думать как редактор картинок', 'desc': 'Статья предлагает метод Image-to-Video Transfer (I2VT), который улучшает предобученные video editing модели, используя image editor в качестве наставника без новых парных видеоданных. Видеомодель обучается как one-frame video на отдельных изображениях, а image editor направляет её предсказания на каждом шаге denoising. Благодаря этому при инференсе модель применяет расширенные возможности ко всему видеоклипу, сохраняя temporal consistency. Авторы также представляют OpenVE++ с четырьмя новыми задачами редактирования и показывают SOTA-результаты на OpenVE-Bench и OpenVE++.'}, 'en': {'title': 'Teach Video Editors New Tricks with Images', 'desc': 'Image-to-Video Transfer (I2VT) improves pretrained video editors using an image editor as a guide, without requiring new paired videos or changes to the model architecture. During post-training, the video editor treats each individual image as a one-frame video and learns from the image editor’s predictions at every denoising step. At inference time, it applies these learned editing capabilities to full video clips while preserving temporal consistency. Across three video editors, I2VT improves existing tasks and supports new ones, achieving state-of-the-art results on OpenVE-Bench and the expanded OpenVE++ benchmark.'}, 'zh': {'title': '用单张图像训练，让视频编辑能力更强、更广', 'desc': '本文提出图像到视频迁移（I2VT），让预训练的视频编辑模型借助图像编辑模型提升编辑能力，并拓展到新任务。训练时，视频编辑模型把单张图像当作只有一帧的视频来编辑，图像编辑模型则在每个去噪步骤引导其预测。该方法无需修改模型架构或收集成对视频，只用单张图像进行高效的后训练；推理时还能编辑完整视频片段并保持时间一致性。研究还扩展了 OpenVE-Bench，加入动作、表情、身体运动和场景光照变化等任务，并在 OpenVE-Bench 与 OpenVE++ 上取得最先进的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.30844', 'title': 'DyLoMo-DiT: Dynamic Looped Mixture-of-Experts Diffusion Transformers', 'url': 'https://huggingface.co/papers/2611.30844', 'abstract': 'Abstract A dynamic looped mixture-of-experts diffusion transformer reuses shared parameters and varies compute across noise levels, improving image generation quality under matched budgets.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Diffusion Transformers (DiTs) scale model capacity by increasing both parameter count and computation. Mixture-of-Experts (MoE) variants expand parameter capacity while keeping per-token computation roughly fixed, but still require substantial parameter storage. In this paper, we propose Dynamic Looped MoE DiT (DyLoMo-DiT), which reuses parameters rather than adding them: a weight-shared loop repeatedly applies the middle layers, while sparse experts allocate parameter capacity across tokens. This design deepens the network without adding parameters, freeing the parameter budget for other uses, such as more experts or more distinct layers. It also allocates compute dynamically, varying the number of passes across noise levels. Experiments show that DyLoMo-DiT makes more effective use of parameter and compute budgets, with further gains from assigning more passes to low-noise steps. On ImageNet 256times256, DyLoMo-DiT reduces FID by 11-24% relative to DiT and 36-56% relative to DiT-MoE at matched parameter and compute budgets. For text-to-image generation, a scaled DyLoMo-DiT achieves a higher GenEval score than FLUX.1 (0.714 vs. 0.673), with less than one tenth of its active parameters (1.05B vs. 12B).', 'score': 27, 'issue_id': 3567, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '8e8bf512ffe62e8f', 'pdf_title_img': 'assets/pdf/title_img/2611.30844.jpg', 'data': {'categories': ['#architecture', '#cv', '#training', '#small_models', '#diffusion'], 'emoji': '🔁', 'ru': {'title': 'Переиспользуем параметры вместо их добавления: глубже, умнее и легче', 'desc': 'Авторы предлагают DyLoMo-DiT — диффузионный трансформер с Mixture-of-Experts, в котором средние слои переиспользуются в цикле с общими весами, а разреженные эксперты распределяют ёмкость параметров между токенами. Такой подход углубляет сеть без роста числа параметров и динамически меняет количество проходов в зависимости от уровня шума. В экспериментах на ImageNet 256x256 модель снижает FID на 11–24% по сравнению с DiT и на 36–56% по сравнению с DiT-MoE при одинаковых бюджетах параметров и вычислений. Масштабированная версия в задаче text-to-image превосходит FLUX.1 по метрике GenEval, используя менее одной десятой его активных параметров.'}, 'en': {'title': 'Reuse weights, adapt compute, generate better images', 'desc': 'DyLoMo-DiT is a diffusion transformer that combines a looped, weight-shared network with sparse mixture-of-experts layers. Repeatedly applying shared middle layers deepens the model without adding parameters, leaving more of the parameter budget available for experts or distinct layers. The model also varies the number of passes across noise levels, using more computation at low-noise steps. Experiments report better image-generation quality than DiT and DiT-MoE at matched budgets, and a higher GenEval score than FLUX.1 with fewer active parameters.'}, 'zh': {'title': '共享参数、动态分配计算，让扩散模型以更少资源生成更优图像', 'desc': '本文提出动态循环混合专家扩散 Transformer（DyLoMo-DiT），用于提升图像生成质量。它通过共享权重反复运行中间层，在不增加参数量的情况下加深网络，并用稀疏专家为不同 token 分配模型容量。模型还会根据噪声水平动态调整循环次数，并发现低噪声阶段增加计算尤其有帮助。在参数量和计算预算相当时，它在 ImageNet 上取得更低的 FID；文本生成图像实验中，也以更少的激活参数获得了高于 FLUX.1 的 GenEval 分数。'}}}, {'id': 'https://huggingface.co/papers/2611.34420', 'title': 'DocSEAM: Bidirectional Cross-Page Encoding for Multi-Page Document Understanding', 'url': 'https://huggingface.co/papers/2611.34420', 'abstract': 'Abstract DocSEAM is a lightweight module between a pretrained vision encoder and language model that enriches page visual tokens with neighboring-page context via center-anchored masked self-attention, improving multi-page document VQA and reducing boundary sensitivity.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Multi-page document vision-language models encode each page independently, creating a feature-level discontinuity at page boundaries: visual tokens are formed without access to content on adjacent pages, and the language model must reason over these page representations formed in isolation. We introduce DocSEAM (Document Selective Enrichment via Anchored Masking), a lightweight module inserted between a pretrained vision encoder and the language model that injects the inductive bias of local cross-page context into visual representations. For each page, DocSEAM forms a local triplet with its two neighbors, applies center-anchored masked self-attention with directional salience gates to fuse information from neighbor pages, and returns only the enriched center-page tokens, leaving the visual token count unchanged. After a supervised cross-page warm-up and multi-page fine-tuning with DocSEAM frozen, our 9B-parameter model achieves state-of-the-art results among the evaluated open-weight models of up to 10B parameters on five multi-page document VQA benchmarks. We further show that under controlled re-pagination, DocSEAM reduces sensitivity to boundary placement and improves cross-page span localization', 'score': 21, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'dc00b576f08fc1e4', 'authors': ['Hoang-Nhat Nguyen', 'Chen Change Loy'], 'affiliations': ['S-Lab, Nanyang Technological University', 'Synvo AI'], 'pdf_title_img': 'assets/pdf/title_img/2611.34420.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#multimodal', '#cv', '#training', '#long_context'], 'emoji': '📄', 'ru': {'title': 'Страницы документа должны видеть друг друга', 'desc': 'Мультистраничные vision-language модели кодируют каждую страницу документа независимо, из-за чего на границах страниц возникает разрыв в признаках: визуальные токены формируются без доступа к содержимому соседних страниц. Авторы предлагают DocSEAM — лёгкий модуль между предобученным vision encoder и LLM, который обогащает токены текущей страницы контекстом соседних через center-anchored masked self-attention с направленными salience gates. Модуль не меняет количество визуальных токенов, а после supervised warm-up и fine-tuning модель на 9B параметров достигает state-of-the-art среди открытых моделей до 10B на пяти бенчмарках multi-page document VQA. Эксперименты с контролируемой перепагинацией показывают, что DocSEAM снижает чувствительность к положению границ страниц и улучшает локализацию ответов, распределённых между страницами.'}, 'en': {'title': 'Give Every Page Context from Its Neighbors', 'desc': 'DocSEAM is a lightweight module placed between a pretrained vision encoder and a language model. It enriches each page’s visual tokens by using masked self-attention to incorporate information from the pages immediately before and after it. The module returns only the center page’s enriched tokens, so the number of visual tokens stays unchanged. In experiments, it improved multi-page document question answering and made page-boundary placement less disruptive to locating information across pages.'}, 'zh': {'title': '让相邻页面互相补充，跨页文档理解更稳健', 'desc': '多页文档模型通常逐页处理图像，因此页面边界两侧的信息难以在视觉表示中交流。论文提出 DocSEAM，这是一个轻量模块，插入预训练视觉编码器与语言模型之间，通过中心锚定的掩码自注意力和方向显著性门控融合相邻页面的信息。该模块只输出经过增强的中心页视觉令牌，因此不会增加视觉令牌数量；训练时先进行跨页监督预热，再在多页微调阶段冻结 DocSEAM。实验显示，该方法在五个多页文档问答基准上取得所评估开源模型中的最佳结果，并降低页面重新划分时的边界敏感性、改善跨页片段定位。'}}}, {'id': 'https://huggingface.co/papers/2611.34811', 'title': 'HOG-WAM: Improving Visual Robustness through Future Gradient Prediction', 'url': 'https://huggingface.co/papers/2611.34811', 'abstract': "Abstract HOG-WAM improves visually robust control in world-action models by adding future Histograms of Oriented Gradients as auxiliary structural supervision through a training-only HOG diffusion transformer, yielding higher success under observation corruptions while preserving the original RGB-to-action inference architecture.  Generated by deepseek-ai/DeepSeek-V4.1-Flash World-action models jointly predict future observations and actions, yet visual corruption can disrupt the resulting policies. We introduce HOG-WAM, which adds future Histograms of Oriented Gradients (HOG) as structural supervision derived directly from demonstration images. An auxiliary HOG diffusion transformer (DiT) module reads RGB features through asymmetric attention, allowing its objective to shape the visual representation used for control. The module is used only during training and removed at inference, preserving FastWAM's RGB-to-action architecture. We evaluate four controlled observation corruptions through a visual-corruption extension of RoboTwin, termed RoboTwin-Plus; HOG-WAM achieves the highest success among the compared policies under all four. Mixed-noise success increases from 78.86% to 82.86% relative to FastWAM, with comparable performance on clean scenes. On LIBERO Plus, overall success increases from 74.49% to 75.26%, with the largest gain under sensor noise, from 74.14% to 78.89%. Across four Franka tasks, average success increases from 40% to 59% under clean observations and from 17% to 24% under noisy observations. A representation ablation favors combining RGB observations with auxiliary HOG prediction over replacing RGB with HOG. These findings support future-gradient prediction as complementary supervision for visually robust control, with larger absolute gains on physical tasks than in simulation. Code is available at https://github.com/iPPLab/HOG-WAM.", 'score': 20, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '283e91ca695bbb8e', 'authors': ['Boxuan Dong', 'Yupeng Qian', 'Ying Wu', 'Heshuai Li', 'Junhao Tan', 'Zhenxiong Tan', 'Weijia Wu', 'Weihao Yu'], 'affiliations': ['National University of Singapore', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34811.jpg', 'data': {'categories': ['#benchmark', '#training', '#robotics', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Структурный градиент будущего делает робота устойчивым к шуму', 'desc': 'HOG-WAM — это метод для world-action моделей, который делает роботизированное управление устойчивым к искажениям изображений. Во время обучения к основной модели добавляется вспомогательный модуль HOG DiT, который предсказывает будущие Histograms of Oriented Gradients по демонстрационным изображениям и формирует визуальное представление через асимметричное attention. Этот модуль используется только при обучении и удаляется на инференсе, поэтому архитектура RGB-to-action (FastWAM) сохраняется без изменений. Эксперименты на RoboTwin-Plus и LIBERO Plus показывают рост успешности при разных типах шумов, особенно на физических задачах с Franka.'}, 'en': {'title': 'Teach robots the shape of what comes next', 'desc': 'HOG-WAM improves the robustness of world-action models, which predict future observations and actions to control a robot. During training, an auxiliary diffusion transformer predicts future Histograms of Oriented Gradients (HOG) from RGB features, providing structural supervision that helps shape the visual representations used for control. The HOG module is removed at inference, so the model retains its original RGB-to-action architecture. Tests with corrupted observations show higher success than FastWAM across the evaluated settings, with comparable results on clean simulated scenes and larger gains on physical tasks.'}, 'zh': {'title': '用未来梯度监督，让视觉控制更稳健', 'desc': '这篇论文提出 HOG-WAM，用未来图像的方向梯度直方图（HOG）为世界—动作模型提供辅助结构监督，提升视觉受干扰时的控制能力。训练时，辅助的 HOG 扩散 Transformer 从 RGB 特征中预测未来 HOG，使视觉表征更适合控制；推理时则移除该模块，保留原有的 RGB 到动作架构。在 RoboTwin-Plus、LIBERO Plus 和 Franka 任务中，HOG-WAM 在多种观测干扰下取得更高成功率，同时在干净场景中保持相近或更好的表现。实验还表明，将 HOG 预测作为 RGB 的补充监督，比用 HOG 替代 RGB 更有效。'}}}, {'id': 'https://huggingface.co/papers/2611.34347', 'title': 'AIRIS: Benchmarking Social Embodied Intelligence in Egocentric Streaming Videos', 'url': 'https://huggingface.co/papers/2611.34347', 'abstract': 'Abstract  Embodied agents operating around people must not only recognize social cues, but also decide when the available evidence is sufficient, whether to intervene, and how to respond without violating social norms. Existing benchmarks typically evaluate these abilities in isolation or with access to completed videos, obscuring where an online social decision fails. We introduce AIRIS, a causal streaming benchmark that formulates social embodied intelligence as a time-anchored chain of Attention, Intention, Reaction, and Interaction (A-I-R-I). AIRIS contains 8,000 expert-curated questions grounded in 357 egocentric clips across 11 context categories and 36 capability dimensions. At each query, models receive only the observation prefix available at that time; decision-aware metrics reward calibrated waiting and complete reactions while penalizing premature commitment. Evaluating 45 proprietary and open-source general-purpose, embodied, streaming-video, and omni-modal models reveals fragmented and temporally miscalibrated competence. General-purpose VLMs excel at passive cue grounding and intent recognition, whereas embodied specialists lead on isolated reaction sub-decisions; yet across all families, models frequently guess intents before sufficient evidence emerges and fail to jointly align intervention timing, action domain, and concrete execution within the same episode. AIRIS thus provides a diagnostic foundation for bridging the gap between passive social perception and reliable embodied interaction.', 'score': 16, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '6e11b512b823c16b', 'authors': ['Yuchen Zhou', 'Hongsheng Wu', 'Jiayu Tang', 'Yunxuan Mao', 'Hanjing Ye', 'Shenghao Zhang', 'Jing Tang', 'Chun-Kai Fan', 'Yufei Huang', 'Yonggen Ling', 'He Zhang'], 'affiliations': ['Tencent Robotics Lab'], 'pdf_title_img': 'assets/pdf/title_img/2611.34347.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#robotics', '#alignment', '#interpretability', '#dataset', '#video', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Знать, когда ждать: социальный ИИ должен понимать момент для действия', 'desc': 'В статье представлен AIRIS — каузальный потоковый бенчмарк для оценки социального воплощённого интеллекта, где задача разбита на цепочку Attention, Intention, Reaction, Interaction (A-I-R-I). Набор содержит 8000 экспертных вопросов по 357 эгоцентрическим видеоклипам и охватывает 11 контекстов и 36 измерений способностей. Модели получают только префикс наблюдений, доступный на момент запроса, а метрики с учётом решений поощряют калиброванное ожидание и полные реакции, штрафуя преждевременные выводы. Оценка 45 моделей показывает, что VLM хорошо распознают сигналы и намерения, но модели часто угадывают намерения до появления достаточных данных и плохо согласуют время вмешательства, тип действия и его исполнение.'}, 'en': {'title': 'From noticing social cues to acting at the right moment', 'desc': 'AIRIS is a benchmark for testing how embodied agents make social decisions as events unfold. It organizes decisions into a time-based chain: Attention, Intention, Reaction, and Interaction. Models see only the video available up to each question, and the evaluation rewards waiting for enough evidence while penalizing premature guesses. Tests of 45 models found that strengths are fragmented, and models often struggle to time and carry out appropriate social responses.'}, 'zh': {'title': '从看懂社交线索，到把握时机并可靠行动', 'desc': '论文提出 AIRIS，这是一个用于评估具身智能体社交能力的因果流式基准。它把社交决策组织为注意、意图、反应和互动四个按时间推进的环节，并用 357 段第一人称视频构造了 8000 道专家标注的问题。模型每次只能看到当时已经出现的视频片段；评估指标鼓励模型在证据不足时等待、在证据充分时完整回应，并惩罚过早下结论。对 45 个模型的测试发现，它们常过早猜测意图，也难以同时把握介入时机、行动类型和具体执行，显示被动感知与可靠互动之间仍有差距。'}}}, {'id': 'https://huggingface.co/papers/2611.34128', 'title': 'FoundSurface: Feedforward Ray-Based 3D Scene Surface Reconstruction from Unposed Images', 'url': 'https://huggingface.co/papers/2611.34128', 'abstract': 'Abstract A generalizable pipeline reconstructs continuous, high-fidelity 3D surfaces from unposed images by integrating pointmap and ray-based representations, achieving strong zero-shot generalization.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Accurate 3D surface reconstruction from unposed images remains a fundamental challenge in computer vision. Recent feed-forward pointmap methods eliminate the need for camera poses but inherently produce discrete, sparse representations. In this paper, we present a generalizable pipeline that directly recovers continuous, high-fidelity 3D surfaces from unposed images by seamlessly integrating pointmap- and ray-based representations. Our approach first extracts explicit geometric priors using a pre-trained pointmap model. A query-view-centric selection module then identifies geometrically relevant reference views via a robust surfel voting mechanism. Next, a cross-attention regressor bridges target query rays with reference features to estimate a continuous coarse surface. Lastly, a raylet-based module aggregates local 3D features to carve out high-frequency details and analytical normals. Trained as a single foundation model on 9 diverse datasets, our method demonstrates exceptional zero-shot generalization on 6 unseen datasets, clearly surpassing state-of-the-art baselines in geometric accuracy and detail preservation.', 'score': 15, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '7f729aa899ae5af6', 'authors': ['Shenxing Wei', 'Jinxi Li', 'Zihui Zhang', 'Ajay Kumar', 'Wei Wang', 'Bo Yang'], 'affiliations': ['Regressor, Inc.', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2611.34128.jpg', 'data': {'categories': ['#architecture', '#training', '#3d', '#cv'], 'emoji': '🧊', 'ru': {'title': 'Непрерывные 3D-поверхности из непозированных фото без известных камер', 'desc': 'Статья предлагает обобщаемый пайплайн для восстановления непрерывных и высокодетализированных 3D-поверхностей по изображениям без известных поз камер. Метод сочетает pointmap-представления, полученные с помощью предобученной модели, и ray-based подход, где cross-attention регрессор связывает лучи целевого вида с признаками опорных видов. Модуль выбора опорных видов использует механизм surfel voting, а raylet-модуль агрегирует локальные 3D-признаки для уточнения высокочастотных деталей и аналитических нормалей. Модель обучена как единая foundation model на 9 наборах данных и демонстрирует сильную zero-shot генерализацию на 6 неизвестных датасетах, превосходя SOTA-бейзлайны по геометрической точности и сохранению деталей.'}, 'en': {'title': 'From Unposed Images to Detailed 3D Surfaces', 'desc': 'This paper presents a pipeline that reconstructs detailed, continuous 3D surfaces from images without requiring camera poses. It uses a pretrained pointmap model to obtain geometric priors, then selects relevant reference views using surfel voting. A cross-attention regressor estimates a coarse surface from query rays, while a raylet-based module adds fine details and surface normals. Trained on nine datasets, the model generalizes to six unseen datasets and outperforms existing methods in geometric accuracy and detail preservation.'}, 'zh': {'title': '融合点图与射线表示，实现泛化的高保真三维重建', 'desc': '这篇论文提出一种可泛化的流程，从没有相机位姿信息的图像中重建连续且高保真的三维表面。方法先用预训练的点图模型提取几何先验，再通过冲浪板元投票选择与查询视角相关的参考图像。随后，跨注意力回归器结合查询射线和参考特征估计连续的粗略表面，射线元模块则聚合局部三维特征，补充细节并计算解析法线。该方法在9个数据集上训练，在6个未见数据集上展现出强大的零样本泛化能力，并在几何精度和细节保留方面优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2611.33457', 'title': 'Playfulness as Feedback for Agentic Game Development', 'url': 'https://huggingface.co/papers/2611.33457', 'abstract': 'Abstract Play2Evolve uses AI agents to iteratively playtest, diagnose, and improve generated games through initialization, refinement, and evolution stages, enhancing functionality, visuals, and gameplay quality.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Coding agents can generate runnable games from natural-language descriptions. However, a runnable game does not guarantee an excellent gameplay experience for players. In our view, a playful game should provide 1) reliable core functionality, 2) appealing visual design and assets, and 3) rich gameplay that supports exploration and progression. How agents can improve these aspects of playfulness remains underexplored. In our work, we propose Play2Evolve, a recursive game development framework with three stages: Initialization, Refinement, and Evolution. Using playfulness as feedback, agents playtest the game and diagnose issues in its functionality, visual presentation, and gameplay. Their feedback guides bug fixes and asset improvements. It also helps agents propose new gameplay and aesthetic goals for continued game evolution. To enrich game materials, we combine a video generation model with code to create appealing static and dynamic assets and integrate them into interactive gameplay. Finally, Play2Evolve achieves state-of-the-art performance among the evaluated methods, scoring 60.05 on GameCraft-Bench compared with 50.81 after Game Initialization and 52.46 for Play2Code. Human overall-quality ratings reach 3.67, compared with 2.38 and 2.43, respectively. Our code will be released at https://github.com/showlab/Play2Evolve.', 'score': 14, 'issue_id': 3567, 'pub_date': '2026-11-24', 'pub_date_card': {'ru': '24 ноября', 'en': 'November 24', 'zh': '11月24日'}, 'hash': 'c5229eadcf435e6a', 'authors': ['Weijia Mao', 'Kevin Qinghong Lin', 'Zhen Fang', 'Danze Chen', 'Dongxing Mao', 'Mike Zheng Shou'], 'affiliations': ['National University of Singapore', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2611.33457.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#plp', '#games', '#video', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Игра, которая учится играть и становиться лучше сама', 'desc': 'В статье представлен Play2Evolve — рекурсивный фреймворк для автоматической разработки игр, где AI-агенты последовательно проходят этапы инициализации, доработки и эволюции. Агенты сами тестируют игру, диагностируют проблемы в функциональности, визуальной части и геймплее, и на основе этой обратной связи исправляют баги и улучшают ассеты. Для обогащения визуального контента авторы комбинируют генеративную video generation модель с кодом, создавая статичные и динамичные ассеты, которые встраиваются в интерактивный геймплей. На бенчмарке GameCraft-Bench метод набирает 60.05 балла против 52.46 у Play2Code, а человеческая оценка общего качества достигает 3.67 из 5 вместо 2.43.'}, 'en': {'title': 'Playtest, refine, and evolve better games', 'desc': 'Play2Evolve is a recursive game-development framework that uses AI agents to improve games across initialization, refinement, and evolution stages. Agents playtest each game and use feedback to diagnose problems in core functionality, visual design, and gameplay. They then fix bugs, improve assets, and propose new goals, using generated visual assets to enrich interactive play. The framework outperforms the evaluated baselines on GameCraft-Bench and receives higher overall-quality ratings from human reviewers.'}, 'zh': {'title': '让 AI 在试玩中持续进化游戏', 'desc': 'Play2Evolve 是一个让 AI 智能体反复测试并改进生成游戏的框架，分为初始化、精炼和演化三个阶段。智能体通过实际游玩来发现功能错误、视觉设计问题和玩法不足，再据此修复问题、改进素材并提出新的设计目标。该方法还结合视频生成模型与代码，制作静态和动态素材，并将它们融入可交互的游戏中。在 GameCraft-Bench 和人工评分中，Play2Evolve 的表现均优于所比较的方法，说明迭代式反馈有助于提升游戏的整体质量。'}}}, {'id': 'https://huggingface.co/papers/2611.34907', 'title': 'Agentic LongLive: Asynchronous Agentic Memory for Long Video Generation', 'url': 'https://huggingface.co/papers/2611.34907', 'abstract': "Abstract  Real-time autoregressive video generators stream minutes of video and accept new prompts on the fly, but struggle to keep people, objects, and places consistent over a long interactive story. Agent systems provide such memory for offline multi-shot generation, yet they read the whole script in advance, plan each shot before generating it, and regenerate failed shots, which a live stream does not allow. We present Agentic LongLive, an asynchronous agentic memory for long video generation. A memory agent on separate GPUs reads only the prompts revealed so far, never the generated video, and keeps a text state and evolving images for every person, object, and scene. From this entity memory it composes a global image and a per-shot memory image, which an auxiliary GPU prefills into the generator's attention sink before the next shot starts, and writes entity cards for the prompts that name them, so the video never waits for memory and video errors are not written back. A small language model, trained with reinforcement learning and an image reward calibrated using downstream video outcomes, decides what to remember before the next prompt is known. On LongStory-Online, a new benchmark of 25 stories (857 shots) revealed one shot at a time, Agentic LongLive improves persistent-state accuracy of LongLive-2.0, its base generator, by 26.3 points, protagonist identity by 44.9, and revisited-place consistency by 40.4, at about 1% extra generation time on H100. The full system streams faster than real time on one 8xB200 node with the generator in BF16 (34.3 FPS), keeps image quality stable over 14-minute stories, and improves identity on two MiniMax-H3 generators, one of which, LongLive-H3, also runs in real time with it. To our knowledge, it is the first real-time video generator with text and image memory kept by an LLM agent.", 'score': 14, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'a90de28ae810a14d', 'authors': ['Shaoteng Liu', 'Shuai Yang', 'Wei Huang', 'Luozhou Wang', 'Song Han', 'Yukang Chen'], 'affiliations': ['CUHK', 'MIT', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2611.34907.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#rl', '#small_models', '#story_generation', '#dataset', '#long_context', '#video', '#agents'], 'emoji': '🎬', 'ru': {'title': 'Память агента делает длинные видео последовательными в реальном времени', 'desc': 'Статья представляет Agentic LongLive — асинхронную агентную память для генерации длинных видео в реальном времени. Отдельный LLM-агент, обученный с помощью reinforcement learning, читает только уже известные промпты и ведёт текстовое и визуальное описание каждого персонажа, объекта и сцены. На основе этой памяти формируются глобальное и пошаговое изображения, которые заранее загружаются в attention sink генератора, поэтому видео не ждёт памяти. Система на новом бенчмарке LongStory-Online повышает согласованность персонажей и мест и работает быстрее реального времени.'}, 'en': {'title': 'Give Every Long Video a Memory That Keeps Up', 'desc': 'Agentic LongLive adds an asynchronous memory agent to real-time autoregressive video generation, helping characters, objects, and places stay consistent across long stories. The agent uses prompts revealed so far—not generated video—to maintain text and image memories, which are supplied to the generator before each new shot. A small language model trained with reinforcement learning decides what information to retain, guided by an image reward calibrated to later video quality. On a new online benchmark, the system substantially improves identity and scene consistency while adding about 1% generation time and supporting real-time video generation.'}, 'zh': {'title': '让实时长视频记住故事中的每一个人、物与地点', 'desc': '这篇论文提出了 Agentic LongLive，一种用于实时长视频生成的异步智能体记忆系统。记忆智能体只读取目前已出现的提示词，为人物、物体和场景维护文本状态与图像记忆，并在后续镜头生成前将相关记忆注入生成器。一个经过强化学习训练的小型语言模型会提前决定该记住什么，且系统不读取生成的视频，因此不会把视频错误写回记忆。实验显示，该方法能提升角色身份和场景一致性，额外生成耗时约为 1%，并可支持实时长视频生成。'}}}, {'id': 'https://huggingface.co/papers/2611.30472', 'title': 'Target-Part Preference Optimization for Part-Aware 3D Generation', 'url': 'https://huggingface.co/papers/2611.30472', 'abstract': 'Abstract Preference fine-tuning based on Direct Preference Optimization adapts a pretrained part-aware 3D generator with limited part annotations, yielding the best multi-part results at medium scale but less consistent gains under distribution shift.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Part-aware 3D generation requires not only globally plausible objects but also complete, well-separated semantic parts, yet high-quality part decompositions remain too scarce to support large-scale supervised fine-tuning. We study whether preference fine-tuning based on Direct Preference Optimization (DPO) can adapt a pretrained part-aware generator from limited part-annotated data without architectural changes. We rank candidates generated with different random seeds against ground-truth (GT) geometric metrics, and select the (object, target-part) examples with the largest across-seed quality gap. Each selected example stores a seed pair whose two flow trajectories share one clean GT compositional latent and differ only in Gaussian noise. We derive a reference-relative target-block preference loss from FlowDPO that compares the two trajectories against a frozen reference model. GT flow-matching losses on the target block and complete part set provide absolute supervision, while only the diffusion transformer (DiT) is updated. Human-ranked controls test an alternative ordering source, and synthetic cropping provides controlled loser targets that are incomplete by construction. Among the three training-set scales, the medium-scale setting gives the strongest result on held-out Objaverse and outperforms both the pretrained generator and the reported direct supervised fine-tuning baseline on the multi-part aggregate. Further analysis shows sensitivity to pair ordering, target-part coverage, and the balance between pairwise and GT supervision. Cross-dataset experiments show less consistent gains under distribution shift.', 'score': 14, 'issue_id': 3567, 'pub_date': '2026-11-23', 'pub_date_card': {'ru': '23 ноября', 'en': 'November 23', 'zh': '11月23日'}, 'hash': '34f890300400d260', 'authors': ['Zishan Qin', 'Rui Li', 'Zeyu Zhang', 'Sevvandi Kandanaarachchi', 'Lina Yao', 'Dong Gong'], 'affiliations': ['CSIRO', 'NTU', 'UNSW Sydney'], 'pdf_title_img': 'assets/pdf/title_img/2611.30472.jpg', 'data': {'categories': ['#training', '#optimization', '#synthetic', '#alignment', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Предпочтения вместо разметки: учим 3D-генератор собирать детали без лишних аннотаций', 'desc': 'Статья предлагает дообучать предобученный part-aware 3D-генератор с помощью Direct Preference Optimization (DPO), используя всего несколько размеченных частей объектов. Пары кандидатов формируются из траекторий flow-matching с одним и тем же чистым GT-латентом, но разными шумами, и ранжируются по геометрическим метрикам, а обновляется только DiT. Лучший результат на medium-масштабе превосходит и базовую модель, и supervised fine-tuning на мультидетальном агрегате, однако на сдвиге распределения (cross-dataset) прирост менее стабилен. Анализ показывает чувствительность метода к порядку пар, покрытию целевых частей и балансу между парным и GT-supervision.'}, 'en': {'title': 'Teach 3D Generators Better Parts with Preferences', 'desc': 'The paper tests whether Direct Preference Optimization (DPO) can improve a pretrained part-aware 3D generator using a limited amount of part-annotated data. It compares pairs of generated results using geometric quality metrics and trains the model to prefer the better result, while also using ground-truth flow-matching losses for supervision. Only the diffusion transformer is updated, with no changes to the model architecture. Medium-scale training gives the strongest results on held-out Objaverse, but improvements vary under distribution shift and depend on preference-pair quality and supervision balance.'}, 'zh': {'title': '用有限部件偏好数据，优化三维生成', 'desc': '这篇论文研究如何用直接偏好优化（DPO），让预训练的部件感知三维生成模型在部件标注数据有限时得到改进。作者根据几何指标比较不同随机种子生成的结果，挑选质量差异较大的样本对，并结合相对于冻结参考模型的偏好损失与真实几何监督进行微调。实验中只更新扩散 Transformer；在中等规模训练设置下，模型在 Objaverse 测试集的多部件综合表现优于预训练模型和已报告的直接监督微调基线。效果会受到偏好样本排序、目标部件覆盖率及损失平衡的影响，而且面对数据分布变化时，提升并不稳定。'}}}, {'id': 'https://huggingface.co/papers/2611.34466', 'title': 'EgoUseBench: Benchmarking Computer-Use Agents under Evolving First-Person Contexts', 'url': 'https://huggingface.co/papers/2611.34466', 'abstract': "Abstract  AI wearables, such as smart glasses, extend the context available to agents beyond digital environments to users' physical surroundings. With these devices, computer tasks can originate from users' ongoing activities rather than solely from explicit instructions. Through first-person observations, agents can identify objects and activities relevant to user requests and ground digital tasks in the surrounding context. We call this interaction paradigm Ego Use. However, first-person observations are limited by the wearer's viewpoint and may provide incomplete or ambiguous evidence of ongoing activities. As new observations arrive, agents may need to revise their understanding of the physical context and user intent, and reassess whether prior digital actions remain valid. Whether current agents can reliably handle these changes remains insufficiently evaluated. We introduce EgoUseBench, a benchmark for evaluating Ego Use across three interaction settings with different levels of first-person context. Computer-Use relies on explicit instructions, Offline Ego Use provides prerecorded first-person context before execution, and Online Ego Use provides continuous observations as user intent evolves. Based on over 74 hours of real-world first-person recordings, we construct 693 tasks across the three interaction settings. To capture task evolution, we track first-person observations, user requirements, and website state separately. We further group tasks by how information changes during execution, resulting in three types: Graft (revised user requirements), Refresh (new first-person observations), and Clarify (agent-initiated information seeking). We evaluate advanced models and find that average success rates in Online Ego Use are 26.3% lower than in Computer-Use. This result reveals the difficulty of keeping task execution aligned with evolving first-person context and user intent.", 'score': 12, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': '0cdd1ddb5340ef7b', 'pdf_title_img': 'assets/pdf/title_img/2611.34466.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agi', '#interpretability', '#dataset', '#video', '#agents'], 'emoji': '🕶️', 'ru': {'title': 'Агент в очках: удержать задачу, когда контекст меняется', 'desc': 'В статье представлен EgoUseBench, бенчмарк для оценки агентов на основе LLM, которые используют первую персону (видео с AI-очков) для выполнения задач в цифровой среде. Авторы сравнивают три режима взаимодействия: Computer-Use с явными инструкциями, Offline Ego Use с заранее записанным контекстом и Online Ego Use с непрерывными наблюдениями. Бенчмарк включает 693 задачи, построенные на более чем 74 часах реальных записей, и делится на типы Graft, Refresh и Clarify в зависимости от изменения требований. Результаты показывают, что в режиме Online Ego Use средняя успешность на 26.3% ниже, чем в Computer-Use, что выявляет сложность согласования действий агента с меняющимся контекстом и намерениями пользователя.'}, 'en': {'title': 'When the World Changes, Can AI Keep Up?', 'desc': 'This paper introduces EgoUseBench, a benchmark for evaluating AI agents that use first-person observations from wearable devices to help with digital tasks. It includes three settings—explicit computer-use instructions, prerecorded visual context, and continuous observations—and 693 tasks based on more than 74 hours of recordings. Tasks are grouped by how information changes: revised user requirements (Graft), new observations (Refresh), or agent-initiated information seeking (Clarify). Models perform substantially worse when observations and intent evolve, with online task success averaging 26.3% below computer-use success.'}, 'zh': {'title': '让智能体跟上现实变化：从第一人称视角理解并执行任务', 'desc': '论文提出 Ego Use，即智能眼镜等可穿戴设备让智能体根据用户的第一人称视角和周围环境来完成数字任务。作者构建了 EgoUseBench 基准，涵盖仅依赖明确指令、执行前提供预录环境信息，以及执行中持续接收观察这三种交互设置，并基于 74 小时以上的真实记录整理出 693 项任务。基准还将任务变化分为三类：用户需求改变（Graft）、出现新的第一人称观察（Refresh），以及智能体主动寻求信息（Clarify）。评测发现，在线 Ego Use 的平均成功率比传统计算机使用任务低 26.3%，说明智能体难以持续根据变化中的环境和用户意图调整任务执行。'}}}, {'id': 'https://huggingface.co/papers/2611.34929', 'title': 'High-Fidelity Image Matting with Pixel-Space Diffusion Transformers', 'url': 'https://huggingface.co/papers/2611.34929', 'abstract': "Abstract  Diffusion models have shown strong potential for image matting by transferring generative priors learned from large-scale pretraining. However, existing approaches largely rely on latent diffusion models, whose compressed representations and VAE-based reconstruction introduce a mismatch with the high-frequency precision required for matting. We present PixelMatte, a framework that adapts pretrained pixel-space diffusion transformers for high-fidelity image matting. We show that strong image-conditioned matting capabilities can be acquired even from a pure text-to-image model without paired image-to-image pretraining. Our approach reuses the backbone's native patch embedding to jointly process the input image, trimap, and noisy alpha matte as spatially aligned tokens, enabling direct pixel-space prediction without additional condition encoders or adapters. With pixel-accurate synthetic supervision and real-image fine-tuning, PixelMatte predicts alpha mattes in a single forward pass. Two lightweight calibration modules, LayerShift and High-Pass Refiner, further improve regional opacity accuracy and boundary fidelity. Experiments across four benchmarks and two distinct pixel diffusion backbones demonstrate substantial improvements over existing methods, reducing SAD and gradient errors by 24-44% relative to RenderMatte on P3M-500-NP and AM-2K, while achieving competitive performance on AIM-500 and RenderMatte-2K. These results demonstrate the effectiveness of pixel-space generative priors for precision-sensitive image matting. Project page: https://white-yc.github.io/pixelmatte/.", 'score': 12, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'c9766b68a51226af', 'authors': ['Baihan Yang', 'Xin Lin', 'Yufan Wei', 'Baiang Li', 'Yuheng Liu', 'Juanxi Tian', 'Xiaohui Xie', 'Truong Nguyen'], 'affiliations': ['Nanyang Technological University', 'Princeton University', 'University of California, Irvine', 'University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2611.34929.jpg', 'data': {'categories': ['#architecture', '#cv', '#training', '#optimization', '#diffusion'], 'emoji': '🖼️', 'ru': {'title': 'Пиксельные генеративные приоры дают точное матирование изображений', 'desc': 'В статье представлен PixelMatte — фреймворк, который адаптирует предобученные pixel-space диффузионные трансформеры для высокоточного матирования изображений (image matting). В отличие от latent diffusion моделей, он работает напрямую в пиксельном пространстве, что устраняет потери из-за VAE-реконструкции и сохраняет высокочастотные детали. Вход (изображение, trimap и зашумлённая альфа-маска) подаётся как пространственно выровненные токены через нативный patch embedding, а предсказание альфа-маски выполняется за один forward pass; модули LayerShift и High-Pass Refiner уточняют непрозрачность и границы. Эксперименты показывают снижение SAD и gradient-ошибок на 24–44% относительно RenderMatte на P3M-500-NP и AM-2K.'}, 'en': {'title': 'Pixel-Space Diffusion for Sharper, More Accurate Mattes', 'desc': 'PixelMatte adapts pretrained pixel-space diffusion transformers to predict precise alpha mattes for image matting. It processes the input image, trimap, and noisy alpha matte together as aligned tokens, using a text-to-image model without paired image-to-image pretraining. Trained with synthetic supervision and real-image fine-tuning, it predicts the matte in one forward pass, while LayerShift and High-Pass Refiner improve opacity and boundary accuracy. Across four benchmarks, it reduces SAD and gradient errors by 24–44% compared with RenderMatte on two datasets and performs competitively on two others.'}, 'zh': {'title': '让扩散模型在像素空间精准抠图', 'desc': '本文提出 PixelMatte，利用预训练的像素空间扩散 Transformer 实现高精度图像抠图。它将输入图像、三分图和带噪的透明度蒙版编码为对齐的图像块，在像素空间直接预测结果，无需额外的条件编码器或适配器。该方法结合像素级合成数据监督与真实图像微调，并通过 LayerShift 和 High-Pass Refiner 提升区域透明度和边界精度。实验显示，PixelMatte 在多个基准上表现出竞争力，并在部分数据集上将 SAD 和梯度误差较 RenderMatte 降低了 24% 至 44%。'}}}, {'id': 'https://huggingface.co/papers/2611.33636', 'title': 'What Is Redundant at High Resolution? Efficient Attention and Feed-Forward Design for All-in-One Image Restoration', 'url': 'https://huggingface.co/papers/2611.33636', 'abstract': 'Abstract A multi-scale image restoration network reduces redundant computation in attention and feed-forward layers to achieve state-of-the-art restoration with faster inference.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Multi-scale architectures are widely adopted in all-in-one image restoration (AIO-IR) to capture larger-scale context at low-resolution stages and refine details at high-resolution (HR) stages. However, processing spatially large feature maps at HR stages incurs substantial computational costs and memory traffic, making efficient HR processing challenging. To address this challenge, we propose High-resolution Global-Local Restoration (HiGLR), an efficient multi-scale AIO-IR network grounded in an analysis of spatial redundancy in self-attention and convolutional feed-forward networks (ConvFFNs). Specifically, this analysis identifies three key redundancies: per-query readout at the finest-scale stage, key routing across neighboring queries at intermediate stages, and spatial mixing in the expanded feature spaces of ConvFFNs. Accordingly, HiGLR replaces costly self-attention at the finest-scale stage with a learned input-independent kernel. At intermediate stages, we propose a Block-Routed Hybrid Attention, which combines coarse-scale dense attention with fine-scale block-sparse attention over value residuals relative to coarse summaries, and shares routing indices across neighboring queries. We further introduce a Dual-Space FFN that performs spatial mixing in a compact space and pointwise nonlinear transformation in an expanded space, enabling efficient kernel fusion. Combining these designs, HiGLR achieves state-of-the-art performance while delivering up to a 4.24times inference speedup over existing methods.', 'score': 12, 'issue_id': 3567, 'pub_date': '2026-11-25', 'pub_date_card': {'ru': '25 ноября', 'en': 'November 25', 'zh': '11月25日'}, 'hash': 'f922c18b25c7a011', 'authors': ['Dongheon Lee', 'DongJae Lee', 'Sewhan Chun', 'Chanseul Cho', 'Youngwook Kim', 'Youngmin Ro', 'Yonghyun Jeong'], 'affiliations': ['Kookmin University', 'NAVER Cloud', 'University of Seoul'], 'pdf_title_img': 'assets/pdf/title_img/2611.33636.jpg', 'data': {'categories': ['#architecture', '#optimization', '#inference', '#cv'], 'emoji': '⚡', 'ru': {'title': 'Восстанавливаем изображения быстрее за счёт устранения избыточности вычислений', 'desc': 'Статья представляет HiGLR — эффективную multi-scale сеть для all-in-one восстановления изображений, которая снижает избыточные вычисления в self-attention и ConvFFN на высоком разрешении. На самом тонком масштабе обычный self-attention заменяется обучаемым input-independent kernel, а на промежуточных — используется Block-Routed Hybrid Attention, сочетающий dense attention на грубом масштабе с block-sparse attention на тонком и разделяющий routing indices между соседними запросами. Dual-Space FFN выполняет пространственное смешивание в компактном пространстве и поточечную нелинейность в расширенном, что упрощает kernel fusion. Итоговая модель достигает state-of-the-art качества и ускорения инференса до 4.24 раза по сравнению с существующими методами.'}, 'en': {'title': 'Restore More, Compute Less', 'desc': 'HiGLR is a multi-scale network for all-in-one image restoration that aims to reduce computation on high-resolution feature maps. It replaces fine-scale self-attention with a learned input-independent kernel and uses Block-Routed Hybrid Attention at intermediate scales, combining dense coarse attention with sparse local routing. Its Dual-Space FFN performs spatial mixing in a compact feature space and nonlinear transformations in an expanded space. Together, these designs reduce redundant computation and memory traffic while achieving state-of-the-art restoration performance and up to 4.24× faster inference than existing methods.'}, 'zh': {'title': '削减空间冗余，让多尺度图像恢复更快', 'desc': '本文提出高分辨率全局—局部图像恢复网络 HiGLR，用于提升多尺度全能图像恢复的效率。针对高分辨率特征图计算开销大、内存访问量高的问题，作者分析了自注意力和卷积前馈网络中的空间冗余。HiGLR在最细尺度用可学习的输入无关核替代自注意力，并在中间尺度结合粗尺度密集注意力与细尺度块稀疏注意力，同时让邻近查询共享路由索引。它还通过双空间前馈网络分别在紧凑空间进行空间混合、在扩展空间进行逐点非线性变换，在保持先进恢复效果的同时，推理速度最高提升4.24倍。'}}}, {'id': 'https://huggingface.co/papers/2611.31237', 'title': 'Let Vision-Language Models Generate Images through Their Representations', 'url': 'https://huggingface.co/papers/2611.31237', 'abstract': 'Abstract Integral converts a pretrained vision-language model into a unified multimodal model by constructing a shared visual representation space, preserving understanding while enabling strong visual generation.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Recent unified multimodal models aim to combine visual understanding and generation within a single model, yet effectively integrating the two capabilities remains challenging. Leveraging pretrained vision-language models offers a way to build on already learned multimodal knowledge, but making this knowledge effectively accessible to visual generation remains nontrivial. We find that a central challenge lies in the heterogeneous visual representations used for understanding and generation. To address this challenge, we introduce Integral, which converts a pretrained vision-language model into a unified multimodal model by constructing a shared visual representation space across the two capabilities. Integral implements this design through two complementary components. Abstraction Fusion constructs shared visual tokens by aggregating hierarchical representations from the frozen vision encoder, while Block-wise MoT introduces a lightweight generative stream that interacts with the vision-language model only at block boundaries. Our approach effectively preserves the pretrained understanding capability while extending it to strong visual generation.
