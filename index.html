ration, which delays responses and tool calls. Using the idle compute for the next chunk requires decoding it before its audio arrives, under an assumed input. Taking silence as the assumed input and comparing the output with the output under real audio on four models, we observe two properties. First, the next audio chunk does not change the output in 95.3% of chunks. Second, 88% of changes begin at the first output token. Building on these properties, we propose Speculative Listening, a training-free, lossless framework for input-time self-speculative decoding. During idle time, the model drafts the next chunk under silence and, for changes at the first token, a second branch from the runner-up first token. It keeps all drafts in a cross-chunk hypothesis pool and verifies them when the audio arrives. On our eight-task benchmark TickTock-Bench, Speculative Listening speeds up speak chunks by 2.6-2.8x and tool-call chunks by up to 23.4x. On average, it reduces the decoding delay before a response starts by 73%, to 74-241 ms, close to the 200 ms gap between human turns, and the maximum lag behind real time by 94.4%.', 'score': 5, 'issue_id': 3504, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'a2bfa83ca406c990', 'pdf_title_img': 'assets/pdf/title_img/2611.06982.jpg', 'data': {'categories': ['#audio', '#inference', '#optimization'], 'emoji': '🎙️', 'ru': {'title': 'Слушаем и думаем наперёд: быстрый голосовой ответ без потери качества', 'desc': 'Авторы предлагают Speculative Listening — метод speculative decoding без дообучения и без потери качества для full-duplex речевых языковых моделей (speech LLM), работающих с аудио по фиксированным чанкам. Во время простоя модель заранее генерирует черновик следующего чанка, предполагая тишину на входе, а при изменении первого токена учитывает и второго кандидата. Все черновики хранятся в пуле гипотез и проверяются, когда приходит реальное аудио. На бенчмарке TickTock-Bench задержка до ответа сокращается на 73% и приближается к естественной паузе между репликами людей (около 200 мс).'}, 'en': {'title': 'Turn Idle Listening Time into Faster Responses', 'desc': 'Chunk-interleaved speech models often have idle compute while waiting for audio, but later speech and tool calls must be generated serially. The paper finds that the next audio chunk leaves the model’s output unchanged in most cases, so it proposes Speculative Listening, a training-free, lossless form of speculative decoding. During idle time, the model drafts likely outputs using silence and keeps alternative drafts that can be checked against the real audio when it arrives. On an eight-task benchmark, this approach speeds up speech and tool-call generation and substantially reduces response delay and lag behind real time.'}, 'zh': {'title': '趁等待先草拟，音频到达即验证', 'desc': '这篇论文提出一种无需训练且不损失生成结果的推测式解码方法，利用全双工语音模型等待音频时闲置的计算资源，提前草拟后续输出块。研究发现，95.3%的输出块不会因真实音频输入而改变；发生变化时，88%会从第一个输出词元开始。该方法在静音假设下生成候选输出，并在音频到达后验证候选，同时为首词元可能变化的情况保留另一条候选分支。在基准测试中，它将语音输出块加速约2.6至2.8倍、工具调用块最高加速23.4倍，并显著降低响应延迟。'}}}, {'id': 'https://huggingface.co/papers/2611.08376', 'title': 'Muir: Linear Attention with Sensitivity-Allocated Gating and Matched-Filter Readout', 'url': 'https://huggingface.co/papers/2611.08376', 'abstract': 'Abstract A linear attention architecture called Muir allocates gate capacity by sensitivity, uses matched-filter readout and a stable parallel update, improving language modeling, long-context recall, and training speed over Gated DeltaNet-2 and Transformer baselines.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Linear attention compresses context into a fixed-size key-value state for linear-time training and constant-memory inference. Gated delta-rule models decay this state and erase its prediction for an incoming key before writing a new value; Gated DeltaNet-2 (GDN-2) generalizes this with channel-wise decay and decoupled, full-rank erase and write gates. However, we show that state updates are far less sensitive to erasure than to writes: key activation and unit normalization concentrate key energy onto a sparse subset of channels, whereas value writes scale all channels, so the erase gate can be parameterized at lower rank. Furthermore, slow-decaying state rows accumulate much larger norms than fast rows, dominating unweighted readout and forcing stronger write-time erasure to suppress interference. Guided by this analysis, we introduce Muir, which fuses all gates into a sensitivity-allocated low-rank projection, re-weights state rows with a matched-filter readout gate, and reinvests the saved parameters in a wider feed-forward network. Because standard chunkwise algorithms become numerically unstable at the large chunk sizes needed to saturate wide matrix units, we design a parallel update for stable, efficient training. Across 166M-1.34B parameters, Muir lowers perplexity by 1.8-2.0% over GDN-2 and 2.5-3.6% over Transformer, raises commonsense accuracy by up to 1.9 points, and improves extractive recall over GDN-2. At 1.34B, Muir outperforms both baselines on multi-hop and multi-needle recall, extrapolates 2,560x from its 4K training length to 10M-token streams without perplexity drift, and maintains near-100% passkey retrieval to 1M tokens with static readout. Muir achieves these gains while matching GDN-2 throughput, reaching its 100B-token validation loss 1.2x faster, and training 2.7x faster than Transformer at 32K.', 'score': 4, 'issue_id': 3505, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '940fb9a2924fee7c', 'authors': ['Tushaar Gangavarapu', 'Gil Tabak', 'Clemens JS Schaefer'], 'affiliations': ['Google', 'University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2611.08376.jpg', 'data': {'categories': ['#benchmark', '#long_context', '#optimization', '#training', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Умно распределяем память: линейное внимание, которое помнит дальше и учится быстрее', 'desc': 'Статья представляет Muir — новую архитектуру линейного внимания, которая распределяет ёмкость гейтов по чувствительности и использует matched-filter readout для взвешивания строк состояния. Авторы показывают, что обновления состояния гораздо чувствительнее к записи, чем к стиранию, поэтому ранг гейта стирания можно снизить, а сэкономленные параметры вложить в более широкую FFN. Для стабильного и эффективного обучения при больших размерах чанков предложено параллельное обновление. Модель снижает perplexity на 1.8–3.6% относительно GDN-2 и Transformer, улучшает long-context recall и обучается до 2.7 раза быстрее Transformer при 32K.'}, 'en': {'title': 'Muir: Spend Memory Capacity Where It Matters Most', 'desc': 'Muir is a linear attention model that keeps a fixed-size key-value memory, enabling efficient processing of long sequences. It assigns fewer parameters to erasure, which matters less than writing, and uses a matched-filter readout to balance the influence of memory rows. A stable parallel update makes training efficient, while saved parameters are used to widen the feed-forward network. Across model sizes, Muir improves language modeling and long-context recall over Gated DeltaNet-2 and Transformer baselines, while training faster than a Transformer at long sequence lengths.'}, 'zh': {'title': '按敏感度分配门控，让线性注意力更快、更善于长程记忆', 'desc': 'Muir 是一种线性注意力架构，它把上下文压缩成固定大小的键值状态，从而实现线性时间训练和固定内存推理。研究发现，状态更新对写入比对擦除更敏感，因此 Muir 按通道敏感度分配门控容量，并用匹配滤波读出重新加权状态行。它还采用稳定的并行更新算法，使大块训练更高效，并将节省的参数用于扩展前馈网络。在多种模型规模的实验中，Muir 在语言建模、长上下文检索和训练速度上优于 Gated DeltaNet-2 与 Transformer 基线。'}}}, {'id': 'https://huggingface.co/papers/2611.08483', 'title': 'SwarmEvolve: Latent Agent Swarms for Evolutionary Discovery and Optimization', 'url': 'https://huggingface.co/papers/2611.08483', 'abstract': "Abstract  LLM-guided evolutionary search uses AI agents to improve programs for mathematical and computational problems by iteratively refining solutions and combining high-scoring methods. However, the process is often slow because the LLM generates a long textual chain of thought for each round and must repeat this generation many times to maintain population diversity. We present SwarmEvolve, a framework in which hundreds of low-cost agents per round work in swarms, reason in latent space without decoding to text, and share information by passing KV caches. Each swarm studies the problem from a different angle. A novelty filter keeps the most distinct agent ideas by directly measuring the distances between the agents' hidden state vectors. Crossover of ideas happens naturally in latent space, as a summarizer agent receives the combined KV caches of all swarm members. On 21 problems in mathematical discovery and scientific computing, SwarmEvolve gets the highest average score and needs a median of only 3 to 8 minutes to reach the best scores that other state-of-the-art frameworks reach in 60 minutes. On several problems, SwarmEvolve with Qwen3 8B improves on the solutions that AlphaEvolve first found with frontier LLMs. Our work shows that agent swarms that communicate in latent space offer a fast, low-cost approach to program search for scientific problems.", 'score': 3, 'issue_id': 3506, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '220ba0f0d69a453e', 'authors': ['Qile Jiang', 'George Em Karniadakis'], 'affiliations': ['Division of Applied Mathematics, Brown University'], 'pdf_title_img': 'assets/pdf/title_img/2611.08483.jpg', 'data': {'categories': ['#agents', '#plp', '#math', '#science', '#optimization', '#inference'], 'emoji': '🐝', 'ru': {'title': 'Рой агентов думает в латентном пространстве и находит решения быстрее', 'desc': 'Статья представляет SwarmEvolve — фреймворк для эволюционного поиска программ с помощью LLM, где сотни дешёвых AI-агентов работают роями и рассуждают в латентном пространстве, не генерируя текст на каждом шаге. Агенты обмениваются информацией через передачу KV-кэшей, а фильтр новизны отбирает наиболее различающиеся идеи по расстояниям между скрытыми векторами состояний. Скрещивание идей происходит естественно: агент-суммаризатор получает объединённые KV-кэши всех членов роя. На 21 задаче математического открытия и научных вычислений SwarmEvolve показывает лучший средний результат и достигает лучших решений в разы быстрее известных фреймворков.'}, 'en': {'title': 'Let AI Agent Swarms Evolve Programs at Latent Speed', 'desc': 'SwarmEvolve speeds up evolutionary program search by using swarms of many low-cost AI agents. Instead of generating long text explanations, agents reason in latent space and share information through key-value (KV) caches. The framework preserves diverse ideas by measuring distances between hidden-state vectors, while a summarizer combines agents’ caches to enable crossover. Across 21 scientific and mathematical problems, it reaches top scores much faster than existing methods, sometimes improving on solutions found using frontier language models.'}, 'zh': {'title': '让智能体群在潜在空间协作，加速科学程序搜索', 'desc': '这篇论文提出 SwarmEvolve，用许多低成本智能体组成的群体来搜索和改进程序。智能体在潜在空间中推理，并通过传递 KV 缓存分享信息，避免每轮都生成冗长的文本思维链。框架还用隐藏状态向量之间的距离筛选新颖想法，并让总结智能体融合不同群体的思路。在 21 个数学发现与科学计算问题上，SwarmEvolve 得分领先，通常只需 3 到 8 分钟便达到其他先进方法约 60 分钟才能取得的成绩。'}}}, {'id': 'https://huggingface.co/papers/2611.04386', 'title': 'StepX-OPD: Rethinking Multi-Teacher On-Policy Distillation in Diffusion Models', 'url': 'https://huggingface.co/papers/2611.04386', 'abstract': "Abstract StepX-OPD jointly trains a text-to-image diffusion model to acquire capabilities and few-step sampling simultaneously, outperforming sequential approaches while reducing training cost.  Generated by thinkingmachines/Inkling-Small A deployable text-to-image diffusion model must hold several capabilities at once, such as instruction following, text rendering and human preference, and must sample in a few steps. Capabilities and few-step sampling are built in separate stages: a full-step model first consolidates capabilities through multi-teacher on-policy distillation, then serves as a fixed teacher for step distillation. Every full-step model we evaluate scores lower once compressed, and the second stage cannot begin until the first finishes. We introduce StepX-OPD, which merges the two stages: one student acquires every capability while learning to sample in a few steps, so frozen specialists supervise it on the states its own rollout visits rather than on a longer trajectory it never runs. Because a decomposition of the rollout's KL weights velocity mismatch most heavily near the clean end, we also regress the student's velocity on the low-noise part of the rollout. Separately, we find that capability integration makes models write prompt words into images on prompts that never asked for text, and we give a variant that lowers it. We evaluate on SD3.5-Medium and FLUX.1-dev across instruction following, text rendering, image quality and human preference. On both architectures, StepX-OPD attains the highest normalized average score among the four-step methods compared and exceeds the forty-step Flow-OPD model, and on SD3.5-Medium it trains with about 37% fewer GPU-hours than sequential DiffusionOPD followed by step distillation.", 'score': 2, 'issue_id': 3506, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'a9bdfcab3a1ca2b3', 'authors': ['Chenru Wang', 'Xuanyang Zhang', 'Yucheng Han', 'Wenbo Nie', 'Wei Cheng', 'Xianfang Zeng', 'Gang YU', 'Chi Zhang'], 'affiliations': ['StepFun', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2611.04386.jpg', 'data': {'categories': ['#multimodal', '#training', '#diffusion', '#optimization', '#inference', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Учим диффузию сразу всему и быстро: один студент вместо двух этапов', 'desc': 'Авторы предлагают StepX-OPD — метод, который объединяет два обычно разделённых этапа обучения text-to-image диффузионной модели: приобретение нескольких возможностей и дистилляцию для сэмплирования в несколько шагов. Вместо последовательной схемы один студент учится одновременно следовать инструкциям, рендерить текст и соответствовать человеческим предпочтениям, а замороженные учителя-специалисты дают supervision на состояниях, которые реально посещает его собственный rollout. Дополнительно регрессия скорости (velocity) на малошумной части траектории компенсирует рассогласование в конце генерации, а отдельный вариант снижает появление лишних текстовых надписей на картинках. На SD3.5-Medium и FLUX.1-dev метод превосходит другие четырёхшаговые подходы и даже 40-шаговую модель Flow-OPD, при этом на SD3.5-Medium обучение требует примерно на 37% меньше GPU-часов.'}, 'en': {'title': 'Learn more, generate faster—in one training stage', 'desc': 'StepX-OPD trains a text-to-image diffusion model to gain multiple capabilities and generate images in just a few sampling steps at the same time. Frozen specialist models supervise the student on the states it actually visits during its own generation process, rather than on a longer trajectory. The method also emphasizes matching the model’s velocity near the clean end of generation, and offers a variant that reduces unwanted text appearing in images. Tests on SD3.5-Medium and FLUX.1-dev show strong four-step performance, including higher average scores than a forty-step baseline, with lower training cost than a sequential approach.'}, 'zh': {'title': '能力与少步采样，一次联合学成', 'desc': '这篇论文提出 StepX-OPD，让文生图扩散模型在同一阶段学习多种能力，并同时学会用少量采样步数生成图像。与先训练完整模型、再压缩采样步骤的顺序方法不同，它让冻结的专家模型根据学生模型自身生成过程中的状态提供监督。研究还发现，模型可能会在未要求文字的提示中擅自生成文字，因此提出了降低这种现象的变体。实验显示，该方法在四步采样方法中取得最高的归一化平均分，超过一个四十步模型，并在 SD3.5-Medium 上比顺序训练节省约 37% 的 GPU 时间。'}}}, {'id': 'https://huggingface.co/papers/2609.37820', 'title': 'Information Games: Strategic Crowding and Firm Repositioning in Language-Model Space', 'url': 'https://huggingface.co/papers/2609.37820', 'abstract': 'Abstract Firms’ capacity adjustments to cash-flow shocks are modeled as costly competitive moves and tested through simulation and news/analyst data using language-model-based relevance measures.  Generated by deepseek-ai/DeepSeek-V4.1-Flash When firms respond to new market opportunities, their capacity choices alter the future discounted free cash flows available to both competitors and investors. In competitive markets, these investment decisions publicized in news articles and analyst reports, measuring the changes in capital structure, product mix, firm leadership, risk exposure and operating procedure made by the firm. Modern search engines rely on Large Language Models to measure the relevancy of source documents to given search query. These measurements let researchers represent these news articles as clouds of dense vectors whose information geometry reflects the dissimilarity of firms over time. Building on Xu et al. (2022), we develop a model of costly competitive adjustment in which firms allocate capacity in which firms make firm capacity adjustment towards free cash flow shocks. Using a novel sandwich estimator, we analyse the sign and magnitude of this predicted adjustment using multi-agent simulation, and validate our findings on a sample of news and analyst reports from Nasdaq-listed companies between 2018-2022.', 'score': 2, 'issue_id': 3505, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '8acc52900955a08e', 'authors': ['Marcus Gawronsky', 'Chun-Sung Huang'], 'affiliations': ['Department of Finance and Tax, University of Cape Town'], 'pdf_title_img': 'assets/pdf/title_img/2609.37820.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🏭', 'ru': {'title': 'Гонка мощностей: как фирмы конкурируют, реагируя на денежные потоки', 'desc': 'Статья моделирует, как фирмы корректируют производственные мощности в ответ на шоки свободного денежного потока, рассматривая такие корректировки как затратные конкурентные ходы. Для проверки авторы применяют multi-agent simulation и sandwich estimator, а также анализируют новости и отчеты аналитиков по компаниям Nasdaq за 2018–2022 годы. Для измерения релевантности документов используются эмбеддинги, полученные с помощью LLM, что позволяет представить новости как облака плотных векторов и оценить динамическую несхожесть фирм во времени. Результаты показывают знак и величину предсказанной корректировки мощностей, подтверждая модель на эмпирических данных.'}, 'en': {'title': 'Tracking Firms’ Competitive Adjustments with Language Models', 'desc': 'This paper models how firms adjust their capacity when free cash flows change, treating these adjustments as costly competitive decisions. It uses language models to turn news articles and analyst reports into dense vector representations that capture how firms change over time. The researchers test predicted adjustment patterns with multi-agent simulations and a sandwich estimator. They also compare the model’s predictions with reports about Nasdaq-listed firms from 2018 to 2022.'}, 'zh': {'title': '从现金流冲击到产能竞争：用语言模型读懂企业调整', 'desc': '本文研究企业如何因自由现金流冲击而调整产能，以及这些调整如何影响竞争对手和投资者未来可获得的现金流。作者建立了一个模型，将企业的产能调整视为有成本的竞争行为，并用多智能体模拟检验模型预测。研究还利用大型语言模型的相关性度量，将新闻报道和分析师报告表示为稠密向量，以刻画企业随时间变化的差异。最后，作者使用一种新的 sandwich 估计量分析调整的方向和幅度，并以 2018 至 2022 年纳斯达克上市公司的相关文本数据验证结果。'}}}, {'id': 'https://huggingface.co/papers/2611.07298', 'title': 'Reducing Representational Interference in Retrieval Embeddings with Trainable Prefix Tokens', 'url': 'https://huggingface.co/papers/2611.07298', 'abstract': 'Abstract Prepending trainable [DUMP] tokens during embedding model training reduces residual token-level signals and improves retrieval representations without changing architecture, pooling, or loss.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Embedding models compress variable-length text into fixed-size vector representations, but this compression can entangle semantic content with residual token-level information, such as artifacts arising from attention sink behavior. We propose a simple method that prepends trainable [DUMP] tokens to the input during embedding model training. The method keeps the model architecture, pooling strategy, and training loss unchanged, while optimizing the added tokens through the standard contrastive retrieval objective. By introducing trainable prefix positions that interact with regular tokens during encoding, [DUMP] tokens help reduce the influence of residual or uninformative token-level signals on the final retrieval representation. Experiments on standard retrieval and long-context benchmarks show that our method consistently improves over finetuned baselines across encoder and decoder embedding models. Further analysis shows that [DUMP] tokens alter token-level activation and attention patterns associated with low-information tokens. These results suggest that trainable prefix tokens provide a lightweight way to improve retrieval representations.', 'score': 2, 'issue_id': 3505, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '52e34e1662a49f99', 'authors': ['Seongtae Hong', 'Youngjoon Jang', 'Jungseob Lee', 'Chanjun Park', 'Heuiseok Lim'], 'affiliations': ['Korea University', 'Soongsil University'], 'pdf_title_img': 'assets/pdf/title_img/2611.07298.jpg', 'data': {'categories': ['#interpretability', '#benchmark', '#long_context', '#training', '#architecture'], 'emoji': '🧹', 'ru': {'title': 'Обучаемые префиксы очищают эмбеддинги от лишнего шума', 'desc': 'В статье предлагается простой метод обучения эмбеддинг-моделей: к входной последовательности добавляются обучаемые токены [DUMP], которые оптимизируются вместе с остальной моделью. Архитектура, стратегия пулинга и функция потерь при этом не меняются, а обучение ведётся стандартной контрастивной целью для поиска. Такие токены снижают влияние остаточных и малоинформативных token-level сигналов, включая артефакты attention sink, на итоговое векторное представление. Эксперименты на стандартных retrieval и long-context бенчмарках показывают стабильный прирост над fine-tuned базовыми моделями для encoder и decoder LLM.'}, 'en': {'title': 'Trainable Prefix Tokens for Cleaner Retrieval Vectors', 'desc': 'Embedding models turn text into fixed-size vectors, but these vectors can retain unhelpful signals from individual tokens. The paper introduces trainable [DUMP] tokens at the start of the input and optimizes them with the usual contrastive retrieval objective. The method leaves the model architecture, pooling strategy, and loss unchanged, while the added tokens help reduce the effect of low-information token signals. Tests on retrieval and long-context benchmarks show consistent improvements over fine-tuned baselines for both encoder and decoder embedding models.'}, 'zh': {'title': '加上可学习前缀，让检索向量甩掉无关信号', 'desc': '嵌入模型会把长短不一的文本压缩成固定长度向量，但向量中可能混入无关的词元级信息。本文提出在训练输入前添加可学习的 [DUMP] 前缀词元，并使用标准对比检索目标优化它们。该方法不改变模型架构、池化策略或损失函数，前缀词元则通过与普通词元交互，减弱低信息信号对最终检索表示的影响。在多种检索和长上下文基准上，该方法持续优于微调基线，且会改变与低信息词元相关的激活和注意力模式。'}}}, {'id': 'https://huggingface.co/papers/2611.07613', 'title': 'Towards Real-Time Full-Waveform LiDAR Transformers via Intensity-Guided Token Reduction and Physics-Aware Augmentation', 'url': 'https://huggingface.co/papers/2611.07613', 'abstract': 'Abstract A token pruning and merging mechanism and a waveform-preserving augmentation improve a full-waveform LiDAR Transformer to real-time speed and higher accuracy with better generalization.  Generated by deepseek-ai/DeepSeek-V4.1-Flash LiDAR is a critical sensor for autonomous driving and robotics, yet it remains vulnerable to adverse conditions such as fog, rain, transparent objects, and low-reflectance surfaces. Full-waveform LiDAR (FWL) addresses these limitations by capturing the complete return waveform as a histogram, preserving rich reflection characteristics including multi-path echoes and weak signals. While recent Transformer-based approaches have demonstrated promise on FWL data, two fundamental bottlenecks remain: high computational cost from redundant tokens in low-intensity background regions, and limited generalization due to scarce annotated training data. We address both bottlenecks by exploiting the physical structure inherent to FWL data. First, we propose FWL-ToPM, a token pruning and merging mechanism that leverages intensity distributions to selectively reduce tokens while retaining critical waveform content. Second, we introduce FWLAug, a data augmentation framework designed as a regularization method that preserves waveform structure, retaining the Time-of-Flight waveform of each ray and the frustum geometry, to improve generalization to unseen scenes. Evaluated on the Ghost-FWL benchmark, FWL-ToPM achieves over 8 times speedup at real-time throughput alongside a nearly 9-point F1 gain over the prior state of the art, establishing the first real-time FWL Transformer that simultaneously improves accuracy. FWLAug further improves performance on both the standard benchmark and an out-of-distribution test set of unseen scenes. Together, these methods push FWL-based perception toward practical deployment. The code and the OOD dataset are publicly available and can be accessed via the project page: https://keio-csg.github.io/FWL-ToPM', 'score': 2, 'issue_id': 3505, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': '20485785a7766e5d', 'authors': ['Kotaro Oishi', 'Kazuma Ikeda', 'Ryosei Hara', 'Ryo Yoshida', 'Mariko Isogawa', 'Kentaro Yoshioka'], 'affiliations': ['Keio University'], 'pdf_title_img': 'assets/pdf/title_img/2611.07613.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#synthetic', '#data', '#training', '#optimization', '#inference', '#architecture', '#cv'], 'emoji': '📡', 'ru': {'title': 'Быстрый и точный LiDAR-Transformer, который видит сквозь туман', 'desc': 'Статья посвящена full-waveform LiDAR (FWL), который записывает всю форму отражённого сигнала в виде гистограммы и потому устойчив к туману, дождю и слабоотражающим поверхностям. Авторы предлагают FWL-ToPM, механизм token pruning и token merging на основе распределения интенсивности, который убирает избыточные токены фоновых областей в Transformer-модели. Вторым вкладом является FWLAug, метод аугментации как регуляризации, сохраняющий структуру волны и frustum-геометрию для лучшей generalization на неизвестных сценах и out-of-distribution данных. На бенчмарке Ghost-FWL метод даёт ускорение более чем в 8 раз до real-time скорости и прирост F1 почти на 9 пунктов над предыдущим state of the art.'}, 'en': {'title': 'Faster Full-Waveform LiDAR, Without Losing the Signal', 'desc': 'The paper improves Transformer models that process full-waveform LiDAR, which records detailed reflected light signals but can be costly to analyze and difficult to train with limited labeled data. FWL-ToPM prunes unnecessary tokens from low-intensity regions and merges useful information, reducing computation while preserving important waveform details. FWLAug creates training examples that preserve each ray’s time-of-flight waveform and geometric structure, helping the model generalize to new scenes. On the Ghost-FWL benchmark, the methods deliver over eight times the speed, nearly a nine-point F1 improvement over prior work, and stronger results on unseen scenes.'}, 'zh': {'title': '精简波形 Token，打造又快又准、泛化更强的激光雷达感知', 'desc': '全波形激光雷达能记录回波的完整波形，帮助识别雾雨或弱反射等复杂环境中的物体，但现有 Transformer 计算开销大，也容易因标注数据不足而难以泛化。论文提出 FWL-ToPM，根据信号强度分布剪除或合并冗余 token，同时保留重要的波形信息。论文还提出 FWLAug，一种保持飞行时间波形与视锥几何结构的数据增强方法，以提升模型对新场景的泛化能力。在 Ghost-FWL 基准上，FWL-ToPM 将速度提升超过 8 倍，F1 分数提高近 9 个百分点；FWLAug 也改善了标准测试和未见场景上的表现。'}}}, {'id': 'https://huggingface.co/papers/2611.08369', 'title': 'NPCBench: A Clinical Apprenticeship Benchmark for Multimodal Care-Pathway Reasoning in Nasopharyngeal Carcinoma', 'url': 'https://huggingface.co/papers/2611.08369', 'abstract': "Abstract NPCBench evaluates whether medical AI models can integrate subspecialty knowledge with multimodal evidence and maintain temporally coherent diagnostic and care decisions across longitudinal nasopharyngeal carcinoma patient pathways.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Current medical benchmarks typically break down clinical competence into isolated factual questions, single-image tasks, or static case vignettes. These tests score individual answers, but reveal less about whether a model can integrate subspecialty knowledge with multimodal evidence and track a patient's condition throughout a course of care. To close this gap, we introduce NPCBench, a clinical apprenticeship benchmark for nasopharyngeal carcinoma (NPC). NPCBench mirrors specialist training, from guideline and foundational knowledge to case planning, longitudinal review, CarePath integration, and open-ended consultation. It contains 4,777 component and consultation items and a 100-patient CarePath cohort with 417 scored diagnostic and care tasks. The episode-level evaluation tests whether diagnostic and care answers are jointly correct within a care pathway. By linking stepwise tasks to patient-level care trajectories, NPCBench evaluates whether models ground decisions in visual evidence, interpret changes in patient state, and meet clinical requirements in consultation. Across 30 evaluated models, we observe a composition gap: strong performance on individual tasks does not ensure jointly correct diagnostic and care answers for the same patient. Among 21 multimodal models, strict CarePath success reaches at most 23%. Paired controls and physician calibration further examine evidence grounding, longitudinal revision, and consultation judging. Overall, NPCBench broadens the evaluation of medical artificial intelligence beyond static question-answering paradigms to an apprenticeship-oriented assessment of clinical workflows, thereby offering a testbed for evidence-based and temporally coherent reasoning in oncology care.", 'score': 2, 'issue_id': 3504, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'f5f5313ce0fa26fd', 'authors': ['Pengkai Wang', 'Wei-Wei Zhang', 'Yan Li', 'Min Tang', 'Zhitian Hou', 'Zeyu Liu', 'Guanghao Zhu', 'Yuanyi Wang', 'Yanggan Gu', 'Wenjun Wang', 'Minheng Ni', 'Congkai Xie', 'Zhijie Sang', 'Jianmin Wu', 'Ying Sun', 'Hongxia Yang'], 'affiliations': ['Monash University', 'Sun Yat-sen University', 'Sun Yat-sen University Cancer Center', 'The Hong Kong Polytechnic University', 'infix.ai'], 'pdf_title_img': 'assets/pdf/title_img/2611.08369.jpg', 'data': {'categories': ['#dataset', '#healthcare', '#reasoning', '#benchmark', '#multimodal', '#science'], 'emoji': '🩺', 'ru': {'title': 'Хороший ответ на отдельный вопрос не означает, что AI понимает весь путь пациента', 'desc': 'Статья представляет NPCBench — бенчмарк для оценки медицинских AI-моделей на примере назофарингеальной карциномы (NPC). В отличие от традиционных тестов с отдельными вопросами или одиночными изображениями, он моделирует обучение специалиста: от знаний по гайдлайнам до длительного наблюдения за пациентом и открытых консультаций. Бенчмарк содержит 4 777 элементов и когорту из 100 пациентов с 417 задачами, а оценка проводится на уровне эпизодов, проверяя совместную корректность диагностики и лечения. Результаты 30 моделей показывают «разрыв композиции»: высокие результаты по отдельным задачам не гарантируют правильных решений для одного пациента, а лучший успех мультимодальных LLM в строгом сценарии CarePath составляет лишь 23%.'}, 'en': {'title': 'Beyond Single Answers: Testing AI Across the Cancer Care Journey', 'desc': "NPCBench is a benchmark for testing whether medical AI can manage nasopharyngeal cancer care across a patient's full treatment journey. It combines clinical knowledge questions, multimodal evidence such as images, care planning, and follow-up tasks. Its episode-level evaluation checks whether diagnoses and care decisions are jointly correct and remain consistent as a patient's condition changes. Results show that strong performance on isolated tasks does not guarantee reliable decisions across a complete care pathway."}, 'zh': {'title': '从单题答对到全程诊疗连贯', 'desc': '本文提出 NPCBench，用于评估医疗人工智能模型在鼻咽癌诊疗流程中的临床能力。它包含知识与病例任务，以及覆盖 100 名患者、417 项诊断和照护任务的纵向 CarePath 队列，考查模型能否结合影像等多模态证据并追踪患者病情变化。评估结果显示，模型即使在单项任务上表现良好，也不一定能在同一患者的完整诊疗路径中给出彼此一致且正确的判断；多模态模型的严格 CarePath 成功率最高仅为 23%。NPCBench 因此将医疗 AI 评估从静态问答拓展到临床工作流，重点检验循证推理与时间连贯性。'}}}, {'id': 'https://huggingface.co/papers/2610.37739', 'title': 'OpenFrontiers: A Collection of Open Research Problems and a Benchmark for Scientific Rediscovery', 'url': 'https://huggingface.co/papers/2610.37739', 'abstract': 'Abstract OpenFrontiers links a broad corpus of open research problems with a formally graded benchmark of recently resolved mathematics problems to evaluate LLM agents’ ability to rediscover solutions under different information-access conditions.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Large language models (LLMs) have shown increasing promise in research-level problem solving, yet a comprehensive collection of such problems is still missing, and evaluating them on research-level problems remains challenging. We introduce OpenFrontiers, a cross-disciplinary resource that combines a structured corpus of open research problems with a retrospective benchmark of recently resolved problems in mathematics. The corpus records problem statements, context, progress, and other information for 12,151 problems. The benchmark contains 200 problems, 110 resolved in 2026 and 90 still open, each with a Lean~4 statement checked by automated probes and two independent reviews; a subset HQ-50 further filters based on quality score, etc. Our evaluation protocol grades formal proofs with two independent checkers in an isolated sandbox under closed-book, frozen-retrieval, and live-web conditions. Evaluating seven LLM agents on the HQ-50 subset under a standardized budget, we find that closed-book rediscovery is rare, at most 7 of 40 resolved problems, whereas live-web success mostly reflects retrieval of published solutions. By linking a broad research-problem corpus to a formally graded evaluation subset with documented solutions, OpenFrontiers provides a foundation for measuring research-level rediscovery and studying progress toward solving currently open scientific problems. The dataset and benchmark could be found in https://huggingface.co/collections/FlippyDora/openfrontiers.', 'score': 1, 'issue_id': 3505, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '189819638309cc50', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#science', '#benchmark', '#reasoning', '#leakage', '#open_source', '#math', '#agents'], 'emoji': '🧮', 'ru': {'title': 'Проверка ИИ на настоящих открытых математических задачах: решает ли он сам или просто находит ответы в сети?', 'desc': 'Авторы представляют OpenFrontiers — ресурс, объединяющий корпус из 12 151 открытой исследовательской задачи и бенчмарк из 200 недавно решённых и открытых задач по математике, каждая из которых записана в формальном виде на Lean 4. Оценка проводится под тремя режимами доступа к информации: без подсказок (closed-book), с замороженным поиском и с доступом к интернету, а решения проверяются двумя независимыми верификаторами в изолированной среде. Семь LLM-агентов на подвыборке HQ-50 показали, что повторное открытие решений без внешней информации встречается крайне редко (не более 7 из 40 решённых задач), тогда как успех при доступе к вебу в основном связан с поиском уже опубликованных решений. Работа создаёт основу для измерения способности LLM к исследовательскому уровню рассуждения и для изучения прогресса в решении открытых научных проблем.'}, 'en': {'title': 'Measuring Whether AI Can Rediscover Research Breakthroughs', 'desc': 'OpenFrontiers combines a collection of 12,151 open research problems with a benchmark of 200 recently resolved or still-open mathematics problems. Each benchmark problem has a Lean 4 statement, and formal proofs are checked by two independent systems in a sandbox. The authors test seven large language model agents under closed-book, frozen-retrieval, and live-web settings. Agents rarely rediscover resolved solutions without external information, while success with web access mostly comes from finding published solutions.'}, 'zh': {'title': '用形式化基准衡量 AI 重新发现数学解答的能力', 'desc': '论文提出 OpenFrontiers，这是一个汇集跨领域开放研究问题并配套数学基准测试的资源。它整理了 12,151 个问题，并构建了包含 200 道近期已解决或仍未解决数学问题的基准，每题都用 Lean 4 描述并经过自动检查和独立评审。研究者在封闭知识、固定检索和实时网络访问等条件下测试了七种大语言模型智能体，并用两个独立检查器验证形式化证明。结果显示，模型仅凭已有知识重新发现已解决问题的能力很弱，而实时网络条件下的成功大多来自检索已发表的解答。'}}}, {'id': 'https://huggingface.co/papers/2610.41789', 'title': 'Hard Sample-Conditioned Decorrelated Attention for Robust Face Recognition', 'url': 'https://huggingface.co/papers/2610.41789', 'abstract': 'Abstract ViT-HarDis conditions attention head disentanglement on sample difficulty, applying stronger decorrelation to hard face-recognition samples and only in final transformer layers to improve recognition without architectural changes or extra inference cost.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Multi-head attention in Vision Transformers (ViTs) allows independent attention patterns across heads, but without explicit regularization, heads may learn redundant patterns rather than complementary roles. Correlation-based penalties encourage head disentanglement, yet apply uniform regularization across all training samples. In face recognition (FR), hard samples whose embeddings lie close to competing identities are critical for optimization and generalization. Motivated by this, we propose ViT-HarDis, which conditions attention head disentanglement on sample difficulty: samples with high cosine similarity to negative class centers receive stronger head decorrelation, enforcing specialization where identity ambiguity is highest. Experiments show improvements over both the baseline and uniform disentanglement on most benchmarks. Our analysis shows that ViT-HarDis reduces the similarity of hard samples to competing class centers while decreasing inter-head attention similarity, and that applying disentanglement only to the final transformer layers outperforms regularizing the entire network. Trained on WebFace4M, ViT-HarDis achieves SOTA results among ViT-based methods on IJB-B, IJB-C, and TinyFace Rank-1, while achieving the best IJB-B and TinyFace results when trained on MS1MV3, improving FR without architectural modifications or additional inference cost. Code: https://github.com/TaharChettaoui/Hard-Sample-Conditioned-Attention-for-FR.', 'score': 1, 'issue_id': 3505, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': '7162a4f8ac36dc93', 'authors': ['Tahar Chettaoui', 'Guray Ozgur', 'Eduarda Caldeira', 'Naser Damer', 'Fadi Boutros'], 'affiliations': ['Fraunhofer Institute for Computer Graphics Research IGD', 'TU Darmstadt'], 'pdf_title_img': 'assets/pdf/title_img/2610.41789.jpg', 'data': {'categories': ['#interpretability', '#optimization', '#training', '#architecture', '#cv'], 'emoji': '🧠', 'ru': {'title': 'Сложные лица учат головы внимания специализироваться', 'desc': 'Авторы предлагают метод ViT-HarDis для распознавания лиц на основе Vision Transformer, где степень декорреляции attention-голов зависит от сложности объекта. Сложные samples, у которых косинусная близость к центрам негативных классов высока, получают более сильную регуляризацию, что заставляет головы специализироваться там, где неоднозначность идентичности максимальна. Применение такой регуляризации только к последним transformer-слоям оказалось эффективнее, чем к всей сети. Метод повышает качество на бенчмарках IJB-B, IJB-C и TinyFace без изменения архитектуры и без дополнительных затрат на inference.'}, 'en': {'title': 'Focus attention diversity where identities are hardest to distinguish', 'desc': 'ViT-HarDis improves face recognition by making attention heads learn less redundant patterns for difficult training examples. It identifies hard samples by measuring how closely their embeddings match the centers of competing identity classes, then applies stronger head-decorrelation regularization to those samples. The method works best when this regularization is applied only in the final transformer layers, and it improves results on several face-recognition benchmarks. It requires no changes to the model architecture and adds no inference cost.'}, 'zh': {'title': '聚焦难样本，让注意力头各司其职', 'desc': '这篇论文提出 ViT-HarDis，用样本难度来调整视觉 Transformer 中注意力头的去相关强度。对于与其他身份类别中心余弦相似度较高的困难人脸样本，模型会加强注意力头去相关，促使不同注意力头学习互补模式。实验表明，该方法在多个基准上优于基线方法和对所有样本使用相同去相关强度的方法，而且只在 Transformer 最后几层进行去相关效果更好。在不修改网络结构、也不增加推理成本的情况下，ViT-HarDis 在多个数据集上取得了有竞争力的人脸识别结果。'}}}, {'id': 'https://huggingface.co/papers/2610.40119', 'title': 'SynthFaces: Balanced Large Scale Human Dataset', 'url': 'https://huggingface.co/papers/2610.40119', 'abstract': 'Abstract A pipeline combining Arc2Face diffusion with flow matching on identity embeddings generates a balanced synthetic face dataset to improve fairness and reduce privacy risks in generative model training.  Generated by thinkingmachines/Inkling-Small The pursuit of fair and equitable AI in human-centric tasks is critically hindered by the inherent biases and privacy risks of real-world datasets, which offer imbalanced representations of identity and often contain sensitive personal information. Consequently, state-of-the-art generative models trained on this skewed data exhibit unfair performance, particularly in identity-preserving generation. In this work we propose a pipeline for controllable generation of dataset with diverse faces for generative models training and finetuning. We achieve this by expanding foundational Arc2Face diffusion model with a flow matching generative model in the manifold of identity embeddings. We demonstrate that such approach achieves both goals of generative fidelity and label diversity not present in real human-centric datasets. As a result we collect and further contextualize a highly balanced identity-centric dataset of humans named SynthFaces. By design, our released images and identities are synthetic, reducing direct reliance on real personal images; we empirically check identity separation with a nearest-neighbor non-leakage metric. We purpose it for training and tuning of fair models for various downstream tasks, and showcase its usability in finetuning an existing adapter-based method for personalized generation.', 'score': 1, 'issue_id': 3504, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '9f403d0eebcaa3f4', 'authors': ['Sergey Karpukhin', 'Denis Bobkov', 'Kirill Morozov', 'Aibek Alanov'], 'affiliations': ['Cumulative', 'Institute of Applied Sciences', 'Moscow Institute of Physics and Technology', 'Skolkovo Institute of Science and Technology', 'Yandex'], 'pdf_title_img': 'assets/pdf/title_img/2610.40119.jpg', 'data': {'categories': ['#leakage', '#dataset', '#data', '#cv', '#synthetic', '#ethics', '#training', '#diffusion', '#optimization'], 'emoji': '⚖️', 'ru': {'title': 'Справедливые лица без реальных людей: синтетика для честного ИИ', 'desc': 'В статье предлагается конвейер для генерации синтетического датасета лиц, в котором Arc2Face diffusion дополняется flow matching в пространстве identity embeddings. Такой подход позволяет получить сбалансированные по идентичностям данные без опоры на реальные персональные изображения. Авторы выпускают датасет SynthFaces и проверяют отсутствие утечки идентичностей с помощью метрики nearest-neighbor non-leakage. Датасет предназначен для обучения и дообучения справедливых генеративных моделей и показан на примере finetuning адаптерного метода персонализированной генерации.'}, 'en': {'title': 'Synthetic Faces for Fairer, More Private AI', 'desc': 'The paper introduces a pipeline that creates a diverse, balanced dataset of synthetic human faces for training generative models. It combines Arc2Face diffusion with flow matching in the space of identity embeddings to control which identities are generated. The resulting SynthFaces dataset aims to improve representation and reduce reliance on sensitive real-person images, with identity separation checked using a nearest-neighbor leakage metric. The authors also show that the dataset can be used to fine-tune a model for personalized face generation.'}, 'zh': {'title': '用多样且均衡的合成人脸，训练更公平、更保护隐私的模型', 'desc': '这篇论文提出一种可控的人脸数据生成流程，用于提升生成模型训练的公平性并降低隐私风险。它将 Arc2Face 扩散模型与身份嵌入空间中的流匹配生成模型结合，生成身份多样且逼真的合成人脸。研究者据此构建了身份分布更均衡的合成数据集 SynthFaces，并用最近邻非泄漏指标检查不同身份之间的区分度。实验还展示了该数据集可用于微调个性化生成方法，帮助下游模型减少对真实个人图像的依赖。'}}}, {'id': 'https://huggingface.co/papers/2611.02075', 'title': 'Decoupled Predictive Decision Making: A Shared Conditional Predictor for Agents', 'url': 'https://huggingface.co/papers/2611.02075', 'abstract': "Abstract DPDM improves agent decision accuracy by combining frozen language-model representations with a shared pretrained conditional predictor that learns from deployment evidence without parameter updates.  Generated by thinkingmachines/Inkling-Small Agent decisions depend on empirical relationships that deployment observations reveal and task descriptions alone may leave unresolved. We introduce Decoupled Predictive Decision Making (DPDM), an architecture that formulates heterogeneous agent decisions as conditional prediction with a shared pretrained learner. Language models provide semantic representations of current and historical records, while a general-purpose conditional predictor predicts task-defined targets from the represented evidence. Pretraining supplies reusable inference capability; deployment evidence instantiates problem-specific predictions without updating either model's neural parameters. Tool judgments, candidate preferences, and reasoning assessments share an evidence-and-query interface, with predictions mapped to choices by a decision rule. This architecture establishes complementary sources of agent capability: semantic knowledge acquired through language pretraining and empirical inference acquired through structured-data pretraining. A single frozen LimiX-2 predictor serves all five task categories. With Qwen3.5-27B as the semantic encoder, DPDM raises mean accuracy across 50 benchmarks from 78.80% with few-shot prompting to 84.92% under their respective evaluated history budgets, and reaches 82.33% with identical histories and queries. On ToolPRMBench's BFCL and ToolSandbox tasks, absolute accuracy gains are 34.26% and 28.87%, respectively, at the methods' respective evaluated history budgets. Accuracy improves as history grows. With identical imbalanced histories, mean balanced accuracy improves by an absolute 14.51% across five reasoning-step assessment tasks and four encoders. DPDM makes learning from experience an independently improvable foundation-model capability, creating a shared route for advances in conditional prediction to improve decisions across agent tasks.", 'score': 1, 'issue_id': 3504, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '1e45cdb30cdb9a7e', 'authors': ['Lang Mo', 'Xingxuan Zhang', 'Qi Wang', 'Mingchao Hao', 'Hao Yuan', 'Chunjing Gan', 'Wang Lu', 'Peng Cui'], 'affiliations': ['Stable AI', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2611.02075.jpg', 'data': {'categories': ['#agents', '#long_context', '#benchmark', '#training', '#optimization', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Агенты учатся на опыте без обновления весов', 'desc': 'В статье предлагается архитектура DPDM, которая формулирует решения AI-агентов как задачу условного предсказания с помощью общей предобученной модели. LLM кодируют текущие и исторические данные в семантические представления, а frozen-предиктор LimiX-2 на структурированных данных предсказывает целевые значения без обновления весов. Такой подход объединяет семантические знания языковых моделей и эмпирический вывод, полученный из реальных наблюдений. На 50 бенчмарках средняя точность выросла с 78,80% до 84,92%, а на задачах ToolPRMBench прирост достиг 34,26% и 28,87%.'}, 'en': {'title': 'Learn from experience without changing the model', 'desc': 'Decoupled Predictive Decision Making (DPDM) combines a frozen language model, which represents task descriptions and records, with a shared pretrained conditional predictor. The predictor uses deployment evidence to estimate task-specific outcomes, without updating either model’s parameters. A decision rule turns those predictions into choices across tasks such as tool selection, candidate ranking, and reasoning assessment. Across 50 benchmarks, DPDM improves mean accuracy over few-shot prompting, and its accuracy generally rises with more history.'}, 'zh': {'title': '让智能体从经验中学习，无须更新模型参数', 'desc': '论文提出解耦预测式决策（DPDM），把多种智能体决策转化为基于证据的条件预测问题。语言模型将当前任务和历史记录编码成语义表示，预训练的条件预测器则根据这些证据预测任务所需的结果。部署期间，模型利用不断积累的历史证据改善预测，无须更新任何神经网络参数；预测结果再由决策规则转换为工具判断、候选选择或推理评估。实验显示，DPDM在50个基准上的平均准确率高于少样本提示，并且随着历史数据增加，准确率与类别均衡准确率也有所提升。'}}}, {'id': 'https://huggingface.co/papers/2610.34074', 'title': 'Identically Trained Language Models Break on Different Jailbreaks', 'url': 'https://huggingface.co/papers/2610.34074', 'abstract': "Abstract Jailbreak vulnerability is primarily determined by pretraining randomness rather than data recipes, with pretraining seeds leaving identifiable fingerprints across prompts.  Generated by thinkingmachines/Inkling-Small Jailbreak benchmarks test one checkpoint and treat which jailbreaks break it as a property of its pretraining data and safety training. We ask whether another pretraining run of the same data, given the same safety training, would break on the same jailbreaks. For each of 25 pretraining data recipes, we take 1B base models from 3 pretraining seeds and give each the same safety post-training with 2 post-training seeds, for 150 models in all. We then collect 20 responses from every model to a shared set of jailbreak prompts and correlate the per-prompt non-refusal rates between every pair of models. On average, two post-trained copies of the same pretraining run have per-prompt non-refusal rates that correlate at 0.984. A different pretraining seed lowers the correlation to 0.811, and a different data recipe lowers it only slightly further, to 0.779. These results indicate that which jailbreaks break a checkpoint depends much more on its pretraining run than on its data, a pattern that holds in all 25 data recipes and at 150M and 300M parameters. In practice, the best of 91 attack templates found on one checkpoint stays the best after a new pretraining seed in only 27% of model pairs, against 67% after a new post-training seed. Each pretraining run also leaves a fingerprint: across 3,211 prompts, a model's per-prompt non-refusal rates identify its pretraining run among all 75 runs every time, and a random subset of 50 prompts still does so 98% of the time.", 'score': 1, 'issue_id': 3504, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': '5a12d7b95c7eb416', 'authors': ['Chi-Wei Chang', 'Mu-Tien Kuo', 'Kuan-Wei Lee', 'Meng-Hsun Tsai'], 'affiliations': ['1', '2', '3'], 'pdf_title_img': 'assets/pdf/title_img/2610.34074.jpg', 'data': {'categories': ['#small_models', '#open_source', '#benchmark', '#alignment', '#training', '#security'], 'emoji': '🔓', 'ru': {'title': 'Уязвимость к jailbreak задаёт не датасет, а случайность предобучения', 'desc': 'Авторы исследуют, почему одни и те же jailbreak-промпты срабатывают на одних языковых моделях (LLM) и не срабатывают на других. Они обучили 150 базовых моделей по 25 рецептам данных, варьируя seed предобучения и seed post-training, и измерили корреляцию частоты отказов по каждому промпту. Выяснилось, что уязвимость к jailbreak определяется в первую очередь случайностью предобучения, а не составом данных, и даже по поведению модели можно однозначно определить её запуск предобучения. Поэтому оценка безопасности одного чекпоинта плохо переносится на другие запуски той же архитектуры.'}, 'en': {'title': 'Pretraining Seeds Leave Distinct Jailbreak Fingerprints', 'desc': 'The paper tests whether jailbreak vulnerability comes mainly from pretraining data or from randomness between pretraining runs. Researchers train 150 models using 25 data recipes, multiple pretraining seeds, and shared safety post-training, then compare how often each model refuses jailbreak prompts. Models from the same pretraining run behave very similarly, while changing the pretraining seed affects jailbreak behavior more than changing the data recipe. Prompt-level refusal patterns also act like fingerprints that can identify a model’s pretraining run with high accuracy.'}, 'zh': {'title': '越狱脆弱性主要由预训练随机种子决定', 'desc': '这项研究考察：同一套数据和安全后训练下，不同预训练随机种子是否会让模型对相同越狱提示产生不同反应。研究者训练了150个模型，并比较它们对每条提示的非拒绝率相关性；同一预训练运行的模型相关性为0.984，换预训练种子后降至0.811，而换数据配方后仅进一步降至0.779。结果显示，模型容易被哪些越狱提示攻破，主要取决于预训练运行及其随机种子，而非数据配方；这一现象在不同数据配方和模型规模下都成立。每次预训练还会留下可识别的“指纹”：仅用50条提示的非拒绝率，就能以98%的准确率辨认模型来自哪次预训练运行。'}}}, {'id': 'https://huggingface.co/papers/2611.06498', 'title': 'Signed but Steerable: Measuring and Closing the Text-Vector Integrity Gap in Offline Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2611.06498', 'abstract': "Abstract Signed retrieval packs can contain embedding vectors that do not match their text, and practical vector verification and compressed-index audits leave many queries vulnerable, while code-level verification with calibrated ambiguity handling accepts honest vectors.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Offline retrieval-augmented generation (RAG) on edge devices is updated through signed knowledge packs that carry text and precomputed embedding vectors. A signature proves who published a pack, not that its vectors encode its text. We study this text-vector integrity gap. A verifier that recomputes vectors and accepts them within a cosine tolerance concedes a predictable share of queries to an attacker who controls the vectors: the hijack rate equals the distribution of angular retrieval margins at the tolerance (the margin law). Margins are small in five corpora and two embedding models, so an idealised tolerance at the level of floating-point noise leaves up to 5.5% of queries exposed (at most 1.2% in any corpus once exact duplicate documents are excluded), and a threshold calibrated from our CPU INT8-FP32 comparison of a small embedding model (at the empirical 0.1% quantile of honest cosines) leaves 98-100% exposed; on a Raspberry Pi 5 running a local language model, such an attack lowers correct answers from 0.75 to 0.39. Integrity audits of compressed vector stores fare no better: on a FAISS product-quantisation index over 57,638 documents, tampered vectors that all pass the audit put the attacker's document first for 25% of targets. Verifying quantisation codes instead, with ambiguity decided by the verifier, a calibrated guard band and canonicalisation, accepted every honest vector in our samples on three platforms and left the publisher no choice. We also show that common floating-point and dynamic-INT8 inference pipelines are not bit-reproducible across batch sizes or architectures, and report pre-registered negative results on abstention, context pruning and semantic screening. We release code and data.", 'score': 0, 'issue_id': 3506, 'pub_date': '2026-11-04', 'pub_date_card': {'ru': '4 ноября', 'en': 'November 4', 'zh': '11月4日'}, 'hash': 'b91c5689a61240e3', 'authors': ['Georgios Feretzakis', 'Alexandros Papaspyridis'], 'affiliations': ['securagen.ai'], 'pdf_title_img': 'assets/pdf/title_img/2611.06498.jpg', 'data': {'categories': ['#leakage', '#data', '#rag', '#optimization', '#security', '#inference', '#benchmark'], 'emoji': '🛡️', 'ru': {'title': 'Подпись не гарантирует правду: проверяйте векторы, а не только автора', 'desc': 'Статья показывает, что подпись пакета знаний в офлайн RAG на edge-устройствах подтверждает только автора, но не то, что векторы эмбеддингов соответствуют тексту. Проверка векторов с допуском по косинусному сходству оставляет злоумышленнику предсказуемую долю запросов для подмены выдачи, так как доля определяется распределением угловых retrieval margins. Аудит сжатых индексов FAISS с product quantization тоже не спасает, тогда как проверка кодов квантизации с калиброванной защитной зоной принимает все честные векторы. Авторы также отмечают, что INT8 и FP32 инференс не воспроизводим побитово, и публикуют код и данные.'}, 'en': {'title': 'Verify the Codes, Not Just the Signature', 'desc': 'The paper studies whether signed retrieval packs contain embedding vectors that truly match their text; a digital signature proves who published a pack, but not that its vectors are correct. It shows that checking vectors against recomputed embeddings with a cosine-similarity threshold can still let attackers redirect many queries, because retrieval margins are often small. Auditing compressed vector indexes also fails to catch some tampered entries, which can place an attacker’s document first in many searches. The authors propose verifying quantisation codes with calibrated ambiguity handling and canonicalisation, which accepted all honest vectors in their tests while preventing publishers from choosing misleading codes.'}, 'zh': {'title': '验证量化编码，让签名知识包的向量真正可信', 'desc': '本文研究边缘设备的检索增强生成（RAG）知识包中，文本与预计算向量不匹配所造成的完整性风险。数字签名只能证明知识包的发布者身份，不能证明向量确实编码了对应文本；即使重新计算向量并设定余弦相似度容差，攻击者仍可能操纵检索结果。实验显示，基于压缩向量索引的审计也可能放过篡改数据，而在树莓派上的攻击会显著降低正确回答率。作者提出验证量化编码，并由验证器处理歧义、使用校准保护区间和规范化；该方法在所测平台上接受了所有诚实向量，同时限制发布者操纵空间。'}}}];

                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-06 22:35',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-06 22:35')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-06 22:35')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
