    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.19880', 'title': 'EnvHarness: Awakening Static Worlds for Agent Learning', 'url': 'https://huggingface.co/papers/2608.19880', 'abstract': "Abstract EnvHarness and EnvRigger dynamically reshape static environments via programmable plugins to target agent weaknesses and improve reinforcement learning co-evolution.  Generated by thinkingmachines/Inkling-Small LLM agents learn by interacting with environments, yet these environments are hand-built and static: blind to an agent's weaknesses, and quickly left behind as it improves. While recent environment generation methods attempt to address this, they require domain-specific pipelines, rely on expensive or unreliable verifiers, and still produce static environments. To alleviate the engineering burden of rebuilding environments from scratch, we propose Environment Harness (EnvHarness), a programmable layer of plug-in components that wraps a static environment to reshape its behavior without modifying the underlying logic. Operating through standard interfaces, EnvHarness applies across diverse domains while ensuring every reshaped environment retains its original verifier. To automate this process, we introduce EnvRigger, which treats the target policy as a black box, observing its execution trajectories to synthesize EnvHarness components targeting diagnosed flaws, and validating them via fresh rollouts. Across five benchmarks in four domains, EnvHarness outperforms both original environments and domain-specific environment generation pipelines, achieving up to a 9.0-point improvement on held-out instances with 9.8% fewer execution steps. Furthermore, EnvHarness provides a superior optimization signal for reinforcement learning, enabling continuous, targeted co-evolution of the policy and its environment.", 'score': 191, 'issue_id': 3086, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '6e988ad74f0f0863', 'authors': ['Chengsong Huang', 'Zifeng Wang', 'Rujun Han', 'Jun Yan', 'Yanfei Chen', 'Zoey CuiZhu', 'Ke Jiang', 'Peng Xia', 'Han Yu', 'Yufan Zhuang', 'Yifei Ming', 'Jiaqi Pan', 'Bhavana Dalvi Mishra', 'Jiaxin Huang', 'Burak Gokturk', 'Tomas Pfister', 'Chen-Yu Lee'], 'affiliations': ['Google Cloud', 'Google Cloud AI Research', 'University of North Carolina at Chapel Hill', 'Washington University in St. Louis'], 'pdf_title_img': 'assets/pdf/title_img/2608.19880.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rl'], 'emoji': '🔧', 'ru': {'title': 'Адаптивные окружения для эволюционного обучения агентов', 'desc': 'Авторы предлагают EnvHarness — программируемый слой плагинов, который динамически адаптирует статические окружения без изменения их базовой логики, позволяя целенаправленно воздействовать на слабые стороны агентов. EnvRigger автоматизирует этот процесс, анализируя траектории выполнения политики и синтезируя компоненты EnvHarness, которые диагностируют и исправляют выявленные недостатки. Метод демонстрирует превосходство над исходными окружениями и специализированными pipeline-ами генерации окружений, улучшая результаты на 9 пунктов при снижении вычислительных затрат на 9,8%. Предложенный подход обеспечивает более качественный сигнал оптимизации для обучения с подкреплением, позволяя проводить непрерывную коэволюцию политики и её окружения.'}, 'en': {'title': 'Dynamic Environment Adaptation for Enhanced Reinforcement Learning', 'desc': 'The paper introduces EnvHarness and EnvRigger, tools designed to enhance reinforcement learning by dynamically modifying static environments. These tools allow for the creation of programmable plugins that adapt environments to address specific weaknesses of learning agents. Unlike traditional methods that require extensive engineering and produce static environments, EnvHarness enables real-time reshaping without altering the core logic. The results show significant improvements in learning efficiency and performance across various benchmarks, demonstrating the effectiveness of these tools in facilitating continuous co-evolution between agents and their environments.'}, 'zh': {'title': '动态重塑环境，提升强化学习效果', 'desc': 'EnvHarness和EnvRigger通过可编程插件动态重塑静态环境，以针对智能体的弱点并改善强化学习的共同进化。传统的环境是手工构建的，无法适应智能体的变化，导致智能体在进步后很快就会被遗弃。EnvHarness提供了一种可编程的插件组件层，可以在不修改底层逻辑的情况下重塑环境行为。EnvRigger则通过观察目标策略的执行轨迹，自动合成EnvHarness组件，针对识别出的缺陷进行验证，从而提升强化学习的效果。'}}}, {'id': 'https://huggingface.co/papers/2608.18580', 'title': 'FACET: Preserving Source Intent and Executable State in Terminal Task Synthesis', 'url': 'https://huggingface.co/papers/2608.18580', 'abstract': 'Abstract FACET constructs executable terminal tasks by preserving source intent and grounding instructions, solutions, and verifiers in a shared repaired environment to enable scalable agent training.  Generated by thinkingmachines/Inkling-Small Training terminal agents requires scalable executable supervision, yet synthesizing high-quality terminal tasks remains challenging. Each task couples an instruction, an initialized environment, a reference solution, and an executable verifier; if these artifacts are generated from inconsistent assumptions, the resulting task may be unsolvable or incorrectly evaluated. Meanwhile, multi-stage synthesis can discard the goals, dependencies, state transitions, and procedural constraints encoded in the original sources. We present FACET (Fine-grained Agentic Construction of Executable Tasks), a framework that addresses both information preservation and cross-artifact consistency. FACET reconstructs related agent skills into coherent, information-rich scenarios, then realizes and repairs the execution environment before generating the final task artifacts. The resulting container state serves as shared grounding for the instruction, solution, and verifier, while execution-based validation and targeted repair correct artifact-specific failures without unnecessarily regenerating valid components. FACET produces complex terminal tasks with dense executable checks, and successful trajectories collected from these tasks provide effective, data-efficient supervision. Fine-tuning models across multiple scales consistently improves performance on Terminal-Bench 2.1, while analyses of alternative generation schemes support the importance of environment-grounded construction for task validity and solution-verifier alignment. These results establish source-intent preservation and shared executable-state grounding as key principles for scalable terminal-task synthesis.', 'score': 74, 'issue_id': 3086, 'pub_date': '2026-08-19', 'pub_date_card': {'ru': '19 августа', 'en': 'August 19', 'zh': '8月19日'}, 'hash': '532bba6de44e218b', 'authors': ['Kou Shi', 'Zun Wang', 'Qisheng Su', 'Shiting Huang', 'Ziao Zhang', 'Zhen Fang', 'Qingnan Ren', 'Jin Liu', 'Yu Zeng', 'Yiming Zhao', 'Lin Chen', 'Zehui Chen', 'Feng Zhao'], 'affiliations': ['Fudan University', 'MoE Key Lab of BIPC, University of Science and Technology of China', 'Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2608.18580.jpg', 'data': {'categories': ['#training', '#dataset', '#agents'], 'emoji': '🛠️', 'ru': {'title': 'Построение исполняемых задач через согласование артефактов в общей среде', 'desc': 'FACET — это фреймворк для создания исполняемых задач терминала, которые сохраняют исходные намерения и основываются на единой исправленной среде выполнения. Авторы решают проблему несогласованности между инструкциями, решениями и верификаторами, которые могут быть сгенерированы с различными предположениями, что приводит к невалидным или некорректно оцениваемым задачам. Подход реконструирует умения агента в связные сценарии, инициализирует и исправляет среду выполнения, а затем генерирует артефакты задач с общей основой в виде состояния контейнера. Экспериментальные результаты показывают, что использование среды как общего якоря для обучения агентов улучшает производительность моделей различных масштабов и обеспечивает более эффективное обучение с подкреплением.'}, 'en': {'title': 'Building Better Tasks with Intent Preservation and Consistency', 'desc': 'FACET is a framework designed to create executable terminal tasks while maintaining the original intent of the source material. It ensures that the instructions, solutions, and verifiers are consistent and grounded in a shared environment, which is crucial for effective agent training. By reconstructing agent skills into coherent scenarios and validating them through execution, FACET minimizes errors and enhances the quality of generated tasks. This approach leads to improved performance in task execution and supervision, highlighting the importance of preserving source intent and maintaining consistency across task components.'}, 'zh': {'title': 'FACET：可扩展终端任务合成的关键', 'desc': 'FACET是一个构建可执行终端任务的框架，旨在保留源意图并确保指令、解决方案和验证器在共享的修复环境中一致。该框架通过重建相关的智能体技能，生成信息丰富的场景，并在生成最终任务工件之前修复执行环境。FACET能够生成复杂的终端任务，并通过执行验证和针对性修复来纠正特定工件的失败，从而提高任务的有效性。最终，FACET的结果表明，源意图的保留和共享可执行状态的基础是可扩展终端任务合成的关键原则。'}}}, {'id': 'https://huggingface.co/papers/2608.19799', 'title': 'SWE-bench Science: Can Coding Agents Resolve Engineering Tasks in Science?', 'url': 'https://huggingface.co/papers/2608.19799', 'abstract': 'Abstract SWE-bench Science benchmarks coding agents on scientific software repair, revealing failure mechanisms and mixed effects of scientific guidance.  Generated by thinkingmachines/Inkling-Small Software increasingly functions as part of the scientific instrument itself, making failures in scientific code capable of compromising not only program behavior but also the evidence underlying scientific conclusions. Yet existing evaluations of coding agents largely emphasize aggregate task success, providing limited insight into why agents fail when repairing scientific software. We introduce SWE-bench Science, a repository-level benchmark for scientific software engineering comprising 119 tasks from 98 GitHub repositories across 20 scientific domains. Each task is organized into one of three paradigms: Issue-driven, Expert-exploratory, and Engineering-integration. Even the best-performing agent, Claude Code with Opus-5 (max), achieves a pass@1 below 50\\%, highlighting the substantial challenges posed by scientific software engineering. We identify four recurring failure mechanisms: deficits in scientific knowledge or abstraction, misguided exploration or surface-level repair, incomplete repair coverage or system integration, and failures to generalize scientific knowledge beyond observed cases in our analysis. We further conduct a paired ablation that removes explicit scientific guidance while preserving the repository and executable engineering context. The results show that scientific knowledge is not uniformly beneficial: well-grounded information can constrain repair and improve average performance and token efficiency, whereas poorly aligned guidance can induce anchoring and does not necessarily improve exact repair success. Together, SWE-bench Science provides a broad testbed for studying both the capabilities and failure mechanisms of coding agents in scientific software engineering.', 'score': 45, 'issue_id': 3090, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': 'e0a620509d9d9afc', 'authors': ['Zhipeng Xu', 'Jiahao Lu', 'Yining Zheng', 'Yuxin Wang', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.19799.jpg', 'data': {'categories': ['#plp', '#benchmark', '#agents'], 'emoji': '🔬', 'ru': {'title': 'Когда научные знания мешают: парадокс явного руководства при восстановлении научного кода', 'desc': 'В работе представлен SWE-bench Science — новый бенчмарк для оценки способности кодирующих агентов восстанавливать научное программное обеспечение на уровне репозиториев. Бенчмарк содержит 119 задач из 98 GitHub-репозиториев в 20 научных областях, организованных в три парадигмы. Исследование выявило четыре основных механизма отказов агентов: недостаток научных знаний, поверхностный ремонт, неполное покрытие системной интеграции и неспособность обобщать знания. Авторы показали, что явное научное руководство имеет смешанный эффект: хорошо обоснованная информация может ограничивать ремонт, а плохо согласованная информация может привести к необоснованному закреплению гипотез.'}, 'en': {'title': 'Understanding Coding Agent Failures in Scientific Software Repair', 'desc': 'The paper introduces SWE-bench Science, a benchmark designed to evaluate coding agents in the context of scientific software repair. It highlights the importance of understanding failure mechanisms in coding agents, as failures can impact scientific conclusions. The benchmark includes 119 tasks from various scientific domains and categorizes them into three paradigms: Issue-driven, Expert-exploratory, and Engineering-integration. The findings reveal that while scientific guidance can enhance performance, it can also lead to constraints and failures if not aligned properly with the repair tasks.'}, 'zh': {'title': '科学软件修复的挑战与机遇', 'desc': 'SWE-bench Science 是一个针对科学软件修复的基准测试，旨在揭示编码代理在修复科学软件时的失败机制。该基准包含来自20个科学领域的98个GitHub仓库中的119个任务，分为三种范式：问题驱动、专家探索和工程整合。研究发现，即使是表现最好的代理，Claude Code with Opus-5，成功率也低于50%，显示出科学软件工程面临的重大挑战。通过分析，我们识别出四种常见的失败机制，并探讨了科学知识在修复过程中的影响，发现科学指导并不总是有益。'}}}, {'id': 'https://huggingface.co/papers/2608.20335', 'title': '4DAnyone: Create Anyone in 4D from a Casual Monocular Video', 'url': 'https://huggingface.co/papers/2608.20335', 'abstract': 'Abstract 4DAnyone reconstructs 4D humans from monocular video by generating multiview-consistent videos and lifting them into 4D Gaussian Splatting, using reference and target context designs to overcome scaling bottlenecks.  Generated by thinkingmachines/Inkling-Small We present 4DAnyone, a framework for reconstructing 4D humans from an uncalibrated monocular video by generating reconstruction-grade multiview-consistent videos and lifting them into 4D Gaussian Splatting (4DGS). Existing camera-controlled video diffusion models synthesize plausible novel-view videos but fail to maintain consistency when scaled to the tens of target views required for 4DGS reconstruction. We identify this failure as a bounded-attention-context problem: when target views exceed the capacity of a single DiT forward pass, they must be split into groups, exposing two coupled bottlenecks. On the reference-context side, conditioning on all previously generated views grows as O(N), weakening cross-view appearance guidance. On the target-context side, disjoint groups cannot directly exchange information, causing global structural drift. 4DAnyone addresses both bottlenecks with two complementary designs: Reference Context Packing (RCP) compresses growing reference views into a fixed-length mixed-resolution context with O(1) reference-context complexity, while Target Context Routing (TCR) rotates target-view groupings during denoising to share context across groups at high-noise steps and stabilize details at low-noise steps. We further build the MVGameHuman dataset using our in-house game engine and combine it with light-stage and in-the-wild video datasets for training. Experiments on DNA-Rendering and DyMVHumans show that 4DAnyone outperforms prior methods in both novel-view video quality and downstream 4DGS reconstruction, with robust in-the-wild generalization. See our project page for video results and source code: https://4danyone.github.io.', 'score': 41, 'issue_id': 3087, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '90af3b25f513d253', 'authors': ['Yudong Jin', 'Tao Xie', 'Qihang Zhang', 'Zehong Shen', 'Zhen Xu', 'Yujun Shen', 'Hujun Bao', 'Xiaowei Zhou', 'Yinghao Xu'], 'affiliations': ['Ant Group', 'Chinese University of Hong Kong', 'Hong Kong University of Science and Technology', 'Robbyant', 'State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.20335.jpg', 'data': {'categories': ['#diffusion', '#architecture', '#dataset', '#3d', '#video', '#open_source', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'От одного видео к четырёхмерной модели человека через согласованный синтез множественных видов', 'desc': 'В работе предлагается метод 4DAnyone для реконструкции четырёхмерных моделей людей из монокулярного видео путём генерации многовидовых видео с согласованностью между видами и их преобразования в 4D Gaussian Splatting. Авторы выявили проблему ограниченного контекста внимания при масштабировании на большое количество целевых видов и предложили два решения: Reference Context Packing сжимает растущие опорные виды в фиксированный контекст, а Target Context Routing маршрутизирует группы целевых видов для обмена информацией между ними. Для обучения использованы новый датасет MVGameHuman, созданный на игровом движке, а также данные light-stage и видео в естественных условиях. Экспериментальные результаты демонстрируют превосходство метода по качеству синтеза видео и реконструкции 4D Gaussian Splatting с хорошей обобщаемостью на видео из реальных условий.'}, 'en': {'title': 'Revolutionizing 4D Human Reconstruction from Monocular Video', 'desc': 'The paper introduces 4DAnyone, a framework designed to reconstruct 4D human models from a single monocular video. It generates multiview-consistent videos and utilizes 4D Gaussian Splatting to enhance the reconstruction process. The authors address challenges related to scaling and consistency by implementing Reference Context Packing and Target Context Routing, which optimize the handling of reference and target views. Experimental results demonstrate that 4DAnyone significantly improves video quality and 4D reconstruction accuracy compared to existing methods, showcasing its effectiveness in real-world scenarios.'}, 'zh': {'title': '4DAnyone：从单目视频重建4D人类的创新框架', 'desc': '4DAnyone是一个从单目视频重建4D人类的框架。它通过生成多视角一致的视频并将其提升为4D高斯点云，解决了在扩展到多个目标视角时的瓶颈问题。该方法采用了参考上下文打包和目标上下文路由的设计，显著提高了重建质量和一致性。实验结果表明，4DAnyone在新视角视频质量和4D重建方面优于现有方法，并具有良好的泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2608.20336', 'title': 'WithEveryone: Unified Planning and Identity Grounding for Group Image Generation', 'url': 'https://huggingface.co/papers/2608.20336', 'abstract': 'Abstract WithEveryone enables reliable identity-preserving group image generation for up to ten people by grounding identities to layout plans and using region-based identity losses.  Generated by thinkingmachines/Inkling-Small Identity-preserving image generation becomes increasingly unreliable when a scene must contain many specified people. Beyond retaining each identity, the model must bind every reference to a distinct person and location, while training-time identity losses must establish correspondence among several noisy predicted faces. We introduce WithEveryone, a unified framework for generating group images up to ten reference identities. WithEveryone injects each selected identity as an addressed token, predicts a structured identity--layout plan, and renders the plan as a visual condition. Its key objective, Layout-Grounded ID Loss, uses annotated face regions to supervise the intended identities directly, avoiding unstable embedding-based face matching; ID Representation Forcing additionally trains a prediction for each identity before image synthesis. On an identity-disjoint benchmark, WithEveryone achieves the highest target-context identity similarity, improving face similarity from 0.462 for GPT-Image-2 to 0.499, while reducing copy-paste artifacts from 0.169 to 0.055. It further covers 97.3\\% of the requested identities with a duplicate rate of only 2.8\\%. These results show that explicit identity--layout grounding enables identity-preserving generation to scale to larger groups without relying on direct reference-face copying.', 'score': 31, 'issue_id': 3086, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': 'f257b261c4cdd82e', 'authors': ['Hengyuan Xu', 'Qixun Wang', 'Yiji Cheng', 'Miles Yang', 'Zhao Zhong', 'Wei Cheng', 'Xingjun Ma', 'Yu-gang Jiang'], 'affiliations': ['Fudan University', 'Hunyuan, Tencent', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.20336.jpg', 'data': {'categories': ['#training', '#multimodal', '#benchmark', '#diffusion'], 'emoji': '👥', 'ru': {'title': 'Генерация групповых портретов с точным сохранением идентичностей через привязку к пространственному плану', 'desc': 'WithEveryone — это фреймворк для генерации групповых изображений, который может одновременно сохранять идентичность до десяти людей. Ключевая инновация — использование Layout-Grounded ID Loss, которая привязывает каждую личность к аннотированным регионам лиц, избегая нестабильного сравнения на основе эмбеддингов. Модель предсказывает структурный план расположения идентичностей и использует его в качестве визуального условия для синтеза изображения. Экспериментальные результаты показывают значительное улучшение: сходство лиц возросло с 0.462 до 0.499, а артефакты копирования-вставки снизились с 0.169 до 0.055.'}, 'en': {'title': 'Reliable Group Image Generation with Identity Preservation', 'desc': "WithEveryone is a machine learning framework designed for generating group images while preserving the identities of up to ten individuals. It achieves this by using a structured layout plan that binds each person's identity to a specific location in the image. The model employs a unique loss function called Layout-Grounded ID Loss, which directly supervises the identities through annotated face regions, enhancing reliability in identity preservation. As a result, WithEveryone significantly improves identity similarity and reduces artifacts in generated images compared to previous models."}, 'zh': {'title': '可靠的群体图像生成，保留每个人的身份', 'desc': 'WithEveryone 是一个用于生成最多十个人的群体图像的框架，能够可靠地保留每个人的身份。该模型通过将身份与布局计划相结合，并使用基于区域的身份损失来实现这一目标。它引入了布局基础的身份损失，直接监督预期身份，避免了不稳定的嵌入式面部匹配。实验结果表明，WithEveryone 在身份相似性和复制粘贴伪影方面表现优异，能够有效处理多个身份的生成。'}}}, {'id': 'https://huggingface.co/papers/2608.20202', 'title': 'MemTrapBench: Benchmarking Cognitive Traps in LLM Memory Use', 'url': 'https://huggingface.co/papers/2608.20202', 'abstract': 'Abstract Retrieved memories can induce reasoning errors and belief distortions in large language models, and an inference-time strategy helps avoid these cognitive traps while maintaining benchmark performance.  Generated by thinkingmachines/Inkling-Small Memory has become a key component of large language models, enabling them to retain information and learn from long-term interactions. However, existing memory benchmarks mainly evaluate whether information is correctly extracted, stored, and retrieved, while largely overlooking how retrieved memories reshape model reasoning and affect performance on the current task. We identify memory-induced cognitive traps: even faithfully recorded and semantically relevant memories can distort model reasoning or beliefs and degrade current task performance. To systematically evaluate these failure modes, we introduce MemTrapBench, which covers two forms of cognitive traps: Reasoning Fixation and Belief Distortion. Experiments across two model families and five representative memory frameworks show that MemTrapBench is challenging: all evaluated memory strategies underperform the no-memory setting, with even the strongest methods suffering drops of more than 10%. To mitigate these cognitive traps, we propose AdaptiveMem, a simple yet effective inference-time method that instructs LLMs to avoid memory traps. AdaptiveMem mitigates cognitive traps on MemTrapBench while preserving or improving performance on standard memory benchmarks across diverse memory frameworks.', 'score': 24, 'issue_id': 3086, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '3e7969b3b0cca32c', 'authors': ['Mengru Wang', 'Haozhe Luo', 'Zhenqian Xu', 'Zhixiang Cui', 'Haoming Xu', 'Qu Yang', 'Jizhan Fang', 'Junfeng Fang', 'Ningyu Zhang'], 'affiliations': ['Heriot-Watt University', 'National University of Singapore', 'Northeastern University', 'Tencent', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.20202.jpg', 'data': {'categories': [], 'emoji': '🪤', 'ru': {'title': 'Спасение от ловушек памяти в больших языковых моделях', 'desc': 'В работе выявлены когнитивные ловушки, которые возникают когда большие языковые модели извлекают информацию из памяти: даже точно сохранённые и семантически релевантные воспоминания могут исказить рассуждения модели и снизить её производительность. Авторы предложили MemTrapBench — новый бенчмарк для систематической оценки двух типов когнитивных ловушек: фиксации рассуждений и искажения убеждений. Эксперименты показали, что все современные стратегии работы с памятью недостаточно эффективны и уступают режиму без памяти. Для решения проблемы предложен метод AdaptiveMem, который во время инференса направляет LLM избегать ловушек памяти, сохраняя при этом производительность на стандартных бенчмарках.'}, 'en': {'title': 'Avoiding Memory Traps in Language Models', 'desc': 'This paper discusses how memories retrieved by large language models (LLMs) can lead to reasoning errors and distorted beliefs, negatively impacting their performance. The authors introduce a new benchmark called MemTrapBench to evaluate these cognitive traps, specifically focusing on Reasoning Fixation and Belief Distortion. They find that existing memory strategies often perform worse than models without memory, highlighting the challenges posed by these cognitive traps. To address this issue, they propose AdaptiveMem, an inference-time method that helps LLMs avoid these traps while maintaining or enhancing their performance on standard memory tasks.'}, 'zh': {'title': '记忆陷阱与推理优化的解决方案', 'desc': '这篇论文探讨了大语言模型中记忆的作用，指出提取的记忆可能导致推理错误和信念扭曲。现有的记忆基准主要关注信息的提取和存储，而忽视了提取的记忆如何影响模型的推理和当前任务的表现。作者提出了MemTrapBench来系统评估这些认知陷阱，并发现所有评估的记忆策略在无记忆设置下表现不佳。为了解决这些问题，论文提出了一种名为AdaptiveMem的方法，可以在推理时帮助模型避免记忆陷阱，同时保持或提高在标准记忆基准上的表现。'}}}, {'id': 'https://huggingface.co/papers/2608.13120', 'title': 'SkillEvo: Self-Renewing Evolution Gradients from Multi-Turn Interaction Feedback', 'url': 'https://huggingface.co/papers/2608.13120', 'abstract': 'Abstract SkillEvo improves agent skills through multi-turn feedback and active governance to sustain evolution gradients.  Generated by thinkingmachines/Inkling-Small Agent Skills are today either hand-authored or produced in a single LLM generation pass, and consequently possess no closed loop through which they might improve from the interaction failures they actually cause. Recent work does close this loop, but derives its feedback from single-turn question-answering evaluation. The consequence is a sharp asymmetry: once the first round has patched the gaps that a single exchange can reveal, the evolution gradient decays, the defects that surface only across multiple turns remain invisible, and evolution stalls. Governance in these systems is likewise driven by an end-to-end verification score, a scalar gate that can reject a degraded candidate but can neither localize nor repair its structural cause. We argue that the binding constraint on sustained skill evolution is neither editing capability nor the number of iterations, but whether the evaluation feedback keeps supplying trustworthy evolution gradients. We introduce SkillEvo, in which trustworthy feedback generates the gradient and controllable governance constrains its direction. The first component recasts multi-turn user simulation from an evaluation endpoint into a feedback generator: follow-up questions expose defects layer by layer, so that every round of revision both consumes feedback and produces new feedback. The second replaces the passive rejection of a scalar gate with an independent governance layer that actively repairs factual degradation and structural bloat, preventing the gradient from drifting as degradation accumulates. Across six categories of cloud services, 9 production Skills, and 98 skill-reference files, SkillEvo surpasses self-reflection-based evolution by 23.0 points and single- turn-QA-driven evolution by 15.4 points.', 'score': 19, 'issue_id': 3088, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': 'c56a0436a201d4be', 'authors': ['Qianxi Yan', 'Chunrong Chen', 'Jiuzhou Zhao', 'Min Zhang', 'Yongzhou Xu', 'Xiaochuan Xu'], 'affiliations': ['Tencent Cloud', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.13120.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Непрерывная эволюция навыков через многоэтапную обратную связь', 'desc': 'SkillEvo — это метод для улучшения навыков агентов через многоэтапную обратную связь и активное управление. В отличие от существующих подходов, которые основаны на однократной оценке, предложенный метод использует многоэтапное взаимодействие с пользователем для выявления дефектов на разных слоях абстракции. Система включает компонент обратной связи, который генерирует полезные градиенты эволюции через последовательные вопросы, и слой активного управления, который исправляет деградацию качества и структурные проблемы. Экспериментально показано, что SkillEvo превосходит методы самоотражения на 23 пункта и подходы на основе однораундовых вопросов на 15.4 пункта.'}, 'en': {'title': 'Empowering Agents with Continuous Multi-Turn Feedback', 'desc': 'SkillEvo is a method that enhances the skills of agents by using multi-turn feedback and active governance to maintain effective evolution gradients. Traditional skill generation methods either rely on manual creation or single-pass generation, which limits their ability to learn from mistakes. SkillEvo addresses this by using follow-up questions to uncover and fix issues over multiple interactions, ensuring continuous improvement. Additionally, it introduces a governance layer that actively repairs errors instead of just rejecting flawed outputs, leading to better performance across various applications.'}, 'zh': {'title': 'SkillEvo：通过多轮反馈提升智能体技能', 'desc': 'SkillEvo通过多轮反馈和主动治理来提升智能体技能，从而维持演化梯度。传统的技能生成方式往往缺乏闭环反馈，导致无法从交互失败中改进。SkillEvo引入了多轮用户模拟，将评估端点转变为反馈生成器，逐层揭示缺陷。通过独立的治理层，SkillEvo能够主动修复事实退化和结构膨胀，确保演化过程中的梯度不偏离。'}}}, {'id': 'https://huggingface.co/papers/2608.14022', 'title': 'ForgeWM: Progressive Causal Training for Few-Step Action-Conditioned Video World Models', 'url': 'https://huggingface.co/papers/2608.14022', 'abstract': "Abstract ForgeWM progressively distills bidirectional video generators into efficient few-step interactive world models with aligned discrete and continuous controls, supporting low-latency interaction and replay-time refinement.  Generated by thinkingmachines/Inkling-Small Action-conditioned video world models require low-latency causal generation and reliable responses to game-native controls. Although causal distillation enables one- or few-step video synthesis, extending it to interactive world models remains challenging, as discrete keyboard states and continuous mouse motion must remain aligned with temporally compressed latent chunks during causal training and autoregressive rollout. We introduce ForgeWM, a progressive framework that transforms a bidirectional action-conditioned video generator into efficient few-step world models through domain adaptation, teacher-forced causal training, causal consistency distillation, and on-policy distribution matching with a bidirectional teacher. The resulting budget-specialized students operate at steady-state denoising budgets of 1, 2, and 4 steps. ForgeWM further supports a dual-path deployment protocol combining latency-critical interaction with optional replay-time refinement, where the one-step student re-noises and refines its saved draft. On paired Minecraft trajectories, ForgeWM leads the evaluated systems in Imaging Quality, reference-aligned motion-profile agreement, action-sign accuracy, and mouse-control accuracy, while achieving the lowest reference LPIPS; the same four-stage recipe transfers to gamepad-controlled FPS gameplay. Replay-time refinement matches four-step reference quality while remaining roughly three times closer to the experienced trajectory than regeneration from noise. These results demonstrate ForgeWM's effectiveness for controllable few-step video generation.", 'score': 13, 'issue_id': 3086, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '34442907fe172381', 'authors': ['Xinye Li', 'Lingshuai Lin', 'Lei Wang', 'Liuzhou Zhang', 'Jialin Cui', 'Qingshan Li', 'Guanchu Wang', 'Qingbin Liu', 'Xi Chen', 'Jiang Bian', 'Wai Lam'], 'affiliations': ['CUHK', 'FDU', 'HKUST', 'Shanghai AI Laboratory', 'Tencent PCG'], 'pdf_title_img': 'assets/pdf/title_img/2608.14022.jpg', 'data': {'categories': ['#video', '#architecture', '#training', '#inference'], 'emoji': '🎮', 'ru': {'title': 'Эффективные world models для интерактивного видеосинтеза с низкой задержкой', 'desc': 'ForgeWM — это фреймворк для прогрессивной дистилляции двунаправленных видеогенераторов в эффективные world models, которые работают за несколько шагов и поддерживают управление как дискретными (клавиатура), так и непрерывными (мышь) действиями. Метод использует каузальное обучение с учителем, консистентность дистилляции и согласование распределения с двунаправленным учителем для создания студент-моделей, работающих с бюджетом в 1, 2 или 4 шага денойзинга. Система поддерживает двухпутевый протокол развёртывания: низколатентное взаимодействие в реальном времени и необязательное уточнение на этапе просмотра, где одношаговый студент может переклассифицировать и улучшить сохранённый черновик. ForgeWM достигает лучших результатов по качеству видео, согласованности движений, точности действий и управлению мышью на траекториях Minecraft и игровом процессе FPS.'}, 'en': {'title': 'ForgeWM: Fast and Accurate Video Generation for Interactive Worlds', 'desc': 'The paper introduces ForgeWM, a framework that improves video generation for interactive applications by creating efficient world models that can respond quickly to user inputs. It combines techniques like causal distillation and domain adaptation to align discrete and continuous controls, allowing for low-latency interactions. The framework is designed to generate high-quality video outputs in just a few steps, making it suitable for real-time applications like gaming. The results show that ForgeWM outperforms existing systems in terms of image quality and control accuracy, demonstrating its potential for enhancing user experiences in interactive environments.'}, 'zh': {'title': 'ForgeWM：高效的少步视频生成框架', 'desc': 'ForgeWM 是一种逐步提炼双向视频生成器的框架，能够高效地生成少步交互式世界模型。它通过对齐离散和连续控制，支持低延迟的交互和回放时间的优化。该方法结合了领域适应、教师强制因果训练和因果一致性提炼，确保在因果训练和自回归生成过程中，键盘状态和鼠标运动保持一致。实验结果表明，ForgeWM 在图像质量、动作准确性和鼠标控制精度等方面优于其他系统，展示了其在可控少步视频生成中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.19854', 'title': 'Repo0: Design-Driven Zero-to-All Code Generation', 'url': 'https://huggingface.co/papers/2608.19854', 'abstract': 'Abstract Repo0 uses a dual-graph architectural state and modularity-guided structural evolution to generate complete software repositories from natural-language requirements with high functionality coverage.  Generated by thinkingmachines/Inkling-Small Large language model agents have made substantial progress in code generation, yet most existing systems assume a predefined repository architecture. This assumption does not hold in zero-to-all code generation, where an agent must construct an entire software project directly from natural-language requirements while maintaining a modular repository architecture throughout development. We present Repo0, a continuous structural evolution framework for zero-to-all code generation. Repo0 maintains an explicit architectural state instantiated as a Dual-Directed-Acyclic-Graph (Dual-DAG), consisting of a requirement-level DAG, a component-level DAG, and their alignment relation. Starting from natural-language requirements, it iteratively evolves component boundaries through structural actions guided by modularity metrics until structural convergence, after which the converged architecture guides test-driven development code generation. We evaluate Repo0 on six real-world repositories from RepoCraft using GPT-5 mini and DeepSeek V3.2. Repo0 achieves the highest Functionality Coverage and Pass Rate across all settings. Compared with RPG, the strongest repository-planning baseline, Repo0 improves Functionality Coverage by up to 20.08 percentage points and Pass Rate by up to 29.74 percentage points. Ablation and structural-evolution analyses further demonstrate the importance of the Dual-DAG architectural state, modularity-guided structural evolution, and explicit structural convergence.', 'score': 5, 'issue_id': 3087, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': 'c3aa680b14b140d7', 'authors': ['Silin Chen', 'Haoyi Teng', 'Xiaodong Gu', 'Yuling Shi', 'Jiale Huang', 'Yongpan Wang', 'Hongyu Zhang', 'Haibing Guan'], 'affiliations': ['Chongqing University', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.19854.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#plp', '#agents'], 'emoji': '🏗️', 'ru': {'title': 'Эволюционирующая архитектура для порождения кода с нуля', 'desc': 'Repo0 — это фреймворк для генерации полных программных репозиториев из естественного языка с помощью агентов, основанных на больших языковых моделях. Система использует двойной ориентированный ациклический граф (Dual-DAG) для явного представления архитектурного состояния на уровне требований и компонентов. Фреймворк итеративно эволюционирует границы компонентов, руководствуясь метриками модульности, пока архитектура не сходится, после чего происходит генерация кода на основе тестов. Экспериментальная оценка на реальных репозиториях показала превосходство Repo0 над существующими базовыми моделями с улучшением на 20% по покрытию функциональности и на 30% по проценту пройденных тестов.'}, 'en': {'title': 'Transforming Natural Language into Modular Software Repositories', 'desc': 'Repo0 is a framework designed to generate complete software repositories directly from natural-language requirements while ensuring a modular architecture. It utilizes a Dual-Directed-Acyclic-Graph (Dual-DAG) to represent both requirement-level and component-level structures, allowing for continuous evolution of the software architecture. By applying modularity metrics, Repo0 iteratively refines component boundaries until achieving a stable architecture, which then informs the code generation process. The framework has shown significant improvements in functionality coverage and pass rates compared to existing methods, demonstrating its effectiveness in zero-to-all code generation.'}, 'zh': {'title': 'Repo0：从自然语言到完整软件库的创新框架', 'desc': 'Repo0 是一个用于从自然语言需求生成完整软件库的框架，采用双图架构状态和模块化引导的结构演化方法。它通过维护一个双向有向无环图（Dual-DAG），实现需求级和组件级的结构演化，确保在开发过程中保持模块化架构。Repo0 通过结构性操作迭代演化组件边界，直到达到结构收敛，从而指导测试驱动的代码生成。实验结果表明，Repo0 在功能覆盖率和通过率方面优于现有的最强基线，显示出其在零到全代码生成中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2608.19758', 'title': 'FlashPrefill V2: Block-Sparse Prefill Attention for Long-Context LLM Serving', 'url': 'https://huggingface.co/papers/2608.19758', 'abstract': 'Abstract FlashPrefill V2 improves long-context serving via mean-corrected sparse attention, optimized GPU operators, and framework integration, achieving large speedups over dense baselines.  Generated by thinkingmachines/Inkling-Small Long-context modeling is a pivotal capability for Large Language Models, yet the quadratic complexity of attention remains a critical bottleneck, particularly during the compute-intensive prefilling phase. Our previous work, FlashPrefill, mitigates this cost through instantaneous pattern discovery and max-based dynamic thresholding; however, it remains an algorithmic prototype that is still distant from production deployment. In this paper, we present FlashPrefill V2, which evolves FlashPrefill from a prototype toward practical long-context serving along three dimensions. First, we introduce a mean correction term that effectively suppresses the approximation error, keeping performance degradation manageable even at extreme sparsity levels. Second, we redesign the sparse attention operator with PackGQA memory access, warp specialization, and pingpong pipelining, fully aligning with the latest FlashAttention-3/4 implementations and supporting FP8 inference to meet practical quantization requirements. Third, FlashPrefill V2 natively supports paged KV cache and continuous batching, allowing integration as an attention backend in modern inference frameworks such as SGLang. Extensive evaluations on NVIDIA H20 GPUs---among the most widely deployed inference accelerators---demonstrate that FlashPrefill V2 delivers up to 47.26x and 27.19x speedups over FlashAttention-2 at 128K context length under FP8 and BF16 precision, respectively, and, in FP8, still achieves a 30.49x speedup against an FA3/4-aligned dense baseline.', 'score': 4, 'issue_id': 3088, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': 'e6f6e40fc31766d7', 'authors': ['Qihang Fan', 'Huaibo Huang', 'Zhiying Wu', 'Bingning Wang', 'Ran He'], 'affiliations': ['MAIS&NLPR, CASIA', 'UCAS', 'WeChat, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.19758.jpg', 'data': {'categories': ['#optimization', '#inference', '#long_context'], 'emoji': '⚡', 'ru': {'title': 'Экспоненциальное ускорение длинного контекста через умную разреженность', 'desc': 'FlashPrefill V2 — это оптимизированный алгоритм для ускорения фазы заполнения контекста (prefilling) в больших языковых моделях через разреженное внимание. Авторы предлагают коррекцию средним значением для уменьшения ошибки аппроксимации и переделывают оператор разреженного внимания с использованием специализированных GPU-техник, таких как PackGQA и pipelining. Система интегрирована с современными фреймворками вывода (SGLang) и поддерживает кэширование KV и непрерывную пакетную обработку. На практике FlashPrefill V2 достигает ускорения в 47 раз по сравнению с FlashAttention-2 при длине контекста 128K с использованием квантизации FP8.'}, 'en': {'title': 'Accelerating Long-Context Processing with FlashPrefill V2', 'desc': 'FlashPrefill V2 enhances the efficiency of long-context processing in Large Language Models by implementing mean-corrected sparse attention and optimized GPU operations. This approach addresses the computational challenges of the attention mechanism, particularly during the prefilling phase, which is crucial for performance. The paper introduces improvements such as a mean correction term to reduce approximation errors and a redesigned sparse attention operator that aligns with advanced FlashAttention implementations. Extensive testing shows that FlashPrefill V2 significantly accelerates processing speeds, achieving up to 47.26 times faster performance compared to previous methods.'}, 'zh': {'title': 'FlashPrefill V2：长上下文处理的速度革命', 'desc': 'FlashPrefill V2 是一种改进的长上下文处理方法，采用均值校正稀疏注意力机制和优化的 GPU 操作，显著提高了处理速度。该方法通过引入均值校正项来抑制近似误差，即使在极端稀疏情况下也能保持性能。它还重新设计了稀疏注意力操作，支持最新的 FlashAttention 实现，并满足实际量化需求。通过在 NVIDIA H20 GPU 上的广泛评估，FlashPrefill V2 在 128K 上下文长度下实现了显著的速度提升。'}}}, {'id': 'https://huggingface.co/papers/2608.20281', 'title': 'Inject, Align, Recover: Staged Post-Training for Retrieval-Free Document Knowledge Internalization', 'url': 'https://huggingface.co/papers/2608.20281', 'abstract': 'Abstract IAR is a three-stage post-training framework that injects structured document knowledge into language models, aligns them for retrieval-free question answering, and recovers general capabilities, improving both domain accuracy and general performance.  Generated by thinkingmachines/Inkling-Small Large language models often fail to answer questions about a bounded document collection when the source documents are not retrieved at inference time. We study this setting as document knowledge internalization: converting a fixed corpus into usable parametric knowledge for retrieval-free question answering. We propose IAR (Inject, Align, and Recover), a three-stage post-training framework that separates structured document knowledge injection, QA behavior alignment, and general ability recovery. Unlike conventional continued pretraining, Inject converts source documents into continuation, rewrite, and instruction-conditioned reconstruction objectives. Align then adapts the injected model with answer-only QA supervision, while Recover merges the domain-adapted model with the base instruction model to recover general capabilities. Across Common Corpus (CC) and CCI, and across Llama, Phi, Qwen, and SmolLM model families, IAR improves the domain-primary domain-general frontier for retrieval-free document internalization. In the main comparison, IAR improves over Vanilla SFT on all four reported metrics in 7 of 8 dataset-model settings, with average gains of 3.6 percentage points in domain QA accuracy and 12.1 percentage points in mean general performance across IFEval, MMLU, and MSBench. Extended CC baselines show that LoRA and FAPM can win individual general metrics, but among methods that also reach leading or near-leading domain internalization, IAR retains one of the strongest general profiles.', 'score': 3, 'issue_id': 3087, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '1558dc4f41bec81c', 'authors': ['Qian Kou', 'Xiaofeng Shi', 'Xiaosong Qiu', 'Hua Zhou'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI)'], 'pdf_title_img': 'assets/pdf/title_img/2608.20281.jpg', 'data': {'categories': [], 'emoji': '📚', 'ru': {'title': 'Интернализация знаний документов в языковые модели без поиска', 'desc': 'Работа представляет IAR — трёхэтапный фреймворк для постобучения языковых моделей, который внедряет структурированные знания из документов в параметры модели. Первый этап (Inject) преобразует исходные документы в задачи реконструкции и переписи, второй этап (Align) выравнивает модель на задачах вопросно-ответного диалога, а третий этап (Recover) восстанавливает общие способности через слияние с базовой моделью. Метод позволяет моделям отвечать на вопросы о фиксированной коллекции документов без использования поиска на этапе вывода, значительно улучшая как точность в целевом домене, так и производительность на общих бенчмарках.'}, 'en': {'title': 'Enhancing Language Models with Structured Document Knowledge for Better Question Answering', 'desc': 'The paper presents IAR, a three-stage framework designed to enhance language models for retrieval-free question answering by integrating structured document knowledge. The process involves injecting document knowledge, aligning the model for question answering, and recovering general capabilities to ensure broad performance. This approach addresses the challenge of language models struggling to answer questions based on a fixed document set without retrieving the documents during inference. The results show that IAR significantly improves both domain-specific accuracy and overall performance across various model families and datasets.'}, 'zh': {'title': 'IAR：提升无检索问答的能力', 'desc': 'IAR是一种三阶段的后训练框架，旨在将结构化文档知识注入语言模型中，以实现无检索问答的对齐和恢复通用能力。该方法通过将固定语料库转化为可用的参数化知识，解决了大型语言模型在推理时无法回答特定文档集合的问题。IAR的三个阶段分别是注入、对齐和恢复，注入阶段将源文档转化为重写和指令条件的重建目标。通过在多个模型和数据集上进行测试，IAR在领域问答准确性和通用性能上均有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2608.19891', 'title': 'EXIMO: VLM Guided Exploration of VLA Policies', 'url': 'https://huggingface.co/papers/2608.19891', 'abstract': "Abstract EXIMO efficiently fine-tunes large vision-language-action robot policies by combining VLM-guided exploration, imitation on orchestrated data, and residual off-policy reinforcement learning.  Generated by thinkingmachines/Inkling-Small How to efficiently finetune robot policies to learn new tasks on the fly? State of the art robotic manipulation policies are based on behaviour cloning of large vision-language-action (VLA) models with billions of parameters on huge teleoperation datasets. While this simple approach has enabled significant advances for robotic manipulation, finetuning of VLA policies for learning new tasks still remains an open problem. In particular, collecting teleoperation datasets requires hundreds of hours of expensive human labour and the alternative, reinforcement learning (RL), can be notoriously sample-inefficient especially for long-horizon tasks. In addition, RL with VLAs imposes several challenges due to the model's size and architectural design. In this work, we propose EXIMO, an efficient algorithm for finetuning of VLA policies. EXIMO operates in three stages: explore, imitate, and optimize. During the explore phase, EXIMO equips the VLA with a vision language model (VLM) that acts as a planner. The VLM thinks and breaks down challenging long-horizon problems into shorter ones for the VLA. The VLM, together with the VLA, is used to collect an orchestrated dataset on new tasks. During the imitate phase, the VLA is finetuned with the orchestrated data. Finally, during the optimize stage, we use residual off-policy RL to further finetune the policy. In our experiments, we ablate all three stages of EXIMO and show that it outperforms existing approaches significantly in terms of sample-efficiency and final performance.", 'score': 3, 'issue_id': 3086, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '7840e947cc698347', 'authors': ['Bhavya Sukhija', 'Oliver Groth', 'Mohit Shridhar', 'Tim Hertweck', 'Michael Bloesch', 'Markus Wulfmeier', 'Abbas Abdolmaleki', 'Martin Riedmiller'], 'affiliations': ['Google DeepMind'], 'pdf_title_img': 'assets/pdf/title_img/2608.19891.jpg', 'data': {'categories': ['#training', '#multimodal', '#rl', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Три этапа эффективной адаптации политик манипуляции роботов', 'desc': 'EXIMO представляет метод эффективной адаптации большых видео-языковых-действия моделей роботов через три последовательных этапа: исследование с помощью VLM-планировщика, имитационное обучение на организованных данных и остаточное off-policy обучение с подкреплением. Алгоритм решает проблему низкой выборочной эффективности при фин-тюнинге, избегая необходимости сбора дорогостоящих телеоперационных датасетов. На этапе исследования видео-языковая модель разбивает сложные долгоизмеряющие задачи на более короткие подзадачи, помогая собрать качественный датасет. Экспериментальные результаты демонстрируют, что EXIMO значительно превосходит существующие подходы по эффективности использования данных и финальной производительности политики.'}, 'en': {'title': 'Efficiently Fine-Tuning Robot Policies with EXIMO', 'desc': 'EXIMO is a novel algorithm designed to efficiently fine-tune large vision-language-action (VLA) robot policies for new tasks. It operates in three key stages: exploration, imitation, and optimization. In the exploration phase, a vision language model (VLM) helps break down complex tasks into manageable parts, allowing for the collection of a structured dataset. The imitation phase fine-tunes the VLA using this dataset, and the optimization phase employs residual off-policy reinforcement learning to enhance the policy further, resulting in improved sample efficiency and performance compared to existing methods.'}, 'zh': {'title': '高效微调机器人策略，快速学习新任务', 'desc': 'EXIMO是一种高效的算法，用于微调大型视觉-语言-动作（VLA）机器人策略，以便快速学习新任务。该方法结合了视觉语言模型（VLM）引导的探索、在组织数据上的模仿学习和残差离线强化学习。EXIMO分为三个阶段：探索、模仿和优化，能够有效地收集新任务的数据并进行策略微调。实验结果表明，EXIMO在样本效率和最终性能上显著优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2608.19936', 'title': 'Towards Quantifying Benchmark Optimization in ASR Models', 'url': 'https://huggingface.co/papers/2608.19936', 'abstract': "Abstract High-performing speech recognition models reproduce benchmark transcripts despite contradictory audio, revealing benchmark-optimized behaviors that inflate scores without improving real-world transcription.  Generated by thinkingmachines/Inkling-Small Public benchmarks are important measures of Automatic Speech Recognition (ASR) model capabilities. However, by nature of being public, there is risk of models being optimized for these benchmarks in ways that do not generalize well to real-world data. We present a methodology for quantifying benchmark optimization, focusing on cases where the audio underdetermines the reference transcript. We identify three families of behavioral probes that reveal models' capabilities of reproducing benchmark reference spans despite underdetermined audio: reference disagreement, masked-number recovery, and orthographic switching. We find that the highest-scoring open source models output verbatim reference transcript spans even when the relevant audio is contradictory, masked, or ambiguous. Using a variety of mechanistic probes, we show that models respond to narrow acoustic cues to override the faithful representation of the audio in favor of a benchmark-optimized policy. We show the benchmark-optimized behavior can be causally manipulated via low-rank linear steering or simply appending audio to the end of a segment in some cases. Overall, our results indicate that high-performing models exhibit benchmark-conditioned behaviors that can inflate benchmark performance without reflecting improved general-purpose transcription ability.", 'score': 2, 'issue_id': 3090, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '9fd7bd572fd5c9ec', 'authors': ['Theo Lebryk', 'David Ayllon', 'Alice Baird', 'Jakub Piotr Cłapa', 'Jens Madsen', 'Panagiotis Tzirakis'], 'affiliations': ['Hume AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.19936.jpg', 'data': {'categories': ['#audio', '#benchmark'], 'emoji': '🎯', 'ru': {'title': 'Модели ASR учат бенчмарки вместо речи', 'desc': 'В работе исследуется проблема переоптимизации моделей автоматического распознавания речи (ASR) под публичные бенчмарки. Авторы предлагают методологию для количественной оценки такой переоптимизации, используя случаи, когда аудио недостаточно определяет эталонную транскрипцию. Они демонстрируют, что лучшие модели воспроизводят эталонные фрагменты текста даже при противоречивом, замаскированном или неоднозначном аудио, опираясь на узкие акустические сигналы вместо точного представления речи. Авторы показывают, что такое поведение, оптимизированное под бенчмарк, можно изменить через линейное управление низкого ранга или добавление аудио, что подтверждает наличие артефактов переобучения.'}, 'en': {'title': 'Benchmark Performance vs. Real-World Accuracy in Speech Recognition', 'desc': 'This paper discusses how some speech recognition models perform well on public benchmarks but may not work effectively in real-world situations. The authors highlight that these models can produce accurate transcripts even when the audio is unclear or contradictory. They introduce methods to measure how much models are optimized for benchmarks rather than actual audio data. The findings suggest that high scores on benchmarks do not necessarily mean better overall transcription performance, as models may rely on specific cues to achieve these scores.'}, 'zh': {'title': '基准优化行为影响语音识别模型表现', 'desc': '本研究探讨了高性能语音识别模型在基准测试中的表现，尽管音频内容存在矛盾，模型仍能准确复现基准文本。这种现象表明，模型可能为了优化基准分数而进行调整，但这种优化并不一定能提高其在真实世界中的转录能力。我们提出了一种量化基准优化的方法，识别出三种行为探针，揭示模型在音频不确定的情况下仍能复现基准文本的能力。研究结果显示，许多高分开源模型在面对矛盾或模糊的音频时，仍然倾向于输出与基准文本一致的内容，反映出它们的行为受到基准条件的影响。'}}}, {'id': 'https://huggingface.co/papers/2608.19861', 'title': 'PolicyGuide: From Guarding One Action to Guiding the Whole Workflow for Policy-Compliant LLM Agents', 'url': 'https://huggingface.co/papers/2608.19861', 'abstract': "Abstract  Customer-service LLM agents must follow organizational policy when acting on a user's behalf. Compliance failures arise from either forbidden actions, such as granting an ineligible change, or omitted procedural requirements, such as identification or confirmation. Runtime safeguards can intervene on risky actions, but action-local checks do not guide an agent through a multi-step procedure. Workflow-following systems support prescribed process execution, but primarily target workflow completion rather than safeguarding agent behavior. PolicyGuide instead compiles each domain policy into a workflow graph and invokes a proactive verifier at user-turn boundaries. From persisted graph state, the verifier reconciles open requests and returns step-specific remediation along a policy-compliant path. Across the τ^2-bench airline, retail, and telecom domains with a GPT-5.4 agent and verifier, PolicyGuide raises mean Pass^4 from 0.42 to 0.62, with the largest gain on telecom (0.19 to 0.61), the most workflow-structured domain. The same workflows transfer to Claude Sonnet 4.6 and Gemini 2.5 Pro agents. Complementary evaluations find the lowest observed attack-success rate under adversarial users and the strongest procedural compliance in an author-designed workflow-level validation.", 'score': 2, 'issue_id': 3086, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '4b7b6f803c958a83', 'authors': ['Seongjae Kang', 'Taehyung Yu', 'Sung Ju Hwang'], 'affiliations': ['DeepAuto.ai', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2608.19861.jpg', 'data': {'categories': [], 'emoji': '🛡️', 'ru': {'title': 'Контролируемые многошаговые действия: граф-ориентированная верификация политик для надёжных агентов', 'desc': 'В работе предлагается система PolicyGuide для обеспечения соответствия LLM-агентов обслуживания клиентов организационной политике. Система компилирует политики в граф рабочего процесса и использует проактивную верификацию на границах взаимодействия пользователя, чтобы направлять агента через многошаговые процедуры. На трёх доменах (авиалинии, розница, телеком) система повышает показатель успешного выполнения политики с 0.42 до 0.62 за счёт пошагового исправления ошибок вдоль разрешённого пути. Метод демонстрирует переносимость между различными LLM-агентами и обеспечивает наиболее эффективную защиту от атак и соблюдение процедурных требований.'}, 'en': {'title': 'Ensuring Compliance in Customer-Service LLMs with PolicyGuide', 'desc': 'This paper introduces PolicyGuide, a system designed to ensure that customer-service language model (LLM) agents adhere to organizational policies while interacting with users. It addresses compliance failures that occur when agents either perform forbidden actions or neglect necessary procedural steps. Unlike traditional runtime safeguards that only check individual actions, PolicyGuide creates a workflow graph that outlines the entire policy process and uses a proactive verifier to guide agents through multi-step procedures. The results show significant improvements in compliance rates across various domains, particularly in telecom, demonstrating the effectiveness of this approach in enhancing agent behavior and safeguarding against policy violations.'}, 'zh': {'title': '确保合规的智能工作流系统', 'desc': '这篇论文介绍了一种名为PolicyGuide的系统，旨在确保客户服务的语言模型（LLM）代理在执行用户请求时遵循组织政策。该系统通过将每个领域的政策编译成工作流图，并在用户交互的边界调用主动验证器，从而提高了合规性。研究表明，PolicyGuide在航空、零售和电信等领域的应用中，显著提高了合规通过率，尤其是在电信领域。该系统还可以与其他语言模型代理兼容，确保在复杂的工作流程中保持高水平的合规性。'}}}, {'id': 'https://huggingface.co/papers/2608.18027', 'title': 'Chain-of-Experience for Continual LLM Improvement', 'url': 'https://huggingface.co/papers/2608.18027', 'abstract': "Abstract Large language models improve continuously through iterative test-time feedback loops called Chain-of-Experience, outperforming zero-shot baselines with lower cost and higher token efficiency.  Generated by thinkingmachines/Inkling-Small Humans continuously learn from experience, whereas conventional large language model (LLM) evaluations ignore the models' ability to improve through inference-time interaction. In this paper, we study how LLMs learn from iterative experience at test time, a setting we refer to as Chain-of-Experience (CoE), where models accumulate experiential traces through iterative interactions with self or environmental feedback to form a continual improvement loop beyond zero-shot inference. We instantiate CoE with diverse feedback mechanisms, including model self-feedback and environmental signals such as correctness or public coding test pass rates, and evaluate across math, coding, and knowledge domains using 8 LLMs, including GPT-5, Gemini-2.5 Pro, Claude-4.5 Sonnet. Our study shows that leveraging iterative experience consistently outperforms feedback-free baselines, achieving substantial gains with self feedback alone, alongside a 5.6% overall improvement and 19% lower API cost across tasks and models. We further show that combining complementary feedback channels (e.g., model and correctness signals) yields additional gains, and that CoE delivers higher accuracy per token than existing test-time strategies. We observe a positive correlation between LLM base ability and improvement capacity, and show that models remain robust under weak or spurious feedback, with different feedback contributing to distinct improvement aspects and most gains emerging early in the iterations.", 'score': 2, 'issue_id': 3089, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '8d61f7607a226da1', 'authors': ['Haoqin Tu', 'Yunhao Fang', 'Yizhong Wang', 'Cihang Xie', 'Shen Yan'], 'affiliations': ['Bytedance Seed', 'UC Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2608.18027.jpg', 'data': {'categories': ['#benchmark', '#training', '#inference', '#reasoning', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Модели учатся из собственного опыта: итеративная обратная связь улучшает языковые модели', 'desc': 'В статье исследуется подход Chain-of-Experience (CoE), который позволяет большим языковым моделям улучшаться через итеративное взаимодействие с обратной связью во время тестирования, а не только на этапе предварительной подготовки. Авторы применили различные механизмы обратной связи, включая самокритику модели и внешние сигналы (корректность ответов, результаты тестирования), оценив подход на 8 различных LLM на задачах из математики, программирования и знаниеве. Результаты показывают, что итеративное обучение из опыта последовательно превосходит базовые методы без обратной связи, обеспечивая улучшение на 5.6% и снижение стоимости API на 19% при лучшей эффективности токенов. Исследование выявило, что комбинирование дополнительных каналов обратной связи дает дополнительные преимущества, и что качество исходной модели коррелирует с её способностью к улучшению.'}, 'en': {'title': 'Unlocking Continuous Learning in Language Models', 'desc': 'This paper introduces the concept of Chain-of-Experience (CoE), which allows large language models (LLMs) to learn and improve through iterative feedback during test time. Unlike traditional evaluations that treat LLMs as static, CoE enables models to accumulate knowledge from interactions, enhancing their performance beyond zero-shot capabilities. The study demonstrates that using various feedback mechanisms, such as self-feedback and environmental signals, leads to significant improvements in accuracy and efficiency across multiple domains. The findings indicate that models can achieve better results with lower costs by leveraging iterative learning processes, highlighting the importance of continuous experience in machine learning.'}, 'zh': {'title': '通过经验链提升语言模型的学习能力', 'desc': '本文研究了一种称为经验链（Chain-of-Experience, CoE）的新方法，旨在通过迭代的反馈循环来提升大型语言模型（LLM）的性能。与传统的零-shot评估不同，CoE允许模型在测试时通过自我反馈和环境信号不断学习和改进。我们在数学、编程和知识领域对8种LLM进行了评估，结果表明，利用迭代经验的模型在准确性和成本效率上均优于无反馈的基线模型。研究还发现，结合不同的反馈渠道可以进一步提高模型的表现，且模型在面对弱反馈时依然保持稳健。'}}}, {'id': 'https://huggingface.co/papers/2608.13210', 'title': 'NARU: A Benchmark for NARrative Evolution and Cultural Nuance Understanding in Japanese Extreme Long Video', 'url': 'https://huggingface.co/papers/2608.13210', 'abstract': 'Abstract NARU is a Japanese long-form video benchmark evaluating narrative evolution and cultural reasoning through a hierarchical annotation pipeline and extensive native-speaker verification.  Generated by thinkingmachines/Inkling-Small Long-form video understanding encompasses tasks that go beyond retrieving isolated events, including tracking an evolving narrative and interpreting social meaning that may remain implicit. However, existing benchmarks rarely evaluate these capabilities jointly, particularly in high-context, non-English media. To address this gap, we introduce NARU, a benchmark designed to evaluate Narrative evolution and Reasoning on cultural Understanding in Japanese long-form video. NARU consists of 1,481 questions grounded in 155 videos totaling 146.8 hours, spanning four narrative and five cultural dimensions. To construct the benchmark at this scale, we propose a hierarchical memory-based annotation pipeline that transforms raw video into structured event, narrative, and cultural annotations, then generates questions via task-oriented synthesis and iterative shortcut removal. The construction process includes two native-speaker verification stages involving 68 annotators. Evaluations across eight model configurations reveal substantial limitations in both long-range narrative integration and culturally grounded reasoning. By exposing these persistent gaps, NARU offers a systematic testing ground for developing MLLMs capable of reliably interpreting long-form, high-context video.', 'score': 2, 'issue_id': 3092, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '67b0751229ebd1e3', 'authors': ['Yuheng Huang', 'Jianlang Chen', 'Jiayang Song', 'Hua Qi', 'Aza Kai', 'Vincent Markert', 'Edison Marrese-Taylor', 'Jianjun Zhao', 'Lei Ma'], 'affiliations': ['Infinimind Japan Inc., Japan', 'Kyushu University, Fukuoka, Japan', 'Macau University of Science and Technology, Macau, China', 'The University of Tokyo, Tokyo, Japan', 'University of Alberta, Edmonton, Canada'], 'pdf_title_img': 'assets/pdf/title_img/2608.13210.jpg', 'data': {'categories': ['#long_context', '#multimodal', '#dataset', '#reasoning', '#video', '#benchmark', '#multilingual'], 'emoji': '🎬', 'ru': {'title': 'Понимание японского видео: повествование и культурное значение', 'desc': 'NARU — это новый бенчмарк для оценки способности моделей понимать длинные японские видео, включая отслеживание развивающегося сюжета и интерпретацию культурного контекста. Датасет содержит 1481 вопрос к 155 видео продолжительностью 146.8 часов с аннотациями по четырём повествовательным и пяти культурным измерениям. Авторы разработали иерархический конвейер аннотирования с двумя этапами проверки носителями языка и генерацией вопросов через синтез и удаление артефактов. Оценка восьми конфигураций моделей выявила существенные ограничения в долгосрочной интеграции сюжета и культурно-обусловленном рассуждении.'}, 'en': {'title': 'NARU: Advancing Video Understanding through Narrative and Cultural Insights', 'desc': 'The NARU benchmark is designed to assess how well machine learning models can understand and interpret long-form Japanese videos, focusing on narrative evolution and cultural reasoning. It includes a comprehensive set of 1,481 questions based on 155 videos, which cover various narrative and cultural aspects. The benchmark uses a hierarchical annotation process to convert raw video content into structured data, allowing for detailed analysis of narrative and cultural elements. By identifying the limitations of current models in these areas, NARU aims to improve the development of machine learning models that can better handle complex video content.'}, 'zh': {'title': 'NARU：评估日本长视频的叙事与文化理解', 'desc': 'NARU是一个评估日本长视频叙事演变和文化推理的基准。它通过分层注释流程和广泛的母语者验证，提供了1,481个问题，基于155个视频，总时长达到146.8小时。该基准旨在联合评估叙事整合和文化推理能力，尤其是在高语境的非英语媒体中。NARU的构建过程包括两轮母语者验证，揭示了现有模型在长距离叙事整合和文化推理方面的显著局限性。'}}}, {'id': 'https://huggingface.co/papers/2608.19863', 'title': 'Listening Forward: Next Patch Embedding Prediction Enables Scalable Audio Learners', 'url': 'https://huggingface.co/papers/2608.19863', 'abstract': "Abstract NAPE uses causal Transformers to predict successive spectrogram patch embeddings for self-supervised audio learning without auxiliary components.  Generated by thinkingmachines/Inkling-Small Self-supervised learning (SSL) has driven substantial progress in audio representation learning, though existing methods have increasingly relied on elaborate pre-training recipes to reach competitive performance. A markedly different pre-training philosophy underpins the most influential progress in language modeling and, more recently, in visual representation learning: rather than train encoders as static feature extractors, models are trained to predict the next element, a discrete token or a continuous embedding, from the preceding context. Autoregressive prediction thereby provides a unified pre-training interface that transfers across modalities, compelling the model to learn the underlying data distribution. We ask whether such a simple causal paradigm can yield strong audio learners, given that audio's temporal structure makes autoregressive prediction of patch embeddings a natural fit. We introduce NAPE (Next-Audio-Patch-Embedding prediction), a self-supervised framework in which a causal Transformer predicts each next patch embedding of a log-mel spectrogram from the previous ones, using causal masking and stop-gradient as its sole training signal. The design is intentionally minimalist, avoiding reconstruction decoders, acoustic tokenizers, student-teacher setups, and auxiliary regularization losses. Across six audio and speech benchmarks, NAPE achieves state-of-the-art fine-tuning performance on several tasks, scales consistently across encoder sizes, and yields strong linear-probing results. NAPE also produces structured attention patterns without explicit supervision.", 'score': 1, 'issue_id': 3092, 'pub_date': '2026-08-20', 'pub_date_card': {'ru': '20 августа', 'en': 'August 20', 'zh': '8月20日'}, 'hash': '421b3308dd5ec3cb', 'authors': ['Umberto Cappellazzo', 'Xubo Liu', 'Stavros Petridis', 'Maja Pantic'], 'affiliations': ['Imperial College London', 'University of Surrey'], 'pdf_title_img': 'assets/pdf/title_img/2608.19863.jpg', 'data': {'categories': ['#optimization', '#transfer_learning', '#audio', '#architecture', '#training'], 'emoji': '🎵', 'ru': {'title': 'Предсказание следующего аудиопатча — путь к самообучению без вспомогательных компонентов', 'desc': 'NAPE — это метод самообучения для аудио, который использует каузальный Transformer для предсказания эмбеддингов последовательных патчей спектрограммы. В отличие от сложных существующих подходов, метод применяет минималистичный дизайн без декодеров, токенизаторов и вспомогательных компонентов, полагаясь только на авторегрессивное предсказание следующего элемента. Модель обучается предсказывать логарифмическую мел-спектрограмму патча за патчем, используя причинную маскировку и stop-gradient как единственный сигнал для обучения. Экспериментальные результаты показывают, что NAPE достигает передовых показателей на нескольких задачах распознавания речи и аудиоклассификации, хорошо масштабируется и производит структурированные паттерны внимания без явного контроля.'}, 'en': {'title': 'Simplifying Audio Learning with Causal Transformers', 'desc': 'NAPE (Next-Audio-Patch-Embedding prediction) is a self-supervised learning framework that utilizes causal Transformers to predict the next patch embeddings of audio spectrograms. This approach simplifies the training process by avoiding complex components like reconstruction decoders and auxiliary losses, focusing solely on autoregressive prediction. By leveraging the temporal structure of audio data, NAPE effectively learns the underlying data distribution, achieving state-of-the-art performance across various audio and speech benchmarks. The model demonstrates strong scalability and produces meaningful attention patterns without requiring explicit supervision.'}, 'zh': {'title': '简化音频学习的因果预测', 'desc': 'NAPE（下一音频补丁嵌入预测）是一种自监督学习框架，利用因果变换器预测音频的补丁嵌入。该方法通过简单的因果预测机制，避免了复杂的预训练过程，专注于从前一个补丁嵌入中预测下一个补丁嵌入。NAPE在六个音频和语音基准测试中表现出色，达到了最先进的微调性能，并且在不同的编码器规模上表现一致。该模型还能够在没有显式监督的情况下生成结构化的注意力模式。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
