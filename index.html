    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                    flag.classList.add('active');

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.10771', 'title': 'WorldFoundry: Towards Unified Infrastructure for World Intelligence', 'url': 'https://huggingface.co/papers/2611.10771', 'abstract': 'Abstract WorldFoundry offers open-source infrastructure for reproducible inference and evaluation of generative world models across video, 3D/4D, embodied action, and interactive systems, with traceable evidence and benchmarks.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Visual generative models increasingly blur the line between synthesizing observations and simulating environments. Yet visual plausibility alone does not constitute successful world modeling: compelling outputs may lack persistent state, physical dynamics, or causally consistent responses to interactions. We define a generative world model as a predictive dynamical system that maintains a persistent, history-conditioned representation of an environment, updates that representation in response to actions or interventions, and generates temporally coherent trajectories that reflect outcomes under observed and counterfactual interventions. From this definition, we derive an intelligence-oriented framework spanning perceptual grounding, persistent state modeling, controllable transformation, dynamics-aware prediction, and closed-loop interaction. We present WorldFoundry, open-source infrastructure for reproducible inference and evaluation across video, 3D and 4D, embodied action, and interactive world systems. WorldFoundry unifies model and benchmark discovery, runtime and asset preparation, execution orchestration, artifact management, and interactive visualization, while modality-specific adapters preserve native inputs, execution semantics, output representations, and evaluation protocols. Explicit manifests, durable artifact contracts, and evidence-aware scorecards separate execution readiness from evaluative claims, making each claim traceable to its supporting artifacts. The catalog contains 270 model entries, 74 benchmarks, and 62 registered metric entries, with readiness and execution evidence recorded separately. WorldFoundry enables reproducible comparison of persistent, controllable dynamics across heterogeneous systems, advancing the field from perceptual synthesis toward measurable world intelligence.', 'score': 8, 'issue_id': 3517, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': '01f2d7166c07805a', 'authors': ['Juanxi Tian', 'Jiadong Hou', 'Baiang Li', 'Xin Lin', 'Zhengbo Jiao', 'Weijia Zhang', 'Yeying Jin', 'Truong Nguyen', 'Haitian Zheng', 'Zhifei Zhang', 'Jianfei Yang', 'Ming-Hsuan Yang', 'Felix Heide', 'Wei Xiong', 'Enze Xie', 'Wanhua Li'], 'affiliations': ['OpenEnvision'], 'pdf_title_img': 'assets/pdf/title_img/2611.10771.jpg', 'data': {'categories': ['#robotics', '#video', '#survey', '#agents', '#3d', '#open_source', '#benchmark', '#dataset'], 'emoji': '🌍', 'ru': {'title': 'От красивой картинки к измеримому интеллекту мира', 'desc': 'Статья представляет WorldFoundry — открытую инфраструктуру для воспроизводимого инференса и оценки генеративных мировых моделей (world models) в видео, 3D/4D, embodied action и интерактивных системах. Авторы определяют генеративную мировую модель как предиктивную динамическую систему с персистентным состоянием, которое обновляется под действием интервенций и порождает temporally coherent траектории, включая контрфактуальные сценарии. WorldFoundry объединяет поиск моделей и бенчмарков, подготовку окружения, оркестрацию выполнения, управление артефактами и визуализацию, а адаптеры сохраняют специфику каждой модальности. Каталог включает 270 моделей, 74 бенчмарка и 62 метрики, с раздельной фиксацией готовности к запуску и доказательств выполнения, что делает научные утверждения прослеживаемыми.'}, 'en': {'title': 'From Visual Plausibility to Measurable World Intelligence', 'desc': 'The paper defines a generative world model as a system that keeps track of an environment over time, responds to actions, and predicts coherent outcomes—including outcomes of actions not yet taken. It presents WorldFoundry, open-source infrastructure for running and evaluating world models across video, 3D and 4D, embodied action, and interactive systems. The platform organizes models, benchmarks, execution, and results, while recording evidence so evaluation claims can be traced to supporting artifacts. Its catalog includes 270 models, 74 benchmarks, and 62 metric entries, helping researchers compare systems on persistent state, controllability, and physical dynamics.'}, 'zh': {'title': '从逼真生成迈向可验证的世界智能', 'desc': '论文提出生成式世界模型应不只生成逼真的画面，还要保留环境状态、根据动作更新状态，并预测连贯的后续变化。作者据此构建评估框架，涵盖感知 grounding、持久状态建模、可控变换、动力学预测和闭环交互。WorldFoundry 是一个开源平台，支持视频、3D/4D、具身动作和交互式世界系统的模型推理与评测，并提供模型与基准检索、运行管理及结果可视化。平台通过记录运行证据和评测依据，让不同系统的比较可复现、可追溯，推动研究从视觉生成走向可衡量的世界智能。'}}}, {'id': 'https://huggingface.co/papers/2611.10690', 'title': 'JoVox: Joint Hierarchical Flow Matching for Lightweight Voxel Generation', 'url': 'https://huggingface.co/papers/2611.10690', 'abstract': 'Abstract  Generating high-fidelity voxels while keeping their lightweight nature remains an open problem in computer vision. Current generators are either high-fidelity but computationally heavy, or lightweight but of lower fidelity. Hierarchical methods keep the lightweight nature of voxels. However, their coarse levels, which decide where all finer cells can appear, are generated with the least information about the shape and are never revisited, so they are often plausible but wrong. Our key insight is to let finer cells take part in deciding coarse cells. To this end, we propose JoVox, a discrete flow matching framework that learns the joint distribution of all levels of the voxel hierarchy, instead of a separate distribution for each level, so that coarse cells can be predicted with finer cells already generated nearby. Within this framework, we further introduce a two-level prediction, which outputs the cells two levels finer at once instead of one level finer, halving the number of levels that the network processes and yielding voxels of higher fidelity. We also introduce an unmasking strategy that revisits early decisions once finer cells are generated and corrects inconsistencies in masked diffusion models. Our framework outperforms the baselines on both unconditional and image-conditioned voxel generation. Compared with the current state-of-the-art TRELLIS.2, we achieve 8x higher training throughput, 1/15 of the FLOPs in a forward pass, train on 4 vs. 32 GPUs, and obtain higher quality with an 11% lower Chamfer distance.', 'score': 1, 'issue_id': 3517, 'pub_date': '2026-11-07', 'pub_date_card': {'ru': '7 ноября', 'en': 'November 7', 'zh': '11月7日'}, 'hash': 'e3a6065a04d6431d', 'authors': ['Xiangjun Tang', 'Jianqi Chen', 'Peter Wonka'], 'affiliations': ['King Abdullah University of Science and Technology (KAUST)'], 'pdf_title_img': 'assets/pdf/title_img/2611.10690.jpg', 'data': {'categories': ['#architecture', '#cv', '#training', '#3d', '#diffusion', '#optimization', '#inference'], 'emoji': '🧊', 'ru': {'title': 'Мелкие детали помогают правильно строить грубую форму', 'desc': 'Статья предлагает JoVox — дискретный flow matching фреймворк для генерации 3D-вокселей, который учит совместное распределение всех уровней иерархии вокселей вместо отдельных распределений для каждого уровня. Это позволяет предсказывать грубые ячейки с учётом уже сгенерированных мелких, а двухуровневое предсказание вдвое сокращает число обрабатываемых сетью уровней. Дополнительная стратегия unmasking пересматривает ранние решения и исправляет несогласованности в masked diffusion моделях. По сравнению с TRELLIS.2 метод даёт 8x ускорение обучения, в 15 раз меньше FLOPs и на 11% меньший Chamfer distance.'}, 'en': {'title': 'Let Fine Details Guide Coarse Shapes', 'desc': 'JoVox generates detailed 3D voxel shapes while keeping computation efficient. It uses discrete flow matching to learn the joint distribution of coarse and fine levels, allowing fine cells to help choose coarse cells. Its two-level prediction generates cells two levels finer at a time, and its unmasking strategy revisits and corrects earlier decisions. JoVox outperforms prior methods in unconditional and image-conditioned generation, including higher quality than TRELLIS.2 with substantially less compute and fewer GPUs.'}, 'zh': {'title': '让细节参与决策，轻量体素也能生成得更精准', 'desc': '本文提出 JoVox，一种用于体素生成的离散流匹配框架。它联合学习体素层级中所有层的分布，让较细的体素也能帮助决定较粗层的结构。框架还采用两级预测和反复解掩码策略，以减少处理层数并修正早期生成的不一致。实验表明，JoVox 在无条件和图像条件生成中都优于现有方法，同时计算开销更低、生成质量更高。'}}}, {'id': 'https://huggingface.co/papers/2610.42148', 'title': 'Flide: Accelerating Decision Inference with Exact State Forking', 'url': 'https://huggingface.co/papers/2610.42148', 'abstract': 'Abstract Flide is an exact inference engine that accelerates decision-model LLM agents by decoupling logical request trees from physical execution and using ForkAttention to preserve exact branch evaluations.  Generated by deepseek-ai/DeepSeek-V4.1-Flash Decision models such as Jev have emerged as a highly promising paradigm for LLM agent systems, providing lightweight and reliable categorical reasoning for rapid System One execution. However, existing generation-oriented inference engines fail to support these workloads effectively, suffering from severe prefix recomputation overheads or distorted output probabilities. To address this challenge, we propose Flide, an efficient and exact inference engine that decouples the logical tree structure of a decision request from its physical execution within a single flattened token stream. Through ForkAttention, Flide navigates request dependencies using GPU-resident indices across both standard attention and recurrent Gated DeltaNet layers, guaranteeing in exact arithmetic that every query branch evaluates identically to an isolated forward pass. By expressing branch topologies directly in GPU-resident metadata, Flide accommodates diverse request mixtures with a compact set of pre-recorded execution graphs while enabling expanding agent histories to resume from checkpoints saved in earlier passes. Extensive evaluations on public hybrid and decision models demonstrate that Flide answers queries up to 9.5 times faster than vLLM and SGLang while staying closest to a float32 reference in total variation distance. By unifying physical execution throughput with mathematical exactness, Flide establishes a principled foundation for scalable, latency-critical decision intelligence in agent systems.', 'score': 1, 'issue_id': 3517, 'pub_date': '2026-10-30', 'pub_date_card': {'ru': '30 октября', 'en': 'October 30', 'zh': '10月30日'}, 'hash': 'b5c254252f844cae', 'authors': ['Bobo Li', 'Jiajia Song', 'Hao Fei', 'Wynne Hsu', 'Mong Li Lee'], 'affiliations': ['National University of Singapore', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2610.42148.jpg', 'data': {'categories': ['#architecture', '#agents', '#inference', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Быстрые решения без потери точности: Flide ускоряет LLM-агентов', 'desc': 'Flide — это точный движок инференса (exact inference engine), который ускоряет LLM-агентов для принятия решений, разделяя логическое дерево запроса и его физическое выполнение в единый поток токенов. Механизм ForkAttention использует GPU-индексы, чтобы каждая ветка запроса вычислялась идентично изолированному forward pass как в стандартных attention-слоях, так и в рекуррентных слоях Gated DeltaNet. Благодаря предзаписанным графам выполнения и чекпоинтам системе не нужно заново пересчитывать префиксы, что критично для задач с низкой задержкой. В тестах Flide отвечает на запросы до 9.5 раз быстрее vLLM и SGLang, сохраняя при этом наибольшую близость к float32-эталону по total variation distance.'}, 'en': {'title': 'Faster Branching, Exact Decisions', 'desc': 'Flide is an inference engine for decision-model LLM agents that aims to make reasoning faster without changing the model’s exact branch results. It separates the logical tree of a request from how tokens are executed, then uses ForkAttention to track branch dependencies across attention and recurrent Gated DeltaNet layers. This lets multiple branches share a flattened token stream while each branch produces the same result as if it were evaluated on its own. In evaluations, Flide was up to 9.5 times faster than vLLM and SGLang, while keeping output probabilities close to a float32 reference.'}, 'zh': {'title': '分支计算既快又准：Flide 加速智能体决策推理', 'desc': 'Flide 是一种面向决策模型智能体的精确推理引擎，可减少重复计算并加快推理。它将请求中的逻辑分支结构与实际执行方式分离，并将请求展平为单一 token 流。其 ForkAttention 使用 GPU 上的索引处理分支依赖，确保每个分支的计算结果与单独进行前向传播完全一致，也支持标准注意力层和循环 Gated DeltaNet 层。在公开模型评测中，Flide 的查询速度最高可达 vLLM 和 SGLang 的 9.5 倍，同时保持了接近 float32 参考结果的概率精度。'}}}, {'id': 'https://huggingface.co/papers/2611.08452', 'title': 'ReproBridge: Building Reproducibility into ML Research Artifacts', 'url': 'https://huggingface.co/papers/2611.08452', 'abstract': 'Abstract  Reproducing machine learning experiments requires reconstructing procedures from information scattered across papers, released code, and supporting artifacts. For coding agents, reproduction success can therefore depend on their ability to fill in missing details, rather than on the released artifacts alone. We ask whether preserving recovered procedures and decisions improves subsequent independent reproduction. We define a standardized artifact design comprising a refined codebase, environment setup, experiment launchers, and a reproduction guide, and introduce ReproBridge, an agent workflow for constructing these refined reproducible artifacts. ReproBridge-Bench provides 1,029 tasks from 387 experiments across 36 papers, anchored by five human-verified reference scores per task. Agents attempt tasks in fresh sessions with raw code or refined artifacts; a separate Auditor checks execution evidence. Across four evaluated models, refined artifacts raise mean reproduction success from 76.4% to 92.6% and reduce downstream API spending by 19.7% on average. The cross-model success-rate spread narrows from 21.6 to 3.9 percentage points, with all four models achieving mean success rates above 90%. Removing any component reduces success in the ablation study, with the largest losses from code and environment removal. These results suggest that preserving execution knowledge helps even models with lower raw-code success reproduce experiments more reliably and at lower API cost.', 'score': 0, 'issue_id': 3517, 'pub_date': '2026-11-05', 'pub_date_card': {'ru': '5 ноября', 'en': 'November 5', 'zh': '11月5日'}, 'hash': 'c38c60d13090ea9f', 'authors': ['Yubo Wang', 'Rui Meng', 'Jaehyun Nam', 'Tomas Pfister', 'Jinsung Yoon'], 'affiliations': ['Google', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2611.08452.jpg', 'data': {'categories': ['#science', '#agents', '#data', '#training', '#open_source', '#benchmark'], 'emoji': '🔁', 'ru': {'title': 'Сохраняем знания о выполнении — и эксперименты воспроизводятся надёжнее', 'desc': 'Статья посвящена воспроизводимости экспериментов в машинном обучении, которую LLM-агенты часто не могут выполнить, поскольку недостающие детали процедуры разбросаны по статьям и коду. Авторы предлагают ReproBridge, агентный workflow, который создаёт очищенные артефакты: рефакторированный кодбейз, настройку окружения, скрипты запуска и руководство по воспроизведению. Бенчмарк ReproBridge-Bench содержит 1029 задач из 387 экспериментов по 36 статьям, а отдельный Auditor проверяет доказательства выполнения. Результаты показывают, что очищенные артефакты повышают успешность воспроизведения с 76,4% до 92,6% и снижают расходы на API примерно на 20%, а также выравнивают результаты разных моделей.'}, 'en': {'title': 'Preserve the Procedure, Reproduce the Experiment', 'desc': 'Reproducing machine learning experiments can be difficult because key steps are scattered across papers, code, and other materials. The authors introduce ReproBridge, a workflow that packages a refined codebase, environment setup, experiment launchers, and a guide so agents can reuse recovered procedures. On a benchmark of 1,029 tasks, these refined artifacts raised average reproduction success from 76.4% to 92.6% and lowered API costs by 19.7%. They also reduced performance differences between models, suggesting that preserving execution knowledge makes reproductions more reliable across agents.'}, 'zh': {'title': '保存实验执行经验，让机器学习复现更可靠', 'desc': '复现机器学习实验时，关键信息往往散落在论文、代码和其他材料中，因此智能体需要补全缺失的步骤。本文提出 ReproBridge 工作流程，用来整理代码、环境配置、实验启动脚本和复现指南，形成更易复现的实验材料。研究团队构建了包含 1,029 项任务的基准测试，并发现使用整理后的材料，平均复现成功率从 76.4% 提升到 92.6%，API 开销平均降低 19.7%。这些材料也缩小了不同模型之间的成功率差距，说明保存实验执行经验能让模型更稳定、更省成本地复现实验。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (3)', '#agi', '#alignment', '#architecture (2)', '#audio', '#benchmark (2)', '#cv (1)', '#data (1)', '#dataset (1)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal', '#open_source (2)', '#optimization (2)', '#plp', '#rag', '#reasoning', '#rl', '#rlhf', '#robotics (1)', '#science (1)', '#security', '#small_models', '#story_generation', '#survey (1)', '#synthetic', '#training (2)', '#transfer_learning', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-11-10 04:27',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-11-10 04:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-11-10 04:27')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
