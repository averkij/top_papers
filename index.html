    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.35201', 'title': 'DTCA: Denoising Token Credit Assignment for Reinforcement Learning in Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.35201', 'abstract': 'Abstract DTCA improves reinforcement learning for diffusion language models by assigning token-level credit via confidence improvements and entropy calibration, boosting mathematical reasoning.  Generated by thinkingmachines/Inkling-Small Diffusion language models (DLMs) generate text through iterative denoising, enabling bidirectional context modeling and parallel token refinement. Recent studies have applied reinforcement learning (RL) to DLMs and improved their reasoning performance. However, the iterative denoising process makes credit assignment more challenging, as final outcome rewards provide limited information about how different tokens contribute to the final output. In this paper, we propose Denoising Token Credit Assignment (DTCA), a framework for token-level credit assignment in reinforcement learning for diffusion language models. DTCA estimates token contributions by measuring the improvement in prediction confidence of remaining masked positions after token commitment and groups these signals according to part-of-speech (POS) categories. These contribution weights are used to select informative denoising timesteps and assign token-level learning signals during RL training. DTCA further calibrates these learning signals according to token-level entropy changes induced by policy updates. Experiments on LLaDA-8B-Instruct show that DTCA consistently improves mathematical reasoning performance across different generation budgets, with gains of up to 9.0 points on MATH500 and 5.3 points on GSM8K over the base model.', 'score': 256, 'issue_id': 3472, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': '009c3afed4488863', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#math', '#optimization', '#reasoning', '#rl'], 'emoji': '🧩', 'ru': {'title': 'Точная награда для каждого токена: DTCA делает диффузионные LLM умнее в математике', 'desc': 'В статье предлагается метод DTCA для обучения диффузионных языковых моделей (DLM) с подкреплением, который решает проблему распределения кредита на уровне токенов. Вклад каждого токена оценивается по улучшению уверенности предсказания оставшихся замаскированных позиций, а сигналы группируются по частям речи (POS). Дополнительно учитывается изменение энтропии токенов, вызванное обновлением политики, что калибрует обучающие сигналы. На модели LLaDA-8B-Instruct метод повышает качество математических рассуждений: до +9.0 пунктов на MATH500 и +5.3 на GSM8K.'}, 'en': {'title': 'Boosting DLMs with Token-Level Credit Assignment', 'desc': 'This paper introduces Denoising Token Credit Assignment (DTCA), a method that enhances reinforcement learning in diffusion language models (DLMs) by providing token-level credit assignments. DTCA addresses the challenge of credit assignment in iterative denoising processes by evaluating how much each token contributes to the final output based on prediction confidence improvements. It organizes these contributions by part-of-speech categories and uses them to optimize the learning signals during training. The results demonstrate that DTCA significantly boosts mathematical reasoning capabilities in DLMs, achieving notable performance improvements on benchmark tasks.'}, 'zh': {'title': '去噪令牌信用分配：提升扩散语言模型的推理能力', 'desc': '本文提出了一种新的框架，称为去噪令牌信用分配（DTCA），用于在扩散语言模型的强化学习中进行令牌级别的信用分配。DTCA通过测量在令牌承诺后剩余掩码位置的预测置信度改善来估计令牌的贡献，并根据词性类别对这些信号进行分组。该方法在强化学习训练中使用这些贡献权重来选择信息丰富的去噪时间步，并根据策略更新引起的令牌级熵变化来校准学习信号。实验结果表明，DTCA在不同生成预算下显著提高了数学推理性能。'}}}, {'id': 'https://huggingface.co/papers/2610.32749', 'title': 'Efficient Streaming Audio-Visual Target Speaker Extraction for Real-World Acoustic Scenes', 'url': 'https://huggingface.co/papers/2610.32749', 'abstract': 'Abstract Falcon is a lightweight causal audio-visual target speaker extraction method that achieves high quality with drastically reduced parameters and latency, supported by the realistic RealSSA benchmark.  Generated by thinkingmachines/Inkling-Small Streaming audio-visual target speaker extraction (AVTSE) is essential for latency-sensitive applications. However, current causal systems face two coupled gaps. First, standard benchmarks fix the number of speakers at two and ignore the near-/far-field interference, reverberation, and sudden noise of real scenes. Second, high-performance causal architectures are too heavy for edge deployment. Lightweight alternatives try to reclaim capacity by repeatedly invoking a small separator, which offsets the savings. To address the first gap, we release RealSSA, a realistic AVTSE benchmark consisting of RealSSA-Sim and RealSSA-Real. RealSSA-Sim provides controllable simulated scenes with 1--5 dynamic near-field interfering speakers; scenes with far-field interference additionally include 10--15 far-field interfering speakers. RealSSA-Real provides a held-out real-recorded evaluation set. To address the second gap, we propose Falcon, a causal AVTSE method. Its Separator performs multi-scale time-frequency separation in a single encoder--decoder pass. We train Falcon with an encoder-space speaker contrastive loss. This loss suppresses near-field leakage at zero inference cost and transfers across backbones. Falcon achieves state-of-the-art extraction quality on RealSSA-Sim, LRS2-2Mix, LRS3-2Mix, and VoxCeleb2-2Mix. Compared with the causal AV-TFGridNet baseline, it cuts parameters by 91.9%, computation by 20.2 times, and GPU inference latency by 11.1 times. Code and demo are available at https://cslikai.cn/Falcon/.', 'score': 146, 'issue_id': 3472, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'c337e3f899a3d83b', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#video', '#benchmark', '#audio', '#small_models', '#optimization', '#architecture', '#dataset', '#multimodal'], 'emoji': '🦅', 'ru': {'title': 'Быстрее и легче — выделяем нужного диктора в реальном шуме', 'desc': 'Статья представляет Falcon — лёгкий каузальный метод аудио-визуального извлечения целевого диктора (AVTSE), работающий в потоковом режиме с малой задержкой. Авторы также выпускают бенчмарк RealSSA с реалистичными сценами: ближнепольными и дальнепольными помехами, реверберацией и внезапным шумом. Separator в Falcon выполняет многомасштабное частотно-временное разделение за один проход encoder-decoder, а contrastive loss в пространстве энкодера подавляет утечку ближнепольных диктора без затрат на инференсе. По сравнению с каузальным AV-TFGridNet модель сокращает параметры на 91.9%, вычисления в 20.2 раза и задержку GPU-инференса в 11.1 раза при сохранении state-of-the-art качества.'}, 'en': {'title': 'Falcon: Lightweight and Efficient Audio-Visual Speaker Extraction', 'desc': "Falcon is a new method for extracting a target speaker's voice from audio and video, designed to be lightweight and efficient. It addresses two main challenges in current systems: the need for realistic testing environments and the heavy computational demands of existing models. The method introduces the RealSSA benchmark, which simulates various real-world scenarios with multiple speakers and noise. Falcon achieves high-quality results while significantly reducing the number of parameters and processing time, making it suitable for real-time applications."}, 'zh': {'title': 'Falcon：轻量级音视频目标说话人提取的创新之路', 'desc': 'Falcon是一种轻量级的因果音视频目标说话人提取方法，能够在大幅减少参数和延迟的情况下实现高质量的提取。该方法通过引入RealSSA基准，解决了当前因果系统在真实场景中面临的干扰和噪声问题。Falcon的分离器在单次编码-解码过程中执行多尺度时频分离，并通过编码空间的说话人对比损失进行训练，从而有效抑制近场泄漏。与传统方法相比，Falcon在多个基准测试中表现出色，参数减少了91.9%，计算量降低了20.2倍，GPU推理延迟减少了11.1倍。'}}}, {'id': 'https://huggingface.co/papers/2610.31670', 'title': 'Sensorimotor Alignment: A Platonic Proxy for Embodied Policy Success', 'url': 'https://huggingface.co/papers/2610.31670', 'abstract': "Abstract Sensorimotor alignment measures how sensory representations match physical motion geometry, serving as a low-cost offline predictor of robot model performance.  Generated by thinkingmachines/Inkling-Small Robot foundation models are typically evaluated through costly closed-loop rollouts, motivating low-cost offline proxies for model capability. The Platonic Representation Hypothesis (PRH) suggests that as representations improve, modalities such as vision and language converge toward a shared statistical model of reality. We ask whether motion trajectories form another such modality: as embodied models become more capable, should their sensory representations converge toward the structure of physical motion? To test this, we propose Sensorimotor Alignment (S^2), a training-free offline metric that measures how well a model's sensory representation aligns with the geometry of physical motion. We find that S^2 correlates positively with downstream robot task success across model families, making it a low-cost offline proxy for prioritizing models before closed-loop evaluation. S^2 can also identify promising vision-language model (VLM) backbones before costly fine-tuning into vision-language-action models (VLAs). Beyond this correlation, S^2 offers representation-level explanations for phenomena observed in VLAs and world action models (WAMs). With S^2, we extend PRH to robotics and make sensorimotor alignment measurable, offering a low-cost, representation-level view of robot foundation models that closed-loop success rates alone cannot reveal.", 'score': 33, 'issue_id': 3473, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': 'a713c937ed2d8101', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#interpretability', '#robotics', '#agents', '#benchmark', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Оценивай робота по тому, как его восприятие совпадает с физикой движения', 'desc': 'В статье предлагается Sensorimotor Alignment (S^2) — offline-метрика без обучения, которая измеряет, насколько sensory-представления модели согласованы с геометрией физического движения. Авторы показывают положительную корреляцию S^2 с успешностью робота на downstream-задачах, что делает метрику дешёвым прокси для предварительного отбора моделей перед дорогостоящей closed-loop оценкой. Метод также помогает выбирать VLM-бэкбоны до fine-tuning в VLA и даёт representation-level объяснения наблюдаемым эффектам в VLA и world action models. Работа расширяет гипотезу Platonic Representation Hypothesis (PRH) на робототехнику, показывая, что траектории движения образуют отдельную модальность, к которой сходятся представления по мере роста возможностей модели.'}, 'en': {'title': 'Aligning Sensory and Motion Representations for Better Robot Performance', 'desc': "This paper introduces Sensorimotor Alignment (S^2), a metric that evaluates how well a robot's sensory representations correspond to the geometry of physical motion. It serves as a low-cost offline predictor of a robot's performance, allowing researchers to assess models without expensive closed-loop testing. The study builds on the Platonic Representation Hypothesis (PRH), suggesting that as models improve, their sensory modalities converge towards a unified understanding of reality. The findings indicate that S^2 correlates with task success in robots, making it a valuable tool for selecting and refining models before intensive evaluations."}, 'zh': {'title': '传感运动对齐：低成本评估机器人模型的利器', 'desc': '传感运动对齐（S^2）是一种衡量感知表示与物理运动几何形状匹配程度的指标，能够作为机器人模型性能的低成本离线预测工具。该研究提出，随着模型能力的提升，感知表示（如视觉和语言）应趋向于共享的统计现实模型。通过S^2，我们可以在不进行训练的情况下评估模型的感知表示与物理运动结构的对齐程度，从而预测机器人任务的成功率。S^2不仅为机器人基础模型提供了低成本的评估方法，还能在昂贵的微调之前识别出有潜力的视觉-语言模型。'}}}, {'id': 'https://huggingface.co/papers/2610.35684', 'title': 'OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images', 'url': 'https://huggingface.co/papers/2610.35684', 'abstract': "Abstract OmniShowcase improves subject-to-video generation by using geometry-driven training data and surface-normal conditioning to maintain 3D consistency across novel viewpoints.  Generated by thinkingmachines/Inkling-Small Generating videos of a specific subject from a few reference images remains challenging when the camera reveals surfaces that are not visible in the input. Early subject-to-video (S2V) methods condition on a single reference image and must therefore infer the subject's unseen appearance and geometry as the viewpoint changes. To address this limitation, recent methods extend S2V to multiple reference views, providing more information about the subject from different viewpoints. However, they do not explicitly specify the 3D structure that connects these observations. In addition, existing training data do not guarantee that viewpoint changes preserve the same underlying 3D subject. We present OmniShowcase, built on two components: (i) a fully automated data synthesis pipeline that produces training videos along diverse camera trajectories, with viewpoint variation driven by underlying subject geometry, even spanning full 360-degree orbits; and (ii) a geometry-conditioning method that provides the video model with a turntable of surface-normal maps reconstructed from the reference views without requiring temporal alignment with the generated frames. We construct Showcase-4K, a corpus of 3D-asset-based videos covering twelve camera motions across 88 trajectory configurations with reconstruction-derived surface-normal conditioning, and ShowcaseBench, a held-out evaluation set with the source meshes and camera parameters used to render each video. Experiments show state-of-the-art subject identity and 3D consistency while maintaining competitive video quality and motion. Project page: justin4ai.github.io/OmniShowcase", 'score': 31, 'issue_id': 3472, 'pub_date': '2026-10-26', 'pub_date_card': {'ru': '26 октября', 'en': 'October 26', 'zh': '10月26日'}, 'hash': 'b50dbc28014eedb0', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#benchmark', '#3d', '#diffusion', '#synthetic', '#data', '#dataset', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Видео объекта с любого ракурса — без потери 3D-структуры', 'desc': 'Статья описывает OmniShowcase — метод subject-to-video генерации, который создаёт видео объекта по нескольким референсным изображениям. Авторы используют полностью автоматический пайплайн синтеза данных, где движение камеры, включая полные 360-градусные орбиты, задаётся геометрией самого 3D-объекта. Для сохранения 3D-консистентности модель получает условие в виде карт нормалей поверхности, восстановленных по референсам и не требующих временной синхронизации с кадрами. Авторы также выпустили датасет Showcase-4K и бенчмарк ShowcaseBench, на которых метод показывает лучшую идентичность объекта и 3D-консистентность при конкурентном качестве видео.'}, 'en': {'title': 'Revolutionizing Video Generation with 3D Consistency', 'desc': "OmniShowcase enhances the generation of videos from reference images by ensuring 3D consistency through geometry-driven training data and surface-normal conditioning. Traditional subject-to-video (S2V) methods struggle with unseen surfaces when changing viewpoints, but OmniShowcase addresses this by synthesizing training videos that reflect the subject's geometry across various camera angles. It introduces a fully automated data synthesis pipeline that captures diverse camera trajectories and a geometry-conditioning method that utilizes surface-normal maps from reference views. The results demonstrate improved subject identity and 3D consistency, achieving state-of-the-art performance in video quality and motion."}, 'zh': {'title': 'OmniShowcase：提升视频生成的3D一致性', 'desc': 'OmniShowcase通过使用几何驱动的训练数据和表面法线条件，改善了从主题生成视频的过程，确保在新视角下保持3D一致性。传统的主题到视频(S2V)方法依赖单一参考图像，难以推断在视角变化时主题的隐藏外观和几何结构。为了解决这一问题，OmniShowcase引入了多视角参考图像，并通过自动化数据合成管道生成多样化的训练视频。实验结果表明，该方法在主题识别和3D一致性方面达到了最先进的水平，同时保持了竞争力的视频质量和运动表现。'}}}, {'id': 'https://huggingface.co/papers/2610.37230', 'title': 'TAO: Tool-Aware Joint Scheduling for LLM-Based Agentic Serving', 'url': 'https://huggingface.co/papers/2610.37230', 'abstract': 'Abstract TAO improves scheduling for LLM agent services by considering tool readiness and using dynamic programming to place sessions, reducing latency and increasing throughput.  Generated by thinkingmachines/Inkling-Small Agentic services alternate between model inference on clustered GPUs and external tools on distributed CPUs. In this scenario, existing systems (1) overlook tool-return readiness in service evaluation, wasting limited resources, and (2) use heuristic strategies to decide admission and placement on GPUs, resulting in suboptimal scheduling decisions. To bridge this gap, we present TAO, a tool-aware joint scheduling framework for LLM-based agentic serving. Its value interface combines near-term tool readiness, node-specific cache credit with time-aware decay, and token footprint; a dynamic program jointly selects and places waiting sessions under capacity constraints. Across the 12 reported model-workload-concurrency settings, TAO reduces latency by up to 26.8%, reduces mean time to first token (TTFT) by up to 36.3%, and increases decode throughput by up to 29.5% relative to the best evaluated state-of-the-art baseline for each metric.', 'score': 12, 'issue_id': 3473, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '7eacd7a867835b35', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#optimization', '#agents'], 'emoji': '⚙️', 'ru': {'title': 'Умное планирование LLM-агентов: быстрее ответы, выше пропускная способность', 'desc': 'В статье представлен TAO — фреймворк для совместного планирования (scheduling) запросов в агентных сервисах на основе LLM, где модель чередует инференс на GPU с вызовами внешних инструментов на CPU. Авторы показывают, что существующие системы не учитывают готовность результатов инструментов и принимают решения о допуске и размещении сессий эвристически. TAO вводит функцию ценности, объединяющую готовность инструментов, кредит кэша с временным затуханием и размер токенов, а динамическое программирование выбирает и размещает ожидающие сессии под ограничениями ёмкости. В экспериментах по 12 конфигурациям метод снижает задержку до 26.8%, время до первого токена (TTFT) до 36.3% и повышает пропускную способность декодирования до 29.5%.'}, 'en': {'title': 'Optimizing LLM Scheduling with TAO: Tool-Aware Efficiency', 'desc': "The paper introduces TAO, a scheduling framework designed to enhance the efficiency of large language model (LLM) agent services. It addresses two main issues: the neglect of tool readiness in service evaluations and the reliance on heuristic methods for scheduling on GPUs. By employing dynamic programming, TAO optimally places sessions while considering tool availability and resource constraints. The results show significant improvements in latency and throughput, demonstrating TAO's effectiveness over existing systems."}, 'zh': {'title': 'TAO：优化LLM代理服务调度的工具感知框架', 'desc': 'TAO是一种改进大语言模型（LLM）代理服务调度的方法，它考虑了工具的准备情况，并使用动态规划来优化会话的安排，从而减少延迟并提高吞吐量。该系统通过在集群GPU上进行模型推理和在分布式CPU上使用外部工具来交替工作。现有系统在服务评估中忽视了工具返回的准备情况，浪费了有限的资源，并且使用启发式策略来决定GPU的接纳和放置，导致调度决策不理想。TAO通过结合工具准备情况、节点特定的缓存信用和时间敏感的衰减，提供了一种工具感知的联合调度框架，显著提高了性能。'}}}, {'id': 'https://huggingface.co/papers/2610.29702', 'title': 'CausGround: Causal Interaction Grounding for Adaptive Embodied Planning', 'url': 'https://huggingface.co/papers/2610.29702', 'abstract': 'Abstract CausGround extracts reusable action preconditions and effects from interaction experience to improve embodied planning and reasoning across diverse environments without model retraining.  Generated by thinkingmachines/Inkling-Small Multimodal large language models (MLLMs) show promising reasoning capabilities, but reliable physical interaction requires planning that accounts for when actions are executable and how they change the world. These preconditions and effects are environment-dependent and often not captured by MLLMs, making adaptation challenging. Yet existing approaches either require costly environment-specific training or rely on unstructured interaction experience that is difficult to reuse. Therefore, we introduce CausGround, a non-parametric causal interaction grounding framework that distills interaction experience into reusable action-centered causal knowledge. CausGround identifies action preconditions and effects and organizes them in a factorized world-state representation capturing object attributes and inter-object relations. At planning time, task-relevant causal dependencies are grounded in current observations to support backward reasoning over preconditions and forward reasoning over effects for action selection and multi-step planning. We evaluate CausGround on simulated high-level planning, interaction reasoning, and real-world robot manipulation. On adapted VirtualHome and RoboCasa benchmarks, CausGround improves vision-based high-level planning across MLLM backbones, increasing average task success from 24.9% to 53.3% on VirtualHome and closed-loop planning success from 43.0% to 57.0% on RoboCasa. On SWITCH, average interaction reasoning accuracy increases from 25.8% to 31.9%, indicating improved action selection, recovery, and verification. Moreover, real-world experiments show that CausGround reasons backward from MLLM-interpreted goals to derive executable high-level action sequences for sequential manipulation. These results demonstrate that reusable action preconditions and effects support long-horizon embodied planning across diverse environments without parameter updates.', 'score': 1, 'issue_id': 3473, 'pub_date': '2026-10-21', 'pub_date_card': {'ru': '21 октября', 'en': 'October 21', 'zh': '10月21日'}, 'hash': '7efcbd6e5b87c260', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#robotics', '#multimodal', '#benchmark', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Понимать причины и следствия действий — ключ к умному планированию робота без переобучения', 'desc': 'В статье представлен CausGround — непараметрический фреймворк для каузального заземления взаимодействий, который извлекает из опыта взаимодействия с окружением переиспользуемые предусловия и эффекты действий. Знания организуются в факторизованном представлении состояния мира, отражающем атрибуты объектов и отношения между ними, и применяются при планировании через обратное рассуждение по предусловиям и прямое рассуждение по эффектам, без обновления параметров MLLM. Эксперименты на VirtualHome, RoboCasa и SWITCH показали рост успешности планирования с 24.9% до 53.3% и с 43.0% до 57.0% соответственно, а также улучшение точности интерактивного рассуждения. Реальные эксперименты с роботом подтвердили, что подход позволяет строить исполнимые последовательности действий для многошаговых манипуляций.'}, 'en': {'title': 'Empowering Planning with Reusable Causal Knowledge', 'desc': 'CausGround is a framework designed to enhance embodied planning and reasoning by extracting reusable action preconditions and effects from interaction experiences. It addresses the challenge of adapting large language models (MLLMs) to different environments without the need for costly retraining. By organizing causal knowledge into a structured representation, CausGround enables effective backward and forward reasoning for action selection and multi-step planning. The framework has shown significant improvements in task success rates and interaction reasoning accuracy in both simulated and real-world scenarios.'}, 'zh': {'title': 'CausGround：提升体态规划的因果知识框架', 'desc': 'CausGround 是一种非参数因果交互基础框架，旨在从交互经验中提取可重用的动作前提和效果，以改善在不同环境中的体态规划和推理。该框架通过识别动作的前提条件和效果，并将其组织成一个因子化的世界状态表示，捕捉对象属性和对象间关系。在规划时，CausGround 能够根据当前观察结果支持反向推理和前向推理，从而进行动作选择和多步骤规划。实验结果表明，CausGround 在虚拟环境和真实机器人操作中显著提高了任务成功率，证明了其在无需参数更新的情况下支持长时间的体态规划能力。'}}}, {'id': 'https://huggingface.co/papers/2610.34186', 'title': 'HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience', 'url': 'https://huggingface.co/papers/2610.34186', 'abstract': 'Abstract HuGe pre-trains vision-language-action models on egocentric human and robot data with pseudo-proprioception and visual adaptation to enable whole-body humanoid control.  Generated by thinkingmachines/Inkling-Small Extending Vision-Language-Action models (VLAs) to humanoid robots requires coordinated whole-body control and diverse demonstrations that are costly to collect in real-world scenarios. Although egocentric human demonstrations provide a complementary source of task experience, differences in visual embodiment and missing robot proprioception complicate transfer to humanoid policies. To address these challenges, we introduce HuGe, a family of Humanoid Generalist VLAs pre-trained on over 2,000 hours of egocentric human and robot data. Specifically, HuGe employs three existing representative VLA architectures to predict latent motion tokens for a pretrained whole-body controller, together with hand-control signals. Based on this, we introduce a three-stage training pipeline that combines egocentric pre-training, humanoid adaptation, and downstream fine-tuning. To facilitate transfer across embodiments, we construct pseudo-proprioceptive states through simulation playback during pre-training and modify arm appearance in egocentric observations through re-rendering during downstream fine-tuning. With this pipeline, HuGe achieves the state-of-the-art on simulation benchmark HumanoidArena. Furthermore, real-world experiments on the Unitree G1 indicate that augmenting robot demonstrations with visually adapted egocentric demonstrations significantly increases success on a pick-and-drop task.', 'score': 1, 'issue_id': 3473, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': 'dc9ee0626fa9e416', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#robotics', '#cv', '#data', '#benchmark', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Учимся управлять человекоподобным роботом по видео людей', 'desc': 'Статья представляет HuGe, семейство обобщённых VLA-моделей для человекоподобных роботов, предобученных на более чем 2000 часах эгоцентричных данных от людей и роботов. Модель предсказывает латентные токены движения для предобученного контроллера всего тела и сигналы управления кистями рук. Для переноса между разными телами используются псевдо-проприоцептивные состояния, построенные через симуляцию, и перерисовка рук в визуальных наблюдениях. Эксперименты показывают state-of-the-art результаты на бенчмарке HumanoidArena и рост успешности на реальном роботе Unitree G1.'}, 'en': {'title': 'HuGe: Bridging Human Experience to Humanoid Robot Control', 'desc': 'The paper introduces HuGe, a model designed to enhance humanoid robot control by integrating vision, language, and action (VLA) through extensive pre-training on egocentric data. It addresses the challenges of transferring human demonstrations to robots by using pseudo-proprioception and visual adaptation techniques. HuGe employs a three-stage training pipeline that includes pre-training on human data, adapting to humanoid robots, and fine-tuning for specific tasks. The results show that HuGe outperforms existing models in simulation and improves real-world task success rates when using adapted demonstrations.'}, 'zh': {'title': 'HuGe：提升人形机器人控制的智能模型', 'desc': 'HuGe是一种预训练的视觉-语言-动作模型，旨在实现全身人形机器人的控制。该模型利用超过2000小时的自我中心人类和机器人数据，通过伪本体感知和视觉适应来解决人类示范与机器人控制之间的差异。HuGe采用三阶段训练流程，包括自我中心预训练、人形适应和下游微调，以提高模型的迁移能力。实验结果表明，HuGe在模拟基准测试中表现出色，并且在实际任务中显著提高了机器人的成功率。'}}}, {'id': 'https://huggingface.co/papers/2601.15351', 'title': 'OmniSpectra: A Unified Foundation Model for Universal Spectra Representation Learning', 'url': 'https://huggingface.co/papers/2601.15351', 'abstract': 'Abstract OmniSpectra is a wavelength-native spectral foundation model that uses continuous coordinates and physics-grounded decoders to learn cross-instrument representations without destructive resampling, achieving high performance with far fewer parameters.  Generated by thinkingmachines/Inkling-Small Standard sequence models encode position by token rank rather than physical coordinate, typically forcing practitioners to destructively resample continuous physical signals such as spectra observed across heterogeneous instruments. We identify this coordinate mismatch as a structural limitation in cross-instrument representation learning, and propose OmniSpectra, a wavelength-native foundation model for spectral representation learning: a continuous-coordinate masked autoencoder that discards the integer pixel indexing of sequence modeling. Mapping physical coordinates to a logarithmic basis turns the multiplicative scaling induced by cosmological redshift into a uniform additive shift. In continuous rotary position embeddings, this shared shift cancels from relative token distances rather than producing grid-dependent positional distortion. We further counter the spectral bias inherent to implicit neural decoders with a physics-grounded, resolution-gated Fourier decoder that provides anti-aliasing. Pretrained on eight surveys and benchmarked against seven baselines, our model reaches state-of-the-art performance with only 12.2M parameters while outperforming substantially larger models, indicating that encoding physical structure can substitute for parameter scale.', 'score': 0, 'issue_id': 3473, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': '82f6bb776ab495cb', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#architecture', '#small_models', '#science', '#data', '#interpretability', '#multimodal'], 'emoji': '🔭', 'ru': {'title': 'Физика вместо масштаба: учим модель понимать координаты спектра', 'desc': 'В статье представлена OmniSpectra — foundation model для спектров, которая работает с непрерывными физическими координатами длины волны, а не с индексами пикселей, что позволяет обучать representation learning на данных разных инструментов без destructive resampling. Ключевая идея: логарифмическая шкала превращает красное смещение (redshift) в равномерный аддитивный сдвиг, который при continuous rotary position embeddings сокращается из относительных расстояний между токенами. Для борьбы со spectral bias неявных нейросетевых декодеров авторы используют physics-grounded Fourier decoder с resolution-gated механизмом, обеспечивающим anti-aliasing. Модель из 12.2M параметров, предобученная на восьми обзорах, достигает state-of-the-art результатов и превосходит значительно более крупные модели, что показывает: кодирование физической структуры может заменить масштаб параметров.'}, 'en': {'title': 'Revolutionizing Spectral Learning with Fewer Parameters', 'desc': 'OmniSpectra is a new model designed for learning spectral representations from different instruments without losing important information. It uses continuous coordinates instead of traditional pixel indexing, which helps avoid issues caused by resampling physical signals. The model incorporates a physics-based decoder that improves performance by addressing spectral bias and ensuring better resolution. With only 12.2 million parameters, OmniSpectra achieves state-of-the-art results, demonstrating that understanding physical structures can reduce the need for larger models.'}, 'zh': {'title': 'OmniSpectra：高效的光谱表示学习模型', 'desc': 'OmniSpectra是一种波长原生的光谱基础模型，利用连续坐标和基于物理的解码器来学习跨仪器的表示，避免了破坏性重采样。传统的序列模型通过标记排名来编码位置，通常需要对不同仪器观察到的连续物理信号进行重采样，这限制了跨仪器表示学习的效果。我们提出的OmniSpectra模型采用连续坐标的掩蔽自编码器，消除了序列建模中的整数像素索引问题。经过在八个调查数据集上的预训练和与七个基线模型的比较，我们的模型以仅12.2M的参数达到了最先进的性能，表明编码物理结构可以替代参数规模。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agents (3)', '#agi', '#alignment', '#architecture (2)', '#audio (1)', '#benchmark (5)', '#cv (1)', '#data (3)', '#dataset (2)', '#diffusion (1)', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability (2)', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (6)', '#open_source', '#optimization (5)', '#plp', '#rag', '#reasoning (1)', '#rl (1)', '#rlhf', '#robotics (3)', '#science (1)', '#security', '#small_models (2)', '#story_generation', '#survey', '#synthetic (1)', '#training (2)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-29 10:37',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-29 10:37')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-29 10:37')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
