    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2611.04916', 'title': 'Behind Video Generation: Observations and Insights on Multimodal Understanding from Kling', 'url': 'https://huggingface.co/papers/2611.04916', 'abstract': "Abstract Kling's multimodal understanding stack links caption density, perceptual text encoding, reward modeling, and evaluation protocols to improve controllable video generation.  Generated by thinkingmachines/Inkling-Small Video generation has progressed from isolated clips to coherent short-form audiovisual sequences, and the bottleneck is shifting from rendering to semantic control. This report summarizes the observations and insights on multimodal understanding gained from successive generations of Kling. We argue that generation quality is the projection of multimodal understanding through the entire data--conditioning--alignment--evaluation chain, and we examine this chain module by module. Kling-MLLM, a shared multimodal foundation model that unifies image, video, audio, synchronized audio--video, and interleaved inputs, is specialized for each downstream module. Because a DiT is trained on far fewer training samples than a language model, we treat captioning as a semantic contract that maximizes description density, and extend it to reference-grounded captioning that makes reference bindings explicit. Prompt enhancement translates user intent into this caption distribution: basic PE is derived from captions of compelling videos and refined with text-level and generator-in-the-loop reinforcement learning, while agentic PE refines the story and retrieves compelling examples. We show that a reliable text encoder comes from perceptual training rather than from stronger language ability, and that candidates can be screened from text alone before end-to-end training. Reward modeling pairs a general reward model for explainable, localized critiques with a decision reward model for fast multidimensional scoring, treating perceptual bandwidth as a first-class design parameter. Finally, we review task-specific automatic evaluation, focusing on protocols that expose scoring shortcuts and help trace failures to their upstream source. We hope these lessons offer practical guidance for building the understanding stack behind controllable video generation.", 'score': 17, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': '76af3a69039a56d1', 'authors': ['Kling Team', 'Dong Chen', 'Jialu Chen', 'Xinlong Chen', 'Yifan Dai', 'Haotian Dong', 'Binzong Geng', 'Yushuo Guan', 'Minghui Guo', 'Guanlin He', 'Guanxiao He', 'Jingyun Hua', 'Yanwei Huang', 'Yiyan Ji', 'Xueping Jia', 'Yizhuo Jia', 'Bozhou Li', 'Jiaze Li', 'Min Li', 'Shihao Li', 'Shujie Li', 'Shengyi Liao', 'Weihong Lin', 'Shiyuan Liu', 'Xinyu Liu', 'Siyang Mao', 'Xiaoru Qu', 'Dianmo Sheng', 'Yang Shi', 'Jiafu Tang', 'Longxiang Tang', 'Yuqi Tang', 'Chengzhuo Tong', 'Kuo Wang', 'Qixun Wang', 'Rui Wang', 'Tianduo Wang', 'Yuran Wang', 'Zekun Wang', 'Zihao Wang', 'Boyang Xia', 'Yifan Xu', 'Liu Yang', 'Zhenlong Yuan', 'Bohan Zeng', 'Mujin Zhang', 'Yuanxing Zhang', 'Zhicheng Zhang', 'Zhuoran Zhang', 'Yuanhong Zheng', 'Kun Gai', 'Chengru Song', 'Pengfei Wan'], 'affiliations': ['Kling'], 'pdf_title_img': 'assets/pdf/title_img/2611.04916.jpg', 'data': {'categories': ['#data', '#rlhf', '#alignment', '#video', '#multimodal', '#audio', '#training', '#survey', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Качество видео начинается с понимания мультимодальных данных', 'desc': 'Статья описывает, как понимание мультимодальных данных (изображения, видео, аудио и их комбинации) влияет на качество генерации видео. Авторы представляют Kling-MLLM — общую мультимодальную foundation model, которая специализируется под разные модули: captioning с высокой плотностью описаний, prompt enhancement с RL, text encoder, обученный на перцептивных данных, и reward modeling. Отдельно рассматриваются автоматические метрики оценки, которые выявляют лазейки в скоринге и помогают находить источник ошибок. Работа даёт практические рекомендации по построению стека понимания для управляемой генерации видео.'}, 'en': {'title': 'Build Understanding Across the Pipeline for More Controllable Video', 'desc': 'The paper argues that controllable video generation depends on a full pipeline of multimodal understanding, from training data and captions to conditioning, reward alignment, and evaluation. It describes Kling-MLLM, a shared multimodal foundation model adapted to handle images, video, audio, and synchronized or mixed inputs. Dense, reference-grounded captions and prompt enhancement help translate user intent into useful generation conditions, while perceptual training makes text encoders better at matching visual content. The paper also recommends combining explainable and fast reward models with task-specific evaluations that reveal shortcuts and help trace failures to their source.'}, 'zh': {'title': '让多模态理解贯穿全链路，提升视频生成的可控性', 'desc': '本文总结了可控视频生成中的多模态理解流程，涵盖数据描述、条件输入、对齐和评估。作者提出，视频字幕应包含高密度语义信息，并明确描述文本与参考对象之间的对应关系。提示词增强会把用户意图转化为适合生成模型的描述；文本编码器则应通过感知训练提升对视觉内容的理解。论文还介绍了奖励模型与任务专用评估方法，用于发现生成问题并追溯其来源。'}}}, {'id': 'https://huggingface.co/papers/2611.02497', 'title': 'RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild', 'url': 'https://huggingface.co/papers/2611.02497', 'abstract': 'Abstract RoboColosseum evaluates general robot policies across diverse embodiments and environments, revealing weak cross-embodiment agreement, limited open-world reliability, and substantial differences between zero-shot and fine-tuned performance.  Generated by thinkingmachines/Inkling-Small General-purpose robot policies must work across robots, tasks, and environments, yet the variation that makes physical trials informative also makes them difficult to reproduce. We introduce RoboColosseum, a distributed evaluation framework that combines unified policy serving and standardized protocols across a network of locally operated robots in diverse environments. Our initial study evaluates five vision-language-action (VLA) policies and three frontier AI agents across four embodiments (SO-101, Franka, Bimanual-YAM, and G1 Humanoid). The Open Track compares models without task-specific adaptation in blinded, pairwise trials under matched local conditions. The Fine-tune Track measures how well VLA policies adapt to 20 tasks across all four embodiments when each policy receives the same 100 demonstrations per task. Across 5,699 pairwise Open Track comparisons at 124 sites, frontier agents rival specialized VLA policies, while all systems struggle to complete open-world tasks reliably. After fine-tuning, GR00T N1.7 leads on SO-101 and pi0.5 leads on Franka and Bimanual-YAM. Policy rankings show weak agreement across embodiment-specific task suites (Kendall W = 0.24). Open Track rankings poorly predict relative performance after fine-tuning, with substantial rank reversals on all three embodiments shared between tracks. Measuring partial progress reveals differences that task success alone misses. On the G1 Humanoid, no policy completes any of the five tasks, yet average progress ranges from 13.3% to 23.2% across policies. Open Track rankings stabilize as trials accumulate, and active matchmaking achieves comparable ranking agreement with substantially fewer physical trials than uniform sampling. These results show how distributed physical evaluation can reveal where robot policies generalize, how well they adapt to new tasks, and how far they progress on tasks they fail to complete.', 'score': 15, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'da4f185d0aeeba8d', 'authors': ['Tan Sang Nguyen', 'Yi Ru Wang', 'Shailesh Shailesh', 'Gang Yang', 'Jiamo Hu', 'Jianuo Jiang', 'Haoquan Fang', 'Zhongzheng Ren', 'Zhongyi Luo', 'Ian Chong', 'Aaron Tung', 'Santiago Pravisani', 'Minghui Lin', 'Yao Mo', 'Ishneet Singh', 'Benjamin Tee', 'Harold Soh', 'Siddhartha Srinivasa', 'Dieter Fox', 'David Hsu', 'Haoming Song', 'Maxime Ellerbach', 'Thomas Wolf', 'Pepijn Kooijmans', 'Ruijie He', 'Michael Cho', 'Jiafei Duan'], 'affiliations': ['Allen Institute for AI', 'BitRobot', 'Hugging Face', 'National University of Singapore', 'Singapore Embodied AI Centre', 'Stanford University', 'University of North Carolina at Chapel Hill', 'University of Oxford', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2611.02497.jpg', 'data': {'categories': ['#games', '#optimization', '#agents', '#training', '#survey', '#benchmark', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Распределённая физическая оценка роботов выявляет то, что не видно в симуляции', 'desc': 'В статье представлен RoboColosseum — распределённая платформа для оценки универсальных роботизированных политик (robot policies) на разных роботах и в разных средах. Исследование охватывает пять VLA-моделей и три AI-агента на четырёх платформах, сравнивая их в режиме Open Track (без дообучения, попарные слепые тесты) и в режиме Fine-tune (100 демонстраций на задачу). Результаты показывают слабую согласованность рейтингов между роботами (Kendall W = 0.24), низкую надёжность в открытых средах и существенные расхождения между zero-shot и дообученными моделями. Авторы также показывают, что метрика частичного прогресса и адаптивный подбор пар (active matchmaking) позволяют получать стабильные оценки меньшим числом физических испытаний.'}, 'en': {'title': 'Test Robot Policies Across Bodies, Not Just Benchmarks', 'desc': 'RoboColosseum is a distributed framework for evaluating robot policies on different robots and in real-world environments. It compares vision-language-action policies and AI agents both without task-specific training and after fine-tuning on the same demonstrations. Results show that rankings vary across robot types, and success without fine-tuning does not reliably predict performance after fine-tuning. Measuring partial task progress and using active matchmaking can reveal useful differences while reducing the number of physical trials.'}, 'zh': {'title': '跨机器人实测，揭示策略泛化与适应的真实边界', 'desc': '本文提出 RoboColosseum，这是一个分布式评测框架，用统一的策略服务和标准化流程，在多种机器人及真实环境中评估通用机器人策略。研究比较了视觉-语言-动作（VLA）策略与前沿 AI 智能体，发现它们在开放环境任务中的可靠性都有限，不同机器人上的表现排名也只有较弱的一致性。使用每项任务 100 个示范进行微调后，表现最佳的策略会因机器人类型而异，而且零样本评测的排名难以预测微调后的表现。研究还表明，衡量任务完成进度能补充单纯的成功率；主动匹配也能用更少的实体试验获得相近的排名稳定性。'}}}, {'id': 'https://huggingface.co/papers/2611.02501', 'title': 'SpecPilot: Autonomous Algorithm Discovery and Systems Optimization for Speculative Decoding', 'url': 'https://huggingface.co/papers/2611.02501', 'abstract': "Abstract SpecPilot autonomously discovers deployment-specific algorithms and system optimizations to maximize speculative decoding speedups across diverse models, drafters, and serving regimes without quality loss.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates memory-bound LLM decoding with a lightweight drafter, and parallel drafters extend this speedup by drafting a whole block in one forward pass. However, it remains unclear whether their released systems (stock) attain the full speedup that parallel drafting permits. We identify three challenges. First, with one request, each step accepts few tokens but reads every target weight. Second, with batching, per-request verification work roughly halves the speedup over autoregressive (AR) decoding. Third, speculative decoding is deployment-specific, and no universal optimization fits every serving regime, drafter, target model and GPU. To address these challenges, we present SpecPilot, an autonomous agentic loop that discovers algorithms and systems optimizations for each deployment. In each round, a cost model locates the largest gaps between the current system and its ceiling. Parallel agents explore directions and integrate the successful ones. Token forcing checks every output token against stock to detect reward hacking. A structured memory carries validated mechanisms to new rounds and deployments. SpecPilot discovered a general lossless 12-bit weight format, tree verification for hybrid recurrent targets, two-level verification and three batching mechanisms. We evaluate it across four target models, three drafters, two GPU platforms and five benchmarks. Without training or quality loss, it raises the speedup over AR from stock's 4.46times to 10.87times with one request, and from 1.94times to 3.93times with batching.", 'score': 10, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '2a65163c417bc864', 'authors': ['Kunjun Li', 'Wenhao Chai', 'Yihao Liang', 'Yuezhou Hu', 'Shuyao Xu', 'Yi Pan', 'William X. Zheng', 'Kannan Ramchandran', 'Kurt Keutzer', 'Jiantao Jiao'], 'affiliations': ['NVIDIA', 'Princeton University', 'Stanford University', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2611.02501.jpg', 'data': {'categories': ['#agents', '#inference', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Автопилот, который сам находит самый быстрый путь декодирования LLM без потери качества', 'desc': 'Статья представляет SpecPilot — автономный агентный цикл, который сам находит алгоритмические и системные оптимизации для спекулятивного декодирования LLM под конкретное развёртывание. Авторы выделяют три проблемы: при одном запросе каждый шаг принимает мало токенов, при батчинге проверка снижает ускорение почти вдвое, а оптимальные решения зависят от модели, драфтера и GPU. Система использует cost model для поиска самых больших разрывов с теоретическим пределом, параллельных агентов, token forcing для защиты от reward hacking и структурированную память. Без обучения и потери качества SpecPilot повышает ускорение относительно AR с 4.46x до 10.87x при одном запросе и с 1.94x до 3.93x при батчинге.'}, 'en': {'title': 'Let Each Deployment Discover Its Fastest Speculative Decoding', 'desc': 'Speculative decoding speeds up language model generation by using a small drafter to propose tokens that a larger target model checks. Existing systems often fall short of their potential, especially for single requests and batched serving, and the best optimizations vary across models, drafters, and GPUs. SpecPilot uses an autonomous search loop: a cost model identifies bottlenecks, agents test optimizations, and token-by-token checks ensure outputs stay identical to the stock system. Across several models and hardware setups, it finds lossless optimizations that increase speedup over standard autoregressive decoding from 4.46× to 10.87× for one request, and from 1.94× to 3.93× with batching.'}, 'zh': {'title': '让投机解码因部署而优化，把速度潜力变成实际加速', 'desc': '投机解码用轻量草稿模型先生成候选 token，再由目标模型验证，从而加快大语言模型的生成。论文指出，现有并行投机解码系统在单请求和批处理场景中都未充分发挥潜在加速，而且最佳优化取决于模型、草稿器、GPU 和服务方式。SpecPilot 是一个自主优化框架：它用成本模型找出性能差距，让多个代理探索优化，并通过逐 token 对照确保输出与原系统一致。它发现了多种无损算法与系统优化，使相对自回归解码的加速比从单请求的 4.46 倍提升至 10.87 倍、从批处理的 1.94 倍提升至 3.93 倍。'}}}, {'id': 'https://huggingface.co/papers/2611.02737', 'title': 'MoviEdit: Long-form Multi-Shot Video Editing Made Easy', 'url': 'https://huggingface.co/papers/2611.02737', 'abstract': 'Abstract MoviEdit is an end-to-end framework for long-form multi-shot video editing that uses cascaded bidirectional-autoregressive modeling and a new benchmark to maintain coherence across scenes while reducing manual data annotation.  Generated by thinkingmachines/Inkling-Small Long-form multi-shot video editing requires an intended edit to remain coherent across abrupt changes in scene, viewpoint, and subject appearance, while processing substantially longer visual context than conventional single-shot editors. We introduce MoviEdit, an end-to-end framework for scalable long-form multi-shot video editing that jointly addresses the challenges of data, modeling, and evaluation. To provide cross-shot supervision data at scale, we develop automatic data-generation pipelines spanning synchronized multi-view footage, real-world multi-shot videos, and generated multi-shot content, yielding 87K paired editing videos without manual annotation. Architecturally, MoviEdit employs a cascaded bidirectional-autoregressive design: a lightweight bidirectional stage first establishes a globally coherent editing draft over a spatiotemporally compressed representation, which is then autoregressively propagated and refined over the full video. We further introduce MoviEdit-Bench, a dedicated benchmark for systematic evaluation of long-form multi-shot video editing. Extensive experiments show that MoviEdit substantially outperforms existing open-source models and performs on par with industry frontier models across text-guided and image-guided editing. Visit our project page for complete results and to access the benchmark: https://multi-shot-edit.github.io/', 'score': 8, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '453f52284d1f881b', 'authors': ['Suhyeon Lee', 'Zhengang Li', 'Soo Ye Kim', 'Peihao Zhu', 'Jong Chul Ye', 'Chun-Hao Paul Huang', 'Duygu Ceylan', 'Yan Kang', 'Hyeonho Jeong'], 'affiliations': ['Adobe', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2611.02737.jpg', 'data': {'categories': ['#data', '#synthetic', '#architecture', '#video', '#dataset', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Монтаж длинного видео без швов: связность между кадрами без ручной разметки', 'desc': 'Статья представляет MoviEdit — end-to-end фреймворк для монтажа длинных многокадровых видео, который сохраняет связность при смене сцен, ракурсов и внешности персонажей. Авторы автоматически собрали около 87K парных обучающих видео без ручной разметки, используя мультиракурсные записи, реальные многокадровые ролики и сгенерированный контент. Архитектура построена на каскадной схеме: лёгкий bidirectional-этап создаёт глобально согласованный черновик на сжатом спатиотемпоральном представлении, который затем autoregressive-механизм распространяет и уточняет на всё видео. Вместе с фреймворком предложен бенчмарк MoviEdit-Bench, на котором MoviEdit превосходит открытые модели и сравним с индустриальными передовыми решениями в текстово- и изображение-управляемом редактировании.'}, 'en': {'title': 'Edit Every Shot as One Coherent Story', 'desc': 'MoviEdit is an end-to-end framework for editing long videos with multiple shots while keeping scenes visually coherent. It creates 87,000 paired training examples using automated data pipelines, avoiding manual annotation. Its cascaded model first creates a globally coherent draft on a compressed video representation, then autoregressively refines that draft across the full video. The authors also introduce MoviEdit-Bench for evaluation and report results that outperform existing open-source models and match leading industry models on text- and image-guided editing.'}, 'zh': {'title': '先统筹全片，再逐镜精修，让长视频编辑连贯如一', 'desc': 'MoviEdit 是一个端到端框架，用于编辑较长、包含多个镜头的视频，并帮助不同场景之间保持连贯。研究者通过自动化流程制作了 8.7 万组配对编辑视频，无需人工标注。模型先用双向处理建立整体连贯的编辑草稿，再通过自回归生成逐步处理和细化完整视频。研究还提出了 MoviEdit-Bench 评测基准；实验显示，该方法优于现有开源模型，效果可与领先的工业界模型相当。'}}}, {'id': 'https://huggingface.co/papers/2611.04870', 'title': 'PrimeSim: A Generalist World Model Simulator from Large-Scale Cross-Embodiment Demonstrations', 'url': 'https://huggingface.co/papers/2611.04870', 'abstract': 'Abstract PrimeSim is an action-conditioned multiview world model that uses progressive training, unified action representations, view-aware attention, and hierarchical memory to enable consistent, long-horizon robot simulation and policy optimization.  Generated by thinkingmachines/Inkling-Small A robot world model that serves as a simulator must do more than generate plausible videos: it must faithfully follow commanded actions, maintain consistency across camera views, and sustain coherent long-horizon rollouts. We present PrimeSim, an action-conditioned, multiview world model simulator that addresses these challenges through progressive midtraining and posttraining. Starting from a pretrained video generator, we midtrain on 30,110 hours of robot demonstrations spanning 22 platforms. To improve action following, we introduce a unified cross-embodiment action representation and frame-aligned dual-path conditioning to strengthen action-frame correspondence. To maintain multiview consistency, we develop view-aware interleaved attention with explicit camera identities, enabling cross-view information exchange while preserving view-specific representations. We further introduce a fast-video, slow-memory posttraining framework that transforms the bidirectional video generator into an efficient autoregressive simulator. By combining fast causal generation, self-rollout training, and hierarchical temporal memory, PrimeSim mitigates error accumulation from self-generated histories and supports coherent long-horizon simulation. PrimeSim runs at 10.1 FPS, remains stable over long-horizon rollouts on rigid and deformable manipulation tasks, and transfers to held-out platforms within 100 to 200 gradient steps where the pretrained backbone does not. Against five open-source action-conditioned world models it leads four of the five WorldSimProbe suites and posts the best overall EWMBench score, while fine-grained local calibration still trails the field; its rollouts are faithful enough to support GRPO-based policy optimization. We release the model weights, inference code, and training code.', 'score': 7, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'b75586385aae33d8', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#synthetic', '#cv', '#architecture', '#rl', '#optimization', '#video', '#training', '#benchmark', '#long_context', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Робот учится в симуляции, которой можно доверять', 'desc': 'В статье представлена PrimeSim — мультивью world model-симулятор роботов, управляемый действиями (action-conditioned), который обучается на 30 110 часах демонстраций с 22 платформ. Для точного следования командам используются унифицированное кроссэмбодимент-представление действий и dual-path условие, а для согласованности между камерами — view-aware interleaved attention с явными идентификаторами камер. Посттренировка по схеме fast-video, slow-memory превращает двунаправленный генератор в эффективный autoregressive-симулятор, который работает со скоростью 10.1 FPS и сохраняет стабильность на длинных горизонтах благодаря иерархической временной памяти. Модель обходит пять открытых аналогов по большинству тестов и поддерживает GRPO-оптимизацию политик.'}, 'en': {'title': 'A Robot Simulator That Follows Actions and Stays Consistent', 'desc': 'PrimeSim is an action-conditioned world model that simulates robot behavior consistently across camera views and over long time periods. It improves action following with a shared representation for different robot platforms and frame-aligned action conditioning, while view-aware attention helps keep camera views consistent. Its fast-video, slow-memory training combines autoregressive generation, self-rollout training, and hierarchical temporal memory to reduce errors that build up during long simulations. PrimeSim performs well on several benchmarks, transfers to new platforms with limited training, and produces rollouts useful for GRPO-based policy optimization, though fine-grained local calibration remains a weakness.'}, 'zh': {'title': '让机器人世界模型听从动作指令，稳定推演更长未来', 'desc': 'PrimeSim 是一种受动作条件控制的多视角世界模型，旨在生成能忠实执行机器人指令、保持不同摄像机视角一致，并支持长时间推演的模拟。它通过渐进式训练学习机器人演示数据，并采用统一的跨机器人动作表示和帧对齐的双路径条件机制，加强动作与视频帧之间的对应关系。为提升多视角一致性和长时稳定性，模型结合视角感知注意力、快速视频生成、层级时间记忆及自我推演训练，减少误差累积。实验显示，PrimeSim 在多项基准测试中表现突出，也能用于基于 GRPO 的策略优化，但细粒度的局部校准仍有改进空间。'}}}, {'id': 'https://huggingface.co/papers/2611.04035', 'title': 'Recursa: Toward Recursively Self-Improving Foundation Model Systems', 'url': 'https://huggingface.co/papers/2611.04035', 'abstract': "Abstract Recursa is a self-improving foundation model system that adapts to new domains by recursively learning from its own experience, storing skills and reflections in a knowledge repository, and validating improvements without human supervision or stronger teachers.  Generated by thinkingmachines/Inkling-Small Foundation models in changing environments can encounter unfamiliar domain knowledge that their original training did not cover. However, new domains rarely provide large amounts of expert-created training data or reliable supervisory signals for further training. We introduce Recursa, a foundation model system that adapts to new domains by learning from its own experience without human experts or a stronger teacher model. Recursa uses a knowledge repository to store what it learns: domain-specific skills and instructions on when to apply them, along with memories of past task experiences and reflections on what to improve. Recursa bootstraps the repository from domain materials and then refines it through recursive self-improvement. It uses parallel learners to execute tasks and synthesize local improvements, then validates and merges the improvements into the knowledge repository. On Harvey LAB's Firm Knowledge benchmark, Recursa raises the all-pass rate on held-out test tasks from 30.0% to 55.0% with DeepSeek-V4.1-Flash and from 35.0% to 46.0% with Qwen3.8-Flash.", 'score': 7, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': 'ad466bb6a929f87a', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#data', '#reasoning', '#optimization', '#agents', '#training', '#benchmark'], 'emoji': '🔁', 'ru': {'title': 'Модель, которая учится на собственном опыте, без учителя и людей', 'desc': 'Статья представляет Recursa — систему на основе foundation model, которая адаптируется к новым предметным областям без участия человека-эксперта и более сильной модели-учителя. Модель хранит полученные навыки, инструкции и рефлексии в репозитории знаний и рекурсивно улучшает его через параллельных learners, которые выполняют задачи и предлагают локальные улучшения. Улучшения проверяются и объединяются в репозиторий, что позволяет самосовершенствоваться на основе собственного опыта. На бенчмарке Harvey LAB Firm Knowledge доля полностью успешных held-out задач выросла с 30% до 55% для DeepSeek-V4.1-Flash и с 35% до 46% для Qwen3.8-Flash.'}, 'en': {'title': 'Learn from experience, improve without a teacher', 'desc': 'Recursa helps foundation models adapt to unfamiliar domains without human experts or a stronger teacher model. It stores domain skills, guidance on when to use them, and reflections on past tasks in a knowledge repository. Parallel learners propose improvements through experience, which the system validates before adding them to the repository. On a firm-knowledge benchmark, Recursa improved the models’ all-pass rates on held-out tasks.'}, 'zh': {'title': '让模型从经验中学习，在新领域持续进步', 'desc': 'Recursa 是一种能在新领域中持续自我改进的基础模型系统，不需要人工专家或更强的教师模型。它把领域技能、使用说明、任务经历和改进反思存入知识库，并先利用领域材料建立知识库。系统让多个学习器并行完成任务、总结改进，再验证这些改进并合并到知识库中。实验显示，在 Harvey LAB 的 Firm Knowledge 基准上，Recursa 提高了测试任务的全通过率。'}}}, {'id': 'https://huggingface.co/papers/2611.02079', 'title': 'ParetoSaddler: Pareto-Guided Optimization of Agent Harnesses for Quality and Cost', 'url': 'https://huggingface.co/papers/2611.02079', 'abstract': 'Abstract ParetoSaddler improves LLM agent harnesses by separately promoting intermediate candidates via Bayesian bootstrap Pareto support and selecting final deployments, boosting quality while reducing cost.  Generated by thinkingmachines/Inkling-Small Harness optimization can substantially improve LLM agents without modifying model weights, but existing methods primarily optimize response quality. Extending them to joint quality--cost optimization introduces a challenge: applying the deployment preference during intermediate updates can prematurely reject candidates that are valuable for later improvements. We introduce ParetoSaddler, which addresses this mismatch by separating intermediate candidate promotion from final deployment selection. At each iteration, an optimizer updates a parent harness to produce a candidate, and then compares the two over repeated executions and uses Bayesian bootstrap Pareto support to promote candidates showing credible progress in either quality or cost. Promoted candidates receive broader development evaluation and remain available as parents for later optimization steps. We evaluate ParetoSaddler on ClawMark and GAIA2 using domain-disjoint splits. On ClawMark, ParetoSaddler improves quality from 70.86\\% to 81.35\\% while reducing cost from \\1.17 to 1.01 per task; on GAIA2, it improves quality from 56.22\\% to 62.89\\% while reducing cost from \\0.78 to 0.45 per task. The Pareto-selected harnesses also achieve higher quality at lower cost than quality-only harness optimization. Analysis shows that Pareto-aware optimization retains intermediate candidates that would be discarded by deployment preference but can support later improvements, while Bayesian bootstrap screening filters out candidates whose gains are weakly supported across runs.', 'score': 7, 'issue_id': 3496, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': '0323d34b2ba8737a', 'authors': ['Xingzhi Qian', 'Sungho Park', 'Rongyuan Tan', 'Jianbo Yu', 'Jue Zhang', 'Lorenzo Cavallaro', 'Menglin Xia', 'Yanzhi Chen', 'Xinnuo Xu', 'Yu Kang', 'Xinran Zheng', 'Gagan Somashekar', 'Xuchao Zhang', 'Chetan Bansal', 'Qingwei Lin', 'Victor Rühle'], 'affiliations': ['Microsoft', 'Mohamed bin Zayed University of Artificial Intelligence', 'Pohang University of Science and Technology', 'Southeast University', 'Southern University of Science and Technology', 'University College London'], 'pdf_title_img': 'assets/pdf/title_img/2611.02079.jpg', 'data': {'categories': ['#alignment', '#optimization', '#agents', '#training', '#benchmark'], 'emoji': '⚖️', 'ru': {'title': 'Оптимизируем агентов по качеству и цене, не теряя перспективных кандидатов', 'desc': 'В статье предлагается метод ParetoSaddler для оптимизации harness у LLM-агентов без изменения весов модели, который одновременно улучшает качество ответов и снижает стоимость. Ключевая идея: промежуточных кандидатов продвигают по Парето-фронту с помощью Bayesian bootstrap, а итоговый выбор конфигурации делают отдельно. Такое разделение позволяет не отбрасывать перспективные варианты, которые могут дать улучшения на следующих итерациях. Эксперименты на ClawMark и GAIA2 показывают рост качества и заметное снижение стоимости по сравнению с оптимизацией только по качеству.'}, 'en': {'title': 'Keep promising candidates; deliver better, cheaper agents', 'desc': 'ParetoSaddler improves LLM agents by optimizing their harnesses without changing model weights. It separates promoting promising intermediate candidates from choosing the final deployment, so candidates are not discarded too early just because they do not yet match deployment preferences. Bayesian bootstrap Pareto support checks repeated runs to identify candidates with credible gains in quality or cost. Tests on ClawMark and GAIA2 show that it improves quality while reducing cost compared with existing optimization approaches.'}, 'zh': {'title': '质量与成本兼顾，让有潜力的候选走得更远', 'desc': '这篇论文提出 ParetoSaddler，用来改进大语言模型智能体的运行框架，而不需要修改模型权重。它把中间候选框架的晋级与最终部署选择分开，避免候选方案因为当前偏好的质量或成本而过早被淘汰。系统通过多次运行和贝叶斯自助法估计帕累托优势支持度，晋级在质量或成本上有可信进步的候选方案。实验显示，该方法在 ClawMark 和 GAIA2 上都提高了任务质量并降低了成本。'}}}, {'id': 'https://huggingface.co/papers/2611.02244', 'title': 'Can AI Reviewers See Your Efforts to Improve Your Paper? A Large-Scale Study of Paper Revision Trajectories', 'url': 'https://huggingface.co/papers/2611.02244', 'abstract': 'Abstract AI reviewers often fail to reflect manuscript improvements in scores, with user opinions frequently overriding observed revision gains.  Generated by thinkingmachines/Inkling-Small AI reviewers are increasingly used to assess scientific manuscripts, yet it remains unclear whether their judgments reflect the improvements authors make through revision. We investigate this question using PaperTrajectory-2026, the 2026 release of PaperTrajectory, a dataset of 6,959 paper trajectories across five AI conferences, with automatic annotations of changes along 14 dimensions and separate judgments of overall quality. The annotations show that major improvements emphasize empirical evidence and framing, while later revisions tend toward incremental improvement. Using independent assessments of manuscript versions from eight AI reviewers, we examine whether annotated major improvements receive higher scores, which revision dimensions are associated with score changes, and whether user opinions can outweigh observed revision gains. Every reviewer leaves scores unchanged on most major improvements, and agreement on the direction of score changes is weak. Revision dimensions show some reviewer-specific associations with score increases, but provide limited predictive discrimination and no consistent guide across reviewers. Even when a revision earns a higher neutral score, a brief negative user opinion can erase or reverse that advantage, with substantial variation across reviewers. These findings show that substantive revisions are not consistently reflected in review scores and that observed scoring gains can be vulnerable to user framing, motivating assessments that connect manuscript evidence to overall judgments and remain stable when no scientific evidence changes.', 'score': 3, 'issue_id': 3496, 'pub_date': '2026-11-01', 'pub_date_card': {'ru': '1 ноября', 'en': 'November 1', 'zh': '11月1日'}, 'hash': 'b78f7f898810117f', 'authors': ['Yaochen Wang', 'Chenguang Wang', 'Ming Li', 'Haomin Zhuang', 'Xinyue Zeng', 'Han Chen', 'Kwesi Adu Cobbina', 'Dang Nguyen', 'Dianqi Li', 'Dawei Zhou', 'Tianyi Zhou'], 'affiliations': ['MBZUAI', 'University of Maryland', 'University of Notre Dame', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2611.02244.jpg', 'data': {'categories': ['#alignment', '#science', '#dataset', '#agents', '#benchmark', '#ethics'], 'emoji': '🧠', 'ru': {'title': 'AI-рецензенты не всегда замечают реальные улучшения статей', 'desc': 'Авторы изучают, отражают ли AI-рецензенты (LLM-ревьюеры) реальные улучшения научных статей при их доработке. Для анализа используется датасет PaperTrajectory-2026 из 6 959 траекторий правок статей с конференций по AI, где изменения размечены по 14 измерениям. Оказалось, что большинство значимых улучшений не приводит к росту оценок, а направление изменения баллов согласуется между рецензентами слабо. Кроме того, краткий негативный отзыв пользователя может полностью сводить на нет преимущество улучшенной версии, что показывает уязвимость оценок к формулировкам.'}, 'en': {'title': 'Better revisions deserve evidence-based, stable scores', 'desc': 'This study examines whether AI reviewers give higher scores when scientific manuscripts improve. Using PaperTrajectory-2026, researchers analyzed 6,959 paper histories and independent evaluations from eight AI reviewers. Reviewers often did not change scores after major improvements, and revision features only weakly predicted score changes across reviewers. Negative user opinions could erase or reverse score gains, suggesting that reviews should better connect evidence in the manuscript to overall judgments and resist framing effects.'}, 'zh': {'title': '让评审评分跟上论文改进，不被主观意见左右', 'desc': '本文研究 AI 评审是否会在论文修改后，依据实际改进调整评分。研究使用涵盖五个 AI 会议、共 6,959 条论文修改轨迹的数据集，并分析 8 个 AI 评审对不同版本的独立评分。结果显示，评审通常不会因重大改进而改变分数，且修改内容与分数变化之间缺乏稳定、可预测的关系。即使中立评分有所提高，简短的负面用户意见也可能抵消甚至逆转这一优势，说明评审需要更紧密地将论文证据与总体判断关联起来，并避免受无关意见影响。'}}}, {'id': 'https://huggingface.co/papers/2611.03685', 'title': 'LOLPlay: Benchmarking Real-Time Visual Agents in League of Legends', 'url': 'https://huggingface.co/papers/2611.03685', 'abstract': 'Abstract LOLPlay evaluates visual agents on real-time League of Legends tasks, finding that increased reasoning effort does not improve success and can reduce interaction time.  Generated by thinkingmachines/Inkling-Small Visual agents need to coordinate reasoning and action while their environment evolves during inference. We introduce LOLPlay, a benchmark in native League of Legends with 36 champion-specific tasks spanning resource management, combat, cooperation, and objectives. Agents interact through screenshots and mouse--keyboard actions; automated initialization and 82 executable subgoal checks distinguish partial progress from completion. Across 324 task evaluations of three models at three reasoning-effort settings, GPT-6 Astra achieves the highest task success rate of 25.0\\% at low and medium effort, and the highest subgoal success rate of 40.3\\% at medium effort. However, high effort improves neither metric over low effort for any model. For Astra, longer requests leave fewer interaction rounds, suggesting a cost to additional reasoning in real-time control. Trajectories reveal incomplete subgoal composition and actions executing after the observed scene changes, motivating agents that combine visual reasoning with timely action.', 'score': 2, 'issue_id': 3496, 'pub_date': '2026-10-25', 'pub_date_card': {'ru': '25 октября', 'en': 'October 25', 'zh': '10月25日'}, 'hash': '377646c7717d3b8a', 'pdf_title_img': 'assets/pdf/title_img/2611.03685.jpg', 'data': {'categories': ['#cv', '#games', '#reasoning', '#multimodal', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'В реальном времени побеждает не тот, кто думает дольше, а тот, кто вовремя действует', 'desc': 'Статья представляет LOLPlay — бенчмарк для оценки визуальных агентов в реальном времени на базе игры League of Legends. Агенты взаимодействуют с игрой через скриншоты и действия мышью и клавиатурой, а 36 задач, связанных с конкретными чемпионами, проверяются с помощью 82 исполняемых проверок промежуточных подцелей. Эксперименты с тремя моделями при трёх уровнях reasoning effort показали, что лучшая модель GPT-6 Astra достигает наибольшей успешности при низком и среднем уровне усилий, а высокий уровень не улучшает результат. Авторы объясняют это тем, что дополнительные рассуждения сокращают число раундов взаимодействия, поэтому важно сочетать визуальный анализ с быстрыми и своевременными действиями.'}, 'en': {'title': 'Think Fast, Act in Time', 'desc': 'The paper introduces LOLPlay, a benchmark for testing visual agents on real-time League of Legends tasks. Agents use screenshots and mouse-and-keyboard actions to complete 36 tasks covering resource management, combat, cooperation, and objectives. In tests of three models, higher reasoning effort did not improve task or subgoal success, and longer reasoning requests sometimes left less time for interaction. The results point to a need for agents that combine visual reasoning with timely actions and reliably complete sequences of subgoals.'}, 'zh': {'title': '实时游戏中，推理不如及时行动', 'desc': '本文提出 LOLPlay，这是一个基于《英雄联盟》的视觉智能体基准，包含 36 项英雄专属任务，涵盖资源管理、战斗、协作和目标争夺。智能体通过游戏截图观察环境，并用鼠标和键盘执行操作；基准还利用自动化初始化和 82 项可执行子目标检查，区分部分进展与任务完成。实验发现，增加推理力度并未提升任何模型的任务成功率，反而可能减少实时交互轮次；其中 GPT-6 Astra 在低、中推理力度下的任务成功率最高，为 25.0%，在中等力度下的子目标成功率最高，为 40.3%。结果表明，实时视觉控制需要更好地协调视觉推理与及时行动，并提升子目标组合能力，避免环境变化后仍执行过时操作。'}}}, {'id': 'https://huggingface.co/papers/2610.40747', 'title': 'Mage-VL-Cowork: A Full Training Recipe to Learn Hybrid Computer Use From Evolved Harnesses', 'url': 'https://huggingface.co/papers/2610.40747', 'abstract': 'Abstract Mage-VL-Cowork is a 4B hybrid computer-use agent trained via a progressive curriculum and scalable synthetic data generation, achieving state-of-the-art performance on OSWorld-Verified with efficient reasoning.  Generated by thinkingmachines/Inkling-Small Effective computer-use agents (CUAs) should seamlessly combine visual GUI interaction with code and terminal execution within a single policy. We present Mage-VL-Cowork, a 4B hybrid CUA trained from a general multimodally aligned checkpoint through an end-to-end, progressive five-stage curriculum across midtraining, SFT, and RL. To power this curriculum at scale, Mage-CUA-Forge replaces per-task agent construction with reusable, skill-conditioned generation workflows and application-specific preparers, synthesizing 293,806 desktop and web tasks across 6,915 skills while reducing recurring per-task expenditure by 82.6%. Rather than directly distilling a default teacher, we evolve the teacher harness and instantiate specialized CUA harnesses to yield high-quality trajectories alongside stage-specific supervision. Mage-VL-Cowork-4B finally climbs to 66.0% on OSWorld-Verified through different training stages with more efficient reasoning cost, achieving state-of-the-art performance at its parameter size and pushing forward the frontier of on-device intelligence.', 'score': 2, 'issue_id': 3496, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'e91ad6efb3af9c87', 'authors': ['Xiaoyi Zhang', 'Haoqing Wang', 'Xinjie Zhang', 'Xiang Ming', 'Xing Wang', 'Senqiao Yang', 'Kaichen Zhang', 'Zhaoyang Jia', 'Andong Tan', 'Xinjiang Wang', 'Jinghao Guo', 'Yifei Shen', 'Xiao Li', 'Peng Zhang', 'Xun Guo', 'Jiahao Li', 'Shicheng Zheng', 'Jinglu Wang', 'Zongyu Guo', 'Wenxuan Xie', 'Bin Li', 'Yan Lu'], 'affiliations': ['Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2610.40747.jpg', 'data': {'categories': ['#data', '#synthetic', '#small_models', '#rl', '#optimization', '#dataset', '#multimodal', '#agents', '#training', '#benchmark'], 'emoji': '🖥️', 'ru': {'title': 'Компактный агент, который работает с компьютером как человек, и без лишних затрат', 'desc': 'Статья представляет Mage-VL-Cowork, компактного гибридного computer-use agent (CUA) с 4 млрд параметров, который объединяет визуальное взаимодействие с GUI и выполнение кода и терминальных команд в одной политике. Модель обучается через прогрессивный пятиэтапный curriculum (midtraining, SFT и RL) на синтетических данных, которые генерирует фреймворк Mage-CUA-Forge на основе переиспользуемых skill-conditioned workflow. Авторы эволюционируют teacher harness и создают специализированные harness для получения качественных траекторий вместо прямой дистилляции одного учителя. Итог: 66.0% на OSWorld-Verified при меньших затратах на reasoning и state-of-the-art результат для своего размера.'}, 'en': {'title': 'A Small Agent, Trained to Master the Desktop', 'desc': 'Mage-VL-Cowork is a 4B-parameter agent that uses visual interaction, code, and terminal commands to operate computers. It is trained through a five-stage curriculum combining midtraining, supervised fine-tuning (SFT), and reinforcement learning (RL). Its data-generation system creates nearly 294,000 tasks across 6,915 skills, while reducing repeated task-generation costs by 82.6%. The model reaches 66.0% on OSWorld-Verified, achieving state-of-the-art performance for its size with efficient reasoning.'}, 'zh': {'title': '小模型也能高效操作电脑：渐进训练与规模化合成数据带来新突破', 'desc': 'Mage-VL-Cowork 是一个拥有 40 亿参数的电脑操作智能体，能在同一套策略中结合屏幕视觉、图形界面操作、代码和终端执行。研究团队采用由易到难的五阶段训练课程，并设计可重复使用的数据生成流程，合成了覆盖 6,915 项技能的近 30 万个桌面与网页任务，同时降低了数据制作成本。团队还逐步改进教师智能体和任务执行框架，以生成高质量训练轨迹和适合各阶段的监督信号。该模型在 OSWorld-Verified 上取得 66.0% 的成绩，在同等参数规模中达到领先表现，并以较低推理成本推动端侧智能发展。'}}}, {'id': 'https://huggingface.co/papers/2611.04449', 'title': 'Near-Zero Token Embeddings Silently Stall Training in Gated Sequence Models', 'url': 'https://huggingface.co/papers/2611.04449', 'abstract': "Abstract Near-zero input embeddings in untied gated language models cause extreme gradient amplification and training instability, which is addressed by GroupClip and GateFloor remedies.  Generated by thinkingmachines/Inkling-Small Among 291 surveyed open-weight language model repositories (280 distinct embedding tables), 52.6% of untied gated and hybrid checkpoints (20/38) contain reachable input embeddings with norms below 10^{-6}, compared with 0% of weight-tied models. Such near-zero rows can arise during pretraining when unseen rare or template tokens receive zero input gradients while AdamW weight decay shrinks untied embeddings. In tested Transformer configurations, non-initial positions or a BOS token prevent this failure mode. In gated sequence models (Mamba, Gated DeltaNet, xLSTM), a near-zero token can amplify input-embedding gradients by more than 30 orders of magnitude (up to 35). At zero input, current-token readout factors (SiLU gates or linear queries) vanish, suppressing historical-state readout. Residual RMS values can then fall below the square root of the RMSNorm floor across consecutive layers, causing Pre-RMSNorm to amplify backward gradients by up to 10^3 per layer. When a gradient entry exceeds 1.84 times 10^{19}, FP32 global-norm clipping in PyTorch, Hugging Face Trainer, and FSDP2 can overflow to infinity and zero the current batch's gradients. In Telugu continual pretraining of Nemotron-3-Nano-4B, this discards updates on approximately 20% of steps and leaves triggered rows frozen. We propose two remedies. For released checkpoints, GroupClip decouples input-embedding clipping using a 64-bit or rescaled norm; its rescaled implementation eliminates update loss and heals triggered rows in one step with negligible measured end-to-end overhead. For pretraining, GateFloor (SiLU(z) + δ, δin [0.01, 0.1]) keeps the gate positive at zero input, reducing near-zero gradients by 28 orders of magnitude in experiments up to 370M parameters, with perplexity comparable to the baseline.", 'score': 1, 'issue_id': 3496, 'pub_date': '2026-11-03', 'pub_date_card': {'ru': '3 ноября', 'en': 'November 3', 'zh': '11月3日'}, 'hash': 'd858a3ba56d45a46', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#architecture', '#low_resource', '#small_models', '#optimization', '#training'], 'emoji': '🧊', 'ru': {'title': 'Почти нулевой эмбеддинг взрывает градиенты, а GateFloor не даёт ему замёрзнуть', 'desc': 'Авторы показывают, что в языковых моделях с untied и gated архитектурами (Mamba, Gated DeltaNet, xLSTM) эмбеддинги отдельных токенов могут схлопываться почти в ноль, из-за чего градиенты взрываются и обрезка градиентов (gradient clipping) обнуляет обновления весов. Причиной служит комбинация отсутствия обучения редких токенов и AdamW weight decay, а также обнуление gate-факторов при нулевом входе. Для уже обученных моделей предлагается GroupClip, раздельная обрезка градиентов эмбеддингов с 64-битной или масштабированной нормой, а для предобучения GateFloor, добавляющий δ к SiLU, что сохраняет градиенты ненулевыми. Эксперименты до 370M параметров показывают снижение почти нулевых градиентов без ухудшения перплексии.'}, 'en': {'title': 'Stop Tiny Embeddings from Derailing Gated Model Training', 'desc': 'The paper finds that untied gated language models can develop near-zero input embeddings, especially for rare or template tokens that receive no input gradients while weight decay shrinks their embeddings. In gated models, these embeddings can suppress readout of historical states and trigger large gradient amplification through Pre-RMSNorm, sometimes causing FP32 gradient clipping to overflow and discard training updates. GroupClip prevents this for released checkpoints by clipping embedding gradients with a numerically safe norm, while GateFloor keeps gate values positive near zero during pretraining. Experiments show both remedies reduce the failure, with GroupClip restoring updates and GateFloor greatly reducing gradient spikes while maintaining comparable perplexity.'}, 'zh': {'title': '稳住门控梯度：从嵌入裁剪到门控加底', 'desc': '本文发现，在不共享输入与输出权重的门控语言模型中，接近零的输入嵌入可能导致梯度放大和训练不稳定。稀有或模板词元若在预训练中没有输入梯度，其嵌入可能被 AdamW 的权重衰减压到接近零；此时门控序列模型中的历史状态读取会受到抑制，RMSNorm 还可能进一步放大反向梯度。梯度过大时，FP32 全局范数裁剪可能溢出并把当前批次的梯度清零，导致更新丢失。作者提出 GroupClip 以更稳健地裁剪已发布模型的输入嵌入梯度，并提出 GateFloor 为门控函数添加正偏移，以减少预训练中的梯度爆炸；实验显示这两种方法能缓解问题，且对性能影响很小。'}}}, {'id': 'https://huggingface.co/papers/2610.39251', 'title': 'Where to Learn and How Far to Roll Out: Efficient Adaptive Training for GUI Agents', 'url': 'https://huggingface.co/papers/2610.39251', 'abstract': 'Abstract A two-stage adaptive framework improves multi-step GUI agent training by using intermediate checkpoints and selective rollout ranges to reduce environment interactions while boosting performance.  Generated by thinkingmachines/Inkling-Small Trajectory-level GRPO is a common approach for training multi-step GUI agents, but repeatedly rolling out complete trajectories from the task root can be inefficient: task-level rewards provide coarse supervision over which intermediate decisions require improvement, while already-mastered prefixes are repeatedly re-executed before reaching difficult states. We introduce a two-stage adaptive training framework that jointly addresses where to learn and how far to roll out. We first construct reusable intermediate checkpoints from successful expert trajectories and select informative pivots using action disagreement, which measures uncertainty directly from sampled GUI actions. Stage I performs one-step RL at these pivots to improve uncertain local decisions. Stage II then progressively expands policy responsibility through adaptive Local, Suffix, and Root training according to task progress. Recoverable checkpoints enable repeated training from intermediate states without replaying the preceding trajectory. Across MobileGym and CUA-Gym-Hub, our method reduces environment interaction by 56-61% relative to Vanilla GRPO while improving task performance, demonstrating that jointly allocating training across states and rollout ranges can substantially improve GUI-agent RL efficiency.', 'score': 1, 'issue_id': 3496, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '2c3fa04ff91f1366', 'authors': ['Yuxiang Chai', 'Quyu Kong', 'Panrong Tong', 'Steven Hoi', 'Yue Wang'], 'affiliations': ['Alibaba Token Hub, Alibaba Group', 'MMLab, The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.39251.jpg', 'data': {'categories': ['#reasoning', '#rl', '#optimization', '#agents', '#training'], 'emoji': '🧭', 'ru': {'title': 'Учим агента там, где он ошибается, а не с самого начала', 'desc': 'Статья предлагает двухэтапную адаптивную схему обучения GUI-агентов с помощью RL и алгоритма GRPO. На первом этапе из успешных экспертных траекторий строятся промежуточные чекпоинты, а опорные состояния (pivots) выбираются по метрике action disagreement, отражающей неопределенность действий LLM-агента. На втором этапе глубина развертки постепенно расширяется от Local к Suffix и Root обучению в зависимости от прогресса задачи. Такой подход сокращает число взаимодействий с окружением на 56-61% по сравнению с Vanilla GRPO и при этом повышает качество выполнения задач.'}, 'en': {'title': 'Train at the Hard Parts, Not from the Start', 'desc': 'The paper presents a two-stage method for training GUI agents with fewer environment interactions and better task performance. First, it creates checkpoints from successful expert trajectories and uses disagreement among sampled actions to find uncertain decisions, then improves those decisions with one-step reinforcement learning. Next, it gradually expands training from local actions to suffixes and full tasks as the agent makes progress. On MobileGym and CUA-Gym-Hub, the method uses 56–61% fewer environment interactions than Vanilla GRPO while improving performance.'}, 'zh': {'title': '从关键检查点出发，让 GUI 智能体少走重复路', 'desc': '本文提出一种两阶段自适应训练框架，让多步 GUI 智能体减少重复操作并提升任务表现。首先，框架从成功的专家轨迹中建立可复用的中间检查点，并用动作分歧度衡量不确定性，挑选值得改进的决策点；第一阶段在这些位置进行单步强化学习。第二阶段根据任务进展，自适应地从局部训练扩展到后缀训练和根节点训练，使策略逐步承担更长的轨迹。实验显示，该方法在两个基准上比 Vanilla GRPO 减少 56%–61% 的环境交互，同时提升任务性能。'}}}, {'id': 'https://huggingface.co/papers/2611.02568', 'title': 'SeMo3D: Unifying 3D Generation, Editing, and Completion via Selective Modeling', 'url': 'https://huggingface.co/papers/2611.02568', 'abstract': 'Abstract SeMo3D unifies 3D generation, editing, and completion through selective region modeling, using region-selective denoising and a multi-condition diffusion transformer to preserve unchanged content and enable training without paired data.  Generated by thinkingmachines/Inkling-Small 3D generation, editing, and completion are typically treated as regenerating the complete 3D asset under task-specific constraints, even when only a local region needs modification. This leads to task isolation, inconsistency in content that should remain unchanged, and dependence on task-specific paired data. We address these issues with a key observation: the three tasks all synthesize a designated region while keeping the rest intact---the full region for generation, the target region for editing, and the missing region for completion. We term this paradigm Selective Modeling and build SeMo3D upon it; it naturally unifies the three tasks, preserves unchanged content by construction, and enables training without paired editing or completion data, since any 3D asset can be partitioned into a selected region and its context. For training, we propose region-selective denoising, which randomly selects regions of varying sizes on standard 3D assets and applies noise and loss only to them, jointly learning all three tasks. For architecture, we propose Omni3DiT, a multi-condition 3D diffusion transformer that distinguishes regions to create from those to retain and fuses image, text, and point guidance for fine-grained control. Experiments across three benchmarks show SeMo3D surpasses state-of-the-art methods on all tasks, delivering multimodal controllability in generation and strong consistency and accuracy in editing and completion. SeMo3D further serves as a unified modeling tool for agents, enabling efficient 3D creation through natural-language interaction. Project page: https://xiaokunsun.github.io/SeMo3D.github.io/.', 'score': 1, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '4b7bae8c6a9805e7', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#synthetic', '#3d', '#architecture', '#diffusion', '#multimodal', '#agents', '#training'], 'emoji': '🧊', 'ru': {'title': 'Меняем только нужный регион 3D-объекта, сохраняя остальное', 'desc': 'Статья представляет SeMo3D, единую модель для генерации, редактирования и дополнения 3D-объектов через селективное моделирование только нужной области. Метод использует region-selective denoising, при котором шум и функция потерь применяются лишь к случайно выбранным регионам стандартных 3D-ассетов, что позволяет обучаться без парных данных. Архитектура Omni3DiT, основанная на multi-condition 3D diffusion transformer, различает регионы для создания и сохранения и объединяет условия по изображению, тексту и точкам. Эксперименты показывают превосходство над state-of-the-art методами во всех трёх задачах, а также применимость модели как инструмента для AI-агентов.'}, 'en': {'title': 'Create the region you want—keep everything else intact', 'desc': 'SeMo3D unifies 3D generation, editing, and completion by creating only a selected region while preserving the rest of the asset. Its region-selective denoising trains on ordinary 3D assets by adding noise and computing loss only in randomly selected regions, so paired editing or completion data is not required. The Omni3DiT diffusion transformer separates regions to create from regions to retain and uses image, text, and point-cloud guidance. Experiments show strong results across all three tasks, with controllable generation and consistent, accurate editing and completion.'}, 'zh': {'title': '只改需要的区域，统一 3D 生成、编辑与补全', 'desc': '这篇论文提出 SeMo3D，用一种称为“选择性建模”的方法统一 3D 生成、编辑和补全：只生成指定区域，并保留其余内容。训练时，模型随机选取 3D 资产的不同区域，仅对选中区域加噪并计算损失，因此无需配对的编辑或补全训练数据。其核心架构 Omni3DiT 是多条件扩散 Transformer，能够区分需要创建和保留的区域，并结合图像、文本与点云条件进行控制。实验表明，该方法在三个任务上都优于现有方法，同时保持内容一致性，并支持通过自然语言交互创建 3D 资产。'}}}, {'id': 'https://huggingface.co/papers/2610.00854', 'title': 'Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena', 'url': 'https://huggingface.co/papers/2610.00854', 'abstract': 'Abstract Frontier vision-language models vary widely in embodied task performance, with closed-weight systems leading in planning and manipulation while open-weight models lag, and failure patterns reveal distinct geometric, control, and reasoning errors rather than uniform deficits.  Generated by thinkingmachines/Inkling-Small A robot generalist must interpret a scene, act on it, and satisfy every condition of a task. How far do frontier vision-language models (VLMs) meet these demands? We introduce Embodied Agent Arena, evaluating ten VLM agents across Geometry, Spatial Reasoning, Affordance, Task Planning, and Manipulation. Its 1,000 cases combine 32 established sources with GeoProbe, our 168-case benchmark for camera, motion, depth, and scale estimation. A minimal harness leaves task decisions to the model through source-native interfaces. Closed-weight models lead all five domains, whereas open-weight VLMs show useful spatial reasoning but substantially lower planning and manipulation success. Beneath these averages, similar geometric errors conceal different scale and shape distortions, and valid region estimates need not identify usable action points. During execution, agents can achieve early subgoals yet lose object control, bind an action to the wrong receiving region, or stop before the required physical state holds. Additional computation does not uniformly resolve these failures: code repair can restore execution without completing the task, while self-review can reverse correct judgments. Failure costs also differ: the strongest planners concentrate failed-token expenditure in prolonged body-control tasks, whereas other models fail broadly across procedures. Matched traces show how successful recovery uses feedback to restore a missing prerequisite and advance the remaining task.', 'score': 0, 'issue_id': 3496, 'pub_date': '2026-10-23', 'pub_date_card': {'ru': '23 октября', 'en': 'October 23', 'zh': '10月23日'}, 'hash': '07dd6c60fff8a03d', 'authors': ['Haojian Huang', 'Pukun Zhao', 'Zexi Li', 'Yehang Zhang', 'Yangkai Wei', 'Wenqian Li', 'Han Yang', 'Kaiwen Zhou', 'Ying-Cong Chen', 'Yinchuan Li'], 'affiliations': ['HKUST (GZ)', 'Knowin AI', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2610.00854.jpg', 'data': {'categories': ['#cv', '#reasoning', '#dataset', '#multimodal', '#agents', '#survey', '#benchmark', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Сильные VLM планируют, но спотыкаются на физике: у каждой модели свои слепые зоны', 'desc': 'Авторы представляют Embodied Agent Arena, новый бенчмарк из 1000 кейсов для оценки 10 VLM-агентов в задачах воплощённого ИИ: геометрия, пространственное рассуждение, affordance, планирование задач и манипуляции, включая собственный GeoProbe. Закрытые модели (closed-weight) заметно опережают открытые (open-weight) в планировании и манипуляциях, при этом ошибки имеют разную природу: масштабные и геометрические искажения, потеря контроля над объектом, неверная привязка действия к области. Дополнительные вычисления, такие как исправление кода или self-review, не устраняют ошибки равномерно и иногда ухудшают корректные решения. Анализ показывает, что успешное восстановление после сбоя достигается за счёт использования обратной связи для восстановления пропущенного предусловия.'}, 'en': {'title': 'From Seeing to Doing: Testing the Full Embodied Agent', 'desc': 'The paper introduces Embodied Agent Arena, a benchmark of 1,000 tasks for evaluating vision-language model agents across geometry, spatial reasoning, affordance, planning, and manipulation. Closed-weight models perform best across all five domains, while open-weight models show stronger spatial reasoning than planning and manipulation. The analysis finds distinct failure modes, including inaccurate estimates of scale or shape, choosing unusable action points, losing object control, and stopping before a task is physically complete. More computation does not always help: code repair may fix execution without completing a task, while self-review can undo correct judgments; feedback-based recovery can help agents restore prerequisites and continue.'}, 'zh': {'title': '从看懂场景到完成操作：揭示具身智能体的真实差距', 'desc': '本文提出 Embodied Agent Arena，用 1000 个案例评估 10 种视觉语言模型智能体在几何、空间推理、可供性、任务规划和操作五个领域的表现。评测结果显示，闭源模型整体领先；开源模型虽具备一定空间推理能力，但在规划和操作任务上的成功率明显较低。错误分析发现，模型会出现尺度与形状估计偏差、无法找到可执行的操作点、失去对物体的控制，以及未达到目标状态就停止等问题。增加计算或进行自我检查并不能稳定解决这些问题，而有效的恢复策略会利用反馈补足缺失的前置条件，再继续完成任务。'}}}, {'id': 'https://huggingface.co/papers/2611.03747', 'title': 'Enhancing Stock Market Information Retrieval with Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2611.03747', 'abstract': 'Abstract A retrieval-augmented generation system for stock market queries improves response accuracy and speed, validated by high ROUGE scores and low latency.  Generated by thinkingmachines/Inkling-Small Natural Language Processing (NLP) has been widely applied in financial domains, enabling automated analysis and retrieval of stock market information. However, traditional NLP-based systems often struggle with maintaining contextual accuracy and generating relevant responses in dynamic financial environments. To address these challenges, Retrieval-Augmented Generation (RAG) models have emerged as a powerful solution, combining retrieval-based methods with generative capabilities to enhance response quality. In this study, we present a Retrieval-Augmented Generation (RAG) system designed to generate responses related to stock market information. The system integrates retrieval-based and generative approaches to enhance the accuracy and relevance of financial text generation. To evaluate its effectiveness, we employ the ROUGE metric, specifically ROUGE-1, ROUGE-2, and ROUGE-L, to measure lexical and structural similarity between generated and reference texts. Experimental results on a dataset of 100 stock market-related queries demonstrate high ROUGE scores, indicating strong alignment with reference documents. Additionally, we assess latency to evaluate the system responsiveness, achieving an average response time of 1.16 seconds. These findings confirm that our RAG model is capable of providing accurate and timely stock market insights, making it a promising approach for financial information retrieval.', 'score': 0, 'issue_id': 3496, 'pub_date': '2026-11-02', 'pub_date_card': {'ru': '2 ноября', 'en': 'November 2', 'zh': '11月2日'}, 'hash': '2f4579fc4855d550', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#science', '#rag', '#benchmark'], 'emoji': '📈', 'ru': {'title': 'RAG-система даёт точные и быстрые ответы о фондовом рынке', 'desc': 'Статья описывает RAG-систему (Retrieval-Augmented Generation) для ответов на вопросы о фондовом рынке, которая сочетает поиск релевантных документов с генеративной LLM. Такой подход повышает точность и актуальность ответов по сравнению с традиционными NLP-системами, которые плохо справляются с динамичным финансовым контекстом. Качество оценивалось метриками ROUGE-1, ROUGE-2 и ROUGE-L на 100 запросах и показало высокое лексическое и структурное совпадение с эталонными текстами. Среднее время ответа составило 1.16 секунды, что подтверждает применимость системы для быстрого получения финансовой информации.'}, 'en': {'title': 'Retrieve the facts, generate faster stock market insights', 'desc': 'The paper presents a retrieval-augmented generation (RAG) system for answering stock market questions. It retrieves relevant financial information and uses a language model to generate responses, aiming to improve accuracy and relevance. On 100 queries, the system achieved high ROUGE-1, ROUGE-2, and ROUGE-L scores, showing similarity to reference answers. Its average response time was 1.16 seconds, suggesting it can provide timely financial insights.'}, 'zh': {'title': '检索增强生成，让股票信息回答更准更快', 'desc': '本文提出一种用于回答股票市场问题的检索增强生成（RAG）系统，将信息检索与文本生成结合起来。系统先从相关资料中检索信息，再据此生成回答，以提升内容的准确性和相关性。研究使用100条股票市场问题进行评估，并以ROUGE-1、ROUGE-2和ROUGE-L衡量生成文本与参考文本的相似度。实验显示系统取得较高的ROUGE分数，平均响应时间为1.16秒，表明它能较快地提供贴合资料的市场信息。'}}}];
