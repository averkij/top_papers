    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.01780', 'title': 'RealCompanion: Benchmarking Human Understanding from Reasoning over Longitudinal Real-World Conversations', 'url': 'https://huggingface.co/papers/2610.01780', 'abstract': "Abstract  A companion that talks with a person for months should come to understand them. It should remember what they said, infer who they are, and know when the past bears on the message in front of it. Testing this requires a real person's record, and such records are private, so benchmarks generate the person and the questions and settle in advance what matters. We release \\bench, ten real relationships with an AI companion: 27,218 messages over up to 120 days, released as the conversation and four files derived from it, a profile, a persona, a chat ground truth and a question set, each citing the messages it rests on. Every chat label carries the reasoning trace that produced it, checked stage by stage against the conversation. Three findings follow. First, the past is rarely needed and far away. Pooled measures mislead: a recency window finds the required message for 95.9\\% of probes and 2.2\\% of those that need memory, and at the natural rate 96\\% of the gain from supplying recorded evidence comes from messages that need none. Second, no detector we tried can tell when memory is needed on real messages, authored questions over the same histories leak the cue, and labeling the same messages as memories raises their use by ten to fourteen points. Third, three agent systems reconstruct the persona with the same F1 at a 31-fold difference in cost.", 'score': 249, 'issue_id': 3376, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'afd31709042cb743', 'authors': ['Arman Behnam', 'Sunglyoung Kim', 'Liangwei Yang'], 'affiliations': ['Independent Researcher, USA', 'Quis Lab, USA'], 'pdf_title_img': 'assets/pdf/title_img/2610.01780.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Память в диалоге: когда прошлое имеет значение для понимания пользователя', 'desc': 'В статье представлен датасет реальных диалогов между людьми и AI-помощником, собранный за несколько месяцев общения. Авторы анализируют, насколько хорошо модели могут запоминать информацию о пользователе и использовать контекст из прошлых сообщений для лучшего понимания. Исследование показывает, что система редко нуждается в долгосрочной памяти, и большая часть полезной информации находится в недавних сообщениях. Авторы также демонстрируют, что разные архитектуры агентов могут достигать одинакового качества реконструкции профиля пользователя при значительной разнице в затратах вычислительных ресурсов.'}, 'en': {'title': "Understanding Relationships: AI's Memory Challenge", 'desc': "This paper introduces \x08ench, a dataset consisting of 27,218 messages from ten real relationships with an AI companion, designed to evaluate how well an AI can understand and remember personal interactions over time. The study reveals that while memory is often assumed to be crucial for AI conversations, in reality, only a small percentage of interactions require recalling past messages. It also highlights that existing methods for detecting when memory is needed are ineffective, as they often rely on cues that do not apply to real conversations. Finally, the research demonstrates that different AI systems can achieve similar performance in reconstructing a user's persona, but with significant differences in computational cost."}, 'zh': {'title': '理解与记忆：AI伴侣的对话之道', 'desc': '这篇论文探讨了一个与人类进行长期对话的人工智能伴侣如何理解和记住用户的信息。研究中发布了一个名为\\bench的数据库，包含了27,218条消息，记录了与AI伴侣的真实关系。研究发现，过去的信息在对话中并不常用，且大多数情况下不需要记忆。最后，三种不同的代理系统在重建用户个性方面表现相似，但成本差异达到31倍。'}}}, {'id': 'https://huggingface.co/papers/2609.38879', 'title': 'Does Learning Protein Folding Generalize to Broader Reasoning?', 'url': 'https://huggingface.co/papers/2609.38879', 'abstract': "Abstract  Large language models rely heavily on human text, which often conveys surface answers rather than the spatial and structural logic behind them. Protein folding is a natural testbed, because one solved structure yields thousands of exactly checkable spatial and topological statements. We ask: can learning to fold proteins teach general models reusable reasoning capabilities? To answer this, we build FoldingCorpus, a protein-derived question-answer dataset, and Fold2Reason, a recipe that post-trains on it through two complementary signals: discrete structural answers predicted via the model's native language head, and continuous 3D geometry decoded from the same shared representations. On FoldBench, Fold2Reason achieves structure prediction scores 2.7 to 3.5 times those of Qwen3.5-9B. Beyond protein structure prediction, it improves performance on all 10 benchmarks spanning spatial, graph, scientific, and general reasoning, raising macro-average accuracy from 45.09% to 48.33% (+3.23 pp), with positive gains on all 10 benchmarks, while matched controls built from random, synthetic, and shuffled structure yield substantially smaller or negative gains. Our work shows that non-linguistic, structure-dense scientific data can systematically improve broad reasoning in language models, making a solved scientific problem a practical source of post-training supervision.", 'score': 98, 'issue_id': 3375, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '0f30cadd272a7e7d', 'authors': ['Yong Liu', 'Zhanpeng Shi', 'Yizhou Dang', 'Zhongyue Zhang', 'Xiaoliang Shi', 'Zhijian Wei', 'Shuangjia Zheng'], 'affiliations': ['Fudan University', 'Northeastern University', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2609.38879.jpg', 'data': {'categories': ['#reasoning', '#synthetic', '#science'], 'emoji': '🧬', 'ru': {'title': 'Научные структуры как учитель логики для языковых моделей', 'desc': 'Исследователи показали, что обучение больших языковых моделей на задачах предсказания структуры белков помогает им развить более общие навыки логического рассуждения. Они создали датасет FoldingCorpus на основе известных структур белков и метод Fold2Reason, который использует две дополнительные сигнала обучения: дискретные структурные ответы и непрерывную 3D геометрию из общих представлений модели. После такого постобучения модель Fold2Reason значительно превосходит базовую Qwen3.5-9B в предсказании структур белков и показывает улучшение на всех 10 тестовых бенчмарках по пространственному, графовому и общему рассуждению. Работа демонстрирует, что структурированные научные данные без лингвистической информации эффективно улучшают общие способности рассуждения в языковых моделях.'}, 'en': {'title': 'Unlocking Reasoning in Language Models through Protein Folding', 'desc': 'This paper explores how large language models can improve their reasoning abilities by learning from protein folding data. The authors introduce FoldingCorpus, a dataset that contains questions and answers derived from protein structures, and Fold2Reason, a method that enhances model training using both discrete structural answers and continuous 3D geometry. The results show that Fold2Reason significantly outperforms existing models in structure prediction and enhances reasoning across various benchmarks. This research demonstrates that integrating scientific data can effectively boost the reasoning capabilities of language models beyond traditional text-based training.'}, 'zh': {'title': '利用蛋白质折叠提升语言模型推理能力', 'desc': '这篇论文探讨了大型语言模型如何通过学习蛋白质折叠来提升推理能力。研究者们构建了FoldingCorpus数据集，并提出了Fold2Reason方法，通过两种信号进行后训练：一种是离散的结构答案，另一种是从共享表示中解码的连续3D几何信息。实验结果表明，Fold2Reason在结构预测上显著优于现有模型，并且在多个推理基准测试中也表现出色。该研究表明，非语言的科学数据可以有效提升语言模型的推理能力。'}}}, {'id': 'https://huggingface.co/papers/2609.38839', 'title': 'FrameMorrow: Future-guided Frame Selection with Prospective Tokens for Long-Horizon Video Generation', 'url': 'https://huggingface.co/papers/2609.38839', 'abstract': 'Abstract  Long-horizon video generation requires models to effectively leverage an increasingly long generation history. As the generated history grows, retaining all previous content becomes increasingly expensive and redundant, making effective historical selection essential. Existing approaches often determine historical relevance based on the current content. However, information relevant to the present is not necessarily useful for future generation, while seemingly less relevant history may become important later. Our key insight is that historical information should be selected according to its relevance to future information needs. Capturing these needs does not require generating the full future; instead, a compact representation of what becomes important next is sufficient to guide historical selection. Building on this insight, we propose FrameMorrow, a prospective frame selector that predicts a small set of prospective tokens representing future information needs and uses them to identify relevant information from history. FrameMorrow selects explicit historical frames rather than model-specific internal states, enabling plug-and-play integration across diverse generators, including closed-source models, with little additional inference cost. We evaluate FrameMorrow across five benchmarks and 11 generative models spanning long-video generation, interactive generation, and action-conditioned world models. Extensive experiments demonstrate consistent improvements in long-range consistency, visual quality, and action alignment across diverse generation settings.', 'score': 90, 'issue_id': 3374, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '086a64f6e2b75475', 'authors': ['Bo Yin', 'Xiaobin Hu', 'Jiaqi Zhao', 'Shuicheng Yan'], 'affiliations': ['Harbin Institute of Technology (Shenzhen)', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2609.38839.jpg', 'data': {'categories': ['#long_context', '#architecture', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Выбирайте историю видео по будущему, а не по прошлому', 'desc': 'Статья посвящена проблеме генерации видео на большие горизонты, где модель должна эффективно использовать растущую историю сгенерированного контента. Авторы предлагают FrameMorrow — селектор кадров, который предсказывает компактное представление будущих информационных потребностей и использует его для выбора релевантной истории. В отличие от существующих подходов, которые оценивают значимость истории на основе текущего контента, предложенный метод выбирает кадры в соответствии с тем, что будет важно в будущем. FrameMorrow работает с явными кадрами истории, что позволяет интегрировать его в различные генераторы, включая закрытые модели, с минимальными вычислительными издержками.'}, 'en': {'title': 'FrameMorrow: Smart History Selection for Future Video Generation', 'desc': 'This paper introduces FrameMorrow, a novel approach for long-horizon video generation that focuses on selecting historical information based on its relevance to future needs rather than current content. The method addresses the challenge of managing an expanding generation history by predicting a compact set of future information requirements, which guides the selection of relevant historical frames. By using explicit historical frames instead of internal model states, FrameMorrow allows for easy integration with various generative models, including those that are closed-source. The results show that FrameMorrow significantly enhances long-range consistency, visual quality, and action alignment in video generation tasks.'}, 'zh': {'title': '前瞻性帧选择，提升视频生成质量', 'desc': '本论文提出了一种名为FrameMorrow的前瞻性帧选择器，用于长时间视频生成。该模型通过预测未来信息需求的紧凑表示，来选择与历史信息的相关性，从而提高生成的有效性。与现有方法不同，FrameMorrow不依赖于当前内容来判断历史信息的相关性，而是关注未来可能需要的信息。实验结果表明，FrameMorrow在多个基准测试中表现出色，显著提升了长时间一致性、视觉质量和动作对齐。'}}}, {'id': 'https://huggingface.co/papers/2609.38078', 'title': 'MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation', 'url': 'https://huggingface.co/papers/2609.38078', 'abstract': 'Abstract  Vision-language-action (VLA) models have advanced robotic manipulation, but their zero-shot generalization in new tasks and environments remains limited, and their reliance on specialized training keeps them from benefiting directly from rapidly advancing general-purpose vision-language models (VLMs). In parallel, recent agentic robotic systems leverage VLMs for high-level reasoning or coding agents for robot control, but often depend on extensive external models and tools, introducing additional complexity and cost. This motivates us to ask: Can a general-purpose VLM itself operate a robot more like the human teleoperator by reasoning directly from observations, issuing actions, and continuously adapting to execution feedback, without relying on external models such as learned action experts, coding agents or grounding tools like SAM3? In this work, we introduce MotorMind, a robot manipulation harness that connects VLM-proposed mid-level actions to deterministic robot control and feedback, with asynchronous monitoring and background memory updates. Without task-specific policy training, coding agents, or additional grounding tools such as SAM3, MotorMind achieves 66.7% success on the base LIBERO-PRO suites and 53.8% under perturbations, compared with at most 13.3% and 19.2%, respectively, for the prior zero-shot methods we evaluate. The same interface reaches 95% average success on a real xArm6 robot across direct manipulation and human-perturbation settings. Replacing the backbone with a stronger VLM further improves performance, while the remaining failures - primarily due to visual grounding, embodied reasoning, and action knowledge - decrease as VLM capability improves. These results show that a general-purpose VLM, when equipped with an appropriate mid-level action representation and asynchronous execution harness, can perform effective zero-shot robotic manipulation.', 'score': 89, 'issue_id': 3375, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '082520054f71c847', 'authors': ['Bingxuan Li', 'Siqi Song', 'Yizhuo Wu', 'Jiarui Yao', 'Tong Zhang', 'Huan Zhang'], 'affiliations': ['University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2609.38078.jpg', 'data': {'categories': ['#multimodal', '#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Универсальная языко-зрительная модель как телеоператор робота', 'desc': 'В статье представлена MotorMind — система управления роботом, которая позволяет универсальным vision-language моделям (VLM) непосредственно управлять манипуляторами без специального обучения на робототехнические данные. Система соединяет предложения VLM среднего уровня абстракции с детерминированным управлением роботом и обратной связью, используя асинхронный мониторинг и фоновое обновление памяти. Подход достигает 66,7% успеха на бенчмарке LIBERO-PRO без задачно-специфической подготовки политик, кодовых агентов или дополнительных инструментов, значительно превосходя предыдущие zero-shot методы. Результаты демонстрируют, что универсальная VLM с правильным представлением действий и асинхронной системой исполнения может эффективно решать задачи манипуляции роботом нулевого обучения.'}, 'en': {'title': 'Empowering Robots with General-Purpose Vision-Language Models', 'desc': 'This paper presents MotorMind, a novel approach that enables general-purpose vision-language models (VLMs) to control robots for manipulation tasks without the need for specialized training or external models. MotorMind connects mid-level actions proposed by VLMs directly to robot control, allowing for real-time feedback and adaptation during execution. The results demonstrate significant improvements in zero-shot generalization, achieving a 66.7% success rate on benchmark tasks and 95% on a real robot, outperforming previous methods. The findings suggest that enhancing VLM capabilities can lead to better performance in robotic manipulation by addressing challenges in visual grounding and action knowledge.'}, 'zh': {'title': '通用VLM实现高效零-shot机器人操控', 'desc': '本文介绍了一种名为MotorMind的机器人操控系统，它利用通用的视觉语言模型（VLM）直接从观察中推理并发出动作，而无需依赖外部模型或工具。MotorMind能够将VLM提出的中级动作连接到确定性的机器人控制和反馈中，实现了高效的零-shot机器人操控。实验结果显示，MotorMind在LIBERO-PRO测试套件上取得了66.7%的成功率，远超以往方法的表现。通过使用更强大的VLM，系统的性能进一步提升，表明通用VLM在适当的中级动作表示和异步执行支持下，可以有效地进行机器人操控。'}}}, {'id': 'https://huggingface.co/papers/2610.02826', 'title': 'Scaling Trajectories for Complex Tasks through Recursive Self-Rewrite', 'url': 'https://huggingface.co/papers/2610.02826', 'abstract': 'Abstract  Successful trajectories on difficult tasks provide valuable supervision for model improvement, but specialized harnesses introduce interventions that may be unavailable during deployment. We propose Recursive Self-Rewrite (RSR), a framework that uses one base model, Qwen-3.8-27B, to discover successful solutions under diverse harnesses and reconstruct them as training trajectories under a general harness. A planner extracts procedures into runbooks, a critic screens for verifier and solution leakage and guides recursive revision, and an executor follows qualified runbooks in fresh sandboxes. Across approximately 3K self-curated terminal tasks, three harnesses jointly solve 759 tasks, 34.3% more than the strongest individual harness in the recorded pool. RSR expands 2,001 successful source trajectories into 11,094 rewritten trajectories for supervised finetuning. Training on these trajectories outperforms both the base model and direct trajectory SFT. Compared with the base model, pass@3 increases from 57.0% to 74.2% on Terminal-Bench 2, from 1.5% to 9.1% on Terminal-Bench 4, from 39.0% to 63.0% on our self-curated Terminal-Bench Hard, and from 3.0% to 6.0% on our Software Terminal-Bench. Process reward on Long-Horizon Terminal-Bench rises from 0.21 to 0.29. These results show how diverse harness-assisted experiences can be reconstructed into reusable capabilities for a model operating under a general harness.', 'score': 82, 'issue_id': 3374, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'fb0c41325f1e3fb7', 'authors': ['Zongxia Li', 'Yucheng Shi', 'Zhongzhi Li', 'Junyao Yang', 'Ruhan Wang', 'Chengsong Huang', 'Fuxiao Liu', 'Haitao Mi', 'Jordan Boyd-Graber', 'LeoweiLiang'], 'affiliations': ['Indiana University', 'Nanyang Technological University', 'National University of Singapore', 'Tencent HY LLM Frontier', 'University of Georgia', 'University of Maryland, College Park', 'Washington University in St. Louis'], 'pdf_title_img': 'assets/pdf/title_img/2610.02826.jpg', 'data': {'categories': [], 'emoji': '♻️', 'ru': {'title': 'Переиспользование успешных решений через переписывание траекторий обучения', 'desc': 'В работе предложен метод Recursive Self-Rewrite (RSR) для улучшения языковых моделей путём переписывания успешных решений, полученных с помощью специализированных вспомогательных инструментов, в формат, совместимый с общим интерфейсом. Система использует планировщик для извлечения процедур, критика для проверки качества и предотвращения утечек информации, а также исполнителя для следования квалифицированным инструкциям. Метод расширяет 2 тысячи успешных траекторий в 11 тысяч переписанных примеров для обучения с учителем. После дообучения на этих данных модель показывает значительные улучшения: pass@3 возрастает с 57% до 74.2% на Terminal-Bench 2 и с 3% до 6% на Software Terminal-Bench.'}, 'en': {'title': 'Transforming Success: RSR for Enhanced Model Training', 'desc': 'The paper introduces Recursive Self-Rewrite (RSR), a novel framework that enhances model performance by leveraging successful task trajectories obtained from various specialized harnesses. It utilizes a single base model, Qwen-3.8-27B, to identify effective solutions and reformulates them into training trajectories applicable under a general harness. The framework includes a planner for procedure extraction, a critic for quality assurance, and an executor for implementing the refined runbooks. The results demonstrate significant improvements in task completion rates and overall model performance, showcasing the benefits of using diverse harness-assisted experiences for model training.'}, 'zh': {'title': '多样化环境下的模型能力重构', 'desc': '本文提出了一种名为递归自重写（RSR）的框架，旨在利用一个基础模型Qwen-3.8-27B，在不同的环境下发现成功的解决方案，并将其重构为通用环境下的训练轨迹。该框架通过规划器提取程序到运行手册，利用评论者筛选验证和解决方案泄漏，并指导递归修订，最后由执行者在新的沙箱中执行合格的运行手册。通过大约3000个自我策划的终端任务，三种环境共同解决了759个任务，成功率比最强的单一环境提高了34.3%。RSR将2001个成功的源轨迹扩展为11094个重写轨迹，用于监督微调，训练结果优于基础模型和直接轨迹的监督微调。'}}}, {'id': 'https://huggingface.co/papers/2609.36659', 'title': 'On-Policy Parameter Update Direction Underlies Generalization in LLM Post-Training', 'url': 'https://huggingface.co/papers/2609.36659', 'abstract': 'Abstract  The strong generalization performance of on-policy post-training paradigms has motivated studies of their parameter update behaviors. However, these studies treat the observed behaviors only as byproducts in on-policy training, overlooking their potential to serve as optimization principles for improving the generalization of other paradigms such as supervised fine-tuning (SFT). To address this limitation, we investigate whether there exists a specific on-policy update behavior that can achieve such improvements. First, our analyses reveal that SFT updates parameters along consistent directions, while the on-policy paradigm continuously adjusts the direction during training. This difference inspires us to focus on the cumulative update direction of each parameter as a promising behavior. Then, we evaluate its effectiveness for improving generalization by proposing On-Policy direction-constrained Supervised Fine-Tuning (OPSFT), which constrains SFT updates to the direction identified by on-policy paradigms. The strong performance of OPSFT indicates that the generalization advantage of on-policy paradigms can be transferred to SFT through the parameter update direction. Once such a direction is identified, even SFT can generalize with its updates constrained to this direction. This finding offers two practical benefits by combining the strong generalization of on-policy paradigms with the advantages of SFT, including the high training efficiency and ability to leverage high-quality trajectories. For efficiency, we identify update directions that support strong generalization using a few on-policy training steps, and subsequently apply OPSFT to achieve high training efficiency. For leveraging high-quality trajectories, OPSFT can utilize these trajectories to continue improving a post-trained model along its update direction without disrupting the ability learned from on-policy training.', 'score': 75, 'issue_id': 3375, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': '6831dbdc8d5c5460', 'authors': ['Shufan Shen', 'Zhongni Hou', 'Junshu Sun', 'Yufei Zhang', 'Wei Lin', 'Guojun Yin', 'Qingming Huang', 'Shuhui Wang'], 'affiliations': ['Meituan', 'State Key Lab. of AI Safety, Institute of Computing Technology, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2609.36659.jpg', 'data': {'categories': ['#rlhf', '#training'], 'emoji': '🧭', 'ru': {'title': 'Перенос обобщающей способности on-policy методов на SFT через направление обновления параметров', 'desc': 'В этой работе исследуются различия в поведении обновления параметров между обучением на собственной политике (on-policy) и супервизируемой дообучением (SFT). Авторы обнаружили, что SFT обновляет параметры в согласованных направлениях, а on-policy парадигма постоянно меняет направления во время обучения. На основе этого наблюдения предложен метод OPSFT, который ограничивает обновления SFT направлениями, определёнными on-policy методами. Исследование показывает, что обобщающую способность on-policy подходов можно перенести на SFT через направление обновления параметров, что обеспечивает лучшую эффективность обучения и возможность использования высокочественных данных.'}, 'en': {'title': 'Harnessing On-Policy Updates for Better Supervised Fine-Tuning', 'desc': 'This paper explores how the update behaviors of on-policy training can enhance the generalization capabilities of supervised fine-tuning (SFT). It highlights that while SFT updates parameters in a consistent direction, on-policy methods adjust their update directions throughout training. The authors propose a new method called On-Policy direction-constrained Supervised Fine-Tuning (OPSFT), which aligns SFT updates with the beneficial directions identified in on-policy training. The results show that OPSFT can effectively transfer the generalization strengths of on-policy paradigms to SFT, leading to improved performance and efficiency in training.'}, 'zh': {'title': '利用策略训练提升监督微调的泛化能力', 'desc': '本文探讨了在策略训练中参数更新行为的潜力，尤其是如何利用这些行为来提升监督微调（SFT）的泛化能力。研究发现，SFT在更新参数时沿着一致的方向进行，而策略训练则在训练过程中不断调整方向。基于这一差异，提出了一种新的方法——策略方向约束的监督微调（OPSFT），该方法将SFT的更新限制在策略训练所识别的方向上。实验结果表明，OPSFT能够有效地将策略训练的泛化优势转移到SFT上，从而实现高效的训练和利用高质量轨迹。'}}}, {'id': 'https://huggingface.co/papers/2610.02508', 'title': 'World Action Modeling with Progressive Visual Planning', 'url': 'https://huggingface.co/papers/2610.02508', 'abstract': 'Abstract  World action models (WAMs) have emerged as a promising paradigm for robotic control by jointly predicting future visual dynamics and actions from an initial observation and instruction. However, existing WAMs struggle with long-horizon prediction, as generating dense video rollouts is highly inefficient. Some recent WAMs address this by predicting a single future frame without generating the full video, but this approach neglects how to progress toward the goal. We present ProWAM, a progressive world action model that jointly predicts actions and an ordered sequence of sparse visual sub-goals, providing explicit visual guidance to anchor action generation throughout task execution. This design scales naturally, as sub-goal prediction can be learned from large-scale action-free videos, allowing the video backbone to offload complex visual planning from the action policy. For efficient action generation, ProWAM executes a single video-backbone forward pass to cache sparse sub-goal features, eliminating iterative full-video generation and requiring only lightweight action denoising during replanning. Across extensive evaluations, ProWAM achieves superior out-of-distribution robustness. On simulation benchmarks, it sets new state-of-the-art results on LIBERO-Plus (85.8%) and randomized RoboTwin (75.7%), outperforming the strongest baseline with relative gains of up to +35.9%. On RoboCasa365, ProWAM achieves a 48.1% success rate and 18.2% on the challenging Composite-Unseen split, ranking 4th overall. Crucially, in zero-shot real-world experiments, ProWAM achieves 70.0% success, outperforming the strongest baseline by +15.0 (from 55.0% to 70.0%, a +27.3% relative gain) in novel scenes. These results demonstrate the value of progress-indexed visual foresight for closed-loop control. Our program is in https://sii-ferenas.github.io/ProWAM-page.', 'score': 74, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'a7169d01a42674b3', 'authors': ['Fei Zhang', 'Zhaochong An', 'Duncan Frost', 'Yikai Wang', 'Pengfei Liu', 'Ya Zhang', 'Michal Drozdzal', 'Amir Bar'], 'affiliations': ['Imperial College London', 'Meta', 'SII', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02508.jpg', 'data': {'categories': ['#video', '#robotics', '#training'], 'emoji': '🤖', 'ru': {'title': 'Пошаговое визуальное предсказание для эффективного управления роботами', 'desc': 'В статье представляется ProWAM — прогрессивная мировая модель действий, которая совместно предсказывает действия робота и последовательность разреженных визуальных подцелей для эффективного управления. Ключевое улучшение заключается в том, что модель предсказывает промежуточные визуальные ориентиры вместо полного видеопредсказания, что значительно снижает вычислительную сложность долгосрочного планирования. Предсказание подцелей обучается на больших наборах видеоданных без разметки действий, позволяя отделить сложное визуальное планирование от политики действий. Экспериментальные результаты показывают, что ProWAM достигает состояния искусства на симуляционных бенчмарках LIBERO-Plus и RoboTwin, а также демонстрирует высокую обобщаемость в нулевых условиях на реальных роботах с успешностью 70%.'}, 'en': {'title': 'ProWAM: Efficient Robotic Control with Visual Sub-Goals', 'desc': "The paper introduces ProWAM, a new type of World Action Model designed to improve robotic control by predicting actions and visual sub-goals over time. Unlike previous models that generate full video rollouts, ProWAM focuses on predicting sparse visual cues that guide the robot's actions, making the process more efficient. This model leverages large-scale action-free videos to learn sub-goal predictions, which helps in reducing the computational load during action planning. ProWAM demonstrates significant improvements in performance across various benchmarks, showcasing its effectiveness in real-world scenarios and its robustness in handling unseen environments."}, 'zh': {'title': '渐进式世界动作模型：高效的机器人控制新方法', 'desc': '世界动作模型（WAMs）是一种新兴的机器人控制方法，通过从初始观察和指令中共同预测未来的视觉动态和动作。然而，现有的WAMs在长时间预测方面存在困难，因为生成密集的视频序列效率低下。我们提出了ProWAM，这是一种渐进式世界动作模型，它共同预测动作和有序的稀疏视觉子目标，为任务执行提供明确的视觉指导。ProWAM在多个评估中表现出色，尤其是在零样本真实世界实验中，成功率达到70.0%，显著优于最强基线。'}}}, {'id': 'https://huggingface.co/papers/2610.03391', 'title': 'Native Action-Prior Learning from Videos for World Action Models', 'url': 'https://huggingface.co/papers/2610.03391', 'abstract': 'Abstract  World action models integrate future visual dynamics with robot action prediction, but their scalability remains limited by the need for action-annotated robot trajectories. Observation-only videos contain rich evidence about interaction dynamics, but existing approaches typically use them either to pretrain visual representations that must later be adapted for control, or to infer latent actions that are subsequently grounded to robot commands. We present NAVA-WAM, which introduces native action-prior learning by directly pretraining the action policy from observation-only videos, avoiding indirect representation-to-control transfer or a separate latent-action model. Our training consists of two stages. First, we pretrain on observation-only videos, where future-video flow-matching supervision over visual transitions is propagated through transition-structured joint attention to optimize the Action-DiT and learn action-relevant priors. Second, we use action-labeled demonstrations to post-train the Action-DiT for robot control through joint video--action flow matching, while asymmetric attention decouples the visual branch from iterative action denoising and enables efficient action-only inference. Extensive experiments show that NAVA-WAM consistently outperforms prior approaches under both in-distribution and out-of-distribution settings, while demonstrating strong action-label efficiency and effective real-robot generalization. These results establish native action-prior learning as an effective approach to directly pretrain action policies from observation-only videos, providing a scalable path beyond action-labeled robot data.', 'score': 74, 'issue_id': 3375, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'b4add6fb166dc620', 'authors': ['Zhaochong An', 'Fei Zhang', 'Menglin Jia', 'Duncan Frost', 'Zijian Zhou', 'Yikai Wang', 'Xudong Wang', 'Aditya Patel', 'Belinda Zeng', 'Tao Xiang', 'Serge Belongie', 'Amir Bar', 'Sen He'], 'affiliations': ['Imperial College London', 'Meta AI', 'Physical Intelligence', 'University of Copenhagen'], 'pdf_title_img': 'assets/pdf/title_img/2610.03391.jpg', 'data': {'categories': ['#video', '#robotics', '#training', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Обучение действиям робота напрямую из видео без аннотаций', 'desc': 'Статья представляет NAVA-WAM, метод для обучения мировых моделей роботов, который использует видео без аннотаций действий. Подход состоит из двух этапов: сначала модель предварительно обучается на видео только с наблюдениями, используя flow-matching для визуальных переходов и механизм внимания для изучения релевантных действиям представлений, затем происходит дообучение на размеченных данных с реальных демонстраций. Ключевое преимущество заключается в том, что метод избегает косвенного переноса представлений и отдельных моделей скрытых действий, напрямую учась предсказывать действия робота. Эксперименты показали, что NAVA-WAM превосходит существующие подходы в распределённых и вне-распределённых сценариях, при этом требуя меньше размеченных данных и хорошо обобщаясь на реальных роботах.'}, 'en': {'title': 'Direct Learning of Action Policies from Observation-Only Videos', 'desc': 'The paper introduces NAVA-WAM, a novel approach for training action models that directly learns action policies from observation-only videos, bypassing the need for action-annotated data. It employs a two-stage training process: first, it pretrains using visual transitions in videos to optimize action-relevant priors, and then it fine-tunes the model with action-labeled demonstrations for effective robot control. This method utilizes joint attention and flow matching to enhance learning efficiency and action inference. The results show that NAVA-WAM outperforms existing methods, demonstrating its scalability and effectiveness in real-robot applications without relying heavily on labeled data.'}, 'zh': {'title': '直接从观察视频中学习动作策略的创新方法', 'desc': '本论文提出了一种新的方法NAVA-WAM，用于从仅包含观察的视频中直接预训练机器人动作策略。该方法通过两阶段训练，首先在观察视频上进行预训练，利用视觉过渡的未来视频流匹配来优化动作相关的先验知识。然后，使用带有动作标签的示范进行后训练，以实现机器人控制。实验结果表明，NAVA-WAM在多种设置下均优于现有方法，展示了其在动作标签效率和真实机器人泛化能力方面的优势。'}}}, {'id': 'https://huggingface.co/papers/2610.02381', 'title': 'Latent-MOPD: Latent Multi-Teacher On-Policy Distillation', 'url': 'https://huggingface.co/papers/2610.02381', 'abstract': "Abstract  On-policy distillation (OPD) trains a student on the responses it generates. Existing LLM multi-teacher OPD transfers what specialists predict through their output distributions. We introduce Latent-MOPD, to our knowledge the first representation-level multi-teacher OPD method for LLMs. It integrates existing specialists through both their predictions and the hidden states used to compute them, without additional teacher training. To coordinate representation supervision from multiple specialists, we select late-layer targets according to the teacher-student relationship, bridge unequal hidden widths with a shared projection, and group updates by domain. Each teacher's supervision gradually shifts from hidden states to token predictions, with both channels using the same routed specialist. In our main same-family setting, Latent-MOPD outperforms the token-only, representation-only and uniform-averaging baselines on all nine benchmarks across math, code and logic. With the same parameter count as each teacher, the student also surpasses the per-benchmark best teacher on a majority of these benchmarks. With larger, separately developed cross-family teachers, Latent-MOPD outperforms both single-channel baselines on all benchmarks. A same-family all-layer representation-only control remains stable with domain-pure updates but collapses when teacher domains are interleaved within an update. Our results show that a single student can integrate capabilities from several specialists through both their output distributions and internal representations.", 'score': 54, 'issue_id': 3376, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': 'ecfddbad25b3c18b', 'authors': ['Zhengyu Fang', 'Seoyeon Hong', 'Jie Yang', 'Muyang Li', 'Koyoshi Shindo', 'Brandon Joseph Lwowski', 'Jing Li'], 'affiliations': ['Case Western Reserve University', 'University of Florida', 'University of Illinois at Chicago', 'Zillow Group, Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2610.02381.jpg', 'data': {'categories': [], 'emoji': '🧠', 'ru': {'title': 'Дистилляция знаний от нескольких специалистов через представления и предсказания', 'desc': 'В статье предложен метод Latent-MOPD для обучения студент-модели на основе нескольких учительских моделей-специалистов, используя не только их выходные распределения, но и скрытые представления из внутренних слоёв нейронной сети. Метод координирует обучение от нескольких учителей через выбор целевых слоёв, согласование размерностей представлений и группировку обновлений по предметным областям. Студент постепенно переходит от обучения на скрытых состояниях к обучению на токенах, используя одного маршрутизируемого специалиста для обоих каналов. Экспериментальные результаты показывают, что единая студент-модель с тем же количеством параметров может превзойти лучшего учителя по большинству тестов в областях математики, программирования и логического рассуждения.'}, 'en': {'title': 'Integrating Knowledge from Multiple Teachers in LLMs', 'desc': 'This paper presents Latent-MOPD, a novel method for on-policy distillation in large language models (LLMs) that utilizes multiple teacher models. Unlike traditional methods that only transfer predictions, Latent-MOPD also incorporates hidden states from teachers, enhancing the learning process without requiring additional training for the teachers. The method strategically selects late-layer targets and aligns hidden representations to improve coordination among different specialists. The results demonstrate that Latent-MOPD significantly outperforms existing baselines across various benchmarks in math, code, and logic tasks, showcasing its effectiveness in integrating diverse capabilities from multiple teachers.'}, 'zh': {'title': '整合多专家能力，提升模型性能', 'desc': '本文介绍了一种新的多教师在线蒸馏方法，称为Latent-MOPD。该方法通过整合多个专家的预测和隐藏状态来训练学生模型，而无需额外的教师训练。Latent-MOPD在多个基准测试中表现优于传统的仅基于标记或仅基于表示的方法，显示出其在数学、代码和逻辑任务上的优势。研究结果表明，单一学生模型能够有效整合多个专家的能力，提升整体性能。'}}}, {'id': 'https://huggingface.co/papers/2610.03574', 'title': 'HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents', 'url': 'https://huggingface.co/papers/2610.03574', 'abstract': 'Abstract  We introduce HyperBrowseComp, a multilingual and multimodal browsing benchmark comprising 423 manually authored and human-validated questions across 13 languages, written by native or highly proficient speakers. Questions are designed to be extremely challenging. Each question targets a concise, publicly verifiable answer whose discovery requires locating obscure evidence, following multi-step clue chains, or inspecting heterogeneous sources such as videos, scanned documents, images, or maps. Easier questions are filtered out by evaluating them with models without internet access to reduce the likelihood that they can be answered with parametric knowledge alone. We evaluate several models using provider-native search and a shared external retrieval harness under a common agent protocol. To contextualize model performance and effort, we also conduct a human evaluation on a sample of the questions. HyperBrowseComp provides a challenging testbed for persistent information seeking across languages and evidence modalities, with difficulty arising from discovering and connecting evidence on the open web.', 'score': 51, 'issue_id': 3375, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'eaa2ce94882b0c3f', 'authors': ['Alham Fikri Aji', 'Faiz Rizki Ramadhan', 'Zayd M. K. Zuhri', 'Seung Hun Eddie Han', 'Ryandito Diandaru', 'Qinrong Cui', 'Jan Christian Blaise Cruz', 'Badrinath Chandana', 'Peerawat Chomphooyod', 'Ahmed Attia', 'Jonibek Mansurov', 'Emilio Villa-Cueva', 'Canh Duong Nguyen', 'Imran Turganov', 'Minghao Wu', 'Peerat Limkonchotiwat', 'Irina Nikishina'], 'affiliations': ['AI Singapore', 'Alibaba Group', 'Inception AI', 'Mila Quebec Artificial Intelligence Institute', 'Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2610.03574.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#survey', '#low_resource', '#dataset', '#multilingual', '#agents'], 'emoji': '🌐', 'ru': {'title': 'Преодоление границ: когда поиск информации требует следования многошаговым цепочкам доказательств', 'desc': 'В работе представлен HyperBrowseComp — многоязычный и мультимодальный бенчмарк для оценки моделей, содержащий 423 вручную составленных вопроса на 13 языках, требующих поиска скрытой информации в интернете. Вопросы разработаны таким образом, чтобы для их решения необходимо было анализировать гетерогенные источники: видео, отсканированные документы, изображения и карты, а также следить по цепочкам многошаговых подсказок. Авторы фильтруют более легкие вопросы, проверяя их моделями без интернета, чтобы убедиться, что ответы не могут быть получены только из параметрических знаний моделей. Исследование включает оценку нескольких моделей с использованием нативного поиска и общего внешнего retrieval-инструмента в рамках единого протокола агента.'}, 'en': {'title': 'Challenging Multilingual Browsing for AI Models', 'desc': 'HyperBrowseComp is a new benchmark for testing multilingual and multimodal browsing capabilities in machine learning models. It consists of 423 complex questions in 13 languages, requiring models to find specific answers by navigating diverse sources like videos and documents. The questions are designed to be difficult, ensuring that simple knowledge retrieval is not sufficient, as they often require multi-step reasoning and evidence gathering. The benchmark also includes human evaluations to compare model performance against human capabilities in information seeking tasks.'}, 'zh': {'title': '跨语言信息搜索的挑战性基准', 'desc': '我们介绍了HyperBrowseComp，这是一个多语言和多模态的浏览基准，包含423个手动编写和经过人工验证的问题，覆盖13种语言。这些问题设计得非常具有挑战性，要求找到简洁且可公开验证的答案，通常需要寻找晦涩的证据、遵循多步骤的线索链，或检查视频、扫描文档、图像或地图等异构来源。为了减少仅凭参数知识回答问题的可能性，我们通过评估没有互联网访问的模型来过滤掉较简单的问题。HyperBrowseComp为跨语言和证据模态的持久信息搜索提供了一个具有挑战性的测试平台，难点在于在开放网络上发现和连接证据。'}}}, {'id': 'https://huggingface.co/papers/2609.34715', 'title': 'PDE-JEPA: Predictive Representation Learning of Latent Dynamics Modeling for Parametric PDEs', 'url': 'https://huggingface.co/papers/2609.34715', 'abstract': 'Abstract  Physical trajectories contain more than snapshots of a system: they also reveal how its states evolve under governing conditions. However, representation learning for parametric partial differential equations (PDEs) has largely relied on reconstruction-based objectives that emphasize recovering observed physical fields. In this paper, we investigate predictive representation pretraining as an alternative to reconstruction-based learning. We find that predictive representations preserve rich physical information, yet this advantage alone does not ensure accurate field evolution. Based on these observations, we introduce PDE-JEPA for parametric PDE dynamics. Specifically, we first train an encoder using a masked-latent prediction to capture the underlying regularities of PDE dynamics. To explicitly adapt the pretrained representation toward a more dynamics-aligned state space, we then introduce a geometry projector that aligns latent trajectory geometry with the evolution geometry of physical fields. Finally, building on this geometry-aligned latent space, we further develop a physics-structured latent predictor that decomposes the dynamics into parameter-independent evolution and parameter-dependent response components. Extensive experiments on nine widely used PDE benchmarks demonstrate that our framework outperforms existing state-of-the-art methods by an average of 33.4\\% in-distribution, while achieving an average improvement of 51.4\\% when extrapolating to unseen governing parameters. The project page is available https://tanpig-x.github.io/PDE-JEPA/{here}.', 'score': 51, 'issue_id': 3374, 'pub_date': '2026-09-28', 'pub_date_card': {'ru': '28 сентября', 'en': 'September 28', 'zh': '9月28日'}, 'hash': 'db8e5684894f7743', 'authors': ['Zhentao Tan', 'Jianrong Zhang', 'Ruijie Quan', 'Yi Yang'], 'affiliations': ['Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.34715.jpg', 'data': {'categories': ['#architecture', '#benchmark', '#training'], 'emoji': '🌊', 'ru': {'title': 'Геометрически выравненные предсказательные представления для динамики УЧП', 'desc': 'В работе предложен новый подход к обучению представлений для параметрических дифференциальных уравнений в частных производных (УЧП), основанный на предсказательном предобучении вместо восстановления полей. Авторы вводят PDE-JEPA — метод, который использует маскированное предсказание в скрытом пространстве для захвата закономерностей динамики УЧП. Ключевой компонент — геометрический проектор, который выравнивает геометрию траекторий в скрытом пространстве с эволюционной геометрией физических полей. Дополнительно предложен структурированный по физике предсказатель, разложающий динамику на параметрически независимую эволюцию и параметрически зависимый отклик.'}, 'en': {'title': 'Predictive Learning for Enhanced PDE Dynamics', 'desc': 'This paper explores a new approach to learning representations for parametric partial differential equations (PDEs) by focusing on predictive representation pretraining instead of traditional reconstruction methods. The authors introduce a method called PDE-JEPA, which first trains an encoder to predict masked latent variables, capturing the essential dynamics of PDEs. They enhance this representation by using a geometry projector to align the latent space with the actual evolution of physical fields. The results show that this method significantly improves performance on various PDE benchmarks, especially in extrapolating to new conditions.'}, 'zh': {'title': '通过预测表示提升偏微分方程动态的学习', 'desc': '本文探讨了物理系统的轨迹如何揭示其状态在特定条件下的演变。我们提出了一种新的方法，称为PDE-JEPA，旨在通过预测表示预训练来替代传统的重建学习。该方法首先使用掩蔽潜在预测训练编码器，以捕捉偏微分方程（PDE）动态的基本规律。通过几何投影器，我们将潜在轨迹几何与物理场的演变几何对齐，从而提高了模型在未见参数下的预测能力。'}}}, {'id': 'https://huggingface.co/papers/2610.03665', 'title': 'Pivot-SD: Efficient Self-Distillation for Masked Diffusion Language Models', 'url': 'https://huggingface.co/papers/2610.03665', 'abstract': 'Abstract  Masked diffusion language models (dLMs) offer a promising parallel alternative to autoregressive models for complex reasoning. However, they face a distinct credit-assignment challenge, since a few commitments during denoising sharply reduce the uncertainty over the remaining masked positions and shape much of the response. Most post-training recipes for dLMs do not use this signal to decide which tokens to train on: they typically train on the final text or assign rewards to whole denoising steps, rather than selecting the individual commitments that shape the response. We introduce Pivot-SD, an efficient offline self-distillation framework that supervises only these high-impact commitments (pivots). Pivot-SD selects pivots using an information-gain metric measuring uncertainty reduction over the remaining masked positions. Pivots from successful trajectories are trained with cross-entropy, and pivots from failed trajectories with targeted unlikelihood, leaving the rest of the failed trajectory untouched. Using only 200 questions and four rollouts each, Pivot-SD improves LLaDA-8B-Instruct over full-sequence SFT and budget-matched diffusion RL baselines across math and code benchmarks.', 'score': 50, 'issue_id': 3375, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'be97fb1b1b425f22', 'authors': ['Seo Hyun Kim', 'Sunwoo Hong', 'Younwoo Choi', 'Chen-Hao Chao', 'Se-Young Yun', 'Rahul G. Krishnan'], 'affiliations': ['KAIST AI', 'University of Toronto', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2610.03665.jpg', 'data': {'categories': ['#optimization', '#training', '#architecture', '#diffusion', '#reasoning'], 'emoji': '🎯', 'ru': {'title': 'Обучение на критических решениях: как выбрать самые важные токены в диффузионных моделях', 'desc': 'В статье предложен новый подход Pivot-SD для обучения диффузионных языковых моделей, которые являются многообещающей альтернативой авторегрессивным моделям для сложного рассуждения. Основная идея заключается в том, чтобы сосредоточить обучение на критически важных решениях (pivots) во время процесса денойзирования, которые наиболее сильно влияют на неопределённость оставшихся замаскированных позиций. Метод использует метрику информационного выигрыша для отбора этих высокоизвлекаемых токенов и применяет целевое обучение: кросс-энтропию для успешных траекторий и targeted unlikelihood для неудачных. Экспериментально показано, что Pivot-SD эффективно улучшает производительность модели LLaDA-8B на задачах математики и программирования, используя при этом минимальное количество данных для обучения.'}, 'en': {'title': 'Targeted Training for Enhanced Reasoning in dLMs', 'desc': "Masked diffusion language models (dLMs) are a new type of model that can reason in parallel, unlike traditional autoregressive models. They struggle with credit assignment because early decisions during the denoising process greatly influence the final output. The paper introduces Pivot-SD, a method that focuses on training only the most impactful decisions, called pivots, based on how much they reduce uncertainty in the model's predictions. By using this targeted approach, Pivot-SD significantly enhances the performance of the LLaDA-8B-Instruct model on various tasks, demonstrating its effectiveness over previous training methods."}, 'zh': {'title': '高效自我蒸馏：提升掩蔽扩散语言模型的关键承诺', 'desc': '本文介绍了一种新的自我蒸馏框架，称为Pivot-SD，旨在提高掩蔽扩散语言模型（dLMs）的性能。该方法专注于选择对模型输出影响最大的承诺（即枢轴），并通过信息增益度量来选择这些承诺。Pivot-SD使用交叉熵训练成功的枢轴，而对失败的轨迹则使用目标不可能性进行训练，从而优化模型的学习过程。实验结果表明，Pivot-SD在数学和代码基准测试中显著提升了LLaDA-8B-Instruct的表现。'}}}, {'id': 'https://huggingface.co/papers/2609.39071', 'title': 'LexReward: A Taxonomy-Driven Reward Framework for Legal Language Models', 'url': 'https://huggingface.co/papers/2609.39071', 'abstract': 'Abstract  Legal language models require reward signals that capture not only answer correctness but also the multidimensional quality of legal responses. Existing reward methods, however, often rely on coarse-grained holistic judgments, providing limited domain specificity and interpretability. We introduce LexReward, a taxonomy-driven framework for legal reward modeling. LexReward characterizes legal response quality along three complementary dimensions: Style, covering lexical and syntactic quality; Element, assessing legal subjects, facts, statutes, and decisions; and Chain, evaluating the order, completeness, correctness, and non-redundancy of legal reasoning. For each dimension, we develop rubrics that specify evaluation criteria and quality levels. The resulting rewards are used to construct pairwise preference data for Direct Preference Optimization (DPO) and reward-model training. Experiments show that the rubric-based rewards reliably distinguish legal responses of different quality and that DPO training on the preference data improves performance across all three dimensions. The learned reward models, LexRM, also support effective downstream optimization: each dimension-specific reward model improves policy performance in its corresponding dimension through reinforcement learning, without requiring reference answers at reward time. Dimension-wise analyses further support the effectiveness of the proposed taxonomy and reward construction.', 'score': 47, 'issue_id': 3375, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': 'bd12d46e7a65251a', 'authors': ['Yida Cai', 'Xin Dai', 'Bingxiang He', 'Huiyuan Xie', 'Yuxiao Ye', 'Zhenghao Liu', 'Yang Bai', 'Zhiyuan Liu'], 'affiliations': ['Northeastern University', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2609.39071.jpg', 'data': {'categories': [], 'emoji': '⚖️', 'ru': {'title': 'Многомерное вознаграждение для юридических языковых моделей через таксономию качества', 'desc': 'Авторы предложили LexReward — фреймворк для моделирования функции вознаграждения в юридических языковых моделях, основанный на многомерной таксономии качества ответов. Они выделили три ключевых измерения: Стиль (лексическое и синтаксическое качество), Элемент (оценка юридических объектов и норм) и Цепь (корректность логики рассуждений). На основе разработанных рубрик авторы создали данные парных предпочтений для обучения моделей через Direct Preference Optimization и обучения моделей вознаграждения. Эксперименты показали, что полученные reward-модели LexRM эффективно улучшают качество юридических ответов по всем трём измерениям без использования эталонных ответов во время оценки.'}, 'en': {'title': 'LexReward: A Multidimensional Approach to Legal Response Quality', 'desc': 'This paper presents LexReward, a new framework for evaluating the quality of legal language models. Unlike traditional methods that use broad judgments, LexReward breaks down legal response quality into three specific dimensions: Style, Element, and Chain. Each dimension has its own set of criteria for assessment, allowing for a more nuanced evaluation of legal responses. The framework enhances the training of reward models through Direct Preference Optimization, leading to improved performance in generating high-quality legal responses.'}, 'zh': {'title': '法律响应质量的多维评估与优化', 'desc': '本论文提出了一种新的法律语言模型奖励框架，称为LexReward。该框架通过三个互补维度来评估法律响应的质量：风格、要素和链条。风格关注词汇和句法质量；要素评估法律主题、事实、法规和判决；链条则评估法律推理的顺序、完整性、正确性和非冗余性。实验表明，基于评分标准的奖励能够有效区分不同质量的法律响应，并且通过直接偏好优化（DPO）训练可以提升模型在各个维度上的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.00531', 'title': 'Science or Slop?: Benchmarking and Mitigating Scientific Slop in AI-Generated Papers', 'url': 'https://huggingface.co/papers/2610.00531', 'abstract': 'Abstract  AI-generated content, often called AI slop, is increasingly common everywhere, particularly in academia. Slop in AI-generated scientific papers, however, has more complex patterns that cannot be easily detected by existing token-based AI detectors. Each part of such a paper looks plausible while the scientific reasoning that connects the parts breaks down, which can mislead how readers assess the work. We benchmark these failures as scientific slop through six measures across Structure, Argument, and Artifacts. We construct SciSlopBench with 390 AI-generated papers, mostly in computer science but spanning the life, social, and natural sciences, each paired with a human-written paper matched by research problem and contribution type. Our measures identify the AI paper in each pair with 85.9% accuracy, compared with 68.7% for Binoculars. Higher scientific slop accompanies lower ICLR ratings and distinguishes rejected from accepted papers above chance in every year from 2017 to 2025. Reducing these patterns, however, is not as simple as directly optimizing the measures. We therefore propose SciSlopHarness, a harness-level framework that guides a fixed LLM to revise slop only where the experiment records support the change. While standard revisions leave residual slop and direct slop-aware prompting triggers reward hacking, SciSlopHarness reduces the remaining AI-human gap by 63% over the strongest revision baseline without requiring human reference targets. Overall, we demonstrate that AI-generated scientific papers leave fundamental traces in their global reasoning, and that responsible mitigation demands strict evidentiary grounding rather than mere prose refinement.', 'score': 47, 'issue_id': 3374, 'pub_date': '2026-09-30', 'pub_date_card': {'ru': '30 сентября', 'en': 'September 30', 'zh': '9月30日'}, 'hash': '31759cb2912857f8', 'authors': ['Yerim Oh', 'Young-Jun Lee', 'Jaewoo Ahn', 'Gunhee Kim', 'Dongyeop Kang'], 'affiliations': ['Seoul National University', 'University of Minnesota'], 'pdf_title_img': 'assets/pdf/title_img/2610.00531.jpg', 'data': {'categories': ['#benchmark', '#dataset'], 'emoji': '🔬', 'ru': {'title': 'Глобальная логика выдаёт AI: как выявить и исправить научный слоп в генеративных статьях', 'desc': 'В работе исследуется проблема выявления AI-генерируемых научных статей, которые имеют правдоподобные отдельные части, но нарушают научную логику в целом. Авторы предлагают SciSlopBench — набор данных из 390 AI-генерируемых статей, парных с человеческими работами, и определяют шесть метрик для измерения научной несостоятельности по структуре, аргументации и артефактам. Их метрики достигают точности 85.9% в классификации AI-статей против 68.7% для существующих детекторов, и показывают корреляцию с оценками рецензентов. Они разрабатывают SciSlopHarness — фреймворк на уровне промпт-инженеринга, который направляет большую языковую модель исправлять только те ошибки, которые поддержаны экспериментальными данными, достигая снижения зазора между AI и человеческим текстом на 63% без необходимости в эталонных текстах.'}, 'en': {'title': 'Identifying and Mitigating AI-Generated Scientific Slop', 'desc': "This paper discusses the issue of AI-generated content in scientific papers, which often appears plausible but lacks coherent scientific reasoning. The authors introduce a benchmark called SciSlopBench, which evaluates AI-generated papers against human-written ones using six measures related to structure, argument, and artifacts. They find that AI-generated papers can be identified with high accuracy, and that higher levels of 'scientific slop' correlate with lower acceptance rates in academic conferences. To address these issues, they propose a framework called SciSlopHarness that helps improve the quality of AI-generated content by ensuring revisions are based on solid evidence rather than superficial changes."}, 'zh': {'title': '揭示AI生成论文中的科学垃圾', 'desc': '这篇论文探讨了AI生成的科学论文中存在的复杂问题，称之为科学垃圾（slop）。这些论文的各个部分看似合理，但它们之间的科学推理却存在断裂，可能误导读者的判断。研究者们通过构建SciSlopBench，使用390篇AI生成的论文进行评估，发现AI论文的识别准确率达85.9%。为了解决这些问题，论文提出了SciSlopHarness框架，旨在通过证据支持的方式修正AI生成内容中的科学垃圾。'}}}, {'id': 'https://huggingface.co/papers/2610.02304', 'title': 'SimuVerity: Benchmarking Agents for Engineering-Grade Simulink Model Generation', 'url': 'https://huggingface.co/papers/2610.02304', 'abstract': "Abstract  Existing Simulink benchmarks mainly evaluate whether generated models compile, execute, or resemble a reference model. These criteria do not establish whether a model satisfies its engineering requirements. We introduce SimuVerity, a benchmark of 101 text-to-executable Simulink model-generation tasks across ten engineering domains. For each task, executable-system profiles ground the engineering specification and four families of native simulation scenarios. A hierarchical evaluator first checks artifact delivery, native executability, and engineering qualification, then scores qualified models across six dimensions covering accuracy, output quality, mechanistic fidelity, control and causal integrity, operating-domain robustness, and dynamic response. We evaluate six agent systems with SimuVerity. The best system achieves an overall score of only 42.86. The results show that structural similarity is a poor proxy for engineering performance: capability bottlenecks arise both in producing qualified implementations and in satisfying multidimensional requirements after qualification. Meanwhile, some high-scoring models still exhibit severe visual-layout disorder. SimuVerity provides a systematic basis for assessing agents' engineering capabilities and diagnosing failures in executable Simulink model generation.", 'score': 45, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '101af339bc396f7d', 'authors': ['Ruiqi Zhang', 'Jiahao Wang', 'Mingxuan Li', 'Haichen Luo', 'Chaoting Wang', 'Guoyu Mou', 'Keyu Lai', 'Hanchao Lv', 'Jiaxu Wang', 'Yibo Zheng', 'Aijun Yang', 'Xiaohua Wang'], 'affiliations': ['Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.02304.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🏗️', 'ru': {'title': 'Системная оценка инженерного качества генерируемых моделей Simulink', 'desc': 'В статье представлена SimuVerity — комплексный бенчмарк для оценки моделей Simulink, сгенерированных из текстовых описаний, включающий 101 задачу в десяти инженерных областях. Оценка модели проводится иерархически: сначала проверяется корректность генерации и исполняемость, затем анализируется соответствие инженерным требованиям по шести критериям, включая точность, механистическую корректность и устойчивость к различным условиям. Авторы показали, что структурное сходство с референсными моделями не гарантирует выполнение инженерных спецификаций — лучшие модели достигли только 42,86% от максимального балла. Результаты выявляют критические пробелы в способности агентов генерировать качественные инженерные решения и одновременно удовлетворять многомерным требованиям.'}, 'en': {'title': 'SimuVerity: Beyond Compilation to Engineering Excellence in Simulink Models', 'desc': 'The paper introduces SimuVerity, a new benchmark designed to evaluate the generation of Simulink models based on engineering requirements rather than just their ability to compile or execute. It consists of 101 tasks across various engineering domains, each with specific executable-system profiles and simulation scenarios. A hierarchical evaluation process assesses models on multiple dimensions, including accuracy and robustness, revealing that structural similarity does not guarantee engineering performance. The findings highlight the challenges in producing qualified models and the need for better assessment methods in executable model generation.'}, 'zh': {'title': 'SimuVerity：评估Simulink模型生成的工程能力', 'desc': '现有的Simulink基准主要评估生成的模型是否可以编译、执行或与参考模型相似。这些标准并不能确定模型是否满足工程要求。我们引入了SimuVerity，这是一个涵盖十个工程领域的101个文本到可执行Simulink模型生成任务的基准。SimuVerity为评估代理系统的工程能力提供了系统基础，并帮助诊断可执行Simulink模型生成中的失败。'}}}, {'id': 'https://huggingface.co/papers/2610.00972', 'title': 'VeriHarness: Scaling Agentic Verification for Long-Horizon Tasks', 'url': 'https://huggingface.co/papers/2610.00972', 'abstract': 'Abstract  As LLM agents undertake increasingly complex, long-horizon tasks, verifying their outputs becomes increasingly challenging. We study how verification capability can be strengthened with a fixed base model, without access to reference answers or grading rubrics at test time. Repeated sampling yields multiple rollouts that can contain complementary correct claims, but we need a reliable verification mechanism to determine which claims to trust. We first find that disagreement often exposes correct alternatives, while consensus can conceal errors. These observations motivate VeriHarness, which turns the underlying LLM a generator uses into an agentic verifier by giving it a workspace, evidence tools, and reusable verification skills. A disagreement resolver checks competing claims against environmental evidence, while a consensus challenger tests shared claims and searches for omitted requirements. Their findings guide the selection and revision of the final artifact. Across five long-horizon workspace benchmarks and two frontier models, VeriHarness achieves the highest selection scores among the evaluated baselines. Evidence-backed revision further improves average performance, bringing gains over a single rollout to 6.2 points with Gemini 3.5 Flash and 6.4 points with Claude Opus 4.8. We further show that verification skills can self-improve from failure feedback, demonstrating VeriHarness as a novel and critical approach for scaling long-horizon agentic verification. We release the full pool of approximately 26,000 rollouts across all five benchmarks and both models, produced at a cost of over $100,000, to support future research on agentic verification.', 'score': 44, 'issue_id': 3375, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '7185e62946388501', 'authors': ['Caiqi Zhang', 'Rujun Han', 'Zifeng Wang', 'Zoey CuiZhu', 'Nigel Collier', 'Tomas Pfister', 'Chen-Yu Lee'], 'affiliations': ['Google Cloud AI Research', 'University of Cambridge'], 'pdf_title_img': 'assets/pdf/title_img/2610.00972.jpg', 'data': {'categories': [], 'emoji': '🔍', 'ru': {'title': 'Многоагентная верификация через разногласие и доказательства', 'desc': 'В этой работе исследуется проблема верификации выходов LLM агентов при выполнении сложных долгоговых задач без доступа к эталонным ответам. Авторы заметили, что несогласие между несколькими генерациями часто выявляет правильные альтернативы, а консенсус может скрывать ошибки. Они предложили VeriHarness — метод, превращающий генератор в проверяющего агента с помощью рабочего пространства, инструментов поиска доказательств и переиспользуемых навыков верификации. На пяти тестовых наборах VeriHarness показал лучшие результаты отбора вариантов и позволил улучшить качество ответов на 6-6.4 балла благодаря исправлениям на основе найденных доказательств.'}, 'en': {'title': 'Empowering LLM Verification with VeriHarness', 'desc': 'This paper addresses the challenge of verifying outputs from large language model (LLM) agents when they perform complex tasks. It introduces VeriHarness, a system that enhances verification capabilities without needing reference answers during testing. The approach leverages disagreement among multiple outputs to identify correct alternatives and uses a disagreement resolver and consensus challenger to validate claims against evidence. The results show that VeriHarness significantly improves performance on long-horizon tasks, demonstrating its potential for effective agentic verification in machine learning applications.'}, 'zh': {'title': '增强LLM代理的验证能力', 'desc': '随着大型语言模型（LLM）代理执行越来越复杂的长期任务，验证其输出变得愈加困难。我们研究了如何在没有参考答案或评分标准的情况下，利用固定的基础模型增强验证能力。通过重复采样，可以获得多个可能包含互补正确声明的结果，但需要一个可靠的验证机制来判断哪些声明值得信任。我们提出了VeriHarness，它将基础LLM转变为一个具有代理验证能力的工具，通过提供工作空间、证据工具和可重用的验证技能来实现。'}}}, {'id': 'https://huggingface.co/papers/2610.02298', 'title': 'EditHero: A Benchmark for Long-Horizon Part-Level 3D Editing and Vibe Modeling', 'url': 'https://huggingface.co/papers/2610.02298', 'abstract': 'Abstract  3D editing methods are usually tested on a single edit, yet an asset is built through a long sequence of revisions, each of which must implement the requested change while leaving everything else unchanged. We introduce EditHero, to our knowledge the first benchmark for long-horizon, part-level 3D editing, with natural-language instructions and target images for both geometry and texture. A deterministic assembly engine produces the exact target after every edit, and every sequence is reviewed by hand. We use EditHero to compare 2 opposite approaches to 3D editing. Non-agentic methods operate top down, regenerating the object from a learned 3D representation and inferring what to keep. In contrast, LLM/VLM agents operate bottom up, editing through code that inspects the mesh and rewrites only the parts required by instructions. The non-agentic methods often miss the requested change and disturb regions that should stay fixed. Most LLMs follow instructions more closely, and all of them preserve the unedited parts better, but each of their edits takes minutes. We will release the engine and the edit sequences to support research on reliable iterative 3D editing.', 'score': 44, 'issue_id': 3374, 'pub_date': '2026-10-01', 'pub_date_card': {'ru': '1 октября', 'en': 'October 1', 'zh': '10月1日'}, 'hash': '1d8259373b3f9556', 'authors': ['Ruihan Yu', 'Yu-Ju Tsai', 'Muyao Niu', 'Runyi Li', 'Lian Fu', 'Hanqing Liu', 'Zheng-Hui Huang', 'Yonghao Yu', 'Sho Kuno', 'Ming-Hsuan Yang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab', 'Institute of Science Tokyo', 'The University of Tokyo', 'University of California, Merced'], 'pdf_title_img': 'assets/pdf/title_img/2610.02298.jpg', 'data': {'categories': ['#agents', '#3d', '#benchmark', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Сравнение подходов к многошаговому редактированию 3D-объектов через естественный язык', 'desc': 'В статье представлен EditHero — первый бенчмарк для долгосрочного редактирования 3D-моделей на уровне отдельных частей с использованием естественного языка и целевых изображений. Авторы сравнивают два подхода: традиционные методы на основе регенерации объекта из скрытого представления и агентские методы, использующие LLM/VLM для редактирования через анализ сетки. Неагентские методы часто пропускают требуемые изменения и нарушают неизменяемые части, тогда как LLM-агенты более точно следуют инструкциям и лучше сохраняют остальную геометрию, но требуют больше времени на каждое редактирование. Авторы планируют выпустить движок и наборы данных для развития исследований в области надёжного итеративного редактирования 3D-моделей.'}, 'en': {'title': 'EditHero: Revolutionizing 3D Editing with Precision and Control', 'desc': 'This paper presents EditHero, a new benchmark for evaluating long-horizon, part-level 3D editing using natural language instructions and target images. It contrasts two approaches: non-agentic methods that regenerate the entire object from a learned representation, and LLM/VLM agents that edit specific parts of the mesh based on instructions. The study finds that while non-agentic methods often disrupt unedited areas, LLMs are better at following instructions and preserving the original structure, albeit with slower editing times. The authors aim to support further research by releasing their editing engine and sequences for public use.'}, 'zh': {'title': 'EditHero：长时间3D编辑的新基准', 'desc': '这篇论文介绍了EditHero，这是第一个用于长时间、部分级别3D编辑的基准测试工具。它使用自然语言指令和目标图像来指导几何和纹理的编辑。研究比较了两种不同的3D编辑方法：非智能方法和基于大语言模型（LLM）的方法。结果表明，LLM方法在遵循指令和保持未编辑部分方面表现更好，但每次编辑的时间较长。'}}}, {'id': 'https://huggingface.co/papers/2610.03632', 'title': 'World Embedding Benchmark', 'url': 'https://huggingface.co/papers/2610.03632', 'abstract': 'Abstract  Physical fidelity has received increasing attention in world models and video generation, yet how video representations encode physical information remains less understood. We introduce the World Embedding Benchmark, comprising 8,000 controlled simulation cases from 80 families spanning fluid mechanics, solid mechanics, dynamics, and optics & electromagnetism. Each case pairs a rendered video with simulation-derived physical annotations, supporting three complementary tasks: text-video retrieval, physical-property regression, and multiple-choice video-description pair classification. We use these tasks to distinguish cross-modal physical alignment from the recoverability of quantitative physical information. Evaluated pre-trained omnimodal embedding models show weak retrieval and near-chance within-family pair classification, while lightweight probes recover useful physical information from frozen video embeddings. Continual contrastive training with physics-specific video-text pairs improves retrieval and pair classification but degrades physical-property regression, revealing a trade-off between alignment and quantitative information recoverability. Finally, we use the embeddings to retrieve reference videos for retrieval-augmented generation with MiniMax-H3. Retrieved references improve the physical fidelity of generated videos, with stronger retrieval models yielding larger gains in our experiments. Together, these findings highlight the need to evaluate physical alignment and property recoverability jointly, and demonstrate the utility of physical representations for improving video generation.', 'score': 41, 'issue_id': 3374, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': '1c5bd1b9b2a53b7f', 'authors': ['Yiqi Liu', 'Ruifeng Yuan', 'Yang Wang', 'Long Li', 'Fengyu Cai', 'Hou Pong Chan', 'Jialin Yu', 'Hao Zhang', 'Chenghua Lin', 'Chenghao Xiao'], 'affiliations': ['github.com/World-Representation-Lab/World-Embedding-Benchmark', 'huggingface.co/World-Representation-Lab/world-embedding-benchmark'], 'pdf_title_img': 'assets/pdf/title_img/2610.03632.jpg', 'data': {'categories': ['#benchmark', '#science', '#multimodal', '#video', '#rag', '#dataset'], 'emoji': '🌊', 'ru': {'title': 'Физическая осведомлённость в видеопредставлениях мировых моделей', 'desc': 'Авторы представляют World Embedding Benchmark — набор данных из 8000 контролируемых симуляций для оценки того, как видеомодели кодируют физическую информацию. Бенчмарк включает три взаимодополняющие задачи: поиск видео по текстовому описанию, регрессию физических свойств и классификацию пар видео-описание. Исследование показывает, что современные мультимодальные модели слабо захватывают физическую информацию, и выявляет конфликт между выравниванием представлений и восстанавливаемостью количественных физических характеристик. Демонстрируется, что физические представления, полученные через retrieval-augmented generation, улучшают физическую реалистичность синтезируемых видео.'}, 'en': {'title': 'Enhancing Video Generation through Physical Representation Evaluation', 'desc': 'This paper introduces the World Embedding Benchmark, which consists of 8,000 simulation cases across various physical domains. It aims to understand how video representations encode physical information through tasks like text-video retrieval and physical-property regression. The study finds that while pre-trained models struggle with retrieval tasks, using physics-specific training improves performance but may compromise quantitative information recovery. Ultimately, the research emphasizes the importance of balancing physical alignment and information recoverabil
