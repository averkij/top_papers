    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2610.06100', 'title': 'From Traces to Agentic Worlds: Agentic Language World Models for Interactive Environment Simulation', 'url': 'https://huggingface.co/papers/2610.06100', 'abstract': "Abstract  Realistic environment replicas are increasingly valuable for training and evaluating LLM agents, yet the original systems may be inaccessible or impractical to reproduce. We explore agentic language world modeling: rather than rebuilding an executable environment, a world model agent serves as the environment for a task agent and supports faithful and stateful simulation. We instantiate this paradigm with Trace2Env, a learning-free framework for settings where the original system is unavailable but historical interaction traces remain accessible. Trace2Env reconstructs these traces into a reusable environment worldbook containing environment schemas, grounded evidence, and induced behavioral knowledge. At runtime, the world model agent actively consults the worldbook together with persistent episodic state to infer each action's observation and lasting state effects. Across nine environments, Trace2Env improves both next-observation fidelity and long-horizon interaction consistency over conventional prompt-based LWMs. In multi-turn interaction, task agent actions generated against Trace2Env remain valid more often when replayed in the real environment, indicating that its simulated dynamics better preserve the consequences of earlier actions across successive turns. These results establish agentic language world modeling as an alternative direction for building realistic environment replicas without reconstructing the original executable system.", 'score': 70, 'issue_id': 3389, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'b03b20df59925f00', 'authors': ['Quanyu Long', 'Xiao Chen', 'Jianda Chen', 'Haozhen Zhang', 'Qisheng Hu', 'Jianzhu Bao', 'Wenya Wang'], 'affiliations': ['Nanyang Technological University', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2610.06100.jpg', 'data': {'categories': [], 'emoji': '🌍', 'ru': {'title': 'Языковые модели как симуляторы реальных миров', 'desc': 'В работе предложен подход к созданию реалистичных моделей окружения для обучения LLM-агентов без необходимости воссоздавать исходную систему. Вместо этого используется агентический языковой мир, где модель мира сама служит окружением для агента-задачи, обеспечивая точное и сохраняющее состояние моделирование. Фреймворк Trace2Env восстанавливает исторические трассы взаимодействия в переиспользуемое окружение с описанием схем, обоснованными доказательствами и индуцированными поведенческими правилами. Экспериментальные результаты показывают, что Trace2Env превосходит обычные LWM-подходы по точности предсказания наблюдений и консистентности взаимодействия на больших горизонтах, что подтверждается валидностью действий при воспроизведении в реальном окружении.'}, 'en': {'title': 'Revolutionizing Environment Simulation with Trace2Env', 'desc': 'This paper introduces a new approach called agentic language world modeling, which allows for the creation of realistic environment replicas without needing to rebuild the original systems. The proposed framework, Trace2Env, utilizes historical interaction traces to create a worldbook that contains essential information about the environment. By using this worldbook, a world model agent can simulate the environment and predict the outcomes of actions based on past interactions. The results show that Trace2Env enhances the accuracy of next-observation predictions and maintains consistency in long-term interactions compared to traditional methods.'}, 'zh': {'title': '代理语言世界建模：无需重建系统的环境复制新方法', 'desc': '本文探讨了一种新的方法，称为代理语言世界建模，用于训练和评估大型语言模型（LLM）代理。我们提出了Trace2Env框架，它利用历史交互轨迹重建环境，而无需实际重建原始系统。该框架创建了一个可重用的环境世界书，包含环境模式、基础证据和行为知识。在多个环境中，Trace2Env在观察精度和长期交互一致性方面优于传统的基于提示的语言模型。'}}}, {'id': 'https://huggingface.co/papers/2610.12242', 'title': 'TokenRouter: Efficient Serving System for Token-Level LLM Routing', 'url': 'https://huggingface.co/papers/2610.12242', 'abstract': 'Abstract  Large language model (LLM) routing distributes inference work across different models, advancing the cost-quality Pareto frontier of LLM serving. While coarse-grained routing at the session or query level has been widely adopted in production systems, recent algorithmic work shows that fine-grained token-level routing can yield substantial efficiency and quality gains. However, efficiently serving token-level routed inference poses significant challenges to existing systems. Built on single-LLM assumptions, current systems suffer from severe step desynchronization and frequent batch admission delays under token-level routing, and they also impose high implementation complexity on developers. To address these challenges, we design TokenRouter, an efficient and developer-friendly serving system for token-level routed LLM inference. TokenRouter follows the principle of request-centric programming, model-centric execution: developers describe routing logic from the perspective of a single request, while the runtime launches a subserver for each LLM and dispatches requests asynchronously. Each subserver employs a delayed-batching scheduler, whose optimal hyperparameters are derived from a mathematical throughput model of the system. Across diverse routing algorithms, workloads, and model pairs, TokenRouter achieves 2.01-64.15x higher decoding throughput than existing systems, substantially advancing the serving efficiency of token-level LLM routing. Our code is available at https://github.com/thu-nics/TokenRouter.', 'score': 54, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '1fb51eed8ecd42bd', 'authors': ['Tianyu Fu', 'Tengxuan Liu', 'Ruoxi Wang', 'Yixin Dong', 'Yi Ge', 'Yichen You', 'Yu Wang'], 'affiliations': ['Carnegie Mellon University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12242.jpg', 'data': {'categories': ['#inference'], 'emoji': '🧭', 'ru': {'title': 'Маршрутизация токенов для эффективного обслуживания LLM', 'desc': 'В работе представлена система TokenRouter для эффективного обслуживания больших языковых моделей с маршрутизацией на уровне отдельных токенов. Авторы предлагают архитектуру, построенную на принципе программирования, ориентированного на запросы, но выполняемую моделями параллельно через асинхронную диспетчеризацию. Каждая модель работает с независимым сервером, использующим оптимизированный планировщик с отложенной батчизацией, параметры которого выведены из математической модели пропускной способности. Система демонстрирует улучшение пропускной способности на этапе декодирования в 2-64 раза по сравнению с существующими решениями.'}, 'en': {'title': 'TokenRouter: Revolutionizing Token-Level Routing for LLMs', 'desc': 'This paper introduces TokenRouter, a new system designed to improve the efficiency of token-level routing in large language model (LLM) inference. Traditional systems struggle with delays and complexity when handling token-level routing, which can lead to inefficiencies. TokenRouter simplifies this process by allowing developers to focus on individual requests while managing multiple LLMs asynchronously. The system significantly enhances decoding throughput, achieving up to 64 times better performance compared to existing methods, thus optimizing the cost-quality balance in LLM serving.'}, 'zh': {'title': 'TokenRouter：高效的令牌级路由推理系统', 'desc': '这篇论文介绍了一种名为TokenRouter的高效系统，用于处理基于令牌的语言模型（LLM）推理。传统的粗粒度路由在会话或查询级别上已经被广泛应用，但细粒度的令牌级路由可以显著提高效率和质量。现有系统在处理令牌级路由时面临严重的步调不同步和批量接纳延迟等挑战。TokenRouter通过请求中心编程和模型中心执行的原则，优化了开发者的使用体验，并在多种路由算法和模型对比中实现了显著的解码吞吐量提升。'}}}, {'id': 'https://huggingface.co/papers/2610.12126', 'title': 'SuperNav: An Agentic Navigation System for Any Task in Any Scene', 'url': 'https://huggingface.co/papers/2610.12126', 'abstract': 'Abstract  General-purpose service robots need navigation systems that can handle diverse human requests in unfamiliar environments, combining task generality with scene generality. Some existing methods fine-tune multimodal large language models (MLLMs) to predict navigation actions, making their behavior dependent on the coverage of navigation training data and potentially limiting generalization to new requests and environments. Our key insight is to let the MLLM focus on interpreting requests, understanding scenes, and making decisions while preserving its general-purpose capabilities and delegating motion execution to navigation tools. To realize this idea, we introduce SuperNav, which equips a pretrained MLLM with a specialized agent harness without navigation-specific fine-tuning of the MLLM. Our harness supports these decisions with Navigation Skills, agent-oriented Tools for physical interaction, and task-progress and context management. A unified visual-point interface connects decision-making to motion by allowing the model to specify destinations directly in images and revise its decisions from execution feedback. Together, these components support sustained navigation across different task requirements and environments. SuperNav outperforms four evaluated baselines on instance-level, multi-object, and demand-driven tasks. Category-level evaluation on HM3D and deployment on a real quadruped robot further demonstrate its applicability across environments. Project Page: https://zju3dv.github.io/SuperNav/', 'score': 52, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'e0fb2132770b29ac', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#robotics', '#multimodal', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Универсальная навигация роботов через делегирование: думай отдельно от движения', 'desc': 'SuperNav — это система навигации для роботов, которая использует предварительно обученную мультимодальную языковую модель (MLLM) без специальной дорогостоящей доп обучения на навигационных данных. Ключевая идея заключается в том, чтобы оставить MLLM ответственной за интерпретацию команд, анализ сцены и принятие решений, а физическое движение робота делегировать специализированным инструментам навигации. Система использует единый визуально-точечный интерфейс, который позволяет модели указывать целевые точки прямо на изображениях и корректировать свои решения на основе обратной связи от исполнения. SuperNav демонстрирует превосходную производительность на различных типах задач и успешно работает как в симуляции, так и на реальных квадруподных роботах.'}, 'en': {'title': 'Empowering Robots with Smart Navigation: SuperNav Unleashed!', 'desc': 'This paper presents SuperNav, a navigation system for service robots that combines the strengths of multimodal large language models (MLLMs) with specialized navigation tools. Instead of fine-tuning the MLLM for specific navigation tasks, SuperNav allows the model to interpret human requests and understand scenes while delegating the execution of navigation actions to dedicated tools. The system features a visual-point interface that connects decision-making to physical movement, enabling the robot to specify destinations in images and adjust its actions based on feedback. SuperNav demonstrates superior performance in various navigation tasks and shows its effectiveness in real-world environments, making it a versatile solution for general-purpose service robots.'}, 'zh': {'title': 'SuperNav：通用服务机器人的智能导航解决方案', 'desc': '本论文提出了一种名为SuperNav的导航系统，旨在帮助通用服务机器人在复杂环境中处理多样化的人类请求。与现有方法不同，SuperNav不对多模态大语言模型（MLLM）进行特定的导航微调，而是让其专注于理解请求和场景，并做出决策。该系统通过导航技能和工具支持物理交互，并通过统一的视觉接口将决策与运动连接起来。实验结果表明，SuperNav在多种任务中表现优于四个基线模型，证明了其在不同环境中的适用性。'}}}, {'id': 'https://huggingface.co/papers/2610.08215', 'title': 'Learn2Play Bench: How Well Do LLM Agents Learn from Experience in Unfamiliar Environments?', 'url': 'https://huggingface.co/papers/2610.08215', 'abstract': "Abstract  Learning from experience is essential for LLM agents to adapt to unfamiliar and dynmaic environments. Evaluating this ability is therefore important for understanding how effectively agents acquire and use new knowledge. Existing benchmarks have sought to evaluate this ability, but they primarily evaluate tasks whose rules are provided in the instructions or already familiar to pretrained models, making it difficult to distinguish learning from interactions from reasoning with existing knowledge. To address this, we introduce Learn2Play Bench, a benchmark of newly designed text-based games, whose rules are novel or counterintuitive, requiring agents to acquire knowledge through interaction rather than rely solely on pretrained knowledge. These games provide reproducible feedback and automatic scoring, enabling controlled evaluation of learning across repeated attempts. We also vary game instances to test whether agents can apply what they have learned to new situations. Therefore, we evaluate how backbone models, self-evolving methods, and agent harnesses affect agents' learning ability, revealing three findings: (1) Experience retention: Retaining complete records of actions and feedback can support more effective learning than summarizing these experiences into rules or strategies. (2) Human agent gap: Top-performing human players achieve higher peak scores than the evaluated agents. Human explore more varied strategies, and repeat actions less. (3) Harness matters: With the backbone fixed, changing the harness can improve performance while reducing estimated inference cost. Together, these findings provide insights into how LLM agents learn from experience and suggest directions for future work to improve their learning ability. Project website: https://liushiliushi.github.io/learn2play-bench-website/", 'score': 50, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '88d0d22f4138ebfb', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#dataset', '#games', '#agents', '#benchmark'], 'emoji': '🎮', 'ru': {'title': 'Учение через опыт: как агенты на основе LLM овладевают новыми навыками', 'desc': 'В статье представлен Learn2Play Bench — бенчмарк текстовых игр с новыми и неинтуитивными правилами для оценки способности LLM агентов учиться на основе взаимодействия с окружением. Авторы показывают, что сохранение полной истории действий и обратной связи способствует более эффективному обучению, чем сокращение опыта в виде правил или стратегий. Исследование выявило значительный разрыв между агентами на основе больших языковых моделей и человеческими игроками, где люди исследуют более разнообразные стратегии и реже повторяют действия. Результаты показывают, что выбор правильной архитектуры агента оказывает значительное влияние на способность к обучению независимо от базовой модели.'}, 'en': {'title': 'Learn to Adapt: Evaluating LLM Agents in Dynamic Environments', 'desc': 'This paper introduces Learn2Play Bench, a new benchmark designed to evaluate how large language model (LLM) agents learn from experience in dynamic environments. Unlike previous benchmarks, which often rely on familiar tasks, this benchmark features novel text-based games that require agents to learn through interaction rather than pre-existing knowledge. The study reveals key insights, such as the importance of retaining complete records of actions for effective learning, the performance gap between human players and agents, and the impact of different harness configurations on agent performance. These findings highlight the need for improved learning strategies in LLM agents and suggest future research directions.'}, 'zh': {'title': '通过互动学习，提升LLM代理的能力', 'desc': '本论文探讨了大型语言模型（LLM）代理在动态环境中学习新知识的能力。我们提出了Learn2Play Bench，这是一个新设计的基于文本的游戏基准，旨在评估代理通过互动获取知识的能力，而不是依赖预训练知识。研究发现，完整记录行动和反馈有助于更有效的学习，而人类玩家在策略多样性和行动重复性方面表现更佳。此外，改变代理的使用方式可以在固定模型的情况下提高性能并降低推理成本。'}}}, {'id': 'https://huggingface.co/papers/2610.12374', 'title': 'AgentGarten: Code Worlds for Evolving Agents', 'url': 'https://huggingface.co/papers/2610.12374', 'abstract': 'Abstract  Interactive virtual worlds allow agents to learn through exploration and interaction. What agents can learn is bounded by the environments they practice in, which must be faithful, with consistent state, rules, and dynamics, and realistic, with observations that follow the real-world visual distributions. Achieving both across diverse worlds remains a bottleneck. We introduce AgentGarten, a framework that couples simulators and game engines with a shared neural renderer to build real-time interactive environments. Its simulation backends maintain persistent world state and execute program-defined interaction rules, while the renderer generates visual observations from structured conditions exported through a common interface. To build the neural renderer, we adapt a pretrained video model to geometry conditions, distill it with our proposed Adversarial Forcing, and optimize inference for real-time interaction. Adversarial Forcing makes history prefilling differentiable through exact replay, so that losses on later predictions update how the renderer encodes prior observations, and adds real-data adversarial supervision to improve its visual quality. In AgentGarten, agents perceive the world through visual observations, interact with it in real time, and improve by distilling each round of experience into playbooks that subsequent agents inherit and refine. Our empirical study demonstrates a substantial gain in learning efficiency, with agents learning from just 4 rounds compared with millions for a conventional reinforcement learning counterpart. As new worlds can be written as code and rendered through the same interface, environments can scale in both number and difficulty alongside their agents, a step toward agents that keep evolving through interactive experience.', 'score': 48, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8075cfc9a1317e38', 'pdf_title_img': 'assets/pdf/title_img/2610.12374.jpg', 'data': {'categories': ['#cv', '#games', '#rl', '#agents', '#3d', '#video', '#optimization'], 'emoji': '🎮', 'ru': {'title': 'Нейронный рендерер для эффективного обучения агентов в интерактивных мирах', 'desc': 'AgentGarten — это фреймворк, который объединяет симуляторы и игровые движки с нейронным рендерером для создания интерактивных виртуальных окружений в реальном времени. Система использует предварительно обученную видеомодель, адаптированную к геометрическим условиям, и применяет метод Adversarial Forcing для дифференцируемого кодирования истории наблюдений. Агенты обучаются через взаимодействие с окружением, достигая высокой эффективности обучения благодаря дистилляции опыта в переиспользуемые стратегии (playbooks). Подход демонстрирует значительное ускорение обучения — агенты улучшают свои навыки за 4 раунда вместо миллионов итераций в традиционном reinforcement learning.'}, 'en': {'title': 'AgentGarten: Accelerating Agent Learning in Interactive Worlds', 'desc': 'The paper presents AgentGarten, a framework designed to enhance learning in interactive virtual environments for agents. It combines simulators and game engines with a neural renderer to create real-time environments that maintain consistent states and realistic visual observations. The framework employs a technique called Adversarial Forcing to improve the visual quality of the rendered environments and optimize learning efficiency. Empirical results show that agents using AgentGarten can learn significantly faster, requiring only a few rounds of interaction compared to traditional reinforcement learning methods.'}, 'zh': {'title': 'AgentGarten：实时交互环境中的高效学习', 'desc': '本文介绍了AgentGarten框架，它结合了模拟器和游戏引擎，通过共享的神经渲染器构建实时交互环境。该框架的模拟后端维护持久的世界状态，并执行程序定义的交互规则，而渲染器则根据通过公共接口导出的结构条件生成视觉观察。通过适应预训练的视频模型并使用对抗性强制方法，AgentGarten优化了实时交互的推理过程，从而提高了视觉质量。实证研究表明，AgentGarten显著提高了学习效率，代理仅需4轮学习即可获得与传统强化学习方法相当的效果。'}}}, {'id': 'https://huggingface.co/papers/2610.11959', 'title': 'MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement', 'url': 'https://huggingface.co/papers/2610.11959', 'abstract': 'Abstract  Reinforcement learning (RL) is the central training paradigm for advancing large foundation models towards self-improvement. This report introduces the MiMo-V2.6 series, an omni-modal family that pushes the frontier of model intelligence by scaling RL compute. Prior to RL, we conduct mid-training on a broad multimodal corpus to provide ample exploration space, and build a solid infrastructure on the pretrained hybrid-SWA architecture to support subsequent scale-up. We scale RL compute along three dimensions: (1) larger batches and higher throughput, with an asynchronous training that consumes 1,568 samples and 2.7-3.7B tokens per step at context lengths of up to 1M; (2) more diverse and complex environments, spanning code, general, visual, and cyber domains under a mixture of agent harnesses; and (3) more grader compute, via groupwise agentic grading that yields more accurate reward signals for long-horizon tasks and steers the model towards shorter, more token-efficient solutions. To keep training stable at scale, we freeze the MoE router and establish a multi-layer defense against reward hacking. We further build infrastructure for mixed-task agentic RL, including a unified trajectory representation, high-concurrency multi-framework rollout, decoupled control and data planes, and training-inference consistency. We open-source the training dynamics, RL environments, and RL framework to facilitate reproduction and further research on scaled RL and model self-improvement.', 'score': 34, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '27e133c442cc787d', 'authors': ['Xiaomi LLM-Core Team', ':', 'Zongming Qiao', 'Ziyue Hua', 'Zirui Ou', 'Zihao Yue', 'Zihan Jiang', 'Zhuo Huang', 'Zhiyang Chen', 'Zhixian Zheng', 'Zhipeng Xu', 'Zhengrui Ma', 'Yuyang Hu', 'Yuhang Dong', 'Yuechen Zhang', 'Yudong Wang', 'Yuanxin Liu', 'Yixin Yang', 'Yishuo Cai', 'Yikai Zhao', 'Yihan Yan', 'Yifan Zhang', 'Yifan Song', 'Xiyu Wei', 'Xing Zhang', 'Xin Zhang', 'Xiaoqian Liu', 'Xiaodong Ji', 'Xiangwei Deng', 'Xueyu Guo', 'Wenhan Ma', 'Weimin Xiong', 'Weikun Wang', 'Weiji Zhuang', 'Shuo Liu', 'Shuhuai Ren', 'Shuhao Gu', 'Shimao Chen', 'Shijie Cao', 'Shihua Yu', 'Shicheng Li', 'Shengjie Zhou', 'Shaolei Zhang', 'Rang Li', 'Qiying Wang', 'Qingkai Fang', 'Qianli Chen', 'Minzheng Wang', 'Liwen Wang', 'Linli Yao', 'Linghao Zhang', 'Liangyu Cheng', 'Liang Zhao', 'Lei Li', 'Jinhao Dong', 'Jinyu Xiang', 'Jianyu Wei', 'Jiangshan Duo', 'Huaqiu Liu', 'Huanjie Fan', 'Hongyi Guan', 'Hongshen Xu', 'Hao Tian', 'Hanyu Li', 'Hailin Zhang', 'Gang Wang', 'Fuli Luo', 'Feng Wei', 'Dong Zhang', 'Dawei Zhu', 'Chiheng Lou', 'Chenhong He', 'Chenhao He', 'Chenghua Liu', 'Bowen Ye', 'Bowen Shen', 'Boshen Xu', 'Bo Yang', 'Bingquan Xia', 'Bangjun Xiao', 'Baixuan Xu', 'Zhouxiang Mao', 'Zhiyang Zhang', 'Zhixiang Xu', 'Zhenru Lin', 'Zhengju Tang', 'Zhaojun Huang', 'Yuzhe Weng', 'Yuxing Xiang', 'Yuxiao Li', 'Yuheng Yang', 'Yuhang Wang', 'Yuchen Liu', 'Yuanyuan Tian', 'Yuanliang Dong', 'Yu Cheng', 'Yongzhe He', 'Yongshun Liang', 'Yong Wang', 'Yiyan Wang', 'Yitian Gong', 'Yijie Zhang', 'Yanshu Xin', 'Xun Zhang', 'Xingjian Zhao', 'Wenyu Yang', 'Wenshan Huang', 'Wenhao Li', 'Tingwei Huang', 'Tianyu Yu', 'Tianyang Lu', 'Taoyu Yang', 'Sinan Du', 'Shutong Tian', 'Shulin Du', 'Shengfan Wang', 'Shanchuan Fang', 'Qihao Zhang', 'Qibin Yang', 'Qian Yu', 'Qian Tu', 'Pengrong Xie', 'Peipei Wang', 'Peidian Li', 'Minkun Guo', 'Mingchen Shao', 'Luohan Gao', 'Lijie Wang', 'Liang Shi', 'Kaiqi Chen', 'Kaiming Liu', 'Kaifei Wang', 'Kai Yang', 'Jinlong Xue', 'Jiechen Zhang', 'Jiaxuan Liu', 'Hongxu An', 'Hao Peng', 'Hanglong Lü', 'Guonan Wang', 'Feiyu Yang', 'Fanyu Cao', 'Fangyue Liu', 'Fan Cui', 'Cong Wang', 'Chun Chen', 'Chenxu Bai', 'Chengxuan Zhu', 'Chenghua Wang', 'Boyi Zeng'], 'affiliations': ['Xiaomi'], 'pdf_title_img': 'assets/pdf/title_img/2610.11959.jpg', 'data': {'categories': ['#reasoning', '#architecture', '#long_context', '#rl', '#multimodal', '#agents', '#optimization', '#training', '#open_source'], 'emoji': '🚀', 'ru': {'title': 'Масштабирование обучения с подкреплением для самосовершенствования мультимодальных моделей', 'desc': 'В статье представлена серия моделей MiMo-V2.6, которая использует обучение с подкреплением (RL) для развития больших мультимодальных фундаментальных моделей и их самосовершенствования. Авторы масштабируют вычисления обучения с подкреплением по трём направлениям: увеличение размера батчей и пропускной способности до 3.7B токенов за шаг, расширение разнообразия окружений (код, визуальные данные, кибербезопасность), и повышение качества градирования через агентное оценивание. Для стабильности обучения при масштабировании авторы применяют замораживание MoE маршрутизатора и многоуровневую защиту от reward hacking. В исследовании разработана инфраструктура для смешанного мультизадачного агентного RL с унифицированным представлением траекторий и высокопроизводительным выполнением.'}, 'en': {'title': 'Scaling Reinforcement Learning for Enhanced Model Intelligence', 'desc': 'This paper discusses advancements in reinforcement learning (RL) for improving large foundation models, specifically through the MiMo-V2.6 series. It emphasizes the importance of mid-training on a diverse multimodal dataset to enhance exploration capabilities before applying RL. The authors scale RL compute by increasing batch sizes, diversifying training environments, and improving reward signal accuracy for complex tasks. Additionally, they implement strategies to maintain training stability and provide open-source resources for further research in this area.'}, 'zh': {'title': '强化学习推动模型智能的前沿', 'desc': '强化学习（RL）是推动大型基础模型自我改进的核心训练范式。本文介绍了MiMo-V2.6系列，这是一个全模态家族，通过扩展RL计算来推动模型智能的前沿。在进行RL之前，我们在广泛的多模态语料库上进行中期训练，以提供充足的探索空间，并在预训练的混合SWA架构上构建坚实的基础设施以支持后续的扩展。我们在三个维度上扩展RL计算：更大的批量和更高的吞吐量、更复杂的环境以及更准确的奖励信号，以实现更高效的模型训练。'}}}, {'id': 'https://huggingface.co/papers/2609.38173', 'title': 'In-context Robot Learning Made Simple: A Democratized Recipe for Manipulation Tasks', 'url': 'https://huggingface.co/papers/2609.38173', 'abstract': 'Abstract  We study robotic in-context learning (ICL), an emerging paradigm that enables robots to infer and execute tasks from visual demonstrations. Despite its growing promise, the problem itself remains under-defined: a visual demonstration simultaneously conveys action trajectories, object semantics, manipulation affordances, spatial relations, and task goals, making it unclear what information the robot is actually expected to follow. In this work, we first provide a clear problem definition of robot ICL that explicitly defines its learning target and resolves this fundamental prompt ambiguity. Building on this definition, we develop a minimalist and reproducible ICL framework (SimpleICL) with a visual prompt encoder and a low-cost data collection protocol. Without massive pre-training or specialized data infrastructure, our framework achieves strong performance in both simulation and real-world environments. Extensive experiments further reveal several key properties of robot ICL, including action, semantic, composition, and affordance discrimination. We will fully open-source our data and training pipeline to facilitate systematic and reproducible research on robot ICL. The project page can be found at https://simpleicl.github.io/simpleicl.', 'score': 33, 'issue_id': 3389, 'pub_date': '2026-09-29', 'pub_date_card': {'ru': '29 сентября', 'en': 'September 29', 'zh': '9月29日'}, 'hash': 'c143ea891b71b3dd', 'authors': ['Minxing Li', 'Minghao Han', 'Weizhi Zhao', 'Hanwen Wang', 'Xiangshuo Liu', 'Shuyao Shang', 'Jingxiang Zhou', 'Mingchao Sun', 'Hongyu Pan', 'Mu Xu', 'Yu Liu', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['Amap, Alibaba Group', 'NLPR, Institute of Automation, Chinese Academy of Sciences (CASIA)'], 'pdf_title_img': 'assets/pdf/title_img/2609.38173.jpg', 'data': {'categories': [], 'emoji': '🤖', 'ru': {'title': 'Чёткое определение обучения робота в контексте через визуальные примеры', 'desc': 'Статья посвящена обучению роботов в контексте (ICL) на основе визуальных демонстраций, где робот должен понять и повторить задачу из примера. Авторы формализуют проблему robot ICL, четко определяя, какую информацию робот должен извлечь из демонстрации, и разрешают неоднозначность интерпретации визуального входа. Они разработали простую и воспроизводимую архитектуру SimpleICL с кодировщиком визуального запроса и экономичным протоколом сбора данных, которая показывает сильные результаты без массивного предварительного обучения. Исследование раскрывает ключевые свойства robot ICL, включая дискриминацию действий, семантики, композиции и affordances объектов.'}, 'en': {'title': 'Empowering Robots with Visual Learning: Defining and Simplifying In-Context Learning', 'desc': "This paper focuses on robotic in-context learning (ICL), which allows robots to learn tasks by observing visual demonstrations. The authors clarify the problem of ICL by defining what information robots should extract from these demonstrations, addressing the ambiguity in task execution. They introduce a new framework called SimpleICL, which uses a visual prompt encoder and a cost-effective data collection method to achieve effective learning without extensive pre-training. The research demonstrates the framework's capabilities in both simulated and real-world scenarios, highlighting important aspects of ICL such as action and semantic understanding."}, 'zh': {'title': '机器人上下文学习的清晰定义与简约框架', 'desc': '我们研究了机器人上下文学习（ICL），这是一种新兴的范式，使机器人能够从视觉演示中推断和执行任务。尽管这一方法前景广阔，但问题本身仍然不够明确，因为视觉演示同时传达了动作轨迹、物体语义、操作可能性、空间关系和任务目标，使得机器人需要遵循的信息不清晰。我们首先提供了一个清晰的机器人ICL问题定义，明确了学习目标并解决了基本的提示模糊性。基于这个定义，我们开发了一个简约且可重复的ICL框架（SimpleICL），在模拟和真实环境中都取得了良好的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.12468', 'title': 'DreamTrue: Action-Faithful Robot World Model with Counterfactual Post-Training', 'url': 'https://huggingface.co/papers/2610.12468', 'abstract': 'Abstract  We present DreamTrue, a multi-view, cross-embodiment robot world model for action-faithful and physically plausible video prediction. Training such a model on existing robot datasets faces two obstacles: imprecise calibration can impair action following, while limited coverage of unsuccessful interactions can bias predictions toward successful outcomes. To improve action following across embodiments, we render action trajectories into image-space conditions and introduce offline geometric calibration to align these conditions with the target videos. To broaden interaction coverage, we introduce counterfactual post-training, modifying recorded action trajectories and generating future videos under a wider range of actions and contact configurations. To provide feedback on these predictions without paired ground-truth futures, we construct a human-annotated video dataset covering robot, object, and interaction defects and use it to train an embodied video reward model. Its scores guide reinforcement-learning post-training toward more physically plausible interaction outcomes. On AgiBot, DreamTrue attains state-of-the-art action following, while reducing the human-assessed interaction defect rate from from 48.12% to 6.25%. Notably, our model ranks first in the world model track of the AgiBot World Challenge 2026. The project page can be found at https://brave-eai.github.io/DreamTrue.', 'score': 30, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'e44698c41699e99d', 'authors': ['Junyan Li', 'Ruizhi Li', 'Yu Liu', 'Xiangshuo Liu', 'Mingchao Sun', 'Hongyu Pan', 'Mu Xu', 'Lue Fan', 'Zhaoxiang Zhang'], 'affiliations': ['Amap, Alibaba Group', 'NLPR, Institute of Automation, Chinese Academy of Sciences (CASIA)'], 'pdf_title_img': 'assets/pdf/title_img/2610.12468.jpg', 'data': {'categories': ['#dataset', '#rl', '#multimodal', '#video', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Предсказание будущего: обучение робота видеть последствия своих действий', 'desc': 'DreamTrue — это мировая модель робота, которая предсказывает будущие видеокадры на основе действий робота с высокой точностью. Модель решает проблему неточной калибровки действий, преобразуя траектории в условия в пространстве изображений, и расширяет разнообразие обучающих данных через контрфактическое дообучение. Для оценки качества предсказаний авторы обучили отдельную вознаграждающую модель на размеченном человеком датасете, выявляющей дефекты взаимодействия. Модель достигла лучших результатов в отслеживании действий и значительно улучшила физическую правдоподобность симуляций (с 48% до 6% дефектов).'}, 'en': {'title': 'DreamTrue: Enhancing Robot Action Prediction with Multi-View Learning', 'desc': 'DreamTrue is a robot world model designed to predict videos of robot actions accurately and realistically. It addresses challenges like imprecise calibration and limited interaction data by aligning action trajectories with target videos and expanding the range of actions through counterfactual training. The model uses a human-annotated dataset to train a reward system that helps improve the quality of predicted interactions. As a result, DreamTrue achieves top performance in action following and significantly reduces the rate of interaction defects in robot actions.'}, 'zh': {'title': 'DreamTrue：提升机器人视频预测的革命性模型', 'desc': '我们提出了DreamTrue，这是一个多视角、跨体现的机器人世界模型，旨在实现动作忠实和物理上合理的视频预测。训练这样的模型面临两个主要挑战：不精确的校准会影响动作跟随，而有限的失败交互覆盖会使预测偏向成功结果。为改善跨体现的动作跟随，我们将动作轨迹渲染为图像空间条件，并引入离线几何校准以对齐这些条件与目标视频。为了扩大交互覆盖范围，我们引入了反事实后训练，修改记录的动作轨迹，并在更广泛的动作和接触配置下生成未来视频。'}}}, {'id': 'https://huggingface.co/papers/2610.12299', 'title': 'Multi-Agent Egocentric World Model with Fine-Grained Embodied Interaction', 'url': 'https://huggingface.co/papers/2610.12299', 'abstract': "Abstract  Egocentric world models predict first-person observations conditioned on an agent's actions, but most focus on a single agent. Real embodied settings often involve multiple agents that act and interact within a shared environment. Existing multi-agent world models rely on coarse actions like locomotion, camera control, or discrete commands, leaving fine-grained embodied interactions underexplored. We formulate multi-agent egocentric world modeling as synchronized ego-stream generation for multiple agents interacting through fine-grained actions in a shared world. This requires cross-view action consistency, shared-environment consistency, and consistent propagation of interaction-induced state updates. We propose Multi-agent Egocentric World Model (ME-World), which jointly denoises multiple ego streams in a shared token sequence, conditions each stream on all agents' target-view poses, and grounds generation with shared environment memory. We train and evaluate on real and synthetic multi-agent data and introduce shared-world consistency metrics for environment, update, and identity consistency. Experiments show ME-World improves shared-world consistency, action control, identity preservation, and video quality over existing methods.", 'score': 29, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'ca28e05295120657', 'authors': ['Dahyun Chung', 'Siyoon Jin', 'Hyunwook Choi', 'Honggyu An', 'Junyoung Seo', 'Hyunsung Kim', 'Seung Wook Kim', 'Seungryong Kim'], 'affiliations': ['KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2610.12299.jpg', 'data': {'categories': ['#multimodal', '#synthetic', '#video', '#robotics'], 'emoji': '👥', 'ru': {'title': 'Синхронное видеопредсказание для нескольких агентов в общей среде', 'desc': 'В работе предлагается подход для моделирования мира с точки зрения нескольких агентов, взаимодействующих в общей среде через точные физические действия. Авторы формулируют задачу как синхронную генерацию эго-потоков видео для каждого агента, обеспечивая согласованность действий между агентами, стабильность общей среды и правильное распространение изменений состояния. Модель ME-World совместно обрабатывает несколько потоков видео в едином токен-последовательности, кондиционируя каждый поток на позы всех агентов и используя общую память окружения. Авторы предложили новые метрики для оценки согласованности многоагентного мира и показали улучшение качества видео, управления действиями и идентификации агентов по сравнению с существующими методами.'}, 'en': {'title': 'Enhancing Multi-Agent Interactions with ME-World', 'desc': 'This paper introduces the Multi-agent Egocentric World Model (ME-World), which enhances the prediction of first-person observations in environments with multiple interacting agents. Unlike previous models that focus on simple actions, ME-World captures fine-grained interactions by synchronizing ego-streams from different agents. It ensures consistency across various aspects, such as actions and environmental states, to create a coherent shared experience. The model is evaluated on both real and synthetic data, demonstrating improvements in action control, identity preservation, and overall video quality compared to existing approaches.'}, 'zh': {'title': '多智能体自我中心世界模型的创新探索', 'desc': '本论文提出了一种多智能体自我中心世界模型（ME-World），用于预测多个智能体在共享环境中的交互行为。与传统模型不同，ME-World能够处理细粒度的动作交互，而不仅仅是粗略的移动或命令。该模型通过同步生成多个智能体的自我流，确保动作一致性和环境一致性，从而提高了视频质量和身份保持能力。实验结果表明，ME-World在共享世界一致性、动作控制和视频质量方面优于现有方法。'}}}, {'id': 'https://huggingface.co/papers/2610.12461', 'title': 'OuroWorld: Bringing Any 3D World Alive as Diverse, Endlessly Looping 3D Cinemagraphs', 'url': 'https://huggingface.co/papers/2610.12461', 'abstract': 'Abstract  Recent 3D world models generate photorealistic, explorable scenes that remain frozen in time. OuroWorld is a mask-free framework that turns any static 3D Gaussian Splatting scene into a 3D cinemagraph: a dynamic scene with vivid, diverse motion looping seamlessly from any viewpoint. A vision-language model infers plausible dynamics and guides a video model to synthesize a reference video, which we lift and complete into multi-view videos. To learn from this imperfect supervision, we propose Inconsistency-Robust Periodic 4DGS: a Fourier-series deformation field guarantees looping by construction, while a Grounded Drift Field anchored at the reference view absorbs cross-view inconsistency. Unlike prior Eulerian methods limited to fluid-like motion, we capture general deformation, object motion, and illumination change. We introduce a ground-truth-free evaluation covering vividness, naturalness, loop seam coherence, and scene quality. On 39 reconstructed and generated scenes, OuroWorld outperforms all baselines and wins 70.8%-99.0% of user-study comparisons. Project page: https://ouroworld.userwei.com', 'score': 20, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '14be9fd430cb61ef', 'authors': ['You-Zhe Xie', 'Ting-Wei Chou', 'Yu-Hsuan Li', 'Kaipeng Zhang', 'Zhixiang Wang', 'Yu-Lun Liu'], 'affiliations': ['Alaya Lab', 'National Yang Ming Chiao Tung University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12461.jpg', 'data': {'categories': ['#multimodal', '#3d', '#video'], 'emoji': '🎬', 'ru': {'title': 'Оживляем статические 3D сцены бесшовными циклическими движениями', 'desc': 'OuroWorld — это фреймворк для преобразования статических 3D сцен, полученных методом Gaussian Splatting, в динамические 3D-кинеграфы с бесшовными циклическими движениями. Система использует vision-language модель для предсказания правдоподобной динамики и генерирует опорное видео, которое затем поднимается в многовидовое видео. Авторы предлагают Inconsistency-Robust Periodic 4DGS — метод с Fourier-рядом деформаций, гарантирующий циклічность, и Grounded Drift Field для обработки кросс-видовых несогласованностей. Модель способна захватывать деформации объектов, их движения и изменения освещения, превосходя базовые методы и получив наивысшие оценки в пользовательских исследованиях.'}, 'en': {'title': 'Transforming Static Scenes into Dynamic Cinemagraphs', 'desc': 'OuroWorld is a novel framework that transforms static 3D scenes into dynamic cinemagraphs, allowing for seamless motion from any viewpoint. It utilizes a vision-language model to infer realistic movements and guides a video model to create reference videos, which are then expanded into multi-view formats. The framework employs a Fourier-series deformation field to ensure smooth looping and a Grounded Drift Field to manage inconsistencies across different views. By evaluating vividness, naturalness, and coherence without relying on ground truth, OuroWorld demonstrates superior performance in user studies compared to existing methods.'}, 'zh': {'title': 'OuroWorld：动态3D场景的创新生成', 'desc': 'OuroWorld 是一个无掩码的框架，可以将任何静态的 3D 高斯点云场景转变为动态的 3D 动态图像。它利用视觉-语言模型推断出合理的动态，并指导视频模型合成参考视频，最终生成多视角视频。该方法通过周期性 4D 高斯样条的鲁棒性，确保了动态循环的自然性，同时通过锚定在参考视图的漂移场来处理视角间的不一致性。与之前的流体运动方法不同，OuroWorld 能够捕捉一般变形、物体运动和光照变化。'}}}, {'id': 'https://huggingface.co/papers/2610.06801', 'title': 'MC-Sparse: Deconstructing and Closing the Dense-Sparse Attention Gap in Diffusion Transformers', 'url': 'https://huggingface.co/papers/2610.06801', 'abstract': 'Abstract  Sparse attention is a primary approach to reducing the latency of diffusion transformers in long-sequence generation tasks, such as video and high-resolution 3D asset generation. However, existing methods can degrade generation quality and fidelity at high sparsity levels. Through controlled oracle comparisons, we trace this degradation to three sources: constraints imposed by token grouping, inaccurate interaction selection, and the attention contributions lost when tokens are discarded. Guided by this analysis, we propose Meta-Cached Sparse Attention (MC-Sparse), a training-free framework that selects individual key-value (KV) tokens while organizing similar queries into tile-aligned groups for efficient GPU execution. MC-Sparse caches metadata comprising query groups, KV indices selected using exact attention probabilities, and residuals between dense and sparse attention outputs, and reuses them across subsequent denoising steps. Across video and 3D generation models, MC-Sparse achieves higher fidelity to dense-attention outputs and larger denoising speedups than existing sparse-attention baselines, without visible quality degradation. Relative to dense attention, it delivers a 1.80times denoising speedup on Minimax-H3-Base and a 2.32times speedup on 3D asset generation, both with negligible quality loss.', 'score': 20, 'issue_id': 3389, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': '6a88f84a6030b579', 'authors': ['Jiarui Chen', 'Zeqiang Lai', 'Jiangshan Wang', 'Ziheng Ouyang', 'Ye Huang', 'Xiangyu Yue', 'Cewu Lu', 'Chunchao Guo'], 'affiliations': ['Fudan University', 'MMLab, CUHK', 'Nankai University', 'Peking University', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Tencent HY'], 'pdf_title_img': 'assets/pdf/title_img/2610.06801.jpg', 'data': {'categories': ['#architecture', '#long_context', '#diffusion', '#video', '#3d', '#optimization', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Интеллектуальное разреживание внимания без потери качества', 'desc': 'В работе предложен новый метод разреженного внимания MC-Sparse для ускорения диффузионных трансформеров при генерации длинных последовательностей, таких как видео и 3D-ассеты. Авторы выявили три основных источника деградации качества при высокой разреженности: ограничения группировки токенов, неточный выбор взаимодействий и потеря вклада внимания. Предложенный подход работает без переобучения, выбирая отдельные KV-токены с использованием точных вероятностей внимания и кэшируя метаданные для переиспользования на последующих шагах денойзинга. MC-Sparse достигает значительного ускорения (1.80× и 2.32× для разных моделей) при сохранении качества сгенерированного контента.'}, 'en': {'title': 'Boosting Efficiency and Quality in Long-Sequence Generation with MC-Sparse', 'desc': 'This paper introduces Meta-Cached Sparse Attention (MC-Sparse), a new method designed to improve the efficiency of diffusion transformers in generating long sequences like videos and 3D assets. The authors identify that traditional sparse attention methods can lead to lower quality outputs due to issues like token grouping and lost attention contributions. MC-Sparse addresses these problems by selecting key-value tokens individually and organizing queries into groups for better GPU performance. The results show that MC-Sparse not only speeds up the denoising process significantly but also maintains high fidelity in the generated outputs compared to existing methods.'}, 'zh': {'title': '提升稀疏注意力的生成质量与速度', 'desc': '稀疏注意力是减少扩散变换器在长序列生成任务中延迟的主要方法，但现有方法在高稀疏度下可能会降低生成质量。通过对比分析，我们发现这种质量下降主要源于令牌分组的限制、不准确的交互选择以及丢弃令牌时损失的注意力贡献。为了解决这些问题，我们提出了Meta-Cached Sparse Attention（MC-Sparse），它在不需要训练的情况下选择单个关键值（KV）令牌，并将相似的查询组织成平铺对齐的组，以提高GPU执行效率。MC-Sparse在视频和3D生成模型中实现了比现有稀疏注意力基线更高的生成保真度和更大的去噪加速，同时几乎没有质量损失。'}}}, {'id': 'https://huggingface.co/papers/2610.12327', 'title': 'SparseDecoding: Decoding-Aware Pruning for Accurate and Efficient LLM Inference', 'url': 'https://huggingface.co/papers/2610.12327', 'abstract': 'Abstract  The memory-bound nature of the decoding stage of large language model (LLM) inference incurs significant latency. Layer-wise training-free network pruning approaches guided by the Hessian have been a prominent solution to this problem, as pruning reduces the number of nonzero parameters read from memory during decoding. Nevertheless, typical methods in this line compute the Hessian using pre-collected natural sequences, whereas the model is fed self-generated tokens during decoding, creating a distribution shift between the two sequences. The Hessian calculated on the natural sequence is different from that calculated on the generated sequence. We observe that this discrepancy causes the activation distribution during generation to deviate from that used for pruning, further hurting the pruned model performance. Moreover, most existing LLM pruning methods that bring actual speedup primarily target the sparse matrix-matrix (SpMM) multiplication, providing limited support for the sparse matrix-vector (SpMV) operations, which dominate decoding. To solve these problems, we introduce SparseDecoding, a principled decoding-aware pruning framework tailored for accurate and efficient LLM decoding. Specifically, at the algorithmic axis, SparseDecoding constructs calibration matrices from layer-wise activations collected during the dense-model autoregressive generation, excluding prefill, thereby aligning the pruning objective with the decoding activations. At the system axis, we develop an optimized N:M sparse matrix-vector kernel with bitmask indexing and fixed-step traversal. Substantial empirical results on representative LLMs (Llama-3.1-8B, Llama-3.3-70B, Qwen3-14B / 32B) demonstrate that our method consistently outperforms standard fixed-text calibration on the long-form generation benchmarks while achieving up to 1.48x end-to-end wall-clock decoding speedup on A100 GPUs.', 'score': 18, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '0a3254efc3a4a0db', 'authors': ['Qitong Wang', 'Xinwei Niu', 'Mingluo Su', 'Shanwei Zhao', 'Shiai Zhu', 'Huan Wang'], 'affiliations': ['Ant Group', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2610.12327.jpg', 'data': {'categories': ['#inference', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Декодирование-ориентированное прореживание для быстрого инференса LLM', 'desc': 'В статье предлагается метод SparseDecoding для эффективной прореживания (pruning) больших языковых моделей, решающий проблему расхождения между распределением активаций при вычислении матрицы Гессе на естественных последовательностях и реальным распределением при автоregressive генерации. Авторы собирают калибровочные матрицы из активаций, полученных во время фазы декодирования модели, что лучше согласует процесс прореживания с реальными условиями инференса. Дополнительно разработан оптимизированный ядро для разреженного матрично-векторного умножения (SpMV), которое доминирует на этапе декодирования, с использованием битовых масок и фиксированного обхода. Экспериментальные результаты на Llama и Qwen моделях показывают улучшение качества генерации и достижение ускорения до 1.48x на GPU A100.'}, 'en': {'title': 'Enhancing LLM Decoding with SparseDecoding Framework', 'desc': 'This paper addresses the latency issues in large language model (LLM) inference during the decoding stage, which is memory-bound. It critiques existing pruning methods that use the Hessian calculated from natural sequences, highlighting the distribution shift when models generate their own tokens. The authors propose SparseDecoding, a new framework that aligns pruning with the activation distributions during decoding, improving model performance. Additionally, they introduce an optimized sparse matrix-vector kernel to enhance decoding speed, achieving significant performance improvements on various LLMs.'}, 'zh': {'title': '解码感知剪枝，提升LLM效率', 'desc': '本文提出了一种名为SparseDecoding的解码感知剪枝框架，旨在提高大型语言模型（LLM）解码的准确性和效率。传统的剪枝方法在计算Hessian时使用自然序列，而在解码时模型使用自生成的令牌，导致分布不一致，从而影响剪枝效果。SparseDecoding通过在密集模型自回归生成过程中收集的层级激活构建校准矩阵，使剪枝目标与解码激活对齐。此外，本文还开发了一种优化的稀疏矩阵-向量内核，显著提高了解码速度。'}}}, {'id': 'https://huggingface.co/papers/2610.02967', 'title': 'Post-Training Frontier Text-to-Image Models by Composing Preference and Rubric Rewards', 'url': 'https://huggingface.co/papers/2610.02967', 'abstract': 'Abstract  Recent text-to-image generation models have achieved remarkable visual quality, but improving them through post-training remains challenging because no single reward signal captures the full range of human preference. In this work, we develop a simple and effective post-training recipe for open-domain text-to-image generation based on the composition of complementary reward signals. Our reward system consists of two main components: a preference reward, trained on large-scale human preference data using a Bradley-Terry objective to capture overall human aesthetic and perceptual preferences, and rubric-based rewards, which explicitly evaluate prompt faithfulness and other desirable properties while providing safeguards against reward hacking. A key challenge is how to combine these heterogeneous reward signals. We show that a naive weighted average leads to suboptimal optimization behavior, and propose a simple reward composition strategy that more effectively balances preference optimization with rubric satisfaction. In the Arena text-to-image leaderboard (https://arena.ai/), our RL-trained Flux2dev achieves an Elo rating 69 points above the base model, and our post-trained Ideogram-4 surpasses every open-source model on the leaderboard, reaching an Elo of 1223.5. (Claims of state-of-the-art performance are based on the Arena leaderboard snapshot as of September 4, 2026.) Our results suggest that effective rewards for frontier generative-model training require broad coverage of user intent and robustness to exploitation under optimization. To support reproducible research, we release Arena-T2I-Training, a 1K subset of training data that recovers some gains of full-scale training, providing a resource that we hope will facilitate future work on post-training for text-to-image models.', 'score': 17, 'issue_id': 3389, 'pub_date': '2026-10-02', 'pub_date_card': {'ru': '2 октября', 'en': 'October 2', 'zh': '10月2日'}, 'hash': 'b7db4f7653b0589b', 'authors': ['Yuanhao Ban', 'I-Hung Hsu', 'Anastasios Angelopoulos', 'Wei-Lin Chiang', 'Ion Stoica', 'Cho-Jui Hsieh'], 'affiliations': ['Arena Intelligence Inc', 'UCLA'], 'pdf_title_img': 'assets/pdf/title_img/2610.02967.jpg', 'data': {'categories': ['#multimodal', '#rlhf', '#dataset', '#benchmark'], 'emoji': '🎨', 'ru': {'title': 'Гармоничная композиция наград для совершенной генерации изображений', 'desc': 'В работе предложен метод улучшения моделей генерации изображений из текста через обучение с подкреплением, используя композицию из нескольких сигналов вознаграждения. Система состоит из двух компонентов: функции предпочтений, обученной на данных о выборе человека с помощью модели Bradley-Terry, и эвристических наград, которые оценивают соответствие описанию и другие желаемые свойства. Авторы показали, что простое взвешенное усреднение сигналов неэффективно, поэтому предложили специальную стратегию композиции, которая лучше балансирует оптимизацию предпочтений и выполнение требований. На бенчмарке Arena T2I модели Flux2dev и Ideogram-4 достигли значительного улучшения, превзойдя существующие открытые модели.'}, 'en': {'title': 'Enhancing Text-to-Image Models with Smart Reward Systems', 'desc': 'This paper addresses the challenges in improving text-to-image generation models after their initial training. It introduces a novel post-training approach that utilizes a combination of reward signals to better align model outputs with human preferences. The reward system includes a preference reward based on human data and rubric-based rewards that ensure the model adheres to specific criteria. The authors demonstrate that their method significantly enhances model performance, achieving higher ratings on the Arena leaderboard compared to baseline models.'}, 'zh': {'title': '优化文本到图像生成的奖励策略', 'desc': '最近的文本到图像生成模型在视觉质量上取得了显著进展，但通过后训练来改进这些模型仍然具有挑战性，因为没有单一的奖励信号能够全面捕捉人类的偏好。本文提出了一种简单有效的后训练方法，基于互补奖励信号的组合来进行开放领域的文本到图像生成。我们的奖励系统包括两个主要组成部分：偏好奖励和基于评分标准的奖励，前者通过大规模人类偏好数据训练，后者则明确评估提示的忠实性及其他期望属性。我们展示了一种简单的奖励组合策略，能够更有效地平衡偏好优化与评分标准的满足，从而提升生成模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.12289', 'title': 'TestPrism: Rethinking Test Evaluation Beyond a Single Reference', 'url': 'https://huggingface.co/papers/2610.12289', 'abstract': 'Abstract  Large language model (LLM) coding agents have advanced test generation across diverse programming tasks. However, the common practice of evaluating tests against a single reference solution overlooks alternative valid implementations and can overstate test quality. We introduce TestPrism, comprising 300 test tasks from 17 sources and 3000 candidate implementations, evenly split between valid and invalid solutions. Its primary metric, Joint Success Function, requires the generated tests to fail on the initial program state, accept every valid candidate, and reject every invalid candidate. Across fourteen baseline coding agent configurations, Joint Success Function reaches only 28.00%, whereas single reference success reaches 59.67%. Our analysis reveals missed behaviors, unsupported assertions, and faulty test construction. To address these weaknesses, we introduce TestHelix, which combines heterogeneous synthesis of test and repair pairs with peer cross validation and recursive self improvement (RSI). Across two models, TestHelix improves Joint Success Function by 8.67 to 9.00 percentage points over the native harness comparators in the TestHelix evaluation', 'score': 15, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'e49c69763b8aec23', 'authors': ['Han Li', 'Lingxiang Hu', 'Jiacheng Huang', 'Ziqian Jiang', 'Jingkai Luo', 'Wei Gao', 'Yunfan Tan', 'Zun Wang', 'Jiaheng Liu'], 'affiliations': ['Hong Kong Polytechnic University', 'Nanjing University', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.12289.jpg', 'data': {'categories': ['#agents', '#dataset', '#benchmark', '#plp'], 'emoji': '🔍', 'ru': {'title': 'Оценка качества тестов через призму множественных решений', 'desc': 'В работе представлена проблема оценки качества тестов, генерируемых LLM-агентами для кодирования: сравнение только с одним эталонным решением переоценивает качество тестов. Авторы создали бенчмарк TestPrism с 300 задачами и 3000 реализациями (поровну корректных и некорректных), используя метрику Joint Success Function, которая требует, чтобы тесты отклоняли начальное состояние программы, принимали все валидные решения и отвергали все невалидные. Предложенный метод TestHelix комбинирует гетерогенный синтез пар тест-исправление с кросс-валидацией и рекурсивным самоулучшением для повышения качества генерируемых тестов. На практике TestHelix улучшает метрику Joint Success Function на 8.67-9.00 процентных пункта по сравнению с базовыми подходами.'}, 'en': {'title': 'Enhancing Test Quality with TestPrism and TestHelix', 'desc': 'This paper discusses the limitations of evaluating test generation in large language model (LLM) coding agents, particularly when using a single reference solution. It introduces TestPrism, a comprehensive dataset with 300 test tasks and 3000 candidate implementations to better assess test quality. The main metric, Joint Success Function, highlights the shortcomings of existing methods, showing that they often miss valid implementations and produce faulty tests. To improve this, the authors propose TestHelix, which enhances test generation through diverse synthesis and validation techniques, resulting in a significant increase in test effectiveness.'}, 'zh': {'title': '提升测试生成质量的新方法', 'desc': '大型语言模型（LLM）编码代理在多种编程任务的测试生成方面取得了进展。然而，常用的评估方法只针对单一参考解决方案，忽视了其他有效实现，可能会夸大测试质量。我们提出了TestPrism，包含来自17个来源的300个测试任务和3000个候选实现，合理分为有效和无效解决方案。我们的主要指标联合成功函数要求生成的测试在初始程序状态下失败，接受每个有效候选，并拒绝每个无效候选。'}}}, {'id': 'https://huggingface.co/papers/2610.12442', 'title': 'LEGO: A Lifting-Free Approach for Exocentric-to-Egocentric Video Generation', 'url': 'https://huggingface.co/papers/2610.12442', 'abstract': "Abstract  Generating an egocentric video from a single exocentric recording is a challenging case of novel view synthesis, as the two cameras share little overlap and much of the target view is unobserved. Current state-of-the-art methods reconstruct the scene explicitly by estimating depth, lifting the video into a point cloud, and re-rendering it from the egocentric camera to condition a video diffusion model. This deterministic mapping assigns each pixel to a single reprojected location, which preserves texture but translates depth errors into misplaced content. We ask what a video diffusion model should receive as its condition and propose a lifting-free answer: a learned view synthesizer, an LVSM-style transformer fine-tuned to render the egocentric view directly without depth, point clouds, or reprojection, resolving cross-view correspondence internally. In contrast, its probabilistic mapping averages each region over candidate source locations according to a learned correspondence distribution, preserving structure while fine texture is averaged away. We argue that this trade-off suits a diffusion generator, whose denoising training excels at restoring detail, so an effective condition should prioritize structural alignment over sharpness. This distribution's concentration also yields a per-region confidence, used both to mask low-confidence regions and to guide the generator toward high-confidence areas during early layout-forming denoising steps. Our approach consistently outperforms the state-of-the-art explicit pipeline and generalizes to other datasets without retraining. The synthesizer thus supplies view structure, and the diffusion model its detail.", 'score': 15, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'bdc52bb543e07360', 'pdf_title_img': 'assets/pdf/title_img/2610.12442.jpg', 'data': {'categories': ['#multimodal', '#diffusion', '#video', '#architecture'], 'emoji': '📹', 'ru': {'title': 'Структура без геометрии: синтезатор представлений для диффузионного генератора видео', 'desc': 'В работе предлагается новый подход к синтезу эгоцентрического видео из экзоцентрической записи, которая представляет собой сложную задачу синтеза новых представлений. Вместо явного восстановления сцены через оценку глубины и перепроецирования облака точек, авторы предлагают обучаемый синтезатор представлений на основе трансформера, который генерирует целевое представление напрямую без явных геометрических операций. Ключевая идея заключается в использовании вероятностного соответствия между представлениями, которое усредняет текстуру по возможным исходным локациям, сохраняя структуру сцены. Полученное условие подается в диффузионную модель, которая восстанавливает потерянные детали и текстуру, при этом авторы используют меру уверенности для каждого региона, чтобы направлять генерацию.'}, 'en': {'title': 'Transforming Views: From Exocentric to Egocentric with Learned Synthesis', 'desc': 'This paper addresses the challenge of creating an egocentric video from a single exocentric recording, which involves synthesizing a new viewpoint where the cameras have little overlap. The authors propose a novel approach that uses a learned view synthesizer, which eliminates the need for depth estimation and point cloud generation, allowing for direct rendering of the egocentric view. Instead of a deterministic mapping that can lead to depth errors, their method employs a probabilistic mapping that averages over potential source locations, focusing on structural alignment rather than fine texture. This results in improved performance over existing methods, as it effectively combines the structural information from the synthesizer with the detail restoration capabilities of a diffusion model.'}, 'zh': {'title': '从外部视角到自我中心视角的创新合成方法', 'desc': '本论文探讨了如何从单个外部视角视频生成自我中心视角视频，这是一个具有挑战性的视角合成问题。现有的最先进方法通过估计深度和将视频提升为点云来重建场景，但这种方法会导致深度错误影响内容的准确性。我们提出了一种新的方法，使用学习的视角合成器，直接生成自我中心视角，而无需深度或点云，从而在内部解决视角对应问题。我们的实验表明，这种方法在性能上超越了现有的显式管道，并且能够在不重新训练的情况下推广到其他数据集。'}}}, {'id': 'https://huggingface.co/papers/2610.06406', 'title': 'What Did the Agent Actually Do? Evidence-Grounded Oversight for Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2610.06406', 'abstract': "Abstract  As agents take on long-horizon tasks, users shift from making individual decisions to overseeing autonomous execution. Yet the volume of agent activity and the fragmentation of supporting evidence make it difficult to determine which decisions warrant user verification. We study monitors that identify consequential decisions and locate evidence to help users assess their implications. We introduce AgentMonBench, a software-engineering benchmark comprising three subsets that cover two complementary dimensions: alignment between requirements and behavior, and awareness of consequential autonomous decisions for verification. To support these judgments, we propose the Evidence-Grounded Behavior Graph (EBG), a training-free method that groups source-linked evidence into behaviors and organizes their relationships into a graph. EBG presents task-oriented views of this graph to help monitors interpret behavior in context. Experiments across eight models show that EBG improves decision identification and evidence localization in most settings compared with direct access to the original context. Further experiments show that EBG's evidence-localization gains persist across input scales and hyperparameter settings, while real-world applications illustrate its practical value for human oversight.", 'score': 11, 'issue_id': 3389, 'pub_date': '2026-10-05', 'pub_date_card': {'ru': '5 октября', 'en': 'October 5', 'zh': '10月5日'}, 'hash': 'ebe3b92c8f4e3ab8', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': [], 'emoji': '🕵️', 'ru': {'title': 'Граф поведения для проверки решений автономных агентов человеком', 'desc': 'Статья предлагает решение для мониторинга автономных агентов при выполнении долгосрочных задач. Авторы представляют AgentMonBench — benchmark для оценки способности систем выявлять критически важные решения агента и находить релевантные доказательства для проверки. Основной вклад — метод Evidence-Grounded Behavior Graph (EBG), который без обучения группирует источники информации в поведения и организует их в граф для интерпретации. Экспериментальные результаты показывают, что EBG превосходит прямой доступ к контексту при выявлении критических решений и локализации доказательств на различных масштабах данных.'}, 'en': {'title': 'Enhancing User Oversight with Evidence-Grounded Behavior Graphs', 'desc': 'This paper addresses the challenge of monitoring autonomous agents as they perform long-term tasks, where user oversight becomes crucial. It introduces AgentMonBench, a benchmark designed to evaluate how well monitors can identify important decisions made by agents and provide supporting evidence for user verification. The authors propose a novel method called the Evidence-Grounded Behavior Graph (EBG), which organizes evidence related to agent behavior into a structured graph for easier interpretation. Experimental results demonstrate that EBG enhances the identification of significant decisions and the localization of relevant evidence, proving its effectiveness in real-world applications for human oversight.'}, 'zh': {'title': '智能体监控：提升决策验证的有效性', 'desc': '随着智能体承担长期任务，用户的角色从单独决策转变为监督自主执行。由于智能体活动量大且支持证据分散，用户难以判断哪些决策需要验证。我们研究了一种监控系统，能够识别重要决策并定位证据，帮助用户评估其影响。我们提出了AgentMonBench，这是一个软件工程基准，包含三个子集，涵盖需求与行为之间的对齐以及对重要自主决策的意识，以支持用户的判断。'}}}, {'id': 'https://huggingface.co/papers/2610.11322', 'title': 'USDCraft: Geometrically Grounded Programmatic Modeling of Articulated 3D Assets for Simulation', 'url': 'https://huggingface.co/papers/2610.11322', 'abstract': "Abstract  Geometrically faithful and functional articulated 3D assets are essential for real-to-sim robot manipulation, where policies trained in simulation must transfer to physical objects. Recent mesh-based methods learn to infer articulation from annotated 3D assets, but deployment remains challenging when real-world objects fall outside the training distribution or their meshes are incomplete or corrupted. To address these limitations, we formulate articulated asset reconstruction as programmatic modeling grounded in partial geometric evidence and introduce USDCraft, a framework in which a pretrained LLM writes and revises executable programs for simulation-ready articulated assets without task-specific training. We propose source geometry analysis, which converts the source mesh into a metric textual description that distinguishes observed surface from unknown space, and iterative geometric rechecking, which re-encodes each candidate in the same representation so that discrepancies point to program edits while unobserved regions remain open to completion. Visual feedback and physical authoring guidance complete the modeling process, which produces articulated USD assets with explicit physical properties that load into Isaac Sim without manual adjustment. Experiments demonstrate leading articulation recovery on two benchmarks and validate USDCraft's effectiveness for real-to-sim-to-real robot manipulation.", 'score': 11, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'a5ad944bf7cfc0ab', 'authors': ['Chuanrui Zhang', 'Zaijia Yang', 'Duomin Wang', 'Lu Shi', 'Daquan Zhou', 'Ruihua Zhang', 'Ziwei Wang'], 'affiliations': ['NTU', 'NVIDIA', 'PKU'], 'pdf_title_img': 'assets/pdf/title_img/2610.11322.jpg', 'data': {'categories': ['#agents', '#3d', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Генерация артикулированных активов через LLM и геометрический контроль', 'desc': 'Статья представляет USDCraft — фреймворк, использующий предварительно обученную большую языковую модель (LLM) для автоматического создания артикулированных 3D-активов для робототехники через программное моделирование. Метод преобразует неполные или повреждённые сетки в текстовые описания геометрии, позволяя LLM генерировать исполняемые программы для симуляции. Итеративная геометрическая проверка сравнивает сгенерированные модели с исходной геометрией, направляя LLM к более точным редакциям. Подход успешно решает проблему переноса политик робота из симуляции в реальный мир, даже когда объекты выходят за границы обучающего распределения.'}, 'en': {'title': 'Revolutionizing 3D Asset Reconstruction for Robot Manipulation', 'desc': 'This paper presents USDCraft, a novel framework for reconstructing articulated 3D assets that can be used in robot manipulation tasks. It leverages a pretrained language model to generate and refine executable programs for creating simulation-ready assets, even when dealing with incomplete or corrupted meshes. The approach includes source geometry analysis to create a detailed textual description of the mesh and iterative geometric rechecking to identify and correct discrepancies. The results show that USDCraft significantly improves articulation recovery, making it easier to transfer learned policies from simulation to real-world applications.'}, 'zh': {'title': 'USDCraft：实现真实与模拟之间的无缝转换', 'desc': '这篇论文提出了一种名为USDCraft的框架，用于重建具有关节运动的3D资产，以便在真实世界中进行机器人操作。该方法通过分析源几何形状，将3D网格转换为文本描述，从而识别已观察到的表面和未知空间。USDCraft利用预训练的语言模型生成可执行程序，自动修正和优化3D资产，而无需特定任务的训练。实验结果表明，该框架在关节恢复方面表现优异，能够有效支持从模拟到现实的机器人操作。'}}}, {'id': 'https://huggingface.co/papers/2610.12419', 'title': 'OneSearch-VL: Unified Multimodal Deep Research Agent for Image and Video', 'url': 'https://huggingface.co/papers/2610.12419', 'abstract': 'Abstract  Single-image, multi-image, and video deep research require different visual operations but share a workflow of visual grounding, external retrieval, and fact composition. A key challenge is to preserve the dependencies linking localized visual anchors, entity relations, source-supported facts, and answer-producing operations. We introduce OneSearch-VL, a unified agent centered on the Visually Grounded Evidence Graph (VGEG), which encodes these dependencies as a shared task-level reference for data construction, process supervision, and operation-level evaluation. Our VGEG-based data engine constructs and verifies multi-image and video questions and filters expert trajectories. Using these data, we assemble OneSearch-VL-SFT-110K and OneSearch-VL-RL-10K for SFT and RL, respectively. We further derive the Evidence-aware Visual-Grounded Rubric reward (EVGR) from VGEG annotations to supervise evidence traceability and visual grounding during RL. For fine-grained evaluation, we construct OneSearch-MI-Bench and OneSearch-Video-Bench, organizing questions by the research operations encoded in their VGEGs. Experiments show that OneSearch-VL-8B improves over Qwen3-VL-8B with tool access by 20.2 and 17.6 percentage points on the two new benchmarks, respectively, while also achieving substantial gains across 7 image benchmarks and VideoDR. Project repository: https://github.com/appletea233/OneSearch-VL', 'score': 10, 'issue_id': 3389, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': 'a73dcd99bf69eabb', 'authors': ['Hongyu Li', 'Manyuan Zhang', 'Kaituo Feng', 'Shu Chen', 'Dian Zheng', 'Hao Li', 'Hao Yu', 'Zhangquan Chen', 'Zoey Guo', 'Ray Zhang', 'Shaofei Huang', 'Tianrui Hui', 'Linjiang Huang', 'Si Liu'], 'affiliations': ['BUAA', 'CUHK', 'HFUT', 'NTU', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2610.12419.jpg', 'data': {'categories': ['#dataset', '#cv', '#agents', '#multimodal', '#video', '#training', '#rlhf', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Единая система поиска с визуально обоснованным графом доказательств для мультимодального понимания', 'desc': 'Работа представляет OneSearch-VL — унифицированный агент для решения задач визуального понимания на основе единого или нескольких изображений и видео. Ключевая инновация заключается в использовании графа визуально обоснованных доказательств (VGEG), который кодирует зависимости между локализованными визуальными якорями, отношениями сущностей и операциями. Авторы разработали специализированный конвейер обработки данных с использованием обучения с подкреплением и функции вознаграждения EVGR для контроля трассируемости доказательств и визуальной локализации. Модель OneSearch-VL-8B показывает значительные улучшения на новых бенчмарках для многоизображений и видео, превосходя базовые модели на 20.2 и 17.6 процентных пункта соответственно.'}, 'en': {'title': 'OneSearch-VL: Unifying Visual Grounding for Enhanced Understanding', 'desc': 'This paper presents OneSearch-VL, a unified framework designed to enhance visual understanding across single images, multiple images, and videos. It introduces the Visually Grounded Evidence Graph (VGEG), which captures the relationships between visual elements, entities, and facts, facilitating better data construction and evaluation. The framework includes specialized datasets for supervised fine-tuning (SFT) and reinforcement learning (RL), ensuring that visual grounding and evidence traceability are prioritized. Experimental results demonstrate that OneSearch-VL significantly outperforms existing models on various benchmarks, showcasing its effectiveness in visual reasoning tasks.'}, 'zh': {'title': '统一视觉基础的深度研究解决方案', 'desc': '本论文介绍了一种名为OneSearch-VL的统一代理，旨在处理单图像、多图像和视频的深度研究。该方法通过视觉锚点、实体关系和支持事实之间的依赖关系，构建了一个视觉基础证据图（VGEG），用于数据构建和过程监督。我们还开发了基于VGEG的奖励机制，以监督在强化学习中的证据可追溯性和视觉基础。实验结果表明，OneSearch-VL在新基准测试中显著优于现有模型，展示了其在多种视觉任务中的有效性。'}}}, {'id': 'https://huggingface.co/papers/2610.12229', 'title': 'VibeEdit: Image Editing with Canvas Instructions', 'url': 'https://huggingface.co/papers/2610.12229', 'abstract': 'Abstract  In text-guided image editing, describing the desired change is often straightforward, but identifying the intended object or region can be cumbersome, especially when several objects look alike. We introduce a new image edi
