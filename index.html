 benchmarks conflate two distinct forms of evidence within a single modality: perceptual signals (e.g., a photograph or recording of a dog) and propositional signals (e.g., the declarative claim "this is a dog"), such that any measured modality bias is inherently confounded with evidence-form bias, precluding clean attribution to either source. To address this, we introduce Tri-PvP, an 8,000-sample tri-modal conflict benchmark crossing vision, audio, and text, where vision and audio each take perceptual or propositional form. Evaluating five OLLMs, we find robust visual bias across most models and evidence-type conditions. Crucially, we reveal a systematic asymmetry in evidence-form bias: models exhibit a stronger bias toward perceptual signal in vision but propositional in audio. Further analyses via layer-wise linear probing and contrastive decoding reveal that modality bias is already linearly decodable from early representation layers and can only be partially mitigated, calling for mitigation strategies beyond surface-level interventions.', 'score': 1, 'issue_id': 3322, 'pub_date': '2026-09-05', 'pub_date_card': {'ru': '5 сентября', 'en': 'September 5', 'zh': '9月5日'}, 'hash': 'a0befe5d1ab60c33', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#small_models', '#multimodal'], 'emoji': '👁️', 'ru': {'title': 'Визуальное смещение и асимметричное доверие к типам доказательств в мультимодальных языковых моделях', 'desc': 'В статье исследуется визуальное смещение в омни-модальных языковых моделях, которые обрабатывают зрение, аудио и текст одновременно. Авторы создали новый бенчмарк Tri-PvP с 8000 примерами, где они разделили доказательства внутри модальностей на перцептивные сигналы (фотография, запись) и пропозициональные сигналы (словесные утверждения), чтобы чистым образом измерить предвзятость моделей. Результаты показывают систематическую асимметрию: модели сильнее доверяют перцептивным сигналам в зрении, но пропозициональным в аудио. Анализ внутренних слоёв моделей выявил, что модальное смещение уже кодируется на ранних слоях и может быть только частично смягчено поверхностными методами.'}, 'en': {'title': 'Unveiling Bias in Omni-Modal Language Models with Tri-PvP', 'desc': 'The paper introduces the Tri-PvP benchmark, which investigates how omni-modal language models (OLLMs) handle visual and audio information. It highlights that these models show a strong bias towards visual data when presented with conflicting evidence from different modalities. The study distinguishes between perceptual signals (like images) and propositional signals (like statements), revealing that existing benchmarks mix these types, complicating the understanding of modality bias. The findings indicate that early layers of the models already reflect this bias, suggesting that more effective strategies are needed to address these issues beyond simple fixes.'}, 'zh': {'title': '揭示全模态语言模型的偏见与证据形式不对称', 'desc': '这篇论文介绍了Tri-PvP基准测试，揭示了全模态语言模型中的视觉偏见和不对称的证据形式偏好。研究发现，尽管这些模型可以处理视觉、音频和文本，但在跨模态冲突中，它们的模态偏见仍未得到充分探索。通过引入一个包含8000个样本的三模态冲突基准，研究表明大多数模型在视觉和音频的证据类型条件下都表现出强烈的视觉偏见。重要的是，研究还发现模型在视觉上对感知信号的偏见更强，而在音频上则对命题信号的偏见更强，提示需要更深入的干预策略。'}}}, {'id': 'https://huggingface.co/papers/2609.22319', 'title': 'Embedding Physics Priors in Robot Learning: A Survey', 'url': 'https://huggingface.co/papers/2609.22319', 'abstract': 'Abstract  The rapid progress of artificial intelligence is reshaping robotics and accelerating the adoption of learning-based approaches. While purely data-driven methods have achieved remarkable success in computer vision and natural language processing, robotics remains constrained by limited data, complex real-world interactions, and the need for reliable operation. These challenges have motivated the exploration of physics-embedded robot learning, which embeds physics priors into learning algorithms. By encoding the underlying physical laws and constraints, physics priors can complement limited data with robotics-specific inductive biases, potentially improving generalization, interpretability, and sample efficiency. However, the literature on physics-embedded robot learning remains fragmented across terminology, methodologies, and application domains, making it difficult to assess this growing body of work. This survey reviews physics-embedded robot learning across a broad range of physics priors, robotics applications, and machine learning models, from single-layer perceptrons to generative foundation models. We adopt a unified taxonomy that classifies existing approaches according to their physics embedding: physics-guided inputs, data, and representations; physics-encoded model architectures; and physics-informed training loss functions. Building on this taxonomy, we review methods for robot dynamics learning, trajectory planning, prediction, control, and estimation, together with the corresponding open-source software ecosystem. We identify key open challenges, and outline promising future research directions. Overall, we argue that physics priors provide a particularly relevant robotics-specific inductive bias, complementing rather than replacing data-driven learning, and paving the way toward more generalizable, data-efficient, and trustworthy robotic systems.', 'score': 1, 'issue_id': 3321, 'pub_date': '2026-09-15', 'pub_date_card': {'ru': '15 сентября', 'en': 'September 15', 'zh': '9月15日'}, 'hash': '7d198487ba8de864', 'authors': ['Mattia Piccinini', 'Lucas Schulze', 'Alice Plebe', 'Matteo Saveriano', 'Thomas Beckers', 'Yuan Gao', 'Oleg Arenz', 'Baha Zarrouki', 'Dingrui Wang', 'Finn Rasmus Schäfer', 'Jan Peters', 'Johannes Betz', 'Gastone Pietro Rosati Papini'], 'affiliations': ['Max Planck Institute for Intelligent Systems', 'Politecnico di Milano', 'Technische Universität Darmstadt', 'University of Udine'], 'pdf_title_img': 'assets/pdf/title_img/2609.22319.jpg', 'data': {'categories': ['#robotics', '#architecture', '#training', '#interpretability', '#optimization', '#survey'], 'emoji': '🤖', 'ru': {'title': 'Физика встречается с данными: как встроить законы природы в обучение роботов', 'desc': 'Статья рассматривает подход физически-встроенного обучения роботов, который интегрирует физические законы и ограничения в алгоритмы машинного обучения. Авторы предлагают единую классификацию методов, включающую физически-направляемые входные данные и представления, архитектуры моделей с закодированной физикой и информированные физикой функции потерь. Исследование охватывает применение этого подхода к обучению динамики, планированию траекторий, предсказанию, управлению и оценке состояния роботов. Физические приоры рассматриваются как эффективная индуктивная смещение, дополняющая обучение на данных и способствующая созданию более обобщаемых и надежных робототехнических систем.'}, 'en': {'title': 'Enhancing Robotics with Physics-Embedded Learning', 'desc': 'This paper discusses how integrating physics knowledge into robot learning can enhance the performance of robots, especially when data is limited. It highlights the challenges faced in robotics, such as complex interactions and the need for reliable operations, which traditional data-driven methods struggle to address. By embedding physics principles into learning algorithms, the authors propose that robots can achieve better generalization and efficiency. The paper also reviews various methods and applications of physics-embedded learning, aiming to unify the fragmented literature in this area and identify future research opportunities.'}, 'zh': {'title': '物理嵌入，提升机器人学习的未来', 'desc': '这篇论文探讨了物理嵌入机器人学习的概念，旨在解决机器人领域中数据有限和复杂交互的问题。通过将物理规律嵌入学习算法，研究者希望提高机器人的泛化能力和样本效率。论文回顾了不同的物理先验、机器人应用和机器学习模型，并提出了一种统一的分类法来整理现有方法。作者认为，物理先验为机器人学习提供了特定的归纳偏置，能够与数据驱动学习相辅相成，推动更通用和可靠的机器人系统的发展。'}}}, {'id': 'https://huggingface.co/papers/2609.25267', 'title': 'ImIR: Image-Instruction Tuning for All-in-One Image Restoration', 'url': 'https://huggingface.co/papers/2609.25267', 'abstract': "Abstract  Degradations vary widely across images, so a practical restoration system has to handle many degradation types with one model. A recent and effective recipe adapts a large pretrained image-editing model to restoration using a small low-rank adapter with a text prompt. We replace that prompt with an instruction derived from the degraded image itself. The image reaches the editor through two paths: its structure comes from the model's VAE, and its semantic instruction comes from a lightweight token mapper that shifts the degraded image's vision-language embedding toward the embedding a clean image would produce. Because the instruction is a continuous vector, scaling it yields a family of valid restorations for tasks whose target is not unique, such as low-light enhancement. We adapt one Qwen-Image-Edit model to six tasks with a single adapter trained in about three hours on one GPU. The image instruction outperforms text conditioning under a matched comparison, and it supports task agnostic restoration without a degradation label, which the text variant does not.", 'score': 1, 'issue_id': 3321, 'pub_date': '2026-09-21', 'pub_date_card': {'ru': '21 сентября', 'en': 'September 21', 'zh': '9月21日'}, 'hash': '1fb1e807421cde6e', 'authors': ['Süleyman Aslan', 'Görkay Aydemir', 'Mısra Yavuz', 'Yunus Bilge Kurt', 'Nasrin Rahimi', 'Ahmet Rasim Emirdağı', 'Burak Can Biner', 'M. Akın Yılmaz'], 'affiliations': ['Codeway AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.25267.jpg', 'data': {'categories': ['#multimodal', '#cv', '#training', '#architecture'], 'emoji': '🖼️', 'ru': {'title': 'Самоуправляемое восстановление: изображение как собственная инструкция', 'desc': 'Статья описывает универсальный метод восстановления изображений, который адаптирует большую предобученную модель редактирования с помощью легкого низкорангового адаптера. Вместо текстовых подсказок авторы используют инструкции, извлекаемые непосредственно из деградированного изображения через двухпутевой механизм: структурная информация идет из VAE, а семантическая - из маппера токенов, который сдвигает embedding изображения в пространстве vision-language модели. Благодаря тому, что инструкция представляет собой непрерывный вектор, масштабирование позволяет получить семейство валидных восстановлений для задач с неуникальным целевым результатом, таких как улучшение освещенности. Один адаптер успешно обучен на шести различных задачах восстановления всего за три часа на одном GPU, показывая превосходство над текстовым кондиционированием.'}, 'en': {'title': 'One Model, Many Restorations: Image Repair Made Easy', 'desc': "This paper presents a novel approach to image restoration that utilizes a single model to handle various types of image degradations. Instead of using a text prompt for guidance, the method derives instructions directly from the degraded image, enhancing the restoration process. The model employs a Variational Autoencoder (VAE) to capture the image's structure and a lightweight token mapper to adjust the image's semantic representation. This technique allows for flexible restorations, particularly for tasks like low-light enhancement, and demonstrates superior performance compared to traditional text-based methods."}, 'zh': {'title': '图像恢复的新方法：基于图像指令的适配', 'desc': '这篇论文提出了一种图像恢复的新方法，旨在处理多种类型的图像退化。研究者使用了一个大型预训练的图像编辑模型，并通过低秩适配器和图像本身的指令来进行恢复。该方法通过两个路径传递图像信息：结构来自模型的变分自编码器（VAE），语义指令则通过轻量级的标记映射器生成。实验表明，这种基于图像的指令在多任务恢复中表现优于传统的文本条件方法，且无需退化标签。'}}}, {'id': 'https://huggingface.co/papers/2609.22323', 'title': 'ALPINE: Adaptive Localization for Parameter- and Sample-Efficient Few-Shot Learning', 'url': 'https://huggingface.co/papers/2609.22323', 'abstract': "Abstract  Few-shot learning research is predominantly evaluated on accuracy alone, with limited attention to the parameter and training-sample budgets required to reach that accuracy - a real constraint for practitioners without large-scale compute. We present an ultra-lightweight (22,249-34,917 parameter) spatial-relational architecture for few-shot image classification that combines fixed Gabor edge-energy guidance with a windowed, content-adaptive patch locator. Under a strictly matched, iso-episode-budget protocol (250 meta-training episodes, 5 canonical seeds, 600 evaluation episodes per seed), our architecture achieves 5-shot accuracy gains, consistent across all five seeds, over Prototypical Networks, Relation Networks, and MAML on both CIFAR-FS and MiniImageNet, while using 27-53% fewer parameters than any baseline. It also converges in fewer training episodes, generalizes better to an unseen fine-grained domain (CUB-200-2011 birds, zero retraining), and is more robust to 50% occlusion and 25% spatial translation than all three baselines. A series of falsification ablations - zeroing relational tokens at inference and retraining without them entirely - shows that the architecture's pairwise relational computation, while present, is not the primary driver of its performance; the content-adaptive patch locator is. We report this honestly, together with a capacity sweep showing a genuine accuracy plateau near 22-35k parameters, and release full seed-level results and checkpoint hashes for reproducibility.", 'score': 1, 'issue_id': 3320, 'pub_date': '2026-09-16', 'pub_date_card': {'ru': '16 сентября', 'en': 'September 16', 'zh': '9月16日'}, 'hash': '542768624e4e75bc', 'authors': ['Neeraj Yadav'], 'affiliations': ['Independent Researcher, Uttar Pradesh, India'], 'pdf_title_img': 'assets/pdf/title_img/2609.22323.jpg', 'data': {'categories': ['#benchmark', '#cv', '#small_models', '#dataset'], 'emoji': '🪶', 'ru': {'title': 'Эффективность вместо сложности: минимальные параметры для few-shot обучения', 'desc': 'В статье представлена сверхлёгкая нейронная архитектура для few-shot обучения с классификацией изображений, содержащая всего 22-35 тысяч параметров, что в 27-53% меньше, чем у baseline моделей. Авторы комбинируют фиксированные фильтры Габора с адаптивным локатором патчей для обнаружения информативных регионов в изображениях. При единообразном протоколе оценки (250 эпизодов мета-обучения) модель превосходит Prototypical Networks, Relation Networks и MAML на датасетах CIFAR-FS и MiniImageNet, лучше обобщается на новые домены и устойчива к окклюзии. Через ablation-анализ авторы показывают, что ключевым компонентом успеха является именно адаптивный локатор патчей, а не парные реляционные вычисления, и предоставляют полные результаты для воспроизводимости.'}, 'en': {'title': 'Lightweight Few-Shot Learning: More Accuracy with Fewer Parameters!', 'desc': 'This paper introduces a new lightweight architecture for few-shot image classification that uses fewer parameters while achieving higher accuracy. The model combines Gabor edge-energy guidance with a content-adaptive patch locator, allowing it to perform well even with limited training data. It outperforms existing methods like Prototypical Networks and MAML on standard datasets while requiring fewer training episodes and parameters. The study emphasizes the importance of the patch locator in driving performance, rather than the relational computation, and provides detailed results for reproducibility.'}, 'zh': {'title': '超轻量级架构，提升少样本学习准确率', 'desc': '这篇论文研究了少样本学习，提出了一种超轻量级的空间关系架构，用于图像分类。该架构结合了固定的Gabor边缘能量引导和自适应的内容定位器，参数量仅为22,249到34,917。实验结果表明，在CIFAR-FS和MiniImageNet数据集上，该方法在5-shot准确率上优于现有的Prototypical Networks、Relation Networks和MAML，同时使用的参数更少。该架构在训练集上收敛更快，并且在未见过的细粒度领域中表现出更好的泛化能力。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (4)', '#agi', '#alignment', '#architecture (7)', '#audio (1)', '#benchmark (8)', '#cv (5)', '#data', '#dataset (4)', '#diffusion', '#ethics', '#games', '#graphs', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability (2)', '#leakage', '#long_context', '#low_resource (1)', '#machine_translation', '#math', '#multilingual (1)', '#multimodal (6)', '#open_source', '#optimization (3)', '#plp (1)', '#rag', '#reasoning', '#rl (1)', '#rlhf (2)', '#robotics (2)', '#science (1)', '#security', '#small_models (3)', '#story_generation', '#survey (1)', '#synthetic', '#training (5)', '#transfer_learning (1)', '#video (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-23 18:18',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-23 18:18')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-23 18:18')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
