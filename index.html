учшие доступные LLM модели успешно завершают только около 30% задач, что указывает на серьёзные пробелы в архитектуре текущих агентов. Анализ выявил, что основные причины неудач — это сложное следование инструкциям и отсутствие специализированных знаний в конкретных предметных областях.'}, 'en': {'title': 'Bridging the Gap: Evaluating AI Agents in Real-World Workflows', 'desc': 'The paper introduces StartupBench, a benchmark designed to evaluate AI agents on real-world startup workflows. It highlights that even the best AI models only complete about 30% of the tasks, indicating significant limitations in their ability to follow complex instructions and demonstrate domain expertise. The study emphasizes the importance of using market-validated tasks rather than researcher-selected ones to assess AI capabilities. By translating actual workflows into measurable tasks, StartupBench provides a clearer picture of the current state of AI performance in practical applications.'}, 'zh': {'title': '评估 AI 代理在真实世界中的能力', 'desc': 'StartupBench 是一个评估 AI 代理在真实创业工作流程中表现的基准。研究发现，即使是最先进的模型也只能完成大约 30% 的任务，这表明在指令遵循和领域专业知识方面存在明显的不足。该基准通过分析市场上已验证的 AI 产品，识别出真实世界中 AI 需要解决的任务，并将这些工作流程转化为可交付的任务进行评估。结果显示，当前通用代理在许多市场验证的工作流程中仍然无法可靠地完成任务，突显了 AI 系统在实际应用中的局限性。'}}}, {'id': 'https://huggingface.co/papers/2608.14221', 'title': 'MathForm: Scaling Mathematical Autoformalization with Knowledge Retrieval and Verification-Guided Refinement', 'url': 'https://huggingface.co/papers/2608.14221', 'abstract': "Abstract MathForm improves autoformalization by retrieving Mathlib knowledge and iteratively refining outputs with verification feedback, yielding a large verified dataset and a high-performing 8B model.  Generated by thinkingmachines/Inkling-Small Autoformalization is commonly framed as translating natural-language mathematical statements into machine-verifiable formal languages such as Lean 4. However, faithful formalization requires more than translation. Models must map mathematical concepts to the complex hierarchy of types and definitions in formal libraries such as Mathlib, while ensuring that generated statements preserve the meaning of the source propositions. Existing approaches struggle because they rely heavily on the model's parametric memory for library-specific knowledge, while common data construction pipelines often resort to filtering single-pass outputs and lack mechanisms for feedback-driven revision. To address these challenges, we introduce MathForm, an autoformalization framework for constructing verified training data through Mathlib knowledge retrieval and verification-guided iterative refinement. Before generation, a retrieval planner gathers relevant definitions and existing formalizations from Mathlib to guide the formalization generator. Generated statements are then revised using compiler diagnostics and semantic-consistency feedback. Using this framework, we construct FormalVerse, a Lean 4 dataset containing approximately 367K verified examples across diverse mathematical domains and sources. We then train MathForm-8B through supervised fine-tuning followed by reinforcement learning. Across six benchmarks, MathForm-8B achieves average Pass@8 rates of 88.06% under Syntax Check (SC) and 72.37% under Consistency Check (CC), outperforming multiple specialized 32B autoformalizers. On the challenging FATE-H and FATE-X subsets, it attains CC pass rates of 63% and 37%, exceeding the strongest specialized baselines in both cases.", 'score': 3, 'issue_id': 3043, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '9eba6b46c4a3da59', 'authors': ['Lushi Pu', 'Weiming Zhang', 'Xinheng Xie', 'Zixuan Fu', 'Bingxiang He', 'Hengyu Zhao', 'Hongya Lyu', 'Xin Li', 'Jie Zhou', 'Yudong Wang'], 'affiliations': ['ModelBest Inc.', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14221.jpg', 'data': {'categories': ['#synthetic', '#science', '#dataset', '#small_models', '#rlhf', '#plp', '#training', '#optimization', '#rag', '#benchmark'], 'emoji': '📐', 'ru': {'title': 'Автоматическая формализация через поиск знаний и верификацию', 'desc': 'MathForm — это фреймворк для автоматизации формализации математических утверждений на языке Lean 4. Система использует поиск релевантных определений из библиотеки Mathlib и итеративное уточнение с помощью обратной связи от верификатора кода для создания надежных обучающих данных. На основе этого подхода авторы построили датасет FormalVerse с 367K проверенными примерами и обучили компактную 8-битную модель MathForm-8B через supervised fine-tuning и reinforcement learning. Модель демонстрирует превосходные результаты: достигает 88% точности при синтаксической проверке и 72% при семантической консистентности, превосходя специализированные модели в 32 раза большего размера на сложных бенчмарках.'}, 'en': {'title': 'Revolutionizing Autoformalization with MathForm', 'desc': 'MathForm is a framework designed to enhance the process of autoformalization, which involves converting natural language mathematical statements into formal languages like Lean 4. It improves this process by retrieving relevant knowledge from the Mathlib library and refining the generated outputs through feedback from verification checks. This iterative approach not only helps in creating a large dataset of verified examples but also trains a high-performing model, MathForm-8B, that excels in maintaining semantic consistency and syntax correctness. The results show that MathForm-8B significantly outperforms existing models, demonstrating its effectiveness in the autoformalization task.'}, 'zh': {'title': 'MathForm：智能自动形式化的未来', 'desc': 'MathForm 是一个自动形式化框架，通过检索 Mathlib 知识并利用验证反馈进行迭代优化，从而构建经过验证的训练数据。该框架在生成数学语句时，不仅仅是简单的翻译，而是需要将数学概念映射到复杂的类型和定义层次中。通过使用检索规划器收集相关定义和现有形式化内容，MathForm 能够提高生成语句的准确性和一致性。最终，MathForm-8B 模型在多个基准测试中表现优异，超越了许多专门的自动形式化工具。'}}}, {'id': 'https://huggingface.co/papers/2608.14881', 'title': 'Personalized Auto-Research: Towards a True AI Co-Scientist', 'url': 'https://huggingface.co/papers/2608.14881', 'abstract': 'Abstract The paper introduces personalized auto-research, a framework that conditions AI-driven hypothesis generation, experimentation, and writing on individual researcher representations to avoid generic outputs.  Generated by thinkingmachines/Inkling-Small AI co-scientists that generate hypotheses, retrieve related work, design experiments, execute code, and draft full papers are beginning to change how research is carried out. Despite this rapid progress, state-of-the-art systems remain researcher-agnostic: given a research goal, they optimize novelty, validity, or reviewer score while ignoring the individual scientist who will use the output. This overlooks a fundamental fact about research, namely, that what counts as novel, valuable, or feasible depends on the researcher, including their prior work, methodological repertoire, and the collaborators and communities in which they are embedded. In this work, we introduce the problem of personalized auto-research, which conditions every stage of the research process on a representation of the individual researcher. We argue that personalization is not a convenience layer, but rather the fundamental property that allows an AI system to serve as a genuine co-scientist rather than a generic instrument. To address this problem, we propose a general and flexible framework that threads a graph-grounded researcher context through retrieval, hypothesis search, experimentation, writing, and review. The framework consists of three fundamental components: (i) graph-grounded researcher representations, (ii) personalization across the full research pipeline, and (iii) evaluation grounded in the individual. Notably, we highlight a one-size-fits-all failure mode where distinct researchers issuing the same goal receive essentially the same research, erasing the tacit knowledge through which novel ideas arise. Finally, we discuss fundamental open problems and challenges.', 'score': 3, 'issue_id': 3042, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'f8431d7c21bcefac', 'authors': ['Bo Ni', 'Franck Dernoncourt', 'Hongjie Chen', 'Yu Wang', 'Nesreen K. Ahmed', 'Zhengzhong Tu', 'Tyler Derr', 'Ryan A. Rossi'], 'affiliations': ['Adobe Research', 'Cisco AI Research', 'Dolby Laboratories', 'Texas A&M University', 'University of Georgia', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14881.jpg', 'data': {'categories': [], 'emoji': '🔬', 'ru': {'title': 'AI-сокурсник, который знает вас лично', 'desc': 'В статье предлагается концепция персонализированного автоматического исследования, которая адаптирует работу AI-систем к характеристикам конкретного учёного. Авторы показывают, что современные системы-сокурсовники игнорируют индивидуальность исследователя, включая его прошлые работы, методологический инструментарий и научное окружение, что приводит к неоптимальным результатам. Предложенный фреймворк интегрирует представление исследователя на основе графов во все этапы научного процесса: поиск литературы, генерацию гипотез, проектирование экспериментов и написание статей. Авторы утверждают, что персонализация является не просто удобством, а фундаментальным свойством, которое превращает AI в истинного соавтора вместо универсального инструмента.'}, 'en': {'title': 'Personalized Auto-Research: Tailoring AI to Individual Scientists', 'desc': 'This paper presents a new approach called personalized auto-research, which tailors AI-driven research processes to individual researchers. It emphasizes that current AI systems often ignore the unique backgrounds and needs of researchers, leading to generic outputs. The proposed framework integrates personalized representations of researchers throughout the research pipeline, from hypothesis generation to writing. By doing so, it aims to enhance the relevance and novelty of research outputs, making AI a true co-scientist rather than just a tool.'}, 'zh': {'title': '个性化自动研究：让AI成为真正的共同科学家', 'desc': '本文介绍了个性化自动研究的框架，该框架根据个别研究者的特征来生成假设、进行实验和撰写论文，以避免产生通用的输出。通过思维机器/Inkling-Small AI共同科学家生成假设、检索相关工作、设计实验、执行代码和撰写完整论文，正在改变研究的方式。现有的系统往往忽视了研究者的个体差异，导致生成的研究成果无法满足特定研究者的需求。我们提出的个性化自动研究框架强调个性化是AI系统作为真正的共同科学家所必需的基本特性，而不是简单的便利层。'}}}, {'id': 'https://huggingface.co/papers/2608.17975', 'title': 'aDSL: Agentic 3D Creation via Joint Agent-Program Design', 'url': 'https://huggingface.co/papers/2608.17975', 'abstract': 'Abstract A co-designed domain-specific language and multi-agent system improve LLM-driven 3D program synthesis by using relational operators and iterative execution feedback.  Generated by thinkingmachines/Inkling-Small Programmatic representations provide a compelling paradigm for 3D content creation, enabling fine-grained edits, interpretability, and explicit structural control. Yet, agentic workflows that rely on large language models (LLMs) to author 3D programs remain brittle, often failing to translate high-level intent into consistent low-level geometry. We attribute this fragility to a mismatch between existing programmatic interfaces and the reasoning strengths of LLMs, which favor semantic structure and spatial relations over fragile numeric choices. In this paper, we jointly design an Agent-centric Domain-Specific Language (aDSL) and a role-specialized multi-agent system to close this gap. aDSL bridges semantic logic and geometric constraints by emphasizing composability and spatial reasoning; it enables agents to manipulate geometry through relational operators instead of brittle absolute coordinates. Building on aDSL, our training-free multi-agent system follows a Plan-Execute-Critic loop to decompose requests, synthesize code, and iteratively repair errors and constraint violations using execution feedback. Experiments show that this co-design improves robustness, controllability, and faithfulness to user intent. Our method outperforms prior LLM-based baselines on text-to-shape and image-to-shape tasks while preserving explicit structure, editability, and interpretability. It also enables downstream applications such as articulated object creation and structured scene composition. Our code is available at https://github.com/sig-pku/aDSL.', 'score': 2, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '6eaef21ac69c0b0f', 'authors': ['Rui-Huan Wang', 'Si-Tong Wei', 'Jia-Qi He', 'Heng-Yi Wei', 'Baoquan Chen', 'Peng-Shuai Wang'], 'affiliations': ['Peking University, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17975.jpg', 'data': {'categories': ['#3d', '#agents', '#architecture'], 'emoji': '🏗️', 'ru': {'title': 'Многоагентный синтез 3D-программ через реляционный язык и итеративное исправление', 'desc': 'В статье предложен подход к синтезу трёхмерных программ, где большие языковые модели работают с специально разработанным предметно-ориентированным языком (aDSL), который использует реляционные операторы вместо абсолютных координат. Авторы создали многоагентную систему с архитектурой Plan-Execute-Critic, которая разбивает задачу на этапы: планирование, генерация кода и итеративное исправление ошибок на основе обратной связи от выполнения программы. Совместное проектирование языка и системы агентов позволяет LLM лучше оперировать пространственными отношениями и семантической структурой, что значительно повышает устойчивость и точность синтеза трёхмерного контента. Экспериментально показано, что метод превосходит предыдущие подходы на задачах преобразования текста в форму и изображения в форму, сохраняя при этом интерпретируемость и возможность редактирования.'}, 'en': {'title': 'Bridging Intent and Geometry in 3D Program Synthesis', 'desc': 'This paper presents a new approach to creating 3D programs using a specially designed language and a multi-agent system that works with large language models (LLMs). The proposed Agent-centric Domain-Specific Language (aDSL) enhances the way agents handle geometry by focusing on relational operators, which improves the accuracy of translating user intentions into 3D shapes. The multi-agent system employs a Plan-Execute-Critic loop to refine the generated code, allowing for iterative corrections based on execution feedback. Overall, this method increases the reliability and control of 3D content creation while maintaining clarity and ease of editing.'}, 'zh': {'title': '提升3D程序合成的智能体系统与领域特定语言', 'desc': '本文提出了一种联合设计的面向特定领域的语言（aDSL）和多智能体系统，以改善基于大型语言模型（LLM）的3D程序合成。通过使用关系运算符和迭代执行反馈，aDSL能够更好地桥接语义逻辑与几何约束，使得智能体能够通过关系运算符操作几何体，而不是依赖脆弱的绝对坐标。我们的多智能体系统采用计划-执行-评估循环，能够分解请求、合成代码，并通过执行反馈迭代修复错误和约束违规。实验结果表明，这种联合设计提高了系统的鲁棒性、可控性和对用户意图的忠实度。'}}}, {'id': 'https://huggingface.co/papers/2608.15454', 'title': 'Dynamic Multi-Byte Prediction With Hierarchical Language Models', 'url': 'https://huggingface.co/papers/2608.15454', 'abstract': 'Abstract Multi-byte prediction accelerates byte-level hierarchical language models by generating parallel bytes via variable-length windows and causal attention masking, improving inference speed with minimal quality loss.  Generated by thinkingmachines/Inkling-Small Byte-level hierarchical language models (LMs) have recently emerged as a robust alternative to their popular counterparts that use subword tokenization. However, generating one byte at a time remains a bottleneck for inference speed. To address this, we introduce multi-byte prediction (MBP), which generates multiple bytes in parallel, speeding up inference with minimal performance impact and no additional parameters. MBP builds on the popular multi-token prediction (MTP) paradigm with two crucial innovations. First, we introduce a variable-length prediction window that aligns with the latent tokens, or segments, of a hierarchical LM. Second, we implement a novel attention-masking scheme that enables parallel byte prediction without violating causality. We show that multi-byte prediction strikes a Pareto-optimal trade-off across multiple generative tasks, instruction following, question answering, summarization, and machine translation, achieving the best trade-off between performance and inference throughput.', 'score': 2, 'issue_id': 3040, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '765aedd22867b35f', 'authors': ['Abraham Toluwase Owodunni', 'Chibuzor Okocha', 'Christan Grant', 'Tomasz Limisiewicz', 'Sachin Kumar'], 'affiliations': ['The Ohio State University', 'University of Florida', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15454.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Параллельная генерация байтов для ускорения языковых моделей без потери качества', 'desc': 'В статье предлагается метод мультибайтового предсказания (MBP) для ускорения байт-уровневых иерархических языковых моделей. Метод генерирует несколько байтов параллельно с помощью переменных окон предсказания и специальной маски внимания, которая сохраняет причинность. Подход основан на парадигме мультитокенного предсказания (MTP) и не требует дополнительных параметров модели. Экспериментальные результаты показывают оптимальный баланс между качеством вывода и скоростью инференса на различных задачах генерации, вопрос-ответных систем и машинного перевода.'}, 'en': {'title': 'Speed Up Language Models with Multi-Byte Prediction!', 'desc': 'This paper presents a method called multi-byte prediction (MBP) to enhance the efficiency of byte-level hierarchical language models. By generating multiple bytes simultaneously using a variable-length prediction window and a causal attention masking technique, MBP significantly speeds up inference without compromising quality. The approach builds on existing multi-token prediction methods and introduces innovations that allow for parallel processing while maintaining the necessary causal relationships in language generation. The results demonstrate that MBP achieves an optimal balance between performance and inference speed across various tasks such as instruction following and machine translation.'}, 'zh': {'title': '多字节预测：加速语言模型的创新之路', 'desc': '多字节预测（MBP）通过生成并行字节来加速字节级层次语言模型的推理速度，且仅有最小的质量损失。该方法解决了逐字节生成的瓶颈问题，允许在不增加额外参数的情况下同时生成多个字节。MBP结合了可变长度的预测窗口和新颖的注意力掩蔽机制，确保了因果性不被破坏。实验表明，MBP在多个生成任务中实现了性能与推理吞吐量之间的最佳平衡。'}}}, {'id': 'https://huggingface.co/papers/2608.16097', 'title': 'Unifying Graph Neural Networks Through a Common Layer Equation', 'url': 'https://huggingface.co/papers/2608.16097', 'abstract': "Abstract A unified layer equation decomposes graph neural networks into seven components to compare architectures, derive theoretical bounds, and expose design choices linked to oversmoothing and expressivity.  Generated by thinkingmachines/Inkling-Small Graph neural networks are commonly described through family-specific equations whose notation obscures shared computations and structural differences. We introduce a common layer equation that represents covered architectures through seven components: an update domain, channel set, propagation bank, per-channel message maps, channel-fusion operator, ego/residual map, and update map. The central factorization separates where information moves, encoded by the propagation bank, from what moves, encoded by the message maps. Function-valued fillings extend the same equation across local message passing, attention, spectral filtering, global communication, relation-specific channels, higher-order domains, and geometric messages.   We make this unification explicit and checkable through worked reductions of canonical layers and component assignments spanning seven nonexclusive architectural families. A fixed slot discipline assigns operations by computational role and defines the framework's coverage boundary. The decomposition also yields component-level theoretical insights: under endpoint-local messages and node-local updates, operator support bounds one-layer dependencies, and one-layer global mixing requires a full effective operator row under the stated hypotheses.   The resulting framework organizes more than 200 architectures in a common design space, enables component-wise comparison and generation of structurally consistent architectures, and connects propagation choices to oversmoothing, oversquashing, heterophily, and expressivity. It further exposes the empirical inverse problem of mapping measurable graph and task properties to validated component choices.", 'score': 1, 'issue_id': 3042, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '620dbfeb9b9a8d67', 'authors': ['Sai Karthik Navuluru', 'Siddhartha Shankar Das', 'Bo Ni', 'Hongjie Chen', 'Yu Wang', 'Baris Coskunuzer', 'Nesreen K. Ahmed', 'Franck Dernoncourt', 'Mahantesh Halappanavar', 'Tyler Derr', 'Ryan A. Rossi', 'Lakshman Tamil'], 'affiliations': ['Adobe Research', 'Cisco AI Research', 'Dolby Laboratories', 'Pacific Northwest National Laboratory', 'University of Georgia', 'University of Texas at Dallas', 'Vanderbilt University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16097.jpg', 'data': {'categories': ['#math', '#architecture', '#graphs'], 'emoji': '🧩', 'ru': {'title': 'Единая декомпозиция графических нейронных сетей в семь компонентов', 'desc': 'Работа предлагает единую математическую формулировку для графических нейронных сетей, разлагая их на семь компонентов: домен обновления, набор каналов, банк распространения, отображения сообщений, оператор слияния каналов, эго/остаточное отображение и отображение обновления. Такая унифицированная запись позволяет сравнивать различные архитектуры GNN, включая локальную передачу сообщений, внимание, спектральную фильтрацию и глобальную коммуникацию, в едином дизайн-пространстве. Авторы получили теоретические границы для глубины зависимостей и условия глобального перемешивания информации, а также установили связь между выбором компонентов и проблемами переглаживания и выразительности сети. Предложенный фреймворк организует более 200 архитектур GNN и дает инструмент для систематического анализа их свойств.'}, 'en': {'title': 'Unifying Graph Neural Networks for Better Design and Comparison', 'desc': 'This paper presents a unified layer equation that breaks down graph neural networks (GNNs) into seven key components, allowing for easier comparison of different architectures. By separating the movement of information from the content being moved, the authors provide a clearer understanding of how various GNN designs operate. The framework not only organizes over 200 existing architectures but also offers theoretical insights into issues like oversmoothing and expressivity. Ultimately, it aims to connect specific design choices with measurable properties in graph tasks, facilitating better architecture development.'}, 'zh': {'title': '统一图神经网络架构的七个组成部分', 'desc': '这篇论文提出了一种统一的层方程，将图神经网络分解为七个组成部分，以便比较不同的架构，推导理论界限，并揭示与过平滑和表达能力相关的设计选择。通过这种统一，研究者能够清晰地展示信息的流动和内容的移动，进而分析不同架构的特性。论文还提供了一个框架，组织了超过200种架构，使得组件之间的比较和结构一致的架构生成成为可能。最后，研究揭示了如何将可测量的图和任务属性映射到经过验证的组件选择上。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (11)', '#agi (1)', '#alignment', '#architecture (6)', '#audio', '#benchmark (9)', '#cv', '#data (1)', '#dataset (6)', '#diffusion (4)', '#ethics', '#games', '#graphs (2)', '#hallucinations', '#healthcare', '#inference (1)', '#interpretability', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (5)', '#open_source (3)', '#optimization (6)', '#plp (2)', '#rag (1)', '#reasoning (2)', '#rl (3)', '#rlhf (1)', '#robotics (1)', '#science (2)', '#security', '#small_models (1)', '#story_generation', '#survey', '#synthetic (2)', '#training (7)', '#transfer_learning', '#video (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-19 07:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-19 07:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-19 07:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
