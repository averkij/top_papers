    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        function toggleTheme() {

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.05416', 'title': 'WorldSculpt: Generating Compositional Worlds from Grounded Videos', 'url': 'https://huggingface.co/papers/2609.05416', 'abstract': 'Abstract Adapting a single-object 3D generative prior to multi-view observations enables scalable compositional mesh reconstruction of densely cluttered scenes with severe occlusion.  Generated by thinkingmachines/Inkling-Small We study the problem of generating a compositional 3D representation of a cluttered scene containing hundreds of objects. The goal is to represent the scene as a collection of individual object meshes placed in a shared world frame, as required by downstream applications such as gaming, AR/VR, simulation, and robotics. This task is challenging in densely cluttered scenes, where objects heavily occlude one another and each view reveals only a fraction of their geometry. Geometry-based approaches typically reconstruct the scene as a single representation and leave incomplete geometry in occluded regions, while existing compositional methods with generative priors are largely limited to relatively simple scenes. We show that complex scenes with hundreds of objects can instead be generated compositionally by adapting a strong single-object 3D generative prior to multi-view observations. We instantiate this paradigm with Pixal3D, extending it with a multi-view conditioning pathway that grounds object generation in multiple posed observations. Although the model is finetuned entirely on single objects in canonical space, it generalizes to large scenes with severe occlusion without any scene-level training, demonstrating the feasibility and scalability of this paradigm. We further introduce UE-MeshyScene, a photorealistic benchmark of densely cluttered scenes with hundreds of objects, per-object annotations, and ground-truth meshes. Across single-object, controlled multi-object, and UE-MeshyScene evaluations, our method consistently outperforms prior approaches, with larger gains as scene complexity and occlusion increase. Finally, we demonstrate broader applicability by converting generated 3DGS worlds, such as Marble and HY-World 2.0, into compositional mesh scenes.', 'score': 1, 'issue_id': 3230, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '44e0070b6f3dd9aa', 'authors': ['Muyao Niu', 'Jixuan He', 'Ruihan Yu', 'Lian Fu', 'Yonghao Yu', 'Zheng-Hui Huang', 'Yifan Zhan', 'Fengbo Lan', 'Yongtao Ge', 'Yinqiang Zheng', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2609.05416.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#dataset', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Композиционная реконструкция загромождённых сцен через адаптацию генеративного прайора', 'desc': 'В работе предлагается метод адаптации единого трёхмерного генеративного прайора для реконструкции композиционных сцен с сотнями объектов из многовидовых наблюдений. Ключевая идея заключается в том, что модель, обученная только на одиночных объектах в канонической системе координат, может обобщаться на сложные сцены с сильной окклюзией без обучения на уровне сцены. Авторы расширяют модель Pixal3D многовидовым кондиционированием и представляют новый фотореалистичный бенчмарк UE-MeshyScene с плотно упакованными сотнями объектов. Экспериментальные результаты показывают, что предложенный подход последовательно превосходит существующие методы, особенно при увеличении сложности сцены и уровня окклюзии.'}, 'en': {'title': 'Revolutionizing 3D Scene Reconstruction with Compositional Meshes', 'desc': 'This paper addresses the challenge of creating a detailed 3D representation of complex scenes filled with many objects that often block each other from view. It introduces a method that adapts a single-object 3D generative model to work with multiple views of a scene, allowing for the reconstruction of individual object meshes in a shared coordinate system. The approach, implemented in a system called Pixal3D, effectively handles severe occlusions and generates accurate representations without needing extensive training on complex scenes. The authors also present a new benchmark, UE-MeshyScene, to evaluate their method against existing techniques, showing significant improvements in performance as scene complexity increases.'}, 'zh': {'title': '适应多视角的三维生成模型，重建复杂场景', 'desc': '本研究探讨了如何将单一物体的三维生成先验适应于多视角观察，以实现复杂场景的组合网格重建。我们的方法能够在物体严重遮挡的情况下，生成包含数百个物体的场景的三维表示。通过引入多视角条件路径，模型能够在多个视角下生成物体，尽管模型仅在单一物体上进行微调，但它在复杂场景中表现出良好的泛化能力。我们的实验表明，该方法在处理复杂场景时，性能优于现有方法，且在场景复杂度和遮挡程度增加时，效果提升更为显著。'}}}, {'id': 'https://huggingface.co/papers/2609.04304', 'title': 'Iris: Climbing to the Search Frontier', 'url': 'https://huggingface.co/papers/2609.04304', 'abstract': 'Abstract Two large-scale search agents are trained via a multi-stage pipeline combining supervised fine-tuning and reinforcement learning against live search, achieving state-of-the-art open-source results on complex web benchmarks through rigorous trajectory filtering and inference-time context management.  Generated by thinkingmachines/Inkling-Small We present Iris-mini and Iris-pro, two search agents trained at the 35B-A3B and 397B-A17B scales, together with the data pipeline and training recipe behind them. Tasks are reverse-constructed from the hyperlink structure of a web corpus: we author multi-hop chains over an entity graph distilled from a seed page and its out-links, rewrite every non-answer entity into a descriptive reference so that no clue can be resolved by string matching, and admit only questions that a reference model fails closed-book yet solves once the supporting evidence is supplied. These questions are then turned into trajectories, which are filtered at both the trajectory and the turn level before SFT. The policy is then optimized by RL against live search, with the reward judge and the observation summarizer served inside the training cluster, and with over-long rollouts interrupted at the request level and resumed from their committed prefix at the next step. We alternate the two stages in a procedure we call SFT-RL climbing, returning the hardest solved and most efficient rollouts of each RL round to the next supervised pass. Because inference-time context management is worth more on these benchmarks than most reported differences between systems, we evaluate every benchmark both with and without it, holding the tool set, the context limit, and the judge fixed. All results come from a single ReAct agent, with no sub-agents and no test-time verification. With management enabled, on BrowseComp, BrowseComp-ZH, DeepSearchQA, and HLE the two models reach 82.2/84.8/86.9/52.3 and 88.6/85.1/92.9/56.4, the strongest overall results among open-source search agents in their respective parameter ranges. We plan to release the model weights together with the complete recipe for data construction, training, and evaluation.', 'score': 1, 'issue_id': 3230, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '40981e358ff8c7d5', 'pdf_title_img': 'assets/pdf/title_img/2609.04304.jpg', 'data': {'categories': ['#rlhf', '#reasoning', '#open_source', '#dataset', '#benchmark', '#training', '#multilingual', '#agents', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Обучение поисковых агентов через чередующиеся этапы supervised и reinforcement learning', 'desc': 'В статье представлены два агента поиска Iris-mini и Iris-pro, обученные с помощью многоэтапного конвейера, который сочетает supervised fine-tuning и reinforcement learning против живого веб-поиска. Задачи были сконструированы путём извлечения многошаговых цепочек из графа сущностей веб-корпуса с строгой фильтрацией траекторий на уровне шагов и ответов. Агенты оптимизируются методом RL с использованием техники SFT-RL climbing, которая чередует этапы обучения с учителем и обучения с подкреплением, возвращая наиболее сложные решённые примеры в следующий supervised проход. Модели достигли state-of-the-art результатов на комплексных бенчмарках веб-поиска благодаря эффективному управлению контекстом во время инференса и отказу от дополнительных агентов и проверки на тестовом наборе.'}, 'en': {'title': 'Revolutionizing Search with Iris Agents: SFT Meets RL!', 'desc': 'This paper introduces two advanced search agents, Iris-mini and Iris-pro, which are trained using a combination of supervised fine-tuning (SFT) and reinforcement learning (RL) to achieve top performance on complex web search tasks. The training process involves creating multi-hop question chains from a web corpus and filtering trajectories to ensure only the most challenging questions are used for training. The agents are optimized through a unique SFT-RL climbing method, which alternates between supervised and reinforcement learning stages to enhance their performance. The results demonstrate significant improvements in search accuracy, showcasing the effectiveness of context management during inference.'}, 'zh': {'title': '智能搜索代理的突破性进展', 'desc': '本文介绍了两个大型搜索代理Iris-mini和Iris-pro，它们通过结合监督微调和强化学习的多阶段管道进行训练。这些代理在复杂的网络基准测试中取得了最先进的开源结果，采用了严格的轨迹过滤和推理时上下文管理。任务是从网页语料库的超链接结构反向构建的，确保问题无法通过字符串匹配解决。通过SFT-RL爬升程序交替优化策略，最终实现了在多个基准测试中的最佳表现。'}}}, {'id': 'https://huggingface.co/papers/2609.00444', 'title': 'Group Adaptive Clipping Policy Optimization', 'url': 'https://huggingface.co/papers/2609.00444', 'abstract': 'Abstract GAPO adaptively adjusts importance-sampling clipping thresholds based on rollout advantage to preserve stronger gradient signals from low-success groups in reinforcement learning with verifiable rewards.  Generated by thinkingmachines/Inkling-Small Group relative policy optimization for reinforcement learning with verifiable rewards (RLVR) typically uses a fixed importance-sampling (IS) ratio clipping boundary across all rollouts. We identify a key limitation: rare correct rollouts on harder problems and abundant correct rollouts on easier problems are clipped at comparable rates, despite contributing very different learning signals. Rollouts with low group success exhibit larger IS ratios and carry stronger gradient signal for exploration and solving new problems, yet are disproportionately suppressed by fixed clipping.   To address this, we propose Group Adaptive Clipping Policy Optimization (GAPO), a plug-in modification to GRPO methods that adapts the clipping boundary to the rollout advantage. GAPO is motivated by a reverse-KL trust-region perspective, which suggests that rollouts with larger learning signal should receive proportionally greater update headroom. GAPO requires no reward shaping and preserves the standard PPO/GSPO surrogate while adapting only the clipping threshold. Across Qwen and Llama models, GAPO consistently improves both Pass@1 and Pass@k over fixed clipping and advantage-shaping baselines on math reasoning and coding benchmarks where the pass rates by the base model are relatively low.', 'score': 1, 'issue_id': 3230, 'pub_date': '2026-08-31', 'pub_date_card': {'ru': '31 августа', 'en': 'August 31', 'zh': '8月31日'}, 'hash': '36b839c9dd3d1a0d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rlhf', '#rl', '#plp', '#training'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное отсечение для усиления обучения редких успехов', 'desc': 'Статья представляет GAPO — адаптивный метод для оптимизации политики в обучении с подкреплением, который динамически подстраивает пороги отсечения важностного взвешивания в зависимости от преимущества траектории. Авторы выявили проблему: при использовании фиксированных порогов отсечения редкие успешные примеры на сложных задачах и частые успехи на простых задачах подавляются одинаково, хотя несут очень разные сигналы обучения. GAPO предлагает адаптировать граничное значение отсечения к групповому преимуществу, что позволяет сохранить более сильные градиенты от примеров с низкой вероятностью успеха, которые содержат больше информации для исследования и решения новых задач. Метод не требует переформирования награды и демонстрирует улучшения на задачах математического рассуждения и программирования для моделей Qwen и Llama.'}, 'en': {'title': 'Enhancing Learning Signals with Adaptive Clipping in Reinforcement Learning', 'desc': 'The paper introduces Group Adaptive Clipping Policy Optimization (GAPO), a method that improves reinforcement learning by adjusting the importance-sampling clipping thresholds based on the advantage of rollouts. Traditional methods use a fixed clipping boundary, which can hinder learning from rare but informative rollouts, especially in challenging tasks. GAPO allows rollouts with lower success rates, which often carry stronger learning signals, to have more influence on the training process. This approach enhances performance on benchmarks by ensuring that valuable learning opportunities are not suppressed, leading to better outcomes in tasks like math reasoning and coding.'}, 'zh': {'title': '自适应剪切优化，提升强化学习效果', 'desc': 'GAPO是一种自适应调整重要性采样剪切阈值的方法，旨在强化学习中保留来自低成功组的强梯度信号。传统的相对策略优化方法使用固定的剪切边界，导致在困难问题上稀有的正确回合和简单问题上丰富的正确回合被以相似的速率剪切。GAPO通过根据回合优势调整剪切边界，确保具有更大学习信号的回合获得更多的更新空间。实验结果表明，GAPO在数学推理和编码基准测试中，相较于固定剪切和优势塑形基线，显著提高了模型的通过率。'}}}, {'id': 'https://huggingface.co/papers/2609.05295', 'title': 'RISE: Recursive Improvement via Self-Extrapolating Policy Distillation', 'url': 'https://huggingface.co/papers/2609.05295', 'abstract': "Abstract RISE improves language model post-training by recursively generating dense token-level supervision from the model's own reinforcement learning trajectory via self-extrapolation, avoiding external teachers.  Generated by thinkingmachines/Inkling-Small On-policy distillation (OPD) provides dense, per-token supervision for language model post-training, but its effectiveness is bottlenecked by teacher quality: external teachers suffer from distribution mismatch, while self-distillation with privileged conditioning is limited by in-context learning capacity. We propose RISE (Recursive Improvement via Self-Extrapolating Policy Distillation), which constructs a synthetic teacher directly from the model's own RLVR training trajectory. By extrapolating the displacement between the current checkpoint and a trailing anchor---in parameter space or output logit space---RISE converts a sparse outcome-induced parameter update into a dense token-level target, without any external model or privileged conditioning. RISE combines RLVR and OPD in a complementary loop: outcome rewards ground the extrapolation toward correct reasoning, while the extrapolated teacher refines token-level decisions. Moreover, since the teacher is refreshed every iteration as the student improves, distillation becomes a recursive improvement mechanism rather than a one-shot compression step. Experiments spanning mathematical reasoning, multi-domain STEM, code generation, and multi-turn agentic tasks show that RISE outperforms RLVR-only training and on-policy self-distillation across all settings.", 'score': 0, 'issue_id': 3230, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': '8d9d6599b062ea43', 'authors': ['Yang Li', 'Semih Yavuz', 'Shafiq Joty'], 'affiliations': ['Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2609.05295.jpg', 'data': {'categories': ['#rlhf', '#rl', '#training'], 'emoji': '🔄', 'ru': {'title': 'Самосовершенствование языковой модели через рекурсивную самодистилляцию', 'desc': 'В работе предлагается RISE — метод улучшения языковых моделей, который использует самодистилляцию на основе собственной траектории обучения с подкреплением. Вместо внешних учителей модель генерирует плотное токен-уровневое supervision путём экстраполяции изменений параметров между текущей версией и предыдущей контрольной точкой. Метод объединяет обучение с подкреплением и дистилляцию в рекурсивный цикл, где награды за результаты направляют улучшение логики, а синтетический учитель уточняет решения на уровне токенов. Экспериментальные результаты показывают, что RISE превосходит как обучение только с подкреплением, так и существующие методы self-distillation во всех задачах от математического рассуждения до написания кода.'}, 'en': {'title': 'Self-Improving Language Models with RISE', 'desc': 'RISE (Recursive Improvement via Self-Extrapolating Policy Distillation) enhances language model training by generating its own supervision from its reinforcement learning trajectory. This method avoids reliance on external teachers, which often face issues like distribution mismatch. By using self-extrapolation, RISE transforms sparse updates into dense, token-level targets, allowing for more effective learning. The approach creates a continuous feedback loop where the model improves iteratively, leading to better performance in various tasks such as mathematical reasoning and code generation.'}, 'zh': {'title': '自我外推，提升语言模型的智能！', 'desc': 'RISE（递归改进通过自我外推策略蒸馏）是一种改进语言模型后训练的方法。它通过模型自身的强化学习轨迹生成密集的标记级监督，避免了使用外部教师。RISE通过在参数空间或输出对数空间中外推当前检查点与滞后锚点之间的位移，将稀疏的结果诱导参数更新转化为密集的标记级目标。实验表明，RISE在数学推理、多领域STEM、代码生成和多轮代理任务中均优于仅使用RLVR训练和基于策略的自我蒸馏。'}}}, {'id': 'https://huggingface.co/papers/2609.05275', 'title': "Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference", 'url': 'https://huggingface.co/papers/2609.05275', 'abstract': 'Abstract Layer dropout improves large language model training efficiency and enables faster inference via early exit and speculative decoding without sacrificing accuracy.  Generated by thinkingmachines/Inkling-Small Layer dropout (a.k.a. stochastic depth) has been shown to enable faster training, higher accuracy, and robustness to zero-shot layer pruning in both language and vision transformers. However, as models and datasets have scaled, dropout - particularly layer dropout - has largely disappeared from large language models (LLMs) pre-training recipes. While some prior work has reported that dropout can degrade accuracy, no comprehensive study has quantified, let alone mitigated, this effect. In this study, we show that layer dropout should be used in state-of-the-art LLM training, establishing best practices and scaling analysis for both training and post-training benefits. Concretely, with optimal layer distribution, time schedule, and optimizer hyperparameters, we observe that at the same training FLOPs layer dropout leads to lower loss. For a given number of training steps, LLMs can achieve lower or similar validation loss while saving upto 25% of training FLOPs. Moreover, layer dropout enables significant post-training optimizations, such as early exit, intermediate-layer skipping, and self-speculative decoding, yielding up to 1.5x inference speedup with negligible accuracy loss. Across more than 2400 training experiments, spanning models from 271M to 8.2B parameters and datasets up to 160B tokens, we demonstrate that these findings extend reliably to large-scale training regimes. All pre-training experiments were run on Cerebras CS-3 systems.', 'score': 0, 'issue_id': 3230, 'pub_date': '2026-09-04', 'pub_date_card': {'ru': '4 сентября', 'en': 'September 4', 'zh': '9月4日'}, 'hash': 'ae39318f85f2f05d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#optimization', '#architecture', '#training'], 'emoji': '⚡', 'ru': {'title': 'Layer dropout: экономия вычислений без потери качества больших языковых моделей', 'desc': 'В статье исследуется применение layer dropout (стохастической глубины) при обучении больших языковых моделей, которая была забыта в современных рецептах pre-training. Авторы показывают, что при оптимальном распределении layer dropout, расписании обучения и гиперпараметрах оптимизатора можно достичь нижней величины потерь при одинаковом количестве операций, сэкономив до 25% вычислительных ресурсов. Layer dropout также позволяет применять эффективные техники инференса: early exit, пропуск промежуточных слоёв и self-speculative decoding, ускоряя инференс в 1.5 раза без значительной потери точности. Результаты подтверждены на более чем 2400 экспериментах с моделями от 271M до 8.2B параметров и датасетами до 160B токенов.'}, 'en': {'title': 'Boosting LLM Efficiency with Layer Dropout', 'desc': 'This paper discusses the benefits of using layer dropout in training large language models (LLMs). Layer dropout, also known as stochastic depth, can enhance training efficiency and improve model accuracy while reducing the computational resources needed. The authors provide evidence that implementing layer dropout allows for faster inference through techniques like early exit and speculative decoding, without compromising accuracy. Their extensive experiments show that with the right configurations, layer dropout can lead to lower validation loss and significant savings in training time and resources.'}, 'zh': {'title': '层丢弃：提升大型语言模型训练效率的关键', 'desc': '本研究探讨了层丢弃（layer dropout）在大型语言模型（LLM）训练中的重要性。通过优化层分布、时间调度和优化器超参数，层丢弃可以在相同的训练计算量下降低损失，并节省多达25%的训练资源。研究表明，层丢弃不仅提高了训练效率，还支持早期退出和自我推测解码等后训练优化，显著加快推理速度。我们的实验覆盖了从271M到8.2B参数的模型和高达160B标记的数据集，结果表明这些发现适用于大规模训练。'}}}, {'id': 'https://huggingface.co/papers/2609.04490', 'title': 'When Quantization Breaks Memory: Recurrent-State Write-Back in Low-Precision Temporal Inference', 'url': 'https://huggingface.co/papers/2609.04490', 'abstract': 'Abstract Quantized recurrent inference suffers from state write-back rules that suppress small updates, but error feedback and residual memory restore accuracy without retraining across GRU and LSTM architectures.  Generated by thinkingmachines/Inkling-Small Quantization is widely used to reduce the computational and memory demands of neural-network inference. In recurrent networks, however, the quantized state is stored and returned at the next time step, so the rule used to store that state can alter subsequent computations. Here, we introduce recurrent-state write-back to denote this rule and isolate its effect in a compact GRU encoder--decoder for fluorescence lifetime imaging, a molecular imaging modality used in quantitative biological imaging. A central task is estimating two lifetime parameters, the short-lived component τ1 and the long-lived component τ2, from high-noise time-resolved fluorescence signals. Holding the trained model fixed, replacing continuous state propagation with deterministic 4-bit state storage increases estimation errors for τ1 and τ2 by approximately 70x and 300x, respectively. Failure occurs when repeated small updates remain below the write threshold, leaving the stored state nearly fixed while the network continues to propose change. Error feedback, residual memory, and direction memory carry information from these suppressed updates across time and recover accuracy without retraining. Precision sweeps show that increasing state precision can worsen a fixed recurrent solution, while matched training shows that compatibility with the state interface can be learned. To test whether this behavior extends beyond the GRU, we repeat the post-training intervention in an independently trained LSTM, where coarse write-back reproduces the failure, error feedback restores accuracy, and state-specific interventions reveal greater sensitivity of the cell state than the hidden state. Our results establish recurrent-state write-back as a key determinant of low-precision recurrent dynamics and identify the state-storage interface as a central design consideration for quantized recurrent inference.', 'score': 0, 'issue_id': 3230, 'pub_date': '2026-09-03', 'pub_date_card': {'ru': '3 сентября', 'en': 'September 3', 'zh': '9月3日'}, 'hash': '8d20b4d32c897226', 'authors': ['Ismail Erbas', 'Xavier Intes', 'Vikas Pandey'], 'affiliations': ['Department of Biomedical Engineering, Center for Modeling, Simulation, and Imaging in Medicine, Rensselaer Polytechnic Institute, Troy, NY 12180'], 'pdf_title_img': 'assets/pdf/title_img/2609.04490.jpg', 'data': {'categories': ['#inference', '#healthcare', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Обратная связь ошибки спасает квантованные рекуррентные сети', 'desc': 'В этой работе исследуется проблема квантизации рекуррентных нейронных сетей, которая приводит к значительным ошибкам при сохранении состояния в низкой точности. Авторы вводят концепцию «write-back правила» для состояния и показывают, что оно критически влияет на точность вывода в архитектурах GRU и LSTM. Они предлагают использовать error feedback и residual memory для восстановления точности без переобучения модели, демонстрируя это на задаче флуоресцентной спектроскопии. Результаты показывают, что правильная организация интерфейса хранения состояния является ключевым фактором для успешной квантизации рекуррентных сетей.'}, 'en': {'title': 'Unlocking Accuracy in Quantized Recurrent Networks', 'desc': 'This paper discusses the challenges of using quantized recurrent neural networks, specifically focusing on how state write-back rules can hinder small updates in GRU and LSTM architectures. The authors introduce the concept of recurrent-state write-back, which affects the accuracy of estimating parameters in fluorescence lifetime imaging. They demonstrate that using low-precision state storage can significantly increase estimation errors, but techniques like error feedback and residual memory can help recover accuracy without retraining the model. The findings highlight the importance of the state-storage interface in designing effective quantized recurrent inference systems.'}, 'zh': {'title': '量化递归推理中的状态写回关键性', 'desc': '量化递归推理在状态写回规则上存在问题，这会抑制小的更新。通过错误反馈和残余记忆，可以在不重新训练的情况下恢复GRU和LSTM架构的准确性。我们提出了递归状态写回的概念，并在荧光寿命成像的紧凑GRU编码器-解码器中分析其影响。研究表明，状态存储接口是量化递归推理设计中的一个重要考虑因素。'}}}];

                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-07 02:03',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-07 02:03')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-07 02:03')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
