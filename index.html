потоковых видео через дистилляцию с минимальной памятью', 'desc': 'В статье предложен StreamOPD — метод для улучшения понимания потоковых видео через дистилляцию моделей на своей политике с проверяемыми наградами и механизмом пространственно-временного управления сигналами. Исследователи показали, что простой скользящий временной интервал уже работает хорошо, поэтому они сосредоточились на том, как постобучение без дополнительной памяти во время инференса может улучшить качество. Метод комбинирует режим «размышления» во время обучения с режимом инструкций во время развертывания, достигая результатов почти на уровне учительской модели. Предложенный подход ST-CueGate использует отношения вероятностей учителя для переподсчета весов в дистилляции и показывает консистентные улучшения на всех бенчмарках.'}, 'en': {'title': 'StreamOPD: Enhancing Streaming Video Understanding Without Memory', 'desc': "StreamOPD is a method designed to enhance the understanding of streaming video by using on-policy distillation and a mechanism for spatio-temporal cue-gating. It achieves performance close to a larger teacher model without needing memory during inference, which is a common requirement in existing systems. The approach combines reinforcement learning with verifiable rewards and focuses on training models in a 'thinking mode' to improve their responses. By implementing this method, StreamOPD significantly boosts performance on various benchmarks, demonstrating its effectiveness in streaming video tasks."}, 'zh': {'title': 'StreamOPD：无内存流媒体视频理解的创新之路', 'desc': 'StreamOPD通过可验证奖励的在线策略蒸馏和时空线索门控机制，提升了流媒体视频理解的能力，几乎达到了教师模型的性能，而无需推理时的内存。该方法采用无内存的最近窗口协议，探索后训练的潜力，发现强化学习在此场景下效果不佳。通过密集的标记级教师监督，在线策略蒸馏（OPD）在思考模式下稳定性更高。最终，StreamOPD在多个基准测试中显著提高了性能，提供了一个透明且可重复的开源流媒体视频研究参考。'}}}, {'id': 'https://huggingface.co/papers/2608.16485', 'title': 'HiFi-BRep: High-Fidelity Latent Representation for Robust B-Rep Generation', 'url': 'https://huggingface.co/papers/2608.16485', 'abstract': 'Abstract HiFi-BRep improves B-Rep synthesis by using a topology-aware encoder and a single-stage decoder that jointly predicts geometry and topology with differentiable validity constraints.  Generated by thinkingmachines/Inkling-Small Boundary representation (B-Rep) generation is a fundamental task in computer-aided design, yet the direct synthesis of high-fidelity and structurally valid B-Reps remains a major challenge. Existing deep generative methods suffer from two forms of brittleness: representation brittleness, caused by padding noise and feature contamination in the latent space, and generation brittleness, stemming from sequential error propagation and a train-inference mismatch due to non-differentiable validity enforcement. We propose HiFi-BRep, a novel framework that addresses these limitations through two synergistic contributions. First, a topology-aware encoder constructs a high-fidelity latent representation by eliminating padding via learnable queries and preventing feature contamination with topology-guided attention. Second, a single-stage decoder jointly predicts geometry and topology in parallel, embedding core manifold constraints as a differentiable learning objective. This design ensures mutual guidance between geometry and topology while avoiding cascaded errors. Extensive experiments show that HiFi-BRep significantly outperforms state-of-the-art methods in both structural validity and geometric fidelity, providing a robust solution for high-quality B-Rep synthesis. Code and models are publicly available at https://github.com/1nnoh/HiFi-BRep.', 'score': 0, 'issue_id': 3021, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '0076e817cf29294f', 'authors': ['Junhao Hou', 'Chenqi Luo', 'Pufan Wang', 'Jiaying Lu', 'Yusheng Liu', 'Feiwei Qin', 'Meie Fang', 'Kun Zhou'], 'affiliations': ['Guangzhou University', 'Hangzhou Dianzi University', 'State Key Lab of CAD&CG, Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16485.jpg', 'data': {'categories': ['#3d', '#architecture'], 'emoji': '🏗️', 'ru': {'title': 'Топология и геометрия в едином потоке: синтез высокофиделити граничных представлений', 'desc': 'Статья представляет HiFi-BRep, инновационную архитектуру глубокого обучения для синтеза граничных представлений (B-Rep) в компьютерном проектировании. Авторы решают проблему хрупкости представлений, используя топологически-осведомленный энкодер с обучаемыми запросами и топологически-направленным механизмом внимания для создания высокофиделити скрытого пространства. Одноэтапный декодер параллельно предсказывает геометрию и топологию, встраивая многообразные ограничения как дифференцируемую целевую функцию, что исключает каскадные ошибки. Экспериментальные результаты демонстрируют значительное превосходство метода над существующими подходами по структурной валидности и геометрической точности.'}, 'en': {'title': 'Revolutionizing B-Rep Synthesis with HiFi-BRep', 'desc': 'HiFi-BRep is a new framework designed to improve the synthesis of boundary representations (B-Reps) in computer-aided design. It uses a topology-aware encoder to create high-quality latent representations while avoiding common issues like padding noise and feature contamination. The framework also features a single-stage decoder that predicts both geometry and topology simultaneously, incorporating differentiable validity constraints to enhance accuracy. As a result, HiFi-BRep achieves better structural validity and geometric fidelity compared to existing methods, making it a significant advancement in B-Rep generation.'}, 'zh': {'title': '高保真边界表示合成的创新解决方案', 'desc': 'HiFi-BRep 是一种改进的边界表示（B-Rep）合成方法，采用了拓扑感知编码器和单阶段解码器，能够同时预测几何形状和拓扑结构，并引入可微分的有效性约束。该方法解决了现有深度生成方法在表示脆弱性和生成脆弱性方面的挑战，确保了生成的 B-Rep 具有高保真度和结构有效性。通过学习查询消除填充噪声，并利用拓扑引导注意力防止特征污染，HiFi-BRep 构建了高保真的潜在表示。实验结果表明，HiFi-BRep 在结构有效性和几何保真度方面显著优于现有的最先进方法，提供了一种高质量 B-Rep 合成的稳健解决方案。'}}}, {'id': 'https://huggingface.co/papers/2608.15037', 'title': 'Prototype-Rectified Iterative Self-supervised Manifold Denoising under Severe Acoustic Shift', 'url': 'https://huggingface.co/papers/2608.15037', 'abstract': 'Abstract PRISM is a fast, training-free test-time adaptation method that reverses low-rank affine noise distortions in audio-text models using frozen text prototypes and geometric corrections.  Generated by thinkingmachines/Inkling-Small Audio-Text Foundation Models (ATMs) fail catastrophically under severe acoustic noise, yet existing adaptation strategies either rely on gradient-based Test-Time Adaptation (TTA), which reinforces noise rather than signal, or on prompt tuning that requires privileged noise annotations unavailable at inference. We address these failures with PRISM (Prototype-Rectified Iterative Self-supervised Manifold Denoising), a training-free, source-free TTA framework grounded in the Affine Noise Hypothesis: severe acoustic noise induces a low-rank affine shift in the multimodal latent space, with more than 90% of distortion energy confined to the leading 60 principal components. PRISM estimates and reverses this distortion from an unlabeled target batch using frozen text prototypes as geometric anchors via three closed-form geometric corrections compiled into a single static projection matrix by Affine Bias Regression. At inference, adaptation reduces to one matrix-vector multiplication in 0.0009 ms, making it substantially faster than gradient-based TTA while requiring no additional training. On UrbanSound8K, PRISM improves over the zero-shot baseline by 12.94 percentage points and surpasses an oracle-assisted TTA baseline by 9.41 percentage points, despite never observing its privileged augmented noise prompts. We further identify the Polyphonic Trap, a principled failure mode of subspace deflation for broadband classes, and resolve it via Confidence-Aware Regression (CAR), recovering up to 8.16 percentage points for the worst-affected class.', 'score': 0, 'issue_id': 3022, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '9668e523e6016ac8', 'authors': ['Ashish Anand Shukla', 'Rini Smita Thakur', 'Aryan Das', 'Vinod K. Kurmi'], 'affiliations': ['Indian Institute of Science Education and Research Bhopal, India', 'Vellore Institute of Technology Bhopal, India'], 'pdf_title_img': 'assets/pdf/title_img/2608.15037.jpg', 'data': {'categories': ['#inference', '#optimization', '#audio', '#multimodal'], 'emoji': '🔊', 'ru': {'title': 'Геометрическая коррекция шума в аудио-текстовых моделях без обучения', 'desc': 'PRISM — это быстрый метод адаптации моделей аудио-текста во время инференса без обучения, который использует гипотезу аффинного шума для коррекции искажений. Авторы предположили, что сильный акустический шум вызывает низкоранговый аффинный сдвиг в мультимодальном латентном пространстве, поэтому разработали метод для оценки и обращения этого искажения с помощью замороженных текстовых прототипов как геометрических якорей. Адаптация сводится к одному умножению матрицы на вектор за 0.0009 мс, что значительно быстрее градиентных методов адаптации и не требует дополнительного обучения. Метод показывает улучшение на 12.94 процентных пункта над baseline на датасете UrbanSound8K и решает проблему полифонического шума через регрессию с учётом уверенности модели.'}, 'en': {'title': 'Fast and Effective Noise Adaptation with PRISM', 'desc': "PRISM is a novel method for adapting audio-text models to handle severe acoustic noise without requiring additional training. It leverages frozen text prototypes and geometric corrections to reverse distortions caused by low-rank affine noise in the model's latent space. By using a static projection matrix, PRISM achieves fast adaptation with minimal computational cost, significantly outperforming traditional gradient-based methods. The approach not only enhances model performance on noisy data but also addresses specific failure modes through advanced regression techniques."}, 'zh': {'title': 'PRISM：快速无训练的音频文本适应方法', 'desc': 'PRISM是一种快速的无训练测试时适应方法，旨在逆转音频文本模型中的低秩仿射噪声失真。该方法利用冻结的文本原型和几何校正，解决了在严重声学噪声下现有模型的失败。PRISM基于仿射噪声假设，通过三种几何校正将失真估计和逆转，显著提高了模型在UrbanSound8K数据集上的表现。与基于梯度的适应方法相比，PRISM在推理时只需进行一次矩阵向量乘法，速度更快且无需额外训练。'}}}, {'id': 'https://huggingface.co/papers/2608.14639', 'title': 'Valid Per-Field Selective Risk Control for Document Extraction: Three Failure Modes, a Validity Ladder, and When Conditioning Pays', 'url': 'https://huggingface.co/papers/2608.14639', 'abstract': "Abstract Per-field selective risk control for document extraction requires a validity ladder with fit/val splits and Mondrian PAC certificates, revealing that support-bin provenance outperforms learned fusion only under specific model conditions.  Generated by thinkingmachines/Inkling-Small Per-field accept/review with selective risk at most alpha -- accept a field only if the error rate among accepted fields is controlled -- is the trust contract document-extraction systems need, and the natural procedure silently violates it on real documents. On 13,859 genuine claude-sonnet-5 fields from 800 CORD receipts (49.0% correct) we diagnose three failure modes: document clustering (design effect 1.84-2.45), score-refit leakage (coverage 0.416 at risk 0.127, violating alpha=0.10 in 95% of splits), and a tie-mass pathology (a degenerate score collapses the threshold grid, 0.030 to 0.001). We organize the fixes as a validity ladder, guarantee form stated per tier. A fit/val split protocol restores expected-selective-risk control for a learned fusion: coverage 0.318 at risk 0.096 at nominal alpha=0.10, no tolerance band (production variant 0.326) -- an on-average point whose realized risk exceeds alpha in 47.5% of resplits, not a certificate. Mondrian Learn-then-Test with exact binomial tails yields per-group PAC certificates: field-iid 0.171 at risk 0.068, cluster-corrected 0.140, doc-iid 0.060 -- the only tier matching documents, honestly near-vacuous today. Support-bin, the pre-specified provenance taxonomy, wins every rigor tier on the sonnet CORD capture (p<1e-4, Bonferroni-corrected) -- a win that does not replicate on the same documents under haiku or qwen -- while on higher-accuracy corpora pooled thresholds win: conditioning helps exactly where pooled cannot certify, subsumed by a learned score elsewhere. A frozen-configuration confirmation on selection-untouched claude-haiku-4-5 held at both risk levels, and a blind three-annotator human-gold audit verifies the practical tier's accepted-set risk at 1.3% against its 10% budget (Fleiss' kappa=0.83; labels err one-sidedly pessimistic). Released Apache-2.0 with seed-pinned, regression-gated procedures.", 'score': 0, 'issue_id': 3030, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '80319ce69cdeea93', 'authors': ['Bhaskar Gurram'], 'affiliations': ['Zasti AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.14639.jpg', 'data': {'categories': [], 'emoji': '📋', 'ru': {'title': 'Гарантированный контроль ошибок при извлечении полей из документов через селективный риск', 'desc': 'В статье рассматривается проблема контроля ошибок для каждого поля при извлечении данных из документов. Авторы предлагают иерархический подход валидации, использующий разделение данных на обучающую и валидационную выборки, а также сертификаты Mondrian для гарантий pac-learning. Они выявляют три основных источника отказа: кластеризацию документов, утечку информации при переподборе и вырождение распределения оценок. Для достижения надежного контроля риска авторы рекомендуют метод support-bin на основе предзаданной таксономии, который показывает лучшие результаты при соблюдении статистических гарантий.'}, 'en': {'title': 'Enhancing Document Extraction with Selective Risk Control', 'desc': 'This paper discusses a method for improving document extraction systems by implementing selective risk control for each field in the documents. It introduces a validity ladder that helps manage error rates and ensures that the acceptance of fields is controlled to maintain trust in the system. The authors identify several failure modes in existing methods and propose fixes that restore expected risk control. They demonstrate that their approach, using support-bin provenance, outperforms other methods under specific conditions, providing a more reliable framework for document extraction.'}, 'zh': {'title': '逐字段选择性风险控制的有效性阶梯', 'desc': '本文探讨了文档提取中的逐字段选择性风险控制，提出了一种有效性阶梯和适应性验证分割方法。研究表明，在特定模型条件下，支持-bin来源优于学习融合。通过对13859个真实字段的分析，诊断出文档聚类、得分重拟合泄漏和得分崩溃等三种失败模式。最后，提出了一种有效性阶梯修复方案，确保在学习融合中恢复预期的选择性风险控制。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (4)', '#agents (13)', '#agi', '#alignment (2)', '#architecture (7)', '#audio (2)', '#benchmark (24)', '#cv (4)', '#data', '#dataset (10)', '#diffusion (2)', '#ethics (1)', '#games (1)', '#graphs', '#hallucinations (2)', '#healthcare', '#inference (4)', '#interpretability (2)', '#leakage (1)', '#long_context (2)', '#low_resource', '#machine_translation', '#math (2)', '#multilingual (1)', '#multimodal (10)', '#open_source (9)', '#optimization (11)', '#plp (1)', '#rag (3)', '#reasoning (5)', '#rl (6)', '#rlhf (2)', '#robotics', '#science (2)', '#security (2)', '#small_models (3)', '#story_generation', '#survey', '#synthetic (2)', '#training (10)', '#transfer_learning', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-18 18:25',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-18 18:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-18 18:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
