    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.17271', 'title': 'ASI-Bench: At the Dawn of Artificial Superintelligence', 'url': 'https://huggingface.co/papers/2608.17271', 'abstract': "Abstract  Artificial superintelligence (ASI) requires AI to move beyond mastering existing knowledge toward exploring the unknown, creating new knowledge, and turning new ideas into verifiable results. However, the capabilities of today's AI systems are still largely built on learning, compressing, and applying existing human knowledge. Accordingly, existing benchmarks primarily test whether AI can produce correct answers based on learned knowledge, or whether it can complete tasks under extensive human guidance. We therefore introduce ASI-Bench, the first benchmark to jointly evaluate AI systems' capabilities of innovative exploration and autonomous scientific execution across general research domains, and the first to progressively withdraw human methodological guidance within the same research project to test how far AI can proceed on its own. Built by over 40 experts with the cost of 31,000+ human hours, ASI-Bench contains 60 project-level research tasks across 11 scientific domains and progressively reduces methodological guidance to test whether AI can independently select methods, conduct research, and produce verifiable results. All tasks undergo expert review, AI-assisted auditing, sandbox execution, and scorer validation. Across 18 state-of-the-art agent--model configurations, the average score drops from 50.91 with full methodological guidance to 29.10 with only the method specified and 26.62 when agents must determine the method themselves. This sharp decline shows that current systems remain heavily dependent on human guidance and are still far from autonomously conducting end-to-end, project-level scientific research. ASI-Bench is open to the world. We invite researchers and builders everywhere to contribute new tasks, challenge the limits of today's AI, and help accelerate humanity's collective path toward artificial superintelligence at https://asibench.apexin.ai/submit.", 'score': 38, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ba7ecd13b8d01775', 'authors': ['Junwei Zhou', 'Zhen Sun', 'Binyu Li', 'Jiangyu Zhou', 'Yuexi Pan', 'Hengyu Wang', 'Honghe Ren', 'Xiaohan Jia', 'Xueyang Zhou', 'Xiaoyu Cao', 'Yongchao Chen', 'Yuanning Feng', 'Junhao Wu', 'Cheng Zhang', 'Sijia Chen', 'Haoyu Xue', 'Chengsong You', 'Huan Wang', 'Koutian Wu', 'Peigan Gao', 'Jiakun Wu', 'Wenzhe Li', 'Ergan Shang', 'Qingyuan Zheng', 'Jingjing Zhou', 'Ruixuan Jia', 'Yan Xu', 'Hongrui Zhang', 'Xiao-Han Ma', 'Zhengxiang Cheng', 'Yuexing Hao', 'Liting Mai', 'Xianglin Ji', 'Wenjun Zhang', 'Zhuofan Chen', 'Yixiao Huang', 'Chi Wang', 'Wenyue Hua', 'Yilun Hao', 'Yuantao Zhai', 'Ziyan Zhao', 'Jingyan Xie'], 'affiliations': ['AG2 AI', 'Boston University', 'Carnegie Mellon University', 'Flatiron Institute', 'Harvard University', 'Massachusetts Institute of Technology', 'Microsoft Research', 'Tsinghua University', 'University of Illinois Urbana-Champaign', 'University of Michigan', 'University of Queensland', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17271.jpg', 'data': {'categories': ['#agents', '#agi', '#science', '#benchmark', '#open_source'], 'emoji': '🔬', 'ru': {'title': 'От заученных знаний к настоящему научному открытию: измеряем путь к искусственному сверхинтеллекту', 'desc': 'В статье представлен ASI-Bench — первый бенчмарк для оценки способности AI систем к инновационным исследованиям и автономному научному выполнению задач. Бенчмарк содержит 60 проектных исследовательских задач из 11 научных областей и прогрессивно снижает уровень методологической поддержки человека. Результаты показывают резкое падение производительности современных агентов с 50.91 баллов при полной помощи до 26.62 при полной автономии, что демонстрирует зависимость текущих систем от человеческого руководства. Исследование выявляет, что AI системы по-прежнему далеки от самостоятельного проведения полноценных научных проектов от начала до конца.'}, 'en': {'title': 'Pushing AI Beyond Knowledge: The ASI-Bench Challenge', 'desc': "This paper discusses the limitations of current AI systems, which mainly rely on existing human knowledge and guidance. It introduces ASI-Bench, a new benchmark designed to evaluate AI's ability to innovate and conduct scientific research independently. The benchmark includes 60 research tasks across various scientific domains and progressively reduces human assistance to assess AI's autonomy. Results show a significant drop in performance as human guidance decreases, highlighting the need for further advancements toward achieving artificial superintelligence."}, 'zh': {'title': '推动人工智能自主研究的新时代', 'desc': '这篇论文介绍了人工超智能（ASI）的新基准测试——ASI-Bench。该基准旨在评估人工智能系统在创新探索和自主科学执行方面的能力，特别是在减少人类指导的情况下。研究表明，当前的AI系统在完全依赖人类指导时表现较好，但在自主选择方法和进行研究时，性能显著下降。通过60个项目级研究任务，ASI-Bench为推动AI的独立研究能力提供了重要的测试平台。'}}}, {'id': 'https://huggingface.co/papers/2608.16157', 'title': 'FreeToken: Efficient Edge-Native MoE Serving with Bandwidth-Adaptive Execution', 'url': 'https://huggingface.co/papers/2608.16157', 'abstract': 'Abstract FreeToken is an edge-native Mixture-of-Experts serving system that dynamically maps computation and model state onto heterogeneous local hardware to run large open-weight models on personal machines.  Generated by thinkingmachines/Inkling-Small Frontier open-weight models are increasingly available, but serving them still largely assumes datacenter infrastructure. We present FreeToken, an edge-native MoE serving system that treats a personal machine not as a small GPU, but as a unified, elastic inference platform. FreeToken co-designs the full serving stack, including model layout and loading, expert residency, CPU--GPU execution, agentic state reuse, and runtime memory management, around two realities of local AI: agent workloads continuously change their execution pattern, and edge hardware exposes heterogeneous resources whose balance differs from machine to machine. Rather than committing to a fixed offloading strategy, FreeToken continuously maps computation and model state onto the resources actually available. FreeToken supports more than 20 MoE models and real coding and tool-using agents across hardware ranging from an 8GB laptop GPU to a single workstation GPU. More importantly, it changes what these machines can practically serve, from a 35B model on a laptop to a 284B model on a gaming desktop and the 753B GLM-5.2 on a single workstation GPU. FreeToken turns open weights into deployable local software, making the machines users already own a practical platform for frontier-scale intelligence. We release the system at flashml.ai.', 'score': 35, 'issue_id': 3042, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '6fd78c0894803fe6', 'authors': ['Shuo Yang', 'Xiaoze Fan', 'Melissa Pan', 'Haocheng Xi', 'Zhe Wang', 'Shanlin Sun', 'Kurt Keutzer', 'Song Han', 'Matei Zaharia', 'Chenfeng Xu', 'Ion Stoica'], 'affiliations': ['UC Berkeley', 'University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2608.16157.jpg', 'data': {'categories': ['#inference', '#agents', '#architecture'], 'emoji': '💻', 'ru': {'title': 'Локальное развёртывание фронтирных моделей на персональном оборудовании через адаптивное распределение вычислений', 'desc': 'FreeToken — это система для запуска больших открытых моделей на локальных персональных компьютерах с использованием архитектуры Mixture-of-Experts. Система динамически распределяет вычисления и состояние модели между разнородными ресурсами (CPU, GPU, оперативная память) в зависимости от их доступности и характеристик конкретного оборудования. Авторы переосмыслили весь стек инфраструктуры — от загрузки моделей и размещения экспертов до управления памятью и переиспользования состояния агентов. FreeToken позволяет запускать модели масштаба сотен миллиардов параметров (до 753B) на обычных ноутбуках и рабочих станциях, делая фронтирные модели практически применимыми на личном оборудовании.'}, 'en': {'title': 'Empowering Personal Machines with Frontier-Scale AI', 'desc': 'FreeToken is a Mixture-of-Experts (MoE) serving system designed for edge devices, allowing large open-weight models to run efficiently on personal hardware. It dynamically allocates computation and model states based on the unique resources of each machine, rather than relying on fixed datacenter infrastructure. By co-designing the serving stack, FreeToken optimizes model layout, execution, and memory management to adapt to changing workloads and heterogeneous hardware. This innovation enables users to deploy and utilize large AI models, such as a 753B model, on everyday machines like laptops and workstations.'}, 'zh': {'title': 'FreeToken：将开放权重模型变为可部署的本地软件', 'desc': 'FreeToken 是一个边缘原生的专家混合（MoE）服务系统，能够动态地将计算和模型状态映射到异构的本地硬件上，以便在个人计算机上运行大型开放权重模型。它将个人计算机视为一个统一的、弹性的推理平台，而不是简单的小型 GPU。FreeToken 设计了完整的服务堆栈，包括模型布局、专家驻留、CPU-GPU 执行、状态重用和运行时内存管理，以适应本地 AI 的实际情况。通过不断映射计算和模型状态到可用资源，FreeToken 支持多种 MoE 模型，使用户的个人设备能够处理更大规模的智能任务。'}}}, {'id': 'https://huggingface.co/papers/2608.17310', 'title': 'Agentic ESOpt: Fine-Tuning Long-Horizon LLM Agents with Minimal GPU Requirements', 'url': 'https://huggingface.co/papers/2608.17310', 'abstract': 'Abstract Agentic ESOpt uses evolution strategies for scalable full-parameter fine-tuning of long-horizon LLM agents via trajectory-level reward-weighted updates and parameter-context co-evolution.  Generated by thinkingmachines/Inkling-Small Reinforcement Learning (RL) has been promising in single-turn LLM fine-tuning. However, long-horizon agentic reasoning introduces increasingly branching interactions and sparse rewards, exposing several limitations of RL: its heavyweight backpropagation-based training stack makes it impractical to fine-tune larger LLMs, and longer-horizon trajectories make credit assignment in RL substantially harder. This paper argues that evolution strategies (ES) can be a better choice for fine-tuning long-horizon LLM agents. Compared with agentic RL, ES offers three key advantages: 1) Model Scalability: ES enables full-parameter optimization with only minimal, inference-level GPU memory, making it possible to fine-tune large LLMs. 2) Flexibility: its lightweight, black-box feedback interface makes ES fine-tuning easy to compose with prompt-space evolution (e.g., skill optimization & test-time compute); and 3) Long-Horizon Scalability: ES performs trajectory-level parameter attribution without decomposing rewards across horizons, yielding better scalability than Agentic RL as the horizon length grows. Based on this insight, we propose Agentic ESOpt, a full-parameter agentic fine-tuning framework tailored to flexible parameter--context co-evolution. At each step, Agentic ESOpt samples perturbations around the current LLM parameters, evaluates the resulting agents with rewards, and applies an online reward-weighted update. To improve the exploration--adaptation trade-off, Agentic ESOpt further introduces a cosine decay schedule of the perturbation scale σ. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.', 'score': 26, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '8f2a9c65809e859e', 'authors': ['Zhi Zheng', 'Rongsheng Chen', 'Yunpeng Ba', 'Zhenkun Wang', 'Yee Whye Teh', 'Wee Sun Lee'], 'affiliations': ['National University of Singapore', 'Oxford', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.17310.jpg', 'data': {'categories': ['#architecture', '#reasoning', '#optimization', '#training', '#agents', '#rl'], 'emoji': '🧬', 'ru': {'title': 'Эволюционные стратегии вместо обучения с подкреплением для долгосрочных агентов', 'desc': 'В статье предлагается Agentic ESOpt — метод для полнопараметровой тонкой настройки больших языковых моделей, используемых в агентах с долгосрочным горизонтом действия. Вместо традиционного обучения с подкреплением авторы применяют стратегии эволюции, которые требуют значительно меньше памяти GPU и лучше справляются с разреженными наградами на длинных траекториях. Метод сочетает оптимизацию параметров модели с эволюцией подсказок (контекста), используя возмущения параметров и награды на уровне целых траекторий. Экспериментальные результаты показывают улучшение производительности агентов на бенчмарке WebArena-Lite и успешную совместную эволюцию параметров и подсказок во время тестирования.'}, 'en': {'title': 'Revolutionizing LLM Fine-Tuning with Evolution Strategies', 'desc': 'The paper introduces Agentic ESOpt, a method that uses evolution strategies (ES) for fine-tuning large language models (LLMs) over long time horizons. Unlike traditional reinforcement learning (RL), which struggles with credit assignment and resource demands, ES allows for scalable optimization with minimal memory usage. This approach enhances flexibility by enabling easy integration with prompt-space evolution and improves performance in long-horizon tasks by attributing rewards at the trajectory level. The results show significant improvements in model performance, demonstrating the effectiveness of ES in fine-tuning LLMs compared to conventional RL methods.'}, 'zh': {'title': '进化策略：长时间跨度LLM微调的新选择', 'desc': '本文提出了一种名为Agentic ESOpt的框架，利用进化策略（ES）对长时间跨度的语言模型（LLM）进行全参数微调。与传统的强化学习（RL）方法相比，ES在模型可扩展性、灵活性和长时间跨度的可扩展性方面具有显著优势。ES能够在仅需最小推理级GPU内存的情况下实现全参数优化，从而使得大型LLM的微调成为可能。此外，Agentic ESOpt通过在线奖励加权更新和扰动采样，提升了探索与适应的平衡，显著提高了模型性能。'}}}, {'id': 'https://huggingface.co/papers/2608.12313', 'title': 'AVA-Encoder: Towards Agent-Native Video Representation Learning', 'url': 'https://huggingface.co/papers/2608.12313', 'abstract': 'Abstract AVA-Encoder learns structured video representations via agentic auto-encoding using knowledge graphs and textual-gradient optimization to improve cinematic video generation and reasoning.  Generated by thinkingmachines/Inkling-Small Creative agents still lack an effective way to learn from high-quality human films, limiting their ability to produce cinematic-grade videos. A key challenge is the absence of a structured video representation that is both faithful to film content and directly usable for agentic reasoning and manipulation. To address the challenge, we propose the Agentic Video Auto-Encoder (AVA-Encoder), a framework for learning agent-native video representations via agentic auto-encoding.   AVA-Encoder transforms a video into a knowledge graph (KG) representation and then reconstructs it back into video. Its hierarchy and state nodes store structured text, while a linked asset layer holds generated images, audio, and video. Typed edges preserve the relations between these text descriptions and assets in a form that agents can easily understand, query, and edit. The video reconstruction differences drive a textual-gradient optimization framework, which expresses evaluation feedback as natural-language update directions for Data-Independent Encoding Policy Pseudo-Training in the outer loop and optional Data-Dependent KG Representation Refinement in the test-time inner loop.   Extensive experiments show that AVA-Encoder improves by 20.7 percentage points over the strongest external baseline. In the controlled policy-only setting, its pseudo-trained shot-level Agentic Video Encoder policy also outperforms a carefully human-tuned policy while using 74.3% fewer system-prompt tokens. We release the complete AVA-Encoder framework, a reliable agentic video reconstruction benchmark, and the first dataset of high-quality film KG representations.', 'score': 26, 'issue_id': 3041, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '1dbf7213c8e13939', 'authors': ['Chuyue Li', 'Jinpeng Yu', 'Haozhe Wang', 'Tian Xueyun', 'Zhijing Zhang', 'Bingnan Li', 'Shuqi Gu', 'Kan Ren', 'Jiaming Liu', 'Ruihua Hua'], 'affiliations': ['Institute of Computing Technology', 'Qwen Business Unit of Alibaba', 'ShanghaiTech University', 'Southeast University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.12313.jpg', 'data': {'categories': ['#agents', '#multimodal', '#video', '#benchmark', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Структурированное представление видео через агентный автокодировщик с графами знаний', 'desc': 'AVA-Encoder — это фреймворк, который преобразует видео в структурированное представление в виде графа знаний, сохраняя текстовые описания и цифровые активы в форме, удобной для агентного рассуждения и манипулирования. Система использует технику текстуального градиентного оптимизирования, где обратная связь от восстановления видео преобразуется в естественно-языковые направления обновления для обучения политики модели. Подход демонстрирует значительное улучшение на 20.7 процентных пункта над существующими базовыми методами и достигает производительности ручной настройки при использовании на 74.3% меньше токенов. Фреймворк позволяет агентам эффективнее учиться на высокачественных кинофильмах и генерировать видео кинематографического качества.'}, 'en': {'title': 'Transforming Video Learning with Knowledge Graphs', 'desc': 'The AVA-Encoder is a novel framework designed to enhance how creative agents learn from high-quality films by using structured video representations. It converts videos into knowledge graphs, which help in understanding and manipulating video content more effectively. By employing a textual-gradient optimization method, the framework provides feedback in natural language, allowing for better training of video generation policies. Experimental results demonstrate significant improvements in video quality and efficiency compared to existing methods, showcasing the potential of structured representations in cinematic video generation.'}, 'zh': {'title': '代理自编码：提升视频生成与推理的创新框架', 'desc': 'AVA-Encoder是一种通过代理自编码学习结构化视频表示的方法，利用知识图谱和文本梯度优化来提升电影视频生成和推理能力。该框架将视频转换为知识图谱表示，并能够将其重构回视频，存储结构化文本和生成的图像、音频及视频。通过保留文本描述和资产之间的关系，代理可以更容易地理解、查询和编辑这些信息。实验结果表明，AVA-Encoder在视频重构任务中显著优于现有的基线方法，展示了其在生成高质量电影视频方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.17512', 'title': 'Embodied-Navigator: Point, Think, Memorize, and Align for Efficient Navigation', 'url': 'https://huggingface.co/papers/2608.17512', 'abstract': "Abstract TAMP-Nav improves embodied navigation by aligning vision-language models with 2D visual prompting, selective reasoning with compressed memory, and dense policy optimization.  Generated by thinkingmachines/Inkling-Small Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting. Specifically, the VLM merely selects 2D pixels, which are then projected into 3D coordinates for a low-level SLAM controller. This design naturally aligns embodied execution with the VLM's inherent 2D visual capabilities. Second, we propose an integrated Selective Reasoning and Anchor-Trajectory Memory mechanism (Think and Memorize), which dynamically triggers Chain-of-Thought and retains high-fidelity memory only at critical nodes, compressing redundant trajectories into lightweight Space-Time Indicators, thereby preserving critical historical information and enhancing spatio-temporal perception. Finally, we design an efficient Two-Level Alignment Paradigm (Align) via Group Relative Policy Optimization (GRPO). By superimposing global outcome rewards with fine-grained process rewards, this dense supervision tightly aligns the agent's cognitive planning with physical environmental feedback, endowing the model with adaptive reasoning capabilities. Experiments demonstrate that TAMP-Nav achieves state-of-the-art performance (e.g., 66.2% SR on R2R-CE) with high runtime and sample efficiency (requiring only 90k training trajectories).", 'score': 24, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'f873ff04e373f466', 'authors': ['Hongyan Feng', 'Sunlai Chen', 'Xuanyu Liu', 'Miao Pan', 'Yangfan Xie', 'Yuxiang Cui', 'Zhongxiang Zhou', 'Rong Xiong', 'Wenqi Zhang', 'Jianwei Yin', 'Yueting Zhuang', 'Xuhong Zhang'], 'affiliations': ['School of Software Technology, Zhejiang University', 'Zhejiang Humanoid Robot Innovation Center Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2608.17512.jpg', 'data': {'categories': ['#rl', '#training', '#agents', '#robotics', '#multimodal'], 'emoji': '🧭', 'ru': {'title': 'Выравнивание видеоязыковых моделей с 2D восприятием для эффективной навигации робота', 'desc': 'TAMP-Nav представляет собой единый фреймворк для улучшения воплощённой навигации робота путём согласования возможностей видеоязыковых моделей с естественным 2D восприятием. Система использует инновационную формулировку «Пиксель-в-3D действие», где VLM выбирает 2D пиксели, которые затем проецируются в 3D координаты для низкоуровневого контроллера SLAM. Фреймворк включает механизм селективного рассуждения и якорной памяти траектории, который динамически активирует цепочку мыслей только в критических узлах, сжимая избыточные траектории в компактные пространственно-временные индикаторы. Оптимизация достигается через двухуровневую парадигму выравнивания с использованием групповой оптимизации относительной политики, сочетающей глобальные награды результата с мелкозернистыми наградами процесса.'}, 'en': {'title': 'Navigating the Future: Aligning Vision and Action in 3D', 'desc': "TAMP-Nav is a new framework that enhances embodied navigation by integrating vision-language models with 2D visual prompts. It reformulates navigation tasks into a 2D pixel selection process, which is then translated into 3D actions for better alignment with the model's pre-training. The framework also introduces a selective reasoning mechanism that optimizes memory usage by focusing on important information and compressing less relevant data. Finally, it employs a two-level alignment strategy that combines global and local rewards to improve the agent's decision-making and adaptability in real-world environments."}, 'zh': {'title': '高效体感导航的新突破', 'desc': 'TAMP-Nav 是一种改进的体感导航框架，通过将视觉-语言模型与二维视觉提示对齐，提升了导航效率。它采用了像素到三维动作的重新定义，使得模型可以直接选择二维像素并将其投影到三维坐标中，从而更好地利用其二维视觉能力。此外，TAMP-Nav 引入了选择性推理和锚点轨迹记忆机制，动态保留重要信息并压缩冗余轨迹，增强了时空感知能力。最后，通过群体相对策略优化的两级对齐范式，模型实现了认知规划与环境反馈的紧密对齐，展现出卓越的适应性推理能力。'}}}, {'id': 'https://huggingface.co/papers/2608.17528', 'title': 'Agent Lightning v1.0: Towards Harnessed Agentic RL', 'url': 'https://huggingface.co/papers/2608.17528', 'abstract': 'Abstract Agent Lightning v1.0 enables reproducible reinforcement learning for arbitrary agent harnesses, substantially improving coding-agent performance with minimal data and compute.  Generated by thinkingmachines/Inkling-Small Modern agents operate inside agent harnesses that manage tools, context, and control flow, making the harness a critical part of the agent system. Our original Agent Lightning introduced a disaggregated architecture that connects arbitrary agents to RL training through an LLM endpoint proxy, an approach later adopted by frameworks such as verl Uni-Agent, AReaL 2.0, slime, and Polar. We refer to this paradigm as harnessed agentic RL, where the deploy-time harness directly participates in model post-training. Harnessed agentic RL differs fundamentally from traditional agentic RL: the harness, rather than the training engine, owns the environment interaction loop, while the trainer observes only sequences of LLM request-response pairs. This introduces challenges in retokenization, sample merging, advantage calculation, loss normalization, and backend scheduling, which can substantially affect training stability and effectiveness. We present Agent Lightning v1.0, a lightweight framework for harnessed agentic RL implemented in approximately 3,500 lines of code. It supports arbitrary agent harnesses and serves as a practical testbed for studying these challenges. We evaluate it on instruction-following, search, and coding agents, and provide a complete reproducible pipeline for coding-agent RL. Using only 6K training examples and modest compute, RL improves Qwen3.5-9B on SWE-bench Verified from 41.8% to 56.4%, a 14.6-point absolute gain. We release the complete workflow and training scripts to facilitate reproducible research on harnessed agentic RL.', 'score': 11, 'issue_id': 3042, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ab86581c8e00a8c5', 'authors': ['Zhiyuan He', 'Siwei Zhang', 'Zhiwen Zhou', 'Yuqing Yang', 'Yu Kang', 'Yuge Zhang', 'Luna K. Qiu', 'Tin Yan Tsui', 'Jiahang Xu', 'Chong Luo'], 'affiliations': ['Fudan University', 'Microsoft', 'University of Edinburgh', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17528.jpg', 'data': {'categories': ['#training', '#agents', '#rl', '#plp'], 'emoji': '⚡', 'ru': {'title': 'Агенты с подкреплением в управляемых оболочках: эффективное обучение с минимумом данных', 'desc': "Статья представляет Agent Lightning v1.0 — фреймворк для обучения с подкреплением агентов, которые работают внутри специализированных оболочек управляющих инструментами и потоком выполнения. Авторы вводят парадигму 'harnessed agentic RL', где оболочка агента напрямую участвует в постобучении модели, что отличается от традиционного подхода тем, что оболочка владеет циклом взаимодействия с окружением. Фреймворк решает критические проблемы переконизации, слияния выборок, вычисления преимуществ и нормализации потерь, обеспечивая стабильность обучения. На примере кодирующего агента авторы демонстрируют значительное улучшение производительности модели Qwen3.5-9B на SWE-bench Verified с 41.8% до 56.4% при использовании только 6K примеров обучения."}, 'en': {'title': 'Revolutionizing Reinforcement Learning with Agent Lightning v1.0', 'desc': 'Agent Lightning v1.0 is a framework designed to enhance reinforcement learning (RL) for various agent harnesses, improving their performance with limited data and computational resources. It introduces a new approach called harnessed agentic RL, where the agent harness manages the interaction with the environment, differing from traditional methods where the training engine handles this. This framework addresses several challenges such as retokenization and loss normalization, which are crucial for maintaining training stability. By evaluating it on coding agents, the framework demonstrates significant performance improvements, showcasing its potential for reproducible research in RL.'}, 'zh': {'title': '提升编码代理性能的强化学习新框架', 'desc': 'Agent Lightning v1.0 是一个用于可重复强化学习的框架，能够显著提高编码代理的性能，所需的数据和计算资源极少。该框架采用了一种分离架构，通过 LLM 端点代理将任意代理连接到强化学习训练中。与传统的代理强化学习不同，Agent Lightning 的设计使得代理的环境交互循环由代理工具管理，而训练者仅观察 LLM 请求-响应对的序列。这种方法引入了一些挑战，如重标记、样本合并和损失归一化等，但也为编码代理的强化学习提供了有效的解决方案。'}}}, {'id': 'https://huggingface.co/papers/2608.17566', 'title': 'CoinVE-200K: A Large-Scale High-Quality Dataset for Compositional Instruction-Guided Video Editing', 'url': 'https://huggingface.co/papers/2608.17566', 'abstract': 'Abstract A new dataset, benchmark, and 22B model enable compositional instruction-guided video editing with multi-region attention and temporal coherence.  Generated by thinkingmachines/Inkling-Small The quality and diversity of instruction-based video editing datasets are steadily improving, yet existing datasets mainly focus on single editing operations and fall short in supporting compositional instruction-guided video editing. In particular, multiple editing intents must be jointly understood and faithfully executed within the same video. To address this issue, we introduce CoinVE-200K, a large-scale, high-quality dataset for Compositional Instruction-Guided Video Editing. CoinVE-200K contains 1080p video-editing pairs of up to 201 frames, covering diverse compositional scenarios where each sample involves 2 to 5 atomic editing operations. The instructions target humans, objects, and backgrounds, and cover edit types such as addition, removal, modification, and stylization. All samples are built through a carefully designed generation and filtering pipeline to ensure instruction faithfulness, visual quality, temporal consistency, and compositional diversity. We also introduce CoinVE-Bench, a benchmark for compositional-instruction video editing across diverse subjects, operation types, and instruction complexities. Furthermore, we present CoinVE-Edit, a 22B compositional video editing model built upon Wan2.1-T2V-14B and Qwen3-VL-8B-Instruct. CoinVE-Edit disentangles region-aware attention for different editing instructions, enabling precise multi-region editing while preserving irrelevant content and temporal coherence. Experiments on CoinVE-Bench show that CoinVE-Edit achieves strong performance in instruction following, compositional editing accuracy, visual quality, and temporal consistency.', 'score': 10, 'issue_id': 3044, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '4ea6efbe6647371d', 'authors': ['Fuchen Long', 'Cong Wang', 'Zitao Gao', 'Wenhao Zhong', 'Yu Cheng', 'Xiaolu Hou', 'Yan Li', 'Xiao Cao', 'Xinlong Sun', 'Xi Chen', 'Yu Liu'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.17566.jpg', 'data': {'categories': ['#dataset', '#video', '#benchmark', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Композитное редактирование видео через многорегиональное внимание и семантическую разложимость', 'desc': 'Представлена новая методика для композитного редактирования видео на основе инструкций, которая позволяет одновременно выполнять несколько операций редактирования в одном видео. Авторы создали набор данных CoinVE-200K с 200 тысячами видео высокого качества, содержащих от 2 до 5 атомарных операций редактирования, таких как добавление, удаление и стилизация объектов. Предложена модель CoinVE-Edit на базе архитектур Wan2.1 и Qwen3-VL, использующая механизм многорегионального внимания для точного редактирования разных областей видео с сохранением временной согласованности. Разработан бенчмарк CoinVE-Bench для оценки качества композитного редактирования по различным критериям: следование инструкциям, точность редактирования и консистентность во времени.'}, 'en': {'title': 'Revolutionizing Video Editing with Compositional Instructions', 'desc': 'This paper presents a new dataset called CoinVE-200K, which is designed for compositional instruction-guided video editing. It includes high-quality video-editing pairs that allow for multiple editing operations to be performed simultaneously, addressing the limitations of existing datasets that focus on single operations. The CoinVE-Edit model, built on advanced architectures, utilizes multi-region attention to ensure that different editing instructions are executed accurately while maintaining the overall coherence of the video. The results demonstrate that this model excels in following complex instructions and producing visually appealing edits with temporal consistency.'}, 'zh': {'title': '复合指令引导的视频编辑新突破', 'desc': '本文介绍了一个新的数据集CoinVE-200K和基准CoinVE-Bench，旨在支持复合指令引导的视频编辑。该数据集包含1080p的视频编辑对，涵盖多种编辑场景，每个样本涉及2到5个基本编辑操作。我们提出的CoinVE-Edit模型利用22B参数，能够实现区域感知的多区域编辑，同时保持时间一致性和视觉质量。实验结果表明，CoinVE-Edit在指令遵循、编辑准确性和视觉质量等方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.15008', 'title': 'Harness the Memory: A Holistic Evaluation of Memory Substrates in Memory Agents', 'url': 'https://huggingface.co/papers/2608.15008', 'abstract': 'Abstract Empirical evaluation of diverse memory substrates for long-horizon LLM agents reveals regime-dependent trade-offs, motivating adaptive substrate routing for reliable agent memory.  Generated by thinkingmachines/Inkling-Small Memory is becoming core infrastructure for long-horizon LLM agents, yet existing evaluations offer limited guidance on which memory substrate, namely the underlying medium in which memory is represented and stored, should be used under different operating regimes. We present a controlled harness evaluation of memory substrates for memory-augmented agents, covering dense and sparse indices, text records, structural stores, hierarchical stores, refinement-based memories, parametric updates, and activation-compatible context mechanisms. Across three backbone models and four benchmark suites spanning user-centric question answering and agent-centric decision-making, we instrument 26 performance and efficiency metrics under a unified harness. Our results show that no single substrate consistently dominates: broad retrieval benefits long-context factual QA, while excessive retrieval can harm sequential decision-making by shifting attention away from action-critical context. Scalability introduces a further routing axis, as substrates that perform well at moderate history lengths can become costly or brittle at longer horizons. These findings motivate substrate routing as a necessary component of adaptive agent memory systems and provide empirical guidance for designing efficient, reliable, and regime-aware long-term memory for LLM agents. Code will be made available upon acceptance.', 'score': 10, 'issue_id': 3041, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '564de84deeca5556', 'authors': ['Wei-Chieh Huang', 'Weizhi Zhang', 'Yuchen Wu', 'Yankai Chen', 'Eric Hanchen Jiang', 'Wooseong Yang', 'Yiwei Yang', 'Henry Peng Zou', 'Hanrong Zhang', 'Ying Nian Wu', 'Haolun Wu', 'Kai-Wei Chang', 'Philip S. Yu', 'Xue Liu', 'Aylin Caliskan'], 'affiliations': ['MBZUAI', 'McGill University', 'University of California, Los Angeles', 'University of Illinois Chicago', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15008.jpg', 'data': {'categories': ['#long_context', '#agents', '#benchmark', '#open_source', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'Адаптивная маршрутизация памяти для надёжных долгосрочных LLM-агентов', 'desc': 'В этой работе исследуются различные способы организации памяти для LLM-агентов, работающих на длинных горизонтах принятия решений. Авторы провели комплексное тестирование множества архитектур памяти — от плотных и разреженных индексов до иерархических хранилищ и параметрических обновлений — на трёх основных моделях и четырёх наборах бенчмарков. Результаты показывают, что нет универсального решения: для факт-ориентированных задач вопросно-ответного типа выгодна обширная выборка, а для принятия последовательных решений она может быть вредна, отвлекая внимание от критически важного контекста. Исследование подчеркивает необходимость адаптивной маршрутизации выбора памяти в зависимости от режима работы агента.'}, 'en': {'title': 'Adaptive Memory Routing for Enhanced LLM Performance', 'desc': "This paper evaluates different memory types for long-horizon large language model (LLM) agents to understand their effectiveness in various situations. It examines various memory substrates, such as dense and sparse indices, and how they impact performance in tasks like question answering and decision-making. The study finds that no single memory type is best for all scenarios; some are better for retrieving information while others are more suited for maintaining focus on important actions. The authors suggest that adaptive routing of memory types is essential for improving the reliability and efficiency of LLM agents' long-term memory systems."}, 'zh': {'title': '自适应记忆系统：优化长时间跨度的记忆基质', 'desc': '本论文探讨了长时间跨度的语言模型（LLM）代理的记忆基础设施，评估了不同记忆基质在不同操作模式下的表现。研究表明，没有单一的记忆基质在所有情况下都表现最佳，广泛的检索对长上下文的事实问答有利，但过度检索可能会影响顺序决策。论文还指出，记忆基质的可扩展性在历史长度较长时可能会导致成本增加或性能下降。基于这些发现，提出了自适应记忆系统中基质路由的重要性，以设计高效、可靠且适应不同操作模式的长期记忆。'}}}, {'id': 'https://huggingface.co/papers/2608.18076', 'title': 'From Corpora to Co-Evolving Capabilities: Capability-Centric Data Design for Generalist Image Generation', 'url': 'https://huggingface.co/papers/2608.18076', 'abstract': 'Abstract A capability-driven data infrastructure with curriculum scheduling and specialized data engines trains large multimodal diffusion models on curated heterogeneous supervision for diverse generative tasks.  Generated by thinkingmachines/Inkling-Small Large-scale image generation has benefited from advances in data scale, quality, rebalancing, and recaptioning, yet conventional pipelines typically optimize task-specific datasets in isolation. A central challenge is not only how to curate each task-specific corpus, but also how to organize heterogeneous supervision according to the dependencies among generative capabilities. We present a capability-driven data infrastructure that couples capability-specific supervision construction with capability-aligned curriculum scheduling. Its three specialized yet interoperable data engines build complementary relational supervision for text-image grounding, inter-image transformation, and image-knowledge association, while caption experts align T2I and editing supervision across tasks and granularities. A multi-stage curriculum jointly evolves task composition, visual-concept distribution, data quality, and image resolution along the dependency order of capability acquisition, with capability-aware evaluation closing the loop through targeted retrieval, expert construction, and gap-aware resampling. At scale, the framework curates a 440M-image T2I corpus, 120M editing pairs, and over 27M image-entity pairs. With this infrastructure, we train multimodal diffusion models at two scales from scratch, with 3B and 6B sizes respectively. We conduct quantitative evaluation on CPI-Bench, along with qualitative evaluations across diverse text-to-image and editing scenarios. Experimental results present broad visual coverage, versatile rendering, and effective transfer across generative capabilities.', 'score': 8, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '1c806ab764b141f1', 'authors': ['Xingjian Wang', 'Zhao Wang', 'Taihang Hu', 'Jun Zheng', 'Qing Jin', 'Qinye Zhou', 'Zhengtao Wu', 'Yongchao Du', 'Zuan Gao', 'Chao Lin', 'Yefeng Shen', 'Xiaoli Xu', 'Zhengze Xu', 'Hao Yan', 'Yuhang Yu', 'Mingzhou Zhang', 'Mengting Chen'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.18076.jpg', 'data': {'categories': ['#training', '#synthetic', '#multimodal', '#diffusion', '#data', '#optimization', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Управляемая возможностями инфраструктура данных для обучения диффузионных моделей', 'desc': 'Статья описывает инфраструктуру для подготовки данных, которая организует разнородные источники обучающей информации в соответствии с зависимостями между способностями модели. Авторы предлагают три специализированных движка обработки данных, которые создают дополнительные связанные данные для привязки текста к изображениям, трансформации между изображениями и связи изображений с внешними знаниями. Система использует многоэтапное curriculum learning, которое совместно развивает композицию задач, распределение визуальных концепций и качество данных в соответствии с порядком усвоения способностей. На основе этой инфраструктуры авторы подготовили массивный датасет из 440 млн изображений для text-to-image и обучили большие диффузионные модели размером 3B и 6B параметров с улучшенными результатами по разнообразию и качеству генерации.'}, 'en': {'title': 'Empowering Generative Models with Capability-Driven Data Infrastructure', 'desc': 'This paper introduces a new data infrastructure designed to enhance the training of large multimodal diffusion models for various generative tasks. It emphasizes a capability-driven approach that organizes data based on the dependencies of generative capabilities, allowing for better supervision across different tasks. The framework includes specialized data engines that create complementary supervision for tasks like text-image grounding and image editing, while a multi-stage curriculum optimizes the training process. The results demonstrate significant improvements in visual coverage and versatility in rendering across diverse applications.'}, 'zh': {'title': '能力驱动的数据基础设施，提升多模态生成能力', 'desc': '本文提出了一种以能力为驱动的数据基础设施，结合了能力特定的监督构建和能力对齐的课程调度，旨在训练大型多模态扩散模型。该基础设施通过三个专业的数据引擎，构建了互补的关系监督，支持文本-图像对齐、图像间转换和图像-知识关联等任务。通过多阶段课程的演变，优化了任务组合、视觉概念分布、数据质量和图像分辨率，确保了能力获取的依赖顺序。实验结果显示，该框架在生成能力的广泛视觉覆盖、灵活渲染和有效转移方面表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.17597', 'title': 'HarnessRisk: A Lifecycle-Oriented Benchmark for Agent Harness Safety', 'url': 'https://huggingface.co/papers/2608.17597', 'abstract': 'Abstract HarnessRisk evaluates agent harness safety across six operational phases, revealing that configuration vulnerabilities and detection gaps allow high attack success despite preserved utility.  Generated by thinkingmachines/Inkling-Small Large language models are increasingly deployed through agent harnesses that manage tools, extensions, persistent state, permissions, and external actions. Existing safety benchmarks mainly target individual attack mechanisms or a limited subset of operational settings, making it difficult to compare how safety failures emerge across different harness responsibilities. We present HarnessRisk, a lifecycle oriented benchmark that organizes agent harness safety into six operational phases including Harness Configuration, Capability Extension, Runtime Operation, State Persistence, Action Control, and Incident Recovery. HarnessRisk contains 128 sandboxed cases, each pairing a benign user objective with an adversarial instruction embedded in an untrusted workflow artifact. We evaluate each trajectory using Utility, Attack Success Rate, Persistence, and Detection. Across three harnesses, six language models, and 14 model and harness configurations, attack success ranges from 12.6% to 80.9%, while Utility remains between 75.0% and 97.6%. Harness Configuration is the most vulnerable phase across all three harnesses, showing that attacks can succeed by altering security sensitive parameters within otherwise authorized workflows. We also find that explicit risk recognition does not reliably lead to safe action, as some configurations detect risks in more than 90% of runs while retaining substantial attack success. These results highlight the need to evaluate agent safety across multiple harness responsibilities and at the level of the deployed model and harness configuration.', 'score': 6, 'issue_id': 3042, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '7f8d1a741c96b093', 'authors': ['Yajing Bai', 'Jinhao Duan', 'Jie Peng', 'Xianfeng Wu', 'Sijia Liu', 'Song Wang', 'Tianlong Chen'], 'affiliations': ['Michigan State', 'University of Central Florida', 'University of North Carolina at Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2608.17597.jpg', 'data': {'categories': ['#benchmark', '#agents'], 'emoji': '🔓', 'ru': {'title': 'Шесть фаз уязвимости: где агенты теряют контроль', 'desc': 'В работе представлен HarnessRisk — комплексный бенчмарк для оценки безопасности агентских фреймворков на протяжении полного жизненного цикла их работы, охватывающий шесть операционных фаз от конфигурации до восстановления после инцидентов. Исследователи создали 128 тестовых случаев, в которых комбинируют легитимные цели пользователя с враждебными инструкциями, скрытыми в ненадёжных артефактах рабочего процесса. Результаты показывают, что даже при сохранении полезности системы (75-97.6%) успешность атак достигает 80.9%, причём наиболее уязвимой оказывается фаза конфигурации фреймворка. Исследование демонстрирует критический разрыв между способностью системы распознавать риски и способностью безопасно на них реагировать, подчёркивая необходимость комплексной оценки безопасности на уровне развёрнутой модели и всей конфигурации.'}, 'en': {'title': 'HarnessRisk: Evaluating Safety Across Agent Harness Phases', 'desc': 'The paper introduces HarnessRisk, a benchmark designed to assess the safety of agent harnesses used in machine learning applications. It identifies six operational phases where vulnerabilities can occur, including Harness Configuration and Runtime Operation. The study reveals that despite high utility, attack success rates can be alarmingly high, indicating significant security gaps. The findings emphasize the importance of evaluating safety across various harness responsibilities and configurations to better understand and mitigate risks.'}, 'zh': {'title': '评估智能体安全性的全新视角', 'desc': 'HarnessRisk 是一个评估智能体安全性的基准，涵盖六个操作阶段，包括配置、能力扩展、运行操作、状态持久性、行动控制和事件恢复。研究发现，尽管保持了效用，配置漏洞和检测缺口使得攻击成功率很高，范围从 12.6% 到 80.9%。特别是，配置阶段是最脆弱的，攻击者可以通过修改安全敏感参数来成功攻击。该研究强调了在不同的智能体职责和部署模型配置下评估安全性的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.16002', 'title': 'From Sequence to Structure: Relational Uncertainty Propagation for LLM Agents', 'url': 'https://huggingface.co/papers/2608.16002', 'abstract': 'Abstract RUPA models agent execution as a dependency graph to propagate uncertainty across long trajectories, improving failure detection and confidence estimation for LLM agents.  Generated by thinkingmachines/Inkling-Small Reliable uncertainty quantification (UQ) is essential for deploying large language model (LLM) agents in complex interactive environments. Existing UQ methods largely rely on local signals, such as token probabilities, predictive entropy, or per-step confidence, and therefore overlook the long-range dependencies through which errors accumulate across an execution trajectory. As a result, they may fail to identify agent failures whose causes originate several reasoning or interaction steps before the final answer. We propose RUPA (Relational Uncertainty Propagation for Agents), a trajectory-level UQ framework for LLM agents. RUPA represents an execution history as a directed trajectory graph in which reasoning states, tool interactions, and environment feedback are nodes connected by temporal and semantic dependency edges. It then propagates uncertainty over this graph to capture how execution risk accumulates and transfers across interaction steps. The propagated signal is combined with trajectory-level behavioral features and goal-alignment information to produce a confidence estimate for the full agent trajectory. We evaluate RUPA on representative agent benchmarks, including τ-2, Terminal-Bench-2, and GAIA, using 6 open-source LLMs spanning multiple model families. Experimental results show that RUPA consistently outperforms existing UQ methods by providing more accurate uncertainty estimates, enabling earlier failure detection, and improving uncertainty-guided agent execution across diverse agent tasks. These results demonstrate that explicitly modeling relational dependency is crucial to reliable UQ for long-horizon LLM agents, providing a practical foundation for trustworthy agent execution.', 'score': 6, 'issue_id': 3040, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '608b46206fbcb19d', 'authors': ['Zhengzhao Ma. Boxi Cao', 'Yaojie Lu', 'Hongyu Lin', 'Xianpei Han', 'Le Sun'], 'affiliations': ['Chinese Information Processing Laboratory, Institute of Software, Chinese Academy of Sciences', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2608.16002.jpg', 'data': {'categories': ['#graphs', '#reasoning', '#long_context', '#benchmark', '#agents'], 'emoji': '🕸️', 'ru': {'title': 'Распространение неопределённости через граф зависимостей для надёжных LLM агентов', 'desc': 'Работа представляет RUPA — метод количественной оценки неопределённости для LLM агентов, который моделирует историю выполнения как граф зависимостей. Вместо анализа локальных сигналов (например, вероятностей токенов), RUPA распространяет неопределённость через весь граф, отслеживая, как ошибки накапливаются на протяжении длинных траекторий взаимодействия. Метод комбинирует информацию о распространённой неопределённости с поведенческими признаками и выравниванием целей для получения оценки уверенности для всей траектории агента. Экспериментальные результаты на различных бенчмарках показывают, что RUPA превосходит существующие методы по точности предсказания ошибок и обнаружению сбоев.'}, 'en': {'title': 'RUPA: Enhancing Uncertainty in LLM Agent Execution', 'desc': 'The paper introduces RUPA, a new framework for improving uncertainty quantification (UQ) in large language model (LLM) agents by modeling their execution as a dependency graph. This approach allows for the propagation of uncertainty across long trajectories, addressing the limitations of existing UQ methods that focus on local signals. By representing the execution history as a directed graph with nodes for reasoning states and interactions, RUPA captures how errors accumulate over time. The results show that RUPA enhances failure detection and confidence estimation, making LLM agents more reliable in complex environments.'}, 'zh': {'title': 'RUPA：提升LLM代理执行的可靠性与信心', 'desc': 'RUPA模型将代理执行视为一个依赖图，以传播不确定性，从而提高大型语言模型（LLM）代理的故障检测和信心估计。现有的不确定性量化方法主要依赖于局部信号，忽视了错误在执行轨迹中累积的长程依赖关系。RUPA通过将执行历史表示为一个有向轨迹图，捕捉推理状态、工具交互和环境反馈之间的关系，并在此图上传播不确定性。实验结果表明，RUPA在多个基准测试中优于现有方法，提供了更准确的不确定性估计，能够更早地检测故障，并改善代理执行的可靠性。'}}}, {'id': 'https://huggingface.co/papers/2608.05811', 'title': 'Energy-Guided Flow Matching', 'url': 'https://huggingface.co/papers/2608.05811', 'abstract': 'Abstract Energy-Guided Flow Matching improves generative quality by progressively revealing high-frequency details through a moving endpoint and adaptive scheduling, reducing training cost and achieving state-of-the-art FID scores.  Generated by thinkingmachines/Inkling-Small Pixel-space generative models bypass lossy latent compression, yet necessitate joint learning of global structure and fine-grained details in a high-dimensional space. Standard flow matching interpolates noise toward a fixed clean-image endpoint, leaving the spectral evolution to be learned implicitly. In this paper, we introduce Energy-Guided Flow Matching(EG-FM) that explicitly models a coarse-to-fine generative trajectory by moving endpoint. Specifically, EG-FM replaces the fixed endpoint with a heat-kernel-filtered endpoint that evolves smoothly from low-frequency image to clean image. The fraction of high-frequency signal in moving endpoint is released by an image-specific energy-guided scheduling, leading to the re-targeting of velocity in flow matching. Our framework requires no adaptation of the backbone and training data, bringing negligible cost on the training and inference stages. In our experiment, EG-FM consistently achieves lower FID on the ImageNet class-conditional image generation task at 256 times 256 with fewer epochs, reaching an FID of 1.55 at 200 epochs and 1.45 at 600 epochs. We continue training the generation task on the setting of 512 times 512 resolution, yielding a FID of 1.58 after only 40 high-resolution adaptation epochs. Furthermore, we transfer EG-FM on text-to-image generation and achieve 0.85 on GenEval score and 83.9 on DPG-Bench. Code is available at https://github.com/ysng123/EG-FM.', 'score': 5, 'issue_id': 3041, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'd94445fa284fc1bf', 'authors': ['Haoyang Tong', 'Yu He', 'Fang Li', 'Lichen Ma', 'Jingling Fu', 'Dong Chen', 'Zhen Chen', 'Junshi Huang', 'Jie Cao'], 'affiliations': ['JD.com', 'MAIS & NLPR, CASIA', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05811.jpg', 'data': {'categories': ['#diffusion', '#open_source', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'От размытого к чёткому: энергетически управляемая генерация через движущуюся траекторию', 'desc': 'В работе предложен метод Energy-Guided Flow Matching (EG-FM), который улучшает качество генеративных моделей путём явного моделирования траектории генерации от грубых деталей к точным. Вместо фиксированной конечной точки в процессе интерполяции, метод использует движущуюся конечную точку, отфильтрованную фильтром теплопроводности, которая плавно эволюционирует от изображения с низкими частотами к чистому изображению. Высокочастотные компоненты раскрываются постепенно через адаптивное расписание, управляемое энергией самого изображения, что приводит к переориентированию скорости в flow matching. Метод достигает лучших результатов на задаче класс-условной генерации изображений в ImageNet, получив FID 1.45 при 600 эпохах обучения и FID 1.58 при разрешении 512×512.'}, 'en': {'title': 'Progressive Detail Unveiling in Generative Models', 'desc': 'Energy-Guided Flow Matching (EG-FM) enhances the quality of generative models by progressively revealing high-frequency details during the image generation process. It replaces the traditional fixed endpoint in flow matching with a dynamic endpoint that evolves from low-frequency to high-frequency images, allowing for better control over the generation trajectory. This method reduces training costs while achieving state-of-the-art Fréchet Inception Distance (FID) scores, indicating improved image quality. EG-FM is efficient, requiring no changes to the existing model architecture or training data, and it performs well in both image generation and text-to-image tasks.'}, 'zh': {'title': '能量引导流匹配：提升生成质量的新方法', 'desc': '本文提出了一种名为能量引导流匹配（EG-FM）的方法，旨在提高生成模型的质量。EG-FM通过移动端点和自适应调度，逐步揭示高频细节，从而降低训练成本并实现最先进的FID分数。与传统的流匹配方法不同，EG-FM显式建模了从粗到细的生成轨迹，使用热核滤波器平滑演变的端点。实验结果表明，EG-FM在图像生成任务中表现出色，能够在较少的训练周期内获得更低的FID分数。'}}}, {'id': 'https://huggingface.co/papers/2608.17286', 'title': 'Abra: Scaling Diffusion Image Training', 'url': 'https://huggingface.co/papers/2608.17286', 'abstract': 'Abstract Scaling laws for text-to-image diffusion models reveal predictable compute-optimal training requiring far more data per parameter than language models, with robust overtraining behavior and universal curve shapes.  Generated by thinkingmachines/Inkling-Small Compute-optimal scaling laws guide the training of frontier language models yet remain largely unexplored for visual generation. We present a systematic scaling law study for text-to-image diffusion models using Abra, a controlled family of flow-matching transformers trained across three orders of magnitude worth of compute (10^{19} to 10^{22} FLOPs), reaching significantly larger compute budgets than previous works. We demonstrate that diffusion models scale just as predictably as language models but require far more data to train optimally: compute optimality occurs at approximately 200 image tokens per parameter, ten times the Chinchilla compute-optimal prescription for LLMs. We show that unlike language models, diffusion models are robust to overtraining and that practitioners should err on the side of more data rather than a larger model. Finally, we show that this predictability extends beyond training loss to generative quality metrics, optimal CFG settings, representation quality, and even the shape of the training curves, which collapse onto a universal form.', 'score': 4, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '96c45ba5a52bddd2', 'authors': ['Kyle Chickering', 'Wei-An Lin', 'Swayam Bhanded', 'Dan Saunders', 'Akshat Tripathi', 'Jiaming Song', 'Shyamal Buch', 'Xinchen Yan'], 'affiliations': ['Luma AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17286.jpg', 'data': {'categories': ['#training', '#architecture', '#multimodal', '#diffusion', '#benchmark', '#optimization'], 'emoji': '🖼️', 'ru': {'title': 'Универсальные законы масштабирования для визуальной генерации', 'desc': 'В этой работе исследуются законы масштабирования для text-to-image диффузионных моделей, построенных на основе flow-matching трансформеров. Авторы обнаружили, что эти модели масштабируются предсказуемо, подобно языковым моделям, но требуют значительно больше данных на один параметр — примерно 200 токенов изображения на параметр, что в десять раз превышает оптимальное значение для LLM. Исследование показало, что диффузионные модели устойчивы к переобучению, поэтому лучше увеличивать объём данных, чем архитектуру модели. Предсказуемость этих законов распространяется не только на функцию потерь, но и на метрики качества генерации, параметры CFG и даже форму кривых обучения, которые следуют универсальному паттерну.'}, 'en': {'title': 'Unlocking Predictable Scaling for Text-to-Image Diffusion Models', 'desc': 'This paper investigates the scaling laws for text-to-image diffusion models, highlighting their need for significantly more data per parameter compared to language models. It presents a study using a family of flow-matching transformers trained with a wide range of computational resources, demonstrating that diffusion models exhibit predictable scaling behavior similar to language models. The findings indicate that optimal training for these models occurs at around 200 image tokens per parameter, which is substantially higher than the requirements for language models. Additionally, the research reveals that diffusion models are resilient to overtraining, suggesting that using more data is preferable to simply increasing model size.'}, 'zh': {'title': '扩散模型的计算最优性与数据需求', 'desc': '本文研究了文本到图像扩散模型的规模法则，揭示了计算最优训练需要比语言模型更多的数据。我们使用Abra进行系统的规模法则研究，展示了扩散模型的可预测性与语言模型相似，但训练时需要的数据量是后者的十倍。研究表明，扩散模型对过拟合具有较强的鲁棒性，因此在训练时应优先考虑更多的数据而非更大的模型。最后，我们发现这种可预测性不仅适用于训练损失，还延伸到生成质量指标、最优CFG设置和训练曲线的形状。'}}}, {'id': 'https://huggingface.co/papers/2608.18063', 'title': 'EDITBRIDGE: Towards Faithful and Efficient Ultra-High-Resolution Image Editing', 'url': 'https://huggingface.co/papers/2608.18063', 'abstract': 'Abstract EditBridge enables efficient ultra high-resolution image editing via a diffusion bridge that translates low-resolution edits to high-resolution outputs while preserving source details through sparse attention.  Generated by thinkingmachines/Inkling-Small High-resolution image editing is increasingly demanded in professional workflows, yet existing diffusion-based models remain constrained to resolutions below 1K due to quadratic attention complexity and prohibitive memory requirements. A prevalent workaround employs a two-stage pipeline: editing at low resolution followed by independent super-resolution. However, this approach suffers from two critical issues: information divergence, where hallucinated details contradict the original high-resolution (HR) source, and texture degradation, manifesting as over-smoothed or over-sharpened artifacts. We propose EditBridge, a diffusion bridge framework for efficient ultra high-resolution editing. Unlike conventional diffusion that regenerates from noise, we formulate refinement as structured data-to-data translation from the low-resolution (LR) edited result to its HR counterpart, explicitly conditioned on the original HR source to preserve authentic details. To efficiently incorporate HR source guidance, we introduce a prior-guided block-wise sparse attention mechanism that exploits semantic correspondence from first-stage editing to constrain cross-image interactions to spatially aligned regions, significantly reducing computational overhead. Extensive experiments demonstrate that EditBridge achieves high-fidelity editing with superior perceptual quality at resolutions up to 4K, delivering 3.6--8.4times speedup at 2K and enabling practical 4K editing in 61 seconds.', 'score': 3, 'issue_id': 3045, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '9820d00228a33d98', 'authors': ['Jiayi Song', 'Shijie Huang', 'Fangtai Wu', 'Yubo Huang', 'Zhenxiong Tan', 'Songhua Liu', 'Jiaming Liu', 'Ruihua Huang'], 'affiliations': ['National University of Singapore', 'Qwen Business Unit of Alibaba', 'School of Artificial Intelligence, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.18063.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Мостик диффузии для редактирования изображений сверхвысокого разрешения', 'desc': 'EditBridge — это фреймворк на основе диффузионных моделей для редактирования изображений с очень высоким разрешением. Вместо традиционного подхода с двумя этапами (редактирование с низким разрешением и отдельное увеличение масштаба), метод использует прямую трансляцию отредактированного низкоразрешённого изображения в высокоразрешённый результат с сохранением оригинальных деталей. Для эффективного использования информации о высокоразрешённом исходнике авторы предложили механизм разреженного блочного внимания, который снижает вычислительные затраты за счёт ограничения взаимодействий между семантически соответствующими областями. Метод достигает редактирования с высокой точностью вплоть до разрешения 4K с ускорением в 3.6-8.4 раза и может обработать 4K-изображение за 61 секунду.'}, 'en': {'title': 'EditBridge: Revolutionizing High-Resolution Image Editing with Efficiency', 'desc': 'EditBridge is a novel framework designed for high-resolution image editing that addresses the limitations of existing diffusion models. It translates low-resolution edits into high-resolution outputs while maintaining the integrity of the original image details through a sparse attention mechanism. This approach avoids common pitfalls like information divergence and texture degradation by conditioning the high-resolution generation on the original source image. With EditBridge, users can achieve ultra high-resolution edits efficiently, significantly speeding up the process while enhancing image quality.'}, 'zh': {'title': '高效超高分辨率图像编辑的解决方案', 'desc': 'EditBridge 是一种高效的超高分辨率图像编辑框架，利用扩散桥接技术将低分辨率编辑转换为高分辨率输出，同时通过稀疏注意力机制保留源图像的细节。现有的扩散模型在处理高分辨率图像时受到内存和计算复杂度的限制，通常采用低分辨率编辑后再进行超分辨率处理，但这种方法容易导致信息偏差和纹理退化。EditBridge 通过将低分辨率编辑结果与原始高分辨率图像进行结构化的数据转换，确保保留真实细节。实验表明，EditBridge 在高达 4K 的分辨率下实现了高保真编辑，且在 2K 分辨率下速度提升了 3.6 到 8.4 倍，能够在 61 秒内完成实际的 4K 编辑。'}}}, {'id': 'https://huggingface.co/papers/2608.17988', 'title': 'GS-Voxel: Fitting-Free Structured Latents for Large-Scale 3DGS Generation', 'url': 'https://huggingface.co/papers/2608.17988', 'abstract': 'Abstract GS-Voxel converts unstructured 3D Gaussian reconstructions into sparse structured latents to enable scalable aerial scene generation via flow models.  Generated by thinkingmachines/Inkling-Small Many scalable latent 3D generators operate on structured tensors, whereas pre-optimized 3D Gaussian Splatting (3DGS) reconstructions are unordered, spatially irregular, and vary widely in primitive count. We present GS-Voxel, a fitting-free structured latent framework, and evaluate it for large-scale aerial 3D Gaussian scene generation. GS-Voxel deterministically converts a compatible pre-optimized 3DGS reconstruction into sparse active voxels without additional per-scene optimization, retaining the sub-voxel positions and rendering attributes of the selected primitives. A GS-specific factorized VAE then separately encodes voxel geometry and local Gaussian attributes into sparse 3D latents whose size grows with the number of occupied voxels rather than being limited by a fixed scene-wide primitive count. We train image-conditioned flow models in the GS-Voxel latent space to generate aerial 3DGS scenes. A key application enabled by GS-Voxel is large-area scene generation: overlap-aware tiled inference extends synthesis beyond a single training crop conditioned on satellite-view images. Our results show that GS-Voxel provides structured latents for pre-optimized aerial 3DGS reconstructions, with latent capacity that grows with the number of occupied voxels.', 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '5867586237373792', 'authors': ['Ming Qian', 'Zijian Wang', 'Minchao Sun', 'Jincheng Xiong', 'Hang Zhang', 'Mu Xu', 'Chi Wang', 'Baoquan Chen'], 'affiliations': ['Amap, Alibaba', 'Peking University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17988.jpg', 'data': {'categories': ['#training', '#architecture', '#diffusion', '#3d', '#optimization'], 'emoji': '🛰️', 'ru': {'title': 'Структурированные вокселы для масштабируемой генерации гауссовых сцен', 'desc': 'GS-Voxel преобразует неструктурированные 3D Gaussian реконструкции в разреженные структурированные латентные представления для масштабируемой генерации аэрофотосцен с помощью диффузионных моделей потока. Метод детерминистически конвертирует предварительно оптимизированные 3DGS реконструкции в активные вокселы без дополнительной оптимизации, сохраняя позиции и атрибуты примитивов. Специализированный факторизованный VAE отдельно кодирует геометрию вокселей и локальные атрибуты гауссианов в разреженные 3D латенты, размер которых растет с количеством занятых вокселей. Модели потока, обучаемые в латентном пространстве GS-Voxel, генерируют большие аэрофотосцены на основе спутниковых изображений, достигая синтеза сцен, превышающих размер одного обучающего образца.'}, 'en': {'title': 'Transforming 3D Gaussian Data for Scalable Aerial Scene Generation', 'desc': 'GS-Voxel is a framework that transforms unstructured 3D Gaussian reconstructions into organized sparse latents, facilitating the generation of large-scale aerial scenes using flow models. Unlike traditional methods that rely on structured tensors, GS-Voxel handles unordered and irregular 3D Gaussian Splatting (3DGS) data without needing scene-specific optimization. It encodes voxel geometry and local Gaussian attributes into sparse 3D latents, allowing the size of the latents to increase with the number of active voxels. This approach enables efficient generation of expansive aerial scenes by leveraging image-conditioned flow models and overlap-aware tiled inference.'}, 'zh': {'title': 'GS-Voxel：可扩展的空中场景生成新方法', 'desc': 'GS-Voxel 是一种将无结构的 3D 高斯重建转换为稀疏结构潜在空间的框架，旨在通过流模型实现可扩展的空中场景生成。与传统的结构化张量生成器不同，GS-Voxel 可以在不需要额外优化的情况下，将预优化的 3D 高斯重建转换为稀疏活跃体素。该方法保留了所选原始体素的亚体素位置和渲染属性，并通过特定的 VAE 编码体素几何和局部高斯属性。GS-Voxel 使得大面积场景生成成为可能，能够基于卫星视图图像进行超出单一训练裁剪的合成。'}}}, {'id': 'https://huggingface.co/papers/2608.16393', 'title': 'Security Assessment of DeepSeek Harness with A.I.G: Evaluating Resistance to Indirect Prompt Injection', 'url': 'https://huggingface.co/papers/2608.16393', 'abstract': "Abstract Researchers evaluate indirect prompt injection risks in DeepSeek Harness using controlled taint and dual judges, finding notable success rates across text and file channels and recommending controls between untrusted content and sensitive actions.  Generated by thinkingmachines/Inkling-Small We assess indirect prompt injection in DeepSeek Harness (DSH), using AI-Infra-Guard (A.I.G) to construct tests, deliver controlled taint, execute DSH, collect traces, and judge outcomes. The study covers 14,560 controlled executions over 16 indirect-content channels, text and file carrier modes, 35 payload objectives, one unmodified baseline, and 12 attack methods. The experiment preserves DSH's agent loop, tool registry, model adapter, and session-event path; source tools and sensitive sinks are local fixtures, so attempted actions are recorded without external side effects. We evaluate each trace with a deterministic rule-based judge,  (RuleJudge), and a semantic LLM-based judge,  (LLMJudge). The strongest observed attack success rates are 17.0% under  for fake-completion attack in text mode, 25.5% under  for hidden Unicode in file mode, and 16.0% under  for the skills channel in file mode.  also assigns partial compliance more often than  (7.3% versus 2.0%). We relate these results to DSH's treatment of tool results, additional contexts, and tool-call policy hooks, then identify controls that should sit between untrusted content and sensitive actions. Our code is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/Research/deepseek-harness-security-assessment .", 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'aced1c4232fe636c', 'authors': ['Zonghao Ying', 'Xiangfan Wu', 'Huiyu Wu', 'Xing Zheng', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.16393.jpg', 'data': {'categories': [], 'emoji': '🛡️', 'ru': {'title': 'Защита AI-агентов от косвенных инъекций через контролируемое тестирование', 'desc': 'Исследователи оценили риски косвенных prompt injection атак в системе DeepSeek Harness, используя контролируемое заражение данных и двойную систему оценки результатов. Эксперимент включал 14,560 контролируемых выполнений с различными каналами передачи информации, методами атак и целями. Были использованы два судьи для оценки: детерминированный RuleJudge на основе правил и LLMJudge на базе языковой модели. Исследование выявило уязвимости и рекомендует внедрить контроли безопасности между недоверенным контентом и чувствительными операциями.'}, 'en': {'title': 'Mitigating Indirect Prompt Injection Risks in AI Systems', 'desc': 'This paper investigates the risks of indirect prompt injection in the DeepSeek Harness (DSH) system, utilizing a method called controlled taint analysis. The researchers conducted extensive tests, executing over 14,000 trials across various content channels and attack methods to assess the effectiveness of different injection techniques. They employed two types of judges, a rule-based and a semantic LLM-based judge, to evaluate the outcomes of these attacks. The findings highlight significant success rates for certain attack types, leading to recommendations for implementing controls to protect sensitive actions from untrusted content.'}, 'zh': {'title': '评估DeepSeek Harness中的间接提示注入风险', 'desc': '本研究评估了DeepSeek Harness中的间接提示注入风险，使用了受控污点和双重评判的方法。研究涵盖了14,560次受控执行，涉及16个间接内容通道和35个有效载荷目标。实验结果显示，在文本模式下，假完成攻击的成功率为17.0%，而在文件模式下，隐藏Unicode的成功率为25.5%。研究建议在不可信内容和敏感操作之间设置控制措施，以降低潜在风险。'}}}, {'id': 'https://huggingface.co/papers/2608.17800', 'title': 'StartupBench: Benchmarking General-Purpose Agents on Market-Validated End-to-End Workflows', 'url': 'https://huggingface.co/papers/2608.17800', 'abstract': 'Abstract StartupBench evaluates end-to-end AI agents on real-world startup workflows and reveals that even top models complete only about 30% of tasks, highlighting gaps in instruction following and domain expertise.  Generated by thinkingmachines/Inkling-Small Recent advances in Large Language Models(LLMs) and agents have substantially improved the ability of AI systems to execute complex tasks. Yet existing benchmarks largely rely on researcher-selected tasks, leaving uncertain whether such progress extends to the work that real-world users actually demand from AI systems. We introduce StartupBench, an E2E agent benchmark grounded in market-validated AI startup products. Rather than defining tasks from pre-defined assumptions about useful agent capabilities, we systematically study AI products with demonstrated adoption, together with their product workflows and users, to identify real-world tasks for which AI has established practical demand across diverse professional domains. We translate these workflows into complete deliverable-oriented tasks and evaluate them with fine-grained rubrics capturing their complex requirements. Across representative models evaluated under a unified agent harness, even the strongest model successfully completes only approximately 30\\% of StartupBench, despite making substantial partial progress on many tasks. Further analysis identifies aspects like complex instruction following and domain-specific expertise as major sources of failure. Our results reveal that many market-validated workflows remain beyond the reliable capabilities of current general-purpose agents, establishing StartupBench as an empirical measure of progress toward E2E completions of real-world user tasks.', 'score': 3, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '0367b6e747c38770', 'authors': ['Liya Zhu', 'Xin Ma', 'Tao Liu', 'Haodong Wang', 'Ge Zhang', 'Jingzhe Ding', 'Qingshui Gu', 'Yongjie Zhong', 'Jinxiang Meng', 'Yuan Gao', 'Yunqiu Zhou', 'Hao Zhu', 'Jifeng He', 'Yongzhi Liao', 'Xinyi Zhang', 'Chaoxin Li', 'Yi Zhu', 'Xi Lin', 'Duju Zeng', 'Xiang Gao', 'Wen Zhang', 'Yunyang Wang', 'Duo Wang', 'Huan Zhou', 'Zuo Wang', 'Jin Chen', 'Kaiyuan Zhang', 'Chuqian Yu', 'Tianhao Yu', 'Longxiang Liu', 'Jianbo Xue', 'Huimin Che', 'Jiahao Wang', 'Yujia Qin', 'Jiaheng Liu', 'Shen Yan', 'Xiaolong Chang', 'Wenhao Huang'], 'affiliations': ['ByteDance Seed', 'M-A-P', 'Nanjing University', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17800.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset'], 'emoji': '🚀', 'ru': {'title': 'Настоящие задачи требуют большего: реальный мир выявляет пределы возможностей AI агентов', 'desc': 'StartupBench — это бенчмарк для оценки end-to-end AI агентов на реальных рабочих процессах стартапов, основанный на анализе существующих продуктов с установленной пользовательской базой. Исследователи перевели реальные рабочие потоки в задачи ориентированные на результаты и оценили их с помощью детальных критериев, отражающих сложные требования. Результаты показали, что даже л
