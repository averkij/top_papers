    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2608.14036', 'title': "Demystifying Agent Skills: Why They Work-Until They Don't", 'url': 'https://huggingface.co/papers/2608.14036', 'abstract': 'Abstract Skills enhance LLM agents primarily by stabilizing execution through procedural anchoring rather than injecting missing knowledge, though retrieval bottlenecks and brittle assumptions limit their effectiveness.  Generated by thinkingmachines/Inkling-Small Skills have emerged as a practical and effective approach for enhancing LLM agents at inference time through structured packages of knowledge. However, existing evaluations largely measure whether skills improve aggregated task success, leaving a more fundamental question underexplored: \\textbf{When do skills help, why do they work, and where do they fail?} Through controlled experiments across various benchmarks, agent harnesses and LLMs, we isolate the effects of representation, outcome annotation, retrieval difficulty, and cross-framework robustness of skills. To further answer this question, we design a contrastive study that combines controlled quantitative experiments with paired trajectory analysis. We normalize 8,135 trial records from controlled experiments and retain 238 valid unique labels from 240 open-coded records. We consolidate these observations into a taxonomy of three high-level categories and twelve skill-use modes: skills work when noisy trajectories become procedural anchors that stabilize execution. Skills improve over Workflow Memory by 6.06 points in matched comparisons. Procedural anchoring accounts for 65.7\\% of skill cases, versus 4.5\\% for explicit knowledge injection, showing that skills stabilize action rather than inject missing facts. Retrieval is a separate bottleneck: as pools grow from 5 to 100, actual-use precision falls from 29.6\\% to 3.3\\%. Confusable distractors impair offline identification, yet downstream success remains stable; exact ground-truth invocation is neither sufficient nor necessary. Skills fail under brittle assumptions, incompatible contexts, or insufficient adaptation. These findings move evaluation beyond aggregate success rates and guide reliable self-evolving agents.', 'score': 119, 'issue_id': 3046, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'b561ee77e6bbd7c4', 'authors': ['Zhiyuan Jiang', 'Fangrui Huang', 'Hanwen Xing', 'Xander Wu', 'Yipeng Gao', 'Rui Cao', 'Mengdi Wang', 'Shilong Liu', 'Yijiang Li'], 'affiliations': ['Johns Hopkins University', 'Princeton University', 'Stanford University', 'UC San Diego', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2608.14036.jpg', 'data': {'categories': ['#reasoning', '#inference', '#benchmark', '#agents', '#interpretability', '#training'], 'emoji': '🧭', 'ru': {'title': 'Навыки стабилизируют агентов через процедурное якорение, а не через добавление знаний', 'desc': 'В статье исследуется, как навыки (skills) улучшают работу LLM-агентов во время инференса. Авторы проводят контролируемые эксперименты и обнаруживают, что навыки работают главным образом как процедурные якоря, стабилизирующие выполнение задач, а не путём внедрения новых знаний. Через анализ 8135 записей экспериментов выявлена таксономия из трёх категорий и двенадцати режимов использования навыков. Исследование показывает, что поиск нужного навыка из большого набора становится узким местом: точность использования падает с 29.6% до 3.3% при увеличении пула с 5 до 100 навыков.'}, 'en': {'title': 'Stabilizing LLMs: The Power of Procedural Anchoring', 'desc': 'This paper explores how skills can enhance large language model (LLM) agents by providing procedural anchors that stabilize their execution rather than simply adding new knowledge. The authors conducted controlled experiments to analyze when and why these skills are effective, revealing that skills significantly improve performance by organizing actions into stable procedures. They identified a taxonomy of skill-use modes and found that procedural anchoring is the primary mechanism behind skill effectiveness, while retrieval challenges can hinder performance. The study emphasizes the importance of understanding the conditions under which skills succeed or fail, moving beyond just measuring overall task success.'}, 'zh': {'title': '技能通过程序性锚定提升LLM代理的稳定性', 'desc': '本论文探讨了技能如何通过程序性锚定来增强大型语言模型（LLM）代理的执行稳定性，而不是仅仅注入缺失的知识。研究表明，技能在执行过程中能够有效地稳定行动，尤其是在面对噪声轨迹时。通过对控制实验的分析，论文提出了技能使用的分类法，并指出技能在不同情况下的有效性和局限性。最终，研究结果为自我进化的代理提供了可靠的评估标准，超越了简单的成功率衡量。'}}}, {'id': 'https://huggingface.co/papers/2608.17310', 'title': 'Agentic ESOpt: Fine-Tuning Long-Horizon LLM Agents with Minimal GPU Requirements', 'url': 'https://huggingface.co/papers/2608.17310', 'abstract': 'Abstract Agentic ESOpt uses evolution strategies for scalable full-parameter fine-tuning of long-horizon LLM agents via trajectory-level reward-weighted updates and parameter-context co-evolution.  Generated by thinkingmachines/Inkling-Small Reinforcement Learning (RL) has been promising in single-turn LLM fine-tuning. However, long-horizon agentic reasoning introduces increasingly branching interactions and sparse rewards, exposing several limitations of RL: its heavyweight backpropagation-based training stack makes it impractical to fine-tune larger LLMs, and longer-horizon trajectories make credit assignment in RL substantially harder. This paper argues that evolution strategies (ES) can be a better choice for fine-tuning long-horizon LLM agents. Compared with agentic RL, ES offers three key advantages: 1) Model Scalability: ES enables full-parameter optimization with only minimal, inference-level GPU memory, making it possible to fine-tune large LLMs. 2) Flexibility: its lightweight, black-box feedback interface makes ES fine-tuning easy to compose with prompt-space evolution (e.g., skill optimization & test-time compute); and 3) Long-Horizon Scalability: ES performs trajectory-level parameter attribution without decomposing rewards across horizons, yielding better scalability than Agentic RL as the horizon length grows. Based on this insight, we propose Agentic ESOpt, a full-parameter agentic fine-tuning framework tailored to flexible parameter--context co-evolution. At each step, Agentic ESOpt samples perturbations around the current LLM parameters, evaluates the resulting agents with rewards, and applies an online reward-weighted update. To improve the exploration--adaptation trade-off, Agentic ESOpt further introduces a cosine decay schedule of the perturbation scale σ. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.', 'score': 91, 'issue_id': 3040, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '8f2a9c65809e859e', 'authors': ['Zhi Zheng', 'Rongsheng Chen', 'Yunpeng Ba', 'Zhenkun Wang', 'Yee Whye Teh', 'Wee Sun Lee'], 'affiliations': ['National University of Singapore', 'Oxford', 'Southern University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.17310.jpg', 'data': {'categories': ['#architecture', '#reasoning', '#optimization', '#training', '#agents', '#rl'], 'emoji': '🧬', 'ru': {'title': 'Эволюционные стратегии вместо обучения с подкреплением для долгосрочных агентов', 'desc': 'В статье предлагается Agentic ESOpt — метод для полнопараметровой тонкой настройки больших языковых моделей, используемых в агентах с долгосрочным горизонтом действия. Вместо традиционного обучения с подкреплением авторы применяют стратегии эволюции, которые требуют значительно меньше памяти GPU и лучше справляются с разреженными наградами на длинных траекториях. Метод сочетает оптимизацию параметров модели с эволюцией подсказок (контекста), используя возмущения параметров и награды на уровне целых траекторий. Экспериментальные результаты показывают улучшение производительности агентов на бенчмарке WebArena-Lite и успешную совместную эволюцию параметров и подсказок во время тестирования.'}, 'en': {'title': 'Revolutionizing LLM Fine-Tuning with Evolution Strategies', 'desc': 'The paper introduces Agentic ESOpt, a method that uses evolution strategies (ES) for fine-tuning large language models (LLMs) over long time horizons. Unlike traditional reinforcement learning (RL), which struggles with credit assignment and resource demands, ES allows for scalable optimization with minimal memory usage. This approach enhances flexibility by enabling easy integration with prompt-space evolution and improves performance in long-horizon tasks by attributing rewards at the trajectory level. The results show significant improvements in model performance, demonstrating the effectiveness of ES in fine-tuning LLMs compared to conventional RL methods.'}, 'zh': {'title': '进化策略：长时间跨度LLM微调的新选择', 'desc': '本文提出了一种名为Agentic ESOpt的框架，利用进化策略（ES）对长时间跨度的语言模型（LLM）进行全参数微调。与传统的强化学习（RL）方法相比，ES在模型可扩展性、灵活性和长时间跨度的可扩展性方面具有显著优势。ES能够在仅需最小推理级GPU内存的情况下实现全参数优化，从而使得大型LLM的微调成为可能。此外，Agentic ESOpt通过在线奖励加权更新和扰动采样，提升了探索与适应的平衡，显著提高了模型性能。'}}}, {'id': 'https://huggingface.co/papers/2608.17271', 'title': 'ASI-Bench: At the Dawn of Artificial Superintelligence', 'url': 'https://huggingface.co/papers/2608.17271', 'abstract': "Abstract  Artificial superintelligence (ASI) requires AI to move beyond mastering existing knowledge toward exploring the unknown, creating new knowledge, and turning new ideas into verifiable results. However, the capabilities of today's AI systems are still largely built on learning, compressing, and applying existing human knowledge. Accordingly, existing benchmarks primarily test whether AI can produce correct answers based on learned knowledge, or whether it can complete tasks under extensive human guidance. We therefore introduce ASI-Bench, the first benchmark to jointly evaluate AI systems' capabilities of innovative exploration and autonomous scientific execution across general research domains, and the first to progressively withdraw human methodological guidance within the same research project to test how far AI can proceed on its own. Built by over 40 experts with the cost of 31,000+ human hours, ASI-Bench contains 60 project-level research tasks across 11 scientific domains and progressively reduces methodological guidance to test whether AI can independently select methods, conduct research, and produce verifiable results. All tasks undergo expert review, AI-assisted auditing, sandbox execution, and scorer validation. Across 18 state-of-the-art agent--model configurations, the average score drops from 50.91 with full methodological guidance to 29.10 with only the method specified and 26.62 when agents must determine the method themselves. This sharp decline shows that current systems remain heavily dependent on human guidance and are still far from autonomously conducting end-to-end, project-level scientific research. ASI-Bench is open to the world. We invite researchers and builders everywhere to contribute new tasks, challenge the limits of today's AI, and help accelerate humanity's collective path toward artificial superintelligence at https://asibench.apexin.ai/submit.", 'score': 51, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ba7ecd13b8d01775', 'authors': ['Junwei Zhou', 'Zhen Sun', 'Binyu Li', 'Jiangyu Zhou', 'Yuexi Pan', 'Hengyu Wang', 'Honghe Ren', 'Xiaohan Jia', 'Xueyang Zhou', 'Xiaoyu Cao', 'Yongchao Chen', 'Yuanning Feng', 'Junhao Wu', 'Cheng Zhang', 'Sijia Chen', 'Haoyu Xue', 'Chengsong You', 'Huan Wang', 'Koutian Wu', 'Peigan Gao', 'Jiakun Wu', 'Wenzhe Li', 'Ergan Shang', 'Qingyuan Zheng', 'Jingjing Zhou', 'Ruixuan Jia', 'Yan Xu', 'Hongrui Zhang', 'Xiao-Han Ma', 'Zhengxiang Cheng', 'Yuexing Hao', 'Liting Mai', 'Xianglin Ji', 'Wenjun Zhang', 'Zhuofan Chen', 'Yixiao Huang', 'Chi Wang', 'Wenyue Hua', 'Yilun Hao', 'Yuantao Zhai', 'Ziyan Zhao', 'Jingyan Xie'], 'affiliations': ['AG2 AI', 'Boston University', 'Carnegie Mellon University', 'Flatiron Institute', 'Harvard University', 'Massachusetts Institute of Technology', 'Microsoft Research', 'Tsinghua University', 'University of Illinois Urbana-Champaign', 'University of Michigan', 'University of Queensland', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2608.17271.jpg', 'data': {'categories': ['#agents', '#agi', '#science', '#benchmark', '#open_source'], 'emoji': '🔬', 'ru': {'title': 'От заученных знаний к настоящему научному открытию: измеряем путь к искусственному сверхинтеллекту', 'desc': 'В статье представлен ASI-Bench — первый бенчмарк для оценки способности AI систем к инновационным исследованиям и автономному научному выполнению задач. Бенчмарк содержит 60 проектных исследовательских задач из 11 научных областей и прогрессивно снижает уровень методологической поддержки человека. Результаты показывают резкое падение производительности современных агентов с 50.91 баллов при полной помощи до 26.62 при полной автономии, что демонстрирует зависимость текущих систем от человеческого руководства. Исследование выявляет, что AI системы по-прежнему далеки от самостоятельного проведения полноценных научных проектов от начала до конца.'}, 'en': {'title': 'Pushing AI Beyond Knowledge: The ASI-Bench Challenge', 'desc': "This paper discusses the limitations of current AI systems, which mainly rely on existing human knowledge and guidance. It introduces ASI-Bench, a new benchmark designed to evaluate AI's ability to innovate and conduct scientific research independently. The benchmark includes 60 research tasks across various scientific domains and progressively reduces human assistance to assess AI's autonomy. Results show a significant drop in performance as human guidance decreases, highlighting the need for further advancements toward achieving artificial superintelligence."}, 'zh': {'title': '推动人工智能自主研究的新时代', 'desc': '这篇论文介绍了人工超智能（ASI）的新基准测试——ASI-Bench。该基准旨在评估人工智能系统在创新探索和自主科学执行方面的能力，特别是在减少人类指导的情况下。研究表明，当前的AI系统在完全依赖人类指导时表现较好，但在自主选择方法和进行研究时，性能显著下降。通过60个项目级研究任务，ASI-Bench为推动AI的独立研究能力提供了重要的测试平台。'}}}, {'id': 'https://huggingface.co/papers/2608.16157', 'title': 'FreeToken: Efficient Edge-Native MoE Serving with Bandwidth-Adaptive Execution', 'url': 'https://huggingface.co/papers/2608.16157', 'abstract': 'Abstract FreeToken is an edge-native Mixture-of-Experts serving system that dynamically maps computation and model state onto heterogeneous local hardware to run large open-weight models on personal machines.  Generated by thinkingmachines/Inkling-Small Frontier open-weight models are increasingly available, but serving them still largely assumes datacenter infrastructure. We present FreeToken, an edge-native MoE serving system that treats a personal machine not as a small GPU, but as a unified, elastic inference platform. FreeToken co-designs the full serving stack, including model layout and loading, expert residency, CPU--GPU execution, agentic state reuse, and runtime memory management, around two realities of local AI: agent workloads continuously change their execution pattern, and edge hardware exposes heterogeneous resources whose balance differs from machine to machine. Rather than committing to a fixed offloading strategy, FreeToken continuously maps computation and model state onto the resources actually available. FreeToken supports more than 20 MoE models and real coding and tool-using agents across hardware ranging from an 8GB laptop GPU to a single workstation GPU. More importantly, it changes what these machines can practically serve, from a 35B model on a laptop to a 284B model on a gaming desktop and the 753B GLM-5.2 on a single workstation GPU. FreeToken turns open weights into deployable local software, making the machines users already own a practical platform for frontier-scale intelligence. We release the system at flashml.ai.', 'score': 51, 'issue_id': 3042, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '6fd78c0894803fe6', 'authors': ['Shuo Yang', 'Xiaoze Fan', 'Melissa Pan', 'Haocheng Xi', 'Zhe Wang', 'Shanlin Sun', 'Kurt Keutzer', 'Song Han', 'Matei Zaharia', 'Chenfeng Xu', 'Ion Stoica'], 'affiliations': ['UC Berkeley', 'University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2608.16157.jpg', 'data': {'categories': ['#inference', '#agents', '#architecture'], 'emoji': '💻', 'ru': {'title': 'Локальное развёртывание фронтирных моделей на персональном оборудовании через адаптивное распределение вычислений', 'desc': 'FreeToken — это система для запуска больших открытых моделей на локальных персональных компьютерах с использованием архитектуры Mixture-of-Experts. Система динамически распределяет вычисления и состояние модели между разнородными ресурсами (CPU, GPU, оперативная память) в зависимости от их доступности и характеристик конкретного оборудования. Авторы переосмыслили весь стек инфраструктуры — от загрузки моделей и размещения экспертов до управления памятью и переиспользования состояния агентов. FreeToken позволяет запускать модели масштаба сотен миллиардов параметров (до 753B) на обычных ноутбуках и рабочих станциях, делая фронтирные модели практически применимыми на личном оборудовании.'}, 'en': {'title': 'Empowering Personal Machines with Frontier-Scale AI', 'desc': 'FreeToken is a Mixture-of-Experts (MoE) serving system designed for edge devices, allowing large open-weight models to run efficiently on personal hardware. It dynamically allocates computation and model states based on the unique resources of each machine, rather than relying on fixed datacenter infrastructure. By co-designing the serving stack, FreeToken optimizes model layout, execution, and memory management to adapt to changing workloads and heterogeneous hardware. This innovation enables users to deploy and utilize large AI models, such as a 753B model, on everyday machines like laptops and workstations.'}, 'zh': {'title': 'FreeToken：将开放权重模型变为可部署的本地软件', 'desc': 'FreeToken 是一个边缘原生的专家混合（MoE）服务系统，能够动态地将计算和模型状态映射到异构的本地硬件上，以便在个人计算机上运行大型开放权重模型。它将个人计算机视为一个统一的、弹性的推理平台，而不是简单的小型 GPU。FreeToken 设计了完整的服务堆栈，包括模型布局、专家驻留、CPU-GPU 执行、状态重用和运行时内存管理，以适应本地 AI 的实际情况。通过不断映射计算和模型状态到可用资源，FreeToken 支持多种 MoE 模型，使用户的个人设备能够处理更大规模的智能任务。'}}}, {'id': 'https://huggingface.co/papers/2608.17512', 'title': 'Embodied-Navigator: Point, Think, Memorize, and Align for Efficient Navigation', 'url': 'https://huggingface.co/papers/2608.17512', 'abstract': "Abstract TAMP-Nav improves embodied navigation by aligning vision-language models with 2D visual prompting, selective reasoning with compressed memory, and dense policy optimization.  Generated by thinkingmachines/Inkling-Small Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting. Specifically, the VLM merely selects 2D pixels, which are then projected into 3D coordinates for a low-level SLAM controller. This design naturally aligns embodied execution with the VLM's inherent 2D visual capabilities. Second, we propose an integrated Selective Reasoning and Anchor-Trajectory Memory mechanism (Think and Memorize), which dynamically triggers Chain-of-Thought and retains high-fidelity memory only at critical nodes, compressing redundant trajectories into lightweight Space-Time Indicators, thereby preserving critical historical information and enhancing spatio-temporal perception. Finally, we design an efficient Two-Level Alignment Paradigm (Align) via Group Relative Policy Optimization (GRPO). By superimposing global outcome rewards with fine-grained process rewards, this dense supervision tightly aligns the agent's cognitive planning with physical environmental feedback, endowing the model with adaptive reasoning capabilities. Experiments demonstrate that TAMP-Nav achieves state-of-the-art performance (e.g., 66.2% SR on R2R-CE) with high runtime and sample efficiency (requiring only 90k training trajectories).", 'score': 44, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'f873ff04e373f466', 'authors': ['Hongyan Feng', 'Sunlai Chen', 'Xuanyu Liu', 'Miao Pan', 'Yangfan Xie', 'Yuxiang Cui', 'Zhongxiang Zhou', 'Rong Xiong', 'Wenqi Zhang', 'Jianwei Yin', 'Yueting Zhuang', 'Xuhong Zhang'], 'affiliations': ['School of Software Technology, Zhejiang University', 'Zhejiang Humanoid Robot Innovation Center Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2608.17512.jpg', 'data': {'categories': ['#rl', '#training', '#agents', '#robotics', '#multimodal'], 'emoji': '🧭', 'ru': {'title': 'Выравнивание видеоязыковых моделей с 2D восприятием для эффективной навигации робота', 'desc': 'TAMP-Nav представляет собой единый фреймворк для улучшения воплощённой навигации робота путём согласования возможностей видеоязыковых моделей с естественным 2D восприятием. Система использует инновационную формулировку «Пиксель-в-3D действие», где VLM выбирает 2D пиксели, которые затем проецируются в 3D координаты для низкоуровневого контроллера SLAM. Фреймворк включает механизм селективного рассуждения и якорной памяти траектории, который динамически активирует цепочку мыслей только в критических узлах, сжимая избыточные траектории в компактные пространственно-временные индикаторы. Оптимизация достигается через двухуровневую парадигму выравнивания с использованием групповой оптимизации относительной политики, сочетающей глобальные награды результата с мелкозернистыми наградами процесса.'}, 'en': {'title': 'Navigating the Future: Aligning Vision and Action in 3D', 'desc': "TAMP-Nav is a new framework that enhances embodied navigation by integrating vision-language models with 2D visual prompts. It reformulates navigation tasks into a 2D pixel selection process, which is then translated into 3D actions for better alignment with the model's pre-training. The framework also introduces a selective reasoning mechanism that optimizes memory usage by focusing on important information and compressing less relevant data. Finally, it employs a two-level alignment strategy that combines global and local rewards to improve the agent's decision-making and adaptability in real-world environments."}, 'zh': {'title': '高效体感导航的新突破', 'desc': 'TAMP-Nav 是一种改进的体感导航框架，通过将视觉-语言模型与二维视觉提示对齐，提升了导航效率。它采用了像素到三维动作的重新定义，使得模型可以直接选择二维像素并将其投影到三维坐标中，从而更好地利用其二维视觉能力。此外，TAMP-Nav 引入了选择性推理和锚点轨迹记忆机制，动态保留重要信息并压缩冗余轨迹，增强了时空感知能力。最后，通过群体相对策略优化的两级对齐范式，模型实现了认知规划与环境反馈的紧密对齐，展现出卓越的适应性推理能力。'}}}, {'id': 'https://huggingface.co/papers/2608.12313', 'title': 'AVA-Encoder: Towards Agent-Native Video Representation Learning', 'url': 'https://huggingface.co/papers/2608.12313', 'abstract': 'Abstract AVA-Encoder learns structured video representations via agentic auto-encoding using knowledge graphs and textual-gradient optimization to improve cinematic video generation and reasoning.  Generated by thinkingmachines/Inkling-Small Creative agents still lack an effective way to learn from high-quality human films, limiting their ability to produce cinematic-grade videos. A key challenge is the absence of a structured video representation that is both faithful to film content and directly usable for agentic reasoning and manipulation. To address the challenge, we propose the Agentic Video Auto-Encoder (AVA-Encoder), a framework for learning agent-native video representations via agentic auto-encoding.   AVA-Encoder transforms a video into a knowledge graph (KG) representation and then reconstructs it back into video. Its hierarchy and state nodes store structured text, while a linked asset layer holds generated images, audio, and video. Typed edges preserve the relations between these text descriptions and assets in a form that agents can easily understand, query, and edit. The video reconstruction differences drive a textual-gradient optimization framework, which expresses evaluation feedback as natural-language update directions for Data-Independent Encoding Policy Pseudo-Training in the outer loop and optional Data-Dependent KG Representation Refinement in the test-time inner loop.   Extensive experiments show that AVA-Encoder improves by 20.7 percentage points over the strongest external baseline. In the controlled policy-only setting, its pseudo-trained shot-level Agentic Video Encoder policy also outperforms a carefully human-tuned policy while using 74.3% fewer system-prompt tokens. We release the complete AVA-Encoder framework, a reliable agentic video reconstruction benchmark, and the first dataset of high-quality film KG representations.', 'score': 35, 'issue_id': 3041, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '1dbf7213c8e13939', 'authors': ['Chuyue Li', 'Jinpeng Yu', 'Haozhe Wang', 'Tian Xueyun', 'Zhijing Zhang', 'Bingnan Li', 'Shuqi Gu', 'Kan Ren', 'Jiaming Liu', 'Ruihua Hua'], 'affiliations': ['Institute of Computing Technology', 'Qwen Business Unit of Alibaba', 'ShanghaiTech University', 'Southeast University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.12313.jpg', 'data': {'categories': ['#agents', '#multimodal', '#video', '#benchmark', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Структурированное представление видео через агентный автокодировщик с графами знаний', 'desc': 'AVA-Encoder — это фреймворк, который преобразует видео в структурированное представление в виде графа знаний, сохраняя текстовые описания и цифровые активы в форме, удобной для агентного рассуждения и манипулирования. Система использует технику текстуального градиентного оптимизирования, где обратная связь от восстановления видео преобразуется в естественно-языковые направления обновления для обучения политики модели. Подход демонстрирует значительное улучшение на 20.7 процентных пункта над существующими базовыми методами и достигает производительности ручной настройки при использовании на 74.3% меньше токенов. Фреймворк позволяет агентам эффективнее учиться на высокачественных кинофильмах и генерировать видео кинематографического качества.'}, 'en': {'title': 'Transforming Video Learning with Knowledge Graphs', 'desc': 'The AVA-Encoder is a novel framework designed to enhance how creative agents learn from high-quality films by using structured video representations. It converts videos into knowledge graphs, which help in understanding and manipulating video content more effectively. By employing a textual-gradient optimization method, the framework provides feedback in natural language, allowing for better training of video generation policies. Experimental results demonstrate significant improvements in video quality and efficiency compared to existing methods, showcasing the potential of structured representations in cinematic video generation.'}, 'zh': {'title': '代理自编码：提升视频生成与推理的创新框架', 'desc': 'AVA-Encoder是一种通过代理自编码学习结构化视频表示的方法，利用知识图谱和文本梯度优化来提升电影视频生成和推理能力。该框架将视频转换为知识图谱表示，并能够将其重构回视频，存储结构化文本和生成的图像、音频及视频。通过保留文本描述和资产之间的关系，代理可以更容易地理解、查询和编辑这些信息。实验结果表明，AVA-Encoder在视频重构任务中显著优于现有的基线方法，展示了其在生成高质量电影视频方面的潜力。'}}}, {'id': 'https://huggingface.co/papers/2608.18063', 'title': 'EDITBRIDGE: Towards Faithful and Efficient Ultra-High-Resolution Image Editing', 'url': 'https://huggingface.co/papers/2608.18063', 'abstract': 'Abstract EditBridge enables efficient ultra high-resolution image editing via a diffusion bridge that translates low-resolution edits to high-resolution outputs while preserving source details through sparse attention.  Generated by thinkingmachines/Inkling-Small High-resolution image editing is increasingly demanded in professional workflows, yet existing diffusion-based models remain constrained to resolutions below 1K due to quadratic attention complexity and prohibitive memory requirements. A prevalent workaround employs a two-stage pipeline: editing at low resolution followed by independent super-resolution. However, this approach suffers from two critical issues: information divergence, where hallucinated details contradict the original high-resolution (HR) source, and texture degradation, manifesting as over-smoothed or over-sharpened artifacts. We propose EditBridge, a diffusion bridge framework for efficient ultra high-resolution editing. Unlike conventional diffusion that regenerates from noise, we formulate refinement as structured data-to-data translation from the low-resolution (LR) edited result to its HR counterpart, explicitly conditioned on the original HR source to preserve authentic details. To efficiently incorporate HR source guidance, we introduce a prior-guided block-wise sparse attention mechanism that exploits semantic correspondence from first-stage editing to constrain cross-image interactions to spatially aligned regions, significantly reducing computational overhead. Extensive experiments demonstrate that EditBridge achieves high-fidelity editing with superior perceptual quality at resolutions up to 4K, delivering 3.6--8.4times speedup at 2K and enabling practical 4K editing in 61 seconds.', 'score': 21, 'issue_id': 3045, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '9820d00228a33d98', 'authors': ['Jiayi Song', 'Shijie Huang', 'Fangtai Wu', 'Yubo Huang', 'Zhenxiong Tan', 'Songhua Liu', 'Jiaming Liu', 'Ruihua Huang'], 'affiliations': ['National University of Singapore', 'Qwen Business Unit of Alibaba', 'School of Artificial Intelligence, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.18063.jpg', 'data': {'categories': [], 'emoji': '🎨', 'ru': {'title': 'Мостик диффузии для редактирования изображений сверхвысокого разрешения', 'desc': 'EditBridge — это фреймворк на основе диффузионных моделей для редактирования изображений с очень высоким разрешением. Вместо традиционного подхода с двумя этапами (редактирование с низким разрешением и отдельное увеличение масштаба), метод использует прямую трансляцию отредактированного низкоразрешённого изображения в высокоразрешённый результат с сохранением оригинальных деталей. Для эффективного использования информации о высокоразрешённом исходнике авторы предложили механизм разреженного блочного внимания, который снижает вычислительные затраты за счёт ограничения взаимодействий между семантически соответствующими областями. Метод достигает редактирования с высокой точностью вплоть до разрешения 4K с ускорением в 3.6-8.4 раза и может обработать 4K-изображение за 61 секунду.'}, 'en': {'title': 'EditBridge: Revolutionizing High-Resolution Image Editing with Efficiency', 'desc': 'EditBridge is a novel framework designed for high-resolution image editing that addresses the limitations of existing diffusion models. It translates low-resolution edits into high-resolution outputs while maintaining the integrity of the original image details through a sparse attention mechanism. This approach avoids common pitfalls like information divergence and texture degradation by conditioning the high-resolution generation on the original source image. With EditBridge, users can achieve ultra high-resolution edits efficiently, significantly speeding up the process while enhancing image quality.'}, 'zh': {'title': '高效超高分辨率图像编辑的解决方案', 'desc': 'EditBridge 是一种高效的超高分辨率图像编辑框架，利用扩散桥接技术将低分辨率编辑转换为高分辨率输出，同时通过稀疏注意力机制保留源图像的细节。现有的扩散模型在处理高分辨率图像时受到内存和计算复杂度的限制，通常采用低分辨率编辑后再进行超分辨率处理，但这种方法容易导致信息偏差和纹理退化。EditBridge 通过将低分辨率编辑结果与原始高分辨率图像进行结构化的数据转换，确保保留真实细节。实验表明，EditBridge 在高达 4K 的分辨率下实现了高保真编辑，且在 2K 分辨率下速度提升了 3.6 到 8.4 倍，能够在 61 秒内完成实际的 4K 编辑。'}}}, {'id': 'https://huggingface.co/papers/2608.17528', 'title': 'Agent Lightning v1.0: Towards Harnessed Agentic RL', 'url': 'https://huggingface.co/papers/2608.17528', 'abstract': 'Abstract Agent Lightning v1.0 enables reproducible reinforcement learning for arbitrary agent harnesses, substantially improving coding-agent performance with minimal data and compute.  Generated by thinkingmachines/Inkling-Small Modern agents operate inside agent harnesses that manage tools, context, and control flow, making the harness a critical part of the agent system. Our original Agent Lightning introduced a disaggregated architecture that connects arbitrary agents to RL training through an LLM endpoint proxy, an approach later adopted by frameworks such as verl Uni-Agent, AReaL 2.0, slime, and Polar. We refer to this paradigm as harnessed agentic RL, where the deploy-time harness directly participates in model post-training. Harnessed agentic RL differs fundamentally from traditional agentic RL: the harness, rather than the training engine, owns the environment interaction loop, while the trainer observes only sequences of LLM request-response pairs. This introduces challenges in retokenization, sample merging, advantage calculation, loss normalization, and backend scheduling, which can substantially affect training stability and effectiveness. We present Agent Lightning v1.0, a lightweight framework for harnessed agentic RL implemented in approximately 3,500 lines of code. It supports arbitrary agent harnesses and serves as a practical testbed for studying these challenges. We evaluate it on instruction-following, search, and coding agents, and provide a complete reproducible pipeline for coding-agent RL. Using only 6K training examples and modest compute, RL improves Qwen3.5-9B on SWE-bench Verified from 41.8% to 56.4%, a 14.6-point absolute gain. We release the complete workflow and training scripts to facilitate reproducible research on harnessed agentic RL.', 'score': 16, 'issue_id': 3042, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': 'ab86581c8e00a8c5', 'authors': ['Zhiyuan He', 'Siwei Zhang', 'Zhiwen Zhou', 'Yuqing Yang', 'Yu Kang', 'Yuge Zhang', 'Luna K. Qiu', 'Tin Yan Tsui', 'Jiahang Xu', 'Chong Luo'], 'affiliations': ['Fudan University', 'Microsoft', 'University of Edinburgh', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.17528.jpg', 'data': {'categories': ['#training', '#agents', '#rl', '#plp'], 'emoji': '⚡', 'ru': {'title': 'Агенты с подкреплением в управляемых оболочках: эффективное обучение с минимумом данных', 'desc': "Статья представляет Agent Lightning v1.0 — фреймворк для обучения с подкреплением агентов, которые работают внутри специализированных оболочек управляющих инструментами и потоком выполнения. Авторы вводят парадигму 'harnessed agentic RL', где оболочка агента напрямую участвует в постобучении модели, что отличается от традиционного подхода тем, что оболочка владеет циклом взаимодействия с окружением. Фреймворк решает критические проблемы переконизации, слияния выборок, вычисления преимуществ и нормализации потерь, обеспечивая стабильность обучения. На примере кодирующего агента авторы демонстрируют значительное улучшение производительности модели Qwen3.5-9B на SWE-bench Verified с 41.8% до 56.4% при использовании только 6K примеров обучения."}, 'en': {'title': 'Revolutionizing Reinforcement Learning with Agent Lightning v1.0', 'desc': 'Agent Lightning v1.0 is a framework designed to enhance reinforcement learning (RL) for various agent harnesses, improving their performance with limited data and computational resources. It introduces a new approach called harnessed agentic RL, where the agent harness manages the interaction with the environment, differing from traditional methods where the training engine handles this. This framework addresses several challenges such as retokenization and loss normalization, which are crucial for maintaining training stability. By evaluating it on coding agents, the framework demonstrates significant performance improvements, showcasing its potential for reproducible research in RL.'}, 'zh': {'title': '提升编码代理性能的强化学习新框架', 'desc': 'Agent Lightning v1.0 是一个用于可重复强化学习的框架，能够显著提高编码代理的性能，所需的数据和计算资源极少。该框架采用了一种分离架构，通过 LLM 端点代理将任意代理连接到强化学习训练中。与传统的代理强化学习不同，Agent Lightning 的设计使得代理的环境交互循环由代理工具管理，而训练者仅观察 LLM 请求-响应对的序列。这种方法引入了一些挑战，如重标记、样本合并和损失归一化等，但也为编码代理的强化学习提供了有效的解决方案。'}}}, {'id': 'https://huggingface.co/papers/2608.17067', 'title': 'DiSCO: Defending text-to-image generation through distribution-guided contrastive prompt optimization', 'url': 'https://huggingface.co/papers/2608.17067', 'abstract': "Abstract DiSCO is a black-box, zero-shot prompt-level defense that uses distribution-guided suffix expansion and contrastive scoring to reduce harmful image generation without altering the model.  Generated by thinkingmachines/Inkling-Small As text-to-image generative models advance, they raise critical safety concerns, particularly the generation of Not-Safe-For-Work (NSFW) content such as violence and nudity, further exacerbated by red-teaming adversarial attacks. Existing defenses predominantly operate under white-box assumptions, relying on text encoder optimization, weight editing, or inference-time intervention, and fundamentally cannot scale to proprietary models. Black-box alternatives based on LLM prompt rewriting offer broader applicability, yet fail in a critical regime we identify as the benign adversarial problem: prompts that are linguistically safe but still trigger harmful generation due to the model's learned data distribution. We propose DiSCO, a zero-shot, strictly black-box defense that operates entirely at the prompt level as a plug-and-play module, requiring no model retraining, fine-tuning, or access to model internals. DiSCO performs distribution-guided suffix expansion via beam search, optimized through contrastive scoring over safe and unsafe image pools generated by the target model itself, with iterative adaptive feedback until safe content is produced. We demonstrate that DiSCO consistently enhances the safety of both undefended and defended models on the I2P benchmark under multiple red-teaming attacks, achieving 37.7% and 25.13% ASR reduction, respectively, while maintaining semantic fidelity and improving image coherence. As a black-box, architecture-agnostic module, DiSCO can be readily applied to any text-to-image system without necessitating any changes to the model itself.", 'score': 15, 'issue_id': 3047, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '2b2d2173fc54761c', 'authors': ['Tong Zhang', 'Motasem Alfarra', 'Carlos Hinojosa', 'Christos Louizos', 'Bernard Ghanem'], 'affiliations': ['King Abdullah University of Science and Technology (KAUST)', 'Qualcomm AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.17067.jpg', 'data': {'categories': ['#security', '#ethics'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность текстово-изобразительных моделей через контрастивную оптимизацию подсказок', 'desc': 'DiSCO — это защита на уровне подсказок, которая работает как чёрный ящик без обучения модели. Она использует распределительно-управляемое расширение суффиксов и контрастивную оценку для снижения генерации вредоносного контента в текстово-изобразительных моделях. Метод решает проблему доброкачественных противоборствующих атак — безопасных по форме подсказок, которые всё равно вызывают нежелательный результат из-за особенностей обучающих данных. DiSCO улучшает безопасность моделей на бенчмарке I2P, снижая вероятность атак на 37,7%, при этом сохраняя семантическую верность и не требуя доступа к внутренним параметрам модели.'}, 'en': {'title': 'Enhancing Safety in Image Generation with DiSCO', 'desc': "DiSCO is a novel defense mechanism designed to enhance the safety of text-to-image generative models without needing to modify the underlying model. It operates in a black-box manner, meaning it does not require access to the model's internal workings, making it applicable to various proprietary systems. The method employs distribution-guided suffix expansion and contrastive scoring to filter out harmful content while preserving the intended meaning of prompts. By iteratively refining prompts based on feedback from generated images, DiSCO effectively reduces the generation of unsafe content, achieving significant improvements in safety metrics across different models."}, 'zh': {'title': 'DiSCO：黑箱防御，确保生成图像安全', 'desc': 'DiSCO是一种黑箱、零-shot的提示级防御方法，旨在减少有害图像生成，而无需改变模型本身。它通过分布引导的后缀扩展和对比评分来优化生成的内容，确保生成的图像安全。与现有的白箱防御方法不同，DiSCO不需要对模型进行重训练或微调，适用于各种文本到图像的生成系统。实验表明，DiSCO在多个红队攻击下显著提高了模型的安全性，同时保持了语义一致性和图像连贯性。'}}}, {'id': 'https://huggingface.co/papers/2608.13556', 'title': 'V-RAE: Rethinking Video Latent Spaces for Generation', 'url': 'https://huggingface.co/papers/2608.13556', 'abstract': 'Abstract V-RAE constructs semantically organized video latents from frozen vision representations to improve generation quality, convergence speed, and predictive modeling.  Generated by thinkingmachines/Inkling-Small Latent video generation relies on autoencoders to define a compact space in which generative models operate. Although video autoencoder architectures have evolved substantially, their latent spaces are still optimized primarily for pixel-level reconstruction and provide limited high-level semantic organization. A reconstruction-optimal latent space, however, need not be well suited to generative modeling. We propose V-RAE, a video representation autoencoder that builds compact generative latents on top of frozen vision foundation model representations. A lightweight temporal pooling module removes temporal redundancy while preserving semantic structure, and a video decoder reconstructs continuous motion from the compressed features. We evaluate V-RAE with four representative frozen encoders on video reconstruction, semantic probing, and class-conditional generation. V-RAE achieves 2.13 rFVD on K600, outperforming all evaluated large-scale pretrained video VAEs. Its latents retain substantially more semantic information than conventional video tokenizer latents. Under matched generation settings, our best variant achieves gFVD scores of 117.86 and 19.16 on UCF101 and K600, respectively, while converging up to 6x faster}. We further show that reconstruction quality alone is insufficient to characterize generative utility and introduce tFVD, a temporal-coherence diagnostic that correlates more reliably with downstream generation quality. Beyond video generation, V-RAE also improves future video prediction on Cityscapes over the Wan 2.2 VAE latent space under matched prediction settings. Taken together, the experiments show that frozen semantic representations can support video reconstruction, generation, and predictive modeling. The project page: https://v-rae.github.io/.', 'score': 15, 'issue_id': 3048, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '8f73ffe4a80c5e57', 'authors': ['Minghui Guo', 'Shengqiong Wu', 'Hao Fei'], 'affiliations': ['National University of Singapore', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.13556.jpg', 'data': {'categories': ['#benchmark', '#video', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Семантическое латентное пространство для генерации видео через замороженные представления', 'desc': 'V-RAE — это видеоавтокодировщик, который строит компактное латентное пространство для генеративных моделей на основе замороженных представлений моделей компьютерного зрения. Авторы показали, что оптимизация автокодировщика только для восстановления пикселей не гарантирует хорошие свойства латентного пространства для генерации видео. Предложенный метод использует легкий модуль временного объединения для удаления временной избыточности и сохранения семантической структуры, а затем восстанавливает непрерывное движение из сжатых признаков. V-RAE достигает лучших результатов в генерации видео, сходится в 6 раз быстрее и лучше сохраняет семантическую информацию по сравнению с существующими видеокодировщиками.'}, 'en': {'title': 'V-RAE: Enhancing Video Generation with Semantic Latents', 'desc': 'The paper introduces V-RAE, a video representation autoencoder that enhances video generation by utilizing frozen vision representations. It constructs a compact latent space that organizes video data semantically, improving both the quality of generated videos and the speed of model convergence. V-RAE employs a lightweight temporal pooling module to eliminate redundancy while maintaining important semantic features, allowing for better reconstruction of motion. The results demonstrate that V-RAE outperforms existing video autoencoders in terms of semantic retention and generative performance, while also providing a new metric for evaluating temporal coherence in video generation.'}, 'zh': {'title': 'V-RAE：提升视频生成与预测的自编码器', 'desc': 'V-RAE是一种视频表示自编码器，它利用冻结的视觉基础模型表示来构建紧凑的生成潜在空间，从而提高生成质量和收敛速度。该模型通过轻量级的时间池模块去除时间冗余，同时保留语义结构。V-RAE在视频重建、语义探测和类别条件生成方面进行了评估，结果显示其在K600数据集上表现优异，超越了所有评估的大规模预训练视频自编码器。实验表明，冻结的语义表示可以有效支持视频的重建、生成和预测建模。'}}}, {'id': 'https://huggingface.co/papers/2608.17566', 'title': 'CoinVE-200K: A Large-Scale High-Quality Dataset for Compositional Instruction-Guided Video Editing', 'url': 'https://huggingface.co/papers/2608.17566', 'abstract': 'Abstract A new dataset, benchmark, and 22B model enable compositional instruction-guided video editing with multi-region attention and temporal coherence.  Generated by thinkingmachines/Inkling-Small The quality and diversity of instruction-based video editing datasets are steadily improving, yet existing datasets mainly focus on single editing operations and fall short in supporting compositional instruction-guided video editing. In particular, multiple editing intents must be jointly understood and faithfully executed within the same video. To address this issue, we introduce CoinVE-200K, a large-scale, high-quality dataset for Compositional Instruction-Guided Video Editing. CoinVE-200K contains 1080p video-editing pairs of up to 201 frames, covering diverse compositional scenarios where each sample involves 2 to 5 atomic editing operations. The instructions target humans, objects, and backgrounds, and cover edit types such as addition, removal, modification, and stylization. All samples are built through a carefully designed generation and filtering pipeline to ensure instruction faithfulness, visual quality, temporal consistency, and compositional diversity. We also introduce CoinVE-Bench, a benchmark for compositional-instruction video editing across diverse subjects, operation types, and instruction complexities. Furthermore, we present CoinVE-Edit, a 22B compositional video editing model built upon Wan2.1-T2V-14B and Qwen3-VL-8B-Instruct. CoinVE-Edit disentangles region-aware attention for different editing instructions, enabling precise multi-region editing while preserving irrelevant content and temporal coherence. Experiments on CoinVE-Bench show that CoinVE-Edit achieves strong performance in instruction following, compositional editing accuracy, visual quality, and temporal consistency.', 'score': 13, 'issue_id': 3044, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '4ea6efbe6647371d', 'authors': ['Fuchen Long', 'Cong Wang', 'Zitao Gao', 'Wenhao Zhong', 'Yu Cheng', 'Xiaolu Hou', 'Yan Li', 'Xiao Cao', 'Xinlong Sun', 'Xi Chen', 'Yu Liu'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.17566.jpg', 'data': {'categories': ['#dataset', '#video', '#benchmark', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Композитное редактирование видео через многорегиональное внимание и семантическую разложимость', 'desc': 'Представлена новая методика для композитного редактирования видео на основе инструкций, которая позволяет одновременно выполнять несколько операций редактирования в одном видео. Авторы создали набор данных CoinVE-200K с 200 тысячами видео высокого качества, содержащих от 2 до 5 атомарных операций редактирования, таких как добавление, удаление и стилизация объектов. Предложена модель CoinVE-Edit на базе архитектур Wan2.1 и Qwen3-VL, использующая механизм многорегионального внимания для точного редактирования разных областей видео с сохранением временной согласованности. Разработан бенчмарк CoinVE-Bench для оценки качества композитного редактирования по различным критериям: следование инструкциям, точность редактирования и консистентность во времени.'}, 'en': {'title': 'Revolutionizing Video Editing with Compositional Instructions', 'desc': 'This paper presents a new dataset called CoinVE-200K, which is designed for compositional instruction-guided video editing. It includes high-quality video-editing pairs that allow for multiple editing operations to be performed simultaneously, addressing the limitations of existing datasets that focus on single operations. The CoinVE-Edit model, built on advanced architectures, utilizes multi-region attention to ensure that different editing instructions are executed accurately while maintaining the overall coherence of the video. The results demonstrate that this model excels in following complex instructions and producing visually appealing edits with temporal consistency.'}, 'zh': {'title': '复合指令引导的视频编辑新突破', 'desc': '本文介绍了一个新的数据集CoinVE-200K和基准CoinVE-Bench，旨在支持复合指令引导的视频编辑。该数据集包含1080p的视频编辑对，涵盖多种编辑场景，每个样本涉及2到5个基本编辑操作。我们提出的CoinVE-Edit模型利用22B参数，能够实现区域感知的多区域编辑，同时保持时间一致性和视觉质量。实验结果表明，CoinVE-Edit在指令遵循、编辑准确性和视觉质量等方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.15454', 'title': 'Dynamic Multi-Byte Prediction With Hierarchical Language Models', 'url': 'https://huggingface.co/papers/2608.15454', 'abstract': 'Abstract Multi-byte prediction accelerates byte-level hierarchical language models by generating parallel bytes via variable-length windows and causal attention masking, improving inference speed with minimal quality loss.  Generated by thinkingmachines/Inkling-Small Byte-level hierarchical language models (LMs) have recently emerged as a robust alternative to their popular counterparts that use subword tokenization. However, generating one byte at a time remains a bottleneck for inference speed. To address this, we introduce multi-byte prediction (MBP), which generates multiple bytes in parallel, speeding up inference with minimal performance impact and no additional parameters. MBP builds on the popular multi-token prediction (MTP) paradigm with two crucial innovations. First, we introduce a variable-length prediction window that aligns with the latent tokens, or segments, of a hierarchical LM. Second, we implement a novel attention-masking scheme that enables parallel byte prediction without violating causality. We show that multi-byte prediction strikes a Pareto-optimal trade-off across multiple generative tasks, instruction following, question answering, summarization, and machine translation, achieving the best trade-off between performance and inference throughput.', 'score': 13, 'issue_id': 3040, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '765aedd22867b35f', 'authors': ['Abraham Toluwase Owodunni', 'Chibuzor Okocha', 'Christan Grant', 'Tomasz Limisiewicz', 'Sachin Kumar'], 'affiliations': ['The Ohio State University', 'University of Florida', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15454.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Параллельная генерация байтов для ускорения языковых моделей без потери качества', 'desc': 'В статье предлагается метод мультибайтового предсказания (MBP) для ускорения байт-уровневых иерархических языковых моделей. Метод генерирует несколько байтов параллельно с помощью переменных окон предсказания и специальной маски внимания, которая сохраняет причинность. Подход основан на парадигме мультитокенного предсказания (MTP) и не требует дополнительных параметров модели. Экспериментальные результаты показывают оптимальный баланс между качеством вывода и скоростью инференса на различных задачах генерации, вопрос-ответных систем и машинного перевода.'}, 'en': {'title': 'Speed Up Language Models with Multi-Byte Prediction!', 'desc': 'This paper presents a method called multi-byte prediction (MBP) to enhance the efficiency of byte-level hierarchical language models. By generating multiple bytes simultaneously using a variable-length prediction window and a causal attention masking technique, MBP significantly speeds up inference without compromising quality. The approach builds on existing multi-token prediction methods and introduces innovations that allow for parallel processing while maintaining the necessary causal relationships in language generation. The results demonstrate that MBP achieves an optimal balance between performance and inference speed across various tasks such as instruction following and machine translation.'}, 'zh': {'title': '多字节预测：加速语言模型的创新之路', 'desc': '多字节预测（MBP）通过生成并行字节来加速字节级层次语言模型的推理速度，且仅有最小的质量损失。该方法解决了逐字节生成的瓶颈问题，允许在不增加额外参数的情况下同时生成多个字节。MBP结合了可变长度的预测窗口和新颖的注意力掩蔽机制，确保了因果性不被破坏。实验表明，MBP在多个生成任务中实现了性能与推理吞吐量之间的最佳平衡。'}}}, {'id': 'https://huggingface.co/papers/2608.15008', 'title': 'Harness the Memory: A Holistic Evaluation of Memory Substrates in Memory Agents', 'url': 'https://huggingface.co/papers/2608.15008', 'abstract': 'Abstract Empirical evaluation of diverse memory substrates for long-horizon LLM agents reveals regime-dependent trade-offs, motivating adaptive substrate routing for reliable agent memory.  Generated by thinkingmachines/Inkling-Small Memory is becoming core infrastructure for long-horizon LLM agents, yet existing evaluations offer limited guidance on which memory substrate, namely the underlying medium in which memory is represented and stored, should be used under different operating regimes. We present a controlled harness evaluation of memory substrates for memory-augmented agents, covering dense and sparse indices, text records, structural stores, hierarchical stores, refinement-based memories, parametric updates, and activation-compatible context mechanisms. Across three backbone models and four benchmark suites spanning user-centric question answering and agent-centric decision-making, we instrument 26 performance and efficiency metrics under a unified harness. Our results show that no single substrate consistently dominates: broad retrieval benefits long-context factual QA, while excessive retrieval can harm sequential decision-making by shifting attention away from action-critical context. Scalability introduces a further routing axis, as substrates that perform well at moderate history lengths can become costly or brittle at longer horizons. These findings motivate substrate routing as a necessary component of adaptive agent memory systems and provide empirical guidance for designing efficient, reliable, and regime-aware long-term memory for LLM agents. Code will be made available upon acceptance.', 'score': 11, 'issue_id': 3041, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': '564de84deeca5556', 'authors': ['Wei-Chieh Huang', 'Weizhi Zhang', 'Yuchen Wu', 'Yankai Chen', 'Eric Hanchen Jiang', 'Wooseong Yang', 'Yiwei Yang', 'Henry Peng Zou', 'Hanrong Zhang', 'Ying Nian Wu', 'Haolun Wu', 'Kai-Wei Chang', 'Philip S. Yu', 'Xue Liu', 'Aylin Caliskan'], 'affiliations': ['MBZUAI', 'McGill University', 'University of California, Los Angeles', 'University of Illinois Chicago', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2608.15008.jpg', 'data': {'categories': ['#long_context', '#agents', '#benchmark', '#open_source', '#dataset'], 'emoji': '🧠', 'ru': {'title': 'Адаптивная маршрутизация памяти для надёжных долгосрочных LLM-агентов', 'desc': 'В этой работе исследуются различные способы организации памяти для LLM-агентов, работающих на длинных горизонтах принятия решений. Авторы провели комплексное тестирование множества архитектур памяти — от плотных и разреженных индексов до иерархических хранилищ и параметрических обновлений — на трёх основных моделях и четырёх наборах бенчмарков. Результаты показывают, что нет универсального решения: для факт-ориентированных задач вопросно-ответного типа выгодна обширная выборка, а для принятия последовательных решений она может быть вредна, отвлекая внимание от критически важного контекста. Исследование подчеркивает необходимость адаптивной маршрутизации выбора памяти в зависимости от режима работы агента.'}, 'en': {'title': 'Adaptive Memory Routing for Enhanced LLM Performance', 'desc': "This paper evaluates different memory types for long-horizon large language model (LLM) agents to understand their effectiveness in various situations. It examines various memory substrates, such as dense and sparse indices, and how they impact performance in tasks like question answering and decision-making. The study finds that no single memory type is best for all scenarios; some are better for retrieving information while others are more suited for maintaining focus on important actions. The authors suggest that adaptive routing of memory types is essential for improving the reliability and efficiency of LLM agents' long-term memory systems."}, 'zh': {'title': '自适应记忆系统：优化长时间跨度的记忆基质', 'desc': '本论文探讨了长时间跨度的语言模型（LLM）代理的记忆基础设施，评估了不同记忆基质在不同操作模式下的表现。研究表明，没有单一的记忆基质在所有情况下都表现最佳，广泛的检索对长上下文的事实问答有利，但过度检索可能会影响顺序决策。论文还指出，记忆基质的可扩展性在历史长度较长时可能会导致成本增加或性能下降。基于这些发现，提出了自适应记忆系统中基质路由的重要性，以设计高效、可靠且适应不同操作模式的长期记忆。'}}}, {'id': 'https://huggingface.co/papers/2608.17402', 'title': 'MoE-ViE: Mixture of Experts Vision Encoder for Efficient Image and Video Understanding', 'url': 'https://huggingface.co/papers/2608.17402', 'abstract': 'Abstract Mixture-of-Experts vision encoders with fine-grained topologies, auxiliary-loss-free balancing, and specialized kernels scale efficiently while outperforming larger dense models on image and video tasks.  Generated by thinkingmachines/Inkling-Small Vision encoders are a critical component of vision-language models, and scaling their capacity effectively improves performance. However, dense scaling increases compute cost and inference latency. Mixture-of-Experts (MoE) architectures offer a compelling alternative, having enabled efficient scaling in LLMs, yet the MoE design space for CLIP-style vision encoders remains underexplored at State-of-the-Art (SOTA) levels. In this work, we systematically study MoE designs for vision encoder scaling and find that fine-grained MoE topologies yield substantial gains over both dense and standard MoE counterparts. We further propose an auxiliary-loss-free balancing variant for better expert utilization, and design a specialized MoE kernel to mitigate inference latency overhead. To enhance video capabilities while preserving image knowledge, we introduce frame-level distillation paired with a novel freezing mechanism. We pretrain a series of Mixture-of-Experts Vision Encoders (MoE-ViE) across a range of sizes, all consistently outperforming their dense counterparts. Our largest model matches the zero-shot performance of a SOTA encoder 1.7x its size at 76% of its latency. When aligned with an LLM, MoE-ViE surpasses all compared encoders on image and video benchmarks, including those with up to 5x more activated parameters. Code is available at https://github.com/facebookresearch/moe_vie.', 'score': 10, 'issue_id': 3046, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '3026151011c53698', 'authors': ['Bonan Zhang', 'Shiyu Dong', 'Quan Hung Tran', 'Katharina Gschwind', 'Shuqi Yang', 'Sijia Chen', 'Adel Ahmadyan', 'Seungwhan Moon', 'Lu Zhang', 'Ahmed Kirmani', 'Babak Damavandi', 'Anuj Kumar'], 'affiliations': ['Meta'], 'pdf_title_img': 'assets/pdf/title_img/2608.17402.jpg', 'data': {'categories': ['#video', '#inference', '#cv', '#multimodal', '#training', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Эффективное масштабирование vision-энкодеров через смесь экспертов', 'desc': 'Работа посвящена разработке Vision Encoders на основе архитектуры Mixture-of-Experts (MoE) для эффективного масштабирования моделей компьютерного зрения. Авторы систематически исследуют различные топологии MoE и предлагают вспомогательный механизм балансировки экспертов без вспомогательных потерь, а также специализированное ядро для снижения задержки инференса. Разработана техника дистилляции на уровне кадров для сохранения знаний о статических изображениях при адаптации к видео-задачам. Предложенные MoE-ViE модели превосходят плотные сети сопоставимого размера и показывают конкурентные результаты с моделями в 1,7 раза больше при значительном снижении вычислительных затрат.'}, 'en': {'title': 'Efficient Vision Encoding with Mixture-of-Experts', 'desc': 'This paper explores the use of Mixture-of-Experts (MoE) architectures in vision encoders, which are essential for vision-language models. The authors demonstrate that fine-grained MoE topologies can significantly enhance performance while being more efficient than larger dense models. They introduce an auxiliary-loss-free balancing method to improve expert utilization and a specialized kernel to reduce latency during inference. The results show that their MoE-ViE models consistently outperform traditional dense models in image and video tasks, achieving high performance with lower computational costs.'}, 'zh': {'title': '混合专家架构：高效视觉编码的新选择', 'desc': '这篇论文探讨了混合专家（MoE）架构在视觉编码器中的应用，提出了一种高效的扩展方法。研究表明，细粒度的MoE拓扑结构在图像和视频任务中表现优于传统的密集模型。为了提高专家的利用率，论文还提出了一种无辅助损失的平衡变体，并设计了专门的MoE内核以减少推理延迟。通过对一系列MoE视觉编码器的预训练，结果显示这些模型在性能上超越了同类的密集模型。'}}}, {'id': 'https://huggingface.co/papers/2608.18076', 'title': 'From Corpora to Co-Evolving Capabilities: Capability-Centric Data Design for Generalist Image Generation', 'url': 'https://huggingface.co/papers/2608.18076', 'abstract': 'Abstract A capability-driven data infrastructure with curriculum scheduling and specialized data engines trains large multimodal diffusion models on curated heterogeneous supervision for diverse generative tasks.  Generated by thinkingmachines/Inkling-Small Large-scale image generation has benefited from advances in data scale, quality, rebalancing, and recaptioning, yet conventional pipelines typically optimize task-specific datasets in isolation. A central challenge is not only how to curate each task-specific corpus, but also how to organize heterogeneous supervision according to the dependencies among generative capabilities. We present a capability-driven data infrastructure that couples capability-specific supervision construction with capability-aligned curriculum scheduling. Its three specialized yet interoperable data engines build complementary relational supervision for text-image grounding, inter-image transformation, and image-knowledge association, while caption experts align T2I and editing supervision across tasks and granularities. A multi-stage curriculum jointly evolves task composition, visual-concept distribution, data quality, and image resolution along the dependency order of capability acquisition, with capability-aware evaluation closing the loop through targeted retrieval, expert construction, and gap-aware resampling. At scale, the framework curates a 440M-image T2I corpus, 120M editing pairs, and over 27M image-entity pairs. With this infrastructure, we train multimodal diffusion models at two scales from scratch, with 3B and 6B sizes respectively. We conduct quantitative evaluation on CPI-Bench, along with qualitative evaluations across diverse text-to-image and editing scenarios. Experimental results present broad visual coverage, versatile rendering, and effective transfer across generative capabilities.', 'score': 9, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '1c806ab764b141f1', 'authors': ['Xingjian Wang', 'Zhao Wang', 'Taihang Hu', 'Jun Zheng', 'Qing Jin', 'Qinye Zhou', 'Zhengtao Wu', 'Yongchao Du', 'Zuan Gao', 'Chao Lin', 'Yefeng Shen', 'Xiaoli Xu', 'Zhengze Xu', 'Hao Yan', 'Yuhang Yu', 'Mingzhou Zhang', 'Mengting Chen'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2608.18076.jpg', 'data': {'categories': ['#training', '#synthetic', '#multimodal', '#diffusion', '#data', '#optimization', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Управляемая возможностями инфраструктура данных для обучения диффузионных моделей', 'desc': 'Статья описывает инфраструктуру для подготовки данных, которая организует разнородные источники обучающей информации в соответствии с зависимостями между способностями модели. Авторы предлагают три специализированных движка обработки данных, которые создают дополнительные связанные данные для привязки текста к изображениям, трансформации между изображениями и связи изображений с внешними знаниями. Система использует многоэтапное curriculum learning, которое совместно развивает композицию задач, распределение визуальных концепций и качество данных в соответствии с порядком усвоения способностей. На основе этой инфраструктуры авторы подготовили массивный датасет из 440 млн изображений для text-to-image и обучили большие диффузионные модели размером 3B и 6B параметров с улучшенными результатами по разнообразию и качеству генерации.'}, 'en': {'title': 'Empowering Generative Models with Capability-Driven Data Infrastructure', 'desc': 'This paper introduces a new data infrastructure designed to enhance the training of large multimodal diffusion models for various generative tasks. It emphasizes a capability-driven approach that organizes data based on the dependencies of generative capabilities, allowing for better supervision across different tasks. The framework includes specialized data engines that create complementary supervision for tasks like text-image grounding and image editing, while a multi-stage curriculum optimizes the training process. The results demonstrate significant improvements in visual coverage and versatility in rendering across diverse applications.'}, 'zh': {'title': '能力驱动的数据基础设施，提升多模态生成能力', 'desc': '本文提出了一种以能力为驱动的数据基础设施，结合了能力特定的监督构建和能力对齐的课程调度，旨在训练大型多模态扩散模型。该基础设施通过三个专业的数据引擎，构建了互补的关系监督，支持文本-图像对齐、图像间转换和图像-知识关联等任务。通过多阶段课程的演变，优化了任务组合、视觉概念分布、数据质量和图像分辨率，确保了能力获取的依赖顺序。实验结果显示，该框架在生成能力的广泛视觉覆盖、灵活渲染和有效转移方面表现出色。'}}}, {'id': 'https://huggingface.co/papers/2608.17800', 'title': 'StartupBench: Benchmarking General-Purpose Agents on Market-Validated End-to-End Workflows', 'url': 'https://huggingface.co/papers/2608.17800', 'abstract': 'Abstract StartupBench evaluates end-to-end AI agents on real-world startup workflows and reveals that even top models complete only about 30% of tasks, highlighting gaps in instruction following and domain expertise.  Generated by thinkingmachines/Inkling-Small Recent advances in Large Language Models(LLMs) and agents have substantially improved the ability of AI systems to execute complex tasks. Yet existing benchmarks largely rely on researcher-selected tasks, leaving uncertain whether such progress extends to the work that real-world users actually demand from AI systems. We introduce StartupBench, an E2E agent benchmark grounded in market-validated AI startup products. Rather than defining tasks from pre-defined assumptions about useful agent capabilities, we systematically study AI products with demonstrated adoption, together with their product workflows and users, to identify real-world tasks for which AI has established practical demand across diverse professional domains. We translate these workflows into complete deliverable-oriented tasks and evaluate them with fine-grained rubrics capturing their complex requirements. Across representative models evaluated under a unified agent harness, even the strongest model successfully completes only approximately 30\\% of StartupBench, despite making substantial partial progress on many tasks. Further analysis identifies aspects like complex instruction following and domain-specific expertise as major sources of failure. Our results reveal that many market-validated workflows remain beyond the reliable capabilities of current general-purpose agents, establishing StartupBench as an empirical measure of progress toward E2E completions of real-world user tasks.', 'score': 8, 'issue_id': 3041, 'pub_date': '2026-08-18', 'pub_date_card': {'ru': '18 августа', 'en': 'August 18', 'zh': '8月18日'}, 'hash': '0367b6e747c38770', 'authors': ['Liya Zhu', 'Xin Ma', 'Tao Liu', 'Haodong Wang', 'Ge Zhang', 'Jingzhe Ding', 'Qingshui Gu', 'Yongjie Zhong', 'Jinxiang Meng', 'Yuan Gao', 'Yunqiu Zhou', 'Hao Zhu', 'Jifeng He', 'Yongzhi Liao', 'Xinyi Zhang', 'Chaoxin Li', 'Yi Zhu', 'Xi Lin', 'Duju Zeng', 'Xiang Gao', 'Wen Zhang', 'Yunyang Wang', 'Duo Wang', 'Huan Zhou', 'Zuo Wang', 'Jin Chen', 'Kaiyuan Zhang', 'Chuqian Yu', 'Tianhao Yu', 'Longxiang Liu', 'Jianbo Xue', 'Huimin Che', 'Jiahao Wang', 'Yujia Qin', 'Jiaheng Liu', 'Shen Yan', 'Xiaolong Chang', 'Wenhao Huang'], 'affiliations': ['ByteDance Seed', 'M-A-P', 'Nanjing University', 'TokenWave.AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.17800.jpg', 'data': {'categories': ['#agents', '#benchmark', '#dataset'], 'emoji': '🚀', 'ru': {'title': 'Настоящие задачи требуют большего: реальный мир выявляет пределы возможностей AI агентов', 'desc': 'StartupBench — это бенчмарк для оценки end-to-end AI агентов на реальных рабочих процессах стартапов, основанный на анализе существующих продуктов с установленной пользовательской базой. Исследователи перевели реальные рабочие потоки в задачи ориентированные на результаты и оценили их с помощью детальных критериев, отражающих сложные требования. Результаты показали, что даже лучшие доступные LLM модели успешно завершают только около 30% задач, что указывает на серьёзные пробелы в архитектуре текущих агентов. Анализ выявил, что основные причины неудач — это сложное следование инструкциям и отсутствие специализированных знаний в конкретных предметных областях.'}, 'en': {'title': 'Bridging the Gap: Evaluating AI Agents in Real-World Workflows', 'desc': 'The paper introduces StartupBench, a benchmark designed to evaluate AI agents on real-world startup workflows. It highlights that even the best AI models only complete about 30% of the tasks, indicating significant limitations in their ability to follow complex instructions and demonstrate domain expertise. The study emphasizes the importance of using market-validated tasks rather than researcher-selected ones to assess AI capabilities. By translating actual workflows into measurable tasks, StartupBench provides a clearer picture of the current state of AI performance in practical applications.'}, 'zh': {'title': '评估 AI 代理在真实世界中的能力', 'desc': 'StartupBench 是一个评估 AI 代理在真实创业工作流程中表现的基准。研究发现，即使是最先进的模型也只能完成大约 30% 的任务，这表明在指令遵循和领域专业知识方面存在明显的不足。该基准通过分析市场上已验证的 AI 产品，识别出真实世界中 AI 需要解决的任务，并将这些工作流程转化为可交付的任务进行评估。结果显示，当前通用代理在许多市场验证的工作流程中仍然无法可靠地完成任务，突显了 AI 系统在实际应用中的局限性。'}}}, {'id': 'https://huggingface.co/papers/2608.05811', 'title': 'Energy-Guided Flow Matching', 'url': 'https://huggingface.co/papers/2608.05811', 'abstract': 'Abstract Energy-Guided Flow Matching improves generative quality by progressively revealing high-frequency details through a moving endpoint and adaptive scheduling, reducing training cost and achieving state-of-the-art FID scores.  Generated by thinkingmachines/Inkling-Small Pixel-space generative models bypass lossy latent compression, yet necessitate joint learning of global structure and fine-grained details in a high-dimensional space. Standard flow matching interpolates noise toward a fixed clean-image endpoint, leaving the spectral evolution to be learned implicitly. In this paper, we introduce Energy-Guided Flow Matching(EG-FM) that explicitly models a coarse-to-fine generative trajectory by moving endpoint. Specifically, EG-FM replaces the fixed endpoint with a heat-kernel-filtered endpoint that evolves smoothly from low-frequency image to clean image. The fraction of high-frequency signal in moving endpoint is released by an image-specific energy-guided scheduling, leading to the re-targeting of velocity in flow matching. Our framework requires no adaptation of the backbone and training data, bringing negligible cost on the training and inference stages. In our experiment, EG-FM consistently achieves lower FID on the ImageNet class-conditional image generation task at 256 times 256 with fewer epochs, reaching an FID of 1.55 at 200 epochs and 1.45 at 600 epochs. We continue training the generation task on the setting of 512 times 512 resolution, yielding a FID of 1.58 after only 40 high-resolution adaptation epochs. Furthermore, we transfer EG-FM on text-to-image generation and achieve 0.85 on GenEval score and 83.9 on DPG-Bench. Code is available at https://github.com/ysng123/EG-FM.', 'score': 8, 'issue_id': 3041, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'd94445fa284fc1bf', 'authors': ['Haoyang Tong', 'Yu He', 'Fang Li', 'Lichen Ma', 'Jingling Fu', 'Dong Chen', 'Zhen Chen', 'Junshi Huang', 'Jie Cao'], 'affiliations': ['JD.com', 'MAIS & NLPR, CASIA', 'Xian Jiaotong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05811.jpg', 'data': {'categories': ['#diffusion', '#open_source', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'От размытого к чёткому: энергетически управляемая генерация через движущуюся траекторию', 'desc': 'В работе предложен метод Energy-Guided Flow Matching (EG-FM), который улучшает качество генеративных моделей путём явного моделирования траектории генерации от гру
