    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.13356', 'title': 'ZGCM-1: A Fully Open and Extremely Efficient Foundation Model for Math and Agentic Search', 'url': 'https://huggingface.co/papers/2609.13356', 'abstract': 'Abstract ZGCM-1 is a 7B open foundation model that combines internal reasoning with external tool use, trained via efficient architecture-system co-design, progressive long-context scaling, and autonomous agent workflows to achieve strong reasoning and efficiency.  Generated by thinkingmachines/Inkling-Small In this work, we present ZGCM-1, a fully open 7B dense foundation model trained from scratch with extreme data, system, and algorithmic efficiency. ZGCM-1 is founded on a core premise: compact models cannot passively memorize the open web, but can overcome parametric capacity limits by coupling deliberate internal thinking with active external tool use. To support this paradigm across a 256K context, we develop an end-to-end, high-efficiency open training recipe: Architecture & System Co-design: interleaved gated sliding-window and full attention, and a stable FP8 Muon optimizer; Progressive Curriculum & MDP Mid-Training: context scaling across 16K, 64K, and 256K, and the reformulation of interaction traces into Markov Decision Processes. Furthermore, we establish an AI-native R&D workflow where agent swarms autonomously manage cluster operations, data curation, and rapid diagnostic evaluation. Extensive evaluations show that ZGCM-1-7B is competitive across 7B model family on general benchmarks. On several challenging mathematical reasoning and agentic search suites, it remains competitive with frontier models orders of magnitude larger, such as Qwen3-235B-A22B and GLM-5.1. We also show that our pre-training design offers a ~4.2x efficiency improvement in 16K pre-training time-to-loss. Across the full development lifecycle, we distill eight actionable empirical findings-spanning architectural scaling, SFT quality pruning, long-context generalization, and agentic co-training dynamics. To facilitate community research, we open-source model weights from the pre-training, mid-training, and post-training stages, intermediate checkpoints, training code, per-stage data and data recipes, and W&B logs.', 'score': 287, 'issue_id': 3276, 'pub_date': '2026-09-11', 'pub_date_card': {'ru': '11 сентября', 'en': 'September 11', 'zh': '9月11日'}, 'hash': '42a67e5a466223b7', 'authors': ['Jiyan He', 'Guang Liang', 'Hao Liu', 'Haoxiang Guan', 'Jinbo Sun', 'Junyi Guo', 'Wenjun Feng', 'Yantai Xie', 'Yifei Shen', 'Bin Shao', 'Chuyang Wei', 'Kai Chen', 'Kexin Zhou', 'Minghang Zhu', 'Shuxin Zheng', 'Tie-Yan Liu', 'Taine Zhao', 'Wenhui Zhu', 'Xueyin Xu', 'Xiaoqing Zhang', 'Yatao Li', 'Yuxuan Ren'], 'affiliations': ['Zhongguancun Academy', 'Zhongguancun Institute of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2609.13356.jpg', 'data': {'categories': ['#training', '#agents', '#reasoning', '#math', '#rag', '#architecture', '#open_source', '#benchmark', '#long_context', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Малая модель с большими способностями: мышление + инструменты = эффективность', 'desc': 'ZGCM-1 — это компактная 7-миллиардная языковая модель, которая преодолевает ограничения параметрического размера путём сочетания внутреннего рассуждения с использованием внешних инструментов. Модель обучена с экстремальной эффективностью через совместную оптимизацию архитектуры и системы, включая скользящее окно внимания и стабильный оптимизатор FP8. Прогрессивное расширение контекста от 16K до 256K токенов осуществляется через переформулировку взаимодействий в марковские процессы принятия решений. Результаты показывают, что ZGCM-1 конкурентна с моделями в 30+ раз больше на задачах математического рассуждения и агентного поиска, при этом обеспечивая 4.2x ускорение предварительного обучения.'}, 'en': {'title': 'Empowering Reasoning with Efficient Tool Use in ZGCM-1', 'desc': "ZGCM-1 is a 7 billion parameter open foundation model that integrates internal reasoning with the use of external tools to enhance its performance. It employs a unique training approach that combines efficient architecture design and progressive scaling of context length, allowing it to handle up to 256,000 tokens. The model's training process includes innovative techniques like interleaved attention mechanisms and the use of Markov Decision Processes for better interaction management. Evaluations demonstrate that ZGCM-1 performs competitively against much larger models in tasks requiring mathematical reasoning and agent-based search, while also achieving significant efficiency improvements in training time."}, 'zh': {'title': 'ZGCM-1：高效推理与工具结合的开源模型', 'desc': 'ZGCM-1是一个开源的7B基础模型，结合了内部推理和外部工具的使用，旨在提高推理能力和效率。该模型通过高效的架构与系统共同设计、逐步扩展长上下文和自主代理工作流进行训练。ZGCM-1的核心理念是，紧凑模型不能被动记忆开放网络，而是通过内部思考与外部工具的结合来克服参数容量限制。我们还建立了一个AI原生的研发工作流程，使代理群体能够自主管理集群操作、数据整理和快速诊断评估。'}}}, {'id': 'https://huggingface.co/papers/2609.15818', 'title': 'Atria Dawn: The Dawn of Agentic Superintelligence', 'url': 'https://huggingface.co/papers/2609.15818', 'abstract': 'Abstract Atria Dawn Preview is a foundation agentic language model trained through verified tool interactions that achieves strong benchmark results and demonstrates a shift toward human-AI project-level collaboration in scientific research.  Generated by thinkingmachines/Inkling-Small As AI agents become participants in the development of their successors, they reshape both the production of intelligence and the role of human researchers. We introduce Atria Dawn Preview, a foundation agentic language model designed for scientific research and engineering workflows, with the goal of expanding the frontier of agent productivity in the real world. This model is trained via a Verifiable Experience Pipeline that connects tool-mediated interactions to executable environments and externally verified outcomes. Across 16 benchmarks spanning real-world research, engineering, and digital work, Atria Dawn Preview is competitive with frontier agents and achieves the highest reported score on five of them. Beyond standalone performance, we examine the real research-and-development process behind this model as a case study of human--AI collaboration, analyzing 769 task records from 56 participants together with agent logs. When asked to evaluate completed tasks under comparable conditions, participants rated about one-third of completed AI-assisted tasks as infeasible without AI. More strikingly, agents frequently propose methods and implement revisions, while humans retain most final decisions and guide exploration through judgment and feedback. These observations indicate a shift from task-level execution to project-level partnership, with human effort concentrating on what is worth pursuing and how evidence should guide research. Progress toward more autonomous AI research must therefore advance both the capacity for discovery and the capacity for meaningful human oversight, preserving accountable human authority over the risks and direction of continued development.', 'score': 262, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '7fa4628d2cc6746c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#agents', '#benchmark'], 'emoji': '🤝', 'ru': {'title': 'От задач к партнёрству: AI-агенты как помощники в научных исследованиях', 'desc': 'Представлен Atria Dawn Preview — foundation модель языка с агентивными способностями, обученная через проверяемый конвейер взаимодействий с инструментами и внешней верификацией результатов. Модель демонстрирует конкурентные результаты на 16 бенчмарках научных и инженерных задач, достигая лучших показателей в пяти из них. Исследование реального процесса разработки показало, что примерно треть задач, выполненных с помощью AI, были бы невозможны без него, при этом агенты предлагают методы, а люди сохраняют контроль над ключевыми решениями. Работа демонстрирует переход от выполнения отдельных задач к проектному партнёрству человека и AI, где люди определяют стратегию исследования и обеспечивают ответственный надзор.'}, 'en': {'title': 'Empowering Human-AI Collaboration in Research', 'desc': 'Atria Dawn Preview is a new language model designed to assist in scientific research and engineering tasks. It uses a unique training method called the Verifiable Experience Pipeline, which connects AI interactions with real-world outcomes. The model has shown strong performance across various benchmarks, indicating its effectiveness in enhancing productivity in research projects. This paper highlights a shift towards collaboration between humans and AI, where AI not only assists but also proposes methods, while humans maintain oversight and decision-making authority.'}, 'zh': {'title': '人机合作，推动科学研究新纪元', 'desc': 'Atria Dawn Preview 是一种基础的智能语言模型，专为科学研究和工程工作流程设计。它通过可验证的工具交互进行训练，旨在提升智能体在现实世界中的生产力。该模型在16个基准测试中表现出色，尤其在五个测试中取得了最高分。研究表明，AI与人类的合作正在从任务执行转向项目级的伙伴关系，强调了人类在研究中的指导和决策作用。'}}}, {'id': 'https://huggingface.co/papers/2609.14858', 'title': 'Dream-RSI: Recursive Self-Improvement through Evolving Worlds', 'url': 'https://huggingface.co/papers/2609.14858', 'abstract': 'Abstract Dream-RSI enables scalable recursive self-improvement by using historical discovery replay to evaluate exploration policies offline, reducing costly online evaluations.  Generated by thinkingmachines/Inkling-Small Recursive self-improvement is becoming increasingly vital for autonomous AI agents, where progress hinges on discovering high-value solutions across complex domains. The driver of this process is effective exploration, however, managing and improving exploration strategies remains a major bottleneck. Current systems face a fundamental dilemma: fixed strategies fail to adapt as search spaces scale, while online policy optimization requires navigating vast meta-search spaces under delayed and expensive feedback over long-horizon rollouts. We introduce Dream-RSI, a framework for scalable and recursively self-improving exploration. A lightweight orchestration layer makes exploration explicit and programmable while leaving the underlying coding agent unchanged. Our key insight is that accumulated discovery history can serve as a replay simulator over the realized search space. By performing dreaming in the replay simulator constructed from historical discovery trees, Dream-RSI secures immediate, low-cost off-policy feedback to evaluate and refine exploration policies without invoking repetitive, expensive online evaluations. The improved policy is subsequently redeployed online to drive further discovery, continuously expanding the simulator pool in a self-improving loop. Across algorithm engineering, mathematical optimization, and GPU kernel engineering, Dream-RSI achieves competitive or improved discovery quality while substantially reducing discovery cost in several settings.', 'score': 248, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'ebaa307947b88fbe', 'authors': ['Tong Zheng', 'Xidong Wu', 'Zheng Zhang', 'Zhankui He', 'Chaoyi Zhang', 'Benjamin Coleman', 'Ruoqiao Wei', 'Di Bai', 'Haolin Liu', 'Rui Liu', 'Xue Wang', 'Yue Zhuan', 'Wang-Cheng Kang', 'Renkai Xiang', 'Heng Huang', 'Xinwu Cheng', 'Yunsong Guo'], 'affiliations': ['Google', 'Google Deepmind', 'University of Maryland, College Park', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2609.14858.jpg', 'data': {'categories': [], 'emoji': '🔄', 'ru': {'title': 'Самообучение через мечты о прошлых открытиях', 'desc': 'Dream-RSI — это框架 для масштабируемого рекурсивного самосовершенствования, который решает проблему оптимизации стратегий исследования в автономных AI агентах. Ключевая идея заключается в использовании истории прошлых открытий как симулятора для офлайн-оценки политик исследования, что позволяет избежать дорогостоящих онлайн-взаимодействий с окружением. Фреймворк реализует самоулучшающийся цикл: агент исследует пространство решений, накопленная история используется для обучения улучшенной политики, которая затем переразворачивается для дальнейших открытий. Метод демонстрирует конкурентные результаты в задачах оптимизации алгоритмов и GPU ядер при значительном снижении вычислительных затрат.'}, 'en': {'title': 'Dream-RSI: Revolutionizing Exploration with Historical Replay', 'desc': 'Dream-RSI is a framework designed to enhance the exploration capabilities of autonomous AI agents through recursive self-improvement. It utilizes historical discovery replay to evaluate exploration strategies offline, which minimizes the need for costly online evaluations. By leveraging accumulated discovery history as a replay simulator, Dream-RSI provides immediate feedback for refining exploration policies. This approach allows for continuous improvement and adaptation of exploration strategies, leading to better discovery outcomes at a lower cost.'}, 'zh': {'title': 'Dream-RSI：高效的自我改进探索框架', 'desc': 'Dream-RSI 是一种可扩展的递归自我改进框架，旨在通过历史发现重放来离线评估探索策略，从而减少昂贵的在线评估成本。该框架通过轻量级的协调层使探索过程变得明确和可编程，同时保持底层编码代理不变。Dream-RSI 的关键在于利用累积的发现历史作为重放模拟器，以便在实现的搜索空间中进行评估和优化探索策略。通过在重放模拟器中进行“梦境”操作，Dream-RSI 能够获得即时、低成本的离线反馈，从而不断改进探索策略。'}}}, {'id': 'https://huggingface.co/papers/2609.11638', 'title': 'Vidu S2: Real-Time Interactive, Editable, and Spatial Video Generation', 'url': 'https://huggingface.co/papers/2609.11638', 'abstract': 'Abstract Vidu S2 introduces real-time interactive avatar and video editing models that support high-resolution spatial video generation and dynamic reference updates.  Generated by thinkingmachines/Inkling-Small We present Vidu S2, which comprises Vidu S2-Avatar, a real-time interactive digital-character model, and Vidu S2-Editing, a real-time video editing model. Moreover, we explore the feasibility of real-time spatial video generation for both Vidu S2-Avatar and Vidu S2-Editing. Compared with Vidu S1, Vidu S2-Avatar supports real-time 720p video generation, generation with dynamic references that can be updated at any moment, and stronger instruction following, such as dancing. Vidu S2-Editing supports editing a video stream in real time, including style rendering, clothing replacement, character replacement, and background replacement. Experiments show that Vidu S2 outperforms all baselines. A playable online demo is available at https://vidu.com/vidu-stream.', 'score': 247, 'issue_id': 3275, 'pub_date': '2026-09-10', 'pub_date_card': {'ru': '10 сентября', 'en': 'September 10', 'zh': '9月10日'}, 'hash': '9d3e4b40c124a6e5', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#open_source', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Интерактивное видео в реальном времени: от создания аватаров до редактирования потоков', 'desc': 'Vidu S2 представляет собой систему генеративных моделей, включающую две компоненты: Vidu S2-Avatar для создания интерактивных цифровых аватаров в реальном времени и Vidu S2-Editing для редактирования видео потоков онлайн. Модели поддерживают генерацию пространственного видео высокого разрешения (720p) и позволяют обновлять эталонные изображения в любой момент времени. По сравнению с предыдущей версией, система обладает значительно улучшенной способностью следовать инструкциям пользователя и поддерживает различные операции редактирования: изменение стиля, замену одежды, замену персонажа и фона. Экспериментальные результаты демонстрируют превосходство Vidu S2 над всеми существующими аналогами.'}, 'en': {'title': 'Real-Time Video Magic with Vidu S2!', 'desc': 'Vidu S2 introduces advanced models for creating and editing videos with interactive avatars in real-time. The Vidu S2-Avatar model allows for high-resolution 720p video generation and can dynamically update references, enhancing user interaction and instruction following. Meanwhile, the Vidu S2-Editing model enables real-time video stream editing, including features like style rendering and character replacement. Overall, Vidu S2 demonstrates significant improvements over its predecessor, Vidu S1, in both avatar generation and video editing capabilities.'}, 'zh': {'title': '实时互动与视频编辑的未来', 'desc': 'Vidu S2 是一种实时互动的虚拟角色和视频编辑模型，支持高分辨率空间视频生成和动态参考更新。它包括 Vidu S2-Avatar 和 Vidu S2-Editing 两个部分，前者是实时互动的数字角色模型，后者是实时视频编辑模型。与 Vidu S1 相比，Vidu S2-Avatar 支持实时720p视频生成，并能够在任何时刻更新动态参考，且指令执行能力更强，例如可以跳舞。Vidu S2-Editing 则支持实时编辑视频流，包括风格渲染、服装替换、角色替换和背景替换，实验结果表明 Vidu S2 的性能优于所有基线模型。'}}}, {'id': 'https://huggingface.co/papers/2609.14973', 'title': 'PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models', 'url': 'https://huggingface.co/papers/2609.14973', 'abstract': "Abstract PhysBrain 1.5 unifies physical environment understanding, action generation, and future state prediction via joint autoregressive training on discrete vision-language, motion, and visual target sequences, achieving state-of-the-art open-source embodied performance.  Generated by thinkingmachines/Inkling-Small We present PhysBrain 1.5, a unified model for understanding physical environments, generating actions, and predicting future states. Motivated by the physical loop of observation, interaction, and environmental change, we bring these capabilities into a common learning framework. Starting from a general vision--language model, we encode language responses, end-effector motion, and dense visual targets as discrete sequences and jointly optimize them with autoregressive next-token prediction. Pre-training draws its embodied supervision entirely from human interaction videos, using task-centered episodes to pair semantic and spatial context with recovered motion and subsequent observations. We then adapt the model through supervised fine-tuning on a mixture of human demonstrations, robot trajectories, and simulated experience. Across 28 embodied understanding benchmarks, our 8B model achieves an average score of 72.5, setting a new open-source state of the art and performing on par with leading proprietary models such as GPT-6-Astra and Gemini 3.6 Flash. It achieves the best open-source results on 14 benchmarks while retaining general multimodal capabilities. Beyond these understanding evaluations, qualitative examples show the model's ability to produce end-effector trajectories and predict future scenes through spatially aligned RGB, depth, and robot-mask outputs.", 'score': 167, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '595809f2efc2dd00', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#robotics', '#open_source', '#benchmark', '#video', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Единая модель для восприятия, действия и предсказания в робототехнике', 'desc': 'PhysBrain 1.5 — это унифицированная модель для понимания физических сцен, которая объединяет восприятие окружающей среды, генерацию действий и предсказание будущих состояний в единый автарегрессивный процесс. Модель обучается на дискретных последовательностях видео, языка, движений и визуальных целей, предварительно обучаясь на видео взаимодействия людей с объектами. После предварительного обучения модель адаптируется через обучение с учителем на смеси человеческих демонстраций, траекторий роботов и симулированного опыта. Восьмимиллиардная модель достигает лучших открытых результатов на большинстве бенчмарков телемерии и может предсказывать траектории манипулятора и будущие сцены с пространственно выравненными RGB, глубиной и масками робота.'}, 'en': {'title': 'Unifying Physical Understanding and Action in AI', 'desc': 'PhysBrain 1.5 is a comprehensive model that integrates understanding of physical environments, action generation, and future state prediction into a single framework. It utilizes joint autoregressive training on sequences that combine vision-language, motion, and visual targets, enhancing its performance in embodied tasks. The model is pre-trained using human interaction videos, allowing it to learn from real-world scenarios and optimize its predictions. With its advanced capabilities, PhysBrain 1.5 sets new benchmarks in open-source embodied performance, demonstrating strong multimodal understanding and action generation.'}, 'zh': {'title': '统一物理环境理解与动作生成的创新模型', 'desc': 'PhysBrain 1.5 是一个统一的模型，旨在理解物理环境、生成动作和预测未来状态。该模型通过联合自回归训练，将视觉-语言、运动和视觉目标序列整合在一起。它利用人类交互视频进行预训练，从而将语义和空间上下文与运动和观察相结合。经过监督微调后，PhysBrain 1.5 在28个基准测试中表现出色，达到了新的开源最佳水平。'}}}, {'id': 'https://huggingface.co/papers/2609.13285', 'title': 'Grouped Value Attention: Efficient KV Caching via On-Demand Key Reconstruction', 'url': 'https://huggingface.co/papers/2609.13285', 'abstract': 'Abstract Grouped Value Attention reduces transformer KV cache size by storing grouped values and reconstructing keys via a learned linear map, achieving near-GQA accuracy with a smaller persistent cache.  Generated by thinkingmachines/Inkling-Small The KV cache is a primary bottleneck for Transformer decoding: its memory footprint and cache-read traffic grow with sequence length. Grouped-query attention (GQA) reduces this cost by sharing key-value heads, but still stores both a key and a value at every step. We introduce Grouped Value Attention (GVA), which stores grouped values and reconstructs content keys with a learned linear map. At inference, the map can be absorbed into the query, eliminating the need to materialize content keys in the intended decode path. A small shared decoupled RoPE channel retains positional information through a separately cached positional key. For the configurations studied, this representation reduces persistent cache scalars by approximately 45-47% relative to matched GQA. At the 350M-parameter scale with 30B FineWeb-Edu tokens, the 16-dimensional positional variant reaches 44.18 average accuracy across five tasks, compared with 44.36 for GQA and 43.88 for MLA. These results demonstrate near-GQA benchmark accuracy with a more compact cache representation. To translate this compact representation into faster autoregressive inference, we have developed custom decoding kernels and are currently evaluating their end-to-end inference performance with an open-source release planned soon.', 'score': 51, 'issue_id': 3276, 'pub_date': '2026-09-08', 'pub_date_card': {'ru': '8 сентября', 'en': 'September 8', 'zh': '9月8日'}, 'hash': 'e9f95a0bd803bdc7', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization'], 'emoji': '⚡', 'ru': {'title': 'Компактный кэш трансформера через восстановление ключей', 'desc': 'В статье предлагается Grouped Value Attention (GVA) — метод для уменьшения размера KV кэша в трансформерах, который хранит сгруппированные значения и восстанавливает ключи через обученное линейное отображение. Подход достигает производительности, близкой к Grouped-Query Attention (GQA), при этом уменьшая объём постоянного кэша примерно на 45-47%. Во время инференса линейное отображение интегрируется в запросы, что исключает необходимость материализации ключей содержания, а позиционная информация сохраняется через отдельный канал RoPE. Экспериментальные результаты показывают, что GVA достигает качества, сравнимого с GQA, при более компактном представлении кэша, что открывает перспективы для ускорения авторегрессивного декодирования.'}, 'en': {'title': 'Efficient Memory with Grouped Value Attention', 'desc': 'Grouped Value Attention (GVA) is a novel approach that optimizes the memory usage of transformer models by reducing the size of the key-value (KV) cache. Instead of storing both keys and values at each decoding step, GVA stores grouped values and reconstructs the keys using a learned linear mapping. This method significantly decreases the persistent cache size by about 45-47% compared to traditional grouped-query attention (GQA) while maintaining similar accuracy levels. The implementation of GVA, along with custom decoding kernels, aims to enhance the efficiency of autoregressive inference in large-scale transformer models.'}, 'zh': {'title': '分组值注意力：更小的缓存，更高的效率', 'desc': 'Grouped Value Attention（GVA）通过存储分组值并通过学习的线性映射重建键，减少了变换器的KV缓存大小，同时在较小的持久缓存中实现了接近GQA的准确性。传统的KV缓存是变换器解码的主要瓶颈，随着序列长度的增加，其内存占用和缓存读取流量也会增加。GVA通过共享键值头来降低成本，并在推理时将映射吸收到查询中，从而消除了在解码路径中物化内容键的需要。实验结果表明，GVA在保持高准确度的同时，持久缓存的规模减少了约45-47%。'}}}, {'id': 'https://huggingface.co/papers/2609.15863', 'title': 'LynnReal-Omni: Native multi-modal Video Generation for Agentic Visual Workflows', 'url': 'https://huggingface.co/papers/2609.15863', 'abstract': 'Abstract LynnReal-Omni is a unified multimodal video diffusion framework that integrates agentic visual controls with high-fidelity generation and real-time acceleration.  Generated by thinkingmachines/Inkling-Small Video diffusion models are stochastic and hard to control: precise content often requires repeated sampling without guaranteed success, and long-horizon scenes drift in appearance, interactions, and temporal coherence. Agentic visual creation provides explicit references, editable 3D scenes, or executable game states for stable control, but does not by itself guarantee high object or character fidelity. Combining the two can enable stable, high-quality generation. To realize this combination, we present LynnReal-Omni, a native multimodal video generation framework built on a 32B shared multimodal diffusion transformer that unifies text-to-video, image-conditioned generation, reference-guided generation, structural control, editing, degraded video restoration, and long-video generation. It accepts heterogeneous visual inputs, including appearance references, editable 3D renders, and game recordings, allowing agents to compose visual conditions within a unified model. We also train a dedicated 27B Flash shared multimodal diffusion transformer for real-time rendering. We build a systematic data pipeline for video cleaning, subject association, multimodal annotation, and aligned control construction, yielding a curated corpus of multi-shot audiovisual segments, and introduce MSAVP, a 100-prompt, 20-metric evaluation design that separates instruction following, generating plausibility, visual quality, temporal behavior, and audio coordination. LynnReal-Omni-Flash further reduces inference cost through model and decoding acceleration, including a lightweight VAE decoder; on one H100, warm generation and decoding of a 22-frame 540p video take 843 ms with LynnReal-Omni and 377 ms with Flash. These results provide a foundation for real-time streaming video generation, making LynnReal-Omni a unified, controllable, and efficient basis for agentic visual creation.', 'score': 41, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '22c62e0243a149ac', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#diffusion', '#agents', '#data', '#inference', '#benchmark', '#open_source', '#architecture', '#video', '#multimodal', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Контролируемая генерация видео в реальном времени через мультимодальные диффузионные трансформеры', 'desc': 'LynnReal-Omni представляет собой унифицированную мультимодальную архитектуру для генерации видео на основе диффузионных моделей, которая объединяет агентное визуальное управление с высокой верностью синтеза. Модель построена на 32-миллиардном общем мультимодальном трансформере диффузии и поддерживает множество задач: генерацию текста в видео, условную генерацию по изображениям, структурное управление, редактирование и восстановление видео. Система способна принимать разнородные визуальные входы, включая 3D-рендеры и игровые записи, что позволяет агентам комбинировать визуальные условия в единой модели. Для достижения реального времени разработана специальная 27-миллиардная модель Flash с механизмами ускорения декодирования, обеспечивающая генерацию видео 540p длиной 22 кадра за 377 миллисекунд на одном H100.'}, 'en': {'title': 'Unified Control for High-Quality Video Generation', 'desc': 'LynnReal-Omni is a new framework for generating videos that combines different types of visual controls with high-quality output and fast processing. Traditional video diffusion models struggle with consistency and control, often requiring multiple attempts to achieve the desired results. By integrating agentic visual creation techniques, LynnReal-Omni allows for better stability and fidelity in the generated content. This framework supports various input types and includes a specialized model for real-time rendering, making it suitable for efficient and controllable video generation.'}, 'zh': {'title': '统一高效的视频生成框架', 'desc': 'LynnReal-Omni 是一个统一的多模态视频扩散框架，结合了智能视觉控制与高保真生成和实时加速。该框架通过一个 32B 的共享多模态扩散变换器，整合了文本到视频、图像条件生成、参考引导生成等多种功能。它能够接受多种视觉输入，包括外观参考、可编辑的 3D 渲染和游戏录制，从而在统一模型中进行视觉条件的组合。LynnReal-Omni-Flash 进一步降低了推理成本，实现了实时流媒体视频生成的基础。'}}}, {'id': 'https://huggingface.co/papers/2609.15364', 'title': 'RSIAgent: Autonomous Exploration for Recursive Self-improvement in New Environments', 'url': 'https://huggingface.co/papers/2609.15364', 'abstract': "Abstract RSIAgent is a training-free multi-agent framework that enables recursive self-improvement via autonomous memory construction and broad-then-deep exploration to adapt digital agents to new environments.  Generated by thinkingmachines/Inkling-Small Digital agents must often adapt to new environments whose interfaces, tools, and failure modes are not fully captured by pretrained models. We introduce RSIAgent, a training-free multi-agent framework for recursive self-improvement through autonomous memory construction. RSIAgent coordinates curriculum, actor, and verifier agents to continually explore the environment, validate outcomes, and retain environment-specific knowledge, including reusable causal relationships between actions, conditions, and consequences. It further adopts a broad-then-deep exploration strategy, combining parallel broad recursive self-exploration for discovering diverse environment structures with focused deep self-exploration for uncovering hard cases, hidden constraints, boundary conditions, and previously unknown causal dependencies. The resulting memory is frozen and can be directly reused for downstream tasks without updating model parameters. Experiments on OSWorld-v2 and Agent's Last Exam show that RSIAgent substantially improves strong open-source models, enabling Kimi-K3 and GLM-5.3 to outperform frontier closed-source models including GPT-6.", 'score': 21, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'eb0a28e74c6a705d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Самоучащиеся агенты через автономное конструирование памяти', 'desc': 'RSIAgent — это многоагентный фреймворк без обучения, который позволяет цифровым агентам адаптироваться к новым окружениям через рекурсивное самосовершенствование. Система использует автономное конструирование памяти, координируя работу агентов учебного плана, исполнителя и верификатора для непрерывного исследования окружения и накопления знаний. Фреймворк применяет стратегию «широкий-потом-глубокий» поиск, сочетая параллельное широкое изучение для обнаружения разнообразных структур с сосредоточенным глубоким поиском для выявления граничных условий и скрытых зависимостей. Построенная память замораживается и может быть напрямую переиспользована для новых задач без обновления параметров модели.'}, 'en': {'title': 'Empowering Agents with Recursive Self-Improvement', 'desc': 'RSIAgent is a novel framework designed for multi-agent systems that allows agents to improve themselves without needing additional training. It uses a method called autonomous memory construction to help agents adapt to new environments by remembering important information. The framework employs a broad-then-deep exploration strategy, which means it first explores many different aspects of the environment before focusing on specific challenging areas. This approach enables agents to retain valuable knowledge and causal relationships, leading to better performance in various tasks without altering their underlying models.'}, 'zh': {'title': 'RSIAgent：无需训练的自我改进智能体框架', 'desc': 'RSIAgent是一种无需训练的多智能体框架，能够通过自主记忆构建实现递归自我改进。该框架协调课程、执行者和验证者智能体，持续探索环境并验证结果，保留特定环境的知识。它采用广泛-深入的探索策略，结合并行的广泛递归自我探索和集中深入自我探索，以发现多样的环境结构和隐藏的因果关系。最终生成的记忆可以直接用于下游任务，而无需更新模型参数。'}}}, {'id': 'https://huggingface.co/papers/2609.15973', 'title': 'Discovery Foundation Models: Toward Open-Ended Discovery Intelligence', 'url': 'https://huggingface.co/papers/2609.15973', 'abstract': 'Abstract Discovery Foundation Models enable open-ended scientific discovery through iterative problem formulation, hypothesis testing, and evidence-based revision across dry and wet lab settings.  Generated by thinkingmachines/Inkling-Small Foundation models have progressed from learning and reasoning over existing knowledge, to increasingly learning through action, tool use, and outcome feedback. We argue that the next frontier is a further transition: from solving and acting within problems specified by humans to participating in the process by which new problems, representations, explanations, and knowledge are created. We refer to this capability as Discovery Intelligence. We formulate Discovery Foundation Models (DFMs) as general-purpose model systems for open-ended discovery. A DFM operates over a revisable research state and supports seven coupled capabilities spanning problem discovery, formulation, representation construction, hypothesis formation, intervention, evidence-grounded revision, and continual discovery improvement. We instantiate this framework with Zetema, which couples explicit research-state dynamics, verification and experimental gating, external grounding, and cross-task Discovery Skill evolution. We further ground the framework with GALILEO, a real therapeutic-discovery system in which Dry-Lab reasoning, robotic and hands-on Wet-Lab experimentation, external biological evidence, and iterative hypothesis and design revision form a closed physical discovery loop. We then formulate a unified approach to capability formation and process-centered evaluation, enabling discovery behavior to be trained, improved, and measured beyond final-answer performance. Together, these components establish discovery as a learnable, executable, and evaluable capability of foundation-model systems. We view this shift as a broader progression in intelligence scaling: from learning over existing knowledge, to learning from action outcomes, and ultimately to participating in the construction, testing, and revision of the structures through which new knowledge is discovered. Code: https://github.com/Gen-Verse/DFM-Plans', 'score': 21, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '8568e2d915b23cb5', 'authors': ['Ling Yang', 'Zhenfei Yin', 'Yingcheng Wu'], 'affiliations': ['phai-labs'], 'pdf_title_img': 'assets/pdf/title_img/2609.15973.jpg', 'data': {'categories': ['#reasoning', '#training', '#science', '#agents', '#open_source', '#benchmark', '#robotics'], 'emoji': '🔬', 'ru': {'title': 'От решения задач к созданию новых научных знаний', 'desc': 'В этой работе представлены модели Discovery Foundation Models (DFM), которые выходят за пределы обычного решения задач и участвуют в формулировке новых научных проблем и создании знаний. DFM работают с пересматриваемым исследовательским состоянием и объединяют семь связанных способностей: обнаружение проблем, их формулировку, конструирование представлений, формирование гипотез, проведение экспериментов и эмпирическую проверку. Авторы реализуют этот подход через систему Zetema и физический пример GALILEO, которая замыкает цикл открытия, объединяя сухую лабораторию (рассуждения), влажную лабораторию (физические эксперименты с роботами) и итеративную проверку гипотез. Этот переход от пассивного обучения на известных данных к активному участию в создании новых научных знаний представляет новый уровень развития больших языковых моделей.'}, 'en': {'title': 'Empowering Discovery Through Intelligent Models', 'desc': 'This paper introduces Discovery Foundation Models (DFMs), which enhance scientific discovery by allowing models to engage in iterative problem formulation and hypothesis testing. DFMs are designed to operate over a revisable research state, supporting capabilities such as problem discovery, hypothesis formation, and evidence-based revision. The authors present Zetema, a framework that integrates various research dynamics and skills to facilitate continual discovery improvement. They also discuss GALILEO, a therapeutic-discovery system that combines reasoning and experimentation to create a closed-loop discovery process, emphasizing the evolution of intelligence from knowledge learning to active participation in knowledge creation.'}, 'zh': {'title': '发现基础模型：科学发现的新前沿', 'desc': '本论文介绍了发现基础模型（DFMs），它们能够通过迭代的问题制定、假设测试和基于证据的修订，促进开放式科学发现。DFMs具备七种能力，包括问题发现、假设形成和持续改进等，支持在干实验和湿实验环境中进行研究。我们提出的Zetema框架结合了研究状态动态、验证和实验门控，形成一个闭环的发现过程。通过GALILEO系统，我们展示了如何将干实验推理与湿实验结合，实现真实的治疗发现。'}}}, {'id': 'https://huggingface.co/papers/2609.15478', 'title': 'BVB: Benchmarking Agentic Video Understanding via Programmatic Reconstruction in Blender', 'url': 'https://huggingface.co/papers/2609.15478', 'abstract': 'Abstract A benchmark requiring agents to programmatically reconstruct real-world videos in Blender reveals that current models achieve high perceptual similarity but struggle to retain spatiotemporal facts.  Generated by thinkingmachines/Inkling-Small Multimodal agents can create complex videos in software such as Blender by coding without relying on diffusion models. Yet video understanding benchmarks still evaluate models mainly through question answering. If an agent truly understands a video, it can reconstruct it programmatically. We introduce BVB, Blender-VideoBench, a benchmark that tests this ability by asking agents to reconstruct real-world videos as animated Blender scenes. To ensure fair comparison, each agent programs the reconstruction through a lightweight harness, Mini-BVB, in an identical sandbox under a shared cost limit. The benchmark renders each reconstruction from its animated camera and evaluates it on two axes: (1) Dual VQA measures how many spatiotemporal facts the reconstruction preserves. (2) Latent Similarity measures how closely the reconstruction matches the source video perceptually. Our overall score, a square-root mean, favors balanced performance. We evaluate 51 configurations from 10 model families and analyze semantic retention, perceptual similarity, reasoning effort, and cost. The best model reaches 88.6 Latent Similarity but retains only 53.7% of the source-correct spatiotemporal answers. Additional reasoning improves visual similarity but does not close this gap in factual accuracy. In a blind study with 15 raters and five configurations, Latent Similarity correlates strongly with human preference. These results show that programmatic reconstruction is a viable test of agentic video understanding, and that semantic retention remains the main challenge.', 'score': 20, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '90bbad0010327b93', 'authors': ['Yolo Y. Tang', 'Daiki Shimada', 'Jiayue Meng', 'Jing Bi', 'Pinxin Liu', 'Yicheng Wang', 'Yunzhong Xiao', 'Zhangyun Tan', 'Zeliang Zhang', 'Chao Huang', 'Susan Liang', 'Qianxiang Shen', 'Luchuan Song', 'Ali Vosoughi', 'Mingqian Feng', 'Melika Filvantorkaman', 'Chenliang Xu'], 'affiliations': ['Carnegie Mellon University', 'Sony Group Corporation', 'University of Rochester', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2609.15478.jpg', 'data': {'categories': ['#multimodal', '#agents', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'От восприятия к пониманию: тест на истинное понимание видео через программную реконструкцию', 'desc': 'В статье представлен новый benchmark BVB (Blender-VideoBench), который оценивает способность мультимодальных агентов понимать видео путём программной реконструкции сцен в Blender без использования диффузионных моделей. Тест измеряет два аспекта: сохранение пространственно-временных фактов (через Dual VQA) и перцептивную схожесть с исходным видео (через Latent Similarity). Анализ 51 конфигурации из 10 семейств моделей показал, что текущие подходы достигают высокой перцептивной схожести (до 88.6), но плохо сохраняют семантические факты (только 53.7% корректных ответов). Исследование демонстрирует, что программная реконструкция является эффективным методом оценки понимания видео агентами, и что сохранение семантической информации остаётся главной проблемой.'}, 'en': {'title': 'Reconstructing Reality: A New Benchmark for Video Understanding', 'desc': 'This paper introduces a new benchmark called Blender-VideoBench (BVB) to evaluate how well agents can reconstruct real-world videos in Blender. While current models can create visually similar videos, they often fail to accurately preserve the spatiotemporal facts of the original content. The benchmark assesses agents based on their ability to programmatically reconstruct videos, using metrics like Dual VQA for factual accuracy and Latent Similarity for perceptual resemblance. The findings highlight that while some models achieve high visual similarity, they struggle with maintaining the correct spatiotemporal information, indicating that semantic retention is a key challenge in video understanding.'}, 'zh': {'title': '程序化重建：视频理解的新标准', 'desc': '这篇论文介绍了一个新的基准测试，名为Blender-VideoBench（BVB），用于评估智能体在程序化重建真实世界视频的能力。尽管当前模型在视觉相似性上表现良好，但在保留时空事实方面仍然存在困难。通过使用轻量级的Mini-BVB工具，所有智能体在相同的环境中进行重建，以确保公平比较。研究结果表明，程序化重建是评估视频理解能力的有效方法，而语义保留仍然是主要挑战。'}}}, {'id': 'https://huggingface.co/papers/2609.15504', 'title': 'How Lossless Is Lossless Speculative Decoding? The Role of Numerical Precision in Orthrus', 'url': 'https://huggingface.co/papers/2609.15504', 'abstract': "Abstract Orthrus achieves lossless speculative decoding only under high numerical precision, with trajectory divergence under BF16 that does not impair downstream benchmarks.  Generated by thinkingmachines/Inkling-Small Orthrus is a hybrid autoregressive-diffusion architecture that accelerates autoregressive language-model inference by generating multiple tokens in parallel while using a frozen autoregressive backbone. Its central claim is that an intra-model consensus mechanism enables lossless speculative decoding, producing the same output sequence as the autoregressive model.   We independently reproduce Orthrus and examine this claim under different numerical precisions. Under BF16 inference, exact trajectory matching occurs in only 45% of cases for the authors' checkpoint and 43% for our independently trained model across 1,190 prompts from 12 domains. The probability of exact matching is also strongly associated with the response-conditional perplexity of the reference model. Despite this trajectory divergence, Orthrus does not show systematic degradation on downstream lm-eval-harness benchmarks. In contrast, repeating the trajectory evaluation with FP32 yields exact trajectory matching on all evaluated prompts.   These results show that the practical losslessness of Orthrus depends on numerical precision and that exact trajectory equivalence should be evaluated separately from downstream task performance.", 'score': 19, 'issue_id': 3277, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '88e23ec2b5ec3815', 'pdf_title_img': 'assets/pdf/title_img/2609.15504.jpg', 'data': {'categories': ['#inference', '#benchmark', '#architecture'], 'emoji': '⚡', 'ru': {'title': 'Численная точность определяет беспотерьность спекулятивной декодировки', 'desc': 'Orthrus — это гибридная архитектура, объединяющая авторегрессивный и диффузионный подходы для ускорения инференса языковых моделей путём параллельной генерации множества токенов с использованием замороженного авторегрессивного позвоночника. Авторы утверждают, что механизм внутримодельного консенсуса обеспечивает беспотерьную спекулятивную декодировку, производящую идентичную выходную последовательность. Однако независимое воспроизведение показало, что при использовании BF16 точное совпадение траекторий генерации происходит только в 45% случаев, хотя это не приводит к деградации качества на стандартных бенчмарках. Результаты демонстрируют, что практическая беспотерьность Orthrus критически зависит от численной точности, и траекторное совпадение следует оценивать отдельно от производительности на задачах.'}, 'en': {'title': 'Orthrus: Efficient Language Modeling with Lossless Speculative Decoding', 'desc': 'Orthrus is a novel hybrid architecture that combines autoregressive and diffusion models to enhance the efficiency of language model inference by generating multiple tokens simultaneously. It claims to achieve lossless speculative decoding through an intra-model consensus mechanism, ensuring that the output matches that of a traditional autoregressive model. However, experiments reveal that under lower numerical precision (BF16), exact trajectory matching occurs less frequently, indicating a divergence in outputs. Despite this, Orthrus maintains strong performance on downstream benchmarks, suggesting that trajectory matching and task performance should be assessed independently.'}, 'zh': {'title': 'Orthrus：高精度下的无损推测解码', 'desc': 'Orthrus是一种混合自回归-扩散架构，能够加速自回归语言模型的推理。它通过并行生成多个标记来实现快速推理，并使用一个冻结的自回归骨干网络。研究表明，在高数值精度下，Orthrus能够实现无损的推测解码，但在BF16精度下，轨迹匹配的准确率较低。尽管存在轨迹偏差，Orthrus在下游基准测试中并未表现出系统性的性能下降。'}}}, {'id': 'https://huggingface.co/papers/2609.14462', 'title': 'AlayaVista: Streaming World Modeling from Panoramic States to Perspective Video', 'url': 'https://huggingface.co/papers/2609.14462', 'abstract': 'Abstract AlayaVista decouples panoramic scene evolution from perspective video synthesis to enable efficient, high-fidelity interactive world modeling, supported by the MUGEN dataset.  Generated by thinkingmachines/Inkling-Small Interactive video world models must maintain broad scene context under camera motion while producing high-fidelity observations with low latency. Existing approaches face a representation trade-off: perspective models operate on local views and must preserve off-screen content over long rollouts, whereas broader spatial coverage is typically obtained by synthesizing full-sphere videos or constructing explicit 3D representations. Motivated by the complementary roles of global context and selective local acuity in visual perception, we present AlayaVista, a camera-controllable streaming video world model that decouples panoramic world evolution from perspective observation synthesis. Given a single perspective image, AlayaVista constructs a 360-degree scene prior using a pretrained panorama expansion model and then evolves the scene as a camera-conditioned panoramic latent state. A latent viewport renderer maps this state to the requested perspective video latents, while a perspective refiner restores details, suppresses artifacts, and performs super-resolution. To support efficient streaming, we adapt the panoramic generator to chunk-autoregressive generation and distill both panoramic generation and perspective refinement into few-step processes. To provide the supervision required by this design, we construct MUGEN, a large-scale real-world panoramic video dataset containing 1,318 hours of videos at resolutions of at least 4K, together with rich semantic and geometric annotations.', 'score': 19, 'issue_id': 3276, 'pub_date': '2026-09-13', 'pub_date_card': {'ru': '13 сентября', 'en': 'September 13', 'zh': '9月13日'}, 'hash': '3021426d5633d4d2', 'authors': ['Jiaming Tan', 'Mingliang Zhai', 'Zhen Li', 'Yuwei Wu', 'Chuanhao Li', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab', 'Beijing Institute of Technology', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2609.14462.jpg', 'data': {'categories': ['#synthetic', '#open_source', '#video', '#3d', '#multimodal', '#dataset'], 'emoji': '🎬', 'ru': {'title': 'Панорамный контекст для эффективного синтеза перспективного видео', 'desc': 'AlayaVista — это модель для интерактивного синтеза видео, которая разделяет эволюцию панорамной сцены от рендеринга перспективного видео. Система получает одно изображение и создает 360-градусный контекст сцены, затем эволюционирует панорамное состояние в скрытом пространстве в зависимости от движения камеры. Специальный рендерер проецирует панорамное представление на требуемую перспективу, а уточняющая сеть восстанавливает детали и выполняет суперразрешение. Для обучения авторы создали MUGEN — большой датасет панорамных видео высокого разрешения с аннотациями семантики и геометрии.'}, 'en': {'title': 'Decoupling Panoramic Evolution for High-Fidelity Perspective Video', 'desc': 'AlayaVista is a novel approach that separates the creation of panoramic scenes from the generation of perspective videos, allowing for efficient and high-quality interactive world modeling. It utilizes the MUGEN dataset, which contains extensive real-world panoramic videos, to enhance its performance. The method constructs a 360-degree scene from a single perspective image and evolves this scene based on camera movements, ensuring low latency and high fidelity. By employing a latent viewport renderer and a perspective refiner, AlayaVista effectively generates detailed perspective views while maintaining broad scene context.'}, 'zh': {'title': '高效的全景视频世界建模', 'desc': 'AlayaVista 是一种新型的交互式视频世界模型，它将全景场景演变与视角视频合成分离，以实现高效且高保真的世界建模。该模型能够在相机运动下保持广泛的场景上下文，同时以低延迟生成高质量的观察结果。通过使用预训练的全景扩展模型，AlayaVista 能够从单一视角图像构建 360 度场景先验，并根据相机条件演变场景。为了支持高效流媒体传输，该模型采用了分块自回归生成方法，并将全景生成和视角精炼过程简化为少量步骤。'}}}, {'id': 'https://huggingface.co/papers/2609.15128', 'title': 'Omni-Streaming Thinking', 'url': 'https://huggingface.co/papers/2609.15128', 'abstract': 'Abstract Omni-Streaming Thinking improves streaming omni-modal reasoning by deferring claims until cross-modal verification, reducing premature commitment and auditory hallucinations.  Generated by thinkingmachines/Inkling-Small Streaming omni-modal models must decide what and when to answer from the video chunks and synchronized audio observed so far. Visual cues often support an interpretation before an utterance or sound event is complete. If that interpretation enters memory as a fact, later reasoning can keep relaying it even after audio contradicts it. We call this failure premature cross-modal commitment. We propose Omni-Streaming Thinking (OST), which generates structured outputs that include evidence observed so far, forecasts of future evidence, and claims based on this evidence. Each claim is initially marked as pending and linked to a future verification interval. Audio and visual evidence are stored separately, and OST checks a claim against the evidence from the specified modality at the end of the verification interval. When contradictory evidence is detected, a refutation process reduces the influence of the claim and its dependent states, and then guides a state update using the new evidence. An answer gate decides whether the answer-critical claims meet the conditions for giving a response. Using a frozen Qwen3-Omni-30B-A3B-Instruct backbone with lightweight adaptation, OST outperforms the strongest open baselines on five streaming and audio-visual benchmarks by more than 10% relative on average. We also introduce OST-DiagBench, which holds video fixed and edits audio to test agreement, absence, contradiction, coexistence, and subtitle-speech conflict. OST reaches d-prime = 2.95, compared with at most 1.38 for open baselines, while reducing vision-induced auditory hallucinations.', 'score': 16, 'issue_id': 3275, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'fd1ff77267d056d8', 'authors': ['Enjun Du', 'Siyi Liu', 'Ziyu Zheng', 'Jingyu Li', 'Yiwen Guo', 'Yongqi Zhang', 'Difan Zou'], 'affiliations': ['Independent Researcher', 'LIGHTSPEED', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong', 'University of Sussex'], 'pdf_title_img': 'assets/pdf/title_img/2609.15128.jpg', 'data': {'categories': ['#reasoning', '#hallucinations', '#dataset', '#open_source', '#audio', '#multimodal', '#video', '#architecture', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Проверка перед поспешностью: потоковое многомодальное мышление с отложенной верификацией', 'desc': 'В статье предлагается метод Omni-Streaming Thinking для улучшения многомодального рассуждения на потоковых данных путём отложенной верификации утверждений. Основная проблема заключается в преждевременном закреплении информации из одной модальности (например, визуальной) в памяти, что приводит к галлюцинациям при поступлении противоречащей информации из другой модальности (например, аудио). Предложенный подход генерирует структурированные выходы с доказательствами, прогнозами и утверждениями, которые проверяются против кросс-модальных данных в специально определённых интервалах верификации. При обнаружении противоречий система запускает процесс опровержения и обновления состояния, что значительно снижает ошибки и галлюцинации в сравнении с существующими методами.'}, 'en': {'title': 'Deferring Claims for Better Omni-Modal Reasoning', 'desc': 'The paper introduces Omni-Streaming Thinking (OST), a method designed to enhance streaming omni-modal reasoning by delaying claims until they can be verified across different modalities, such as audio and video. This approach helps prevent premature cross-modal commitment, where an interpretation is incorrectly stored as a fact before all evidence is available. OST generates structured outputs that include current evidence, predictions for future evidence, and claims that are initially marked as pending until they can be verified. By separating audio and visual evidence and employing a refutation process for contradictory information, OST significantly improves performance on various benchmarks, reducing errors like auditory hallucinations.'}, 'zh': {'title': '全流式思维：提升多模态推理的准确性', 'desc': '本文提出了一种名为全流式思维（Omni-Streaming Thinking, OST）的方法，旨在改善流式多模态推理。OST通过推迟声明，直到进行跨模态验证，从而减少了过早承诺和听觉幻觉的发生。该方法生成结构化输出，包含已观察到的证据、未来证据的预测以及基于这些证据的声明。通过分开存储音频和视觉证据，OST能够在验证区间结束时检查声明的有效性，从而提高推理的准确性。'}}}, {'id': 'https://huggingface.co/papers/2609.15659', 'title': 'Kaininja: Extending Native 3D Generators to the Part Level', 'url': 'https://huggingface.co/papers/2609.15659', 'abstract': 'Abstract KaiNinja extends a native 3D generator to part-level outputs using a dual-volume representation that resolves interface conflicts, improving both part and whole-object fidelity without segmentation.  Generated by thinkingmachines/Inkling-Small Native 3D generators turn one image into a single mesh. TRELLIS.2 and its peers deliver high-fidelity non-watertight geometry with materials, but the output is one fused object, while downstream work such as editing, rigging and simulation operates on part-level assets. A naive idea is to run a 3D segmentation network on the fused mesh that TRELLIS.2 generates, but such pipelines are slow and bounded by the accuracy of the segmentation. We want a simple way to extend an existing native 3D generator to the part level. But we face a critical problem: the O-Voxel grid stores one sheet of surface per voxel, so a single volume cannot represent the interface where two parts touch, at any resolution. We introduce a dual-volume representation to solve this problem and put forward KaiNinja, a part-level extension of TRELLIS.2 built on a dual-volume form of its O-Voxel representation. KaiNinja keeps the generation speed and quality of TRELLIS.2 while extending it to the part level, with no mask or segmenter in the pipeline. Its training data come from sources of many kinds, including CAD models and assets authored by an LLM-driven agent; to our knowledge it is the first 3D generative model trained on agent-authored part data. Surprisingly, we also find that whole-object fidelity improves over the same backbone fine-tuned on the same dataset. Against part generation pipelines of different paradigms, it lowers whole-object Chamfer distance by 40% and raises strict part F-score by 16%.', 'score': 15, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '32f62cb879358f97', 'authors': ['Ruihan Yu', 'Lian Fu', 'Muyao Niu', 'Zheng-hui Huang', 'Yu-Ju Tsai', 'Sho Kuno', 'Fengbo Lan', 'Yonghao Yu', 'Erwin Wu', 'Ming-Hsuan Yang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab', 'Institute of Science Tokyo', 'The University of Tokyo', 'University of California, Merced'], 'pdf_title_img': 'assets/pdf/title_img/2609.15659.jpg', 'data': {'categories': ['#agents', '#3d'], 'emoji': '🏗️', 'ru': {'title': 'Двойной объём для безсегментационной генерации 3D объектов по частям', 'desc': 'KaiNinja расширяет нативный 3D генератор для создания объектов на уровне частей, используя двойную объёмную представление на основе O-Voxel сетки, которая решает проблему конфликтов на границах между частями. Основная инновация заключается в том, что традиционная O-Voxel сетка может хранить только одну поверхность на вокселе, что делает невозможным представление интерфейсов между соприкасающимися частями, а двойная объёмная представление решает эту проблему. Модель сохраняет скорость и качество исходного TRELLIS.2, но не требует сегментационной сети или маски, обучаясь на данных из CAD моделей и сгенерированных LLM агентом частей. Результаты показывают улучшение как качества отдельных частей, так и целого объекта, с уменьшением расстояния Chamfer на 40% и повышением F-score на 16%.'}, 'en': {'title': 'Revolutionizing 3D Generation with Part-Level Precision', 'desc': 'KaiNinja is a novel extension of a 3D generator that produces detailed outputs at the part level without requiring segmentation. It utilizes a dual-volume representation to effectively manage the interfaces between different parts, enhancing both the quality of individual parts and the overall object fidelity. This approach maintains the speed and quality of the original TRELLIS.2 generator while eliminating the need for additional segmentation processes. Remarkably, KaiNinja not only improves part generation accuracy but also enhances the fidelity of the entire object, achieving significant reductions in Chamfer distance and increases in part F-scores.'}, 'zh': {'title': 'KaiNinja：提升3D生成的部件级别输出', 'desc': 'KaiNinja 是一种扩展原生 3D 生成器的技术，能够生成部分级别的输出。它采用双体积表示法，解决了部件之间的接口冲突，从而提高了部件和整体物体的保真度。与传统的 3D 分割网络相比，KaiNinja 保持了生成速度和质量，同时无需在流程中使用掩码或分割器。通过使用多种来源的训练数据，包括 CAD 模型和由 LLM 驱动的代理生成的资产，KaiNinja 在整体物体的保真度上也有显著提升。'}}}, {'id': 'https://huggingface.co/papers/2609.13287', 'title': 'LLaDA-UI: Bringing Block-wise Diffusion to Vision-Language GUI Agents', 'url': 'https://huggingface.co/papers/2609.13287', 'abstract': 'Abstract A 16.7B-parameter mixture-of-experts diffusion vision-language agent achieves strong multimodal GUI performance while preserving block-parallel decoding efficiency.  Generated by thinkingmachines/Inkling-Small Diffusion large language models (dLLMs) achieve high decoding efficiency through block-parallel, arbitrary-order generation, making them attractive for latency-sensitive applications. GUI agents represent a natural testbed for this paradigm, as they must repeatedly perceive screen states and emit structured, spatially grounded actions in real time. However, whether dLLMs can be extended into capable multimodal GUI agents while preserving their parallel decoding advantage remains an open question. We present LLaDA-UI, a 16.7B-parameter MoE-based, block-wise diffusion vision-language GUI agent. LLaDA-UI follows a two-stage training pipeline: general multimodal pre-training aligns a native-resolution vision encoder with the LLaDA2.0-mini-base diffusion language backbone, followed by GUI-agent supervised fine-tuning on diverse mobile, desktop, web, and grounding data. Across widely adopted grounding benchmarks and navigation benchmarks spanning multiple platforms, LLaDA-UI substantially outperforms Qwen2.5-VL-7B and surpasses Qwen3-VL-8B on four of six reported GUI benchmarks. These results establish block-wise diffusion as a practical generative paradigm for multimodal GUI agents.', 'score': 12, 'issue_id': 3275, 'pub_date': '2026-09-09', 'pub_date_card': {'ru': '9 сентября', 'en': 'September 9', 'zh': '9月9日'}, 'hash': '4dff4545a5b576fc', 'authors': ['Zhangxuan Gu', 'Haoxing Chen', 'Qi Qin', 'Yi Xin', 'Kai Gan', 'Lin Liu', 'Long Cui', 'Xiaomei Wang', 'Beitong Zhou', 'Yunzhu Zhang', 'Zhengwen Zeng', 'Changlong Gao', 'Weizhi Chen', 'Rongchao Zhang', 'Haoyuan Wu', 'Shuheng Shen', 'Changhua Meng', 'Weiqiang Wang', 'Jianguo Li', 'Zhenzhong Lan'], 'affiliations': ['AGI Research Center, Inclusion AI', 'Venus Team', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2609.13287.jpg', 'data': {'categories': ['#inference', '#open_source', '#diffusion', '#multimodal', '#agents', '#architecture', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Диффузионный агент для управления интерфейсом с параллельным декодированием', 'desc': 'В статье представлена LLaDA-UI — мультимодальный агент для взаимодействия с графическим интерфейсом на базе 16.7B-параметрической смеси экспертов и диффузионной языковой модели. Модель использует блочно-параллельное декодирование, что позволяет генерировать действия с низкой задержкой, сохраняя при этом высокую эффективность. Обучение проходит в два этапа: предварительное выравнивание визуального энкодера с диффузионным языковым хребтом, а затем дообучение на задачах управления интерфейсом различных платформ. Экспериментально показано, что модель превосходит существующие решения на бенчмарках навигации и определения местоположения элементов интерфейса.'}, 'en': {'title': 'LLaDA-UI: Revolutionizing GUI Agents with Efficient Multimodal Learning', 'desc': 'This paper introduces LLaDA-UI, a 16.7 billion parameter mixture-of-experts (MoE) model designed for multimodal tasks involving vision and language. It utilizes a block-parallel decoding approach, which allows for efficient processing and real-time action generation in graphical user interface (GUI) applications. The model undergoes a two-stage training process, first aligning a vision encoder with a diffusion language model, and then fine-tuning on various GUI-related datasets. The results demonstrate that LLaDA-UI significantly outperforms existing models on multiple benchmarks, showcasing the effectiveness of block-wise diffusion in creating capable GUI agents.'}, 'zh': {'title': '块式扩散：多模态GUI代理的新突破', 'desc': '本文介绍了一种名为LLaDA-UI的16.7B参数的混合专家扩散视觉-语言代理，该代理在多模态图形用户界面（GUI）性能上表现出色，同时保持了块并行解码的高效性。通过块并行和任意顺序生成，大型语言模型（dLLMs）在延迟敏感的应用中具有很大的吸引力。LLaDA-UI采用两阶段训练流程，首先进行多模态预训练，然后在多种移动、桌面和网页数据上进行GUI代理的监督微调。实验结果表明，LLaDA-UI在多个基准测试中显著超越了其他模型，证明了块式扩散在多模态GUI代理中的实用性。'}}}, {'id': 'https://huggingface.co/papers/2609.15134', 'title': 'HazardAuditor: From Executable Threats to Safer Computer-Use Agents', 'url': 'https://huggingface.co/papers/2609.15134', 'abstract': 'Abstract HazardAuditor provides execution-grounded safety supervision for computer-use agents and introduces Guard Policy Optimization to align generative guard training with sequence-level safety outcomes.  Generated by thinkingmachines/Inkling-Small Computer-use agents increasingly interact with browsers, terminals, file systems, and external services, introducing safety risks that emerge through runtime behavior rather than generated content alone. Existing guard models target static prompts and responses and are poorly suited to agent execution; existing executable safety platforms produce evaluation verdicts rather than the normalized supervision a guard model needs to learn across heterogeneous agent frameworks. We introduce HazardAuditor, an execution-grounded framework that closes both gaps. Its infrastructure runs heterogeneous agents (Claude Code, Codex, Hermes, and OpenClaw) in controlled environments and normalizes their interactions into a canonical event representation for cross-framework supervision. We further observe that token-level post-training objectives create a structural mismatch for generative guards, causing longer rationales to dominate gradient updates. Guard Policy Optimization (GuardPO) addresses this by converting deterministic safety outcomes into sequence-level advantages and normalizing rationale and verdict regions, making the safety decision the effective unit of optimization. Across multiple benchmarks and heterogeneous computer-use systems, HazardAuditor improves accuracy by up to 16.5 percentage points over the strongest prior guard. Code, models, and evaluation artifacts will be available at https://yunhao-feng.github.io/HazardAuditor/.', 'score': 11, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': 'ebf95aadf32fb63e', 'authors': ['Yunhao Feng', 'Ruixiao Lin', 'Ming Wen', 'Yanming Guo', 'Xingjun Ma', 'Yutao Wu', 'Xinhao Deng', 'Shouling Ji'], 'affiliations': ['Ant Group', 'Deakin University', 'Fudan University', 'Hunan Institute of Advanced Technology', 'Shanghai Innovation Institute', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2609.15134.jpg', 'data': {'categories': ['#open_source', '#alignment', '#optimization', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Выполнение-ориентированный контроль безопасности компьютерных агентов', 'desc': 'В работе представлена система HazardAuditor для контроля безопасности агентов, которые взаимодействуют с компьютерными интерфейсами во время выполнения кода. Авторы вводят Guard Policy Optimization — метод обучения охранных моделей на уровне последовательностей действий, что позволяет лучше выравнивать безопасность с реальным поведением агента. Существующие подходы работают только со статичными текстовыми подсказками, а не с динамическим выполнением программ, поэтому предложенная инфраструктура нормализует взаимодействия различных агентов в единый формат событий. Эксперименты показывают, что GuardPO улучшает точность контроля безопасности на 16,5 процентных пункта по сравнению с предыдущими методами.'}, 'en': {'title': 'Enhancing Agent Safety with Execution-Grounded Supervision', 'desc': 'HazardAuditor is a framework designed to enhance the safety of computer-use agents by providing supervision based on their actual execution behavior. It introduces Guard Policy Optimization (GuardPO), which aligns the training of generative guards with safety outcomes at the sequence level. This approach addresses the limitations of existing guard models that focus on static prompts and instead normalizes interactions across different agent frameworks. By improving the accuracy of safety decisions, HazardAuditor significantly outperforms previous models in various benchmarks.'}, 'zh': {'title': 'HazardAuditor：提升计算机代理安全性的创新框架', 'desc': 'HazardAuditor 是一个基于执行的安全监督框架，旨在为计算机使用代理提供安全保障。它引入了守卫策略优化（Guard Policy Optimization），将生成式守卫训练与序列级安全结果对齐。该框架能够在受控环境中运行不同的代理，并将它们的交互标准化为统一的事件表示，以实现跨框架的监督。通过多项基准测试，HazardAuditor 的准确性比之前最强的守卫提高了多达 16.5 个百分点。'}}}, {'id': 'https://huggingface.co/papers/2609.15309', 'title': "When Agents Slow Down: Understanding LLM Agents' Test-Time Strategies via Elo-per-token Analysis", 'url': 'https://huggingface.co/papers/2609.15309', 'abstract': 'Abstract Elo-per-token analysis reveals that LLM agents initially scale faster than independent sampling but eventually slow, while parallel short sessions improve performance over single long runs.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents allocate test-time compute adaptively as they revise solutions, use tools, explore alternatives, and decide when to stop. This test-time strategy makes it difficult to measure how agent performance scales. We study open-ended tasks that provide continuous scores for intermediate submissions, making progress observable throughout long trajectories. We propose Elo-per-token analysis, which tracks the best solution found at each token budget and uses a Bradley-Terry model to aggregate within-task orderings into Elo ratings across tasks with different score scales. We apply it to four general-purpose agents on four open-ended benchmarks, with sessions of up to 100M tokens, and to three feedback-driven LLM optimization harnesses in controlled single-task interventions. Independent sampling provides a theoretically characterized reference, for which Elo grows linearly with log compute. Against this reference, agents can initially convert tokens into Elo faster than independent sampling, but their marginal gains diminish and eventually fall below the reference. In contrast, the strongest historical human contestants improve superlinearly over contest time on shared AtCoder Heuristic Contest tasks, providing evidence of continual learning and substantial headroom after agents slow down. We define the scaling inflection point as the per-session budget where marginal Elo gains match the independent-sampling reference. Using this point as the per-session budget, we split 100M tokens across parallel sessions on FrontierCS Polyomino Packing, gaining +264 Elo over one long session and +355 over ten short sessions.', 'score': 10, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '3cd9d61cb2ba328b', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#agents', '#benchmark', '#reasoning', '#optimization'], 'emoji': '📈', 'ru': {'title': 'Параллельные сессии эффективнее одной длинной: оптимизация распределения вычислений LLM агентов', 'desc': 'В работе предложен метод Elo-per-token анализа для измерения масштабируемости производительности LLM агентов, которые адаптивно распределяют вычислительные ресурсы во время решения задач. Исследователи применили этот метод к четырём агентам на открытых бенчмарках с бюджетом до 100 млн токенов и обнаружили, что агенты изначально конвертируют токены в рейтинг Elo быстрее, чем независимое sampling, но со временем их эффективность падает ниже этого уровня. Используя точку перелома масштабирования, авторы показали, что распределение вычислений на несколько параллельных сессий значительно превосходит одну длинную сессию, давая прирост в +264 Elo. Результаты указывают на существование значительного потенциала для улучшения агентов, так как лучшие человеческие участники демонстрируют суперлинейный рост производительности на тех же задачах.'}, 'en': {'title': 'Maximizing LLM Performance with Strategic Session Management', 'desc': 'This paper introduces Elo-per-token analysis to evaluate the performance of large language model (LLM) agents during test-time computations. It finds that LLM agents initially perform better than independent sampling but their performance gains decrease over time. The study uses a Bradley-Terry model to track the best solutions across tasks, revealing that shorter, parallel sessions yield better results than longer, single sessions. The authors define a scaling inflection point to optimize token allocation, demonstrating that strategic session management can significantly enhance agent performance.'}, 'zh': {'title': '优化会话策略，提升LLM性能', 'desc': '本论文研究了大型语言模型（LLM）代理在测试时的计算分配策略，发现它们在初期的表现优于独立采样，但随着时间推移，性能提升减缓。我们提出了Elo-per-token分析方法，通过跟踪每个令牌预算下找到的最佳解决方案，使用Bradley-Terry模型将不同任务的评分整合为Elo评级。研究表明，代理在短会话中表现更佳，相比于单一长会话，能够获得更高的Elo评分。我们定义了缩放拐点，即边际Elo增益与独立采样参考相匹配的每会话预算。'}}}, {'id': 'https://huggingface.co/papers/2609.15051', 'title': 'Not All Prompts Are Equal: Exploration-Guided Prompt Scaffolding for Multimodal Reinforcement Post-Training', 'url': 'https://huggingface.co/papers/2609.15051', 'abstract': 'Abstract The framework dynamically adjusts training prompts via exploration potential scoring and scaffolded rewrites to improve reinforcement learning for multimodal language models.  Generated by thinkingmachines/Inkling-Small Training prompts in online reinforcement learning (RL) differ substantially in how informative they are for the current policy: some are already saturated while others are too difficult to yield reliable learning signals, yet both receive equal rollout budget under standard training. We propose an exploration-guided prompt scaffolding framework that adapts the training prompt distribution dynamically throughout RL post-training of multimodal large language models (MLLMs). Central to our approach is the Exploration Potential Score (EPS), a lightweight rollout-based proxy for prompt utility derived from KL-regularized policy improvement theory, computable directly from on-policy rollout statistics without additional overhead. Rather than discarding low-utility prompts, we use a teacher model to generate scaffolded rewrites that preserve the original task intent while making subsequent training more informative, reframing teacher supervision as training-data refinement rather than output imitation. Integrated with GRPO on Geo3K and MMK12, our method consistently outperforms the baseline on both in-domain and out-of-distribution benchmarks, achieving up to 9.7\\% relative improvement in-domain and gains of 11.5\\% on MathVision and 11.1\\% on MMMU-Pro.', 'score': 5, 'issue_id': 3276, 'pub_date': '2026-09-14', 'pub_date_card': {'ru': '14 сентября', 'en': 'September 14', 'zh': '9月14日'}, 'hash': '8a86fb8140384866', 'authors': ['Yuanhao Yue', 'Qianli Ma', 'Chengyu Wang', 'Haoting Wang', 'Lei Shen', 'Jun Huang'], 'affiliations': ['Alibaba Cloud Computing', 'Fudan University', 'Shanghai Jiao Tong University', 'Xian Jia
