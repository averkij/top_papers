ликтам оптимизации между доменами. Предложенный фреймворк MaSS выделяет отдельный путь структурных представлений, отделённый от контекстных признаков, и обучает его с помощью новой цели дискриминации структуры сцены. Модель превосходит прежние методы, впервые стабильно выигрывая от смешанного обучения на разных доменах, и демонстрирует сильную zero-shot генерализацию на восьми дополнительных датасетах.'}, 'en': {'title': 'Decoupling Structure for Superior Depth Estimation', 'desc': 'The MaSS framework enhances self-supervised monocular depth estimation by distinguishing between structural representations and contextual features. This separation helps the model avoid biases from specific datasets, allowing it to generalize better across various scenes. By employing a scene-structure discrimination objective, MaSS learns more transferable structural representations for depth decoding. The framework shows significant improvements in performance on diverse datasets and excels in zero-shot scenarios, demonstrating its effectiveness in mixed-domain training.'}, 'zh': {'title': 'MaSS框架：提升自监督深度估计的多样性与泛化能力', 'desc': 'MaSS框架通过将结构表示与上下文特征分离，改善了自监督单目深度估计在多样场景中的表现。该框架使用场景结构判别目标，使得混合领域训练可扩展，并实现强大的零样本泛化能力。研究发现，现有方法在自监督下往往会编码数据集特定的结构偏差，而不是可转移的场景几何。MaSS通过引入专门的结构表示路径，显著提升了深度解码的效果，尤其在多样数据集上表现优异。'}}}, {'id': 'https://huggingface.co/papers/2610.04902', 'title': 'Self-Evaluating Recursive Agents', 'url': 'https://huggingface.co/papers/2610.04902', 'abstract': "Abstract SERA trains recursive language agents to generate evaluation rubrics for subtasks, improving decomposition, solving, and self-evaluation with reduced external supervision.  Generated by thinkingmachines/Inkling-Small Recursive language-model agents decompose tasks and delegate subtasks to child instances of the same policy, forming a tree of work. Training them, however, is hard: the final outcome is verifiable, but the self-invented intermediate subtasks are numerous and carry no ground truth. Existing methods score each node with a verifier or judge, which is costly at scale and blind to decomposition quality. We argue that a recursive agent must learn three coupled capabilities within one set of weights: decomposing problems into subtasks, solving them, and evaluating the outcomes, each requiring its own training signal. SERA (Self-Evaluating Recursive Agents) turns evaluation into a learned capability of the policy itself. Before delegating, the parent writes a rubric of weighted success criteria for each child subtask; a ranking objective against verified outcomes then trains rubric generation so that the criteria track genuine subtask success. In addition, a complementary leaf-coverage signal provides direct credit for task decomposition. Our central finding is that training the policy to generate aligned rubrics is what drives the gains: because the same weights both evaluate and execute, learning to judge subtasks sharpens the agent's ability to solve them. Notably, external supervision is also reduced: the judge is consulted only to train the rubric generator, while solving is trained against the agent's own rubric scores, which outperform direct use of the judge. Beyond training, the learned rubric doubles as an inference-time selector for tree search. On TextCraft-Synth and TextWorld-Sync, SERA improves over strong recursive-agent baselines by 5.38 and 13.14 points on average, and rubric-guided tree search at inference adds a further 2.43 points on TextWorld-Sync.", 'score': 10, 'issue_id': 3436, 'pub_date': '2026-10-04', 'pub_date_card': {'ru': '4 октября', 'en': 'October 4', 'zh': '10月4日'}, 'hash': '526935738e5496aa', 'authors': ['TianYi Lyu', 'Xiaozhe Li', 'Yang Li', 'Yongkang Chen', 'Kefei Tian', 'Junbo Niu', 'Zican Hu', 'Hongbo Liu', 'Mingliang Xiong', 'Qingwen Liu'], 'affiliations': ['Independent', 'Nanjing University', 'Peking University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiaotong University', 'Tongji University'], 'pdf_title_img': 'assets/pdf/title_img/2610.04902.jpg', 'data': {'categories': ['#agents', '#reasoning', '#training', '#games'], 'emoji': '🌳', 'ru': {'title': 'Агент, который сам учится судить о своих подзадачах', 'desc': 'SERA обучает рекурсивных языковых агентов самостоятельно генерировать рубрики оценки для подзадач, превращая оценивание в обученную способность самой policy модели. Родительский агент перед делегированием пишет взвешенные критерии успеха для каждой дочерней подзадачи, а ranking-objective на основе проверенных результатов выравнивает эти критерии с реальным успехом. Дополнительный сигнал leaf-coverage напрямую поощряет качественную декомпозицию задачи, а внешний judge используется только для обучения генератора рубрик. Обученные рубрики также служат селектором при инференсе для tree search и дают прирост качества на TextCraft-Synth и TextWorld-Sync.'}, 'en': {'title': 'Empowering Agents with Self-Generated Evaluation Rubrics', 'desc': "The paper introduces SERA, a method for training recursive language agents that can create evaluation rubrics for subtasks. This approach enhances the agents' ability to break down complex tasks, solve them, and assess their own performance with less reliance on external supervision. By integrating the generation of rubrics into the learning process, SERA allows agents to evaluate their subtasks effectively, leading to improved task decomposition and execution. The results show that SERA outperforms existing methods, demonstrating the benefits of self-evaluation in recursive task management."}, 'zh': {'title': '自评递归代理：提升任务解决能力的关键', 'desc': 'SERA（自评递归代理）训练递归语言代理生成评估标准，以改善任务分解、解决和自我评估，减少外部监督。该方法通过让代理在解决子任务时生成加权成功标准，从而提高了任务分解的质量。代理不仅能够分解问题，还能解决子任务并评估结果，这三者在同一权重下学习。研究表明，生成一致的评估标准是提升代理解决能力的关键，同时减少了对外部评估者的依赖。'}}}, {'id': 'https://huggingface.co/papers/2610.25060', 'title': 'Policy Is Not Capability: Some Safety Benchmarks Measure Which Definition of "Unsafe" You Trained On', 'url': 'https://huggingface.co/papers/2610.25060', 'abstract': 'Abstract Guardrail benchmark scores primarily reflect labeling policy rather than detection ability, with minor parameter changes shifting results across full ranges and training contamination undermining reported safety metrics.  Generated by thinkingmachines/Inkling-Small A guardrail classifier is reported as if unsafe were a property of text. It is not: it is a property of a policy, and the policy enters the model through its labels. We exploit an accident of an industrial deployment in which the same ~53k prompts were labelled twice, under two operational definitions ("is this a request for harmful content?" and "would a moderator block this?"), and used to train ten guardrail arms sharing architecture, codebase and optimiser family, at two model scales. First, the guardrail\'s own training corpus already contained the benchmarks: JailbreakBench-benign is 88% and OR-Bench-hard 82% present in the training pools, two over-refusal benchmarks, the kind a guardrail reports to argue it does not over-block. Everything below is decontaminated. Second, safety benchmarks stratify sharply by how much of their score is decided by the label definition rather than by the model: with architecture and optimiser fixed, the range across the ten arms is 0.99 on HarmBench-copyright and 0.043 on WildGuard-benign, a 23x spread. Third, a benchmark score can be moved across its entire range by 0.03% of the parameters. Across these arms HarmBench-copyright spans 0-100 and OR-Bench-hard over-refusal 3.4-56.4%, and the four arms whose last supervision signal carries a given policy occupy one extreme of both (exact rank p=0.005, or 0.04-0.14 at worst), at unchanged detection capability. For a distilled student the teacher\'s soft labels do this even when every hard label carries the other policy, so teacher provenance is an unrecorded confound in any released checkpoint. Fourth, validation accuracy on the one split that grades all twenty arms tracks agreement with the annotator\'s policy (rho=+0.74), not detection capability (rho=+0.34). We argue that guardrail evaluations should report contamination, a seed floor and the definition they were graded against as first-class variables.', 'score': 8, 'issue_id': 3437, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'b6b19121c22e1705', 'authors': ['Vahid Jebraeeli', 'Jonathon Romero', 'Yijin Wang', 'Adrian Chan', 'Jianbang Zhang'], 'affiliations': ['Lenovo'], 'pdf_title_img': 'assets/pdf/title_img/2610.25060.jpg', 'data': {'categories': ['#ethics', '#optimization', '#training', '#benchmark', '#data', '#leakage', '#security', '#dataset', '#rlhf'], 'emoji': '⚖️', 'ru': {'title': 'Безопасность модели измеряется политикой разметки, а не её умом', 'desc': 'Статья показывает, что результаты guardrail-классификаторов на безопасность определяются не только способностью модели обнаруживать вредный контент, но и политикой разметки, заложенной в обучающие метки. Авторы обучили десять вариантов моделей на одних и тех же ~53k промптах, размеченных по двум разным определениям, и обнаружили, что некоторые бенчмарки сильно зависят от определения, а небольшое изменение параметров (0.03%) смещает результат по всей шкале. Также выявлена контаминация: обучающие данные уже содержали тестовые бенчмарки, а дистилляция переносит политику учителя в студента. Поэтому авторы предлагают в оценках безопасности явно указывать контаминацию, разброс по seed и определение, по которому проводилась разметка.'}, 'en': {'title': 'Guardrail Scores: More About Labels Than Detection!', 'desc': 'This paper discusses how the performance scores of guardrail classifiers in machine learning are influenced more by the labeling policies than by the actual detection capabilities of the models. It highlights that minor changes in model parameters can lead to significant variations in benchmark results, indicating a lack of robustness. The authors demonstrate that the same dataset can yield different scores based on how the labels are defined, revealing that the evaluation metrics are not purely reflective of model performance. They advocate for clearer reporting of contamination and the definitions used in evaluations to better understand the true effectiveness of guardrail systems.'}, 'zh': {'title': '安全评估需关注标签政策与检测能力', 'desc': '这篇论文探讨了安全评估基准分数主要反映标签政策而非检测能力的问题。研究表明，模型的参数微小变化会导致结果大幅波动，而训练污染则削弱了报告的安全指标。通过对同一组提示进行两次标注，作者揭示了标签定义对基准分数的影响，强调了模型架构和优化器固定时，分数的变化范围。最后，论文建议在安全评估中应报告污染情况、种子底线和评分定义，以便更准确地理解模型的性能。'}}}, {'id': 'https://huggingface.co/papers/2610.24766', 'title': 'ECHO: Efficient Causal Self-Recursion Beyond Auxiliary Multi-Token Prediction', 'url': 'https://huggingface.co/papers/2610.24766', 'abstract': "Abstract ECHO integrates multi-horizon prediction into the backbone via self-recursion and dynamic depth sampling, improving pretraining efficiency and inference drafting without auxiliary modules.  Generated by thinkingmachines/Inkling-Small Existing Multi-token prediction (MTP) methods are auxiliary by design: the multi-horizon loss mostly trains modules attached to the backbone, and each added horizon costs another module and another pass. We propose Efficient Causal Self-Recursion (ECHO), which removes both costs. The backbone's own final layer predicts every horizon, so the supervision lands on the parameters that generate the next token, and Dynamic Depth Sampling (DDS) keeps deeper horizons affordable by drawing the training depth with probabilities that decay along depth. Future prediction thus becomes part of the autoregressive objective rather than a task attached to it, and the gains follow on both sides of it. In pretraining, added depth converts into downstream accuracy where auxiliary modules saturate, concentrating on reasoning and code at half the MTP training overhead of training every depth. At inference, the pretrained model is its own drafter: it drafts beyond the depth it was trained for, and keeps its draft-target alignment on the open-ended, high-entropy generation where post-hoc drafters lose theirs. The advantage survives a doubled token budget, a repeated pretraining run, and supervised finetuning.", 'score': 8, 'issue_id': 3437, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': '4cf93e3ad6be1e45', 'authors': ['Yuxuan Zhou', 'Junyuan Shang', 'Tianyu Wang', 'Chunrui Zheng', 'Zichang Liu', 'Wenbin Chang', 'Shuohuan Wang', 'Dianhai Yu'], 'affiliations': ['Baidu', 'Independent Researcher'], 'pdf_title_img': 'assets/pdf/title_img/2610.24766.jpg', 'data': {'categories': ['#inference', '#optimization', '#architecture', '#training', '#reasoning'], 'emoji': '🔮', 'ru': {'title': 'Модель учится предсказывать будущее сама, без лишних модулей', 'desc': 'В статье представлен метод ECHO, который встраивает предсказание нескольких будущих токенов прямо в основную модель, используя её последний слой вместо отдельных вспомогательных модулей. Для экономии вычислений применяется Dynamic Depth Sampling (DDS), который выбирает глубину обучения с убывающими вероятностями. Такой подход улучшает качество предобучения, особенно в задачах рассуждения и написания кода, при вдвое меньших затратах по сравнению с полным multi-token prediction (MTP). На этапе инференса модель сама выступает в роли drafter для speculative decoding, сохраняя согласованность предсказаний даже в открытой генерации.'}, 'en': {'title': 'ECHO: Streamlining Multi-Horizon Predictions in Machine Learning', 'desc': 'The paper introduces ECHO, a novel approach that integrates multi-horizon prediction directly into the backbone of a model using self-recursion and dynamic depth sampling. This method enhances pretraining efficiency by allowing the model to predict multiple future tokens without needing additional modules, which typically slow down training. By using Dynamic Depth Sampling, ECHO makes deeper predictions more manageable, ensuring that the model can generate high-quality outputs even beyond its training depth. Overall, ECHO streamlines the prediction process, improving both pretraining and inference performance while reducing the computational overhead associated with traditional multi-token prediction methods.'}, 'zh': {'title': 'ECHO：高效的自我递归预测方法', 'desc': 'ECHO是一种新的机器学习方法，它通过自我递归和动态深度采样将多时间段预测集成到主干网络中，从而提高了预训练效率和推理草拟能力。与传统的多令牌预测方法不同，ECHO消除了对辅助模块的需求，使得主干网络的最终层能够直接预测每个时间段。动态深度采样通过概率方式调整训练深度，使得更深的预测变得可负担。最终，ECHO使得未来预测成为自回归目标的一部分，从而在预训练和推理阶段都取得了显著的性能提升。'}}}, {'id': 'https://huggingface.co/papers/2610.24133', 'title': 'A Conditional No-Hair Theorem for Transformers: How Language Models Forget Their Prompt', 'url': 'https://huggingface.co/papers/2610.24133', 'abstract': "Abstract Autoregressive transformers retain prompt influence via a power-law decay driven by attention dilution and relay mechanisms, with trained models forgetting faster than untrained ones.  Generated by thinkingmachines/Inkling-Small We ask how much an autoregressive transformer retains of its prompt after generating t tokens. Consider two different prompts followed by the same continuation text, so that any difference in their hidden states comes from the prompt alone, and we find that the distance between their hidden states decays approximately as a power law t^{-α}, where α=1 is the rate at which a fixed prompt's share of uniform attention shrinks and smaller values mean longer memory. Trained models forget fast (αapprox0.55--0.7), untrained ones slowly (αapprox0.2--0.5). We prove that this offset is Obig(P(log t)^{L-1}/tbig) for a prompt of length P and depth L. The bound holds for finite-depth pre-LN softmax transformers with bounded attention logits, under one additional condition: the pre-norm activations stay away from zero. The mechanism is geometric: the prompt's direct influence is diluted as the context grows, and relay --- continuation tokens passing on what earlier tokens read from the prompt --- can only add logarithmic factors. This is what we call the conditional no-hair theorem: given the text generated so far, the prompt's influence on the next token vanishes as t grows, so any property of the prompt that survives, such as its language, must be carried by the text itself. An exactly solvable linear relay model shows that the bound cannot be improved and reproduces the rise of the local exponent towards 1 seen in untrained networks. Cancelling the dilution with a logit bias stops the decay early in training and reverses it after, so dilution is necessary for the forgetting we measure; untrained networks and the solvable model show it is also sufficient.", 'score': 7, 'issue_id': 3437, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '97357f09adafc365', 'pdf_title_img': 'assets/pdf/title_img/2610.24133.jpg', 'data': {'categories': ['#architecture', '#training', '#interpretability', '#math'], 'emoji': '🧠', 'ru': {'title': 'Промпт постепенно растворяется в тексте: чем дальше генерация, тем слабее его влияние', 'desc': 'Статья исследует, сколько информации о промпте сохраняет авторегрессивный трансформер после генерации t токенов. Авторы показывают, что различие скрытых состояний для двух промптов с одинаковым продолжением убывает по степенному закону t^{-α}, причём обученные модели забывают промпт быстрее необученных. Доказана верхняя оценка влияния промпта, основанная на размывании внимания (attention dilution) и эффекте релейной передачи (relay) между токенами продолжения. Эксперименты и точно решаемая линейная модель подтверждают, что размывание внимания является и необходимым, и достаточным условием такого забывания.'}, 'en': {'title': 'Understanding Prompt Influence Decay in Transformers', 'desc': "This paper investigates how autoregressive transformers retain the influence of their initial prompts while generating text. It finds that the retention of prompt information decays over time following a power-law, with trained models forgetting faster than untrained ones. The study introduces a concept called the conditional no-hair theorem, which states that as more tokens are generated, the prompt's influence diminishes, and any lasting properties must be embedded in the generated text. The authors also demonstrate that adjusting the model's parameters can influence this decay, highlighting the importance of attention mechanisms in memory retention."}, 'zh': {'title': '自回归变换器的提示影响力衰减研究', 'desc': '这篇论文探讨了自回归变换器在生成文本时如何保留提示的影响力。研究发现，提示的影响力随着生成的令牌数量增加而以幂律衰减，训练过的模型遗忘的速度比未训练的模型快。具体来说，训练模型的遗忘率约为0.55到0.7，而未训练模型的遗忘率约为0.2到0.5。论文还提出了条件无发论，表明随着生成文本的增加，提示对下一个令牌的影响会消失。'}}}, {'id': 'https://huggingface.co/papers/2610.24791', 'title': 'UniAVC: Unified Audio-Video Creation via Progressive Training and Asymmetric Scheduling', 'url': 'https://huggingface.co/papers/2610.24791', 'abstract': 'Abstract UniAVC trains separate audio and video branches on abundant unimodal data before aligning them with scarce paired data, using independent noise schedules and asymmetric supervision to enable joint synthesis, cross-modal generation, and instruction-guided editing.  Generated by thinkingmachines/Inkling-Small Unified audio-video creation requires a single model capable of text-conditioned joint synthesis, bidirectional cross-modal generation, and instruction-guided editing across both modalities. Existing methods rely heavily on paired corpora, which are scarce for joint generation and even rarer for editing. Consequently, they are spent learning single-branch generative and editing capabilities that abundant unimodal data could readily teach, rather than on the cross-modal coupling. Furthermore, prevailing systems apply a single shared noise schedule to both modalities, neglecting two critical limitations. First, due to the significant discrepancy in information density, video requires prolonged high noise to organize spatial and motion structure, whereas the sparser audio signal can settle earlier during the synthesis process, the dynamics a uniform schedule might compromise. Second, lockstep denoising leaves asymmetric workflows, such as conditioning on one modality to synthesize or edit another, untrained. We present UniAVC, which addresses both obstacles. It first trains each branch on unimodal dataset to full generative and editing competence, and subsequently dedicates paired data to exploit cross-modal correspondence. Modality-decoupled schedulers meanwhile warp the noise schedule independently from a shared timestep, while subtasks with one clean modality directly supervise asymmetric configurations. These settings respectively enable intent-aware editing, which preserves one modality intact while enlisting it to constrain the other, and post-inference self-refinement, which regenerates only an unsatisfactory branch against an accepted one. UniAVC thus spans multiple creation tasks from a single set of weights without task-specific adapters.', 'score': 7, 'issue_id': 3437, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': 'e479646eb61e3445', 'authors': ['Kien T. Pham', 'Yuhao Liu', 'Chong Hou Choi', 'Zhenqi He', 'Yanghao Wang', 'Chenyang Lei', 'Rui Liu', 'Qifeng Chen', 'Long Chen'], 'affiliations': ['HKUST', 'Huawei Research'], 'pdf_title_img': 'assets/pdf/title_img/2610.24791.jpg', 'data': {'categories': ['#multimodal', '#audio', '#architecture', '#training', '#video', '#diffusion'], 'emoji': '🎬', 'ru': {'title': 'Одна модель для аудио и видео: учим по отдельности, связываем вместе', 'desc': 'UniAVC — это унифицированная модель для создания аудио и видео, которая обучает отдельные ветви для аудио и видео на большом объёме однородных (unimodal) данных, а затем выравнивает их с помощью ограниченного набора парных данных. Модель использует независимые расписания шума (noise schedules) для каждой модальности, что учитывает разную информационную плотность видео и аудио. Асимметричное обучение с одной чистой модальностью позволяет решать задачи редактирования по инструкции и самоуточнения после инференса. Всё это реализуется одним набором весов без task-specific адаптеров, охватывая синтез, кросс-модальную генерацию и редактирование.'}, 'en': {'title': 'UniAVC: Bridging Audio and Video with Independent Learning', 'desc': 'UniAVC is a machine learning model designed for audio-video creation that trains separate branches for audio and video using abundant unimodal data before aligning them with limited paired data. It employs independent noise schedules for each modality to address the differences in information density, allowing for better synthesis and editing capabilities. The model supports joint synthesis, cross-modal generation, and instruction-guided editing, overcoming the limitations of existing methods that rely on paired datasets. By training each branch independently and using asymmetric supervision, UniAVC enhances the efficiency and effectiveness of cross-modal tasks without needing separate models for each task.'}, 'zh': {'title': 'UniAVC：音视频生成的新突破', 'desc': 'UniAVC是一种新型的音视频生成模型，它首先在丰富的单模态数据上训练音频和视频两个分支，然后利用稀缺的配对数据进行对齐。该模型采用独立的噪声调度和非对称监督，能够实现联合合成、跨模态生成和基于指令的编辑。与现有方法不同，UniAVC避免了对配对语料库的过度依赖，充分利用了单模态数据的优势。通过这种方式，UniAVC能够在多个创作任务中使用同一组权重，而无需特定于任务的适配器。'}}}, {'id': 'https://huggingface.co/papers/2610.26830', 'title': 'Competing Learning in Hybrid Architectures', 'url': 'https://huggingface.co/papers/2610.26830', 'abstract': 'Abstract Hybrid language models suffer from competing learning between recurrence and attention layers, and a staged training procedure improves retrieval and overall performance.  Generated by thinkingmachines/Inkling-Small Many modern language models have adopted hybrid architectures that incorporate both linear-time recurrence and softmax attention. Modern recurrence layers provide a highly expressive mixing mechanism while ensuring high throughput by compressing contextual information into a fixed-size state, but underperform softmax attention in contextual information retrieval. In this paper, we reveal a Competing Learning phenomenon where different kinds of mixers compete to learn the same function, and when any layer learns a function, it suppresses the corresponding learning signal for other layers. Layer attribution analysis reveals that under typical data distributions, modern recurrence learns retrieval functions faster than softmax attention, causing attention to fail to learn retrieval in most cases. Stopping weight updates in recurrence in the middle of training helps attention learn retrieval. Based on these results, we propose a staged training procedure for pre-training hybrid architectures on natural language. Empirical results on models up to 1B parameters show that our method results in substantial improvement in language modeling loss, common-sense reasoning, as well as a wide range of retrieval-related tasks across different context lengths.', 'score': 7, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '889080cfae935aa6', 'authors': ['Xingyu Shen', 'Yingfa Chen', 'Ziqing Qiao', 'Chaojun Xiao', 'Xu Han', 'Zhiyuan Liu'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26830.jpg', 'data': {'categories': ['#small_models', '#architecture', '#training', '#interpretability', '#optimization', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Слои конкурируют, а не помогают: заморозь рекуррентность, чтобы attention научился искать', 'desc': 'Гибридные LLM сочетают рекуррентные слои с линейным временем и softmax attention, но рекуррентность быстрее учится функции поиска и подавляет обучение attention. Авторы описывают эффект Competing Learning, при котором разные слои конкурируют за выучивание одной и той же функции. Чтобы attention успевал выучить извлечение информации, предлагается поэтапное обучение: в середине тренировки веса рекуррентных слоев замораживаются. Эксперименты на моделях до 1B параметров показывают улучшение языкового моделирования, здравого смысла и задач на поиск в контексте.'}, 'en': {'title': 'Enhancing Hybrid Language Models with Staged Training', 'desc': 'This paper discusses the challenges faced by hybrid language models that use both recurrence and attention mechanisms. It identifies a phenomenon called Competing Learning, where these layers compete to learn the same functions, leading to suboptimal performance. The authors propose a staged training approach that temporarily halts updates to the recurrence layers, allowing attention layers to better learn retrieval tasks. Their experiments show that this method significantly enhances performance in language modeling and retrieval tasks across various contexts.'}, 'zh': {'title': '优化混合语言模型的分阶段训练方法', 'desc': '混合语言模型在递归层和注意力层之间存在竞争学习现象，这影响了模型的整体性能。研究表明，现代递归层在学习检索功能方面比软最大注意力层更快，但当递归层学习某个功能时，会抑制其他层的学习信号。为了改善这一问题，本文提出了一种分阶段训练程序，帮助注意力层更好地学习检索功能。实验证明，该方法在语言建模损失和常识推理等任务上显著提升了性能。'}}}, {'id': 'https://huggingface.co/papers/2610.23935', 'title': 'Factorization-Guided Training and Inference for Diffusion-Drafted Speculative Decoding', 'url': 'https://huggingface.co/papers/2610.23935', 'abstract': "Abstract DScout improves speculative decoding throughput by aligning diffusion drafter training and inference with prefix acceptance and latency trade-offs.  Generated by thinkingmachines/Inkling-Small Speculative decoding accelerates large language model inference through parallel verification of tokens proposed by a drafter. Diffusion drafters further parallelize proposal generation, but greater proposal capacity or higher mean accepted tokens (MAT) need not yield higher throughput. Because verification accepts only a consecutive prefix, early rejections can render later correct predictions ineffective, limiting MAT gains, while even higher MAT may not improve throughput if per-round latency increases. We introduce DScout, which uses two complementary factorizations to guide diffusion drafter training and inference for higher throughput. For training, DScout factorizes position-wise loss into inclusion, weighting, and prediction loss. This guides the design and combination of mixed-horizon training, intra-block unmasking, and acceptance-weighted loss to align supervision with prefix acceptance and improve MAT. For inference, DScout factorizes throughput as the ratio of MAT to per-round latency, guiding target-conditioning depth, drafter depth, and inference block size selection to identify a high-throughput configuration for each workload. Across six benchmarks, DScout achieves 3.84times and 4.14times mean speedups over autoregressive decoding on Qwen3-4B and Qwen3-8B, respectively, improving mean speedup over the state-of-the-art baseline by 9.1% and 7.1%. Across models and concurrency settings, our inference configuration policy provides up to 9.75% additional mean speedup over DScout's fixed configuration.", 'score': 7, 'issue_id': 3436, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': '04dfbb0cecb39422', 'authors': ['Jiakun Fan', 'Min Xiao', 'Qiang Wang', 'Neiwen Ling', 'Zhichao Liu', 'Zhihao Jia', 'Dimitrios S. Nikolopoulos', 'Zijun Wei'], 'affiliations': ['ByteDance', 'Carnegie Mellon University', 'Virginia Tech'], 'pdf_title_img': 'assets/pdf/title_img/2610.23935.jpg', 'data': {'categories': ['#inference', '#optimization', '#training', '#diffusion'], 'emoji': '🚀', 'ru': {'title': 'Быстрее не значит больше токенов: выравниваем драфтер под реальную пропускную способность', 'desc': 'Статья предлагает DScout — метод ускорения speculative decoding для больших языковых моделей (LLM), где диффузионный драфтер предлагает токены, а основная модель их верифицирует. Авторы разбивают функцию потерь на компоненты inclusion, weighting и prediction, чтобы обучение лучше соответствовало принятию префикса и росту mean accepted tokens (MAT). На этапе инференса пропускная способность раскладывается как отношение MAT к латентности раунда, что помогает выбирать глубину драфтера, глубину условия на целевую модель и размер блока. На шести бенчмарках DScout дает ускорение в 3.84x и 4.14x относительно autoregressive decoding на Qwen3-4B и Qwen3-8B и превосходит лучший базовый метод на 9.1% и 7.1%.'}, 'en': {'title': 'Boosting Throughput with DScout: Smarter Decoding for Faster Models', 'desc': "The paper introduces DScout, a method that enhances the speed of speculative decoding in large language models by optimizing the training and inference processes of diffusion drafters. It addresses the challenge of balancing the number of accepted tokens with the latency of each decoding round, which can affect overall throughput. By factorizing the training loss and adjusting the inference parameters, DScout aligns the model's performance with the requirements of prefix acceptance. The results show significant speed improvements over traditional autoregressive decoding methods, demonstrating DScout's effectiveness in various benchmarks."}, 'zh': {'title': 'DScout：提升推测解码效率的创新方法', 'desc': 'DScout是一种提高推测解码吞吐量的方法，它通过对扩散草拟器的训练和推理进行对齐，优化前缀接受和延迟之间的权衡。该方法通过并行验证草拟器提出的令牌，加速大型语言模型的推理过程。DScout通过将位置损失分解为包含、加权和预测损失，指导训练过程，从而提高平均接受令牌（MAT）。在推理阶段，DScout通过将吞吐量分解为MAT与每轮延迟的比率，优化推理配置，以实现更高的吞吐量。'}}}, {'id': 'https://huggingface.co/papers/2610.20597', 'title': 'Co-Evolving Acting and Forecasting for Language Agents', 'url': 'https://huggingface.co/papers/2610.20597', 'abstract': 'Abstract CoPE improves agentic reinforcement learning by training policies to generate multi-step action sequences from trajectory histories, increasing sample efficiency without inference overhead.  Generated by thinkingmachines/Inkling-Small Training language agents is bottlenecked by the high cost of long-horizon rollouts, yet standard agentic reinforcement learning (RL) learns only from a terminal scalar reward, leaving the supervision in intermediate steps largely unused. Prior work exploits this supervision through value targets that estimate per-step success probabilities or observation targets that fit environment response. Both are hard to construct well: (1) value targets come from the same single scalar signal for each step in the trajectory, and (2) observation targets, such as web pages and terminal logs, are long and noisy and reach only one step ahead. We propose CoPE, which adds a third kind of multi-step action targets. On successful on-policy trajectories, CoPE trains the policy backbone to generate the action sequences that follows each history. Each action is also supervised when forecast from the preceding histories, forming a temporal ensemble that the shared backbone absorbs during training, and this enables acting and forecasting to co-evolve. The policy still acts one step at a time at inference, with no overhead. Across five benchmarks (ALFWorld, ScienceWorld, WebShop, τ^2-bench, and AppWorld), CoPE (1) achieves stronger aggregate performance than GRPO and RL baselines with predictive auxiliary targets across simulated environments, while improving overall performance on both realistic applications; (2) delivers up to 1.9times and 2.0times higher sample efficiency than ECHO and GRPO, respectively, on ScienceWorld; and (3) achieves these gains with a single policy backbone, without additional models, separate pretraining, or inference overhead. The codebase is available at https://github.com/ulab-uiuc/CoPE.', 'score': 7, 'issue_id': 3436, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '230b05953bc80f65', 'authors': ['Haofei Yu', 'Yixing Chen', 'Yining Zhao', 'Xuyan Ye', 'Yuxiang Liu', 'Zhigang Hua', 'Yan Xie', 'Shuang Yang', 'Jiaxuan You'], 'affiliations': ['Meta AI', 'University of California San Diego', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.20597.jpg', 'data': {'categories': ['#benchmark', '#agents', '#rl', '#games', '#training', '#optimization', '#reasoning'], 'emoji': '🧭', 'ru': {'title': 'Учим агента планировать будущие шаги, не замедляя действия', 'desc': 'В статье предлагается метод CoPE для обучения языковых агентов с подкреплением (agentic RL), который использует промежуточные шаги траекторий. Вместо только терминального скалярного reward модель учится генерировать последовательности будущих действий на основе истории траектории, формируя временной ансамбль целей. Эти многошаговые action targets обучают общий backbone политики, и агент продолжает действовать пошагово при инференсе без дополнительных затрат. На пяти бенчмарках (ALFWorld, ScienceWorld, WebShop, τ²-bench, AppWorld) CoPE превосходит GRPO и другие RL-базлайны, при этом до 1.9x и 2.0x повышая sample efficiency по сравнению с ECHO и GRPO.'}, 'en': {'title': 'CoPE: Boosting Reinforcement Learning with Multi-Step Action Sequences', 'desc': 'CoPE enhances agentic reinforcement learning by enabling policies to create multi-step action sequences based on past experiences, which boosts sample efficiency without adding inference costs. Traditional reinforcement learning typically relies on a single final reward, neglecting valuable information from intermediate steps. CoPE introduces a novel approach by using multi-step action targets that allow the policy to learn from successful trajectories, effectively linking action forecasting with decision-making. This method not only improves performance across various benchmarks but also maintains efficiency by using a single policy backbone without the need for extra models or pretraining.'}, 'zh': {'title': 'CoPE：提升强化学习的样本效率与性能', 'desc': 'CoPE是一种改进的强化学习方法，通过训练策略生成多步动作序列，从而提高样本效率。它利用历史轨迹中的监督信息，克服了传统强化学习仅依赖终端奖励的局限性。CoPE引入了多步动作目标，使得策略在训练过程中能够同时进行动作预测和执行。实验结果表明，CoPE在多个基准测试中表现优异，显著提高了样本效率和整体性能。'}}}, {'id': 'https://huggingface.co/papers/2610.25296', 'title': 'World Model Interpretability: From Decoding Representations to Understanding Latent Worlds', 'url': 'https://huggingface.co/papers/2610.25296', 'abstract': 'Abstract JEPA latent-world interpretability should shift from decoding representations to analyzing how latent variables interact, evolve, and causally drive prediction through grounding, structuring, verifying, and acting.  Generated by thinkingmachines/Inkling-Small Emerging Joint-Embedding Predictive Architectures (JEPAs) are moving beyond representation learning towards latent world models that support prediction, planning, and control. Yet their latent worlds naturally lack a human-interpretable interface. In this Perspective, we argue that as JEPA latents become internal states for prediction and action, interpretability must move beyond what they encode to how latent variables interact, evolve, and causally drive prediction. To this end, we envision a four-stage research agenda, involving Ground, Structure, Verify, and Act, to guide this shift toward actionable latent-world understanding. Within our framework, existing JEPA interpretability efforts provide early evidence for Ground, while systematic analysis of latent structure, causal verification, and intervention remains largely unexplored. Overall, this Perspective aims to call for a broader latent-world interpretability agenda that shifts attention from decoding representations toward understanding, validating, and acting on latent worlds.', 'score': 7, 'issue_id': 3436, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': 'f5a73b7e003c96b8', 'authors': ['Jize Wang', 'Yongcheng Jing', 'Xinyi Le', 'Cailian Chen', 'Xinping Guan', 'Dacheng Tao'], 'affiliations': ['College of Computing and Data Science, Nanyang Technological University', 'School of Automation and Intelligent Sensing, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2610.25296.jpg', 'data': {'categories': ['#interpretability', '#rl', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'От декодирования представлений к пониманию и управлению латентным миром', 'desc': 'В статье рассматривается интерпретируемость латентных мировых моделей, построенных на архитектурах JEPA (Joint-Embedding Predictive Architectures), которые всё чаще используются для предсказания, планирования и управления. Авторы утверждают, что важно изучать не только то, что кодируют латентные представления, но и то, как латентные переменные взаимодействуют, эволюционируют и каузально влияют на предсказания. Для этого предлагается четырёхэтапная исследовательская программа: Ground (привязка к данным), Structure (анализ структуры латентного пространства), Verify (причинная верификация) и Act (вмешательство и действие). Работа призывает сместить фокус с декодирования представлений на понимание, проверку и активное использование латентных миров.'}, 'en': {'title': 'Understanding Latent Worlds: From Representation to Action', 'desc': 'This paper discusses the need for a new approach to interpretability in Joint-Embedding Predictive Architectures (JEPAs). Instead of just decoding what these models represent, the focus should be on how latent variables interact and influence predictions. The authors propose a four-stage framework: Ground, Structure, Verify, and Act, to enhance our understanding of these latent worlds. They emphasize that as JEPAs evolve, it is crucial to analyze and validate the causal relationships within these latent variables to improve their practical applications.'}, 'zh': {'title': '从解码到理解：重塑潜在世界的可解释性', 'desc': '这篇论文讨论了JEPA（联合嵌入预测架构）的潜在世界可解释性，强调需要从解码表示转向分析潜在变量如何相互作用、演变并因果驱动预测。JEPA模型正在超越传统的表示学习，向支持预测、规划和控制的潜在世界模型发展。然而，这些潜在世界缺乏人类可理解的接口。论文提出了一个四阶段的研究议程，包括基础、结构、验证和行动，以指导对潜在世界的可操作理解。'}}}, {'id': 'https://huggingface.co/papers/2610.25525', 'title': 'StopLoss: Teaching Agents to Predict Failure and Stop Early', 'url': 'https://huggingface.co/papers/2610.25525', 'abstract': 'Abstract StopLoss is a lightweight external monitor that predicts coding-agent failures from recent tool steps to abort doomed runs early, reducing compute costs while preserving successful outcomes.  Generated by thinkingmachines/Inkling-Small Coding agents keep working on runs that will fail verification, and asking a frontier model to watch for this is expensive in its own right. We introduce StopLoss, a small external monitor that learns failure recognition from completed trajectories and their verifier outcomes. The name is inspired by the stop-loss order in finance: StopLoss ends a run early when the run is likely to fail, which saves resources. Final outcomes label earlier local windows, so a fine-tuned language model can score the most recent tool steps in a single forward pass, and a threshold calibrated on successful runs turns that score into an abort decision without changing the executor. Trained on GPT-family SWE-rebench trajectories and evaluated on SWE-bench Verified and a SWE-bench Pro subset with GPT and Claude executors, StopLoss is compared against six general-purpose judges reading identical windows. Outcome supervision lifts failure prediction from near chance to a useful signal at the first check, at one to two orders of magnitude lower cost per check than any tested judge. This translates into savings: relative to completing every task, StopLoss lowers cost per retained solve by 4.5\\% on Verified while preserving 99\\% of successful runs, and by up to 31\\% on the costlier Pro subset, reaching 48\\% with a Qwen3-8B backbone, and in all four settings its cost per retained solve is below that of every judge policy. Outcome-trained small monitors can make failure recognition cheap enough for early stopping to pay for itself.', 'score': 6, 'issue_id': 3439, 'pub_date': '2026-10-18', 'pub_date_card': {'ru': '18 октября', 'en': 'October 18', 'zh': '10月18日'}, 'hash': '4ab1e4f724455246', 'authors': ['Jiarong Liang', 'Xueguang Ma', 'Dongfu Jiang', 'Yuxuan Zhang', 'Ping Nie', 'Wenhu Chen'], 'affiliations': ['University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2610.25525.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#small_models', '#agents'], 'emoji': '🛑', 'ru': {'title': 'Останавливай обречённые запуски агента раньше, чем они начнут стоить дорого', 'desc': 'В статье представлен StopLoss — небольшой внешний монитор, который обучается на завершённых траекториях агента и результатах верификации, чтобы предсказывать провал задачи по последним шагам вызова инструментов. Модель построена на дообученной LLM, которая оценивает недавние окна действий за один проход, а порог, откалиброванный на успешных запусках, принимает решение о прерывании без изменения самого агента. Эксперименты на SWE-bench Verified и подмножестве SWE-bench Pro показывают, что StopLoss значительно дешевле общих LLM-судей и при этом сохраняет 99% успешных решений. Благодаря этому экономия вычислений на одно сохранённое решение достигает 4.5%–48%, что делает ранний останов экономически оправданным.'}, 'en': {'title': 'StopLoss: Smart Early Aborts for Cost-Effective Coding Agent Runs', 'desc': 'The paper introduces StopLoss, a lightweight external monitor designed to predict failures in coding agents during their execution. By learning from past successful and failed runs, StopLoss can identify when a run is likely to fail and abort it early, thus saving computational resources. This approach utilizes a fine-tuned language model to evaluate recent tool steps and make decisions based on a calibrated threshold derived from successful outcomes. The results show that StopLoss significantly reduces costs while maintaining a high success rate, outperforming traditional judges in efficiency and effectiveness.'}, 'zh': {'title': 'StopLoss：智能监控，节省计算成本', 'desc': 'StopLoss是一种轻量级的外部监控器，能够通过最近的工具步骤预测编码代理的失败，从而提前终止可能失败的运行，降低计算成本，同时保留成功的结果。它通过学习已完成轨迹及其验证结果来识别失败，避免了昂贵的监控开销。StopLoss的名称灵感来自金融中的止损订单，它在运行可能失败时提前结束，从而节省资源。经过训练的StopLoss在多个测试中表现出色，相比于完成每个任务，它在保留99%的成功运行的同时，降低了验证任务的成本。'}}}, {'id': 'https://huggingface.co/papers/2610.19439', 'title': 'Progress-Aware Distillation for Mitigating Stagnation in Small Language Model Agents', 'url': 'https://huggingface.co/papers/2610.19439', 'abstract': 'Abstract Progress-Aware Distillation detects and penalizes stagnation in distilled small language model agents to improve reasoning efficiency and success rates.  Generated by thinkingmachines/Inkling-Small While LLM-based agent systems have demonstrated remarkable proficiency in reasoning and solving complex real-world tasks, they also come with substantial token consumption and inference latency, limiting their practical deployment. To enhance the efficiency of agent systems, recent efforts have focused on transferring agentic capabilities from large-scale models to small language models (SLMs) via supervised fine-tuning-based distillation. Nevertheless, as interaction trajectories grow longer, involving extended reasoning-action chains and extensive environmental feedback, distilled student agents tend to experience progress stagnation: becoming trapped in unproductive loops characterized by persistent failed strategies and difficulty making meaningful progress. Our systematic analysis shows that this phenomenon consistently occurs across diverse SLMs and task domains. To address this issue, we propose Progress-Aware Distillation (ProD), which explicitly detects and penalizes stagnation in student-generated trajectories. ProD encodes the stagnation gap between student and teacher into an adaptive margin for dynamically penalizing possible stagnation. By iteratively applying this procedure, ProD enables student agents to progressively approximate teacher behavior. Extensive experiments involving 8 SLMs, ranging from 0.6B to 8B parameters, on both in-domain and out-of-domain benchmarks, demonstrate that ProD substantially mitigates progress stagnation while enhancing both the success rates and task-completion efficiency of distilled SLM agents.', 'score': 6, 'issue_id': 3438, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': 'a964ba0dbcb627e3', 'authors': ['Yuanpu Cao', 'Saket Sathe', 'Hanyu Wang', 'Ziyi Yin', 'Fenglong Ma', 'Jinghui Chen'], 'affiliations': ['Microsoft CoreAI', 'The Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2610.19439.jpg', 'data': {'categories': ['#training', '#optimization', '#transfer_learning', '#benchmark', '#agents', '#small_models'], 'emoji': '🧭', 'ru': {'title': 'Не давай малой модели ходить по кругу: штрафуй застой при дистилляции', 'desc': 'Статья посвящена дистилляции LLM-агентов в малые языковые модели (SLM), которые часто застревают в бесполезных циклах при длинных цепочках рассуждений и действий. Авторы предлагают метод Progress-Aware Distillation (ProD), который обнаруживает такую стагнацию в траекториях студента и штрафует её с помощью адаптивного margin, отражающего разрыв с учителем. Итеративное применение ProD позволяет студенческим агентам постепенно приближаться к поведению учителя. Эксперименты на 8 SLM размером от 0.6B до 8B параметров показывают, что метод уменьшает стагнацию и повышает успешность и эффективность выполнения задач.'}, 'en': {'title': 'Enhancing Small Language Models with Progress-Aware Distillation', 'desc': 'This paper introduces Progress-Aware Distillation (ProD), a method designed to improve the efficiency of small language models (SLMs) by addressing the issue of progress stagnation during training. Stagnation occurs when distilled agents get stuck in unproductive loops, failing to make meaningful advancements in their reasoning tasks. ProD detects this stagnation and applies penalties to encourage better learning trajectories, allowing student agents to more closely mimic the behavior of their larger teacher models. Experimental results show that ProD significantly enhances the success rates and efficiency of SLMs across various tasks and model sizes.'}, 'zh': {'title': '提升小型语言模型推理效率的进度感知蒸馏', 'desc': '本论文提出了一种名为进度感知蒸馏（Progress-Aware Distillation, ProD）的方法，旨在提高小型语言模型（SLM）代理的推理效率和成功率。通过检测和惩罚蒸馏学生代理在交互过程中出现的停滞现象，ProD能够有效避免代理陷入无效的策略循环。该方法通过动态调整惩罚边际，促进学生代理逐步接近教师模型的行为。实验结果表明，ProD显著减少了进展停滞现象，同时提高了蒸馏SLM代理的任务完成效率和成功率。'}}}, {'id': 'https://huggingface.co/papers/2610.21810', 'title': 'N-Gram Memories at Two Bits: Quantizing Lookup Tables in Large Language Models', 'url': 'https://huggingface.co/papers/2610.21810', 'abstract': "Abstract Conditional Program compresses language-model embedding tables by reconstructing only requested rows via shared codes and local scales, reducing storage by 75% while improving fidelity.  Generated by thinkingmachines/Inkling-Small Conditional memory expands language-model capacity through selective lookup, but the full embedding table must remain available for every possible input. We introduce Conditional Program (CP), a compressed representation that reconstructs only the rows an input requests. CP represents each row by a short code and a local scale, with a reconstruction program shared across the table. We instantiate this representation with a Gaussian trellis, norm restoration and independently decodable row records. CP's two-bit code lowers output KL by 41--63\\% relative to 2-bit round-to-nearest. Analysis across three trained n-gram memory families shows that Gaussian-like coordinate statistics coexist with learned relationships among rows; at matched storage budgets, the shared trellis outperforms the fitted codebooks and low-rank residual variants we test. For DeepSeek, it reduces table storage from 203GB to 51GB, leaving room for larger workloads when the table is kept on GPU.", 'score': 6, 'issue_id': 3438, 'pub_date': '2026-10-16', 'pub_date_card': {'ru': '16 октября', 'en': 'October 16', 'zh': '10月16日'}, 'hash': '64a5784193ce111c', 'authors': ['Donghoon Han', 'Minseop Jung', 'Dong Woo Kwak', 'SeungJae Lee', 'Junhoo Lee'], 'affiliations': ['Dnotitia Inc.', 'KAIST'], 'pdf_title_img': 'assets/pdf/title_img/2610.21810.jpg', 'data': {'categories': ['#optimization', '#architecture', '#inference'], 'emoji': '🗜️', 'ru': {'title': 'Восстанавливаем только нужное — память языковой модели становится в четыре раза меньше', 'desc': 'В статье предлагается Conditional Program (CP) — компактное представление таблиц эмбеддингов для языковых моделей, которое восстанавливает только те строки, которые запрошены входом. Каждая строка описывается коротким кодом и локальным масштабом, а программа восстановления (гауссовская trellis-структура с нормализацией) разделяется по всей таблице. При 2-битном кодировании CP снижает KL-дивергенцию выходов на 41–63% по сравнению с round-to-nearest квантованием. На DeepSeek объём хранения таблицы сокращается с 203 ГБ до 51 ГБ, что освобождает место для более крупных нагрузок на GPU.'}, 'en': {'title': 'Efficient Compression for Language Models with Conditional Program', 'desc': "The paper introduces Conditional Program (CP), a method that compresses language-model embedding tables by reconstructing only the necessary rows based on input requests. This approach uses shared codes and local scales to significantly reduce storage requirements by 75% while enhancing the fidelity of the model's outputs. CP employs a Gaussian trellis and norm restoration techniques to efficiently represent each row, allowing for selective lookup without needing the entire embedding table. The results demonstrate that CP not only minimizes storage but also improves performance compared to traditional methods, making it suitable for larger workloads on GPU."}, 'zh': {'title': '条件程序：高效压缩语言模型的创新方案', 'desc': '本文提出了一种名为条件程序（Conditional Program, CP）的新方法，用于压缩语言模型的嵌入表。通过仅重建输入请求的行，CP能够将存储需求减少75%，同时提高模型的准确性。CP使用短代码和局部缩放来表示每一行，并通过共享的重建程序来实现。这种方法在多个训练的n-gram内存模型中表现出色，显著降低了输出的KL散度，并在存储预算相同的情况下优于其他测试的编码方法。'}}}, {'id': 'https://huggingface.co/papers/2610.26765', 'title': 'HandsOn: A Large-Scale Simulation Benchmark for Generalizable Dexterous Manipulation', 'url': 'https://huggingface.co/papers/2610.26765', 'abstract': 'Abstract HandsOn is a cross-embodiment simulation benchmark and platform for dexterous manipulation that evaluates generalization across robotic arms, hands, objects, and composed tasks, revealing substantial gaps in current multi-task policies and foundation-model-based control.  Generated by thinkingmachines/Inkling-Small General-purpose manipulation requires reliable behavior across embodiments, objects, and task demands. We introduce HandsOn, a composable simulation platform and benchmark for cross-embodiment dexterous manipulation. It supports five robotic arms, six dexterous hands, and approximately 200 rigid, articulated, and deformable assets in randomized scenes. The benchmark pairs 18,000 curated human demonstrations with 66 human-verified tasks: Core-50 supports demonstration-based learning and execution tests, while Transfer-16 evaluates asset and relation transfer, skill composition, and deformable manipulation without target-task training demonstrations. Qualitative real-robot rollouts illustrate sim-to-real transfer. Across diffusion, vision-language-action, world-action, and prompted VLM-based methods, the best trained multi-task policy achieves 29.1% Core-50 success. Without benchmark finetuning, GPT-6 using move_eef for palm-and-finger control achieves 5.2% on Core-50 and 1.9% on Transfer-16 over 660 trials. Trained-policy stage diagnostics expose failures in contact establishment, action coordination, and maintaining achieved goals, with additional sequencing errors in composed tasks. HandsOn provides a shared basis for investigating manipulation generalization and the limits of reliable physical interaction.', 'score': 6, 'issue_id': 3436, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '48c02b8baef80e97', 'authors': ['Tianwei Luo', 'Yiming He', 'Hongjin Wu', 'Ting Pan', 'Debin Ren', 'Haorui Guo', 'Junlin Yang', 'Yuxin Zuo', 'Zhehao Kou', 'Kaisen Yang', 'Zhuoqun Lai', 'Yi Ding', 'Jiale Yu', 'Yuchen Zhang', 'Zijie Qiu', 'Haozhan Li', 'Ning Ding'], 'affiliations': ['Beijing University of Posts and Telecommunications', 'NatureWill', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26765.jpg', 'data': {'categories': ['#robotics', '#benchmark', '#multimodal', '#dataset', '#agents', '#training'], 'emoji': '🤖', 'ru': {'title': 'Ловкость роботов пока далека от обобщения: HandsOn показывает реальные пределы', 'desc': 'В статье представлен HandsOn — симуляционная платформа и бенчмарк для оценки ловкой манипуляции роботов с разными руками и кистями. Бенчмарк включает 18 000 демонстраций от людей и 66 задач, разделённых на Core-50 для обучения и Transfer-16 для проверки переноса навыков без дополнительных демонстраций. Лучшая обученная мультизадачная policy достигает лишь 29,1% успеха, а zero-shot LLM-подход на базе GPT-6 показывает крайне низкие результаты. Анализ стадий выполнения выявил основные проблемы: установление контакта, координация действий и удержание достигнутой цели.'}, 'en': {'title': 'HandsOn: Bridging the Gap in Robotic Dexterous Manipulation', 'desc': 'HandsOn is a new simulation platform designed to test how well robotic systems can perform dexterous manipulation tasks across different types of robotic arms and hands. It includes a wide variety of objects and tasks, allowing researchers to evaluate the generalization capabilities of multi-task policies and foundation models. The benchmark features a large dataset of human demonstrations and tasks, enabling the assessment of skills like asset transfer and manipulation without prior training on specific tasks. The findings highlight significant challenges in achieving reliable performance, particularly in areas like contact establishment and action coordination, underscoring the need for improved methods in robotic manipulation.'}, 'zh': {'title': '跨体现灵巧操作的基准平台', 'desc': 'HandsOn是一个用于灵巧操作的跨体现仿真基准和平台，旨在评估机器人手臂、手、物体和组合任务之间的泛化能力。该平台支持五种机器人手臂、六种灵巧手以及约200种刚性、关节和可变形的资产，能够在随机场景中进行测试。HandsOn基准结合了18,000个经过筛选的人类演示和66个经过验证的任务，帮助研究多任务策略和基础模型控制的局限性。通过真实机器人实验，HandsOn展示了仿真到现实的转移能力，并揭示了在接触建立、动作协调和目标维持方面的失败。'}}}, {'id': 'https://huggingface.co/papers/2610.22512', 'title': 'Predicting Privileged Information Effectiveness for On-Policy Self-Distillation', 'url': 'https://huggingface.co/papers/2610.22512', 'abstract': "Abstract On-policy self-distillation with privileged information improves multi-turn agent performance depending on content and source, and KL-based metrics better predict training gains than direct utility estimates.  Generated by thinkingmachines/Inkling-Small On-policy self-distillation (OPSD) enables large language models (LLMs) to learn from privileged information (PI) without a separate teacher model. However, prior work largely treats PI as a fixed design choice, leaving the effects of its content and construction poorly understood. This challenge is particularly important in multi-turn agentic settings, where trajectories contain actions, observations, and reasoning that can be transformed into PI in many ways. We systematically evaluate 16 PI configurations across three multi-turn agentic benchmarks and three student models that vary in scale and reasoning mode. We find that PI effectiveness depends on its content, generation source, and the student model. Information-dense trajectories and PI produced by more capable generators generally yield larger gains, whereas thinking models benefit less consistently. To assess PI before training, we compare PI utility with two KL-based metrics: sampled-token reverse KL (D) and error-step KL contrast (Δd^{-}_{err}). The KL-based metrics track post-training performance more consistently than PI utility, which can be distorted by information leakage. Empirically, selecting each task's PI by Δd^{-}_{err} also improves post-training performance over random selection, most when the PI candidates differ widely. Finally, effective PI remains beneficial when combined with GRPO, allowing the combined objective to outperform a strong GRPO baseline. Overall, our results provide practical guidance for constructing and evaluating PI in OPSD training.", 'score': 5, 'issue_id': 3439, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': '10beb36e5fee89e9', 'authors': ['Kaijian Zou', 'Emiliano Penaloza', 'MohammadHossein Rezaei', 'Anisha Gunjal', 'Mohit Raghavendra', 'Lu Wang', 'Yunzhong He', 'Anas Mahmoud'], 'affiliations': ['Mila', 'Scale AI', 'University of Michigan Ann Arbor'], 'pdf_title_img': 'assets/pdf/title_img/2610.22512.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#agents', '#rl'], 'emoji': '🧭', 'ru': {'title': 'Не вся подсказка одинаково полезна: KL-метрики точнее оценивают привилегированную информацию для агентов', 'desc': 'В статье исследуется on-policy self-distillation (OPSD) для LLM в многоходовых агентных задачах, где модель учится на привилегированной информации (PI) без отдельного учителя. Авторы систематически сравнивают 16 конфигураций PI на трёх бенчмарках и трёх студенческих моделях, показывая, что эффективность зависит от содержания, источника генерации и типа модели. Для оценки PI до обучения предлагаются KL-метрики (reverse KL по семплированным токенам и контраст KL на ошибочных шагах), которые надёжнее предсказывают прирост качества, чем прямая оценка полезности PI, подверженная утечке информации. Показано, что выбор PI по метрике Δd^{-}_{err} улучшает результаты и что PI эффективно сочетается с GRPO, превосходя сильный базовый уровень.'}, 'en': {'title': 'Unlocking Agent Performance with Smart Privileged Information', 'desc': 'This paper discusses a method called on-policy self-distillation (OPSD) that helps large language models (LLMs) learn better by using privileged information (PI) without needing a separate teacher model. The authors explore how different types of PI can affect the performance of multi-turn agents, finding that the content and source of PI significantly influence training outcomes. They introduce KL-based metrics to evaluate the effectiveness of PI, showing that these metrics can predict performance improvements more reliably than traditional utility estimates. The study concludes that carefully selecting and constructing PI can lead to better training results, especially when combined with other training objectives.'}, 'zh': {'title': '利用特权信息提升多轮智能体性能', 'desc': '本文探讨了在多轮对话中，如何利用特权信息（PI）通过在线自蒸馏（OPSD）来提升智能体的表现。研究发现，特权信息的有效性取决于其内容、生成来源以及学生模型的特性。通过系统评估不同的特权信息配置，结果表明信息密集的轨迹和由更强大的生成器产生的特权信息通常能带来更大的性能提升。此外，使用基于KL的度量标准来评估特权信息的效用，能够更准确地预测训练后的表现。'}}}, {'id': 'https://huggingface.co/papers/2610.26863', 'title': 'Text-to-Image Generative Modeling Without Language Pretraining', 'url': 'https://huggingface.co/papers/2610.26863', 'abstract': 'Abstract Halcyon demonstrates that strong text-to-image generation can be achieved by training multimodal autoregressive models from scratch on image-text pairs without relying on large-scale language pretraining.  Generated by thinkingmachines/Inkling-Small Modern text-to-image (T2I) systems use internet-scale language pretraining for text-conditioned image generation. We ask whether language pretraining is necessary for strong T2I generation. We introduce Halcyon, a family of early-fusion multimodal autoregressive models pretrained entirely from scratch on GPIC, a dataset of 100M image-text pairs. Halcyon-0.52B outperforms LlamaGen-XL/8 (48.0 vs. 63.3 gFD) with 18.2times less pretraining compute. Further, Halcyon-1.6B outperforms JiT-T2I-XXL/8++ (35.3 vs. 41.0 gFD) with 275times less pretraining compute. Controlled experiments show that text-only pretraining does not improve T2I generation. Halcyon also learns image captioning by replacing caption dropout with I2T supervision, maintaining competitive T2I generation quality under the same pretraining budget. We show that strong T2I systems can be trained from scratch without internet-scale language pretraining. Code and models are available at https://cs.stanford.edu/~keshik/halcyon', 'score': 5, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '28dec49ab913edb7', 'authors': ['Keshigeyan Chandrasegaran', 'Yue Zhao', 'Armin W. Thomas', 'Ehsan Adeli', 'Jiajun Wu', 'Juan Carlos Niebles', 'Li Fei-Fei', 'Michael Poli'], 'affiliations': ['Radical Numerics', 'Stanford University'], 'pdf_title_img': 'assets/pdf/title_img/2610.26863.jpg', 'data': {'categories': ['#multimodal', '#cv', '#architecture', '#training', '#dataset', '#open_source', '#diffusion'], 'emoji': '🎨', 'ru': {'title': 'Хорошая генерация картинок не требует языкового гиганта: учим T2I с нуля', 'desc': 'Авторы показывают, что качественную генерацию изображений по тексту (T2I) можно получить без предварительного обучения большой языковой модели на огромных текстовых корпусах. Они представляют семейство early-fusion мультимодальных autoregressive моделей Halcyon, обученных с нуля на датасете GPIC из 100 миллионов пар «изображение-текст». Модели Halcyon превосходят LlamaGen-XL/8 и JiT-T2I-XXL/8++ по метрике gFD при в десятки и сотни раз меньших вычислительных затратах на предобучение. Эксперименты также показывают, что предобучение только на тексте не улучшает T2I-генерацию, а замена caption dropout на I2T-супервизию позволяет модели одновременно учиться описывать изображения.'}, 'en': {'title': 'Revolutionizing Text-to-Image Generation Without Language Pretraining', 'desc': 'Halcyon is a new approach to text-to-image (T2I) generation that shows it is possible to train multimodal autoregressive models from scratch using only image-text pairs, without the need for large-scale language pretraining. The study introduces a dataset called GPIC, which contains 100 million image-text pairs, and demonstrates that Halcyon models can outperform existing systems while using significantly less computational resources. Controlled experiments reveal that pretraining on text alone does not enhance T2I generation performance. Additionally, Halcyon can effectively learn image captioning by integrating image-to-text supervision, achieving high-quality T2I generation within the same pretraining constraints.'}, 'zh': {'title': '从零开始的强大文本到图像生成', 'desc': 'Halcyon是一种多模态自回归模型，能够从头开始训练图像-文本对，成功实现强大的文本到图像生成。与传统的文本条件图像生成系统不同，Halcyon不依赖于大规模的语言预训练。研究表明，文本单独预训练并不会提升文本到图像生成的效果。Halcyon在相同的预训练预算下，能够有效学习图像描述，同时保持竞争力的生成质量。'}}}, {'id': 'https://huggingface.co/papers/2610.24611', 'title': 'HSPR: Recovering Software-Agent Benchmark Scores via Hierarchical Posterior Inference', 'url': 'https://huggingface.co/papers/2610.24611', 'abstract': 'Abstract Hierarchical Score Posterior Recovery improves agent evaluation efficiency by combining historical response patterns with adaptive task selection to estimate full benchmark scores from small subsets.  Generated by thinkingmachines/Inkling-Small Evaluating software agents on a full benchmark is expensive. A small task subset can preserve agent rankings while yielding inaccurate scores. Historical responses provide useful structure, but tasks with identical source responses can have different outcomes for a new target agent. We introduce Hierarchical Score Posterior Recovery (HSPR), which combines source-fitted response factors with uncertain group success rates. Observed target outcomes update the posteriors over the target latent state and group rates; posterior-guided acquisition selects subsequent tasks. Its score-based criterion equals the expected one-step reduction in full-score posterior variance. Observed successes and posterior-predictive counts for unqueried tasks yield a full-score posterior. The final estimate uses its median with source-selected calibration. At a 10% task budget on four task banks from the SWE-bench family, HSPR achieves the lowest mean absolute error (MAE) on three banks and the lowest maximum absolute error (MaxErr) on all four among the methods compared. Removing group uncertainty or replacing adaptive queries increases macro MAE in the respective controls. Macro MAE decreases across 5-20% budgets.', 'score': 5, 'issue_id': 3436, 'pub_date': '2026-10-17', 'pub_date_card': {'ru': '17 октября', 'en': 'October 17', 'zh': '10月17日'}, 'hash': '2b8d663c22a04549', 'authors': ['Wanyi Chen', 'Wanqin Shen', 'Yuanchen Shi', 'Zhensu Sun', 'Fang Kong'], 'affiliations': ['Singapore Management University', 'Soochow University'], 'pdf_title_img': 'assets/pdf/title_img/2610.24611.jpg', 'data': {'categories': ['#agents', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Оцениваем AI-агентов по малой выборке задач, но точно как по полному benchmark', 'desc': 'В статье предлагается метод Hierarchical Score Posterior Recovery (HSPR) для оценки software agents на полном benchmark без запуска всех задач. Метод объединяет response factors, обученные на исторических ответах, с неопределённостью групповых success rates и обновляет posterior после каждого наблюдения. Адаптивный выбор следующих задач основан на ожидаемом уменьшении дисперсии posterior полного score, а итоговая оценка берётся как медиана с калибровкой. На бюджете 10% задач на наборах из семейства SWE-bench HSPR даёт наименьшую MAE на трёх из четырёх наборов и наименьшую MaxErr на всех четырёх.'}, 'en': {'title': 'Efficient Agent Evaluation with Hierarchical Score Recovery', 'desc': 'The paper presents Hierarchical Score Posterior Recovery (HSPR), a method designed to enhance the efficiency of evaluating software agents by using historical response patterns and adaptive task selection. HSPR estimates full benchmark scores from small subsets of tasks, which helps maintain agent rankings while reducing costs. It incorporates source-fitted response factors and updates posteriors based on observed outcomes to guide the selection of subsequent tasks. The results show that HSPR significantly reduces mean absolute error (MAE) compared to other methods, demonstrating its effectiveness in agent evaluation with limited resources.'}, 'zh': {'title': '高效评估代理的层次得分恢复方法', 'desc': '层次得分后验恢复（HSPR）通过结合历史响应模式和自适应任务选择，提高了代理评估的效率。该方法能够从小的任务子集中估计完整基准分数，尽管小子集可能导致不准确的分数。HSPR利用源适应响应因素和不确定的群体成功率，更新目标潜在状态和群体率的后验分布。通过观察成功和未查询任务的后验预测计数，最终估计使用中位数进行校准，显著降低了评估误差。'}}}, {'id': 'https://huggingface.co/papers/2610.25861', 'title': 'ActionRoPE: action as coordinates for spatially consistent control in planar-camera game world models', 'url': 'https://huggingface.co/papers/2610.25861', 'abstract': 'Abstract ActionRoPE encodes action-driven camera motion into world-coordinate rotary positions for consistent spatial control, paired with coordinate-conditioned noise scheduling to stabilize observed regions before generating new content.  Generated by thinkingmachines/Inkling-Small Game world models have made rapid progress toward real-time interactive generation. Yet action control is still predominantly implemented as feature conditioning, leaving the model to learn from training data how each action should move the visual world. This formulation is poorly matched to a broad class of planar-camera worlds, such as top-down and isometric games. In these worlds, player motion induces a geometrically well-defined planar camera displacement. We observe that the key to spatially consistent control in such worlds is to represent the effect of each action directly in world coordinates. To this end, we introduce ActionRoPE, a parameter-free action interface that converts action-driven camera displacement into world-coordinate rotary positions. As a result, tokens corresponding to the same world location retain the same positional address across time. These world coordinates further expose a spatial asymmetry in generation: regions covered by the initial observation are geometrically known, while newly revealed regions remain to be synthesized. We therefore propose Coordinate-Conditioned Noise Scheduling (CNS), which assigns token-wise denoising schedules according to this known-new structure. It allows observed regions to stabilize earlier, while new content is generated with reference to them. Compared with four representative action-conditioning mechanisms, our approach follows the commanded motion more faithfully and reduces the revisit drift by 66% over the strongest baseline. The same interface transfers across video backbones from 1.3B to 33B parameters and to out-of-distribution scenes. Project Page: https://teawhite.cn/ActionRoPE/', 'score': 4, 'issue_id': 3437, 'pub_date': '2026-10-19', 'pub_date_card': {'ru': '19 октября', 'en': 'October 19', 'zh': '10月19日'}, 'hash': '66bb05c4745d0f93', 'authors': ['Zhiyang Deng', 'Yuzhe Wu', 'Zijun Lin', 'Yeying Jin'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2610.25861.jpg', 'data': {'categories': ['#games', '#agents', '#architecture', '#video', '#diffusion'], 'emoji': '🎮', 'ru': {'title': 'Действие задаёт координаты: игровой мир, который не плывёт', 'desc': 'Авторы предлагают ActionRoPE — параметрически бесплатный интерфейс, который переводит смещение камеры, вызванное действиями игрока, в мировые координаты для rotary positional embeddings. Это позволяет токенам одной и той же точки мира сохранять одинаковый позиционный адрес во времени, что особенно важно для планарных игр вроде top-down и изометрических. Дополнительно метод Coordinate-Conditioned Noise Scheduling (CNS) назначает токенам разные расписания денойзинга: уже наблюдаемые области стабилизируются раньше, а новые генерируются с опорой на них. По сравнению с четырьмя базовыми механизмами action-conditioning подход точнее следует командам движения и снижает дрейф при повторных посещениях на 66%, при этом хорошо переносится на видео-бэкбоны от 1.3B до 33B параметров.'}, 'en': {'title': 'ActionRoPE: Consistent Camera Control in Game Worlds', 'desc': 'ActionRoPE is a novel method that encodes camera movements based on player actions into world coordinates, ensuring consistent spatial control in interactive environments like games. By directly translating actions into rotary positions, it maintains the same positional references for tokens over time, which is crucial for planar-camera worlds. The method also introduces Coordinate-Conditioned Noise Scheduling (CNS), which optimizes the generation of new content by stabilizing known regions before synthesizing new ones. This approach significantly improves the accuracy of action control and reduces drift in generated scenes compared to existing methods.'}, 'zh': {'title': '一致的空间控制与动作驱动相机运动', 'desc': 'ActionRoPE是一种将动作驱动的相机运动编码为世界坐标旋转位置的方法，以实现一致的空间控制。它结合了坐标条件噪声调度，能够在生成新内容之前稳定观察区域。通过直接在世界坐标中表示每个动作的效果，ActionRoPE使得相同世界位置的标记在时间上保持相同的位置信息。与传统的动作条件机制相比，该方法在遵循指令运动方面表现更好，并显著减少了重访漂移。'}}}, {'id': 'https://huggingface.co/papers/2610.09496', 'title': 'Sparse Feature Policy Unlearning Mitigates State Hallucination in Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2610.09496', 'abstract': 'Abstract Researchers identify state hallucination in vision-language-action models and propose sparse feature unlearning to reduce failure behaviors while preserving manipulation skills.  Generated by thinkingmachines/Inkling-Small Vision-Language-Action (VLA) models have shown strong generalization in robotic manipulation by leveraging rich representations from pretrained vision-language models. However, their deployment in real-world environments remains limited by recurring unreliable behaviors. In this work, we study state hallucination, a recurring failure pattern in which a VLA continues acting as if an unrealized robot-object state had been achieved. Our analyses find that state hallucination coincides with weakened attention to task-relevant visual regions, and a mechanistic interpretation via sparse autoencoders reveals that hallucination-associated sparse features are activated when these failures occur. Based on this analysis, we propose SOUL (Sparse feature pOlicy UnLearning), which selectively unlearns policy knowledge associated with state hallucination behaviors, where sparse features identified from hallucination failures and successful behaviors serve as explicit forgetting and retention targets, respectively. Experiments across VLA architectures in simulated and real-world environments show that our method substantially reduces hallucinated failures and improves task success without substantially compromising the existing manipulation capabilities. These results suggest that interpretable feature analysis provides a practical basis for selectively modifying undesirable knowledge in robot policies.', 'score': 4, 'issue_id': 3437, 'pub_date': '2026-10-07', 'pub_date_card': {'ru': '7 октября', 'en': 'October 7', 'zh': '10月7日'}, 'hash': 'e18d98d05c2b600e', 'authors': ['Jiho Lee', 'Jeongeun Park', 'Heayoun Choi', 'Taekyung Kim', 'Eunwoo Kim'], 'affiliations': ['1', '2', '3'], 'pdf_title_img': 'assets/pdf/title_img/2610.09496.jpg', 'data': {'categories': ['#multimodal', '#optimization', '#robotics', '#training', '#interpretability', '#hallucinations', '#cv'], 'emoji': '🤖', 'ru': {'title': 'Учим робота забывать ложные представления о мире, сохраняя навыки', 'desc': 'Авторы исследуют state hallucination в Vision-Language-Action (VLA) моделях, когда робот продолжает действовать так, будто нужное состояние робота и объекта уже достигнуто, хотя это не так. Анализ показывает, что такие сбои совпадают с ослаблением внимания к релевантным визуальным областям, а с помощью sparse autoencoders видно, что за них отвечают определённые разреженные признаки. На основе этого предложен метод SOUL (Sparse feature pOlicy UnLearning), который избирательно разучивает поведение, связанное с галлюцинациями, используя признаки из неудачных и успешных попыток как цели забывания и сохранения. Эксперименты в симуляции и реальном мире показывают, что метод заметно снижает число ошибок и повышает успешность задач без существенной потери навыков манипуляции.'}, 'en': {'title': 'Unlearning Hallucinations for Reliable Robot Actions', 'desc': "This paper addresses the issue of state hallucination in vision-language-action (VLA) models used for robotic manipulation. State hallucination occurs when the model behaves as if a certain state has been achieved, even when it hasn't, leading to unreliable actions. The authors introduce a method called Sparse feature pOlicy UnLearning (SOUL) that focuses on unlearning specific features associated with these hallucination failures while retaining useful manipulation skills. Their experiments demonstrate that SOUL effectively reduces these failures and enhances task success in both simulated and real-world scenarios."}, 'zh': {'title': '减少状态幻觉，提升机器人操作能力', 'desc': '本研究识别了视觉-语言-动作模型中的状态幻觉现象，并提出了稀疏特征遗忘的方法，以减少失败行为，同时保留操作技能。通过利用预训练的视觉-语言模型的丰富表示，生成的模型在机器人操作中表现出强大的泛化能力。然而，在真实环境中的应用受到反复出现的不可靠行为的限制。我们提出的SOUL方法通过选择性地遗忘与状态幻觉行为相关的策略知识，显著减少了幻觉失败，提高了任务成功率，而不显著影响现有的操作能力。'}}}, {'id': 'https://huggingface.co/papers/2610.21791', 'title': 'RSIFlow: Adaptive Self-Improvement Workflows with an Evolving Meta-Agent', 'url': 'https://huggingface.co/papers/2610.21791', 'abstract': 'Abstract RSIFlow is a recursive self-improvement framework that dynamically selects component-specific workflows based on execution feedback and evolves a meta-agent to refine orchestration and skills.  Generated by thinkingmachines/Inkling-Small Large language model (LLM) agents have demonstrated strong capabilities in complex tasks, including code generation, tool use, and multi-hop question answering. Existing self-improvement methods enhance agent performance through model optimization, harness evolution, and executable artifact refinement, while recursive self-improvement (RSI) further extends optimization to the improvement mechanisms themselves. However, adapting self-improvement workflows to evolving performance bottlenecks while improving workflow orchestration through execution feedback remains a key challenge. We propose RSIFlow, a Recursive Self-Improvement framework that integrates adaptive workflow orchestration with meta-agent capability evolution. RSIFlow diagnoses performance bottlenecks from task-agent trajectories and environmental feedback to dynamically select component-specific improvement workflows. The meta-agent then distills workflow outcomes into component-specific skills and cross-component principles, evolving its own harness to improve subsequent workflow orchestration. Experiments across six benchmarks and two backbone models show that RSIFlow achieves the SOTA average performance on all benchmarks. Ablation studies further demonstrate the contributions of adaptive workflow orchestration and meta-harness evolution. Code is available at https://github.com/1HUAN1/RSI-Flow.', 'score': 4, 'issue_id': 3436, 'pub_date': '2026-10-15', 'pub_date_card': {'ru': '15 октября', 'en': 'October 15', 'zh': '10月15日'}, 'hash': 'ff9f1d67fcf4b131', 'authors': ['Huan Zhang', 'Mingju Chen', 'Dongxu Zhou', 'Can Lv', 'Sen Cui', 'Faguo Wu', 'Shiji Zhou'], 'affiliations': ['Beihang University', 'Beijing Academy of Artificial Intelligence (BAAI)', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2610.21791.jpg', 'data': {'categories': ['#benchmark', '#agents', '#agi', '#optimization', '#reasoning'], 'emoji': '🔄', 'ru': {'title': 'Агент, который учится улучшать самого себя', 'desc': 'RSIFlow — это фреймворк рекурсивного самосовершенствования, который динамически выбирает workflow для улучшения отдельных компонентов LLM-агентов на основе диагностики узких мест по траекториям выполнения и обратной связи от среды. Мета-агент извлекает из результатов workflow навыки для конкретных компонентов и общие принципы, а затем эволюционирует собственный harness, улучшая последующую оркестрацию. Эксперименты на шести бенчмарках и двух backbone-моделях показывают, что RSIFlow достигает SOTA по средней производительности. Абляции подтверждают вклад адаптивной оркестрации workflow и эволюции meta-harness.'}, 'en': {'title': 'Evolving Agents Through Recursive Self-Improvement', 'desc': 'RSIFlow is a framewo
