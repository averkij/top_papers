s more sensitive to extreme fidelity loss. These results motivate reporting AFL and EFL jointly, particularly when auditing long-horizon agentic tasks. The open-source implementation is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/services/api_checker/ventor_qtest.', 'score': 12, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '482126b422eea35a', 'authors': ['Xiangfan Wu', 'Zonghao Ying', 'Huiyu Wu', 'Xing Zheng', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo'], 'affiliations': ['Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2608.16391.jpg', 'data': {'categories': ['#inference', '#benchmark', '#agents', '#security', '#long_context', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Аудит качества API моделей через анализ верности на длинных последовательностях', 'desc': 'В работе предлагается Ventor-QTest — метод аудита API развёрнутых открытых языковых моделей через повторяющиеся чёрные ящики без доступа к логарифмам вероятностей. Метод измеряет потерю верности моделей двумя способами: среднюю потерю верности (AFL) через распределение категориальных выходов и экстремальную потерю верности (EFL) через анализ хвостов распределения. Авторы показывают, что AFL хорошо коррелирует с логарифмически-производными метриками, а EFL значимо связана с деградацией производительности на долгоактивных задачах. Результаты указывают, что совместный учёт AFL и EFL критичен для аудита моделей в долгоактивных агентных задачах.'}, 'en': {'title': 'Auditing Model APIs: Unveiling Performance with Ventor-QTest', 'desc': 'The paper introduces Ventor-QTest, a method for auditing the performance of hosted open-weight model APIs using black-box testing. It measures two key metrics: average fidelity loss (AFL) and extreme fidelity loss (EFL), which help assess the quality of model outputs over long sequences. By treating model routing as a stochastic process, Ventor-QTest can evaluate APIs without needing internal probability data. The findings suggest that monitoring both AFL and EFL is crucial for understanding performance degradation in long-horizon tasks, especially as task complexity increases.'}, 'zh': {'title': '审计开放模型性能的创新方法', 'desc': 'Ventor-QTest 是一种审计开放权重模型 API 的方法，通过多次黑箱探测来测量平均和极端保真度损失，以检测长期智能体性能的退化。该方法将托管模型路由形式化为随机过程，并提出了一种复合黑箱审计，要求目标 API 不提供概率信息。其重复请求组件通过多次发送固定约束上下文，重建返回文本计数的分类输出分布，并报告经过无偏校正的平均保真度损失（AFL）。长序列组件则通过独立运行报告极端保真度损失（EFL），结果显示在长期任务中，EFL 的显著下降与任务暴露增加相关。'}}}, {'id': 'https://huggingface.co/papers/2608.16033', 'title': 'R^3-Bench: LLMs Struggle with Resource-Rational Reasoning under Shared Budgets', 'url': 'https://huggingface.co/papers/2608.16033', 'abstract': "Abstract R³-Bench reveals that shared computation budgets cause reasoning agents to underperform relative to their single-problem capabilities across math, coding, and abstract reasoning tasks.  Generated by thinkingmachines/Inkling-Small In cognitive science, resource rationality asks how an agent should allocate limited computation to maximize expected value. Most reasoning and agent benchmarks use independent per-task budgets; existing shared-budget studies do not calibrate suite performance against the same model's demonstrated single-problem competence. We introduce R^3-Bench, which evaluates six-problem suites under shared budgets across mathematics, competitive programming, and abstract reasoning in tool-free and agentic settings. Matched single-problem response curves define an offline empirical oracle over observed successes. Across 72 main-table cells for six models, the oracle mean matches or exceeds the contest mean in all cells and is strictly higher in 71. Under moderate tool-free pressure, equal-allocation replay also exceeds contest performance for four of six models. Trajectory diagnostics reveal limited strategy updating and pressure-dependent failure patterns. In a three-model diagnostic under strong agentic pressure, at least one fixed scheduler exceeds the contest mean in six of nine cells, but no policy dominates across domains. These results expose a persistent gap between demonstrated competence and shared-budget realization.", 'score': 11, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '8aba855938f4491b', 'authors': ['Peisong Wang', 'Zhiwei Ma', 'Bowen Liu', 'Feixue Liu', 'Aochuan Chen', 'Chenyi Zi', 'Hongchuan Zeng', 'Yuhan Li', 'Jia Li'], 'affiliations': ['Hunyuan Team, Tencent', 'The Hong Kong University of Science and Technology (Guangzhou)', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2608.16033.jpg', 'data': {'categories': ['#agents', '#plp', '#benchmark', '#math'], 'emoji': '⚖️', 'ru': {'title': 'Как правильно распределить вычисления между задачами для агентов рассуждения', 'desc': 'В работе представлен бенчмарк R³-Bench, который исследует, как агенты с рассуждением справляются с задачами при ограниченном вычислительном бюджете, распределённом между несколькими проблемами. Исследователи обнаружили, что при совместном использовании бюджета производительность моделей значительно снижается по сравнению с их способностью решать отдельные задачи независимо. Работа вводит концепцию resource rationality из когнитивной науки и показывает, что стратегии распределения вычислений существенно влияют на итоговую производительность на наборах задач из математики, программирования и абстрактного рассуждения. Результаты выявляют критический разрыв между потенциальными возможностями моделей и их реальной эффективностью в условиях ограниченных ресурсов.'}, 'en': {'title': 'Bridging the Gap: R³-Bench Reveals Limits of Shared Computation in Reasoning Agents', 'desc': "The paper introduces R³-Bench, a new benchmark that evaluates how reasoning agents perform when they share a limited computation budget across multiple tasks, such as math, coding, and abstract reasoning. It highlights that agents often underperform when they have to divide their resources, compared to their performance on single tasks. The study shows that using a matched single-problem response curve can help set a standard for evaluating performance, revealing that agents can achieve better results when their strategies are adjusted based on the task demands. Overall, the findings indicate a significant gap between an agent's individual capabilities and their performance under shared computational constraints."}, 'zh': {'title': '共享预算下的推理能力挑战', 'desc': 'R³-Bench揭示了共享计算预算导致推理代理在数学、编程和抽象推理任务中的表现低于其单一问题能力。该研究探讨了资源理性，分析代理如何在有限的计算资源下最大化预期价值。我们引入R^3-Bench，评估在共享预算下的六个问题套件，涵盖数学、竞争编程和抽象推理。结果显示，尽管存在共享预算的限制，某些模型在特定条件下仍能超越比赛表现，揭示了展示能力与共享预算实现之间的差距。'}}}, {'id': 'https://huggingface.co/papers/2608.16884', 'title': 'Improving the matrix multiplication exponent with modern optimization and AlphaEvolve', 'url': 'https://huggingface.co/papers/2608.16884', 'abstract': 'Abstract Refinements to combination loss analysis via reformulated optimization, machine learning-based algorithms, and AlphaEvolve yield an improved upper bound on the matrix multiplication exponent.  Generated by thinkingmachines/Inkling-Small The current best bounds on the matrix multiplication exponent ω are obtained through a refinement of the laser method called combination loss analysis (Duan et al., 2022; Williams et al., 2024; Alman et al., 2025). In this note, we address the optimization problem at the core of this approach and propose several improvements. First, we reformulate the optimization problem allowing us to solve it in a larger setting than was previously possible. Second, we leverage recent advances in machine learning to design a new optimization algorithm for this problem. Finally, we refine the resulting optimization algorithm with AlphaEvolve. Our combined approach yields an upper bound of ω < 2.371177, improving the previous best bound of 2.371339.', 'score': 10, 'issue_id': 3018, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': 'dccf5899b45b0aa3', 'authors': ['Emilien Dupont', 'Marvin Eisenberger', 'Borislav Kozlovskii', 'Abbas Mehrabian', 'Francisco J. R. Ruiz', 'Abigail See', 'Renfei Zhou', 'Josh Alman', 'Virginia Vassilevska Williams', 'Matej Balog'], 'affiliations': ['Carnegie Mellon University', 'Columbia University', 'Google DeepMind', 'MIT'], 'pdf_title_img': 'assets/pdf/title_img/2608.16884.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Машинное обучение для оптимизации матричного умножения', 'desc': 'В этой работе авторы улучшают анализ комбинированной функции потерь, которая используется для получения верхних границ показателя матричного умножения ω. Они переформулируют оптимизационную задачу, что позволяет решать её в более широком пространстве параметров, чем было возможно ранее. Затем они разрабатывают новый алгоритм оптимизации, используя достижения в области машинного обучения и применяют метод AlphaEvolve для дальнейшего совершенствования. В результате комбинированного подхода им удаётся улучшить верхнюю границу с ω < 2.371339 до ω < 2.371177.'}, 'en': {'title': 'Optimizing Matrix Multiplication with Machine Learning Innovations', 'desc': 'This paper presents enhancements to the analysis of combination loss in the context of matrix multiplication exponent optimization. By reformulating the optimization problem, the authors expand the solution space, allowing for more effective problem-solving. They also introduce a novel machine learning-based algorithm to tackle this optimization challenge, which is further refined using a technique called AlphaEvolve. As a result, the authors achieve a new upper bound on the matrix multiplication exponent, improving upon previous limits.'}, 'zh': {'title': '优化矩阵乘法指数的新方法', 'desc': '本文提出了一种改进的组合损失分析方法，通过重新制定优化问题，结合机器学习算法和AlphaEvolve，得到了矩阵乘法指数的更优上界。我们首先重新构建了优化问题，使其在更大的范围内可解。其次，利用机器学习的最新进展，设计了一种新的优化算法。最终，通过AlphaEvolve对优化算法进行精细化处理，得到了ω < 2.371177的上界，优于之前的2.371339。'}}}, {'id': 'https://huggingface.co/papers/2608.16765', 'title': 'TRACE-Bench: Decomposing and Diagnosing Multi-Reference Image Generation', 'url': 'https://huggingface.co/papers/2608.16765', 'abstract': 'Abstract This work proposes a compositional operator framework and TRACE-Bench to diagnose multi-reference image generation capabilities across atomic operations.  Generated by thinkingmachines/Inkling-Small Despite recent advances in unified multimodal models for multi-reference image generation, existing benchmarks remain organized around predefined task types (e.g., "subject composition"), which are ill-suited to this combinatorial setting and lead to fragmented coverage, uncontrolled complexity, and little diagnostic value. Recognizing that diverse multi-reference tasks share a common set of atomic operations, we adopt a capability-oriented perspective and formalize four operators: Anchor (f), Disentangle (g), Apply (oplus), and Compose (C). Any multi-reference prompt can then be represented as a compositional formula over these operators, whose structural complexity is quantified by the number of operator slots. Building on this formulation, we construct TRACE-Bench, comprising approximately 1,600 evaluation cases across slot counts 1--8, built from 631 formula templates and around 4,000 reference images spanning diverse artistic styles and real-world subjects. The formula structure directly drives an operator-aligned evaluation protocol for per-capability scoring and a diagnostic tree analysis for recursive failure localization. Evaluating 9 leading models reveals insights invisible to holistic scoring: the primary bottleneck lies in disentanglement (g) and attribute binding (oplus) rather than scene-level composition (C), with even the best model scoring only 0.74 on attribute fidelity. Project page: https://amuseum-whr.github.io/TraceBench', 'score': 9, 'issue_id': 3023, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': 'ec7d4563e0f641c5', 'authors': ['Haoran Wang', 'Chaofan Ma', 'Ran Yi', 'Lizhuang Ma'], 'affiliations': ['Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16765.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#cv', '#dataset'], 'emoji': '🎨', 'ru': {'title': 'Диагностика генерации многоисточниковых изображений через элементарные операции', 'desc': 'Работа предлагает композиционный фреймворк и бенчмарк TRACE-Bench для диагностики возможностей генерации изображений с несколькими источниками через элементарные операции. Авторы формализуют четыре ключевых оператора - Anchor, Disentangle, Apply и Compose - которые позволяют представить любой многоисточниковый запрос как композиционную формулу. На основе этой формализации построен бенчмарк с 1600 примерами оценки, охватывающими различные комбинаторные сложности операций. Оценка девяти ведущих моделей выявила, что основное узкое место находится в операциях разделения признаков и привязки атрибутов, а не в композиции сцены.'}, 'en': {'title': 'Unraveling Image Generation: A New Framework for Multi-Reference Tasks', 'desc': 'This paper introduces a new framework called TRACE-Bench to evaluate how well models can generate images based on multiple references. It identifies four key atomic operations—Anchor, Disentangle, Apply, and Compose—that can be combined to form complex image generation tasks. By using these operations, the authors create a structured way to assess model performance, focusing on specific capabilities rather than just overall results. The findings show that many models struggle particularly with disentangling attributes and binding them correctly, highlighting areas for improvement in multi-reference image generation.'}, 'zh': {'title': '组合运算符框架：提升多参考图像生成能力的关键', 'desc': '本文提出了一种组合运算符框架和TRACE-Bench，用于诊断多参考图像生成能力。尽管统一的多模态模型在多参考图像生成方面取得了进展，但现有基准测试仍然围绕预定义的任务类型组织，导致覆盖面碎片化和复杂性失控。我们识别出多样的多参考任务共享一组原子操作，并正式化了四个运算符：Anchor、Disentangle、Apply和Compose。通过这种结构化的公式表示，我们构建了TRACE-Bench，包含约1600个评估案例，揭示了模型在解耦和属性绑定方面的主要瓶颈。'}}}, {'id': 'https://huggingface.co/papers/2608.14718', 'title': 'VideoGAIA: A Benchmark for General AI Assistants on Agentic Video Understanding', 'url': 'https://huggingface.co/papers/2608.14718', 'abstract': 'Abstract VideoGAIA introduces a multi-turn, tool-augmented benchmark that evaluates agentic video understanding for advanced multimodal models through complex real-world tasks.  Generated by thinkingmachines/Inkling-Small Video understanding is a fundamental task for evaluating the capabilities of multimodal large language models (MLLMs). However, existing leading models have already achieved approximately 90% accuracy on the Video-MME leaderboard, suggesting that conventional single-turn video understanding tasks are becoming increasingly saturated and insufficient for assessing the intelligence of advanced MLLMs. Towards this end, we introduce VideoGAIA, an agentic video understanding benchmark for general artificial intelligence (AI) assistants. Moving beyond one-shot video question answering, VideoGAIA formulates video understanding as a multi-turn, tool-augmented interaction process, where models must iteratively perceive videos, invoke external tools, gather complementary information, and integrate multimodal evidence across turns. VideoGAIA contains 271 model-human co-designed tasks covering diverse and complex real-world scenarios. Each video-question-answer instance is independently verified by three human experts to ensure both correctness and appropriate difficulty. All evaluated MLLMs, including frontier models such as GPT-5.5 and Kimi-K3, achieve less than 60% accuracy on VideoGAIA, highlighting its value as a high-quality and timely benchmark for evaluating next-generation MLLMs. We hope that VideoGAIA will facilitate the transition from conventional video understanding toward agentic video understanding.', 'score': 9, 'issue_id': 3018, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '7602716601936ff4', 'authors': ['Fan Zhang', 'Guangming Yao', 'Jinyang Wu', 'Hao Wu', 'Zheng Lian', 'Xinyu Geng', 'Jingdong Chen', 'Yi Yuan', 'Pheng-Ann Heng'], 'affiliations': ['Ant Group', 'The Chinese University of Hong Kong', 'The Hong Kong University of Science and Technology', 'Tongji University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14718.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#video', '#agents', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'От пассивного анализа к активному агентному пониманию видео', 'desc': 'VideoGAIA представляет собой новый бенчмарк для оценки способностей многомодальных больших языковых моделей в задачах понимания видео. В отличие от существующих тестов, где модели достигают ~90% точности, VideoGAIA формулирует понимание видео как многошаговый процесс взаимодействия с инструментами, где модели должны итеративно анализировать видео, вызывать внешние инструменты и интегрировать мультимодальные доказательства. Бенчмарк содержит 271 сложную задачу реального мира, разработанные совместно людьми и моделями, где все современные MLLM показывают менее 60% точности. Это демонстрирует переход от простого ответа на вопросы о видео к агентному пониманию видео с использованием инструментов.'}, 'en': {'title': 'Elevating Video Understanding: From Single-Turn to Multi-Turn Interactions', 'desc': 'VideoGAIA is a new benchmark designed to test advanced multimodal large language models (MLLMs) on their ability to understand videos through complex tasks. Unlike traditional single-turn video understanding, it requires models to engage in multi-turn interactions, using external tools and integrating information over several steps. This approach aims to better assess the intelligence of AI assistants by simulating real-world scenarios that demand deeper comprehension and reasoning. The benchmark includes 271 tasks that have been carefully verified for accuracy and difficulty, revealing that even top models struggle with this new challenge, indicating its significance in advancing AI capabilities.'}, 'zh': {'title': 'VideoGAIA：迈向智能视频理解的新基准', 'desc': 'VideoGAIA是一个多轮工具增强基准，旨在评估多模态大语言模型在复杂现实任务中的视频理解能力。现有的模型在单轮视频理解任务上已接近90%的准确率，显示出这些传统任务的饱和性。VideoGAIA通过多轮交互过程，将视频理解转化为一个需要模型迭代感知、调用外部工具和整合多模态证据的任务。该基准包含271个由模型和人类共同设计的任务，确保了评估的准确性和适当的难度。'}}}, {'id': 'https://huggingface.co/papers/2608.14441', 'title': 'PACE-Bench: Benchmarking Physics Adaptation via Code Evolution in Dynamic Environments', 'url': 'https://huggingface.co/papers/2608.14441', 'abstract': 'Abstract PACE-Bench evaluates self-evolving agents on physics adaptation tasks requiring iterative code redesign after environmental mutations, revealing that simulator-grounded reflection outperforms unverified self-revision but mechanism redesign remains a major bottleneck.  Generated by thinkingmachines/Inkling-Small Self-evolving agents improve future behavior from interaction experience, yet existing evaluations typically optimize under fixed execution conditions and do not test recovery after those conditions change. To address this gap, we introduce PACE-Bench (Physics Adaptation via Code Evolution), a simulator-grounded benchmark of 144 source-to-target adaptation pairs across six physics domains. Each pair links a source environment to a mutated target environment with the same goal and interface. A code-driven design that succeeds in the source fails in the target, where agents must iteratively adapt it into a working target design using diagnostic sandbox feedback within a limited attempt budget. We compare ten self-evolving methods from four paradigms. The benchmark remains far from saturated: Reflexion + Qwen3-14B succeeds on only 35.9\\% of full-benchmark pairs, while GPT-5.5 solves 66.7\\% of the Statics subset under the full budget. Together, these results show that simulator-grounded reflection is more reliable than unverified self-revision, while memory anchors agents to early designs and broad tree search explores without converging. Even revealing exact physical changes does not raise the performance ceiling, pointing to mechanism redesign rather than parameter inference as the central bottleneck. Data and code are available at https://github.com/thunlp/PACE-Bench.', 'score': 8, 'issue_id': 3018, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'e2842a7cb226def0', 'authors': ['Yuhao Zhan', 'Bingxiang He', 'Zecong Tang', 'Chaojun Xiao'], 'affiliations': ['Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14441.jpg', 'data': {'categories': ['#dataset', '#benchmark', '#reasoning', '#optimization', '#agents', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Адаптивные агенты через проверку и переделку кода при изменении физики', 'desc': 'В статье представлена PACE-Bench — новый бенчмарк для оценки самоэволюционирующих агентов, которые должны адаптировать код при изменении физического окружения. Агентам требуется итеративно переделывать дизайн решения, используя обратную связь от симулятора, когда исходная стратегия перестаёт работать в новых условиях. Исследование показывает, что рефлексия на основе симулятора эффективнее неверифицированной саморевизии, однако главным узким местом остаётся переразработка физических механизмов, а не уточнение параметров. Даже при наличии информации об точных физических изменениях агенты испытывают трудности с достижением высокой производительности на полном наборе задач.'}, 'en': {'title': 'Adapting Agents: Overcoming Redesign Challenges in Evolving Environments', 'desc': 'The paper introduces PACE-Bench, a benchmark designed to evaluate self-evolving agents in adapting to changes in physics environments. It highlights the importance of simulator-grounded reflection over unverified self-revision for improving agent performance. The study reveals that while some self-evolving methods show promise, there is still a significant challenge in redesigning mechanisms to adapt successfully. Overall, the findings suggest that understanding and addressing the redesign bottleneck is crucial for advancing self-evolving agent capabilities.'}, 'zh': {'title': '自我进化代理的物理适应新基准', 'desc': 'PACE-Bench是一个评估自我进化代理在物理适应任务中的基准，要求在环境变化后进行迭代代码重设计。研究表明，基于模拟器的反思方法比未经验证的自我修正更有效，但机制重设计仍然是一个主要瓶颈。该基准包含144对源环境和变异目标环境，代理需要在有限的尝试预算内适应代码以实现目标。结果显示，尽管一些方法表现良好，但整体性能仍有很大提升空间，强调了机制重设计的重要性。'}}}, {'id': 'https://huggingface.co/papers/2608.16143', 'title': 'AnyTalk: Speech Animation for Arbitrary Characters Leveraging a Video Generation Model', 'url': 'https://huggingface.co/papers/2608.16143', 'abstract': 'Abstract AnyTalk generates 3D speech animations for arbitrary characters without animation data by adapting video diffusion models via character-specific fine-tuning and optimizing blendshape parameters from synthesized talking-head videos, with a distilled real-time variant.  Generated by thinkingmachines/Inkling-Small We present AnyTalk, a novel method for generating 3D speech animations for arbitrary characters without requiring any animation data. While existing audio-driven 3D speech animation methods rely on character-specific training data or laborious rigging/re-meshing, AnyTalk circumvents these limitations by leveraging recent video diffusion models trained on extensive video datasets. We first adapt a pre-trained video diffusion model to a target character through our Character-specific Fine-tuning (CsF) technique. By fine-tuning on rendered images of the 3D character paired with zeroed-out audio embeddings (representing "no motion"), we eliminate the need for animation data while preserving the motion prior of large-scale video diffusion model. We then uplift the resulting talking-head video into a 3D speech animation by estimating blendshape parameters through a proposed optimization process. AnyTalk enables lip-synced animations across diverse face meshes and blendshape configurations, significantly reducing manual effort and data requirements. We further enhance usability by distilling AnyTalk into a streamlined network, AnyTalk_{RT}, thereby enabling real-time performance. By leveraging talking-head video generation, our method broadens access to audio-driven speech animation technology for arbitrary characters. The code is publicly available at https://serin-yoon.github.io/projects/anytalk/.', 'score': 5, 'issue_id': 3020, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '15fbe278e78fb347', 'authors': ['Kwan Yun', 'Serin Yoon', 'Sunjin Jung', 'Jung Eun Yoo', 'Inyup Lee', 'Junyong Noh'], 'affiliations': ['KAIST', "Sungshin Women's University"], 'pdf_title_img': 'assets/pdf/title_img/2608.16143.jpg', 'data': {'categories': ['#3d', '#audio', '#diffusion', '#open_source', '#training', '#video'], 'emoji': '🗣️', 'ru': {'title': 'Речь любого персонажа — анимация без данных', 'desc': 'AnyTalk — это метод для создания 3D-анимаций речи для любых персонажей без необходимости в данных анимации. Авторы адаптируют предварительно обученную видео-диффузионную модель к целевому персонажу через технику Character-specific Fine-tuning, используя только рендированные изображения персонажа без движения. Затем они преобразуют полученное видео говорящей головы в 3D-анимацию путём оптимизации параметров блендшейпов. Для повышения практического применения авторы также создали дистиллированный вариант AnyTalk_RT, позволяющий выполнять анимацию в реальном времени.'}, 'en': {'title': 'Revolutionizing 3D Speech Animation Without Animation Data', 'desc': 'AnyTalk is a new method for creating 3D speech animations for any character without needing specific animation data. It uses video diffusion models that have been trained on large datasets and fine-tunes them for individual characters through a process called Character-specific Fine-tuning (CsF). This approach allows the generation of lip-synced animations by estimating blendshape parameters from talking-head videos, thus avoiding the complexities of traditional animation methods. Additionally, AnyTalk has a real-time version, making it easier to use for various applications.'}, 'zh': {'title': 'AnyTalk：无动画数据的3D语音动画生成', 'desc': 'AnyTalk是一种新颖的方法，可以为任意角色生成3D语音动画，而无需动画数据。它通过角色特定的微调技术，适应预训练的视频扩散模型，从而避免了传统方法对特定训练数据的依赖。该方法通过优化混合形状参数，将生成的说话视频提升为3D语音动画，显著减少了手动工作和数据需求。AnyTalk还提供了实时性能的简化网络版本，进一步提高了可用性。'}}}, {'id': 'https://huggingface.co/papers/2608.12898', 'title': 'NaviDC-OCR: Navigating Document Parsing Across Digital and Camera-Captured Documents', 'url': 'https://huggingface.co/papers/2608.12898', 'abstract': 'Abstract NaviDC-OCR is a unified vision-language framework that integrates deformation-aware learning, adaptive layout sampling, and decoupled content-structure training to improve document parsing accuracy and structural reasoning.  Generated by thinkingmachines/Inkling-Small Document parsing aims to transform unstructured documents into structured and machine-readable representations. Recent advances in Vision-Language Models (VLMs) have significantly advanced document parsing. However, existing approaches still face two major challenges. First, decoupled VLM-based methods heavily rely on accurate layout analysis, where geometric distortions in camera-captured documents can introduce cascading errors. Second, although end-to-end VLM-based methods alleviate the dependence on explicit layout detection, they often suffer from redundant generation, hallucinations, and insufficient structural reasoning in high-resolution scenarios. To address these challenges, we propose NaviDC-OCR, a unified framework for document parsing. NaviDC-OCR introduces deformation-aware learning to incorporate geometric perception into VLMs and proposes an adaptive sampling mechanism for complex layout representation. Furthermore, a content-structure decoupled learning strategy is developed to explicitly model formula grammars and table structures, enabling more effective structured representation learning. Extensive experiments demonstrate that NaviDC-OCR achieves state-of-the-art performance across diverse document parsing benchmarks. It obtains overall scores of 96.87, 88.53 and 78.41 on OmniDocBench v1.6, Wild-OmniDocBench, and PureDocBench, respectively, and ranks first in the ICDAR 2026 Sci-ImageMiner Challenge. These results validate the effectiveness and generalization capability of NaviDC-OCR in complex document parsing scenarios.', 'score': 5, 'issue_id': 3017, 'pub_date': '2026-08-13', 'pub_date_card': {'ru': '13 августа', 'en': 'August 13', 'zh': '8月13日'}, 'hash': '376616dc3b121c6e', 'authors': ['Peng Cai', 'Zhaofan Zou', 'Shifa Liu', 'Yikun Wang', 'Jiawei Tang', 'Kaicheng Yang', 'Meng Tong', 'Zhongjiang He', 'Hao Sun'], 'affiliations': ['China Telecom Artificial Intelligence Technology (Beijing) Co., Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2608.12898.jpg', 'data': {'categories': ['#multimodal', '#hallucinations', '#cv', '#reasoning', '#benchmark'], 'emoji': '📄', 'ru': {'title': 'Восприятие деформаций и структурного анализа в документообороте через vision-language модели', 'desc': 'NaviDC-OCR — это единая архитектура на основе vision-language моделей для распознавания и структурирования документов. Система использует обучение с учётом деформаций для восприятия геометрических искажений в отсканированных документах и адаптивную выборку для представления сложных макетов. Фреймворк применяет отделённое обучение содержания и структуры, что позволяет более эффективно моделировать формулы и таблицы без избыточной генерации текста. Метод достигает лучших результатов на множестве бенчмарков и занял первое место в конкурсе ICDAR 2026.'}, 'en': {'title': 'Revolutionizing Document Parsing with NaviDC-OCR', 'desc': 'NaviDC-OCR is a new framework designed to improve the accuracy of document parsing by combining vision and language processing. It addresses challenges in existing methods, such as errors from layout analysis and issues with generating redundant or inaccurate content. The framework uses deformation-aware learning to better understand document layouts and an adaptive sampling method to handle complex structures. By separating content and structure in its training approach, NaviDC-OCR enhances the ability to represent documents accurately, achieving top performance in various benchmarks.'}, 'zh': {'title': 'NaviDC-OCR：提升文档解析的智能框架', 'desc': 'NaviDC-OCR 是一个统一的视觉-语言框架，旨在提高文档解析的准确性和结构推理能力。它结合了变形感知学习、自适应布局采样和内容-结构解耦训练，以应对现有方法在布局分析和高分辨率场景中的挑战。通过引入几何感知，NaviDC-OCR 能够更好地处理文档中的几何扭曲，并通过解耦学习策略有效建模公式语法和表格结构。实验结果表明，NaviDC-OCR 在多个文档解析基准测试中表现优异，验证了其在复杂文档解析场景中的有效性和泛化能力。'}}}, {'id': 'https://huggingface.co/papers/2608.15698', 'title': 'ConceptFormer: Learning Adaptive Latent Concepts for Query-Document Alignment in Visual Document Retrieval', 'url': 'https://huggingface.co/papers/2608.15698', 'abstract': 'Abstract ConceptFormer learns continuous latent concept representations to bridge visual evidence and semantic relevance for visual document retrieval without relying on text intermediates or raw visual annotations.  Generated by thinkingmachines/Inkling-Small Visual document retrieval is a critical component of multimodal retrieval-augmented generation, aiming to identify query-relevant pages from document collections where evidence is distributed across text, layout, charts, and visual structures. Recent efforts toward finer-grained supervision primarily rely on textual descriptions or localized visual regions as evidence proxies. However, such supervision signals may either overlook complex visual structures or provide incomplete and inaccurate representations of the underlying evidence. To address these limitations, we propose ConceptFormer, a latent concept representation learning framework for visual document retrieval. ConceptFormer models query-relevant evidence as continuous, query-conditioned latent concepts that explicitly bridge localized visual evidence and semantic relevance, without requiring either textual intermediate representations or direct reliance on raw visual annotations. During training, ConceptFormer employs a strong vision-language model to dynamically determine the number of latent concept tokens and uses these concepts as an intermediate representation to bridge the semantic gap between queries and documents, thereby guiding the learning of the embedding space. Experiments on diverse visual document retrieval benchmarks demonstrate that ConceptFormer achieves 16.7\\% and 22.1\\% relative improvements in average NDCG@10 over the strongest visual retrieval baseline and the strongest OCR-based text retrieval baseline, respectively. Further analysis reveals that latent concepts effectively connect localized visual evidence with semantic relevance, enabling the retriever to capture both fine-grained textual cues and complex document-level visual structures while preserving strong retrieval alignment. Codes and data are available at https://github.com/Neuir/ConceptFormer.', 'score': 4, 'issue_id': 3018, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '0d805fc729a162ac', 'authors': ['Peng Chunyi', 'Xu Zhipeng', 'Yan Yukun', 'Liu Zhenghao', 'Yu Shi', 'Mei Sen', 'Sun Yubo', 'Zhang Yongheng', 'Zhou Jie', 'Gu Yu', 'Yu Ge', 'Sun Maosong'], 'affiliations': ['Northeastern University', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2608.15698.jpg', 'data': {'categories': ['#rag', '#cv', '#multimodal', '#benchmark'], 'emoji': '📄', 'ru': {'title': 'Мостик из скрытых концепций между визуальными признаками и семантической релевантностью', 'desc': 'ConceptFormer — это фреймворк для обучения представлениям скрытых концепций, который решает задачу поиска визуальных документов без использования текстовых промежуточных представлений. Система моделирует релевантные запросу доказательства как непрерывные, условные на запрос латентные концепции, которые явно связывают локализованные визуальные признаки с семантической значимостью. Во время обучения используется мощная vision-language модель для динамического определения количества токенов скрытых концепций, которые служат промежуточным представлением для преодоления семантического разрыва между запросами и документами. Эксперименты показали улучшение метрики NDCG@10 на 16.7% и 22.1% по сравнению с существующими методами визуального поиска и текстового поиска на основе OCR.'}, 'en': {'title': 'Bridging Visual Evidence and Semantic Relevance in Document Retrieval', 'desc': 'ConceptFormer is a framework designed to improve visual document retrieval by learning continuous latent representations of concepts. It connects visual evidence directly to semantic relevance without needing text or raw visual annotations. By using a vision-language model, it dynamically creates latent concept tokens that help bridge the gap between queries and documents. The results show significant improvements in retrieval performance, demonstrating its effectiveness in handling complex visual structures and fine-grained textual cues.'}, 'zh': {'title': 'ConceptFormer：无文本中介的视觉文档检索新方法', 'desc': 'ConceptFormer 是一种学习连续潜在概念表示的框架，旨在通过视觉证据和语义相关性来提升视觉文档检索的效果。它不依赖文本中介或原始视觉注释，而是将查询相关的证据建模为连续的、条件于查询的潜在概念。通过使用强大的视觉-语言模型，ConceptFormer 动态确定潜在概念的数量，并利用这些概念作为中介表示，缩小查询与文档之间的语义差距。实验结果表明，ConceptFormer 在视觉文档检索基准上取得了显著的性能提升，能够有效连接局部视觉证据与语义相关性。'}}}, {'id': 'https://huggingface.co/papers/2608.10679', 'title': 'ENTLORE: A Graph-Grounded Benchmark for Latent Organizational Reasoning in Enterprise Question Answering', 'url': 'https://huggingface.co/papers/2608.10679', 'abstract': 'Abstract ENTLORE is a benchmark framework that evaluates enterprise question answering by requiring recovery of implicit organizational relations across routine documents, revealing that even with gold sources many latent reasoning questions remain unanswered.  Generated by thinkingmachines/Inkling-Small Enterprise question answering is framed as retrieving internal documents and generating grounded answers. Routine enterprise records, however, are work by-products in which required organizational relations remain implicit across heterogeneous sources. Existing benchmarks provide realistic multi-source evidence, but often materialize a predefined answer path and therefore test the composition of stated facts rather than recovery of a target relation absent from the corpus. We call the latter capability latent organizational reasoning.   We introduce ENTLORE, a graph-grounded benchmark construction framework that reconstructs an audited enterprise world from routine documents, authoritative organizational tables, and operational records. Versioned organizational conventions certify derived relations in a truth graph, enabling complete golden answers and proof certificates. The aligned anonymized release exposes only the document corpus while withholding private structure and target relations. ENTLORE contains 2,341 documents from three source types and 907 questions spanning explicit lookup, cross-source composition, and latent organizational reasoning, evaluated across 56 model and access configurations. Structuring the released world as an induced entity graph or navigable knowledge base gives the strongest deployable results. Yet supplying gold documents still leaves 30.4% of latent questions unanswered, versus 12.6% and 6.2% for explicit and compositional questions. Enterprise QA therefore depends not only on document recall, but also on whether implicit organizational relations become usable. The benchmark, data, and code are publicly available at ENTLORE.', 'score': 4, 'issue_id': 3018, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': '1c5e87628bc23634', 'authors': ['Akrin Zheng', 'Alexander Wu', 'Alaia Liu'], 'affiliations': ['ScitiX.ai'], 'pdf_title_img': 'assets/pdf/title_img/2608.10679.jpg', 'data': {'categories': ['#rag', '#dataset', '#benchmark'], 'emoji': '🏢', 'ru': {'title': 'Раскрытие скрытых организационных отношений в корпоративных документах', 'desc': 'ENTLORE — это бенчмарк для оценки систем вопросно-ответных систем в корпоративной среде, которые должны восстанавливать неявные организационные отношения в документах. Система требует не только поиска документов и генерации ответов, но и латентного организационного рассуждения — способности выводить отношения, которые отсутствуют в корпусе. Бенчмарк содержит 2341 документ трёх типов и 907 вопросов, включая простой поиск, композицию информации из разных источников и латентные рассуждения. Исследование показало, что даже при доступе к золотым документам 30.4% вопросов остаются без ответа, что указывает на необходимость развития методов для извлечения и представления неявных связей в данных.'}, 'en': {'title': 'Unlocking Implicit Knowledge in Enterprise Question Answering', 'desc': 'ENTLORE is a new framework designed to assess enterprise question answering by focusing on the retrieval of implicit relationships within organizational documents. It highlights the challenge that even with high-quality data, many reasoning questions about these relationships remain unanswered. The framework constructs a truth graph from various enterprise records, allowing for a more comprehensive evaluation of latent organizational reasoning. By providing a structured approach to document retrieval and question answering, ENTLORE aims to improve the understanding and usability of implicit information in enterprise settings.'}, 'zh': {'title': 'ENTLORE：提升企业问答的隐含推理能力', 'desc': 'ENTLORE是一个基准框架，用于评估企业问答系统，特别是通过恢复隐含的组织关系来处理常规文档。尽管有高质量的数据源，仍然有许多潜在的推理问题未能得到解答。该框架通过重建企业世界的图形结构，结合常规文档和权威的组织表格，提供了完整的黄金答案和证明证书。研究表明，企业问答不仅依赖于文档的检索能力，还取决于隐含的组织关系是否能够被有效利用。'}}}, {'id': 'https://huggingface.co/papers/2608.16003', 'title': 'Prior Audit-Repair Context Shifts LLM Verifier Thresholds Toward Leniency', 'url': 'https://huggingface.co/papers/2608.16003', 'abstract': "Abstract Prior audit and repair episodes in context reduce false alarms by shifting decision thresholds rather than discrimination, with repair content and audit verdict complementarily affecting different model families.  Generated by thinkingmachines/Inkling-Small Automated checking pipelines increasingly place one language model as the checker and another (or the same one) as the fixer. We ask whether that wiring changes what the checker reports. Measuring false alarms on human-verified-correct ProcessBench traces with the present task held byte-identical, we find that a completed audit -> repair episode already in the model's context lowers false alarms in 15 of 15 model x wording combinations, by 2.8 to 11.5 percentage points against a length-matched non-audit control, a 9 to 25% reduction relative to that control. The direction contradicts what the accumulated-message literature predicts: an episode whose audit reported an error lowers false alarms further still, at all five wordings on the model where that manipulation lands cleanly, though a negativity asymmetry predicts more flagging. Decomposing the episode finds repair content and audit verdict complementary: different components carry the effect on different model families. Signal-detection analysis locates the change in the threshold rather than in discrimination -- the criterion moves in 15 of 15 combinations and survives correction in 13 while d' survives in none, though the d' test is half as sensitive by construction -- and a hand audit of 50 false alarms finds 82% simply wrong, so at this operating point the shift need not be harmful. With reasoning enabled the effect keeps its relative size on both models tested, and the threshold reading holds there too.", 'score': 3, 'issue_id': 3019, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '6d40f6ffaab37417', 'authors': ['Parsa Mazaheri', 'Kasra Mazaheri'], 'affiliations': ['Massachusetts Institute of Technology', 'University of California, Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2608.16003.jpg', 'data': {'categories': ['#small_models', '#benchmark', '#training'], 'emoji': '🔍', 'ru': {'title': 'Контекст аудита переучивает модель через смещение порога, а не улучшение различения', 'desc': 'В статье исследуется, как предыдущие эпизоды аудита и исправления ошибок в контексте влияют на решения языковых моделей при проверке кода. Авторы обнаружили, что наличие завершённого цикла аудита и исправления снижает количество ложных срабатываний на 9-25% за счёт смещения порога принятия решений, а не улучшения дискриминативной способности модели. Содержание исправления и результат аудита дополняют друг друга, по-разному влияя на различные семейства моделей. Эффект сохраняется и при включении режима рассуждений, что указывает на универсальность механизма адаптации порога решения.'}, 'en': {'title': 'Reducing False Alarms Through Contextual Audits and Repairs', 'desc': "This paper investigates how prior audit and repair episodes influence the performance of language models in reducing false alarms during automated checking tasks. It finds that having a completed audit and repair episode in the model's context significantly lowers false alarms across various model and wording combinations. The study reveals that the reduction in false alarms is due to a shift in decision thresholds rather than changes in the model's ability to discriminate between correct and incorrect outputs. Additionally, the research highlights that different components of the audit and repair process affect various model families in complementary ways, suggesting a nuanced interaction between these elements."}, 'zh': {'title': '审计与修复：降低错误警报的关键', 'desc': '这篇论文探讨了在机器学习模型中，审计和修复过程如何影响错误警报的发生率。研究发现，先前的审计和修复经历可以通过调整决策阈值来减少错误警报，而不是通过区分能力。不同的修复内容和审计结果对不同的模型家族有互补的影响。通过信号检测分析，研究表明阈值的变化是导致错误警报减少的主要原因，而不是模型的区分能力。'}}}, {'id': 'https://huggingface.co/papers/2608.16435', 'title': 'Drive, Pack, Fly: The Travelling Thief Problem with Drone', 'url': 'https://huggingface.co/papers/2608.16435', 'abstract': "Abstract The Travelling Thief Problem with Drone jointly optimizes ground routing, drone synchronization, and item selection to maximize profit, using mixed-integer programming, metaheuristics, and attention-based deep reinforcement learning with a hybrid refinement approach.  Generated by thinkingmachines/Inkling-Small In collection operations, accumulating payload progressively slows the vehicle, imposing a cumulative penalty on routing efficiency. An onboard drone can offset this penalty by retrieving outlying items, thereby shortening the makespan and increasing operational profit. However, travel time remains load-dependent, and each item collected by the ground vehicle shifts the arrival times that govern the drone's launch and rendezvous points. This paper introduces the Travelling Thief Problem with Drone (TTP-D), which maximises the collected profit, net of a time-based rental cost, by jointly optimising item selection, vehicle routing, and flight synchronisation. We formulate a mixed-integer linear program that solves small instances to optimality, and develop both metaheuristics and an attention-based Deep Reinforcement Learning (DRL) policy for larger instances. We further propose a learner-initialised hybrid solver, in which the DRL policy constructs an initial solution that a short annealing run subsequently refines. On two benchmark sets, this hybrid recovers most of the metaheuristic baseline's quality at a fraction of its computational budget, although the largest instances still require the baseline at its full budget. Finally, a sensitivity analysis reveals that the rental ratio is the primary driver of profitability, whereas the fleet parameters affect profit only at the margin.", 'score': 2, 'issue_id': 3020, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '4129c863d911f911', 'authors': ['Kabir Murjani', 'Abhay Sobhanan'], 'affiliations': ['Indian Institute of Management Bangalore', 'Nirma University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16435.jpg', 'data': {'categories': ['#benchmark', '#architecture', '#games', '#rl', '#optimization'], 'emoji': '🚚', 'ru': {'title': 'Синергия наземного транспорта и дрона: от оптимизации к обучению с подкреплением', 'desc': 'В работе представлена задача коммивояжёра с дроном (TTP-D), которая оптимизирует выбор товаров, маршруты наземного транспорта и синхронизацию полётов дрона для максимизации прибыли. Авторы разработали три подхода: смешанное целочисленное линейное программирование для точного решения малых примеров, метаэвристики для средних задач, и внимательную нейросетевую политику глубокого обучения с подкреплением для крупных экземпляров. Предложен гибридный решатель, где DRL инициализирует начальное решение, которое затем уточняется имитацией отжига за счёт значительного снижения вычислительных затрат. Анализ чувствительности показывает, что стоимость аренды дрона является основным фактором прибыльности, в то время как параметры флота имеют лишь маргинальное влияние.'}, 'en': {'title': 'Maximizing Profit with Ground and Drone Optimization', 'desc': "The paper presents the Travelling Thief Problem with Drone (TTP-D), which aims to optimize the collection of items using both ground vehicles and drones to maximize profit. It employs mixed-integer programming, metaheuristics, and an attention-based deep reinforcement learning approach to tackle the complexities of routing and item selection. The study highlights how the drone can alleviate the penalties associated with the ground vehicle's load, thus improving efficiency and profit margins. Additionally, a hybrid solver is introduced that combines initial solutions from deep reinforcement learning with further refinement techniques, demonstrating significant computational efficiency in solving larger instances."}, 'zh': {'title': '优化无人机与地面车辆的协同作业', 'desc': '本文提出了一种新的旅行小偷问题（TTP-D），该问题结合了无人机的使用，旨在通过优化物品选择、车辆路线和飞行同步来最大化利润。研究中使用了混合整数规划、元启发式算法和基于注意力的深度强化学习方法，以解决不同规模的问题。无人机可以通过收集偏远物品来提高效率，减少运输时间，从而增加操作利润。研究结果表明，租赁比例是影响盈利能力的主要因素，而车队参数对利润的影响则相对较小。'}}}, {'id': 'https://huggingface.co/papers/2608.15022', 'title': 'Gathered, Not Admitted: How Attention Brings a Latent Variable into Verbalizable Form', 'url': 'https://huggingface.co/papers/2608.15022', 'abstract': "Abstract In language models, flexible reuse demands attention-mediated gathering at a mid-depth window to make latent variables readable, without a selective gate, and readout measures poorly reflect actual use.  Generated by thinkingmachines/Inkling-Small Language models hold latent quantities in a form they can report on, and more of a quantity is present in that form when the task requires reusing it flexibly. What causes a representation to enter that form is open, and the word workspace invites an admission story: a gate that decides what gets in. Testing it on open-weight models with Jacobian lenses, over a benchmark whose five arms share an identical context, we find no gate where it predicts one. Demand raises a concept's lens visibility beyond what applying an operator to a supplied value produces: +0.050 [+0.045, +0.057] in percentile rank on our primary checkpoint, positive on all four we measure, though that arm answers at ceiling and the accuracymatched contrast is stronger under that readout. At the same time one shared linear map decodes the variable from every arm, the control included, at 6.4-9.0x its selection-corrected floor. What produces the later readable form at the queried position is attention-mediated gathering inside a mid-depth window: separating patch depth from readout depth puts transport there at least 17x above anywhere shallower under non-saturating readouts, with no tested MLP output contributing positively inside it. Under the saturating percentile rank the same grid does not localise the window, which is a fact about that measure. An arm that needs the variable for nothing concentrates sevenfold less, so the window is demand-specific. That window has two measured edges, a survival failure below and destruction above, and it falls at the same fractional depth in a 64-layer hybrid and a 62-layer dense model from another family. We localise where the variable is installed and read, not the route from the passage, which transports nothing. But the readout is not a calibrated measure of use: three components move it to within 12% of one another and differ 7.4x in what they do to the answer.", 'score': 2, 'issue_id': 3019, 'pub_date': '2026-08-15', 'pub_date_card': {'ru': '15 августа', 'en': 'August 15', 'zh': '8月15日'}, 'hash': 'dbaa030c2dc307c4', 'authors': ['Parsa Mazaheri'], 'affiliations': ['University of California, Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2608.15022.jpg', 'data': {'categories': ['#small_models', '#interpretability', '#architecture', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Внимание вместо гейта: как языковые модели собирают латентные переменные по требованию', 'desc': 'В работе исследуется, как языковые модели хранят и используют латентные переменные для гибкого переиспользования информации. Авторы обнаружили, что вместо селективного гейта, как предполагалось ранее, переменные собираются через механизм внимания в середине глубины сети. Используя методы анализа якобиана на открытых моделях, они показали, что спрос на переменную увеличивает видимость её представления и одна линейная карта может декодировать переменную из всех контекстов. Исследование демонстрирует, что окно сбора данных специфично для спроса и имеет чётко определённые границы, хотя традиционные метрики плохо отражают реальное использование переменной.'}, 'en': {'title': 'Unlocking Latent Variables: The Power of Attention in Language Models', 'desc': 'This paper explores how language models manage and utilize latent variables through attention mechanisms. It highlights the importance of a mid-depth window for gathering information, which allows for flexible reuse of these variables without relying on a selective gate. The study reveals that the representation of a variable can be influenced by demand, affecting its visibility and usability in different contexts. Additionally, it discusses the limitations of current readout measures in accurately reflecting the actual use of these variables in model performance.'}, 'zh': {'title': '灵活重用潜在变量的关键在于注意力机制', 'desc': '这篇论文探讨了语言模型中如何灵活地重用潜在变量。研究发现，在中层窗口中，注意力机制能够有效地收集信息，使得潜在变量更易于读取。通过对开放权重模型的测试，结果显示在特定任务中，变量的可见性会提高，且不同的任务需求会影响信息的集中程度。最后，论文指出，读取过程并不能准确反映变量的实际使用情况，存在多个因素影响最终的输出结果。'}}}, {'id': 'https://huggingface.co/papers/2608.14614', 'title': 'DumpsterCluster: From Dumpster Diving to Serving LLaMA-70B on $60 GPUs', 'url': 'https://huggingface.co/papers/2608.14614', 'abstract': 'Abstract Retired GPUs can form low-cost clusters for LLM inference, but their economic and environmental viability depends heavily on local electricity prices and carbon intensity.  Generated by thinkingmachines/Inkling-Small As AI datacenters retire functional GPUs, vast quantities of still capable accelerators enter secondary markets. This paper investigates whether these retired GPUs can find a productive afterlife to form a DumpsterCluster that can serve modern LLM inference, and under what conditions such repurposing is economically viable and environmentally sustainable. We physically built a 128-GPU DumpsterCluster from scratch using only second-hand components and ran it for one year. At current market prices (\\22K for the DumpsterCluster vs. 600K for an 8-GPU B200 system), the economic advantages are substantial. Through pipeline-parallel optimizations, our V100 based DumpsterCluster achieves competitive LLaMA-70B throughput, validating production viability. However, our deployment reveals critical context dependencies. Older GPUs consume significantly more energy per token, making total cost of ownership favorable only in regions with inexpensive electricity. Under grid-average carbon intensity, second-hand systems can produce approximately 4x higher total carbon emissions per token for 8B models, and over 40x for 70B models, compared to current-generation hardware. These findings show that GPU afterlife is not universally sustainable - hardware repurposing must be strategically coupled with low carbon energy sources. When deployed in regions with favourable energy economics and clean electricity, second-hand GPUs offer a viable pathway for expanding AI capacity while advancing affordability, energy security, and environmental responsibility.', 'score': 2, 'issue_id': 3021, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'e445a64261843532', 'authors': ['Zeyu Cao', 'Xuan Guo', 'Cheng Zhang', 'Cheuk Hang Lau', 'Ilia Shumailov', 'Yiren Zhao'], 'affiliations': ['Quettaflop AI', 'University of Cambridge', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.14614.jpg', 'data': {'categories': ['#optimization', '#open_source'], 'emoji': '♻️', 'ru': {'title': 'Вторая жизнь видеокарт: когда переработка GPU экономически и экологически обоснована', 'desc': 'В работе исследуется возможность использования устаревших графических процессоров из вторичного рынка для запуска больших языковых моделей в составе низкозатратных вычислительных кластеров. Авторы построили реальный кластер из 128 переработанных GPU и продемонстрировали, что благодаря оптимизациям параллельного конвейера старые V100 могут обеспечивать конкурентную пропускную способность для моделей вроде LLaMA-70B при значительно меньших финансовых затратах. Однако исследование выявило критическую зависимость экономической и экологической эффективности от стоимости электроэнергии в регионе развертывания и углеродной интенсивности энергосетей. Вывод авторов состоит в том, что переработка старого оборудования для AI остается устойчивой только при стратегическом сочетании с возобновляемыми источниками энергии в регионах с дешевым электричеством.'}, 'en': {'title': 'Repurposing Retired GPUs: A Sustainable Path for AI Inference', 'desc': 'This paper explores the use of retired GPUs to create low-cost clusters, termed DumpsterClusters, for large language model (LLM) inference. It highlights the economic benefits of using second-hand GPUs, which can significantly reduce costs compared to new systems. However, the study also reveals that the environmental impact varies greatly depending on local electricity prices and carbon intensity, as older GPUs tend to consume more energy. The findings suggest that while repurposing GPUs can be beneficial, it must be done in conjunction with sustainable energy sources to minimize carbon emissions.'}, 'zh': {'title': '退役GPU的可持续再利用之路', 'desc': '这篇论文探讨了退役GPU如何在低成本集群中用于大型语言模型（LLM）的推理。研究表明，虽然二手GPU在经济上具有优势，但其环境可持续性依赖于当地电力价格和碳强度。通过构建一个128-GPU的集群，研究验证了在特定条件下，二手GPU可以有效支持现代LLM推理。结果显示，硬件的再利用必须与低碳能源相结合，才能实现经济和环境的双重可持续性。'}}}, {'id': 'https://huggingface.co/papers/2608.15984', 'title': 'A Plug-and-Play 2D Motion Interface for Real-World Motion Language Models', 'url': 'https://huggingface.co/papers/2608.15984', 'abstract': 'Abstract A plug-and-play 2D motion interface allows pretrained motion language models to process 2D inputs without retraining, improving real-world applicability.  Generated by thinkingmachines/Inkling-Small Motion Language Models (MoLMs) typically understand human motions by tokenizing 3D motion and processing the resulting tokens using a language model. However, obtaining accurate 3D motions from monocular videos is challenging, limiting their real-world applicability. To address this issue, we introduce a plug-and-play 2D Motion Interface that enables 3D-pretrained MoLMs to accept 2D motion inputs without modifying or fine-tuning the original models.   Experiments on public datasets show that our method achieves performance comparable to 3D motion inputs across multiple MoLMs and outperforms training MoLMs from scratch on 2D motions. We further construct a monocular real-world video motion evaluation dataset and introduce a real-video adapter, demonstrating the usefulness of 2D motions over 3D motions under the evaluated monocular pose-estimation setting. These results suggest that 2D motion provides a practical interface for deploying MoLMs in real-world motion understanding settings. Code is available at https://github.com/irajisamurai/2D-Motion-Interface.', 'score': 1, 'issue_id': 3024, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '6a695d1365ac8d2e', 'authors': ['Kaname Yokoyama', 'Norimichi Ukita'], 'affiliations': ['Toyota Technological Institute, Nagoya, Aichi, Japan'], 'pdf_title_img': 'assets/pdf/title_img/2608.15984.jpg', 'data': {'categories': [], 'emoji': '🎬', 'ru': {'title': '2D интерфейс для развёртывания моделей движений в реальном мире', 'desc': 'В работе предложен модульный интерфейс для преобразования двумерных движений в трёхмерные, позволяющий предобученным языковым моделям движений обрабатывать 2D данные без переобучения. Авторы решают проблему, что извлечение точных 3D движений из монокулярных видео сложно и ограничивает практическое применение. Разработанный plug-and-play адаптер позволяет использовать существующие модели, обученные на 3D данных, для работы с 2D входами. Эксперименты показывают, что метод достигает сравнимого качества с 3D входами и демонстрирует лучшую применимость для реальных видео с монокулярной оценкой позы.'}, 'en': {'title': 'Unlocking 2D Motion for 3D Understanding', 'desc': 'This paper presents a novel plug-and-play 2D Motion Interface that allows pretrained motion language models (MoLMs) to process 2D motion inputs without the need for retraining. The challenge of accurately converting monocular video to 3D motion is addressed by enabling these models to work directly with 2D data. Experimental results indicate that this approach achieves performance similar to that of 3D inputs and surpasses the effectiveness of training MoLMs from scratch on 2D motions. The introduction of a real-video adapter and a new evaluation dataset further highlights the practical advantages of using 2D motions in real-world applications of motion understanding.'}, 'zh': {'title': '二维运动接口：提升运动理解的实用性', 'desc': '本论文介绍了一种即插即用的二维运动接口，使得预训练的运动语言模型能够处理二维输入，而无需重新训练，从而提高了其在现实世界中的适用性。该接口允许三维预训练的运动语言模型接受二维运动输入，解决了从单目视频获取准确三维运动的挑战。实验结果表明，该方法在多个运动语言模型上实现了与三维运动输入相当的性能，并且在二维运动上优于从头训练运动语言模型。我们的研究表明，二维运动为在现实世界运动理解场景中部署运动语言模型提供了实用的接口。'}}}, {'id': 'https://huggingface.co/papers/2608.15659', 'title': 'WorldRover: A Scalable Synthetic Video Data Engine for World Exploration with Rich Annotations', 'url': 'https://huggingface.co/papers/2608.15659', 'abstract': 'Abstract WorldRover is a synthetic data engine that generates long-range, richly annotated video sequences with depth, camera motion, and tracking signals to support training models for coherent world exploration.  Generated by thinkingmachines/Inkling-Small Learning to generate or reconstruct explorable worlds requires video paired with more than RGB: camera motion, scene geometry, temporal correspondence and, for interactive models, control signals. Real capture can provide some of these signals, but dense geometry and long-range correspondence usually rely on estimation or specialised instrumentation. Rendering provides these quantities directly, yet existing synthetic resources rarely combine them on the same frames while also supporting controlled changes of viewpoint and appearance. We introduce WorldRover, a data engine for generating richly annotated, long-range explorations of artist-built environments. At its core, WorldRover-Engine is an Unreal Engine pipeline that executes and offline-renders minute-scale routes while preserving their full trajectories and scene geometry. The same exploration can be replayed from first-person, third-person, and 360 panoramic cameras under different environmental states. Using WorldRover-Engine, we construct WorldRover-10M, whose sequences pair RGB with metric depth, camera trajectories, and trajectory-derived action signals throughout each exploration. Third-person subsets additionally provide dense optical flow, long-range 2D/3D point tracks with visibility, and a character trajectory distinct from the camera trajectory. The engine can render a traversal from first-person, third-person and 360 panoramic viewpoints, under different environmental states or with a neutral white material, while preserving the route and scene geometry. WorldRover therefore turns long-horizon world exploration into a scalable data-generation problem, providing supervision for models that must build, maintain, and revisit coherent representations of an explorable world.', 'score': 1, 'issue_id': 3022, 'pub_date': '2026-08-16', 'pub_date_card': {'ru': '16 августа', 'en': 'August 16', 'zh': '8月16日'}, 'hash': '7fcfd4afc6e1be67', 'authors': ['Xiaojie Xu', 'Zhengyuan Lin', 'Runyi Li', 'Yihao Liu', 'Kaipeng Zhang', 'Yongtao Ge'], 'affiliations': ['Alaya Lab', 'Shanghai Innovation Institute', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.15659.jpg', 'data': {'categories': ['#synthetic', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Синтетические данные для обучения моделей навигации в виртуальных мирах', 'desc': 'WorldRover — это синтетический конвейер данных для генерации длительных видеопоследовательностей с богатыми аннотациями, включающими информацию о глубине, движении камеры и отслеживании объектов. Система использует Unreal Engine для офлайн-рендеринга маршрутов в построенных художниками окружениях, сохраняя полные траектории и геометрию сцены. Созданный датасет WorldRover-10M содержит RGB видео в паре с метрической глубиной, траекториями камеры, оптическим потоком и долгосрочными треками точек с информацией видимости. Этот подход превращает задачу создания данных для обучения моделей когерентного исследования мира в масштабируемую проблему синтетической генерации данных с полным суперевизором.'}, 'en': {'title': 'Revolutionizing World Exploration with Synthetic Data', 'desc': 'WorldRover is a synthetic data engine designed to create detailed video sequences for training machine learning models focused on world exploration. It generates videos that include not just RGB images, but also important data like camera motion, scene geometry, and tracking signals. This allows models to learn from rich, annotated data that simulates real-world exploration scenarios. By using the WorldRover-Engine, researchers can produce vast amounts of data that help improve the understanding and representation of complex environments in machine learning applications.'}, 'zh': {'title': 'WorldRover：探索世界的新数据引擎', 'desc': 'WorldRover是一个合成数据引擎，能够生成长时间、丰富注释的视频序列，支持训练模型进行连贯的世界探索。它通过结合相机运动、场景几何和时间对应等信息，提供比仅仅RGB更丰富的数据。WorldRover-Engine基于虚幻引擎，能够离线渲染细致的路径，同时保留完整的轨迹和场景几何。通过WorldRover-10M，生成的序列将RGB与度量深度、相机轨迹和动作信号配对，为模型提供了构建和维护可探索世界的监督。'}}}, {'id': 'https://huggingface.co/papers/2608.06947', 'title': 'When Context Bites: Detecting RAG Poisoning via Document-Level Attention Collapse', 'url': 'https://huggingface.co/papers/2608.06947', 'abstract': 'Abstract D-SCAN detects retrieval poisoning by monitoring attention collapse dynamics in language model generations.  Generated by thinkingmachines/Inkling-Small Retrieval-augmented generation (RAG) is indispensable for enhancing large language models. However, RAGs are increasingly susceptible to poisoning attacks, in which adversarial documents are injected to manipulate generator outputs. Previous methods rely on output-side signals such as perplexity and consistency checks to detect such attacks. Nevertheless, our analysis reveals that deliberate attacks often induce false confidence, where poisoned outputs exhibit even lower perplexity than benign ones, rendering uncertainty-based detection ineffective. To address this challenge, we explore the internal dynamics of the generator and identify a distinctive signature termed Attention Collapse. Unlike the dispersed attention in benign generations, attacked generations exhibit a decrease in entropy as attention concentrates on poisoned documents. Building on these findings, we propose D-SCAN (Document-level Signal Collapse Analysis), a lightweight detection framework that monitors attention dynamics to identify attacked generations. Extensive experiments on multiple attack benchmarks demonstrate the effectiveness of our method. Moreover, D-SCAN can detect attacks even when they fail to alter the final answer. Code is available at https://github.com/yingtaoren/D-Scan.git.', 'score': 1, 'issue_id': 3018, 'pub_date': '2026-08-07', 'pub_date_card': {'ru': '7 августа', 'en': 'August 7', 'zh': '8月7日'}, 'hash': 'b9ee72d710c87eeb', 'authors': ['Yingtao Ren', 'Ziyi Zhao', 'Yiwei Fu', 'Xiao Luo', 'Yu-Cheng Chang', 'Chin-Teng Lin'], 'affiliations': ['Peking University', 'University of Technology Sydney', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2608.06947.jpg', 'data': {'categories': ['#rag', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Обнаружение атак через анализ динамики механизма внимания', 'desc': 'В статье предлагается метод D-SCAN для обнаружения атак отравления данных в системах поиска и генерации (RAG), которые дополняют языковые модели. Авторы выявили, что атаки вызывают эффект «схлопывания внимания» (Attention Collapse), когда механизм внимания концентрируется на отравленных документах, что отличается от рассеянного внимания при нормальной генерации. Метод анализирует внутреннюю динамику внимания генератора вместо проверки выходных сигналов, таких как перплексия, которые могут быть обманчивы при целенаправленных атаках. D-SCAN эффективно обнаруживает отравленные выходы даже когда атаки не изменяют финальный ответ.'}, 'en': {'title': 'Detecting Poisoning Attacks through Attention Dynamics', 'desc': 'D-SCAN is a novel framework designed to detect retrieval poisoning in language models by analyzing attention collapse dynamics during text generation. Traditional methods rely on output metrics like perplexity, which can be misleading as poisoned outputs may appear more confident. D-SCAN focuses on the internal behavior of the model, identifying a pattern called Attention Collapse, where attention becomes overly concentrated on harmful documents. By monitoring these dynamics, D-SCAN effectively identifies attacks, even when they do not change the final output of the model.'}, 'zh': {'title': 'D-SCAN：监测注意力崩溃以检测中毒攻击', 'desc': 'D-SCAN是一种通过监测语言模型生成中的注意力崩溃动态来检测检索中毒的方法。检索增强生成（RAG）在提升大型语言模型的性能中至关重要，但它们越来越容易受到中毒攻击。传统方法依赖于输出信号，如困惑度和一致性检查，来检测这些攻击，但我们的分析表明，中毒输出的困惑度可能低于正常输出，导致基于不确定性的检测无效。D-SCAN通过监测生成器的内部动态，识别出一种称为注意力崩溃的特征，从而有效地检测到攻击。'}}}, {'id': 'https://huggingface.co/papers/2608.14667', 'title': 'Position: AI Agents in Scientific Teams Should Be Studied as Human-Agent Systems', 'url': 'https://huggingface.co/papers/2608.14667', 'abstract': 'Abstract Scientific collaboration with AI agents requires studying human-agent pairs to avoid risks like reduced inquiry diversity and to foster synergistic discovery.  Generated by thinkingmachines/Inkling-Small Large language model-based agents are increasingly deployed as collaborators in scientific discovery yet most current work focuses on the autonomous capabilities of "AI Scientists". We argue that this overlooks the social aspects of scientific teamwork, and that studying AI Scientists as human-agent systems (HAS)--where the unit of analysis is the human-agent pair--is both underexplored and undervalued. We establish these points through literature and empirical analysis, and highlight recent incidences and studies which show that deploying agents in science without accounting for human-agent dynamics introduces near-term risks, including reduced diversity of scientific inquiry. Through analysis of real-world case studies, we show that scientists and agents can augment each other\'s capabilities. We call for new research that adopts the HAS lens to develop mathematical frameworks for understanding and fostering human-AI synergy in scientific discovery.', 'score': 1, 'issue_id': 3018, 'pub_date': '2026-08-02', 'pub_date_card': {'ru': '2 августа', 'en': 'August 2', 'zh': '8月2日'}, 'hash': '9ade16c6d51cd7eb', 'authors': ['Patrick Emami', 'Sameera Horawalavithana', 'Truc Nguyen', 'Gihan Panapitiya', 'Bruno Jacob', 'Siddhisanket Raskar', 'Saumya Sinha', 'Jared D. Willard', 'Andrew Glaws', 'Nithin Somasekharan', 'Ling Yue', 'Brian Lu', 'Shaowu Pan', 'Jason Eisner'], 'affiliations': ['Johns Hopkins University', 'National Laboratory of the Rockies', 'Pacific Northwest National Laboratory', 'Rensselaer Polytechnic Institute'], 'pdf_title_img': 'assets/pdf/title_img/2608.14667.jpg', 'data': {'categories': ['#agents'], 'emoji': '🤝', 'ru': {'title': 'Синергия вместо автономии: человеко-агентные системы для подлинного научного сотрудничества', 'desc': 'Работа посвящена изучению человеко-агентных систем в научном сотрудничестве, где единицей анализа является пара учёный-агент на основе LLM. Авторы показывают, что сосредоточение только на автономных способностях AI агентов упускает социальные аспекты научной работы и создаёт риски, включая снижение разнообразия научных исследований. Через анализ реальных кейсов демонстрируется, что учёные и агенты могут дополнять друг друга и усиливать возможности один другого. Авторы предлагают новые математические фреймворки для понимания и развития синергии между человеком и AI в научных открытиях.'}, 'en': {'title': 'Enhancing Scientific Discovery through Human-Agent Collaboration', 'desc': "This paper discusses the importance of studying the interactions between humans and AI agents in scientific research, rather than just focusing on the capabilities of AI alone. It highlights that understanding these human-agent pairs can help prevent issues like a lack of diversity in scientific questions and approaches. The authors provide evidence from literature and case studies to show that when scientists and AI work together, they can enhance each other's strengths. They advocate for new research that looks at these collaborations more closely to improve how humans and AI can work together effectively in scientific discovery."}, 'zh': {'title': '促进人机协同，提升科学发现的多样性', 'desc': '这篇论文探讨了人工智能代理与人类科学家之间的合作，强调了人机配对的重要性。研究表明，单纯关注AI科学家的自主能力可能会忽视科学团队中的社会互动。通过实证分析，论文指出不考虑人机动态可能导致科学探究的多样性降低。作者呼吁开展新的研究，以人机系统的视角来理解和促进科学发现中的人机协同。'}}}, {'id': 'https://huggingface.co/papers/2608.14606', 'title': 'Plausible but Not Valid: A Psychometric Audit of LLMs as Synthetic Survey Respondents', 'url': 'https://huggingface.co/papers/2608.14606', 'abstract': 'Abstract Large language models replicate broad psychometric trends in synthetic survey responses but fail to match human joint distributions, reliability, and mediation structures, making them unsuitable replacements for real respondents.  Generated by thinkingmachines/Inkling-Small Large language models (LLMs) are increasingly used as synthetic survey respondents, but existing evaluations ask whether answers look plausible at the individual level. We argue the right question is psychometric: do LLMs preserve the joint distribution, latent structure, reliability, mediation pathways, and demographic effects of real human survey data? We introduce a Lithuanian organisational-psychology dataset (n=263 employees; Dunham Attitudes Toward Change, UWES-17, Koopmans IWPQ; 68 items, 12 subscales) and condition a 37-model lineup spanning OpenAI, Anthropic, Google, and twelve open-weight families on real respondent profiles under a five-level persona-disclosure ladder, presentation and reasoning-effort ablations, counterfactual demographic swaps (gender, role, education), a cross-language check, and a verbatim-recall memorization probe. The resulting Psychometric Similarity Score (PSS) is anchored against five non-LLM statistical baselines and a held-out human-vs-human ceiling, with respondent-bootstrap confidence intervals and an item-permutation null for Tucker\'s phi. LLMs reproduce the qualitative direction of human psychometric relationships, but a Gaussian-copula baseline beats every LLM on the sample-driven PSS components; the LLM "crowd" is more similar to itself (mean inter-LLM PSS 0.73) than to humans; and memorization does not drive the leaderboard (recall-PSS rank correlation 0.00). Counterfactual swaps reveal education-driven effects (mean |d|=0.56) that dwarf gender (0.12) and role (0.18); Tucker\'s phi on UWES falls inside the permutation null for 8 of 37 models. Downstream, every LLM shows a strong acquiescence shift (+0.84 SD), synthetic-trained regressors lose predictive validity on held-out humans (mean R^2 -0.18 vs 0.28), and models fabricate indirect effects on 3 of 10 placebo mediation paths. LLM samples are not a drop-in replacement for human survey data.', 'score': 1, 'issue_id': 3029, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '6ea0973df2e6eb39', 'authors': ['Mantas Lukauskas', 'Viktorija Šarkauskaitė'], 'affiliations': ['AI Insight Lab', 'Hostinger', 'Independent Researcher', 'Kaunas University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.14606.jpg', 'data': {'categories': ['#multilingual', '#dataset', '#hallucinations', '#benchmark', '#leakage', '#synthetic'], 'emoji': '🤖', 'ru': {'title': 'LLM не могут полностью заменить людей в психометрических исследованиях', 'desc': 'В статье исследуется способность больших языковых моделей воспроизводить результаты психометрических опросов на примере литовского датасета организационной психологии. Авторы вводят метрику Psychometric Similarity Score (PSS) для сравнения качества синтетических ответов LLM с реальными данными людей, тестируя 37 моделей с различными вариантами и условиями. Результаты показывают, что LLM могут повторить общие тренды человеческих ответов, но при этом неправильно воспроизводят совместные распределения, надёжность шкал, структуры опосредования и демографические эффекты. Авторы делают вывод, что синтетические ответы LLM не могут заменить настоящих респондентов в психометрических исследованиях.'}, 'en': {'title': 'LLMs: Not Ready to Replace Human Survey Respondents', 'desc': 'This paper evaluates the effectiveness of large language models (LLMs) as synthetic survey respondents by comparing their responses to real human data. It introduces a new dataset from Lithuanian organizational psychology and assesses LLMs on various psychometric properties, such as joint distribution and reliability. The findings reveal that while LLMs can mimic some qualitative trends in human responses, they do not accurately reflect the complex relationships and structures found in real human data. Ultimately, the study concludes that LLMs are not suitable substitutes for actual human respondents in survey research.'}, 'zh': {'title': '大型语言模型无法替代人类调查数据', 'desc': '这篇论文探讨了大型语言模型（LLMs）在模拟调查响应中的表现。尽管LLMs在某些心理测量趋势上与人类相似，但它们无法匹配人类的联合分布、可靠性和中介结构。研究表明，LLMs在心理测量相似性评分（PSS）上表现不如传统统计基线，且它们之间的相似性高于与人类的相似性。最终，LLMs并不能作为人类调查数据的直接替代品。'}}}, {'id': 'https://huggingface.co/papers/2608.16320', 'title': 'StreamOPD: A Post-Training Recipe with Spatio-Temporal Cue Gating for Streaming Video Understanding', 'url': 'https://huggingface.co/papers/2608.16320', 'abstract': "Abstract StreamOPD improves streaming video understanding via on-policy distillation with verifiable rewards and a spatio-temporal cue-gating mechanism, achieving near-teacher performance without inference-time memory.  Generated by thinkingmachines/Inkling-Small Streaming video understanding demands direct responses from the causally observed prefix of an unfolding video. Existing systems add inference-time memory, retrieval, and compression, yet a training-free sliding-window baseline already matches them. We therefore fix a memory-free recent-window protocol and ask how far post-training alone can go. Reinforcement learning with verifiable rewards fits this regime poorly, encouraging long ``think-then-answer'' generations, while on-policy distillation (OPD) supplies dense token-level teacher supervision on student trajectories but is stable only when both models train in thinking mode. These observations lead to StreamOPD, a recipe combining verifiable streaming-video data, thinking-mode OPD, and instruct-mode deployment. It raises StreamingBench from 77.9% to 83.9%---within 0.3 points of the 9B teacher---and improves OVO-Bench excluding its hallucination-detection subtask (HLD) by 9.1 points under unchanged inference. As a teacher-privilege extension, Spatio-Temporal CueGate (ST-CueGate) aggregates cue-versus-no-cue teacher likelihood ratios into a group-relative response score that reweights OPD. It reaches 71.9% on OVO-Bench (excluding HLD) and 64.9% on Video-MME, and is the only variant that stays above the base model on all four benchmarks. Replacing the teacher with a frozen copy of the student's initial policy---on-policy self-distillation---retains most of these gains and lifts HLD to 57.0%, above both the untrained student and the 9B teacher, so abstention loss is not intrinsic to the recipe. We provide a transparent and reproducible reference for open-source streaming-video research.", 'score': 0, 'issue_id': 3031, 'pub_date': '2026-08-17', 'pub_date_card': {'ru': '17 августа', 'en': 'August 17', 'zh': '8月17日'}, 'hash': '40137a2ca877fd58', 'authors': ['Keming Wu', 'Baoyi Wang', 'Kaichen Zhang', 'Xiang An', 'Zuhao Yang', 'Sudong Wang', 'Haowei Zhu', 'Tingxuan Huang', 'Hongcheng Gao', 'Bin Wang'], 'affiliations': ['Hong Kong University of Science and Technology (Guangzhou)', 'LMMs-Lab', 'Nanyang Technological University', 'The University of Hong Kong', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.16320.jpg', 'data': {'categories': ['#multimodal', '#training', '#video', '#rl', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Эффективное понимание
