aptive tokenization framework that dynamically allocates compute based on visual complexity and spatial layout, enabling flexible computational budgeting at inference time. BudgetPix comprises three key components: (1) an adaptive encoder that maps a fixed-size image to a variable-length token sequence using an entropy-guided quadtree alongside a multi-scale patch embedder; (2) a scale-aware decoder reconstructs fixed-resolution images from multi-scale token sets; and (3) a flexible training and sampling schedule that enables pixel-space denoisers to operate across variable token counts. BudgetPix seamlessly integrates with existing pixel-space diffusion architectures, enabling a single checkpoint to be operated at a wide range of compute budgets. Evaluated on text-to-image generation, BudgetPix matches the fidelity of MiniT2I-L at 512^2 and PixelDiT at 1024^2 using just 25% of the original compute budget. In class-conditional generation using a MeanFlow backbone, BudgetPix requires merely 60% of the full compute budget to produce images with near-zero quality degradation, observing a marginal 0.8-point increase in FID. Comprehensive assessments by human and VLM judges confirm that BudgetPix establishes a significantly improved quality-efficiency tradeoff over prior budget-adaptive baselines. More details are available at our project page: https://karaozgur.com/BudgetPix', 'score': 0, 'issue_id': 3401, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '8c49588635513eb6', 'authors': ['Ozgur Kara', 'Yujia Chen', 'Daniel Watson', 'David Forsyth', 'James Matthew Rehg', 'Wen-Sheng Chu', 'Du Tran'], 'affiliations': ['Google', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2610.12307.jpg', 'data': {'categories': [], 'emoji': '⚡', 'ru': {'title': 'Умное распределение вычислений по сложности изображения', 'desc': 'BudgetPix — это адаптивная схема токенизации для моделей генерации изображений, которая динамически распределяет вычислительные ресурсы в зависимости от визуальной сложности и пространственного расположения элементов. Фреймворк включает адаптивный энкодер, использующий энтропийное квадродерево для создания последовательностей переменной длины, масштабируемый декодер и гибкий график обучения, совместимый с существующими пиксельными диффузионными архитектурами. Система позволяет одной контрольной точке работать с различными вычислительными бюджетами, достигая качества оригинальных моделей при использовании лишь 25% от исходного объёма вычислений. Экспериментальная оценка подтверждает значительное улучшение компромисса между качеством и эффективностью по сравнению с предыдущими адаптивными методами.'}, 'en': {'title': 'Dynamic Tokenization for Efficient Image Generation', 'desc': 'The paper introduces BudgetPix, an innovative framework for adaptive tokenization in image generation models. Unlike traditional methods that use a uniform approach for image patches, BudgetPix adjusts the computational resources based on the complexity of the visual content. It features an adaptive encoder that creates variable-length token sequences and a scale-aware decoder for reconstructing images, allowing for efficient use of compute budgets. The results show that BudgetPix achieves high-quality image generation while significantly reducing the computational cost compared to existing models.'}, 'zh': {'title': '自适应标记化，优化图像生成的质量与效率', 'desc': '大多数图像生成模型使用统一的标记化方法，对相同大小的图像块分配相同的计算资源。这种静态方法无法根据推理时的资源限制进行调整，导致在简单背景和复杂细节之间的质量-成本权衡不理想。我们提出了BudgetPix，这是一种自适应标记化框架，可以根据视觉复杂性和空间布局动态分配计算资源，从而在推理时实现灵活的计算预算。BudgetPix与现有的像素空间扩散架构无缝集成，使得单个检查点可以在广泛的计算预算下运行。'}}}, {'id': 'https://huggingface.co/papers/2610.12470', 'title': 'Dex-One2Many: Learning Dexterous Manipulation from a Single Human Demonstration', 'url': 'https://huggingface.co/papers/2610.12470', 'abstract': 'Abstract  While learning dexterous manipulation from a single human video offers a promising alternative to costly robot demonstrations, many recent methods predominantly imitate demonstrated motions. Such strict motion matching often limits generalization to initial object poses, goal poses, and grasps not shown in the video. Alternatively, discovering a policy via reinforcement learning (RL) allows for broad generalization, but without prior guidance, it struggles with high-dimensional exploration in complex, multi-stage tasks. To address these coupled generalization and exploration challenges, we present Dex-One2Many, a real-to-sim-to-real framework that learns a generalizable dexterous manipulation policy from a single human video. Our key insight is to abstract the video into sequential scene graphs that guide RL, enabling efficient exploration while preserving broad generalizability. The graphs serve as generative constraints for sampling diverse reset states and provide dense rewards for each stage. Because the graphs constrain relations rather than exact poses, these reset states cover object poses and grasps beyond the video, while initializing each stage from them with dense rewards keeps exploration short and guided. Trained entirely in simulation, Dex-One2Many transfers zero-shot to a real multi-fingered hand. Across five tool-use and manipulation tasks, Dex-One2Many exceeds baselines by 6.5% in seen configurations, while its robust generalization widens this gap to 71% in unseen scenarios.', 'score': 0, 'issue_id': 3400, 'pub_date': '2026-10-08', 'pub_date_card': {'ru': '8 октября', 'en': 'October 8', 'zh': '10月8日'}, 'hash': '368974c43bd7d65d', 'authors': ['Jusuk Lee', 'Sungha Kim', 'Yeonsoo Park', 'Jonguk Cheon', 'Yoonkyo Jung', 'Yongjun You', 'H. Jin Kim', 'Jia-Bin Huang', 'Furong Huang', 'Youngseok Jang', 'Seungjae Lee'], 'affiliations': ['All Purpose AI', 'KAIST', 'Seoul National University', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2610.12470.jpg', 'data': {'categories': ['#robotics', '#rl', '#video'], 'emoji': '🦾', 'ru': {'title': 'От одного видео к универсальному роботу: графы сцен как путь к обобщённым навыкам манипуляции', 'desc': 'В статье представлена система Dex-One2Many, которая учит робота выполнять ловкие манипуляции из одного видео человека, используя подход real-to-sim-to-real. Ключевая идея заключается в преобразовании видео в последовательные графы сцен, которые направляют процесс обучения с подкреплением (RL), обеспечивая эффективную исследовательскую фазу и хорошую обобщаемость. Графы служат ограничениями для генерации разнообразных начальных состояний и предоставляют плотные награды для каждого этапа задачи. Благодаря обучению в симуляции и нулевой передаче на реальную робототехнику, система достигает значительного улучшения обобщения на неиспробованные конфигурации и позы объектов.'}, 'en': {'title': 'Learn Dexterous Manipulation from a Single Video!', 'desc': 'This paper introduces Dex-One2Many, a framework that enables robots to learn dexterous manipulation from a single human video. Instead of merely imitating the video, it uses reinforcement learning (RL) guided by abstract scene graphs to enhance generalization across various object poses and tasks. The scene graphs help the robot explore different states efficiently while providing rewards that encourage effective learning. As a result, Dex-One2Many demonstrates significant improvements in both familiar and novel manipulation tasks when tested on a real multi-fingered hand.'}, 'zh': {'title': '从视频学习灵巧操作的创新框架', 'desc': '本文提出了一种名为Dex-One2Many的框架，旨在从单个视频中学习灵巧操作策略。该方法通过将视频抽象为序列场景图，指导强化学习（RL），从而实现高效探索和广泛的泛化能力。场景图作为生成约束，帮助采样多样的重置状态，并为每个阶段提供密集奖励。经过完全在仿真环境中训练后，Dex-One2Many能够在真实的多指手上实现零-shot转移，显著提高了在未见场景中的表现。'}}}];

                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-12 20:40',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-12 20:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-12 20:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
