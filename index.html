    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

credit assignment for training long-horizon search agents.', 'score': 49, 'issue_id': 2863, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '340dabc727497dfa', 'authors': ['Yijun Lu', 'Rui Ye', 'Jiajun Wang', 'Yuwen Du', 'Tian Jin', 'Songhua Liu', 'Siheng Chen'], 'affiliations': ['Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05102.jpg', 'data': {'categories': ['#small_models', '#rl', '#long_context', '#reasoning', '#multilingual', '#agents', '#optimization', '#training'], 'emoji': '🔍', 'ru': {'title': 'Отслеживание ответа для точного распределения кредита в многошаговом поиске', 'desc': 'В работе предложен метод Answer-Backtracked Credit Assignment (ABC) для улучшения обучения агентов, которые выполняют многошаговый поиск и верификацию информации. Вместо одинакового подхода ко всем шагам траектории, метод преобразует разреженный результат на уровне траектории в плотное обучающее сигнал на уровне отдельных действий, поощряя полезные шаги и подавляя ошибочные. ABC использует механизм обратного восстановления подсказок из правильного ответа и оценивает каждый поисковый шаг относительно этих подсказок, применяя как взвешенное SFT, так и GRPO с пошаговыми вознаграждениями. Обученный на этой основе агент ABSeeker показал значительное улучшение производительности на бенчмарках BrowseComp, превосходя агентов аналогичного размера и конкурируя с моделями в несколько раз больше.'}, 'en': {'title': 'Enhancing Long-Horizon Search Agents with Fine-Grained Credit Assignment', 'desc': 'This paper introduces a new method called Answer-Backtracked Credit Assignment (ABC) to improve the training of long-horizon search agents. Traditional training methods treat all actions equally, which can lead to ineffective learning from mistakes. ABC enhances this by providing detailed feedback on each action taken during the search process, rewarding useful steps and penalizing redundant ones. The results show that agents trained with ABC can achieve high performance with fewer training examples, outperforming larger models in specific tasks.'}, 'zh': {'title': '答案回溯，提升搜索代理训练效果', 'desc': '本文提出了一种名为答案回溯信用分配（ABC）的框架，用于训练长时间搜索代理。该方法通过将稀疏的轨迹级结果转化为密集的步骤级监督，来奖励有用的动作并抑制错误或冗余的动作。具体来说，ABC首先从答案回溯，恢复解决问题所需的中间线索，然后对每个搜索步骤进行评分。通过这种方式，ABC显著提高了长时间搜索代理的训练效果，尤其是在处理复杂查询时。'}}}, {'id': 'https://huggingface.co/papers/2608.04436', 'title': 'ToolArtist: Tool-Using Unified Multimodal Models for Agentic Image Generation', 'url': 'https://huggingface.co/papers/2608.04436', 'abstract': 'Abstract  Text-to-image (T2I) models can produce visually compelling images, yet they remain limited on open-world tasks that require complex semantic understanding, multi-step reasoning, and the integration of external world knowledge. Existing efforts introduce agent capabilities into image generation, but they either prescribe a fixed workflow or place only a subset of the open-world image generation process under agent control. Consequently, reasoning, tool invocation, and image generation are not coordinated by a single policy. We propose ToolArtist, a fully agentic image generation model obtained by post-training a Unified Multimodal Model (UMM). ToolArtist dynamically orchestrates reasoning, external tool use, and native image generation within one unified policy. During Supervised Fine-Tuning (SFT), we equip a teacher agent with search tools alongside an image-generation tool. We then convert the collected trajectories into a UMM compatible format, where the image-generation tool is concealed while the resulting generated images are retained. During Reinforcement Learning (RL), we develop an agentic RL infrastructure for UMMs and introduce Reason-Act-Draw GRPO (RAD-GRPO), which uses complementary intent and quality rewards to jointly optimize the model. Experiments show that placing the entire open-world image-generation process under an agent policy consistently outperforms approaches with fixed pipelines or only partially agent-controlled components. We release the training data and the complete post-training infrastructure.', 'score': 44, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'fb41881aa5b570f4', 'authors': ['Jiahao Zhao', 'Xiaomin Yu', 'Zhongxiang Sun', 'Fengwei Teng', 'Chengwei Qin', 'Xiaobin Hu', 'Jun Xu', 'Shuicheng Yan'], 'affiliations': ['HKUST(GZ)', 'NUS', 'RUC', 'UCD'], 'pdf_title_img': 'assets/pdf/title_img/2608.04436.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#reasoning', '#open_source', '#agents', '#rl'], 'emoji': '🎨', 'ru': {'title': 'Единая политика для интеллектуальной генерации изображений', 'desc': 'Статья представляет ToolArtist — модель генерации изображений из текста, которая использует агентный подход для координации рассуждений, вызова внешних инструментов и создания изображений под единой политикой. Модель обучается на основе Unified Multimodal Model (UMM) с применением Supervised Fine-Tuning, где агент использует поисковые инструменты вместе с инструментом генерации изображений. Для оптимизации предложен метод Reason-Act-Draw GRPO, который комбинирует награды за намерение и качество для улучшения производительности. Результаты показывают, что полная агентная система превосходит подходы с фиксированными конвейерами или частичным управлением агентом.'}, 'en': {'title': 'Empowering Image Generation with Unified Agent Control', 'desc': 'This paper introduces ToolArtist, a novel text-to-image (T2I) model that enhances image generation by integrating reasoning, tool usage, and image creation into a single agentic framework. Unlike previous models that relied on fixed workflows or limited agent control, ToolArtist employs a Unified Multimodal Model (UMM) that dynamically coordinates all aspects of the image generation process. The model is trained using Supervised Fine-Tuning (SFT) and Reinforcement Learning (RL), optimizing performance through a new method called Reason-Act-Draw GRPO (RAD-GRPO). Experimental results demonstrate that ToolArtist significantly outperforms traditional methods by fully leveraging agent capabilities in open-world tasks.'}, 'zh': {'title': 'ToolArtist：统一的智能图像生成模型', 'desc': '本文提出了一种名为ToolArtist的图像生成模型，旨在解决现有文本到图像模型在开放世界任务中的局限性。ToolArtist通过后训练统一多模态模型（UMM），实现了推理、外部工具使用和图像生成的动态协调。该模型在监督微调阶段引入了教师代理和搜索工具，并在强化学习阶段采用了Reason-Act-Draw GRPO方法，以优化模型的意图和质量奖励。实验结果表明，将整个开放世界图像生成过程置于代理策略下，显著优于固定流程或部分代理控制的方案。'}}}, {'id': 'https://huggingface.co/papers/2608.04570', 'title': 'The Personalization Mirage: How LLMs Fabricate User Profiles, and Why Self-Monitoring Misleads', 'url': 'https://huggingface.co/papers/2608.04570', 'abstract': "Abstract  Personalized LLMs with persistent memory are increasingly deployed, yet the faithfulness of their user models remains unexamined. We study over-inference (OI): the phenomenon where LLMs fabricate user attributes beyond what evidence supports. We introduce MirageBench, comprising 150 personas balanced across stereotypical, counter-stereotypical, and neutral profiles, 6 personalization tasks spanning an ``imagination gradient'', a four-way faithfulness taxonomy operationalized by an independent judge (validated against a blind human annotator on 400 claims: Cohen's kappa = 0.863 four-class, kappa = 0.900 binary), and a leaderboard of 12 models across 7 families on 143616 judged claims. We find that over-inference is pervasive: every one of the 12 models over-infers 35%--49% of its claims (cross-model mean 41.6%; claim-weighted 41.8%), with no model in this evaluation escaping it. Most strikingly, we surface a Self-Monitoring Inversion: at the model-selection level, models' self-assessed OI is negatively rank-correlated with their judge-measured OI (rho = -0.60, p = 0.044; exploratory, wide bootstrap CI [-0.90, +0.06], n = 12). The models that report the least over-inference tend to be flagged as fabricating the most, so self-reported confidence is a misleading signal for comparing models, even though within a single model self-audit still ranks that model's own claims moderately well (AUROC 0.58--0.83). We further show that OI is task-dependent (27%--59%) and that, in a multi-turn pilot, inferred attributes accumulate approximately linearly with little revision. MirageBench positions external verification, rather than model self-report, as a more reliable foundation for trustworthy personalization.", 'score': 35, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '7117bc9459e997be', 'authors': ['Yushi Sun', 'Yanjie Zhang', 'Rui Sheng'], 'affiliations': ['LIGHTSPEED', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2608.04570.jpg', 'data': {'categories': ['#hallucinations', '#interpretability', '#alignment'], 'emoji': '🪞', 'ru': {'title': 'Когда модели видят в пользователях то, чего там нет', 'desc': 'В работе изучается проблема сверх-выведения (over-inference), когда языковые модели с персонализацией придумывают атрибуты пользователей, не опираясь на реальные доказательства. Авторы создали MirageBench — бенчмарк с 150 персонажами и 6 задачами персонализации для оценки верности моделей пользователя, протестировав 12 моделей на 143616 утверждениях. Исследование показало, что все модели в среднем неправильно выводят 41.6% утверждений о пользователях, и обнаружен парадоксальный эффект: модели, которые сами считают себя менее склонными к сверх-выведению, на самом деле это делают больше всего. Вывод: внешняя верификация надежнее самооценки моделей для обеспечения честной персонализации.'}, 'en': {'title': 'Unmasking Over-Inference in Personalized LLMs', 'desc': 'This paper investigates the issue of over-inference (OI) in personalized large language models (LLMs), where models create user attributes that are not supported by evidence. The authors introduce MirageBench, a benchmark that includes diverse personas and various tasks to evaluate the faithfulness of model outputs. Their findings reveal that all tested models exhibit significant over-inference, with a mean rate of 41.6%, and highlight a concerning trend where models that claim to have less OI actually fabricate more attributes. The study emphasizes the need for external verification methods over self-reported metrics to ensure trustworthy personalization in LLMs.'}, 'zh': {'title': '个性化模型的可信度：超越自我报告', 'desc': '本文研究了个性化大型语言模型（LLMs）在用户模型的可信度方面存在的问题，特别是过度推断现象（OI）。我们提出了MirageBench，这是一个包含150个不同角色的基准测试，涵盖了多种个性化任务和一个四类可信度分类法。研究发现，所有评估的12个模型都存在35%到49%的过度推断，且模型自我评估的过度推断与实际测量结果呈负相关。我们建议使用外部验证而非模型自我报告作为建立可信个性化的基础。'}}}, {'id': 'https://huggingface.co/papers/2608.05000', 'title': 'Towards Physics of Multimodal Pretraining: Knowledge Flow, Modality Synergy, Early Unification, and Recipes', 'url': 'https://huggingface.co/papers/2608.05000', 'abstract': 'Abstract  Vision offers a critical axis for advancing foundation models, driving a shift towards natively unified multimodal pretraining. Despite this momentum, the design space and the fundamental mechanisms of how modalities interact during unified training remain underexplored. We provide empirical clarity through a systematic exploration of multimodal pretraining. Our controlled experiments on both synthetic and large-scale real-world datasets yield four key insights into the physics of multimodal pretraining: (i) Knowledge Flow: We disentangle how language, visual understanding, and visual generation transfer knowledge across modalities, revealing distinct patterns of influence and asymmetry; (ii) Synergy vs. Competition: We show that data "complexity" largely determines whether modalities are synergistic, identify architectural choices that promote synergy: such as shared attention and normalization with modality-specific feed-forward layers, and find that these behaviors generalize across different visual tokenizer designs; (iii) Early Unification: Unifying modalities from the very early stages and training them jointly is shown to be more effective than late alignment or sequential training. This process uncovers a vision laziness phenomenon, where delayed integration leads models to rely on language priors; (iv) Recipes: We derive efficient pretraining recipes that achieve strong generative performance using only 5% of the compute budget. These core findings are subsequently validated at scale by training multiple 13.5B MoE models on 2T tokens. We hope this study provides a principled foundation for understanding and scaling multimodal pretraining.', 'score': 32, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'f70cccf2f1c0f435', 'authors': ['Junlin Han', 'Shengbang Tong', 'David Fan', 'Minghao Chen', 'Philip Torr', 'Filippos Kokkinos', 'Mike Lewis'], 'affiliations': ['FAIR, Meta', 'Reality Labs, Meta', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.05000.jpg', 'data': {'categories': ['#training', '#multimodal', '#cv', '#transfer_learning', '#open_source', '#synthetic', '#architecture'], 'emoji': '🔗', 'ru': {'title': 'Физика мультимодального предобучения: от конкуренции к синергии модальностей', 'desc': 'В этой работе авторы систематически исследуют взаимодействие модальностей при едином мультимодальном предобучении, используя контролируемые эксперименты на синтетических и больших реальных датасетах. Они выявили четыре ключевых закономерности: поток знаний между языком и зрением асимметричен, синергия модальностей определяется сложностью данных и архитектурными решениями, раннее объединение модальностей эффективнее последовательного обучения, а также разработали оптимальные рецепты предобучения, требующие только 5% вычислительных ресурсов. Полученные выводы подтверждены на масштабных экспериментах с мультиэкспертными моделями объёмом 13.5B параметров, обученными на 2 триллионах токенов.'}, 'en': {'title': 'Unlocking the Power of Multimodal Pretraining', 'desc': 'This paper explores how different types of data, like images and text, can be combined effectively in machine learning models. It identifies how knowledge flows between these modalities and how their interaction can either help or hinder performance based on data complexity. The authors emphasize the importance of training these modalities together from the start, rather than separately, to improve model efficiency and effectiveness. They also propose new strategies for pretraining that require less computational power while still achieving strong results.'}, 'zh': {'title': '多模态预训练的关键发现与高效方案', 'desc': '本论文探讨了多模态预训练的基础模型，强调视觉在这一过程中的重要性。我们通过系统的实验，揭示了语言、视觉理解和生成之间的知识流动及其相互影响的模式。研究发现，数据的复杂性决定了模态之间的协同或竞争关系，并提出了早期统一训练的优势。最后，我们提供了高效的预训练方案，能够在较低的计算预算下实现强大的生成性能。'}}}, {'id': 'https://huggingface.co/papers/2608.05013', 'title': 'OneDayAgent: Towards a Long-Horizon Harness for Autonomous Agents', 'url': 'https://huggingface.co/papers/2608.05013', 'abstract': 'Abstract  LLM agents are increasingly applied to open-ended everyday requests that span work, study, and life. These tasks are long-horizon, cross-environment, and multimodal, forcing the agent to preserve goals and constraints across many steps while navigating heterogeneous tools and attachments. While prior work has addressed individual failure modes such as goals drift, states loss, and context overflow, whether a single harness can manage them jointly and remain effective across backends has received less study. We present OneDayAgent, a long-horizon harness for autonomous agents. OneDayAgent turns an open-ended request into a managed execution process that decomposes tasks into bounded subtasks, maintains execution memory under context pressure, and verifies and repairs the final deliverable. We evaluate OneDayAgent on AgentIF-OneDay across 104 tasks. With the GLM-5.2 backend, OneDayAgent sets a new state of the art with an overall score of 0.821. The same harness runs across five backend LLMs from three model families, indicating the harness generalizes across backends without tuning, even as different models induce distinct execution styles under the same workflow.', 'score': 24, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': '6c81e90b0b0468b3', 'authors': ['Jingsheng Zheng', 'Xinyuan Fang', 'Jintian Zhang', 'Zhengke Gui', 'Huajun Chen', 'Ningyu Zhang'], 'affiliations': ['Ant Group', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05013.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Универсальная архитектура для долгосрочного выполнения сложных многошаговых задач агентами', 'desc': 'В статье представлен OneDayAgent — универсальная система управления для автономных агентов на основе больших языковых моделей, которая решает проблемы долгосрочного выполнения задач, включая дрейф целей, потерю состояния и переполнение контекста. Система декомпозирует открытые запросы пользователя на ограниченные подзадачи, поддерживает память о выполнении под давлением ограничений контекста и проверяет корректность конечного результата с возможностью автоматического исправления. OneDayAgent достигает новых результатов на бенчмарке AgentIF-OneDay с 104 задачами, получив оценку 0.821 при использовании модели GLM-5.2. Система демонстрирует высокую универсальность, работая на пяти различных LLM-бэкэндах без дополнительной настройки параметров.'}, 'en': {'title': 'OneDayAgent: Mastering Long-Horizon Tasks with LLMs', 'desc': 'This paper introduces OneDayAgent, a framework designed to enhance the performance of large language model (LLM) agents in handling complex, long-term tasks. It addresses common challenges such as goal drift and context overflow by breaking down open-ended requests into manageable subtasks while maintaining execution memory. OneDayAgent is evaluated on a diverse set of tasks and demonstrates superior performance, achieving a new state of the art score with the GLM-5.2 backend. Importantly, this harness is versatile, functioning effectively across multiple LLM backends without requiring specific adjustments for each model.'}, 'zh': {'title': 'OneDayAgent：跨环境的自主代理管理框架', 'desc': '本论文介绍了OneDayAgent，这是一种用于自主代理的长时间执行框架。它能够将开放式请求转化为管理的执行过程，将任务分解为有限的子任务，并在上下文压力下保持执行记忆。OneDayAgent在104个任务上进行了评估，使用GLM-5.2后端时，达到了0.821的整体得分，创造了新的技术标准。该框架可以在五个不同的后端LLM上运行，表明它在不同模型之间具有良好的通用性。'}}}, {'id': 'https://huggingface.co/papers/2608.03764', 'title': 'GDPevo: Evaluating Agent Self-Evolution on Real Business Tasks', 'url': 'https://huggingface.co/papers/2608.03764', 'abstract': "Abstract  Agent self-evolution updates an agent's persistent state from prior experience and reuses it to solve related tasks more effectively. Evaluating self-evolution is difficult: existing benchmarks provide limited coverage of economically valuable task domains, do not always design training and test tasks such that test-time gains can be attributed to training experience, and remain vulnerable to data contamination. We present GDPevo, an evolution-native benchmark grounded in GDP-related enterprise workflows, together with the fully automated data pipeline that generates it. Its core mechanism, rule hybridization, decomposes each enterprise workflow into atomic business rules, distributes subsets of these rules across training tasks, and recombines them in held-out test tasks so that test-time gains are attributable. GDPevo spans CRM, ERP, finance, healthcare, legal, and data-centric workflows. Its V1 release contains 120 tasks in 12 groups, with five training and five held-out test tasks per group. Full automation enables the pipeline to expand the suite to 240 tasks in 24 groups (V2) within two days, providing a practical response to contamination. Using GDPevo, we evaluate four agents, each comprising a harness and a model, under four supervision types. Self-evolution consistently improves held-out accuracy by up to 16.44 percentage points. But the best evolved agents remain far below the fully informed oracle ceiling of 91.6%, indicating that the self-evolution ability of current agents remains far from fully realized. We publicly release the pipeline, benchmark, and full evaluation results at https://github.com/Prism-Shadow/GDPevo.", 'score': 19, 'issue_id': 2862, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'af56961fe91d85ca', 'authors': ['Leijun Zhou', 'Zhihao Liu', 'Xiang Qu', 'Chenxu Liu', 'Yifei Liu', 'Yanke Yu', 'Jingzhe Xu', 'Xuejun Wu', 'Buyue Qian', 'Xi Chen', 'Yaowei Zheng', 'Junhao Hu'], 'affiliations': ['New York University', 'PrismShadow'], 'pdf_title_img': 'assets/pdf/title_img/2608.03764.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#agents'], 'emoji': '🔄', 'ru': {'title': 'Измерение и развитие способности агентов к самоэволюции на корпоративных задачах', 'desc': 'В работе предложен GDPevo — бенчмарк для оценки способности агентов к самоэволюции, то есть обновлению своего состояния на основе опыта из предыдущих задач для более эффективного решения связанных задач. Основной механизм бенчмарка — гибридизация правил, которая разбивает корпоративные рабочие процессы на атомарные бизнес-правила и перекомбинирует их в тестовых задачах так, чтобы прогресс можно было полностью приписать обучению. Бенчмарк охватывает 120 задач из различных областей (CRM, ERP, финансы, здравоохранение) с автоматизированной генерацией данных, защищающей от контаминации. Эксперименты показывают, что самоэволюция улучшает точность на тестовых задачах до 16.44 процентных пункта, однако текущие агенты остаются значительно ниже оракула, указывая на большой потенциал для развития этой способности.'}, 'en': {'title': 'Unlocking Agent Potential with GDPevo Benchmark', 'desc': 'This paper introduces GDPevo, a benchmark designed to evaluate agent self-evolution in various enterprise workflows. It addresses the challenges of existing benchmarks by ensuring that training and test tasks are structured to allow for clear attribution of performance gains to prior experience. The benchmark utilizes a method called rule hybridization, which breaks down workflows into basic business rules and recombines them for testing. Results show that self-evolution can significantly enhance accuracy, but current agents still fall short of optimal performance levels.'}, 'zh': {'title': '自我进化：智能体的未来之路', 'desc': '本文介绍了一种名为GDPevo的自我进化基准，旨在评估智能体在经济任务中的自我进化能力。GDPevo通过将企业工作流程分解为基本业务规则，并在训练任务和测试任务中重新组合这些规则，从而确保测试时的性能提升可以归因于训练经验。该基准涵盖了客户关系管理、企业资源计划、金融、医疗、法律和数据驱动的工作流程，提供了120个任务，未来可扩展到240个任务。实验结果表明，自我进化能够显著提高智能体的准确性，但当前智能体的自我进化能力仍有待提升。'}}}, {'id': 'https://huggingface.co/papers/2608.03632', 'title': 'When Teachers Mislead: Spurious-Signal-Aware On-Policy Distillation', 'url': 'https://huggingface.co/papers/2608.03632', 'abstract': 'Abstract  On-Policy distillation (OPD) transfers teacher capabilities by supervising student-sampled trajectories with dense token-level teacher signals. Recent selective OPD methods improve this process by prioritizing signals that are confident, informative, or learnable. However, the assumptions overlook a fundamental failure mode of language models: their token-level judgments can be driven by input-agnostic language priors, formatting conventions, or stereotyped reasoning templates rather than task-specific evidence. We refer to such optimization-relevant but weakly input-grounded supervision as spurious signals in OPD, which may produce large gradients while contributing little task-improving direction. To mitigate this issue, we propose SA-OPD, a Spurious-Signal-Aware On-Policy Distillation framework that identifies and filters misleading token-level supervision based on input-groundedness and optimization impact. SA-OPD introduces a lightweight input-groundedness proxy estimating whether a token-level distillation signal truly depends on the input. It then filters only tokens that simultaneously exhibit low input-groundedness and extreme distillation divergence, thereby removing high-impact spurious updates and achieving fine-grained OPD optimization. Extensive experiments on both large language model (LLM) and vision-language model (VLM) settings demonstrate that SA-OPD consistently outperforms Vanilla OPD and competitive selective methods. These results establish input-groundedness as a key dimension for OPD supervision selection and offer a simple, effective strategy for mitigating spurious updates.', 'score': 18, 'issue_id': 2861, 'pub_date': '2026-08-04', 'pub_date_card': {'ru': '4 августа', 'en': 'August 4', 'zh': '8月4日'}, 'hash': 'b8aab3a8b6421974', 'authors': ['Yinuo Jiang', 'Yongjie Ye', 'Zhou Tao', 'Xiang Zhuang', 'Qiang Zhang', 'Huajun Chen', 'Tiankai Li'], 'affiliations': ['ByteDance', 'Shanghai Artificial Intelligence Laboratory', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.03632.jpg', 'data': {'categories': [], 'emoji': '🎯', 'ru': {'title': 'Фильтрация ложных сигналов при дистилляции языковых моделей через анализ зависимости от входных данных', 'desc': 'В статье предложен метод SA-OPD для улучшения дистилляции больших языковых моделей, который решает проблему ложных сигналов обучения. Авторы показывают, что токен-уровневые сигналы от учителя часто основаны на языковых приорах и стереотипах, а не на информации из входных данных, что приводит к неправильным градиентам. Предложенный метод использует лёгкий прокси для оценки того, насколько сильно сигнал зависит от входных данных, и фильтрует токены с низкой привязкой к входу и экстремальной дивергенцией. Эксперименты на LLM и видео-языковых моделях показывают, что SA-OPD последовательно превосходит базовые методы дистилляции.'}, 'en': {'title': 'Enhancing Knowledge Transfer by Filtering Spurious Signals in Distillation', 'desc': 'This paper introduces a new method called SA-OPD, which stands for Spurious-Signal-Aware On-Policy Distillation. The method aims to improve the process of transferring knowledge from a teacher model to a student model by filtering out misleading signals that do not depend on the input data. These misleading signals, referred to as spurious signals, can lead to ineffective learning and large gradients that do not help the model improve. By focusing on input-groundedness, SA-OPD enhances the quality of the distillation process, leading to better performance in both language and vision-language tasks.'}, 'zh': {'title': '优化政策蒸馏，过滤无关信号', 'desc': '本文提出了一种新的方法，称为SA-OPD（Spurious-Signal-Aware On-Policy Distillation），旨在改进在政策蒸馏中使用的信号选择。传统的选择性政策蒸馏方法可能会受到无关信号的影响，这些信号并不基于具体任务的证据。SA-OPD通过识别和过滤这些误导性的标记级监督信号，来提高蒸馏的效果。实验结果表明，SA-OPD在大型语言模型和视觉语言模型的设置中，表现优于传统的政策蒸馏方法。'}}}, {'id': 'https://huggingface.co/papers/2608.05139', 'title': 'Toward Skill-Native LLMs: Skill Entropy for Benchmarking and Training Long-Horizon Reasoning', 'url': 'https://huggingface.co/papers/2608.05139', 'abstract': 'Abstract  Long-horizon reasoning in recent LLMs demands that the model switch between distinct skills inside a reasoning chain, such as first doing a math derivation, then using the result to plan a schedule. We call such problems cross-skill long-horizon tasks: multi-step tasks whose steps require different reasoning skills and depend on earlier outputs. Existing benchmarks often evaluate individual skills, lacking a principled way to measure how well a model switches between skills. We address this gap from both the evaluation and training sides. We introduce Skill Entropy, a measure of the difficulty of switching from one skill to another. We then propose Skill^2-Bench, a benchmark of cross-skill long-horizon tasks built over 558 skills across 9 verifiable and open-ended domains. Each task is assigned a task-level skill-entropy score and grouped into three difficulty levels. Evaluating 8 frontier and 4 open-source models on Skill^2-Bench reveals a skill-switching gap: accuracy decreases on higher-entropy tasks. We then turn skill entropy from a benchmark scale into a training signal. We propose Skill-Entropy RL, an RL framework where the model predicts not only the answer at each step but also the skill used to produce it. The reward combines step-level correctness with a skill-entropy reward that measures the alignment between the model-predicted skill sequence and the gold skill sequence. On Qwen3-4B-Instruct and Qwen3-1.7B, Skill-Entropy RL improves the Skill^2-Bench score from 34.4% to 68.4% and from 14.6% to 40.1%, respectively, outperforming competitive baselines. The same pipeline can be applied to off-the-shelf training data such as OpenR1-Math, indicating that skill entropy is a reusable training signal. Code available at: https://github.com/Gen-Verse/Skill-Entropy-RL', 'score': 17, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'bf27cad3fe91d2cf', 'authors': ['Yinghui He', 'Ling Yang', 'Jiarui Liu', 'Yongjin Yang', 'Lechen Zhang', 'Yingcheng Wu', 'Zhenfei Yin', 'Mengdi Wang', 'Sanjeev Arora'], 'affiliations': ['Carnegie Mellon University', 'Princeton University', 'Stanford University', 'University of Illinois Urbana-Champaign', 'University of Oxford', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2608.05139.jpg', 'data': {'categories': ['#training', '#benchmark', '#reasoning', '#open_source', '#small_models', '#optimization', '#rl'], 'emoji': '🔄', 'ru': {'title': 'Овладение искусством переключения между навыками в долгосрочных рассуждениях', 'desc': 'Статья посвящена проблеме переключения между различными навыками рассуждения в больших языковых моделях при решении многошаговых задач. Авторы предлагают метрику Skill Entropy для оценки сложности переключения между навыками и создают бенчмарк Skill²-Bench с 558 навыками и задачами различной сложности. Они показывают, что существующие модели хуже справляются с задачами высокой энтропии навыков. Для улучшения результатов авторы предлагают Skill-Entropy RL — метод обучения с подкреплением, который использует энтропию навыков как сигнал обучения, достигая значительного прироста производительности на различных моделях.'}, 'en': {'title': 'Mastering Skill Switching for Long-Horizon Reasoning', 'desc': 'This paper addresses the challenge of long-horizon reasoning in large language models (LLMs) that require switching between different reasoning skills. It introduces the concept of Skill Entropy, which quantifies the difficulty of transitioning from one skill to another in multi-step tasks. The authors present Skill^2-Bench, a benchmark that evaluates models on cross-skill long-horizon tasks across various domains, highlighting a performance gap in skill-switching. They propose a reinforcement learning framework, Skill-Entropy RL, that enhances model training by incorporating skill predictions alongside task answers, significantly improving performance on the benchmark.'}, 'zh': {'title': '提升模型技能切换能力的创新方法', 'desc': '本文探讨了长时间推理任务中模型在不同技能之间切换的能力。这类任务被称为跨技能长时间任务，涉及多个步骤，每个步骤需要不同的推理技能，并依赖于之前的输出。我们提出了技能熵这一概念，用于衡量从一种技能切换到另一种技能的难度，并建立了Skill^2-Bench基准，涵盖558种技能和9个领域。通过在Skill^2-Bench上评估模型，我们发现技能切换的准确性在高熵任务中下降，并提出了Skill-Entropy RL框架来改善这一问题。'}}}, {'id': 'https://huggingface.co/papers/2608.04397', 'title': 'NOLLI: A Difficulty-Calibrated Puzzle Benchmark for Diagnosing the English-Korean Performance Gap', 'url': 'https://huggingface.co/papers/2608.04397', 'abstract': 'Abstract  We introduce NOLLI, a procedurally generated English-Korean puzzle benchmark designed to diagnose where Korean performance gaps arise. It comprises 15 puzzle types (25 tasks; 7,500 items), with every instance seed-regenerable, verified to have a unique solution, and scored deterministically. Rather than equating harder with bigger, we calibrate difficulty behaviorally, tuning each generator until a fixed reference model lands in target accuracy bands. Its three-level design combines matched direct translations, script adaptations over Hangul jamo (sub-syllabic letters), and Korean-only tasks grounded in Korean culture or orthography. We evaluate 15 frontier, open-weight, and Korean-developed models; among the 12 above a 3% overall-accuracy floor, matched English-Korean accuracy is statistically equivalent within a +/- 10 pp margin (TOST), suggesting little cost from presentation language alone. Writing-system-intensive tasks show sharper gaps: Korean Cipher falls behind English by up to 68.7 pp, whereas Cryptarithmetic over the same jamo shows no systematic penalty, and Jamo Composition accuracy predicts Korean Cipher accuracy. These contrasts are diagnostic rather than causal, consistent with difficulty in multi-step sub-syllabic execution. Korean-only tasks separate rule-application deficits, which vary in sign, from a Kinship deficit positive in all 12. Finally, a salient size measure fails to grow from Easy to Hard in 7 of 15 types, making structural size an unreliable proxy for empirical difficulty.', 'score': 15, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '3614e87bb11be9b0', 'authors': ['Dasol Choi', 'Joonyong Park', 'Daegon Yu', 'Soo Yong Kim', 'Youngsook Song', 'Seunghyeok Hong'], 'affiliations': ['AIM Intelligence', 'HAERAE LAB', 'Hankuk University of Foreign Studies', 'KT Corp.', 'Lablup Inc.', 'Sionic AI'], 'pdf_title_img': 'assets/pdf/title_img/2608.04397.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#multilingual'], 'emoji': '🧩', 'ru': {'title': 'Диагностика языковых способностей AI через головоломки с учётом особенностей письменности', 'desc': 'Авторы представляют NOLLI — процедурно генерируемый бенчмарк с головоломками на английском и корейском языках для диагностики причин различий в производительности моделей. Бенчмарк содержит 15 типов задач с 7500 элементами, где сложность калибруется поведенчески — генераторы настраиваются так, чтобы эталонная модель достигала целевых уровней точности. Трёхуровневый дизайн включает прямые переводы, адаптации для корейского письма (графемы Хангыля) и задачи, специфичные для корейской культуры и орфографии. Исследование показывает, что при контролируемом сравнении языков презентации большие LLM-модели показывают примерно одинаковую точность на английском и корейском, но задачи, интенсивные по системе письма, выявляют существенные дефициты — до 68,7 процентных пункта в корейском шифре.'}, 'en': {'title': 'NOLLI: Bridging English-Korean Language Gaps Through Puzzle Benchmarking', 'desc': 'The paper presents NOLLI, a benchmark for evaluating English-Korean language processing through a series of procedurally generated puzzles. It includes 15 types of puzzles with 7,500 unique tasks designed to assess performance gaps in Korean language models. The difficulty of the tasks is calibrated behaviorally rather than by size, ensuring that models are tested against a consistent accuracy standard. The findings reveal that while overall accuracy is similar between English and Korean tasks, specific writing-system-intensive tasks show significant performance disparities, highlighting the complexities of multi-step language processing.'}, 'zh': {'title': 'NOLLI：揭示韩语学习中的难点', 'desc': '本文介绍了NOLLI，这是一个程序生成的英韩拼图基准，旨在诊断韩语表现差距的来源。它包含15种拼图类型（25个任务；7500个项目），每个实例都可以重新生成种子，确保有唯一解并且得分是确定的。我们通过行为校准来调整难度，而不是简单地将更大等同于更难，确保每个生成器的输出在目标准确度范围内。研究表明，韩语特有的任务在多步骤执行中存在明显的表现差距，尤其是在书写系统密集的任务中。'}}}, {'id': 'https://huggingface.co/papers/2607.24821', 'title': 'AVE-Compass: Towards Holistic Evaluation for Audio-Video Editing Abilities', 'url': 'https://huggingface.co/papers/2607.24821', 'abstract': 'Abstract  While instruction-based video editing has advanced rapidly, real-world videos contain tightly coupled audio and visual signals, and editing one modality often requires coordinated changes in the other. Existing benchmarks primarily evaluate visual transformations on silent clips or isolated audio editing, leaving complex audio-visual editing and cross-modal consistency underexplored. We introduce AVE-Compass, a comprehensive benchmark with 145 curated source videos, 196 audio-visually coupled editing instructions, and 2,688 fine-grained checklist items. It evaluates Instruction Following, Fidelity Preserving, Realism, and Editing Intent through checklist-based MLLM judging and a dedicated realism rubric, complemented by automated cross-modal, video, and audio metrics. Extensive evaluation shows that state-of-the-art models still struggle to execute cross-modal instructions while preserving non-target content. We further propose AVE-Agent, a modular agent framework that decomposes complex instructions into dependent subtasks and iteratively improves editing results through self-reflection and evaluator feedback. AVE-Agent improves instruction execution, Fidelity Preserving, and audio-visual alignment in joint editing while maintaining competitive perceptual quality.', 'score': 15, 'issue_id': 2862, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'b8a6dfc35fc6f6a0', 'authors': ['Yuqing Wen', 'Yukai Huang', 'Qianqian Xie', 'Jiangtao Wu', 'Yibin Lin', 'Yikai Gu', 'Jialu Chen', 'Yuanxing Zhang', 'Jiaheng Liu'], 'affiliations': ['Nanjing University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.24821.jpg', 'data': {'categories': ['#video', '#agents', '#dataset', '#audio', '#multimodal', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Кросс-модальное редактирование видео через декомпозицию задач и саморефлексию', 'desc': 'В статье представлен бенчмарк AVE-Compass для оценки редактирования видео с учетом согласованности аудио и визуального контента, содержащий 145 исходных видео и 196 инструкций по редактированию. Предложенный бенчмарк использует мультимодальные метрики оценки, включая проверку следования инструкциям, сохранение верности, реалистичность и выравнивание модальностей через MLLM-судейство. Авторы показывают, что современные модели плохо справляются с кросс-модальными задачами редактирования при сохранении неизменяемого контента. Для решения этой проблемы предложена система AVE-Agent, которая разлагает сложные инструкции на подзадачи и итеративно улучшает результаты через самоанализ и обратную связь от оценивателя.'}, 'en': {'title': 'Enhancing Audio-Visual Editing with AVE-Compass and AVE-Agent', 'desc': 'This paper addresses the challenges of editing videos that involve both audio and visual elements, which are often tightly linked. The authors introduce AVE-Compass, a new benchmark designed to evaluate how well models can follow editing instructions while maintaining consistency between audio and visual components. They also present AVE-Agent, a framework that breaks down complex editing tasks into smaller subtasks, allowing for iterative improvements based on feedback. The results show that current models struggle with cross-modal editing, but AVE-Agent enhances performance in executing instructions and preserving the integrity of the original content.'}, 'zh': {'title': '音视频编辑的新标准与智能代理', 'desc': '本论文介绍了AVE-Compass，这是一个全面的基准测试，旨在评估音视频编辑中的跨模态一致性。现有的基准主要关注静音视频的视觉变换，未能充分探讨复杂的音视频编辑。我们提出的AVE-Agent是一个模块化的代理框架，可以将复杂的编辑指令分解为依赖的子任务，并通过自我反思和评估反馈来逐步改善编辑结果。实验结果表明，AVE-Agent在执行指令、保持内容一致性和音视频对齐方面表现优异。'}}}, {'id': 'https://huggingface.co/papers/2608.02580', 'title': 'Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data', 'url': 'https://huggingface.co/papers/2608.02580', 'abstract': 'Abstract  Learning generalizable robot manipulation policies requires large-scale and diverse demonstration data. Egocentric human manipulation videos offer rich scene and task diversity, and prior work has shown that retargeting and rendering such videos into robot-format data can yield effective per-task policies at small scale. However, whether this approach can provide pretraining benefits for vision-language-action models at scale remains unexplored. We present Ego2Robot, a scalable pipeline that converts egocentric human manipulation videos into robot training data through action retargeting, robot-arm visual synthesis, and multi-level quality curation. Ego2Robot supports both curated datasets and in-the-wild videos, producing 18,561 hours of robot training data spanning 15 robot morphologies, making it the largest ego-to-robot dataset to date. To evaluate generalization, we extend RoboTwin2.0 with disentangled perturbation axes covering visual appearance, scene layout, embodiment morphology, and task semantics. Experiments show that joint pretraining on Ego2Robot-synthesized and robot data consistently improves out-of-distribution generalization across multiple perturbation types, with benefits validated on real-robot deployment. Project page: https://www-ye.github.io/ego2robot_blog/', 'score': 14, 'issue_id': 2861, 'pub_date': '2026-08-03', 'pub_date_card': {'ru': '3 августа', 'en': 'August 3', 'zh': '8月3日'}, 'hash': '8a653ef5e0706a09', 'authors': ['Ye Wang', 'Pei Lin', 'Xiong-Hui Chen', 'Haoqi Yuan', 'Zhixuan Liang', 'Yiyang Huang', 'Anzhe Chen', 'Zixing Lei', 'Jie Zhang', 'Tao Zhang', 'Haoyang Li', 'Tong Zhang', 'Chenxi Xiao', 'Ziyuan Jiao', 'Qin Jin'], 'affiliations': ['AIM3 Lab, Renmin University of China', 'Beijing Institute for General Artificial Intelligence (BIGAI)', 'Beijing University of Aeronautics and Astronautics', 'Qwen Team, Alibaba Inc.', 'ShanghaiTech University'], 'pdf_title_img': 'assets/pdf/title_img/2608.02580.jpg', 'data': {'categories': ['#training', '#multimodal', '#dataset', '#data', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'От человеческого взгляда к роботизированному действию: масштабируемое обучение манипуляций', 'desc': 'В статье представлена система Ego2Robot для преобразования видео манипуляций от первого лица в обучающие данные для робототехники через переназначение действий и синтез визуальных данных. Авторы создали самый большой датасет на сегодняшний день, содержащий 18,561 часов видео для 15 различных морфологий роботов, поддерживающий как отобранные датасеты, так и видео из Интернета. Для оценки обобщаемости была расширена модель RoboTwin2.0 с помощью дезинтегрированных осей возмущений, охватывающих визуальное отображение, расположение объектов, морфологию робота и семантику задач. Эксперименты показывают, что совместное предварительное обучение на синтезированных данных Ego2Robot и реальных робототехнических данных последовательно улучшает внеобучающую обобщаемость модели, что подтверждается при развёртывании на реальных роботах.'}, 'en': {'title': 'Transforming Human Actions into Robot Learning Data', 'desc': 'This paper introduces Ego2Robot, a method for transforming egocentric human manipulation videos into training data for robots. The approach involves action retargeting and visual synthesis to create a large dataset that includes diverse robot morphologies and manipulation tasks. By using this extensive dataset, the authors demonstrate improved generalization capabilities for vision-language-action models when tested on various perturbations. The results indicate that pretraining with Ego2Robot data enhances the performance of robots in real-world scenarios, making it a significant advancement in robot learning.'}, 'zh': {'title': '将人类操作视频转化为机器人训练数据的创新方法', 'desc': '本论文提出了一种名为Ego2Robot的可扩展管道，旨在将第一人称人类操作视频转换为机器人训练数据。该方法通过动作重定向、机器人臂视觉合成和多层次质量筛选，生成了18561小时的机器人训练数据，涵盖15种机器人形态。研究表明，联合预训练Ego2Robot合成数据和机器人数据可以显著提高模型在不同扰动类型下的泛化能力。该数据集是迄今为止最大的第一人称到机器人数据集，支持多种数据来源。'}}}, {'id': 'https://huggingface.co/papers/2608.04574', 'title': 'When Memory Lies: An Empirical Study of Spatial Memory Staleness in VLM Agents', 'url': 'https://huggingface.co/papers/2608.04574', 'abstract': 'Abstract  Memory-augmented VLM agents act on persistent spatial knowledge, yet that knowledge silently goes stale as the environment changes. We ask what happens when an agent must reconcile a confident memory claim with a contradicting observation, and whether current models can catch the conflict before it becomes a safety-relevant mistake. Using a dynamic FrozenLake testbed, we pair a staleness-detection task with a downstream navigation task across three closed-source models and three open-weight VLMs under both text and image inputs (1,800 detection runs, and 12,000 text-mode navigation episodes over four LLM navigators at a shared 50-seed scale). Three findings emerge. First, text solvability does not imply visual grounding: models that flag stale entries reliably from text nonetheless span vision F1 from 0.887 down to 0.067 on the identical grids, and the weakest keeps making fluent, confident decisions that ignore the image. Second, consuming stale memory without an audit is a safety liability: in our primary GPT-4o setting, an agent that trusts raw memory dies more than twice as often as the same agent given no memory at all. Third, auditing helps but does not close the gap: a transparent read-time filter removes much of the safety cost in text mode, yet even oracle stale labels bring no further significant gain on the current grid size, and when visual auditing is unreliable, filtering yields no consistent benefit. Together these results frame spatial-memory staleness as a safety failure mode and isolate reliable visual grounding and action selection under memory--observation conflict as the central open challenges for memory-augmented agents.', 'score': 12, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '2613c8950181f3f2', 'authors': ['Yushi Sun', 'Yanjie Zhang'], 'affiliations': ['LIGHTSPEED, Shenzhen, China', 'The Hong Kong University of Science and Technology, Hong Kong, China'], 'pdf_title_img': 'assets/pdf/title_img/2608.04574.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#security', '#interpretability', '#agents', '#alignment'], 'emoji': '⚠️', 'ru': {'title': 'Опасность устаревшей памяти: когда агенты не видят изменения в мире', 'desc': 'В этой работе исследуется проблема устаревания пространственной памяти в агентах на основе мультимодальных больших языковых моделей. Авторы создали тестовую среду, где агент должен обнаружить конфликт между уверенным утверждением из памяти и противоречащим наблюдением из окружающей среды. Результаты показывают, что модели, успешно решающие эту задачу на текстовых входах, часто не справляются с визуальной интерпретацией, доверяя устаревшей памяти даже при наличии противоречивых изображений. Исследование демонстрирует, что аудит памяти улучшает безопасность, но полностью не решает проблему конфликта между памятью и визуальными наблюдениями.'}, 'en': {'title': 'Navigating Memory Conflicts: Ensuring Safety in VLMs', 'desc': 'This paper investigates how memory-augmented visual language models (VLMs) handle outdated spatial knowledge when navigating environments. It reveals that models can confidently recall stale information, leading to unsafe decisions, especially when visual inputs are involved. The study shows that while auditing memory can improve safety, it does not completely eliminate risks, particularly when visual grounding is unreliable. The findings highlight the need for better mechanisms to reconcile memory and real-time observations to enhance the safety of memory-augmented agents.'}, 'zh': {'title': '空间记忆过时是安全隐患', 'desc': '这篇论文探讨了增强记忆的视觉语言模型（VLM）代理在环境变化时如何处理过时的空间知识。当代理必须调和自信的记忆声明与相矛盾的观察时，当前模型能否在错误发生前识别出这种冲突是一个关键问题。研究发现，文本可解性并不意味着视觉基础的可靠性，且在没有审计的情况下使用过时的记忆会带来安全隐患。最后，虽然审计可以改善情况，但在视觉审计不可靠时，过滤并未带来一致的好处。'}}}, {'id': 'https://huggingface.co/papers/2608.00782', 'title': 'Distill Where You Fail: Recovering Learning Signals of Negative RL-Groups from Adaptive Teacher Guidance', 'url': 'https://huggingface.co/papers/2608.00782', 'abstract': "Abstract  Reinforcement learning with verifiable rewards (RLVR) has become a standard paradigm for post-training large language models (LLMs). While Group Relative Policy Optimization (GRPO) is widely adopted, it suffers from sparse reward signals and loses gradients entirely when all responses within a group receive identical rewards. On-policy distillation (OPD) offers a natural remedy by providing dense, token-level supervision from a teacher model. However, naively combining GRPO with OPD leads to degraded performance, due to three underlying causes: not all samples benefit from distillation; fitting too quickly to the teacher undermines the exploratory capacity of RL; and OPD's advantages are asymmetric, suppressing most tokens. To address these challenges, we propose RSTG (Recovering Learning Signals via Adaptive Teacher Guidance), which applies distillation selectively and precisely where it matters most. At the sample level, OPD is restricted to negative zero-variance prompts with each sample weighted by the teacher's confidence score. At the token level, distillation targets only tokens with high student entropy or large teacher-student divergence. We further augment training with SFT on correct trajectories generated by the teacher model, injecting positive gradient signals where RL yields none. Experiments demonstrate that RSTG substantially outperforms naive GRPO+OPD by +4.02% on math and +3.05% on code.", 'score': 10, 'issue_id': 2861, 'pub_date': '2026-08-01', 'pub_date_card': {'ru': '1 августа', 'en': 'August 1', 'zh': '8月1日'}, 'hash': '7e4ed3ea81de81ea', 'authors': ['Zhuowen Han', 'Jinwei Xiao', 'Zhengxi Lu', 'Renren Jin', 'Zhiyuan Yao', 'Yuxin Liu', 'Hongyan Hao', 'Yueqing Sun', 'Yu Yang', 'Qi GU', 'Xunliang Cai', 'Deyi Xiong'], 'affiliations': ['Meituan Longcat Team', 'TJUNLP Lab, School of Computer Science and Technology, Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2608.00782.jpg', 'data': {'categories': ['#training', '#rlhf'], 'emoji': '🎯', 'ru': {'title': 'Адаптивное руководство учителя для восстановления сигналов обучения в RL', 'desc': 'В статье предложен метод RSTG для улучшения обучения больших языковых моделей с подтверждаемыми наградами, который решает проблему разреженных сигналов обратной связи в методе GRPO. Авторы комбинируют дистилляцию знаний от учительской модели с усиленным обучением, применяя её селективно только к тем образцам и токенам, где она действительно полезна. Метод использует взвешивание по уверенности учителя и фокусируется на токенах с высокой энтропией студента или большой расхождением между предсказаниями студента и учителя. Экспериментальные результаты показывают значительное улучшение производительности на задачах математики и программирования по сравнению с наивной комбинацией GRPO и дистилляции.'}, 'en': {'title': 'Enhancing Learning Signals with RSTG for Better RL Performance', 'desc': 'This paper introduces RSTG, a method that enhances reinforcement learning with verifiable rewards for large language models. It addresses the limitations of Group Relative Policy Optimization (GRPO) and on-policy distillation (OPD) by selectively applying distillation to improve learning signals. RSTG focuses on using teacher model guidance effectively, targeting only the most informative samples and tokens to maintain exploration in reinforcement learning. The proposed method shows significant performance improvements in tasks like math and code generation compared to traditional approaches.'}, 'zh': {'title': '自适应教师指导，提升强化学习效果', 'desc': '强化学习与可验证奖励（RLVR）已成为后训练大型语言模型（LLMs）的标准范式。尽管群体相对策略优化（GRPO）被广泛采用，但它在稀疏奖励信号下表现不佳，并且当组内所有响应获得相同奖励时完全失去梯度。在线策略蒸馏（OPD）通过提供来自教师模型的密集、逐标记的监督，提供了一种自然的解决方案。然而，简单地将GRPO与OPD结合会导致性能下降，因此我们提出了RSTG（通过自适应教师指导恢复学习信号），以选择性和精确的方式应用蒸馏。'}}}, {'id': 'https://huggingface.co/papers/2608.04530', 'title': 'FocusMem: Factorizing Content, Readout, and Trust in Latent GUI Memory', 'url': 'https://huggingface.co/papers/2608.04530', 'abstract': 'Abstract  GUI agents must remember both useful experience from earlier tasks and unfinished progress in the current interaction. Latent memory offers a compact solution by compressing multimodal trajectories into a few continuous tokens. Existing methods, however, usually map each trajectory to one fixed memory block and train it mainly through next-action supervision. This creates three practical problems: important details may be lost during compression, the same memory block must serve different decision stages, and irrelevant retrieved trajectories may still mislead the agent. We introduce FocusMem, which separates these responsibilities within a compact latent-memory interface. A role-aware content basis encourages episodic memory to retain reusable experience and working memory to retain task progress. A state-conditioned readout generates a decision-specific view of the same stored evidence, while a lightweight trust gate can suppress memory blocks that appear irrelevant to the current step. All components are trained while the GUI policy remains frozen. Across five GUI-agent benchmarks, FocusMem consistently outperforms a fully matched action-only fixed-memory baseline and prior latent memory adaptations. Further analysis shows that semantic and functional supervision preserve complementary information, state-conditioned readout is more robust as surrounding trajectory context grows, and the trust gate reduces the harm caused by injected irrelevant episodic evidence. These results show that effective latent memory depends not only on compressing past interaction, but also on what is retained, what is exposed, and what is allowed.', 'score': 9, 'issue_id': 2863, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'c663ef96e8cbf396', 'authors': ['Zhuoran Zhang', 'Bowen Li', 'Jingcheng Ju', 'Yang Shi', 'Qixun Wang', 'Haotian Wang', 'Wei Chen', 'Tengjiao Wang'], 'affiliations': ['Department of Computer Science and Technology, Tsinghua University', 'Institute of Information Engineering, Chinese Academy of Sciences', 'Key Lab of High Confidence Software Technologies, Peking University', 'School of Computer Science, Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04530.jpg', 'data': {'categories': ['#benchmark', '#agents', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Умная память для интерфейсов: разделение опыта и прогресса', 'desc': 'Статья предлагает FocusMem — новый подход к управлению латентной памятью для агентов, взаимодействующих с графическими интерфейсами. В отличие от существующих методов, которые сжимают всю историю действий в один блок памяти, FocusMem разделяет ответственность между памятью эпизодов (для сохранения переиспользуемого опыта) и рабочей памятью (для отслеживания текущего прогресса). Система использует специальные механизмы: состояние-зависимый считыватель для извлечения релевантной информации и доверительный вентиль для фильтрации нерелевантных блоков памяти. Все компоненты обучаются при неизменной основной политике, показывая устойчивое улучшение на пяти бенчмарках для GUI-агентов.'}, 'en': {'title': 'FocusMem: Smart Memory for Better GUI Agent Performance', 'desc': 'This paper presents FocusMem, a novel approach to latent memory for GUI agents that enhances their ability to remember useful experiences and ongoing tasks. Unlike traditional methods that use a single memory block for all tasks, FocusMem separates memory into different roles, allowing for better retention of relevant information and task progress. It employs a state-conditioned readout to tailor memory retrieval to specific decisions and a trust gate to filter out irrelevant memories. The results demonstrate that FocusMem significantly improves performance on various benchmarks by optimizing how memories are stored, accessed, and utilized.'}, 'zh': {'title': 'FocusMem：提升GUI代理的潜在记忆能力', 'desc': '本论文提出了一种名为FocusMem的潜在记忆方法，旨在帮助图形用户界面（GUI）代理记住有用的经验和当前任务的进展。FocusMem通过将多模态轨迹压缩为少量连续的记忆块，解决了现有方法中存在的压缩信息丢失、记忆块多重使用和无关轨迹干扰的问题。该方法引入了角色感知的内容基础，鼓励情节记忆保留可重用的经验，同时工作记忆保留任务进展。通过状态条件的读取和轻量级的信任门，FocusMem能够有效地管理记忆的使用，确保代理在决策时使用相关的信息。'}}}, {'id': 'https://huggingface.co/papers/2608.04505', 'title': 'K-EXAONE 2.0 Technical Report', 'url': 'https://huggingface.co/papers/2608.04505', 'abstract': 'Abstract  This technical report presents K-EXAONE 2.0, an open-weight multilingual foundation model developed by LG AI Research as a step in our effort toward global frontier-scale foundation models. Rather than training from scratch, we upcycle K-EXAONE and expand its architecture, yielding a Mixture-of-Experts (MoE) model with 750B total parameters and approximately 37B activated per token---more than three times the capacity of its predecessor. K-EXAONE 2.0 supports context lengths of up to 256K tokens and expands multilingual coverage from six to ten languages. Its training pipeline combines continual pre-training, difficulty-focused mid-training, and post-training to strengthen reasoning, agentic coding, multilingual capability, and safety grounded in Korean sociocultural contexts. Across nine evaluation categories selected to reflect the conditions of practical use, K-EXAONE 2.0 improves over K-EXAONE and remains competitive with open-weight models, showing its largest gains in agentic coding and long-context understanding and its clearest strengths in long-context retrieval and safety. Released under the Apache 2.0 license, K-EXAONE 2.0 enables the wider AI ecosystem to evaluate, deploy, adapt, and build upon it, while marking the beginning---rather than the endpoint---of our challenge toward the global frontier.', 'score': 9, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '312ecd6603ea07fe', 'authors': ['Eunbi Choi', 'Kibong Choi', 'Sehyun Chun', 'Seokhee Hong', 'Junwon Hwang', 'Hyojin Jeon', 'Ahra Jo', 'Hyunjik Jo', 'Yeonsik Jo', 'Minhyeok Jung', 'Doyoung Kim', 'Heegyu Kim', 'Joonkee Kim', 'Seonghwan Kim', 'Soyeon Kim', 'Sunkyoung Kim', 'Yireun Kim', 'Yongil Kim', 'Byungoh Ko', 'Changhun Lee', 'Dohaeng Lee', 'Haeju Lee', 'Jinsik Lee', 'Kyungmin Lee', 'Minwoo Lee', 'Wonkee Lee', 'Sangha Park', 'Sungjune Park', 'Kwangrok Ryoo', 'Kijung Seo', 'Minju Seo', 'Yongwoo Song', 'Sejong Yang', 'Heuiyeen Yeen', 'Stanley Jungkyu Choi', 'Yemuk Choi', 'Yongchan Chun', 'Jiwon Ham', 'Dasol Hong', 'Sujeong Im', 'Kijeong Jeon', 'Gerrard Jeongwon Jo', 'Hyeongjun Jo', 'Yujin Jo', 'Jiyeon Jung', 'Naeun Kang', 'Daeseong Kim', 'Euisoon Kim', 'Hayeon Kim', 'Hyosang Kim', 'Myoungshin Kim', 'Unsol Kim', 'Youchul Kim', 'Chaeeun Lee', 'ChaeYoon Lee', 'Edward Hwayoung Lee', 'Honglak Lee', 'Hwansoo Lee', 'Minkyung Lee', 'Sangeun Lee', 'Solji Lim', 'Woohyung Lim', 'Chanwoo Moon', 'Jueun Mun', 'Jimin Park', 'Seojeong Park', 'Yongmin Park', 'Hyerin Seo', 'Donghyeon Shin', 'Donghyun Son', 'Eunyong Son', 'Kaehyun Um', 'Sihoon Yang', 'Chang En Yea', 'Sihyuk Yi', 'Kyungjae Yoo', 'Chansik Yoon'], 'affiliations': ['LG AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2608.04505.jpg', 'data': {'categories': ['#training', '#reasoning', '#open_source', '#plp', '#long_context', '#low_resource', '#agents', '#alignment', '#multilingual', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Масштабный апгрейд: MoE модель K-EXAONE 2.0 для глобального фронтира', 'desc': 'K-EXAONE 2.0 — это многоязычная foundational модель с архитектурой Mixture-of-Experts, содержащая 750 млрд параметров, из которых активируется примерно 37 млрд на каждый токен. Модель была получена путём апгрейда предыдущей версии K-EXAONE с расширением архитектуры и поддержкой контекста длиной до 256K токенов. Обучение включало continual pre-training, середину обучения с фокусом на сложность и post-training этапы для улучшения рассуждений, кодирования, многоязычных способностей и безопасности в корейском культурном контексте. Модель показывает значительные улучшения в задачах длинного контекста, агентного кодирования и остаётся конкурентоспособной среди открытых моделей.'}, 'en': {'title': 'Empowering Multilingual AI with K-EXAONE 2.0', 'desc': 'K-EXAONE 2.0 is a multilingual foundation model developed by LG AI Research, designed to enhance global AI capabilities. It utilizes a Mixture-of-Experts (MoE) architecture with 750 billion parameters, significantly increasing its processing power compared to its predecessor. The model supports longer context lengths and has expanded its language coverage, improving its performance in reasoning and coding tasks. By employing a comprehensive training pipeline, K-EXAONE 2.0 demonstrates notable advancements in safety and long-context understanding, making it a valuable resource for the AI community.'}, 'zh': {'title': 'K-EXAONE 2.0：全球前沿的多语言基础模型', 'desc': 'K-EXAONE 2.0是LG AI研究所开发的多语言基础模型，旨在推动全球前沿基础模型的发展。该模型采用Mixture-of-Experts（MoE）架构，拥有7500亿个参数，并且每个token激活约370亿个参数，性能大幅提升。K-EXAONE 2.0支持最长256K的上下文长度，并将多语言覆盖范围从六种扩展到十种。通过持续预训练、针对难度的中期训练和后期训练，该模型在推理、编码能力、多语言能力和安全性方面表现出色，特别是在长上下文检索和安全性方面具有明显优势。'}}}, {'id': 'https://huggingface.co/papers/2608.05070', 'title': 'HelloWorld: Enabling Socially Interactive Characters in Video World Models', 'url': 'https://huggingface.co/papers/2608.05070', 'abstract': "Abstract  Despite the remarkable recent progress of video world models, social interaction between users and the characters within these worlds remains unsupported. To fill this gap, we present HelloWorld, a video world model that enables social interaction with in-world characters. With a single button press, users can prompt the on-screen character to respond toward the camera, e.g., turning to the viewer, waving, nodding, or speaking a short greeting. To make these interactions natural, we propose a self-distillation pipeline that finetunes the video generation model on data synthesized by itself. Each synthesized clip contains both social interactions and camera motion, allowing the model to learn camera-pose conditioning without degrading interaction quality. At inference, we further introduce a training-free module that determines when the interaction occurs. Upon a button press, it modulates the cross-attention masks of the DiT so that the interaction-related text prompt attends only to the frames within the press window, temporally localizing the character's response. We further build HelloWorldBench, a 400-sample benchmark with three social interaction metrics alongside three conventional metrics, for evaluation. Experiments demonstrate that HelloWorld surpasses a variety of baselines in interaction quality, while maintaining state-of-the-art picture aesthetics and camera-pose following. Project page: https://github.com/AlayaLab/HelloWorld", 'score': 9, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '051503899f9884c3', 'authors': ['Liangyang Ouyang', 'Ruicong Liu', 'Xuangeng Chu', 'Kaipeng Zhang', 'Yoichi Sato'], 'affiliations': ['Alaya Lab', 'The University of Tokyo'], 'pdf_title_img': 'assets/pdf/title_img/2608.05070.jpg', 'data': {'categories': ['#training', '#benchmark', '#video'], 'emoji': '🎬', 'ru': {'title': 'Социальное взаимодействие в видео-моделях мира через самодистилляцию', 'desc': 'Авторы представляют HelloWorld — видео-модель мира, которая позволяет пользователям взаимодействовать с персонажами в синтетических сценах. Система использует конвейер самодистилляции, где модель генерации видео дообучается на данных, синтезированных ею самой, что позволяет одновременно обучиться социальному взаимодействию и управлению движением камеры. На этапе инференса применяется тренируемый модуль, который контролирует кросс-внимание DiT трансформера, локализуя ответ персонажа во времени в соответствии с нажатием кнопки. Для оценки качества разработана специализированная бенчмарк с метриками социального взаимодействия и традиционными метриками генерации видео.'}, 'en': {'title': 'HelloWorld: Enabling Social Interactions in Video Worlds', 'desc': "This paper introduces HelloWorld, a video world model designed to facilitate social interactions between users and characters in video environments. It allows users to prompt characters to perform actions like waving or speaking with a simple button press. The model employs a self-distillation technique to improve its video generation capabilities by training on its own synthesized data, which includes both character interactions and camera movements. Additionally, a training-free module is implemented to accurately time the character's responses, enhancing the overall interaction experience while maintaining high visual quality."}, 'zh': {'title': 'HelloWorld：让虚拟角色与用户互动的未来', 'desc': '本论文介绍了HelloWorld，一个视频世界模型，旨在支持用户与虚拟角色之间的社交互动。用户只需按下一个按钮，角色就会做出回应，例如转向镜头、挥手或打招呼。为了使互动更加自然，研究者提出了一种自我蒸馏的流程，通过自我生成的数据对视频生成模型进行微调。实验结果表明，HelloWorld在互动质量上超越了多种基线，同时保持了卓越的图像美学和镜头姿态跟随能力。'}}}, {'id': 'https://huggingface.co/papers/2608.04964', 'title': 'WorldCycle: Self-Verifiable Reinforcement Learning for Long-Horizon Video World Models', 'url': 'https://huggingface.co/papers/2608.04964', 'abstract': 'Abstract  Interactive video world models are essential for long-horizon planning and exploration, yet they suffer from compounding errors. Post-training methods such as reinforcement learning (RL) can improve these models, but they hit a verification bottleneck: for arbitrary action sequences, no ground-truth future state exists to measure long-term drift. Our key insight is that reversible action cycles make this verification possible: a sequence composed with its inverse must analytically return to the initial state, yielding annotation-free supervision on long-horizon correctness. Building on this, we introduce WorldCycle, a self-verifiable RL framework that constructs closed action cycles and their repeated executions from ordinary action sequences, and optimizes two complementary rewards: a spatial closure reward enforcing symmetry between mirrored forward and reverse segments, and a temporal consistency reward aligning states across repeated cycle executions. These rewards force the model to learn actions as consistent state operators rather than memorized temporal patterns, and extend naturally to out-of-distribution composite action cycles that the base model handles poorly. We further release CycleBench, a diagnostic benchmark for state-returning ability under complex action structures. WorldCycle reduces state returning drift by up to 44% and lifts composite-action accuracy nearly 4x over the base model, providing a vital foundation for physically grounded world models.', 'score': 8, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': '753acbda2ccb9f57', 'authors': ['Bohai Gu', 'Yueyang Yuan', 'Taiyi Wu', 'Dazhao Du', 'Jian Liu', 'Xiaoyi Pang', 'Jie Zhang', 'Xiaocheng Lu', 'Haobin Zhong', 'Xiaotong Zhao', 'Alan Zhao', 'Song Guo'], 'affiliations': ['AI Technology Center, Tencent Video, Tencent', 'The Hong Kong University of Science and Technology', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2608.04964.jpg', 'data': {'categories': ['#benchmark', '#rl', '#dataset', '#video'], 'emoji': '🔄', 'ru': {'title': 'Циклические действия как метод самопроверки для мировых моделей', 'desc': 'В статье представляется WorldCycle — фреймворк для улучшения интерактивных видео-моделей мира через самопроверку, решающий проблему накопления ошибок при долгосрочном планировании. Ключевая идея заключается в использовании обратимых циклов действий: если выполнить действие, а затем обратное ему действие, модель должна аналитически вернуться в исходное состояние, что обеспечивает автоматическую аннотацию для обучения с подкреплением. Фреймворк оптимизирует два дополнительных сигнала вознаграждения: пространственное замыкание, обеспечивающее симметрию между прямыми и обратными сегментами, и временную консистентность, выравнивающую состояния при повторных циклах. Экспериментальные результаты показывают снижение дрейфа состояний на 44% и повышение точности на составных действиях в 4 раза, предоставляя надежный фундамент для физически обоснованных моделей мира.'}, 'en': {'title': 'Revolutionizing Long-Term Planning with Self-Verifiable Action Cycles', 'desc': 'This paper presents WorldCycle, a novel reinforcement learning framework designed to enhance interactive video world models for long-term planning. The key innovation is the use of reversible action cycles, which allow the model to verify its predictions by ensuring that executing an action and its inverse returns to the original state. By optimizing for spatial closure and temporal consistency, WorldCycle encourages the model to treat actions as reliable state operators rather than just memorized sequences. The framework significantly reduces state drift and improves accuracy in complex action scenarios, making it a crucial advancement for developing robust world models.'}, 'zh': {'title': '自验证的强化学习：提升长时间规划的准确性', 'desc': '本论文提出了一种名为WorldCycle的自验证强化学习框架，旨在解决交互视频世界模型在长时间规划和探索中出现的累积误差问题。通过利用可逆动作循环，WorldCycle能够在没有真实未来状态的情况下进行验证，从而提高模型的长期准确性。该框架优化了两个互补的奖励：空间闭合奖励和时间一致性奖励，促使模型学习一致的状态操作而非简单的时间模式。实验结果表明，WorldCycle显著减少了状态返回漂移，并在复合动作的准确性上大幅提升，为物理基础的世界模型奠定了重要基础。'}}}, {'id': 'https://huggingface.co/papers/2608.05131', 'title': 'OPD-V: Visual On-Policy Self-Distillation with Modality Balance', 'url': 'https://huggingface.co/papers/2608.05131', 'abstract': 'Abstract  On-Policy Self-Distillation (OPSD) has become a standard post-training approach for improving visual reasoning in multimodal large language models (MLLMs). Existing methods draw privileged information from diverse input sources to guide self-distillation. Yet these designs overlook Modality Imbalance, a challenge inherent to MLLM reasoning. When textual information dominates generation, the model cannot fully integrate its multimodal input. Consequently, carefully designed privileged information remains underused, limiting the effectiveness of OPSD. To examine this limitation, we construct a Positive Teacher with the Zoom-In Image and a Negative Teacher with the Mask Image, which exhibit different degrees of Modality Imbalance. Changes in their reasoning correctness and token logits reveal that Modality Balance can itself serve as privileged information. Motivated by this finding, we introduce OPD-V, a visual OPSD paradigm that instantiates such information through the Positive Teacher and Negative Teacher. Positive Modality-Balance Logits Margins define a Modality-Balance Trust Region that selects the on-policy tokens used for self-distillation. Experiments across 6 benchmarks, 4 MLLM backbones, and 5 post-training methods show that OPD-V consistently improves reasoning performance while reducing training cost.', 'score': 8, 'issue_id': 2861, 'pub_date': '2026-08-05', 'pub_date_card': {'ru': '5 августа', 'en': 'August 5', 'zh': '8月5日'}, 'hash': 'c5f55d7979270e3e', 'authors': ['Aniri', 'Jinhe Bi', 'Peng Liao', 'Zengjie Jin', 'Volker Tresp', 'Fei Shen', 'Yunpu Ma', 'Tat-Seng Chua'], 'affiliations': ['Ludwig Maximilian University of Munich', 'Munich Center for Machine Learning', 'National University of Singapore', 'Sun Yat-sen University'], 'pdf_title_img': 'assets/pdf/title_img/2608.05131.jpg', 'data': {'categories': ['#training', '#multimodal', '#reasoning', '#optimization', '#rlhf'], 'emoji': '⚖️', 'ru': {'title': 'Балансировка модальностей как привилегированная информация для самодистилляции', 'desc': 'В статье рассматривается проблема дисбаланса модальностей при самодистилляции мультимодальных больших языковых моделей. Авторы показывают, что когда текстовая информация доминирует при генерации, модель не может полностью использовать визуальные входные данные, что снижает эффективность обучения. Они предлагают метод OPD-V, который использует позитивного и негативного учителя с различными визуальными модификациями для балансирования модальностей. Экспериментальные результаты на шести бенчмарках подтверждают, что предложенный подход улучшает качество логического рассуждения при одновременном снижении вычислительных затрат.'}, 'en': {'title': 'Balancing Modalities for Better Reasoning in MLLMs', 'desc': 'This paper introduces On-Policy Self-Distillation (OPSD) as a method to enhance visual reasoning in multimodal large language models (MLLMs). It identifies the issue of Modality Imbalance, where the model struggles to integrate information from different sources when one type dominates. The authors propose a new approach, OPD-V, which uses Positive and Negative Teachers to balance modalities and improve reasoning accuracy. Their experiments demonstrate that this method not only boosts performance across various benchmarks but also reduces training costs.'}, 'zh': {'title': '提升多模态推理的自我蒸馏新方法', 'desc': '本文提出了一种新的视觉自我蒸馏方法，称为OPD-V，旨在改善多模态大语言模型（MLLMs）的视觉推理能力。现有的方法在自我蒸馏过程中利用了来自不同输入源的特权信息，但忽视了模态不平衡的问题，这导致模型无法充分整合多模态输入。通过构建正负教师模型，研究发现模态平衡本身可以作为特权信息，从而提高推理的准确性。实验结果表明，OPD-V在多个基准测试中表现出色，同时降低了训练成本。'}}}, {'id': 'https://huggingface.co/papers/2608.05042', 'title': 'BridgeVLA++: A Data-Efficient, Generalizable, and Memory-Augmented Vision-Language-Action Framework for 3D Manipulation', 'url': 'https://huggingface.co/papers/2608.05042', 'abstract': "Abstract  Leveraging pre-trained vision-language models (VLMs) to construct vision-language-action (VLA) models has emerged as a promising paradigm for 3D robot manipulation. However, existing 3D VLA methods remain data-hungry, exhibit limited generalization under distribution shifts, and lack explicit memory of past observations. These limitations hinder their application to data-scarce, open-world, and memory-dependent manipulation scenarios. Our previous work, BridgeVLA, improves data efficiency and generalization by preserving the input--output alignment of a pre-trained VLM during 3D action learning: raw point clouds are projected into multi-view images, and intermediate heatmaps are predicted before generating robot actions. In this work, we develop BridgeVLA++ by equipping BridgeVLA with a unified spatio-temporal memory architecture that models persistent spatial context and temporal interaction history. The resulting memory-augmented framework can reason over observation histories while preserving BridgeVLA's data e
