nd in-context learning without exceeding its established knowledge boundaries. This controlled environment serves as a valuable tool for understanding the limits and capabilities of language models in a structured educational context.'}, 'zh': {'title': '受限环境下的知识获取与能力研究', 'desc': '本文介绍了一个名为LITTLECURRICULUM的预训练语料库，专为美国小学教材设计，包含88B个标记，排除了五年级以上的概念和词汇。通过在这个语料库上从零开始训练一个5B参数的语言模型LITTLELEARNER，研究人员能够清晰地界定模型的知识和能力边界。该模型在开放式评估中表现出足够的语言能力，同时遵循可解释的课程指导。研究表明，这种受限的训练环境有助于理解模型如何获取、表示和使用知识。'}}}, {'id': 'https://huggingface.co/papers/2608.09928', 'title': 'Multimodal Model Diffing for Feature Discovery and Control', 'url': 'https://huggingface.co/papers/2608.09928', 'abstract': 'Abstract MMDiff uses multimodal sparse autoencoders to isolate, detect, and control specific features in multimodal language models, improving interpretability and targeted steering of visual and safety behaviors.  Generated by thinkingmachines/Inkling-Small Multimodal Large Language Models (MLLMs) exhibit strong visual understanding, yet the internal features that cause these behaviors remain difficult to identify, audit, or control. While applicable to post-hoc inspection, hidden states that are decomposed into interpretable feature directions using sparse autoencoders (SAEs) neither readily isolate which features are changed by multimodal training, nor are they directly useful for targeted control. We introduce MMDiff, a multimodal model-diffing framework that trains multimodal SAEs and turns them into feature-level interfaces for discovering and controlling multimodal behavior. MMDiff supports three uses: (i) feature isolation, by diffing a base-LM SAE against its multimodal-adapted counterpart to identify features altered by multimodal training; (ii) task-specific feature detection, via per-token contrastive firing analysis that isolates causal features; and (iii) feature-level control, by causally removing or steering the discovered feature directions. We train multimodal SAEs for three MLLM families, LLaVA-MORE, PaliGemma 2, and InternVL3.5, and evaluate on visual-spatial understanding, multimodal safety, and OCR. MMDiff discovers sparse, causally specific features whose removal selectively degrades target behaviors by an average of 12% on spatial tasks and 17% on OCR, and reduces attack success rate by 24% on multimodal safety attacks, with no impact on VQA performance. Steering these features improves spatial and OCR accuracy by +3.6% and +1.8% on average over a standard single-layer steering baseline. These results show that multimodal SAEs can serve not only as interpretability tools, but as mechanisms for auditing, steering, and controlling MLLMs behavior toward safer and more capable generations.', 'score': 3, 'issue_id': 2996, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': 'a3bd47a67dd7df36', 'authors': ['Hunar Batra', 'Lachin Naghashyar', 'Ashkan Khakzar', 'Philip Torr', 'Christian Schroeder de Witt', 'Constantin Venhoff', 'Ronald Clark'], 'affiliations': ['Microsoft', 'University of Oxford'], 'pdf_title_img': 'assets/pdf/title_img/2608.09928.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#interpretability', '#security'], 'emoji': '🔍', 'ru': {'title': 'Разреженные автокодировщики как инструмент управления поведением мультимодальных моделей', 'desc': 'MMDiff — это фреймворк для анализа многомодальных больших языковых моделей, который использует разреженные автокодировщики для декомпозиции скрытых представлений на интерпретируемые компоненты. Метод позволяет идентифицировать, изолировать и контролировать специфичные признаки в моделях, сравнивая их базовые и мультимодально адаптированные версии. Исследование демонстрирует, что целевое удаление или перенаправление выявленных признаков может эффективно контролировать поведение модели в задачах визуального понимания и безопасности. Подход открывает новые возможности для аудита и управления поведением мультимодальных моделей без переобучения.'}, 'en': {'title': 'MMDiff: Steering Multimodal Models for Better Control and Safety', 'desc': "MMDiff is a framework that enhances the interpretability and control of multimodal language models by using multimodal sparse autoencoders (SAEs). It allows researchers to isolate and detect specific features that influence the model's behavior, making it easier to understand and manage how these models respond to different inputs. The framework supports three main functions: identifying altered features from multimodal training, detecting task-specific features, and controlling these features to improve model performance. By applying MMDiff, significant improvements in visual-spatial understanding and safety behaviors were achieved, demonstrating its effectiveness in steering multimodal models."}, 'zh': {'title': 'MMDiff：多模态特征控制的新方法', 'desc': 'MMDiff是一种多模态模型差异化框架，利用稀疏自编码器（SAE）来隔离、检测和控制多模态语言模型中的特定特征。该方法提高了对视觉和安全行为的可解释性和针对性控制。通过对比基础语言模型的SAE与其多模态适应版本，MMDiff能够识别多模态训练所改变的特征，并支持任务特定的特征检测和特征级控制。实验结果表明，MMDiff能够有效发现稀疏且因果特定的特征，从而在空间任务和光学字符识别（OCR）中显著提升性能。'}}}, {'id': 'https://huggingface.co/papers/2608.11612', 'title': 'Dion3: Full-Stack Orthogonal Updates', 'url': 'https://huggingface.co/papers/2608.11612', 'abstract': 'Abstract Dion3 accelerates the Muon optimizer by reducing orthogonalization and communication overhead through algorithmic, kernel-level, and update-rule improvements.  Generated by thinkingmachines/Inkling-Small The Muon optimizer incurs a significant overhead cost due to its cubic-time Newton-Schulz orthogonalization step. When weights are sharded, communication overhead compounds this computational cost, eroding the benefits of Muon in many settings. We present Dion3, a revision of Muon that targets this overhead at every level of the stack. Our Gram Newton-Schulz algorithm reduces the FLOP cost of orthogonalization, our CuteDSL kernels accelerate it by exploiting symmetry, and our megabatching strategy reduces communication overhead. Moreover, we propose a simple change to the update rule that cuts costs even further: selecting only a fraction of the momentum matrix\'s rows to orthogonalize at each step. This update rule improves on Dion (another "compressed" version of Muon), in both speed and performance. Overall, Dion3 matches or improves on the loss achieved by Muon but reduces optimizer step time by up to 6x. Dion3 is available via the dion package (https://github.com/microsoft/dion) as a drop-in replacement for Muon.', 'score': 2, 'issue_id': 2994, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '752e1a47b43f501c', 'authors': ['Noah Amsel', 'Jack Zhang', 'Kwangjun Ahn', 'Ali Naeimi', 'Austin Feng', 'Berlin Chen', 'Tri Dao', 'John Langford'], 'affiliations': ['Microsoft Research', 'NVIDIA', 'New York University', 'Princeton University', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2608.11612.jpg', 'data': {'categories': ['#optimization', '#open_source'], 'emoji': '⚡', 'ru': {'title': 'Шесть раз быстрее: оптимизатор Dion3 побеждает коммуникационные издержки', 'desc': 'Статья представляет Dion3 — оптимизированную версию оптимизатора Muon, который значительно ускоряется за счёт снижения вычислительных затрат на ортогонализацию и коммуникационных издержек. Авторы вводят алгоритм Gram Newton-Schulz для уменьшения количества операций при ортогонализации, специализированные ядра CuteDSL для более быстрого выполнения вычислений, а также стратегию мегабатчинга для снижения коммуникационных затрат при распределённом обучении. Ключевым улучшением является модификация правила обновления, при котором ортогонализируется только часть строк матрицы импульса на каждом шаге, что обеспечивает дополнительное ускорение. Dion3 достигает качества обучения, сравнимого или лучшего, чем Muon, при этом сокращая время шага оптимизатора в 6 раз.'}, 'en': {'title': 'Dion3: Speeding Up Muon Optimization with Smart Improvements', 'desc': "Dion3 is an enhanced version of the Muon optimizer that significantly reduces computational overhead associated with the orthogonalization process. It introduces a Gram Newton-Schulz algorithm that lowers the floating-point operations (FLOP) required for orthogonalization, while also utilizing CuteDSL kernels to speed up computations by taking advantage of symmetry. Additionally, Dion3 implements a megabatching strategy to minimize communication overhead when weights are distributed across multiple devices. By modifying the update rule to orthogonalize only a subset of the momentum matrix's rows, Dion3 achieves faster optimization times, improving performance by up to 6 times compared to the original Muon optimizer."}, 'zh': {'title': 'Dion3：提升 Muon 优化器效率的革命性改进', 'desc': 'Dion3 是一种改进的 Muon 优化器，通过算法、内核级和更新规则的改进，减少了正交化和通信开销。传统的 Muon 优化器在正交化步骤中存在显著的开销，尤其是在权重分片时，通信开销进一步加重了计算成本。Dion3 通过 Gram Newton-Schulz 算法和 CuteDSL 内核加速正交化，并采用大批量处理策略来降低通信开销。此外，Dion3 还通过选择动量矩阵的部分行进行正交化，进一步提高了速度和性能，优化器步骤时间最多减少了 6 倍。'}}}, {'id': 'https://huggingface.co/papers/2608.10835', 'title': 'UniProbe: A Learnable Token-Level Hallucination Detector for Large VLMs using Multi-Structural Internal Representations', 'url': 'https://huggingface.co/papers/2608.10835', 'abstract': "Abstract UniProbe is a lightweight learnable detector that uses a directed graph and alternating GNN, ViT, and GRU modules to identify hallucinated tokens in frozen large vision-language models, enabling real-time resampling during generation.  Generated by thinkingmachines/Inkling-Small Large Vision-Language Models (LVLMs) achieve impressive visual reasoning and dialogue capabilities, yet frequently hallucinate content unsupported by the visual input. Effective mitigation requires token-level localization, enabling targeted intervention without discarding the entire response. Existing detectors require expensive full-model fine-tuning, rely on external verifiers that ignore the model's generation process, or reduce internal signals to isolated features and hand-crafted statistics, discarding spatial, sequential, and relational structure. We introduce UniProbe, a lightweight, unified, learnable detector that models a frozen LVLM's heterogeneous computational trace from a single forward pass. UniProbe constructs a directed graph over image patches, query tokens, and generated tokens, with attention weights encoding their relations. It processes this trace with alternating structure-aware modules: a GNN for relational evidence, a ViT for 2-D visual geometry, and a GRU for response order. Interleaving them allows spatial, relational, and sequential evidence to interact throughout the detector. We further develop a streaming variant for hallucination-aware decoding, which detects and resamples hallucinated tokens during generation, and a self-adaptation strategy aligning the detector with the LVLM's own generations. Across diverse LVLM backbones, UniProbe achieves state-of-the-art token-level and object-hallucination detection. During decoding, it reduces object hallucinations by up to 55\\% at 1.06times the latency of standard generation.", 'score': 2, 'issue_id': 2999, 'pub_date': '2026-08-11', 'pub_date_card': {'ru': '11 августа', 'en': 'August 11', 'zh': '8月11日'}, 'hash': 'b49134f50c8ca690', 'authors': ['Dvir Samuel', 'Guy Bar-Shalom', 'Fabrizio Frasca', 'Ethan Fetaya', 'Yftah Ziser', 'Gal Chechik', 'Haggai Maron'], 'affiliations': ['Bar-Ilan University, Ramat Gan, Israel', 'NVIDIA Research, Tel Aviv, Israel', 'Technion, Haifa, Israel', 'University of Groningen, Groningen, The Netherlands'], 'pdf_title_img': 'assets/pdf/title_img/2608.10835.jpg', 'data': {'categories': ['#graphs', '#multimodal', '#hallucinations', '#architecture', '#inference', '#interpretability'], 'emoji': '🔍', 'ru': {'title': 'Лёгкий детектор галлюцинаций в мультимодальных моделях через анализ вычислительного следа', 'desc': 'UniProbe — это лёгкий обучаемый детектор для выявления галлюцинаций в больших мультимодальных моделях. Он использует ориентированный граф и чередующиеся модули (GNN, ViT и GRU) для анализа вычислительного следа замороженной модели при обработке одного прохода вперёд. Детектор моделирует пространственные, реляционные и последовательные связи между патчами изображения и сгенерированными токенами, позволяя выявлять и переискать галлюцинированные токены во время декодирования. Метод достигает современных результатов в обнаружении галлюцинаций на уровне токенов и сокращает объектные галлюцинации на 55% при минимальном увеличении латентности.'}, 'en': {'title': 'UniProbe: Real-Time Hallucination Detection in Vision-Language Models', 'desc': 'UniProbe is a novel lightweight detector designed to identify hallucinated tokens in large vision-language models (LVLMs) without the need for extensive fine-tuning. It utilizes a directed graph structure to represent relationships between image patches, query tokens, and generated tokens, leveraging attention weights for relational encoding. The model incorporates alternating modules, including Graph Neural Networks (GNN), Vision Transformers (ViT), and Gated Recurrent Units (GRU), to effectively process spatial, relational, and sequential information. UniProbe not only enhances token-level detection but also enables real-time resampling during generation, significantly reducing hallucinations while maintaining efficient performance.'}, 'zh': {'title': 'UniProbe：实时检测幻觉标记的轻量级检测器', 'desc': 'UniProbe是一种轻量级的可学习检测器，利用有向图和交替的图神经网络（GNN）、视觉变换器（ViT）和门控循环单元（GRU）模块来识别冻结的大型视觉语言模型中的幻觉标记。该模型能够在生成过程中实时重新采样，解决了大型视觉语言模型在视觉输入支持下频繁产生不真实内容的问题。UniProbe通过构建图像块、查询标记和生成标记之间的有向图，利用注意力权重编码它们的关系，从而实现了有效的标记级定位。通过交替使用结构感知模块，UniProbe在不同的视觉语言模型上实现了最先进的幻觉检测效果，显著减少了生成过程中的对象幻觉。'}}}, {'id': 'https://huggingface.co/papers/2608.14075', 'title': 'A Pathway to General-Purpose Scientific AI: Multimodal Comprehension of Scientific Images', 'url': 'https://huggingface.co/papers/2608.14075', 'abstract': 'Abstract The ALD/E-ImageMiner benchmark and ICDAR 2026 competition advance machine interpretation of scientific figures through tasks spanning visual reading, domain reasoning, and evidential justification, proposing long-term goals for verifiable multimodal scientific AI.  Generated by thinkingmachines/Inkling-Small Scientific figures and tables encode essential experimental evidence, yet remain difficult for digital libraries and multimodal AI systems to retrieve and interpret. The ALD/E-ImageMiner benchmark and ICDAR 2026 Competition on Information Extraction from Atomic Layer Deposition/Etching Scientific Figures provide 1,951 figures from 205 publications, expert-annotated for classification, data table extraction, summarization, and visual question answering. In these companion proceedings, we present a forward-looking perspective on how the benchmark can guide future scientific-image challenges. We examine how its tasks probe capabilities from visual and quantitative reading to domain-grounded reasoning and evidential justification, and how Bloom-informed question design can support deeper scientific understanding. We propose "scientific conceptual understanding from images" as a long-term benchmark objective, with future directions including broader domains and figure types, contextual and cross-document synthesis, hypothesis evaluation, provenance, uncertainty, counterfactual grounding, and open-ended multimodal research. This perspective connects the ICDAR 2026 challenge to a broader agenda for machine-actionable scientific visual knowledge and verifiable multimodal scientific AI.', 'score': 1, 'issue_id': 3001, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': 'e527972f574a85c3', 'authors': ["Jennifer D'Souza", 'Fahad Ahmed', 'Cecilia Andrea Bustamante Andrade', 'Lina Frolova', 'Poorani Gnanasambandan', 'Dilshad Hussain', 'Muhammad Uzair Khan', 'Nkembeng Kevin Nkengfoa', 'Paul Praveen J.', 'Fabio Priante', 'Sjoerd Franciscus van der Werf', 'Thomas Frederik Jan van Roeden'], 'affiliations': ['Aalto University', 'Eindhoven University of Technology', 'Freie Universität Berlin', 'HEJ Research Institute of Chemistry, International Center for Chemical and Biological Sciences, University of Karachi', 'National University of Sciences and Technology', 'PSG College of Technology', 'TIB Leibniz Information Centre for Science and Technology', 'University of Warwick'], 'pdf_title_img': 'assets/pdf/title_img/2608.14075.jpg', 'data': {'categories': ['#benchmark', '#science', '#cv', '#dataset', '#survey', '#multimodal'], 'emoji': '📊', 'ru': {'title': 'Мультимодальное понимание научных изображений для верифицируемого AI в науке', 'desc': 'Статья представляет бенчмарк ALD/E-ImageMiner и конкурс ICDAR 2026, которые направлены на улучшение машинного понимания научных диаграмм и таблиц из публикаций. Датасет содержит 1951 аннотированное изображение с заданиями на классификацию, извлечение данных, суммаризацию и ответы на вопросы о визуальном контенте. Авторы предлагают подход к оценке способности моделей к визуальному чтению, количественному анализу, рассуждениям в предметной области и обоснованию выводов. Работа определяет долгосрочные цели развития верифицируемых мультимодальных систем искусственного интеллекта для научных исследований.'}, 'en': {'title': 'Advancing Machine Understanding of Scientific Figures', 'desc': 'The paper discusses the ALD/E-ImageMiner benchmark and the ICDAR 2026 competition, which aim to improve how machines interpret scientific figures. It highlights the challenges of extracting and understanding data from visual representations in scientific literature. The benchmark includes a dataset of 1,951 figures that are annotated for various tasks like classification and visual question answering. The authors propose a long-term goal of achieving scientific conceptual understanding from images, suggesting future research directions in multimodal AI and evidence-based reasoning.'}, 'zh': {'title': '推动科学图形的机器解读', 'desc': 'ALD/E-ImageMiner基准和ICDAR 2026竞赛旨在推动科学图形的机器解读，涵盖视觉阅读、领域推理和证据证明等任务。这些科学图形和表格包含重要的实验证据，但对于数字图书馆和多模态AI系统来说，检索和解读仍然困难。该基准提供了来自205篇出版物的1,951个图形，经过专家注释，用于分类、数据表提取、摘要和视觉问答。我们提出“从图像中理解科学概念”作为长期基准目标，未来方向包括更广泛的领域和图形类型，以及跨文档综合和假设评估等。'}}}, {'id': 'https://huggingface.co/papers/2608.09209', 'title': 'UNMASK: Discovering and Causally Verifying Spurious Shortcuts in Text Classifiers', 'url': 'https://huggingface.co/papers/2608.09209', 'abstract': 'Abstract UNMASK automatically discovers and mitigates spurious correlations in text classifiers via causal verification and group-based reweighting without manual annotations.  Generated by thinkingmachines/Inkling-Small Neural language models trained on large crowdsourced corpora frequently exploit spurious surface patterns tied to target labels without true linguistic or causal relevance, boosting benchmark performance while failing on adversarial or out-of-distribution inputs. Existing approaches either require manual specification of the feature vocabulary or automate discovery only partially, leaving the gap between dataset-level correlation and model-level exploitation unaddressed. We present U N M ASK, a fully automated pipeline that discovers, causally verifies, and mitigates spurious correlations in text classifiers without additional human annotation. Given unlabeled training examples, U N M ASK generates candidate surface patterns as executable boolean expressions, filters them through a statistical validation protocol with independent replication, and establishes causal model dependence via verified counterfactual interventions. Causally confirmed features then serve as annotation-free group definitions for Deep Feature Reweighting, eliminating the group labels that standard DFR requires. Applied to BERT and RoBERTa trained on MNLI, our pipeline independently rediscovers established lexical-overlap and negation biases, verifying 9 of 10 features on BERT and 6 on RoBERTa, and improving HANS accuracy by up to 12.58 pp. On CivilComments-WILDS, programmatic groups match the 70.1% worst- group accuracy of hand-labeled DFR (Kirichenko et al., 2023) without demographic annotation. We further demonstrate that the discovery and validation stages generalize to reward model preference data, surfacing interpretable spurious correlations in RewardBench2.', 'score': 1, 'issue_id': 3000, 'pub_date': '2026-08-10', 'pub_date_card': {'ru': '10 августа', 'en': 'August 10', 'zh': '8月10日'}, 'hash': '5a26d57dad91da18', 'authors': ['Chidaksh Ravuru', 'Shashank Srivastava'], 'affiliations': ['University of North Carolina, Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2608.09209.jpg', 'data': {'categories': ['#benchmark', '#data', '#training'], 'emoji': '🎭', 'ru': {'title': 'Автоматическое выявление скрытых закономерностей в текстовых моделях через причинную верификацию', 'desc': 'UNMASK — это полностью автоматизированный метод для обнаружения и устранения ложных корреляций в текстовых классификаторах без участия человека. Алгоритм генерирует кандидатные поверхностные паттерны в виде булевых выражений, проверяет их статистическую значимость и устанавливает причинно-следственные связи через контрфактические вмешательства. Подтвержденные причинные признаки используются для перевзвешивания выборок в группах, что позволяет избежать необходимости ручной аннотации данных. Метод демонстрирует значительное улучшение производительности на adversarial примерах, таких как HANS dataset, без требования знания демографических групп заранее.'}, 'en': {'title': 'Automating the Discovery and Mitigation of Spurious Correlations in Text Classifiers', 'desc': 'The paper presents UNMASK, a method that automatically identifies and reduces spurious correlations in text classifiers without needing manual annotations. It uses causal verification to ensure that the discovered patterns are genuinely relevant to the task, rather than just coincidental. By generating boolean expressions from unlabeled data and validating them statistically, UNMASK can effectively mitigate biases in models like BERT and RoBERTa. The approach not only improves model performance on specific tasks but also generalizes to other areas, such as reward model preference data.'}, 'zh': {'title': '自动发现与减轻文本分类器中的虚假相关性', 'desc': 'UNMASK 是一个自动化工具，能够发现并减轻文本分类器中的虚假相关性，而无需人工标注。它通过因果验证和基于组的重加权来实现这一目标，解决了现有方法中手动指定特征词汇或部分自动发现的问题。UNMASK 生成可执行的布尔表达式作为候选表面模式，并通过统计验证协议进行过滤，确保因果模型的依赖性。该方法在 BERT 和 RoBERTa 模型上应用，成功验证了多个特征，并显著提高了模型的准确性。'}}}, {'id': 'https://huggingface.co/papers/2608.14138', 'title': 'SPARGen: Unifying Spatial Perception and Reasoning through Native Multimodal Generation', 'url': 'https://huggingface.co/papers/2608.14138', 'abstract': 'Abstract SPARGen unifies 3D reconstruction, dense correspondence, and spatial reasoning into a single instruction-conditioned multimodal generative model that jointly learns shared spatial representations.  Generated by thinkingmachines/Inkling-Small Spatial perception and reasoning from visual observations require recovering geometric structure, establishing correspondences, and understanding spatial relations. Existing approaches typically address these capabilities separately using task-specific architectures or external geometric modules, limiting knowledge transfer among complementary representations of the same physical scene. We introduce SPARGen, a unified multimodal framework that casts 3D reconstruction, dense correspondence, and spatial reasoning as instruction-conditioned generation tasks. SPARGen serializes compact structured and linguistic outputs as token sequences while generating dense geometric fields in image-aligned forms, enabling spatial supervision to jointly shape shared representations within a native multimodal generative model. Experiments across benchmarks for 3D reconstruction, correspondence, and spatial reasoning show that SPARGen achieves competitive performance across heterogeneous spatial tasks within a single native multimodal generative framework.', 'score': 0, 'issue_id': 2994, 'pub_date': '2026-08-14', 'pub_date_card': {'ru': '14 августа', 'en': 'August 14', 'zh': '8月14日'}, 'hash': '23c65febec26e43d', 'authors': ['Jinsheng Quan', 'Jianhua Li', 'Siyi Xie', 'Xuanke Shi', 'Kewang Deng', 'Zukai Chen', 'Feifei Shao', 'Lei Yang', 'Quan Wang', 'Yawei Luo'], 'affiliations': ['Peking University', 'SenseTime Research', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2608.14138.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#3d'], 'emoji': '🧩', 'ru': {'title': 'Единая генеративная модель для пространственного понимания сцен', 'desc': 'SPARGen представляет собой единую мультимодальную генеративную модель, которая объединяет трёхмерную реконструкцию, установление плотного соответствия и пространственное рассуждение в одной архитектуре. Модель работает с инструкциями и совместно обучает общие пространственные представления, кодируя выходные данные в виде последовательностей токенов. В отличие от существующих подходов, которые используют отдельные специализированные архитектуры для каждой задачи, SPARGen позволяет знаниям передаваться между различными пространственными представлениями одной сцены. Экспериментальная оценка на эталонных наборах данных показывает, что модель достигает конкурентных результатов сразу по нескольким пространственным задачам в рамках одного обобщённого фреймворка.'}, 'en': {'title': 'Unifying 3D Tasks with SPARGen: One Model, Many Solutions', 'desc': 'SPARGen is a novel multimodal generative model that integrates 3D reconstruction, dense correspondence, and spatial reasoning into one framework. It learns shared spatial representations by treating these tasks as instruction-conditioned generation problems. This approach allows for better knowledge transfer between different spatial tasks, overcoming limitations of traditional methods that use separate architectures. Experiments demonstrate that SPARGen performs competitively across various benchmarks, showcasing its effectiveness in handling diverse spatial challenges.'}, 'zh': {'title': 'SPARGen：统一的多模态生成模型', 'desc': 'SPARGen 是一个统一的多模态生成模型，将 3D 重建、密集对应和空间推理整合为一个指令条件生成任务。该模型通过学习共享的空间表示，解决了从视觉观察中恢复几何结构、建立对应关系和理解空间关系的问题。与传统方法不同，SPARGen 不再使用特定任务的架构或外部几何模块，而是将这些能力统一在一个框架内。实验结果表明，SPARGen 在多个空间任务上表现出色，展示了其在多模态生成模型中的竞争力。'}}}, {'id': 'https://huggingface.co/papers/2608.12209', 'title': 'Generation as Auxiliary Supervision: Enhancing Visual Understanding at Zero Inference Overhead via Decoupled Embedding Prediction', 'url': 'https://huggingface.co/papers/2608.12209', 'abstract': 'Abstract GAS improves multimodal understanding by using generation as auxiliary supervision via next embedding prediction and a decoupled mixture-of-transformers architecture, with no inference overhead.  Generated by thinkingmachines/Inkling-Small While Multimodal Large Language Models (MLLMs) have achieved remarkable progress, visual understanding and generation are typically treated as divergent objectives. Existing unified frameworks often rely on discrete visual tokenization or diffusion objectives whose generative targets differ from the continuous representations consumed by visual understanding models, making direct transfer to enhance existing pretrained MLLMs non-trivial. In this work, we present GAS, a generation-guided training framework that reinterprets visual generation as auxiliary supervision for representation learning. Concretely, GAS adapts Next Embedding Prediction (NEP) as a cross-modal generation paradigm within a decoupled Mixture-of-Transformers (MoT) architecture. By maintaining a shared lower trunk and parallel upper layers, GAS lets generation losses enrich the shared visual pathway with finer spatial precision and stronger visual retention while shielding the upper understanding layers from direct generation gradients. To maximize this synergy, we further construct highly correlated generation tasks that demand deep cognitive grounding rather than generic synthesis alone. Across model scales and training stages, GAS improves aggregate multimodal understanding, with its most reliable gains on perception and spatial comprehension. Crucially, because the auxiliary generation branch is discarded after training, these gains incur zero inference overhead. Extensive controlled comparisons and representation-level analyses further clarify when and why generation-guided training benefits understanding, and demonstrate the feasibility of generation-guided training as a practical route to stronger multimodal understanding.', 'score': 0, 'issue_id': 2995, 'pub_date': '2026-08-12', 'pub_date_card': {'ru': '12 августа', 'en': 'August 12', 'zh': '8月12日'}, 'hash': '845cb450d95b1909', 'authors': ['Zhongbin Guo', 'Jiahao Xie', 'Dongling Xiao', 'Qianle Wang', 'Ruiqi Lu', 'Xiaomin He', 'Wanxuan Sun', 'Cheng Yang'], 'affiliations': ['ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2608.12209.jpg', 'data': {'categories': ['#architecture', '#multimodal', '#training'], 'emoji': '🎨', 'ru': {'title': 'Генерация как учитель: вспомогательное обучение для лучшего мультимодального понимания', 'desc': 'GAS предлагает новый подход к обучению мультимодальных больших языковых моделей, используя генерацию визуальных представлений как вспомогательную задачу для улучшения понимания. Авторы вводят метод Next Embedding Prediction (предсказание следующего встраивания) в архитектуру Mixture-of-Transformers с разделёнными слоями, где генерация обогащает общее визуальное представление более точной пространственной информацией. Вспомогательная ветка генерации удаляется после обучения, поэтому метод не добавляет вычислительных затрат при инференсе. Эксперименты показывают улучшение в восприятии, пространственном понимании и общем качестве мультимодального понимания модели.'}, 'en': {'title': 'GAS: Enhancing Multimodal Understanding through Generation Guidance', 'desc': 'The paper introduces GAS, a novel framework that enhances multimodal understanding by using generation tasks as auxiliary supervision. It employs Next Embedding Prediction (NEP) within a decoupled Mixture-of-Transformers (MoT) architecture, allowing for improved visual representation learning without increasing inference time. By integrating generation losses, GAS refines the visual pathway while protecting the understanding layers from direct influence of generation gradients. The results show that GAS significantly boosts perception and spatial comprehension across various model scales and training stages, demonstrating its effectiveness in multimodal learning.'}, 'zh': {'title': '生成指导，提升多模态理解！', 'desc': 'GAS是一种生成指导的训练框架，通过将视觉生成视为辅助监督来增强多模态理解。它采用了下一嵌入预测（NEP）作为跨模态生成范式，并在解耦的混合变换器架构中实现。GAS通过共享的下部结构和并行的上层，使生成损失能够提高视觉路径的空间精度和视觉保留能力，同时保护上层理解层不受直接生成梯度的影响。经过训练后，辅助生成分支被丢弃，因此在推理时不会增加额外的开销。'}}}];

                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-08-17 09:33',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-08-17 09:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-08-17 09:33')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
