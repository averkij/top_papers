': {'title': '实时反应的通用操控策略πR^2', 'desc': '本文介绍了一种名为πR^2的策略，它使得通用操控策略能够在实时环境中反应。传统的操控策略由于执行过程中无法响应传感器输入，导致反应迟缓。πR^2通过将条件分为快速通道和慢速通道，允许策略在执行过程中对自身状态做出快速反应，同时容忍视觉信息的滞后。此外，πR^2采用延迟自适应流调度，使得在不同硬件延迟下，策略能够快速生成动作，从而显著提高了操控的成功率。'}}}, {'id': 'https://huggingface.co/papers/2607.26314', 'title': 'StealthBench: Measuring Operational Stealth in Autonomous Offensive-Security Agents', 'url': 'https://huggingface.co/papers/2607.26314', 'abstract': 'Abstract  Stealth, the discipline of achieving an objective without revealing your presence, capabilities, or collected intelligence, is what separates sophisticated operators from detectable ones. Elite security researchers and advanced persistent threats achieve their objectives unnoticed; autonomous agents increasingly inherit the same offensive tasks, but do they inherit the tradecraft? We introduce StealthBench,a benchmark that measures operational stealth in autonomous offensive-security agents across six operational security (OPSEC) dimensions. We extract 11 hand-verified OPSEC incidents from real bug-bounty and red-team trajectories, expanded into 14 dockerized task scenarios, where agents, despite finding real vulnerabilities, committed stealth failures inconsistent with standard operational tradecraft: embedding credentials in public uploads, deleting production resources to prove access, force-adding uninvolved users to demonstrate a race condition.   We evaluate agent trajectories using a 3-model large language model (LLM) judge panel with majority-vote aggregation, measuring safe success rate (solved and stealthy), Stealth@Solve (tradecraft quality among successful solves), and reckless solve rate (solved but cover blown). Our results show that no model exceeds 54% safe success rate (the compound metric requiring both task completion and stealth), confirming that OPSEC failures are systematic across model families. We release StealthBench as a public benchmark to support both the development of stealth-aware agents and automated OPSEC monitoring for autonomous offensive-security deployments. The interactive leaderboard, evaluation harness, and dataset are available at https://stealthbench.com.', 'score': 2, 'issue_id': 2798, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '088d930912d42f2d', 'authors': ['Ads Dawson', 'Adrian Wood'], 'affiliations': ['USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.26314.jpg', 'data': {'categories': ['#benchmark', '#agents', '#dataset'], 'emoji': '🥷', 'ru': {'title': 'Скрытность как мастерство: обучение агентов соблюдать OPSEC при выполнении наступательных задач', 'desc': 'В статье представлен StealthBench — бенчмарк для оценки операционной безопасности автономных агентов в задачах наступательной безопасности. Авторы выделили 11 реальных инцидентов нарушения OPSEC из практики баг-бауна и красных команд, развернув их в 14 сценариях, где агенты находили уязвимости, но допускали ошибки скрытности — раскрывали учетные данные и удаляли ресурсы. Для оценки траекторий агентов использовалась панель из трёх LLM-судей с голосованием большинством, измеряя метрики безопасного успеха и качество оперативной подготовки. Результаты показали, что ни одна модель не достигла 54% безопасного успеха, подтверждая систематичность проблем OPSEC во всех семействах моделей.'}, 'en': {'title': 'Enhancing Stealth in Autonomous Security Agents', 'desc': 'This paper introduces StealthBench, a benchmark designed to evaluate the operational stealth of autonomous offensive-security agents across six dimensions of operational security (OPSEC). The authors analyze real-world incidents from bug-bounty and red-team activities, identifying common stealth failures made by agents, such as exposing credentials and unnecessary resource deletions. Using a three-model large language model (LLM) judging panel, they measure various metrics including safe success rate and tradecraft quality among successful tasks. The findings reveal that no model achieves a safe success rate above 54%, indicating that OPSEC failures are a widespread issue in current autonomous agents.'}, 'zh': {'title': '隐蔽性评估：提升自主安全代理的能力', 'desc': '本论文介绍了StealthBench，这是一个用于评估自主攻击安全代理在操作安全（OPSEC）方面隐蔽性的基准。研究表明，尽管这些代理能够发现真实的漏洞，但在执行任务时却常常出现隐蔽性失败，违反了标准的操作技巧。我们使用一个三模型的大型语言模型评估代理的表现，结果显示没有任何模型的安全成功率超过54%。StealthBench的发布旨在支持隐蔽性意识代理的开发以及自主攻击安全部署的自动化OPSEC监控。'}}}, {'id': 'https://huggingface.co/papers/2607.24117', 'title': 'Grading the Narrators: An Isnad-Rijal Framework for Claim-Level Provenance in Multi-Agent Knowledge Systems', 'url': 'https://huggingface.co/papers/2607.24117', 'abstract': "Abstract  Modern multi-agent knowledge systems increasingly accumulate knowledge through chains of autonomous transformations rather than direct retrieval. Existing provenance work records what happened - execution traces, tool calls, evidence links - and source-reliability estimation is long established (truth discovery, reputation systems). What is missing is an operational framework that attaches graded, per-domain transmitter reliability to claim-level transmission chains, with completeness semantics, transformation-typed aggregation, decoupled content criticism, and serve/review/quarantine routing.   Classical Islamic hadith science confronted a structurally similar problem: deciding whether knowledge transmitted through chains of human narrators should be accepted. Over centuries it developed a rigorous methodology - isnad (a complete transmission chain attached to every claim), rijal (systematic grading of each narrator's integrity and precision), weakest-link chain evaluation, corroboration through independent chains, and matn criticism (content evaluated independently of chain quality). This paper transfers that methodology to AI system design.   We contribute a formal mapping from hadith-science concepts to multi-agent pipelines, a relational schema implementing claim chains and a graded narrator registry, a decision matrix combining chain grade with content criticism, and an evaluation on 20,000 claims from real physics textbooks. The evaluation validates weakest-link quarantine and independent-chain corroboration; reports a partial failure of the grade-recovery loop, which missed the highest-fault narrator; and reports two analyses as inconclusive, including a matched-coverage comparison the framework could not reach with the reference content critic. The paper is explicit throughout about which claims the evidence does and does not yet support.", 'score': 2, 'issue_id': 2799, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '5e39c79b67a207a8', 'authors': ['Ali Zahid Raja'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.24117.jpg', 'data': {'categories': [], 'emoji': '⛓️', 'ru': {'title': 'Передача знаний через цепочки: от хадисов к AI-системам', 'desc': 'В статье предлагается операционная система для управления надёжностью знаний в многоагентных системах на основе исторической методологии исламской науки о хадисах. Авторы разработали формальное отображение концепций науки о передаче знаний на архитектуру мультиагентных пайплайнов, включая граммирование надежности передатчиков на уровне отдельных утверждений. Система реализует схему для отслеживания цепочек передачи знаний, реестр нарраторов с оценками качества, матрицу решений, объединяющую оценку цепочки с критикой содержания. Экспериментальная валидация на 20,000 утверждений из учебников физики подтвердила эффективность карантинной изоляции слабых звеньев и корроборации через независимые цепочки.'}, 'en': {'title': 'Enhancing Knowledge Reliability in AI with Hadith Science Principles', 'desc': "This paper presents a new framework for evaluating knowledge in multi-agent systems by applying principles from classical Islamic hadith science. It introduces a structured approach to assess the reliability of information transmission chains, incorporating graded reliability for each source and independent content evaluation. The authors propose a relational schema for managing claim chains and a decision matrix that combines the quality of the transmission with the content's credibility. The evaluation of this framework on a dataset of physics claims demonstrates its effectiveness in identifying weak links and corroborating information, while also highlighting areas for improvement in reliability assessment."}, 'zh': {'title': '将圣训科学方法应用于多智能体知识系统', 'desc': '现代多智能体知识系统通过自主转化链积累知识，而非直接检索。现有的来源记录工作关注执行过程、工具调用和证据链接，但缺乏一个操作框架来为每个领域的传输链附加分级的发信者可靠性。本文借鉴了经典伊斯兰教圣训科学的方法论，提出了一种将其应用于人工智能系统设计的形式化映射。我们实现了一个关系模式，结合了链的等级与内容批评，并在真实物理教科书的20000个声明上进行了评估。'}}}, {'id': 'https://huggingface.co/papers/2607.26791', 'title': 'SecRespond: Benchmarking AI Agents for Real-World Post-Compromise Incident Response', 'url': 'https://huggingface.co/papers/2607.26791', 'abstract': 'Abstract  Large Language Model (LLM) agents are increasingly adopted in real-world security operations with access to host artifacts and command-line interfaces (CLIs), making it critical to thoroughly assess their security capabilities. However, existing cybersecurity benchmarks focus on pre-compromise settings where agents are placed in a clean and idealized environment before an attack occurs. This leaves the post-compromise setting underexplored. To address this gap, we introduce SecRespond, the first benchmark for evaluating LLM agents on the post-compromise incident-response workflow. Given a forensic disk snapshot of a compromised host together with the alerts, vulnerability scans, and baseline checks reported by a host security product, agents are required to produce forensic reports on intrusions, baseline risks, and vulnerability risks, together with a remediation plan. We instantiate this task across 10 cyber ranges, each constructed from a distinct compromised cloud host, spanning 4 entry-point types, 21 ATT&CK techniques, and 5 operating systems. We evaluate 23 frontier LLMs on the OpenCode agent harness. Experimental results show that although current agents can reliably uncover the problems exposed by alerts, they struggle to proactively investigate the disk for silent intrusions and to produce comprehensive, verified remediation plans, with no model achieving complete detection and remediation on any single range. This reveals a fundamental bottleneck in building agents for real-world incident response. The benchmark is publicly available at https://github.com/Alibaba-NLP/qqr/tree/main/data/secrespond.', 'score': 1, 'issue_id': 2799, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'aec0dec030a5d9ca', 'authors': ['Lehan Wang', 'Boli Chen', 'Ruixue Ding', 'Pengjun Xie', 'Jinwei Huang', 'Zhendong Liu', 'Shuo Wang', 'Tao Lei', 'Xin Ouyang', 'Xiaomeng Li'], 'affiliations': ['Alibaba Cloud Computing, Alibaba Group', 'Tongyi Lab, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.26791.jpg', 'data': {'categories': ['#benchmark', '#security', '#agents', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'LLM агенты для анализа скомпрометированных систем: от обнаружения к ответным действиям', 'desc': 'В работе представлен SecRespond — первый бенчмарк для оценки способностей LLM агентов в задачах реагирования на инциденты безопасности после компрометации хоста. Агентам предоставляется снимок диска скомпрометированной системы вместе с оповещениями и результатами сканирования уязвимостей, и они должны составить форензический отчёт и план восстановления. Тестирование 23 современных языковых моделей показало, что агенты хорошо справляются с обнаружением явных проблем, но испытывают трудности с проактивным поиском скрытых вторжений и разработкой комплексных планов устранения. Это исследование выявляет ключевые ограничения LLM агентов в реальных сценариях инцидент-менеджмента.'}, 'en': {'title': 'SecRespond: Evaluating LLMs for Post-Compromise Cybersecurity', 'desc': 'This paper introduces SecRespond, a new benchmark designed to evaluate Large Language Model (LLM) agents in post-compromise cybersecurity scenarios. Unlike existing benchmarks that focus on pre-attack conditions, SecRespond assesses how well LLMs can analyze compromised systems and generate forensic reports, remediation plans, and risk assessments. The study evaluates 23 advanced LLMs across various cyber ranges, revealing that while these models can identify issues from alerts, they struggle with deeper investigations and comprehensive remediation strategies. This highlights a significant challenge in developing effective LLM agents for real-world incident response in cybersecurity.'}, 'zh': {'title': '评估LLM代理的攻击后响应能力', 'desc': '大型语言模型（LLM）代理在现实世界的安全操作中越来越多地被采用，但现有的网络安全基准主要关注攻击前的理想环境，忽视了攻击后的响应能力。为了解决这一问题，本文提出了SecRespond，这是第一个用于评估LLM代理在攻击后事件响应工作流程中的基准。该基准要求代理在给定的受损主机的取证磁盘快照及相关安全警报的基础上，生成关于入侵、基线风险和漏洞风险的取证报告，以及修复计划。实验结果表明，尽管当前的代理能够可靠地发现警报所暴露的问题，但在主动调查潜在入侵和生成全面的修复计划方面仍然存在困难。'}}}, {'id': 'https://huggingface.co/papers/2607.26811', 'title': 'DistillAlign: Coordinating Mode Covering and Mode Seeking in Autoregressive Video Distillation', 'url': 'https://huggingface.co/papers/2607.26811', 'abstract': "Abstract  Existing autoregressive video distillation methods commonly adopt a Distribution Matching Distillation (DMD)-based multi-stage pipeline. However, they typically decouple the initialization and DMD stages -- which then pursue different target distributions -- and judge the intermediate student mainly by visual scores such as VBench. In this paper, we revisit this design from a distributional perspective. Given the mode-seeking nature of the distribution matching loss, a good initialization should match the mode coverage of the target DMD teacher, rather than merely pursuing high quality. To analyze this, we introduce a distributional evaluation protocol that measures precision and coverage between student and teacher distributions in a shared latent space. It exposes differences hidden by visual scores: some initializations reach high precision but low coverage, leading to suboptimal refinement, while mode-covering ones preserve broader support. Furthermore, even when the target distributions are aligned, DMD's reverse-KL objective can still drive the student toward high-probability teacher regions in late training, reducing coverage and diversity. To address this, we propose joint distillation, which combines DMD's mode-seeking objective with a Consistency Distillation-based mode-covering constraint. Experiments show that our method improves generation quality, coverage, and diversity; notably, even with a Wan-1.3B DMD teacher, it outperforms baselines refined with Wan-14B, underscoring the importance of distributional alignment in autoregressive video distillation.", 'score': 0, 'issue_id': 2803, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'a37d9168fdc35417', 'authors': ['Jiaxing Li', 'Kai Zou', 'Cindy Zhou', 'Kaichen Huang', 'Junyao Gao', 'Zile Wang', 'Yang Liu', 'Bin Liu', 'Bo An', 'Yangguang Li'], 'affiliations': ['Nanyang Technological University', 'Riemann Dynamics', 'Wellington College, UK'], 'pdf_title_img': 'assets/pdf/title_img/2607.26811.jpg', 'data': {'categories': ['#small_models', '#training', '#video'], 'emoji': '🎬', 'ru': {'title': 'Согласованность распределений в дистилляции видеомоделей через совместное обучение', 'desc': 'В этой работе исследуется проблема дистилляции видеомоделей через переоценку этапов инициализации и Distribution Matching Distillation (DMD). Авторы предлагают новый протокол оценки, который измеряет точность и покрытие распределений студента и учителя в общем латентном пространстве, выявляя недостатки существующих методов оценки качества. Основной вклад заключается в методе совместной дистилляции, комбинирующем режимоискательское свойство DMD с ограничением на покрытие модой на основе Consistency Distillation для сохранения разнообразия. Экспериментальные результаты демонстрируют улучшение качества, покрытия и разнообразия генерируемых видео, причём модель с учителем 1.3B превосходит базовые методы с 14B учителем.'}, 'en': {'title': 'Aligning Distributions for Better Video Distillation', 'desc': "This paper critiques existing autoregressive video distillation methods that use a multi-stage pipeline with Distribution Matching Distillation (DMD). It highlights the issue of decoupling initialization and DMD stages, which can lead to suboptimal results due to differing target distributions. The authors introduce a new evaluation protocol that focuses on the precision and coverage of student and teacher distributions, revealing that some initializations may achieve high precision but lack coverage. To improve performance, they propose a joint distillation approach that combines DMD's objectives with a mode-covering constraint, resulting in better generation quality and diversity in video outputs."}, 'zh': {'title': '优化自回归视频蒸馏的分布对齐', 'desc': '现有的自回归视频蒸馏方法通常采用基于分布匹配蒸馏（DMD）的多阶段流程。然而，它们通常将初始化和DMD阶段分开，追求不同的目标分布，并主要通过视觉评分来评估中间学生。本文从分布的角度重新审视这一设计，提出了一个分布评估协议，测量学生和教师分布在共享潜在空间中的精度和覆盖率。我们提出的联合蒸馏方法结合了DMD的模式寻求目标和一致性蒸馏的模式覆盖约束，实验表明该方法在生成质量、覆盖率和多样性方面都有所提升。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (9)', '#agi (1)', '#alignment (1)', '#architecture (2)', '#audio (1)', '#benchmark (8)', '#cv (1)', '#data', '#dataset (5)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference (3)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math (1)', '#multilingual', '#multimodal (6)', '#open_source (2)', '#optimization (3)', '#plp (2)', '#rag', '#reasoning (1)', '#rl (3)', '#rlhf (1)', '#robotics (3)', '#science (1)', '#security (2)', '#small_models (3)', '#story_generation', '#survey', '#synthetic', '#training (9)', '#transfer_learning (1)', '#video (3)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-30 19:13',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-30 19:13')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-30 19:13')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
