generator-based reranking with one resident backbone; evaluation currently covers two retrieval datasets, one QA dataset and one backbone family.', 'score': 10, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '333b1092e039e45f', 'authors': ['Adilet Metinov', 'Chingiz Arziev'], 'affiliations': ['airun-ai'], 'pdf_title_img': 'assets/pdf/title_img/2610.40454.jpg', 'data': {'categories': ['#rag', '#training', '#alignment', '#benchmark', '#inference', '#long_context', '#architecture', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Один backbone для поиска и генерации ответов', 'desc': 'Статья представляет Glance — подход, который объединяет переранжирование и генерацию ответов в одной языковой модели (LLM) с помощью лёгких адаптеров и pointer head. Модель оценивает кандидатные пассажи по общему кэшу контекста, поэтому не нужно отдельно обрабатывать каждую пару запрос-пассаж, что снижает потребление памяти. Такой подход на бенчмарках SciFact, NFCorpus и HotpotQA даёт лучшее качество поиска и ответов, чем отдельные cross-encoder модели. Авторы отмечают, что эксперименты пока ограничены двумя наборами данных для поиска, одним QA-датасетом и одним семейством моделей.'}, 'en': {'title': 'Glance: Unified Reranking and Generation for Efficient Retrieval', 'desc': 'The paper introduces Glance, a novel approach that combines reranking and generation in a single model architecture, which reduces memory usage while enhancing the quality of retrieval and answers. By utilizing lightweight adapters and pointer heads, Glance efficiently scores candidate passages from a shared context without the need for separate model instances for reranking and answering. This method allows for improved performance on various datasets, achieving higher nDCG scores and better answer quality compared to existing models. The results indicate that Glance can effectively handle multiple tasks with a single backbone, demonstrating its potential for scalable retrieval-augmented generation applications.'}, 'zh': {'title': 'Glance：高效整合重排序与生成的模型', 'desc': '本文介绍了一种名为Glance的模型，它将重排序和生成整合到一个轻量级的框架中。通过使用轻量级适配器和指针头，Glance能够从共享上下文中对候选段落进行评分，从而减少内存开销并提高检索和回答的质量。与传统的分开模型不同，Glance通过共享的预填充来处理查询-段落对，显著提高了效率。实验结果表明，Glance在多个数据集上表现优异，尤其是在重排序质量和答案准确性方面。'}}}, {'id': 'https://huggingface.co/papers/2610.38678', 'title': 'AskStream: When and What to Ask Proactively under Uncertainty in Streaming Video Understanding', 'url': 'https://huggingface.co/papers/2610.38678', 'abstract': 'Abstract Proactive video understanding should include asking for missing information under uncertainty, and the AskStream benchmark reveals current models struggle with this decision.  Generated by thinkingmachines/Inkling-Small Recent advances in multimodal large language models have increased interest in interaction paradigms for video understanding. The evolution from offline to streaming and proactive interaction has gradually shifted models from passive responders toward more proactive agents that can decide when to answer. However, existing proactive paradigms typically assume that the information required to answer a query is complete, leaving models to only wait or answer. In the real world, however, information is often incomplete due to uncertainty from either the video or the user. In proactive paradigms, such uncertainty can cause the model to wait forever or generate highly hallucinatory responses. We therefore argue that proactive interaction should be redefined with a third action: ask, allowing models to actively ask for missing information. To study when and what models should ask before answering, we introduce AskStream, the first multi-turn benchmark spanning video and user uncertainty for streaming video understanding, with four task categories and eight subtasks. It contains 438 videos with 2,714 manually annotated frame-level time windows across three types: wait, ask, and answer. Across both multiple-choice and open-ended settings, even the strongest model attains only 52.18% on our proposed Ask-F1 metric, highlighting substantial limitations in proactive information seeking under uncertainty.', 'score': 10, 'issue_id': 3477, 'pub_date': '2026-10-28', 'pub_date_card': {'ru': '28 октября', 'en': 'October 28', 'zh': '10月28日'}, 'hash': '2d8cff99f0558652', 'authors': ['Lu Wang', 'Zhuoran Jin', 'Longxiang Wang', 'Junhong Chen', 'Yupu Hao', 'Yao Xu', 'Daojian Zeng', 'Yubo Chen', 'Kang Liu', 'Guang Liu', 'Jun Zhao'], 'affiliations': ['Beijing Academy of Artificial Intelligence (BAAI), Beijing, China', 'Hunan Normal University, China', 'Minzu University of China, Beijing, China', 'The Key Laboratory of Cognition and Decision Intelligence for Complex Systems, Institute of Automation, Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2610.38678.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#dataset', '#agents', '#benchmark', '#video', '#hallucinations'], 'emoji': '🎬', 'ru': {'title': 'Модели должны уметь спрашивать, а не только отвечать', 'desc': 'Статья вводит AskStream — первый многоходовой бенчмарк для потоковой обработки видео, где модели должны решать, ждать, спрашивать или отвечать. Авторы показывают, что существующие мультимодальные LLM рассчитывают на полную информацию и поэтому либо зависают в ожидании, либо галлюцинируют. Предлагается третье действие — ask, позволяющее модели активно запрашивать недостающие данные у пользователя. Лучшая из протестированных моделей достигает лишь 52.18% по метрике Ask-F1, что указывает на серьезные ограничения в проактивном поиске информации при неопределенности.'}, 'en': {'title': 'Empowering Video Understanding: Ask Before Answering!', 'desc': 'This paper discusses the need for proactive video understanding systems to ask for missing information when faced with uncertainty. Current models often assume they have all the necessary information to respond, which can lead to delays or incorrect answers. The authors introduce the AskStream benchmark, which evaluates how well models can decide when to ask for more information before providing an answer. Their findings reveal that even advanced models struggle with this task, achieving only 52.18% on the Ask-F1 metric, indicating significant room for improvement in proactive interaction under uncertainty.'}, 'zh': {'title': '主动视频理解：在不确定性中主动询问', 'desc': '这篇论文探讨了主动视频理解中的不确定性问题，提出了在缺失信息时模型应该主动询问的概念。现有的主动交互模型通常假设回答问题所需的信息是完整的，但在现实中，信息往往是不完整的。为了解决这个问题，论文引入了AskStream基准，旨在研究模型在回答之前应该何时以及询问什么信息。通过这个基准，研究者希望提高模型在不确定性下的主动信息获取能力。'}}}, {'id': 'https://huggingface.co/papers/2610.39664', 'title': 'EditAgent: Rethinking Agentic Image Editing', 'url': 'https://huggingface.co/papers/2610.39664', 'abstract': 'Abstract EditAgent broadens agentic image editing by routing steps to diverse editors and using verification records for listwise judging, improving reliability and efficiency.  Generated by thinkingmachines/Inkling-Small Agentic image editors decompose complex requests into steps, but when a step fails, they mostly retry with the same narrow set of tools and a judge that scores each output by eye directly. We argue that such agents are bounded by two spaces: the action space of what the agent can do, and the observation space of what its judge can see. On our expert-annotated benchmark, a general-purpose editor yields no usable result in over 40% of the cases, and no judge is reliable across edit types. We present EditAgent, which expands both spaces. It routes each step to general editors and specialized methods, and attaches to each candidate a verification record. With these records, off-the-shelf VLM judges outperform finetuned reward models. Candidates are generated in parallel and judged in one listwise call: experts prefer this to sequential refinement in 78.5% of decided comparisons, at no more than half the judge calls. EditAgent improves two open-weight editors on three benchmarks and serves as a data engine for training stronger editors.', 'score': 9, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'd055e35824818339', 'authors': ['Haiyang Xu', 'Tianyu Wang', 'Jialu Li', 'Jiteng Mu', 'Yuanjun Xiong', 'Jianming Zhang', 'Zhuowen Tu', 'Mingze Xu'], 'affiliations': ['Adobe Research', 'UC San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2610.39664.jpg', 'data': {'categories': ['#training', '#cv', '#agents', '#benchmark', '#data'], 'emoji': '🖼️', 'ru': {'title': 'Расширяем действия и зрение агента — надёжнее редактирование изображений', 'desc': 'Статья представляет EditAgent — агентную систему для редактирования изображений, которая расширяет пространство действий, направляя каждый шаг к разным редакторам, включая специализированные методы. Каждому кандидату прикрепляется запись верификации, что позволяет готовым VLM-судьям превосходить дообученные reward-модели. Кандидаты генерируются параллельно и оцениваются одним listwise-вызовом, что эксперты предпочитают последовательному уточнению в 78.5% случаев при вдвое меньшем числе вызовов судьи. Система улучшает два open-weight редактора на трёх бенчмарках и служит источником данных для обучения более сильных редакторов.'}, 'en': {'title': 'Expanding the Horizons of Image Editing with EditAgent', 'desc': 'EditAgent enhances the process of agentic image editing by directing tasks to various specialized editors and utilizing verification records for better evaluation. Traditional agents often retry failed steps with limited tools, leading to inefficiencies and unreliable outcomes. This paper identifies the constraints of action and observation spaces that hinder performance and proposes a solution that expands these spaces. By generating candidates in parallel and using verification records, EditAgent significantly improves the reliability of image editing results and reduces the number of evaluations needed.'}, 'zh': {'title': 'EditAgent：提升图像编辑的可靠性与效率', 'desc': 'EditAgent 是一种新的图像编辑方法，它通过将编辑步骤分配给不同的编辑器，并使用验证记录来提高编辑的可靠性和效率。传统的编辑器在处理复杂请求时，往往会在失败后重复使用相同的工具，导致结果不理想。EditAgent 扩展了编辑器的操作空间和观察空间，使每个步骤可以使用更广泛的编辑方法，并为每个候选结果附加验证记录。通过这种方式，EditAgent 在多个基准测试中显著提高了编辑效果，并为训练更强大的编辑器提供了数据支持。'}}}, {'id': 'https://huggingface.co/papers/2610.40453', 'title': 'PhysInsert: Physically Plausible Object Insertion with Geometric Priors and Bidirectional Object-Scene Interactions', 'url': 'https://huggingface.co/papers/2610.40453', 'abstract': 'Abstract PhysInsert enables physically plausible object insertion by jointly adapting objects and scenes using geometry-guided adaptation and spatial supervision on aligned counterfactual data.  Generated by thinkingmachines/Inkling-Small We present PhysInsert, a framework for physically plausible reference-based object insertion that jointly adapts objects and their surrounding scenes. Existing methods often rely on masked inputs, generation-based pairs, or training pairs with limited viewpoint variation, leaving pose and illumination adaptation and bidirectional object-scene interactions insufficiently constrained. We construct the Insert World dataset with strictly aligned Blender-rendered counterfactual pairs and object references across viewpoints and lighting conditions. Building on these data, Geometry-Guided Adaptation couples a VGGT geometry stream with image and text streams under target-scene feature supervision to guide spatially consistent insertion. Complementary 2D Object-Scene Spatial Supervision jointly supervises object occupancy and environmental changes while grounding spatial instructions in object regions through image-text attention. We introduce PhysInsert-Bench with dedicated cross-environment and cross-view cases requiring illumination and pose adaptation beyond appearance copying. Experiments on PhysInsert-Bench and DreamBooth demonstrate improved image fidelity; a user study further shows more accurate placement and improved lighting integration, perspective, and pose plausibility.', 'score': 8, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '84d930b20457cf70', 'authors': ['Yue Gong', 'Le Zhang', 'Rui Chen', 'Song Chang', 'Xiaochao Qu', 'Luoqi Liu', 'Ting Liu', 'Yebin Liu'], 'affiliations': ['Department of Automation, Tsinghua University', 'MT Lab, Meitu Inc.', 'School of Computer Science and Engineering, Beihang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.40453.jpg', 'data': {'categories': ['#multimodal', '#dataset', '#training', '#cv', '#diffusion', '#benchmark', '#architecture', '#data'], 'emoji': '🧩', 'ru': {'title': 'Вставляем объект так, чтобы он физически вписывался в сцену', 'desc': 'PhysInsert — это фреймворк для вставки объектов по референсу, который физически правдоподобно адаптирует и сам объект, и окружающую сцену. Авторы строят датасет Insert World с точно выровненными контрфактуальными парами, отрендеренными в Blender, при разных ракурсах и освещении. Модуль Geometry-Guided Adaptation объединяет геометрический поток VGGT с потоками изображения и текста, а 2D Object-Scene Spatial Supervision контролирует занятость объекта и изменения окружения. Эксперименты на PhysInsert-Bench и DreamBooth подтверждают улучшение точности изображения, а пользовательское исследование показывает более корректное освещение, перспективу и позу объекта.'}, 'en': {'title': 'Realistic Object Insertion Made Possible!', 'desc': 'PhysInsert is a framework designed for inserting objects into scenes in a way that looks realistic and physically plausible. It uses a combination of geometry-guided adaptation and spatial supervision to ensure that both the objects and the scenes are adjusted appropriately. The method addresses limitations of previous techniques by utilizing a specially constructed dataset that includes aligned images under various lighting and viewpoint conditions. Experiments show that PhysInsert improves the quality of image generation, making object placement more accurate and enhancing the integration of lighting and perspective.'}, 'zh': {'title': '物理合理的物体插入框架', 'desc': 'PhysInsert 是一个框架，旨在通过几何引导适应和空间监督，实现物体与场景的物理上合理插入。该方法利用严格对齐的 Blender 渲染的反事实数据集，解决了现有方法在姿态和光照适应方面的不足。通过几何引导适应，结合图像和文本流，确保插入过程的空间一致性。同时，2D 物体-场景空间监督共同监督物体占用和环境变化，提高了插入的准确性和光照整合效果。'}}}, {'id': 'https://huggingface.co/papers/2610.39264', 'title': 'Online Dense Reinforcement Learning with Planning-Grounding Agent for UI Navigation on Live IOS Apps', 'url': 'https://huggingface.co/papers/2610.39264', 'abstract': 'Abstract An online reinforcement learning framework trains UI navigation agents on live mobile apps using a planning agent, UI grounding model, and a novel neighbor-conditioned value estimation method to improve robustness and reduce inference costs.  Generated by thinkingmachines/Inkling-Small While frontier vision-language models demonstrate strong capabilities in user interface (UI) navigation, their high inference costs prohibit everyday use. Conversely, smaller models trained via supervised fine-tuning (SFT) or offline reinforcement learning often memorize static trajectories, leading to brittle execution and an inability to recover from errors. To address these limitations, we propose a novel online reinforcement learning framework that trains UI navigation agents directly on live iOS applications. Our framework decouples the agent into two specialized components: a Planning agent and a UI Grounding model. We rely on an LLM-as-a-Judge to provide comprehensive reward signals, combining dense, step-level feedback to evaluate intermediate progress with a terminal reward for overall task completion. To effectively leverage this dual reward structure, we optimize the agent using Proximal Policy Optimization (PPO) with step-level advantage estimation. Furthermore, we introduce GiGPPO, a novel neighbor-conditioned value estimation method that improves critic stability by leveraging reward signals from visually similar states across concurrent trajectories. To support this online training paradigm at scale, we introduce an efficient infrastructure that orchestrates hundreds of concurrent virtual iOS devices. Evaluations on rigorous benchmarks, including UINavBench, iOSWorld, and AndroidWorld, demonstrate that our online RL trained agents substantially outperform both SFT and terminal-only RL baselines while accelerating training convergence. Notably, our 8B RL agents achieve nearly a sevenfold improvement over the SFT baseline in out-of-distribution generalization to Android environments, while outperforming Gemini-3.5-Flash and tying with Gemini-3.1-Pro on real iOS applications.', 'score': 7, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '7d4a34d529a1edcc', 'authors': ['Peitong Duan', 'Khashayar Gatmiry', 'Jeffrey Nichols', 'Samy Bengio', 'Emmanuel Abbe'], 'affiliations': ['Apple'], 'pdf_title_img': 'assets/pdf/title_img/2610.39264.jpg', 'data': {'categories': ['#training', '#agents', '#benchmark', '#inference', '#rl', '#rlhf'], 'emoji': '📱', 'ru': {'title': 'Учимся навигировать по приложениям на живых устройствах, а не по запомненным траекториям', 'desc': 'Статья предлагает онлайн-фреймворк обучения с подкреплением для агентов, которые навигируют по интерфейсам мобильных приложений, разделяя агента на Planning agent и UI Grounding model. Вместо offline RL или SFT, которые приводят к запоминанию траекторий, агенты обучаются на живых iOS-приложениях с помощью PPO, а награда формируется LLM-as-a-Judge: плотные пошаговые сигналы плюс терминальная награда. Ключевой вклад — GiGPPO, метод оценки value с учётом соседних визуально похожих состояний из параллельных траекторий, что стабилизирует critic. Восьмимиллиардные RL-агенты заметно превосходят SFT-базовые модели и хорошо обобщаются на Android, сопоставимы с крупными моделями Gemini на iOS.'}, 'en': {'title': 'Revolutionizing UI Navigation with Online Reinforcement Learning', 'desc': 'This paper presents an innovative online reinforcement learning framework designed to train UI navigation agents on live mobile applications. It introduces a Planning agent and a UI Grounding model to enhance the robustness of navigation while minimizing inference costs. The framework utilizes a dual reward structure, combining detailed feedback with a final reward, and employs Proximal Policy Optimization (PPO) for optimization. Additionally, the novel neighbor-conditioned value estimation method, GiGPPO, improves stability by using reward signals from similar states, leading to significant performance gains over traditional training methods.'}, 'zh': {'title': '在线强化学习提升UI导航代理的效率与稳定性', 'desc': '本文提出了一种在线强化学习框架，用于在实时移动应用中训练用户界面（UI）导航代理。该框架将代理分为两个专门组件：规划代理和UI基础模型，并利用大型语言模型（LLM）提供全面的奖励信号。通过使用近端策略优化（PPO）和新颖的邻居条件价值估计方法（GiGPPO），该方法提高了代理的稳定性和训练效率。实验结果表明，在线强化学习训练的代理在多个基准测试中显著优于传统的监督微调和终端奖励强化学习基线。'}}}, {'id': 'https://huggingface.co/papers/2610.39663', 'title': 'AB-Attention: Accurate Block Attention for Accelerating Video Diffusion Transformers', 'url': 'https://huggingface.co/papers/2610.39663', 'abstract': 'Abstract AB-Attention approximates dense video diffusion attention with high sparsity via intra-block clustering, weighted sampling, and fine-grained kernel gathering, improving fidelity and speed.  Generated by thinkingmachines/Inkling-Small Video diffusion transformers generate high-quality videos, but the quadratic cost of 3D full attention dominates their inference. Dynamic block-sparse attention reduces this cost by computing exact attention only on key/value blocks selected from current activations. However, its fidelity degrades under aggressive sparsity: blocks are scored from coarse summaries or formed by costly global clustering, pruned blocks vanish from the softmax, and whole tiles are kept or dropped even when only a few of their keys matter. To address these limitations, we propose Accurate Block Attention (AB-Attention), a training-free method that accurately approximates dense attention at high sparsity. Its Intra-Block Clustering Selector (IBCS) estimates block importance faithfully yet cheaply by clustering queries only within each query block, without permuting tokens. Sampling with Inclusion-Probability Weighting (SIP) then samples blocks in proportion to these estimates and reweights them by inverse inclusion probability, so that one pass estimates dense attention rather than truncating it. Finally, its kernel gathers key/value blocks much smaller than a tile into full tensor-core tiles, refining selection at no extra tensor-core cost. On Wan2.1 and HunyuanVideo, AB-Attention skips 89--92\\% of attention, whereas the baselines compute 1.8--3.6times as much, yet it still improves PSNR by up to 4.4~dB over the strongest baseline and achieves up to 2.23times end-to-end speedup. Our code is available at https://github.com/InfRec-Cardinal/AB-Attention.', 'score': 5, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': 'e085f5a134048c03', 'authors': ['Bin Xu', 'Mo Zhang', 'Zhengfeiyang Zhang', 'Xinfeng Yang', 'Yixing Ma', 'Wei Wang', 'HeXin Wang', 'Pengfei Zhou', 'Wangbo Zhao'], 'affiliations': ['Fudan University', 'Inf Rec', 'National University of Singapore', 'Shandong University', 'The Chinese University of Hong Kong, Shenzhen', 'The Hong Kong University of Science and Technology', 'The University of Tokyo', 'University of California, Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2610.39663.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#inference', '#video', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'Быстрое внимание для видео без потери качества', 'desc': 'Статья предлагает AB-Attention — метод без дообучения, который приближает плотное внимание (dense attention) в диффузионных трансформерах для генерации видео с высокой разреженностью. Ключевые компоненты: IBCS оценивает важность блоков через кластеризацию запросов внутри каждого блока, а SIP выбирает блоки с вероятностями включения и применяет обратное взвешивание, чтобы оценка оставалась несмещённой. Ядро (kernel) собирает небольшие key/value блоки в полные тензорные тайлы, уточняя выбор без дополнительных затрат на tensor cores. На моделях Wan2.1 и HunyuanVideo метод пропускает 89–92% вычислений внимания, повышает PSNR до 4.4 dB и ускоряет inference до 2.23 раза.'}, 'en': {'title': 'Efficient Video Attention with High Fidelity', 'desc': 'The paper introduces Accurate Block Attention (AB-Attention), a method designed to enhance the efficiency of video diffusion transformers by approximating dense attention with high sparsity. It utilizes intra-block clustering to accurately assess the importance of key/value blocks, allowing for effective sampling without the need for complex global clustering. By employing Inclusion-Probability Weighting, AB-Attention ensures that the sampled blocks maintain fidelity while significantly reducing computational costs. The results demonstrate that AB-Attention can skip up to 92% of attention calculations while improving video quality and achieving faster processing speeds compared to existing methods.'}, 'zh': {'title': '高效视频生成的精准注意力机制', 'desc': 'AB-Attention是一种新方法，通过内部块聚类、加权采样和细粒度核聚合，在高稀疏性下准确近似密集视频扩散注意力，从而提高了视频生成的保真度和速度。传统的3D全注意力计算成本较高，而动态块稀疏注意力通过仅计算选定的关键/值块来降低这一成本。AB-Attention通过在每个查询块内聚类来准确评估块的重要性，并通过包含概率加权进行采样，从而避免了传统方法中的信息丢失。实验结果表明，AB-Attention在保持高质量视频生成的同时，显著提高了计算效率和速度。'}}}, {'id': 'https://huggingface.co/papers/2610.39287', 'title': 'OpenFlyV2: An onboard vision-language-action model for aerial perception and navigation', 'url': 'https://huggingface.co/papers/2610.39287', 'abstract': 'Abstract OpenFlyV2 is a unified onboard vision-language-action model that enables real-time aerial navigation and reasoning on resource-constrained hardware using shared multimodal representations.  Generated by thinkingmachines/Inkling-Small Human cognition flexibly draws on a shared perceptual foundation to understand environments, attend to referenced entities, reason about spatial relationships, and act. Endowing aerial robots with an analogous functional organization remains challenging, as existing systems are often specialized for individual capabilities, dependent on offboard computation, or unable to sustain closed-loop operation on resource-constrained platforms. We present OpenFlyV2, a unified onboard vision-language-action architecture that uses a shared vision-language representation to support semantic understanding, language-grounded perception, spatial reasoning, and continuous aerial control within a single model. A compact action expert converts the shared multimodal context into short-horizon flight waypoints, while motion-aware temporal memory and action priors reduce the computational cost of closed-loop execution. We construct , a simulation-based dataset comprising approximately 70,000 navigation trajectories and 60,000 vision-language instruction--response pairs. OpenFlyV2 generates action chunks, each comprising 12 waypoints, entirely onboard at 10 Hz using an NVIDIA Jetson Orin NX. It transfers zero-shot from simulation to physical quadrotor flight, achieving a 48\\% navigation success rate across four real-world environments without real-world aerial training data. Extensive results demonstrate that broad vision-language competence and continuous closed-loop flight can coexist within a single model on a resource-constrained aerial platform. Code will be made publicly available at https://github.com/Ideal-ljl/AeroBrain.', 'score': 4, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '5cc6953130989970', 'authors': ['Junli Liu', 'Zhongrui You', 'Chenhui Li', 'Zhen Li', 'Yuyang Tian', 'Qizhen Chen', 'Delin Qu', 'Haoming Song', 'Dong Wang', 'Xuelong Li', 'Zhigang Wang', 'Bin Zhao'], 'affiliations': ['Beihang University', 'Institute of Artificial Intelligence of China Telecom (TeleAI)', 'Northwestern Polytechnical University', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2610.39287.jpg', 'data': {'categories': ['#multimodal', '#robotics', '#dataset', '#reasoning', '#cv', '#agents', '#open_source', '#synthetic', '#inference'], 'emoji': '🚁', 'ru': {'title': 'Единый мозг дрона: язык, зрение и полёт в одной модели на борту', 'desc': 'Статья представляет OpenFlyV2 — унифицированную vision-language-action модель, которая работает прямо на борту дрона и управляет полётом в реальном времени. Единое мультимодальное представление позволяет решать задачи семантического понимания, языковой привязки восприятия, пространственного рассуждения и непрерывного управления без внешних вычислений. Компактный action expert генерирует короткие траектории из 12 путевых точек с частотой 10 Гц на NVIDIA Jetson Orin NX, а temporal memory и action priors снижают вычислительные затраты. Модель обучена на симуляционном датасете из около 70 тысяч траекторий и 60 тысяч пар инструкция-ответ и переносится на реальный квадрокоптер zero-shot, достигая 48% успешной навигации без реальных данных для воздушного обучения.'}, 'en': {'title': 'Unified Vision-Language-Action for Aerial Navigation', 'desc': 'OpenFlyV2 is an advanced model designed for aerial robots that combines vision, language, and action into one system, allowing it to navigate and make decisions in real-time. It uses a shared multimodal representation to understand its surroundings, interpret language instructions, and perform spatial reasoning, all while operating on limited hardware resources. The model can generate flight paths and execute them efficiently without relying on external computing power, making it suitable for closed-loop operations. By training on a large dataset of navigation scenarios, OpenFlyV2 demonstrates impressive performance in real-world environments, achieving a notable success rate without prior physical training.'}, 'zh': {'title': '统一的空中导航与推理模型', 'desc': 'OpenFlyV2是一种统一的机载视觉-语言-动作模型，能够在资源受限的硬件上实现实时的空中导航和推理。该模型通过共享的多模态表示，支持语义理解、语言基础的感知、空间推理和连续的空中控制。与现有系统不同，OpenFlyV2能够在单一模型中实现广泛的视觉-语言能力和闭环飞行控制，且无需依赖离线计算。通过构建一个包含约70,000条导航轨迹和60,000对视觉-语言指令响应的数据集，OpenFlyV2在真实环境中实现了48%的导航成功率。'}}}, {'id': 'https://huggingface.co/papers/2610.40362', 'title': 'Your LR Schedule May Not Be Principled: Effective Learning Rate Scheduling in Weight-Normalized Training', 'url': 'https://huggingface.co/papers/2610.40362', 'abstract': 'Abstract Effective learning rate trajectories primarily drive weight-normalized training gains, motivating an affine inverse-square-root schedule that improves large-scale pretraining loss and robustness.  Generated by thinkingmachines/Inkling-Small Weight-normalized (WN) training is emerging as a compelling alternative to conventional weight decay (WD), with recent studies reporting substantial pretraining loss gains. We show that these gains are driven primarily by the induced effective learning rate (ELR) trajectory rather than by normalization alone. Matching ELR trajectories largely collapses the training loss dynamics of WN and WD. Schedule design should therefore target ELR rather than the nominal learning rate (LR) alone. Building on this principle, we propose AIR (Affine Inverse-square-Root decay), which combines a theoretically derived 1/t decay with an affine adjustment to satisfy prescribed peak and terminal LRs over a finite training horizon. We further identify late-stage ELR scheduling as a key source of its gains, because a shared late schedule attenuates the effect of earlier LR choices. Experiments on 128 B-token Mixture-of-Experts pretraining demonstrate that AIR outperforms cosine and other candidate schedules in training loss, downstream performance, and hyperparameter robustness, reducing terminal training loss by approximately 0.01 relative to cosine at matched cumulative LR. Applying the same ELR trajectory to WD reproduces the corresponding training dynamics, showing that the benefits extend beyond fixed-norm training and establishing ELR as the principled scheduling object.', 'score': 4, 'issue_id': 3477, 'pub_date': '2026-10-29', 'pub_date_card': {'ru': '29 октября', 'en': 'October 29', 'zh': '10月29日'}, 'hash': '119db6a765330214', 'authors': ['Qifan Yu', 'Xinyu Ma', 'Xingyan Bin', 'Di He'], 'affiliations': ['ByteDance Seed', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2610.40362.jpg', 'data': {'categories': ['#training', '#optimization', '#math'], 'emoji': '📉', 'ru': {'title': 'Управляйте эффективным learning rate, а не номинальным', 'desc': 'Статья показывает, что основной вклад в улучшение обучения при weight-normalized тренировке даёт не сама нормализация, а траектория эффективного learning rate (ELR). Совпадение ELR делает динамику функции потерь у WN и weight decay (WD) почти одинаковой, поэтому расписание нужно проектировать под ELR, а не под номинальный LR. На основе этого авторы предлагают расписание AIR, сочетающее теоретически выведенное затухание 1/t с аффинной коррекцией под заданные пиковый и финальный LR. Эксперименты на предобучении Mixture-of-Experts модели на 128B токенах показывают превосходство AIR над cosine по loss, downstream-метрикам и устойчивости к гиперпараметрам.'}, 'en': {'title': 'Optimize Training with Effective Learning Rate Scheduling', 'desc': 'This paper introduces a new learning rate schedule called AIR (Affine Inverse-square-Root decay) that enhances weight-normalized training in machine learning. The authors argue that the effective learning rate (ELR) trajectory is crucial for improving training loss and robustness, rather than just focusing on the nominal learning rate. By designing schedules that prioritize ELR, they demonstrate that AIR significantly outperforms traditional schedules like cosine in various training scenarios. Their experiments show that applying the same ELR trajectory to weight decay methods also yields similar training dynamics, highlighting the importance of ELR in optimizing training processes.'}, 'zh': {'title': '优化学习率，提升训练效果！', 'desc': '这篇论文探讨了有效学习率轨迹对权重归一化训练效果的影响，提出了一种新的调度方法——仿射反平方根衰减（AIR）。研究表明，AIR能够显著改善大规模预训练的损失和鲁棒性，主要是通过优化有效学习率（ELR）轨迹来实现的。与传统的权重衰减（WD）相比，权重归一化（WN）训练在预训练损失上取得了显著的提升。实验结果显示，AIR在训练损失、下游性能和超参数鲁棒性方面优于余弦调度等其他候选调度。'}}}, {'id': 'https://huggingface.co/papers/2610.36420', 'title': 'SO-101 Bench: Accessible Spatial Manipulation', 'url': 'https://huggingface.co/papers/2610.36420', 'abstract': 'Abstract A simulated benchmark for language-conditioned spatial manipulation on low-cost robot arms reveals that hybrid LLM agents outperform learned vision-language-action policies, with ranking consistency between simulation and real hardware.  Generated by thinkingmachines/Inkling-Small Low-cost arms such as the SO-101 have become the most common entry point to robot learning, yet no released policy performs spatially constrained, language-conditioned tasks on them out of the box, and existing SO-101 benchmarks run only on physical hardware with simple tasks and few held-out objects. We introduce SO-101 Bench, a simulated benchmark for language-conditioned spatial manipulation built on an Isaac Lab digital twin of a real SO-101 setup. It has four tasks scored as five families, 138 objects in seen, unseen-instance and unseen-class splits, 916 evaluation episodes with subsets for held-out appearances, rotate-to-fit planning and occlusion memory, and 3,629 simulated demonstrations on which every learned policy is fine-tuned under an equal compute budget. The twin ranks policies as the real robot does: five policies trained without real data, four VLAs and an LLM agent, keep their exact ranking when the same weights run on the physical arm in an unseen environment with unseen objects (Spearman rho = 1.00, MMRV = 0.000), although simulation overestimates success. Across nine VLAs and world-action models, the best learned policies score near 61%, with spatial placement, unseen object classes and rotate-to-fit planning remaining open. An LLM agent that writes code and hands grasping to a learned policy scores 83.2%, and an ablation shows that this lead comes from the choice of harness and the choice of language model.', 'score': 4, 'issue_id': 3477, 'pub_date': '2026-10-27', 'pub_date_card': {'ru': '27 октября', 'en': 'October 27', 'zh': '10月27日'}, 'hash': '22299ecf1807f1f5', 'authors': ['Truman Hickok'], 'affiliations': ['Aalto University', 'National Institute for Health and Welfare (THL)', 'University of Eastern Finland', 'University of Eastern Finland (UEF)', 'University of Helsinki', 'University of Helsinki (HU)', 'University of Helsinki (Helsinki)', 'University of Helsinki (THL)', 'University of Jyväskylä', 'University of Jyväskylä (JY)', 'University of Jyväskylä (JYU)', 'University of Oulu', 'University of Oulu (OULU)', 'University of Oulu (Oulu)', 'University of Tampere', 'University of Tampere (TAMK)', 'University of Tampere (TAMU)', 'University of Turku', 'University of Turku (Turku)', 'University of Turku (UTU)', 'University of Vaasa', 'University of Vaasa (UVA)'], 'pdf_title_img': 'assets/pdf/title_img/2610.36420.jpg', 'data': {'categories': ['#multimodal', '#robotics', '#agi', '#games', '#dataset', '#agents', '#benchmark', '#synthetic'], 'emoji': '🦾', 'ru': {'title': 'Симуляция, которой можно доверять: честно ранжируем роботов до их покупки', 'desc': 'Статья представляет SO-101 Bench — симулированный бенчмарк для языково-обусловленной пространственной манипуляции на недорогих роботических руках SO-101, построенный на цифровом двойнике в Isaac Lab. Бенчмарк включает 916 эпизодов оценки, 138 объектов и 3 629 демонстраций для дообучения политик (VLA и world-action models) при равном вычислительном бюджете. Показано, что ранжирование политик в симуляции полностью совпадает с реальным роботом (Spearman rho = 1.00), хотя симуляция несколько завышает успешность. Лучшие обученные VLA достигают около 61%, тогда как гибридный LLM-агент, пишущий код и делегирующий захват обученной политике, набирает 83.2%, и это преимущество объясняется выбором harness и языковой модели.'}, 'en': {'title': 'Hybrid LLM Agents Excel in Language-Conditioned Robot Manipulation', 'desc': 'This paper presents a new benchmark called SO-101 Bench for testing language-conditioned spatial manipulation tasks on low-cost robot arms. It shows that hybrid agents using large language models (LLMs) outperform traditional vision-language-action (VLA) policies in simulated environments, with consistent performance when tested on real hardware. The benchmark includes a variety of tasks and objects, allowing for comprehensive evaluation of different policies under controlled conditions. The findings indicate that integrating LLMs with learned policies significantly enhances performance in complex manipulation tasks.'}, 'zh': {'title': '混合LLM代理在机器人操作中的优势', 'desc': '这篇论文介绍了一个名为SO-101 Bench的模拟基准，用于评估语言条件下的空间操作，特别是在低成本机器人手臂上。研究表明，混合大型语言模型（LLM）代理在这些任务中表现优于传统的视觉-语言-动作（VLA）策略，并且在模拟和真实硬件上的排名一致性得到了验证。SO-101 Bench包含多个任务和对象，旨在测试机器人在复杂环境中的表现。结果显示，使用LLM代理的策略在执行语言条件任务时显著提高了成功率。'}}}, {'id': 'https://huggingface.co/papers/2610.37695', 'title': 'After One-Click Video: The Inflow of Service-Type Content, the Failure of the Recommendation Pool Mechanism, and the BoLe System', 'url': 'https://huggingface.co/papers/2610.37695', 'abstract': 'Abstract AI-generated video tools shift content production toward service-type material, unbalancing the industry and overwhelming recommendation systems, prompting a dual-judgment BoLe framework to protect work-type content.  Generated by thinkingmachines/Inkling-Small In September 2026, a new large language model was released. Soon after, a new way of making explainer videos became very popular: people asked the model to write a program, and the program produced the video. "One-click video" content then appeared in large amounts on many platforms. On the surface, this is a rise in creative power at the level of the individual. We argue that, at a deeper level, it changes the structure of the content industry. This judgment rests on two observations. First, this wave of content is service-type content. People watch it to meet a need, not to enjoy the content itself. The other kind is work-type content. AI makes both kinds faster to produce. But anyone can come in and make service-type content, while work-type content is limited by the number of people who have something to say. So the ratio between the two slowly becomes unbalanced. Second, free platforms choose content through layers of trial viewing, and this uses up user attention. The total amount of attention is fixed. The unbalanced ratio also dilutes good content. A simplified mathematical model shows that, as long as these conditions hold, the recommendation pool mechanism will fail once new content grows past a certain multiple. Based on this, we discuss one possible way out. Machines and entry rules judge whether service-type content passes the bar. Trusted people judge work-type content. We call this the BoLe system. At the end, we briefly imagine how the two kinds of content may develop from here.', 'score': 2, 'issue_id': 3476, 'pub_date': '2026-10-24', 'pub_date_card': {'ru': '24 октября', 'en': 'October 24', 'zh': '10月24日'}, 'hash': '1b12118b8877a831', 'pdf_title_img': 'assets/pdf/title_img/2610.37695.jpg', 'data': {'categories': ['#survey'], 'emoji': '🎬', 'ru': {'title': 'Видео по одному клику захлёстывает платформы, а ценный контент тонет', 'desc': 'В статье рассматривается, как AI-инструменты для генерации видео (например, LLM, которая пишет программу для создания ролика) наводнили платформы контентом типа «услуга», то есть роликами, которые смотрят ради удовлетворения потребности, а не ради самого контента. Авторы показывают, что такой контент дешевле и быстрее производится, поэтому соотношение с контентом типа «работа» постепенно становится несбалансированным. Упрощённая математическая модель демонстрирует, что при фиксированном объёме внимания пользователей система рекомендаций перестаёт работать, когда объём нового контента превышает определённый порог. В качестве решения предлагается двойная схема оценки BoLe: машины и формальные правила отбирают контент типа «услуга», а проверенные люди оценивают контент типа «работа».'}, 'en': {'title': 'Balancing AI-Generated Content: The BoLe Framework', 'desc': 'This paper discusses the impact of AI-generated video tools on the content production industry, highlighting a shift towards service-type content that meets immediate needs rather than providing enjoyment. It introduces the BoLe framework, which aims to balance the production of service-type and work-type content by implementing dual judgment systems. The authors argue that the overwhelming amount of easily produced service-type content dilutes the quality of work-type content, leading to an imbalance in the industry. They propose a mathematical model to illustrate how recommendation systems may fail as the volume of new content increases, suggesting a need for structured evaluation of content types.'}, 'zh': {'title': '保护创作，平衡内容生态', 'desc': '这篇论文讨论了AI生成视频工具对内容生产的影响，导致服务型内容的增加，进而影响了内容行业的结构。服务型内容是为了满足需求而观看的，而工作型内容则是由有独特见解的人创作的。随着AI技术的发展，生产这两种内容的速度都在加快，但服务型内容的生产门槛较低，导致两者之间的比例失衡。论文提出了一种双重判断的BoLe框架，以保护工作型内容，并探讨了未来内容发展的可能方向。'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agents (11)', '#agi (2)', '#alignment (1)', '#architecture (9)', '#audio (3)', '#benchmark (18)', '#cv (6)', '#data (9)', '#dataset (10)', '#diffusion (6)', '#ethics', '#games (5)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (7)', '#interpretability (2)', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math (2)', '#multilingual (1)', '#multimodal (11)', '#open_source (4)', '#optimization (11)', '#plp (2)', '#rag (1)', '#reasoning (2)', '#rl (1)', '#rlhf (1)', '#robotics (2)', '#science (1)', '#security', '#small_models', '#story_generation', '#survey (3)', '#synthetic (6)', '#training (14)', '#transfer_learning', '#video (6)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "https://hfday.ru/img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = 'https://hfday.ru/' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-10-31 12:00',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-10-31 12:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-10-31 12:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
