    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                // Chinese doesn't need plural forms
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            if (lang === 'zh') {
                return `${number}${unitWord}${timeUnits[lang].ago}`;
            } else {
                return `${number} ${unitWord} ${timeUnits[lang].ago}`;
            }
        }

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

                titleSign.classList.add('rotate');

        const articlesData = [{'id': 'https://huggingface.co/papers/2609.28654', 'title': 'Training Object Permanence in World Models', 'url': 'https://huggingface.co/papers/2609.28654', 'abstract': "Abstract  Object permanence and solidity are hallmarks of human cognitive priors. Recent studies show that video generation models, a paradigmatic class of current world models, have begun to show emerged reasoning abilities, making them ideal candidates for building human-like physical intelligence. Do video models have emerged object permanence in them? If not, could we train them with a core-cognition inspired dataset? We introduce WROP (World Reasoning with Object Permanence), a data infrastructure of 150 hand-designed cognitive science inspired tasks, divided into six cognitive categories. We build Blender generators that randomize speed, lighting, camera angle, and other nuisance parameters while preserving each task's cognitive structure, yielding 10,000+ samples per task. We release a 1.5M-sample training corpus and a 300-question exam. On this exam we evaluate 14 video models: 3 reference-to-video, 7 edit, and 4 continuation, among which PWM-WROP, our 16B world model. In a blind pairwise Elo study, PWM-WROP ranks first among continuation models and third overall, behind only a statistical tie between two reference-to-video models. We release the data, exam, model answers, scores, weights, and PWM, our native-PyTorch training stack on AWS Trainium2.", 'score': 56, 'issue_id': 3331, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': '02c01e0ceb16bc13', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#synthetic', '#video', '#dataset', '#open_source', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Обучение видеомоделей перманентности объектов через когнитивные задачи', 'desc': 'Исследование изучает, обладают ли видеогенерационные модели способностью к перманентности объектов — фундаментальному принципу человеческого восприятия. Авторы создали WROP, датасет из 150 задач, вдохновленных когнитивной наукой и структурированных в шесть категорий, с использованием процедурной генерации в Blender для создания 1.5 млн примеров обучения. Они обучили и оценили 14 видеомоделей разных архитектур, включая собственную модель PWM-WROP с 16 млрд параметров, используя стек PyTorch на AWS Trainium2. Результаты показывают, что современные видеомодели демонстрируют эмерджентные способности рассуждения о физической реальности, конкурируя с человеческой интуицией при понимании стабильности и постоянства объектов.'}, 'en': {'title': 'Unlocking Object Permanence in Video Models', 'desc': "This paper explores the concept of object permanence in video generation models, which are designed to mimic human-like reasoning. The authors introduce WROP, a dataset consisting of 150 cognitive science-inspired tasks that test the models' ability to understand physical properties of objects. They create a diverse training set with over 1.5 million samples to train various video models, including their own advanced model, PWM-WROP. The results show that PWM-WROP performs well in evaluations, indicating that these models can develop reasoning abilities similar to human cognition."}, 'zh': {'title': '提升视频模型的物体持久性推理能力', 'desc': '本论文探讨了视频生成模型在物体持久性和物体坚固性方面的推理能力。我们提出了WROP（世界推理与物体持久性），这是一个包含150个认知科学启发任务的数据基础设施，旨在训练视频模型。通过随机化速度、光照和摄像机角度等参数，我们生成了超过10,000个样本，以保持每个任务的认知结构。最终，我们评估了14个视频模型，结果显示我们的PWM-WROP模型在续集模型中排名第一，整体排名第三。'}}}, {'id': 'https://huggingface.co/papers/2609.23407', 'title': 'OmniEcho: Spatial Audio Understanding for Embodied Agents', 'url': 'https://huggingface.co/papers/2609.23407', 'abstract': 'Abstract  Humans can effortlessly localize the direction of a sound source and integrate it with visual cues for reasoning, yet this remains challenging for embodied agents. In particular, it is still unclear how to effectively evaluate and model spatial audio understanding in embodied settings. To address this gap, we introduce OmniEchoBench, a unified benchmark for spatial audio-visual perception and audio-vision-language navigation. OmniEchoBench comprises six tasks over 197 real-world spatial audio-visual scenes, 2,972 question-answer pairs, and 900 navigation samples with first-order ambisonics (FOA) audio collected from 30 real-world environments. To enable scalable training supervision, we develop a controllable rendering pipeline for spatial audio. It preserves geometric consistency among sound sources, visual observations, and agent trajectories. Building on this, we propose OmniEcho, a spatially aware omni-modal model. It introduces an FOA spatial encoder alongside a pretrained semantic audio pathway. Extensive experiments show that OmniEcho achieves state-of-the-art performance on spatial audio-visual perception. For our sound-guided navigation, OmniEcho reaches a performance level close to that of traditional vision-language navigation. These results demonstrate that spatial audio can serve as a valuable signal for embodied scene reasoning and navigation, while also highlighting fine-grained spatial localization and distance estimation as important open challenges.', 'score': 15, 'issue_id': 3331, 'pub_date': '2026-09-20', 'pub_date_card': {'ru': '20 сентября', 'en': 'September 20', 'zh': '9月20日'}, 'hash': '1c5aa2c9e5a69944', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#audio', '#dataset', '#open_source', '#agents', '#robotics', '#benchmark', '#multimodal'], 'emoji': '🎵', 'ru': {'title': 'Слух робота: понимание пространственного звука для навигации воплощённых агентов', 'desc': 'В статье представлен OmniEchoBench — новый бенчмарк для оценки понимания пространственного звука в воплощённых агентах, включающий шесть задач на основе реальных сцен со звуком в формате первого порядка амбионики (FOA). Авторы разработали управляемый конвейер синтеза пространственного звука, который сохраняет геометрическую согласованность между источниками звука, визуальными наблюдениями и траекториями агента. Предложена модель OmniEcho, объединяющая кодировщик FOA с предобученным семантическим аудиопроцессором, которая достигает лучших результатов в задачах аудиовизуального восприятия. Экспериментальные результаты показывают, что пространственный звук является ценным сигналом для навигации и рассуждения об окружающей сцене, но остаются открытыми задачи точной локализации и оценки расстояния.'}, 'en': {'title': 'Enhancing Navigation with Spatial Audio Understanding', 'desc': 'This paper presents OmniEchoBench, a benchmark designed to evaluate and model how embodied agents perceive spatial audio and integrate it with visual information. It includes six tasks across 197 real-world scenes, featuring a large dataset of audio-visual pairs and navigation samples. The authors introduce OmniEcho, a model that utilizes a first-order ambisonics spatial encoder and a pretrained semantic audio pathway to enhance spatial awareness. The results indicate that spatial audio significantly aids in scene reasoning and navigation, while also pointing out challenges in precise spatial localization and distance estimation.'}, 'zh': {'title': '空间音频助力智能导航的未来', 'desc': '本文介绍了OmniEchoBench，这是一个用于空间音频-视觉感知和音频-视觉-语言导航的统一基准。该基准包含197个真实世界的空间音频-视觉场景、2972个问答对和900个导航样本，使用了来自30个真实环境的第一阶音频（FOA）。为了支持可扩展的训练监督，我们开发了一种可控的空间音频渲染管道，确保声音源、视觉观察和代理轨迹之间的几何一致性。基于此，我们提出了OmniEcho，一个具有空间感知能力的全模态模型，实验结果表明其在空间音频-视觉感知方面达到了最先进的性能。'}}}, {'id': 'https://huggingface.co/papers/2609.28416', 'title': 'Agent-Editing World Model: Rethinking World Modeling for LLM Agents', 'url': 'https://huggingface.co/papers/2609.28416', 'abstract': 'Abstract  Recent advances in large language models (LLMs) have enabled agents to tackle long-horizon tasks across diverse environments. To further improve agent performance, existing language world models typically predict environment observations, yet reconstructing high-entropy, execution-dependent tool responses offers limited value when real feedback is available. Meanwhile, agents suffer from task-state contamination, where unsupported assumptions and outdated plans persist in history and distort subsequent decisions. We propose the Agent-Editing World Model (AEWM), which models how reasoning and actions shape future task progress rather than simulating tool responses. AEWM combines Action Judge to distinguish Critical, Exploratory, and Noisy decisions with State Revision to edit noisy reasoning--action continuations from the same observed history. EditAct integrates these capabilities with real execution, directly changing the state underlying subsequent decisions rather than merely providing critiques. We train AEWM across Search, Terminal, and Software Engineering through mid-training and supervised fine-tuning. AEWM achieves 70.5\\% macro-F1 on our Action Judge benchmark, exceeding the strongest frontier baseline by 10.6 points. Across six benchmarks and three agent backbones, EditAct improves average scores by 3.2--6.7 points over the strongest baseline. Furthermore, rejection sampling fine-tuning on verified EditAct trajectories, termed AEWM-RFT, improves over Self-RFT by 2.2--2.6 points across three domains without online AEWM guidance.', 'score': 13, 'issue_id': 3331, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'e8d1272bdc2cff0b', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#reasoning', '#optimization', '#training', '#agents', '#benchmark'], 'emoji': '✏️', 'ru': {'title': 'Редактирование состояния агента для улучшения долгосрочного планирования', 'desc': 'В этой работе авторы предлагают Agent-Editing World Model (AEWM) — новый подход к улучшению производительности агентов на основе больших языковых моделей при решении долгосрочных задач. Вместо предсказания ответов инструментов модель учится моделировать, как рассуждения и действия влияют на прогресс задачи, решая проблему загрязнения состояния агента. AEWM использует компоненты Action Judge для классификации решений и State Revision для редактирования ошибочных цепочек рассуждений, интегрируя эти возможности с реальным выполнением. Экспериментальные результаты показывают значительные улучшения на нескольких бенчмарках и демонстрируют эффективность метода fine-tuning через rejection sampling на проверенных траекториях.'}, 'en': {'title': 'Revolutionizing Agent Performance with AEWM', 'desc': 'This paper introduces the Agent-Editing World Model (AEWM), which enhances the performance of agents in long-horizon tasks by focusing on how reasoning and actions influence future task progress. Unlike traditional models that predict tool responses, AEWM emphasizes editing noisy decision-making processes to improve accuracy. It employs an Action Judge to categorize decisions and State Revision to refine reasoning based on observed history. The results show that AEWM significantly outperforms existing models across various benchmarks, demonstrating its effectiveness in real execution scenarios.'}, 'zh': {'title': '智能体编辑：提升决策质量的创新模型', 'desc': '最近大型语言模型（LLMs）的进展使得智能体能够在多样化环境中处理长期任务。为了进一步提高智能体的性能，现有的语言世界模型通常预测环境观察，但在真实反馈可用时，重建高熵、依赖执行的工具响应的价值有限。同时，智能体面临任务状态污染的问题，即不支持的假设和过时的计划在历史中持续存在，扭曲后续决策。我们提出了智能体编辑世界模型（AEWM），它建模推理和行动如何塑造未来任务进展，而不是简单模拟工具响应。'}}}, {'id': 'https://huggingface.co/papers/2609.29892', 'title': 'Qwen-Planner-Agent: A Closed-Loop AI-for-AI Framework for Real-World Mobile Planner Agents', 'url': 'https://huggingface.co/papers/2609.29892', 'abstract': 'Abstract  The rapid progression of large language models is extending AI from passive content generation into the active workflows of engineering and scientific discovery. This shift raises a compelling question: can AI be both the object of development and an active participant in building next-generation AI systems? We explore this question by building Qwen-Planner-Agent within a closed-loop AI-for-AI framework for scalable development and iterative improvement. Mobile planning offers a demanding test of this approach: complex, long-horizon tasks challenge agent reliability, while costly real-device interaction limits development scalability. The framework connects data production, model training, and deployment through a shared action-feedback-verification contract. (i) AI for Data builds a human-gated agentic data flywheel in which specialized agents construct tasks, collect interaction trajectories, curate and balance training data, and use training feedback to guide subsequent data generation. (ii) AI for Training combines a supervised planning cold start with hybrid-environment online agentic reinforcement learning, where we introduce Competence-Aware Reward-and-Advantage Engineering (CARE) to reduce reasoning and tool-use costs while preserving task performance. (iii) AI drives model--harness co-evolution through an execution-evidence-driven loop that orchestrates memory, skills, and tools at runtime and feeds structured action feedback and preserved failure traces back into coordinated model and harness adaptation. Qwen-Planner-Agent achieves the best overall performance among all evaluated models and systems on MobilePA-Bench, improving over its base model across tool use, memory, skills, and sub-agent coordination. Further evaluations of our model show improvements across non-mobile agentic benchmarks while largely preserving general capabilities.', 'score': 7, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '83a3dbac4336915e', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#reasoning', '#science', '#optimization', '#training', '#agents', '#open_source', '#benchmark', '#data'], 'emoji': '🔄', 'ru': {'title': 'ИИ развивает ИИ: замкнутый цикл для масштабируемой эволюции планирующих агентов', 'desc': 'В статье предложена система Qwen-Planner-Agent, которая использует замкнутый цикл AI-for-AI для масштабируемой разработки агентов. Фреймворк состоит из трёх компонентов: AI for Data создаёт автоматизированный конвейер для генерации и курирования обучающих данных, AI for Training применяет обучение с подкреплением в гибридной среде с новым методом CARE для оптимизации стоимости, а третий компонент обеспечивает совместную эволюцию модели и системы выполнения через циклическую обратную связь. Модель демонстрирует улучшение качества на сложных задачах долгосрочного планирования в мобильной среде, сохраняя при этом универсальные способности.'}, 'en': {'title': 'Empowering AI: Building Smarter Systems with Qwen-Planner-Agent', 'desc': 'This paper discusses the development of Qwen-Planner-Agent, an AI system designed to enhance the capabilities of large language models in engineering and scientific tasks. It introduces a closed-loop framework that integrates data production, model training, and deployment, allowing for iterative improvements in AI performance. The system employs a unique approach called Competence-Aware Reward-and-Advantage Engineering (CARE) to optimize learning and reduce costs associated with reasoning and tool use. The results demonstrate that Qwen-Planner-Agent outperforms existing models in complex mobile planning tasks, showcasing its effectiveness in both task execution and adaptability.'}, 'zh': {'title': 'AI驱动的智能规划与迭代改进', 'desc': '这篇论文探讨了大型语言模型在工程和科学发现中的应用，提出了Qwen-Planner-Agent框架。该框架通过一个闭环的AI-for-AI系统，实现了可扩展的开发和迭代改进。论文中介绍了如何通过数据生成、模型训练和部署的连接，提升AI的任务执行能力和可靠性。最终，Qwen-Planner-Agent在MobilePA-Bench上表现最佳，显示出在工具使用、记忆、技能和子代理协调方面的显著改进。'}}}, {'id': 'https://huggingface.co/papers/2609.29444', 'title': 'IterSynth: Rethinking Deep Search Agents via Role-Decoupled Iterative Synthesis', 'url': 'https://huggingface.co/papers/2609.29444', 'abstract': 'Abstract  Deep search requires LLM agents to decompose complex queries, search for evidence, and synthesize grounded answers, yet existing ReAct-style agents suffer from two limitations: role coupling, where one policy must handle planning, evidence use, and synthesis; and context accumulation, where growing search histories introduce noise and obscure useful information. To address these issues, we propose IterSynth, a role-decoupled and summary-based paradigm that alternates between a Planner for identifying information needs and a Synthesizer for integrating evidence into an evolving summary state. This design separates planning from synthesis while using the summary as the persistent state of search, reducing both capability coupling and context noise. To train IterSynth effectively, we further introduce Role-Decoupled Policy Optimization (RDPO) for reinforcement learning, which combines terminal outcome rewards with turn-level rubric evaluations and computes role-specific advantages for more precise credit assignment. Experiments on five long-horizon deep-search benchmarks such as BrowseComp and Xbench-DS show that IterSynth-8B achieves an average score of 50.7, surpassing the strongest prior leq8B agent by +4.2\\%. Moreover, IterSynth serves as a model-agnostic prompting paradigm, delivering substantial zero-shot gains over ReAct and similar prompting paradigms on frontier proprietary models.', 'score': 4, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '0ee490c5bdd0ce1d', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agents', '#rl', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Разделение ролей в поиске: от целостного агента к специализированному планировщику и синтезатору', 'desc': 'В статье представляется IterSynth — новая парадигма для агентов на основе больших языковых моделей, которая решает проблемы существующих ReAct-подходов путём разделения ролей на Планировщика и Синтезатор. Система использует накапливающееся резюме в качестве основного состояния поиска, что снижает шум контекста и связанность возможностей. Для обучения модели авторы предлагают метод Role-Decoupled Policy Optimization (RDPO), который комбинирует финальные награды с пошаговыми оценками и вычисляет ролеспецифичные преимущества для точного распределения кредита. Экспериментальные результаты на пяти бенчмарках глубокого поиска показывают, что IterSynth-8B превосходит предыдущие агенты на +4.2% и хорошо работает как модельноагностичная парадигма промптинга на современных моделях.'}, 'en': {'title': 'Decoupling Roles for Enhanced Deep Search Efficiency', 'desc': 'This paper introduces IterSynth, a new approach for deep search using large language model (LLM) agents. It addresses two main issues in existing ReAct-style agents: role coupling, where one policy manages multiple tasks, and context accumulation, which can introduce noise in search histories. IterSynth separates the roles of planning and synthesis, allowing a Planner to identify information needs and a Synthesizer to integrate evidence into a summary. The authors also present Role-Decoupled Policy Optimization (RDPO) for training, which enhances performance by providing clearer credit assignment for different roles in the process.'}, 'zh': {'title': '解耦规划与综合的深度搜索新方法', 'desc': '本论文提出了一种新的深度搜索方法，称为IterSynth，旨在解决现有ReAct风格代理的两个主要问题：角色耦合和上下文累积。IterSynth通过将规划和综合过程分开，使用一个规划器来识别信息需求，并使用一个综合器将证据整合到不断演变的摘要状态中，从而减少了能力耦合和上下文噪声。为了有效训练IterSynth，论文还引入了角色解耦策略优化（RDPO），结合终端结果奖励和逐轮评估，进行更精确的信用分配。实验结果表明，IterSynth在多个深度搜索基准测试中表现优异，超越了之前的最强代理。'}}}, {'id': 'https://huggingface.co/papers/2609.29647', 'title': 'AgentKernel: The Trust-Native Agentic Operating System', 'url': 'https://huggingface.co/papers/2609.29647', 'abstract': 'Abstract  Modern AI agents routinely cross trust boundaries: they ingest untrusted content, combine it with privileged instructions, persist intermediate beliefs in long-term memory, and invoke privileged tools. This creates an attack surface in which malicious payloads can enter through model inputs and cause harmful tool actions. Yet current governance stacks remain application-level middleware that share a process trust boundary with the agents they monitor. We argue that agents need an operating-system substrate providing mandatory, non-bypassable services for identity, input mediation, memory governance, and execution control.   We introduce AgentKernel, a trust-native agent operating system built around the premise that security must be a first-class design constraint. AgentKernel wraps the agent lifecycle in a mandatory enforcement boundary organized into four pillars: Identity, Perception, Cognition, and Execution. Each pillar adapts classical OS security principles to failures at the semantic plane, including delegation abuse, prompt injection, memory poisoning, and tool misuse.   AgentKernel treats structural security as a capability multiplier. Kernel-managed identity supports trustworthy cross-organization collaboration; graduated perception replaces brittle single-point filters; information-flow-controlled memory improves retrieval fidelity while limiting poisoning; and semantic-to-kernel enforcement permits broader tool privileges behind a non-bypassable boundary. We position AgentKernel as the missing OS layer beneath orchestration frameworks, agent runtimes, governance platforms, and execution sandboxes, and use systematic comparison and security analysis to show how a single integrated architecture can enforce security across the full agent lifecycle.', 'score': 4, 'issue_id': 3331, 'pub_date': '2026-08-29', 'pub_date_card': {'ru': '29 августа', 'en': 'August 29', 'zh': '8月29日'}, 'hash': '601fcdc0dbd38478', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agi', '#agents', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность AI-агентов как фундаментальный слой операционной системы', 'desc': 'Статья представляет AgentKernel — операционную систему для AI-агентов, которая обеспечивает безопасность на уровне ядра. Авторы показывают, что современные агенты сталкиваются с серьёзными уязвимостями при работе с недоверенным контентом, и существующие системы защиты недостаточны. AgentKernel реализует четыре основных компонента: управление идентичностью, медиацию входных данных, контроль памяти и управление выполнением, адаптируя классические принципы безопасности операционных систем к семантическому уровню. Интегрированная архитектура позволяет предотвратить атаки типа prompt injection, отравление памяти и злоупотребление инструментами на всех этапах жизненного цикла агента.'}, 'en': {'title': 'AgentKernel: Securing AI Agents with Trust-Native Architecture', 'desc': 'This paper introduces AgentKernel, a new operating system designed specifically for AI agents to enhance security and trust. It addresses the vulnerabilities that arise when AI agents interact with untrusted content and privileged instructions, which can lead to harmful actions. AgentKernel establishes a mandatory enforcement boundary around the agent lifecycle, organized into four key areas: Identity, Perception, Cognition, and Execution, each aimed at preventing security breaches. By integrating classical OS security principles, AgentKernel aims to provide a robust framework that ensures safe collaboration and execution for AI agents.'}, 'zh': {'title': 'AgentKernel：安全优先的代理操作系统', 'desc': '现代人工智能代理经常跨越信任边界，处理不受信任的内容并结合特权指令，这可能导致恶意攻击。当前的治理系统仍然是应用级中间件，与被监控的代理共享信任边界。本文提出了AgentKernel，一个以安全为设计核心的代理操作系统，提供身份、输入调解、内存治理和执行控制等强制服务。AgentKernel通过四个支柱（身份、感知、认知和执行）来管理代理生命周期，确保在整个代理生命周期中实施安全性。'}}}, {'id': 'https://huggingface.co/papers/2609.29837', 'title': 'PUBG Ally: A Conversational Embodied Agent as an AI Teammate', 'url': 'https://huggingface.co/papers/2609.29837', 'abstract': "Abstract  We introduce PUBG Ally, an embodied agent for PUBG: BATTLEGROUNDS that can reason, act autonomously, and play alongside players as a voice-enabled teammate. Building such a teammate requires combining two difficult capabilities: it must perceive and respond to a constantly changing game world under strict latency constraints while interacting naturally with players, keeping its speech synchronized with its actions. Ally therefore combines agentic tool use with real-time game control. A language-model agent uses a controlled interface to inspect game information, interpret player speech, maintain context, decide what to say, and issue high-level action choices that steer a faster control layer for movement, combat, and recovery. Because the player's and Ally's speech and actions continually shape each other and the course of the match, training requires data from actual gameplay. We therefore collect data across nearly 39k sessions in which real players play alongside Ally, recording gameplay, player speech, agent decisions, tool use, actions, and player feedback, and use these records for iterative training. To evaluate teammate quality, we use player feedback and preference comparisons to identify gaps between offline evaluations and player preferences, and iteratively refine the evaluation criteria. Deploying Ally in live service further requires low-latency on-device execution and safeguards for player-facing communication, which we address through model compression, context compaction, targeted safety training, runtime guardrails, and memory redaction. During the live service, we surveyed players in 141 countries. Among respondents whose play with Ally was confirmed in game records, positive responses exceeded negative responses by 25.1 percentage points when asked whether they would recommend Ally, with players describing Ally not only as a tool but also as a teammate or companion.", 'score': 3, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '771fc2b33ae67828', 'pdf_title_img': 'assets/pdf/title_img/2609.29837.jpg', 'data': {'categories': ['#alignment', '#reasoning', '#games'], 'emoji': '🎮', 'ru': {'title': 'Языковой агент как игровой напарник: от обучения к боевому развёртыванию', 'desc': 'В работе представлен PUBG Ally — воплощённый агент, основанный на языковой модели, который может автономно играть в видеоигре PUBG как голосовой напарник человеческого игрока. Агент объединяет возможности использования инструментов для анализа игровой информации с системой управления реального времени, позволяя ему воспринимать изменяющуюся игровую среду, интерпретировать речь игрока и принимать решения с минимальной задержкой. Для обучения модели авторы собрали датасет из 39 тысяч игровых сессий с реальными игроками, включающий геймплей, речь, действия агента и обратную связь пользователей, что позволило итеративно улучшать качество товарища по игре. Система была развёрнута в публичный сервис с применением компрессии модели, защиты коммуникаций и механизмов обеспечения безопасности, и получила положительную оценку игроков из 141 страны.'}, 'en': {'title': 'PUBG Ally: Your AI Teammate in Battle!', 'desc': 'The paper presents PUBG Ally, an AI agent designed to play alongside human players in the game PUBG: BATTLEGROUNDS. It integrates real-time perception and action capabilities, allowing it to respond to the dynamic game environment while maintaining natural communication with players. The agent utilizes a language model to interpret player speech and make decisions that influence its actions, ensuring a synchronized interaction. Training involves analyzing data from thousands of gameplay sessions to improve its performance and player satisfaction, ultimately creating a companion-like experience for gamers.'}, 'zh': {'title': 'PUBG Ally：你的游戏伙伴与助手', 'desc': '本文介绍了PUBG Ally，一个能够在《PUBG：战场》中自主推理和行动的虚拟助手。它需要在快速变化的游戏环境中感知和响应，同时与玩家自然互动，保持语音与动作的同步。Ally结合了智能工具使用和实时游戏控制，通过语言模型代理来处理游戏信息、理解玩家语音、维护上下文，并做出高层次的行动选择。我们通过收集近39,000场游戏会话的数据，进行迭代训练，以提高Ally的表现，并确保其在实时服务中的低延迟执行和安全沟通。'}}}, {'id': 'https://huggingface.co/papers/2609.29964', 'title': 'World Action Agent: Harnessing VLMs for Robot Manipulation via World Action Rehearsal', 'url': 'https://huggingface.co/papers/2609.29964', 'abstract': 'Abstract  General-purpose vision-language models (VLMs) bring broad knowledge and spatial reasoning to robot manipulation, yet existing systems either use them indirectly, to predict constraints or write programs, or give them a view of the scene rather than a world in which to act. We present World Action Agent (WAA), a multi-agent harness through which VLMs pilot robots with basic tools, making every decision within a visual action workspace. The workspace has three properties. Contact views, selected automatically from the scene geometry, present the scene around the current interaction. Action rehearsal turns each action into an editable proposal that the agent, alone or through an Imagination Agent, previews and revises against planning feedback before execution. In-view correction closes the loop between observation, rehearsal, and low-level execution, letting the agent remove residual offsets in the view where it observes them. Through the same workspace, WAA acquires embodied procedural knowledge in two ways: it evolves multimodal skills from expert videos and human teaching under evidence-based review and consults them through a Skill Agent, and its interaction traces train smaller VLMs to pilot the same harness. On LIBERO-Pro, WAA with skills evolved only from LIBERO-90 reaches a state-of-the-art 75.6% average success, outperforming end-to-end VLAs, code-as-policy agents, and a visual-harness baseline with the same backbone; the same skills remain effective on robosuite without further learning. Fine-tuning Qwen3.5-9B on harness traces raises its out-of-domain success from 1.7% to 43.3%.', 'score': 3, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'b448aaa55e6ee076', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#small_models', '#training', '#cv', '#agents', '#multimodal', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Робот учится видеть и действовать через языковую модель', 'desc': 'Статья представляет World Action Agent (WAA) — систему, которая использует vision-language models для управления манипуляторами роботов через визуальное рабочее пространство. Ключевая инновация заключается в трёх свойствах рабочего пространства: контактные представления сцены, репетиция действий с возможностью редактирования и коррекция в процессе наблюдения. Система обучается двумя способами — эволюционируя мультимодальные навыки из видео экспертов и обучая меньшие VLM на основеTrace взаимодействия. WAA достигает передовых результатов на бенчмарке LIBERO-Pro с точностью 75.6%, превосходя end-to-end подходы и code-as-policy агентов.'}, 'en': {'title': 'Empowering Robots with Vision-Language Action Workspaces', 'desc': 'The paper introduces the World Action Agent (WAA), a novel framework that enhances robot manipulation using vision-language models (VLMs). Unlike previous systems, WAA allows VLMs to make decisions within a visual action workspace, integrating spatial reasoning directly into robotic actions. This workspace features automatic contact views, editable action proposals, and in-view corrections, enabling the agent to refine its actions based on real-time feedback. The WAA demonstrates superior performance in skill acquisition and execution, achieving a state-of-the-art success rate on benchmark tasks by leveraging multimodal learning from expert demonstrations and human guidance.'}, 'zh': {'title': '通过视觉语言模型提升机器人操控能力', 'desc': '本文介绍了一种名为世界行动代理（WAA）的多智能体系统，旨在通过视觉语言模型（VLMs）来操控机器人。WAA在一个视觉行动工作空间中进行决策，该工作空间具有接触视图、动作排练和视图修正等特性。通过这些特性，代理可以在执行前预览和修改动作，并在观察到偏差时进行修正。实验结果表明，WAA在LIBERO-Pro上达到了75.6%的成功率，超越了其他现有的机器人操控方法。'}}}, {'id': 'https://huggingface.co/papers/2609.30221', 'title': 'WanPE: Towards Cinematic Prompt Enhancement for Modern Text-to-Video Generation', 'url': 'https://huggingface.co/papers/2609.30221', 'abstract': "Abstract  Video generation begins in text space by authoring a cinematic screenplay, then materializes into pixels. As contemporary video generators scale to 30 seconds and faithfully follow complex conditions, the textual prompt largely directs the production, planning how actions, camera trajectories, lighting, and sound unfold across multi-shot sequences. In this paper, we present WanPE, a 397B-parameter prompt enhancement model trained on 1.05M real-world videos to master director-level cinematic planning. WanPE formulates shot-level cinematic plans via video-grounded reverse construction and employs Semantic-Consistency GRPO (SC-GRPO) to faithfully preserve user requirements across shots and over time. To benchmark this capability, we curate WanPEval, a human-annotated testbed covering durations from 5 to 30 seconds across varying intent granularities, supported by approximately 11K blind pairwise assessments. When powering Wan3.0's video generator, WanPE-397B boosts human preference over raw user prompts by 10.66-18.84 points at 5-15 seconds and by a dramatic 50.86 points in the 30-second arena. Ablation studies show that reverse construction demonstrates clear superiority over forward rewriting, while SC-GRPO robustly preserves semantic fidelity across model scales. Ultimately, WanPE leads all evaluated commercial offerings at 5-15 seconds and remains competitive with Seedance 2.5 at 30 seconds.", 'score': 3, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '287ec4619b3f9287', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#dataset', '#training', '#benchmark', '#multimodal'], 'emoji': '🎬', 'ru': {'title': 'Режиссёрская режиссура через усиление текстовых подсказок для видеогенерации', 'desc': 'В статье представлена WanPE — большая языковая модель с 397 миллиардами параметров, обученная на 1.05 миллионе видео для улучшения текстовых подсказок при генерации видео. Модель использует метод reverse construction для формирования кадр-уровневых кинематографических планов и применяет специализированный алгоритм SC-GRPO для сохранения семантической согласованности пользовательских требований во времени. Авторы создали датасет WanPEval с человеческими аннотациями для оценки качества планирования видеопоследовательностей. Экспериментальные результаты показывают значительное улучшение предпочтений пользователей (на 50.86 пункта для 30-секундных видео) по сравнению с исходными подсказками.'}, 'en': {'title': 'Enhancing Video Generation with Cinematic Planning', 'desc': 'This paper introduces WanPE, a large-scale prompt enhancement model designed to improve video generation from textual descriptions. It utilizes a unique approach called video-grounded reverse construction to create detailed cinematic plans for video sequences, ensuring that user requirements are met consistently across different shots. The model is evaluated using a new benchmark, WanPEval, which includes human assessments of video quality and coherence. Results show that WanPE significantly enhances user preference for generated videos, outperforming existing models in various scenarios.'}, 'zh': {'title': 'WanPE：引领视频生成的新纪元', 'desc': '本论文介绍了一种名为WanPE的视频生成模型，它通过文本提示生成高质量的视频。WanPE拥有3970亿个参数，经过105万段真实视频的训练，能够进行导演级的电影规划。该模型使用视频基础的反向构建方法制定镜头级的电影计划，并通过语义一致性GRPO（SC-GRPO）确保用户需求在镜头间和时间上的一致性。实验结果表明，WanPE在视频生成方面显著提高了人类偏好，尤其在30秒的视频生成中表现出色。'}}}, {'id': 'https://huggingface.co/papers/2609.23087', 'title': 'Neural Spectral Capacity: Measuring and Designing Architectures from Network Specification Alone', 'url': 'https://huggingface.co/papers/2609.23087', 'abstract': 'Abstract  Modern Transformer design and compression both reduce to allocating capacity under a budget. The standard scalars for these decisions, #Params and #FLOPs, capture size and compute but not architectural structure: two architectures with identical parameter budgets but different depth-width, head, or FFN allocations receive identical scores yet behave differently. We propose Neural Spectral Capacity (NSC), a closed-form scalar grounded in the singular-value spectrum of each weight matrix. Under standard random initialization, the Marchenko-Pastur law renders NSC computable from the architectural specification alone, with no model instantiation, data, or gradients. Its layer-wise additive structure admits NSC-DP, an exact dynamic-programming solver returning the architecture globally maximizing NSC under resource constraints in seconds on a CPU -- a guarantee that black-box search over existing training-free proxies cannot provide. Empirically, NSC outperforms #Params, #FLOPs, and representative training-free proxies in ranking across seven Transformer and CNN families (on FlexiBERT, τ= 0.505 on pairs differing in #Params by less than 10%, where #Params collapses to 0.082); NSC-DP discovers a Transformer-XL architecture on WikiText-103 that beats the human-designed baseline in 2 seconds; and prunes LLaMA-7B to the best 5.7B model across eight commonsense reasoning tasks without any calibration data, about 5900x faster than the strongest training-free proxy baseline.', 'score': 2, 'issue_id': 3331, 'pub_date': '2026-09-19', 'pub_date_card': {'ru': '19 сентября', 'en': 'September 19', 'zh': '9月19日'}, 'hash': 'c02f66ca13de9f0c', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#architecture', '#inference', '#training', '#optimization'], 'emoji': '🏗️', 'ru': {'title': 'Спектральная мощность: новый способ оценить архитектуру нейросети без обучения', 'desc': 'В статье предлагается новая метрика Neural Spectral Capacity (NSC) для оценки архитектуры нейронных сетей, которая учитывает не только количество параметров и вычислений, но и структурные особенности модели, такие как глубина, ширина и конфигурация слоёв. NSC вычисляется на основе сингулярного спектра матриц весов и может быть рассчитана напрямую из архитектурной спецификации без обучения модели, используя закон Марченко-Пастура. Авторы разработали алгоритм динамического программирования NSC-DP, который находит оптимальную архитектуру под заданными ресурсными ограничениями за считанные секунды. Экспериментально показано, что NSC превосходит стандартные метрики при ранжировании архитектур, способна быстро найти улучшенные модели и выполнить эффективное сжатие больших языковых моделей без калибровочных данных.'}, 'en': {'title': 'Unlocking Neural Architecture with Spectral Insights', 'desc': 'This paper introduces Neural Spectral Capacity (NSC), a new metric for evaluating and optimizing neural network architectures based on their weight matrix properties. Unlike traditional metrics like #Params and #FLOPs, NSC considers the architectural structure, allowing for a more nuanced understanding of model performance. The authors present NSC-DP, a dynamic programming approach that efficiently finds the best architecture under resource constraints without needing model training or data. Empirical results show that NSC significantly outperforms existing metrics in various tasks, demonstrating its effectiveness in architecture search and model compression.'}, 'zh': {'title': '优化神经网络架构的新方法', 'desc': '本论文提出了一种新的神经网络架构评估方法，称为神经谱容量（NSC），它基于权重矩阵的奇异值谱。NSC可以在不需要模型实例化、数据或梯度的情况下，仅通过架构规格计算得出。该方法的层级加法结构使得NSC-DP成为一种精确的动态规划求解器，可以在几秒钟内找到在资源约束下最大化NSC的架构。实验表明，NSC在多个变换器和卷积神经网络家族中优于传统的参数和计算量指标。'}}}, {'id': 'https://huggingface.co/papers/2609.30199', 'title': "ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds", 'url': 'https://huggingface.co/papers/2609.30199', 'abstract': 'Abstract  Scientific discovery begins where known problems end. There, AI systems must engage in exploration: framing hypotheses, designing experiments, and iterating on the results. However, evaluating this ability is difficult: (1) how to verify whether a genuinely new hypothesis holds, and (2) how to determine whether a system has discovered it through exploration or merely recalled related knowledge from pre-training data. To this end, we introduce ExplorationBench, which turns the wicked problem of evaluating scientific exploration into a concrete and tractable framework built on verifiable Alien Worlds: their rules are executable, so every answer can be checked exactly, and they conflict with familiar knowledge, so recall alone cannot solve the tasks. The benchmark contains two sandboxes, AlienCode (31 discovery targets, 70 tasks) and AlienLogic (24 discovery targets, 70 tasks). Each sandbox provides a flawed manual, task-specific environmental feedback, and a dedicated tool-call schema. Systems use these resources to explore the sandbox, then solve held-out tasks. We evaluate 10 AI systems and find that the strongest systems can acquire and apply unfamiliar rules, while performance varies substantially across trajectories and continued exploration can stall or reverse earlier gains. ExplorationBench represents a step towards AI systems that can acquire and apply genuinely new knowledge through exploration in unknown environments.', 'score': 2, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'fcbc262105b112d5', 'authors': ['Ming Zhang', 'Zhenghao Xiang', 'Peizhong Gao', 'Yujiong Shen', 'Yuhui Wang', 'Zhonghan Yue', 'Shihan Dou', 'Zhangyue Yin', 'Junjie Ye', 'Shichun Liu', 'Weihuang Zheng', 'Jiahao Chen', 'Jiayi Chen', 'Hongzhang Liu', 'Jiaqi Shao', 'Tao Gui', 'Qi Zhang', 'Xuanjing Huang', 'Suncong Zheng', 'Maxm Pan'], 'affiliations': ['Hunyuan Team, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2609.30199.jpg', 'data': {'categories': ['#agents', '#reasoning', '#science', '#benchmark'], 'emoji': '🔬', 'ru': {'title': 'Оценка способности AI к научному исследованию через верифицируемые миры', 'desc': 'В работе представлен ExplorationBench — новый бенчмарк для оценки способности AI систем к научному исследованию и открытию новых закономерностей. Авторы создали два виртуальных окружения (AlienCode и AlienLogic) с выполняемыми правилами, которые позволяют точно проверить правильность гипотез и отличить истинное исследование от простого воспроизведения знаний из данных предобучения. Бенчмарк содержит задачи на обнаружение неизвестных правил, где системы должны выдвигать гипотезы, проектировать эксперименты и итеративно улучшать свои решения на основе обратной связи. Оценка 10 различных AI систем показала, что сильные модели способны усваивать и применять новые правила, хотя эффективность значительно варьируется и может ухудшаться при дальнейшем исследовании.'}, 'en': {'title': "ExplorationBench: Evaluating AI's Scientific Discovery Skills", 'desc': "This paper introduces ExplorationBench, a framework designed to evaluate AI systems' ability to explore and discover new scientific knowledge. It addresses the challenges of verifying new hypotheses and distinguishing genuine exploration from mere recall of pre-existing knowledge. The framework includes two environments, AlienCode and AlienLogic, where AI systems can experiment and learn from flawed manuals and feedback. The study evaluates multiple AI systems, revealing that while some can learn and apply new rules effectively, their performance can vary significantly, highlighting the complexities of exploration in unfamiliar settings."}, 'zh': {'title': '探索未知，获取新知识的AI系统', 'desc': '这篇论文介绍了一个名为ExplorationBench的框架，用于评估人工智能系统在科学探索中的能力。该框架通过可验证的外星世界来解决评估科学探索的复杂问题，确保每个答案都可以精确检查。研究中包含两个沙盒，AlienCode和AlienLogic，系统在这些沙盒中探索并解决任务。结果表明，最强的AI系统能够获取和应用不熟悉的规则，但不同系统的表现差异很大，持续探索可能会导致早期进展的停滞或倒退。'}}}, {'id': 'https://huggingface.co/papers/2609.29421', 'title': 'Rufus-Air: An Open LLM Post-Training Recipe', 'url': 'https://huggingface.co/papers/2609.29421', 'abstract': 'Abstract  Rufus-Air is an open and reproducible post-training recipe on GLM-4.5-Air-Base (106B-A12B), organized as a serial pipeline of eight stages: SFT, Reasoning RL, Coding RL, Instruction-Following RL, General Agent, Coding Agent, Search Agent, and RLHF. We document the data, reward design, infrastructure, stage order, and stagewise results needed to reproduce the recipe. Stages progress from basic to advanced capabilities and from hard, verifiable rewards to softer judge-based signals. Training builds on open-source components and public data, much of it used as released, without new human annotation or an in-house distillation teacher. Our main findings are that (i) diverse, high-quality SFT establishes a strong capability floor; (ii) difficulty filtering keeps RL prompts within a productive learning range; (iii) reward reliability provides a practical principle for ordering stages; and (iv) infrastructure and engineering choices are part of the recipe, not just an implementation detail. Rufus-Air improves over the official GLM-4.5-Air post-trained release and is competitive with similarly sized open models.', 'score': 1, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': 'd644895ce2fe2de9', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#reasoning', '#rlhf', '#alignment', '#optimization', '#training', '#agents', '#open_source', '#plp'], 'emoji': '🚀', 'ru': {'title': 'Открытый рецепт постобучения: от базовых навыков к агентам через многоэтапное обучение с подкреплением', 'desc': 'Rufus-Air представляет собой открытый и воспроизводимый рецепт постобучения для модели GLM-4.5-Air-Base, организованный в виде восьмиэтапного конвейера: SFT, Reasoning RL, Coding RL, Instruction-Following RL, General Agent, Coding Agent, Search Agent и RLHF. Авторы документируют данные, дизайн системы вознаграждения, инфраструктуру и результаты каждого этапа, необходимые для воспроизведения рецепта, используя исключительно открытые компоненты и публичные данные. Ключевые выводы показывают, что качественное SFT обучение устанавливает сильную базу возможностей, фильтрация сложности сохраняет подсказки в продуктивном диапазоне обучения, а надежность системы вознаграждения определяет оптимальный порядок этапов. Результаты демонстрируют, что инженерные решения и выбор инфраструктуры являются неотъемлемой частью рецепта постобучения, а не просто деталями реализации.'}, 'en': {'title': 'Rufus-Air: Elevating Model Performance through Structured Post-Training', 'desc': "Rufus-Air is a structured post-training approach for the GLM-4.5-Air-Base model, consisting of eight sequential stages that enhance the model's capabilities. The training process utilizes a combination of supervised fine-tuning (SFT) and reinforcement learning (RL) techniques, focusing on both hard rewards and softer, judge-based signals. Key findings highlight the importance of high-quality SFT for establishing foundational skills, the effectiveness of difficulty filtering in RL, and the significance of reward reliability in organizing training stages. This method leverages open-source resources and public datasets, resulting in a model that outperforms the original GLM-4.5-Air release and competes well with other models of similar size."}, 'zh': {'title': 'Rufus-Air：提升模型能力的开放后训练方案', 'desc': 'Rufus-Air 是一个开放且可重复的后训练方案，基于 GLM-4.5-Air-Base 模型。该方案由八个阶段组成，涵盖了从基本到高级的能力提升，使用了多样化的高质量监督微调（SFT）数据。研究表明，奖励设计和基础设施选择在训练过程中至关重要，影响模型的学习效果。Rufus-Air 在性能上优于官方版本，并与同类开源模型具有竞争力。'}}}, {'id': 'https://huggingface.co/papers/2609.28923', 'title': 'ViRDM: Taming Representation Distribution Matching for Few-Step Causal Video Generation', 'url': 'https://huggingface.co/papers/2609.28923', 'abstract': 'Abstract  Few-step autoregressive (AR) video diffusion enables low-latency streaming generation, but existing post-training methods predominantly rely on Distribution Matching Distillation (DMD), requiring both a large pretrained teacher and an online critic to estimate distributional discrepancies through diffusion scores. In this work, we ask whether this resource-intensive teacher--critic stack can be eliminated by post-training only the generator against a precomputed target distribution. Drawing inspiration from representation distribution matching (RDM) for one-step image generation, we systematically study its transfer to few-step causal video generation and identify three key barriers: a memory-intractable gradient path, a distinct video optimization regime, and representation distributions that underconstrain temporal dynamics. We introduce ViRDM, a teacher- and critic-free video post-training recipe that addresses these barriers sequentially. By coupling RDM with stochastically truncated clean-exit supervision, a lightweight VAE decoder, and staged vector--Jacobian products, ViRDM makes representation distribution matching memory-feasible for multi-step causal video rollouts. We further establish effective generated-population and initialization regimes for video RDM, and introduce lightweight dynamics regularization to compensate for the underconstrained temporal dynamics. ViRDM turns three-network distillation into generator-only post-training, reducing GPU memory use and training time while improving video quality. With only 20 generator updates, the recipe reaches 84.87 on the official VBench evaluation, outperforming the previous best few-step causal baseline by 0.36, while requiring 16 A100 GPU-hours. We additionally report exploratory results demonstrating the potential of the same recipe for lower causal sampling budget and for one-, two-, and four-step bidirectional generation.', 'score': 1, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '55f9ad27d2a3dfc6', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#architecture', '#diffusion', '#video', '#optimization', '#training'], 'emoji': '🎬', 'ru': {'title': 'Видеодиффузия без учителя: эффективное постобучение через распределение представлений', 'desc': 'Работа предлагает ViRDM — метод постобучения для видеомоделей, основанный на распределении представлений, который позволяет избежать использования дорогостоящей архитектуры учитель-критик. Авторы адаптируют подход matching представлений (RDM) с одношагового генерирования изображений на многошаговую каузальную генерацию видео, преодолевая три ключевых препятствия: сложность вычисления градиентов, особенности оптимизации видео и недостаточность информации о временной динамике. Введённый метод использует стохастическую суперверизию, лёгкий декодер VAE и оптимизированные векторно-якобианские произведения для эффективного обучения только генератора. ViRDM достигает лучших результатов при минимальных вычислительных затратах, получив 84.87 баллов на VBench всего за 20 обновлений генератора.'}, 'en': {'title': 'Streamlining Video Generation with ViRDM: Less is More!', 'desc': 'This paper presents ViRDM, a novel approach for few-step autoregressive video generation that eliminates the need for a large teacher model and an online critic. Instead of relying on Distribution Matching Distillation, ViRDM focuses on post-training the generator against a precomputed target distribution using representation distribution matching. The authors address challenges such as memory constraints and optimization regimes specific to video generation, leading to a more efficient training process. Ultimately, ViRDM achieves superior video quality with reduced resource requirements, demonstrating its effectiveness in generating high-quality videos with fewer updates.'}, 'zh': {'title': 'ViRDM：高效的视频生成后训练方法', 'desc': '本文提出了一种新的视频生成后训练方法ViRDM，旨在消除对大型预训练教师和在线评论家的依赖。通过仅对生成器进行后训练，ViRDM解决了在少步因果视频生成中遇到的三个主要障碍。该方法结合了表示分布匹配和轻量级的动态正则化，显著降低了GPU内存使用和训练时间，同时提高了视频质量。实验结果表明，ViRDM在官方评估中表现优异，超越了之前的最佳基线。'}}}, {'id': 'https://huggingface.co/papers/2609.30077', 'title': 'Rate-distortion optimization for full-reference image quality metrics via stochastic Hessian estimates', 'url': 'https://huggingface.co/papers/2609.30077', 'abstract': 'Abstract  Block-based video codecs select coding parameters based on the input by optimizing a rate-distortion trade-off. The conventional distortion choice, the sum of squared errors (SSE), simplifies parameter selection: the SSE is the sum of block-wise SSEs, so rate-distortion optimization (RDO) can treat blocks independently. Alternatively, full-reference image quality assessment (FR-IQA) metrics such as MS-SSIM or LPIPS often align better with the human visual system than SSE, but they cannot be used in-loop: they do not decompose block-wise and typically require the fully decoded image as input. Building on existing results in metric quadratization, we approximate a broad class of FR-IQA metrics by an input-dependent quadratic distortion (IDQD), whose quadratic form matrix is derived from the Hessian of the metric evaluated at the source video. To make the distortion computable block-wise, we propose two approximations of the Hessian matrix: 1) keeping the block-diagonal, and 2) keeping only its diagonal. We propose estimators for both that require only matrix-vector products with the Hessian obtained by automatic differentiation. Across five metrics for Kodak and CLIC in VVC, IDQD-RDO achieves 14.2-36.7 % BD-rate savings under the target metric with no decoder changes and incurs 10-30 % encoding complexity overhead.', 'score': 1, 'issue_id': 3331, 'pub_date': '2026-09-24', 'pub_date_card': {'ru': '24 сентября', 'en': 'September 24', 'zh': '9月24日'}, 'hash': '4d541ddf6ac05965', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#video', '#benchmark'], 'emoji': '🎬', 'ru': {'title': 'Перцептивное видеокодирование через квадратичную аппроксимацию метрик качества', 'desc': 'Исследование предлагает новый подход к оптимизации кодирования видео, заменяя традиционную метрику среднеквадратичной ошибки на более перцептивно значимые метрики качества изображения, такие как MS-SSIM и LPIPS. Авторы разработали метод аппроксимации этих метрик входозависимой квадратичной функцией потерь (IDQD), вычисляемой через матрицу Гессиана, что позволяет применять оптимизацию соотношения скорость-искажение (RDO) независимо для каждого блока. Предложены две стратегии упрощения матрицы Гессиана: сохранение блочно-диагональной структуры и сохранение только диагонали, требующие лишь матрично-векторных произведений, полученных через автоматическое дифференцирование. На тестовых наборах данных Kodak и CLIC метод IDQD-RDO демонстрирует экономию битрейта 14.2-36.7% при целевой метрике без изменения декодера, хотя и с увеличением сложности кодирования на 10-30%.'}, 'en': {'title': 'Optimizing Video Coding with Human-Centric Quality Metrics', 'desc': 'This paper discusses a new approach to optimize video coding parameters by using a more human-aligned image quality assessment method instead of the traditional sum of squared errors (SSE). The authors introduce an input-dependent quadratic distortion (IDQD) that approximates full-reference image quality metrics, allowing for block-wise optimization. They propose two methods to simplify the computation of the Hessian matrix, which is essential for their approach, making it feasible to apply in video encoding. The results show significant bitrate savings while maintaining compatibility with existing decoders, albeit with some increase in encoding complexity.'}, 'zh': {'title': '优化视频编码，提升视觉质量', 'desc': '这篇论文讨论了一种新的视频编码方法，旨在优化编码参数以提高视频质量。传统的失真选择方法使用平方误差和（SSE），但这种方法在处理时无法考虑人类视觉系统的感知。作者提出了一种输入依赖的二次失真（IDQD）近似方法，可以更好地与人类视觉系统对齐，并且能够进行块级计算。通过对Hessian矩阵的近似，IDQD-RDO在多个视频质量评估指标上实现了显著的比特率节省，同时保持了编码复杂度的可接受范围。'}}}, {'id': 'https://huggingface.co/papers/2609.28811', 'title': 'DeltaWAM: Delta World Action Models for Bimanual Manipulation', 'url': 'https://huggingface.co/papers/2609.28811', 'abstract': 'Abstract  World-action models (WAMs) transfer visual and motion priors from pretrained video generators to robot control by jointly modeling visual dynamics and actions. Existing WAMs, however, predict dense future frames during training, repeatedly modeling largely unchanged content and coupling action-conditioned dynamics to nuisance appearance variations. At inference, processing each complete observation with the heavy video expert bottlenecks few-step action generation. Accordingly, we propose DeltaWAM, which jointly predicts visual deltas and actions using dense-anchor, sparse-delta, and action streams, with three architectures that differ in representation and computation sharing. We further develop Streaming Delta Memory (SDM), which updates cached anchor context with compact observed deltas, reducing heavy video-expert processing. On RoboTwin, DeltaWAM with SDM improves average success over Fast-WAM from 81.3% to 85.4% in the clean setting and from 75.8% to 83.9% under visual randomization. The three architectures reduce training FLOPs by 17.78-23.77%, while SDM reduces one-step inference latency and FLOPs by 36.57% and 31.55%, respectively; real-world evaluations further show the highest overall success rate and normalized progress among the evaluated policies. Code: https://github.com/AIGeeksGroup/DeltaWAM. Website: https://aigeeksgroup.github.io/DeltaWAM.', 'score': 0, 'issue_id': 3331, 'pub_date': '2026-09-23', 'pub_date_card': {'ru': '23 сентября', 'en': 'September 23', 'zh': '9月23日'}, 'hash': 'ac80b49dd12084d6', 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#architecture', '#video', '#inference', '#training', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Эффективное управление роботами через предсказание визуальных изменений вместо полных кадров', 'desc': 'Статья представляет DeltaWAM — метод для управления роботами, который переносит знания из предобученных генеративных моделей видео на задачи робототехники путем совместного моделирования визуальной динамики и действий. В отличие от существующих подходов, DeltaWAM предсказывает не полные будущие кадры, а только визуальные дельты (изменения), что значительно снижает вычислительные затраты и упрощает обучение. Авторы предлагают архитектуры с раздельными потоками для якорных кадров, разреженных дельт и действий, а также вводят Streaming Delta Memory для эффективного кэширования контекста при инференсе. На бенчмарке RoboTwin метод показывает улучшение успеха контроля с 81.3% до 85.4% и снижение вычислительных затрат на 17-24% при обучении и 36.57% при инференсе.'}, 'en': {'title': 'Efficient Robot Control with DeltaWAM: Predicting Visual Deltas and Actions', 'desc': 'This paper introduces DeltaWAM, a new approach to World-action models (WAMs) that enhances robot control by predicting visual changes (deltas) alongside actions. Unlike traditional WAMs that generate dense future frames, DeltaWAM focuses on efficient computation by using a combination of dense-anchor, sparse-delta, and action streams. The method incorporates Streaming Delta Memory (SDM) to optimize processing by updating context with compact visual deltas, significantly reducing the computational load during inference. Experimental results show that DeltaWAM outperforms previous models in both success rates and efficiency, demonstrating its effectiveness in real-world applications.'}, 'zh': {'title': '提升机器人控制效率的新方法', 'desc': '本文提出了一种新的世界动作模型DeltaWAM，旨在通过联合预测视觉变化和动作来提高机器人控制的效率。与现有模型不同，DeltaWAM采用了稀疏和密集的视觉锚点，减少了对重复内容的建模，从而提高了推理速度。我们还开发了流式Delta记忆（SDM），通过更新缓存的上下文来降低视频处理的负担。实验结果表明，DeltaWAM在多个设置下的成功率显著提高，同时减少了训练和推理的计算量。'}}}];
        const articlesContainer = document.getElementById('articles-container');

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();

        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agents (8)', '#agi (1)', '#alignment (2)', '#architecture (3)', '#audio (1)', '#benchmark (8)', '#cv (1)', '#data (1)', '#dataset (3)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#multilingual', '#multimodal (3)', '#open_source (4)', '#optimization (5)', '#plp (1)', '#rag', '#reasoning (7)', '#rl (3)', '#rlhf (1)', '#robotics (3)', '#science (2)', '#security (1)', '#small_models (1)', '#story_generation', '#survey', '#synthetic (1)', '#training (8)', '#transfer_learning', '#video (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');

                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

                    ? articlesData

                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article =>

                    );

            console.log('filteredArticles', filteredArticles)

            updateUrlWithCategories();

                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-09-25 06:54',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF上传日期"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                console.log(sortingLabels)
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }
        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-09-25 06:54')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-09-25 06:54')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
